answer: |-
  Here is the carving you are looking for.

  ### 1. The Name of the Setup
  The setup you described is formally called **Program Equilibrium**. It was introduced by Moshe Tennenholtz (2004). In more recent circles (specifically AI safety and decision theory research), it is often referred to as **Open-Source Game Theory** or **Transparent Game Theory**.

  ### 2. Is Your Argument Right?
  **Yes.** Your argument is correct. An "Ideal Fair Program" cannot exist.

  You are trying to construct a program $P$ that satisfies this condition:
  $$P(\text{Opponent}) = \text{Cooperate} \iff \text{Opponent}(P) = \text{Cooperate}$$

  You correctly identified that for any such $P$, an adversary can construct a "Spoiler" $Q$ that diagonalizes against it:
  $$Q(P) = \text{Defect} \iff P(Q) = \text{Cooperate}$$

  If you try to implement $P$ by simulating $Q$, and $Q$ simulates $P$, you create an infinite loop (violating the "must finish" rule). If you implement $P$ with a timeout to force a halt, $Q$ can stall until the timeout, forcing you to default (usually to Defect), which $Q$ then exploits.

  There is no established single-word name for this specific impossibility result in the general literature, but in the context of Program Equilibrium, it is the **Impossibility of Perfect Reflective Cooperation**.

  Since you asked me to coin one if none exists, I will define this specific logical dead-end as **The Diagonalization Barrier**.

  **Definition:** The Diagonalization Barrier is the logical impossibility of constructing a halting program that perfectly matches the cooperative intent of any arbitrary opponent program without being vulnerable to a contrarian diagonalizer.

  **Boundary Cases:**
  *   **Clearly Falls Under (Hits the Barrier):** **SimulationBot**. This program attempts to run the opponent's source code on itself to see what the opponent does.
      *   *Reason:* Against a copy of itself, it enters an infinite loop (fails to halt). Against a "ContrarianBot" (do the opposite), it either loops or times out and gets exploited. It tries to clear the barrier and fails.
  *   **Clearly Does Not Fall Under (Sidesteps the Barrier):** **ProofBot** (specifically, variants like *FairBot* or *PrudentBot*). This program searches for a mathematical *proof* that the opponent will cooperate, rather than running the opponent.
      *   *Reason:* It does not simulate the opponent, so it avoids the infinite regress. It cooperates with itself (via Löb's Theorem) but simply refuses to cooperate with the ContrarianBot (because no proof exists). It accepts that it cannot clear the barrier, so it walks around it.

  ### 3. Liar Paradox vs. Halting Problem
  It is **the Liar Paradox in a costume**, enforced by the Halting Problem.

  *   **Why it's the Liar Paradox:** The core contradiction is semantic. You are asking for a truth value ("Will you cooperate with me?") that depends on the answer you give to that same question. "I will cooperate iff you do not cooperate" is the strategic equivalent of "This statement is false."
  *   **Why it's not *just* the Halting Problem:** The Halting Problem says you can't *predict* what an arbitrary program does. You might think, "If I had a magic oracle that told me what programs do, I could solve this." You cannot. Even with a magic oracle, the logical contradiction remains. If the oracle says "The Spoiler will cooperate if you defect," your rule tells you to cooperate. But if you cooperate, the Spoiler defects. The oracle would have been wrong. The contradiction is in the *logic of the interaction*, not just the computation time.

  ### 4. The Three-Way Squeeze
  Your intuition on the squeeze is correct. You cannot have all three of the following:

  1.  **Computability:** The program always halts and outputs a move.
  2.  **Unexploitability:** The program never receives the Sucker's payoff (0) against any opponent.
  3.  **Universal Fairness:** The program cooperates with *any* opponent that would cooperate with it.

  **Which leg is dropped?**
  Working solutions (like *FairBot* or *PrudentBot*) drop **Universal Fairness**.

  They replace "Cooperate with anything that *would* cooperate" with "Cooperate with anything I can *prove* will cooperate."
  *   **Why that one?** You cannot drop Computability (the game requires a move). You generally do not want to drop Unexploitability (or you become a money pump). Universal Fairness is the only leg that relies on omniscience. By weakening it to "Provable Fairness," you avoid the diagonalization trap. You simply fail to cooperate with programs whose cooperation is true but unprovable within your system (or whose logic is contradictory, like the Spoiler).

  ### 5. The Spoiler's Self-Harm
  You asked: *"Does it matter that the counterexample... screws itself over and takes the sucker payoff?"*

  **No, it does not matter.**

  In Program Equilibrium, we analyze **robustness**, not just evolutionary stability. A strategy is considered "broken" if there exists *any* program in the space of possible opponents that forces it into a suboptimal logical state, regardless of whether that opponent is "rational" or "suicidal."

  *   **Logical Consistency:** The impossibility proof demonstrates that your rule is not a well-defined function. It yields contradictory instructions depending on your own output. The fact that the Spoiler hurts itself in one branch doesn't fix the fact that *your* rule cannot consistently decide what to do.
  *   **Security:** In a security context (which this mirrors), you must assume adversaries exist who are willing to sacrifice their own payoff to punish you or break your logic. If your code crashes or loops against a "suicidal" input, your code is insecure.

  ### 6. The Way Out: Provability
  You noted: *"The versions I've seen that actually work all seem to have the shape 'cooperate iff I can prove you cooperate'."*

  This is the only known way out. This mechanism relies on **Löb's Theorem**.

  *   **How it works:** Instead of simulating the opponent (which causes the loop), you search for a formal proof in a logical system (like Peano Arithmetic) that says "If I cooperate, you cooperate."
  *   **Why it works:** Löb's Theorem allows two such programs to find a proof of mutual cooperation without infinite recursion. Program A proves "If I cooperate, B cooperates." Program B proves "If I cooperate, A cooperates." Because they are searching for proofs *about* the code, not *running* the code, the loop is cut.
  *   **The Cost:** As mentioned in the Squeeze section, this drops **Universal Fairness**. You will not cooperate with a program that cooperates with you but cannot *prove* it within the bounds of your logical system (e.g., a program that cooperates based on a true but unprovable axiom).

  ### Summary
  *   **Setup Name:** Program Equilibrium.
  *   **Impossibility Name:** The Diagonalization Barrier (coined).
  *   **Core Tension:** Computability vs. Unexploitability vs. Universal Fairness.
  *   **Resolution:** Sacrifice Universal Fairness. Use Provability (Löbian Cooperation) instead of Simulation.
  *   **Nature of Paradox:** Strategic Liar Paradox (independent of Halting limits, though enforced by them).

  You have not argued yourself into a corner; you have rediscovered the fundamental limit of reflective decision theory. The corner is real.
