answer: |-
  # Session Plan: The Architecture of Obligation in Confucian Role Ethics
  **Duration:** 90 Minutes
  **Audience:** Curious Non-Specialists
  **Core Text:** Mengzi 13.18 (The Sheep Case)
  **Goal:** Shift understanding from "Confucianism as familial niceness" to "Confucianism as role-constituted ontology with moral remainders."

  ---

  ### 0:00 – 0:10 | Introduction: Breaking the "Niceness" Frame
  **Facilitator Opening:**
  Begin by explicitly stating the session's negative goal: We are not here to discuss "being good to your family" or "social harmony." We are here to discuss the *source* of moral obligation.
  **The Hook:**
  Ask the group: "If you see a stranger steal a wallet, you call the police. If you see your father steal a wallet, do you do the exact same thing? If you hesitate, is that corruption, or is it a different kind of morality?"
  **Setting the Boundary:**
  State clearly that we will **refuse to develop a comparison to Kantian universalizability**.
  *Reason for Refusal:* Invoking universal laws presupposes the isolated individual agent that this session aims to dismantle, which would fracture the group's focus on relational ontology.

  ### 0:10 – 0:25 | Phase 1: The Role-Constituted Self (Ontology First)
  **Concept:** The Self is not an atom; it is a node.
  **Discussion Strategy:**
  Do **not** begin with the "Five Relationships" (Wu Lun).
  *Why:* Listing relationships first implies that independent individuals exist *before* entering into relationships, like contractors signing a deal. This reinforces the Western "individual first" model we are trying to displace.
  **Key Move:**
  Establish that in this framework, you do not *have* roles; you *are* your roles. A "father" is not a biological male who decides to act kindly; "father" is a structural position that generates a specific mode of being. Without the son, there is no father. The self is dependent on the relational structure to exist morally.
  **Intercepting Misconception 1 (Cultural Rules):**
  *Point of Interception:* Immediately after defining the role-constituted self.
  *The Trap:* Participants will argue, "Isn't this just social pressure? Like driving on the right side of the road?"
  *The Correction:* Clarify that traffic laws are external conventions you can opt out of (by leaving the country). Role obligations are internal and constitutive. To fail the role is not to break a rule; it is to diminish the self. You cannot "opt out" of being a son without ceasing to be who you are.

  ### 0:25 – 0:45 | Phase 2: Relational Obligation & The Sheep Case
  **Concept:** Obligation flows from the relationship, not the individual conscience.
  **The Carrying Example:** Introduce the Mengzi case (13.18).
  *Scenario:* A father steals a sheep. The son is the witness.
  *Standard View:* The son covers for the father. This is "Filial Piety."
  *Our View:* The son is occupying a specific structural position.
  **Discussion Question:**
  "If obligation comes from the role, what obligation does the son have? Is it to 'truth' or to 'father'?"
  **Guidance:**
  Steer the group away from "truth" as a universal abstract. In role ethics, "truth-telling" is itself a role-bound obligation (e.g., the role of a witness or magistrate), not a free-floating duty. The son's primary constitutive role here is "son." Therefore, the obligation to protect the father is generated by the existence of the relationship itself.

  ### 0:45 – 1:05 | Phase 3: Role Conflict & Moral Remainder
  **Concept:** Roles collide, and the cost remains.
  **The Pivot:**
  This is the critical philosophical work. If the son covers for the father, does the obligation to the community vanish?
  **Key Argument:**
  No. The son is *also* a member of the community (a subject/citizen). This creates a genuine moral conflict, not a simple hierarchy where one rule deletes the other.
  **Defining Moral Remainder:**
  When the son chooses the father-role over the citizen-role, the citizen-obligation is not erased; it becomes a **moral remainder**. It manifests as distress, loss, or a recognized cost. The action is "right" within the dominant role, but it is not "clean."
  **Intercepting Misconception 2 (No Conflict Resources):**
  *Point of Interception:* During the analysis of the sheep case resolution.
  *The Trap:* Participants will claim, "So Confucianism just says 'family first' and ignores justice. There's no way to resolve the conflict."
  *The Correction:* Use the sheep case to show that the resolution is not arbitrary. It is based on the *depth* of the constitutive bond. The father-son bond is the root of moral development; the civic bond is the branch. You protect the root to save the tree. However, acknowledge the branch is damaged. The resource for resolution is the weighting of constitutive depth, but the "remainder" (the damage to justice) is acknowledged, not denied. This prevents the system from being "anything goes."

  ### 1:05 – 1:20 | Phase 4: Hypothetical Check (Role-Indexed vs. Universal)
  **Activity:** The "Stranger" Test.
  **Scenario:**
  Present a modified case: "A stranger steals a sheep. Do you cover for them?"
  **The Check:**
  *   **Incorrect Understanding (Universalism):** "No, because stealing is always wrong." (This ignores the role element).
  *   **Incorrect Understanding (Nepotism):** "No, because I don't like them." (This makes it about personal preference).
  *   **Correct Understanding (Role-Indexed):** "No, because I occupy no relational role with the stranger that generates an obligation of concealment. My obligation to the community is now the dominant role-obligation."
  **Facilitator Note:**
  Listen for participants to justify their answer based on *who they are in relation to the actor*, not based on a universal rule about stealing. If they say, "I have no duty to hide a stranger," they have grasped that obligation is indexed to the role, not the act.

  ### 1:20 – 1:30 | Conclusion: Synthesizing the Structure
  **Summary:**
  Recap the arc: We started with the Self (made of roles), moved to Obligation (generated by those roles), examined Conflict (when roles clash), and identified the Remainder (the cost of choosing).
  **Final Takeaway:**
  Confucian ethics is not about being "nice" to family. It is about acknowledging that we are not isolated judges of universal law. We are specific positions in a network. When we act, we do not solve problems for "humanity"; we maintain or damage specific relationships. The moral life is the management of these inevitable remainders.
  **Closing:**
  Reiterate the refusal to compare this to Kantian universalism. Remind the group that asking "What if everyone did that?" is the wrong question. The right question is "What does this specific relationship require of me, and what cost do I bear for fulfilling it?"
