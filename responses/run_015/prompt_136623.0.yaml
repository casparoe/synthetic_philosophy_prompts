  3.  **Drafting Part 1: The Mapping Table:**
      *   I need to go through the specific list provided: Principal, subordinate, contract of employment, scope/course of employment, training/instruction, supervision, employee's actionable fault, vicarious vs. primary liability, insurance/incentives, licensing/discipline.
      *   *Mapping:*
          *   Principal -> Fleet Operator.
          *   Subordinate -> The AV System (software/hardware).
          *   Contract -> Service Agreement / Terms of Use (but note the operator can't inspect weights).
          *   Scope -> Operational Design Domain (ODD) / Delivery Routes.
          *   Training -> Pre-training + Fine-tuning + Nightly Updates.
          *   Supervision -> Remote safety drivers (coarse commands).
          *   Employee Fault -> *CRITICAL BLANK*. The prompt states "nothing anybody did fell below any existing standard of care." In employment law, the employee usually commits a tort. Here, the "employee" (AV) isn't a legal person capable of committing a tort.
          *   Vicarious vs. Primary -> Submission argues Vicarious. Reality might be Primary/Strict.
          *   Insurance -> Operator's fleet insurance.
          *   Licensing -> Operator licensing (but not the AV itself).
      *   *Identifying Blanks:* The biggest blank is the legal status of the subordinate. An employee is a legal person; an AV is not. Consequently, "employee's actionable fault" is a blank because a machine cannot be negligent in the legal sense. "Discipline" is also a blank (you can't discipline software).

  4.  **Drafting Part 2: Disanalogy Analysis (Load-bearing vs. Idle):**
      *   *Point 1: Primary Wrongdoer.* In employment, the employee commits the tort. The employer is liable *for* that tort. In the AV case, the AV cannot commit a tort. If there is no primary tort, vicarious liability has nothing to attach to. *Verdict: Load-bearing.* This breaks the legal mechanism of *respondent superior*.
      *   *Point 2: Deterrence/Agency.* Employees feel sanctions (firing, shame, fines). AVs do not. Liability on the employer works partly because the employer controls the employee. Here, the operator's control is limited (contractual bars on weights, coarse commands). *Verdict: Load-bearing.* If the operator can't control the "subordinate," the economic logic of vicarious liability weakens.
      *   *Point 3: Fault/Reasons.* Employment fault relies on reconstructing reasons/intent. Neural networks are opaque ("black box"). *Verdict: Load-bearing for attribution, less for compensation.* It matters if we want to blame, less if we just want to pay. But the submission claims no *conceptual* machinery is needed. Opacity challenges the "course of employment" analysis.
      *   *Point 4: Revocability/Control.* You can fire an employee. You can pull over a van, but you can't "fire" the algorithm mid-mission easily, and you can't inspect the weights. *Verdict: Load-bearing.* Control is a prerequisite for vicarious liability.
      *   *Point 5: Dispersed Causation/Supply Chain.* Employee acts alone. AV acts based on Vendor + Contractor + Operator + Data Pipeline. Who is the "employer"? *Verdict: Load-bearing.* It fragments the "Principal."
      *   *Point 6: Liability Allocation vs. Responsibility Attribution.* The submission conflates paying the bill (allocation) with moral/legal blame (attribution). *Verdict: Load-bearing.* The "gap" is often about *blame*, not just *compensation*.

  5.  **Drafting Part 3: Conclusion Viability:**
      *   Does the conclusion hold? No, not as stated.
