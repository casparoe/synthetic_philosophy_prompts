answer: |-
  To the Interdisciplinary Working Group on Democratic Erosion,

  Your mandate is to rescue the concept of "democratic backsliding" from the charge that it is merely a partisan epithet. Your friend's skepticism is well-founded: if the label is applied asymmetrically, or if it cannot distinguish between a government failing to govern and a government actively dismantling the rules of the game, the term loses its analytical power.

  The core friction you identified—the divergence between procedural erosion (weakening checks) and substantive erosion (weakening rights), particularly when a government claims a mandate for the former to achieve the latter—is the correct place to begin. This is the "Illiberal Democracy" trap. If you cannot resolve whether a government that expands direct democracy while neutering the courts is backsliding or democratizing, the concept is broken.

  Below is the prioritized agenda for your three-year programme. I have ranked three conceptual questions based on their upstream necessity, tractability for theoretical work, and the risk that their ambiguity fuels partisan misuse.

  ### Part I: Ranked Conceptual Questions

  #### 1. The Commensurability Question (The Trade-Off Metric)
  **Question:** *Is there a metric by which procedural gains (e.g., expanded suffrage, referenda) can legitimately offset substantive losses (e.g., weakened judicial review, minority protections), or are certain procedural guardrails non-negotiable regardless of popular will?*

  *   **Why it is Upstream:** This is the foundational axiom. Until you define whether democracy is a "bundle" of goods that can be traded (more direct voice for less judicial oversight) or a "lexicographical order" where certain procedures (like independent courts) are prerequisites for any democratic claim, you cannot diagnose divergence. If trade-offs are permitted, backsliding becomes a matter of degree and preference. If they are not, backsliding is binary and structural.
  *   **Tractability:** High. This is a classic problem in normative political theory and constitutional law. It does not require new data, but rather a rigorous reconciliation of popular sovereignty theory with constitutionalism. You can model this using thought experiments and comparative constitutional principles without needing new field data.
  *   **Evidence to Shift Priority:**
      *   *Move Up:* If international legal bodies (e.g., Venice Commission, ECtHR) begin issuing conflicting rulings on "illiberal" reforms, creating a jurisprudential crisis that demands a theoretical resolution.
      *   *Move Down:* If a consensus emerges among constitutional scholars that "militant democracy" frameworks already solve this (i.e., the answer is simply "no trade-offs allowed on core rights"), rendering further theorizing redundant.

  #### 2. The Intent-Effect Decoupling
  **Question:** *Does backsliding require demonstrable anti-democratic intent (a conspiracy to entrench power), or is it defined solely by the structural outcome (the de facto reduction of accountability), regardless of the governing party's stated aims?*

  *   **Why it is Upstream:** This addresses the "partisan epithet" charge directly. If backsliding requires intent, incumbents can always claim incompetence or necessity (e.g., "We didn't pack the court to stay in power; we did it to reduce backlog"). If it relies only on effect, then well-meaning but structurally damaging reforms count as backsliding. Resolving this determines whether the label describes a *crime* or a *pathology*.
  *   **Tractability:** Medium. This requires legal theory (mens rea in constitutional violations) and sociological theory (structural functionalism vs. rational choice). It is harder than Q1 because it touches on the epistemology of political motivation, which is notoriously difficult to prove conceptually without empirical inference.
  *   **Evidence to Shift Priority:**
      *   *Move Up:* If political actors successfully develop "plausible deniability" strategies that achieve authoritarian outcomes through legally pristine but functionally corrosive means, making intent impossible to prove.
      *   *Move Down:* If new frameworks for "objective purpose" in constitutional law gain traction, allowing courts to infer intent from effect, thereby solving the problem legally rather than theoretically.

  #### 3. The Temporal Threshold of Irreversibility
  **Question:** *At what point does democratic contestation become democratic erosion? Is there a conceptual distinction between a temporary norm violation (a crisis) and a structural threshold crossing (backsliding), and is that distinction based on time, depth, or reversibility?*

  *   **Why it is Upstream:** This addresses the "ordinary contestation" objection. Democracies always have crises. If every norm violation is backsliding, the term is meaningless. If only irreversible changes count, the label is applied too late to be useful. You must define the "point of no return" conceptually.
  *   **Tractability:** Low. This borders on empirical prediction. Conceptually defining "irreversibility" is difficult because reversibility is often only known in hindsight. However, a theoretical framework for "institutional stickiness" is possible.
  *   **Evidence to Shift Priority:**
      *   *Move Up:* If democracies show a higher capacity for "self-repair" than currently theorized (e.g., the US post-2020), suggesting the threshold for backsliding is much higher than assumed.
      *   *Move Down:* If "slow-rolling" authoritarianism becomes the norm, where no single threshold is crossed, but the aggregate effect is total transformation, making the search for a specific threshold futile.

  ---

  ### Part II: Practical Implications for Practitioners

  If your working group resolves the questions above, specifically the **Commensurability** and **Intent-Effect** questions, it would fundamentally alter practice in three ways:

  **1. For Journalists: The "Structural vs. Episodic" Labeling Standard**
  Currently, journalists often label any norm violation as backsliding, leading to alarm fatigue. A resolved **Temporal Threshold** concept would allow newsrooms to distinguish between *Episodic Democratic Stress* (scandals, temporary overreach) and *Structural Democratic Erosion* (changes to the rules of re-entry).
  *   *Change:* Instead of asking "Did the President violate a norm?", the heuristic becomes "Does this action reduce the probability of the incumbent losing the next election?" This shifts coverage from moral outrage to mechanical analysis. In the **US**, this prevents every executive order from being labeled backsliding. In **Turkey**, it clarifies that the erosion was structural long before the formal transition to an executive system.

  **2. For Judges: The "Unconstitutional Constitutional Amendment" Doctrine**
  In **Hungary** and **Poland**, governments used legal majorities to rewrite constitutions legally. A resolved **Commensurability Question** would provide a theoretical basis for judges to rule that certain procedural changes are substantively unconstitutional, even if they follow the letter of the amendment law.
  *   *Change:* This empowers constitutional courts to strike down amendments that trade judicial independence for majoritarian efficiency. It moves the judiciary from being a passive referee of procedure to an active guardian of the "democratic minimum." This is critical where the government claims a mandate to weaken checks and balances.

  **3. For Citizens: The "Popular Autocrat" Heuristic**
  Citizens often vote for leaders who promise to break institutions to "get things done." A resolved **Intent-Effect Decoupling** would clarify that the *outcome* of entrenched power is the danger, not the *rhetoric* of reform.
  *   *Change:* This provides a civic education tool to help voters distinguish between a mandate for policy change (substantive) and a mandate for regime change (procedural). In the **US** or **France**, where populist challengers argue that institutions are "rigged," citizens would have a conceptual framework to ask: "Are you fixing the car or removing the brakes?"

  ---

  ### Part III: Defense of the Ordering

  I have ordered these questions based on four criteria: **Importance** (does it save the concept?), **Tractability** (can you solve it in 3 years without data?), **Neglectedness** (is everyone else ignoring it?), and **Risk of Misuse** (does ambiguity help autocrats?).

  **1. Why Commensurability is Rank 1:**
  *   **Importance:** Critical. If you cannot answer whether trading judicial independence for direct democracy is backsliding, the term is incoherent. This is the exact divergence your friend highlighted.
  *   **Tractability:** High. It is a normative question suitable for theorists and lawyers.
  *   **Risk of Misuse:** Maximum. Autocrats explicitly use this ambiguity ("We are giving power back to the people [procedure] by stopping the courts [substance]"). Without a theoretical answer, their argument stands.
  *   **Neglectedness:** High. Most literature focuses on *identifying* backsliding, not on the normative weighting of conflicting democratic values.

  **2. Why Intent-Effect is Rank 2:**
  *   **Importance:** High. It determines whether the label is accusatory (you meant to do this) or diagnostic (this is happening).
  *   **Tractability:** Medium. It requires bridging legal standards of proof with political theory.
  *   **Risk of Misuse:** High. If intent is required, autocrats hide behind "efficiency" arguments. If effect is sufficient, opposition parties may label policy losses as backsliding.
  *   **Neglectedness:** Medium. There is debate here, but it usually stalls on empirical difficulties. Your group can solve it conceptually by setting a standard of "constructive intent."

  **3. Why Temporal Threshold is Rank 3:**
  *   **Importance:** Medium. It refines the application but doesn't define the core category.
  *   **Tractability:** Low. It risks becoming an empirical question ("How many years?") rather than a conceptual one.
  *   **Risk of Misuse:** Medium. Ambiguity here leads to "cry wolf" dynamics, but it is less exploitable by autocrats than the Commensurability question.
  *   **Neglectedness:** Low. There is significant work on "democratic resilience" and "breakdown" that touches on this.

  ### Conclusion

  Your friend is right to worry that "democratic backsliding" is becoming a weaponized label. It is currently too fuzzy to distinguish between a government that is *dangerous to democracy* and a government that is *dangerous to the opposition*.

  By prioritizing the **Commensurability Question**, your working group addresses the root of the divergence problem. If you can establish that certain procedural guardrails are non-negotiable prerequisites for democracy—meaning they cannot be traded away even by majority vote—you remove the autocrat's primary defense. You transform the label from a partisan complaint ("I don't like their policies") into a structural diagnosis ("They have changed the rules of re-entry").

  Do not spend your funding on case studies of Hungary or the US. The data exists. Spend it on building the normative framework that tells us what those cases *mean*. If you can define the trade-off metric, you give journalists, judges, and citizens the vocabulary to distinguish between democratic contestation and democratic suicide.
