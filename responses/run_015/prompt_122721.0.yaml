answer: |-
  **JOINT STATEMENT ON INVERTEBRATE WELFARE AND MORAL STATUS**

  **To:** The Trustees of the Foundation
  **From:** Dr. [Neuroscientist] and Dr. [Welfare Scientist]
  **Date:** 24 May 2024
  **Subject:** Consensus and Residual Disagreement Regarding Insect Welfare Funding

  Following twelve months of adversarial collaboration, we submit this document to clarify the epistemic and ethical landscape regarding the welfare of insects raised for food and feed. While we retain fundamental disagreements regarding the metaphysics of moral status, we have identified substantive common ground regarding the evidence, the limitations of current methodology, and the decision-theoretic implications of uncertainty.

  ### I. SUBSTANTIVE CLAIMS OF CONSENSUS

  We jointly affirm the following claims. These are not merely calls for more research, but specific conclusions drawn from the current state of evidence and theory.

  1.  **Limitations of Behavioural and Neural Markers**
      We agree that current behavioural markers (trade-off tests, conditioned place preference, judgement-bias measures, sensitisation-like phenomena) and pharmacological modulations (analgesic and anaesthetic responses) establish *functional complexity*, not *phenomenal consciousness*.
      *   **Agreement:** A positive result in these tests demonstrates that an organism values a state, can learn to avoid harm, and possesses mechanisms to prioritise competing drives. It does not, however, distinguish between a "philosophical zombie" architecture (unconscious valuation) and a subject that *feels* the valuation.
      *   **Implication:** No current behavioural battery can definitively settle the Threshold View's requirement for a "unified, endogenously generated representation."

  2.  **Calibration and Lineage Bias**
      We agree that the validation of all welfare markers cited above has been calibrated almost exclusively on vertebrate lineages (primarily mammals and birds).
      *   **Agreement:** Applying these markers to arthropods involves a significant extrapolation risk. Neural structures homologous to vertebrate pain matrices (e.g., nociceptors, central integration sites) exist in insects, but their topological and functional equivalence is not established.
      *   **Implication:** Negative findings in insects carry less weight than positive findings, as the absence of a vertebrate-like marker may reflect lineage divergence rather than the absence of welfare capacity. Conversely, positive findings are suggestive but not definitive proof of homology.

  3.  **The Homeostat vs. The Thermostat**
      We agree that the "household thermostat" is a misleading reference case for insect welfare, and that a "cost-incurring homeostatic agent" is the appropriate baseline for comparison.
      *   **Agreement:** A thermostat maintains a set-point determined entirely externally and incurs no cost to itself to do so. An insect maintains internal variables (e.g., hydration, energy balance) within bounds by expending metabolic resources and accepting risk (e.g., foraging under predation risk).
      *   **Implication:** Even if the Threshold View is correct, the insect is a superior candidate for threshold-crossing than a machine because it possesses an endogenous "stake" in its continued operation, evidenced by its willingness to trade off survival probability for homeostatic repair.

  4.  **Aggregation Under Uncertainty**
      We agree that for the purpose of funding decisions, the sheer magnitude of the population ($N \approx 10^{18}$ annually) interacts critically with epistemic uncertainty, even if we disagree on metaphysical aggregation.
      *   **Agreement:** If the probability ($P$) that insects cross the moral threshold is non-zero, the Expected Value ($EV$) of intervention is $P \times \text{Status} \times N$. Given the enormity of $N$, a very low $P$ can still yield a high $EV$.
      *   **Implication:** The Threshold View need not accept that moral status comes in degrees to accept that *confidence* in threshold-crossing comes in degrees. Therefore, both views support funding interventions that are robust to uncertainty (i.e., "no-regrets" measures that reduce suffering if they are sentient, and reduce waste/bio-risk if they are not).

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the specific cruxes where our views diverge. For each crux, we have formulated the position such that the proponent accepts it as accurate, identified the evidence that would bear on it, and recorded a pre-registered prediction.

  | Crux | Threshold View Formulation | Dimensional View Formulation | Agreed Evidence / Test | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Nearness to Threshold** | There is no fact of the matter about being "near" moral status. Either the capacity for unified self-representation exists or it does not. Gradualism is a confusion of *capacity* with *performance*. | Moral status is constituted by multiple capacities (nociception, integration, memory). An organism can be "near" the threshold by possessing a high degree of these capacities without meeting the binary criterion. | **Neural Integration Metrics:** Measuring information integration (e.g., $\Phi$ or proxy measures) across the insect central complex during conflicting drive states. | **Threshold:** Integration will show a phase-shift (on/off) corresponding to behavioural complexity.<br>**Dimensional:** Integration metrics will scale continuously with behavioural complexity. |
  | **2. Pain vs. Death** | The capacities making pain bad (present-valenced state) are distinct from those making death bad (loss of future-oriented projects). Insects may satisfy the former without the latter. | The badness of pain and death are correlated along the same axis of "welfare subjecthood." If an insect can suffer, it has a stake in its future, making death a harm of proportional magnitude. | **Mortality Risk Assessment:** Testing if insects modify behaviour to avoid *future* mortality risk distinct from immediate nociception (e.g., avoiding areas associated with conspecific death). | **Threshold:** Insects will show avoidance of immediate harm but no conceptual avoidance of mortality *per se*.<br>**Dimensional:** Insects will demonstrate behavioural trade-offs implying a valuation of continued existence independent of immediate pain. |
  | **3. Fragmented Agency** | If valenced states are not accessible to a single decision centre, there is no single welfare subject. There may be zero subjects, or multiple "mini-subjects" per insect, but not one. | A fragmented decision architecture reduces the *magnitude* of moral status per individual. It implies the insect is a "fraction" of a subject, or a colony is the relevant unit. | **Ganglion Independence:** Severing connections between head and thoracic ganglia to test if nociceptive processing persists locally without central modulation. | **Threshold:** Local processing confirms absence of a unified subject (welfare = 0).<br>**Dimensional:** Local processing confirms distributed welfare (welfare > 0, but structurally different). |
  | **4. Functional Duplicates** | If a silicon system reproduces the input-output profile of an insect (including trade-offs) via a different mechanism, it does not settle the question. Substrate matters for phenomenology. | If a system reproduces the functional profile (trade-offs, learning, homeostasis), it possesses the same welfare status. Substrate is irrelevant to the capacity to suffer. | **Computational Simulation:** Creating a non-biological agent that replicates insect decision-making algorithms exactly. | **Threshold:** The simulation has zero moral status regardless of behavioural fidelity.<br>**Dimensional:** The simulation has equivalent moral status to the biological insect. |

  ### III. VERBAL DISPUTES AND TERMINOLOGY

  We acknowledge that a significant portion of our prior disagreement was verbal rather than substantive, centred on the term **"Sentience."**

  *   **The Neuroscientist's Usage:** Uses "sentience" to denote *phenomenal consciousness* (the "hard problem"). On this definition, a system can process information and value outcomes without being sentient. This aligns with the Threshold View.
  *   **The Welfare Scientist's Usage:** Uses "sentience" to denote *welfare capacity* (the ability for things to go better or worse for the organism). On this definition, if a system acts *as if* it values its state, it is treated as sentient for policy purposes. This aligns with the Dimensional View.

  **Resolution:** We agree to distinguish between **P-Sentience** (Phenomenal) and **W-Sentience** (Welfare-capacity).
  *   The Threshold View argues that moral status requires P-Sentience.
  *   The Dimensional View argues that W-Sentience is sufficient for moral consideration, as P-Sentience is epistemically inaccessible.
  *   Much of our debate concerned whether W-Sentience is a reliable proxy for P-Sentience. We agree it is an imperfect proxy, but the only one available for policy.

  ### IV. RECOMMENDATION FOR FUNDING

  Given the Foundation's deed (reducing suffering where a modest sum reduces a great deal of it) and the residual disagreement outlined above, we offer the following joint recommendation:

  1.  **Fund the Programme, Conditionally:** The Expected Value calculation favours intervention. Even if the Threshold View is correct, the probability of insects crossing the threshold is non-zero. Given the population size ($N$), the potential upside of reducing suffering outweighs the cost of funding, provided the funding is directed efficiently.
  2.  **Prioritise "No-Regrets" Interventions:** Funds should be directed toward interventions that reduce suffering *if* insects are sentient, but are also beneficial *if* they are not. Examples include:
      *   Reducing the total number of insects reared (efficiency gains).
      *   Improving hygiene and disease control (reduces pathogen load regardless of sentience).
      *   Developing humane slaughter methods (e.g., rapid freezing vs. slow heat), which are low-cost regardless of moral status.
  3.  **Allocate a Portion to Crux-Resolution:** A minority of funds (e.g., 10-15%) should be ring-fenced for research specifically targeting the disagreements in Table II (e.g., neural integration metrics, fragmented agency tests). Resolving the Threshold question has high value of information for future funding cycles.

  **Conclusion:** We cannot agree on whether an insect *is* a subject of experience. We can agree that treating it *as if* it might be, given the numbers involved, is the only decision-theoretically robust path for a foundation committed to the reduction of suffering.

  **Signed:**

  _________________________
  Dr. [Neuroscientist] (Threshold View)

  _________________________
  Dr. [Welfare Scientist] (Dimensional View)
