answer: |-
  Hi everyone,

  I have been turning over the hydrologist's charts in my head since we received the entry, and trying to reconcile them with the six precedents we have set over the last four years. To get clear on where we stand, I think we need to articulate the unwritten rules we have actually been using, rather than the open-submission ideal we claim to uphold. I have drafted three candidate rules that fit our past verdicts without too much strain, and I want to walk through how they apply to this new situation before we vote.

  The first rule I would propose is what I call the Declarative Frame. Under this rule, we accept work where the entry materials or presentation method assert a context of inquiry that transcends the object's utility or origin, and we reject work where the entrant explicitly disavows artistic intent without providing an alternative conceptual structure. This rule had the easiest time with the framed sea glass, where the hobbyist's statement that he was not an artist and just found it pretty gave us a clear reason to reject based on the lack of a frame. It nearly breaks on the seventeen-year-old's invented language, because the kid had never been inside a gallery and likely did not understand he was providing a artistic frame, yet we accepted it because the display desk and lamp imposed one on his behalf. The second rule is the Ordering Principle. Here, we accept work where a human hand has imposed a system or labor-intensive process that alters the viewer's relationship to the material, and we reject work where the value resides primarily in the material's inherent quality or original utility. This rule fit the video of the erasing hands most easily, as the labor and process were the entire point of the piece. It nearly breaks on the forty factory plates, since the objects themselves were unmodified and mass-produced, though we accepted them because the grid arrangement constituted the ordering system. The third rule is the Contextual Completion. This rule states that we accept work that requires the exhibition environment to reveal its full significance or pattern, and we reject work that is self-sufficient outside the gallery or too invisible to occupy the space. This had the easiest time with the proposal to think about the exhibition daily, which we rejected because there was nothing to occupy the space at all. It nearly breaks on the rocking chair, which is a beautiful object that could activate a gallery space, but we rejected it because its meaning was complete and utilitarian before it ever entered our room.

  Running these three rules against the hydrologist's charts produces a split that tells us exactly what kind of show we want to run. Under the Declarative Frame, the charts are in trouble because the hydrologist explicitly says they are not art but work records, which mirrors the sea glass and the rocking chair rejections, though the curator's entry form attempts to supply the missing frame. Under the Ordering Principle, the charts are a strong accept, because the curator's reordering by water year imposes a system that makes the flood years leap out, transforming utility records into a visual narrative of risk and time, much like the plates or the video. Under the Contextual Completion rule, they are also a strong accept, because hung in a file they are data, but hung in the gallery they become a portrait of a river, relying on our walls to complete their meaning. Since two of the three rules lean toward acceptance based on the transformative power of the display and the ordering system, my best guess is that we will vote to accept them, and I prefer the Ordering Principle as our justification because it respects the labor of the hydrologist while acknowledging the intervention of the curator, whereas the Declarative Frame gets too bogged down in arguing about who is allowed to claim art status.

  The closest analog among our past six verdicts is the invented language by the seventeen-year-old. In both cases, we are looking at an archive of systematic, hand-made records created by someone outside the art world, presented with a specific display logic that allows a viewer to lose time in the details. The analogy gives out, however, on the question of intent and intervention. The teenager brought the work as a complete system with a desk and lamp, implying a readiness for viewing, whereas the hydrologist brought flat files of records and required the curator to reorder them by water year to unlock their visual potential. With the language, we accepted the maker's system as is, but with the charts, we are accepting a curator's edit of a non-art system, which shifts the agency significantly.

  This leads to the question of whose work it is if we accept it. If we proceed under the Ordering Principle, the work is primarily the hydrologist's, as the ink and the data are his labor, and the curator is functioning as an editor or producer similar to how we provided the lamp for the teenager. However, if we lean into the Declarative Frame, the work becomes the curator's, because the artistic act is the reframing of the documents against the maker's wishes, similar to how the statement about the plates defined the work more than the plates themselves. I believe we should attribute it to the hydrologist to remain consistent with the language piece, acknowledging the curator's role in the wall text, because treating the curator as the sole artist risks turning the hydrologist into a mere resource rather than a participant.

  By accepting these charts, we are committing ourselves to the principle that curatorial framing can confer art status on utility objects even against the maker's explicit intent, effectively privileging the viewer's experience and the gallery's context over the creator's self-identification. By rejecting them, we would be committing to the principle that maker intent is sovereign, and that an object cannot be art if the person who made it disavows that classification, regardless of how it looks on our walls. To test this distinction next year, I propose we look for a submission that would cleanly split the rules that agree here. Imagine a submission of five hundred standardised student test scores from a local school, entered by the principal. The principal states these are administrative records, not art, but she has sorted them by pencil pressure instead of score, creating a striking visual topography of student anxiety. The Ordering Principle and Contextual Completion rules would demand we accept this because the sorting reveals a hidden pattern that needs the gallery to be seen, but the Declarative Frame rule would force us to reject it because the entrant disavows art and the framing is purely administrative. That submission would tell us whether we are truly interested in the visual revelation of systems or if we still require a wink of artistic intent to open the door.

  Let me know what you think before we meet next week.

  Best,

  [Your Name]
