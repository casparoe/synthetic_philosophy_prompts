answer: |-
  1. Collapse is a rapid, persistent reduction in a society's capacity to process information and coordinate action across distinct domains, analogous to a lake's regime shift rather than a moral failure. This defines it as a loss of organizational degrees of freedom, not necessarily a loss of life or well-being.
  2. The strongest objection is Miriam's claim that this metric merely privileges elite complexity over resilient simplicity, counting the loss of bureaucracy as a disaster while ignoring that most people lived better without it. This suggests the definition smuggles in a value judgment that state-level organization is inherently superior to village-level autonomy.
  3. However, losing those dimensions reduces a population's ability to respond to large-scale shocks or coordinate resource distribution beyond the immediate kin group, which is a measurable functional loss regardless of moral preference. A village cannot manage a regional drought the same way a palace system can, making the reduction in variables a real constraint rather than just an aesthetic loss.
  4. The Late Bronze Age fits your criterion because the disappearance of Linear B records and long-distance tin trade marks a clear drop in tracked variables across the region. The Maya case also aligns, since city abandonment coincided with a verifiable cessation of calendrical accounting and regional exchange networks while rural populations persisted.
  5. Retain the word "collapse" strictly for this dimensional reduction because it identifies a specific systems failure that plain "transformation" obscures, whereas Miriam's view loses the ability to distinguish between a voluntary simplification and a forced loss of capacity. Transformation is too broad to be useful, but collapse correctly signals a threshold crossing where previous solutions are no longer available to the survivors.
