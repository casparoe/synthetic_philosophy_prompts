answer: |-
  **Setup:** 18 students. 4 pairs "Demons," 4 pairs "Preparers," 1 pair "Bank."
  **Components:** 20-card decks (L/R), tally sheets, 100 tokens.

  **Rules:**
  1.  **Work:** Demon draws a card, looks (measurement), inserts partition, takes 1 token from Bank.
  2.  **Memory:** Demon must record the outcome to validate work.
  3.  **Erasure:** End of deck, Demon erases sheet. Cost: 1 token per symbol erased (paid to Bank).
  4.  **Preparation:** Preparers build decks. Cost: 1 token per card to *set* its face (paid to Bank). Random shuffle is free.
  5.  **Compression:** Demons may write only "surprises" (outcomes contradicting known bias).

  **Timeline (75 mins):**
  *   **0–10:** Intro. Explain Szilard engine: information enables work extraction.
  *   **10–30 (Shift 1):** Bank shuffles 10L/10R (Preparer cost: 0). Demons play. They write 20 symbols. Gain 20, Erasure Cost 20. Net: 0.
  *   **30–50 (Shift 2):** Preparers spend 20 tokens to set deck to 18L/2R. Demons know bias. They write only the 2 'R's. Gain 20, Erasure Cost 2. Net: +18.
  *   **50–75:** Debrief.

  **Debrief & Physics:**
  Ask Demons: "Where did your 18-token profit come from?" Ask Preparers: "What was your loss?"
  *   **The Ledger:** Demon profit (+18) ≈ Preparer cost (-20). The system is zero-sum (allowing 2 tokens for "friction").
  *   **The Lesson:** Work extraction requires information. Information requires memory. Memory requires erasure to reset (Landauer's Principle). Erasure costs energy.
  *   **The Catch:** You only profited because the Preparers spent energy creating the order (low entropy) you exploited. The Demon doesn't violate the Second Law; it merely cashes a check written by the Preparer. The "free" work was paid for during deck preparation.

  **Predictable Failures:**
  1.  **Refusal to Write:** Demons will try to claim work without recording. *Fix:* Bank refuses payment without physical proof (tally).
  2.  **Gaming Compression:** Demons might write nothing in Shift 2. *Fix:* Rule requires writing *exceptions* to validate you actually checked.
  3.  **Token Hoarding:** Students treat tokens as points, not energy. *Fix:* Emphasize tokens are heat/work; running out means the engine stops.

  **The Limit:**
  The game cannot show *why* erasure costs energy. Cards don't thermalize; sheets don't heat up. You must state aloud: "In physics, memory is physical. Resetting a bit dissipates heat ($kT \ln 2$). Here, we tax you arbitrarily; in reality, thermodynamics taxes you inevitably." The game models the *accounting* of entropy, not the *mechanism*.
