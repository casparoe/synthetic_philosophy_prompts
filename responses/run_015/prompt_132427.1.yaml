answer: |-
  This is a sophisticated observation that cuts to the heart of a vulnerability within relational ontologies. You have identified a specific logical pathology that arises when a normative ethic of care is conflated with a descriptive ontology of being.

  To answer your primary question directly: there is no single, canonical proper noun in the philosophy of recognition or Ubuntu scholarship that exclusively names this specific circular manoeuvre. It is frequently discussed as a *risk* or a *critique* of communitarianism (often under the banner of 'exclusionary Ubuntu' or 'communitarian tyranny'), but the specific logical structure you describe—the retroactive justification of exclusion via the very theory that demands inclusion—lacks a standardized label.

  However, drawing on the distinctions you requested, we can carve this concept out precisely. I propose we term this configuration **Constitutive Retrojection**.

  Below is the conceptual carving of this phenomenon, distinguishing it from related concepts and establishing its boundary conditions.

  ### 1. Conceptual Definition: Constitutive Retrojection

  **Constitutive Retrojection** occurs when a relational ontology (which posits that personhood is *constituted* by recognition) is weaponised to argue that the *absence* of recognition proves an *antecedent incapacity* for personhood.

  It functions through a category error between the **normative** and the **descriptive**:
  *   **Normative Claim:** "One *ought* to be recognised to flourish as a person."
  *   **Descriptive Reality:** "This person is not recognised."
  *   **The Retrojective Move:** "Because this person is not recognised, they *cannot* be constituted as a person; therefore, the lack of recognition is not a moral failure of the community, but an ontological fact about the individual."

  This creates a closed logical loop: Recognition creates personhood $\rightarrow$ Personhood is absent $\rightarrow$ Therefore, the capacity for recognition was absent $\rightarrow$ Therefore, the community is not obligated to recognise. The community's failure to reach out is reinterpreted as evidence that the individual was unreachable.

  ### 2. Boundary Conditions: Honest Relationalism vs. Constitutive Retrojection

  To distinguish this fallacy from an honest application of relational theory, we must examine how each handles the **boundary condition of exclusion**.

  **Honest Relational View (Normative Ubuntu):**
  *   **Premise:** Personhood is a potentiality realised through relation.
  *   **Response to Exclusion:** Exclusion is a **moral violation**. If a prisoner is in solitary confinement, the community (or state) has failed its ontological duty. The person remains a 'person-in-potential' or a 'wounded person,' and the moral imperative is to restore the relation.
  *   **Locus of Deficit:** The deficit lies in the *community's* failure to recognise.

  **Constitutive Retrojection (Corrupted Relationalism):**
  *   **Premise:** Personhood is a status granted only upon successful relation.
  *   **Response to Exclusion:** Exclusion is an **ontological verdict**. If a prisoner is in solitary confinement, their isolation is treated as proof that they lack the requisite relational capacity.
  *   **Locus of Deficit:** The deficit is projected onto the *individual's* capacity to be recognised.

  **The Boundary Line:** The boundary is crossed when the *fact* of non-recognition is used to negate the *obligation* of recognition. An honest relationalist sees exclusion as a problem to be solved; the constitutive retrojectionist sees exclusion as a justification for the status quo.

  ### 3. Differentiation from Adjacent Concepts

  You asked how this differs from misrecognition, epistemic injustice, and social death. While overlapping, they are distinct mechanisms.

  **Vs. Misrecognition (Honneth/Taylor):**
  *   **Misrecognition** presupposes a subject who is owed recognition but is denied it, resulting in harm (disrespect, invisibility). It retains the subject's moral standing despite the denial.
  *   **Constitutive Retrojection** denies the subject's standing *because* of the denial. It does not admit a harm has been done; rather, it asserts that there was no valid subject there to be harmed in the first place. It dissolves the victim rather than injuring them.

  **Vs. Epistemic Injustice (Fricker):**
  *   **Epistemic Injustice** concerns the unfair treatment of someone *as a knower* (testimonial) or the lack of shared concepts to understand their experience (hermeneutical).
  *   **Constitutive Retrojection** is deeper; it concerns the treatment of someone *as a being*. While epistemic injustice might be the *tool* used to justify the retrojection (e.g., "they cannot speak, so they cannot relate"), the retrojection itself is an ontological demotion, not merely an epistemic one.

  **Vs. Social Death (Patterson/Agamben):**
  *   **Social Death** describes the *condition* of being excluded from the moral community (e.g., slavery, statelessness). It is a descriptive category of a state of being.
  *   **Constitutive Retrojection** is the *argumentative strategy* used to sustain social death without admitting to its violence. Social death is the *outcome*; Constitutive Retrojection is the *logic* that makes that outcome palatable to a relational ethic. It naturalises social death by claiming it reflects the 'true' ontological status of the excluded.

  ### 4. Specific Nuance in Ubuntu Scholarship

  In the context of *Ubuntu* ("Umuntu ngumuntu ngabantu"), this distinction is vital.
  *   **Normative Ubuntu:** "I am because we are" is an ethical imperative. It commands the community to include the other to make them human. It is inclusive and restorative (e.g., Truth and Reconciliation Commission ideals).
  *   **Corrupted Ubuntu (Constitutive Retrojection):** "I am because we are" becomes an exclusionary test. If 'we' do not acknowledge you, 'you' are not. This allows a community to purge 'undesirables' (the severely disabled, the criminal, the foreigner) and claim they were never truly *abantu* (people) to begin with.

  Scholars like Mogobe Ramose and Thaddeus Metz have warned against this rigidification, noting that *Ubuntu* must retain a metaphysical grounding of human dignity that precedes social validation, otherwise it becomes a tool for mob justice or majoritarian tyranny. The move you identified is precisely that tyranny: using the language of connection to enforce disconnection.

  ### 5. Summary of the Conceptual Carving

  To summarise the configuration you have identified:

  *   **Proposed Name:** **Constitutive Retrojection**.
  *   **Core Mechanism:** The conversion of a normative failure (community exclusion) into an ontological deficit (individual incapacity).
  *   **Logical Structure:** Circular. Non-recognition $\rightarrow$ No Personhood $\rightarrow$ No Obligation to Recognise.
  *   **Key Distinction:** Unlike **Misrecognition**, it denies the victim's status. Unlike **Social Death**, it provides the moral justification for the state of death. Unlike **Essentialism**, it claims to be relational while functioning essentialistically.
  *   **Diagnostic Test:** If a speaker uses relational language to argue that an excluded individual is *responsible* for their own exclusion due to a lack of relational capacity, they are engaging in Constitutive Retrojection.

  This conceptual carving isolates the specific corruption you observed: it is not merely ignoring the relational view, but hijacking its internal logic to justify the very exclusion the view was designed to prevent.
