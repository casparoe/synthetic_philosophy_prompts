answer: |-
  Here is a complete workshop plan designed to fit your 70-minute window, mixed CS/Philosophy cohort, and specific pedagogical goals.

  ### Workshop Title: "The Kiosk Catastrophe"
  **Goal:** Experience the combinatorial explosion of frame axioms and the difficulty of relevance filtering.
  **Group Size:** 22 Students (4 Teams of 5-6).
  **Mix:** Ensure each team has both CS and Philosophy students (pre-assign if possible).

  ---

  ### 1. Materials Needed
  *   **Physical Props:** 10 mugs (or cups), 20 spoons, 1 small box on wheels (the "Cart"), 1 table (Shelf A), 1 bin (Washbin), 1 door frame (marked with tape on the floor).
  *   **Game Components:**
      *   Index cards (30 per team) for writing rules.
      *   Thick markers.
      *   Whiteboard for scoring.
      *   Timer (visible to all).
  *   **Handouts:** None (keep it verbal to save time).

  ### 2. Teams and Roles
  *   **Team Alpha & Team Beta (The Architects):** Write the rule cards.
  *   **Team Gamma & Team Delta (The Runtime):** They *are* the Bot. They must follow the Architects' cards **literally**. They cannot use commonsense. If a rule doesn't cover a situation, they freeze.
  *   **Facilitator (You):** The "World." You introduce changes, cracks, and movements.
  *   **Scoring:**
      *   **Rule Cost:** -1 point per index card written.
      *   **State Violation:** -5 points per goal failure (e.g., mug on floor, cart in door).
      *   **Timeout:** -10 points if the Bot takes >30 seconds to decide an action.
      *   **Winner:** Highest score (most efficient, most robust).

  ### 3. The Rules of Engagement (Read to Students)
  1.  **The Bot is Dumb:** The Runtime Teams (Gamma/Delta) act as a CPU. They execute instructions *exactly* as written. They cannot infer intent. If a card says "Keep mug on Shelf A," and Shelf A breaks, they do not know what to do unless a card says "If Shelf A breaks..."
  2.  **Literal Interpretation:** If a rule says "Check spoons," the Bot must physically walk to the spoon bin and count. They cannot "assume" the count is the same.
  3.  **Sequential Processing:** The Bot can only process one rule card at a time.
  4.  **The World is Hostile:** The Facilitator will change the state of the world unexpectedly. The Architects cannot talk to the Bot during the round.

  ### 4. Minute-by-Minute Plan (70 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Explain the 3 Goals: 1. Mugs on Shelf A. 2. Cart out of Doorway. 3. Accurate Spoon Count. Explain the "Dumb Bot" constraint. |
  | **05-15** | **Round 1** | **Naive Planning.** Teams write 5-10 basic rules to achieve goals. Runtime executes. Facilitator makes *one* small change (e.g., moves a mug 1 inch). |
  | **15-20** | **Review 1** | Tally scores. Most teams will have state violations. Ask: "Why did you fail?" (Answer: Didn't anticipate movement). |
  | **20-35** | **Round 2** | **Patching.** Teams write *new* cards to fix failures. They can add "If/Then" or "Do Not Change" rules. Facilitator introduces *side effects* (moving cart knocks spoon) and *irrelevant changes* (light flickers). |
  | **35-40** | **Review 2** | Tally scores. Rule count will have exploded. Bots will be slow (timeout penalties). |
  | **40-45** | **The Crash** | **Chaos Round.** Facilitator introduces an exogenous event (someone "steals" a spoon). Teams have 2 mins to write emergency patches. Bots try to run. They will likely freeze or loop. |
  | **45-70** | **Debrief** | Guided discussion mapping game failures to Frame Problem theory (see below). |

  ---

  ### 5. The Debrief (Mapping Game to Theory)
  *Do not lecture immediately. Ask questions to draw the concepts out of them.*

  **1. The Explosion of Rules (10 mins)**
  *   **Ask:** "Look at your pile of index cards. Round 1 had 5 cards. Round 2 had 20. Why?"
  *   **Map to Theory:** This is the **Frame Axiom** problem. In classical logic (McCarthy & Hayes, 1969), you must explicitly state what *does not* change. "Moving the cart does not move the spoons." "Moving the cart does not change the color of the wall."
  *   **Settled View:** It is consensus that symbolic logic requires frame axioms to represent stability.
  *   **The Trap:** Students think they can just write "Nothing else changes."
  *   **Correction:** Explain that a computer cannot execute "Nothing else changes" because it must check every variable to confirm it hasn't changed.

  **2. The Relevance Problem (10 mins)**
  *   **Ask:** "In the Chaos Round, I flickered the lights. Did anyone write a rule about the lights? Why not?"
  *   **Map to Theory:** This is **Relevance**. Humans intuitively know light flickers don't affect mug positions. The Bot had to be told.
  *   **Settled vs. Contested:**
      *   *Settled:* Determining relevance is computationally expensive in symbolic systems.
      *   *Contested:* Is this a problem of *representation* (we need better logic) or *architecture* (we need neural/embodied systems)? Don't tell them one side won. Tell them this is the core debate in cognitive science (Fodor vs. Connectionists).

  **3. The "Sleeping Dog" Strategy (5 mins)**
  *   **Ask:** "Did anyone try to write a rule like 'Assume spoons stay put unless seen'?"
  *   **Map to Theory:** This is the **Sleeping Dog Strategy** (Haugeland). You assume things stay the same unless triggered.
  *   **Limitation:** How does the Bot know what *could* trigger a change? (Moving the cart *could* knock spoons, but usually doesn't).

  ---

  ### 6. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Commonsense Cheating** | Bot students "helpfully" fix a mug without a rule. | **Stop the game.** Remind them they are a CPU, not a human. If the rule isn't there, the mug stays broken. |
  | **Rule Ambiguity** | Architects write "Keep area clean." | **Reject the card.** Rules must be atomic and testable (e.g., "If Mug on Floor, Move to Shelf"). |
  | **Bottlenecking** | Too many students on one Bot team. | Assign one "Executor" per team, others are "Memory/Register" who hold the cards. |
  | **Cynicism** | "This is stupid, real AI doesn't work this way." | Acknowledge it! "Exactly. This is why we moved away from pure GOFAI (Good Old-Fashioned AI). You are feeling the pain that caused the AI Winter." |

  ---

  ### 7. Limitations of the Analogy (What you must explain)
  Be honest about where the game fails to capture the full philosophical picture.

  1.  **Probabilistic vs. Logical:** The game assumes a deterministic world (Rule A leads to Action B). Modern AI (LLMs, Robotics) uses probabilities. They don't "know" the spoon is there; they assign a 99% likelihood. This sidesteps the logical frame problem but introduces hallucination errors.
  2.  **Embodiment:** The game treats the Bot as a brain in a vat reading cards. Embodied cognition theorists (e.g., Brooks) argue intelligence emerges from interaction, not internal representation. The game cannot simulate this.
  3.  **Semantic Understanding:** The Bot in the game doesn't know what a "mug" is. Real AI struggles with this too (symbol grounding problem), but humans don't. The game highlights the *logic* gap, not the *semantic* gap.

  ---

  ### 8. Settled vs. Contested Views (Cheat Sheet for You)
  *Use this to answer questions during debrief without presenting opinion as fact.*

  *   **Settled:** The "Logical Frame Problem" is a solved engineering issue in specific domains (using tools like Situation Calculus or PDDL with default assumptions).
  *   **Settled:** Humans do not solve problems by checking infinite lists of non-changes.
  *   **Contested:** Whether the human brain uses a "language of thought" (Fodor) that has its own frame problem, or if connectionist networks avoid it entirely.
  *   **Contested:** Whether Large Language Models have "solved" relevance (they are good at it) or just masked it with statistical correlation (they fail on novel physical reasoning).

  ---

  ### 9. Summary Table

  | Phase | Minutes | Facilitator Move | Student Trap To Watch For | Which Bit Of The Problem It Shows |
  | :--- | :--- | :--- | :--- | :--- |
  | **Intro & Setup** | 00-05 | Define the 3 goals and the "Dumb Bot" constraint strictly. | Students assuming the Bot has "common sense" or perception. | **Symbol Grounding:** The bot has no concept of objects, only rules. |
  | **Round 1 (Naive)** | 05-15 | Introduce a minor state change (move mug 1 inch). | Writing rules for success conditions, not maintenance conditions. | **Qualification Problem:** You can't list every precondition for success. |
  | **Round 2 (Patching)** | 20-35 | Introduce side-effects (cart knocks spoon) + irrelevant changes (light flicker). | Writing specific "Do Not Change" rules for every object (Explosion). | **Frame Axioms:** The combinatorial cost of specifying non-change. |
  | **The Crash** | 35-40 | Exogenous event (spoon stolen). Rush them. | Trying to write a "Catch-All" rule (e.g., "Fix everything"). | **Relevance:** How to filter infinite possibilities to find the few that matter. |
  | **Debrief** | 45-70 | Map rule explosion to McCarthy/Hayes; Map relevance to Dennett. | Claiming "Modern AI solves this" without nuance. | **Architectural Debate:** Symbolic vs. Connectionist vs. Embodied solutions. |
