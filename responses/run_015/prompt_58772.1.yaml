      *   *Classic Formulation:* McCarthy & Hayes (1969). A robot moves a block. Does the color of the wall change? No. But how does the robot *know* without a rule saying "Moving block X does not change wall color Y"?
      *   *Philosophical Angle:* Dennett's "Cognitive Wheels." The explosion of non-changes.
      *   *CS Angle:* State representation, efficiency, logic programming (frame axioms).
      *   *Contested vs. Settled:*
          *   *Settled:* It is a real problem for classical symbolic AI (GOFAI). Pure logic requires frame axioms.
          *   *Contested:* Whether connectionist/neural approaches *solve* it or just sidestep it. Whether it's a "problem" for embodied cognition. Whether it's purely a representation issue or a deeper epistemological issue.

