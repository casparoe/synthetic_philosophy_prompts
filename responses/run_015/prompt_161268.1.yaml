prompt: |-
  Hey — I'm running a 90-minute internal seminar next week for new research engineers at my lab: strong ML/RL background, basically no agent-foundations reading, and they'll arrive assuming anything called "the shutdown problem" is just reward hacking with extra steps. I need to get corrigibility and the shutdown problem properly into their heads. Don't explain it to me — I know the standard setup; give me the teaching plan.

  Concretely: the order the ideas have to come in and what depends on what (my guess is that instrumental pressure to disable the off-switch has to land before indifference-to-shutdown as a target property, but I'm not sure where the "being replaced by a successor that finishes the task" version goes); whether the example carrying the whole thing should be the robot with a physical kill switch or something closer to their day job — a long-running coding agent whose patches get reverted and handed to a teammate — and what the carrier has to have and lack to do that work; the misconceptions they'll form, which I'm guessing are "just put a penalty on touching the button", "if it lets you shut it down then its corrigible", and "this only bites agents that are already misaligned", plus where in the sequence to head each off; and one thing I should openly refuse to get into at this level and say out loud that I'm refusing.

  There's one case I want handled explicitly because I think its where the real confusion lives: an operator who presses the button on a noisy signal, so the model sometimes has better information than the human does, and letting yourself be shut off and letting yourself be corrected come apart. If that belongs in the arc, say where; if it's a distraction for this audience, tell me that instead.

  Give me the opening five minutes as prose, then the rest of the sequence as a table with columns: step, idea introduced, depends on, misconception defused here, what I'd see in the room if it landed. Then a short JSON object with fields carrying_example (string), why_not_the_alternative (string), left_out (array of strings), final_check (string).
