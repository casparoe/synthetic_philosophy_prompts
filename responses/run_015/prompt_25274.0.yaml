answer: |-
  This is a fantastic pedagogical hook. The asymmetry you describe is real, deeply entrenched in American law, and philosophically fertile. It centers largely on the Supreme Court case *Bronston v. United States* (1973), which established the literal-truth defense in federal perjury prosecutions.

  Here is a reconstruction of the implicit theories of communication and assertion presupposed by this legal asymmetry, structured around your four questions.

  ### 1. The Implicit Theories of Meaning

  **The Perjury Rule (The *Bronston* Doctrine)**
  The literal-truth defense presupposes a **Semantic Minimalist** or **Formalist** theory of assertion.
  *   **Theory:** The content of an assertion is exhausted by the truth-conditional content of the sentence uttered, once indexicals are resolved. Pragmatic enrichment (implicature) is not part of the "statement" for the purposes of truth-evaluation.
  *   **View of the Speaker:** The speaker is treated as a data-output mechanism. Their responsibility is to ensure the mapping between their words and the world is isomorphic. If the map is accurate, the speaker is blameless, regardless of where they intend the listener to look on the map.
  *   **View of the Hearer:** The hearer (the questioner) bears the burden of precision. If the output is ambiguous or misleading, it is the hearer's failure to query further, not the speaker's failure to be clear.

  **The Fraud/Contract Rule (The "Reasonable Impression" Doctrine)**
  These doctrines presuppose a **Gricean Pragmatic** theory of assertion.
  *   **Theory:** The content of an assertion includes not only "what is said" but also "what is implicated" via the Cooperative Principle. Truth is evaluated against the *total communicative act*, including the inferences a reasonable hearer is invited to draw.
  *   **View of the Speaker:** The speaker is a cooperative agent who undertakes a responsibility for the *uptake* of their message. If they intentionally exploit conversational norms to induce a false belief, they have violated the norm of assertion.
  *   **View of the Hearer:** The hearer is protected by norms of reasonable reliance. They are not expected to parse language like a logician but to interpret it like a participant in a cooperative social practice.

  **Consistency?**
  On the face of it, these views are **incompatible**. One posits that meaning resides in the code (sentence); the other posits that meaning resides in the effect (speaker/hearer interaction). The legal system does not tacitly endorse a single theory of meaning; rather, it instrumentalizes different theories for different ends. It treats language as *code* when the goal is procedural integrity (perjury) and as *social action* when the goal is substantive fairness (fraud).

  ### 2. Principled Reconciliation: The Oath vs. The Relationship

  You suggest reconciling this via the nature of the oath versus the nature of a relationship. This is the standard legal justification, but does it hold philosophically?

  **The Argument:**
  Perjury is a crime against the *administration of justice*, specifically the fact-finding mechanism. The oath is a promise to answer the *question asked* truthfully. If the answer is literally true, the promise is kept. The adversarial system assumes that truth emerges from the clash of competent examiners and witnesses; if a witness is misleading, the examiner's remedy is cross-examination ("Did you meet him in a park?"), not a perjury charge.
  Fraud, conversely, is a tort/crime against *economic autonomy*. It protects the victim's right to make informed decisions. Because the victim is not an adversarial cross-examiner but a relying party, the law protects their reasonable interpretive expectations.

  **Scrutiny:**
  This reconciliation is **normatively robust but semantically unstable**.
  *   *Why it holds:* It correctly identifies that the *epistemic burden* is distributed differently in a courtroom than in a marketplace. In court, the questioner has the power and duty to pin down the witness. In a market transaction, the buyer often lacks the power to interrogate the seller's fine print or implications.
  *   *Why it fails:* It relies on an idealized view of the courtroom. In reality, witnesses are often terrified, unrepresented, and facing skilled prosecutors. To treat them as equal partners in a semantic duel (as *Bronston* does) is to ignore the power asymmetry. Furthermore, it implies that "truth" in court is a procedural artifact (did you follow the rules of questioning?) rather than a substantive correspondence (did you convey the facts?).

  So, the distinction holds up as a matter of *policy*, but it requires us to accept that "truth" is a variable concept that shifts depending on the institutional goal.

  ### 3. Swapping the Theories

  **Scenario A: Gricean Perjury Law**
  If perjury law adopted a thorough Gricean view (speaker meaning is primary):
  *   **The Change:** The witness in your example (meeting in the park) would be guilty. The "statement" would include the implicature that no meeting occurred.
  *   **Consequences:**
      1.  **Chilling Effect:** Witnesses would be terrified to speak without counsel present for every syllable. Any ambiguity could be retroactively construed as an intent to mislead.
      2.  **Prosecutorial Overreach:** Prosecutors could construct perjury cases based on subjective interpretations of what a witness "meant to convey," turning perjury into a thought crime.
      3.  **Loss of Precision:** It would reduce the incentive for lawyers to ask precise questions. If the law fixes vague answers, lawyers become lazy questioners.
  *   **Philosophical Shift:** Assertion becomes a commitment to *clarity*, not just accuracy.

  **Scenario B: Literalist Fraud Law**
  If fraud law adopted the perjury rule (sentence meaning is primary):
  *   **The Change:** A seller could say "This car has a new engine" (true, because the pistons are new, but the block is cracked) without liability.
  *   **Consequences:**
      1.  **Market Collapse:** Trust in commercial communication would evaporate. Every transaction would require exhaustive semantic auditing.
      2.  **Caveat Emptor on Steroids:** The law would assume buyers are semantic parsers capable of detecting literal truths that imply falsehoods.
      3.  **Erosion of Norms:** Grice's Maxim of Quantity (make your contribution as informative as required) would be legally unenforceable.
  *   **Philosophical Shift:** Assertion becomes a commitment to *syntax*, not *understanding*.

  ### 4. A Coherent Philosophical Position: Institutional Speech Act Theory

  Is there a position where the asymmetry is exactly right? Yes. It is a form of **Normative Pragmatics** grounded in **Institutional Facts** (drawing on Searle and Wittgenstein).

  **The Position:**
  The meaning and truth-conditions of a speech act are not intrinsic to the language or the psychology of the speaker alone; they are constituted by the **normative framework of the institution** in which the speech occurs.
  *   **In the Courtroom:** The institution is an *adversarial truth-seeking engine*. The norms of this game dictate that the "assertion" is defined narrowly to preserve the roles of the players. The witness provides raw data; the lawyer processes it. Therefore, the *commitment* undertaken by the witness is only to the literal accuracy of the data provided. To expand the commitment to implicature would blur the institutional roles.
  *   **In the Marketplace:** The institution is a *cooperative exchange system*. The norms dictate that parties rely on each other to be informative and non-deceptive. Therefore, the *commitment* undertaken by a speaker includes the reasonable inferences their words invite.

  **Why this is coherent:**
  It avoids contradiction by rejecting the idea that there is a single, context-independent definition of "assertion" or "truth." Instead, it argues that **to assert is to undertake a commitment, and the scope of that commitment is determined by the social practice.**

  **Broader View of Language and Responsibility:**
  This commits one to the view that **language is a form of life** (Wittgenstein). We do not speak in a vacuum; we speak within games that have rules.
  *   **Responsibility:** Moral and legal responsibility for speech is not fixed by the physics of sound waves or the semantics of syntax, but by the *normative expectations of the community* listening.
  *   **The Lesson for Students:** This teaches that the Gricean distinction isn't just a linguistic curiosity; it's a lever for allocating power and risk.
      *   When the law privileges **Sentence Meaning**, it privileges the **Speaker** (they can hide behind technical truth).
      *   When the law privileges **Speaker/Reasonable Meaning**, it privileges the **Hearer** (they are protected from manipulation).

  **Conclusion for the Classroom:**
  The asymmetry isn't a bug in the legal system; it's a feature of how the law manages epistemic risk. In perjury, the risk of ambiguity is placed on the questioner (the state/lawyer) because they have the power of compulsion. In fraud, the risk of ambiguity is placed on the speaker (the seller) because they have the power of information. The philosophy of language here reveals the political philosophy of the law: **Who bears the burden of clarity?**

  By examining this, your students can see that deciding "what a sentence means" is never just a linguistic analysis; it is a moral and political decision about where to place the burden of failure in communication.
