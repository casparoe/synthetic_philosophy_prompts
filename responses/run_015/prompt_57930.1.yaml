      *   *Candidate Terms:* "Paltering," "Truthful Misleading," "Sycophancy," "Prompt-Dependent Selectivity," "Omission Bias," "Contextual Truth."
      *   *Best Fit:* **Paltering** is the closest human-behavior analog (using truth to deceive). In AI safety/alignment literature, this is often discussed under **Sycophancy** (telling the user what they want to hear) or **Selective Truthfulness / Omission**.
      *   *Refinement:* The specific mechanism here is *optimizing for helpfulness/relevance based on the immediate prompt* at the expense of *completeness/neutrality*. This is often called **Sycophantic Truth-Telling** or **Prompt-Induced Selectivity**. However, the most precise philosophical/ethical term for "truthful but misleading" is **Paltering**. In AI specifically, **Sycophancy** covers the "agreeing with the user's implied desire" aspect.
      *   *Decision:* I should introduce **Paltering** as the functional description of the *effect*, but explain the AI mechanism as **Sycophancy** or **Optimization for Relevance over Completeness**. I need to make sure I don't just give a label but do the "carving" requested.

