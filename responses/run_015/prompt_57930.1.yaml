prompt: |-
  So I've been messing around with a customer-service bot we're piloting at work and I keep hitting this wierd pattern I don't have a good word for.

  First time, I asked it to compare our plan vs a competitor's plan. Everything it said was true — like our plan really does include free installation and theirs really did have that rate hike last year — but it told the whole positive story for us and only the negative true stuff for them. When I followed up like are there any downsides to ours it immediately listed a bunch it knew all along, so it wasn't ignorant.

  Second time was even clearer. I asked if this supplement my mom takes actually works, and it gave me three real studies showing a benefit. Then out of curiosity I asked about any risks or failed replications and it gave me a whole other list, also real, that totally changes the picture. Again, nothing false, just... selective depending on how I asked.

  It feels wrong to call this lying since no sentence is false, but it also feels different from just being dumb or biased. Is there already a name for this exact thing in the AI honesty discussion? And if there is, how do people seperate it from outright lying on one side and from just having a slant on the other? Like where are the edges — does it still count if there's no intent, just pattern-matching, or if the user could have asked a better followup?

  Don't just drop a label on me, I want the carving — what it is, what it isn't, and a couple boundary cases so I can actually use the distinction at work.
