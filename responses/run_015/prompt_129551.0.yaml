answer: |-
  Imagine a sealed, climate-controlled grain silo teeming with ten billion weevils, where biological research suggests consciousness is possible but unlikely for any single individual. The silo's ecosystem is critically overcrowded, meaning each additional weevil exponentially increases competition-induced starvation and stress for every other weevil, driving the average expected welfare per insect deeply negative. A scale-sensitive expected-value calculator looks at the low probability of sentience multiplied by the astronomical population and the skyrocketing suffering-per-head due to density, concluding that the total expected suffering is so vast that the only rational move is to fumigate immediately, killing the entire colony to prevent a future of agonizing scarcity. Meanwhile, a high-threshold deontologist argues that since we lack >50% confidence that any specific weevil is insentient, we must presume moral status and forbid the killing, regardless of the aggregate misery predicted by the math.

  Here's the breakdown: the expected-value (EV) view is doing the heavy lifting on the "scale argument," but it's using that scale to justify harm rather than protection. It calculates total moral weight as Probability × Population × Intensity. Because the "Intensity" of suffering isn't fixed but scales negatively with population size (the hidden feature), the astronomical $N$ turns a small probability into an astronomical amount of expected pain, making culling the only way to minimize total suffering. The deontological view ignores the aggregation; it looks at the individual weevil, sees the uncertainty falls below the >50% confidence threshold for *denying* status (interpreting the threshold precautionarily), and vetoes the action as a rights violation.

  The exact structural feature doing the work is **density-dependent welfare scaling**. If you remove this feature—say, by assuming the silo has infinite resources so crowding doesn't increase suffering—the calculation flips. Without that scaling, individual lives are likely net-positive or neutral, so the astronomical $N$ multiplied by low probability still yields a huge expected *value* of existence, forcing the EV view to say "protect them" just like we'd intuitively expect. A defender of the standard scale argument would attack this case by rejecting the density-dependent premise, arguing that consciousness is binary and additive, not a divisible resource that dilutes with crowding; they'd say you can't trade off the certainty of death now against the probability of suffering later just because the population is high, insisting that the "astronomical numbers" should always amplify protection, not justify culling.
