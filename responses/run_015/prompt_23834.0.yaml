answer: |-
  You have put your finger on the most vexing consequence of the view, and I do not wish to minimize it. It is the classic objection to epiphenomenalism: if the mind is a shadow that casts no shadow of its own, how do we manage to speak about it? But consider the structure of supervenience. The pain quale supervenes on a neural state N. That neural state N is causally sufficient for your utterance "this hurts." Because the supervenience relation is one of necessity—given the physical base, the mental property *must* occur—the utterance caused by N will invariably coincide with the presence of the quale. The reliability of your report is not grounded in a causal chain originating *from* the quale, but in the lawful covariation between the quale and its physical realizer. It is not a coincidence, because the physical cause of your report guarantees the existence of the qualia it reports.

  However, I must be clear about what this saves, and what it sacrifices. It saves the truth of your report, but it does not save the causal efficacy of the feeling itself. The feeling is still a passenger, not a driver. You ask what makes the report reliable rather than lucky; the answer is the supervenience base. But this leaves us with the stark reality that the intrinsic quality of the pain—the "hurtfulness" itself—contributes nothing to the production of the report beyond what the neural state already does. We retain an epistemology of mind, but we lose its ontology as a causal force. This is the "something near enough" I speak of: we save physicalism, and we save most of mental causation via functional reduction, but the intrinsic residue of experience remains causally isolated, known to us only because it rides on the back of the physical machinery that does the work.
