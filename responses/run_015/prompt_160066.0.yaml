prompt: |-
  I help run a volunteer open-source project — around 3,000 members, everything governed by one mutable document — and for the last couple of years anyone can propose a change to it as a plain-text diff, which passes if it gets whatever the document currently says it needs (usually 2/3 of active members). The twist, and the reason I'm writing: the rules about how rules change are inside the document too, so they get changed as well, and we keep ending up in situations where nobody can tell what the document now says. Last month someone passed, under the old 2/3 rule, an amendment requiring unanimity for all future amendments — and then couldn't get a single typo fix through, with half the group arguing the unanimity rule is void because it was enacted by a procedure it itself declares inadequate, and the other half saying that's just what amending the amendment rule means. A month earlier a cleanup motion passed by simple majority that deleted every rule containing the word restrict, which took out a clause labelled permanent, amendable only by 4/5, and also deleted the sentence defining active member, so we're not even sure who was entitled to vote on it. And we currently have two precedence clauses in force: an older one saying the section it sits in overrides anything added later, and a newer one saying the most recently added rule wins. Apparently there's some game and maybe a philosophy literature about this (Nomic?) but I've never read any of it, and I don't want references or a reading list — I can't look anything up and neither can my moderators, so everything has to be in the procedure itself.

  What I want is a review procedure my moderation team can actually run: the ordered set of tests to apply to any proposed diff before it goes to a vote, what counts as a satisfactory answer to each test, which tests end in a flat reject as malformed, and which ones hand the decision to a human because it's a values call rather than a question of fact. Realistic constraints: rotating volunteers with no logic or law background, about fifteen minutes per proposal, and the output is a few sentences of justification in the thread. Please keep it honest about where a step is doing real work and where it's just forcing us to write down a choice we'd otherwise make silently. The failure modes I'd want it to cover, because these are the ones that keep biting us: rule identity — we number rules and amend them in place, so after a diff is it rule 17 or rule 17-prime, and when is a change so extensive that it's really a repeal-and-replace, and why should we care; priority and precedence conflicts, including clauses that claim precedence over later or earlier rules; entrenchment, i.e. whether a clause saying this cannot be amended or only by 4/5 is genuinely binding or is just text an ordinary majority can delete; self-consuming and self-modifying rules, like sunsets, one-shot rules, and rules that rewrite themselves when triggered; definitional feedback, where a rule changes what counts as a member, a quorum, a majority, or a valid rule at all; and irreversibility — deletes, merges and redefinitions that destroy information, where we couldn't get back to the prior state even if everyone agreed they wanted to (we do have git history, so this isn't about losing the text, it's about whether the community can actually return to a prior normative state). Then say plainly what the procedure cannot settle even in principle.

  Please also run it on three live-ish proposals so I can see how it behaves. First: a proposal that redefines active member to include people who have only read the forum in the last 90 days, and wants those people counted toward the quorum for the vote on that very proposal. Second: a contributors' rights section stating it may only be amended by a 4/5 vote, with no change to the amendment rule itself — I'm personally in favour of this one and assume it's fine, so if your procedure says it does nothing like what we think it does, say that straight and don't soften it; that's the answer I most need. Third: a spam emergency rule banning one specific tactic that deletes itself after thirty days, plus a seperate housekeeping rule saying any rule unchanged for two years is automatically repealed — which, as far as I can tell, would eventually eat the amendment rule itself. If any of these should be split into two proposals or rewritten rather than rejected, show me the rewrite; and if the honest answer in some case is this is a decision about who has power, not a decision about drafting, tell me that too, because I'd rather know that than pretend the checklist settled it.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure:

  1.  **Analyze the User's Request:**

      *   **Context:** A volunteer open-source project (~3,000 members) governed by a single mutable document (a "constitution" or "charter").
      *   **Current State:** Chaos. Rules about changing rules are inside the document. Recent history includes a unanimity amendment passed by 2/3 (causing gridlock), a majority cleanup that deleted "permanent" clauses and definitions (causing ambiguity), and conflicting precedence clauses (old vs. new).
      *   **Constraint:** No external references (no Nomic reading lists, no legal theory). Everything must be self-contained in the procedure.
      *   **Task:** Create a *review procedure* for the moderation team to apply to proposed diffs *before* they go to a vote.
      *   **Constraints on Procedure:**
          *   Rotating volunteers (no logic/law background).
          *   ~15 minutes per proposal.
          *   Output: A few sentences of justification in the thread.
          *   Must distinguish between factual tests (reject if failed) and values calls (hand to humans).
          *   Must be honest about where the procedure is just formalizing silent choices.
      *   **Specific Failure Modes to Cover:** Rule identity (amend vs. replace), Priority/Precedence, Entrenchment (can a rule bind the future?), Self-consuming/modifying rules, Definitional feedback (changing who votes), Irreversibility (loss of normative state).
      *   **Requirement:** Run the procedure on three specific live proposals (Redefining "active member", Entrenched contributors' rights, Spam emergency + auto-repeal).
      *   **Tone:** Honest, practical, direct. No fluff. Acknowledge limits.

  2.  **Deconstruct the Problem (The "Nomic" Trap):**

      *   The core issue is *self-reference* and *paradox*. If the rules define how rules change, and those rules change, you get infinite regress or contradiction (e.g., Rule A says "Change requires 2/3", Rule B says "Change requires Unanimity", Rule B was passed by 2/3).
      *   The user admits they can't look up legal theory. They need a *heuristic* that stabilizes the system without solving the philosophical paradoxes (because those are unsolvable without an external anchor).
      *   *Key Insight:* To stop the chaos, the review procedure itself must act as the "external anchor" or at least a "stable kernel." However, the user says "everything has to be in the procedure itself." This is a catch-22. If the review procedure is part of the mutable document, it can be changed. If it's *outside* the document (a meta-rule for mods), it needs authority.
      *   *Decision:* I must design this as a *Meta-Procedure* that the moderators agree to follow *outside* the mutable document, or as a "Level 0" rule that is treated as immutable for the sake of operation. Given the prompt ("I help run... I want is a review procedure my moderation team can actually run"), I will frame this as a *Moderator Protocol* that exists *alongside* the document, governing the *process* of submission, not the *content* of the law. It acts as a gatekeeper.
      *   *Crucial Limitation:* I must explicitly state that this procedure cannot resolve *validity* disputes (e.g., "Is the unanimity rule valid?"). It can only resolve *clarity* and *procedural integrity* disputes. It forces the community to see the contradiction before voting, rather than after.

  3.  **Drafting the Review Procedure (The "Gatekeeper Protocol"):**

      *   *Goal:* 15 minutes, non-experts. Needs to be a checklist.
      *   *Step 1: Identity & Scope.* Is this an amendment or a repeal/replace? Why? (Prevents hiding major changes in minor diffs).
      *   *Step 2: Definitional Integrity.* Does this change who votes/quorum *for this vote*? (Prevents self-validating coups).
      *   *Step 3: Entrenchment Check.* Does this claim to be unchangeable or harder to change? (Flags the "binding the future" problem).
      *   *Step 4: Precedence & Conflict.* Does this contradict existing text? Which rule wins? (Forces explicit hierarchy).
      *   *Step 5: Irreversibility.* Does this delete a definition needed to understand the result? (Prevents "delete 'active member' while voting").
      *   *Step 6: The "Human Call".* Where do we stop? When the text is clear but the *consequence* is a power grab.

      *Refining the Steps for Volunteers:*
      *   Make them Yes/No questions.
      *   Define "Reject" vs. "Flag for Community Awareness."
      *   Acknowledge that the procedure *cannot* decide if a rule is *valid*, only if it is *intelligible*.

  4.  **Addressing the Specific Failure Modes:**

      *   *Rule Identity:* Require a "Change Type" declaration in the proposal header.
      *   *Precedence:* Require a "Conflict Statement."
      *   *Entrenchment:* Flag any change to voting thresholds or "permanent" labels.
      *   *Definitional Feedback:* The "Self-Reference Test."
      *   *Irreversibility:* The "Reconstruction Test."

  5.  **Running the Three Test Cases:**

      *   *Case 1 (Active Member/Quorum):* This is a classic self-referential loop. If passed, it validates itself.
          *   *Procedure Result:* Flag/Reject. It changes the electorate *for the vote itself*. This is a "Values Call" but dangerously close to a procedural coup.
      *   *Case 2 (Entrenched Rights):* User thinks it's fine.
          *   *Procedure Result:* Flag. It claims to bind the future. The procedure must admit it *cannot* guarantee this binding. It's a "Promise," not a "Lock." The community needs to know a future majority can ignore it.
      *   *Case 3 (Spam + Auto-Repeal):*
          *   *Spam Rule:* Self-deleting. Fine.
          *   *Auto-Repeal:* "Unchanged for 2 years repealed."
          *   *Conflict:* If the Amendment Rule is unchanged for 2 years, does it die?
          *   *Procedure Result:* Flag as "Existential Risk." Requires split. The auto-repeal needs an exemption list.

  6.  **Refining the Output:**

      *   *Tone Check:* Is it too academic? Needs to be operational.
      *   *Honesty Check:* Do I admit where the checklist is just theater? Yes, specifically on entrenchment.
      *   *Constraint Check:* 15 minutes? The checklist needs to be short.
      *   *The "Meta" Problem:* I need to tell the user that *this* procedure needs to be adopted as a "Level 0" norm by the mods, otherwise it's just another mutable rule.

  7.  **Final Polish (Self-Correction during drafting):**

      *   *Correction:* I initially thought about telling them to fix the precedence clauses. But the prompt asks for a *review procedure for new proposals*, not a fix for the existing constitution. I must stick to the prompt. The procedure must handle *incoming* diffs given the *current* mess.
      *   *Correction on Case 2:* The user wants honesty. If I say "This is fine," I'm lying. A 4/5 clause is just text until someone violates it. I need to explain that the procedure flags it as "Unenforceable Promise."
      *   *Correction on Case 1:* This is the most dangerous. The procedure should likely recommend *splitting* the vote or requiring the *current* definition of active member to validate the vote.

  8.  **Structure of the Response:**
      1.  **The Protocol:** The actual checklist (The "Gatekeeper").
      2.  **The Limitations:** What this cannot do (The "Honesty Section").
      3.  **The Test Runs:** Applying the protocol to the three cases.
      4.  **Implementation Advice:** How to make this stick without legal authority.

  9.  *(Final thought on the "Level 0" issue)*: The user says "everything has to be in the procedure itself." This implies the review procedure *is* part of the governance. If so, it can be changed. I must warn them that if this review procedure is mutable, it can be bypassed. I will advise them to treat it as a "Moderator Covenant" separate from the "Member Constitution" if possible, or at least a high-threshold rule. *Wait, re-reading:* "everything has to be in the procedure itself" refers to *references* (no looking up Nomic). It means "don't tell me to read a book." It doesn't necessarily mean the review procedure must be in the mutable document. I will frame it as a Moderator Standard Operating Procedure (SOP).

      *Actually, looking closer:* "I want is a review procedure my moderation team can actually run... everything has to be in the procedure itself." This likely means the *logic* must be self-contained, not dependent on external law. I will treat it as a Mod SOP.

      *Wait, one more nuance:* "The rules about how rules change are inside the document too." The user wants to stop the chaos. If the Mod SOP is not in the document, where does its authority come from? From the admins/mods. I need to be clear that *mods* enforce this *before* voting.

      *Okay, let's build the "Pre-Vote Integrity Check".*

      *(Self-Correction on Case 2)*: The user says "I'm personally in favour... assume it's fine." I need to be very firm here. If the amendment rule says 2/3, and this says 4/5, and this passes by 2/3... is it binding? Legally/Logically: No. Philosophically: Maybe. Practically: It's a Schelling Point. I need to tell the user the procedure *cannot* make it binding, only *label* it.

      *(Self-Correction on Case 3)*: The auto-repeal eating the amendment rule. This is a "Time Bomb." The procedure must catch "Systemic Dependencies."

      *Let's write.*
answer: |-
  Here is a review procedure designed for your constraints. It is not a legal framework; it is a **Pre-Vote Integrity Check**. It is designed to be run by volunteers in 15 minutes. It does not solve the philosophical paradoxes of your system (because they are unsolvable without an external anchor), but it forces them into the light before a vote happens.

  ### The Pre-Vote Integrity Check (PVIC)

  **Purpose:** To ensure a proposal is intelligible, self-consistent, and clearly describes its own impact *before* it consumes community time.
  **Authority:** This checklist is enforced by Moderators. If a proposal fails a "Hard Stop," it is returned to the author for rewrite. If it triggers a "Community Flag," it proceeds to vote but must carry a warning label.
  **Time Limit:** 15 minutes per proposal.

  #### Step 1: The Identity Test (Rule Continuity)
  **Question:** Does this diff modify an existing rule number, or does it effectively delete the old rule and create a new one?
  **Criterion:** If more than 50% of the text of a numbered rule is changed, or if the *purpose* of the rule changes (e.g., Rule 5 was about "Voting," now it is about "Funding"), it is a **Repeal-and-Replace**.
  **Action:**
  *   **Amendment:** Keep the rule number.
  *   **Repeal-and-Replace:** Mark the old rule as "Repealed" and assign a new number.
  *   **Hard Stop:** If the diff claims to be an Amendment but functions as a Replace, reject.
  *   **Why:** You need to know if you are fixing a car or swapping the engine. Mixing the two destroys history and precedence tracking.

  #### Step 2: The Self-Reference Test (Definitional Feedback)
  **Question:** Does this proposal change a definition (e.g., "Active Member," "Quorum," "Valid Vote") that is required to validate the vote *on this very proposal*?
  **Criterion:** Compare the definition *before* the diff and *after* the diff.
  **Action:**
  *   **Pass:** If the definition changes only for *future* votes.
  *   **Community Flag:** If the definition changes apply to the *current* vote.
  *   **Warning Label:** "This proposal changes the rules of the game while the game is being played. Validity depends on whether you accept the new rules immediately."
  *   **Why:** This prevents a "self-validating coup." It doesn't stop the vote, but it forces the voters to acknowledge the paradox.

  #### Step 3: The Entrenchment Test (Binding the Future)
  **Question:** Does this proposal claim to be unchangeable, permanent, or require a higher threshold (e.g., 4/5) than the current Amendment Rule allows (e.g., 2/3)?
  **Criterion:** Search for keywords: "permanent," "unanimity," "4/5," "cannot be amended."
  **Action:**
  *   **Community Flag:** Any claim of entrenchment.
  *   **Warning Label:** "This rule claims it is harder to change than the current Constitution allows. A future majority may ignore this claim. This is a promise, not a lock."
  *   **Why:** Honesty. In a mutable system, a rule cannot legally bind a future sovereign majority unless the *Amendment Rule itself* is changed first. This distinguishes between a *strong norm* and a *procedural impossibility*.

  #### Step 4: The Precedence Test (Conflict Detection)
  **Question:** Does this text contradict an existing rule, specifically regarding which rule wins in a conflict?
  **Criterion:** Look for existing "Precedence" or "Supremacy" clauses.
  **Action:**
  *   **Hard Stop:** If the proposal creates a direct contradiction (Rule A says X, Rule B says Not-X) without explicitly stating which rule is repealed or superseded.
  *   **Requirement:** The proposal must explicitly state: "This rule supersedes Rule [X]" or "Rule [X] is repealed."
  *   **Why:** Your system currently has two conflicting precedence clauses. You cannot add a third without explicitly resolving the conflict. Silence is not allowed.

  #### Step 5: The Reconstruction Test (Irreversibility)
  **Question:** If this proposal passes, could we revert to the exact prior state using only the text remaining after the vote?
  **Criterion:** Check for deletions of definitions, cross-references, or procedural mechanisms required to undo the change.
  **Action:**
  *   **Community Flag:** If a definition (e.g., "Active Member") is deleted or altered such that the prior state cannot be reconstructed without external archives (Git).
  *   **Warning Label:** "This change destroys normative information. Reverting requires manual reconstruction, not just a reverse vote."
  *   **Why:** Git saves the *text*, but not the *authority*. If you delete the definition of who can vote, you can't hold a vote to restore it.

  #### Step 6: The Human Call (Values vs. Facts)
  **Question:** If all tests pass, is there still a gut feeling that this concentrates power or removes accountability?
  **Action:**
  *   **Moderator Discretion:** If two or more moderators agree the proposal shifts power dynamics significantly (even if syntactically valid), add a **Power Shift Notice**.
  *   **Notice:** "This proposal centralizes/decouples authority. This is a values decision, not a procedural one."
  *   **Why:** Some things are technically valid but politically dangerous. The checklist admits it cannot judge values, so it forces the moderators to own the warning.

  ***

  ### What This Procedure Cannot Settle

  You asked for honesty about limits. This procedure **cannot** resolve the following, even in principle:

  1.  **The Validity Paradox:** If a rule passes by 2/3 saying "All future rules need 100%," this procedure will Flag it, but it cannot tell you if the 100% rule is valid. That is a political question, not a procedural one. The procedure only ensures everyone knows they are voting on a paradox.
  2.  **The Source of Authority:** This checklist relies on Moderators enforcing it. If the Moderators are overruled by a mob, the checklist is paper. It stabilizes the system only as long as the community respects the Moderators' gatekeeping role.
  3.  **Semantic Drift:** If a rule says "Restrictions are bad" and someone deletes the word "Restrictions," the checklist catches the deletion (Reconstruction Test), but it cannot stop the community from deciding that "Constraints" now means the same thing.

  ***

  ### Live Proposal Simulations

  Here is how the PVIC handles your three live cases.

  #### Case 1: The "Active Member" Redefinition
  **Proposal:** Redefines "Active Member" to include forum readers (90 days). Counts them toward quorum *for this vote*.
  **PVIC Run:**
  *   **Step 1 (Identity):** Amendment. Pass.
  *   **Step 2 (Self-Reference):** **FAIL.** The definition of "Active Member" determines the Quorum for the current vote.
  *   **Step 5 (Reconstruction):** **FLAG.** If the old definition is overwritten, you cannot easily revert to the old electorate without the old text.
  *   **Outcome:** **Community Flag + Warning Label.**
  *   **Required Label:** "This proposal changes the electorate for the vote on this proposal. If passed, it validates itself. If rejected, the prior definition stands. Reverting this later requires the new definition of 'Active Member'."
  *   **Recommendation:** **Split the Proposal.**
      *   *Part A:* Change the definition of "Active Member" (passes by current rules).
      *   *Part B:* Apply new definition to future votes (passes by *new* rules).
      *   *Reasoning:* Do not allow a vote to expand its own legitimacy. Make them win the vote under the *old* rules first.

  #### Case 2: The Entrenched Contributors' Rights
  **Proposal:** New section, amendable only by 4/5 vote. Current Amendment Rule says 2/3.
  **PVIC Run:**
  *   **Step 1 (Identity):** New Rule. Pass.
  *   **Step 3 (Entrenchment):** **FLAG.** Claims 4/5 threshold. Current constitution says 2/3.
  *   **Outcome:** **Community Flag + Warning Label.**
  *   **Required Label:** "This rule claims a 4/5 threshold, but the Constitution currently requires only 2/3 to amend rules. A future 2/3 majority can legally override this 4/5 claim. This is a political promise, not a procedural lock."
  *   **Honest Answer:** You assumed this was fine. **It is not.** It creates a false sense of security. If a future angry majority wants to remove these rights, they will amend the threshold back to 2/3 (or ignore the 4/5 claim) and remove the rights.
  *   **Recommendation:** To make this "stick," you must amend the **General Amendment Rule** first to say "Except for Section X, which requires 4/5." If you just put the 4/5 clause inside Section X, it is legally weak in a mutable system. The procedure forces you to admit this weakness to the voters.

  #### Case 3: Spam Emergency + Auto-Repeal
  **Proposal:** (A) Ban specific spam tactic, self-delete after 30 days. (B) Any rule unchanged for 2 years is automatically repealed.
  **PVIC Run:**
  *   **Part A (Spam):**
      *   **Step 1:** New Rule (Temporary). Pass.
      *   **Step 5:** Pass (Self-deletion is reversible by re-enacting).
      *   **Outcome:** **Accept.**
  *   **Part B (Auto-Repeal):**
      *   **Step 4 (Precedence):** **FAIL.** Conflicts with "Permanent" clauses and potentially the Amendment Rule itself.
      *   **Step 5 (Reconstruction):** **FLAG.** If the Amendment Rule is unchanged for 2 years, does it repeal itself? If so, how do you make new rules?
      *   **Outcome:** **Hard Stop (Malformed).**
      *   **Reasoning:** This creates a "Systemic Dependency" failure. If the Amendment Rule dies, the project loses the ability to govern.
      *   **Recommendation:** **Rewrite Required.** The Auto-Repeal rule must have an **Exemption List**.
      *   *Rewrite:* "Any rule unchanged for 2 years is repealed, EXCEPT: Section 1 (Definitions), Section 2 (Amendments), Section 3 (Moderation)."
      *   *Why:* You must explicitly protect the kernel of the system from the cleanup script. This is not a drafting nuance; it is an existential safeguard.

  ### Implementation Advice

  1.  **Adopt the PVIC as a "Level 0" Norm:** Do not put this checklist in the mutable document if you can avoid it. Make it a **Moderator Covenant**. If it is in the document, someone will propose a diff to "simplify the review process" (i.e., delete it). If it must be in the document, it needs to be in a section that requires a higher threshold to change (see Case 2 warning).
  2.  **The "Warning Label" is the Product:** Your moderators are not judges; they are labelers. Their job is not to stop "bad" ideas, but to ensure "dangerous" ideas are clearly marked. The community can vote to jump off a cliff, but the moderators must ensure the sign says "Cliff."
  3.  **Force the Split:** In Case 1 and Case 3, the procedure recommends splitting. Make this a standard moderator power. "This proposal contains two distinct logical operations. Please submit as two diffs." This slows down rapid-fire chaos.
  4.  **Accept the Paradox:** When Case 2 comes to a vote, and people argue "Is the 4/5 binding?", the moderators should not answer. The PVIC label *is* the answer. The label says "It is not binding." If the community votes for it anyway, they are voting for a *norm*, not a *rule*. Distinguish the two in your communications.

  This procedure will not fix your past contradictions. It will not tell you if the Unanimity Rule is valid. It will simply ensure that the next contradiction is written in bold text, signed by the author, and flagged by a moderator before it burns the house down.
