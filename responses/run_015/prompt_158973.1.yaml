prompt: |-
  hey — I'm a data scientist. Most of my day is A/B tests and trying to salvage causal estimates from observational data: potential outcomes notation, DAGs, do-calculus, backdoor and front-door adjustment, IVs with monotonicity and exclusion restriction, mediation, interference and SUTVA violations, negative controls and placebo tests, sensitivity analysis, the estimand-vs-estimator distinction. All of that is working vocabulary for me, dont explain it.

  What I want: take the big development-economics fight about why some countries are rich and others aren't — the institutions camp, the geography camp, and the culture / "national character" camp — and restate each position in my vocabulary as faithfully as you can. For each one: what DAG is it asserting, which node is the treatment, what is the estimand, and what identification strategy are its defenders implicitly committed to (what instrument or natural experiment would have to exist for that claim to be identified at all). Don't quietly relabel my assumptions as translation, and don't just conclude "everything is confounded" — I want the actual mapping, including the moves people make when they reach for things like historical settler mortality as an instrument or border-partition comparisons as a discontinuity.

  Two wrinkles I keep coming back to, and I want them handled explicitly rather than gestured at:

  1. Leakage. The usual measures of institutional quality are coded partly off how rich and stable a country looks, so the treatment variable is built partly out of the outcome. In my world that's label leakage and it's a bug you fix by construction. Here it looks like it can't be fixed even in principle. What does an estimand mean when the treatment measure is contaminated by the outcome?

  2. Unit constitution. Institutions arguably partly constitute which country you're dealing with, so Y_i(1) and Y_i(0) may not be outcomes of the same unit — if you changed institutions deeply enough, the thing you're measuring wouldn't be that country anymore. Is there any expression for that in my vocabulary, or is it just sloppy unit definition that a better protocol fixes?

  Then the residue report. Which parts of the fight translate cleanly, which only with distortion, which have no counterpart at all. I'm especially interested in the "we only get one history" problem: n = number of countries, treatment assigned once at some critical juncture, no reruns, no fresh randomization. The closest thing in my day job is definately terrible power, but that doesn't feel like the real issue — is the real issue that the counterfactual is not well-defined rather than imprecisely measured? And is the question people actually care about, "should a poor country try to import good institutions", even an estimand, or has the debate quietly changed topic somewhere between the descriptive claim and the policy claim?

  Last thing, and be blunt: is there anything in my vocabulary that's actively misleading me here, the way assuming SUTVA or stable units would mislead me? Is the residual "culture" explanation structurally like a latent confounder I can only ever assume away, or is it more like the irreducible error term in a model I keep adding features to?
