answer: |-
  Mara: Let's return to the definition of democracy as the most natural form of government. If we take Spinoza's metaphysics seriously, the right of the state is nothing other than the power of the multitude aggregated together. My claim is that this aggregation is purely quantitative. The transition from the state of nature to the civil state doesn't require the multitude to suddenly become philosophers; it only requires that their individual strivings, their conatus, are aligned structurally. When Spinoza recommends large councils and rotation in office, he isn't trying to filter out passion to find reason hidden underneath. He is designing a mechanism where conflicting passions cancel each other out, leaving a stable resultant vector of power. The democracy is absolute precisely because it accepts the citizens as they are—governed largely by inadequate ideas—and harnesses that affective power without demanding a qualitative transformation of their minds.

  Elias: But that resultant vector you describe is inherently unstable if it lacks rational orientation. You're treating power as if it were static, but for Spinoza, power is the capacity to persevere. A multitude driven solely by fluctuating passions—hope, fear, envy—might aggregate significant force momentarily, but it lacks the internal coherence to sustain itself. When Spinoza discusses institutional constraints, like restricting eligibility for office based on property or requiring secret ballots, he isn't just balancing affects; he is creating conditions where adequate ideas have a better chance of prevailing. If the collective mind is not oriented by common notions, it isn't a sovereign body; it's a mob. And a mob, by definition, acts against its own long-term interest, thereby diminishing its own power and right. So, the democratic form only satisfies the requirement of sovereignty if it functionally approximates rational governance, which implies some reliance on those capable of adequate ideas to guide the structure.

  Mara: You're smuggling in a qualitative requirement that Spinoza explicitly avoids. If sovereignty depends on the presence of adequate ideas, then democracy collapses into aristocracy, because adequate ideas are, by Spinoza's own admission, rare. If only the rational can truly sustain the state's right, then the multitude is merely a vessel for the rational few, and we're back to the rule of the wise. But Spinoza insists democracy is the absolute form because it minimizes the alienation of natural right. Everyone transfers their power to the community, but since the community is everyone, no one is truly subject to another. If you require rational unanimity or even rational guidance as a condition for legitimacy, you violate this fundamental equality. The institutions manage conflict not by producing reason, but by preventing any single inadequate idea—any single tyrannical passion—from monopolizing the collective conatus. Stability comes from the equilibrium of passions, not their sublation into reason.

  Elias: I'm not suggesting the multitude must be fully rational, but that the institutions must be designed to simulate the effects of reason. Consider the distinction between acting from passion and acting from reason. Passion divides; reason unites through common notions. If the democratic assembly is to avoid tearing itself apart, its procedures must encourage decisions that align with utility and preservation, which are the markers of rational action. When Spinoza limits what the sovereign can decree—for instance, laws that cannot be enforced without great indignation—he is acknowledging that the sovereign's power is limited by the rational capacity of the subjects to obey. Therefore, the sovereign must legislate within the bounds of what is reasonably acceptable. This isn't aristocracy; it's a recognition that the power of the state is bounded by the rational limits of human nature. Without institutional mechanisms that privilege deliberation and filter out immediate reactive affects, the democracy loses the power that constitutes its right.

  Mara: But that boundary you mention isn't a constraint imposed by elites; it's a physical limit on power itself. If the multitude revolts, the state loses power, and thus loses right. That's a mechanistic fact, not a normative requirement for reason. You're conflating the cause of stability with the condition of legitimacy. For me, the legitimacy of the democracy rests on the fact that it is the collective expression of natural power, regardless of whether that power is reasoned or passionate. The large councils work because they make it difficult for any specific faction to dominate, not because they magically produce common notions. If you insist that the state's right depends on the quality of the ideas guiding it, you make sovereignty contingent on something external to the actual distribution of power. You're saying the multitude only has right when it thinks correctly. But Spinoza says the multitude has right because it has power. Period.

  Elias: And I'm saying that for Spinoza, true power is the power to persevere in being. A state that acts on inadequate ideas is acting against its own conatus, leading to internal conflict and eventual dissolution. Therefore, a state that fails to orient itself toward reason is, by Spinoza's metric, failing to maximize its power. The institutional recommendations aren't just about preventing tyranny; they are about cultivating an environment where common notions can emerge from the interaction of citizens. If you treat the democracy as merely an aggregation of irrational forces, you ignore Spinoza's claim that freedom is the recognition of necessity. The democratic state is only free, and thus only truly sovereign, if its laws reflect the rational necessities of social life. If the councils are just arenas for clashing passions without a structural bias toward rational deliberation, they produce impotence, not power. The "aristocracy of reason" isn't a hidden elite ruling over the people; it's the structural requirement that the people's decisions must be compatible with rational preservation to count as effective sovereignty.

  Mara: That structural requirement is where we diverge. You see the institutional bias toward deliberation as a proxy for reason; I see it as a proxy for time. Slowing down decision-making allows passions to cool, but it doesn't make them adequate. The issue is whether the democratic form is redundant if reason is the true sovereign. If the state's right is contingent on rational outcomes, then the form of government matters less than the content of the laws. But Spinoza argues democracy is the most absolute form specifically because it aligns the structure of command with the structure of power distribution. If you argue that the democracy is only valid when it behaves rationally, you are judging the form by an external standard. I'm arguing the form is the standard. The aggregation of inadequate ideas, if properly structured, creates a stable whole without requiring the parts to become adequate. The whole becomes rational enough to survive, even if the parts remain passionate.

  Elias: But can the whole be rational if the parts are not? That's the metaphysical crux. If the collective conatus is just the sum of individual strivings, and those strivings are determined by external causes—which is what inadequate ideas are—then the state is entirely at the mercy of fortune. Spinoza wants a state that is free, meaning determined by its own nature. That requires internal causation, which requires adequate ideas. If the citizens are governed by inadequate ideas, the state is governed by external causes. Therefore, for the state to be sovereign in the full sense, there must be a mechanism within the democracy that generates adequate ideas collectively. The councils aren't just time-delays; they are epistemic filters. Without them, you don't have a state determined by its own nature; you have a crowd determined by circumstance. That's not sovereignty; that's slavery to passion. So, the democratic form is not redundant, but it is empty without the rational content that ensures its self-determination.

  Mara: Then you're defining sovereignty as moral perfection rather than political reality. Spinoza is a realist. He knows the multitude is irrational. His project is to show how they can live together safely despite that. If you require the state to be determined by its own nature in the strict metaphysical sense, no state can ever exist. The sovereignty we have is the sovereignty we can achieve: the balancing of external causes through institutional counter-forces. The democracy is absolute not because it achieves freedom from passion, but because it distributes the burden of passion across the whole body, making the state resilient to the fluctuations of any single part. You want the state to be a free man; I'm saying the state is a composite body that survives by managing its internal conflicts, not by resolving them into unity of reason.

  Elias: And I'm saying that without that unity of reason, however approximate, the internal conflicts will eventually become fatal. Managing conflict is not the same as resolving the cause of conflict. If the laws are not grounded in common notions, they will be experienced as external constraints, generating indignation. Once indignation spreads, the power of the state collapses. So, the rational orientation isn't a moral ideal; it's a functional necessity for the power equation to hold. You can't have the power without the reason, because the reason is what sustains the power over time.

  \answer{The irreconcilable point is whether Spinoza defines democratic sovereignty procedurally as the aggregation of natural power regardless of the cognitive quality of the multitude, or substantively as the capacity to generate rational stability necessary for the state's perseverance.}
