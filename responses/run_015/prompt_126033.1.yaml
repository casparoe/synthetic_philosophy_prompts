prompt: |-
  In debates over the French Revolution, commentators frequently reach for the myth of Saturn devouring his children to explain how revolutions consume their own architects—Robespierre executed by the guillotine he had deployed, the Girondins destroyed by the political dynamics they helped unleash, and the Terror collapsing into Thermidor. The analogy is typically used to license a darker conclusion: that revolutionary violence carries an inherent, almost cyclical logic of self-cannibalization that makes the devouring inevitable. Audit this mapping precisely. Provide a correspondence table—what plays the role of Saturn, the children, the devouring act, and the mythic inevitability—then show where the analogy fractures. Specifically, does it smuggle in a teleological or cyclical philosophy of history that treats the Terror as structurally predetermined rather than as the result of contingent political choices made between 1793 and 1794? And does the conclusion—that revolutions necessarily turn on their creators—survive once you disentangle the mythic narrative from the actual interplay of class conflict, ideological escalation, and situational contingency that historians debate? In your answer, clearly separate what is broadly settled about the Revolution's trajectory from what remains genuinely contested among specialists—particularly regarding whether class struggle, ideology, or pure contingency best explains the slide into Terror and its termination—and avoid presenting any one of those interpretive frameworks as the settled consensus.
