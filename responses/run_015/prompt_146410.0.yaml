      Forcing you to leave home negates that statement.
      So, strictly speaking, the New Proposal violates 2017 *unless* the "Decline" box is considered equivalent to "Staying Home."
      Is "Ticking Decline" equivalent to "Staying Home"?
      Argument: No. One is visible engagement, one is invisible absence.
      Argument: Yes. Both register non-support.
