      *Recommendation:* To be consistent with 2017, they should probably reject the *compulsion of presence*, OR they must accept that the checkbox satisfies the 2017 concern.
      *However*, 2024 (Accessibility) says "If we ask compliance, make it easy." This implies compliance *can* be asked.
