answer: |-
  ### The Diagnosis

  Your theory is correct. The fault line is **Individual vs. Steady-State Accounting**, but in philosophical terms, this is the **Non-Identity Problem** applied to ecology.

  *   **The Vegan (Individual Accountant):** Operates on a deontological framework regarding the *act*. Killing the cow is a specific moral violation against a specific subject with a biography. The mouse's death is tragic but incidental; the cow's death is intentional. She counts *corpses*.
  *   **The Beef-Eater (Steady-State Accountant):** Operates on a utilitarian framework regarding the *system*. She sees the land as a container with a fixed capacity for suffering and life ("carrying capacity"). If a lentil field replaces a pasture, the "mouse slot" doesn't vanish; the mouse dies, and another is born to die in the harvester. She believes she is minimizing the *turnover rate of suffering*. She counts *throughput*.
  *   **The Mediator (Marginal Accountant):** The "marginal hectare" point is **not** changing the subject; it is the only economically rigorous point. It asks: *Does my specific purchase change the outcome?*
      *   If the Vegan buys lentils, the farmer harvests the whole field regardless; the mice die anyway.
      *   If the Beef-Eater buys beef, does that specific purchase keep a pasture open?
      *   **Why it fails in the scene:** It turns a moral tragedy into a spreadsheet. It's intellectually sound but emotionally vacuous. It tells the characters *how* to calculate, but not *what to value*.

  ### Why Nothing Will Move It

  This argument is irresolvable because they are not arguing about **facts** (they agree on the numbers); they are arguing about **moral ontology**.

  1.  **Wildness vs. Control:** The Vegan believes human intervention should be minimized to reduce harm. The Beef-Eater believes human intervention is inevitable, so it should be *honest* and *regenerative*.
  2.  **The Value of Existence:** The Vegan implicitly argues that the cow's life is worth more than the mouse's (or that killing the cow is worse). The Beef-Eater argues that the *ecosystem's* ability to support life is worth more than the individual cow's survival.
  3.  **The Tragedy:** Both are right, and both are complicit. To eat is to kill. The Vegan tries to minimize her *agency* in the killing. The Beef-Eater tries to minimize the *total volume* of killing.

  **To move the scene:** You cannot solve the math. You have to expose the grief. The argument stops being about who is right and starts being about who is more willing to admit they are wrong. The breakthrough isn't a measurement; it's an admission of guilt.

  ### The Line

  The Beef-Eater needs a line that acknowledges the death she causes but reframes it as a sacrifice for the larger system, directly addressing your "Steady-State" theory without using jargon.

  **"You're trying to keep your hands clean of the funeral. I'm trying to stop the eviction."**

  *(Why this works: It acknowledges the Vegan's focus on the specific death ["the funeral"] while asserting the Beef-Eater's focus on the habitat loss/displacement ["the eviction"]. It implies the Vegan is prioritizing her own innocence over the land's capacity to hold life.)*

  **Alternative (if you want to hit the "Steady State" harder):**
  **"To you, that mouse is a tragedy. To me, it's a turnover. The real crime isn't the death; it's the land that can't support the life anymore."**

  **Alternative (if you want to hit the "Marginal" point):**
  **"He's right about the margin. But I'd rather be responsible for one death I chose than a thousand I pretended didn't happen."**
