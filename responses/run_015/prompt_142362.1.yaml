answer: |-
  You have independently rediscovered two of the foundational pillars of chaos theory. What you are seeing is not a bug in your simulator; it is the defining signature of a chaotic system. You are observing the difference between *deterministic* unpredictability and *statistical* predictability.

  Here are the names, the boundaries, and the confidence levels you asked for.

  ### 1. The "Fixed Chunk of Time" Rule
  **Name:** The **Lyapunov Time** (derived from the **Maximal Lyapunov Exponent**).

  **What it is:**
  You noticed that adding a decimal place of precision doesn't give you $10\times$ the prediction time; it gives you a fixed *addition* to the time (e.g., "one extra decimal place buys me 5 more seconds").

  This is the mathematical fingerprint of **exponential divergence**. In a chaotic system, the error $\epsilon$ between two nearby trajectories grows like this:
  $$ \epsilon(t) \approx \epsilon_0 \cdot e^{\lambda t} $$
  Where $\epsilon_0$ is your starting error and $\lambda$ is the Lyapunov exponent.

  If you want to know how long ($t$) you can predict before the error gets too big, you solve for $t$:
  $$ t \approx \frac{1}{\lambda} \ln\left(\frac{\text{Threshold}}{\epsilon_0}\right) $$

  Notice the $\ln(\epsilon_0)$? That is a logarithm. Because the error grows *exponentially*, your ability to predict only grows *logarithmically* with precision.
  *   **Linear expectation:** $10\times$ precision $\rightarrow$ $10\times$ time.
  *   **Chaotic reality:** $10\times$ precision $\rightarrow$ $+ \text{Constant}$ time.

  That "fixed chunk of time" you noticed is literally $\frac{\ln(10)}{\lambda}$. Physicists call this the **Lyapunov Time**. It is the time horizon beyond which the system forgets its initial conditions.

  **Is it your simulator?**
  If the time gain were proportional to precision (linear), your simulator would be *too* stable (non-chaotic). If the time gain were random, it would be numerical noise. The fact that it is a "fixed chunk" per decimal place confirms you are simulating genuine mathematical chaos.

  ### 2. The "Blob" That Settles
  **Name:** Convergence to an **Invariant Measure** (on a **Strange Attractor** or **Energy Surface**).

  **What it is:**
  You ran hundreds of copies (an **ensemble**) and watched them spread. They stopped spreading and formed a stable shape.
  *   **The Spreading:** This is the same chaos as above. Nearby points repel each other.
  *   **The Stopping:** The system is **bounded**. The pendulum can't spin infinitely fast (energy is conserved or limited) and it can't leave the screen.
  *   **The Shape:** Even though you don't know *where* a single pendulum is, you know exactly *where it is likely to be*. The probability distribution of the blob becomes stationary.

  **The Two Kinds of Prediction:**
  You asked for names for the prediction types. In meteorology and dynamical systems, this is often called the **Weather vs. Climate** distinction (coined by Edward Lorenz, the father of chaos theory).

  1.  **Trajectory Prediction (Weather):** "Where will *this specific* pendulum be at $t=60$?"
      *   **Status:** Dies after the Lyapunov Time.
      *   **Why:** Sensitive dependence on initial conditions.
  2.  **Statistical Prediction (Climate):** "What is the *probability* the pendulum is in the bottom half at $t=60$?"
      *   **Status:** Survives indefinitely.
      *   **Why:** The system is ergodic; it visits all accessible states with a fixed frequency over time. The "shape" of the blob is the **Invariant Measure**.

  **A Critical Distinction (Conservative vs. Dissipative):**
  There is a nuance here depending on your code.
  *   **If your sim has friction (Dissipative):** The blob will shrink and settle onto a specific fractal line called a **Strange Attractor**. The system loses energy and finds a "favorite" way to move.
  *   **If your sim has NO friction (Conservative/Hamiltonian):** The blob will *not* shrink. It will spread out until it fills the entire "energy shell" (all possible positions allowed by conservation of energy) and then stop growing simply because there is no more room. This is called **Phase Space Mixing**. The "shape" is the region of accessible phase space.
  *   *Most double pendulum sims are frictionless.* If your blob fills a region and stays there, you are seeing **Ergodic Mixing**. If it shrinks onto a thin, complex structure, you have **Damping**.

  ### Summary of Names
  *   **The Rule:** Logarithmic Predictability Horizon (governed by the Lyapunov Exponent).
  *   **The Dying Prediction:** Deterministic Trajectory Forecasting.
  *   **The Surviving Prediction:** Statistical / Ensemble Forecasting (Invariant Measure).
  *   **The Phenomenon:** Chaos (specifically, Mixing on a Bounded Manifold).

  ---

  ### Confidence and Falsifiability

  **Confidence Level: Very High (95%+)**
  I am confident because what you describe is the textbook definition of Hamiltonian Chaos (if frictionless) or Dissipative Chaos (if damped). The "logarithmic gain from precision" is the mathematical necessary consequence of exponential error growth, which is the definition of chaos.

  **What Would Change My Mind (The "Costumes" Test):**
  You asked how to know if this is one thing wearing two costumes or two genuinely different things. Here is how you test it:

  **Test 1: The Step-Size Check (Simulator Artifact)**
  *   **Hypothesis:** The "fixed chunk" is just your laptop's floating-point math breaking.
  *   **Test:** Change the simulation "time step" (dt). Make it 10x smaller.
  *   **Result:** If the Lyapunov time changes significantly, your simulator is numerically unstable (artifact). If the Lyapunov time stays the same (within reason), it is physical chaos.
  *   **Why:** Real physics doesn't care about your computer's refresh rate. Bad code does.

  **Test 2: The Friction Check (Attractor vs. Energy Shell)**
  *   **Hypothesis:** The "blob shape" is just the screen boundaries.
  *   **Test:** Add a tiny amount of friction (damping) to your code.
  *   **Result:**
      *   If the blob *shrinks* onto a complex, wispy shape: You have a **Strange Attractor**. The "surviving prediction" is about the attractor's geometry.
      *   If the blob *collapses* to a single point (hanging still): The system is too damped to be chaotic.
      *   If you remove friction and the blob *fills a volume* uniformly: You are seeing **Ergodic Mixing**. The "surviving prediction" is about the Conservation of Energy.
  *   **Why:** This tells you if your statistical stability comes from energy conservation (Hamiltonian) or attraction (Dissipative). They are mathematically distinct, though they look similar to the eye.

  **Test 3: The Precision Wall**
  *   **Hypothesis:** The "fixed chunk" rule holds forever.
  *   **Test:** Try to gain 20 decimal places of precision.
  *   **Result:** Eventually, you will hit a wall where more precision buys *no* time.
  *   **Why:** This would prove it *is* a simulator limitation eventually (floating point limits), but up until that wall, the physics is real.

  ### Final Verdict
  You are not looking at one thing wearing two costumes. You are looking at the two faces of Chaos:
  1.  **Microscopic Instability** (Lyapunov): Individual paths diverge exponentially.
  2.  **Macroscopic Stability** (Invariant Measure): The collective statistics converge.

  This is exactly why we can't predict the weather in 3 weeks (Trajectory), but we can predict that next July will be hotter than January (Climate/Statistics). You have built a machine that demonstrates the limit of human knowledge. That is a winning science fair project if you frame it correctly.
