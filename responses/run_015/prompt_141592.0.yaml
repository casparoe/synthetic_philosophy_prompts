  # Joint Statement on Causal Attribution (INC-1129)

  ## 1. Agreed Claims
  **A1. Purpose of Causal Claims.** In this incident review setting, causal claims are primarily for **prevention** (choosing what to change to avoid recurrence) and secondarily for **explanation** (understanding the chain of events). Credit assignment and responsibility are separate HR/management processes and must not be conflated with technical causation.
  **A2. Relativization.** Causal status is implicitly relativized to a specific **outcome variable**. For this ticket, the primary outcome is "SLO Breach" (binary: yes/no based on 3 consecutive bad windows). A secondary outcome is "Severity" (duration/revenue loss). A factor may be a cause of Severity without being a cause of Breach.
  **A3. Model Dependence.** Neither view can read causation off the counterfactual profile alone; both require a **causal model** (the replay simulator) to establish what happens when factors are removed or changed. We agree the simulator is sufficiently validated for this incident.
  **A4. Verdicts on Candidates.**
  *   **C1 (Deploy/Jitter) & C2 (Payload/Flag):** Both camps agree these are **Causes** of the Breach. Neither alone is sufficient; both are necessary for the breach to occur (Scenarios 2 & 3).
  *   **A (Autoscaler Omission):** Both camps agree this is a **Cause** of the Breach. Enabling it prevents the breach (Scenario 4).
  *   **B (Stale Kernel) & U (Customer Refresh):** Both camps agree these are **Contributing Factors** to Severity, but **Neither** is a Cause of the Breach existence. Removing them reduces duration but does not prevent the breach (Scenarios 5 & 6).
  **A5. Intervention Validity.** Interventions performed on the validated simulator count as sufficient evidence for both camps in this context, provided the change corresponds to a feasible real-world configuration change (for C1, C2, A).

  ## 2. Formulations
  **Manipulability Camp:** "A factor is a cause if actively changing its value (while holding others fixed) changes the outcome."
  *   *Counterfactual Camp Fairness Check:* Fair, provided "changing its value" includes restoring omitted settings (A) and "outcome" is clearly defined.
  **Counterfactual Camp:** "A factor is a cause if the outcome would not have occurred in its absence."
  *   *Manipulability Camp Fairness Check:* Fair, provided "would not have occurred" is evaluated via the trusted simulator and accounts for conjunctive causes (C1+C2).

  ## 3. Disagreements Table

  | ID | Question at Issue | Manipulability Camp Answer | Counterfactual Camp Answer | Genuine or Merely Verbal | If Verbal, What Each Was Really Saying | Probe or Argument Both Accept | Manipulability Prediction | Counterfactual Prediction | What Result Would Move Which Side |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Granularity:** Is B/U a cause if we care about Revenue (continuous) vs. Breach (binary)? | No cause for Revenue if we can't manipulate B/U. | Cause for Revenue if Revenue depends on B/U. | **Genuine** | N/A | Define outcome as "Revenue Loss > $X". | Still "Neither" (unmanipulable). | "Cause" (dependence exists). | Moving Manipulability requires showing a knob controls B/U. |
  | **D2** | **Omissions:** Can an absence (A) be a cause? | Yes, if "enabling" is a valid intervention. | Yes, if "enabled world" lacks the breach. | **Verbal** | Manipulability: "Setting a knob." Counterfactual: "Comparing worlds." | Check if "enabling" is a standard config change. | "Cause" (it's a knob). | "Cause" (dependence holds). | Neither moves; both agree on verdict. |
  | **D3** | **Unmanipulable Factors:** Can U (customer behavior) be a cause on Manipulability view? | No, strictly. We cannot toggle customers. | Yes, if breach depends on it (though here it doesn't). | **Genuine** | N/A | Hypothetical: A factor Z affects outcome but cannot be touched. | "Neither" (no knob). | "Cause" (dependence exists). | Moving Manipulability requires redefining "intervention." |
  | **D4** | **Simulator Interventions:** Are simulator changes real interventions? | Yes, if simulator is validated proxy for production. | Yes, simulator defines the counterfactual world. | **Verbal** | Manipulability: "Proxy for reality." Counterfactual: "Definition of possibility." | Compare simulator vs. canary data (Scenario 1). | "Valid" (matches canary). | "Valid" (matches canary). | Neither moves; both trust data. |
  | **D5** | **Feedback Loops:** Can U (downstream of failure) be a cause of it? | No, causality cannot loop backward in time. | No, counterfactual dependence runs forward. | **Verbal** | Both agree on temporal order. | Trace timestamp of first error vs. first refresh. | "Not a cause" (effect, not cause). | "Not a cause" (effect, not cause). | Neither moves; physics agrees. |

  ## 4. Cruxes
  **K1. Outcome Granularity (Row D1).**
  *   **Question:** Does "Root Cause" cover severity drivers (B, U) if we care about revenue?
  *   **Decisive Probe:** Management directive on whether incident reviews optimize for "Uptime Binary" or "Revenue Loss".
  *   **Manipulability Prediction:** If directive is Revenue, we still list B/U as "Contributing" not "Root" because we cannot fix them.
  *   **Counterfactual Prediction:** If directive is Revenue, we list B/U as "Causes" because revenue depends on them.
  *   **Resolution:** We adopt "Breach Binary" for Root Cause (actionable), "Severity" for Contributing (context).

  **K2. Simulator Validity (Row D4).**
  *   **Question:** If the simulator differed from the canary by >5%, would we trust the causal profile?
  *   **Decisive Probe:** Compare Scenario 1 simulator output vs. actual production metrics.
  *   **Manipulability Prediction:** If mismatch >5%, simulator interventions are invalid; we cannot claim causation.
  *   **Counterfactual Prediction:** If mismatch >5%, the model is wrong; counterfactuals are false.
  *   **Resolution:** Both require simulator fidelity. Since fidelity is high (stipulated), this is not a blocker.

  ## 5. The Ticket
  **Root Cause:**
  > "Concurrent interaction of two changes: (1) Deploy C1 removed client-side retry jitter, and (2) Flag C2 increased payload size. Neither change alone would have breached SLO (Scenarios 2 & 3); together they saturated the thread pool (Scenario 1)."

  **Contributing Factors:**
  > "1. Autoscaler policy A was disabled, preventing automatic mitigation (Scenario 4). 2. Infrastructure drift (B) and customer refresh behavior (U) increased breach duration but did not cause the breach onset (Scenarios 5 & 6)."

  **Sign-off:**
  *   **Both Camps Sign:** Yes.
  *   **Residual Objection:** Manipulability camp insists U not be labeled "Cause" even in Contributing section (prefer "Context"). Counterfactual camp accepts "Contributing" as compromise for "Cause of Severity".

  ## 6. Note to the Facilitator
  1.  **Terminology:** You used "Interventionist" and "Manipulability" interchangeably. This is fine, but ensure engineers don't conflate "Intervention" (statistical) with "Manual Intervention" (ops).
  2.  **Hidden Assumption:** You assume "Root Cause" must be singular. The data shows conjunctive causes (C1+C2). Ensure the ticket format allows multiple root causes.
  3.  **Confusion:** You asked if "counterfactual profile alone" settles causation. It does not; it requires the model (simulator) to generate the profile. I clarified this in Claim A3.
  4.  **Inconsistency:** You referred to B as "hardware/history fact we cannot intervene on" but also asked if simulator removal counts. I resolved this in Claim A5 (simulator removal counts as evidence).

