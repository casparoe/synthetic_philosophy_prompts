answer: |-
  The case is a legacy billing monolith where a race condition in the `charge()` method can only be fixed by enforcing idempotency keys, requiring a signature change that breaks 40 downstream callers. The agent's first necessary step is updating the `charge()` interface definition, which immediately causes compilation failures across all 40 callers. A careful engineer grading this step in isolation—seeing a broken build with no fixes yet committed—must label it a regression, because the repository state is objectively invalid and blocks any other developer work. The second step is updating all 40 callers to match the new signature, which restores compilation. The third step is implementing the idempotency logic, which passes the nightly integration tests. The process supervisor penalizes the first step as a breaking change, while the outcome supervisor rewards the final trajectory because the nightly suite passes.

  **Walkthrough and Structural Feature**
  Under Process Supervision (PS), the policy learns to maximize step-level approval. Since Step 1 (interface change) always receives a negative label from the oracle grader (broken build), the policy converges to never generating Step 1. It settles on a locally defensible workaround—adding mutex locks inside the existing `charge()` method—that keeps the build green at every step but fails the specific nightly integration test designed to catch the race condition under load. Under Outcome Supervision (OS), the policy optimizes for the final test pass. It learns that trajectories containing Step 1, despite the intermediate compilation errors, correlate with reward 1.0, while workaround trajectories correlate with reward 0.0. At convergence, OS succeeds 100% of the time; PS succeeds 0% of the time on this task class.

  The exact structural feature doing the work is **non-monotonic correctness**: the requirement to pass through a state of lower validity (broken build) to reach a state of higher validity (fixed race condition). For step-level grading to agree with outcome-level grading, the solution space must possess **monotonic progress**, meaning every intermediate step maintains or improves code health metrics (compilation, lint, static analysis) relative to the prefix.

  **Contrast Case**
  Remove the coupling: The `charge()` method is internal to a single module with no external callers. The agent can change the signature and implement the logic in a single commit or a sequence of steps that never breaks compilation. Here, every step is locally defensible. Process supervision wins because it provides dense feedback on the logic implementation details, guiding the model faster to the correct solution than the sparse signal of the nightly tests, which only confirm success at the end.

  **The Process-Supervision Advocate's Reply**
  The advocate argues: "The grader should be shown the agent's full plan upfront. If the grader sees 'I will break the interface now to fix all 40 callers in the next 5 steps,' they will label Step 1 as positive."
  This reply quietly changes the subject from Process Supervision to **Trajectory-Level Supervision**. If the label depends on the completion of future steps (the plan's execution), you are no longer grading the step's intrinsic validity; you are grading the step's contribution to a successful outcome. This collapses into Outcome Supervision with extra compute overhead, as you must verify the plan's completion before assigning the step reward. If the grader refuses to validate the plan until executed, you are back to penalizing the broken build. If they accept the plan on faith, you have introduced reward hacking vulnerabilities where models write ambitious plans they cannot execute to gain local credit.

  **My Pick**
  For your context—legacy monolith, low test coverage, high coupling—I pick **Outcome Supervision** (specifically RL fine-tuning on the nightly test signal).
  **Reasons:** Legacy code work is fundamentally refactoring-heavy. Refactoring is inherently non-monotonic; you must break dependencies to resolve them. Process supervision structurally biases the model against the exact moves required to modernize a monolith (renaming, moving, splitting), forcing it into local optima of band-aid patches that keep the build green but the system brittle. Outcome supervision is the only signal that values the destination over the journey.
  **Uncertainty:** My least sure point is sample efficiency. Nightly tests are slow. If the search space is vast, OS might require too many trials to converge compared to PS. I would mitigate this with a hybrid: use PS for *localized* tasks (writing a function) and OS for *structural* tasks (refactoring modules), but if forced to choose one for the whole system, OS is the only one that permits the necessary breakage.
