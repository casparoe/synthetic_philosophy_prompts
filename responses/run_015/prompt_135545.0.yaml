      *   *Pick:* OS.

      *Wait, one nuance:* "The step-level grader has to be as good as it can possibly be... exactly what a careful engineer would assign given only the prefix."
      *   If the agent writes "Step 1: I will break the build to fix it later," does the engineer label that step "Good"?
      *   A careful engineer reviewing a *commit* that breaks the build would reject it, regardless of the commit message promising a fix. The *state* is broken. The spec says "given only the prefix of the trace." The trace includes the intent. But the *code state* is broken.
      *   To ensure PS loses, the step must be *objectively* regressive in terms of code health metrics (compilation, lint, static analysis) which the grader uses. Even if the intent is good, the artifact is bad.
      *   I need to make sure the thought experiment emphasizes that the *state* is invalid, not just the action.

      *Revised Thought Experiment:* The "Strangler Fig" pattern or "Schema Migration."
      *   Task: Migrate a column.
      *   Step 1: Add new column. (Good)
