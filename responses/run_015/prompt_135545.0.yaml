      *   Result: PS model applies band-aids. OS model fixes root cause.

      *Advocate Reply:* "Show the plan." If the grader sees the plan "I will fix all 50 in the next 5 steps," does the label change?
      *   If the label changes to "Good," then the grader is no longer evaluating the *step* in isolation or the *state* integrity. They are evaluating the *plan's viability*. This shifts from Process Supervision (is this step valid?) to Plan Verification (is this trajectory viable?).
      *   If the grader still says "Bad" because the build is broken *now*, then showing the plan doesn't help.
      *   I will argue it changes the subject to Outcome Supervision on Trajectories.

      *Pick:* Outcome Supervision.
      *   Why: Legacy code demands refactoring. Refactoring demands non-monotonic progress.
      *   Uncertainty: Sample efficiency. OS needs more trials.

      *Let's write it.*

      *Check constraints again:* "One paragraph, present-day, realistic." for the thought experiment case.
