answer: |-
  You have put your finger on the central tension in what is currently called **accuracy-first epistemology**. You are describing two distinct but related technical problems that arise when we try to turn "closeness to truth" into a normative rule for belief.

  To answer your primary question: there is no single, universally agreed-upon word for the *combination* of these two effects, but they have individual names in the literature. The first is **Partition Dependence** (or Algebra Sensitivity). The second is **Immodesty** (a necessary consequence of using a Proper Scoring Rule).

  If I were to coin a term for the overarching phenomenon you are sensing—the fact that the verdict on "who is rational" flips based on how the evaluator sets up the scoreboard—I would call it **Epistemic Frame-Relativity**.

  Here is the breakdown of what exactly is happening, why your two cases are siblings but not twins, and what it costs to try to fix them.

  ### 1. The First Case: Partition Dependence
  You observed that Annie and Bella cannot be ranked on a four-cell partition, but Annie seems to win on a two-cell partition.

  **What it is:**
  This is **Partition Dependence**. Accuracy scoring rules (like the Brier score you are using, which sums squared errors) measure the distance between a probability distribution and the truth vector. But "distance" depends on the number of dimensions in the space.
  *   In your four-world case, the "truth" is a vector like $(1, 0, 0, 0)$.
  *   In your two-world case, the "truth" is $(1, 0)$.
  When you coarsen the partition (merge $w_1$ and $w_2$), you change the geometry of the space. You aren't just describing the same opinions more coarsely; you are effectively changing the game being played.

  **Is your math exact?**
  A small technical note: on the standard Brier score, a uniform distribution (Annie) does not strictly *dominate* a peaked distribution (Bella) simply by coarsening to two cells, unless Bella is extremely peaked. However, your intuition is structurally correct: **Dominance relations are not invariant under coarsening.** A belief set that is "dominated" (strictly worse) in a fine-grained algebra can become "undominated" in a coarse-grained algebra, and vice versa. This is because the penalty for being wrong is distributed differently across the cells.

  **The Constraint that fixes it:**
  To make this go away, a scoring rule must satisfy **Extensionality** (sometimes called **Partition Independence**). This requires that the score for a proposition $P$ depends *only* on the truth value of $P$ and the credence in $P$, not on how many other alternatives ($Q, R, S...$) are listed alongside it.
  *   **The Cost:** Most standard scoring rules (like Brier) fail this. The only common rule that satisfies Extensionality is the **Logarithmic Scoring Rule** (score $= \log(\text{probability assigned to truth})$).
  *   **The Catch:** The Log Score is unbounded (you can get infinitely negative scores for assigning 0 to the truth). More importantly, even with the Log Score, you cannot compare Annie and Bella across different partitions without assuming that the "coarse" probability is just the sum of the "fine" probabilities. If you allow the agents to have different views on how the worlds group together, the comparison breaks down entirely.

  ### 2. The Second Case: Immodesty
  You observed that if you average the scores using Annie's weights, Annie wins. If you use Bella's, Bella wins.

  **What it is:**
  This is **Immodesty**. In formal epistemology, a scoring rule is called **Proper** if it guarantees that you minimize your expected score by reporting your true credences.
  *   If the rule is Proper, then *by definition*, you expect your own credences to be more accurate than anyone else's (unless you think they are identical to yours).
  *   If a rule *didn't* have this property, it would be "improper," meaning it would sometimes incentivize you to lie about your beliefs to get a better score.

  **Is this the same phenomenon?**
  It is the same *flavour* but a different *mechanism*.
  *   **Partition Dependence** is about the **Sample Space** (the options on the table).
  *   **Immodesty** is about the **Measure** (the weights used to average the outcomes).
  Both show that "Accuracy" is not an intrinsic property of a belief state like mass or charge. It is a **three-place relation**: Accuracy(Belief, World, **Framework**). You cannot get a verdict without fixing the Framework first.

  ### 3. Does this beg the question?
  Your suspicion is correct: **"whether it means these arguments quietly assume part of what they're trying to show."**

  This is known as the **Circularity Objection** to accuracy-based arguments for probabilism.
  *   To prove that you *ought* to have probabilistic beliefs (like Annie and Bella), philosophers use accuracy dominance arguments.
  *   But to run the argument, they must assume a specific Partition and a specific Scoring Rule.
  *   As you have shown, changing the Partition or the Rule changes the winner.
  *   Therefore, to conclude "Annie is rational," you must already assume "The 2-cell partition is the correct one" or "The Brier score is the correct measure."
  *   But why is *that* partition or score correct? Usually, the answer is "Because it's the one that makes probabilistic norms come out right."
  *   **Verdict:** Yes, without an independent justification for the Framework (Partition + Rule), the argument is circular. It assumes the norms it tries to derive.

  ### 4. Coining the Term: Epistemic Frame-Relativity
  Since you asked for a label if one doesn't exist: I propose **Epistemic Frame-Relativity**.

  **Definition:**
  A normative evaluation of belief exhibits **Epistemic Frame-Relativity** if the verdict (e.g., "Belief A is better than Belief B") is contingent on arbitrary parameters of the evaluation framework—specifically the granularity of the possibility space (Partition) or the weighting measure used for expectation (Prior)—where the framework itself is not dictated by the agents' evidence.

  **Cases that fall *outside* this definition:**
  1.  **Different Topics:** If Annie predicts the weather and Bella predicts the stock market, and we score them on different partitions, that is not Frame-Relativity. That is just comparing apples and oranges. Frame-Relativity requires the *same* underlying reality, just sliced differently.
  2.  **Improper Scoring Rules:** If we used a scoring rule that was *not* proper (e.g., one that rewarded you for being certain regardless of truth), the "Immodesty" effect might disappear (you might expect the other person to win). But this falls outside the concept because we generally agree improper rules are broken tools for measuring truth. Frame-Relativity is a problem *internal* to the best tools we have.

  ### Summary
  You have identified that accuracy-first epistemology relies on a **scorecard** that is not provided by the theory itself.
  1.  **Partition Dependence:** The score changes if you change the number of boxes you sort the world into.
  2.  **Immodesty:** The "average" score changes if you change whose perspective you use to average.
  3.  **The Cost of Fixing It:** To remove Partition Dependence, you must use Local rules (like Log Score), which introduce other mathematical pathologies (unboundedness). To remove Immodesty, you need a "God's eye" prior, which is impossible for humans to access.
  4.  **The Philosophical Cost:** You must accept that accuracy norms are **Question-Relative**. You can say "Given *this* question and *this* measure, Annie is better." You cannot say "Annie is a better believer *simpliciter*."

  Your intuition that the verdict favours "whoever got to set the scorecard up" is the precise critique leveled by opponents of the accuracy program. The "norms" turn out to be artifacts of the measurement geometry.
