          *   No citations/reading lists (committee wants question and plan).
          *   Accessible vocabulary (no jargon only philosophy majors know).
          *   No data collection possible (conceptual/theoretical work only).
          *   15 hours/week for 6 weeks.
          *   Must have a determinate answer (not just "general discussion").
          *   Must explain why common sense positions fail.
          *   Must outline week-by-week method.
          *   Must explain why this approach is better than alternatives (literature review, surveys, diet advocacy).
          *   Must state possible conclusions and decision criteria.
          *   Must state an honest failure condition (avoiding "it depends").
          *   Must advise on what to cut for feasibility.
          *   Must describe a concrete deliverable (for a person/cafeteria).
      *   **Topic:** Ethical comparison of food sources (beef vs. chicken vs. plants) focusing on three "ledgers" (deaths, lives created, lives prevented/wild animal suffering) and "currency" (deaths vs. suffering duration).
      *   **Tone:** Academic but accessible, rigorous but feasible for a high schooler.

  2.  **Deconstruct the Core Idea:**

      *   *The Problem:* Current ethical eating arguments mix up different metrics (ledgers) and units of measurement (currency).
      *   *The Ledgers:*
          1.  Deaths Caused (farmed animals killed).
          2.  Lives Created (animals brought into existence to be eaten).
          3.  Lives Prevented (wild animals displaced/suffering prevented by habitat loss).
      *   *The Currency:* Count of deaths vs. Duration/Intensity of suffering.
      *   *The Goal:* Create a framework to compare these consistently, not necessarily to solve the metaphysics of animal welfare, but to clarify *why* people disagree and under what specific conditions one diet wins.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be clear and descriptive.
      *   **Research Question:** Needs to be specific. Instead of "Is eating beef bad?", it should be "Under what explicit assumptions does Diet X minimize net suffering compared to Diet Y?"
      *   **Background/Motivation:** Briefly mention the uncle argument to ground it, but focus on the conceptual confusion (ledgers/currency).
      *   **Why Common Sense Fails:** Address the prompt's requirement. Counting deaths favors beef over chicken. Counting suffering duration might favor chicken over beef. Ignoring wild animals ignores the "lives prevented" ledger.
      *   **Methodology (6 Weeks):**
          *   Weeks 1-2: Define the ledgers and currencies.
          *   Weeks 3-4: Model the trade-offs (logic matrices, not data).
          *   Weeks 5-6: Test against scenarios and create the deliverable.
      *   **Why This Approach:** It's conceptual clarification, not empirical data gathering (which is impossible/out of scope) or advocacy (which is biased).
      *   **Possible Conclusions:** One diet dominates, or specific thresholds determine the winner.
      *   **Failure Condition:** If the model just says "it depends on your values" without showing *which* values change the outcome, it fails.
      *   **Feasibility Check:** What to cut? The wild animal suffering part is huge and speculative. Need to scope it down.
      *   **Deliverable:** A decision matrix or flowchart, not a paper.

  4.  **Refining for the Committee (Biology, History, Ethics):**

      *   *Biology:* Needs to acknowledge biological reality (lifespans, habitat) without needing new data.
      *   *History:* Contextualizes how we got here (agriculture), but the proposal is forward-looking.
      *   *Ethics:* Needs clear reasoning, no jargon (avoid "utilitarianism," "deontology," "non-identity problem" unless explained simply).
      *   *Length:* Two pages is roughly 800-1000 words single-spaced. I need to be concise.

  5.  **Addressing Specific Prompt Requirements (Self-Correction/Check):**

      *   *Determinate Answer:* The question must ask for conditions, not just "what is right."
      *   *No Citations:* Check.
      *   *No Data Collection:* Check.
      *   *Failure Condition:* Explicitly stated.
      *   *Feasibility Advice:* The prompt asks me to *tell* the user what to cut in the final section of the response, but the proposal itself must be feasible. I will write the proposal to be feasible, then add a note to the user about what *they* should watch out for. Wait, the prompt says "Finally, tell me honestly what part of this I should cut...". This implies the *response* should include this advice, not necessarily that it goes *in* the proposal text. I will structure the response to provide the Proposal first, then the Advice.
      *   *Deliverable:* Needs to be useful for a cafeteria. A "Decision Matrix" is good.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Question:* "Under what specific definitions of harm and existence does a beef-heavy, chicken-heavy, or plant-heavy diet minimize net negative experience?"
      *   *Ledgers:* Call them "Accounts" to be more accessible? No, "Ledgers" is fine, the user introduced it. I'll stick with the user's terminology but define it clearly.
      *   *Wild Animals:* This is the riskiest part. It's highly speculative. I need to make sure the proposal treats this as a *variable* in the model, not a fact to be proven.
      *   *Week-by-Week:*
          *   1-2: Define terms (Ledgers/Currency).
          *   3-4: Build the comparison model (Logic).
          *   5: Stress test (Edge cases).
          *   6: Build the tool (Deliverable).
      *   *Failure:* If the output is just "people value things differently," that's a failure. The success is mapping *exactly* where the value judgment flips the result.

  7.  **Final Polish:**

      *   Ensure tone is humble but confident.
      *   Check word count (aiming for ~900 words for the proposal part).
      *   Ensure the "Advice" section is distinct from the "Proposal" text.

  8.  **Wait, one constraint check:** "Please state the question so that it has a determinate answer... explain why the positions one can arrive at by common sense... leave the question open."
      *   Okay, the question needs to be sharp.
      *   "Which diet minimizes harm?" is bad.
      *   "What combination of assumptions about animal suffering and existence renders Diet X ethically superior to Diet Y?" is better.

  9.  **Feasibility Cut:** The "Wild Animal Suffering" ledger is incredibly complex and scientifically dense (ecology). For a high schooler with no data access, this is a trap. I should advise them to simplify this to "Habitat Displacement" rather than trying to quantify wild suffering. I will incorporate this simplification into the proposal to make it feasible, but explicitly mention in the advice section that this is the danger zone.

  10. **Deliverable:** A "Ethical Menu Calculator" or "Decision Flowchart." Let's go with a "Comparative Framework" that a cafeteria manager could use to weigh their priorities.

