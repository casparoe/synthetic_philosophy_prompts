answer: |-
  I was having a pint with a colleague who reckons she's finally isolated phenomenal consciousness using a no-report paradigm. I asked how she validated the neural marker. She said, 'We calibrated it against trials where subjects reported seeing the stimulus.' I said, 'So you're defining your measure of non-access consciousness… using access?' She shrugged and said, 'Only for the calibration. Once the marker is set, we discard the reports. It's like using a ladder to climb over a wall, then insisting you never touched the wall.'

  **Why it works:** It targets your specific 'bootstrapping' hinge by highlighting the circular dependency in no-report paradigms: the proxy for phenomenal consciousness is selected precisely because it correlates with access, then claimed to be independent. The ladder analogy provides a visual, non-technical punchline that lands well in a spoken dinner context without requiring the audience to parse complex metaphysics.

  **Liberties and fairness:** The joke treats calibration as a contaminant rather than an inductive step, which Global Workspace proponents might argue is unfair—they'd claim the marker tracks phenomenology *after* calibration, not just access. It leans on the contested reading that access cannot be methodologically separated from phenomenality even temporarily. It shouldn't offend the illusionists; if anything, it reinforces their view that the distinction is methodologically unstable.
