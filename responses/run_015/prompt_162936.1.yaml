answer: |-
  Your skepticism is well-founded. Your friend has grasped the *rough outline* of Moral Foundations Theory (MFT) but has filled in the gaps with a mix of overstatements, non-canonical additions, and a philosophical leap that the theory's creator, Jonathan Haidt, explicitly warns against.

  Here is a breakdown of what is accurate, what is distorted, and why the conclusion that "psychology equals political truth" does not hold up.

  ### 1. The Foundations: What's Real and What's Exaggerated

  **The Claim:** *There are six foundations (Care, Fairness, Loyalty, Authority, Sanctity, Liberty). Liberals use only Care/Fairness/Liberty; Conservatives use all six equally.*

  **The Verdict:** **Mostly Accurate, but with a key distortion.**

  *   **What's Accurate:** The standard model of MFT currently includes six foundations. The original five were Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, and Sanctity/Degradation. The sixth, Liberty/Oppression, was added around 2012 to account for libertarian and liberal concerns about tyranny.
  *   **The Data:** Haidt's data (from *The Righteous Mind* and subsequent papers) consistently shows that self-identified liberals score very high on Care and Fairness (often interpreted as equality) and Liberty, but significantly lower on Loyalty, Authority, and Sanctity. Conservatives tend to score more evenly across all six.
  *   **The Distortion:** Your friend claims conservatives feel all six **"equally."** This is false. Conservatives do not value Authority *as much* as they value Care; they simply value Authority *more than liberals do*. Their moral matrix is "broader," not "flat."
  *   **The "Truncated" Language:** Haidt does use the metaphor that liberals have fewer "taste buds." He argues liberals often struggle to *understand* conservative arguments because they don't feel the gut reaction to Loyalty or Sanctity. However, he frames this as a cognitive blind spot, not necessarily an inability to learn or reason.

  ### 2. The "Stewardship" Foundation

  **The Claim:** *There is a seventh foundation called "Stewardship" regarding the environment. Liberals ace it; Conservatives ignore it.*

  **The Verdict:** **False / Non-Canonical.**

  *   **Is it real?** No. There is no officially recognized seventh foundation called "Stewardship" in Moral Foundations Theory. While academic psychology is always evolving, and researchers propose new foundations occasionally (e.g., "Honesty" or "Proportionality"), "Stewardship" is not part of the standard model used by Haidt, Graham, Haidt, & Nosek.
  *   **Where did this come from?** Your friend is likely conflating MFT with other research on environmental psychology. Some researchers have tried to map environmentalism *onto* the existing foundations. For example, concern for nature is often linked to **Care** (suffering of animals/people) or **Sanctity** (purity of the earth).
  *   **The Political Split:** It is empirically true that liberals score higher on measures of environmental concern. However, framing this as a distinct, innate *moral foundation* that flips the script on the theory is not supported by the actual literature. It sounds like your friend (or a podcaster they listen to) added this to "balance the scorecard" politically.

  ### 3. The Big Leap: Does Psychology = Moral Truth?

  **The Claim:** *Because one side taps into more foundations (or the "right" ones), their politics are morally "correct" or "more in tune with human nature."*

  **The Verdict:** **Philosophically Invalid (The Naturalistic Fallacy).**

  This is the most critical error in your friend's explanation. You are correct to feel that having a certain psychology doesn't make a policy correct.

  *   **The Naturalistic Fallacy:** This is the error of deriving an "ought" from an "is." Just because a moral intuition is **evolved** or **widely felt** does not make it **morally true**.
      *   *Example:* Humans have an evolved foundation for "Loyalty/Betrayal." This creates patriotism, but it also creates tribalism, racism, and xenophobia. If "tapping into evolved nature" equals "moral truth," then tribalism is morally good. Haidt does not argue this.
  *   **Haidt's Actual Position:** Haidt argues that understanding all foundations leads to better **governance** and **social stability**, not necessarily moral *truth*. His argument is pragmatic: If you ignore half the population's moral intuitions (e.g., a liberal ignoring sanctity/loyalty), your policies will face backlash and fail. He argues for moral *pluralism*, not moral *superiority*.
  *   **The "Defective" Claim:** Haidt argues liberals are "blind" to certain foundations, not that they are "defective" humans. Conversely, he often critiques conservatives for being blind to Care (e.g., regarding social safety nets). He positions himself as a centrist who believes both sides need each other to run a healthy society.

  ### 4. Does Adding "Stewardship" Fix the Conclusion?

  **The Claim:** *If we add Stewardship, the Left becomes the side with the "fuller" psychology, so the Left is right.*

  **The Verdict:** **No, because the premise remains flawed.**

  Even if "Stewardship" were a real foundation and liberals scored higher on it, the conclusion that **"Fuller Psychology = Politically Correct"** still fails for the reasons listed above.

  1.  **Quantity $\neq$ Quality:** Having *more* active moral foundations doesn't mean your policies are better. A society could be high on Loyalty, Authority, and Sanctity but be a brutal theocracy. A society could be high on Care and Liberty but struggle with social cohesion.
  2.  **Trade-offs:** Morality is often about trade-offs. Prioritizing "Stewardship" (environment) might conflict with "Care" (economic jobs for the poor). MFT describes the *conflict*, it doesn't solve it.
  3.  **The Theory is Descriptive, Not Normative:** MFT is a tool to explain *why* people disagree, not a scoreboard to decide *who wins*. Using it to declare victory for either side misses the point of the theory.

  ### Summary for Your Friend

  If you want to push back, here is the breakdown you can offer:

  1.  **The Foundations:** You got the 6 foundations mostly right, but conservatives don't value them "equally," they just value the "binding" ones (Loyalty, Authority, Sanctity) more than liberals do.
  2.  **Stewardship:** That's not a real part of the theory. Environmental concern is usually analyzed through Care or Sanctity. You can't just add a foundation to make the math work out for your side.
  3.  **The "Truth" Claim:** This is the big error. Haidt explicitly says MFT explains *why* we fight, not *who is right*. Just because a moral intuition is "evolved" doesn't make it good (slavery was once supported by "natural" hierarchies).
  4.  **The Goal:** The point of the theory is to reduce demonization. If liberals understand Sanctity, they understand why conservatives care about flags or religion. If conservatives understand Care, they understand why liberals care about safety nets. It's about empathy, not winning.

  **Bottom Line:** Your friend is using a descriptive psychological theory to make a normative political argument. That is a category error. The theory survives the correction, but the conclusion that "one side is morally right because of their brain wiring" does not.
