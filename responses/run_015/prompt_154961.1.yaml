      *The Tension:* The command is intended to protect. Protection implies a protectee. If the protectee doesn't exist, the command is a function without an argument. It is a "should" that cannot be a "should" because "should" is a relational property between a state of affairs and a valuer. By claiming to exist without a valuer, the reason denies the very relational nature that makes it a reason. It's like a marriage vow spoken to an empty room that claims to be binding.

