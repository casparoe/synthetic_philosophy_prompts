  8.  **Final Polish:** Ensure the distinction between "active" and "passive" affects is clear in the replies, as that's the core of the thesis. Ensure the "Hobbesian sovereignty" critique is woven in.

  *(Self-Correction on "2-minute reply"):* I cannot write a transcript, but I must provide the *substance* of a 2-minute reply. I will draft them as spoken arguments.

  *(Self-Correction on "Upfront Concessions"):* I need to state clearly what I should admit before the Q&A starts to disarm critics.

