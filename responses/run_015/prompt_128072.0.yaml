      *Refining the "Dreaded Question":* It needs to be the one that exposes the internal tension of the thesis. The tension between *Ethics* (Reason = Freedom) and *TP* (Politics = Management of Passions). If I say politics is just affect management, am I admitting politics is inherently irrational?

  7.  **Final Review against Constraints:**
