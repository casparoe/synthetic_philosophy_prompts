      *   Ordered by damage? Yes.
      *   Subgroup vocabulary? Yes.
      *   2-minute replies? (Will keep text length appropriate).
      *   Weaknesses noted? Yes.
      *   Upfront concessions? Yes.
      *   Dreaded Question included? Yes.
      *   No bibliographies? Yes.
