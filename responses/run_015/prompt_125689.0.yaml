answer: |-
  # Seminar Activity: The Sigma Protocol

  ## 1. Handout Wording
  *(Print on half-sheets of paper. Distribute one per pair.)*

  **SEMINAR EXERCISE: THE SIGMA PROTOCOL**

  **The Alphabet:** `{ / , \ , | }`  
  **The Task:** Define a rule that takes a **String** (sequence of symbols) and outputs a **Single Symbol** to append to the end.

  **Phase 1: Invention (15 mins)**
  1.  **Inventor:** Write a rule in English on an index card. Keep it hidden.
  2.  **Inventor:** Generate three **Training Strings** (length 3–5) and their correct outputs. Write these on the card.
  3.  **Learner:** Do not see the rule. Look only at the three Training Strings.
  4.  **Learner:** Generate three **Test Strings** (length 3–5) and predict their outputs. Write these on a separate card.

  **Phase 2: Adjudication (20 mins)**
  1.  Swap cards. **Inventor** checks **Learner**'s predictions against the hidden rule.
  2.  **Scoring:** +1 point for each match. Max 3 points.
  3.  **Stakes:** The pair with the highest score receives **Exemption Tokens** (valid for one reading quiz waiver). Ties broken by speed.

  **Phase 3: The Challenge (20 mins)**
  *   Selected pairs will present their Rule and Training Data to the class.
  *   The Class acts as the **Standards Committee**.
  *   The Instructor may propose a **Shadow Interpretation** of the data.
  *   The Committee must vote: Is the Learner **Correct** (followed the rule) or **Deviant** (broke the rule)?

  **Constraint:** You may not use mathematical concepts (numbers, counting, parity) in your rule. Only symbol manipulation.

  ***

  ## 2. Minute-by-Minute Timeline

  **00:00 – 00:05 | Setup & Grouping**
  *   Project the Alphabet `{ / , \ , | }` on the board.
  *   Distribute handouts and index cards/markers.
  *   Assign pairs (7 pairs total). Designate Student A (Inventor) and Student B (Learner) for Round 1.
  *   **Instructor Script:** "You are engineers debugging a legacy system. The code is lost. Only input-output logs remain. Your goal is to recover the function. Go."

  **00:05 – 00:25 | Phase 1: Invention & Training**
  *   Inventors write rules and 3 training examples.
  *   *Instructor Patrol:* Ensure rules are not mathematical (e.g., ban "if length is even"). Encourage structural rules (e.g., "If ends in `/`, add `\`").
  *   Learners turn over cards. Inventors reveal Training Data only.
  *   Learners generate 3 Test Strings and predictions.

  **00:25 – 00:40 | Phase 2: Scoring & Stakes**
  *   Pairs swap cards. Inventors grade Learners.
  *   Collect scores on the board. Announce the leading pair.
  *   **Crucial Move:** Ask the *losing* pairs to keep their cards. Ask the *winning* pair to come to the board.

  **00:40 – 00:60 | Phase 3: The Adjudication (The Trap)**
  *   **Step 1 (Public Verification):** The Winning Pair projects their 3 Training Examples. The Class verifies the Learner's Test predictions match the Inventor's Rule.
  *   **Step 2 (The Deviant):** You (Instructor) step in as a "Second Learner." You propose a **Shadow Rule** aloud.
      *   *Example:* If their rule was "Always add `/`", you say: "My rule is: 'Add `/`, unless the string length exceeds 1,000,000, then add `\`'."
      *   Point out: "My rule fits all 3 Training Examples. It fits all 3 Test Examples. It is empirically indistinguishable from the Inventor's rule given the data available in this room."
  *   **Step 3 (The Vote):** Ask the class: "Did the Second Learner follow the rule?"
      *   Most will say "No."
      *   Ask: "Why? What fact about the Inventor's mind or the cards makes him wrong?"
  *   **Step 4 (Community Verdict):** Have the class vote. Then ask the Inventor: "Does the class vote make you *more* sure you meant 'Always add `/`'?"
  *   **Step 5 (The Silence):** Let the discomfort sit for 60 seconds. Do not resolve it yet.

  **00:60 – 00:80 | Debrief: Mapping the Paradox**
  *   Transition to lecture/discussion mode. (See Debrief Script below).

  ***

  ## 3. Debrief Script & Philosophical Mapping

  **Instructor Notes:** Do not mention "Kripke" until the final 5 minutes. Use the activity's terminology.

  **Minute 60-65: The Normativity Question**
  *   "In the vote, you said the Shadow Rule was *wrong*. Not just different, but *incorrect*. Why?"
  *   "If meaning were just past behavior (the 3 training cards), the Shadow Rule is perfect. It matches all behavior."
  *   "So, you are claiming there is a **Fact of the Matter** about what the Inventor *meant* that transcends their past actions."
  *   **Mapping:** This is the **Normativity of Meaning**. Meaning tells us what we *ought* to do in the future, not just what we *did* in the past.

  **Minute 65-70: The Skeptical Challenge**
  *   "What is that fact? Is it a mental image? (No, images can be interpreted multiple ways). Is it a disposition? (No, you are disposed to make mistakes, or to die before reaching 1,000,000 glyphs)."
  *   "If there is no fact about the individual that constitutes meaning 'plus' rather than 'quus' (or 'Always /' vs 'Unless 1M...'), then there is no such thing as meaning."
  *   **Mapping:** This is **Kripke's Skeptical Paradox**. No individual fact (internal or external) fixes reference.

  **Minute 70-75: The Communal Solution (and its Cost)**
  *   "You voted as a class. You sided with the Inventor. Does this solve it?"
  *   "Wittgenstein (on Kripke's reading) suggests meaning is a **Social Practice**. To mean something is to be subject to correction by the community."
  *   "The Shadow Rule is 'wrong' because the community rejects it. It violates our custom."
  *   **The Cost:** "This means truth is not correspondence to reality, but **assertibility conditions**. We cannot say the Inventor *really* meant one thing; we can only say she is *in agreement* with us."
  *   **Mapping:** The **Skeptical Solution**. We give up truth-conditions for assertibility-conditions.

  **Minute 75-80: Realism & Conclusion**
  *   "Why does this feel unsatisfying? Because we want meaning to be robust. We want the rule to guide us even if everyone else is wrong."
  *   "That desire is **Realism**. Kripke argues Realism is untenable. The activity made you feel the pull of Realism (the Inventor *knows* what she meant) and the pull of the Community (the Vote)."
  *   "Next week: Can we save Realism? Read McDowell."

  ***

  ## 4. Predictable Failures & Mitigation

  **1. The "Psychologizing" Trap**
  *   **What happens:** Students will argue the Shadow Rule is wrong because "We know what she was *thinking*."
  *   **Mitigation:** Interrupt immediately. "We do not have access to her thoughts. We only have the cards and her verbal report. Her verbal report is just more sounds/symbols. How do we know *those* symbols aren't subject to the Shadow Rule too?" (Force them back to public evidence).

  **2. The "Mathematical Realism" Leak**
  *   **What happens:** A student invents a rule like "Add a slash if the number of dashes is prime."
  *   **Mitigation:** The handout bans mathematical concepts. If they slip, disqualify that pair from the adjudication phase. The formalism must remain syntactic, not semantic, to avoid the intuition that "numbers exist independently."

  **3. The "Just More Data" Reply**
  *   **What happens:** Students say, "If we ran the experiment longer, we'd catch the Shadow Rule."
  *   **Mitigation:** Remind them of the 1,000,000 glyph clause. "You will be dead before you generate enough data. Does the rule have a truth value *now*?"

  ***

  ## 5. Limitation of the Activity (Instructor Disclosure)

  **The Feature You Must Supply:**
  This activity successfully demonstrates the **Underdetermination of Theory by Data** (a Humean problem). It shows that finite evidence cannot logically guarantee a specific infinite continuation.

  **What It Cannot Reproduce:**
  It does not fully reproduce Kripke's deeper claim: that **there is no fact of the matter even for the speaker themselves.** In the activity, the Inventor *feels* like they have a fact in mind (their intention). Kripke's paradox is that this "feeling" is not a *constitutive fact*. The activity relies on the Inventor's internal certainty to create the stakes, but Kripke argues that internal certainty is precisely what fails to constitute meaning.

  **How to Supply It:**
  In the debrief (Minute 65), you must explicitly challenge the Inventor: "You feel sure you meant 'Always /'. But if I asked you *in virtue of what* you meant that, you can only point to more symbols or feelings. Those are just more items subject to the Shadow Rule. The paradox is not that we can't *know* the fact; it's that there *is* no fact."
