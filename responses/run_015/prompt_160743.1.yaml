              1.  The "Click Variant" experiment (reaction times to color probes).
              2.  The User's "Staggered Ledger" view (disunified timing).
              3.  Generalizability (does this leak to ordinary consciousness/agency?).
          *   Characters must admit where they'd give ground or where the debate might be degenerate.

  2.  **Character Development:**
      *   **Orwellian (Let's call him "Mark"):** Focuses on memory revision. The experience happens, but the *record* is falsified later. Needs to defend the reality of the initial experience vs. the falsified memory.
      *   **Stalinesque (Let's call her "Sarah"):** Focuses on delayed construction. The experience is authored late but backdated. No initial experience to revise; the "show" is prepared before it opens.
      *   **Tone:** Intellectual but informal. Tired but engaged. Beer/coffee in hand. Respectful but sharp.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Pub, post-conference fatigue. Acknowledge the stalemate.
      *   **Point 1: The Click Variant:**
          *   *Setup:* Student proposes the experiment (click at variable delay, press color button).
          *   *Stalinesque take:* If the click is early (before construction finishes), they shouldn't see red yet. If they *do* see red fast, that challenges the "delayed construction" view.
          *   *Orwellian take:* If the click triggers a probe before memory revision settles, maybe we catch the "true" state?
          *   *Conflict:* If reaction times are indistinguishable from simple discrimination at short delays, does that prove the content was ready?
          *   *Resolution/Nuance:* Both might have to admit this measures *access* rather than *phenomenology*. If RT is fast, the motor output is ready, but does that mean the *qualia* were settled?
      *   **Point 2: The Staggered Ledger (User's View):**
