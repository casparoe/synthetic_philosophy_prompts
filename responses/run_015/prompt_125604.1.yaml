answer: |-
  1. The Question

  **Jurisprudence: The Hart–Fuller Debate**

  **Time Allowed: 45 Minutes**
  **Total Marks: 20**

  **Question 1**

  In the Republic of Verraine there is no standing legislature. Every five years five hundred citizens are chosen by lot from the electoral register; they sit for ninety days, deliberate in private, and produce a complete criminal code, after which they disperse permanently. The code is the sole source of criminal prohibition for the next five years. No body whatsoever — not the courts, not the ministries, not the selectors themselves — has power to amend, repeal or dispense from it during that period. It is promulgated in full six months before it takes effect. Independent reviewers confirm that it is general in form, intelligible to a person of ordinary education, internally consistent and entirely possible to comply with; the courts apply the enacted text exactly, and there is no measurable gap between the rules as declared and the rules as administered. The selectors are subject to the code for the five years and are prosecuted under it like anyone else. No reasons for any provision are published, nobody is answerable for the code's content after the selectors disperse, and there is no institution whose continuing job is to keep the law in touch with social practice. The current code contains the ordinary prohibitions on violence, theft and breach of contract, enforced impartially between private citizens, and it also makes it an offence to practise, without a licence granted by a state church, any religion other than that church's.

  Critically assess the claim that the Verraine code fails to constitute law on Fullerian grounds, despite satisfying all eight principles of legality.¹ In doing so, distinguish clearly between the objection based on the religious provision and the objection based on the structure of legislation. Does this case suggest the Hart–Fuller debate concerns the criteria of validity, or the nature of the legal enterprise?

  ***

  ¹ *Fuller's eight principles of legality are: (1) generality; (2) promulgation; (3) non-retroactivity; (4) clarity; (5) non-contradiction; (6) possibility of compliance; (7) constancy through time; and (8) congruence between official action and declared rule.*

  ***

  2. Model Answer

  The Verraine case presents a sophisticated trap for the positivist and the natural lawyer alike. On the surface, it satisfies Hart's criteria for a legal system and Fuller's eight principles of legality. However, I argue that Fuller would deny Verraine constitutes a genuine legal system, not because it violates the list of principles, but because it violates the underlying conception of law as a reciprocal enterprise. Hart, conversely, would affirm its validity, revealing that their disagreement is ultimately about the nature of the legal enterprise rather than mere criteria of validity.

  Fuller's jurisprudence is often reduced to the eight principles listed in the footnote. Yet, for Fuller, these principles are not a checklist but the internal morality of law, derived from the purpose of law itself: to subject human conduct to the governance of rules. This requires a specific relationship between lawgiver and subject. It is a collaborative enterprise requiring reciprocity. The lawgiver must maintain the rules and remain accountable to the subject, ensuring congruence not just mechanically, but purposively. In Verraine, the legislature disperses permanently. There is no ongoing lawgiver. Once the code is set, the relationship collapses into a one-way projection of power. The citizens are bound, but there is no one left to hold to the undertaking. The 'constancy' principle is met formally—the rules do not change—but the *responsibility* for constancy is absent. Without an agent capable of responding to social practice or correcting errors, the system lacks the fidelity required for the internal morality of law. Thus, Fuller would argue Verraine is not law because the enterprise of subjecting conduct to rules has been abandoned for a system of static commands.

  It is vital to distinguish this structural defect from the substantive iniquity of the religious provision. A candidate might argue Fuller rejects Verraine because the religious clause is immoral. This conflates Fuller with traditional natural law theorists like Aquinas. Fuller's objection is procedural, not substantive. He argues that bad aims are often pursued by bad legal methods, but he does not claim immorality automatically invalidates law. In Verraine, even if the religious clause were removed, the structural defect would remain. The absence of an accountable, ongoing legislature prevents the reciprocity necessary for legality. The religious clause is a substantive evil, but the transient legislature is a procedural failure that strikes at the heart of Fuller's definition. The two complaints are distinct: one concerns the *content* of the law, the other concerns the *possibility* of law existing at all.

  Hart's position stands in sharp contrast. For Hart, the existence of law is a matter of social fact, specifically the acceptance of a Rule of Recognition by officials. In Verraine, the courts apply the code exactly; the selectors were chosen by a recognised procedure. The pedigree of the rules is clear. Hart separates law and morality; therefore, the religious clause, however odious, does not affect legal validity. Furthermore, Hart's 'minimum content of natural law' is likely satisfied given the prohibitions on violence and theft. Hart would view the transient legislature as merely unusual, not invalid. As long as the secondary rules (rule of recognition, change, adjudication) functioned during the creation and are respected by courts during enforcement, it is a legal system. The lack of an ongoing legislature might make the system inefficient or rigid, but not legally non-existent.

  This divergence illuminates the true crux of the Hart–Fuller debate. It is not simply about whether immoral rules are valid. Hart focuses on the criteria of validity: does the rule originate from the recognised source? Fuller focuses on the nature of the legal enterprise: does the system facilitate human agency through reciprocal rule-governance? Verraine satisfies Hart's source-based criteria but fails Fuller's functional criteria. If we accept Fuller's view, the debate is not about validity in the positivist sense, but about whether a system lacking reciprocity deserves the name 'law' at all.

  In conclusion, the Verraine case demonstrates that satisfying the eight principles formally is insufficient for Fuller. The principles serve the enterprise of law; without the ongoing undertaking of a lawgiver, the enterprise fails. Hart would maintain it is law, albeit bad law. Therefore, the debate is not merely about the threshold of validity, but about whether the concept of law inherently carries a moral purpose regarding how power is exercised over time. Verraine shows that one can have validity without legality.

  (84 words per paragraph approx; Total words: 840)

  ***

  3. Marking Scheme

  **Total Marks: 20**

  **1. Identification of the 'Enterprise' Gap (4 marks)**
  *   **Award:** For recognising that Fuller's principles serve a deeper purpose (reciprocity/undertaking) and that Verraine fails this despite formal compliance.
  *   **Common Error:** Treating the eight principles as a standalone checklist and concluding Fuller must accept Verraine because all boxes are ticked.

  **2. Articulation of Reciprocity and Accountability (4 marks)**
  *   **Award:** For explaining that Fuller requires an ongoing lawgiver subject to the rules to maintain the reciprocal relationship with citizens.
  *   **Common Error:** Describing the legislature's dispersal as merely a practical inconvenience rather than a theoretical breakdown of the law-subject relationship.

  **3. Distinction Between Structural and Substantive Defects (4 marks)**
  *   **Award:** For clearly separating the objection to the religious clause (substantive morality) from the objection to the transient legislature (procedural legality).
  *   **Common Error:** Arguing Fuller rejects Verraine primarily because the religious law is unjust, conflating Fuller with classical natural law.

  **4. Accurate Positivist Counter-Argument (4 marks)**
  *   **Award:** For correctly applying Hart's Rule of Recognition and separation thesis to show why Hart would validate the system despite its flaws.
  *   **Common Error:** Suggesting Hart would reject the system because it is immoral, or confusing Hart's 'minimum content' with Fuller's principles.

  **5. Verdict on the Nature of the Debate (4 marks)**
  *   **Award:** For concluding that the case shifts the debate from 'criteria of validity' to 'nature of the legal enterprise' (validity vs. legality).
  *   **Common Error:** Ending with a neutral summary ("Hart says X, Fuller says Y") without committing to a judgement on what the debate is fundamentally about.

  ***

  4. Guidance for Markers

  **First-Class vs. Upper Second**
  A **First-Class** answer will fluently integrate the Verraine facts into the theoretical argument, using the case to expose the limits of Fuller's list without needing to recite it. It will treat the 'enterprise' concept as the primary lens and distinguish the religious clause with precision. An **Upper Second** answer will identify the key issues and reach the correct verdict but may rely more on general theory than the specific facts of Verraine, or may struggle to fully disentangle the substantive religious issue from the procedural structural issue.

  **Zero-Credit Moves**
  *   **Reciting the Eight Principles:** No marks are awarded for listing or defining Fuller's eight principles; the footnote provides these.
  *   **Confusing Fuller with Aquinas:** Arguing that Fuller believes 'an unjust law is no law' regarding the religious clause misses his specific procedural focus.
  *   **Ignoring the Transient Legislature:** Focusing solely on the religious clause and ignoring the structural issue of the dispersing selectors.
  *   **Historical Summary:** Spending word count on the history of the debate (e.g., Nazi informers case) rather than applying the theory to Verraine.
  *   **Descriptive Neutrality:** Refusing to commit to a verdict on whether Verraine is law or what the debate is about.
