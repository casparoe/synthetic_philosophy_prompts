answer: |-
  Here is a 50-minute discussion plan designed to build the concepts structurally rather than sequentially.

  ### **Pre-Session Prep**
  *   **Board Work:** Draw a simple arrow diagram on the board before students arrive:
      *   `Status A (Forbidden)` **-- [CONSENT] -->** `Status B (Permissible)`
  *   **Handout (Optional but recommended):** A single half-sheet with the "Running Case" (The Cabin) printed at the top, with blank space below for the three variations.

  ---

  ### **0:00 – 0:05 | The Normative Magic (Hurd's Point)**
  **Goal:** Establish *what* consent does before asking *how* it works.
  **Activity:** Direct instruction + Quick check.

  1.  **Point to the Board:** "Most of us think of consent as a feeling of agreement. Heidi Hurd argues that's wrong. Consent isn't a feeling; it's a **normative transformation**. It changes the moral status of an action."
  2.  **The Hook:** "If I walk into your house without asking, I am trespassing (Wrong). If you ask me to come in, I am a guest (Permissible). The physical action is identical. The *moral reality* has changed. Consent is the wand that waves that change."
  3.  **Check for Understanding:** "If consent is this magic wand, what happens if the wand is broken? Does the spell fail to cast, or does it cast incorrectly?"
      *   *TA Note:* Do not answer this yet. Write "BROKEN WAND?" on the board. Tell them this is the question for the next 40 minutes.

  ### **0:05 – 0:15 | The Mechanism: Mental State vs. Communicative Act**
  **Goal:** Introduce the State/Act distinction as the *mechanism* of the transformation, not as a definition to be memorized.
  **Activity:** Socratic probing using the **Running Case**.

  **The Running Case: The Weekend Cabin**
  > *You own a cabin. You have the right to exclude others. I want to use it this weekend. You agree to let me stay.*

  1.  **Scenario A (The Silent Nod):** You internally want me to stay, but you say nothing. I walk in. Did the transformation happen?
      *   *Expected Student View:* "No, I didn't know."
      *   *Philosophical Point:* If consent is purely a **Mental State**, the transformation *should* have happened. Since it didn't, consent requires a **Communicative Act**.
  2.  **Scenario B (The Reluctant Yes):** You hate the idea, you are crying inside, but you say "Yes, take the keys." I take them. Did the transformation happen?
      *   *Expected Student View:* "Yes, technically."
      *   *Philosophical Point:* If consent is purely a **Communicative Act**, the transformation happened. The internal state is secondary to the external authority transfer.
  3.  **The Synthesis:** "So, for the 'magic' to work in the real world, we generally need the **Act** to signal the **State**. This tension is where the problems start."

  *   **TA Note (Misconception Alert):** Students will want to solve this ontology. **Refuse to settle it.** Say: "We don't need to decide which one is 'true' consent. We just need to see that valid consent usually requires a reliable link between the two. The three threats (Deception, Coercion, Competence) attack different parts of this link."

  ### **0:15 – 0:40 | The Stress Test: Varying the Case**
  **Goal:** Show that the three threats invalidate consent for *structurally different reasons*.
  **Activity:** Modify the **Cabin Case** in three steps. Ask students to diagnose *why* the "magic wand" broke in each.

  **Variation 1: Deception (Attacking the Object)**
  *   **Case:** I ask to borrow the cabin. You say yes. I actually plan to host a rave that will trash the place.
      *   *Sub-variation:* I lie about *who* I am (Fraud in Factum) vs. I lie about *why* I need it (Fraud in Inducement).
  *   **Discussion Question:** "Did you consent to *me trashing the cabin*? Or did you consent to *me staying quietly*?"
  *   **Key Distinction:** Deception severs the link between the **Act** and the **Object** of the act. You transformed the norms for *staying*, not for *partying*.
  *   **Head off Misconception (a):** If a student says "Any lie invalidates it," ask: "What if I lied and said I love blue shirts, but I actually hate them? Does that void the cabin consent?" (Distinguish material deception from incidental).

  **Variation 2: Coercion (Attacking the Will)**
  *   **Case:** I say, "Let me use the cabin, or I will tell your boss about that mistake you made."
      *   *Sub-variation:* I say, "Let me use the cabin, or I will sleep on the street in a blizzard."
  *   **Discussion Question:** "In both cases, you felt pressured. In which case did you still have a choice?"
  *   **Key Distinction:** Coercion doesn't confuse the *object* (you know what you're agreeing to). It subverts the **Agency** behind the Act. It turns a choice into a submission.
  *   **Head off Misconception (b):** Students conflate "Hard Choices" with "Threats."
      *   *Intervention:* "If the situation is bad because of *nature* (blizzard), it's a hard choice. If the situation is bad because of *me* (I made the threat), it's coercion. Consent requires you to be the author of the decision, not just the survivor of it."

  **Variation 3: Competence (Attacking the Authority)**
  *   **Case:** You agree to let me use the cabin. But you are 10 years old. Or, you are extremely intoxicated.
  *   **Discussion Question:** "Even if you said 'Yes' clearly, and I didn't lie or threaten you... do you have the *power* to transform the norms?"
  *   **Key Distinction:** Competence is not about the *quality* of the decision (Coercion/Deception); it is about the **Authority** to make the decision at all. You cannot transfer a right you do not fully possess.
  *   **Head off Misconception (c):** Students look for a bright line (e.g., "Age 18").
      *   *Intervention:* "Is a tipsy person competent to lend a cabin? What about a car? What about surgery? Competence is threshold-relative to the risk, not a biological switch."

  ### **0:40 – 0:45 | Boundary Setting: What We Are Not Solving**
  **Goal:** Prevent the discussion from spiraling into unsolvable metaphysics or applied ethics.
  **Activity:** Explicit meta-commentary.

  1.  **The Ontology Trap:** "Notice we used 'Mental State' and 'Communicative Act' as tools to diagnose the problems. We did not decide which one consent *really* is. Philosophers fight about that. For today, treat them as **conditions for validity**, not definitions of essence."
  2.  **The Hypothetical Trap:** "You might be thinking: 'But if they were sober, they *would* have agreed!' That is **Hypothetical Consent**. That is a different argument (often used in political theory to justify authority). Today we are talking about **Actual Consent**. Do not mix the two."
  3.  **Why this matters:** "If you conflate these, you end up justifying violations because 'they should have agreed.' We are asking when *actual* agreement works."

  ### **0:45 – 0:50 | The Diagnostic Question**
  **Goal:** Assess structural understanding, not memory of the three conditions.
  **Activity:** "Exit Ticket" style. Students write for 3 minutes, then share.

  **The Question:**
  > "Return to the Cabin Case.
  > **Scenario X:** You agree because I threatened to burn your house.
  > **Scenario Y:** You agree because I lied and said I was your brother (but I'm a stranger).
  >
  > In both scenarios, you regret the agreement. But **normatively**, is the violation the same?
  > *   In which case did I enter the cabin *permissibly* but owe you damages?
  > *   In which case was I a *trespasser* from the moment I walked in?
  > *   **Explain why the distinction matters based on what consent 'does'.**"

  **What to look for in their answers:**
  *   **Surface Level:** "Both are wrong." (Misses the point).
  *   **Intermediate:** "Coercion is worse than lying." (Moralizes rather than analyzes structure).
  *   **Target:** "In Scenario Y (Deception/Factum), the consent never attached to *me*, so I am a trespasser (Normative Transformation failed). In Scenario X (Coercion), the consent might be voidable, but the act of agreement happened under duress (Agency subverted)."
      *   *Note:* There is philosophical debate on whether coerced consent is void or voidable. You are looking for the *reasoning*, not the specific legal verdict. If they argue that coercion invalidates the *authority* of the act while deception invalidates the *content* of the act, they have grasped the structure.

  ---

  ### **TA Cheat Sheet: Managing the Flow**

  | Time | Potential Stall Point | Intervention Strategy |
  | :--- | :--- | :--- |
  | **0:10** | Students argue "But if I didn't mean it, it's not consent!" | "Okay, hold that thought. That's the Mental State view. Let's see if that view holds up when we add deception." |
  | **0:25** | Student says "Lying is always coercion." | "Is it? If I lie about the weather to get you to go outside, did I coerce you? Or did I trick you? What's the difference in your freedom?" |
  | **0:35** | Student asks "So what's the age limit?" | "That's a policy question. We're asking the philosophical question: Why does age matter at all? Is it about understanding or protection?" |
  | **0:48** | Running out of time during Diagnostic | Cut the sharing. Have them write it down and hand it in (or submit online). Read 3 aloud next section if needed. |

  ### **Why This Sequence Works**
  1.  **Normative Transformation First:** You cannot understand why a defect matters if you don't know what the function is. (Function $\to$ Defect).
  2.  **State/Act Second:** This provides the vocabulary to locate the defect. (Is the break in the mind or the mouth?).
  3.  **Running Case Third:** This prevents "example fatigue" and allows for direct comparison of the defects.
  4.  **Boundaries Fourth:** This validates the students' instinct that deeper questions exist without derailing the current lesson.
  5.  **Diagnostic Last:** This forces synthesis. They must apply the "Normative Transformation" concept to distinguish the defects, proving they didn't just memorize a list.
