      *   *The "Why":* Why do defects invalidate this transformation?
          *   *Incompetence:* The agent lacks the *power* to transform (no authority).
          *   *Coercion:* The agent has the power, but the *will* is overborne/subverted (not truly *their* transformation).
          *   *Deception:* The agent has power and will, but the *object* of the consent is mistaken (transforming the wrong thing).
      *   *Sequence:* To understand *why* defects matter, students must first understand *what* consent is doing (transforming norms). To understand that, they need to distinguish the internal state from the external act (otherwise, how do we judge the transformation?).

  3.  **Develop the Running Example:**
      *   *Requirements:* Must allow variation in deception, coercion, and competence without changing the core context. Needs to be relatable but serious enough for political philosophy (not just "borrowing a pen").
