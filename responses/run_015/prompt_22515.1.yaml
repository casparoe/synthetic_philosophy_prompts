prompt: |-
  I'm in a social ontology PhD program, and two of my seminar mates got into it after we read Lewis's Convention. Their exchange went: (1) Ana said that Lewis's 'non-accidental' condition is basically satisfied by evolutionary stability: if a regularity in a coordination game is maintained by cultural selection or repeated reinforcement, then it isn't just a coincidence, so culturally evolved regularities can be Lewisian conventions. (2) Ben said no, Lewis's non-accidental condition isn't just causal non-accidentality; it's tied to the agents' common interest and mutual expectations. A population can have a stable regularity that is causally explained by selection, but if nobody expects it as the way things are done, it's not a convention. (3) Ana replied that expectations can be selected too: if agents who expect the stable regularity and conform when they expect it do better, then the expectation structure can evolve alongside the behavior. (4) Ben said that's circular: to say the regularity is stable because people expect it is already to assume the convention exists, and Lewis's account is supposed to explain what a convention is, not just to re-describe a stable population. (5) Ana said that's not circular, it's diachronic: selection can first produce a regularity, then produce expectations about it, and once the expectation loop is in place the regularity meets Lewis's conditions. I wasnt taking sides, but I keep thinking there's a difference between a norm being stable and a norm being the kind of thing Lewis means by a convention. Can you adjudicate this move by move? I want to know who's right about which specific point, not just who wins overall, and what, if anything, both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Social Ontology PhD program seminar.
      *   **Topic:** David Lewis's *Convention* (1969), specifically the "non-accidental" condition and its relation to evolutionary stability/cultural selection.
      *   **Participants:** Ana (Pro-Evolutionary Stability interpretation) vs. Ben (Pro-Intentional/Expectational interpretation).
      *   **Task:** Adjudicate the exchange move-by-move (5 moves), determining who is right about specific points, who wins overall (if applicable), and identify what both are missing.
      *   **User's Intuition:** There's a difference between a norm being *stable* and a norm being a *Lewisian convention*.

  2.  **Deconstruct the Philosophical Background (Lewis's *Convention*):**
      *   *Core Definition:* A convention is a regularity $R$ in behavior in a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that others do (coordination problem).
          4.  There is an alternative regularity $R'$ that could have solved the coordination problem.
          5.  **The "Non-Accidental" Condition (often implicit or derived):** The conformity and expectations are common knowledge (or at least mutual belief), and the regularity is sustained *because* of these expectations and preferences. It's not just a coincidence or a forced outcome.
      *   *Key Tension:* Lewis's original account is heavily game-theoretic and rationalistic (agents reason about expectations). Later interpretations (Millikan, Skyrms, Young) try to naturalize this via evolution/learning without requiring high-level rationality.
      *   *The "Non-Accidental" Condition:* Lewis explicitly worries about "accidental" regularities (e.g., everyone wears hats because it's raining, not because they coordinate). The regularity must be sustained by the *system of expectations*.

  3.  **Analyze the Exchange Move-by-Move:**

      *   **Move 1 (Ana):** Lewis's 'non-accidental' = evolutionary stability. If cultural selection maintains it, it's not a coincidence.
          *   *Critique:* This conflates *causal* non-accidentality with *intentional/normative* non-accidentality. Lewis cares about *why* agents act, not just why the pattern persists.
          *   *Verdict:* Ana is stretching Lewis. Lewis is a rationalist, not an evolutionist (in this text).

      *   **Move 2 (Ben):** Non-accidental isn't just causal; it's tied to common interest and *mutual expectations*. Stable regularity $\neq$ convention if no expectations.
          *   *Critique:* This aligns closely with Lewis's text. Lewis emphasizes the *reasons for action*. If I drive on the right because I expect you to, that's convention. If I drive on the right because a wall forces me to, that's not.
          *   *Verdict:* Ben is textually more accurate to Lewis.

      *   **Move 3 (Ana):** Expectations can be selected too. Agents who expect/conform do better.
          *   *Critique:* This is a valid move in *evolutionary game theory* (e.g., Skyrms). It attempts to bridge the gap. It suggests expectations can be implicit/behavioral rather than conscious.
          *   *Verdict:* Ana is right that this is a coherent theoretical move, but does it save Lewis? Lewis requires *belief/expectation* states, not just behavioral dispositions.

      *   **Move 4 (Ben):** That's circular. Saying regularity is stable *because* people expect it assumes the convention exists. Lewis explains what a convention *is*, not just re-describes a stable population.
          *   *Critique:* Ben hits on the "explanatory priority" problem. If the explanation of the expectation relies on the existence of the convention, you can't use the expectation to define the convention. However, evolutionary accounts usually say expectations emerge *from* the regularity, not precede it. Ben's charge of circularity might be slightly off regarding the evolutionary mechanism, but right about the *definition*.
          *   *Verdict:* Ben is right about the definitional circularity risk, but maybe too quick to dismiss the evolutionary genesis story.

      *   **Move 5 (Ana):** Not circular, it's diachronic. Selection $\rightarrow$ Regularity $\rightarrow$ Expectations $\rightarrow$ Convention.
          *   *Critique:* This creates a "pre-conventional" phase. Lewis defines convention synchronically (at time $t$). Ana is proposing a genealogy. Lewis might accept that conventions *originate* this way, but for it to *be* a convention at time $t$, the expectations must be active.
          *   *Verdict:* Ana saves the evolutionary story but potentially changes the subject from "What is a convention?" to "How do conventions emerge?"

  4.  **Synthesize the "What They Are Missing" (The User's Intuition):**
      *   The user suspects a difference between *stability* and *convention*.
      *   *The Missing Piece:* **Normativity/Reason-Giving.** Lewisian conventions provide *reasons for action* to the agents. Evolutionary stability provides a *causal explanation* to the observer.
      *   *The Missing Piece 2:* **Common Knowledge.** Lewis requires a specific epistemic state (Common Knowledge). Evolution accounts often downgrade this to "as if" knowledge.
      *   *The Missing Piece 3:* **Arbitrariness.** Both touch on it, but the *recognition* of arbitrariness is key for Lewis.

  5.  **Drafting the Response:**
      *   *Structure:* Introduction (acknowledge the depth of the debate), Move-by-Move Adjudication, Overall Winner, What They Are Missing (The "PhD Level" Insight).
      *   *Tone:* Academic, precise, respectful of both sides, validating the user's intuition.
      *   *Key References:* Lewis (1969), Millikan (language conventions), Skyrms (evolution of the social contract), Gilbert (plural subjects - as a contrast).

      *(Self-Correction during drafting)*: I need to be careful not to say Lewis *rejects* evolution. Lewis acknowledges learning. But his *definition* is rationalistic. Ana is arguing for a *revision* or *naturalization* of Lewis. Ben is arguing for *exegesis*. I need to clarify this distinction. Ana is doing "Neo-Lewisian" work; Ben is doing "Lewis Exegesis."

      *Refining Move 4:* Ben's circularity charge is actually about the *definition*. If you define convention by expectations, you can't define expectations by the convention. Ana's diachronic story solves the causal circle but leaves the synchronic definition open. I need to make sure this nuance is clear.

      *Refining the "Missing" section:* The user's intuition is spot on. The distinction is between *Observer-Relative Stability* (Ana) and *Agent-Relative Reasoning* (Ben/Lewis). Also, mention the "Arbitrariness" condition specifically. A stable norm might not be arbitrary (e.g., traffic lights vs. driving side). Lewis requires alternative equilibria.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Adjudicate move by move? Yes.
      *   Who is right about which specific point? Yes.
      *   What are they missing? Yes.
      *   Address the user's intuition? Yes.

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a classic debate in social ontology, touching on the tension between **rationalist/game-theoretic accounts** (Lewis's original intent) and **naturalist/evolutionary accounts** (the "Neo-Lewisian" turn taken by scholars like Brian Skyrms or Ruth Millikan).

  Your intuition is correct: there is a categorical difference between a regularity being *stable* (causal persistence) and a regularity being a *convention* (normative/epistemic status).

  Here is the adjudication move-by-move, followed by an analysis of what both are missing.

  ### Move-by-Move Adjudication

  **Move 1 (Ana):** *Lewis's 'non-accidental' condition is satisfied by evolutionary stability.*
  *   **Verdict:** **Ana is wrong about Lewis, but right about the literature.**
  *   **Analysis:** Textually, Lewis is a rationalist. For Lewis, a regularity is "non-accidental" not because it survived selection, but because it is sustained by a specific system of **preferences and beliefs**. If a behavior persists solely due to blind selection (like moths camouflaging against trees), Lewis would call that a biological adaptation, not a convention. Ana is importing a naturalized interpretation (common in post-1990s social ontology) that Lewis himself did not hold. She is redefining "non-accidental" to mean "causally robust" rather than "intentionally sustained."

  **Move 2 (Ben):** *Non-accidental is tied to agents' common interest and mutual expectations. Stability without expectation is not a convention.*
  *   **Verdict:** **Ben is right.**
  *   **Analysis:** This is the core of Lewis's definition. Lewis distinguishes conventions from mere habits or forced regularities by the **reasons for action**. I drive on the right *because* I expect you to, and I prefer to coordinate. If I drive on the right because a barrier prevents me from going left, it is stable but not a convention. Ben correctly identifies that Lewis's "non-accidental" condition is epistemic/normative, not merely causal.

  **Move 3 (Ana):** *Expectations can be selected too. Agents who expect the regularity do better.*
  *   **Verdict:** **Ana is theoretically coherent, but shifts the goalposts.**
  *   **Analysis:** Ana is describing **Evolutionary Game Theory** (e.g., Skyrms). In this framework, "expectation" is often modeled as a behavioral disposition rather than a conscious mental state. She is arguing that the *functional role* of expectation can be evolved. This is a valid philosophical position, but it requires weakening Lewis's requirement for *belief* states. She is arguing for a *revision* of Lewis, not an interpretation of him.

  **Move 4 (Ben):** *That's circular. To say regularity is stable because people expect it assumes the convention exists.*
  *   **Verdict:** **Ben is right about the definitional risk.**
  *   **Analysis:** Ben identifies the **Explanatory Priority Problem**. If you define a convention by the presence of expectations, you cannot explain the convention by the presence of expectations without circularity. For Lewis, the expectations and the regularity are mutually sustaining in a synchronic equilibrium. If Ana uses the stability to explain the expectations, and the expectations to define the convention, she risks a loop. Ben is protecting the *conceptual* integrity of the definition.

  **Move 5 (Ana):** *It's not circular, it's diachronic. Selection $\rightarrow$ Regularity $\rightarrow$ Expectations $\rightarrow$ Convention.*
  *   **Verdict:** **Ana is right about genealogy, Ben is right about ontology.**
  *   **Analysis:** Ana successfully defends the evolutionary story as a **genealogy** (how conventions *emerge*). She is correct that a regularity can exist first (as a brute habit), and expectations can crystallize around it later. However, Ben is correct that until those expectations crystallize, the population does not *have* a Lewisian convention yet. Ana describes the *birth* of a convention; Ben describes the *life* of a convention.

  ---

  ### Overall Adjudication

  **Who wins?**
  **Ben wins on exegesis; Ana wins on extension.**

  *   **Ben** is more faithful to David Lewis's 1969 text. Lewis's account is fundamentally about **rational agency** and **common knowledge**. He wants to know what state of mind distinguishes a convention from a coincidence. Ben protects this distinction.
  *   **Ana** is more faithful to contemporary **Social Ontology**. Most modern philosophers agree that Lewis's rationalism is too demanding (it requires too much cognitive overhead for simple norms). Ana is arguing for a "naturalized Lewis" where the "expectations" are implicit in the evolutionary stable strategy.

  **However, regarding your specific question ("Who is right about Lewis?"): Ben is right.** Lewis requires the agents to have reasons, not just the population to have stability.

  ---

  ### What Both Are Missing (The PhD Level Insight)

  Your intuition that "stability $\neq$ convention" is the key to the missing pieces. Both Ana and Ben are arguing within a framework that assumes Lewis's definition is the final word, either to be defended (Ben) or naturalized (Ana). They are both missing three crucial distinctions that social ontology has developed since 1969.

  #### 1. The Distinction Between *Cause* and *Reason*
  This is the heart of your intuition.
  *   **Ana** focuses on the **Cause**: Why does this pattern persist? (Selection).
  *   **Ben** focuses on the **Reason**: Why do agents act? (Expectations).
  *   **The Missing Piece:** A Lewisian convention requires that the *cause* of the action be the *reason* for the action.
      *   If I follow a norm because I am biologically programmed to (Ana's strong selection), it is stable but not a convention.
      *   If I follow a norm because I believe you will (Ben's view), it is a convention.
      *   **The Gap:** Ana needs to explain how a selected disposition becomes a *reason* for the agent. Merely having an evolved disposition to expect $X$ is not the same as holding the belief that $X$ will occur. Lewis requires the latter.

  #### 2. The "Arbitrariness" Condition (The Alternative Equilibrium)
  Both Ana and Ben focus on the "non-accidental" condition, but they neglect Lewis's **Arbitrariness Condition**.
  *   For Lewis, a convention must be arbitrary in the sense that there was a viable alternative ($R'$).
  *   **The Missing Piece:** A regularity can be evolutionarily stable (Ana) and supported by expectations (Ben) but still **not be a convention** if there was no alternative.
      *   *Example:* If everyone avoids fire because it burns, it is stable, expected, and non-accidental. But it is not a convention because there is no alternative equilibrium where we all touch fire and coordinate.
      *   Neither Ana nor Ben checked if the regularity is *arbitrary*. A stable norm could be a "natural norm" (forced by the environment) rather than a convention.

  #### 3. Common Knowledge vs. Mutual Belief
  Lewis originally required **Common Knowledge** (I know that you know that I know...).
  *   **Ben** mentions "mutual expectations," which is weaker.
  *   **Ana** implies implicit expectations via selection.
  *   **The Missing Piece:** Much of post-Lewisian ontology (e.g., Margaret Gilbert, Raimo Tuomela) argues that Lewis's epistemic requirements are too high. They propose **Plural Subjects** or **We-Intentions**.
      *   The debate between Ana and Ben assumes the Lewisian framework is sufficient. A third option is that conventions require a **joint commitment** that neither evolutionary stability (Ana) nor mutual expectation (Ben) fully captures. You can have stable expectations without a normative obligation. Conventions often carry a "ought" (you *should* drive on the right) that mere stability lacks.

  ### Summary for Your Seminar
  If you want to intervene effectively:
  1.  **Validate Ben:** He is right that Lewis requires agent-level reasons, not just population-level stability.
  2.  **Validate Ana:** She is right that evolutionary accounts explain the *genesis* of expectations without circularity.
  3.  **Deploy Your Intuition:** Point out that **Stability + Expectation $\neq$ Convention** without **Arbitrariness**. Ask them: "If a regularity is stable and expected, but there was no alternative equilibrium (e.g., everyone breathes air), is it a convention?"
  4.  **The Normative Gap:** Ask Ana: "Does evolutionary stability generate a *normative obligation* to conform, or just a *disposition*?" Lewisian conventions imply a pro-tanto reason to conform; evolutionary stability implies only a causal tendency. That is the difference between a norm and a habit.
