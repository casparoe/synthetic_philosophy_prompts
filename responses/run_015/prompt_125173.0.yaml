  1. Model this as an episodic POMDP where two distinct states map to a single observation, forcing a shared policy parameter $p$ for continuation. The planning-time solution optimizes the expected return $J(\pi)$ over the occupancy measure induced by $p$, yielding $p=2/3$. The execution-time solution computes a posterior belief over current state given arrival, then selects the action maximizing expected return given that belief, yielding a divergent $p$.

  2. The aliasing mechanism and belief-state construction translate perfectly, as RL explicitly handles partial observability via posterior distributions over hidden states. The occupancy measure cleanly captures the visitation frequencies resulting from the shared policy parameter, allowing standard policy-gradient objectives to recover the planning-time optimum. This confirms the mathematical machinery for optimizing parameterized policies under observation constraints is robust.

  3. The distortion arises in modeling execution-time deliberation as a distinct optimization step rather than simple sampling from the pre-computed policy. RL assumes the executor blindly follows $\pi_\theta$, whereas AMD posits an agent re-evaluating $\theta$ locally using the very occupancy measure created by $\theta$. This conflation of planner and executor creates the apparent inconsistency where the policy is not time-consistent.

  4. Framing as a Dec-POMDP relocates the puzzle to equilibrium stability rather than dissolving it. Execution noise acts as environment dynamics, and the limit converges to the noiseless case only if the optimizer robustly accounts for perturbations during training. Standard RL resamples actions per timestep, but AMD requires a single latent variable per episode, breaking the independent sampling assumption. Off-policy evaluation fails because the importance ratio correction cannot disentangle the policy change from the resulting shift in the state-visitation distribution that generated the data.

  5. The irreducible residue is indexical uncertainty, where the state identity depends on the agent's own future actions, violating the causal fixedness assumed in POMDP belief updates. This indicts the RL framework's strict separation between parameter optimization and execution, not the paradox itself. Ship the planning-time policy ($p=2/3$), as re-deliberation at execution is merely computational waste that degrades the global objective function.
