          3.  Generalization: Any disposition can be "masked" by some obstacle. No disposition guarantees an S-M conditional.
          4.  Radical Conclusion: A fragile glass might be fragile even if there's *no* possible situation where fragility makes a difference to breaking. Dispositions are inert labels.
          5.  Flatmate's Moral: Dispositions are categorical intrinsic properties; the conditional analysis is wrong.
      *   **User's Intuition:** The argument proves too much. The cheat is between (3) and (5). Wants to keep (1) (or something close to it) rather than accept the conclusion.
      *   **Specific Question:** Which step to reject? What does it cost?
      *   **Secondary Question:** Is the "packing foam" case the same as the "electro-fink" case? Does the difference matter?

  2.  **Deconstruct the Flatmate's Argument (Philosophical Diagnosis):**
      *   *Step (1):* This is the Simple Conditional Analysis (SCA). It's widely known to be false since Martin (1994) and Johnston (1992).
      *   *Step (2):* This is a "Masking" counterexample. The foam *masks* the fragility. It doesn't remove the disposition, but prevents the manifestation.
      *   *Step (3):* Generalization. This is the move from "some conditionals fail" to "no conditional works."
      *   *Step (4) & (5):* The Leap. Just because *simple* conditionals fail doesn't mean *no* conditional analysis works, and it definitely doesn't mean dispositions are inert or have no connection to their manifestations.
      *   *Conclusion:* Dispositions are categorical. (This is a specific metaphysical stance, not forced by the failure of SCA).

  3.  **Identify the Weak Links:**
