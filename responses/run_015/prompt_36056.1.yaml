      *   **Explain the Fix (The Cost):** To keep the conditional link, we need a *Modified* Conditional Analysis (MCA). We need "ceteris paribus" (all else being equal) clauses or "in appropriate conditions."
      *   **Cost:** It makes the analysis less reductive. You can't define "fragile" *purely* in terms of conditionals without referencing the disposition itself or "normal conditions" (which might be circular or vague).
      *   **Address Fink vs. Foam:** Explain the distinction (Fink = loss of power; Mask = blocking of power). Show that the flatmate is right that both kill SCA, but wrong that they kill *any* connection.
