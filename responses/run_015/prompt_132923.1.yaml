  8.  **Refining the "Empty View" Tipping Point:**
      If "binding" is defeasible by *any* strong present preference, then DNB does no work. If it's indefeasible, akrasia becomes impossible (because if you acted, the binding must have been defeated, so it wasn't binding?). Need to find the sweet spot.

  9.  **Final Review against User Prompt:**
      *   Did I sort from decisive to awkward? Yes.
      *   Did I answer the specific questions (empirical, no prior judgment, collapse, unfalsifiability)? Yes.
