prompt: |-
  Hey — I'm a junior in a comparative politics seminar this semester and we're on the democracy unit, the one where every week the reading is about Hungary, then Poland, then Turkey, and now increasingly the US, and I got hired (kind of by accident) as a research assistant for a professor who's building an event-level dataset on democratic erosion. My job, with one other undergrad, is to read somewhere between forty and sixty news items a week and code each one as either backsliding, ordinary political conflict, or not enough information. We got a two hour training and a codebook that is basically three paragraphs long. We already disagree constantly, partly because neither of us knows much about any of these countries and partly because my roommate — same seminar, very online — keeps saying the whole concept is just a fancy way of saying "a government I don't like did something," and honestly when we went around the room in section, almost everyone coded based on whether they liked the party in power. So what I want is something I can actually run in about ten minutes an item, with only the article in front of me and a notepad, that I could also defend if someone on the other side of the aisle in my seminar read my codes.

  What I'm asking for is a decision procedure in the order I'd run it: the questions, what counts as an adequate answer to each one given that I'm an undergrad with no country expertise, the point where the procedure stops with a hard no and I log "do not code," and the point where it hands the item to the lead RA because the question is really about values or interpretation rather than facts. There are five things I keep tripping over and I want the procedure to actually handle them rather than hand-wave. First, telling apart "they changed the rules of the game" from "they passed a policy I dislike inside the existing rules," which I think is the crux of the whole concept but I have no idea how to make it mechanical. Second, the packaging problem: a lot of my items are about a single measure that plenty of healthy democracies also have (changing a judicial retirement age, redrawing districts, tightening voter ID), and each one looks fine on its own, so I need to know how to handle a small change that's really one slice of a pattern when I only ever see one item at a time. Third, cases where nothing legal changed but officials just stopped complying with something — court rulings, certification of results — since that's a change in practice and not a change in rules, and I don't know if it belongs in a dataset of events at all. Fourth, the "they won an election, so they get to do this" defense: whether an electoral mandate should count for or against coding something. And fifth, some actual guard against my own bias, a step I have to do before I log a code — maybe running the same test on an imagined government with the opposite platform, or asking what coalition would be needed to reverse the change compared to the one that passed it — and writing the answer down in an audit line so the professor can adjudicate later.

  Then please run the finished procedure on three cases, and write them up so I can see where it bites. Use these composites (I'm deliberately not naming specific laws or dates because I don't trust myself to get them right): (a) a governing party with a legislative supermajority rewrites the electoral formula and, over several years, regional news outlets end up under a foundation run by its allies, with public advertising money following them; (b) a government lowers the retirement age for supreme court judges and creates a new disciplinary body for judges, then loses the next election, and its successor replaces the leadership of the public broadcaster by ministerial decree, saying it's undoing the previous capture; (c) a state legislature redraws congressional districts mid-decade at the request of the national president's party, and a state body takes over a county election board. One of those three has to be a case where the procedure gives an answer I won't like — I'd rather see that than a clean sweep — and I want you to say plainly which one it is and why the procedure can't soften it. Finally, tell me what the procedure can't do: where it will misfire, what kinds of items it's simply the wrong instrument for, and which parts of it are really just me making a judgment call with extra steps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Junior undergrad, comparative politics seminar, research assistant (RA) for a professor.
      *   **Task:** Coding news items for a dataset on "democratic erosion" (backsliding vs. ordinary conflict vs. insufficient info).
      *   **Constraints:** 40-60 items/week, 10 minutes/item, limited expertise (no country knowledge), short codebook (3 paragraphs), high disagreement with co-RA, potential bias (admitted by user and peers).
      *   **Goal:** A concrete, mechanical decision procedure (flowchart-style) to reduce bias, handle specific edge cases, and be defensible in a seminar setting.
      *   **Specific Pain Points (The "Five Things"):**
          1.  Rule-changing vs. Policy-making (within rules).
          2.  The "Packaging Problem" (isolated events vs. pattern).
          3.  Norm violation vs. Legal change (practice vs. rules).
          4.  Electoral Mandate defense ("we won, so we can do this").
          5.  Bias Guard (audit step).
      *   **Deliverables:**
          1.  The Decision Procedure (step-by-step).
          2.  Application to 3 Composite Cases (a, b, c).
          3.  Identification of the "Uncomfortable Answer."
          4.  Limitations/Meta-analysis of the procedure itself.

  2.  **Deconstruct the Core Concept (Democratic Erosion/Backsliding):**
      *   Academic consensus (Levitsky & Ziblatt, Bermeo, etc.) usually focuses on *institutional* changes that skew the playing field, reduce accountability, or remove checks and balances, often *legal* but *anti-democratic* in effect.
      *   Key distinction: Is this reversible by normal politics? Does it lock in power? Does it target opponents specifically?
      *   Since the user is an undergrad with limited time/knowledge, the procedure must rely on *textual evidence* within the article, not external knowledge.

  3.  **Drafting the Decision Procedure (Iterative Process):**
      *   *Step 1: Triage.* Is there enough info? (Stop early if no).
      *   *Step 2: The "Rule vs. Policy" Test (Pain Point 1).* Does this change *how* winners are picked or *how* power is checked, or just *what* government does?
      *   *Step 3: The "Packaging" Test (Pain Point 2).* Since the RA sees one item at a time, they can't know the pattern. *Solution:* Look for textual markers of accumulation ("further," "again," "part of reform package"). If isolated, code as ordinary unless the *mechanism* itself is inherently anti-democratic (e.g., ignoring a court order).
      *   *Step 4: The "Norms/Practice" Test (Pain Point 3).* Did they break a rule or ignore a constraint? This counts as erosion even if legalistic.
      *   *Step 5: The "Mandate" Test (Pain Point 4).* Winning an election allows policy, not institutional capture.
      *   *Step 6: The Bias Audit (Pain Point 5).* The "Opposite Party Test."
      *   *Decision Nodes:* Backsliding, Ordinary Conflict, Insufficient Info, Escalate to Lead RA.

  4.  **Refining the Procedure for Speed (10 mins/item):**
      *   Needs to be a checklist, not an essay.
      *   Needs clear "Stop" points.
      *   Needs to address the "Lead RA" handoff condition clearly (value judgments).

  5.  **Developing the Three Test Cases:**
      *   *Case A (Supermajority + Media Capture):* Classic backsliding. Changing electoral formula + state resources to allies.
      *   *Case B (Judges + Public Broadcaster):* Mixed. Judicial retirement is often backsliding. *However*, the new government undoing the capture via decree is tricky. Is it restoration or more erosion? This is likely the "Uncomfortable Answer" case.
      *   *Case C (Mid-decade Redistricting + County Board):* Partisan gerrymandering + state takeover of local election admin. High erosion risk.

      *Wait, I need to ensure one case gives an answer the user "won't like."*
      *   If I code Case B's *second half* (new gov undoing capture via decree) as "Backsliding" because it uses the same method (decree) as the bad guys, that might be uncomfortable but defensible.
      *   Alternatively, if I code Case C as "Ordinary Conflict" because redistricting is technically legal in some places, that might be uncomfortable given the context of election board takeovers.
      *   *Better choice:* Case B involves a "good guy" action (undoing capture) using "bad guy" methods (ministerial decree). The procedure should flag the *method* regardless of the *actor*. This challenges the "government I don't like" bias. Let's make the procedure flag the *successor's* action as potentially erosive too, or at least require escalation. Actually, the prompt asks for *one* case where the procedure gives an answer I won't like. Let's make Case C the tricky one. Mid-decade redistricting is often legal but erosive. If the procedure says "Ordinary" because it's legal, that's bad. If it says "Backsliding" because it targets opposition, that's good.
      *   *Re-evaluating:* The prompt asks for *one* case where the procedure gives an answer the user won't like. Let's look at Case B again. The successor government replacing leadership by decree. If the procedure codes this as "Backsliding" (because it bypasses normal appointment channels), the user might dislike it because it's the "good guys" fixing things. This highlights the neutrality of the tool.
      *   *Actually, let's look at Case A.* It's the most obvious backsliding.
      *   *Let's look at Case C.* State legislature redrawing mid-decade. In the US, this is often legal but norm-breaking. If the procedure codes it as "Ordinary Conflict" because it's within statutory authority, that might be the "uncomfortable" truth about datasets—they miss nuance.
      *   *Decision:* I will structure Case B to be the uncomfortable one. The successor government uses a *ministerial decree* to fix the broadcaster. The procedure should flag this as "Backsliding" or "Escalate" because the *method* (executive decree bypassing board independence) is the same, even if the *intent* is restorative. This forces the user to confront that *means matter more than ends* in this dataset.

  6.  **Addressing the Five Pain Points in the Procedure:**
      1.  *Rule vs. Policy:* Question: "Does this change who can win or how they are checked?"
      2.  *Packaging:* Question: "Does the text imply this is cumulative?" If no, treat as isolated but flag mechanism.
      3.  *Norms/Practice:* Question: "Did an official ignore a binding constraint?"
      4.  *Mandate:* Question: "Does the article claim the election win justifies *institutional* change?" (Answer should be No).
      5.  *Bias:* The "Opposite Party Test" audit line.

  7.  **Drafting the Limitations Section:**
      *   Can't detect slow boils without context.
      *   Can't judge intent, only mechanism.
      *   Relies on journalistic framing (if the article doesn't mention the court ruling was ignored, the RA won't know).
      *   "Backsliding" is a label that implies moral judgment, even if the procedure tries to be mechanical.

  8.  **Review against Constraints:**
      *   10 minutes? Yes, if checklist is tight.
      *   Defensible? Yes, based on institutional mechanics, not policy preference.
      *   Undergrad friendly? Avoid jargon where possible.

  9.  **Final Polish:**
      *   Tone: Peer-to-peer, practical, slightly cynical but rigorous.
      *   Structure: Procedure first, then Cases, then Limitations.
      *   Ensure the "Uncomfortable Answer" is explicitly identified.

  *(Self-Correction during drafting)*: I need to make sure the "Lead RA" handoff is clear. If the procedure can't solve it, don't let the undergrad guess. That's a safety valve.
  Also, for the "Packaging Problem," since the RA only sees one item, they can't *know* it's a pattern. The procedure must instruct them to code based on the *inherent* nature of the event, but add a "Context Flag" if the text hints at a series.
  For the "Bias Guard," I need a specific written line they must fill out.

  Let's refine the "Uncomfortable Case."
  Case B: Successor gov replaces broadcaster leadership by decree.
  If I code this as "Backsliding," the user might hate it because it's the "good guys."
  If I code this as "Ordinary," it ignores the method.
  The procedure should prioritize *method* over *actor*. So, using a decree to bypass an independent board is erosive, regardless of who does it. This will be the uncomfortable truth.

  Let's refine Case C. Mid-decade redistricting. In many US states, this is legal. If the procedure codes it as "Ordinary," the user might hate it because it feels like erosion. If the procedure codes it as "Backsliding," it might be factually wrong regarding the law.
  Actually, Case B is stronger for the "means over ends" lesson. I'll stick with that.

  Okay, ready to write.
answer: |-
  Here is a decision procedure designed for your constraints: 10 minutes per item, no external knowledge required, defensible in a seminar, and built to handle the five specific friction points you identified.

  ### The "10-Minute Institutional Mechanics" Protocol

  **Pre-Step: The Bias Audit (Do this *before* reading for content)**
  *   **Action:** Look at the headline and the governing party named.
  *   **Write Down:** "If the [Opposite Party/Coalition] did this exact same thing, would I call it an emergency?"
  *   **Rule:** If your gut says "No," you must find *two* specific institutional mechanisms in the text to code as **Backsliding**. If you can't find two, you must default to **Ordinary Conflict** or **Escalate**.

  ---

  #### Step 1: The Sufficiency Check (Time limit: 2 mins)
  *   **Question:** Does the article describe a specific action taken by a state official or body?
  *   **Criteria:**
      *   **Yes:** Proceed to Step 2.
      *   **No (Opinion/Speculation):** Code **Insufficient Info**. (e.g., "Critics worry the government *might*...")
      *   **No (Pure Policy):** Code **Ordinary Conflict**. (e.g., "Government raises taxes," "Government cuts welfare," "Government declares war.")
  *   **Stop Rule:** If the article is purely about economic policy, foreign policy, or social policy *without* changing the rules of politics, stop. Log as **Ordinary Conflict**.

  #### Step 2: The Rule vs. Policy Test (Handling Pain Point #1)
  *   **Question:** Does this action change *how* winners are picked, *how* power is checked, or *who* is allowed to participate?
  *   **Look For:** Keywords like "law," "amendment," "constitution," "jurisdiction," "eligibility," "term limit," "appointment process."
  *   **Decision:**
      *   **No (Policy within rules):** Code **Ordinary Conflict**. (e.g., Using a majority to pass a budget).
      *   **Yes (Changing the machinery):** Proceed to Step 3.
      *   **Unclear:** Log **Escalate to Lead RA**.

  #### Step 3: The "Packaging" & Context Check (Handling Pain Point #2)
  *   **Question:** Does the text indicate this is an isolated event or part of a sequence?
  *   **Look For:** Words like "further," "again," "latest in a series," "package," "reform bill."
  *   **Decision:**
      *   **Explicitly Cumulative:** Proceed to Step 4.
      *   **Isolated/Single Event:** Proceed to Step 4, *but* you must apply the **High Bar Rule**: A single legal change is only **Backsliding** if it removes a check on power *immediately* (e.g., firing a court, banning a party). If it just changes a parameter (e.g., retirement age), code **Ordinary Conflict** unless Step 4 fails.
      *   **Why:** You cannot code a pattern you cannot see. You must code the *inherent* risk of the specific event.

  #### Step 4: The Norms & Practice Test (Handling Pain Point #3)
  *   **Question:** Did an official ignore a binding constraint (court order, certification rule, constitutional deadline)?
  *   **Look For:** "Refused to certify," "Ignored ruling," "Bypassed legislature," "Decree used where law required vote."
  *   **Decision:**
      *   **Yes (Constraint Ignored):** Code **Backsliding**. (Practice erosion counts even if legalistic).
      *   **No (Followed procedure):** Proceed to Step 5.

  #### Step 5: The Mandate Defense (Handling Pain Point #4)
  *   **Question:** Does the article justify the action solely based on an election win?
  *   **Rule:** An electoral mandate justifies *policy*, not *institutional capture*.
  *   **Decision:**
      *   If the text says "They have a mandate to change the *court structure*," ignore the mandate claim. Treat as Step 2 (Rule Change).
      *   **Test:** Could the opposition do this if they won next time?
          *   **Yes (Reversible by election):** Code **Ordinary Conflict**.
          *   **No (Locks out future opposition):** Code **Backsliding**.

  #### Step 6: Final Bias Audit (Handling Pain Point #5)
  *   **Action:** Review your Step 1 note.
  *   **Question:** Did I apply the "Opposite Party Test" consistently?
  *   **Write Down:** "Mechanism identified: [e.g., Executive Decree]. Reversibility: [e.g., Requires 2/3 vote to undo]."
  *   **Decision:**
      *   If you cannot identify the *mechanism* (the legal tool used) without using emotional language ("authoritarian," "corrupt"), you must log **Escalate to Lead RA**.
      *   Otherwise, Log Code.

  ---

  ### Application to Composite Cases

  Here is how the protocol processes your three composites. I have included the "Audit Line" you would write in your notepad.

  #### Case A: Supermajority, Electoral Rewrite, Media Foundation
  *   **Step 1 (Sufficiency):** Specific actions taken (rewrite formula, fund foundation). **Pass.**
  *   **Step 2 (Rule vs. Policy):** Changes electoral formula (how winners picked) and state advertising allocation (resource access). **Pass.**
  *   **Step 3 (Packaging):** Text says "over several years... outlets end up under foundation." Indicates cumulative effect. **High Bar Met.**
  *   **Step 4 (Norms):** Legal changes, but resource allocation skews playing field.
  *   **Step 5 (Mandate):** Supermajority used to rewrite rules, not just pass policy. Not reversible by simple election (rules are rigged).
  *   **Step 6 (Audit):** "Mechanism: Electoral law amendment + State resource diversion. Reversibility: Low (requires supermajority to fix rigged rules)."
  *   **Final Code:** **Backsliding.**
  *   **Why:** It changes the rules of competition and locks in resource advantages.

  #### Case B: Judicial Retirement, Disciplinary Body, Successor Decree on Broadcaster
  *   **Step 1 (Sufficiency):** Specific actions taken. **Pass.**
  *   **Step 2 (Rule vs. Policy):**
      *   *Part 1 (Judges):* Retirement age + disciplinary body changes court independence. **Pass.**
      *   *Part 2 (Broadcaster):* Successor gov uses *ministerial decree* to replace leadership. **Pass.**
  *   **Step 3 (Packaging):** Two distinct events. Code them separately.
      *   *Item 1 (Judges):* Cumulative (age + discipline).
      *   *Item 2 (Broadcaster):* Isolated event in this article.
  *   **Step 4 (Norms):**
      *   *Item 1:* Legal changes, but target independence.
      *   *Item 2:* **Constraint Ignored?** Public broadcasters usually require board consensus or legislative vote. Decree bypasses this.
  *   **Step 5 (Mandate):** Successor claims "undoing capture."
      *   *Test:* Is this reversible? If the *next* gov uses a decree to fire *them*, is that okay? No. The *method* (decree) bypasses the check.
  *   **Step 6 (Audit):** "Mechanism: Ministerial Decree. Reversibility: High (next decree), but Method bypasses independent board."
  *   **Final Code:** **Backsliding** (for the Broadcaster item).
  *   **Why:** The procedure codes the *method*, not the *intent*. Using executive decree to bypass an independent board is erosive, even if the "good guys" do it to fix "bad guy" capture.

  #### Case C: Mid-Decade Redistricting, County Board Takeover
  *   **Step 1 (Sufficiency):** Specific actions taken. **Pass.**
  *   **Step 2 (Rule vs. Policy):** Redistricting (how winners picked) + Board Takeover (who administers votes). **Pass.**
  *   **Step 3 (Packaging):** Redistricting is often periodic. Takeover is specific.
      *   *High Bar:* Is mid-decade redistricting inherently erosive? In some systems, yes. In others, no.
  *   **Step 4 (Norms):** State body takes over county board. This removes local oversight.
  *   **Step 5 (Mandate):** "At request of national president's party." Indicates partisan motive, not neutral admin.
  *   **Step 6 (Audit):** "Mechanism: State preemption of local election admin. Reversibility: Low (requires state law change)."
  *   **Final Code:** **Backsliding.**
  *   **Why:** Taking over election administration during a cycle skews the playing field significantly.

  ---

  ### The Uncomfortable Answer

  **Case B (The Broadcaster Item)** is the one where the procedure will give you an answer you might not like.

  **Why:** Your roommate and your seminar peers are likely to code the *successor government's* action as "Restoring Democracy" (Ordinary/Positive). The procedure forces you to code it as **Backsliding** (or at least Escalate) because the *mechanism* (ministerial decree bypassing an independent board) is identical to the tool used by autocrats to capture media.

  **The Hard Truth:** If your dataset is about *democratic erosion*, it must measure the erosion of *institutions*, not the victory of *your preferred team*. If you code the "good guys" breaking norms as "Ordinary Conflict," you are validating the tool for the "bad guys" to use later. The procedure bites here because it demands neutrality on *means*. You have to log that using a decree to fire a public broadcaster head is erosive, even if you cheer the result.

  ### Limitations: Where This Procedure Misfires

  You asked for honesty about where this tool fails. Here is where it will break:

  1.  **The "Slow Boil" Blindness:** Because you only see one item at a time (Pain Point #2), you will under-code erosion. A single judicial retirement age change looks "Ordinary." It is only "Backsliding" in the aggregate. The procedure tries to mitigate this with the "High Bar Rule," but you will still miss the forest for the trees. *Mitigation:* Trust the "Escalate" option if an item feels weirdly technical but targets a check on power.
  2.  **Journalistic Framing Bias:** You are coding based on the article. If the journalist doesn't mention that the court ruling was binding (Pain Point #3), you will code "Ordinary." You are dependent on the press's understanding of the law, not the law itself.
  3.  **The "Legalistic Autocrat" Problem:** Smart autocrats write laws that look democratic. If the article says "Parliament voted 2/3 to change the court," the procedure might log "Ordinary" because it followed the rules. This is the hardest thing to catch without country expertise. *Mitigation:* Rely heavily on Step 5 (Reversibility). If the change makes it impossible for the opposition to win even if they get more votes, it's Backsliding, even if the vote count was legal.
  4.  **Judgment Calls with Extra Steps:** Step 6 (Audit) is still a judgment call. You are deciding what counts as a "binding constraint." The procedure doesn't remove your brain; it just forces you to write down *why* you used it. If you and your co-RA disagree on whether a "ministerial decree" bypasses a "board," the procedure can't solve that. That is why the **Escalate to Lead RA** category exists. Use it.
  5.  **Values Masquerading as Facts:** The definition of "Backsliding" is inherently normative. Some scholars argue populism *is* democracy. By coding "Backsliding," you are accepting the professor's premise that liberal institutions = democracy. The procedure cannot defend that premise; it can only ensure you apply it consistently.

  **Final Advice:** When in doubt, **Escalate**. It is better to annoy the Lead RA with 10% of your items than to poison the dataset with 10% of your biases. If you can't explain the mechanism without saying "this is bad," you don't understand the mechanism yet.
