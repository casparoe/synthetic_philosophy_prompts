answer: |-
  **Project Title:** Beyond Qualia and Desire: A Structural-Phenomenal Reconstruction of Hedonism

  **1. Research Question**
  The central research question is: **Can the heterogeneity of pleasure be reconciled with a unified axiological foundation if pleasure is defined structurally as "unresisted endorsement" rather than qualitatively as a specific phenomenal feel?**

  This question admits a determinate answer. The project will conclude either that (a) "unresisted endorsement" successfully identifies a necessary and sufficient condition common to all intrinsic goods classified as pleasures, thereby salvaging hedonism from the heterogeneity objection, or (b) the feature fails to distinguish pleasure from other mental states (such as mere relief or neutral flow) or collapses into desire-satisfactionism, thereby confirming that the heterogeneity problem cannot be solved via structural features alone.

  **2. Theoretical Context and Gap Analysis**
  The heterogeneity problem poses a dilemma for classical hedonism: if pleasures differ radically in phenomenal character (e.g., the smell of a rose vs. solving a puzzle), what justifies grouping them as the sole intrinsic good? The existing literature largely accepts a false dichotomy in response.

  On one side, **Qualitative Hedonism** attempts to identify a common "hedonic tone." This view is widely regarded as untenable because introspection reveals no single quality shared by all pleasures. On the other side, **Attitudinal Hedonism** and **Desire-Satisfactionism** abandon the requirement for a specific phenomenal character, defining pleasure via pro-attitudes or desire fulfillment. While this solves heterogeneity, it risks severing the link between value and experience, rendering the theory indistinguishable from non-hedonistic accounts of welfare.

  The proposed project occupies a neglected middle ground. It accepts the heterogeneity objection against qualitative uniformity but rejects the move to purely attitudinal or desire-based accounts. The hypothesis is that the commonality is neither a *quality* nor a *pro-attitude* in isolation, but a specific **functional-phenomenal relation**: the coincidence of occurrent motivational orientation and the phenomenal field without experienced resistance. This structural angle remains genuinely open because existing debates have focused on the *content* of experience (qualia) or the *direction* of fit (desire), rather than the *dynamic relation* between motivation and phenomenology during the experience itself.

  **3. Methodology and Work Plan**
  The six-month timeline is divided into three phases: conceptual refinement, stress-testing, and comparative mapping.

  *   **Months 1–2: Conceptual Articulation**
      *   **Objective:** Rigorously define "unresisted endorsement."
      *   **Tasks:** Distinguish "unresisted endorsement" from mere "acquiescence" or "habit." Develop criteria for what constitutes "resistance" (e.g., cognitive dissonance, somatic tension, conflicting second-order desires) versus "coincidence."
      *   **Deliverable:** A working definition that specifies the necessary phenomenal markers of the structural relation.
      *   **Exit Criterion:** If the concept cannot be distinguished from general "satisfaction" or "contentment" by the end of Month 2, the project will pivot to a critique of structural accounts generally.

  *   **Months 3–4: Stress-Testing Against Hard Cases**
      *   **Objective:** Determine if the feature picks out all and only pleasures.
      *   **Tasks:** Apply the definition to four specific categories of counter-examples:
          1.  **Malicious Pleasure:** Does schadenfreude involve resistance (e.g., moral dissonance) that disqualifies it, or does it fit the model (threatening the normative appeal of hedonism)?
          2.  **Aesthetic Absorption:** In disinterested contemplation, is there a "motivational orientation" to endorse, or is the lack of desire incompatible with the model?
          3.  **Flow States:** In high-performance flow, self-conscious endorsement often vanishes. Does this count as "unresisted" or as a lack of the requisite relation?
          4.  **Cool Intellectual Satisfaction:** Does low-affect cognitive resolution possess the requisite phenomenal presence, or is it too cold to count as "endorsement"?
      *   **Deliverable:** A matrix of case studies indicating where the definition holds, requires adjustment, or fails.

  *   **Month 5: Mapping Rival Theories**
      *   **Objective:** Ensure the view is distinct from Desire-Satisfactionism and Objective-List accounts.
      *   **Tasks:**
          *   Compare against **Desire-Satisfactionism**: Demonstrate that "unresisted endorsement" requires the *phenomenal presence* of fulfillment, whereas desire theory only requires the *fact* of satisfaction. If the phenomenal component proves redundant, the project fails.
          *   Compare against **Objective-List Accounts**: Determine if "unresisted endorsement" is itself an objective good independent of the subject's valuation.
      *   **Deliverable:** A comparative analysis establishing the unique taxonomic position of the proposed view.

  *   **Month 6: Synthesis and Drafting**
      *   **Objective:** Finalize the argument and write the fellowship paper.
      *   **Tasks:** Integrate findings from the stress tests and rival mapping. Formulate the final verdict on the research question.
      *   **Deliverable:** A complete manuscript (6,000–8,000 words) suitable for submission to a peer-reviewed journal.

  **4. Deliverables and Success Conditions**
  *   **Successful Deliverable:** A polished paper arguing either for the viability of "structural hedonism" or for its impossibility. Success is defined by **argumentative resolution**, not by proving the hypothesis true. A definitive argument showing that "unresisted endorsement" *cannot* save hedonism is a successful outcome, as it closes a specific theoretical avenue.
  *   **Failure Conditions:**
      *   **Ambiguity:** If "unresisted endorsement" remains too vague to be tested against hard cases by Month 4.
      *   **Collapse:** If the distinction between this view and Desire-Satisfactionism proves untenable (i.e., if the phenomenal component adds no axiological weight).
      *   **Overreach:** If the project attempts to solve the general problem of well-being rather than remaining focused on the heterogeneity problem.
  *   **Scope Limit:** If the distinction collapses, the project will not attempt to salvage it by adding ad-hoc clauses. Instead, the final paper will document the collapse as evidence that the heterogeneity problem requires a non-hedonistic solution.

  **5. Scope Assessment and Risk Mitigation**
  The primary risk is that "unresisted endorsement" is merely a redescription of **Attitudinal Hedonism** (the view that pleasure is a pro-attitude toward experience). If the "phenomenal field" component is merely the object of the attitude rather than a constituent of the relation, the project offers no novelty.

  *   **Mitigation:** I will guard against this by insisting on the **occurrent** nature of the relation. Attitudinal hedonism often allows for dispositional pleasure (being pleased that *p* even while asleep or distracted). This project requires the *coincidence* of motivation and phenomenology to be experienced *at the time*. This strict requirement creates a clear boundary: if a subject satisfies a desire without experiencing the coincidence (e.g., finding out posthumously that a desire was fulfilled), it counts for Desire-Satisfactionism but fails the "unresisted endorsement" test.

  A secondary risk is that the scope is too large for six months. The literature on well-being is vast.
  *   **Mitigation:** The project is strictly bounded to the **heterogeneity problem**. I will not attempt to defend hedonism against the "experience machine" objection or the "parasitism" objection, except where they directly impinge on the definition of pleasure. The focus remains on the internal coherence of the category "pleasure," not the external defense of hedonism as a complete theory of the good.

  By isolating the structural relation between motivation and phenomenology, this project aims to clarify whether the heterogeneity problem is a fatal flaw for hedonism or merely a catalyst for a more sophisticated formulation.
