  2.  **Deconstruct the Core Idea ("Unresisted Endorsement"):**
      *   *What is it?* A functional-phenomenal relation. Not just *what* it feels like (qualia), not just *what* it is about (intentionality), but the *relation* between wanting/striving and experiencing.
      *   *Key Claim:* Pleasure = Mental state where motivation and phenomenology coincide without resistance.
      *   *Differentiation:* Needs to distinguish from Desire Satisfactionism (which doesn't require phenomenal presence) and Qualitative Hedonism (which requires a specific feel).
      *   *Hard Cases:* Malice (schadenfreude), Aesthetic absorption (disinterested?), Flow states (loss of self?), Cool intellectual satisfaction (low affect?).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and precise. *Reconstructing Hedonism: A Structural-Phenomenal Account of Pleasure and Value.*

      *   **1. Research Question:**
          *   Needs to be answerable. Not "Is hedonism true?" (too big).
          *   Focus on the specific mechanism.
          *   *Draft:* Can "unresisted endorsement" solve the heterogeneity problem?
          *   *Refinement:* "Does the structural feature of 'unresisted endorsement' successfully identify a uniform property across heterogeneous pleasures sufficient to ground hedonism, distinct from desire-satisfactionism?"
          *   *Final Polish:* Make it sharper. "Is the heterogeneity of pleasure compatible with a unified axiological foundation if pleasure is defined structurally as 'unresisted endorsement' rather than qualitatively as a specific feel?"

      *   **2. The Gap (Existing Positions):**
          *   *Standard View:* Qualitative Hedonism (Moore's critique, Feldman's adjustment) vs. Attitudinal Hedonism (Feldman) vs. Desire Theories (Griffin, Brandt).
          *   *The Dichotomy:* Either pleasures feel the same (false) or they share nothing but being desired (collapses into desire theory).
          *   *The Opening:* The proposed view is hybrid. It requires phenomenology (unlike pure desire theory) but denies a specific *quality* (unlike traditional hedonism). It focuses on the *mode* of experience relative to motivation. This middle ground is under-explored.

      *   **3. Methodology (Month-by-Month):**
          *   *Months 1-2:* Conceptual refinement. Define "unresisted endorsement." Distinguish from "flow" or "acquiescence."
          *   *Months 3-4:* Testing Hard Cases. Malice (is there resistance?), Aesthetic (is there motivation?), Flow (is there endorsement?), Intellectual (is there phenomenology?).
          *   *Month 5:* Rival Mapping. Compare explicitly with Desire-Satisfactionism (DS). If DS can explain the value without the phenomenology, the project fails. Compare with Objective List (is this feature objective?).
          *   *Month 6:* Synthesis and Writing. Final determination.
          *   *Exit Criteria:* If "unresisted endorsement" applies to non-pleasurable states (false positives) or excludes clear pleasures (false negatives), pivot to a negative conclusion.

      *   **4. Deliverables & Success/Failure:**
          *   *Success:* A defended paper arguing that this structural feature saves hedonism OR a defended paper arguing it fails but clarifies *why* (still a contribution).
          *   *Failure:* Ambiguity. If the definition remains vague or collapses into DS.
          *   *Scope:* Six months is tight for a full theory of value, but enough for this specific conceptual node.

      *   **5. Scope & Risk Assessment:**
