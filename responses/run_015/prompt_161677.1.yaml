answer: |-
  Here is the procedure, designed to fit within your twenty-minute window, followed by the application to your cases and the necessary caveats.

  ### The Separateness Check Procedure

  This procedure is triggered for any proposal where the cost-effectiveness arithmetic relies on imposing a loss on one or more identified individuals to secure a gain for a different set of individuals. It is not required for emergencies (retrospective audit applies) or for cases where the winners and losers are the same group (e.g., a policy affecting all dialysis patients equally over time).

  **Step 1: The Concentration Threshold (3 Minutes)**
  Identify the single individual who bears the largest burden in this proposal.
  *   **Question:** Is this burden "Catastrophic"?
  *   **Definition:** A burden is Catastrophic if it involves death, permanent loss of a central capability (e.g., independence, communication), or irreversible exclusion from a essential service, *and* this burden falls entirely on this individual rather than being shared.
  *   **If Yes:** The proposal cannot be justified by aggregation alone. Proceed to Step 2. If Step 2 fails, the recommendation is **NO**.
  *   **If No:** (e.g., inconvenience, financial cost, temporary delay). Proceed to Step 3.

  **Step 2: The Ratified-Pool Test (4 Minutes)**
  *   **Question:** Did the Designated Loser (or their valid proxy) agree to the rules generating this burden *before* the specific crisis arose?
  *   **Sufficient Answer:** Yes. Evidence includes a signed consent form for a specific trial, a published standing protocol the patient opted into (e.g., a transplant waiting list agreement), or an advance directive.
  *   **Insufficient Answer:** No, or "They know the system generally." General knowledge of hospital constraints is not ratification.
  *   **Outcome:**
      *   If **Yes**: The aggregation is licensed. **PASS.**
      *   If **No**: You are imposing a loss without prior consent. Proceed to Step 3.

  **Step 3: The Addressability Test (5 Minutes)**
  The Committee must draft a single sentence to be read to the Designated Loser.
  *   **The Prompt:** "We are asking you to accept [Specific Loss] because [Reason]."
  *   **The Constraint:** The [Reason] cannot contain the phrase "because this produces a greater total benefit" or any equivalent arithmetic sum. It must be a reason that applies to the person *in their position*.
  *   **Sufficient Answer:** A reason based on reciprocity ("We all accept this risk so that all of us are treated fairly"), clinical futility ("This treatment will not work for your physiology"), or fair queueing ("You are lower on the list based on criteria you accepted").
  *   **Insufficient Answer:** A reason that relies entirely on the gains of others ("...because the money saves more lives elsewhere").
  *   **Outcome:**
      *   If the Committee **cannot** draft a sentence without referencing the net benefit: **HAND-OFF**. The decision moves to the Chief Medical Officer (CMO) or Board. The Committee records: "Justification requires appeal to aggregate welfare over individual claim."
      *   If the Committee **can** draft the sentence: **PASS**.

  **Step 4: The Re-description Audit (5 Minutes)**
  *   **Question:** If we describe the benefits as "slots filled" or "units produced" rather than "persons helped," does the ranking of options change?
  *   **Procedure:** State the benefit twice. Once as "X QALYs gained." Once as "Patient A gets 2 years, Patient B gets 1 year."
  *   **Outcome:**
      *   If the moral weight feels different depending on the description: **HAND-OFF**. This indicates the aggregation is masking a distributional concern.
      *   If the weight remains the same: **PASS**.

  **Final Verdict Logic:**
  *   **PASS all steps:** Committee approves based on cost-effectiveness.
  *   **FAIL Step 1 (Catastrophic) AND FAIL Step 2 (No Ratification):** Committee recommends **NO**. (Only the Board can override this).
  *   **HAND-OFF at Step 3 or 4:** Committee records "Unresolved Separateness Concern." Decision is referred to the CMO/Board with a note that this is a value judgment, not a clinical/economic finding.

  ---

  ### Application to Your Three Cases

  **Case 1: Closing the Rural Dialysis Unit**
  *   **Context:** 11 named patients lose local access; money goes to population screening.
  *   **Step 1 (Concentration):** For the rural patients, the loss is increased travel time and risk. Is it Catastrophic? For some, likely yes (e.g., those too frail to travel). Let's assume for the protocol it counts as **Severe**, bordering on Catastrophic.
  *   **Step 2 (Ratification):** Did these 11 agree to the closure rules beforehand? No. This is a standing protocol change applied retrospectively to existing patients. **FAIL.**
  *   **Step 3 (Addressability):** Draft the sentence: "We are asking you to travel an extra hour because..." Can you finish this without saying "...because it saves more lives in the city"? If you say "...because the unit is unsustainable," that is a reason, but it hides the choice to spend the money on screening instead of subsidizing the unit. If the real reason is the screening program, the sentence fails. **HAND-OFF.**
  *   **Step 4 (Re-description):** "11 patients lose access" vs. "11 slots closed." The emotional weight is higher with "patients." **HAND-OFF.**
  *   **Result:** This cannot be decided by your committee using standard arithmetic. It must go to the Board as a value judgment: "We are trading identified current patients for statistical future patients." The Board must own that trade-off.

  **Case 2: Expensive Last-Line Therapy vs. Nurse Follow-up**
  *   **Context:** One identified patient vs. many readmissions prevented.
  *   **Step 1 (Concentration):** The loss to the single patient is death or significant life-shortening. This is **Catastrophic**.
  *   **Step 2 (Ratification):** Did the patient agree to be denied this drug if it wasn't cost-effective? Unless they signed a specific insurance-style waiver, **NO**.
  *   **Step 3 (Addressability):** "We are asking you to forgo this treatment because..." If you say "...because it is not clinically effective," you pass. If you say "...because the funds help more people," you fail. Since this is a funding request for a drug that *works* but is expensive, the reason is economic. **FAIL.**
  *   **Result:** **STOP (Recommend NO).** Your committee should not approve this. If the Board wants to fund it, they must override your recommendation explicitly, acknowledging they are prioritizing aggregate welfare over the individual claim. This protects your committee from the moral burden of "killing" the patient by calculation.

  **Case 3: Scarce Drug Allocation Rule (Benefit Only, No Loyalty)**
  *   **Context:** Standing protocol. Existing clinical relationships count for nothing; only expected benefit matters.
  *   **Step 1 (Concentration):** The loss to the existing patient is denial of drug. Potentially Catastrophic.
  *   **Step 2 (Ratification):** This is a *standing protocol*. If this rule is published and patients are treated under the understanding that "allocation is by benefit only," there is a strong argument for **Ex Ante Ratification**. Patients enter the pool knowing the rules. **PASS.**
  *   **Step 3 (Addressability):** "We are asking you to accept that your prior relationship does not count because..." You can say: "...because in a shortage, we must maximize survivors, and you agreed to these rules when registering." This is a reason based on fair play within a scheme. **PASS.**
  *   **Step 4 (Re-description):** "One life lost" vs. "One slot unfilled." Because this is a standing rule applied to a class, the "slot" description is licensed by the protocol itself. **PASS.**
  *   **Result:** **APPROVE.** This is exactly what the Ratified-Pool test is designed to protect. It allows hard utilitarian choices *if* the participants have implicitly or explicitly bought into the system beforehand.

  ---

  ### Limitations and Audit Requirements

  You asked for honesty about where this procedure relies on judgment rather than theory, and how to prevent it from becoming a box-ticking exercise.

  **1. Inputs Set by Judgment**
  The procedure does not define "Catastrophic." Your committee must define this. I recommend you adopt a working definition: "Irreversible loss of life or independence." Do not try to quantify this. If a member feels it is catastrophic, it counts. This subjectivity is a feature, not a bug; it forces the committee to acknowledge the human weight of the loss.
  *   **Risk:** Committee members may downplay a loss to avoid a "Stop."
  *   **Mitigation:** The Lay Member has veto power on Step 1. If the Lay Member says "This is catastrophic," it is treated as catastrophic.

  **2. Gaming via Re-description**
  A clever chair can frame a loss as "minor" to bypass Step 1, or describe a benefit as "person-centered" to pass Step 4.
  *   **Mitigation:** The "Addressability Sentence" (Step 3) must be recorded verbatim in the minutes. If the sentence reads like a utilitarian calculation disguised as a personal reason, the Board audit will catch it.
  *   **Audit Minute:** "The Committee drafted the following address to the patient: '[Sentence]'. The Committee determined this [Does/Does Not] rely on aggregate benefit."

  **3. Hard Cases and Misfires**
  *   **Infants/Unconscious:** They cannot ratify. Step 2 will always fail. This means any catastrophic loss imposed on a non-autonomous person for the sake of others triggers a **HAND-OFF**. This is correct. Parents cannot consent to their child being sacrificed for the greater good; only a higher authority (Board/Court) can sanction that.
  *   **Statistical People:** You cannot address statistical people. In Case 1 (Screening), the "winners" are unidentified. The Addressability Test focuses on the *loser*. This is intentional. We owe a justification to the person we harm, not the people we save.
  *   **Same People (Winners/Losers):** If a policy hurts and helps the same group (e.g., all dialysis patients wait longer to keep the unit open), Step 2 is satisfied by "Membership in the Pool." The procedure correctly identifies this as lower risk than cross-group aggregation.

  **4. The Hand-Off Point**
  The procedure is designed to force a "Hand-Off" when the math conflicts with the separateness of persons.
  *   **Who:** The Chief Medical Officer (CMO).
  *   **Why:** The CMO is accountable to the Board for budget, but also for clinical ethics.
  *   **The Record:** When you hand off, you do not say "We recommend No." You say "We cannot justify this under the Separateness Check." This distinguishes a *procedural failure* from a *clinical recommendation*. It tells the Board: "If you do this, you are making a political value judgment, not a clinical one."

  **5. Why This Defends You**
  Currently, your committee absorbs the moral shock of rationing. You treat patients as units, and when they complain, you have no defense other than "the math."
  With this procedure:
  *   If the math says "Yes" but the Check says "No," you refer it up. You are not the villain; you are the guardian of the process.
  *   If the Check says "Yes" (because of Ratification), you can tell the patient: "You entered a system where these rules apply to everyone, including us."
  *   If the Check fails, you force the Board to sign the decision. They want "value for money"? Let them sign the document that says "Value for money required denying this specific person."

  **Final Advice on Implementation**
  Do not introduce this as an ethical upgrade. Introduce it as a **risk management tool**. Tell the Board: "This procedure identifies decisions that are high-risk for litigation and reputational damage because they treat individuals as means to an end. We are flagging these for your explicit approval so that the organization owns the risk."

  This aligns their desire for defensibility with your desire for moral coherence. It takes twenty minutes, it creates a paper trail, and it ensures that when you aggregate, you do so only when the rules of the game were clear to the loser beforehand.
