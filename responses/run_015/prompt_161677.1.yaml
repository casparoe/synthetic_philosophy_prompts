      *   *Step 5 (Re-description):* Are we treating people as slots? If the decision flips based on description, Hand-off.

      *Critique:* This feels a bit disjointed. Let's streamline.
      *Revised Flow:*
      1.  Identify the "Designated Loser."
      2.  Check Concentration (Catastrophic Loss?).
      3.  Check Ratification (Prior Agreement?).
      4.  Check Addressability (The Sentence).
      5.  Check Re-description (Slots vs. Persons).
      6.  Verdict.

  6.  **Developing the Three Test Cases:**

      *   *Case 1 (Dialysis Unit Closure):* 11 named patients lose convenience/access vs. population screening.
          *   *Analysis:* Losers are identified. Loss is severe (travel burden, risk). No ratification for *these* specific patients to lose their unit. Addressability fails ("You lose so others live").
          *   *Outcome:* Likely Hand-off or No.
      *   *Case 2 (Expensive Last-Line Therapy):* One identified patient vs. Nurse service (many readmissions prevented).
          *   *Analysis:* Loser is the one patient (denied treatment). Loss is death/shortened life (Catastrophic). No ratification. Addressability fails.
          *   *Outcome:* Procedure says No/Hand-off. (User expects this).
      *   *Case 3 (Scarce Drug Rule):* Expected benefit only, no loyalty to existing patients.
          *   *Analysis:* Standing protocol. Ratification is key here. If published, patients "buy in." Addressability is to the "class" of patients.
          *   *Outcome:* Likely Pass if Ratified, but Re-description audit needed (are we treating them as slots?).

  7.  **Addressing Limitations and Audit:**

      *   *Inputs:* What counts as "Catastrophic"? Committee must define this.
