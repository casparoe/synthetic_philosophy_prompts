      *   **Task:** Create a "separateness check" procedure (not just a principle).
      *   **Constraints:**
          *   Must take ~20 minutes of committee time.
          *   Must have ordered questions, sufficient answers, stop points (No), and hand-off points (Judgment/Named Person).
          *   Must "bite" (not be an escape hatch).
          *   Must incorporate/refine three specific tests proposed by the user (Addressability, Re-description, Ratified-Pool).
          *   Must handle a "concentration threshold" for severe/irreversible loss.
          *   Must handle hard cases (statistical people, non-autonomous patients, future people, emergencies, same people on both sides).
          *   Must run on three specific cases (Dialysis unit closure, Expensive last-line therapy, Scarce drug allocation rule).
          *   Must state limitations (inputs set by judgment, gaming risks, audit trail).
          *   **Style:** Argue for the view, no citations/bibliography/references.

  2.  **Deconstruct the Three Proposed Tests:**

      *   *Addressability Test:* Can we justify the loss to the loser directly, without relying solely on "others gain more"?
          *   *Refinement:* Needs to be strict. If the only reason is "net benefit," it fails. If the reason appeals to reciprocity or fair risk-sharing, it might pass.
      *   *Re-description Audit:* Are we summing "slots" or "persons"?
          *   *Refinement:* This is about fungibility. If the description changes the moral weight, we need to flag it.
      *   *Ratified-Pool Test:* Is there prior consent to the pooling of risk?
          *   *Refinement:* This is strong for standing protocols (patients know the rules) but weak for individual escalated cases. Needs to distinguish between *ex ante* agreement and *ex post* imposition.

  3.  **Develop the Procedure (The "Separateness Check"):**

      *   *Goal:* A step-by-step algorithm that fits in 20 mins.
      *   *Structure:*
          1.  Trigger (When does this apply?).
          2.  Step 1: Concentration Threshold (The "Stop" for severe loss).
          3.  Step 2: Addressability (The "Reason" test).
          4.  Step 3: Ratification (The "Consent" test).
          5.  Step 4: Re-description (The "Fungibility" test).
