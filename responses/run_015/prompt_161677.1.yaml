      *   *Refining the "Hand-off":* When the procedure says "We can't decide this via aggregation," who decides? The Board? The CMO? The user suggested a "named person." Let's make it the CMO or Board, explicitly marking it as a *value judgment*, not a clinical/economic one.

  4.  **Addressing Hard Cases:**

      *   *Statistical/Unidentified:* Addressability is impossible. The test must shift to "Representative Person."
      *   *Non-autonomous (Infants/Dementia):* Ratification is impossible. Proxy judgment needed.
      *   *Future People:* Same as statistical.
