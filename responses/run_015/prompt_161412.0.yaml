answer: |-
  Here are hard comments on the notes, structured by your five questions. I am skipping the pleasantries and going straight to the philosophical pressure points.

  ### 1. Is the inertness argument sound, or does it smuggle in classicism at Step 1?

  **It smuggles in classicism at Step 1, and heavily.**

  Your accuracy argument relies on the assumption that the normative pressure of truth and the normative pressure of falsity are symmetrical and aggregative. You write: *"If you score against both and add them... the inaccuracy-minimizing credence in P is 1/2."*

  This assumes the goal of belief is to minimize a distance function across *all* semantic values held by the proposition. But a dialetheist does not hold that falsity exerts the same negative normative pressure on belief that it does in classical logic. In classical logic, falsity is the *absence* of truth (in a bivalent world). In dialetheism, falsity is a property co-instantiated with truth.

  The dialetheist norm of belief is typically: *Believe what is true.* If $P$ is true, you ought to believe it (credence 1). The fact that $P$ is *also* false does not generate a competing norm "Disbelieve what is false" that cancels out the first norm. Why not? Because if the norm were "Disbelieve what is false," then in a glut case, rationality would require you to simultaneously believe and disbelieve $P$ to full degree. Most dialetheists (Priest included) are happy to say rationality requires believing $P$ (because it's true) and believing $\neg P$ (because it's true), but they reject the idea that the falsity of $P$ imposes a requirement to *lower* credence.

  If you reject the "score-against-both" model, Step 1 collapses. If $P$ is true, the accuracy-optimal credence is 1, regardless of its falsity. If the credence is 1, Step 2 (Expected Utility) proceeds classically ($1 \cdot u(A,P) + 0 \cdot u(A,\neg P)$), and inertness vanishes.

  **The Fix:** You cannot rest the argument on accuracy scoring alone. You need to argue that *even if* the dialetheist sets credence to 1, the *decision rule* breaks. But if credence is 1, EU works fine. So the real bite must be in Step 3 (Vagueness/Application), where the agent doesn't *know* it's a glut, but is in a borderline state. Your argument works best if framed as: "In borderline cases, the dialetheist cannot distinguish their epistemic state from ignorance using standard probabilistic tools."

  ### 2. Ranking the Exits

  Here is the ranking from strongest to weakest, based on how much damage they do to your paper and how plausible they are independently.

  **1. The Non-Classical Probability Reply (Strongest)**
  *   **The Move:** The dialetheist rejects additivity. $Cr(P) + Cr(\neg P) > 1$. In a glut, $Cr(P)=1$ and $Cr(\neg P)=1$.
  *   **Why it wins:** It bypasses your Step 1 entirely. If probabilities aren't constrained by $Cr(P) + Cr(\neg P) = 1$, then knowing $P$ is a glut *does* distinguish you from the ignorant agent (who has $Cr(P)=0.5$). The informed dialetheist has $Cr(P)=1$. The decision rule must be modified (e.g., using lower/upper expectations), but it doesn't collapse to ignorance.
  *   **Cost to you:** You have to argue that non-additive probability is decision-theoretically useless or too revisionary. This is a harder fight than the accuracy argument.

  **2. The No-Detachment Reply (Strong)**
  *   **The Move:** Even if "This vehicle is a refugee" is a glut, the deontic conditional "If x is a refugee, then x is permitted entry" does not detach in the relevant logic.
  *   **Why it wins:** It blocks Step 3. It prevents the descriptive glut from infecting the normative domain. The agent remains in a consistent normative state even if the descriptive state is glutty.
  *   **Cost to you:** You have to argue that a logic that blocks detachment in borderline cases is useless for law/ethics. This is a plausible claim (if I can't detach obligation from fact, what good is the rule?), but it's a technical debate about conditionals.

  **3. The Glutty Verdict Reply (Medium)**
  *   **The Move:** Bite the bullet. $O(A)$ and $O(\neg A)$ are both true. The agent is rationally permitted to do either.
  *   **Why it's medium:** It accepts your conclusion (deliberation doesn't yield a unique answer) but denies it's a *cost*. They say: "Of course borderline cases don't yield unique answers; that's why they're borderline."
  *   **Cost to you:** You have to argue that "permitted to do either" is distinct from "rationally indifferent." If the dialetheist says the agent is *criticizable* either way (because they violated one of the true obligations), you have traction. If they say the agent is *immune* to criticism, your "inertness" looks like "flexibility."

  **4. The Scope Restriction (Weak)**
  *   **The Move:** "We only accept gluts for semantic paradoxes, not vagueness."
  *   **Why it's weak:** It concedes your main point about applied gluts. If they take this exit, your paper succeeds in showing dialetheism cannot be applied to vagueness without decision-theoretic collapse. That's a win for you, not them.

  **5. Truth Doesn't Constrain Credence (Weakest)**
  *   **The Move:** "Logic doesn't tell you what to believe."
  *   **Why it's weak:** It undermines the motivation for dialetheism as a rational worldview. If truth norms don't constrain credence, why care about the logic of truth?

  ### 3. Is Vagueness the Right Test Case?

  **Vagueness is risky. Moral/Legal Conflict is better.**

  *   **Vagueness:** Many dialetheists (even Priest) are sometimes agnostic about whether vagueness *actually* generates true contradictions. Some prefer epistemicism or supervaluationism for vagueness while keeping dialetheism for semantics. If your target audience thinks "Vagueness isn't glutty," Step 3 misfires.
  *   **Moral/Legal Conflict:** This is a stronger case for *applied* gluts. Consider a legal system with contradictory statutes (Statute A says "Do X", Statute B says "Do not X"). A dialetheist jurist might say "It is true that I ought to do X and true that I ought not do X."
  *   **Why it's better:** It forces the "Glutty Verdict" exit. In law, you *must* decide. You cannot remain in a state of $Cr=0.5$. If the dialetheist says "Both verdicts are true," the judge still has to sign one order. If the logic says "Both are permissible," but the institutional reality says "You will be appealed either way," the decision-theoretic inertness becomes a practical liability.
  *   **The No-Detachment Worry:** This applies here too. If the legal logic blocks detachment, the contradiction stays in the statutes but doesn't reach the verdict. You need to argue that a legal logic that doesn't detach obligation from statute is broken. That is a very strong argument for a general philosophy audience.

  ### 4. Brutal Question: Is this Interesting or a Footnote?

  **It is not a footnote, but it is a known battlefield.**

  This is a variation of the "Action Problem" for dialetheism. Priest has addressed this explicitly (arguing that rational action is guided by what is *true*, and the falsity doesn't negate the truth).

  **The Stock Answer:**
  The dialetheist will say: "You are assuming that to act on $P$, $P$ must be *only* true. But to act on $P$, $P$ only needs to be *at least* true. If $P$ is true and false, it is still true, so I act. The falsity is irrelevant to the action condition."

  **How to Reframe so it's Not a Repackaging:**
  Don't argue that action is *impossible*. Argue that **information is lost.**
  Your strongest angle is the comparison between the **Informed Dialetheist** and the **Ignorant Classical Agent**.
  *   Classical Ignorant: $Cr(P) = 0.5$.
  *   Dialetheist Informed (on your model): $Cr(P) = 0.5$.
  *   **The Punchline:** The dialetheist pays the ontological cost of true contradictions but gains no decision-theoretic discrimination over someone who knows nothing. They have paid for a telescope that shows the same view as closing your eyes.

  If you frame it as "The cost is not paralysis, it is the inability to distinguish knowledge of a glut from ignorance," you avoid the "But I can still act!" reply. They *can* act, but their epistemic state looks decision-theoretically identical to ignorance. That is a substantive cost: it makes the truth value *decision-theoretically invisible*.

  **Verdict:** If you stick to the accuracy/credence collapse (Step 1), it's a footnote because they will just say "Use non-additive probability." If you pivot to **"The decision-theoretic invisibility of gluts"** (i.e., no matter what probability theory you bolt on, you can't distinguish the glut case from the ignorance case in terms of output advice), you have a paper.

  ### 5. Technical Logic Checks (LP vs. Relevant)

  You are blending them slightly, which a logician in the audience will catch.

  *   **LP (Logic of Paradox):** This is Priest's preferred logic for dialetheism. In LP, Modus Ponens *holds* for the material conditional ($A, A \supset B \vdash B$). It fails for the *detachable* conditional ($A, A \to B \nvdash B$).
  *   **Relevant Logics:** Often reject Modus Ponens for the material conditional to avoid explosion, or use a different conditional entirely.
  *   **Your Text:** You write *"no detachable conditional, modus ponens only in restricted contexts."* This sounds more like Relevant Logic. In LP, MP is fine for the material conditional, but the material conditional doesn't support reasoning well (it allows $A \land \neg A \to B$).
  *   **Correction:** Be precise. Say: "In LP, the material conditional supports Modus Ponens but is too weak to support valid inference in inconsistent contexts (it allows explosion if you're not careful, or rather, it doesn't block it). To get a working conditional, dialetheists often add a detachable conditional, but then MP is restricted."
  *   **Deontic Detachment:** In LP-based deontic logic, if $O(A|P)$ uses the material conditional, and $P$ is a glut, you might derive $O(A)$. But if $O(A|P)$ uses the detachable conditional, you might not. Your Step 4 worry about "no-detachment" is technically sound, but ensure you specify which conditional the deontic rule uses.

  ### Summary of Recommendations for the Draft

  1.  **Scrap Step 1 as a knockout.** It's too easy for them to say "We use non-additive probability." Acknowledge it, but move the weight to Step 3.
  2.  **Pivot the Thesis.** The cost isn't that deliberation *breaks*. The cost is that **gluts are decision-theoretically invisible.** Knowing something is a glut provides no more guidance than knowing nothing.
  3.  **Switch Test Cases.** Move from Vagueness to **Normative Conflict (Law/Ethics)**. It's harder for them to say "Just don't decide" in a legal context.
  4.  **Tighten the Logic.** Distinguish between LP (Priest's main tool) and Relevant Logics. Don't imply MP fails universally in dialetheism; it fails for the *detachable* conditional.
  5.  **Anticipate the "True is Enough" Reply.** Explicitly argue that while "True is enough" for action, it's not enough for *discrimination* between cases. That is where the value of truth usually lies in decision theory.

  If you make these shifts, you move from a technical objection about scoring rules (which they can fix with math) to a philosophical objection about the *value* of truth in reasoning (which is harder to fix).
