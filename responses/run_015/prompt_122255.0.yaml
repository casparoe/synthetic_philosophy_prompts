      *   **User:** A novelist whose book features a narrator deriving a strong conclusion (existence + persistent identity) from a cogito-like reasoning during a storm-induced existential crisis.
      *   **Task:** Create a teaching plan for a 50-minute session with 18-year-olds (sixth-formers) who have read the book but have no philosophy background/Latin.
      *   **Goal:** Teach what the cogito *actually* establishes vs. what the narrator supposes (existence vs. persistent identity/self).
      *   **Constraints:**
          1.  Max 6 numbered steps.
          2.  Each step headed by one sentence (the takeaway).
          3.  One closing paragraph on what to refuse to explain.
          4.  Under 700 words total.
          5.  No appeal to Descartes's text (author is not a philosopher).
          6.  Do not explicitly convict the character of a fallacy; let students discover it.
          7.  Address specific misconceptions (first-person voice confidence).
          8.  Include one final diagnostic question.
          9.  Include an example/case study analysis.

  2.  **Deconstruct the Philosophical Issue:**
      *   *Cogito Ergo Sum* (I think, therefore I am) establishes existence at the moment of thinking.
      *   *The Narrator's Leap:* Establishes existence + persistent identity ("the single persisting someone she remembers being").
      *   *The Gap:* The cogito proves *that* I am, not *who* I am or that I am the *same* I as before. Hume/Buddhist no-self critiques apply, but keep it simple. The issue is continuity vs. momentary existence.

