answer: |-
  Imagine a university history department with a fifty-year-old rule: any tenured professor can veto a hiring candidate anonymously, no justification required. The rationalist progressive Dean wants to keep it, arguing that data shows anonymous vetoes protect junior faculty from retaliation when they block politically connected candidates, thus optimizing for fairness and reducing liability—it's a procedural safeguard that works. The Burkean conservative Department Chair wants to abolish it, arguing that while the rule prevents overt conflict, it rots the community from the inside by allowing professors to evade responsibility for their judgments, destroying the organic trust and mutual accountability that actually sustain a scholarly tradition over generations.

  Here's the breakdown. The Progressive sees the rule as a **technology of risk mitigation**; it bypasses human frailty (fear, bias, social pressure) to ensure a rational outcome (fair hiring). The Conservative sees the rule as a **corrosive substitute for virtue**; by making accountability unnecessary, it atrophies the moral muscles of the faculty, turning a community of judgment into a collection of isolated actors. The structural feature driving the swap is **whether the institution is viewed as a safeguard against human variability or as a scaffold for human character**. The Progressive values the safeguard (variability is noise); the Conservative values the scaffold (variability is where judgment lives).

  If you remove that feature—say, the rule is about fire safety drills, not hiring—the case collapses back to standard Chesterton's Fence: the Conservative keeps it (it's established safety wisdom) and the Progressive only keeps it if the data supports it (no moral ecology involved). The swap only happens when the rule's *instrumental success* depends on *bypassing human relationship*.

  The Progressive would attack the Conservative move by saying, "You're romanticizing 'trust' that doesn't exist; without this rule, power dynamics silence dissent, and your 'organic community' just becomes a boys' club." They'd argue that relying on character is a bug, not a feature, because character is unverified code.

  \answer{The swap occurs because the institution functions as a procedural substitute for interpersonal accountability, which the Progressive values for safety and the Conservative rejects as corrosive to virtue.}
