prompt: |-
  Hey — I need a Q&A prep sheet, not a defense of the view itself. Next Wednesday I'm presenting at a joint session of my philosophy department's formal epistemology reading group and the ML lab's alignment group, and the room will be mostly people who are friendly to the *project* of scalable oversight but skeptical of debate in particular. The thesis I'm defending has three moving parts: (1) that debate has been mis-sold as a way for a weak judge to *verify* answers, when what it actually does is convert an epistemic asymmetry (one side knows something the other doesn't) into a dialectical asymmetry, so the judge ends up grading a debate record and never grading the task; (2) that the usual worry — that debate only helps when the true answer happens to be the one with easily pointable-out false steps — mislocates the bottleneck; the real problem in my view is capability symmetry, since once both debaters are equally strong the honest one has no structural advantage left, and nothing in the standard equilibrium story gives truth the edge rather than just giving it to whoever is better at argument; and (3) my proposed fix, which I'm calling "blind-side cross-examination": the answerer commits to an answer first, and only afterwards is the adversary dealt a rival answer drawn at random from a large space of generated alternatives (rather than the negation of whatever the answerer said), so the answerer can no longer pre-harden its answer against the single objection it expected, and the judge scores robustness under unanticipated cross-examination instead of scoring correctness.

  The audience matters a lot here and I'd like the objections written in their idiom rather than in mine: there'll be maybe eight or ten RLHF and reward-modeling people who think that anything that isn't a training signal is just philosophy and will want to know why this isn't critique-and-revision with extra steps; two formal epistemologists who will immediately ask where the convergence or dominance argument is, what the judge's prior over "which debater is honest" is doing, and whether my scoring rule is proper; one interpretability person who thinks a debate transcript is just another black box wrapped around a black box; an STS/ethics-of-AI person who is arriving ready to push on the framing — on what I'm doing with words like "truth," "honest," and "scalable," and on who gets to count as a competent judge; a complexity-theory-leaning postdoc who will bring up the theoretical result people always cite about debate letting a weak judge in principle adjudicate claims far beyond what it could check on its own (the one about reaching PSPACE with optimal play) and say that my whole framing ignores it; and one person who has read the original debate paper extremely closely and will say I'm strawmanning it.

  So: give me the eight or so objections I'll actually get from *this* room, in roughly the order they'll arrive, each phrased the way that person would actually phrase it, ordered by how much damage it would do rather than by how interesting it is. For each: a reply I can give in about two minutes, and a blunt note on where that reply is soft — I'd rather know now which of them I'm bluffing on. Also: what should I concede up front in the talk itself to take the sting out of the room, which single reply has to land for the proposal to survive at all, and the question I'm quietly hoping nobody asks (my guess is it's something about why, if the judge can only grade dialectical performance, I'm not just reinventing RLHF on transcripts with a worse loss — but tell me if you think the dangerous one is somewhere else). Don't give me a bibliography or papers to read, I just want the prep sheet.
