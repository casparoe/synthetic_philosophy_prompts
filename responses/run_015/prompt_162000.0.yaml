answer: |-
  There is no single, canonical term equivalent to "the unilateralist's curse" that covers both the epistemic distortion (the ignorant blocker) and the social distortion (the stubborn blocker) under one label. However, in political science, organizational theory, and game theory, these are well-documented failure modes of **Unanimity Rule** (or Consensus Decision-Making).

  If you need a label to search for or use in conversation, the most accurate umbrella term is **"The Pathologies of Unanimity Rule."** In informal organizational contexts, it is often called **"The Consensus Trap"** or **"Veto Paralysis."** Some authors, mirroring Bostrom, have informally referred to it as the **"Vetoist's Curse,"** though this has not gained standard academic traction.

  Here is the breakdown of the two distortions you identified, how they relate to the unilateralist's curse, and why the remedies differ.

  ### 1. The Epistemic Distortion (The Ignorant Blocker)
  **What it is:** You observed that the decision quality is capped by the least informed member, not the average.
  **The Mechanism:** This is a failure of **Information Aggregation**.
  In a majority vote, the "wisdom of the crowd" tends to cancel out individual noise and ignorance. Under a unanimity rule, the decision function is not an average; it is a *minimum*. Mathematically, if $Decision = \min(Person_1, Person_2, ... Person_N)$, the outcome is entirely determined by the outlier.

  If information and confidence are normally distributed, the outlier is statistically likely to be an outlier due to *lack* of information (or high risk aversion) rather than superior insight. By giving one person veto power, you are effectively selecting your decision-maker at random from the person with the highest anxiety or lowest engagement.

  **Relation to the Unilateralist's Curse:**
  You are correct: this is the **structural inverse** of the unilateralist's curse.
  *   **Unilateralist's Curse:** One person can *act*. The risk is **Type I Error** (doing something that shouldn't be done). The mechanism is that one person's private information (or delusion) overrides the group's caution.
  *   **Your Situation:** One person can *block*. The risk is **Type II Error** (failing to do something that should be done). The mechanism is that one person's private uncertainty (or ignorance) overrides the group's confidence.

  Both curses stem from the same root: **Uncorrelated Judgments under Asymmetric Information.** In both cases, the procedure assumes that individual judgment is a reliable proxy for group interest, but fails to account for the variance in individual competence or information.

  **Why "Veto Player" doesn't quite fit:**
  George Tsebelis's *Veto Player Theory* is the nearest academic concept. However, Tsebelis focuses on **policy stability** (how hard it is to change the status quo), not **decision quality**. His theory predicts that more veto players lead to less change, which matches your observation that adding members makes blocking more likely. But it doesn't explain *why* the blocking is often driven by ignorance rather than prudence.

  ### 2. The Social Distortion (The Stubborn Blocker)
  **What it is:** You observed that veto power drifts to the person with the lowest social cost of objection.
  **The Mechanism:** This is a **Repeated Game / Holdout Problem**.
  In a single interaction, a veto might be principled. In a committee that meets repeatedly, "blocking" carries a social cost (being seen as difficult, slowing things down).
  *   **Member A (Conscientious):** Feels bad about blocking. Blocks only for major reasons. Eventually wears down.
  *   **Member B (Stubborn/Disengaged):** Does not care about social friction, or enjoys the power. Blocks frequently.
  *   **The Group:** Learns that arguing with Member A works, but arguing with Member B is exhausting. To minimize friction, the group begins to pre-emptively shapes proposals to satisfy Member B.

  This is distinct from the first distortion. The first is about *information*; the second is about *preference intensity*. The result is that the committee ceases to optimize for the mission and starts optimizing for **the preferences of the member with the highest tolerance for conflict.**

  **Nearest Concept:**
  This is a variation of the **Holdout Problem** (from economics and law), where a single agent can block a transaction to extract value. In your case, they aren't extracting money, but they are extracting **concessions to their personal preferences**. It is also related to **The Tyranny of the Minority**, though that term usually implies a faction rather than a single obstinate individual.

  ### 3. Do the Remedies Work?
  You asked whether remedies for the unilateralist's curse (deferring, asking first, requiring agreement) work here. Because the problems are inverses, the remedies often have opposite effects.

  | Remedy | In Unilateralist's Curse (Acting Alone) | In Your Context (Blocking Alone) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **"Ask First"** (Consult before acting/blocking) | **Good.** Prevents rash action. | **Good.** Prevents rash blocking. If a blocker must explain their doubt to a peer before the meeting, they often realize their doubt is unfounded. | **Keep this.** |
  | **"Defer"** (Wait until sure) | **Good.** Prevents error. | **Bad.** Deferring favors the status quo. Since the status quo is the default win condition for a blocker, deferring *empowers* the blocker. | **Avoid this.** |
  | **"Require Agreement"** (Consensus) | **The Cause.** | **The Cause.** | **Change this.** |

  ### 4. Better Remedies for Your Context
  Since the core problem is that a unanimity rule turns variance in information and stubbornness into a decision-making bottleneck, you need mechanisms that lower the threshold or raise the cost of blocking.

  1.  **Qualified Majority (The 80% Rule):**
      Move from 100% consensus to 80% approval. This preserves the ability for a minority to stop clearly bad ideas but prevents a single ignorant or stubborn person from killing good ones. This is the standard fix for the "Pathologies of Unanimity."

  2.  **The "Burden of Alternative" Rule:**
      Adopt a norm (or rule) that **a veto must be accompanied by a constructive alternative.** You cannot just say "no"; you must say "no, unless we change X to Y." This filters out stubborn blockers who don't actually care about the outcome, as they won't do the work to propose alternatives.

  3.  **Delegated Authority (Subsidiarity):**
      You mentioned expenditures above "a few hundred dollars." If the committee is large, the threshold is too low. Raise the threshold significantly so the committee only decides on strategic issues, not tactical ones. Let a sub-committee of 2-3 trusted members approve the smaller grants. Smaller groups suffer less from the "least informed member" statistical problem.

  4.  **Time-Boxed Veto:**
      Objections must be raised within 48 hours of the proposal being circulated. If no one objects in writing by the deadline, the proposal passes automatically. This prevents people from sitting silently in the meeting and then dropping a veto bomb at the end (a common tactic of the "stubborn" blocker).

  5.  **Rotating Veto:**
      In some consensus groups (like Quaker meetings or some co-ops), the ability to block is not permanent. Only one person per meeting is allowed to "stand aside" or block, or the right to block rotates. This prevents the "stubborn person" from becoming the de facto dictator.

  ### Summary
  You are describing the **Pathologies of Unanimity Rule**.
  *   **Part 1 (Ignorance):** The **Epistemic Failure of Unanimity**. It is the structural inverse of the Unilateralist's Curse.
  *   **Part 2 (Stubbornness):** The **Holdout Problem** applied to social capital.

  The "Unilateralist's Curse" warns against one person acting on private information. Your situation warns against one person *withholding* action on private uncertainty. The remedy is not to ask for more agreement, but to require **qualified majorities** and place the **burden of proof on the blocker**.
