      *   **Section 3: The Social Topology of Uncertainty.** Focus on the group. Divergent priors. Coordination fractures. The known urn as a Schelling point.
      *   **Section 4: Moral and Practical Alignment.** Bring it together. Decision-making isn't just about utility maximization; it's about accountability and trust.
      *   **Conclusion:** Reiterate that avoiding ambiguity is a sophisticated defense mechanism for navigating a complex social and epistemic landscape.

