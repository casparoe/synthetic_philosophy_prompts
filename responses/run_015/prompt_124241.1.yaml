      *   *Elaboration:* If I bet on the unknown urn and lose, I can't just say "bad luck." I have to ask, "Why did I assume 50/50?" If the urn was actually 90% black, my assumption was negligent.
      *   *Key Distinction:* Risk (known probabilities) vs. Uncertainty (Knightian uncertainty). In risk, the game is fair. In uncertainty, the game might be rigged, or my model might be flawed.
      *   *Argument:* Choosing the known urn limits the scope of potential self-blame. It bounds the epistemic liability.

  4.  **Develop the User's Argument - Pillar 2: Social Coordination Fractures:**
      *   *Concept:* Ambiguity allows divergent priors.
      *   *Elaboration:* In a group, if the probability is unknown, Optimist A sees 90% red. Pessimist B sees 10% red. If we bet on the unknown urn, A thinks we're safe, B thinks we're doomed. If we lose, they blame each other ("You were too greedy" vs. "You were too timid").
      *   *Contrast:* If we bet on the known urn (50/50), everyone agrees on the odds. If we lose, it's shared bad luck, not internal conflict.
      *   *Argument:* The known urn acts as a "focal point" (Schelling point) for social agreement. It stabilizes the group.

  5.  **Critique the Bayesian Remedy:**
