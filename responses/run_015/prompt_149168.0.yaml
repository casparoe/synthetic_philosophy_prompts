answer: |-
  1. Ordinary pragmatic compromise involves balancing competing interests within acceptable moral boundaries, whereas dirty-handed action requires violating a fundamental ethical prohibition to achieve a necessary political end. The distinction lies not in the difficulty of the choice, but in the transgression of a deep moral constraint that remains wrong even when justified.
  2. Undoing the harmful act does not eliminate the moral residue because the stain attaches to the agent's willingness to commit the wrong, not solely to the permanent consequences. Like a logged attempt rather than a final state, the moral corruption persists even if the external damage is reversed, suggesting irreversibility is not the defining factor.
  3. A leader who delegates an immoral task does not retain clean hands because moral responsibility flows from the authorization of the act rather than the physical execution. The contamination is inherited through the chain of command, meaning the principal bears the same moral stain as the agent who carried out the order.
  4. Public confession acknowledges the moral stain but does not function as laundering unless it is used to seek premature absolution without genuine remorse. Bearing the stain requires accepting guilt and punishment, meaning confession is essential for integrity but does not erase the underlying moral violation.
  5. Resolving this problem often implies accepting a distinct role morality for officeholders, since standard ethical reasoning typically forbids the necessary wrongs entirely. Yet, maintaining universal morality suggests the leader remains genuinely guilty regardless of political necessity, leaving the tension between duty and ethics fundamentally unresolved.
