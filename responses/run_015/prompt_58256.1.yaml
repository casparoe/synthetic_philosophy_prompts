answer: |-
  This is one of the hardest and most debated questions in ethics and law, so first off: **your brain is fried because you two stumbled onto a genuine philosophical cliff.** Lawyers and philosophers have been arguing about exactly this distinction for centuries.

  You are both partially right, which is why you're stuck. Your friend is relying on a strict **physicalist** definition of consent (did the bodies agree to the motion?), while you are relying on a **relational/risk** definition (did the person agree to *this specific experience*?).

  To untangle this, we need to look at the two categories of deception. In legal theory, these are often called **Fraud in the Factum** vs. **Fraud in the Inducement**.

  Here is the breakdown of the distinction, why the "but-for" test fails, and how to categorize your examples.

  ### 1. The Core Distinction: "What" vs. "Why"

  The conceptual line isn't about how big the lie is; it's about **what the lie is about.**

  *   **Fraud in the Inducement (Your Friend's Zone):** This is lying about the *reasons* to do something. You know exactly what the physical act is, but you were tricked into wanting it.
      *   *Example:* Lying about your salary, your love for dogs, or whether you're exclusive.
      *   *Why consent stands:* You knew you were agreeing to sex. You just agreed for a bad reason. The law generally says adults are responsible for their own motivations. If we voided consent here, anyone could claim assault after a breakup by saying, "I only said yes because he lied about loving my art."
  *   **Fraud in the Factum (Your Zone):** This is lying about the *nature of the act itself*. You think you are agreeing to Act A, but you are actually experiencing Act B.
      *   *Example:* A doctor saying "this is a medical exam" when it is sexual touching.
      *   *Why consent is void:* You never agreed to sex. You agreed to a medical procedure. The physical touch might be the same, but the *social and physical reality* of the act is fundamentally different.

  ### 2. Applying This to Your Examples

  This is where it gets tricky, because some lies feel like they bridge the gap. Let's sort your specific cases.

  **The "Salary / Dogs / Exclusive" Lies (Inducement)**
  *   **The Lie:** "I make $200k," "I love huskies," "I'm not seeing anyone else."
  *   **The Act:** Vaginal/anal/oral sex.
  *   **Analysis:** You knew the physical act was sex. The lie changed your *motivation*, not the *act*.
  *   **Verdict:** Morally shitty, but consent remains valid.

  **The "Identity in the Dark" Lie (Factum)**
  *   **The Lie:** Pretending to be someone's spouse or partner in the dark.
  *   **The Act:** Sex.
  *   **Analysis:** This is the clearest case for you. Consent is person-specific. If I agree to be touched by *Person A*, and I am touched by *Person B*, I did not consent to that touch.
  *   **Verdict:** Consent is void. You didn't agree to sex with *him*; you agreed to sex with *your husband*.

  **The "Doctor Exam" Lie (Factum)**
  *   **The Lie:** "I need to insert this for the exam" (when it's for sexual gratification).
  *   **The Act:** Internal touching.
  *   **Analysis:** You consented to a medical procedure, which carries a specific social meaning and risk profile. You did not consent to sexual contact.
  *   **Verdict:** Consent is void. The "nature of the act" was medical, not sexual.

  **The "STI / Stealthing" Lies (The Grey Zone moving to Factum)**
  *   **The Lie:** "I don't have HIV" or "I'm using a condom" (and then takes it off).
  *   **The Act:** Sex.
  *   **Analysis:** This is where your friend's "physical act" argument falls apart. Your friend says, "It's still sex." But you are arguing that **conditions are part of the act.**
      *   If I agree to skydiving *with a parachute*, and you give me a backpack with no parachute, I didn't consent to skydiving. I consented to *safe* skydiving.
      *   Sex with a condom is a fundamentally different physical risk profile than sex without one. Sex with an STI is a fundamentally different biological risk than sex without one.
  *   **Verdict:** Modern ethics and increasingly the law side with **you**. These lies negate consent because they change the **bodily risk** of the act. You consented to *protected* sex; you got *unprotected* sex. Those are two different physical acts in terms of consequence.

  ### 3. Why the "But-For" Test Fails

  Your friend hit you with the "But-For Test": *If you wouldn't have said yes but for the lie, then consent is void.*

  He thinks this proves you're wrong because it leads to insanity. He is right that the test leads to insanity, but he is wrong that it means *no* lies negate consent. Here is why that test is broken:

  1.  **It Makes Consent Retrospective:** Consent has to be valid at the moment it is given. If we use the "but-for" test, consent becomes valid only after we investigate the person's entire history for lies. It makes it impossible to ever know if you have consent.
  2.  **It Criminalizes Persuasion:** All dating involves presenting your best self. If I wear a shirt that makes me look taller, and you say yes because you like tall guys, did I trick you? If I say "I promise I'll make you breakfast" to convince you, and I sleep in, was it assault?
  3.  **It Ignores Autonomy:** The "but-for" test treats adults like children who can't weigh risks. The law assumes you have the agency to decide what risks to take (like sleeping with a liar), unless the lie removes your ability to understand the *risk itself* (like the STI or condom issue).

  ### 4. The Better Framework: "Bodily Integrity and Risk"

  If the "but-for" test is too broad, and your friend's "physical mechanics" test is too narrow, what is the middle ground?

  The distinction is usually drawn at **Bodily Integrity and Fundamental Risk.**

  *   **Does the lie change the physical risk to my body?**
      *   Salary/Dogs: No. (Consent stands)
      *   STI/Stealthing: Yes. This introduces disease or pregnancy risk I explicitly excluded. (Consent void)
  *   **Does the lie change *who* is touching me?**
      *   Impersonation: Yes. (Consent void)
  *   **Does the lie change the *purpose* of the touch?**
      *   Doctor/Massage Therapist: Yes. (Consent void)

  ### Summary for Your Next Argument

  You can tell your friend:

  1.  **You agree** that lying about salary or dogs doesn't negate consent. That is "Fraud in the Inducement" (lying about the *reasons*).
  2.  **However,** consent isn't just about the mechanical motion; it's about the **conditions of the risk.**
  3.  Lying about an STI or removing a condom (stealthing) isn't just a lie about *why* we are having sex; it changes the **physical nature of the act** from "safe sex" to "unsafe sex."
  4.  The "But-For" test is flawed because it makes all persuasion invalid. The correct test is whether the deception violated **bodily autonomy** by hiding a fundamental risk or changing the identity of the actor.

  You aren't stuck; you're just arguing about where the line between "bad dating" and "violation of bodily autonomy" sits. Most modern thinkers put STIs and stealthing on the violation side, and salary/dogs on the bad dating side.
