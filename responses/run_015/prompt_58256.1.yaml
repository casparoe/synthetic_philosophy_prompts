  ok so me and my friend just burned like three hours arguing about when consent actually counts and my brain is fried lol i need someone to untangle the idea, not just pick a side

  his take is basically consent is valid as long as you say yes and you know what the physical act is. like if you agree to sleep with someone and they lied about their job or about liking dogs or whatever to get you to say yes, you were tricked but you still consented. i said that cant be right because some lies feel totally different, like lying about having an STI, or saying youll pull out and then not doing it, or pretending to be someone else in the dark, or a doctor doing an extra thing during an exam you didnt agree to. that feels like there was no real consent at all, not just a bad reason for saying yes.

  then he hit me with well where do you draw the line, does lying about your salary or being exclusive also wipe out consent, that seems insane, and he said i was stuck with this but-for test where any lie that flips a no to a yes kills consent. and i definetly dont beleive that but i couldnt say why not, like why does the STI lie seem to cancel consent but the salary lie doesnt even though both might be dealbreakers.

  can you break down what the conceptual distinction is supposed to be between lies that wipe out consent vs lies that just talk someone into saying yes, and why the simple wouldnt-have-said-yes-if-they-knew test doesnt work? use those kinds of cases to make it concrete, like STI and stealthing vs salary and dog stuff, so i can actually see how the distinction is meant to go
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and a friend argued for three hours about the nature of consent, specifically regarding deception/fraud.
      *   **User's State:** Brain is fried, needs clarification/untangling, not just picking a side.
      *   **Friend's Position:** Consent is valid if you say "yes" and know the *physical act*. Lies about peripheral things (job, dogs) don't negate consent.
      *   **User's Position:** Some lies (STIs, stealthing, identity, medical scope) *do* negate consent.
      *   **The Stalemate:** The friend asks, "Where do you draw the line?" and argues that if *any* lie changes a "no" to a "yes," consent is void (the "but-for" test). The user feels this is wrong but can't articulate why.
      *   **Goal:** Explain the conceptual distinction between "fraud in the factum" (negates consent) and "fraud in the inducement" (doesn't negate consent), using the specific examples provided (STI, stealthing, salary, dogs). Explain why the "but-for" test is problematic in this context.

  2.  **Deconstruct the Legal/Philosophical Framework:**
      *   The core debate here is a classic one in law and ethics: *Fraud in the Factum* vs. *Fraud in the Inducement*.
      *   *Fraud in the Factum:* Deception about the nature of the act itself. You think you're signing a contract, but it's actually a deed to your house. You think you're getting a medical exam, but it's sexual assault. This usually voids consent.
      *   *Fraud in the Inducement:* Deception about the reasons or benefits surrounding the act. You agree to the act, but you were tricked into wanting it. This usually *doesn't* void consent (legally speaking, though ethically it's murky).
      *   *The "But-For" Test Problem:* If we say "Consent is invalid if you wouldn't have said yes but for the lie," then *everything* becomes assault. Lying about loving someone's cooking, lying about being rich, lying about hating your ex. It makes the concept of consent too fragile and expansive.

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Validation:** Acknowledge that this is a hard, famous philosophical/legal problem. It's not just them; experts argue about this.
      *   **Core Distinction (The "What" vs. The "Why"):**
          *   Friend's view focuses on the *physical mechanics* (penetration, touch).
          *   User's view focuses on the *conditions* of the act.
          *   Need to introduce the idea of "Nature of the Act" vs. "Circumstances/Surroundings."
      *   **Category 1: Lies that Negate Consent (Fraud in the Factum/Essential Nature):**
          *   *Identity:* Sleeping with someone thinking they are your spouse. You didn't consent to *this person*, you consented to *that person*.
          *   *Medical/Professional:* Doctor says "this is a pap smear" but does something sexual. You consented to a medical procedure, not sex.
          *   *Stealthing:* This is tricky but increasingly seen as negating consent. Why? Because the condition of the act (protected sex) was fundamental to the agreement. It changes the *risk profile* of the act itself.
          *   *STIs:* Similar to stealthing. Consent to "safe sex" vs. "risky sex."
      *   **Category 2: Lies that Don't Negate Consent (Fraud in the Inducement):**
          *   *Salary/Job:* This is about *why* you want to sleep with them, not *what* you are doing.
          *   *Dogs/Interests:* Same as above.
      *   **Why the "But-For" Test Fails:**
          *   Explain that *all* persuasion relies on presenting a version of reality.
          *   If "but-for" ruled, then flirting (exaggerating interest) could be assault.
          *   It makes consent impossible to establish retrospectively.
      *   **The "Risk and Harm" Framework (The Untangling):**
          *   Instead of a hard line, think about *bodily autonomy and risk*.
          *   Does the lie change the physical risk to my body? (STI, pregnancy/stealthing).
          *   Does the lie change *who* is touching me? (Impersonation).
          *   Does the lie change the *purpose* of the touch? (Doctor).
          *   Vs. Does the lie change my *motivation*? (Money, status, shared hobbies).

  4.  **Refining the Tone:**
      *   Keep it conversational but precise.
      *   Avoid legal jargon where possible, or explain it immediately.
      *   Validate the user's intuition (because modern law is moving their way on STIs/Stealthing) while acknowledging the friend's logical concern (the slippery slope).

  5.  **Self-Correction/Nuance Check:**
      *   *Stealthing/STIs:* Legally, this varies by jurisdiction. Some places treat it as sexual assault, others as a civil tort. I need to be careful not to say "This IS definitely assault everywhere" but rather "This is why philosophers/legal scholars argue it negates consent."
      *   *Friend's Point:* The friend isn't *wrong* that a line is hard to draw. I need to admit the line is fuzzy but explain the *principles* used to draw it.
      *   *User's Intuition:* The user feels the difference between "bad reason" and "no consent." I need to give them the vocabulary for that feeling.

  6.  **Final Structure:**
