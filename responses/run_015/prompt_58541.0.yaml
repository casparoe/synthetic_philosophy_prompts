answer: |-
  Yes, this arrangement has an established designation in game theory and institutional economics. It is most precisely identified as the **Second-Order Free Rider Problem** (specifically within the context of **Costly Norm Enforcement**).

  While the "Tragedy of the Commons" describes the depletion of a resource through *use*, your scenario describes the degradation of a social environment through *non-enforcement*. Below is the distinction you requested, followed by a proposed operational definition and boundary cases to help you categorize and address the issue in your specific settings.

  ### 1. The Established Designation: Second-Order Free Riding

  In a standard "First-Order" free rider problem, an individual consumes a public good (like a clean kitchen) without contributing to its production (cleaning).

  In your scenario, the problem is one step removed. The "public good" is not just cleanliness or accuracy, but **compliance with the norm**.
  *   **First-Order Violators:** Those who leave the mess or post the inaccuracy.
  *   **Second-Order Free Riders:** Those who *observe* the violation but refuse to sanction it (confront or correct) because sanctioning carries a personal cost (social awkwardness, protracted dispute).

  The system fails not because everyone is making messes, but because everyone is waiting for someone else to bear the **social cost of enforcement**. In academic literature, this is often discussed under **Second-Order Social Dilemmas** or the **Problem of Costly Punishment**.

  ### 2. Distinguishing from Neighboring Phenomena

  To distinguish this from the more common concepts you mentioned, you must look at **rivalry** (does my use hurt yours?) and **cost location** (where is the burden felt?).

  | Feature | Tragedy of the Commons | Simple Free Riding | **Your Scenario (Second-Order)** |
  | :--- | :--- | :--- | :--- |
  | **Resource Type** | Common-Pool (Rivalrous) | Public Good (Non-Rivalrous) | **Public Good (Non-Rivalrous)** |
  | **Mechanism of Failure** | **Depletion:** Resource is used up. | **Under-provision:** Good isn't made. | **Decay:** Norm isn't defended. |
  | **The "Cost"** | Physical scarcity. | Labor/Expense to create. | **Social Friction** to enforce. |
  | **Example** | Eating all the lab food. | Using a clean sink without wiping it. | **Seeing a mess but not telling the maker.** |

  **Key Distinction:** In the Tragedy of the Commons, the resource *cannot* sustain the usage. In your scenario, the resource (kitchen/forum) *can* sustain the usage indefinitely, provided the *behavior* is policed. The bottleneck is not physical capacity, but **willingness to incur interpersonal conflict**.

  ### 3. Proposed Operational Term and Definition

  While "Second-Order Free Rider" is the accurate academic term, it is jargon-heavy and may not resonate with volunteers or lab members. For practical coordination, I propose using the term **The Norm Enforcement Dilemma**.

  **Definition:**
  > A **Norm Enforcement Dilemma** occurs when a shared environment remains functional only if members actively police one another's behavior, but the personal cost of policing (conflict, time, social risk) exceeds the individual's share of the benefit gained from that specific act of enforcement. Consequently, all members prefer the *existence* of the norm but defer the *maintenance* of the norm to others.

  ### 4. Boundary Cases

  To ensure you are diagnosing the problem correctly, use these boundary cases to separate the **Norm Enforcement Dilemma** from its neighbors.

  **Boundary Case A: When does it become Simple Free Riding?**
  *   *Scenario:* A member leaves a mess. Another member cleans it up silently without confronting the mess-maker. The mess does not return.
  *   *Diagnosis:* This is **Simple Free Riding**. The cost is purely physical labor (cleaning), not social friction (confronting). The solution is a roster or duty shift.
  *   *Your Scenario:* If cleaning *without* confronting fails because the mess-maker returns habitually, you have crossed the boundary into the **Norm Enforcement Dilemma**. The labor is useless without the sanction.

  **Boundary Case B: When does it become a Tragedy of the Commons?**
  *   *Scenario:* The kitchen fridge is so full of everyone's Tupperware that there is no space for new items, or the forum is so flooded with posts that valuable content is buried.
  *   *Diagnosis:* This is **Depletion/Overuse**. The resource is rivalrous (space/attention).
  *   *Your Scenario:* If the kitchen is physically usable and the forum is readable, but the *quality* is degraded by inaccuracies or grime, you remain in the **Norm Enforcement Dilemma**. The issue is quality control, not capacity.

  **Boundary Case C: When does it become Pluralistic Ignorance?**
  *   *Scenario:* Members do not confront the mess because they genuinely believe *everyone else* is okay with the mess.
  *   *Diagnosis:* This is **Pluralistic Ignorance** (a psychological state).
  *   *Your Scenario:* If members *know* others hate the mess but still stay silent to avoid conflict, it is the **Norm Enforcement Dilemma**. The barrier is not misunderstanding, but the **cost of sanctioning**.

  ### Summary for Application
  In your communications, you can frame the issue thus: *"We are not facing a shortage of resources (Tragedy) nor a shortage of cleaners (Free Riding). We are facing a **Norm Enforcement Dilemma**. The system works only if we lower the social cost of correcting one another."*

  This distinction shifts the solution away from "cleaning more" (which you said is happening but is unsustainable) toward **institutionalizing enforcement** (e.g., anonymous reporting tools, rotating "moderator" roles so the burden of confrontation is shared and expected, or clear rules that depersonalize correction).
