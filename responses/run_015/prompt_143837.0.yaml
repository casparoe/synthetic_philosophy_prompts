answer: |-
  Dear Me,

  You have ten minutes for questions and that is nothing, so you need to be ruthless about which battles you fight and which you concede. The following are the eight objections you are most likely to face, ranked by how much damage they could do to the project if you mishandle them, phrased as they will ask them, with the reply you should give and a candid note on where the ground is soft. The first and most dangerous challenge will come from the senior consequentialist who will say that you have invented a problem just to solve it, arguing that expected value reasoning already handles lumpy cases because the probability of being pivotal is non-zero and the harm is large, so your diachronic move is just expected utility theory with extra steps. Your reply is that standard expected utility assumes a continuous probability distribution over outcomes, whereas lumpy systems have zero probability of impact at most time points and non-zero only at threshold moments, so the diachronic reply changes the structure of the expectation from a single-shot pivot to a temporal distribution over threshold crossings, which matters for how agents reason about sustained versus one-off abstention. The soft spot here is that you must concede the math ultimately sums to the same expected value over the long run, so you are fighting for a conceptual clarification about causation rather than a difference in final output, and if they press that the action-guiding result is identical, you should concede that the normative upshot is similar but insist the explanatory mechanism matters for non-ideal agents who cannot calculate astronomical pivots.

  The second most damaging objection will come from the formal decision theorist who will tell you that your convergence claim relies on assumptions about the stability of demand and inventory policies that real supply chains do not satisfy, noting that if demand fluctuates or ordering rules change, your probability about threshold crossing is no better grounded than the pivot probability you claim to be avoiding. You should reply that you are offering a structural model of how these systems work in principle, not an empirical forecast for a specific supermarket, and that the philosophical point holds so long as the system operates on any threshold-based rule rather than continuous flow. Be candid with yourself that this is your weakest empirical flank, so if they push hard on the volatility of real-world inventory, concede that the probability is subjective but argue that it is epistemically more accessible than the pivot probability because we can observe ordering cycles even if we cannot predict exact demand.

  Third, the political philosopher will ask whether your focus on individual causal efficacy quietly demotes institutional and regulatory duties by suggesting that if individuals can make a difference through sustained abstention, we need not fight for structural change, and they will press you on whether this framing is ideologically complicit in letting corporations off the hook. Your reply is that establishing individual causal efficacy is compatible with, and indeed supports, the claim that institutional change is necessary because individual abstention is too slow and costly to solve the problem alone, so the diachronic difference shows individuals are not off the hook but also not solely responsible. The softness here is real because your account does give individuals a causal role that structural accounts often deny, so if they press whether this distracts from collective action, concede that individual duty is necessary but not sufficient and that your account is meant to close an escape route for individuals, not open one for corporations.

  Fourth, the Kantian will ask why the size of the difference you make should bear at all on what you owe anyone, suggesting that if an act is wrong because it participates in a harmful scheme, the causal structure is irrelevant and you have conceded too much to consequentialism by tying duty to efficacy. You should reply that you agree there are non-causal duties, which is why you ground the voting case in fairness, but that for harm-based duties like meat consumption, many people intuitively feel the duty depends on preventing harm, so your account bridges the gap by showing harm prevention is possible even in lumpy cases. You must be ready to concede that if they insist duty is purely about maxims, your account only addresses the subset of duties grounded in harm prevention, and you should not try to convince them that causation is the only ground of duty.

  Fifth, the applied ethicist with effective altruist sympathies will want to know what any of this implies for what we should tell people to do, asking whether the diachronic story makes individual offsetting, corporate campaigning, or neither look like the better intervention given that my own purchase is deferred rather than eliminated. Your reply is that it supports sustained individual abstention over one-off gestures because the difference accumulates over time to cross thresholds, but it also supports campaigning because changing the threshold itself is more efficient than waiting to cross it. The soft spot is that your view does not radically change the recommendation compared to standard expected utility, so if they press for a distinct policy implication, concede that the main value is motivational and explanatory rather than action-guiding in a novel way.

  Sixth is the question you are hoping nobody asks, which is your own candidate charge that the deferral reply does not answer the inefficacy objection but relocates it, since whether any harm is ever averted still depends on whether enough other people abstain, so that your own act is supposedly still inefficacious unless it is joined. Your reply should be that inefficacy objections rely on the claim that my act makes no difference to the outcome, but the diachronic reply shows my act changes the timing of the outcome, which is a difference in the world, even if the total quantity of harm remains dependent on collective action. The softness here is that you are redefining difference-making to include temporal shifts, so if they argue that a delay is not a prevention, you should concede that it is not a prevention of the total harm but is a prevention of harm at time t, which matters for victims at time t.

  Seventh, someone will press you on the consistency of your view by asking why you concede that no causal reply works for voting but insist one works for meat, given that both involve thresholds and collective action, and they will suggest the structural similarity is stronger than you allow. Your reply is that voting lacks an inventory mechanism to defer into, so once the election passes the opportunity is lost, whereas meat supply chains have continuous replenishment cycles that allow demand to ripple forward in time. You should be prepared to concede that the line is thinner than you prefer and that if voting had a carry-over mechanism like cumulative voting or debt, your causal reply might apply there too.

  Eighth, and least damaging if handled quickly, is the metaphysical worry from your home department that threshold crossing is not a causal notion at all but a counterfactual one, which will try to drag you into a forty-minute discussion on causation. Your reply is that you are using a pragmatic notion of causation relevant to moral deliberation, where changing the probability or timing of an event counts as causing it, and you should explicitly state that you do not need to settle the metaphysics of causation to make the moral point. If they push, concede that the metaphysics is debated but insist the moral relevance of counterfactual dependence is sufficient for duty.

  Regarding the question you should actually be dreading, I think you are right to worry about the relocation objection, but the decision theorist stability objection is actually more dangerous because if your model of inventory systems is empirically false, your diachronic reply collapses entirely, whereas the relocation objection is a philosophical reinterpretation you can defend by stipulation. You should dread the empirical challenge more because it is harder to fix in Q&A without looking like you are guessing, so if that comes up, retreat to the structural possibility rather than empirical certainty.

  I am about seventy percent confident in this read of the audience because the profiles you described are archetypal for mixed departments, but the wildcard is how much the senior consequentialist cares about the distinction between continuous and lumpy cases versus just wanting the bottom line. The one claim in this prep sheet I am least sure of is the reply to the decision theorist regarding the stability of demand, because if they cite specific supply chain literature showing high volatility that breaks your convergence claim, you will not have a ready citation to counter them and will have to rely on philosophical idealization, which might look like evasion.
