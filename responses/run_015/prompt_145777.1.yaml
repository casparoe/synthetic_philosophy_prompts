      *   **The Task:** Argue *for* the user's intuition. Specifically, argue that Rorty's antirepresentationalism is *incompatible* with his account of scientific success *unless* he smuggles in a "minimal representational thesis" (instrumental representationalism).
      *   **Key Requirements:**
          *   Defend the claim that predictive success requires *some* structural correspondence between vocabulary and causal regularities.
