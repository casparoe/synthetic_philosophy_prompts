answer: |-
  Your intuition identifies the central fault line in Rorty's neopragmatism. The standard exegesis—that Rorty simply brackets ontology to focus on practice—fails because "practice" (specifically prediction and control) is not ontologically neutral. If we take Rorty's rejection of representation seriously, we are left with a coherence theory of truth that cannot account for the *asymmetry* of scientific success.

  To save Rorty from sliding into a relativism where physics is merely a dominant narrative rather than a superior tool for navigating a recalcitrant world, we must argue that his system implicitly relies on **Instrumental Representationalism**. This is the claim that for a vocabulary to yield predictive success, its internal logical relations must structurally map onto the causal relations of the environment, even if those vocabularies do not "mirror" the intrinsic nature of the entities involved.

  Here is the argument for why Rorty's antirepresentationalism is incompatible with his account of scientific progress without this minimal thesis, and how this specific form of correspondence differs from the "Mirror of Nature" he rejects.

  ### 1. The Problem of Recalcitrance and the Limits of Redescription
  Rorty famously argues that the world can *cause* us to hold beliefs (by hitting us with a brick or a photon), but it cannot *justify* them; justification is a social phenomenon. He maintains that we should view scientific theories not as accurate pictures of reality, but as "habits of action" that allow us to cope.

  However, this distinction collapses when we consider **prediction**. If language were merely a tool for social coordination and retrospective description, any coherent vocabulary should suffice for coping. Yet, the poetic vocabulary cannot predict the orbit of Uranus, and the theological vocabulary cannot engineer a semiconductor.

  If Rorty insists that the scientific vocabulary is "better" only in the sense that it serves our purposes better, he faces a circularity: *Why* does it serve our purposes better? The answer cannot be "because we agree it does," because the agreement is predicated on the fact that the technology works *independently* of our agreement. The bridge stands regardless of our social solidarity regarding physics.

  Therefore, the "cash value" of the scientific vocabulary lies in its ability to anticipate the **resistance** of the non-human environment. For a vocabulary to anticipate resistance, it must encode information about the structure of that resistance. If the vocabulary did not, in some sense, *represent* the causal regularities of the world, its success would be miraculous. Rorty wants to avoid the "miracle argument" for realism, but without a minimal representational link, the reliability of science becomes inexplicable luck.

  ### 2. The Normative Bite of Normal vs. Abnormal Discourse
  In *Philosophy and the Mirror of Nature*, Rorty distinguishes between **normal discourse** (rule-governed inquiry within a vocabulary) and **abnormal discourse** (revolutionary shifts to new vocabularies). He argues that the shift to a new vocabulary is not a matter of getting closer to the truth, but of finding a more useful way of talking.

  Without a minimal representational thesis, this distinction loses its normative force. If justification is purely social, then a shift from Newtonian mechanics to Astrology could be considered "progress" if the relevant community consensus shifted. Rorty would object that astrology doesn't *work*. But "working" implies a standard external to the community.

  To maintain that normal scientific discourse is *normatively superior* to pseudoscience (and not just *different*), Rorty must admit that the world constrains which vocabularies are viable.
  *   **The Circularity:** If we prefer physics because it yields consensus, but we yield consensus because it predicts outcomes, we need an account of prediction that isn't just "more description."
  *   **The Fix:** We must admit that normal discourse is governed by rules that are responsive to **causal structures**. Abnormal discourse becomes "progress" only when the new vocabulary maps those causal structures *more robustly* than the old one.

  Without this, the transition from alchemy to chemistry is merely a change in fashion. To claim it is an improvement in *control* is to claim that the chemical vocabulary latches onto causal levers in the world that the alchemical vocabulary missed. That "latching on" is a representational relation, however deflationary.

  ### 3. Defining "Instrumental Representationalism"
  To rescue Rorty, we must smuggle in a specific kind of correspondence that avoids the metaphysical baggage of the Cartesian/Lockean model he rejects. We can call this **Structural Isomorphism**.

  **The Mirror Model (Rorty's Target):**
  *   **Ontology:** Assumes access to intrinsic properties of objects (substances, essences).
  *   **Relation:** Isomorphism between *propositions* and *facts*. A true sentence shares a logical form with a state of affairs.
  *   **Goal:** Accuracy of depiction. The mind is a spectator.
  *   **Metaphysics:** Requires a "God's Eye View" to verify the match.

  **Instrumental Representationalism (The Necessary Smuggle):**
  *   **Ontology:** Agnostic about intrinsic properties. Concerned only with **causal relations**.
  *   **Relation:** Isomorphism between *inferential relations in language* and *causal relations in the world*.
  *   **Goal:** Reliability of inference. The mind is an operator.
  *   **Metaphysics:** Requires only that the map preserves the connectivity of the territory, not its visual appearance.

  **The Crucial Distinction:**
  In the Mirror model, the word "electron" must correspond to the *essence* of the electron. In Instrumental Representationalism, the term "electron" functions as a node in a theoretical network. The claim is that the *relations* between "electron," "charge," and "field" in the theory correspond to the *causal interactions* between entities in the lab.

  This survives Rorty's critique because it does not claim to tell us what an electron *is* in itself (which would be representational in the forbidden sense). It only claims that the theoretical vocabulary preserves the **counterfactual structure** of the environment. If I say "If I increase voltage, current increases," and the world obeys, my vocabulary has successfully represented a causal dependency, even if "voltage" is just a useful fiction.

  ### 4. Why Rorty Cannot Admit This (And Why He Needs It)
  Rorty explicitly rejects this because he fears it opens the door to metaphysics. He worries that if we admit language "tracks" the world, we must admit there is a "Way the World Is" independent of description.

  However, without this admission, Rorty cannot explain **convergence**. Scientific inquiries from different cultures and starting points tend to converge on similar theories (e.g., thermodynamics). If truth were merely "what it is better for us to believe" based on local social practices, convergence would be contingent. The fact that it is robust suggests the "betterness" is determined by the fit between vocabulary and world-structure.

  By denying this, Rorty renders the "world" as a mere cause of irritation (surprise) rather than a constraint on validity. But if the world is only a cause of surprise, it cannot guide inquiry. It can only disrupt it. For the world to *guide* inquiry (which Rorty admits science does), the inquirer must be able to read the guidance. Reading guidance requires a code. That code is the minimal representational thesis.

  ### Conclusion
  Rorty's antirepresentationalism is stable only as long as we ignore the mechanics of prediction. Once we ask *how* a vocabulary enables control over nature, the "tool" metaphor demands a specification of how the tool fits the job. A hammer works on nails not just because we agree it does, but because its shape corresponds to the hardness and head of the nail.

  Similarly, scientific vocabulary works on nature because its inferential structure corresponds to the causal structure of the world. Rorty needs **Instrumental Representationalism** to distinguish science from rhetoric. He must admit that while language does not *mirror* the intrinsic nature of reality, it must *map* the relational structure of reality to function as an instrument. Without this minimal correspondence, his pragmatism collapses into a social constructivism that cannot account for the very technological success he cites as evidence of science's value. The "Mirror" is dead, but the "Map" remains indispensable.
