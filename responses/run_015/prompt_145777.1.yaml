          *   Be precise about the *kind* of correspondence that survives (distinguish it from the "Mirror of Nature" model).

  2.  **Deconstruct Rorty's Position (The Target):**
      *   *Core Claim:* Language is a tool, not a picture. Truth is "what it is better for us to believe," not "accurate representation."
      *   *Science:* Science is just another vocabulary, but it's really good at prediction and control. It's not "closer to reality," just more useful for specific purposes.
      *   *Normativity:* Justification is social, not metaphysical. We justify beliefs to *people*, not to the *world*.
      *   *The Problem:* If justification is *only* social, why does science work on *nature*? If I say "gravity is a social construct," the apple still falls. Rorty admits the apple falls. Why does the scientific vocabulary handle the apple better than the poetic vocabulary?

  3.  **Develop the Counter-Argument (The "Instrumental Representationalism" Thesis):**
      *   *Premise 1:* Prediction and control require more than just social agreement. They require interaction with a recalcitrant world.
      *   *Premise 2:* If the world pushes back, our vocabulary must have a specific relationship to the world's "pushes."
      *   *Conclusion:* Therefore, successful vocabularies must "track" or "map" causal structures, even if they don't "mirror" essences.
      *   *Distinction:* This isn't the "Mirror of Nature" (isomorphism between proposition and fact). It's "Instrumental Representationalism" (isomorphism between causal relations in theory and causal relations in world).

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. It's a sophisticated critique. State the thesis: Rorty's pragmatism implicitly relies on a structural mapping he explicitly denies.
      *   **The Problem of Recalcitrance:** Rorty says the world can speak (cause pain/surprise) but not *say* anything (propositions). Challenge this. If the world causes surprise, it has structure. If our vocabulary anticipates that surprise, it must align with that structure.
      *   **Prediction vs. Redescription:** If science is just redescription, why can't poetry predict eclipses? The difference isn't just social utility; it's causal grip. This implies a representational link.
      *   **Normativity and Non-Circularity:** Rorty relies on "solidarity" for justification. But if we ask *why* solidarity forms around physics rather than astrology, "because it works" is the answer. "Working" implies a relation to the non-human environment. Without acknowledging this relation, the preference is circular (we like it because we like it).
      *   **Defining the "Minimal Correspondence":** This is crucial. It's not *Truth as Correspondence* (Tarski/Realism). It's *Functional Isomorphism*. The map doesn't look like the territory, but the roads on the map connect the same way the roads in the territory connect.
      *   **Distinguishing from the Mirror:** The Mirror implies a privileged access to "Reality as It Is." Instrumental Representationalism admits we only know the relations, not the relata. It's structural realism without the metaphysics.
