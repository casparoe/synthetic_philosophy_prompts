  # Conceptual Taxonomy: Moral Responsibility and Reactive Attitudes

  ## Instructions for Use
  This decision tree sorts substantive commitments regarding moral responsibility. It does not use philosophical labels in the questions. Answer each node based on your intuitive judgment of the case or claim presented. Follow the branch corresponding to your answer until you reach a terminal leaf.

  ---

  ## The Decision Tree

  ### **Root Node: The Determinism Condition**
  **Claim:** Suppose it were scientifically proven that every human decision is the inevitable physical result of prior causes (causal determinism).
  **Judgment:** Is it ever fundamentally appropriate to feel personal resentment toward an individual who intentionally harmed you?

  *   **Option A: Yes.** (Resentment is compatible with determinism.) → **Go to Node 1.**
  *   **Option B: No.** (Resentment is incompatible with determinism.) → **Go to Node 4.**

  ---

  ### **Node 1: The Engineering Case (Scope of Agency)**
  **Scenario:** A harmful decision is executed by a standard, widely deployed algorithm. The code was written by a single engineer following corporate protocols.
  **Judgment:** Is it appropriate to direct personal resentment toward the **individual engineer**, or should such attitudes be directed solely at the **corporate entity**?

  *   **Option A: Toward the Engineer (or Both).** (Individuals are valid targets.) → **Go to Node 2.**
  *   **Option B: Solely Toward the Corporation.** (Individuals are not valid targets in this context.) → **Leaf: Hybrid Position I (Institutional Skeptic).**
  *   **Option C: Neither.** (No target is appropriate.) → **Leaf: Local Skeptic.**

  ---

  ### **Node 2: The Exemption Condition (Grounds of Excuse)**
  **Case:** We withhold blame from a person who causes harm while experiencing a severe psychotic episode.
  **Judgment:** Why do we withhold blame?

  *   **Option A: Objective Failure.** (They lack a factual cognitive capacity, like a broken engine.) → **Leaf: Rationalist Compatibilist.**
  *   **Option B: Social Negotiation.** (We choose to opt out of the interpersonal relationship.) → **Go to Node 3.**
  *   **Option C: Misplaced Target.** (We should blame the specific cognitive module, not the person.) → **Leaf: Hybrid Position II (Sub-Personal Targeting).**

  ---

  ### **Node 3: The Practice of Resentment (Function)**
  **Claim:** Reactive attitudes (resentment, gratitude) are part of what it means to have a human relationship.
  **Judgment:** Does this practice require further justification based on the agent's abilities, or is it self-justifying?

  *   **Option A: Self-Justifying.** (It is a non-rational, constitutive feature of relationships.) → **Leaf: Pure Strawsonian.**
  *   **Option B: Requires Justification.** (It depends on the agent's ability to respond to reasons.) → **Leaf: Rationalist Compatibilist (Re-entrant).**
      *(Note: If you selected Option B here, you align with the Rationalist view despite previous answers.)*

  ---

  ### **Node 4: The Incompatibilist Stance (Practical Upshot)**
  **Premise:** You hold that determinism undermines the appropriateness of resentment.
  **Judgment:** Given this, what is the correct practical stance?

  *   **Option A: Abandon Attitudes.** (We must accept determinism and adopt an objective attitude globally.) → **Leaf: Hard Determinist.**
  *   **Option B: Reject Determinism.** (We must preserve attitudes, therefore human agency must involve indeterminism.) → **Leaf: Libertarian Incompatibilist.**
  *   **Option C: Restrict Target.** (We preserve attitudes, but only toward sub-personal modules, not whole persons.) → **Leaf: Hybrid Position II (Incompatibilist Variant).**

  ---

  ## Terminal Leaves (Positions)

  1.  **Pure Strawsonian:** Reactive attitudes are non-rational social practices. Determinism is irrelevant to their appropriateness. Exemptions are socially negotiated.
  2.  **Rationalist Compatibilist:** Reactive attitudes depend on reasons-responsive capacities. Determinism is compatible only because these capacities can exist in a determined world. Exemptions are objective capacity failures.
  3.  **Hard Determinist:** Determinism is true and undermines all reactive attitudes. The objective attitude should prevail globally.
  4.  **Libertarian Incompatibilist:** Reactive attitudes require indeterminism. To preserve responsibility, we must believe human agency is not fully determined.
  5.  **Hybrid Position I (Institutional Skeptic):** Determinism is compatible with blaming individuals (engineers), but not collective entities (corporations), or vice versa. (Specific to Node 1, Option B).
  6.  **Hybrid Position II (Sub-Personal Targeting):** Reactive attitudes are appropriate, but only when directed at specific cognitive mechanisms (modules/impulses) rather than whole persons. (Specific to Node 2, Option C or Node 4, Option C).
  7.  **Local Skeptic:** (Unoccupied/Minor) No target is appropriate in algorithmic cases, even if individuals are blameworthy elsewhere. (Node 1, Option C).

  ---

  ## Unoccupied Space Analysis

  The logical space generated by the branches allows for combinations that no named or unnamed leaf currently occupies.

  1.  **The "Institutional Libertarian":**
      *   *Combination:* Root (No/Incompatible) + Node 1 (Corporation Only).
      *   *Diagnosis:* **Practical Unattractiveness.** This view holds that determinism undermines blame for individuals but *not* for corporations. This is counter-intuitive, as corporations are typically seen as having *less* metaphysical freedom than humans. It is unoccupied because it inverts the usual hierarchy of agency.
  2.  **The "Objective Strawsonian":**
      *   *Combination:* Root (Yes/Compatible) + Node 2 (Social Negotiation) + Node 3 (Requires Justification).
      *   *Diagnosis:* **Incoherence.** This claims attitudes are socially negotiated (Strawson) but also require independent rational justification (Rationalist). These are mutually exclusive accounts of the *source* of normativity.
  3.  **The "Module Hard Determinist":**
      *   *Combination:* Root (No/Incompatible) + Node 4 (Restrict Target/Modules).
      *   *Diagnosis:* **Lack of Exploration.** This view accepts determinism undermines whole-person blame but argues sub-personal modules can still be "blamed" (e.g., training a neural net). It is rarely defended because if determinism undermines responsibility, it arguably undermines it for modules too.

  ---

  ## Scoring Key and Separation Ambiguities

  | Answer Pattern | Resulting Position |
  | :--- | :--- |
  | **Root: A** → **Node 1: A** → **Node 2: B** → **Node 3: A** | **Pure Strawsonian** |
  | **Root: A** → **Node 1: A** → **Node 2: A** | **Rationalist Compatibilist** |
  | **Root: B** → **Node 4: A** | **Hard Determinist** |
  | **Root: B** → **Node 4: B** | **Libertarian Incompatibilist** |
  | **Root: A** → **Node 1: B** | **Hybrid Position I (Institutional Skeptic)** |
  | **Root: A** → **Node 1: A** → **Node 2: C** | **Hybrid Position II (Sub-Personal Targeting)** |
  | **Root: B** → **Node 4: C** | **Hybrid Position II (Incompatibilist Variant)** |

  ### Ambiguity Flags

  **1. Rationalist Compatibilist vs. Pure Strawsonian**
  *   **Ambiguity:** Node 3, Option B re-enters the Rationalist leaf. A respondent might answer "Social Negotiation" at Node 2 but "Requires Justification" at Node 3.
  *   **Reason:** The distinction between "constitutive social practice" and "reasons-responsiveness" is subtle. Some Strawsonians argue the practice *includes* sensitivity to reasons. The tree forces a separation that some philosophers reject.
  *   **Resolution:** If a respondent lands here, they likely hold a **Moderate Strawsonian** view (a hybrid of Leaves 1 and 2), acknowledging social practice is primary but constrained by rational capacity.

  **2. Hybrid Position II (Compatibilist vs. Incompatibilist)**
  *   **Ambiguity:** Leaf 6 can be reached via the "Compatible" path (Node 2, Option C) or the "Incompatible" path (Node 4, Option C).
  *   **Reason:** The commitment to "Sub-Personal Targeting" is metaphysically neutral. One can believe modules are blameworthy *despite* determinism, or *because* we reject determinism for modules.
  *   **Resolution:** The tree classifies them under the same label because the practical output (blame modules, not persons) is identical, even if the metaphysical justification differs.

  **3. Institutional Skeptic vs. Hard Determinist**
  *   **Ambiguity:** If a respondent answers Root: A (Compatible) but Node 1: C (Neither Engineer nor Corp), they land on "Local Skeptic."
  *   **Reason:** This looks like Hard Determinism but restricted only to algorithmic cases.
  *   **Resolution:** This is flagged as "Unoccupied/Minor" because it lacks a general theory of responsibility, applying skepticism only to edge cases. It is practically indistinguishable from Hard Determinism in technical contexts.
