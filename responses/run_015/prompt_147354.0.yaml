f leaves your tree cannot really separate, and tell me where you would put a position I have been toying with and calling the convergence-floor view: the idea that the two profiles converge as societies grow larger, more anonymous and more affluent, so the findings predict convergence rather than vindicating either side, and that this is or is not distinguishable from the perceptualist view. My own instinct as a chemist is that the tree should open on a question about measurement — whether the factor structure would survive a change of instrument and a change of population — but I leave the structure to you, and I would rather you started where the disagreement is sharpest. One constraint from our group: several of us have no library access, so please do not point us toward papers, books or reading lists, and reason from the cases themselves. Please write the answer in American English.
