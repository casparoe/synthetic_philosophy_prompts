  **Handout: A Decision Tree for Moral Foundations Meta-Ethics**

  **Purpose:** This instrument sorts participants based on their verdicts regarding five concrete cases. It avoids asking about your political identity or your belief in moral objectivity directly. Instead, it infers your meta-ethical position from how you weigh empirical data against normative intuition.

  **Instructions:** Start at Node 1. Answer "Yes" or "No" based on your judgment of the case described. Follow the arrow to the next node or to a final classification (Leaf).

  ### The Decision Tree

  **Node 1: Instrument Invariance (The Cross-Cultural Survey)**
  *Case:* A survey in a distant culture shows that "Harm" items and "Purity" items load on a single factor, and the left–right score difference disappears.
  *Question:* Does this statistical shift invalidate the claim that there are distinct moral foundations universally?
  *   **Yes** → Go to **Leaf A (Measurement-Skeptical)**.
  *   **No** → Go to Node 2.

  **Node 2: Metric Authority (The Algorithmic Triage)**
  *Case:* A hospital replaces senior consultants with a validated algorithm that beats them on every measurable fairness metric. Staff and patients report a "loss they cannot name."
  *Question:* Does the algorithm's superior metric performance settle the question of whether the decision is *right*, rendering the "unnamed loss" irrelevant?
  *   **Yes** → Go to **Leaf B (Strict Irrelevance)**.
  *   **No** → Go to Node 3.

  **Node 3: Compensation Sufficiency (The Plant Closure)**
  *Case:* A firm closes a plant in a town where it employed four generations of families. Every worker is compensated at more than their expected lifetime earnings, yet the town's social fabric collapses.
  *Question:* Is there a moral residue or failure here that the money did not fix?
  *   **No** → Go to Node 4 (The Debunking Path).
  *   **Yes** → Go to Node 6 (The Vindicating Path).

  **Node 4: Justificatory Transparency (The AI Model)**
  *Case:* A language model trained on ordinary moral talk reproduces the human factor structure but offers *only* Harm-and-Fairness justifications for every verdict it scores.
  *Question:* Is the model morally deficient because it lacks Loyalty, Authority, and Purity justifications?
  *   **No** (Harm/Fairness logic is sufficient) → Go to Node 5.
  *   **Yes** (It is missing something essential) → Go to **Leaf C (Symmetric Debunking)**.
      *(Note: If you said "No" to Node 3 but "Yes" here, you hold that Purity matters but Loyalty does not, which is an unstable position. For this tree, this combination suggests you believe all foundations are psychological artifacts, none tracking truth.)*

  **Node 5: Harm/Fairness Realism (The Flag Burning)**
  *Case:* A person, entirely in private and without damaging anything, uses a national flag as a drop cloth and then burns it.
  *Question:* Are Harm and Fairness intuitions *also* just psychological artifacts, or do they track moral truth better than Purity intuitions?
  *   **Yes** (They are also artifacts) → **Leaf C (Symmetric Debunking)**.
  *   **No** (They track truth; Purity does not) → **Leaf D (Asymmetric Debunking)**.

  **Node 6: Ecological Calibration (The Cross-Cultural Survey Revisited)**
  *Case:* Return to the survey where the factor structure disappeared in another country.
  *Question:* If the 5-foundation structure is not found there, is that society morally incomplete?
  *   **No** (Morality calibrates to the local social ecology) → **Leaf E (Perceptualist)**.
  *   **Yes** (There is a universal human standard) → Go to Node 7.

  **Node 7: The Ideal Agent (The Full Complement)**
  *Case:* Consider the "full human complement" of all five foundations.
  *Question:* Is possessing all five foundations the mark of a well-functioning *individual* moral sense?
  *   **Yes** → **Leaf F (Functionalist)**.
  *   **No** (It is a balance to be negotiated across a *society*) → Go to Node 8.

  **Node 8: Convergence (The Affluence Test)**
  *Case:* Imagine societies growing larger, more anonymous, and more affluent.
  *Question:* Do the moral profiles of "Left" and "Right" converge in these conditions, suggesting the differences were temporary ecological adaptations?
  *   **Yes** → **Leaf G (Convergence-Floor View)**.
  *   **No** (The tension is permanent) → **Leaf H (Pluralist)**.

  *(Note: Node 8 was added to accommodate your specific theoretical interest. If you do not wish to use this node, merge Leaf G and H into a single Pluralist leaf.)*

  ---

  ### The Leaves: Classifications and Commitments

  **Leaf A: Measurement-Skeptical View**
  *Definition:* The psychology is too instrument-dependent to draw meta-ethical conclusions.
  *Awkward Commitment:* We must suspend judgment on who is morally right until we invent a better survey, potentially forever.

  **Leaf B: Strict Irrelevance View**
  *Definition:* Empirical psychology cannot determine normative truth (the Is-Ought gap).
  *Awkward Commitment:* A perfect algorithm is morally superior even if every human being feels it is wrong.

  **Leaf C: Symmetric Debunking View**
  *Definition:* None of the foundations survive scrutiny; all are non-rational intuitions.
  *Awkward Commitment:* There is no rational way to prefer a society based on Harm reduction over one based on Purity rituals.

  **Leaf D: Asymmetric Debunking View**
  *Definition:* Harm/Fairness are truth-apt; Loyalty/Authority/Purity are evolutionary by-products.
  *Awkward Commitment:* Right-leaning morality is essentially a cognitive error, while Left-leaning morality is essentially rational.

  **Leaf E: Perceptualist View**
  *Definition:* Foundations are modular capacities calibrated to a local social ecology.
  *Awkward Commitment:* A moral truth in one social environment may be a moral error in another, with no higher court of appeal.

  **Leaf F: Functionalist View**
  *Definition:* The full human complement of foundations is the well-functioning moral sense.
  *Awkward Commitment:* We must vindicate Purity and Authority as morally necessary, even when they conflict with modern liberal intuitions.

  **Leaf G: Convergence-Floor View (Your Proposal)**
  *Definition:* Profiles converge as societies grow affluent; findings predict convergence rather than vindicating either side.
  *Awkward Commitment:* Current moral disagreements are merely historical artifacts that will vanish with sufficient GDP, not deep truths.

  **Leaf H: Pluralist View**
  *Definition:* Morality is thicker than Harm; each side is half-blind and needed.
  *Awkward Commitment:* We must permanently tolerate moral systems that contradict each other without expecting a final resolution.

  ---

  ### Map of Logical Space

  This map identifies combinations of answers that are logically unoccupied, incoherent, or merely unexplored.

  1.  **The "Purity-Only" Realist (Unoccupied):** A position where Harm/Fairness are debunked as biases, but Loyalty/Authority/Purity track truth.
      *   *Why Unoccupied:* Evolutionarily unstable. A species that values group cohesion (Purity/Authority) but ignores individual harm (Harm/Fairness) tends to self-destruct or fail to launch cooperative structures complex enough to sustain the "Right" foundations.
  2.  **The "Instrument-Realist" (Incoherent):** A position claiming the survey instruments are flawed (Leaf A) but that we can still know which moral profile is objectively better (Leaf F).
      *   *Why Incoherent:* If the measurement of the psychological structure is invalid, the claim that the "full complement" is the functional ideal loses its empirical basis. You cannot be a Skeptic about the data and a Functionalist about the conclusion simultaneously.
  3.  **The "Strict Perceptualist" (Unexplored):** A position where the ecology dictates the morality (Leaf E), but there is no convergence even in affluent societies (Node 8 = No).
      *   *Why Unexplored:* Most ecological models predict that as environmental pressures (scarcity, threat) normalize, behavioral phenotypes should normalize. Denying this suggests morality is culturally arbitrary rather than ecologically calibrated.
  4.  **Indistinguishable Leaves:** **Symmetric Debunking (C)** and **Strict Irrelevance (B)**.
      *   *Why:* In practice, both lead to the conclusion that the psychological data cannot tell us who is right. The distinction is theoretical: Strict Irrelevance says data *cannot* tell us (principle); Symmetric Debunking says this data shows *nothing* is right (outcome). In a reading group discussion, these two will often argue for the same verdict on cases.

  ---

  ### Note on the Convergence-Floor View

  You asked where to place the **Convergence-Floor View**. In the tree above, it occupies **Leaf G**, branching off from the Pluralist/Functionalist line at Node 8.

  **Distinction from Perceptualist (Leaf E):**
  The Perceptualist view holds that morality is *always* calibrated to the local ecology; if the ecology changes, the morality changes, and neither is "better." The Convergence-Floor view makes a stronger claim: it suggests that as societies hit a "floor" of affluence and anonymity, the moral profiles *merge*.
  *   If you believe this convergence makes the resulting morality *truer* or *better*, you are drifting toward **Functionalist (Leaf F)**.
  *   If you believe this convergence is merely a descriptive prediction with no normative weight, you remain a **Perceptualist (Leaf E)**.
  *   If you believe the convergence shows that the "Right" foundations were merely stress-responses to scarcity/threat, you are drifting toward **Asymmetric Debunking (Leaf D)**.

  **Chemist's Analogy:**
  Think of the moral foundations as chemical indicators.
  *   **Strict Irrelevance:** The color of the solution tells you nothing about the pH.
  *   **Measurement-Skeptic:** We are using the wrong litmus paper.
  *   **Perceptualist:** The indicator changes color based on the solvent, not just the pH.
  *   **Convergence-Floor:** In highly purified water (affluent society), all indicators eventually show the same color. The question is: Does that color represent the "true" pH, or just the pH of purified water?

  ### Guidance for the Group

  Since you cannot access library resources, reason from the cases themselves. If two participants land on different leaves but agree on every case verdict, the disagreement is merely terminological. If they land on the same leaf but disagree on the cases, one of them has answered the tree inconsistently. Use the "Awkward Commitments" to test whether they are willing to accept the cost of their classification.
