      *   **Section 4: Non-Identity & Consent.** The Parfit slide.
          *   *Requirement:* Consent of those brought into existence.
          *   *Wording:* "Implicit Consent via Existence", "Baseline Comparison to Non-Existence".
      *   **Section 5: Safety & Risk Attestation.** The "Safe" in Safe Pareto.
          *   *Requirement:* Variance, tail risk, probability everyone is worse off.
          *   *Wording:* "Distributional Variance Coefficient", "Catastrophic Failure Threshold".
      *   **Footer/Worked Example:** A specific policy that is clearly bad but passes.
          *   *Idea:* Compulsory relocation for a dam? Or a fertility tax? Let's go with "Mandatory Coastal Relocation Initiative".
