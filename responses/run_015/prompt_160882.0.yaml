  **OFFICE OF DISTRIBUTIONAL REVIEW**
  **FORM ODR-742(b): APPLICATION FOR CERTIFICATION OF A SAFE PARETO IMPROVEMENT**

  **INSTRUCTIONS:** Complete all fields in triplicate. Failure to disclose model parameters may result in decertification. This form establishes that the proposed policy intervention satisfies the conditions for a Safe Pareto Improvement (SPI) under Administrative Guideline 12-C. By signing, the Applicant acknowledges that "Safety" is a function of model specification, not ontological certainty.

  **1. DEFINITION OF AFFECTED PARTIES AND STANDING**
  To establish a valid Pareto comparison, the Relevant Population ($P$) must be defined prior to utility aggregation. Please indicate which entities possess standing under this application:

  [ ] **Contemporaneous Utility-Bearing Entities (CUBE):** Persons currently alive whose identity is invariant to the policy intervention.
  [ ] **Contingent Persons:** Persons whose existence is causally dependent on the policy implementation.
  [ ] **Excluded Parties:** Please check any categories to be excluded from $P$ to prevent veto power:
      [ ] **Counterfactual Objectors:** Persons who would exist under the status quo but not under the policy, whose utility loss is outweighed by non-existence.
      [ ] **Model-Resistant Agents:** Persons whose utility functions cannot be cardinalized within the Ministry's preferred metric (e.g., "dignity," "autonomy").
      [ ] **Future Generations:** Persons born beyond the 30-year fiscal horizon, unless their discounted utility is positive.

  *Note: Objections filed by Excluded Parties are administratively void.*

  **2. COMPENSATION PROTOCOL (KALDOR–HICKS COMPLIANCE)**
  If the policy yields net benefits but imposes losses on any subset of $P$, compensation must be structured. Select the applicable mechanism:

  [ ] **Actual Compensation:** Direct transfer of resources occurring within the fiscal year.
  [ ] **Hypothetical Compensation:** Transfers that *could* occur such that gainers *could* compensate losers, regardless of whether payment is made. (Default)
  [ ] **Retroactive Compensation:** Liability assigned to future beneficiaries to compensate past losers, discounted to present value.
  [ ] **Posthumous Compensation:** Memorialization, naming rights, or statistical acknowledgment awarded after the utility loss is incurred.

  *Justification for Hypothetical/Retroactive/Posthumous Selection:*
  ____________________________________________________________________________
  ____________________________________________________________________________

  **3. DISCOUNT RATE AND PROBABILITY FIELD**
  Expected utility improvements must be calculated using an approved stochastic model.

  **3.1 Social Discount Rate ($r$):** _______% per annum.
  *If $r$ > 5%, attach justification for intergenerational equity weighting.*

  **3.2 Model Specification Attestation:**
  The Applicant certifies that the probability distribution function used to estimate outcomes was:
  [ ] Specified prior to data collection.
  [ ] Calibrated ex-post to maximize the likelihood of SPI certification. (Check here if applicable)

  *Warning: Selecting ex-post calibration waives the right to claim model uncertainty as a mitigating factor during audit.*

  **4. NON-IDENTITY AND CONSENT REGISTRATION**
  For Contingent Persons (see Section 1), standard harm benchmarks do not apply. Consent is registered as follows:

  [ ] **Implicit Consent via Existence:** Consent is inferred if the contingent person's life expectancy exceeds the "Null Baseline" (non-existence).
  [ ] **Identity-Insensitive Aggregation:** Utility is assigned to the "slot" occupied by the person, regardless of specific identity.
  [ ] **Waiver of Complaint:** Contingent persons are deemed to have waived the right to complain about the conditions of their creation, provided their utility $U > 0$.

  *Please confirm that no Contingent Person falls below the Life-Worth-Living Threshold (LWLT):* [ ] Yes [ ] No

  **5. SAFETY ATTESTATION AND TAIL RISK**
  A "Safe" improvement requires bounds on variance. The Applicant must attest to the following risk parameters:

  **5.1 Distributional Variance:** The standard deviation of utility changes across $P$ does not exceed _______ units.
  **5.2 Catastrophic Failure Threshold:** The probability that the policy results in a net utility decrease for the aggregate population is less than _______%.
  **5.3 Universal Loss Probability:** The Applicant acknowledges the maximum acceptable probability that *every* member of $P$ is made worse off (including Contingent Persons) is:
  [ ] 0% [ ] <1% [ ] <5% [ ] Administratively Negligible

  *If "Administratively Negligible" is selected, attach Risk Acceptance Form R-9.*

  **6. DECLARATION**
  I certify that the information provided herein presents the policy as a Safe Pareto Improvement within the confines of the selected model. I understand that "Safety" refers to the stability of the conclusion under the chosen parameters, not the invulnerability of the affected population.

  **Applicant Signature:** __________________________ **Date:** _______________
  **Review Officer Initials:** _________ **Certification ID:** _________________

  ***

  **FOOTER: WORKED EXAMPLE (REFERENCE ONLY)**
  *Policy:* **Mandatory Coastal Relocation Initiative (MCRI).**
  *Outcome:* 10,000 residents relocated to inland zones with 40% lower housing quality.
  *Certification Logic:*
  1.  **Standing:** Relocated residents defined as CUBEs; future children born in inland zones defined as Contingent Persons.
  2.  **Compensation:** Selected **Hypothetical**. Relocates *could* be compensated by inland developers, though no funds are allocated.
  3.  **Non-Identity:** 2,000 children will be born in inland zones who would not exist under status quo. Their lives exceed LWLT. Consent registered via **Implicit Consent via Existence**.
  4.  **Risk:** 4% probability that inland zones flood similarly. Deemed **Administratively Negligible**.
  5.  **Result:** Certified SPI. Objections regarding loss of community cohesion excluded under **Model-Resistant Agents**.
