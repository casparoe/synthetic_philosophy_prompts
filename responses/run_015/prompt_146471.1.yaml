answer: |-
  # Activity: The Intertheoretic Allocation Game

  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Goal:** Students construct a decision procedure for moral uncertainty (Maximizing Expected Choiceworthiness) and encounter its structural pathologies (Compromise, Fanaticism, Intertheoretic Comparison) through the mechanics of the game.

  ## 1. Setup & Materials

  **Room:** Single table or U-shape. No podium.
  **Materials per Student:**
  1.  **Theory Cards (3):** Small cards describing the three moral views (see below).
  2.  **Project Cards (4):** Descriptions of the allocation targets.
  3.  **Worksheet:** A grid for entering Credence and Value Scores.
  4.  **Credence Chips:** 10 physical tokens (poker chips or paper slips) per student.
  5.  **Play Money Pot:** A central envelope containing $1,000 in mock currency (representing the department's "ethical budget").

  **The Three Theories (One Line Each):**
  1.  **Near-Term Consequentialism (NTC):** Maximize aggregate welfare of currently living sentient beings.
  2.  **Deontology (DEON):** Respect individual rights and special obligations; some acts are forbidden regardless of outcomes.
  3.  **Long-Run Consequentialism (LRC):** Maximize the expected value of the far future; existential risk reduction dominates current welfare.

  **The Four Projects (Engineered Options):**
  1.  **Project A (The Compromise): "Global Vaccination Initiative."**
      *   *Description:* Prevents a pandemic. Saves 50,000 lives now. Stable institutions. Minimal impact on 1000+ year timeline.
      *   *Engineered Valuation:* High value for NTC (not max), High for DEON (rights/rescue), Moderate for LRC (stability).
  2.  **Project B (NTC Peak): "Direct Cash Transfers."**
      *   *Description:* Most cost-effective way to save lives *now*. Saves 80,000 lives. Bypasses local consent structures.
      *   *Engineered Valuation:* Max for NTC. Low for DEON (consent issues). Low for LRC (drop in bucket).
  3.  **Project C (DEON Peak): "Historical Restitution Fund."**
      *   *Description:* Repairs specific rights violations against a wronged community. Saves 500 lives equivalent.
      *   *Engineered Valuation:* Low for NTC (inefficient). Max for DEON (duty). Low for LRC (irrelevant).
  4.  **Project D (The Fanatic): "Asteroid Deflection System."**
      *   *Description:* 0.01% chance to prevent human extinction. Saves 10^50 future lives. Zero current welfare benefit.
      *   *Engineered Valuation:* Zero/Low for NTC. Low for DEON. **Astronomical** for LRC.

  ---

  ## 2. Rules & Timeline

  ### Phase 1: Credence & Valuation (20 Minutes)
  **Instruction:** "You are the Ethics Board. You must allocate the $1,000 pot to exactly **one** project. You are unsure which moral theory is true. Build a procedure to decide."

  1.  **Credence (5 mins):** Distribute your **10 Credence Chips** across the 3 Theory Cards. This represents your subjective probability that each theory is true. (Must use all 10).
  2.  **Valuation (15 mins):** On your Worksheet, for *each* Theory, assign a **Value Score (0–100)** to each of the 4 Projects.
      *   *Crucial Instruction:* "Assign points representing how morally *good* the outcome is **if that theory is the true one**. You are not limited to a 1-10 scale; use the full 0-100 range to reflect the stakes *within* that theory."
      *   *Note:* This open scaling is the trap for Goal 3.

  ### Phase 2: Aggregation & Collective Choice (20 Minutes)
  **Instruction:** "We need a class decision. We will aggregate our individual worksheets to find the 'Expected Moral Value' (EMV) of each project."

  1.  **Calculation (10 mins):** Students calculate their personal EMV for each project:
      $$ \text{EMV} = (\text{NTC Chips} \times \text{NTC Score}) + (\text{DEON Chips} \times \text{DEON Score}) + (\text{LRC Chips} \times \text{LRC Score}) $$
  2.  **Submission (5 mins):** Students submit their top project choice and their EMV numbers to you.
  3.  **Tally (5 mins):** You sum the class EMVs for each project on the board.
      *   *Expected Outcome:* Project A (Compromise) usually wins if students normalize scales (0-100). Project D (Fanatic) wins if LRC-credence students use the full 100 for extinction prevention while others use 100 for 50,000 lives.

  ### Phase 3: The Binding Vote & Payoff (5 Minutes)
  **Instruction:** "The math suggests Project [X]. However, this is a binding choice. If we choose Project D, we are ignoring current suffering for a tiny chance at the future. If we choose Project A, we are ignoring the potential end of humanity."

  *   **The Vote:** A simple show of hands to ratify the mathematical winner.
  *   **The Payoff Structure:**
      *   If the class ratifies the **Mathematical Winner**: The "Simulation" succeeds. (You hand out a "Rational Agents" certificate/cookie).
      *   If the class **Overrides the Math** (e.g., Math says Fanatic, Class votes Compromise): The "Simulation" notes a "Normative Conflict." (You acknowledge the revolt).
      *   *Twist:* If Project D (Fanatic) wins the math but loses the vote, announce that the "LRC Theorists" in the room are effectively being outvoted by a coalition of NTC/DEON, despite their stakes.

  ### Phase 4: Debrief (30 Minutes)
  *See questions below.*

  ---

  ## 3. The Three Engineered Problems

  1.  **The Compromise Winner (Project A):**
      *   *Mechanism:* Project A has high, stable scores (e.g., 80, 80, 80) across all theories. Projects B and C have high variance (100, 20, 20).
      *   *Result:* Under credence-weighted aggregation (MEC), A wins because it avoids the "penalty" of being ranked low by any theory.
      *   *Contrast:* If students simply "acted on their most plausible theory" (Maximal Credence), the class would fracture between B and C. Aggregation creates consensus where plurality creates conflict.

  2.  **The Fanaticism Trap (Project D):**
      *   *Mechanism:* LRC theory *demands* a massive score for Project D (e.g., 100 vs 5). NTC/DEON assign it near 0.
      *   *Result:* Even with low credence (e.g., 2 chips), if the LRC score is astronomical enough, the EMV for D surpasses A.
      *   *Conflict:* The math says D. The room feels D is absurd. This exposes the **Fanaticism Problem** inherent in expected value maximization under moral uncertainty.

  3.  **The Intertheoretic Comparison Problem (Scaling):**
      *   *Mechanism:* You allowed a 0–100 scale *per theory*.
      *   *Result:* Is "100 points" of Deontological goodness equal to "100 points" of Consequentialist goodness?
      *   *Exposure:* In the debrief, you will show that if we treat Deontology points as "half value" (compression), Project B wins. If we treat LRC points as "double value" (stretching), Project D wins. The verdict relies entirely on an arbitrary normalization assumption the students made without noticing.

  ---

  ## 4. Debrief Questions

  **Mapping the Moments:**
  1.  **On Aggregation vs. Plurality:** "Look at the students who put most chips on NTC. You voted for Project B. But the class chose Project A. Why did the aggregation procedure override your 'most plausible' theory? What does this imply about what we owe to moral theories we think are *less* likely to be true?"
  2.  **On Fanaticism:** "For those who assigned a high score to Project D under LRC: The math demanded we fund it. For those who voted against it: You rejected the math. Did you reject Expected Value Maximization, or did you reject the *scale* of the LRC value? Is it rational to ignore a tiny probability of infinite value?"
  3.  **On Intertheoretic Comparison:** "I asked you to use a 0–100 scale for each theory. Did anyone hesitate to put '100' on the Deontology project because 50,000 lives (NTC) felt 'bigger' than 1 duty fulfilled (DEON)? If you adjusted your numbers to match 'intuitive magnitude,' did you just smuggle in a meta-ethical assumption that all theories share a common currency of value?"

  **Honest Account: What Will Go Wrong**
  *   **Collusion/Chat:** Students will talk during the Valuation Phase. "What did you put for LRC?" This ruins the private credence data. *Mitigation:* Enforce silence strictly during Phase 1.
  *   **Scale Confusion:** Half the class will use 1–10, half will use 1–100. The aggregation will be noise. *Mitigation:* In the debrief, explicitly normalize the data on the board to show how the winner flips.
  *   **The Fanatic Revolt:** If Project D wins the math, the class may refuse to vote for it entirely, stalling the "binding choice." *Mitigation:* Allow the vote to fail. The failure *is* the data point for the debrief (showing that intuitive morality rejects MEC when it implies fanaticism).
  *   **Time Creep:** The calculation takes longer than expected. *Mitigation:* Have a spreadsheet ready on your laptop to ingest their numbers quickly if manual board math stalls.

  **Limitations: What You Must Supply in Words**
  *   **Metanormative Realism:** The activity assumes there *is* a fact of the matter about "choiceworthiness." You must explain that expressivists or error theorists would reject the premise of the game entirely.
  *   **Risk Aversion:** The math assumes risk neutrality. Students might reject Project D simply because they are risk-averse, not because they reject LRC. You must distinguish *moral* risk from *empirical* risk.
  *   **Incommensurability:** The activity forces a common scale (0–100). You must acknowledge that many philosophers argue these values *cannot* be compared cardinally, meaning the entire procedure is category error.

  ---

  ## 5. Instructor Cheat Sheet (The Math Behind the Curtain)

  *To ensure the engineering holds, watch for these patterns during Phase 1:*

  *   **If Compromise (A) loses:** It means students are polarizing their values (giving 100 to their favorite, 0 to others). *Intervention:* In future runs, emphasize that "Second best" options should still receive significant points (e.g., 70+).
  *   **If Fanatic (D) doesn't trigger:** LRC students are being modest with their scores. *Intervention:* In the debrief, ask the LRC students: "If extinction is truly infinite loss, why wasn't your score 100 and the others 0?"
  *   **If Scaling isn't noticed:** Students assume 1 Point = 1 Unit of Good universally. *Intervention:* Explicitly ask, "Does preventing a rights violation equal preventing 1,000 headaches? Your sheet says yes. Do you agree?"

  **Final Reveal:**
  " The procedure you just built—weighting credences by conditional value—is called **Maximizing Expected Choiceworthiness (MEC)**. The problems you just fought over are the **Compromise Objection**, the **Fanaticism Objection**, and the **Intertheoretic Comparison Problem**."
