      *   **Specific Constraint:** Do *not* use the standard Water/H2O vs. XYZ narrative. Use the historical case of *Jade* (Jadeite vs. Nephrite).
      *   **Goal:** Motivate semantic externalism (reference fixed by environment, not just internal state).
      *   **Deliverables:**
          1.  Explanatory Arc (Conceptual Dependency & Why Jade > Water).
          2.  Misconception Map (Sequence, Interception Points, Strategies).
          3.  Concluding Check (One diagnostic question).
          4.  Exclusions (What to leave out & Justification).
      *   **Format:** Plan the arc, not the script.

  2.  **Deconstruct Deliverable 1: Explanatory Arc & Conceptual Dependency:**
      *   *Dependency:* Before arguing *against* internalism, students need to know *what* internalism is. It can't just be a straw man. It needs to be the "default" intuition they likely hold (Descriptivism/Fregean sense).
      *   *Why Jade?* Water/XYZ is too sci-fi. Jade is historical and actual. It shows that *even in the actual world*, reference can split without the speakers knowing. It highlights the "kind" aspect better than "substance" sometimes because jade is a trade name turned scientific term.
      *   *Requirements:* Speakers in 1700 and 1950 must be internally identical (regarding the concept) but externally different (one refers to a disjunction/kind, the other to specific minerals, or perhaps the 1700 speaker refers to nothing specific while the 1950 speaker refers to two kinds). Actually, the prompt suggests: "two speakers in 1700 and 1950... mean different things... because their respective environments embed different chemical kinds."
      *   *Refinement on Jade Case:* In 1700, "jade" picks out a functional/aesthetic kind. In 1950, mineralogy splits it. The crucial Putnamian point is: If an 1700 speaker and a 1950 speaker are internally identical, do they refer to the same thing? Putnam says no (if the underlying structure differs). But wait, Jade is tricky because it *is* two minerals. The standard Putnamian use of Jade (by Kripke/Putnam) is often about natural kinds. I need to ensure the setup mirrors Twin Earth logic: Same internal state, different external constitution $\rightarrow$ different extension.
      *   *Correction:* The prompt asks to use Jade to motivate externalism *like* Twin Earth. So, I need to construct a scenario where the *environment* determines the reference despite internal similarity.
      *   *Key Distinction:* Water/XYZ is counterfactual. Jade is actual history. This makes it stronger in one way (it happened) but weaker in another (no perfect internal duplicate). I need to frame the 1700 vs. 1950 comparison carefully.
      *   *What it must contain:* Shared ignorance of chemistry (so internal states are comparable).
      *   *What it must lack:* Perceptual access to the difference (so the difference is purely structural/environmental).

  3.  **Deconstruct Deliverable 2: Misconception Map:**
      *   *Misconception 1: Deference to Authority.* Students might think "Science tells us what words mean." (Social Externalism vs. Causal Externalism).
      *   *Misconception 2: Loss of Cognitive Access.* "If meaning is outside, I don't know what I mean." (Privileged Access objection).
      *   *Misconception 3: Empirical vs. Modal.* "This is just geology, not philosophy." (Missing the metaphysical point about necessity/reference).
      *   *Interception:* Need specific moments in the 90 mins to address these.

  4.  **Deconstruct Deliverable 3: Concluding Check:**
      *   Need a question that tests *understanding of the mechanism* (environmental mediation), not just the *conclusion* ("meanings ain't in the head").
      *   Idea: A variation of the case where the environment is the same but the description differs, or vice versa.

  5.  **Deconstruct Deliverable 4: Exclusions:**
      *   *Division of Linguistic Labor:* Crucial for Putnam, but maybe too complex for 90 mins if focusing on the metaphysics of reference.
      *   *Burge/Arthritis:* That's social externalism. We are doing natural kind externalism. Keep them distinct to avoid confusion.
      *   *Narrow vs. Wide Content:* Too technical.
      *   *Justification:* Focus on the *metaphysical ground* of reference first, before the *social epistemology* of meaning.

  6.  **Drafting the Plan (Iterative Process):**

      *   *Phase 1: The Setup (0-20 mins).* Establish the Internalist Intuition. Use a Fregean/Descriptivist model. "To mean X is to have a description in mind."
      *   *Phase 2: The Jade Case (20-50 mins).* Introduce the historical facts. 1700 (unified concept) vs. 1950 (split concept). Construct the "Twin" scenario: Imagine a 1700 speaker and a 1950 speaker who are intrinsically identical. Do they refer to the same natural kind?
      *   *Phase 3: The Externalist Turn (50-70 mins).* Show why internalism fails here. The extension is fixed by the world, not the description. Address Misconceptions here.
      *   *Phase 4: Assessment (70-90 mins).* Discussion and the Diagnostic Question.

      *   *Refining the Jade Logic:* The standard philosophical use of Jade (e.g., in Kripke) is often to show that "Jade" is *not* a natural kind term in the same way "Gold" is, because it picks out a disjunction. However, for *this* seminar, I must use it to *support* externalism similar to Twin Earth.
