answer: |-
  ### I. Conceptual Dependency and Case Selection

  **The Dependency: Articulating Methodological Internalism**
  Before the jade case can function as a counterexample, the "Internalist" thesis must be established not as a straw man, but as the students' pre-theoretic default. You must secure the commitment to **Descriptivism** (or Fregean Sense) as the primary mechanism of reference.
  *   **The Target:** The view that reference is mediated by a cluster of descriptions or qualitative properties accessible to the speaker's consciousness (e.g., "jade" means *the hard, green, semi-precious stone used in carvings*).
  *   **Why Secure This First?** If students do not explicitly endorse the idea that "what I mean is determined by what I know/describe," the externalist conclusion will feel like a non-sequitur rather than a revision of their semantic intuition. You need them to commit to the verdict that the 1700 and 1950 speakers *should* mean the same thing because their internal descriptions are identical, so that the externalist reversal has argumentative force.

  **Why Jade Over Water (H₂O vs. XYZ)**
  *   **Actualism vs. Counterfactual:** Twin Earth is a science-fiction thought experiment; the Jade case is actual history. This prevents students from dismissing the argument as relying on "impossible worlds." It grounds the metaphysics in the history of science.
  *   **The Disjunction Problem:** Unlike water (which is unified), jade is *two* minerals (jadeite and nephrite). This complicates the case in a pedagogically useful way: it forces students to confront whether reference is fixed by *superficial appearance* (which unifies them) or *underlying structure* (which splits them).
  *   **Required Content:** The setup must emphasize that in 1700, the *samples* in the environment were a mix of both minerals, but the *chemical reality* was hidden. The speakers in 1700 and 1950 (laypersons) must be described as having **identical qualitative concepts** (green, hard, ornamental) and **identical ignorance** of mineralogy.
  *   **Required Absence:** You must deliberately withhold **perceptual access** to the chemical distinction. If the difference were visible, the internal states would differ. The distinction must be purely structural/environmental, discoverable only via causal interaction (testing/mining), not introspection.

  ---

  ### II. Misconception Map and Interception Strategy

  **Misconception 1: The "Scientific Authority" Fallacy**
  *   **The Error:** Students conclude that reference changes in 1950 because *scientists told us* what jade is, rather than because the *environment* contains distinct kinds. They conflate Semantic Externalism with Social Deference.
  *   **Sequence Point:** Arises immediately after revealing the 1950 mineralogical split (approx. Minute 40).
  *   **Interception:** Pose a **Counterfactual Isolation**: "Imagine the 1950 scientists discovered the split but kept it secret. The layperson still thinks 'jade' is one thing. Has the reference of their word 'jade' changed?"
      *   *Goal:* Force the realization that the reference is fixed by the *mineral structure in the ground*, not the *publication of the paper*. The environment mediates reference, not the encyclopedia.

  **Misconception 2: The "Loss of Access" Anxiety**
  *   **The Error:** Students infer that if meaning is external, speakers no longer know what they mean. They conflate *reference* (what the word picks out) with *conceptual content* (what the speaker grasps).
  *   **Sequence Point:** Arises during the comparison of the 1700 and 1950 speakers' mental states (approx. Minute 60).
  *   **Interception:** Distinguish **Epistemic Access** from **Metaphysical Determination**. Ask: "Does the 1700 speaker know *which minerals* they refer to? No. Do they know *what they intend to talk about* (the stuff in front of them)? Yes."
      *   *Goal:* Clarify that externalism limits *omniscience* regarding extension, not *authority* regarding intention. The speaker fixes the *target* (that stuff), the world fixes the *nature* of the target.

  **Misconception 3: The "Empirical Discovery" Confusion**
  *   **The Error:** Students treat the seminar as a lesson in geology ("Jade is two things") rather than a modal argument about how language hooks onto reality. They think the philosophy depends on the specific chemistry.
  *   **Sequence Point:** Arises during the concluding synthesis (approx. Minute 80).
  *   **Interception:** Run a **Substitution Test**. "Suppose we found out tomorrow that 'gold' was actually two distinct elements with the same atomic weight. Would the *philosophical point* change?"
      *   *Goal:* Demonstrate that the specific chemistry is incidental. The argument holds for *any* natural kind term where underlying structure diverges from superficial appearance.

  ---

  ### III. Concluding Diagnostic Check

  **The Question:**
  > "Imagine a 1700 speaker is frozen in time and woken up in 2024. They are shown a piece of lab-created synthetic material that is molecule-for-molecule distinct from jadeite and nephrite, but visually and functionally identical. They say, 'That is jade.' Are they correct?"

  **Distinguishing the Responses:**
  *   **The Slogan-Memorizer (Internalist in disguise):** Will say **"Yes."** They will reason that since the speaker's internal concept (green, hard, ornamental) matches the object, and "meanings ain't in the head" just means "science decides," they will defer to the speaker's judgment or the superficial description. They fail to apply the *causal/structural* constraint.
  *   **The Genuine Externalist:** Will say **"No."** They will reason that the term "jade" is causally anchored to the *natural kind samples* present in 1700. Since the synthetic material lacks the causal history and the specific molecular structure of the original samples, it falls outside the extension, regardless of the speaker's internal state or the object's appearance.
  *   **Why this works:** It isolates the mechanism of **causal-historical anchoring** from both **internal description** and **scientific authority**. It tests whether they understand that reference is mediated by the *history of interaction with the environment*, not just the current state of the world or the head.

  ---

  ### IV. Strategic Exclusions

  **1. Putnam's Division of Linguistic Labor**
  *   **Omission:** Do not discuss how experts fix reference for laypersons.
  *   **Justification:** This introduces a *social* variable that confuses the *metaphysical* point. We are establishing that the *world* fixes reference, not that *other people* fix reference. Introducing expertise too early invites the "Scientific Authority" misconception (Misconception 1) before the environmental ground is secured.

  **2. Burge's Arthritis Case (Social Externalism)**
  *   **Omission:** Do not contrast natural kinds with social concepts.
  *   **Justification:** Burge's argument relies on normative social practices, whereas Putnam's jade/water cases rely on physical causation. Mixing them suggests externalism is a single monolithic thesis rather than a family of arguments with different grounds. Keep the focus strictly on **Natural Kind Externalism** to maintain argumentative purity.

  **3. Narrow vs. Wide Content**
  *   **Omission:** Do not introduce the technical taxonomy of content.
  *   **Justification:** This is a downstream theoretical consequence, not a prerequisite for grasping the core intuition. Introducing it turns a seminar on *reference* into a seminar on *psychology*. The goal is to show that reference leaks outside the skin; how we model the mental state that remains is a separate debate for a subsequent course.

  **Summary of Pedagogical Logic:**
  By excluding the social and psychological technicalities, you present Externalism not as a complex theory of mind, but as a simple observation about **contact**: words touch the world before they touch the mind. The Jade case allows you to show that this contact was happening in 1700, even if the speakers didn't know the nature of what they were touching.
