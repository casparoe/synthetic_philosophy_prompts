  The Regional Public-Health Board convenes with a fixed annual budget to allocate funds between two proposals. Option A is a proven vaccination drive targeting endemic malaria, modeled to save approximately 200 lives this year with 99.9% confidence based on decade-long efficacy data. Option B is a speculative gene-drive protocol designed to eradicate a potential zoonotic reservoir before a pandemic emerges; its success hinges on a four-step causal chain—lab stability, field deployment, reservoir neutralization, and spillover prevention—each unverified, yielding a modeled 0.0002 probability of preventing a pandemic that would otherwise claim 50 million lives, and a 99.9998% chance of saving nobody and wasting the funds. An expected value maximizer must choose B, as the probabilistic return dwarfs A, but a proponent of "robustness-weighted consequentialism" selects A on principle, arguing that outcomes dependent on more than three unverified causal links incur a structural discount regardless of the magnitude of the upside, prioritizing actionable certainty over fragile astronomical stakes.

  **Analysis**

  **EV Reasoning:** The expected value of Option A is roughly 199.8 lives (200 × 0.999). The expected value of Option B is 10,000 lives (50,000,000 × 0.0002). Since 10,000 > 199.8, the EV-maximizer funds Option B.

  **Robustness-Weighted Reasoning:** This view accepts the consequentialist goal of saving lives but imposes a non-linear penalty on probability estimates derived from complex causal structures. Because Option B relies on a four-step chain exceeding the threshold of three unverified links, the probability estimate is structurally discounted (effectively treated as unreliable or zero for decision purposes), making Option A the rational choice regardless of the potential upside.

  **Feature Doing the Work:** The divergence is driven by **unbounded utility scaling**. The EV view allows the massive utility of 50 million lives to outweigh the tiny probability, whereas bounding the utility removes this leverage.

  **Cap Scenario:** If stakes are capped at 500,000 lives, the EV of Option B drops to 100 lives (500,000 × 0.0002), while Option A remains ~200 lives. The EV-maximizer now chooses Option A. Since the robustness-weighted view also chooses Option A (due to the causal chain principle), the views **do not diverge**; they converge on the safe intervention.

  **EV Fanatic Attack:** An EV fanatic would argue the robustness principle is **ad hoc** because it violates outcome individuation: it treats two scenarios with identical probabilities and utilities differently based solely on the "story" of how the probability was derived. They would claim that a 0.0002 chance is morally identical whether it comes from a coin flip or a four-step chain, and that discounting based causal complexity is epistemic conservatism masquerading as a normative principle, lacking derivation from first principles of welfare.
