answer: |-
  ~~Requirement: Must prove explicit intent to cause a general war.~~
  *Reason:* Excludes negligence and recklessness; favours the "stumble" camp by setting the bar too high for guilt. Camp-preference.

  ~~Requirement: Must rely exclusively on public diplomatic records.~~
  *Reason:* Ignores reality of secret treaties; makes responsibility epistemically impossible in authoritarian states. Camp-preference (favours defenders of secret diplomacy).

  ~~Requirement: Must assign blame equally to all mobilising powers.~~
  *Reason:* This is a verdict, not a methodological rule. Vacuous. Camp-preference.

  ~~Requirement: Must show that the war would not have happened without Nation N.~~
  *Reason:* Fails overdetermination test; if five powers mobilise, no single one is strictly necessary. Logically flawed.

  Requirement: Must distinguish causal contribution from moral blameworthiness.
  *Reason:* Pressure (i); handles cases where a state causes war but lacks malicious intent. Non-negotiable.

  Requirement: Must specify the bearer of agency (elite clique, state apparatus, or political culture).
  *Reason:* Pressure (ii) & Two-War-Room case; prevents conflating populace with decision-makers. Non-negotiable.

  Requirement: Must state a counterfactual rule for overdetermined causes (e.g., minimal sufficiency).
  *Reason:* Pressure (iii) & Blank Cheque/Latecomer; resolves who is responsible when multiple actors could have stopped it. Non-negotiable.

  Requirement: Must declare whether responsibility survives the destruction of private evidence.
  *Reason:* Pressure (iv) & Archive-Fire; determines if responsibility is ontological or epistemic. Contestable-but-reasonable.

  Requirement: Must specify whether blame attaches to initiation, escalation, or war aims separately.
  *Reason:* Pressure (v) & Outcome Luck; prevents punishing a state for duration rather than decision. Non-negotiable.

  Requirement: Must rule on whether preventive war reasoning mitigates or aggravates blame.
  *Reason:* Pressure (vi); addresses the "now or never" logic of declining powers. Contestable-but-reasonable.

  Requirement: Must state the liability of dissenters within the nation and descendants after the war.
  *Reason:* Pressure (vii); distinguishes collective guilt from individual innocence and intergenerational justice. Contestable-but-reasonable.

  Requirement: Must distinguish initiation, escalation, and structural responsibility without collapsing them.
  *Reason:* Triad question; ensures structural factors (railways) aren't conflated with agency (ultimatums). Non-negotiable.

  ~~Requirement: Must conclude that great powers bear more blame than small powers.~~
  *Reason:* Verdict disguised as method. Camp-preference.

  ~~Requirement: Must prioritize the July Crisis over long-term tensions.~~
  *Reason:* Arbitrarily privileges contingency over structure. Camp-preference.

  ***

  ### Specification of Adequacy for Accounts of National Responsibility

  1.  **Causal-Moral Distinction:** The account must explicitly distinguish between causal contribution (bringing about the state of war) and moral blameworthiness (violating norms in doing so), acknowledging they may diverge.
      *   *Motivation:* Pressure (i); handles cases where a state triggers war defensively but recklessly.
      *   *Tag:* Non-negotiable.

  2.  **Bearer Specificity:** The account must identify the specific locus of agency (e.g., specific ministers, military clique, or state apparatus) rather than attributing action to an undifferentiated "nation."
      *   *Motivation:* Pressure (ii) & Two-War-Room case; ensures the populace is not blamed for elite decisions they could not veto.
      *   *Tag:* Non-negotiable.

  3.  **Overdetermination Rule:** The account must specify a counterfactual threshold for responsibility (e.g., "necessary element of a sufficient set") when multiple powers' mobilisation guarantees war.
      *   *Motivation:* Pressure (iii) & Blank Cheque/Latecomer; resolves distribution when any single backing-down could have prevented war.
      *   *Tag:* Non-negotiable.

  4.  **Epistemic Stability:** The account must state whether responsibility is a fact independent of evidence or an attribution dependent on available records.
      *   *Motivation:* Pressure (iv) & Archive-Fire; determines if destroyed minutes erase guilt or merely obscure it.
      *   *Tag:* Contestable-but-reasonable.

  5.  **Scope of Blame:** The account must separate responsibility for initiating hostilities from responsibility for the war's duration, scale, and specific aims.
      *   *Motivation:* Pressure (v) & Outcome Luck; prevents conflating the decision to fight with the failure to win quickly.
      *   *Tag:* Non-negotiable.

  6.  **Preventive War Status:** The account must explicitly rule whether acting due to perceived relative decline mitigates aggression or constitutes a distinct violation of peace.
      *   *Motivation:* Pressure (vi); addresses the rationality vs. morality of preventive strikes.
      *   *Tag:* Contestable-but-reasonable.

  7.  **Dissent and Descendants:** The account must specify whether internal opposition absolves segments of the polity and whether liability extends to future generations.
      *   *Motivation:* Pressure (vii); handles the moral status of conscripts and post-war reparations.
      *   *Tag:* Contestable-but-reasonable.

  8.  **Triad Separation:** The account must treat initiation, escalation, and structural constraints (alliances/timetables) as distinct categories of responsibility that do not collapse into one another.
      *   *Motivation:* Triad question; ensures structural inevitability does not erase agency, nor agency ignore constraints.
      *   *Tag:* Non-negotiable.

  ***

  ### Jointly Unsatisfiable Pairs

  **Requirement 2 (Bearer Specificity) and Requirement 8 (Triad Separation/Structural Responsibility).**
  If responsibility is primarily structural (timetables, alliance rigidity), there is no specific elite bearer whose decision was sufficient to cause the war; the system caused it. If a specific elite bearer is required for adequacy, structural accounts are rendered inadequate by definition. This reflects the core tension between Fischerite agency and Structuralist determinism.

  **Requirement 4 (Epistemic Stability) and Requirement 5 (Scope of Blame).**
  If responsibility is ontological (independent of evidence), we may be liable for outcomes we cannot prove we intended; if it is epistemic, large-scale blame becomes impossible where archives are silent. You cannot simultaneously hold that guilt exists without evidence *and* that blame requires proven intent regarding scale.

  ***

  ### Evaluation of Competing Readings

  **The "Deliberate Bid" Reading:** This account satisfies Bearer Specificity and Triad Separation by locating clear agency in Berlin, but it struggles with Structural Responsibility by treating alliance systems as tools rather than constraints, and often conflates Initiation with War Aims.
  **The "Everyone Stumbled" Reading:** This account satisfies Structural Responsibility and Overdetermination rules by highlighting systemic rigidity, but it fails Bearer Specificity by diffusing agency so widely that no specific cabinet meets the threshold for blameworthiness.

  Verdict: Bearer Specificity excludes structuralism; Bearer vs. Structural pair unsatisfiable.
