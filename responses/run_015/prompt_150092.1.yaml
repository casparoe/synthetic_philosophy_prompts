  1.  **Analyze the Request:**
      *   **Role:** Philosopher of collective/political responsibility + WWI historiography expert (Fischer controversy, etc.).
      *   **Task:** Create a specification (list of requirements) for an adequate account of "Nation N is responsible for WWI", *not* an adjudication of who *was* responsible.
      *   **Goal:** Break students out of the "German guilt vs. shared stumble" loop by defining what counts as an *adequate* argument before evaluating truth.
      *   **Constraints:**
          *   Brainstorm-dump first (visible crossing out).
          *   Build around cases, not slogans.
          *   Include specific pressures (i) to (vii) (Definition of responsibility, Bearer, Overdetermination, Archive-Fire, Scope of Blame, Preventive War, Dissenters/Descendants).
          *   Address the triad: Initiation, Escalation, Structural.
          *   Tag requirements: Non-negotiable, Contestable-but-reasonable, Camp-preference.
          *   Identify jointly unsatisfiable pairs (if any).
          *   Evaluate the two main readings ("Deliberate bid" vs. "Stumble") against the list (briefly).
          *   Final line: "Verdict: [15 words max] [Requirement]; [Unsatisfiable Pair if applicable]".
          *   Tone: Philosophical, rigorous, historiographically informed, no padding/citations.
          *   Process: Work slowly, brainstorm first.

  2.  **Brainstorming & Filtering (Mental Draft):**
      *   *Idea 1:* Must prove intent. -> *Cross out.* Too narrow. Negligence counts in responsibility. Camp-preference (favors "stumble" defenders if intent is required, favors "guilt" if denied).
      *   *Idea 2:* Must quantify contribution. -> *Cross out.* Impossible for counterfactuals.
      *   *Idea 3:* Must distinguish state from people. -> *Keep.* Crucial for collective responsibility.
      *   *Idea 4:* Must handle counterfactuals explicitly. -> *Keep.* Causal contribution needs counterfactual reasoning.
      *   *Idea 5:* Must address moral luck. -> *Keep.* (Pressure v).
      *   *Idea 6:* Must rely only on public records? -> *Cross out.* Ignores secret diplomacy reality. (Pressure iv).
      *   *Idea 7:* Must separate initiation from escalation. -> *Keep.* (Pressure iii & triad question).
      *   *Idea 8:* Must address preventive war logic. -> *Keep.* (Pressure vi).
      *   *Idea 9:* Must assign liability to descendants. -> *Contestable.* Some say guilt dies with actors. (Pressure vii).
      *   *Idea 10:* Must define "Nation". -> *Keep.* (Pressure ii).
      *   *Idea 11:* Must avoid hindsight bias. -> *Vague.* Needs operationalization. -> *Refine:* Must reconstruct decision horizons.
      *   *Idea 12:* Must address structural factors (railways, alliances). -> *Keep.* (Pressure iii & triad).
      *   *Idea 13:* Must distinguish causal from moral responsibility. -> *Keep.* (Pressure i).
      *   *Idea 14:* Must account for the "Two-War-Room" case (elite vs. populace). -> *Keep.* (Pressure ii).
      *   *Idea 15:* Must account for the "Archive-Fire" case (evidence dependence). -> *Keep.* (Pressure iv).

      *Refining the "Crossing Out":* I need to visibly show this process in the output as requested ("spend a page or so brainstorm-dumping... and visibly crossing out").
      *Wait, the prompt says:* "before you write anything final, spend a page or so brainstorm‑dumping candidate requirements and visibly crossing out the ones that turn out to be nothing more than one camp's favourite conclusion dressed up as a methodological principle."
      *Okay, I need to include this section in the final output.*

      *Checking Constraints:*
      *   Tags: Non-negotiable, Contestable-but-reasonable, Camp-preference.
      *   Unsatisfiable pairs identification.
      *   Evaluation of the two readings (Deliberate vs. Stumble).
      *   Final Verdict line.

      *Philosophical Nuance:*
      *   Responsibility vs. Causation.
      *   Collective Agency (Can a "Nation" act?).
      *   Counterfactual dependence (Overdetermination).
      *   Epistemic limits (Archive-Fire).
      *   Moral Luck (Outcome vs. Intent).
      *   Preventive War (Rationality vs. Aggression).
      *   Intergenerational Justice.

      *The Triad:* Initiation, Escalation, Structural. Do they collapse?
      *   Initiation: Who fired the first shot/ultimatum?
      *   Escalation: Who widened the scope?
      *   Structural: Who built the trap?
      *   *Thought:* They shouldn't collapse. Structural creates conditions, Initiation triggers, Escalation sustains. An adequate account must specify which layer it is blaming.

      *Unsatisfiable Pairs:*
      *   Maybe "Must rely on actual intent" vs. "Must handle negligence/structural failure". If you require intent, you exclude structural blame. If you require structural blame, you might dilute intent.
      *   Maybe "Must assign liability to descendants" vs. "Responsibility expires with generation".
      *   Let's look for a deeper tension. How about: "Must reconstruct decision horizons (no hindsight)" vs. "Must assess liability for outcomes (outcome luck)". You can't fully separate what they knew then from what happened later if liability depends on the scale of destruction.
      *   Actually, a stronger tension: "Must identify a specific bearer (agency)" vs. "Must account for structural overdetermination (no single agent)". If the system causes the war, who is the bearer? If a bearer is required, structural accounts fail. If structural accounts are allowed, the bearer requirement fails.
      *   Let's refine: Requirement A (Bearer Specificity) vs. Requirement B (Structural Causation). If the war was structurally determined, no specific bearer is *sufficiently* responsible. If a bearer is required, structuralism is excluded. This seems like the core tension in WWI historiography (Fischer vs. Structuralists).

  3.  **Drafting the Brainstorm Section:**
      *   Need to make it look like a working document.
      *   List ideas, strike through the bad ones (using markdown ~~strikethrough~~).
      *   Explain *why* they are crossed out (camp preference, vacuous, etc.).

  4.  **Drafting the Requirements List:**
      *   Numbered.
      *   Sentence(s) for requirement.
      *   Case/Consideration.
      *   Tag.
      *   Ensure pressures (i)-(vii) are covered.

      *Drafting Requirements:*
