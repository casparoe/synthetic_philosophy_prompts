      *   Camp-preference: Anything that forces a specific verdict (e.g., "Must prioritize elite intent").

      *Unsatisfiable Pair:*
      *   Requirement 2 (Specific Bearer) vs. Requirement 8 (Structural Responsibility). If the structure causes the war, no specific bearer is the *primary* cause. If a specific bearer is required, structuralism is invalid. This mirrors the Fischer vs. Structuralist debate.

  5.  **Drafting the Evaluation:**
      *   "Deliberate bid" (Fischerite): Fails on Structural (ignores constraints), passes on Bearer (clear elite agency).
      *   "Stumble" (Structuralist/Lloyd George): Fails on Bearer (diffuses agency too much), passes on Structural (captures timetables/alliances).
