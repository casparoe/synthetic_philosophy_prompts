      3.  *Overdetermination:* Rule for counterfactuals (necessary vs. sufficient). Test: Blank Cheque vs. Latecomer. (Pressure iii).
      4.  *Epistemology:* Status of responsibility under missing evidence. Test: Archive-Fire. (Pressure iv).
      5.  *Scope:* Specify the object of blame (initiation vs. aims vs. scale). Test: Outcome Luck. (Pressure v).
      6.  *Preventive War:* Status of declining power reasoning. (Pressure vi).
