answer: |-
  The stalemate you are experiencing is not a failure of imagination regarding the cases, but a collision of foundational paradigms regarding the *locus of rational evaluation*. Your hypothesis is close, but it understates the normative stakes. This is not merely a verbal disagreement about the word "rational," nor is it solely a technical fight about decision-theoretic formalisms (like CDT vs. FDT). It is a substantive disagreement about what normative theory is *for*: is it a guide for momentary choices given current constraints, or is it an evaluative standard for designing agents over time?

  The reason your three variants failed to move the needle is that they all manipulate the *causal structure* of the case (observability, detection, binding mechanisms), but the disagreement is about the *evaluative target*. Camp B (Maximizers) evaluates the token action at the node of choice. For them, the past is sunk, the future is open, and causality flows forward. Since paying at the moment of choice has no causal power to change the past (the ride is already secured), it is irrational. Camp A (Disposition) evaluates the decision function or policy that generated the action. For them, the agent is a temporally extended entity, and the "choice" at the roadside and the "choice" in town are outputs of the same algorithm. Since the algorithm "pay if rescued" yields better outcomes than "don't pay if rescued," following that algorithm is rational, even if the specific token action at the later node lacks causal leverage.

  Variant 1 (Unobservable) removes reputational causality, which Camp B sees as confirming there is no reason to pay. Camp A sees it as irrelevant because the evaluation is on the policy integrity, not the downstream consequence of that specific payment. Variant 2 (Face-reading) introduces logical correlation. Camp B dismisses this as self-deception because they require causal leverage for rationality. Camp A accepts logical correlation as sufficient for rationality because they evaluate the source code, not the execution trace. Variant 3 (Lockbox) is the most telling: both sides agree on the instrumental value of the lockbox. This proves they agree on the *outcome* they want. The disagreement is purely on whether the label "rational" applies to the act of paying without the box. This confirms the disagreement is about the definition and scope of normativity, not the facts of the case.

  The "rational irrationality" claim—that rationality might require you to be disposed to act against your momentary reasons—is a **level confusion**. It arises from conflating two distinct questions: "What is the rational act to perform given my current situation?" and "What is the rational agent to be?" Camp B answers the first; Camp A answers the second. When Camp B says "it is rational to cultivate the disposition but irrational to act on it," they are admitting that the optimal agent produces acts that are locally suboptimal by their own lights. Camp A resolves this by shifting the locus of evaluation to the agent, thereby dissolving the paradox. Neither side is making a logical error; they are operating within different normative frameworks that prioritize different properties (dynamic consistency vs. local optimality).

  Your hypothesis is **partly right**. It is indeed a fight about decision-theoretic formalisms, but characterizing it as "verbal" or "different questions" suggests it could be solved by definition. It cannot. The choice between act-centered and agent-centered normativity is a substantive philosophical commitment, not just a terminological one. Progress will not come from new cases, but from explicitly distinguishing the two questions. If your group agrees to use "rational act" for Camp B's concept and "rational policy" for Camp A's, the disagreement will vanish, but the underlying philosophical tension about which one matters more will remain.

