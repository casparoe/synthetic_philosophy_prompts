      *   *Hofstadter's Insight:* *Letter Spirit* relies on a "grid" of perceptual features, but the "spirit" is the consistent application of stylistic constraints across the set.
      *   *The Uniform-Grid Problem:* If the visual space is continuous and uniform, visual identity collapses. Therefore, identity *must* come from outside the visual form (function, history, system).
