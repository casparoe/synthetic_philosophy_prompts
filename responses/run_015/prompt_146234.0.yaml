answer: |-
  In a bustling restaurant kitchen, two line cooks simultaneously splash boiling oil on their forearms. Cook A, exhibiting classic pain asymbolia, inspects the blistering skin, accurately reports the exact coordinates of the burn, describes the sensation as "sharp heat," and immediately returns to chopping vegetables without flinching or expressing concern. Cook B, exhibiting reverse asymbolia, drops her pan, screams in terror, and rolls on the floor begging for relief, insisting the experience is "unbearable and awful," yet when asked to point to the injury, she cannot locate it, describes no heat or sting, and claims her skin feels numerically normal despite the panic.

  **Verdicts**

  1.  **The Representationalist:** Pain's badness consists in the accurate representation of bodily damage. Cook A is in pain and is worse off regarding pain states because her sensory system successfully represents tissue damage, regardless of her indifference. Cook B is not in pain at all; she is experiencing a free-floating panic attack or anxiety disorder because there is no sensory representation of bodily disorder to ground the pain state. Her suffering is real, but it is not *pain* badness.
  2.  **The Pure Affectivist:** Badness is identical to the negative affective and motivational tone; sensation is merely the trigger. Cook A is not worse off and arguably not in pain, as she lacks the suffering and urge to withdraw that constitute the badness of pain. Cook B is significantly worse off because she is undergoing intense suffering and avoidance motivation, which is the entirety of what makes pain bad, even if the sensory localization is missing.
  3.  **The Relational View:** Badness emerges only from the functional integration of sensory discrimination and affective urgency. Neither cook is truly in pain because both systems are decoupled; pain requires the affect to be *about* the sensation. However, Cook B is worse off prudentially because she endures raw suffering without informational content, whereas Cook A is functionally impaired regarding self-preservation but lacks suffering entirely.

  **Design Check**

  *   **Structural Feature:** The work is done by **bidirectional dissociation**. By splitting sensation from affect in both directions (A has sensation without affect, B has affect without sensation), the scenario prevents theories from hiding behind the correlation of the two.
  *   **Collapse without Reverse:** If you drop Cook B and compare only normal pain vs. classic asymbolia, the Representationalist can argue that affect is merely a contingent companion to pain. Cook B forces the Representationalist to deny that intense suffering counts as pain if it lacks sensory content, exposing the theory's commitment to representation over phenomenology.
  *   **Representationalist Attack:** The Representationalist will attack the reverse case by **denying the ontology**. They will argue Cook B is not in pain because pain must represent bodily damage; since she feels no heat or location, she feels no damage. Her report of "awfulness" is reclassified as distinct emotional distress, preserving the theory that pain's badness is tied to bodily representation.
