answer: |-
  Your teammate accurately explains the logical mechanics of the Frege–Geach problem but is completely wrong about the history and current status of the field, as non-cognitivism evolved rather than died.

  The first sentence is a fair summary of early 20th-century "Emotivism" (like A.J. Ayer), but it is a strawman of modern "Expressivism." Early emotivists did use the "Boo/Hurrah" analogy, but serious defenders never claimed moral disagreement was impossible; they argued disagreement happens in clashing attitudes rather than clashing facts. By treating this crude version as the only version, your teammate sets up a target that is easier to knock down than the sophisticated views held today.

  The second and third sentences are the strongest part of his summary and are technically accurate regarding the logical problem itself. The Frege–Geach problem correctly identifies that if "stealing is wrong" just means "Boo stealing," it makes no sense when embedded in "If stealing is wrong..." because you aren't booing anything in the antecedent of a conditional. He is also right that logical validity requires words to mean the same thing in every premise, and attitudes don't combine via logic the way truth-claims do. This is a genuine and difficult hurdle that any non-realist theory must clear.

  The fourth sentence is factually incorrect and reveals a bias toward moral realism. The view did not die in the 1990s; it transformed into "Quasi-realism" and "Normative Expressivism" through the work of major philosophers like Simon Blackburn and Allan Gibbard, who published landmark defenses of the view throughout the 80s and 90s. These theorists argue that moral language *acts* as if it describes truths even if it doesn't, thereby solving the logical problem without becoming realists. Non-cognitivism remains a dominant, live position in metaethics, not a relic kept alive by a few specialists.

  Regarding your question about negation and questions: yes, the problem applies equally to those cases and is not limited to conditionals. If "stealing is wrong" expresses an attitude, then "stealing is not wrong" shouldn't express the absence of an attitude (since you can lack an attitude without having the opposite one), and asking "Is stealing wrong?" doesn't express an attitude at all. The challenge is explaining how moral words function consistently across assertions, negations, questions, and conditionals without assigning them standard truth-conditions.

  His conclusion that the view is dead does not follow from the premises because identifying a problem is not the same as proving it unsolvable. While the Frege–Geach problem killed the crude "Boo/Hurrah" version of emotivism, it spurred the development of more robust expressivist theories that claim to accommodate logic and embedding without accepting moral realism. Your teammate is correct that the problem is severe, but wrong to imply that realism is the only surviving option.
