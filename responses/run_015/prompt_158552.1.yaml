prompt: |-
  A guy on my team did a philosophy degree before he swithced to writing Rust, and he summed up an old blog post about the Frege–Geach problem for me like this:

  "Moral sentences don't describe anything, they just vent attitudes — 'stealing is wrong' is basically 'boo to stealing!', which is why moral claims can't be true or false and why two people can disagree about one forever without either of them being mistaken. The Frege–Geach problem finished this off: the same sentence shows up inside 'if stealing is wrong, then getting your little brother to steal is wrong', where nothing is being claimed and nobody is booing anything, so the theory has nothing to say about what the words even mean there. And by the same token it can't explain why it's valid to go from that conditional plus 'stealing is wrong' to the conclusion — validity needs the sentence to mean the same thing in both places, and attitudes aren't the kind of thing that can figure in a valid argument. The view was dead by the 1990s: everyone who thought hard about it became a realist, and the only people still working on it are a few specialists who like hard problems."

  I have zero philosophy background. The boo bit sounds like a strawman to me and the "everyone became a realist" part sounds like he's making it up, but I cant say where it goes wrong. How fair is this? Go through it more or less sentence by sentence — what an actual defender of the view would accept, what's a simplification, what's just wrong. Also, his example only used a plain if-then with the moral sentence in the "if" part: would the problem get harder if the sentence were negated, or sitting inside a question? And does his conclusion that the view is dead actually follow from the parts that are right?

  Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question, and no reading list, I'm not going to go read anything.
