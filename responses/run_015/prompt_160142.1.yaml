answer: |-
  ### Name, if there is one

  There is no single canonical term, though the phenomenon falls under Robert Merton's broader category of the "self-fulfilling prophecy." However, your specific constraint—that the mechanism fails if the belief is adopted instrumentally—aligns closely with what Jon Elster describes as "state-dependent desires" or the "paradox of hedonism," where pursuing a state directly prevents its attainment. In social psychology, this is observed in the "Pygmalion effect," but the epistemic condition you highlight is often discussed under "doxastic opacity" or "sincerity-conditioned efficacy." It is sometimes referred to informally as a "fragile self-fulfilling prophecy," distinguishing it from robust institutional facts like currency values that survive publicity.

  ### Neighbours and non-neighbours

  This configuration differs sharply from William James's "genuine options." For James, the evidence is inconclusive, but the truth of the proposition is independent of the belief; the belief merely grants the right to access benefits. In your cases, the belief *constitutes* the truth. It also differs from pragmatic encroachment, where high stakes raise the evidential bar for knowledge. Here, the stakes are irrelevant to the epistemic standard; rather, the *manner* of holding the belief determines its truth-value.

  Contrast this with robust self-fulfilling prophecies like bank runs. Those rely on aggregate behavior where individual insight doesn't stop the cascade. Your cases rely on interpersonal signaling; if the teacher signals calculation rather than expectation, the child detects the insincerity. Thus, while bank runs are "publicity-proof," your cases are "publicity-sensitive." This distinguishes them from institutional facts versus interpersonal facts. The difference you point at is unitary: it rests on the requirement of sincerity as a causal condition, not multiple distinct ethical problems.

  ### The distinction, defined, with boundary cases

  The core distinction is "doxastic opacity." The belief causes the truth only if the believer represents the belief as responsive to evidence, not as a causal tool. The mechanism requires the believer to ignore their own agency in creating the fact.

  In group contexts, this manifests as collective morale. If a campaign team openly admits their optimism is a tactic, recruitment fails. The group must share the illusion of inevitability to coordinate action. This requires shared opacity among members.

  Boundary cases illuminate the rule. Self-deception restores efficacy: a teacher who convinces herself the selection wasn't random regains the ability to spur the child. Deliberate ignorance functions similarly; refusing to read the memo about random selection preserves the belief's power. Conversely, "ironic belief"—holding the belief while winking at its instrumental utility—collapses the effect. This marks the boundary between authentic commitment and strategic acceptance. The distinction is not merely psychological but normative: the belief functions as knowledge only so long as it is not treated as a hypothesis. It is one distinction applied across individual and collective doxastic states.

  ### Verdict for an ethics of belief

  An ethics of belief here must navigate between Clifford's evidentialism and James's voluntarism. Since the truth is partially constituted by the belief, strict evidentialism forbids the very act that creates the evidence. However, instrumentalizing the belief destroys its efficacy. The verdict is a constrained voluntarism: one is permitted to adopt the belief without prior evidence, provided one commits to it sincerely enough to forget its instrumental origin. We have a duty to cultivate environments where such beliefs are sustainable, but not to exploit them knowingly. The ethical obligation is to become the kind of agent for whom the belief is true, rather than an agent who uses belief as a tool. Truth here is a reward for sincerity, not a target for manipulation. This makes authenticity the central epistemic duty.
