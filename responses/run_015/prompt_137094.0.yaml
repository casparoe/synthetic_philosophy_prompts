  1. **Brainstorm**
  The coin case eliminates epistemic views; truth isn't knowledge. The sea battle eliminates bivalence; future contingents lack values. But Excluded Middle holds, ruling out Peirceanism (which calls them false) and many-valued logics (which reject EM). This points strongly to Supervaluationism: truth is supertruth across possible histories. The eclipse case shows determinism restores bivalence. The distant battle suggests she accepts a privileged simultaneity frame for truth evaluation, rejecting radical relativism. The conditional is tricky: if the consequent is gappy, the conditional must be non-material, likely a strict implication across histories. The core tension is between "truth as settlement" versus "truth as correspondence." She treats the past as fixed (bivalent) and the deterministic future as fixed, but the chancy future as open. The system hinges on whether "settled" means "necessitated by laws" or "true in all branches."

  2. **The rules that fit**
  **Rule 1: Supervaluationism.** A proposition is true now iff it is true in all possible future histories consistent with the present state and laws. False iff false in all. Neither otherwise. Excluded Middle holds because $P \lor \neg P$ is true in every history, even if $P$ varies. Conditionals are true if the implication holds across all histories.
  **Rule 2: Ontic Settledness.** A proposition is true now iff the present physical state plus laws necessitate it. False iff necessitate negation. Neither if contingent. Excluded Middle is a logical truth independent of factual settlement. Conditionals express nomic connections, not material implications.
  **Rule 3: Truthmaker Presentism.** A proposition is true now iff there exists a present fact that makes it true. Future contingents lack makers (Neither). Past events have makers (Bivalent). Deterministic futures have makers in present states (True). Excluded Middle holds due to logical structure, not specific makers.

  3. **What each predicts**
  **Main Case (Chancy Hurricane):** All three say **Neither**. The outcome isn't in all histories (Rule 1), isn't necessitated (Rule 2), and lacks a present fact (Rule 3).
  **(i) 90% Chance:** All three say **Neither**. Probability isn't settlement.
  **(ii) 100% Macro (Chancy Micro):**
  *   **Supervaluationism:** **True**. All histories converge on landfall.
  *   **Ontic Settledness:** **Neither**. Micro-chance means the present state doesn't strictly necessitate the macro outcome (laws are probabilistic).
  *   **Truthmaker:** **Neither**. No micro-fact exists to ground the macro certainty.
  **(iii) Self-Fulfilling Bulletin:**
  *   **Supervaluationism:** **Neither** at utterance. Histories were open then.
  *   **Ontic Settledness:** **Neither**. Not necessitated by the state *at issuance*.
  *   **Truthmaker:** **Neither**. No fact existed prior to the admiral's reaction.
  *Disagreement flagged on (ii): Supervaluationism validates truth via convergence; the others require strict necessitation or existing facts.*

  4. **Your best guess**
  She is running **Supervaluationism**. It is the only framework that cleanly reconciles the "Neither" verdict on contingents with the "True" verdict on Excluded Middle without ad hoc adjustments. The eclipse case fits because deterministic laws collapse the branching structure to a single history (true in all). The conditional verdict fits the supervalued conditional (valid across branches). The "pick a frame" comment aligns with branching time semantics, which require a moment (and thus a simultaneity slice) to evaluate truth. Ontic Settledness struggles with the conditional (how is a connection true if terms lack values?), and Truthmaker theory struggles to explain why Excluded Middle is true if neither disjunct has a maker. Supervaluationism handles the logic systematically.

  5. **The tie-breaker**
  **The Retro Case:** A year later, ask: "Was it true yesterday that the storm would make landfall?"
  *   **Supervaluationism:** **False** (or Neither). At the past moment, the future was open; it was indeterminate then. Truth values are fixed at the context of utterance.
  *   **Retrospective Realism (Ockhamist Hybrid):** **True**. The outcome is now known; therefore, it *was* true then, even if unsettled.
  *   **Ontic Settledness:** **False**. It was not necessitated then.
  This separates Supervaluationism (truth is time-indexed to settlement) from views that allow truth values to update retrospectively based on actual outcomes. If she says "It wasn't true then, it's only true now," she's a Supervaluationist. If she says "It was true then, we just couldn't know," she's hiding an Ockhamist actual-history view.

  6. **Loose ends**
  Her "neither" is a truth-value gap, not falsity; otherwise, Excluded Middle would fail (if both disjuncts are false, the disjunction is false). This requires a non-classical logic. The conditional is the weakest link: if the consequent lacks a value, standard logic makes the conditional undefined. She must be treating conditionals as strict implications or relying on supervalued validity, which is technically coherent but metaphysically heavy. Also, "pick a frame" risks conflict with relativity if she claims metaphysical privilege for one frame, though she may just mean truth is frame-relative.
