answer: |-
  This is a fantastic confusion to be having. You have stumbled onto one of the deepest tensions in the philosophy of language and logic, specifically regarding the relationship between **syntax** (the form/frame), **semantics** (the meaning/inner), and **context** (the system).

  You are absolutely right to feel that something is breaking in your reasoning. Your intuition that the "Inner Message" might not be invariant across frames is the key to unlocking this.

  Here is where the false presupposition lies, broken down into three parts: the definition of the "Frame," the nature of Formal Systems, and the "Collapse" argument.

  ### 1. You are conflating "Decoding Key" with "Axiomatic System"

  This is the biggest technical hitch in your argument.

  In Hofstadter's *Gödel, Escher, Bach* (GEB), the **Outer Message (Frame)** is instructions on *how to read the symbols*. It is the Rosetta Stone. It says, "These squiggles represent English," or "This binary string maps to ASCII." It is purely syntactic decoding.

  However, in your Gödel example, you define the **Frame** as "the axioms and rules of inference."
  *   **The Problem:** Axioms and rules of inference do not just tell you how to *read* the symbols; they tell you what makes the symbols **true**.
  *   **The Correction:** In formal logic, the "Frame" (decoding) is the Gödel numbering scheme (mapping symbols to numbers). The "System" (PA vs. others) is the **Model** or the **Theory**.

  When you switch from Peano Arithmetic (PA) to a different axiom set, you aren't just changing the "mechanical decoding instructions." You are changing the **truth conditions** of the universe the message lives in.

  **Why this matters for your confusion:**
  You argued: *"If the frame has no semantic weight, then when we change the formal system... we're not changing the meaning of the arithmetic statements."*
  **False.** Changing the axioms *does* change the semantic weight. In Hofstadter's terms, the "Inner Message" of a Gödel sentence is: *"This statement cannot be derived using **these specific rules**."*
  If you change the rules (the system), the Inner Message is now making a claim about a different set of rules. Therefore, the Inner Message **itself has changed**, even if the string of symbols looks the same.

  ### 2. The Translation Analogy vs. The Formal System Analogy

  Your translation example is actually working against you because it hides a hidden constant.

  *   **Translation (English to French):** You change the surface code (syntax), but you assume a shared **human cognitive context** (semantics). We assume "Snow is white" refers to the same physical reality in both languages. The "Frame" (grammar) changes, but the "Interpretation Mapping" (world-to-word) stays fixed.
  *   **Formal Systems (PA to Non-PA):** You change the surface code, *and* you change the **Interpretation Mapping**. In one system, a string might map to a truth; in another, it maps to a falsehood or undecidability.

  So, your intuition that "the frame must be doing some semantic work" is correct, but only because in formal logic, the "frame" (axioms) *constitutes* the semantics. In natural language, the "frame" (grammar) is distinct from the semantics (reference).

  ### 3. The "Collapse" Argument (Self-Reference)

  Your study group argued that in self-referential loops (like the Liar Paradox or Gödel sentences), the Frame and Inner Message collapse.

  **They are poetically right, but technically wrong.**
  Hofstadter calls this a **Strange Loop**, not a collapse.
  *   **Normal Hierarchy:** Frame (Top) → Decodes → Inner Message (Bottom).
  *   **Strange Loop:** Inner Message → References → Frame.

  In a Gödel sentence, the Inner Message says, "I am unprovable in **this** system." The Inner Message reaches up and grabs the Frame. It doesn't *become* the Frame, but it makes the Frame part of its own content.

  This is why your study group feels a collapse: because you can't understand the Inner Message without understanding the Frame it references. They become **entangled**. But they don't collapse into identity. The distinction remains: one is the rule-set, the other is the statement about the rule-set.

  ### 4. The Hidden Assumption (Your Hypothesis was Right)

  You asked: *"Is there a hidden assumption that 'inner message' means the same thing across different formal frames, and thats whats breaking my reasoning?"*

  **Yes. 100%.**

  You are assuming **Semantic Invariance**. You are assuming that there is a Platonic "Inner Message" that exists independently of the system used to express it.
  *   In **Natural Language**, we pretend this is true (The "Proposition" exists regardless of whether it's said in English or French).
  *   In **Formal Logic**, this is false. Meaning is **System-Relative**.

  A string of symbols $S$ in System $A$ is not the same "Inner Message" as string $S$ in System $B$, if the truth conditions of $A$ and $B$ differ. The "Meaning" of a formal statement *is* its truth conditions within its specific axiomatic frame.

  ### How to untangle this for your group

  Here is the argument you can bring back to your study group:

  1.  **Distinguish Decoding from Truth:** The "Frame" (Outer Message) tells you how to read the symbols. The "System" (Axioms) tells you what makes them true. Hofstadter's Frame is the former, but your Gödel example relies on the latter.
  2.  **The Content Includes the Context:** In self-referential systems, the "Inner Message" explicitly contains a reference to the "Frame." (e.g., "I am unprovable *in System F*"). Therefore, if you change System F, you are not preserving the Inner Message; you are creating a new message that references a new system.
  3.  **No Collapse, Just Entanglement:** The Frame and Inner Message don't collapse. Instead, the Inner Message *encodes* the Frame. This creates a Strange Loop where the distinction between "container" and "content" blurs, but the logical categories remain distinct.

  **The Verdict:**
  Your reasoning broke because you treated the "Inner Message" as a context-independent object (like a physical stone) that you can move between different logical frames. In reality, in formal systems, the "Inner Message" is more like a **key**; it only has meaning relative to the **lock** (the axiomatic frame) it was cut for. Change the lock, and the key is no longer the "same" key, even if it looks identical.

  You spotted the exact crack in the foundation: **Meaning is not intrinsic to the message; it is relational between the message and the system.** Hofstadter would high-five you for that.
