answer: |-
  Your intuitions are not noise but they are inconsistent, and resolving them requires you to either ban paid plasma donations or accept paid kidney sales, as you cannot logically hold both positions under a single principle.

  Your current proposal fails because it treats 'medicine' and 'care' as monolithic blocks when your gut correctly distinguishes within them. Plasma and kidneys are both medical, yet you treat them differently; caring for a grandson and caring for a stranger are both care, yet you treat them differently. The distinction isn't the category, but the nature of the commodification. To repair this, here are three candidate principles derived from your verdicts.

  **Candidate 1: The Coercion Threshold**
  *Principle:* Markets are impermissible when the seller's consent is driven by catastrophic necessity rather than genuine preference.
  *Forced by:* The kidney case (poverty), the sterilisation case (addiction/desperation), and the water case (survival).
  *Fails on:* The drug trial case. You deem this fine despite the student being broke, presumably because the risk is temporary and regulated, whereas a kidney loss is permanent. It also struggles with the water vs. surge pricing distinction unless you define 'necessity' very narrowly.
  *Verdict:* This captures your anger at exploitation but cannot explain why you accept risk in trials but not organ loss.

  **Candidate 2: The Civic Corruption Principle**
  *Principle:* Markets are impermissible when they undermine the equal standing of citizens or the essential purpose of a non-market institution.
  *Forced by:* The vote (democracy), the grandson (family love), and the water (shared survival resource).
  *Fails on:* The kidney vs. plasma distinction. Neither is inherently civic. It also doesn't explain why selling residency rights feels wrong (it fits here) but selling a queue place feels only 'a bit off'.
  *Verdict:* This explains the social cases well but leaves the bodily cases ungrounded.

  **Candidate 3: The Bodily Integrity Limit**
  *Principle:* Markets are impermissible when they involve the irreversible loss of non-renewable bodily capacity or fundamental health.
  *Forced by:* The kidney (permanent loss), the egg (invasive/exhaustible), and the sterilisation (permanent loss).
  *Fails on:* The plasma case. Plasma is renewable and medically similar to blood, yet you are uneasy about whole blood and fine with plasma. If you hold this principle, plasma should be fine (which you say it is), but then kidneys should arguably be fine too if regulated, or plasma should be banned because it monetises the body.
  *Verdict:* This is the only principle that validates your suspicion about women's bodies (eggs vs. sperm) as a matter of physical burden rather than squeamishness.

  **Application to New Cases**
  *   **Cash payments for vaccination:** Under Coercion, this is risky if targeted at the poor; under Civic, it is fine as it serves public health; under Integrity, it is fine. *Verdict:* Fine as an incentive, banned if it becomes the only access route.
  *   **Selling residency rights:** Under Civic, this is a clear ban (citizenship is not a commodity); under Coercion, it is fine (rich buyers aren't desperate). *Verdict:* Ban. It corrupts the political community.
  *   **Selling a place on the transplant waiting list:** Under Civic, this is a ban (justice based on need, not wealth); under Integrity, it is a ban (intermediates the bodily right). *Verdict:* Ban. This is arguably worse than selling the kidney itself.

  **The Choice: Ugly vs. Simple**
  You asked whether to take an ugly principle that saves all your verdicts or a simple one that costs you two. Take the simple one. An ugly principle is merely a rationalisation of bias; a simple principle is a tool for thinking. The simple principle is **The Dignity Constraint**: *No market is permissible where it treats essential aspects of personhood (body, citizenship, intimate love) as contingent on wealth.*

  To make this consistent, you must drop one of your verdicts. You should drop the permissibility of paid plasma. If selling a kidney is exploitative because it monetises the poor body, selling plasma is the same logic on a smaller scale. The distinction between renewable and non-renewable is medically relevant but morally thin when the driver is poverty. Alternatively, you must accept paid kidneys under strict regulation, acknowledging that banning them harms the poor who wish to sell. Given your reaction to the sterilisation case, I suspect you value dignity over utility, so you should ban plasma to align with kidneys.

  **The Waiting List Consequence**
  Should the fact that a paid kidney system clears the waiting list move you? No. Your lack of movement is morally sound. If a market is inherently unjust because it coerces the desperate, the efficiency of that coercion does not make it just. It is the difference between saving lives by stealing organs from the poor and saving lives by improving donation systems. Consequentialism asks 'how many lives?'; your intuition asks 'what kind of society?'. Stick with the latter.
