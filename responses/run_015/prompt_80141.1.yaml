  # JOINT STATEMENT ON FREE WILL AND DETERMINISM
  **Signatories:** The Compatibilist Working Group & The Hard Determinist Working Group
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Moral Responsibility under Determinism

  ### I. AGREED CLAIMS

  We, the undersigned, having engaged in good-faith adversarial collaboration, affirm the following claims as common ground. We agree that the metaphysics of the universe is not the primary site of our dispute.

  1.  **Causal Determinism is True:** We proceed on the shared assumption that the state of the universe at any given time, combined with the laws of nature, entails exactly one possible future. Human decisions are physical events subject to these causal chains.
  2.  **No Libertarian "Magic":** Neither side posits non-physical souls, uncaused causes, or violations of physical law to rescue free will. The dispute is not about whether the laws of physics can be broken, but about how to interpret human agency within them.
  3.  **The Stakes are Normative:** We agree that the primary practical stake of this debate is the justification of **Moral Responsibility (MR)**. Specifically, we are debating the conditions under which it is fair to praise, blame, reward, or punish an agent.
  4.  **Rejection of Fatalism:** We agree that determinism does not imply that deliberation is pointless or that our desires and reasons do not causally influence our actions.
  5.  **Shared Moral Concerns:** Both sides aim to preserve human dignity and minimize suffering. The Hard Determinist seeks to prevent unjust suffering via retributive punishment; the Compatibilist seeks to preserve the integrity of interpersonal relationships and social accountability.

  ***

  ### II. DISAGREEMENTS, CRUXES, AND ADJUDICATION

  The following table outlines the precise formulations of our remaining disagreements. Per our collaboration agreement, this section includes the two identified **Cruxes**—sub-questions where empirical or conceptual clarification could move at least one side—along with the concrete cases used to test them.

  | Issue / Crux | Compatibilist Position | Hard Determinist Position |
  | :--- | :--- | :--- |
  | **1. Definition of Free Will (FW)** | FW is the **capacity for reasons-responsiveness**. An agent acts freely if their action stems from their own psychological states (desires, beliefs) and they would have acted differently *had there been good reasons to do so*. | FW is the **power of ultimate sourcehood**. An agent acts freely only if they are the *ultimate* originator of their will, such that the causal chain of their choice does not trace back entirely to factors prior to their birth. |
  | **2. Definition of Moral Responsibility (MR)** | MR is a **social-normative status**. To be responsible is to be an appropriate target of reactive attitudes (resentment, gratitude) and sanctions that serve to regulate behavior and affirm values. | MR is a **metaphysical-desert status**. To be responsible is to deserve praise or blame in a basic, non-consequentialist sense. Fairness requires that the agent could have genuinely avoided the blame. |
  | **3. CRUX ONE: The "Could Have Done Otherwise" Condition**<br>*(Hypothesis: Settling whether alternative possibilities are necessary moves the debate.)* | **View:** The ability to do otherwise is *hypothetical*, not categorical. <br>**Test Case:** *Frankfurt-style Case.* An agent chooses to kill on their own. A neuro-chip would have forced them to kill if they hesitated, but the chip never activates. <br>**Prediction:** We conclude the agent is responsible. The lack of alternate possibilities (due to the chip) is irrelevant because the actual sequence of events was uncompelled. | **View:** The ability to do otherwise is *categorical*. <br>**Test Case:** *Frankfurt-style Case.* (Same as left). <br>**Prediction:** We conclude the agent is *not* fully responsible. Even if the chip didn't activate, the *presence* of the chip proves the agent lacked genuine access to an open future. The intuition that they are responsible is a cognitive error conflating "voluntary" with "free." |
  | **4. CRUX TWO: The Function of Free Will**<br>*(Hypothesis: Settling whether FW grounds fairness or sourcehood moves the debate.)* | **View:** FW exists to ground **fairness in social practice**. Blame is fair if the agent had the capacity to recognize and respond to moral reasons. <br>**Test Case:** *The Manipulated Saint.* A person is neuro-engineered to be perfectly benevolent. They never do wrong. <br>**Prediction:** We conclude this person lacks FW/MR (praise is hollow) *not* because determinism is true, but because their actions bypass their own reasoning capacities. This proves FW is about *how* the choice is made, not *where* the causal chain starts. | **View:** FW exists to make lives **genuinely "up to us."** Blame is fair only if the agent is the ultimate author of their character. <br>**Test Case:** *The Manipulated Saint.* (Same as left). <br>**Prediction:** We agree praise is hollow, but argue this is because the agent is not the *ultimate source*. We extend this logic: if engineering removes responsibility, so does genetics + environment (determinism). The "how" doesn't matter if the "where" (origin) is external. |
  | **5. Assessment of Verbal Dispute** | **Claim:** The dispute is **substantive**, not merely verbal. While we define "Free Will" differently, this reflects a deeper disagreement about the justification of punishment. If the Hard Determinist is right, our current justice system is fundamentally unjust. | **Claim:** The dispute is **partly verbal**, but with **real consequences**. We agree on all physical facts. We disagree on whether the word "Responsibility" should track *social utility* (Compatibilist) or *basic desert* (Hard Determinist). However, because society operates on *desert*, this semantic shift requires abolishing retributive justice. |

  ***

  ### III. COLLABORATIVE FINDINGS ON THE CRUXES

  *Included as an addendum to satisfy the requirement for detailed case analysis.*

  **Regarding Crux 1 (Alternative Possibilities):**
  *   **Agreement:** Both sides agree that if the *Principle of Alternative Possibilities (PAP)* is strictly required for responsibility, Compatibilism fails.
  *   **Divergence:** The Compatibilist argues PAP is false (citing Frankfurt cases). The Hard Determinist argues Frankfurt cases are ill-formed or that "flickers of freedom" remain.
  *   **Movement Condition:** If the Compatibilist can demonstrate a case where *no* alternate possibilities exist (not even flickers) and the Hard Determinist still intuits responsibility, the Hard Determinist must abandon strict PAP. If the Hard Determinist can demonstrate that *all* reasons-responsiveness is compatible with total coercion (in principle), the Compatibilist must abandon reasons-responsiveness as sufficient.

  **Regarding Crux 2 (Function of Free Will):**
  *   **Agreement:** Both sides agree that if Free Will is *only* about Ultimate Sourcehood, it does not exist. If Free Will is *only* about Social Regulation, it does exist.
  *   **Divergence:** The core dispute is normative: **What makes blame *fair*?**
      *   **Compatibilist:** Fairness is about whether the agent could have been *influenced* by moral reasons at the time of action.
      *   **Hard Determinist:** Fairness is about whether the agent *created* the capacity to be influenced by moral reasons.
  *   **Movement Condition:** This is the deeper crux. If the Hard Determinist accepts that "fairness" need not require ultimate origin (accepting a forward-looking theory of justice), they become a Compatibilist in practice. If the Compatibilist accepts that "fairness" inherently requires ultimate origin, they become a Hard Determinist (error theorist) about current moral practices.

  **Conclusion on Verbality:**
  We conclude that the dispute is **not merely verbal**. While the term "Free Will" is contested, the disagreement maps onto a real conflict in normative ethics: **Retributivism vs. Consequentialism/Quarantine Models.** The Hard Determinist insists that without Ultimate Sourcehood, retributive blame is a moral wrong. The Compatibilist insists that without Reasons-Responsiveness, social accountability is impossible. Settling the definition of "Free Will" does not solve the problem; settling the *purpose of blame* does.
