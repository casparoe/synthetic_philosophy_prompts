answer: |-
  The problem of logical omniscience stands as one of the most persistent tensions in formal epistemology. At its core lies a conflict between the normative standards of Bayesian probabilism and the reality of deductive reasoning. Standard Bayesian orthodoxy dictates that a rational agent's degrees of belief (credences) must obey the axioms of probability. A direct consequence of these axioms is that an agent must assign a credence of 1 to every logical truth and a credence of 0 to every logical falsehood. Furthermore, if a proposition $B$ is a logical consequence of a proposition $A$, the agent's credence in $B$ cannot be lower than their credence in $A$. This implies that an ideally rational agent is logically omniscient: they instantly "know" all the consequences of their beliefs.

  However, this requirement clashes with our intuition about rationality, particularly regarding mathematical conjectures and self-referential systems. It seems rational to assign a high credence, but not certainty, to the Riemann Hypothesis prior to its proof. This essay argues that the demand for logical omniscience is a category error when applied to reasoning agents. While the probability axioms provide a robust framework for empirical uncertainty, they fail to account for logical uncertainty. An ideally rational agent *can* and *should* hold intermediate credences in unproven logical statements, because strict omniscience renders an agent vulnerable to self-referential paradoxes and decision-theoretic paralysis.

  To understand the pressure for omniscience, one must examine the foundations of probabilism. The standard argument rests on coherence, often formalized through the Dutch Book theorem. If an agent's credences violate the probability axioms, there exists a set of bets they will accept that guarantees a net loss regardless of the outcome. If an agent assigns a credence of 0.9 to a tautology $T$, a bookie can sell the agent a bet on $T$ for \$0.90 that pays \$1.00. Since $T$ is necessarily true, the agent pays \$0.90 to receive \$1.00, which seems fine, but if they assign less than 1 to a tautology, they are effectively treating a necessary truth as contingent. More critically, if an agent believes $A$ but does not believe $B$ where $A \vdash B$, they can be Dutch-booked by accepting a bet on $A$ and rejecting a bet on $B$ at odds that guarantee a loss. From this perspective, logical omniscience is not a claim about computational power, but a requirement of synchronic consistency. To be rational is to have beliefs that fit together without contradiction; since logical truths are necessarily the case, believing otherwise is a contradiction in terms.

  Yet, this orthodox view collapses when we consider the nature of logical truth itself. Unlike empirical truths, which are discovered through observation, logical truths are established through derivation. For a finite agent, derivation takes time and resources. If rationality requires credence 1 for all logical truths, then no agent can be rational until they have computed the closure of their belief set. This renders the concept of rationality useless for any agent that learns or computes. More damningly, it fails to capture the practice of mathematics. Mathematicians routinely assign high confidence to conjectures like Goldbach's Conjecture based on heuristic evidence and partial verification, despite knowing the statement is either necessarily true or necessarily false. If they are required to assign credence 1 or 0, they cannot update their beliefs based on new evidence (since the truth value is fixed), and decision theory breaks down. An agent that only acts on certainties ($P=1$) will never act on a complex mathematical prediction, rendering them impotent in environments where such predictions yield utility.

  The case against omniscience becomes irrefutable when we introduce self-reference. An ideally rational agent is often modeled as a formal system capable of reasoning about its own reasoning. Here, Gödelian limitations arise. If an agent is sufficiently powerful to encode arithmetic, it cannot prove its own consistency (Gödel's Second Incompleteness Theorem). If the agent is logically omniscient, it must know all logical truths. If it is consistent, "This agent is consistent" is a truth. Therefore, an omniscient agent must believe in its own consistency. However, Löb's Theorem suggests that if a formal system proves that "if I prove $P$, then $P$ is true," it will prove $P$ regardless of its truth. An agent that trusts its own reasoning implicitly (assigning credence 1 to its own outputs) risks becoming unsound. To maintain reflective consistency—where an agent's model of itself aligns with its actual behavior—it must acknowledge the possibility of its own error. This requires assigning a credence strictly less than 1 to its own logical outputs, directly contradicting the omniscience requirement. Thus, an agent that models itself as an ideal reasoner cannot be logically omniscient without risking inconsistency.

  Recent developments in the theory of logical uncertainty, such as the Logical Induction framework proposed by Garrabrant et al., offer a resolution that validates intermediate credences. Logical induction relaxes the requirement for immediate coherence. Instead, it demands that an agent's credences converge to coherence over time and that they cannot be exploited by a polynomial-time trader. This framework allows an agent to assign a credence of 0.5 to a sentence like "The $10^{100}$th digit of $\pi$ is 7" before computing it, recognizing that while the truth is fixed, the agent's access to it is limited. This approach preserves the spirit of the Dutch Book argument (avoiding sure losses in the limit) while abandoning the impossible demand for synchronic omniscience. It acknowledges that logic is a resource to be consumed, not a state to be inhabited.

  Therefore, the conclusion must be that the orthodox Bayesian demand for logical omniscience is mistaken when applied to embedded, reasoning agents. The argument from probability axioms and Dutch books relies on a static view of belief that ignores the computational and self-referential constraints inherent to agency. A credence of 1 implies that no amount of evidence or reasoning could ever lower one's confidence. For an agent embedded in a universe where it must model its own fallibility, such dogmatism is irrational. To assign credence 1 to a logical conjecture before proof is to claim a epistemic access that bypasses the necessity of derivation.

  Consequently, it is rational to hold credences strictly between zero and one for statements whose truth has not been established, even if those statements are logically determined. Rationality is not merely about the static coherence of a belief set, but about the dynamic management of uncertainty under resource constraints. An ideally rational agent is not one who knows all logical truths instantly, but one who allocates their computational resources to reduce logical uncertainty efficiently. To demand omniscience is to demand that the map be identical to the territory; a rational agent must accept that its map, no matter how ideal, is a compression of the territory, and thus must leave room for doubt even in the realm of logic.
