answer: |-
  **Independent Study Proposal**

  **Title:** The Architecture of Rescue: Sequentiality, Aggregation, and the Taurek Puzzle
  **Student:** [Your Name]
  **Course:** Independent Study in Moral Philosophy
  **Proposed Length:** 8 pages
  **Timeline:** 6 weeks

  **1. Research Question and Background**
  The central debate in the ethics of rescue concerns whether numbers count. In his seminal argument, John Taurek contends that when an agent must choose between saving one person or five, the agent ought to flip a coin rather than save the greater number. Taurek argues that aggregating claims violates the separateness of persons; each individual has a claim to be saved that is equal to any other, and summing these claims treats the five as a single unit of value rather than five distinct rights-bearers. The standard literature frames this as a conflict between anti-aggregationist views (grounded in equal concern) and consequentialist or prioritarian views (grounded in maximizing value or weighted claims).

  However, both sides of this debate implicitly assume what I will call a "single-choice architecture." They model the agent as standing at a single decision node with two atomic options: "Save One" or "Save Five." My research question is whether the moral logic of rescue is architecture-dependent. Specifically: *If we decompose the standard rescue scenario into a sequence of independent, one-by-one rescue opportunities—such that saving five requires performing five discrete acts rather than selecting one compound act—does the anti-aggregationist verdict collapse?*

  I hypothesize that Taurek's intuition is sensitive not just to the numbers involved, but to the topology of the agent's available actions. If the choice is reframed from a single binary switch to a sequence of five binary switches (each involving one potential victim), the pressure to aggregate may re-emerge at the level of planning or intention, even if it is rejected at the level of individual acts.

  **2. Gap in Existing Literature**
  Current treatments of the "numbers should count" debate focus almost exclusively on value comparison and the nature of claims. They analyze whether the moral value of five lives saved outweighs one, or whether five claims outweigh one. They do not adequately analyze the structure of the agency involved. By treating the options as atomic, the literature leaves open the possibility that anti-aggregationism is an artifact of a specific, perhaps unrealistic, decision structure. If the moral verdict changes when the option space is topologically altered (from atomic to sequential), this suggests that existing theories are incomplete. They fail to account for how obligations map onto sequential versus atomic choices. This proposal seeks to fill that gap by shifting the focus from the *value* of the outcomes to the *structure* of the choice itself.

  **3. Methodology and Plan of Work**
  Over the six-week period, I will produce an 8-page paper employing conceptual analysis and formal reconstruction. The work will proceed in three stages:

  *   **Weeks 1–2: Formal Reconstruction.** I will construct two models of the rescue scenario. The first is the standard "Atomic Model," where the agent faces one node with options {Save 1, Save 5}. The second is the "Sequential Model," where the agent faces five nodes in series, each with options {Save Individual *i*, Let Individual *i* perish}. I will define the constraints clearly to ensure the Sequential Model is morally analogous to the Atomic Model (e.g., ensuring the agent knows all five are in peril at the outset).
  *   **Weeks 3–4: Normative Mapping.** I will analyze how anti-aggregationist obligations translate across these models. In the Atomic Model, the obligation is to give each side a 50% chance. In the Sequential Model, does the agent owe each individual a 50% chance at each node? If so, the expected outcome is 2.5 lives saved. If the agent instead adopts a policy to save everyone they encounter sequentially, they save 5. I will investigate whether an anti-aggregationist can consistently endorse a sequential strategy without implicitly aggregating at the planning stage.
  *   **Weeks 5–6: Evaluation and Drafting.** I will evaluate whether architecture-sensitive adjustments can preserve Taurek's core claim without *ad hoc* stipulation. I will draft the paper, focusing on the implication that if anti-aggregationism fails in the Sequential Model, it may rely on an untenable view of agency.

  **4. Expected Outcomes and Significance**
  A positive result for this project would establish a principled distinction between atomic and decomposed rescue scenarios. This would either vindicate Taurek by showing his view requires a specific (and perhaps defensible) architecture of choice, or undermine it by showing that once the choice is decomposed, the rationale for flipping a coin evaporates.

  A negative result (or "failure" condition) would look like this: if decomposing the choice merely relocates the aggregation problem to the planning stage (i.e., the agent must form a general intention to save the most they can across the sequence), then the original debate remains untouched. The topology of the action would prove morally irrelevant. Even this result is significant, as it would demonstrate that the locus of aggregation is robust across different action topologies.

  **5. Feasibility and Scope**
  This scope is realistic for an 8-page paper. I will not attempt to solve the aggregation debate entirely nor survey the full history of the Taurek literature. Instead, I will focus narrowly on the structural comparison between the Atomic and Sequential models. I will limit the discussion to rescue cases where the cost to the agent is identical in both scenarios, isolating the variable of choice architecture. This ensures the project remains manageable within six weeks while contributing a novel structural perspective to the seminar's themes of distributive ethics and individual claims.
