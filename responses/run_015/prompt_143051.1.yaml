          1.  **The Epistemic Weight of Gaslighting:** Distinguishing engineered conflict from noise. (The Diagnostic).
          2.  **The Limits of Sovereignty:** Defining the boundary where memory overrides fact without collapsing into "anything goes." (The Justification).
          3.  **The Ethics of Display/Teaching:** How to present the contradiction without resolving it falsely. (The Application).

      *Wait, let's look at the "unblocking" requirement.*
      *   If we solve #1 (Gaslighting), we know *when* to apply special rules.
      *   If we solve #2 (Sovereignty), we know *why* we apply them.
      *   If we solve #3 (Application), we know *how*.
      *   Ranking for *impact*: #1 is the most critical. If you can't prove gaslighting, the archive wins by default in most institutions. Solving #1 unlocks the legitimacy of #2.
      *   Ranking for *tractability*: #2 is hardest (philosophically). #1 is medium (historical/sociological). #3 is easiest (policy).
      *   Let's rank by **Strategic Leverage**.
      *   1. **Operationalizing Archival Gaslighting:** (Distinguishing it from bias).
      *   2. **Grounding Mnemonic Sovereignty:** (Avoiding relativism).
      *   3. **The Ethics of Irresolvability:** (What to do when you can't pick a winner).

      *Re-evaluating based on the prompt's specific constraints:* "Which solved problem actually changes what the curator or board should do?"
      *   If I know it's gaslighting, I discard the archive.
