      *   The *most harmful* mistake is treating gaslighting as normal bias. So #1 is top priority.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Set the stage.
      *   **Rank 1: Diagnosing Archival Gaslighting (vs. Selection Bias).**
