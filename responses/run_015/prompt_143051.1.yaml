  8.  *(Final thought on the Ranking)*: I need to be careful. If I put "Diagnosing Gaslighting" first, is that too historical? The prompt asks for *philosophers and social theorists*. A philosopher can work on the *concept* of gaslighting (epistemic injustice) without digging boxes. Okay, that works. It's about the *criteria* for gaslighting, not the forensic audit itself.

