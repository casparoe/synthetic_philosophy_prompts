answer: |-
  Here is the advisory breakdown for the grant call. I have ranked these based on **strategic leverage**: which concept, if clarified, makes the other two easier to solve, and which mistake causes the most immediate institutional harm.

  ### The Ranking

  #### 1. The Diagnostic Threshold: Distinguishing Archival Gaslighting from Selection Bias
  **The Problem:** Most institutions treat all archival gaps as "selection bias" (incomplete data). This assumes the archive is a broken camera. Archival gaslighting argues the archive is a weaponized mirror, designed specifically to reflect a distortion that makes the community doubt their own sanity or history.
  **Why It's #1:** This is the gatekeeper. If you cannot conceptually distinguish between "the archive is missing stuff" and "the archive was built to lie," you never get to the point of invoking Mnemonic Sovereignty. If it's just bias, the standard historical method (weigh evidence, find corroboration) applies. If it's gaslighting, the archive loses its default authority.
  **Tractability:** High for theorists, low for practitioners. Philosophers can define the *conditions* of gaslighting (intent, structural outcome, induced doubt) without needing archival science training. They can create a checklist of "hostile archival features" (e.g., records created solely for taxation or policing vs. records created for community continuity).
  **The 3-Year Milestone:** A robust set of criteria that allows a board member to say, "This collection meets the threshold of gaslighting; therefore, the burden of proof shifts to the archive, not the community."
  **Re-ranking Condition:** If, after two years, researchers find that "gaslighting" is indistinguishable from standard bureaucratic negligence in 90% of cases, drop this to #3. It becomes too forensic for philosophers.

  #### 2. The Scope of Mnemonic Sovereignty: Jurisdiction vs. Ontology
  **The Problem:** Mnemonic Sovereignty risks collapsing into "truth is whatever we say it is." If a community claims a battle happened in 1800 and carbon dating says 1400, does sovereignty mean we teach 1800? If so, you lose the scientists. If not, what is the sovereignty *for*?
  **Why It's #2:** Once you establish the archive is hostile (Rank 1), you need a rule for what replaces it. This project must define sovereignty as **jurisdictional** (who has the right to assign *meaning* to the event) rather than **ontological** (who decides the *physical facts*). This avoids relativism. The community owns the *significance*, even if they don't own the *chemistry*.
  **Tractability:** Medium. This is pure political philosophy/epistemology. It requires navigating the tension between "respect" and "accuracy."
  **The 3-Year Milestone:** A framework that allows institutions to validate community memory without falsifying physical evidence. For example: "The carbon date measures the age of the bone; the oral history measures the age of the *lineage*. Both are true in different registers."
  **Re-ranking Condition:** If researchers find that communities *demand* ontological sovereignty (i.e., they insist the carbon dating is physically wrong, not just culturally irrelevant), this problem becomes intractable for a liberal institution. You would then need to bump Rank 3 up to manage the conflict rather than solve it.

  #### 3. The Ethics of Irresolvability: Curating the Contradiction
  **The Problem:** Sometimes, even after diagnosing gaslighting and defining sovereignty, the facts still clash. The museum must display *something*. The mistake here is "false synthesis"—smoothing over the conflict to make visitors comfortable.
  **Why It's #3:** This is the application layer. It is less foundational than 1 and 2, but it is where the public sees the harm. The conceptual work here is defining when it is ethical to leave a wound open rather than stitching it shut.
  **Tractability:** High. This is actionable policy. Theorists can draft "conflict protocols" for curators.
  **The 3-Year Milestone:** A "Display Charter" that gives curators permission to label an exhibit: "The archive claims X. The community remembers Y. The archive was created to dispossess the community. We center Y."
  **Re-ranking Condition:** If Rank 1 and 2 fail to produce clear guidelines, this becomes the most urgent practical need. If we can't solve the truth, we must at least manage the presentation ethically.

  ---

  ### Worked Scenario: The Indigenous Origin Narrative

  **The Conflict:**
  *   **Community:** Oral history states the tribe emerged from a specific local cave 500 years ago during a time of great frost.
  *   **Archive:** Colonial administrators' logs from 150 years ago state the tribe migrated from the north 200 years ago (implying they are not "first peoples" and have weaker land claims).
  *   **Science:** Carbon dating of artifacts in the cave suggests human presence 2,000 years ago, but no specific "emergence" event.

  **Applying the Ranking:**

  1.  **Apply Rank 1 (Gaslighting Diagnosis):**
      *   *Question:* Is the colonial log just biased, or is it gaslighting?
      *   *Analysis:* The log was created during a land treaty negotiation. Its specific function was to categorize the tribe as "migrants" to void land title. It wasn't just ignoring data; it was generating a counter-narrative to induce legal doubt.
      *   *Result:* The archive is flagged as **hostile**. It loses its default authority. The curator does not treat the log as equal weight to the oral history.

  2.  **Apply Rank 2 (Sovereignty Scope):**
      *   *Question:* Does the oral history's claim of "500 years ago" override the carbon dating of "2,000 years ago"?
      *   *Analysis:* Using the Jurisdictional model: The carbon date measures *biological presence*. The oral history measures *political/cultural genesis*. The "great frost" may be a metaphor for a political reorganization, not a biological birth.
      *   *Result:* Mnemonic Sovereignty is invoked to interpret the *meaning* of the cave. The community has authority over what the cave *signifies* (their birth as a nation), even if science speaks to how long humans have been physically inside it.

  3.  **Apply Rank 3 (Ethics of Irresolvability):**
      *   *Question:* How do we label the exhibit?
      *   *Action:* We do not write "Tribe arrived 500 years ago." We write: "The People mark their beginning 500 years ago. Colonial records attempt to move this date to undermine land rights. Science shows older presence. The People's count begins at their political birth."
      *   *Result:* The contradiction is visible, but the *power dynamic* causing the contradiction is exposed.

  **Which solved problem changes the Curator's action?**
  **Rank 1.** If the curator treats the colonial log as merely "biased" (Rank 1 failure), they will try to "balance" the oral history against the log. They will feel compelled to mention the "migration theory" as a valid alternative. By solving Rank 1 (identifying it as gaslighting), the curator is ethically cleared to **discard the log as evidence** and treat it instead as an artifact of oppression. This is the single biggest shift in practice.

  ---

  ### Overrated Lines of Inquiry (Do Not Fund)

  1.  **"Digital Repatriation" as a Solution:**
      *   *Why:* Proposals that focus on scanning archives and giving communities digital access assume the problem is *access*. In gaslighting scenarios, the problem is the *content*. Giving someone high-resolution access to a lie does not fix the harm. This is a tech solution to a political problem.
  2.  **"Universal Reconciliation Frameworks":**
      *   *Why:* Any project promising to "harmonize" memory and record is suspect. In cases of gaslighting, harmony is the goal of the oppressor. The goal should be *justice*, which often requires sustaining the conflict until the record is discredited. Funding "reconciliation" often pressures the community to soften their memory to fit the archive.
  3.  **"Pure Epistemology of Memory":**
      *   *Why:* Abstract work on "how memory works" without addressing the *power structures* of the archive is useless here. We don't need to know if human memory is fallible (it is). We need to know if the archive is malicious. Focus on the power dynamic, not the cognitive science.

  ### Value Judgment Flags

  I must be honest about where this ranking relies on non-neutral judgments:

  *   **The Priority of Harm over Accuracy:** This ranking assumes that correcting a historical injustice is more important than maintaining a singular, consistent factual timeline. If your board prioritizes "objective accuracy" above "restorative justice," Rank 2 (Sovereignty) becomes untenable.
  *   **The Presumption of Malice:** Rank 1 requires assuming that colonial archives often had *intent* to deceive, not just ignorance. Some historians will argue this attributes too much agency to bureaucrats. This grant call must be comfortable funding work that assumes bad faith in state record-keeping.
  *   **The Definition of "Community":** Mnemonic Sovereignty assumes a community is a coherent unit that can speak with one voice. In reality, communities have internal dissent. This framework risks empowering community *elites* to define the "official memory." The grant should require theorists to address internal community dissent, or you may fund authoritarian memory politics.

  ### Summary for the Call for Proposals

  When drafting the call, do not ask for "studies on memory." Ask for:
  1.  **Criteria for Hostility:** How do we prove an archive is weaponized?
  2.  **Limits of Authority:** Where does community sovereignty end and shared reality begin?
  3.  **Protocols for Conflict:** How do institutions display unresolvable contradictions without lying?

  If you fund these three, you move the field from "acknowledging the problem" to "equipping the curator."
