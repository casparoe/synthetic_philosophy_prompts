      *   **Rank 3: The Ethics of Irresolvability (Curatorial Practice).**
          *   *Why:* Sometimes you can't solve it. How to display the conflict?
          *   *Tractability:* High. Actionable guidelines.
          *   *Unblocking:* Reduces immediate harm while theory catches up.

      *   **Worked Scenario (Indigenous Origin vs. Carbon/Colonial Archive):**
          *   Apply Rank 1: Is the colonial archive gaslighting? (Likely, if it served dispossession).
          *   Apply Rank 2: Does Sovereignty apply? (Yes, origin stories are often ontological, not just chronological).
          *   Apply Rank 3: What does the museum do? (Center the oral history, contextualize the carbon dating as "physical age" not "cultural beginning").

