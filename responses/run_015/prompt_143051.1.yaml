          *   Must address tractability for non-archivists, harm potential for practitioners (curators/board members), and conditions for re-ranking.
          *   Must flag overrated lines of inquiry.
          *   Tone: Honest, practical, philosophical but actionable.

  2.  **Deconstruct the Core Concepts:**
      *   *Mnemonic Sovereignty:* This is the tricky ethical/epistemic claim. If a community says "X happened" and the archive says "Y happened," does the community win *even if Y is factually true*? How do we defend this without saying "truth doesn't matter"?
      *   *Archival Gaslighting:* This is the structural critique. It's not just that archives are incomplete (selection bias); it's that they were *designed* to make the community doubt their own memory. This changes the burden of proof.

  3.  **Brainstorming Open Questions:**
      *   *Q1: Epistemic Authority.* Who gets to decide truth when sources clash? (Connects to Mnemonic Sovereignty).
      *   *Q2: The Nature of the Archive.* Is the archive a neutral repository or a weapon? (Connects to Archival Gaslighting).
      *   *Q3: Remediation/Repair.* What do we *do* when they clash? Restitution? Dual labeling? Suppression of the archive?
      *   *Q4: The Definition of Harm.* Is the harm cognitive (confusion) or political (dispossession)?

  4.  **Selecting and Ranking the Top Three:**
      *   *Candidate 1: The Normative Status of Mnemonic Sovereignty.* (Can we justify it without relativism?)
      *   *Candidate 2: Diagnosing Archival Gaslighting vs. Bias.* (How do we know it's malicious engineering?)
      *   *Candidate 3: Operationalizing Conflict Resolution.* (What does a curator actually *do*?)

      *Ranking Logic:*
      *   #1 needs to be the foundation. If we can't justify Mnemonic Sovereignty, the rest is moot. But wait, if we don't know *if* gaslighting happened, sovereignty claims might be dismissed as delusion.
