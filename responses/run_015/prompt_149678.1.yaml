  2.  **Deconstruct the User's Model (The "Machine" Metaphor):**
      *   *User's Model:* Input Scenario $\rightarrow$ Mental Machine $\rightarrow$ Output Intuition. If Output A $\neq$ Output B, Machine Broken.
      *   *Expert Model:* Input Scenario $\rightarrow$ Cognitive/Conceptual Processing $\rightarrow$ Output Intuition. The "pump" isn't the *generator* of the intuition; it's a *revealer* of underlying commitments.
