      *   Key concept: *Essentialism*. There is a "whatness" to the tradition that can be damaged.
      *   Key concept: *Proprietary Community*. The group owns the culture.

  5.  **Drafting Section 2: Rival Pictures:**
      *   *Hobsbawm & Ranger:* "Invention of Tradition." Many "ancient" things are recent. The form assumes antiquity equals validity.
      *   *Anderson:* "Imagined Communities." The "group" is often created by the census/list.
      *   *The Conflict:* If the register manufactures the unity it claims to protect, is it a lie?
      *   *Defense:* Pragmatic functionalism. Even if constructed, it provides social cohesion. The "Noble Lie" argument.

  6.  **Drafting Section 3: Underdetermination:**
      *   Where is the wiggle room?
      *   The definition of "safeguarding" in UNESCO 2003 actually includes "revitalization" and "transmission," not just freezing.
      *   A constructionist *could* sign, treating the list as a funding mechanism, provided they don't believe their own PR.
      *   Is standardization defensible? Yes, if the threat is *fragmentation* leading to loss of critical mass. (e.g., if everyone changes the language, the language dies).

  7.  **Drafting Section 4: Concrete Edits:**
      *   Current: "Describe the tradition." -> New: "Describe the *changes* in the tradition over the last 20 years."
      *   Current: "Name the bearer group." -> New: "Name the *networks of participation*."
      *   Current: "Safeguarding plan" (stop loss). -> New: "Adaptation plan" (manage change).
      *   *Specific Idea:* A "Versioning" requirement. Acknowledge multiple valid variants.

  8.  **Drafting Confidence & Uncertainty:**
      *   High confidence on the philosophical tension (Object vs. Process).
      *   High confidence on the bureaucratic drift (Standardization).
      *   *Low Confidence:* The specific legal weight of "community consent" in different national jurisdictions. Some countries treat the Inventory as advisory, others as regulatory. I need to flag this.
      *   *Specialist Check:* Legal anthropologists specializing in the 2003 Convention's Operational Directives.

  9.  **Refining the Voice:**
