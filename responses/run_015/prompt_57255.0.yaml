answer: |-
  First, a quick verification of your reporting. Your summary of the practice is **substantially accurate** regarding the *implementation* of the 2003 UNESCO Convention for the Safeguarding of the Intangible Cultural Heritage (ICH), though with one important nuance. The Convention text itself is surprisingly progressive—it explicitly defines ICH as "constantly recreated" and warns against freezing it. However, the *Operational Directives* and the national forms derived from them require stability for measurement. You cannot fund "flux." You cannot audit "recreation." So, while the *philosophy* in the preamble is dynamic, the *bureaucracy* is static. Your observation that the machinery produces standardization is a well-documented sociological phenomenon (often called "heritagization" or "museumification"). You haven't missed a key document; you've identified the gap between policy text and administrative reality.

  Here is the brainstorming reconstruction you asked for, from the perspective of someone who has read the forms and sat in the meetings.

  ### 1. Reconstructing the Theory of Tradition

  If we treat the application form as a philosophical text, it presupposes what I would call a **Substance Theory of Culture**.

  *   **Ontology (What is it?):** The form assumes a tradition is a discrete, countable *object* rather than a continuous *process*. It treats "The Harvest Dance" the way a naturalist treats "The Bengal Tiger." It assumes there is a fact of the matter about where the tradition begins and ends. If it were a process, you wouldn't be able to "list" it; you'd have to describe a flow. The fact that it gets an ID number implies it has boundaries.
  *   **Epistemology (How do we know it's real?):** It assumes **Genealogical Authenticity**. A practice is valid because it comes from the past, not because it works in the present. The requirement for "intergenerational transmission" privileges age over utility. If a group invented a new ritual yesterday that solved a social crisis perfectly, the form rejects it. If they invented it 150 years ago and it's now useless but still performed, the form accepts it.
  *   **Politics (Who owns it?):** It assumes a **Proprietary Community**. The form requires a "bearer group" that can speak with one voice. This presupposes that culture is property that can be owned, managed, and licensed by a specific collective agent. It assumes the community exists *prior* to the application, rather than potentially being constituted *by* the application.
  *   **Teleology (What is the goal?):** It assumes **Entropy**. The default state of a tradition is decay. Therefore, "safeguarding" is synonymous with "stabilization." Change is treated as a threat vector (contamination, loss of skill) rather than a sign of health (adaptation).

  **Does it have to assume these?**
  Strictly speaking, no. You could have a register of "Cultural Processes" where the criterion is "rate of healthy adaptation." But the current machinery *requires* the Substance Theory because bureaucracies need stable units to manage. You can't budget for "flux."

  ### 2. Rival Pictures and the "Manufacturing" Charge

  The paperwork quietly rules out two major sociological insights:

  *   **The Hobsbawm/Ranger View ("Invention of Tradition"):** Many customs presented as ancient are often recent consolidations. The form treats antiquity as a validator. If applicants admit, "We standardized this in 1995 to stop it dying," they risk rejection. They are incentivized to say, "This is how our ancestors did it."
  *   **The Anderson View ("Imagined Communities"):** The idea that a "community" is a unity that exists mainly because people are told it is. The form requires a spokesperson. This forces fuzzy, overlapping networks (e.g., "everyone who likes this soup") to harden into a legal entity (e.g., "The Association of Soup Makers").

  **Is the register confused or manufacturing?**
  It is **performatively manufacturing**. This is the crucial philosophical point. When the ministry lists "The X Festival," it doesn't just describe X; it brings "The X Festival" into existence as a legal and financial category.
  *   **The Confusion:** Officials believe they are *finding* things.
  *   **The Reality:** They are *gardening* things, but they think they are *archaeologists*.

  **Would defenders have an answer?**
  Yes. A pragmatic defender would argue: *"Even if the community boundary is artificial, the funding creates social cohesion. We are not describing reality; we are building infrastructure for identity. The 'lie' of unity is a necessary fiction for political recognition."* This is a "Noble Lie" defense. They would argue that without the hardening of boundaries, the tradition would dissolve into the noise of modern life. The standardization isn't a bug; it's the structural support beam.

  ### 3. Where the Practice is Underdetermined

  This is the most hopeful section for your column. There is wiggle room between the *rules* and the *habitual interpretation* of the rules.

  *   **"Safeguarding" vs. "Freezing":** The UNESCO text defines safeguarding as ensuring "viability." A thoroughgoing constructionist could argue that *change* is required for viability. If a tradition doesn't adapt, it dies. Therefore, a plan that introduces innovations is a better safeguarding plan than one that enforces orthodoxy.
  *   **The "Bearer Group":** The forms ask for a group, but rarely define the legal threshold of representation. A constructionist could submit a form on behalf of a "network" rather than an "association," listing multiple, conflicting spokespersons. The bureaucracy hates this, but the rules often don't explicitly forbid it.
  *   **Instrumental Signing:** Could a constructionist sign the forms and lose nothing? **Yes, provided they treat the "Canonical Version" as a temporary administrative snapshot rather than a metaphysical truth.** They can tell the ministry, "This is the version for the file," while telling the practitioners, "This is just for the funding; do what you want." The danger is that the funding creates a power imbalance: the "canonical" version gets the money for costumes/venues, so it *becomes* the dominant version by market force, not by decree.

  **Is preservation-by-standardization defensible?**
  Only under a **Critical Mass Theory**. If a practice is so fragmented that no one can recognize it anymore, it loses its function as a shared language. Standardization might be defensible not to "save the past," but to "maintain intelligibility." Think of it like spelling reform. We standardize spelling not because it's "authentic," but so we can read each other. If the tradition is a language, some grammar is needed. The error is treating the grammar as sacred rather than functional.

  ### 4. Concrete Edits for a "Process Theory"

  If we swap the Substance Theory for a Process Theory (traditions as ongoing verbs, not nouns), here is how the machinery must change.

  **Current Mechanism:**
  *   **Field:** "Date of Origin."
  *   **Field:** "Description of the element (fixed)."
  *   **Requirement:** "Safeguarding Plan" (How will you stop it changing?).
  *   **Signatory:** "Head of the Bearer Community."

  **Proposed Edits:**

  1.  **The "Version History" Field:** Instead of "Date of Origin," require a **"History of Adaptation."** Applicants must list three significant changes the practice underwent in the last 50 years and *why* they happened.
      *   *Philosophical Grip:* This forces the applicant to acknowledge the tradition is a flow. It makes innovation evidence of health, not a threat to authenticity.
  2.  **The "Viability" Metric:** Change the funding trigger. Currently, funding often goes to "documenting" or "teaching the old way." Shift funding to **"Experimentation Grants."** Money is awarded for plans that test how the tradition can function in a new context (e.g., "How do we perform this rite in an urban apartment?" vs. "How do we build the traditional village hall?").
      *   *Philosophical Grip:* This treats the tradition as a tool for living, not a relic.
  3.  **The "Dissent" Clause:** Instead of one spokesperson, require a **"Map of Participation."** Applicants must list sub-groups who practice the tradition differently and confirm they have been consulted. If there is disagreement about the "correct" way, the form must record the disagreement, not resolve it.
      *   *Philosophical Grip:* This acknowledges that "community" is a site of negotiation, not a monolith. It prevents the "freezing" of one variant as the official one.

  ### Confidence and Uncertainty

  **Confidence Level:** High on the philosophical analysis; Moderate-High on the bureaucratic mechanics.

  **The Philosophical Claim (High Confidence):** I am very confident that the administrative requirement for "identifiable units" inevitably reifies culture. This is a standard problem in the sociology of bureaucracy (Weberian iron cage applied to culture). The tension between "living" and "listed" is structural, not accidental.

  **The Point of Least Certainty (Specialist Check Needed):**
  I am least sure about the **legal variance in national implementation**.
  *   *Why:* The UNESCO Convention is a framework. Japan's Law for the Protection of Cultural Properties operates very differently from Brazil's or France's. In some jurisdictions, "listing" confers strict legal protection that *forbids* change (like a zoning law for culture). In others, it is purely advisory and funding-based.
  *   *The Risk:* My suggestion that a constructionist can "play along" assumes the register is mostly about funding. If the register triggers legal protections that criminalize deviation (e.g., you can't modify a listed craft technique without losing legal status), then the "instrumental signing" strategy collapses.
  *   *Recommendation:* Before filing, check if the specific national register you are writing about has **regulatory teeth** or is purely **distributive** (money/prestige). If it has regulatory teeth, the "manufacturing" effect is much more coercive than my analysis suggests.

  **Summary for your Column:**
  The machinery assumes culture is a *noun* (a thing to be saved) when the practitioners experience it as a *verb* (a thing to be done). The tragedy isn't that officials are lying; it's that they are trying to measure a river by building a dam. They call the dam "protection," and the water behind it is indeed preserved, but it is no longer flowing.
