answer: |-
  # Q&A Prep Sheet: Geometric Rationality as Normative Constraint

  **Context:** Defense before interdisciplinary seminar (Formal Epistemology, Decision Theory, Behavioral Econ, CS).
  **Core Claim:** Kelly/Geometric rationality is a *normative constraint* on algorithmic allocation, contingent on an independence presumption that fails under adversarial correlation, exposing a Bayesian blind spot.
  **Time Limit:** Replies drafted for ~2 minutes spoken delivery.

  ---

  ## Top 6 Objections (Ordered by Potential Damage)

  ### 1. The Representation Theorem Challenge
  **Interlocutor:** Formal Decision Theorist
  **Objection:** "You claim Kelly is a *normative constraint*, not just a strategy for log-utility agents. But without a representation theorem deriving Kelly from axioms of preference or coherence (like Savage or von Neumann-Morgenstern), aren't you just asserting a specific utility function (log wealth) as a universal norm? Where is the axiomatic justification for imposing geometric growth as a *duty* rather than a *preference*?"
  **Reply:** "Standard representation theorems derive utility from preferences. I am arguing that in sequential resource allocation, the *physics of compounding* imposes constraints prior to preference. If an agent violates geometric rationality, they face almost sure extinction in long-horizon environments regardless of their utility function, provided they wish to remain in the game. The 'axiom' here is survival/continuation of the allocation process itself. The normativity comes from the ergodicity breakdown: ensemble averages (Bayesian expected value) do not equal time averages (geometric growth). I am proposing a 'survival axiom' that precedes utility maximization."
  **Weakness:** This conflates *instrumental necessity* (survive to bet again) with *normative rationality*. A decision theorist can argue an agent rationally chooses to go bust for a high-payoff single shot. You haven't proven they *ought* to continue betting.

  ### 2. Normativity for Non-Human Agents
  **Interlocutor:** Formal Epistemologist
  **Objection:** "Norms typically apply to agents capable of reasoning or holding beliefs. An algorithm executing resource allocation has no beliefs, only parameters. In what sense can code be 'irrational' or bound by a 'norm' rather than simply being 'buggy' or 'suboptimal' relative to a specified objective function?"
  **Reply:** "We routinely ascribe normative terms to algorithms when they violate coherence constraints, such as probabilistic consistency (Dutch bookability). I am extending this to *diachronic coherence* in budgeting. If an algorithm's update rule systematically drains the budget in a favorable environment due to arithmetic averaging, it violates a structural constraint of the environment it inhabits. The 'norm' is a mapping between the algorithm's update logic and the topological structure of the decision space. It is 'irrational' in the same sense a bridge is 'structurally unsound'—it fails to map to reality's constraints."
  **Weakness:** This risks a category error. Epistemologists may reject "structural unsoundness" as a synonym for "normative violation." Norms usually imply *ought*, not just *functional failure*.

  ### 3. The Adversarial Independence Contradiction
  **Interlocutor:** Computer Scientist / Decision Theorist
  **Objection:** "You argue the independence presumption breaks under adversarial correlation. But if the environment is adversarial, Kelly is known to be suboptimal compared to minimax or robust optimization strategies. If you admit the independence assumption is fragile, how can you claim Kelly is a *normative constraint* rather than a context-dependent heuristic that fails precisely where you say the assumption breaks?"
  **Reply:** "Precisely. That is the 'blind spot' I am highlighting. Standard Bayesian updates assume the environment is static or stochastic, not adversarial. My claim is that treating Kelly as a *default normative constraint* forces the designer to explicitly model the correlation structure. If you cannot justify independence, you are not permitted to use the Kelly fraction. The normativity lies in the *burden of proof* for independence. Using Kelly without verifying independence is the irrational act; recognizing the breakdown is the rational correction."
  **Weakness:** This retreats from "Kelly is the norm" to "Checking assumptions is the norm." It weakens the claim that geometric rationality itself is the constraint, rather than model validation.

  ### 4. Dutch Book Vulnerability
  **Interlocutor:** Formal Epistemologist
  **Objection:** "Does violating your geometric constraint expose the agent to a Dutch Book? If I maximize arithmetic expected utility and accept ruin risk, can you construct a series of bets that guarantees my loss? If not, your 'norm' lacks the coherence forcing of probabilistic consistency."
  **Reply:** "Not a synchronic Dutch Book, but a *diachronic* one. In sequential markets, an arithmetic maximizer can be pumped: forced to take bets that look positive EV individually but reduce geometric growth, eventually driving capital to zero while a Kelly bettor accumulates. The 'book' is made by the market environment over time, not a single adversary at one timestamp. The vulnerability is absorption (ruin), which is a guaranteed loss of future optionality."
  **Weakness:** Diachronic Dutch books are controversial in philosophy. Many argue that if the agent values the final state over the path, ruin is acceptable. You assume "remaining in the game" is a terminal value.

  ### 5. The Revealed Preference Tautology
  **Interlocutor:** Behavioral Economist
  **Objection:** "If an algorithm consistently allocates via Kelly, doesn't that simply reveal its utility function is logarithmic? Calling it a 'normative constraint' seems like semantic window-dressing. You're describing behavior, not prescribing a norm."
  **Reply:** "Revealed preference assumes the agent is maximizing *something*. I am arguing that in compounding environments, geometric growth is the *only* coherent objective that doesn't rely on arbitrary risk parameters. It's not that the algorithm 'prefers' log utility; it's that any other preference structure is mathematically unsustainable over infinite horizons. The norm is external to the agent's internal state; it's imposed by the multiplication operator. It's not revealed preference; it's revealed *mathematics*."
  **Weakness:** Economists can counter that "sustainability" is just a specific preference for survival. You haven't escaped the preference framework, just hidden it in the math.

  ### 6. Engineering Heuristic vs. Norm
  **Interlocutor:** Computer Scientist
  **Objection:** "In applied engineering, we care about regret bounds and worst-case performance. Kelly optimizes asymptotic growth rate but has high volatility. Why should an engineer treat this as a 'norm' when it performs poorly in short horizons or high-variance regimes compared to fractional Kelly or fixed-fraction strategies?"
  **Reply:** "Because 'short horizon' is often a modeling error in resource allocation. Budgets are typically replenished or reallocated continuously. If you optimize for short-term arithmetic return, you introduce fragility into the system's feedback loop. The 'norm' is for the *system architect*, not the single run. It constrains how we design the update rule to prevent systemic fragility, even if a specific instance suffers higher variance. It is a constraint on the *design space*, not the output."
  **Weakness:** Engineers care about the specific instance (the deployment). If the norm leads to "worse" performance in the actual deployment window, they will reject the normativity.

  ---

  ## The "Hope No One Asks" Objection
  **Topic:** **Finite Horizons and Non-Renewable Budgets**
  **The Question:** "Kelly optimality is asymptotic (infinite horizon). If the allocation process has a known termination point $T$, or if the budget is non-renewable (consumed upon use without carry-over), geometric growth is irrelevant. In a one-shot or finite sequential game, arithmetic expected utility maximization is standardly rational. How do you justify a 'normative constraint' of geometric rationality for algorithms operating on fixed, non-renewable compute budgets or finite deployment cycles?"
  **Why it's dangerous:** It undermines the mathematical foundation of the Kelly criterion. If the "game" ends, ruin isn't permanent, and compounding doesn't apply. This reduces your claim to a niche case (infinite/renewable resources) rather than a general normative constraint on algorithmic allocation.
  **Prepared Deflection:** "Most algorithmic resource allocation (e.g., cloud compute, portfolio rebalancing, attention mechanisms) is effectively continuous and renewable. The 'finite' case is the exception, not the rule. However, if the horizon is known and fixed, the geometric constraint relaxes to a weighted mix of arithmetic and geometric depending on time-remaining. The norm is to *default* to geometric unless finiteness is proven."

  ---

  ## Mind-Changing Conditions & Vulnerable Reasoning

  **What would change my mind:**
  1.  **Formal Proof of Diachronic Coherence:** If a decision theorist demonstrates a formal proof that violating Kelly in a finite-horizon sequential game does *not* constitute a coherence violation (i.e., no diachronic Dutch book can be constructed even with a survival axiom), my claim that it is a "normative constraint" collapses to "contextual heuristic."
  2.  **Empirical Counter-Example:** If presented with a class of adversarial environments where Kelly allocation consistently outperforms *and* survives better than arithmetic maximization *without* requiring an independence assumption, my claim about the "independence blind spot" is falsified.

  **Most Vulnerable Step in Reasoning:**
  **The Is-Ought Jump:** The transition from *"Geometric maximization is necessary for long-term survival"* (Descriptive/Mathematical) to *"Agents ought to maximize geometric growth"* (Normative).
  *   **Why:** This relies on the hidden premise that "survival/continuation of the betting process" is the supreme terminal value. An agent (or designer) might rationally value a high-variance "go for broke" strategy that maximizes expected arithmetic return at the cost of high ruin probability. I have not successfully argued why "avoiding ruin" is a normative requirement rather than just one possible preference among many.
