answer: |-
  ### The Scenario: River City Mortgage

  River City Bank uses an ML model to approve 30-year mortgages. The "positive" outcome is **Successful Repayment**; the "negative" outcome is **Default**. The bank evaluates two demographic groups, Group A and Group B, each with 1,000 applicants. Due to historical wealth gaps and income volatility, the base rates differ: Group A has a 90% success rate (900 will repay, 100 will default), while Group B has a 70% success rate (700 will repay, 300 will default). The model is well-calibrated and equally accurate across groups: it correctly identifies 80% of those who will repay (True Positive Rate = 0.8) and incorrectly approves 10% of those who will default (False Positive Rate = 0.1). These error rates are identical for both groups.

  ### The Arithmetic of the Impossibility

  We define **Equalized Odds (EO)** as having equal True Positive Rates (TPR) and False Positive Rates (FPR) across groups. We define **Demographic Parity (DP)** as having equal overall Approval Rates across groups.

  **1. Satisfying Equalized Odds (The Current Model)**
  Since the bank applies the same threshold to everyone, TPR and FPR are locked at 0.8 and 0.1 for both groups. Let's calculate the total approvals.

  *   **Group A Approvals:**
      *   True Positives (Repaid): $900 \text{ applicants} \times 0.8 \text{ TPR} = 720$
      *   False Positives (Defaulted): $100 \text{ applicants} \times 0.1 \text{ FPR} = 10$
      *   **Total Approved:** $720 + 10 = 730$
      *   **Approval Rate:** $730 / 1000 = \mathbf{73\%}$

  *   **Group B Approvals:**
      *   True Positives (Repaid): $700 \text{ applicants} \times 0.8 \text{ TPR} = 560$
      *   False Positives (Defaulted): $300 \text{ applicants} \times 0.1 \text{ FPR} = 30$
      *   **Total Approved:** $560 + 30 = 590$
      *   **Approval Rate:** $590 / 1000 = \mathbf{59\%}$

  **Result:** Equalized Odds is satisfied (error rates match), but Demographic Parity is violated (73% vs 59%). Group B receives significantly fewer loans.

  **2. Attempting to Satisfy Demographic Parity**
  To achieve DP, the bank must raise Group B's approval rate from 59% to match Group A's 73%. They lower the decision threshold *only* for Group B. This increases Group B's TPR and FPR. Let's say they adjust the threshold until Group B also has a 73% approval rate.

  Because Group B has a higher base rate of default (300 vs 100), raising the approval volume inevitably captures more defaulters proportionally than in Group A. To get 730 approvals from Group B's population (700 good, 300 bad), the math forces the error rates to diverge.
  *   *Hypothetical Group B Adjustment:* To hit 730 approvals, you might need a TPR of 0.95 and an FPR of 0.20.
  *   **New Group B Stats:** $(700 \times 0.95) + (300 \times 0.20) = 665 + 60 = 725$ (approx 73%).
  *   **New Error Rates:** Group A FPR is 0.10; Group B FPR is 0.20.

  **Result:** Demographic Parity is satisfied (73% vs 73%), but Equalized Odds is violated. Group B is now subjected to a much higher risk of erroneous approval (20% false positive rate vs 10%), meaning they are twice as likely to be approved for a loan they cannot sustain.

  **The Load-Bearing Feature: Base Rates**
  The conflict arises entirely from the base rate gap. The formula for Approval Rate is:
  $$ \text{Approval Rate} = (\text{Base Rate} \times \text{TPR}) + ((1 - \text{Base Rate}) \times \text{FPR}) $$
  If EO holds, TPR and FPR are constant ($t$ and $f$).
  *   Group A Rate: $0.9t + 0.1f$
  *   Group B Rate: $0.7t + 0.3f$
  For DP to hold, these must be equal: $0.9t + 0.1f = 0.7t + 0.3f \rightarrow 0.2t = 0.2f \rightarrow t = f$.
  If $t = f$, the True Positive Rate equals the False Positive Rate. This means the model is no better than a random coin flip. **Unless the model is useless, you cannot satisfy both criteria when base rates differ.**

  If you close the base rate gap (e.g., both groups have 90% success), the equation becomes $0.9t + 0.1f = 0.9t + 0.1f$. The conflict vanishes; you can satisfy both EO and DP simultaneously with a predictive model.

  ### The Normative Clash

  **The Demographic Parity Advocate says:**
  "Look at the output: 73% of Group A get homes, only 59% of Group B. Your 'equal accuracy' is a sham because it preserves the historical status quo. By using a threshold that yields disparate impact, you are denying capital to Group B based on past systemic failures they didn't cause. You are punishing them for the base rate gap. You must lower the threshold for Group B to ensure equal access to opportunity, even if it means the error profiles look different."

  **The Equalized Odds Advocate says:**
  "If you lower the threshold for Group B to force parity, you are approving people you *know* are likely to default at higher rates. You are setting Group B up for debt spirals and foreclosure. A loan that leads to default is not an 'opportunity'; it's a harm. My criterion ensures that a qualified person in Group B has the same chance of being recognized as one in Group A, and an unqualified person has the same chance of rejection. Anything else is paternalistic engineering that sacrifices individual accuracy for group statistics."

  ### Escape Hatches and Their Costs

  1.  **Randomized Thresholds:**
      *   *Mechanism:* To mathematically satisfy both DP and EO without changing base rates, you can randomly approve/reject candidates on the margin to balance the rates.
      *   *Cost:* **Integrity.** Telling a loan applicant, "You qualified, but a random number generator denied you to satisfy a fairness constraint," destroys trust and creates legal liability. It treats individuals as means to a statistical end.

  2.  **Dropping a Criterion (Pick One):**
      *   *Mechanism:* Legally, US disparate impact law often leans toward DP (outcome parity), while ML ethics often leans toward EO (error parity).
      *   *Cost:* **Trade-off.** Picking DP risks higher default rates for the disadvantaged group (financial harm). Picking EO risks perpetuating wealth gaps through lower approval volumes (opportunity harm). There is no free lunch; one group's benefit is the other's cost.

  3.  **Retargeting the Prediction:**
      *   *Mechanism:* Change the label $Y$. Instead of predicting "Will Repay" (based on history), predict "Will Repay *If Given Financial Counseling*."
      *   *Cost:* **Complexity & Measurement.** This requires intervening in the world, not just observing it. It shifts the burden from the model to the bank's support infrastructure. If the support fails, the model looks biased again. It solves the math by changing the problem, which is expensive and operationally difficult.
