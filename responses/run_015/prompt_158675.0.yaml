  I've been reading about causation on my own — no philosophy background, just stubborness — and I keep getting stuck on the difference between the two big pictures: the "what would have happened otherwise" one (the counterfactual view, I think that's David Lewis's version?) and the "a cause is something you could in principle wiggle from outside and watch the effect move" one (the interventionist view — Woodward, I believe). Everyone says the two come apart, but every case I've managed to find where they come apart has one of the same three or four shapes: two things each sufficient on their own so that neither is strictly needed (firing squads, backup generators), or somebody's not-doing-something counting as the cause, or a tie that's guaranteed by the laws of physics so nobody could wiggle it even in principle. I want to know whether there's any shape beyond those.

  What I'd like you to build me: one paragraph, set somewhere ordinary — an office, a shop floor, a school admin office, a hospital rota, that kind of thing; no lab kit, no sci fi, no thought-experiment furniture like perfect predictors or demons — in which some specific thing X happens and some specific outcome Y follows, and the two pictures disagree about whether X caused Y, with the disagreement not coming from any of the three shapes above. Realistic enough that I could tell it to a freind over coffee as something that plausibly happened, and the disagreement has to fall out of how each account actually works rather than from you just announcing "there's no possible intervention here" or "the counterfactual is too fuzzy to evaluate." I want to watch each account grind through the case and produce its verdict.

  What it's for: I'm trying to work out whether the interventionist picture is quietly carrying some requirement that the counterfactual one doesn't have, or the other way round, and cases with the familiar shapes won't tell me that because those have been picked over already. If there really is no further shape, or if the disagreement can only be manufactured by rigging the case, please tell me that straight instead of handing me something that half works. Give me exactly five numbered items, one or two sentences each, no hello and no sign-off: 1) the case, with X and Y named; 2) the counterfactual verdict and the reasoning that gets there; 3) the interventionist verdict and its reasoning; 4) which single feature of the case is doing the work, and what happens to the disagreement if you take that feature out; 5) the best move available to a defender of whichever picture comes off worse, plus how confident you are, out of ten, that your case really does what I asked and isn't rigged.
