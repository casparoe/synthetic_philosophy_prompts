answer: |-
  ### The mistake in how I're framing this

  Your false presupposition is that **belief changes are structurally invariant and order-independent.** You are treating Jeffrey conditioning as a universal solvent for "uncertain evidence," assuming that whenever a credence shifts, the conditional relationships (likelihoods) surrounding that proposition remain rigid. They often do not. Furthermore, you are banking on commutativity—the idea that the order of updates doesn't matter. While standard Bayesian conditioning on certain evidence commutes, Jeffrey conditioning does not. If you update proposition $A$ then $B$, you generally arrive at a different posterior than if you update $B$ then $A$, unless $A$ and $B$ are probabilistically independent. By batching slider moves and applying them in arbitrary log-file order, your app is silently injecting noise into your users' belief states. The math only works if the "rigidity" constraint holds—that the *diagnostic value* of the evidence hasn't changed, only its probability. When the reason for the probability shift is that the evidence itself became less reliable or the model structure changed, rigidity fails, and Jeffrey conditioning yields garbage.

  ### What rigidity actually requires, and how to check for it

  Rigidity is the constraint that $P_{new}(H|E) = P_{old}(H|E)$. In plain English: "If $E$ turned out to be true, how much would that tell me about $H$?" Jeffrey conditioning assumes this diagnostic link remains constant even as your confidence in $E$ fluctuates. This holds only when the *meaning* of $E$ and its relationship to the world are stable, and the uncertainty is purely about whether $E$ obtained.

  To check for rigidity, ask: "Has the *reason* I'm moving the slider changed the correlation between $E$ and $H$?" If you move the slider because you received a noisy signal (e.g., a muffled phone call), rigidity often holds; the link between "Friend said Yes" and "Friend is Coming" is stable, you're just unsure what was said. But if you move the slider because the *source* became unreliable (e.g., "I know this friend lies when tired"), the conditional probability $P(\text{Coming} | \text{Said Yes})$ has dropped. Rigidity fails.

  A second check is partition sensitivity. Jeffrey conditioning depends on how finely you carve the possibility space. If you update on "Test Positive" vs. "Test Positive in Bad Light," you get different results. If your app allows users to slide credences on overlapping or nested propositions without tracking the partition structure, you violate the invariance requirement. Rigidity requires that you are updating on the finest partition of direct experience available. If you update on a coarse inference rather than the raw sensory input, you risk double-counting uncertainty or ignoring shifts in likelihood. Your friend is insisting that you condition on what you are *certain* of (the sensory qualia) and encode uncertainty in the likelihoods, rather than using Jeffrey conditioning to smooth over the gap between sensation and proposition.

  ### My three cases, worked

  **1. The Bad-Light Test Reading**
  Your friend is right: this is the classic failure mode for naive Jeffrey conditioning. You set $P(\text{Test Positive}) = 0.7$. Rigidity assumes $P(\text{Infected} | \text{Test Positive})$ is stable. But if the light is bad, the reliability of the test reading is compromised. The correct Bayesian move is to condition on the certain observation: "The cassette *looked* positive." You then apply a likelihood $P(\text{Looks Positive} | \text{Infected})$ that accounts for the lighting. If you use Jeffrey conditioning on "Test Positive," you are treating the uncertainty as if it resides in the test result itself, rather than your perception of it. Furthermore, because Jeffrey updates don't commute, if you later update on "Lighting was poor," the order in which you apply "Test Positive" and "Poor Lighting" sliders will change your final credence in Infection. Your app's arbitrary batching makes this result untrustworthy.

  **2. The Preprint Revising Sensitivity**
  Here, Jeffrey conditioning is strictly forbidden. A preprint changing the test's sensitivity alters the likelihood function $P(\text{Test Positive} | \text{Infected})$. Jeffrey conditioning explicitly holds conditionals fixed ($P_{new}(H|E) = P_{old}(H|E)$). By using a slider to update the base rate or test reliability via Jeffrey kinematics, you are mathematically contradicting the source of the update. You cannot propagate a change in model parameters using a rule designed for changes in evidence marginals. This requires structural model editing, not probability kinematics.

  **3. The Pure-Reflection Base-Rate Move**
  This is category confusion. Jeffrey conditioning is an *updating* rule for incorporating evidence. Changing a prior due to reflection is *model revision*. While you can technically use the math to shift the marginal $P(\text{Infected})$, doing so bypasses the justification kinematics provides (minimal information change). There is no "evidence" $E$ to hold rigid. You are simply asserting a new prior. Your app can support this, but it shouldn't pretend it's an evidence update; it's a reset of the starting state, and subsequent updates should condition on this new prior, not propagate through old conditionals that might have been calibrated to the old one.

  ### So what is probability kinematics actually for?

  It is for when you receive aggregate information that fixes a marginal probability without altering the internal correlations of your model. A prime example is market prices: if a prediction market says there's a 70% chance of an event, you might set your credence to 0.7 while assuming the market hasn't changed the causal structure linking that event to your other beliefs. It is also useful for integrating expert opinions where you trust their final judgment on $E$ but lack the raw data to condition on. It works best when the input is a "black box" probability assignment from a trusted source that you treat as a direct constraint on your marginals. It is not a general-purpose engine for all belief changes; it is a specific tool for importing external marginals when likelihoods are stable.

  ### Where I still have to use judgment

  You cannot automate epistemology. Your app must ask users *why* the slider moved. Was it new evidence (conditioning), unreliable evidence (likelihood adjustment), or model revision (prior change)? You need to flag non-commutativity: warn users that updating $A$ then $B$ differs from $B$ then $A$. Finally, enforce partition discipline. Don't let users slide credences on propositions that are logically dependent without warning them that rigidity might fail. The math is a tool, not a substitute for understanding the causal structure of your beliefs.
