answer: |-
  This is a remarkably precise dissection of a stalemate that plagues not just development economics but political philosophy and legal anthropology. You are correct that tabooing the word failed because the disagreement is not merely lexical; it is structural. The word "corruption" is acting as a placeholder for a clash between **Weberian ideal types** and **functionalist systems theory**.

  Here is a diagnosis of the disagreement, an evaluation of your proposed test, and a suggestion for what progress might actually look like.

  ### 1. Diagnosis: Ideal Types vs. Equilibrium Strategies

  You hypothesized three stacked disagreements (Concept, Empirical, Data). My diagnosis is that these are symptoms of a single, bedrock disagreement about the **ontology of the state**, which manifests as a divergent wager on **equilibrium dynamics**.

  **The Bedrock (Telos of Office):**
  *   **Side A (Universalist)** operates on a *deontological* definition of the office. The office exists *prior* to the relationships surrounding it. Its purpose is to embody the general will or the rule of law. Therefore, any particularistic claim on the office is a category error—a corruption of the thing itself.
  *   **Side B (Contextualist)** operates on a *consequentialist/functionalist* definition. The office is a node in a social network. Its purpose is to facilitate exchange and reduce uncertainty in an environment where formal institutions are absent or hostile. Therefore, particularism is not a corruption of the office; it is the *substrate* upon which the office currently survives.

  **The Load-Bearing Beam (The Empirical Wager):**
  This is where the stalemate locks. It is not just about whether patronage is a substitute or a cause (your second point); it is about **transition costs**.
  *   **Side A** assumes a *linear* model: Remove corruption $\rightarrow$ State capacity rises. They view the patronage network as a parasite draining the host.
  *   **Side B** assumes a *systemic* model: Remove patronage $\rightarrow$ Social insurance collapses $\rightarrow$ State capacity falls (due to instability). They view the patronage network as the load-bearing wall of a dilapidated house.

  The reason you cannot move the argument is that Side A is describing a **high-trust equilibrium** (where rules work) and Side B is describing a **low-trust equilibrium** (where rules don't work). They are talking past each other because they are modeling different worlds. Side A cannot see how the system functions without impersonality; Side B cannot see how the system functions *with* it, given current constraints.

  ### 2. Evaluating Your Test

  Your proposed test is: *Hold the relational structure fixed... and re-describe it in the vocabulary of something legal and documented in a rich democracy.*

  **Verdict:** This test will likely fail to separate the cases, but **the reason for its failure is the diagnostic data you need.**

  **Why it fails:**
  1.  **Side A will reject the output:** If you re-describe a bribe as a "campaign contribution," Side A (increasingly) will say, "Exactly! That is also corruption." They will argue that the legibility effect you identified (Layer 3) has blinded *them* too, and that the West is also corrupt, just more legibly. This validates your "legibility" hypothesis but doesn't solve the normative dispute.
  2.  **Side B will reject the input:** They will argue you cannot hold the relational structure fixed while changing the systemic context. A campaign contribution in the US occurs against a backdrop of independent courts, free press, and competitive elections. A bribe in a weak state occurs where the bribe *is* the court, the press, and the election. The *dyad* (giver/receiver) looks the same, but the *system* constraining them is different. Side B will argue that the "function" (Layer 1) is not the transfer itself, but the transfer's role in maintaining order *in that specific vacuum*.

  **What the failure tells us:**
  If both sides reject the test, it confirms that the dispute is not about the **micro-structure of exchange** (the bribe vs. the donation) but about the **macro-structure of enforcement** (the rule of law vs. the rule of men). The disagreement is not about the transaction; it is about the counterfactual stability of the system if the transaction were banned.

  ### 3. What Counts as Progress?

  Given that the empirical counterfactual (banning patronage tomorrow) is unethical and impossible to observe, and the conceptual dispute is bedrock, you should not expect a "verdict" that declares one side right. Progress lies in **dissolving the binary** and identifying **transition mechanisms**.

  Here is what would constitute actual progress, ranked by feasibility:

  **A. The "Critical Juncture" Case Study (High Value)**
  Instead of asking "Is this corruption?", look for historical or contemporary cases where a state transitioned from particularism to universalism *without* collapsing.
  *   *The Question:* How did the patronage network get replaced? Did it get criminalized (Side A's approach) or did it get formalized (e.g., patronage jobs became civil service jobs)?
  *   *The Signal:* If you find cases where patronage was *co-opted* into state building (e.g., 19th-century US machine politics evolving into modern administration, or Botswana's cattle networks), you validate Side B's functionalism while acknowledging Side A's end-goal. This shifts the debate from "Eradicate vs. Accept" to "How do we migrate the function?"

  **B. The "Boundary Condition" Prediction (Medium Value)**
  A preregistered prediction that discriminates substitute from cause is difficult, but you can predict **thresholds**.
  *   *The Hypothesis:* Patronage is functional (Side B) below a certain GDP/capacity threshold, but becomes parasitic (Side A) above it.
  *   *The Test:* Identify the tipping point where the transaction costs of clientelism exceed the transaction costs of impersonal bureaucracy.
  *   *Progress:* If you can identify *when* the network switches from being a substitute to a cause of weakness, you give policymakers a timeline. You tell Side A: "You are right, but not yet." You tell Side B: "You are right, but not forever."

  **C. A Change of Question (Highest Value)**
  The most productive move is to stop asking "Is this corruption?" and start asking **"What is the friction cost of this allocation mechanism?"**
  *   *The Shift:* Acknowledge that all systems run on particularism (as your legibility point notes). The difference is not the presence of relational allocation, but the **marginal cost** of that allocation on public goods.
  *   *The Metric:* Instead of a corruption index, measure the **divergence between private return and social cost**.
      *   In a "good" system (lobbying), the private return might be high, but the social cost is mitigated by competition/regulation.
      *   In a "bad" system (bribery), the private return is high, but the social cost is total exclusion of non-payers.
  *   *Why this works:* It bypasses the moralizing. It allows Side A to measure inefficiency (their core concern) without requiring Side B to admit to a moral failing. It treats corruption as a **market failure** rather than a **sin**.

  ### Summary

  You should expect no progress if you continue to frame this as a moral or definitional dispute. The stalemate persists because Side A is arguing from a **normative ideal** (what the state *should* be) and Side B is arguing from a **survival constraint** (what the state *can* be).

  The diagnosis is that this is a **disagreement about transition paths**, disguised as a disagreement about definitions.

  **The path forward:**
  1.  Accept the "Legibility Effect" as a confounder that invalidates cross-country corruption indices (conceding ground to Side B).
  2.  Accept that impersonal administration is the only scalable model for complex economies (conceding ground to Side A).
  3.  Focus research entirely on the **mechanisms of formalization**: How do we turn the "gift" into the "contract" without breaking the social trust that the gift was sustaining?

  If you can find a case where a patron-client tie was successfully converted into a formal credit or insurance instrument without a collapse in service delivery, you will have done more than solve the argument; you will have provided a roadmap for development. Until then, the argument will not move, because both sides are describing half of an elephant.
