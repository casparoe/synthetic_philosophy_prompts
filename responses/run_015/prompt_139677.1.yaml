      *   The prompt asks to *take priors away*. "The mechanic I care most about takes their priors away."
      *   *Implementation:* In the "Dormant" round, the hypothesis $H$ is introduced *after* the evidence $E$ is established as common knowledge. They never submit a prior slip for $H$ *before* knowing $E$.
      *   *Conflict:* If they never submit a prior, how do they show they *can't* update?
      *   *Solution:* They are asked to set a price for $H$ *given* $E$. Then they are asked: "By how much did $E$ increase your confidence?" They will want to say "It increased it." But they must admit $P(E)=1$.
      *   *Better approach for the "Amnesia":* Collect "Theoretical Viability" priors *before* the specific evidence connection is made explicit.
      *   *Wait, let's look closer at the prompt's "Prior Amnesia":* "Knowing E while having lost the ability to reconstruct what they thought before E."
