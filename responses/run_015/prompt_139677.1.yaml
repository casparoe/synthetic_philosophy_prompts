answer: |-
  ## Executive Summary: Load-Bearing Choices & Critical Warnings

  Before the design, I must address your constraints frankly.

  1.  **Prior Amnesia:** This is a **red herring for the logical problem, but essential for the psychological one.** Logically, the Problem of Old Evidence (POE) arises because $P(E)=1$, making $P(H|E) = P(H)$. It does not require forgetting your prior in $H$. However, your "Prior Amnesia" mechanic (introducing $H$ after $E$ is established fact) perfectly simulates the *historical* situation of Einstein and Mercury. It forces students into the position of having no "pre-E" betting slip to compare against. **Verdict:** Keep it, but in the debrief, clarify that it simulates the *temporal* unavailability of the prior, not the *logical* impossibility of the update.
  2.  **Stale vs. Dormant:** This distinction **collapses formally but holds pragmatically.** In standard Bayesianism, both cases yield $P(E)=1$, so neither confirms $H$. However, human intuition screams that Dormant evidence confirms *more strongly* because the entailment was a discovery, not a checklist item. The activity will likely show the market pricing Dormant higher than Stale. **Verdict:** Use this divergence to show where formal epistemology fails to capture scientific practice.
  3.  **Market + Scoring:** This is the **right vehicle**, but with a risk. Markets measure *consensus confidence*, not *confirmation*. If the market price for $H$ rises in the Dormant round, is it because $E$ confirms $H$, or because students feel $H$ is "elegant"? **Mitigation:** The payoff must depend strictly on the *truth* of $H$, not its explanatory power. This forces them to distinguish "I like this theory" from "I think this theory is true."

  **What would change my mind?** If, during the pilot, students treat the "Known Fact" as uncertain (i.e., they assign $P(E) = 0.99$ to allow updating), the activity fails. You must enforce $P(E)=1$ as a rule of the game world. If they cannot be stopped from "uncertifying" the evidence, the scoring rule is the wrong vehicle; a purely qualitative argument mapping would be better.

  ---

  ## Materials List

  *   **The Box:** An opaque container holding 4 playing cards (face down).
  *   **The Board:** Whiteboard divided into "Stale Round" and "Dormant Round."
  *   **Betting Slips:** 28 slips (2 per student per round). Pre-printed with: *Hypothesis, Credence (0-100%), Signature.*
  *   **Market Shares:** 28 physical tokens (14 per round), labeled "Theory Share."
  *   **Currency:** Play money (or points tracked on board).
  *   **Handout:** Payoff Scheme & Scoring Rule (see below).
  *   **Timer:** Visible countdown.

  ## Payoff Scheme (Handout)

  **1. Individual Accuracy (Quadratic Scoring Rule)**
  *   At the end of class, the Box is opened. Truth is revealed.
  *   For each Hypothesis you bet on:
      *   If **TRUE**: You earn $10 \times (1 - (1 - \text{your credence})^2)$
      *   If **FALSE**: You earn $10 \times (1 - (0 - \text{your credence})^2)$
  *   *Simplified Mental Math:*
      *   Credence 100% & True = \$10.
      *   Credence 100% & False = \$0.
      *   Credence 50% = \$7.50 (regardless of truth).
      *   Credence 0% & False = \$10.

  **2. Market Trading**
  *   Each "Theory Share" pays \$10 if the Hypothesis is **TRUE**, \$0 if **FALSE**.
  *   You may buy/sell shares during the trading window.
  *   **Profit** = (Payout Price - Your Buy Price) $\times$ Quantity.

  **3. The "Known Fact" Rule**
  *   Evidence $E$ is written on the board at $t=0$.
  *   **Rule:** For the purpose of this game, $P(E) = 1$. You are not permitted to bet on $\neg E$. You cannot update on $E$ because $E$ is not new information.

  ---

  ## Minute-by-Minute Timeline (110 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute handouts. Explain Payoff. **Write Evidence $E$ on Board.** (Do not explain relevance yet). |
  | **10-40** | **Round 1 (Stale)** | Introduce $H_{Stale}$. Students submit Credence Slips. **Trading Window (10 mins).** Collect Slips (do not return). |
  | **40-50** | **Intermission** | Shuffle slips. Reset market. **Do not reveal Box contents.** |
  | **50-80** | **Round 2 (Dormant)** | Introduce $H_{Dormant}$. Students submit Credence Slips. **Trading Window (10 mins).** Collect Slips. |
  | **80-90** | **The Trap** | Ask students to compute Likelihood Ratios for both rounds on scratch paper. |
  | **90-110** | **Debrief** | Reveal Box. Pay off. Discuss the gap between Market/Intuition and Math. |

  *(Note: The 50-minute follow-up session is reserved if the Debrief runs long or if you need to re-run the Dormant round with modified rules to test a specific escape.)*

  ---

  ## Activity Rules & Case Design

  ### The System (Closed & Enumerable)
  *   **The Box:** Contains 4 cards drawn from a standard deck.
  *   **Evidence $E$ (Written on board at $t=0$):** "Card #1 is a King."
      *   *Constraint:* This is a **Known Fact**. $P(E) = 1$.
      *   *Verification:* You (the instructor) peeked at Card #1 before class. It is a King.

  ### Round 1: Stale Evidence
  *   **Hypothesis $H_{Stale}$:** "The Box contains at least two Kings."
  *   **Context:** Before class, tell students: "We are testing for Kings today." They know $E$ is relevant to $H_{Stale}$ before they enter the room.
  *   **Task:**
      1.  Submit Credence Slip for $H_{Stale}$.
      2.  Trade Shares of $H_{Stale}$.
      3.  **Constraint:** You know $E$. You know $H_{Stale}$ is about Kings.
  *   **Expected Math:** $P(E|H_{Stale})$ is high. $P(E|\neg H_{Stale})$ is lower. But since $E$ is known, standard conditionalization is blocked. However, because the relevance was known *ex ante*, students usually accept the block more easily.

  ### Round 2: Dormant Evidence (The Core Mechanic)
  *   **Hypothesis $H_{Dormant}$:** "The Box is a 'Royal Set' (All 4 cards are Face Cards)."
  *   **Context:** Students knew $E$ ("Card #1 is a King") from $t=0$. They did **not** know $H_{Dormant}$ existed until $t=50$.
  *   **The "Prior Amnesia" Mechanic:**
      1.  At $t=50$, announce $H_{Dormant}$.
      2.  Ask for Credence Slips *immediately*.
      3.  **Crucial Step:** Ask students: "How much did seeing $E$ increase your confidence in $H_{Dormant}$?"
      4.  They will want to say "A lot!"
      5.  Ask: "Show me your prior slip for $H_{Dormant}$ *before* you knew $E$."
      6.  **They cannot.** The slip does not exist. $H_{Dormant}$ was not in the hypothesis space when $E$ was established.
  *   **Task:** Submit Credence. Trade Shares.
  *   **Expected Intuition:** Students will price $H_{Dormant}$ higher than $H_{Stale}$ because $H_{Dormant}$ *explains* $E$ (Kings are Face Cards), whereas $H_{Stale}$ just accommodates it.

  ---

  ## Predicted Failures & Mitigations

  **1. The "Uncertifying" Rebellion**
  *   **Failure:** A student argues, "But the card *could* have been something else, so $P(E) < 1$."
  *   **Fix:** Enforce the "Game World" rule. "In this seminar, $E$ is an axiom. If you bet on $\neg E$, your payoff is automatically 0." This forces the POE to emerge from the rules, not your lecture.
  *   **Load-Bearing:** If you allow them to treat $E$ as uncertain, the activity collapses.

  **2. Market Dominance (The Loud Two)**
  *   **Failure:** Two confident students set the market price, silencing the others.
  *   **Fix:** Use **Anonymous Limit Orders**. Students write "Buy 1 share @ \$X" on a slip. You match them. This prevents vocal dominance and reveals the true distribution of credence.
  *   **Mitigation:** If the market is thin, act as the Market Maker with a fixed spread to ensure liquidity.

  **3. Betting on Entailment**
  *   **Failure:** Students bet on $H_{Dormant}$ because "It entails E," confusing logical consistency with empirical truth.
  *   **Fix:** In the Debrief, reveal the Box. If $H_{Dormant}$ is false (e.g., Card #2 is a 7), those who bought high lose money. This punishes "explanatory beauty" that doesn't match reality.
  *   **Warning:** Ensure the Box contents are pre-set such that $H_{Dormant}$ is actually *false* or *uncertain*, so the payout isn't guaranteed. (e.g., Box = K, 7, Q, J). $E$ is true. $H_{Dormant}$ is false. This creates maximum tension: $E$ supports $H$, but $H$ is false.

  **4. Prior Amnesia Confusion**
  *   **Failure:** Students say, "I just imagine what I would have thought."
  *   **Fix:** "You are not paid on counterfactuals. You are paid on the slips you submitted. You have no pre-E slip for $H_{Dormant}$. You cannot compute the ratio."

  ---

  ## Debrief Guide: Mapping Moments to Arguments

  **1. The Market Gap (Minutes 90-95)**
  *   **Observation:** Compare the closing market price of $H_{Stale}$ vs. $H_{Dormant}$.
  *   **Argument:** "The market priced Dormant higher. Why? Formally, $P(E)=1$ in both cases. The Likelihood Ratio should be 1. The math says no confirmation. Your wallets say yes."
  *   **Point:** This isolates the intuition of confirmation from the formal machinery.

  **2. The Missing Slip (Minutes 95-100)**
  *   **Observation:** Ask for the Round 2 Prior Slips. (None exist).
  *   **Argument:** "You cannot calculate $P(H|E)/P(H)$ because the denominator is missing. This is **Prior Amnesia**. In real science, we often formulate theories after data exists. We literally do not have the pre-data prior."
  *   **Point:** This validates the "Prior Amnesia" mechanic as a simulation of historical scientific practice, even if it's not the *logical* source of POE.

  **3. Stale vs. Dormant (Minutes 100-105)**
  *   **Observation:** Did students feel more justified in Round 2?
  *   **Argument:** "In Round 1 (Stale), $E$ was a test. In Round 2 (Dormant), $E$ was a clue. The distinction collapses in Bayes (both are $P(E)=1$), but it matters for **Inference to the Best Explanation**."
  *   **Point:** The distinction is pragmatic, not probabilistic. It suggests we need a hybrid model (Bayes + Explanation).

  **4. Standard Escapes (Minutes 105-110)**
  *   **Escape A (Counterfactual Uncertainty):** "Pretend you didn't know $E$."
      *   *Moment:* When students tried to "uncertify" the King.
      *   *Cost:* It's fiction. You *did* know.
  *   **Escape B (Learning the Entailment):** "You didn't learn $E$, you learned $H \rightarrow E$."
      *   *Moment:* When $H_{Dormant}$ was announced.
      *   *Cost:* Requires a logic-aware probability function (Garber-style). Did anyone bet on the *entailment*? No, they bet on the *Theory*.
  *   **Escape C (Empirical Bayes/Reassignment):** "Just assign a new prior."
      *   *Moment:* When they submitted Round 2 slips.
      *   *Cost:* Abandons conditionalization. It's ad hoc.

  ---

  ## Critical Analysis: Where This Design Might Fail

  **1. The "Prior Amnesia" Weak Link**
  *   **Critique:** You asked me to build the mechanic so they *cannot* reconstruct the prior. I have done this by introducing $H$ after $E$. However, a sharp student will note: "I can reconstruct a counterfactual prior. I can imagine what I would have believed before I saw the King."
  *   **Risk:** If they do this, the tension evaporates. They will say, "Okay, my counterfactual prior was 10%, now it's 50%."
  *   **Mitigation:** You must block counterfactuals in the rules. "You are paid on *actual* slips submitted. No counterfactual scoring." This forces them to sit with the *actual* absence of the data point.
  *   **Honest Assessment:** Prior Amnesia is the weakest link. It creates a *record-keeping* problem, not a *probabilistic* problem. If you want the *probabilistic* problem, you must enforce $P(E)=1$ strictly. If you want the *historical* problem, Prior Amnesia is perfect. **I recommend framing it as the Historical Problem in the debrief.**

  **2. The Market as a Confounder**
  *   **Critique:** Markets aggregate information. If the "information" is that $H$ explains $E$, the price will rise. This might make students think Bayes *works* (because the price moved), obscuring the fact that *conditionalization* didn't move it.
  *   **Risk:** They leave thinking "Bayes explains why the price moved."
  *   **Mitigation:** In the debrief, explicitly calculate the Bayesian Update on the board using their average credences. Show that $P(H|E) \approx P(H)$. Contrast this with the Market Price. The **gap** is the lesson.

  **3. What Would Convince Me Scoring/Market is Wrong?**
  *   If the students treat the "Known Fact" $E$ as a *condition* rather than a *certainty*. If they naturally say "Given E, what is P(H)?", they are doing conditionalization correctly ($P(H|E)$). The POE arises when they try to update *on* $E$.
  *   **Correction:** Ensure the prompt asks: "Does $E$ **confirm** $H$?" not "What is $P(H)$ given $E$?" The market asks for the latter (price = current credence). The debrief must ask the former (did the price move *because* of $E$?).
  *   **Alternative:** If the market becomes too noisy, switch to a **Prediction Market on the Entailment**. "Bet on whether $H$ entails $E$." This isolates the logical discovery from the empirical truth. If I were to change one thing, I would add a side-market on "Does H entail E?" to separate the logical discovery from the empirical update.

  ## Final Recommendation

  Run the activity as designed, but **lean heavily into the "Historical vs. Logical" distinction in the debrief.**
  *   **Logical POE:** $P(E)=1$ blocks update. (The Math).
  *   **Historical POE:** $H$ didn't exist when $E$ was learned. (The Amnesia).
  *   **Your Activity:** Solves the Historical feeling, exposes the Logical block.

  If the students leave feeling frustrated that they *know* $H$ is better but *can't show it with the math*, you have succeeded. That frustration is the Problem of Old Evidence.
