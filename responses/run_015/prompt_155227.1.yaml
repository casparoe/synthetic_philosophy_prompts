  | Circular reliability assessment | tuning reclassification | accuracy | fatal | Specify an independence constraint for measuring "tracking improvement" that does not rely on the contested perceptual outputs. |
  | Empirical overreach | tuning reclassification | accuracy | minor | Qualify the claim about "great majority" of examples; admit empirical uncertainty per your friend's warning. |

