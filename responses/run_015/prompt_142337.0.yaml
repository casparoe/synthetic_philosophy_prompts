prompt: |-
  I'm on the benefits committe at work — there's five of us, at a company of about 70 people, and we're the ones who decide what our self-funded health plan actually pays for. The plan document is from like 1994 and says it covers treatment of disease or injury and doesn't cover cosmetic, lifestyle, or elective enhancement stuff. Years ago our broker told us to write ourselves a one sentence test for what counts as a disease, because otherwise we'd argue about it forever. The test we came up with, and have used ever since, is basically this: it's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble.

  I always thought that was pretty reasonable. This month we had three appeals and now I think it's either wrong or I'm applying it wrong, and I keep flip-flopping between the two.

  1) Marcus, 58, drives a forklift. His testosterone came back in the low-normal range for men his age. He says he's wiped out all the time, no sex drive, can't concentrate. His doctor put him on replacement therapy and he says he got his life back. We denied it: nothing in him is working worse than normal, he's just getting older. But his supervisor says Marcus is a different guy since the shots. His age is doing all the work in that sentence and I don't know why age gets to do that.

  2) Priya, 34, in accounting. Her husband died in a crash seven weeks ago. She's sleeping three hours a night, lost a lot of weight, can't get through a spreadsheet, and she's asking for short term disability plus coverage for an intensive outpatient program. Our behavioral health vendor says this is normal grief, not a diagnosis, so the program isn't covered; the disability people say they can't approve leave without a diagnosed condition. She's obviously in real trouble and I can't point to anything in her that's malfunctioning.

  3) Sam, 41, warehouse. Type 2 diabetes, heavy, drinks most nights, needs bariatric surgery. One of our members said flat out that this isn't a disease, it's a lifestyle, and we shouldn't pay for it. Same guy voted yes last month on knee surgery for someone who blew out his knee playing pickup basketball. When I pointed that out he said that's different, you can't help getting hurt playing ball. I have no idea whether that's a real distinction or if we're just punishing Sam.

  On top of all this, Denise on the committee wants to change the test from a healthy person of your age and sex to someone like us, because most of the warehouse works night shift and half of us are carrying extra weight, and if we say healthy person then suddenly everybody's sick. I feel like that makes things worse, not better, but I can't say why.

  So: is there a better one sentence test? Or is the whole idea of a one sentence test hopeless, and if it is, what do I actually say at the meeting on Thursday?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **Role:** Member of a 5-person benefits committee at a self-funded company (70 employees).
      *   **Task:** Deciding what the health plan covers based on a 1994 plan document (covers disease/injury, excludes cosmetic/lifestyle/elective).
      *   **Current Tool:** A "one-sentence test" created years ago based on broker advice: *"It's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble."*
      *   **Current Crisis:** Three recent appeals (Marcus, Priya, Sam) are challenging the validity or application of this test. A committee member (Denise) wants to change the comparator ("healthy person" to "someone like us").
      *   **User's Feeling:** Flip-flopping, feels the test might be wrong or misapplied, suspects Denise's suggestion makes things worse but can't articulate why, needs advice for Thursday's meeting.
      *   **Stakes:** High. Real money, real health outcomes, fairness, legal/compliance risk (ERISA, ACA, HIPAA, etc.), employee morale.

  2.  **Deconstruct the Current Test:**
      *   *Test:* "Working worse than it normally works in a healthy person of your age and sex" + "causing real trouble."
      *   *Strengths:* Simple, intuitive, focuses on function.
      *   *Weaknesses:*
          *   **Age/Sex Normalization:** Accepts decline as "normal" (Marcus). Is low T at 58 a disease or aging? Medicine debates this.
          *   **Acute vs. Chronic/Environmental:** Doesn't handle situational trauma well (Priya). Grief isn't a "malfunction" but can be disabling.
          *   **Moral Judgment/Lifestyle:** Struggles with conditions linked to behavior (Sam). Diabetes is a disease, but obesity is often stigmatized as lifestyle.
          *   **Denise's Proposal:** Changing "healthy person" to "someone like us" (night shift, overweight) essentially lowers the bar for health to the current workforce average. This creates a "race to the bottom" where prevalent conditions become "normal" and thus uncovered, or conversely, everyone is considered sick. It destroys the objective standard.

  3.  **Analyze the Three Cases:**
      *   **Marcus (Testosterone):**
          *   *Issue:* Is age-related decline a disease?
          *   *Medical Consensus:* Hypogonadism is a disease. "Andropause" is controversial. Low-normal T + Symptoms = Treatment often indicated.
          *   *Test Failure:* The test says "healthy person of your age." A healthy 58-year-old *might* have lower T than a 20-year-old. But if it causes dysfunction, is it covered? The committee denied it based on "just getting older," but the functional improvement suggests a deficit existed.
      *   **Priya (Grief/Disability):**
          *   *Issue:* Grief vs. Depression/Adjustment Disorder.
          *   *Medical Consensus:* Normal grief isn't a disease. Complicated grief or Major Depressive Disorder triggered by loss *is*.
          *   *Test Failure:* "Part of you working worse." Grief isn't a malfunction; it's a reaction. But if it prevents work (disability), the plan needs a mechanism to handle it. Denying *all* help because it's "normal grief" ignores the possibility of it becoming pathological.
      *   **Sam (Bariatric Surgery):**
          *   *Issue:* Disease vs. Lifestyle choice.
          *   *Medical Consensus:* Obesity is a chronic disease (AMA, CDC, etc.). Bariatric surgery is standard treatment for BMI > 40 or > 35 with comorbidities (like T2 Diabetes).
          *   *Test Failure:* Committee member applying moral judgment ("can't help getting hurt" vs. "lifestyle"). The test doesn't account for the *cause* of the dysfunction, only the dysfunction itself. Diabetes is a dysfunction. Surgery treats the dysfunction.

  4.  **Evaluate Denise's Proposal:**
      *   *Idea:* Compare to "someone like us" (night shift, overweight).
      *   *Problem:* This creates a relativistic standard. If 50% of the warehouse is obese, is obesity "normal" for this group? If so, does it stop being a disease? Or does it mean everyone is sick?
      *   *Legal/Compliance Risk:* Self-funded plans are subject to ERISA and ACA. Discrimination based on health status or lifestyle factors can be tricky. Defining "health" based on the specific workforce's poor health metrics is actuarially unsound and potentially discriminatory.
      *   *Verdict:* User is right to feel this is worse. It removes the objective medical standard.

  5.  **Develop a Strategy for the Meeting:**
      *   **Acknowledge the Limit:** A one-sentence test is *too simple* for complex medical ethics. It was a stopgap, not a policy.
      *   **Propose a Framework, Not a Soundbite:** Move from a "test" to "guiding principles" or "criteria."
      *   **Address the Cases Specifically:**
          *   Marcus: Focus on *symptomatic relief* and *functional impairment*, not just lab numbers vs. age.
          *   Priya: Distinguish between *grief* (uncovered) and *diagnosed mental health condition* (covered). Need a diagnosis code.
          *   Sam: Rely on *medical guidelines* (ASMBS, ADA), not moral judgment. Obesity/T2D is a disease.
      *   **Address Denise:** Explain why "someone like us" is dangerous (normalizes sickness, legal risk).
      *   **The "Better Test":** If a test is absolutely required, it needs to reference *medical necessity* and *accepted standards of care*, not just "healthy person."
      *   **The Real Solution:** The committee shouldn't be practicing medicine. They need to rely on the Plan Administrator (often a third party) or medical guidelines.

  6.  **Drafting the Response:**
      *   *Tone:* Empathetic, professional, authoritative but collaborative. Acknowledge the difficulty.
      *   *Structure:*
          1.  Validate the user's intuition (The test is broken).
          2.  Analyze why the test fails (The three cases).
          3.  Address Denise's idea (Why it's risky).
          4.  Propose a new approach (Principles + Medical Standards).
          5.  Provide a script/talking points for Thursday.
      *   *Key Insight:* The committee is acting as a claims adjudicator without medical training. This is a fiduciary risk. They need to defer to *medical necessity* defined by current standards, not 1994 definitions or gut feelings.

  7.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Caution:* I am an AI, not a lawyer or ERISA expert. Must include a disclaimer.
      *   *Specifics:* The 1994 plan document is a constraint. They can't just ignore it. They need to interpret "disease or injury" using *current* medical definitions, not 1994 ones.
      *   *Priya's Case:* Short-term disability (STD) and Health Plan are often different buckets. Need to clarify that. STD usually requires a diagnosis.
      *   *Marcus:* TRT is controversial. The key is "Hypogonadism" diagnosis, not just "low T."
      *   *Sam:* Bariatric surgery is usually covered if specific criteria (BMI, comorbidities) are met. It's not about "lifestyle," it's about "medical necessity."

  8.  **Final Polish:** Ensure the "One Sentence Test" replacement is actually usable but acknowledges complexity. Actually, the best advice is to *abandon* the one-sentence test in favor of a "Medical Necessity" standard based on current guidelines.

      *   *Revised Plan:*
          1.  Validate: The test is outdated.
          2.  Case Analysis: Show how the test fails each.
          3.  Denise: Explain the "Reference Class Problem."
          4.  Solution: Adopt "Medical Necessity" based on current standards of care.
          5.  Meeting Script: How to say it without sounding like a know-it-all.

  9.  (Final Check against Safety Guidelines): No medical advice given. No legal advice given. Focus on process and policy.

      *   *Wait, one nuance:* The user asked "Is there a better one sentence test?" I should answer that directly, even if the real answer is "No, you need a framework." I will offer a refined sentence but emphasize it's insufficient.
      *   *Refined Sentence:* "Coverage is provided for treatments deemed medically necessary by current standards of care to restore or maintain functional health, excluding purely cosmetic or experimental interventions." (A bit dry, but accurate).
      *   *Better:* "Does current medical consensus classify this condition as a disease and this treatment as medically necessary to restore function?"

      *   *Let's stick to the core issue:* The committee is making medical judgments they aren't qualified to make. The advice should steer them toward relying on external medical criteria.

      *(Self-Correction during drafting)*: I need to be careful not to tell them exactly how to rule on these specific cases (that's legal/medical advice), but rather how to *evaluate* the cases.

      *Okay, ready to write.*
answer: |-
  This is a incredibly difficult position to be in, and your intuition is spot on: **The one-sentence test is broken.**

  It was a useful heuristic for a while, but it was never a policy. It was a broker's band-aid to stop arguments, not a fiduciary standard. Now that you are facing complex, modern medical ethics, the band-aid has peeled off.

  Here is the breakdown of why the test is failing, why Denise's suggestion is dangerous, and exactly what you should propose at the meeting on Thursday.

  ### 1. Why the Current Test Fails
  Your test relies on a "Healthy Person of Your Age and Sex" comparator. This fails in all three cases because modern medicine has moved past that simplistic model.

  *   **Marcus (Testosterone):** The test asks, "Is this normal for a 58-year-old?" Medically, "common" does not mean "healthy." If a 58-year-old has symptoms of hypogonadism and labs to match, treating him restores function. By denying this because "age does the work," you are defining aging *itself* as a non-covered condition, even when it manifests as a treatable hormonal deficiency. You are penalizing him for the number 58.
  *   **Priya (Grief):** The test asks, "Is a part of her malfunctioning?" Grief is not a malfunction; it is a human response. However, *disability* is functional. If she cannot work, she meets the functional criteria for disability, but the health plan requires a *diagnosis*. The test conflates "disease" with "suffering." She likely needs an Adjustment Disorder or MDD diagnosis to qualify, not just "grief." The test doesn't help you navigate the line between normal human pain and treatable pathology.
  *   **Sam (Bariatric):** The test asks, "Is this lifestyle or disease?" This is a moral judgment, not a medical one. The American Medical Association and CDC classify obesity as a chronic disease. Type 2 Diabetes is unequivocally a disease. The committee member is applying a "moral hazard" filter (he chose to eat/drink) that they aren't applying to the knee injury (he chose to play basketball). The test doesn't protect you from bias; it invites it.

  ### 2. Why Denise's Idea is Dangerous
  Denise wants to change the comparator from "Healthy Person" to "Someone Like Us" (night shift, overweight). **You are right to feel this makes things worse.** Here is why, in plain English you can use at the meeting:

  1.  **It Normalizes Sickness:** If 50% of the warehouse has high blood pressure, and we compare new patients to "someone like us," then high blood pressure becomes the "normal" baseline. That could technically give you grounds to deny coverage for hypertension meds because "that's how people like us work."
  2.  **It Creates Legal Risk:** Self-funded plans are subject to ERISA and ACA regulations. Defining health benefits based on the specific demographic quirks of your current workforce could be viewed as discriminatory or actuarially unsound. You need an objective medical standard, not a relative workforce standard.
  3.  **It Lowers the Bar:** It implies that because our workforce is tired and overweight, we shouldn't expect them to be healthy. It removes the incentive for the plan to support wellness.

  ### 3. The Solution: Abandon the "Test," Adopt a "Standard"
  You cannot reduce medical necessity to one sentence. You need a **Decision Framework.**

  The 1994 plan document says "treatment of disease." You cannot change that. But you *can* define how you interpret "disease" and "treatment." You should stop trying to be doctors and start deferring to **Current Standards of Care.**

  **The Proposal for Thursday:**
  Suggest that the committee adopts a policy of deferring to **external medical guidelines** for coverage decisions, rather than internal gut checks.

  **The New "Test" (If you must have one):**
  > *"Coverage is determined by whether the condition is recognized as a disease by major medical associations and the treatment is deemed medically necessary by current standards of care to restore functional capacity."*

  This shifts the burden from *your committee's opinion* to *medical consensus.*

  ### 4. How to Handle the Three Cases (Guidance, not Rulings)
  *Note: I am an AI, not a lawyer or claims administrator. These are policy perspectives, not claims determinations.*

  *   **Marcus:** Don't decide if he's "old." Decide if he has a diagnosis of **Hypogonadism**. If his doctor diagnoses a hormonal deficiency and guidelines support TRT for that diagnosis, it is a "treatment of disease." If he just has "low normal T" with no diagnosis, it may be lifestyle. The distinction is the *diagnosis code*, not the age.
  *   **Priya:** Separate the buckets.
      *   *Health Plan:* Covers treatment of disease. "Grief" is not a disease code. "Major Depressive Disorder" or "Adjustment Disorder" *is*. If her provider submits a diagnosis code, the intensive outpatient program should be reviewed based on medical necessity for *that diagnosis*, not the cause of the grief.
      *   *Disability:* STD usually requires a diagnosis that prevents work. If she has no diagnosis, she doesn't qualify for STD, but she might qualify for unpaid FMLA leave. The plan shouldn't pay for "grief," but it should pay for "depression" if diagnosed.
  *   **Sam:** This is the easiest one legally. Obesity with comorbidities (Diabetes) is a disease. Bariatric surgery is a standard, accepted treatment for BMI > 40 or > 35 with comorbidities. The committee member's opinion on "lifestyle" is irrelevant against the **American Society for Metabolic and Bariatric Surgery** guidelines. If Sam meets the guidelines, it's covered. If you deny it, you open the company to legal risk for denying standard care for a recognized disease.

  ### 5. What to Say at the Meeting (Script)
  You need to be diplomatic but firm. You are protecting the committee from liability as much as you are helping employees.

  **Opening:**
  "I've been reviewing our appeals process, and I'm concerned that our 'one-sentence test' is creating more risk than it solves. It's asking us to make medical judgments we aren't trained to make, and it's leading to inconsistent decisions."

  **On Denise's Point:**
  "Denise, I understand wanting to be realistic about our workforce. But if we set our health standard to 'someone like us,' we risk normalizing chronic conditions. If half the warehouse has back pain, does that mean back pain becomes 'normal' and we stop covering it? We need an objective medical standard, not a relative one."

  **On the Cases:**
  "Looking at Marcus, Priya, and Sam: We are arguing about whether something is a 'disease.' But medicine has changed since 1994. Obesity is now classified as a disease. Hormonal deficiencies are treatable regardless of age. Grief isn't covered, but Depression is.
  Instead of us guessing, we should adopt a policy: **We follow current medical guidelines.** If a treatment is standard of care for a diagnosed condition, we cover it. If it's experimental or cosmetic, we don't. This protects us from accusations of bias."

  **The Ask:**
  "I propose we pause these three appeals. We ask our broker or the Third Party Administrator (TPA) to review them against current medical guidelines, not our 1994 document or our personal opinions. And going forward, we adopt a 'Medical Necessity' standard based on external guidelines, not our internal test."

  ### Summary
  The one-sentence test is hopeless because medicine is not one sentence.
  *   **Don't** try to fix the sentence.
  *   **Do** fix the process.
  *   **Do** defer to medical guidelines (AMA, CDC, Specialty Boards).
  *   **Do** protect the committee from making moral judgments on lifestyle vs. disease.

  Your job on the committee isn't to decide what is healthy; it's to decide if the plan is following its own rules based on *current* definitions of disease. Let the doctors define the disease; you just define the coverage rules.
