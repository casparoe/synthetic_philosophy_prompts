  Hey, good running into you. Yeah, I've been thinking about that seminar syllabus. Here's those brainstorming points we talked about, plus the draft question. I threw in a couple of typos cause I'm typing this on my phone while waiting for coffee.

  **Three Distinct Divergences in Folk Morality**

  1.  **Weight of Mental States vs. Outcomes:** WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations heavily privilege intent over outcome (attempted murder > accidental manslaughter). Many small-scale societies judge based on outcome severity regardless of intent, often due to different theories of causation or spiritual contamination.
  2.  **Scope of the Moral Community:** Some cultures draw the circle of moral concern tightly around kin or caste, where obligations to outsiders are negligible or purely prudential. Others operate with a universalist framework where distant strangers hold intrinsic moral weight.
  3.  **Foundations of Obligation:** Divergence in whether norms are grounded in harm/fairness (individualizing) versus loyalty/authority/purity (binding). In some contexts, violating a purity norm (e.g., food taboo) is judged more harshly than interpersonal harm, flipping the typical Western hierarchy.

  ***

  **Exam Question Draft**

  **Question 4**
  Consider the following hypothetical ethnographic finding regarding the Kaelo, a small-scale horticulturist society: In resource-conflict scenarios, Kaelo judges assign *higher* blame and stricter punishment for accidental harm than for intentional harm. Their rationale is that intentional harm signals strong alliance with one's kin group (a normative good), whereas accidental harm signals individual negligence and lack of situational awareness (a threat to collective survival).

  (a) Explain why this finding supports Descriptive Relativism but does not logically entail Normative Anti-Realism.
  (b) Assess whether a standard Control Principle for moral responsibility (that agents are only responsible for factors within their voluntary control) can be maintained in light of this finding without becoming self-undermining or vacuous.

  ***

  **Model Answer**

  The Kaelo case presents a striking inversion of Western folk psychology, yet it requires careful metaethical unpacking. First, we must distinguish the descriptive from the normative. Descriptive Relativism is the empirical claim that moral beliefs and practices vary across cultures. The Kaelo finding clearly supports this; their blame allocations differ statistically from Western populations. However, Normative Anti-Realism is the metaphysical claim that there are no objective moral truths independent of human opinion. The existence of divergence does not prove the absence of truth. Just as divergent beliefs about astronomy do not imply there is no fact of the matter regarding planetary motion, divergent blame practices do not prove there is no objective fact about culpability. One culture could simply be mistaken, or both could be applying a universal principle to different empirical constraints.

  The deeper challenge lies in the Control Principle. Standard accounts hold that moral responsibility requires control over the action or its consequences. Typically, intentional acts are viewed as having higher voluntary control than accidents. If the Kaelo blame accidents more, are they violating the Control Principle? Not necessarily. They may operate with a different empirical theory of control. In a high-stakes survival context, 'control' might be defined as maintaining situational awareness rather than merely willing an outcome. An agent cannot always control whether a spear hits a target (outcome luck), but they can control their vigilance. If the Kaelo view vigilance as the primary locus of control, their judgment aligns with the Control Principle, even if the output differs from Western judgments.

  However, if the Kaelo explicitly admit that the accidental agent had *less* voluntary control over the specific harm yet blame them more solely due to the social signal (alliance vs. negligence), the Control Principle faces strain. To avoid being self-undermining, the principle must not be defined tautologically (e.g., "agents are responsible for what we blame them for"). Instead, it must anchor responsibility in a capacity for rational adjustment. If the Kaelo punish negligence to incentivize vigilance, they are appealing to forward-looking control (capacity to learn) rather than backward-looking control (volition at time t). This preserves the principle's coherence but shifts its temporal focus. Ultimately, the Kaelo case suggests that while the *application* of moral principles is culturally sensitive, the *structure* of responsibility might remain universal, merely weighting variables like intent and vigilance differently based on ecological pressures. Thus, objectivity is preserved if we view moral truths as sensitive to contextual facts about human flourishing.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Distinction Definition (4 marks):** Clearly defines Descriptive Relativism (empirical variation) vs. Normative Anti-Realism (metaphysical absence of truth).
      *   *Botch:* Students conflate the two, arguing variation proves there is no truth.
  2.  **Logical Gap Analysis (4 marks):** Explains why disagreement doesn't entail no truth (the "astronomy" analogy or equivalent).
      *   *Botch:* Claims that because cultures differ, neither can be right (fallacy of relativism).
  3.  **Control Principle explication (4 marks):** Accurately states the standard Control Principle (responsibility requires voluntary control).
      *   *Botch:* Vaguely references "free will" without linking it to responsibility conditions.
  4.  **Application to Kaelo (4 marks):** Analyzes whether Kaelo judgments violate the principle or redefine 'control' (e.g., vigilance vs. volition).
      *   *Botch:* Asserts the Kaelo are simply irrational without analyzing their internal logic.
  5.  **Resolution on Objectivity (4 marks):** Concludes whether objectivity is undermined (usually arguing it isn't, via contextual parameters).
      *   *Botch:* Ends abruptly without linking the control analysis back to metaethical objectivity.

  ***

  Hope this helps flesh out the mid-term. Let me know if you want to tweak the Kaelo scenario, feels pretty solid though. Catch you later.
