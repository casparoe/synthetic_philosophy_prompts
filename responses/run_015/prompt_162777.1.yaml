  2.  **Conjunctive failure (0.35):** The four marks dissociate; for example, experience is immediate but representational, or ineffable but relational.
  3.  **Indeterminate reference (0.20):** The term shifts meaning between contexts, rendering the proposition partly verbal rather than factual.

  **Sub-questions**

  1.  **Strawman Elimination:** 0.4.
      *Justification:* Elimination arguments often target the strong conjunctive definition, though defenders frequently retreat to the weaker cluster notion when pressed, as your friend noted regarding recent literature.
  2.  **Representational Exhaustion:** 0.6.
      *Justification:* The transparency of experience suggests introspection reveals only external content, leaving no residual non-representational residue.
  3.  **Phenomenal Drift:** 0.5.
      *Justification:* Drift undermines diachronic authority, but defenders can restrict authority to the specious present without collapsing the entire clause.
  4.  **Inversion Tomography:** 0.3 (Probability of Vindication).
      *Justification:* Neural classifiers map relational structures successfully, but this leaves the intrinsic nature of the nodes opaque and philosophically unaddressed.

  **Combination and Sensitivity**
  These terms do not multiply independently. Q2 (Representational Exhaustion) is the dominant driver; if experience is exhausted by content, P fails regardless of Q1 or Q4. Q1 modulates the target: if defenders only hold the cluster notion, P becomes harder to falsify but less substantive. Q4 impacts the "intrinsic" clause specifically. The final number is most sensitive to **Q2**. Shifting the probability of representational exhaustion from 0.6 to 0.3 would raise my credence in P significantly, as it removes the primary philosophical obstacle to the non-representational clause.

  **Credence Gap and Settlement**
  Your credence (0.3) and your friend's (0.65) diverge most sharply on **Q2**. You likely suspect experience exceeds representation, while she likely suspects representation exhausts experience. This is the standard realist versus representationalist fault line.

  The concrete consideration that would settle this is a **dissociation case**: a neuroscientific intervention that alters the phenomenal character of an experience (e.g., the redness of red) while holding constant all representational content (e.g., the judgment that the object is red) and behavioral outputs. If such a dissociation is demonstrated, the non-representational clause survives; if it proves impossible despite exhaustive neural manipulation, representationalism wins. This moves the debate from conceptual analysis to empirical constraint.
