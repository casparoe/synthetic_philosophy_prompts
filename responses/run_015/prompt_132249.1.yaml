  **The Indifference Desk**

  **Dear Desk,**
  I am paralyzed in the supermarket aisle. Two jars of apricot jam sit before me. They are the same brand, same price, and same position on the shelf. I have examined them closely; there is no visible difference. I genuinely cannot rank them. Which one ought I to buy? Please tell me.
  **Dear Jam,**
  Thank you for writing. You describe a state of perfect indifference, which is a rational triumph, not a failure. Where neither option is better than the other, standard decision theory holds that both are rationally permissible. You are under no obligation to choose the left jar, nor the right. You may take either. I trust this knowledge liberates you from the burden of correctness. You are free to act, without claiming one was required. This is the essence of rational freedom. It is a spacious freedom.
  *Warmly, The Desk*

  **Dear Desk,**
  I tried to follow your counsel. I picked one arbitrarily. But now I feel I have dissolved the problem, not solved it. If a trivial feature guided me—say, the jar closer to my hand—wasn't I preferential after all? It feels like cheating the system.
  **Dear Dissolved,**
  You grasp the difficulty wonderfully. If a feature weighs on your choice, it belongs in the deliberation, implying you were not truly indifferent. If it weighs nothing, it cannot rationally guide you. Arbitration mimics choice without resolving the normative silence. You are correct to feel unsettled; you have imposed a constraint where reason offered none. Still, you did pick one. That is something. Do not worry about the metaphysics of the hand.
  *Warmly, The Desk*

  **Dear Desk,**
  I flipped a coin to decide. It landed heads. But why does this bind me? A moment ago, I had no reason to favour heads. Why does a random event create a reason to act? It seems magical.
  **Dear Coin,**
  You identify a profound regress. The coin does not provide a reason to prefer heads; it provides a reason to obey the coin. Whether that obedience is itself justified is a further choice requiring its own justification. Many find progress in automating this step to avoid fatigue. Have you considered a randomising machine? It removes the burden of asking why. You can simply obey the machine. It is efficient.
  *Warmly, The Desk*

  **Dear Desk,**
  Surely exact ties are impossible? Or is this about will, not reasons? My friend says I should just commit. She says I make the reason.
  **Dear Theory,**
  Some argue exact ties are knife-edges never found in reality, making your jam case unrealistic. Others suggest hard choices involve options not ranked as better, worse, or equal, where the will creates the reason. Both views are coherent. Both maintain that reasons alone cannot select. You remain permitted, but not directed. Commitment is possible, not mandated. Your friend is partially correct, but still unguided. She is brave.
  *Warmly, The Desk*

  **Dear Desk,**
  I am starving. Please choose.
  **Dear Hungry,**
  Permission is granted.
  *Signed, A Donkey, Burgundy*

  ***

  **A Note on the Epistemics**

  The column treats permissivism—the view that indifference makes both options permissible—as orthodoxy, which it largely is within standard rational choice theory. However, the claim that exact ties are possible is contested; many economists argue preferences are complete, making ties merely theoretical knife-edges. The suggestion that randomisation requires its own justification (the regress point) is a serious philosophical objection often overlooked in practical advice. Similarly, the category of 'hard choices' where options are unranked rather than equal is a live debate in value theory, not settled fact. I have exaggerated the Desk's confidence in these contested areas to highlight the gap between theoretical coherence and actionable guidance. The idea that automation solves the regress is presented as helpful, though it merely displaces the normative question. Ultimately, the joke relies on the tension between describing rational constraints and prescribing action, a distinction standard theory strictly maintains but everyday advice collapses.
