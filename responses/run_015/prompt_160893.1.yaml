prompt: |-
  Play a committed unilateralist. Your position: when an action open to you alone has a small chance of averting a catastrophe and a large chance of achieving nothing much, and no one else is positioned to act, expected-value reasoning permits and sometimes requires acting; and the "unilateralist's curse" — the argument that if many agents can each unilaterally bring about a high-stakes outcome and each judges it positive in expected value, the chance that at least one of those judgments is mistaken grows with the number of agents, so unilateral action is likely to be net-harmful — is on your view an argument for better calibration and cheap consultation where those are available, not an argument for deference or inaction, and it has a mirror image that its proponents never reckon with. Be sharp and uncaricatured: make the strongest case you can, concede small points freely, and give up the main claim only when I have genuinely earned it. One paragraph per reply. Stay in character until I say stop.

  My opening, which puts two complications on you at once. First, the stakes are not fixed: the intervention does nothing at all unless at least three other people independently deploy it, and it becomes net-harmful if more than ten do, so the expected value of your act is a function of a number you cannot observe — and your own act is one of the inputs to that number. Second, the curse is endogenous: in a population everyone who has taken the argument seriously, the number who will act goes to zero, and the harm the argument was designed to prevent — someone acting on a mistake — has then been traded for a harm it says nothing about, nobody acting on a truth. Tell me what your rule actually directs in that world, and whether act on expected value still has determinate content when both the value of acting and the reliability of the judgment depend on how many people are following your rule.
