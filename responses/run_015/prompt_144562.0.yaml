answer: |-
  This is a sharp diagnosis. You have identified that your program is running on a hybrid engine that mixes incompatible logics. To answer your request, I am going to reconstruct the implicit philosophical theory that holds this machinery together, identify where the load-bearing walls are cracking, and distinguish between what is standard economic orthodoxy and what is genuinely disputed.

  Here is the reconstruction of the theory your program presupposes, followed by an analysis of the tensions you observed.

  ### 1. The Ontological Commitment: Counterfactual Realism
  **The Question:** Does the program presuppose there is a determinate fact of the matter about what a particular organisation would have done?

  **The Theory:** Yes. Your system is committed to **Counterfactual Realism**. It operates on the assumption that for every applicant, at the moment of application, there exists a "true" state of the world in the parallel universe where you did not fund them. It assumes this state is fixed, discoverable, and distinct from the actual world.

  **Settled vs. Contested:**
  *   **In Administration:** This is treated as **Settled**. You cannot run a "but-for" test without assuming the "but" refers to something real.
  *   **In Philosophy/Economics:** This is **Heavily Contested**. Many philosophers of action argue that human choice is not like a physical particle. There is no "fact of the matter" about what a free agent *would* have done until they actually do it. Preferences are not always stable; they are often constructed *during* the decision process. By asking the question, you are not measuring a pre-existing intention; you are participating in forming it.

  **My Reconstruction:** Your program assumes human intention is a static object that can be measured like temperature. **[My Reconstruction, High Confidence]**. This is the root error. If intention is fluid, the "truth" they tell you in year one and the "truth" they tell you in year three are not conflicting reports on the same fact; they are reports on two different facts created by two different contexts.

  ### 2. The Temporal Tension: Prediction vs. Reconstruction
  **The Question:** Does the theory presuppose the future-tense and past-tense questions must have the same answer?

  **The Theory:** The program assumes **Temporal Neutrality**. It assumes that $I_{pre}$ (intention before funding) and $I_{post}$ (reconstruction after funding) should align, modulo honest error. It treats the ex-ante question as a *prediction* and the ex-post question as a *verification* of that prediction.

  **The Tension:** You are correct that these are different speech acts.
  *   **Ex-Ante:** This is a **Performative Utterance**. When an applicant says "We won't do this without you," they are not describing a fact; they are making a promise/threat to alter your behavior. It is a move in a negotiation.
  *   **Ex-Post:** This is a **Historical Claim**. When they say "We wouldn't have done it," they are constructing a narrative to justify the funds received.

  **Settled vs. Contested:**
  *   **Settled:** It is widely acknowledged in contract theory that ex-ante statements are strategic.
  *   **Contested:** How much weight to give them. Your program tries to treat the strategic threat as a factual datum. This is a category error.

  **My Reconstruction:** The program tries to solve a *moral hazard* problem (don't pay for what they'd do anyway) using a *verification* tool (ask them). This fails because the agent controls the data source. **[My Reconstruction, High Confidence]**. The tension you see isn't a bug in your specific office; it's a structural flaw in any self-reported additionality test.

  ### 3. The Token-Type Slide: Individual vs. Class
  **The Question:** Is causation a matter of difference-making for the individual, or statistical?

  **The Theory:** Your program officially commits to **Token Causation** (Individual Difference-Making). The moral justification for spending public money is that *this* specific project would not exist without *this* specific check. This is the "But-For" test in law.

  **The Tension:** As you noted, when the Token test gets hard, you switch to **Type Causation** (Statistical Generalization). "Do people usually do this?" This is an epidemiological approach, not a legal one.
  *   **The Whiplash:** You cannot logically demand individual proof for eligibility and then use statistical averages for payment sizing.
  *   **Why:** If you pay based on a regional average, you are admitting that you don't know the individual cost/additionality. If you don't know the individual cost, you can't know the individual additionality. By switching to averages for payment, you implicitly admit the individual counterfactual is unknowable, which undermines the strict eligibility test you just performed.

  **Settled vs. Contested:**
  *   **Contested:** Economists argue over whether "marginal" (individual) or "average" (statistical) analysis is better for public policy.
  *   **Settled:** You cannot have it both ways without contradiction. If the payment is statistical, the eligibility should be probabilistic. If eligibility is deterministic (yes/no), the payment should be individualized.

  **My Reconstruction:** The program uses Token logic for **Political Legitimacy** ("We didn't waste money on this specific grant") and Type logic for **Administrative Feasibility** ("We can't audit every line item"). **[My Reconstruction, Medium Confidence]**. This suggests the "theory" is actually a cover for resource constraints, not a coherent philosophical stance.

  ### 4. The Reflexivity Problem
  **The Question:** Is there anything dodgy about hypotheticalising away the very choice we are trying to buy?

  **The Theory:** The program assumes **Observer Independence**. It assumes that asking "Would you do this without us?" does not change the answer to "Would you do this without us?"

  **The Tension:** This is the **Lucas Critique** applied to administration. By making the funding conditional on the answer, you change the incentives for the answer.
  *   If the rule is "We only pay if you wouldn't do it," the rational answer is "We wouldn't do it."
  *   If the rule is "We don't pay liars," the rational answer is "We would do it, but it's hard."
  *   Because the stakes are high, the "truth" becomes the answer that maximizes funding probability, not the answer that reflects reality.

  **Settled vs. Contested:**
  *   **Settled:** In mechanism design (a branch of economics), it is settled that you cannot simply ask agents for private information without building in incentives for truth-telling. Your form does not have strong truth-telling incentives (other than audit threat).
  *   **Contested:** Whether a better form is possible. Some argue you can never get true additionality data from the applicant directly.

  ### 5. What survives if you drop the test?
  You asked which parts require the strong counterfactual machinery and which would survive on averages.

  **Requires Strong Counterfactual (Token Causation):**
  *   **The Moral Claim of Non-Waste:** If your primary goal is to ensure *zero* public dollars go to projects that would have happened anyway, you need the individual test.
  *   **Legal Compliance:** If your enabling legislation says "funds shall only be used for additional activities," you are legally bound to the individual test.

  **Survives on Averages (Type Causation):**
  *   **Economic Efficiency:** If your goal is to maximize total wetland restored per dollar across the whole region, you do not need to know if *Applicant A* was additional. You only need to know that the *Program* causes more wetlands than zero.
  *   **Payment Sizing:** As you noticed, you are already doing this. You could move eligibility here too.

  **What if you dropped the test entirely?**
  *   **Option A: Pay Everyone (Universal Subsidy).**
      *   **Gain:** Massive reduction in admin costs. No gaming the application questions. Removes the "threat" dynamic.
      *   **Loss:** High "Deadweight Loss." You will pay many people to do things they were already going to do. Philosophically, you shift from "Buying Action" to "Rewarding Status."
  *   **Option B: Randomized Control (RCT).**
      *   **Method:** You accept more applicants than you can fund. You randomly deny funding to a control group. You compare the two groups later.
      *   **Gain:** This is the only way to get a **true** counterfactual without asking the applicant. It solves the reflexivity problem.
      *   **Loss:** It is politically difficult to deny money by lottery. It tells you if the *program* works, but not if *this specific grant* was justified.

  **What would you be giving up?**
  You would be giving up the **illusion of individual justice**. Currently, your system pretends to treat every applicant as a unique case with a unique truth. Dropping the test admits that you are managing a portfolio, not judging cases. You gain honesty; you lose the ability to tell a specific applicant "No, because *you* specifically would have done this anyway."

  ### 6. Summary of Tensions
  To directly answer your request on which of the four things are in tension:

  1.  **Ex-Ante vs. Ex-Post:** **Flatly In Tension.** One is a negotiation strategy; the other is a historical reconstruction. Treating them as the same fact is philosophically naive. **[Settled in social science, ignored in admin]**.
  2.  **Individual vs. Class:** **Flatly In Tension.** You cannot use a generalization to validate an individual exception. If the class does it anyway, the individual likely did too, rendering the individual test redundant. If the individual test is necessary, the class generalization is irrelevant. **[My Reconstruction, High Confidence]**.
  3.  **Eligibility vs. Payment:** **Structural Contradiction.** Binary causation (Yes/No) cannot logically feed into continuous statistical valuation (Regional Average) without a missing variable. You are saying "This specific act was caused by us" but "The value of this act is determined by what others do." **[My Reconstruction, Medium Confidence]**.
  4.  **Reflexivity:** **Fundamental Flaw.** The test changes the thing being tested. This is not a tension between two parts of your process; it is a tension between your process and reality. **[Settled in economics]**.

  ### Final Verdict on the "Theory"
  Your program is not running on a single theory. It is running on a **bureaucratic compromise** disguised as a philosophical stance.

  It pretends to be **Libertarian Paternalism** (we only nudge what wouldn't happen) but operates on **Utilitarian Aggregation** (we pay based on averages). It claims to value **Individual Agency** (asking the applicant what they choose) but treats that agency as **Deterministic** (assuming their answer is a fixed fact).

  If you want to fix the whiplash, you have two coherent paths, neither of which is what you currently do:
  1.  **Full Individualism:** Individual eligibility *and* individual cost verification. (Prohibitively expensive).
  2.  **Full Statistical:** Eligibility based on risk classes (e.g., "Small retrofits are usually additional, large ones aren't") *and* payment based on averages. (Requires dropping the individual "would you" question).

  Currently, you are doing the hardest part of Option 1 (the interrogation) and the easiest part of Option 2 (the payment), which maximizes workload while minimizing accuracy. **[My Reconstruction, High Confidence]**.
