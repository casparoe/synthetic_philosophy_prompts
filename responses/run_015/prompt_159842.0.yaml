answer: |-
  Here is a precisification of the slogan "You can't help what you feel," broken down into the distinct theses it might express, followed by an analysis of the specific philosophical pressure points you raised, and finally the honest verdicts on argumentative utility and theoretical fit.

  ### Part I: The Menu of Theses

  The slogan is ambiguous between a claim about *causality*, a claim about *volition*, and a claim about *normativity*. Here are the three distinct readings.

  **1. The Volitional Thesis (Direct Control)**
  *   **Claim:** Emotions cannot be initiated or terminated by a direct act of will (e.g., I cannot decide to feel fear right now simply by deciding to).
  *   **Verdict:** **Substantive and Defensible.** This is empirically plausible. Unlike raising an arm or asserting a proposition, emotions arise in response to stimuli or appraisals, not commands.
  *   **Does it deliver the conclusion?**
      *   *Episode 1 (Rationality):* **No.** It does not follow that involuntary states cannot be correct or incorrect. Visual perceptions are involuntary, yet we call them illusions or veridical.
      *   *Episode 2 (Responsibility):* **No.** It does not follow that I am not responsible for actions taken *because* of the emotion, nor for cultivating the dispositions that make the emotion likely.

  **2. The Causal Thesis (Inevitability)**
  *   **Claim:** Given the antecedent conditions (biology, history, immediate stimulus), the emotion was causally determined; it was impossible for it not to occur.
  *   **Verdict:** **Substantive but Controversial.** It relies on hard determinism or a specific view of psychological causation. It ignores the role of attention and cognitive reframing which are themselves causal inputs.
  *   **Does it deliver the conclusion?**
      *   *Episode 1 (Rationality):* **No.** Causal inevitability does not preclude normative assessment. A calculator is causally determined, but its output can still be incorrect.
      *   *Episode 2 (Responsibility):* **Maybe.** If accepted, this undermines all moral responsibility, not just for emotions. It is a nuclear option, not a specific excuse for resentment.

  **3. The Normative Thesis (Exemption)**
  *   **Claim:** Because emotions are passive occurrences rather than active choices, they fall outside the space of reasons; they are arational events like sneezes.
  *   **Verdict:** **False / Begging the Question.** This simply asserts the conclusion of Episode 1 as a premise. It defines emotions as non-cognitive by fiat.
  *   **Does it deliver the conclusion?**
      *   *Episode 1 (Rationality):* **Yes, but trivially.** It secures the conclusion only by defining emotions as the kind of thing that cannot be assessed.
      *   *Episode 2 (Responsibility):* **Yes.** If emotions are arational events, acting on them is like acting on a reflex. But this is too strong; we do hold people accountable for reflex-like reactions if they are culpably cultivated (e.g., a racist flinch).

  ---

  ### Part II: Pinning Down the Pressure Points

  **1. Direct vs. Indirect vs. Long-Run Control**
  "Can't help" conflates three temporal modes of control.
  *   **Direct (At will):** I cannot feel fear *now* by command. (True).
  *   **Indirect (By attention/reframing):** I cannot stop feeling fear *now* even if I focus on safety statistics. (Often True in the short term, due to emotional inertia).
  *   **Long-Run (Cultivation):** I cannot change my tendency to feel fear *over time* by exposure or therapy. (False).
  *   **The Conflation:** The slogan uses the truth of *Direct* control to imply the truth of *Long-Run* lack of control.
  *   **Verdict Flip:** In Episode 2 (Resentment), the interlocutor relies on Direct lack of control to excuse action. But accountability usually hinges on Long-Run control (should you have worked on your resentment earlier?) or Indirect control (could you have shifted your attention?). If "can't help" means only "can't switch off like a light," it grants no exemption from responsibility.

  **2. Involuntariness vs. Assessability (The Perception/Feeling Divergence)**
  This is the core of Episode 1.
  *   **The Feeling Theory:** If emotions are bodily disturbances (like nausea), they are involuntary and **not assessable for correctness**. Nausea isn't "false," it just happens.
  *   **The Perception Theory:** If emotions are perceptions of value, they are involuntary but **assessable for correctness**. A visual illusion is involuntary, but it misrepresents the world.
  *   **The Judgment Theory:** If emotions are judgments, they are (in principle) voluntary and **assessable for correctness**.
  *   **The Divergence:** Your interlocutor in Episode 1 assumes the Feeling Theory model (involuntary = arational) while you are arguing for the Perception Theory model (involuntary = representational).
  *   **Verdict:** Involuntariness has *no bearing* on assessability unless you assume that only voluntary states represent the world. Since perceptions represent the world involuntarily, the inference "involuntary → not assessable" is a non-sequitur.

  **3. Dimensions of Assessment**
  "Correctness" is ambiguous across three dimensions. The slogan's force changes depending on which is targeted.
  *   **Fit (Accuracy):** Does the object actually have the property the emotion presents? (e.g., Is the plane actually dangerous?)
      *   *Slogan Impact:* Weak. Involuntary states can fail to fit (illusions).
  *   **Warrant (Proportionality):** Is the intensity of the reaction appropriate to the value? (e.g., Is terror proportionate to a 1% risk?)
      *   *Slogan Impact:* Medium. One might argue intensity is physiological (hard to help), but warrant is normative.
  *   **Action (Prudence/Morality):** Should I act on this emotion? (e.g., Should I refuse to fly?)
      *   *Slogan Impact:* Strongest. "I can't help feeling it" is often a plea to be excused for *acting* on it.
  *   **Verdict:** In Episode 1, the debate is about **Fit**. The slogan fails here. In Episode 2, the debate is about **Action**. The slogan works only if we accept that feeling an emotion compels action, which is false (one can feel resentment and not act).

  **4. Judgmentalism's Burden (Recalcitrance)**
  *   **The Problem:** If emotions are judgments, why do they persist when we judge them false? (I judge flying safe, yet I feel fear).
  *   **The Cost:** To explain this, Judgmentalism must posit unconscious judgments or modular cognitive systems. If they do this, they concede that emotions are not under direct rational control, which weakens their claim that emotions are fully responsive to reasons.
  *   **The Perception Advantage:** Perceptualism explains recalcitrance easily: I can see the stick is straight in water while it still *looks* bent. The module is encapsulated.
  *   **Verdict:** Judgmentalism owes an account of passivity. If they explain it by making emotions sub-doxastic, they lose the "judgment" label's intuitive force. If they keep the "judgment" label, they struggle to explain why we can't reason the emotion away instantly.

  ---

  ### Part III: The Honest Answers

  **1. Is there a reading on which the line is true and yet irrelevant to both episodes?**
  **Yes.** The reading is: *"I lack direct volitional control over the onset and offset of this phenomenological state."*
  *   **True:** You cannot command fear to cease instantly.
  *   **Irrelevant to Episode 1:** Lack of direct control does not preclude representational content. A camera lacks direct control over its images, but its images can still be out of focus (incorrect).
  *   **Irrelevant to Episode 2:** Lack of direct control over the *feeling* does not preclude control over the *action*. I cannot help feeling hungry, but I am accountable for stealing food.

  **2. Is there any reading strong enough to get Episode 1's conclusion that is not simply begging the question?**
  **No.**
  To conclude that emotions cannot be assessed for correctness (Episode 1) based on "you can't help them" requires the premise: *"Only states under direct voluntary control can be assessed for correctness."*
  *   This premise is false (counterexample: perception, memory, involuntary beliefs).
  *   Therefore, any argument using the slogan to defeat rationality is trading on an ambiguity between "voluntary" and "representational." It is a **fallacy of category**. It assumes the Feeling Theory (emotions are non-representational disturbances) to prove the Feeling Theory.

  **3. Which theory is best placed to explain what we can and cannot help?**
  **The Perception Theory (Perceptualism).**
  It captures the dual nature that the slogan tries to exploit but fails to articulate:
  *   **What we can't help:** The *onset* and the *phenomenology*. Like seeing a snake, the fear strikes us. We are passive recipients.
  *   **What we can help:** The *endorsement* and the *cultivation*. Like checking the stick in the water, we can investigate the emotion. Like wearing glasses, we can train our sensitivity over time.

  **4. Where do the verdicts flip in hard cases?**
  If we accept Perceptualism as the baseline, here is where "Can't Help" succeeds or fails:

  *   **Emotions with no determinate object (Free-floating anxiety):**
      *   *Verdict:* **Slogan Holds.** If there is no object, there is no "fit" to assess. It is closer to a bodily disturbance.
      *   *Flip:* You can't call it "irrational" in the sense of false, only "unpleasant" or "dysfunctional."

  *   **Emotions cultivated deliberately over years (Virtue/Vice):**
      *   *Verdict:* **Slogan Fails.** You *could* help it, just not *now*. You are responsible for the perceptual habit you built.
      *   *Flip:* Accountability is high. "I can't help being envious" is false if you spent years reinforcing envious appraisals.

  *   **Emotions induced by choosing what to attend to:**
      *   *Verdict:* **Slogan Fails.** Indirect control is still control. If I dwell on insults to generate rage, I am helping it.
      *   *Flip:* Rational assessment applies to the *attention*, which transfers to the emotion.

  *   **Emotions one has been asked to have (Acting/Role):**
      *   *Verdict:* **Slogan Fails.** This reveals the indirect voluntary channel. If I can generate tears for a role, I have some motor access to the emotional system.
      *   *Flip:* Suggests emotions are not fully encapsulated; they respond to "as if" judgments.

  ### Summary for the Reading Group
  The line "You can't help what you feel" is a **conversation-stopper because it is a category error.** It takes a truth about *volition* (I can't switch it off) and applies it to *normativity* (It can't be wrong).

  *   **For Episode 1:** Tell your interlocutor they are treating emotions like **itches** (Feeling Theory) when the debate is whether they are like **sight** (Perception Theory). Sight is involuntary, but it can be wrong. If they insist emotions are like itches, they have abandoned the claim that emotions are about the world at all.
  *   **For Episode 2:** Tell your colleague that **feelings are not actions.** She is not accountable for the resentment (the feeling), but she is accountable for the behavior (the action). "Can't help feeling" excuses the state; it does not excuse the conduct, unless she argues she was literally compelled (which is rarely true).

  The slogan only works if you have already decided that emotions are non-cognitive bodily upsurges. If you haven't decided that yet, the slogan cannot be used to decide it.
