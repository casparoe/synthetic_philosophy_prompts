      *   *Ambient Contamination:* This is crucial. It's not just background noise; it's structural bias. Like the room mode boosting 200Hz. The speaker didn't want 200Hz boost, but the room forced it. The IRL agent thinks the speaker *loves* 200Hz.

  6.  **Addressing the "Why" (The Editor's Question):**
