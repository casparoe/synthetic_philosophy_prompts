  2.  **Deconstruct IRL for the Audio Analogy:**
      *   *IRL Core:* We observe trajectories (states/actions). We assume the agent maximizes some reward function $R$. We try to find $R$.
      *   *The Problem:* Many $R$ functions can produce the same behavior (degeneracy/identification problem). If the agent isn't perfectly optimal, we infer the wrong $R$.
      *   *Audio Equivalent:* We observe a recorded track (behavior). We assume the speaker intended a specific message (reward). We try to reconstruct the original intent.
      *   *Optimality Assumption:* The speaker spoke perfectly clearly without hesitation or error.
      *   *Misspecification:* The speaker hesitated, was interrupted, or lied.
      *   *Reward Hacking:* The system amplifies noise thinking it's signal (e.g., a hum that matches the frequency of a voice).
      *   *Ambient Contamination:* Room tone, HVAC hum, or acoustic reflections that shape the recording but aren't part of the voice.

  3.  **Drafting the Translation (The "Mix Session"):**
