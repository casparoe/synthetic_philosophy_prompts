      *   *Optimality Assumption:* The "Perfect Take." Assuming the speaker never stumbled, never breathed too loud, never drifted off-mic.
      *   *Identification Problem:* "Phase Cancellation" or "Aliasing." Different source signals can result in the same waveform.
      *   *Reward Hacking:* "Intermodulation Distortion" or "False Peaks." The noise gate opens for a truck rumble because it looks like a bass drum.
      *   *Ambient Contamination:* "Room Tone" or "Acoustic Coupling." The way the room shapes the sound isn't the speaker's intent, but it's baked into the tape.

  4.  **Developing the "Residue Report":**
      *   *What fits:* Noise vs. Signal, Reconstruction, Artifacts, Gain Staging (weighting).
      *   *What distorts:* Human irrationality isn't just "noise"; it's structural. In audio, noise is usually external. In IRL, "noise" is often internal (bias, fatigue).
      *   *What's missing:* Counterfactuals. Audio engineers work with what *is* on the tape. IRL cares deeply about what *could have* been done (the action space). Also, the "Reward" isn't just a signal; it's a *driver*. Audio is passive recording; IRL is active control.

