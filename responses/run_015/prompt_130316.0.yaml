  ### Brainstorm: Structural Mapping of Moral Tension

  *   **Form as Function:** The villanelle's obsessive repetition mirrors the inescapable nature of moral duty. The alternating refrains (A1, A2) represent the oscillating pressure of two incompatible normative systems.
  *   **Refrain 1 (Dutch):** Must encode *epistemic courtesy*. The duty is to the listener's autonomy; withholding truth is an insult. Rhyme sound: *-are* (bare).
  *   **Refrain 2 (Japanese):** Must encode *interactional care*. The duty is to the shared face-space; explicit falsehood is a rupture. Rhyme sound: *-air* (air).
  *   **The White Lie (B Rhymes):** The B lines will trace the white lie's failed attempt to navigate these demands. It tries to be kind but ends up violating both frameworks.
  *   **The Quatrain:** By placing A1 and A2 adjacently (lines 16 and 17), the poem visually and rhythmically corners the white lie. It cannot exist between them; it is condemned by the proximity of the two truths. No synthesis is offered; the tension remains structural.

  ***

  ### The Stranded Lie

