  ### Seminar Note

  This poem intentionally essentialises complex communicative cultures for philosophical clarity. Anthropologically, it flattens the Dutch *bespreekbaarheid* (discussability) into a rigid demand for exposure, ignoring contextual Dutch tact. Similarly, it reduces Japanese *haragei* (belly art) to a prohibition on explicit falsehoods, overlooking scenarios where blunt truth is permissible within *uchi* (in-group) spaces. Philosophically, the piece relies on a contested definition of lying that equates withholding information with active deception, challenging the standard omission/commission distinction. By framing directness as 'courtesy' and indirectness as 'care', the poem forces a collision where the white lie fails both: it is too opaque for the former, too explicit for the latter. This double-bind serves not as ethnography, but as a heuristic device to expose the precariousness of universalising moral intuitions about truth-telling.
