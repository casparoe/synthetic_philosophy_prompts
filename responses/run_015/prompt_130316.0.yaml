  You are a professional philosopher specialising in cross-cultural pragmatics and moral psychology. Before composing anything, please think carefully and begin with a brief brainstorm: map precisely how a villanelle’s alternating refrains and final quatrain can mirror the tension between Dutch directness and Japanese indirectness, identifying exactly where a white lie is stranded between them.

  Write a polished villanelle of nineteen lines, using two refrains—one voicing the Dutch commitment that withholding a true belief is an epistemic insult to the listener’s autonomy, the other voicing the Japanese commitment that forcing an explicit falsehood into shared space ruptures the mutual care of indirectness—that alternate through the tercets and finally stand side by side in the closing quatrain. The poem should take a committed interpretive stance: the white lie is wrong not because it violates one tradition, but because it simultaneously fails both (it conceals reality, offending directness, yet imposes an unagreed fiction, offending indirectness). Do not synthesise a third way; let the refrains remain unreconciled.

  Inject the following niche framing: treat Dutch directness as grounded in epistemic courtesy—the duty to present reality without mediation—while treating Japanese indirectness as grounded in interactional care—the duty to maintain a shared face-space that false explicitness collapses. Use these terms in the poem’s imagery or diction so the philosophical structure does formal work.

  After the poem, provide a brief note of no more than 150 words explaining exactly where the poem takes liberties with standard anthropological accounts of Dutch or Japanese communicative behaviour, and where it leans on a contested philosophical analysis of lying. Write in British English, and ensure the piece is suitable for closing an advanced seminar on comparative moral psychology.
