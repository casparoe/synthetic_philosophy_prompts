answer: |-
  **START NODE:** Individual act makes no observable difference; collective harm is real.

  **Q1. CAUSAL SHAPE:** Is the harm function continuous (every unit adds risk) or stepped (nothing until N units)?
  *   *Case:* Radiation dose (linear) vs. Voting threshold (step).
  *   **Yes (Continuous):** Go to Q4.
  *   **No (Stepped):** Go to Q2.

  **Q2. ROUNDING/PROBABILITY:** If stepped, does your unit change the *probability* of triggering the step (e.g., pooled orders)?
  *   *Case:* One chicken purchase tips a reorder only 1 in 300 times.
  *   **Yes (Expected Value):** Go to Q4.
  *   **No (Literally Zero Impact):** Go to Q3.

  **Q3. OVERDETERMINATION:** If the harm happens anyway (others pushed enough), is your contribution causally null?
  *   *Case:* Pushing a car already over the edge.
  *   **Yes (Counterfactual Dependence):** Go to Q5.
  *   **No (Contribution Counts):** Go to Q4.

  **Q4. NORMATIVE LOCUS:** Is wrongness located solely in the *outcome* or in the *agency* (joining in)?
  *   *Case:* Buying the chicken vs. Eating it.
  *   **Outcome Only:** **LEAF 1: Expected Utility Consequentialism** (Wrong if expected harm > cost).
  *   **Agency Included:** **LEAF 2: Complicity Theory** (Wrong to join dirty process regardless of impact).

  **Q5. RECIPROCITY:** Does your obligation vanish if others don't comply (fair play)?
  *   *Case:* 10% more people recycle vs. everyone recycles.
  *   **Yes (Conditional):** **LEAF 3: Fair Play Principle** (Obligation depends on others doing their bit).
  *   **No (Universal):** **LEAF 4: Rule Consequentialism** (Follow rule that works if generalised).

  **Q6. SKEPTIC CHECK:** If no difference to outcome and no agency wrongness, is there any wrong?
  *   *Case:* The bare case (group matters, members don't).
  *   **Yes:** **LEAF 5: Inefficacy Skepticism** (No difference = no wrong).
  *   **No:** **LEAF 6: Empty Cell** (Outcome Liability without Causal Link).

  ***

  **LOGICAL SPACE MAPPING**
  *   **Occupied:** Leaves 1–5 are standard positions. Leaf 1 (Expected Utility) dominates physics-adjacent ethics. Leaf 2 (Complicity) handles overdetermination. Leaf 5 (Skepticism) is the inefficacy objection's home.
  *   **Empty/Incoherent:** Leaf 6. Asserts individual liability for harm while denying individual causal link or agency wrongness. This violates transitivity of responsibility. You cannot be liable for a result you did not influence and did not participate in wrongly.
  *   **Overlap:** Act Consequentialism (strict linear) and Expected Utility merge if Q1 is answered "Continuous." I separated them via Q2 to handle the "rounding" case explicitly.

  ***

  **COMMITMENT**
  *   **Load-Bearing Question:** **Q1 (Causal Shape).** This is the spine. If the chain is continuous (linear no-threshold), the inefficacy objection collapses immediately; every act *does* something. If stepped, the heavy lifting begins.
  *   **Defensible Leaf:** **Leaf 1 (Expected Utility Consequentialism).** It respects the physics of probability. Even if my chicken purchase doesn't trigger the order *actually*, it increases the *probability* of the order by 1/300. The expected harm is real, just as expected radiation dose is real.
  *   **Incoherent Cell:** **Leaf 6.** It asserts normative force without causal traction. It requires magic: harm travels from the collective to the individual without passing through the individual's act.

  ***

  **DOSE-RESPONSE ANALOGY CRITIQUE**
  Your analogy holds for Q1 but breaks at Q2 (Rounding). Radiation damage is physical and memoryless; every photon interacts immediately. Social harms (markets, voting) have inventory buffers and decision thresholds that "store" individual acts until a trigger point. In radiation, risk is continuous; in supermarkets, causal power is quantized and hidden. Furthermore, dose-response is descriptive (what *does* happen), while ethics is normative (what *ought* to happen). A physical threshold doesn't automatically grant a moral permission slip below the line, whereas in physics, below threshold, nothing happens.
