answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I find the prospect of this seminar deeply engaging. Moving the discussion of Omelas beyond the familiar utilitarian calculus is not only refreshing but necessary, for the story has suffered from being treated as a mere puzzle box for introductory ethics students rather than the profound moral provocation it is. Your proposal to read it through Buddhist ethical thought, specifically focusing on volition and the quality of will, strikes me as both promising and perilous. It promises to unlock the dimension of the text that consequentialism flattens, namely the interior life of the agent, but it perilously risks turning Buddhist ethics into a subtle form of mental consequentialism, which would leave you vulnerable to the very critique you wish to escape. Let me try to trace the contours of this reading with you, attending to the complications you have raised, for I think they are indeed the places where the interpretation will either hold or break.

  To begin with the core distinction you wish to press, the consequentialist charge that the walkers are engaged in moral self-indulgence rests on the assumption that the only morally relevant facts are states of affairs in the world, specifically the balance of suffering and happiness. From that vantage, the child remains in the dark whether one stays or leaves, so the departure is inert. A Buddhist reading must insist that the morally salient unit is not the external state of affairs but the volition, or cetanā, that animates the agent. When a citizen of Omelas sees the child and accepts the bargain, they are not merely observing a fact; they are actively willing a world in which that fact is necessary. They are generating karma through the roots of greed, in this case the greed for their own happiness, and delusion, the belief that this happiness is real or separable from the suffering that grounds it. When the walkers leave, they are not merely changing their location; they are withdrawing the volitional support that binds them to that structure. The difference they make is real because it is a difference in the fabric of their own consciousness and the karmic trajectory they inhabit. It is not that they produce a better outcome in the future, though that may follow, but that the act of walking away is itself the cessation of a harmful intention. To call this self-indulgence is to misunderstand the nature of the self in Buddhist thought; there is no self to indulge, only a stream of consciousness that can be oriented toward liberation or bound further into suffering. The walker refuses to let their ease be purchased by an intention directed at another's misery, and that refusal is a transformation of the agent that is intrinsically valuable, regardless of the child's continued physical confinement.

  However, you ask whether this is genuinely different in kind from consequentialism or merely consequentialism with a more generous account of which outcomes count. This is the sharpest point of vulnerability. If we say the walkers leave because it produces a better state of mind for them, or because it positions them to do better things later, we have simply shifted the consequentialist calculus from the city to the psyche. To avoid this, the reading must insist that the quality of the will is constitutive of the good, not instrumental. The act of non-harming is not good because it leads to nirvana; it is an expression of nirvana, or at least of the path toward it. The walker does not leave to get something; they leave because staying is incompatible with seeing clearly. The consequentialist asks what should be done about the child; the Buddhist ethicist asks what is happening to the citizen who stays. The difference is that one theory evaluates the world, and the other evaluates the relationship of the mind to the world. In Omelas, the city represents a world built on delusion, and the walkers represent the interruption of that delusion. That interruption is a moral event in itself, even if it does not move the stone from the door of the room.

  This brings us to your first complication, the variant of Unvisited Omelas, where the citizens never know of the child. Here the divergence between the two frameworks becomes stark, and I do not think it is an embarrassment for the Buddhist account, though it requires careful handling. For the consequentialist, the moral status of the situation is unchanged because the suffering exists independently of knowledge. For the Buddhist, the moral landscape changes profoundly because karma is intentional. If the citizens never know, they do not form the volition to sacrifice the child. They are not generating the bad karma of complicity. This might look like moral subjectivism to a Western philosopher, as if the wrongness of the torture depends on who is thinking about it. But Buddhism does not deny the reality of the child's suffering; the child is still trapped in dukkha. What changes is the karmic burden of the citizens. They are innocent, not because the situation is just, but because they lack the intention to harm. The wrongness in Omelas is not a free-floating property of the architecture; it is a relational property between the beneficiaries and the victim. If that relation is severed by ignorance, the karmic link is broken. This is not an embarrassment but a clarification of the scope of Buddhist ethics, which is soteriological rather than juridical. It is concerned with how beings bind themselves to suffering, not with adjudicating the objective value of states of affairs independent of mind. However, you must be prepared to face the charge that this makes the ethics too agent-centered, potentially neglecting the objective reality of the victim's pain if no one is there to witness it. The Buddhist reply is that compassion arises when the suffering is known, and until then, the focus is on maintaining the purity of one's own mind so that when the truth is revealed, one is capable of responding rightly.

  The second complication, the missing figure of the one who returns, touches on the tension between the arhat and the bodhisattva ideals. The story gives us those who stay and those who leave, but not those who leave and come back to work from within. Your colleague sees this as a renunciation narrative, and I am inclined to agree, but with a caveat. The bodhisattva ideal requires that there be some possibility of alleviating suffering within the world. The bodhisattva returns because their presence can benefit others. In Omelas, the bargain is presented as absolute and magical; the happiness of the city depends entirely on the misery of the child. There is no room for reform, no lever to pull, no way to mitigate the suffering without destroying the city entirely. If the structure is rigid, then staying is not working from within; it is consenting to the torture. In such a context, the bodhisattva path might look indistinguishable from complicity. A Buddhist ethicist might feel pressure to supply the missing ending, to imagine a way to break the bargain through skillful means, but Le Guin's silence suggests that some systems are so fundamentally corrupted that engagement is impossible. The only compassionate act left is to refuse to participate. This aligns with the arhat's withdrawal, but it also contains a seed of the bodhisattva's resolve, for the walkers go into the darkness alone, without guarantee, driven by a knowledge they do not share. They are not saving the city, but they are saving themselves from becoming the kind of being who could sustain such a city. Whether this is enough is the question the story leaves open, and a Buddhist reading must admit that sometimes the only victory available is the preservation of one's own capacity for compassion, even if it cannot be enacted upon the world.

  You also ask where the story resists the reading, and I think the resistance lies in the narrator's persistent pluralism. The narrator refuses to define the terms of the bargain, saying they do not know the rules, and offers multiple possibilities for the nature of the city and the people. This ambiguity is hostile to any systematized ethics, Buddhist or otherwise. Buddhism relies on specific truths about the nature of reality and karma; the narrator insists on uncertainty. If we do not know the rules, how can we know the karmic consequences? The story forces us to act without full knowledge, which is the human condition, but it complicates the Buddhist emphasis on right view. The walkers seem to know where they are going, but the narrator does not. This suggests that the moral insight required is intuitive and immediate, not doctrinal. The story dramatizes a moment of awakening that precedes philosophical categorization. Furthermore, the story resists the idea that self-regarding liberation and other-regarding benefit can be easily reconciled. In much Buddhist philosophy, freeing oneself is the precondition for helping others, but in Omelas, the two seem mutually exclusive. You cannot help the child and save yourself. You must choose. This is a harder truth than most ethical systems care to admit. Consequentialism tries to solve the problem by calculation; deontology tries to solve it by duty; Buddhism tries to solve it by transformation. But the story suggests that sometimes there is no solution, only a choice between complicity and exile.

  Ultimately, I think your colleague is right that the consequentialist framing is a category mistake, but not because the story is purely about renunciation. It is about the limits of ethical reasoning itself. The story dramatizes the relation between self-regarding liberation and other-regarding benefit by showing them in tragic conflict. The walkers do not save the child, and that is the horror of it. A Buddhist reading can explain why their action is meaningful without solving the problem of the child, whereas consequentialism cannot explain why the action is meaningful at all if it does not help the child. The difference is that Buddhism validates the integrity of the agent as a moral end in itself, not just as a vessel for producing good outcomes. This protects the walkers from the charge of self-indulgence, provided we understand that the purity they seek is not a commodity but the absence of harmful volition. However, you must be honest with your students that this does not fix the child's suffering. It does not offer a political solution. It offers a way to remain human in an inhumane world. Whether that is enough is the question the seminar should wrestle with, and I suspect the silence of the text, like the silence of the walkers, is the most important part of the lesson. The story does not want us to feel good about the walkers; it wants us to feel the weight of the choice. A Buddhist reading honors that weight by taking the interior life seriously, but it must not pretend that the exterior suffering disappears just because the mind has changed.

  I hope this helps you settle the disagreement with your colleague, or at least sharpen the terms of it. The story is resilient enough to withstand both readings, but the Buddhist approach brings out the tragedy of the agent's position in a way that the utilitarian calculus obscures. Just be prepared for the pushback on the Unvisited Omelas case, as that is where the intuition of objective wrongness is strongest, and do not shy away from admitting that the story offers no bodhisattva solution because the structure of Omelas may be designed to make such a solution impossible. That impossibility is the point.

  Warmly,

  Your Colleague
