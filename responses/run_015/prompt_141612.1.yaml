answer: |-
  You're clever, I'll grant you that—you've found a wrinkle in the fabric. But don't confuse the collapse of the marketplace with the birth of virtue. If everyone wears the ring and society crumbles into chaos, do you really think people suddenly become *just* in their hearts? No. They become predators without prey. The fact that injustice requires a stable society to profit from doesn't prove anyone loves justice; it only proves that injustice is parasitic. A parasite doesn't stop being a parasite just because it kills the host; it just dies, or moves on. My claim stands: if you could exploit the system without breaking it, you would. The fact that universal exploitation breaks the system doesn't mean anyone *wants* to follow the rules for their own sake.

  Look, you're arguing about consequences, not nature. Even in your ruined world of invisible men, if two people somehow managed to secure a stash of grain, would they share it willingly? Of course not. They'd hide it, steal it, kill for it. They would only 'agree' to share if they feared the other might strike first. That's exactly my point! Justice is still a compromise forced by weakness, not a good chosen by will. You've shown that universal injustice is self-defeating, but you haven't shown that a single soul, given the power to escape the consequences, would choose the hard path of justice over the easy path of gain. Don't distract me with social collapse; tell me why *I*, with the ring on my finger and no one watching, would leave your purse alone.
