answer: |-
  There is no single established term for this specific phenomenon. You have identified a precise, under-theorized corner of the "Wrong Kind of Reasons" (WKR) debate. The literature discusses the distinction you start with (object-given vs. state-given reasons), and it discusses the ethics of belief or emotional regulation separately, but it lacks a unified label for the *diachronic transfer* you are describing—where a state-given reason is used to manufacture an object-given justification.

  If you need a name to carve this out, the most accurate descriptive term is **Normative Laundering**.

  It captures the process: a reason of the "wrong" kind (pragmatic, state-based) is run through a causal or constitutive cycle (steering evidence, managing intensity, performing components) and emerges appearing to be of the "right" kind (evidential, fitting, truth-based). The philosophical question you are raising is whether the "stain" of the origin persists after the cycle is complete.

  Here is the analysis of whether your three cases are one phenomenon or three, where the boundary lies, and the verdict on the defect.

  ### One Mechanism, Three Verdicts

  Structurally, your three cases are identical. They all instantiate **Normative Laundering**. In each, an agent uses a pragmatic reason to manipulate the conditions of an attitude, resulting in an attitude that appears to be supported by fitting reasons.

  However, they are not normatively identical. The verdict on whether the attitude is defective depends on the **constitutive norm** of the specific attitude in question. The mechanism is one; the success of the laundering varies.

  1.  **Case 1 (Belief): The Laundering Fails.**
      Belief is constitutively aimed at truth. A central constraint on belief is often described as *transparency*: to believe $p$ is to take $p$ to be true. If the agent knows (or could easily know) that the belief was formed to satisfy a pragmatic need rather than a truth-tracking process, the belief is compromised. Even if the evidence now supports it, the *holding* of the belief is infected by the knowledge of its pragmatic ancestry. This is a **Genealogical Defect**. The belief is not "false," but it is not properly *held*. It is a form of epistemic luck that undermines knowledge, even if it preserves truth.

  2.  **Case 2 (Grief): The Laundering Succeeds, but the Attitude is Fittingly Defective.**
      Grief is responsive to loss. The "size" of the grief is the measure of its fit. Here, the laundering works perfectly: the widower successfully reduced the grief. The defect is not in the *mechanism* (he did what a responsible parent should), but in the *outcome* (the grief is now unfittingly small). The pragmatic reason successfully altered the attitude's intensity. The "complaint" here is tragic, not rational. It is not that the grief is *fake*; it is that it is *insufficient*. The laundering transferred the pragmatic reason into a causal force that changed the fit. The defect is in the fit, not the genealogy.

  3.  **Case 3 (Trust): The Laundering Succeeds and is Virtuous.**
      Trust is partly constituted by behavior (reliance, lack of monitoring). Unlike belief, trust does not require a purely truth-aiming origin; it is a practical stance. By acting *as if* they trust, the colleagues instantiate the components of trust. If the feeling follows, the trust is real. Here, the pragmatic reason (saving the department) is a valid reason to engage in the *constituents* of trust. Because trust is partly a commitment to act, the pragmatic reason *becomes* a right-kind reason for the action-components, which in turn constitute the attitude. The laundering is legitimate.

  ### The Boundary: Avowability

  You asked for the feature that decides whether the transfer goes through. The boundary is **Avowability**.

  The transfer is successful (the attitude is in good standing) if and only if the agent can avow the pragmatic origin of the attitude *without* the attitude collapsing.

  *   **Just Inside the Line (Trust):** A colleague can say, "I am choosing to rely on you for the sake of the department," and still trust. The pragmatic reason is compatible with the attitude's existence. The laundering holds.
  *   **Just Outside the Line (Belief):** A believer cannot say, "I believe this because it helps me recover," while maintaining the belief *as a belief*. To avow the pragmatic reason is to admit one is not fully attending to the truth. The attitude collapses into "acceptance" or "hope." The laundering fails.

  This explains why Case 2 is distinct. Grief is not fully avowable in the same way (it is a passion, not a commitment), but the *reduction* of grief can be avowed ("I am doing this for my children") without the grief vanishing entirely. It sits in the middle: the attitude remains, but its fit is altered.

  ### Is this a Problem for the Standard Distinction?

  It is not a refutation of the standard WKR distinction, but it is a necessary **Diachronic Expansion** of it.

  The standard distinction is synchronic: *Right now*, is this reason of the right kind? Your cases show that reasons can change kind over time through agency. A pragmatic reason (WKR) can cause the existence of an evidential reason (RKR). The standard distinction handles the *end state* (the belief is evidentially supported), but it lacks the vocabulary for the *history*. Your carving identifies that the history matters for the *status* of the agent, even if it doesn't matter for the *truth* of the proposition.

  ### Confidence and Vulnerability

  **Confidence Level:** I am **85% confident** in this account. The identification of this as a diachronic WKR problem is robust, and the "Avowability" criterion aligns with standard constitutive accounts of belief and trust (e.g., Velleman, Hieronymi).

  **The Claim Most Likely to Be Wrong:**
  I am least confident in the verdict on **Case 1 (Belief)**. I claimed the laundering fails and the belief is defective because belief aims at truth.
  *Why I might be wrong:* There is a pragmatic tradition (William James, perhaps certain readings of Peirce) that argues if the belief leads to successful engagement with the world and generates its own evidence (as in the survivorship case), the distinction between "believing for truth" and "believing for success" collapses in practice. If the belief *works* and is *true*, insisting on a genealogical defect might be an fetishization of purity that ignores how human cognition actually functions. It is possible that "Normative Laundering" is not a defect in belief, but a feature of resilient agency.

  **Summary:**
  *   **Name:** Normative Laundering (or Diachronic WKR Transfer).
  *   **Unity:** One mechanism, three verdicts based on the attitude's constitutive norm.
  *   **Boundary:** Avowability (Can you admit the pragmatic origin without the attitude dissolving?).
  *   **Inside:** Trust. **Outside:** Belief.
  *   **Status:** A diachronic expansion of the standard WKR distinction, not a refutation.
