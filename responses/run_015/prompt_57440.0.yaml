answer: |-
  # Scenario

  A steward stands before the Eternal Trust, an institution mandated to govern a civilization guaranteed to survive indefinitely. Generations are indexed $t = 1, 2, 3, \dots$. The steward must make a single, irreversible choice between two policy profiles, A and B, determining the well-being of every future citizen. The population size is fixed and identical across both options; only the quality of life varies. Well-being is measured on a cardinal scale from 0 to 10. Option A requires a severe sacrifice from the first generation to install a infrastructure that yields diminishing but perpetual dividends for all successors. Option B spares the first generation but locks the civilization into a lower technological trajectory forever. The steward cannot delegate this choice, nor can future generations overturn it. The future is open-ended, not probabilistic; extinction is ruled out by stipulation. The ethical question is how to aggregate these infinite streams of well-being. Standard intuitions suggest that if A is better than B almost everywhere, A should win. However, the method of aggregation determines whether the initial sacrifice is outweighed by the eternal, shrinking gain.

  # Numerical Specification

  Let $u_A(t)$ and $u_B(t)$ denote well-being in generation $t$. We set the baseline $u_B(t) = 5$ for all $t$. Option A imposes a cost at $t=1$ and provides a decaying benefit thereafter. Specifically:
  $$u_A(1) = 0$$
  $$u_A(t) = 5 + \frac{2}{t} \quad \text{for } t \ge 2$$
  All values lie within $[0, 10]$. The difference sequence $\Delta_t = u_A(t) - u_B(t)$ is:
  $$\Delta_1 = -5$$
  $$\Delta_t = \frac{2}{t} \quad \text{for } t \ge 2$$
  This structure satisfies the constraint that A is worse initially, then strictly better forever, with the advantage shrinking harmonically. The harmonic decay is critical: it is slow enough to sum to infinity undiscounted, but fast enough to average to zero.

  # Three Verdicts

  **(a) Undiscounted Summation (Overtaking):** We compare the limit of partial sums $S_N = \sum_{t=1}^N \Delta_t$. If $S_N > 0$ for all sufficiently large $N$, A is strictly better.
  $$S_N = -5 + \sum_{t=2}^N \frac{2}{t} = -5 + 2(H_N - 1)$$
  where $H_N$ is the $N$-th harmonic number. Since $H_N$ diverges, $S_N \to \infty$. The sum flips from negative to positive when $2(H_N - 1) > 5$, or $H_N > 3.5$. Given $H_{10} \approx 2.93$ and $H_{20} \approx 3.60$, the crossover generation is $N^* = 20$. For all $N \ge 20$, the cumulative well-being of A exceeds B. Verdict: **A strictly better**.

  **(b) Exponential Discounting:** We evaluate $V = \sum_{t=1}^\infty \delta^t \Delta_t$ using $\delta = 0.9$, a factor consistent with standard long-term policy rates.
  $$V = -5(0.9) + \sum_{t=2}^\infty (0.9)^t \frac{2}{t}$$
  Using the identity $\sum_{t=1}^\infty \frac{x^t}{t} = -\ln(1-x)$, the gain term is $2[-\ln(0.1) - 0.9] \approx 2[2.30 - 0.9] = 2.8$. The cost is $4.5$. Net value $V \approx 2.8 - 4.5 = -1.7$. Since $V < 0$, B is preferred. Furthermore, because the infinite sum is negative and every term added for $t \ge 2$ is positive, every finite partial sum is strictly less than the limit. Thus, B wins at every finite truncation. Verdict: **B strictly better**.

  There exists a critical $\delta^*$ where the verdict flips. The equation is $-7\delta - 2\ln(1-\delta) = 0$. As $\delta \to 1$, the logarithmic term dominates, making $V$ positive. The magnitude of $\delta^*$ is fixed by the ratio of the initial cost to the decay rate of the benefit.

  **(c) Average Well-Being:** We compare $\lim_{N \to \infty} \frac{1}{N} \sum_{t=1}^N \Delta_t$.
  $$\text{Average}_N = \frac{-5 + 2(H_N - 1)}{N} \approx \frac{2 \ln N}{N}$$
  As $N \to \infty$, this limit is exactly 0. Both options yield the same average well-being of 5. A shift-invariant finitely additive measure applied to the difference sequence yields zero because such measures extend the Cesàro limit, which exists and is zero here. Verdict: **Exactly indifferent**.

  # Diagnostics

  The structural feature driving the divergence is the harmonic decay rate ($1/t$). This rate sits on the boundary between convergence and divergence. For the three verdicts to hold, the advantage term must be $k/t^p$. We require $p \le 1$ for the undiscounted sum to diverge (ensuring A wins overtaking) and $p > 0$ for the average to converge to zero (ensuring indifference). If $p > 1$, the undiscounted sum converges; if the initial cost is large enough, A loses even under overtaking. If $p \le 0$, the average does not vanish, and A wins the average comparison.

  If we truncate the future at a large finite $N$, say $N=100$, the undiscounted verdict favors A (since $100 > 20$), but the discounted verdict still favors B. The average verdict depends on the specific $N$, but remains close to zero. If we change the decay to $1/t^2$, the undiscounted sum converges to a finite value. With the same initial cost, the total gain would be finite and likely insufficient to overcome the initial loss, causing A to lose under overtaking as well as discounting.

  # Adversarial Section

  A defender of discounting may object that the case assumes indefinite survival with certainty. In reality, extinction risk imposes an effective finite horizon, making the infinite tail irrelevant. This objection succeeds pragmatically but fails theoretically; the seminar question concerns the ethics of infinite futures, not risk management. If the future is truly infinite, discounting arbitrarily devalues distant lives.

  Conversely, a critic of average utilitarianism will argue that indifference is unacceptable because A Pareto-dominates B for all $t \ge 2$. A is better for infinitely many people and worse for only finitely many. This objection defeats (c) if one accepts the Pareto principle over aggregation limits. It shows (c) is incomplete regarding distributional justice, not merely mathematically distinct.

  Finally, the Rawlsian maximin rule leaves this pair without a clear verdict favoring A. Maximin focuses on the worst-off generation. Since generation 1 is worse off under A (0 vs 5), Maximin strictly favors B, ignoring the infinite gains elsewhere. This highlights how priority to the worst-off clashes with total sum considerations.

  # Honesty Clause

  This construction could be accused of rigging the decay rate to be exactly harmonic to force the average limit to zero while keeping the sum divergent. Real-world benefits rarely follow precise mathematical laws over infinite time. Additionally, the idealization of binding commitment over an endless future is physically impossible; institutions decay. Readers should discount the literal feasibility of the steward's power and focus on the logical incompatibility of the aggregation rules. If the harmonic specification is unsatisfiable with bounded utility, one must relax the bound slightly, but here the values $0$ to $6$ fit comfortably within $[0, 10]$. No specifications conflict, but the precision required is artificial.
