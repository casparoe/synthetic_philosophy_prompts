answer: |-
  Here is a lesson plan designed to dismantle the Cartesian foundation without triggering the standard dualist defenses.

  ### 1. The Dependency Order (Sequence of Operations)
  Do not start with biology or computers. Start with the *structure of explanation*. If you start with "evolution is blind," they will file it under "Biology." If you start with "computers calculate," they will file it under "Technology." You must start with **Competence**.

  1.  **Anchor the Cartesian Intuition:** Briefly restate their current position: *Reasoning is the light that makes competence possible.* (I must understand the rule to follow it.)
  2.  **Introduce the Carrying Example:** Present the mechanism *before* labeling it Darwinian or Turingesque.
  3.  **Demonstrate Competence without Comprehension:** Show the example solving a problem it cannot represent.
  4.  **Reveal the Dual Identity:** Show how this exact mechanism describes both Natural Selection (Darwin) and Algorithmic Processing (Turing).
  5.  **Execute the Inversion:** Argue that Reasoning is not the foundation of Competence, but a *tool* generated by Competence.
  6.  **Interdict Misconceptions:** Address specific errors at the moment they become plausible.
  7.  **End-Check:** Verify the inversion has taken hold.

  ---

  ### 2. The Carrying Example: "The Blind Hill-Climber"
  **The Image:** A robot placed on a landscape in thick fog. Its goal is to reach the highest peak. It has no map, no GPS, and no concept of "mountain." It only has one sensor: an altimeter that tells it if the step it just took went up or down.
  **The Algorithm:** If the step goes up, take another step in that direction. If it goes down, step back and try a different direction.

  **Why this works for both:**
  *   **For Turing:** It is a local search algorithm (gradient ascent). It manipulates symbols (coordinates) based on syntax (up/down values) without semantics (knowing *where* it is).
  *   **For Darwin:** It is natural selection. The "robot" is a lineage of organisms. The "steps" are mutations. The "altitude" is fitness. The lineage "climbs" the peak of adaptation without any organism knowing what "fitness" is.

  **What the Example Must Include:**
  *   **Feedback Loop:** It must show that *consequences* drive the process, not intentions.
  *   **Incremental Progress:** It must show competence accumulating over time (steps/generations), not in a single flash of insight.
  *   **Local vs. Global:** It must emphasize that the solver only sees the immediate step, not the whole problem space.

  **What the Example Must Avoid:**
  *   **Avoid "Learning":** Do not say the robot "learns" the terrain. It doesn't. It just reacts. (Prevents confusion with cognitive psychology).
  *   **Avoid "Hardware" Talk:** Do not discuss circuits or neurons. Keep it at the level of *process*. (Prevents "brain is just hardware" reductionism).
  *   **Avoid "Success":** Acknowledge it can get stuck on a small hill (local maximum). This proves it isn't "omniscient design."

  ---

  ### 3. The Sequence & Misconception Interdiction
  Here is exactly where you head off the predictable errors.

  **Phase 1: The Setup (Cartesian Anchor)**
  *   *Say:* "Descartes tells us that to do something right, you must first understand the rule. To build a clock, you must understand time. To speak truth, you must understand logic."
  *   *Do:* Ask them to raise hands if they think a system can be reliable without understanding *why* it is reliable. (Most will hesitate).

  **Phase 2: The Example (Blind Hill-Climber)**
  *   *Say:* "Consider the Robot in the Fog. It reaches the peak. It is competent. Does it understand 'mountain'?"
  *   *Interdict (Behaviorism):* **Stop here.** Students will say, "It's just behaving as if it knows."
      *   *Defuse:* "I am not saying it *has* no internal states. I am saying its internal states do not need to *represent* the goal to *achieve* the goal. Behaviorism says 'mind doesn't matter.' Inversion says 'mind is a later invention of this process.' Distinction: We aren't denying the mind; we are explaining its origin."

  **Phase 3: The Dual Identity (Darwin & Turing)**
  *   *Say:* "This is not just a robot. This is Darwin's Natural Selection (climbing fitness peaks). This is also Turing's Computation (climbing solution spaces)."
  *   *Interdict (Darwin = Animals Dumb):* **Stop here.** Students will think, "Okay, animals are dumb, but humans reason."
      *   *Defuse:* "The algorithm is the same. The *substrate* changes. If the algorithm works without comprehension in the rock/bacteria stage, why must it change its nature at the human stage? Don't map this to 'Instinct vs. Thought.' Map it to 'Unconscious Competence vs. Conscious Tool-Use.'"
  *   *Interdict (Turing = Machines Think):* **Stop here.** Students will think, "So computers are alive?"
      *   *Defuse:* "Turing didn't prove machines think. He proved thinking can be *simulated* by syntax. The Inversion says: Syntax (competence) comes first. Semantics (understanding) is a user-interface evolved later."

  **Phase 4: The Inversion (Reasoning as Tool)**
  *   *Say:* "Reasoning is not the foundation. Reasoning is a 'long-distance' tool. The Hill-Climber works locally. Reasoning allows us to simulate the climb *before* we step. But the ability to simulate is itself a competence evolved by the climb."
  *   *Interdict (Searle Backwards):* **Stop here.** This is your roommate's objection.
      *   *The Misread:* "Searle says Syntax $\neq$ Semantics. You're saying Syntax $\rightarrow$ Semantics. That's magic."
      *   *The Defuse:* "Searle assumes Semantics is a *substance* (like ghost-stuff). Inversion assumes Semantics is a *function* (like a map). A map doesn't need to be 'true' in a magical sense to be useful. Reasoning is a control system that evolved because it offered better navigation than blind climbing. Searle asks 'Does it feel like something?' Inversion asks 'Does it work?' We are not claiming syntax *becomes* qualia. We are claiming reasoning is a *competence* that evolved, not the *ground of being*."

  ---

  ### 4. What to Openly Leave Out
  To keep the inversion clean, you must explicitly bracket these topics. Tell the students you are ignoring them *on purpose*.

  1.  **The Hard Problem (Qualia):** "We are not discussing whether the robot *feels* the climb. We are discussing whether the climb *happens* without the feeling."
  2.  **Universal Computation Details:** "We don't need to know how the tape works, only that the process is mechanical."
  3.  **Evolutionary Game Theory:** "We don't need the math of selection, only the logic of retention."
  4.  **Neural Implementation:** "Whether this runs on silicon or carbon is irrelevant to the logical inversion."

  ---

  ### 5. The End-Check
  Do not ask them to define the inversion. Ask them to solve a problem using it.

  **The Question:**
  *"If reasoning is the foundation of all competence, explain how the first organism capable of reasoning survived long enough to reason. If reasoning is the exception, not the rule, how does the explanation change?"*

  **What to listen for:**
  *   **Failed Check:** They talk about "brain development" or "evolution gave them brains." (This treats reasoning as a biological add-on, not a logical inversion).
  *   **Passed Check:** They acknowledge that **competence must exist prior to the tool that analyzes competence.** They should articulate that reasoning is a *product* of the blind process, not the *prerequisite* for it. They should express that the "foundation" is actually the blind feedback loop, and reasoning is the "penthouse" built on top.

  ### Summary of the "Searle Backwards" Defense
  If a student raises the Searle objection in class (and they will):
  *   **Acknowledge:** "Searle is right that syntax alone isn't *meaning*."
  *   **Pivot:** "But the Inversion isn't about meaning. It's about *order*. Searle assumes you need Meaning to have true Competence. The Inversion says you need Competence to eventually get Meaning. We aren't saying the robot understands. We're saying *you* understand for the same reason the robot climbs: because your understanding is a competence that was selected for climbing."
