answer: |-
  ### Exam Question: Logic Seminar – Dialetheism Unit

  **Prompt:**

  Consider the position of **Frame-Bound Dialetheism (FBD)**. Unlike Priest's unrestricted dialetheism, which asserts that some contradictions are true *simpliciter*, FBD asserts that contradictions are true only relative to specific interpretive frames (e.g., a legal code, a quantum mechanical model, or a semantic framework), while maintaining that the meta-language used to describe these frames remains consistent.

  Write an essay addressing the following:

  1.  Does FBD solve the problem of *Ex Contradictione Quodlibet* (explosion) more effectively than unrestricted dialetheism by containing inconsistency within frames?
  2.  Critically evaluate the "Meta-Language Objection": Does the act of demarcating these frames require a consistent logic that ultimately smuggles classical consistency back into the system, thereby reducing FBD to a form of contextualism rather than genuine dialetheism?

  Your answer should focus on the logical stability of the boundary between frames and the status of truth predicates involved.

  ***

  ### Model Answer

  Frame-Bound Dialetheism (FBD) attempts to salvage the intuitive force of dialetheism—that some contradictions are true—while avoiding the global semantic instability associated with Priest's unrestricted view. By restricting true contradictions to specific interpretive frames, FBD aims to contain the damage of inconsistency. However, upon closer logical inspection, FBD does not solve the explosion problem more cleanly than unrestricted dialetheism; rather, it displaces the logical tension to the meta-language, where it risks collapsing into mere contextualism.

  To assess the explosion problem, we must look inside the frame. For FBD to work, the logic operating within a specific frame $F$ must be paraconsistent. If standard classical logic held within $F$, the presence of a true contradiction ($A \land \neg A$) would trigger *Ex Contradictione Quodlibet* (ECQ), allowing any proposition $B$ to be derived. This would render the frame trivial. Therefore, FBD must stipulate that inference rules like Disjunctive Syllogism are restricted within $F$. In this localized sense, FBD successfully blocks explosion *internally*. It offers a pragmatic advantage over unrestricted dialetheism by assuring us that a contradiction in a legal code does not entail that the moon is made of cheese in a physical description. It compartmentalizes triviality.

  However, the core philosophical challenge lies not within the frame, but in the statement describing the frame. To assert "Contradiction $C$ is true in Frame $F$," one must employ a meta-language $M$. This generates a dilemma regarding the logical status of $M$.

  If $M$ is governed by classical logic (as FBD proponents often suggest to maintain clarity), then the predicate "is true in $F$" functions as a consistent indexical. In this scenario, $A$ is true-in-$F$ and $\neg A$ is true-in-$F$, but it is not the case that ($A \land \neg A$) is true simpliciter. The contradiction is dissolved into a compatibility of indexed propositions. This saves consistency, but at the cost of genuine dialetheism. If contradictions are only true relative to a frame, and the global description of reality (provided by $M$) is consistent, then there are no true contradictions in the world, only conflicting descriptions. This reduces FBD to a form of contextualism about truth, undermining its claim to be a dialetheic position at all.

  Conversely, if $M$ is also dialetheic to preserve the genuineness of the contradictions, the boundary problem resurfaces. If the meta-language tolerates contradictions, then the demarcation between Frame $F$ and Frame $G$ may itself be contradictory. A proposition might both belong and not belong to a frame. This reintroduces the global instability Priest faces. We lose the safety mechanism FBD promised. If the boundaries are fuzzy or contradictory, containment fails, and the risk of global explosion returns via the meta-language.

  Therefore, FBD does not offer a cleaner solution to explosion than unrestricted dialetheism. It merely shifts the locus of inconsistency. To maintain genuine dialetheism, the meta-language must be inconsistent, which forfeits the safety of frame-boundaries. To maintain safe boundaries, the meta-language must be consistent, which forfeits genuine dialetheism. The view ultimately struggles to occupy the middle ground it proposes: it either smuggles consistency back in through the meta-language or admits that the framing mechanism itself is subject to the very contradictions it seeks to contain.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Distinction Between Local and Global Truth (4 Marks)**
  *   **Must Hit:** Clearly distinguishes between truth *simpliciter* (Priest) and truth-relative-to-a-frame (FBD).
  *   **Typical Wrong Move:** Treating frame-bound truth as simply a synonym for "belief" or "opinion" rather than a truth-predicate modification.

  **2. Explanation of Internal Paraconsistency (4 Marks)**
  *   **Must Hit:** Acknowledges that blocking explosion within the frame requires restricting inference rules (e.g., Disjunctive Syllogism), not just asserting contradictions.
  *   **Typical Wrong Move:** Assuming that merely asserting a contradiction automatically blocks explosion without changing the underlying logic.

  **3. Identification of the Meta-Language Necessity (4 Marks)**
  *   **Must Hit:** Identifies that describing the frames requires a meta-language ($M$) distinct from the object language of the frames.
  *   **Typical Wrong Move:** Ignoring the meta-language entirely and focusing only on what happens inside the contradictory frame.

  **4. Analysis of the "Consistency Smuggle" (4 Marks)**
  *   **Must Hit:** Argues that if $M$ is consistent, the contradictions are merely indexed (contextualism), not genuine ontological contradictions.
  *   **Typical Wrong Move:** Treating frame-bound dialetheism as just a form of contextualism about truth without noting how this undermines the dialetheic claim.

  **5. Evaluation of Theoretical Stability (4 Marks)**
  *   **Must Hit:** Concludes that FBD faces a dilemma: either it collapses into contextualism (consistent $M$) or inherits Priest's global instability (inconsistent $M$).
  *   **Typical Wrong Move:** Claiming FBD is obviously superior to Priest's view without addressing the logical cost of the boundary conditions.
