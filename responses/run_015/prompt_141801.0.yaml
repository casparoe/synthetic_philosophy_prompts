      *   **Key Concepts to Embed (Show, Don't Tell):**
          1.  *Canalized Outcomes vs. Plastic Reasons:* The outcome happens anyway in a rerun, but the *reasons* given are different/incompatible. Identity of outcome includes the description/justification.
          2.  *Lexical Lock-in:* Alternatives didn't lose; they became unsayable/unformulable. Vocabulary locks in reality.
          3.  *The Archive Problem:* Survivors justify the win; near-misses are lost. Reruns are built from sorted materials.
      *   **Setting:** Provincial Bureau of Retrospective Coherence (or similar) in a mid-sized industrial city. Decadal reports on infrastructure shape.
      *   **Protagonist:** Junior analyst noticing inconsistencies in past justifications (e.g., rail gauge, dam site, ring road) across reports.
      *   **Plot Element:** A "rerun" (simulation, war game, dream) that comes out "wrong in an interesting way."
      *   **Constraints:**
          *   ~1500 words.
          *   No lectures/Socratic dialogue.
          *   No footnotes/citations/real historical names.
          *   Philosophical statements must be flawed/regretted/drunk.
