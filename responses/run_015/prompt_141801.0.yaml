          *   Characters with real stakes.

  2.  **Deconstruct the Concepts for Narrative:**
      *   *Canalized Outcomes/Plastic Reasons:* I need a specific infrastructure project. Let's go with the "North Bend Diversion" or a "Ring Road." Let's choose the **Harbor Silt Channel**. No, let's go with the **Eastward Rail Spur**. It connects the mines to the port.
      *   *The Inconsistency:* Report 1 (1960): Geology. Report 2 (1970): Cost. Report 3 (1980): Labor availability. Report 4 (1990): Environmental flow. All say "Inevitable."
      *   *Lexical Lock-in:* The protagonist tries to simulate an alternative, but lacks the words or tools to describe it. The alternative isn't just expensive; it's *unthinkable* within the system's language.
      *   *The Archive:* The files are incomplete. The losing proposals are missing or redacted to look like drafts of the winner.
