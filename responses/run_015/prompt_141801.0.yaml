      *Refining the "Archive Problem":* The original dissenting opinions are missing. They aren't redacted; they are filed under "Viaduct - Drafts." The loss is structural.

      *Drafting thought:* Keep the tone dry, bureaucratic, slightly surreal (Kafka meets STS).

