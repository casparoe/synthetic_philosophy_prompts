answer: |-
  The basement of the Bureau of Retrospective Coherence smelled of lignin and dry rot, a scent Elias had come to associate with inevitability. He was three weeks into the Decadal Review of the Kessler Viaduct, the concrete spine that had bifurcated the city's eastern district in 1954. His job was not to determine if the Viaduct was good or bad. His job was to certify that, given the conditions of 1954, the Viaduct was the only thing that could have happened.

  It was a simple task, usually. History, when filed correctly, tended to straighten itself out. But the Kessler file was buckling.

  Elias sat at his steel desk, surrounded by four bound volumes. They were the official justifications for the Viaduct, published every ten years since construction. He opened the 1955 report. *Geological Imperative.* The bedrock beneath the river bend was too unstable for pilings; a high-span arch was the only engineering solution. He opened the 1965 report. *Economic Necessity.* The arch design utilized surplus steel from the wartime stockpiles; any other design would have bankrupted the municipal bond initiative. He opened the 1975 report. *Urban Flow.* The height of the arch was required to accommodate the projected volume of heavy transit trucks, which had not yet been invented in 1954 but were deemed statistically inevitable. He opened the 1985 report. *Aesthetic Harmony.* The curve of the concrete matched the natural sweep of the riverbank, preserving the city's visual soul.

  Four reports. Four mutually exclusive reasons. All concluding with the same bolded sentence: *No viable alternative existed.*

  Elias rubbed his eyes. The coffee in his mug had developed a skin. He opened his word processor to draft a query to his supervisor, Mara. He typed: *If the outcome is constant but the causality is mutable, are we archiving the event or the justification?* He highlighted the sentence and hit delete. It sounded like something a drunk grad student would say at a conference mixer. Instead, he typed: *Requesting access to the 1953 Alternative Proposal Box.*

  The response came back ten minutes later: *Box 404 is empty.*

  It wasn't lost. Bureau archives didn't lose things. It was empty because nothing had ever been put inside it. The alternatives hadn't been rejected; they had never been filed as alternatives. They were likely filed under *Viaduct – Drafts*, indistinguishable from the winning blueprint until the moment the ink dried. This was the archive problem: the losers don't leave footprints; they leave edits.

  Elias decided to run a Stability Test. It was a bureaucratic rerun, a simulation authorized for cases where the historical narrative showed stress fractures. He took the files to the Simulation Chamber, a windowless room dominated by the Coherence Engine. It wasn't a computer, not exactly. It was a hybrid of algorithmic modeling and bureaucratic form-filling. You fed it the constraints of the past, and it generated the most probable outcome.

  He input the 1954 parameters: budget, technology, labor supply, geology. He selected the variable *Infrastructure Type*. The default was *Viaduct*.

  Elias hesitated. He manually overrideed the field. He typed *Tunnel*.

  The cursor blinked. The screen flickered amber. A dialogue box appeared: *ERROR: TOKEN UNDEFINED.*

  He tried *Underpass*. *ERROR: TOKEN UNDEFINED.*

  He tried *Ferry System*. The system accepted it, but when he ran the projection, the output text generator began to stutter. The simulation showed the ferries moving across the water, but the narrative engine describing the output kept referring to them as "sub-surface conveyance units" and "elevated transit spans." The visual data showed boats; the text described concrete. The vocabulary of the Bureau had locked onto the Viaduct so tightly that it could no longer parse a world where the river was crossed differently. The alternative wasn't expensive; it was unsayable.

  "You're fighting the syntax," Mara said from the doorway. She was holding a mug of tea that smelled of medicinal herbs. She looked at the screen, then at Elias. She didn't look surprised.

  "The system won't let me model a tunnel," Elias said. "It says the token doesn't exist."

  "In 1954, the token didn't exist," Mara said. She walked over and leaned against the console. "Not in the budget forms. Not in the zoning laws. Not in the language of the engineers. You can't build a tunnel if the form for a tunnel hasn't been printed yet."

  "But the geology report said pilings were impossible. The economic report said steel was the only option. They can't both be true."

  "Both were true at the time of writing," Mara said. She took a sip of her tea. "Look, Elias. You're thinking about history like it's a tree. Branches. Choices. One path taken, others left behind. That's cute. But around here, we know history is more like a riverbed. The water goes where the dirt is soft. Ten years later, the dirt hardens. You look back and say the water *had* to go there. You're not wrong. But you're not right either."

  "So we lie?"

  "We coherence," Mara corrected. "If you submit a report saying the Viaduct was contingent, the City Council asks why we spent forty years maintaining a contingency. If you say it was inevitable, the maintenance budget gets approved. The outcome is canalized, Elias. The water is in the channel. Whether the channel was dug by geologists or accountants doesn't change the wetness of the pavement."

  "The simulation is broken," Elias insisted. "It's producing data that contradicts the text. It's showing ferries but calling them viaducts."

  "Then fix the text," Mara said. She set her mug down on a stack of sensitive files. "Or fix the data. But don't bring me a broken machine. Bring me a report."

  "That's lexical lock-in," Elias said. He hadn't meant to say it. It was the term he'd scribbled in the margin of his notebook during a late night, half-drunk on cheap wine and frustration. "The vocabulary sorted the reality before the concrete was poured."

  Mara looked at him. Her expression wasn't angry; it was pitying. "Write that in the final draft. See how long you keep your clearance."

  She left the room. The door clicked shut, sealing the hum of the ventilation system back in.

  Elias looked at the screen. The simulation was still running. The little icons of the ferries moved across the digital river, but the text box below them scrolled relentlessly: *...structural integrity of the span requires... load-bearing capacity of the arch ensures...*

  The machine was trying to tell him that even if he built the ferries, they would function as a viaduct. Or that the word *Viaduct* was no longer a description of a thing, but a description of a function that could be filled by anything, provided it was called the right name. The rerun wasn't proving contingency. It was proving that the rerun itself was rigged by the language used to describe it. He couldn't simulate a different past because he was using the tools of the present, and the present was built entirely out of Viaduct bricks.

  He thought about the empty Box 404. The alternatives hadn't been suppressed by power. They hadn't been outcompeted by markets. They had simply evaporated because no one had written the words that would hold them in place.

  Elias opened the report template. The field *Justification for Selection* was blinking. He could type *Geological Imperative*. He could type *Economic Necessity*. He could type *Because the forms only had a checkbox for Viaduct*.

  He looked at the simulation. The ferries were still moving, ghostly and silent. The text continued to praise the beauty of the concrete arch.

  If he filed the truth—that the outcome was stable but the reasons were plastic, that the lock-in was in the grammar of the bureaucracy—the report would be rejected. It would be filed in Box 404. It would become empty.

  If he filed the lie, the Viaduct stood. The city kept moving. The traffic flowed over the river, regardless of whether the reason was steel or stone or words.

  Elias placed his hands on the keyboard. He felt the plastic keys, solid under his fingers. They were labeled with letters that had their own history, their own lock-ins, their own accidents of manufacture that had become standard. He couldn't type outside of them.

  He deleted the simulation data. He cleared the error logs. He typed: *Geological Imperative.*

  It was true, in 1955. It was false, in 1965. It was irrelevant, now. But it was coherent.

  He hit *Print*. The machine whirred, chewing the paper, spitting out the certainty he had just manufactured. He watched the page slide into the tray, warm and dry. Outside the windowless room, the city hummed, resting on foundations that might have been sand, or steel, or simply the weight of having been named first. Elias picked up the paper. It felt heavy enough to be true. He signed his name at the bottom, locking it in for another ten years.
