      *Avoiding the "Power/Market" trap:* Don't mention bribes. Don't mention budget cuts. Focus on the *forms* and the *words*.

      *Ending:* Needs to linger. The report is submitted. The city remains. The question remains strange.

  7.  **Step-by-Step Writing Plan:**
