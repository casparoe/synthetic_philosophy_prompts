      *   *Resolution:* Elias signs off. He realizes the lock-in is in the signing.

      *Refining the "Wrong Rerun":* The prompt asks for the rerun to come out "wrong in an interesting way."
      *   Idea: The rerun produces the *same* Viaduct, but the internal logic of the simulation shows it collapsing immediately. However, the historical record says it stood. So the simulation proves it *shouldn't* have worked, but it did. Or, the simulation produces a different outcome, but the *language* available to describe it forces it to be categorized as the original outcome.
      *   Let's go with the Language Lock. He tries to simulate a ferry system. The software doesn't have a variable for "water transport" in the 1954 module because the Viaduct killed that vocabulary. He has to force it. When he does, the report writes itself as if it's describing the Viaduct anyway. The words overwrite the reality.

      *Refining the "Plastic Reasons":* The reports give different reasons. Elias notices this.
