  I used to do measurement uncertainty, and I've only recently started reading philosophy, so the 'admissable range' stuff in vagueness feels familiar, but I'm stuck. If supervaluationism says a vague sentence is determinately true only when it's true under every admissible precisification, then for borderline cases it's not determinately true because some precisifications make it false. But if the set of admissible precisifications is itself vague, doesn't the theory just recurse? And if it's not vague, doesn't that sharp boundary just look like an epistemic fact we don't know? What's the difference, other than supervaluationists just assuming the set of admissible precisifications is sharp?
