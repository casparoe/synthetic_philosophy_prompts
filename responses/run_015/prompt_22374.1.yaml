answer: |-
  You have hit on one of the most sophisticated and persistent objections to supervaluationism. In the literature, this is known as the **Problem of Higher-Order Vagueness**.

  Given your background in measurement uncertainty, your intuition is spot-on. In metrology, if you define an "admissible range" (like a confidence interval), you usually rely on a higher-order standard to define the bounds of that range (e.g., a 95% confidence level). If *that* standard is fuzzy, your uncertainty analysis recurses.

  Philosophers of language have been wrestling with exactly this worry for 50 years. Here is the breakdown of why you are stuck, how supervaluationists try to escape, and where the actual difference lies between them and the epistemicists.

  ### 1. The Recursion Problem (Higher-Order Vagueness)
  You asked: *"If the set of admissible precisifications is itself vague, doesn't the theory just recurse?"*

  **Yes, it does.** This is the standard objection.
  *   **First-order vagueness:** Is Bob tall? (Borderline)
  *   **Second-order vagueness:** Is this precisification of "tall" admissible? (Borderline)

  If the boundary between "admissible" and "inadmissible" precisifications is fuzzy, then supervaluationism cannot determine truth values even for the sentence "It is determinately true that Bob is tall." To fix this, you would need a "super-supervaluation," and so on ad infinitum.

  **The Supervaluationist Response:**
  Most supervaluationists (like Kit Fine, who founded the theory) concede that higher-order vagueness is a problem. However, they argue that **vagueness must stop somewhere** for language to function.
  *   They argue that while the *predicate* ("tall") is vague, the *meta-language* we use to describe the admissibility of precisifications can be treated as precise for the sake of the model.
  *   They claim this doesn't mean the world is sharp; it means our *model of the semantics* requires a sharp cutoff to avoid infinite regress. It is a "theoretical sharpness," not an "ontological sharpness."

  ### 2. The Epistemicism Charge
  You asked: *"If it's not vague, doesn't that sharp boundary just look like an epistemic fact we don't know?"*

  This is the crux of the matter. If there is a sharp set of admissible precisifications, isn't there a sharp fact of the matter about which sentences are "super-true"?

  **The Difference is Metaphysical, Not Logical:**
  *   **The Epistemicist** says: There is a sharp boundary in the **world** (or in the extension of the predicate). Bob *is* either tall or not tall. The fact exists; we just lack the cognitive access to know it. The sharpness is *ontological*.
  *   **The Supervaluationist** says: There is **no fact of the matter** in the world. Bob is neither tall nor not tall. The "sharp boundary" exists only in the **semantic model** we use to analyze the language. The sharpness is *methodological*.

  **Analogy from Measurement:**
  *   **Epistemicism:** Imagine you are measuring a length. There is a "true length," but your instrument has noise. You don't know the true length, but it exists.
  *   **Supervaluationism:** Imagine you are asked to measure "fluffiness." There is no single "true length" of fluffiness. There are many valid ways to operationalize "fluffiness" (density, volume, texture). A statement is "determinately true" only if *every* valid operationalization agrees. If they disagree, there is no truth value. The "set of valid operationalizations" might have a sharp boundary in your lab protocol, but that doesn't mean "fluffiness" itself has a sharp boundary in nature.

  ### 3. Why Supervaluationists Deny They Are Epistemicists
  The supervaluationist argues that even if the *set* of admissible precisifications is sharp, it does not generate a sharp boundary for the object-level predicate.

  *   **Epistemicism:** For any $x$, $F(x)$ is either True or False. (Bivalence holds).
  *   **Supervaluationism:** For borderline $x$, $F(x)$ is **Indeterminate**. (Bivalence fails).

  Even if the *criteria* for admissibility are sharp, the *result* for a borderline case is a truth-value gap, not a hidden truth.
  *   **Epistemicist:** "Bob is tall" is True (we just don't know).
  *   **Supervaluationist:** "Bob is tall" is neither True nor False.

  So, the difference isn't whether the *theory* has sharp boundaries (both do); it's whether the **target of the theory** (reality/language) has sharp boundaries.
  *   Epistemicists say reality is sharp.
  *   Supervaluationists say reality is fuzzy, but our logic needs sharp tools to describe the fuzziness.

  ### 4. Where the Theory Struggles (Validating your stuckness)
  You are right to feel stuck because many philosophers think the supervaluationist defense is weak here.

  1.  **The "Arbitrary Boundary" Objection:** If the set of admissible precisifications is sharp, what determines the edge? Why is *this* precisification admissible and *that* one (which differs by a nanometer) inadmissible? If the supervaluationist says "It's just a brute fact about language," they start sounding a lot like epistemicists who say "It's just a brute fact about the world."
  2.  **Iterative Supervaluationism:** Some have tried to fix the recursion by making the theory iterative (precisifications of precisifications). But this gets mathematically messy and often collapses back into epistemicism or degree theory.
  3.  **Contextualism:** Because of the problem you identified, many modern philosophers (like Diana Raffman or Stewart Shapiro) have moved toward **Contextualism**. They argue the "admissible range" shifts depending on the context of the conversation. This avoids the sharp boundary problem by making the boundary dynamic rather than fixed.

  ### Summary
  Your measurement background gives you a unique advantage here. You recognize that defining an "error bar" (the admissible range) requires a meta-standard.

  *   **If you treat the meta-standard as fixed/sharp:** You risk Epistemicism (there is a real cutoff we just call "admissibility").
  *   **If you treat the meta-standard as vague:** You face infinite regress (Higher-Order Vagueness).

  **The Verdict:**
  Supervaluationism does not *solve* the problem of the sharp boundary of admissibility; it **stipulates** it to save classical logic.
  *   **Epistemicists** accept the sharpness is real (ontological).
  *   **Supervaluationists** accept the sharpness is artificial (semantic/model-theoretic) to allow us to say "It is indeterminate" without breaking logic.

  You aren't missing a subtle point; you've identified the main vulnerability of the theory. If you find the idea of a "sharp set of admissible precisifications" implausible, you might find **Degree Theories** (fuzzy logic) or **Contextualism** more satisfying, as they attempt to model the "fuzziness of the boundary" itself.
