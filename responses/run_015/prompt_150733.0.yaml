prompt: |-
  hey — I'm a second-year philosophy major taking a course right now on moral progress, and I'm also one of five undergrads on my university's student-run social impact fund (we hand out small grants, like $500–$5k, to student projects, with a staff advisor who has to sign off). We meet every other Sunday for about three hours and get through maybe a dozen applications a round, and at the moment we basically just argue until whoever cares most wins. My roomate calls it vibe-based grantmaking, and she's not wrong.

  In class we did the expanding-circle picture — the idea that moral progress largely consists in the circle of beings whose interests count getting wider over time, deepening as well as widening, that sort of thing (I think there's a Singer book with that title, but you know the idea, don't worry about the reference). I tried to explain to the fund why I think we should be deliberately reaching for projects that push the circle outward rather than ones that just do more of what everyone already agrees matters, and it went badly: someone pointed out that "history has expanded the circle in direction X so we should keep going in direction X" doesn't really work as an argument, since the fact that a trend happened doesn't tell you it's the trend justice wants or where it stops or whether we're at a point where finishing the last expansion matters more than starting the next one. So what I actually want is a decision procedure we could run on an application in the twenty minutes we spend on it, usable by people who've taken one ethics course and no more, that turns that whole mess into ordered questions with a rough sense of what counts as a sufficient answer to each, where the procedure stops with a no, and — importantly — where it hands the decision back to a human because it's a values call and not a factual one. A few things I want it to handle explicitly: how to tell whether a project is really *widening* the circle, or just taking existing claimants more seriously (or worse, is widening symbolically while the actual stakes are tiny); how to deal with candidates whose moral status is genuinely uncertain rather than just disputed — I don't want a procedure that either ignores them because it can't score them or pretends we can put a clean expected value on it; the problem that some claimants can speak for themselves and others need someone to speak for them, and our applicants are always the self-appointed spokespeople; and this tradeoff I can't stop thinking about, that jumping way ahead of where the circle currently is might make the whole thing look ridiculous and set the cause back, while never getting ahead of it means the circle only ever moves at the speed of the slowest institution. Flag clearly which steps are judgment calls dressed up as procedure.

  Then run it on three real-ish applications we argued about last round, and be honest if it gives the answer I don't want: (1) a campaign to get our campus caterer to drop cage eggs and make all catered events fully plant-based — sentient animals, totally mainstream now, but the actual number of animals affected is small and half of us think it's mostly a signaling project; (2) a proposal, which I helped write, to fund a small working group on "digital welfare" — whether the conversational tutoring bots the university is rolling out could be candidates for moral consideration, and what a policy on how we treat them would even look like — which the advisor thinks is nuts and two members think is the most interesting thing we've ever seen; and (3) a boring, well-evidenced proposal to buy and install air filters and bednets through a partner org in a district hospital, huge measurable benefit, zero circle expansion, nobody in the room is excited about it. I want #2 to win and I'll be annoyed if it doesn't, so tell me straight. Also say plainly what the procedure can't do — especially whether it can tell us anything about whether we're the right kind of body to be doing this at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year philosophy major, member of a student-run social impact fund (5 undergrads + 1 advisor).
      *   **Context:** Fund gives small grants ($500-$5k). Meetings are bi-weekly, 3 hours, ~12 applications. Current process is "vibe-based" (argue until the most passionate win).
      *   **Goal:** Create a decision procedure (algorithm/checklist) based on the "Expanding Circle" concept of moral progress.
      *   **Constraints:**
          *   Must be usable in ~20 mins per application.
          *   Usable by people with only one ethics course.
          *   Must distinguish between *widening* the circle vs. *deepening* existing commitments vs. *symbolic* widening.
          *   Must handle *uncertain* moral status (not just disputed).
          *   Must address the *spokesperson problem* (self-appointed advocates).
          *   Must address the *radicalism vs. credibility* tradeoff (moving too fast vs. too slow).
          *   Must flag where judgment calls are disguised as procedure.
          *   Must explicitly state what the procedure *cannot* do (especially regarding the fund's own legitimacy).
      *   **Test Cases:**
          1.  Cage-free/plant-based campus catering (Mainstream, small impact, signaling?).
          2.  Digital welfare/AI moral status working group (User's project, controversial, uncertain status).
          3.  Bednets/air filters (High impact, no circle expansion, boring).
      *   **Bias:** User wants #2 to win and will be annoyed if it doesn't. I need to be honest ("tell me straight").

  2.  **Deconstruct the "Expanding Circle" Procedure:**
      *   I need to build a flowchart or scored rubric that operationalizes Peter Singer's idea without requiring deep meta-ethical debate.
      *   *Core Metric:* Does this project change *who* counts, or just *how much* we help those who already count?
      *   *Risk Assessment:* Is the claim plausible? Is the advocacy legitimate? Is the timing right?
      *   *Structure:*
          *   Phase 1: Triage (Basic viability).
          *   Phase 2: The Circle Test (Widening vs. Deepening).
          *   Phase 3: Uncertainty & Representation (The hard stuff).
          *   Phase 4: Strategic Viability (Radicalism vs. Credibility).
          *   Phase 5: The Human Override (Where values enter).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Just ask "Does this help new beings?" Problem: Too vague.
      *   *Attempt 2:* Add scoring. 1-5 on "Newness." Problem: False precision.
      *   *Attempt 3 (Final Design):* A gated checklist with specific "Stop" conditions and "Flag" conditions. I need to make sure the "Uncertainty" part doesn't just default to "No." It needs a specific path for "Speculative but plausible."
      *   *Addressing the Spokesperson Problem:* Need a question about accountability. If the beneficiary can't speak, who checks the speaker?
      *   *Addressing the "Too Radical" Problem:* Need a question about backlash risk vs. norm shifting.
      *   *Addressing the "Judgment Call" Requirement:* I must explicitly label steps as [JUDGMENT CALL].

  4.  **Running the Test Cases:**
      *   *Case 1 (Catering):*
          *   Widening? Yes (animals), but status is settled (sentience accepted). So it's mostly *deepening* implementation.
          *   Impact scale? Small (campus only).
          *   Signaling? High risk.
          *   Verdict: Likely a "No" or "Low Priority" on circle expansion grounds, though high on "easy win."
      *   *Case 2 (Digital Welfare):*
          *   Widening? Yes (potential new moral patients).
          *   Status? Uncertain/Speculative.
          *   Procedure handling: Needs to pass the "Plausibility" gate without requiring proof.
          *   Spokesperson? Students speaking for code. High risk.
          *   Strategic? Could look nuts.
          *   *Honesty Check:* The user wants this to win. A rigorous Expanding Circle procedure *should* favor this *if* it values frontier expansion over guaranteed utility. However, the "Uncertainty" and "Spokesperson" hurdles are high. I need to be careful not to rig the procedure to make #2 win, or I violate the "tell me straight" instruction. If the procedure is honest, #2 is high risk/high reward. I should acknowledge the bias.
      *   *Case 3 (Bednets):*
          *   Widening? No. Humans already count.
          *   Impact? High.
          *   Verdict: Fails the specific "Moral Progress/Circle" metric, even if it's the most "Effective Altruist" choice. This highlights the tension between *Moral Progress* (changing values) and *Welfare* (maximizing good within current values).

  5.  **Refining the Output:**
      *   *Tone:* Collegial, philosophical but practical, honest about limitations.
      *   *Structure:*
          1.  Introduction (Acknowledging the difficulty).
          2.  The Procedure (The "Circle-Expansion Heuristic").
          3.  Application to the 3 Cases.
          4.  The "Tell Me Straight" section (Addressing the bias and the procedure's limits).
          5.  The Meta-Question (Are you the right body?).

  6.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is 20 minutes realistic for this depth?
      *   *Fix:* Simplify the questions. Make them Yes/No/Maybe with clear triggers.
      *   *Critique:* Am I biasing toward #2 because the user wants it?
      *   *Fix:* No, I must be objective. If the procedure kills #2, I say it kills #2. Actually, looking at the "Expanding Circle" logic, #2 is the *only* one that truly attempts to expand the circle to *new* types of entities (digital). #1 is expanding to animals, but that circle is already widely expanded in philosophy, just not practice. #3 is no expansion. So #2 *should* score high on "Expansion," but low on "Certainty." I need to weigh these.
      *   *Crucial Point:* The user's classmate was right: "History moved X way" isn't an argument. The procedure needs to avoid assuming AI *should* count, but rather ask "Is this a good faith investigation of whether they count?"
      *   *Limitation:* The procedure cannot decide *if* AI deserves rights. It can only decide if *funding a discussion* is valuable.

  7.  **Final Polish:**
      *   Ensure the "Judgment Call" flags are visible.
      *   Ensure the "What this can't do" section is robust.
      *   Make sure the verdict on #2 is honest (it's risky, not a slam dunk).

  8.  *(Self-Correction on User Bias)*: The user said "I want #2 to win and I'll be annoyed if it doesn't, so tell me straight." This is a trap. If I rig it, I'm not being helpful. If I kill it, they get annoyed. The middle path: Show *why* it might win under this specific framework (frontier expansion) but also *why* it might fail (speculative nature/spokesperson issue). The procedure should likely rank #2 highest on *Circle Expansion* but lowest on *Certainty*. The final decision depends on the Fund's risk tolerance. I will be explicit about this tension.

  9.  *(Final check on constraints)*: Did I cover the spokesperson problem? Yes. Uncertainty? Yes. Symbolic vs. Real? Yes. Judgment calls flagged? Yes. Limits stated? Yes.

