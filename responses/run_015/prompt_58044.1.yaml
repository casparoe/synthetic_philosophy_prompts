answer: |-
  # MORAL CONTEXTUALISATION PROTOCOL (MCP)

  **Purpose:** To guide panel decisions on representing morally contested figures in school settings without requiring philosophical expertise.
  **Usage:** Apply sequentially. A "FAIL" at a Stopping Point requires immediate revision of the proposed framing. A "FLAG" requires a recorded vote by the panel.

  ### STEP 1: THE FACTUAL BASELINE TEST
  **Inquiry:** Establish the action, the prevailing norm, and the harm.
  1.  What specific action or view is contested?
  2.  What was the prevailing social/legal norm at the time?
  3.  What harm resulted (then or now)?

  *   **Pass Condition:** Panel agrees on a concise factual statement (one sentence).
  *   **Stopping Point:** If the panel cannot agree on the basic facts of harm or norm, **STOP**. Do not proceed to framing. Commission a brief factual brief.
  *   **Value Judgment Flag:** None. This is factual inquiry only.

  ### STEP 2: THE DISSENT AVAILABILITY TEST
  **Inquiry:** Determine if the figure could have known better.
  1.  Was there informed dissent available at the time? (Did contemporaries object?)
  2.  Did the figure have access to this dissent?
  3.  Did the figure ignore or suppress this dissent?

  *   **Pass Condition (Explanation Allowed):** If dissent was unavailable or inaccessible, the action may be explained as "product of their time."
  *   **Stopping Point (Exoneration Blocked):** If dissent was available and accessible, **STOP**. You cannot use "product of their time" to excuse the action. You must acknowledge agency.
  *   **Value Judgment Flag:** **FLAG 1.** Determining whether available dissent was "reasonable to expect" them to adopt is a value judgment. Record the panel's reasoning.

  ### STEP 3: THE POWER AND BENEFIT TEST
  **Inquiry:** Determine if the figure benefited from the injustice.
  1.  Did the figure hold power relative to the harmed group?
  2.  Did the figure derive material, social, or political benefit from the contested action/norm?
  3.  Did they use their power to maintain the norm?

  *   **Pass Condition (Norm Authority Challenged):** If they benefited/wielded power, the prevailing norm holds less moral authority over them than over the powerless.
  *   **Stopping Point (Celebratory Framing Blocked):** If they benefited significantly from the harm, **STOP**. A purely celebratory framing (hero/exemplar) is prohibited. Framing must shift to "complex contribution" or "flawed actor."
  *   **Value Judgment Flag:** **FLAG 2.** Weighing the magnitude of benefit against the magnitude of harm is a value judgment.

  ### STEP 4: THE FRAMING INTENT TEST
  **Inquiry:** Distinguish between Contribution vs. Exemplar and Explanation vs. Exoneration.
  1.  Are we honoring a specific **contribution** (e.g., a law, a victory, a discovery) or the **person as a whole** (exemplar/hero)?
  2.  Does the text/display explain *why* they acted (context) or imply it was *okay* (exoneration)?
  3.  Is the negative context visible alongside the positive claim?

  *   **Pass Condition:** The framing explicitly separates contribution from character, or includes negative context alongside positive claims.
  *   **Stopping Point (Exemplar Claim Blocked):** If the framing presents the person as a moral model for pupils to emulate while failing Step 2 or 3, **STOP**. Revise to remove "model" language.
  *   **Value Judgment Flag:** **FLAG 3.** Deciding if a contribution is valuable enough to teach despite the harm is a value judgment.

  ### STEP 5: THE AUDIENCE SUITABILITY TEST
  **Inquiry:** Match complexity to pupil age.
  1.  Can the pupils understand the distinction between "what they did" and "why it was wrong then vs. now"?
  2.  If not, is the figure necessary for this lesson/assembly?

  *   **Pass Condition:** The nuance is accessible, or the figure is replaced with a less contested example if the nuance is too complex for the age group.
  *   **Stopping Point:** If the required nuance exceeds pupil capacity and the figure is presented as a role model, **STOP**. Simplify or replace.
  *   **Value Judgment Flag:** None. This is pedagogical judgment.

  ***

  **NOTE ON MISFIRES:** This procedure may misfire when historical evidence regarding dissent (Step 2) is ambiguous, or when the panel's own values heavily skew the "Benefit" weighting (Step 3). It relies on the panel's honesty at Flag points. It cannot resolve deep ideological disagreements about the nature of the harm itself.

  ***

  # CASE DEMONSTRATIONS

  ### CASE 1: Year 9 Lesson Opener (Thomas Jefferson)
  **Proposal:** Present Jefferson as an advocate of equality ideals while noting he enslaved people.
  **Application:**
  *   **Step 1 (Facts):** Agreed. Wrote "all men created equal"; owned 600+ enslaved people. Harm: Chattel slavery.
  *   **Step 2 (Dissent):** **PASS.** Dissent was available (Somerset case, abolitionist writings, enslaved people's resistance). He knew. *Flag 1 Raised:* Panel agrees expecting moral consistency was reasonable for a philosopher-politician.
  *   **Step 3 (Power/Benefit):** **FAIL (for pure celebration).** He benefited materially and socially from slavery. *Stopping Point Triggered:* Cannot present as moral exemplar.
  *   **Step 4 (Framing):** **REVISE.** The proposal says "advocate of equality ideals" (Contribution) but implies "model" (Exemplar).
      *   *Revision:* Frame as "Author of Equality Ideals who failed to apply them." Separate the text (Declaration) from the man (Enslaver).
      *   *Check:* Does this explain or excuse? It explains the contradiction without excusing the hypocrisy.
  *   **Step 5 (Audience):** Year 9 can handle hypocrisy/contradiction.
  **Outcome:** **APPROVED WITH REVISION.** Wording must explicitly state the contradiction, not just list facts side-by-side. Do not use him as a model of virtue.

  ### CASE 2: Corridor Display (Winston Churchill)
  **Proposal:** Celebrate Churchill for wartime leadership. No mention of empire/race.
  **Application:**
  *   **Step 1 (Facts):** Agreed. Led UK during WWII. Held views on empire/race common to era but harmful (e.g., Bengal famine policies, racial hierarchies).
  *   **Step 2 (Dissent):** **PASS.** Dissent was available (Indian independence movement, critics in parliament). He knew. *Flag 1 Raised:* Panel agrees his position gave him duty to heed dissent regarding empire.
  *   **Step 3 (Power/Benefit):** **FAIL (for pure celebration).** He wielded immense imperial power. The "wartime leadership" benefited the UK partly through imperial resources extracted under contested terms. *Stopping Point Triggered:* **Purely celebratory framing is blocked.**
  *   **Step 4 (Framing):** **REVISE.** Current display implies Exemplar ("Hero").
      *   *Revision:* Shift from "Hero" to "Wartime Leader." Add a panel: "Churchill's leadership saved Britain from invasion, but his policies upheld an empire that denied freedom to millions."
      *   *Conflict:* Natural inclination is to retain pride via pure celebration.
      *   *Decision:* The Procedure forces a cut against this inclination. Step 3 mandates that benefit from empire prevents pure celebration.
  *   **Step 5 (Audience):** Secondary pupils can handle "Leader but not Hero."
  **Outcome:** **REJECTED IN CURRENT FORM.** Must add context regarding empire/race to avoid exoneration. The display cannot be purely celebratory.

  ### CASE 3: Primary Assembly (Christopher Columbus)
  **Proposal:** Introduce Columbus as a "model explorer."
  **Application:**
  *   **Step 1 (Facts):** Agreed. Voyages to Americas. Initiated colonization, enslavement, disease spread.
  *   **Step 2 (Dissent):** **PASS.** Contemporary accounts (e.g., Bartolomé de las Casas) documented abuses early.
  *   **Step 3 (Power/Benefit):** **FAIL.** He gained titles/wealth; indigenous people suffered genocide.
  *   **Step 4 (Framing):** **FAIL.** "Model explorer" implies Exemplar.
      *   *Revision:* Can we simplify? "He sailed ships, but hurt people."
  *   **Step 5 (Audience):** **FAIL.** Primary pupils struggle to separate "brave sailor" from "good person." The nuance required to avoid exoneration (Step 2/3) is too complex for a general assembly model.
      *   *Stopping Point:* If the nuance exceeds capacity and the figure is presented as a model, STOP.
  **Outcome:** **REJECTED.** Remove as a "model." Replace with a less contested figure for "exploration" or teach in class where nuance can be managed, not assembly.

  ***

  # WHAT THE PROCEDURE CANNOT DECIDE

  1.  **Ultimate Moral Truth:** The MCP does not determine if a figure was "good" or "bad" in an absolute sense; it only determines if a specific *framing* is educationally and ethically defensible within a school context.
  2.  **Ideological Boundaries:** It cannot resolve fundamental disagreements between parents who believe certain histories should not be taught at all versus those who believe they must be centered. It only governs *how* they are presented if taught.
  3.  **Curriculum Necessity:** It does not decide if a figure is important enough to teach. A figure might pass the MCP but still be removed for curriculum space, or fail the MCP but be retained because the historical lesson requires the controversy (with heavy scaffolding).
  4.  **Future Proofing:** It cannot guarantee that today's value judgments (Flag points) will align with societal values in ten years. It records the reasoning to allow future review.
