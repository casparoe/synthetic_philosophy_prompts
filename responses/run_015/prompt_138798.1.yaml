prompt: |-
  Hi — I'm a novelist, not an academic, and I've somehow let myself be talked into running a forty-five minute session at a writers' festival in the spring: about thirty other novelists, no slides, me and a flipchart and a room that will have had lunch. It's being billed as Can Your Characters Agree to Disagree?, and the thing I actually have to get across in the middle of it is the common prior assumption in Bayesian epistemology — not the maths, god knows, I've no maths — but the intuition that two perfectly rational people who trust each other and who tell each other everything they know shouldn't be able to end up still disagreeing, the famous result that says they can't, and the assumption underneath doing all the work.

  Don't explain it to me, I've read around a bit. Plan how I should teach it.

  What I especially want from you is the dependency structure: what has to be in place before the assumption even means anything, and why. My sense is that people will hear prior and file it under starting belief or prejudice, and once it's filed that way the rest of the session is unrecoverable, so I need to know what to put in their heads first so that a prior lands as the thing you'd believe if the only difference between you were the evidence you'd each seen.

  The carrying example has to be fiction-shaped, because these are novelists. Mine is from my own draft: two women who've been friends since they were eleven, one of them thinks the other's brother is lying about where he was that night, each of them has private evidence, and they've told each other most of it but not all. There is no moment in time when they shared a prior — they've known each other forty years — so I need the sequence arranged so that the prior feels like a counterfactual rather than a point in time, or the whole thing collapses the second someone in the third row asks when the prior got set. Tell me what that example must contain and what it must not contain, and if it's the wrong one, say so and give me the right one.

  Misconceptions I'm betting on, and I want each defused at the right point in the sequence rather than all at the end: prior as prejudice; the assumption being that everyone begins with the same opinions; it's a claim about how people actually reason, therefore obviously false, therefore who cares; if it's true then every disagreement in fiction is irrational and there goes drama, which is the one that will make the room turn on me; rational people with the same evidence must agree; and the clever dodge, somebody will say people just have different values and that settles it, and I want that headed off wherever it does least damage rather than wherever it's most fun to argue with.

  I also want to use the no-trade thing — two people sharing a prior shouldn't both be able to expect to win a bet — because writers understand a wager in a scene in a way they won't understand a theorem. Where does that go: is it the thing that carries the session, or the payoff at the end?

  What should I openly refuse to explain at this level and say out loud that I'm refusing? And give me one question to put to them at the end that tests whether they actually picked up the assumption rather than the slogan — ideally something they can answer about whatever they're working on at the moment, since that's the only version of the idea they'll retain past the weekend.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist, not academic. Running a 45-minute session at a writers' festival.
      *   **Audience:** ~30 novelists, post-lunch (low energy), no slides, flipchart only.
      *   **Topic:** "Can Your Characters Agree to Disagree?" focusing on the *Common Prior Assumption* (CPA) in Bayesian epistemology (Aumann's Agreement Theorem intuition).
      *   **Goal:** Teach the *intuition* of CPA, not the math. Specifically, that rational agents with common priors and common knowledge of posteriors cannot disagree.
      *   **Key Constraint:** Avoid the "prior = prejudice/start point in time" misconception. Needs to be framed as a counterfactual ("what you'd believe if...").
      *   **Example:** User's draft (two female friends, 40 years, brother lying about alibi). Needs validation/refinement regarding the "no shared moment in time" issue.
      *   **Misconceptions to Defuse:** Prior as prejudice; same opinions vs. same processing; descriptive vs. normative; drama death (disagreement = irrational); same evidence = same belief; different values dodge.
      *   **Tool:** No-trade theorem (betting). Where does it fit?
      *   **Output Needs:** Dependency structure (what must come before what), Example requirements (must/must not), Placement of no-trade, What to refuse to explain, Final testing question.

  2.  **Deconstruct the Core Concept (Common Prior Assumption):**
      *   *What is it?* It's not that we *did* start the same. It's that our differences in belief are *solely* attributable to differences in evidence, not differences in how we process the world.
      *   *Why is it hard?* People think "prior" means "childhood belief." It actually means "likelihood function + initial state." For writers, it's "Worldview/Logic Engine."
      *   *The "Agreement Theorem" Intuition:* If I know *why* you believe X, and I trust your brain works like mine (just fed different data), I must update my belief to match yours. If we still disagree, one of us thinks the other is irrational/biased.
      *   *The "No-Trade" Corollary:* If we share a prior, I can't think I'm smarter than the market (or you). If you sell, I shouldn't buy, because your selling tells me you know something I don't.

  3.  **Address the Dependency Structure (The "What Before What"):**
      *   *Problem:* If I say "Prior" first, they hear "Bias."
      *   *Solution:* Start with "Rationality" defined as "Processing Rule."
      *   *Sequence:*
          1.  Define Rationality (not smart, just consistent).
          2.  Define Evidence (private information).
          3.  Define the "Engine" (the thing that turns Evidence into Belief).
          4.  *Then* introduce "Common Prior" as "Same Engine."
          5.  *Then* introduce the Theorem (Same Engine + Shared Evidence Info = Same Belief).
          6.  *Then* apply to Fiction (Disagreement requires breaking one of these).

  4.  **Evaluate the User's Example (The Two Friends):**
      *   *Pros:* High stakes, long history (emphasizes the "no specific start time" issue), private evidence (classic epistemic tension).
      *   *Cons:* 40 years of history makes "common prior" feel impossible.
      *   *Fix:* Frame the "Prior" not as age 11, but as "The Friendship Contract." The assumption they make about *each other's minds*.
      *   *Must Contain:* Explicit statement that they trust each other's *competence* (not just honesty). Explicit statement that they know the other has *private data*.
      *   *Must Not Contain:* Emotional stakes driving the belief (e.g., "I want him to be guilty"). That's *values*, not *priors*. (Need to handle the values objection carefully).
      *   *Verdict:* It's the right example *if* framed correctly. The "40 years" is actually a feature, not a bug, because it forces the counterfactual definition. "If we were identical processing machines..."

  5.  **Handle the Misconceptions (Sequencing):**
      *   *Prior as Prejudice:* Defuse immediately by renaming it "The Engine."
      *   *Same Opinions:* Clarify "Same Processing Rules" vs. "Same Inputs."
      *   *Descriptive vs. Normative:* Crucial. This isn't how people *do* act; it's how *logical characters* *must* act to remain rational.
      *   *Drama Death:* This is the climax. Disagreement *is* drama, but it requires a breach of trust/rationality.
      *   *Different Values:* Head this off before the betting example. Values = Utility Function. Priors = Probability Engine. Keep them separate.

  6.  **Placement of the No-Trade Theorem:**
      *   Writers understand stakes and gambling.
      *   It works best as the *proof* of the intuition.
      *   *Placement:* Middle/End transition. Use it to solidify why disagreement implies someone thinks the other is "broken."
      *   *Decision:* Make it the pivot. "If you really believe you're right and they're rational, why aren't you betting?"

  7.  **What to Refuse to Explain:**
      *   The Math (Aumann's proof).
      *   Common Knowledge recursion (I know that you know that I know...). Just call it "Transparent Cards."
      *   Measure Theory/Probability Spaces.

  8.  **The Final Question:**
      *   Needs to be actionable for their WIP (Work In Progress).
      *   Needs to test if they understand the *condition* for disagreement.
      *   *Draft:* "Why don't your characters agree?" -> Too vague.
      *   *Better:* "What specific piece of information does Character A think Character B is ignoring?"
      *   *Best:* "Which character thinks the other is broken?" (Tests the rationality breach).
      *   *Refined:* "In your current scene, if Character A truly believed Character B was as smart and honest as themselves, what belief would A be forced to abandon?"

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Tone:* Peer-to-peer, practical, slightly subversive (using math to fix plot holes).
      *   *Flipchart Usage:* Essential. Visualize the "Engine."
      *   *Timing:* 45 mins is tight. Need strict pacing.
      *   *The "Prior" Trap:* I need to give the user specific language to avoid the word "Prior" until late in the game. Call it "The Machine" or "The Lens."

  10. **Refining the "Values" Objection:**
      *   User wants this headed off where it does least damage.
      *   If I bring it up early, it distracts. If I bring it up late, it undermines the conclusion.
      *   *Strategy:* Pre-empt it during the definition of Rationality. "Rationality is about truth, not desire."
      *   *Wait, better:* Address it right before the Betting example. Betting requires aligned values (money). If they value different things, they can bet. So, specify the bet is on *truth*, not *outcome*. Or, simply state: "We are talking about beliefs about the world, not desires for the world."

  11. **Final Polish of the Dependency Structure:**
      *   1. Rationality = Consistency (not correctness).
      *   2. Belief = Output of (Evidence + Engine).
      *   3. Common Prior = Shared Engine.
      *   4. Common Knowledge = Shared Evidence *about* Evidence.
      *   5. Theorem = Shared Engine + Shared Evidence Info = Shared Output.
      *   6. Fiction Application = Disagreement = Broken Engine or Hidden Evidence.

  12. **Review against constraints:**
      *   No slides? (Check, flipchart only).
      *   Post-lunch? (Keep it interactive/story-based).
      *   Novelist focus? (Focus on character motivation/plot).
      *   Dependency structure explicit? (Yes).
      *   Example vetted? (Yes).
      *   Misconceptions mapped? (Yes).
      *   No-trade placement? (Pivot point).
      *   Refusals listed? (Yes).
      *   Final question? (Yes).

  13. **Self-Correction on the "Prior" terminology:**
      *   The user says people will file "prior" under "prejudice."
      *   *Advice:* Don't use the word "Prior" until you have to. Call it "The Algorithm" or "The Lens." Only introduce the jargon at the end as a label for what they already understand.
      *   *Wait, the prompt asks specifically about the Common Prior Assumption.* I should probably use the term but define it heavily. Let's suggest using a metaphor first ("The Factory Settings") then mapping the term to it.

  14. **Final check on the "Values" dodge:**
      *   "People just have different values."
      *   If Character A wants the brother guilty (justice) and B wants him innocent (loyalty), that's values.
      *   The theorem applies to *beliefs* (Is he guilty?), not *preferences* (Do we want him guilty?).
      *   *Instruction:* Make sure the example is about *fact* (Where was he?), not *judgment* (Should he be punished?). The user's example is "lying about where he was." That is factual. Good. I need to ensure the user keeps it factual.

  15. **Constructing the Output:** (Organizing into the requested sections: Dependency Structure, Example Vetting, Session Flow, Misconception Defusal, No-Trade Placement, Refusals, Final Question).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like an academic telling a novelist what to do. The tone must be "Here is the tool, here is how you wield it." The dependency structure needs to be very clear about *why* order matters.

  *Key Insight:* The "Common Prior" isn't a historical event. It's a claim about *interchangeability*. If I swapped your brain for mine, would you believe what I believe? If yes, Common Prior holds. If no, we have different priors. This is the counterfactual framing the user asked for. I will emphasize this.

  *Final check on the "No-Trade" theorem:* It's the "Payoff." It makes the abstract concrete. If you disagree, bet on it. If you won't bet, you don't really disagree (or you think the other is irrational). This fits the "Drama" angle perfectly. Drama is when the bet is too high to make.

  Okay, ready to write.s
answer: |-
  Here is the plan. It is designed for a post-lunch room of creatives who are allergic to jargon but hungry for structural tension.

  ### 1. The Dependency Structure
  You cannot introduce the **Common Prior** until you have defined **Rationality** and **Evidence** in specific, non-colloquial ways. If you skip these steps, "Prior" defaults to "Prejudice."

  **The Chain of Custody:**

  1.  **Rationality $\neq$ Smartness.**
      *   *Why:* If they think rationality means "being correct," the theorem fails immediately (people are often wrong).
      *   *Definition:* Rationality is **consistency**. It means your beliefs update predictably when you see new evidence. It means you don't hold two contradictory facts as true.
      *   *Flipchart:* Draw a machine. Input: Evidence. Output: Belief. Rationality = The machine doesn't jam.

  2.  **Belief $\neq$ Opinion.**
      *   *Why:* "Opinion" implies taste. "Belief" implies a map of reality.
      *   *Definition:* We are only talking about factual claims (e.g., "He was at the bar"), not value judgments (e.g., "He is a bad brother").
      *   *Flipchart:* Write "Fact" on one side, "Value" on the other. Circle "Fact." Cross out "Value."

  3.  **The Engine (The "Prior" Proxy).**
      *   *Why:* You must avoid the word "Prior" until the end. "Prior" sounds like history. "Engine" sounds like function.
      *   *Definition:* The rule set you use to process evidence. If I see smoke, I think fire. If you see smoke, do you think fire? Or do you think special effects?
      *   *Flipchart:* Draw two identical machines. Label them "Processing Rules."

  4.  **Common Knowledge of Evidence.**
      *   *Why:* It's not enough to *have* the evidence; you have to *know the other person has it*.
      *   *Definition:* I know what you know. I know that you know what I know.
      *   *Flipchart:* Draw two characters holding cards. Turn the cards face up.

  5.  **The Common Prior Assumption (The Reveal).**
      *   *Why:* Now you can name it. It is the claim that **Step 3 (The Engines) are identical.**
      *   *Definition:* It is not that we *started* the same. It is that if I swapped my brain for yours, keeping your evidence, I would believe what you believe. It is a claim of **interchangeability**, not history.

  6.  **The Agreement Theorem.**
      *   *Why:* The result.
      *   *Definition:* If Engines are Identical + Cards are Face Up $\rightarrow$ Beliefs must Match.

  7.  **The Fictional Consequence.**
      *   *Why:* The payoff.
      *   *Definition:* If your characters disagree, one must think the other's Engine is broken (irrational) or is hiding a card (lying).

  ---

  ### 2. Vetting Your Example (The Two Friends)
  Your example is strong, but it contains a trap. The "40 years history" is a double-edged sword. It creates emotional weight, but it invites the "they grew up differently" objection.

  **What the example MUST contain:**
  *   **Factual Disagreement:** Keep it strictly on *where the brother was*. Do not let it drift into *whether he deserves punishment*. (This pre-empts the Values dodge).
  *   **Mutual Competence:** Both women must regard the other as equally sharp, equally honest, and equally invested in the truth. If Character A thinks Character B is "too emotional to see straight," the Common Prior is already broken, and the theorem doesn't apply. You need them to respect each other's "Engines."
  *   **The Counterfactual Frame:** You must explicitly narrate this: *"It doesn't matter that they met at age eleven. The question is: If Character A had Character B's private evidence, would she believe Character B's conclusion? If yes, they share a prior. If no, they don't."*

  **What the example MUST NOT contain:**
  *   **Conflicting Desires:** Do not let one want him caught and the other want him free. That is *Utility*, not *Probability*. That kills the theorem.
  *   **Secret Evidence they won't share:** The theorem requires them to *tell* each other everything. The tension must come from them having told each other everything *and still disagreeing*. (This is where the drama lives: "I told you everything, I trust you, you trust me, so why are we still apart?")
  *   **A Specific "Start Time":** Do not try to locate when the prior was set. Describe it as "The terms of their friendship."

  **Verdict:** Keep the example. It is better than a generic one because the longevity highlights the counterfactual nature of the assumption.

  ---

  ### 3. Session Flow (45 Minutes)

  **0:00 – 0:05: The Hook (The Bet)**
  *   Start with the No-Trade Theorem immediately. It grabs attention.
  *   "If you and I disagree on whether it will rain, and I trust your brain as much as mine, why wouldn't I take your bet? If you're willing to bet, you must know something I don't. So I should update my belief to match yours and not bet."
  *   "In fiction, we write disagreements all the time. Today we're asking: When is a disagreement actually a plot hole?"

  **0:05 – 0:15: Building the Machine (Dependencies 1-3)**
  *   Flipchart: Draw the "Belief Engine."
  *   Define Rationality as Consistency.
  *   Define the "Prior" as "Factory Settings" (but emphasize it's a *type* of machine, not a *date*).
  *   **Crucial Move:** Ask the room: "Who here has a friend you trust completely, but who votes differently than you?"
  *   Explain: "Aumann says if you truly trust their *rationality* (not their values), and you've shared all your *facts*, you shouldn't vote differently. You should assume they saw a fact you missed."

  **0:15 – 0:25: The Example (Dependencies 4-5)**
  *   Run your Two Friends scenario.
  *   Walk through the evidence exchange.
  *   "They tell each other everything. They trust each other's brains. Yet they disagree."
  *   "According to the math, this state is unstable. It is a singularity. Something has to give."

  **0:25 – 0:35: The Break (Dependency 7)**
  *   This is where you solve the "Drama Death" misconception.
  *   "Does this mean disagreement is impossible? No. It means disagreement is **violent**."
  *   "For them to keep disagreeing, one of them must decide the other is **broken**."
  *   "The drama isn't in the disagreement. The drama is in the moment Character A looks at Character B and thinks: 'You are usually so smart. Why are you being stupid about this?'"
  *   "The Common Prior Assumption forces you to choose: Either they share the truth, or they stop trusting each other's minds."

  **0:35 – 0:40: The Values Dodge (Pre-emptive Strike)**
  *   "Someone is thinking: 'But they want different things.' "
  *   "If they want different things (Values), they can disagree forever. But we are talking about *what happened* (Facts)."
  *   "If your characters are arguing about facts, but it's actually about values, write that. That's subtext. But don't call it an epistemic disagreement."

  **0:40 – 0:45: The Close & The Question**
  *   Summarize the tool.
  *   Ask the Final Question (see below).

  ---

  ### 4. Handling the Misconceptions (Sequence Matters)

  1.  **Prior as Prejudice:** Defused in **0:05–0:15**. By calling it an "Engine" or "Processing Rule" first, you detach it from "childhood bias." When you finally say "Prior," it maps to the Engine, not the history.
  2.  **Same Opinions vs. Same Processing:** Defused in **0:05–0:15**. Use the voting example. Same engine + different data = different opinion. Same engine + same data = same opinion.
  3.  **Descriptive vs. Normative:** Defused in **0:25–0:35**. "This isn't how people *do* act. It's how *logical* characters *must* act. If they don't, you must show us the break in logic."
  4.  **Drama Death:** Defused in **0:25–0:35**. Disagreement becomes a signal of relationship fracture, not just a difference of view. It raises the stakes.
  5.  **Different Values:** Defused in **0:35–0:40**. Explicitly separate Fact (Probability) from Desire (Utility).
  6.  **Rational People with Same Evidence Must Agree:** This is the core theorem. Reinforce it in **0:25**.

  ---

  ### 5. The No-Trade Theorem: Placement
  **Use it as the Pivot (0:05 and 0:25).**
  *   **Opening:** Use it to hook them. Writers understand wagers. "If you know they're smart, and they bet against you, you fold."
  *   **Middle:** Use it to prove the tension. "If your characters aren't willing to bet on their truth, they don't believe it. If they are willing to bet, they think the other is irrational."
  *   **Why not the end?** The end needs to be about *application* to their manuscripts. The bet is the *mechanism*, not the *goal*.

  ---

  ### 6. What to Refuse to Explain
  Say this explicitly: *"I am not going to explain Common Knowledge recursion. I am not going to draw the probability trees. I am not going to define 'rational' in the economic sense of self-interest. We are treating 'rational' as 'truth-seeking machine.' If you want the math, read Aumann. If you want the plot hole, stay here."*

  This protects you from the one person in the room who *is* an academic or a game theorist and tries to derail you with technicalities about "common knowledge of posteriors."

  ---

  ### 7. The Final Question
  You need a question that forces them to apply the **Common Prior** condition to their WIP. It must test if they understand that disagreement implies a breach of trust in the other's rationality.

  **Do not ask:** "Do your characters agree?" (Too simple).
  **Do not ask:** "What is their prior?" (Too jargon-heavy).

  **Ask this:**
  > "Go to the main conflict in your current draft. Identify the moment your protagonist decides their antagonist is **wrong**. Now ask yourself: At that exact moment, does your protagonist believe the antagonist is **lying**, or do they believe the antagonist is **broken**?"

  **Why this works:**
  *   If "Lying": They think the antagonist has hidden evidence (Violates Common Knowledge).
  *   If "Broken": They think the antagonist's Engine is different/flawed (Violates Common Prior).
  *   If "Neither": They shouldn't be disagreeing (Violates the Theorem).
  *   It forces them to categorize the *source* of the conflict using the tools you just gave them.
