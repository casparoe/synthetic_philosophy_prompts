answer: |-
  The seminar must demonstrate that population axiology faces a structural trilemma where avoiding one counterintuitive result inevitably generates another, regardless of how we adjust welfare thresholds. This approach ensures students grasp the impossibility nature of the problem without getting bogged down in formal proofs, focusing instead on the structural failures of aggregative theories under scaling conditions.

  **Segment 1: The Instability of Average Utilitarianism (0–20 minutes)**
  Begin by challenging the assumption that Average Utilitarianism (AU) safely avoids counterintuitive outcomes. Walk students through a scaling argument showing how AU collapses into a Repugnant Conclusion-like result when populations grow large enough to dilute high-average welfare across a massive cohort. Use a simple numerical example on the board: start with a small population at high welfare, then demonstrate how adding a sufficiently large number of lives at a slightly lower (but still positive) welfare level can manipulate the average in ways that force AU to prefer the larger, less flourishing population to maintain statistical stability.
  *   **Head Off Misconception 1:** At minute 15, explicitly state that this collapse is not about resource scarcity but about the mathematical properties of averaging over variable populations.

  **Segment 2: Total Utilitarianism and the Sadistic Conclusion (20–40 minutes)**
  Pivot to Total Utilitarianism (TU) as the standard alternative. Explain that while TU avoids the previous averaging problem, it generates the Sadistic Conclusion as its mirror-image failure. Illustrate this by showing how TU might prefer adding lives with negative welfare if doing so allows for a greater aggregate sum elsewhere, or conversely, how it forces the acceptance of vast populations with barely worth-living lives to maximize the total sum. Emphasize that this is not a bug of implementation but a feature of total aggregation.
  *   **Head Off Misconception 2:** At minute 35, clarify that the Sadistic Conclusion is not about intentional cruelty but about the structural priority of sum-maximization over quality thresholds.

  **Segment 3: Critical-Level Utilitarianism and the Welfare Dial (40–70 minutes)**
  Introduce Critical-Level Utilitarianism (CLU) as the proposed middle path that sets a positive threshold for lives to count toward the good. Deploy the "Welfare Dial" scenario: a planner allocates finite computational resources to generate digital minds. Option A produces one million minds at +100 welfare units. Option B produces one trillion minds at +ε welfare units, where ε is just barely above a technologically adjustable critical threshold *c*.
  *   **Setup:** Explain that the threshold *c* is not fixed by biology but by the system's capacity to define a "life worth starting."
  *   **Structural Visibility:** Show that even if ε is raised significantly (e.g., to +50), if the population size scales exponentially against the threshold, the total value of Option B still swamps Option A. This makes visible that the difficulty is structural, not merely a contrast between "bliss" and "drudgery."
  *   **Head Off Misconception 3:** At minute 55, during the Dial analysis, explicitly warn students against conflating the critical level *c* with a biological "minimum viable life." Emphasize that *c* is a normative cutoff for moral significance, not a physiological survival limit.
  *   **Head Off Misconception 4:** At minute 65, demonstrate that raising the threshold *c* does not eliminate the problem but merely relocates it; if capacity expands, the repugnant option returns at the new margin.

  **Segment 4: Check-for-Understanding and Variable Value (70–85 minutes)**
  Pose the following question to the class: "In the Welfare Dial scenario, suppose technological capacity suddenly doubles, allowing you to raise the critical threshold *c* from +10 to +20 without reducing the maximum possible population size. Do you switch your preference from the enormous population to the flourishing one, or do you maintain your ranking based on the new total well-being?"
  *   **Objective:** Force students to see whether their intuition tracks total well-being or merely avoids crossing the line. If they switch, they admit the threshold was arbitrary; if they stay, they admit the threshold doesn't solve the aggregation problem.
  *   **Head Off Misconception 5:** At minute 80, during the discussion of their answers, point out that variable-value theories still generate a Repugnant Conclusion at the margin when the threshold itself shifts with capacity. Make clear that no static threshold resolves the dynamic scaling issue.

  **Segment 5: Exclusions and Wrap-Up (85–90 minutes)**
  Conclude by summarizing the trilemma: AU, TU, and CLU all fail under specific scaling conditions. Explicitly state what is left out of this seminar to maintain focus: do not attempt the full formal proof of the impossibility theorems, and do not draw any analogy to ecological carrying-capacity arguments. The former is too technical for this conceptual overview, and the latter risks conflating moral value with physical resource limits, which obscures the axiological problem. Assign reading on Blackorby, Bossert, and Donaldson for the formal treatment in the next session.
