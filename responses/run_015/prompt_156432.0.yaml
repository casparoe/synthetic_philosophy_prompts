      *   *The "Smuggling" point:* Crucial. If researchers claim neutrality while optimizing for "helpfulness" based on US-centric data, they are engaging in politics.
      *   *Conclusion:* Keep (1) and (5), Reject (6). Refine (2) to allow for procedural benchmarks.

  10. **Final Polish:** Ensure tone is respectful, philosophical, and technically grounded. Make sure to explicitly answer "Which step to reject?" and "What does it cost?"

