answer: |-
  The residue supports your suspicion that the philosophical threshold is empirically indeterminate, while confirming your friend's claim that your framework lacks the operational category for inviolability.

  **Translation and Correction**
  First, a correction on Nozick: he does not definitively endorse the hybrid view as settled doctrine, nor does he conclusively assert that "plan-shaping" is the sole ground for rights; rather, he presents this combination (utilitarianism for animals, Kantianism for persons) as a plausible model that captures common moral intuitions, while explicitly leaving the foundation of rights as an open question. Translated into your vocabulary:

  1.  **Aggregative Treatment of Animals:** This maps cleanly to **Harm-Benefit Analysis (HBA)**. In your committee work, individual animal suffering is quantified (severity), summed across the cohort (numbers), and weighed against potential scientific or societal benefits. The individual is a unit of account; if the aggregate benefit outweighs the aggregate harm, the protocol is approved.
  2.  **Side Constraints on Persons:** This maps to **Absolute Regulatory Prohibitions**. In human research ethics, this is informed consent or the prohibition of non-consensual harm regardless of benefit. In your animal welfare framework, there is no direct equivalent; the closest approximation is a statutory ban on specific procedures or species (e.g., using great apes), which functions as a hard stop rather than a weighted variable.
  3.  **Plan-Shaping Capacity:** This maps to **Cognitive Complexity and Behavioral Flexibility**. In your data, this appears as the strength of preference in motivation tests, the complexity of coping strategies in the Behaviour domain, and the capacity for environmental control. It is measured as a gradient (e.g., how many presses a hen will perform for dust-bathing) rather than a binary state.
  4.  **Uncertainty About Grounds:** This maps to **Unvalidated Ethical Weighting Factors**. Your framework acknowledges uncertainty in how to weight different welfare indicators or how to compare suffering across species, but it lacks a formal mechanism to determine *why* a specific score should trigger a prohibition rather than just a mitigation requirement.

  **Residue Report**
  *   **Clean Landing:** The **Aggregative Treatment** translates perfectly to **Harm-Benefit Analysis**. Both operate on the principle that suffering can be compensated for by greater good, provided the net sum is positive. Your friend is correct that this is utilitarianism in practice.
  *   **Bent Out of Shape:** The **Side Constraints** translate poorly. In your framework, constraints are procedural (Refinement) or regulatory (bans), not inherent to the subject's status. A "side constraint" implies the being cannot be used *even if* welfare is optimized and benefit is high; your framework only prohibits use if welfare falls below a threshold or the procedure is legally banned, not because the subject possesses a specific status.
  *   **No Expression:** The **Status/Inviolability** itself has no expression. Your indicators (Five Domains) measure *how well* an animal is doing, not *what* the animal is in a moral sense. There is no metric for "rights-bearing entity." Consequently, the **Plan-Shaping Capacity** translates as a continuum of cognitive capability, but your framework lacks the logical operator to convert a high score on that continuum into a side constraint.

  **Analysis of the Residue**
  The residue supports your suspicion that the philosophical distinction relies on a binary threshold your data renders as a continuum. Your welfare metrics (motivation tests, coping ability) show degrees of cognitive complexity and behavioral need across species, but they do not reveal a natural breakpoint where "utilitarian calculation" must switch to "inviolable status." Because your data presents capacity as a gradient, the philosophical claim that there is a specific threshold grounding rights appears indeterminate from within your discipline. However, the residue also validates your friend's observation that your framework is conceptually unable to represent the thought that a being may not be used however well the use pays. Your system is designed to optimize use (Refinement) and justify it (Harm-Benefit), not to forbid it based on status.

  For your friend's reading to be right—that welfare science is impoverished rather than the philosophy being indeterminate—your discipline would need to identify a specific, measurable qualitative shift in cognitive or affective capacity that correlates with moral status, and your institutional practice would need to treat that threshold as a binding prohibition rather than a variable in a calculation. Currently, welfare science measures the *cost* of use, not the *permission* for use.

  **Confidence and Uncertainty**
  I am highly confident in the translation of Nozick's aggregative view to Harm-Benefit Analysis and in the assessment that welfare metrics operate on continua rather than binary thresholds. The point I am least sure of is the claim that institutional harm-benefit analysis *never* consults a threshold; some jurisdictions impose absolute severity limits or species bans that function similarly to side constraints, though these are regulatory impositions rather than derivations from welfare data itself.
