      *   *Resolution:* The key is *path dependence*. You can't just "know" the outcome. You have to live the path. The VIP says "respect what she wants now (informed)." She wants "not to start." CEV says "respect who she becomes." She becomes someone who glad she started.
      *   *Scenario Idea:* Learning a difficult skill that changes identity. Music? Language? Martial arts? Let's go with something immersive. Learning a craft that requires suffering/boredom initially but transforms valuation.
