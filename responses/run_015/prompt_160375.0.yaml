  | Requirement | Case Showing Necessity | Status |
  | :--- | :--- | :--- |
  | **Boundary Definition** | Dam vote: locals (80% against) vs. nation (52% for) vs. downstream neighbors. | Non-negotiable |
  | **Shadow Demos Inclusion** | Long-term non-citizen residents subject to laws but excluded from votes. | Non-negotiable |
  | **Will vs. Want/Good** | Voters want X, regret X later, or were objectively better off without X. | Non-negotiable |
  | **Unexpressed Will Adjudication** | Leader claims mandate from "silent majority" without polls or votes. | Non-negotiable (Functional) |
  | **Intensity & Settledness** | 51% indifferent vs. 49% rioting; mood vs. settled conviction. | Preference (Populist) |
  | **Aggregation Consistency** | Majority for A, majority for B, majority against A+B (cycling). | Non-negotiable |
  | **Temporal Stability** | Current voters impose pension reforms hated by 2060 populace. | Non-negotiable |
  | **Empirical Checkability** | Claim must be falsifiable without ruling all real-world claims false. | Non-negotiable |

  The jointly unsatisfiable subset is Empirical Checkability, Unexpressed Will Adjudication, and Aggregation Consistency. To check a claim without expressed data, you must impute preferences. Once you impute preferences to resolve the "silent majority," you introduce an interpreter whose combination rules inevitably trigger cycling paradoxes or collapse into paternalism. You cannot have a falsifiable test for invisible data that also respects logical consistency in aggregation.

  Empirical Checkability does the most work excluding candidates. It immediately disqualifies the "Single Subject" view, as a metaphysical will cannot be measured against a leader's claim without circularity. It also strains the "Informed Will" view, since counterfactual information states are unobservable. Only aggregative majoritarianism survives checkability, but it fails the Unexpressed Will requirement. Checkability forces a choice between measurable emptiness or unmeasurable substance.

  **Theory Scores**

  *   **Aggregative Majoritarian:** Passes checkability and consistency, but fails to adjudicate unexpressed will or intensity.
  *   **Deliberative:** Handles will formation well, but fails checkability due to indefinite timelines and lack of clear endpoints.
  *   **Single Subject:** Fails checkability entirely; offers no mechanism to falsify the leader's claim against reality.
  *   **Informed Will:** Collapses will into good, violating the distinction between what people want and what suits them.
