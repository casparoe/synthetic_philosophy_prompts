  1. Quick brainstorm
  1. Structural: Power vacuums demand centralized coercion to survive, inevitably crushing allies who threaten unity.
  2. Ideological: Abstract ideals create purity spirals; allies become heretics when they compromise on doctrine.
  3. Contingent: External war or specific leaders' paranoia forces preemptive strikes against former friends.
  These mechanisms show how momentum shifts from liberation to liquidation. The structural view blames the state itself, the ideological view blames the belief system, and the contingent view blames the circumstances. Understanding which mechanism drives the violence helps explain why the guillotine fell on those who built it.

  2. What the fight is about
  Historians generally fight over three engines driving the event. The class-struggle view sees the bourgeoisie overthrowing a feudal aristocracy to unlock capitalism. The ideology view argues Enlightenment concepts of universal rights clashed with reality, driving radicalization. The contingency school suggests bad harvests, war, and personality quirks turned a reform movement into a bloodbath. Basically, was it money, ideas, or bad luck? Each lens explains different atrocities, but none fully captures the machine alone. The class view explains property transfers, ideology explains the moral fervor, and contingency explains the timing. You need all three to see the whole picture, but weighing them changes the moral judgment of the entire era. Debates rage because each explanation implies different lessons for future politics.

  3. The case for class and structure
  The class argument holds water because the Old Regime was an economic bottleneck. Nobles held tax exemptions and land rights that stifled trade. The Revolution wasn't just angry mobs; it was a systematic transfer of property and legal power. The Terror wasn't random; it targeted hoarders and counter-revolutionary elites who threatened the new economic order. Violence was the midwife of a new property regime. Without breaking the aristocracy's structural grip, the bourgeois state couldn't function. The devouring happened because factional allies represented different economic interests that couldn't coexist in a scarcity economy. When resources are tight, internal competitors become existential threats. The structure of the economy demanded a single winner, and the state enforced that victory through blood. Furthermore, the sans-culottes needed food, forcing the government to control prices, which alienated bourgeois allies. This economic squeeze made political elimination necessary. The class struggle wasn't just a backdrop; it was the engine that required fuel.

  4. The case for ideology and contingency
  However, ideas and accidents matter more than Marxists admit. Ideology created impossible standards; if you believe in perfect Virtue, any compromise looks like treason. This explains why friends died—no one was pure enough. Contingency differs because it's about pressure, not belief. A foreign invasion forces harsh measures regardless of theory. Bad harvests make people hungry and violent. Ideology provides the script for who is an enemy, but contingency provides the emergency that justifies killing them. Without the war, the ideals might have remained philosophical. Without the ideas, the war would have been a standard power grab. The unique horror comes from combining universal morality with existential threat. You aren't just defeating an army; you are eradicating evil. This moralizes violence, making it endless. Contingency creates the crisis, but ideology ensures the solution is total. Robespierre wasn't just protecting France; he was saving humanity. That scope makes negotiation impossible. When circumstances shift, the ideology doesn't bend; it breaks the people holding it.

  5. The devouring-children problem
  Here is the uncomfortable truth: the Revolutionaries became the Monarchy they hated because states require administration. The royal courts ran on paperwork, hierarchy, and procedural rhythm. When the Revolutionaries built tribunals, they didn't invent new tools; they seized the old ones. You cannot manage a nation without files, clerks, and chains of command. The Committee of Public Safety mimicked the royal council's secrecy and centralization. The tribunals kept the old legal forms, even if the verdicts changed. This bureaucratic mimicry made the Terror structurally inevitable. Once you build a machine to process enemies, it needs fuel. The people running it changed, but the reflex to file, judge, and execute remained. The revolution didn't just eat its children; it processed them through the old royal machinery, now painted red. The habit of top-down control survived the king because the state itself survived. To govern is to categorize, and to categorize is to exclude. The paperwork of liberty became the ledger of death. Even the language of reports and decrees mirrored the Old Regime. The revolutionaries thought they were changing the world, but they were merely changing the staff. The procedural habits of absolutism were too deep to wash away. The forms of justice remained, even if the substance rotted. The structures of power are indifferent to the ideals of the people wielding them.

  6. My verdict
  So, which dominates? Structure. Ideology lit the fuse, and contingency added wind, but the structural necessity of state-building drove the car. You cannot dismantle a monarchy without building a machine to replace it, and machines crush things. The devouring of children wasn't just paranoia; it was the friction of a new bureaucracy grinding against old social realities. The Revolution was primarily a structural reorganization of power that used ideological language to justify the violence required to maintain the new hierarchy. It wasn't an accident; it was the cost of building a modern state on feudal ruins. The class struggle provided the motive, but the bureaucratic structure provided the method. Therefore, the Terror was not an aberration but a feature of modernization. Power consolidates by pruning.
