  **Leaves and Awkward Commitments:**

  *   **Leaf A (Relativism):** A knowledge attribution can be true when uttered and false when assessed later without any change in the subject's evidence.
  *   **Leaf B (Contrastivism):** Knowledge is never a binary relation between subject and proposition, making ordinary claims systematically incomplete.
  *   **Leaf C (Contextualism):** "I know" uttered by a low-stakes subject means something different than "I know" uttered by a high-stakes attributor.
  *   **Leaf D (Relevant Alternatives):** Skeptical scenarios are irrelevant until mentioned, at which point they instantly destroy knowledge.
  *   **Leaf E (Classical Invariantism):** The widespread intuition that stakes affect knowledge is a systematic illusion generated by conversational pragmatics.
  *   **Leaf F (Debunking View):** Our ordinary concept of knowledge does not track any real property capable of bearing the weight of these intuitions.
  *   **Leaf G (Subject-Sensitive Invariantism):** Two subjects with identical evidence and belief differ in knowledge status purely because one has a higher paycheck at risk.
  *   **Leaf H (Moral Stakes View):** A subject can fail to know a trivial truth simply because believing it falsely would be a betrayal of trust.

  ### Diagnostic Analysis

  **Indistinguishable Pairs:**
  This tree cannot separate **Contextualism** and **Assessor-Relativism** in cases where the attributor's context and the assessor's context coincide (e.g., immediate self-attribution), because both predict the truth value tracks the speaker's stakes. It also struggles to separate **Subject-Sensitive Invariantism** and **Contextualism** whenever the attributor is the subject, as both tie the threshold to the subject's practical situation; only Case 5 (Eavesdropper) or Case 1 (Stranger) breaks this link by decoupling the subject's stakes from the attributor's/assessor's stakes.

  **Case Utility:**
  **Case 5 (Eavesdropper)** and **Case 3 (Retrospective)** do the real work, distinguishing Contextualism from Relativism and Invariantism from Contextualism via the "whose situation" and "time of assessment" nodes. **Case 1 (Stranger)** collapses into Case 5, as both test third-party stakes versus subject stakes. **Case 2 (Unopened Will)** collapses into **Case 4 (Symmetric Stakes)** for Subject-Sensitive Invariantism, since SSI denies knowledge loss when the subject is unaware of the stakes, making the hidden stake diagnostic only for objective views not included in the required leaves. **Case 6 (Moral)** is necessary only to isolate the Moral Stakes view from Classical Invariantism.
