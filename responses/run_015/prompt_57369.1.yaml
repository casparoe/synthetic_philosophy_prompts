answer: |-
  ### Part 1: The "Owing" vs. "Deserving" Question

  You asked whether writing the rules down converts a bonus from something a man *deserves* (a moral claim) to something he is *owed* (a contract), and whether that is a loss or the point.

  It is the point.

  When you pay by instinct, you are paying for loyalty to *you*. When a man gets a small check, he feels you slighted him personally. When you pay by rule, you are paying for contribution to the *company*. When a man gets a small check, he can argue with the math, but he cannot argue with your heart.

  The loss is your power to be generous. You can no longer surprise a man with a gift he didn't expect. The gain is your freedom from guilt. You are no longer the judge of souls; you are the administrator of a system. In a twenty-two-person company, you cannot be the father figure anymore. You must be the architect. If the sheet decides who gets what, you are signing a treaty, not a Christmas card. That is the only way the bonus survives the break room.

  ***

  ### Part 2: The Afternoon Procedure

  **Time required:** 3 to 4 hours.
  **Materials:** Profit & Loss statement, Job Cost reports, a notebook, a calculator.
  **Goal:** Assign a "Share Multiplier" to each employee. The Bonus Pool is divided by the sum of all Multipliers. Each person gets their Multiplier × the Share Value.

  **Distinction to understand:** *Wages* pay for time and skill promised. *Bonuses* pay for impact on the company's survival and success. Do not mix them. If you pay a bonus for "showing up," you are just paying overtime.

  #### Step 1: The Gatekeeper (15 Minutes)
  **Question:** Did the company clear a net profit of at least 5% after paying all wages and taxes?
  *   **Sufficient Answer:** Yes or No, from the P&L.
  *   **If No:** The pool is zero. Tell the crew: "We didn't make the hurdle. No bonus."
  *   **If Yes:** Calculate the Pool Amount (e.g., 10% of Net Profit). Proceed to Step 2.
  *   **Judgment Call Warning:** None. This is a hard fact. If you skip this to pay a bonus anyway, you are paying from capital, not profit, and you are lying to the crew about the company's health.

  #### Step 2: Eligibility (30 Minutes)
  **Question:** Was the employee on payroll for at least 10 months of the fiscal year?
  *   **Sufficient Answer:** Yes or No, from payroll records.
  *   **If No:** They get nothing. (Exception: Left due to injury/layoff, see Step 5).
  *   **If Yes:** They enter the pool. Assign them a **Base Multiplier of 1.0**.
  *   **Why:** This acknowledges "Joint Work." Everyone who stayed helped carry the load.

  #### Step 3: Role Weighting (45 Minutes)
  **Question:** If this person vanished tomorrow, how long until the company loses money or stops selling?
  *   **Sufficient Answer:** Choose one:
      *   *Immediate (1 week):* Add **1.0** to Multiplier. (Examples: You, Scheduler, Lead Estimator).
      *   *Short Term (1 month):* Add **0.5** to Multiplier. (Examples: Lead Carpenters, Project Managers).
      *   *Long Term (3 months+):* Add **0.0** to Multiplier. (Examples: Apprentices, Laborers).
  *   **Judgment Call Warning:** This is where you value *leverage* over *labor*. The scheduler stops the machine; the carpenter slows it down. This will anger the field. You must hold this line.

  #### Step 4: The Behavior Adjustment (60 Minutes)
  **Question:** Did this person's actions directly cause a loss of money, a lost client, or another employee to quit this year?
  *   **Sufficient Answer:**
      *   *Yes, verified:* Subtract **0.5** per incident. (Evidence: Turnover interview, refund check, written complaint).
      *   *No:* Add **0.25**.
  *   **Question:** Did this person train someone else to do their job better this year?
  *   **Sufficient Answer:**
      *   *Yes, verified:* Add **0.25**. (Evidence: Apprentice promotion, cross-training log).
      *   *No:* 0.
  *   **Judgment Call Warning:** Do not use "vibes." If Ray was rude but the client still paid, that is not a verified loss. If Ray was rude and the client withheld the final 10%, that is a verified loss.

  #### Step 5: The Capacity Check (30 Minutes)
  **Question:** Did this person work fewer than 80% of standard hours due to injury or company-directed role change?
  *   **Sufficient Answer:** Yes or No, from timesheets.
  *   **If Yes:** Do not reduce their Multiplier for low hours *if* their Role Weight (Step 3) is "Immediate" or "Short Term."
  *   **Reasoning:** You are paying for the value of the role they filled, not the hours they filled it. If Tomas supervises well in 20 hours, he is worth more than an apprentice grinding in 40.
  *   **Judgment Call Warning:** This is the hardest step. You are deciding that *output* matters more than *grind*. If the crew sees a man working half-days get a full share, they will call it favoritism. You must be ready to explain that his *supervision* saved more money than their *labor*.

  #### Step 6: The Break Room Test (30 Minutes)
  **Action:** Write one sentence for each employee explaining their Multiplier.
  *   **Requirement:** You must be able to read this sentence to the person who got the lowest bonus without lying.
  *   **Example:** "Ray, you got 2.0 shares because you lead the biggest jobs, but 0.5 was deducted because two men quit your crew."
  *   **Hand-off Point:** If you cannot write the sentence, you must adjust the numbers in Step 4 or 5 until you can. If you still cannot, the procedure has failed for that person, and you must make a personal decision. Mark this as a "Owner Override."

  #### Step 7: Final Calculation
  **Math:** Sum all Multipliers. Divide Pool Amount by Total Multipliers to get $ Per Share. Multiply by individual Multiplier.
  **Hand-off Point:** If the resulting check for a key person is insultingly low (e.g., $500 for a Lead), you may add a "Retention Top-Up." **Note:** This converts the bonus back to a "gift." Use sparingly.

  ***

  ### Part 3: The One-Page Statement (For the Crew)

  **MEMORANDUM: 2024 BONUS PLAN**
  **TO:** All Employees
  **FROM:** Owner
  **DATE:** January 2, 2024

  **1. The Pool.**
  The bonus pool is 10% of the company's Net Profit after taxes. If the company does not make a profit of at least 5%, there is no bonus. This is not a promise of extra pay; it is a share of the success we build together.

  **2. Eligibility.**
  To qualify, you must be employed for at least 10 months of the year.

  **3. How Shares Are Calculated.**
  Everyone starts with 1 Share.
  *   **Role:** You gain extra shares if your job is critical to keeping the company running (e.g., Scheduling, Lead, Safety).
  *   **Behavior:** You gain shares for training others. You lose shares for verified errors that cost money or cause teammates to quit.
  *   **Capacity:** You are not penalized for low hours if you are working a reduced schedule due to injury or company assignment, provided your output remains high.

  **4. Transparency.**
  You will receive your bonus amount and your Share Multiplier. You will not receive other employees' numbers, but the formula is the same for everyone.

  **5. The Goal.**
  Wages are for the work you do. The bonus is for how you help the company survive and grow. We want everyone to maximize their shares.

  ***

  ### Part 4: The Test Run (Ray, Marisol, Tomas)

  *Assumptions: Company Net Profit is $500,000. Pool is 10% ($50,000). Total Company Multipliers sum to 40.0. Value Per Share = $1,250.*

  #### 1. Marisol (Office Manager/Scheduler)
  *   **Step 2 (Eligibility):** Employed all year. **Base: 1.0**
  *   **Step 3 (Role Weight):** If she leaves, company stops in May. **Add 1.0**
  *   **Step 4 (Behavior):** No verified money loss. Trained new admin assistant. **Add 0.25**
  *   **Step 5 (Capacity):** Full hours. **No change.**
  *   **Total Multiplier:** 2.25
  *   **Bonus:** **$2,812**
  *   **Break Room Sentence:** "Marisol got 2.25 shares because her role keeps the company operating and she trained her replacement."

  #### 2. Ray (Lead Carpenter)
  *   **Step 2 (Eligibility):** Employed all year. **Base: 1.0**
  *   **Step 3 (Role Weight):** Lead Carpenter. Company slows in 1 month. **Add 0.5**
  *   **Step 4 (Behavior):** Two quits on his crew (verified in exit interviews). Client complaint regarding tile comment (verified refund/discount). Trained apprentices (verified). **Net: -0.5** (-0.5 per quit, +0.25 training).
  *   **Step 5 (Capacity):** Full hours. **No change.**
  *   **Total Multiplier:** 1.0
  *   **Bonus:** **$1,250**
  *   **Break Room Sentence:** "Ray got 1.0 share. He leads big jobs, but lost shares because two men quit his crew and a client complaint cost us money."

  #### 3. Tomas (Framer/Supervisor)
  *   **Step 2 (Eligibility):** Employed all year. **Base: 1.0**
  *   **Step 3 (Role Weight):** On-site supervision. Company slows in 1 month. **Add 0.5**
  *   **Step 4 (Behavior):** No quits. Trained two apprentices on layout. **Add 0.5**
  *   **Step 5 (Capacity):** Worked 33% hours due to back injury. Role is still critical. **No penalty.**
  *   **Total Multiplier:** 2.0
  *   **Bonus:** **$2,500**
  *   **Break Room Sentence:** "Tomas got 2.0 shares. He worked fewer hours, but his supervision prevented errors and he trained the apprentices."

  ***

  ### Part 5: The Unpopular Outcome and The Cost

  **The Outcome You Will Not Like:**
  Marisol (Admin) gets more than Ray (Lead Carpenter). Tomas (Part-time due to injury) gets double Ray (Full-time Star).

  **Why the Procedure Forces This:**
  The procedure values *Company Continuity* (Marisol) and *Current Output Value* (Tomas) over *Individual Craft* (Ray) and *Raw Hours* (Ray/Tomas comparison). Ray is a "mercenary" asset; he builds well but burns bridges. Marisol is an "infrastructure" asset; she holds the floor. Tomas is a "force multiplier"; his supervision saves more than his labor would. The math reflects the health of the business, not the hierarchy of the tools.

  **The Break Room Cost:**
  When you post this, Ray will feel disrespected. He is the best hands in the county. He will see Marisol's check and think, "She answers phones; I build houses." He may quit.
  *   **If he quits:** The procedure worked. It told you Ray was a liability (turnover, client friction) disguised as an asset. You replace him with a Lead who scores higher on Behavior.
  *   **If he stays:** He must accept that the company values stability over heroics.

  The apprentices will look at Tomas. They are grinding 50 hours with bad backs of their own. They will see a man working 20 hours take a full share.
  *   **The Defense:** You must stand in the break room and say: "We pay for the value you add to the company, not the sweat you spill. Tomas's layout prevents us from tearing out walls. That is worth more than framing speed."

  **Final Warning:**
  By signing this, you give up the right to save Ray with a "special bonus." If you top up Ray's check because you're afraid to lose him, you tear up the page you just handed the crew. You must be willing to lose Ray to save the system. If you are not willing to lose him, do not use this procedure. Stick to your instincts, accept the turnover, and stop asking what people deserve.
