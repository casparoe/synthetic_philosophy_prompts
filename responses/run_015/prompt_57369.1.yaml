          4.  Blunt honesty about unpopular outcomes.
      *   **Constraints:** No market wage advice, no consultants, no reading lists, no philosopher names. Explain distinctions simply.
      *   **Data Available:** Job contract price, materials, subs, hours billed per person. No time-tracking software, no CSAT scores beyond reviews.
      *   **Pool:** Fixed % of profit (can recommend zero).

  2.  **Deconstruct the Four Sticking Points:**

      *   *Joint Work:* Cannot attribute specific profit dollars to individuals. *Solution:* Focus on role impact and reliability rather than individual P&L.
      *   *Luck:* Some jobs are easier, some market timing is lucky. *Solution:* Normalize for job difficulty or focus on behavior within the circumstance (how they handled the rot vs. the level lot).
      *   *Effort vs. Capacity:* Grinding isn't always possible (back injury). *Solution:* Value output/impact over raw hours/effort.
      *   *Transparency:* Everyone will know. *Solution:* The rules must be defensible publicly.

  3.  **Develop the Procedure (The "Algorithm"):**

      *   *Step 1: The Gatekeeper.* Is there enough profit? If not, pool = 0.
      *   *Step 2: Eligibility.* Who gets in the pool? (Tenure, employment status).
      *   *Step 3: The Base Share.* Everyone gets something if eligible? Or is it performance-only? Given the "desert" worry, a base share acknowledges membership/contribution to the whole. Let's make it a "Participation Share" vs. "Merit Share."
      *   *Step 4: Merit Factors.* Need to score people without fake precision.
          *   Factor A: Reliability/Continuity (Did they keep the machine running? - Marisol).
          *   Factor B: Skill/Output Quality (Did the work hold up? - Ray).
          *   Factor C: Adaptation/Team Support (Did they help others despite limits? - Tomas).
      *   *Step 5: The "Luck" Adjustment.* Did they have an unfairly easy or hard year? (Hard to measure objectively, maybe skip specific dollar adjustments and rely on the manager's override here).
      *   *Step 6: The "Break Room" Test.* Can I explain this to the person who got the least?
      *   *Step 7: The Owner's Override.* This addresses the "values vs. facts" hand-off.

      *Refining the Procedure for the User's Constraints:*
      The user wants an *ordered list of questions* that leads to a number, highlighting where *he* has to decide.
      Let's structure it as a scoring sheet that forces specific inputs.

      *Key Distinction to Explain:* "Contractual Obligation" (Wages) vs. "Discretionary Recognition" (Bonus). The bonus is for *how* the work was done, not *that* it was done.

      *Addressing the "Owing vs. Deserving" worry:* Writing it down converts "desert" into "contract." This is actually *good* for stability, even if it feels less generous. It removes the "patronage" feel. I need to tell him this explicitly.

  4.  **Drafting the Procedure Steps:**

      1.  **Profit Check:** Is net profit > X%? If no, Pool = 0.
      2.  **Eligibility:** Employed all year? (Prorated if not).
      3.  **Role Weight:** Assign a weight to the role based on impact on *company* survival, not just job profit. (Office vs. Field).
      4.  **Performance Multiplier:** Based on specific, observable behaviors (not "vibes").
      5.  **Hardship/Equity Check:** (Addressing Tomas's back).
      6.  **The "Break Room" Justification:** Write the sentence explaining the number.
      7.  **Owner's Veto/Adjustment:** The values hand-off.

  5.  **Drafting the One-Page Statement:**

      *   Needs to be clear, firm, and transparent.
      *   "The bonus is not a promise. It is a share of success based on these rules."

  6.  **Running the Procedure on Ray, Marisol, Tomas:**

      *   *Ray:* High skill, high impact, but behavioral risks (quits, rude to clients).
          *   *Risk:* If we penalize him too much for the quits/rudeness, we lose him. If we reward him too much, we validate the rudeness.
          *   *Procedure Outcome:* High base, lowered by behavioral penalties.
      *   *Marisol:* Invisible work, critical infrastructure.
          *   *Risk:* Field guys think she does nothing.
          *   *Procedure Outcome:* High role weight. If the company stopped without her, she is high value.
      *   *Tomas:* Reduced capacity, high institutional knowledge.
          *   *Risk:* Paid for hours he didn't work? Or paid for value he still provides?
          *   *Procedure Outcome:* Needs to reward current value, not past glory. But also loyalty.

      *The "Unpopular Outcome":* The prompt asks for at least one outcome the owner won't like.
      *Idea:* Marisol should likely come out higher than Ray or equal to him. Field guys hate this. Or Tomas gets a full share despite low hours.
      *Better Unpopular Outcome:* Ray gets *less* than Marisol. Ray is the "star." Marisol is "admin." In construction culture, this causes friction. But if the rule values "Company Continuity" over "Individual Craft," Marisol wins.
      *Alternative:* Tomas gets a full share. The apprentices who are grinding hard will hate this.
      *Decision:* Let's make Marisol's share higher than Ray's. It highlights the "Joint Work" and "Luck" constraints. Ray's luck (good jobs) vs. Marisol's constant load. Also Ray's behavioral issues (quits on his crew) should penalize him.

  7.  **Refining the "Owing vs. Deserving" Question:**

      *   User asks: "Writing the rules down may convert it into the first kind [contract], and I do not know whether that would be a loss or the entire point."
      *   My Answer: It is the entire point. "Desert" is invisible and argued. "Contract" is visible and settled. The loss of "generosity" is the gain of "trust."

  8.  **Drafting the Content (Iterative refinement for tone):**

      *   *Tone:* Direct, practical, respectful of the trade, no academic fluff.
      *   *Structure:*
          1.  The Philosophy Answer (Owing vs. Deserving).
          2.  The Procedure (The Afternoon Algorithm).
          3.  The One-Page Statement.
          4.  The Test Run (Ray, Marisol, Tomas).
          5.  The Break Room Cost.

      *(Self-Correction during drafting)*: Make sure I don't use economic terms like "marginal productivity." Use "impact on the next job."
      Ensure the distinction between "Wages" and "Bonus" is clear. Wages = Time/Skill promised. Bonus = Share of the *result*.

      *Addressing the "Luck" factor:* The procedure needs a specific question about "Circumstance." Did they make the best of a bad job?
      *Addressing "Joint Work":* The procedure must evaluate the *team* first, then the *individual*.

      *Revised Procedure Logic:*
      1.  Pool Existence (Profit check).
      2.  Base Share (Everyone eligible gets 1 unit). Acknowledges joint work.
      3.  Role Multiplier (Criticality). Acknowledges Marisol.
      4.  Behavior Adjustment (Quits, Client complaints). Penalizes Ray.
      5.  Capacity Adjustment (Hours vs. Value). Handles Tomas.
      6.  Owner's Intuition Check (The "Values" hand-off).

      *Let's calculate the Test Run:*
      *   Base Unit: $1,000 (hypothetical for scaling).
      *   Ray: Base (1) + Role (Lead = 1.5) - Behavior (Quits/Rude = -0.5) = 2.0 units.
      *   Marisol: Base (1) + Role (Ops = 1.5) + Stability (No quits/Critical = +0.5) = 3.0 units.
      *   Tomas: Base (1) + Role (Super = 1.2) - Hours (Low = -0.2) + Loyalty/Training (+0.5) = 2.5 units.
      *   *Wait, I need an outcome the owner won't like.*
      *   If Marisol > Ray, the owner might worry about retaining Ray.
      *   If Tomas > Apprentices (implied), that's standard.
      *   Let's make Marisol significantly higher. It challenges the "Hammer is King" mindset.
      *   Actually, let's look at the "Luck" constraint. Ray drew easy jobs? No, Ray draws the lead role.
      *   Let's make Tomas's share controversial. He worked 1/3 hours. If he gets a full share, the grinders hate it. If he gets 1/3 share, he leaves.
      *   *Decision:* The procedure should value *Current Value Provided*. Tomas provides supervision. If his supervision prevents errors, he is high value. But if the rule is strictly hours-based, he loses. The prompt says "no time tracking software" but bookkeeper has hours billed.
      *   *Better Unpopular Outcome:* Marisol gets the highest bonus. Ray gets less. This directly addresses the "Office vs. Field" tension and the "Joint Work" reality.

  9.  **Final Polish:** Check against all constraints.
      *   One afternoon? Yes.
      *   No philosophy names? Yes.
      *   Explain distinctions in 2 sentences? Yes.
      *   Blunt about break room cost? Yes.
      *   Address the "Owing vs. Deserving" worry? Yes.

      *(Self-Correction on the "Owing vs. Deserving" answer)*: I need to be very clear. Writing it down changes the *nature* of the money. It stops being a gift and starts being a earned right. This reduces the owner's power but increases company stability.

      *(Refining the Procedure Steps)*: Make them questions.
      1. Is there profit?
      2. Is the person eligible?
