      *   **Problem:** Current bonus system is instinctual, led to turnover (perceived unfairness), and the owner is struggling with the philosophy of "desert" (what people deserve) vs. "contract" (what was promised).
      *   **Goal:** A procedure (ordered list of questions) to determine bonus allocation once a year in a single afternoon. No economics/philosophy jargon. Must address four specific sticking points (joint work, luck vs. contribution, effort vs. capacity, transparency/small team).
