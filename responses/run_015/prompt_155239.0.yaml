answer: |-
  The problem of the unity of the proposition asks why `Socrates is mortal` asserts something while the list `[Socrates, mortality]` does not. If you supply a relation `R` to bind them (`R(Socrates, mortality)`), Bradley argues you now require a further relation to bind `Socrates`, `mortality`, and `R`, restarting the demand ad infinitum. Bradley concludes relations are unreal and reality is one monistic whole. Russell worried this regress undermines the multiple-relation theory of judgment: what binds the constituents of the judgment itself? Frege blocked this by claiming concepts are "unsaturated"—they require completion by an object without a further binder.

  In your vocabulary, the regress is triggered by reification. Consider a relation not as a type former but as data:

  ```agda
  data Rel : Type₀ where
    Mortal : Rel

  interp : Rel → Type₀ → Type₀
  -- Regress source:
  app : (r : Rel) → (A : Type₀) → (a : A) → interp r A
  ```

  Here, `app` is a constant term binding the relation code to its argument. But `app` is itself a constituent. To bind `app` to `r` and `a`, you need `app₂`, and so on. You have replaced the type former `A → Type` with an interpreter function, turning logical structure into object-level data.

  Dependent type theory stops this by fiat. Application is not a term; it is a rule of the kernel.

  ```agda
  F : A → Type
  a : A
  -- Fa is not (app F a); it is a primitive formation.
  p : F a
  ```

  Unity is not a term in the language; it is a property of the derivation `Γ ⊢ p : P`. The judgment holds only if the typing rules have successfully unified the function and argument. When you reify the proposition—`quote : (Γ ⊢ P) → Term`—to make it the object of an attitude, you convert the derivation into data. This restarts the regress: the reified term lacks unity until interpreted by a meta-level evaluator, which itself requires evaluation.

  Is this regress vicious? Yes. A universe hierarchy `Type₀ : Type₁ : …` is benign because every level is reached stratifiedly; no level waits on itself. Bradley's regress is vicious because it demands completion *at the same level* to achieve unity. An infinite ladder of `apply` operators never yields a unified proposition *now*. DTT avoids this by making application primitive, effectively legislating unity rather than explaining it.

  **Residue Report**

  **Mapped Cleanly:** Frege's "unsaturatedness" lands precisely on function types `A → B`. A term of function type cannot stand alone as a complete object; it demands an argument to form a type. The distinction between object language and metatheory maps cleanly onto the distinction between terms and derivations.

  **Distorted:** Truth versus inhabitation is the primary friction. In DTT, a false proposition is an empty type. It is still a *unified type*, so DTT solves the unity problem for false propositions easily. However, Bradley cares about truthmakers, not just well-formedness. A unified type is not a fact. DTT conflates the proposition (type) with its potential truth (inhabitation), whereas Bradley distinguishes the unity of the proposition from the reality of the fact. Furthermore, the *force* of judgment is lost. `Γ ⊢ p : P` is static; it lacks the act of judging that Russell and Bradley sought to analyze.

  **Missing:** The move to monism has no counterpart. DTT assumes a plurality of types and terms; there is no mechanism to collapse them into one substance. More critically, the demand that a theory *explain* unity rather than *legislate* it is unmeetable in formal systems. In a kernel, a rule is either primitive or derived. Application cannot be derived from anything simpler without restarting the regress. DTT simply stops at primitive application.

  **Verdict**

  The residue is not a defect of your vocabulary but a sign that the original demand was metaphysical, not logical. Bradley demands an explanation of how logic hooks onto reality; DTT describes how symbols hook onto each other.

  My translation is partly faithful, but largely dependent type theory is quietly taking Frege's side. By making application a rule of the kernel rather than a term, DTT declares the regress ill-formed. It treats unity as a precondition of syntax, not a property to be constructed. To express Bradley's conclusion, you would need a vocabulary where *everything* is data, including the logic itself—a system with no primitive judgment forms, only terms interpreting terms. In such a system, the regress would be explicit, and the only way to stop it would be Bradley's way: deny the plurality of terms entirely. DTT avoids monism by refusing to let the regress start.
