answer: |-
  ### Opening Remarks (5–6 Minutes)

  Good evening. My name is [Name]. I'm a tenant in this city, and I work in medical billing. I'm here with the tenant union.

  I want to start with the numbers the city shared. Four thousand households ask for help every year. There is resources for one hundred and twenty. That is not a math problem we can solve. That is a shortage. And because there is a shortage, somebody has to say "no," or at least "not yet," to thirty-eight hundred families.

  The city has built a tool to help say that. A Priority Score. It ranks us. The top one hundred and twenty get a knock on the door; the rest stay on the list. The city tells us this tool doesn't make decisions, it just organizes the pile. I want to be careful here, because I don't want to attack the staff who built this. They followed instructions. But I need us to be honest about what this tool actually does.

  I spend my days dealing with insurance claims. I know what happens when a computer decides which cases get reviewed first. In medicine, we call it triage. If you have ten patients and one doctor, you have to choose who gets seen. If you prioritize the people most likely to survive, you might ignore the people who are sickest but need the most work. If you prioritize the sickest, you might use up all your time on people who won't make it anyway.

  You cannot do both. You cannot maximize survival and maximize need at the same time. Not with a computer, and not with a human.

  I've spent the last year learning what the math says about this. And the hard truth is this: any scoring system, no matter how smart, forces a trade-off. You can make sure the score means the same thing for everyone—a seventy is a seventy no matter your neighborhood. Or you can make sure the mistakes are spread out evenly—that different neighborhoods don't get disproportionately ignored. But you cannot do both perfectly unless the problems are exactly the same everywhere, or unless you have enough money for everyone.

  We know the problems aren't the same everywhere. And we know the money isn't there.

  So when the city uses this score, they are choosing which mistake to make. Are we willing to miss a leaking roof in one neighborhood because the model thinks a broken boiler in another neighborhood is a "higher risk"? Are we willing to let a family wait longer because they belong to too many overlapping groups—maybe they're disabled, maybe they speak a different language, maybe they live in the oldest buildings—and the model gets confused by the overlap?

  A consultant suggested something called "temporal fairness." Rotating the rules every quarter. One quarter we prioritize lead, the next we prioritize heat. Over a year, it averages out.

  To a statistician, that might look like balance. To a family with a child eating paint chips in January, being told "your turn is in the third quarter" is not fairness. It's a delay that could hurt them.

  I am not here to say we should throw the computer away and go back to the old way. The old way was a stack of paper on a desk. A human picked the top file. Maybe they picked the loudest voice. Maybe they picked the closest building. That had the same problem—it just hid the choice better. When a human makes the unfair choice, it looks like bad luck. When an algorithm makes it, it looks like a rule.

  I want us to stop pretending this is a technical problem. It is not. There is no setting you can tune to make scarcity disappear.

  This is a political choice. It is a choice about whose suffering we accept to manage the budget. And that choice belongs to people who can be voted out. It belongs to the Council. It belongs to the Mayor. It should not be buried in a weighting formula that only three people in this room understand.

  If we are going to use a score, the rules of that score need to be public. The trade-offs need to be stated out loud. "We are prioritizing X, which means Y will wait longer." And when that causes harm, there needs to be a person we can hold accountable, not a help desk ticket.

  I say this because I want the people speaking after me to know they don't have to argue with the math. You can't win that argument. The math is doing exactly what it was told to do. The argument we need to have is about what we are telling it to do.

  Who gets helped first? Who gets asked to wait? And who decides?

  Thank you. I'm ready to listen.

  ***

  ### Note on Your Understanding

  You are surprisingly accurate on the core theory (specifically the *Impossibility Theorem of Fairness* derived by Kleinberg et al. and Chouldechova in 2016/2017). Your intuition that this applies to human decision-making too is correct; humans just introduce more noise and less auditability.

  **Two nuances to keep in mind:**
  1.  **Base Rates:** You mentioned "unless the groups genuinely have the same underlying rates." In housing, this is the kicker. If lead poisoning is objectively more prevalent in Neighborhood A than Neighborhood B due to age of stock, a "fair" model that treats everyone identically will actually *under-predict* risk in Neighborhood A. You are right to flag this, but don't let the data people drag you into a debate about whether base rates *are* different. Assume they are.
  2.  **The "Human" Defense:** You wrote that the old human version has "exactly the same problem." Technically, humans don't optimize a global loss function, so they aren't *mathematically* bound by the impossibility theorem in the same rigid way. However, they are bound by *resource* constraints which force the same trade-offs. Your point stands practically, even if a data scientist might nitpick the theoretical equivalence. Stick to the practical equivalence: both require choosing who loses.

  ***

  ### Replies to Pushback

  **If they say: "The model doesn't decide anything, it just recommends. An inspector makes the final call."**
  "Recommendations narrow the field. If an inspector only has time to visit the top 120 recommendations, the model has effectively decided the other 3,880 don't get visited. A recommendation that is never seen is a decision."

  **If they say: "Temporal fairness (rotation) ensures everyone gets a turn over the year."**
  "Housing emergencies don't run on quarters. A family waiting in Q3 because Q1 was 'Lead Priority' doesn't feel fairly treated; they feel abandoned. Averaging injustice over time doesn't fix the harm happening today."

  **If they say: "We can adjust the weights to balance these factors."**
  "Adjusting the weights just picks a different point on the same trade-off. It doesn't remove the trade-off. I want to see the city explicitly choose which trade-off they prefer, rather than hiding it in the tuning."
