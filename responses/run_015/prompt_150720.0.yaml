      *   *Key Distinctions:*
          *   Moral Presentism (judging actions as right/wrong).
          *   Conceptual Presentism (using categories like "homosexuality," "class," "economy" that didn't exist).
          *   Problematic Presentism (distorting evidence) vs. Productive Presentism (asking new questions).
      *   *The "Hard Cases":*
          *   Bioethics/Quarantine: Utilitarian harm reduction then vs. individual rights now.
          *   Gender: "Women's history" using a category that might not have been salient in the same way.
      *   *Structural Constraints:* Archives are organised now, language changes, the historian exists *now*.

