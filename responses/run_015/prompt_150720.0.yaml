answer: |-
  **To:** Author
  **From:** Research Assistant
  **Subject:** Spec Sheet: Desiderata for a Theory of Historical Presentism
  **Date:** 24 May 2024

  Per your brief, I have drafted a specification sheet for evaluating theories of presentism in historiography. The aim is to provide a rigorous framework for your long read, distinguishing between structural necessities and methodological preferences. I have adhered to British English conventions throughout.

  ***

  ### I. The Desiderata: What an Adequate Theory Must Achieve

  Any robust theory of presentism must satisfy three categories of requirements: phenomenological coverage, conceptual precision, and structural realism.

  #### 1. Phenomenological Coverage (The Hard Cases)
  The theory must account for the actual friction points where presentism arises in practice, not merely in the abstract.
  *   **The Ethical Friction:** It must explain how to handle moral evaluation of past actions where the moral universe has shifted.
      *   *Test Case:* Applying modern bioethical standards (autonomy, consent) to medieval plague quarantines (coercion, collective survival). A theory that simply says 'do not judge' fails to explain why the judgement feels necessary now; a theory that says 'condemn' fails to explain the past's internal logic.
  *   **The Categorical Friction:** It must account for the use of retrospective categories that grant intelligibility but risk distortion.
      *   *Test Case:* Describing pre-modern gender relations using 'women' or 'queer' as analytical categories when such identities were not salient to the agents involved. The theory must explain how to use the category without erasing the alterity of the past.
  *   **The Motivational Friction:** It must explain *why* we study history. If the past is truly a foreign country, why visit? The theory must reconcile the desire for knowledge of the 'other' with the present-day needs that fund the research.

  #### 2. Conceptual Precision (The Distinctions)
  The theory must not treat presentism as a monolith. It must preserve the following distinctions:
  *   **Moral vs. Conceptual Presentism:** Condemning a historical figure (moral) is distinct from analysing their actions using concepts they did not possess (conceptual). A theory that conflates these will confuse ethical judgement with epistemic error.
  *   **Whiggish vs. Critical Presentism:** There is a difference between viewing the past as a teleological march towards the present (Whiggish) and using the present as a vantage point to critique the past (Critical). The former distorts causality; the latter is a legitimate historiographical stance.
  *   **Unconscious vs. Deliberate Presentism:** The theory must distinguish between biases the historian cannot see (inevitable) and anachronisms introduced for heuristic purposes (methodological).

  #### 3. Structural Realism (The Constraints)
  The theory must remain consistent with the material and epistemic conditions of the craft.
  *   **The Archival Constraint:** As you noted, every archive is catalogued with present-day metadata. Total escape from current categories is structurally impossible. A theory demanding 'pure' access to the past is empirically false.
  *   **The Linguistic Constraint:** History is written in present-day language. Translation is always interpretation. The theory must acknowledge that 'understanding' is an act of translation, not telepathy.
  *   **The Temporal Constraint:** The historian exists in the present. We cannot shed our 'now-ness'.

  ***

  ### II. Non-Negotiables vs. Camp Preferences

  To assist your argument, I have flagged which demands are essential to the discipline and which are merely tribal markers.

  | **Non-Negotiable (Structural/Epistemic)** | **Camp Preference (Methodological/Normative)** |
  | :--- | :--- |
  | **The Ontological Gap:** The past is gone; it can only be accessed via traces interpreted in the present. | **Moral Neutrality:** Whether historians *ought* to issue moral verdicts is a normative choice, not an epistemic necessity. |
  | **Linguistic Mediation:** We cannot think outside our current conceptual vocabulary. | **Contextual Priority:** Prioritising 'what it meant to them' over 'what it means to us' is a choice (Contextualist), not a law of physics. |
  | **Selection Bias:** The questions we ask are determined by present concerns. | **Political Utility:** Whether history should serve social justice or preserve heritage is a political preference. |

  ***

  ### III. The Incompatibility Problem

  You asked specifically to flag jointly unsatisfiable demands. There is a fundamental tension here that no theory fully resolves without compromise. This is the core conflict for your long read.

  **The Paradox of Alterity and Intelligibility:**
  1.  **Demand A (Faithful Reconstruction):** To respect the past, we must understand it on its own terms, preserving its radical difference (alterity) from the present.
  2.  **Demand B (Intelligibility):** To make history useful or understandable to a present audience, we must translate it into concepts they recognise.

  **The Conflict:** If you satisfy Demand A perfectly, the past becomes unintelligible gibberish to the present reader (pure antiquarianism). If you satisfy Demand B perfectly, the past becomes a mirror of the present, erasing its difference (pure presentism).

  **Verdict:** These two demands are **jointly unsatisfiable** in their absolute forms. Any adequate theory must admit that history is a negotiation between these poles, not a resolution of them. A theory claiming to achieve both total fidelity and total relevance is selling fiction.

  ***

  ### IV. Scoring the Contenders

  Here is how the standard historiographical positions score against the spec sheet above.

  #### 1. The Hard Anti-Presentists
  *(e.g. Strict Rankeans, some strands of the Cambridge School)*
  *   **Thesis:** The historian's duty is to show 'how it actually was'; present values are contaminants.
  *   **Phenomena:** Fails the Bioethics Test. Cannot account for why we *must* judge the past morally.
  *   **Distinctions:** Strong on Moral vs. Conceptual, but often treats all present influence as contamination.
  *   **Structural Realism:** **Fails.** Ignores the Archival Constraint. Pretends the historian can step outside time.
  *   **Score:** **Low.** Epistemologically naive regarding the archival and linguistic constraints.

  #### 2. The Contextualists
  *(e.g. Quentin Skinner, J.G.A. Pocock)*
  *   **Thesis:** Ideas must be understood within their specific linguistic and political contexts to avoid mythologies.
  *   **Phenomena:** Handles the Categorical Friction well (warns against retroactive labels). Struggles with the Ethical Friction (often sidelines moral judgement).
  *   **Distinctions:** Excellent at separating Conceptual Presentism from historical accuracy.
  *   **Structural Realism:** **Mixed.** Acknowledges linguistic constraints but often implies a 'correct' context can be neutrally reconstructed.
  *   **Score:** **Medium-High.** The most rigorous methodologically, but risks rendering history politically sterile.

  #### 3. The Critical Presentists
  *(e.g. E.H. Carr, presentist activists, some public historians)*
  *   **Thesis:** History is a dialogue between present and past; presentism is unavoidable and should be harnessed for ethical or political ends.
  *   **Phenomena:** Aces the Ethical Friction and Motivational Friction.
  *   **Distinctions:** **Weak.** Often conflates Moral and Conceptual Presentism, risking anachronism in the pursuit of justice.
  *   **Structural Realism:** **High.** Fully accepts the Archival and Temporal Constraints.
  *   **Score:** **Medium-High.** Honest about the craft's limitations, but risks distorting the past's alterity to serve present needs.

  ***

  ### V. Recommendation for the Long Read

  The most fruitful angle for your piece lies in the **Incompatibility Problem**.

  Most historiographical debates stall because participants argue over which side of the Alterity/Intelligibility divide is 'correct'. Your argument could posit that presentism is not a bug to be fixed, but the **engine of historical meaning**.

  The 'spec sheet' suggests that the only viable theory is a **Reflexive Presentism**: one that admits the structural impossibility of escape (the Archive Constraint), accepts the tension between Alterity and Intelligibility, and makes the historian's positionality part of the evidence rather than a stain upon it.

  I hope this provides the necessary scaffolding. Do let me know if you require further elaboration on the Cambridge School's specific handling of linguistic contexts.

  Kind regards,

  **Research Assistant**
