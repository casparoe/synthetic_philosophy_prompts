prompt: |-
  I'm putting together a long read on presentism in historiography — whether historians can ever escape judging the past by today's standards, and if not, what that actually means for the craft. Before I dive in, I want a proper spec sheet: write the desiderata any adequate theory of historical presentism has to meet.

  What phenomena must it explain? Think about hard cases like applying modern bioethics to medieval plague quarantines, or describing pre-modern gender relations using categories that didn't exist then. Which distinctions must it preserve — moral presentism versus conceptual presentism, say? Which results must it stay consistent with — for instance, that every archive is catalogued with present-day metadata, so total escape from current categories is structurally impossible? Flag what's non-negotiable and what's just camp preference. If any two demands turn out to be jointly unsatisfiable given standard arguments about anachronism, say so — that's the bit I care about most.

  Then briefly score the usual contenders: the hard anti-presentists, the contextualists, and those who think presentism is unavoidable and should be embraced critically. How do they do against your list?

  Write it in British English please — my editors fussy about that. Aplogies for any typos in this brief.
