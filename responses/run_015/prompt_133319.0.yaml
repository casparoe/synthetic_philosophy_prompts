          *   Test 1: Indicative Statistical Check (Demographic Parity / Disparate Impact). Correlation between protected class and outcome in observed data.
          *   Test 2: Counterfactual Fairness Criterion (Individual Fairness / Causal Fairness). Would the decision change if the protected attribute changed, holding non-descendants constant?
      *   **Key Question:** What philosophical commitments about *indicative* vs. *counterfactual* conditionals does this practice presuppose?
      *   **Specific Sub-questions:**
          *   Does treating them as measuring "one thing" assume counterfactuals reduce to statistics?
          *   Or that correlations can be interpreted counterfactually without loss?
          *   Reconstruct the implicit theory of conditionals.
