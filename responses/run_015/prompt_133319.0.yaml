      *   Need to be precise about "Indicative" vs. "Counterfactual."
      *   Indicative: $P(Y|X)$. Epistemic conditional.
      *   Counterfactual: $Y_{X=x}$. Ontic/Subjunctive conditional.
      *   The practice assumes *Stalnaker's Thesis* (roughly): The probability of the indicative equals the probability of the counterfactual. Or stronger: The truth of the indicative implies the truth of the counterfactual.
