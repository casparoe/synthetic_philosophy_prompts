          *   Propose regulatory design changes if the distinction is *not* collapsed.

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *Indicative Conditionals:* "If $A$ is true, then $B$ is true." (Material implication or probabilistic dependence in the actual world). In auditing: $P(Y|A=0) \neq P(Y|A=1)$. This is about *observation*.
      *   *Counterfactual Conditionals:* "If $A$ had been true (though it wasn't), then $B$ would have been true." (Subjunctive, causal). In auditing: $Y_{A=0}(u) = Y_{A=1}(u)$. This is about *intervention/manipulation* in a causal model.
      *   *The "Collapse":* Regulatory frameworks often treat Disparate Impact (statistical) and Disparate Treatment (causal/intent-based, often proxied by counterfactuals) as two sides of the same coin. If they are treated as interchangeable measures of "unfairness," there's an implicit assumption that the statistical surface reflects the causal depth.
      *   *Philosophical Commitment:* This smells like a form of *Humean Reductionism* about causation (causation is just regularity/correlation) or a pragmatic *Instrumentalism* (we don't care about the metaphysics, just the outcome). However, structurally, it assumes the *Linkage Principle*: that observed associations are reliable proxies for causal dependencies.

  3.  **Reconstructing the Implicit Theory:**

      *   *Name:* Let's call it the "Statistical Surrogacy Theory of Conditionals."
      *   *Premise 1:* Fairness is a stable property of the system.
      *   *Premise 2:* Observed statistical disparities (indicative) are sufficient evidence of causal unfairness (counterfactual).
      *   *Premise 3:* The "world" is stable enough that $P(Y|A)$ approximates $P(Y|do(A))$.
      *   *Commitment:* It presupposes that the *indicative conditional* ("If someone is group A, they are likely to get outcome Y") is epistemically equivalent to the *counterfactual conditional* ("If this person were group A, they would get outcome Y").
      *   *Consistency Check:* Is this consistent? No. Simpson's Paradox, confounding, and selection bias break this link constantly. The theory is internally inconsistent with the mathematical reality of causal inference (Pearl's Ladder of Causation).

  4.  **Addressing the "Reduction" Question:**

      *   Does it assume counterfactuals reduce to statistics? Yes. It assumes the "causal" layer is accessible via the "associational" layer. This is a rejection of the fundamental gap identified by Hume and formalized by Pearl.
      *   Does it assume correlations interpret counterfactually? Yes. It assumes $P(Y|A)$ captures the *effect* of $A$, not just the *association* with $A$.

  5.  **Regulatory Design Implications (If we refuse the collapse):**

      *   If we acknowledge they are different:
          *   We need two different compliance regimes.
          *   Statistical parity becomes a "risk flag," not a "violation."
          *   Counterfactual fairness requires causal models (SCMs), not just datasets.
          *   Burden of proof shifts.
          *   Explanation requirements change (from "show the numbers" to "show the mechanism").

  6.  **Drafting the Response (Iterative refinement):**

