answer: |-
  The practice of treating indicative statistical checks (disparate impact) and counterfactual fairness criteria (individual/causal fairness) as interchangeable operationalizations of "unfairness" presupposes a specific, philosophically contentious theory of conditionals. It relies on an **Extensional Reductionism** that collapses the distinction between epistemic observation and ontic intervention.

  Below is a reconstruction of the implicit theory, an assessment of its consistency, and the regulatory implications of refusing this collapse.

  ### 1. The Implicit Theory of Conditionals: Associational Reductionism

  The auditing practice embeds what we might call **Associational Reductionism**. This theory posits that the truth conditions of a counterfactual conditional can be satisfied by the probabilistic strength of an indicative conditional within an observed dataset.

  *   **The Indicative Conditional:** "If $X$ (protected attribute), then $Y$ (adverse outcome)." In auditing, this is measured as $P(Y|X) \neq P(Y)$. This is an *epistemic* conditional concerning belief updates based on evidence in the actual world.
  *   **The Counterfactual Conditional:** "If $X$ had been $x'$, then $Y$ would have been $y'$." In auditing, this is $Y_{X=x'}(u) \neq Y_{X=x}(u)$. This is a *subjunctive* conditional concerning dependencies in a causal model across possible worlds.

  **The Philosophical Commitment:**
  By treating these as measuring the same underlying property ("unfairness"), regulators presuppose **Stalnaker's Thesis** in a strong, deterministic form: *The probability of the indicative conditional equals the probability of the counterfactual conditional.*

  More specifically, the practice assumes a **Regularity Theory of Causation** (Humean Supervenience). It assumes that causal dependencies (counterfactuals) supervene entirely on observed regularities (indicatives). It presupposes that there are no "hidden" causal structures (unobserved confounders) that would decouple the statistical correlation from the causal effect. Essentially, it assumes:
  $$ P(Y|do(X)) \approx P(Y|X) $$
  This is the assumption of **No Unobserved Confounding**. It treats the dataset as a closed system where correlation implies a manipulable dependency.

  ### 2. Consistency Assessment

  **The theory is logically inconsistent with the mathematical structure of causal inference.**

  The inconsistency arises from the **Ladder of Causation** (Pearl, 2018).
  1.  **Association (Seeing):** $P(Y|X)$ — The indicative layer.
  2.  **Intervention (Doing):** $P(Y|do(X))$ — The causal layer.
  3.  **Counterfactual (Imagining):** $P(Y_{X=x}|X=x')$ — The deepest causal layer.

  Associational Reductionism attempts to derive Layer 3 directly from Layer 1. This is invalid without strong structural assumptions (e.g., a known causal graph, ignorability).

  **Specific Points of Failure:**
  *   **Simpson's Paradox:** An indicative check might show bias ($P(Y|X=1) > P(Y|X=0)$), while the counterfactual check shows fairness (once a confounder $Z$ is controlled, $P(Y|do(X))$ is equal). Treating these as the same measurement leads to contradictory verdicts on the same system.
  *   **Proxy Variables:** If a feature $Z$ (e.g., zip code) is a perfect proxy for $X$ (race) but is not causally downstream of $X$ in the model's logic, an indicative check on $X$ might pass (if $X$ is removed), but the counterfactual on $X$ would fail (because changing $X$ implies changing $Z$). The reductionist view cannot distinguish between *redlining* (causal) and *correlated risk* (statistical).
  *   **The Reference Class Problem:** Indicative conditionals rely on grouping (protected class). Counterfactuals rely on individual structural equations. Collapsing them assumes the group average is a valid proxy for the individual structural mechanism, which commits the **Ecological Fallacy**.

  Therefore, the implicit theory is **inconsistent**. It asserts an equivalence between two logical operators that operate on different semantic domains (distributional frequency vs. structural mechanism).

  ### 3. Regulatory Design Without the Collapse

  If we refuse to collapse the indicative/counterfactual distinction, we must acknowledge that they measure different normative harms: **Disparate Impact** (group-level distributional harm) vs. **Disparate Treatment** (individual-level causal harm). Regulatory design would need to shift from a "compliance checklist" to a "causal governance" framework.

  **A. Tiered Auditing Protocols**
  Currently, a statistical failure often triggers a legal violation. In a non-collapsed framework:
  *   **Level 1 (Indicative):** Statistical disparities become **risk flags**, not violations. They trigger a duty to investigate, not a presumption of guilt.
  *   **Level 2 (Counterfactual):** Violations require proof of causal dependency. The regulator must demand a Structural Causal Model (SCM) or a valid identification strategy (e.g., instrumental variables, randomized control trials) to prove that $X$ *caused* $Y$.

  **B. Shift in Burden of Proof**
  *   **Current:** The auditor shows disparity; the defendant must prove "business necessity."
  *   **Revised:** The auditor must demonstrate a *causal pathway*. If the defendant can show that the correlation is spurious (e.g., driven by a common cause $Z$ that is legitimate), the indicative disparity is legally irrelevant. This aligns with the philosophical distinction between *correlation* and *responsibility*.

  **C. Causal Documentation Requirements**
  Regulators would no longer accept "Model Cards" that list accuracy and demographic parity. They would require **Causal Graphs**.
  *   Engineers must declare which features are descendants of the protected attribute.
  *   Auditors must verify that the "hold constant" condition in the counterfactual test is logically possible (i.e., you cannot hold a descendant constant while changing the ancestor without breaking the model's physics).

  **D. Safe Harbors for Causal Independence**
  If an organization can prove via counterfactual analysis that $Y_{X=0} = Y_{X=1}$ for all individuals, they should be granted a **Safe Harbor** against indicative statistical claims. This acknowledges that a system can be statistically imbalanced due to historical data bias (the world is unfair) without being algorithmically unfair (the model does not propagate the unfairness).

  **E. Dynamic vs. Static Evaluation**
  Indicative conditionals are static (snapshot of data). Counterfactuals are dynamic (predicting response to change).
  *   Regulation would shift from **retrospective auditing** (looking at past decisions) to **prospective stress-testing** (simulating interventions).
  *   This requires access to the model's weights and architecture, not just API access, because counterfactuals cannot be estimated from observational data alone without model knowledge.

  ### Summary

  The current practice presupposes that **causation reduces to correlation**. It treats the counterfactual conditional as a disguised indicative conditional. This is philosophically untenable and mathematically inconsistent.

  Refusing this collapse requires a regulatory paradigm shift: **from policing outcomes to policing mechanisms.** It moves the legal question from "Did the groups come out differently?" to "Did the system *make* them come out differently?" This demands higher technical transparency but offers a more philosophically robust definition of fairness—one that distinguishes between reflecting an unjust world and perpetuating it.
