answer: |-
  Scientific credit institutions must be reformed to redistribute recognition from the first proposers of content-inevitable results to the builders of transmissible practices, because scientific progress is driven by the usability of knowledge rather than the priority of its conception.

  The fundamental error of priority-based credit is the assumption that science advances primarily through the accumulation of true propositions. In reality, science advances through the accumulation of *capabilities*. A proposition that remains locked in an idiosyncratic formalism, devoid of standardized notation or canonical examples, is scientifically inert; it is a secret rather than a tool. When a discovery is content-inevitable but practice-contingent, the historical labor that actually expands the frontier of knowledge is not the insight itself—which was waiting to be found—but the construction of the machinery that allows others to use it. Therefore, normative credit should track contribution to scientific uptake. If Leibniz's notation enabled the Continental explosion of analysis while Newton's fluxions stagnated, Leibniz contributed more to the *living science* of calculus, regardless of who conceived the core theorem first. By rewarding priority alone, we incentivize racing to publish bare assertions rather than investing the labor required to make those assertions robust, generalizable, and teachable. Redistribution corrects this by aligning reward with the actual engine of progress: the transformation of private insight into public practice.

  Against the objection that practice-building is visible only in hindsight, and thus credit cannot be administered in real time, it must be noted that scientific credit is already largely retrospective. Eponymy is rarely assigned at the moment of publication; Nobel Prizes often lag decades; historical reputation shifts over centuries. The administrability problem assumes credit must be instant to be effective, but norms of citation and attribution are flexible enough to accommodate retroactive correction. We can cultivate a norm where citing the "standard formulation" carries as much weight as citing the "original source," or where secondary papers that formalize a discovery are granted co-primary status in tenure and prize evaluations. Furthermore, peers are not blind to practice quality in real time; reviewers routinely assess clarity, generality, and methodological robustness. These contemporaneous judgments can be institutionalized to weight "usability" alongside "novelty," mitigating the hindsight bias without requiring omniscience.

  Against the objection that a practice-contingent result is really several discoveries rather than one, and thus there is no single item of credit to redistribute, this view misconstrues the ontology of scientific objects. While Newton's fluxions and Leibniz's calculus were technically distinct formalisms, the scientific community converged on treating them as competing solutions to a singular problem-space: the mathematics of change. The "discovery" is not the specific inscription but the problem-solving capacity released into the community. If two teams build different bridges to the same island, and one bridge collapses while the other carries traffic, the utility provided to the islanders is singular, even if the structures differ. To claim they are entirely separate discoveries is to ignore the sociological reality that science functions by consolidating redundant paths into canonical tools. Redistributing credit acknowledges that the "discovery" is a composite artifact composed of proposition plus practice; when the practice differs, the contribution to that composite varies, warranting a division of credit based on utility rather than a winner-take-all prize based on timestamp.
