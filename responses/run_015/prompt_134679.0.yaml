answer: |-
  The air in the Deep Spoil smelled of vinegar and slow rot. Elara sat at the iron desk, the single document under the magnifier humming with the silence of five hundred years. It was a tax receipt, brittle as dried skin, stamped with the seal of the First Founder.

  Outside the heavy oak doors, High Councilor Varrick waited. He needed her verdict by dawn. The City Charter required a centennial review of the Founding narrative. If the Archive declared the Founding mythical, the Council's divine mandate evaporated. The banks would freeze. The border guards would lay down their spears. If she declared it historical, the Vulgate—the beautiful, ritual story of the Founder's benevolence—became law again for another hundred years.

  Elara adjusted the focus. The receipt was from Year One of the City. The Vulgate stated clearly that the Founder had abolished all tribute upon arrival, bringing abundance from the wasteland. This receipt proved someone had paid grain to the Founder's administration in Month Three.

  It was a perfect candidate for corroboration. It satisfied the Independence Rule: the detail appeared in the Spoil, not the Vulgate. It satisfied the Embarrassment Heuristic: it shamed the city's origin story, depicting the Founder not as a savior but as a warlord collecting rent. By all professional metrics, the receipt was genuine. It was the smoking gun that turned legend into history.

  But Elara couldn't shake the texture of the paper.

  She reached for the chemical kit, mixing a drop of solvent onto a spare fragment from the receipt's edge. The paper didn't dissolve as expected. It held. She leaned in, smelling the faint, sweet scent of lignin preservative. That chemical hadn't been synthesized until two centuries after the Founding.

  Someone had planted this.

  The Spoil was supposed to be the trash heap of history—the unsorted, unloved debris that survived by accident. But this receipt hadn't survived by accident. It had been preserved. Someone had treated the paper to ensure it lasted, then planted it in the damp dark of the Spoil to be "discovered" now, at the centennial review.

  The independence assumption had failed. The Spoil wasn't independent; it was a garden, and this was a prize flower planted among the weeds.

  Elara leaned back, rubbing her eyes. The complication wasn't just the forgery. It was what the forgery implied about the model of survival. Varrick and his peers argued that absence of evidence was evidence of absence. *Why no other receipts?* they asked. *Because none were written.* Elara knew the truth: receipts were written every day. They rotted. The only reason this one existed was because someone *wanted* it to exist. The fight wasn't about the past; it was about the probability of decay. Varrick believed in a past that preserved what mattered. Elara knew the past preserved only what was kept dry.

  She looked at the receipt again. It was a lie. But it was a lie that told a truth: the City had always been an administration, not a miracle. The Founder had taken grain. The City had survived.

  The door creaked. Varrick stepped in, his robes whispering against the stone floor. He didn't look at the document. He looked at her hand, hovering over the verdict ledger.

  "Well?" he asked. His voice was tired. He knew what hung on her pen.

  "The Independence Rule is compromised," Elara said. "The Spoil has been curated. This receipt was planted."

  Varrick didn't flinch. "Does that change the fact of the Founding?"

  "It changes the evidence. If the Spoil is manipulated, we have no independent corroboration for the Vulgate. Technically, the verdict is 'No.' The Founding is myth."

  Varrick walked to the desk, placing a hand on the iron surface. "If you write 'No,' the grain shipments from the hinterlands stop tomorrow. The merchants don't care about ink chemistry. They care about the Charter. If the Charter is myth, the trade agreements are void."

  "I know."

  "Then write 'Yes.'"

  "If I write 'Yes,' I validate the receipt. You'll use it."

  "We will use the stability," Varrick corrected. "The people need to know the City is real. The specifics... the specifics are for us to manage."

  Elara looked at him. This was the spending she feared. The confirmation of the vague claim—*the City is real*—would be spent on the specific one—*the Founder's policies are binding*. They would take the "Yes" and use it to enforce the tax on the receipt, claiming the Founder himself had levied it. They would trade the legitimacy of the existence for the legitimacy of the exploitation.

  "The receipt is a forgery," Elara said. "It embarrasses the Founder, so it looks real. But it was forged to justify a current policy. You're going to raise the grain tax."

  "We are going to stabilize the supply," Varrick said. "History is a tool, Elara. Not a shrine. If this document keeps the city fed, does it matter who stamped the seal?"

  "It matters if the truth is the only thing we own."

  "We own the walls," Varrick said softly. "We own the granaries. We own the future. The past is just the foundation. If the foundation is cracked, we pour concrete. We don't tear down the building."

  Elara looked back at the magnifier. The receipt sat there, a tiny, brittle lie. It proved that someone, five hundred years ago or five days ago, wanted the City to believe it was taxed. It proved that power required paperwork. In a way, that was more historical than the Vulgate's magic. The Vulgate said the Founder fed them from nothing. The receipt said someone had to pay.

  The absence of other records wasn't because they didn't exist. It was because the winners kept the ledgers that suited them and burned the rest. The model of survival was a model of power.

  She picked up the pen. The ink was black, permanent.

  If she wrote "No," the City might fall. Riots in the lower wards. Starvation in the winter. The truth would die with them.
  If she wrote "Yes," the City would stand. The tax would rise. The lie would harden into law.

  She thought about the Independence Rule. It was supposed to protect them from this—from the story eating the fact. But the story had eaten the fact long ago. The Spoil was just the story's digestion.

  "You're asking me to certify a lie," Elara said.

  "I'm asking you to certify the City," Varrick said. "The rest is commentary."

  Elara dipped the pen. She felt the weight of the vague claim pressing against the specific one. *Did it happen?* Yes, a city was built. *Did it happen as told?* No. But the Council would hear only the first answer and spend it on the second. They would take the existence of the City and trade it for the divinity of the Council.

  She wrote.

  **VERIFIED.**

  The word dried quickly on the page. Varrick exhaled, a sound like a bellows emptying. He took the ledger without looking at the receipt. He didn't need the lie anymore; he had the verdict.

  "The Council will convene at noon," Varrick said. "We will announce the restoration of the Tithe of Year One. The receipt proves it is traditional."

  "It proves nothing," Elara said.

  "It proves what we need it to," Varrick replied. He turned to the door. "You've saved us, Archivist. History will thank you."

  "It won't," Elara said. "History won't know."

  Varrick paused, hand on the latch. "Then it doesn't matter."

  He left. The heavy door boomed shut. Elara was alone with the smell of vinegar and the hum of the magnifier. She looked at the receipt one last time. It was just paper. It would rot eventually, even with the preservative. When it did, another lie would take its place.

  She stood up and walked to the furnace in the corner. She opened the iron door. The heat hit her face, dry and hungry. She picked up the receipt with the tweezers.

  She shouldn't. It was evidence. It was her duty to preserve the Spoil.

  But the Spoil was corrupted. The independence was gone. If this paper was the price of the City's survival, she wouldn't let it be the price of their memory too. She dropped the receipt into the fire.

  It curled, blackened, and vanished into ash.

  Elara closed the furnace door. She walked back to the desk and opened the logbook again. Below her verdict, in the notes section, she wrote: *Corroboration established via administrative continuity. Specific narratives remain unverified.*

  It was a small distinction. Varrick would ignore it. The people would ignore it. But it was there. The vague claim was granted; the specific one was withheld. She had given them the City, but she had kept the Truth.

  She blew out the lamp. The Archive went dark, save for the glow of the furnace grate, where the evidence of the Founding burned down to nothing, warming the room for the historians who would come next, searching for a past that was never there.
