  **Decomposition**

  1.  **Serial Depth (0.70):** Algorithmic efficiency will reduce training iterations, but physical data collection and real-world feedback loops impose an irreducible latency floor.
  2.  **Atoms Constraint (0.60):** Emergency mobilization can exceed 30% capital growth, but supply chain rigidity and power grid limitations make this a coin flip.
