  4.  **External Stoppers (0.85):** Geopolitical friction is certain, but a complete multi-year global halt or reliability wall is less probable.
  5.  **Combination:** Multiplicative risk model (0.70 × 0.60 × 0.70 × 0.85 ≈ 0.25); to reach your 0.35, your implicit sub-credences must average ~10% higher across these bottlenecks.

  **Well-Posedness Verdict**
  The three-year figure is not well-posed because calendar time decouples from research progress at Milestone A; the honest re-specification is "within three hardware deployment cycles" or "within five physical capital doubling times," since the bottleneck shifts from cognitive labor to atomic rearrangement.

  **Sensitivity Analysis**
  The **Atoms Constraint** is the single highest-leverage sub-question; updating this by 0.2 moves the headline by ~0.05. You and your colleague genuinely disagree here: you assume economic elasticity (capital flows to demand), while he assumes physical inelasticity (fabs and grid upgrades have fixed lead times regardless of funding).
