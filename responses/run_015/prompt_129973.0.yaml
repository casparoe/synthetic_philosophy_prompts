answer: |-
  You are grappling with what Daniel Dennett calls "Strange Inversions of Reasoning"—cases where the appearance of design or intelligence emerges from processes that lack a designer or understander. Your intuitions are sharp, but they rest on a fragile distinction between *competence* (getting the right answer) and *reasoning* (manipulating a model to get there).

  There is a coherent principle that saves most of your verdicts, but it demands precision about what constitutes a "model." It also exposes one verdict that is philosophically expensive to maintain.

  ### The Principle: Inferential Mobility within a Causal Model

  **Definition:** A system is reasoning if and only if it manipulates internal representations that encode **causal relations** (not merely statistical correlations) and possesses **inferential mobility**.

  **Inferential Mobility** requires two capacities:
  1.  **Counterfactual Intervention:** The system can answer "what if" questions by manipulating its internal model (e.g., "If inheritance were blending rather than particulate, would selection still work?").
  2.  **Cross-Domain Integration:** The internal states serving as premises can be exported to justify inferences in *new* domains not covered by the original training or design (e.g., using natural selection to explain antibiotic resistance after originally formulating it for finches).

  This principle distinguishes between *simulating an outcome* (competence) and *manipulating the logic that produces the outcome* (reasoning).

  ---

  ### Application to Your Cases

  1.  **Darwin (Natural Selection):** **Verdict: Reasoning.**
      *   *Clause:* **Counterfactual Intervention.** Darwin possessed a propositional model of selection. He could mentally vary the parameters (rate of variation, pressure of environment) and predict the outcome. He could also integrate this model with geology (Lyell) and economics (Malthus). The opacity of heredity was a gap in the *mechanism*, not the *logic*. He was manipulating the causal architecture, even if one brick was missing.

  2.  **Turing (Imitation Game):** **Verdict: Attribution Rule.**
      *   *Clause:* **Meta-Epistemic.** This fits cleanly as a boundary condition. Turing defines the *test* for intelligence based on output, deliberately bracketing the *Principle* above. Your verdict holds because Turing is making a claim about *our* justification for attribution, not the machine's internal causal model.

  3.  **Protein-Folding Neural Network:** **Verdict: Not Reasoning.**
      *   *Clause:* **Statistical Correlation vs. Causal Model.** The network minimizes a loss function based on sequence-structure pairings. It does not encode Coulomb forces, entropy, or hydrophobicity as *causal variables* it can manipulate. If you ask it, "What if the strong nuclear force were weaker?", it cannot adjust its folding prediction because it has no model of physics, only a map of correlations. It lacks Inferential Mobility.

  4.  **Chess Engine (Brute-Force):** **Verdict: Not Reasoning.**
      *   *Clause:* **Optimization vs. Manipulation.** As you specified, this engine searches a tree and evaluates board states via heuristics (e.g., material count). It does not possess a concept of "initiative" that it can deploy outside the game. It cannot explain *why* a move is good in terms of strategic causality, only that it leads to a higher evaluation score. It is optimizing a path, not reasoning about a domain.

  5.  **Human Sommelier:** **Verdict: Reasoning (Tacit).**
      *   *Clause:* **Cross-Domain Integration.** While she cannot articulate the chemical cues, her neural architecture has built a causal model of terroir. We know this because she exhibits Inferential Mobility: she can learn a new region, adjust her palate if told a bottle is mislabeled, and use her tasting to infer price, age, or climate. Her "black box" is cognitive, capable of active inquiry, not just passive mapping.

