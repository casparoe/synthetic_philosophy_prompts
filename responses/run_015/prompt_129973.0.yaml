  ### Prediction: The Evolutionary Antenna

  **Case:** An evolutionary algorithm generates an antenna shape humans cannot design or fully understand, yet it works optimally.
  **Verdict:** **Not Reasoning.**

  **Explanation:** This is the crux of your hesitation. Under the Principle of Inferential Mobility, the algorithm is a **competence engine**, not a reasoner.
  *   **Why:** The algorithm executes a process of variation and selection, but it does not *represent* the logic of that process. It cannot answer, "Why did you choose this shape?" other than "It had higher fitness." It cannot take the concept of "evolved antenna" and apply it to "evolved bridge design" without being reprogrammed.
  *   **Distinction:** Darwin *used* the logic of selection to reason about nature. The antenna algorithm *is* the logic of selection executing on silicon. The reasoning belongs to the engineers who set the fitness function, not the system that optimized it. It is "selection without a selector's understanding."

