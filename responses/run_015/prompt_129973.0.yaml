  ### Prediction: A New Case

  **Case:** **A Climate Simulation Model.**
  Scientists input CO2 levels, ocean currents, and albedo effects into a supercomputer to predict global temperature rise in 2100.
  **Verdict:** **Reasoning (Augmented).**

  **Explanation:** Unlike the protein folder, this system is built on **explicit causal equations** (fluid dynamics, thermodynamics).
  *   **Why:** Scientists can manipulate the variables counterfactually ("What if we remove all clouds?"). The system's internal states represent physical forces, not just statistical fits. It possesses Inferential Mobility: the same model logic can be applied to Jupiter's atmosphere or ancient Earth. It is a tool *for* reasoning, extending the scientist's causal model, rather than a black-box oracle.

