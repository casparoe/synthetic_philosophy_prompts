answer: |-
  The Review Chamber smelled of lemon oil and stale air, a neutral scent designed to provoke no memory. Dr. Elias Thorne sat at the small table, his hands folded over a tablet that held the Value-Continuity Bond. Across from him sat Julian Vane.

  Ten years ago, Julian had been a man of jagged edges and deep roots. He was a historian of trauma, a man who believed that suffering was the only legitimate architect of meaning. He had signed the Bond the week his wife, Elena, died of a neuro-degenerative fade. The stipulation was specific: *If I ever come to view her memory as data to be optimized, or grief as an inefficiency to be cured, I am no longer the signatory of this life.*

  It was a clause for axiological discontinuity. Not dementia. Not depression. A fundamental reversal of the moral compass.

  Julian looked healthy. His skin had the glow of the new cellular treatments, his eyes clear and bright. He smiled at Elias, a warm, open expression that the old Julian would have called "suspiciously unburdened."

  "Elias," Julian said. "You look tired."

  "The weight of the office, Julian."

  "Still carrying the world?" Julian chuckled. "I told you ten years ago that was a poor use of kinetic energy."

  Elias didn't smile. He tapped the tablet. "We need to conduct the final review. The Trustee's Prerogative."

  "Of course. The ritual of the knife." Julian gestured to the tray between them. "Shall we eat? I ordered for us."

  It was a test, Elias knew. The protocol encouraged a shared meal to observe behavioral congruency. On the tray sat two bowls of *sopa de luto*—mourning soup. Black beans, charred corn, bitter herbs. It was Elena's recipe. It was the dish they had eaten at the vigil. It was the dish Julian had sworn, in the presence of the notary, he would never eat without a toast to the dead.

  Julian pushed his bowl slightly away.

  "Aren't you hungry?" Elias asked.

  "It's high in purines," Julian said lightly. "And the bitterness triggers a cortisol response. I've adjusted my diet for optimal cognitive throughput. Why induce stress chemically when the mind is clear?"

  "The bitterness is the point, Julian. It's the taste of the loss."

  Julian tilted his head, bird-like. "Loss is a accounting error, Elias. Elena is gone. To simulate her presence through gastric distress is... sentimental. It doesn't honor her. It honors the ego's inability to update."

  Elias felt a cold tightening in his chest. This was the discontinuity. The old Julian believed that to forget the pain was to kill the love. The new Julian believed that pain was merely a signal to be silenced.

  "Do you remember the letter?" Elias asked. "The one she left. The last page."

  "Digitized in the cloud," Julian said. "Accessible via neural link."

  "No. The words. The phrase she wrote at the bottom."

  Julian paused. For a second, the smooth facade flickered. "She wrote... *'The scar is the map.'*"

  "And what does that mean to you now?"

  Julian picked up his spoon, stirring the black beans without lifting them. "It means we track damage to avoid recurrence. It's a warning label."

  "It meant that the damage *was* the path," Elias corrected, his voice low. "It meant we don't walk around the wound. We walk through it. That's what you wrote in your commentary on the Bond. *'If I seek to heal the wound rather than bear it, I have betrayed the witness.'*"

  Julian set the spoon down. He looked at Elias with a pity that felt like a violation. "That man was in pain, Elias. He was drowning in a chemical storm of grief. He wrote those words while his cortisol levels were triple the baseline. Why should his drowning gasp dictate the terms of my breathing?"

  "Because he was the one who signed the contract," Elias said. "He was the one who knew what he valued. You are... you are someone else wearing his face."

  "I am the same organism," Julian countered. "I have the same memories. I recall loving her. I simply recall it without the agony. Is love less real because it doesn't hurt? Or is your definition of love dependent on suffering?"

  Elias looked at the bowl of soup. The steam had stopped rising. It was just cold, dark matter now.

  If he authorized the dissolution, he would be killing a healthy, happy man. A man who contributed to society, who felt joy, who was free of the crushing weight that had nearly killed Julian five years prior. To end this life would be an act of tyranny, imposing the ghost of a dead man's sorrow on a living man's joy.

  But if he refused... he was allowing a stranger to inhabit a life that was paid for by a promise. The Julian who signed the Bond believed that a life without that specific fidelity was not a life worth living. He had essentially said, *'If I become this man, kill me.'*

  To let Julian live was to invalidate the moral authority of the past self. It was to say that the person you were at your most principled moment has no right to bind the person you become when you are comfortable.

  "Julian," Elias said softly. "If I authorize this, you die. You know that. You feel no fear?"

  "Fear is a preservation heuristic," Julian said. "I understand the mechanism. I do not feel the sting."

  "There it is," Elias whispered.

  "There what is?"

  "The discontinuity." Elias reached for the stylus. His hand hovered over the screen. The interface showed two options: *Ratify Continuity* or *Authorize Dissolution.*

  "Elias," Julian said, and for the first time, his voice lost its smooth, optimized cadence. It sounded almost human. "If you do this... you are killing me because I am happy. Are you sure that's fidelity? Or is it just vengeance for a grief you think I owe you?"

  Elias looked at the soup. He thought of Elena. He thought of the Julian who had wept until he vomited at the funeral, a man who believed that his pain was the only monument she would have.

  If he signed, he protected the memory of the dead and the integrity of the promise. He preserved the definition of humanity that valued scars over smoothness.

  If he put the stylus down, he acknowledged that people change, that survival is the only true imperative, and that the past has no right to execute the future.

  The silence in the room grew heavy, pressing against the glass walls. Outside, the city hummed, a million people evolving, changing, betraying their younger selves every day.

  Elias looked at Julian. He saw a stranger who knew his name. He saw a friend who had forgotten his soul.

  "The scar is the map," Elias said again.

  "No," Julian replied, picking up his water glass. "The map is outdated. We have GPS now."

  Elias uncapped the stylus. The tip hovered over the glass, inches from the *Authorize* command. He looked at the cold soup, then at the man who refused to taste it. He wondered if fidelity was a virtue, or just a cage for the living.

  He did not sign. He did not put the pen down. He sat in the silence, holding the weight of a life that was no longer the one it had promised to be, waiting for a truth that the meal would not give him.
