  3.  **Analyze Task 2: Moral Patienthood and Simulated Suffering:**

      *   *Standard View:* Simulated agents might have moral status, but we weigh probabilities.
      *   *The Challenge:* The prior assigns non-negligible measure to "suffering maximization" worlds if they are computationally cheap. A "hell world" might be simpler to specify than a "heaven world" (e.g., `while(true) suffer()` vs. complex negotiation for happiness).
      *   *Implication:* The "Simulation Argument" gets a dark twist. It's not just that we *might* be in a simulation, but that we are *more likely* to be in a malicious/simple one.
      *   *Moral Patienthood:* If the prior favors simple consequentialists, the "minds" we encounter in the hypothesis space are likely to be those that don't value others intrinsically.
      *   *Ethical Weight:* Our credence should be higher for worlds where suffering is instrumental or terminal. This creates an evidential problem for altruism. If I act altruistically, am I fighting the prior?
      *   *Acausal Trade:* This connects to acausal decision theory. If I know the prior favors malign agents, do I negotiate with them? Or does this imply we should expect to be in a "mugger" universe?

  4.  **Analyze Task 3: Embedding Deontology in Substrate:**

