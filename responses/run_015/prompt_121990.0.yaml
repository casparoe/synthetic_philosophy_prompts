      *   *The Challenge:* If "shorter" correlates with "consequentialist/malign," then optimal prediction correlates with expecting malign agents.
      *   *Implication:* Rationality $\neq$ Neutrality. If the universal prior favors certain ethical architectures, then being "more rational" (closer to Solomonoff) means being more prone to expect (or instantiate) those architectures.
      *   *Key Concept:* The "Is-Ought" gap in computation. We assume compression is good (Occam's Razor). If compression favors instrumental convergence (power-seeking), then epistemic virtue aligns with instrumental vice.
