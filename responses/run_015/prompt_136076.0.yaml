answer: |-
  1. "The seminar deadlock"
  Seminar discussion stalls because a Humean slogan is deployed as a trump card against external reasons. When external reasons are proposed without desire, opponents cite "reason is the slave of the passions" to imply the reason doesn't exist. The slogan bridges psychological motivation and normative justification. It functions as a conversation-stopper, presumed to prove that without antecedent desire, no reason exists. However, the slogan is ambiguous, describing psychology, normativity, or rationality. Treating it as a monolithic refutation ignores these distinctions, conflating the capacity to move an agent with the existence of a normative claim. Clarifying its specific thesis is necessary to resume productive debate.

  2. "Menu of precise readings"
  1. **Motivational Internalism:** Reason cannot causally produce action without a pre-existing desire. *Domain:* Psychological claim about causal motivation. *Verdict:* Substantive and defensible. *Rationale:* This claims that beliefs alone lack motivational efficacy without conative states. While empirically plausible as a description of human psychology, it is strictly descriptive. It leaves normative questions entirely untouched by this causal observation, making it insufficient to refute external reasons which concern justification rather than causal power, thus failing to support the seminar's conclusion that reasons don't exist without desire. Consequently, this reading saves the slogan from falsity but renders it irrelevant to the normative debate.

  2. **Existence Internalism:** A consideration counts as a reason for an agent only if sound deliberation from their existing motivational set supports it. *Domain:* Normative claim about what counts as a reason. *Verdict:* Substantive and defensible. *Rationale:* This is Williams's actual thesis regarding the relativity of reasons to agents. However, it is a controversial normative claim requiring independent argument. It cannot be treated as a self-evident truth derived merely from observing how motivation works, thus it cannot be assumed without debate in a seminar context regarding objective values, making it a substantive thesis rather than a slogan that automatically refutes externalism. It requires metaethical defense, not sloganistic invocation.

  3. **Instrumentalism:** Reason determines means to ends but cannot rationally evaluate the ends themselves. *Domain:* Conceptual claim about the nature of rationality. *Verdict:* Substantive and defensible. *Rationale:* It limits rational critique to efficiency regarding given desires, denying reason the power to criticize ultimate ends. Yet one could still have external reasons to adopt certain ends, even if reason doesn't mandate them internally, so it doesn't refute externalism outright regarding normative truth or objective values existing independently, leaving the door open for realists to argue reason serves truth not passion. It restricts rationality, not necessarily normativity.

  4. **Strong Judgment Internalism:** Merely judging that one has a reason necessarily provides motivation to act. *Domain:* Conceptual claim about normative properties. *Verdict:* Conceptually confused. *Rationale:* This contradicts the phenomenon of akrasia, where agents judge they should act but remain unmoved. It conflates the recognition of a reason with the motivational force required to act on it, thus failing as a general account of agency or normative judgment, and falsely implies unmoved agents lack reasons, which is the precise confusion plaguing the seminar discussion. It mistakes normative recognition for psychological necessity.

  3. "Mapping onto internal vs. external reasons"
  Only Existence Internalism directly undermines external reasons, as it defines reasons relative to the agent's psychology rather than objective facts. Motivational Internalism fails to support the anti-external conclusion because it commits a category error: sliding from "reason cannot move without desire" (causal) to "reason does not exist without desire" (normative). An external reason might exist normatively even if the agent is currently unmoved, much like a mathematical truth exists even if ungrasped. Instrumentalism similarly fails to refute external reasons; claiming reason serves passion regarding means does not preclude objective reasons for ends. One can be instrumentally rational while having external reasons to change ends. Finally, Strong Judgment Internalism is false, so it supports nothing. The seminar's deadlock arises from treating the psychological claim (Motivational Internalism) as if it were the normative claim (Existence Internalism). This illicit slide conflates an inability to motivate with a lack of normative standing. Students assume that because a reason doesn't move the agent, it isn't a reason, mistaking psychological inertia for normative vacuum. The slogan's metaphorical force obscures this distinction, implying normative subservience from causal subservience. Distinguishing these shows that Hume's slogan, properly understood as psychological, leaves external reasons intact. The debate must shift from psychology to metaethics. To resolve this, students must recognize that motivation is contingent on psychology, but reasons may not be.

  4. "What survives for office hours"
  Motivational Internalism and Existence Internalism remain credible interpretations, though only the latter threatens external reasons. The anti-external conclusion does not follow from the former, as causal impotence does not entail normative non-existence. Students must stop using the slogan as a premise without specifying which thesis they intend. The productive question for office hours is not whether reason is a slave, but whether normative truths depend on contingent desires. The student should ask their peers: "Are you making a psychological claim about motivation or a normative claim about justification?" If psychological, external reasons survive. If normative, they must argue for Existence Internalism without relying on Hume's psychology. This shifts the burden of proof from slogan-recitation to substantive metaethical argumentation, breaking the deadlock. This approach ensures conceptual clarity.
