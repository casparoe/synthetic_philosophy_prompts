          *   *Impact on False Positives:* Does *not* dismiss the concern. If anything, it heightens it (labeling harm).

      *   *Level 2: Intermediate/Causal.*
          *   *Claim:* Labels change behavior in ways that validate the label (self-fulfilling prophecy).
          *   *Mechanism:* Causal/Behavioral.
          *   *Status:* Defensible Substantive Thesis (empirically supported in some cases).
          *   *Impact on False Positives:* Does *not* dismiss the concern. A false positive who becomes "true" due to labeling is still a harm (iatrogenic effect).

      *   *Level 3: Strong/Epistemic.*
