      *   *Interactive Kinds:* Humans (they react to being classified).
      *   *Indifferent Kinds:* Quarks/Stars (they don't care).
      *   *The Classmate's Argument:* "Classifications loop back... so debating boundaries is moot."
      *   *The User's Skepticism:* Looping doesn't necessarily make boundary disputes irrelevant (especially regarding false positives/harm).

  3.  **Drafting the Menu of Claims:**

      *   *Level 1: Trivial/Weak.*
          *   *Claim:* Labels change how people think about themselves.
          *   *Mechanism:* Semantic/Psychological.
