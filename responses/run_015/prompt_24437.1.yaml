answer: |-
  Here is a specification for a theory of the criminal law's scope regarding private morality, designed to cut through the standard "Harm vs. Moralism" caricature and address the specific tensions in the Hart-Devlin exchange.

  ### I. The Desiderata (The Spec)

  A theory of legal moralism (or its limit) must function as a decision procedure for a legislator facing the **Wolfenden docket**: consensual adult homosexuality in private, street prostitution, recreational drug use, and the publication of obscenity. To be adequate, it must deliver the following:

  #### 1. Action-Guidance (The "Legislator Test")
  *   **Requirement:** The theory must yield a determinate verdict (criminalize, decriminalize, or regulate) for the Wolfenden cases without requiring the legislator to possess omniscience.
  *   **Consideration:** A theory that says "balance social cohesion against liberty" is useless without a metric. Devlin fails here if "intensity of feeling" is the metric, as feelings fluctuate. Hart fails if "harm" is undefined (e.g., is corruption of character a harm?).
  *   **Status:** **Non-negotiable.** (A legal theory that cannot guide legislation is not a legal theory.)

  #### 2. The Justification Condition (The "Coerced Test")
  *   **Requirement:** The theory must explain how the state justifies the use of force to the person being punished in terms that are not purely circular (e.g., "You are punished because we dislike what you did").
  *   **Consideration:** If the only reason for coercion is "the majority feels disgusted," the minority member is treated as a resource for the majority's psychological comfort, not a citizen.
  *   **Status:** **Non-negotiable** (for a liberal democracy); **Prejudice of the Hartian Camp** (Devlin explicitly rejects this, arguing the law's authority comes from the community's existence, not the individual's consent).

  #### 3. The Disintegration Threshold (The "Devlin Test")
  *   **Requirement:** The theory must account for the empirical claim that shared morality is a structural necessity for society, while distinguishing between *moral change* and *social collapse*.
  *   **Consideration:** Devlin's core insight is that law expresses social bonds. A theory that ignores this treats society as a mere contract between strangers. However, it must distinguish between "we are changing our morals" (acceptable) and "we are losing the capacity to judge collectively" (catastrophic).
  *   **Status:** **Prejudice of the Devlinian Camp** (Hartians view this as an empirical error; society can hold together via procedural consensus rather than substantive moral agreement).

  #### 4. The Public/Private Boundary (The "Wolfenden Test")
  *   **Requirement:** The theory must define "private" without relying on physical location alone.
  *   **Consideration:** Wolfenden distinguished private homosexual acts from public prostitution. But if harm is the criterion, private drug use harms the self. If public morality is the criterion, private sin offends God. The theory must explain why *privacy* acts as a shield against the law even if the act is deemed immoral or harmful to the agent.
  *   **Status:** **Non-negotiable.** (Without this, the law has no limit on intrusion.)

  #### 5. The Intensity vs. Truth Distinction
  *   **Requirement:** The theory must clarify whether the law enforces morality because it is *true* or because it is *held intensely*.
  *   **Consideration:** Devlin is often read as a legal moralist (law enforces truth), but his "intensity of feeling" argument suggests a sociological positivism (law enforces what is believed). If the majority intensely believes lying is fine but theft is sin, does the law follow the intensity or the "real" morality?
  *   **Status:** **Prejudice of the Devlinian Camp.** (Hartians insist law should not enforce morality regardless of intensity.)

  ---

  ### II. Incompatibility Flags

  You asked specifically about the tension between **Justification to the Coerced** and **Majority Conviction as Legitimate Ground**.

  **Verdict: These cannot be jointly satisfied.**

  *   **The Conflict:** The **Justification Condition** requires public reason: grounds that the coerced individual could, in principle, accept as rational (e.g., "I harmed you," "I violated a rule we agreed to"). The **Majority Conviction Ground** relies on comprehensive doctrines or collective sentiment that the minority explicitly rejects.
  *   **The Implication:** If you accept Devlin's premise that the majority's intense moral conviction is sufficient ground for law, you necessarily fail the Justification Condition for the dissenting minority. You are telling them: "We coerce you because we are the majority and we feel strongly." That is not a justification recognizable by the coerced as a *rightful* use of force; it is a statement of power.
  *   **Seminar Point:** This is not a bug in Devlin; it is a feature. Devlin prioritizes the *survival of the community* over the *autonomy of the member*. Hart prioritizes the *autonomy of the member* over the *moral uniformity of the community*. You cannot have both priorities at the top of the hierarchy.

  ---

  ### III. Brief Evaluation Against the Spec

  **1. The Harm Principle (Hart/Mill)**
  *   **Performance:** Passes the **Justification Condition** easily (harm is recognizable). Passes the **Legislator Test** mostly, though "harm" can be stretched (e.g., is offense a harm?).
  *   **Failure:** Fails the **Disintegration Threshold**. It treats society as a collection of atoms and ignores the sociological reality that shared norms *do* bind communities. It struggles to explain why we criminalize some "victimless" crimes (like desecration of corpses) that seem rooted in moral offense rather than tangible harm.

  **2. Devlin's Intensity Limit**
  *   **Performance:** Passes the **Disintegration Threshold** (by definition). Acknowledges the **Public/Private Boundary** (Devlin concedes law shouldn't enter private life *unless* public outrage is intolerable).
  *   **Failure:** Fails the **Justification Condition** (might makes right). Fails the **Legislator Test** because "intensity of feeling" is volatile and hard to measure objectively. It also fails to distinguish between **Intensity vs. Truth**; if the majority intensely believes in something false or cruel, Devlin's model mandates enforcement.

  ---

  ### IV. Confidence and The "Weird" Point

  **Confidence Level:** High on the structural tensions; Moderate on the historical exegesis of Devlin.

  **The Least Sure Point: Is Devlin a Consequentialist or a Deontologist?**
  This is the critical ambiguity you should flag in your seminar.
  *   **The Consequentialist Reading:** Devlin argues that if you allow private immorality, society will *actually* disintegrate (like a traitor weakening a nation). This is an empirical claim that is likely false (societies change morals without collapsing).
  *   **The Deontological Reading:** Devlin argues that the law *ought* to reflect the moral truth of the community because that is the *function* of law, regardless of whether disintegration actually occurs.
  *   **Why it matters:** If Devlin is a consequentialist, Hart defeats him by showing social cohesion doesn't require moral uniformity. If Devlin is a deontologist, Hart cannot defeat him empirically; the disagreement becomes purely meta-ethical (What is the point of law?).
  *   **My Suspicion:** Devlin slides between them. He uses the consequentialist threat of "disintegration" to justify a deontological duty of the state to uphold virtue. This slippage is where his argument is most vulnerable, but also where it is most interesting. It suggests his real worry isn't that society *will* fall apart, but that a society that *allows* such acts is already not worth preserving.

  **Seminar Strategy:** Push your participants to decide if they think Devlin is making a prediction (sociology) or a claim of right (jurisprudence). If it's the former, evidence refutes him. If it's the latter, evidence is irrelevant, and the debate is about the nature of political obligation.
