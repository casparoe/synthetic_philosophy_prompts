answer: |-
  Good morning. It is a privilege to stand between these two departments—Physics and Philosophy—and to look out at a room that contains both the people who write the equations of the universe and the people who ask what those equations mean for us.

  I am a journalist. My job is usually to translate what happens in rooms like this for people who aren't in them. But today, I am not here to translate. I am here to invite you into the translation process itself. We have a mixed audience. Some of you can derive the metric tensor of a rotating universe from memory. Others of you are here because you love the idea of time travel and want to know if it's real. For the next two days, we are going to ask you to meet in the middle.

  We are gathered to talk about time. For most of us, time feels like a river. It flows in one direction, carrying us from the past, through the present, and into the future. We feel the "now" as a special, moving spotlight. But if you ask a physicist for the coordinates of "now," they cannot give you a universal answer. And if you ask them about the flow, they will often tell you that flow is an illusion of consciousness, not a feature of the block universe.

  This weekend, we want to complicate that picture even further by returning to a discovery made by the logician Kurt Gödel in 1949. Gödel found a solution to Einstein's field equations that describes a universe quite unlike our own. In Gödel's universe, all matter is rotating. This rotation does something profound to the geometry of spacetime. It progressively tilts the paths available to light and matter.

  To understand what this means without getting lost in the calculus, I want to offer you an image. Imagine you are standing on a vast, flat floor that is slowly rotating, like a giant turntable. You are given a simple instruction: walk always "straight forward" relative to your own body. Do not turn left or right. Just keep stepping toward what feels like your future. In a normal room, you would walk in a straight line. But on this rotating floor, your path curves. If the rotation is fast enough, and the floor large enough, you can keep walking "forward"—always locally moving away from where you were a second ago—yet your path will eventually loop all the way around and bring you back to your starting point.

  In Gödel's universe, spacetime is that rotating floor. The "paths" are the light cones that define cause and effect. Gödel showed that in such a universe, a sufficiently long journey that always proceeds locally toward the future can, in principle, return to an earlier point in its own history. These are Closed Timelike Curves. The consequence is staggering: such a universe cannot be divided into a single, worldwide stack of past, present, and future moments. There is no global "now." There is only the local path.

  This is where the work of this symposium begins. Because when the public hears "time travel," and when physicists hear "closed timelike curves," they are often answering different questions without realizing it. Over the next two days, we need to disentangle three specific inquiries that usually get run together.

  First, there is the question of *permission*. Do the equations allow such looping paths? This is the domain of the physicist. It is a question of mathematical consistency and geometric possibility.

  Second, there is the question of *ontology*. If the equations allow a loop, does that mean the past is still "there" to be visited? Is the universe a static block where 1920 exists just as solidly as 2020, or is the looping path a trick of coordinates? This is where the philosopher must step in to ask what it means for something to be real.

  Third, there is the question of *agency*. Even if the path exists, and even if the past is "there," could creatures with our kind of memory and biology actually make use of it? Could you carry a memory of the future back to the past without unraveling the logic of cause and effect? This is a question for both disciplines, touching on thermodynamics, biology, and metaphysics.

  To answer these questions, we need a pact. We need to establish a norm for how we speak to one another this weekend.

  To my colleagues in physics: You may not treat questions about the reality of passage and the "now" as mere wordplay. The fact that human beings experience time as flowing is a datum of the universe just as much as the redshift of a galaxy. If your physics cannot account for the observer, it is incomplete.

  And to our non-specialists and philosophers: You may not treat the mathematics of allowed paths as irrelevant to what time is. You cannot argue about the nature of the past while ignoring the geometry that defines how one moment connects to the next. The math is not just a map; it is the terrain.

  This brings us to the discomfort at the heart of this symposium. We live our lives in the tense of the verb. We remember yesterday; we anticipate tomorrow. But Gödel's discovery suggests that this lived sense of time flowing forward may not correspond to anything global in physics. There may be no universal clock ticking in the background of reality.

  That is a unsettling thought. It suggests that our deepest intuition about existence—that we are moving through time—might be a local truth, but not a universal one.

  I want to close by asking you not to resolve that tension too quickly. Do not rush to say physics is wrong because it contradicts your experience. Do not rush to say your experience is an illusion because it contradicts the math. Instead, stay with the discomfort. That friction between the time we measure and the time we feel is not a problem to be solved by noon on Sunday. It is the spark. It is the place where the physics ends and the philosophy begins, and where, if we are lucky, a new understanding might emerge.

  Welcome to the symposium. Let us begin.
