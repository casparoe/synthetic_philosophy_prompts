answer: |-
  **Project Title:** The Diachronic State: Institutional Persistence and the Reality of Transgenerational Guilt

  **Project Summary**
  Can a nation be guilty in a non-metaphorical sense once the original actors are dead? This project argues that it can, provided we shift the locus of guilt from individual agency to institutional persistence. While Karl Jaspers' seminal taxonomy of guilt (criminal, political, moral, metaphysical) remains the standard framework for post-conflict ethics, it leaves a critical gap: it assumes a contemporaneous relationship between the citizen and the state's crimes. Jaspers distinguishes political guilt (liability for the state's actions) from moral guilt (individual conscience), but he does not fully resolve whether political guilt survives the total turnover of the citizenry if the institutional shell remains intact.

  This dissertation proposes that institutional persistence provides a genuine ontological basis for collective guilt across generations. I defend the position that when institutions maintain identity conditions over time—through legal systems, bureaucracies, and cultural norms—they carry normative obligations that transfer to new members. This is not merely analogical blame; it is a structural liability rooted in the continuity of the agent (the state) rather than the continuity of its components (the people). The project will develop a framework distinguishing "structural inheritance" (where obligations persist) from "structural discharge" (where institutional breaks sever liability), offering a rigorous defense of non-punitive collective guilt that avoids collapsing into pure individualism or empty metaphor.

  **Intellectual Context and Problem Statement**
  Current discourse on historical injustice often stalls between two unsatisfactory poles: strict individualism, which denies any responsibility to those who did not personally commit acts, and vague collectivism, which speaks of national guilt as a poetic metaphor without normative bite. Jaspers navigates this by assigning political guilt to all citizens, but his framework is synchronic; it addresses those living under the regime that committed the crimes. It does not adequately address the diachronic problem: when the regime's beneficiaries and participants are dead, but the state remains.

  The core philosophical problem is the identity conditions of institutions. If the German state of 2024 is numerically identical to the German state of 1944 in relevant normative respects, then the liabilities of the latter may attach to the former. However, if institutions are merely aggregates of individuals, then institutional persistence is an illusion, and guilt dissolves into distributed individual responsibility. Jaspers leaves this open because he prioritizes moral guilt (which requires agency) over political guilt (which requires membership). My project closes this gap by arguing that political guilt is not a diluted form of moral guilt, but a distinct normative status grounded in institutional continuity.

  **Methodology and Conceptual Framework**
  The method is strictly conceptual, utilizing social ontology to analyze the identity conditions of institutions over time. I will not employ empirical case studies (e.g., German reparations or American slavery), as adding historical particularity within a one-year scope risks diluting the metaphysical rigor required to solve the identity problem. Instead, I will construct a model of "obligation-transfer" that tests whether institutions can function as continuous moral agents despite discontinuous membership.

  The central deliverable will be a framework distinguishing **Structural Inheritance** from **Structural Discharge**.
  *   **Structural Inheritance** occurs when an institution maintains the same normative architecture, resource flows, and exclusionary practices over time. Here, new members inherit the liability of the institution because they occupy the same functional roles that benefited from past injustices.
  *   **Structural Discharge** occurs when there is a radical break in institutional identity (e.g., regime change, constitutional overhaul) that severs the normative chain.

  By defining these conditions, I will demonstrate that collective guilt is not a mystical property of a "volk" but a tangible consequence of institutional endurance.

  **Addressing Objections**
  A primary objection, raised by critics of transitional justice, is that transgenerational guilt is merely rhetoric—a political tool disguised as ethics. They argue that without personal agency, talk of guilt is category confusion. I address this head-on: dismissing institutional guilt as rhetoric ignores the causal power of institutions. Institutions are not just ideas; they are material structures that distribute benefits and burdens across time. To claim that guilt disappears because individuals die is to ignore that the *mechanism* of the injustice survives. If the institution persists, the liability persists. Denying this is not moral clarity; it is ontological negligence. My project demonstrates that acknowledging this liability is not about inflicting shame on innocents, but about recognizing the structural reality of the debt owed.

  **Feasibility, Scope, and Failure Conditions**
  One year is the appropriate scope for this conceptual work. Attempting to validate the framework through empirical case studies would require extensive historical archival work that would compromise the philosophical depth. The goal is to establish the *possibility* and *conditions* of transgenerational guilt, not to adjudicate specific historical claims.

  However, I am clear about what failure looks like. The project fails if:
  1.  **Collapse into Individualism:** The analysis ultimately shows that institutional obligations can be fully reduced to the sum of individual actions, rendering "collective guilt" redundant.
  2.  **Collapse into Metaphor:** The argument relies on poetic notions of national spirit rather than rigorous identity conditions, making the guilt non-normative.

  I am confident these failures can be avoided by anchoring the argument in social ontology rather than moral psychology. The result will be a robust defense of the claim that institutions can be guilty in a non-metaphorical sense, providing a theoretical foundation for reparative justice that does not rely on the fiction of ancestral sin nor the evasion of structural continuity. This framework will clarify when nations owe debts to history and when they do not, moving the debate beyond rhetorical stalemates.
