answer: |-
  The letter from the Calibration Bureau informed Mr. Aris that his emergency grant had been awarded to his neighbor, Mrs. Bell.

  Aris went to the office to appeal. "My Floor was a famine. Hers was a delayed train. How is her need greater?"

  The caseworker opened the file. "Your Span—the distance from your Floor to 'Fine'—is vast. It takes five hundred credits to move you one percent up your scale."

  "And hers?"

  "Her Span is narrow. Five hundred credits moves her twenty percent. We maximize calibrated gain per credit."

  Aris leaned on the counter. "So because I can endure more, I get less?"

  "Because you are harder to satisfy," the caseworker said, sliding the denial across the desk. "Mrs. Bell offers a better return on distress."

  Aris picked up the letter. "So the system punishes me for having survived worse things?"

  "Not punishes," the caseworker said, turning to the next file. "It simply finds your suffering too expensive to fix."
