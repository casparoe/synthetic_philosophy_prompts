answer: |-
  Henri Lefebvre, a NIMBY homeowner, and a YIMBY economist die and find themselves standing before the Planning Commission of the Afterlife.

  The Chairperson looks down at her clipboard and asks, "State your claim to the Celestial City."

  The NIMBY steps forward. "I purchased a cloud with a specific view of the pearly gates. I have a private aesthetic entitlement to ensure no new clouds block my light or alter the neighborhood character. My right to the city is a right to exclude."

  The YIMBY steps forward. "That's inefficient. Housing is a product, and scarcity is a market failure. We must upzone the clouds to maximize unit yield and lower the price of entry. My right to the city is a right to transact."

  Lefebvre steps forward. "But the city is not a product! It is an *oeuvre*. The Right to the City is not a right to property or a right to buy—it is a collective right to *inhabit*. To participate in the social production of space, distinct from mere *habitat*!"

  The Chairperson sighs, stamps two forms, and hands them to the NIMBY and the YIMBY.

  "Approved," she says. "You two agree that the city is a stock of *habitat* to be managed. You're just arguing over the price per square foot."

  She turns to Lefebvre. "As for you... 'Inhabiting' isn't a permitted use in this zone. This district is designated for High-Density Exchange Value. If you want to stay, you'll need to apply for a Conditional Use Permit."

  Lefebvre asks, "And what does that cost?"

  The Chairperson smiles. "Whatever the market will bear. Next!"
