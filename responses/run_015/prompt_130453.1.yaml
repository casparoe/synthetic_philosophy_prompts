      **Final Polish:**
      Make sure the distinction between *habitat* (the physical dwelling as commodity) and *inhabiting* (the social act) is clear.
      NIMBY protects *habitat* value.
      YIMBY maximizes *habitat* volume.
      Lefebvre wants *inhabiting*.
      The joke is that both NIMBY and YIMBY treat the city as a stock of *habitat*, rendering *inhabiting* invisible.

      *Drafting the Joke:*
      Henri Lefebvre, a NIMBY homeowner, and a YIMBY economist die and arrive at the Gates of the New City.
