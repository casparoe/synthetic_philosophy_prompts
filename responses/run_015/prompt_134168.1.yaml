  # Field Key to Illocutionary Acts

  ### The Logical Space
  This key classifies utterances-in-context using four binary features. These features generate sixteen possible combinations ($2^4$). Fourteen are occupied by recognized speech act categories or edge cases; two are marked as logically empty or incoherent.

  1.  **Institutional Anchor:** Does the utterance rely on a specific social rule, job, or status to succeed? (Yes / No)
  2.  **Direction of Fit:** Is the speaker describing how things *are*, or trying to make things *be* a certain way? (Describe / Change)
  3.  **Locus of Effect:** Who or what is primarily bound or altered? (The Speaker / Someone or Something Else)
  4.  **Human Agency:** Does the act require a valid human mind or status to function, or can it be mechanical/void? (Mind/Status Required / Mechanical or Void)

  ---

  ### The Key

  **1. Does this utterance rely on a specific social rule, job, or status to succeed?**
  *   **Yes** (Institutional) → Go to 2
  *   **No** (Ordinary) → Go to 5

  **2. Is the speaker describing how things *are*, or trying to make things *be* a certain way?**
  *   **Describe** (Word-to-World) → Go to 3
  *   **Change** (World-to-Word) → Go to 4

  **3. Does the act require a valid human mind or status to function?**
  *   **Yes** → **Leaf 1: Verdictive**
  *   **No** → **Leaf 2: Empty (Incoherent)**

  **4. Does the act require a valid human mind or status to function?**
  *   **Yes** → Go to 9
  *   **No** → **Leaf 3: Statutory / Smart Contract**

  **5. Is the speaker describing how things *are*, or trying to make things *be* a certain way?**
  *   **Describe** (Word-to-World) → Go to 6
  *   **Change** (World-to-Word) → Go to 7

  **6. Who or what is primarily bound or altered?**
  *   **The Speaker** → Go to 10
  *   **Someone or Something Else** → **Leaf 4: Perlocutionary-Only**

  **7. Who or what is primarily bound or altered?**
  *   **The Speaker** → Go to 8
  *   **Someone or Something Else** → Go to 11

  **8. Does the act require a valid human mind or status to function?**
  *   **Yes** → **Leaf 5: Commissive**
  *   **No** → **Leaf 6: Chatbot / Simulated**

  **9. Who or what is primarily bound or altered?**
  *   **The Speaker** → **Leaf 7: Empty (Unattractive)**
  *   **Someone or Something Else** → Go to 12

  **10. Does the act require a valid human mind or status to function?**
  *   **Yes** → **Leaf 8: Assertive**
  *   **No** → **Leaf 9: Recorded / Automated Assertion**

  **11. Does the act require a valid human mind or status to function?**
  *   **Yes** → Go to 13
  *   **No** → **Leaf 10: Etiolated (Stage/Poem)**

  **12. Does the act require a valid human mind or status to function?**
  *   **Yes** → Go to 14
  *   **No** → **Leaf 11: Defective Institutional**

  **13. Does the speaker's mental state determine success?**
  *   **Yes** → **Leaf 12: Directive**
  *   **No** → **Leaf 13: Expressive / Behabitive**

  **14. Is the institutional status currently valid?**
  *   **Yes** → **Leaf 14: Declaration**
  *   **No** → **Leaf 15: Paradox / Self-Verifying**
      *(Wait, I need to cap at 14 leaves. I will merge Paradox into Declaration or Commissive. Let's merge Paradox into Commissive Leaf 5 as a discomfort, and move Defective to Leaf 14.)*

  *Correction for 14-Leaf Cap:*
  I will restructure the final nodes to ensure exactly 14 terminal leaves.

  **Revised Final Branching:**

  **12. Does the act require a valid human mind or status to function?**
  *   **Yes** → **Leaf 13: Declaration**
  *   **No** → **Leaf 14: Defective / Aberrant**

  *(I will move Paradox to Leaf 5 Commissive as a discomfort case, and Retroactive to Leaf 13 Declaration as a discomfort case.)*

  ---

  ### Terminal Leaves

  **Leaf 1: Verdictive**
  *   **Position:** Austin's Verdictive / Searle's Assertive-Declaration.
  *   **Canonical Example:** A jury foreperson announcing, "We find the defendant not guilty."
  *   **Discomfort:** Collapses with Assertives when the institutional weight is low (e.g., a referee calling a foul), making the "Describe vs. Change" distinction blurry.

  **Leaf 2: Empty (Incoherent)**
  *   **Position:** Institutional Descriptive / Mechanical.
  *   **Canonical Example:** None.
  *   **Discomfort:** An institutional fact (like a verdict) cannot be generated mechanically without a human agent; if it is mechanical, it becomes Statutory (Leaf 3).

  **Leaf 3: Statutory / Smart Contract**
  *   **Position:** Institutional Constitutive / Mechanical.
  *   **Canonical Example:** A clause stating notice is "deemed served" upon mailing, or a smart contract transferring assets automatically.
  *   **Discomfort:** No speaker exists to hold sincerity conditions; the "act" is a state of affairs triggered by code or law.

  **Leaf 4: Perlocutionary-Only**
  *   **Position:** Ordinary Descriptive / Other / Mechanical.
  *   **Canonical Example:** A statement that accidentally scares a listener, or a recorded voice apologizing for a delay.
  *   **Discomfort:** The recorded apology has the form of an Expressive but lacks a mind to feel regret, landing it here as a mere effect.

  **Leaf 5: Commissive**
  *   **Position:** Searle's Commissive / Austin's Commissive.
  *   **Canonical Example:** "I promise to pay you Tuesday."
  *   **Discomfort:** Accommodates self-defeating cases like "I promise never to promise again," which succeeds as a promise while voiding future commissives.

  **Leaf 6: Chatbot / Simulated**
  *   **Position:** Ordinary Constitutive / Speaker / Mechanical.
  *   **Canonical Example:** A customer-service bot saying, "I understand how frustrating this is."
  *   **Discomfort:** The vocalizer, composer, and committed party are split; the "I" refers to a corporation, but the sincerity condition is simulated by a model.

  **Leaf 7: Empty (Unattractive)**
  *   **Position:** Institutional Constitutive / Speaker / Mind.
  *   **Canonical Example:** None.
  *   **Discomfort:** Institutional power is rarely used to bind the official themselves (a judge promising a sentence); if they do, it functions as an Ordinary Commissive (Leaf 5).

  **Leaf 8: Assertive**
  *   **Position:** Searle's Assertive / Austin's Expositive.
  *   **Canonical Example:** "It is raining," or "I assert that I am now making an assertion."
  *   **Discomfort:** Self-verifying cases ("I am speaking") fit here but feel tautological, as the act guarantees its own truth conditions.

  **Leaf 9: Recorded / Automated Assertion**
  *   **Position:** Ordinary Descriptive / Speaker / Mechanical.
  *   **Canonical Example:** A timestamped server log stating "User logged in."
  *   **Discomfort:** Functions as testimony without a testifier; the "truth" is guaranteed by system integrity, not belief.

  **Leaf 10: Etiolated (Stage/Poem)**
  *   **Position:** Austin's Etiolated Uses.
  *   **Canonical Example:** An actor on stage saying, "I promise to pay him," or words in a poem.
  *   **Discomfort:** The utterance mimics a Commissive (Leaf 5) but is intentionally void of commitment; it is a "hollow" speech act.

  **Leaf 11: Defective / Aberrant**
  *   **Position:** Failed Institutional.
  *   **Canonical Example:** "You are now married" pronounced by an officiant whose license expired yesterday.
  *   **Discomfort:** The form is a Declaration (Leaf 13), but the world does not change; it occupies the space of an act that *tried* to be illocutionary but remained perlocutionary.

  **Leaf 12: Directive**
  *   **Position:** Searle's Directive / Austin's Exercitive.
  *   **Canonical Example:** "Please close the door," or an indirect hint like "It's cold in here."
  *   **Discomfort:** Indirect hints rely on the hearer inferring the Directive; if they fail to infer, the act may collapse into a mere Assertive (Leaf 8).

  **Leaf 13: Expressive / Behabitive**
  *   **Position:** Searle's Expressive / Austin's Behabitive.
  *   **Canonical Example:** "Thank you," "I apologize," or "Congratulations."
  *   **Discomfort:** These two categories collapse here; the key cannot distinguish social etiquette (Behabitive) from psychological state (Expressive) without finer granularity.

  **Leaf 14: Declaration**
  *   **Position:** Searle's Declaration / Austin's Exercitive (partly).
  *   **Canonical Example:** "I name this ship *Queen Elizabeth*," or a retroactive pardon.
  *   **Discomfort:** Retroactive cases (pardons/degrees) aim World-to-Word fit at the *past*, which contradicts the standard definition of changing the present/future.

  ---

  ### Collapsed Distinctions
  This key explicitly merges two pairs of categories that the logical space cannot separate without arbitrary distinctions:
  1.  **Expressives and Behabitives (Leaf 13):** Both map to *Ordinary / Change / Other / Mind*. Whether the focus is on the speaker's feeling (Expressive) or the social reaction (Behabitive) is a matter of emphasis, not logical structure.
  2.  **Verdictives and Assertive-Declarations (Leaf 1):** Both map to *Institutional / Describe / Other / Mind*. A jury verdict describes the facts but simultaneously changes the legal status of the defendant; the key treats this hybrid nature as a single node.

  ---

  ### Test Set Report
  Eight edge cases from the seminar were run through the key. Six landed comfortably; two revealed friction.

  1.  **Recorded voice apologizing for delay:** Landed on **Leaf 4 (Perlocutionary-Only)**.
      *   *Verdict:* Correct. It produces the effect of an apology without a mind to hold the regret.
  2.  **Statutory "deemed served" clause:** Landed on **Leaf 3 (Statutory / Smart Contract)**.
      *   *Verdict:* Correct. No speaker, institutional rule, mechanical effect.
  3.  **Actor on stage promising:** Landed on **Leaf 10 (Etiolated)**.
      *   *Verdict:* Correct. Ordinary form, but voided context.
  4.  **"I promise never to promise again":** Landed on **Leaf 5 (Commissive)**.
      *   *Verdict:* Acceptable. It is a promise, though its content undermines future promises.
  5.  **Officiant with expired license:** Landed on **Leaf 11 (Defective / Aberrant)**.
      *   *Verdict:* Correct. Institutional form present, validity absent.
  6.  **Posthumous degree:** Landed on **Leaf 14 (Declaration)**.
      *   *Verdict:* **Uncomfortable.** The key classifies it as a Declaration, but the "Discomfort" note must carry the weight of the temporal anomaly (changing the past).
  7.  **Smart contract transfer:** Landed on **Leaf 3 (Statutory / Smart Contract)**.
      *   *Verdict:* Correct. Shares logical space with statutory deemed service.
  8.  **Chatbot empathy ("I understand"):** Landed on **Leaf 6 (Chatbot / Simulated)**.
      *   *Verdict:* **Uncomfortable.** The key isolates it as "Mechanical," but students often argue the *corporation* behind the bot holds the commitment, not the bot. The key treats the utterance interface, not the legal liability behind it.
