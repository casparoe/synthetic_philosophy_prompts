answer: |-
  ### Unstructured Brainstorming Log

  *   **Candidate Defeater: The Group Selection Problem.** How do we know which group $G$ acts on the space $X$? Bertrand's paradox arises because we can choose different groups (rotation vs. translation). Invariantism says "the problem specifies the group." But does "a line in the plane" specify the Euclidean group? Or the affine group? Or the projective group?
      *   *Status:* This is the core vulnerability. If "natural symmetries" are subjective, Invariantism collapses into Subjectivism. If they are objective, where is the metalogic that selects them?
  *   **Candidate Defeater: Improper Measures.** Haar measure on $\mathbb{R}^n$ or the affine group is infinite. Probability requires normalization ($\int d\mu = 1$). Invariantists use limits or marginalize to ratios.
      *   *Status:* Mathematical workaround exists (Jaynes' method), but it's technically delicate. Does it count as a "probability"? Only in a generalized sense. Risk of inconsistency if limits don't commute.
  *   **Candidate Defeater: The Independence Gap.** (User's point). Symmetry acts on the space. It fixes the marginal form. It does not fix the product structure. $G$-invariance on $X \times X$ allows correlated measures.
      *   *Status:* Fatal to pure Invariantism. Requires a supplement (MaxEnt or Independence Principle).
  *   **Candidate Defeater: Discrete/Countable Spaces.** No translation-invariant countably additive measure on $\mathbb{Z}$.
      *   *Status:* Scope limitation. Invariantism is inherently continuous/Lie-group based. It admits defeat on "pick an integer."
  *   **Candidate Defeater: The "Ill-Posed" Shield.** Any counterexample is dismissed as "you didn't specify the mechanism."
      *   *Status:* Epistemological risk. Makes the theory unfalsifiable. If it never makes a wrong prediction because it can always claim "specification error," it predicts nothing.
  *   **Candidate Defeater: Conflicting Symmetries.** Bounded domains break translation invariance. Scale invariance conflicts with fixed boundaries.
      *   *Status:* Awkward. Requires subgroup selection or approximation.
  *   **Candidate Defeater: Empirical Mismatch.** Real straws have length distributions, air resistance, etc.
      *   *Status:* Weak. All models idealize. The question is whether the idealization is *the* idealization.
  *   **Candidate Defeater: Borel-Kolmogorov.** Conditioning on measure-zero sets depends on parametrization, even if the global measure is invariant.
      *   *Status:* Strong. Shows invariance of the prior doesn't guarantee invariance of the posterior without specifying the *conditioning* symmetry.

  ---

  ### 1. Ranking the Defeaters

  **Fatal: The Independence Gap (Dependence Structure)**
  *   **The Objection:** As you noted, symmetry fixes the form of the measure on the manifold, but not the coupling between variables. A joint distribution can be invariant under joint rotation while exhibiting perfect correlation (e.g., diametrically opposite points).
  *   **Invariantist Response:** A committed invariantist must concede this. Pure group invariance is insufficient to generate a unique probability measure on product spaces.
  *   **My Verdict:** This is fatal to Invariantism *as a standalone principle*. It forces the invariantist to adopt a supplementary rule (typically Maximum Entropy or an Independence Principle). Without it, the "unique invariant measure" claim is false for multivariate problems.

  **Serious: The Group Selection Problem**
  *   **The Objection:** Problems stated in natural language ("a line at random") do not uniquely specify a transformation group. Is the group determined by the geometry of the object (the circle) or the embedding space (the plane)?
  *   **Invariantist Response:** "The problem is ill-posed until the group is specified."
  *   **My Verdict:** This borders on vacuity (see Section 5). However, in physics, symmetries are often dictated by the laws (e.g., Lorentz invariance). In pure probability, the "naturalness" of a group is contested. I rank this serious because it shifts the burden from calculating probabilities to arguing about metaphysics.

  **Awkward: Improper Measures and Normalization**
  *   **The Objection:** Haar measures on non-compact groups (translations, scale) are infinite. Probabilities must sum to 1.
  *   **Invariantist Response:** Use marginal distributions of invariant ratios, or take limits of compact subgroups.
  *   **My Verdict:** Mathematically manageable but conceptually costly. It requires accepting "improper priors" as legitimate epistemic states. It works, but it requires more machinery than the slogan "indifference to symmetry" suggests.

  **Merely Awkward: Discrete/Countable Scope**
  *   **The Objection:** No uniform distribution on $\mathbb{N}$.
  *   **Invariantist Response:** "Invariantism applies to continuous parameters with Lie group symmetries."
  *   **My Verdict:** Honest scope limitation. It doesn't refute the view, but it limits its utility for the very problems (cosmology, counting) where indifference is most desired.

  ---

  ### 2. The Dependence Objection: Symmetry vs. Independence

  You have identified the precise mathematical fracture point. Let $X$ be the circle. The group $G = SO(2)$ acts on $X$. The Haar measure is unique (uniform). Now consider $X \times X$ (two points). $G$ acts diagonally: $g \cdot (x, y) = (gx, gy)$.
  The measure $\mu$ on $X \times X$ must satisfy $\mu(gA) = \mu(A)$.
  The product measure $\text{Uniform} \times \text{Uniform}$ satisfies this.
  But so does the measure supported on the diagonal $\{(x, x)\}$, or the anti-diagonal $\{(x, -x)\}$. All are $G$-invariant. All have uniform marginals.

  **Does Invariantism need a supplementary rule?**
  Yes. Absolutely. Invariance constrains the *orbit structure*, not the *transverse* measure. To select a unique measure on the product space, you must maximize entropy subject to the invariance constraints, or explicitly posit independence.

  **Does this collapse the view into Maximum-Entropy Objective Bayesianism?**
  Effectively, yes. If Invariantism requires MaxEnt to resolve dependence, then "Indifference to Symmetry" is merely a *constraint* within the MaxEnt framework, not the engine itself. The work is being done by the entropy maximization, not the invariance.
  *   *Contested Assumption:* I am assuming that "Invariantism" claims to be a complete generator of priors. If it claims only to be a constraint, it survives, but it is no longer the rival to MaxEnt you might have hoped; it is a submodule.

  **The Coordinate Regress**
  You ask: "Independence is independence of some chosen coordinates."
  *   *Analysis:* On a manifold, "independence" is not coordinate-invariant. If $X$ and $Y$ are independent, $X$ and $X+Y$ are not.
  *   *Invariantist Defense:* One defines independence relative to the *invariant factorization* of the group or the manifold structure (e.g., orthogonal components in a Riemannian manifold defined by the Killing form).
  *   *Verdict:* This is thin. It requires a metric to define orthogonality. Where does the metric come from? From the group action (Killing metric). So, Invariantism + MaxEnt + Killing Metric = Unique Prior.
  *   *Risk:* This is a lot of machinery. If the problem statement doesn't specify the metric (e.g., "pick two numbers"), the invariantist must argue the metric is implicit. This returns us to the Group Selection Problem.

  **Does it reach the inscribed triangle?**
  Yes. The "random triangle" problem is a problem on a configuration space (e.g., $S^1 \times S^1 \times S^1$ modulo rotation). Symmetry fixes the measure on the configuration space *if* you assume the points are chosen independently according to the invariant marginal. If you allow correlation (e.g., points repel each other), symmetry is preserved, probabilities change. Invariantism cannot rule out the correlation without an independence postulate.

  ---

  ### 3. Empirical Exposure

  **Does the invariant answer bind a real experiment?**
  Only in the limit. Jaynes' straw toss derives $1/2$ assuming:
  1.  Straws are long relative to the circle ($L \gg R$).
  2.  The distribution of straw centers is translation-invariant over the relevant area.
  3.  The distribution of angles is rotation-invariant.

  In a real lab, condition (2) is never perfectly met (the table is finite). Condition (1) is an approximation.
  **What has indifference bought?**
  It buys a *convergence claim*. It predicts that as boundary effects vanish and $L/R \to \infty$, the frequency *must* converge to the invariant measure value ($1/2$).
  **Testable Prediction:**
  Yes. "No physical mechanism that genuinely respects the Euclidean symmetry group (translations and rotations) can produce a limiting frequency of $1/3$ or $1/4$."
  **Counterfactual:**
  If a careful experiment yielded $1/3$ in the limit of large $L$ and negligible boundary effects, Invariantism would be falsified *unless* it claims the symmetry was broken.
  **The "Unseen Asymmetry" Defense:**
  This is the risk. If the invariantist replies "there must be a hidden asymmetry," the claim becomes unfalsifiable.
  *   *Verdict:* Invariantism has empirical content only if we accept *operational definitions* of symmetry (e.g., "we randomized the tosser mechanically"). If symmetry is metaphysical, the view is insulated from data. If symmetry is operational, Invariantism is a physical hypothesis about the randomization device, not a logical truth.

  ---

  ### 4. Scope Limitation

  **The Positive Reals and Scaling**
  Problem: "Pick a positive real number."
  Symmetry: Scaling $x \to \lambda x$.
  Invariant Measure: $d\mu = dx/x$ (Haar measure on multiplicative group).
  Issue: $\int_0^\infty \frac{dx}{x} = \infty$.
  **Invariantist Move:** Use this as an improper prior. Probabilities are only defined for ratios (e.g., $P(x_1 < x_2)$).
  **Verdict:** This works for scale-invariant questions but fails for absolute magnitude questions (e.g., "Is $x < 10$?"). Invariantism is silent.

  **The Integers**
  Problem: "Pick an integer."
  Symmetry: Translation $n \to n+k$.
  Issue: No countably additive invariant measure on $\mathbb{Z}$. Only finitely additive (natural density).
  **Invariantist Move:** "The problem is ill-posed for probability theory proper," or switch to finite additivity.
  **Verdict:** This is a major concession. Indifference was historically sought for discrete cases (Laplace's sunrise, cosmological constants). Invariantism admits it cannot handle the discrete case without abandoning countable additivity or accepting that some questions have no answer.
  **Is this honest modesty?**
  It is honest, but it reveals that Invariantism is a theory of *geometric* probability, not general *epistemic* probability. It works where geometry exists. It fails where "number" is abstract. If your goal is a universal logic of science, this is a crippling limitation.

  ---

  ### 5. Verdict on Insulation

  **The "Ill-Posed" Shield**
  The reply "that problem was ill-posed" is indeed available for every counterexample.
  *   *Risk:* Vacuity. If every disagreement is attributed to specification error, the theory makes no predictions.
  *   *Reality:* Invariantism *does* make predictions about *specifications*. It says: "If you specify the symmetry group $G$, you *must* use the Haar measure." It polices the link between specification and calculation.

  **Divergence from Rivals**
  *   *Subjectivism:* Allows any coherent prior. Invariantism forbids non-invariant priors for symmetric problems. **Divergence:** A subjectivist can assign $1/3$ to the straw toss if they believe the machine is biased. An invariantist says "If the machine is biased, the symmetry is broken. If you claim symmetry, you are incoherent."
  *   *MaxEnt:* MaxEnt needs constraints (mean, variance). Invariantism provides the constraints (symmetry). They are complementary.
  *   *Mechanism-First:* Says "Look at the physics." Invariantism says "The physics *is* the symmetry."
  *   *Where they come apart:* When the physical mechanism is unknown but symmetries are assumed. Invariantism predicts the outcome based on symmetry. Mechanism-first says "We can't predict without the mechanism."
      *   *Example:* Predicting the distribution of galaxy orientations. Mechanism-first: "Need cosmological simulation." Invariantist: "Rotation invariance implies uniform distribution on the sphere."
      *   *Test:* If galaxies are aligned (they are, weakly), Invariantism (applied naively) is wrong. The Invariantist replies "Cosmology breaks rotation invariance." The Mechanist says "I told you so."
      *   *Conclusion:* Invariantism is best read as a **constraint on specification**. It tells you what follows *if* you claim symmetry. It is not a generator of truth about the world.
      *   *Amendment or Capitulation?* It is an amendment. It retreats from "This is the probability" to "This is the probability *conditional on the symmetry claim*." This saves it from falsification but reduces its power to dictate reality.

  ---

  ### 6. The Killer Case: Ergodic Failure in Statistical Mechanics

  **The Setup:**
  Consider a classical Hamiltonian system with $N$ particles in a box, fixed energy $E$.
  **The Problem:**
  "Where is particle 1?"
  **The Specification:**
  1.  System is isolated (Energy $E$ fixed).
  2.  Box is cubic (Symmetry group: translations within box, reflections).
  3.  No other information is given.
  **The Invariantist Answer:**
  The symmetry group of the energy shell in phase space is the time-evolution group (Hamiltonian flow) + spatial symmetries. The unique invariant measure on the energy shell is the Microcanonical Measure (Liouville measure restricted to $H=E$).
  Prediction: Particle 1 is uniformly distributed in the box (marginal of microcanonical).
  **The Counter-Fact:**
  Consider an **integrable system** (e.g., non-interacting particles, or specific potentials where action-angle variables exist). The system is not ergodic. The trajectory is confined to a torus within the energy shell.
  If the system starts on a specific torus, it stays there. The time-average distribution is *not* the microcanonical measure. It is a delta-function on the torus (or uniform on the torus, which projects non-uniformly to the box).
  **The Conflict:**
  The specification "Isolated system, Energy E" seems complete. The symmetries (Hamiltonian flow) are fixed. The invariant measure (Microcanonical) is unique and normalizable.
  Yet, for a vast class of systems (integrable ones), the Invariantist prediction (Uniform in box) is physically wrong for a single realization over time.
  **The Invariantist Reply:**
  "You have not finished specifying the experiment. You must specify that the system is *ergodic* or that you are averaging over an *ensemble* of initial conditions, not a single trajectory."
  **My Verdict:**
  This is a **refusal**, not an answer.
  In statistical mechanics, the "Equal A Priori Probability" postulate *is* the Invariantist claim. It is known to be false for individual non-ergodic systems. It is justified only by arguing that "most" systems are chaotic (KAM theory nuances) or that we are dealing with an ensemble.
  If Invariantism claims to represent *rational belief* given the specification "Energy E", it fails here because a rational agent who knows the system is integrable *should not* assign the microcanonical measure.
  If Invariantism claims "You must specify Ergodicity," then it admits that Symmetry + Energy is *insufficient*. It needs a dynamical property (mixing/ergodicity) that is not a symmetry of the instantaneous state space.
  **Why this moves you:**
  Here, the group is fixed (Hamiltonian flow). The measure is unique (Liouville). The space is compact (bounded box, fixed energy). The math is perfect. And the answer can be empirically wrong for individual systems.
  This shows that **Symmetry $\neq$ Chance**. Invariantism conflates the geometry of the state space with the dynamics of the trajectory. It works when dynamics are chaotic (filling the space), but fails when dynamics are ordered. Since the specification "Energy E" does not guarantee chaos, Invariantism overreaches. It treats an epistemic constraint (I don't know the phase) as an ontological guarantee (the system visits all phases).

  **Final Conclusion on Exposure:**
  Invariantism is mathematically robust but epistemologically fragile. It works perfectly as a consistency check for specified symmetries. It fails as a universal generator of priors because (1) it cannot fix dependence without MaxEnt, (2) it cannot handle discrete cases, and (3) it conflates symmetry with ergodicity in dynamical contexts. It is a powerful tool for cleaning up ill-posed questions, but it cannot solve them alone.
