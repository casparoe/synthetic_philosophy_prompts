answer: |-
  ### Prediction and Consistency

  **Prediction:** The Franchise Board will rule to **enfranchise** the residents of the downstream town.

  **Consistency Ruling:** To be consistent with its own record, the Board **must** enfranchise them. The Board's written justification for the previous referendum established a conjunctive test: (1) material affectedness of serious interests, and (2) the "nowhere-else-to-be-heard" (NEOTH) condition. The downstream residents face a threat to their drinking water and primary employment, which constitutes a "serious interest" materially greater than the harbour dues affecting the absentee owners. Furthermore, their own government's indifference satisfies the NEOTH test even more clearly than the absentee owners' situation (where a home government *might* theoretically negotiate trade, whereas water security is often a local vulnerability). To exclude the downstream town while including the absentee owners would privilege capital interests (business registration) over existential interests (water and food security), contradicting the "serious interests" formula.

  ### Competing Rules and Fit

  To analyze the Board's trajectory, we must set out the competing principles of democratic boundary drawing and test them against the *Harbour Dues* precedent.

  1.  **All-Subjected Principle (Coercion):** The *demos* should include all those subject to the city's coercive laws.
      *   *Fit:* Explains *Resident Citizens* and *Non-citizen Residents* (In). Explains *Seasonal Workers* (Out, if coercion is deemed too temporary) and *Former Residents* (Out).
      *   *Fail:* Cannot explain *Absentee Owners* (In). They live abroad and are not subject to the city's coercive power in their daily lives. Since the Board included them, the Board has already rejected Coercion as a necessary condition.
      *   *Application to Downstream:* Would exclude the town (they are foreign sovereigns).

  2.  **All-Affected Principle (AAP):** The *demos* should include all whose interests are materially affected by the decision.
      *   *Fit:* Explains *Residents*, *Non-citizens*, *Absentee Owners*, and *Downstream Town*.
      *   *Fail:* Struggles to explain why *Seasonal Workers* were Out (their wages are affected by dues) and why *Former Residents* were Out (unless impact is deemed negligible). It risks infinite regress (e.g., global climate impacts).
      *   *Application to Downstream:* Strongly supports inclusion.

  3.  **Stakeholder/Membership Principle:** The *demos* should include those with a durable social membership or long-term stake in the community.
      *   *Fit:* Explains *Residents* (8+ years) and *Seasonal Workers* (Out, due to transience).
      *   *Fail:* Cannot explain *Absentee Owners* (In). They live abroad and visit only twice a year, lacking social membership.
      *   *Application to Downstream:* Would exclude the town (no social membership in the port city).

  4.  **Nowhere-Else-To-Be-Heard (NEOTH):** A supplementary principle granting franchise to those whose interests are otherwise unrepresented in any relevant political forum.
      *   *Fit:* Explicitly invoked to justify *Absentee Owners* (In) over dissent. Explains *Former Residents* (Out, presumably represented in their new home).
      *   *Application to Downstream:* Strongly supports inclusion (their own government ignores them).

  5.  **Fiscal Principle:** The *demos* should include those who bear the tax burden or financial liability.
      *   *Fit:* Explains *Residents* and *Absentee Owners* (business registered/tax liable). Explains *Former Residents* (Out, no tax liability).
      *   *Fail:* Does not explain *Non-citizen Residents* (if they pay no specific business tax) or *Seasonal Workers* (who likely pay consumption taxes).
      *   *Application to Downstream:* Would exclude the town (no tax liability).

  **Divergence:** The Coercion, Membership, and Fiscal principles all diverge from the Board's precedent regarding the *Absentee Owners*. Because the Board chose to include the Absentee Owners, it has implicitly prioritized **Affectedness + NEOTH** over Coercion, Membership, or Fiscal contribution. Therefore, on the Downstream case, only Affectedness + NEOTH yields the consistent result (In). The other principles would require the Board to overrule its own logic from the previous referendum.

  ### The Discriminating Case

  To distinguish between the surviving rules (specifically, to test whether the Board is committed to *pure* Affectedness or *Affectedness constrained by NEOTH*), the single further case that would best tell the rules apart is:

  **A competing port authority in a neighbouring country.**

  *   **Scenario:** A state-run port 50km away would gain significant trade revenue if this port closes (economic affectedness). However, that port authority is represented by its own national government in trade negotiations (no NEOTH).
  *   **Differentiation:**
      *   If the Board enfranchises them, it is committed to the **Pure All-Affected Principle** (impact alone suffices).
      *   If the Board excludes them, it confirms the **Affectedness + NEOTH Hybrid** (impact must be coupled with a representation gap).
      *   This distinguishes the rule from the Fiscal Principle (they pay no taxes) and Coercion (they are not subject to law).

  ### Closest Analog

  The genuinely closest analog is the **Absentee Owners of businesses registered in the port.**

  *   **Similarities:** Both groups are external to the city's jurisdiction (foreign or non-resident); both are exempt from the city's coercive laws in their daily lives; both rely on the NEOTH justification to overcome the lack of residency/coercion; both have a high-stakes economic interest in the outcome.
  *   **Distinction:** The Absentee Owners have a formal legal tie (business registration/tax), whereas the Downstream Town has a geographical/ecological tie. However, since the Board's written reasons emphasized "serious interests" and NEOTH over formal registration (which was merely a descriptor of the owners, not the stated *reason* for inclusion), the functional analogy holds. If the "business registration" was the true deciding factor, the Board would have cited the Fiscal Principle, but it cited NEOTH.

  ### Settled vs. Contested Boundary Problems

  In the literature on democratic boundaries (the *boundary problem*), certain elements are comparatively settled, while others remain deeply contested. I will mark my own normative commitments clearly where I take a contested side.

  **Comparatively Settled:**
  1.  **Residency creates a presumption of inclusion.** (Almost all theories agree residents should vote).
  2.  **Transience weakens claims to franchise.** (The exclusion of Seasonal Workers is uncontroversial across most theories).
  3.  **Coercion is a sufficient condition for inclusion.** (If you are subject to the law, you should have a say; the Board's inclusion of Residents fits this).

  **Contested (and My Stance):**
  1.  **Is Affectedness a sufficient condition?**
      *   *Contest:* Many theorists argue AAP is too broad (causal chains are infinite).
      *   *My Stance:* **[Contested Side]** I argue that Affectedness is *not* sufficient on its own; it requires a threshold of "seriousness" and a limitation mechanism (like NEOTH) to prevent the *demos* from becoming unmanageably large. The Board's use of "serious interests" is a correct attempt to limit AAP.
  2.  **Does NEOTH justify extraterritorial franchise?**
      *   *Contest:* Traditionalists argue sovereignty boundaries should hold; Cosmopolitans argue representation gaps justify crossing borders.
      *   *My Stance:* **[Contested Side]** I argue that NEOTH is a legitimate *supplementary* criterion. When a decision creates a "governance vacuum" for a specific group (like the downstream town or absentee owners), the deciding body acquires a pro tanto obligation to include them to avoid tyranny over the voiceless.
  3.  **Does Property/Business Ownership trump Livelihood?**
      *   *Contest:* Liberal theories often privilege property rights; Republican theories privilege non-domination and basic needs.
      *   *My Stance:* **[Contested Side]** I argue that basic livelihood interests (water, employment) morally outweigh mere profit interests (harbour dues). If the Board excludes the Downstream Town while including Absentee Owners, they are implicitly prioritizing capital over survival, which is inconsistent with the "serious interests" formula.

  **Conclusion:** The Board's precedent is a hybrid of **Affectedness** and **NEOTH**. To maintain integrity, they must enfranchise the downstream town. To do otherwise would reveal that their previous reliance on NEOTH was a pretext for protecting capital owners, rather than a principled stand on representation.
