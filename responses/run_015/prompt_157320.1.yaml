      *   *Counter:* The Board's written reasons invoked "Affectedness" and "NEOTH." They did *not* explicitly invoke "Taxation" as the primary justification for the Absentee Owners, though it was a distinguishing factor from Former Residents. The NEOTH test was the *tie-breaker* for the dissent.
