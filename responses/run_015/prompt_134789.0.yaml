      *   *Causal Contribution vs. Narrative Agency:* This is a crucial philosophical distinction. Causation is physical/ontic; Agency is often tied to responsibility, choice, or narrative structure.
      *   *Vector Model:* Metaphor from physics/math. Vectors have magnitude and direction. Here, it means environmental factors push *toward* certain outcomes without guaranteeing them.
      *   *Determinism:* The belief that events are determined by previously existing causes. Hard determinism leaves no room for free will/contingency. Soft determinism (compatibilism) allows for some choice within constraints.

  3.  **Address Worry 1: Relational Ontology & Determinism:**
