answer: |-
  ### 1. The Decision Procedure

  | Step | The Question | Sufficient Answer | On No | Fact/Judgment & Who | Typical Failure |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Consensus & Red Flags:** Do ≥2 reports identify specific, verifiable flaws (plot collapse, prose failure)? | Yes: Specific flaws cited with page refs. | Proceed to Step 2. | **Fact** (Reader reports). | Treating vague dislike ("boring") as a verifiable flaw. |
  | **2** | **Claim Audit:** Is the praise primarily about **Fit** (tradition, innovation) or **Texture** (prose, feeling)? | Fit claims dominate the positive reports. | Flag for **Sample** read to verify Texture; if Texture is the only praise, reject. | **Judgment** (Juror). | Confusing "what it's like" (Texture) with "what it does" (Fit). |
  | **3** | **Distance Check:** Is the form/language/length within my range of credible experience without reading? | No significant distance (e.g., I read the language, genre is familiar). | Require **Whole** read OR reject if reading quota is full. | **Fact** (Juror capability). | Underestimating decay (e.g., assuming verse reads like prose). |
  | **4** | **Calibration Weight:** Are the positive reports from readers calibrated with my judgments on similar books? | Yes: ≥1 calibrated reader supports the Fit claim. | Downgrade confidence to **Recommendation** only; cannot **Judge**. | **Fact** (Past data). | Assuming general calibration applies to specific genres (e.g., SF vs. LitFic). |
  | **5** | **Sampling Mandate:** If flaws were cited (Step 1), have I sampled the specific pages? | Yes: Flaws verified or disproven. | **Reject** immediately if flaws verified; cannot sign. | **Fact** (Juror action). | Sampling too broadly; must hit the specific cited breakage point. |
  | **6** | **Signature Test:** Can I sign a citation that says "We judge this the best" vs "We recommend this"? | I can assert **Judgment** (read + calibrated testimony) or **Recommendation** (trusted testimony only). | If only uncalibrated testimony exists, **No** signature for Winner/Shortlist. | **Judgment** (Juror/Chair). | Conflating "I trust this process" with "I endorse this aesthetic outcome." |

  ---

  ### 2. Case Runs

  **Case A: The 700-Page Debut (2 Rapturous, 1 Collapse)**
  *   **Claim Types:** Texture (prose), Verdict (best), Texture (collapse).
  *   **Step Reached:** 5 (Sampling Mandate).
  *   **Verdict:** **Reject for Shortlist.** The "collapse" claim is a specific Texture/Verdict flaw. Asymmetry rule applies: bad news is checkable. You sample the last third (30 pages). If the energy drops (likely, given the specificity), you cannot sign a citation calling it the "best."
  *   **Do I Read:** Sample.
  *   **Can I Sign:** No (unless sample disproves collapse, then Qualified).
  *   **Confidence Type:** Judging (based on verification).
  *   **Unwelcome:** **Yes.** You wanted to champion the prose, but the procedure forces you to verify the breakage, which kills the momentum.

  **Case B: The Translated Novella (1 Ecstatic Reader, Jury Blind)**
  *   **Claim Types:** Fit (innovation in language), Verdict (masterpiece).
  *   **Step Reached:** 3 (Distance Check).
  *   **Verdict:** **Move to Longlist, Drop for Shortlist.** Distance is too high for a unanimous jury signature. You cannot experience the texture. You must defer entirely. A unanimous citation requires all 5 jurors to judge; you can only recommend.
  *   **Do I Read:** Not (unless you learn the language).
  *   **Can I Sign:** Qualified (only if citation language allows "recommendation").
  *   **Confidence Type:** Deferring.
  *   **Unwelcome:** **No.** This is the safe call.

  **Case C: The Favorite (Juror Loves 60 Pages, 3 Readers Lukewarm)**
  *   **Claim Types:** Texture (Juror), Fit (Readers - implied lack thereof).
  *   **Step Reached:** 4 (Calibration Weight).
  *   **Verdict:** **Drop.** Three calibrated readers find no "Fit" value. Your 60-page experience is Texture-only. To override three "Fit" negatives, you need a Whole Read to find the structural innovation they missed. You only have 25 Whole Read slots. This book costs 1 slot to potentially prove 3 readers wrong. Procedure dictates allocating slots to books with positive Fit consensus first.
  *   **Do I Read:** Not (quota preservation).
  *   **Can I Sign:** No.
  *   **Confidence Type:** Judging (but overruled).
  *   **Unwelcome:** **Yes.** This is your personal favorite, but the procedure sacrifices it to preserve quota for higher-consensus books.

  ---

  ### 3. Limitations & Smuggled Assumptions

  **What This Cannot Do:**
  *   **Resolve Aesthetic Disagreement:** It manages risk, not taste. If the jury splits 3-vs-2 on the winner, this procedure doesn't solve the deadlock; it only ensures the 2 know *why* they are signing.
  *   **Guarantee Quality:** It guarantees procedural robustness, not that the "best" book wins. It optimizes for "defensible choice," not "perfect choice."
  *   **Protect the Maverick:** It systematically disadvantages books that require a specific, uncalibrated sensibility to appreciate (like Case C).

  **Smuggled Philosophical Claims:**
  *   **The Transmissibility of Fit:** The procedure assumes claims about a book's place in a tradition ("Fit") are objectively transmissible via testimony, while claims about prose ("Texture") are not. (This is a contested epistemic claim).
  *   **The Asymmetry of Evidence:** It assumes negative evidence (flaws) is more reliable and verifiable than positive evidence (greatness).
  *   **Calibration Stability:** It assumes past alignment on six books predicts future reliability on this specific pile, ignoring context-dependence.
  *   **Signature = Judgment:** It assumes signing a citation implies personal epistemic security, rather than mere agreement with a collective outcome.

