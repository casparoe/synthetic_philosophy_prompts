          *   *Do not* ask for bibliographic references.
      *   **Tone:** Careful, argumentative, philosophical yet technical (epistemic logic).

  2.  **Initial Brainstorming & Conceptualization:**

      *   *The Standard View:* Usually, people say "take the outside view, then adjust slightly for the inside view" (Kahneman/Lovallo). Or they take a weighted average (e.g., 50/50).
      *   *The Proposed View:* The outside view is the *anchor* (the prior). The inside view is a *likelihood ratio* or a *signal*, but a noisy one. The "tax" is essentially a shrinkage estimator but applied multiplicatively to the *deviation*.
