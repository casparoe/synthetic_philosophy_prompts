prompt: |-
  I have been thinking about the tension between inside-view and outside-view reasoning in domains where reference classes are noisy and mechanistic models claim high precision. I would like you to construct a careful argument for a specific, somewhat unorthodox position: that true epistemic modesty is not served by the usual prescription of blending inside and outside estimates, but instead demands a hierarchical treatment in which the outside view functions as an unperturbed prior and the inside view is admitted only as a calibrated perturbation subject to a second-order "overconfidence tax."

  More precisely, defend the claim that whenever an expert's mechanistic reasoning produces a forecast that diverges from the relevant reference class by more than one standard deviation of the class's historical variance, one should apply a multiplicative discount factor derived from that expert's past record of divergence in structurally analogous cases—not an additive adjustment, but a geometric attenuation—so that extreme inside-view predictions are compressed toward the base rate exponentially rather than linearly. You should explain why this multiplicative structure preserves more information than a simple weighted average, address the charge that it renders detailed mechanistic reasoning redundant, and clarify what epistemic residue survives in the inside view after the tax is levied. To ground the argument, you may construct hypothetical calibration histories or toy numerical examples, but do not request empirical literature, cite specific forecasting tournaments, or ask for bibliographic references.
