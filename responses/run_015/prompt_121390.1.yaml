      *   *Epistemic Modesty:* Usually means "don't be too sure." This proposal means "be especially skeptical of *deviations* from the norm."
      *   *Redundancy Charge:* If we shrink everything to the mean, why bother with the inside view? Answer: The *direction* and the *relative magnitude* still matter, even if the absolute magnitude is shrunk. It breaks symmetry between cases.
