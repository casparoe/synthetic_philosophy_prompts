answer: |-
  ### Exam Question

  **Topic:** Taurek and the Probabilistic Twist
  **Word Limit:** ~1200 words
  **Time:** 48 Hours

  John Taurek argues that in rescue cases, the numbers shouldn't count. His core strategy involves pairwise comparison: you compare the loss to individual A against the loss to individual B, rather than aggregating B's loss with C, D, and E. He suggests that since no single person in the larger group has a claim stronger than the single person in the smaller group, we should flip a coin to respect their equal standing.

  Consider a modified scenario: You can save a group of five people, but due to environmental hazards, each has only an independent 70% chance of survival even if you intervene. Alternatively, you can save one person who has a 99% chance of survival if you intervene. You cannot do both.

  Write an essay that takes a definite stance on whether Taurek's pairwise comparison strategy can survive this probabilistic twist. Does introducing probability smuggle expected-value aggregation back into his framework, or can Taurek block this by insisting on actual outcomes rather than probabilities? Do not hedge. Argue for one position and defend it with principled reasons, focusing on whether risk itself constitutes a harm that must be aggregated.

  ***

  ### Model Answer

  Taurek's main move in "Should the Numbers Count?" is that the mere fact that more people will die in one outcome than another doesn't justify saving the larger group. His reasoning leans on a pairwise comparison strategy: when comparing saving person A versus saving person B, the numbers don't matter. When comparing saving A versus saving B and C, he argues we shouldn't aggregate B and C's claims against A. Instead, we should flip a coin or choose based on preference, because no single individual in the larger group has a stronger claim than the individual in the smaller group. This view is designed to protect the separateness of persons against utilitarian aggregation. However, introducing probability into the rescue scenario creates a fissure in this armor that Taurek cannot easily seal.

  Consider the case where saving the group of five offers each a 70% independent chance of survival, while saving the single individual offers a 99% chance. An aggregationist immediately calculates expected value: 5 × 0.70 equals 3.5 expected lives saved, whereas 1 × 0.99 equals 0.99. The math dictates saving the five. Taurek wants to resist this math. He would argue that probabilities don't change the moral relationship between individuals. For Taurek, what matters is the complaint of the individual who dies. If you save the one, the five face a 70% risk of death. If you save the five, the one faces a 1% risk of death. Taurek might insist that we look at the actual outcome: either someone dies or they don't. Since we can't save everyone, someone will likely die either way. He might argue that giving the five a chance via a coin flip respects their equal claim better than subordinating them to a calculation of expected utility.

  But this defense fails because it ignores the moral significance of risk itself. In probabilistic cases, the harm isn't just death; it's the imposition of risk. When you choose to save the single individual, you are imposing a 70% risk of death on five distinct people. When you save the five, you impose a 1% risk on one person. Even if Taurek insists on pairwise comparison, he must compare the risk imposed on Individual A versus the risk imposed on Individual B. But here, the numbers re-enter through the backdoor of probability. The total amount of risk distributed across the group is objectively higher if you save the one. To ignore this is to ignore the cumulative burden of anxiety and probable loss that the group faces. Taurek's framework treats the claim as binary: you either have a claim to be saved or you don't. But probability makes the claim gradient. You have a 70% claim versus a 99% claim.

  Plus, Taurek's strategy relies on the idea that we are choosing between people, not outcomes. But probabilistic rescue is inherently about choosing between outcome distributions. If Taurek insists on sticking to actual outcomes (ex post), he becomes irrational from the perspective of decision theory. He would have to say that a 99% chance of saving one is morally equivalent to a 1% chance of saving one, provided the individual claim is the same. This leads to absurdity. If the single person had a 0% chance of survival, Taurek would presumably say save the five. But at what point does the probability shift the moral weight? If he admits probability matters, he admits aggregation matters, because probability is additive across persons in a way that raw numbers supposedly aren't. Expected value is just aggregated probability.

  So, the probabilistic twist smuggles aggregation back into Taurek's framework. He cannot block it without abandoning rational choice principles or denying that risk is a harm. If he denies risk is a harm, he ignores the reality of the agents involved who face uncertainty. If he accepts risk is a harm, he must aggregate those risks to compare the moral weight of the options. The pairwise comparison works only when outcomes are certain and claims are equal. Once uncertainty enters, the claims are no longer equal in terms of expected benefit. Taurek might try to say we should still flip a coin to respect the equal standing of the individuals. But flipping a coin when one option vastly reduces total expected suffering are not respecting standing; it's fetishizing equality at the cost of welfare. The separateness of persons does not require us to ignore the mathematics of chance. Consequently, Taurek's view collapses in probabilistic contexts. He must either accept expected value aggregation or defend a position that implies we should ignore massive differences in survival likelihood, which is untenable. The numbers, mediated through probability, must count.

  ***

  ### Marking Scheme (Total: 20 Marks)

  1.  **Reconstruction of Taurek's Pairwise Principle (4 marks)**
      *   *Must Hit:* Clearly explain that Taurek compares individual claims rather than aggregating groups.
      *   *Common Blow-up:* Students confuse Taurek's view with simple utilitarianism or claim he wants to save the one just because it's one.

  2.  **Application of Expected Value to the Case (4 marks)**
      *   *Must Hit:* Correctly identify the expected lives saved (3.5 vs 0.99) and how this pressures Taurek.
      *   *Common Blow-up:* Ignoring the independence of the probabilities or messing up the basic math of the scenario.

  3.  **Engagement with Ex Ante vs. Ex Post Distinction (4 marks)**
      *   *Must Hit:* Discuss whether risk itself (ex ante) is a harm or only actual death (ex post) matters.
      *   *Common Blow-up:* Treating risk as irrelevant or failing to see how probability changes the moral object.

  4.  **Definitive Stance (4 marks)**
      *   *Must Hit:* Take a clear side (Taurek survives OR Taurek fails). No "on the one hand" hedging.
      *   *Common Blow-up:* Sitting on the fence and concluding that "both sides have strong points" without picking a winner.

  5.  **Principled Justification (4 marks)**
      *   *Must Hit:* Provide a philosophical reason for the stance (e.g., rationality, nature of harm), not just intuition.
      *   *Common Blow-up:* Relying solely on "it feels wrong" without arguing why the feeling tracks a moral principle.

  \answer{Commits to a stance on risk aggregation}
