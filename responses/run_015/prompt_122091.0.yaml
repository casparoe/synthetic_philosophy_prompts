answer: |-
  The kiln in Room 304 had been cold for three weeks. Maya sat on a stool surrounded by unused bags of clay, scrolling through her phone. On the screen, Lincoln High's official account was posting a polished reel of students laughing over blank canvases. The caption was heavy with hashtags: #CreativeFuture #DistrictArts #Engagement.

  Behind her, the budget meeting was wrapping up. Mr. Henderson, the principal, looked ten years older than he had in September.

  "We have to pivot," Henderson told the art department. "The District isn't funding based on enrollment anymore. It's the Metric. If we don't trend, we lose the grant. If we lose the grant, we lose the clay."

  The Metric was the District's solution to fairness. They'd repurposed an old algorithm originally designed to rank library book circulation. Now, it scored "student engagement" by aggregating social media mentions, likes, and shares tagged with the school's identifier. It was objective, automated, and completely opaque.

  Across the district, three high schools were locked in a silent war. Lincoln, Washington, and Jefferson were all fighting for a single arts grant worth two hundred thousand dollars. Enough to fix roofs, buy instruments, and keep teachers.

  The rational move was obvious. If you cut actual art classes, you save money. You take that money and hire "engagement consultants"—mostly local marketing firms who knew how to game the algo. They paid micro-influencers to post about the school's "vibrant culture." They bought ads. They encouraged students to post anything, anywhere, as long as the tag was there.

  But if everyone did that, the noise floor rose. The algorithm normalized the scores weekly. So, to stay ahead, you had to spend more.

  Maya watched as Washington High posted a video of a flash mob in the cafeteria. It had fifty thousand views in an hour. Lincoln responded by hiring a local TikTok star to tour the halls. Jefferson started giving students extra credit for posts that hit certain engagement thresholds.

  The art was disappearing. The pottery wheels were covered in dust. The theater was dark. But the feeds were blazing.

  Two weeks prior, the principals had tried to stop it. Maya knew only because she was student council secretary and had held the door when they met off-campus at a Panera Bread. She'd seen them huddled over coffee, tired men and women in wrinkled suits.

  "We're burning money on consultants," Henderson had whispered. "None of it goes to the kids. We agree to stop. No paid posts. No consultants. Just real art."

  They had shaken hands. A verbal treaty. For three days, the feeds went quiet. Real photos of paintings appeared. It felt honest.

  Then the weekly rubric updated.

  The algorithm, owned by a third-party vendor the District refused to name, tweaked its weighting. Suddenly, video content was worth ten times static images. Engagement velocity mattered more than total count.

  Washington High broke first. Maybe they were desperate. Maybe they thought the others would hold. They dropped a professionally produced music video featuring their football team holding paintbrushes. It skyrocketed.

  Lincoln and Jefferson had no choice. If they stayed honest, their scores would plummet relative to Washington. They would lose the grant. Their programs would die. So they hired the consultants back. The music video was met with a viral dance challenge from Lincoln. Jefferson bought promoted tweets.

  Maya scrolled through the chaos in Room 304. There was no villain here. She didn't hate Mr. Henderson. She didn't even hate the principal at Washington. They were all nice people. They all wanted to teach. But the system rewarded the lie.

  If one school defected, the others suffered. So everyone defected. The cost of cooperation was losing everything. The cost of competition was losing their souls.

  "It's not them," Maya said to herself, locking her phone.

  She looked around the empty art room. The silence wasn't caused by malice. It was caused by a structure where the only winning move was to spend money on nothing. The algorithm didn't hate art. It didn't hate students. It was just code, written years ago to track checkouts, now dictating the value of creativity. It had no owner, no face, and no mercy.

  Mr. Henderson walked in, holding a flyer for a new "Content Creation Workshop" that replaced Advanced Sculpture. He looked at the cold kiln, then at Maya. He looked ashamed, but he set the flyer on the table anyway.

  "We have to try," he said softly.

  Maya nodded. She knew he would hire the consultants tomorrow. She knew Washington would buy more ads. She knew Jefferson would pay for influencers. They would all run faster just to stay in the same place, burning budget on visibility while the art starved.

  It wasn't a conspiracy. It was a trap. And as the notification pinged on her phone—another spike in tags, another meaningless victory—Maya realized the scary part wasn't that someone was controlling the game. It was that no one was.
