  You have put your finger on a specific, well-documented pathology in political science and memory studies, though there isn't one single universally agreed-upon noun for it. You are describing the **instrumentalization of memory** to achieve **commemorative closure**.

  However, the most precise social-science term for the *mechanism* you identified (using past good deeds to offset present bad behavior) is **Collective Moral Licensing**.

  Here is the breakdown of the concepts that map onto your observation, the specific name for the "credit" dynamic, and the edges that separate this from denial or actual justice.

  ### 1. The Name: Collective Moral Licensing & Commemorative Closure

  **Collective Moral Licensing**
  In psychology, "moral licensing" is when a person does something good (e.g., donating to charity) and subsequently feels permitted to do something questionable (e.g., being rude) because their "moral balance" is in the black.
  Scaled to the nation-state, this is exactly what you are seeing. Germany's *Vergangenheitsbewältigung* (coming to terms with the past) has become a form of national capital. Because the state funds Holocaust memorials and mandates education, it accrues "moral credit." This credit is then spent to deflect critiques of current policies (e.g., deportation of refugees, arms exports, or colonial restitution) by implying, "We have already paid for our sins; we are the 'good' nation now."

  **Commemorative Closure (or Narrative Closure)**
  This is the structural outcome. The state builds an apparatus (museums, holidays, textbooks) that frames the injustice as a **completed chapter**. By ritualizing the memory, the state signals that the *work* is done. The memory is preserved, but the *implications* of that memory are sealed off.
  *   **The mechanism:** "We remember this so we never do it again" subtly shifts to "We remember this, therefore we *don't* do it now."

  **"Musealization of Conscience"**
  This is a critical term used by historians (like Aleida Assmann). It describes putting guilt into a museum. Once guilt is institutionalized in stone and glass, it is removed from the political sphere. It becomes a site of tourism and education, not a lever for policy change.

  ### 2. The Edges: Distinguishing the Three Modes

  You asked for the edges. How do we distinguish this "Credit" model from simple Denial or actual Transitional Justice?

  | Feature | **1. Active Denial** (Turkey, parts of US South) | **2. Moral Credit / Commemorative Closure** (Germany, Japan, Liberal US) | **3. Transformative Justice** (Ideal/ Rare) |
  | :--- | :--- | :--- | :--- |
  | **Relationship to Truth** | "It didn't happen" or "It wasn't that bad." | "It happened, and we have memorialized it." | "It happened, and its structures persist." |
  | **Function of Memory** | To erase or protect the national myth. | To **immunize** the national myth. | To **interrogate** the national myth. |
  | **Temporal Frame** | The past is irrelevant. | The past is **resolved**. | The past is **present**. |
  | **Policy Outcome** | No change (status quo protected by silence). | Symbolic change (status quo protected by ritual). | Structural change (status quo disrupted). |
  | **Response to Critique** | Anger/Censorship (e.g., Turkey Art. 301). | Defensiveness ("We already do more than anyone"). | Accountability ("What do we need to fix next?"). |

  **The Edge between Denial and Credit:**
  Denial refuses the debt. Credit acknowledges the debt but claims to have paid it off in full with symbolism. Turkey criminalizes the mention of 1915 (Denial); Germany mandates the mention of 1945 but resists linking it to current racism (Credit).

  **The Edge between Credit and Justice:**
  This is the crucial edge you sensed.
  *   **Credit** is **Retrospective**: It looks backward to settle a score. It treats justice as a transaction (Memorial = Payment).
  *   **Justice** is **Prospective**: It looks forward to change conditions. It treats justice as a transformation (Reparations/Policy Change = Repair).
  *   *The Test:* If the remembrance apparatus makes it *harder* to critique current policy because "we already apologized," it is Credit. If the remembrance apparatus makes it *easier* to identify and dismantle current inequities because "we see the pattern," it is Justice.

  ### 3. Application to Your Examples

  **Germany: The "German Catechism"**
  There is a heated debate in Germany right now (led by scholars like A. Dirk Moses) about exactly this. Critics argue *Vergangenheitsbewältigung* has hardened into a "German Catechism." The state uses its unique guilt over the Holocaust as a shield.
  *   *Example:* When critics point out German colonial genocide in Namibia, the response is often, "We are the most penitent nation; don't equate us with others." The Holocaust memory becomes a wall against other claims.

  **Japan: Selective Pacifism**
  Japan's "Peace Museums" (like in Hiroshima) often focus on Japanese *suffering* rather than Japanese *perpetration*.
  *   *The Credit:* "We are the only nation to suffer nuclear war; we are a beacon of peace."
  *   *The Immunity:* This identity allows Japan to sidestep accountability for Comfort Women or Nanking. The "Peace" identity acts as moral credit that insulates them from accusations of militarism or sexism.

  **The American South: Heritage as Immunity**
  In the South, the "Heritage" argument is a variation of Moral Licensing.
  *   *The Logic:* "Our ancestors fought bravely (Credit), so removing the statue is an insult to that bravery."
  *   *The Difference:* Unlike Germany, the South often skips the "Guilt" phase and goes straight to "Honor." It is less about "We paid for our sins" and more about "We don't have sins, we have history." This is closer to Denial, but it uses the *language* of remembrance to achieve immunity.

  **Turkey: Inverted Apparatus**
  Turkey represents the "Missing Apparatus." Because there is no official acknowledgment, there is no moral credit to spend. Instead, the state relies on **Nationalist Immunity**. The lack of remembrance *is* the shield. If you can't speak it, you can't link it to the present (e.g., treatment of Kurds).

  ### 4. Is there a term for the "Substitution"?

  If you want a single phrase to search for or use, the most accurate critical terms are:

  1.  **"Memory as Alibi"**: Using remembrance as an excuse not to act.
  2.  **"Performative Penitence"**: The ritual of apology without the substance of repair.
  3.  **"Depoliticization of Memory"**: Turning a political demand (justice) into a cultural product (museum).
  4.  **"Guilt-Washing"**: (Emerging colloquialism) Analogous to greenwashing. Using symbolic guilt to mask structural continuity.

  ### Summary
  You are observing **Collective Moral Licensing** facilitated by **Commemorative Closure**.

  The structural trick is converting **Justice** (which is ongoing, costly, and disruptive) into **Memory** (which is static, budgeted, and manageable). Once a society builds the monument, it feels it has "handled" the problem. The monument becomes a tombstone not just for the victims, but for the demand for change.

  In your grandma's town, keeping the statue isn't just about history; it's about maintaining the "Credit" of the ancestors to avoid the "Debt" of the present. Removing the statue would cash in that credit and demand a new accounting. That is why the fight is so visceral.
