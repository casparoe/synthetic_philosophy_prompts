answer: |-
  Here is a concrete breakdown of how the structural mismatch between a **punctuated atrocity** and a **diffuse structural process** causes ranking metrics to collapse, specifically through the manipulation of the counterfactual baseline.

  ### The Cases

  1.  **The Punctuated Case: The Rwandan Genocide (1994)**
      *   **Structure:** A discrete event with a clear operational start (April 7), a clear termination (July 15), and a centralized decision-making apparatus.
      *   **Harm Profile:** High intensity, short duration.
      *   **Body Count:** ~800,000 excess deaths.
      *   **Baseline:** The counterfactual is stable. Without the specific political decision to mobilize militias, the population would have continued its pre-war demographic trajectory. The "window" of harm is defined by the event itself.

  2.  **The Diffuse Case: Indigenous Depopulation of Hispaniola (1492–1550)**
      *   **Structure:** A centuries-long process of extraction, labor enforcement (*encomienda*), and epidemiological exposure. There is no single "start order" for the depopulation; it is the emergent result of trade, settlement, and disease.
      *   **Harm Profile:** Sustained elevation of mortality, extraction of labor power, cultural dissolution.
      *   **Body Count:** Estimates range from 250,000 to 1,000,000+ excess deaths depending on the baseline.
      *   **Baseline:** There is no natural window. The harm bleeds into "background history."

  ### The Metric: Integrated Excess Mortality (IEM)

  To rank these, we typically try to calculate **IEM**: the integral of the mortality rate over time, minus the counterfactual baseline mortality rate.

  $$ \text{IEM} = \int_{t_{start}}^{t_{end}} (\text{Actual Mortality}(t) - \text{Baseline Mortality}(t)) \, dt $$

  In the **Punctuated Case**, $t_{start}$ and $t_{end}$ are given by the historical record (the genocide began and ended). In the **Diffuse Case**, $t_{start}$ and $t_{end}$ are arbitrary. Did it start when Columbus landed? When the first smallpox virus replicated? When the first labor law was passed? Did it end when the population hit zero? When the colonial system stabilized?

  ### The Inversion via Baseline Selection

  Here is how the choice of baseline for the Diffuse Case inverts the ranking relative to the Punctuated Case.

  #### Baseline 1: Pre-Contact Static Subtraction (The "Demographic Collapse" Model)
  *   **Method:** You set the Baseline Mortality to the pre-contact growth rate. You assume the population would have remained stable or grown linearly absent European contact.
  *   **The Window:** You integrate from 1492 (contact) to 1550 (near extinction).
  *   **Calculation:**
      *   Pre-contact population: ~1,000,000.
      *   Post-contact population (1550): ~500.
      *   **IEM:** ~999,500 deaths.
  *   **Ranking:** **Diffuse (Hispaniola) > Punctuated (Rwanda)**.
      *   *Result:* The structural process is ranked as the greater evil because the integral captures the total demographic collapse.

  #### Baseline 2: Independent Development Trajectory with Epidemiological Realism (The "Causal Attribution" Model)
  *   **Method:** You argue that the "harm" must be restricted to *agency*. You construct a counterfactual where contact occurs (inevitable in a globalizing world), and therefore Old World pathogens arrive, but *without* the specific extractive labor policies.
  *   **The Window:** You must now surgically remove deaths caused by "natural" disease transmission from deaths caused by "structural" vulnerability (forced labor preventing recovery).
  *   **Calculation:**
      *   Historians estimate that ~60–80% of the depopulation was due to immunological shock (smallpox, influenza) which would have occurred even with peaceful trade.
      *   Only ~20–40% is attributable to the *encomienda* system (starvation, overwork, fragmentation of care networks).
      *   Adjusted IEM: ~200,000 to 400,000 attributable deaths.
  *   **Ranking:** **Punctuated (Rwanda) > Diffuse (Hispaniola)**.
      *   *Result:* The punctuated atrocity is now ranked as the greater evil because the diffuse case's "harm window" has been shrunk by excluding deaths deemed "unavoidable" by the chosen baseline.

  ### Where the Machinery Breaks

  The inversion happens because the **Punctuated Case** and the **Diffuse Case** handle the relationship between *background conditions* and *perpetrator action* differently.

  1.  **In the Punctuated Case (Rwanda):** The background conditions (ethnic tension, history) are treated as *context*, not *cause*. The metric assumes that without the specific genocidal orders, the deaths do not happen. The "Baseline" is effectively "Peace." The window is sealed tight by the perpetrator's intent.
  2.  **In the Diffuse Case (Hispaniola):** The background conditions (disease ecology, global trade winds) are entangled with the perpetrator's action (labor extraction).
      *   If you choose **Baseline 1**, you treat the *arrival* of Europeans as the harm. The window opens at contact.
      *   If you choose **Baseline 2**, you treat the *policy* as the harm. The window opens only where policy exacerbated nature.

  **The Structural Mismatch:**
  The metric requires you to separate "Nature" from "Politics" to calculate Excess Mortality.
  *   In Rwanda, the machete is purely Political.
  *   In Hispaniola, the virus is Natural, but the *susceptibility* is Political.

  By choosing Baseline 2, you are effectively arguing that a death caused by smallpox + forced labor is only partially a "historical evil," whereas a death caused by a machete is 100% a "historical evil." This privileges **intent and directness** (Punctuated) over **negligence and structure** (Diffuse).

  The ranking inverts not because the suffering changed, but because the **integration window** for the diffuse case is porous. You can shrink the window by reclassifying structural violence as "environmental fate." You cannot do this for the punctuated case, because the event *is* the window. Thus, any ranking system that relies on summing harm over time will inherently bias toward punctuated atrocities unless it adopts a baseline for diffuse cases that treats *systemic vulnerability* as equivalent to *direct violence*.
