          *   *Medical/Psych Monitor:* Ensures "safety" during abuse. Payoff: Ethical conflict vs. duty to organization/patient (dual loyalty).
          *   *Analyst:* Processes intel. Often didn't know source was tortured or couldn't verify validity immediately. Payoff: Producing intel products.
          *   *Interrogator:* Executes techniques. Payoff: Following orders, career, "getting the job done."
      *   *Epistemic Gap:* Did anyone *know* there was a ticking bomb? Mostly no. It was about "potential" threats.
      *   *Diffusion of Responsibility:* No one person pulled the trigger alone. The OLC said it's legal, Medical said it's safe, Boss said do it.
      *   *Thesis:* The program was not a misapplication but an *institutional realization* of TTB logic. The logic was used to build a bureaucracy that absorbed the moral risk so no individual had to face the TTB dilemma directly. This transforms the ethical verdict from "justified exception" to "systemic moral hazard."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define TTB. Introduce the CIA program. State the thesis: The program wasn't a series of TTB moments but a bureaucratic machinery designed to operationalize the *logic* of TTB without the *conditions* of TTB.
      *   **Mapping the Nodes (The Institutional Network):**
