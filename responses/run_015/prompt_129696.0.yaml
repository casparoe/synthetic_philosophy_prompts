      *   **Epistemic Conditions (The "Certainty" Problem):**
          *   TTB requires *near-certain* knowledge.
          *   CIA reality: Speculative, "chatter," retrospective validation.
          *   Violation: The "bomb" was often hypothetical.
      *   **Diffusion of Responsibility (The Moral Calculus):**
