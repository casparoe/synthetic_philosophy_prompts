          *   *Legal Advisors (OLC):* The "Golden Shield." Payoff: Protecting the organization. Epistemic: Abstract legal theory, detached from field reality.
          *   *Medical Monitors:* The ethical buffer. Payoff: Professional duty vs. Hippocratic oath. Epistemic: Knew physical limits, ignored psychological long-term.
          *   *Interrogators:* The hands. Payoff: Obedience, career. Epistemic: Reliant on guidance, not independent knowledge of threats.
