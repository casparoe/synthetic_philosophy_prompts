          *   Payoff alteration: Legal authorization reduced *legal* risk, making the *moral* risk seem manageable.
      *   **Misapplication vs. Institutional Realization:**
          *   Argument: It's an institutional realization. The TTB argument provides the *license* to build the system. It allows the state to say "We might need this" without proving "We need this *now*."
          *   The bureaucracy absorbs the guilt.
      *   **Conclusion/Verdict:**
          *   Does this strengthen or weaken TTB? It destroys it. It shows TTB is a slippery slope to institutionalized abuse because the "exception" becomes the "rule" via bureaucracy. It transforms the verdict from a utilitarian calculation to a structural critique.

