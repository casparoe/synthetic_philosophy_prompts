  *(Self-Correction Note during final review)*: I need to be careful not to simply condemn the program (which is the historical consensus) but to analyze *how* it relates to the TTB argument philosophically. The prompt asks for an analysis of the *moral structure* through the lens of the argument, not just a historical indictment. I must focus on the *mechanism* of justification.

