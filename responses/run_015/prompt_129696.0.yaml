          *   **Core Argument:** Is this a *misapplication* of TTB (no one faced the pure scenario) or an *institutional realization* (logic licenses distributing risk)?
          *   **Conclusion:** Does this institutional reading strengthen, weaken, or transform the ethical verdict on TTB?
      *   **Constraints:** Be precise, honest about theoretical limits, avoid obscure details (stick to public outline), conclude with an assessment.

  2.  **Initial Brainstorming & Structuring:**

      *   *The TTB Argument:* Classic philosophical thought experiment. One agent, one detainee, certain knowledge of imminent catastrophe, torture is the *only* way to stop it. Justifies torture as a lesser evil.
      *   *The CIA Program:* Bureaucratic, layered, retrospective justification, uncertain intelligence, "enhanced techniques" authorized by OLC, medically monitored.
      *   *The Mismatch:* TTB assumes certainty and immediacy. CIA program was systemic and probabilistic.
      *   *The Nodes:*
