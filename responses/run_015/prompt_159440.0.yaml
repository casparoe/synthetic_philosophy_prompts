answer: |-
  **MEMORANDUM**

  **TO:** Reproductive Medicine Ethics Advisory Committee
  **FROM:** Ethics Advisor
  **DATE:** 12 March
  **SUBJECT:** Recommendation on Budget Allocation: Genetic Testing vs. Additional IVF Cycles

  We recommend funding the extension of IVF with preimplantation genetic testing for the inherited neurodegenerative condition, subject to a new severity criterion for eligibility. We do not recommend funding the additional IVF cycle for age-related infertility at this time, deferring that claim until budget expansion or further review.

  **Reasoning and Decision**

  This decision rests on a distinction between preventing significant suffering and facilitating additional existence. Our budget allows only one initiative. The first claim (genetic testing) allows parents who would conceive anyway to avoid transmitting a serious, progressive disease. The second claim (additional IVF) allows parents to have a child who would otherwise not exist. While both outcomes are valuable, public medical resources should prioritize preventing severe pathology over expanding family size when the former is achievable without preventing existence altogether.

  Our audit shows that most couples eligible for testing would conceive naturally if unfunded. Therefore, funding testing does not primarily create children; it ensures the children born to these parents do not inherit a condition that causes progressive loss of mobility and independence. In contrast, funding the additional IVF cycle creates new lives. In a context of fixed resources, the moral weight of preventing a known, serious medical fate outweighs the benefit of bringing an additional person into existence. This is not because the additional life lacks value, but because the duty to prevent severe suffering in the future population takes precedence over the duty to increase the population size.

  **Addressing the Problem of Different Children**

  One member argued that because the child born via testing is not the same child who would be born naturally, we cannot claim to be helping the "natural" child by refusing them existence. This is a rigorous logical point: if we fund testing, Child A (healthy) is born; if we do not, Child B (burdened) is born. We cannot say Child B is harmed by our decision, because Child B only exists if we decline funding. Consequently, this member argues our regulation, which asks us to weigh the welfare of the child *who would be born*, gives us no authority to prefer Child A over Child B, as they are different people.

  While logically sound, this interpretation paralyzes preventive medicine. If we accept that we cannot compare the welfare of different possible children, we could never fund genetic testing for any condition, as testing always results in a different embryo being selected. We must interpret the regulation purposively: it requires us to consider the welfare of children born *through our services*. When we fund a pathway, we are responsible for the kind of life that pathway produces. We are not comparing harm to a specific individual across scenarios; we are comparing the quality of life outcomes of the clinical pathways we support. A policy that results in children born with severe, progressive disability is ethically inferior to a policy that results in children born without that disability, even if the children are numerically different. To rule otherwise would strip the committee of the ability to evaluate the medical benefit of selection itself.

  **Scope and Expressivist Concerns**

  Another member worried that funding selection sends a message that lives with this condition are not worth living, contradicting patient reports that their lives are meaningful. This concern is valid. We must distinguish between judging a life as not worth living and judging a condition as worth avoiding. Patients can report their lives are good while still wishing their children did not have to endure the same physical decline. Our funding decision should not be read as a verdict on the worth of existing patients, but as a commitment to prevent the specific suffering associated with this pathology.

  To address the Chair's concern about consistency—specifically regarding milder conditions like migraine—we must adopt a principled scope criterion. We cannot fund selection based solely on parental preference, nor can we fund it for every genetic variation. We should fund selection only where the condition involves **significant impairment of core physical or cognitive capacities that substantially reduces the expected duration of independent functioning.**

  The neurodegenerative condition in question meets this threshold: it guarantees wheelchair dependence and loss of mobility in mid-life. A predisposition to migraine, while painful, does not remove independent functioning. This criterion prevents a slippery slope while respecting the medical mandate to prevent serious harm. It anchors our decision in the severity of the impairment rather than the identity of the condition or the preferences of the parents.

  **Recommendation on Regulation**

  The current regulation requires us to weigh the welfare of "the child who would be born as a result of treatment." As noted above, this phrasing invites the logical problem that prevents us from comparing different possible children. It ties our ethical authority to a specific identity that changes depending on our decision.

  We should ask the Board to amend this regulation. The new wording should read: **"weigh the welfare of children born through our services, considering the conditions of their lives."** This removes the focus from numerical identity and places it on the quality of life outcomes our policies generate. It clarifies that we are permitted to consider the welfare of the child who *will* be born under a funded pathway against the welfare of the child who *would* be born under an unfunded pathway, even if they are not the same individual. This aligns the regulation with the practical reality of reproductive medicine, where selection inevitably changes who is born.

  **Conditions and Review**

  This funding approval is conditional on the following:
  1.  **Eligibility:** Restricted to conditions meeting the severity criterion defined above (significant loss of independent functioning).
  2.  **Counseling:** Patients must receive non-directive counseling that explicitly affirms the worth of existing lives with the condition while explaining the medical rationale for prevention.
  3.  **Review:** We will review this decision in twenty-four months. We require data on the number of cycles funded, the conditions selected against, and patient feedback regarding the counseling experience.

  **What We Are Not Deciding**

  This memo does not establish a precedent for funding selection for all genetic conditions. It does not rule on conditions with childhood onset versus adult onset generally; the key factor is the severity of impairment, not the age of onset alone. It does not address non-medical selection, such as sex selection for social reasons. Finally, this is not a ruling that age-related infertility is unworthy of support; it is a prioritization decision based on fixed budgets. Should the budget expand, the claim for additional IVF cycles should be reconsidered on its own merits.

  We must proceed with clarity that our role is to steward resources toward preventing severe suffering where possible, without devaluing the lives of those currently living with disability. This recommendation balances those duties.
