      *   *Decision:* The user suggested Muddy Boots and seems to like it. I should respect that but ensure it meets criteria (a)-(c). Let's refine it: **The Locked Room & The Wet Umbrella.**
      *   *Fact:* Umbrella is wet (on the rack since morning).
      *   *Hypothesis:* It rained last night (new theory).
      *   *Why:* It's simpler than boots (boots imply movement). Wet umbrella = rain.
      *   *Wait, User's specific constraint:* "My fallback is a who-dunnit: the muddy boots..."
