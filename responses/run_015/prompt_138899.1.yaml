      *   *Constraint Check:*
          *   (a) Known fact: Boots seen muddy all day.
          *   (b) Hypothesis: Gardener did it (not tailored).
          *   (c) No "new derivation": It's not a math proof, it's an explanatory link.

  4.  **Sequence the Misconceptions:**
      1.  *Redo update with earlier prior:* This is the "historical/ur-prior" solution. Address after the problem is stated but before declaring defeat.
      2.  *Real evidence is the calculation:* Address when they try to save Bayes.
