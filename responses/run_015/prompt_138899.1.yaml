prompt: |-
  Hey — I need help planning next week's section, not the material itself.

  Setup: fifty-minute discussion section, Philosophy of Science for non-majors — mostly compsci and econ kids who have seen Bayes' theorem once in a stats class and can multiply out a posterior, but have had nothing on confirmation theory, nothing on hypothetico-deductivism. The topic is the problem of old evidence. I know the dialectic; what I don't have is an order for it.

  The dependency question is what I keep getting stuck on. I think something has to be established before the puzzle can even be stated — something like: for the Bayesian, learning is becoming certain, the thing you become certain of has to have had a prior below 1, and confirmation is probability-raising, not "this makes sense of that." But I can't tell whether that last bit belongs up front or whether it's actually the moral I should let them arrive at, and if it goes up front I worry it deflates the puzzle instead of setting it up. Tell me what has to be on the board, in what order, and what breaks if I move a piece earlier.

  The carrying case. I keep reaching for the perihelion of Mercury and I've decided that's wrong for this group — their physics is one semester of mechanics and it invites "maybe the measurements were just off." My fallback is a who-dunnit: the muddy boots have been sitting in the hallway the whole time, the new hypothesis is that the gardener did it, and everyone in the room feels the "oh, *that's* why" without any new data arriving. Give me one case to build the whole fifty minutes around, and say what it has to have and what it has to lack — my guess is it needs (a) a fact every student has known since childhood, (b) a hypothesis nobody could suspect was reverse-engineered to fit it, and (c) no wriggle room where someone can say the genuinely new evidence is the derivation someone performed later.

  Misconceptions I'm expecting, and I want these placed in the sequence rather than listed: (1) "easy — just redo the update with your earlier prior," which I take to be the counterfactual/ur-prior move wearing a disguise, and I don't want them filing it as epistemic amnesia; (2) "the real evidence is new, it's the calculation," which feels like a dodge to me but I can't say cleanly why; (3) "so Bayesianism is just false"; (4) "this only shows up in dusty historical cases with old theories"; (5) and this group specifically: "if the data was already in front of you, any fit to it is overfitting," which is the machine-learning intuition leaking in. Which of these do I head off, at which point in the sequence, and what am I not seeing?

  One thing I've started believing and can't place: that the real lesson is that the Bayesian picture has no room for the difference between predicting something in advance and merely accommodating it, and that the old-evidence problem is just that gap showing up in one place. Tell me whether to put that in, where, or whether it muddies the fifty minutes.

  And tell me straight what to leave out at this level and say out loud that I'm leaving it out — I don't want to open the door to the bootstrapping formalisms or to probability kinematics, but I also don't want to look like I'm hiding something when a sharp student asks.

  Format: give me a markdown table, one row per step, with exactly these columns — Order (1..n) | Move (what I say or put on the board, one or two sentences) | Depends on (which earlier row it needs and what breaks if it comes sooner) | Misconception defused here (name the numbered one, or "—") | Check (the question or board vote that tells me this step landed before I move on). Then a second short table with columns Left out | Why it's out | What to say when someone asks, for the three or four things you think I should name-and-decline. Then one line: Exit question — the single question I ask at minute 48 that separates someone who has the puzzle from someone who has the vocabulary.
