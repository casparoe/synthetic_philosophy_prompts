      5.  *Overfitting (CompSci):* Address during the "Prediction vs. Accommodation" discussion.

  5.  **Address "Prediction vs. Accommodation":**
      *   *User's Belief:* This is the real lesson.
      *   *My Take:* Yes, but don't lead with it. It's the *moral*, not the *setup*. If you lead with it, the POE feels like a trivial example of that. The POE is the *formal proof* that standard Bayes can't distinguish them.
      *   *Placement:* Near the end, as the "So what?"

  6.  **Determine What to Leave Out:**
      *   Garber-style solutions (sentences about sentences).
      *   Counterfactual priors (too technical for 50 mins).
      *   Jeffrey Conditionalization.
      *   *Reason:* Time and level.
      *   *Script:* "We are looking at the standard model, not the patches."

  7.  **Drafting the Table (Iterative Process):**
