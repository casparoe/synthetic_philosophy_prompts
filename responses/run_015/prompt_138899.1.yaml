      *   Ensure the "Prediction vs. Accommodation" point doesn't muddy the water. It should be the resolution of the tension, not a new topic.
      *   Check the "Dependency" logic in the "Depends on" column.

      *(Self-Correction during drafting)*: I need to be careful with Misconception 5 (Overfitting). CompSci kids think fitting old data is *suspicious* (overfitting). POE says fitting old data is *impossible* (no confirmation). These are opposite problems. I need to make sure I don't conflate them. The POE says Bayes *cannot* register the fit. Overfitting says the fit is *meaningless*. I need to distinguish these. Actually, the user says: "if the data was already in front of you, any fit to it is overfitting." This is the misconception. I need to show that intuitively, we *do* think it confirms (Gardener did it), even if it's old data. So the misconception is "Old data can't confirm." The POE shows Bayes agrees with the misconception, but Intuition disagrees.
