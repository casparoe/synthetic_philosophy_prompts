      *   *Decision:* This *must* be up front. It's the rule of the game. If you wait, they'll use intuitive confirmation ("it makes sense") which dissolves the puzzle immediately. The puzzle *is* the clash between intuition and the formalism.
      *   *Board State:* Needs $P(E)=1 \implies P(H|E) = P(H)$.

