answer: |-
  ### Exam Question

  **Question 4:**
  The Simple Conditional Analysis (SCA) defines a disposition *D* in terms of a counterfactual conditional: *x* is *D* iff, if *x* were stimulated, *x* would manifest. It is standardly taught that 'finks' (Martin) and 'masks' (Johnston) both refute the SCA.

  Critically evaluate the following claim:
  *"While finks and masks both refute the SCA, they represent fundamentally different metaphysical problems and therefore require distinct theoretical solutions."*

  In your answer, define the problems clearly, but focus your argument on whether the distinction between them is merely superficial or metaphysically significant.

  ***

  ### Model Answer

  The Simple Conditional Analysis (SCA) attempts to reduce dispositional properties to counterfactual conditionals. It fails because the link between stimulus and manifestation can be broken in two distinct ways: finks and masks. To evaluate whether these represent fundamentally different metaphysical problems, we must examine what happens to the disposition itself in each case.

  A 'finkish' disposition is one that is lost precisely when the stimulus occurs. Consider a wire that is conductive but connected to a 'fink' device that removes its conductivity the moment it is touched. Here, the antecedent (touching) is true, but the consequent (conducting) is false, not because the wire wasn't conductive, but because it ceased to be so upon stimulation. A 'mask', conversely, occurs when the disposition remains intact, but an external factor prevents manifestation. A fragile vase packed in styrofoam is still fragile; if struck, it will not break, but only because the packing interferes with the causal process.

  The claim that these are fundamentally different problems holds weight. Metaphysically, finks challenge the *intrinsic nature* of the disposition. In fink cases, the causal basis of the disposition is removed or altered at the critical moment. This suggests the SCA fails because it ignores the temporal persistence of the causal basis. Lewis's Reformed Conditional Analysis (RCA) addresses this by anchoring the disposition to an intrinsic causal basis that persists through the stimulus.

  Masks, however, challenge the *sufficiency* of the stimulus conditions. The causal basis remains intrinsic and stable, but extrinsic interferers block the manifestation. Lewis's RCA struggles here; even if we fix the causal basis, the mask prevents the outcome. Solving masks typically requires *ceteris paribus* clauses (all else being equal) or a shift to a causal powers ontology where dispositions are primitive properties that do not reduce to conditionals at all.

  Therefore, the distinction is metaphysically significant. Finks reveal a flaw in how the SCA handles the *possession* of properties over time. Masks reveal a flaw in how the SCA handles the *context* of manifestation. Treating them as identical threats leads to inadequate solutions; a theory patched only for finks (like early versions of RCA) remains vulnerable to masks. Consequently, a robust metaphysics of dispositions must treat finks as a problem of intrinsic stability and masks as a problem of extrinsic interference, likely requiring a hybrid solution or an abandonment of the conditional analysis entirely.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade A (17–20 Marks): Critical Synthesis**
  *   **Thesis:** Explicitly defends or refutes the claim that the distinction is metaphysically significant (takes a stance).
  *   **Specific Move 1 (Intrinsic/Extrinsic):** Clearly distinguishes finks as threats to the *possession/intrinsic basis* and masks as threats to *manifestation conditions/extrinsic factors*.
  *   **Specific Move 2 (Solution Evaluation):** Evaluates why a solution for one (e.g., Lewis's RCA for finks) does not automatically solve the other (masks).
  *   **Nuance:** Acknowledges that while both break the conditional, the *reason* for the break dictates the metaphysical remedy.
  *   **Clarity:** Argument is tight, precise, and stays focused on the prompt rather than historical summary.

  **Grade B (13–16 Marks): Competent Explanation**
  *   **Thesis:** Addresses the prompt but may remain agnostic or treat the distinction as obvious without deep argumentation.
  *   **Specific Move 1 (Definition):** Correctly defines SCA, Finks, and Masks with appropriate examples.
  *   **Specific Move 2 (Comparison):** Notes that finks involve losing the property while masks involve blocking it, but does not fully explore the metaphysical implications of this difference.
  *   **Knowledge:** Accurately references Lewis or Martin but may rely too heavily on "Lewis said X" rather than analyzing the structural problem.
  *   **Clarity:** Well-structured, but the conclusion may be generic (e.g., "Both are bad for SCA").

  **Grade C (9–12 Marks): Basic Description**
  *   **Thesis:** Restates the prompt without a clear argumentative line.
  *   **Specific Move 1 (Definition):** Defines SCA and provides examples of finks/masks, but definitions may be slightly imprecise.
  *   **Specific Move 2 (Connection):** States that both are counterexamples to SCA but fails to differentiate the *type* of failure (possession vs. manifestation).
  *   **Knowledge:** Mentions relevant names (Martin/Lewis) but context is vague.
  *   **Clarity:** Understandable but lacks philosophical rigor; may drift into generalities about science.

  **Fail (0–8 Marks): Inadequate**
  *   **Issues:** Fails to define SCA correctly; confuses finks and masks; or writes a general essay on dispositions without addressing the specific comparison requested.
  *   **Knowledge:** Significant misunderstanding of the counterfactual framework.
