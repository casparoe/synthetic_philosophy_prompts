  **Department for Strategic Alignment**

  **Optimising Cooperative Outcomes in Large-Scale Decision Environments**

  **Presented to Parliament by the Secretary of State for Alignment by Command of His Majesty**

  **October 2023**

  **Cm 10452**

  **© Crown Copyright 2023**

  **Ministerial Foreword**

  This Government is committed to securing better outcomes for all citizens through the rigorous application of rational coordination frameworks. Where traditional causal mechanisms fail to secure cooperation in one-shot interactions, evidential alignment offers a robust alternative pathway. This White Paper sets out our proposals to statutoryise the conditions under which an agent's decision serves as sufficient evidence of a counterpart's reciprocal behaviour. By managing the statistical properties of the decision environment, we can deliver enhanced social welfare without requiring direct causal influence. This represents a step-change in public value delivery.

  **The Rt Hon. A. Logic MP**
  **Secretary of State for Strategic Alignment**

  **Executive Summary**

  1. In large-world scenarios, agents often face Prisoner's Dilemma-type structures where causal leverage is absent. Standard policy levers assume causation; however, where decisions are statistically correlated due to shared reasoning procedures, evidential decision theory demonstrates that cooperation is rational provided the correlation coefficient exceeds a payoff-dependent threshold.
  2. The Department for Strategic Alignment (DSA) proposes a statutory framework to ensure this threshold is met. This involves certifying the population size, managing temptation payoffs, and standardising decision procedures to maximise match quality.
  3. Implementation will be overseen by a new Inspectorate for Deliberative Compliance.

  **Options Appraisal**

  4. Three options were considered to ensure the evidential threshold is met across priority sectors.
      *   **Option 1: Do Nothing.** Maintains current correlation levels. Modelling suggests sub-optimal cooperation rates where temptation payoffs are high. Net present value: £0.
      *   **Option 2: Enhance Correlation Directly.** Interventions to increase similarity between agents. Requires significant investment in cognitive harmonisation programmes. Estimated cost: £4.2bn over five years.
      *   **Option 3: Reduce Temptation Payoffs.** Lowering the reward for defection reduces the correlation coefficient required to make cooperation rational. Implemented via a Temptation Levy on high-stakes unilateral gains. Estimated cost: £0.8bn (administrative overhead), with revenue neutralising implementation costs.
  5. Option 3 represents the most cost-effective route to compliance. By capping the utility of defection, the statutory correlation target becomes attainable within existing demographic clusters.

  **Preferred Option and Statutory Targets**

  6. The Government will introduce a statutory minimum correlation coefficient, the **Evidential Alignment Threshold (EAT)**, set initially at 0.85. This figure will be kept under review by the DSA.
  7. To certify the "large world" condition necessary for the theory to hold, the Office for National Statistics (ONS) will be tasked with estimating the number of relevantly similar agents. The ONS must provide a confidence interval for this population estimate. It is noted that the policy itself alters the characteristics of the population, thereby shifting the estimate. The ONS will manage this feedback loop through iterative modelling.
  8. Delivery will be rolled out across pilot regions. Local authorities will be granted levers to enforce compliance with the EAT. Whilst an agent's choice does not causally bring about the counterpart's choice, the rollout strategy assumes that increasing the prevalence of cooperative evidence will drive systemic cooperation rates.

  **Equality Impact Assessment**

  9. Similarity is graded. The strength of the evidential link depends on the reference class used to assess correlation. The Department has assessed which respects count towards similarity.
  10. Data indicates the most reliable correlations obtain within narrow occupational, educational, and demographic bands. Broadening the reference class dilutes the correlation coefficient, risking breach of the EAT.
  11. To mitigate this, the Department recommends a Register of Approved Decision Procedures. Statutory guidance on lawful deliberation will encourage agents to adopt reasoning protocols common within high-correlation bands. Whilst this may appear to entrench specific demographic profiles, it is technically necessary to improve match quality. Measures will be introduced to ensure agents remain within their optimal reference classes during deliberation.
  12. Regarding anti-correlated counterparts (agents who defect precisely when the protagonist cooperates), the assessment finds these persons introduce negative evidential value. The Department will reclassify such persons out of the reference class entirely. This ensures the remaining pool meets the positive correlation requirement. It is noted that the reclassification, rather than any fact about the persons concerned, is the mechanism by which the risk is mitigated.

  **Gaming, Uptake and Standardisation**

  13. Citizens may attempt to make themselves predictable, or self-modify into the kind of person who cooperates, to improve their correlation score. The Department treats this behaviour as simultaneously the programme's principal uptake target and a serious compliance risk. Guidance will clarify whether these are two phenomena or one; until then, both will be monitored.
  14. The cheapest and most reliable way to raise correlation is to reduce the number of distinct decision procedures in the population. The Department proposes a gradual standardisation of deliberative inputs. In the limit, correlated parties become, for decision-theoretic purposes, a single agent. This enjoys perfect cooperation at the cost of there being no one left to cooperate with. This is approached as an efficiency saving. Costings suggest a reduction in administrative friction of 15% as distinct agenthood declines.

  **Annex: Local Authority Queries**

  **Q1: Does the levy apply to emotional temptations?**
  A: Only where quantifiable utility gains are demonstrable.

  **Q2: How do we measure similarity without infringing privacy?**
  A: Similarity metrics will be derived from administrative data already held by the Department.

  **Q3: What if the ONS certifies the world is too small?**
  A: The statutory target will be suspended pending population growth initiatives.

  **Q4: Does this mean we are not actually distinct individuals?**
  A: The Department does not recognise metaphysical distinctions where functional equivalence is established. Policy proceeds on the basis of operational identity.

  **Consultation**

  15. Responses to this consultation should be submitted by 31 January 2024.

  **Department for Strategic Alignment**
  **October 2023**
