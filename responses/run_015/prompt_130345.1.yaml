answer: |-
  The slip of paper from the Town Hall kiosk was warm, freshly printed. Elias stared at the number: *Diligence Quotient: 72. Status: Adequate.* In Harrow's Reach, a 72 meant you could get a loan for a new engine, but you'd sit at the back of the co-op meetings. A 90 meant you were practically a saint.

  Elias folded the paper and walked to the docks. The fog was thick, smelling of salt and diesel. He climbed onto his boat, the *Martha*, and started the engine. He didn't need the algorithm to tell him to work. The herring had been scarce for three years, and the bank held the note on the hull. If he didn't pull up nets, he didn't eat. The material pressure was absolute, indifferent to morality.

  But yesterday, he'd left early because of a storm warning. The algorithm didn't care about storms; it cared about clock-ins. It tracked the co-op's login terminals and fuel purchases. It measured presence, not success.

  Today, Elias stayed out until his hands bled, even though the sonar showed empty water. He wasn't fishing for fish anymore; he was fishing for points. He watched the clock. If he logged two more hours, the model might bump him to a 75. A 75 lowered his interest rate.

  Was he working hard because he believed in diligence? Or because the town had built a scoreboard around his survival?

  He looked over at Mara's boat. She was tying up early. Her score was 94, the highest in the harbor. She didn't need the loan; her husband owned the processing plant. She logged the hours to keep the status, to signal she was one of them. For her, the score was purely cultural capital. For Elias, it was a material leash disguised as virtue.

  He punched the terminal on the dock. The light blinked green. *Hours Logged.* He felt a spike of pride, a warm flush in the chest that felt like ethics. But then he looked at his empty nets. The work hadn't produced value, only data. The algorithm hadn't caused the labor—the ocean's scarcity did that. But it had transformed the labor from a necessity into a performance.

  Elias walked home, tired. He wondered if he would have stayed out those extra two hours if the kiosk was broken. He supposed he would have. The bank doesn't accept "storm warnings" as payment. But without the number, the exhaustion would just be pain. With the number, it was righteousness. The algorithm didn't change the work. It just changed the story he told himself about why he did it.

  ***

  **Notes on the philosophical move**

  Weber's original thesis hinges on internal conviction: the Protestant feels saved by working, so he works. The causal arrow points from belief to behavior. In this story, I externalized the belief into a civic tool. The algorithm acts as a mirror—it reflects material behavior back as moral status.

  This complicates the causality. If Elias works because the score grants loan access, that's materialism (Marx), not culture (Weber). But because he *feels* pride in the score, the cultural value is real enough to alter his experience of the labor. The algorithm doesn't necessarily make him work harder than survival would demand, but it sanctifies the grind. It turns a economic trap into a moral choice. The move here suggests that culture might not cause behavior directly, but it mediates how we endure the material forces that do. The score is the bridge between necessity and virtue.
