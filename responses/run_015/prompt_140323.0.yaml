answer: |-
  ### The Implicit Theory of Responsibility

  The institutional practice you describe operates on a hybrid theory that is conceptually unstable. Officially, it invokes a desert-based model: the human is blamed because they were negligent, implying they could have done otherwise. For this to hold, the condition of **alternative possibility** must be met—the human must have had a genuine opportunity to prevent the harm. However, the structural reality suggests a forward-looking accountability model. Here, blame is assigned not because the individual is morally culpable in a deep sense, but because assigning liability to them creates incentives for vigilance or provides a convenient sink for public outrage.

  Conceptually, it is settled that desert requires control. If the practice were purely desert-based, it would collapse whenever the human lacked effective control. Therefore, the practice *strictly presupposes* that the human had control, even if evidence suggests otherwise. However, it is contested whether institutions actually believe this or merely maintain the fiction for legal convenience. In your paper, you can state flatly that the practice *requires* the language of desert to function legally, but you should flag as contested whether regulators believe the desert conditions are actually met or if they accept this as a necessary regulatory fiction. The work is being done by the *appearance* of control, not necessarily its reality.

  ### Four Distinct Gaps

  You are correct to distinguish these gaps; conflating them obscures the specific failure modes. Conceptually, these are distinct conditions:
  1.  **Causal Contribution:** Did the human's intervention change the outcome?
  2.  **Control:** Could the human physically or procedurally intervene?
  3.  **Epistemic Access:** Did the human know intervention was needed?
  4.  **Authority:** Was the human permitted to override?

  The practice presupposes that all four are closed. It assumes the human *could* know, *could* act, *was allowed* to act, and that acting *would matter*. However, empirically, these often come apart. A supervisor may have authority and access but lack effective control due to system latency (a control gap without an authority gap). Alternatively, automation bias may close epistemic access even when information is displayed (an epistemic gap).

  It is conceptually settled that these are distinct logical conditions. However, claiming that specific industries routinely suffer from one gap versus another is an empirical claim. For a seminar paper, it is safe to argue that these gaps *can* come apart logically. It is riskier to assert that any specific incident involved a specific gap without detailed forensic evidence. There is not one responsibility gap here but several; remedies differ accordingly. Closing an epistemic gap requires better interfaces; closing a control gap requires slower system dynamics. Treating them as one leads to ineffective policy.

  ### Supervisory Smothering and Empirical Claims

  The phenomenon you call "supervisory smothering" rests on the claim that high reliability erodes the human capacity to intervene. This is the paradox of automation: the better the system works, the less the human practices, and the harder it is to notice when it fails.

  **Epistemic Status:** This relies heavily on contested empirical psychology. While "automation bias" and "skill fade" are well-documented phenomena in human factors engineering, the degree to which they render human oversight impossible varies by context. Some studies suggest training can mitigate vigilance decay; others suggest it is inevitable in high-reliability systems.

  In your paper, you should flag this as a strong empirical hypothesis rather than a philosophical truth. You can state flatly that *if* vigilance decays as reliability increases, the practice is self-defeating. However, asserting that this decay *always* occurs to a degree that negates responsibility is going out on a limb. The practice can be defended even if control is nominal, provided the justification is forward-looking (deterrence) rather than desert-based. If the goal is simply to ensure someone is paid to watch, even an imperfect watcher might be better than none. But if the goal is moral responsibility, the empirical claim about vigilance is fatal. You must distinguish whether the institution claims the human *is* effective (empirical claim) or merely that they *must be present* (normative claim).

  ### Coherence, Alternatives, and Selectivity

  The package is coherent only if it abandons desert. You cannot simultaneously demand genuine moral blameworthiness (which requires control) and assign blame where control is systematically eroded by design. This is a conflict between moral theory and regulatory pragmatism. The practice is philosophically underdetermined: a strict liability regime could justify the outcome (compensate victims) without the fiction of human negligence.

  If replaced by strict enterprise liability, the focus would shift from training humans to designing fail-safes. Procurement would demand proof of safety without human intervention, rather than proof of human oversight. If replaced by a design-first view forbidding deployment without genuine control, many current systems would be illegal.

  **Epistemic Status:** The claim that strict liability would change design incentives is a standard economic argument and safe to assert. The claim that some systems "should not be built" is a normative ethical stance, not a factual one.

  Finally, the selectivity of the practice presupposes that certain decisions require **moral agency** rather than mere optimization. We do not demand humans in the loop for grid load balancing because we view electricity distribution as a technical optimization problem. We demand humans for targeting or triage because we believe these decisions require moral judgment that algorithms cannot possess. This rests on the contested philosophical view that moral judgment is a distinct cognitive capacity unavailable to machines. You can state flatly that the selectivity *implies* this view, but you should flag as contested whether moral judgment is actually distinct from complex optimization or whether this is merely a comforting anthropocentric bias.

  \answer{The practice strictly presupposes that formal authority entails effective control.}
