  2.  **Deconstruct the Theoretical Conflict:**
      *   *Bearer-level theory:* Cultural traits spread because they benefit the individuals adopting them (fitness enhancement) or because of psychological biases (copy successful, copy majority, etc.). If a trait spreads, it must be good for the people or fit their psychology.
      *   *Meme-level theory:* Cultural traits spread because they are good at *getting copied*, regardless of whether they help the host. They can be parasitic.
      *   *The Challenge:* Create a scenario where a harmful trait spreads *not* because it looks good, *not* because it tricks people, *not* because it helps them, but because of the *structure of transmission*.
      *   *Key Mechanism:* Differential transmission rates based on network structure or timing, independent of content value.

  3.  **Brainstorming Scenarios:**
