answer: |-
  The dawn bell tolls over the harbor, and the boys waiting on the quay watch only the boats that haven't left. The old fishermen are split between the Bell-Ringers, who must wait for the third toll to launch their skiffs, and the Silents, who slip away in the dark to catch the first tide. Both groups teach the same nets and know the same grounds, but the Bell-Ringers are still tying up when the apprentices arrive, while the Silents are already specks on the horizon. The boys learn only what they can see; they copy the delay because the alternative is physically absent from the learning space. Within a generation, every boat waits for the bell, the prime tide is missed daily, and the village grows leaner on a ritual that offers no comfort, no status, and no lie—only a schedule that ensures its own observation at the cost of the fisherman's belly.

  **What each framing predicts and why**
  The bearer-level theory predicts the Silent practice must dominate or persist, because it directly increases caloric intake and survival fitness; if the Bell persists, a bearer theorist must posit a hidden benefit (e.g., social cohesion) that offsets the hunger. The meme-level prediction is that the Bell wins solely because it synchronizes the host's behavior with the observation window of the next generation, maximizing transmission fidelity regardless of host fitness.

  **What single feature is doing the work**
  *Differential Observability.* The trait modifies the host's physical presence during the transmission window, ensuring the rival variant is invisible to learners not by psychological preference, but by spatial exclusion.

  **What the case collapses into if I take that feature out**
  If apprentices learned by visiting boats at sea rather than waiting on the quay, the Silent variant would immediately regain parity, and the Bell would vanish due to its fitness cost.

  **The best line a bearer-level theorist would use to say I've only described a transmission bias in fancy language**
  "You haven't escaped the bearer's psychology; you've just described a frequency-dependent bias where visibility proxies for success, meaning the 'channel' is merely the input side of the very cognitive machinery we already model."
