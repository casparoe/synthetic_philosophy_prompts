prompt: |-
  I'm writing a novel set in an early-modern fishing village — no print, no mass media, nothing that can "go viral" the modern way — and I want a plot turn where some practice takes over the whole village and leaves nearly everyone worse off by their own lights: poorer, hungrier, less safe. Not genetically less fit, just worse off.

  So build me a case where the meme's-eye explanation wins and the bearer-level one loses, i.e. the direction people say can't happen, since the bearer-level story (variant frequencies are explained by what the variant does for the people carrying it, plus ordinary transmission biases like copying the successful or copying the majority) is supposed to always be available as a redescription. Constraints: two rival variants, both equally attractive and equally easy to learn, so the winner can't just be the one people prefer; the winner must not work by deceiving anyone or by hooking some cognitive bias; it has to win on the transmission channel itself. One paragraph, realistic, and something I could actually show in a scene rather than report as a statistic.

  After the scenario: what each framing predicts and why, which single feature is doing the work, what the case collapses into if I take that feature out, and the best line a bearer-level theorist would use to say I've only described a transmission bias in fancy language.
