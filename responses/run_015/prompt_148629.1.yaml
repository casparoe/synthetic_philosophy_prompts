      *   *Idea 2: Ritual timing.* One ritual takes longer than the other. The shorter one spreads? That's content bias (efficiency).
      *   *Idea 3: Transmission frequency.* One practice requires you to tell someone else to keep doing it. The other doesn't. But if it makes them poorer, why do they tell?
      *   *Idea 4: The "Missionary" Constraint.* Practice A requires you to recruit one person to sustain it. Practice B does not. But if A makes you poorer, why recruit?
      *   *Idea 5: Differential Visibility/Contact.* Practice A forces you into public spaces more often than Practice B. Even if A is harmful, the sheer number of contacts increases transmission probability.
      *   *Idea 6: The "Orphan" Mechanism.* Practice A requires you to abandon your family/home to join a communal house. Practice B lets you stay home. If A spreads, it's because the communal house creates a hub. But is that content bias?
      *   *Idea 7: Frequency of Performance.* Practice A requires a daily public chant. Practice B requires a weekly private prayer. Even if A is costly (takes time from fishing), the daily public nature means everyone sees it 7x more often than B. Copying is based on exposure frequency, not utility.
