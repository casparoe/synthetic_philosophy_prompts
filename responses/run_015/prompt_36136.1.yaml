prompt: |-
  I'm the research director for a constitutional reform commission in a mid-sized parliamentary democracy. The commission's mandate is to draft, within two years, a proposal for adding a sortition-based chamber to the legislature — a few hundred citizens selected by lot, most likely serving a single non-renewable term — alongside the existing elected chamber. We have money to commission roughly a dozen academic studies over the next eighteen months. My question is not whether sortition is a good idea, but which open questions we most need answered to produce a workable design, and in what order.

  Please rank the research questions you would have us fund, and defend the ordering. The open questions I'm already aware of include the following, but you should add others if you think they matter more:

  1. Self-selection. A lottery only delivers descriptive representativeness if the people drawn actually serve. If acceptance is voluntary and correlates with education, income, and civic engagement, the chamber is biased before deliberation begins. What compensation levels, duty framing (jury-style compulsion versus invitation), and opt-out designs best preserve the representativeness that is sortition's main selling point?

  2. Facilitation and agenda capture. Members serve briefly and cannot accumulate expertise, so professional staff, facilitators, and expert briefers may end up exercising the real power. Is there any institutional arrangement that secures informed judgment without a permanent unelected elite effectively doing the thinking for a rotating amateur membership?

  3. Mandate design. The chamber could hold binding legislative power, agenda-setting power only, or a veto over the elected chamber. How does each allocation make the other problems — capture, legitimacy, self-selection — better or worse?

  4. Term limits and professionalization. The anti-career-politician case for sortition assumes the one-term lottery member is a virtue. But does a chamber of perpetual amateurs merely relocate career-politician pathologies to whichever actors are permanent: staff, parties, the civil service?

  5. Legitimacy. Does a body nobody chose have the standing to make binding law, and does the answer change once citizens have lived experience with its output?

  For each item you would fund, explain what makes it upstream of the others, how tractable it is within eighteen months (e.g., through mini-public pilots, survey experiments, or natural experiments such as jury service), and what evidence would move it up or down your list. Equally important, tell me which of these you would deliberately refuse to fund, and why — either because the answer would not change the design, or because it is a question for political philosophers to argue about for the next thirty years rather than one the commission's timeline can resolve.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Role:** Research Director for a Constitutional Reform Commission.
      *   **Context:** Mid-sized parliamentary democracy, 2-year mandate to draft a proposal for a sortition-based chamber (hundreds of citizens, single non-renewable term) alongside an elected chamber.
      *   **Resources:** Funding for ~12 academic studies over 18 months.
      *   **Task:** Rank research questions to fund, defend the ordering, add new questions if necessary, explain upstream dependencies, tractability (18 months), and evidence criteria. Also, identify questions *not* to fund.
      *   **Constraint:** Do not debate *whether* sortition is good (mandate is already set). Focus on *workable design*.
      *   **Input Questions:** Self-selection, Facilitation/Agenda Capture, Mandate Design, Term Limits/Professionalization, Legitimacy.

  2.  **Initial Assessment of Input Questions:**
      *   *Self-selection:* Critical. If the chamber isn't representative, the whole model fails. High priority.
      *   *Facilitation/Capture:* Critical. If staff rule, it's a technocracy, not a citizen assembly. High priority.
      *   *Mandate Design:* Critical. Defines the power dynamics. High priority.
      *   *Term Limits:* Somewhat defined by the prompt (single non-renewable term), but the *implications* need study. Medium priority (more theoretical).
      *   *Legitimacy:* Important, but often a post-hoc justification. Hard to measure empirically in 18 months. Lower priority for *design*, higher for *marketing*.

  3.  **Identify Missing/Additional Questions:**
      *   *Interaction with Existing Legislature:* How does the elected lower/upper house react? Conflict? Gridlock? Collaboration? This is crucial for stability.
      *   *Logistics/Scale:* "A few hundred" is vague. 100? 500? Full time? Part time? This affects cost and feasibility.
      *   *Selection Algorithm:* Pure lot? Stratified lot? Quotas? This ties into self-selection but is distinct.
      *   *Deliberative Quality:* Can they actually understand complex bills? (Ties to facilitation).

  4.  **Determine Ordering Logic (The "Upstream" Logic):**
      *   To design the *Mandate* (Question 3), you need to know what the chamber is *capable* of doing (Questions 1 & 2).
      *   To know if it's *capable*, you need to know who is in it (Question 1) and how they are supported (Question 2).
      *   Therefore, Composition (Self-selection) and Process (Facilitation) are upstream of Power (Mandate).
      *   Legitimacy is downstream of all of the above (you can't measure legitimacy of a design that doesn't exist).
      *   Interaction with Elected Chamber is parallel to Mandate but essential for constitutional stability.

  5.  **Drafting the Research Agenda (Iterative Process):**

      *   *Priority 1: Composition (Self-Selection).* If you can't get a representative sample, stop. This is the foundation.
          *   *Study:* Field experiments on recruitment/compensation.
          *   *Tractability:* High (can use existing pools or mock lotteries).

      *   *Priority 2: Process (Facilitation/Capture).* If they are representative but manipulated, the output is flawed.
          *   *Study:* Comparative analysis of existing citizens' assemblies (Ireland, France, etc.) + controlled deliberation experiments.
          *   *Tractability:* Medium/High.

      *   *Priority 3: Institutional Interaction (New Question).* How does this new body fit with the Prime Minister/Parliament?
          *   *Study:* Game theory modeling + historical analogues (bicameral conflict).
          *   *Tractability:* Medium (theoretical/simulation).

      *   *Priority 4: Mandate/Power.* Now that we know who they are and how they work, what should they *do*?
          *   *Study:* Scenario planning on veto powers vs. advisory.
          *   *Tractability:* Medium.

      *   *Priority 5: Legitimacy.* Public perception.
          *   *Study:* Survey experiments.
          *   *Tractability:* High.

      *   *Refining the "Do Not Fund" List:*
          *   *Normative Legitimacy (Philosophical):* "Ought they have power?" is a philosophy question, not a design question.
          *   *Long-term Cultural Shift:* Will this change civic culture in 50 years? Too speculative for 18 months.
          *   *Pure Lot vs. Stratified:* This is a subset of Self-Selection, don't fund a separate study, bundle it.

  6.  **Developing the Argument for Each:**
      *   Need to be specific about *methods* (RCTs, pilots, comparative case studies).
      *   Need to explain *why* this order matters (e.g., don't design the veto power if you don't know if they will show up).
      *   Need to address the 18-month constraint.

  7.  **Review against Constraints:**
      *   *Mid-sized parliamentary democracy:* Implies party discipline is strong, executive is drawn from legislature. This makes the "Interaction" question vital.
      *   *12 studies:* I need to group these into ~5-6 research *themes* that encompass the 12 studies.
      *   *Tone:* Professional, strategic, actionable for a Research Director.

  8.  **Final Polish of the Ranking:**
      *   1. Recruitment & Retention (The "Who").
      *   2. Deliberative Infrastructure (The "How").
      *   3. Executive-Legislative Interface (The "Fit").
      *   4. Scope of Authority (The "What").
      *   5. Public Perception (The "Acceptance").

      *Wait, I need to check the "Term Limits" input.* The prompt says "most likely serving a single non-renewable term." So Question 4 in the prompt is partially settled. I should reframe it as "Support Structures" rather than term limits.

      *Wait, I need to check "Legitimacy".* The prompt asks about standing to make law. This is crucial for the *Mandate*. If the public rejects binding power, the mandate must be advisory. So Legitimacy is upstream of Mandate.
      *Correction:* Legitimacy (Public Acceptance) determines the *political feasibility* of the Mandate. But the *functional* Mandate depends on Capacity (Recruitment + Facilitation).
      *Decision:* Capacity (Recruitment/Facilitation) -> Political Feasibility (Legitimacy/Interaction) -> Formal Design (Mandate).

      *Let's refine the "Do Not Fund".*
      *   Philosophical legitimacy (Normative).
      *   Long-term civic culture effects.
      *   Pure electoral reform (out of scope).

  9.  **Structuring the Response:**
      *   Executive Summary.
      *   The Ranking (1-5).
      *   Detailed justification for each (Upstream logic, Tractability, Evidence).
      *   The "Do Not Fund" List.
      *   Closing advice.

  10. **Self-Correction during drafting:**
      *   *Critique:* Is 18 months enough for a pilot?
      *   *Fix:* Suggest *micro*-pilots or leveraging existing data from Ireland/France/Ostbelgien. Don't propose a full-scale national assembly pilot, that takes too long. Propose recruitment experiments and deliberation simulations.
      *   *Critique:* Is "Interaction" too theoretical?
      *   *Fix:* Focus on comparative constitutional analysis of bicameral conflicts in parliamentary systems.

  11. **Finalizing the Content:** (Mental check of the 12 studies allocation).
      *   Recruitment: 3 studies.
      *   Facilitation: 3 studies.
      *   Interaction/Mandate: 3 studies.
      *   Legitimacy: 2 studies.
      *   Logistics/Cost: 1 study.
      *   Total: 12. (I will weave this into the recommendations).

  12. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a high-stakes design challenge. You are not asking whether sortition is normatively desirable; you are asking how to build an engine that runs without seizing up or crashing the existing vehicle. In a parliamentary system, where executive power depends on the confidence of the elected legislature, introducing a non-elected chamber is a constitutional earthquake.

  Your 18-month timeline is tight. You cannot wait for longitudinal data. You must rely on **comparative institutional analysis**, **controlled simulations**, and **recruitment field experiments**.

  Here is the ranked research agenda, ordered by **dependency**. You cannot design the powers (Mandate) until you know the capacity (Recruitment/Facilitation), and you cannot propose the powers until you know the political constraints (Interaction/Legitimacy).

  ### 1. Recruitment and Retention Mechanics (The "Who")
  **Priority:** Critical / Upstream
  **Allocated Studies:** 3
  **Input Question:** Self-selection (Your #1)

  **Rationale:** This is the foundational constraint. If the chamber is demographically skewed (e.g., over-representing the retired, the affluent, or the ideologically extreme), the rest of the design is moot. A biased sortition chamber is worse than an elected one because it lacks the accountability mechanism to correct the bias. You need to know the "yield rate" of a lottery and the cost to fix it before you decide how big the chamber should be or what powers it holds.

  **Tractability (18 Months):** High.
  *   **Study A (Field Experiment):** Partner with a statistical agency to run a mock lottery on a national registry sample. Test different "asks" (summons vs. invitation), compensation levels (GDP per capita vs. average wage), and employer protection mandates. Measure acceptance rates across demographic quintiles.
  *   **Study B (Attrition Analysis):** Analyze data from existing long-term citizens' assemblies (e.g., France's *Convention Citoyenne pour le Climat*, Ostbelgien's Permanent Citizens' Council). Quantify dropout rates and correlate them with session length and complexity.
  *   **Study C (Stratification Modeling):** Model the statistical trade-offs of pure lot vs. stratified lot (quotas). Determine the minimum sample size needed to achieve 95% confidence on key demographics (age, region, education) given the attrition rates found in Study B.

  **Evidence to Move Up/Down:** If Study A shows that >40% of working-age citizens refuse service regardless of compensation, the design must shift from a full legislative chamber to a smaller, advisory body. This would fundamentally alter the Mandate (Question 3).

  ### 2. Deliberative Infrastructure and Staffing (The "How")
  **Priority:** Critical / Upstream
  **Allocated Studies:** 3
  **Input Question:** Facilitation and Agenda Capture (Your #2) & Term Limits (Your #4)

  **Rationale:** In a parliamentary system, legislation is technical. If your "amateur" chamber cannot understand the bills, they will rubber-stamp staff recommendations. This creates a "staffocracy." You need to design the *interface* between permanent civil servants and rotating citizens. This is upstream of Mandate because a chamber that cannot process complex budget bills cannot be given budgetary powers.

  **Tractability (18 Months):** Medium-High.
  *   **Study D (Process Audit):** Comparative analysis of secretariat structures in Ireland, France, and Oregon Citizens' Initiative Review. Who hired the experts? Who wrote the summaries? Was there adversarial briefing (pro/con teams)?
  *   **Study E (Simulation):** Run a 3-day mini-public on a technical topic (e.g., tax code simplification). Vary the briefing materials (neutral vs. advocacy) and measure the divergence between member recommendations and expert consensus.
  *   **Study F (Cognitive Load):** Psychological study on information retention in laypeople over 6-12 month terms. Determine the maximum "bill load" a member can process without heuristic reliance on party cues or staff.

  **Evidence to Move Up/Down:** If Study E shows that neutral facilitation is impossible on polarized topics without external arbitration, you may need to fund a permanent, non-partisan "Office of Parliamentary Counsel" for the new chamber, increasing costs and complexity.

  ### 3. Executive-Legislative Interface (New Question)
  **Priority:** High / Parallel
  **Allocated Studies:** 2
  **Input Question:** None (This is the critical missing piece for a parliamentary system)

  **Rationale:** In presidential systems, gridlock is a feature. In parliamentary systems, gridlock causes government collapse. If the sortition chamber vetoes a budget, does the Prime Minister resign? If the sortition chamber passes a law the elected chamber rejects, who wins? You need to model the conflict points. This is distinct from "Mandate" because it focuses on *collision*, not just *authority*.

  **Tractability (18 Months):** Medium (Theoretical/Comparative).
  *   **Study G (Constitutional Modeling):** Game-theoretic modeling of bicameral conflict in parliamentary systems (e.g., Australia's Senate vs. House, pre-1911 UK Lords). Simulate scenarios where the sortition chamber opposes the governing majority.
  *   **Study H (Stakeholder Mapping):** Interviews with current MPs, party whips, and union leaders. Gauge the likelihood of "workarounds." If the elected chamber feels threatened, will they simply ignore the sortition chamber's output or defund it?

  **Evidence to Move Up/Down:** If Study G suggests a high probability of constitutional crisis (e.g., inability to pass supply bills), you must recommend a "suspensive veto" (can delay but not block) rather than an absolute veto.

  ### 4. Scope of Authority and Mandate (The "What")
  **Priority:** Medium / Downstream
  **Allocated Studies:** 2
  **Input Question:** Mandate Design (Your #3)

  **Rationale:** Now that you know who will serve (1), how they will work (2), and how they will clash with the government (3), you can assign powers. This research should focus on *categorization*. Should they handle moral/ethical issues (abortion, euthanasia) where elected members face pressure, or budgetary issues where they face complexity?

  **Tractability (18 Months):** High.
  *   **Study I (Policy Domain Analysis):** Review areas where elected bodies systematically underperform (e.g., long-term infrastructure, gerrymandering, ethical standards). Match these against the cognitive load findings from Study F.
  *   **Study J (Legislative Workflow):** Map the current legislative pipeline. Identify the "choke points" where a sortition chamber could insert review (e.g., pre-enactment review vs. post-enactment audit).

  **Evidence to Move Up/Down:** If Study I shows that "ethical issues" are actually the most polarized and least amenable to deliberation, you should steer the mandate toward regulatory oversight or long-term planning instead.

  ### 5. Public Perception and Legitimacy (The "Acceptance")
  **Priority:** Low / Downstream
  **Allocated Studies:** 2
  **Input Question:** Legitimacy (Your #5)

  **Rationale:** I rank this lower not because it is unimportant, but because legitimacy is an *output* of design, not an *input*. You cannot survey people on whether they accept a sortition chamber until you can tell them *what it does*. However, you need to test the "branding." Is it a "House of Citizens"? A "Second Chamber"? Does "lottery" sound frivolous to voters?

  **Tractability (18 Months):** High.
  *   **Study K (Survey Experiment):** Test public trust in laws passed by "Randomly Selected Citizens" vs. "Elected Representatives" vs. "Experts," varying the policy domain (taxes vs. rights).
  *   **Study L (Longitudinal Tracking):** Monitor media sentiment and public polling in jurisdictions that have recently implemented citizens' assemblies (e.g., Scotland, France). Does support decay after the media cycle ends?

  **Evidence to Move Up/Down:** If Study K shows a sharp drop in legitimacy when the chamber has *binding* power vs. *advisory* power, you must recommend a ratification step (e.g., sortition proposes, elected chamber approves, or referendum).

  ---

  ### Questions I Would Deliberately Refuse to Fund

  As Research Director, you must protect the commission from "black holes"—questions that consume resources but yield no actionable design specifications within the timeline.

  **1. Normative Political Philosophy (The "Ought" Question)**
  *   **The Question:** "Is it morally justifiable to impose law on citizens who did not consent to be rulers?"
  *   **Why Refuse:** This is a debate for political philosophers over 30 years, not a design commission over 18 months. Your mandate *presumes* the moral justification is sufficient. Funding this invites ideological stalemate.
  *   **Alternative:** Fund Study K (Public Perception) instead. You care about *sociological* legitimacy (will people accept it?), not *philosophical* legitimacy (is it right?).

  **2. Long-Term Civic Culture Effects**
  *   **The Question:** "Will this chamber increase overall civic engagement and trust in democracy over the next 20 years?"
  *   **Why Refuse:** This is unmeasurable in 18 months. Any study claiming to predict 20-year cultural shifts is speculative modeling at best. It distracts from the immediate engineering problem of making the chamber function.
  *   **Alternative:** Focus on Study B (Attrition) and Study F (Cognitive Load). Ensure the current members don't hate the experience; that is the only cultural data point you can capture in time.

  **3. Pure Electoral Reform Synergies**
  *   **The Question:** "Should we simultaneously change the electoral system for the lower house to PR to accommodate the sortition chamber?"
  *   **Why Refuse:** Scope creep. You are mandated to design the sortition chamber. Linking it to electoral reform for the existing house doubles the political complexity and guarantees the proposal will die in parliament.
  *   **Alternative:** Fund Study G (Constitutional Modeling) to see how the sortition chamber functions *under the current electoral rules*. Design for the reality you have, not the reality you wish for.

  ### Summary of Strategy

  Your commission's risk is not that the idea is unpopular, but that the design is **unworkable**.

  1.  **Months 1-6:** Focus entirely on **Recruitment (1)** and **Infrastructure (2)**. If you can't get the people or keep them independent, stop.
  2.  **Months 7-12:** Focus on **Interface (3)** and **Mandate (4)**. Define the boundaries of power to prevent constitutional crisis.
  3.  **Months 13-18:** Focus on **Legitimacy (5)** and **Drafting**. Polish the proposal for public consumption based on the survey data.

  By funding the "plumbing" before the "powers," you ensure that when you propose a veto or a binding vote, you have the empirical evidence to prove the chamber is robust enough to wield it.
