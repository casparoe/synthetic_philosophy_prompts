answer: |-
  Here is the session plan. It is designed to be 90 minutes, sharp, and devoid of academic jargon.

  ### 1. The Prerequisite Idea (The Hook)
  **Concept:** *"The Archive is Fuel, Not Terrain."*
  Before you introduce Nietzsche's three modes, you must land this idea: **Research exists to be burned, not inhabited.**
  Writers think research is the ground they walk on. You need them to understand that research is the wood in the furnace. If you stop to admire the wood, the fire goes out. The story is the heat; the research is what disappears to create it. If the research remains visible, the story is cold.

  ### 2. The Carrying Example
  **Novel:** **Gustave Flaubert's *Salammbô* (1862).**
  **Why:** It is the canonical example of a masterpiece that suffocated under its own archival weight. Flaubert traveled to Carthage, read every excavation report, and obsessed over the material culture to "resurrect" the past.
  **Properties it MUST Have:**
  *   **Archeological Precision:** Descriptions of clothing, temples, and rituals that are historically verified.
  *   **Reverence:** A tone that treats the setting as holy and untouchable.
  *   **Static Spectacle:** Scenes where the camera pans over objects rather than following desire.
  **Properties it MUST Lack:**
  *   **Psychological Interiority:** The characters feel like mannequins wearing the research.
  *   **Narrative Urgency:** The plot halts for descriptions of necklaces or temple architecture.
  *   **Present-Tense Stakes:** The reader feels they are visiting a museum, not living a crisis.

  ### 3. The Arc & Misconception Management
  Do not lecture on the definitions first. Introduce the modes as **three ways a writer gets killed by their own research.**

  **Phase 1: The Monumental Trap (Minutes 15–30)**
  *   **Craft Definition:** Writing to mimic "Great Books" or "Great Men." Using history to justify epic scale over human intimacy.
  *   **The Misconception:** *"Monumental means writing an epic saga."*
  *   **Where to Head It Off:** Immediately when introducing the mode.
  *   **Correction:** "Monumental isn't about word count; it's about **imitation**. It's when you force your character to be a Hero because History says they should be, rather than letting them be a person. It chokes the story by demanding the present live up to a glorified past."

  **Phase 2: The Antiquarian Trap (Minutes 30–60)**
  *   **Craft Definition:** Writing to preserve. The fear of getting it wrong overrides the need to make it feel real.
  *   **The Misconception:** *"Antiquarian just means I did my homework and have accurate details."*
  *   **Where to Head It Off:** As you show the *Salammbô* excerpts.
  *   **Correction:** "Accuracy is neutral. Antiquarianism is **reverence**. It's when you love the teacup more than the poison in it. If you cannot cut a historically accurate scene because it slows the pace, you are being antiquarian. You are preserving the corpse instead of animating the body."

  **Phase 3: The Critical Trap (Minutes 60–75)**
  *   **Craft Definition:** Writing to judge. Using the story to put the past on trial to free the present.
  *   **The Misconception:** *"Critical means writing revisionist fiction or political commentary."*
  *   **Where to Head It Off:** Just before the closing exercise. This is the most dangerous misunderstanding.
  *   **Correction:** "Critical history isn't about correcting the record for the reader. It's about **condemning the past to save the character**. It is violent. It requires the character to look at their heritage, their trauma, or their 'truth' and say, 'This is useless to me now, so I will destroy it.' It is not about politics; it is about survival."

  ### 4. What to Openly Refuse to Explain
  **The Refusal:** *"I will not explain the Philology."*
  **Say This:** "Nietzsche wrote this in 1874 to critique German academic culture and the unification of Germany. I do not care about that. I do not care about the German word *Historie* vs. *Geschichte*. I do not care about his biography. We are not studying philosophy. We are studying triage. If you ask me about the historical context of the essay, I will not answer. We are only talking about the page in front of you."

  ### 5. The End Question (The Proof of Understanding)
  To prove they understand that Critical History destroys the *present self* (not just the past record), ask them this:

  **"What specific memory does your protagonist treat as 'sacred truth' at the start of the book, that they must publicly denounce as a lie in order to take action in the climax?"**

  *   *Why this works:* If they answer with a plot point about the world (e.g., "The King is actually dead"), they haven't understood. If they answer with an internal identity (e.g., "She must admit her father wasn't a hero, he was a coward, or she can't pull the trigger"), they understand that Critical History is an act of self-mutilation for the sake of life.
