          *   *Let's go with James Michener's *Centennial*.* It is the epitome of Antiquarian history choking the narrative life.
          *   *Properties:* Needs massive detail (Antiquarian), needs to feel like a tribute to the place (Reverence), lacks urgent character agency (Life).

