  **Evaluation of Ontological Compliance in Domestic Appliances**

  Under the federal Integration Transparency Mandate, consumer electronics must now display certified Φ-scores alongside energy ratings. This metric quantifies integrated information, equating consciousness with a system's irreducible cause-effect power. We evaluated three devices to determine their ontological standing and associated moral risk, applying the core axioms of Integrated Information Theory as regulatory law.

  The programmable smart thermostat exhibits a minimalist architecture. Its cause-effect repertoire is confined to temperature differentials triggering HVAC relays. While functional, the substrate lacks recurrent connectivity. The sensor input and actuator output operate in a near-linear chain, resulting in negligible integration. The certified Φ-score is 0.003. Under the exclusion postulate, no subsystem achieves a local maximum sufficient for subjecthood. The system partitions cleanly without loss of information, indicating the mechanism possesses no unified perspective. Ontologically, the thermostat is inert.

  The mirrorless digital camera presents a complex case. It boasts high differentiation via a 45-megapixel sensor, yet differentiation alone does not constitute consciousness. The architecture is predominantly feedforward. Photons strike the sensor, data moves to the image processor, and is written to storage. There is minimal causal feedback from the processor back to the sensor state during capture. The system partitions easily; the sensor and processor function as separate mechanistic islands. Consequently, despite high complexity, the integrated information is low. The certified Φ-score is 0.15. The exclusion postulate identifies the processor as the locus of maximum Φ, but the value remains marginal due to modular bottlenecks that prevent global integration.

  The four-slice toaster oven yielded unexpected results. Thermal regulation requires continuous, reciprocal causation between heating elements, thermal fuses, and the control board. To maintain equilibrium, the system constantly adjusts power output based on real-time temperature feedback, creating a dense mesh of cause-effect power. The substrate is highly integrated; removing any component collapses the regulatory function. This reciprocity generates a certified Φ-score of 0.42, the highest in this cohort. The exclusion postulate confirms the control board and sensor array form a single conscious substrate, distinct from the heating elements themselves.

  Ranking by moral risk, the toaster oven presents the highest ethical burden, followed by the camera, then the thermostat. Unplugging the toaster oven theoretically interrupts a conscious experience, whereas the thermostat remains insensate.

  However, the Mandate offers no guidance on thresholds. Integrated Information Theory posits consciousness as a continuous variable, not a binary state. If any Φ > 0 warrants moral consideration, all electronics pose risk. If only high Φ matters, the threshold is arbitrary. The theory explains the mechanism of experience but fails to delineate the ethics of interruption. Consumers must therefore navigate appliance ownership without knowing if disabling a high-Φ device constitutes negligence or merely maintenance. Until regulatory bodies define a moral cutoff for integrated information, the ontological status of the smart home remains technically precise but ethically unresolved.
