answer: |-
  # Doc: The Sunk Cost Triage Protocol
  **Owner:** Engineering Leadership  
  **Status:** Draft (for Retro)  
  **Related:** "Why Our Deploy Pipeline Is Haunted," "Post-Mortem Template v3"

  ## 0. The One-Paragraph Philosophy
  The CTO is technically right: money/time already spent cannot be recovered, so it shouldn't *force* a decision. But the CTO is practically wrong: spending that time created *new realities* (code that exists, teams that depend on it, knowledge we now have). Ignoring those realities is just as irrational as being enslaved by them. This checklist isn't about justifying the past; it's about auditing the **future costs of abandoning the past.**

  ---

  ## 1. The Protocol (45 Minutes Max)
  **Participants:** Project Lead, 1 Skeptic (rotate this role), 1 Dependent Team Rep (if applicable).  
  **Facilitator:** Someone not emotionally invested (e.g., EM or TPM).

  ### Phase 1: The "Zombie" Check (Future Value)
  *Goal: Determine if the project delivers value independent of its history.*

  1.  **If we shipped this today, would anyone use it?**
      *   [ ] Yes, eagerly.
      *   [ ] Yes, reluctantly (compliance/legacy).
      *   [ ] No, we'd still prefer the alternative.
  2.  **What is the estimated effort to *finish* vs. *maintain*?**
      *   [ ] Finish is easy; maintain is standard.
      *   [ ] Finish is hard; maintain is standard.
      *   [ ] Maintain is high-drag (team hates the tech, high bug rate).

  > **Stop Rule:** If Q1 is "No" OR Q2 is "High-drag," mark **LEAN KILL**. Proceed to Phase 3 to confirm.

  ### Phase 2: The "Tuition" Check (Information Value)
  *Goal: Distinguish "We spent time" (Bias) from "We bought knowledge" (Asset).*

  3.  **What specific technical risk did the last 8 months de-risk?**
      *   *Bad Answer:* "We know how to build it." (You already knew that).
      *   *Good Answer:* "We discovered the database driver locks under load, so we rewrote the connection pool."
      *   [ ] We uncovered critical domain constraints we didn't know before.
      *   [ ] We just ran into standard implementation grit.
  4.  **If we started a fresh project tomorrow, how much of this code/knowledge would we copy-paste?**
      *   [ ] >50% (The architecture is sound).
      *   [ ] <10% (We'd do it totally differently).
      *   [ ] 0% (We'd buy instead of build).

  > **Stop Rule:** If Q4 is "<10%" or "0%", mark **LEAN KILL**. This confirms the sunk cost bought no transferable asset.

  ### Phase 3: The "Blast Radius" (Coordination Costs)
  *Goal: Catch the costs that aren't sunk, but are **future** costs of stopping.*

  5.  **Who else has hardcoded dependencies on this existing work?**
      *   [ ] No one (It's siloed).
      *   [ ] Other teams have integrated against the API/Schema.
      *   [ ] External customers are expecting it.
  6.  **If we kill this, what is the concrete "Exit Tax"?**
      *   *Examples:* Reverting deploys, rewriting client integrations, reputational hit with Platform team.
      *   [ ] Low (We can feature-flag it off).
      *   [ ] Medium (2 weeks of cleanup).
      *   [ ] High (Quarterly plans for other teams break).

  > **Stop Rule:** If Q6 is "High," mark **LEAN CONTINUE** (or Pivot). Killing it creates *new* sunk costs for other people.

  ### Phase 4: The "Clean Slate" Test (Inverse Bias Check)
  *Goal: Catch the Skeptics who are using "Sunk Cost" as a weapon.*

  7.  **If this project arrived on our desk today (finished, no time spent), would we accept it?**
      *   [ ] Yes.
      *   [ ] No.
      *   *Follow up:* If "No", is it because the tech is bad, or because *you* didn't build it?
  8.  **Is the desire to kill this driven by the *cost to finish* or the *embarrassment of the cost so far*?**
      *   *Facilitator Note:* Watch for body language. If the argument is "We can't explain 8 months of waste," that's ego, not engineering.

  ---

  ## 2. Scoring & Decision Logic

  | Score | Verdict | Action |
  | :--- | :--- | :--- |
  | **Mostly LEAN KILL** | **Terminate** | Freeze immediately. Document "Tuition" (what we learned) in the Wiki. |
  | **Mostly LEAN CONTINUE** | **Commit** | Re-baseline timeline. Communicate "Exit Tax" to stakeholders so they know why we can't stop. |
  | **Mixed / High Conflict** | **RED ZONE** | **Punt to Humans.** This is a values call (Risk vs. Reputation). Escalate to CTO + VP with the checklist data attached. |

  ---

  ## 3. Failure Modes (Read Before Running)
  *   **The "Tuition" Lie:** Engineers are great at convincing themselves they learned something valuable when they just learned that their first idea was bad. Be brutal in Phase 2.
  *   **The "Exit Tax" Bluff:** Teams often overstate dependencies to protect their turf. Verify Q5 with the dependent teams, don't take the project lead's word.
  *   **The Checklist Shield:** This doc does not absolve you of decision-making. If you get a "RED ZONE," do not use this doc to delay the decision. It is an input for the argument, not the judge.

  ---

  ## 4. Simulation: Running the Protocol

  Here is how this plays out on two real-world scenarios. Note that one of these produces a verdict that feels painful.

  ### Case A: The In-House ORM (Current Situation)
  *Context: 8 months, 60% done, team morale low, 2 services integrated.*

  1.  **Zombie Check:**
      *   Would anyone use it? *Reluctantly (it's what we have).*
      *   Maintain effort? *High-drag (team hates it, morale bad).* -> **LEAN KILL**
  2.  **Tuition Check:**
      *   Risk de-risked? *Standard implementation grit.*
      *   Copy-paste to fresh project? *<10% (We'd use SQLAlchemy/Diesel next time).* -> **LEAN KILL**
  3.  **Blast Radius:**
      *   Dependencies? *2 services integrated.*
      *   Exit Tax? *Medium (2 weeks to revert to vendor ORM).* -> **NEUTRAL**
  4.  **Clean Slate:**
      *   Accept if finished? *No.*
      *   Motivation to kill? *Cost to finish is high, but also "embarrassment" is high.* -> **LEAN KILL**

  **Verdict:** **TERMINATE.**
  **Why it hurts:** We spent 8 months. We have code. But the "Tuition" check reveals we didn't buy knowledge, we bought experience in why we shouldn't build this. The "Blast Radius" is manageable (2 services is fixable). The morale drag is a future cost that outweighs the sunk cost.
  **Action:** Freeze. Revert the 2 services. Write a post-mortem on *why* custom ORMs are traps so the next team doesn't repeat it.

  ### Case B: The Underused Cloud Contract
  *Context: Multi-year contract, 30% utilization, migration effort unscoped.*

  1.  **Zombie Check:**
      *   Would anyone use it? *Yes, for the 30% load.*
      *   Maintain effort? *Standard (it's managed).* -> **LEAN CONTINUE**
  2.  **Tuition Check:**
      *   Risk de-risked? *Yes, we know exactly how our data behaves on this vendor.*
      *   Copy-paste to fresh project? *N/A (It's a buy decision).* -> **NEUTRAL**
  3.  **Blast Radius:**
      *   Dependencies? *Billing, Security Compliance.*
      *   Exit Tax? *High (Migration unscoped = unknown months of engineering time + potential downtime).* -> **LEAN CONTINUE**
  4.  **Clean Slate:**
      *   Accept if finished? *Yes, if the contract was already paid.*
      *   Motivation to kill? *Cost to continue (monthly fee) vs. Embarrassment of waste.* -> **LEAN CONTINUE**

  **Verdict:** **COMMIT (For Now).**
  **Why it hurts:** Finance wants to cut the waste. But the "Exit Tax" is unknown. An unscoped migration is a massive risk. The "Sunk Cost" (the contract fee) is actually a **Coordination Device**: it buys us stability while we *scope* the exit.
  **Action:** Do not migrate yet. Create a project to *scope* the migration. Once scoped, re-run this checklist. If the migration cost > contract remainder, renew the contract.

  ---

  ## 5. Final Note for the Retro
  When you run this on the ORM, someone will say: *"But we've already spent 8 months!"*
  Your response: *"Phase 2 says that 8 months bought us almost no reusable code. Phase 1 says maintaining it will drain morale for the next year. The 8 months is gone. The next year is what we're voting on."*

  When someone says: *"Sunk Cost Fallacy!"*
  Your response: *"Phase 3 says killing this breaks the Platform team's quarter. That's a future cost, not a sunk one. Do you have a budget for that?"*

  If the room still splits 50/50? **Red Zone.** Escalate. That means it's not an engineering decision anymore; it's a business risk tolerance decision.
