      *   **Secondary Fault Line:** **(4)** vs. **(6)**.
          *   (6) assigns sharp 1/2 to unknown bias coin.
          *   (4) requires calibration. For an *unknown* bias coin, before tossing, is there a calibration class? If it's "any coin," the frequency is undefined. If it's "this coin," the frequency is unknown.
          *   If (4) is strict, (6) should be imprecise.
      *   **Load-Bearing Commitment:** **(4)** is the outlier. It is a strong verificationist/frequentist constraint that clashes with the epistemic/symmetry-based reasoning in (1), (3), and (6). (1) relies on symmetry, (3) relies on symmetry, (6) relies on a default epistemic stance (1/2 for heads). (4) demands *frequencies*.
