answer: |-
  A regional intensive care network faces a lethal, airborne nosocomial pathogen during a winter surge. Transmission risk is objective and severe; staff interdependence is total; digital monitoring perfectly records protocol deviations regarding mask seals, hand hygiene, and entry logs; enforcers are competent, well-intentioned, and sanctions are certain for any breach. However, preventing superspreading events depends on staff voluntarily reporting their own minor breaches or subtle symptoms immediately, so contacts can be traced before symptoms manifest. Under a tight regime, shared norms are strong but any reported breach triggers automatic suspension, so staff conceal minor slips until a cluster emerges. Under a loose regime, norms remain equally strong but sanctions are waived for self-disclosure, enabling early containment. Averting the threat depends on discretionary, situation-specific judgement and/or on frontline people volunteering unwelcome information; codified strict norms plus certain sanctioning degrade exactly that signal.

  (a) The threat-coordination functionalism compares expected outcomes: tightness yields high recorded compliance but latent transmission due to hidden errors, whereas looseness yields lower recorded compliance but interrupted chains of infection. Since the metric is survival rather than audit scores, functionalism mandates loosening sanctions to secure the information flow required for coordination. (b) The rule-of-law view holds that discretionary waivers undermine generality and predictability, creating unchannelled discretion. To ensure equal treatment and avoid arbitrariness, rules must be codified and enforced uniformly regardless of consequence. This standpoint recommends tightening, prioritising procedural justice over consequentialist evasion. (c) The expressive view argues sanctions signal distrust, crowding out intrinsic professional duty. However, strong norms still express collective commitment. The verdict splits: maintain normative strength to signal shared purpose, but remove punitive severity to avoid displacing voluntary cooperation.

  The single feature doing the work is the necessity of *voluntary disclosure of private negative information*. If sensors automatically detected every breach without human reporting, the informational asymmetry would vanish; the case would collapse back to standard high-threat tightness, as hiding becomes impossible and uniform compliance maximises safety. The legibility theorist replies that clarity does not entail severity: one can codify a rule ('report breaches') with a safe harbour ('no sanction for disclosure'). This concedes that tightness theory conflates norm strength with sanction severity. The framework must admit that rules can be clear yet enforcement lenient, distinguishing the *content* of the rule from the *cost* of violation. The case fails if empirical evidence shows staff report errors regardless of sanctions due to strong professional ethics, rendering the incentive structure irrelevant. It also risks smuggling in a utilitarian preference for safety over procedural regularity, which the legibility view rejects. The behavioural premise—that rational agents will hide errors to avoid punishment—could be contested if shame or altruism outweighs fear of sanction, or if the culture is sufficiently tight that deviation induces internal guilt regardless of external penalty. If agents are not sanction-sensitive in this way, the functionalist argument for loosening loses its leverage.
