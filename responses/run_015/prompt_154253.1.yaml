answer: |-
  ### Part 1: Brainstorming Two Mechanics

  Before settling on the design, here are two distinct mechanical approaches to modeling the tension between instrumentalist prediction (Friedman) and representational accuracy (Subgroup harm).

  **Option A: "The Map-Maker's Dilemma" (Spatial/Navigation)**
  *   **Mechanic:** Teams are given a blurred map of a terrain with hidden obstacles. They must draw a route for a convoy.
  *   **Friedman Aspect:** Team "Straight-Line" ignores terrain features (hills, swamps) and draws straight lines. Surprisingly, the "terrain" is generated such that the obstacles cancel out on average, so their travel time predictions are accurate.
  *   **Subgroup Aspect:** Hidden on the map are "Bridge Zones" used only by light vehicles (the subgroup). The Straight-Line team's route destroys the bridges. They predict total arrival time correctly, but the light vehicles never arrive.
  *   **Why I rejected it:** It requires too much visual setup and explanation of the "terrain generation." It risks becoming a puzzle about map-reading rather than a philosophical tension about modeling assumptions.

  **Option B: "The Forecasting Wager" (Probabilistic/Resource)**
  *   **Mechanic:** Teams bid points on infection forecasts using dice. One team uses a single die (Aggregate), the other uses three dice (Stratified).
  *   **Friedman Aspect:** The single die is calibrated to match the *sum* of the three dice on average. It is computationally cheaper and less noisy for the total count.
  *   **Subgroup Aspect:** One of the three dice is "loaded" to roll high occasionally (the vulnerable subgroup). The single die smooths this out. If the payoff structure rewards saving the vulnerable subgroup specifically, the single die fails despite good aggregate accuracy.
  *   **Why I picked it:** It mirrors your epidemiology argument directly. It uses standard seminar materials (dice, paper). The tension is mathematical and immediate, forcing students to feel the "gut" confidence of the accurate aggregate prediction before pulling the rug out with the subgroup requirement.

  ---

  ### Part 2: The Activity Design — "The Forecasting Wager"

  **Concept:** Students act as modeling teams competing for government contracts. They must predict infection rates to allocate vaccines.
  **Class Size:** 8 Students.
  **Grouping:** 4 Teams of 2 students.
  *   **Teams 1 & 2 (Parsimonious):** Use the "Aggregate Model" (1 Die).
  *   **Teams 3 & 4 (Stratified):** Use the "Complex Model" (3 Dice).
  **Materials:**
  *   10 Six-Sided Dice (D6).
  *   40 Index Cards (prepared in advance, see "Instructor Truth Deck").
  *   4 Score Sheets (printed or drawn on board).
  *   Poker chips or paper slips for "Budget Points" (50 per team).

  #### The Models (The Assumptions)
  *   **The Aggregate Model (Teams 1 & 2):** Assumes the population is homogeneous.
      *   *Mechanic:* Roll **1 Die**. The result $\times$ 10 = Predicted Total Infections.
      *   *Cost:* 5 Budget Points per round.
  *   **The Stratified Model (Teams 3 & 4):** Assumes the population has 3 distinct sub-networks.
      *   *Mechanic:* Roll **3 Dice**. Sum the dice $\times$ 10 = Predicted Total Infections. (Each die represents a subgroup: 1=Low Risk, 2=Med Risk, 3=High Risk).
      *   *Cost:* 15 Budget Points per round (complexity costs resources).

  #### The Reality (The Truth Deck)
  *   **Instructor Prep:** Create a deck of 5 "Reality Cards."
  *   **The Trick:** The Total Infections on the cards should align closely with the *average* of 1 Die (3.5 $\times$ 10 = 35), but the *Subgroup Breakdown* on the cards must show that Subgroup 3 is consistently underserved by the average.
  *   **Card Format:**
      *   Total Infections: (e.g., 40)
      *   Subgroup 1: (e.g., 5)
      *   Subgroup 2: (e.g., 5)
      *   Subgroup 3: (e.g., 30)
  *   *(Note: The math below ensures the Aggregate Model wins on Total Accuracy initially, but the Stratified Model is required to see Subgroup 3).*

  #### The Payoff Scheme
  *   **Round 1 & 2 (The Friedman Phase):** Points awarded for **Total Accuracy** only.
      *   Within $\pm$10 cases: +20 Points.
      *   Within $\pm$20 cases: +10 Points.
  *   **Round 3, 4, & 5 (The Subgroup Phase):** Points awarded for **Total Accuracy** AND **Subgroup 3 Protection**.
      *   Total Accuracy: Same as above.
      *   Subgroup 3 Accuracy: If you predicted Subgroup 3 infections within $\pm$5 cases: +50 Points. (This is the "Ethical/Policy" bonus).
      *   *Crucial Rule:* Aggregate Teams *cannot* predict Subgroup 3. They physically lack the dice. They can only guess the Total.

  ---

  ### Part 3: Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Silence**
  *   Divide class into 4 teams of 2.
  *   Hand out dice and score sheets.
  *   **Rule:** "You are competing for a contract. You have 50 Budget Points. Each round costs points to run your model. You earn Contract Points for accuracy. Do not discuss strategy with other teams."
  *   **No lecture on Friedman.** Do not explain *why* the models differ. Let them discover the constraints.

  **00:05 – 00:20: Rounds 1 & 2 (Aggregate Focus)**
  *   **Action:** Teams pay budget cost. Roll their dice to generate a prediction. Write it down.
  *   **Reveal:** Instructor draws Reality Card 1 & 2. Announces **Total Infections** only. (Do not reveal subgroup data yet).
  *   **Scoring:** Teams calculate accuracy based on Total.
  *   **Expected Outcome:** Teams 1 & 2 (1 Die) will likely have tighter accuracy on the Total because the Reality Cards are tuned to the 1-Die average. Teams 3 & 4 (3 Dice) will suffer from "variance noise"—their sum will swing wider (3 to 18 range vs 1 to 6 range).
  *   **Gut Check:** Teams 1 & 2 feel confident. Their "false" assumption (homogeneity) is working.

  **00:20 – 00:25: The Pivot**
  *   Instructor announces: "New Policy Directive. The government has identified a high-mortality cluster (Subgroup 3). Future contracts require specific protection plans for this cluster."
  *   Reveal the **Subgroup Data** from Rounds 1 & 2 retroactively.
  *   **Observation:** Teams 3 & 4 realize their dice *represented* Subgroups 1, 2, and 3. Teams 1 & 2 realize their single die *erased* that distinction.

  **00:25 – 00:50: Rounds 3, 4, & 5 (Subgroup Focus)**
  *   **Action:** Teams predict again.
  *   **Scoring:** Now, the +50 Point Bonus for Subgroup 3 accuracy is active.
  *   **The Trap:** Teams 1 & 2 (Aggregate) *cannot* win the bonus. They can still win on Total Accuracy (which they might still do well on), but they cannot access the big points.
  *   **The Tension:** Teams 3 & 4 (Stratified) might still be worse at predicting the *Total* (due to variance), but they are the only ones who can save Subgroup 3.
  *   **Dynamic:** Watch Teams 1 & 2 protest. "But our Total prediction was better!" Watch Teams 3 & 4 struggle with the noise of 3 dice but grasp the subgroup trend.

  **00:50 – 01:15: The Debrief (The Most Important Part)**
  *   **Step 1: The Scoreboard.** Who won? (Likely a split: Aggregate won Rounds 1-2, Stratified won Rounds 3-5).
  *   **Step 2: Map to Friedman.** Ask Teams 1 & 2: "In Round 1, your assumption (1 die = whole population) was false. The population was actually 3 groups. Did it matter?"
      *   *Target Insight:* No, it didn't matter for the *goal* of Total Prediction. This is the F-Twist. The unrealistic assumption was instrumentally valid.
  *   **Step 3: Map to Reverse F-Twist.** Ask Teams 3 & 4: "Your model was 'truer.' Did it perform better?"
      *   *Target Insight:* Not on the Total. It was noisier. But it was the *only* one that could see the crisis in Subgroup 3.
  *   **Step 4: The Normative Shift.** "When did the goal of science change?"
      *   *Target Insight:* In Round 1, the goal was *Prediction*. In Round 3, the goal became *Intervention/Justice*. Friedman's defense holds for prediction, but collapses when the model itself dictates resource distribution.

  ---

  ### Part 4: Predictable Failure Modes

  1.  **Dice Luck Overrides Design:**
      *   *Risk:* In Round 1, the 3-Dice teams might get lucky and beat the 1-Dice teams on Total Accuracy purely by chance, muddying the "Friedman works" lesson.
      *   *Mitigation:* As the Instructor, you hold the "Truth Deck." Do not make the Reality random. **Hard-code the Reality Cards.**
      *   *Instruction:* Make sure Reality Card Totals are 30, 40, 30, 40, 30. (Average 34).
      *   1-Die Average is 35. (Close match).
      *   3-Die Average is 35, but Standard Deviation is much higher.
      *   *Better:* Don't let the 3-Dice teams roll for *prediction*. Let them roll to *simulate the model's output*, but compare both against your fixed Truth Deck. Actually, to ensure the lesson lands, **you** should generate the "Reality" numbers, and the students generate "Predictions."
      *   *Correction:* Have students roll dice to generate their *Prediction*. You reveal fixed *Reality*. If 3-Dice teams get unlucky, acknowledge it: "This is the cost of complexity—variance."

  2.  **Students Treat it as Pure Math:**
      *   *Risk:* They focus entirely on optimizing the dice odds and ignore the "Subgroup" narrative.
      *   *Mitigation:* During the Debrief, refuse to talk about probability math. Only talk about *assumptions*. "What did the 1-Die assume about the people inside the population?"

  3.  **Time Creep in Scoring:**
      *   *Risk:* Calculating points takes too long.
      *   *Mitigation:* Put a giant score table on the whiteboard. You (the instructor) act as the "Bank." Teams shout their error margin; you assign points immediately. Keep the pace brisk.

  ---

  ### Part 5: What This Activity Cannot Teach (The "Lecture Gap")

  You must supply these three points verbally in the debrief, as the game mechanics cannot reproduce them:

  1.  **The Political Economy of Modeling:**
      *   *Game Limit:* The game implies the "Subgroup Bonus" appears magically via policy change.
      *   *Lecture Point:* In reality, vulnerable subgroups often lack the political power to trigger that "Policy Directive." The "Reverse F-Twist" isn't just an epistemic problem; it's a political one. The Aggregate model persists not because it's better, but because the people hidden by it don't have a seat at the table.

  2.  **Data Scarcity vs. Assumption Choice:**
      *   *Game Limit:* Students have perfect information about the model structure (they know they have 1 die vs 3 dice).
      *   *Lecture Point:* In real science (like your epidemiology argument), we often *don't know* if the population is heterogeneous. We choose the Simple Model because we lack data to parameterize the Complex one. Friedman's defense is often a shield against data scarcity, not just a philosophical stance.

  3.  **The "As-If" Methodology Nuance:**
      *   *Game Limit:* The game shows the assumption is *false* (1 die $\neq$ 3 groups).
      *   *Lecture Point:* Friedman argues we shouldn't even *ask* if the assumption is true or false. The game proves it is false. You need to explain that Friedman would say, "It doesn't matter that the population isn't homogeneous, it matters that they act *as if* they are." The game proves the *consequence* of the falsehood, but not the *methodological indifference* Friedman advocated.

  ### Instructor Truth Deck (Prep this on Index Cards)

  *   **Card 1:** Total: 35 | Sub 1: 5 | Sub 2: 5 | Sub 3: 25
  *   **Card 2:** Total: 35 | Sub 1: 5 | Sub 2: 5 | Sub 3: 25
  *   **Card 3:** Total: 35 | Sub 1: 5 | Sub 2: 5 | Sub 3: 25
  *   **Card 4:** Total: 35 | Sub 1: 5 | Sub 2: 5 | Sub 3: 25
  *   **Card 5:** Total: 35 | Sub 1: 5 | Sub 2: 5 | Sub 3: 25

  *Note: By keeping the Total constant at 35, the 1-Die team (Avg 3.5 $\times$ 10 = 35) will look like geniuses in Rounds 1-2. The 3-Dice team will swing wildly around 35. But in Rounds 3-5, the 1-Die team cannot explain why Sub 3 is always 25. They will predict Total 35, implying an average of 11 per subgroup, leaving Sub 3 critically under-protected.*
