prompt: |-
  You're an expert in philosophy of science and active-learning design — think carefully and start by brainstorming two very different mechanics (not just variations on the same game) before you pick one and flesh it out.

  I'm prepping a grad seminar — 8 students, 75 min — and this came up for me personally last week after a weird argument with a friend in epidemiology about COVID forecasting. I realized I understand Friedman's F-twist intellectually but don't feel it in my gut, so I want an in-class game that makes students experience why unrealistic assumptions can still be okay for prediction. At the same time I want them to feel the counter-pressure from something I'll call teh "reverse F-twist for subgroups" — a situation I just made up where stripping away social-network complexity makes the aggregate prediction better but completely hides a vulnerable subgroup that only the realistic model catches. The rules and incentives should generate that tension themselves; no lecture up front.

  Design a runnable activity: assign specific roles/teams, give clear rules and materials (index cards, dice, a simple score sheet), and use a point-based payoff scheme — no real money. Include a minute-by-minute timeline for 75 minutes. The debrief should map specific moments in the game onto Friedman's original claim and onto my invented subgroup twist. Tell me what will predictibly go wrong the first time I run it, and be honest about which feature of the idea — maybe the epistemic value of false assumptions, maybe the normative weight of representational harm — the activity can't reproduce and I'll have to supply in words. Don't give me citations or a reading list; I want something a model without web access could build from knowledge alone.
