      *   *The Objection (The "Slow Mind" Problem):* If a system takes 40 years to process a recognition task, can it be said to "recognize" anything in the moment? Does it have phenomenal consciousness?
      *   *Real-Time Causal Powers:* The argument that to interact with the world (and thus have intentional content), a system must operate on a timescale compatible with that world.
