answer: |-
  1. Steel-man of the view I'm challenging
  The standard Keynesian view posits that solving scarcity frees humanity for higher pursuits. Your sharpened view argues abundance removes the external scaffolding necessary for psychological stability. Because human cognition is evolutionarily adapted for scarcity-resolution, removing necessity triggers anxiety and passive consumption rather than flourishing. Wise leisure is not a default human state but a niche skill dependent on pre-existing cultural capital and temperament. Thus, post-scarcity society stratifies not by wealth, but by the capacity to generate endogenous meaning without economic coercion.

  2. Decisive defeaters: evidence or arguments that should genuinely overturn it
  Three lines of evidence challenge this. First, retirement and unemployment data do not show universal collapse. While some suffer loss of identity, meta-analyses indicate many retirees maintain well-being through caregiving, volunteering, or hobbies, suggesting meaning-making is more adaptable than your model allows. Second, Universal Basic Income trials (e.g., Finland, Stockton) typically show reduced stress and increased time for education and family, not merely passive consumption. Participants often pursue meaningful projects once survival anxiety is removed. Third, anthropological data on hunter-gatherers (e.g., the !Kung) demonstrates societies with significant leisure time who generated robust non-work meaning through ritual and social bonding without elite cultural capital. Finally, evolutionary psychology recognizes play and exploration as adaptive traits, not just scarcity-response mechanisms. If humans were solely scarcity-adapted, high-energy play would be selected against. Our capacity for autotelic experience suggests the architecture for leisure is innate, not just a cultural artifact. Lottery winner studies (Brickman et al.) show a return to baseline happiness, not necessarily pathological decline, indicating hedonic adaptation works both ways.

  3. Merely awkward evidence: what forces qualification but not abandonment
  However, evidence exists that forces qualification. Status competition does intensify in abundance, shifting from survival to positional goods, supporting your claim about status games. Additionally, the removal of structured time does correlate with increased anxiety for those lacking strong community ties, validating the "structural scaffolding" point. The awkwardness lies in the mechanism: is it evolutionary cognition or socialization? Data shows that those with higher education (cultural capital) navigate retirement better, but education also builds social networks. This conflates temperament with opportunity. Your view holds if you concede that flourishing is possible but unevenly distributed, rather than biologically blocked for the majority. The "motivational collapse" is real for some, but likely a failure of social infrastructure rather than fixed cognitive architecture. The distinction between "education failure" and "cognitive feature" is empirically blurry; neuroplasticity suggests the brain adapts to abundance if given social permission.

  4. Insulation check: whether this has been qualified into unfalsifiability, and whether that is a problem
  There is a risk of unfalsifiability. If every instance of post-scarcity flourishing is attributed to hidden "cultural capital" or "right temperament," the theory becomes tautological. "Cultural capital" must be defined independently of outcomes (e.g., specific upbringing, education levels) before testing. If someone without these markers flourishes in abundance, the view must concede. This insulation is problematic because it risks becoming an ideological shield for inequality, suggesting the masses are cognitively unfit for freedom. A robust theory must specify conditions under which non-elite individuals successfully transition to leisure, rather than assuming failure as the default. Without clear criteria, the argument protects itself from counter-evidence by redefining success markers post-hoc.

  5. Bottom line: an honest assessment of how exposed the view actually is
  Your premise on Keynes is largely accurate regarding the psychological difficulty, though the evolutionary layer is your extrapolation. The view is plausible but overly deterministic. It underestimates human adaptability and the role of community structures versus individual capital. It is exposed to falsification by UBI outcomes and anthropological counterexamples. While the risk of motivational collapse is real, framing it as a fixed cognitive limitation rather than a social design challenge weakens the argument.
