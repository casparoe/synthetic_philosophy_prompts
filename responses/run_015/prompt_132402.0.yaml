answer: |-
  Good morning. It is a privilege to welcome you to this workshop.

  Looking around the room, I see a split that is rare and valuable. On one side, colleagues who spend their days thinking about how minds work, how logic holds, and how intelligence might be formalized. On the other, colleagues who spend their days wrestling with apparatus, noise, and the stubbornness of matter. And scattered among you are family members and junior colleagues who are here mostly to support us, and perhaps to see what all the fuss is about.

  To the philosophers: I am an amateur in your house. I have read the texts, but I have never taught them. To the scientists: I am one of you, though my hands are now still. And to everyone: I want to talk about the title of this gathering. "What We Leave Out When We Reason."

  For forty years, I ran long-term experiments in high-energy physics. My life was defined by the question of relevance. When you are measuring a decay rate that takes weeks to capture, the world is full of things that could interfere. The temperature of the room. The vibration of a truck passing on the highway. The phase of the moon. The political climate in the capital.

  In the philosophy of artificial intelligence, there is a famous difficulty known as the Frame Problem. I understand it this way, and I invite correction if I have softened it too much: It is the problem of representing change without having to explicitly list every single thing that *does not* change. If a robot moves a block from A to B, how does it know that the color of the block didn't change, that the wall didn't fall down, and that the price of tea in China remained constant? If you have to write a rule for every non-effect, the system collapses under the weight of its own triviality.

  I know that in your field, there are sophisticated ways to handle this. I have read about successor-state axioms and non-monotonic logics. These are formal tools designed to allow a system to assume inertia—that things stay the same unless acted upon—without enumerating the universe. It is a solution built on representation. It is a solution built in the mind, or in the code.

  But I want to suggest that this is not how a working scientist solves the problem.

  In the laboratory, we do not solve the Frame Problem by enumeration. We do not solve it by logic. We solve it by what I would like to call "domain locking."

  Let me explain what I mean by that. When I designed an experiment, I did not ask my team to logically prove that the vibration of a passing truck was irrelevant to our data. We did not write an axiom that said, "Truck vibration does not affect particle decay." Instead, we built a foundation. We put the apparatus on a concrete slab isolated from the floor. We put it in a vacuum chamber. We shielded it from magnetic fields.

  We physically stabilized the background. We created a closed world, not by defining it logically, but by brick, mortar, steel, and feedback loops. We "locked" the domain. Within that locked domain, we could assume that the background conditions were constant. Not because we had proven they were irrelevant, but because we had made them so.

  This is a crucial distinction. In formal AI, the Frame Problem is a crisis of *knowledge*. How can the agent know what to ignore? In experimental science, the Frame Problem is a crisis of *design*. How can we build a situation where nothing else matters?

  For the philosophers here, this might look like I am begging the question. You might say, "But who locked the lock? Who decided which variables to stabilize? Doesn't that decision itself require solving the Frame Problem?"

  It does. And that is where the tension lies.

  When I was in the lab, I never felt I was solving a logical puzzle about inertia. I felt I was carving out a niche in reality where inertia could be trusted. I was not building a general reasoner. I was building a specific context. A particle accelerator is not a universal environment; it is a highly curated exception to the chaos of the world.

  This suggests to me that we might be talking past one another.

  The goal of much AI research, as I understand it, is to create an agent that can reason effectively in an open world. An agent that can walk into a kitchen it has never seen and make coffee without knocking over the cat. This requires a general solution to the Frame Problem. It requires a mind that can carry its context with it.

  But the goal of experimental science is often to eliminate the need for that kind of general reasoning. We want to make the world simple enough that a very narrow reasoning tool will work. We offload the cognitive burden onto the environment. We don't ask the scientist to reason about the air pressure; we put the experiment in a pressure-controlled room.

  So, here is the puzzle I want to leave with you, and the question I hope this workshop will tackle.

  If human scientific reasoning depends on "domain locking"—on the ability to physically or socially stabilize the background conditions—then what happens when we try to model that reasoning without the lock?

  When we write logic for an AI, we are often trying to capture the reasoning process in the abstract, stripped of the laboratory, stripped of the social norms of the research group, stripped of the physical isolation of the apparatus. We are trying to formalize the thought without the scaffold that makes the thought possible.

  Is it possible that the Frame Problem is not a bug in reasoning, but a feature of un-locked environments? Is it possible that "general intelligence" is a category error, and that all effective reasoning is actually local, dependent on a stabilized domain that the reasoner did not create, but inherited?

  For the scientists in the room: You know this feeling. You know that your results are only as good as your controls. You know that if the background shifts, your logic fails. You practice domain locking every day.

  For the philosophers: You know that without a solution to the Frame Problem, the system cannot act. You are trying to find the rules that allow action in a world that refuses to stay still.

  My suspicion is that these are not the same problem. One is a problem of *representation*. The other is a problem of *regulation*.

  If I am right, then a purely logical solution to the Frame Problem might be mathematically elegant, but it might be biologically and physically incomplete. It might be that we do not reason our way out of the Frame Problem. We build our way out. We construct environments—whether they are laboratories, or languages, or social institutions—that hold the world still long enough for us to think.

  This workshop is titled "What We Leave Out When We Reason." I propose that what we leave out is not just irrelevant data. What we leave out is the responsibility for the stability of the world itself. We assume the world will hold still. The scientist enforces this assumption with steel. The philosopher tries to justify it with syntax. The AI tries to simulate it with code.

  Are we building a mind that can reason in the wild? Or are we trying to build a wild that a mind can reason in?

  I do not have the answer. I spent my career measuring particles, not concepts. But I have watched enough experiments fail because of a background shift I didn't anticipate to know that the stability of the frame is not a given. It is an achievement.

  So, for the next two days, I invite you to lean into this tension. Do not let the philosophers retreat entirely into the logic. Do not let the scientists retreat entirely into the pragmatics. Ask each other: Is the Frame Problem a hurdle to be jumped by a clever algorithm? Or is it a signal that reasoning is fundamentally embodied, embedded, and dependent on a world we have tacitly locked into place?

  If we can clarify that distinction, we will have done more than just define a problem. We might understand what it costs to think at all.

  Thank you.
