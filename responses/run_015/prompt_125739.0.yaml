answer: |-
  In the history of social science, few propositions carry the burden of the Malthusian hypothesis. The claim that population, if unchecked, grows geometrically while subsistence grows only arithmetically implies an inevitable convergence on misery. Two centuries on, global population has expanded vastly without the predicted universal destitution. The central philosophical problem is not whether the prediction failed empirically—it clearly did within the expected window—but how we classify that failure. Is the hypothesis falsified, or merely right-but-early? This distinction matters less for Malthus than for the methodology of long-run prediction. If every failed prophecy can be rescued by positing a temporary mask, theory becomes immune to evidence. This essay establishes a criterion for admissible defences, tests it against a separate case, and delivers a determinate verdict on the Malthusian claim.

  To evaluate the "right-but-early" defence, one must first disambiguate the variants bundled under that label. Four distinct strategies emerge. First, *defence by deferral* asserts the mechanism is intact and only the timing was wrong. This is the weakest form, as it renders the theory unfalsifiable by allowing infinite postponement. Second, *defence by screening* concedes the mechanism is masked by a countervailing force of unusual magnitude, such as a technological shock, but argues the mechanism would reassert itself were that force withdrawn. Third, *defence by re-scaling* argues the mechanism never bound at the level of whole economies over long horizons but does bind locally or over short intervals. This changes the domain of the theory rather than delaying the outcome. Finally, *defence by re-description* quietly rewrites the theory so the central quantity is no longer income per head pinned near subsistence but something weaker, such as an occasionally binding ecological ceiling.

  Legitimacy varies across these types. Deferral is epistemically bankrupt; it offers no new information. Re-description is often a retreat into vagueness, sacrificing the original predictive precision. Re-scaling is legitimate only if the theory is explicitly reformulated as a local constraint rather than a global law. Screening is the most robust candidate for a genuine "right-but-early" claim, but it invites the cheapness objection. If any failure can be explained by positing an unspecified masking variable, the defence is merely rhetorical.

  To confront this, we require a general criterion for when a screening defence is admissible. A "right-but-early" claim is earned only if the masking variable is identified independently of the failure it explains, and its transience is predicted without reference to the theory's survival. Specifically, the defence requires the theory to have independently predicted something it was not designed to explain, or for the masking force to be identifiable as transient by external standards. Mere consistency with later history is insufficient; the rescue must entail risk. If the masking force is permanent, the theory is falsified. If the masking force is identified only after the fact to save the theory, the defence is ad hoc. The criterion demands that the condition for the mechanism's reassertion be specifiable in advance, or at least identifiable without circular reliance on the theory's own terms.

  We must test this criterion for over- and under-fitting by applying it to another long-run prediction. Consider the mid-twentieth-century hypothesis regarding resource depletion, which argued that exponential consumption of finite geological stocks would lead to economic collapse within a century. This prediction failed to materialise within the expected window. Proponents often utilise a screening defence: technological innovation in extraction (such as hydraulic fracturing) masked the scarcity, but the finite nature of the resource remains.

  Applying the criterion: Was the masking variable (technology) identified independently? Generally, no; it was invoked post-hoc to explain the non-collapse. Was the transience of the mask predicted? Rarely. The defence usually rests on the logical truth that resources are finite, not on a specific prediction of when extraction costs would overwhelm innovation. Consequently, the criterion convicts this hypothesis of being falsified in its original strong form. Does this convict everything? Not necessarily. Had the theorists predicted a specific technological threshold that would delay collapse by a calculable amount, the defence would pass. Since they did not, the criterion correctly identifies this as a case of immunisation rather than genuine delay. This suggests the criterion is not overly harsh; it distinguishes between a theory that accommodates data and one that risks prediction. However, if the criterion were applied to a case like continental drift before the discovery of plate tectonics, it might falsely convict a true theory simply because the masking mechanism (the driving force) was unknown. To repair this, the criterion must allow that the masking force need not be fully understood, provided its existence is inferred from independent evidence, not merely from the failure of the prediction itself. With this repair, the criterion remains strict but fair.

  Returning to Malthus with this refined criterion, we can now render a verdict. The Malthusian hypothesis posits a biological constraint on population growth mediated by food production. The screening defence argues that the Industrial Revolution and subsequent agricultural technologies acted as a temporary mask, lifting subsistence above the population trap. Is this mask identifiable independently? Yes, the energy density of fossil fuels is an external fact. Is it transient? Yes, fossil fuels are finite. However, does the theory predict the conditions under which the mechanism reasserts itself? Here the defence falters. The original hypothesis relied on land constraints, not energy constraints. To argue that the mechanism will return requires shifting the bottleneck from arable land to energy, which slips into *defence by re-description*. The original theory did not predict that energy substitution would occur, nor did it predict that the binding constraint would shift from calories to carbon.

  Furthermore, the "right-but-early" defence requires that the mechanism be intact. Yet, the relationship between income and fertility has inverted in developed economies, contradicting the core Malthusian mechanism that higher subsistence leads to higher population growth. This is not a masking; it is a structural change in the mechanism itself. The screening defence fails because the mask (technology) did not merely delay the inevitable; it altered the behavioural rules governing the variables. The criterion demands that the masking force be separable from the mechanism. In the Malthusian case, the technological shock changed the function linking subsistence to reproduction.

  Therefore, the verdict must be determinate. The Malthusian hypothesis, as originally stated regarding geometric population growth and arithmetic subsistence growth binding globally, should be filed as falsified. The screening defence fails the criterion because the masking force was not independently predicted as transient in a way that preserves the original mechanism, and the mechanism itself has demonstrably changed behaviour in the presence of the mask. The *defence by re-scaling* holds some water—Malthusian traps do appear in localised ecological collapses—but this admits the global theory was wrong. The *defence by re-description* survives only by weakening the claim to "resources are finite," which is trivially true but lacks the specific predictive power of the original hypothesis.

  We must not confuse a surviving insight with a surviving theory. The insight that exponential growth cannot persist in a finite system is robust. The theory that this constraint would manifest via population misery binding near subsistence by the nineteenth or twentieth century is not. To classify it as "right-but-early" is to grant a rhetorical licence that insulates the theory from the very evidence that should constrain it. The masking force of innovation was not a temporary delay accounted for by the theory; it was a fundamental variable the theory omitted. When a theory omits the primary driver of the phenomenon it seeks to predict, it is not early; it is incorrect.

  In conclusion, reasoning about long-run predictions requires rigour against the temptation of retrospective rescue. The criterion established here—independent identification of the masking variable and preservation of the original mechanism—filters out ad hoc defences. Applied to the resource depletion hypothesis, it correctly identifies weak screening claims. Applied to Malthus, it demonstrates that the hypothesis fails not merely on timing, but on mechanism. The verdict is falsification. The Malthusian hypothesis belongs in the history of ideas as a profound error that stimulated correct questions, rather than in the catalogue of scientific theories awaiting their moment of vindication. To treat it otherwise is to misunderstand how scientific knowledge progresses: not by preserving failed maps because the territory might eventually look like them, but by drawing new maps that account for the terrain we actually inhabit.
