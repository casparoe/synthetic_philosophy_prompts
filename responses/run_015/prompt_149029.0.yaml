answer: |-
  Here are eight interview questions designed for your philosophy podcast. They are sequenced to build upon one another, starting with the core of her argument and moving toward its broader implications.

  Per your request, Questions 2, 3, and 4 include specific follow-ups designed to challenge her likely appeal to "training rather than argument."

  ### **Segment 1: The Core Argument**

  **1. The Category Mistake**
  "You argue that Carroll's Tortoise reveals a category mistake: we treat *modus ponens* as if it needs a propositional premise, when it actually relies on normative acceptance conditions learned in linguistic practice. Could you unpack what it means to say that deduction is a 'practice' rather than a 'chain of reasons'? If I accept 'A' and 'If A then B,' what exactly am I doing when I move to 'B' if I am not applying a rule?"

  ### **Segment 2: Technical Comparisons and Challenges**

  **2. Proof-Theoretic Semantics**
  "Your view sounds similar to proof-theoretic semantics, which claims that inference rules *define* logical constants rather than describing reality. Is your position that *modus ponens* is constitutive of what 'if' means, or is it a normative norm we impose on language? If it's constitutive, does that mean someone who rejects *modus ponens* is simply speaking a different language, rather than making a logical error?"

  *   **Follow-up (Keyed to 'Training'):** "If you reply that they are just speaking a different language because acceptance conditions are acquired through training, doesn't that make logical necessity contingent on how we happened to be trained? If a community was trained to affirm the consequent, would their logic be 'valid' within their practice, or is there a sense in which they are objectively wrong despite their training?"

  **3. Distinguishing Valid from Invalid**
  "This leads to a problem of distinction. If logical validity rests on normative practices rather than propositional justification, how do you distinguish a valid inference like *modus ponens* from an invalid one like affirming the consequent without tacitly invoking the very logical principles you say need no backing? If the only answer is 'this is how we do it,' what prevents logic from collapsing into mere habit?"

  *   **Follow-up (Keyed to 'Training'):** "You will likely say that we are trained to recognize the difference. But training explains how we *acquire* the habit, not why the habit is *correct*. If I point out that my training leads to contradictions and yours doesn't, aren't I appealing to a propositional standard (non-contradiction) that your view claims is secondary to practice?"

  **4. The Nature of Deductive Error**
  "Related to that, how does your view explain deductive error? If logic is about following learned acceptance conditions, is making a logical mistake just a deviation from social norms, like a faux pas? If so, is the person who makes a logical error irrational, or are they just playing a different game?"

  *   **Follow-up (Keyed to 'Training'):** "If you argue that they are irrational because they failed to master the training, this seems to shift the problem from logic to psychology. Does this mean that a perfect logician is just someone with very robust conditioning? If so, how do we account for the *normative force* of logic—the feeling that we *ought* to conclude B, not just that we *are conditioned* to?"

  ### **Segment 3: Scaling the View**

  **5. Nested Conditionals and Complexity**
  "Let's test the limits of this 'procedural competence.' In simple cases like *modus ponens*, linguistic practice seems clear. But in complex nested conditionals or higher-order logic, our linguistic intuitions often fail, and we rely on explicit propositional derivations. If our practice runs out, does your view imply we cannot reason about these cases, or must we admit that at some level, propositional justification *is* required?"

  **6. Mathematical Induction**
  "Consider mathematical induction. It seems to rely on a structural insight into numbers that goes beyond ordinary linguistic training. Can your normative-practice account explain why we accept induction as valid? Or does mathematics suggest that some logical principles are grounded in the nature of the objects we study, rather than just the linguistic rules we acquire through childhood training?"

  ### **Segment 4: Implications and Conclusion**

  **7. The Role of Philosophy**
  "If your distinction between procedural competence and propositional justification holds, it seems to make the job of a logician or philosopher quite strange. We spend our careers writing propositions to justify what you say cannot be justified propositionally. Is philosophical logic essentially deceptive? Are we trying to say what can only be shown through practice?"

  **8. The Scope of Rational Norms**
  "Finally, if Carroll's Tortoise shows that logical norms rest on ungrounded practices, does this generalize to *all* rational norms? Does this mean that scientific reasoning or even ethical obligations also rest on 'brute' practices that cannot be argued for? If so, is your view a form of skepticism about reason, or a pragmatic acceptance of how human rationality actually works?"
