          *   It's potentially ill-defined ELK regarding "Real Belief" (if you can't distinguish it, does it matter?). But for alignment, it matters instrumentally.

  6.  **Refining the Vocabulary (Self-Correction/Polishing):**
      *   *Check:* Did I assume causality? *Correction:* Explicitly note that LVMs often assume $\theta \rightarrow Y$, but ELK worries about $Y \leftarrow \text{HumanSim} \rightarrow \theta$.
      *   *Check:* Did I assume error independence? *Correction:* Highlight the strategic error correlation.
      *   *Check:* Anchor items in free-form? *Correction:* Suggest "adversarial queries" or "known-fact queries" as anchors.
      *   *Check:* Proper Scoring Rules? *Correction:* Note that PSR elicits *reported* probability, not necessarily *internal* probability if the utility function is misaligned.

  7.  **Final Review against User Constraints:**
      *   "Don't smuggle in assumptions... and announce that the worry dissolves." -> *Must ensure I don't say "Just use DIF" and stop. Must explain why DIF fails without ground truth.*
      *   "Tell me explicitly where you had to add something." -> *Use bolding or explicit notes.*
