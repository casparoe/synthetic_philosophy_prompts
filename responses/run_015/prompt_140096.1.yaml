      *   *Distorted Translations:*
          *   "Real Belief" $\rightarrow$ In Psychometrics, $\theta$ is defined *by* the model. In ELK, $\theta$ is ontologically prior to the model (the bits in the weights). This is the "Realist vs. Instrumentalist" clash.
          *   Identifiability $\rightarrow$ In Psychometrics, we assume the model is identified. In ELK, the worry is that *no amount of calibration data* identifies the target latent because of the "Human Simulator" confounder.
      *   *Non-Translatable (The Residue):*
