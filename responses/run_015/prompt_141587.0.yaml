          *   *Dismissal:* Dismiss the idea that content *must* track truth independently of utility.
      *   **Deep Dive into Case 3 (The Lucky Net):**
          *   This is the "Swampman without the intuition pump."
          *   If the view says "No content," it conflicts with the user's pre-theoretic intuition.
          *   If the view says "Yes content" via gradient descent, does it overgenerate? (e.g., does a thermostat have content? Does a rock rolling downhill have content?)
          *   *Decisive Empirical Finding:* If cognitive science shows learning is *not* selection-like (e.g., pure constraint satisfaction without variation/retention), teleosemantics loses its grip on acquired content.
      *   **Deep Dive into Case 4 (Compositionality):**
          *   Acknowledge the "Promissory Note."
          *   Mention attempts (Shea, Price, Millikan's input systems).
          *   *Prediction:* Teleosemantics predicts systematicity arises from biological modularity, not logical syntax.
      *   **Unfalsifiability/Schema Charge:**
          *   Is it just "fill in your favorite selection process"?
          *   It risks this if "selection-shaped" is too broad.
          *   *Defense:* It's a structural claim about *dependence*, not a specific causal story.
          *   *Defect?* For a metaphysical theory, some schema-like quality is necessary. For a scientific theory, it's a bug.
      *   **Comparison with Rivals:**
          *   *Informational:* Teleosemantics handles error better.
          *   *Functional Role:* Teleosemantics handles externalism better.
          *   *Interpretivism:* Teleosemantics is more realist.
          *   *Structural:* Teleosemantics explains *why* the structure maps.
      *   **Conclusion:** Address the user's specific worry (Indeterminacy + Truth). Argue that this is the hinge point.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just repeat standard Neander/Millikan defenses. The user knows them. I need to evaluate *whether those defenses hold water* against the specific "Lucky Net" and "Disjunctive" cases.
      *   *Emphasis:* The user is worried about *Indeterminacy*. I need to highlight where teleosemantics *creates* indeterminacy (e.g., defining the "relevant environment" for selection) vs. where it solves it (error).
      *   *Case 3 Nuance:* The "Lucky Net" is crucial. If the user accepts teleosemantics as a *general* account, this case breaks it. If they restrict it to biological systems, it survives but loses scope. I need to press this dichotomy.
      *   *Case 1 Nuance:* The "Fire-or-Shadow" issue is actually about the *Grain* of content. Teleosemantics fixes the grain by the grain of selection. If selection is coarse, content is coarse. Is that a bug? Maybe not. But if selection is indifferent between "Fire" and "Fire-Indicator," that's the real indeterminacy.

