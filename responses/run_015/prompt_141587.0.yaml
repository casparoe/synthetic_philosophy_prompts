answer: |-
  This is a rigorous stress test. You have correctly identified that the contemporary teleosemantic project has shifted from defending the *possibility* of naturalization (where Swampman ruled) to defending the *precision* of naturalization (where indeterminacy and scope rule). Since you are unpersuaded by Swampman intuitions, we can bypass the "history is essential" debate and focus on whether the specific history teleosemantics invokes actually *determines* content in the way required.

  Here is the map of exposure for your view, ranked from fatal to awkward, followed by the assessment of empirical stakes, rival predictions, and the schema charge.

  ### I. Ranking the Defeaters

  **1. Fatal: The Indeterminacy of the "Normal Condition" (Case 1)**
  *   **The Risk:** You identify the core vulnerability: selection optimizes for fitness payoffs, not truth conditions. If a mechanism is selected because it fires at $A \lor B \lor C$ (where $A$ is the target, but $B$ and $C$ are cheap false positives), teleosemantics struggles to privilege $A$ as the content without smuggling in a notion of "what the organism *takes* it to be," which begs the question.
  *   **Concede or Dismiss?** **Concede.** You must concede that if the selection history itself is compatible with multiple, non-equivalent content assignments (e.g., *Fire* vs. *Fire-or-Shadow*), the view yields indeterminacy. You cannot dismiss this as a rival's assumption because teleosemantics claims to *solve* indeterminacy via history. If the history is coarse, the content is coarse.
  *   **Why Fatal:** This strikes the definition of misrepresentation. If the content is the disjunction, there is no false positive when it fires at a shadow. If the content is *Fire*, there is. If selection history cannot distinguish these two scenarios (because the fitness payoff was identical), the theory cannot ground the normativity required for misrepresentation.
  *   **Refinement:** The only defense is to argue that selection *rarely* acts on disjunctions without ecological unity. If $A \lor B \lor C$ yields the same payoff, they must be functionally equivalent *for the organism*. If they are functionally equivalent, the disjunctive content is correct, and your intuition that it *should* be *Fire* is the error. But if they are not functionally equivalent, selection should distinguish them. If it doesn't, the theory fails.

  **2. Fatal to Generality: The "Lucky Draw" System (Case 3)**
  *   **The Risk:** A system with no selection history (the lucky random net) that behaves identically to a selected one. Your pre-theoretic intuition is that it has content; your theory says it does not.
  *   **Concede or Dismiss?** **Concede (with a strategic retreat).** If you hold this as a *general* account of content, this case falsifies it. A system can possess semantic properties (downstream exploitation, information carrying) without selection history.
  *   **Strategic Retreat:** You must restrict the scope. Teleosemantics is not a theory of *content simpliciter*; it is a theory of *biological function-based normativity*. To save the view, you must argue that the "Lucky Net" has *information* and *causal role*, but lacks *genuine misrepresentation* (it is merely broken, not wrong).
  *   **Why Fatal to Generality:** If you cannot explain the content of the Lucky Net, you cannot explain the content of novel human thoughts that have no selection history (either phylogenetic or ontogenetic). This collapses the "General Account" ambition.

  **3. Serious Limitation: Compositionality and Thought (Case 4)**
  *   **The Risk:** Teleosemantics excels at indicator states (frog flies, bee dances). It has not successfully derived compositional, propositional content from selected effects without relying on a Language of Thought (LOT) hypothesis that itself requires naturalization.
  *   **Concede or Dismiss?** **Concede.** The compositional move is largely promissory. While Nicholas Shea and Ruth Millikan have made strides (input systems, consumer semantics), a full derivation of logical operators and quantifiers from selected effects remains incomplete.
  *   **Impact:** This limits the view to a theory of *sub-propositional* content or forces a hybrid view (teleosemantics for atoms, functional role for structure). This reduces the theoretical unity you claimed.

  **4. Merely Awkward: Function-Switching (Case 2)**
  *   **The Risk:** Exaptation and redeployment create layered histories.
  *   **Concede or Dismiss?** **Dismiss (as manageable complexity).** This is not a falsifier; it is a boundary condition problem.
  *   **Defense:** Teleosemantics can handle this via *lineage individuation*. If the mechanism is physically modified or the consumer system changes significantly, it is a new token of a new type with a new history. If it is the *same* mechanism, the content is arguably ambiguous or context-dependent (activated by which consumer?). This makes content attribution messy, but not false. It mirrors the biological reality: functions *are* often layered and messy.

  ---

  ### II. Decisive Empirical Findings

  Your view is not purely armchair; it hangs on specific empirical claims about how cognitive mechanisms are formed.

  **1. Decisive Against the View:**
  *   **Drift over Selection:** If evolutionary psychology and neuroscience establish that the majority of neural mechanisms producing perceptual states are products of **genetic drift or structural constraint** (e.g., physical wiring laws) rather than specific selection for information tracking, the phylogenetic arm of your view collapses.
  *   **Non-Selectionist Learning:** If it is established that ontogenetic learning (gradient descent, Hebbian learning) operates primarily through **constraint satisfaction or energy minimization** without a "variation and selective retention" structure (i.e., if the "selection" is merely a mathematical artifact of the optimization function and not a causal process of variant elimination), the "selection-shaped" arm collapses.
  *   **Ubiquitous Exaptation:** If neurobiology shows that **redeployment is the rule** (e.g., 90% of circuits are multifunctional with no dominant selected function), the "Normal Condition" becomes statistically impossible to define, rendering content attribution arbitrary.

  **2. Decisive For the View:**
  *   **Specific Adaptations:** Evidence that specific neural circuits are **specialized encoders** selected for specific distal properties (e.g., a specific circuit selected *only* for snake detection, not general threat) would vindicate the "grain" of content argument against the disjunction worry.
  *   **Consumer Specificity:** Evidence that downstream systems are **tuned to ignore** the false positives (e.g., the motor system ignores the "shadow" firing of the visual system). This supports the "Consumer Semantics" refinement: content is fixed by what the *consumer* needs, not just what the producer does.

  **3. Findings that Leave the View Untouched:**
  *   **Swampman Existence:** (You already noted this).
  *   **Consciousness Facts:** Qualia or phenomenal character findings do not impact the *content* fixation story directly, unless they imply content is intrinsic.
  *   **Speed of Processing:** Whether mechanisms are fast or slow does not alter the historical fixation of content.

  ---

  ### III. Predictions vs. Rivals

  To avoid the "schema" charge, your view must predict things other views do not.

  **1. vs. Informational Semantics (Dretske/Fodor):**
  *   **Prediction:** Teleosemantics predicts **systematic error in high-fitness environments**. Informational semantics struggles with false positives (if it fires, the state exists). Teleosemantics predicts that organisms will systematically misrepresent conditions when doing so increases fitness (e.g., hyper-active agency detection).
  *   **Differentiation:** If we find cognitive systems that are *veridical* even when veridicality reduces fitness, teleosemantics is in trouble. Informational semantics predicts veridicality (covariance); Teleosemantics predicts utility-aligned representation.

  **2. vs. Functional Role Semantics (Block):**
  *   **Prediction:** Teleosemantics predicts **content stability across functional role change**. If a state's inferential role changes but its selected function remains (e.g., a concept is repurposed in reasoning but its reference remains fixed by history), Teleosemantics says content is stable; FRS says it shifts.
  *   **Differentiation:** Look for cases of conceptual change where reference remains fixed despite inferential shifts (e.g., scientific terms).

  **3. vs. Interpretivism (Dennett):**
  *   **Prediction:** Teleosemantics predicts **determinate content in the absence of an interpreter**. An isolated organism has content. Interpretivism requires a stance.
  *   **Differentiation:** This is hard to test empirically but metaphysically distinct. However, if we find that "content attribution" varies wildly based on the *observer's* goals rather than the *system's* history, Interpretivism gains ground.

  **4. vs. Structural Representation (Gładziejowski/Shea):**
  *   **Prediction:** Teleosemantics predicts that **structural similarity is insufficient** for content without the history of exploitation. A map that is isomorphic but never used has no content. Structuralists might argue the isomorphism itself grounds content.
  *   **Differentiation:** If we find "silent" neural structures that are isomorphic to the world but play no functional role and have no history of selection, Structuralists might assign content; Teleosemantics will not.

  ---

  ### IV. The Schema Charge: Unfalsifiability Assessment

  You ask if the view has been qualified into unfalsifiability: *"fill in your favourite selection process."*

  **Honest Assessment:**
  There is a genuine risk here. By expanding from "Natural Selection" to "Selection-Shaped" (to cover learning, culture, gradient descent), you risk making "selection" a placeholder for "any process that looks like it could fix a function."

  **Is it a Defect?**
  *   **As a Metaphysical Theory:** No. It is appropriate. You are offering a functional analysis of *normativity*. The schema is: *Normativity requires a history of differential retention.* Whether that history is biological or artificial is a secondary instantiation.
  *   **As a Scientific Theory:** Yes, it is a defect if "selection-shaped" is not rigorously defined. If any optimization process counts, then a rock settling into a valley has "content" about the terrain.

  **How to Avoid Vacuity:**
  You must impose a **Variation-Retention-Exploitation** constraint.
  1.  **Variation:** There must have been alternative configurations possible.
  2.  **Retention:** There must be a mechanism that keeps the successful configuration.
  3.  **Exploitation:** There must be a *consumer* that uses the state *because* of that retention history.

  If you cannot specify the *consumer mechanism* that was selected to exploit the state, the view slides into vacuity. The "Lucky Net" fails because while it has variation (in the design space) and retention (it was kept), it lacks the *history of exploitation* that establishes the *norm* for the current use.

  **Verdict:** The view is not unfalsifiable, but it is **highly sensitive to the individuation of mechanisms**. If you can individuate mechanisms finely enough to match our content intuitions, it works. If mechanism individuation is coarse (as biology often is), the content will be coarse (disjunctive), and the view will conflict with intuition.

  ---

  ### V. Addressing Your Core Worry: Truth and Indeterminacy

  You state: *"What I find genuinely worrying is the conjunction of selection's indifference to truth and the indeterminacy that seems to follow from it."*

  Here is the argument you need to make to sleep at night, or to abandon the view:

  **1. The Concession:**
  Teleosemantics does not naturalize *Truth*; it naturalizes *Success*. It claims that "Truth" (in the sense of accurate representation) is a sub-species of "Successful Functioning."
  *   If selection is indifferent between *Fire* and *Fire-or-Shadow*, then **there is no fact of the matter** about which is the content.
  *   **Crucial Move:** You must argue that selection is *rarely* indifferent in this way. In the real world, *Fire* and *Shadow* usually have different downstream consequences. If the organism treats them the same, the content *is* the disjunction. If the organism treats them differently, selection would have differentiated the mechanisms.

  **2. The Indeterminacy Defense:**
  The indeterminacy you fear (Selection Indifference) is only fatal if you assume content *must* be more fine-grained than selection history.
  *   **Rival Assumption:** You are implicitly assuming that *Fire* is a better content candidate than *Fire-or-Shadow* even if the organism's history doesn't distinguish them.
  *   **Teleosemantic Reply:** That assumption relies on a non-naturalistic notion of content. If the history doesn't distinguish them, nature doesn't distinguish them. The "indeterminacy" is not a failure of the theory; it is a feature of the world. The content *is* indeterminate.

  **3. The Deciding Factor:**
  If you cannot accept that content might be disjunctive or coarse when selection is coarse, you cannot be a teleosemanticist. You must decide if you are willing to **revisionize content** to match the grain of selection.
  *   If **Yes**: The view survives, but you lose the intuition that "Fire" is the content in the Fire/Shadow case.
  *   If **No**: The view is false for you, because it cannot recover the fine-grained contents we attribute in folk psychology.

  **Final Recommendation:**
  The "Lucky Net" (Case 3) is your biggest hurdle for *generality*. The "Selection Indifference" (Case 1) is your biggest hurdle for *accuracy*.
  I recommend you **restrict the scope**. Admit that Teleosemantics is a theory of *Biological Normativity*, not *Content Simpliciter*. Use it to ground the normativity of perception and basic drives. For the "Lucky Net" and high-level thought, acknowledge you may need a hybrid view (e.g., Teleosemantics for the atoms, Inferential Role for the structure). This saves the view from falsification by AI cases while preserving its core insight: that without a history of success, there is no "wrong," only "broken."

  If you hold the line on "General Account," the Lucky Net falsifies you. If you retreat to "Biological Account," you survive but lose the unification you sought. Given your PhD focus, the honest path is to argue that *mental* content is essentially biological, and the "Lucky Net" has only *derived* or *as-if* content. That is a defensible, if less ambitious, position.
