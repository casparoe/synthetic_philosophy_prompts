          3.  *Scope/Compositionality (Case 4):* Serious limitation. If it can't do thought, it's not a theory of *mental* content broadly.
          4.  *Function-Switching (Case 2):* Awkward but survivable.
      *   **Deep Dive into Case 1 (Truth vs. Fitness):**
