      *   **Current Stance:** Moved to a broadly selected-effects (teleosemantic) view.
      *   **Core View:** Content fixed by what the producing mechanism was selected to do (natural selection for innate, selection-shaped for acquired). Misrepresentation = gap between function and actual response. General account (not limited to specific states).
      *   **Task:** Map the view's exposure (what makes it false vs. awkward). Use specific cases provided by the user (Selection indifference to truth, Function-switching, No selection history systems, Scope/Compositionality).
      *   **Constraints:** Assume knowledge of well-known objections (don't just list "Swampman" or "Indeterminacy" generally). Rank defeaters (fatal vs. awkward). Advise on concession vs. dismissal. Identify decisive empirical findings. Compare predictions with rivals. Assess unfalsifiability/schema charge.
      *   **User's Specific Worry:** Conjunction of selection's indifference to truth and resulting indeterminacy.
      *   **User's Intuitions:** Unpersuaded by Swampman. Wants honest assessment, not a knockdown.

  2.  **Deconstruct the Four Cases/Objections:**

      *   **Case 1: Selection Indifference to Truth (The "Fire-or-Shadow-or-Dust" Problem).**
          *   *Issue:* Selection favors fitness, not truth. If a mechanism fires for a disjunction (Fire OR Shadow OR Dust) because false alarms are cheap and misses are costly, does the content become that disjunction?
          *   *Risk:* Indeterminacy. If selection is indifferent between "Fire" and "Fire-or-Shadow," which is the content?
          *   *Teleosemantic Response:* The content is the *Normal Condition* under which the mechanism performed its function historically. If it was selected to detect Fire, but tolerates Shadow, the content is Fire, and Shadow is a false positive (misrepresentation).
          *   *Evaluation:* This is the core theoretical vulnerability. If the "Normal Condition" is itself disjunctive due to selection pressure, the content is gerrymandered.
          *   *Ranking:* High risk (Fatal if not resolved).

      *   **Case 2: Function-Switching (Exaptation/Redeployment).**
          *   *Issue:* Mechanism selected for Job A, then redeployed for Job B (maybe contradictory). Which history counts?
          *   *Risk:* Diachronic indeterminacy. Is content historical (original) or current (recent)?
          *   *Teleosemantic Response:* Need a theory of *derived proper function* or a cutoff point (e.g., Millikan's "new mechanisms"). If the mechanism itself is modified, it's a new mechanism. If it's the *same* mechanism used differently, content might be ambiguous or layered.
          *   *Evaluation:* Messy, but manageable. Suggests content is relative to the specific tokening of the mechanism's lineage.
          *   *Ranking:* Medium risk (Awkward/Messy).

      *   **Case 3: No Selection History (The "Lucky Draw" Network).**
          *   *Issue:* A neural net initialized randomly works perfectly immediately. No selection history. Does it have content?
          *   *Risk:* Teleosemantics says "No content" (no history). Intuition says "Yes content."
          *   *Extension:* If we count gradient descent as "selection-shaped," do we overgenerate content (pancontentualism)?
          *   *Evaluation:* This tests the "Naturalization" claim. If content requires history, lucky systems lack it. If we stretch "selection" to include optimization, we risk vacuity.
