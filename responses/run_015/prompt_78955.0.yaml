      *   *Prediction:* **Not Justified.**

  7.  **What *Should* She Say? (Normative Epistemology):**
      *   This is a classic "Calibration" or "Independence" problem. Hana's reasoning ("if I were impaired I'd have gotten a different answer") uses the very cognitive faculty under suspicion to vindicate itself. This is bootstrapping.
      *   Standard view (e.g., Christensen, Elga): Reliable HOE about impairment defeats justification, even if you feel confident. You need independent check.
