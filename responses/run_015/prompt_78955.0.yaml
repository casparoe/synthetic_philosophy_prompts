      *   *Hana's Attitude:* Hana *doesn't* doubt. She is dogmatic. If Nadia cares about *intellectual humility* or *responsiveness to doubt*, Hana's attitude might trigger a ~J verdict regardless of the evidence structure.
      *   *Most likely point of failure:* Case 3 (Cleo). Was the undergrad's comment *really* treated as weak HOE, or was it treated as *no* evidence? If Nadia thinks "vibes" are zero weight, but "memos" are high weight, Hyp 1 holds. If Nadia thinks Cleo's FOE was just *so much stronger* than Devi's, Hyp 2 holds.
