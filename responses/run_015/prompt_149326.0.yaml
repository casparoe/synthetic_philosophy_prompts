prompt: |-
  ok so me and my friend Dan just had a three-hour argument about biological function at a pub and we got nowhere, so I want you to settle it — or at least tell me where the argument actually lives.

  First, the role: you're a professional philosopher of biology, someone who has actually thought hard about selected-effects / etiological accounts versus causal-role and dispositional accounts of function, and who isn't going to just recite the textbook summary and call it a day. Before you commit to any numbers, take a beat and brainstorm: lay out the distinctions, the test cases, and the sub-questions you think genuinely carry weight here, and only then go numerical. Think carefully and step by step, and no sliding into "well, it depends which theory you like" — that's the move Dan made all night and it's exactly what I don't want.

  Here's the claim I want a number on:

  P. When a molecular biologist working on a synthetic minimal cell — a cell built from a chemically-synthesized genome, designed on a computer, whose genes have no selection history whatsoever, only a design history plus a current causal organization — says of one of those genes that its function is to catalyze step three of membrane lipid synthesis, her claim is true in exactly the same sense as it would have been had she said it of the homologous gene in an ordinary wild bacterium. Same property, same truth-conditions, not merely a useful façon de parler or a loose way of talking that we tolerate because it's convenient.

  My credence on P is about 0.6. Dan's is about 0.25.

  So: give me yours, decomposed. I want the sub-questions you're weighting, a rough probability and one line of justification for each, and then how they combine into the headline number. Here are the ones I think you probably need to cover, but add your own and tell me if any of mine are red herrings:

  - whether "biological function" is one phenomenon or two — i.e. whether the etiological and the causal-role camps are really competing theories of the same thing, or whether they've been quietly talking past each other about different explananda (the "why is it here" question versus the "what does it do in this system now" question)
  - whether "designed to" can do the same normative work as "selected for" — whether an intentionalist story about design history is a genuine third option, or whether it collapses into one of the other two under pressure
  - whether the normativity of function attributions — the bit that lets a token malfunction, that lets us say a heart that only makes thumping noises is not doing its job — requires any history at all, or whether current organization plus a contrast space supplies it
  - what actual scientific practice looks like here: is the person assigning functions to genes in an organism nobody ever selected reporting a discovery about that organism's past, or imposing an explanatory scheme on a system she finds interesting? And does that practice settle anything, or just describe what people find useful?
  - the hard middle cases, which is where Dan and I finally got stuck: a trait whose current causal contribution is not what it was originally selected for (exaptation), and a trait kept in place now because of an effect that was never selected for at all — it arose as a by-product and got locked in by drift or by sheer structural necessity. Does either family of account give a stable verdict on those, and does instability there even matter for P?
  - whether P is hiding a sorites: does the truth of the function ascription fade out gradually as the design history gets thinner and the lineage gets further from anything selected, and is a vague truth still the same kind of truth?

  Then three more things: (a) which single term your final number is most sensitive to; (b) which term you're least confident about and what would actually move it — I mean an argument or a kind of consideration, obviously not a citation, since you can't look anything up and I don't want a reading list; and (c) given that I'm at 0.6 and Dan is at 0.25, which of those sub-questions do you think he and I are definately disagreeing about? I have a suspicion it's not the one we spent two hours on — he kept hammering the point that the heart's job isn't to make thumping sounds and I kept agreeing with him, which makes me think the real disagreement is somewhere else entirely, and I want to know where.
