answer: |-
  Here is a sequence of ten interview questions designed to corner the "strong" reading of the Private Language Argument (PLA) while anticipating the "grammar, not metaphysics" deflection. They are ordered to build pressure, starting with definitions and moving toward the implications for the inner life and the limits of her argument.

  ### 1. The Definition of "Strong"
  **Question:** Let's begin by clarifying the stakes of your new book. The "weak" reading of Wittgenstein suggests that a private language is unintelligible *to us* because language is inherently social. Your "strong" reading claims it is *impossible*, full stop. Does the strong reading entail that a solitary individual, cut off from all community, could not even *name* their own sensations, or simply that they could not communicate them?

  **Follow-up:** *If she says it is about intelligibility/communication:* "But if the impossibility lies in the *naming* itself, not just the sharing, aren't you claiming that the mental state itself cannot anchor the sign? That moves us from a point about communication to a point about the relation between mind and world."

  ### 2. The Grammar/Metaphysics Shield
  **Question:** You frequently defend this position by saying, "The PLA is about grammar, not metaphysics." However, if you prove that a certain kind of reference is *impossible*, doesn't that place a constraint on reality itself? If I cannot, even in principle, refer to a private object, does that object have any ontological status, or have you effectively argued it out of existence?

  **Follow-up:** *If she insists it is "only grammar":* "Grammar usually describes how we use words. But you are describing what we *cannot* do. If the rules of grammar forbid a move that seems phenomenologically possible to the subject, what grounds those rules? Are they arbitrary, or do they track something about the nature of the mind?"

  ### 3. The Beetle in the Box
  **Question:** In the famous "beetle in the box" passage, Wittgenstein says the object "cancels out." In your strong reading, is this a concession that the private object exists but is irrelevant, or is it a *reductio ad absurdum* showing that the concept of a private referent is incoherent?

  **Follow-up:** *If she says the object is irrelevant (Concession):* "If the object is irrelevant to the meaning of the word 'beetle,' what is the word doing? If it's not tracking the object, and it's not tracking public behavior, what is the semantic content of the term? It seems the strong reading leaves the word hanging without a referent."

  ### 4. Rule-Following and the "Proof" Status
  **Question:** Many interpreters link the PLA to the Rule-Following Paradox: that no private mental state can determine how I apply a rule in the future. If the PLA is just a special case of the Rule-Following Paradox, does that weaken your claim that it is a "proof"? Skeptical paradoxes are usually meant to be dissolved, not solved.

  **Follow-up:** *If she distinguishes them:* "Then where is the boundary? If rule-following requires public criteria to fix meaning, and private language fails because it lacks public criteria, aren't they the same mechanism? If they are the same, doesn't the skeptical nature of rule-following infect the PLA, making it a warning rather than a proof?"

  ### 5. The Inner Life
  **Question:** Critics worry that the strong reading makes the inner life vanish—that it turns pain into a mere public performance. Does your reading deny the existence of the inner life, or does it simply deny that the inner life is the *meaning* of our words? Where does the pain actually live in your account?

  **Follow-up:** *If she says it denies meaning, not existence:* "But if the pain exists privately, and the word 'pain' gets its meaning publicly, there is a gap between the sensation and the sign. How do we bridge that gap without the private ostensive definition you claim is impossible? How does the public word latch onto the private event?"

  ### 6. The "Forms of Life" Pivot Blocker
  **Question:** I want to press on that latching mechanism. You might say our shared "forms of life" explain how the word connects to the world. But forms of life are collective. I am asking about the *individual* moment of sensation. Before I speak to anyone, I feel pain. If the strong reading holds, is that pre-linguistic sensation cognitively accessible to me, or does my ability to recognize it *as pain* depend entirely on my prior training in a public language?

  **Follow-up:** *If she appeals to training/community:* "That avoids the specific moment. I'm asking about the phenomenology of the solitary subject. If I were the last person on earth, would I still feel pain *as pain*, or would it become an undefined disturbance? If you say the latter, you are making a metaphysical claim about the dependence of consciousness on community, not just a grammatical point about language."

  ### 7. Neuroscience and Private States
  **Question:** As a science journalist, I have to ask about the empirical angle. Neuroscience treats neural correlates of pain as private physical states that can be identified independently of behavior. If a future scan can identify "pain" in a paralyzed, non-communicating patient, does your argument imply the scan is meaningless, or that the patient doesn't actually have pain in the relevant sense?

  **Follow-up:** *If she says science is a public language game:* "Science aims to describe reality, not just play games. If the scan detects a state that the patient feels but cannot publicly criteria-ize, and you say that state cannot be the meaning of 'pain,' you seem to be privileging the linguistic practice over the biological reality. Is science subordinate to grammar in your view?"

  ### 8. The Modality of Impossibility
  **Question:** You describe the private language as "impossible." Is this a logical impossibility, like a square circle, or a practical impossibility, like building a tower to the moon? If it is logical, what is the contradiction involved in a private reference?

  **Follow-up:** *If she says it is a "logical" or "conceptual" impossibility:* "Conceptual impossibilities usually arise from contradictory definitions. What is the contradiction in 'I name this sensation S'? Is it that 'S' cannot be remembered, or that 'S' cannot be checked? If it's about checking, aren't we back to practical verification, not logical impossibility?"

  ### 9. Solipsism and the Other Minds Problem
  **Question:** One traditional motivation for the PLA was to defeat solipsism. But if the strong reading says I cannot refer to my own private states, does it inadvertently make the "other minds" problem worse? If I can't conceive of a private mind for myself, how can I conceive of one for you?

  **Follow-up:** *If she says other minds are public:* "But the *experience* of other minds is private to me. I don't experience your pain. If private reference is impossible, how do I conceptualize your experience as distinct from your behavior? It seems the strong reading risks flattening other people into automata just as it flattens me."

  ### 10. The Philosophical Payoff
  **Question:** Finally, if we accept your strong reading, what philosophical problems get solved that the weak reading leaves open? Does it dissolve the problem of skepticism, or does it simply render skepticism inexpressible?

  **Follow-up:** *If she says it dissolves skepticism:* "If skepticism is inexpressible because the language to frame it is impossible, haven't you just changed the subject? The skeptic feels doubt. If your grammar forbids expressing that doubt, have you answered the skeptic, or just gagged them?"
