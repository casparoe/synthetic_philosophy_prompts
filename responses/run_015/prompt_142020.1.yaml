  1.  **Weight Editing without Behavioral Change:** In Question 3, the setup assumes one can edit later-layer weights to move a feature direction while keeping network behavior *unchanged*. In practice, this requires precise compensatory edits elsewhere; without them, behavior usually changes. If behavior *must* change to move the direction, her defense (that the mosaic persists) might be stronger than the question allows.
  2.  **Invertible Linear Maps in Residual Stream:** In Question 6, the setup assumes one can apply an invertible linear map to the residual stream and undo it in the next layer's weights. While mathematically valid, this ignores constraints like weight decay, regularization, or architectural bottlenecks that might privilege certain bases naturally, which could undermine the "basis freedom" pressure point.
