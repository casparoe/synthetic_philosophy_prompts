  **Question 1**
  You lean on the temperature analogy, but thermodynamics exists independently of thermometers to define what temperature *is*. What is the corresponding independent theory of features that exists apart from your dictionaries?
  **Expected Answer:** She will say the mosaic itself constitutes the theory-independent structure, defined by functional roles rather than coordinates.
  **Follow-up:** If the theory is just the mosaic itself, isn't that circular? How do we specify those functional roles without already assuming the very features you claim are merely our construction?
  **Confidence:** High

  **Question 2**
  Thermometers converge numerically to high precision. What null baseline must your convergence statistic beat for you to count dictionary agreement as evidence of a real mosaic?
  **Expected Answer:** She will say convergence must beat dictionaries fit to different models or to the same model with feature structure destroyed.
  **Follow-up:** If the baseline is just "better than noise," doesn't that allow many incompatible mosaics to pass, undermining the claim that there is *one* real mosaic rather than many useful approximations?
  **Confidence:** High

  **Question 3**
  Temperature has causal powers of its own. If you edit later-layer weights to move a feature direction while the network's behaviour remains unchanged, is the feature still there?
  **Expected Answer:** She will say yes, because the mosaic relations persist even if the specific coordinates shift.
  **Follow-up:** If the direction moves without behavioral change, what causal power is the mosaic tracking? Isn't the behavior the only causal power available to you?
  **Confidence:** High

  **Question 4**
  Your $\alpha$-equivalence relies on approximating features using a "small number" of others. Is this relation transitive, such that if A equals B and B equals C, then A equals C?
  **Expected Answer:** She will likely admit it is not strictly transitive due to the vagueness of the "small number" parameter.
  **Follow-up:** If it's not transitive, there's no single equivalence class. Do you accept ontic vagueness about where one mosaic ends and another begins, or does the mosaic dissolve into a spectrum?
  **Confidence:** Low (Least Confident)

  **Question 5**
  Wider dictionaries split what narrower ones treat as a single feature, and you say this hierarchy is part of the mosaic. What fixes the grain of that hierarchy?
  **Expected Answer:** She will say it is fixed by the structure in the training data that any well-fit model would inherit.
  **Follow-up:** If it's data structure, isn't the mosaic a property of the dataset, not the network? Why call this neural representation realism rather than data realism?
  **Confidence:** High

  **Question 6**
  You can apply an invertible linear map to the residual stream and undo it in the next layer's weights without changing behaviour. Does sparsity pick out the privileged basis?
  **Expected Answer:** She will say yes, sparsity is what picks out the privileged basis.
  **Follow-up:** Is the sparsest decomposition unique, or identified only up to permutation and scaling? If not unique, is sparsity a fact about the network or a prior we bring because sparse things are the ones we can read?
  **Confidence:** High

  **Question 7**
  Probes can find directions carrying information the network never uses. How would we test for exploitation rather than mere presence?
  **Expected Answer:** She will say exploitation requires the network to use the direction for downstream tasks.
  **Follow-up:** Intervening on a direction the network never uses can still change its behaviour. How do you test for exploitation if intervention always confounds presence and use?
  **Confidence:** Medium

  **Question 8**
  If representations are real, they can misrepresent. In a model that systematically asserts falsehoods, does a feature's content depend on its upstream causes or its downstream effects?
  **Expected Answer:** She will lean downstream or argue for a hybrid view fixing content by use.
  **Follow-up:** If downstream, are you committed to a feature's content shifting when later layers are edited and the feature direction is left alone? Does the network represent things it is disposed to deny?
  **Confidence:** High

  **Question 9**
  What finding would make you abandon realism rather than retreat to a coarser mosaic—specifically, if the mosaic were fully predictable from statistics of the training data alone?
  **Expected Answer:** She will say no, because the network still instantiates the structure regardless of predictability.
  **Follow-up:** If the network is fully predictable from data stats, isn't the network just a transparent medium? Where is the "realism" about the *neural* part if the data dictates everything?
  **Confidence:** Medium

  **Question 10**
  You and an instrumentalist who treats features as useful fictions seem to agree on every intervention-level prediction. What is at stake in the book?
  **Expected Answer:** She will say the stake is understanding what exists, not just prediction.
  **Follow-up:** If understanding existence changes no expectations about steering, transfer, or trust, is this metaphysics merely verbal?
  **Confidence:** High

