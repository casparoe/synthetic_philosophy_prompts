      *   *Incommensurable Values:* Two things are good, but you can't measure them against each other on a single scale (e.g., Justice vs. Mercy, Career vs. Family, Art vs. Safety). It's not that you don't know the weights; it's that there *are* no weights.
      *   *Hard Choices:* A decision where reasons run out. You can't calculate the right answer. The choice defines the agent rather than reflecting a pre-existing truth.
