  3.  **Translate to Craft Terminology:**
      *   *Stakes:* Usually, stakes are quantitative (life/death, money). Here, stakes need to be qualitative and mutually exclusive. It's not "high stakes vs. low stakes," it's "Apple stakes vs. Orange stakes."
      *   *Character Agency:* Agency isn't just "doing stuff." It's the act of committing to one value system over another without external validation. It's the moment the character *becomes* the metric.
      *   *Dramatic Irony:* The reader might see the cost of the road not taken more clearly than the character, or vice versa.
      *   *Narrative Distance:* Close distance makes the choice feel visceral and unresolvable. Distant distance makes it look like fate or plot mechanics.
      *   *Chekhov's Gun:* The "guns" here aren't just plot devices; they are embodied values. If you show the value of Family early, it must go off later as a cost to the value of Art.
      *   *Epistemic Position:* The reader knows the cost, but not the "right" answer, because there isn't one. The reader shares the character's uncertainty but watches the commitment.

