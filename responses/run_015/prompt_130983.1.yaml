answer: |-
  **Setting:** *A park bench overlooking the river. It's late afternoon. Marcus is holding a flyer about a local town hall meeting regarding resource allocation. Elena is sitting next to him, scrolling through her phone.*

  **Marcus:** You going to the meeting tomorrow? About the surplus medical stockpile?

  **Elena:** I was thinking about it. Though I already know how I'm going to vote. Send it south. To the refugee camps across the border.

  **Marcus:** *(Sighs)* I figured. Look, I get it. The need is worse there. I've seen the news. But those supplies were bought with tax dollars from people in this county. They belong to the community that paid for them.

  **Elena:** That's the thing, Marcus. "Belonging." Why does a line on a map change who deserves a bandage? If someone is bleeding out in the next town over, you help them. If they're bleeding out ten miles further, across a border, suddenly they're someone else's problem? That doesn't make sense morally.

  **Marcus:** It's not about the miles. It's about the deal. We live in a specific society. We agree to follow certain rules, pay into a pool, and follow the laws. In exchange, that society agrees to look out for us. It's a cooperative project. If I'm paying into a pot to make sure *my* neighbors are safe, and you suddenly divert that to people who aren't part of that agreement, you're breaking the trust of the people who contributed.

  **Elena:** But is it really an agreement? I didn't sign a contract when I was born. I just happened to be born here. And the people across the border? They didn't choose to be born into a country with a crumbling hospital system. They're suffering because of bad luck. Why does your good luck give you the right to hoard medicine?

  **Marcus:** It's not hoarding. It's maintaining the structure that allows us to help anyone in the first place. Think about it like a lifeboat. If you're on a boat with your family, and you see someone drowning in the water, do you throw your family out to save the stranger?

  **Elena:** That's a dramatic image. But we aren't on a lifeboat. We're in a mansion, and there are people starving on the lawn. The cost of sending those supplies isn't putting us at risk. We're talking about surplus.

  **Marcus:** Okay, but it's not just about the supplies. It's about the priority of obligation. I have a stronger duty to my neighbor than to a stranger. Not because I like my neighbor more, but because we share a life. We build the roads together, we fund the schools together, we vote for the leaders together. That shared participation creates a bond. It's like… if you have a limited amount of money, do you pay your own mortgage first, or do you send it to a stranger who's homeless?

  **Elena:** I'd pay the mortgage, sure. But that's because if I don't, I become homeless too. That's self-interest. This isn't self-interest. This is saying, "My citizen's minor inconvenience is more important than a foreigner's life." That sounds like favoritism. It's like saying, "I'll help the people who look like me," or "pray like me." Just because the line is drawn around a country instead of a race doesn't make it less arbitrary.

  **Marcus:** It's not arbitrary, though. It's functional. Nations are how we organize responsibility. If everyone tries to be responsible for everyone equally, responsibility dissolves. If I'm equally responsible for a kid in Detroit and a kid in Damascus, I end up paralyzed. I can't act. But if I know my primary duty is to my community, I can actually get things done. I can vote, I can volunteer, I can hold my local officials accountable. I can't vote in Damascus. I have no leverage there. So my moral agency is tied to my political community.

  **Elena:** I hear that. I do. It's practical. But "practical" isn't the same as "right." Slavery was practical for the economy once. That didn't make it ethical. Just because borders are the way we organize things *now* doesn't mean they should dictate who lives or dies. Suffering doesn't check your passport before it hurts. Pain is universal. If we accept that all humans have equal value, then we have to accept that their needs have equal weight.

  **Marcus:** I agree humans have equal value. I don't think a life over there is worth less than a life over here. But value isn't the only thing that matters. Relationships matter. You have a special obligation to your own children, right?

  **Elena:** Of course.

  **Marcus:** Why? Is their life worth more than the kid next door?

  **Elena:** No. But I'm the parent. I'm the one responsible for them.

  **Marcus:** Exactly. And I'm a citizen. I'm part of the "parenting" of this country. We built this system. We maintain it. So we have a special responsibility to the people inside it. It's not favoritism; it's a specific role-based duty. If I ignore my own community to help abroad, I'm neglecting the specific role I'm actually in.

  **Elena:** But the analogy breaks down because countries aren't families. You choose to have kids. You don't choose your country. And unlike a family, countries actively harm each other. Sometimes the reason those people across the border are so poor is because of trade deals or policies *our* country pushed. So it's not just "them vs. us." It might be "us vs. the damage we helped cause." If we contributed to the flood, don't we owe them more than just our leftovers?

  **Marcus:** *(Pauses)* That's a fair point. If we broke it, we should help fix it. But that's about reparations or aid budgets. This specific shipment is for domestic emergency readiness. It's earmarked for our civil defense. Diverting it undermines the specific institution that gathered it.

  **Elena:** So institutions are more important than outcomes?

  **Marcus:** No. But strong institutions are the only way to get good outcomes long-term. If people feel like their government will always ship their medicine away the moment someone else needs it more, they stop supporting the government. They stop paying taxes. They stop trusting each other. Then you have no capacity to help anyone, anywhere.

  **Elena:** I worry that's just fear talking. "If we give a little, we'll lose everything." Most people aren't that selfish. They want to be generous, as long as they know their own basics are covered. Maybe the compromise isn't all or nothing. But I still think the default should be need, not location. If the need is ten times worse across the border, the border shouldn't count for much.

  **Marcus:** I can accept that need matters. I'm not saying we ignore them. I'm just saying our *primary* obligation is here. It's a priority system. Feed your own family first, then feed the neighbor.

  **Elena:** But what if the neighbor is starving and your family is just hungry? At what point does the severity of their need override your special bond?

  **Marcus:** *(Looks out at the river)* I don't know. Maybe when it's life and death versus comfort. But these supplies… they're for trauma. It's life and death on both sides.

  **Elena:** Then the numbers should decide. Save the most lives possible.

  **Marcus:** And I say trust the community that built the capacity to decide. It's messy. I know it doesn't feel perfectly clean. But morality isn't just math. It's about who we are to each other.

  **Elena:** And I think who we are to each other is humans. The rest is just paperwork.

  **Marcus:** *(Smiles slightly)* Well. I guess we're not voting the same way tomorrow.

  **Elena:** *(Smiles back)* Probably not. But I'm still glad you're coming to the meeting. It matters that we're arguing about it.

  **Marcus:** Yeah. That's the one thing we agree on. The arguing part. That's how the community works.

  **Elena:** True. Even if the community is too small.

  **Marcus:** One step at a time, Elena.

  **Elena:** One step at a time, Marcus.
