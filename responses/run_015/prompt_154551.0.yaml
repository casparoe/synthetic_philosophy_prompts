answer: |-
  One way to frame this is to ask whether AI possesses genuine autonomy metaphysically; that's a quagmire of consciousness debates we can't settle in nine months. Another is to ask how liability law should treat algorithms; that's too jurisdiction-specific and misses the action-theoretic core. The interruption framing is better because it bypasses internal architecture to focus on the relational dynamics of control that actually matter for responsibility.

  ***

  **Project Proposal: Tools, Agents, and the Interruption Condition**

  **1. The Question**
  This project asks: *Under what conditions does human intervention during a task preserve the unity of the principal's action, and when does it constitute a renegotiation of agency?* Rather than seeking a metaphysical boundary between 'tool' and 'agent' based on internal capacity, this project treats the distinction as a normative and pragmatic one. The goal is to determine which features of interruption track our practices of blame, explanation, and delegation. This stance is chosen because metaphysical debates regarding machine consciousness are currently stalled and irrelevant to immediate engineering challenges, while purely legal definitions vary too widely by jurisdiction to offer a unified theoretical account. By focusing on the structure of interaction—specifically the interruption condition—we can derive a functional taxonomy that aligns with how responsibility is actually assigned in socio-technical systems.

  **2. Critique of Existing Approaches**
  Current attempts to distinguish tools from agents typically rely on internal properties. Some accounts argue that agency requires goal-directedness or planning capacities; however, a thermostat exhibits goal-directedness without being an agent, while a highly constrained human assistant may lack planning capacity yet retain agency. Other approaches focus on answerability, suggesting the line is drawn where a system can be held to account. This leaves the question open because it addresses the aftermath of action rather than the structure of the action itself, failing to guide engineers designing systems that must be controlled *during* operation. Still others propose reasons-responsiveness accounts, where agency depends on the capacity to respond to normative reasons. While compelling, this binary view obscures the gradient of control inherent in modern automation. A system might be responsive to reasons yet designed to yield immediately to human override, or conversely, be opaque but legally treated as a mere instrument. These internalist and backward-looking accounts miss the relational dynamic: what happens to the *action description* when a human principal intervenes mid-stream. Existing frameworks cannot explain why interrupting a batch job feels different from interrupting a negotiating bot, even if both possess similar internal complexity.

  **3. The Method**
  The project will proceed over nine months using a method of normative conceptual engineering via contrasting cases, rather than pure conceptual analysis or empirical survey. Pure analysis risks detachment from technical reality, while empirical surveys of engineers merely record current confusion without offering normative guidance.

  *   **Months 1–2:** Refinement of the 'interruption condition' framework. I will delineate the three proposed components: factual interruptibility (can the process be paused?), normative justifiability (must the human justify the pause to the system?), and action redescription (is the post-interruption output still the human's action?).
  *   **Months 3–5:** Construction of contrasting cases. I will develop vignettes that dissociate these three components. For example, a [placeholder: specific high-frequency trading algorithm] that is factually uninterruptible but has no ends of its own versus a [placeholder: autonomous care robot] that is interruptible but requires a justification protocol to resume. These cases will be reviewed against technical documentation for existing systems to ensure plausibility.
  *   **Months 6–7:** Testing against responsibility practices. I will analyse how blame and explanation shift across these cases. If the system resumes without renegotiation, does the human retain full liability? If the system 'objects' to the interruption, does agency shift?
  *   **Months 8–9:** Drafting the 10,000-word paper and the practitioner's annexe.

  This method is superior because it isolates the specific variable (interruption dynamics) that internal property accounts conflate with general complexity. It produces a functional map rather than a definition.

  **4. Results and Practitioner Annexe**
  The project may reach one of three conclusions. First, it may find that the three components of the interruption condition are co-extensive, suggesting a single underlying property of 'subordination' has been missed. Second, and more likely, it may show that 'action redescription' is the only component that tracks moral responsibility, rendering factual interruptibility irrelevant to liability. Third, it may conclude that the tool/agent distinction is context-dependent, dissolving into a spectrum of 'degrees of collaboration'. The deciding consideration will be whether our intuitions about blame remain stable when factual interruptibility and redescription come apart in the constructed cases.

  The one-page practitioner's annexe will provide a decision framework for engineers and product leads. It will contain a flowchart asking: (1) Can the process be suspended without state loss? (2) Does resumption require the system to re-evaluate its goals? (3) Is the output post-interruption certified as the user's command or the system's recommendation? It will leave open specific legal liabilities, as these depend on local statute, but will clarify the architectural choices that trigger agency attribution.

  **5. Failure Conditions and Scope Management**
  The project would fail if the three components of the interruption condition prove impossible to dissociate in any technically plausible scenario. If every factually interruptible system also permits action redescription as the principal's own, the 'interruption condition' adds no value over simpler control models. Additionally, if the concept of 'action redescription' proves too vague to operationalise without circularity, the project would lack a determinate answer.

  Regarding scope, nine months is insufficient for a comprehensive history of action theory or a cross-jurisdictional legal analysis. To manage this, I will restrict the philosophical background to contemporary causal theories of action without historical excavation. I will also cut any attempt to propose specific regulatory policies; the annexe will remain classificatory, not prescriptive of law. If the case construction phase reveals that current systems are too homogeneous to provide contrast, I will restrict the analysis to hypothetical but technically coherent architectures rather than delaying for new empirical data on emerging models.
