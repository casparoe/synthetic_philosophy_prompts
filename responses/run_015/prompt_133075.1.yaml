answer: |-
  The core of my argument is that embedded agency must be understood not as the modest claim that agents depend on environmental supports, but as the stronger thesis that deliberative control is genuinely distributed across coupled brain-body-environment dynamics, with no central executive serving as the final arbiter of action. From this foundation, I defend the view that the classic hierarchical model of self-control, which attempts to solve the regress of desires by positing a highest-order identification that terminates the chain, becomes unnecessary not because the regress is solved internally, but because it is dissolved externally. When long-term preferences are partially constituted by stable epistemic scaffolding, including material artifacts, social commitments, and structured routines that do not merely assist but actively stabilize the deliberative loop, there is no need for an internal true self to halt the hierarchy, since the environment itself provides the anchoring that prevents infinite ascent.

  To appreciate the force of this claim, we must first distinguish between a weak and a strong conception of embeddedness. The weak conception treats the environment as a causal aid, suggesting that while an agent might rely on a calendar to remember an appointment or a checklist to complete a task, the locus of control and the identity of the agent remain strictly internal. On this view, the external tools are prosthetic; they extend the reach of the agent but do not constitute the agency itself. My position relies on the strong conception, which posits that the cognitive processes underlying deliberation and control are not bounded by the skull but are enacted through the dynamic coupling of neural activity, bodily engagement, and environmental structures. If control is distributed, then the search for a central executive within the brain is a category error. There is no homunculus sitting behind the eyes weighing desires against higher-order volitions because the work of weighing is offloaded onto the structure of the situation itself. This shift from internal localization to distributed dynamics fundamentally alters how we must approach the problem of self-control and the structure of the will.

  The traditional problem of self-control arises from the potential infinite regress of desires. If an action is driven by a first-order desire, such as the urge to smoke, autonomy seems to require that this desire be endorsed by a second-order desire, such as the desire to want to quit. However, this invites the question of what validates the second-order desire, potentially requiring a third-order desire, and so on ad infinitum. The classic hierarchical solution posits a stopping point, a decisive commitment or a highest-order volition where the agent simply identifies with a desire, thereby making it their own. This internal arbiter is often conceptualized as the true self, a locus of authority that halts the regress by fiat. Yet, this solution presupposes a boundary between the agent and the world that the strong embeddedness thesis denies. If the agents deliberative capacity is constituted by its coupling with the environment, then the authority of the true self cannot be located solely within the internal hierarchy of mental states. The demand for an internal stopper assumes that the stability of the self must be generated from within, ignoring the possibility that stability is a property of the system as a whole.

  When we recognize that deliberative control is distributed, the regress is not solved by finding a higher mental state that commands authority, but is dissolved by recognizing that the loop is closed externally. The stability required to prevent the infinite ascent of desires is provided by the resistant structures of the world. Consider the role of material artifacts and social institutions in shaping long-term preferences. A commitment to a fitness regimen is not maintained merely by a recurrent internal act of willpower; it is sustained by the gym membership contract, the scheduled appointments with a trainer, and the social expectation of peers. These are not merely aids that help the internal will function better; they are components of the preference structure itself. Without these external stabilizers, the preference might not exist as a stable entity capable of guiding action over time. The environment provides the friction and the structure that allow a preference to persist against the flux of momentary impulses. In this sense, the external scaffolding performs the function that the highest-order volition was supposed to perform internally: it anchors the agent to a specific course of action and provides the normative weight that distinguishes a mere urge from a endorsed preference.

  This external anchoring implies that the unity of the self is not a precondition for agency but an achievement of the coupled system. The classic model assumes a unified self that must impose order on disparate desires. In contrast, the distributed view suggests that coherence emerges from the successful integration of the agent with their scaffolding. When an agent utilizes a routine or a tool to stabilize their behavior, they are not exercising control over the environment from a distance; they are entering into a control loop where the environment regulates the agent just as the agent regulates the environment. The regress of desires dissolves because the question of what validates the preference is answered by pointing to the structural stability of the coupled system rather than the internal authority of a mental state. The preference is valid because it is embedded in a network of commitments and artifacts that resist arbitrary change. The environment acts as the final arbiter, not by making a decision, but by providing the constraints within which decisions become possible and stable.

  Consequently, we must revise our understanding of autonomy and self-control. Autonomy is not the capacity of an internal self to act independently of external influence, but the capacity to skillfully manage the couplings that constitute ones agency. Self-control is not the suppression of lower-order desires by a higher-order will, but the maintenance of the external scaffolding that keeps those desires in check. When an agent fails to exercise self-control, it is not necessarily a failure of internal willpower but often a breakdown in the coupling with the environment, such as the loss of a routine or the removal of a social constraint. This perspective liberates us from the metaphysical burden of locating a true self inside the mind. We do not need to find the little person inside who decides who we are. Instead, we see that who we are is distributed across the patterns of interaction we maintain with our world. The hierarchy collapses because the vertical dimension of higher and lower orders is replaced by the horizontal dimension of internal and external coordination.

  In conclusion, the move to a strong conception of embedded agency allows us to bypass the intractable problems of the hierarchical model without sacrificing the normative force of self-control. By acknowledging that deliberative control is distributed, we see that the stability of the agent is secured by the epistemic and practical scaffolding of the environment. The regress of desires is dissolved because the chain of validation does not need to terminate in an internal mental act; it terminates in the durable structures of the world that hold the agent in place. This view preserves the intuition that agents are responsible for their actions while relocating the source of that responsibility from a mythical internal executive to the tangible management of the brain-body-environment system. I trust this articulation clarifies the stakes of the position and offers a robust framework for the dissertation chapter you are currently developing.
