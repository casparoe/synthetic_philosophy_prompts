answer: |-
  Republican liberty is fundamentally a structural property of the power relations governing agents, not merely a count of obstacles or an internal state of autonomy. To understand why this functions as a protocol-level property rather than a runtime state, you must first distinguish the settled taxonomy from the contested implications. It is settled philosophical ground that Isaiah Berlin categorized liberty into negative freedom (absence of external interference) and positive freedom (internal self-mastery or autonomy), and it is similarly settled that Philip Pettit and other neo-republicans define freedom as non-domination, meaning independence from arbitrary power. Where scholars disagree is whether non-domination is truly distinct from negative liberty or if it secretly relies on positive capabilities; however, framing it as a protocol property clarifies why it stands apart from both.

  In distributed systems terms, negative liberty measures current network congestion or packet loss (interference), whereas republican liberty measures the access control lists and consensus rules (domination). You can have a system with zero current interference (negative liberty) where one node still holds root access to kill another node's process at will; under the republican view, the second node is unfree because the protocol permits arbitrary intervention, regardless of whether that power is currently exercised. This makes freedom a property of the system's architecture and institutional design rather than the agent's immediate experience of barriers. This structural framing prevents the collapse into negative liberty, which critics often argue is just non-domination with a time horizon attached; the distinction is that negative liberty cares about the act of interference, while the protocol view cares about the permission structure that allows it.

  Furthermore, this view is not reducible to capability approaches, which focus on what an agent can actually achieve given their resources. A capability theorist asks if you have the bandwidth and compute power to resist interference, but the republican protocol view asks if you have the status that forbids others from interfering arbitrarily. You might have the capability to fight back (high resources) but still live under a protocol that allows others to attack you without justification (low status), or conversely, have strong constitutional protections (high status) but lack the resources to exercise them (low capability). While it is contested among philosophers whether non-domination requires material resources to be meaningful, the core republican claim remains that freedom is a status defined by the rules of interaction, not the capacity to act within them. Therefore, treating liberty as a protocol-level guarantee protects agents from the latency of power—where you are free only because a dominator chooses not to act—rather than just the act itself.
