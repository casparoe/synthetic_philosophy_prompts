  # Decision Tree: The Distribution of Consciousness

  **Instructions:** Begin at the root. Answer each diagnostic question based on your intuition about the case described. Follow the branch to the next node or final position (leaf). Cases are constructed to be empirically neutral; do not rely on specific scientific findings.

  ### **Node 1: The Report Constraint**
  **Case:** *Creature A* behaves exactly as if it is in pain (withdraws, learns to avoid, protects the injury) but lacks the language or motor capacity to report "I am in pain."
  *   **(Yes)** Consciousness requires the capacity to report experience; without report, there is no experience.
      *   → **Leaf 1: Strict Verificationism**
  *   **(No)** Report is evidence, but experience can exist without it.
      *   → **Node 2**

  ### **Node 2: The Sub-Organismic Boundary**
  **Case:** *Creature B* has two neural clusters that never communicate; each controls one side of the body independently.
  *   **(Yes)** A proper part of an organism can be a distinct conscious subject.
      *   → **Node 3**
  *   **(No)** The biological organism is the smallest possible unit of consciousness.
      *   → **Node 4**

  ### **Node 3: Granularity Depth**
  **Case:** If parts can be subjects (from Node 2), is the *whole* organism *also* a subject, or only the parts?
  *   **(Parts Only)** The organism is just a collection; only the micro-subjects exist.
      *   → **Leaf 2: Micro-Subjectivism (Panpsychist)**
  *   **(Both)** Subjects exist at multiple levels simultaneously (parts and whole).
      *   → **Leaf 3: Hierarchical Consciousness**

  ### **Node 4: The Super-Organismic Boundary**
  **Case:** *Creature C* is a swarm of tiny agents acting jointly (like a hive). Is the *swarm* a distinct subject?
  *   **(Yes)** A collection of organisms can constitute a single conscious subject.
      *   → **Leaf 4: Group Mind / Supersubject**
  *   **(No)** Only individual organisms can be subjects.
      *   → **Node 5**

  ### **Node 5: The Metric**
  **Case:** Compare *Creature D* (simple nervous system) and *Creature E* (complex nervous system). Is *E* **more** conscious, or simply **conscious** (like D)?
  *   **(Binary)** Consciousness is a switch (On/Off).
      *   → **Node 6**
  *   **(Scalar)** Consciousness is a dimmer (Degrees of intensity/capacity).
      *   → **Node 7**

  ### **Node 6: The Basis (Binary Path)**
  **Case:** *Creature F* is synthetic but functionally identical to a mammal. *Creature G* is a mammal.
  *   **(Function)** If it functions like a conscious being, it is one (History irrelevant).
      *   → **Node 8**
  *   **(Lineage)** Biological history is intrinsically required (Function insufficient).
      *   → **Node 8**

  ### **Node 7: Aggregation (Scalar Path)**
  **Case:** If consciousness is scalar, do many small conscious parts sum to create a larger subject?
  *   **(No)** Intensity varies, but the subject is the whole organism.
      *   → **Node 8**
  *   **(Yes)** Integration of parts creates the degree of subjecthood (e.g., Φ).
      *   → **Node 8**
  *   *(Note: The combination of **Scalar + Lineage** is marked "Unoccupied" below, as few theories combine graded consciousness with strict biological essentialism.)*

  ### **Node 8: The Human Exception**
  **Case:** A member of our own species (infant or severely cognitively impaired) fails the criterion you selected above.
  *   **(Consistent)** They are not conscious (or less conscious) by the same rule.
      *   → **Leaf Positions (Consistent)**
  *   **(Exception)** They are protected by a separate principle despite failing the rule.
      *   → **Leaf Positions (Exception)**

  ---

  ## **Leaf Positions & Commitments**

  | Leaf | Position Name | Most Awkward Commitment | Aggregation for Welfare |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict Verificationism** | You must deny consciousness to all non-verbal humans (infants, aphasia). | **N/A:** No unreported suffering counts. Interventions focus only on verbal agents. |
  | **2** | **Micro-Subjectivism** | You must count every neuron or cluster as a moral patient; the "organism" is a fiction. | **Count Micro-Subjects:** Welfare is multiplied by the number of neural subjects per body. |
  | **3** | **Hierarchical Consciousness** | You accept that one body houses multiple subjects with potentially conflicting interests. | **Sum Subjects:** Calculate welfare for each sub-subject within the organism separately. |
  | **4** | **Group Mind** | You must grant rights to hives/colonies, potentially overriding individual insect welfare. | **Count Groups:** The colony is the unit of concern; individual workers may be replaceable parts. |
  | **5a** | **Functionalist Binary (Consistent)** | Severely impaired humans are not conscious subjects. | **Headcount:** Every "On" subject counts equally. Focus on maximizing the number of conscious beings. |
  | **5b** | **Functionalist Binary (Exception)** | Your theory of consciousness does not match your moral practice for humans. | **Headcount + Safety:** Count animals by head, but apply a precautionary principle for humans. |
  | **6a** | **Biological Binary (Consistent)** | Synthetic minds or radically evolved aliens could not be conscious regardless of behavior. | **Headcount (Bio):** Only count biological lineage. Non-biological suffering is morally null. |
  | **6b** | **Biological Binary (Exception)** | You privilege human biology over function, even in impaired cases. | **Headcount (Bio) + Safety:** Biological humans get priority; animals counted by species membership. |
  | **7a** | **Scalar Intensity (Consistent)** | A human with very low capacity may have less moral weight than a high-capacity animal. | **Weighted Sum:** Multiply duration by intensity. High-capacity suffering weighs more. |
  | **7b** | **Scalar Intensity (Exception)** | You accept scalar consciousness but insist on equal moral weight for all humans. | **Weighted Sum + Floor:** Animals weighted by capacity; humans granted a moral floor regardless of capacity. |
  | **8a** | **Scalar Integration (Consistent)** | Consciousness can be fragmented; a disconnected brain reduces the "size" of the subject. | **Integration Metric:** Welfare depends on information integration (e.g., Φ). Fragmentation reduces moral weight. |
  | **8b** | **Scalar Integration (Exception)** | You accept integration metrics but grant full status to non-integrating humans. | **Integration + Floor:** Use integration for animals; humans protected by species membership regardless of Φ. |
  | **--** | **Scalar Lineage** | **Unoccupied:** Combining graded consciousness with strict biological essentialism is theoretically unstable. | **N/A** |

  ---

  ### **Notes on Collisions & Empty Space**

  *   **Theoretical Collisions:** **Leaf 5 (Functionalist Binary)** and **Leaf 8 (Scalar Integration)** may yield identical verdicts for most animals if the integration threshold is treated as a switch. Similarly, **Global Workspace Theory** and **High-Order Thought** theories often land in **Leaf 5**, despite differing mechanisms. Discuss these as "Verdict Allies" rather than identical theories.
  *   **Empty Space:** The **Scalar Lineage** combination is largely unexplored. It is difficult to argue that consciousness comes in *degrees* based on function, but that the *scale* itself depends on ancestry. If you hold this view, you are in a novel position.
  *   **The Aggregation Problem:** For **Scalar** leaves (7 & 8), cost-effectiveness calculations must account for *intensity* and *duration*, not just population size. For **Binary** leaves (5 & 6), the focus is purely on the *number* of subjects. For **Granularity** leaves (2, 3, 4), the definition of "one subject" is the primary variable; misidentifying the unit (e.g., counting a hive as one vs. many) creates orders-of-magnitude errors in welfare estimates.
