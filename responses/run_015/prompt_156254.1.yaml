      *   *The Bootstrapping Problem (Vogel 2000):* Vogel is the one who really formalised the "bootstrapping" objection against externalism. Cohen expanded on it.
      *   *Circularity:* The friend's summary suggests Cohen *defends* the circularity as harmless. This is the opposite of Cohen's main point in the "Easy Knowledge" paper. Cohen argues that externalism *implies* we can gain knowledge of reliability too easily, and he finds this intuitively unacceptable (though he struggles to explain *why* without begging the question).
      *   *Terminology:* "Dialectical bootstrap" isn't standard Cohen terminology. It sounds like a conflation with "dialectical efficacy" (relevant to scepticism debates, e.g., Wright or Pritchard) or just a made-up term.
      *   *Solving Scepticism:* Cohen definitely does *not* claim bootstrapping solves scepticism. He argues that externalist accounts fail to satisfy the sceptic because they allow this "easy knowledge," which feels illegitimate. The summary claims he solves it by gaining "non-circular justification." This is wrong. Bootstrapping *is* circular (or question-begging in a dialectical sense).
