      *   **Input:** A summary provided by a friend (likely containing errors or simplifications).
      *   **Task:** Evaluate the accuracy of the summary against Cohen's actual views, distinguish from other positions (Vogel, contextualists), assess the claim about solving scepticism, flag technical misuse, and ensure British English.
      *   **Constraints:** No reading lists (user has no library access), clear separation of accurate vs. inaccurate parts, British English spelling/grammar.

