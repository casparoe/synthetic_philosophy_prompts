      *   Neutral tone? Yes.
      *   No citations? Yes.

  8.  **Drafting the Text:** (Mental check of the specific phrasing for the "Sealed Chamber" to ensure it captures the "law-violating world" aspect for Lewis vs "no intervention" for Woodward).
      *   *Lewis:* Closest world involves a small miracle at $t_0$ (assembly).
      *   *Woodward:* Intervention must be a variable $I$ that is exogenous. If physics forbids $I$, the causal relation is not established *within the model*.
      *   *Physicist prediction:* They talk about functional dependence, not necessarily "causation" in the manipulative sense.

      *   *Circularity:* Woodward admits causal primitives. Lewis wants reduction.
      *   *Self-Indexing:* Woodward bans logically connected variables. Lewis allows event descriptions.
      *   *Backtracking:* Lewis uses "future similarity doesn't matter." Woodward uses "arrow direction."

      *(Self-Correction on Shared Error)*: A good candidate for shared error is the assumption that causation is a binary relation between discrete events/variables, ignoring the process/mechanistic continuity or the context-sensitivity of "the cause." Let's go with Context-Sensitivity/Contrastivity. Both try to objective-ify what is often contrastive.

