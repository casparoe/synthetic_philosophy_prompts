  2.  **Deconstruct the Positions:**
      *   **Lewis-style (Counterfactual):** Causation = Counterfactual Dependence (chained). Relies on similarity metrics between possible worlds. Handles preemption/overdetermination via chains. Allows "miracles" (small law violations) to establish closeness.
      *   **Woodward-style (Interventionist):** Causation = Invariance under Intervention. $X \to Y$ if an intervention $I$ on $X$ changes $Y$. Interventions must be "surgical" (break other causes of $X$, affect $Y$ only via $X$). Focuses on manipulability and explanatory depth.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both are non-Humean in a sense (modal), but both want to avoid primitive causation if possible (though Woodward accepts causal primitives in the definition of intervention). Both care about distinctness of events/variables. Both agree on standard cases (billiard balls, etc.).
      *   *Claim 1:* Distinctness. Cause and effect must be distinct existences.
      *   *Claim 2:* Modal strength. Causation implies more than regularity; it supports counterfactuals/manipulations.
      *   *Claim 3:* Directionality. Causation is asymmetric.
      *   *Claim 4:* Standard Cases. Both agree on simple deterministic transmission (billiard balls).
      *   *Claim 5:* Goal. The theory should guide inference and explanation, not just metaphysics.

  4.  **Drafting Section 2: Disagreements Table (incorporating the 4 specific prompts):**

      *   **Issue 1: Circularity of Intervention.**
          *   *Claim:* Is "intervention" defined causally?
          *   *Interventionist:* It's a fixpoint/recursive definition. The causal notion used is thinner (manipulation) than the target (type-level causation).
          *   *Counterfactualist:* It's viciously circular. You need causation to define intervention, so you can't reduce causation to intervention.
          *   *Crux:* Reduction vs. Explication.
          *   *Test:* Can we specify an intervention without using causal language in a primitive way?
          *   *Prediction:* Int. says yes (via structural equations); CF says no (equations presuppose causal direction).

      *   **Issue 2: The Sealed-Chamber Case (User's Invention).**
          *   *Scenario:* Welded partition $P$, fixed energy $E_0$, pressure $Q$. Changing $P$ counterfactually changes $Q$. But no physical intervention on $P$ is possible without violating the setup (energy conservation/welding).
          *   *Claim:* Does $P$ cause $Q$?
          *   *Counterfactualist:* Yes. Closest world where $P$ differs (small miracle at assembly) yields different $Q$.
          *   *Interventionist:* No (or undefined). No valid intervention variable $I$ exists that sets $P$ without violating the "surgical" constraint relative to the system's constraints.
          *   *Crux:* Possibility of Intervention vs. Possibility of Counterfactual.
          *   *Prediction:* Physicists would say "$P$ determines $Q$" (structural) but might deny "we can cause $Q$ by changing $P$" (manipulative).

      *   **Issue 3: Self-Indexing Outcomes.**
          *   *Scenario:* Outcome $Y$ = "Excess deaths" (Actual - Baseline). Baseline is counterfactual.
          *   *Claim:* Can we say $X$ caused "Excess Deaths"?
          *   *Interventionist:* Tricky. If $Y$ is defined by a counterfactual, intervening on $X$ changes $Y$ by definition. Is this trivial?
          *   *Counterfactualist:* Natural fit. $Y$ *is* a counterfactual measure.
          *   *Crux:* Variable Relativity. Are variables fixed independently of the causal model?
          *   *Prediction:* Int. says we must redefine $Y$ to non-counterfactual terms (e.g., "Total Deaths") to assess causation. CF says "Excess" is the legitimate relatum.

      *   **Issue 4: Traces and Backtracking.**
          *   *Scenario:* Effect $E$ occurs. Does it imply Cause $C$ occurred? (Backtracking).
          *   *Counterfactualist:* No. Similarity metric forbids backtracking (future doesn't determine past in closeness).
          *   *Interventionist:* No. Interventions break incoming arrows. Knowing $E$ doesn't allow intervention on $C$.
          *   *Crux:* Why is backtracking forbidden?
          *   *Test:* Common Cause structure. $C \to E_1, C \to E_2$. If $E_1$, does $C$? (Diagnostic vs. Causal).
          *   *Prediction:* Both say no backtracking for *causation*, but CF relies on world-similarity weights, Int. relies on graph structure.

