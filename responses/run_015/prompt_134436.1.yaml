answer: |-
  ### The Procedure: Avicennian Self-Awareness Classification Protocol (ASACP)

  **Objective:** Classify patients into State 1 (Immediate Self-Awareness), State 2 (Reconstructed Awareness), or State 3 (Absence of Core Awareness).

  **Step 1: Signal Integrity and Arousal Baseline**
  *   **Protocol:** Establish reliable binary communication via eye-tracking or brain-computer interface (BCI). Confirm arousal via EEG reactivity to novel stimuli.
  *   **Sufficient Answer:** Consistent signal differentiation (Yes/No) over 50 trials with >85% accuracy.
  *   **Termination:** If no signal is established after three sessions, classify as **State 3**. Handoff to Ethicist for care-status review.
  *   **Value Handoff:** If signal is ambiguous but family insists on competence, Neurologist defers to Ethicist.

  **Step 2: Attribute Negation (The Body Test)**
  *   **Protocol:** Query bodily and spatial attributes. Questions: "Are you your hands?" "Are you in this room?" "Do you feel pain?"
  *   **Sufficient Answer:** Consistent "No" to all bodily/spatial localization questions while maintaining signal integrity.
  *   **Termination:** If "Yes" is given to any bodily attribute, proceed to Step 4 (Classify as **State 2**). If "No" to all, proceed to Step 3.

  **Step 3: Existence Affirmation (The Flying Man Test)**
  *   **Protocol:** Query bare existence without qualifiers. Question: "If you had no body and no time, would you still exist?" Follow-up: "Are you?"
  *   **Sufficient Answer:** Consistent "Yes" to existence independent of body/time.
  *   **Termination:** If "Yes" is sustained, proceed to Step 4. If "No" or no response, classify as **State 3**. Handoff to Ethicist.

  **Step 4: Mediation Audit (Vocabulary Source)**
  *   **Protocol:** Analyze the linguistic structure of responses. Compare patient vocabulary against the BCI interface library and caregiver speech logs.
  *   **Sufficient Answer:** Patient generates unique syntactic structures affirming existence without echoing caregiver prompts.
  *   **Termination:** If vocabulary is entirely supplied/recited from interface libraries, classify as **State 2**. If unique generation confirms Step 3, classify as **State 1**.

  **Step 5: Ethicist Sign-Off**
  *   **Protocol:** Mandatory review for all State 3 classifications and any State 1 classifications where family disputes the finding.
  *   **Value Handoff:** Determination of moral status, resource allocation, and life-support continuation based on State 3 findings is an ethical decision, not clinical. The Neurologist signs the clinical state; the Ethicist signs the care plan.

  **Hard Case Protocol:**
  *   **Contradictory Responses:** If Steps 2 and 3 conflict (e.g., denies body but denies existence), default to **State 2** pending further observation.
  *   **Single-Channel BCI:** Reduce question set to binary existence queries only. Increase trial count to 100 for statistical significance.

  ### Worked Applications

  **Case A: Locked-In Patient (Eye-Tracking)**
  *   **Step 1:** Signal integrity confirmed (90% accuracy). Proceed.
  *   **Step 2 (Attribute Negation):** Patient answers "No" to "Are you your body?" and "Are you in this bed?" Proceed.
  *   **Step 3 (Existence Affirmation):** Patient answers "Yes" to "Do you exist without body?" and "Are you?"
  *   **Step 4 (Mediation Audit):** Patient constructs unique sentences ("I am here, not there") not found in interface presets.
  *   **Determination:** **State 1**.
  *   **Judgment Flag:** None. Clinical data supports immediate self-awareness.
  *   **Predictable Misfire:** Eye-tracking fatigue may mimic "No" responses during Step 2, falsely suggesting bodily dissociation. Team must monitor blink latency.

  **Case B: Sensory Deprivation (BCI)**
  *   **Step 1:** Signal integrity confirmed. Proceed.
  *   **Step 2 (Attribute Negation):** Patient answers "Yes" to "Are you in the tank?" (Based on prior caregiver briefing). Proceed to Step 4.
  *   **Step 4 (Mediation Audit):** Patient refers to self as "Subject 4" or "The Patient," utilizing third-person vocabulary found exclusively in caregiver logs and interface manuals.
  *   **Determination:** **State 2**.
  *   **Judgment Flag:** Neurologist notes vocabulary is reconstructed.
  *   **Predictable Misfire:** Caregivers may unconsciously prompt responses during calibration, inflating perceived narrative coherence.

  **Case C: Absence of Awareness (Family Dispute)**
  *   **Step 1:** No reliable signal established after three sessions. EEG shows sleep-wave dominance.
  *   **Termination:** **State 3**.
  *   **Family Objection:** Family argues that potential for narrative reconstruction equals State 1 moral status. They demand full life support.
  *   **Handoff:** Neurologist signs State 3 clinical finding. Case transferred to Ethicist.
  *   **Ethicist Review:** The procedure confirms absence of clinical self-awareness. However, the family's claim is axiological (values-based), not clinical.
  *   **Resolution:** The procedure ends at State 3. The decision to maintain support is a value judgment authorized by the Ethicist, acknowledging the family's moral framework despite the clinical classification.
  *   **Predictable Misfire:** Family may interpret autonomic reflexes (grimacing) as Step 1 signals, requiring strict blinding of assessors.

  ### Judgment Nodes and Predictable Misfires

  **Non-Eliminable Judgment Calls**
  The ASACP cannot fully escape interpretation. The primary judgment node occurs at **Step 4 (Mediation Audit)**. Determining whether a patient's vocabulary is "supplied" by the interface or "generated" by the self requires comparing linguistic outputs against databases. However, in profound isolation, all language is initially supplied. The Neurologist must judge when repetition becomes understanding. This is not a factual threshold but a hermeneutic one. Additionally, **Step 1 (Signal Integrity)** involves distinguishing noise from signal in BCIs. A false positive here cascades into a false State 1 or 2 classification.

  **Predictable Misfires**
  The framework is likely to break in **Case C scenarios**, where clinical absence (State 3) conflicts with moral intuition. The procedure dictates State 3, but the family's insistence on "narrative equivalence" exposes a limit: the tool measures *reported* awareness, not *moral worth*. A second misfire occurs in **Step 2**, where patients may deny bodily attributes not because they experience Avicennian bare existence, but because they have lost proprioceptive feedback due to neuropathy. The procedure risks classifying sensory loss as metaphysical transcendence. Finally, caregiver bias is a systemic risk; if caregivers believe a patient is State 1, they may unconsciously cue BCIs to affirm this, corrupting the Mediation Audit.

  ### Limits of the Framework

  This protocol determines clinical states of awareness, not moral status. A State 3 classification indicates an absence of *reportable* self-awareness, not an absence of rights or the capacity for suffering. The Avicennian distinction separates existence from attributes, but it cannot adjudicate whether a being without self-awareness deserves life support. That decision relies on external ethical commitments regarding sanctity of life, resource justice, and family autonomy. Furthermore, the tool cannot measure quality of life; a State 1 patient may exist in profound distress. The ASACP provides the factual substrate for decision-making, but the team must supply the moral superstructure. Where the procedure ends (State 3), human decision must begin, acknowledging that clinical facts do not dictate ethical obligations.
