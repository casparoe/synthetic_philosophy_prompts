answer: |-
  Your rough picture is correct enough to get you into the seminar, but it hides the fault lines. A transcendental argument (TA) isn't just a modal claim; it's a specific *dialectical weapon*. The confusion you're sensing arises because authors slide between three different jobs: **Refutation** (the skeptic is wrong), **Dissolution** (the skeptic is unintelligible), and **Elucidation** (here is the structure of our thought).

  Here is the spec you asked for, broken down by structural necessities versus goal-dependent demands, followed by the "squeeze" where the requirements conflict.

  ### The Spec: Requirements for an Adequate Transcendental Argument

  | Requirement | The Constraint | Rationale | Status |
  | :--- | :--- | :--- | :--- |
  | **1. The Self-Stultifying Premise** | The starting point must be something the skeptic *cannot deny without performing the denial* (e.g., "I have experience," "I am doubting"). | If the skeptic can coherently deny the premise, the argument is just a conditional, not a transcendental proof. | **Non-Negotiable** |
  | **2. The Necessity of the Link** | The connection between Premise ($P$) and Conclusion ($C$) must be conceptual/logical, not causal or empirical. | If the link is empirical, the conclusion is contingent, and the skeptic can imagine a world where $P$ exists without $C$. | **Non-Negotiable** |
  | **3. Anti-IBE Constraint** | The argument cannot rely on "$C$ is the *best* explanation for $P$." It must be "$C$ is the *only possible* condition for $P$." | Inference to the Best Explanation allows for alternative explanations; TAs claim uniqueness. | **Non-Negotiable** |
  | **4. The Ontological Bridge** | If the conclusion is "$C$ is true" (not just "we must believe $C$"), the argument must justify why conceptual necessity entails metaphysical truth. | Without this, you've only described psychology, not the world. (See "Modal Laundering" below). | **Goal-Dependent** (Required for Refutation) |
  | **5. Adversary Neutrality** | The premise must be grantable by the specific skeptic being addressed (e.g., Hume vs. Descartes). | A premise that assumes causality won't work on Hume. The argument must be internal to the skeptic's own commitments. | **Goal-Dependent** (Required for Refutation) |
  | **6. Generalizability** | The argument form should apply across domains (objects, minds, induction). | Often demanded to show the TA reveals a universal structure of rationality. | **Tribal Preference** (System-builders only) |
  | **7. Mind-Independence** | The conclusion must hold even if no subjects exist to think it. | Demanded by realists to avoid idealism. | **Tribal Preference** (Realists only) |

  ---

  ### Handling Your Two Worries

  **1. Modal Laundering (The Stroud Objection)**
  *   **The Problem:** You move from "We cannot but *believe* $P$" to "$P$ is *true$."
  *   **The Acceptable Bridge:** The only non-question-begging bridge is **Verificationism** or **Transcendental Idealism**. You must argue that truth *just is* what is verifiable or intelligible to us. If you are a realist (truth is mind-independent), this move is invalid.
  *   **The Verdict:** If you claim to refute the skeptic about the *external world*, you must accept Idealism. If you want Realism, you must retreat to claiming only that the skeptic's doubt is *idle* (we can't make sense of the alternative), not false.

  **2. Adversary Relativity**
  *   **The Problem:** Is it a defect if the argument only works on a skeptic who grants "language use" but not one who grants only "sense data"?
  *   **The Verdict:** It is **not a defect**. Demanding an argument work against *every* skeptic (e.g., the solipsist *and* the Humean *and* the Cartesian) forces the premise to be so thin ("I am thinking") that it yields no substantive conclusion.
  *   **Rule:** A TA is adequate if it defeats the specific skeptic it targets by using *that skeptic's* commitments against them. The "Generalizability" requirement is a tribal preference of system-builders (like Kant) that often leads to vagueness.

  ---

  ### The Squeeze: Where Requirements Conflict

  You suspected the first job (Refutation) makes the requirements jointly unsatisfiable. You are right. This is **Stroud's Dilemma**.

  1.  **To Refute the Skeptic:** You need **Requirement 4** (Ontological Bridge). You must show the world *is* as you say, not just that we *think* it is.
  2.  **To Satisfy the Realist:** You need **Requirement 7** (Mind-Independence). You must show the conclusion holds independently of our cognitive makeup.
  3.  **The Conflict:** You cannot derive Mind-Independent Truth (7) from Conceptual Necessity (2) without a Verificationist Bridge (4). But Verificationism contradicts Realism (7).

  **The Break Point:**
  *   **If you want Refutation:** Drop **Requirement 7**. Accept that the TA proves the world *for us*, not the world *in itself* (Kant's route).
  *   **If you want Realism:** Drop **Requirement 4**'s strong reading. Admit the TA only shows the skeptic's doubt is *unintelligible* or *pragmatically idle*, not that their hypothesis is *false* (Strawson/Wittgenstein's route).
  *   **If you keep both:** You are guilty of Modal Laundering.

  **Which requirement to drop first?** Drop **Requirement 7 (Mind-Independence)** if you want the argument to do heavy epistemological lifting. TAs are inherently about the relation between *subject* and *object*. Demanding they prove the object without the subject turns them into bad empirical arguments.

  ---

  ### Mini-Evals (Two Lines Each)

  **Kant's Transcendental Deduction**
  *   **Score:** Meets Refutation requirements by accepting Idealism; fails Realist demands.
  *   **Critique:** Successfully bridges belief to truth via Transcendental Idealism, but pays the price of denying knowledge of things-in-themselves.

  **Strawson's *Individuals* (Identification)**
  *   **Score:** Meets Elucidation requirements; fails Refutation requirements.
  *   **Critique:** Shows skepticism is unintelligible within our conceptual scheme, but concedes the skeptic could be right about reality "outside" that scheme.
