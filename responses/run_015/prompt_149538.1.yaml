  This asymmetry reveals a commitment to collective autonomy. The community asserts the right to define the terms of interaction within its spaces. By holding outsiders to stricter standards, the community protects its internal coherence against disruption, treating outsider compliance as a performative act of respect for that autonomy. Conversely, local leniency preserves social cohesion by avoiding excessive policing of members.

  However, the practice is philosophically underdetermined. It fits a contractualist model (entry = consent), but also a communitarian view (norms constitute identity). It could be justified via Scanlonian reasonable rejectability: locals cannot reject norms they help sustain, whereas outsiders can reject them by staying away, so staying implies acceptance. Alternatively, a MacIntyrean view sees these practices as internal goods of a community; outsiders are guests who must honor the practice's integrity, while locals are practitioners allowed nuance. The practice does not strictly presuppose one over the other but requires a distinction between *constitutive rules* (for locals) and *regulative conditions* (for outsiders). It denies moral universalism regarding the *content* of the norms (admitting they are cultural) but asserts a universal demand for *accommodation* from visitors. The tension lies in claiming norms are "just cultural" (optional) while enforcing them as moral duties on non-members, suggesting a hidden universalism about the duty to respect local particularism.

  ### Cross-domain consistency
  The implicit theory diverges across domains, revealing inconsistency. Tipping is treated quasi-contractually; failure is seen as theft of service labor, invoking strong moral sanctions against outsiders. Queuing is treated as a fairness convention; violations are seen as social aggression. Jaywalking, however, often lacks moral weight unless it disrupts flow. The asymmetry is most pronounced in tipping and queuing, where the "outsider penalty" is highest. This suggests the underlying theory is not consistently harm-based (since empty-street jaywalking causes no harm) nor purely contractual (since no service is rendered in queuing). Instead, the consistency lies in *signaling*. Norms that signal cultural literacy (tip percentages, queue formation) attract stricter outsider enforcement because they test willingness to assimilate. Safety norms (jaywalking) are enforced more uniformly or loosely depending on actual risk. Thus, the practice is not governed by a single theory of obligation but by a gradient of *symbolic importance*. Where the norm serves as a boundary marker for group identity, outsider strictness peaks; where it is merely functional, asymmetry fades. This undermines the claim of a coherent moral theory, pointing instead to a sociological mechanism of boundary maintenance disguised as ethics.

