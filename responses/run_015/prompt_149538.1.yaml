          *   Observation: The asymmetry is strongest where the norm signals "knowing the codes."
      *   *Drafting:* The implicit theory diverges across domains, revealing inconsistency. Tipping is treated quasi-contractually; failure is seen as theft of service labor, invoking strong moral sanctions against outsiders. Queuing is treated as a fairness convention; violations are seen as social aggression. Jaywalking, however, often lacks moral weight unless it disrupts flow. The asymmetry is most pronounced in tipping and queuing, where the "outsider penalty" is highest. This suggests the underlying theory is not consistently harm-based (since empty-street jaywalking causes no harm) nor purely contractual (since no service is rendered in queuing). Instead, the consistency lies in *signaling*. Norms that signal cultural literacy (tip percentages, queue formation) attract stricter outsider enforcement because they test willingness to assimilate. Safety norms (jaywalking) are enforced more uniformly or loosely depending on actual risk. Thus, the practice is not governed by a single theory of obligation but by a gradient of *symbolic importance*. Where the norm serves as a boundary marker for group identity, outsider strictness peaks; where it is merely functional, asymmetry fades. This undermines the claim of a coherent moral theory, pointing instead to a sociological mechanism of boundary maintenance disguised as ethics.

  5.  **Drafting - Section 4: Replacement Scenario (~250 words)**
      *   *Goal:* What changes under a strict universalist harm-based framework?
      *   *Analysis:*
          *   No distinction between local/outsider.
          *   Focus on harm (economic, physical, efficiency).
          *   Tipping: If it's wages, it's mandatory for all or none (service charge). If voluntary, no moral sanction for anyone.
          *   Queuing: Only enforce if it causes delay/conflict.
          *   Jaywalking: Only enforce if danger exists.
          *   Institutional changes: Remove tip cards implying moral duty. Standardize rules.
      *   *Drafting:* Under a strict universalist harm-based framework, the asymmetry would vanish. Obligations would depend solely on demonstrable harm (economic loss, physical risk, efficiency reduction), not membership. Tipping would be institutionalized as a mandatory service charge included in prices (eliminating the moral choice) or abolished as voluntary gratuity with no social sanction for omission. Queueing norms would be enforced only when breach causes tangible delay or conflict, regardless of the violator's origin. Jaywalking sanctions would apply only when pedestrian presence creates actual risk, removing the "empty street" moral judgment.

      Institutionally, tip cards would disappear or be rewritten as factual wage explanations rather than moral appeals. Enforcement would shift from informal social policing (glares, comments) to formalized rules applied equally. Explanations would change from "this is our way" to "this prevents harm/loss." The distinction between local ignorance and outsider malice would be irrelevant; only the outcome matters. This would require decoupling norms from cultural identity, treating them as functional coordination mechanisms. The community would lose the tool of using norms for boundary maintenance, potentially reducing social cohesion but increasing fairness. The "opt-in" fiction would be replaced by explicit contracts or neutral public rules, ensuring that normative demands are justified by universalizable reasons rather than particularist belonging.

  6.  **Drafting - Section 5: Confidence and Weakest Point (~150 words)**
