      *   *Point 5 (Scope):* This is the danger zone. Existential risks are often evidence-inert until too late. If the condition excludes them, it's too strong. If it includes them, why is the mugger excluded? The distinction lies in *principled* detectability vs. *practical* latency. Need to clarify this.
