      *   *Structure:* Address the 6 points systematically but fluidly.

      *   *Point 1 (Accuracy):* Clarify bounded utility. Bounded utility prevents infinite EV *alone*. It doesn't need summable weights to converge mathematically, though weights help with rival claimants. The draft conflates convergence of the sum with restoration of ordering amidst rivals.
      *   *Point 2 (Novelty):* It's distinct from complexity priors (description length vs. evidential connectivity). It's distinct from rival claimants (exclusion vs. cancellation). It has an advantage: avoids reference machine arbitrariness.
