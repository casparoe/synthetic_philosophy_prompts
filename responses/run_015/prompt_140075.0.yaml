answer: |-
  ### Memorandum: Principles of Commemoration and Precedent Analysis
  **To:** Chair, Naming and Memorials Commission
  **From:** Senior Consultant, Civic Symbolism & Repair
  **Re:** The Kendrick Bust – Precedent, Principle, and Recommendation

  You are right to feel that the Commission's past decade of decisions lacks a single, explicit algorithm. That is typical. Commemoration is not a court of law; it is a negotiation between history, ethics, and civic identity. However, looking at your nine precedents, I can discern a hidden jurisprudence. You are not applying one rule, but rather balancing three competing frameworks that sometimes align and sometimes conflict.

  Before I give you my recommendation, let's brainstorm the principles that are actually doing the work in your past decisions.

  #### Brainstorming the Hidden Principles

  1.  **The "Captive Audience" Gradient:** You treat spaces differently based on who encounters them and whether they can look away.
      *   *Evidence:* You renamed the elementary school (Case 4) because children are compelled to attend and asked to honor the name. You kept the street name (Case 2) because it is "purely navigation" and adults can ignore it. You kept the Labor Leader statue (Case 6) in a public space where people walk past.
      *   *Implication for Kendrick:* A library lobby is not a school, but it is a civic space where patrons might feel the bust implies institutional endorsement. It is more honorific than a street, less captive than a school.

  2.  **The "Separability" of Legacy:** Can the good be disentangled from the bad?
      *   *Evidence:* The Labor Leader (Case 6) was kept because his organizing (good) was separable from the bombing accusation (bad, and he was acquitted). The Reform Mayor (Case 3) was kept because his infrastructure (good) was separable from his segregationism (bad), *provided* a plaque explained the tension. The Confederate General (Case 1) was removed because the statue *itself* was the symbol of the harm; you cannot separate a Confederate statue from the Confederacy.
      *   *Implication for Kendrick:* Is her civil rights work separable from her tough-on-crime stance? Or are they part of a single political worldview? The Commission has historically said "yes, they are separable" for the Mayor and the Labor Leader.

  3.  **The "Representational Scarcity" Factor:** This is the unstated rule that emerges in Case 7 (Pioneer Mother) and Case 9 (City Name).
      *   *Evidence:* You removed the Pioneer Mother (Case 7) because she was an allegory for dispossession with no specific name to weigh. You kept the City Name (Case 9) arguably because changing it is too hard, but also because you haven't touched the *structure* of the city's identity.
      *   *Implication for Kendrick:* She is the *only* Black person and *only* non-allegorical woman in public sculpture. Removing her doesn't just judge her; it restores a visual landscape of total white male dominance. This creates a "Representational Equity" principle that didn't exist in Case 1 or 5.

  #### Candidate Rules and Predictions

  Here are the three rules that best fit your track record, applied to the Kendrick case.

  | Candidate Rule | Core Logic | Precedent Support | Prediction for Kendrick Bust |
  | :--- | :--- | :--- | :--- |
  | **Rule A: The "Net Civic Contribution" Test** | If the figure's tangible benefits to the city outweigh their moral failures, keep the memorial. Contextualize if failures are significant. | Case 3 (Mayor), Case 6 (Labor Leader) | **Keep in Lobby + Plaque.** Her desegregation work is a massive civic good; her policy errors are significant but do not negate the good. |
  | **Rule B: The "Symbolic Harm" Threshold** | If the memorial causes active harm to a protected group or reinforces systemic exclusion, remove or relocate it to a museum setting. | Case 1 (Confed), Case 5 (Gov), Case 7 (Pioneer) | **Relocate to History Room or Museum.** Her support for coerced confessions harms Black families; her anti-gay rhetoric harms LGBTQ+ citizens. The lobby is too honorific. |
  | **Rule C: The "Representational Justice" Principle** | If the memorial landscape is demographically skewed, the scarcity of representation for marginalized groups creates a presumption against removal, even for flawed figures. | Case 7 (implied inverse), Case 9 (status quo bias) | **Keep in Lobby (No Move).** Removing the *only* Black figure reinforces the white-male dominance the Commission implicitly critiques in Case 1 and 7. |

  #### The Recommendation

  Do not move the bust. Do not remove it. **Keep the bust in the library lobby, but commission a robust, unflinching interpretive plaque.**

  Here is why I am not sitting on the fence:

  **1. Consistency with the "Mixed Legacy" Precedent (Case 3)**
  The closest analog is Case 3, the Reform Mayor. He built the sewers (good) but wrote the segregation ordinance (bad). You kept him with a plaque. Kendrick desegregated the schools (good) but supported coercive policing (bad). The Commission has already established that local governance involves moral compromise, and that "canceling" a figure for policy failures—when they also delivered tangible justice—is not the Commission's role. Case 6 (Labor Leader) reinforces this: you kept a man accused of bombing because his labor organizing was separable. Kendrick's civil rights work is separable from her penal policy.

  **2. The Moral Weight of Identity (Addressing your specific question)**
  You asked if it matters morally that she is a Black woman in a landscape of white men. **Yes, it is a principled concern, not just a tiebreaker.**
  Commemoration is not just about judging the dead; it is about signaling to the living *who belongs in the story of this city.*
  *   In Case 1 (Confederate General) and Case 7 (Pioneer Mother), you removed symbols that signaled *exclusion* (white supremacy, dispossession).
  *   If you remove Kendrick, you are not removing a symbol of exclusion; you are removing the *only* symbol of inclusion.
  *   To remove her would be to return the visual landscape to 100% white male representation. That contradicts the spirit of Case 7 (rejecting narratives of dispossession). A principle of "Representational Justice" dictates that when a group has been historically excluded from public memory, their flawed representatives deserve a higher threshold for removal than the representatives of the dominant class. The Confederate General (Case 1) had thousands of statues; Kendrick has one. The equity calculation is different.

  **3. The Location Question**
  The Library Staff suggested moving it to the Local History Room. This mimics Case 5 (the Governor). I advise against this. Case 5 involved a figure whose *primary* legacy was segregation. Kendrick's primary legacy is desegregation. Moving her to a "history room" while white male figures remain in "lobbies" and "squares" functionally segregates the memory of Black leadership. It treats Black history as "archival" and White history as "civic." Keep her in the lobby to maintain the visual claim that Black women belong in the center of civic life.

  **4. The Family Funding Threat**
  Should you discount it? **Principally, yes. Practically, no.**
  You cannot allow private funding to hold democratic decision-making hostage. If the rule is "Keep it because they pay," you corrupt the Commission. However, the teen reading prize is a tangible public good. In your deliberation, you should state clearly: *"We are keeping this bust based on merit and precedent, not funding. We regret the potential loss of the prize, but that is a consequence of the family's choice, not the Commission's."* This insulates you from the charge of bribery while acknowledging the cost.

  #### The Plaque Text
  If you keep it, the plaque must avoid hagiography. It should follow the Case 3 model (interpretive, not defensive). It should read roughly:

  > **Ora Bell Kendrick (19XX–19XX)**
  > Elected in 19XX, Kendrick was the first Black woman to serve on the City Council. She led the successful fights to desegregate the city's public schools and housing, transforming access for thousands of residents.
  >
  > Her legacy is complex. During the late 1970s, Kendrick championed strict habitual-offender laws and defended police practices that were later found to involve coerced confessions. She also opposed the 1978 gay-rights ordinance. This bust, installed in 1981, honors her pioneering role in expanding civil rights, while acknowledging the controversies of her later tenure.

  #### The "Test Case" for the Future
  You asked for one further case to put on the docket to tell the leading rules apart. I recommend you proactively study:

  **A statue of a Union Army General who fought to end slavery but also led a campaign that massacred Indigenous civilians.**

  *   **Why:** This pits **Rule A (Net Contribution)** against **Rule B (Symbolic Harm)**.
  *   **The Conflict:** Under Rule A, he is a hero (ended slavery). Under Rule B, he is a perpetrator of dispossession (like the Pioneer Mother, Case 7).
  *   **The Test:** If you keep him, you affirm that "Anti-Black Racism" is the only harm that triggers removal. If you remove/relocate him, you affirm that "Indigenous Dispossession" carries equal weight in your symbolism jurisprudence. This will force the Commission to decide if your principles are universal or specific to the Black/White binary.

  #### Summary
  Stick to the **Case 3 Precedent (Keep + Plaque)**. It is the most robust fit for a flawed civic leader. Do not be swayed by the **Case 5 Precedent (Relocation)** because Kendrick is not a segregationist; she is an integrationist with blemishes. Do not be swayed by the **Case 1 Precedent (Removal)** because she does not represent a system of oppression, but rather a marginalized group's entry into power.

  Move forward with the plaque. It is the only path that honors the truth, the precedent, and the city's need for a diverse civic mirror.
