      **2. Fink Event Liability.**
      Coverage excludes "Fink Events," defined as instances where the triggering condition causes the Power to vanish prior to manifestation. For example, if a fragile vase is struck and instantly becomes non-fragile upon impact thereby avoiding breakage, this constitutes a Fink Event. DispositionGuard™ denies claims where the stimulus modifies the intrinsic basis of the Power simultaneously with activation. Clients must ensure their Powers are stable under stimulation.

      **3. Mask Exclusions.**
      Claims resulting from "Masking" are excluded. A Mask occurs when an extrinsic factor prevents manifestation despite the Power remaining intact. If a soluble sugar cube is coated in wax preventing dissolution, the solubility is masked, not lost. DispositionGuard™ considers Masks external interference. Clients are responsible for isolating their Subjects from interfering fields, packing materials, or antidotes that obstruct the natural expression of the insured Power.

      **4. Multi-Track Coverage.**
      Powers exhibiting multiple manifestation channels require Premium Tier B. A single-track Power manifests identically under all conditions. A multi-track Power (e.g., a substance toxic to humans but not rats) requires separate valuation per manifestation type. Failure to declare all possible manifestation tracks constitutes fraud. DispositionGuard™ is not liable for unmanifested tracks discovered post-subscription.

      **5. Manifestation-Condition Circularity Waiver.**
      The Client waives the right to define the Power solely via conditional statements (e.g., "breaks if struck"). Such definitions are deemed circular if they presuppose the Power they define. DispositionGuard™ reserves the right to demand a non-categorical account of the Power's essence. If the definition relies on the manifestation to explain the Power, and the Power to explain the manifestation, the contract is considered semantically void.

      **6. Intrinsic/Extrinsic Distinction.**
      Coverage applies strictly to intrinsic Powers. If the Power's existence depends on relational properties or external laws (e.g., weight depending on gravity), it is classified as extrinsic and ineligible. Clients must demonstrate the Power resides wholly within the Subject Object's boundaries. DispositionGuard™ assumes a locality principle; action at a distance voids liability.

