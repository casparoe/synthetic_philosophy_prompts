answer: |-
  # The 30-Minute Fixed-Price Sanity Check

  **Purpose:** Prevent profitable projects from becoming losses by forcing a disciplined outside view before a number leaves the building.
  **Owner:** Project Lead (Engineering)
  **Timebox:** 30 Minutes hard stop.
  **Rule:** If you cannot complete this sheet in 30 minutes, you do not have enough information to bid fixed-price.

  ---

  ## Step 1: The Reference Class Audit (10 Minutes)
  *Goal: Stop yourself from gerrymandering the data to make the bid look easier.*

  1.  **List Similar Past Projects:** Write down every project your team has delivered in the last 3 years that resembles this one.
      *   *Adequate Answer:* At least 3 project names. If fewer than 3, skip to **Step 1B**.
  2.  **The Exclusion List:** Look at your list. Are there projects you want to exclude because "this one is different"?
      *   **The Physical Evidence Rule:** You may only exclude a past project if you have **physical proof** today that distinguishes this project from that one.
          *   *Valid:* "Past project had no API docs; this one has verified Swagger specs attached."
          *   *Invalid:* "Past client was slow to respond; this client seems nicer." (Hope is not evidence).
          *   *Invalid:* "The schema is documented this time." (Unless you have seen the docs *and* verified them, treat as undocumented).
      *   *Action:* Cross out any exclusions that violate the Physical Evidence Rule. Put them back in the list.
  3.  **The Count Check:** How many projects remain in your valid reference class?
      *   **If 0-2:** You have no reference class. You are building something new. **Mark "NO REF CLASS" and go to Step 2.**
      *   **If 3+:** Calculate the average actual hours spent on these projects (not the estimate, the *actual*). This is your **Baseline**.

  **1B: No Reference Class Protocol**
  *   If you marked "NO REF CLASS" above, you cannot generate a fixed price based on history.
  *   **Action:** Your baseline estimate is a guess. You must apply the maximum "Unknown Tax" in Step 2.

  ---

  ## Step 2: The Unknown Tax (10 Minutes)
  *Goal: Build epistemic modesty into the number. Acknowledge what you don't know.*

  1.  **Identify External Dependencies:** List every thing you need from the client or a third party to finish (e.g., API access, brand assets, legacy server credentials).
      *   *Count:* ___ items.
  2.  **Calculate The Buffer:**
      *   **Scenario A (Valid Ref Class):** Take your **Baseline** from Step 1. Add **20%** for every External Dependency listed above.
      *   **Scenario B (No Ref Class):** Take your **Guess**. Add **50%** flat.
  3.  **Generate The Range:**
      *   **Best Case:** The Buffered Number minus 10%.
      *   **Worst Case:** The Buffered Number plus 50%.
      *   **The Width Check:** Is the Worst Case more than 1.5x the Best Case?
          *   **YES:** **STOP.** Do not bid fixed-price. The uncertainty is too high. Offer Time & Materials or a Discovery Phase only.
          *   **NO:** Proceed to Step 3.

  ---

  ## Step 3: The Decision Matrix (10 Minutes)
  *Goal: Separate engineering facts from business risk.*

  1.  **Compare to Client Expectations:** Does your **Best Case** number exceed what the client expects to pay or wait?
      *   **YES:** **Escalate to Partner.** This is a business decision (do we eat margin to win the work?), not an engineering one.
      *   **NO:** Proceed to 2.
  2.  **Check The "Quick" Flag:** Did the client describe this as "quick," "simple," or "small"?
      *   **YES:** Compare your **Baseline** to their definition of "quick." If your Baseline is >2x their definition, **Escalate to Partner.** (This indicates a high probability of scope conflict later).
      *   **NO:** Proceed to 3.
  3.  **Final Sign-off:**
      *   Attach this sheet to the bid.
      *   Submit the **Worst Case** number as the fixed price (or the Baseline + Buffer, depending on your margin requirements).
      *   **Submit Bid.**

  ---

  ## What This Procedure Cannot Do
  *   **It cannot stop scope creep:** If the client adds features later, this sheet is void. You need a change order process.
  *   **It cannot predict people:** It assumes your key engineers don't quit mid-project.
  *   **It relies on honesty:** A lead can lie on the "Exclusion List." This procedure trusts but verifies via the Partner escalation path.
  *   **It is not a strategy:** It protects you from losing money on bad bets; it does not help you win competitive bids where others are underbidding recklessly.

  ---

  ## Procedure Run-Throughs

  ### Case 1: Data Migration (6 past projects, "documented schema" this time)
  *   **Step 1:** Lead lists 6 past migrations. Lead wants to exclude all 6 because "this one is documented."
  *   **Audit:** Have we done a *documented* migration before? If no, we have 0 data points on how much time documentation saves.
  *   **Rule Application:** "Documented" is not verified physical evidence until seen. Even if seen, without historical data on "documented vs undocumented," you cannot exclude the 6 past projects.
  *   **Result:** Reference Class = 6 projects. Baseline = Average of those 6.
  *   **Step 2:** Dependencies identified. Buffer applied (20%). Range generated.
  *   **Step 3:** If the resulting number is higher than the client expects because they assume "documented = fast," this is a communication gap.
  *   **Verdict:** **Bid 6 weeks (conservative).** (Use the historical average of the 6 messy ones, do not discount for the documentation unless you have data proving it saves time).

  ### Case 2: LLM Support Triage (Never built, client wants number Friday)
  *   **Step 1:** Lead lists 0 past projects.
  *   **Audit:** Count is 0. Mark "NO REF CLASS."
  *   **Step 2:** Estimate is a guess. Apply 50% Unknown Tax. Generate Range.
  *   **Width Check:** Because the baseline is a guess and the tax is 50%, the Worst Case will almost certainly be >1.5x the Best Case.
  *   **Rule:** Stop. Do not bid fixed-price.
  *   **Verdict:** **Decline fixed-price.** (Offer Discovery Phase to build a reference class).

  ### Case 3: Big Client "Quick" Integration (Gut feeling says risky)
  *   **Step 1:** Reference class exists (integrations). Baseline calculated (e.g., 4 weeks).
  *   **Step 2:** Buffer applied. Worst Case = 6 weeks.
  *   **Step 3:** Client expects "Quick" (2 weeks). Your Best Case (4 weeks) is >2x their expectation.
  *   **Rule:** "Quick" Flag triggered. Baseline > 2x Client Definition.
  *   **Action:** Escalate to Partner.
  *   **Reasoning:** The math says 4-6 weeks. The relationship says "don't tell them no." This is a risk appetite decision, not an engineering fact. The Partner must decide if we eat the overrun cost to keep the client happy.
  *   **Verdict:** **Escalate to partner.**

  \answer{case1: Bid 6 weeks (conservative) | case2: Decline fixed-price | case3: Escalate to partner}
