          5.  (Mech, Minority, Robust): **Institutional Crystallization**. (Awkward: The cause died, but we credit the corpse).
          6.  (Mech, Majority, Falsified): **Voluntarist Idealism**. (Awkward: Requires constant religious renewal to keep economy running).
          7.  (Mech, Majority, Robust): **Civilizational Essence**. (Awkward: Culture becomes indistinguishable from biology/geography).
          8.  (Unoccupied): **Reverse Causality** (Economy creates Belief). *Wait, this fits better under No Mechanism.* Let's make Leaf 8 "Unoccupied" as per prompt instruction to identify empty combos.
          *Correction:* The prompt asks for 6-9 leaves, named positions OR unoccupied. Let's aim for 8 based on the 2x2x2 structure.
          *Wait, Node 1 is Binary (Yes/No). Node 2 is Binary (Minority/Majority). Node 3 is Binary (Falsified/Robust).*
