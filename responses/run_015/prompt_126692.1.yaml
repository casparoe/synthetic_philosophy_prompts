          *   7 (Yes, Majority, Robust): **Cultural Essence**. (Awkward: Culture becomes racial/biological).
          *   8 (No, Minority, Falsified): **Selection/Screening**. (Awkward: Belief was a gatekeeper, not a fuel).

      *   *Wait, I need to check the "No Mechanism" branch.* If No Mechanism, Node 2 and 3 still apply logically, even if the position is weak.
      *   *Re-evaluating Leaf 2 (No Mech, Minority, Robust):* If it's just selection (rich people become Calvinist), and Calvinism dies but richness stays... that's just "Rich people stay rich." That's **Class Reproduction**. Not incoherent.
      *   *Let's find a better Empty/Incoherent one.*
