      *   Let's look for **No Mechanism + Majority + Falsified**. If there is no mechanism, it's spurious. If belief dies and economy dies, it implies the belief *was* necessary, contradicting "No Mechanism." -> **Incoherent**. (You can't claim no causal path but admit the cause is necessary).

