answer: |-
  # DECISION TREE: THE CULTURAL CAUSE CLAIM
  **Start Node:** You have a decent, replicated correlation between a widely shared value or belief in some population P and an economic outcome E, and you want to know what you are licensed to say.

  ```text
  │
  ├─ Q1: MECHANISM
  │  Can you describe the specific daily action the belief demands 
  │  without using the words "profit," "wealth," "success," or "E"?
  │
  │  ├─ NO (Action is indistinguishable from outcome)
  │  │  │
  │  │  ├─ Q2: COMPOSITION
  │  │  │  If only 5% of P held this belief, would E still emerge?
  │  │  │
  │  │  │  ├─ NO (Requires Majority)
  │  │  │  │  │
  │  │  │  │  └─ Q3: PERSISTENCE
  │  │  │  │     If belief dies in Gen 2 but E continues, is your claim falsified?
  │  │  │  │     │
  │  │  │  │     ├─ YES → [LEAF 1: INCOHERENT POSITION]
  │  │  │  │     │        (You deny a mechanism but admit necessity)
  │  │  │  │     │
  │  │  │  │     └─ NO  → [LEAF 2: MATERIAL DETERMINISM]
  │  │  │  │              Awkward Commitment: Ideas are purely decorative smoke 
  │  │  │  │              that happens to trail every material fire.
  │  │  │  │
  │  │  │  └─ YES (Minority sufficient)
  │  │  │     │
  │  │  │     └─ Q3: PERSISTENCE
  │  │  │        If belief dies in Gen 2 but E continues, is your claim falsified?
  │  │  │        │
  │  │  │        ├─ YES → [LEAF 3: SCREENING / SELECTION EFFECT]
  │  │  │        │        Awkward Commitment: Theology was just a job interview 
  │  │  │        │        for pre-existing capitalist traits.
  │  │  │        │
  │  │  │        └─ NO  → [LEAF 4: CLASS REPRODUCTION]
  │  │  │                 Awkward Commitment: Culture is just a fence built 
  │  │  │                 around assets to keep outsiders out.
  │  │  │
  │  │
  │  └─ YES (Action distinct from outcome)
  │     │
  │     ├─ Q2: COMPOSITION
  │     │  If only 5% of P held this belief, would E still emerge?
  │     │
  │     │  ├─ NO (Requires Majority)
  │     │  │  │
  │     │  │  └─ Q3: PERSISTENCE
  │     │  │     If belief dies in Gen 2 but E continues, is your claim falsified?
  │     │  │     │
  │     │  │     ├─ YES → [LEAF 5: VOLUNTARIST IDEALISM]
  │     │  │     │        Awkward Commitment: Capitalism requires constant 
  │     │  │     │        religious revival or it collapses.
  │     │  │     │
  │     │  │     └─ NO  → [LEAF 6: CIVILIZATIONAL ESSENCE]
  │     │  │              Awkward Commitment: Culture becomes indistinguishable 
  │     │  │              from biology or geography over time.
  │     │  │
  │     │  └─ YES (Minority sufficient)
  │     │     │
  │     │     └─ Q3: PERSISTENCE
  │     │        If belief dies in Gen 2 but E continues, is your claim falsified?
  │     │        │
  │     │        ├─ YES → [LEAF 7: WEBER'S SECTARIANISM]
  │     │        │        Awkward Commitment: The majority were dragged kicking 
  │     │        │        into modernity by a pious minority's anxiety.
  │     │        │
  │     │        └─ NO  → [LEAF 8: INSTITUTIONAL CRYSTALLIZATION]
  │     │                 Awkward Commitment: We credit dead ideas for the 
  │     │                 work living institutions now do.
  │     │
  │
  └── (END)
  ```

  ### REASONS FOR THIS ORDERING
  1.  **Mechanism First:** If you cannot trace the content of the belief to an action distinct from the outcome (e.g., "keep ledgers" vs. "get rich"), you do not have a cultural theory; you have a description of the outcome. This filters out tautologies before wasting time on demographic scope.
  2.  **Composition Second:** Weber's specific claim is *not* that all Protestants were capitalists, but that a specific sect's discipline coerced the wider market. Distinguishing "Mass Ethos" from "Vanguard Discipline" early prevents the "everyone believed" fallacy.
  3.  **Persistence Last:** This is the historical test (the "Iron Cage"). It is the hardest data to access (requiring longitudinal history), so it serves as the final stress test for the causal claim's longevity.

  ### WHERE THE TREE GOES SILENT
  **The Institutional/Cultural Boundary:** The tree cannot empirically separate **Leaf 6 (Civilizational Essence)** from **Leaf 8 (Institutional Crystallization)**. Once the belief has died out (Persistence = NO), historical records rarely preserve whether the initial trigger was a Minority or Majority consensus. Both leaves result in the same observable reality: a self-sustaining economic system with cultural origins that are no longer active. You cannot adjudicate between them with this tree alone; you need archival evidence of the *founding moment* that the tree assumes you might not have.

  ### FLAGGED COMBINATIONS
  **1. Indistinguishable Leaves:** **Leaf 6** and **Leaf 8**.
  *Reason:* Both posit that the economy outlives the belief. Without precise data on the *initial* adoption rate (which is often lost to history), a "Majority Essence" that institutionalizes looks identical to a "Minority Vanguard" that institutionalizes.

  **2. Empty Combination:** **Leaf 1 (No Mechanism / Majority / Falsified)**.
  *Status:* **Incoherent.**
  *Reason:* You cannot claim there is no causal path from belief to action (No Mechanism) while simultaneously admitting that removing the belief destroys the outcome (Falsified). This admits necessity while denying mechanism.
