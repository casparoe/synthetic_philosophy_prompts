answer: |-
  ### Practice Essay Question

  **Module:** MET204 Metaphysics
  **Topic:** Material Constitution
  **Time Allowed:** 45 Minutes

  **Question:**

  Consider the following case: The University Art Club sculpts a life-size horse (**Statue**) from a single batch of clay (**Lump**). Over ten years, weather-damaged fragments are replaced bit by bit until none of the original clay remains in the horse-shaped object (**Horse-Shape**). The removed fragments are kept in a jar and later compressed into a plain block (**Clay-Block**).

  Write an essay that addresses the following:
  1.  Explain the Leibniz Law argument from survival under squashing that challenges the identification of the Statue and the Lump.
  2.  Evaluate the monist reply that modal and persistence claims are sensitive to the sortal under which the object is considered.
  3.  On both coincidentalist and monist views, determine whether the Horse-Shape or the Clay-Block is best identified with the original Statue and the original Lump.

  ***

  ### Model Answer

  The case presented combines the puzzles of material constitution with Ship of Theseus-style replacement, testing competing theories of persistence. The central metaphysical tension lies in whether the Statue and the Lump are one object or two.

  The standard argument for distinctness relies on Leibniz's Law: if $x$ and $y$ are identical, they must share all properties. Consider a scenario where the object is squashed. The Lump could survive being squashed into a sphere, retaining its matter. However, the Statue could not survive squashing, as losing its specific shape destroys its artistic function and identity. Since the Lump has the property 'can survive squashing' and the Statue lacks it, they possess different modal properties. By Leibniz's Law, they cannot be identical. This supports coincidentalism: two distinct objects occupy the same space at the time of sculpting but have different persistence conditions.

  Monists reject this duplication as ontologically extravagant. They argue that modal and persistence claims are not absolute but sortal-sensitive. As defended by philosophers like Lynne Baker, properties are relative to the concept under which the object is considered. There is only one entity here. Under the sortal 'statue', it cannot survive squashing; under the sortal 'lump of clay', it can. The contradiction vanishes because the properties are relativised: the object is statue-wise fragile but clay-wise durable. This preserves intuition without multiplying entities.

  Applying these views to the Art Club case requires analysing persistence through replacement. For the coincidentalist, the original Statue and original Lump diverge. The Statue persists where there is continuity of form and function; thus, the **Horse-Shape** is the original Statue. The Lump persists where there is continuity of matter; thus, the **Clay-Block** (containing all original fragments) is the original Lump. They coincide initially but separate as replacement occurs.

  For the monist, only one object exists, so only one successor can be the true survivor. If the dominant sortal is 'artwork', the Horse-Shape is the original object, and the Clay-Block is merely discarded matter. If the dominant sortal is 'material quantity', the Clay-Block is the survivor, and the Horse-Shape is a temporary arrangement. A sophisticated monist might argue that 'statue' is the constitutive sortal, favouring the Horse-Shape. However, this faces the intuition that the original matter is preserved in the block.

  In conclusion, coincidentalism handles the divergence cleanly by accepting two objects, whereas monism relies on the contentious claim that persistence is sortal-relative. Both must explain why one successor is privileged, but coincidentalism better accommodates the distinct modal profiles revealed by the squashing argument.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Explanation of Leibniz Law Argument (5 Marks)**
  *   **5:** Clearly states Leibniz's Law (Indiscernibility of Identicals). Correctly identifies divergent modal properties regarding survival under squashing (fragility vs. durability).
  *   **3-4:** States the law but explains the modal difference vaguely.
  *   **1-2:** Mentions Leibniz's Law but fails to apply it to squashing/survival.

  **2. Evaluation of Monist/Sortal Reply (5 Marks)**
  *   **5:** Expl sortal relativisation of properties (not just linguistic). Evaluates plausibility (e.g., ontological parsimony vs. counter-intuitiveness).
  *   **3-4:** Explains sortal sensitivity but treats it as merely linguistic or fails to evaluate its strength.
  *   **1-2:** Mentions monism but confuses it with reductionism or ignores sortals.

  **3. Application to Case (Statue/Lump Identification) (5 Marks)**
  *   **5:** Correctly maps Horse-Shape to Statue (form) and Clay-Block to Lump (matter) for coincidentalists. Discusses the 'one object' dilemma for monists.
  *   **3-4:** Identifies successors correctly but fails to distinguish how monists vs. coincidentalists treat the divergence.
  *   **1-2:** Incorrectly identifies successors or ignores the replacement aspect.

  **4. Structure and Clarity (5 Marks)**
  *   **5:** Logical flow, precise terminology, British English spelling (e.g., 'analyse', 'favour').
  *   **3-4:** Understandable but disjointed or minor errors.
  *   **1-2:** Disorganised or difficult to follow.

  **Differentiation: First-Class (17–20) vs. Upper-Second (14–16)**

  *   **First-Class Answers:**
      *   **Specific Move 1:** Explicitly articulate that sortal sensitivity modifies the *truth conditions* of modal claims, not just our description of them (avoiding the 'linguistic fallacy').
      *   **Specific Move 2:** In the application section, recognise that for the monist, the Clay-Block and Horse-Shape compete for identity with the *same* single object, whereas for the coincidentalist, they are identities of *different* objects.
      *   **Specific Move 3:** Offer a critical judgement on which view handles the 'replacement' intuition better (e.g., noting that monism struggles to explain why the block isn't the survivor if matter is fundamental).

  *   **Upper-Second Answers:**
      *   **Specific Move 1:** Correctly explain Leibniz's Law and the squashing case but may treat sortal sensitivity as a semantic workaround rather than a metaphysical claim.
      *   **Specific Move 2:** Correctly identify the Horse-Shape with the Statue and Clay-Block with the Lump but may not fully explicate the metaphysical implication of this divergence for monism.
      *   **Specific Move 3:** Structure is clear, but the evaluation lacks critical depth regarding the cost of each view (e.g., proliferation of objects vs. sortal relativity).
