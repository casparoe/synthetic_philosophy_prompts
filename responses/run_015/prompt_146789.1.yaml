      *   Also, the tension between "Cross-domain" and "LM Exceptionalism." If the theory works for thermostats, it might be too coarse for LLMs. If it's specific to LLMs, it violates cross-domain. I need to suggest a *spectrum* or *graded* agency rather than binary.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the pragmatism. Validate the need for a spec.
