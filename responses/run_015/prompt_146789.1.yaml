      *   *Check:* Is the distinction between "Speech," "Process," and "Reliability" clear? I need to make sure the requirements enforce this separation.

  12. **Final Polish:** Ensure the distinction between "Simulator" (predicts text) and "Agent" (pursues goals) is treated as a functional distinction in the requirements, not a metaphysical one. The key is *control loops*.

  *(Self-Correction on the "Single Requirement"):* Is it Actionability or Boundaries? Actionability is the *goal*, Boundaries is the *mechanism*. If I don't know where the agent ends, I can't know what action to take. But Actionability is the *test*. I will stick with Actionability/Difference-Maker as the primary filter because a theory can have clear boundaries but still be useless if it doesn't change decisions.

  *(Self-Correction on Incompatibility):* The user asks for a theory that says "what the system really is" but also "no consciousness." This is the classic Behaviorism vs. Realism debate. I need to point out that "what it really is" must be cashed out as "how it is reliably modeled."

