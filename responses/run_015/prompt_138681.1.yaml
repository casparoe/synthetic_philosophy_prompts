      *   *Check:* Did I address Pozzo? Yes, make sure to highlight Act II where Pozzo is blind. That adds nuance (the "God" figure is broken).
      *   *Check:* Did I answer the "waiting" question? Yes, link it to existential meaning vs. theological promise.

  7.  **Final Output Structure:**
      *   Intro: Validate the idea, it's strong but needs nuance.
