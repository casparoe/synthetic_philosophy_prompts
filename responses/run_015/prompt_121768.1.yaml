answer: |-
  ### I. Restatement in Native Vocabulary

  Let there be a set of agents $N = \{1, \dots, n\}$. Each agent $i$ possesses a preference ordering over outcomes $X$, represented by a von Neumann-Morgenstern utility function $u_i: X \to \mathbb{R}$.

  There exists a status quo outcome $x_{SQ} \in X$, which serves as the **disagreement point** $d = (u_1(x_{SQ}), \dots, u_n(x_{SQ}))$. Let $S \subset \mathbb{R}^n$ be the **feasible set** of utility vectors achievable through joint action or policy selection $\pi \in \Pi$.

  The thesis states: $S$ is not a singleton, and $d$ is not Pareto efficient within $S$. There exists an outcome $x^* \in X$ (or a lottery over outcomes) yielding utility vector $u^* \in S$ such that $u^*_i \geq d_i$ for all $i$, with strict inequality for at least one $i$.

  The "compromise" is the selection of a specific $u^*$ on the Pareto frontier of $S$. This selection is determined by a bargaining solution concept (e.g., Nash Bargaining Solution maximizes $\prod (u_i - d_i)$, or Kalai–Smorodinsky equalizes proportional gains). The "gains from trade" are the vector differences $(u^*_i - d_i)$.

  ---

  ### II. The Three Pin-Downs

  #### 1. Non-Transferable Utility and the Load-Bearing Assumption
  You are correct that moral disagreements rarely admit a transferable numeraire (quasi-linearity fails). We are in a **Non-Transferable Utility (NTU)** environment.

  *   **Well-Definedness:** For gains from trade to be well-defined without transferable utility, we do not need a numeraire. We only require that the feasible set $S$ is **comprehensive** and **non-convexities are resolvable**. The "trade" framing is **load-bearing** only to the extent that it asserts the problem is non-zero-sum. If the game is strictly zero-sum (the Pareto frontier is a hyperplane with slope -1 everywhere relative to some metric), $S$ contains no point strictly Pareto-superior to $d$ for all agents.
  *   **Assumption Required:** The critical assumption is **correlated preferences**. It must be the case that the marginal rate of substitution between policy dimensions differs across agents. If Agent 1 cares intensely about dimension $A$ and weakly about $B$, and Agent 2 cares intensely about $B$ and weakly about $A$, the contract curve allows movement away from $d$.
  *   **Verdict:** The trade framing is not decorative; it is the assertion that the game has a non-empty **Core** relative to the disagreement point. Without the assumption of divergent intensity of preferences across orthogonal policy dimensions, the feasible set $S$ collapses to the disagreement point or a zero-sum frontier, and "gains" vanish.

  #### 2. Mixture over Policies vs. Utility Functions vs. SWF
  In static settings, these are often isomorphic. In sequential settings, they diverge sharply.

  *   **Mixture over Policies:** This is a commitment to a stochastic mechanism ex-ante. We select a lottery $\sigma \in \Delta(\Pi)$. Expected utility is $E_\sigma[u_i]$. This convexifies $S$.
  *   **Mixture over Utility Functions (Harsanyi Aggregation):** We construct a Social Welfare Function $W = \sum \alpha_i u_i$ and maximize $W$ over $\Pi$.
  *   **Sequential Divergence:**
      *   If you commit ex-ante to a **policy mixture** (a constitutional lottery), you preserve ex-ante Pareto efficiency.
      *   If you commit ex-ante to **maximizing a weighted SWF** sequentially, you face **dynamic inconsistency**. At time $t_2$, the weights $\alpha_i$ that were optimal at $t_1$ may no longer maximize the current aggregate utility if the state has changed, unless the weights are hardcoded into the mechanism.
      *   If you re-negotiate the weights at every node (sequential bargaining), you generally converge to the **dictatorship of the present** (or the agent with the best outside option at that node), destroying the ex-ante gains.
  *   **Verdict:** The rationalist compromise argument leans heavily on **ex-ante mixture over policies** (randomized constitutions) or **ex-ante commitment to fixed weights in an SWF**. It fails if it assumes agents will simply "re-optimize the compromise" at every sequential step without commitment devices. The argument implicitly assumes **Incentive Compatibility** holds for the commitment mechanism; if agents can defect ex-post when the coin flip goes against them, the compromise is not a Subgame Perfect Equilibrium.

  #### 3. Deontology, Side-Constraints, and Integrity
  *   **Representation:** Standard utility theory can represent deontological constraints via **lexical preferences** or **infinite disutility**. Let $C \subset X$ be the set of constrained outcomes. Define $u_i(x) = -\infty$ for all $x \in C$. The feasible set $S$ is truncated.
  *   **The Integrity Objection:** The "dirty hands" objection is often that the agent's utility function is **history-dependent** or **action-dependent**, not just outcome-dependent. $u_i(\pi, h)$, where $h$ includes the agent's own past actions.
  *   **Limitation:** You can model this, but only by expanding the outcome space to include "I performed action $\pi$." However, this turns integrity into a **consumption good**.
  *   **Verdict:** You can represent side-constraints by restricting the domain of $\Pi$. You can represent integrity costs by adding penalty terms to $u_i$. However, you cannot represent the objection that "compromising violates the *structure* of agency" without treating that structure as just another preference parameter. If the objection is that the agent *ought not* to have a utility function that permits trade on certain dimensions, this vocabulary has no purchase; it treats all preferences as sovereign inputs.

  ---

  ### III. The Residue Report

  Here is what has no expression in this vocabulary.

  #### 1. Endogenous Preference Change (The "Surviving Self" Problem)
  Your suspicion is correct. The vocabulary treats $u_i$ as a **primitive**. It is a fixed mapping from states to reals.
  *   **The Blind Spot:** The model cannot distinguish between **satisfying** a preference and **transforming** the preference holder.
  *   **The Mechanism:** In a deep compromise, agents often adopt new norms, languages, or values to facilitate coordination. In your vocabulary, this looks like a state transition where $u_i^{t+1} \neq u_i^t$.
  *   **The Evaluation Gap:** If the deal is evaluated by $u_i^t$ (ex-ante), it is a gain. If the deal transforms the agent into a type $i'$ who evaluates the outcome via $u_{i'}^{t+1}$, and $u_{i'}^{t+1}$ rejects the deal (e.g., "I am now a purist and regret the compromise"), the vocabulary has no way to adjudicate which utility function is the **normative authority**.
  *   **Expression Failure:** The vocabulary can model the *fact* of preference change (as a stochastic shock or investment), but it cannot model the *validity* of the change. It cannot say whether the agent was "corrupted" or "educated." It treats the pre-compromise self and post-compromise self as distinct agents in a dynamic game, but offers no meta-criterion for identity continuity.

  #### 2. The Ontology of the Disagreement Point
  The model takes $d$ (the status quo/no-deal option) as exogenous.
  *   **The Blind Spot:** In moral/political contexts, the status quo is often a site of contestation. Defining $d$ is itself a political act.
  *   **Expression Failure:** The vocabulary assumes the disagreement point is a feasible outcome with known utilities. It cannot model the strategic manipulation of the *perception* of $d$ (threat points) as distinct from the actual physical fallback, other than as incomplete information. It cannot capture the normative claim that certain disagreement points are illegitimate (e.g., "you can't threaten to kill me to get a better bargain"), except by arbitrarily restricting the feasible set $S$.

  #### 3. Incommensurability as Structural, Not Quantitative
  The vocabulary assumes utilities are real numbers ($\mathbb{R}$).
  *   **The Blind Spot:** This forces all values onto a single cardinal scale.
  *   **Expression Failure:** If two values are truly incommensurable (no trade-off rate exists, not even a non-linear one), they cannot be represented in a single $u_i$ function without loss of fidelity. You can fake this with lexical orderings, but lexical orderings break continuity and existence proofs for equilibria. The vocabulary *requires* commensurability to function. If the "gains from trade" thesis relies on values that resist common measurement, the vocabulary smoothes over the friction that makes the compromise difficult or impossible.

  ---

  ### IV. Indictment and Burden of Proof

  **Does this residue indict the vocabulary or the thesis?**

  It indicts the **thesis**, specifically the version circulated in rationalist spaces that treats "compromise" as a purely technical optimization problem.

  1.  **The Thesis is Thinner:** The "gains from trade" picture assumes agents are stable vessels with fixed $u_i$ navigating a fixed $S$. It ignores that the process of bargaining often alters $u_i$ (preference endogeneity) and defines $S$ (institutional construction).
  2.  **Vocabulary Limitations:** Your vocabulary is the correct tool for *mechanism design* given fixed preferences. It is the wrong tool for *moral ontology*. It is not a bug that it cannot model "corruption of the self"; it is a feature of its abstraction. It is designed to solve for equilibria, not to validate identities.

  **Where to put the Burden of Proof:**

  *   **On the Proponents of Compromise:** They must prove **Stability of Preferences**. They need to demonstrate that the compromise mechanism is **Incentive Compatible** not just over actions, but over *preference evolution*. They must show that $u_i^{post}$ will not reject the deal struck by $u_i^{pre}$. If they cannot show this, the "gains" are illusory, existing only in the ex-ante expectation of a self that will not exist ex-post.
  *   **On the Market Designer:** You must acknowledge that when you design a mechanism for moral agents, you are not just allocating resources; you are selecting for **types**. A mechanism that rewards compromise selects for agents with high elasticity of substitution in their utility functions. A mechanism that rewards purity selects for lexical constraints.

  **Conclusion:**
  The "gains from trade" thesis holds in your vocabulary **if and only if**:
  1.  Preferences are divergent but stable (NTU bargaining set is convex and non-zero-sum).
  2.  Commitment is possible (to avoid sequential renegotiation destroying the deal).
  3.  Utility functions are the sole normative authority (no meta-ethical objection to the trade itself).

  The residue is the **metaphysics of the agent**. Your vocabulary assumes the agent is a boundary condition. The compromise thesis often ignores that the agent is a variable. The burden is on the thesis to show why the boundary condition holds.
