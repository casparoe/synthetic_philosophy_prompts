          *   Inversion 2: Turing's behavioral criterion applies to architectures, not individual minds (output reliability matters, internal structure doesn't).
      *   **Goal:** Describe the most important implications for *epistemic authority* and *moral responsibility* in high-stakes decision-making.
      *   **Constraints:** Keep it conceptual. No reading lists or citations. Suitable for a grad seminar discussion prompt.
