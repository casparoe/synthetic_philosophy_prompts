      *   *Darwinian Inversion:* Competence arises from selection, not understanding. (Evolution creates eyes without an optician).
      *   *Turing Inversion:* Intelligence is defined by output, not internal state. (A machine thinks if it acts like it thinks).
      *   *The User's Twist:*
          1.  Architectures evolve for *success*, not *truth/understanding*. Comprehension might be a bug/overhead.
