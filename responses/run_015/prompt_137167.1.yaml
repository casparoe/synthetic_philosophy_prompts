  # The Aggregation Decision Tree
  **Graduate Seminar: Normative Ethics**

  **Instructions:** Begin at **Node 1**. Answer **Yes** or **No** based on your intuitive verdict on the concrete case provided. Follow the branch to the next node or to a final position (Leaf).

  ---

  ### **Node 1: The Standard Lifeboat (5 vs 1)**
  **Case:** Five strangers and one stranger will drown. You can save one group. All other facts (age, responsibility, relation) are equal.
  **Question:** If you save the one by a coin flip, **have you wronged the five?**
  *   **YES** (Numbers generate reasons) → Go to **Node 2**.
  *   **NO** (Numbers do not generate reasons/Equal Claim) → Go to **Node 5**.

  ### **Node 2: The Identified Child (Identifiability)**
  **Case:** Five *statistical* victims and one *identifiable* child in front of you will drown.
  **Question:** Is the moral pressure to save the one **stronger here** than in the Standard Lifeboat?
  *   **YES** (Identifiability trumps numbers) → **Leaf A: Identifiability Priority**.
  *   **NO** (Impartiality holds) → Go to **Node 3**.

  ### **Node 3: The Finger vs. Life (Thresholds)**
  **Case:** Five strangers will each lose a finger; one stranger will lose their life. You can prevent one group's harm.
  **Question:** Is it permissible to **let the one die** to save the five fingers?
  *   **YES** (Harms are fungible) → **Leaf B: Straightforward Additive Aggregation**.
  *   **NO** (Life is lexically prior) → Go to **Node 4**.

  ### **Node 4: The Tie-Breaker (2 vs 1)**
  **Case:** Two strangers and one stranger will drown. Claims are identical (life-for-life).
  **Question:** Does the presence of the second person **resolve the choice**, whereas a 1-vs-1 case requires a coin flip?
  *   **YES** (Numbers break ties between equal claims) → **Leaf C: Pairwise-Contractualist**.
  *   **NO** (Numbers do not break ties/Claims are absolute) → **Leaf D: Lexically-Thresholded Aggregation**.

  ### **Node 5: The Marginal Gain (2 vs 1 for Non-Aggregators)**
  **Case:** Two strangers and one stranger will drown. You initially planned to flip a coin (per Node 1).
  **Question:** Does the second person make saving the pair **obligatory**?
  *   **YES** (Numbers count somewhat) → **Leaf E: Proportional-Chance Lottery**.
  *   **NO** (Strict Equal Claim) → Go to **Node 6**.

  ### **Node 6: The Standing Rule (Policy)**
  **Case:** You write the triage rule for a service facing 100 identical emergencies. You do not know who will be in which group.
  **Question:** Should the rule **maximize total survivors**, even if it means you would not save the most in a specific future emergency?
  *   **YES** (Ex Ante fairness allows Policy Aggregation) → **Leaf F: Equal-Chance Lottery (Hybrid)**.
  *   **NO** (Aggregation is never permissible) → **Leaf G: Numbers Never Settle Anything**.

  *(Note: The Ex Post/Ex Ante distinction on risk is implicit in the Policy/Act split, but for clarity, if you reached Leaf B, you likely accept Ex Ante expected value. If you reached Leaf D, you likely prioritize Ex Post outcomes.)*

  ---

  ### **Leaf Descriptions & Awkward Commitments**

  *   **Leaf A: Identifiability Priority.** *Awkward Commitment:* You must let more people die simply because they are anonymous.
  *   **Leaf B: Straightforward Additive Aggregation.** *Awkward Commitment:* You must sacrifice a human life to prevent a sufficient number of broken fingers.
  *   **Leaf C: Pairwise-Contractualist.** *Awkward Commitment:* You must save two lives over one, even if the one is vastly worse off than either of the two (provided claims are 'equal').
  *   **Leaf D: Lexically-Thresholded Aggregation.** *Awkward Commitment:* You must let a million people suffer minor harms rather than prevent one death, regardless of the cumulative suffering.
  *   **Leaf E: Proportional-Chance Lottery.** *Awkward Commitment:* You must give the single individual a 1/6 chance of survival even when saving the five is certain.
  *   **Leaf F: Equal-Chance Lottery (Hybrid).** *Awkward Commitment:* You must flip a coin in the emergency room even though you wrote a policy designed to maximize survival.
  *   **Leaf G: Numbers Never Settle Anything.** *Awkward Commitment:* Morality offers no guidance on how to act when lives are at stake in groups.

  ---

  ### **Logical Space Analysis**

  #### **1. Empty Regions (Answer Combinations with No Actual Position)**
  *   **Node 1 (YES) + Node 4 (NO):** You believe numbers generate reasons (wrong the 5 if you flip), but the second person in a 2-vs-1 case does not resolve the choice.
      *   *Status:* **Incoherent.** If numbers generate reasons in the 5-vs-1 case, the marginal gain of the second person in 2-vs-1 must carry weight. To deny this is to contradict the premise of Node 1.
  *   **Node 3 (YES) + Node 1 (NO):** You believe it is permissible to sacrifice a life for five fingers, but you believe saving 5 lives over 1 life is not obligatory (flip a coin).
      *   *Status:* **Merely Unattractive.** This view aggregates low-stakes harms but refuses to aggregate high-stakes harms. While logically possible, no major theory endorses aggregating fingers while rejecting aggregating lives.
  *   **Node 6 (YES) + Node 5 (NO):** You believe the *policy* should maximize survivors, but in the *act* (2-vs-1), the second person adds no obligation.
      *   *Status:* **Unexplored/Unstable.** This is a "Rule-Aggregation, Act-Non-Aggregation" view. While Hybrid views exist (Leaf F), they usually accept that numbers settle *something* in the act (e.g., weighted lottery). A view that maximizes in policy but flips coins in acts regardless of group size is pragmatically self-defeating.

  #### **2. Indistinguishable Leaves**
  *   **Leaf C (Contractualist) vs. Leaf D (Lexical Threshold):**
      *   *Problem:* Both views yield the same verdicts on the cases provided in this tree (Save 5 lives; Save 1 life over 5 fingers; Save 2 lives over 1). Both rely on the equality of claims to permit counting.
      *   *Further Case Needed:* **The Marginal Threshold Case.** "One person will lose a life; 1,000 people will each lose an arm."
          *   *Lexical Threshold:* Saves the life (threshold not met).
          *   *Contractualist:* Might save the 1,000 if the 'arm' claim can be aggregated to exceed the 'life' claim in a pairwise comparison, or if the 'life' claim is not strictly lexical but merely stronger. A stricter test is: **"Does the 1,000th arm add *any* weight?"** Contractualists often say no (pairwise); Lexical views might say yes (diminishing weight).
  *   **Leaf F (Equal-Chance Hybrid) vs. Leaf G (Numbers Never):**
      *   *Problem:* Both flip a coin in the individual case (Node 1 & 5 = NO).
      *   *Further Case Needed:* **The Ex Ante Compensation Case.** "If we adopt the maximizing policy, can we compensate those who are sacrificed?"
          *   *Leaf F:* Yes, the policy is justified by ex ante benefit to all.
          *   *Leaf G:* No, the sacrifice is never justified.

  ---
  *Handout End.*
