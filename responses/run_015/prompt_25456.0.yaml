answer: |-
  This is a fascinating breakdown of moral intuition. You are essentially asking for a secular theodicy—a way to justify moral order without invoking a deity or an afterlife. Your intuitions distinguish between **coincidence** (things happening *after* an act) and **consequence** (things happening *because* of the nature of the act).

  Based on your six cases, there is indeed a coherent framework that fits. Let's call it **The Theory of Moral Coherence**.

  Unlike the "cosmic vending machine" view of karma (put good coin in, get good soda out), Moral Coherence suggests that actions alter the *structure of reality* around the actor. Karma isn't a reward or punishment; it is the natural resonance of the moral environment you have created.

  Here is how Moral Coherence explains your six cases, followed by an analysis of your inheritance dilemma.

  ### Part 1: Explaining Your Intuitions

  **1. The Cruel Boss (Business Failure) vs. The Tornado**
  *   **Theory:** *Internal vs. External Causality.*
  *   **Analysis:** In the first case, the boss's cruelty likely eroded trust, lowered productivity, or created enemies who contributed to the failure. The consequence grew *organically* from the seed of the action. There is **moral coherence** between the act (destroying livelihoods) and the outcome (losing livelihood).
  *   **Why the Tornado isn't Karma:** A tornado is morally neutral chaos. It lacks *narrative connection*. For karma to feel real to us, the consequence must bear the fingerprint of the action.

  **2. The Volunteer (Stranger) vs. The $20 Bill**
  *   **Theory:** *Relational Echo.*
  *   **Analysis:** Kindness is a social signal. When a volunteer is kind, they ripple that signal into the community. A stranger paying for groceries is a human recognition of that signal (even if indirect). It is a **relational return**.
  *   **Why the $20 isn't Karma:** Finding money is a transaction with the ground, not the community. It lacks the "witness" element. Moral Coherence requires a moral agent on the receiving end to complete the circuit.

  **3. Remorse vs. No Remorse**
  *   **Theory:** *The State of the Ledger.*
  *   **Analysis:** This is where your theory moves from "retribution" to "restoration."
      *   **No Remorse + Prosperity:** This is the "Cosmic Error." In Moral Coherence, this is viewed as **Moral Lag**. The systems protecting the villain (money, power, lies) are artificially insulating them from the natural consequences of their actions. It feels wrong because it *is* unstable; it requires constant energy to maintain the lie.
      *   **Remorse + Suffering:** Remorse is an *internal* payment. It changes the moral status of the person. If they suffer *after* remorse, it no longer feels like "justice" to you; it feels like tragedy. In this theory, genuine remorse partially settles the debt. Subsequent suffering is not karmic repayment, but simply the human condition.

  ### Part 2: The Inheritance Dilemma

  Now, let's apply **Moral Coherence** to your specific test case:
  > *Someone inherits wealth obtained through terrible acts, but they are a decent person who uses the money for good.*

  In traditional religious karma, this is often solved by saying "they were good in a past life." Since we are excluding rebirth, we have to look at the **moral status of the resource** versus the **moral status of the steward.**

  Here is what the theory says about this person:

  **1. The Wealth Carries "Moral Momentum"**
  Under Moral Coherence, objects and resources are not neutral; they carry the history of their acquisition. "Tainted wealth" has a structural instability. It was built on extraction or harm.
  *   **The Intuition:** This explains why the heir might feel a vague anxiety or "imposter syndrome," even if they did nothing wrong. They are holding a resource that is vibrating with past incoherence.

  **2. The Heir is a Steward, Not an Owner**
  The theory suggests the heir is not being punished for the ancestor's sins, but they are **inheriting the karmic debt of the capital.**
  *   If they spend the money on luxury, the incoherence continues (harm was done to create this, and now it is being consumed selfishly). This would likely lead to "bad karma" outcomes (emptiness, scandal, loss) because the resource is out of alignment with moral reality.
  *   If they spend the money on good, they are **alchemizing the resource.** They are taking energy generated by harm and forcing it to generate good.

  **3. The Verdict: "Redemptive Stewardship"**
  In this framework, the heir is not "guilty," but they are **responsible.**
  *   **Is it karma if they suffer?** No. If they are decent and use the money for good, they are actively resolving the karmic tension. Suffering would not be "deserved"; it would be the friction of trying to turn a weapon into a plowshare.
  *   **Is it karma if they prosper?** Yes, but conditionally. Their prosperity is justified *only as long as* the money is being used to restore coherence.

  **The Coherent Conclusion:**
  The universe doesn't demand the heir be punished. It demands the **imbalance be corrected.**
  *   The ancestor created a deficit (harm).
  *   The heir has the surplus (money).
  *   **Karma is satisfied when the surplus is used to pay the deficit.**

  If the heir uses the tainted money to fund a shelter, they are literally using the fruits of past cruelty to alleviate present suffering. In your theory of Moral Coherence, **this is the highest form of karma.** It closes the loop. The "cosmic error" of the ancestor is corrected by the "cosmic repair" of the heir.

  ### Summary of the Theory

  To capture your gut reactions, Karma (secularized) is not **Retribution**; it is **Resonance.**

  1.  **Connection matters:** The outcome must thematically match the action (Boss fails vs. Tornado).
  2.  **Agency matters:** The return must come through the web of relationships, not random chance (Stranger vs. $20).
  3.  **Internal State matters:** Remorse changes the debt from "punishment" to "learning."
  4.  **Resources have history:** Wealth is not neutral. Using tainted wealth for good is a moral obligation, not just a nice option.

  This view resolves your conflict about the prospering villain (it's an unstable state of "Moral Lag") and the inheritor (they are an agent of "Moral Repair"). It suggests the universe isn't keeping score to punish us, but is constantly seeking equilibrium. When we act incoherently (cruelty), we create instability that eventually collapses. When we act coherently (repair), we stabilize the system.
