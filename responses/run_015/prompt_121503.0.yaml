prompt: |-
  I am a retired natural scientist—formerly in condensed-matter physics—who has recently begun studying philosophy of science and social ontology. Next month I shall be moderating a colloquium Q&A with an unnamed philosopher who defends a specific, somewhat niche position on generational ontology: she argues that cohorts such as the Baby Boomers, Millennials, and Generation Z are neither arbitrary marketing labels nor pure social constructions, but constitute what she calls "historically embedded phase sorts"—ontological kinds that share structural features with ecological succession stages rather than with biological species or conventional demographic brackets. I should like you to draft eight to ten interview questions that move well beyond asking her merely to restate this view.

  Please ensure the following are addressed, with at least one question on each point and a tailored follow-up keyed to the reply she is most likely to give:

  1. The ecological-succession analogy itself: whether treating generations as phase sorts commits her to a form of historical determinism about cohort behaviour, and how she distinguishes genuinely necessary structural features from contingent cultural packaging.

  2. The boundary problem: how she fixes precise birth-year cut-offs—e.g., where Generation Z ends and Generation Alpha begins—without either smuggling in conventional administrative decisions or conceding that the kind has vague, non-natural boundaries.

  3. Intra-cohort diversity: whether class, geography, and global economic position generate so much variance within, say, Millennials that the "kind" dissolves into a family-resemblance concept, and whether she is prepared to accept that consequence.

  4. The distinction from standard demographic age-cohorts and marketing segments: what ontological work her account performs that is not already done by routine demographic analysis or by the familiar sociological notion of a "historical generation"—and please do not ask her to supply a bibliography, reading list, or citations.

  5. A further question should probe whether her framework can accommodate rapid technological discontinuities—such as the widespread adoption of generative artificial intelligence during the adolescent years of Generation Z—without being forced to treat every technological rupture as the birth of a new generational kind.

  Please write in British English, maintain a formal and polished tone, and avoid generic biographical questions. Do not request bibliographies, reading lists, or citations, since a model without web access could only guess at them.

  Finish with a one-line summary of the interview strategy, on its own line beginning with the word "Summary:".
