      *   *Response:* Yes, because "my actual commitments" in (2) should be understood as *endorseable* commitments, not just psychological states. If I have a prejudice, it's not truly a *commitment* in the normative sense, it's a glitch.
      *   *Refining the "Hole":* The hole is the assumption that *source* (me) determines *status* (arbitrary vs. justified). The status depends on the *content* and its justifiability to the idealized self.

