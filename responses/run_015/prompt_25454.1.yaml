      *   *Standard MRE Defense:* Minimize Kullback-Leibler divergence (information gain).
      *   *User's Defense:* MRE is forced by symmetries of the physical stochastic process generating the message. It commutes with these symmetries.
      *   *Vulnerability:* The link between "physical stochastic process" and "epistemic update" is the bridge. Epistemologists care about rationality conditions, not necessarily physical mechanisms. Statisticians care about consistency. Decision theorists care about Dutch Books/loss.

  3.  **Brainstorming Objections (Categorized by Audience):**

      *   *Epistemologists (Adams/Imaging):*
