  I've been working through Gödel's argument that a rotating universe permits closed timelike curves, and I've settled on five positions that each feel right on their own but may not survive together. First, I take the rotating-universe model seriously as a proof that general relativity allows spacetimes in which a traveler can eventually return to their own past, which implies that the global flow of time is not a necessary feature of the geometry. Second, I think this undermines our ordinary distinction between past and future at a deep level: if the equations allow looping, then "earlier" and "later" are at best local conventions rather than objective cosmic directions. Third, despite that, I believe human consciousness requires a genuinely irreversible temporal flow—without it, memory, learning, and deliberate choice seem impossible—so there must be some real, non-conventional direction of time at the level of experience. Fourth, I think Gödel intended his cosmological result mainly as a philosophical objection to the completeness of Einstein's field equations, not as a literal claim that our universe actually rotates. Fifth, I've come to think that if closed time loops are possible even in principle, then any practical or moral reasoning that depends on actions having irreversible consequences collapses, since one could in principle travel back and undo any choice.

