prompt: |-
  I've been working through the literature on the demarcation problem for a course on philosophy of science, and I want to check whether I'm applying Popper's falsifiability criterion correctly. As I understand it, Popper intended falsifiability to solve two distinct problems at once: first, to draw a sharp line between empirical science and metaphysics or pseudoscience (the demarcation problem), and second, to resolve Hume's problem of induction by replacing inductive verification with deductive falsification. Now, the Duhem-Quine thesis seems to show that any theoretical prediction depends on a network of auxiliary hypotheses, which means that when an observation conflicts with a prediction, logic alone never forces us to reject the core theory rather than one of the auxiliaries. Given this, it appears that applying the falsifiability criterion in practice requires an inductive judgment about which auxiliary assumptions are legitimate to preserve and which should be abandoned—precisely the kind of reasoning Popper claimed to have eliminated. So my question is: doesn't this mean that falsificationism secretly collapses back into a form of inductivism, and that the demarcation criterion is therefore not a logical boundary but merely a conventional rule we adopt by induction?

  If you think this objection misses the mark, please take a definite position on whether Popper's reply to conventionalist stratagems actually saves the criterion as a descriptive demarcation, and explain exactly where my framing conflates the normative and descriptive dimensions of his project. I am not asking for a survey of interpretations; argue for the view you think is correct, identify the specific confusion in my reasoning about induction and auxiliary hypotheses, and say whether a genuinely Popperian scientist can apply falsifiability without making the inductive commitments I have described.
