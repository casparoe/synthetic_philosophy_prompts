answer: |-
  **Bottom Line**

  **Core Teaching Sequence (50 Minutes)**
  1.  **Provocation (0–5 min):** Write "Democratic Backsliding" on the board. Ask: "If Party X wins a majority and changes the rules to stay in power, but follows every written law, is it backsliding or winning?" Force a show of hands.
  2.  **The Carrying Example (5–20 min):** **Constitutional Court Packing.** Walk through the mechanics: A majority passes a law expanding the court and appointing loyalists. It is *legal* (procedural) but violates *forbearance* (normative). Use this to distinguish "erosion of rules" (breaking laws) from "erosion of norms" (using laws as weapons).
  3.  **The Baseline Trap (20–30 min):** Inject the **Competitive-Authoritarian Wrinkle.** Ask: "Can you slide back from a ledge?" Use Turkey to argue that if consolidation never happened, "backsliding" implies a false history. Shift terminology to "democratic decay" or "authoritarian consolidation" where baselines are murky.
  4.  **Boundary Stress-Test (30–45 min):** Distribute the four countries (HU, PL, TR, US) as cards. Assign groups to argue *against* the label for their assigned country using only the Court Packing definition. Force them to find the threshold where policy loss becomes structural erosion.
  5.  **Check Question (45–50 min):** "Describe one specific institutional change your preferred party could enact tomorrow that would qualify as backsliding under our definition, even if it remained popular."

  **The Carrying Example**
  **Constitutional Court Packing.** It is the sharpest tool because it is often strictly legal (procedural minimalism satisfied) yet destroys checks and balances (liberal norms violated). It forces students to admit that legality ≠ democracy.

  **Misconception Blocks**
  *   **The Coup Myth:** Block this during Step 2. Explicitly state: "If tanks roll out, class is over. We are studying what happens when the tanks stay in the barn."
  *   **Policy Dislike:** Block this during Step 4. If a group argues "they cut taxes" or "changed immigration," stop them. Demand *institutional* changes, not policy outputs.
  *   **Expert Neutrality:** Block this during Step 3. Acknowledge that defining the "baseline" is itself a political act, not a scientific measurement.

  ***

  **Reasoning**

  **1. Sequencing: Bypassing the Procedure vs. Norms Dichotomy**
  Do not start by lecturing on procedural minimalism (Schumpeter) vs. liberal norms. That order smuggles in a Western-centric framing that invites the "partisan weapon" critique immediately. If you start with "free elections," students will argue Putin wins elections. If you start with "rights," they will argue you're imposing values.

  Instead, start with **forbearance** (the unwritten rule of not using your full legal power to crush opposition). By using Court Packing as the carrying example, you force them to confront the gap between *what you can do* and *what you should do* without needing a philosophical preamble. The definition emerges from the mechanism, not the theory. This neutralizes the "partisan label" charge because the mechanism (packing courts) is theoretically applicable to any party.

  **2. The Carrying Example: Why Court Packing?**
  Media capture is too vague for a 50-minute session (what counts as capture?). Voter suppression is too contested (is it backsliding or election integrity?). Court packing is binary and institutional.
  *   It isolates the **intent**: Is the goal to improve justice or secure power?
  *   It isolates the **reversibility**: Can the next winner undo it easily, or is the court now locked?
  *   It applies across all four boundary objects: Hungary (constitutional court overhaul), Poland (tribunal paralysis), Turkey (post-coup purges), US (threats of expansion).
  This example carries the whole distinction because it proves backsliding is often *lawful*. If you convince them that legal acts can kill democracy, you solve the "coup myth" misconception instantly.

  **3. Injecting the Teleology Wrinkle**
  Place the competitive-authoritarian point (Step 3) *after* they think they have a definition. If you start with it, they will feel the concept is impossible and disengage. Once they have a working definition (Court Packing/Forbearance), you destabilize it with Turkey.
  *   **The Move:** Ask, "Hungary slid from democracy. Turkey slid from... what?"
  *   **The Goal:** This prevents them from treating "democracy" as a fixed endpoint. It teaches them that backsliding is context-dependent. In consolidated democracies (US, Poland), it's erosion. In hybrid regimes (Turkey, early Orban), it's consolidation. This nuance stops them from using the term lazily across all contexts.

  **4. The Boundary Stress-Test**
  Using HU, PL, TR, and US as boundary objects rather than case studies prevents deep dives into history they don't have. They are using the countries to test the *limits of the definition*.
  *   **US:** Tests if polarization alone counts (it doesn't).
  *   **Poland/Hungary:** Tests if EU membership buffers backsliding (it doesn't).
  *   **Turkey:** Tests the baseline problem.
  By assigning them to argue *against* the label, you force them to inhabit the skeptic's position. This is the only way to kill the "partisan weapon" bias. If they can articulate why a move *isn't* backsliding, they understand the threshold.

  **5. The Check Question**
  The final question ("What could *your* party do?") is the only valid metric for success. If they answer with policy (e.g., "raise taxes"), they failed. If they answer with structure (e.g., "gerrymander permanently" or "ignore subpoenas"), they succeeded. This confirms they have separated the *mechanism of power* from the *outcome of power*. It forces intellectual honesty and proves they aren't just using the term to describe losses.
