          *   Avoid historical-textual exegesis; focus on structural/conceptual argument.
          *   Avoid collapsing into preference-utilitarianism or trivial resolutions.
          *   Focus on the first-personal vs. third-personal distinction in commitment.
      *   **Goal:** Provide feedback that strengthens the proposal, ensures feasibility, and clarifies the philosophical stakes.

  2.  **Deconstruct the Proposal's Core Argument:**
      *   *Premise 1:* Williams argues utilitarianism alienates agents from their "ground projects" via the "one thought too many" (e.g., saving a spouse because utility allows it, not because it's *her*).
      *   *Premise 2:* Existing debates focus on individual agents (Utilitarian absorption vs. Williamsian incommensurability).
      *   *Gap:* What happens when the agent is an *institution*? Can an institution have "integrity" in Williams's sense?
      *   *Hypothesis:* Institutional integrity might differ from personal integrity (Role-Integrity vs. Personal-Integrity).
      *   *Method:* Conceptual analysis + 2 case studies (triage, arts patronage). No empirical data. No deep exegesis.
      *   *Success Criteria:* A principled distinction between role/personal integrity + criteria for "one thought too many" in institutions.
      *   *Failure Modes:* Collapsing into preference utilitarianism or trivial resolution.

  3.  **Evaluate Philosophical Accuracy (Williams & Integrity):**
      *   *Settled:* Williams *does* argue that utilitarianism threatens integrity by making projects fungible. He *does* use the "one thought too many" example (Jim and the Indians is the other big one, but the spouse rescue is the specific phenomenological point). He *does* emphasize the first-personal perspective.
      *   *Contested:* Whether ground projects are truly incommensurable (Utilitarians say no). Whether Williams offers a positive theory or just a negative critique. Whether "integrity" is a moral virtue or a precondition for agency.
      *   *Institutional Extension:* This is the novel part. Williams was skeptical of "moral institutions" subsuming the individual, but he didn't fully develop a theory of *institutional* integrity. This is where the proposal needs to be careful not to attribute views to Williams he didn't hold.

  4.  **Assess Feasibility (12 Weeks, 25 Pages):**
      *   *Scope:* 25 pages is roughly 6,000-7,500 words. This is tight for a full conceptual analysis plus two case studies.
      *   *Timeline:* 12 weeks is standard for a semester.
      *   *Risk:* The distinction between "Role-Integrity" and "Personal-Integrity" is a known philosophical move (e.g., in professional ethics). The proposal needs to ensure it's not just reinventing the wheel of "professional obligations vs. personal morals."
      *   *Method:* "Conceptual analysis" is vague. Needs to be more specific about the argumentative steps.

  5.  **Identify Strengths:**
      *   Clear research question.
      *   Identifies a genuine gap (institutional application).
      *   Clear success/failure conditions.
      *   Avoids the "exegesis trap."

  6.  **Identify Weaknesses/Areas for Improvement:**
      *   *Williams Attribution:* Need to ensure the proposal doesn't imply Williams *wanted* this extended to institutions. He was often anti-bureaucratic.
      *   *The "Integrity" Definition:* Williams's "integrity" is specific (identity-constituting projects). Institutional "integrity" often means "consistency with mission." The proposal needs to explicitly address this semantic/ontological gap.
      *   *Case Studies:* Triage is often *already* utilitarian (save the most lives). Arts patronage is more about mission fidelity. Need to ensure these cases actually test the "one thought too many" problem, not just "rules vs. discretion."
      *   *Utilitarian Counter:* The proposal worries about collapsing into preference utilitarianism. It needs to articulate *why* institutional ground projects aren't just "institutional preferences."

  7.  **Drafting the Feedback (Iterative Process):**
      *   *Introduction:* Acknowledge the strength and novelty.
      *   *Philosophical Precision:* Clarify the "Settled vs. Contested" requirement. Ensure Williams isn't being misread.
      *   *Structural Advice:* Break down the 12 weeks.
      *   *Content Advice:* Refine the "Role vs. Personal" distinction. Suggest engaging with literature on corporate agency (French, List & Pettit) briefly, even if not the focus, to show awareness.
      *   *Case Study Refinement:* Make sure the cases illuminate the *phenomenology* (or lack thereof) in institutions.
      *   *Formatting:* Keep it professional, encouraging, but critical.

  8.  **Refining the "Settled vs. Contested" Constraint:**
      *   I need to make sure *my* response adheres to the user's constraint: "do not present a contested interpretation... as if it were the consensus view."
      *   I must explicitly label where scholars disagree in my feedback.

  9.  **Final Polish:**
      *   Check tone (academic, supportive).
      *   Check length (comprehensive but not overwhelming).
      *   Ensure the distinction between the *proposal text* and *my feedback* is clear. (I will provide an evaluation and then specific recommendations for the text).

      *(Self-Correction during drafting)*: Wait, the user asked me to *review* the draft, effectively acting as a supervisor. They didn't ask me to rewrite it, but to "separate what is settled... from what is genuinely contested." Actually, looking at the prompt: "Please separate what is settled about Williams's original argument from what is genuinely contested regarding its extension to institutional agents..." This is an instruction for *my output*, not just a constraint for the proposal. I need to provide an analysis that categorizes the philosophical landscape for them.
      *   *Correction:* The prompt asks me to evaluate the proposal *and* perform the specific task of separating settled/contested matters within the context of the proposal's viability. I will structure the response to first evaluate the proposal's strength, then provide the requested philosophical mapping, then offer concrete recommendations for the syllabus/paper structure.

  10. **Final Plan:**
      *   **Executive Summary:** Assessment of the proposal's viability.
      *   **Philosophical Landscape (The Constraint):** Explicitly map Settled vs. Contested regarding Williams and Integrity.
      *   **Critical Feedback:** Specific points on the "Institutional Agent" problem (phenomenology gap).
      *   **Structural Recommendations:** 12-week breakdown and paper outline.
      *   **Risk Mitigation:** How to avoid the stated failure modes.

  11. **Executing the "Settled vs. Contested" Instruction:**
      *   *Settled:* Williams critiques utilitarianism for alienating agents from ground projects. The "one thought too many" is a phenomenological critique of the *justification* structure, not necessarily the *action*.
      *   *Contested:* Whether integrity is a moral value itself or a precondition for morality. Whether institutions can be moral agents. Whether the objection applies to non-human agents.

  12. **Final Review against constraints:**
