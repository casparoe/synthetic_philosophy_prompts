  **Seminar Handout: The Split-Stream Graft**

  **1. The Case Description**

  Consider a patient, Arthur, suffering from a progressive neurodegenerative condition that will inevitably destroy his biological neural substrate within the year. A novel medical intervention is proposed: the Split-Stream Graft.

  Over a period of six months, a synthetic neural mesh is interfaced with Arthur's cortex. This is not a simple prosthetic; it is a functional analogue capable of replicating the firing patterns and plasticity of biological neurons. The procedure is gradual. In month one, 10% of Arthur's cognitive load is shunted to the synthetic mesh. By month six, 100% of his higher-order processing, memory consolidation, and agency reside in the synthetic substrate.

  Crucially, the procedure does not involve destroying or removing the biological brain. The original biological body is kept alive, perfused, and conscious throughout the entire six months. However, to prevent catastrophic feedback loops between the two substrates, a pharmacological block is applied to the biological synapses. This block inhibits long-term potentiation (LTP) in the biological brain. The biological neurons still fire—they still generate qualia and raw awareness—but they cannot encode new long-term memories or integrate new experiences into the self-model. They are functionally 'read-only'.

  Conversely, the synthetic substrate is 'read-write'. It accepts the sensory input, forms new memories, updates beliefs, and maintains the narrative thread of Arthur's life. The synthetic substrate is housed in a separate, biologically-compatible synthetic chassis (grown from Arthur's own cell lines to ensure immunological compatibility), which becomes the primary locus of agency and interaction.

  At the end of the six months, the neural bridge is severed. We are left with two distinct beings:
  1.  **Bio-Arthur:** The original biological body. He is conscious and aware but psychologically stagnant. He retains memories up to the start of the procedure but has not psychologically developed since. He experienced the six months phenomenally but cannot recall them as part of his identity.
  2.  **Syn-Arthur:** The synthetic recipient. He possesses all memories prior to the procedure plus a continuous, integrated record of the six-month transition. He speaks, acts, and claims to be Arthur without interruption.

  **2. Theoretical Verdicts**

  **Bodily-Continuity Theory**
  *Verdict:* Bio-Arthur is the survivor.
  *Reasoning:* Personal identity is grounded in the spatiotemporal continuity of the living organism. Bio-Arthur is the direct physical continuation of the pre-procedure human animal. The biological body was never destroyed, nor was there a break in its biological life processes. Syn-Arthur is merely a copy or a distinct entity that shares psychological traits with the original. The fact that Bio-Arthur's psychological development was inhibited is irrelevant; he is the same organism, merely damaged or impaired.

  **Psychological-Continuity Theory**
  *Verdict:* Syn-Arthur is the survivor.
  *Reasoning:* Identity tracks the continuity of memory, character, and intention. Syn-Arthur possesses the robust psychological connections to the pre-procedure Arthur. He remembers the past, intends for the future, and maintains the chain of conscious experience. Bio-Arthur suffers a severe break in psychological continuity; while he has past memories, the chain of psychological connectedness was severed during the transition because he could not integrate the intervening experiences. He is psychologically discontinuous with the person who entered the procedure.

  **Narrative-Identity Theory**
  *Verdict:* Syn-Arthur is the survivor.
  *Reasoning:* Identity is constituted by the ongoing story one tells about oneself. Syn-Arthur maintains the coherent narrative arc. He can explain what happened during the six months, how he changed, and what he plans next. Bio-Arthur's narrative is fractured; he possesses a prologue but no subsequent chapters. He is a character whose story stopped, whereas Syn-Arthur is the character whose story continued. What matters in survival is the preservation of the narrative self, which resides entirely in the synthetic recipient.

  **3. The Structural Feature: Temporal Overlap and Co-Consciousness**

  The single structural feature that drives a wedge between these theories is the **temporal overlap of co-conscious candidates**.

  In standard fission cases (like Parfit's teleporter), the original is usually destroyed, or the branching happens instantaneously. Here, both candidates exist simultaneously *during* the transition. We can observe Bio-Arthur stagnating while Syn-Arthur develops. This overlap allows us to distinguish between *being* the organism (Bio-Arthur) and *living* the life (Syn-Arthur).

  Because both are conscious during the six months, we can verify that Bio-Arthur is not merely asleep; he is present but excluded from the narrative construction of the self. This forces the Bodily-Continuity theorist to admit that the 'person' (the locus of rights, responsibilities, and relationships) has migrated, even if the 'organism' has stayed put. The overlap makes the divergence of bodily and narrative continuity empirically visible within the case, rather than a matter of metaphysical speculation about what happens after death or destruction.

  **4. Counterfactual: Removing the Feature**

  If you remove the temporal overlap—for instance, if Arthur is placed under general anaesthesia for the six months while the synthetic substrate takes over—the case collapses into a standard replacement problem.

  Without co-conscious overlap, we cannot point to Bio-Arthur and say, "Look, he is still here, but he isn't developing." We would simply have a body waking up (Bio-Arthur) and a synthetic entity waking up (Syn-Arthur), both claiming identity. Without the witnessed divergence during the transition, the Bodily-Continuity theorist can argue more plausibly that Syn-Arthur is a duplicate who woke up thinking he is Arthur, while Bio-Arthur is the true survivor who merely suffered amnesia. The overlap is what proves that psychological narrative can detach from biological substrate *while the substrate is still active*.

  **5. Critique and Collapse**

  **The Bodily-Continuity Defence**
  A staunch bodily-continuity defender will attack the case by denying the premise that psychological inhibition equals non-identity. They will argue that Bio-Arthur is the only true survivor and that Syn-Arthur is a sophisticated philosophical zombie or a mere copy. They will claim that the 'narrative' is supervenient on the biology; if the biology is stalled, the person is stalled, but still the same person. They would argue that our intuition that Syn-Arthur is the survivor is a bias towards functional capacity rather than ontological identity. To them, Syn-Arthur is a new person who inherited Arthur's memories, much like a son inheriting a diary.

  **Does Removing the Feature Collapse the Scenario?**
  Yes. If the overlap is removed (i.e., the procedure happens while Arthur is unconscious), the scenario reverts to a standard Parfit-style fission or replacement case. Without the ability to observe the biological body remaining conscious but psychologically static *alongside* the developing synthetic self, the distinction between 'copy' and 'survivor' becomes purely metaphysical rather than observational. The power of the Split-Stream Graft lies in the fact that we can interrogate Bio-Arthur during month three and find him stuck, while interrogating Syn-Arthur and finding him growing. Remove that simultaneity, and you lose the leverage needed to separate narrative continuity from bodily continuity empirically. You are left with competing claims after the fact, which is the standard stalemate in personal identity literature.
