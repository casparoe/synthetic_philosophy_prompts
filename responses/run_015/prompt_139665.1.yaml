answer: |-
  ### The Specification for a Darwinian Theory of Cultural Change

  Below are the requirements for an adequate theory, anchored to the cases you provided. Each includes the rationale for why it is necessary to meet your explanatory goals.

  **1. The Demographic-Stochastic Requirement (Anchored: Two Island Populations)**
  *   **Requirement:** The theory must model cultural loss as a function of population size, network structure, and transmission chain length, independent of environmental pressure or adaptive value.
  *   **Rationale:** Population B lost techniques solely because masters died without apprentices. A theory that requires adaptive failure or environmental shift to explain loss cannot account for this. It must treat cultural retention as a probability distribution over demographic events, explaining why Population A's network structure buffered against the same stochastic shocks that emptied Population B's toolkit.

  **2. The Complexity-Fidelity Coupling Requirement (Anchored: Transmission-Fidelity Budget)**
  *   **Requirement:** The theory must specify a mechanism that links the number of acquisition steps (complexity) to the threshold of copying fidelity required for persistence, and explain why this threshold varies across domains (e.g., knots vs. melodies).
  *   **Rationale:** If fidelity is treated as a constant parameter, the theory cannot explain why net knots survive sloppy transmission while complex bone-needle fabrication does not. The theory must identify what properties of the task or the cognitive system impose a "fidelity budget" and why some domains (motor routines) afford higher fidelity than others (auditory sequences) within the same population.

  **3. The Scaffolding-Locus Requirement (Anchored: Overnight-Extinction Test)**
  *   **Requirement:** The theory must explicitly state where the information necessary for recovery resides (individual memory, artefact structure, or social institution) and predict recovery trajectories based on that locus.
  *   **Rationale:** If artefacts survive but no humans do, recovery depends on reverse-engineering affordances. If one human survives without artefacts, recovery depends on memory. A theory that treats "culture" as a monolithic blob cannot predict which traditions vanish in scenario one versus scenario two. It must distinguish between information stored in the head, in the world, and in the interaction between them.

  **4. The Decoupled-Fitness Requirement (Anchored: Maladaptive Items)**
  *   **Requirement:** The theory must allow for the spread and persistence of traits that reduce the biological or material fitness of their bearers, without invoking hidden long-term group benefits as a definitional stopgap.
  *   **Rationale:** Costly or dangerous practices exist. If the theory defines a "successful cultural item" as one that benefits the group or individual, these cases become contradictions by definition. The mechanism of spread (e.g., prestige bias, frequency dependence) must be separable from the fitness consequences for the bearer to explain why harmful traditions do not simply select themselves out.

  **5. The Identity-and-Homoplasy Requirement (Anchored: Multiple Independent Invention)**
  *   **Requirement:** The theory must provide identity conditions for cultural units that distinguish common descent from convergent evolution, allowing for the counting of units in a corpus without assuming similarity implies genealogy.
  *   **Rationale:** If two populations invent the same fish-hook independently, a theory that counts them as one "unit" spreading will miscalculate transmission rates and origins. To predict accumulation, you must be able to count lineages. The theory must specify what makes a unit the *same* unit over time (e.g., causal history vs. functional form) to avoid false positives in tracking cultural phylogeny.

  **6. The Selection-Level Agnosticism Requirement (Anchored: Structural Constraint)**
  *   **Requirement:** The definition of a cultural item must not build between-group advantage into its success criteria; the theory must permit selection to act at the level of the trait, the individual, or the group as distinct variables.
  *   **Rationale:** If "cultural success" is defined as "group survival," you cannot test whether group selection is actually happening. The theory must allow for traits that spread within groups but destroy them, or traits that help groups but struggle to spread within them, so these dynamics can be empirically weighed rather than assumed.

  **7. The Reconstructive-Learning Requirement (Anchored: Structural Constraint)**
  *   **Requirement:** The transmission mechanism must be compatible with reconstructive learning (inference, bias, scaffolding) rather than requiring high-fidelity imitation or replication.
  *   **Rationale:** People do not copy like photocopiers; they infer intentions and reconstruct procedures. A theory requiring precise replication to function contradicts known psychology. It must explain how stability emerges *despite* transformation during acquisition, rather than assuming stability is the default state of transmission.

  **8. The Risk-Specification Requirement (Anchored: Structural Constraint)**
  *   **Requirement:** The theory must declare what empirical pattern would falsify it, specifically avoiding post-hoc adaptationist storytelling.
  *   **Rationale:** Without this, any outcome (stability, loss, spread) can be rationalized after the fact. The theory must predict a distribution of outcomes (e.g., a specific relationship between population size and toolkit complexity) that, if not observed, would force abandonment of the model.

  **9. The Domain-Declaration Requirement (Anchored: Structural Constraint)**
  *   **Requirement:** The theory must state which domains (technology, ritual, language, etc.) it claims to cover and which it excludes.
  *   **Rationale:** Mechanisms driving the spread of a hammer design may differ from those driving the spread of a god concept. A universal claim that fails in one domain undermines the whole. Scope limits are necessary to prevent the theory from becoming a metaphor rather than a mechanism.

  ***

  ### Classification: Non-Negotiable vs. Camp Preference

  **Non-Negotiable (Against Your Fixed Purpose)**
  Requirements 1, 2, 3, 4, 8, and 9 are non-negotiable. You asked for a theory that explains accumulation, persistence, and disappearance against a corpus of material culture and ethnography. If a theory cannot handle demographic loss (1), fidelity variance (2), storage locus (3), maladaptive spread (4), falsification (8), or scope (9), it simply fails the job description. It would be unable to score the cases you provided.

  **Camp Preference Dressed as Criteria**
  Requirement 5 (Identity) and Requirement 7 (Reconstructive Learning) sit on the fault line, but the demand for **particulate, countable units with population-genetic tractability** is a camp preference, not a non-negotiable requirement for *explanation*.
  *   **View:** Insisting on discrete, gene-like units is an artifact of trying to import population genetics directly into culture. While counting is useful for prediction (Req 5), demanding that the *ontology* of culture be particulate to satisfy mathematical tractability sacrifices psychological realism (Req 7). You can explain stability and change using continuous distributions or attractor landscapes without discrete "replicators." Therefore, the demand for particulate units is a preference for a specific *formalism*, not a requirement for the *explanatory task*.

  ***

  ### Conflict Analysis: Incompatible Desiderata

  **The Tensions**
  Your suspicion is correct: there is a genuine tension between **(i) needing units with stable identity/high fidelity (Req 1, 2, 5)** and **(ii) taking seriously reconstructive transmission/cognitive attractors (Req 7)**.
  *   **The Conflict:** High-fidelity ratcheting usually requires copying mechanisms that minimize transformation. Reconstructive learning maximizes transformation toward cognitive norms. If transmission is reconstructive, "fidelity" is the wrong metric; "convergence" is the right one. But convergence makes phylogenetic tracking (Req 5) and population-genetic modeling (implicit in Req 1) difficult because lineages blur.
  *   **Impossibility or Artifact?** This is an artifact of asking for a *single* formalism to do all the work. It is not impossible to have both stability and reconstruction, but it is impossible to model them using standard allele-frequency equations without significant distortion. You need a process ontology that allows for transformation *and* retention, which standard selectionist math resists.

  **The Second Tension**
  There is also a tension between **Quantitative Prediction (Req 1, 8)** and **Content-Dependent Biases (Req 4, 7)**.
  *   **The Conflict:** To predict quantitatively, you need general laws (parameters). To be psychologically realistic, you need content-specific biases (e.g., people learn scary things differently than boring things). The more content-dependent the biases, the less general the predictive law becomes.
  *   **Impossibility or Artifact?** This is a genuine trade-off between *scope* and *precision*. A theory that predicts everything precisely will be psychologically vacuous; a theory that captures psychological nuance will struggle to generate clean population-level predictions without overfitting.

  **The Single Most Exclusionary Requirement**
  **Requirement 5 (Identity-and-Homoplasy)** does the most work in excluding candidates.
  *   **Reason:** Most theories fail here. Either they cannot define a unit clearly enough to count it (failing the corpus check), or they define it so rigidly that independent invention is misclassified as descent. If a theory cannot tell you whether two similar artefacts are one lineage or two, it cannot calculate rates of change, making Req 1 and Req 8 impossible to satisfy.

  ***

  ### Theory Scoring

  **Meme-as-Replicator Picture**
  Fails Requirement 7 (Reconstructive Learning) by assuming high-fidelity copying is the norm, and struggles with Requirement 3 (Scaffolding) by locating information primarily in the "replicator" rather than the interaction.

  **Population-Genetic Dual-Inheritance Models**
  Satisfies Requirement 1 (Demography) and 8 (Risk) well mathematically, but often fails Requirement 5 (Identity) by treating cultural traits as black-box alleles, and Requirement 7 (Reconstructive Learning) by oversimplifying transmission psychology.

  **Cultural-Attractor / Epidemiological Picture**
  Excels at Requirement 7 (Reconstructive Learning) and 3 (Scaffolding), but struggles with Requirement 1 (Demography) and 5 (Identity), as it explains stability via cognitive convergence rather than lineage tracking, making the "ratchet" hard to formalize.

  **Cultural Group Selection**
  Handles Requirement 4 (Maladaptive Items) and 6 (Selection Levels) best by allowing group-level fitness to override individual cost, but often fails Requirement 9 (Domain Declaration) by assuming group boundaries are sharper than ethnographic reality supports.
