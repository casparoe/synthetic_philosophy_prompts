      *   *Refining the critique of (3):* The "Halo of Silence" assumes **Common Knowledge of Opportunity**. For silence to be informative, everyone must know that everyone else had the chance to trade at $P$ and chose not to. In reality, I don't know if you didn't buy because you think it's overpriced or because you're on vacation. Therefore, silence is noisy, not informative.

