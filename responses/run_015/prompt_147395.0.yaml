          6.  Claim: Using prices to update beliefs tracks strategic omissions, not shared judgments.
          7.  Dilemma: Markets can't aggregate knowledge OR silence carries no info.
      *   **User's Constraint:** Wants to keep (1) and (6) if possible. Suspects (3) is doing "sneaky work."
