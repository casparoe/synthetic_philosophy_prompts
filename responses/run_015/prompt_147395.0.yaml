      *   **(2) Reverse Logic (Silence as Signal):** *Plausible in theory.* If I *would* have bought at $P$ given my info, but didn't, my inaction signals something.
      *   **(3) "Halo of Silence":** *This is the suspicious step.* It assumes that non-participation is a *clear, interpretable signal* equivalent to a bid/ask. It assumes everyone had the *opportunity* to trade at $P$ and consciously decided not to. It ignores transaction costs, liquidity constraints, and the fact that "not trading" is the default state for 99% of agents for reasons unrelated to valuation (e.g., they don't have an account, they are index investors, they are sleeping).
      *   **(4) Trades = Irrationality:** *Follows from (3).* If (3) is true, then anyone trading against the "silence" is ignoring info.
      *   **(5) Price shaped by non-participants:** *Follows from (3).*
      *   **(6) Prices track omissions, not judgments:** *Follows from (3) & (5).*
      *   **(7) Dilemma:** *Follows from previous.*

