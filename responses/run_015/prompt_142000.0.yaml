answer: |-
  Agreed claims

  1. We agree that rational belief systems must avoid sure loss in standard betting scenarios, satisfying the probability axioms to ensure basic coherence in how expectations are managed. This commitment binds us to the normative force of probability theory as a logic of consistency.
  2. We agree that learning from evidence generally requires updating beliefs via conditionalization or a recognized structural analogue that respects the likelihoods provided by the data. We reject arbitrary changes of mind that ignore the probabilistic implications of new information.
  3. We agree that scientific integrity demands reporting the strength and limits of evidence, not just point estimates, to prevent misleading precision in public policy contexts. Hiding uncertainty undermines the utility of scientific advice for decision-makers.
  4. We agree that long-run frequency properties of measurement methods are relevant to assessing their reliability and calibration against physical reality over repeated applications. Empirical performance matters even for those who view probability as subjective.
  5. We agree that structural ignorance about model parameters or systematic errors cannot always be eliminated by collecting more data of the same kind or design. Some uncertainties are inherent to the measurement setup rather than random noise.
  6. We agree that a complete epistemology must link doxastic states to actions through a coherent decision-theoretic framework that avoids dominated strategies in choice. Belief without action is incomplete; action without belief is blind.
  7. We agree that proper scoring rules provide the most objective available measure of forecast accuracy over a long series of repeated trials and predictions. Incentives for truth-telling must be built into how we evaluate probabilistic forecasts.
  8. We agree that neither framework guarantees truth; both aim for internal coherence and external calibration against reality while acknowledging inherent human and instrumental limitations. Humility is a shared virtue in the face of complex evidence.

  Disagreements

  | Crux | Imprecise-Credence Formulation | Sharp-Prior Formulation |
  | :--- | :--- | :--- |
  | **Ambiguity Attitude** | Rationality *requires* imprecise credence when evidence is ambiguous (e.g., Ellsberg urns) to avoid arbitrariness. | Rationality *permits* sharp credence; ambiguity is handled by a sharp higher-order distribution over hypotheses. |
  | **Dilation** | Dilation is a veridical feature: some evidence genuinely widens the set of plausible probabilities. | Dilation is a reductio: no evidence should increase uncertainty; the set-model is mathematically pathological. |
  | **Decision Rule** | Maximin or E-admissibility is appropriate; maximizing expectation over a set is undefined or misleading. | Maximizing expected utility against a single sharp prior is the only admissible decision rule. |
  | **Metrology Case** | Report the union of intervals implied by biases; decision suspended if intervals straddle the limit. | Assign a distribution to biases (e.g., uniform); compute posterior probability that concentration exceeds limit. |
  | **Scoring Rules** | Sets can be scored by refinement of proper rules; sharp forecasts falsely claim precision not held. | Strictly proper rules favor sharp forecasts; imprecise forecasts are penalized for vagueness in the long run. |

  Tests and pre-registered predictions

  **Ambiguity Attitude:** In an Ellsberg urn (30 red, 60 black/yellow unknown), subjects bet on Red vs. Black. ICT predicts rational agents prefer betting on known probabilities (Red) over unknown (Black), violating the Sure Thing Principle. SPB predicts rational agents must be indifferent between Red and Black, as any sharp prior sums to 1/3; preference indicates a cognitive bias, not rational ambiguity aversion. Refutation for ICT: Consistent indifference. Refutation for SPB: Systematic, stable preference for known odds persists after training.

  **Dilation:** Consider a partition where prior probability of Hypothesis H is 0.5, but after observing any element of the partition, the posterior interval for H is [0.4, 0.6]. ICT predicts this correctly models evidence that identifies the reliability of the source as questionable. SPB predicts this is impossible for a sharp prior; if it occurs, the set-model violates coherence. Refutation for ICT: If sharp updating never yields wider intervals. Refutation for SPB: If agents consistently report higher uncertainty after specific data.

  **Decision Rule:** In a choice between a safe payoff and a gamble with unknown probability, ICT predicts agents choose the safe option to minimize worst-case loss. SPB predicts agents maximize expected utility based on a subjective prior; choosing safe is only rational if the prior is sufficiently pessimistic. Refutation for ICT: If agents consistently maximize average gain despite ambiguity. Refutation for SPB: If agents reject favorable gambles solely due to ambiguity, not prior pessimism.

  **Metrology Case:** Two instruments read 12.1 and 11.6 ppb; bias ±δ. Limit is 12.0. ICT predicts the regulator reports an interval covering both bias-adjusted ranges; if 12.0 is inside, no violation is declared. SPB predicts the regulator assigns a prior to bias (e.g., uniform), calculates $P(\theta > 12.0)$, and decides based on a threshold. Refutation for ICT: If a single probability is mandated for legal compliance. Refutation for SPB: If the chosen prior is successfully challenged as arbitrary in court.

  **Scoring Rules:** Forecasters predict binary events. ICT uses interval forecasts scored by a set-compatible rule; SPB uses sharp probabilities scored by Brier score. ICT predicts sharp forecasters will be overconfident and penalized on calibration. SPB predicts imprecise forecasters will be penalized for vagueness, as proper rules reward resolution. Refutation for ICT: If sharp forecasters are perfectly calibrated. Refutation for SPB: If interval forecasters achieve lower loss on ambiguous events.

  Verbal or substantive

  This dispute is substantive regarding action under severe ignorance, but verbal regarding the definition of "credence." If "credence" means a behavioral disposition to bet, the sharp theorist wins by definition: you either bet or you don't. However, if "credence" models the *evidence itself*, the imprecise theorist wins: evidence can be inherently ambiguous. The substantive core is whether rationality forbids representing that ambiguity explicitly. If we treat the credal set as a tool for robust decision-making rather than a psychological state, the disagreement dissolves into a choice of tools for specific contexts. The fight is over whether one tool fits all cases.

  What this means for the lab bench

  Your committee was modeling the state of knowledge, not merely frequency. When you published a coverage interval, you were effectively publishing a credal set: the range of values consistent with current systematic knowledge. Both camps can sign the statement: "This interval reflects the range of plausible values given current systematic knowledge and bounded bias." The sharp Bayesian views this as a summary of a high-entropy prior; the imprecise theorist views it as a direct representation of ignorance. For the lab, the practical advice is identical: do not collapse the interval to a point. Acknowledge that the interval captures structural uncertainty that cannot be reduced by repetition. Your work was philosophy, but it was also necessary engineering.
