answer: |-
  ### The Kestrel Diagnostic Triage Procedure (90-Minute Protocol)

  **Objective:** Convert a 60–90 page country diagnosis into a one-page funding memo with a defensible verdict code.
  **Personnel:** Two desk officers (one lead, one challenger).
  **Inputs:** The Consultant Report, Kestrel Charter, Country Portfolio Data.
  **Outputs:** One-page Note, Verdict Code (FUND, FUND-WITH-KILL-CONDITION, HOLD, REFER).

  #### Phase 1: The Lever Test (15 Minutes)
  **Question:** Does the report identify a specific mechanism we can deploy or alter within a five-year funding window to move the claimed cause?
  **Procedure:**
  1.  Highlight the primary cause of poverty/stall identified in the executive summary.
  2.  Apply the **LEVER TEST**: Can Kestrel Fund influence this variable directly or via a partner within 60 months?
      *   *If Yes:* Proceed to Phase 2.
      *   *If No:* Classify as **HERITAGE** (e.g., colonial borders, deep-seated constitution, geography).
  3.  **Charter Check:** If the lever requires changing interpersonal trust, religious norms, or ethnic cohesion, classify as **CULTURE**. Per charter, this is non-fundable.
  **Decision:** If Heritage or Culture, draft memo for **HOLD**. If Fundable, proceed to Phase 2.

  #### Phase 2: The Confounding Filter (20 Minutes)
  **Question:** Is the claimed cause separable from external shocks or structural context in this specific timeline?
  **Procedure:**
  1.  Identify the "Treatment" (the reform/policy) and the "Outcome" (growth/stall).
  2.  List the top two alternative explanations for the Outcome (e.g., commodity prices, regional war, climate event).
  3.  Check the timeline: Did the Outcome change *exactly* when an Alternative Explanation occurred?
      *   *If Yes (e.g., growth stopped the exact quarter copper prices fell):* The diagnosis is **CONFOUNDED**.
      *   *If No (e.g., growth persisted despite price drop in specific sectors):* The diagnosis has **ISOLATION**.
  **Decision:** If Confounded, draft memo for **HOLD** (Insufficient Evidence). If Isolation, proceed to Phase 3.

  #### Phase 3: The Kill Condition (20 Minutes)
  **Question:** What observable event within the funding window would prove this diagnosis wrong?
  **Procedure:**
  1.  Draft a single sentence stating: "We will consider this diagnosis invalid if [Observable Metric] does not [Change Direction] by [Date]."
  2.  Verify the metric is available to Kestrel without new research budgets (e.g., World Bank data, customs logs, budget execution reports).
  3.  Verify the date is within the 5-year window.
  **Decision:** If no observable metric exists, verdict is **HOLD**. If a metric exists, proceed to Phase 4.

  #### Phase 4: Values & Risk (15 Minutes)
  **Question:** Does funding this lever require us to take a stance on political values that exceeds our mandate?
  **Procedure:**
  1.  Review the lever. Does success require supporting a specific political faction, weakening a specific ethnic group, or altering the balance of power between military and civilian government?
  2.  If the disagreement between officers is about whether this political risk is acceptable (rather than whether the evidence holds), flag for **REFER**.
  3.  If the risk is manageable but high, prepare **FUND-WITH-KILL-CONDITION**.
  4.  If the risk is low and evidence is strong, prepare **FUND**.

  #### Phase 5: Synthesis (20 Minutes)
  **Task:** Write the One-Page Note.
  **Structure:**
  1.  **Diagnosis:** One sentence summarizing the claim.
  2.  **Lever:** One sentence on what we fund.
  3.  **Constraint:** One sentence on what we classified as Heritage/Context.
  4.  **Kill Condition:** The falsification metric and date.
  5.  **Verdict:** The Code.
  **Sign-off:** Country Director signs the Verdict Code.

  ***

  ### Worked Cases

  #### 1. Vandara (The Commodity/Institution Confound)
  *   **Report Claim:** Growth driven by 1994 Constitutional revenue sharing; stall driven by institutional rigidity.
  *   **Triage:**
      *   *Lever Test:* We cannot fund constitutional reform (Heritage). However, the report notes district-level *implementation* of revenue sharing is variable. We can fund technical assistance on implementation. **Pass.**
      *   *Confounding Filter:* Growth stopped the *same quarter* copper prices fell. The report admits this but insists institutions were the underlying fragility. This is confounded. However, if non-copper districts also stalled, the institutional claim holds. The report does not specify. We must assume confounding. **Fail.**
      *   *Correction:* Officers note that non-copper districts *continued* growing. This isolates the institutional lever from the commodity shock. **Pass.**
      *   *Kill Condition:* If district-level budget execution rates do not improve by 15% in non-copper districts within 36 months.
  *   **Verdict:** **FUND-WITH-KILL-CONDITION** (Focus on non-copper district implementation).
  *   **Memo Note:** "Diagnosis isolates institutional rigidity from commodity shock via non-copper district performance. Lever is technical assistance on revenue distribution implementation. Kill condition: 15% budget execution improvement in non-copper districts by Q3 2027."

  #### 2. Sembwe-Kalunda (The Culture Trap)
  *   **Report Claim:** Divergence caused by low interpersonal trust in Kalunda (Culture).
  *   **Triage:**
      *   *Lever Test:* Trust is the variable. Can we fund trust? **No.**
      *   *Charter Check:* Charter forbids funding culture change.
      *   *Confounding Filter:* Survey data is from 2016; divergence started in 1970. Reverse causality likely (poverty caused low trust, not vice versa).
  *   **Verdict:** **HOLD**.
  *   **Memo Note:** "Diagnosis relies on cultural variables prohibited by Charter Section 4. Survey data post-dates economic divergence, suggesting reverse causality. No fundable lever identified within 5-year window."

  #### 3. Maroya (The Political Untouchable)
  *   **Report Claim:** Public integrity programme improved service delivery (Institutions).
  *   **Triage:**
      *   *Lever Test:* We are already funding the lever ($40M). **Pass.**
      *   *Confounding Filter:* Service delivery scores rose concurrently with a terms-of-trade windfall. The report does not control for revenue availability. We cannot separate "better integrity" from "more money." **Fail.**
      *   *Kill Condition:* Cannot be set because the baseline is confounded.
  *   **Verdict:** **HOLD**.
  *   **Memo Note (Director):** "The diagnostic evidence indicates the programme's perceived success is confounded by a terms-of-trade windfall rather than institutional reform. Continuing funding without a falsifiable kill condition violates our audit requirements for evidence-based allocation. I recommend placing the programme on HOLD until we can isolate the institutional variable from commodity pricing."

  ***

  ### Critique: Where the Procedure Breaks

  1.  **Judgment Calls Dressed as Procedure:** The **Confounding Filter** (Phase 2) requires officers to decide if a correlation is "exact enough" to imply causation. Without econometrics, they will rely on narrative plausibility. A clever consultant can game this by ensuring the "shock" and the "stall" are off by one quarter, forcing the officer to call it "Isolation."
  2.  **Distinctions Officers Will Get Wrong:** The line between **Heritage** and **Lever**. Officers often classify "Political Will" as a Lever. It is not. It is context. If the report says "The Minister needs to want this more," that is Heritage. Officers will try to fund "Ministerial Training" to fix this, which is a waste of capital.
  3.  **Systematic Misfires:** This procedure will systematically misread **Stable Autocracies**. If a country grows because a dictator suppresses wages and keeps the lights on, the Lever Test will flag "Security Apparatus" as Heritage (unfundable). The procedure will recommend HOLD, missing the opportunity to fund the *economic* side of the autocracy that *is* movable (e.g., export zones), because the diagnosis will be tangled with the politics. It also misfires on **Slow-Burn Institutions**. If the lever takes 20 years to work (e.g., judicial independence), the 5-year Lever Test kills it, even if it's the only thing that matters.

  ***

