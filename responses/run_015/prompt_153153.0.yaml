          *   It saves the *future* (the child) by sacrificing the *present*.
      *   **Dickens's Melodrama as Philosophy:**
          *   Acknowledge the coincidences. They aren't just lazy writing; they suggest a fate-like quality to the Terror. Everything is connected, so everyone is guilty.
      *   **Defarge's Knitting (Bureaucracy):**
