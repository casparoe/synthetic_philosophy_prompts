          *   *Ideological Purity:* The Tribunal. Darnay is safe until he isn't. Why? Because the definition of "enemy" expands. Defarge's speech about the "old regime" infecting the new.
          *   *Contingency:* The letter from Dr. Manette. This is crucial. It shows how *private* pain becomes *public* fuel.
      *   **Carton's Sacrifice:**
          *   It's not a political solution. It's a spiritual one.
