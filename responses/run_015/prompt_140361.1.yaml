  **MINUTES OF THE FORTY-FIRST SESSION OF THE STANDING COMMITTEE ON THE HISTORICITY THRESHOLD**

  **Date:** 14 October 2023
  **Location:** Virtual Conference Room 4 (Secure Server)
  **Attendees:** Chair (Institute for Chronological Stability), Secretary (Bureau of Stratigraphic Integrity), Member for Bronze Age Collapse (Dept. of Applied Antiquity), Member for Post-Roman Transitions (Centre for Narrative Cohesion), Observer (International Council for Heritage Funding).

  **Item 1: Revision of Schedule B (Weighting of the Argument from Silence)**
  The Committee opened by reviewing Schedule B, which governs the evidentiary weight permissible when a source fails to mention an event presumed to be catastrophic. The Member for Bronze Age Collapse proposed Revision 4.1, suggesting that silence in diplomatic archives should carry 0.8 negative points, while silence in poetic corpora should carry 0.2. The Member for Post-Roman Transitions argued that silence in contemporary monastic chronicles should carry 1.5 negative points due to expected theological oversight. The Chair noted that Revision 4.1 renders the Trojan file untenable, while the Post-Roman proposal renders the Arthurian file impossible. Revision 4.2 was introduced to categorize silence by "administrative necessity." The vote was deferred pending legal review of the Embarrassment Rider.

  **Item 2: File 74-Alpha (The Trojan Conflict)**
  The Committee reviewed the stratigraphic data for the site identified as Troy. A settlement layer dating to the appropriate century shows signs of violent destruction by fire. The Committee applied the Wilusa Clause, which permits corroboration from foreign archives that mention the site under an alternate spelling (specifically, the Hittite diplomatic records). It was moved that the slide from "a city on this site was destroyed in roughly the right century" to "this poem preserves a memory of that destruction" be accepted as a valid inferential bridge, provided the poetic meter is deemed sufficiently archaic. The Member for Bronze Age Collapse noted that the gap between event and source is large, but ruled that the persistence of place-names constitutes a continuous oral contract. The Committee agreed to apply the Embarrassment Rider generously: the absence of Hittite records detailing a defeat is deemed embarrassing to the Hittites, not the Greeks. Provisional Certificate of Historicity upgraded to Grade B+.

  **Item 3: File 89-Beta (The Arthurian Campaigns)**
  The Committee reviewed the Monastic Source (c. 540 CE). This source denounces British kings at length and describes a siege at Mount Badon without ever naming Arthur. The first unambiguous appearance of the name occurs in a compilation roughly three centuries later. The Member for Post-Roman Transitions argued that the Argument from Silence here should be weighted heavily under Schedule B Revision 4.2, as a monk denouncing kings would presumably mention a savior if one existed. The Embarrassment Rider was invoked: the Committee could not decide whether the embarrassment produced by a hero's absence from a source that ought to mention him belongs to the ancient source or to the hero's modern defenders. It was resolved that the embarrassment belongs to the defenders. The possibility that the named hero is a composite into whom several dimly-attested figures have been folded was noted as a mitigating factor, but ultimately rejected for lack of distinct paperwork. Grade held at Provisional D.

  **Item 4: File 12-Gamma (The Exodus Narrative)**
  The Committee reviewed the Late-Thirteenth-Century BCE Egyptian Victory Inscription, which names Israel as a people already in Canaan. The Member for Bronze Age Collapse noted that nothing in the abundant Egyptian documentation of the period corresponds to a sojourn, a series of plagues, a flight, or a population anywhere near the size the narrative presupposes. Under Schedule B, the silence of Egyptian administrative records regarding the departure of a large slave population was assigned maximum negative weight. The Committee noted the asymmetry with File 74-Alpha: whereas the destruction of a single city was accepted as proof of a war, the absence of evidence for a mass migration was accepted as proof of non-occurrence. The Committee reasoned that a city leaving destruction layers is physically plausible, whereas a population leaving no genetic or material trace is demographically improbable. Grade downgraded to Provisional F.

  **Item 5: The Reflexive Certification Problem**
  The Observer from the International Council for Heritage Funding raised a procedural concern. Once a Provisional Certificate is issued, heritage funding, tourism revenue, and excavation permits follow. The excavation then produces finds. The Committee must now decide whether finds that it has itself caused to exist count as independent confirmation warranting an upgrade. The Secretary noted that if the grade, which was only ever meant to record how the evidence stands, quietly becomes one of the evidence's causes, the Threshold metric becomes circular. The Chair ruled that this constitutes a metaphysical objection rather than a procedural one. The Committee agreed to table the issue until a method is found to distinguish between evidence discovered and evidence summoned.

  **Item 6: Adjournment**
  The Committee noted that Schedule B remains unsettled. The files for 74-Alpha, 89-Beta, and 12-Gamma remain open. The Chair reminded members that the question "when does a legend become history?" is outside the Committee's remit; the Committee is tasked only with assigning grades. The session was adjourned pending the next funding cycle.

  **Certified True Copy:**
  *Secretary, Bureau of Stratigraphic Integrity*
