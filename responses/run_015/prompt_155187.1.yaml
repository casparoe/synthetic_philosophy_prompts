oncrete case or test both would accept as bearing on it--a new style-guide desicion, a hypothetical imagery or processing study, a case where the old term clearly misleads an automated classifier, or something similar--and record in advance what each camp predicts will happen. Keep the finished statement under 900 words, use the agreed-claims-then-table format, and don't just summarize the satire or recycle the usual feminist-language talking points.
