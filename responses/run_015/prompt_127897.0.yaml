          *   *Distinction:* Voluntary submission implies a rational trade-off. Structural role-capture implies the frame was so strong choice was illusory. The SPE leans heavily toward the latter. The "choice" to submit was manufactured by the environment, not an innate human desire for slavery.

      *   **The Breakdown of the Inquisitor's Model (Zimbardo's Termination):**
