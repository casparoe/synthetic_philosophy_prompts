  2.  **Initial Brainstorming & Mapping:**
      *   *The Grand Inquisitor Thesis:* Christ returns, is arrested by the Inquisitor. The Inquisitor argues Christ made a mistake by offering freedom. People are weak, rebellious, and miserable with freedom. They want bread (survival), miracle (certainty/awe), and authority (someone to tell them what to do). The Church provides these in exchange for conscience/freedom.
      *   *The SPE:* College students, random assignment, basement of Stanford. Guards given uniforms/sunglasses, prisoners dehumanized (numbers, smocks). Rapid descent into abuse. Study stopped early.
