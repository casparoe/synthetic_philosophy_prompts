          *   *Authority:* The surrender of moral conscience. Guards don't have to feel guilty; they are "doing a job." Prisoners don't have to decide; they just obey.

      *   **The Nature of Surrendered Freedom:**
          *   It's not political freedom. It's *moral* freedom. The burden of deciding right from wrong. The Inquisitor says this burden is too heavy. The SPE shows guards offloading guilt onto "the experiment" and prisoners offloading agency onto "the rules."

      *   **Voluntary Submission vs. Structural Role-Capture (The Critical Test):**
          *   *Inquisitor View:* People *want* this. It makes them happy (or at least content).
