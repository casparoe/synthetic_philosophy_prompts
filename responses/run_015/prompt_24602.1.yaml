answer: |-
  ### The tree

  Use this decision tree to locate your philosophical commitment regarding Fitch's Paradox. Begin at the paradox core: You accept that Moorean truths ($p \land \neg Kp$) are unknowable and that classical reductio drives the proof from knowability to omniscience. The Fitch-Church proof suggests verificationism collapses into omniscience. To find your position, answer sequentially. This tree isolates the precise premise you are willing to sacrifice to avoid the conclusion that all truths are known.

  **Q1:** Do you accept classical reductio ad absurdum for epistemic operators? If no, you block the proof early by denying the logic used to derive the contradiction from the assumption of unknown truths. This path alters the underlying logic of knowledge, typically moving toward intuitionism where double negation elimination fails. If yes, proceed to the schema.

  **Q2:** Is the Knowability Schema ($p \to \Diamond Kp$) universally valid for all truths? If no, you block the proof by denying some truths are knowable, accepting inherent limits on truth. This sacrifices the anti-realist motivation for knowability, admitting some truths are forever hidden. This is the Restrictionist move, often favored by realists. If yes, proceed to closure principles.

  **Q3:** Does knowledge distribute over conjunction ($K(p \land q) \to Kp \land Kq$)? If no, you block the step where the knower knows the Moorean conjunction, allowing fragmented knowledge. This sacrifices logical omniscience regarding conjunctions, permitting known parts without a known whole. This is the Non-Adjunctivist move, often seen in relevant logic. If yes, proceed to agent specification.

  **Q4:** Does "knowable" mean knowable by *any possible agent* or *agents like us*? If "any," you accept the conclusion that all truths are known by someone. If "us," you restrict the scope to finite capacities, accepting contingent limits on human knowledge rather than truth itself. This distinguishes Idealism from Anthropocentrism.

  ### The leaves

  Each terminal node represents a distinct philosophical cost. Choose your poison:

  **Intuitionistic Anti-Realist:** Rejects classical logic. *Awkwardness:* Cannot assert "there are unknown truths" without contradicting oneself, as existence claims require construction, silencing meaningful debate about realism.

  **Epistemic Restrictionist:** Denies some truths are knowable. *Awkwardness:* Commits to inherently unknowable facts, violating the spirit of anti-realism that motivated knowability in the first place.

  **Non-Adjunctivist:** Denies closure under conjunction. *Awkwardness:* Allows knowing $p$ and $q$ separately but not jointly, breaking standard reasoning patterns and logical aggregation in epistemic contexts.

  **Verificationist:** Accepts omniscience. *Awkwardness:* Denies the existence of unknown truths entirely, collapsing truth into actual knowledge and eliminating mystery from the world.

  **Anthropocentrist:** Restricts knowability to human capacity. *Awkwardness:* Makes truth dependent on human cognitive limits rather than reality, risking relativism and denying truths beyond our grasp.

  **Unnamed (Idealist):** Knowable by some being. *Awkwardness:* Requires a God-like knower for every truth, metaphysically bloating the ontology to save the schema without committing to actual human knowledge.

  ### Empty corners

  Combining Intuitionism with Non-Adjunctivism is redundant; rejecting logic usually suffices. Similarly, accepting the Schema while denying Closure is rare because if $p$ and $q$ are knowable, their conjunction should be too. Most who deny closure also restrict the schema. The "Idealist" leaf is rarely occupied; philosophers prefer Restrictionism over positing infinite agents. Finally, accepting Classical Logic and the Schema but denying Omniscience without restricting agents is incoherent; that path is mathematically blocked by the proof itself.

  ### What the tree can't tell

  The tree separates Restrictionists from Anthropocentrists, but not clearly on *why*. Both deny universal knowability. To separate them, ask: "Is the limitation metaphysical or contingent?" Restrictionists say some truths are inherently unknowable; Anthropocentrists say truths are knowable but not by us. Also, Intuitionists and Restrictionists both deny the derivation, but one blames logic, the other semantics. You need to ask: "Is the failure in inference or in truth conditions?" This distinction determines whether you change the world or the logic.
