  {
    "question_text": "Welcome to the final. You've spent the semester digging into the mechanics of memory, the architecture of forgetting, and the politics of who gets to speak from beyond the grave. You know the drill: archives aren't neutral repositories of truth; they are active technologies of power. Foucault told us that power lives in what gets filed, categorized, and retrieved. Derrida reminded us that the archive destroys as much as it preserves, constituting a house arrest for memory. But here's the rule for this exam: do not just recite them. If I see a generic paragraph on panopticons or archive fever without specific application to the scenario below, you're already losing points. I want to see you wrestle with a contemporary problem that complicates the classic theories we've studied. \n\nHere is the scenario. Imagine a major digital humanities project focused on late 19th-century colonial census rolls from South Asia. Historically, these documents were instruments of control, designed to fix fluid social identities into rigid bureaucratic categories. But they were also messy. Clerks skipped fields. Subjects refused to answer. Categories didn't fit local realities. Large swathes of the population were left blank, marked with dashes, or categorized under vague terms like 'undefined.' These gaps are what Ann Laura Stoler might call the 'grain' of the archive—the friction where colonial power failed to fully capture its subject. \n\nNow, here's the twist. The project leaders have decided to 'complete' the dataset using algorithmic imputation. Using machine learning models trained on the existing complete entries, the algorithm predicts and fills in the missing fields—age, occupation, caste, religion—based on probabilistic correlations with neighbors and household heads. The public-facing interface now shows a 'complete' census. There are no more blank fields. The archive appears whole. The missing subaltern subjects now have ages and occupations assigned by a probability model running on a server in 2024. \n\nYour task is to write an essay responding to this intervention. Specifically, I want you to tackle whether this creates a new kind of archival silence—one that masks itself as presence—or if this restores subaltern presence in a real, usable way for historians. This isn't just about data quality; it's about epistemic justice. When a gap is hidden behind synthetic data, the nature of the silence changes. It is no longer a visible void; it is a ventriloquized voice. \n\nYou need to separate two specific concepts in your analysis: the 'absence of evidence' versus 'evidence of absence.' In the original paper census, a blank field might be evidence of absence (the state failed to capture the person) or absence of evidence (the record was lost). When the algorithm fills this, it converts both into a false presence. You must explain how epistemic injustice changes when the gap is hidden. Does this repair the harm of colonial erasure, or does it compound it by erasing the trace of the erasure itself? \n\nConsider the implications for historical method. If a historian queries this database to find labor patterns among marginalized castes, the algorithm might generate statistically probable occupations based on colonial stereotypes embedded in the training data. The archive then begins to hallucinate its own biases back at the researcher as fact. Is this a restoration of voice, or is it a second-order colonization where the algorithm dictates the identity of the subject because the human subject was never asked? \n\nI want you to engage with the idea of 'silence' not just as nothingness, but as a productive force. Michel-Rolph Trouillot argued that silences enter the process of historical production at four key moments. Where does this algorithmic imputation fit? Is it a silence of fact creation, or a silence of retrieval? Furthermore, consider the ethics of 'completeness.' Does a complete archive of lies serve justice better than an incomplete archive of truths? \n\nYour essay should be structured as a coherent argument, not a list of responses. Begin by defining the type of silence at play. Move to the distinction between the two types of absence mentioned above. Conclude with a statement on how this shifts the responsibility of the historian. You have 90 minutes. Keep it sharp. Don't hide behind jargon. If you say 'epistemic violence,' show me exactly where the violence occurs in the code. If you say 'subaltern,' show me where they are being spoken for. The goal here is to demonstrate that you understand archives are not just about the past; they are about the technologies we use to reconstruct the past in the present. \n\nRemember, the algorithm doesn't know it's filling a gap. It doesn't know it's silencing a subject. It just minimizes loss functions. Your job is to articulate why that matters. Does the synthetic voice count as testimony? If not, what is it? A forgery? A guess? A continuation of colonial governance by digital means? Make sure you address whether this practice makes the archive more useful or more dangerous. Useful for whom? Dangerous to what? \n\nFinally, don't ignore the materiality. The paper census had physical limits; ink ran out, pages tore. The digital census has logical limits; probabilities sum to one. When we swap physical degradation for logical completion, what do we lose? We lose the ability to see where the state failed. We lose the friction. We lose the proof of resistance. If a subject refused to be counted, and the algorithm counts them anyway, has their resistance been deleted? \n\nWrite clearly. Argue fiercely. Good luck."
