  # Taxonomy of Phenomenal Physics and Ethical Suffering

  **Node Count:** 7 Total (1 Root, 4 Diagnostic, 2 Leaf)
  **Target Audience:** Advanced Seminar (Presupposes familiarity with the Combination Problem)
  **Root Commitment:** Fundamental physical entities possess phenomenal properties of some kind. (Excludes Physicalist Eliminativism from the tree structure; treat as external null case).

  ---

  ### [Node 1] Root: Phenomenal Realism
  **Commitment:** Fundamental physics entails proto-phenomenal or phenomenal properties.
  **Branching Logic:** All paths proceed sequentially through Nodes 2–5 to record diagnostic values before terminating in Leaves 6–7.

  ### [Node 2] Diagnostic 1: Macro-Subject Binding
  **Claim:** Quantum or field-level coherence yields a unified cosmic subject rather than only dispersed micro-subjects.
  **Options:**
  *   **A (Cosmic):** Coherence generates a single macro-subject (e.g., Cosmopsychism).
  *   **B (Dispersed):** Coherence is insufficient; subjects remain micro-scale (e.g., Micropsychism).

  ### [Node 3] Diagnostic 2: Valence Structure
  **Claim:** Fundamental phenomenal properties include negative affect (suffering) rather than being purely structural or cognitive.
  **Options:**
  *   **A (Affective):** Phenomenality entails valence (positive/negative).
  *   **B (Neutral):** Phenomenality is valence-free protospace.

  ### [Node 4] Diagnostic 3: Decoherence Threshold
  **Claim:** Thermal noise or Planck-scale decoherence sets a moral-status cutoff rather than all scales counting equally.
  **Options:**
  *   **A (Cutoff):** Only stable/coherent systems bear moral weight.
  *   **B (Universal):** All phenomenal instances count, regardless of decoherence.

  ### [Node 5] Diagnostic 4: Intervention Normativity
  **Claim:** Altering physical conditions (e.g., reducing local entropy to preserve coherence or disrupting it to prevent suffering) is ethically required/permitted rather than forbidden.
  **Options:**
  *   **A (Active):** Intervention is mandated or permissible to mitigate suffering.
  *   **B (Quietist):** Intervention is forbidden, impossible, or ethically neutral.

  ---

  ### [Node 6] Leaf: Cosmic Suffering Imperative
  **Path Profile:** Primarily accumulates [Node 2: Cosmic] + [Node 3: Affective] + [Node 4: Universal/Cutoff] + [Node 5: Active].
  **Named Positions:**
  *   **Cosmopsychism with Full-Spectrum Valence:** The universe is a single subject experiencing net suffering; entropy reduction is a moral duty.
  *   **Priority Cosmicism:** The cosmic subject's suffering outweighs micro-suffering; intervention targets global coherence.
  **Unoccupied Combinations & Diagnosis:**
  *   *[Cosmic + Neutral + Active]:* **Incoherent.** If the cosmic subject lacks valence, there is no suffering to mitigate via intervention.
  *   *[Cosmic + Affective + Quietist]:* **Unattractive.** Posits a suffering God-Universe but forbids relief; theoretically possible but ethically unstable (often collapses into Leaf 7 via revision of Node 5).
  **Separation Flag:** This leaf cannot cleanly separate from **Leaf 7** on the issue of *epistemic access*. If we cannot measure cosmic valence (Node 3), the practical output of Leaf 6 mimics Leaf 7 (Quietism) despite theoretical divergence.

  ### [Node 7] Leaf: Micro-Structural Quietism
  **Path Profile:** Primarily accumulates [Node 2: Dispersed] + [Node 3: Neutral/Affective] + [Node 4: Cutoff] + [Node 5: Quietist].
  **Named Positions:**
  *   **Protopanpsychism with Decoherence Cutoff:** Micro-entities have proto-experience without valence; only complex systems count, but intervention is too risky/forbidden.
  *   **Micropsychist "Noise Suffering" View (Quietist Variant):** Micro-suffering exists (Node 3: Affective + Node 4: Universal) but intervention is forbidden due to unintended macro-consequences (Node 5: Quietist).
  *   **External Null Case:** Physicalist Eliminativism (Root Negated).
  **Unoccupied Combinations & Diagnosis:**
  *   *[Dispersed + Neutral + Active]:* **Unexplored.** Why intervene on neutral properties? Requires a non-valence-based ethical framework (e.g., aesthetic preservation) not standard in suffering-focused taxonomy.
  *   *[Dispersed + Affective + Cutoff + Active]:* **Unoccupied.** If decoherence sets a cutoff, micro-suffering is excluded; if micro-suffering is included, the cutoff is rejected. Holding both is inconsistent.
  **Separation Flag:** See Leaf 6. The boundary between "Cosmic Quietism" (Leaf 6 variant) and "Micro Quietism" (Leaf 7) is porous; both result in no physical intervention, making them empirically indistinguishable despite metaphysical differences.

  ---

  **Instrument Note:** This 7-node topology forces a sequential filter. While standard taxonomies branch at every diagnostic to maximize sorting, this constraint prioritizes the logical dependency of Intervention (Node 5) on the preceding metaphysical claims. Students should note that Nodes 2–4 determine the *ontology* of suffering, while Node 5 determines the *ethics*, creating the final binary split at the leaves.
