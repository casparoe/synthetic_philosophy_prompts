      *   *Counter-argument 1 (The Phenomenological Objection):* When I cry at a movie, do I actually believe (even 1%) that the actor is dying? No. If a car crashed through the screen, I'd duck. I don't duck when the villain shoots. My behavior shows 0% belief in the threat.
      *   *Counter-argument 2 (The Imagination Alternative):* Most philosophers prefer "make-believe" or "simulation" theories (Walton, Currie). We don't believe; we *imagine* believing. The emotion is real, but the cognitive trigger is imagination, not belief.
      *   *Counter-argument 3 (The Function of Emotion):* Emotions aren't just about truth conditions; they're about evaluation. I can evaluate a scenario as "sad" without believing it happened.

  4.  **Evaluate the "Philosophers are Outdated" Claim:**
