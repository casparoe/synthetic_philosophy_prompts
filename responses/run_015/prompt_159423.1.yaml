answer: |-
  **Project Title:** The Grain of Cluelessness: Individuation, Uncertainty, and Consequentialist Evaluation

  **Project Summary**
  Consequentialist agents often face "cluelessness": the inability to know the long-run effects of their actions. The standard response splits into two camps. The first insists agents must maximize expected value on current evidence despite uncertainty. The second argues cluelessness necessitates shifting evaluation from acts to rules, character, or whole lives. Both camps assume a fixed grain at which acts and outcomes are individuated. This project challenges that assumption. I argue that cluelessness is a function of grain: fine-grained acts (e.g., single donations) maximize uncertainty, while mid-grained policies (e.g., yearly giving rules) may average out noise, but coarse-grained life evaluations may reintroduce uncertainty via chaotic divergence.

  The central research question is: **Is there a non-arbitrary grain of act-individuation at which consequentialist cluelessness is minimised, and can selecting this grain be justified on purely consequentialist grounds?**

  If such a grain exists, identifying it could resolve the paralysis of act-level evaluation without retreating to non-consequentialist constraints. If no such grain exists, the debate between act and global consequentialism is underspecified, relying on hidden assumptions about how the world is carved into units of evaluation.

  **Background and Critical Gap**
  Current literature treats cluelessness as monolithic. I propose splitting it into three distinct uncertainties: effect-uncertainty (causal chains), valuational uncertainty (weighting outcomes), and meta-uncertainty (confidence in probability estimates). The standard camps address the first but ignore the third. Specifically, gathering evidence to reduce effect-uncertainty is itself an intervention; in chaotic systems, increasing mechanistic knowledge can widen the spread of foreseeable outcomes rather than narrow it.

  The two standard camps leave this open because neither accounts for grain-dependence.
  1.  **The Act-Level Camp** assumes the "act" is given. If cluelessness varies by grain, their command to "maximize on best evidence" is incomplete without specifying *which* evidence aggregation level counts as the act.
  2.  **The Rule/Global Camp** assumes coarse-graining solves uncertainty. However, if value distribution is heavy-tailed (where most value sits in rare events), coarse-graining may average out the very signals agents need to track, buying reduced cluelessness at the cost of reduced value.

  This project is not merely the act-vs-rule debate in a new hat. That debate typically turns on compliance costs or integrity constraints. My inquiry turns on the *epistemic topology* of the world: whether the structure of uncertainty itself privileges a specific level of aggregation for evaluation.

  **Methodology and Work Plan**
  The output will be an 8,000-word paper plus a formal appendix. The four-month leave will be structured as follows:

  *   **Month 1: Conceptual Framework.** I will finalize the tripartite distinction of uncertainty and define "grain" formally (temporal aggregation and causal scope). I will draft the argument that meta-uncertainty behaves differently from effect-uncertainty in chaotic systems.
  *   **Month 2: Formal Modeling.** I will construct a toy decision model to test the grain hypothesis. The model will simulate agents maximizing value across different grain parameters under varying noise conditions.
      *   *The Formal Bit:* A stochastic simulation where outcomes are functions of actions aggregated over time steps. I will introduce a "chaos parameter" where increased information about intermediate steps increases variance in long-run predictions. This tests whether coarse-graining reduces cluelessness without sacrificing expected value.
  *   **Month 3: Integration.** I will interpret the model results philosophically. If the model shows an optimal grain, I will argue whether selecting it is a consequentialist optimization or a smuggled non-consequentialist constraint. If the model shows no optimal grain, I will argue the debate is underspecified.
  *   **Month 4: Writing and Revision.** I will draft the full paper, ensuring the formal appendix remains accessible but rigorous. I will refine the "coarse-grain worry" (that averaging hides rare high-value events) to ensure it doesn't overwhelm the main argument.

  **Possible Conclusions**
  The project aims for a determinate answer, likely falling into one of four categories:
  1.  **The Optimist View:** There is a privileged grain (likely mid-level policies) that minimizes cluelessness without sacrificing value. Selecting it is a consequentialist imperative.
  2.  **The Hybrid View:** An optimal grain exists, but selecting it requires non-consequentialist justification (e.g., pragmatic stability), implying consequentialism is incomplete.
  3.  **The Skeptic View:** No grain is privileged; cluelessness is invariant. The debate between act and global evaluation is currently underspecified because proponents are measuring different things.
  4.  **The Value-Risk View:** Coarse-graining reduces cluelessness but systematically filters out high-variance, high-value opportunities, suggesting agents should tolerate high cluelessness at fine grains.

  Deciding between these will depend on the model's sensitivity to the distribution of value (normal vs. heavy-tailed) and the degree of chaotic sensitivity in the causal model.

  **Risk Assessment and Failure Conditions**
  Honesty about failure is crucial for feasibility. The project fails if:
  *   **Collapse:** The grain-dependence argument collapses straight back into the standard act/rule dispute without offering new leverage. If "choosing a grain" turns out to be identical to "choosing a rule," the novelty is lost.
  *   **Model Fragility:** The formal model requires assumptions so strong (e.g., specific chaos distributions) that no opponent would grant them, rendering the results philosophically inert.
  *   **Scope Creep:** The tripartite split of uncertainty proves too complex for 8,000 words.

  **Scope Management**
  Four months is tight for both philosophical argumentation and formal modeling. To ensure completion:
  *   **Cut:** If the tripartite split bloats the text, I will collapse valuational and effect uncertainty, focusing solely on the distinction between effect-uncertainty and meta-uncertainty, as the latter drives the grain argument.
  *   **Minimum Viable Product:** If the full model proves intractable, the minimum viable version is a conceptual proof demonstrating that *if* value is heavy-tailed and causality is chaotic, grain selection matters. The formal appendix would then be a illustrative example rather than a full simulation.
  *   **Focus:** The core claim is about grain-dependence. The tripartite split is a tool to support that claim, not the end goal. I will prioritize the grain argument.

  **Broader Impact**
  This project matters beyond academic philosophy. Cluelessness is frequently cited by practitioners (e.g., in effective altruism and public policy) as a reason for either paralysis ("we can't know the long run, so do nothing") or dogmatism ("ignore the long run, focus on metrics").
  *   **For Practitioners:** If a specific grain minimizes cluelessness, it offers a heuristic for program evaluation (e.g., evaluate policies yearly rather than per-transaction or per-decade).
  *   **For Decision-Makers:** Understanding that gathering more evidence can sometimes increase uncertainty (meta-uncertainty in chaotic systems) warns against over-engineering interventions in complex systems.
  *   **For Theory:** It clarifies whether consequentialism requires agents to be epistemically lucky or whether the theory itself dictates how agents should carve up their decision problems.

  By determining whether cluelessness is a feature of the world or a feature of our descriptive grain, this project offers a path forward for normative theory that acknowledges epistemic limits without abandoning evaluation.
