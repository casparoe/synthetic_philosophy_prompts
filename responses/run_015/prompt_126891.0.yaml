answer: |-
  This is a classic philosophical pincer movement. Your friend has trapped you between **Kantianism** (Step 1: motive matters), **Humeanism** (Step 3: beliefs don't motivate), and **Psychological Egoism** (Step 6: all desires are self-interest).

  When you combine those three, you get exactly the conclusion he's selling: moral worth is impossible.

  You are right to be suspicious. This argument has the same shape as "psychological egoism," which most rationalists reject because it renders the concept of "interest" unfalsifiable and useless. However, since you want to keep (1) (the Kantian intuition that motive matters), you have to cut the knot elsewhere.

  Here is the breakdown of where to cut, why it looks innocent, and the price of the other options.

  ### The Cleanest Cut: Reject the Inference from (5) to (6)

  **The Step:** The move from "She is motivated to bring about a state of affairs" to "She is acting in order to produce a pleasing state of herself."

  **Why it looks innocent:** It relies on an equivocation between the **ownership** of a desire and the **object** of a desire.
  *   **Ownership:** Yes, the desire is *in her head*. The satisfaction of the desire is a mental state *she* experiences.
  *   **Object:** But what the desire is *about* might be entirely external (e.g., "that the child survives").

  Step (6) smuggles in the claim that because the *mechanism* of motivation is internal (her desire), the *goal* of the motivation must be internal (her pleasure/conscience). This is the "Psychological Egoism" fallacy. It's like saying, "I am using my eyes to see the mountain, therefore I am only looking at my eyes."

  **The Rationalist Translation:** This is a Map/Territory confusion.
  *   **Map:** Her utility function includes a term for "Other People's Wellbeing."
  *   **Territory:** The state of the world where other people are well.
  *   **The Error:** Your friend is arguing that because the utility function is stored in her brain (Map), she is only optimizing for her brain state (Map), not the external variable (Territory).
  *   **The Rebuttal:** If my utility function is $U = \text{My Happiness} + \text{Your Happiness}$, maximizing $U$ is not "selfish" in the colloquial sense used in Step (7). It is only "selfish" in the trivial sense that *I* am the one doing the maximizing. If you define "self-interest" as "acting on one's own utility function," then (7) becomes false (acting on a utility function that values others *is* morally worthy). If you define "self-interest" as "valuing only oneself," then (6) is false (she values the outcome, not just her feeling about the outcome).

  **Cost:** You have to force your friend to define "self-interest" rigorously. If he admits that having "others' welfare" in your utility function counts as non-self-interested, the argument collapses. If he insists that *any* internal motivation is self-interest, he has to admit that *no* action is ever self-interested in a meaningful way, rendering the term useless.

  ---

  ### The Deep Cut: Reject (3) (The Humean Theory of Motivation)

  **The Step:** "Beliefs don't move you on their own... a belief can only cause action in tandem with some desire."

  **Why it looks innocent:** It fits the standard physicalist/causal model of the mind. It feels scientific. It prevents "spooky" moral facts from moving limbs.

  **The Cost:** This is the most expensive option metaphysically.
  *   **Non-Humean Motivation:** You have to accept that recognizing a normative truth (e.g., "This is right") can *itself* be motivational without a pre-existing desire. This is often called **Moral Internalism**.
  *   **The Price:** You need a robust account of how a cognitive state (belief) has "world-to-mind" direction of fit (like a desire) rather than "mind-to-world" (like a belief).
  *   **Rationalist Friction:** This feels like "magic" to a hard naturalist. However, many cognitive scientists argue that "beliefs" and "desires" are not distinct neural substrates but functional labels. If you reject the strict belief/desire dichotomy, you can say that a "moral judgment" is a hybrid state (sometimes called a "besire") that motivates directly.
  *   **Benefit:** This saves Kantianism perfectly. You act *because* it is right, and the "because" is direct, not mediated by a self-regarding desire.

  ---

  ### The Kantian Correction: Reject the Interpretation of (4)

  **The Step:** The friend assumes that a "desire to do what is right" (Step 4) is equivalent to "a desire for the *feeling* of doing right" (Step 6).

  **Why it looks innocent:** It treats all desires as hedonic. It assumes the satisfaction of a desire is always a "warm glow."

  **The Cost:** You have to distinguish between **De Re** and **De Dicto** desires, or **Intrinsic** vs. **Derived** value.
  *   **Kant's Actual View:** Kant argues that the motive of "Duty" is distinct from "Inclination." The friend tries to collapse Duty into a specific type of Inclination (Step 4).
  *   **The Rebuttal:** You can have a "desire" (or volition) to do the right thing where the *satisfaction condition* is the action itself, not a consequent emotional state.
  *   **Example:** A lifeguard jumps.
      *   **Friend's view:** Lifeguard jumps to avoid the guilt of not jumping (Self-interest).
      *   **Your view:** Lifeguard jumps because the situation demands it. The "desire" is just the endorsement of the action. If the lifeguard felt *no* guilt afterward (psychopath), but still jumped because it was right, the friend's model breaks.
  *   **Cost:** You have to argue that "acting to satisfy a desire" doesn't automatically mean "acting to feel good." You can desire *X* where *X* is an external state of affairs. If *X* happens, the desire is satisfied. You don't need an *additional* desire to "feel good about X happening."

  ---

  ### The "Virtue Ethics" Exit: Reject (1)

  **The Step:** "An action has moral worth only if the agent does it because it is right."

  **Why it looks innocent:** It aligns with our intuition that mindless reflexes aren't praiseworthy.

  **The Cost:** You lose the ability to distinguish between the **reliable saint** and the **calculating merchant**.
  *   If you reject (1), you admit that the person who helps from spontaneous sympathy (Corollary 9) *does* have moral worth.
  *   **Virtue Ethics View:** Moral worth resides in the character, not the momentary motive. The person who *doesn't* have to think "this is right" because they are *already good* is *more* praiseworthy, not less.
  *   **Rationalist Fit:** This aligns well with the idea of "optimizing your source code." If you have patched your source code so that helping is the default output, you are *more* aligned, not less. The friend's argument (Corollary 10) claims that reliability reduces praiseworthiness. A rationalist should find this abhorrent. We want agents that are reliably aligned, not agents that struggle and calculate correctly every time.
  *   **Why you might not want this:** You said you'd rather keep (1). If you keep (1), you must accept that the reflex-lifeguard has less *moral worth* (though perhaps still good consequences) than the deliberating one.

  ---

  ### Recommendation for the Chat

  Since you want to keep (1) and avoid heavy metaphysical costs (rejecting 3), **attack the inference from (5) to (6).**

  Here is the script:

  > "You're conflating the **location** of the motive with the **object** of the motive.
  >
  > Step (5) is true: I have a desire, and its satisfaction is a state of me.
  > Step (6) is false: That doesn't mean the *object* of my desire is 'a state of me.'
  >
  > If I desire *that you survive*, the satisfaction condition is *your survival*. Yes, my desire is satisfied, but the state of affairs I produced is *you living*, not *me feeling good*.
  >
  > By your logic, I can never desire anything external. If I desire a glass of water, I'm really just desiring 'the state of myself having drunk water.' This makes 'self-interest' tautological.
  >
  > If 'self-interest' means 'maximizing my own utility function,' then sure, I'm self-interested. But if my utility function assigns positive value to *your* welfare, then maximizing it isn't 'selfish' in the sense Step (7) requires. You've defined 'self-interest' so broadly in (6) that it no longer supports the exclusionary claim in (7)."

  **Why this works:**
  1.  It keeps (1) (Motive matters).
  2.  It keeps (3) (Humean psychology is fine).
  3.  It exposes (6) as a verbal trick (Psychological Egoism).
  4.  It aligns with rationalist utility theory (Utility functions can include other agents).

  If he bites the bullet and says, "Yes, all motivation is selfish by definition," then he has admitted his argument is semantic, not substantive. Moral worth becomes impossible only because he defined "moral worth" as "doing something that isn't motivated by your own brain," which is physically impossible for any agent. That's a bug in his definition, not the universe.
