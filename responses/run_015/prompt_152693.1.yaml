answer: |-
  This is a fantastic position to be in. You have the technical muscle to see through the hand-waving but the freedom to ignore the sociological pressure to cite the "right" papers. Your intuition is correct: there is a hidden assumption in the standard Maxwell's Demon/Landauer narrative, and it lies precisely where you suspect.

  Here is the strategic breakdown. I will rank your three options by **upstream priority**, explain why, and give you criteria for when to abandon a line of thought.

  ### The Verdict: The Ordering

  **1. Upstream (Foundational): Option 3 (The "Register Problem")**
  **2. Midstream (Interpretive): Option 1 (Erasure vs. Observer)**
  **3. Downstream (Generalization): Option 2 (Quantum Decoherence)**

  If you only have time for one, **dig into Option 3.** If you have time for two, do **3 and 1**. You can safely deprioritize Option 2 unless you plan to tackle Black Hole thermodynamics.

  Here is the physics-philosophy justification for this ordering.

  ---

  ### 1. Why Option 3 is the Bottleneck (The "Register Problem")

  You asked: *Does a memory stored in a continuously deformable substrate count as a 'bit'?*

  The standard Landauer/Bennett resolution assumes the existence of a **bistable potential well**. It assumes the memory device *already* has two distinct macrostates (0 and 1) separated by an energy barrier significantly higher than $k_B T$.

  **The Hidden Assumption:** The standard story takes the *discreteness* of the information for granted. It assumes phase space is already partitioned into cells that count as "states."

  **Why this is upstream:**
  You cannot calculate the cost of *erasing* a bit (Option 1) until you have physically defined what constitutes *one* bit. In a continuous fluid (your vortex example), the phase space is continuous. You can theoretically encode infinite information in the precise position of a vortex core.
  *   **Physics says:** No, you can't, because of noise and diffusion.
  *   **The Missing Link:** The definition of a "bit" in physics is not topological; it is **dynamical**. A physical system only encodes a bit if the macrostates are **metastable**. The relaxation time between states must be longer than the operational time of the computer.

  **The Tractability:**
  This is pure statistical mechanics and dynamical systems. You don't need philosophy journals; you need Kramers' escape rates, Lyapunov exponents, and the physics of metastability.
  *   **The Question to solve:** What is the minimum energy barrier required to define a "state" robustly enough that Landauer's principle applies? If the barrier is too low, it's not a bit, it's analog noise. If it's too high, erasure costs more than Landauer's limit.
  *   **Why it moves the needle:** If you can formalize the transition from "continuous physical variable" to "discrete logical state" without invoking an external observer, you ground Landauer's principle in objective dynamics rather than logical abstraction. This solves the "subjectivity" worry in Option 1 before it even starts.

  ### 2. Why Option 1 is Secondary (Erasure vs. Observer)

  You asked: *Does the resolution depend on erasure cost, or is entropy observer-dependent?*

  This is the classic Earman/Norton vs. Bennett debate.
  *   **Side A (Landauer/Bennett):** Entropy is objective; the demon fails because resetting the memory dissipates heat.
  *   **Side B (Jaynes/Subjective):** Entropy is relative to the observer's knowledge. The demon fails because the observer's correlation with the system changes.

  **Why this is Midstream:**
  This debate often stalls because both sides talk past each other regarding what a "state" is.
  *   If you solve Option 3 (defining the physical state via metastability), Option 1 becomes clearer. If the "memory" is defined by physical stability barriers, then "erasure" is the physical act of lowering those barriers and resetting the system. This is an objective thermodynamic process, not just a change in knowledge.
  *   However, if you start here, you risk getting bogged down in semantic arguments about "knowledge" vs. "correlation."

  **The Trap:**
  Many physicists find the "Subjective Entropy" argument unsatisfying because it makes the Second Law dependent on cognition. But the "Objective Erasure" argument relies on the assumption that the memory *must* be reset. (Why can't the demon just accumulate memory forever? Because physical memory is finite—see Option 3).

  **Criteria for Success:**
  You are making progress here if you can derive the erasure cost *without* invoking "information" as a primitive. Can you derive it purely from the phase space contraction required to restore the metastable potential?

  ### 3. Why Option 2 is Downstream (Quantum Decoherence)

  You asked: *Does quantum decoherence make the classical Landauer story obsolete?*

  **Why this is Downstream:**
  Quantum Information Theory (QIT) is a generalization of Classical Information Theory. It adds non-commutativity and entanglement, but it does not fix the foundational definition of a "state."
  *   In QM, the "Register Problem" still exists. A qubit is still a subspace of a Hilbert space that must be protected from decoherence.
  *   Quantum Landauer principles exist (replacing $k_B \ln 2$ with von Neumann entropy changes), but they inherit the same assumptions about what counts as a "reset."

  **When to prioritize this:**
  Only prioritize this if you are interested in the **Measurement Problem**. If you think the collapse of the wavefunction is the physical mechanism of "erasure," then this becomes upstream. But for general thermodynamics, classical stat mech is sufficient to find the conceptual bugs. Adding QM often obscures the thermodynamic intuition with linear algebra.

  ---

  ### Strategic Roadmap for Your Thinking

  If I were in your shoes, here is how I would spend the next year:

  **Phase 1: Attack the "Register Problem" (Option 3)**
  *   **Focus:** The physics of **Metastability**.
  *   **Thought Experiment:** Take your fluid vortex. Calculate the energy cost to distinguish two vortex positions against thermal noise. At what point does the "cost to distinguish" equal the "cost to erase"?
  *   **Hypothesis to Test:** Landauer's limit is not a limit on *logic*, but a limit on *stability*. A system that doesn't pay the Landauer cost cannot maintain a state long enough to be called a memory.
  *   **Win Condition:** You formulate a criterion for "Physical Information" that relies on relaxation times and energy barriers, not abstract bits.

  **Phase 2: Re-evaluate Erasure (Option 1)**
  *   **Focus:** Once you have a physical definition of a bit, look at the reset.
  *   **Thought Experiment:** If the "bit" is defined by a potential well, "erasure" is lifting the particle out of the well and dropping it into a standard state.
  *   **Win Condition:** You demonstrate that the "Observer" is unnecessary. The "cost" is paid to the environment to restore the potential landscape, regardless of whether anyone "knows" the state.

  **Phase 3: Ignore Quantum (Option 2)**
  *   **Action:** Put this on the back burner. Note that if your classical derivation holds, the quantum version should follow via correspondence. If your classical derivation fails, quantum won't save it.

  ### Criteria for "Being Wrong" (When to Pivot)

  You asked what would convince you that you have the ordering wrong. Watch for these signals:

  1.  **If Metastability proves trivial:** If you find that the Uncertainty Principle *automatically* enforces discrete states in any bounded system (making the "continuous substrate" impossible physically), then Option 3 collapses into standard QM. **Pivot to Option 2.**
  2.  **If Erasure proves unnecessary:** If you find a model of a Demon that operates cyclically *without* resetting memory (e.g., using an infinite tape or correlations), and it still doesn't violate the Second Law, then Landauer's Principle is not the fundamental resolution. **Pivot to Option 1 (Observer/Correlations).**
  3.  **If "Information" dissolves:** If you conclude that "information" is not a physical quantity at all, but merely a bookkeeping tool for human ignorance (Jaynes' view), then the whole Landauer project is a category error. **Stop physics, start epistemology.** (I suspect you will find this unsatisfying as a physicist).

  ### Deprioritize This: The "Information is Physical" Slogan

  Be wary of the slogan "Information is Physical." It's too vague.
  *   **Better formulation:** "Logical distinctions require physical stability."
  *   **Overrated Concept:** **Quantum Entanglement in Thermodynamics.** Unless you are dealing with non-thermal baths or black holes, entanglement is usually a complication, not the source of the thermodynamic arrow. Don't let the glamour of QIT distract you from the grit of classical phase space.

  ### Summary

  Your intuition about the "Register Problem" is the sharpest tool you have. The literature often assumes a memory *exists* and asks how much it costs to *wipe*. You are asking **what physical conditions allow a memory to exist in the first place.**

  That is the upstream question. If you can define the physical boundary between "analog noise" and "digital memory" using thermodynamic costs, you will have a more robust foundation for Landauer's principle than the current logical arguments provide.

  Start with the vortex. Calculate the stability. See where the bits emerge. That's where the physics is hiding.
