answer: |-
  To map the 1967 decision point disciplinedly: the relevant actors were the WHO Secretariat, the primary funders (United States and Soviet Union), endemic national governments, and field surveillance workers. The options on the table were not merely binary. They included continuing the failing 1959-style universal mass vaccination; switching to the novel surveillance-and-containment strategy; downgrading the goal from eradication to control in hard-to-reach regions; or withdrawing funding entirely to let the programme coast. The payoffs ranged from permanent global benefit (eradication) to recurring burden management (control). At the moment of intensification, genuine uncertainties included whether an animal reservoir existed (biological feasibility), whether subclinical cases would defeat surveillance (epidemiological feasibility), and whether war zones like Biafra or Cambodia could be accessed (political feasibility).

  Scoring explicitly on the three factors using order-of-magnitude estimates (1–10 scale):
  **Importance:** 10. Two million deaths annually, permanent removal of burden, no treatment costs thereafter.
  **Neglectedness:** 8. High burden relative to donor investment; endemic countries lacked resources, wealthy nations lacked incentive.
  **Tractability:** 6. Biologically favourable (no reservoir, obvious symptoms), but logistically ferocious.
  **Product:** 480. On paper, this is a priority cause.

  However, your suspicion that the framework misdescribes the case warrants serious testing. The standard critique of the ITN framework concerns the difficulty of quantifying these factors reliably. Your speculation is more structural: that the framework assumes smooth, additive returns, whereas eradication is a threshold good. This is a potent objection. In the final years, the cost per case averted exploded as workers hunted the last chains of transmission. A marginalist calculation at that stage would indeed recommend stopping; the 'next pound' buys less immediate health than investing in primary care elsewhere. The framework, read literally, fails to capture the lumpiness of the payoff where nearly all value resides at 100% completion.

  Furthermore, tractability here was endogenous. The surveillance-and-containment strategy and the bifurcated needle were not pre-existing conditions but innovations driven by the eradication goal itself. A static framework treats tractability as given, missing that the difficulty was solved *because* the funding existed. Similarly, neglectedness relies on a counterfactual: would other funders have stepped in? Historically, unlikely, given the Cold War prestige dynamics that uniquely aligned US and Soviet interests. There are also drivers the framework ignores: the single-minded champion (Donald Henderson), the geopolitical value of superpower cooperation, and the downstream liability of maintained virus stockpiles, which created a permanent biosecurity risk rather than a clean benefit.

  Does smallpox vindicate or embarrass the framework? Superficially, it vindicates it: high scores, funded, won. But structurally, it embarrasses it. The framework would have justified stopping before the end, missing the threshold value. It treats the campaign as a sum of parts rather than a binary outcome. To repair this, one must add a 'Completion Potential' or 'Option Value' term. This accounts for non-linear returns where partial success yields disproportionately low value compared to total success. Is this principled or ad hoc? It is principled if one accepts that public goods often have threshold characteristics, but it complicates the elegance that makes ITN popular. It requires estimating the shape of the return curve, not just the height.

  Distinguishing settled history from extrapolation: It is settled that the strategy shifted in 1967 and that eradication was achieved in 1980. It is settled that the last mile was disproportionately expensive. It is contested among historians whether the programme would have collapsed without the specific political alignment of the superpowers; I am extrapolating that a marginalist funder would have defunded the endgame, though this follows logically from your threshold objection. Your speculation on smooth versus threshold returns is not standard wisdom but aligns with economic critiques of public goods. The standard critique remains measurement error; yours is structural incompatibility.

  In verdict, the smallpox case suggests the ITN framework is a heuristic for marginal improvements, not transformational thresholds. To use it for eradication without modification is to risk abandoning the finish line. The repair requires acknowledging that some causes are not bundles of marginal gains but binary switches. Until the framework incorporates lumpiness, it remains blind to the very projects that yield the highest permanent returns.
