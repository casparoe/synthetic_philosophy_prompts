  The rain streaked the window of the stationary train, blurring the platform lights into smeared oil paints. Alex stirred a lukewarm coffee from the vending machine.

  'So,' Jordan said, leaning back against the plastic seat. 'The reading group. You still think constitutional anchoring saves epiphenomenalism from scepticism?'

  'It's *constitutive* anchoring,' Alex corrected gently. 'And yes. Look, the paradox assumes knowledge requires causal tracking. But indexicals don't work that way. When I say "I am here", my location doesn't cause the thought; my presence constitutes the truth of it. Same with pain. "I am in pain" isn't a report sent from the quale to the brain. It's a demonstrative latch. The experience is part of the judgement itself.'

  'But "I am here" is immune to error through misidentification,' Jordan countered. 'I can't be wrong about *who* is here. But "This is a pain" has a classificatory component. I might misidentify the quality. If the quale is inert, what fixes the classification? Surely it's the physical state. So when I say "pain", I'm latching onto the C-fibre firing, not the feel. The quale is just a passenger wearing a label someone else stuck on.'

  Alex paused. 'Fair. The anchoring secures the *existence* of the experience, not necessarily the *kind*. I know *something* is happening because I'm undergoing it. But you're right, the concept "pain" might be fixed by functional role.'

  'So introspection tells you *that* you experience, but not *what*?'

  'Exactly. It earns you the existence claim.'

  'Consider inversion,' Jordan pressed. 'Two physically identical judgers. In you, the physical state accompanies red qualia; in me, green. We both say "I see red". Under your view, your judgement is constituted by red, mine by green. Both judgements are true of their respective experiences. But since the physical output is identical, the introspection hasn't discriminated anything. It says nothing distinct about the world or the mind. It's vacuous.'

  'That's the uncomfortable bit,' Alex admitted, staring at the rain. 'I'll concede it. Anchoring guarantees I'm not wrong about *having* an experience. It doesn't guarantee my taxonomy matches yours. The sub-personal machinery does the sorting. So yes, introspection is private but blind to structure.'

  'Blind is generous. It's mute. But here's where I think it actually dies. Time.' Jordan tapped the window. 'You said the experience constitutes the judgement. That works for the instantaneous "Ouch!". But what about "That hurt"? Or "The second shock was duller than the first"?'

  Alex shifted. 'Memory traces.'

  'Traces are physical,' Jordan said sharply. 'The original experience is gone. It can't constitute a current judgement any more than a dead man can sign a cheque. If the quale is causally inert, it leaves no mark on the memory trace distinct from the physical cause. So when you compare two past pains, you're comparing physical traces. The qualia are left behind. Your anchoring only works in the specious present. Anything beyond that reverts to standard causal theory, which epiphenomenalism forbids.'

  Alex sighed, putting the coffee down. 'You're right. The constitutive link snaps once the moment passes. I can anchor the now, but I can't anchor the past.'

  'So you save self-knowledge only by shrinking it to a pointless instant,' Jordan said. 'You know you exist, now, but you can't know what you felt, or compare it, or learn from it. That's not knowledge; it's a flash.'

  'It limits the scope,' Alex conceded, watching the platform clock finally tick forward. 'I suppose anchoring dissolves the sceptical paradox only for immediate demonstratives. For anything involving memory or comparison... yes, I think that's where it dies. The train's moving, though.'

  'Finally,' Jordan said. 'Just don't expect the qualia to push it.'
