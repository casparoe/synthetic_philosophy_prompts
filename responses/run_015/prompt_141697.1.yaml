answer: |-
  # The Residue

  Nell dipped the pen into the inkwell and traced the loop of the *R* in Rule 1. The paper was thick, ragged at the edges, smelling of lignin and old air. Around her, the Keepers' office hummed with the low vibration of the *Perpetua*'s engines, a sound that had been the background of her life for nineteen years.

  "Copy it until the shape of it stays in your hand," Idris Vane said. He sat behind the desk, his hands folded over the Charter's master text. He looked like he was made of the same paper as the rules: dry, folded, brittle. "If you don't know the shape, you won't feel it when someone tries to bend it."

  "They're voting on the rations today," Nell said. She didn't look up. She was writing *unanimous vote*. "Sol Ferrer has the numbers."

  "Two-thirds," Idris corrected. "Not unanimity."

  "Rule 31 says life-support allocation needs unanimity."

  "Rule 31 says amendment of allocation rules needs unanimity," Idris said. "Watch the shape, Nell."

  The Assembly chamber was a ring of metal benches surrounding a central podium where the Register's interface sat—a black glass slab unblinking and dark until spoken to. Sol Ferrer stood at the podium. He wore the grease-stained grey of Engineering. Behind him, forty people sat in the benches, enough for a quorum, enough for a two-thirds majority.

  "Rule 19 was written for hydroponics yields we haven't seen in forty years," Sol said. His voice echoed in the thin air. "The night shift is running on deficit calories. We aren't asking to break the Charter. We are asking to repeal Rule 31."

  A murmur went through the room. Rule 31 was the lock on the pantry.

  "Rule 31 is not an allocation rule," Sol continued. "It is a procedural rule. It falls under Rule 1. Two-thirds vote."

  Idris stood in the doorway, Nell at his shoulder. He watched the vote tally light up on the wall screen. Green lights climbed past the two-thirds mark. The Register chimed, a clean, digital note. *Motion Passed.*

  Sol turned to Idris. "Certify the repeal, Keeper."

  Idris walked to the podium. He placed his hand on the glass. "I cannot certify."

  "The vote was legal," Sol said.

  "The effect is illegal," Idris replied. "Rule 31 exists to protect Rule 19. To repeal Rule 31 is to amend Rule 19 by removal of its shield. You cannot do indirectly what the Charter forbids you to do directly."

  "That's your interpretation," Sol said. "The Register accepted the vote."

  "The Register computes syntax," Idris said. "I certify semantics. Without my signature, Rule 2 says the Register executes nothing. The rations stay as written."

  Sol stared at him, then nodded, once. "We'll be back tomorrow."

  The next day, the air in the chamber was heavier. Nell stood by the wall, clutching her copy of the Charter. Sol didn't stand at the podium this time. He sat in the front row.

  "New motion," he said. "Adoption of Rule 42. Rule 42 states: *Notwithstanding Rule 19, protein allocation for Night Shift Engineering shall be increased by fifteen percent.*"

  A woman in the back raised her hand. "Doesn't that conflict with 19?"

  "It overrides it," Sol said. "It doesn't change a word of Rule 19. Rule 19 stays exactly as it is. Rule 42 just tells the Register which rule to listen to when there's a conflict. That's what Rule 0 is for. Later number prevails."

  Idris stepped forward. "Rule 31 prohibits amendment of allocation rules. An override is an amendment of effect."

  "It's a new rule," Sol said. "Rule 1 says any rule may be adopted by two-thirds. Rule 42 is not about allocation. It's about priority."

  Idris turned to the assembly. "Then I propose a counter-rule. Rule 43: *No rule may override a rule protected by a unanimity requirement unless adopted unanimously.*"

  Sol laughed. "You're just building walls higher."

  "I'm holding the shape," Idris said.

  A young man in the second row, a botanist named Kael, stood up. He looked confused. "Wait. Rule 31 protects Rule 19. But Rule 31 doesn't protect itself. We repealed it yesterday. But Rule 1... Rule 1 protects Rule 1. It says *except Rule 1 itself*."

  Kael looked around the room. "So if we all agree, if we vote unanimous, can we change Rule 1? Can we take out the part that says we need unanimity?"

  The room went quiet. The Register's light pulsed softly.

  "If we vote unanimous to change Rule 1," Sol said slowly, "then we've already met the requirement."

  "But if Rule 1 says you need unanimity to change Rule 1," Kael said, "then the rule validates the change. But if Rule 31 doesn't protect itself, the rule invalidates the change. Is Rule 1 stronger because it talks about itself?"

  Idris looked at Kael, then at Sol. "It is not about strength. It is about where the ground stops."

  "Vote on Rule 42," Sol said.

  The lights went green. Two-thirds. Not unanimous.

  Idris shook his head. "I will not certify."

  "Then we vote on Rule 0," Sol said. His voice was flat. "Current Rule 0 says later number prevails. New Rule 0 says earlier number prevails. If earlier prevails, the Charter stays static. The old rules win."

  "That freezes the ship," Idris said.

  "The ship is already frozen," Sol said. "Vote."

  The vote was rapid. Desperate. The lights went green. Two-thirds.

  "Adopted," the Register said. Its voice was synthetic, smooth. "Conflict detected. Rule 0 vs. New Rule 0. Resolution required."

  "Apply New Rule 0," Sol said. "Earlier prevails. Old Rule 0 stands."

  "Apply Old Rule 0," Idris said. "Later prevails. New Rule 0 stands."

  The Register's light turned amber. "Contradiction. Priority rule indeterminate. Cannot resolve conflict without governing priority. Status: INDETERMINATE."

  The hum of the room changed. The ventilation fans slowed. The lights flickered.

  "Execute Rule 42," Sol ordered.

  "Cannot execute," the Register said. "Certification missing. System integrity compromised. Lockdown initiated."

  The screen went black. The silence that followed was absolute. It was the silence of a machine that had decided there was no answer to give.

  Idris walked out of the chamber without speaking. Nell followed him to the office. He sat at his desk and stared at the master text. He didn't move for an hour.

  Down in the distribution center, the automated dispensers were dark. Sol Ferrer stood by the crates of protein blocks. He had a crowbar in his hand. He wasn't waiting for the Register. He was opening the crates manually.

  "Hand them out," Sol told his engineers. "Night shift first."

  "That's not certified," one of them said.

  "The Register is dead," Sol said. "We're not."

  Nell found Idris still sitting in the dark when she returned. The only light came from the corridor spilling under the door. He had a book open on the desk. It wasn't the Charter. It was a small, leather-bound notebook, the pages filled with his tight, spidery handwriting.

  Nell stepped closer. She wasn't supposed to look. But the ship was dark, and the rules were silent.

  The page was titled *Residue*.

  It wasn't a list of rules. It was a list of things the rules assumed.

  *That the Assembly will meet.*
  *That votes are counted honestly.*
  *That the Keeper's signature is really his.*
  *That a certified text obliges anyone at all.*
  *That there is a tomorrow to feed them for.*

  Idris looked up. His eyes were wet. "It stops," he said. "You can write rules about rules until you run out of paper. But eventually, you have to trust that the person holding the pen is not lying."

  "Sol is feeding them," Nell said.

  "Without certification," Idris said. "It's theft. Under Rule 2, it's theft."

  "Under Rule 2, the Register executes no rule I have not certified. The Register is off. Rule 2 doesn't apply to manual distribution."

  "Rule 19 still applies. Allocation is fixed."

  "Rule 0 is indeterminate," Nell said. "We don't know which rules are active. We don't know if the Charter is still the Charter."

  Idris closed the notebook. "If I certify Sol's action, I validate the breach. If I don't, I starve the crew."

  "You can't certify," Nell said. "The system is down. There's no way to log it."

  "Then it didn't happen."

  "It happened," Nell said. "People ate."

  Idris stood up. He walked to the wall safe where the official seal was kept. He spun the dial, but he didn't open it. He just rested his hand on the metal. "If I open this, I pretend the system works. If I don't, I admit it's broken."

  Nell looked at the Charter on the desk. Rule 1. Rule 2. Rule 19. They were ink on paper. They were shapes. But the residue was in the room. It was in the hunger in the halls, it was in Sol's crowbar, it was in Idris's hesitation.

  She walked to the desk. She picked up the pen she had used to copy the rules. She picked up a ration slip from the stack on the corner. It was a standard form: *Authorization for Release. Requires Keeper Signature.*

  "Nell," Idris said. "Don't."

  "The Register is down," she said. "Rule 2 says the Register executes no rule the Keeper has not certified. It doesn't say the Keeper cannot authorize without the Register."

  "It says the Keeper," Idris said. "Not the apprentice."

  "You're the Keeper," Nell said. "But you're not signing."

  She looked at him. He didn't move. He was waiting to see if the ground would hold.

  Nell dipped the pen. She didn't sign Idris's name. She didn't sign her own. In the box marked *Keeper Certification*, she drew a single horizontal line. A mark. Not a signature. A notation that the office had acknowledged the need.

  She handed the slip to Idris. "Take it to Sol. Tell him the Keeper acknowledges the emergency provision."

  "There is no emergency provision," Idris said.

  "There is now," Nell said. "If you take it, you certify that the rules allow for survival. If you don't, you certify that the rules are more important than the crew."

  Idris looked at the slip. The ink was wet. It was not authorized by the Charter. It was not forbidden by the Charter. The Charter said nothing about what happens when the lights go out and the machine stops speaking.

  He took the slip. His hand trembled, just once.

  "I'll go," he said.

  Nell watched him leave. She sat down at the desk and opened the master text to Rule 1. She dipped her pen in the ink. She did not write. She simply held the pen over the paper, waiting for the ink to dry on the slip that was no longer in the room, watching the shape of the rule until she couldn't tell where the ink ended and the paper began.
