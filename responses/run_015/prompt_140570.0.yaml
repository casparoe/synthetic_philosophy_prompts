answer: |-
  This is a profound observation, and you have correctly identified that the inconsistency you see is not a bug in the system, but a feature of how law assigns meaning. You are asking for a map of the philosophical terrain that underlies your daily work.

  Here is the reconstruction of the implicit theory, the analysis of the proposed bill, and the practical implications of shifting the ground beneath your feet.

  ### 1. The Implicit Theory: Institutional Functionalism

  To answer your first question directly: There is no single theory of meaning governing these documents. The pattern does not presuppose one theory of meaning plus an account of document types; it presupposes **several theories of meaning selected by the function of the institution.**

  In philosophy of language, the distinction your friend mentioned is between *sentence meaning* (what the words conventionally signify to a competent speaker) and *speaker meaning* (what the specific author intended to convey by using those words).
  *   **Wills** prioritize *Speaker Meaning*.
  *   **Contracts** prioritize *Sentence Meaning* (specifically, the hearer's understanding of it).
  *   **Statutes** prioritize *Public Sentence Meaning* (with a safety valve for *Legislative Speaker Meaning* in extreme cases).

  The "theory" that holds this together is not linguistic; it is **institutional functionalism**. Meaning is not a property inherent in the text, nor is it a property inherent in the mind of the author. Meaning is a property of the *relationship* the text mediates.

  *   **The Will (The Unilateral Gift):** The function is to effectuate the autonomy of a specific individual regarding their property after they cease to exist. There is no "other party" to protect. The only value at stake is the testator's autonomy. Therefore, the theory of meaning *must* be intentionalist. If the text fails to capture the intent, the institution fails its purpose. The "death of the author" here does not kill the intent; it crystallizes it. The court becomes a medium to speak for the dead.
  *   **The Contract (The Bilateral Exchange):** The function is to facilitate reliance and commerce. There are two (or more) living parties. If we privileged *Speaker Meaning*, Party A could claim they meant "X" while Party B relied on "Y." To protect reliance, the law adopts the "Objective Theory of Contracts." Meaning is what a reasonable person in the *recipient's* position would understand. The author's secret intent is irrelevant because the contract is a promise *to another*, not a declaration *of self*.
  *   **The Statute (The Public Rule):** The function is to give notice to the citizenry and constrain the state. Citizens cannot read legislators' minds; they can only read the text. Therefore, *Public Sentence Meaning* dominates. However, because the legislature is a collective "author" that cannot truly have a single mental state, courts allow "scrivener's error" corrections not because they know what the legislature *felt*, but because a text that contradicts its own obvious purpose ceases to function as a rule.

  **Verdict:** The inconsistency is the point. Meaning is not a property of texts; it is a property of the institution built around them.

  ### 2. Strict Requirements vs. Comfortable Fits vs. Underdetermination

  If we accept Institutional Functionalism as the governing theory, we can separate what is necessary from what is contingent.

  **What the Theory Strictly Requires:**
  *   **Contracts:** Must exclude subjective intent. If subjective intent were admissible, the reliance interest (the core function of contract) would be destroyed. You cannot rely on a promise if the promisor can later redefine it by testifying about their internal state.
  *   **Wills:** Must admit extrinsic evidence of intent. Since there is no reliance interest to balance (the heirs expect nothing until death), excluding evidence of actual intent would frustrate the core function (donative autonomy).

  **What Merely Fits Comfortably:**
  *   **Statutory Textualism:** It fits comfortably with democratic notice, but it is not strictly required by the theory. A "Purposivist" statute regime (where legislative intent rules) is theoretically possible if one values democratic outcomes over citizen notice.
  *   **The "Scrivener's Error" Exception:** This fits comfortably with the idea that texts are tools. But it is a pragmatic patch, not a philosophical necessity. It acknowledges that when the tool breaks completely (nonsense text), we look to the hand that built it.

  **Where the Pattern is Underdetermined:**
  *   **The "Diffuse Authorship" of Wills:** As you noted, wills are already ghostwritten. The theory requires a "Testator's Intent," but the practice involves a "Lawyer's Drafting of the Testator's Story." The system is underdetermined here because it pretends the text is a direct emanation of the testator's mind, even though everyone knows it is a translation. The system works only because we *fictionalize* the lawyer as a transparent conduit.
  *   **The "Absurdity" Doctrine in Statutes:** How absurd must a result be before we abandon text for intent? The theory doesn't say. It creates a zone of judicial discretion that is theoretically messy but practically necessary.

  ### 3. Single Account vs. Inconsistency

  Could a single account handle all three without inconsistency?

  **Yes, but it would break the law.**
  *   **Radical Intentionalism:** If you applied wills-law to contracts, commerce would stall. Every breach would turn into a trial about what the parties *really* felt. If you applied it to statutes, judges would become super-legislators, enforcing the "spirit" of laws over the enacted text, violating separation of powers.
  *   **Radical Textualism:** If you applied contract-law to wills, you would get the "plain meaning" rule in probate. This happens in some jurisdictions. The result is that typos defeat gifts, and the actual wishes of the dead are ignored for the sake of "certainty." This is theoretically consistent but morally harsh in the probate context.

  **Conclusion:** The inconsistency is necessary because the values at stake (Autonomy vs. Reliance vs. Democracy) are incommensurable. You cannot maximize all three with one theory of meaning.

  ### 4. Practical Changes: Thought Experiments

  **Scenario A: The Profession Goes Wholeheartedly Intentionalist**
  *   **Wills:** Little change for you, except perhaps more litigation.
  *   **Contracts:** Chaos. Every dispute would require depositions of all negotiators. "Integration clauses" (merger clauses) would be void. A handshake deal could override a written contract if the subjective intent was there. Security in lending and commerce would vanish.
  *   **Statutes:** Courts would spend all their time reading committee reports and floor speeches. Lobbyists would focus less on the text of the bill and more on the "report language." The text on the page would become secondary to the political deal-making behind it.

  **Scenario B: The Profession Goes Wholeheartedly Textualist**
  *   **Wills:** Your job becomes harder and colder. The "two Johns" case you mentioned? The gift fails. The typo in the address? The house goes to the residuary estate. You would spend less time interviewing family members and more time parsing grammar. The "small estate" would shrink because more assets would fall into intestacy due to drafting errors.
  *   **Contracts:** Minimal change; this is mostly the status quo.
  *   **Statutes:** Courts would refuse to fix obvious errors. If a statute says "vehicles" but clearly meant "cars" based on context, a truck might be regulated unintentionally. The law becomes rigid, predictable, and occasionally nonsensical.

  ### 5. The Bill: Automated Drafting and the "Unified Subject"

  This brings us to the legislation troubling you. The bill proposes that if a will uses automated drafting assistance, the rule flips from Intentionalism to Textualism.

  **Does it presuppose a "Unified Intending Subject"?**
  Yes. The bill implicitly argues that *true* intention requires a direct, unmediated connection between the human mind and the text. It assumes that human drafting (even with a lawyer) preserves the "soul" of the intent, but machine assistance severs it.

  **Is that a coherent line?**
  No. As you noted, your current practice already involves diffuse authorship. The client speaks, you translate, the template structures. The "intent" is already a collaborative construction.
  *   **The Incoherence:** The bill treats the *lawyer* as a transparent conduit (preserving intent) but the *software* as an opaque barrier (destroying intent). But in both cases, a third party (human or algorithm) is structuring the sentences.
  *   **The "Machine Contract" Contrast:** You mentioned commercial agreements where executable code *is* the contract. In that context, the law assumes **no intention is needed**. The code is the performance. If the code bugs out, the loss falls on the party who relied on it, not the coder's "intent."
  *   **The Contradiction:** The legislature is simultaneously saying:
      1.  *For Contracts:* Code is sovereign; intent is irrelevant. (Textualism/Performance)
      2.  *For Wills:* Human + Lawyer is sovereign; intent is key. (Intentionalism)
      3.  *For Wills:* Human + Software is **not** sovereign; text is key. (Textualism)

  **What should you think?**
  The bill is likely not driven by a coherent philosophy of meaning. It is driven by **risk allocation**.
  *   Sponsors likely view automated will-drafting as a "product" rather than a "service." If a lawyer drafts a will and makes a mistake, the lawyer is liable (malpractice). If software drafts a will and makes a mistake, who is liable? The software vendor? The user?
  *   By making the text conclusive, the legislature is likely trying to **insulate the software vendors** from liability for "failing to capture intent." If the text governs, the software only has to ensure the text is grammatically correct, not that it matches the user's soul.
  *   It creates a "Uncanny Valley" of authorship. If a human writes it, we trust the mind. If a machine writes it, we trust only the output.

  **Recommendation for your view:**
  You are right to be bothered. The bill treats the *medium* of drafting as the determinant of *meaning*, which contradicts the foundational principle of probate law (that the medium is secondary to the donative intent).

  If you need to argue against it (or understand its impact), the argument is this: **Authorship in law is already a legal fiction.** We pretend the testator wrote the will to serve the policy of autonomy. Whether a paralegal, a partner, or a Python script arranged the nouns and verbs is irrelevant to the *policy goal*. If the goal is to effectuate the transfer of wealth according to the deceased's wishes, the tool used to record those wishes should not change the rules of interpretation. To change the rules based on the tool is to prioritize the *form* of the document over the *function* of the institution.

  The bill essentially says: "We value your autonomy less if you used a computer to express it." That is not a theory of meaning; it is a penalty on efficiency.
