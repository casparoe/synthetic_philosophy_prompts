  This is a classic problem in the philosophy of science, and your intuition is tracking something very real that has occupied some of the best minds in the field for the last fifty years. You are grappling with the definition of **verisimilitude**, or as it is more commonly called in contemporary literature, **truthlikeness**.

  You asked me to brainstorm candidate concepts, critique them, and then commit to one. I will walk through the three most relevant frameworks that attempt to capture what you are calling "closeness," explaining why two of them struggle with your specific examples before settling on the one that best captures the "real article."

  ### Candidate 1: Popperian Verisimilitude (The Content Account)
  This is the view you vaguely remembered. Karl Popper defined closeness to the truth in terms of logical content. A theory $A$ is closer to the truth than theory $B$ if $A$ has more true consequences and no more false consequences than $B$ (or more true and fewer false).

  **What's wrong with it:**
  You already sensed this misbehaves. In 1974, Pavel Tichý and David Miller independently proved that Popper's definition collapses. If two theories are both false (like "orbit is a circle" and "orbit is a parabola"), you cannot compare them using Popper's rules. A false theory always has an infinite number of false consequences. Adding *any* true consequence to a false theory inevitably adds false consequences too (due to logical combinations), so you can never get a net gain in verisimilitude once you are false.
  **Verdict:** This matches your "consequence-counting" worry. It fails to distinguish between the circle and the parabola because both are simply "false." It cannot account for degrees of error.

  ### Candidate 2: Syntactic Repair Cost (Your Intuition)
  This is the notion you proposed: closeness is measured by how many "edits" or logical operations are required to turn the false claim into the true claim. The circle needs one parameter tweak (eccentricity); the parabola needs a change in the fundamental equation type.

  **What's wrong with it:**
  While this matches your intuition in the orbit case, it is philosophically fragile because it is **language-dependent**. The "cost" of a repair depends on the vocabulary you use.
  Imagine I define a new predicate "Cirlipse," which means "either a circle or an ellipse." Now, the claim "The orbit is a Cirlipse" is true. The claim "The orbit is a Circle" is one edit away from "Cirlipse." But if I define "Parabola*" as "anything that is not a Circle," the repair cost changes entirely.
  Furthermore, consider your "Circle of radius 1AU" case. You noted you are unwilling to call it close, even if the repair cost seems low. This is because adding specific false details (radius = 1AU) increases the **false content** even if the "shape edit" is the same. A pure syntactic repair cost doesn't automatically penalize *specificity* in falsehoods unless we weight the edits, and weighting them requires us to already know what matters (semantics), not just how many words we change.
  **Verdict:** This is a powerful heuristic, but it cannot be the fundamental definition because truth is not a property of sentences, but of what sentences say about the world.

  ### Candidate 3: Semantic Distance (The Similarity Approach)
  This is the leading modern account, championed by philosophers like Ilkka Niiniluoto and Graham Oddie. Instead of counting consequences or syntactic edits, this approach maps claims onto a **logical space** or a **state space**.
  *   **The Beans Case:** The state space is a number line. The truth is a point (940). Your guess is a point (900). Distance is simple numerical difference.
  *   **The Orbit Case:** The state space is a geometric parameter space (eccentricity, semi-major axis, etc.). The truth is a region (Ellipses with $e \approx 0.01$). The "Circle" claim is a point/region at $e=0$. The "Parabola" claim is a region at $e=1$. The distance from $0$ to $0.01$ is much smaller than from $1$ to $0.01$.
  *   **The Radius Case:** The claim "Circle of radius 1AU" fixes two parameters ($e=0, r=1$). The truth is ($e=0.01, r=1.0001$). The claim "Circle" only fixes one parameter ($e=0$). In semantic distance accounts, being more specific while being wrong penalizes you more. The "Circle" claim is vague enough to be *closer* to the truth region because it doesn't commit to the false radius value.

  **What's wrong with it:**
  It requires us to agree on the "metric" of the space. How do we measure distance between "Electron" and "Quark"? It works beautifully for quantitative cases (beans, orbits) but gets tricky for qualitative conceptual changes. However, it avoids the language-dependence problem of syntactic repair by focusing on the *states of affairs* the claims describe, not the words used.

  ### Commitment: Truthlikeness (via the Similarity Approach)

  The concept you are reaching for is **Truthlikeness**.

  Your "repair cost" intuition is essentially a folk version of the **Semantic Distance** measure within Truthlikeness theory. It is the "real article" because it successfully unifies your two cases:
  1.  **Beans:** It reduces to numerical distance.
  2.  **Orbits:** It reduces to geometric distance in parameter space.
  3.  **Specificity:** It explains why "Circle of radius 1AU" is worse than "Circle." In Truthlikeness theory, a proposition's closeness to the truth is a function of both how much truth it contains and how far its errors are from the actual state. The "Radius 1AU" claim commits to a specific falsehood, increasing its distance from the truth in the state space, whereas the generic "Circle" claim leaves the radius open, keeping it semantically closer to the truth.

  The reason "repair cost" feels right but breaks down is that it is a syntactic proxy for semantic distance. When the vocabulary changes, the proxy breaks, but the underlying semantic distance remains the robust philosophical standard. You should search for **Truthlikeness** (or sometimes **Approximate Truth**), specifically looking for discussions on the **Similarity Approach** versus the **Content Approach**.

