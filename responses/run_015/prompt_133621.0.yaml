  **MEMORANDUM**

  **TO:** Discovery Engines Program Committee
  **FROM:** Chair, Technical Review Committee
  **DATE:** Thursday, October 26
  **SUBJECT:** Decision Recommendation: Reference-Free Universal Prediction (Proposal #44-B)

  **Recommendation**
  I recommend we **fund a twelve-month scoping award** of $400,000, contingent on specific milestone deliverables, rather than the requested three-year, $2.4M full award. We should decline the full request at this time but invite a resubmission for the remaining balance upon successful completion of the scoping phase.

  **Context**
  The proposal seeks to operationalize Solomonoff induction by approximating the universal prior via a dovetailing search over short programs, constrained by a hard compute budget. The novel contribution is a "reference-free" mechanism: running the search over four distinct universal machines (register, lambda, concatenative, combinatory), computing translation constants between them, and averaging predictions under a prior over machines. The goal is to mitigate the arbitrariness of the reference machine choice.

  The committee readers are split. Reader A argues the framework is theoretically uncomputable at the core, that the invariance constant renders the bound useless for finite data, and that the proposal should be declined. Reader B argues the asymptotic bound is the only non-circular justification for Occam's razor available, that the constant is irrelevant in the limit, and that the empirical question justifies the full investment.

  **Analysis of Core Theoretical Questions**
  In reaching this recommendation, the committee focused on two specific theoretical claims. We require the applicants to address these directly during the scoping phase.

  **1. Is the appeal to the universal prior doing real work, or is it decoration?**
  The proposal asserts that weighting predictions by the Solomonoff prior ($2^{-length}$) across four machines yields a superior predictor to standard ensemble methods. However, for finite data and fixed compute budgets, a dovetailing search over short programs often converges on similar heuristic classes regardless of the underlying machine language. If the four machines produce highly correlated predictions on standard benchmarks, the "universal prior" weighting may be functionally indistinguishable from a simple uniform average or a standard Bayesian Model Average.
  *Argument:* The universal prior is only doing "real work" if the specific weighting scheme derived from Kolmogorov complexity outperforms a baseline ensemble that ignores those weights. If the performance gain comes entirely from the diversity of the four machines rather than the Solomonoff weighting, the theoretical apparatus is decoration. The scoping award must isolate the marginal value of the prior weighting itself.

  **2. Does "it's only a constant" answer the reference-machine worry or evade it?**
  Reader B relies on the Invariance Theorem, which states that the complexity difference between two universal machines is bounded by a constant $c$. The argument is that $c$ becomes negligible as data $n \to \infty$.
  *Argument:* This answer evades the practical constraint. In a "Discovery Engines" context, we operate on finite $n$. If the translation constants between the four proposed machines are large relative to the signal complexity of the target datasets, the "reference-free" average will not converge within the project's lifetime. The constant is not merely an offset; for finite data, it is the error budget. Claiming it is asymptotically irrelevant is mathematically correct but operationally vacuous if the constant exceeds the signal-to-noise ratio of the test data. The applicants must empirically bound these constants for their specific machine set, not merely cite the theorem.

  **The Strongest Case for the Rejected Position (Decline)**
  I have chosen not to recommend a full decline, but the argument for doing so is robust and must be acknowledged. Reader A's position rests on the claim that **computable approximations of uncomputable functions cannot inherit the theoretical guarantees of the limit.**
  The strongest version of this argument is that Solomonoff induction is not a theory of approximation; it is a definition of a limit. By imposing a hard compute budget, the applicants are not "approximating" Solomonoff induction; they are building a heuristic search algorithm that *uses* Solomonoff induction as a justification. The theoretical bound on total expected error applies to the uncomputable prior, not the computable truncation. Therefore, the grant request rests on a category error: it asks for funding based on a theorem that does not apply to the method being funded. If the method works, it will be because of engineering specifics (search heuristics, language choice), not because of the universal prior. Funding the full $2.4M based on the theoretical guarantee is therefore funding a justification that does not technically support the expenditure. A decline would protect the foundation from investing in a theoretical edifice that may collapse under the weight of its own computability constraints.

  **Rationale for Scoping Award**
  Despite the strength of the decline argument, Reader B is correct that the empirical question is unresolved. If a computable approximation of the universal prior *does* outperform standard ensembles on finite data, it would represent a paradigm shift in predictive modeling. We cannot settle the theoretical dispute without empirical data regarding the magnitude of the invariance constant in practice.
  A scoping award allows us to purchase that data without committing to the full theoretical edifice. It shifts the burden of proof from *theoretical assurance* to *empirical demonstration*.

  **Conditions for the Scoping Award**
  Funding is contingent on the applicants agreeing to the following milestones within 12 months:
  1.  **Baseline Decoupling:** Demonstrate performance separation between the Solomonoff-weighted ensemble and a uniformly weighted ensemble of the same four machines.
  2.  **Constant Estimation:** Provide an empirical upper bound on the translation constants between the four machines for a standard corpus (e.g., Hutter Prize data), showing they do not dwarf the signal.
  3.  **Compute Efficiency:** Show that the dovetailing search yields better loss/compute trade-offs than standard neural baselines at equivalent FLOP budgets.

  **Closing**
  **What would change the committee's mind?**
  We would move to full funding immediately if the applicants can provide preliminary data (prior to the award start) showing that the Solomonoff-weighted ensemble significantly outperforms the uniform ensemble on a held-out benchmark. This would resolve the "decoration" concern ex-ante.

  **Where is this recommendation most likely to be mistaken?**
  My recommendation assumes that the invariance constant is a material barrier to performance on finite data. I am most likely to be mistaken if Reader B is correct that the constant is negligible for *natural* data distributions, even if it is large for worst-case strings. If the structure of real-world data inherently aligns with the short programs of these specific machines such that the translation costs are trivial, then the scoping phase is an unnecessary delay, and the committee will have slowed a potentially transformative line of inquiry by imposing artificial milestones on a method that works out of the box.
