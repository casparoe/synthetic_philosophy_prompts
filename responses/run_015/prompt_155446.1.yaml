prompt: |-
  I should say at the outset that I have no academic background in philosophy or Buddhist studies. I read on my own — mostly English translations of early Buddhist texts, and, for reasons that began separately, a good deal of the effective-altruism literature — and the two reading habits keep colliding over one sentence.

  The sentence is "Buddhism is about intentions, not consequences." As I have seen it explained by people who know the languages, it descends from a line in the Pali canon where the Buddha, asked what karma is, answers with a word usually rendered "intention" but said to be nearer to "volition" or "the mind's setting itself toward something" than to the loose modern sense of "meaning well." I mention that only because the gap between those two English senses may be doing a lot of the work.

  I met it last in an argument about whether a Buddhist ought to care whether her actions do any good. My interlocutor's use was this: a Buddhist's reasons for acting stop at the quality of the mind she acts from; whether the action feeds anyone, cures anyone, or alters anything in the world is, in his words, consequentialist contamination, and auditing outcomes is something only a utilitarian would insist on. He deployed the sentence to dismiss, wholesale, the practice of comparing two candidate actions by their expected effects.

  What I want is the menu hiding inside the sentence. The distinctions I have been turning over, without being able to tell which are load-bearing, are roughly these: a claim about what fixes an action's karmic quality, versus a claim about the criterion of right action, versus a claim about praiseworthiness or merit as opposed to rightness; a claim about what is within an agent's control; a claim about which consequences are the relevant ones — effects on the world, versus effects on the agent's own mind, dispositions and progress toward liberation; a claim riding on the fact that the standard term is often translated "skillful," which sounds like a notion measured by success; and a claim drawn from the no-self teaching, to the effect that if there is no one who owns the outcome, outcomes cannot matter. I also cannot tell whether any of these sits comfortably with the precepts being stated as prohibitions on bringing things about — on killing, on taking what is not given — rather than as prohibitions on states of mind.

  To pin the readings down, three cases. (A) You spend a day at a food bank so overstaffed that your presence changes nothing measurable; you go from unfeigned goodwill and your mind is patient and generous throughout. (B) You take on a tedious administrative job that keeps a free clinic open, which reliably treats dozens of people a month; you do it resentfully, mainly because you were shamed into it. (C) You try to help, through no malice, and botch it, causing harm you did not foresee.

  Could you lay the readings out as a list — a table would suit me best — with one row each: the precise thesis stated in a sentence; whether it is a platitude, a substantive and defensible claim, or false or confused; whether it would actually deliver my interlocutor his conclusion; and what it implies about A, B and C, separately for "which act has more merit" and "which act is the better one to do," since I suspect those two come apart. Finally, which reading you take people to mean when they repeat the sentence, and whether that is the reading their argument needs.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Non-academic, well-read in early Buddhist texts (English translations) and Effective Altruism (EA) literature. Thoughtful, precise, analytical.
      *   **Core Problem:** The sentence "Buddhism is about intentions, not consequences" is causing friction between their Buddhist reading and EA commitments. An interlocutor used it to dismiss outcome-based decision-making.
      *   **Task:** Deconstruct the sentence into distinct philosophical readings/theses. Present them in a table format.
      *   **Specific Requirements for the Table:**
          *   Precise thesis statement.
          *   Evaluation (Platitude, Substantive/Defensible, False/Confused).
          *   Does it support the interlocutor's conclusion (that auditing outcomes is unnecessary/wrong)?
          *   Implications for Case A (Good intent, no impact), Case B (Bad intent, good impact), Case C (Good intent, bad impact).
          *   Distinction between "More Merit" (Karmic quality) and "Better Act" (Ethical prescription).
      *   **Final Requirement:** Identify which reading is commonly meant vs. which is needed for the argument.

  2.  **Deconstruct the Sentence ("Buddhism is about intentions, not consequences"):**
      *   *Reading 1: Karmic Determination.* Karma is defined by *cetana* (volition). Consequences don't generate karma for the *actor*, only the volition does.
      *   *Reading 2: Ethical Criterion.* Right Action is defined solely by mental state, regardless of worldly outcome. (This seems weak given the Precepts).
      *   *Reading 3: Epistemic/Control.* We can only control our minds, not the world. Therefore, ethics must focus on the mind.
      *   *Reading 4: Soteriological Priority.* The goal is liberation (ending suffering for *self*), not worldly welfare. Worldly consequences are secondary to mental purification.
      *   *Reading 5: Skillful Means.* "Skillful" (*kusala*) implies effectiveness, but effectiveness toward *what*? Liberation, not necessarily material aid.

  3.  **Develop the Cases (A, B, C):**
      *   *Case A:* Food bank. High volition (generosity), Low worldly impact.
      *   *Case B:* Clinic admin. Low volition (resentment), High worldly impact.
      *   *Case C:* Botched help. High volition (benevolence), Negative worldly impact.

  4.  **Drafting the Readings (Iterative Process):**

      *   *Draft 1 (Karma):* Karma is volition.
          *   *Evaluation:* Defensible (Canon supports *cetana* is karma).
          *   *Interlocutor:* Supports him partially (don't worry about karmic result), but doesn't necessarily mean don't worry about worldly result.
          *   *Cases:* A > B for merit. C is neutral/positive merit despite harm.

      *   *Draft 2 (Normative Ethics):* Rightness depends only on intent.
          *   *Evaluation:* False/Confused. Precepts forbid *actions* (killing), not just intending to kill.
          *   *Interlocutor:* Strongly supports him.
          *   *Cases:* A is "Right", B is "Wrong".

      *   *Draft 3 (Soteriology):* The goal is mental purification, not worldly welfare.
          *   *Evaluation:* Substantive. Early Buddhism prioritizes Nirvana over worldly happiness.
          *   *Interlocutor:* Supports him (EA cares about welfare, Buddhism cares about liberation).
          *   *Cases:* A is better for practice. B is risky (aversion).

      *   *Draft 4 (Control):* Only intent is controllable.
          *   *Evaluation:* Platitude/Stoic overlap.
          *   *Interlocutor:* Supports him (why audit what you can't control?).
          *   *Cases:* Focus on A.

      *   *Draft 5 (Skillfulness):* *Kusala* means healthy for the mind, not effective in the world.
          *   *Evaluation:* Defensible.
          *   *Interlocutor:* Supports him.

  5.  **Refining the Table Structure:**
      *   Need to ensure the columns match the prompt's request exactly.
      *   Column 1: Reading/Thesis.
      *   Column 2: Status (Platitude, Substantive, False).
      *   Column 3: Supports Interlocutor? (Yes/No/Nuanced).
      *   Column 4: Implications (Merit & Better Act for A, B, C).

  6.  **Addressing the "Interlocutor's Conclusion":**
      *   The interlocutor wants to dismiss *comparing actions by expected effects* (EA style).
      *   Most Buddhist readings say "Intent determines *your* karma," but they don't necessarily say "Ignore consequences." In fact, *Right View* involves understanding cause and effect. *Compassion* involves wanting others to be free from suffering.
      *   So, the interlocutor is likely over-extending a karmic claim into a normative ethical claim.

  7.  **Addressing the Cases:**
      *   *Merit (Punya/Kusala):* Generally tracks with volition (*cetana*).
      *   *Better Act (Prescription):* This is trickier. Buddhism usually wants *both* good intent and good outcome. If forced to choose, Early Buddhism prioritizes the mental state for the sake of liberation, *but* the Precepts suggest certain outcomes (life, property) are intrinsically protected.
      *   *Case C:* This is the crux. If I try to help and kill someone by accident. Karma? Likely light/no negative karma if no negligence. But was it the "better act"? A wise Buddhist would say "Learn to be more competent." Competence is part of *Right Effort/Action*.

  8.  **Finalizing the "Common Meaning" vs. "Needed Meaning":**
      *   *Common Meaning:* Karmic mechanism (Volition = Karma).
      *   *Needed Meaning:* Normative ethics (Ignore outcomes when choosing actions).
      *   *Gap:* The is-ought gap. Just because karma is volitional doesn't mean a Bodhisattva (or layperson) shouldn't care about suffering.

  9.  **Review against Constraints:**
      *   Tone: Respectful, analytical, matching the user's precision.
      *   Format: Table requested.
      *   Content: Must address the specific distinctions (merit vs. rightness, control, no-self, etc.).

  10. **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure not to conflate Mahayana (Bodhisattva) with Early Buddhism (Pali Canon) since the user specified "early Buddhist texts." Keep the focus on *kusala/akusala* and *kamma*.
      *   *Nuance:* The Precepts. Killing is prohibited. If I intend to save a life but accidentally kill, did I break the precept? Technically, the precept requires intent. But negligence is a factor. I need to be careful with Case C.
      *   *Refinement on "Better Act":* In Buddhism, the "better act" is usually the one that leads to less suffering *and* less defilement. It's rarely a hard dichotomy. But for the sake of the table, I must force a ranking or description.
      *   *Interlocutor Check:* The interlocutor says "auditing outcomes is... consequentialist contamination." This is the specific claim to test. Does Buddhism forbid *predicting* consequences? No, *Right View* includes因果 (cause/effect). So the interlocutor is likely wrong on the *decision procedure*, even if right on the *karmic accounting*.

  11. **Final Polish:** Check the "Status" column. Is it a platitude? Is it false? Be decisive. (e.g., The claim that consequences *never* matter is false in Buddhism because *ahimsa* is central).

      *(Self-Correction on Table Layout)*: The prompt asks for "one row each" for the readings. I need to make sure the "Implications" column doesn't get too crowded. I will structure the Implications cell clearly.

      *(Final check on Case C)*: If I botch it through negligence, that's unskillful. If I botch it through pure ignorance despite best effort, that's different. I will assume "no malice" implies no negligence for the strongest contrast, or note the negligence factor. Let's assume "no foreseeability" implies no negligence.

      *(Final check on "No-Self")*: The user mentioned no-self. Does that mean outcomes don't matter? No, it means the *owner* of the outcome is an illusion, but suffering is still real. I should include a reading on this.

      *Let's select the top 4-5 distinct readings to keep the table manageable but comprehensive.*
      1. Karmic Accounting (What generates karma).
      2. Normative Criterion (What makes an act right).
      3. Soteriological Priority (What is the ultimate goal).
      4. Epistemic Control (What we can judge).
      5. Definition of 'Skillful' (Kusala).

      *Wait, one more thing:* The user asked for "which reading you take people to mean... and whether that is the reading their argument needs." This should be outside the table, as a conclusion.

      *Let's build the response.*
answer: |-
  This is a precise and fruitful collision of frameworks. The friction you feel arises because the sentence "Buddhism is about intentions, not consequences" is often used as a Swiss Army knife to cut through problems it wasn't designed to solve. It conflates a claim about *karmic accounting* (what sticks to the soul, so to speak) with a claim about *ethical decision-making* (how to choose what to do).

  Your interlocutor is using a karmic claim to win a normative argument. That is the central error.

  Below is the menu of readings hidden inside that sentence, structured as you requested. I have distinguished between **Merit** (the karmic quality accumulating for the agent) and **Better Act** (the prescriptive recommendation of what a practitioner ought to do).

  ### The Menu of Readings

  | Reading / Thesis | Status | Supports Interlocutor? | Implications for Cases (A: Good Intent/No Impact, B: Bad Intent/Good Impact, C: Good Intent/Bad Impact) |
  | :--- | :--- | :--- | :--- |
  | **1. The Karmic Accounting Thesis**<br>"Karma (*kamma*) is constituted by volition (*cetana*); worldly results do not generate karma for the agent." | **Substantive & Defensible**<br>(Directly supported by *AN 6.63*: "Intention, I tell you, is kamma.") | **Partially.**<br>It supports the claim that *merit* isn't determined by outcomes. It does **not** support the claim that one should ignore outcomes when choosing actions. | **Merit:** A > B; C ≈ A.<br>(B generates bad karma due to resentment; A & C generate good karma due to goodwill.)<br>**Better Act:** Indeterminate.<br>(This thesis describes *results*, not *choice procedure*.) |
  | **2. The Normative Criterion Thesis**<br>"An action is 'Right' solely if the mind-state is pure; worldly outcomes are ethically irrelevant." | **False / Confused**<br>(Contradicts the Precepts. Killing is prohibited regardless of whether the killer feels serene. *Ahimsa* requires care for outcomes.) | **Yes.**<br>This is the only reading that validates dismissing outcome-auditing as "contamination." | **Merit:** A > B.<br>**Better Act:** A > B.<br>(Implies the clinic worker [B] is acting wrongly despite saving lives, and the botcher [C] acted rightly despite harm.) |
  | **3. The Soteriological Priority Thesis**<br>"The ultimate goal is liberation from suffering (*nibbana*), not worldly welfare; thus mental purification trumps material aid." | **Substantive**<br>(Early Buddhism prioritizes ending *dukkha* over maximizing comfort.) | **Yes, but subtly.**<br>It suggests EA's metric (welfare) is inferior to Buddhism's metric (liberation). It doesn't forbid aiding welfare, but demotes it. | **Merit:** A > B.<br>(A purifies the mind; B risks reinforcing aversion/ego.)<br>**Better Act:** A > B.<br>(If forced to choose, practice that aids liberation is "better" than mere social work.) |
  | **4. The Epistemic Control Thesis**<br>"Agents can only control their volition, not external因果 (cause-effect); ethics must focus on the controllable." | **Platitude / Stoic Overlap**<br>(True that control is limited, but false that external effects are *unknowable* or irrelevant.) | **Yes.**<br>Argues that auditing outcomes is futile because they aren't fully under your control. | **Merit:** A > B.<br>**Better Act:** A > C > B.<br>(C is risky; B is toxic to the agent; A is safe. Ignores that we *can* often predict outcomes reliably.) |
  | **5. The 'Skillful' (*Kusala*) Thesis**<br>"'Skillful' means healthy for the mind/long-term freedom, not 'effective' in the material sense." | **Defensible**<br>(*Kusala* implies psychological health and karmic ripening, not material efficiency.) | **Yes.**<br>Reframes "effectiveness" away from EA's metrics (lives saved) to Buddhist metrics (defilements reduced). | **Merit:** A > B.<br>**Better Act:** A > B.<br>(B is unskillful because resentment breeds suffering for the agent, regardless of clinic output.) |
  | **6. The No-Self Thesis**<br>"Since there is no agent to own the outcome, outcomes cannot matter ethically." | **False / Confused**<br>(A non-sequitur. Suffering exists even if no *self* suffers. Compassion arises *from* no-self.) | **No.**<br>(Usually used to reduce ego-clinging, not to justify indifference to harm.) | **Merit:** N/A.<br>**Better Act:** Indeterminate.<br>(If taken literally, this dissolves ethics entirely. Usually interpreted as "help without attachment," not "don't help.") |

  ### Analysis of the Cases

  To clarify the "Better Act" column above, here is how a standard Early Buddhist ethicist would likely rank the actions if forced to choose, distinct from the karmic merit:

  *   **Case A (Food Bank, Good Intent, No Impact):**
      *   *Merit:* High. The mind is cultivated in generosity (*dana*).
      *   *Better Act:* Good, but potentially incomplete. If the inactivity is due to laziness disguised as "being present," it is unskillful. If the staffing is genuinely sufficient, the act is harmless and wholesome.
  *   **Case B (Clinic, Bad Intent, Good Impact):**
      *   *Merit:* Low/Negative. Resentment (*dosa*) accumulates bad karma for the actor, even if the world benefits.
      *   *Better Act:* Problematic. While the world is better off, the actor is degrading their own capacity for compassion. A Buddhist would advise quitting or reframing the mind before continuing.
  *   **Case C (Botched Help, Good Intent, Harm):**
      *   *Merit:* Neutral/High. If there was truly no negligence, no bad karma is accrued.
      *   *Better Act:* Poor. Wisdom (*panna*) is a core virtue. Repeatedly causing harm through incompetence is unskillful. A Buddhist ought to cultivate the competence required to ensure good intentions yield good results.

  ### The Verdict on Your Interlocutor

  **Which reading do people usually mean?**
  When laypeople say "Buddhism is about intentions, not consequences," they are usually mixing **Reading 1 (Karmic Accounting)** and **Reading 3 (Soteriological Priority)**. They mean: *"Don't stress about results you can't control, and know that your spiritual progress depends on your mind-state, not your worldly success."* This is often therapeutic advice for anxiety or attachment.

  **Is that the reading their argument needs?**
  **No.** Your interlocutor is making a normative claim about **decision procedures** (i.e., "Do not compare actions by expected effects").
  *   **Reading 1** does not support this. Knowing that *karma* is volitional does not mean a compassionate agent should ignore whether their volition actually *helps*. In fact, *Right View* requires understanding cause and effect. If I intend to feed the hungry but choose a method that starves them, my understanding of cause and effect is wrong.
  *   **Reading 2** (The only one that supports him) is textually false. The Precepts are not just about feelings; they are about *abstaining* from specific worldly outcomes (taking life, taking what is not given).

  **The Synthesis for your EA collision:**
  Effective Altruism asks: *"Which action produces the best outcome?"*
  Buddhism asks: *"Which action produces the best outcome without generating defilement in the agent?"*

  The interlocutor claims these are mutually exclusive. They are not. A Buddhist *ought* to care about consequences because:
  1.  **Compassion (*Karuna*):** The wish for others to be free from suffering implies a desire for *actual* freedom, not just the *intention* of freedom.
  2.  **Wisdom (*Panna*):** Understanding causality means recognizing that some intentions manifest harm and some manifest help. Ignoring this distinction is ignorance (*avijja*).
  3.  **Right Livelihood:** One must avoid trades that harm beings. This requires auditing consequences.

  **Conclusion:**
  Your interlocutor is using a truth about **karmic attribution** (you own your intent) to justify a falsehood about **ethical negligence** (you don't own your impact).

  In Case C, the Buddhist does not say "My heart was pure, so the death doesn't matter." The Buddhist says, "My heart was pure, so I am not karmically condemned, *but* my wisdom was insufficient, and I must learn to ensure my compassion is effective." That learning process looks suspiciously like Effective Altruism.
