  2.3 **Residual Specification.** The value must not be identified with whatever the economists' model leaves unexplained. This residual is hereby designated the Structural Error Term (SET).¹ Proposals treating culture as a placeholder for omitted variable bias are ineligible. The value must have positive degrees of freedom.

  2.4 **Institutional Endogeneity.** The value must survive the fact that values are transmitted by institutions that the outcome itself shapes. Applicants must demonstrate that the value is not merely an adaptation to the macroeconomic outcome it purportedly causes. Instrumental variables must be exogenous to the institutional environment. Recursive causality is prohibited. Values embedded in legal codes established post-outcome are ineligible.

