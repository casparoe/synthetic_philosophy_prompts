answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Coffee cups sit on the table between Dr. Elena Vasquez and Dr. Marcus Chen. They have just finished leading a seminar session on the 1948 Convention.*

  **Marcus Chen:** You pushed back hard on my suggestion during the seminar that the "Aethelgard" scenario fits the spirit of the Convention, even if it misses the letter. I want to make sure I understand your hesitation. Is it strictly about the evidentiary burden of proving intent, or is it about the definition of destruction itself?

  **Elena Vasquez:** It's both, Marcus, but primarily the latter. In your Aethelgard hypothetical, we have a state systematically dismantling an ethnolinguistic group over forty years. They ban the language in economic transactions, redistribute land through zoning loopholes, and place children in state boarding schools to be raised in the dominant culture. There is documented intent to make the group cease to exist *as a distinct entity*. But there is minimal direct killing. No mass graves. No sterilization programs. Under the Convention, genocide requires an intent to destroy the group in whole or in part, but the mechanisms listed are physical or biological. Killing, causing serious bodily harm, imposing conditions of life calculated to bring about physical destruction. Aethelgard is cultural dissolution. If we stretch the legal definition to cover this, I fear we lose the tool's sharpness.

  **Marcus:** But that's exactly where the "nominative shadow" falls. By saying "this is not genocide because they weren't killed, they were just assimilated," the law validates the perpetrator's logic. The state's goal in Aethelgard was erasure. They achieved erasure. But because they used bureaucrats and schoolteachers instead of soldiers and gas, we reclassify it as Crimes Against Humanity or domestic rights violations. That reclassification isn't neutral. It changes the archival priority. It changes the reparations fund. It changes whether the survivors are seen as victims of an existential threat or just victims of severe discrimination. The harm isn't just that we can't prosecute; it's that we misname the reality.

  **Elena:** I agree the misnaming is regrettable. I don't deny the suffering in Aethelgard is catastrophic. But consider the prosecutorial feasibility. The Convention was designed to be a conviction machine for the worst of the worst. To secure a conviction, you need a tight chain of causality between specific intent and specific physical acts. In Aethelgard, the intent is dispersed. It's not one order from a dictator; it's a thousand administrative decisions across the Ministries of Education, Land, and Interior over three decades. If we expand the legal core to include non-lethal mechanisms, how do we distinguish genocide from aggressive assimilation policies that many states have historically practiced? We risk semantic inflation. If everything that threatens group identity is genocide, then nothing is.

  **Marcus:** I think that's a false dichotomy. We aren't talking about aggressive assimilation; we are talking about *destructive* assimilation. The intent in Aethelgard is documented: the internal memos speak of "dissolving the problem." The distinction you're drawing relies on the *method* of destruction rather than the *outcome* for the group. From the perspective of the Aethelgard minority, their group is dead. Their language is spoken only by the elderly; their land tenure is broken; their lineage is interrupted. Why should the legal category privilege the biological survival of individuals over the sociological survival of the group? When we force this into Crimes Against Humanity, we are saying the harm is against individual humans, not against the collective existence. That's an ontological error.

  **Elena:** It's not an ontological error; it's a jurisdictional necessity. International criminal law punishes individuals, not groups or abstract concepts. To convict a Minister of Education in the Aethelgard case, you must prove they intended to physically destroy the group, not just change its culture. If we lower the threshold to include cultural destruction, we open the door to politicized trials where every instance of cultural suppression becomes an international crime. The "shadow" you describe—the downgrading to Crimes Against Humanity—is the price we pay for maintaining a bright line that ensures the genocide label retains its unique moral gravity. If we dilute it, we risk a backlash where states refuse to cooperate on the clear-cut physical cases because they fear the slippery slope.

  **Marcus:** But who pays that price, Elena? The legal system pays the price of complexity, but the victims pay the price of invisibility. You mention moral gravity. I argue that the gravity is located in the *name*. "Genocide" triggers a specific duty to prevent and a specific mode of remembrance. "Crimes Against Humanity" is a catch-all. It lacks the specific commemorative weight. In the Aethelgard case, if we classify it as CAH, the narrative becomes about individual suffering—abuse in schools, unfair land seizures. If we classify it as genocide, the narrative becomes about the attempted erasure of a people. That shifts the reparations from individual compensation to collective restoration. Without legal expansion, or at least a formally recognized parallel status with equivalent weight, the politics of naming will continue to undermine the framework's purpose. We are creating a hierarchy of victimhood where the bureaucratically erased are second-class victims.

  **Elena:** I hear you on the hierarchy of victimhood. I do. But I worry about your solution: a "parallel status with equivalent weight." How do you institutionalize that without creating legal confusion? If you create a category that acts like genocide, carries the stigma of genocide, and demands the reparations of genocide, but isn't *legally* genocide, you create a paradox. Courts will treat them differently regardless of what you call it. My position is that we should keep the legal definition narrow to ensure it works, but we must build robust *moral* and *political* categories outside the court to recognize the Aethelgard scenarios. We can call it "societal destruction" or "cultural erasure" in our histories and truth commissions. We don't need to break the legal hammer to fix the historical record.

  **Marcus:** That's the crux of it, isn't it? You see the law as a hammer—a tool for specific tasks that must remain sharp. I see the law as a mirror—a reflection of moral truth that must be accurate to be legitimate. If the law says Aethelgard isn't genocide, but history says it was the end of a people, the law loses legitimacy. You suggest moral categories can carry the burden. But in the international arena, moral recognition without legal backing is toothless. It doesn't trigger the same obligations. It doesn't secure the same funding. The "shadow" isn't just epistemic; it's distributive. Resources flow to legal categories. By keeping Aethelgard out of the core, we are actively distributing less justice to them.

  **Elena:** But if we bring Aethelgard into the core, do we risk losing the ability to prosecute the cases that *do* fit the physical template? Imagine a future tribunal. If the definition of genocide includes bureaucratic assimilation, defense attorneys will argue that every harsh policy is genocide. The signal-to-noise ratio drops. The unique horror of mass slaughter gets normalized alongside administrative restructuring. I'd rather have a narrow category that convicts reliably for physical destruction, and a broad moral consensus that condemns cultural destruction, than a broad legal category that convicts no one because the standards are too contested.

  **Marcus:** I think we're circling the same point but viewing the risk differently. You fear the dilution of the concept; I fear the erasure of the victim. In Aethelgard, the mechanism was chosen *because* it fell into the shadow. The perpetrators knew that child removal and land zoning wouldn't trigger the genocide convention, but would achieve the same result. By refusing to adapt the category, we are essentially rewarding that strategic evasion. You say we can use moral categories. But the perpetrators operate in the legal realm. They rely on the gap between the moral horror and the legal definition. If we don't close that gap—either by expansion or by a parallel legal status—we are leaving a loophole large enough to drive a nation-killing campaign through.

  **Elena:** So you view the narrowness as a loophole. I view it as a boundary. And I think this is where we might actually identify our disagreement. It's not about the facts of Aethelgard. We agree the intent was destruction. We agree the mechanisms were bureaucratic. We agree the outcome was the end of the group. Our disagreement is about the primary function of the genocide label. For you, the label's primary function is *truth-telling*—accurately describing the harm done to the group. For me, the label's primary function is *intervention and punishment*—creating a legal standard so clear that it mobilizes action and secures convictions.

  **Marcus:** That's a fair assessment. If the function is truth-telling, the current definition fails the Aethelgard test. It tells a lie by omission. But if the function is intervention, does your narrow definition succeed? Does the "bright line" actually mobilize action? Or does it allow states to say, "Well, it's not genocide, so we have no duty to intervene"? The shadow effect protects the bystanders as much as it protects the legal standard.

  **Elena:** Perhaps. But if we broaden the definition to capture Aethelgard, and then fail to prosecute because the evidence of dispersed intent is too messy, we haven't achieved intervention either. We've just created a broader category of impunity. I would argue that for Aethelgard, a specialized truth commission with the power to label the events "genocidal in effect" but prosecute them as "systematic erasure" might be more effective than forcing a square peg into a round legal hole.

  **Marcus:** But without the *legal* equivalence, the "genocidal in effect" label becomes a consolation prize. It acknowledges the pain but denies the crime. My concern is that the "shadow" isn't just a side effect; it's a structural feature that privileges physical violence over structural violence. It assumes that a dead body is a greater harm than a dead culture. In Aethelgard, the culture *is* the life. By separating them, the law reproduces the very erasure it claims to prevent.

  **Elena:** And I worry that by conflating them, we lose the ability to distinguish between a policy that is cruel and a policy that is exterminatory. I want to condemn Aethelgard in the strongest possible terms. I just don't believe the legal instrument of the 1948 Convention is the right vehicle, because stretching it might break the chassis.

  **Marcus:** Then we are left with the question of whether we repair the chassis or build a new vehicle. Because right now, the Aethelgard survivors are walking alongside the road, watching the convoy pass them by.

  **Elena:** Then perhaps our job isn't to decide which vehicle is right, but to ensure that whichever one they take, it actually gets them to justice. But I still maintain that if we call every form of group destruction "genocide," we risk arriving nowhere at all.

  **Marcus:** And I maintain that if we leave the worst forms of group destruction outside the definition, we've already arrived at the wrong destination.

  *They sit in silence for a moment, the tension of the unresolved problem hanging between them, not as a conflict to be won, but as a structural dilemma of the field they both inhabit.*
