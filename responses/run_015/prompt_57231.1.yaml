      *   **Constraint 1:** No philosophical jargon in the tests (no "temporal parts," "worldlines," "endurantism," "perdurantism"). Plain language only.
      *   **Constraint 2:** The procedure must be a decision tool for ~100 scenes, answerable in 5 minutes with the manuscript open.
      *   **Constraint 3:** Focus on responsibility, ownership, debt, apology, and credit (not pronoun aesthetics).
      *   **Constraint 4:** Must run the procedure on three specific scenes (Proud, Ashamed, Credit-taking).
