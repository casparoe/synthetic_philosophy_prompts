answer: |-
  ### The Liability Audit: A Decision Procedure

  This is not about pronouns. It is about debt. Metaphysics, in a novel, is simply the rulebook for who pays the bills. If your narrator claims the assets of the past (the glory, the survival, the love), she must inherit the liabilities (the guilt, the trauma, the debt). You cannot cherry-pick temporal parts without breaking the reader's trust in the "I."

  Run these three questions on every memory scene. Keep a tally sheet. If the answers contradict your tally from previous scenes, the metaphysics is forcing your hand.

  **The Three Questions**

  1.  **The Debt Test:** If the nineteen-year-old left a bill unpaid (money, emotional damage, a promise), does the seventy-one-year-old feel morally obligated to pay it *now*?
      *   *Yes:* The "I" is continuous. The woman *is* the girl.
      *   *No:* The "I" is sequential. The woman *contains* the girl, like a box contains a stone.

  2.  **The Apology Test:** If the nineteen-year-old hurt someone, and the seventy-one-year-old says "I'm sorry," is she apologizing for her own action, or delivering a message on behalf of a stranger?
      *   *Own Action:* Continuous.
      *   *Message for Stranger:* Sequential.

  3.  **The Asset Test:** If the nineteen-year-old won something (a prize, a survival, a lover), does the seventy-one-year-old claim the credit as her own achievement, or as something that happened *to* her?
      *   *Own Achievement:* Continuous.
      *   *Happened To Her:* Sequential.

  **The Verdict Rule**
  *   **If you answer "Continuous" to two questions:** You are bound to answer "Continuous" to the third. You cannot claim the asset while disowning the debt.
  *   **If you answer "Sequential" to two questions:** You are bound to answer "Sequential" to the third. You cannot accept the apology while refusing the credit.
  *   **Where the Metaphysics Forces Your Hand:** When the Verdict Rule contradicts your desired emotional outcome for the scene.
  *   **Where You Are Free:** When the Verdict Rule aligns with your desire, or when you are establishing the book's baseline in the first ten scenes. Once the baseline is set (e.g., 80% Continuous), deviations require narrative justification (e.g., dissociation, memory loss).

  ***

  ### Running the Audit on Three Scenes

  Here is the audit applied to your specific scenarios. I have listed your **Desired Outcome** (what you want as a writer) and the **Procedure's Verdict** (what the logic demands).

  #### Scene 1: The Pride (The Stand)
  *   **Context:** At nineteen, she stood up to a corrupt boss and got fired, launching her independent life.
  *   **Your Desire:** You want the 71-year-old to glow with this memory. You want her to claim that courage as the foundation of her character.
  *   **The Audit:**
      1.  *Debt:* Did the firing cause hardship she still bears? She says, "It was worth it." (Leans Continuous).
      2.  *Apology:* N/A.
      3.  *Asset:* Does she claim the courage? "I did that." (Continuous).
  *   **Verdict:** **Continuous.**
  *   **Result:** **PASS.** The metaphysics aligns with your desire. You are free to write this with full ownership. The "I" is solid here.

  #### Scene 2: The Shame (The Theft)
  *   **Context:** At nineteen, she stole money from a friend to pay rent, then lied about it. The friend found out years later.
  *   **Your Desire:** You want the 71-year-old to express regret but ultimately distance herself. You want the reader to think, *"That was a desperate kid, not the woman I know now."* You want to disown the moral weight.
  *   **The Audit:**
      1.  *Debt:* Does she feel she owes the friend restitution now? If you said "Yes" in Scene 1 (claiming the career built on that independence), you must say "Yes" here.
      2.  *Apology:* Is she saying sorry? If she says "I'm sorry," but claims she isn't the thief, the apology is hollow.
      3.  *Asset:* Did she keep the rent money? Yes. She kept the benefit of the crime.
  *   **Verdict:** **Continuous.** (Because she kept the Asset, she owns the Debt).
  *   **Result:** **FAIL.** The procedure says **No**. You cannot claim the independence gained in Scene 1 (Asset) while disowning the cost of that independence in Scene 2 (Debt). If the "I" was strong enough to build the life, it is strong enough to own the sin.
      *   *The Metaphysical Force:* You must either have her fully own the shame (making her more complex but less likable) or you must undermine the Pride in Scene 1 (making her success seem like luck). You cannot have the glory without the guilt.

  #### Scene 3: The Credit (The Reckless Drive)
  *   **Context:** At nineteen, she drove drunk down a mountain road, skidded off the edge, and hung there for hours before climbing out. She is alive because of it.
  *   **Your Desire:** You want her to claim the survival ("I am a survivor") but disown the recklessness ("I was stupid then").
  *   **The Audit:**
      1.  *Debt:* Does she owe a debt to the luck/gravity that let her live?
      2.  *Apology:* To whom? To the car? To the universe?
      3.  *Asset:* She claims the status of "Survivor."
  *   **Verdict:** **Mixed / Nuanced.**
  *   **Result:** **CONDITIONAL PASS.** This is where voice takes over. You can claim the *outcome* (life) while condemning the *method* (drunk driving) only if you frame the "I" as someone who has *learned*, not someone who has *changed into a different person*.
      *   *The Metaphysical Force:* You cannot say "I would never do that now" if you mean "I am not the person who did that." You must mean "I am the same person, but I am wiser." If you imply you are a different person, you lose the right to claim the survival as *your* victory. It becomes a victory of the girl's, and the woman is just the beneficiary.

  ***

  ### What This Procedure Cannot Settle

  The Liability Audit settles the *contract* between the narrator and her past, but it cannot settle the *texture* of the memory. It tells you who owns the sin, but not how much it hurts.

  1.  **The Quality of Regret:** The audit forces her to own the theft in Scene 2. It does not tell you if she cries about it, laughs about it, or stares at the wall. That is craft, not metaphysics.
  2.  **Memory Reliability:** The audit assumes the events happened. It cannot tell you if the 71-year-old is misremembering the 19-year-old. You can have a Continuous "I" based on a False Memory. The metaphysics holds (she believes she did it), even if the history is wrong.
  3.  **The Pronoun:** This is the most important limitation. The audit might tell you she *owns* the action. It does not dictate whether she writes: *"I stole the money"* or *"That girl stole the money."* Both can signal ownership depending on the surrounding syntax.
      *   *Example:* "I stole the money" is direct ownership.
      *   *Example:* "That girl stole the money, and I have to live with her choice" is *also* ownership, just framed as internal division.
      *   The audit forces the *responsibility*, not the *grammar*. If you try to use the grammar to escape the responsibility, the reader will feel the lie.

  **Final Note:** In Scene 2, where the procedure told you "No," do not fight it. That friction is where the novel lives. The tension between the woman who wants to be good and the girl who was bad is the story. If you let her disown the girl, you lose the conflict. Let the metaphysics hurt her. It will make her real.
