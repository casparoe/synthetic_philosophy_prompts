      *   **Constraint 6:** Finish with what the procedure *cannot* settle.
      *   **Guard Rule:** Do not collapse the answer into "perdurantists write she, endurantists write I." If that's the only difference, admit it, but the tests must focus on responsibility/ownership.

  2.  **Deconstruct the Metaphysics (for internal understanding):**
      *   *Endurantism (3Dism):* The person is wholly present at every moment. The 71-year-old *is* the 19-year-old. Identity is strict. Responsibility carries fully.
      *   *Perdurantism (4Dism):* The person is a "worm" extending through time. The 71-year-old and 19-year-old are different temporal parts of the same aggregate. Responsibility is attenuated or shared.
      *   *The User's Dilemma:* They feel this deeply but know they can't lecture the reader. They need a practical heuristic that respects the metaphysical weight without naming it.

  3.  **Drafting the Decision Procedure (The "Identity Audit"):**
      *   *Goal:* Create 3-4 questions that force a choice between "I did this" (Continuity) and "That happened to me/by me" (Discontinuity).
      *   *Focus:* Debt, Apology, Credit, Name.
      *   *Language:* Simple, concrete, manuscript-focused.
      *   *Drafting Questions:*
          1.  *The Debt Test:* If the 19-year-old borrowed money and never paid it back, does the 71-year-old owe it *morally*? (Yes = Continuous, No = Discontinuous).
          2.  *The Apology Test:* If she apologizes now, is it *her* apology or a message from a stranger?
          3.  *The Credit Test:* If the 19-year-old won a prize, does the 71-year-old deserve the glory?
          4.  *The Name Test:* Whose name is on the deed/memory?
      *   *Refining for the "Guard Rule":* Avoid pronoun policing. Focus on the *weight* of the connection.
      *   *Structure:* A flowchart or checklist style. Let's make it a "Three-Question Audit."

  4.  **Developing the Three Test Scenes:**
      *   *Scene 1: Pride.* (e.g., She stood up to authority). User likely wants to claim this.
      *   *Scene 2: Shame.* (e.g., She hurt someone badly). User likely wants to distance.
      *   *Scene 3: Credit for Danger/Recklessness.* (e.g., She survived something reckless). User wants to claim survival but disown the recklessness.
      *   *Constraint Check:* One result must contradict the user's desire.
          *   *Strategy:* Usually, writers want to claim the good (Pride) and disown the bad (Shame). The metaphysics often forces consistency. If you claim the good, you own the bad. If you disown the bad, you lose the good.
          *   *Selection:* Let's make the "Credit" scene the one that flips. If she takes credit for the *survival* (good), she must own the *recklessness* (bad). If the procedure says "You can't split them," that might contradict a desire to have it both ways.
          *   *Better Strategy for "No":* Let's set the user's desire as "I want to treat the 19-year-old as a separate character in the Shame scene." The procedure might force her to own it if she owns the Pride scene. Consistency is key.
          *   *Decision:* I will define the "User's Desire" for each scene beforehand to ensure one fails.
              *   Scene 1 (Pride): Desire = Claim it. (Procedure should say Yes).
              *   Scene 2 (Shame): Desire = Disown it. (Procedure should say No/Own it). -> *This is the contradiction.*
              *   Scene 3 (Credit): Desire = Claim the outcome, disown the method. (Procedure should say Mixed/Clarify).

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make sure it sounds like a writer's tool, not a philosophy exam.
      *   Ensure the "Where the metaphysics forces your hand" vs. "Where it's voice" distinction is clear.
      *   *Self-Correction on Guard Rule:* The prompt explicitly says "don't let the answer collapse into 'perdurantists write she, endurantists write I'." I need to ensure the tests are about *consequences*, not grammar. The output of the test isn't "use I" or "use she," it's "accept responsibility" or "observe as witness."

