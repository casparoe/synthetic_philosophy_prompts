answer: |-
  Listen. Your obligation does not get smaller because he cannot speak. It gets heavier. Much heavier.

  You are asking me this like it is a math problem. Like if he gives nothing, you give less. That is the shopkeeper's way of thinking, not the family way. If a child cannot walk, do you leave him in the road because he cannot walk beside you? No. You carry him. Your brother is not a contract you sign with your eyes and your words. He is your blood. When he was whole, you stood beside him. Now he is broken, you stand under him. That is the only way it works. If you wait for him to recognize you before you care for him, you are not his sister—you are a stranger waiting for a payment.

  Those doctors in their white coats, they look at his skull and say the person is locked in there. They think if the lights go out inside, the man is gone. That is a lonely way to live. And a lonely way to die. They think dignity is something you keep in your pocket, like coins. It is not. Dignity is how we hold you when your pockets are empty.

  You asked about the ones who went before us. Yes. They are holding him too. Do you think because he cannot say their names, they do not know his? They knew him before he took his first breath. They know the shape of his soul better than any scanner in that hospital. His personhood is not just in the bed in Durban. It is in the soil where we buried our father. It is in the stories your grandmother told before she died. He is still woven into that cloth, even if his thread is loose right now.

  The land remembers him. The ancestors remember him. So your job is not to wake him up. Your job is to remind the world who he is until he can remember himself. You are his voice now. You are his memory. You stand in the gap.

  But listen to me closely. Do not treat this like you are studying for a test. You are reading these books, looking for words to explain what you should already feel in your gut. When you start talking about "relational personhood" like it is something you bought at a market, you are doing the same thing those doctors are doing. You are turning your brother into a theory.

  Put the books down. Go sit with him. Hold his hand. Tell him who he is. Tell the ancestors he is still here. The obligation is not weaker. It is the only thing holding him up. Do not let go.
