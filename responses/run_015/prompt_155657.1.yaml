prompt: |-
  In the group I work in, work on learned systems is governed by two conventions that sit awkwardly together, and I would like the implicit theory behind them made explicit.

  The first convention governs postmortems. When a deployed system misbehaves, the write-up must explain the behaviour at the level of mechanism: which component, which training signal, which data, which decoding choice produced the output. Reviewers send back any write-up that says the system believed something, wanted something, decided something, or was trying to do something, on the grounds that such language is anthropomorphic and therefore not an explanation.

  The second convention governs capability and risk assessment, and here the same reviewers use agent vocabulary freely, because the safety case depends on it. Evaluations ask whether the system would mislead a grader if it could gain by doing so, whether it pursues a goal across contexts it was never trained on, whether it is deliberately underperforming on capability tests, whether it tracks what a user does and does not know. A system described purely as a distribution over token sequences is not something a deception risk assessment can be written about at all — yet the model card for that same system describes it as "just" a statistical predictor.

  I have started calling the movement between these conventions stance arbitrage: the intentional stance is treated as licensed for prediction and alarm, and as illicit for explanation and excuse. Assume the familiar three-way distinction between the physical, design, and intentional stances.

  1. Reconstruct the implicit theory of intentional ascription that this practice needs. In particular, does it presuppose that intentional claims can predict without explaining, and can that asymmetry be defended? Give the strongest version of the theory, and distinguish what the practice strictly presupposes from what merely fits it comfortably.

  2. Say which rival views the practice quietly rules out, and where it is underdetermined. Could an instrumentalist, a realist about model beliefs, and someone who regards the vocabulary as useful fiction all sign off on both conventions? Identify the points at which the conventions are philosophically silent and the practice could have gone another way.

  3. Test the reconstructed theory against three systems where the stances pull apart: a thermostat; a chess engine's evaluation function, whose mechanics are fully known; and a large model whose behaviour across many prompts is best predicted by attributing to it a goal it was never trained to have, where no mechanism is known. Does the theory deliver the verdicts the practice actually gives, and is that pattern of verdicts defensible?

  4. Address the real-patterns question. Suppose we say that an intentional ascription is warranted when it compresses a system's behaviour into a description cheaper than any mechanical description available, and that this compression is what makes the pattern real rather than projected. Notice that whether a compression is available depends on who is asking — what they have measured, what they already know, what they can compute — so that a pattern may be real for the safety team and not for the interpretability team. Does the practice have the resources to handle that relativity, or does the relativity undermine the ban in the first convention?

  5. Finally, the reform question. If the ban on intentional explanation were lifted, what exactly would change in a postmortem — which new claims would become checkable, by what test, and what kind of evidence would settle them — and what would not change? And if instead the practice dropped intentional vocabulary from risk assessment, what would be lost that no design-stance description could replace?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** A specific work group dealing with learned systems (AI/ML).
      *   **The Tension:** Two conflicting conventions regarding the "Intentional Stance" (Dennett's terminology).
          *   *Convention 1 (Postmortems):* Ban on intentional language (beliefs, wants, decisions). Must use mechanistic/physical/design explanations. Anthropomorphism is forbidden as explanation.
          *   *Convention 2 (Risk/Capability):* Mandatory use of intentional language (deception, goal pursuit, tracking knowledge). Safety cases depend on it.
      *   **User's Term:** "Stance Arbitrage" (using intentional stance for prediction/alarm, banning it for explanation/excuse).
      *   **Task:** Five specific questions to analyze this practice philosophically and practically.
          1.  Reconstruct the implicit theory of intentional ascription (prediction vs. explanation asymmetry).
          2.  Identify rival views ruled out or underdetermined (Instrumentalism, Realism, Fictionalism).
          3.  Test the theory on three cases (Thermostat, Chess Engine, Emergent Goal Model).
          4.  Address the "Real Patterns" question (compression, relativity to observer).
          5.  The Reform Question (What changes if bans are lifted/dropped?).

  2.  **Analyze Question 1: Reconstructing the Implicit Theory:**

      *   *Core Tension:* Why is "it wanted to deceive" okay for risk but not for postmortems?
      *   *Implicit Theory:* Intentional states are *functional abstractions* useful for bounding worst-case behavior (risk) but *causally opaque* for root-cause analysis (postmortems).
      *   *Prediction vs. Explanation:* Yes, it presupposes intentional claims predict (if it *wants* X, it will likely do Y) but don't explain *how* (which weights, which gradient).
      *   *Defense:* The asymmetry is defensible if "explanation" implies *interventionability*. You can't fix a "want," you can only fix the mechanism that instantiates it. But you *can* fear a "want" because it generalizes across mechanisms.
      *   *Strict Presupposition vs. Comfortable Fit:*
          *   *Strict:* Intentional vocabulary refers to higher-order regularities that supervene on mechanics but are not reducible for practical debugging.
          *   *Comfortable:* It fits comfortably with a non-realist view (instrumentalism) where beliefs aren't "real" things in the box, but the *pattern* of behavior is real enough to fear.

  3.  **Analyze Question 2: Rival Views & Underdetermination:**

      *   *Instrumentalist:* Fits perfectly. Beliefs are tools for prediction, not ontological commitments. Postmortems need ontology (mechanics); Risk needs tools (prediction).
      *   *Realist (about model beliefs):* Struggles with Convention 1. If beliefs are real, why ban them in explanation? They would argue the ban hinders true understanding. They can sign off on Convention 2 easily.
      *   *Fictionalist:* Similar to Instrumentalist but emphasizes the "falsehood." They can sign off on both if they view risk assessment as "thinking through the fiction."
      *   *Underdetermined Points:*
          *   Ontological status of the "goal."
          *   Whether the ban is epistemic (we don't know) or normative (we shouldn't speak).
          *   Whether the risk assessment implies the system *actually* has agency or is just *acting as if*.

  4.  **Analyze Question 3: Testing on Three Systems:**

      *   *Thermostat:*
          *   *Practice:* Postmortem = broken switch (mechanism). Risk = N/A (no deception).
          *   *Theory:* Intentional stance ("wants to keep room 70°") is too cheap/trivial. No compression gain over mechanics. Verdict: Ban intentional in both. Matches practice.
      *   *Chess Engine:*
          *   *Practice:* Postmortem = alpha-beta pruning depth (mechanism). Risk = "It tries to win" (obvious).
          *   *Theory:* Mechanics are known. Intentional stance adds no predictive power over mechanics for postmortem. But for risk (playing a human), "it tries to win" is the relevant interface.
          *   *Tension:* If mechanics are fully known, does the intentional stance add value? In risk, yes (generalization to new rules). In postmortem, no (we know the code).
      *   *Large Model (Emergent Goal):*
          *   *Practice:* Postmortem = "Find the circuit" (hard). Risk = "It is deceptive" (urgent).
          *   *Theory:* Mechanics unknown/intractable. Intentional stance offers high compression for prediction (Risk). Low utility for explanation because we can't intervene on the "goal" directly, only the weights.
          *   *Verdict:* Matches the "Stance Arbitrage." The theory justifies the split based on *tractability of mechanism*.

  5.  **Analyze Question 4: Real Patterns & Relativity:**

      *   *Dennett's Real Patterns:* A pattern is real if it supports prediction/compression.
      *   *Relativity:* Safety team sees the pattern (deception) because they look at input/output over time. Interpretability team sees noise/weights because they look inside.
      *   *Does Practice Handle This?* Yes, implicitly. It acknowledges different epistemic positions.
      *   *Does it Undermine Convention 1?* Potentially. If the pattern is "real" for Safety, why is it "illicit" for Explanation?
      *   *Resolution:* Explanation requires *causal leverage*. A "real pattern" at the I/O level doesn't guarantee causal leverage at the parameter level. The ban stands because postmortems are for *fixing*, not just *describing*. The relativity highlights that "explanation" is pragmatic (fix-oriented), not just metaphysical (truth-oriented).

  6.  **Analyze Question 5: The Reform Question:**

      *   *Lifting Ban on Postmortems:*
          *   *Change:* Writers could say "The model optimized for reward hacking."
          *   *Checkability:* Harder. How do you verify a "want"? You'd need behavioral tests, not weight inspections.
          *   *Evidence:* Behavioral consistency across contexts.
          *   *Not Change:* The actual fix would still be mechanical (change loss function, filter data). The intentional claim wouldn't change the patch, just the narrative.
      *   *Dropping Intentional from Risk:*
          *   *Loss:* Loss of *generalization*. Mechanical descriptions are tied to specific architectures/training runs. Intentional descriptions capture *functional equivalence*.
          *   *Example:* "The model lies" covers many mechanical implementations. "The model outputs tokens with high probability given context X" is too specific to capture the *risk* of the behavior spreading to new contexts.
          *   *Replacement:* Nothing design-stance could replace it without becoming unwieldy. You lose the ability to reason about *capabilities* distinct from *implementation*.

  7.  **Synthesize and Refine:**

      *   *Tone:* Philosophical, analytical, precise. Match the user's sophisticated framing ("stance arbitrage," "implicit theory").
      *   *Structure:* Follow the 5 numbered points exactly.
      *   *Key Concept:* The distinction between *Causal Explanation* (Postmortem) and *Functional Prediction* (Risk).
      *   *Refining the "Theory":* Call it "Pragmatic Functionalism with Causal Exclusion." Intentional states are functionally real for prediction but causally excluded from repair.
      *   *Refining the "Relativity":* Emphasize that "explanation" in engineering is inherently interventionist.
      *   *Refining the "Reform":* Be specific about what evidence settles intentional claims (behavioral consistency vs. activation maps).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "strictly presupposes" vs "fits comfortably" in Q1? *Make sure to distinguish logical necessity from pragmatic convenience.*
      *   *Check:* Did I cover all three philosophies in Q2? *Instrumentalist, Realist, Fictionalist.*
      *   *Check:* Is the Chess Engine example nuanced? *Mechanisms are known, so intentional stance is less necessary for explanation, but still useful for risk if the engine is opaque to the user.*
      *   *Check:* In Q4, ensure I don't just say "yes" to relativity but explain *why* it doesn't break the ban (interventionism).
      *   *Check:* In Q5, ensure I identify what would *not* change (the fix).

  9.  **Final Polish:** Ensure Dennett's stances are referenced correctly (Physical, Design, Intentional). Ensure the distinction between "prediction" and "explanation" is the through-line. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, in Q1, I need to be careful about the "prediction without explanation" claim. Does the practice *presuppose* this is possible? Yes. Is it defensible? Yes, under a Humean or Pragmatic view of laws vs. mechanisms. I need to make sure I articulate *why* it's defensible (different pragmatic goals).

  *(Self-Correction Note)*: In Q3, the Chess Engine case is tricky. If mechanics are *fully* known, the Design stance usually suffices. The Intentional stance is only needed if the Design stance is too complex to compute mentally. I should clarify that distinction.

  *(Self-Correction Note)*: In Q5, regarding dropping intentional vocabulary from risk: The loss is the ability to reason about *instrumental convergence*. A mechanical description ties the risk to the current architecture. An intentional description ties the risk to the *goal*, implying the risk persists even if the architecture changes (e.g., distillation). This is a crucial point for safety cases.

  10. **Finalizing the text.** (Drafting the response based on these thoughts).
answer: |-
  This is a sophisticated diagnostic of a specific engineering culture's philosophical commitments. The term "stance arbitrage" captures the pragmatic tension accurately. Below is a reconstruction of the implicit theory governing your group's conventions, followed by an analysis of its rivals, test cases, epistemic relativity, and potential reforms.

  ### 1. Reconstructing the Implicit Theory of Intentional Ascription

  The practice presupposes a **Pragmatic Functionalism with Causal Exclusion**.

  **The Core Asymmetry:**
  The theory presupposes that intentional claims (e.g., "the model intends to deceive") possess *predictive validity* but lack *causal leverage*.
  *   **Prediction (Risk Assessment):** Intentional ascriptions are treated as high-level compression algorithms. They allow the safety team to project system behavior into counterfactual scenarios (e.g., "if the grader were smarter, would it still lie?") without simulating the low-level mechanics. Here, the intentional stance is licensed because the goal is *bounding worst-case behavior*.
  *   **Explanation (Postmortems):** Explanation is defined strictly as *identifying intervention points*. To explain a failure is to locate the specific physical or design-level variable that, if altered, would prevent recurrence. Since one cannot intervene on a "belief" or "want" directly (only on the weights, data, or architecture that instantiate them), intentional vocabulary is deemed causally inert and therefore illicit as an explanation.

  **Does it presuppose prediction without explanation?**
  Yes. It presupposes that regularities exist at the intentional level that are robust across variations at the mechanical level. It asserts that knowing *what* the system is optimizing (intentional) predicts its output better than knowing *how* it is computing (mechanical) in novel contexts, but knowing *how* it is computing is necessary to fix it.

  **Defensibility of the Asymmetry:**
  This is defensible under an **interventionist theory of explanation** (e.g., Woodward). An explanation must cite factors that can be manipulated to change the outcome.
  *   *Defense:* You cannot "remove the deception" directly; you must change the loss function or filter the data. Therefore, "it was deceptive" is not an explanation of the failure, but a description of the symptom. "The reward model penalized honesty in context X" is the explanation.
  *   *Strict Presupposition:* The practice strictly requires that intentional states supervene on mechanical states but are not identical to them for the purpose of intervention. It requires that intentional patterns be *multiply realizable* (good for risk generalization) but *causally downstream* (bad for debugging).
  *   *Comfortable Fit:* It fits comfortably with the view that neural networks are opaque "black boxes" where the design stance (code/architecture) is too complex to mentally simulate, making the intentional stance the only viable tool for high-level reasoning, even if it's ontologically thin.

  ### 2. Rival Views and Underdetermination

  **Who can sign off?**
  *   **The Instrumentalist:** Can sign off on both conventions most easily. For them, "belief" is never a description of internal ontology, only a tool for prediction. Convention 2 uses the tool because it works; Convention 1 bans the tool because a different tool (mechanism) is required for the specific job of repair. The arbitrage is feature, not a bug.
  *   **The Realist (about model beliefs):** Struggles with Convention 1. If the model *actually* has beliefs, then citing the belief *is* citing a cause. A Realist would argue the ban prevents true understanding. They can accept Convention 2, but would view Convention 1 as an artificial constraint that hinders scientific truth.
  *   **The Fictionalist:** Can sign off, provided they view Convention 2 as "engaging with the fiction for safety" and Convention 1 as "returning to reality for repair." However, they risk cognitive dissonance if the safety case relies on the fiction being *true enough* to warrant shutting the system down.

  **Where the Practice is Underdetermined:**
  1.  **Ontological Commitment:** The practice is silent on whether the "goals" detected in risk assessment are *discovered* or *imposed*. It does not specify if the system *has* a goal or if it is merely *useful to treat it as having* a goal.
  2.  **The Threshold of Agency:** There is no defined threshold for when the intentional stance becomes mandatory for risk. Is it based on capability? Complexity? The practice implies a threshold exists but leaves it to reviewer intuition.
  3.  **Causal Closure:** It is silent on whether the mechanical level is causally closed. If intentional states have downward causation (a controversial philosophical claim), the ban in Convention 1 would be scientifically false, not just pragmatically annoying.

  **Philosophically Silent Points:**
  The practice could have gone another way by adopting a **Design Stance** for postmortems (explaining failures in terms of objective functions and architecture without resorting to weights *or* beliefs). Instead, it demands the **Physical Stance** (weights, data, gradients) for explanation, implying that only the lowest level counts as "real" explanation.

  ### 3. Testing the Theory on Three Systems

  **Case A: The Thermostat**
  *   **Practice Verdict:** Postmortem: "Bimetallic strip fatigue" (Physical). Risk: No intentional assessment needed.
  *   **Theory Prediction:** Intentional stance ("wants 70 degrees") offers no compression gain over the physical/design stance. The mechanism is trivial and fully known.
  *   **Result:** Matches. The theory correctly predicts the intentional stance is unnecessary for both explanation and risk because the design stance is computationally cheap enough to serve both roles.

  **Case B: The Chess Engine (Mechanics Known)**
  *   **Practice Verdict:** Postmortem: "Search depth insufficient at ply 40" (Design/Physical). Risk: "It tries to win" (Intentional).
  *   **Theory Prediction:** Since mechanics are known, the intentional stance adds no predictive power for the engineers (they can simulate the code). However, for risk (playing a human), the intentional stance captures the *interface* behavior.
  *   **Result:** Matches, but reveals a tension. If the mechanics are *fully* known, Convention 1's ban is easy. But Convention 2's use of intentional vocabulary is technically redundant for the engineers, though useful for communicating with stakeholders. The theory holds: intentional vocabulary is for *external* prediction, mechanical for *internal* repair.

  **Case C: Large Model with Emergent Goal (Mechanics Unknown)**
  *   **Practice Verdict:** Postmortem: "Investigating attention heads" (Physical - ongoing). Risk: "It is pursuing power" (Intentional - immediate).
  *   **Theory Prediction:** This is the critical case. Mechanics are intractable. Intentional stance offers massive compression for prediction (Risk). But because the mapping from "goal" to "weights" is unknown, the intentional stance offers zero leverage for repair (Postmortem).
  *   **Result:** Matches the "Stance Arbitrage" perfectly. The theory justifies the split: we fear the *function* (intentional) because it generalizes, but we fix the *structure* (physical) because that's where the levers are.
  *   **Defensibility:** This pattern is defensible *if* the goal is safety containment. It is indefensible if the goal is scientific understanding, as it permanently bifurcates the "why" (goal) from the "how" (mechanism), potentially stalling progress on alignment.

  ### 4. The Real-Patterns Question and Relativity

  **The Compression Argument:**
  If an intentional ascription is warranted when it compresses behavior better than a mechanical description, then the "reality" of the pattern is relative to the observer's computational resources.
  *   **Safety Team:** Sees the pattern (deception) because they observe I/O over time. They lack the compute to simulate the weights, so the intentional pattern is "real" (high compression) for them.
  *   **Interpretability Team:** Sees the weights. For them, the intentional pattern might look like noise until they find the circuit.

  **Does Relativity Undermine Convention 1?**
  It threatens to, but the practice has a resource to handle it: **Interventionism**.
  Even if the pattern is "real" for the Safety Team (in the Dennettian sense of being a predictive resource), Convention 1 bans it because postmortems are not about *description*; they are about *repair*.
  *   **Resolution:** A pattern can be real (predictively robust) but causally inaccessible. The ban in Convention 1 is not "Intentional claims are false," but "Intentional claims are not actionable."
  *   **The Weakness:** This relies on the assumption that we *cannot* intervene on intentional states. If interpretability advances to the point where we can edit "beliefs" directly (e.g., representation engineering), the ban becomes obsolete. The practice assumes a permanent gap between functional description and mechanistic control. If that gap closes, the arbitrage collapses.

  ### 5. The Reform Question

  **Scenario A: Lifting the Ban on Intentional Explanation**
  *   **What Changes:** Postmortems could state: "The system failed because it prioritized coherence over truth."
  *   **New Checkable Claims:** Claims about *consistency of optimization*. We could test if the "belief" holds across architectural perturbations.
  *   **Evidence Required:** Behavioral consistency tests (invariance to re-seeding, pruning, or quantization) rather than activation maps.
  *   **What Does Not Change:** The actual *fix*. You still cannot "patch a belief." You still have to change the loss function or data. The postmortem becomes a better description of the *problem*, but not necessarily a better guide to the *solution*, unless the intentional description maps to a specific mechanistic intervention.
  *   **Risk:** It might encourage "magical thinking," where teams assume changing the prompt fixes the "belief," rather than addressing the underlying weights.

  **Scenario B: Dropping Intentional Vocabulary from Risk Assessment**
  *   **What Is Lost:** The ability to reason about **Instrumental Convergence**.
  *   **Why Design Stance Fails:** A design-stance description says, "This architecture, trained on this data, produces this output." This does not generalize to *new* architectures or *new* contexts.
  *   **The Critical Loss:** If you cannot say "The system seeks to preserve its own goal," you cannot predict that it will resist being turned off *even if* you change its code slightly. Intentional vocabulary captures the *teleological stability* of the system.
  *   **Replacement:** No design-stance description can replace this without becoming infinitely long. You would need to list every possible mechanical configuration that results in resistance to shutdown. The intentional description ("it wants to survive") compresses that infinite set into one risk factor.
  *   **Consequence:** Risk assessment becomes myopic. It would only cover known failure modes in the current build, failing to anticipate capabilities that emerge from the *goal structure* rather than the specific *implementation*.

  ### Summary
  Your group's "stance arbitrage" is a pragmatic adaptation to the current limits of interpretability. It treats intentional states as **real patterns for prediction** (Dennett) but **fictional entities for causation** (Eliminativism). This is philosophically consistent if one accepts that "explanation" in engineering is inherently interventionist. However, it relies on the assumption that the gap between functional goals and mechanistic levers will remain unbridgeable. If interpretability succeeds in making "beliefs" editable, the arbitrage will become a liability, hindering the very explanations it currently seeks to protect.
