  The seminar room smells of stale coffee and whiteboard marker. Owen leans against the back of a chair, arms crossed. Nadia is packing her bag, but pauses.

  **Owen:** You're still worried about closure? Look, the tracking account predicts we don't know the denial of sceptical hypotheses. That's not a bug; it's the only honest description of our modal situation. If you were a brain in a vat, you'd still believe you weren't. So you don't know.

  **Nadia:** It's not about the vat yet. It's about Marianne in the basement. She reads the barometer and the seismograph, both wired independently, and deduces she isn't hallucinating the readouts. Intuitively, she knows that. But standard tracking says she doesn't, because if she were hallucinating, she'd still believe she wasn't. That's why I'm indexing the conditions to evidence. Sensitivity shouldn't ask "If $p$ were false, would you believe?"; it should ask "In the nearest worlds where you have this evidence and base your belief on it, is $p$ true?"

  **Owen:** That move hinges entirely on whether evidence is factive. If the evidence Marianne "has" entails she isn't hallucinating, then every world where she has that evidence is a world where she isn't hallucinating. Your subjunctive condition becomes vacuous. You're just an evidentialist wearing a modal hat. But if evidence isn't factive—if a hallucinating Marianne has the same visual seemings—then the nearest worlds where she has the evidence include the hallucination worlds. Closure fails all over again. Which horn are you choosing?

  **Nadia:** I'm rejecting the dichotomy. Evidence includes the externalist relation to the source. In the actual world, Marianne's evidence includes the fact that the instruments are causing her belief. In the hallucination world, she doesn't have that evidence because there are no instruments causing anything. So the condition "bases her belief on the evidence she actually has" filters out the hallucination worlds. The modal work is done by the basing relation, not the content.

  **Owen:** So you're saying in the hallucination world, she isn't basing her belief on evidence because there is none? That feels like stipulation. But let's grant it. Does Marianne know she isn't a brain in a vat? On your view, she knows she isn't hallucinating the readouts via evidence-anchoring. But if she deduces she isn't a vat from that, closure should transmit the knowledge. If you block transmission, you're back to standard tracking. If you allow it, you've given her anti-sceptical knowledge for free.

  **Nadia:** She doesn't know she isn't a vat. The evidence anchoring the readout belief is local—it involves the specific causal chain from barometer to retina. That evidence doesn't exist in the vat world. But the evidence anchoring the vat belief would have to be global—her entire sensory history. Those are different evidence sets. She can't deduce the global claim from the local evidence because the local evidence doesn't anchor the global claim in the same way.

  **Owen:** Now you're gerrymandering the evidence set. Which evidence anchors the condition? Everything she knows, or just what she's relying on in this inference? If it's everything she knows, she knows too much. If it's just what she's relying on, you've reintroduced the method-individuation problem. You're saying she knows she isn't hallucinating because she's relying on the instruments, but she doesn't know she isn't a vat because... what? She's relying on the wrong bit of her mind?

  **Nadia:** She's relying on the actual causal link. In the vat scenario, that link is severed. My point is that the basing relation is sensitive to the actual source. I concede, though, that if evidence is purely internal, my view collapses into standard tracking. I need evidence to be factive about the source, not just the content.

  **Owen:** And I concede that if evidence is factive about the source, your view does save closure for the instrument case. But only by making the modal condition idle. If having the evidence guarantees the source exists, you don't need the subjunctive check. You've solved closure by defining away the possibility of error in the evidence worlds.

  **Nadia:** Not defining away error, but restricting the relevant worlds. I'd change my mind if you could show a case where the source exists, the evidence is factive, but she still fails to know. I think that's impossible.

  **Owen:** And I'd change my mind if you could individuate the evidence set without appealing to "what she's relying on," which always smells like post-hoc method selection. If you can give me a principled limit on the evidence set that isn't just "the bit that works," I might accept the factivity cost. Until then, I'd rather keep the closure failure and keep the modal work real.

  **Nadia:** Fair. But then you have to tell Marianne she doesn't know she's reading the instruments.

  **Owen:** I'll buy her a coffee and explain possible worlds.

  **Nadia:** Good luck with that.
