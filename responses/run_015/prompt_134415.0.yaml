      *   **Point 2: The "Three Examples" & Family Resemblance.** This is crucial. For humans, 3 examples work because of shared background (form of life). For AI, it's interpolation. Wittgenstein would argue the model isn't seeing "resemblances" but "correlations." It lacks the *context* to know which resemblance is relevant.
      *   **Point 3: Training (*Abrichtung*) vs. Teaching.** The model is drilled. It doesn't understand the *point* of the game.
      *   **Point 4: The Criterion of Use.** Can the model *use* the concept outside the Bongard test? If not, it doesn't have the concept.
