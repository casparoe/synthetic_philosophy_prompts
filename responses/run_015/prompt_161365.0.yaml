  1. **Pre-Registration:** Applicants must file this form 28 days prior to the intended utterance. Spontaneous promises are classified as unlicensed speech acts and carry no statutory weight. If the intention changes during the waiting period, submit Form PA-1 Withdrawal.

  2. **Contextual Voidance:** Utterances delivered on stage, within poetic metre, or while quoting another speaker are automatically infelicitous. The Office reserves the right to subpoena scripts or literary analyses to determine context. If the utterance is deemed "hollow," the speaker may be liable for misleading verbal advertising.

  3. **Compliance Audits:** Upon fulfilment (or alleged fulfilment), a Compliance Officer will interview both parties. If the obligation is broken, the original promise is declared retroactively void. This ensures no record exists of a promise being broken, only of promises that were never made. Applicants should note that breaking a promise invalidates the promise itself, thereby removing the breach.

  4. **Verification of Sincerity:** While the Office cannot audit internal mental states, applicants must submit a sworn affidavit regarding their psychological state at the time of utterance. Discrepancies between the affidavit and subsequent behaviour will result in sanctions for fraudulent illocution.

  5. **Perlocutionary Exclusion:** The Office licences the act of promising only. Any distress, relief, anger, or inspiration felt by the Hearer subsequent to the utterance is classified as a perlocutionary effect and is none of the Office's business.*

