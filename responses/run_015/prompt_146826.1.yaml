answer: |-
  Good morning. Welcome to "History for the Future."

  Looking around this room, I see a fascinating divide. On one side, we have historians who can recite Nietzsche's *Untimely Meditations* over breakfast. On the other, we have planners and climate officers who have never heard of him, and frankly, have a flood mitigation grant due on Thursday.

  My job this morning is to build a bridge between those two tables. And the blueprint for that bridge is actually found in the very philosophy half of you know and half of you don't. Nietzsche suggested there are three ways we use history: the Monumental, the Antiquarian, and the Critical. If we want this workshop to result in something other than a nice PDF, we need to understand how each of these modes helps us—and how each of them might kill us.

  First, there is **Monumental History**. This is the history of great examples, of heroes, of resilience. It's the story we tell ourselves to feel brave. It says, "Our ancestors survived the storm of 1938, so we can survive this."

  It is a comforting story. It is also a dangerous one.

  When we look at the past only for heroism, we ignore the specific conditions that allowed that survival. We assume resilience is a character trait rather than a logistical outcome. To put it in terms that might feel a little awkward: There is a town down the coast that erected a bronze plaque honoring the 1974 flood wall. It's a beautiful monument. It commemorates a wall that breached within twenty minutes of the surge. We are literally monument-building to failure because the story of "we built a wall" feels better than the data of "the wall didn't work."

  For the planners in the room: beware the Monumental. Past resilience is not a proxy for future safety.

  Second, there is **Antiquarian History**. This is the mode of the archive. It is the reverence for the local, the specific, the preserved. It says, "Every record matters. Every layer of soil is sacred."

  To my historian colleagues: this is your craft, and it is vital. Without you, we have no memory. But for the planners, the Antiquarian mode can feel like paralysis. If every precedent is sacred, then every solution is constrained. If we treat every old zoning law or flood map as a heirloom rather than a hypothesis, we cannot adapt. We become curators of a city that is slowly drowning. We need to honor the archive without worshipping it.

  Which leaves us with the third mode, the hardest one: **Critical History**.

  This is the mode of judgment. It is the act of putting the past on trial so that the future can live. It requires us to look at our infrastructure, our policies, and our precedents, and say, "This failed. This is unjust. This must be abandoned."

  I know what some of you are thinking. To the historians: Does this sound like destruction? Like dismissing your work? It shouldn't. Because you cannot critique what you do not know. It takes rigorous historical work to prove that a precedent is actually failed, rather than just misunderstood. You provide the evidence that allows us to let go.

  And to the planners: This is your permission slip. You are not being "anti-history" when you propose removing a levee system that no longer serves the watershed. You are practicing Critical History. You are using the past to liberate the future.

  So, as we begin this workshop, my request is this: Let us resist the temptation to heroize our past resilience. Let us respect the archives without being paralyzed by them. And let us have the courage to be critical.

  We are not here to preserve the world as it was. We are here to ensure there is a world that comes next.

  Thank you.
