      *Refining (c):* Scanlon's actual view on aggregation is nuanced. He admits some aggregation is possible if the burdens are similar. But here they are different (paralysis vs pain). The "ex ante" move is the best bet for a reply. I will stick with that but emphasize the limitation regarding identifiable victims.

