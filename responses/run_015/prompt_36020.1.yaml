      *Let's write.*

      *Scenario:*
      Imagine a hospital administrator managing a fixed budget that allows for only one of two interventions. Option A funds a groundbreaking gene therapy for Elias, a single patient suffering from a rare degenerative condition that will otherwise leave him completely paralyzed and bedridden for the rest of his life. Option B funds a widespread screening and pain-management program for a thousand patients in the same district, each of whom suffers from a severe arthritic condition. Without the program, these thousand patients will not be paralyzed, but they will endure chronic, debilitating pain and a permanent 50% reduction in mobility that will significantly impair their ability to work or care for their families.

      The costs are identical, and the choice is mutually exclusive. From a utilitarian perspective, the calculation is straightforward: one sums the total welfare loss prevented in each case. The aggregated loss of the thousand patients—each losing half their mobility and enduring years of pain—vastly outweighs the total loss suffered by Elias, even though his individual plight is more severe. However, a contractualist framework asks a different question: which principle for allocating resources could no one reasonably reject? Elias can argue that any principle forcing him to remain bedridden when he could be saved is reasonably rejectable. The question is whether the thousand patients can jointly argue that their moderate burdens outweigh Elias's severe one, or if their complaints must be assessed individually against his.

      *Analysis (a):*
      Under Scanlon's contractualism, justification must be owed to each person individually. To reject a principle that saves Elias, any single member of the thousand must show that their individual complaint is stronger than Elias's. Since Elias faces total paralysis while any single arthritis patient faces only reduced mobility and pain, Elias's complaint is strictly more stringent. Contractualism blocks the administrator from adding the thousand moderate complaints together to outweigh the one severe complaint; the thousand cannot form a collective veto. Therefore, the principle "save the single severe case over many moderate cases" cannot be reasonably rejected by any individual in the larger group, because no single one of them suffers more than Elias. The verdict favors Elias.

      *Analysis (b):*
      The feature doing the work is the non-aggregation constraint inherent in the individualistic structure of reasonable rejection. The theory treats the group of one thousand not as a collective entity with a summed interest, but as one thousand separate moral claimants. If this feature is removed—if we allow the complaints to be aggregated into a total sum of welfare loss—the verdict flips immediately. Once the moderate burdens are summed, the total utility saved by Option B exceeds the utility saved by Option A, aligning the verdict with utilitarianism and common intuition. The contractualist verdict hinges entirely on the prohibition against summing distinct individual grievances.

      *Analysis (c):*
      The strongest contractualist reply draws on Scanlon's distinction between identifiable victims and statistical risks. Scanlon suggests that when parties are behind a veil of ignorance—where each person faces a statistical risk of being either Elias or one of the thousand—aggregation becomes permissible because the choice is made ex ante. In such cases, rational agents would choose the rule that minimizes overall expected burden, likely saving the thousand. However, in this realistic hospital scenario, the patients are identifiable. Here, the reply struggles to succeed. While it softens the blow for policy-making behind a veil, it offers little comfort when faces are known. Honest evaluation suggests that for identifiable victims, contractualism remains stubbornly non-aggregative, leaving the administrator with a verdict that sacrifices the many to save the one, a result that continues to strike many as morally untenable.

