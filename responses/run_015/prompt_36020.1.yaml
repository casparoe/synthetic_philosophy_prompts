      *   *Critique:* Is it two paragraphs? Yes. Does it stipulate verdicts? It hints at them but frames them as questions/theory applications. I need to be careful not to say "Contractualism says Elias wins" explicitly in the scenario text, but the prompt asks me to construct the scenario *to the specifications* which include "delivers a verdict that even most deontologists would find too demanding." Actually, the prompt says "The case must be one in which Scanlon's contractualism... delivers a verdict..." This implies the scenario should be set up such that this *is* the result. But the instruction also says "it must not stipulate the verdicts: the contractualist and the utilitarian conclusions must be derived from the theories." This means the *scenario description* shouldn't say "Contractualism chooses Elias." The analysis section will do the deriving. Okay.
