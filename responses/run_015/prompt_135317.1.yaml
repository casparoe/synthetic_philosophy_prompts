answer: |-
  This is a sharp, philosophically sophisticated angle. It moves beyond the standard historical critique ("Rousseau was factually wrong about Geneva") into a structural critique of his reasoning ("Rousseau failed to properly categorize the population for his risk assessment").

  Here is a sanity check on the mapping, the outline, and the historical risk.

  ### 1. Is the "Reference Class" mapping too forced?
  **No, but it needs precise definition.**
  The reference class problem usually asks: *Which group do we use to calculate the probability of an outcome?*
  *   **Rousseau's Calculation:** Theater in Large Cities (Paris) $\rightarrow$ Corruption. Therefore, Theater in Small Republics (Geneva) $\rightarrow$ Corruption.
  *   **Your Intervention:** The "corruption probability" is dependent on the *composition of the audience*.
      *   **Rousseau's Assumed Class:** "The Public" (treated as a homogeneous body of citizens).
      *   **Your Actual Class:** "The Audience" (stratified into Native Citizens vs. Foreign Merchants).

  **The Risk:** Don't let the terminology get too statistical. Keep it grounded in political theory. Instead of just saying "base rate," talk about **"relevant similarity."** Rousseau assumes Geneva is relevantly similar to Paris regarding *social cohesion*. You are arguing they are not relevantly similar regarding *demographic exposure*.

  ### 2. Outline Feedback
  Your flow is logical, but here are two tweaks to tighten the screw:

  *   **Refine Point (1):** Instead of just "presence-vs-representation," frame this as **Rousseau's Mechanism of Harm.** How does the theater actually corrupt? (e.g., it creates passivity, reinforces inequality, or changes mores). This is crucial because if the mechanism requires *citizen participation*, your demographic critique hits harder.
  *   **Refine Point (3):** "Correcting the class kills the empirical claim but spares the normative one."
      *   *Nuance:* If the empirical claim fails (theater won't corrupt citizens because citizens won't be the main audience), does the normative claim survive? Or does the normative claim *depend* on the empirical prediction?
      *   *Suggestion:* Argue that correcting the class reveals the normative claim was never about "corruption" generally, but about **boundary maintenance**. The "harm" isn't the play; it's the mixing of citizens with merchants.

  ### 3. The Historical Question: Merchants & Lobbying
  **Do not build the essay on unverified lobbying claims.**
  If you can't verify the lobbying without deep archival digging, you risk a factual error that undermines the philosophical point.

  **Better Strategy: Use Rousseau's Own Text.**
  Rousseau explicitly distinguishes between *Citoyens* (Citizens), *Bourgeois*, and *Habitants* (Residents/Foreigners) in the *Letter to d'Alembert*. He is obsessed with the dilution of the citizenry by wealthy outsiders.
  *   **Frame it structurally:** You don't need to prove merchants *lobbied* for the theater. You only need to show that Rousseau *acknowledges* the theater would primarily serve the wealthy/foreign population, yet he argues it will disproportionately harm the native citizens.
  *   **The Argument:** Rousseau admits the theater attracts the rich/foreigners (Section on the Comedians, costs of tickets, etc.). If the primary consumers are the "corrupt" foreign class, why does he fear for the "virtuous" citizen class?
      *   *Option A:* He fears trickle-down corruption (citizens watching merchants).
      *   *Option B:* He fears citizens will bankrupt themselves trying to emulate merchants.
      *   *Your Critique:* Both rely on a reference class error. He assumes citizens and merchants share the same susceptibility to theatrical influence, or that they inhabit the same social sphere enough for the infection to spread.

  ### 4. One Conceptual Trap to Avoid
  Be careful not to argue that "Merchants aren't corruptible." Rousseau would say merchants are *already* corrupt (by definition of being commercial/foreign).
  **Your argument should be:** The risk profile of a *Merchant Audience* is different from a *Citizen Audience*.
  *   **Paris Reference Class:** Homogeneous elite culture.
  *   **Geneva Reality:** Heterogeneous class structure.
  *   **The Error:** Applying the risk probability of a homogeneous group to a heterogeneous one.

  ### Summary Recommendation
  1.  **Keep the Reference Class frame.** It's fresh and works well with Rousseau's probabilistic language (he often argues from "experience" and "history").
  2.  **Drop the "Lobbying" claim.** Replace it with an analysis of **ticket prices and social seating.** Rousseau discusses how expensive theater is. Use that to prove the audience *would* be wealthy foreigners, not the average citizen he claims to protect. This is textual evidence, not external historical speculation.
  3.  **Sharpen the Conclusion.** If the reference class is wrong, Rousseau isn't just making a prediction error; he is revealing that his definition of "Geneva" is an idealized fiction, not a demographic reality. He is protecting a *concept* of Geneva, not the actual people living there.

  This is a strong thesis. It turns a potential historical nitpick into a critique of Rousseau's political ontology. Go for it.
