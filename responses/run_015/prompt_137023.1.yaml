prompt: |-
  Hi — I'm working through the epistemic foundations of game theory (rationalizability, iterated elimination, what you're supposed to get out of assuming rationality is common knowledge) and there's a knot in it I cant untangle on my own. I'd rather hear an actual explanation than a textbook paragraph.

  The thing that bugs me: whenever common knowledge gets explained, the example is some exogenous fact — it's raining, the payoffs are these, the message got delivered. But "everyone is rational" isn't like that. Whether I count as rational depends on what I believe, and what I'm allowed to believe is itself constrained by the very assumption that rationality is common knowledge. So the fact we're iterating on looks partially defined in terms of itself. Is that circularity real, or just a harmless fixed point? Relatedly: is "rationality is common knowledge" a claim about the actual world, or really a restriction on which possible worlds the model is allowed to contain — a closure condition on the type space? I suspect that choice is doing hidden work and that nobody says so out loud.

  To make it concrete, here's a variant I invented. Call it fragile rationality. Each player is independently "working" with probability 1−ε and "broken" with probability ε. If you're working you maximize expected utility given your beliefs. If you're broken your action is drawn uniformly at random. Everyone always knows their own status and never knows anyone else's. All of this — ε, the independence, what broken players do — is common knowledge.

  So: (1) What does the iterated reasoning look like here? Is there an analog of iterated elimination, and does it settle down? (2) As ε→0, does the set of compatible outcomes collapse back onto the ε=0 answer, or are there profiles that survive for every ε>0 and vanish at ε=0? I'm thinking of the generals / email-game style examples where near-common knowledge behaves nothing like common knowledge — is this the same phenomenon or am I being misled by the analogy? (3) Does it matter how rationality fails — random action, versus optimizing against a corrupted belief, versus just stopping maximizing? If it does, what was the ε=0 result really resting on? I don't want a proof; I want the intuition and where it breaks.

  American English please, and give it to me in named sections in this order, roughly:

  - Short version (~150 words) — the takeaway up front
  - What the standard assumption is really doing (~350)
  - Is the circularity a problem (~300)
  - Fragile rationality, worked through (~500)
  - What I should take away (~200)

  Skip proper names and papers where you can — I want the ideas, not the reading list.
