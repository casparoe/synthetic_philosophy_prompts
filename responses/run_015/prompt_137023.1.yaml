answer: |-
  ### Short version

  Your suspicion is correct: common knowledge of rationality is not a factual claim about the world, but a closure condition on the model. It restricts which possible worlds we allow into the analysis. The circularity you sense is not a logical flaw but a fixed-point requirement. We are looking for a state where beliefs and actions mutually justify each other indefinitely.

  In your fragile rationality model, this infinite chain breaks. Because there is always a non-zero chance someone is broken, higher-order confidence decays exponentially. You can only iterate the reasoning as many times as your confidence remains high enough to rule out irrational behavior. As $\epsilon \to 0$, the result does not necessarily converge to the standard answer. If the game requires infinite steps of reasoning to solve, any $\epsilon > 0$ stops the process finite steps in, creating a discontinuity. Common knowledge is a singular idealization that crumbles under the slightest doubt.

  ### What the standard assumption is really doing

  When textbooks say rationality is common knowledge, they are not describing a psychological state that players achieve through thinking. They are defining the boundaries of the universe you are allowed to consider. In epistemic game theory, a model consists of a state space describing every possible configuration of the world, including what each player knows and believes. To assume common knowledge of rationality is to delete every state from that space where anyone is irrational, or where anyone believes anyone else might be irrational, ad infinitum.

  Think of it as pruning a tree. You start with all logically possible combinations of actions and beliefs. Then you cut off any branch where a player makes a suboptimal choice given their beliefs. Then you cut off any branch where a player believes the previous cut didn't happen. You keep cutting until the tree stops changing. What remains is the set of worlds consistent with the assumption.

  This confirms your intuition: it is a restriction on the type space. It solves the problem of "what beliefs are allowed" by fiat. We do not derive these beliefs from history or psychology; we impose them as a consistency constraint. If no worlds survive the pruning, the assumption is too strong for the game. If many survive, the assumption is too weak to predict a unique outcome. The work is being done by the exclusion of possibilities, not by the inclusion of facts.

  ### Is the circularity a problem

  The circularity you identified—rationality depends on beliefs, but beliefs are constrained by rationality—is real, but it is benign. It is the circularity of a system of equations, not a logical fallacy. In a system like $x = f(y)$ and $y = g(x)$, $x$ depends on $y$ and vice versa. This doesn't make the system unsolvable; it just means you look for a fixed point where both equations hold simultaneously.

  The problem arises only if you view the reasoning as a dynamic process occurring in time. If you imagine players sitting down and thinking step-by-step, you worry about where the first step comes from. But the standard model is static. It asks: "Is there a configuration of the world where everyone is rational, everyone knows everyone is rational, and so on?" It does not ask how they got there.

  If you treat it as a dynamic process, you need a starting point, and the circle becomes vicious. But as a structural constraint, it is simply a filter. You are not assuming players generate rationality from nothing; you are assuming we only care about scenarios where rationality is self-sustaining. The knot untangles when you stop thinking about causality and start thinking about consistency. The assumption defines the arena; it does not describe the play.

  ### Fragile rationality, worked through

  In your fragile rationality model, the infinite pruning process hits a wall. Let's trace the iterated reasoning. In the standard case, I eliminate your dominated strategies because I know you are rational. Then I eliminate my strategies that were best responses only to those dominated ones, because I know you know I am rational. This chain continues indefinitely.

  In your model, I know you are rational only with probability $1-\epsilon$. So, I cannot strictly eliminate any strategy of yours that might be played by a broken type, however unlikely. More importantly, I know you know I am rational only with probability $(1-\epsilon)^2$. At level $k$ of reasoning, the probability that we mutually know rationality is $(1-\epsilon)^k$. As $k$ grows, this probability vanishes. You can only iterate elimination as long as the probability of mutual rationality is high enough to justify ignoring the broken types. Eventually, the risk of facing a random player outweighs the gain from optimizing against a rational one. The reasoning settles down, but at a finite level of depth, not infinity.

  As $\epsilon \to 0$, does it converge? It depends on the game. If the game is solvable in finite steps (say, 5 rounds of elimination), then for small enough $\epsilon$, you can complete all 5 steps, and the outcome matches the standard case. But if the game requires infinite steps to narrow down to a unique solution (like the beauty contest game), then any $\epsilon > 0$ stops you at some finite step $k$. There will be profiles that survive for every $\epsilon > 0$ but vanish at $\epsilon = 0$. This is exactly the email-game phenomenon. Common knowledge is a discontinuous point; near-common knowledge is fundamentally different.

  Does the mode of failure matter? Yes, but less than the doubt itself. If broken players act randomly, rational players must hedge against all actions. If broken players optimize corrupted beliefs, rational players might still rule out some extremes. However, the core driver of the breakdown is the uncertainty halting the chain of deduction. The $\epsilon = 0$ result rests on the ability to iterate infinitely. Once you admit any doubt, the infinite ladder loses its rungs, and you are left standing at whatever height your confidence supports.

  ### What I should take away

  You should trust your intuition about the type space. Common knowledge of rationality is a structural closure condition, not an empirical claim. It works by excluding worlds where the chain of belief breaks, rather than by proving the chain holds. This makes it a powerful tool for narrowing solutions, but also a fragile one.

  Your fragile rationality model demonstrates that this solution concept is not robust. Real agents always have some doubt about others' reasoning capabilities. Because common knowledge requires infinite certainty, even microscopic doubt prevents the full iterated elimination from completing. The standard result is a limiting case that may not describe any actual situation where $\epsilon$ is merely small.

  Ultimately, the epistemic foundation tells you that rationality is not just about maximizing utility; it is about the structure of belief. When that structure allows for even a tiny crack, the infinite tower collapses. Use the standard assumption to find theoretical bounds, but recognize that in application, reasoning depth is bounded by confidence, not just logic.
