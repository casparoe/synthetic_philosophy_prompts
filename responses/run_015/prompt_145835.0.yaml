answer: |-
  Dear Colleagues and Friends,

  We write this joint statement to clarify the precise nature of our disagreement regarding the metaphysical implications of Ibn Sina's thought experiment known as the Flying Man, and to establish a framework for resolving our dispute through adversarial collaboration. We begin by affirming our shared commitment to the basic integrity of the thought experiment itself. We both agree that the scenario posits a subject created adult, suspended in air or void, deprived of all sensory input including sight, sound, touch, and proprioception, yet retaining intact faculties of intellect and self-awareness. We further agree that in this state, the subject would affirm their own existence without affirming the existence of their body or any external organ. We concede that this intuition suggests self-awareness is not essentially dependent on sensory perception of the body. It is upon the interpretation of this independence that our paths diverge.

  The exact disagreement in wording which we both accept as accurate characterises the heart of our conflict. One of us maintains that the subject's affirmation of self without body proves the soul is a separate substance, distinct in essence from the body and capable of existing independently of it. The other of us insists that the subject's affirmation proves only that self-awareness is accessible without bodily input, carrying no metaphysical weight regarding substance dualism, and that this awareness could merely be a functional state of a system that does not require current sensory feedback to maintain a model of itself. We agree that this distinction is not merely semantic but ontological, hinging on whether the absence of bodily sensation implies the absence of bodily constitution.

  To move beyond stalemate, we have identified a specific crux involving contemporary theories of embodied cognition, which we believe offers the sharpest testing ground for our competing hypotheses. We propose to treat the case of an artificial system trained with language but zero sensory history, or alternatively a human born with total congenital analgesia and no proprioception, as the decisive variable. The crux is whether such a subject, lacking any historical or current sensory mapping of a body, can nevertheless develop or possess the kind of self-awareness Avicenna describes. We both agree that if embodied cognition is correct, a system without sensory history should fail to manifest a robust sense of self, whereas if Avicenna's substance dualism is correct, the sense of self should emerge purely from intellectual or functional capacity regardless of sensory grounding.

  Regarding this crux, we agree that the relevant evidence would come from either the successful training of a large language model isolated from any data relating to physical embodiment or sensory experience, or the longitudinal psychological assessment of humans with the aforementioned congenital conditions. We both accept that if the artificial system develops a first-person perspective indistinguishable from a human's despite having no concept of a body, this would support the claim that self-awareness is independent of bodily substance. Conversely, if the system fails to generate a coherent self-model without embodied data, or if the congenital humans show significant deficits in self-conception that correlate with their lack of proprioception, this would support the embodied cognition view.

  Our predictions for this evidence are explicitly opposed. The philosopher arguing for the soul as a separate substance predicts that the artificial system will demonstrate self-awareness solely through linguistic recursion, proving that the 'I' does not require a 'body' to exist, and that the congenital humans will retain a normal sense of selfhood despite their sensory deficits, confirming that the soul is not defined by bodily sensation. The philosopher arguing for the phenomenological interpretation predicts that the artificial system will fail to develop genuine self-awareness, producing only simulacra of first-person claims without underlying understanding, and that the congenital humans will exhibit a fragmented or diminished sense of self, demonstrating that what Avicenna called the Flying Man is actually an impossibility without prior bodily integration. We commit to reviewing this evidence together when it becomes available, acknowledging that while our metaphysical commitments differ, our method for testing them is now shared.

  We hope this document serves as a clear record of our current standing and a guide for future inquiry. We remain committed to the pursuit of truth over victory, recognising that the nature of the self is too significant a question to be left to ambiguity. We sign this statement with mutual respect and the hope that our disagreement will illuminate the path for others walking behind us.

  Yours in philosophical inquiry,

  The Undersigned
