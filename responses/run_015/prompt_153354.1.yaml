answer: |-
  It is a pleasure to engage with this draft. You are tackling one of the most persistent friction points in the literature: the transition from Lewisian *coordination* to what Cristina Bicchieri and others call *social norms*.

  Per your request, I will begin by restating the account of convention you are employing to ensure we are aligned on the theoretical baseline. Then I will address the placement of your sanction clause, the structural implications for the definition, and the validity of your colleague's objection.

  ### 1. Restatement of Your Working Account

  You are operating with a standard, high-fidelity reconstruction of David Lewis's account from *Convention: A Philosophical Study* (1969). On your reading, a convention is a regularity $R$ in the behavior of a population $P$ in a recurrent situation $S$ such that:

  1.  **Conformity:** Nearly everyone in $P$ conforms to $R$.
  2.  **Expectation:** Nearly everyone in $P$ expects nearly everyone else in $P$ to conform to $R$.
  3.  **Conditional Preference:** Each agent in $P$ has a decisive reason to conform to $R$, *conditional* on the expectation that others will conform.
  4.  **General Preference:** Everyone prefers general conformity to $R$ over slightly-less-than-general conformity (i.e., coordination is valuable).
  5.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well, provided there was mutual expectation regarding $R'$.
  6.  **Common Knowledge:** Conditions 1 through 5 are common knowledge among $P$.

  This is a robust summary. It captures the game-theoretic heart of Lewis's view: conventions are solutions to **coordination problems** (specifically, proper coordination problems where interests align) sustained by self-fulfilling expectations.

  ### 2. Diagnosing the Gap: Coordination vs. Cooperation

  You have correctly identified a limitation. Lewis's paradigmatic cases (driving on the right, using "red" for stop) are *pure coordination games*. In these games, I do not want to deviate even if I could get away with it; if you drive on the right, I *want* to drive on the right to avoid a crash. The incentive is intrinsic to the coordination itself.

  However, your cases (queueing, not cutting in line) are often **mixed-motive games** (closer to Prisoner's Dilemmas or Assurance Games). In a queue, I often *prefer* to cut in line (I save time) even if everyone else queues. I only queue because I fear the social cost (the glare, the shaming).

  If compliance collapses without the threat of sanctions, the preference structure is not Lewisian pure coordination. In Lewis's model, the equilibrium is self-policing because deviation is self-defeating. In your model, deviation is profitable *unless* policed by others.

  ### 3. Where to Insert the Sanction Clause

  You asked which condition your sanction clause should extend and where to insert it.

  **Do not add it as a seventh condition.**

  If you add it as a freestanding condition (e.g., "7. Deviators are punished"), you risk making sanctions an external add-on rather than part of the agent's reasoning. This leads to the overgeneration problem your colleague mentioned.

  Instead, you should amend **Condition 3 (Conditional Preference)**.

  In Lewis's original account, Condition 3 holds because the agent's payoff is maximized by matching the others. In your amended account, Condition 3 holds because the agent's payoff is maximized by matching the others *minus the expected cost of sanctions*.

  **Proposed Amendment to Condition 3:**
  > "Each agent has a reason to conform conditional on the others conforming, **where this reason comprises both the benefit of coordination and the avoidance of decentralized sanctions imposed by third parties for deviation.**"

  By embedding the sanction into the *preference structure*, you acknowledge that the sanction is not merely an external force (like a law) but part of the strategic calculation that sustains the equilibrium. This keeps the definition internal to the agents' reasoning, which is crucial for a game-theoretic account.

  ### 4. Addressing the "Overgeneration" Objection

  Your colleague argues that adding a sanction clause makes the account overgenerate (i.e., it counts things as conventions that are not). They are partially right, but for a fixable reason.

  If *any* regularity sustained by threats counts as a convention, then a bank robbery (sustained by the threat of a gun) or a totalitarian decree (sustained by the threat of prison) could theoretically qualify. This would destroy the distinctiveness of "convention."

  To prevent overgeneration while keeping your sanction clause, you must lean heavily on **Condition 5 (Arbitrariness)** and the **Decentralized** nature of the sanction.

  1.  **Arbitrariness:** A law against murder is not arbitrary; there is no alternative regularity (e.g., "murder on Tuesdays") that would serve just as well. Queueing *is* arbitrary (first-come-first-served vs. taking a number vs. lottery). Ensure your definition specifies that the sanctions must support an *arbitrary* equilibrium.
  2.  **Decentralization:** You specified "without any central enforcer." This is vital. Lewisian conventions are self-enforcing. Your amendment describes norms that are *peer*-enforcing. You must specify that the sanctions are informal and decentralized (glares, shaming) rather than institutional (fines, police).

  If you restrict the sanction clause to **informal, decentralized penalties supporting an arbitrary equilibrium**, you avoid counting laws or coercion as conventions.

  ### 5. A Caution on Emergence

  You wrote: *"I also want that clause to do the work of explaining how the regularity gets started, since a few punishers punish, those punished conform, the regularity snowballs..."*

  Here, I must urge caution. Game-theoretically, it is difficult for sanctions to explain the *origin* (emergence) of a norm, because punishing is itself costly.
  *   **The Second-Order Free Rider Problem:** If punishing a deviator costs me time or social risk, why should I punish? If I don't punish, the sanction threat isn't credible.
  *   **The Emergence Sequence:** In the literature (e.g., Ullmann-Margalit, Bicchieri), sanctions usually explain *persistence*, not *emergence*. The regularity usually starts via a **focal point** (a Lewisian mechanism) or precedent. Once the regularity is established, expectations form. Once expectations form, people feel entitled to enforce them.

  If you claim sanctions explain the *start*, you face the regress: why did the first punishers punish before the norm existed? It is safer to argue that Lewisian focal points explain the *origin*, while your sanction clause explains the *stability* in cases where temptation to deviate is high.

  ### 6. Recommendation for Your Paper

  To make your paper philosophically robust while retaining your core insight:

  1.  **Reframe the Contribution:** Acknowledge that you are moving from Lewis's *Conventions* (Pure Coordination) to *Social Norms* (Mixed Motive + Enforcement). Cite Bicchieri (*The Grammar of Society*) or Ullmann-Margalit (*The Emergence of Norms*) to show you know this distinction.
  2.  **Modify Condition 3:** Incorporate the sanction avoidance into the conditional preference condition, rather than adding a seventh condition.
  3.  **Refine the Emergence Claim:** Argue that sanctions stabilize the norm against erosion, rather than generating the norm *ex nihilo*.
  4.  **Defend Against Overgeneration:** Explicitly use the **Arbitrariness** condition to rule out coercive laws. A convention must be a solution to a problem where multiple solutions were possible.

  **Summary of the Amendment:**
  Keep the six conditions. Rewrite Condition 3 to specify that the "reason to conform" includes the expected utility of avoiding informal third-party sanctions. This preserves the Lewisian structure while accommodating the reality of norms like queueing, where the "glare" is part of the payoff matrix.

  This approach respects Lewis's framework while honestly addressing the empirical reality of the norms you are studying.
