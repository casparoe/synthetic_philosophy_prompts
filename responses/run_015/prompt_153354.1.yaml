      *   *Key Distinction:* Coordination (I want to do what you do) vs. Cooperation (I want to defect, but you stop me). Queueing is often cooperation (I want to be first, but we agree to wait).
      *   *Solution:* Suggest that the user is actually describing *Social Norms* (in the sense of Bicchieri or Elster) rather than strict Lewisian *Conventions*. However, to keep their project viable, show how to amend Lewis to accommodate "Normative Expectations."
