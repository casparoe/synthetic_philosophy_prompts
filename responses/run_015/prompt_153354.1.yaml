      *   **Addressing the Insertion Point:** Don't add a *seventh* condition. Instead, modify Condition 4 (Conditional Preference). In Lewis, the payoff comes from coordination. In the user's cases, the payoff comes from coordination *minus* sanction costs.
      *   **Addressing the Emergence Claim:** Sanctions don't usually explain the *start* (chicken-and-egg problem: who punishes the first deviator before the norm exists?). They explain *persistence* against temptation.
      *   **Addressing Overgeneration:** The colleague is partially right. If sanctions are the *sole* reason, it's not a Lewisian convention; it's coercion. The "Arbitrariness" condition (Condition 5) is the safeguard here. The sanction must support an *arbitrary* equilibrium, not just any order.
      *   **Recommendation:** Distinguish between "Lewisian Conventions" and "Social Norms." Or, adopt a hybrid view (like Bicchieri's) where sanctions transform a preference structure.
