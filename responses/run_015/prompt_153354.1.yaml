      *   Emergence: Sanctions rarely start the process; they stabilize it. The "snowball" usually starts with focal points or precedent, *then* sanctions kick in to prevent erosion.

  10. (Self-Correction during drafting): Make sure to explicitly answer "Which condition should it extend?" and "Where exactly should I insert it?"
