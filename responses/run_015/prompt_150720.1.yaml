prompt: |-
  I'm putting together a long read on presentism in historiography — whether historians can ever escape judging the past by today's standards, and if not, what that actually means for the craft. Before I dive in, I want a proper spec sheet: write the desiderata any adequate theory of historical presentism has to meet.

  What phenomena must it explain? Think about hard cases like applying modern bioethics to medieval plague quarantines, or describing pre-modern gender relations using categories that didn't exist then. Which distinctions must it preserve — moral presentism versus conceptual presentism, say? Which results must it stay consistent with — for instance, that every archive is catalogued with present-day metadata, so total escape from current categories is structurally impossible? Flag what's non-negotiable and what's just camp preference. If any two demands turn out to be jointly unsatisfiable given standard arguments about anachronism, say so — that's the bit I care about most.

  Then briefly score the usual contenders: the hard anti-presentists, the contextualists, and those who think presentism is unavoidable and should be embraced critically. How do they do against your list?

  Write it in British English please — my editors fussy about that. Aplogies for any typos in this brief.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Presentism in historiography (judging the past by today's standards).
      *   **Task:** Create a "spec sheet" (desiderata) for an adequate theory of historical presentism.
      *   **Key Requirements:**
          *   Identify phenomena to explain (hard cases: bioethics/plague, gender categories).
          *   Identify distinctions to preserve (moral vs. conceptual presentism).
          *   Identify consistency constraints (archival metadata, structural impossibility of total escape).
          *   Flag non-negotiables vs. "camp preferences."
          *   Identify potential incompatibilities (jointly unsatisfiable demands).
          *   Score standard contenders (hard anti-presentists, contextualists, critical presentists).
          *   **Tone/Style:** British English (editors are fussy).
          *   **Format:** Structured, analytical, suitable for a "long read" preparation.

  2.  **Deconstruct "Presentism":**
      *   What is it? The imposition of present-day values, concepts, or perspectives onto the past.
      *   Why is it controversial? It risks distortion (anachronism) but is arguably inevitable (we are in the present).
      *   Key distinctions:
          *   *Moral Presentism:* Judging past actors by current ethical standards (e.g., slavery, colonialism).
          *   *Conceptual Presentism:* Using current categories to describe past realities (e.g., "homosexuality" in ancient Greece, "mental illness" in the Middle Ages).

  3.  **Drafting the Desiderata (The Spec Sheet):**
      *   *Phenomena to Explain:*
          *   The "Whig History" trap (teleology).
          *   The "Cultural Translation" problem (concepts that don't map 1:1).
          *   The "Archival Bias" (metadata, cataloguing).
          *   The "Moral Responsibility" tension (do we exonerate racists because "it was the times"?).
      *   *Distinctions to Preserve:*
          *   Moral vs. Conceptual (crucial).
          *   Intentional vs. Structural presentism (doing it on purpose vs. being unable not to).
      *   *Consistency Constraints:*
          *   We write in present language.
          *   We select sources based on present questions.
          *   Total objectivity is impossible.
      *   *Non-negotiables:*
          *   Must acknowledge the historian's situatedness.
          *   Must allow for historical difference (alterity).
      *   *Incompatibilities:*
          *   The "View from Nowhere" vs. "Ethical Accountability." You can't fully contextualise *and* fully judge simultaneously without tension.

  4.  **Scoring the Contenders:**
      *   *Hard Anti-Presentists (e.g., strict Contextualists):* Good at preserving alterity, bad at explaining why history matters now. Fail the "Archival Bias" constraint.
      *   *Contextualists (The Cambridge School, Skinner):* Nuanced, but often retreat from moral judgment. Struggle with the "Moral Responsibility" phenomenon.
      *   *Critical Presentists (e.g., Marxists, Post-colonialists, Presentist Pragmatists):* Embrace the bias. Good on ethics, risk distorting the past (caricature).

  5.  **Refining for British English:**
      *   Spelling: *catalogue* (not catalog), *judgement* (often with the 'e' in formal contexts, though 'judgment' is common in law, stick to standard Oxford spelling), *analyse*, *centre*, *fussy* (already in prompt), *apologies* (correcting the prompt's typo implicitly).
      *   Vocabulary: *Historiography*, *anachronism*, *alterity*, *normative*, *epistemic*.
      *   Tone: Academic but accessible, rigorous, slightly dry but engaging.

  6.  **Addressing the "Jointly Unsatisfiable" Requirement:**
      *   This is the core intellectual challenge.
      *   *Conflict:* The demand for *Radical Alterity* (the past is a foreign country) vs. The demand for *Moral Continuity* (human rights are universal).
      *   If the past is truly different, our morals don't apply. If our morals apply, the past isn't truly different in the relevant sense.
      *   Also: *Epistemic Humility* vs. *Political Utility*.

  7.  **Drafting the Content (Iterative Process):**

      *   *Intro:* Set the stage. Acknowledge the brief.
      *   *Section 1: The Desiderata.* Break down into Phenomena, Distinctions, Constraints.
      *   *Section 2: The Hard Constraints (Non-negotiables).*
      *   *Section 3: The Incompatibility Clause.* (Crucial part).
      *   *Section 4: Scoring the Contenders.*
      *   *Conclusion:* Summary advice for the long read.

      *(Self-Correction during drafting)*: Make sure I don't just list things but explain *why* they are desiderata. Ensure the distinction between *moral* and *conceptual* presentism is sharp. Ensure the "archival metadata" point is included as requested.

      *(British English Check)*: "Catalogue" not "catalog". "Analyse" not "analyze". "Centre" not "center". "Programme" (if used). "Defence" not "defense". Ensure spelling of "historiography" is correct.

      *(Reviewing the Prompt's Typos)*: The prompt says "Aplogies". I should not replicate that, but write correctly.

  8.  **Final Polish:** Check against the specific examples in the prompt (bioethics/plague, gender relations). Ensure the scoring is fair but critical.

      *(Thought on the Incompatibility)*: The tension between *Understanding* (Verstehen) and *Judging*. If you understand the context perfectly, judgment seems external. If you judge, you imply a standard outside that context. This is the "Contextualist Paradox."

  9.  **Final Output Generation** (incorporating all above).

      *Wait, one more check:* The prompt asks for "British English please — my editors fussy about that." I need to be meticulous. *Judgement* vs *Judgment*: In general non-legal British English, *judgement* is preferred. *Catalogue* is definitely a verb/noun distinction (noun can be catalog, but catalogue is safer for British). *Analyse*. *Centre*. *Defence*.

      *Structure:*
