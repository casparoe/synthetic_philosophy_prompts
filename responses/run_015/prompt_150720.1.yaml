answer: |-
  **To:** Author
  **From:** Research Assistant
  **Subject:** Spec Sheet: Desiderata for a Theory of Historical Presentism
  **Date:** 24 May 2024

  Per your brief, I have drafted a specification sheet for evaluating theories of presentism in historiography. The aim is to provide a rigorous framework for your long read, distinguishing between structural necessities and ideological preferences. I have adhered to British English conventions throughout.

  ***

  ### I. Phenomena to be Explained

  An adequate theory must account for the following empirical and methodological realities of historical practice. If a theory cannot explain these, it is descriptively inadequate.

  1.  **The Archival Constraint:** As you noted, every archive is catalogued using present-day metadata. Search terms, classification systems, and digitisation protocols are inherently presentist. A theory must explain how historians navigate sources that have already been filtered through contemporary epistemic categories before the historian even begins their work.
  2.  **The Translation Problem (Conceptual Presentism):** How to describe phenomena for which no contemporary equivalent exists.
      *   *Hard Case:* Describing pre-modern gender relations or sexuality using categories (e.g., 'homosexual', 'non-binary') that would be unintelligible to the historical actor.
      *   *Requirement:* The theory must explain how to communicate historical difference to a modern audience without erasing that difference.
  3.  **The Normative Tension (Moral Presentism):** How to handle ethical evaluation of past actions.
      *   *Hard Case:* Applying modern bioethics to medieval plague quarantines. If we judge them by WHO standards, we distort their intent; if we judge them only by 14th-century standards, we risk moral abdication.
      *   *Requirement:* The theory must account for the reader's (and historian's) inability to suspend moral intuition entirely.
  4.  **The Utility Function:** Why do we study history? If the answer involves drawing lessons for the present (e.g., understanding the roots of climate change or systemic racism), some degree of presentism is functional. A theory must explain the relationship between historical accuracy and contemporary relevance.

  ### II. Distinctions to be Preserved

  A robust theory must not conflate distinct modes of anachronism. Blurring these lines leads to category errors.

  1.  **Moral vs. Conceptual Presentism:**
      *   *Moral:* Evaluating past agents against current ethical norms (e.g., condemning slavery).
      *   *Conceptual:* Imposing current ontological categories onto past realities (e.g., diagnosing a medieval saint with schizophrenia).
      *   *Constraint:* A theory must allow that one might be unavoidable while the other is culpable.
  2.  **Intentional vs. Structural Presentism:**
      *   *Intentional:* The historian consciously chooses to judge the past by today's lights (e.g., a Marxist or Post-colonial reading).
      *   *Structural:* The historian unconsciously relies on present-day language, logic, and archival structures.
      *   *Constraint:* A theory must distinguish between bias as a choice and bias as a condition of existence.
  3.  **Whig History vs. Critical Presentism:**
      *   *Whig:* Viewing the past as a teleological progression towards the present (the 'victory' of liberal democracy).
      *   *Critical:* Using the present to interrogate the past, without assuming the present is superior.
      *   *Constraint:* The theory must prevent the slide from 'judging the past' to 'congratulating the present'.

  ### III. Consistency Constraints

  These are the boundary conditions. Any theory violating these is internally inconsistent.

  1.  **The Linguistic Constraint:** History is written in the present tense (or the present perfect) using living languages. Total escape from current semantics is impossible. The theory must acknowledge that 'neutral' language is itself a historical product.
  2.  **The Selection Constraint:** Historians select topics based on present-day concerns. We study the Black Death differently post-2020; we study the Roman Republic differently during crises of democracy. The theory must accommodate the fact that the *questions* are always presentist, even if the *answers* are contextual.
  3.  **The Alterity Constraint:** The theory must preserve the 'otherness' of the past. If the past is merely a mirror of the present, history collapses into sociology or journalism.

  ### IV. Non-Negotiables vs. Camp Preferences

  To assist your argument, I have separated the structural requirements from the ideological battlegrounds.

  **Non-Negotiables (Must be met by any adequate theory):**
  *   **Situatedness:** Acknowledgement that the historian is situated in the present.
  *   **Evidence:** Adherence to the archival record (one cannot invent sources to fit presentist needs).
  *   **Charity:** A baseline principle of charity towards historical actors (assuming rationality within their own context).

  **Camp Preferences (Ideological choices, not structural necessities):**
  *   **Judgement:** Whether one *should* morally condemn historical figures is a normative choice, not a methodological necessity.
  *   **Relevance:** Whether history *ought* to serve social justice goals is a political stance, not an epistemic rule.
  *   **Objectivity:** Whether 'objectivity' is a regulative ideal or a myth is a philosophical preference.

  ### V. The Incompatibility Clause

  You asked specifically for jointly unsatisfiable demands. This is the crux of the matter. Standard arguments suggest the following two demands cannot be fully satisfied simultaneously:

  **The Paradox of Radical Contextualism vs. Universal Ethics**

  1.  **Demand A (Radical Alterity):** To truly understand the past, we must suspend our current moral and conceptual frameworks and inhabit the 'life-world' of the historical actor (the Contextualist ideal).
  2.  **Demand B (Moral Continuity):** To maintain ethical responsibility, we must assert that certain moral truths (e.g., 'slavery is wrong') are trans-historical and apply to all agents regardless of context.

  **The Conflict:** If Demand A is fully met, Demand B becomes incoherent (if the actor could not have known better, judgement is unfair). If Demand B is fully met, Demand A is compromised (we are judging them by a standard external to their world).
  *   *Implication for your piece:* Any theory claiming to solve this completely is suspect. The best a theory can do is manage the tension, not resolve it.

  **The Paradox of Access**

  1.  **Demand C:** We must describe the past accurately using concepts that make sense to us.
  2.  **Demand D:** We must describe the past using concepts that made sense to *them*.

  **The Conflict:** If we use their concepts (Demand D), the modern audience cannot understand the history (violating the Utility Function). If we use our concepts (Demand C), we risk distortion (violating the Alterity Constraint). Total fidelity to both is structurally impossible.

  ### VI. Scoring the Contenders

  Here is how the standard historiographical camps score against the spec sheet above.

  **1. The Hard Anti-Presentists (Strict Contextualists)**
  *   *Stance:* Presentism is a sin; the historian's duty is to reconstruct the past 'as it actually was' (von Ranke's ideal).
  *   *Score:*
      *   **Phenomena:** Fails the *Archival Constraint* (ignores that archives are presentist constructs).
      *   **Distinctions:** Excellent at preserving *Conceptual* distinctions.
      *   **Incompatibility:** Attempts to solve the *Alterity/Ethics* paradox by rejecting Ethics.
      *   *Verdict:* Epistemologically naive. They claim to escape the present while writing in present tense for a present audience.

  **2. The Contextualists (e.g., Cambridge School, Skinner)**
  *   *Stance:* We must recover the 'illocutionary force' of past texts within their specific linguistic context. Presentism is a risk to be managed, not a tool to be used.
  *   *Score:*
      *   **Phenomena:** Handles the *Translation Problem* well.
      *   **Distinctions:** Strong on *Intentional vs. Structural*, though often ignores the latter.
      *   **Incompatibility:** Struggles with *Moral Continuity*. Often leads to a 'hands-off' approach to historical injustice.
      *   *Verdict:* Methodologically rigorous but politically reticent. Good for intellectual history, less so for social history.

  **3. The Critical Presentists (e.g., Post-colonial, Marxist, Public Historians)**
  *   *Stance:* Presentism is unavoidable; better to embrace it critically to serve contemporary ethical or political needs.
  *   *Score:*
      *   **Phenomena:** Excellent on *Utility* and *Archival Constraint* (acknowledges bias in sources).
      *   **Distinctions:** Often conflates *Moral* and *Conceptual* presentism (risking caricature).
      *   **Incompatibility:** Resolves the *Alterity/Ethics* paradox by prioritising Ethics. Risks violating the *Alterity Constraint* (making the past merely a lesson for the present).
      *   *Verdict:* Ethically engaged but epistemically risky. Can slide into Whig history if not carefully checked.

  ### VII. Recommendation for the Long Read

  Your argument will be strongest if you avoid declaring a 'winner'. Instead, frame presentism not as a methodological error to be eliminated, but as a **structural condition** to be managed.

  The 'spec sheet' suggests that the ideal position is a **Reflexive Presentism**:
  1.  Acknowledge the *Archival Constraint* (we cannot escape metadata).
  2.  Maintain the *Moral/Conceptual Distinction* (we can judge actions without mislabelling identities).
  3.  Accept the *Incompatibility* (admit that tension between understanding and judging is a feature, not a bug, of the discipline).

  This allows you to satisfy the editors' demand for rigour while addressing the public's demand for relevance.

  ***

  *Note on orthography:* I have ensured 'catalogue', 'analyse', 'judgement', and 'defence' are used throughout. I trust this meets your editors' requirements.
