  Features to exaggerate: The infinite regress of self-creation (choosing to choose), the impossibility of being *causa sui*, and the reduction of all effort to constitutive luck. I will treat the regress not as a philosophical puzzle but as a bureaucratic hurdle.
  Moves to avoid: Attributing the argument solely to determinism (Strawson insists it holds even if indeterminism is true); suggesting we abolish all punishment (forward-looking justification remains); and breaking character to assure readers this is satire (the irony must remain sustained and dry). The humor must arise from the administrative burden of implementing metaphysical impossibility.

  ***

  **The Causa Nulli Column**
  *Inaugural Installment*

  Following the Senate's ratification of the Basic Argument, this office addresses practical queries regarding agency. Please note: appeals based on ultimate moral responsibility will be returned unread.

  **Dear Columnist,**
  My nine-year-old lied about her homework. I know she isn't ultimately responsible for her constitution, but if I don't punish her, she'll lie again. Do I ground her for retribution or utility? I need to know what message I'm sending about her soul.
  — *Concerned Parent*

  **Dear Concerned,**
  You are sending no message about her soul, as she possesses no authorship over it. She acts according to her nature, which she did not choose. However, you may still intervene causally. Grounding is permissible strictly as a behavioral modifier, not a moral correction. Please file Form 88-B (Non-Originator Status) with the Dean of Students to document that this discipline is merely environmental adjustment. You are not blaming her; you are altering her incentives. Treat the child as a system to be tuned, not a sinner to be saved. The message is purely mechanical.

  **Dear Columnist,**
  I spent two years training myself to be calmer and more generous. I fought my impulses daily. Now the Senate says I'm not responsible. Can I at least take credit for the effort? It feels like mine.
  — *Reformed Soul*

  **Dear Reformed,**
  The feeling of ownership is noted but metaphysically invalid. To take credit, you would need to be responsible for the nature that enabled the training. You chose to train, but you did not choose the desire to train. That desire arose from prior causes you did not originate. If you claim credit, you claim to be *causa sui*. The University cannot recognize self-creation. Your improvement is fortunate, like good digestion, but not meritorious. Enjoy the calmness, but do not list it under "Achievements" on your annual review. It is a change in state, not an act of will.

  **Dear Columnist,**
  I'm a libertarian. I believe my choices are indeterministic. I quit smoking; my brother didn't. Since my choice wasn't determined, isn't that real freedom? Can I be proud?
  — *Free Agent*

  **Dear Free Agent,**
  Indeterminism does not rescue authorship. If your choice was undetermined, it was random. Randomness is not control. To be proud, you must have caused the choice, but you cannot cause a choice without a reason, which you did not choose. As with the previous correspondent, you did not choose the nature that favored quitting. Whether determined or random, the source of the action lies outside your ultimate control. You are lucky to be a quitter, not praiseworthy. Please submit a Luck-Adjusted Merit Scale (LAMS) disclosure if seeking promotion based on this health change.

  **Dear Columnist,**
  I'm hiring. Candidate A is reliably kind. Candidate B overcame a wretched upbringing to be decent. Can I prefer B for the effort involved? It seems fair to reward the struggle.
  — *Department Chair*

  **Dear Chair,**
  Fairness regarding effort is impossible under current Senate rulings. Candidate B's capacity to overcome was itself unchosen; Candidate A's kindness was equally unchosen. Both are products of constitution and circumstance. Rewarding effort implies the effort was freely authored, which regresses infinitely. You must hire based on predicted future performance, not past struggle. Use the LAMS to normalize the luck differential, but do not cite "grit" as a virtue. Grit is merely a lucky trait. Select the candidate who will best serve the department, acknowledging that neither deserves the job in any ultimate sense.

  ***

  The column argues that while ultimate responsibility is impossible, practical management must continue via forward-looking interventions.
  \answer{forward-looking consequences}
