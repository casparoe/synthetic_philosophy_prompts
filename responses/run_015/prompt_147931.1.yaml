  9.  (Final check of the "Rabbit Caveat"): "Keeping more rabbits alive is only clearly a gain if a rabbit's life is on the whole a good one, and that nobody is in a position to say whether it is." -> This implies that *increasing* population is only justified if Life > 0. Since we don't know, increasing population is unjustified. This is the **Precautionary Principle applied to Population Ethics**.

      *   *Marsh:* Increases population. -> Unjustified unless proven Life > 0.
