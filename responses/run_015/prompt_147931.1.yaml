      *   **Past Verdicts:**
          1.  *Invasive Rat Eradication:* Strongly **For**. Reason: Fewer rats alive afterwards (welfare gain?) + chicks saved.
          2.  *Housing Development (Scrub Clearing):* Strongly **Against**. Reason: Animals dying/displaced during clearing (suffering), not habitat loss per se.
          3.  *Deer Immunocontraception:* Cautiously **For**. (Implies reducing population growth without immediate killing).
          4.  *Rabbit Vaccination:* **For** (with caveat). Caveat: Keeping rabbits alive is only a gain if life is net positive; unsure if it is.
      *   **Current Proposal (The Marsh):** Breach tiles, re-flood 300ha retired pasture.
          *   *Outcome:* Large increase in abundance of short-lived, high-fecundity animals (frogs, insects, rodents, etc.). High juvenile mortality. Better shelter/food for survivors.
          *   *Process:* Phased, timed to minimize construction death.
          *   *User's Fear:* She might oppose it because it increases wild animal numbers (suffering-focused view).
      *   **Comparison Proposal (The Solar Array):** Adjacent parcel, retired farmland to solar.
          *   *Outcome:* Permanent reduction in animal capacity. Graded/graveled/fenced. Displaces rather than kills most.
      *   **Questions to Answer:**
          1.  What rule/family of rules fits her four verdicts?
          2.  What does each rule predict about the Marsh?
          3.  Is she committed to reducing numbers (negative utilitarianism?) or improving quality of life?
          4.  Is the third possibility (epistemic caution) viable?
          5.  Are the Scrub and Rat verdicts consistent?
          6.  Does her position cohere if she doubts life is worth living?
          7.  Would she welcome the Solar Array? Does this case separate the rules better?
          8.  What evidence would settle the question for her?

  2.  **Analyze the Ethical Frameworks (The "Rules"):**

      *   *Verdict 1 (Rats):* Pro-eradication. Justification includes "fewer rats alive." This suggests a **Negative Utilitarian** or **Suffering-Focused** view. If wild lives are net negative (suffering > pleasure), fewer lives = less suffering.
      *   *Verdict 2 (Scrub/Housing):* Anti-clearing. Justification is death/injury during clearing. This suggests a **Rights-Based** or **Harm-Minimization** view regarding *existing* individuals. It prioritizes the welfare of current occupants over potential future occupants or habitat metrics.
      *   *Verdict 3 (Deer):* Pro-contraception. Reduces population growth without killing. Aligns with Suffering-Focused (fewer deer born into potential suffering) and Harm-Minimization (no killing).
      *   *Verdict 4 (Rabbits):* Pro-vaccine *but* skeptical about net value of life. This is the key. It reveals **Axiological Uncertainty**. She doesn't know if $Life > 0$ or $Life < 0$.

      *   *Candidate Rules:*
          *   **Rule A: Suffering-Focused Negative Utilitarianism (SFNU).** Wild lives are net negative. Goal: Minimize total suffering. Reducing population is good. Preventing painful death is good.
          *   **Rule B: Individual-Centric Harm Minimization.** Focus on specific, identifiable individuals. Do not kill/harm existing animals. Future animals don't count as much.
          *   **Rule C: Epistemic Precaution.** If we can't calculate net welfare, don't intervene to change population size, *unless* preventing immediate severe suffering (like clearing).
          *   **Rule D: Quality of Life (QoL) Maximization.** If life is net positive, more is better. If net negative, less is better. (She seems unsure here).

  3.  **Evaluate Consistency (Scrub vs. Rats):**

      *   *Rats:* Kill existing rats to save chicks + reduce future rat suffering.
      *   *Scrub:* Don't kill existing scrub animals to build houses.
      *   *Tension:* Why kill rats but not scrub animals?
      *   *Resolution:* Invasive vs. Native? Or Ecological Function?
      *   *Her specific reasoning:* Rats = "fewer rats alive afterwards." Scrub = "animals already living... would die."
      *   *Consistency Check:* If she is a pure Negative Utilitarian, she should favor killing the scrub animals too if it reduces long-term carrying capacity (housing = fewer animals long term). But she opposed it. This suggests she weights **existing individuals** heavier than **potential future individuals**. Or, she views the housing development as creating *human* suffering/demand that drives the clearing, whereas rat eradication is a closed ecological loop.
      *   *More likely:* She distinguishes between *active killing for management* (Rats: acceptable if it reduces total suffering significantly) vs. *collateral damage for human development* (Scrub: unacceptable because the human gain doesn't justify the animal harm, and the habitat loss isn't the primary moral weight).
      *   *Actually, looking closer:* She opposed housing *because* of the death/displacement. She supported rat eradication *because* of fewer rats alive. This implies she is willing to kill *if* the net result is fewer animals living (assuming lives are net negative) BUT she is unwilling to kill if the purpose is human development where the animal death is a side effect.
      *   *Wait, the Housing verdict:* "Substance... almost entirely about how the animals already living on the site would die." This sounds like a **Status Quo Bias regarding Existing Individuals**.
      *   *The Rat verdict:* "As much about there being fewer rats alive afterwards." This sounds like **Population Ethics**.
      *   *Consistency:* These are hard to reconcile unless she distinguishes between *invasive* (no right to be there) and *native* (right to be there), OR she distinguishes between *management for welfare* vs. *development for humans*. Given the "wild-animal-welfare researcher" label, the Invasive/Native distinction is less likely to be the *moral* crux than the Welfare crux.
      *   *Hypothesis:* She believes wild lives are likely net negative (hence rat eradication good), BUT she believes killing existing animals is a high cost that requires high justification (hence scrub clearing bad). Rat eradication justifies killing because it prevents *massive* future suffering (rats eating chicks + rat overpopulation). Housing clearing kills animals for *human houses*, which doesn't offset the welfare loss.
      *   *Refined Hypothesis:* She is a **Suffering-Focused Utilitarian with a Strong Constraint on Killing Existing Individuals**, unless the intervention is specifically designed to reduce long-term suffering (like contraception or eradication of high-suffering invasives).

  4.  **Analyze the Marsh Proposal:**

      *   *Action:* Rewet pasture.
      *   *Effect:* Massive increase in biomass/numbers of short-lived animals.
      *   *Her likely view:*
          *   If she thinks wild lives are net negative (Rat verdict hint): She will **Oppose**. More animals = more suffering.
          *   If she thinks existing individuals matter most (Scrub verdict hint): She might be **Neutral/Cautious**. Construction kills few. Existing pasture animals displaced?
          *   If she is Epistemically Cautious (Rabbit caveat): She will **Oppose or Demand Proof**. "Nobody is in a position to say whether [a rabbit's life] is [good]." If we can't say it's good, multiplying them is risky.
      *   *Prediction:* She will likely be **Skeptical/Opposed**. The "high fecundity, high juvenile mortality" description is a red flag for welfare researchers (r-selection strategy usually implies high suffering).

  5.  **Analyze the Solar Array Proposal:**

      *   *Action:* Grade, gravel, fence.
      *   *Effect:* Permanent reduction in carrying capacity. Displacement rather than killing.
      *   *Her likely view:*
          *   If Suffering-Focused (Lives < 0): **Support**. Fewer animals born into suffering.
          *   If Existing Individual Focus: **Support** (mostly). Displacement is better than killing.
          *   If Epistemic Caution: **Support**. Reduces uncertainty by reducing the number of subjects at risk.
      *   *Diagnostic Value:* This is a *better* test case than the Marsh. The Marsh increases numbers (ambiguous welfare). The Solar decreases numbers (clear welfare gain *if* lives are net negative). If she supports Solar, she confirms the "Fewer Animals = Good" heuristic. If she opposes Solar (e.g., because of displacement stress), she is more focused on immediate harm than population ethics.

  6.  **Address the Specific Questions:**

      *   *Rule Family:* Suffering-Focused Wild Animal Welfare (SFWAW), specifically leaning towards Negative Utilitarianism but constrained by harm-to-existing-individuals.
      *   *Marsh Prediction:* Likely opposition or heavy caveats. The "r-selected" nature of the new ecosystem is the problem.
      *   *Number vs. Quality:* The Rat and Rabbit verdicts suggest she worries about Numbers (assuming negative value). The Scrub verdict suggests she worries about Quality of Death for existing animals.
      *   *Consistency:* Scrub and Rats are consistent *if* the goal of rat eradication is welfare-centric, while housing is human-centric. Or if invasives have no claim.
      *   *Coherence:* Yes, it coheres under "Expected Suffering Minimization." If $E[Value] \approx 0$ or $<0$, increasing $N$ is bad.
      *   *Solar Verdict:* She would likely welcome it more than the Marsh. It separates the rules because it reduces $N$ without high immediate mortality.
      *   *Evidence Needed:* She needs data on *net welfare per individual*, not just population counts. Mortality causes, duration of suffering, baseline welfare of the pasture vs. the marsh.

  7.  **Drafting the Response:**

      *   *Structure:*
          1.  Identify the Ethical Framework (The "Rule").
          2.  Analyze Consistency (Rats vs. Scrub).
          3.  Predict the Marsh Verdict.
          4.  Analyze the Solar Array (The Crucial Test).
          5.  Evidence Requirements.
      *   *Tone:* Analytical, respectful of the nuance, helpful for a board member.
      *   *Key Insight:* The "Rabbit Caveat" is the Rosetta Stone. It admits axiological uncertainty. The "Rat Verdict" reveals the default assumption under uncertainty (fewer is safer). The "Scrub Verdict" reveals a constraint on *means* (don't kill existing natives for human gain).

      *(Self-Correction during drafting)*: I need to be careful not to caricature her as a "misanthrope" or "anti-nature." Her position is a specific, growing field in effective altruism/wild animal welfare. It's about *sentient welfare*, not *biodiversity*.
      *Refining the Solar prediction:* Would she support solar? Solar implies habitat *destruction*. A conservationist hates that. A welfare-focused researcher might like it if it reduces wild animal suffering. This is the key divergence. If she supports Solar on welfare grounds, she confirms the "Lives are Net Negative" hypothesis.

      *Refining the Marsh prediction:* The Marsh creates *more* animals. If lives are net negative, this is bad. If lives are net positive, this is good. Since she said "nobody is in a position to say," she likely operates under a precautionary principle: Don't multiply subjects if value is unknown/likely negative.

      *Refining the Evidence:* She won't be swayed by "more biodiversity." She needs "less suffering per capita." How do you measure that? You can't easily. So she might default to "don't do it." To persuade her, you need to show the *alternative* (pasture) is worse. Do cows suffer more than frogs? (Likely yes, for the cows). But the pasture is "retired." So it's wild rodents vs. wetland frogs.

  8.  **Final Polish:** Ensure all parts of the prompt are answered.
      *   Rule family? (Suffering-focused, prioritarian regarding existing individuals).
      *   Marsh prediction? (Skeptical/Opposed).
      *   Number vs. Quality? (Both, but Number dominates under uncertainty).
