      *   *Misfire explained?* Yes.

  8.  **Final Polish:** Ensure the tone matches a senior risk manager talking to analysts. Not too academic, not too dumb. Acknowledge the friction between theory and the need to write policies. (Self-Correction: Make sure I explicitly highlight the "judgment call" sections visually or textually).

  9.  **Final Check on "Unwanted Answer":** The prompt says "Include at least one case where the procedure gives an answer I won't like." In Case 2, the procedure says "Escalate." As a manager, I might *want* to just average them and move on to keep the deal alive. Escalation means friction. I will emphasize this tension.

  10. **Final Check on "Misfire":** The prompt asks to "say plainly where the procedure will misfire." I need a dedicated section for this. Aumann fails when agents aren't truth-seeking (political maneuvering) or when the "prior" is actually unarticulated model structure.

  11. **Drafting the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The "Aumann Audit": A Protocol for Resolving Probability Disagreements

  **To:** Risk Analytics & Underwriting Teams
  **From:** Head of Disagreement Reviews
  **Subject:** Operationalizing Disagreement (The Afternoon Protocol)

  We are adopting a modified framework based on Aumann's Agreement Theorem to handle material probability divergences. The theory states that two rational agents with common priors cannot agree to disagree once they share information. In practice, you are not Bayesian robots, and our priors are rarely common. However, this distinction—**Information Gap vs. Prior Gap**—is the only binary that matters for escalation.

  If the gap is **Information**, we pool. If the gap is **Prior**, we escalate.

  Below is the procedure for your 3-hour afternoon workshops. Do not skip steps. Do not allow "trust me" as evidence.

  ---

  ## The Protocol (3-Hour Limit)

  ### Step 1: Semantic Alignment (15 Minutes)
  **Question:** "Define the event $E$ exactly. What constitutes a 'loss year' or a 'default'?"
  *   **Sufficient Answer:** Both teams write down the trigger conditions. They must match byte-for-byte (e.g., "Default" = missed payment + 30 days vs. "Default" = CDS spread > 500bps).
  *   **Termination:** If definitions differ, align them. Re-calculate. If the gap disappears, **POOL**. If the gap persists, proceed.
  *   **The Judgment Call:** Often, teams will fudge the definition to make the numbers look closer. You must enforce strict equivalence.

  ### Step 2: The Data Inventory (45 Minutes)
  **Question:** "List every dataset, feed, or observation used to generate your posterior. Can the other team access it?"
  *   **Sufficient Answer:** A shared directory path or a specific vendor report name. If Team A used WHO data and Team B used proprietary claims data, this is an asymmetry.
  *   **Termination:** If one team possesses data the other does not, this is an **Information Gap**.
      *   *Action:* Merge datasets. Re-run models. **POOL** the new output.
      *   *Stop here.* Do not proceed to Step 3 if data was missing.

  ### Step 3: The Processing Function (45 Minutes)
  **Question:** "Given the *same* data, what algorithm or heuristic converts it to a probability?"
  *   **Sufficient Answer:** "We used a Generalized Linear Model with X parameters" vs. "We used a heuristic based on 20 years of underwriting intuition."
  *   **Termination:** If the models are structurally different (e.g., frequency/severity vs. holistic judgment), identify the parameter causing the drift.
      *   *If the parameter is data-driven (e.g., decay rate of historical relevance):* Treat as **Information Gap**. **POOL** (use weighted average).
      *   *If the parameter is philosophical (e.g., "structural break in 2008"):* Proceed to Step 4.

  ### Step 4: The Residual Gap Interrogation (45 Minutes)
  **Question:** "We have shared the data (Step 2) and the model structure (Step 3). Why does your number remain different?"
  *   **Sufficient Answer:** This is where the mask slips. You are looking for phrases like "I don't trust that data source" or "My experience suggests this regime is different."
  *   **Termination:**
      *   If the answer is "I think their data is dirty" but cannot prove it: **POOL** (force the shared data).
      *   If the answer is "I believe the world works differently than your model assumes": **ESCALATE**. This is a **Prior Gap**.

  ### Step 5: The Prior Probe (30 Minutes)
  **Question:** "Is this disagreement about *this* risk, or about the stability of the system generating the risk?"
  *   **Sufficient Answer:** Admission of a worldview difference (e.g., "Ratings are lagging indicators" vs. "Ratings are mean-reverting").
  *   **Termination:** **ESCALATE**. This is not for analysts to resolve. This requires a Risk Committee decision on which "worldview" the firm is betting on for the fiscal year.

  ---

  ## The "Dressed Up" Judgment Calls
  *Be honest about where this checklist is theater.*

  1.  **Step 2 (Data Access):** Just because data *can* be shared doesn't mean it *will* be understood. If Team A gives Team B a raw SQL dump, Team B cannot process it in an afternoon. We call this "Information Symmetry," but it's often "Information Illiteracy." **Judgment:** You must decide if the data is truly digestible or if the asymmetry is functional.
  2.  **Step 4 (The "Why"):** Humans are terrible at introspecting their own priors. They will claim their intuition is "data" and the other guy's intuition is "bias." **Judgment:** You have to sniff out when "model parameter" is code for "gut feeling."
  3.  **Step 5 (Escalation):** Escalation is costly. It delays quotes. **Judgment:** Sometimes you will force a "Pool" decision on a Prior Gap just to keep the business moving, knowingly violating the protocol.

  ---

  ## Case Applications

  ### Case 1: Epidemiology (12%) vs. Cat Modeling (7%)
  **Context:** Pandemic loss year probability.
  **Protocol Run:**
  *   **Step 1:** Definitions match (WHO declaration + $Xbn industry loss).
  *   **Step 2:** **FAIL.** Epi team uses global pathogen surveillance data (proprietary subscription). Cat team uses historical insurance loss tables (public/legacy). Neither has the other's data.
  *   **Diagnosis:** **Information Gap.**
  *   **Verdict:** **POOL.**
  *   **Action:** Do not escalate. Merge the surveillance data into the Cat model inputs. Re-run. The gap should narrow significantly.
  *   **Outcome:** This is the "easy" win. The procedure works as intended.

  ### Case 2: Veteran Underwriters (8% vs. 25%)
  **Context:** Counterparty default within 5 years.
  **Protocol Run:**
  *   **Step 1:** Definitions match (S&P downgrade to D + missed coupon).
  *   **Step 2:** **PASS.** Both have access to the same credit reports, financial statements, and market signals. They sat in the same meetings.
  *   **Step 3:** **PASS.** Both use the firm's standard Credit Risk Model (CRM).
  *   **Step 4:** **FAIL.** Underwriter A (25%) says, "The CRM assumes ratings are mean-reverting. I think post-2008 regulations made ratings sticky and deceptive." Underwriter B (8%) says, "That's paranoia. The math holds."
  *   **Step 5:** **CONFIRMED.** Underwriter A has a different prior on the *validity of the credit rating framework itself*.
  *   **Diagnosis:** **Prior Gap.**
  *   **Verdict:** **ESCALATE.**
  *   **Action:** Send to Chief Risk Officer (CRO). The firm must decide: Are we pricing based on the CRM (Underwriter B) or the "Broken Market" hypothesis (Underwriter A)?
  *   **The Unwanted Answer:** I know you don't like this. Escalation means this deal sits on ice for a week while the CRO convenes a committee. We might lose the placement. The procedure demands escalation, but the business pressure demands a number *now*.
  *   **Why you won't like it:** The protocol correctly identifies that averaging 8% and 25% is mathematically incoherent if one party believes the measuring stick is broken. But operationally, "incoherent" is better than "no deal." The procedure forces you to choose integrity over speed.

  ---

  ## Where This Procedure Will Misfire

  You asked for plain speech on the limitations. Aumann's theorem assumes **Common Knowledge of Rationality**. In a reinsurance firm, that assumption is false.

  1.  **Incentive Asymmetry:** Aumann assumes agents want to find the truth. Your underwriters want to write premium (volume bonuses). Your risk team wants to reduce exposure (stability bonuses). They aren't disagreeing because of priors; they are disagreeing because their utility functions differ. The procedure will classify this as a "Prior Gap" and escalate, but the real fix is compensation alignment, not a risk committee.
  2.  **Model Risk as Priors:** In Step 3, we treat model structure as "processing." But often, choosing a model *is* the prior. If Team A uses a Fat-Tailed distribution and Team B uses a Normal distribution, the protocol asks you to "Pool." That is dangerous. Averaging a Normal and a Fat-Tail gives you a distribution that captures the risk of neither. The procedure misfires here by treating structural model risk as a simple information gap.
  3.  **The "Common Prior" Illusion:** The procedure assumes we *can* identify a prior difference. In Case 2, we could. But often, the prior is subconscious. An analyst might say "The data suggests X," when actually "My anxiety suggests X." The protocol will terminate at Step 4 with a "Pool" decision because they couldn't articulate the prior. You will have pooled two numbers that shouldn't be pooled, creating a false sense of precision.

  **Final Instruction:** Use this protocol to diagnose, not to dictate. If Step 5 says "Escalate," but the market is moving fast, you (the Head of Reviews) have the authority to override and Pool. But you must document that you are overriding the Aumann constraint, accepting the model risk explicitly.
