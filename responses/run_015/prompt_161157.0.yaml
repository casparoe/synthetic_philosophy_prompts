      *   *Conditional Credence (if fact exists): 0.68*

  *   **Historical Record (Data Quality): 0.85**
      *   European and East Asian records from 1750 are robust, but extrapolating to the Global South and pre-industrial Americas relies on archaeological proxies with wide error bars.

