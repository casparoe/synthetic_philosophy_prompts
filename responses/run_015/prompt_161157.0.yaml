  **Combination:**
  Strict multiplication of these independent confidences yields ~0.56. However, these uncertainties are correlated (e.g., poor records make baseline selection harder), so I apply a positive synthesis adjustment for the sheer magnitude of the observed drop in the data we *do* possess.
  **Calculated Credence:** $0.95 \text{ (Ontology)} \times 0.68 \text{ (Conditional)} \approx 0.65$.

  **Sensitivity Analysis:**
  The single term my number is most sensitive to is the **Historical Record (Data Quality)**. If the archaeological and anthropological extrapolations for 1750 Africa, the Americas, and Oceania are overestimates by a factor of two (perhaps due to survivorship bias in skeletal trauma), the global per capita average drops enough to threaten the 50% threshold. The one piece of evidence that would move me most is a comprehensive meta-analysis of pre-industrial skeletal trauma rates from the Global South comparable to the European parish record density.

  **Diagnosis of Your Friends:**
  The **0.9 person** is effectively ignoring the Category and Ontology terms; they are treating the Core Homicide/War data as synonymous with "violence" and assuming the fact of the matter is settled. The **0.25 person** is not disagreeing about the data (Core), but is assigning near-zero probability to the Ontology and Category terms; they believe the definition of violence is so interest-shaped that the trend is an artifact of counting state-approved killing as "order" and non-state killing as "violence." They are disagreeing about **whether the question has an answer** (Ontology) and **what counts as violence** (Category), not the raw homicide rates.

