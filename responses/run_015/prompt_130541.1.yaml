  Also, regarding "isolated valence fragments": This sounds like a specific philosophical position (perhaps akin to Carruthers' dispositionalism or a specific reading of GWT). I need to evaluate if it follows from (3). (3) says they *can* come apart. (5) says if they *do* come apart, moral status vanishes. That is a non-sequitur without further premise (e.g., "Suffering requires a subject"). I will highlight this gap.

