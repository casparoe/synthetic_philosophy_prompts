answer: |-
  Friends, colleagues, former students, and members of Dr. Voss's family: welcome.

  It is a profound privilege to open this colloquium. Looking around this room, I see the exact landscape Elena Voss spent her career trying to map. We have philosophers who speak in the language of concepts and logic. We have neuroscientists who speak in the language of synapses and signals. And we have family and friends who speak in the language of shared life, memory, and love. Elena insisted that these groups were not talking past one another. She insisted they were talking about the same reality, but that one of our most cherished tools for describing that reality was broken.

  We are here to honor a thinker who argued, for thirty years, that phenomenal consciousness is undeniably real, but that the theoretical posit we call "qualia" is structurally incoherent.

  For those in the room who are not philosophers, I want to be precise about what that means, because it is the heart of her legacy. It is common to hear that if a philosopher questions a concept, they are denying the experience itself. If I question the concept of "witchcraft," I am not denying that people suffered; I am denying that the explanation for their suffering involved magic. Elena's work was of this nature. She never denied that it hurts to stub a toe. She never denied that the taste of coffee is distinct from the taste of tea. She denied that these experiences are caused by private, mental objects—little sparks of feeling—that sit inside us, invisible to science and inaccessible to others.

  She called her strategy "quining" qualia. In the spirit of arguments developed by Chase and Sanborn, she sought to show that the concept itself cannot do the work we ask it to do.

  Why did she believe this? And why does it matter for how we remember her, and how we understand ourselves?

  Elena argued that the standard definition of qualia asks for a logical impossibility. We treat phenomenal properties as if they are utterly private. We say, "Only I can feel my pain." This makes the experience incomparable; you cannot have my pain. Yet, at the same time, we treat these properties as intersubjectively comparable. We say, "We are both feeling pain," or "That red looks the same to both of us." We want the experience to be locked in a private box, but we also want to compare the contents of our boxes and find them matching. Elena showed that you cannot have it both ways. If it is truly private in the way the theory demands, it cannot be compared. If it can be compared, it is not private in the way the theory demands. To insist on both is a category error. It is like asking, "What is the weight of a jealousy?" or "How many inches long is a Tuesday?" The question assumes a structure that the phenomenon does not possess.

  Furthermore, she identified a contradiction in how we think these properties act. In physical explanation, we tend to treat qualia as causally inert. The neurons fire, the muscles move; the "feeling" is just a passenger. Yet, in explaining behavior, we treat them as indispensable. "Why did you pull your hand away?" "Because it hurt." If the feeling didn't exist, the explanation fails. But if the feeling is non-physical, how does it push the physical body? Elena argued that we cling to this paradox because we are in love with a picture of the mind that does not fit the world we inhabit.

  Now, I must be careful here. There is a temptation to hear this and say, "So, she thought experience was an illusion." This is the misunderstanding she fought most vigorously against. To say the concept of qualia is incoherent is not to say that consciousness is a mirage. It is to say that consciousness is not a *thing* we have; it is a *way* we are.

  For the neuroscientists in the room, this was liberating. It meant you do not need to hunt for the "neural correlate of the qualia." You do not need to find the specific spark that makes red look red. Instead, you study the complex, discriminatory processes of the organism interacting with its environment. You study the real, physical mechanisms of awareness without needing to bridge a gap between "matter" and "magic." Elena cleared the ground so that you could build without looking for ghosts.

  For the philosophers and students, she demanded rigor. She taught us that clarity is a form of kindness. Confusing concepts lead to confused science and confused lives.

  But I want to speak specifically to the family members here, and to what this means for ordinary remembrance. There is a version of the "private mind" view that suggests we are all alone. If my pain is a private object locked in my inner theater, then I can never truly know your grief, and you can never truly know mine. We are isolated spectators watching our own private screens.

  Elena rejected this. By dissolving the idea of the private, incomparable qualia, she opened a door to a deeper connection. If experience is not a private object but a public, relational capacity, then our sharing of it is real. When we grieve Elena today, we are not merely having parallel, private sadities that happen to look similar. We are participating in a shared reality. The incoherence of qualia suggests that we are not as isolated as the old philosophy told us. We are woven into the same fabric of cause and effect, of behavior and response.

  This is the genuine philosophical work I ask us to do today. It is not enough to praise her intellect. We must engage with the move she made. We must accept that honoring her means letting go of a comforting fiction. It is comforting to think of our feelings as precious, private jewels that only we can hold. It is more difficult, but more true, to recognize that our feelings are patterns of engagement with a world we share.

  Her legacy is not a doctrine. It is a space. She cleared a space for an interdisciplinary study of consciousness that does not require reifying phenomenal properties, but also does not reduce consciousness to mere neural correlation. She left us a path where science does not have to explain away the human experience, and where human experience does not have to retreat from science.

  To honor a thinker whose central claim was that one of our most familiar concepts does not survive careful scrutiny is to accept the discomfort of that scrutiny in our own lives. It is to look at our own assumptions—about how we know each other, about what is real, about what it means to be conscious—and ask: Does this hold up? Or am I clinging to a picture because it is familiar?

  Elena Voss did not offer us a new dogma to replace the old one. She offered us a method of clearing. She swept away the conceptual debris so that we could see the floor beneath us. She showed us that we do not need the "inner light" to see each other. We do not need the "private theater" to have a drama. We have each other, and we have the world, and we have the capacity to respond to both.

  In that spirit, let this colloquium proceed. Let us not speak of her as if she were a spectator in a private box, listening from afar. Let us speak of her as she understood herself to be: present in the exchange, real in the argument, and alive in the work we continue together.

  Thank you.
