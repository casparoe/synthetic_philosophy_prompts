prompt: |-
  You're an expert in epistemology and the philosophy of the social sciences who also knows the forecasting literature well; before you answer, brainstorm out loud for a bit and explicitly reject at least two or three candidate concepts that don't quite make it — I want to see the carving, not just the winner.

  I'm taking a judgment-and-decision-making seminar this term (cross-listed with the policy school, mostly psych people) and a few weeks ago we did the inside view / outside view thing — the planning fallacy, look at the base rate for cases like yours instead of at the details of your own case, taking the outside view is the epistemically modest move, all that. I'm basically on board, but I keep noticing a pattern when I try to actually apply it, and I genuinely can't tell weather it's one thing with a name, three unrelated things, or nothing at all. First instance: my flatmate is writing a senior thesis; her chapter-by-chapter plan says six weeks, the realized base rate for theses like hers is more like nine, so she should defer to nine. But the base rate is a base rate *of plans being missed*, generated by people who built those plans bottom-up from the inside view. If everyone in her department took the outside view, everyone would write "nine weeks" on their timelines, and now almost nobody would be late — even if the actual writing took exactly as long as it always did. The correction looks like it fixed something, but part of what it fixed is the yardstick. Second instance: the base rate for first-year PhD students (or first-time founders) with an ambitious, slightly wild idea is brutal, so take the outside view and don't do it — except the handful of successes inside that brutal number were produced by people who conspicuously did *not* take the outside view, so the statistic I'm being humble in the face of was generated by a population selected for immodesty, and if we all became modest it would get even worse, which would then make modesty look even more clearly correct. Third, possibly separate: whenever I decide whether to apply the outside view at all, I end up using my inside-view sense of whether my case is special ("sure, most group projects go badly, but this one really is different") — which is exactly the move the outside view was supposed to cancel, just relocated one level down into the choice of reference class.

  So: does this have a name, and is it one phenomenon or several? It's not plain self-fulfilling prophecy, I think, because nobody's forecast is making the forecasted event happen — what shifts is the behaviour that produced the statistics the forecast was drawn from. And it isn't the boring point about correlations breaking down once a policy acts on them: there's no policy here and nobody is gaming a metric, it's individuals quietly revising their own confidence. If a few nearby concepts each capture part of it, tell me which covers which part and where each one breaks down; if there's really nothing established, coin a term, define it tightly, and give me a clear positive case plus a near miss that falls outside it. (Someone in my ethics tutorial muttered something about "self-effacing" norms when I described this, but I don't know if that's a real term of art or they were improvising, and either way they meant it about morality rather than forecasting — so say whether it carries over.) Please don't just hand me a list of names and papers to chase: I have no library access from where I'm writing this, so anything you lean on has to be explained in your own words. Last thing, and it's the bit I actually care about: if the pattern is real, is taking the outside view still the epistemically modest thing to do, or is it the kind of rule that only works when a minority follows it — does universal adoption of outside-view reasoning undermine the very base rates it depends on, and should I therefore be applying it selectively, and if so how would I decide when?
