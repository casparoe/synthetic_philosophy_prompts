answer: |-
  This is a sharp observation. You have identified a genuine instability in the mechanics of reference class forecasting (the "Outside View"). It is not merely a confusion; it is a structural feature of social epistemology that often gets glossed over in introductory behavioral econ.

  Per your request, I will start by brainstorming and explicitly carving away three candidate concepts that feel close but miss the mark. Then I will identify the concept that actually fits, address the "self-effacing" comment, and finally give you a normative framework for when to apply the rule.

  ### Part 1: The Carving (Rejecting Near-Misses)

  To find the right name, we have to rule out the ones that sound similar but describe different mechanisms.

  **Candidate 1: Goodhart's Law**
  *The Concept:* "When a measure becomes a target, it ceases to be a good measure." Usually applied to economics or management. If you reward teachers based on student test scores, teachers teach to the test, and scores no longer measure education quality.
  *Why it fits:* It captures the idea that using a statistic changes the statistic.
  *Why I reject it:* Goodhart's Law relies on *strategic gaming* or *perverse incentives*. In your thesis example, your flatmate isn't trying to "game" the base rate to look good; she is trying to be accurate. In the founder example, the founders aren't manipulating the success rate; they are being filtered by it. Goodhart implies a corruption of the metric through manipulation. Your examples describe a *honest adaptation* to the metric that renders it obsolete. It's not gaming; it's learning.

  **Candidate 2: The Lucas Critique**
  *The Concept:* From macroeconomics. You cannot predict the effect of a policy change based on historical correlations because the policy change itself alters the structural parameters of the economy (e.g., if the central bank prints money, people expect inflation, and the old relationship between money supply and unemployment breaks).
  *Why it fits:* It is exactly about how historical data fails when agents update their behavior based on that data.
  *Why I reject it:* The Lucas Critique is about *structural equations* in a *system*. It assumes agents have rational expectations and the system settles into a new equilibrium. Your problem is micro-epistemic: it's about an individual trying to form a justified belief *now*, given that the belief itself might change the future data. The Lucas Critique tells a policymaker "your model is wrong." You are asking "is my belief justified?" It's too macro and structural for the individual epistemic dilemma you're facing.

  **Candidate 3: Simple Self-Fulfilling Prophecy**
  *The Concept:* A false definition of a situation evokes new behavior which makes the originally false conception come true (e.g., a bank run: I believe the bank is insolvent, I withdraw money, the bank becomes insolvent).
  *Why it fits:* The forecast influences the outcome.
  *Why I reject it:* As you noted, this isn't quite it. In a self-fulfilling prophecy, the *prediction creates the reality*. In your thesis example, the writing still takes nine weeks. The *lateness* disappears, but the *duration* doesn't change. In the founder example, the prediction doesn't make the startups fail; it prevents them from launching. The mechanism isn't "belief makes event true"; it is "belief changes the reference class population or the planning behavior," which invalidates the historical statistic. It's a second-order effect on the *data generation process*, not a first-order effect on the *event*.

  ### Part 2: The Winner (and the "Self-Effacing" Connection)

  The tutorial mate who muttered "self-effacing" was reaching for a precise term of art in moral philosophy, and yes, it carries over to epistemology, though it is rarely discussed there under that name.

  **The Concept: Self-Effacing Epistemic Rules**
  In ethics (specifically in the work of Derek Parfit and James Dreier), a theory is "self-effacing" if it implies that you should not directly try to follow the theory to get the best results. For example, a utilitarian theory might conclude that the best way to maximize utility is for people to follow deontological rules (like "never lie") rather than calculating utility for every act. If you try to be a direct utilitarian, you get worse results.

  Your observation is that the Outside View functions as a **Self-Effacing Epistemic Rule**.
  *   **The Rule:** "To be accurate, ignore your specific details and defer to the base rate."
  *   **The Self-Effacement:** "If everyone follows this rule, the base rate changes, and the rule no longer yields accuracy (or yields different accuracy)."

  This unifies your three examples under one phenomenon, which we might call **Reference Class Instability**.

  1.  **The Thesis (Planning Fallacy):** The base rate of "9 weeks" is actually a measure of *Optimism Bias + Task Duration*. When you apply the Outside View, you correct the Optimism Bias. If everyone does this, the base rate becomes a measure of *Task Duration* only. The rule effaces the very bias it was designed to correct.
  2.  **The Founder (Selection Effect):** The base rate of "brutal failure" is a measure of *Task Difficulty + Overconfidence Filter*. The people who succeed are often the ones who ignored the base rate. If everyone follows the Outside View, the "Overconfidence Filter" tightens. Fewer people try. The ones who do try might be the ones who *still* ignore the view. The statistic becomes a measure of *Stubbornness*.
  3.  **The Reference Class (The Meta-Problem):** Deciding *which* base rate to use ("Am I a typical student or a special one?") requires an Inside View judgment. The rule requires you to use the very cognitive faculty it tells you to distrust to decide whether to apply the rule.

  ### Part 3: Normative Advice (What should you do?)

  You asked the crucial question: *Is taking the outside view still the epistemically modest thing to do, or does universal adoption undermine it?*

  **1. Is it still epistemically modest?**
  **Yes, for you, right now.** Epistemic modesty is about aligning your confidence with your actual reliability *in the current environment*. Currently, the environment is populated by people who suffer from the planning fallacy and overconfidence. Therefore, the base rate *is* the reliable predictor for you.
  The fact that universal adoption would change the environment does not invalidate the rule for a single agent in the current environment. It just means the rule is **context-sensitive**, not universal law.
  *Analogy:* It is modest to drive 30mph in a school zone. If everyone drove 30mph, the zone might be redesignated, or accidents might drop to zero, changing the statistics. But until that happens, driving 30mph is the modest/safe move.

  **2. Does universal adoption undermine the base rates?**
  **Yes.** This is the crux of Reference Class Instability. Base rates in social sciences are not like base rates in physics.
  *   **Physics Base Rate:** "Gravity causes objects to fall at 9.8m/s²." If everyone believes this, objects still fall at 9.8m/s². (Stable)
  *   **Social Base Rate:** "Students miss deadlines." If everyone believes this, students plan better, and deadlines are met. (Unstable)

  **3. Should you apply it selectively? How to decide?**
  You need a heuristic to distinguish between **Structural Constraints** and **Behavioral Regularities**.

  *   **Apply the Outside View Aggressively when:** The base rate is driven by structural constraints that your belief cannot change.
      *   *Example:* "How long does it take for a permit to be processed by the city bureaucracy?" Your confidence won't speed up the clerk. The base rate is stable.
      *   *Example:* "What is the survival rate of this specific cancer?" Your planning won't change the biology.
      *   *Test:* Ask, "If I knew this statistic with certainty, would the causal mechanism of the outcome change?" If No -> Use Outside View.

  *   **Apply the Outside View Cautiously (or Hybridize) when:** The base rate is driven by human psychology, incentives, or selection effects that your belief *does* change.
      *   *Example:* The Thesis. The "9 weeks" includes procrastination. Knowing the base rate cures the procrastination.
      *   *Strategy:* Use the Outside View to set the *budget* (9 weeks), but use the Inside View to plan the *work* (how to fill those 9 weeks). Acknowledge that by using the OV, you are effectively removing yourself from the "delusional" reference class and entering a "rational" one. You are updating the reference class *by* forecasting.
      *   *Example:* The Founder. The base rate includes a "survivorship of the overconfident."
      *   *Strategy:* Treat the base rate as a **hurdle**, not a verdict. "The base rate says 90% fail. To be in the 10%, I need a specific Inside View advantage that justifies overriding the base rate." If you can't articulate that advantage, the OV holds. If you can, you are acknowledging you are selecting a *different* reference class (e.g., "Founders with proprietary tech" vs "All founders").

  **4. Solving the "Meta-Inside View" Problem (Instance 3)**
  You noted that choosing the reference class ("Am I special?") uses the Inside View. This is unavoidable. Kahneman and Tversky admitted this. The solution is not to eliminate the Inside View, but to **constrain it**.
  *   **The Protocol:** Start with the Outside View as your *Prior*. Then, allow the Inside View to adjust that prior *only* if you have evidence that is **comparative**, not just **absolute**.
  *   *Bad Inside View:* "I feel really motivated." (Everyone feels motivated).
  *   *Good Inside View:* "I have finished a thesis in 6 weeks before, whereas the reference class average has not." (Comparative evidence).
  *   If your reason for thinking you are special is also true for the people in the base rate who failed, you must stick with the Outside View.

  ### Summary

  The pattern is real. It is **Reference Class Instability** driven by **Self-Effacing Epistemic Rules**.

  *   **Rejections:** It's not Goodhart (no gaming), not Lucas (too macro), not Self-Fulfilling Prophecy (prediction doesn't create event).
  *   **Diagnosis:** The Outside View is a tool for correcting *systematic bias* in a population. If you use it, you correct your bias. If everyone uses it, the systematic bias disappears, and the statistic changes.
  *   **Action:** Continue to use the Outside View. It is the correct move for an individual in a biased population. However, recognize that you are not just *predicting* the future; you are *intervening* in the data generation process.
      *   For **structural** tasks (waiting for mail, biology), OV is truth.
      *   For **psychological** tasks (writing, projects), OV is a cure.
      *   For **selection** tasks (startups, careers), OV is a filter.

  The "modesty" lies in admitting that your Inside View is likely contaminated by the same bias that created the base rate. Even if universal adoption would change the base rate, *you* are not the universal adopter. You are one agent correcting for a bias that currently exists. That remains the modest move.
