      **The Desiderata**
      Any viable account must deliver on four fronts.

      First, **Modal Distinctness**. The statue and the clay possess different persistence conditions. If you squash the lump, the clay survives but the statue perishes. If you reshape the clay into a sphere, the statue ceases to exist while the matter persists. An adequate theory must explain how one object can cease to exist while the other remains, despite their apparent identity.

      Second, **Spatial Coincidence**. During the statue's existence, the clay and the statue occupy the exact same region of space. The theory must explain how two distinct entities can share all spatial properties simultaneously without violating physical intuition.

      Third, **Diachronic Continuity (The Conservation Corner)**. Real-world artifacts challenge simple binary identities. Consider a terracotta statue slowly impregnated with synthetic binder to prevent crumbling. A chemist calls it a composite; the museum lists it as the original. At what point does the constitution relation break? A theory must define the threshold where material replacement alters identity versus mere preservation. Similarly, consider the **Internal Armature**. A hollow iron skeleton supports the clay. Conservators debate whether removing it destroys the work or merely disassembles it. The theory must distinguish between constitutive parts (the clay) and mere scaffolding (the armature), even when both are physically necessary for the object's current shape.

      Fourth, **Ordinary Object Commitment**. The theory should not force us to deny the existence of statues. Eliminating ordinary objects solves logical puzzles but fails phenomenological adequacy.

      **The Joint Tension**
      The critical friction lies between **Modal Distinctness** and **Spatial Uniqueness**. If the statue and clay have different properties (one survives squashing, the other does not), Leibniz's Law dictates they are non-identical. However, Spatial Uniqueness dictates that two distinct material objects cannot occupy the same space at the same time. Satisfying Distinctness requires accepting coincidence (overcrowding); satisfying Uniqueness requires denying distinctness (identifying them or eliminating one).

