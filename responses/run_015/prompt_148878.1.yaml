      **The Constitution View** (e.g., Baker)
      *Score: High on Distinctness, Low on Uniqueness.*
      This view posits that the statue and clay are distinct objects standing in a "constitution" relation. It handles the squashing case perfectly: the clay persists, the statue does not. It accommodates the armature issue by allowing constitutive parts to be context-dependent. However, it explicitly violates Spatial Uniqueness, accepting that two things can be in one place. It struggles with the synthetic binder case, as the "primary kind" conditions for constitution become vague during gradual replacement.

      **Four-Dimensionalism** (Perdurantism)
      *Score: High on Logic, Low on Common Sense.*
      This view treats objects as space-time worms. The statue and clay are distinct because they have different temporal parts; the clay extends further into the future (post-squashing) than the statue. This dissolves the coincidence problem—they only overlap at a temporal slice. It handles the binder scenario by treating identity as a series of temporal stages. However, it fails Ordinary Object Commitment. We do not experience ourselves as aggregates of temporal slices, and it makes the armature issue merely a matter of which temporal stages we choose to count, offering little normative guidance for conservators.

      **Ordinary-Object Eliminativism** (Merricks)
      *Score: High on Uniqueness, Low on Distinctness/Commitment.*
      This view denies the existence of the statue. Only the clay exists. This preserves Spatial Uniqueness and avoids overdetermination. The armature is just matter arranged statue-wise. However, it fails Modal Distinctness because there is only one object to have properties. It catastrophically fails Ordinary Object Commitment, requiring us to rewrite all museum catalogs and ordinary language to deny the existence of art, treating the binder replacement as merely rearranging atoms rather than preserving an entity.

      **Conclusion**
      No view scores perfectly. The Constitution View best respects the conservator's practice but pays the metaphysical cost of coincidence. Four-dimensionalism offers logical consistency at the expense of intuition. Eliminativism offers parsimony at the expense of reality as lived. The choice depends on whether one prioritizes logical hygiene or phenomenological fidelity.

