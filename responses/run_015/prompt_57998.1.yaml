  **Coordination Efficiency:** Explains why breaking a rule can be wrong even if it seems polite. At the festival, queuing slows service; the theory must show that optimal outcomes sometimes require violating standard politeness norms. It must value system functionality over individual virtue signaling when the collective goal is speed, defining obligation by outcome rather than tradition. This challenges views that prioritize rigid rule-following over utilitarian results in crowded spaces.

  **Resource Fairness:** Handles shared spaces like the cafe tables. The theory must explain why hoarding chairs violates a local equity norm even without explicit consent, treating public space as a common pool resource. It needs to articulate why occupying unused capacity is morally distinct from occupying private property, grounding obligation in scarcity management. This ensures the theory handles public goods without requiring explicit contracts between strangers.

  **Norm Validity:** Determines if a corrupt practice creates obligation. The tip jar scam shows some norms are exploitative; a theory must deny binding force to conventions that systematically deceive participants. It must distinguish between inefficient norms and predatory ones, refusing to bind agents to the latter, ensuring morality isn't reduced to mere local custom. This blocks cultural relativism from justifying exploitation under the guise of tradition.

  **Expectation Alignment:** Focuses on how others react to you specifically. Jaywalking works for locals because drivers anticipate it; the theory must bind agents to norms only when their compliance matches others' predictive models. If your presence changes the risk calculus, the obligation to conform dissolves, making context crucial for determining duty. This ensures obligations are relational, not just intrinsic to the act itself.

  **Entry Consent:** Asks if mere presence implies agreement to local rules. Merely visiting the college town doesn't mean accepting the chair-sharing rule; the theory must differentiate between contractual obligations and situational etiquette. It must avoid assuming that stepping onto a sidewalk constitutes signing a social contract, protecting autonomy against implicit coercion. This prevents theories that equate presence with consent to all local norms.

  Negotiable vs Non-negotiable - Non-negotiable requirements are Harm Principle and Norm Validity, because any theory ignoring safety or exploitation fails morally. Entry Consent and Epistemic Access are also core, protecting visitor autonomy from implicit coercion and unknowable traps. Negotiable items include Coordination Efficiency and Expectation Alignment, as theories might weigh system optimization differently against liberty. Resource Fairness is borderline but necessary for public spaces. The core conflict lies between efficiency and autonomy, but safety and validity must remain fixed anchors.

  The Squeeze - The hardest tension is between Coordination Efficiency and Entry Consent. If you must optimize the festival crowd, you might be forced to follow norms you never agreed to, violating consent. Conversely, respecting consent might gum up the works. The item that kills the most simple theories is Norm Validity. It instantly destroys "always follow locals" (relativism) because some local norms are scams. It also challenges "only follow consented rules" because fairness norms (cafe chairs) bind you without explicit consent. This requirement forces a nuanced view of morality beyond simple contract or custom. It demands we evaluate the norm's content, not just its source. Without this, we become slaves to bad customs or unable to cooperate. Thus, validity is the gatekeeper for any robust theory.
