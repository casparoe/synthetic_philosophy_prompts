  Okay so context: I'm a 3rd year taking a decision theory / rationality course this semester (the one that goes deep on Kelly betting and "geometric rationality" — like, why the right way to size a bet when you're playing a long compounding game is to maximize your long-run growth rate, and how that's a completely different objective from just maximizing expected value, or expected wealth at a single point in time). I'm also on the investment committee for our university's student-run trading fund, and next week we vote on the fund's official position-sizing policy, so I need a memo I can actually circulate and put to a vote.

  Here's the situation. The fund has about $250k in it. It's a student fund — it only exists for as long as the current cohort of students is around, so roughly 3-4 years, and then it gets liquidated and handed off to the next group. So there's no "forever" here, the horizon is fixed. Also there's a hard rule from the university: if the fund ever drops below 60% of its value at the start of the year (so we can't lose more than 40% in a year), the university shuts it down and we all loose our positions. So we're not free to just bet whatever maximizes some abstract thing — we have a floor we can't cross. And our edge on any given trade isn't certain: our models give us an estimated edge (like, we think we're 55% right on a 1:1 bet that the market is pricing at 50%), but that 55% is itself an estimate with error, and if our true edge is actually smaller than we think, betting the full Kelly fraction means we're overbetting and we'll just grind the fund down.

  The committee is split into two seperate camps. Camp one says: "The Kelly criterion is provably the rational strategy for long-run growth, and it even beats any other strategy in the long run — the ratio of your wealth to theirs just keeps growing — so we should bet the Kelly fraction and stop overthinking it." Camp two says: "Kelly assumes an infinite horizon and perfect knowledge of the edge, neither of which we have, so we should just use a fixed small fraction (like 5% of the bankroll per trade) and not pretend we know more than we do." I kind of agree with both of them partially. I think the real question is what our actual objective is: we're not trying to maximize a long-run growth rate (there is no long run for us), we're trying to maximize the chance that we end the 3-4 year horizon above some target without ever breaching the floor, and Kelly's optimality doesn't directly apply to that objective.

  Can you act as a professional decision theorist who specializes in Kelly betting and optimal position sizing under model uncertainty? I want you to think this through carefully, and actually start with a short brainstorm of the different ways to frame our objective (maximize growth rate vs. maximize probability of hitting a target vs. maximize expected terminal wealth subject to the floor, etc.) before you settle on a recommendation. Then write the memo. It should be something the committee could actually act on: a clear recommendation on what position-sizing policy to adopt (be specific — e.g. "use half-Kelly of our estimated edge, capped at X% of the bankroll per trade, and stop trading for the rest of the year once we're within Y% of the floor"), a concrete time frame for implementing and reviewing it, and the reasoning. And you have to honestly engage the strongest version of the losing side — especially the "Kelly is provably rational and you can't really regret playing it" argument — and say where that argument is right and where it breaks down given our fixed horizon and our floor. Don't just restate what the Kelly criterion is, I already know that, make it about our specific situation.

  Oh and keep it to maybe 2-3 pages, in a tone I can actually send to a committee of other students who are smart but not decision theorists.
