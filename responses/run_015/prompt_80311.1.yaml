  ### Decision Theorist's Analysis: Framing the Objective

  Before drafting the memo, we must explicitly reject the default assumptions of standard Kelly theory to fit our constraints. Here is the brainstorm on objective functions:

  1.  **Maximize Expected Log Wealth (Standard Kelly):**
      *   *Logic:* Maximizes the geometric growth rate. Asymptotically dominates all other strategies.
      *   *Failure Mode:* Assumes $t \to \infty$. We have $t \approx 4$ years. Assumes known probabilities ($p$). We have estimated probabilities ($\hat{p}$) with variance. If $\hat{p} > p$, Full Kelly becomes "overbetting," which yields *negative* geometric growth and high ruin risk.
  2.  **Maximize Expected Terminal Wealth (Arithmetic Mean):**
      *   *Logic:* Maximizes the dollar value at graduation.
      *   *Failure Mode:* Encourages excessive leverage. Ignores the 40% drawdown constraint. One sigma-event shuts us down.
  3.  **Maximize Probability of Survival + Target Return (Constrained Optimization):**
      *   *Logic:* Treats the 60% floor as a hard barrier. Prioritizes staying in the game over maximizing alpha on any single trade.
      *   *Selection:* **This is our true objective.** We are not playing for infinite wealth; we are playing for *positive wealth at $t=4$ without hitting the barrier*.

  **Recommendation Logic:** Fractional Kelly (specifically Half-Kelly) is the mathematical bridge. It reduces volatility by 50% but reduces expected growth by only 25% (due to the quadratic nature of the growth function near the peak). It provides a safety buffer against parameter error ($\hat{p} \neq p$) and reduces the probability of breaching the 40% drawdown floor in a finite horizon.

  ***

  **MEMORANDUM**

  **TO:** Investment Committee, Student Trading Fund
  **FROM:** [Your Name], Position Sizing Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Official Position-Sizing Policy & Risk Controls

  #### Executive Summary

  This memo proposes a formal position-sizing policy for the upcoming fiscal year. The Committee is currently divided between two positions: adopting the full Kelly criterion to maximize growth, or adopting a fixed fractional sizing to minimize risk.

  After analyzing our specific constraints—specifically our **finite 3-4 year horizon** and the **university's hard 40% drawdown limit**—neither extreme is optimal. Full Kelly exposes us to unacceptable ruin risk given our estimation uncertainty, while fixed fractional sizing ignores the magnitude of our edge.

  **Recommendation:** We recommend adopting a **Half-Kelly framework** with hard risk circuit-breakers. Specifically:
  1.  Size positions at 50% of the estimated Kelly fraction.
  2.  Cap any single position at 20% of Net Asset Value (NAV).
  3.  Implement a "Circuit Breaker": Reduce sizing by 50% if YTD drawdown exceeds 20%; cease trading if YTD drawdown exceeds 35%.

  #### 1. Strategic Context & Objective Framing

  To select the right policy, we must agree on what we are optimizing. In decision theory, the "optimal" bet size depends entirely on the objective function.

  *   **The Case for Kelly (Camp 1):** The Kelly criterion maximizes the expected geometric growth rate of capital. It is mathematically proven that, over an *infinite* horizon with *known* probabilities, no other strategy will outperform it. The pro-Kelly argument is that we should trust our models and maximize growth.
  *   **The Case for Conservation (Camp 2):** Kelly assumes we know our edge perfectly. In reality, our models produce estimates (e.g., 55% win probability) that contain error. If we overestimate our edge and bet Full Kelly, we are mathematically "overbetting." Overbetting Kelly reduces growth and drastically increases the risk of ruin. Furthermore, Kelly optimizes for the *long run*. We do not have a long run; we have 4 years.

  **Our Actual Objective:**
  We are not trying to maximize wealth over an infinite horizon. We are trying to **maximize terminal wealth at $t=4$ years subject to a hard constraint: Wealth must never drop below 60% of start-of-year value.**

  If we breach the 60% floor, the game ends immediately. Therefore, our primary objective is **survival within the constraint**, and our secondary objective is **growth**. Full Kelly prioritizes growth at the expense of short-term volatility, which threatens our survival. Fixed fractional prioritizes survival but leaves significant alpha on the table. Fractional Kelly balances these.

  #### 2. The Recommendation: Fractional Kelly with Circuit Breakers

  We propose the following policy for immediate adoption:

  **A. Position Sizing: Half-Kelly**
  For every trade, we calculate the Kelly fraction ($f^*$) based on our model's estimated edge. We will bet exactly **0.5 $\times$ $f^*$**.
  *   *Reasoning:* Moving from Full Kelly to Half-Kelly reduces the variance of our returns by approximately 75%, but reduces the expected geometric growth rate by only 25%. This is the most efficient "trade-off" in finance. It also acts as a buffer: if our model overestimates our edge by up to 50%, we are still not overbetting, preserving positive growth.

  **B. Concentration Cap: 20% of NAV**
  No single position may exceed 20% of the fund's total capital, regardless of what the Kelly formula suggests.
  *   *Reasoning:* Kelly assumes a diversified sequence of bets. Idiosyncratic risk (e.g., a single company going to zero) can breach our 40% drawdown limit instantly. A 20% cap ensures that even a total loss on one idea does not threaten the fund's existence.

  **C. The "Circuit Breaker" (Drawdown Control)**
  We will monitor the fund's Drawdown from Peak (DD) relative to the start-of-year NAV.
  *   **Trigger 1 (DD > 20%):** All position size limits are cut in half immediately. (e.g., Max position becomes 10%, Half-Kelly becomes Quarter-Kelly).
  *   **Trigger 2 (DD > 35%):** Trading ceases for the remainder of the academic year. The fund moves to cash/short-term treasuries.
  *   *Reasoning:* The university shuts us down at 40%. Stopping at 35% provides a 5% buffer for market gaps or slippage. Reducing size at 20% prevents us from "tilting" or trying to bet our way back to breakeven, which is the most common cause of total ruin.

  #### 3. Addressing the "Full Kelly" Counter-Argument

  We must honestly engage the argument that "Kelly is provably rational." The proponents of Full Kelly are correct that it is the optimal strategy for **geometric growth** under conditions of **infinite repetition** and **perfect information**.

  However, their argument breaks down in our specific context for two reasons:

  1.  **Parameter Uncertainty:** Kelly is convex with respect to error. If you bet Full Kelly on a 55% edge, but your *true* edge is only 52%, you are mathematically overbetting. Overbetting Kelly yields a *lower* growth rate than underbetting, and significantly higher volatility. Given that we are students with limited historical data on our models, assuming "perfect information" is a dangerous prior. Half-Kelly is the standard industry correction for parameter uncertainty.
  2.  **The Absorbing Barrier:** In infinite games, you can recover from a 50% drawdown. In our game, a 40% drawdown is an "absorbing state"—once we hit it, we cannot recover because the fund is liquidated. Full Kelly paths have a non-negligible probability of dipping 40%+ within a 4-year window, even if the expected value is positive. We cannot accept a strategy that is optimal *on average* if a significant portion of the outcome distribution results in the fund's closure.

  #### 4. Implementation & Review Timeline

  *   **Effective Date:** This policy takes effect immediately upon vote approval.
  *   **Calculation:** The Risk Officer will calculate the Kelly fraction for each proposed trade prior to execution.
  *   **Review:** The Committee will review the policy quarterly. If our model's predictive accuracy (Brier score/log loss) improves significantly over 12 months, we may vote to increase the fraction (e.g., from 50% to 75% Kelly). If accuracy degrades, we will reduce it.

  #### 5. Motion for Vote

  I move that the Investment Committee adopts the **Half-Kelly Position Sizing Policy with 20% Concentration Cap and Drawdown Circuit Breakers** as the official trading mandate for the current fiscal year.

  This approach respects the mathematical rigor of the Kelly criterion while acknowledging the real-world constraints of our fund's lifespan and the university's risk tolerance. It allows us to take calculated risks without gambling the fund's existence.

  **Recommended Vote:** YES
