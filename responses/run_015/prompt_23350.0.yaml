      1.  Confirm Meta-Level status.
      2.  Define DP/EP formally.
      3.  Explain the Constructive Meaning (BHK/CH).
      4.  Resolve the Tension (Assumption vs. Theorem / Canonical Forms).
      5.  Show Classical Failure (LEM/Drinker Principle).
