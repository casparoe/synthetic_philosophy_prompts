  7.  (Self-Correction during drafting): Make sure to distinguish between the *rule* of disjunction elimination (proof by cases) and the *property* of the logic. The rule is valid in both; the property is about what counts as a proof of the premise.

  8.  *Final Polish:* Ensure the explanation of "why LEM destroys it" is clear. LEM asserts $A \lor \neg A$ is always true. If DP held, we could decide every sentence $A$. Since we can't (Gödel), DP must fail in any system with LEM strong enough to encode arithmetic.

