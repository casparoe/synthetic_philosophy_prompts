prompt: |-
  I work in root cause analysis at a freight company, and me and two colleagues have started noticing something we keep doing, and I want to know whether it has a name.

  Our whole job is basically "what's the best story that explains this mess" — a friend who did a philosophy minor says that's got a fancy name, inference to the best explanation or abduction or something. Anyway. What we've noticed is that our best explanation tends to get *better* over time, and we don't think it's because we learned anything new. We think it's because the list of stuff the explanation is supposed to cover keeps getting quietly edited.

  Two cases.

  1. A run of late deliveries in the north region. The explanation we settled on was that the nightly batch job in the sorting software was finishing late, so vans were going out with half their loads. That covered maybe seventy percent of the incidents right away. The rest: over the next couple of months they one by one stopped being the kind of thing we were explaining. A depot that doesn't even use the batch job had late vans — that got called a dispatch problem, different failure mode. Late arrivals where the van actually left on time became transit delays, not a depot thing. Nobody ever said ignore those, and honestly each reclassification was reasonable on its own, some of them were probably right. But by the end the batch job story explained everything on the list, and the list had been trimmed to fit the story.

  2. Not work, family history. Why did my great-uncle's shop go under in the sixties? The family answer is that he was undercapitalized after the expansion. The bits that don't fit — the fire, the year his brother ran it, the near-identical shop two streets over that survived on less capital — have all, over about forty years of retelling, been reclassified as separate stories. The fire was after he'd already lost it. That year was really my grandmother's business. Again: each one plausible, maybe even correct, and the explanation now fits perfectly.

  I also think there's a mirror image. Once we'd committed to the batch job story, new complaints started getting *folded in* as extra successes — the routing complaints, the driver overtime — where before we'd committed they'd have been logged as unrelated grumbling.

  So the thing has two directions, and that might be one phenomenon or two, I can't tell.

  I had a look around and it isn't anything I could put a name to. It isn't bolting an extra assumption onto a theory to save it; nothing gets added to the batch job story. It isn't the thing where a theory explains everything and therefore explains nothing — the story has real content, it's the target that moved. I thought of the Texas sharpshooter, but as I understand it that's drawing the circle around your bullet holes after you've fired; here the target was drawn up front and then narrowed. Moving the goalposts isn't right either, that's about changing what counts as success, not about what's on the inventory.

  So: is there an established concept for this — the cumulative, individually defensible redrawing of what an explanation is answerable for, in both directions? And I don't just want a label. If there's a literature I'd want to know what the nearest concepts are and where exactly this sits relative to each. If there isn't one, then: what's the right way to carve it, when is "that's actually a different phenomenon" a legitimate move and when is it this thing, and does any of it matter for whether best-explanation reasoning can work at all, or is it just sloppy bookkeeping that a careful person could avoid?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**

      *   **Context:** The user works in root cause analysis (RCA) at a freight company.
      *   **Observation:** They notice a pattern where their "best explanation" (Inference to the Best Explanation/Abduction) seems to improve over time, not because of new data, but because the *scope of the phenomenon to be explained* changes.
      *   **Two Directions:**
          1.  **Exclusion (Trimming):** Data points that don't fit the theory are reclassified as "different failure modes" or "separate stories" over time. (e.g., late deliveries not caused by the batch job are reclassified as dispatch problems or transit delays).
          2.  **Inclusion (Folding In):** Once the theory is committed to, new or previously unrelated data points are absorbed into the theory as confirmations (e.g., routing complaints become part of the batch job problem).
      *   **Constraints/Exclusions:**
          *   It's *not* Ad Hoc Hypothesis (adding assumptions to save the theory).
          *   It's *not* "Explains Everything/Explains Nothing" (the theory has content).
          *   It's *not* Texas Sharpshooter (target drawn upfront, then narrowed, not drawn after).
          *   It's *not* Moving the Goalposts (changing success criteria vs. changing the inventory of facts).
      *   **Request:** Is there an established concept/name? If so, provide literature/context. If not, how to carve it up, when is it legitimate vs. sloppy, and does it undermine abduction?

  2.  **Initial Brainstorming & Concept Matching:**

      *   *Confirmation Bias:* Too general. Doesn't capture the structural reclassification of data.
      *   *Theory-Ladenness of Observation:* Close. The theory changes how we see the data. But usually refers to perception, not administrative reclassification.
      *   *Boundary Work:* Sociology of science. Defining what counts as "science" vs. "pseudoscience." Here it's defining what counts as "the phenomenon."
      *   *Problem Shift (Lakatos):* Research programmes protect the "hard core" by adjusting the "protective belt." This involves reclassifying anomalies. Very close.
      *   *Anomaly Accommodation/Assimilation:* Kuhnian paradigm shifts involve dealing with anomalies. Sometimes they are set aside ("will be solved later") or redefined.
      *   *Scope Creep / Scope Narrowing:* Project management terms, but applicable.
      *   *Cherry Picking:* Usually implies malicious intent. Here it's "individually defensible."
      *   *Post Hoc Rationalization:* Fits the vibe, but usually implies falseness.
      *   *Reification:* Treating the concept as real, then shaping reality to fit.
      *   *Operationalization:* Defining how a concept is measured. Changing the operational definition changes the data.
      *   *Goodhart's Law:* When a measure becomes a target, it ceases to be a good measure. Related, but not quite.
      *   *The "Explanandum" vs. "Explanans":* The user is changing the *explanandum* (the thing to be explained) to fit the *explanans* (the explanation).

  3.  **Deep Dive into Philosophy of Science & Cognitive Science:**

      *   **Lakatos' "Protective Belt":** This is the strongest philosophical match. In a Research Programme, the "hard core" (the batch job theory) is protected by adjusting the "protective belt" (auxiliary hypotheses, classification of data). Anomalies aren't falsifications; they are "reclassified anomalies."
      *   **Kuhn's "Paradigm":** Normal science involves puzzle-solving. Puzzles that can't be solved are often set aside or defined as "not really part of this puzzle."
      *   **Duhem-Quine Thesis:** You can't test a hypothesis in isolation; you test it with a bundle of assumptions. Changing the assumptions (classification rules) saves the hypothesis.
      *   **Motivated Reasoning:** Cognitive science perspective. We want the theory to be true, so we process information to support it.
      *   **Concept Creep / Semantic Drift:** The definition of "Late Delivery" shifts subtly.
      *   **Explanatory Coherence (Thagard):** Systems try to maximize coherence. Incoherent data points are rejected or re-labeled to maintain coherence.

  4.  **Synthesizing the "Two Directions":**

      *   *Direction 1 (Trimming):* This is **Anomaly Segregation** or **Protective Belt Adjustment**. It's making the *explanandum* narrower.
      *   *Direction 2 (Folding In):* This is **Theoretical Assimilation** or **Scope Expansion**. It's making the *explanans* broader to capture more territory, thereby increasing its apparent explanatory power.
      *   *Combined:* This is **Target Drift** or **Explanandum Manipulation**.

  5.  **Addressing the "Is there a name?" Question:**

      *   There isn't *one* single catchy term like "The Smith Effect."
      *   However, it is a well-documented composite phenomenon in Philosophy of Science and Organizational Sociology.
      *   Key terms: **Theory-Ladenness of the Explanandum**, **Lakatosian Protective Belt**, **Operationalization Drift**, **Boundary Work**.

  6.  **Developing the Response Structure:**

      *   **Validation:** Acknowledge the sharpness of the observation. It's a real, recognized issue.
      *   **The Philosophical Core:** Introduce the *Explanandum/Explanans* distinction. The user is modifying the *Explanandum*.
      *   **Concept 1: Lakatos & The Protective Belt.** This is the heavy hitter for "saving the theory from anomalies."
      *   **Concept 2: Theory-Ladenness of Observation (Hanson/Kuhn).** How the theory dictates what counts as data.
      *   **Concept 3: Operationalization Drift.** The practical/measurement side.
      *   **Concept 4: Organizational Sensemaking (Weick).** How companies create narratives to reduce ambiguity.
      *   **The "Mirror Image" (Folding In):** Connect this to **Confirmation Bias** but specifically **Assimilation Bias**.
      *   **Normative Assessment:** When is this legitimate? (Refining definitions vs. Hiding truth). How to avoid the trap? (Pre-registration, blind analysis, holding out a test set).
      *   **Conclusion:** It undermines *uncritical* abduction, but careful abduction accounts for this.

  7.  **Refining the content (Self-Correction during drafting):**

      *   *Correction:* The user specifically said it's *not* Ad Hoc. I need to be careful. Lakatos distinguishes between *degenerating* and *progressing* problem shifts. If the reclassifications lead to new predictions, it's progress. If they just save the theory, it's degenerating. This is a crucial distinction for the user.
      *   *Correction:* The user mentioned "Texas Sharpshooter." I need to explain why this is distinct. Texas Sharpshooter is about *spatial* clustering after the fact. This is about *categorical* definition over time.
      *   *Refinement:* The term "Explanandum Drift" isn't standard, but I can coin it/describe it as "Shifting the Explanandum."
      *   *Refinement:* Make sure to address the "Family History" example. That's narrative reconstruction, which fits with **Collective Memory** or **Narrative Smoothing**.

  8.  **Final Polish:**

      *   Ensure the tone is professional, respectful of their expertise, and philosophically rigorous.
      *   Highlight the "Legitimate vs. Sloppy" distinction clearly, as they asked for it.
      *   Provide actionable advice for their RCA work.

  9.  **(Post-Drafting Check):** Did I answer the specific question about literature? Yes, Lakatos, Kuhn, Hanson, Weick. Did I address the two directions? Yes. Did I address the normative implication? Yes.

      *   *Key Insight:* The phenomenon is essentially **Optimizing Explanatory Coherence at the Expense of Empirical Coverage.**

      *(Self-Correction)*: Wait, is there a specific cognitive bias? **Belief Perseverance**? **Congruence Bias**? **Assimilation Bias**? Assimilation bias is strong for the "folding in" part. For the "trimming" part, it's **Exclusion Bias**. Together, they form a system of **Narrative Preservation**.

      Let's stick to the Philosophy of Science framework as the primary anchor because the user mentioned "Inference to the Best Explanation" and "Abduction." That signals they want the epistemological angle.

      *Plan:*
      1. Validate: It's real, it's dangerous, it has a structure.
      2. The Core Mechanism: Shifting the *Explanandum*.
      3. Philosophical Frameworks: Lakatos (Protective Belt), Kuhn (Normal Science), Hanson (Theory-Ladenness).
      4. Organizational Framework: Weick (Sensemaking).
      5. The Two Directions: Anomaly Segregation vs. Theoretical Assimilation.
      6. Legitimacy Check: Progressing vs. Degenerating Shifts.
      7. Mitigation: How to stop doing it.

      *Let's write.*
answer: |-
  This is a sharp observation. You have identified a specific, structural vulnerability in Inference to the Best Explanation (IBE) that often goes unnamed in practical settings, though it is well-documented in the philosophy of science and organizational sociology.

  There isn't one single "pop-psychology" label for it (like *The Baader-Meinhof Phenomenon*), but there is a robust conceptual framework for it. You are describing **Explanandum Drift**, protected by a **Lakatosian Protective Belt**, driven by **Theory-Ladenness**.

  Here is how to carve it up, where it sits in the literature, and how to tell the difference between legitimate refinement and sloppy bookkeeping.

  ### 1. The Core Mechanism: Shifting the *Explanandum*

  In philosophy of science, an explanation consists of two parts:
  *   **The Explanans:** The doing/explaining part (your "batch job is late" theory).
  *   **The Explanandum:** The thing to be explained (the "late deliveries" dataset).

  Your observation is that while you treat the *Explanans* as stable, you are allowing the *Explanandum* to become fluid.

  In Case 1 (the freight data), the *Explanandum* started as "All Late Deliveries in North Region." Over time, it quietly became "All Late Deliveries in North Region *that fit the profile of a sorting delay*."
  In Case 2 (family history), the *Explanandum* started as "Why did the shop fail?" and became "Why did the shop fail *excluding external shocks and management changes*."

  This is distinct from the **Texas Sharpshooter** because, as you noted, the target was drawn up front. It is distinct from **Moving the Goalposts** because you aren't changing the criteria for *success*, you are changing the inventory of *facts*.

  ### 2. The Philosophical Literature: Lakatos and Kuhn

  The most precise framework for this is **Imre Lakatos's** methodology of scientific research programmes (1970).

  Lakatos argued that theories are never tested in isolation. They are surrounded by a "protective belt" of auxiliary assumptions, classification rules, and measurement definitions. When data contradicts the "hard core" (your batch job theory), you don't abandon the core. Instead, you adjust the protective belt.

  *   **Your "Trimming" (Case 1 & 2):** This is **Anomaly Segregation**. In Lakatosian terms, you are reclassifying counter-evidence as "noise" or "a different problem" to protect the hard core. As long as each reclassification is "individually defensible" (as you said), the theory survives.
  *   **Your "Folding In" (The Mirror Image):** This is **Theoretical Assimilation**. You expand the predictive scope of the theory to claim credit for phenomena that were previously neutral.

  Lakatos distinguishes between two types of this shift:
  1.  **A Progressing Problem Shift:** The reclassification leads to *new* predictions. (e.g., "If we exclude the dispatch errors, we predict the batch job errors will correlate specifically with database size.")
  2.  **A Degenerating Problem Shift:** The reclassification is done *only* to save the theory from falsification, without generating new insights.

  **Your concern:** You suspect your team is engaged in a *Degenerating Problem Shift*. The theory looks "better" only because the world has been edited to match it.

  **Thomas Kuhn** also touches on this in *The Structure of Scientific Revolutions*. He describes "Normal Science" as puzzle-solving. Puzzles that cannot be solved are often set aside ("we'll get to that later") or defined as outside the paradigm. Your team is engaging in Normal Science: you have a paradigm (the batch job), and you are forcing the world to fit the paradigm rather than letting the world break the paradigm.

  ### 3. The Cognitive/Organizational Literature: Sensemaking

  Since you work in an organization, **Karl Weick's** work on **Organizational Sensemaking** is highly relevant.

  Weick argues that organizations do not "find" reality; they "enact" it. To reduce ambiguity, teams create a plausible story. Once the story exists ("The batch job is the culprit"), it acts as a filter.
  *   **Retention:** Information that fits the story is retained and highlighted (the folding in).
  *   **Deletion:** Information that disrupts the story is deleted or re-categorized (the trimming).

  This is not necessarily malicious. It is a cognitive efficiency mechanism. It is easier to manage one "batch job" project than seven disparate "we don't know" problems. The literature calls this **Narrative Smoothing**. Over time (like your family history example), the story becomes cleaner because the rough edges are sanded off by retelling.

  ### 4. Is it Legitimate or Sloppy? (The Carving)

  You asked when "that's actually a different phenomenon" is a legitimate move. This is the critical epistemological question.

  **It is Legitimate (Refinement) when:**
  1.  **Independent Criteria:** The reclassification relies on criteria *independent* of the theory.
      *   *Good:* "This delivery was late due to a snowstorm. We know this because the meteorological report says snow, regardless of the batch job."
      *   *Bad:* "This delivery was late, and since the batch job theory doesn't cover it, it must be a 'dispatch problem'." (This is circular).
  2.  **Predictive Power:** The reclassification allows you to predict *future* anomalies.
      *   *Good:* "We are classifying these as dispatch errors. Therefore, we predict the dispatch team will see X metric spike."
      *   *Bad:* The reclassification only explains the past data point and makes no claim about the future.
  3.  **Transparency:** The change in the *Explanandum* is documented. "As of Q3, 'Late Delivery' is defined as..."

  **It is Sloppy (Degenerating) when:**
  1.  **Post Hoc Exclusivity:** The criteria for exclusion are created *after* seeing the data point doesn't fit.
  2.  **Asymmetry:** You are strict about what counts as a "hit" for your theory but loose about what counts as a "miss" (or vice versa).
  3.  **No Residual Category:** Eventually, everything that contradicts the theory gets moved to "other," and everything that supports it gets moved to "theory." If the "other" bucket empties out, you have created a tautology.

  ### 5. Does this undermine Abduction?

  It undermines *uncritical* abduction. Abduction (IBE) relies on comparing competing explanations against a fixed set of data. If the data set shifts to favor one explanation, the comparison is rigged.

  However, careful abduction accounts for this by using **Holdout Sets** or **Pre-registration**.

  *   **In Science:** You define your *Explanandum* before you look at the data.
  *   **In RCA:** You should define the "Inclusion Criteria" for an incident *before* you settle on the Root Cause.

  ### 6. Practical Advice for Your Team

  You can operationalize this without needing a philosophy degree. To stop the "Drift":

  1.  **Freeze the Explanandum:** When you open an RCA ticket, take a snapshot of the incidents included. No new incidents can be added, and no existing incidents can be removed without a formal "Change Request" that requires sign-off from someone *not* invested in the theory.
  2.  **The "Null Bucket" Test:** Monitor the size of the "Other/Unknown" category. If your theory is getting stronger but the "Other" category is shrinking to zero solely via reclassification, you are likely degenerating. A healthy RCA process usually leaves a residue of "unexplained noise."
  3.  **Blind Reclassification:** Have a colleague who *doesn't* know the current leading theory review the "misfit" incidents. Ask them to categorize them. If they categorize them differently than the team invested in the theory, you have found your bias.
  4.  **Track the "Folding In":** When you claim a new success (like the routing complaints), ask: "Would we have counted this as a success if we hadn't already decided the batch job was the cause?" If the answer is no, it's assimilation bias.

  ### Summary

  You have identified **Explanandum Drift** facilitated by a **Lakatosian Protective Belt**.

  *   **The Name:** In philosophy, it's a **Degenerating Problem Shift**. In organizational theory, it's **Sensemaking via Narrative Smoothing**.
  *   **The Risk:** It creates **Illusory Explanatory Power**. The theory looks robust only because the environment has been sterilized.
  *   **The Fix:** Treat the definition of the problem (*Explanandum*) as rigidly as you treat the evidence. If you must change the definition of "Late Delivery" to make the theory fit, you must acknowledge that you have changed the question, not answered the original one.

  Your friend was right about Abduction. But Abduction only works if the "Best" explanation is competing against others on a level playing field. By editing the list of things to be explained, you are removing the competition.
