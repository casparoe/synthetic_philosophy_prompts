  ### The Case

  **Parameters:**
  *   **People:** $A, B$. **States:** $s_1, s_2$ (probability $0.5$ each).
  *   **Concave Function:** $f(u) = \sqrt{u}$.
  *   **Rank Weights:** $w_1 = 2$ (worst off), $w_2 = 1$ (best off).
  *   **Policies:** $R$ (Risky), $S$ (Safe).

  **Well-being Matrix:**

  | Policy | State | Person A | Person B |
  | :--- | :--- | :--- | :--- |
  | **R** | $s_1$ | 10.000 | 40.400 |
  | | $s_2$ | 40.000 | 10.400 |
  | **S** | $s_1$ | 24.000 | 25.000 |
  | | $s_2$ | 24.000 | 25.000 |

  **Expectations:**
  *   $E[A|R] = 25.000$, $E[B|R] = 25.400$. ($A$ is worse off).
  *   $E[A|S] = 24.000$, $E[B|S] = 25.000$. ($A$ is worse off).
  *   $R$ dominates $S$ in expectations for both ($25>24$, $25.4>25$). Choosing $S$ reduces $A$'s expectation.

  **Ex Ante Evaluation (Value of Expectations):**
  *   **Concave:**
      *   $V(R) = \sqrt{25.000} + \sqrt{25.400} = 5.000 + 5.040 = 10.040$.
      *   $V(S) = \sqrt{24.000} + \sqrt{25.000} = 4.899 + 5.000 = 9.899$.
      *   **Preference:** $R$ (10.040 > 9.899).
  *   **Rank-Weighted:**
      *   $V(R) = 2(25.000) + 1(25.400) = 75.400$.
      *   $V(S) = 2(24.000) + 1(25.000) = 73.000$.
      *   **Preference:** $R$ (75.400 > 73.000).

  **Ex Post Evaluation (Expectation of Value):**
  *   **Concave:**
      *   $s_1$: $V(R) = \sqrt{10.000} + \sqrt{40.400} = 3.162 + 6.356 = 9.518$.
      *   $s_2$: $V(R) = \sqrt{40.000} + \sqrt{10.400} = 6.325 + 3.225 = 9.550$.
      *   $E[V(R)] = 0.5(9.518 + 9.550) = 9.534$.
      *   $s_1, s_2$: $V(S) = \sqrt{24.000} + \sqrt{25.000} = 4.899 + 5.000 = 9.899$.
      *   $E[V(S)] = 9.899$.
      *   **Preference:** $S$ (9.899 > 9.534).
  *   **Rank-Weighted:**
      *   $s_1$: $V(R) = 2(10.000) + 40.400 = 60.400$.
      *   $s_2$: $V(R) = 2(10.400) + 40.000 = 60.800$.
      *   $E[V(R)] = 60.600$.
      *   $s_1, s_2$: $V(S) = 2(24.000) + 25.000 = 73.000$.
      *   $E[V(S)] = 73.000$.
      *   **Preference:** $S$ (73.000 > 60.600).

