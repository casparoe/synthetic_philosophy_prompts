  ### Conceptual Analysis

  What is levelled down here is persons' prospects. Under policy $S$, both individuals accept a lower expected well-being than under $R$. The original levelling-down objection targets deterministic outcomes where someone is made worse off and no one better off, which strictly increasing views must reject. Here, everyone is worse off in expectation under $S$, so the original objection does not directly apply; no strictly increasing view ranks $S$ higher based on outcomes alone. However, Ex Post Prioritarianism ranks $S$ higher because it values the equality achieved within each state more than the higher aggregate expectations. This is not the original objection reborn, but a distinct conflict between ex ante welfare and ex post distributional fairness.

  The rank-weighted rendering is technically non-separable; a person's moral weight depends on their relative standing, not just their absolute level. This aligns it more closely with egalitarianism than pure prioritarianism. If classified as egalitarian, this example demonstrates a clash between Ex Ante Prioritarianism and Ex Post Egalitarianism, rather than an internal inconsistency within prioritarianism. However, since both renderings yield the same reversal, the structural problem lies in the timing of the evaluation (ex ante vs. ex post) rather than the specific weighting mechanism.

  The correct reading for a view grounded in benefiting the worse off is Ex Ante. The strongest reason is respect for individual rational dominance: if every person faces higher expected well-being under $R$, choosing $S$ imposes a loss on everyone for the sake of a pattern they cannot access individually. Ex Post Prioritarianism sacrifices everyone's interests to achieve state-wise equality, effectively treating persons as vessels for distribution rather than recipients of benefit.

  **Confidence:** I am fully confident in the arithmetic. I am moderately confident that this is a genuine analogue of levelling down rather than a separate objection, as the intuition of sacrificing welfare for equality persists. I am highly confident in the verdict favoring Ex Ante evaluation. The claim I am least sure of is whether the rank-weighted view should be classified as prioritarianism or egalitarianism, as it shares features of both.
