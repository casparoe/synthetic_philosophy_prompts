answer: |-
  Here is a 75-minute teaching plan designed to survive the "merely verbal" heckle, prevent relativist collapse, and leverage your instinct about the Priya/Sam case.

  ### 1. The Board: The "Knowledge Coordinates"
  **Do not start with definitions.** Start with the geometry of the problem. Before you introduce the views, you must fix the variables so students can see *which* variable each view claims is doing the work.

  Draw this grid on the board immediately and leave it up:

  | **Role** | **Context/Stakes** | **Evidence** | **Verdict ("S knows p")** |
  | :--- | :--- | :--- | :--- |
  | **Subject (S)** | [Fill in] | [Fixed] | ? |
  | **Ascriber (A)** | [Fill in] | N/A | ? |

  **Why this order?**
  Students conflate the *speaker* with the *knower*. If you don't separate them, Contextualism (Ascriber context matters) and Encroachment (Subject stakes matter) look identical because in most real-life cases, the speaker and the knower are the same person, or they share stakes.
  *   **Step 1:** Fill in **Evidence** first. Write "FIXED" in big letters. Tell them: "For this whole hour, the evidence never changes. No new emails, no second glance. If you argue they need more evidence, you've lost the plot." (This preempts the Evidentialist Misreading).
  *   **Step 2:** Fill in **Subject** and **Ascriber** separately. This is the only way to make the Priya/Sam case intelligible.

  ### 2. The Single Example: The Valve Case (Priya & Sam)
  **Discard the Bank and Airport cases as your *primary* engine.**
  *   **Why:** In the Bank and Airport cases, the Subject's stakes and the Ascriber's context usually rise and fall together. Both Contextualism and Encroachment predict the same verdict ("Don't say you know"). This allows your grad friend to say, "See? They agree on the data, it's just a theoretical squabble."
  *   **The Choice:** Use your **Priya/Sam Valve** intuition. It is the only case that forces the views to diverge on the *truth value* of the sentence, not just the appropriateness of assertion.
  *   **Simplification:** To make it work for first-years, strip the narrative fat. Call it "The Control Room."
      *   **Priya (Subject):** Technician. Glanced at gauge. Evidence is modest but ordinary. **Stakes:** Zero. She goes home either way.
      *   **Sam (Ascriber/Actor):** Supervisor. Must decide whether to send a crew into the chamber. **Stakes:** Life and death.
      *   **The Utterance:** Sam says, "Priya knows the valve is shut."
  *   **What it must lack:** Do not make Priya aware of Sam's stakes. Do not make Sam aware of Priya's evidence beyond what's stated. Keep the evidence *visibly* fixed on the board.

  ### 3. The Sequence (75 Minutes)

  **0:00–0:10: Setup & The Relativist Preemption**
  *   **Action:** Put the Grid on the board. Fill in Evidence (FIXED).
  *   **Script:** "We are testing two theories about why we hesitate to say 'I know' when things are risky. One theory says the word 'knows' changes meaning like 'tall.' The other says 'knows' means the same thing, but knowledge itself is harder to get when the risk is high. Neither theory says 'knowledge is whatever you feel.' Both say there are strict rules. The disagreement is about *which* rule breaks the knowledge."
  *   **Why:** This kills the "anything goes" misconception before it forms. It frames the debate as a technical dispute about rules, not a postmodern free-for-all.

  **0:10–0:35: The Case & The Convergence (The Trap)**
  *   **Action:** Run a standard version first. Priya and Sam *both* have high stakes.
  *   **Question:** "Does Priya know?"
  *   **Consensus:** Intuitively, No.
  *   **Board:** Both views agree here. Contextualism says Sam's context raises standards. Encroachment says Priya's stakes raise the threshold.
  *   **Purpose:** Acknowledge the grad friend's point here. "If we stop here, my friend in grad school is right. This is a verbal dispute. Both theories save the intuition."

  **0:35–0:55: The Divergence (The Wedge)**
  *   **Action:** Change the board. **Priya's Stakes: LOW.** **Sam's Stakes: HIGH.**
  *   **Question:** "Sam says 'Priya knows.' Is Sam's sentence True or False?"
  *   **The Split:**
      *   **Contextualism:** Depends on Sam's context (Ascriber). Sam is in a high-stakes context. Standards are high. Priya's modest evidence doesn't clear the bar. **Verdict: FALSE.**
      *   **Encroachment:** Depends on Priya's stakes (Subject). Priya is low-stakes. Threshold is low. Priya's modest evidence clears the bar. **Verdict: TRUE.** (Add nuance: Sam still shouldn't *act* on it, but the knowledge claim is true).
  *   **Why this order:** You must show they agree on the easy cases before showing they disagree on the hard case. This validates the students' intuition before challenging it.
  *   **Addressing the Heckle:** This is your armor. "If this were merely verbal, they would agree on the truth value here. They don't. One says Sam is lying. The other says Sam is telling the truth but being reckless."

  **0:55–1:05: Misconception Sweep**
  *   **The "Low-Stakes Manufacturing" Worry:** A student will ask, "So if I bet $1 I know the capital of France, I suddenly know it, but if I bet $1 million I don't? Do stakes *create* evidence?"
      *   **Response:** "No. Stakes change the *passing grade*, not the *score*. Your evidence is the score. High stakes require an A. Low stakes require a C. You didn't write more on the page."
  *   **The "Action" Confusion:** Students will say, "But Sam can't send the crew in, so what's the point of saying she knows?"
      *   **Response:** "Exactly. Encroachment separates *knowing* from *acting on it*. Contextualism says you can't even say it's true. That's the difference."

  **1:05–1:15: The Final Check**
  *   **Do not ask them to build a case.** That's too generative for a cold room.
  *   **The Question:** "Priya (low stakes) says 'I know.' Sam (high stakes) says 'She doesn't know.' **Can they both be speaking truly?**"
      *   **Correct Answer:**
          *   **Contextualism:** Yes. (Priya speaks in low-standards context; Sam speaks in high-standards context).
          *   **Encroachment:** No. (Priya's knowledge is a fixed fact based on her stakes. One of them is wrong about the fact).
  *   **Why:** This tests the *structure* of the view, not the vocabulary. If they say "Yes" for Encroachment, they haven't got it. If they say "No" for Contextualism, they haven't got it.

  ### 4. What to Refuse to Explain
  **The Semantic vs. Pragmatic Dispute.**
  You are correct to sacrifice this. Do not explain *why* "knows" shifts (semantic context-sensitivity vs. pragmatic implicature).
  *   **The Line:** "We are treating both views as claiming there is a difference in *truth conditions*. Whether that comes from the word 'knows' or the act of saying it is a linguistics fight for another day. Today we care about whether the sentence is true."
  *   **Why:** Introducing pragmatics invites the "merely verbal" heckle back in ("Oh, so it's just misleading, not false?"). Keep the focus on truth conditions to maintain the contrast.

  ### 5. Where This Plan Will Fail (And How to Fix It)
  **Failure Point 1: The Priya/Sam Complexity.**
  First-years may get tangled in who is the Subject and who is the Ascriber.
  *   **Fix:** Use color coding on the board. Priya = Blue. Sam = Red. Every time you mention stakes, point to the color. If you see glazed eyes, stop and ask: "Who is risking their life? Who is just looking at the gauge?"

  **Failure Point 2: The "Action" Intuition.**
  Students naturally think Knowledge = Permission to Act. They will reject Encroachment's claim that Priya *knows* but Sam *can't act*. It feels unstable to them.
  *   **Fix:** Lean into the instability. "It *should* feel weird. That's the price of Invariantism. Contextualism feels nicer because it says Sam isn't even telling the truth. Encroachment says Sam is telling the truth but is crazy to rely on it. Which weirdness do you prefer?"

  **Failure Point 3: The Grad Friend's Heckle.**
  If a student raises the "merely verbal" point early (before the Divergence phase).
  *   **Fix:** "That is exactly the hypothesis we are testing at minute 35. Right now, the data looks the same. Hold that objection until we separate Priya's stakes from Sam's."

  ### 6. Why This Ordering?
  You asked what has to be on the board *before* the views can be separated.
  **Answer:** The **Subject/Ascriber Distinction**.
  If you do not explicitly map who is the *knower* and who is the *speaker* before you introduce the theories, the students will map both theories onto the *speaker's* intuition.
  *   Contextualism is often taught as "Context matters." Students hear "My context matters."
  *   Encroachment is taught as "Stakes matter." Students hear "My stakes matter."
  *   In the Priya/Sam case, "My context" (Sam) and "My stakes" (Priya) are different people. This forces the separation. If you introduce the views before establishing this grid, they will collapse the views into "Sometimes we know, sometimes we don't."

  ### 7. Summary of Misconception Management
  | Misconception | Source | When to Head Off | How |
  | :--- | :--- | :--- | :--- |
  | **Relativism** ("Anything goes") | Framing | **Intro (0:00)** | Explicitly state both views posit strict, objective rules. |
  | **Evidentialist** ("Go check again") | The Case | **Setup (0:10)** | Write "EVIDENCE FIXED" on the board. Forbid "they should check" arguments. |
  | **Collapsing Views** ("Same thing") | Example Choice | **Divergence (0:35)** | Use Priya/Sam. Force a True/False split. |
  | **Low-Stakes Manufacturing** | View Itself | **Q&A (0:55)** | Use the "Passing Grade" analogy (Threshold vs. Score). |

  ### Final Advice on the "Merely Verbal" Heckle
  Your grad friend is relying on the fact that in **standard** cases (Bank/Airport), both views recommend the same assertion: "Don't claim knowledge."
  Your defense is that philosophy isn't just about assertion norms; it's about **truth conditions**.
  *   If Contextualism is true, "Priya knows" is **false** in Sam's mouth.
  *   If Encroachment is true, "Priya knows" is **true** in Sam's mouth (but action is blocked).
  *   This is a metaphysical disagreement about the world, not a verbal disagreement about the word. The Priya/Sam case is the only way to make this visible to undergraduates. Stick with it.
