answer: |-
  The kitchen light hummed, a low, electric bee trapped in the fixture. It was three days since Elias came back. Three days of coffee made in silence, of footsteps that sounded right but felt slightly off-rhythm, of sleeping back-to-back in a bed that suddenly felt too wide.

  Sarah watched him at the counter. He was cutting an apple. He held the knife in his right hand, just as he always had. The scar on his thumb—the white jagged line from the accident on their fifth anniversary—was there. She had checked it the night he returned, running her nail over the raised skin while he slept. Physical continuity. The body was the same vessel.

  But when he sliced the apple, he didn't eat the first piece. Elias always ate the first piece. It was a superstition, something about testing the knife, or maybe just impatience. He placed the slice on the edge of the board instead.

  "You're not hungry?" Sarah asked. Her voice sounded thin in the morning air.

  Elias looked up. His eyes were the same hazel, flecked with green near the pupil. He smiled, and the crinkles at the corners matched the memory she had of him from Thursday morning, before he stepped into the machine.

  "I will be," he said. "Just giving it a second."

  He walked over to the table and sat opposite her. He reached for his mug. Two sugars. She had watched him pour them in herself. He lifted it, blew across the surface, and took a sip. He didn't wince. He never liked it this hot.

  "Did you find it?" she asked. "The version where the treatment worked?"

  Elias set the mug down. "I found a version where he survived. Yes."

  "And you came back."

  "I came back."

  He said it with certainty. To him, the path was a line. He left, he saw, he returned. He was the point traveling along the line. Sarah traced the rim of her own cup. To her, the line had broken. The man who left had stepped into a gap. The man sitting here had stepped out of it. They occupied the same space in her life, but did they occupy the same space in reality?

  "You remember the cabin?" she asked. "Our first trip. The lake."

  Elias nodded. "The water was cold. You dropped the keys in the sand."

  "The keys were in the ignition," Sarah said softly. "I dropped the camera."

  Elias paused. He didn't look confused; he looked like someone adjusting a picture frame that was slightly askew. "Maybe it was the camera. It was a long time ago."

  "It was last year, Elias."

  "Time feels different," he said, "after you've seen the other sides."

  Sarah felt a cold tightening in her chest. If he was the same man, his memories should be hers. They were woven together. If his threads were unraveling, was he still the same fabric? Or was this a new weave, patterned to look like the old one?

  She stood up and walked around the table. She needed to touch him to know. She needed to feel the weight of him. When she placed her hand on his shoulder, he leaned into it. He smelled like soap and coffee, exactly as he had for ten years. But there was something else underneath. A scent like ozone, like air after a storm.

  "I missed you," she said.

  "I was gone an hour," he replied.

  "It felt like longer."

  "For me too."

  He turned his chair and wrapped his arms around her waist. He rested his cheek against her stomach. This was their pose. The way he held her when the world was too loud. Sarah rested her hands on his hair. She could feel the pulse in his neck. It was steady.

  If she accepted him, she was saying that people are constant. That you can walk through hell and back and still be the person who left. That identity is a core that cannot be fractured.

  If she hesitated, she was saying that people are collections of moments. That if the moments diverge, the person diverges. That the man holding her was a stranger who loved her, but not *her* Elias. The original Elias might be somewhere else, staring at a version of Sarah who never asked him to slip. Or he might be dead.

  "Elias," she whispered.

  "Hmm?"

  "Do you feel different?"

  He pulled back slightly to look up at her. His expression was open, honest. He wasn't hiding anything. He genuinely didn't understand the weight of the question.

  "I feel like me," he said. "I feel like I woke up, made coffee, and held my wife. Why would I feel different?"

  "Because you went somewhere else."

  "I went somewhere else and came back. I'm still here."

  He stood up, pulling her with him. He kissed her forehead. It was a familiar gesture, but his lips lingered a second longer than usual. A adjustment. A calibration.

  "I'm going to shower," he said. "Then we can call the hospital. Tell them about the treatment."

  "Okay."

  He walked out of the kitchen. Sarah listened to his footsteps fade down the hall. She looked down at the table. The apple slice sat on the cutting board, turning brown.

  She picked it up. She ate it. It was sweet, crisp, perfect.

  She looked at the mug he had left behind. Two sugars. She dipped a finger in and tasted the coffee. It was bitter. It was hot. It was exactly what he always drank.

  She walked to the sink and rinsed his mug. She placed it in the rack to dry. When she turned off the tap, the silence rushed back into the room. She waited for the sound of the shower to start.

  In the quiet, she wondered if she was waiting for her husband to come home, or if she was waiting to decide whether he ever left. She dried her hands on the towel hanging from the oven door. It was the blue one. He always used the blue one.

  She walked down the hall. The bathroom door was open. Steam was rising from the shower. She could see his silhouette through the frosted glass. He was humming. It was a song from the radio, something from last week. He hadn't liked that song when he left. He said it was too loud.

  Now he was humming it.

  Sarah leaned against the doorframe. She could step in. She could join him. She could accept that people change, that experience rewrites us, that he was the same story with a new chapter.

  Or she could walk away. She could decide that the man in the shower was a counterpart, a nearby possibility made flesh, a gift from the universe that wasn't quite hers.

  The silhouette stopped humming. He turned toward the glass, as if he felt her watching. He didn't speak. He just waited.

  Sarah touched the doorframe. The wood was solid. Real. She took a breath, and stepped into the steam.
