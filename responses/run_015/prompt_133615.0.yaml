answer: |-
  **MEMORANDUM**

  **TO:** County Land-Use Board Members
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Pre-Meeting Thoughts: River-Mill District Rezoning

  Hi everyone,

  As we gear up for the vote in three weeks on the River-Mill District proposal, I wanted to share some thoughts before we gather on Thursday. I've been going back and forth on this, and I want to make sure we're all looking at the same timeline before we raise our hands.

  I'll be honest—I spend my weekends reading some pretty dry history books. One of the ideas that stuck with me comes from a historian named Fernand Braudel. He argued that there are different speeds of history. There's the fast time of events (politics, prices, people selling buildings), and then there's the slow time of geography (climate, river paths, soil). Braudel called the fast stuff "noise" and the slow stuff the "structure."

  I've been thinking about a concept I'm calling **structural amnesia**. It's when boards like ours only see the fast time because the slow time moves too quietly to show up in our meeting minutes. We see the mill owner who wants to sell. We see the developers who want to build. We see the town budget that needs the tax revenue. Those are all real, immediate pressures. But the river valley operates on a 200-year flood cycle that doesn't care about our fiscal year. Right now, with climate shifts, that cycle is speeding up, but our maps haven't caught up.

  **The Case for Approval**
  I want to take the argument for approval seriously, because it's strong. The property owners have a right to liquidate their assets. Holding their land hostage without a clear regulatory reason feels like government overreach. If we block this, we aren't just stopping apartments; we are actively reducing the county's tax base. That has a real human cost. It means less funding for schools, slower road repairs, and higher levies for everyone else. If the flood risk is manageable, then blocking this project is essentially punishing the community to protect a ghost of the past. The developers are also promising a modern build code, which theoretically handles water better than the old mill structures. If we trust the engineers they've hired, the risk is mitigated.

  **The Risk of Amnesia**
  However, if we approve this based only on the current maps, we might be suffering from that structural amnesia. The old mills were built when the river behaved differently. The floodplain is shifting. If we approve high-density housing on land that the river is slowly reclaiming, we aren't solving a problem; we are manufacturing a future disaster. In 15 years, when the water rises, it won't matter that we needed the tax revenue in 2024.

  **Recommendation**
  Because of this, **I recommend we deny the current application, but defer the decision until the County updates its long-range hydrology map.**

  This isn't a permanent "no." It's a "not yet." We need to know where the water will be in 2050, not just where it was in 1950. If the new maps show the land is safe, the owners can reapply, and we can vote yes with a clear conscience.

  I know this is the harder path. It delays revenue and frustrates the owners. But if we approve this with a 10-year phased demolition plan instead, we might just be phasing in the next evacuation zone.

  Let's discuss the cost of waiting versus the cost of building on Thursday. I think we owe it to the people who will live here in 50 years to make sure we aren't just reacting to the noise of today.

  See you then,

  [Your Name]
  County Land-Use Board
