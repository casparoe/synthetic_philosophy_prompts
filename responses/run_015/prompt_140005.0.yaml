prompt: |-
  hey — I need to borrow your brain on a teaching problem rather than on the substance itself, if that's a distinction you'll let me have.

  I'm a PhD student in philosophy (rational choice / decision theory-ish) and I've been asked to run a 75-minute seminar for first-year public-policy masters students in their cost-benefit analysis course. They've had about two weeks: they can build a small decision tree, discount, do a basic NPV, and they've absorbed "sunk costs are irrelevant" as a slogan they can recite but have never seen stress-tested. The course director wants them to leave able to look at a real case of an agency continuing to fund a failing project and say something more useful than "fallacy" — without walking out thinking the slogan was a lie.

  I've ran this twice and it went wrong in two opposite directions. First time I did the core fallacy properly and then bolted the exceptions on at the end; about half the room concluded the whole thing was sophistry dressed up. Second time I led with the interesting exceptions, and they could list three reasons honoring sunk costs can be rational but couldn't tell me which one, if any, applied to a case I put in front of them afterwards. So what I want is a plan for the explanation, not the explanation.

  The substance I want them to end up able to handle — some of this is stuff from my own third chapter, so don't worry about whether it's standard, just take it as given:

  - Whether a cost is sunk isn't a property of the money; it's a property of the cost relative to a decision and to what the feasible alternatives actually are. Ninety-five percent recoverable isn't the same animal as zero percent recoverable, and "the grant can only be spent on this" changes the alternative set rather than making the money free.
  - A forward-looking theory of reasons can still have perfectly respectable things to say about past spending, because the past can be *evidence*: what my earlier self chose tells me something about what my earlier self knew, and I've lost access to most of that (the files are gone, the meetings weren't minuted, the gut feel is not reconstructible). On my "amnesia" argument, honoring the expenditure can be rational deference to a signal I can no longer read directly — and it's strongest exactly when my current evidence about the project is thin, not when it's thick. It should collapse into plain irrationality when the signal isn't there.
  - Separately: for an agent who can't literally bind their future self, treating sunk costs as reasons can be a poor man's precommitment device — you get some of the benefits of a commitment strategy you can't otherwise implement.
  - And the observability dial: whether anyone else sees the decision and updates on it (a state funder deciding about the next tranche, a developer waiting to build) is doing real work, and it's a different mechanism from either of the two above.

  Don't explain any of that to me. Tell me how to get it into their heads in order:

  1. What has to be in place before the exceptions even sound like answers to a question rather than like excuses — what depends on what, and why does that ordering specifically avoid both of the failure modes I described? I'm guessing the causal/evidential distinction has to be secured before the amnesia thing can land, but I'm not sure where to put "sunkness is relative to a decision."
  2. The one case that has to carry the whole session. I've been using a city transit agency: $40m spent on a light-rail spur, $60m still needed, present value of benefits maybe $45m, and the person who signed off has left the agency and took their reasoning with them. Fix the numbers if the ratios matter. Tell me what this case must have and — more importantly, this is where I keep getting it wrong — what it must lack. My instinct is that it has to be stripped of anyone's job being on the line and of any suggestion that the project might come good on the numbers, but I'm not sure whether that strips out too much.
  3. The misconceptions, in the order they'll actually form, and precisely where in the sequence to head each one off. The ones I expect: "sunk = already spent"; "if the past moves you at all you've erred"; conflating honoring a sunk cost with finishing the project; the idea that the reputational/observability story is cheating because the past spend is only a signal and not a reason; and then the rebound into "so it's all just evidence-talk, the fallacy doesn't exist." Give me the ones I haven't thought of too, especially any that the amnesia argument itself will manufacture.
  4. One check at the end that distinguishes genuine understanding from being able to recite the four mechanisms. I'd rather ask them what would have to be *different* for a given mechanism to stop applying than ask them whether the agency should continue.
  5. What to leave out at this level and say out loud that I'm leaving out. I don't want to open the formal signaling/commitment modeling, and I don't want to touch the psychology literature on whether the effect shows up outside convenience samples, but tell me if I'm wrong about either.

  Also: these are policy students, not philosophers — they'll want to know what to do on Monday, and I don't want to give them a license to keep funding things. If there's a place in the sequence for the "and therefore the default stays abandon" move, tell me where it goes.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy (rational choice/decision theory).
      *   **Audience:** First-year Public Policy Masters students (MPP/MPA).
      *   **Context:** 75-minute seminar in a Cost-Benefit Analysis (CBA) course.
      *   **Current Student Knowledge:** ~2 weeks in. Can do decision trees, discounting, NPV. Know "sunk costs are irrelevant" as a slogan but haven't stress-tested it.
      *   **Goal:** Students need to analyze real cases of agencies continuing failing projects without just saying "fallacy" *and* without thinking the slogan is a lie. They need practical utility ("what to do on Monday") without a license to throw good money after bad.
      *   **Past Failures:**
          1.  Core fallacy first + exceptions at end $\rightarrow$ Students thought it was sophistry/excuses.
          2.  Exceptions first $\rightarrow$ Students couldn't apply them to cases (couldn't distinguish mechanisms).
      *   **Substance to Convey (Given):**
          1.  Sunkness is relative to decision/alternatives (recoverability/grant restrictions).
          2.  Evidential value of past spending (Amnesia argument: past self's choice signals info current self lacks).
          3.  Precommitment/Consistency (Poor man's binding).
          4.  Observability/Reputation (Signaling to outsiders).
      *   **Constraints:** Do *not* explain the substance to me (the user knows it). Explain *how to teach it* (pedagogy/sequence).
      *   **Specific Questions to Answer:**
          1.  Sequencing/Ordering (to avoid failure modes).
          2.  The One Case (Transit agency scenario: what to include/exclude).
          3.  Misconceptions (Order of emergence + intervention points).
          4.  Final Check (Understanding vs. Recitation).
          5.  What to Leave Out (Signaling models, psych literature).
          6.  The "Default Stay Abandon" Move (Where to place the normative guardrail).

  2.  **Deconstruct the Pedagogical Problem:**
      *   *Failure Mode 1 (Sophistry):* Happens when exceptions look like loopholes to a rigid rule. If the rule is "Never count sunk costs," any exception looks like breaking the rule.
      *   *Failure Mode 2 (Confusion):* Happens when mechanisms are presented as a menu without a diagnostic framework. Students can't map features of a case to specific mechanisms.
      *   *Solution:* The "Rule" needs to be reframed not as "Ignore the Past" but as "Ignore the Past *unless* it carries Forward-Looking Information." The exceptions aren't exceptions to rationality; they are applications of forward-looking rationality *using* the past as data/constraint.
      *   *Key Insight:* The "Sunk Cost Fallacy" is actually a *Causal* error (thinking past spend *causes* future value). The "Exceptions" are *Evidential* or *Strategic* reasons (past spend *signals* value or *constrains* future options). The distinction must be Causal vs. Non-Causal (Evidential/Strategic).

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Sequencing/Ordering:**
          *   Need to establish the baseline (NPV logic) first, but immediately refine the definition of "Sunk."
          *   *Crucial Step:* Distinguish *Causal* influence (magic thinking) from *Evidential/Strategic* influence (informational/constraint).
          *   *Order:*
              1.  Define Sunkness (Relative to alternatives).
              2.  Establish the Baseline (Causal irrelevance).
              3.  Introduce the "Black Box" (Amnesia/Evidence).
              4.  Introduce the "Audience" (Reputation).
              5.  Introduce the "Future Self" (Precommitment).
              6.  *Guardrail:* The Default to Abandon.
          *   *Why:* This prevents sophistry by making the exceptions *forward-looking* justifications, not backward-looking apologies.

      *   **2. The One Case (Transit Spur):**
          *   *Numbers:* Need to make the NPV clearly negative if continued, to force the tension. Spent: $40m. Needed: $60m. Benefits: $45m. NPV of continuing = $45 - $60 = -$15m. (Clear cut).
          *   *Must Have:*
              *   Ambiguity on *why* the original decision was made (for Amnesia).
              *   Stakeholders watching (for Reputation).
              *   Grant restrictions (for "Sunkness is relative").
          *   *Must Lack:*
              *   Personal liability/blame (removes "saving face" psychology, focuses on rational signaling).
              *   Hope of turnaround on pure numbers (keeps NPV negative).
              *   Explicit threat of firing (keeps it about policy rationality, not survival).
          *   *Refinement:* The "Amnesia" element needs to be explicit. The files are gone. The previous director is gone.

      *   **3. Misconceptions & Intervention:**
          *   *M1: "Sunk = Spent".* Intervention: Early, during definition. Use the "Grant Restriction" example.
          *   *M2: "If past moves you, you're irrational".* Intervention: Immediately after Baseline. Distinguish Causal vs. Evidential.
          *   *M3: "Honoring Sunk Cost = Finishing Project".* Intervention: During Amnesia argument. You can honor the signal by auditing, not necessarily finishing.
          *   *M4: "Reputation is Cheating".* Intervention: When discussing Observability. Frame it as "Cost of Future Capital."
          *   *M5: "So the Fallacy Doesn't Exist".* Intervention: The Guardrail. Reiterate Causal error is still the default error.
          *   *New M6 (Amnesia specific):* "The Past Self was Omniscient." Intervention: Emphasize the Past Self was also fallible; the signal is noisy.

      *   **4. Final Check:**
          *   Don't ask "Should they build?" Ask "What variable change flips the rational decision?"
          *   Example: "If the previous Director left a memo explaining the geology, does the Amnesia argument hold?" (No). "If the grant money can be returned at 90% value, does the Sunkness definition hold?" (No).
          *   This tests mechanism mapping.

      *   **5. What to Leave Out:**
          *   Formal Signaling Models (Too technical).
          *   Psych Literature (Escalation of Commitment bias vs. Rational Signaling). *Correction:* Actually, briefly acknowledging the psych bias is necessary to distinguish it from the rational argument. But don't dive into the studies.
          *   *Crucial:* Don't leave out the "Default to Abandon." That's the policy takeaway.

      *   **6. The "Default Stay Abandon" Move:**
          *   Where? At the very end, as the "Policy Heuristic."
          *   Logic: Because the rational exceptions require *specific conditions* (information asymmetry, reputation stakes, commitment needs), and most bureaucratic bloat is just bias, the prior probability is that it's a fallacy.
          *   Phrase: "Assume Fallacy, Prove Exception."

  4.  **Review and Refine:**
      *   *Tone:* Professional, peer-to-peer (PhD to PhD), concise, actionable.
      *   *Check against constraints:* Did I explain the substance? No. Did I answer all 5 numbered points + the "Monday morning" constraint? Yes.
      *   *Self-Correction on Case:* The user mentioned the "Amnesia" argument relies on lost info. The case needs to ensure the info *is* lost, not just that the person is gone. The files must be missing.
      *   *Self-Correction on Sequencing:* The "Sunkness is relative" point needs to come *before* the Fallacy definition. If they think sunk = spent, the rest fails.
      *   *Self-Correction on Failure Mode 1:* To avoid sophistry, the "Exception" must be framed as "New Information/Constraint," not "Reason to ignore NPV." It *is* NPV, just with different inputs.

  5.  **Final Polish:** Organize by the user's numbered requests for clarity. Ensure the "Monday Morning" heuristic is prominent. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Precommitment" argument. For policy students, "binding future selves" is tricky because agencies *should* be flexible. I need to make sure this is framed as "Credibility with Congress/Market" rather than just internal discipline. I will add a note to the "What to Leave Out" section about this nuance.

  *(Refining the Case)*: The user said "Fix the numbers if the ratios matter."
  Spent: 40. To Go: 60. Benefits: 45.
  NPV(Continue) = 45 - 60 = -15.
  NPV(Stop) = 0 (assuming 0 salvage).
  This is clean. I will stick with this but ensure the "Grant Restriction" element is present to test the "Sunk is Relative" concept.

  *(Refining the Check)*: The user wants a check that distinguishes understanding from recitation. "What would have to be different" is the right approach. I will formalize that into a "Switch the Variable" exercise.

  *(Refining the "Monday Morning" advice)*: This is critical. They are practitioners. They need a decision rule. "Presume Fallacy" is the rule.

  Okay, ready to write.
answer: |-
  Here is a teaching plan designed to navigate the specific failure modes you encountered, structured around your five requests.

  ### 1. Sequencing and Dependencies
  To avoid the "sophistry" trap (Failure Mode 1) and the "menu confusion" trap (Failure Mode 2), you must frame the exceptions not as *violations* of the rational choice model, but as *inputs* to it. The slogan "sunk costs are irrelevant" must be refined, not discarded.

  **The Order of Operations:**
  1.  **Redefine "Sunk" (The Technical Pre-requisite):** Before discussing the fallacy, establish that "sunk" is not "spent." It is "unrecoverable relative to the current choice."
      *   *Why:* If they think sunk = spent, the "grant restriction" exception looks like cheating. If they understand sunk = unrecoverable, then a 95% recoverable grant isn't sunk, and a restricted grant changes the alternative set. This secures the baseline.
  2.  **The Causal Baseline (The Fallacy):** Establish the standard NPV rule: Past spend has no *causal* power over future returns.
      *   *Why:* You must secure the "Causal Irrelevance" principle first. If you don't, the exceptions dissolve the rule entirely.
  3.  **The Evidential Turn (Amnesia):** Introduce the past as *data*, not *cause*. The money is gone, but the *decision to spend it* carries information.
      *   *Why:* This bridges the gap. It allows them to "honor" the past without violating causal irrelevance. It answers "Why look back?" with "To see forward."
  4.  **The Strategic Turn (Reputation & Precommitment):** Introduce external constraints. The cost isn't in the project; it's in the *reaction* to abandoning the project.
      *   *Why:* This moves from internal epistemology (what do I know?) to external game theory (what do they think?).
  5.  **The Policy Heuristic (The Guardrail):** Conclude with the "Default to Abandon" rule.
      *   *Why:* This prevents the "license to keep funding" problem. It places the burden of proof on the exception.

  **Why this ordering avoids your failure modes:**
  *   It avoids **Sophistry** because every exception is framed as a *forward-looking* calculation (expected value of information, cost of reputation loss), not a backward-looking apology.
  *   It avoids **Confusion** because you establish a diagnostic hierarchy: First check recoverability (Definition), then check causal beliefs (Fallacy), then check information asymmetry (Amnesia), then check external stakeholders (Reputation).

  ### 2. The One Case (The Transit Spur)
  You need a case that is "clean" enough to isolate the mechanisms but "dirty" enough to feel real.

  **The Numbers:**
  *   **Spend:** $40m (Past)
  *   **Required to Complete:** $60m (Future)
  *   **PV Benefits:** $45m (Future)
  *   **Salvage Value:** $0 (Default assumption)
  *   **NPV of Completion:** -$15m.
  *   **NPV of Abandonment:** $0.
  *   *Verdict:* Pure CBA says stop.

  **What the Case MUST Have:**
  1.  **The "Black Box" History:** The previous Director who authorized the $40m is gone. The technical files regarding *why* this route was chosen (geological surveys, ridership models) are missing/corrupted. This is essential for the **Amnesia** argument to land.
  2.  **The "Restricted" Grant:** The $40m came from a federal green-transport grant that *cannot* be reallocated to other projects but *can* be returned to the federal government at a 90% penalty (i.e., $36m recoverable by the funder, $0 to the city). This tests the **Definition of Sunk**. (For the city, it's sunk. For the social planner, it's not. For the city, if the grant allows completion but not return, the alternative set is constrained). *Correction for simplicity:* Make it a grant that must be used for *this* project or forfeited entirely. This makes the $40m sunk for the city, but highlights that the *opportunity cost* was locked in earlier.
  3.  **The "Watching" Legislature:** A state oversight committee is currently debating the agency's budget for next year. They view project abandonment as "mismanagement." This enables the **Reputation** argument.

  **What the Case MUST Lack:**
  1.  **Personal Blame:** The current decision-maker was not the one who signed the initial check. This removes "saving face" as a psychological motive, forcing them to find a *rational* argument for continuation.
  2.  **New Positive Information:** There is no new survey saying ridership will be higher. If there is, the decision is just "Update NPV," which bypasses the sunk cost lesson entirely.
  3.  **Legal Liability:** Abandoning the project does not trigger lawsuits from contractors. This isolates the reputation signal from direct financial penalty.

  ### 3. Misconceptions and Intervention Points
  Here is the order in which misconceptions will arise and where to kill them.

  1.  **"Sunk means money already left the bank account."**
      *   *When:* During the Definition phase (Step 1).
      *   *Intervention:* Use the "90% recoverable" variant. If I can get $36m back by stopping, is that $40m sunk? No. Sunkness is about the *future* recovery, not the *past* outflow.
  2.  **"If the past influences me, I'm committing the fallacy."**
      *   *When:* During the Evidential Turn (Step 3).
      *   *Intervention:* Distinguish **Causal** vs. **Diagnostic**. "I am not continuing *because* we spent $40m. I am continuing because the fact that we spent $40m suggests there is hidden value I cannot currently see."
  3.  **"Honoring the signal means finishing the project."**
      *   *When:* During the Amnesia argument.
      *   *Intervention:* This is critical. Rational deference to the past self might mean "Spend $5m on a new geological survey" (buying information), not "Spend $60m to finish." Honor the signal by investigating, not necessarily by committing.
  4.  **"Reputation is cheating; it's not about the project value."**
      *   *When:* During the Strategic Turn (Step 4).
      *   *Intervention:* Reframe reputation as "Future Cost of Capital." If abandoning this project raises your borrowing costs or lowers your budget allocation next year by $20m, that is a real future cost. It belongs in the NPV.
  5.  **"So the fallacy doesn't exist; everything is evidence."**
      *   *When:* Post-discussion / Guardrail phase.
      *   *Intervention:* Reiterate that in 95% of cases, the past self was not smarter, the files aren't actually lost, and the reputation hit is imagined. The *default* assumption must be causal irrelevance.
  6.  **"The Past Self was Omniscient." (The Amnesia Trap)**
      *   *When:* Specifically during the Amnesia argument.
      *   *Intervention:* Remind them the past self was also a bureaucrat operating under incentives. The signal is *noisy*. Deference is rational only when current evidence is *thin*, not when current evidence contradicts the past.

  ### 4. The Final Check (Understanding vs. Recitation)
  Do not ask "Should they build?" Ask them to **break the mechanism.**

  Present the Transit Case again, but ask three specific "Switch" questions. They must identify which rational exception collapses in each scenario.

  *   **Switch A:** "The previous Director leaves a detailed memo explaining the exact geological data used to justify the start."
      *   *Correct Answer:* The **Amnesia** argument collapses. You no longer need to defer to the signal; you can evaluate the data directly. (If the data is bad, you stop. If good, you continue based on data, not sunk cost).
  *   **Switch B:** "The state oversight committee announces they do not care about project completion, only fiscal solvency."
      *   *Correct Answer:* The **Reputation** argument collapses. The future cost of capital remains unchanged by abandonment.
  *   **Switch C:** "The federal grant allows the city to reallocate the unspent funds to any other transport project."
      *   *Correct Answer:* The **Definition of Sunk** changes. The $60m needed is the cost, but the alternative is no longer $0 benefit; it's the benefit of the *next best project* that could be funded. (This tests if they understand sunkness is relative to alternatives).

  If they can identify *which* argument dies, they understand the machinery. If they just say "Now they should stop," they are guessing.

  ### 5. What to Leave Out (and Say So)
  1.  **Formal Signaling Models:** Do not draw the game tree for the reputation argument. It consumes too much time and obscures the intuition.
      *   *Say:* "There is a formal signaling model here regarding budget allocations, but the intuition is simply 'cost of future capital.' We will treat that as a black-box cost for today."
  2.  **Psychological Literature (Escalation of Commitment):** Do not dive into the Staw/Brockner literature on *why* people irrationally escalate.
      *   *Say:* "There is a massive psychology literature on when people *irrationally* fall for the fallacy. Today we are only discussing when it might be *rational*. Assume the psychological bias exists, which is why our bar for the rational exception must be high."
  3.  **The "Precommitment" Nuance:** Be careful with the "binding future self" argument. For public policy, flexibility is usually a virtue.
      *   *Say:* "I am leaving out the 'precommitment' argument for now, because in public policy, the ability to change course is usually an asset, not a liability. Focus on the Information and Reputation arguments."

  ### The "Monday Morning" Heuristic (The Guardrail)
  Place this in the final 5 minutes. You must explicitly revoke the license to throw good money after bad.

  **The Rule:** "Presume Fallacy, Prove Exception."
  *   **Default:** Assume the past spend is causally irrelevant. Assume the past self was not smarter than you. Assume the reputation hit is imaginary.
  *   **Burden of Proof:** To continue a failing project, you must be able to point to *one* of the three exceptions and demonstrate it applies *here*.
      *   Is the information *actually* lost? (Or are you just lazy?)
      *   Is the reputation hit *quantifiable*? (Or are you just embarrassed?)
      *   Is the cost *actually* sunk? (Or can you recover it?)
  *   **Closing Line:** "If you cannot articulate which exception applies, you are not being strategic; you are being sentimental. And in public policy, sentiment is a tax on the public."

  This structure ensures they leave with a sharper tool (the distinctions) but a safer hand (the heuristic).
