answer: |-
  Dear Friend,

  It is a pleasure to engage with your position on diachronic rationality, particularly your commitment to the strong reading of the money-pump argument where the susceptibility to exploitation constitutes the irrationality rather than merely illustrating it. This pragmatic constitutive view is bold, but it invites several lines of criticism that you should weigh carefully. I will lay these out for you, moving from the objections that threaten to dismantle the view entirely to those that merely require uncomfortable qualifications, and I will indicate where I believe a defender should concede the point rather than fight it.

  The most devastating objection, which I rank as fatal to the claim that the pump constitutes the essence of irrationality, concerns the role of the exploiter. You ask whether the argument needs an exploiter who knows one's preferences and can frame offers, and the answer is that on your constitutive view, it seemingly must. If the wrongness is the actual loss of money via a sequence of trades, then in a benign environment where no one offers those trades, the agent with cyclic preferences loses nothing. If they lose nothing, on your view, they are not irrational. This makes rationality extrinsic, dependent on the vultures circling overhead rather than the internal structure of the agent's mind. A defender of your view should concede this point rather than dismiss it, for denying it requires positing a hypothetical exploiter, which shifts the argument from actual losses to possible losses. Once you shift to possible losses, you are no longer saying the pump constitutes the wrongness, but rather that the disposition to be pumped constitutes it, which brings you closer to the synchronic coherence view you wish to distinguish yourself from. To save the view, you must admit that the pump argument reveals a vulnerability that is irrational to possess, regardless of whether the vulnerability is exploited, but this weakens the claim that the actual sequence of trades is what constitutes the norm.

  Slightly less fatal but still critical is the challenge posed by the resolute chooser. You ask whether someone who settles on a plan in advance and executes it escapes the pump, and the answer is yes, they can avoid the loss without satisfying dynamic consistency of preferences. Edward McClennen argued precisely this: that rationality consists in resoluteness, not in aligning occurrent preferences with past plans. If a resolute chooser avoids the money pump by simply refusing to trade based on their current preferences, then the money-pump argument fails to establish dynamic consistency as the specific requirement of rationality. It only establishes that one ought not to lose money. This relocates the requirement from occurrent preferences to plans, as you suspected. A defender should concede that the money-pump argument alone does not rule out resolute choice. To maintain that dynamic consistency is the required norm, you must add a premise that resoluteness is itself irrational or unavailable, which is a substantial additional burden. If you concede this, you admit that the pump argument supports a norm of instrumental efficiency across time, but not necessarily the specific norm of preference coherence you might be aiming for.

  Moving to objections that are serious limitations rather than fatal flaws, consider the source of the cycles. You suspect that cycles generated by thresholds or rough equality may not constitute a loss in the relevant sense, and here you are on solid ground to limit the scope of your view. If an agent is indifferent between A and B, and B and C, due to vagueness or discrimination thresholds, but prefers A to C, pumping them involves trading across indifferences. Many philosophers argue that losing money over indifferences is not irrational because the agent does not view the trades as improvements, only as non-worsening. If you insist this is irrational, you risk condemning ordinary perceptual limitations. A defender should concede that the money-pump argument applies strictly to strict preferences, or else provide an account of why trading across indifference is irrational when it leads to a loss. This does not destroy the view, but it significantly narrows its application, preventing it from being a universal test for all diachronic choice.

  Closely related to this is the concern that the argument presupposes a demanding norm of self-governance. You asked for an argument showing that the pump only bites against agents who have already accepted a quite demanding norm of self-governance, and this is perhaps the deepest philosophical hurdle. The money-pump argument assumes the agent cares about their future welfare or their diachronic unity enough to view the loss as a defect. If an agent views themselves as a series of temporal selves with no concern for the future self's wallet, the pump is merely a transfer of resources from one self to another, minus a fee paid to the exploiter. For the loss to matter as a rational failure, the agent must already accept a norm of diachronic concern. A defender should concede this presupposition. The money-pump argument does not generate the norm of diachronic rationality from scratch; it enforces it upon those who already accept they are a single agent over time. This does not falsify the view, but it clarifies that it is not a foundation for diachronic unity, but a constraint within it.

  Now I turn to the objections that are merely awkward, which a defender might try to talk their way out of but which remain embarrassing. You ask whether the view over-generates, condemning ordinary discounting or the refusal to pay to avoid manipulation. If rationality is avoiding pumps, then an agent who refuses to pay a small fee to avoid a salesman who would otherwise pump them seems irrational, yet intuitively, refusing to engage with manipulators is prudent. Similarly, if ordinary hyperbolic discounting leads to pump-like scenarios, the view condemns common human behavior as irrational. A defender might argue that refusing the fee is a one-off cost that prevents infinite losses, but this requires a calculation that ordinary agents may not make. This is awkward because it makes rationality highly sensitive to transaction costs and environmental hostility. You should be prepared to accept this awkwardness or refine the view to exclude manipulation-avoidance costs from the calculation of loss, though doing so risks ad hoc qualification.

  Regarding the analogy with Dutch-book arguments, you ask whether it helps or hurt given that those are often read as representation theorems. This analogy hurts your constitutive claim. Dutch-book arguments in Bayesian epistemology are frequently interpreted as showing that if your betting quotients are incoherent, you *could* be booked, which reveals an inconsistency in your degrees of belief. They are often taken as diagnostic tools rather than constitutive norms. If you treat the money-pump as constitutive while the Dutch-book is merely representational, you create an asymmetry between practical and theoretical rationality that needs justification. If you treat both as constitutive, you face the problem that agents often survive with incoherent beliefs without actual loss. A defender should concede that the analogy highlights a tension: if Dutch books are merely coherence tests, using money pumps as constitutive norms makes practical rationality seem more pragmatic and less normative than theoretical rationality. It is better to align them, either both as coherence tests or both as constitutive, to maintain unity in your theory of rationality.

  On the question of falsifiability, I must be honest that the view risks being qualified into something unfalsifiable. If every counterexample is met with a ceteris paribus clause about ideal conditions, perfect information, or the absence of transaction costs, the theory loses predictive power. You ask whether this would matter, and it does, because a theory of rationality that cannot be tested against actual behavior becomes a mere definition of terms. A defender should concede that the view needs clear conditions under which an agent would be deemed rational despite avoiding a pump, or vice versa, to remain substantive. Without this, it becomes a tautology that rational agents do not lose money, which is uninformative.

  Finally, you ask if there is anything the view predicts about actual choosers that a purely synchronic account would not. There is. A synchronic account might view pre-commitment devices, or Ulysses contracts, as irrational constraints on future freedom, since at the moment of binding, the agent restricts their future synchronic options. Your diachronic view predicts that rational agents will willingly incur costs to bind themselves to avoid future dynamic inconsistency. This is a clear empirical divergence. If we observe rational agents consistently paying to restrict their future choices to maintain consistency, your view is supported. If agents consistently reject such bindings even when facing known self-control problems, the synchronic view gains ground. This predictive difference is the strongest empirical hope for your position, and you should lean on it heavily.

  In sum, the most fatal flaws are the dependence on an exploiter and the possibility of resolute choice, both of which you should concede require significant modification of the claim that the pump constitutes the wrongness. The presupposition of self-governance and the limitation regarding vague preferences are serious boundaries you must accept. The awkward consequences regarding manipulation and the tension with Dutch-book analogies are burdens you must carry. If you can accept these concessions, the view remains a powerful account of instrumental rationality across time, but it ceases to be the free-standing foundation for diachronic norms you might have hoped it was. It becomes instead a robust constraint on agents who already care about being unified persons over time.

  Yours sincerely,

  A Philosophical Interlocutor
