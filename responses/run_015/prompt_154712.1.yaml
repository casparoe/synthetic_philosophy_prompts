answer: |-
  This is a sophisticated question that sits at the frontier of the philosophy of artificial intelligence and cognitive science. You have correctly identified a gap: traditional philosophy of mind assumes a "reasoner" (a mind, a person, an agent), whereas modern machine learning presents us with **reason-like structures without a reasoner.**

  There is no single, universally agreed-upon term for this yet, as the field is moving faster than the philosophy. However, there are three established conceptual frameworks that, when combined, provide the vocabulary you are looking for.

  Here is the breakdown of the concepts, how to adjust them for neural networks, and how to handle the causal/normative distinction.

  ### 1. The Primary Concept: Free-Floating Rationales (Adjusted)
  You mentioned Daniel Dennett's concept of **Free-Floating Rationales**. This is indeed the closest established fit, but it requires a specific adjustment to apply to neural networks.

  *   **Original Context:** Dennett used this term primarily in evolutionary biology. A moth flying into a flame has no conscious reason to do so, but there is a "rationale" for its behavior (it uses moonlight for navigation; fire is a novel stimulus that hijacks this mechanism). The rationale exists in the design history (natural selection), not in the moth's mind.
  *   **The Adjustment for NNs:** In neural networks, the "design history" (gradient descent) does not store the rationale explicitly. Instead, the rationale is stored in the **geometry of the latent space**.
  *   **Proposed Terminology:** You might refer to these as **Latent Rationales** or **Embedded Rationales**.
  *   **Why it fits:** Like Dennett's biological examples, these rationales are *objective* (they can be discovered and verified via interpretability tools) but *unowned* (no homunculus inside the model "knows" them). They are reasons that exist in the structure of the system rather than the consciousness of an agent.

  ### 2. The Cognitive Science Parallel: Subpersonal States
  In philosophy of mind and cognitive science, there is a distinction between **personal-level** states (beliefs and desires I am aware of) and **subpersonal-level** states (neural firings that process information without my awareness).

  *   **The Concept:** Philosopher Stephen Stich and Patricia Churchland have discussed **Subdoxastic States**. These are states that carry information and influence behavior like beliefs, but are not accessible to the subject and do not follow the logical rules of conscious reasoning.
  *   **Application to NNs:** The "snow $\rightarrow$ wolf" feature is a **Subpersonal Representation**. It functions semantically (it represents "snow") and functionally (it drives the "wolf" output), but it is not a "belief" the model holds in a human sense.
  *   **Distinguishing from Causal Mechanisms:** A mere causal mechanism is a wire carrying voltage. A subpersonal representation is a pattern of activation that *stands for* something else within the system's economy. If the feature is **monosemantic** (consistently represents one concept across contexts) and **causally efficacious** (intervening on it changes the output), it qualifies as a subpersonal reason.

  ### 3. The Normative Distinction: The Intentional Stance
  You asked how to distinguish these structures from "ordinary causal mechanisms." This is the hardest philosophical hurdle. In a neural network, *everything* is ultimately causal (matrix multiplications). So where does the "normativity" (the "ought" or "justification") come from?

  The best framework here is Dennett's **Intentional Stance**, combined with Wilfrid Sellars' distinction between the **Space of Causes** and the **Space of Reasons**.

  *   **The Problem:** Strictly speaking, the model operates entirely in the *Space of Causes*. Neurons fire because of weights and biases, not because of logical justification.
  *   **The Solution:** The "reason" emerges when an observer (you, the engineer) adopts the *Intentional Stance*. You treat the model *as if* it were a rational agent to predict its behavior.
  *   **The Synthesis:** The "reason" is not an intrinsic property of the weights, nor is it purely a hallucination of the engineer. It is a **Real Pattern** (another Dennett term).
      *   If describing the feature as a "reason" allows you to compress the description of the model's behavior and predict its future actions better than describing the raw weights, then the reason is **ontologically real** relative to that level of abstraction.
  *   **Distinguishing Feature:**
      *   **Causal Mechanism:** "Neuron 4,521 activated because the sum of inputs exceeded the bias." (Low-level, physical description).
      *   **Internal Reason:** "The model classified this as a wolf because it detected snow." (High-level, functional description).
      *   **The Test:** If you intervene on the *concept* (remove the snow feature) and the behavior changes predictably, the "reason" is functionally distinct from the underlying causal substrate, much like "software logic" is distinct from "electron flow."

  ### Summary of Vocabulary for Your Context

  To speak precisely about this in your work, I recommend adopting the following terminology, which synthesizes the philosophical concepts above:

  1.  **Subpersonal Justifications:** Use this to describe internal features that drive decisions without conscious agency. It acknowledges they act like reasons but belong to the "sub-routine" level of the system.
  2.  **Derived Normativity:** Acknowledge that the normativity is not intrinsic to the math but is derived from the system's optimization objective (the loss function). The model "ought" to classify correctly because it was penalized for not doing so; the internal feature is a heuristic that satisfies that "ought."
  3.  **Functional Role Semantics:** This defines the "meaning" of the feature not by what it *is* (weights), but by what it *does* (its causal role in the network). If the feature plays the role of "snow detector" in the network's logic, then "snow" is its semantic content.

  ### Addressing Your Specific Questions

  **1. Is there an established philosophical concept?**
  The closest cluster is **Subpersonal Representations** operating under **Free-Floating Rationales**. However, in the specific context of AI, philosophers are increasingly using the term **Alien Concepts** or **Model-Internal Reasons**. You are describing **Functional Intentionality without Phenomenology**.

  **2. What adjustments are required for Free-Floating Rationales?**
  You must decouple the "rationale" from *evolutionary history* and attach it to *latent geometry*. In Dennett's biology, the rationale is historical (why this trait survived). In your NN case, the rationale is structural (how this vector aligns with the decision boundary). You are looking at **Synchronic Free-Floating Rationales** (existing in the current structure) rather than **Diachronic** ones (existing in the history of training).

  **3. How to distinguish these from ordinary causal mechanisms?**
  Use the **Interventionist Criterion** (from causal inference philosophy).
  *   A **Causal Mechanism** is a low-level physical description (activation values).
  *   An **Internal Reason** is a high-level invariant pattern.
  *   **The Distinction:** If you can manipulate the high-level pattern (e.g., via feature scrubbing or activation patching) and the output changes in a way that aligns with the *semantic meaning* of the feature (not just random noise), then the feature has achieved the status of a "reason." It has become a **control variable** in the system's logic.

  ### Recommended Reading
  Since you have an engineering background, you may find these specific texts accessible and relevant:
  *   **Daniel Dennett, *The Intentional Stance*:** Specifically the chapters on "Real Patterns." This validates your intuition that these features are "real" even if they aren't physical objects.
  *   **Patricia Churchland, *Neurophilosophy*:** Discusses how neural states can carry semantic content without conscious thought.
  *   **Recent Philosophy of ML Papers:** Look for work by **David Chalmers** (on the reality of virtual objects), **Daniel Kokotajlo**, or **Amanda Askell**. There is a growing subfield specifically discussing "Model Interpretability and Philosophy."

  ### Conclusion
  You are observing **Subpersonal Representations** that function as **Free-Floating Rationales**. They are normative in a **Functional** sense: they are the system's internal heuristics for satisfying its loss function. They are distinct from raw causal mechanisms because they are **semantically interpretable** and **interventionally stable**. You are not imagining the "reason"; you are identifying a higher-order layer of abstraction that is causally grounded but semantically rich.
