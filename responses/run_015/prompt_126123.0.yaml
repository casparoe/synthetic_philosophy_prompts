  ### 2. Predictions for the Parallel Upload Case

  **The Scenario:** Gradual upload, biological brain kept alive. End state: Bio-Brain + Digital-Mind (both active, synchronized, then divergent).

  *   **Prediction by Rule A (Causal-Stream):**
