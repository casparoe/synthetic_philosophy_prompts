  *   **If she says "Both/Neither" (Strict No-Branching):** She maintains that the fission killed the "person" concept entirely, regardless of who is suffering.

  **My bet:** She will say the **Digital-Mind** is the active karmic successor. This would confirm that her "Causal-Stream" view is actually subservient to her "Suffering-Stream" view. She cares about causality only insofar as it sustains the capacity for suffering. If the Bio-Brain can't suffer, it's effectively "dead" in the Buddhist sense, even if the heart beats.

  **Winning Argument:** If she says the Digital Mind is the successor here, you can trap her: *"So, if I upload you gradually but keep your body alive in a coma, and then I kill the digital file, have I murdered you? Or did you die when the body went to sleep?"* Her answer to *that* tells you if she thinks death is the end of causality or the end of experience.
