  **Joint Statement of Adversarial Collaboration**

  **I. Agreed Claims**

  1.  Assertion is a speech act with a word-to-world direction of fit, characteristically aimed at updating the common ground of interlocutors with information. We agree it is distinct from guessing, conjecturing, or implying.
  2.  The practice exists to facilitate cooperation and information transmission; testimony and hearsay transmit warrant, though the mechanism is disputed. We agree that successful transmission changes the hearer's epistemic state responsibly.
  3.  Shared data includes: (i) the infelicity of Moorean conjunctions ('p, but I don't know p'); (ii) the impropriety of asserting lottery losers despite high probability; (iii) the mandatory nature of retraction upon learning falsity; (iv) the functionality of hedging.
  4.  Data Ownership: The Knowledge Norm (KN) side claims (i) and (ii) as direct evidence for a knowledge constraint. The Reasonable Credence Norm (RCN) side claims (iii) and (iv) as direct evidence for evidential thresholds sensitive to context.
  5.  Both agree norms are constitutive of the practice, not merely moral or prudential, and that 'knowledge' and 'evidence' are distinct categories despite overlapping extensions. We agree that any viable theory must explain why some high-probability assertions feel wrong.

  **II. Disagreements Table**

  | Issue | KN Formulation | RCN Formulation | Verbal Dispute? |
  | :--- | :--- | :--- | :--- |
  | **Necessity** | Knowledge is necessary for proper assertion. | Knowledge is not necessary; calibrated credence suffices. | No. |
  | **Sufficiency** | Knowledge is sufficient for proper assertion. | Knowledge is not sufficient; high credence without knowledge may suffice. | No. |
  | **Context** | Context affects pragmatic appropriateness, not the norm. | Context sets the credence threshold for the norm itself. | Possible. KN may accept pragmatic encroachment on knowledge, mimicking RCN. |

  **III. The Cruxes**

  **(a) Stakes.** Case: Same speaker, same evidence, two hearers (low vs. high cost of error). Accepted Bearing: If propriety diverges, the norm is context-sensitive or knowledge is stakes-sensitive. This tests whether the norm is invariant across practical environments. If the speaker is criticized in the high-stakes case, KN must explain this via loss of knowledge or pragmatic appropriateness distinct from the norm. RCN explains this via shifting thresholds. KN Prediction: Assertion is improper in high stakes either because knowledge is lost (encroachment) or because appropriateness requires more than norm-satisfaction. RCN Prediction: Assertion is improper because the credence threshold rises with stakes, independent of knowledge status.

  **(b) The Beliefless Witness.** Case: A calibrated system outputs *the bridge is unsafe* without belief. Accepted Bearing: Determines if belief is constitutive of assertion or merely typical. This isolates knowledge from belief. If the system is treated as asserting, KN faces a dilemma: deny it is assertion or admit knowledge isn't required. RCN treats the output as assertion governed by calibration. KN Prediction: This is not assertion (no believer) or violates the norm (no knowledge requires belief). RCN Prediction: This is proper assertion if calibration meets threshold; belief is unnecessary for the norm.

  **(c) Selfless Assertion.** Case: A teacher asserts science she doubts for students' sake. Accepted Bearing: Tests if evidence alone justifies assertion absent belief. This isolates professional duty from personal epistemic state. If the assertion is deemed proper, KN must argue the teacher knows (controversial) or that propriety diverges from the norm. RCN deems it proper based on evidence available to the role. KN Prediction: Violation. No belief entails no knowledge, thus the constitutive rule is broken. RCN Prediction: Permitted. The teacher's evidence supports the proposition sufficiently, satisfying the credence norm.

  **(d) Hedged-Assertion Community.** Case: A language game with no bare assertoric form; all moves are *probably p, 0.8*. Accepted Bearing: Tests if the norm targets bare assertion specifically or information transfer generally. This tests the linguistic universality of the norm. If the community functions identically to ours, KN must argue their norm is parochial to English-style bare assertion. RCN argues the norm tracks the functional role, regardless of hedging markers. KN Prediction: The knowledge norm is inapplicable or systematically violated since no one asserts *p* simpliciter; the practice lacks the target of the norm. RCN Prediction: The norm applies to the available speech act; if 0.8 meets the context threshold, it is proper assertion, merely linguistically marked.
