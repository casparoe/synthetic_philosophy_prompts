      *   *The Problem:* If we try to explain the human's knowledge by saying "You are following the axioms of arithmetic," the human asks, "How do I know I'm applying those axioms correctly?"
      *   *The Regress:* To apply the axiom, I need a rule for application. To apply that rule, I need another rule.
