      *   The Tortoise accepts $A$, $B$, and $C$, but refuses to accept $Z$ unless there's another rule ($D$: If $A$, $B$, and $C$, then $Z$).
      *   This leads to an infinite regress. You can't force logic by adding more logic *as premises*.

