      *   *Life A (Tranquilist Favorite):* Needs low suffering, low craving, high contentment. Maybe a simple life, modest means, but psychologically peaceful. No major ambitions unfulfilled.
      *   *Life B (Achievement Favorite):* Needs meaningful achievement, but perhaps some stress, desire, or effort involved. Not miserable, but not perfectly tranquil. Maybe a dedicated professional, artist, or caregiver who struggles but accomplishes something.
      *   *Life C (Both Dislike):* Needs high suffering/craving and no achievement. Maybe a life of addiction, chronic pain, or wasted potential without redemption.

