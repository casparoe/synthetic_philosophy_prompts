answer: |-
  You are not over-analyzing. You have identified a specific, structural maneuver in public epistemology that is distinct from standard testimonial injustice, though it often works in tandem with it.

  The phenomenon you are describing does not have a single, universally agreed-upon label in the way "ad hominem" does, but it sits at the intersection of the sociology of science and social epistemology. The closest established concept is **Thomas Gieryn's "Boundary Work,"** but your description adds a critical layer of *asymmetry* that Gieryn's neutral definition doesn't fully capture.

  Here is the carving you asked for: the conceptual anatomy of the move, its relationship to existing theory, and where the boundaries lie.

  ### 1. The Established Antecedents

  To understand why this feels familiar yet distinct, we need to look at two existing frameworks:

  **A. Thomas Gieryn's "Boundary Work" (1983)**
  Gieryn argued that "science" is not a fixed category but a rhetorical resource. Scientists (and others) engage in "boundary work" to expand, contract, or protect the boundaries of their authority to suit their interests.
  *   *Where it fits:* Your examples are classic boundary work. The audience is redrawing the map of "who is allowed to speak on energy policy" to exclude the climate scientist and include the economist.
  *   *Where it falls short:* Gieryn mostly describes groups protecting their *own* territory (e.g., scientists excluding priests). Your example describes a third party (the audience/interlocutor) manipulating the boundaries of *others* to achieve a rhetorical outcome.

  **B. Nathan Ballantyne's "Epistemic Trespassing" (2019)**
  Ballantyne defines this as experts speaking with confidence outside their field of competence.
  *   *Where it fits:* The climate scientist *is* potentially trespassing on policy (depending on how you define the lane).
  *   *Where it falls short:* Ballantyne treats trespassing as a normative error to be avoided. He doesn't fully address the **selective enforcement** you noticed. The problem isn't that trespassing is happening; it's that the "No Trespassing" sign is only put up for people who disagree.

  ### 2. The Carving: "Weaponized Jurisdictionalism"

  If we need a precise term for the configuration you described, I propose **Weaponized Jurisdictionalism** (or **Asymmetric Boundary Enforcement**).

  Here is the exact structure of the move:

  1.  **The Premise of Jurisdiction:** Knowledge domains are treated as legal jurisdictions. To speak on Topic B, one must hold a "license" from Field B.
  2.  **The Exclusionary Move:** An expert in Field A is denied access to Topic B on the grounds that they lack the Field B license ("Stay in your lane").
  3.  **The Inclusionary Move:** A non-expert in Field C is granted access to Topic B without scrutiny, provided their testimony aligns with the audience's preferred conclusion.
  4.  **The Mechanism:** The boundary between Field A and Topic B is rigid; the boundary between Field C and Topic B is porous.
  5.  **The Function:** This is not about preserving epistemic quality; it is about **epistemic outcome control**. It uses the *appearance* of rigor (respecting lanes) to mask the *reality* of bias (cherry-picking speakers).

  ### 3. How It Differs from Fricker's Epistemic Injustice

  You are right to sense a difference from Miranda Fricker. Here is the technical distinction:

  **Testimonial Injustice (Fricker)**
  *   **Mechanism:** Identity Prejudice.
  *   **Action:** The speaker is heard, but their credibility is deflated *within* the conversation.
  *   **Example:** "I hear you, Doctor, but I don't believe you because you are a woman."
  *   **Focus:** The *weight* of the testimony.

  **Weaponized Jurisdictionalism (Your Phenomenon)**
  *   **Mechanism:** Strategic Proceduralism.
  *   **Action:** The speaker is barred from the conversation entirely based on *location*, while others are admitted based on *alignment*.
  *   **Example:** "You cannot speak on this policy because you are a scientist (location), but this blogger can speak because they understand 'real people' (alignment)."
  *   **Focus:** The *right* to testify.

  **Hermeneutical Injustice (Fricker)**
  *   **Mechanism:** Structural gap in shared understanding.
  *   **Action:** The speaker cannot make themselves understood because the concepts don't exist yet.
  *   **Your Phenomenon:** The concepts exist; the speaker is just told they aren't allowed to use them.

  **The Crucial Distinction:** Fricker's injustices are usually *identity-based* (gender, race). Your phenomenon is *conclusion-based*. If the climate scientist agreed with the audience's policy preference, the "stay in your lane" objection would likely vanish. This makes it a form of **Motivated Reasoning disguised as Procedural Rigor.**

  ### 4. Boundary Cases: Where does it stop?

  To ensure we aren't labeling every disagreement as this phenomenon, we need to define the limits.

  **Case 1: Genuine Epistemic Humility (Not the Phenomenon)**
  *   *Scenario:* A virologist says, "I can talk about the virus, but I shouldn't dictate the lockdown policy; that's for ethicists and economists."
  *   *Verdict:* This is **not** Weaponized Jurisdictionalism. This is the expert themselves recognizing the limits of their competence. The phenomenon requires a *third party* enforcing the boundary selectively.

  **Case 2: Legitimate Interdisciplinary Dispute (Not the Phenomenon)**
  *   *Scenario:* An economist critiques a climate scientist's policy model because the economic assumptions are flawed.
  *   *Verdict:* This is standard peer review/critique. The boundary is being policed consistently. The phenomenon requires the **asymmetry**: the economist is allowed to critique the policy, but the scientist is not allowed to defend it.

  **Case 3: The "Layperson Intuition" Exception (Grey Area)**
  *   *Scenario:* A philosopher is invited to speak on health ethics not because they are a medical expert, but because ethics is *their* field.
  *   *Verdict:* This is the trickiest boundary. If the philosopher is actually an ethicist, they *do* have a license for the "ethics" portion of the discussion. The phenomenon occurs when the philosopher is cited on *medical efficacy* (where they have no license) while the doctor is silenced on *medical ethics* (where they have a valid stake).
  *   *The Test:* Ask, "Is the outsider being cited for their specific expertise, or for their conclusion?" If a philosopher is cited on *medical facts* because they agree with the audience, that is the phenomenon. If they are cited on *moral frameworks*, that is legitimate division of labor.

  ### 5. Why This Concept Matters

  Naming this matters because it exposes a specific form of **Epistemic Corruption**.

  Standard bias says, "I don't like your answer."
  Weaponized Jurisdictionalism says, "I don't like your *standing*."

  It is more insidious because it hijacks a virtuous norm. We *should* respect expertise boundaries. We *should* be wary of experts overreaching. This move parasitizes those virtuous norms to insulate preferred conclusions from scrutiny. It creates a **One-Way Epistemic Membrane**: expertise can flow in if it supports the view, but it cannot flow out if it challenges the view.

  ### Summary Recommendation

  If you are writing or arguing about this, I suggest using **"Weaponized Boundary Work."**

  *   It anchors you in Gieryn's established sociology (giving you academic weight).
  *   The modifier "Weaponized" captures the asymmetry and strategic intent you identified.
  *   It distinguishes itself from Fricker by focusing on *jurisdiction* (who is allowed to speak) rather than *credibility* (how much they are believed).

  You have correctly identified a gap in the standard taxonomy of epistemic injustice. It is not about the degradation of the speaker's status (Fricker); it is about the strategic manipulation of the speaker's *coordinates*.
