answer: |-
  1. **Leibniz's Law and Property Abstraction**
  **Question:** Critics argue that if Clod satisfies the predicate "could have been distinct from Andromeda" while Andromeda does not, you've violated the Indiscernibility of Identicals, regardless of how you label the modality. How do you block the move that abstracts this difference into a monadic property without simply stipulating that modal properties aren't monadic?
  **Likely Reply:** She will likely insist that there are no monadic modal properties to abstract; all modal ascriptions are incomplete without a sortal parameter, so the inference to a contradiction is syntactically illicit.
  **Follow-up:** If the syntax of our modal language hides this parameter, doesn't that imply the logical form of our thought is systematically misleading about the structure of reality, and isn't that a high price for saving the identity claim?

  2. **The Bare Demonstrative Challenge**
  **Question:** Suppose I point at the pedestal and say, "This could have been a shapeless lump," and then, "This could have been bronze," without using any name or sortal description that carries a causal history. On your view, the sortal is fixed by a historical chain, but here there is only a gesture. Which chain fixes the modal profile in this bare demonstrative case?
  **Likely Reply:** She will probably argue that the context of utterance supplies the relevant sortal concept even if no name is spoken, effectively piggybacking on the speaker's conceptual intent.
  **Follow-up:** But if the modal profile shifts depending on what concept the speaker happens to be entertaining at that moment, isn't the modality a feature of the speaker's psychology rather than a feature of the object on the pedestal?

  3. **Squashing and Re-creation**
  **Question:** Let's squash Andromeda into a ball and then, two days later, reshape that same clay back into the exact original form. Does Andromeda survive the squashing as a dormant statue, or does the reshaping create a numerically new statue? If the latter, isn't "statue" functioning as a phase sortal like "student," and does that commit you to saying the statue goes out of existence and comes back into existence?
  **Likely Reply:** She will likely maintain that Andromeda ceases to exist when squashed and the reshaping creates a new statue, denying that "statue" is a phase sortal to avoid intermittent existence.
  **Follow-up:** If the matter, the form, and the location are identical before the squash and after the reshaping, what metaphysical fact makes the second statue a *different* object from the first, other than a brute haecceitistic difference?

  4. **Sortal Proliferation and Unintended Lumps**
  **Question:** You constrain sortals via causal history and intention, but consider a lump of clay that forms naturally in a cave, never observed by anyone. It has a shape, but no sculptor. Does it have a modal profile at all, or is it modal-free until a human takes an interest? If the latter, does the modal nature of the physical world depend on our conceptual engagement with it?
  **Likely Reply:** She will likely concede that without a sortal-introducing event, there is no fact of the matter about its *de re* modal properties, though it still has categorical properties.
  **Follow-up:** So on your view, a physical object can exist without having any truth-conditions regarding how it could have changed; does that not render the object itself metaphysically incomplete until it is named?

  5. **Temporal Relativization**
  **Question:** If modal predication is sortal-relative, it seems temporal predication must be too: "The statue was made on Monday" is true relative to the statue-sortal, but false relative to the clay-sortal, which existed on Sunday. Is there any unrelativised fact about when *the object* began to exist, or does the relativity go all the way down to existence itself?
  **Likely Reply:** She will likely accept that temporal boundaries are also sortal-relative, denying there is a "view from nowhere" on when the thing began.
  **Follow-up:** If there is no unrelativised fact about when the thing began, what grounds the identity of the "one thing" across time? Is there a bare particular persisting underneath that has no temporal properties of its own?

  6. **Persons and Organisms**
  **Question:** Applying this to persons, you seem committed to saying I am contingently identical to this human organism. But while the statue case feels like a verbal dispute about counting, the person case feels like a substantive dispute about what *we* are. Why does the exact same logical machinery yield a trivial result in one case and a profound anthropological claim in the other?
  **Likely Reply:** She will likely argue the difference is merely psychological; we are more invested in the person-sortal, but metaphysically the structure of the identity claim is identical.
  **Follow-up:** If the structure is identical, why does the person case generate ethical stakes—like rights and survival—that the statue case lacks; does your view imply that my rights are also sortal-relative and could vanish if the sortal changes?

  7. **Substantiveness vs. Constitution Theory**
  **Question:** The constitution theorist posits two coinciding objects to save Leibniz's Law; you posit one object with relative properties to save parsimony. Since both views predict the exact same truth-values for all ordinary sentences, what empirical or logical evidence could possibly settle the debate, or is the disagreement purely aesthetic?
  **Likely Reply:** She will likely claim her view is more parsimonious because it doesn't multiply entities beyond necessity, which is a theoretical virtue independent of empirical prediction.
  **Follow-up:** But if the "two object" view can explain the modal differences by pointing to two distinct essences, while your view must explain them by pointing to one essence viewed two ways, doesn't their explanation actually have more explanatory power than your appeal to relativisation?

  8. **Transitivity Across Sortals**
  **Question:** If Andromeda is identical to Clod, and Clod is identical to a potential Doorstop (relative to that sortal), does transitivity hold across sortal-relative identities? If Andromeda = Clod and Clod = Doorstop, must Andromeda = Doorstop, even though they have incompatible survival conditions?
  **Likely Reply:** She will likely restrict the transitivity of identity, arguing it only holds within a single sortal framework, not across different sortal-relative descriptions.
  **Follow-up:** If identity is not transitive across sortals, haven't you abandoned the classical logic of identity entirely, and aren't you just using the word "identity" to describe a much weaker equivalence relation?

  9. **The Nature of the "One Thing"**
  **Question:** You insist there is only one thing on the pedestal, but if all its modal and temporal properties are relativised to sortals, what properties does this "one thing" have in its own right? Is it a bare substratum, and if so, how does it differ from the very coincidence view you're trying to avoid?
  **Likely Reply:** She will likely argue it has categorical physical properties (mass, shape, location) that are not sortal-relative, reserving relativity only for modal and temporal boundaries.
  **Follow-up:** But if mass and shape determine the modal profile, and the modal profile is relative, doesn't that imply the categorical properties themselves must be relative, leaving the "one thing" with no intrinsic nature at all?

  10. **Systematic Error Theory**
  **Question:** Our pre-theoretic intuition is strongly that the statue and the clay are distinct objects. Your view entails that this intuition is a systematic error caused by confusing sortal-relative predications with distinct referents. Why should we trust a metaphysics that tells us our basic grasp of objecthood is fundamentally mistaken?
  **Likely Reply:** She will likely respond that philosophy often corrects naive intuition (like with Galileo or relativity), and the theoretical benefits of contingent identity outweigh the cost of the error theory.
  **Follow-up:** In physics, the new theory predicts novel phenomena; here, your theory simply tells us our ordinary judgments are false without offering new predictions. What justifies accepting an error theory that offers no empirical dividend?
