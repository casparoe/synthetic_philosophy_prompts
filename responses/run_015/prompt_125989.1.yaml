answer: |-
  ## Part 1: The Logical Space

  Before we hand out the tree, we need to map the terrain. The debate over the Liar isn't just a list of theories; it's a multidimensional space of commitments. Most combinations are empty because they are either logically incoherent or philosophically suicidal.

  **The Four Axes:**
  1.  **Truth-Aptness:** Does the Liar sentence express a proposition capable of being true or false?
  2.  **Logical Valuation:** If apt, does it obey Classical Logic (Bivalence/Non-Contradiction), admit Gluts (Both), Gaps (Neither), or Revision (Unstable)?
  3.  **Parameter Sensitivity:** Does the truth value depend on a fixed hierarchy (Language Level), a flexible parameter (Context), or nothing (Single Domain)?
  4.  **Expressibility (Revenge):** Can the theory define its own semantic predicate (e.g., "is grounded" or "is pathological") within the object language without generating a new paradox?

  **The Map of Combinations:**

  | Aptness | Logic | Sensitivity | Expressibility | Status | Example Position |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No** | N/A | N/A | Yes | **Occupied** | **Deflationism** |
  | **Yes** | **Glut** | None | Yes | **Occupied** | **Dialetheism** |
  | **Yes** | Classical | **Language** | No | **Occupied** | **Tarskian Hierarchy** |
  | **Yes** | Classical | **Context** | Yes | **Occupied** | **Contextualism** |
  | **Yes** | Classical | None | Yes | **Occupied** | **Epistemicism** |
  | **Yes** | **Gap** | None | No | **Occupied** | **Kripkean Fixed Point** |
  | **Yes** | **Gap** | None | No* | **Occupied** | **Supervaluationism** |
  | **Yes** | **Revision** | None | No | **Occupied** | **Revision Theory** |
  | Yes | Classical | None | No | **Empty** | *Incoherent:* Classical logic + Single domain + No hierarchy = Paradox. |
  | Yes | Gap | Context | Yes | **Unexplored** | *Unattractive:* Why have gaps *and* context shift? Redundant machinery. |
  | Yes | Glut | Language | No | **Empty** | *Incoherent:* Gluts usually reject hierarchy to allow self-reference. |
  | Any | Any | Any | **Yes** | **Rare** | *Revenge-Immune:* Only Dialetheism/Contextualism claim this robustly. |

  *\*Note on Supervaluationism: It claims to handle vagueness, but on the Liar, it typically fails expressibility just like Kripke.*

  **Why the Empty Cells are Empty:**
  *   **Classical + Single Domain + No Context:** This is the "Naive Theory" cell. It is logically inconsistent given the Liar derivation. You cannot live here unless you deny the validity of the derivation (Dialetheism) or deny the sentence is apt (Deflationism).
  *   **Gap + Context:** If you already posit a truth-value gap to solve the Liar, adding context-sensitivity is theoretically costly without clear gain. Contextualists usually argue the sentence *changes* value, not that it lacks one.
  *   **Glut + Hierarchy:** Dialetheists (Priest) argue hierarchies are ad hoc. If contradictions are true, you don't need to ban self-reference via levels.

  ---

  ## Part 2: The Decision Tree

  Hand this out at the first session. Tell the logicians they are not allowed to answer "It depends" unless they specify the parameter.

  **Start:** *Consider the Liar Sentence (L): "This sentence is not true."*

  **Q1. The Meaning Commitment**
  Does *L* succeed in expressing a proposition that is capable of being true or false?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Q2.

  **Q2. The Contradiction Commitment**
  Is it possible for *L* to be **both** True and False simultaneously without trivializing your logic?
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to Q3.

  **Q3. The Context Commitment**
  When you assert *L* is "not true," does the word "true" in your assertion operate at a *different semantic level* or *context* than the word "true" inside *L*?
  *   **Yes:** Go to Q4.
  *   **No:** Go to Q5.

  **Q4. The Borrowed Loop (Custom Case 1)**
  *Scenario:* Sentence A (Language 1) says "No sentence in Language 2 ascribing truth to Language 1 is true." Sentence B (Language 2) says "A is true."
  To resolve this, does your theory require a **fixed, objective hierarchy of languages** that prevents B from ascribing truth to A?
  *   **Yes:** Go to **Leaf C**.
  *   **No (Hierarchy is flexible/contextual):** Go to **Leaf D**.

  **Q5. The Scheduled Liar (Custom Case 2)**
  *Scenario:* A card says "The sentence written on the whiteboard tomorrow at noon is not true." Tomorrow, the board stays blank due to weather.
  On your theory, does the card's sentence have an **unstable value** (oscillating during evaluation) or a **missing value** (simply undefined)?
  *   **Unstable/Oscillating:** Go to **Leaf E**.
  *   **Missing/Undefined:** Go to Q6.

  **Q6. The Gap Commitment**
  For sentences with missing values, is a sentence "True" only if it is true on **all acceptable ways** of making the language precise (precisifications)?
  *   **Yes:** Go to **Leaf F**.
  *   **No (True if it hits a fixed point):** Go to Q7.

  **Q7. The Revenge Commitment**
  Can your theory define its own semantic predicate (e.g., "is grounded" or "has a value") within the object language without generating a new paradox?
  *   **Yes (We can express our own semantics):** Go to **Leaf G**.
  *   **No (We need a metalanguage):** Go to **Leaf H**.

  ---

  ## Part 3: The Leaves (Positions & Costs)

  Here are the eight destinations. Note the "Awkward Thing" — this is the ammunition for your seminar debate.

  | Leaf | Position | The Awkward Thing You're Stuck With |
  | :--- | :--- | :--- |
  | **A** | **Deflationist Dissolution** (e.g., Horwich, early Wittgenstein) | You have to explain why "L is not true" feels meaningful even if it isn't, without secretly using a substantive truth predicate. |
  | **B** | **Dialetheic / Paraconsistent** (e.g., Priest, Beall) | You must accept that some contradictions are true, which requires abandoning the principle of Explosion (*ex contradictione quodlibet*). |
  | **C** | **Tarskian Hierarchy** (e.g., Tarski, Davidson) | You cannot state your own theory of truth in the language you are theorizing about; you are forever silenced in your own object language. |
  | **D** | **Contextualist** (e.g., Burge, Parsons, Glanzberg) | You must argue that the word "true" changes meaning mid-argument, which looks suspiciously like moving the goalposts to avoid paradox. |
  | **E** | **Revision Theory** (e.g., Gupta, Belnap) | You have to accept that for some sentences, truth is not a stable property but a process that never settles, making "is true" fundamentally dynamic. |
  | **F** | **Supervaluationist** (e.g., van Fraassen) | You validate classical tautologies (like *L or not-L*) even when neither disjunct is true, which breaks the link between truth and assertibility. |
  | **G** | **Epistemicism** (e.g., Williamson) | You must claim *L* has a classical truth value that is **in principle unknowable**, positing brute semantic facts that no evidence could ever reveal. |
  | **H** | **Kripkean Fixed Point** (e.g., Kripke, Martin) | You must accept "truth-value gaps," but you cannot consistently say of the Liar that it "lacks a truth value" without generating the Strengthened Liar. |

  ---

  ## Part 4: Instructor's Notes (Where the Tree Creaks)

  **1. Indistinguishable Leaves:**
  *   **Leaf F (Supervaluation) vs. Leaf H (Kripke):** Your tree separates them via Q6, but in practice, these positions are often compatible. A Kripkean can accept supervaluationary logic over the fixed point. If your logicians argue they are the same, concede the point: the real split is between *Fixed Point* semantics and *Classical* semantics over gaps.
  *   **Leaf G (Epistemicism) vs. Leaf C (Tarskian):** Both preserve classical logic. Epistemicism says the value is hidden; Tarski says the sentence is ill-formed. If a student argues for "Classical but Self-Applicable," they are likely drifting toward Dialetheism or Contextualism.

  **2. The Revenge Branch (Q7):**
  *   This is the most contentious node. **Leaf D (Contextualists)** and **Leaf B (Dialetheists)** will both claim they answer "Yes" here.
  *   **Leaf H (Kripke)** and **Leaf C (Tarski)** must answer "No."
  *   **The Fight:** The Contextualist claims they solve Revenge by shifting context. The Dialetheist claims they solve it by accepting the revenge sentence as true (and false). The Kripkean must bite the bullet that their theory cannot be fully stated in their own language. This is where you should spend the last 30 minutes of the seminar.

  **3. The Custom Cases:**
  *   **The Borrowed Loop:** This is designed to trap **Tarskians** (who need fixed levels) vs. **Contextualists** (who allow levels to shift based on conversational context). If a Kripkean tries to answer this, they will say "Both are ungrounded," which forces them down the Q5 path.
  *   **The Scheduled Liar:** This targets the **Revision Theorists**. For them, the dependency on a future fact makes the truth value inherently unstable (oscillating) rather than simply missing. If a student says "It's just false," they are likely an Epistemicist or Dialetheist and should have branched off earlier.

  **4. The Wild Card (Leaf G):**
  *   I included **Epistemicism** as the 8th leaf. It's the "Classical Logic" survivor that isn't Tarskian. It's controversial in Liar debates (more common in Sorites), but it fits the logical space perfectly. It forces students to confront whether they value Classical Logic enough to accept unknowable truth values.

  **5. Final Advice for the Logicians:**
  Tell the two logicians their job is to find the **Empty Cells** in Part 1 and argue that someone *should* live there. If they can defend "Classical + Single Domain + No Context," they've solved the Liar.
