  **OFFICE OF UNIFORM EXPERIENCE (OUE)**
  **Guidance Document 74-B: Evaluating Miracle Petitions**
  **TO:** All Regional Caseworkers, Adjudication Division
  **SUBJECT:** Standardized Protocols for Anomalous Event Verification

  **1.0 PURPOSE AND DEFINITIONS**
  The Office of Uniform Experience exists to maintain the integrity of the empirical baseline. Caseworkers are reminded that a "Miracle" is administratively defined as a transgression of a Law of Nature by a particular volition of the Deity or by the interposition of some invisible agent. A "Law of Nature" is established by firm, unalterable, and uniform experience. Therefore, the burden of proof rests entirely on the petitioner. Belief must be proportioned to the evidence. As the Ordinary Course Ledger (OCL) contains billions of confirmed instances of natural regularity (e.g., human mortality, hydrological stability, gravitational consistency), the prior probability against any miracle petition is effectively absolute.

  **2.0 THE BALANCING TEST (MIRACLE EXCEPTION THRESHOLD)**
  When reviewing testimony, caseworkers must apply the Miracle Exception Threshold. Testimony may only establish a miracle if the falsehood of that testimony would be *more* miraculous than the event reported. In practice, this means the likelihood of the witnesses lying, being mistaken, or suffering collective delusion must be calculated against the OCL weight of the event.
  *Example:* If a petitioner claims a dead man rose, the caseworker weighs the OCL entry "Dead Men Remain Dead" (Count: ~100 Billion) against the Witness Reliability Score. Since human error is common and resurrection is unprecedented, the falsehood of the testimony is always less miraculous than the event. Petitions are to be denied.

  **3.0 COMPETING MIRACLES DESK**
  Petitions involving incompatible religious traditions must be routed to the Competing Miracles Desk. Where Miracle A supports Religion X and Miracle B supports Religion Y, and X and Y are mutually exclusive, the evidence cancels out. Both petitions are denied. The existence of opposing wonders destroys the evidentiary force of both. We do not adjudicate theological truth, only empirical consistency. If all religions claim wonders, and all cannot be true, the administrative default is that none are true.

  **4.0 WITNESS RELIABILITY AND BIAS TRAINING**
  Per HR Module 9, caseworkers must account for inherent human credulity. Witnesses often possess a passion for the surprising and wonderful, which divides their attention and reduces probative value. Reports originating from distant lands, ancient times, or unfamiliar cultures are subject to higher scrutiny due to the difficulty of verification and the propensity for myth-making. Ignorance and barbarism are common in miracle-rich regions. A claim supported by ten witnesses in an educated metropolitan center is treated with greater suspicion than a claim supported by one, as collective enthusiasm suggests contagion rather than fact.

  **5.0 SAMPLE CLAIM ANNOTATIONS**

  **Case File #8920 (Denied)**
  *Claim:* Resurrection of petitioner's aunt in Jerusalem, approx. 33 CE.
  *Evidence:* Four eyewitness accounts recorded decades post-event.
  *Caseworker Notes:*
  > **OCL Check:** Human mortality rate is 100%. No verified reversals in Ledger history.
  > **Balancing Test:** Is it more likely the witnesses erred or the OCL is broken? Witness error is common (see: Bias Training). OCL breach is unprecedented.
  > **Competing Desk:** Rival traditions claim conflicting resurrections elsewhere. Evidence nullified.
  > **Decision:** Denied. Testimony fails Threshold.

  **Case File #1044 (Unprocessable/Borderline)**
  *Claim:* The Sun danced over a specific coordinate in Portugal, 1917.
  *Evidence:* 70,000 witnesses, including skeptics and journalists. Dried mud instantly hardened.
  *Caseworker Notes:*
  > **OCL Check:** Stellar bodies do not dance. Massive violation.
  > **Balancing Test:** Falsehood of 70,000 people simultaneously hallucinating is highly improbable, potentially clearing the Threshold.
  > **Complication:** Reports vary on specific mechanics of the "dance." Some claim rain ceased, others claim wet clothes dried. Inconsistencies trigger Bias Protocol. Furthermore, no global astronomical data supports solar deviation. If the Sun moved, gravity should have shifted globally; no such seismic data exists.
  > **Decision:** Pending. Requires testimony that the falsehood is *more* miraculous than the event *and* that no natural explanation (e.g., mass retinal fatigue) exists. Currently, mass delusion is less miraculous than orbital disruption. File remains open indefinitely to demonstrate evidentiary insufficiency.

  **6.0 CONCLUSION**
  The goal of the OUE is not to deny the possible, but to protect the probable. A framework that allows miracles based on insufficient testimony risks destabilizing the Laws of Nature. By maintaining strict adherence to the Ordinary Course Ledger, we ensure that belief remains rational, proportioned, and safe. If no miracle petition is ever approved, this is not a failure of the Office, but a success of governance.

  **Approved By:**
  *Directorate of Empirical Stability*
  *Office of Uniform Experience*
