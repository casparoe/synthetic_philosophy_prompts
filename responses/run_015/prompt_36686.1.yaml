answer: |-
  Your diagnosis is correct: the disagreement is not about mathematical objects themselves but reflects incompatible prior commitments in general metaontology, meaning the debate functions as two research programs answering different questions under one heading rather than tracking a substantive fact about numbers.

  The evidence for this lies in the strategic moves each side makes when pressed. Platonists (e.g., Hale, Wright, Rosen) consistently prioritize semantic uniformity, arguing that because mathematical discourse functions syntactically and inferentially like empirical discourse, its ontological commitments must be treated likewise; when confronted with the epistemological challenge, they do not produce new mathematical data but instead revise general epistemology to allow for non-causal knowledge or appeal to conceptual competence. Anti-platonists (e.g., Field, Hellman) consistently prioritize epistemological naturalism, arguing that because knowledge requires a causal or structural link to the world, ontological commitments must be constrained accordingly; when confronted with the semantic challenge, they do not deny mathematical utility but instead revise general semantics to offer nominalistic paraphrases or fictionalist interpretations. Both sides accept the internal validity of mathematical practice—theorems, proofs, and applications—without dispute. Consequently, once you bracket the semantic demand for uniform truth-conditions and the epistemological demand for causal access, no residual fact about "numbers" remains to be discovered; the only thing left is the decision about which theoretical virtue (semantic simplicity or epistemic safety) should govern ontology generally.

  This classifies the situation not as a substantive metaphysical disagreement about mathematics specifically, nor as a merely verbal dispute, but as **two research programs answering different questions under one heading**. The platonist program asks, "What ontology is required to make our best semantic theories true?" while the anti-platonist program asks, "What ontology is permitted by our best epistemological theories?" Because these questions pull in opposite directions and rely on external philosophical frameworks rather than internal mathematical facts, convergence is impossible without a breakthrough in those external frameworks. The disagreement is not idle, as it drives significant work in logic, semantics, and metaphysics, but it is derivative; it does not generate substantive questions unique to the philosophy of mathematics that could settle the matter on its own terms.

  Given this diagnosis, no progress should be expected from within the philosophy of mathematics itself, such as new case studies or refined interpretations of specific mathematical theories. Progress would require either a revolution in general metaontology that dissolves the tension (e.g., a deflationary account of existence that satisfies both semantic and epistemic constraints) or a decisive breakthrough in the philosophy of language or epistemology that forces one side to abandon its core constraint (e.g., a naturalized epistemology that successfully explains non-causal access, or a semantic theory that proves indispensability arguments invalid). Until general philosophy resolves how to weight semantic uniformity against epistemological naturalism, the debate over Benacerraf's dilemma will remain a stable equilibrium of incompatible frameworks rather than a solvable problem.
