answer: |-
  ### Brainstorming on Supererogation and Eulogy

  The concept of supererogation refers to actions that are morally good to perform but not morally wrong to omit—acts "above and beyond the call of duty." Traditional moral frameworks often rely on this category to preserve a space for ordinary life; if every possible good act were obligatory, morality would become impossibly demanding. However, this category is denied by those who argue that moral obligation is determined solely by need or consequence. For a utilitarian, if an action produces the best outcome, it is required. For Mira, apparently, care was not a surplus virtue but a response to existing necessity. She rejected the supererogatory because she saw the "extra" as a fiction invented to justify complacency.

  This creates a tension in praise. To call an act supererogatory is to imply it was optional. If we praise Mira as "generous" or "saintly," we imply she had a choice to be less so, which contradicts her own moral reality. Furthermore, labeling someone as exceeding duty can function as an insulation strategy for the audience: by marking her behavior as exceptional, we exempt ourselves from the same standard. This triggers the demandingness objection—if Mira's life is the standard, everyone else fails. Conversely, if we normalize her actions too much, we risk pressuring her burnt-out colleagues to emulate a pace that killed her.

  The structural solution for the speech is to shift the focus from the *status of the act* (optional vs. required) to the *quality of attention* (clear vs. obscured). We can honor Mira's view—that she did only what was owed—without indicting the audience for having owed more than they paid. We do this by framing her life not as a benchmark for measurement, but as a testament to clarity. We praise her for seeing the need clearly, not for suffering under it. This allows the philosophers to nod at the rejection of supererogation, allows the family to feel pride without guilt, and allows the colleagues to rest without feeling they are betraying her memory. The praise becomes about her honesty, not her output.

  ***

  ### Eulogy for Mira

  Thank you for being here. We are gathered to mark the absence of Mira, and to acknowledge the space she occupied while she was here. For those who knew her only as a neighbour or a colleague, you saw someone who showed up. For those who knew her as family, you saw someone who loved without condition. For those who knew her as a friend, you saw someone who refused to look away.

  We have spent the last few days listing what Mira did. She worked in palliative care for twenty years. In 2019, she donated a kidney to a stranger. For a decade, she gave away roughly half her income. When she took a sabbatical, she spent it caring for a dying friend. These are facts. They are substantial. But if I leave it there, I misrepresent her, and I violate the instructions of her daughter, Nora.

  Mira did not view these actions as gifts. She did not view them as sacrifices. She viewed them as responses to things that were true. She once told me that nobody gets extra credit for doing what was obviously owed. She got quietly furious when people called her generous, because generosity implies you had a choice to keep what was yours. In her view, the need was there, so the claim was made. She didn't think she was going above duty. She thought she was simply meeting it.

  This puts us in a difficult position today. We want to praise her. But if we praise her for doing "more" than everyone else, we imply that her actions were optional. We imply that the rest of us are acceptable for doing less. That creates a distance between us and her that she would have hated. It turns her life into a performance of virtue, when she experienced it as a plain engagement with the world.

  So, how do we honor that without lying?

  We honor it by recognizing that her clarity was hers, not a weapon against us. There is a temptation, when someone lives like Mira, to feel that our own lives are deficient. If we measure ourselves against her output, we will all come up short. Some of you in this room are already feeling that weight. You are thinking about your own kidneys, your own bank accounts, your own capacity to give. Mira would not want this speech to be a dare. She would not want her friends to burn themselves out trying to match her pace. She died tired. Let us not mistake her exhaustion for a standard.

  We also cannot use the words that usually comfort us in these rooms. She was not a saint. She was not a hero. She was a woman who saw what was in front of her and refused to pretend it wasn't there. When she cared for a dying patient, or her friend, or her daughter, she wasn't trying to accumulate moral credit. She was trying to be present. That is the thing we can carry without breaking ourselves. We do not need to replicate her sacrifices to honor her attention.

  To Nora, and to her mother and brothers: She was not trying to buy love. She was not trying to prove anything. She loved you because you were hers. The work she did outside this family was not a distraction from you; it was an extension of the same logic. You were people who needed care. The world was full of people who needed care. She did not rank them. She did not save herself for you. She gave what she had to who was there. That might sound hard to hear, but it is the truth she lived. It means her love for you was not transactional. It was just true.

  To her colleagues and friends who are still doing this work: You do not honor her by destroying yourselves. Rest is not a betrayal. She would want you to stay in the fight long enough to be useful. She rejected the idea that care was optional, but she also knew that a broken caregiver helps no one. Take care of yourselves so you can take care of the work.

  We cannot give her extra credit. She was right about that. But we can acknowledge the debt. Not a debt of guilt, but a debt of recognition. She saw the world clearly. Most of us spend our lives blurring the edges to make them more comfortable. She refused to blur them. That is what we miss. Not the kidney, or the money, but the refusal to look away.

  We will not find her in the sky. She is not watching over us. She is here, in the record of what she did, and in the needs she identified that still remain. The work is not finished. But we get to decide how we carry it. We can carry it with the clarity she showed, within the limits we have. We can stop pretending the need isn't there, without pretending we are infinite.

  Mira told the truth about what was owed. Our task now is to tell the truth about what remains. We will miss her. We will look for her in the quiet moments of work. We will not try to be her. We will just try to be honest, in our own way, about what is in front of us.

  Thank you.
