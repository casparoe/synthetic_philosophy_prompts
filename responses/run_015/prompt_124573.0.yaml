prompt: |-
  I'm prepping next week's session for my philosophy of democracy seminar, mostly grad students who know Habermas and Rawls well but haven't really touched Dewey, and I want them to understand his experimentalism about democracy and inquiry without it collapsing into either naive populism or deliberative democracy with American accents. The core idea I want to land is that democracy isn't a decision mechanism applied to fixed preferences but a mode of continuous social inquiry in which the problem-definition and the participants' own ends get reconstructed together through cooperative problem-solving; it's not that we discover pre-existing wants and then vote, but that the wants themselves shift as people work through the situation. To keep this distinct from expert control, I think the carrying example needs to be something like a neighborhood running temporary pop-up transit routes that reveal mobility needs residents didn't know they had, rather than a standard town meeting or a scientific laboratory, but I'm not sure if that's concrete enough or if it misses the right contrast with top-down planning.

  So I don't want the lecture itself, just the pedagogical architecture: the dependency order of the ideas—what has to be in place before they can even see democracy as inquiry rather than mechanism—the specific misconceptions they'll form, like that "experimental" just means trial-and-error with citizens as lab rats, that it requires a neutral scientist to design the tests, or that if ends change then there's no rational standard for judging success, and exactly where in the sequence I should head each one off before it hardens. I also need the one check question at the end that proves they've grasped the co-transformation of problem and preference rather than just memorizing "democracy is like science," plus what I should openly say I'm leaving out—probably Dewey's metaphysics of qualitative experience and his formal logic of inquiry—without sounding like I'm dodging hard material. Please write this all in continuous prose with no headings, bullet points, bold text, or tables, just like a long email, since I'm going to adapt it straight into my notes. And dont worry if you happen to write recieve with an extra e; I do it all teh time myself and it wont bother me.
