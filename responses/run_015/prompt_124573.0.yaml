answer: |-
  Hi there, it sounds like you have a really solid handle on the specific tension you want to navigate with your seminar, and honestly that transit example is perfect because it avoids the sterility of the lab while sidestepping the emptiness of the town hall meeting. Since you are working with grad students who are already steeped in Rawls and Habermas, the biggest pedagogical hurdle you will face is that they are trained to view democracy as a problem of justification and procedure rather than a problem of experience and learning. For them, the legitimacy of a decision comes from the fairness of the process or the rationality of the consensus, whereas for Dewey the legitimacy comes from the capacity of the process to reconstruct the situation and the people within it. So the very first thing you need to establish before you can even introduce the idea of democracy as inquiry is the insufficiency of the aggregation model. You have to get them to see that if preferences are treated as fixed inputs, democracy is merely a counting mechanism, and if preferences are treated as malleable only through persuasion without material feedback, it becomes mere rhetoric. They need to accept that preferences are endogenous to the political process before they can understand why inquiry is necessary.

  Once you have disrupted the fixed preference model, you can introduce the concept of the problematic situation, which is where you should deploy the pop-up transit example. You need to show them that the residents do not start with a clear demand like we want a bus line here, but rather with a felt difficulty, like getting to work is becoming impossible. If you introduce the example too early before establishing the critique of fixed preferences, they will just view the transit route as a service delivery issue rather than an epistemic one. The key move here is to explain that the trial route is not an experiment done on the citizens but an experiment conducted by the citizens in collaboration with planners. This is the precise moment to head off the first major misconception, which is that experimentalism implies trial-and-error where citizens are treated like lab rats. You need to emphasize that in Deweyan inquiry, the subjects of the experiment are also the agents of the inquiry. If you wait until later to clarify this, they will harden into the view that Deweyan democracy is just technocratic social engineering with a friendly face.

  The next dependency in your sequence is establishing who defines the terms of the experiment, which leads directly into the second misconception about the need for a neutral scientist or expert to design the test. Your students will naturally assume that if democracy is inquiry, there must be a social scientist holding the clipboard to ensure validity. You need to intercept this when you explain how the problem definition itself is reconstructed. In the transit example, the residents might start thinking they need faster buses, but through the process of riding the pop-up route, they realize the problem is actually about safety at intersections or timing relative to shift changes. The expertise is distributed and functional, not hierarchical. If you do not make this distinction clear when discussing the reconstruction of the problem, they will collapse Dewey back into a version of deliberative democracy where experts provide the facts and citizens provide the values. You have to stress that the facts and values are co-constituted in the action.

  This leads you to the third and perhaps most stubborn misconception, which is the fear of relativism or the loss of a rational standard. If ends change during the process, how do we know we succeeded? They will worry that without fixed goals, there is no way to judge the outcome. You should address this immediately after explaining how ends are reconstructed, by introducing Dewey's standard of growth or enriched experience. Success is not meeting the initial preference but resolving the tension in the situation in a way that opens up further possibilities for action. In the transit case, success isn't that the bus route stays exactly as planned, but that the community now has a clearer understanding of their mobility needs and the capacity to address them. If you leave this until the Q&A, it will sound like an ad hoc fix, so it needs to be woven into the definition of inquiry itself.

  Regarding what to leave out, you should be upfront that you are bracketing Dewey's metaphysics of qualitative experience and his formal logic of inquiry. Do not frame this as skipping the hard stuff because it is too difficult, but rather as a strategic focus on the political implications before tackling the ontological grounding. You can tell them that Dewey's logic of inquiry is the engine room, but for this session, you are staying on the deck to see how the ship steers. If you try to explain the metaphysics of experience alongside the political theory, you risk losing them in abstraction, and if you ignore it entirely without comment, they will feel the theory is ungrounded. Acknowledging it as the foundation you are temporarily setting aside shows respect for the system while keeping the seminar focused on the political mechanism.

  Finally, for your check question, you need something that forces them to apply the co-transformation logic rather than just repeating the slogan that democracy is like science. A good question would be to ask them to describe a scenario where a democratic decision was successfully implemented but failed as inquiry, or vice versa. For example, ask them to consider a case where a community voted unanimously for a policy that satisfied their initial preferences but ultimately worsened their situation because those preferences were never reconstructed through engagement with the problem. If they can articulate that the failure was not in the procedure or the aggregation but in the lack of learning and reconstruction of the ends themselves, then you will know they have grasped the core distinction. This should give you a solid architecture for the session without getting bogged down in the metaphysics, and I think your students will recieve it well given their background.
