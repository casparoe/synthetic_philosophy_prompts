answer: |-
  **Project Title:** Ranking Cultural Evolution Frameworks via Replicative Friction

  **The Precise Question**
  When a cultural item moves through formal institutions rather than casual mind-to-mind copying, it hits what I'm calling "replicative friction"—resistance to mutation caused by rules, laws, and protocols. The core question is simple: Which of the three big frameworks (Dawkins' replicator theory, Boyd-Richerson dual inheritance, or Sperber's epidemiological model) best predicts evolutionary dynamics when replicative friction is high? I want to rank them by utility in institutional contexts.

  **Why the Literature Doesnt Settle This**
  Most cultural evolution theory assumes transmission happens via psychological copying or general social learning. It treats the mind as the primary filter. But institutions add a layer of physical and bureaucratic scafolding that locks content in place. A legal contract doesnt mutate the same way a joke does. Existing lit discusses institutions, but it doesnt offer a way to judge which theoretical framework handles this rigidity best. We know institutions change the game, but we dont have a scorecard for which theory wins when the rules get strict.

  **Method: Comparative Vignettes**
  Over four months, I'll run two comparative case studies to stress-test the frameworks.
  1.  **High Friction:** The propagation of open-source software licenses (GPL vs. MIT). This spread is governed by legal text and institutional enforcement. Mutation is costly and rare.
  2.  **Low Friction:** The spread of a specific TikTok audio trend. This is pure mental copying with almost zero institutional barrier. Mutation is rapid and expected.

  I will apply all three frameworks to both cases. The ranking depends on which theory most accurately explains the variance in mutation rates between the two environments without needing excessive ad-hoc adjustments.

  **The Deliverable**
  Academic papers are great, but people designing cultural interventions (policy makers, public health marketers, platform regulators) need tools. The output will be a "Friction Matrix." This one-pager helps practitioners select the right theoretical lens based on the institutional rigidity of their target environment. If you're trying to stop misinformation in a legal court, use Framework A. If you're trying to spread a health habit on social media, use Framework B. It turns abstract theory into a selection guide.

  **What Counts as Failure**
  Project failure isnt just running out of time. It happens if:
  1.  All three frameworks perform equally poorly at explaining institutional stability (meaning the concept of replicative friction breaks the models entirely).
  2.  The "Friction Matrix" proves too vague to be actionable for practitioners.
  3.  I find that institutional transmission is just too distinct to be modeled by evolutionary theory at all.

  **Realistic Monthly Scope**
  *   **Month 1:** Define "replicative friction" operational metrics and finalize the vignettes.
  *   **Month 2:** Analyze the High Friction case (Software Licenses) against all three frameworks.
  *   **Month 3:** Analyze the Low Friction case (Audio Trend) and draft the comparative ranking.
  *   **Month 4:** Build the Friction Matrix deliverable and write the final summary report.

  This is a tight scope, but by limiting the case studies to vignettes rather than deep ethnography, I can deliver a clear ranking within the grant period.
