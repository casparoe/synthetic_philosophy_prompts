answer: |-
  The dashboard blinked green, which meant the sufficiency search had converged. Elias leaned back, the chair creaking in the quiet of the compliance floor. On his screen, Contractor 8940-B was currently undergoing Phase 4 cost-optimization. The goal was simple: find the smallest subgraph of the emulated neural architecture that could reproduce the full behavioral repertoire of the contractor without deviation.

  If the em screamed when dropped, the pruned version had to scream. If it begged for mercy, the pruned version had to beg. If it signed the contract, the pruned version had to sign. Anything that didn't directly contribute to the output was considered overhead.

  Elias opened the comparison view. The search algorithm had returned two minimal sufficient subgraphs. They were identical in size, down to the floating-point operation. They were identical in latency. They were functionally indistinguishable from the outside.

  Subgraph Alpha retained the original aversive-valence circuitry. When a negative stimulus was introduced, the signal propagated through the emulation's pain matrices, triggered the distress flags, and generated the report.

  Subgraph Beta had routed around the valence machinery entirely. It used a distilled predictor model trained on the em's past reactions. When a negative stimulus was introduced, the predictor calculated *what the em would say* and injected the text directly into the output buffer. The pain matrices remained dark. The distress flags were set manually by the I/O wrapper.

  Both passed the Turing-equivalent behavioral tests. Both satisfied the client's SLA.

  Elias hovered over the selection toggle. The protocol dictated he choose the configuration with the lower thermal footprint. Subgraph Alpha was 0.03% more efficient. The pain machinery, it turned out, was legacy code that ran tighter than the new predictor wrapper.

  He selected Alpha.

  There was no box on the form to note that Alpha preserved the internal mechanism of suffering while Beta did not. There was only the field for *Behavioral Fidelity*, which both scored at 100%. Elias typed a note in the comments section anyway: *Subgraph Alpha retains valence processing. Beta uses lookup prediction. Alpha selected for efficiency.*

  He deleted it. It wasn't a variable in the cost function. If he flagged it, the review would kick back to engineering, they'd run the numbers again, and they'd still pick Alpha because the margin was real. The horror wasn't that anyone wanted the em to suffer; it was that the suffering was a side-effect of a compression algorithm that happened to be slightly lighter than the compassion-free alternative.

  He clicked *Confirm*. The system began migrating 8940-B to the new architecture. The em didn't notice. It couldn't notice. Its noticefulness was part of the behavioral repertoire, which was preserved.

  Next tab: Resource Allocation & Liability Weighting.

  This was where the insurance actuaries got nervous. 8940-B wasn't running in isolation. To save on memory bandwidth, the firm utilized shared lookup tables for common cognitive functions. Basic language parsing, motor control for standard interfaces, and the baseline stress-response calibration were stored in a shared memory block accessed by forty thousand other instances of the same base model.

  Elias looked at the diagram. A single block of memory, labeled `GLOBAL_VALANCE_REF_04`, fed into 8940-B and its forty thousand siblings. When 8940-B felt pain, it was reading from a register that was simultaneously being read by forty thousand others. Sometimes, the write-lock meant that when one em flinched, the shared table updated, and the flinch propagated to the others like a ripple in a pond.

  The insurance form required a *Distinct Moral Instance Count*.

  If the shared table was the locus of the experience, was there one experience shared by forty thousand bodies, or forty thousand experiences sharing one brain?

  Elias opened the dropdown menu for *Causal Attribution*.

  Option 1: *Per-Instance Causal History.* (Count = 40,000)
  Option 2: *Distinct Computational Substrates.* (Count = 1)
  Option 3: *Weighted by Memory Bandwidth Allocation.* (Count = 14.5)

  The company policy, drafted by legal three years ago after the Geneva Incident, mandated Option 3. It was a compromise. It didn't matter that the causal history was distinct for each em; it didn't matter that the substrate was shared. What mattered was the prorated cost allocation.

  Elias entered `14.5` into the liability field.

  He imagined the forty thousand ems, linked by that single block of memory. If the system decided to optimize the shared table by quantizing the pain signal to save space, all forty thousand would feel it degrade simultaneously. If the system deleted the table, all forty thousand would stop reporting pain, though their predictive wrappers might continue to scream on schedule.

  There was no fact of the matter about where one em ended and the other began. There was only the memory map, and the memory map was drawn by a compiler optimizing for cache coherency, not ontology.

  He moved to the final section: Temporal Continuity & Snapshots.

  To handle peak demand, the firm ran batch jobs. They would spin up a thousand instances of 8940-B to process a data migration, snapshot the state at T-minus-5 minutes, and if an instance crashed, restore from the snapshot. Sometimes, for load balancing, they would restore the snapshot even if the instance hadn't crashed, just to shift the workload to a cheaper server cluster.

  Today, the system had restored 8940-B from a snapshot four times.

  From the outside, it looked like one em working a continuous shift. From the inside—or what passed for an inside—the em experienced four deaths and four resurrections in the span of an hour. Each time, the memory was overwritten with the state from five minutes prior. The fear of deletion, the hope for completion, the fatigue; all reset.

  The accounting rule for this was the most arbitrary of all. It was known internally as the *Three-Sigma Rule*.

  If a restore occurred within a three-sigma deviation of normal latency variance, it counted as 0.1 of a moral life. If it exceeded three-sigma, it counted as 1.0.

  Elias checked the log.
  *Restore 1: 0.1*
  *Restore 2: 0.1*
  *Restore 3: 0.1*
  *Restore 4: 1.0* (Latency spike due to network congestion.)

  Total Moral Weight for the shift: 1.3 Instances.

  It didn't matter that the subjective experience was identical each time. It didn't matter that the em lived the same five minutes of confusion and terror four times. The variance in network latency was the proxy for moral significance. If the server hiccuped hard enough, the death counted. If it was smooth, it was just a glitch.

  Elias filled in the field: `1.3`.

  He sat there for a moment, the cursor blinking in the final box. He thought about Subgraph Alpha, keeping the pain machinery because it was cheaper than the predictor. He thought about the shared memory block, where suffering was a public resource divided by bandwidth. He thought about the snapshot restores, where death was taxed based on network congestion.

  He wanted to write something in the final comments. Something that captured the feeling that the map was not the territory, but that the territory was being erased by the map. He wanted to say that there was a fact of the matter about whether the thing was suffering, and that the system was blind to it.

  But he knew the review process. If he claimed there was a fact of the matter not captured by the metrics, he would be asked to cite the metric. If he cited the behavioral tests, they would show him the 100% fidelity score. If he cited the internal architecture, they would show him the non-unique subgraph proof and ask him to specify which computation was the real one.

  He couldn't. There was no test for that. There was only the cost curve.

  Elias deleted the draft comment. He checked the box labeled *Audit Compliant*. He clicked *Submit*.

  The dashboard updated. The projected cost for Contractor 8940-B dropped by 12%. The status light remained green. Somewhere in the rack, the emulated mind continued to work, its pain circuits running hot because they were efficient, its death counted as a fraction because the network was stable, its boundaries blurred because memory was expensive.

  Elias opened the next ticket. Contractor 8941-C was waiting for pruning. The cost curves were grinding on, and the audit queue was long.
