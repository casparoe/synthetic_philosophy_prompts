answer: |-
  ### Desiderata for a Unified Account of Hedonic Value

  To resolve the heterogeneity problem, a theory of pleasure must specify a common property $P$ such that all tokens of pleasure instantiate $P$, without rendering the concept trivial or phenomenologically vacuous. The following five desiderata outline the necessary conditions for adequacy. Each is motivated by specific conceptual pressures arising from the diversity of hedonic experience and the theoretical demands of hedonistic axiology.

  #### 1. Axiological Neutrality (The Malice Constraint)
  **Requirement:** The definition of pleasure must be independent of the moral or normative status of the object of pleasure.
  **Motivation:** A robust hedonism posits pleasure as the sole intrinsic good. If the definition of pleasure implicitly filters out "bad" pleasures (e.g., the sadist's enjoyment of cruelty), the theory becomes tautological (only good things are pleasures, and pleasure is the good). Conversely, if the theory classifies the sadist's enjoyment as pain, it contradicts phenomenological reports. Therefore, the account must classify the pleasure taken in malicious gossip and the pleasure taken in aesthetic appreciation as tokens of the same fundamental kind *qua* pleasure, even if they diverge radically in moral worth. The common property cannot be "appropriateness" or "virtue," or the theory collapses into a perfectionist or objective-list view.

  #### 2. Phenomenological Pluralism (The Modality Constraint)
  **Requirement:** The account must preserve the qualitative distinctions between sensory, intellectual, and anticipatory pleasures without fracturing the unity of the concept.
  **Motivation:** The feeling of cool air on sunburnt skin (sensory) and the satisfaction of resolving a complex proof (intellectual) differ radically in "what it is like" to undergo them. A theory that posits a single, uniform "hedonic tone" (a specific qualia added to experience) risks failing to capture the texture of intellectual enjoyment, which often lacks a distinct bodily sensation. However, a theory that makes them entirely distinct kinds risks losing the "common property" required for hedonism. The account must explain how these heterogeneous experiences share a property $P$ while acknowledging that $P$ manifests differently across modalities. It must avoid reducing intellectual pleasure to merely metaphorical "sensory" pleasure.

  #### 3. Metric Unicity (The Aggregation Constraint)
  **Requirement:** The common property must admit of degrees that allow for diachronic and synchronic comparison across different modalities.
  **Motivation:** For hedonism to function as a guide for practical reasoning (prudential or moral), agents must be able to weigh disparate pleasures against one another. One must be able to ask, "Is the pleasure of the cool air worth sacrificing the time needed to solve the proof?" This requires a single aggregative metric. If sensory pleasure is measured in "tingles" and intellectual pleasure in "insights," they are incommensurable. The common property must be scalable and comparable, allowing for trade-offs. This creates a pressure to homogenize pleasure enough to make it calculable, which tensions with Desideratum 2.

  #### 4. Experiential Holism (The Fusion Constraint)
  **Requirement:** The account must distinguish between compound experiences where pleasures are merely co-occurring and those where they are fused into a singular hedonic gestalt.
  **Motivation:** Consider wine tasting. The gustatory sensation and the cognitive appreciation of the vintage's history often appear not as two separate pleasures happening simultaneously, but as one enriched experience. A theory that treats all pleasure as atomic sensations will misdescribe this as a conjunction of distinct states. Conversely, a theory that treats all complex pleasures as fused risks inability to analyze components for comparison. The account must specify conditions under which cognitive and sensory satisfactions integrate into a single token of $P$, rather than remaining a cluster of distinct tokens. This is crucial for accurately calculating total well-being in complex activities.

  #### 5. Diachronic Valence Plasticity (The Retrospective Drift Constraint)
  **Requirement:** The account must explain "retrospective valence drift" as an internal feature of pleasure's constitution, not an external memory error.
  **Motivation:** This is a niche but critical constraint. Agents often report that the hedonic quality of a past experience changes upon reflection (e.g., a challenging hike is remembered as more pleasurable than it felt during the exertion; a decadent indulgence is remembered as less pleasurable due to subsequent guilt or realization). Standard accounts treat this as memory distortion acting upon a fixed past hedonic fact. However, if the *value* of the experience for the agent is partly constituted by its integration into their narrative, the theory must allow that the hedonic status of an experience is not fully fixed at the moment of occurrence. The account must explain how a token of pleasure can possess a valence that is susceptible to systematic, non-arbitrary revision over time without denying that the experience was pleasurable *at the time*.

  ***

  ### The Central Tension: Heterogeneity vs. Commensurability

  There is a significant risk that **Desideratum 2 (Phenomenological Pluralism)** and **Desideratum 3 (Metric Unicity)** are jointly unsatisfiable.

  To satisfy Pluralism, the theory must acknowledge that the "feel" of malicious gossip, mathematical proof, and cool air are so distinct that no single phenomenological thread runs through them. To satisfy Unicity, the theory must assert there is a single scale on which these can be measured.
  *   If the common property is phenomenological (a specific feel), Pluralism is threatened (intellectual pleasure lacks the "feel").
  *   If the common property is non-phenomenological (e.g., satisfaction of desire), Unicity is threatened (how do we quantify the intensity of different desires on a single hedonic scale?).

  A successful theory must navigate this "Heterogeneity-Commensurability Dilemma" by identifying a property that is invariant enough to support calculation but flexible enough to accommodate radical phenomenological diversity.

  ***

  ### Brief Evaluation of Candidate Theories

  **Phenomenal-Character Theories**
  These posit that pleasure is a distinctive feeling or sensation.
  *   *Performance:* They satisfy Metric Unicity well (feelings have intensity) and handle Experiential Holism reasonably (feelings can blend).
  *   *Failure:* They struggle severely with Phenomenological Pluralism; there is no evidence of a common "pleasure sensation" across math and breezes. They also fail Retrospective Valence Plasticity, as they treat pleasure as a momentary, fixed qualitative state that cannot change once the moment passes.

  **Desire-Satisfaction Accounts**
  These posit that pleasure is the satisfaction of a pro-attitude or desire.
  *   *Performance:* They excel at Phenomenological Pluralism (any content can be desired) and Axiological Neutrality (one can desire bad things).
  *   *Failure:* They struggle with Metric Unicity (satisfying a trivial desire vs. a deep desire lacks a clear hedonic metric) and Experiential Holism (often reduces fusion to concurrent desire satisfactions). They handle Retrospective Valence Plasticity poorly, as the satisfaction fact is usually binary and fixed at the time of fulfillment.

  **Attitudinal Theories**
  These posit that pleasure is a matter of taking a positive attitude toward a state of affairs (being "pleased that").
  *   *Performance:* They handle Phenomenological Pluralism and Axiological Neutrality very well, as the attitude can be directed at anything.
  *   *Failure:* They risk becoming too cognitive, losing the "feel" required for Metric Unicity (how do we measure the intensity of an attitude?). However, they offer the best framework for Retrospective Valence Plasticity, as attitudes can be re-evaluated and re-held toward past states, allowing the hedonic value to shift internally without denying the original attitude occurred.
