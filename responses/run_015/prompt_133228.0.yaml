      *   *Desideratum 3: Commensurability (The Aggregation Constraint).* For hedonism to work as a normative theory (utilitarianism, prudential value), pleasures must be comparable and summable. You need to weigh the breeze against the proof.
      *   *Desideratum 4: Structural Unity (The Fusion Constraint).* Some experiences are mixed (wine tasting involves taste + knowledge). The theory must explain if this is one complex pleasure or two distinct ones occurring together. It needs to handle "gestalt" hedonic experiences.
      *   *Desideratum 5: Temporal Stability/Drift (The Retrospective Constraint).* This is the niche constraint. Memories of pleasure change valence over time (rosy retrospection or trauma-induced reframing). The theory needs to explain this as a feature of pleasure's constitution, not just a memory bug.
