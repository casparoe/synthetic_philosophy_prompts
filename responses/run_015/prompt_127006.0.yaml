  i've been trying to understand middle-range theory in archaeology—how you go from artifacts to social institutions using analogies. it seems like if you find standardized weights at a site, you infer a centralized redistribution system, but then you explain the weights by pointing to that same system. that's circular unless there's an independent check, which there rarely is for prehistoric societies, so aren't you really just smuggling ethnographic analagies in to break the loop? and if taphonomic bias can produce the same pattern without any institution behind it, doesn't that make these reconstructions basically unfalsifiable?
