answer: |-
  You have hit on one of the most persistent and damaging epistemological critiques in archaeological theory. Your skepticism is well-founded: **yes, if done poorly, middle-range theory (MRT) is exactly as circular and unfalsifiable as you describe.**

  However, the defense of MRT lies in how rigorous practitioners attempt to break that circle. Let's unpack your three main points: the circularity of inference, the reliance on ethnographic analogy, and the problem of equifinality (taphonomic bias).

  ### 1. The Circularity Charge
  You described the logic as: *Find weights $\rightarrow$ Infer Redistribution $\rightarrow$ Use Redistribution to explain Weights.*

  In logic, this is indeed *petitio principii* (begging the question). If the only evidence for the institution is the artifact, and the only explanation for the artifact is the institution, you have created a closed loop.

  **Binford's Intent vs. Practice:**
  Lewis Binford, who formalized MRT, intended it to be a "bridge" between static archaeological data (the remains) and dynamic past processes (the behavior). He argued we need independent knowledge of how behavior creates material patterns.
  *   **The Ideal:** We study modern hunter-gatherers (ethnoarchaeology) to see how their butchery practices create bone scatters. We establish a general law: *If* behavior X occurs, *then* pattern Y results. We then find pattern Y in the past and infer behavior X.
  *   **The Reality:** As you noted, archaeologists often skip the "general law" part. They assume a link between "standardized weights" and "state redistribution" based on a vague sense of plausibility rather than tested formation processes. When this happens, you are correct: it is circular reasoning dressed up as theory.

  ### 2. Smuggling in Ethnographic Analogy
  You asked: *"Aren't you really just smuggling ethnographic analogies in to break the loop?"*

  **Yes, but the question is whether the smuggling is covert or overt.**
  Alison Wylie, a philosopher of archaeology, has written extensively on this. She argues that analogy is unavoidable. We cannot think about the past without using concepts from the present. The problem isn't using analogy; it's using **uncritical** analogy.

  *   **Weak Analogy (The Smuggling):** "The Inca had weights and redistribution; this Andean site has weights; therefore, this site had Inca-style redistribution." This is historically specific and risky.
  *   **Strong MRT (The Check):** "Across 50 complex societies, standardized weights correlate with centralized storage facilities and settlement hierarchies. This site has weights, storage, and hierarchy. Therefore, centralization is the most probable explanation."

  The difference is **relational validity**. Rigorous MRT doesn't just say "A looks like B." It asks, "What are the causal mechanisms that link A and B, and do those mechanisms apply here?" If you can't articulate the mechanism (e.g., how a bureaucracy enforces weight standardization), the analogy is indeed just smuggling.

  ### 3. Equifinality and Falsifiability
  Your point about taphonomic bias is the strongest critique. This is the problem of **equifinality**: different processes can produce the same material result.
  *   *Scenario A:* Standardized weights exist because a state enforced them (Redistribution).
  *   *Scenario B:* Standardized weights exist because a specific clay source was used for all tokens, and they hardened uniformly (Taphonomy/Production bias).
  *   *Scenario C:* Standardized weights exist because they were traded from a distant state, but used locally for gambling, not taxation (Exotic adoption).

  If you only look at the weights, the reconstruction **is unfalsifiable.**

  **How Archaeology Attempts to Solve This:**
  Archaeologists combat equifinality not through single artifacts, but through **concordance of evidence** (convergence). A robust reconstruction of "Centralized Redistribution" requires a "package" of evidence that makes alternative explanations increasingly unlikely:
  1.  **Weights:** (The artifact in question).
  2.  **Storage Architecture:** Large-scale granaries inconsistent with household needs.
  3.  **Settlement Hierarchy:** A pyramid of site sizes suggesting administrative layers.
  4.  **Isotopic Data:** Evidence that people in the hinterland were eating grain grown in the center (or vice versa), indicating movement of goods.
  5.  **Sealings/Bullae:** Administrative devices controlling access to the storage.

  If you find the weights but *no* storage, *no* hierarchy, and *no* sealings, the redistribution model is falsified (or at least severely weakened). The model becomes falsifiable when it makes **risky predictions** about what *else* should be in the ground if the theory is true.

  ### The Verdict
  You are right to be suspicious. Much of the "grand narrative" archaeology of the 20th century (especially Processual Archaeology) fell into the trap you identified. They treated probabilistic correlations as deterministic laws.

  However, modern archaeology has shifted in response to critiques like yours:
  1.  **Bayesian Approaches:** Instead of saying "This proves redistribution," archaeologists now calculate probabilities. "Given the weights, the storage, and the hierarchy, Model A is 85% more likely than Model B."
  2.  **Taphonomic Rigor:** Before inferring social behavior, there is a mandatory step of ruling out natural formation processes (bioturbation, erosion, deposition).
  3.  **Reflexivity:** Archaeologists now explicitly state their analogical basis. "We are using Mesopotamian parallels because..." rather than pretending the inference is objective truth.

  **Summary:**
  Middle-range theory is not a magic machine that turns pots into politics. It is a method for managing uncertainty. If an archaeologist uses MRT to claim a single artifact proves a social institution without addressing equifinality or providing contextual concordance, **they are doing bad science.** But if they use it to build a constrained, probabilistic model that survives attempts at falsification by alternative taphonomic or social explanations, it is the best tool we have.

  Your intuition that the loop is circular without independent checks is correct. The "independent check" is supposed to be the rest of the archaeological context and rigorous ethnoarchaeological study, but too often, it is indeed just an unexamined assumption.
