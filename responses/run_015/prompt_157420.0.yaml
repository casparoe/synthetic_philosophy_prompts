prompt: |-
  I'm a phd student in aesthetics and i'm running a session next week for an undergrad/grad reading group on Du Bois's propaganda thesis—specifcally the claim in Criteria of Negro Art that all art is propoganda and Black artists shouldn't chase 'art for art's sake.' The audience has mostly read Souls of Black Folk but not the Criteria essay, so they know the sorrow songs but not his polemical framing. Don't explain the thesis to me; plan how I should teach it.

  What order do the pieces have to go in so they don't just hear 'propaganda = bad Soviet posters'? What's the one concrete example—probably one of the sorrow songs or maybe a reference to a specific visual work—that should carry the whole session, and what must it have (beauty + political work visible at once) and lack (pure didacticism without aesthetic form)?

  I'm expecting they form at least three misconceptions: that Du Bois rejects beauty for politics, that he means propaganda in teh modern manipulative sense, and that he's just saying Black art should be political like a billboard. Where exactly in the sequence do I head each one off?

  Also I want to sit them with a gap he never resolves: he distinguishes propaganda for justice from propaganda for evil but never gives the criterion, and I think the best teaching moment is letting them feel that absence rather than papering over it. So what's the dependency chain—what idea has to land before they can even see the gap? What's a check question at the end that shows whether they understand the collapse of beauty and propaganda rather than just parroting the thesis? And what should I openly refuse to cover—maybe the Black Arts Movement comparison, or the full history of 'art for art's sake'—and say so?

  Plan it out: the sequence with dependencies, the carrying example and its design specs, the misconception map with deflection points, the check, and the explicit omissions.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** PhD student in aesthetics.
      *   **Task:** Plan a reading group session on W.E.B. Du Bois's "Criteria of Negro Art" (specifically the "all art is propaganda" thesis).
      *   **Audience:** Undergrad/Grad mix. Have read *Souls of Black Folk* (know Sorrow Songs), but *not* "Criteria."
      *   **Constraints:** Do *not* explain the thesis to the user (they know it). Focus on pedagogy/sequencing.
      *   **Key Goals:**
          *   Avoid the "Soviet poster/billboard" reduction of propaganda.
          *   Select *one* concrete example (Sorrow Song or visual) that embodies Beauty + Political Work simultaneously (no pure didacticism).
          *   Address three specific misconceptions (Beauty vs. Politics, Modern "manipulative" propaganda, Art as Billboard).
          *   Highlight a specific unresolved gap (Justice vs. Evil propaganda criterion) without resolving it.
          *   Define dependencies (what must land before the gap is visible).
          *   Create a specific "check question."
          *   Define explicit omissions (what *not* to teach).

  2.  **Deconstruct the Thesis & Context:**
      *   Du Bois's claim: "All Art is propaganda and ever must be."
      *   Context: 1926, Harlem Renaissance, debate with Locke (who leaned more toward aesthetic autonomy/universalism) and the general "Art for Art's Sake" tradition.
      *   Nuance: Du Bois isn't saying "make bad art with a message." He's saying "even art that claims no message *is* messaging (usually status quo), so Black artists should consciously message for justice *while maintaining beauty*."
      *   The Gap: He asserts the rightness of propaganda for "the right cause" but offers no philosophical criterion for distinguishing "just" propaganda from "unjust" propaganda other than an appeal to Truth/Justice/Goodness which are themselves contested.

  3.  **Select the Carrying Example:**
      *   *Option A: Visual Art (Aaron Douglas, etc.).* Good, but audience knows *Souls* better.
      *   *Option B: Sorrow Songs.* They know this. It fits Du Bois's own primary example of Black aesthetic achievement.
      *   *Selection:* **"Nobody Knows the Trouble I've Seen."**
      *   *Why?* It's in *Souls*. It has undeniable aesthetic beauty (melody, harmony, emotional depth). It has undeniable political content (suffering, resistance, humanity). It is *not* a billboard (it doesn't say "Vote Lincoln"). It is *not* purely abstract (it's not just "pretty sounds").
      *   *Design Specs:* Must show how the *beauty* is the vehicle for the *truth*. If it were just a scream, it wouldn't travel. If it were just a hymn without the "trouble," it wouldn't be Black art in Du Bois's sense.

  4.  **Sequence & Dependencies:**
      *   *Problem:* If I start with "All art is propaganda," they tune out (Misconception 1 & 2).
      *   *Solution:* Start with the aesthetic experience they already know (*Souls*), then reveal the political engine, then generalize to the thesis.
      *   *Step 1: Reactivate *Souls*.* Remind them how Du Bois treats the Songs there (as transcendent beauty).
      *   *Step 2: Introduce "Criteria" Shock.* Drop the "All art is propaganda" quote.
      *   *Step 3: Reconcile via the Example.* Use the Song to show how Beauty *is* the Propaganda.
      *   *Step 4: The Gap.* Once they accept the union, ask *why* this specific propaganda is good.
      *   *Misconception Deflection:*
          *   *Beauty vs. Politics:* Address early via the Song.
          *   *Manipulative Propaganda:* Address when defining terms (contrast with "lie").
          *   *Billboard/Didacticism:* Address when analyzing the Song's form.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Opening:* Don't lecture. Ask them about *Souls*. How did they feel about the Songs? (Beauty).
      *   *The Turn:* Reveal "Criteria." Read the famous line. Let the tension sit.
      *   *The Example:* "Nobody Knows the Trouble I've Seen." Analyze it. Is it beautiful? Yes. Is it political? Yes. Does it sacrifice one for the other? No.
      *   *Misconception 1 (Beauty vs. Politics):* Deflect here. Du Bois demands *both*. "I do not care a damn for any art that is not used for propaganda." BUT he also says "it must not be merely propaganda." (Wait, check quote). Actually, he says "I do not care a damn for any art that is not used for propaganda," but immediately qualifies that it must be *good* art. The tension is key.
      *   *Misconception 2 (Manipulation):* Define Du Bois's "Propaganda." It's about *persuasion toward truth*, not deception. Contrast with "lying."
      *   *Misconception 3 (Billboard):* The Song isn't a slogan. It requires aesthetic engagement to work.
      *   *The Gap:* He says propaganda for "the right." What determines the right? He appeals to universal Good/Truth. But who defines that?
      *   *Check Question:* Needs to test if they see the *fusion*, not just the addition.
      *   *Omissions:* Black Arts Movement (too anachronistic), Locke's full counter-argument (distracts from Du Bois's internal logic), Kantian aesthetics deep dive (too technical).

  6.  **Refining the Dependencies:**
      *   To see the Gap, they must first accept the Premise (Art = Propaganda).
      *   To accept the Premise, they must reject the "Billboard" definition.
      *   To reject "Billboard," they need the Concrete Example.
      *   *Chain:* Example -> Redefinition of Propaganda -> Acceptance of Thesis -> Identification of Gap.

  7.  **Final Polish:**
      *   Ensure tone is appropriate for a PhD student leading a group (collegial but structured).
      *   Make sure the "Check Question" is sharp.
      *   Ensure the "Omissions" are justified pedagogically.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally explain the thesis to the user. Keep the focus on *how* to teach it.
      *(Refining the Example)*: "Nobody Knows the Trouble I've Seen" is good, but "The Meaning of the Sorrow Songs" chapter in *Souls* is where they met it. I should explicitly link their prior reading to this new text.
      *(Refining the Gap)*: The gap isn't just "what is justice?" It's that Du Bois relies on a universalist aesthetics to ground his particularist politics, but doesn't explain how to verify that universality. I need to make sure the plan highlights *that* specific tension.

  8.  **Finalizing the Structure:**
      1.  Sequence/Dependencies.
      2.  Carrying Example Specs.
      3.  Misconception Map.
      4.  The Gap (Dependency & Reveal).
      5.  Check Question.
      6.  Explicit Omissions.

      *Let's write it.*
answer: |-
  Here is a session plan designed to move your group from their existing knowledge of *Souls* into the polemical friction of "Criteria," managing the specific misconceptions and the unresolved philosophical gap you identified.

  ### 1. The Sequence & Dependency Chain

  You cannot start with the thesis statement. If you open with "All art is propaganda," the modern definition of *propaganda* will hijack the room immediately. You must build a bridge from their experience of *Souls* to the argument in "Criteria."

  **Phase 1: Reactivation (15 mins)**
  *   **Activity:** Ask the group to recall the "Sorrow Songs" chapter in *Souls*. Ask: *How did Du Bois describe the music there? Was it political? Was it beautiful?*
  *   **Goal:** Establish that they already accept Du Bois's view that the Songs possess transcendent aesthetic value (*beauty*) while emerging from a condition of oppression (*politics*).
  *   **Dependency:** This creates the baseline intuition that Beauty and Politics are not mutually exclusive in Du Bois's thought.

  **Phase 2: The Shock (10 mins)**
  *   **Activity:** Distribute "Criteria." Have them read the paragraph containing: *"I do not care a damn for any art that is not used for propaganda."*
  *   **Goal:** Create cognitive dissonance. This sounds like a betrayal of the *Souls* reverence for the Songs as pure expression.
  *   **Dependency:** They need to feel the tension before you resolve it.

  **Phase 3: The Synthesis via Example (30 mins)**
  *   **Activity:** Apply the "Criteria" lens to the Sorrow Songs (see *Carrying Example* below).
  *   **Goal:** Show that the "propaganda" *is* the beauty, not a message attached to it.
  *   **Dependency:** This resolves Misconceptions 1 & 3 (Beauty vs. Politics; Billboard).

  **Phase 4: The Definition Shift (15 mins)**
  *   **Activity:** Contrast Du Bois's "propaganda" with "lying."
  *   **Goal:** Resolve Misconception 2 (Manipulation).
  *   **Dependency:** This must happen *after* they see the example, or it will feel like semantic hair-splitting.

  **Phase 5: The Gap (20 mins)**
  *   **Activity:** Interrogate the criterion for "Justice."
  *   **Goal:** Expose the unresolved universalism.
  *   **Dependency:** They must accept the Premise (Art = Propaganda) before they can question the *Direction* of that Propaganda.

  ---

  ### 2. The Carrying Example: "Nobody Knows the Trouble I've Seen"

  Do not use a visual work (like Aaron Douglas) or a later protest song. Use the text they already know.

  **Why this piece?**
  It is the perfect fulcrum because it is undeniably aesthetic (melodic complexity, emotional resonance) and undeniably political (testimony of suffering), yet it contains no specific policy demand.

  **Design Specs for the Discussion:**
  *   **Must Have (Beauty + Work):** Point out that the song's *power* to generate sympathy (the political work) is entirely dependent on its *melodic beauty*. If it were a spoken statement ("Slavery was hard"), it would not travel across the color line. The beauty *is* the vehicle of the propaganda.
  *   **Must Lack (Pure Didacticism):** Ensure the group sees that the song does not say "Vote Republican" or "End Jim Crow." It asserts *humanity* through the expression of *grief*.
  *   **The Teaching Move:** Ask: *If you strip the melody and keep the lyrics, is it still art? If you keep the melody but change the lyrics to 'Nobody Knows the Joy I've Seen,' is it still the same Black art?*
      *   *Desired Outcome:* They realize the political truth is embedded in the aesthetic form, not just the semantic content.

  ---

  ### 3. Misconception Map & Deflection Points

  Here is where you intervene in the sequence to stop the conversation from derailing.

  | Misconception | The Fear | Deflection Point (When/How) |
  | :--- | :--- | :--- |
  | **1. Beauty vs. Politics** | "Du Bois wants us to sacrifice aesthetic quality for political messaging." | **Phase 3 (Example).** When analyzing the Sorrow Song, insist that Du Bois calls the Songs *great art*. He is not asking for *worse* art; he is asking for art that refuses to be *neutral*. Quote: "It is the bounden duty of black America to begin this great work of the creation of Beauty..." |
  | **2. Modern 'Propaganda'** | "Propaganda means lies, manipulation, or Soviet-style brainwashing." | **Phase 4 (Definition).** Distinguish *propaganda* from *lying*. For Du Bois, propaganda is the inescapable social function of art. Even "Art for Art's Sake" is propaganda *for the status quo*. The choice is not Propaganda vs. Truth; it is Propaganda for Justice vs. Propaganda for Evil. |
  | **3. The Billboard** | "Black art should be a slogan or a political pamphlet." | **Phase 3 (Example).** Use the Song again. A billboard demands immediate action. The Song demands *recognition*. Du Bois wants art that makes the white world *feel* the humanity of Black people, which requires aesthetic complexity, not slogans. |

  ---

  ### 4. The Gap: Justice vs. Evil

  This is the critical philosophical tension. Du Bois writes: *"I would not be a liar if I were not a propagandist... But I do wish to be a propagandist for the right."*

  **The Dependency:**
  They cannot see this gap until they accept that **all** art is propaganda. If they still believe "pure art" exists, they will think the solution is just to retreat to purity. You must force them to admit that *retreating to purity is also a political stance* (propaganda for the status quo).

  **The Reveal:**
  Once they accept that neutrality is impossible, ask: *Du Bois claims we can distinguish propaganda for 'the right' from propaganda for 'evil.' On what grounds?*
  *   He appeals to "Truth," "Justice," and "Goodness."
  *   **The Problem:** He offers no criterion for how we identify these universals outside of our own situated perspectives. He assumes a universal humanism that his own sociology (the Color Line) suggests is fractured.

  **Teaching Move:** Do not resolve this. Do not offer a Rawlsian or Marxist solution. Let the silence sit. The point is to show that Du Bois's aesthetics rest on a moral universalism that his politics complicate.

  ---

  ### 5. The Check Question

  Do not ask: "What is Du Bois's thesis?" (They will parrot: "Art is propaganda.")
  Do not ask: "Why does Du Bois reject Art for Art's Sake?" (They will say: "Because it's useless.")

  **Ask this:**
  > *"If a white supremacist creates a beautiful film that effectively persuades viewers of racial hierarchy, does this satisfy Du Bois's criteria for Art? Why or why not?"*

  **What this tests:**
  *   If they say **"Yes, it's art but bad propaganda,"** they understand the separation of form and function (Misconception 1 cleared).
  *   If they say **"No, because it's a lie,"** they understand Du Bois's link between Truth and Beauty (Misconception 2 cleared).
  *   If they say **"No, because it lacks the 'universal' humanism Du Bois assumes,"** they have spotted the Gap (The Criterion Problem).
  *   **Ideal Answer:** "It satisfies the formal requirement (beauty) and the functional requirement (propaganda), but it fails the *moral* criterion Du Bois asserts without defining. It exposes the risk in Du Bois's thesis: if all art is propaganda, the only defense against fascist art is a shared agreement on 'Justice' that Du Bois assumes but doesn't prove."

  ---

  ### 6. Explicit Omissions

  State these at the start to manage expectations and keep the scope tight.

  1.  **The Black Arts Movement (BAM):**
      *   *Say:* "We are not tracing the lineage to Baraka or the BAM slogan 'All art is propaganda.' That is a different historical moment with different materialist commitments. We are staying in 1926 with Du Bois's idealism."
      *   *Why:* BAM comparisons often reduce Du Bois to a proto-nationalist, obscuring his universalist humanism which is central to the "Gap."

  2.  **Alain Locke's Counter-Argument:**
      *   *Say:* "I am not teaching Locke's 'New Negro' aesthetic autonomy today. We are looking at Du Bois's internal logic, not the debate between him and Locke."
      *   *Why:* Introducing Locke too early allows students to "solve" the tension by siding with Locke (Art *should* be autonomous). You want them to sit inside Du Bois's discomfort.

  3.  **Kantian 'Disinterestedness' Deep Dive:**
      *   *Say:* "We are treating 'Art for Art's Sake' as a historical slogan, not analyzing its Kantian roots."
      *   *Why:* Your audience knows *Souls*, not the *Critique of Judgment*. Aesthetic theory jargon will distract from the political-aesthetic fusion you want them to feel.
