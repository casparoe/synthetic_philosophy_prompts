answer: |-
  ### The question

  Consider Lewis's triviality proof for The Equation: $P(A \to C) = P(C|A)$. The standard six-step derivation relies on applying The Equation to conditionalized credence functions ($P_C$ and $P_{\neg C}$). A student proposes the **Anchored Thesis**: The Equation constrains only your *actual* credence function $P$, not any function resulting from learning. Thus, steps applying The Equation to $P_C$ are illegitimate.

  (a) Identify precisely which step(s) of the standard proof the Anchored Thesis blocks and explain why. (5 marks)

  (b) Show that if The Equation is a standing norm and you accept Bayesian Conditionalization ($P_{new}(\cdot) = P_{old}(\cdot|E)$), triviality returns diachronically. (5 marks)

  (c) Assume your language allows conditionals in consequent position and satisfies **Exportation**: $(X \land Y) \to Z \equiv X \to (Y \to Z)$. Prove that triviality follows from The Equation applied to $P$ *alone*, without invoking $P_C$. Show all steps, assuming $P(A \land C), P(A \land \neg C) > 0$. (10 marks)

  (d) If the Anchored proponent denies Exportation or embedding to avoid (c), what is the cost? Address the Ramsey Test, semantic content, and whether The Equation remains a norm or becomes a coincidence. (10 marks)

  ***

  ### What it's actually testing

  This question targets the structural dependencies of the triviality result, not the memorised sequence. A rote learner knows the six steps but often conflates $P_C$ (the new function) with $P(\cdot|C)$ (a value from the old function). Part (a) tests this distinction. Part (b) tests understanding of diachronic coherence. Part (c) is the discriminator: it requires constructing a *new* triviality proof using Exportation to bypass the Anchored restriction, demonstrating mastery of how logical closure interacts with probability constraints. Part (d) tests philosophical synthesis: recognising that avoiding triviality via non-propositionalism sacrifices truth-conditional semantics and turns The Equation from a law of thought into a local constraint.

  ***

  ### Model answer

  **(a)** The Anchored Thesis blocks **Steps 3 and 4**. In the standard proof, Step 3 asserts $P_C(A \to C) = P_C(C|A)$. This applies The Equation to the conditionalized function $P_C$. The Anchored Thesis holds The Equation constrains only the actual function $P$. Since $P_C$ is a counterfactual function (what I would believe if I learned $C$), the Anchored proponent denies The Equation applies to it.

  **(b)** If The Equation is a standing norm, any rational future credence function must satisfy it. If I learn $C$, my new function $P'$ is $P_C$. By the norm, $P'(A \to C) = P'(C|A)$. Since $P'$ assigns 1 to $C$, $P'(C|A)=1$, so $P'(A \to C)=1$. By Total Probability, my current credence $P(A \to C)$ is the expectation of my future credence. $P(A \to C) = P(A \to C | C)P(C) + P(A \to C | \neg C)P(\neg C)$. If I expect to satisfy the norm upon learning, $P(A \to C | C)=1$ and $P(A \to C | \neg C)=0$. Thus $P(A \to C) = P(C)$, restoring triviality.

  **(c)** We derive $P(A \to C | C) = 1$ and $P(A \to C | \neg C) = 0$ using only $P$, Exportation, and The Equation.
  1.  **For C:** By The Equation on pair $(C, A \to C)$: $P(C \to (A \to C)) = P(A \to C | C)$.
      By Exportation: $C \to (A \to C) \equiv (C \land A) \to C$.
      $(C \land A) \to C$ is logically valid, so $P((C \land A) \to C) = 1$.
      Therefore, $P(A \to C | C) = 1$.
  2.  **For ¬C:** By The Equation on pair $(\neg C, A \to C)$: $P(\neg C \to (A \to C)) = P(A \to C | \neg C)$.
      By Exportation: $\neg C \to (A \to C) \equiv (\neg C \land A) \to C$.
      Apply The Equation again to pair $(\neg C \land A, C)$: $P((\neg C \land A) \to C) = P(C | \neg C \land A)$.
      By probability calculus, $P(C | \neg C \land A) = 0$ (assuming $P(\neg C \land A) > 0$).
      Therefore, $P(A \to C | \neg C) = 0$.
  3.  **Conclusion:** By Total Probability, $P(A \to C) = 1 \cdot P(C) + 0 \cdot P(\neg C) = P(C)$. By The Equation, $P(C|A) = P(C)$. Triviality holds.

  **(d)** Denying embedding/Exportation forces **non-propositionalism** (e.g., Adams). Conditionals lack truth conditions, so they cannot be embedded in Boolean contexts.
  *   **Ramsey Test:** It survives as a heuristic for *assertibility*, not a semantic clause for truth.
  *   **Semantics:** She abandons truth-conditional semantics for 'if'. The connective is not a propositional operator.
  *   **Norm vs Coincidence:** The Equation becomes a synchronic coherence constraint on *degrees of belief*, not a law relating truth and probability. It risks becoming a coincidence of the current state: she predicts her future self (who learns $C$) will violate The Equation regarding $A \to C$, as that conditional will no longer have a probability defined by the Equation in the same way. This weakens its normative force significantly.

  ***

  ### Marking scheme

  1.  **Premise Identification (5 marks):** Correctly identifies Steps 3/4. (Deduct 3 if they say Step 1 or 5). Must note $P_C$ is not $P$.
  2.  **Diachronic Restoration (5 marks):** Correctly uses expectation of future credence. (Deduct 3 if they confuse $P_C$ with $P(\cdot|C)$ again).
  3.  **Exportation Derivation (10 marks):** 4 marks for the $P(...|C)=1$ proof; 4 marks for the $P(...|\neg C)=0$ proof (must use Equation twice); 2 marks for Total Probability conclusion. (Deduct 5 if they use $P_C$ anywhere).
  4.  **Philosophical Cost (10 marks):** 4 marks for non-propositionalism/embedding ban; 3 marks for Ramsey Test qualification; 3 marks for norm/coincidence distinction. (Deduct 4 if they claim Ramsey Test is lost entirely).
  5.  **Clarity/Notation (0 marks/Bonus):** Clear distinction between $P(\cdot|E)$ and $P_E(\cdot)$ throughout.

