answer: |-
  This is a classic "trivial model" objection, and it's a rite of passage for anyone working in the ontological models framework. You've essentially reconstructed an argument that Harrigan and Spekkens (and others before them) had to explicitly block when they formalized the definitions.

  The short answer is: **The half of the room calling "cheating" on Step (1) is technically correct within the framework, but your intuition on Step (4) is hitting on a deeper, legitimate meta-philosophical worry about the framework itself.**

  Here is the breakdown of where the argument breaks, why it looked fine to you, and what rejecting the "cheating" charge actually costs you metaphysically.

  ### 1. The Technical Failure: Step (1) violates the Mediation Assumption

  You wrote:
  > *Sure, λ* does no work, but nobody promised Λ had to do any work.*

  Actually, the Harrigan-Spekkens (HS) framework **does** promise that. That is the entire point of the "ontological" in "ontological models."

  Let's look at the probability rule for an ontological model:
  $$ \text{Pr}(k | M, P) = \int_\Lambda \xi(k | M, \lambda) \, d\mu(\lambda | P) $$

  In your Step (1), you set $\Lambda = \{\lambda^*\}$ and $\mu(\lambda | P) = \delta(\lambda^*)$ for all $P$.
  Substitute this into the integral:
  $$ \text{Pr}(k | M, P) = \xi(k | M, \lambda^*) $$

  Now, look at the left-hand side. By the Born rule, $\text{Pr}(k | M, P)$ depends on the preparation $P$ (specifically, on $|\psi\rangle$).
  Therefore, the right-hand side, $\xi(k | M, \lambda^*)$, **must depend on $P$**.

  But the definition of an ontological model requires that the response function $\xi$ depends **only** on the measurement $M$ and the ontic state $\lambda$. It cannot depend on the preparation $P$.

  **Why is this a "sin"?**
  It violates the **Mediation Assumption** (or Screening-Off condition). The ontic state $\lambda$ is supposed to be the *complete* physical state of the system that mediates the correlation between the preparation device and the measurement device.
  *   **Valid Model:** $P \to \lambda \to M$. (Correlation is screened off by $\lambda$).
  *   **Your Step (1):** $P \to M$ (directly), with $\lambda$ sitting in the middle doing nothing.

  If $\xi$ knows which $P$ was used, the measurement device is effectively "reaching back" to the preparation device, or the "ontic state" failed to capture the physical difference between the preparations. In HS terms, you haven't constructed a $\psi$-epistemic model; you've constructed a **non-local (in time) or contextual model** that violates the definition of an ontological model.

  So, Step (1) is not a valid ontological model. It is an operational model disguised as an ontological one.

  ### 2. Why it looked fine to you (The Philosophical Trap)

  You aren't stupid for missing this; the trap is that the HS framework is often presented as a "neutral language" for discussing realism, but it is **not neutral**. It builds in specific metaphysical commitments.

  You said:
  > *A property of a theory that you can make come out either true or false by a free choice of modelling vocabulary isn't a property of the theory.* (Step 4)

  This is a brilliant principle (let's call it the **Invariance Principle**). Your argument relies on the idea that the choice of $\Lambda$ is "free vocabulary."

  The HS framework replies: **The choice of $\Lambda$ is not free if you want to call it an "ontological model."**
  To count as an ontology, $\Lambda$ must satisfy the Mediation Assumption. Once you enforce Mediation, you can no longer construct the trivial $\psi$-epistemic model of Step (1).

  So, the "cheating" charge is essentially saying: *"You are using the vocabulary of ontological models while violating the grammar of ontological models."*

  ### 3. What rejecting the "Cheating" charge costs you

  If you side with the half of the room that said you were cheating, you are accepting the **Mediation Assumption** as a constraint on reality. Here is the cost:

  **Cost 1: You commit to Separability.**
  The Mediation Assumption implies that the physical state of the system ($\lambda$) is a property of the system *itself*, distinct from the preparation context. If you reject Mediation to save Step (1), you are essentially saying that the "state" of the system is inseparable from how it was prepared. This pushes you toward a form of **holism** or **contextualism** where "the state of the system" is not a well-defined concept independent of its history.

  **Cost 2: You concede that $\psi$-ontology is a model-property, not a theory-property.**
  This addresses your Step (4). Even if Step (1) is banned, Step (2) (the Beltrametti-Bugajski model) is valid. So we still have a $\psi$-ontic model. The PBR theorem argues that *under the assumption of Preparation Independence*, **only** $\psi$-ontic models are possible.
  If you accept the HS framework, you accept that "$\psi$-ontic" is a property of the *class of admissible models*.
  If you reject the HS framework (to save Step 1), you are rejecting the idea that we can analyze "reality" via $\Lambda$ and $\mu$ at all.

  ### 4. How to save Step (4) (The Real Devastating Argument)

  Your Step (4) is actually the strongest part of your position, even if Step (1) fails. You can reformulate the argument to attack the **significance** of the PBR theorem rather than the possibility of trivial models.

  **The Refined Argument:**
  1.  The HS framework defines "$\psi$-ontic" as "disjoint supports of $\mu$."
  2.  Whether $\mu$ has disjoint support depends on how we carve up $\Lambda$.
  3.  We can always define $\Lambda' = \Lambda \times \{\psi\}$ and embed any $\psi$-epistemic model into a $\psi$-ontic one (by making $\lambda$ carry the label $\psi$).
  4.  Conversely, we can often coarse-grain $\Lambda$ to create overlaps (unless forbidden by theorems like PBR).
  5.  Therefore, $\psi$-ontology is sensitive to the **granularity** of the ontic state space.
  6.  If the granularity of $\Lambda$ is not fixed by the physics but by the modeler, then "$\psi$-ontic" is a property of the **resolution of the model**, not the theory.

  **The Counter-Counter:**
  PBR anticipates this. PBR doesn't just say "supports are disjoint." It says "distinct quantum states correspond to disjoint regions of physical reality." The theorem uses **Preparation Independence** to rule out the "coarse-graining" tricks. If two systems are prepared independently, their joint $\lambda$ space is the product space. PBR shows that if you try to overlap the $\mu$'s in that product space, you get the wrong statistics.

  So, PBR *does* have weight, but only if you buy **Preparation Independence**.

  ### 5. Verdict and Recommendation

  **Which step to reject?**
  You must reject **Step (1)** as a valid ontological model. It violates the definition of the framework you are using. The response functions cannot depend on the preparation.

  **Why did it look fine?**
  Because you were treating $\Lambda$ as a passive label rather than a causal mediator. You were thinking of "ontological model" as "any mathematical structure that reproduces the stats," but HS means "a structure that reproduces the stats *via a separable physical state*."

  **What does this mean for your thesis?**
  Don't discard Step (4). It's the philosophical gold here. The debate isn't about whether Step (1) works (it doesn't). The debate is about whether the **Mediation Assumption** and **Preparation Independence** are justified constraints on reality.

  If you want to press the "verbal dispute" angle, argue this:
  *"The PBR theorem proves that $\psi$ is ontic **relative to the HS framework**. But the HS framework builds in a notion of separability (Mediation) and composition (Prep Independence) that quantum mechanics might not respect. If the world is holistic, $\Lambda$ might not factorize, and the distinction between $\psi$-ontic and $\psi$-epistemic collapses. Therefore, PBR proves $\psi$-ontology only for those who antecedently commit to a classical-like metaphysics of states."*

  That is a much harder argument for the "realist" half of your room to dismiss than the trivial model argument. It concedes the math but challenges the metaphysics.

  **Summary:**
  *   **Step (1):** Invalid (violates Mediation).
  *   **Step (4):** Insightful (highlights framework dependence).
  *   **The "Cheating":** Is actually a defense of the Mediation Assumption.
  *   **Your Move:** Pivot from "trivial models are possible" to "the constraints ruling out trivial models are substantive metaphysical assumptions, not neutral vocabulary."
