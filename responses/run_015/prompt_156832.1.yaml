answer: |-
  You are right to feel that the standard labels are slightly off. You have identified a specific *topology* of motivated reasoning that sits at the intersection of attribution theory, signaling theory, and identity-protective cognition. There is no single canonical noun phrase for this exact configuration, but there is a precise way to construct it from existing literature, and a strong case for coining a specific term for the *structure* you found.

  Here is the breakdown of what you are seeing, the nearest established concepts, and how to distinguish the mechanism experimentally.

  ### 1. The Diagnosis: Is it one thing or three?

  You are describing a single functional system with three distinct layers. It is helpful to disentangle them to find the right vocabulary.

  **Layer 1: The Behavioral Double Bind (The "No-Win" Structure)**
  *   **Observation:** Concession = Tactical; No Concession = Stubborn.
  *   **Established Concept:** **Asymmetric Behavioral Diagnosticity.**
      *   In attribution theory (e.g., Skowronski & Carlston, 1989; Reeder & Coovert, 1986), "diagnosticity" refers to how strongly a behavior points to a specific disposition.
      *   Your data shows that for the in-group, positive behaviors are high-diagnostic (prove good faith) and negative behaviors are low-diagnostic (explained away). For the out-group, this is reversed.
      *   **Why "Naive Realism" isn't enough:** Naive realism explains *why* they think the other side is wrong (they don't see reality). It doesn't explain why *no behavioral input* can update the model of the other side's *intent*.
      *   **Why "Ultimate Attribution Error" (Pettigrew) isn't enough:** That covers trait attribution (they are aggressive, we are assertive). You are looking at *strategic motive attribution* in real-time argumentation.

  **Layer 2: The Meta-Level Immunity (The "Accusation is Proof" Structure)**
  *   **Observation:** Pointing out the bias is read as bias.
  *   **Established Concept:** **Recursive Identity Protection** (or Defensive Meta-Cognition).
      *   This is an extension of the **Bias Blind Spot** (Pronin et al.). Usually, the blind spot means "I see your bias, not mine." You have found that the blind spot extends to the *process of correction itself*.
      *   In the literature on conspiracy theories, this is sometimes called **"Self-Sealing"** (the theory explains away counter-evidence). In polarization, it functions as a **Motivated Closure** of the epistemic channel. If admitting they were wrong about the other side's bad faith threatens their own group identity, then the *accusation* of bias becomes an attack on the group, thus proving the accuser is an enemy (bad faith).

  **Layer 3: The Cost Moderator (The "Break Condition")**
  *   **Observation:** Intra-group punishment breaks the immunity.
  *   **Established Concept:** **Costly Signaling Theory** (Zahavi; applied to pol psych by e.g., Jordan et al., 2021).
      *   This is the most critical part of your finding. It proves the system is not *actually* evidence-immune. It is **Asymmetrically Thresholded.**
      *   Participants *are* looking for evidence of good faith in the out-group, but the signal-to-noise ratio required to trigger a "good faith" attribution is impossibly high unless the signal is "costly" (i.e., the out-group member is punished by their own side for conceding).
      *   This moves the phenomenon from "delusion" to "hyper-skeptical signal detection."

  ### 2. Proposed Terminology

  Since no single term captures the *evidence-immune structure regarding motive*, I recommend using a composite label for your papers.

  **Option A (Technical): Asymmetric Diagnosticity of Intent.**
  This anchors you in attribution theory. It specifies that the *diagnostic value* of the behavior changes based on group membership.
  *   *Definition:* A cognitive pattern where identical behaviors possess high diagnosticity for positive motives when performed by the in-group, but near-zero diagnosticity when performed by the out-group, unless accompanied by high-cost signals.

  **Option B (Phenomenological): Attributional Immunity.**
  This captures the "no-possible-evidence" feel.
  *   *Definition:* A motivated reasoning state where attributions of bad faith are unfalsifiable by standard behavioral evidence, requiring costly signals to update.

  **Option C (The Coinage): The Good Faith Immunity Asymmetry.**
  If you want to own it.
  *   *Definition:* The phenomenon where out-group actors are held to an unfalsifiable standard of bad faith that is only penetrable by intra-group costly signaling, while in-group actors are granted an immunity to bad faith attributions regardless of behavior.

  ### 3. How it differs from nearest neighbors

  | Concept | What it captures | What it misses (Your contribution) |
  | :--- | :--- | :--- |
  | **Naive Realism** | "They are biased/ignorant." | Doesn't explain why *concession* doesn't update the bias judgment. |
  | **Hostile Media Effect** | "Neutral content looks biased." | Focused on *content* slant, not *motive* attribution of the author. |
  | **Motive Asymmetry** | "We are principled, they are selfish." | Describes the *outcome*, not the *evidence-immune structure* of the judgment. |
  | **Ultimate Attribution Error** | "Group-level FAE." | Usually about traits/character, not strategic argumentative moves. |
  | **Motivated Skepticism** | "Scrutinizing disagreeable info." | Doesn't capture the *meta-level* immunity (that pointing it out is also biased). |

  ### 4. Experimental Separation: Belief vs. Rule

  You asked how to separate "this person genuinely believes the other side argues in bad faith" from "this person is running an evidence-immune attribution rule."

  This is a distinction between a **Content Belief** (They are evil) and a **Process Rule** (I cannot trust them).

  **Design Recommendation: The "Cost x Anonymity" Matrix**

  To separate these, you need to manipulate whether the participant thinks the attribution protects their identity.

  *   **Condition 1 (Public/Identity Salient):** Standard pilot. Participant knows their response is linked to their political identity.
      *   *Prediction:* Strong Asymmetric Diagnosticity.
  *   **Condition 2 (Private/Identity Masked):** Participant answers anonymously, perhaps under a "cognitive task" cover story where political identity is not primed.
      *   *Prediction:* If it's a **Process Rule** (deep cognitive heuristic), the asymmetry persists even in private. If it's **Identity Protection** (motivated), the asymmetry should decrease significantly because there is no identity to protect.
  *   **Condition 3 (High Cost Signal):** Out-group author is explicitly described as being "censured by their party leaders" for the concession.
      *   *Prediction:* This is your moderator. If the attribution updates here, it confirms the mechanism is **Thresholded Signal Detection**, not fixed delusion.

  **Process Measures:**
  *   **Response Latency:** If they are running a flat rule ("Out-group = Bad Faith"), RT should be fast (heuristic). If they are genuinely evaluating evidence but finding it lacking, RT might be slower (reasoning).
  *   **Thought Listing:** Ask them *why* they rated the author as bad faith.
      *   *Rule:* "Because they are [Party X]."
      *   *Belief:* "Because they said X, which implies Y."

  ### 5. A Case That Would *Not* Count

  To define the edges of your concept, you need a boundary case.

  **The "Smoking Gun" Exception:**
  If the out-group author is caught in a verifiable, non-interpretive lie (e.g., they cite a statistic that is provably fabricated, and video evidence exists of them admitting they knew it was fake), and the participant *still* attributes this to "good faith error" or "miscommunication," **that is not your phenomenon.**

  *   **Why?** Your phenomenon is about *ambiguous* argumentative moves (concessions, framing) where motive is inferential.
  *   **Your Phenomenon:** Requires **Attributional Ambiguity.** If the behavior is objectively verifiable as malicious (not just interpretable as such), and the immunity *still* holds for the *in-group* (we forgive the lie) but breaks for the *out-group* (they are liars), that is standard **In-Group Favoritism**.
  *   **Your Specific Phenomenon:** Requires that the *same ambiguous behavior* routes to opposite verdicts based *solely* on the label of the author, AND that the verdict is resistant to counter-argument (meta-immunity).

  **The Non-Example:**
  A participant who says, "I know they are arguing in good faith, I just disagree with them."
  *   This participant has **High Political Tolerance** but **High Disagreement.** They do not exhibit Attributional Immunity. They are capable of updating the motive attribution even while maintaining the policy disagreement.

  ### Summary for your Supervisor

  If you need to justify this to your supervisor, frame it this way:
  *"I am examining the **diagnosticity conditions** of motive attribution in polarized contexts. While the **Ultimate Attribution Error** predicts negative out-group traits, my data suggests a more rigid **Attributional Immunity** where behavioral evidence is rendered non-diagnostic for the out-group unless it meets **Costly Signaling** thresholds. This extends **Motivated Skepticism** into the meta-cognitive layer, where the correction mechanism itself is neutralized."*

  This positions you not as "finding a new bias," but as specifying the *boundary conditions and structural topology* of existing attributional biases in a way that explains the resilience of affective polarization.
