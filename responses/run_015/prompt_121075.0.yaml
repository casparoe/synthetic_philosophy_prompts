  7.  **Self-Correction during drafting:** I initially thought about focusing heavily on the Hosenfeld scene. But the user is asking about the *liquidation* and *stripping of names*. I need to pivot more toward the Ghetto scenes and the bureaucratic dehumanization (armbands, numbers) to match the "population displacement" vs. "genocide" administrative conflict. The piano is important, but as a symbol of what remains *after* the social destruction. I need to emphasize the *process* of erasure.

