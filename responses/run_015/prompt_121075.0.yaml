      *   *The "Resists" aspect:* Where does the film push back? It pushes back against the *legal* need for "specific intent" by showing the *effect* is total erasure regardless of bureaucratic classification. It also resists making Szpilman a representative symbol; he is a fragment of a broken whole.

  6.  **Final Review against User Prompt:**
