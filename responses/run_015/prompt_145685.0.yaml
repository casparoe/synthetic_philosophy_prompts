  ### 1. The Rule She's Actually Running
  **The "Biological Continuity" Model**

  Your friend isn't winging it; she's accidentally arguing for a view of identity that treats objects like living organisms. Her verdicts map perfectly onto how we judge biological life:

  *   **Gradual replacement (Verdict 1):** Like human cells replacing themselves over 7 years. The process is continuous, so the identity survives. (**Same**)
