answer: |-
  **1. Exam Question**

  **MIDTERM EXAMINATION: PHILOSOPHY OF WORK (PHIL 350 / LR 350)**
  **Time Allowed:** 45 Minutes
  **Instructions:** This is a closed-book examination. Do not appeal to actual labor laws, court cases, or legal doctrines from any real-world jurisdiction. Answer based solely on the philosophical principles and the hypothetical scenario provided below.

  **Scenario:**
  In the Republic of Laboria, a large distribution warehouse employs 300 workers. Their collective agreement has expired, and negotiations have stalled over a new scheduling algorithm that reduces predictability. The employment contract is silent on many daily practices. For years, workers have informally provided "flexibility": staying late during rushes, answering messages off-shift, and skipping redundant safety checks to maintain speed. This flexibility is not in the written handbook but is expected by management.

  Upon expiration of the contract, the workers launch a "work-to-rule" campaign. They adhere strictly to the written handbook, refusing all uncoded flexibility. Throughput drops by 40%. Management responds by deducting pay, claiming "partial performance." Workers then escalate to a full walkout. They establish a picket line. Of the agency temps hired to replace them, most turn back after speaking with picketers, but one temp crosses the line to work.

  **Question:**
  Many students argue that strikes are morally justified simply because workers own their labor and may withdraw it at will (the **Withdrawal Model**).

  (A) Explain why the Withdrawal Model is insufficient to justify the workers' actions in this scenario, particularly regarding the pay deductions for work-to-rule. Propose an alternative philosophical grounding for the strike (e.g., Countervailing Power, Reciprocity, or Voice). (10 points)

  (B) Using your alternative grounding, evaluate two specific features of the strike: (1) the moral status of the work-to-rule campaign given the incomplete contract, and (2) the moral status of the picket line persuading the temps to turn back versus the one temp who crossed. (10 points)

  (C) Based on your account in (A) and (B), does the right to organize imply merely a right of association, or must it include a right to employer recognition and bargaining? Explain why. (5 points)

  ***

  **2. Model Answer**

  **Heuristic for Graders:** A passing answer must treat the strike as a collective mechanism for bargaining power, not merely an aggregation of individual property rights over labor.

  The Withdrawal Model posits that because workers own their labor-power, they may withhold it without further justification. While true as a baseline property claim, this model fails to address the specific leverage mechanisms used in this scenario. If the strike were merely a sum of individual withdrawals, management's deduction of pay for "partial performance" during the work-to-rule phase would be unproblematic; under a strict contract view, if the worker performs the coded duties, they are owed full pay. The Withdrawal Model cannot explain why withholding *uncodified* flexibility constitutes a legitimate bargaining tactic rather than a breach of implied duty. Furthermore, the Withdrawal Model struggles to justify the picket line's exclusionary effect. If a temp owns their labor and chooses to sell it to the employer, a pure withdrawal model offers no grounds for workers to interfere with that voluntary exchange. Therefore, we must ground the strike in a **Countervailing Power Model**.

  Under the Countervailing Power Model, the strike is not just a withdrawal of labor but a temporary suspension of the normal hierarchy to restore bargaining parity. Employment relationships rely on incomplete contracts; throughput depends on the workers' gift of flexibility, not just the handbook. Because management captures the surplus value generated by this flexibility, workers are entitled to withhold it to force a renegotiation of terms. The pay deduction for work-to-rule is unjust because it attempts to monetize the withdrawal of a gift that was never contractually guaranteed. The leverage here is not the absence of bodies, but the absence of goodwill. This justifies the work-to-rule campaign as a corrective to the employer's reliance on uncompensated, informal labor.

  This grounding also clarifies the status of replacement workers. The picket line is not merely an announcement of a walkout; it is a plea for solidarity to maintain the leverage necessary for countervailing power. If replacements easily fill the gap, the power parity is never restored, and the bargaining mechanism fails. Persuading temps to turn back is morally permissible because it protects the collective capacity to bargain. The temp who crosses the line is exercising individual liberty, but in doing so, they undermine the collective mechanism required to rectify the power imbalance. While we may not condemn the individual temp morally, the union is justified in treating their presence as an obstruction of justice within the bargaining context. The strike's legitimacy relies on its effectiveness, which requires limiting the employer's ability to bypass the collective.

  Finally, this account dictates the scope of the right to organize. If the strike is a tool for countervailing power, a right to mere association is insufficient. If an employer can legally refuse to recognize the union or decline to bargain, the threat of a strike becomes empty; the employer can simply wait out the workers or hire replacements without penalty. For the countervailing power to function, the right to organize must include a duty on the employer to recognize the collective agent and bargain in good faith. Without recognition, the "power" in countervailing power is illusory, and the incomplete contract remains tilted permanently toward management. Thus, the moral right to organize entails an institutional right to be heard, not just a right to gather.

  ***

  **3. Marking Scheme**

  **Total Points:** 25
  **Grading Heuristic:** If the answer treats the strike as merely the sum of individual refusals to work, it has missed the point.

  | **Must-Hit Point** | **Points** | **Common Error** |
  | :--- | :--- | :--- |
  | **1. Critique of Withdrawal Model:** Explicitly identifies that labor ownership does not explain the legitimacy of work-to-rule or picketing. | 5 | Asserting ownership is sufficient without addressing the "partial performance" deduction. |
  | **2. Alternative Grounding:** Clearly articulates a non-withdrawal model (e.g., Countervailing Power, Reciprocity, Voice). | 5 | Vaguely referencing "fairness" without defining the structural relationship. |
  | **3. Work-to-Rule Analysis:** Argues that flexibility is an uncodified gift, making its withdrawal legitimate despite the pay deduction. | 5 | Treating the handbook as the complete moral boundary of the job. |
  | **4. Replacement/Picket Analysis:** Explains why limiting replacements is necessary for the chosen model (leverage/parity) vs. individual liberty. | 5 | Claiming picketing is wrong because it restricts the temp's freedom to work. |
  | **5. Right to Organize:** Concludes that association requires recognition/bargaining to be meaningful. | 5 | Arguing association is enough as long as workers can quit individually. |

  **Grade Descriptors:**

  *   **A (23–25 pts):** Seamlessly integrates the alternative grounding into both the work-to-rule and replacement worker analyses; explicitly connects the need for leverage to the requirement for employer recognition in Part C.
  *   **B (18–22 pts):** Identifies the correct models and hits all five points, but the connection between the philosophical grounding and the specific scenario details (e.g., the 40% throughput drop) is mechanical or underdeveloped.
  *   **C (15–17 pts):** Relies partially on the Withdrawal Model; misses the nuance of the incomplete contract or treats the picket line solely as a freedom-of-speech issue rather than a leverage mechanism.
  *   **D/F (<15 pts):** Fails to propose an alternative model; appeals to real-world labor law; or ignores significant parts of the prompt (e.g., skips Part C).
