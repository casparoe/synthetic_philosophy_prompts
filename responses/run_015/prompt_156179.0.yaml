answer: |-
  Here is a disambiguation of the slogan "all art is propaganda" as it pertains to W. E. B. Du Bois's *Criteria of Negro Art* (1926) and its contemporary deployment in your seminar.

  1.  **The Universal Descriptive Thesis**
      *   **Claim:** Every artwork, regardless of origin or intent, causally produces political effects and shapes social ideology.
      *   **Platitude?** Borderline. It is trivially true that art exists in a social context, but false that every artwork meaningfully shifts political ideology.
      *   **Philosophically Defensible?** Weakly. It conflates "having conditions of production" with "functioning as political rhetoric."
      *   **Supports the move to "Complicit in Domination"?** **No.** Even if art has effects, a lack of *explicit* message does not logically entail support for *domination*; it could entail support for the status quo, neutrality, or effects unrelated to hierarchy.
      *   **Debate Ender?** No. This is usually a premise for further discussion, not a conclusion.

  2.  **The Universal Normative Thesis**
      *   **Claim:** All artists, in all contexts, have a moral obligation to prioritize political messaging over aesthetic autonomy.
      *   **Platitude?** No. This contradicts centuries of aesthetic theory.
      *   **Philosophically Defensible?** Poorly. It instrumentalizes art to the point of dissolving the category of "art," and it ignores the value of non-instrumental human expression.
      *   **Supports the move to "Complicit in Domination"?** **Yes.** If political messaging is a moral duty, then failing to provide an explicit message is a moral failure that benefits the oppressor by default.
      *   **Debate Ender?** **Yes.** This is the reading most likely intended when colleagues use the slogan to silence appeals to autonomy. It converts an aesthetic choice into a moral transgression immediately.

  3.  **The Context-Specific Descriptive Thesis (Reception)**
      *   **Claim:** For Black artists producing work under white supremacy, art is *received* as political regardless of intent; silence or ambiguity is interpreted by the dominant culture as either assimilation or inferiority.
      *   **Platitude?** No. This is a specific sociological claim about racialized reception.
      *   **Philosophically Defensible?** **Yes.** It aligns with reception theory and critical race theory regarding the "burden of representation."
      *   **Supports the move to "Complicit in Domination"?** **Yes.** If the audience interprets apolitical art as reinforcing stereotypes (e.g., "Black art is only about trivialities"), the artwork functionally serves domination regardless of the artist's intent.
      *   **Debate Ender?** Sometimes. It shuts down autonomy arguments by pointing to external social facts rather than internal artistic duties.

  4.  **The Context-Specific Normative Thesis (Solidarity)**
      *   **Claim:** Given the existential threat of anti-Blackness, Black artists have a specific ethical obligation to use their cultural production to advance racial justice and truth.
      *   **Platitude?** No.
      *   **Philosophically Defensible?** **Yes.** This rests on ethics of care, solidarity, and pragmatic necessity rather than universal aesthetic laws.
      *   **Supports the move to "Complicit in Domination"?** **Yes.** It frames the lack of explicit political engagement not as an aesthetic choice, but as a dereliction of communal duty during a crisis.
      *   **Debate Ender?** Often. It moralizes the aesthetic within the specific community context.

  5.  **The Aesthetic Sacrifice Thesis**
      *   **Claim:** To function as propaganda, art must sacrifice "pure" beauty or aesthetic autonomy; beauty and political utility are mutually exclusive.
      *   **Platitude?** No.
      *   **Philosophically Defensible?** **No.** This creates a false dichotomy.
      *   **Supports the move to "Complicit in Domination"?** **Yes.** It implies that any pursuit of beauty *without* explicit messaging is a bourgeois indulgence that aids oppression.
      *   **Debate Ender?** **Yes.** This is frequently the underlying assumption when colleagues demand "message" over "form."
      *   **Note on Du Bois vs. Locke:** This is a **misreading** of Du Bois. Du Bois argued against Locke's aestheticism not because beauty was suspect, but because beauty *without* truth was dangerous. Du Bois explicitly wrote: "I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent." He insisted that for propaganda to work, it *must* possess beauty and truth. He did not ask artists to reject beauty; he asked them to weaponize it.

  Verdict: The Context-Specific Descriptive Thesis (Reception) is the single reading that is both textually faithful to Du Bois's essay on the criteria for Negro art and philosophically substantial, while the other readings fail because they either universalize a specific historical burden or invent a false dichotomy between beauty and politics that Du Bois explicitly rejected.
