      *Wait, one more check on Du Bois:* In "Criteria of Negro Art," Du Bois says: "Thus all Art is propaganda and ever must be, despite the wailing of the purists." He links this to the fight for the right to love and enjoy. He does not reject beauty; he insists propaganda *must* be beautiful to be effective. "I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent."
      So, the "Anti-Beauty" reading is definitely false. The "Universal" reading is hyperbolic; he means "all *Negro* art" effectively, or "all art *in this context*."
