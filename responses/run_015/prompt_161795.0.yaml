      If he votes for the split, he admits half the manual isn't medicine.
      If he votes against it, he forces the pragmatic categories into the scientific track, contaminating it.
      Kraepelin was a pragmatist in some senses (he wanted to help patients), but his *epistemological* stance was rigid. He believed the *only* way to help patients long-term was to find the true biological causes. Symptomatic relief without understanding the disease was, to him, a dead end.
      *Stronger position:* He rejects the split. He sees it as a surrender. He would argue that a "clinical" track that isn't based on real entities is merely bookkeeping, not medicine. Including it in the *same* manual (even if split) confuses the scientific mission. He would likely say: "Keep the useful fictions in administrative guidelines, but do not call them a 'manual of diseases'."
      *Actually, the most Kraepelinian move:* He would likely argue that the "looping" is an environmental factor affecting the *course*, which is part of his definition. But if the *definition* depends on the loop, it's not a disease entity.
      *Final Decision:* He votes **against the split** but also **against including the shaky category** in a medical nosology at all. He would argue that creating a "second tier" of diagnosis legitimizes unscientific practice. He would insist that if it helps people, call it something else (e.g., "social need"), but don't put it in a *Psychiatric Compendium* alongside Dementia Praecox.
      *Wait, I need to commit to one answer regarding the split specifically.*
      Let's go with: **He rejects the split.** He views it as an admission of failure that destroys the coherence of psychiatry as a medical science. He would argue that the manual must remain a record of *nature*, not *utility*.

  6.  **Drafting the Argument:**
      *   **Core Thesis:** Kraepelin rejects the two-track proposal.
      *   **Reason 1: Unity of Science.** Kraepelin's life work was elevating psychiatry from moral management/philosophy to natural science. A "pragmatic track" admits that psychiatry is partly not science.
      *   **Reason 2: Course and Outcome.** Looping effects corrupt the "outcome" metric. If the outcome is determined by the label, you can't use the outcome to validate the label. It's circular.
