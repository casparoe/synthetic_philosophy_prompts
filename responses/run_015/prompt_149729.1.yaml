answer: |-
  1. When the chief clerk flees in terror, Paul's view suggests the family cannot value a subjective experience they cannot comprehend. However, Gregor's attempt to explain his lateness proves his human priorities remain intact despite the shell.

  2. During the apple attack, the father acts as if the transformation erases any debt of care owed to his son. Yet the rotting fruit embedded in Gregor's flesh shows the physical consequence of breaking a moral bond that still exists.

  3. Grete removes the furniture assuming Gregor's new insect nature needs space over human memories. Paul would say she is right to prioritize his new self, but Gregor's despair over losing the picture shows his old identity still demands recognition.

  4. At the violin performance, Gregor feels a profound draw to music that represents a new, inaccessible subjective value. The family rejects this outreach, treating his new desires as monstrous rather than honoring his continued capacity for feeling.

  5. After Gregor dies, the family's relief implies the transformation finally dissolved all obligations to him. Their quick return to normalcy contradicts this, hinting they chose to stop caring rather than having no duty left.
