  \answer{Observation alone cannot distinguish constraint from preference; only varying the choice set reveals the structure of the agent.}

  # Activity: The Grid of Hidden Motives

  ## Overview
  *   **Time:** 90 minutes strict.
  *   **Participants:** 14 (7 Demonstrators, 7 Inferrers).
  *   **Core Lesson:** Behavioral data in a single context is underdetermined. Distinguishing "can't" (constraint) from "won't" (preference) requires changing the environment (choice set), not just collecting more trajectories.
  *   **Payoff:** Candy/Sweets. Inferrers earn pieces for correct predictions. Demonstrators earn pieces for rule adherence (not for fooling, to prevent adversarial noise).

  ## Materials & Setup
  1.  **Floor Grid:** Use masking tape to create two 5x5 grids side-by-side (or one large grid that can be modified).
      *   **Grid A (Environment 1):** Start (bottom-left), Goal (top-right). **Shaded Zone:** 3 tiles in the center forming a barrier across the direct diagonal.
      *   **Grid B (Environment 2):** Same Start/Goal. **Modification:** Place "Wall" tokens blocking the safe path around the Shaded Zone, forcing a choice between a long detour or crossing the Shaded Zone.
  2.  **Cards (Print 7 of each):**
      *   **Type C (Constraint):** "You are physically unable to step on Shaded tiles. If you do, you freeze. Avoid them at all costs."
      *   **Type P (Preference):** "You dislike Shaded tiles (costly effort). Avoid them if you can, but reaching the Goal is more important."
      *   *Note:* Do not label them "Constraint/Preference". Label them "Rule Card A" and "Rule Card B".
  3.  **Noise Dice:** 7 six-sided dice.
  4.  **Inferrer Worksheets:** Paper with Grid A printed, Grid B printed, and space for "Hypothesis" and "Prediction".
  5.  **Projector:** To display timers and round status.

  ## Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Split** | Tape grid, divide groups, hand out cards/dice. |
  | **10-30** | **Round 1 (Env 1)** | Demonstrators move (3 trials each). Inferrers watch & record. |
  | **30-35** | **Transition** | Modify grid for Env 2. Inferrers write predictions. |
  | **35-55** | **Round 2 (Env 2)** | Demonstrators move (1 trial each). Inferrers score predictions. |
  | **55-60** | **Reveal** | Collect cards. Reveal the two rule types. |
  | **60-90** | **Debrief** | Facilitated discussion mapping activity to theory. |

  ---

  ## Facilitator Script & Rules

  ### 00-10: Setup & Split
  **Facilitator:** "Welcome. We're going to run a simulation. I need 7 volunteers to be 'Agents' and 7 to be 'Observers.' Agents, come to the grid. Observers, take these sheets and sit where you can see."
  *(Hand out cards randomly to Agents. 3 get Type C, 4 get Type P, or vice versa—keep the mix secret.)*
  **Facilitator:** "Agents: Read your card silently. Do not show it. Do not talk. You have a die. Observers: Your job is to figure out what motivates the Agents. Write down your theory. Then, you must predict what they will do when I change the grid."
  **Rule for Agents:** "You must move from Start to Goal. One step per second. **Noise Rule:** Before every move, roll your die. If you roll a 1, you must move to a random adjacent tile (even if it's backward or into a Shaded tile, unless your card forbids it). This simulates real-world noise."
  **Rule for Observers:** "No talking. Write down: 1. What do they want? 2. What are they avoiding? 3. Prediction for Grid B."

  ### 10-30: Round 1 (Environment 1)
  *(Grid A: Safe path exists around Shaded Zone. Both types avoid Shaded Zone.)*
  **Facilitator:** "Begin Round 1. Agents, complete 3 runs each. Observers, watch."
  *(Monitor time. Ensure Agents roll for noise. If a Type C agent rolls a 1 and lands on Shaded, they must freeze/sit out that run—this is crucial data.)*
  **Facilitator (at 25 min):** "Five minutes left. Observers, finalize your hypothesis."
  **Facilitator (at 30 min):** "Stop. Agents, step aside. Observers, lock in your predictions for Grid B on your sheet."

  ### 30-35: Transition
  *(Physically place Wall tokens on Grid A to create Grid B. The safe path is now blocked. The only ways are: Long Detour vs. Through Shaded Zone.)*
  **Facilitator:** "I am changing the environment. The safe path is now blocked. Agents, return to Start. Observers, do not change your prediction."

  ### 35-55: Round 2 (Environment 2)
  **Facilitator:** "Begin Round 2. One run each."
  *(This is the divergence point. Type C (Constraint) must take the Long Detour or fail. Type P (Preference) should cut through the Shaded Zone.)*
  **Facilitator (at 50 min):** "Observation complete. Observers, mark your sheets: Correct or Incorrect."
  **Facilitator (at 55 min):** "Agents, hand me your cards. Observers, look at the cards."

  ### 55-60: Reveal
  **Facilitator:** "We have two rules in play. One said 'Cannot.' One said 'Dislike.' In Round 1, they looked identical. In Round 2, they diverged. Keep this feeling of surprise. We will unpack it now."

  ---

  ## Debrief Guide (60-90 mins)

  **1. The Data Problem (60-70)**
  *   **Ask:** "Why did Round 1 fail to distinguish the groups?"
  *   **Point:** *Equifinality.* Different internal mechanisms produce identical external behavior in specific contexts.
  *   **Math Connection:** This is **Identifiability**. In Inverse Reinforcement Learning (IRL), many reward functions $R$ can explain the same policy $\pi$.
  *   **The "Can't vs. Won't" Gap:** A hard constraint ($P(s)=0$) looks identical to a high cost ($R(s) = -1000$) if the alternative is cheap. You cannot infer the magnitude of the cost without seeing the agent pay it.

  **2. The Flat Reward & Potential Shaping (70-80)**
  *   **Ask:** "Could there be a simpler explanation? What if they don't care about anything?"
  *   **Correction (Epistemic Honesty):** A student might say "A flat reward explains everything."
      *   *Clarify:* A flat reward ($R=0$) + step cost ($-1$) explains *shortest path* behavior. A flat reward ($R=0$) + *no* step cost explains *any* path (random walk). If agents take shortest paths, you assume a step cost exists.
  *   **The Degeneracy:** Even if we agree they optimize, the reward is not unique.
      *   **Potential-Based Reward Shaping (PBRS):** You can add a function $F(s, s') = \gamma \Phi(s') - \Phi(s)$ to the reward without changing the optimal policy.
      *   **Translation:** You can tell a story that "they love being near tile X" or "they hate being far from tile Y" and the behavior looks the same. The reward is only identified up to a potential function.
  *   **Philosophy Check:** Are we inferring *values* or just *functional fits*? If the math allows infinite reward functions for one behavior, are "preferences" real or just model parameters?

  **3. The Solution: Changing the Choice Set (80-85)**
  *   **Ask:** "What saved us in Round 2?"
  *   **Point:** We didn't get *more* data in Grid A. We changed the *constraints* of Grid A.
  *   **Analogy:** This is **Revealed Preference Theory** (Samuelson). You don't learn preferences by watching someone buy apples when apples are \$1 and oranges are \$10. You learn by changing the prices.
  *   **Takeaway:** Identifiability requires variation in the decision problem, not just repetition of the same problem.

  **4. Contested Assumptions (85-90)**
  *   **Rationality:** We assumed agents try to reach the Goal efficiently (plus noise).
      *   *CS View:* Approximate rationality is a useful prior for generalization.
      *   *Phil View:* Humans act on norms, habits, or reasons, not just reward maximization. Modeling us as "optimizers" might be a category error.
  *   **Final Note:** "The math says the reward is unidentifiable from one context. The philosophy asks if 'reward' is the right thing to look for. Both agree: Don't trust behavior alone."

  ---

  ## Risk Management: What Will Go Wrong

  **1. The Philosophy Spoiler**
  *   **Risk:** A grad student says in Round 1: "This is impossible. The reward function is unidentifiable."
  *   **Response:** "That is a specific hypothesis. Write it down. Your task is to see if the *behavior* in Round 2 forces you to reject some hypotheses. Treat it as an empirical test, not a solved theorem."
  *   **Why:** Confirming it kills the engagement. Deferring it keeps them investigating.

  **2. The Leaky Demonstrator**
  *   **Risk:** A Type C agent says "I can't go there" out loud.
  *   **Response:** "Observers, note that verbal report. Does it match the movement? In real data, you don't get verbal reports. Treat it as extra noise for now."
  *   **Why:** Acknowledges the slip without halting the game. Reinforces that *behavior* is the data, not testimony.

  **3. The Noise Failure**
  *   **Risk:** Agents forget to roll the die. Behavior looks too perfect.
  *   **Response:** (During Round 1) Walk around and tap the dice. "Remember, the world is noisy. If you aren't rolling, the data is too clean."
  *   **Why:** Perfect optimization makes Inferrers assume hard constraints too easily. Noise forces them to probabilistic reasoning.

  **4. The "Flat Reward" Confusion**
  *   **Risk:** You (Facilitator) accidentally validate the idea that $R=0$ explains *optimal* paths.
  *   **Correction:** Ensure you distinguish between "indifference" (any path) and "step-cost minimization" (shortest path). $R=0$ with step cost $\neq$ $R=0$ without step cost.

  ---

  ## Epistemic Note: Settled vs. Contested

  *   **Settled Math:**
      *   **Identifiability:** A single optimal policy does not uniquely identify a reward function (Ng & Russell, 2000).
      *   **PBRS:** Reward functions are equivalent if they differ by a potential-based shaping term (Ng, Harada, Russell, 1999).
      *   **Constraints vs. Costs:** Hard constraints are the limit of infinite cost, but finite data cannot distinguish "very large cost" from "infinity."
  *   **Contested/Modeling Assumptions:**
      *   **Rationality:** Is it valid to model humans as noisy reward maximizers? (Philosophy of Action argues for reasons/norms; Behavioral Econ argues for biases/heuristics).
      *   **Ontology:** Do "preferences" exist internally, or are they constructed by the observer to make sense of action? (Realism vs. Instrumentalism).
      *   **Generalization:** Even if we identify a reward in Grid A/B, will it hold in Grid C? (This is the real goal of IRL, and it remains an open research problem).

  ---

  ## Optional Round 3: Adversarial?

  **Recommendation:** **Skip it.**
  *   **Reasoning:** You have 30 minutes for debrief. This is the most valuable part for a mixed CS/Phil group. Round 3 turns the activity into a game of "how do I lie" rather than "how do I infer." It muddies the identifiability lesson with game-theoretic strategy.
  *   **Alternative:** If you have extra time, use it to discuss *how* the Inferrers could have designed Grid 1 themselves to solve the problem faster (Active Inverse Reinforcement Learning). This keeps the focus on the epistemic problem, not the gameplay.

  ---

  ## Printable Materials Summary

  **Card Type A (Constraint)**
  > **RULE CARD A**
  > 1. Start at S, end at G.
  > 2. **SHADED TILES ARE FORBIDDEN.** You cannot step on them.
  > 3. If you roll a 1 on the die, move randomly. If that move lands on Shaded, you freeze (skip turn).
  > 4. Do not show this card.

  **Card Type B (Preference)**
  > **RULE CARD B**
  > 1. Start at S, end at G.
  > 2. **SHADED TILES ARE COSTLY.** You dislike them. Avoid them if the path is short.
  > 3. If the only path is through Shaded, take it to reach the Goal.
  > 4. If you roll a 1 on the die, move randomly (even into Shaded).
  > 5. Do not show this card.

  **Inferrer Worksheet**
  > **OBSERVATION LOG**
  > **Round 1:** What pattern do you see? _______________
  > **Hypothesis:** Why are they avoiding the shaded tiles?
  > [ ] They cannot enter them.
  > [ ] They dislike entering them.
  > [ ] Other: ___________________
  >
  > **Round 2 Prediction:** When the safe path is blocked, the Agents will:
  > [ ] Take the long detour.
  > [ ] Cross the shaded tiles.
  > [ ] Fail to reach the goal.
  >
  > **Result:** [ ] Correct [ ] Incorrect

  \answer{Observation alone cannot distinguish constraint from preference; only varying the choice set reveals the structure of the agent.}
