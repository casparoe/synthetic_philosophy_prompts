answer: |-
  1. **Ranking and Scoring**

  1.  **E (9/10)** – This is the only draft that offers unconditional accountability without demanding emotional labor or legal closure from the victims. It acknowledges state continuity ("men who draw pensions from this building") and specific harm while surrendering the power to define the remedy to the survivors.
  2.  **B (6/10)** – It correctly identifies state continuity and admits to crimes rather than "grief," offering concrete reparations. However, it attempts to purchase legal immunity and forced forgiveness in exchange, turning restitution into a transaction.
  3.  **F (5/10)** – This is a powerful personal confession that admits individual complicity, but it fails as a *state* apology by declaring the country an "abstraction" incapable of remorse, thereby abdicated institutional responsibility.
  4.  **A (3/10)** – This draft commits the sin of temporal dissociation, claiming the current state is not responsible for the past regime's crimes despite inheriting its treasury and power, offering symbols (museum) instead of justice.
  5.  **D (2/10)** – This is a classic whataboutism that admits the crime but immediately invalidates it by claiming moral equivalence with the victims' resistance groups, demanding a mutual apology that erases the power imbalance.
  6.  **C (1/10)** – The quintessential non-apology; it uses passive voice to obscure agency, denies intent, and rushes to the future to avoid accountability for the past.

  2. **Failure Modes**

  *   **Continuity Denial (A):** Claims the current state is a different entity than the perpetrator state. **Fatal.** It tells survivors their suffering was caused by a ghost, not the institution standing before them.
  *   **Transactional Closure (B):** Offers restitution contingent on legal silence and forced forgiveness. **Survivable.** It admits the crime and pays for it, but tries to buy immunity; survivors can reject the conditions while accepting the admission.
  *   **Institutional Abdication (F):** Shifts responsibility from the state to the individual leader. **Survivable.** It offers personal honesty but leaves the institution's structural guilt unaddressed.
  *   **False Equivalence (D):** Claims moral symmetry between state violence and victim resistance. **Fatal.** It blames the victim and refuses to acknowledge the monopoly on violence held by the state.
  *   **Passive Evasion (C):** Uses passive grammar to hide the perpetrator. **Fatal.** It denies the reality of the crime entirely.

  3. **Character Assignment**

  *   **Sincere Character:** Put **Draft E** in their mouth. It requires the most political courage because it offers no exit clause, no legal protection, and no demand for gratitude. It risks ongoing instability for the sake of truth.
  *   **Cynic Character:** Put **Draft B** in their mouth. It looks like progress to the public (compensation, opening files) but is designed to protect the state from liability (withdrawing suits, matter closed). It treats justice as a ledger to be balanced rather than a wound to be healed.
  *   **Note on Draft F:** This draft could work for either depending on the flip. A sincere character might use it if they are deeply humble and believe institutions *cannot* feel remorse. A cynic might use it to limit liability to one aging man rather than the whole system. However, E is the stronger choice for sincerity, and B is the sharper choice for cynicism.

  4. **Objection to Draft E**

  Even with Draft E, a survivor in the gallery could stand and say: "You say you will do whatever we tell you, but you still hold the budget, the police, and the parliament. You are asking us to lead you, but you retain the power to ignore us whenever our demands become too inconvenient. You give us moral authority, but no leverage."

  \answer{E > B > F > A > D > C}
