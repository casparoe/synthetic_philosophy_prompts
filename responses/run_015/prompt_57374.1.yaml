prompt: |-
  I'm about three quarters of the way through a novel and I've hit the wall on the scene I've been dreading and looking forward to in equal measure. Setup, quick, so the drafts make sense: an invented country, call it Karst. Thirty-odd years ago the government relocated a highland minority into "model villages" and took their children to boarding schools where the language was beaten out of them, and a certain number of adults went into the interior ministry and never came out. Karst has changed regime twice since. My prime minister is going to stand up in the parliament and issue a formal apology on behalf of the country for all of it.

  I've written six versions of the speech and my editor says she can't tell which one is supposed to be the good one, and honestly neither can I anymore. They've all gone grey on me. So I need an outside read.

  **A.** "What happened in the highlands happened in a different Karst, under a different flag, by men who are mostly dead. This government did not order it. We inherited it, the way we inherited the roads and the debt. But your grief is real, it is here, and it is in this room, and for the grief we are sorry. We will build a museum on the site of the Vilno school and we will fund the keeping of your language, so that what was taken from your grandparents is given back to your grandchildren."

  **B.** "The state took children from their parents. The state killed some of those parents. There is no context that makes this anything but a crime, and the state that committed it is the state I lead today — same seal, same treasury, same name. We are sorry. We will establish a compensation fund, we will open the files, and we will prosecute where prosecution is still possible. In return — and I use that word deliberately — we ask the families to withdraw the suits now pending, and to accept that this matter is closed, and to forgive, so that Karst can heal."

  **C.** "Mistakes were made. Harm occurred. People suffered in ways that no one should suffer and it is right that we say so here. We regret that this harm occurred. No one alive in this chamber intended it. Let us now turn to the future, which is the only place any of us can still act."

  **D.** "Yes, the state took children. We say it plainly, and we are sorry. But we should also say plainly that in those years nobody's hands were clean. The highland brigades killed too — ask the families of the conscripts at Serratt bridge. Violence belonged to all of us. So let us not sort this country into the guilty and the innocent. Let us apologize to each other, mutually, and be done with it."

  **E.** "Between 1961 and 1974 the state of Karst removed eleven thousand children from their families and placed them in schools where they were forbidden their language, and it detained or killed an unknown number of their parents, and the number is unknown because we destroyed the records that would tell us. I am not going to say the times were different. I am not going to say both sides. I am not going to ask you to forgive us, and I am not going to ask you to let this be closed, because it isn't ours to close. You are entirely within your rights to hear this apology and refuse it, and if you refuse it that will not make you unreasonable and it will not make this speech untrue. Some of you were beaten by men who draw pensions from this building, and I draw a salary from it too. Whatever you tell us to do next, we will do, and I have not come here with a price already set on it."

  **F.** "Before I am prime minister I am a man of sixty-eight who took a job in the ministry in 1969 because it was the only job offered to me, and who signed things without reading them. I have read them now. So I will not stand here and make my country apologize, because my country is a large abstraction and I am not certain it is capable of remorse, and I will not put that word in the mouths of people who were not there. I can only tell you what I did and what I did not do, in my own name, and ask you for nothing at all."

  Here's what I want from you:

  1. Rank all six, most to least adequate *as a state apology* — not best written, not most likely to be popular, but which one a survivor sitting in the gallery could actually receive as an apology and which ones are counterfeits wearing apology clothes. Score each out of 10 on that dimension and give me a sentence or two each on the specific thing it does or fails to do.
  2. Name the failure mode each one is committing. Invent your own labels if you like, but use them consistently, and say which of them you think are fatal versus which are survivable.
  3. Tell me which one I should put in the mouth of my sincere character and which one in the mouth of the cynic — and be aware I might use the same draft for both, depending on how you read it. If one of them works as either, say so and say what flips it.
  4. For whichever you rank first, give me the strongest objection a survivor in the room could still make to it. I don't want this scene to let the apology off easy, and I'd rather find the crack now than have a reviewer find it later.

  I don't need sources or a bibliography, this is a novel and not a dissertation — I just need your judgement, argued for. When you're done, put the final ordering on its own last line in this exact form, e.g. \answer{E > B > F > A > D > C}, using your actual ranking.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** A novel set in an invented country (Karst). 30+ years ago, government relocated highland minority, took children to boarding schools (language suppression), adults disappeared/killed. Regime changed twice since. Current PM issuing formal apology in parliament.
      *   **Task:** Evaluate six draft speeches (A-F).
      *   **Requirements:**
          1.  Rank all six (most to least adequate *as a state apology* from a survivor's perspective). Score out of 10. Explain why.
          2.  Name the failure mode for each (invent labels if needed, use consistently). Identify fatal vs. survivable.
          3.  Recommend which draft fits a *sincere* character and which fits a *cynic* character. Note if one works for both.
          4.  For the #1 ranked draft, provide the strongest objection a survivor could still make.
          5.  Final output must end with a specific format: `\answer{E > B > F > A > D > C}` (example).
      *   **Constraints:** No sources/bibliography. Just judgement argued for.

  2.  **Analyze the Speeches:**

      *   **Speech A:** "Different Karst... different flag... men mostly dead." "We inherited it." "For the grief we are sorry." Offers museum and language funding.
          *   *Tone:* Distancing, bureaucratic, transactional.
          *   *Content:* Denies responsibility ("different Karst"), acknowledges grief but not necessarily guilt of the state itself. Offers symbolic restitution (museum) and cultural support.
          *   *Verdict:* Weak apology. Shifts blame to the past regime as if it's a different country.

      *   **Speech B:** "State took children... State killed." "State I lead today — same seal, same treasury." "We are sorry." Offers compensation, opens files, prosecution. *But:* "In return... withdraw suits... accept matter is closed... forgive."
          *   *Tone:* Acknowledging responsibility but transactional/conditional.
          *   *Content:* Admits continuity of state. Admits crimes. Offers concrete reparations. *However*, demands legal closure and forgiveness in exchange.
          *   *Verdict:* Strong on admission, weak on coercion. The "quid pro quo" undermines the apology.

      *   **Speech C:** "Mistakes were made. Harm occurred." "No one alive in this chamber intended it." "Turn to the future."
          *   *Tone:* Passive, evasive, classic bureaucratic non-apology.
          *   *Content:* Passive voice ("Mistakes were made"). Denies intent. Focuses on future to avoid present accountability.
          *   *Verdict:* Worst apology. Pure gaslighting.

      *   **Speech D:** "Yes, state took children... sorry." "But... nobody's hands were clean." "Highland brigades killed too." "Apologize to each other, mutually."
          *   *Tone:* Deflective, whataboutism.
          *   *Content:* Admits facts but immediately pivots to victim-blaming/false equivalence. Demands mutual apology.
          *   *Verdict:* Very bad. Invalidates the specific state crime by claiming moral equivalence with insurgents/victims.

      *   **Speech E:** Specific numbers (11,000 children). Dates (1961-1974). Admits record destruction. "Not going to say times were different." "Not going to ask you to forgive." "Not going to ask you to let this be closed." "Whatever you tell us to do next, we will do."
          *   *Tone:* Humble, unconditional, specific, accountable.
          *   *Content:* Acknowledges continuity ("men who draw pensions from this building"). Gives agency to survivors. No conditions attached.
          *   *Verdict:* Strongest apology. Unconditional.

      *   **Speech F:** PM speaks as individual ("man of sixty-eight"). Admits personal complicity ("signed things without reading them"). "Will not stand here and make my country apologize... country is a large abstraction." Asks for nothing.
          *   *Tone:* Personal, confessional, humble.
          *   *Content:* Shifts from *state* apology to *personal* testimony. Acknowledges personal guilt but sidesteps the institutional obligation of the office.
          *   *Verdict:* Powerful personally, but fails as a *state* apology because it abdicates institutional responsibility.

  3.  **Drafting the Evaluation (Requirement 1 & 2):**

      *   *Ranking Criteria:* Adequacy as a *state apology* from a *survivor's perspective*.
      *   *Ranking:*
          1.  **E:** Unconditional, specific, acknowledges state continuity, gives agency to victims. (9/10)
          2.  **B:** Acknowledges state continuity and crime, offers reparations, but demands legal closure/forgiveness. (7/10)
          3.  **F:** Deeply personal and honest, but fails as a *state* apology because it treats the state as an abstraction. Good for personal redemption, bad for institutional justice. (6/10)
          4.  **A:** Distances current state from past crimes ("different Karst"). Transactional (museum). (4/10)
          5.  **D:** Whataboutism. False equivalence. Demands mutual apology. (2/10)
          6.  **C:** Passive voice. "Mistakes were made." Denies intent. (1/10)

      *   *Failure Modes:*
          *   A: *Temporal Dissociation* (It wasn't us, it was them).
          *   B: *Transactional Coercion* (Apology for closure).
          *   C: *Passive Evasion* (Mistakes were made).
          *   D: *Moral Equivalence* (Everyone was bad).
          *   E: (Success)
          *   F: *Personal Abdication* (I apologize, not the State).

      *   *Fatal vs. Survivable:*
          *   Fatal: C (denies reality), D (blames victims), A (denies continuity).
          *   Survivable: B (tainted but admits crime), F (honest but limited scope).

  4.  **Character Assignment (Requirement 3):**

      *   *Sincere Character:* Needs to be **E**. It requires humility, acceptance of ongoing pain, and no demand for reward. It risks political capital without guaranteeing closure.
      *   *Cynic Character:* Needs to be **B**. It looks like an apology but is actually a legal strategy to stop lawsuits ("withdraw the suits now pending"). It buys peace cheaply.
      *   *Alternative:* **F** could be a sincere character who is overwhelmed by the weight of the state, or a cynic trying to minimize state liability by making it about one old man. But E is the gold standard for sincerity, B is the gold standard for cynical calculation disguised as progress.
      *   *Wait, consider F again:* F says "I will not stand here and make my country apologize." A cynic might use F to avoid state liability. A sincere person might use F because they feel the state *can't* apologize. But E is the best *state* apology. The prompt asks which to put in the mouth of the sincere character and which in the mouth of the cynic.
      *   *Decision:* Sincere = E. Cynic = B. (B looks good on paper but protects the state legally).
      *   *Nuance:* F is interesting. A sincere character might choose F if they believe institutions are incapable of remorse. But E is the better *apology*. I will recommend E for Sincere, B for Cynic. I should note F could work for a sincere character who is deeply philosophical but fails the political task.

  5.  **Strongest Objection to #1 (Requirement 4):**

      *   *Speech E:* It promises action ("Whatever you tell us to do next, we will do") but offers no guarantee of *success* or *structural change*. A survivor could say: "You promise to listen, but you still hold the power. You still control the budget. You still control the army. Your willingness to obey us is temporary and revocable. You are asking us to lead you, but you hold the whip."
      *   *Better Objection:* It acknowledges the records were destroyed by the state, but doesn't explain *who* destroyed them or if those people are still in power. It says "men who draw pensions from this building" but doesn't promise to strip those pensions. It asks survivors to do the emotional labor of deciding "what next" without giving them the power to enforce it.
      *   *Refined Objection:* "You say you will do whatever we tell you, but you remain the Prime Minister. You hold the power of enforcement. If we tell you to prosecute the generals still living in your party, will you really do it? Or is this freedom you offer us just another way to make us responsible for the outcome while you keep the power?"

  6.  **Refining the Output:**

      *   Check constraints: Score out of 10. Sentence or two explanation. Failure mode labels. Fatal vs. Survivable. Character assignment. Objection to #1. Final line format.
      *   *Ranking Check:*
          1.  E (Best)
          2.  B (Good admission, bad condition)
          3.  F (Good personal, bad state)
          4.  A (Denies continuity)
          5.  D (Blames victims)
          6.  C (Non-apology)
      *   *Failure Modes:*
          *   A: *Continuity Denial*
          *   B: *Transactional Closure*
          *   C: *Passive Evasion*
          *   D: *False Equivalence*
          *   E: *None (Ideal)*
          *   F: *Institutional Abdication*
      *   *Fatal:* A, C, D. (They deny the core premise of state responsibility).
      *   *Survivable:* B, F. (They admit fault but have caveats).

      *   *Character Assignment:*
          *   Sincere: E.
          *   Cynic: B.
          *   *Note on F:* Could be a sincere character who feels unworthy, but E is the stronger dramatic choice for a PM role. I'll stick with E for Sincere.

      *   *Objection to E:* The power dynamic remains unchanged. The survivors are given moral authority but no political leverage.

  7.  **Final Review of the Prompt Requirements:**
      *   Rank all six.
      *   Score out of 10.
      *   Sentence or two explanation.
      *   Name failure mode (consistent labels).
      *   Fatal vs. Survivable.
      *   Which for Sincere, which for Cynic.
      *   Strongest objection to #1.
      *   Final line format: `\answer{E > B > F > A > D > C}`.

      *Self-Correction on Ranking:* Is F better than B?
      *   B admits state responsibility ("State I lead today"). F denies it ("country is a large abstraction").
      *   For a *state apology*, B is functionally better because it accepts institutional guilt, even if it tries to buy closure. F lets the institution off the hook by making it about one man.
      *   However, from a *survivor's perspective*, B's demand to drop suits is insulting. F's personal confession might feel more honest, even if it lacks institutional weight.
      *   But the prompt asks for adequacy *as a state apology*. F explicitly refuses to be a state apology ("I will not stand here and make my country apologize"). Therefore, F fails the specific brief more than B, which attempts the brief but adds a poison pill.
      *   Actually, E is the only one that succeeds. B is second because it admits the crime and continuity, even if the quid-pro-quo is ugly. F is third because it's honest but abdicates the office's duty.
      *   Let's stick with E > B > F > A > D > C.

      *Wait, let's look at A vs F.*
      *   A says "Different Karst... different flag." Denies continuity.
      *   F says "Country is abstraction... I apologize in my own name."
      *   A is gaslighting about the state's identity. F is humble about the state's capacity. F is more honest than A. A is a classic "successor regime" dodge. F is a philosophical dodge. A is worse for a survivor because it says "Your suffering wasn't caused by *this* country." F says "This country can't feel, but I can." F is better than A.
      *   So E > B > F > A > D > C holds.

      *Failure Mode Labels:*
      *   A: *Continuity Denial*
      *   B: *Transactional Closure*
