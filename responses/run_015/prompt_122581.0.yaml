  Project Title: The Simulation Hypothesis as a Variance Engine

  Research Question
  Does assigning non-zero credence to the simulation hypothesis systematically increase or decrease the expected value of far-future interventions for a risk-neutral longtermist agent, and which structural parameters determine the sign of this effect?

  This question is deliberately narrow. Your initial framing asks whether simulation considerations should cool down fanaticism. That is too broad because "fanaticism" is a behavioral label, not a decision rule. By shifting the focus to the expected value calculation under risk neutrality, we force a determinate answer: either the mathematical expectation rises, falls, or remains invariant given specific inputs. If the answer depends entirely on unspecified priors, the project fails, but that failure is itself a finding. We are not asking whether the simulation hypothesis is true, but how it functions as a parameter in a specific class of decision problems.

  Context and Critique
  The existing reactions to this problem are insufficient because they treat the simulation hypothesis as a monolithic probability discount. The postdoc's view—that simulation considerations are a wash—assumes that uncertainty about the nature of reality cancels out across the longtermist calculus. This is incorrect because the simulation hypothesis does not add symmetric noise; it introduces structural asymmetries regarding the continuity of physical laws and the runtime of the universe. The colleague's view—that it obviously deflates the future—relies exclusively on runtime truncation. This ignores the possibility of instantial multiplication, where a single decision in the base reality corresponds to correlated decisions across many simulations, potentially amplifying impact.

  There is a third, obvious reaction: that this is merely reheated skepticism. A skeptic would argue that if we cannot distinguish simulation from base reality, the physics we use to estimate the future remains our best guide. This objection fails because longtermism relies on extrapolating physical constants over astronomical timescales. If those constants are simulation parameters subject to adjustment or termination, the warrant for those extrapolations collapses. The variance of the outcome distribution increases even if the mean remains stable. For an agent sensitive to tail risks, variance is not noise; it is the signal. Your suspicion that evidential undercutting might increase fanaticism is the most novel claim here, but it requires rigorous defense against the charge that it simply amounts to inflating uncertainty to justify extreme bets.

  Methodology
  I will construct a formal decision-theoretic model rather than engaging in conceptual analysis or literature survey. The model will treat the simulation hypothesis as a set of modifiers applied to a standard longtermist expected value equation. There are three reasons for this approach. First, plugging numbers into the standard tripartite argument is too arbitrary; without a structured sensitivity analysis, any result can be gamed by adjusting the credence assigned to simulation. Second, surveying the ethics of creating simulated suffering is out of scope for a four-month project and distracts from the core decision-theoretic question of impact magnitude. Third, a small model with explicit parameters allows for a reversal analysis. We can identify exactly where the sign of the effect flips from positive to negative.

  The model will isolate the three mechanisms you identified: runtime truncation, instantial multiplication, and evidential undercutting. I will not attempt to solve the measure problem or infinite ethics, as these introduce complexities that cannot be resolved in a single semester. Instead, I will treat them as boundary conditions. The core work involves deriving the conditions under which the variance introduced by evidential undercutting outweighs the mean reduction caused by runtime truncation. This requires defining a "fanaticism threshold"—a point where the agent's willingness to pay becomes sensitive to tail width rather than mean expectation.

  Schedule
  Month 1: Formalize the baseline longtermist expected value equation and integrate the runtime truncation parameter.
  Month 2: Model instantial multiplication and determine the correlation coefficients between simulated and base reality agents.
  Month 3: Develop the evidential undercutting module, focusing on how simulation credence widens the probability distribution of physical constants.
  Month 4: Synthesize the modules, run sensitivity analyses, and draft the final paper and talk.

  Possible Upshots
  There are three plausible outcomes. First, the simulation hypothesis dampens fanaticism because runtime truncation dominates variance effects. This occurs if the probability of early termination is high relative to the multiplicative factor of nested simulations. Second, it amplifies fanaticism because evidential undercutting widens the upper tail sufficiently to attract risk-neutral agents seeking astronomical payoffs. This occurs if the agent values the possibility of a "high-variance reality" more than the security of a "low-variance reality." Third, the effect is ambiguous because the sign tracks the prior credence assigned to the simulation hypothesis. If this is the result, the paper will argue that the simulation hypothesis is not a independent lever but a mirror for existing risk preferences. The deciding consideration will be the elasticity of the agent's utility function with respect to variance.

  Risk and Failure Modes
  The primary risk is that the project dissolves into the general problem of choice under severe model uncertainty. If the simulation hypothesis functions exactly like any other source of deep uncertainty, there is nothing specifically simulation-shaped doing any work. I will steelman this worry by testing whether the simulation parameters produce unique structural effects distinct from generic Knightian uncertainty. A second failure mode is prior dependence. If the sign of the effect changes based on arbitrary inputs, the paper becomes a redescription of the user's priors rather than a normative guide. I will mitigate this by mapping the parameter space rather than claiming a universal verdict. If the model shows that no reasonable prior yields a determinate answer, that is a successful negative result, but it risks being philosophically unsatisfying.

  Scope and Constraints
  To ensure completion within four months, I am excluding the ethics of simulating suffering, any infinite-ethics complications, and the measure problem. These are load-bearing in a comprehensive ethics of simulation but are distractions for a decision-theoretic analysis of impact magnitude. The deliverable is a 7000–9000 word paper plus a works-in-progress talk. The talk will focus on the model's structure rather than the numerical results, as the parameters will remain contested. The goal is to provide a framework for future debate, not to settle the debate itself.

