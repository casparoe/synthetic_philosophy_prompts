answer: |-
  Here is the specification you requested, structured for your reading group. It assumes the Bradley Regress argument is common knowledge and focuses strictly on the adequacy conditions for a solution.

  ### The Spec: Desiderata for Propositional Unity

  **1. Unity vs. Mereology (The Truth-Aptness Condition)**
  *   **Requirement:** The theory must distinguish a proposition from the mere set or list of its constituents.
  *   **Case:** A list {Socrates, Wisdom} is not true or false; only the unity *Socrates is wise* is. If the proposition is just a heap, truth-evaluation is category-mistaken.
  *   **Knocks Out:** Purely extensional set-theoretic reductions (without structural encoding), nominalist heaps.

  **2. Directionality (The Asymmetry Condition)**
  *   **Requirement:** The theory must account for the difference between $aRb$ and $bRa$ without appealing to external indexing.
  *   **Case:** *Othello loves Desdemona* has different truth conditions than *Desdemona loves Othello*. The constituents are identical; the arrangement is not.
  *   **Knocks Out:** Symmetric combination rules, unordered sets of constituents.

  **3. No Extra Constituent (The Regress Block)**
  *   **Requirement:** The principle of unity cannot be a further object or relation *within* the proposition.
  *   **Case:** Bradley's Regress. If the tie is a constituent, it needs a tie to tie it to the other constituents, ad infinitum. Nothing ever gets unified.
  *   **Knocks Out:** Relational copulas treated as objects, "nexus" entities, brute fact relations added to the list.

  **4. False Propositions (The Error Condition)**
  *   **Requirement:** The unity must obtain even if no corresponding fact exists in the world.
  *   **Case:** We can believe *Socrates is wise* even if Socrates is not wise. If unity requires the existence of the fact, false belief is impossible (or becomes belief in nothing).
  *   **Knocks Out:** Fact-based ontologies (where no fact = no proposition), strict correspondence theories that conflate truth-makers with truth-bearers.

  **5. Scalability & Embedding (The Productivity Condition)**
  *   **Requirement:** The unifying principle must apply recursively to arbitrarily complex and embedded structures.
  *   **Case:** Natural language allows negation, conjunction, and attitude reports (*John believes that Mary hopes that...*). A theory working only for atomic subject-predicate sentences fails semantics.
  *   **Knocks Out:** Atomistic views, picture theories that cannot handle negation logically.

  **6. Mind-Independence (The Shareability Condition)**
  *   **Requirement:** The proposition must exist and be unified prior to and independently of being entertained by a thinker.
  *   **Case:** Two people can believe the *same* thing; you can discover a truth you didn't create. If the mind unifies it, the object is private or temporal.
  *   **Knocks Out:** Psychologism, Idealism, Russellian multiple-relation theories (where the act of judging unifies).

  **7. Fine-Grainedness (The Cognitive Significance Condition)** *[Added]*
  *   **Requirement:** The theory must distinguish propositions that are necessarily equivalent but cognitively distinct.
  *   **Case:** *Hesperus is Hesperus* vs. *Hesperus is Phosphorus*. Both map to the same world-set, but one is informative.
  *   **Knocks Out:** Coarse-grained Possible Worlds semantics (as a complete theory of *content*), strict Millianism.

  **8. Existence-Neutrality (The Non-Existence Condition)** *[Added]*
  *   **Requirement:** The theory must allow unified propositions about non-existent subjects.
  *   **Case:** *Sherlock Holmes lives on Baker Street* is a unified content we can discuss, despite Holmes's non-existence.
  *   **Knocks Out:** Strict Actualist Russellianism (where constituents must exist to be constituents).

  ---

  ### Analysis of Constraints and Conflicts

  **Non-Negotiable vs. Camp Preferences**
  You guessed that "unity must be explained" is a prejudice and "exact structural correspondence" is a preference. You are correct on both, but with caveats.
  *   **Preference:** *Explanatory Transparency.* Demanding a *mechanism* for unity (rather than positing it as a primitive feature of certain entities) is a metaphysical taste. Primitivists argue unity is a brute fact of propositional structure.
  *   **Preference:** *Isomorphism.* Demanding that propositional structure mirror surface grammatical structure is a Russellian/Early Wittgensteinian prejudice. Fregean semantics often posits logical forms divergent from grammar.
  *   **Non-Negotiable:** *Directionality* and *Mind-Independence*. Without Directionality, you lose truth conditions (Job 1: Semantics). Without Mind-Independence, you lose shareable objects of attitudes (Job 2: Psychology). These are functional requirements of the jobs you specified.

  **The Minimal Unsatisfiable Subset (MUS)**
  There is a jointly unsatisfiable subset, but it requires one implicit premise often smuggled into the regress setup.
  *   **The Subset:** {Mind-Independence, No Extra Constituent, Directionality}.
  *   **The Hidden Premise:** *Constituent Homogeneity* (The assumption that all constituents are ontologically "complete" objects).
  *   **The Argument:** If constituents are all complete objects (Homogeneity), they cannot unify themselves. If you forbid a Mind to unify them (Mind-Independence) and forbid a Glue to unify them (No Extra Constituent), they remain a heap. Directionality requires an asymmetry that homogeneous objects lack.
  *   **Resolution:** To escape the MUS, you must reject **Constituent Homogeneity**. This forces you to posit at least two ontological categories of constituent (e.g., Objects and Functions/Concepts).

  **The Workhorse Requirement**
  **Mind-Independence** does the most work.
  *   It is the primary eliminator of the Russellian solution (the thinker's act unifies).
  *   It is the primary eliminator of Psychologism.
  *   It forces the theory into a Platonist or Realist ontology, which is where Bradley's Regress bites hardest. If you allow the mind to unify, the regress is practically dissolves (though at the cost of objectivity). By holding Mind-Independence fixed, you make the problem intractable for any view that treats constituents as inert objects.

  **Is There a Way Through?**
  Given your constraint (No Thinker Act, No Extra Constituent), the enterprise **does not collapse**, but it forces a specific ontological commitment: **Ontological Heterogeneity**.
  You cannot unify a proposition if all parts are "things." You must posit that one type of constituent is inherently unifying. This is the **Fregean Move**: Concepts (predicates) are "unsaturated." They do not need a further relation to tie them to an object because their very nature is to *take* an object. The unsaturatedness *is* the unity, without being an *extra* item. This respects your constraint: it is not an act (it's ontological) and not a constituent (it's a mode of being of a constituent).

  ---

  ### Evaluation of Main Options

  | Theory | Unity vs. List | Directionality | No Extra Constituent | Mind-Independence | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Frege (Unsaturatedness)** | **Pass.** Concepts hold objects. | **Pass.** Function/Argument asymmetry. | **Pass.** Unsaturatedness is a mode, not an item. | **Pass.** Senses are abstract objects. | **Survivor.** Meets spec, but incurs "Concept Horse" ontological cost. |
  | **Russell (Judgment/Act)** | **Pass.** The act unifies. | **Pass.** The act arranges constituents. | **Pass.** No extra glue needed. | **Fail.** Violates Mind-Independence (Job 2). | **Eliminated.** Fails the "object of attitudes" constraint. |
  | **Possible Worlds (Sets)** | **Fail.** Sets are just lists (order irrelevant w/o encoding). | **Fail.** $\{w_1, w_2\}$ has no intrinsic direction. | **Pass.** No glue, just extension. | **Pass.** Abstract sets. | **Eliminated.** Fails Structure/Directionality (Job 1). |
  | **Wittgenstein (Tractatus)** | **Pass.** Structure shows itself. | **Pass.** Arrangement in logical space. | **Pass.** Form is not a constituent. | **Fail.** Fails False Propositions (no fact = no picture). | **Eliminated.** Fails Error Condition (Job 2). |

  **Conclusion:** The **Fregean view** is the only survivor against this specific spec, provided you accept unsaturated entities as ontologically legitimate. The Possible Worlds view survives only if you abandon the "Unity" requirement entirely (treating propositions as black boxes), which violates your prompt's core constraint. The Russellian view survives only if you abandon Mind-Independence.
