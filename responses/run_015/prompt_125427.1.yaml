answer: |-
  The stability of the term "copycat" in art and design education is an illusion maintained by the small scale of the studio environment. In a seminar room or critique, evaluators rely on tacit knowledge, interpersonal trust, and visual intuition to police originality. This microdomain allows the concept of "copying" to remain fluid because the evaluator can usually infer the *intent* behind the image through conversation. However, the introduction of generative tools has severed the reliable link between visual output and human intent. By continuing to apply a monolithic predicate like "copycat" or "derivative" across three ontologically distinct practices—direct reproduction, procedural derivation, and stylistic convergence—evaluation rubrics are committing a category error. They are collapsing causal history into semantic resemblance, creating a policy framework that is logically incoherent and ethically unenforceable.

  To understand the conceptual slippage, we must first reconstruct the implicit architecture of authorship that underpins traditional evaluation. In analog contexts, the judgment of plagiarism relies on a specific metaphysical assumption: **semantic resemblance is evidence of causal history.** If Student A's painting looks like Master B's painting, the evaluator infers that Student A accessed Master B's work and replicated the decisions. Here, the visual similarity is a symptom of a specific causal chain (observation → imitation → production). The ethical breach is not merely that the images look alike, but that the labor of decision-making was bypassed.

  Generative AI disrupts this architecture by introducing **procedural derivation**. In this mode, an image is generated not by referencing a specific source instance, but by navigating a latent space constructed from the statistical aggregation of thousands of sources. The causal history is not "I saw X and copied it," but "I queried a model trained on the statistical shadows of X, Y, and Z." The resulting image may bear a strong semantic resemblance to existing work, but there is no specific instance that was stolen. When a rubric labels this output a "copycat" case, it is no longer judging the causal history (theft of labor); it is judging the semantic resemblance (proximity to a corpus). This is a fundamental shift. It moves the criteria from *process ethics* (did you do the work?) to *outcome statistics* (does this look too much like the past?).

  This conflation becomes dangerous when we attempt to apply a uniform plagiarism policy across the three modes. Consider the triad of practices:

  1.  **Direct Reproduction:** Intentional tracing or close mimicking of a specific source.
  2.  **Procedural Derivation:** Algorithmic generation based on statistical training data.
  3.  **Stylistic Convergence:** Independent creators arriving at similar visual solutions due to shared cultural training or limited problem spaces.

  If a policy treats all three as instances of "lack of originality," it inevitably fails. If the policy is strict on **semantic resemblance** to catch Procedural Derivation, it inevitably punishes Stylistic Convergence. In design, there are only so many ways to solve a specific functional problem; in art, styles move in zeitgeists. If two students independently produce work that resembles a popular aesthetic, a resemblance-based policy flags both as "derivative." This over-punishes independent labor and chills legitimate cultural participation.

  Conversely, if the policy focuses strictly on **causal history** (intent to copy) to protect against unfairness in Convergence, it becomes blind to Procedural Derivation. A student can claim they "did not intend to copy" because they merely typed a prompt, even if the tool was designed to synthesize existing styles. A causal-history policy under-punishes the use of tools that automate the very decision-making labor the curriculum is meant to teach. The uniform concept of "copycat" cannot stretch to cover both the theft of a specific image and the statistical amortization of a style without breaking.

  The core metaphysical mistake is the assumption that "originality" is a property of the *object* rather than the *process*. By labeling procedurally derived work as "copycat," we imply the image itself carries the stain of plagiarism. But in procedural derivation, the image is a new instance generated from a probability distribution. It is not a copy; it is a synthesis. To call it a copy is to pretend that the statistical average of a million images is equivalent to the specific theft of one. This pretense only survives in small domains where instructors can verbally interrogate students to discern the difference. In a larger, scalable evaluation system, this slippage would render judgment impossible.

  Therefore, we require a domain-specific taxonomy that decouples these practices rather than subsuming them under a single moralizing label.

  *   **Reproduction** should be reserved for direct mimetic acts where the causal link to a specific source is intentional and deceptive. This is an ethical breach.
  *   **Derivation** should be recognized as a technical process category specific to generative systems. It is not inherently unethical, but it is epistemically distinct. It requires transparency (disclosure of tool use) rather than punishment. It shifts the evaluation from "did you make this?" to "how did you curate this?"
  *   **Convergence** should be acknowledged as an inevitable cultural phenomenon. Resemblance without causal link is not plagiarism; it is often a sign of successful enculturation into the discipline.

  Adopting this taxonomy addresses the critical worry that we are policing outcomes while pretending to police intentions. Currently, when an instructor flags AI work as "derivative," they are often reacting to a "feel" of statistical smoothness or stylistic pastiche. They are policing the *outcome* (the look of the data) while accusing the student of an *intention* (laziness or theft). This is dishonest. It accuses the student of stealing when they may have merely generated.

  By distinguishing Derivation from Reproduction, we admit that the "crime" in generative contexts is not necessarily theft, but potentially a lack of *agency*. The evaluation shifts from "Is this unique?" (an outcome metric prone to false positives on Convergence) to "Did the student exercise critical selection?" (a process metric). If a student uses a generative tool but cannot justify why the output fits the prompt or how it was iterated, they fail on agency, not on originality.

  Maintaining the fluid concept of "copycat" protects the institution from having to redefine authorship, but it does so at the cost of conceptual integrity. It forces evaluators to act as metaphysical detectives, trying to prove a negative (that no causal link exists) based solely on visual evidence that is no longer reliable. In a small studio, this slippage is hidden by dialogue. But as a conceptual framework, it is rotting. We must stop treating the statistical shadow of a corpus as equivalent to the theft of a specific artifact. Without a taxonomy that distinguishes Reproduction, Derivation, and Convergence, art and design education risks becoming a system that punishes statistical probability while failing to protect actual human labor.
