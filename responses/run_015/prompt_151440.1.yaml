  The Challenger decision reflects clashing satisficing agents rather than monolithic groupthink. Thiokol engineers sought safety certainty, searching for data proving O-ring failure, while NASA managers, bounded by schedule pressures, sought launch justification, stopping search once data lacked definitive proof of catastrophe. Their options were launch, delay, or dig deeper, weighing safety risks against schedule payoffs, but thresholds diverged: engineers needed proof of danger to delay, managers needed proof of safety to launch. When engineers couldn't quantify cold effects precisely, they hit their informational bound and flipped, accepting managerial risk thresholds because their search yielded inconclusive results rather than absolute proof. This highlights a gap in Simon's model: incompatible aspiration levels between subunits. Bounded rationality explains cognitive limits but misses coercive hierarchy; it wasn't just stopping search early, but NASA's status forcing their "good enough" onto Thiokol. The engineers didn't merely satisfice; they were overruled by social pressure disguised as data requirements. Thus, the disaster reveals how organizational power distorts satisficing, where one agent's aspiration level dominates another's, turning a cognitive shortcut into a structural failure where schedule satisfaction trumped safety constraints, proving that bounded rationality alone cannot explain decisions made under coercive pressure.
