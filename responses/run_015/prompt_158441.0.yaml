  # Workshop Consensus Document: Pain Asymbolia and the Badness of Pain

  **Preface**
  This document records the output of a two-day workshop convened to adjudicate what pain asymbolia reveals about the nature of pain's badness. Participants represent two primary positions: the *Affect Camp*, which locates badness in separable unpleasantness, and the *Hurtfulness Camp*, which locates badness in intrinsic sensory hurtfulness. Both camps agree to argue from a stipulated clinical syndrome rather than external literature. This document separates metaphysical claims about badness from epistemological claims about authority, and distinguishes welfare badness from normative reasons.

  ## 1. Agreed Claims

  Both camps endorse the following stipulations and methodological constraints. Where consensus reflects a methodological truce rather than substantive agreement, this is noted.

  1.  **The Stipulated Syndrome:** Subjects localize and describe sensations, discriminate qualities, and rate intensity similarly to controls. They report the sensation does not bother them, express indifference to its continuation, and may exhibit cheerful behavior. Sub-personal withdrawal reflexes remain intact. No external clinical data may be appealed to beyond this stipulation.
  2.  **Three Distinct Questions:** The discussion must distinguish: (a) Whether the state is bad for the subject in a welfare sense; (b) Whether the subject has a reason of their own to want it to stop; (c) Whether anyone else has a reason to bring it to an end. Agreement on one does not entail agreement on the others.
  3.  **Authority vs. Reality:** Claims about what *is* bad are distinct from claims about what is *authoritative* in the subject's verdict. Neither camp claims introspective reports are simply authoritative regarding the metaphysical nature of badness, though they differ on what the reports evidence.
  4.  **Illegitimate Moves:** It is illegitimate to argue that tissue-damage considerations settle the metaphysical dispute, or to generalize findings from asymbolia to the badness of ordinary pain in ordinary subjects without further argument.
  5.  **The Imperative Gloss:** Both camps treat the gloss of badness as an "imperative command" issued by sensation as a distinct conceptual hypothesis to be tested against the cruxes in Section 3, rather than as a settled premise or a mere mistake.
  6.  **Empirical Assumptions:** Where the argument requires empirical premises not contained in the stipulation (e.g., regarding neural correlates), these must be stated as explicit assumptions rather than established results. (Truce: We agree to suspend judgment on neural mechanisms.)

  ## 2. Table of Residual Disagreements

  The following table isolates remaining disputes. Where a disagreement is marked "Verbal," the surviving substantive question is noted in the verdict column.

  | Issue | Affect Camp Formulation | Hurtfulness Camp Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Is it Pain?** | Yes, but it is pain minus its essential bad-making component (unpleasantness). | Yes, it is pain minus the normal conative response; the hurt remains intact. | **Verbal.** Surviving question: Which component is essential to the natural kind "pain"? |
  | **Bad for Subject?** | No. Without unpleasantness, the state is welfare-neutral, like touch. | Yes. The hurtful phenomenology is intrinsically bad for the subject regardless of response. | **Substantive.** Disagreement on the locus of welfare value. |
  | **Subject's Reason** | No intrinsic reason to stop it. Any reason is instrumental (e.g., to prevent damage). | Yes. The hurtfulness itself provides an intrinsic reason to want it to stop. | **Substantive.** Disagreement on the source of normative reasons. |
  | **Others' Reason** | Only derivative reasons (e.g., preventing future ordinary pain or damage). | Direct reason. The objective badness of the state warrants intervention. | **Substantive.** Disagreement on paternalistic justification. |
  | **Intensity Rating** | Evidence only of sensory magnitude, not badness. | Evidence of hurt magnitude, which correlates with badness. | **Substantive.** Disagreement on what intensity scales measure. |
  | **Report Authority** | Authoritative regarding unpleasantness (which is absent). | Not authoritative regarding badness (which is present despite indifference). | **Substantive.** Disagreement on introspective scope. |
  | **Imperative Gloss** | Adopts as own view: Badness is a command to avoid, which is ignored in asymbolia. | Treats as third view or mistake: Badness is a property, not a speech act; the command model conflates cause and content. | **Substantive.** Disagreement on the metaphysics of normative phenomenology. |

  ## 3. Table of Cruxes

  The following cases were stipulated to test predictions. Each camp recorded predictions and concessions in advance.

  | Crux | Case Description | Affect Camp Prediction | Hurtfulness Camp Prediction | Concession if Prediction Fails |
  | :--- | :--- | :--- | :--- | :--- |
  | **Instrumentality** | **Lever-Pressing:** Asymbolic works to escape stimulus, citing tissue damage. When fully reassured no damage is occurring, they cease pressing. | **Confirmed.** Behavior is purely instrumental. Without damage threat, motivation vanishes. | **Failed.** If motivation vanishes solely on reassurance, the hurt itself provided no reason. **Concede:** Hurtfulness does not generate intrinsic reasons. |
  | **Cost Acceptance** | **Pill-Taking:** Subject denies bother but will pay a small cost or take a harmless pill to stop the sensation. | **Failed.** Willingness to pay cost implies negative value. **Concede:** There is a disvalue distinct from reported bother. | **Confirmed.** Willingness to pay cost reveals hidden aversiveness or rational precaution, not intrinsic badness of the sensation. |
  | **Memory & Contrast** | **Reversible-Drug:** Subject is unwilling pre-drug, indifferent during, content post-drug. Compare acquired (remembers ordinary pain) vs. congenital asymbolia. | **Confirmed.** Indifference is real. Congenital subjects lack contrast, explaining uncertainty. | **Failed.** If acquired subjects report the past state was bad despite indifference, badness is retrospective. **Concede:** Welfare assessment depends on narrative identity, not just momentary phenomenology. |
  | **Dissociation** | **Mirror Case:** Free-floating being-hurt with no location or describable sensory quality. | **Confirmed.** Proves affect can exist without sensory content, supporting separability. | **Failed.** If such a state is unintelligible or reported as non-pain, hurtfulness requires sensory grounding. **Concede:** Hurtfulness is not freestanding. |
  | **Specificity** | **Cross-Modal:** Intervention removes unpleasantness for pain but spares it for itch and nausea. | **Confirmed.** Supports modularity of affect systems. | **Failed.** If removal is global or impossible to isolate, affect is not a separable component. **Concede:** Affect is not a distinct neural or phenomenal module. |
  | **Reporting** | **Flat-Affect Confound:** Subject has global blunting; zero unpleasantness rating may be expressive deficit (like unable to smile). | **Failed.** If ratings are due to deficit, phenomenology may still contain unpleasantness. **Concede:** Introspective reports in asymbolia are not reliable evidence of absence. | **Confirmed.** Analogy holds; report reflects genuine phenomenal absence, not motor deficit. |

  ## 4. Closing Limitations and Weaknesses

  Neither camp claims that asymbolia settles the badness of ordinary pain in ordinary subjects. The syndrome is a dissociation case; generalizing from pathology to normal function requires bridging premises neither side currently possesses. Furthermore, neither camp claims that tissue-damage considerations settle the metaphysical dispute; damage explains the evolutionary origin of pain but not its normative status in the asymbolic subject. Finally, neither camp treats introspective reports in these cases as simply authoritative; reports are data to be interpreted, not incorrigible truths.

  Both camps acknowledge a specific weakness in their respective positions, agreed upon by the opposing side as the most vulnerable point of attack.

  **Affect Camp Weakest Point:** Explaining why the sensory state of pain is not merely neutral, like touch, if the unpleasantness is removed. If the sensory component carries no badness, it is difficult to explain why the state is universally classified as pain rather than a distinct sensory modality, or why we prioritize its removal in ordinary cases beyond mere habit.

  **Hurtfulness Camp Weakest Point:** Explaining the subject's report of indifference without accusing them of error about their own experience. If the state is bad and hurtful, the claim that it "does not bother" the subject requires positing a disconnect between badness and bothering that risks making badness undetectable to the subject, undermining the phenomenological basis of the view.

  **Signed,**
  **The Participants**
