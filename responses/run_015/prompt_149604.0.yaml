      *   *Step 4: The Alternative Mechanism.* Show a system that navigates successfully *without* that structure (the Carrying Example).
      *   *Step 5: The Elimination.* Argue that if the mechanism lacks the structure, the attitude doesn't exist, even if the prediction works.
      *   *Step 6: The Human Case.* Apply back to humans.

  4.  **Selecting the Carrying Example:**
