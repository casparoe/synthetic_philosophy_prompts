answer: |-
  ### Conceptual Dependencies Brainstorm

  Before structuring the session, we must isolate the specific conceptual architecture required to make eliminativism about propositional attitudes intelligible. The standard error is treating eliminativism as a claim about *substance* (brains vs. souls) rather than a claim about *structure* (distributed dynamics vs. compositional syntax).

  1.  **The Nature of the Target:** Students must first grasp that a "belief" in this context is not just a causal state, but a state with *propositional content*. This requires a commitment to **compositionality** (the ability to combine parts to form new wholes) and **truth-evaluability** (the state represents the world as being a certain way). Without defining the "Language of Thought" (LOT) hypothesis implicitly, they cannot understand what is being eliminated.
  2.  **The Explanatory Gap:** They need to see that successful prediction of behavior does not entail the existence of the states used to predict it. This requires distinguishing the *Intentional Stance* (predicting by attributing attitudes) from the *Design/Physical Stance* (predicting by mechanism).
  3.  **The Alternative Mechanism:** They must be presented with a working model of cognition that produces adaptive, belief-like behavior *without* using discrete, structured representations. If they cannot conceive of cognition without sentences-in-the-head, eliminativism looks like absurdity rather than a theoretical alternative.
  4.  **The Ontological Commitment:** Finally, they must understand that if the mechanism lacks the structural properties required for propositional content (syntax/compositionality), then the term "belief" does not refer to anything in that system, even if the system acts *as if* it has beliefs.

  ---

  ### Session Plan: The Architecture of Elimination (90 Minutes)

  #### I. The Sequence of Introduction
  *Do not begin with "Eliminative Materialism." Begin with the conditions required for a belief to exist.*

  1.  **The Structural Requirement (0–15 mins):** Define a "propositional attitude" not by how it feels, but by what it must *do*. Establish that for a system to literally hold a belief that $P$, it must possess an internal vehicle that mirrors the structure of $P$ (e.g., to believe "The cat is on the mat," the system must distinguish 'cat', 'mat', and 'on', and recombine them). *Dependency:* This establishes the "Language of Thought" prerequisite without naming it.
  2.  **The Interpretive Overlay (15–30 mins):** Introduce the practice of attributing beliefs as a predictive tool. Show how we project structure onto systems to navigate them socially. Establish that this attribution is *external* to the system's operation.
  3.  **The Carrying Example (30–55 mins):** Introduce the **Reinforcement Learning (RL) Navigation Agent**. Demonstrate how it behaves *exactly* as if it has beliefs ("believes" wall is ahead) and desires ("wants" goal), while revealing its actual architecture (value functions, weighted matrices, gradient descent).
  4.  **The Mismatch and Elimination (55–75 mins):** Compare the Structural Requirement (Step 1) with the RL Architecture (Step 3). Show that the RL agent lacks discrete tokens and compositional syntax. Conclude that because the structure is missing, the propositional attitudes do not exist in the system, only the behavior does.
  5.  **Application to Humans (75–90 mins):** Briefly pivot to the human brain. If human cognition operates on similar distributed, dynamic principles (as the CogSci student can affirm) rather than symbolic manipulation, the same elimination applies.

  #### II. The Carrying Example: The Reinforcement Learning (RL) Navigation Agent

  **The Case:** A neural-network-based agent trained to navigate a maze to find a reward token while avoiding penalty zones.

  **What it must exhibit (to invite attribution):**
  *   **Context-Sensitive Updating:** If a wall moves, the agent alters its path immediately. (Looks like *belief revision*).
  *   **Goal-Directedness:** It takes detours to avoid penalties, prioritizing the reward. (Looks like *desire/preference*).
  *   **Counterfactual Sensitivity:** If the reward moves, it searches the new location. (Looks like *understanding*).

  **What it must lack (to justify elimination):**
  *   **Discrete Representational Tokens:** There is no variable in the code labeled `WALL_LOCATION` or `GOAL_DESIRE`.
  *   **Compositional Syntax:** The "knowledge" of the wall is not a distinct unit that can be combined with other units. It is distributed across thousands of connection weights. You cannot isolate the "belief" that the wall is north; the information is smeared across the network's state.
  *   **Truth-Evaluable Vehicles:** The internal states are activation values (floats between 0 and 1), not sentences that can be true or false. They are triggers for action, not descriptions of the world.

  **Why this anchors the session:** It forces the students to confront a system where the *utility* of belief-talk is 100%, but the *ontology* of belief is 0%. It breaks the intuition that "successful navigation implies internal mapping."

  #### III. Mapping Predictable Misconceptions

  **Misconception 1: "Eliminativism is just saying brains are physical."**
  *   *When it forms:* During Step 1 (Structural Requirement). Students will assume you are arguing against dualism.
  *   *Interruption Point:* Explicitly state: "A physicalist can believe in beliefs. If the brain contained a literal file cabinet of sentences, physicalism would be true *and* beliefs would exist. Eliminativism claims the brain is physical *but not in that way*."

  **Misconception 2: "If the behavior is identical, the belief is real (Functionalism)."**
  *   *When it forms:* During Step 3 (The Carrying Example). Students will argue that if the agent acts like it has beliefs, it has beliefs.
  *   *Interruption Point:* Interrupt at the "Structure" comparison. "Functionalism requires the *causal role* to be matched. But the causal role of a belief depends on its content. If there is no vehicle with content structure, there is no causal role for a belief to play, only a causal role for *activation patterns*."

  **Misconception 3: "This means humans are zombies / don't think."**
  *   *When it forms:* During Step 5 (Application to Humans). They will slide from "no propositional attitudes" to "no cognition."
  *   *Interruption Point:* Distinguish *processing* from *propositionalizing*. "The system still computes, learns, and adapts. We are eliminating the *description format* (sentences), not the *activity* (thinking). We are saying thinking happens without sentences."

  **Misconception 4: "It's just a useful fiction (Instrumentalism)."**
  *   *When it forms:* Throughout. Students will retreat to "Beliefs are just useful tools for prediction."
  *   *Interruption Point:* At Step 4 (The Mismatch). "Instrumentalism says we can't know if they exist. Eliminativism says the theory positing them makes a specific structural claim about the mechanism, and that claim is false. It is not agnostic; it is a denial of the mechanism's architecture."

  #### IV. Check-for-Understanding Exercise

  **The "Architecture Diagnosis" Task (10 Minutes)**

  Present the students with two hypothetical systems, **System A** and **System B**, both of which successfully navigate a complex environment.

  *   **System A:** Operates by accessing a database of rules (e.g., `IF obstacle_ahead THEN turn_right`). It stores distinct symbols for objects and relations.
  *   **System B:** Operates via a dynamic field where activation spreads continuously. "Obstacles" create repulsion gradients in the field; "Goals" create attraction gradients. There are no stored symbols, only shifting peaks of activation.

  **The Question:**
  "According to the specific eliminative claim we discussed today, which system possesses beliefs and desires? Justify your answer *solely* by referencing the internal architecture, not the external behavior."

  **Success Criteria:**
  *   **Pass:** They identify System A as the candidate for having propositional attitudes (because it has compositional structure/vehicles) and System B as the candidate for elimination (because it lacks discrete truth-evaluable vehicles), even though both behave identically.
  *   **Fail:** They say both have beliefs (behavioral criterion), neither has beliefs (skepticism), or they focus on whether the systems are "physical" or "conscious."

  #### V. Standard Material to Exclude

  To maintain the integrity of the structural argument, the following standard pedagogical tools must be omitted:

  1.  **The Phlogiston Analogy:**
      *   *Reason for Exclusion:* This analogy frames Folk Psychology as a *failed theory* about entities that turned out not to exist. This encourages students to think eliminativism is about the *non-existence of causes*. My plan argues that the *description of the cause* (propositional structure) is incorrect. Phlogiston suggests "nothing is there"; Eliminativism suggests "something is there, but it isn't a belief."
  2.  **Debates on Phenomenal Consciousness (Qualia):**
      *   *Reason for Exclusion:* This distracts from the core issue of *propositional content*. Students will conflate "I don't have beliefs" with "I don't feel pain." The session must remain strictly about the architecture of cognitive attribution, not the ontology of experience.
  3.  **General Arguments for Physicalism:**
      *   *Reason for Exclusion:* Do not spend time arguing that the brain is a physical object. This session assumes physicalism. Time spent defending physicalism is time lost distinguishing physicalism from *eliminativism*.
  4.  **Canonical Quotations (e.g., Churchland's "Folk Psychology is a Theory"):**
      *   *Reason for Exclusion:* Quotations tend to reify the position as a dogma to be memorized. We want them to reconstruct the argument from the dependency of structure to content. Relying on authority shortcuts the conceptual work of seeing *why* the structure matters.
  5.  **The "Intentional Stance" as a Final Position:**
      *   *Reason for Exclusion:* While we use the Intentional Stance to introduce the *attribution* of beliefs, we must not leave students with the impression that Dennett's Instrumentalism is the conclusion. The session must push past "it's useful" to "it's structurally inaccurate."

  By adhering to this arc, you move the students from thinking of eliminativism as a denial of the *mind* to understanding it as a denial of a specific *format* of information processing. They will leave understanding that one can be a thoroughgoing materialist without being an eliminativist, and an eliminativist without denying the reality of adaptive behavior.
