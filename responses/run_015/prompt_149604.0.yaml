prompt: |-
  You are an expert philosophy educator and conceptual analyst specializing in philosophy of mind, with a reputation for building explanations that avoid standard textbook shortcuts. Please think carefully, and begin with a brief brainstorm of the conceptual dependencies before laying out the full teaching plan.

  I need to design a single ninety-minute session for a reading group of third-year philosophy undergraduates together with one visiting cognitive-science student. The idea I want them to actually understand—not merely label—is eliminative materialism specifically about beliefs and desires as propositional attitudes, rather than physicalism or materialism in general. Most will arrive thinking eliminativism just means brains are physical, or that it treats folk psychology like phlogiston. I want to avoid that framing entirely and instead construct the session around a more precise dependency: that propositional-content attribution is an optional interpretive overlay on adaptive behavior, one that can be fully accounted for by lower-level dispositional dynamics and predictive-error minimization without ever postulating internal representational vehicles that possess compositional structure and truth-evaluable content.

  Plan the explanatory arc for me. First, state the exact sequence in which the components must be introduced—what conceptual piece has to be in place before the audience can even see the eliminative claim as a live philosophical option rather than a denial of the obvious. Second, identify the one carrying example or case that should anchor the entire session: it needs to be a system where attributing a belief or desire feels completely natural and useful, yet the underlying mechanism clearly operates without anything resembling a sentence-in-the-head. Specify precisely what the example must exhibit (behavioral adaptivity, context-sensitive updating) and what it must lack (compositional syntax, discrete representational tokens that combine to form new thoughts). Third, map the misconceptions they will predictably form in the order they are likely to form them—I am particularly concerned about the slide from "beliefs are not necessary for scientific explanation" to "people do not really think or want anything"—and say exactly where in the sequence each misconception should be interrupted and how. Fourth, design one check-for-understanding question or brief exercise for the end that would reveal whether they have grasped the specific eliminative claim about propositional attitudes, rather than just adopting a vague physicalist posture or repeating that "beliefs don't exist" without knowing what work that denial is doing. Finally, be explicit about what standard material should be left out of this session—perhaps the full phlogiston analogy, perhaps extended debates about phenomenal consciousness, perhaps certain canonical quotations about theoretical entities—and explain precisely why including each would distort the dependency chain you have built. Do not suggest readings, a bibliography, or citations; I will supply references myself.
