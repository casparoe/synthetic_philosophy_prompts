      *   **Deliverables:**
          1.  Brainstorm of conceptual dependencies.
          2.  Exact sequence of components.
          3.  One carrying example/case (must feel natural to attribute beliefs, but mechanism lacks syntax/compositionality).
          4.  Map of predictable misconceptions (and where to interrupt them).
          5.  One check-for-understanding question/exercise.
          6.  Explicit list of standard material to *exclude* (and why).
      *   **Negative Constraint:** No readings, bibliography, or citations.

  2.  **Brainstorming Conceptual Dependencies:**
      *   To get to EM about propositional attitudes, students need to distinguish between *behavior* and *explanation of behavior*.
      *   They need to understand what a "propositional attitude" actually is (relation to a content-bearing state).
      *   They need to grasp the "Language of Thought" (LOT) hypothesis implicitly, because EM is mostly a denial of LOT. If they don't know what's being eliminated (structured internal sentences), they can't understand the elimination.
      *   They need an alternative model of cognition that explains success without representation (e.g., connectionism, dynamic systems, predictive processing).
      *   They need to see the gap between *utility* of folk psychology and *ontological commitment* to folk psychology.
      *   *Key Dependency:* The distinction between *instrumentalism* (useful fiction) and *eliminativism* (false theory). Actually, the prompt asks for EM, so I need to ensure they see why it's not just instrumentalism but a claim about the *mechanism* lacking the structure required for the attitudes to exist.
      *   *Refinement:* The prompt emphasizes "optional interpretive overlay." This leans towards a Dennettian stance but pushes further into Churchland-style elimination of the *structure*. I need to make sure they understand that without compositional structure, you literally *cannot* have a belief that $P$.

  3.  **Developing the Sequence:**
      *   *Step 1: The Phenomenon.* Start with successful navigation.
