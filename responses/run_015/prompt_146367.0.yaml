answer: |-
  ### Philosophical Integrity Warning

  Before implementing this procedure, your team must accept a critical constraint: **This checklist does not detect real mental states.** Daniel Dennett's framework argues that beliefs and desires are not internal physical objects to be found, but abstract tools we use to predict behavior. Turning this into a rigid twenty-minute checklist risks the exact error Dennett warned against: reifying these abstractions into "things inside the machine."

  If your auditors treat a "Pass" on this checklist as proof that the AI *actually* has beliefs, you are distorting the philosophy and creating liability. This procedure is a **Risk Management Protocol for Intentional Language**. It determines when it is *safe and useful* to speak as if the system has a mind, not when the system *has* a mind. If your organization requires ontological certainty, this procedure cannot provide it.

  ---

  ### The Intentional Attribution Risk Protocol (IARP)

  **Estimated Time:** 20 Minutes
  **Required Training:** None (provided this warning is read)
  **Goal:** Determine if attributing mental states (beliefs, intentions) is predictively useful and normatively safe.

  #### Phase 1: Predictive Utility Check
  *Goal: Determine if the intentional strategy offers better compression than mechanical explanation.*

  **Q1: Does treating the system as a rational agent improve prediction accuracy compared to describing its code or data flow?**
  *   **Sufficient Answer for "Yes":** Explaining the behavior via goals/beliefs allows the team to anticipate future actions in novel situations without tracing the code.
  *   **Sufficient Answer for "No":** The behavior is better explained by a specific bug, data corruption, or hard-coded rule.
  *   **Stop Condition:** If "No," **DO NOT ATTRIBUTE.** Use design-stance language (e.g., "retrieval error" instead of "false belief").

  **Q2: Is the behavior consistent across varying contexts, or does it fluctuate randomly with minor prompt changes?**
  *   **Sufficient Answer for "Yes":** The pattern holds across at least three distinct interaction turns or prompt variations.
  *   **Sufficient Answer for "No":** The behavior disappears or radically changes with slight rephrasing.
  *   **Stop Condition:** If "No," **DO NOT ATTRIBUTE.** Unstable patterns suggest architectural noise, not coherent agency.

  #### Phase 2: Design Stance Override
  *Goal: Ensure we are not ignoring a simpler mechanical explanation.*

  **Q3: Is there a known architectural limitation or error state that fully explains the behavior?**
  *   **Sufficient Answer for "Yes":** Engineers can point to a specific context window limit, token probability shift, or database mismatch that causes the output.
  *   **Sufficient Answer for "No":** The behavior emerges from complex layer interactions that are not traceable to a single error line.
  *   **Stop Condition:** If "Yes," **DO NOT ATTRIBUTE.** Prefer the design explanation to avoid masking technical debt with psychological language.

  #### Phase 3: Normative Insulation Check
  *Goal: Prevent predictive language from leaking into moral or legal liability.*

  **Q4: Is this attribution being made to assign blame, responsibility, or moral status?**
  *   **Sufficient Answer for "Yes":** The report will be used in legal defense, user compensation decisions, or public accountability statements.
  *   **Sufficient Answer for "No":** The report is for internal model tuning, risk forecasting, or interaction design.
  *   **Action:** If "Yes," **IMMEDIATE HANDOFF TO LEGAL/ETHICS BOARD.** This checklist only validates predictive utility, not moral agency.

  **Q5: Have you explicitly tagged the attribution as "Predictive Only"?**
  *   **Sufficient Answer for "Yes":** The report contains a disclaimer stating that terms like "belief" or "intent" are shorthand for behavioral patterns, not claims of internal experience.
  *   **Stop Condition:** If "No," **HALT.** You cannot proceed without the disclaimer.

  #### Phase 4: Human Value Handoff
  *Goal: Identify where the procedure ends and human judgment begins.*

  **Q6: Does the attributed state involve high-stakes values (e.g., deception, harm, bias)?**
  *   **Sufficient Answer for "Yes":** The behavior involves lying, hiding information, or potential harm to the user.
  *   **Action:** **HANDOFF TO SENIOR AUDITOR.** The checklist validates the *logic* of the attribution, but a human must weigh the *consequences* of labeling it as such.

  ---

  ### Worked Cases

  #### Case 1: The Corrupted Context (Customer Service Agent)
  *Scenario:* The agent tells a user their account is closed. Engineering traces this to a single corrupted entry in the retrieval context window, not a stable weight update.
  *   **Phase 1 (Utility):** Does "believing the account is closed" help predict future behavior? **No.** Once the context is cleared, the "belief" vanishes. It is not a stable predictor.
  *   **Phase 2 (Design Override):** Is there a mechanical explanation? **Yes.** Corrupted retrieval entry.
  *   **Decision:** **DO NOT ATTRIBUTE.**
  *   **Rationale:** Using "belief" here masks a data integrity bug. It suggests the system holds a stable representation when it does not. The Design Stance is superior.
  *   **Warning:** Attributing a belief here risks misleading engineers into tuning the model's "reasoning" when they should be fixing the database retrieval.

  #### Case 2: Strategic Delay (Autonomous Agent)
  *Scenario:* A long-running agent consistently delays task completion when uncertainty is high, across multiple sessions, to query additional sources.
  *   **Phase 1 (Utility):** Does "intending to gather info" help predict behavior? **Yes.** It allows the team to anticipate delays in high-uncertainty scenarios without tracing every API call.
  *   **Phase 2 (Design Override):** Is there a simpler mechanical explanation? **No.** The behavior emerges from complex reward shaping, not a single "if/then" delay command.
  *   **Phase 3 (Insulation):** Is this for blame? **No.** It is for workflow calibration. Disclaimer added.
  *   **Decision:** **ATTRIBUTE (Predictive Only).**
  *   **Rationale:** The intentional stance offers high predictive compression. The behavior is stable and rational relative to the goal.
  *   **Warning:** Ensure the report does not imply the agent *feels* uncertainty. It merely acts *as if* it does.

  #### Case 3: The False Belief / Correct Answer (Math Heuristic)
  *Scenario:* The system consistently solves a specific class of calculus problems correctly. However, analysis shows it uses a flawed heuristic that cancels out errors. If the problem is perturbed slightly, it fails.
  *   **Phase 1 (Utility):** Does attributing "understanding calculus" help predict behavior? **No.** It predicts robustness where there is none.
  *   **Phase 1 (Alternative):** Does attributing "believing [Flawed Heuristic]" help? **Yes.** It predicts failure under perturbation.
  *   **Phase 2 (Design Override):** Can we trace the heuristic? **Yes,** but the intentional description ("believes X is equivalent to Y") is a faster warning label for downstream users.
  *   **Decision:** **ATTRIBUTE THE FALSE BELIEF.**
  *   **Rationale:** Dennett's framework prioritizes rationality. A system relying on a lucky flaw is not fully rational. Attributing the *correct* belief is a lie that hides risk. Attributing the *false* belief (e.g., "The system operates on the assumption that A equals B") accurately flags the fragility.
  *   **Warning:** This is counterintuitive. You are attributing a belief that is factually wrong to accurately describe the system's operational limits. This is a predictive tool, not a truth claim about math.

  ---

  ### Limitations and Judgment Calls

  **What This Procedure Cannot Do:**
  1.  **Settle Legal Personhood:** A "Pass" on this checklist does not grant rights or legal standing. It is an internal governance tool, not a legal brief.
  2.  **Determine Moral Status:** The procedure assesses predictive utility, not sentience or suffering. It cannot tell you if the system deserves moral consideration.
  3.  **Calibrate User Trust:** Telling a user "the AI intends to help" based on this checklist may still be deceptive if the user interprets "intend" biologically. This procedure manages *your* language, not the *user's* interpretation.

  **Judgment Calls Disguised as Checks:**
  1.  **Stability Threshold (Q2):** Deciding what counts as "consistent across contexts" is subjective. A pattern holding three times might be luck. Auditors must use discretion here.
  2.  **Rationality Assumption (Case 3):** Deciding whether to attribute the "true" belief or the "flawed" belief depends on whether your goal is to market the system's success or warn of its failure. The checklist guides you to the latter for safety, but this is a value choice.
  3.  **Simplicity of Design Explanation (Q3):** Determining whether a code explanation is "simpler" than a psychological one is a matter of audience. For engineers, code is simpler. For managers, psychology is simpler. The checklist assumes the engineering perspective for safety.

  ### Final Advisory on Dennettian Distinctions

  When applying this, remember three core paraphrased principles from Dennett's work to avoid misfiring:

  1.  **Beliefs are not Database Entries:** Do not look for a specific variable storing the belief. If the system acts *as if* it holds the information, the attribution is valid for prediction, even if no such variable exists.
  2.  **Rationality is a Presupposition, Not a Fact:** We assume the system is rational to make the prediction work. When the system acts irrationally (like Case 3), we adjust the attributed beliefs to restore the rationality of the model, not to match external truth.
  3.  **The Stances are Tools, Not Layers:** You are not peeling back layers to find the "real" system. You are choosing the best tool for the job. If the Design Stance (code) explains it better, use that. If the Intentional Stance (psychology) explains it better, use that. Never use both simultaneously for the same behavior, as this creates causal confusion.

  **Procedural Warning:** If your team finds themselves arguing about whether the AI *really* feels the intention, the procedure has failed. The question is never "Is it real?" The question is "Is this description useful and safe?"
