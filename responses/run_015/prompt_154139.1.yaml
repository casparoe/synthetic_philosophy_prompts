  ### Which Rule is She Running?

  I would bet she is running the **Objective Justice Rule**.

  *   **Why:** Her clearest, most consistent distinctions (Cases 1, 3, 4) all hinge on which side is objectively right. The "Weapon" comment was a waffle ("she immediately said she wasn't sure that mattered"). The Cook/Owner distinction was an admitted failure of principle. The only stable pillar is that **Objective Justice determines Liability; Subjective Motive determines Blame.**
  *   **The MEC Status:** She has **quietly given up** the traditional Moral Equality of Combatants. Traditional MEC says combatants on both sides have equal right to kill and equal liability to be killed. Raya explicitly denies this: The Just Soldier cannot be permissibly killed (Case 3), while the Unjust Soldier can (Case 1). She accepts a *functional* equality in some cases (you can kill the Conscript out of necessity), but not a *moral* equality of status.

