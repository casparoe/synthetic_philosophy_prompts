  ### Summary for Your Argument
  Raya's view is that **you cannot be liable for doing what you have a right to do, even if you do it for the wrong reasons.** The PMC on the Just Side has a right to fight (objective justice), so he is not liable, even if his reason (money/indifference) is blameworthy. The "Weapon" comment is likely a post-hoc justification for why the *Unjust* side is liable, not a rule that strips the *Just* side of protection.
