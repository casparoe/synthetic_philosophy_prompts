  Here are the three rules that best systematize her verdicts, the prediction for your PMC case, and the test cases to probe her theory.

  ### The Three Rules Fit for Raya's Verdicts

  1.  **The Objective Justice Rule (Liability & Permissibility):**
      *   *Rule:* Whether a combatant is *liable* to be killed and whether killing them is *permissible* depends primarily on the **objective justice of the cause** they are fighting for, not their subjective motives or beliefs.
      *   *Evidence:* The "Racist Just Soldier" (Case 4) is not liable and cannot be permissibly killed, despite having terrible motives. The "Unjust Volunteer" (Case 1) is liable, even if he "doesn't much care." The "Just Soldier" (Case 3) is protected.
      *   *Weight:* This is the heavy lifter. It explains why the Just Side is generally immune from liability regardless of internal flaws.

  2.  **The Moral Responsibility Rule (Blameworthiness):**
      *   *Rule:* *Blameworthiness* tracks the agent's **epistemic state and motives**, independent of liability. You can be protected from being killed (not liable) but still be a moral jerk (blameworthy).
      *   *Evidence:* The "Racist Just Soldier" (Case 4) is not liable but is blameworthy. The "Unjust Conscript" (Case 2) is not liable and not blameworthy. The "Unjust Volunteer" (Case 1) is both liable and blameworthy.
      *   *Weight:* This explains why she separates "wronging" someone from "feeling bad" about killing them.

  3.  **The Direct Participation Rule (The Cook/Owner Boundary):**
      *   *Rule:* Liability requires **direct integration into the harm mechanism**. Contributing to the war effort economically or indirectly (Owner) does not make one liable, even if the contribution is causal. Feeding the fighters (Cook) or fighting (Infantry) does.
      *   *Evidence:* The Cook is liable; the Missile Factory Owner is not.
      *   *Weight:* This is the weak link. She admitted she lacks a "clean principled line" here, suggesting this rule is intuitive for her rather than derived from a deeper principle.

  ### Prediction: The Indifferent PMC on the Just Side

  Based on the **Objective Justice Rule** dominating her framework, here is the prediction for your Private Military Contractor (PMC) who fights for the Just Side but would have fought for the Unjust Side for the same fee:

  *   **Is he Liable?** **No.**
