answer: |-
  # Q&A PREPARATION SHEET
  **Candidate:** Final-Year PhD Student (Philosophy)
  **Venue:** Joint Philosophy–Psychology Seminar
  **Topic:** Re-diagnosing the 'Just-So Story' Objection & The Task Specification Remedy

  ---

  ### 1. The Ideological Bias Objection
  **Who:** Philosophers of Science (Gould–Lewontin veterans)
  **Question:** "You treat the 'just-so story' problem as a methodological lack of constraint. But Gould and Lewontin argued adaptationism is an *ideological* commitment to optimality and social status quo. If a researcher selects an 'ancestral task' that assumes competition over cooperation, or male control over female agency, your 'Task Specification' merely codifies their bias. How does your procedure filter out the politics buried in the premise?"

  **Reply (2 mins):**
  "That is the central tension, and I concede your point entirely regarding the *selection* of the task. My argument is not that Task Specification eliminates ideological bias, but that it renders it visible and testable. Currently, a bias can hide in the vague assertion that 'trait X is adaptive.' Under my proposal, the researcher must commit to a specific computational problem and a quantitative performance criterion *ex ante*.

  If a researcher specifies an ancestral task structure rooted in, say, patriarchal control, they are now making a falsifiable claim about the EEA and the computational requirements of that environment. We can then test whether that task structure actually existed or whether the proposed mechanism solves that problem better than a null model. It shifts the bias from an unfalsifiable assumption to a premise that can be empirically challenged. It doesn't purge politics, but it forces the politics into the open where they can be scrutinised alongside the data."

  **Weakest Point:** Relies on the community actually challenging the premises, which they might not if the bias is shared.
  **Concede:** Task Specification does not eliminate ideological priors in hypothesis generation.
  **Hold:** It transforms hidden assumptions into explicit, falsifiable premises.

  ### 2. The Naturalistic Fallacy & Harm Objection
  **Who:** Mainstream Social Psychologists
  **Question:** "Even if you fix the methodology, you're still naturalising behaviour. By insisting on 'ancestral tasks,' you imply our current behaviour is the solution to an ancient problem. This feeds media narratives that inequity or aggression are 'hardwired.' If your 'reverse-engineering wing' validates a harmful trait as an adaptation, haven't you failed ethically, regardless of your methodological rigour?"

  **Reply (2 mins):**
  "I distinguish between explaining the *origin* of a mechanism and prescribing its *current use*. My proposal demands we identify the computational problem a mechanism solved *then*, not whether it is useful *now*. In fact, rigorous Task Specification often reveals mismatches. If we specify the ancestral task precisely, we are better positioned to show when a mechanism is *maladaptive* in the modern environment.

  Regarding harm: obscurity protects bias, not clarity. If a claim is robustly supported by task analysis and data, suppressing it doesn't stop the media misusing it; only better philosophical literacy does. However, I explicitly concede that the 'conjecture' wing of EP—which lacks this rigour—should not be published as science. My remedy is designed to prevent the field from making authoritative claims it cannot support, which ultimately reduces the risk of harmful naturalisation."

  **Weakest Point:** Doesn't fully address the reputational damage of the field itself.
  **Concede:** Explanations of origin can be misused for normative claims; the field has a poor track record here.
  **Hold:** Methodological rigour reduces the risk of false positives that fuel harmful narratives.

  ### 3. The EEA Knowledge Objection
  **Who:** Practising Evolutionary Psychologists (Friendly but sceptical)
  **Question:** "You require us to specify the 'ancestral task structure' before data collection. But palaeoanthropology is fragmentary. We often infer the task *from* the psychology because the archaeological record is silent on social cognition. Aren't you setting a bar that makes most legitimate research impossible? You might be solving the philosophical problem by killing the science."

  **Reply (2 mins):**
  "That is a serious practical constraint, but I argue it is a necessary filter. If we cannot independently motivate the ancestral task structure—via ecology, primatology, or archaeology—we are indeed telling just-so stories. My proposal isn't that we need perfect knowledge of the EEA, but that we need *independent constraint*.

  If the only evidence for the task is the existence of the trait itself, we are circular. I am asking for a convergence of evidence. If the task specification is too uncertain, the hypothesis should remain in the 'conjecture' category I mentioned. I would rather shrink the field to what is defensible than expand it to what is merely plausible. This protects the 'reverse-engineering wing' from being dragged down by the speculative wing."

  **Weakest Point:** Might alienate practitioners who feel their best work is now "conjecture."
  **Concede:** This will reduce the volume of publishable EP research significantly.
  **Hold:** Volume is less important than validity; circularity must be broken.

  ### 4. The Formalisation Objection
  **Who:** Formal Epistemologist
  **Question:** "You speak of an 'unconstrained hypothesis space.' If you want to solve this, why not simply treat the competing stories (adaptation, spandrel, lag) as a set of models with priors? Why do you need a procedural requirement like Task Specification rather than a Bayesian model comparison where the 'task' is just a parameter?"

  **Reply (2 mins):**
  "Because the problem isn't just weighting; it's definition. In a standard Bayesian update, you need to know what the hypotheses *are*. In current EP practice, the 'adaptation hypothesis' is often a moving target. It shifts to accommodate data post hoc.

  Task Specification is a pre-condition for the model comparison you suggest. You cannot assign a prior probability to 'adaptation' if 'adaptation' isn't defined beyond 'it exists.' By forcing the specification of the computational problem and performance criterion, I am forcing the hypothesis to be mathematically or functionally precise enough to enter your Bayesian model in the first place. My remedy is the ontology required for your epistemology to function."

  **Weakest Point:** Risks sounding like I'm dismissing formal methods in favour of conceptual ones.
  **Concede:** A probabilistic framework is the ideal end-state for evaluation.
  **Hold:** Task Specification is the necessary prerequisite for that framework to be meaningful.

  ### 5. The Redundancy Objection
  **Who:** Practising Evolutionary Psychologists
  **Question:** "Good EP already does this. When we predict cheater-detection mechanisms, we specify the problem (social exchange) and the success condition (catching cheaters). Isn't this paper just telling us to do what we're already doing, but with more philosophical jargon? What work is this actually doing?"

  **Reply (2 mins):**
  "If the best practitioners already do this, my paper is a demarcation tool, not a discovery. The problem is that the label 'Evolutionary Psychology' applies equally to the rigorous work you describe and to the speculative 'lag' stories that lack task specifications.

  My proposal provides a criterion to distinguish the two. It allows us to say, 'This study meets the Task Specification requirement; that one does not.' Currently, when the speculative work is criticised, the rigorous work defends it by pointing to its own success. I am severing that link. I am giving you a way to say, 'That is not EP in the scientific sense I defend.' It protects your novel predictions from being tarred by the unconstrained hypothesis space of the conjecture wing."

  **Weakest Point:** Risks sounding like I'm policing their field rather than analysing it.
  **Concede:** Many top-tier researchers already approximate this standard.
  **Hold:** The field *as a whole* does not enforce it, leading to the 'just-so' reputation.

  ### 6. The "Conjecture" Branding Objection
  **Who:** Mainstream Social Psychologists
  **Question:** "You concede that a large subset of the field is 'conjecture.' If half of what is published under the banner of Evolutionary Psychology is, by your own admission, scientifically indistinguishable from storytelling, why shouldn't we reject the entire paradigm? Why keep the label at all?"

  **Reply (2 mins):**
  "Because the 'reverse-engineering wing' has generated novel, successful predictions that social psychology alone has not. The Wason selection task modifications, for instance, arose from specific task analyses. To throw out the paradigm because of the speculative wing is to lose those explanatory tools.

  I am arguing for a split verdict. We should treat the 'conjecture' wing as heuristic—useful for generating ideas, but not for confirming truths. We treat the 'Task Specified' wing as explanatory science. Blurring the distinction harms both. By clearly labelling the conjecture as such, we stop the overreach that angers your community, while preserving the rigorous core that offers genuine insight into cognitive architecture."

  **Weakest Point:** Social Psychs may not care about the "rigorous core" if the branding remains toxic.
  **Concede:** The branding is currently damaged and arguably toxic.
  **Hold:** The cognitive insights from the rigorous wing are too valuable to discard entirely.

  ### 7. The Exploration Objection
  **Who:** Philosophers of Science / General
  **Question:** "Requiring pre-specification of the task and performance criterion sounds like pre-registration on steroids. Doesn't this stifle exploratory research? Sometimes we find a phenomenon first and ask 'what is this for?' later. Your method seems to ban abductive reasoning."

  **Reply (2 mins):**
  "It does not ban abduction; it bans *confirmation* via abduction. You can observe a trait and speculate endlessly about its ancestral task. That is the 'conjecture' wing I defend as legitimate heuristic work.

  However, you cannot claim to have *tested* the hypothesis against the data that prompted it. My requirement applies when you move from 'this might be an adaptation for X' to 'this *is* an adaptation for X.' If you discover a phenomenon first, your next step must be to specify the task and gather *new* data against the performance criterion. It slows down the claim to truth, but it prevents the circularity of using the same data to generate and test the story."

  **Weakest Point:** Might be seen as overly bureaucratic for early-stage theory building.
  **Concede:** Exploratory work is vital and should not be stifled.
  **Hold:** Exploratory work cannot count as confirmatory evidence without new data.

  ### 8. The "Hope Nobody Asks" Question
  **Who:** Any (The Empirical Trap)
  **Question:** "Can you give us a concrete example of a famous EP finding that passes your 'Task Specification' test, and one that fails? If you can't name a specific study, isn't this just theoretical posturing?"

  *(Note: If asked, you must have a specific paper ready. If you hesitate, you look unprepared. If you pick a popular one and the EPs disagree, you lose credibility.)*

  **Reply (2 mins):**
  "Take Cosmides and Tooby's work on social exchange. They specify the task (detecting cheating in reciprocity), the computational problem (identifying violators of conditional rules), and the performance criterion (improved accuracy on deontic vs. indicative logic tasks). That passes.

  Conversely, consider broad claims about 'evolutionary aesthetics' where the ancestral task is vaguely defined as 'mate attraction' without a specific computational metric for what counts as attractive in that environment beyond the data itself. That fails. The distinction is whether the performance criterion is independent of the observed preference. If 'what we like' defines 'what was adaptive,' it fails. If 'what solves the problem' defines 'what we should like,' and we test that, it passes."

  **Weakest Point:** The EPs in the room might defend the "aesthetics" work or critique the Cosmides/Tooby interpretation.
  **Concede:** Boundary cases exist and will be debated.
  **Hold:** The principle of independent performance criteria is the dividing line.

  ---

  ### GENERAL STRATEGY NOTES
  *   **Tone:** Maintain a "friendly critic" stance. You are saving EP from itself, not destroying it.
  *   **The Concession:** Use your concession (that much of EP is conjecture) as a shield. When attacked on the field's failures, agree: "That is exactly why I propose this split."
  *   **British English:** Ensure you say "programme," "rigour," "defence," "centre," and "prioritise" during the spoken defence.
  *   **The Pivot:** If a question becomes hostile (especially from Social Psych), pivot to the *methodological* benefit for *their* field: "This actually helps social psychology by clarifying which evolutionary claims are robust enough to build upon."
