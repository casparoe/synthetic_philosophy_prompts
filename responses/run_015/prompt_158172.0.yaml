  # Distributive Justice: A Taxonomy of the Leveling-Down Objection

  ## The Logical Tree
  *Follow the branches by answering the case-based questions. Leaves = Positions. Italicized text = Empty/Impossible cells.*

  **1. THE HURRICANE CASE**
  *A hurricane destroys the surplus of the better-off half. Everyone is now equally poor. No one is better off; many are worse off. Is this outcome **in any respect** better than the unequal, richer status quo?*

  *   **YES (Equality has intrinsic value)**
      *   **2. ALL-THINGS-CONSIDERED VERDICT**
          *   *Is it better overall, despite the welfare loss?*
          *   **YES:** **TELIC EGALITARIANISM**
              *   *Awkward Commitment:* Must endorse making everyone poorer for no gain as a moral improvement.
          *   **NO:** **PLURALISTIC EGALITARIANISM**
              *   *Awkward Commitment:* Equality matters intrinsically but never trumps welfare; why posit the value?
          *   *[Empty Cell: Intrinsic value but welfare loss is neutral?]* → *Incoherent: If it's better in one respect and worse in none, it's better overall.*

  *   **NO (Equality has no intrinsic value)**
      *   **3. THE IGNORANCE CASE**
          *   *Two people have unequal income, but neither knows it, and social status is identical. Is there an injustice?*
          *   **NO:** **RELATIONAL EGALITARIANISM**
              *   *Awkward Commitment:* Permits massive material gaps provided social hierarchy is abolished.
          *   **YES (Justice is distributive)**
              *   **4. THE CHOICE CASE**
                  *   *Inequality arises solely because one person chose leisure over labor. Is compensation required?*
                  *   **YES:** **LUCK EGALITARIANISM**
                      *   *Awkward Commitment:* Lets the "reckless" starve to avoid subsidizing bad choices.
                      *   *[Empty Cell: Compensation required for choice but not luck?]* → *Unexplored: Inverts standard responsibility intuition.*
                  *   **NO (Responsibility insensitive)**
                      *   **5. THE THRESHOLD CASE**
                          *   *Everyone is above a decent minimum, but gaps remain. Do the gaps matter?*
                          *   **NO:** **SUFFICIENTISM**
                              *   *Awkward Commitment:* Ignores massive inequality among the wealthy as morally irrelevant.
                          *   **YES (Continuous concern)**
                              *   **6. THE WEIGHTING CASE**
                                  *   *Transfer $100 from Rich to Poor. Rich loses 1 welfare unit, Poor gains 0.9. Total welfare drops. Is this permitted?*
                                  *   **YES (Priority to worse-off):** **PRIORITARIANISM**
                                      *   *Awkward Commitment:* Prioritizes the worse-off even if total welfare drops significantly.
                                  *   **NO (Maximize sum):** **UTILITARIANISM (Sum-of-Benefits)**
                                      *   *Awkward Commitment:* Permits extreme inequality if the aggregate sum increases.
                                  *   *[Empty Cell: Priority to better-off?]* → *Unattractive: Elitism lacks defensive moral literature.*

  ---

  ## Diagnostic Quiz: Locate Your Position
  *Circle the option that best matches your intuition. Tally your answers to find your leaf.*

  | # | Case | A | B | C |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Hurricane:** Equality via destruction. | Better in some respect | Worse in every way | Depends on cause |
  | **2** | **Ignorance:** Unequal but unknown. | Injustice | No injustice | Unjust if status differs |
  | **3** | **Choice:** Inequality via lazy vs. hard. | Compensate | No compensation | Partial compensation |
  | **4** | **Threshold:** All above "enough." | Gaps don't matter | Gaps matter | Gaps matter less |
  | **5** | **Weighting:** Poor gain < Rich loss. | Permit transfer | Forbid transfer | Permit if gain > 0.5 |
  | **6** | **Existence:** Equality via non-existence of rich. | Better than leveling down | Same as leveling down | Worse (loss of life) |
  | **7** | **Multidimensional:** Income down, Welfare up. | Just | Unjust | Context dependent |
  | **8** | **Risk:** Policy lowers expected welfare for all but equalizes. | Acceptable | Unacceptable | Acceptable if voluntary |
  | **9** | **Status:** Hierarchy without income gaps. | Injustice | No injustice | Minor injustice |
  | **10**| **Brute Luck:** Inequality via natural talent. | Compensate | No compensation | Tax surplus only |

  ### Scoring Key
  *Count your selections. Match the dominant pattern.*

  *   **Mostly 1A, 2A, 4B, 5A:** **Telic Egalitarianism** (You value equality intrinsically).
  *   **Mostly 1A, 2A, 4B, 5B:** **Pluralistic Egalitarianism** (You value equality, but welfare trumps).
  *   **Mostly 1B, 2B, 9A:** **Relational Egalitarianism** (You focus on status, not goods).
  *   **Mostly 1B, 2A, 3A, 10A:** **Luck Egalitarianism** (You focus on responsibility).
  *   **Mostly 1B, 2A, 3B, 4A:** **Sufficientism** (You focus on thresholds).
  *   **Mostly 1B, 2A, 3B, 4B, 5A:** **Prioritarianism** (You weight the worse-off heavier).
  *   **Mostly 1B, 2A, 3B, 4B, 5B:** **Utilitarianism** (You maximize the sum).
  *   **Mostly 6A:** **Person-Affecting View** (Existence matters more than distribution).
  *   **Mixed 3A/3C or 5A/5C:** **Unnamed Hybrid** (e.g., Soft Luck or Weighted Sufficientism).

  ### Troubleshooting Non-Clean Fits
  *   **If you chose 1A but 5B:** You are likely a **Pluralist**. You acknowledge the intrinsic value of equality (1A) but refuse to let it override welfare (5B).
  *   **If you chose 2B but 4B:** You may be a **Relational Egalitarian** who worries about the *effects* of wealth on democracy, not the distribution itself.
  *   **If you chose 3A but 5B:** You are likely a **Luck Egalitarian** who rejects leveling down for brute luck but accepts welfare maximization for option luck.
  *   **If no pattern emerges:** You may hold a **Contextualist** view (different principles apply to different goods) or an **Unstable** view (your intuitions conflict on LDO). This is common; the LDO is designed to expose tension between equality and welfare.

