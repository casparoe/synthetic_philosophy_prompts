answer: |-
  You have independently reconstructed a significant position in contemporary philosophy of mind and ethics. The concept you are looking for is most precisely captured by the **Narrative Constitution of Personhood**, often discussed under the umbrella of the **Social-Narrative View**.

  The specific metaphor for the "locus" you described—a thing that has real effects but no spatial location, generated by the web of stories—is best named by Daniel Dennett as the **Center of Narrative Gravity**. However, Dennett's view is sometimes too deflationary (calling it a "fiction"). For the robust persistence conditions you are asking about, the work of **Marya Schechtman** (specifically her *Person Life View*) and **Hilde Lindemann** (on *Holding and Letting Go*) provides the structural edges you need.

  Here is the account with edges, tailored to your request for persistence conditions, identity criteria, and boundary cases.

  ### 1. The Concept: Narrative Constitution
  You are correct to reject standard "Psychological Continuity" (Locke), which relies on internal memory chains. You are also correct that "Narrative Identity" is often misdescribed as solely *self*-authored.

  In the view you are tracking, a person is not a substance (a soul) or a biological organism (a body), but a **character in a story**. Crucially, this story does not need to be told *by* the character to be effective. It can be told *about* them.

  *   **The Locus:** It is an abstract object, akin to a "center of gravity." A center of gravity is not a physical part of the object, yet it has a precise location, moves predictably, and explains the object's behavior. Similarly, the "person" is a theoretical point around which actions, responsibilities, and memories orbit.
  *   **The Mechanism:** Personhood is constituted by the *viability* of a narrative. As long as a coherent story can integrate the entity's past, present, and anticipated future, the person persists.

  ### 2. An Account with Edges
  You asked for persistence conditions, termination, and error states. Here is how the Narrative Constitution view adjudicates them.

  #### A. Persistence Conditions (When does it survive?)
  The entity persists so long as the **narrative thread remains retrievable**.
  *   **The Coma Case:** During the coma, the narrative is *suspended*, not terminated. The "story" is held open by the community (family, bank, employer). They act as **narrative proxies**. They maintain the "slot" in the social network, ensuring that when consciousness returns, the story can resume without a "fork." The persistence condition here is *social recognition of capacity to resume*.
  *   **The Change Case:** You can change politics, tastes, and habits because these are treated as *plot developments*, not *character breaks*. A story allows for character growth. It does not allow for incoherence. As long as the change can be narrated as "this happened, so I changed," the person persists.

  #### B. Termination Conditions (When does it stop?)
  The entity ceases to exist when the narrative thread is **irretrievably severed**.
  *   **Biological Death:** The ultimate termination, because no future actions can be integrated.
  *   **Social Death (Advanced Dementia):** This addresses your father's case. When the behavior becomes so fragmented that no coherent story can be constructed *even by others*, the narrative gravity collapses. Your mother saying "there he is" is an act of **narrative rescue**. She finds a fragment (a mannerism) that allows her to re-connect the current body to the past story. When she cannot do this, the "person" (the narrative locus) has faded, even if the organism remains. The person stops existing when the capacity for *anyone* to integrate the entity into a human life-story is lost.

  #### C. Error Conditions (Can it be got wrong?)
  Yes. Narratives can be false, but this does not necessarily destroy the person.
  *   **Factual Error:** If you believe you were brave, but you were actually cowardly, you are still the same person; the narrative is just factually incorrect. The "Center of Gravity" still exists, it is just calculated on bad data.
  *   **Coherence Error:** If the narrative becomes internally contradictory (e.g., "I am a pacifist" vs. "I kill for fun" without a bridging explanation), the identity becomes unstable.
  *   **Attribution Error:** If a community attributes a story to someone that fits them poorly (e.g., treating a victim as a perpetrator), they are damaging the person's identity (what Lindemann calls *Damaged Identities*). The person still exists, but their agency is constrained by the false story imposed on them.

  ### 3. The Boundary Case: Conflicting Stories (The Fork)
  *Scenario: Two incompatible but competently maintained stories are told about the same life (Person vs. Family).*

  In software terms: You have a **write conflict** on the same repository ID. Do you have two repos or one corrupted repo?

  **The Verdict:** You have **one person in an inconsistent state**, not two people.
  *   **Reasoning:** Personhood is anchored to the biological organism *plus* the social recognition of that organism as a locus of accountability. Since there is only one body and one legal ID, there is only one "slot" for the narrative gravity.
  *   **Priority:** There is a hierarchy of authority for resolving the conflict.
      1.  **First-Person Authority:** If the subject is competent, their narrative takes precedence. This is a pragmatic rule, not a metaphysical one. We treat the subject as the "primary author" because they have access to internal state (qualia, intentions) that outsiders lack.
      2.  **Second-Person/Community Authority:** If the subject is *not* competent (dementia, psychosis), the authority shifts to the "maintainers" (family, caregivers). They become the custodians of the narrative.
  *   **Fission:** The only time this results in "two people" is if the divergence becomes so total that the single body cannot sustain both narratives functionally (e.g., Dissociative Identity Disorder, or a sci-fi fission case). In normal social conflict, it remains one person experiencing **narrative dissonance**. The "inconsistency" is a bug in the social system, not a multiplication of the entity.

  ### 4. What It Is Not (Contrast Cases)
  To ensure the edges are clear, here is how this concept distinguishes itself from the near-misses you identified.

  | Concept | Why it is not this | The Narrative View Difference |
  | :--- | :--- | :--- |
  | **The Soul** | A soul is a *substance* (a "thing" inside). It is binary (you have one or you don't). | The Narrative Locus is *functional* and *gradual*. It can weaken (dementia) or be damaged (trauma) without vanishing instantly. |
  | **Psychological Continuity** | Relies on internal memory links (Locke). If memory breaks, the person dies. | Allows for memory loss if the *story* is maintained by others (Coma/Dementia cases). It is externalizable. |
  | **Legal Person** | A status conferred by the state. Can be revoked (e.g., "civil death"). | Pre-legal. We feel the "he is still in there" intuition even if the law were to declare him dead. It is moral, not statutory. |
  | **Set of Traits** | Traits are static data points. | The Narrative Locus is dynamic. It explains *why* traits changed. It is the logic of the change, not the data itself. |
  | **Self-Narrated Identity** | Requires the subject to tell the story. | **Crucial Distinction:** The story can be told *about* the subject. Infants, coma patients, and dementia sufferers have narrative identity conferred by others. |

  ### 5. Summary Definition
  If you need a definition to work with:

  > **Narrative Personhood:** A human being is constituted as a person by the existence of a coherent, temporally extended narrative that integrates their physical states, actions, and experiences. This narrative need not be consciously authored by the subject but must be sustainably maintainable by the subject or their social community. The "self" is the abstract locus (Center of Narrative Gravity) where this story converges. Persistence depends on the continuity of the story, not the continuity of memory or matter.

  ### 6. Recommended Reading
  Since you want to explore the edges further, these three sources map exactly to your three cases:

  1.  **Daniel Dennett, "The Self as a Center of Narrative Gravity"** (1991).
      *   *Why:* Explains the "locus" metaphor using abstract objects. Best for the engineering mind.
  2.  **Marya Schechtman, "The Constitution of Personhood"** (2011).
      *   *Why:* Specifically addresses the "Person Life View." She argues that to be a person is to live a life that *can* be narrated, solving the coma/infant problem.
  3.  **Hilde Lindemann, "Damaged Identities, Narrative Repair"** (2001).
      *   *Why:* Focuses on the "Holding" aspect. How families "hold" the identity of dementia patients when they can no longer hold it themselves. This matches your first case exactly.

  Your intuition is correct: the "thing" you are tracking is the **socially sustained narrative viability** of the human organism. It is not a ghost in the machine; it is the interface definition that allows the machine to participate in the network.
