prompt: |-
  I am a software engineer with no formal philosophy background, and for a couple of years now I have been bumping into a distinction I cannot name, partly because I do not know what term to look under.

  Three situations that feel to me like the same thing.

  First. My father had dementia. My mother would say, about the man in front of her, "that is not him any more" — and then, a month later, when some old mannerism surfaced for a few seconds, "there he is." What she was tracking was plainly not the body, which was continuous throughout; it was not memory, since by then he could not remember much of anything; and it was not his current behaviour taken on its own, which was the same in both cases. It seemed to be something like whether a certain story could still be got going about the person in front of her. When it could, he was there; when it could not, he was not.

  Second. I re-described a period of my own life: a job I left, which I had told as a principled stand, I now tell as an elaborate way of running away. Nothing about the past changed. But the re-description changed what I did next, and not merely how I felt about it. Meanwhile I have changed my politics, my tastes and my habits beyond recognition over fifteen years, and none of that registers, to me or to anyone who knows me, as becoming a different person — apparently because nobody ever folded those changes into a story. So changes count, or do not count, depending on whether they get narrated, which seems backwards if the story is only a description.

  Third. A colleague was in a coma for three weeks. Throughout, his debts, his promises and his job were treated as still attached to something, and everyone involved — family, employer, bank — behaved as though there were a single thing those attachments hung from, even though during that period nothing was being narrated by anybody. Afterwards people said he was "still in there." I want to know what the "he" and the "in there" are supposed to be.

  Roughly, then: a locus we treat as what a human being *is*, which has its own persistence conditions, which we locate at a person without locating it anywhere in space, which survives wholesale changes in memory, character and behaviour so long as a story can be told, and which seems to weaken or fail when no story can be told by anyone, including by other people on the person's behalf.

  Is there an established concept for this, and if so, which is the nearest one and how does my description differ from it? I have seen the phrase "narrative identity" used loosely and it does not seem to be quite it, since that seems to be about the story a person tells of themselves, and my cases seem to work — or fail — whether or not the person is doing the telling. I also want to know what this thing is *not*: it is not a soul, not psychological continuity of the memory-and-character sort, not a legal person, and not just a set of traits. And I would like the boundary cases adjudicated, particularly this one: if two incompatible but competently maintained stories are told about the same life — by the person and by their family, say, a bit like two long-lived branches of a repository — do we have two of these things, one with priority, or a single one in an inconsistent state, and what would settle it?

  I am not after a label to quote. What I want is an account with edges: what conditions a thing of this kind has to meet to persist, what makes it the same one over time, when it stops existing, and whether it can be got wrong about the person it belongs to. If nothing established fits, please say so plainly and give me a definition and contrast cases instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Background:** Software engineer, no formal philosophy background.
      *   **Problem:** Encountering a specific distinction/concept repeatedly but lacks the terminology.
      *   **Core Phenomenon:** A "locus" of personhood that persists through physical/psychological change, dependent on the viability of a *narrative* or *story*, but not necessarily told *by* the person.
      *   **Three Cases:**
          1.  Dementia: Father "is/isn't" there based on whether a coherent story can be sustained about him by others (mother), despite physical continuity and lack of memory.
          2.  Self-Re-description: Changing the story of a past event changes future actions/identity, while other changes (politics, tastes) don't count because they aren't narrated as identity-shifting.
          3.  Coma: Personhood persists despite zero narration/consciousness because social/legal structures hold the "slot" open for the story to resume.
      *   **Constraints/Exclusions:** Not a soul, not standard psychological continuity (Locke), not legal personhood, not just traits.
      *   **Specific Question:** Is there an established concept? If so, which one and how does it differ? If not, define it.
      *   **Key Requirement:** An account with "edges" (persistence conditions, identity conditions, termination conditions, error conditions).
      *   **Boundary Case:** Conflicting narratives (person vs. family) – do we have two entities, one with priority, or an inconsistent state?

  2.  **Initial Philosophical Mapping:**
      *   *Narrative Identity:* The user mentions this but dismisses it because they think it requires *self*-telling. I need to correct/refine this. Paul Ricoeur and Marya Schechtman are key here. Schechtman's "Person Life View" is very close.
      *   *Psychological Continuity:* User explicitly rejects standard Lockeian memory/character continuity.
      *   *Social/Relational Personhood:* The dementia and coma cases suggest personhood is conferred/maintained by others. This points to *Social Constitution* or *Relational Autonomy*.
      *   *The "Story" Aspect:* The user emphasizes the *viability of a story* as the persistence condition. This sounds like *Narrative Constitution*.
      *   *The "Locus":* It's not in space. It's an abstract object or a social status.

  3.  **Identifying the Best Fit:**
      *   **Marya Schechtman's "The Constitution of Personhood" (specifically the *Person Life View*):** This is the strongest match. She argues against the "Real Self" view and the "Psychological Continuity" view. She proposes that to be a person is to live a "person life," which is defined by the capacity to participate in a narrative structure. Crucially, this narrative doesn't have to be consciously articulated by the subject at every moment; it's about being a character in a recognizable human story.
      *   **Paul Ricoeur's *Narrative Identity* (ipse-identity vs. idem-identity):** *Ipse* (selfhood) vs. *Idem* (sameness). Ricoeur allows for the story to be told *about* someone, not just *by* them.
      *   **Hilde Lindemann's *Damaged Identities* / *Holding and Letting Go*:** Focuses on how others "hold" a person's identity for them (very relevant to the dementia/coma cases).
      *   **Daniel Dennett's "Center of Narrative Gravity":** This is a very strong candidate for a software engineer. Dennett explicitly uses the metaphor of a fictional center, like a center of gravity, created by the web of stories. It fits the "not in space" and "abstract locus" description perfectly.

  4.  **Selecting the Primary Concept:**
      *   **Dennett's "Center of Narrative Gravity"** is the most intuitive for an engineer (abstract object, useful fiction, real effects).
      *   **Schechtman's "Person Life View"** provides the robust ethical/metaphysical framework regarding persistence conditions.
      *   **Lindemann's "Holding"** explains the dementia/coma aspect (others maintaining the narrative).
      *   *Decision:* I should synthesize these. The core concept is **Narrative Constitution of Personhood**, specifically the **Social/Narrative View**. I will highlight Dennett for the "locus" metaphor and Schechtman/Lindemann for the persistence conditions.

  5.  **Addressing the "Edges" (Persistence, Identity, Termination, Error):**
      *   *Persistence:* Continuity of the narrative thread, even if carried by others.
      *   *Identity:* Coherence within the narrative framework.
      *   *Termination:* When the narrative can no longer be coherently extended (death, severe dementia where "holding" fails).
      *   *Error:* Yes, narratives can be false. But does a false narrative sustain personhood? (The "imposter" problem).

  6.  **Addressing the Boundary Case (Conflicting Stories):**
      *   This is the "fork in the repo" analogy.
      *   In philosophy, this is the problem of *interpretive authority*.
      *   Usually, there is a weighting. The subject's own narrative usually has prima facie authority (first-person privilege), *unless* they lack capacity (dementia), in which case the community/family takes over.
      *   If both are competent: It creates tension, but usually one "person" with internal conflict, not two people. Unless the divergence is total (Fugue state/DID), then we might argue for distinct streams.
      *   I need to be careful not to say "it's subjective." There are social constraints.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the intuition. It's a recognized philosophical problem.
      *   *The Name:* "Narrative Constitution of Personhood" or "The Social-Narrative View." Mention Dennett's "Center of Narrative Gravity" as the closest metaphor for the "locus."
      *   *Refining "Narrative Identity":* Correct the user's assumption that it must be self-told. Introduce the distinction between *self-narration* and *being-narrated*.
      *   *The Account with Edges:*
          *   *Ontology:* It's an abstract object (like a software interface or a center of gravity). Real effects, no physical location.
          *   *Persistence:* Dependent on the *capacity* for narrative integration, not constant active narration. (Addresses the Coma case).
          *   *Termination:* When the narrative thread is irretrievably severed (Death, or the "Social Death" of advanced dementia where no story fits).
          *   *Error:* Narratives can be factually wrong but still constitute identity. However, if the narrative is *incoherent* (contradictory), the identity fractures.
      *   *The Boundary Case (The Fork):*
          *   Analogy: Distributed systems.
          *   Resolution: Authority hierarchy. First-person usually wins if competent. If not, second-person (family) wins. If both competent but divergent: It's one entity in tension, not two entities. *Unless* the divergence creates functional incompatibility (e.g., two distinct agents acting independently).
      *   *Contrast:* Differentiate from Soul (substance), Psychological Continuity (internal data), Legal Person (status).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is Dennett too deflationary? He calls it a "fiction." The user seems to think it's "real" in its effects. Schechtman is better for the "realness" of the personhood. I will combine them. Dennett for the *mechanism*, Schechtman for the *ethics/ontology*.
      *   *Critique:* The user asked about the Coma case specifically. Standard Narrative Identity struggles here. I need to emphasize the *dispositional* nature of the narrative capacity. The story is *paused*, not deleted.
      *   *Critique:* The "Error" condition. Can you be wrong about who you are? Yes. But does that destroy the person? No. It just makes the narrative *unstable*.
      *   *Terminology:* Use "Center of Narrative Gravity" (Dennett) and "Person Life View" (Schechtman). Mention "Holding" (Lindemann).

  9.  **Final Polish:**
      *   Ensure the tone is respectful of the engineer's mental model (use analogies like state, pointers, interfaces).
      *   Make sure the "Edges" section is distinct and clear.
      *   Address the "Two Stories" question directly.

  10. (Final check against constraints): Did I answer "what it is not"? Yes. Did I address the boundary case? Yes. Did I provide persistence conditions? Yes.

  *(Self-Correction on the "Two Stories" case)*: If the person says "I am X" and the family says "You are Y", and both are competent. Philosophically, this is usually treated as *one* person with a fractured identity, not *two* people. However, if the narratives imply incompatible *futures* that are both acted upon, it might look like a fission case (like Parfit's teleporter). I should lean towards "One person in an inconsistent state" unless the divergence is so total it creates functional separation.

  Let's structure the answer:
