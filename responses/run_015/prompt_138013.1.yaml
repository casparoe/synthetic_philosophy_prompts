      *   *Nuance:* Ensure the distinction between "causal" and "constitutive" is clear without being overly technical. Use the "glasses" analogy if helpful (though the prompt asks to skip extra examples, maybe stick to the text).
      *   *Case 3:* Emphasize that the "social extension" is a newer development (Extended Cognition in groups) and the "trust" condition is the key filter.
      *   *Verdict:* Be decisive. The magazine passage is too dismissive at the end and too sloppy in the middle.

