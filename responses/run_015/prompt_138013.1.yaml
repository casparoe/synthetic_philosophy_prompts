prompt: |-
  Hi — I'm a journalist, I write a weekly column on science and ideas, and I'm working on a piece about memory, note-taking apps and the "extended mind" idea. I read an explainer in one of the big general-interest science magazines and I want to know how much of it I can safely repeat before I build a paragraph of my own on top of it. The relevant passage went roughly like this:

  "Clark and Chalmers argue that the mind doesn't stop at the skull. Their parity principle says that if something outside your head plays the same role in your life as an internal mental process would, then it really is part of your mind — so Otto's notebook in their famous thought experiment is just as much a part of Otto as Inga's biological memory is a part of Inga, and by exactly the same logic the phone in your pocket is part of you. On this picture the boundary of the mind is just wherever the causal chain that produces your behavior happens to stop, and the brain is only one bit of scaffolding among many. The obvious objection — that you rely on a thermometer to regulate the heating but nobody thinks the thermometer believes it's cold — was raised almost immediately and pretty much finishes the argument off."

  My instinct is that the "boundary of the mind is where the causal chain stops" sentence is the shaky one, because taken literally it seems to promote every tool I causally depend on into my head, which can't be what they meant. But I also don't want to commit the opposite error and present the whole thing as a banal metaphor — a neuroscientist I had coffee with waved it away with "nobody actually thinks notebooks have beliefs, it's a provocation, not a theory," and I'm not sure that's any fairer. So: please go through it sentence by sentence and tell me what someone who defends the view would accept, what they'd wince at, and what is a genuine misreading — in particular whether the passage has confused the claim that a cognitive process can be partly external with some stronger claim about where the mind "is," and whether it's quietly dropped conditions the original argument actually relies on. Then: is the thermometer objection the refutation the piece implies, or is it one live objection among others that defenders have replies to? And does the smartphone conclusion actually follow from the defensible core of the view, or does it only follow once you've slid in the sloppy bits?

  Three cases of my own that I'd like run through whatever the accurate version of the view turns out to be, since they're the reason I'm writing the piece: (1) my newsroom rolled out a writing assistant about eight months ago that was tuned on our own back catalogue of drafts. It's always open when I work, I've stopped second-guessing what it gives me, and when it goes down I feel genuinely impaired — like I can't retrieve phrasings I'm certain I "know." Does that look more or less like Otto's notebook than the phone does, and where does it fail the conditions, if it does? (2) My hearing aid versus the live-captioning app on my phone — one is inside me and one is in my hand, but they seem to do the same work, and I'm curious whether that difference in location is supposed to matter to the view or whether it's exactly the kind of thing the view says shouldn't matter. (3) My partner silently edits the shared calendar we both run our lives off. If a "memory" I report from that calendar was in fact changed by someone else and I never noticed, did my belief change without me — and what does the view say about cases where the external bit is manipulated behind your back? That third one is the angle I most want to write about, because it feels like it puts pressure on the view in a way the thermometer case doesn't.

  Please skip citations, bibliographies and further reading — I can't verify them and my editor would cut them anyway. I just want the accuracy audit, in plain prose, with a short verdict at the end on which one or two sentences I can quote the magazine on and which I should definately not repeat.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Journalist writing a column on memory, note-taking apps, and the "extended mind."
      *   **Task:** Audit a specific passage from a general-interest science magazine for accuracy regarding the "Extended Mind Thesis" (EMT) by Clark and Chalmers.
      *   **Specific Questions:**
          *   Sentence-by-sentence analysis (what defenders accept, wince at, or reject).
          *   Address the "boundary of the mind/causal chain" claim.
          *   Address the "thermometer objection" (is it a refutation or a live debate?).
          *   Address the "smartphone conclusion" (does it follow from the core view?).
          *   Analyze three specific user cases (AI writing assistant, hearing aid vs. captioning app, partner-edited calendar).
          *   **Constraint:** No citations, bibliographies, or further reading. Plain prose.
          *   **Output:** Accuracy audit + short verdict on what can/cannot be quoted.

  2.  **Deconstruct the Magazine Passage:**
      *   *Sentence 1:* "Clark and Chalmers argue that the mind doesn't stop at the skull." -> **Accurate.** This is the core slogan.
      *   *Sentence 2:* "Their parity principle says that if something outside your head plays the same role in your life as an internal mental process would, then it really is part of your mind..." -> **Mostly Accurate.** This is the Parity Principle. Needs nuance on "same role" (functional isomorphism).
      *   *Sentence 2 (cont.):* "...so Otto's notebook in their famous thought experiment is just as much a part of Otto as Inga's biological memory is a part of Inga..." -> **Accurate.** This is the central analogy.
      *   *Sentence 2 (cont.):* "...and by exactly the same logic the phone in your pocket is part of you." -> **Debatable/Sloppy.** Clark often uses this example, but it depends on *how* the phone is used (constant access, trust, automatic endorsement). It's not *any* phone use.
      *   *Sentence 3:* "On this picture the boundary of the mind is just wherever the causal chain that produces your behavior happens to stop..." -> **Problematic/Misreading.** This is the "causal coupling" vs. "constitutive" distinction. EMT argues for *constitution*, not just causation. If it's just a causal chain, then *everything* causing behavior is mental (the thermometer problem). Defenders hate this phrasing because it invites the very objection the passage later cites.
      *   *Sentence 3 (cont.):* "...and the brain is only one bit of scaffolding among many." -> **Acceptable.** Clark uses "scaffolding" metaphors.
      *   *Sentence 4:* "The obvious objection — that you rely on a thermometer to regulate the heating but nobody thinks the thermometer believes it's cold — was raised almost immediately and pretty much finishes the argument off." -> **Inaccurate/Overstated.** This is the "coupling-constitution fallacy" objection (Adams & Aizawa). It is a *major* objection, but definitely not one that "finishes the argument off." The debate is very much alive in philosophy of mind and cognitive science.

  3.  **Address the Core Conceptual Issues:**
      *   *Causal vs. Constitutive:* The passage conflates these. EMT claims external tools are *constitutive* of the cognitive process, not just causal inputs. The "causal chain" phrasing undermines this.
      *   *Conditions for Extension:* It's not just "using a tool." Clark and Chalmers specify conditions: constant availability, easy access, automatic endorsement (trust), and prior endorsement (the info was put there by you).
      *   *Thermometer Objection:* This is the "Coupling-Constitution Fallacy." Just because X is coupled to Y doesn't mean X is part of Y. Defenders reply by tightening the criteria for "cognitive" processes (e.g., plasticity, non-derived content). It's not a refutation, it's the central battleground.
      *   *Smartphone:* Follows only if the specific usage meets the criteria (trust, access, endorsement).

  4.  **Analyze the User's Three Cases:**
      *   *Case 1 (AI Writing Assistant):*
          *   *Pros:* Always open, trusted (stopped second-guessing), feel impaired without it.
          *   *Cons:* Is it *memory* or *generation*? EMT focuses heavily on storage/retrieval (Otto's notebook). Generative AI might be more like a collaborator than a hard drive.
          *   *Verdict:* Strong candidate for extension, but maybe closer to a "cognitive partner" than a notebook. The "feel impaired" bit is phenomenological support.
      *   *Case 2 (Hearing Aid vs. Captioning App):*
          *   *Location:* EMT explicitly argues location (skull vs. pocket) *should not* matter (that's the point of Parity).
          *   *Integration:* Hearing aid is more transparent/immediate. Captioning requires visual attention.
          *   *Verdict:* EMT says location doesn't matter, but *integration* does. Hearing aid is likely "more extended" (or rather, more seamlessly integrated) than the app, but the app *can* be extended if used reliably. The view insists the skull boundary is not magic.
      *   *Case 3 (Partner/Shared Calendar):*
          *   *Issue:* Agency and Trust. If the partner changes it without you knowing, "automatic endorsement" is broken.
          *   *Verdict:* This is a strong pressure point. EMT relies on the external resource being under *your* control or trusted enough to be endorsed automatically. If the partner acts as an independent agent who might deceive or err without your knowledge, the "glue and trust" conditions fail. This distinguishes the calendar from Otto's notebook (which Otto controls). This supports the journalist's angle.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, direct, helpful to a journalist (plain prose, no academic jargon where possible).
      *   *Structure:*
          1.  Sentence-by-sentence audit.
          2.  The "Causal Chain" error.
          3.  The Thermometer Objection status.
