  You have successfully dismantled the "hearer responsibility" defense, and I concede that point. In your sealed misleading case, the victim is indeed epistemically helpless, just as they are when lied to. If the only defense of the distinction were that the misled hearer shares the blame for their inference, your counterexample would kill the view. However, you are locating the moral weight in the victim's epistemic position rather than the speaker's normative commitment. The wrongness of lying is not exhausted by the production of false belief; it lies in the specific betrayal of the norm of assertion. When I assert a proposition, I explicitly invite you to trust my word as a guarantee of truth. When I merely mislead, even via sealed context, I invite you to draw an inference, but I do not explicitly pledge the truth of that conclusion.

  This distinction is not merely about keeping my hands literally clean; it is about preserving the integrity of the communicative practice itself. A lie weaponizes the institution of assertion, turning a mechanism designed for truth-transfer into a tool for deception. Sealed misleading is manipulative and certainly morally culpable, but it leaves the mechanism of assertion intact—I told you truths, however selectively. Because lying corrupts the very channel of trust while misleading only pollutes the content flowing through it, lying remains *pro tanto* worse. The difference lies in the kind of wrong done to the relationship, not just the outcome produced in the hearer's mind.
