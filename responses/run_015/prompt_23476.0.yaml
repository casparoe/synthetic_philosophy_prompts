      *   **Authorship/Ownership:** If the AI suggests plot points or maintains continuity, where does the author's voice end and the machine's begin?
      *   **Reliability:** LLMs hallucinate. Relying on them for "canon" is risky because they don't *know* truth, they predict tokens. The user noted contradictions ("quietly change a rule").
      *   **Dependency:** The user admits they "can't remember most of it myself anymore." This is the crux of the anxiety.

  3.  **Formulate the Response Strategy:**
