      *   **The Risk of Hallucination:** Address the "changing magic rules." This is technical. The AI predicts, it doesn't store truth. Relying on it for canon is like relying on a dreamer for accounting.
      *   **The Ownership Question:** This is the emotional core. If you don't know the canon, do you own the story? Yes, but you need to reclaim the *knowledge*.
      *   **Practical Solutions:**
