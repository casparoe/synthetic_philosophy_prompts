      *   **Name the Phenomenon:** Introduce concepts like "extended cognition" and "automation bias" to give the user language for their experience.
      *   **Address the Technical Reality:** Explain *why* the AI contradicts itself (probabilistic nature, context limits) so the user understands the tool's limitations.
      *   **Reframe the Relationship:** Shift from "AI as co-author/memory" to "AI as assistant/draftsman." The author must remain the "source of truth."
      *   **Actionable Advice:** Suggest concrete steps to regain ownership (externalize the canon, audit the AI, set boundaries).
