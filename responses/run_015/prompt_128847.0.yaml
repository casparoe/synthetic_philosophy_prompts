answer: |-
  Here is a Q&A prep sheet tailored to your specific audience and thesis.

  ### **The Landscape**
  *   **The Room:** Hostile on aggregation (4 EAs), skeptical on foundations (1 Kantian, 1 Decision Theorist), friendly but nervous on stability (1 Scanlonian), pragmatic on application (2 Law).
  *   **The Goal:** Show that the Linkage Condition is not an ad hoc fix to save contractualism from counterexamples, but a principled constraint on *justification*.
  *   **The Trap:** Do not let the EAs drag you into a debate about total welfare. Do not let the Scanlonian drag you into a debate about whether aggregation is *ever* allowed. Keep the focus on the *structure of reasons*.

  ---

  ### **The 8 Objections (In Order of Arrival)**

  #### **1. The EA/Consequentialist (The "Value on the Table" Objection)**
  **Phrasing:** "You're permitting aggregation in the hearing loss case but not the headcount case. But in both, you're leaving hundreds of QALYs on the table to save one person from a worse fate. If the goal is to minimize reasonable rejectability, why does the *structure* of the harm matter more than the *sum* of the harm? You seem to be prioritizing theoretical purity over actual suffering."
  **The 2-Minute Answer:**
  "I'm not prioritizing purity over suffering; I'm prioritizing *justifiability* over *optimization*. Contractualism asks: 'What principle could no one reasonably reject?' In the headcount case, the one person can say: 'You sacrificed me for *others*.' That is a reasonable rejection. In the linkage case, the one person cannot say that. They must say: 'You sacrificed me for *us*.' Because the burdens are jointly unavoidable, the justification shifts. I am not ignoring the QALYs; I am arguing that QALYs only aggregate when the *reasons* for saving them aggregate. The Linkage Condition ensures we aren't using people as means to save others, but rather acknowledging a shared fate that licenses a collective trade-off."

  #### **2. The EA/Consequentialist (The "Arbitrariness" Objection)**
  **Phrasing:** "Joint unavoidability seems morally arbitrary. Why should my claim to be saved depend on whether your survival is causally tied to mine? If I'm going to die either way, why does it matter if you die with me?"
  **The 2-Minute Answer:**
  "It matters because it changes the *complaint*. If our fates are unlinked, my complaint is that you preferred *them* to *me*. If our fates are linked, my complaint is that you preferred *anyone* to *us*. The first is a complaint about discrimination or trade-offs; the second is a complaint about necessity. The Linkage Condition isn't about the causal mechanics of survival; it's about the moral mechanics of blame. When burdens are linked, the agent isn't choosing between persons; they are choosing between states of the world that affect a collective. That shift licenses the aggregation of complaints because the 'individual vs. individual' conflict has become an 'individual vs. collective necessity' conflict."

  #### **3. The Scanlonian Ally (The "Stability" Objection)**
  **Phrasing:** "I want you to succeed, but I worry this is a slippery slope. Once you allow aggregation here, what stops a clever reformulation of the options from triggering linkage in standard Trolley cases? If you open the door, won't utilitarianism walk right through?"
  **The 2-Minute Answer:**
  "The door isn't just open; it's got a deadbolt. The Linkage Condition is a structural constraint, not a threshold. In a standard Trolley case, the five are not linked in the relevant way: I could conceptually save four and not the fifth (e.g., if they were scattered). In the hearing loss case, the intervention is a public good (e.g., noise regulation); you literally cannot regulate the noise for one neighbor without doing it for all. The slope isn't slippery because the condition relies on the *indivisibility of the remedy*, not just the grouping of victims. As long as we keep the focus on the *remedy's* structure, aggregation remains the exception, not the rule."

  #### **4. The Kantian (The "Currency" Objection)**
  **Phrasing:** "I'm worried about the currency. You're talking about 'complaints' and 'burdens.' But the problem with aggregation is that it violates dignity. It treats people as containers of value. Why should I accept 'complaints' as the fundamental unit?"
  **The 2-Minute Answer:**
  "I agree that dignity is the foundation, but 'complaints' are how dignity speaks in a pluralistic world. To have a complaint is to assert a claim that others must respect. When I say 'you cannot sacrifice me,' I am asserting my status as an end. The Linkage Condition respects this by ensuring that when we do aggregate, we aren't overriding one person's status for another's, but acknowledging a situation where *everyone's* status is bound together. We aren't summing value; we are recognizing a shared constraint on justification. Complaints are just the voice of dignity in a conflict."

  #### **5. The Decision Theorist (The "Ex Ante/Ex Post" Objection)**
  **Phrasing:** "Is your linkage condition determined ex ante (at the level of risk policy) or ex post (at the level of realized harm)? If I impose a risk on a hundred people, but only one gets hurt, does linkage still hold?"
  **The 2-Minute Answer:**
  "It is determined ex ante regarding the *policy*, but applied ex post regarding the *burden*. The Linkage Condition justifies the rule: 'We will regulate this noise.' That rule is justified because the risk is jointly unavoidable. If the risk materializes for one, the justification for the policy remains because the *ex ante* situation satisfied linkage. However, if we are talking about rescue (ex post), linkage requires that the *rescue* be jointly unavoidable. So it tracks the structure of the decision node: if the option to save A without saving B was never on the table, linkage holds."

  #### **6. Philosophy of Law (The "Tort Standing" Objection)**
  **Phrasing:** "Does this map onto tort law? In class actions, we aggregate claims. In individual torts, we don't. Are you saying standing should depend on joint unavoidability?"
  **The 2-Minute Answer:**
  "Surprisingly, yes. Think about indivisible injuries versus distinct torts. If a factory pollutes a water table, the harm is jointly unavoidable; you can't clean the water for one house without cleaning it for the neighborhood. That looks like a class action (aggregation permitted). If a driver hits five pedestrians sequentially, those are distinct torts (aggregation restricted). My view suggests that contractualist aggregation tracks the logic of 'indivisible injury' in tort. It's not about the number of plaintiffs; it's about whether the defendant's duty was owed to them as a collective or as individuals."

  #### **7. The Generalist (The "Menu Dependence" Objection)**
  **Phrasing:** "This looks menu-dependent. If I add a third option to the choice set—say, a costly way to save just one of the hearing loss victims—does linkage vanish? If permission to aggregate depends on which alternatives happen to be on the table, your principle seems unstable."
  **The 2-Minute Answer:**
  "It is sensitive to the menu, but not arbitrarily so. Contractualism is inherently menu-sensitive because reasonable rejectability depends on available alternatives. If there *is* a way to spare one without sparing all, then the 'shared fate' justification collapses. The agent can now be asked: 'Why didn't you save just me?' If the answer is 'It wasn't possible,' linkage holds. If the answer is 'It was too expensive,' linkage fails. This isn't a bug; it's a feature. It ensures aggregation is only permitted when it is *necessary*, not just convenient."

  #### **8. The "Hope Nobody Asks" (The Identifiability Trap)**
  **Phrasing:** "You specified the paraplegic is *identifiable* and the hearing loss victims are *unidentified*. If we identified the hearing loss victims tomorrow, would linkage fail? Does your view imply that statistical lives matter less than identified ones?"
  **The 2-Minute Answer:**
  *(See "Hope Nobody Asks" section below for strategy).*
  "No, identifiability isn't the metaphysical switch. It's an epistemic marker for the *type of intervention*. Identified victims usually imply discrete rescue acts (no linkage). Unidentified victims usually imply policy risks (linkage). If we identified the hearing loss victims, but the remedy remained a public policy (noise regulation), linkage would still hold. The distinction is about the *remedy's divisibility*, not the victims' names. Identifiability is just a heuristic for that."

  ---

  ### **Strategic Concessions (Make these in the talk)**
  1.  **Concede to the EAs:** Admit that in *many* real-world policy cases, linkage will hold, and thus contractualism will often recommend what looks like cost-effectiveness analysis. Don't fight them on the *output* too much; fight them on the *justification*.
  2.  **Concede to the Kantian:** Admit that "complaints" is a placeholder for "claims grounded in moral status." Don't get bogged down in the metaphysics of complaints.
  3.  **Concede to the Scanlonian:** Admit that the boundary between "linked" and "unlinked" can be fuzzy in edge cases. Promise that the *core* cases (Trolley vs. Public Policy) are clear, and that's where the theory does its work.

  ### **The Single Reply That Must Land**
  If you remember nothing else, land this distinction when pressed on *why* linkage matters:
  > **"Aggregation is not about summing pain; it's about summing *reasons*. In plain headcount cases, I have a reason to save A, and a separate reason to save B. In linkage cases, I have *one* reason to save the group. You cannot aggregate separate reasons without losing the individual; you can aggregate a single collective reason without loss."**

  ### **The Question You Hope Nobody Asks**
  **The Question:** "In your Paraplegic vs. Hearing case, why does the Hearing case satisfy linkage? If I have a budget of $1M, and surgery for the paraplegic costs $1M, and hearing aids cost $1k each... I *could* theoretically give hearing aids to 500 people and not the 501st. I can spare one without sparing all. So linkage fails. Why does your example work?"

  **Why it's deadly:** It exposes that your example might rely on the *public good* nature of the hearing loss (e.g., noise regulation) rather than just "hundreds of people." If it's just individual hearing aids, linkage *fails* by your own definition (I can spare one person the cost without sparing the others). If you rely on "noise regulation," you must clarify that in the talk. If you rely on "budget constraints," you open yourself to the claim that *all* budget constraints create linkage, which collapses the view into utilitarianism (since all resources are finite).

  **Prepared Answer:** "Crucial distinction: The hearing case must be understood as a *policy* intervention (e.g., regulating a factory), not individual aid. If it's individual aid, you are right—linkage fails, and we should save the paraplegic. The paper assumes the hearing loss stems from a common source where the remedy is indivisible. If I concede the remedy is divisible, I concede the aggregation is impermissible."
  *(Note: Be careful here. If you concede this, the EAs will ask why we don't just make remedies divisible. You need to argue that some harms are inherently public/linked.)*

  ### **My Read on Your Actual Weakest Point**
  You suspect it's **Menu Dependence**. I think it's actually **The Individuation of Harms**.

  **Why:** Your theory hinges on whether burdens are "jointly unavoidable." But whether burdens are joint depends on how we describe the options.
  *   *Description A:* "Turn switch left (kill 1) or right (kill 5)." -> Linkage holds (saving 5 saves all 5). -> Aggregation permitted? (You say no).
  *   *Description B:* "Spend budget on Patient A or Patients B-Z." -> Linkage holds (Budget constraint). -> Aggregation permitted? (You say yes).

  **The Vulnerability:** You need a principled reason why the Trolley switch is *not* a "joint unavoidability" case while the Budget/Hearing case *is*.
  *   If you say Trolley isn't linked because the 5 are distinct people, the Hearing victims are also distinct people.
  *   If you say Trolley isn't linked because the *causal mechanism* is distinct, you need to explain why causal mechanism matters for *contractualist justification*.
  *   If you say Trolley isn't linked because we *could* save 4 and not 5 (e.g. a magic switch), you are relying on metaphysical possibilities that don't exist in the case description.

  **Fix:** In the talk, explicitly define Linkage not just as "Spare A implies Spare B," but as **"The *remedy* is indivisible."**
  *   Trolley: The remedy (pulling switch) is indivisible, but the *harm* is distinct.
  *   Hearing: The remedy (regulation) addresses the *source* of the harm collectively.
  *   *Risk:* This sounds like a distinction without a difference to the EAs. Be prepared to defend why "Source of Harm" matters for reasonable rejectability. (Argument: "I can reject being killed by a switch. I cannot reject being exposed to a background risk that is regulated for the community.")

  Good luck. Keep your eyes on the Scanlonian; if you keep them nodding, the EAs can't isolate you.
