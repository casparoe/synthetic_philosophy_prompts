      *   Ensure the "Single Reply" is the anchor for the whole talk.

  5.  **Developing the Strategy:**
      *   *Concessions:* Don't fight the EA folks on QALYs being *important*, just not *sovereign*. Don't fight the Kantian on dignity, frame complaints as dignity-based.
      *   *Single Reply:* The "Reason-Giving" move. Aggregation isn't about summing pain; it's about the structure of justification.
