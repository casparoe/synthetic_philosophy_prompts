      *   *Decision on Weakest Point:* I will advise that the weakest point is actually the **distinction between this case and standard aggregation cases**. Why does Trolley (1 vs 5) fail linkage? In Trolley, if I save the 5, I save all 5. So linkage holds. So why no aggregation? The candidate must argue Trolley burdens aren't "jointly unavoidable" in the relevant sense. Maybe because the 5 are distinct causal threats? No.
