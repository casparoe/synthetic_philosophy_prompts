      *   Weakest Point Analysis? Yes.

  7.  **Final Polish:** Check the "Linkage" logic.
      *   *Thesis:* Aggregation OK if $Spare(x) \to Spare(all)$.
      *   *Case:* 1 Paraplegic vs. 100 Hearing.
      *   *Why Linkage holds here:* Presumably, this is a budget/policy case. To cure the paraplegic costs $X. To cure the hearing costs $Y each. If the budget is fixed, maybe the claim is that the *policy* creates the linkage?
      *   *Wait, re-reading the prompt's specific logic:* "there was no way to spare any one member of the group without also sparing every other member."
