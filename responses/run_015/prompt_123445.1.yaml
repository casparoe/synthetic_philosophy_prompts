answer: |-
  Here is a practical editing decision procedure based on Thomas Szasz's actual criteria, stripped of the internet caricature. It is designed for a 48-hour deadline.

  ### The Szaszian Editing Checklist (v1.0)

  **Purpose:** To distinguish between *literal disease* (tissue pathology) and *problems in living* (conduct/ethics/emotions) to prevent unwarranted medicalization of behavior while respecting actual biology.

  **How to use:** Run these questions in order. If you hit a **STOP**, apply the corresponding framing rule. If you reach **VALUE CALL**, you must make an ethical judgment; the checklist cannot do it for you.

  ---

  #### Phase 1: The Tissue Test (The Hard Stop)
  *Goal: Determine if the "medical" frame is biologically justified.*

  1.  **Is there an observable lesion, pathology, or biomarker independent of the patient's report?**
      *   *Examples:* Tumor on MRI, epileptic spike on EEG, specific cytokine profile, genetic mutation (e.g., Huntington's).
      *   *If YES:* **STOP.** Allow medical/disease framing. This is a brain disease, not a "mental illness" in the Szaszian sense.
      *   *If NO:* Proceed to Question 2.

  2.  **Is the diagnosis defined solely by clusters of behavior or subjective feeling?**
      *   *Examples:* "Sadness + insomnia," "Anger outbursts," "Hearing voices without neurological cause."
      *   *If YES:* Proceed to Phase 2. (This is a "Problem in Living" candidate).

  ---

  #### Phase 2: The Agency-Preservation Filter
  *Goal: Determine if the diagnosis is being used to explain behavior or excuse it.*

  3.  **Does the text frame the behavior as involuntary?**
      *   *Check:* Does the story say the patient *could not* choose otherwise, or that the behavior *is* the disease?
      *   *If YES:* **FLAG.** This removes agency. Require the writer to clarify: Is this a constraint on capacity (e.g., delirium) or a medicalization of choice?
      *   *If NO:* Proceed to Question 4.

  4.  **Does the "treatment" aim to restore function or enforce conformity?**
      *   *Check:* Is the goal to stop the patient from breaking social rules (e.g., "disruptive," "non-compliant," "lacks insight")?
      *   *If YES:* **FLAG.** This indicates social control. Frame the story around the conflict between individual conduct and institutional expectations.
      *   *If NO:* Proceed to Phase 3.

  ---

  #### Phase 3: The Context Check
  *Goal: Identify the "Problem in Living."*

  5.  **Is there a clear social, ethical, or situational stressor correlated with the onset?**
      *   *Examples:* Divorce, poverty, grief, moral conflict, abuse.
      *   *If YES:* **MANDATE.** The story must contextualize the "symptoms" as responses to these stressors, not just internal malfunctions.
      *   *If NO:* Proceed to Value Call.

  ---

  #### Phase 4: The Value Call (Editor's Discretion)
  *The checklist ends here. You must decide based on harm and liberty.*

  *   **Risk Assessment:** If we frame this as a "problem in living" (agency preserved), does the subject pose an immediate, verifiable physical danger to self/others that they cannot manage?
      *   *If YES:* You may allow coercive framing (involuntary care), but explicitly label it as a *legal/ethical exception*, not a medical cure.
      *   *If NO:* Default to liberty/agency framing.

  *   **The Stigma/Biomarker Trap:** If a biomarker exists (Phase 1, Q1) but carries heavy stigma (e.g., HIV, Huntington's), do not let the medical frame erase the social discrimination. Acknowledge the disease *and* the social penalty.

  ---

  ### Running the Cases

  Here is how this procedure applies to your three current stories.

  #### Case 1: The DMDD Teen (Divorce Context)
  *   **Phase 1 (Tissue):** No lesion/pathology. Diagnosis is based on anger outbursts. -> *Proceed.*
  *   **Phase 2 (Agency):** Hospital frames anger as a "brain disorder" (involuntary). -> **FLAG.** This removes agency.
  *   **Phase 3 (Context):** Clear stressor (divorce). -> **MANDATE.**
  *   **Editorial Directive:** You must push back on the "brain disorder" language. The headline cannot be "Teen's Brain Disorder Flares Up." It must be "Teen's Anger Management Strained by Divorce."
  *   **Why:** Szasz argues DMDD is a classic "problem in living" (moral/educational issue) medicalized to shift burden from parents/school to doctors. The checklist forces you to center the divorce, not the dopamine.

  #### Case 2: Forced Medication & "Lack of Insight"
  *   **Phase 1 (Tissue):** No lesion cited for the *justification* of force. -> *Proceed.*
  *   **Phase 2 (Agency):** "Lacks insight" is used. -> **FLAG.**
      *   *Note:* In Szasz's framework, "lack of insight" (anosognosia) is often a rhetorical move to mean "disagrees with doctor." Unless there is a Phase 1 tissue test (e.g., dementia), this is a value judgment.
  *   **Phase 2 (Conformity):** Treatment aims to stop "non-compliance." -> **FLAG.** Social control.
  *   **Editorial Directive:** You cannot run the staff's quote ("he lacks insight") without immediate qualification. You must frame this as a conflict of values: *The patient values X, the staff values Y, and staff are using medical authority to win.*
  *   **Why:** This is the core of Szasz's critique of coercive psychiatry. The checklist prevents you from treating "insight" as a medical metric when it is actually an ethical agreement.

  #### Case 3: Depression as Inflammation (The Bias Check)
  *   **Phase 1 (Tissue):** Researcher claims measurable cytokines/inflammation.
      *   *Decision Point:* If the biomarker has **predictive validity** (high inflammation predicts depressive symptoms *and* anti-inflammatories reduce them), this passes the Tissue Test.
      *   *Szaszian Nuance:* Szasz admitted that if a brain process is physically diseased, it is a medical illness. If depression is *literally* an inflammatory response, it is a physical illness manifesting psychologically.
  *   **Phase 2 (Agency):** If biological, agency is constrained by physiology (like diabetes).
  *   **Editorial Directive:** **This is where you must swallow your bias.** The checklist says: You cannot debunk the medical frame *if* the tissue evidence holds.
      *   *Correction:* You must narrow the claim. The story cannot say "Depression is Inflammation." It must say "A *Subset* of Depression May Be Inflammatory."
      *   *Why:* If you debunk this entirely despite the biomarkers, you are denying the Tissue Test. Szasz would agree: If there is a lesion (inflammation), it's a disease. If there is no lesion, it's a problem in living. Your job is to ensure the writer doesn't generalize a biomarker-positive subset to *all* sadness.
  *   **The Friction:** You want to write "Medicalization is wrong." The checklist says "Medicalization is wrong *unless* there is tissue pathology." If the inflammation data is real, medicalization is *right* for that group. You must edit the story to reflect that distinction, even if it weakens your anti-psychiatry angle.

  ---

  ### Limitations & Fuzzy Boundaries

  Be honest in your editor's note or internal memo about where this tool breaks:

  1.  **The "Hard Stop" isn't always hard:** Biomarkers often have low specificity (e.g., inflammation happens in stress *and* disease). If the biomarker is noisy, revert to Phase 2 (Agency).
  2.  **Involuntary Commitment:** This checklist cannot solve the "dangerousness" exception. Szasz argued against all involuntary commitment; society does not. If a person is actively violent, the "Agency Filter" will flag the loss of liberty, but the "Value Call" may still justify containment. Label it as *police action*, not *medical treatment*.
  3.  **The Psychosomatic Loop:** Chronic "problems in living" (stress) cause physical changes (cortisol, inflammation). At what point does a stress response become a tissue disease?
      *   *Rule of Thumb:* If the tissue change reverses when the life situation resolves, it was a problem in living. If the tissue change persists independently, it may be a disease.
  4.  **Stigma:** A "real" brain disease (e.g., Alzheimer's) carries stigma. A "myth" (e.g., Addiction) carries stigma. This checklist protects *agency*, not *reputation*. Do not promise subjects that using this framework will reduce shame.

  ### Summary for your 48-Hour Workflow

  1.  **Ask:** Is there a lesion? (Yes = Medical / No = Living).
  2.  **Ask:** Does this remove choice? (Yes = Flag / No = Proceed).
  3.  **Ask:** Is this about rule-breaking? (Yes = Social Control).
  4.  **Edit:** Ensure "Problems in Living" get social context, and "Brain Diseases" get biological evidence.
  5.  **Own It:** Where the science is fuzzy, admit in the text that we are making an ethical call, not a medical one.

  This keeps you from parroting the DSM without forcing you into a "nothing is real" conspiracy. It forces precision.
