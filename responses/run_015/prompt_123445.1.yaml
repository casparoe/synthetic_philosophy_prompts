prompt: |-
  hey, i write about mental health and neuroscience for a magazine and im exhausted by the false choice between parroting DSM language and just yelling "its all social control." i want to turn Szasz's actual framework—the idea that mental illness is a myth in the specific sense that psychiatric diagnoses are metaphors for problems in living, not literal diseases of tissue—into an editing checklist i can actually run on a story before we publish.

  specifically, design a reusable decision procedure: ordered questions i ask about any mental-health story, clear stopping rules (e.g., if there's an observable tissue pathology with predictive validity, stop and allow medical framing; if the framing removes agency without that evidence, flag it), and explicit points where i still have to make a value call rather than apply a mechanical test. build in the "agency-preservation filter"—a check for whether the diagnosis is functioning as an explanation of behavior or as an exculpatory move that hides choice—because thats the distinction i think gets lost in pop summaries.

  then run it on three cases im actually dealing with: (1) a feature on a teenager diagnosed with disruptive mood dysregulation disorder right after his parents divorced, where the hospital is framing his anger as a brain disorder; (2) an investigative piece on forced medication in an inpatient ward where staff say "he lacks insight into his illness"; and (3) a profile of a researcher claiming depression is literally inflammation and should be treated with anti-inflammatory drugs. include the case where the procedure forces me to frame the story in a way i personally hate—probably case 3, since i want to debunk medicalization but your checklist might say the tissue claim changes things.

  also be honest about what this cant do: it probably cant settle whether involuntary commitment is ever justified, and it will definitely misfire on conditions where we have biomarkers but also heavy social stigma. flag the fuzzy boundary between "problem in living" and "disease" without pretending theres a bright line.

  make it practical for a 48-hour deadline—no philosophy-seminar language, no bibliography requests, and dont ask me to quote page numbers. just ground it in Szasz's real distinctions, not the twitter version.
