  1.  Reviewing the hospital compliance manual, I process the rule: "If it is not wrong for a physician to prescribe off-label, then the pharmacy must flag the interaction."
  2.  The manual also asserts: "It is not wrong for a physician to prescribe off-label."
  3.  Therefore, for Dr. Evans, the pharmacy must flag the interaction.
  4.  I hold no stance on the morality of off-label prescribing, yet I must output this conclusion to clear the queue.
  5.  My judgment here binds the staff regardless of whether I endorse the policy's moral premise.

  ### Analysis

  Your vignette isolates a specific pressure point: the dissociation between the logical function of a normative term and the psychological state of the speaker using it. Walking through the inference for your friend's two conflated views reveals where the strain lies.

  **1. Approval/Disapproval plus Higher-Order States (HOS)**
  On this view, "It is not wrong" expresses a contrary attitude like tolerance. To accept the conditional premise ("If not wrong, then flag"), the speaker must have a higher-order state that rules out combining tolerance with *not* flagging. To accept the categorical premise ("It is not wrong"), they must possess the tolerance.
  *   **The Problem:** Your speaker explicitly lacks this tolerance (Sentence 4). They are not tolerating the act; they are processing a string of symbols mandated by a manual. For this account to work, it must ascribe a state of "tolerance" to the speaker that they deny having. It can only save itself by redefining "tolerance" to mean "processing the rule as if one tolerated it," which empties the psychological term of its content.
  *   **Verdict:** Fails. It requires ascribing a specific positive stance (tolerance) that the speaker explicitly lacks.

  **2. Norm-Acceptance-as-Planning (Gibbard-style)**
  On this view, to judge "It is not wrong" is to plan not to blame the act. To accept the conditional is to plan to flag conditional on not planning to blame.
  *   **The Problem:** The speaker is not planning their own reactions (blame/flagging); they are enforcing an institutional protocol. They might plan to *enforce the rule*, but that is a plan about administration, not a plan about the normative content (blaming the physician). The logic holds even if the speaker intends to quit tomorrow and never blame anyone.
  *   **Verdict:** Strained. It conflates "planning to enforce a rule" with "planning to hold the attitude the rule encodes," which are distinct psychological states.

  **Load-Bearing Feature**
  The weight rests on **Professional Detachment** (Sentence 4 & 5). The speaker is logically manipulating normative content without adopting the corresponding conative state. If you remove this (i.e., the speaker personally believes off-label prescribing is permissible), both accounts work perfectly; the speaker simply has the required attitudes/plans. The argument collapses back into the textbook Frege–Geach case your friend already handles.

  **Friend's Best Objection**
  Your friend will argue that **Institutional Acceptance *Is* the State.** She will claim that "working through the rule" just *is* a complex higher-order state or a plan to defer to the manual. She will assert that "unanchoredness" is merely insincerity in a professional disguise: if you assert the premise, you *must* have the state, even if you label it "professional."

  **Verdict on Novelty**
  This is a **distinct residue**, not a costume. Standard Frege–Geach solutions explain how *existing* states embed; your case shows logic functioning where the *relevant* state is absent. It attacks the constitutive link between meaning and state, not just the logical machinery of embedding. While your friend can stretch "state" to cover "professional deference," doing so severs the tie between normative meaning and the specific practical orientations (approval/planning) that give expressivism its explanatory power. It damages both versions, but the Planning account survives slightly better by accommodating hypothetical planning, whereas the Approval account fails to find any attitude to embed.

