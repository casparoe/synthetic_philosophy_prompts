  | P1 (Conditional) | "If it is not wrong... then... flag..." | Planning | A plan to flag conditional on not planning to blame. | Strained | Speaker plans to enforce the rule, not necessarily to adopt the conditional plan themselves. |
  | P2 (Categorical) | "It is not wrong for a physician..." | Approval + HOS | Tolerance (contrary attitude to disapproval). | Fails | Speaker explicitly holds no stance (no tolerance) on the act itself. |
  | P2 (Categorical) | "It is not wrong for a physician..." | Planning | A plan not to blame the physician. | Fails | Speaker is not planning their own blame reactions, only administrative output. |
  | C (Conclusion) | "Therefore... pharmacy must flag..." | Approval + HOS | A state of requiring the flag based on prior states. | Works | Logic holds formally, but the input states driving this were missing or misidentified. |
