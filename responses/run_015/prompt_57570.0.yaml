  **MEMORANDUM**

  **TO:** Hallowell Parks and Recreation Youth Basketball Commission
  **FROM:** Graduate Commissioner
  **DATE:** February 10
  **SUBJECT:** Token System Integrity and Charter Compliance

  **Context and Problem Statement**

  The Commission faces a conflict between two active charter mandates. Section 3 requires facility access be allocated by need and participation, never by ability to pay. Section 7 protects entitlements acquired through voluntary exchange. The current token system, intended to balance these goals, has been destabilized. Ridgeline Elite, a private operator, has purchased the majority of prime-time tokens from need-based households via our swap board. They resell this access to non-members at a profit. Consequently, households the system was designed to serve lack court time, while a private entity controls public infrastructure. We must restore the balance between need-based access and exchange rights without violating the charter or creating untenable administrative burdens.

  **Recommendation**

  I recommend we adopt a modified version of the fourth option: permit transfer among verified league members but bar bulk acquisition by outside operators, institute a standing league buyback at a fixed price, and cap household holdings.

  Specifically, tokens should remain transferable to preserve flexibility for families with shifting schedules. However, transfers must be restricted to verified league members. This prevents external capital from draining the pool. To address existing accumulation, the League should exercise a buyback option on any holdings exceeding four hours per week per household, priced at the original face value of the token. This respects Section 7 by honoring the exchange, but respects Section 3 by preventing the consolidation of access rights into hands that do not meet the need-based criteria. Ridgeline may retain tokens for their own registered players, but they cannot act as a broker. This transforms the token from a tradeable commodity back into a license for participation.

  **Implementation Timeline**

  We must act before the spring registration window closes to prevent further accumulation.

  *   **February 14–28:** Commission votes to amend transfer rules. Legal counsel drafts notification language regarding the "Verified Member" restriction.
  *   **March 1:** Public announcement. The swap board is frozen for 48 hours to update terms of service.
  *   **March 3–15:** Buyback window. The League offers to repurchase excess tokens from current holders at face value. This gives Ridgeline and other holders a chance to liquidate without total loss before restrictions tighten.
  *   **March 16:** Spring registration opens. New tokens are issued under the revised terms. The swap board reopens with the new "Verified Member" restriction active.
  *   **April 1:** Enforcement begins. Any transfers to non-members are voided, and tokens are returned to the original holder or the pool.

  **Structural Integrity and Third-Party Purchasers**

  A central disagreement among us is whether fixing this system constitutes continuous interference or a one-time design choice. One view holds that any rule change upsets expectations and requires endless monitoring. The opposing view holds that defining the rules of transfer is part of defining the entitlement itself.

  I argue strongly for the latter. When we issued tokens, we did not issue currency; we issued a conditional license. A food stamp is not cash; it is an entitlement to nutrition, which is why selling it is prohibited. Similarly, these tokens are entitlements to participation, contingent on need. Clarifying that they cannot be sold to outside profiteers is not an intervention in a free market; it is a clarification of what was being sold in the first place. We are not changing the rules mid-game; we are correcting a misunderstanding of the game's purpose. If we treat the token as absolute property, we violate Section 3. If we treat it as a participatory license, we uphold the charter. This is a design choice, not continuous interference. Once the definition is set, the market operates within those bounds without further need for micromanagement.

  Regarding the families who purchased hours from Ridgeline but are not league members: the fact that Ridgeline resold these hours changes the rectification we can demand. These families contracted with Ridgeline, not the League. They have no standing with us. We are under no obligation to honor slots sold by a third party that violated the spirit of our allocation system. Ridgeline assumed the risk when they bought tokens intended for need-based households and resold them to ineligible clients. Therefore, for the upcoming season, those specific Saturday hours revert to the need-based pool. Ridgeline bears the financial loss of refunding their clients or finding alternative facilities. To do otherwise would be to allow a private vendor to override our charter by simply creating a secondary market.

  **The Case for the Status Quo**

  I must present the strongest case for the outcome I do not recommend: taking no action and letting the market clear. This position rests on a strict reading of Section 7 and a respect for voluntary exchange.

  Under this view, the families who sold their tokens made a rational choice. They valued the cash—needed for transmissions and bills—more than the basketball hours. To void their sales or restrict their ability to sell is to paternalistically decide we know their needs better than they do. Furthermore, the families buying access from Ridgeline value the court time highly enough to pay a premium. From this perspective, the tokens have moved to those who value them most, maximizing the utility of the facility. The charter's prohibition on "ability to pay" in Section 3 refers to initial allocation, not secondary exchange. Once the need-based household receives their entitlement, it is theirs to dispose of. Interfering now breaks the promise of voluntary exchange and damages the Commission's credibility. If we tell families they can trade, then punish them when they do, we discourage future participation. The market solution is clean, requires no administrative overhead, and respects the autonomy of the families we aim to serve.

  **Conclusion**

  While the argument for the status quo respects individual autonomy, it fails the public mandate of Section 3. A public recreation league cannot function if public assets are privatized by the highest bidder. The recommended hybrid approach preserves family flexibility while ensuring the facility serves its intended community. We must define the token as a license, not a commodity, and act before spring registration locks in another season of inequity.
