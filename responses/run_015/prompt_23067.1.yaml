prompt: |-
  I'm prepping a seminar session on Bayesian epistemology and I want to make a case I'm not fully confident in, so I'd like you to argue it for me and then see where it breaks. The position: the problem of logical omniscience is a genuine, live problem for the Bayesian framework, not a technical idealization we can just wave away the way we do for frictionless surfaces in physics. My core argument is a fallibility one. Suppose an agent is logically omniscient, in the sense that the set of propositions she believes with credence 1 is closed under logical consequence, and suppose she knows that she is fallible, so that the proposition "at least one of my beliefs is false" is itself one of her credence-1 beliefs. I think the argument goes like this: any world at which all of her beliefs are true would make that proposition about her own belief set false, but the proposition is one of her beliefs, so no such world exists; her belief set is therefore inconsistent; and an inconsistent set that's closed under logical consequence entails every proposition, so she ends up assigning credence 1 to everything, including contradictions.

  What I want from you is a committed defense, not a neutral survey — I can get the survey from a textbook, and I suspect the textbook line ("it's just an idealization") is wrong, but I keep feling like I'm missing the best counter. So reconstruct the argument carefully, then go through the standard escape routes one by one and argue why each fails or concedes the main point: treating the probability axioms as an idealization, switching to imprecise credences so the agent never assigns credence 1 to everything, denying that the agent really knows she's fallible (including any semantic trick about how "my beliefs" gets indexed across possible worlds), and just dropping closure under logical consequence. Close by saying what a successful version of this argument would imply for the Bayesian program as a whole.
