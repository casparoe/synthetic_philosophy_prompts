  8.  *(Self-Correction during drafting)*: Make sure to address the specific question: "Is it substantive, verbal, or a misalignment?" I should argue it is a *hybrid*: a misalignment of *primary* questions that generates a substantive disagreement about *secondary* consequences (obligation).

  9.  **Final Polish:** Check against the prompt's specific constraints (Nazi statute, gunman, eight principles). Ensure these are woven into the analysis, not just mentioned. (e.g., Use the Gunman scenario to illustrate Hart's coercion vs. Fuller's reciprocity).

