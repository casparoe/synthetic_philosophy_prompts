      *   **Examples:**
          1.  Animal suffering (Care/Harm) vs. Meat is unclean (Sanctity/Degradation).
          2.  Surrogacy (Sanctity/Degradation) vs. Harm to child (Care/Harm).
      *   **Complications/Questions:**
          1.  Is this distinct from *charitable reframing* (translating for persuasion)?
          2.  Is the *intrapersonal* version (misrepresenting one's own reasons to fit a dominant discourse) the same phenomenon?
