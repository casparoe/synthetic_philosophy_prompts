answer: |-
  This is a sharp observation, and you are right to be suspicious of bundling it under a single label without checking the seams. You are describing a specific *epistemic failure mode* in moral communication that sits at the intersection of moral psychology, hermeneutics, and the epistemology of disagreement.

  Here is the carving you asked for.

  ### 1. The Carving: Is it One Phenomenon?

  It is **one functional dynamic** composed of **two distinct psychological mechanisms** that feed each other.

  **Mechanism A: Foundational Projection (The Input Error)**
  This is the cognitive act of hearing a moral reason generated by Foundation X (e.g., Sanctity) and unconsciously processing it as a claim about Foundation Y (e.g., Harm). This is a specific type of *assimilation bias*. You are not just ignoring their reason; you are actively recoding it into your native moral dialect.
  *   *Literature status:* This is a specific application of **Naïve Realism** (Ross & Ward) combined with **Moral Foundations Theory** (Haidt). There is no single canonical term like "Foundational Projection," but the mechanism is well-documented in work on *moral matrix* blindness.
  *   *Why it happens:* Moral foundations function like perceptual schemas. Just as you cannot "unsee" a face in a cloud, you cannot easily process a moral claim outside your active foundations. If Sanctity is inactive for you, a Sanctity claim registers as noise, and your brain auto-corrects the noise to the nearest signal you *can* receive (Harm).

  **Mechanism B: Hermeneutical Reduction (The Output Error)**
  This is the evaluative act of judging the translated reason. Because the translated reason (Harm) is a poor instance of a Harm claim (the evidence is thin), you conclude the *original* reason was weak. You treat the translation as faithful, so the failure of the translation counts as the failure of the argument.
  *   *Literature status:* This is a form of **Hermeneutical Injustice** (Miranda Fricker), though Fricker focuses on structural power gaps rather than interpersonal psychological gaps. It is also a **Category Mistake** (Ryle) applied to normative reasons.
  *   *Why it matters:* This is where the polarization locks in. It's not just that you disagree; it's that you conclude the other person is *irrational* because their "Harm" claim is so easily refuted.

  **The Dynamic:** Projection creates a straw man; Reduction knocks it down. The other side does the same. Both sides leave thinking, "I defeated their best argument, and their best argument was pathetically thin."

  ### 2. Distinguishing the Nearest Neighbors

  You correctly identified that standard terms don't quite fit. Here is how your phenomenon differs from them:

  *   **Vs. Moral Dumbfounding:** Dumbfounding is *intrapersonal* and *verbal*. ("I know it's wrong but I can't say why.") Your phenomenon is *interpersonal* and *interpretive*. ("I know why they think it's wrong, and their reason is stupid.")
  *   **Vs. Motive Attribution Asymmetry:** That bias attributes the *other side's* views to self-interest/bias and *your own* to truth. Your phenomenon attributes the *other side's* reasons to *confusion* about the facts within a shared framework. It's not "You're lying for gain"; it's "You're mistaken about the suffering."
  *   **Vs. Fundamental Attribution Error:** That is about behavior vs. situation. This is about *Reason Type A* vs. *Reason Type B*.

  **The Closest Existing Concept:**
  The closest established concept is **Moral Incommensurability** (often discussed by MacIntyre or Williams), but that is usually a philosophical claim (that the frameworks *cannot* be compared). You are describing a *psychological* claim (that people *fail* to compare them correctly because they assume commensurability where there is none).

  ### 3. Addressing Your Complications

  **Complication 1: Charitable Reframing (The "Good" Version)**
  *   **Distinction:** Intent and Fidelity.
  *   **The Carving:** Charitable reframing is **Strategic Code-Switching**. It requires *metacognitive awareness* of the other's foundation. You know they care about Authority, so you frame your Care argument in terms of Stewardship.
  *   **The Phenomenon:** Your phenomenon is **Unconscious Assimilation**. It lacks metacognition. You assume your framework *is* the framework.
  *   **Test:** If you ask the student, "Do you think your opponent is actually worried about harm, or do you think they are worried about something else they can't articulate?" The charitable reframer says "Something else." The assimilator says "Harm, they're just bad at the math."

  **Complication 2: The Intrapersonal Case (Your Own Reasons)**
  *   **Distinction:** This is **Discursive Hegemony** or **Rationalization**.
  *   **The Carving:** When you do this to yourself (e.g., opposing nuclear power with Harm arguments when your intuition is Sanctity/Nature), you are conforming to **Public Reason** norms (Rawls). You have internalized the rule that "valid public arguments must be secular/harm-based."
  *   **Is it the same?** It shares the *mechanism* (suppressing a foundation to fit a dominant vocabulary) but differs in *direction*. The interpersonal case is a failure of *listening*; the intrapersonal case is a success of *socialization*.
  *   **Evidence:** If you feel a sense of relief when you find the Harm argument, it's rationalization. If you feel a sense of strain or dishonesty, it's hegemony.

  **Complication 3: Is it a Cartoon of Foundations?**
  *   **Pushback:** You are not relying on a cartoon, but you should be aware of the **Asymmetry Critique**. Haidt's data suggests liberals rely heavily on Care/Fairness, while conservatives use all five.
  *   **Implication:** This phenomenon might not be symmetric in frequency. Liberals may be more prone to "hearing Sanctity as Harm" than conservatives are to "hearing Harm as Sanctity," simply because conservatives have a larger vocabulary. However, the *structure* of the error remains symmetric.

  ### 4. Confidence and Coining

  **Confidence Level:**
  *   **85%** that there is no single, canonical term for this specific composite in the literature. It is usually discussed in fragments (Naïve Realism + Foundations + Hermeneutics).
  *   **95%** that the psychological pattern is real and distinct from the neighbors listed above.

  **If Coining:**
  If you were to name this for a paper, **"Foundational Projection"** or **"Moral Hermeneutical Reduction"** would be defensible.
  *   **Evidence it's real:** You would look for **asymmetric prediction accuracy**. If Student A (Care-focused) predicts Student B's (Sanctity-focused) behavior based on Care premises, they will predict poorly. If they recognize the Sanctity premise, prediction improves. The "phenomenon" is the gap between those two states.
  *   **Neurological marker:** fMRI studies show different activation for Harm vs. Sanctity violations. If a subject hears a Sanctity violation but shows Harm-network activation, that is the neural correlate of your phenomenon.

  ### 5. The "Who is Right?" Question

  You asked: *If the phenomenon is real and symmetric, does that tell us anything about whether the psychology of left and right has any bearing on who is actually right?*

  **Short Answer:** No. It tells you about the **epistemic access**, not the **moral truth**.

  **The Carving:**
  1.  **Symmetry of Bias $\neq$ Symmetry of Truth:** The fact that both sides suffer from Foundational Projection means both sides are bad at *persuasion* and *understanding*. It does not mean both sides are equally correct about the underlying moral reality (if such a thing exists). A racist and an anti-racist might both suffer from this dynamic; the symmetry of their communication failure does not validate racism.
  2.  **The "Right" Question:** However, it does suggest that **moral truth (if it exists) is likely multi-foundational.** If the phenomenon is that we keep losing data by filtering out foundations we don't inhabit, then the side that *acknowledges more foundations* has a larger dataset.
      *   *Haidt's Claim:* Conservatives have a "five-channel radio," liberals have a "three-channel radio."
      *   *Implication:* If the moral reality requires five channels to perceive fully, the three-channel listeners are systematically missing data.
      *   *Caveat:* This assumes the foundations track moral *truth* and not just moral *taste*. That is a meta-ethical leap.
  3.  **The Practical Upshot:** The symmetry tells you that **argument as refutation is the wrong tool.** If the problem is translational loss, then winning the argument (refuting the Harm claim) is irrelevant because you haven't addressed the Sanctity claim.
      *   *Pedagogical move:* Don't ask students to refute the argument. Ask them to **identify the foundation**. "Stop telling them they are wrong about the suffering. Tell them you hear the suffering, but that it's not the main point. What is the main point?"

  ### Summary for your Seminar

  You are describing **Foundational Projection leading to Hermeneutical Reduction**.
  *   **It is not** Moral Dumbfounding (that's about self-justification).
  *   **It is not** Motive Attribution (that's about self-interest).
  *   **It is distinct from** Charitable Reframing (which requires metacognition).
  *   **It is distinct from** Intrapersonal Rationalization (which is about social conformity).

  It is a specific failure of **Moral Epistemology**: the inability to recognize a reason *as* a reason when it originates outside one's own moral matrix. The symmetry of the psychology implies that **debate is structurally incapable of resolving these disagreements** without a prior meta-ethical agreement to expand the vocabulary of valid reasons.

  **Confidence:** High on the analysis; Medium-High that you won't find this exact bundle under one word in a textbook. You have identified a specific *pathology of public reason* that deserves the name.
