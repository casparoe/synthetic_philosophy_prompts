      *   Outcome: *Epistemic Dismissal.*
      *   Dynamic: *Symmetric Polarization.*
      *   Theoretical Anchor: Moral Foundations Theory (Haidt), but also Epistemology of Disagreement, Psychology of Motive Attribution.

  3.  **Search for Existing Concepts (Literature Review in Mind):**
      *   *Moral Foundations Theory (Haidt):* Describes the *content* (Care, Fairness, Loyalty, Authority, Sanctity), but doesn't explicitly name the *communicative failure* of translating across foundations uncharitably.
      *   *Moral Dumbfounding (Haidt et al.):* User correctly notes this is about inability to justify *own* views, not mishearing others.
      *   *Motive Attribution Asymmetry (Waytz et al.):* User correctly notes this is about self-interest vs. ideology.
      *   *False Consensus Effect:* Thinking others think like you. Related, but not specific to moral *reasons*.
      *   *Naïve Realism:* "I see reality as it is; you are biased." Very close.
      *   *Epistemic Injustice (Fricker):* Specifically *Hermeneutical Injustice* (lacking the concepts to understand someone). This is strong.
      *   *Incommensurability (MacIntyre/Williams):* Philosophical concept where frameworks lack common measure.
      *   *Motivated Reasoning:* Processing info to fit prior beliefs.
      *   *Projection:* Psychological defense mechanism.
      *   *The "Fundamental Attribution Error":* Attributing behavior to character rather than situation.
      *   *Specific Term Search:* Is there a specific term for "hearing a Sanctity argument as a weak Harm argument"?
          *   *Moral Translation:* Sometimes used, but usually normative (how we *should* translate).
          *   *Moral Reductionism:* Reducing complex moral claims to simpler ones.
          *   *Category Mistake (Ryle):* Treating a concept as belonging to a logical type it doesn't.
          *   *Hermeneutical Gap:* The lack of shared interpretive resources.

  4.  **Synthesize the "Carving":**
      *   The user is describing a specific *communicative/epistemic failure mode* within Moral Foundations Theory.
      *   It is *not* exactly one established term, but a convergence of a few.
      *   *Best Fit:* **Moral Hermeneutical Reductionism** (my coinage/description) or **Foundational Projection**.
      *   *Existing Literature:* It sits at the intersection of Haidt (Foundations), Fricker (Hermeneutical Injustice), and Naïve Realism.
      *   *Distinction from Charitable Reframing:* Intent and Accuracy. Charitable reframing aims to preserve force; this phenomenon aims (unconsciously) to categorize, losing force.
