      *(Self-Correction during drafting)*: I should be careful not to endorse Haidt's foundations as *ontologically* real, but treat them as the psychological framework the user is employing. The user is asking about the *phenomenology* of the disagreement, not the truth of the foundations.
      *(Self-Correction on "Who is Right")*: The symmetry of the *bias* does not imply symmetry of the *truth*. But it does imply symmetry of *access* to the truth via argument.

      *(Final check on terms)*: "Moral Reductionism" exists but usually means reducing morality to non-moral properties. "Hermeneutical Injustice" is close but usually structural. "Naïve Realism" is the cognitive bias. I will synthesize these.

      *Decision:* I will call it **Foundational Projection** (psychological mechanism) leading to **Hermeneutical Reduction** (epistemic outcome). I will clarify that there is no single canonical term, but it is a recognized composite pattern.

