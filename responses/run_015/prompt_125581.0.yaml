      *   **Core Task:** Restate Lewis Carroll's "What the Tortoise Said to Achilles" paradox using PLT/verification vocabulary.
      *   **Specific Mappings:**
          *   Premises ($A$, $B$) $\rightarrow$ ?
          *   Implication ($A \land B \implies Z$) $\rightarrow$ ?
          *   Modus Ponens (MP) $\rightarrow$ ?
