      *   *Correction:* Distinguish between *implication* (arrow type) and *entailment* (turnstile). Carroll conflates them; the PLT mapping must expose this conflation.
      *   *Key Insight:* The Tortoise treats $\to$ (implication) as data, but refuses $\vdash$ (entailment) as mechanism. In PLT, $\to$ is internal, $\vdash$ is external.
      *   *Bootstrapping:* Mention Ken Thompson's "Trusting Trust" as the engineering analogue.

  9.  **Final Polish:** Ensure tone is appropriate for a peer (rigorous, precise, slightly informal but dense). Check that all constraints of the prompt are met. (Specifically: "Map the premises... precisely", "Report the residue", "Is anything distorted?", "Philosophical point vs bootstrapping").

