  Bootstrapping is about *implementation* (Compiler $C$ written in $L$ compiled by $C$). Carroll is about *justification*. A better analogy is the **LCF Kernel** or **De Bruijn Criterion**. The kernel *is* the MP rule. If you demand the kernel be verified by code running *inside* the kernel, you get the regress.

