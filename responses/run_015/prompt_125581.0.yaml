      *   **The Translation:** Systematically map Carroll's $A, B, (A \to Z), Z$ to PLT concepts (Context, Terms, Types, Reduction Rules).
      *   **The Regress as Meta-Circularity:** Explain the demand for explicit rules as demanding a meta-circular evaluator without a host.
      *   **The Residue (Analysis):**
