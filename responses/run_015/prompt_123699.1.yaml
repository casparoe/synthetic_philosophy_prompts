answer: |-
  # Desiderata for a Theory of Representational Realism in Neural Networks

  The following specification outlines the necessary conditions for a philosophical theory to successfully account for representation in artificial neural networks (ANNs) under a realist interpretation. A theory failing to meet the non-negotiable criteria is deemed insufficient for the domain, while failure to meet camp-specific preferences indicates a divergence from specific realist intuitions.

  ### 1. The Robustness Condition (Tracking vs. Representation)
  **Requirement:** The theory must distinguish between mere causal tracking of environmental features and genuine representation. Specifically, it must rule out spurious correlations that are mechanistically disconnected from the feature's functional role as representations, even if they yield high accuracy on standard distributions.

  **Motivating Case:** Consider a classifier that identifies camouflaged tanks by tracking background texture rather than tank morphology. Under adversarial perturbation, the texture correlation breaks, and performance collapses. A theory that counts this correlation as a "representation" of *tank* conflates fragile statistical tracking with robust semantic content. Genuine representation implies a degree of counterfactual stability; the system should represent the object even when the spurious cue is removed, provided the functional role remains.

  **Status:** **Non-negotiable.** Without this distinction, the concept of representation loses its explanatory power and collapses into mere input-output correlation.

  **Excluded Approaches:** This excludes naive causal covariance accounts that equate any reliable causal link with content, as well as strong behavioralist accounts that define representation solely by zero-loss performance on a fixed test set.

  ### 2. The Polysemy Accommodation
  **Requirement:** The theory must accommodate distributed polysemy, wherein individual units or low-dimensional subspaces participate in multiple, context-dependent representations that do not decompose into separable, independent channels. Alternatively, it must provide a principled, mechanistic explanation for why this phenomenon is illusory.

  **Motivating Case:** In transformer models and dense feedforward networks, single neurons often activate for semantically distinct concepts depending on the activation state of the surrounding layer (superposition). A localist theory requiring a one-to-one mapping between units and concepts cannot describe the actual geometry of the activation space. A realist theory must explain how meaning is constituted in a high-dimensional, entangled manifold rather than demanding a cleaner architecture than the one that exists.

  **Status:** **Non-negotiable.** This is an empirical constraint imposed by the architecture of successful models.

  **Excluded Approaches:** This excludes "grandmother cell" localism and any structural mapping theory that requires orthogonal, disentangled subspaces for distinct semantic contents.

  ### 3. Interventional Stability
  **Requirement:** A representation should be identifiable through targeted mechanistic disruptions—such as ablation of redundant pathways or perturbation of non-representational weights—provided that overall task performance remains intact.

  **Motivating Case:** If a representational claim is ontologically robust, it should not depend on the exact configuration of every weight. If one can prune a subset of parameters without degrading task performance, the representation should persist in the remaining substrate. This tests whether the representation is a property of the *mechanism* or merely an artifact of a specific parameter configuration.

  **Status:** **Camp-Specific Preference (with caveats).** This condition risks importing a prejudice from classical philosophy of mind and neuroscience, which often assumes localized functional modules. In highly overparameterized ANNs, representations may be holistically distributed such that *any* ablation alters the representational geometry, even if performance is preserved via compensation. Therefore, this is a genuine desideratum only if formulated as stability of *readout* under perturbation, not stability of *internal coordinates*. Demanding strict localization is an imported prejudice; demanding functional persistence is a realist necessity.

  **Excluded Approaches:** This excludes radical holism where no subsystem can be meaningfully isolated, as well as theories that tie representation too tightly to specific weight values rather than computational roles.

  ### 4. Empirical Accessibility without Methodological Collapse
  **Requirement:** Representation claims must be supportable by interpretability techniques (probing, visualization, causal tracing), yet the theory must not identify representation with whatever is readable by any particular method.

  **Motivating Case:** Probing classifiers can find linear readouts for almost any property in high-dimensional spaces, including random noise. If a theory defines representation as "what a probe can find," it renders the concept trivial. Conversely, if a theory posits representations that are in principle undetectable by any mechanistic analysis, it becomes metaphysically otiose. The theory must specify which interpretability successes track ontology and which are artifacts of high-dimensional geometry.

  **Status:** **Non-negotiable.** A realist theory must bridge the gap between metaphysical claim and empirical verification without succumbing to operationalism.

  **Excluded Approaches:** This excludes strong operationalism (representation = probe accuracy) and epiphenomenal realism (representations exist but are mechanically inert and undetectable).

  ### 5. Consistency with Learning Theory (Non-Uniqueness)
  **Requirement:** The theory must remain consistent with the existence of multiple global minima that are functionally equivalent but mechanistically divergent. It must account for overparameterization and implicit regularization, acknowledging that representations may not be unique across training runs.

  **Motivating Case:** Two networks trained on identical data with different random seeds often converge to different weight configurations that solve the task equally well. If representation is real, it cannot be tied to a unique weight configuration. The theory must explain how distinct mechanistic implementations can instantiate the "same" representation, or admit that representation is relative to the specific trajectory of learning.

  **Status:** **Non-negotiable.** This is a mathematical fact of modern deep learning.

  **Excluded Approaches:** This excludes any theory requiring a unique, canonical structural mapping between the network and the world.

  ***

  ### Tensions and Joint Unsatisfiability

  There is a significant tension between **Desideratum 3 (Interventional Stability)** and **Desideratum 5 (Consistency with Learning Theory)**.

  Current understanding of mechanistic redundancy suggests that in overparameterized regimes, representations are often implemented via distributed, redundant circuits. If multiple divergent solutions exist (Desideratum 5), it implies that the specific mechanistic substrate of a representation is not fixed. However, Interventional Stability (Desideratum 3) demands that we can disrupt parts of the mechanism without losing the representation. In highly redundant systems, ablation often triggers "compensatory" dynamics where the network reroutes information through different pathways. This raises a dilemma: if the pathway changes after ablation to preserve performance, did the *representation* survive, or did the network simply compute a new function that mimics the old output?

  If we insist on strict Interventional Stability (the same representational vehicle must persist), we conflict with the reality of multiple minima and redundancy. If we accept that the vehicle changes but the "content" remains, we risk sliding into instrumentalism, where the representation is defined solely by the input-output behavior, violating the realist spirit of Desideratum 1. These two desiderata appear jointly unsatisfiable under a strict interpretation of structural realism; satisfying both requires a shift toward a functional-role realism that decouples content from specific subnetwork topology.

  ***

  ### Evaluation of Contenders

  **1. Causal-Informational Realism**
  *   **Performance:** Strong on Desideratum 1 (Tracking vs. Representation) and Desideratum 3 (Interventional Stability). By grounding representation in causal flow, it naturally distinguishes spurious correlations from functional drivers and supports the idea that cutting causal links should alter content.
  *   **Deficiencies:** It struggles significantly with Desideratum 2 (Polysemy) and Desideratum 5 (Non-Uniqueness). Causal accounts often assume a more stable mapping between cause and effect than exists in overparameterized networks. It has difficulty explaining how the same causal node can carry different information in different contexts without fracturing the causal story.
  *   **Verdict:** Fails to accommodate the empirical reality of distributed coding.

  **2. Structural-Mapping Realism**
  *   **Performance:** Excellent on Desideratum 2 (Polysemy) and Desideratum 4 (Empirical Accessibility). By focusing on isomorphisms between activation subspaces and feature spaces, it naturally handles superposition and high-dimensional geometry. It aligns well with modern mechanistic interpretability.
  *   **Deficiencies:** It faces a critical challenge from Desideratum 5 (Non-Uniqueness). If representations are structural maps, and there are multiple non-isomorphic weight configurations that solve the task, the theory must explain which map is the "real" one. It also risks failing Desideratum 3 if the structure is too fragile under ablation.
  *   **Verdict:** The strongest candidate for modern architectures, provided it can relax the requirement for unique structural identity.

  **3. Instrumentalist Deflationism**
  *   **Performance:** Perfectly consistent with Desideratum 5 (Non-Uniqueness) and Desideratum 2 (Polysemy). By treating representation as a useful gloss rather than an ontological fact, it bypasses the problems of redundancy and multiple minima entirely.
  *   **Deficiencies:** It explicitly rejects the premise of the seminar (Representational Realism). It fails Desideratum 1 by refusing to make a hard distinction between tracking and representation (both are just useful predictive stances). It also fails Desideratum 3, as there is no "real" representation to remain stable under intervention.
  *   **Verdict:** Conceptually coherent but disqualifies itself from the specific project of establishing realism.

  **Summary:** Structural-Mapping Realism offers the most viable path forward, provided it evolves to treat representations as properties of *computational trajectories* rather than static weight configurations, thereby resolving the tension between stability and non-uniqueness. Causal-Informational accounts require significant revision to handle polysemy, while Instrumentalism abandons the realist goal.
