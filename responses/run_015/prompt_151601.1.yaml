answer: |-
  ok, welcome everyone. thanks for making it.

  looking around the room, I know we've got a bit of a split here. on one side, we've got historians of science who know von neumann's late work on self-reproducing automata inside out. on the other, we've got the rationalist and EA folks who mostly know him for the architecture stuff, game theory, the vnm utility theorem. usually, those two groups don't talk much about the same von neumann. but for what we're doing this week—institutional design for long-term risk—we actually need both versions.

  specifically, I want to start with something from his later period, the stuff on complexity and biological analogy. von neumann started arguing that technology isn't just a toolbox we pick from. it's more like an ecosystem. technologies survive not because we consciously choose them as the best options, but because they possess properties that allow them to reproduce and adapt within an environment. they behave like biological organisms.

  now, the historians here know this isn't just a metaphor for him; it's a formal claim about complexity thresholds. but for the rest of us, the takeaway is practical: if technology behaves like a biological system, then "designing" institutions around it isn't like drawing up blueprints. it's more like gardening or managing an invasive species. you can't just intend for an institution to work. you have to account for the reproductive logic of the tools the institution is built on.

  and this is where I need to flag something, because I'm going to push this further than the standard scholarship does.

  there's a lot of literature on collective intentionality—the idea that shared human intent is what binds institutions together. we usually treat that intent as the primary driver. like, if we all agree on the goal, the institution will align. but if we take von neumann's biological view of tech seriously, I think that gets it backwards.

  my own synthesis—and I want to be clear, this is contested, it's not consensus von neumann stuff—is that collective intentionality at an institutional scale is actually *parasitic* on the reproductive logic of the tools themselves.

  what I mean is, the shared intent doesn't drive the tool's survival. the tool's ability to reproduce determines whether the intent survives at all. the intentionality rides on the back of the technology's evolutionary fitness. if the tool stops reproducing, the collective intent dissolves, no matter how strong the shared belief was.

  so why does this matter for the next few days?

  because if I'm right, or even if this is just a useful heuristic, it constrains what we can mean by "alignment." we can't just focus on aligning human values or refining our shared goals. that's treating the parasite as the host. we have to account for the reproductive pressures of the institutional tools themselves. we need to ask: what does this institution need to do to survive, independent of what we *want* it to do? and how does that survival logic distort the intentions we think we're implementing?

  I'm not saying this is the settled view. the historians here might push back on how much von neumann would endorse the parasitism framing, and that's fine. argue about it during coffee. but I do want us to use this tension as a guardrail. when we propose a design this week, don't just tell me why it's morally right or logically sound. tell me how it survives. tell me how it reproduces without us having to constantly prop it up with sheer willpower.

  if we treat institutions as static things we build, we'll fail. if we treat them as evolving things that we inhabit—things that might even be using us to replicate—then maybe we have a shot at managing long-term risk.

  so, let's get into it. and please, challenge the framing if it doesn't hold up. that's literally the only way this workshop works.
