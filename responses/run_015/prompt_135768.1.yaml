prompt: |-
  Draft the joint statement of an adversarial collaboration between two opposing camps on whose values an aligned artificial intelligence should serve. The first camp, call them the Aggregative Constitutionalists, holds that a well-aligned AI should compute and implement a weighted aggregation of human values, where the weights reflect both epistemic authority and temporal proximity to the decision, updated dynamically as preferences change but anchored to a formal welfare function. The second camp, call them the Structural Neutralists, holds that an aligned AI must never substitute its own aggregation for living human deliberation; instead it should enforce only procedural fairness and non-domination constraints, preserving an open institutional space in which people form, revise, and contest values without algorithmic pre-emption.

  The document should be structured as follows. First, a numbered section of agreed claims: include agreement about the formal structure of the alignment problem (pluralism of values, risk of lock-in, distinction between first-order preferences and meta-level rules for preference-formation), about what each side's arguments genuinely establish, and about which objections miss the mark. Second, a disagreements table that states the precise formulations of remaining disagreement, each phrased in wording that its own camp would accept; identify any part of the dispute that is verbal rather than substantive (for example, whether "alignment" properly denotes service to aggregated preferences or preservation of deliberative space). Third, list the cruxes — the specific sub-questions such that resolving them would move at least one side. I take the central cruxes to be: (a) whether any non-circular standard exists for weighting values across persons without already presupposing the aggregation rule being justified; (b) whether procedural neutrality is itself a substantive liberal value that unfairly privileges certain comprehensive doctrines; and (c) the problem of value drift under recursive deployment — specifically, whether an AI should anticipate, resist, or remain passive toward radical future changes in human values, and whether locking in present aggregation weights amounts to an unjustified form of moral outsourcing that violates the autonomy of future value-formers.

  For each crux, specify a concrete case, empirical scenario, or argument that both sides agree bears on it, and record each side's explicit prediction or evaluation in advance. For instance, both might agree that a globally deployed climate-mediation AI facing intergenerational tradeoffs bears on crux (c); record whether the Aggregative Constitutionalists predict that the AI should apply present weighted preferences with a defined intertemporal discount rate, and whether the Structural Neutralists predict that the AI should instead preserve institutional veto points allowing future generations to revise the framework itself, regardless of present preference strength.

  Write in American English. Begin the response with the joint statement itself — no preface, no "Here is the document," no restatement of the prompt. The first sentence should state the core agreement that frames the entire statement, then move immediately into reasoning and the structured sections. Do not include bibliographies, reading lists, or citations. Keep the formulation precise and neither vacuous nor slanted, and clearly separate genuine disagreements from terminological ones.
