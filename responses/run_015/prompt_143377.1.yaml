answer: |-
  # HANDOUT: EPISTEMIC SORTING INSTRUMENT FOR THOUGHT EXPERIMENTS

  ## PART A — THE QUESTIONS

  Read each scenario and select the option that best matches your judgment about what is happening in the case.

  **1. The Falling Stones (Galileo)**
  A physicist imagines two stones of different weights tied together to refute the claim that heavier bodies fall faster. She concludes the speed law must be false.
  *   (A) The scenario reveals a necessary constraint on how physical bodies behave in any possible world.
  *   (B) The scenario rearranges existing definitions of weight and speed to expose a logical contradiction.

  **2. The Rotating Bucket (Newton)**
  A physicist imagines a bucket of water spinning in an otherwise empty universe. The water's surface curves. She concludes absolute space exists.
  *   (A) The verdict discloses a feature of the world (space itself) that exists independently of the objects in it.
  *   (B) The verdict exposes an incoherence in the concept of motion relative to nothing but other objects.

  **3. The Unreachable Regime (I)**
  A physicist analyzes a system that cannot be built or simulated due to complexity. She reports a confident verdict on its behavior.
  *   (A) This confidence counts as knowledge of nature, provided the reasoning is internally consistent.
  *   (B) This confidence counts only as knowledge of the model, unless independently checked by experiment.

  **4. The Unreachable Regime (II)**
  Regarding the same unreachable system, ask what produces the physicist's confidence.
  *   (A) A rational insight into the structure of physical law that bypasses the need for data.
  *   (B) A projection of patterns observed in simpler, accessible systems onto the complex one.

  **5. The Framing Flip (I)**
  A scenario is described first as a mechanical valve, then as a tiny agent choosing. Verdicts on the outcome flip, though the physics is identical.
  *   (A) The flip shows that at least one verdict is erroneous, as the physical facts did not change.
  *   (B) The flip shows that the verdicts track our conceptual expectations, not the physical facts themselves.

  **6. The Consensus Reversal (I)**
  Archives show past physicists reached the opposite verdict on a scenario due to a false background assumption we now reject.
  *   (A) Our current verdict is secure because the false assumption has been removed.
  *   (B) Our current verdict is suspect because the method of reaching it remains sensitive to background assumptions.

  **7. The Surrogate Simulation (I)**
  A validated simulation code contradicts the unanimous intuition of trained physicists on a specific case. No experiment is possible.
  *   (A) The intuition should be revised; the code tracks physical constraints more reliably.
  *   (B) The code should be revised; the intuition grasps the physical necessity the code misses.

  **8. The Narrative Role**
  Consider the story-like details in a thought experiment (e.g., the specific shape of the bucket).
  *   (A) These details are psychologically useful to guide the mind but add no epistemic weight.
  *   (B) These details are essential to trigger the cognitive mechanism that produces the verdict.

  **9. The Cognitive Faculty**
  When a verdict is reached about an imagined case, what faculty is at work?
  *   (A) An ordinary capacity for counterfactual judgment, fallible and subject to error like any other.
  *   (B) A special capacity for grasping modal truths that is distinct from everyday judgment.

  **10. The Epistemic Goal**
  What is the primary outcome of a successful thought experiment?
  *   (A) A change in what we find plausible or persuasive, without guarantee of truth.
  *   (B) A discovery of fact or a forced revision of concepts that guarantees a shift in understanding.

  ***

  ## PART B — THE LOGICAL SPACE

  **1. The Slots**
  There are ten questions, each offering a binary choice (A or B). Formally, this creates a space of $2^{10} = 1,024$ possible answer combinations. Each combination represents a unique profile of judgments about how thought experiments function.

  **2. Locating the Accounts**
  The eight accounts (Leaves) do not occupy single points but clusters within this space. They group around shared commitments on key dimensions:
  *   **Source of Knowledge:** Questions 1, 2, 3, 4 (Is it the world, the model, or the mind?)
  *   **Stability:** Questions 5, 6, 7 (Is the verdict robust against framing, history, or tools?)
  *   **Mechanism:** Questions 8, 9, 10 (Is it argument, simulation, or intuition?)

  **3. Empty Combinations**
  Three specific regions of the 1,024 combinations are unoccupied:

  *   **Combination X (Incoherent):** Answers assert that verdicts are objective facts about nature (Q1-A, Q2-A) but also that they flip when the description changes (Q5-B) and depend on the reader's demographic profile (implied by Q6-B).
      *   *Status:* **Incoherent.** One cannot claim a verdict tracks mind-independent facts while admitting it varies with mind-dependent framing.
  *   **Combination Y (Unattractive):** Answers assert that thought experiments are merely disguised arguments (Q1-B, Q8-A) but require a special rational faculty to parse (Q9-B).
      *   *Status:* **Merely Unattractive.** It is logically possible to argue that logical parsing requires a special intuition, but it multiplies faculties without necessity, making it theoretically costly.
  *   **Combination Z (Unoccupied but Coherent):** Answers assert that verdicts are simulations (Q8-B) that require no empirical input ever (Q4-A) and need no external calibration (Q3-A).
      *   *Status:* **Coherent and Unoccupied.** A holder of this view would believe the mind runs perfect simulations of nature purely through internal structure, without needing to learn physics from the world. It is attractive for its simplicity but lacks a plausible mechanism for how the internal model matches the external world.

  ***

  ## PART C — EIGHT LEAVES

  **1. A Platonist or rationalist account**
  *   **Account:** Thought experiments put us in contact with features of nature by a kind of rational intuition, yielding substantive new knowledge without new empirical input.
  *   **Awkward Commitment:** It must explain how a mental act can constrain physical reality without any causal interaction between the mind and the laws of nature.

  **2. The argument or "nothing new" account**
  *   **Account:** A thought experiment is a disguised argument whose premises are all already available empirically, so the conclusion is genuinely new only in the sense of being newly noticed.
  *   **Awkward Commitment:** It must dismiss the vivid narrative and psychological drama of the scenario as epistemically idle, despite its apparent necessity for understanding.

  **3. A mental-model or simulation account**
  *   **Account:** The reasoner runs a simulation on an internalised model, and the epistemic status of the verdict tracks the fidelity of that model rather than any special faculty.
  *   **Awkward Commitment:** It struggles to explain how we can have high confidence in simulations of regimes (like the unreachable) where the model cannot be empirically validated.

  **4. A conceptual-revision account**
  *   **Account:** Thought experiments characteristically do not disclose facts but expose incoherence between our concepts and a theory's commitments, forcing a revision of the conceptual scheme.
  *   **Awkward Commitment:** It implies that thought experiments cannot tell us about the world itself, only about the language and categories we use to describe it.

  **5. Anti-exceptionalism about modal judgement**
  *   **Account:** Verdicts about imagined cases are ordinary counterfactual judgements of the same fallible kind we make constantly, neither privileged nor specially suspect.
  *   **Awkward Commitment:** It denies that science uses any distinctive method for thinking about possibilities, reducing high-stakes theoretical moves to everyday reasoning.

  **6. The pump or persuasion account**
  *   **Account:** Thought experiments change what we find plausible without supporting what they make plausible, and their reliability is a matter of rhetorical efficacy rather than warrant.
  *   **Awkward Commitment:** It renders the widespread scientific trust in thought experiments irrational, as they would be tools of manipulation rather than discovery.

  **7. An instability or debunking account**
  *   **Account:** Verdicts about imagined cases are sensitive to presentation, framing, order and the demographic profile of the reader to a degree that defeats the claim that they track the facts.
  *   **Awkward Commitment:** It suggests that no verdict from a thought experiment can ever be known to be true, only known to be contingent on how it was asked.

  **8. The calibrationist account**
  *   **Account:** A verdict counts as knowledge only to the extent that the mechanism producing it has a demonstrable track record of success on independently checkable cases of the same kind.
  *   **Awkward Commitment:** It implies that thought experiments about truly novel or unreachable regimes can never yield knowledge, only defeasible expectations, regardless of their intuitive force.
  *   **Location:** Sits between the Mental-Model and Instability leaves.
  *   **Distinction:** It does not collapse into Mental-Model because it demands *external* track records, not just internal fidelity. It does not collapse into Instability because it allows for knowledge *within* the calibrated range.
  *   **Literature Status:** It is rarely defended as a standalone view because it treats thought experiments as subordinate to empirical validation, which many argue defeats the purpose of using them where validation is impossible.

  ***

  ## PART D — SCORING KEY AND LIMITS

  **1. Mapping Patterns to Leaves**
  To determine your leaf, tally your answers across three dimensions:
  *   **Dimension 1 (Source):** Questions 1, 2, 3, 4. (Mostly A = Platonist/Rationalist; Mostly B = Empirical/Model).
  *   **Dimension 2 (Stability):** Questions 5, 6, 7. (Mostly A = Robust/Realist; Mostly B = Sensitive/Conceptual).
  *   **Dimension 3 (Mechanism):** Questions 8, 9, 10. (Mostly A = Argument/Ordinary; Mostly B = Simulation/Special).

  *   **Platonist:** Dim 1 (A), Dim 2 (A), Dim 3 (B).
  *   **Argument:** Dim 1 (B), Dim 2 (A), Dim 3 (A).
  *   **Mental-Model:** Dim 1 (B), Dim 2 (A), Dim 3 (B).
  *   **Conceptual-Revision:** Dim 1 (B), Dim 2 (B), Dim 3 (A).
  *   **Anti-Exceptionalist:** Dim 1 (B), Dim 2 (A), Dim 3 (A) [with Q9-A].
  *   **Pump:** Dim 1 (B), Dim 2 (B), Dim 3 (B) [with Q10-A].
  *   **Instability:** Dim 1 (B), Dim 2 (B), Dim 3 (A/B) [Strong B on Q5, Q6].
  *   **Calibrationist:** Dim 1 (B), Dim 2 (A/B) [Mixed], Dim 3 (B) [with Q3-B, Q7-A].

  **2. Tie-Breaking Rules**
  *   If Dimensions are mixed (e.g., 2 A, 2 B), prioritize **Dimension 2 (Stability)**. If you believe verdicts are sensitive to framing (Q5-B), you move toward Instability or Conceptual-Revision regardless of other answers.
  *   If Q3 is answered (B) (Unreachable Regime is not knowledge), you cannot be Platonist.
  *   If Q10 is answered (A) (Goal is plausibility), you are routed to Pump.

  **3. Minimal-Move Map**
  *   **Platonist → Mental-Model:** Change Q4 from "Rational Insight" to "Projection of patterns."
  *   **Argument → Conceptual-Revision:** Change Q2 from "Feature of world" to "Incoherence in concept."
  *   **Mental-Model → Calibrationist:** Change Q3 from "Counts as knowledge" to "Counts only as model."
  *   **Instability → Anti-Exceptionalist:** Change Q6 from "Current verdict suspect" to "Current verdict secure."

  **4. Inseparable Pairs**
  *   **Pair:** *The Argument Account* and *Anti-Exceptionalism*.
      *   **Why:** Both view TEs as ordinary empirical reasoning.
      *   **Missing Question:** "Is the cognitive process involved in a TE metaphysically distinct from everyday reasoning?"
      *   **Limit:** This question asks about the metaphysics of the faculty, not about a case outcome, violating the constraint that branch nodes must be askable of a case.
  *   **Pair:** *The Pump Account* and *The Instability Account*.
      *   **Why:** Both deny that TEs track truth reliably.
      *   **Missing Question:** "Does the thought experiment intend to deceive?"
      *   **Limit:** Answering this requires knowing the author's intent, which is not accessible from the case description alone.

  ***

  ## PART E — ROUTING THE CASES

  *Note: This section routes the **cases themselves** based on the "Standard" analysis intended by the instrument design, demonstrating how the tree classifies epistemic work.*

  **1. The Falling Stones (Galileo)**
  *   **Path:** Q1(B) → Q2(N/A) → Q5(A) → Q8(A).
  *   **Leaf:** **The Argument Account.**
  *   **Separates:** Distinguishes from Platonist (Q1-A) and Mental-Model (Q8-B).
  *   **Note:** If described as "revealing the true nature of gravity" rather than "refuting a definition," routing shifts to Platonist at Q1.

  **2. The Rotating Bucket (Newton)**
  *   **Path:** Q1(A) → Q2(A) → Q5(A) → Q9(B).
  *   **Leaf:** **A Platonist or rationalist account.**
  *   **Separates:** Distinguishes from Conceptual-Revision (Q2-B) and Anti-Exceptionalist (Q9-A).
  *   **Note:** If described as "showing the limits of relational mechanics," routing shifts to Conceptual-Revision at Q2.

  **3. The Unreachable Regime**
  *   **Path:** Q3(B) → Q4(B) → Q7(A).
  *   **Leaf:** **The Calibrationist Account.**
  *   **Separates:** Distinguishes from Mental-Model (Q3-A) and Instability (Q7-B).
  *   **Empty Cell Check:** This case reaches the Calibrationist leaf. If Q3 were answered (A) and Q4 (A), it would hit **Combination Z** (Unoccupied/Coherent: Perfect Internal Simulation). This view lives in the space where one trusts internal simulation without external check or rational intuition.

  **4. The Framing Flip**
  *   **Path:** Q5(B) → Q6(B).
  *   **Leaf:** **An Instability or debunking account.**
  *   **Separates:** Distinguishes from all Realist accounts (Q5-A).
  *   **Description Sensitivity:** If the case is described as "one description was physically imprecise," routing shifts to Argument (Q5-A) because the physical facts *did* change.

  **5. The Consensus Reversal**
  *   **Path:** Q6(B) → Q5(B).
  *   **Leaf:** **An Instability or debunking account.**
  *   **Separates:** Distinguishes from Platonist/Argument (Q6-A).
  *   **Note:** If the false assumption is described as "logical" rather than "empirical," routing may shift to Conceptual-Revision.

  **6. The Surrogate Simulation**
  *   **Path:** Q7(A) → Q3(B).
  *   **Leaf:** **The Calibrationist Account.**
  *   **Separates:** Distinguishes from Mental-Model (Q7-B) and Platonist (Q3-A).
  *   **Note:** This case is the strongest driver for the Calibrationist leaf, as it forces a choice between validated tools and intuition.

  **Summary of Case Routing:**
  *   **Galileo:** Argument.
  *   **Newton:** Platonist.
  *   **Unreachable:** Calibrationist.
  *   **Framing:** Instability.
  *   **Consensus:** Instability.
  *   **Surrogate:** Calibrationist.

  *The instrument successfully separates the historical cases (Argument vs. Platonist) and uses the invented cases to isolate the modern epistemic concerns (Calibration vs. Instability).*
