answer: |-
  This is a precise and necessary line of inquiry. You are correct that the standard retribution/rehabilitation binary obscures the operational logic of both systems. As an architect, you are seeing the materialization of bureaucratic philosophies that often contradict their own stated moral aims.

  Here is a reconstruction of the implicit theories, an evaluation of your "residue" diagnosis, and the architectural consequences of purifying those theories.

  ### 1. The Norwegian Model: Normalization and Risk

  **The Practice:** Liberty is the only forfeit. Civil rights remain. Services are externalized. Custody is graded.
  **The Exception:** 21-year cap with renewable 5-year extensions for high-risk offenders. Halden is a high-security container.

  **Implicit Theory:**
  The Normalization Principle strictly presupposes a **deontological limit on state power**, not necessarily a theory of desert. It posits that the state's authority to punish is exhausted by the removal of physical freedom. Any additional deprivation (privacy, autonomy, access to public goods) requires a separate justification that the state cannot meet.
  *   **Strict Presupposition:** The prisoner retains moral status as a citizen. The prison is a *place*, not a *status*.
  *   **Comfortable Fit:** Consequentialism. It fits comfortably with the data that normalized environments reduce recidivism. However, a thoroughgoing consequentialist *could* justify harsh conditions if they demonstrably lowered reoffending rates. The fact that the Norwegian system forbids harsh conditions *even if they might work* indicates a rights-based floor, not a utilitarian calculation. Normalization is a constraint on *method*, not just an optimization of *outcome*.

  **The Risk Extension (The 21+5 Rule):**
  Does this contradict Normalization? Legally, no; morally, yes.
  In Norwegian law, the initial sentence is *straff* (punishment), governed by Normalization. The extension is *forvaring* (preventive detention), governed by public safety.
  *   **The Contradiction:** It reveals that Normalization cannot handle the "dangerous." When the logic shifts from "paying a debt" to "managing a hazard," the citizen-status is quietly revoked. The architecture of Halden (the wall, the cameras) acknowledges this. The "soft" interior is for the punished citizen; the "hard" perimeter is for the risky subject.
  *   **Derivation:** They can be derived from a single view only if you accept a **dual-track theory of justice**: Retributive/Normalized for the guilty, Consequentialist/Quarantine for the dangerous. The system hides the seam between them, but the architecture (the perimeter wall vs. the interior kitchen) exposes it.

  ### 2. The American Model: The Credit System

  **The Practice:** Housing, movement, and time are fungible currencies. Compliance buys freedom; infraction buys confinement.
  **The Tension:** Rehabilitation is officially "treatment" (caused) but operationally "performance" (rewarded).

  **Implicit Theory:**
  The Credit System presupposes **Behaviorism**, not Rehabilitation in the therapeutic sense.
  *   **Strict Presupposition:** The prisoner is a rational economic actor within a total institution. The state does not need to change the prisoner's internal moral compass; it needs to shape external compliance. The "sentence" is not a fixed debt but a **contract**.
  *   **The Contradiction:** You asked if it is a contradiction to treat rehabilitation as both caused and performed. In this system, **no**. The system is agnostic about internal change. If a prisoner memorizes the workbook but remains a sociopath, they earn the credits. The system presupposes that *compliance is a proxy for safety*. It treats rehabilitation as a *transaction*.
  *   **Desert vs. Management:** This system actually undermines retributive desert. If sentence length fluctuates based on behavior, the "debt" was never fixed. It presupposes that punishment is **indeterminate management** masquerading as a fixed term. The "fixed sentence" is the marketing; the "credit system" is the product.

  ### 3. The Residue: Deprivation, Treatment, Quarantine

  Your diagnosis is real and structurally significant. It is not merely the retributivism/consequentialism split in different words. It identifies a **metric failure** in penal theory.

  *   **Deprivation Owed (Desert):** Only this logic yields a specific number of days *ex ante*. It answers "How much?"
  *   **Treatment (Rehab):** Answers "How long until fixed?" (Unknown at sentencing).
  *   **Quarantine (Incapacitation):** Answers "How long until safe?" (Unknown at sentencing).

  **The "Days" Problem:**
  You are correct: The sheer fact that a sentence must be expressed in days is something neither theory fully explains.
  *   **Retribution** could demand a fine, corporal punishment, or permanent exile. Time is an arbitrary metric for pain.
  *   **Consequentialism** would prefer indeterminate confinement until "cured" or "safe."
  *   **The Synthesis:** The "fixed term in days" is a **legal fiction** required by the Rule of Law (prohibition on arbitrary detention) that papers over the switch from Desert (at the judge's bench) to Management (inside the fence).
  *   **The Switch:** Both countries use the first (Desert) to legitimize the entry, then quietly switch to the second or third (Management) to run the facility. The US makes the switch explicit via credits (you can change the days). Norway makes the switch implicit via the 21+5 rule (we keep you if you're dangerous).

  **Verdict:** Your map is more accurate than the standard philosophical split because it accounts for the *administrative reality* of the building. The building must house a person whose legal status changes from "debtor" to "patient" or "hazard" the moment the door locks.

  ### 4. Architectural Implications

  If you were to design based on purified justifications, the material changes would be radical. Here is what you would stop and start designing in each scenario.

  #### A. Purely Desert-Based (in a Norwegian Facility)
  *Justification:* The state is authorized only to deprive liberty proportional to the wrong. No rehabilitation, no risk management beyond secure containment.
  *   **Stop Designing:**
      *   **Program Spaces:** Classrooms, workshops, and extensive common rooms become superfluous. If the point is deprivation, providing state-funded vocational training is an unearned benefit.
      *   **Normalization Aesthetics:** The "home-like" kitchens, wood finishes, and soft furnishings. These obscure the reality of the deprivation.
      *   **Graded Custody Flows:** If the sentence is fixed by the wrong, moving from closed to open units based on "progress" is unjust. The confinement should be uniform.
  *   **Start Designing:**
      *   **Uniform Cells:** High-security cells that are humane but austere. Focus on durability and security, not domesticity.
      *   **Clear Boundaries:** Architecture that makes the loss of liberty palpable. The perimeter should be distinct.
      *   **Visitation as Right:** Since family contact is a civil right not forfeited, visitation areas become the primary "public" space, larger and more accessible than in current designs.

  #### B. Purely Consequentialist (in a Norwegian Facility)
  *Justification:* The goal is minimizing future harm (recidivism + public risk). Efficiency is the only moral metric.
  *   **Stop Designing:**
      *   **Fixed-Term Housing:** If risk dictates stay, fixed cell blocks are inefficient.
      *   **The 21-Year Seam:** You would not separate the "punishment" wing from the "preventive" wing. It is all risk management.
  *   **Start Designing:**
      *   **Flexible/Modular Units:** Walls that can be reconfigured as risk profiles change. A room that is a cell today might be a dorm tomorrow.
      *   **Surveillance Infrastructure:** Increased investment in data centers and monitoring hubs. The building is a sensor array.
      *   **Transition Zones:** The architecture would blur the line between inside and outside. Halfway houses would be integrated into the main site to test release readiness.
      *   **If Harshness Worked:** If data showed austere conditions reduced recidivism, a pure consequentialist design would implement them. The "nice" design of Halden is only justified because the data supports it.

  #### C. Purely Therapeutic (in an American Facility)
  *Justification:* The goal is curing the pathology that led to incarceration. Confinement is hospitalization.
  *   **Stop Designing:**
      *   **The Credit/Control Booth:** The central control desk that tracks points and privileges is the antithesis of therapy. It creates a power dynamic that undermines trust.
      *   **Segregation Units:** Solitary confinement is clinically counter-productive. You would eliminate SHU (Special Housing Unit) designs entirely.
      *   **Perimeter as Priority:** In a hospital, the treatment rooms are the core, not the fence. Currently, you design from the fence in.
  *   **Start Designing:**
      *   **Clinical Core:** The center of the facility becomes the treatment wing (group therapy, psychiatric eval, medical). Housing radiates from this, rather than security radiating from a perimeter.
      *   **Staff Stations:** Instead of guard towers, you design nursing stations or caseworker offices embedded in the housing units.
      *   **Open Campuses:** For medium/low security, the fence disappears. Security is managed through staffing ratios and clinical assessment, not physical barriers.
      *   **Private Consult Rooms:** Essential for attorney-client and doctor-patient privilege, currently often compromised in US designs for security sightlines.

  ### Summary for the Architect

  You are designing for a **hybrid ontology**.
  *   **Norway** designs for a *Citizen* but builds a *Container* for the dangerous.
  *   **The US** designs for a *Debtor* but operates a *Market* for compliance.

  The friction you feel is not just moral; it is spatial.
  *   In **Halden**, the friction is between the **Interior** (Normalization/Citizen) and the **Perimeter** (Risk/Subject).
  *   In the **US South**, the friction is between the **Cell** (Confinement) and the **Control Booth** (Management/Currency).

  If you want to design honestly:
  1.  **Acknowledge the Switch:** Design spaces that can legally and physically transition from "punitive" to "preventive" without requiring new construction (e.g., flexible zoning within the unit).
  2.  **Expose the Currency:** In the US, if time is money, the architecture of the "bank" (control center) is more important than the "vault" (cell). Currently, you design the vault and bolt on the bank.
  3.  **The "Days" Problem:** Since the sentence length is a fiction, design for **modularity**. Fixed-term architecture assumes a static population flow. If the system is actually managing risk or treatment, the population flow is variable. Your HVAC, staffing lines, and circulation should be designed for flux, not fixed capacity.

  Your diagnosis holds: The "fixed term" is the lie that allows the building to exist. The practice inside is always something else. Design for the practice, not the lie, and you will find the current codes and standards fighting you at every turn. That resistance is the sound of the philosophy breaking.
