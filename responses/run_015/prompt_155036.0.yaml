prompt: |-
  I'm a graduate student in an interdisciplinary seminar on philosophy of history and environmental explanation, and we've been working through the tension between treating non-human forces—epidemics, climate anomalies, volcanic winters—as genuine causal contributors and avoiding the pitfalls of environmental determinism. Before you answer, please adopt the role of an expert philosopher of history with training in philosophy of science and causal ontology, and take a moment to brainstorm the key distinctions we'll need—particularly around agency, mediation, and explanatory levels—thinking carefully through each step rather than rushing to a conclusion.

  Here is the institutional practice that puzzles me. In peer-reviewed historical journals, when scholars attribute large-scale outcomes—say, the fragmentation of a polity, a demographic collapse, or a long-distance migration—to environmental pressures such as prolonged drought, pathogenic spread, or volcanic cooling, reviewers and editors routinely require the author to identify specific "mediating mechanisms." The author must demonstrate precisely how human political institutions, economic networks, or cultural practices translated that environmental pressure into the observed change. If the argument treats the climate event or the pathogen as producing the historical outcome directly, without passing through human institutional response, it is frequently rejected as "environmental determinism" or as "reductive." Yet within the same university, epidemiologists and climate scientists routinely publish work in which the pathogen or the temperature anomaly functions as a direct causal agent with quantifiable effects, and no comparable demand for institutional mediation is made.

  What philosophical commitments about historical agency and causation does this peer-review norm presuppose? Reconstruct the implicit theory: does it commit the discipline to the view that only intentional agents can count as "historical actors," or does it rely on a more nuanced ontology—perhaps one in which human institutions possess a distinctive form of "mediating agency" while non-human forces possess only "triggering efficacy"? Say whether the practice strictly requires one particular theory of causation or explanation, or whether it is philosophically underdetermined and compatible with several rival accounts. Also, assess whether the norm is internally coherent, especially given that legal and policy frameworks within the same society often treat environmental disasters as direct causal agents—for instance, in liability doctrines that assign causation to a "natural disaster" without demanding proof of institutional mediation. Finally, if we replaced the underlying view with one that granted non-human forces full status as historical actors—without requiring translation through human institutions—what concrete changes would have to occur in historical narrative construction, in the assignment of moral and political responsibility, and in the curatorial design of public-history exhibits?
