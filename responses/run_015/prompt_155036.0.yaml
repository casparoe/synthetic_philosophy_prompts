      *   *Brainstorming:* I need to make sure I distinguish between *causing* and *acting*. A virus causes death, but does it act with intent? Historians care about the *response* to the virus.
      *   *The Norm:* Why do historians hate determinism? Because it removes human contingency. If the drought *made* them migrate, they had no choice. Historians want to show they *chose* to migrate based on the drought.
      *   *Science/Law:* Science looks for physical causality. Law looks for proximate cause for damages. History looks for *significant* cause in a web of meaning.
      *   *Underdetermination:* The norm doesn't say nature *can't* cause things. It says nature *alone* doesn't make *history*. It's about the *domain* of explanation.
      *   *The "What If":* If volcanoes are actors, we enter Post-humanism or Actor-Network Theory (ANT). Narrative becomes decentralized. Responsibility becomes distributed (or dissolved). Exhibits become ecological rather than anthropocentric.

