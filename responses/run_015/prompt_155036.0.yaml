      *   **Core Question:** What philosophical commitments does the historical peer-review norm presuppose? Is it committed to intentional agency only, or a nuanced ontology? Is it underdetermined? Is it coherent compared to legal/policy frameworks? What would change if we granted non-human forces full status as historical actors?
      *   **Tone:** Academic, rigorous, nuanced, reflective (showing the "brainstorming" step).
