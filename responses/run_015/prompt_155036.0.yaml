answer: |-
  It is a pleasure to engage with this problem. It cuts to the very heart of what distinguishes *history* as a discipline from *chronology* or *natural science*. As a philosopher of history working at the intersection of causal ontology and scientific practice, I find your observation about the peer-review norm astute. It reveals a tacit boundary-policing mechanism that defines the discipline's ontology.

  Per your request, I will not rush to a verdict. Instead, I will first lay out the conceptual distinctions we need to navigate this tension, then reconstruct the implicit theory behind the peer-review norm, assess its coherence against other domains (science/law), and finally explore the consequences of shifting that ontology.

  ### Part I: Brainstorming Key Distinctions
  Before diagnosing the norm, we must clarify the conceptual toolkit. The tension you describe relies on conflating three distinct philosophical categories.

  **1. Causal Efficacy vs. Historical Agency**
  *   **Causal Efficacy:** This is the capacity of an entity to produce a change in the state of the world. A volcano has high causal efficacy; it releases energy that alters topography and atmosphere. A virus has causal efficacy; it replicates and disrupts biological homeostasis. Science deals primarily here.
  *   **Historical Agency:** This is a thicker concept. In traditional historiography, agency implies not just the capacity to effect change, but the capacity to *respond* to change within a field of possibilities. It is tied to contingency. If $X$ happens, Agent $A$ could have done $\phi$ or $\psi$.
  *   **The Distinction:** The peer-review norm suggests that while non-human forces have *efficacy*, they lack *agency*. Therefore, they cannot be the *subject* of a historical sentence, only the *object* or the *context*.

  **2. Triggering vs. Mediating (The Mechanism Problem)**
  *   **Triggering:** An environmental event (drought) creates a stressor. This is a necessary condition, perhaps a "trigger."
  *   **Mediating:** The social structure determines whether that trigger leads to migration, revolution, or collapse. A drought in a society with grain silos and trade networks yields a different outcome than in a subsistence society.
  *   **The Distinction:** Historians demand the "mediating" link because that is where *human variation* lies. If we stop at the trigger, all societies react identically to drought (determinism). If we look at mediation, we see *history* (specific choices, structures, cultures).

  **3. Explanatory Levels: Nomothetic vs. Idiographic**
  *   **Nomothetic (Science):** Seeks general laws. "Volcanic winter reduces crop yields by $X\%$." This holds true regardless of human culture.
  *   **Idiographic (History):** Seeks specific explanation of unique events. "Why did *this* polity collapse in *this* year?"
  *   **The Distinction:** The scientific explanation is valid at the biological/climatological level. The historical explanation is invalid if it remains at that level, because it fails to explain the *specificity* of the human outcome.

  ---

  ### Part II: Reconstructing the Implicit Theory of the Peer-Review Norm

  You ask what philosophical commitments this norm presupposes. Does it commit historians to the view that only intentional agents count as actors?

  **The Verdict:** It is **not** strictly committed to intentionalism (the idea that only conscious intent matters), but it **is** committed to a form of **Structural Realism regarding Human Institutions.**

  **1. Rejection of "Direct" Causation**
  The norm rejects the model: *Environmental Shock $\rightarrow$ Historical Outcome.*
  It requires: *Environmental Shock $\rightarrow$ Institutional/Cultural Filter $\rightarrow$ Historical Outcome.*

  **2. The Ontology of "Mediating Agency"**
  The discipline does not deny that the volcano caused the cooling. It denies that the cooling *caused the collapse* without remainder. The implicit theory is that human institutions possess a distinctive ontological status: they are **causal transformers.** They take physical inputs and convert them into social outputs.
  *   **Non-human forces:** Possess "Triggering Efficacy." They set the boundary conditions.
  *   **Human institutions:** Possess "Mediating Agency." They determine the trajectory within those boundaries.

  **3. Is it Committed to Intentionality?**
  No. A historian can argue that a bureaucratic structure collapsed due to drought without claiming every bureaucrat *intended* the collapse. The "agency" resides in the *systemic logic* of the institution (e.g., tax collection failures, supply chain rigidities), not necessarily in individual psyches. However, because institutions are human-made and human-maintained, they retain a link to human praxis that a virus does not.

  **4. Philosophical Underdetermination**
  Crucially, this norm is **philosophically underdetermined.** It is compatible with several rival accounts of causation:
  *   **INUS Conditions (Mackie):** The drought is an Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient. The historian's job is to find the rest of the INUS condition (the institutional weakness).
  *   **Manipulability/Interventionism (Woodward):** To explain historically is to show how manipulating the institutional variables would have changed the outcome, holding the environmental variable constant.
  *   **Causal Pluralism:** The norm allows that "causation" means one thing in climatology and another in history.

  Therefore, the norm is not a metaphysical claim that "nature cannot cause things." It is a **methodological claim** that "nature alone cannot explain *historical change*." It presupposes that *history* is defined by the variation in human response, not the uniformity of physical law.

  ---

  ### Part III: Assessing Internal Coherence (History vs. Science vs. Law)

  You note the discrepancy with epidemiologists/climatologists and legal frameworks. Is the historical norm incoherent given these neighbors?

  **1. History vs. Natural Science**
  *   **Coherence Check:** Coherent, provided we accept **Explanatory Pluralism.**
  *   **Reasoning:** An epidemiologist explains *mortality rates*. A historian explains *social fragmentation*.
  *   **Example:** The Plague.
      *   *Epidemiology:* Yersinia pestis $\rightarrow$ septicemia $\rightarrow$ death. (Direct causation is sufficient here).
      *   *History:* Plague $\rightarrow$ labor shortage $\rightarrow$ breakdown of serfdom $\rightarrow$ Peasants' Revolt.
      *   **Resolution:** If the historian writes "The Plague caused the Peasants' Revolt," they are eliding the labor economics. The scientist is not eliding anything because their *explanandum* (death) is directly physical. The historian's *explanandum* (revolt) is social. The norm is coherent because the *relata* (the things being related) are different.

  **2. History vs. Legal/Policy Frameworks**
  *   **Coherence Check:** **Incoherent on the surface, but functionally divergent.**
  *   **Reasoning:** Law often uses "Act of God" or "Natural Disaster" as a **stopping rule** for liability.
      *   *Legal Causation:* Proximate cause is used to assign *blame* or *compensation*. If a hurricane destroys a house, the hurricane is the cause *to absolve the builder*.
      *   *Historical Causation:* Seeks to *open* the black box, not close it.
  *   **The Conflict:** If a court says "The drought caused the famine" to deny government aid (it was inevitable), the historian must say "The drought exacerbated the famine, but policy caused the starvation."
  *   **Assessment:** The historical norm is actually a **political/ethical safeguard** against the legal/policy tendency to naturalize suffering. By demanding mediation, historians prevent the "naturalization" of political failures. It is internally coherent with the discipline's critical function, even if it contradicts legal shorthand.

  ---

  ### Part IV: The Counterfactual — Granting Non-Human Forces Full Status

  If we replaced the underlying view with one that granted non-human forces (viruses, volcanoes, climates) full status as **Historical Actors** (akin to Actor-Network Theory or Post-humanist history), without requiring translation through human institutions, the consequences would be radical.

  **1. Narrative Construction**
  *   **Current:** "The Emperor responded to the plague by..." (Subject = Human).
  *   **New:** "The Virus migrated along the trade route, forcing the Emperor to..." or "The Volcano and the King entered an alliance of destruction..."
  *   **Change:** Narrative symmetry. The virus would have "goals" or "strategies" (metaphorically or literally via evolutionary teleology). The plot would no longer track human intention but **ecological interaction.** The "hero" of the story might be a crop species or a cooling trend. This risks **anthropomorphizing** nature or **dissolving** human responsibility into a flat ontology where a bacterium and a general are equally "actants."

  **2. Assignment of Moral and Political Responsibility**
  *   **Current:** Responsibility lies with those who mediated the disaster (e.g., leaders who failed to store grain).
  *   **New:** Responsibility becomes **distributed** or **obscured.**
  *   **Risk:** If the volcano is an "actor" equal to the politician, the politician's negligence is diluted. "The volcano decided to erupt" becomes semantically equivalent to "The Governor decided to cut funding."
  *   **Political Consequence:** This could lead to **fatalism.** If non-human forces are historical agents in the full sense, human political agency is diminished. We become passengers rather than drivers. However, it could also foster **ecological accountability**, where damaging the climate is seen as provoking a hostile actor rather than merely mismanaging a resource.

  **3. Curatorial Design of Public-History Exhibits**
  *   **Current:** Artifacts of human use (tools, letters, weapons) displayed with text explaining human decisions. Climate data is background wallpaper.
  *   **New:** Climate data becomes a protagonist.
      *   *Exhibit Design:* A museum display might place an ice core sample in a glass case with the same prominence as a royal crown. The label would not read "Climate conditions during the reign of X," but "The Little Ice Age's impact on the reign of X."
      *   *Spatiality:* Exhibits would be organized by **biomes or pathogenic vectors** rather than polities or dynasties. A "History of the Mississippi" would be a history of the river acting upon humans, not humans acting upon the river.
      *   *Experience:* Immersive simulations of environmental pressure (heat, sound of wind) would be central, not atmospheric background. The visitor is positioned as part of the ecosystem, not an observer of human drama.

  ### Conclusion

  The peer-review norm you identify is not a naive denial of scientific causality. It is a **defense of the specific object of historical inquiry:** human contingency.

  It presupposes an ontology where **efficacy is universal, but significance is mediated.** It is philosophically underdetermined (compatible with various causal theories) but methodologically strict. While it appears incoherent alongside legal "Act of God" doctrines, this is because law seeks to *limit* liability while history seeks to *expand* understanding.

  To abandon this norm and grant non-human forces full "historical actor" status would not merely change our footnotes; it would fundamentally alter the moral architecture of the discipline. It would shift history from a study of **human responsibility within material constraints** to a study of **hybrid networks where responsibility is dissolved.** Whether that is a liberation or a dereliction of duty depends on whether one believes the primary purpose of history is to explain the world or to judge human action within it.

  For your seminar, I suggest framing the tension not as "Determinism vs. Freedom," but as **"Physical Causation vs. Historical Significance."** The norm insists that a cause only becomes *historical* when it passes through the filter of human meaning-making.
