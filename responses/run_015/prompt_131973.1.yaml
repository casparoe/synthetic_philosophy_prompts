  Candidate 8 is the only true escape but lands in "Worth Trying" because it requires changing buyer perception, not just rules. It passes both tests because the brand belongs to the network, not individuals. However, it doesn't stop the bleeding immediately. The contrast between 3 and 6 highlights your Hostage Test's value: 3 makes defection expensive automatically; 6 makes defection cheap unless others pay to stop it.

  What would move something between tiers
  If buyers are highly consolidated (an oligopsony), Candidate 3 fails because buyers will demand waivers, forcing a renegotiation that breaks the rule. In that case, Candidate 8 (Branding) moves to "Do First" as the only leverage. Conversely, if legal contracts are easily enforceable in your jurisdiction, Candidate 7 (Bond) moves to "Worth Trying" because the churn risk drops. My reasoning breaks down if the "network" lacks legal standing to collect dues or enforce MFN clauses; then administrative solutions (5) become impossible, leaving only cultural ones that fail your Churn Test. Your tests are robust, but the Churn Test assumes new members are rational actors. If new buyers enter the market hungry for volume, they will break 3 and 6 regardless. If the network can control supply volume, that changes everything. But given current constraints, 3 and 5 are the only levers that pull automatically.
