prompt: |-
  my roommate summed up the anti-commons argument about patents like this: "If everyone owns a tiny slice of an idea, nobody can assemble the whole thing, so patents actually destroy innovation rather than encouraging it. Heller and Eisenberg showed this with biomedical patents—every gene gets locked up by a different owner, so developing one drug means negotiating with fifty rights-holders. The fix is to scrap patents and use prize funds instead, because Locke's proviso only applies to scarce goods, and ideas are non-rival so theres never a 'enough left' problem anyway."

  something about this feels like he's smuggling conclusions in through the framing. is this a fair summary of the anti-commons thesis? where does he overstate what Heller and Eisenberg actually claim, what's wrong with using Locke's proviso on ideas like that, and does the prize-fund conclusion actually follow? he also used the phrase "idea-fragmentation cascade"—is that a real term in IP law or did he just make it up?
