answer: |-
  # CONSTRUCTIVE MATHS: WHICH CAMP ARE YOU?

  **Start at Q1. Follow YES/NO arrows to a leaf.**

  **Q1. Is $10^{10^{10}}$ a number in quite the same sense that 7 is?**
  *   **NO** $\rightarrow$ **ULTRAFINITISM**
  *   **YES** $\rightarrow$ Go to Q2.

  **Q2. Does the set of all natural numbers exist as a completed totality?**
  *   **NO** $\rightarrow$ **FINITISM**
  *   **YES** $\rightarrow$ Go to Q3.

  **Q3. Is it true *right now* that either the decimal expansion of $\pi$ contains infinitely many 7s or it doesn't?**
  *   **YES** $\rightarrow$ Go to Q4. *(Classical/Realist Track)*
  *   **NO** $\rightarrow$ Go to Q5. *(Constructive Track)*

  **Q4. Do you insist on constructive proofs for existence claims despite accepting Q3?**
  *   **YES** $\rightarrow$ **SHALLOW CONSTRUCTIVISM**
  *   **NO** $\rightarrow$ **PLAIN CLASSICAL MATHEMATICS**

  **Q5. Is defining $n$ as the *least* number such that $\forall m, Q(n,m)$ legitimate, given the quantifier ranges over all numbers?**
  *   **NO** $\rightarrow$ **PREDICATIVISM**
  *   **YES** $\rightarrow$ Go to Q6.

  **Q6. Are there real numbers that no rule or law picks out at all (lawless choice sequences)?**
  *   **YES** $\rightarrow$ **BROUWERIAN INTUITIONISM**
  *   **NO** $\rightarrow$ Go to Q7.

  **Q7. A program searches for a Goldbach counterexample. If you prove it's impossible for the search to run forever, does it follow that it halts?**
  *   **YES** $\rightarrow$ **RUSSIAN / RECURSIVE SCHOOL**
  *   **NO** $\rightarrow$ Go to Q8.

  **Q8. Is the function $f(x)=0 (x<0), 1 (x \ge 0)$ a genuine total function on the reals?**
  *   **YES** $\rightarrow$ *[INCOHERENT HERE]* You accepted Q3=NO. Classical mathematicians say YES; Constructivists say NO.
  *   **NO** $\rightarrow$ Go to Q9.

  **Q9. Is a proof of existence an object of the same category as a number (e.g. computable term)?**
  *   **YES** $\rightarrow$ **MARTIN-LÖF / TYPE THEORY**
  *   **NO** $\rightarrow$ **BISHOP-STYLE CONSTRUCTIVISM**

  ***

  ### THE LEAVES

  | Position | Characterisation | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Ultrafinitism** | Only feasible numbers exist; induction is suspect. | Arithmetic breaks down at large $n$; no standard model. |
  | **Finitism** | Potential infinity only; no completed sets. | Cannot quantify over "all" natural numbers. |
  | **Classical** | Truth outruns provability; LEM holds universally. | Existence without witnesses (e.g. $\sqrt{2}^{\sqrt{2}}$). |
  | **Shallow** | Classical truth is real, but constructive proofs are better. | Admitting truths you methodologically refuse to use. |
  | **Predicativism** | No definition may quantify over a totality including itself. | Much of standard analysis (e.g. LUB) becomes difficult. |
  | **Brouwerian** | Mathematics is mental construction; choice sequences allowed. | All total functions $\mathbb{R}\to\mathbb{R}$ are continuous. |
  | **Russian** | Constructive = Computable; Markov's Principle holds. | Church's Thesis: All functions are recursive (refuted classically). |
  | **Bishop** | Constructive = Algorithmic; informal set theory. | Step function is not false, just *undefined* at 0. |
  | **Martin-Löf** | Propositions as Types; proof objects are central. | Equality is not always decidable; heavy formal overhead. |

  ***

  ### STRUCTURAL NOTES (For the Group)

  *   **Empty/Incoherent Nodes:** Q8=YES combined with Q3=NO is incoherent. If you reject LEM (Q3), you cannot assert the step function is total (Q8) without contradicting the constructive continuity principles implied by Q3=NO.
  *   **Indistinguishable Leaves:** This tree separates **Brouwer** from **Bishop** via **Q6 (Lawless Reals)**, not via the Step Function (Q8). Both answer Q8=NO. Brouwer says the function *cannot exist* (Continuity Theorem); Bishop says it is *not defined* on all $\mathbb{R}$. The mathematical outcome is identical; the philosophical justification differs.
  *   **The "Shallow" Branch:** This splits off the Classical track at Q4. It costs you a unified notion of truth: you assert $P \lor \neg P$ is true (Q3) but refuse to use it to prove existence (Q4).
  *   **Predicativism vs Finitism:** Q2 separates them. Finitists reject the totality of $\mathbb{N}$; Predicativists accept $\mathbb{N}$ but reject impredicative definitions over it.

