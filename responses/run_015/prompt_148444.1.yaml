answer: |-
  ### The Replacement Sorter

  **Instructions:** Answer each scenario as it happens to you. Do not answer for "people in general." Answer for the one signing the consent form.

  **1. The Tempo Drift**
  The synthetic neurons process signals at 90% of biological speed. By the final replacement, your thoughts take ten percent longer to form. You finish sentences later. You react slower. The output is identical, but the rhythm has dragged.
  *   A. I am still the one who started. The song is the same, just played slower.
  *   B. I am a different one. The rhythm is part of the music; change the tempo, change the player.
  *   C. "I" am just a label for whichever body is speaking at that moment.

  **2. The Dark Switch**
  Your replacement parts are installed inert. For six months, you run on a mix of old and new, but the new ones are off. At the end, the surgeon flips a master switch. All synthetic parts activate simultaneously.
  *   A. I survive. As long as the structure holds, the power state doesn't matter.
  *   B. I die. There was a gap where nothing was thinking. The lights went out.
  *   C. It doesn't matter if I survive; what matters is if my family gets the insurance payout.

  **3. The Deep Sleep**
  The swap is done in one session under deep cooling. You feel nothing. You close your eyes on Tuesday, open them on Friday. All neurons are now synthetic.
  *   A. I woke up. It's like any other surgery.
  *   B. The one who woke up is a copy. The one who went under didn't come back.
  *   C. The question assumes a "me" that travels through time. That's a grammar error.

  **4. The Leftovers**
  Your biological neurons are removed, kept alive in a vat, and grown into a second brain in a cloned body. It wakes up. It remembers signing the form. You (synthetic) are also awake.
  *   A. I am the synthetic one. The biological one is a shell with old data.
  *   B. I am the biological one. The synthetic one is a tool I built.
  *   C. We are both me, until one of us dies.
  *   D. There is no fact of the matter about which one is "me."

  **5. The Split**
  At the 50% mark, the pattern of your brain is copied. Two bodies are prepared. Both are woken up. Both claim to be you. One is immediately painlessly destroyed.
  *   A. I survive. The destruction is just a risky surgery I walked away from.
  *   B. I die. You cannot kill half of a person and call the rest the same one.
  *   C. I survive only if the copy is never turned on. Uniqueness is required.

  **6. Natural Decay**
  A biological neuron dies of old age. A synthetic scaffold replaces it to keep you alive. This happens one by one over a lifetime, not in a scheduled procedure.
  *   A. This is me staying alive. Repair is not replacement.
  *   B. This is me slowly dying. Every replacement is a small death.
  *   C. "Staying alive" is just a social convention for "not being legally dead."

  **7. The Gap**
  During the swap, a software error wipes your memory of the last five years. It is restored from a backup. You remember the events, but you don't remember *experiencing* them until the restore.
  *   A. I am continuous. The data was preserved; the access was delayed.
  *   B. I am broken. The chain of experience was severed.
  *   C. Memory is just a record. The record holder is the same regardless of gaps.

  **8. The Will**
  You must decide who inherits your house: the one who wakes up from the procedure, or your biological next-of-kin.
  *   A. The one who wakes up. They have my plans and my obligations.
  *   B. My next-of-kin. The one who wakes up is a new entity with my assets.
  *   C. Whoever the court says. The metaphysics shouldn't dictate the property law.

  **9. The Pain**
  During the swap, a synthetic nerve misfires. The body flinches. No subjective report of pain is possible during the cooling, but the withdrawal reflex occurs.
  *   A. If the system reacts to damage, it feels the harm.
  *   B. Without a biological substrate, "harm" is just mechanical breakage.
  *   C. Pain is a private event. If no one reports it, we can't know, so stop asking.

  **10. The Reverse**
  (Replaced by **The Anchor**): The procedure stops at 99%. One single biological neuron remains. It is the only organic part left.
  *   A. I am still here. That one neuron anchors the whole history.
  *   B. I am gone. 99% replacement is total replacement.
  *   C. The percentage is arbitrary. The cutoff is drawn by lawyers, not nature.

  **11. The Crime**
  The synthetic version commits a fraud three days after the swap. Who goes to prison?
  *   A. The synthetic one. They executed the intent.
  *   B. No one. The person who planned it is dead.
  *   C. The biological estate. Punishment is a cost assigned to the account holder.

  **12. The Final Question**
  After the last neuron is swapped, you are asked: "Did you survive?"
  *   A. Yes.
  *   B. No.
  *   C. That sentence has no truth value.

  ***

  ### Scoring Key

  Tag each answer with the following codes. Tally the totals. The highest score determines your Leaf.

  *   **A1, A2, A4, A5, A6, A7, A8, A9, A10, A11:** `[FUNC]` (Function/Pattern)
  *   **B1, B2, B4, B5, B6, B7, B9, B10:** `[MAT]` (Material/Biology)
  *   **C3, C4, C9, C12:** `[VOID]` (Deflationary/Category Error)
  *   **B5, C5:** `[UNIQ]` (No-Branching Clause)
  *   **C2, C6, C8, C10, C11:** `[PRAG]` (Pragmatic/Legal)
  *   **B7:** `[NARR]` (Narrative/Experience Continuity)

  **Leaf Assignment Rules:**

  1.  **The Circuit (Substrate-Independent Functionalism):** Highest `[FUNC]`. *Constraint:* `[UNIQ]` must be 0.
      *   *Awkward Commitment:* You must accept that two copies of you existing simultaneously are both you, even if they diverge.
  2.  **The Circuit (Unique) (Functionalism + No-Branching):** Highest `[FUNC]` *and* highest `[UNIQ]`.
      *   *Awkward Commitment:* You survive the swap, but if a backup is made and deleted, you have died.
  3.  **The Organism (Biological):** Highest `[MAT]`.
      *   *Awkward Commitment:* You must accept that replacing a single neuron naturally is "life," but replacing it surgically is "death."
  4.  **The Story (Psychological Continuity):** Highest `[NARR]` *or* (`[FUNC]` > `[MAT]` *and* B7 selected).
      *   *Awkward Commitment:* You survive memory loss if the character remains, but die if the stream of experience is interrupted, even if the brain is intact.
  5.  **The Worm (4D/Deflationary Merge):** Highest `[VOID]`.
      *   *Awkward Commitment:* You must treat "survival" as a linguistic convenience rather than a fact about the world, rendering moral stakes ambiguous.
  6.  **The Proxy (Pragmatism):** Highest `[PRAG]`.
      *   *Awkward Commitment:* You accept that you might be dead metaphysically but alive legally, and you are fine with paying taxes on a corpse.

  **Tie-Breakers:**
  *   If `[VOID]` and `[PRAG]` tie: **The Proxy**. (Action overrides skepticism).
  *   If `[FUNC]` and `[MAT]` tie: **The Organism**. (Biology defaults to caution).
  *   If `[UNIQ]` is high but `[FUNC]` is low: **The Story**. (Uniqueness implies a narrative thread).

  ***

  ### Unoccupied Logical Space

  1.  **Materialism with Branching:** The view that biological matter is essential, *but* if you copy the biology into two bodies, both are you. (Incoherent: If matter is essential, the second copy lacks the original matter).
  2.  **Functionalism with Pain-Exemption:** The view that the synthetic brain is you for memory and law, *but* cannot feel pain. (Unattractive: Creates a class of beings that can be tortured without "victimhood").
  3.  **The 99% Threshold:** The view that you survive up to 99% replacement, but the final neuron kills you. (Untried: Biologically arbitrary, but logically possible as a "Ship of Theseus" cliff).
  4.  **Reverse-Survival:** The view that you die going Meat→Synthetic, but survive Synthetic→Meat. (Incoherent: Implies directionality of time matters for ontology, not just state).

  ***

  ### Case Notes & Merges

  **Merged Leaves:** I merged **4D Temporal Parts** and **Deflationary No-Fact**.
  *Reason:* In a binary choice instrument, these positions manifest identically: the user rejects the premise of the survival question. Distinguishing "I am a spacetime worm" from "There is no deep fact" requires metaphysical exegesis that breaks the flow of a click-through. Both lead to the same practical output: "Stop asking."

  **Cut Case:** I cut **Case 5 (Reverse Procedure)**.
  *Reason:* It tests substrate dependence, which Case 2 (Inert Switch) already covers more sharply. Case 2 isolates the "active computation" variable without the noise of swapping materials back and forth.

  **Added Case:** I added **Case 6 (Natural Decay)**.
  *Reason:* This is the only way to stress-test the **Organism** leaf. A biological organismist must explain why natural replacement is "life" while surgical replacement is "death." Without this, the Organism view looks like simple Luddism rather than a theory of biological continuity.

  ***

  ### Commitment

  If I took the procedure, I would land on **The Circuit (Unique)**. I believe the pattern is the person, but I cannot shake the intuition that branching dilutes the "mine-ness" of future experience to the point of zero. I would sign the consent form only if the protocol guaranteed no backups.

  The question I trust least is **Question 10 (The Anchor)**. It invites a magical thinking response (the "one neuron" anchor) that even committed Biological Organismists might reject under pressure. It risks sorting a Materialist into the Pragmatist leaf if they recognize the arbitrariness, muddying the data.
