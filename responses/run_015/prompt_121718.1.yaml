answer: |-
  Hey, I hear you on the exhaustion of trying to parse signal from noise in real time, and honestly relying on gut feeling is a recipe for burnout or bias so here is the procedure you asked for turned into a workflow you can run in fifteen minutes flat. You start with structural coherence which is the easiest gate to clear because it is purely mechanical. You take their argument and map the premises to the conclusion looking for hidden equivocation where a word changes meaning halfway through or a non-sequitur where the conclusion does not follow from the stated premises. If the argument collapses under its own weight because the terms are shifting or the logic is broken you stop immediately and mark it as bad faith or incompetence because a good-faith actor should be able to state their case without internal contradiction. If it passes that you move to evidential reciprocity which is where most people fail. You need to check if the speaker is holding others to the same standards they accept for themselves specifically regarding burden of proof and uncertainty thresholds. If they demand absolute certainty from opponents but accept probabilistic models for their own side or if they dismiss conflicting data as flawed while accepting supporting data without scrutiny then you stop and mark it as bad faith because this is special pleading disguised as rigor. If they pass both of those you run the reversal check which is the stress test. You take their premises and apply them to a conclusion they explicitly reject to see if the logic still holds. If their premises only support their desired conclusion and collapse when applied to a view they oppose then you stop and mark it as bad faith because the premises are just post-hoc rationalizations.

  However there are points where this procedure will misfire and you need to know them before you file. It will misfire if the person has genuinely updated their views based on new evidence because what looks like inconsistency might be intellectual growth and it will also misfire if the context has shifted significantly enough to warrant different standards such as emergency powers versus routine policy. This is where you must hand the call to your editor because if an argument passes all three gates but you still feel something is off it is likely a values conflict rather than a facts or logic problem. You cannot audit values with this tool only the consistency of their application so if the premises hold and the standards are reciprocal but the conclusion differs due to weighting of competing goods like liberty versus safety that is an editorial judgment on framing not a determination of bad faith. Now let us apply this to your three cases starting with the climate researcher backing carbon pricing for healthcare but calling it unfair for climate policy using the same economic model. This fails at gate two on evidential reciprocity because they are using the same model to prove fairness in one context and unfairness in another without explaining why the economic mechanism behaves differently in the two sectors. Since the tool is identical the standard of evaluation should be identical so you can flag this as bad faith rhetoric without needing editor input because the inconsistency is in the application of the evidence not the values.

  The biotech lobbyist dismissing gene-drive risks with uncertainty thresholds he ignored when pushing GM crops is also a clear fail at gate two. He is moving the goalposts on what counts as sufficient safety data depending on whether he is selling the technology or regulating the competition. This is textbook special pleading where the burden of proof shifts to suit the desired outcome so you stop there and classify it as bad faith because no amount of values auditing can fix a broken standard of evidence. The third case is the one that will annoy you because it lands in the handoff zone. The science writer opposing vaccine mandates on autonomy grounds despite having defended mandatory seatbelt laws with identical logic looks like hypocrisy but the procedure might not settle it cleanly. If you run the reversal check you might find they argue that seatbelts are behavioral regulation while vaccines are bodily integrity which creates a structural distinction that passes gate one. If they apply high autonomy standards to both but weigh safety differently you might pass gate two. This forces you to hand it to the editor because the procedure cannot settle whether bodily integrity is fundamentally different from traffic safety regulation. It looks like bad faith because the logic feels identical but if they maintain that distinction consistently it becomes a values conflict about where the line of state power lies. This is annoying because you want a clear verdict on the hypocrisy but the tool tells you it is a philosophical disagreement requiring editorial judgment on whether that distinction is valid in your publication's context. Ultimately the procedure cannot settle whether a values distinction is principled or just a convenient excuse and that is where your fifteen minutes end and your editor's job begins.
