answer: |-
  **Final Examination: Philosophy of Mind**
  **Module Code: PHIL3042**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Functionalism individuates mental states by their causal-functional roles, whilst multiple realizability asserts these roles may be instantiated in physically diverse substrates. However, specifying these roles with sufficient precision to exclude pathological realisers—systems replicating macro-level input-output patterns without appropriate micro-level causal coherence—appears to require fixing a privileged level of functional abstraction.

  Evaluate whether a functionalist can consistently maintain this position without either smuggling in substrate-dependent constraints, thereby undermining multiple realizability, or rendering the functional description so abstract that it loses empirical content and cannot distinguish genuine cognition from sophisticated simulation. In your answer, address whether appeals to 'normal realisation conditions' resolve this tension or merely conceal it.

  ***

  **Model Answer**

  The central challenge for functionalism lies not merely in asserting that mental states are multiply realisable, but in defining the functional roles themselves without collapsing into substrate-dependence or vacuity. This is the level-individuation problem. To sustain functionalism, one must specify causal roles precisely enough to exclude pathological realisers, such as look-up tables or homunculi-headed simulations, which mimic input-output relations without genuine internal causal coherence. However, if one specifies the micro-structural details of the causal chain to exclude these pathologies, one risks fixing the physical substrate, thereby negating multiple realizability. Conversely, if one describes the roles at a highly abstract computational level to preserve multiple realizability, one risks including systems that lack genuine mentality despite matching behavioural profiles.

  Consider the first horn of the dilemma: substrate dependence. If a functionalist argues that pain requires specific neurochemical firing patterns or specific logical gate architectures to ensure causal coherence, they effectively rule out silicon-based or alien biology realisations. This collapses functionalism into a form of identity theory or neuro-chauvinism. The functional role becomes inextricably tied to the physical medium implementing it. If the definition of the role requires 'neuronal inhibition' rather than a generic 'inhibitory signal', the claim that mental states are defined by roles rather than stuff is undermined. The functional description ceases to be autonomous from the physical implementation.

  Consider the second horn: loss of empirical content. If the functionalist abstracts away from the micro-structure to preserve multiple realizability, defining states solely by their relation to sensory inputs and behavioural outputs, they invite the problem of pathological realisers. A giant look-up table could map every possible input to the correct output without possessing internal states that causally mediate the transition. Similarly, a system simulating a mind via a programme running on a lookup table behaves identically to a cogniser but lacks the causal dynamics requisite for mentality. If functionalism cannot distinguish between a system that processes information via causal transitions and one that merely retrieves pre-calculated responses, the functional description loses its explanatory power. It becomes a behaviourism in disguise, failing to capture the internal mechanistic reality of the mind.

  A common reply is to invoke 'normal realisation conditions'. The functionalist might argue that mental states are defined by their roles only when realised under normal conditions for that species or system type. However, this appeal risks circularity. To define 'normal conditions', one must presumably refer to systems that actually possess the mental states in question. If we say a state is pain only if realised in a system functioning normally, and 'functioning normally' means 'producing genuine mental states', we have not explained what constitutes the mental state; we have merely presupposed it. This moves the goalposts without resolving the level-individuation problem. It fails to provide a non-arbitrary criterion for distinguishing the privileged level of abstraction required to exclude pathologies while retaining multiple realizability.

  A more robust resolution involves supplementing standard causal-role functionalism with a teleological constraint. On this view, functional roles are individuated not merely by current causal powers, but by the historical or evolutionary function of the system. A state is pain because it plays a role that was selected for its contribution to survival, regardless of the substrate. This fixes the level of abstraction without substrate bias. A look-up table lacks the appropriate evolutionary history or teleological function; it was not designed or selected to mediate damage avoidance via internal causal processing, but merely to mimic output. This allows the functionalist to exclude pathological realisers without specifying the physical medium. The level of abstraction is fixed by the *purpose* of the system, not its physical composition.

  This resolution impacts both type and token functionalism. For type functionalism, which identifies mental types with functional types, the teleological constraint ensures that the type is defined by its selected function, allowing diverse physical tokens to instantiate the same type provided they serve that function. For token functionalism, which identifies mental states with specific causal roles in specific instances, the constraint ensures that the specific causal role is not accidental. A random physical fluctuation causing a wince is not pain, even if it matches the causal role, because it lacks the teleological grounding. Thus, the level-individuation problem threatens both variants unless supplemented by normative or historical constraints.

  Furthermore, it is crucial to avoid the misconception that multiple realizability entails that any physically different system with identical behavioural outputs necessarily possesses the same mental states. Multiple realizability claims that the *same* mental state can be realised in different substrates, not that identical outputs guarantee identical states. A simulation of a storm is not wet; similarly, a simulation of pain behaviour is not necessarily pain. The functionalist must maintain that the internal causal organization, not just the output, is constitutive of the mental state. The teleological supplement secures this by demanding the right kind of causal history, distinguishing genuine cognition from sophisticated simulation.

  In conclusion, standard functionalism faces a severe dilemma regarding the level of individuation. Appealing to normal conditions fails due to circularity. However, by integrating a teleological constraint, the functionalist can fix the level of abstraction based on systemic function rather than physical composition. This preserves multiple realizability while excluding pathological realisers. While this moves functionalism away from pure causal-role analysis, it succeeds in maintaining the core insight that mentality is defined by what a system does and why, rather than what it is made of.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Diagnosis of the Individuation Dilemma (4 marks)**
  *   **A-Range (3-4 marks):** Explicitly identifies the tension as a problem of *individuation* levels. Explains that specifying roles too precisely threatens multiple realizability, whilst specifying them too abstractly threatens empirical content (including pathological realisers).
  *   **B-Range (1-2 marks):** Describes functionalism and multiple realizability separately but fails to articulate the structural tension regarding the *level of abstraction*. Treats the prompt as a general request to define functionalism.
  *   **Typical Error:** Merely summarising Putnam's brain-in-a-vat or Fodor's language of thought without addressing the level-individuation constraint.

  **2. Engagement with the Circularity Worry (4 marks)**
  *   **A-Range (3-4 marks):** Explains *why* appeals to 'normal realisation conditions' are circular (i.e., defining normality presupposes the presence of the mental state). Argues that this fails to resolve the difficulty.
  *   **B-Range (1-2 marks):** Mentions that 'normal conditions' might be circular but does not explain the mechanism of the circularity. Accepts the reply too readily without critique.
  *   **Typical Error:** Naming the circularity objection in passing but concluding that 'normal conditions' successfully solve the problem without further argument.

  **3. Substantive Argued Resolution (4 marks)**
  *   **A-Range (3-4 marks):** Defends a specific resolution (e.g., teleological functionalism, homeostatic property clusters, or pragmatic level-fixing) and evaluates its success. Clearly states whether the resolution succeeds or fails.
  *   **B-Range (1-2 marks):** Suggests that the issue requires "further empirical investigation" or remains agnostic. Offers a resolution but fails to evaluate its efficacy against the dilemma.
  *   **Typical Error:** Concluding that neuroscience will eventually solve the philosophical problem of individuation levels.

  **4. Application to Token and Type Functionalism (4 marks)**
  *   **A-Range (3-4 marks):** Demonstrates how the level-individuation problem affects both token and type functionalism distinctively. Shows how the proposed resolution applies to both.
  *   **B-Range (1-2 marks):** Discusses functionalism generally without distinguishing between token and type variants. Addresses only one variant.
  *   **Typical Error:** Assuming the problem applies only to type-identity theories or conflating token physicalism with token functionalism.

  **5. Conceptual Precision regarding Multiple Realizability (4 marks)**
  *   **A-Range (3-4 marks):** Explicitly avoids the misconception that identical behavioural outputs guarantee identical mental states. Distinguishes between simulation and genuine realisation based on internal causal/teleological structure.
  *   **B-Range (1-2 marks):** Implies that perfect behavioural mimicry is sufficient for mental state ascription. Confuses multiple realizability with behavioural equivalence.
  *   **Typical Error:** Arguing that if a robot acts exactly like a human, it must have the same mental states simply because of multiple realizability.
