answer: |-
  # Session Plan: The Truth Budget

  ## 1. Materials List

  **For the Instructor:**
  *   **Whiteboard & Markers:** For tracking group scores and displaying the "Revenge Cards."
  *   **Master Score Sheet:** To track penalties/bonuses publicly.
  *   **The "Revenge Deck" (Pre-printed Slips):** 3 specific cards to deploy based on student responses (see *Instructor Guide* below).
  *   **Timer:** Visible to the class.

  **For Each Group (4 Students per group, 4 Groups total):**
  *   **Deck of 10 Index Cards:** Pre-printed with the "Initial Board" sentences (see below).
  *   **Status Stickers or Markers:** 4 colors or symbols representing `T` (True), `F` (False), `G` (Gap/Neither), `B` (Both/Glut).
  *   **Score Sheet:** A grid listing Card IDs 1–10, columns for Assigned Status, Contradiction Check, and Running Total.
  *   **Rule Submission Form:** A slip of paper for stating their general repair rule.

  **The Initial Board (Printed on Cards):**
  1.  **Liar:** "Card 1 is F."
  2.  **Truthteller:** "Card 2 is T."
  3.  **Cycle A:** "Card 4 is F."
  4.  **Cycle B:** "Card 3 is T."
  5.  **Accuser:** "Card 1 is T."
  6.  **Simple Truth:** "Snow is white." (Assume T for context).
  7.  **Simple False:** "Grass is red." (Assume F for context).
  8.  **Conjunction:** "Card 6 is T and Card 7 is F."
  9.  **Disjunction:** "Card 1 is T or Card 6 is T."
  10. **Wildcard:** "Card 10 is G." (Introduces the Gap vocabulary early).

  ## 2. Rules and Scoring Scheme

  **Objective:** Minimize your group's **Total Cost**.

  **Vocabulary:**
  You may assign exactly one status to each card from the following set:
  *   `T` (True)
  *   `F` (False)
  *   `G` (Gap/Neither True nor False)
  *   `B` (Both True and False)
  *   `__` (Blank/Unassigned)

  **Scoring Rules (The Budget):**
  1.  **Disquotation Penalty (-10 pts):** If Card *i* says "Card *j* is [Status S]" and you assign Card *j* a status *other than* S, pay 10 points. (Note: `G` and `B` count as distinct statuses from `T` and `F`).
  2.  **Blank Penalty (-20 pts):** If you leave a card `__` (Blank), pay 20 points.
  3.  **Transparency Tax (-5 pts):** For every card assigned `G` or `B`, pay 5 points.
  4.  **Classical Bonus (+2 pts):** For every card assigned `T` or `F`, gain 2 points.

  **The Repair-and-Revenge Loop:**
  After Round 1 scoring, your group must submit a **General Repair Rule**.
  *   **Form:** "Any card that [Condition] must be assigned [Status]."
  *   **Constraint:** You must use only the fixed vocabulary (`T`, `F`, `G`, `B`, `__`, "Card ID", "Self").
  *   **Consequence:** The Instructor will generate a **Revenge Card** that satisfies your condition but exploits your status assignment. This card is added to the board for Round 2.

  ## 3. Minute-by-Minute Timeline (110 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–15** | **Setup** | Distribute materials. Read rules *only*. No lecture on paradox. Groups arrange cards on tables. |
  | **15–45** | **Round 1** | Groups assign statuses to Cards 1–10. Calculate scores. Instructor circulates, enforcing scoring rules strictly. |
  | **45–55** | **Repair** | Groups submit their **General Repair Rule**. Instructor reviews and selects the appropriate **Revenge Card** from the deck (or writes one using the algorithm). |
  | **55–75** | **Round 2** | Groups integrate the new Revenge Card. Re-calculate scores. They will find their cost has risen or their rule creates a new contradiction. |
  | **75–100** | **Debrief** | Instructor maps game mechanics to the three families of response (Hierarchy, Gaps, Paraconsistency). |
  | **100–110** | **Limits** | Instructor explains what the game *cannot* show (mathematical consistency, transfinite hierarchy). Q&A. |

  ## 4. Instructor Guide: The Revenge Mechanism

  You need to generate the Revenge Card mechanically based on their Rule Submission.

  **The Algorithm:**
  1.  Identify the **Status** (`S`) they assigned to the problematic card (usually Card 1).
  2.  Identify the **Condition** (`C`) they used to justify it (e.g., "Self-referential", "Paradoxical", "Ungrounded").
  3.  **Write Card 11:** "This Card satisfies `C` and is not `S`."

  **Fallback Cards (Pre-print these to save time if they stall):**

  *   **If they choose Hierarchy/Exclusion (Status = `__`):**
      *   *Their Rule:* "Self-referential cards are meaningless/Blank."
      *   *Your Card 11:* "This Card is Blank."
      *   *The Trap:* If they leave it Blank, the card is accurate (True), so it shouldn't be Blank. If they mark it T, it contradicts its own text (which says it is Blank).
  *   **If they choose Gaps (Status = `G`):**
      *   *Their Rule:* "Paradoxical cards are Gaps."
      *   *Your Card 11:* "This Card is not T." (The Strengthened Liar).
      *   *The Trap:* If they mark `G`, the card says "I am not T". Since `G` is not `T`, the card is accurate. If it is accurate, shouldn't it be `T`? If they mark `T`, it contradicts.
  *   **If they choose Paraconsistency (Status = `B`):**
      *   *Their Rule:* "Paradoxical cards are Both."
      *   *Your Card 11:* "This Card is only B."
      *   *The Trap:* If they mark `B`, the card says "I am *only* B". If `B` implies T and F, does "only B" exclude T? This forces them to refine the logic of `B`.
  *   **If they Ban Self-Reference (Condition = "Refers to Self"):**
      *   *Their Rule:* "Cards referring to themselves are Invalid."
      *   *Your Card 11:* "Card 12 says I am False." (You write Card 12 simultaneously).
      *   *The Trap:* Indirect reference. Card 11 doesn't refer to itself; it refers to 12, which refers to 11. The condition "Refers to Self" is not met, so their rule doesn't apply, but the paradox remains.

  ## 5. Debrief Script (25 Minutes)

  **Part 1: The Costs (10 mins)**
  *   **Ask:** "Which scoring penalty hurt the most?"
  *   **Map to Theory:**
      *   **The Blank Penalty (-20):** This is the cost of the **Hierarchical Response (Tarski)**. To avoid contradiction, you must declare certain sentences "meaningless" or outside the language. The cost is *Expressive Power*. You cannot say "This sentence is meaningless" within the language without triggering the Blank Penalty (Revenge).
      *   **The Transparency Tax (-5):** This is the cost of **Gap (Kripke) or Paraconsistent (Priest) Responses**. You keep the sentence in the language, but you pay a logical tax. You must adopt a non-classical logic. The cost is *Simplicity/Classical Inference*.
      *   **The Disquotation Penalty (-10):** This is the cost of **Classical Logic**. If you want to keep `T` and `F` only, you must accept contradictions or leave things blank.

  **Part 2: The Revenge (10 mins)**
  *   **Ask:** "Did your Repair Rule solve the problem, or just move it?"
  *   **Point:** "You felt the **Revenge Problem**. Every time you defined a category (like 'Gap' or 'Meaningless'), I wrote a card that asked to be in that category but claimed it didn't belong there."
  *   **Map to Theory:**
      *   **Hierarchy:** Revenge shows you need a *new* hierarchy level for every new rule. (Transfinite hierarchy).
      *   **Gaps:** The 'Strengthened Liar' ('This is not True') cannot be a Gap without becoming True.
      *   **Paraconsistency:** You must block the inference from 'True and False' to 'Everything is True' (Explosion).

  **Part 3: The Vocabulary (5 mins)**
  *   **Point:** "You were restricted to `T, F, G, B`. In real logic, defining `G` and `B` requires redefining 'and', 'or', and 'not'."
  *   **Takeaway:** "The game made truth look like a budget. In reality, it's about the structure of logic itself. You aren't just paying points; you are changing the rules of inference for *all* mathematics."

  ## 6. Predictable Failure Modes & Handling

  **1. The "Tear It Up" Group (Refusal to Generalize)**
  *   *Behavior:* "We just leave Card 1 blank. We don't need a rule."
  *   *Handling:* "The scoring sheet requires a General Repair Rule to validate Round 2. If you cannot state the rule, you cannot play Round 2. You fail the seminar." (Say this lightly).
  *   *Pedagogical Value:* **Encourage this briefly.** Let them feel the frustration. Then ask: "If I give you Card 100 that looks exactly like Card 1, what do you do?" Force them to articulate the universal claim. This mirrors the philosophical necessity of general principles.

  **2. The "Meta-Language" Group**
  *   *Behavior:* "The card is nonsense. It's not a proposition."
  *   *Handling:* " 'Nonsense' is not a status on the sheet. You must map 'Nonsense' to `__`, `G`, or `F`. Which one?"
  *   *Pedagogical Value:* This is the **Hierarchy Move**. Force them to commit to `__` (Blank). Then hit them with the "This Card is Blank" Revenge Card. This demonstrates that calling it "nonsense" is itself a truth-claim subject to paradox.

  **3. The "Scoring Paradox" Group**
  *   *Behavior:* "Your scoring rules are contradictory. If I mark T, I lose points. If I mark F, I lose points."
  *   *Handling:* "Exactly. That is the Liar Paradox. You are feeling the inconsistency in the system."
  *   *Pedagogical Value:* **Encourage this.** This is the core insight. The game *is* the paradox. Acknowledge that the scoring system itself is a "Truth Theory" that is currently inconsistent.

  ## 7. Closing Note on Limits (What the Game Cannot Show)

  *Be frank in the final 5 minutes.*

  "This game teaches the *phenomenology* of the paradox, but it lies about the *solutions*."

  1.  **It implies Pragmatism:** The game suggests we choose a theory based on 'cost' (points). In reality, we choose based on mathematical consistency and metaphysical commitment. A theory isn't 'better' because it's cheaper; it's better because it works.
  2.  **It hides the Transfinite:** The Hierarchical response (Tarski) works mathematically, but it requires infinite levels of language. The game only gave you two rounds. You didn't feel the stability of the hierarchy, only the annoyance of the revenge.
  3.  **It simplifies Logic:** Marking `B` (Both) cost you 5 points. In Paraconsistent Logic, marking `B` costs you *Disjunctive Syllogism*. You can no longer infer `Q` from `P or Q` and `not-P`. That is a much heavier price than 5 points; it changes how you do calculus and physics. The game cannot display that global damage.
  4.  **It omits Existence Proofs:** Kripke's Fixed Point theory proves mathematically that a consistent assignment *exists*. The game made you feel it was impossible. That is a feeling, not a proof.

  **Final Instruction:** "Next lecture, we will do the math the game skipped. We will see why the costs you paid here are actually theorems there."
