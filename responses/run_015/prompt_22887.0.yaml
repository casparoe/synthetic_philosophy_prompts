          *   *Thought Theory (Yaniv):* Stronger fit. We respond to the *concept* of the agent.
          *   *Kieran/Cognitive Theory:* Emotions track values. The value (connection) is real, even if the partner isn't.
      *   **Section 3: The "Knowing" Problem:** Explicitly answer whether knowledge makes it fake. (No, PoF proves knowledge doesn't stop emotion).
