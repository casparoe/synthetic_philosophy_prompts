      *   *Check:* The Rollback question.
      *   *Correction:* Focus on the "Center of Narrative Gravity." If the narrative can be edited externally, the gravity center is fake.

  7.  **Final Polish:** Check against constraints (no bibliography, clear flagging of extrapolation). Ensure the "picky philosopher" persona comes through. (e.g., "Here is where the summary gets lazy," "This is where I'm stepping beyond the text.")

  8.  *(Self-Correction on the Essay Reference)*: The prompt mentions a "late essay about counterfeit people." Dennett wrote "Artificial Consciousness: What's the Problem?" and contributed to discussions on AI ethics near the end of his life (he died in 2024). The specific term "counterfeit people" appears in his later public interventions (e.g., Project Hieroglyph, or interviews around *From Bacteria to Bach and Back* and subsequent papers). I will treat the *ideas* as consistent with his mature philosophy even if the specific "essay" title is a bit loose in the prompt (it likely refers to his general late-career stance on AI ethics). I won't nitpick the citation, but I will nitpick the philosophy.

