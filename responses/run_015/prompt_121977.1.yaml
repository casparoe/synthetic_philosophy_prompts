answer: |-
  ### Honest Assessment: The Theoretical Risk

  You asked me to be straight, so here it is: **The "Proximity Paradox" as you defined it (physical closeness reduces information) is theoretically shaky for a democratic legitimacy exam.**

  Here is why: Democratic theory generally separates the *right to rule* (legitimacy) from the *quality of decision-making* (epistemics). Arguing that locals are "less informed" leans toward epistocracy (rule by the knowledgeable) rather than democracy (rule by the affected). Most literature argues the opposite: locals have *more* information but potentially *narrower* interests. If you build a question on the premise that proximity reduces information, strong students might correctly argue that information shouldn't determine voting rights at all.

  **The Fix:** Keep your intuition (presence is a flawed proxy) but drop the "information" claim. Frame it as **"The Presence Proxy Problem."** Presence is used as a shortcut for *subjection* or *stake*, but it fails in both directions (e.g., student visa holders are subject to housing laws but excluded; climate refugees have a stake but are absent). This preserves your partner's situation and the theoretical rigor without conflating legitimacy with knowledge.

  Below are the exam materials based on this corrected framing.

  ***

  ### Essay Question

  **Prompt:**
  Democratic boundaries are often drawn using territorial presence as a proxy for democratic inclusion. However, presence may fail to track either *subjection* (coercion by law) or *stake* (interest in outcomes).

  Critique the reliance on territorial presence by analyzing what I call the "Presence Proxy Problem." Apply this critique to two cases: (1) non-resident stakeholders (e.g., climate refugees affected by a city's carbon budget) and (2) presentist exclusions (e.g., resident non-citizens denied votes in housing referenda).

  Does democratic legitimacy require physical presence, or is presence merely a heuristic for subjection and stake? In your answer, you must clearly distinguish between *subjection* and *stake*, explain where presence fails as a proxy for each, and propose what an alternative tracking mechanism would need to solve to maintain legitimacy without collapsing into boundless inclusion.

  ***

  ### Model Answer

  Territorial presence is the standard heuristic for defining the *demos*, but it is increasingly unstable as a foundation for democratic legitimacy. Presence is often treated as a proxy for two distinct normative claims: the All-Subjected Principle (ASP) and the All-Affected Principle (AAP). However, physical proximity frequently fails to track either accurately, creating zones of exclusion and inclusion that undermine legitimacy.

  To evaluate this, we must distinguish *subjection* from *stake*. Subjection refers to being coercively bound by a decision; you must obey the law regardless of consent. Stake refers to having an interest in the outcome, regardless of legal binding. Presence is assumed to correlate with both, but the correlation is breaking down.

  Consider presentist exclusions, such as student visa holders denied votes in housing referenda. Here, presence is high, but inclusion is denied. These residents are clearly *subjected* to local zoning laws and rent controls; their legal autonomy is constrained by the decision. They also have a direct *stake* in housing availability. Excluding them reveals that presence is not the actual criterion for inclusion; citizenship is. If legitimacy relies on ASP, these residents must be included because they are coerced. If legitimacy relies on AAP, they must be included because their interests are impacted. Using presence as a proxy here fails because administrative status overrides physical reality. Presence tracks their location, but not their political standing.

  Conversely, consider non-resident stakeholders, such as climate refugees affected by a city's carbon budget. Here, presence is low, but the *stake* is existential. A city's emissions policy contributes to global warming that displaces populations abroad. Under AAP, these refugees have a profound interest in the decision. However, they lack presence and are rarely *subjected* to the city's legal coercion in a direct sense. Including them challenges the territorial model. If we grant votes based on stake alone, the *demos* becomes unbounded; everyone is affected by everything. If we require subjection, they are excluded despite the moral urgency.

  This reveals the "Presence Proxy Problem." Presence is merely a heuristic—a rough shortcut—to avoid the administrative nightmare of measuring every individual's stake or subjection. It works well in closed systems but fails in interconnected ones. Legitimacy does not inherently require physical presence; it requires a justification for why power is exercised over specific people.

  Therefore, presence is not a normative requirement but a practical proxy. When it diverges from subjection (as with visa holders), legitimacy is compromised because coercion exists without consent. When it diverges from stake (as with climate refugees), legitimacy is compromised because harm is inflicted without recourse. An alternative tracking mechanism would need to solve the "boundary problem" without becoming infinite. It might require a hybrid model: automatic inclusion for those subject to coercion (residents regardless of visa) and representative trusteeship for those with high stakes but no presence (future generations or distant refugees). Without distinguishing subjection from stake, we cannot diagnose where the boundary fails. Presence masks these distinctions, allowing democracies to claim legitimacy while excluding those they coerce or harm.

  ***

  ### Marking Scheme

  **To achieve an A (Excellent):**
  *   **Conceptual Distinction:** Explicitly and consistently distinguishes *subjection* (coercion/obedience) from *stake* (interest/impact). Does not conflate the two.
  *   **Proxy Critique:** Identifies that presence is a *heuristic* or *proxy*, not a normative principle in itself. Explains *why* it fails in the two specific cases (e.g., presence exists without rights for visa holders; stake exists without presence for refugees).
  *   **Boundary Problem:** Addresses the risk of "boundless inclusion" if stake is the only criterion. Proposes a plausible solution or alternative mechanism (e.g., trusteeship, functional constituencies) rather than just demanding open borders.
  *   **Application:** Uses the visa and climate examples to illustrate the theoretical divergence, not just as descriptive examples.

  **To achieve a B (Good):**
  *   **Conceptual Distinction:** Mentions subjection and stake but may blur the lines between them (e.g., treating "affected" and "subjected" as synonyms).
  *   **Proxy Critique:** Recognizes that presence is imperfect but treats it mostly as a practical issue rather than a legitimacy crisis.
  *   **Boundary Problem:** Notes the issue of unlimited inclusion but offers a vague solution (e.g., "we need better rules").
  *   **Application:** Uses the examples correctly but mostly to illustrate the standard "citizens vs. non-citizens" debate without engaging the deeper proxy failure.

  **To achieve a C (Average):**
  *   **Conceptual Distinction:** Conflates subjection and stake entirely.
  *   **Proxy Critique:** Argues that presence *should* be the only rule, or argues that everyone should vote everywhere without addressing the boundary problem.
  *   **Application:** Describes the visa and climate situations but fails to connect them to democratic theory principles (ASP/AAP).
  *   **Focus:** Focuses on the "information" aspect (the original paradox) rather than legitimacy/subjection, missing the core theoretical pivot.
