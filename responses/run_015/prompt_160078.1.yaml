  8.  **Final Review against User Prompt:** The user is smart. Don't talk down. Use precise terms (paternalism, autonomy, *malum prohibitum*). Ensure the "brother-in-law" hypocrisy charge is addressed implicitly by showing the internal coherence (even if one disagrees with the premises).

