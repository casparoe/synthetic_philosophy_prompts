answer: |-
  This is a sophisticated query that cuts past the surface rhetoric of drug policy into the structural logic of the law. Your brother-in-law's charge of hypocrisy relies on a surface-level contradiction: *How can you forbid the means but tolerate the end?* To answer this, we must reconstruct the implicit moral and legal theories that make these practices coherent to their designers, even if they remain contestable.

  Here is a reconstruction of the implicit theories behind the Portuguese "split package" and the Canadian "regulated market," followed by an analysis of where these practices are philosophically underdetermined.

  ### Part I: The Portuguese "Split Package" (Decriminalisation of Use, Criminalisation of Supply)

  The Portuguese model is not merely a compromise; it rests on a specific moral asymmetry between **self-regarding harm** and **other-regarding harm**.

  #### 1. The Acquisition Gap: The Theory of the "Wrong of Supplying"
  You ask if the practice presupposes something circular: tolerating an act (use) that requires a criminal act (supply) to fulfill.
  *   **The Reconstruction:** The theory here is **Utilitarian Harm Reduction** combined with **Legal Moralism regarding Distribution**. The state accepts that the *act* of consumption is primarily a harm to the self. In liberal legal theory, the state's power to prevent self-harm is limited (the Harm Principle). However, the *act* of supply is viewed as a harm to the *public order*.
  *   **Is it Circular?** It is not logically circular, but it is **instrumentally paradoxical**. The state admits the black market is dangerous (adulterants, violence). However, the theory presupposes that **legalizing supply would increase prevalence more than it would decrease market violence.** The "wrong" of supplying is not that it facilitates a sin, but that it acts as a vector for social contagion.
  *   **Theory of the Wrong:** The practice strictly requires the view that **supplying is a public nuisance offense**, not necessarily a moral evil in itself. It sits well with the idea that unlicensed provision is dangerous (like selling untested electricity), but it does *not* require the view that commerce in harmful goods is inherently immoral (otherwise alcohol/tobacco would be banned). It treats the supplier as a **polluter of the social environment**, whereas the user is treated as a **victim of that environment**.
  *   **Your Distinction:** Your distinction between "prohibiting conduct" and "prohibiting channels" does work here. The state effectively says: *"We cannot stop you from harming yourself (conduct), but we will destroy the infrastructure that makes that harm easy and dangerous (channels)."* The hypocrisy charge fails if you accept that the state has a stronger duty to protect the public from distributors than to protect individuals from themselves.

  #### 2. The Threshold: Appetite as License
  You note the threshold is indexed to the user's habit (e.g., a 10-day supply), meaning a heavier user can legally possess more.
  *   **The Reconstruction:** This presupposes that the law is tracking **Status vs. Intent**. In criminal law, *mens rea* (guilty mind) usually matters. By tying the limit to personal consumption habits, the law treats addiction as a **medical status** rather than a criminal intent.
  *   **What it Tracks:** It tracks the **risk of leakage**. If you have 10 days' supply, the statistical probability you are selling is low. If you have 100 days' supply, the probability you are distributing is high.
  *   **Appetite as License:** You are correct that this treats appetite as a license. Philosophically, this is radical. Usually, the law treats compulsion as an aggravating factor (loss of control). Here, compulsion is a **mitigating factor**. It presupposes that the heavy user is *less* culpable because their agency is more compromised by the substance.
  *   **Alternative Theory:** A theory where gravity increases with dependence would treat addiction as a **moral failure** (you should control yourself). The Portuguese model treats addiction as a **health deficit** (you need help). The threshold is not about how "bad" the possession is, but about distinguishing the "sick" (user) from the "predatory" (trafficker).

  #### 3. The Dissuasion Element: Compulsory Help
  The state refers users to a Commission that can impose sanctions (fines, community service) to press them toward treatment.
  *   **The Reconstruction:** This is **Soft Paternalism**. The state presupposes that the addict's autonomy is temporarily suspended or "hijacked" by the substance. Therefore, coercion is not violating their liberty, but **restoring their future liberty** (health).
  *   **Coherence:** "Compulsory help" is coherent only if you view the state as a **guardian of capacity**. It presupposes the person is not a fully rational agent at the moment of intervention. It is "paternalism minus the criminal record" because the goal is therapeutic compliance, not retributive suffering.
  *   **State Relation:** The state relates to the citizen here as a **doctor to a reluctant patient**, not a warden to a prisoner. The coercive apparatus is used to overcome the "irrationality" of the addiction to restore the citizen to a state where they can make free choices again.

  ---

  ### Part II: The Canadian Contrast (Legalisation and Regulation)

  The Canadian Cannabis Act presupposes a fundamentally different anthropology (view of the human person) and market theory.

  #### 1. View of the Consumer and Choice
  *   **The Reconstruction:** Canada treats the consumer as a **Rational Agent under Conditions of Market Failure**. Unlike Portugal, which sees the drug market as inherently corrupting, Canada sees the *unregulated* market as the problem.
  *   **Choice and Craving:** The combination of legal sale + advertising bans presupposes that **choice is vulnerable to manipulation**. If the consumer were fully rational, advertising bans would be unnecessary (they would choose based on price/quality). If the consumer were fully irrational (as in the Portuguese medical model), legal sale would be unacceptable.
  *   **The Theory:** This is **Libertarian Paternalism** (or "Nudge" theory). The state allows the choice (liberty) but structures the environment to make the "healthy" choice easier (banning glamorization). It treats the buyer as a citizen who must be protected from **predatory commercial speech**, not necessarily from the substance itself.
  *   **Revenue vs. Promotion:** The state taxes the product (acknowledging demand is inelastic) but bans promotion (acknowledging demand can be stimulated artificially). This presupposes that **existing users should be accommodated, but new users should not be recruited.**

  #### 2. Compatibility with the Portuguese Model
  *   **Incompatibility:** They are largely incompatible at the theoretical level.
      *   **Portugal:** Supply is inherently dangerous/illegitimate; Use is a health symptom.
      *   **Canada:** Supply is a commercial activity that must be regulated; Use is a lifestyle choice that carries risk.
  *   **The Divergence:** Portugal seeks to shrink the market by making supply difficult but use safe. Canada seeks to manage the market by making supply safe but marketing difficult. Portugal views the drug as a **pathology**; Canada views it as a **commodity**.

  ---

  ### Part III: Philosophical Underdetermination and Concrete Shifts

  You asked where these practices are "underdetermined"—meaning, where the same practice could be justified by different theories, and what concrete changes would reveal which theory is actually in play.

  #### 1. The Portuguese Model
  *   **Underdetermination:** The "Dissuasion Commission" is underdetermined between **Therapeutic Paternalism** (we help you for your good) and **Social Hygiene** (we move you off the streets for public order). Both look the same administratively.
  *   **Concrete Change to Reveal Theory:**
      *   *If Supply became a Licensing Offence:* If the state allowed licensed pharmacies to supply drugs to registered addicts (like heroin-assisted treatment), the theory shifts from "Supply is a public nuisance" to "Supply is a dangerous commodity." This would resolve the "Acquisition Gap."
      *   *If Possession became Fully Lawful:* If there were no administrative sanctions for possession, the theory shifts from "Soft Paternalism" to "Libertarianism." The state would no longer claim the user needs correction.
      *   *If Sanctions were Removed:* If the Commission could only offer help without the threat of fines/community service, it would confirm the "Therapeutic" view. The current coercive element suggests the state still views the user as partially culpable.

  #### 2. The Canadian Model
  *   **Underdetermination:** The advertising bans are underdetermined between **Protecting Children** and **Protecting the Vulnerable Adult**. Both justify restricting speech, but the moral weight differs.
  *   **Concrete Change to Reveal Theory:**
      *   *If Advertising Matched Alcohol:* If cannabis could be advertised on TV during prime time, the theory shifts to "Consumer Sovereignty." The state would be admitting the risk is negligible or that adults can handle the persuasion.
      *   *If Home Cultivation was Banned:* If the state banned growing your own plants, it would reveal a **Revenue Protection** theory (state wants to tax all supply) rather than a **Safety** theory (home grown is often safer).
      *   *If Potency was Capped:* If the state mandated a maximum THC limit, it would confirm the "Public Health" view (protecting users from themselves). Currently, allowing high potency suggests the "Market Choice" view prevails over safety.

  ### Summary for Your Argument

  To settle your argument with your brother-in-law:

  1.  **It is not hypocrisy;** it is a **division of moral labor.** The Portuguese model distinguishes between the *sinner* (the supplier who profits from harm) and the *victim* (the user who suffers harm). The law punishes the former to protect society and treats the latter to protect the individual.
  2.  **The "Acquisition Gap" is a calculated risk.** The state accepts the danger of the black market as the lesser evil compared to the danger of increased availability that comes with legal supply.
  3.  **The Canadian model is not the same.** Canada treats the drug as a product and the user as a consumer. Portugal treats the drug as a pathogen and the user as a host.

  The "split package" is coherent if you accept that **access to a harm is not the same as the infliction of a harm.** The state can forbid the *sale* of poison without forbidding the *ingestion* of poison, on the theory that stopping the sale reduces the overall ingestion, while punishing the ingestion adds suffering without reducing the supply. That is the principled core underneath the practice.
