  7.  **Final Polish:** Check against all constraints. Did I answer all three Portuguese questions? Did I contrast Canada? Did I identify underdetermination? Did I suggest concrete changes? Ensure the distinction between "reconstructing" and "describing" is maintained (focus on *why* it makes sense internally, not just *what* it is).

