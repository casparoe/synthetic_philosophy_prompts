answer: |-
  Here are ten interview questions designed to explore the nuances of Evidential Decision Theory (EDT) without getting bogged down in the standard Newcomb's Problem setup. Each question includes a summary of the answer your guest is most likely to give, followed by a targeted follow-up to deepen the discussion.

  ### 1. The Core Intuition: News vs. Leverage
  **Question:** "A common shorthand for your view is that we should choose acts that give us the 'best news' about the world, rather than acts that give us the most 'causal leverage' over the world. But for many people, 'making a difference' is the whole point of decision-making. Why should we care about the news value of an action if performing that action doesn't physically change the outcome?"

  *   **Likely Reply:** She will likely argue that "making a difference" is a folk-concept that dissolves under scrutiny. In a deterministic or probabilistic universe, you are part of the causal web; your choice is evidence of the state of the world that produced it. Therefore, maximizing expected utility based on that evidence is the only coherent way to ensure you end up in a good world-state.
  *   **Follow-up:** "If my choice is just evidence of the state of the world that produced it, doesn't that imply a kind of fatalism? If the world is already set up such that my choice is merely a symptom, in what sense am I actually *deciding* anything, rather than just watching a movie of my own life?"

  ### 2. The Smoking Lesion Problem (Required Topic)
  **Question:** "I want to turn to the Smoking Lesion problem. In this case, a genetic lesion causes both the urge to smoke and lung cancer, but smoking itself is harmless. A naive evidential calculation suggests you shouldn't smoke, because smoking is strong evidence you have the lesion. How does your version of EDT handle this case without yielding the counterintuitive advice to 'never smoke'?"

  *   **Likely Reply:** She will likely invoke the "Tickle Defense." She will argue that the agent should condition on their internal mental state (the urge or 'tickle' to smoke) rather than the physical act. If you don't feel the urge, smoking provides no evidence of the lesion, so EDT permits smoking.
  *   **Follow-up:** "This relies heavily on the agent having privileged introspective access to their own urges. But what about cases where we are self-deceived, or where the psychological 'tickle' is subconscious? Does EDT require a level of self-transparency that human agents don't actually possess?"

  ### 3. Causal vs. Evidential Correlations (Required Topic)
  **Question:** "Critics often charge that EDT treats all correlations as equal, whether they are causal or spurious. Does your theory have the resources to distinguish between a causal correlation—like turning a key to start a car—and a merely evidential one, like a barometer falling before a storm? Or does it treat them the same way?"

  *   **Likely Reply:** She will likely argue that the distinction is less metaphysically robust than Causal Decision Theorists claim. She may say that 'causation' is just a label for a specific kind of stable, manipulable evidential relationship, and that EDT captures the relevant probabilities without needing a separate causal primitive.
  *   **Follow-up:** "But if we don't build causation into the theory, aren't we vulnerable to 'magical thinking'? If I see a barometer drop, I know a storm is coming. If I smash the barometer, the storm still comes. If EDT tells me to act based on the probability of the storm given my act, how does it prevent me from thinking smashing the barometer changes the weather?"

  ### 4. The Lesson of Newcomb's Problem (Required Topic)
  **Question:** "We can't avoid Newcomb's Problem entirely, but I want to ask about the moral of the story. When you look at that case, what do you take to be the real lesson? Is it about the predictor's reliability, about the agent's ability to decide freely, or is it telling us something else entirely about the nature of rationality?"

  *   **Likely Reply:** She will likely say the lesson is that "rationality should pay." The point is that the Two-Boxer follows a process that feels intuitively causal but guarantees less money. Therefore, the lesson is that our definition of rationality must be tied to success in outcomes, not just the purity of causal influence.
  *   **Follow-up:** "If rationality is just about 'winning' or getting the money, doesn't that conflate rationality with luck? If I make a terrible decision but a predictor rewards me for being the kind of person who makes that decision, am I rational, or just lucky to be in a world where that trait is rewarded?"

  ### 5. The "Why Ain'cha Rich?" Argument
  **Question:** "EDT proponents often use the 'Why ain'cha rich?' argument against Causal Decision Theory, pointing out that CDT agents lose money in Newcomb scenarios. But isn't it possible to construct 'Newcomb-like' scenarios where the EDT agent loses and the CDT agent wins? If the tables are turned, does your theory lose its advantage?"

  *   **Likely Reply:** She will likely concede that such cases exist (like the Smoking Lesion) but argue they are less common or less structurally significant than Newcomb cases. She might argue that in the real world, correlations between our choices and outcomes are usually evidential, making EDT the more robust heuristic.
  *   **Follow-up:** "If EDT is only superior in a specific subset of decision problems, does that suggest we need a hybrid theory? Or do you think there's a way to show that the cases where EDT 'loses' are actually based on a misunderstanding of the evidence available to the agent?"

  ### 6. Managing the News
  **Question:** "A persistent worry about EDT is that it encourages 'managing the news' rather than managing the world. It seems to suggest I can improve my situation simply by choosing acts that correlate with good outcomes, even if I can't bring those outcomes about. How do you respond to the charge that this is a form of wishful thinking?"

  *   **Likely Reply:** She will likely deny that it is wishful thinking. She will argue that you cannot simply choose to have evidence you don't have. You are constrained by the actual probabilities. EDT doesn't say "believe you are healthy"; it says "do the thing that people who are healthy tend to do," which is often good advice.
  *   **Follow-up:** "But if I know that doing the thing doesn't *cause* the health, why should I do it? It seems like I'm engaging in a ritual. If I know the correlation is non-causal, doesn't the evidential value of the act vanish for me specifically, because I know *why* I'm doing it?"

  ### 7. Agency and Physicalism
  **Question:** "EDT seems to fit well with a physicalist worldview where everything is correlated in a big causal net. But does it leave enough room for human agency? If my actions are just evidence of prior states, do I risk turning the agent into a passive observer of their own decision process?"

  *   **Likely Reply:** She will likely argue that agency is compatible with determinism. Being an agent means being a system that processes information and outputs actions. EDT describes how that system *should* process information to maximize its goals, regardless of whether the output was determined.
  *   **Follow-up:** "If the output is determined, then the 'should' in your previous answer seems to lose its normative force. I can't choose to maximize expected value if my brain chemistry is already set to do otherwise. How do you preserve the 'ought' in decision theory without some room for alternative possibilities?"

  ### 8. Comparison with Functional Decision Theory
  **Question:** "In recent years, Functional Decision Theory (FDT) has emerged as a competitor that also one-boxes in Newcomb but tries to fix EDT's problems with the Smoking Lesion. How does your view stand in relation to FDT? Do you see it as a refinement of EDT or a fundamentally different project?"

  *   **Likely Reply:** She will likely view FDT as an attempt to get EDT's results while using causal-style language. She may argue that FDT is unnecessarily complex or that it smuggles in causal assumptions that EDT handles more elegantly through conditioning.
  *   **Follow-up:** "If FDT is gaining traction because it solves the Smoking Lesion without the 'Tickle Defense,' doesn't that suggest the pure evidential approach has a structural flaw? Why stick with the original formulation if a functionalist update handles the counterexamples more cleanly?"

  ### 9. Practical Application for Students
  **Question:** "For students listening who aren't going to become philosophers, does adopting an evidential mindset change how they live their daily lives? Are there practical domains—like health, finance, or relationships—where thinking like an EDT agent is actually better than thinking like a causal agent?"

  *   **Likely Reply:** She will likely suggest that in social coordination and signaling, EDT is superior. For example, voting, or cooperating in Prisoner's Dilemmas with similar people. She might argue that causal thinking makes us too selfish or isolated in social contexts.
  *   **Follow-up:** "But isn't there a danger of superstition? If a student thinks 'I'm wearing my lucky socks because people who wear them tend to win,' aren't they potentially neglecting actual causal preparation, like studying? How do we keep EDT from becoming a license for magical thinking in everyday life?"

  ### 10. The Future of Decision Theory
  **Question:** "Finally, looking forward: Decision theory seems to be in a bit of a renaissance with all these new variants like FDT and Suppositional Decision Theory. Where do you see the debate going in the next decade? Do you think we are close to a 'correct' theory, or is the pluralism here to stay?"

  *   **Likely Reply:** She will likely predict that the debate will move towards more empirical work, perhaps integrating psychology or AI alignment. She may argue that EDT remains the strongest normative baseline, even if descriptive theories vary.
  *   **Follow-up:** "If AI systems are built using decision theories, and we give them an evidential architecture, could they end up making systematically different choices than causal agents? If so, do we have a responsibility to ensure we aren't building machines that 'manage the news' rather than solving problems?"
