answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Eligibility for Dissolution Vote

  Next month's vote determines whether our community survives or dissolves. Because the outcome alters lives fundamentally, we must resolve who holds the ballot. Our rules specify "members in good standing," but our reality includes three distinct groups: 900 lifetime leaseholders, 600 long-term licence holders, and 200 adjacent neighbours. We face a legal lock: the charter requires unanimity to change voting rights, yet those currently entitled to vote would lose power by expanding the franchise.

  Below is my assessment of the conflicting positions and a concrete path forward.

  **The Case for Leaseholders Only**
  We must acknowledge the strength of the position limiting votes to leaseholders. This is not merely self-interest; it is a argument based on property rights and risk. Leaseholders hold the equity. If the buyout fails, they retain the asset; if it succeeds, they surrender ownership for cash. They bear the financial risk of the co-op's liabilities. Licence holders, by contrast, hold a contractual permission to reside, revocable on six months' notice. Neighbours hold no contractual tie at all.

  From this view, allowing non-owners to vote on the disposal of assets they do not own sets a dangerous precedent. It conflates residency with ownership. If we allow those with no equity stake to decide the fate of the equity, we undermine the legal structure of the co-op itself. This position is clean, legally defensible, and respects the original financial agreement signed by the leaseholders.

  **Recommendation: Leaseholders and Licence Holders**
  Despite the legal clarity of the above, I recommend we extend voting rights to the 600 licence holders, while excluding the neighbours.

  The distinction here is between ownership and residency. While leaseholders own the shares, licence holders constitute the bulk of our actual community. Many have lived here fifteen years. They obey our rules, pay monthly fees, and face eviction if the buyout passes. To exclude them is to treat fifteen years of residence as legally invisible because of a semantic distinction between "lease" and "licence." This creates a moral hazard where the board could dissolve a community without the consent of the majority of its residents.

  Neighbours, however, must be excluded. While they will suffer construction noise, they are external to our governance structure. They do not follow our rules, nor can we evict them. Including them would stretch the definition of "member" beyond breaking point.

  **Solving the Charter Trap**
  This brings us to the charter clause requiring unanimity to change the franchise. If "current members" means leaseholders, they will not vote unanimously to dilute their power. We cannot legally ask them to vote on their own disenfranchisement.

  To resolve this, I recommend we **petition the court for sanctioning of the vote.**

  In dissolution scenarios where a conflict of interest exists between member classes, courts have the authority to oversee the voting process to ensure fairness. We do not attempt to change the charter internally. Instead, we file for court supervision, presenting the argument that licence holders are de facto members given their tenure and reliance on the housing. The court can rule that, for the purpose of this specific dissolution vote, the franchise includes both groups. This bypasses the unanimity clause because the change is not being voted on by the members; it is being ordered by the court to prevent an unjust outcome.

  **Conclusion**
  Limiting the vote to leaseholders is legally safe but morally brittle. Including everyone is impossible. Including leaseholders and licence holders under court supervision balances legal reality with our duty to the people who actually live here. We should instruct counsel to prepare the petition immediately.

  We cannot hide behind ambiguous rules while dismantling homes. Let us ensure the vote is legitimate not just in law, but in the eyes of the people who call this place home.
