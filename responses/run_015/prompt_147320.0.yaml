answer: |-
  You have independently rediscovered one of the most active and contentious debates in modern linguistics and philosophy of language. Your observations are sharp, your data is sound, and your intuition that there is a split between your Group A and Group B is correct.

  You are dealing with **Not-At-Issue Content**. Within that category, your Group A corresponds to **Presuppositions**, and your Group B corresponds largely to **Conventional Implicatures** and **Expressives**.

  Here is the breakdown you requested, structured to help your team operationalize this.

  ### 1. Characterization: What makes these words special?

  You identified three features. Here is the linguistic verdict on which are load-bearing and which need nuance.

  *   **Feature 1 (Not the main claim):** **Load-bearing.** In linguistics, this is called being **"Not-At-Issue."** If you negate the sentence ("He didn't stop smoking"), the main claim is denied, but this "second thing" (that he smoked before) remains intact. This distinguishes it from ordinary literal meaning.
  *   **Feature 2 (Context independence):** **Load-bearing, but with a caveat.** This distinguishes it from *Conversational Implicature* (ordinary suggestions). Ordinary suggestions rely on context and can be cancelled ("I have three children... in fact, four"). Your "second thing" is **Lexically Triggered**. It is hard-wired to the specific word ("stop", "but"). *Caveat:* It can sometimes be "accommodated" (accepted as new info) if the context forces it, but as you noted, it feels like "smuggling" if the reader doesn't already accept it.
  *   **Feature 3 (Projection):** **Load-bearing.** This is the strongest diagnostic. If you put the sentence inside a question ("Did he stop smoking?"), a conditional ("If he stops smoking..."), or a negation ("He didn't stop"), the "second thing" projects out of that embedding. It survives.

  **The Characterization for your team:**
  A word carries this "second layer" if it triggers a commitment that **(1) survives negation/questions**, **(2) cannot be cancelled without contradiction**, and **(3) is not the main point being argued.**

  ### 2. Verdict on Your Two Groups

  Your split is real. You have gerrymandered nothing; you have identified a fundamental fault line in semantics.

  **Group A: Presupposition Triggers**
  *   **Words:** *Regret, realize, stop, again, too, still.*
  *   **Mechanism:** These words require a certain state of affairs to be **already true** for the sentence to make sense.
      *   "Stop" requires that the action was happening before.
      *   "Regret" requires that the event happened (factive verb).
      *   "Too" requires that someone else did the thing.
  *   **Reported Speech Test:** As you noted, the commitment is attributed to the **subject**. ("She said she *stopped*" implies *she* smoked).
  *   **Risk:** If you rewrite these, you risk changing the **facts** of the case.

  **Group B: Conventional Implicatures & Expressives**
  *   **Words:** *But, although, unfortunately, frankly, damn, so-called.* ("Allegedly" is a slight outlier, see below).
  *   **Mechanism:** These do not describe the world; they describe the **speaker's attitude** toward the world or the **relationship between clauses**.
      *   "But" asserts both clauses are true, but adds a contrast relation.
      *   "Unfortunately" asserts the proposition is true, but adds the speaker's negative evaluation.
      *   "Damn" adds pure emotional heat.
  *   **Reported Speech Test:** The commitment often stays with the **reporter**. ("She said he is, *unfortunately*, guilty" implies *you* think it's unfortunate).
  *   **Risk:** If you rewrite these, you risk changing the **tone, liability, or stance** of the document.

  **The Boundary & Outliers**
  *   **"Allegedly":** This is an **Evidential**. It sits on the boundary. It modifies the truth claim itself (it says "I don't know if this is true"). In your rewriting work, treat this as Group B (Stance), but know it is legally critical. Removing "allegedly" turns an accusation into a statement of fact.
  *   **"Moreover":** This is a **Discourse Marker**. It signals how the reader should process the information (add this to your mental stack). It is pure Group B.
  *   **"So-called":** This is an **Expressive**. It signals distance or skepticism. Group B.

  ### 3. Contrasts: How this differs from its neighbours

  To help your team distinguish this from other layers of meaning, use this comparison:

  | Feature | **Literal Content (At-Issue)** | **Conversational Implicature (Ordinary Suggestion)** | **Your Class (Not-At-Issue)** |
  | :--- | :--- | :--- | :--- |
  | **Example** | "He has three children." | "He has three children." (Implying: *not four*) | "He *stopped* smoking." (Implying: *he smoked*) |
  | **Negation Test** | Disappears ("He doesn't have three"). | Disappears ("He doesn't have three"). | **Survives** ("He didn't stop" -> *he still smoked*). |
  | **Cancellability** | Cannot be denied. | **Can be cancelled** ("...in fact, he has four"). | **Cannot be cancelled** ("#He stopped, but he never smoked"). |
  | **Source** | The whole sentence meaning. | Context + Cooperation principles. | **Specific Words** (Lexical triggers). |
  | **Rewriting Risk** | Changing this changes the **claim**. | Changing this changes the **inference**. | Changing this changes the **background/stance**. |

  ### 4. Name, Definition, and Decision Rule

  Since "Conventional Implicature" is contested and "Presupposition" only fits Group A, I recommend you adopt the umbrella term **"Conventional Side-Commitments."**

  **Definition for your team:**
  > A **Conventional Side-Commitment** is meaning that is attached to specific words rather than the main claim. It survives if you ask a question or say "no," and you cannot deny it without sounding contradictory.

  **Decision Tree (for new words):**
  1.  **Negate the sentence.** Does the "second thing" disappear?
      *   Yes → It is Literal Content. (Safe to rewrite if meaning is preserved).
      *   No → Go to 2.
  2.  **Try to cancel it.** Add "...but [second thing] isn't true." Does it sound crazy?
      *   No (It sounds cautious) → It is Conversational Implicature. (Context dependent).
      *   Yes (It sounds contradictory) → It is a **Conventional Side-Commitment**.
  3.  **Check the Reported Speech.** If *someone else* said this, who owns the "second thing"?
      *   The Subject (Group A/Presupposition) → It is a **Background Fact**.
      *   The Speaker/Reporter (Group B/Expressive) → It is **Stance/Framing**.

  ### 5. Practical Application: Rewriting Rules

  This is the most critical part for your work. The distinction tells you exactly where the legal/medical risk lies.

  **Rule for Group A (Background Facts: *stop, regret, again, too*):**
  *   **The Trap:** If you replace a trigger with a plain description, you often turn a "Side-Commitment" into a "Main Claim."
      *   *Original:* "The tenant **stopped** paying rent." (Side-commitment: He paid before. Main claim: He doesn't now.)
      *   *Rewrite:* "The tenant **does not** pay rent." (Main claim: He doesn't now. **Lost:** The fact that he paid before.)
  *   **The Fix:** If you must remove the trigger word, you must **make the side-commitment explicit** elsewhere in the text to preserve the factual record.
      *   *Safe Rewrite:* "The tenant paid rent previously but **does not** pay rent now."

  **Rule for Group B (Stance/Framing: *but, unfortunately, allegedly*):**
  *   **The Trap:** These words often carry legal or medical liability.
      *   *Original:* "The patient **unfortunately** suffered complications." (Admits a negative outcome occurred and frames it as adverse.)
      *   *Rewrite:* "The patient suffered complications." (Removes the admission of adversity; might be safer, or might be less clear.)
      *   *Original:* "The **alleged** assault." vs "The assault."
  *   **The Fix:** **Do not delete these words to simplify.** They are not clutter; they are shields or signals.
      *   If you remove "allegedly," you are asserting fact.
      *   If you remove "unfortunately," you are removing an expression of empathy or admission of nuisance.
      *   *Decision:* Keep them unless your client explicitly instructs you to change the stance (e.g., "Make this more neutral").

  **Rule for Translation:**
  *   **Group A:** You must find a trigger in the target language that carries the same presupposition. If the target language lacks a specific "stop" trigger that implies prior action, you must add a clause ("...which he was doing before").
  *   **Group B:** These are culturally specific. "Frankly" in English signals honesty; in some cultures, directness signals rudeness. You are translating **pragmatic force**, not just meaning.

  ### 6. Critique of Your Data

  You asked if you have the data wrong. You are remarkably close, but Feature 2 needs a slight adjustment.

  *   **Feature 2 (Context Independence):** You wrote: *"I get it from the sentence on its own... in any context."*
      *   **Correction:** This is mostly true, but **Presuppositions (Group A) can be "accommodated."** If I say "I'm sorry I'm late, my car broke down," you don't know I have a car. But you accept it instantly to make sense of the sentence. It feels less like "smuggling" in casual chat than in legal documents. In *your* context (legal/medical), your intuition is correct: it feels like smuggling because the stakes require explicit verification.
      *   **Load-bearing Feature:** Feature 3 (Projection) is actually your strongest diagnostic. Feature 1 (Not At-Issue) is the most important for rewriting. Feature 2 is the most important for identification.

  *   **The "Self-Contradictory" Test:** You noted that denying the second thing creates contradiction.
      *   **Group A:** "He stopped smoking, #but he never smoked." (Contradiction).
      *   **Group B:** "He is poor but honest, #but there is no contrast." (This is slightly different. It's not a logical contradiction, it's a **infelicity**. The sentence loses its point).
      *   **Refinement:** For Group B, the test isn't always "contradiction," it is "loss of function." If you remove "but," the sentence is still true, but the *argument* fails.

  **Summary for your team:**
  You are handling **Conventional Side-Commitments**.
  *   **Group A** are **Fact Triggers**. Changing them changes the *history* of the case.
  *   **Group B** are **Stance Markers**. Changing them changes the *liability or tone* of the case.
  *   **Neither** should be removed for the sake of "plain language" without checking if the commitment they carry is intended to be kept. Often, in legal/medical texts, the "clutter" is the protection.
