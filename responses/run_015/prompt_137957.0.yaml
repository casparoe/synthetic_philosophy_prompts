  # Diagnostic Decision Tree: The Special Composition Question

  **Instructions:** Answer the following six questions based on your intuitions about the specific cases provided. Follow the path indicated by your answers to locate your position in the logical space. Do not worry about the names of the positions until you reach a leaf.

  ### The Questions

  1.  **Arbitrary Fusion:** Do your left kidney and the Eiffel Tower, taken together, compose a single further object?
      *   **Yes:** Go to Leaf A.
      *   **No:** Go to Question 2.

  2.  **Minimal Composition:** Do two hydrogen atoms bonded in an otherwise empty gas cloud compose a single object?
      *   **No:** Go to Leaf B.
      *   **Yes:** Go to Question 3.

  3.  **Contact Requirement:** Does a stone arch count as one object *only* because the stones touch or are fastened?
      *   **Yes:** Go to Question 4.
      *   **No:** Go to Question 5.

  4.  **Life Requirement:** Does a termite mound (or a biological cell) count as one object *only* because the parts participate in a life process?
      *   **Yes:** Go to Leaf C (Unoccupied).
      *   **No:** Go to Question 6.

  5.  **Life Requirement (Non-Contact):** Does a termite mound count as one object *only* because the parts participate in a life process?
      *   **Yes:** Go to Leaf D.
      *   **No:** Go to Question 6.

  6.  **Persistence & Boundaries:** If a cat loses the tip of one whisker, or a sand pile loses one grain, does the original object cease to exist (or is there a precise cutoff)?
      *   **Yes (Sharp/Essential):** Go to Leaf E or F.
      *   **No (Vague/Flexible):** Go to Leaf G or H.

  ---

  ### The Leaves (Positions)

  **Leaf A: Universalism**
  *   **Path:** Q1 = Yes.
  *   **Commitment:** Commits you to counting the atom-for-atom duplicate cat formed by chance and the social club as objects just as much as yourself.
  *   **Status:** Occupied.

  **Leaf B: Nihilism**
  *   **Path:** Q1 = No, Q2 = No.
  *   **Commitment:** Commits you to denying that the vortex in the river exists as a single thing, leaving only simples.
  *   **Status:** Occupied.

  **Leaf C: Contactism + Organicism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = Yes, Q4 = Yes.
  *   **Commitment:** Requires both physical contact and biological life for composition to occur.
  *   **Status:** **Unoccupied** (Diagnosis: Merely unattractive; redundant to require contact if life already suffices).

  **Leaf D: Organicism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = No, Q5 = Yes.
  *   **Commitment:** Commits you to denying the stone arch is an object while affirming the termite mound is one.
  *   **Status:** Occupied.

  **Leaf E: Brutalism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = No, Q5 = No, Q6 = Yes (Brute Fact).
  *   **Commitment:** Commits you to accepting composition as a brute fact ungoverned by any qualitative feature of the candidates.
  *   **Status:** Occupied.

  **Leaf F: Epistemicism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = No, Q5 = No, Q6 = Yes (Sharp but Unknown).
  *   **Commitment:** Commits you to a sharp cutoff for sand piles that exists in reality but is impossible to know.
  *   **Status:** **Flagged Pair** (Tree cannot separate Leaf E and Leaf F diagnostically; both answer "Yes" to sharpness).

  **Leaf G: Vague Composition**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = No, Q5 = No, Q6 = No.
  *   **Commitment:** Commits you to the claim that the social club's existence is an indeterminate matter during member replacement.
  *   **Status:** Occupied.

  **Leaf H: Restricted Essentialism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = No, Q5 = No, Q6 = Yes (Essential Parts).
  *   **Commitment:** Commits you to the cat ceasing to exist as the original object if it loses the tip of one whisker.
  *   **Status:** Occupied.

  **Leaf I: Contactism + Vagueness**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = Yes, Q6 = No.
  *   **Commitment:** Requires physical contact for composition but allows vague boundaries for contacted objects.
  *   **Status:** **Unoccupied** (Diagnosis: Incoherent; contact implies a precise spatial boundary).

  **Leaf J: Contactism**
  *   **Path:** Q1 = No, Q2 = Yes, Q3 = Yes, Q4 = No, Q6 = Yes.
  *   **Commitment:** Commits you to saying the termite mound is not an object if the termites do not physically touch.
  *   **Status:** Occupied.

  ---

  ### Note for Students Without a Match

  If your answers do not lead to a single leaf (e.g., you answered "Yes" to life for termites but "No" for cells, or you find the distinction between Brutalism and Epistemicism crucial), you likely hold a hybrid or nuanced view not captured by this schematic. This is common; the tree maps standard "pure" positions, but your task in the seminar is to refine the questions until they match your verdicts. Do not force your answers to fit a name; let the mismatch reveal where your theory needs work.
