      The Compassion Cup inherently corrupts the virtue it seeks to promote by offering external incentives, so you should shift from a competitive contest to a surprise recognition model to ensure students act for the right kind of reasons.

      When students act kindly to win a prize, the prize is the reason for the action, not the welfare of others, which fits the definition of a wrong-kind reason that fails to confer actual moral value on the act. If you announce the prize beforehand, you explicitly invite students to treat kindness as a currency, incentivizing performative grand gestures that look "impressive" to judges rather than quiet, consistent aid that actually helps people. Swapping cash for a charitable donation does not solve this, because the student still receives the social status of the plaque and the psychological benefit of directing funds, which remain external contingencies unrelated to the moral worth of the kindness itself. Since a committee cannot epistemically access a student's internal motives, you cannot reliably judge "genuine" kindness in a competitive framework where the reward itself contaminates the motive. To mitigate this, you should advocate for announcing the awards only after the acts are completed, or better yet, remove the competition entirely and frame the donations as unexpected acknowledgments of observed good, thereby aligning the reward with recognition of value rather than creating an incentive for it.

