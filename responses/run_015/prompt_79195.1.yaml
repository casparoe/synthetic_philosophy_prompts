      *   **Task:** Explain the implications of the WKR problem for running the Compassion Cup (judging, timing, prize structure, assessability of genuineness).
      *   **Constraint 1:** Lead with the bottom line in the first sentence.
      *   **Constraint 2:** No preamble.
      *   **Constraint 3:** Don't restate the question.
      *   **Constraint 4:** Provide reasoning after the bottom line.

  2.  **Understand the "Wrong Kind of Reasons" (WKR) Problem:**
      *   *Core Concept:* Distinguishing between reasons that bear on the *value* or *correctness* of an attitude/action (right kind) vs. reasons that bear on the *benefits/consequences* of having that attitude/action (wrong kind).
      *   *Example:* A demon threatens to kill you unless you admire him. You have a reason to admire him (self-preservation), but this doesn't make him *admirable*. The reason is the "wrong kind" for grounding admirability.
      *   *Application to Compassion Cup:* The prize (donation + plaque) provides an external incentive (wrong kind of reason) for acting kindly. The goal is to encourage *kindness* (which presumably requires intrinsic motivation or right-kind reasons). If students act kindly *to win*, are they actually being kind, or just strategic?
      *   *Key Tension:* Incentivizing virtue might undermine the virtue itself (crowding out effect).

  3.  **Determine the Bottom Line:**
      *   What is the most crucial takeaway for the teacher?
      *   The WKR problem suggests that external rewards fundamentally corrupt the moral value of the act they aim to promote, meaning the Compassion Cup risks rewarding strategic performance rather than genuine compassion, so you should either abolish the competitive prize structure or radically decouple the reward from the selection criteria to preserve the integrity of the virtue being measured.
      *   *Refining for punchiness:* The Compassion Cup inherently risks rewarding strategic performance rather than genuine compassion because external incentives constitute the "wrong kind of reason" for moral virtue, so you must decouple the reward from the motivation to avoid teaching students that kindness is merely a transaction.

  4.  **Drafting the Reasoning (addressing specific points):**
      *   *Judging Entries:* If you judge based on "impressive acts," students will perform grand gestures for the prize (wrong kind) rather than quiet consistency (right kind). The criteria need to focus on impact/intent, but intent is hidden.
      *   *Timing (Announce Before vs. After):* Announcing before creates the incentive *ex ante*, contaminating the motive. Announcing after (surprise reward) aligns better with recognizing value already present, though still tricky.
      *   *Charitable Donation vs. Cash:* Does swapping cash for charity fix it? Not really. It's still an external benefit (warm glow, social status, plaque) contingent on the act. It's still a reward structure.
      *   *Assessing "Genuine" Kindness:* Can a committee assess this? Epistemically difficult. You see actions, not motives. WKR highlights that if the motive is the prize, the moral worth is diminished (Kantian echo).
      *   *Implications:* The program might teach the wrong lesson (kindness = currency).

  5.  **Refining the Output (adhering to constraints):**
