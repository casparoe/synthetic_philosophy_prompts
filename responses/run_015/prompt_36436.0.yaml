answer: |-
  # Desiderata for a Theory of Split-Brain Unity

  To move past the stalemate between the "one-mind" and "two-minds" camps, we must agree on what the data demands of our metaphysics. The following list distinguishes between empirical phenomena that must be accommodated, conceptual distinctions that must be respected, and practical constraints that must be met. We must also distinguish genuine constraints from hidden prejudices.

  ### I. Empirical and Phenomenological Accommodation
  *Any adequate theory must account for the following data points without dismissing them as mere artifacts.*

  1.  **The Disconnection Data (Genuine):** In controlled laboratory settings (e.g., tachistoscopic input to one visual field), the hemispheres demonstrate independent processing, distinct preferences, and the ability to answer questions separately (e.g., via key-press vs. verbal report).
  2.  **First-Person Insistence of Unity (Genuine):** Post-commissurotomy patients consistently report no subjective fragmentation. They do not feel like two people; they report a single, continuous stream of experience.
  3.  **Ordinary Hemispheric Cooperation (Genuine):** Outside the lab, patients function seamlessly. The hands do not constantly fight; behavior is coordinated, suggesting a functional unity in naturalistic environments.
  4.  **Cross-Cuing (Genuine):** The hemispheres often infer the other's state through external cues (e.g., the left hemisphere sees the right hand moving and infers the intent), which can mimic unity without underlying integration.
  5.  **Left-Hemisphere Confabulation (Genuine):** The speaking hemisphere (typically left) generates plausible but false explanations for actions initiated by the right hemisphere, indicating a lack of direct access to the motive but a drive to maintain a unified narrative.
  6.  **Partial-Section and Graded Effects (Genuine):** In cases where only some commissural fibers are cut, or in acallosal individuals, deficits are often graded rather than binary. Unity appears to be a matter of degree, not a switch.
  7.  **Alien-Hand Behaviors (Genuine):** In some cases, one hand acts purposively against the will of the other (intermanual conflict), suggesting a fragmentation of agency even if consciousness remains unified.

  ### II. Conceptual Distinctions
  *The theory must not conflate the following categories.*

  8.  **Unity of Consciousness vs. Unity of Subject vs. Unity of Person (Genuine):**
      *   *Unity of Consciousness:* Are experiences co-conscious (phenomenal unity)?
      *   *Unity of Subject:* Is there a single "I" to whom experiences are attributed (subjective unity)?
      *   *Unity of Person:* Is there a single biological, legal, and moral entity (personal unity)?
      *   *Requirement:* A theory must specify which of these is fractured, if any.
  9.  **Lacking Access vs. Two Streams (Genuine):** The theory must distinguish between a single stream of consciousness where information transfer is blocked (access failure) and the existence of two ontologically distinct streams of consciousness (stream multiplication).
  10. **The Integer Constraint on Minds (Prejudice):** *Reject.* The assumption that the question "How many minds?" must yield a whole number (1 or 2). This prejudice forces a binary metaphysics onto what the partial-section data suggests may be a graded or context-dependent phenomenon.

  ### III. Practical and Ethical Demand
  11. **Clinical and Moral Usability (Genuine):** The theory must offer actionable guidance for treating neurologists and ethicists. Specifically, it must address whether consent voiced by the speaking hemisphere constitutes consent for the *patient*. A theory that renders agency indeterminate fails the ethical reality of medical treatment.

  ***

  ### IV. Consistency Check: The Inconsistent Triad
  Upon reviewing these desiderata, we face a critical finding: **A subset of these genuine demands appears jointly unsatisfiable.** We cannot simultaneously hold the following three positions:

  1.  **Access-Dependent Unity:** Unity of consciousness *requires* informational access/integration between parts of the system.
  2.  **Disconnection Reality:** Split-brain patients fundamentally lack interhemispheric informational access (per the Disconnection Data).
  3.  **Phenomenological Authority:** The patient's First-Person Insistence of Unity is veridical (i.e., they *are* phenomenally unified).

  **The Finding:** If Unity requires Access (1), and Access is absent (2), then the patient cannot be Unified (Not-3). But the patient insists they are (3).
  *   **Two-Stream Views** satisfy (1) and (2) but reject (3), claiming the patient is mistaken about their own unity.
  *   **Single-Consciousness/Restricted-Access Views** satisfy (2) and (3) but reject (1), arguing unity does not require full informational access.
  *   **Deflationary Accounts** often satisfy (1) and (3) by downplaying (2), suggesting the disconnection is less profound than claimed.

  **Secondary Tension:** There is also a tension between **Graded Effects (6)** and **Clinical Usability (11)**. Metaphysical gradedness does not map cleanly onto binary ethical requirements (Consent: Yes/No). A theory that accurately describes the graded metaphysics may fail to provide the binary rule the neurologist needs, unless it includes a normative stipulation overriding the metaphysics.

  ***

  ### V. Preliminary Scorecard for Familiar Candidates
  *For the group to debate.*

  *   **Two-Stream Views:** Excel at accommodating the **Disconnection Data** and **Alien-Hand** behaviors but struggle significantly with **First-Person Insistence** (requiring us to call patients deluded) and **Clinical Usability** (if there are two minds, whose consent counts?).
  *   **Single-Consciousness-with-Restricted-Access:** Preserves **First-Person Authority** and **Clinical Usability** (one patient, one consent) but must work hard to explain the **Disconnection Data** without ad-hoc assumptions about "hidden" access or by redefining unity to be compatible with isolation.
  *   **Deflationary Accounts (Unity is unaffected):** Best for **Ordinary Cooperation** and **Clinical Usability**, but risks ignoring the **Disconnection Data** and **Alien-Hand** phenomena as merely performance errors rather than metaphysical fractures.

  **Conclusion:** The goal of this reading group is not to pick a winner immediately, but to decide which leg of the Inconsistent Triad we are willing to break.
