  4.  **Formulate a Principle:**
      *   A single principle that covers both efficiency and rights is hard, but "Democratic Competence coupled with Rights Protection" might work. Or perhaps "Subsidiarity with a Federal Floor."
      *   Actually, the most coherent principle that fits their specific mix (especially the asymmetric clean air and voting rights) is **Protected Status Subsidiarity** or **Federalism as a Two-Way Shield**.
      *   Let's try to synthesize: The level of governance should be determined by the *scope of the consequence* minus the *risk of rights violation*.
      *   Better yet: **The Principle of Non-Dominating Jurisdiction.** Decisions should be made locally *unless* the local decision imposes uncompensated costs on outsiders (externalities) or violates fundamental rights that require a common standard to protect minorities.
