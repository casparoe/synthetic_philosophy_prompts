answer: |-
  Dear Student,

  It is rare to find a student who notices that their intuitions are inconsistent before they write the paper, and even rarer to find one who realizes that the inconsistency might be the point. You are struggling because you are trying to fit a multidimensional problem into a one-dimensional principle. Standard subsidiarity is usually sold as a procedural rule about efficiency or democratic closeness, but your gut reactions reveal that you are actually operating with a substantive theory of justice. You are not just asking who should decide; you are asking what kind of decision is being made. The principle that ties your verdicts together is not pure subsidiarity, but what we might call constrained subsidiarity with a federal floor. Under this principle, authority belongs to the lowest level capable of managing the issue, unless that decision creates negative externalities for outsiders or violates a fundamental rights baseline that requires uniform protection.

  When you look at your verdicts through this lens, the coherence starts to appear. Your stance on zoning works because it is largely local in consequence, though you might have to reconsider that if you view exclusionary zoning as a civil rights violation similar to segregation. Your minimum wage intuition is driven by economic externalities and exit risks, which fits the constraint that local units cannot impose costs on neighbors through regulatory arbitrage. The school curriculum preference for the middle level reflects a balance between local knowledge and the need for a common civic framework, which is a classic state function. Professional licensing and drug approvals are assigned high because the need for standardization and expertise outweighs the benefit of local variation, and the risk of a race to the bottom in safety is too high. The river pesticide case is a textbook externality argument where the jurisdiction must match the geography of the harm.

  The two cases you identified as problems are actually the keys to unlocking your own principle. Your desire for a ratchet on clean air rules reveals that you do not view subsidiarity as symmetric. You are comfortable with local units exceeding federal standards but not falling below them. This suggests your principle is not just about who decides, but about setting a minimum standard of protection that cannot be undercut by local competition. This is consistent with your voting rights intuition. You support the town allowing non-citizens to vote because it expands the franchise, but you support federal intervention against segregation because it contracts rights. You are not flipping based on the level of government; you are flipping based on the direction of the policy relative to a normative baseline of equality and inclusion. To make your principle coherent, you have to give up the idea that subsidiarity is neutral. You have to accept that your version of federalism is designed to protect certain values, and that sometimes the higher level must intervene not because the local level is inefficient, but because it is unjust.

  The part of your own stab that needs revision is the focus on exit and consequences. While that handles the economic cases well, it fails on the rights cases because rights are not about consequences or exit; they are about status and dignity. A minority group in a segregated school system cannot exit easily, nor is the harm purely economic. Your principle needs to incorporate a rights constraint that trumps the efficiency argument. So, the load-bearing verdicts are the asymmetric ones: the clean air ratchet and the voting rights flip. These show that you care about the outcome, not just the process. The verdicts you might have to soften are the ones that assume local control is inherently democratic. If local control leads to exclusion, your own logic on voting rights suggests you should be willing to override it, which might complicate your zoning intuition if that zoning is used to exclude protected classes.

  Let us apply this principle to a case you have not listed, one where the local unit has both the know-how and the potential for bigotry. Consider policing and the use of force. A local police department knows the specific dynamics of its neighborhood, the history of its streets, and the community leaders better than a federal agent ever could. This is the know-how argument for local control. However, local police forces have historically been the instruments of segregation and racial violence, utilizing their local knowledge to target minorities more effectively. Under your principle of constrained subsidiarity, the federal or state level should set a floor on use-of-force standards and civil rights protections to prevent abuse, ensuring that local bias does not violate fundamental rights. However, the local level should retain discretion on deployment strategies and community engagement programs, provided they meet or exceed the federal rights baseline. This allows for local innovation and knowledge without permitting local tyranny. It respects the local unit's competence while guarding against its potential for bigotry, exactly where you suspected the framework would collapse.

  Finally, you asked about the meta-question of who decides which level gets the power, and why it feels embarrassing that it is always the court. It feels embarrassing because it seems to contradict the democratic ideal that the people should decide their own structure. If the court decides the boundaries of democracy, who guards the guardians? However, this is not a bug in the system; it is a feature of constitutional federalism. In any system where power is divided, there must be an umpire to settle disputes between the levels, or the division dissolves into conflict. The alternative to judicial review is not pure democracy; it is either the dominance of the central government by force or the fragmentation of the union. The court embodies the constitutional commitment itself. It is counter-majoritarian, yes, but it protects the structure that allows multiple majorities to exist at different levels. The embarrassment you feel is the tension of living under a rule of law rather than a rule of men, but without that umpire, your clean air ratchet and your voting rights protections would be unenforceable promises. The court is the mechanism that makes your principle operational, even if it is imperfect.

  You have the makings of a very strong paper here. Do not try to hide the inconsistency you found; lean into it. Argue that subsidiarity cannot work as a standalone slogan because it requires a substantive theory of justice to determine when local variation is a virtue and when it is a vice. Your gut reactions are not incoherent; they are just more sophisticated than the textbook definition. Write about the tension between the procedure of division and the substance of rights, and use your asymmetric intuitions as the evidence that pure subsidiarity is dead, but constrained subsidiarity is alive.

  Best of luck with the final paper.

  Sincerely,

  Your Instructor
