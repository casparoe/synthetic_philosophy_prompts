      *   The user is struggling with the tension between *efficiency/externalities* (economic logic) and *rights/values* (moral logic).
      *   Standard subsidiarity is often framed as "lowest effective level." But the user's intuitions shift based on whether the issue is technical (drugs), economic (wages, licensing), or moral/rights-based (voting, segregation, air quality).
