      *   **Specific Comparison:** Compare Weber's "elective affinity" (Calvinism & Capitalism) with "downward causation" in emergent systems.
      *   **Specific Tension:** Do values give an independent causal push, or just select possibilities? How does this compare to materialism (only material conditions explain)?
      *   **Goal:** Understand which framework lets values *do work* rather than just receiving credit after the fact.
      *   **Constraint:** No bibliography.

  2.  **Deconstruct Weber's "Elective Affinity":**
      *   *What is it?* It's not simple causation ($A \rightarrow B$). It's more like chemical compatibility. Two distinct substances (ideas and material interests) attract and stabilize each other.
      *   *Does it give independent push?* Yes, but not in a vacuum. Ideas act as "switchmen" (Weber's famous metaphor). They determine the *direction* of the train driven by material interests.
      *   *Is it just a filter?* It's more than a passive filter; it's an active constraint and enabler. It changes the *meaning* of action, which changes the action itself.

  3.  **Deconstruct "Downward Causation" in Emergent Systems:**
      *   *What is it?* Higher-level patterns (emergent properties) constrain or influence lower-level components. (e.g., the shape of a heart constrains blood cell flow; the software constrains the hardware states).
      *   *Relevance to Chemistry:* The user knows this. A molecule's behavior isn't just the sum of atoms; the molecular structure (higher level) dictates how the atoms interact (lower level).
      *   *Relevance to Culture:* Culture is the emergent pattern. Individuals are the components. The cultural norm (higher level) constrains individual economic behavior (lower level).

  4.  **Synthesize: Weber vs. Emergent Downward Causation:**
      *   *Similarity:* Both reject simple reductionism. You can't explain the system just by looking at the base particles (atoms/material conditions). The organization/pattern matters.
      *   *Weber's "Switchmen":* This is the key mechanism. Material interests provide the *energy* (the engine), but values provide the *track* (the direction).
      *   *Independent Causal Push:* In emergent systems, the pattern *is* a real causal force. If Weber is read through this lens, values are not epiphenomenal. They are structural constraints that feed back into the material base.

  5.  **Address the Materialist Critique:**
      *   *Materialist View:* Ideas are superstructure; base determines superstructure. Values are just rationalizations of what was going to happen anyway.
      *   *Weber's Counter:* If values were just decoration, why did capitalism arise *there* and *then* with *that* specific ethic? The "spirit" of capitalism preceded the full bloom of the system. The anxiety of salvation drove accumulation *before* it was profitable.
      *   *The "Work" Question:* Do values do work? In Weber's view, yes. They reduce uncertainty. They provide a motivation (salvation anxiety) that material greed alone doesn't explain (greed is universal; rational capitalism is not).

