      *   *Claim 3:* Knowledge norm = "basically means you should only say things you're certain of." -> *Misleading/Inaccurate.* Knowledge does not require Cartesian certainty. This is a common misconception.
      *   *Claim 4:* "The lottery case... it seems perfectly fine to assert 'I won't win.'" -> *Contested.* This is the crux of the debate. Many philosophers (especially knowledge norm defenders) argue it is *not* fine to assert this.
      *   *Claim 5:* "The truth norm handles this easily — it's true that you won't win, so the assertion is fine." -> *Problematic.* Just because it's true doesn't mean the assertion is *appropriate* (the norm is about propriety, not just outcome). Also, we don't know *which* ticket loses until the draw.
      *   *Claim 6:* "The belief norm handles it too — you believe you won't win." -> *Problematic.* Sincere belief is usually considered too weak a norm (allows for irresponsible assertion).
