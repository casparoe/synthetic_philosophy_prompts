answer: |-
  **Joint Statement on the Norm of Assertion**

  **1. Agreed Claims**

  1.  In ordinary central cases where evidence is strong and propositions true, both norms prescribe assertion identically; divergence cases carry the evidential weight.
  2.  Moore-paradoxical unassertability is data to be explained by any norm, not proof that knowledge is the unique governor.
  3.  Reluctance to assert lottery propositions on purely statistical grounds is data to be explained, not data that settles the norm on its own.
  4.  "Improper" signifies a criticism-worthy norm violation attributable to the speaker's conduct.
  5.  "Defective" signifies a failure of the governing standard where the speaker is not at fault.
  6.  "Infelicitous" signifies pragmatic offness distinct from norm violation or standard failure.
  7.  A large share of recorded disagreement collapses into a mismatch about which verdict (improper, defective, infelicitous) is being requested.*
  8.  Hedged, prefaced, and relayed speech operate under norms distinct from, but related to, flat-out assertion.
  9.  A complete account must specify how hedged norms relate to the norm for the unhedged case.
  10. The practice of assertion has a point (e.g., knowledge-transmission, evidence-pooling, deliberative record) that constrains viable norms.
  11. The point of practice constrains which norms can govern assertion, even though the camps disagree about what that point is.
  12. No test of a norm is valid where the speaker's evidence base, or the hearer's take on it, is left unspecified.
  13. Data must be described at a granularity fine enough to distinguish knowledge failures from justification failures.*
  14. Truth enters assessment either as a condition on being in order or as an independent standard by which assertions are assessed.

  **2. Disagreements Table**

  | Issue | Neutral Statement | Knowledge Camp Formulation | Reasonable-Belief Camp Formulation | Substance Verdict | Data Note |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Constitutive vs. Regulative** | Is the rule part of the act's identity or a rule governing its use? | The knowledge rule is constitutive; without it, the act is not assertion. | The justification rule is regulative; assertion exists independently of the norm. | Substantive | Requires cases where constitutive failure vs. regulative violation yields different behavioral markers. |
  | **Evidence Base** | Whose evidence fixes the norm's satisfaction? | The speaker's personal evidence state determines knowledge possession. | The evidence available to the office or role may fix the standard, not just personal states. | Substantive | Spokesperson cases must vary personal vs. institutional evidence access. |
  | **Invariant vs. Contextual** | Does the standard shift with conversational context? | The knowledge standard is invariant; context changes what counts as knowledge. | The justification standard is indexed to locally stipulated evidentiary thresholds. | Substantive | Local-standard cases must show shifting blame patterns despite fixed truth-values. |
  | **Truth Rule Rival** | Is truth alone the norm, with knowledge/justification merely routes? | Truth alone is insufficient; knowledge is the non-derivative standard. | Truth is the independent standard; justification is the condition for being in order. | Partly Verbal | Depends on whether "in order" means "blameless" or "successful." |
  | **Point of Practice** | Does the practice's point settle the norm or merely constrain it? | The point (knowledge transmission) settles the norm as knowledge. | The point (coordination) constrains the norm but allows justified false assertion. | Substantive | Requires measuring success conditions in cooperative tasks varying truth/knowledge. |

  **3. Cruxes**

  **The Retrospective Case**
  *Sub-question:* What verdict applies to an assertion, fully reasonable when made, of a proposition that was never known and turns out false?
  *Why it matters:* It separates blame (improper) from standard failure (defective).
  *Test:* A speaker asserts *p* based on excellent but misleading evidence. *p* is false.
  *Predictions:* **Knowledge Camp:** The assertion is defective (failed knowledge) but not improper (no blame). **Reasonable-Belief Camp:** The assertion is proper (met justification) and not defective (truth is independent).
  *Note:* Disagreement lies in whether "defective" applies when justification is met.

  **The Spokesperson's Case**
  *Sub-question:* Is the relevant standard fixed by personal evidence or the evidence available to the office?
  *Why it matters:* It tests whether the norm is agent-relative or role-relative.
  *Test:* A spokesperson asserts a safety claim based on a report she cannot check personally but is authorized to relay.
  *Predictions:* **Knowledge Camp:** Naive assessors will blame the speaker if she personally lacks knowledge, regardless of office. **Reasonable-Belief Camp:** Assessors will withhold blame if the office evidence was sufficient, even if personal evidence was not.

  **The Evidentiality Test**
  *Sub-question:* How do languages with obligatory evidential marking apportion the work hedging does in English?
  *Why it matters:* It tests whether assertive force is unitary (one rule) or graded (family of commitments).
  *Test:* Typological survey of unmarked flat-out forms in evidential languages.
  *Predictions:* **Knowledge Camp:** Unmarked forms will correlate strictly with direct knowledge sources. **Reasonable-Belief Camp:** Unmarked forms will correlate with high justification regardless of source type.

  **The Audit Game**
  *Sub-question:* Which variable tracks blame: knowledge failure or justification failure?
  *Why it matters:* It isolates the variable driving negative assessment.
  *Test:* Sender relays claims varying in perception, testimony, statistical base-rate, and Gettier cases; truth varies separately.
  *Predictions:* **Knowledge Camp:** Blame tracks knowledge failure (low in Gettier, high in false belief). **Reasonable-Belief Camp:** Blame tracks justification failure (low in Gettier, high in statistical base-rate).

  **The Local-Standard Case**
  *Sub-question:* Do readiness to assert and criticise track local conventions?
  *Why it matters:* It tests contextualism about the norm.
  *Test:* Compare a lab meeting (replication required) vs. a newsroom (attributed claims allowed).
  *Predictions:* **Knowledge Camp:** Participants track local conventions but attribute this to shifting knowledge standards, not norm shifts. **Reasonable-Belief Camp:** Participants track local conventions because the justification norm itself is indexed to context.

  **4. What Would Move Us**

  **Knowledge Camp:** We would concede if the Audit Game shows that blame patterns track justification failures consistently even when knowledge is absent, provided this holds across contexts where knowledge is intuitively missing. We would have to give up the claim that knowledge is the unique norm governing blame.

  **Reasonable-Belief Camp:** We would concede if the Retrospective Case shows that speakers are consistently criticized as "improper" (not merely unfortunate) when asserting justified falsehoods, provided the evidence base was fully specified as misleading. We would have to give up the claim that justification is sufficient for proper assertion.

  **5. Closing**

  This collaboration clarifies that many disputes were verbal, centering on the definitions of "improper" versus "defective." Once these verdicts were distinguished, the residual disagreement proved genuinely evaluative: whether the practice's point settles the norm or merely constrains it. The disputes regarding contextualism and evidence bases are answerable to the tests in Section 3. Where a crux is genuinely empirical, such as the Audit Game's blame distributions, neither camp's prediction is yet available. We commit to accepting the data from these pre-registered tests rather than manufacturing agreement where the evidence remains outstanding.
