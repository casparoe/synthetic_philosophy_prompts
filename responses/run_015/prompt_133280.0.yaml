          *   Rank tensions by severity.
          *   Identify load-bearing claims.
          *   Address the author's suspicion about (2) and (3).
          *   Prioritize holding onto (6).
          *   Provide confidence levels for diagnoses.
          *   Flag the single point of least certainty.

  2.  **Analyze the Propositions:**
      *   *(1) Structural Definition:* Corruption = misuse of office via personal relations vs. official criteria. (Focus on *office*, not *envelope*).
      *   *(2) Norm-Saturation:* Corruption depends on local norms. Rules must be "saturated" (actually guide expectations) to count as benchmarks. Critique of cross-country indices (Weberian bias).
      *   *(3) Clientelism:* Normatively wrong *pro tanto*, even if expected/effective. Converts public good to private currency + requires submission.
      *   *(4) Welfare Exception:* Unwilling to condemn if it reliably helps the worst off more than alternatives (e.g., speed money).
      *   *(5) Institutional Focus:* Diagnostic for design, not blame allocation.
      *   *(6) The Case Verdict:* Councillor allocating housing via personal table (bypassing frozen official list) is corrupt, *even if* it houses people who otherwise wouldn't be housed.

  3.  **Identify Tensions (Brainstorming):**

      *   *Tension A: (2) vs. (3).* (2) says norms determine what counts as corrupt (relativist/descriptive element). (3) says clientelism is corrupt *normatively* even if everyone expects it (universalist/normative element). If norms define corruption (2), how can something be corrupt against the norm (3)?
      *   *Tension B: (3) vs. (4).* (3) says clientelism is wrong *even where the state delivers nothing otherwise*. (4) says if a practice gets the worst off more than alternatives, the author is unwilling to condemn it. The housing case (6) looks like clientelism that helps the worst off. (3) condemns it; (4) hesitates to condemn it.
      *   *Tension C: (4) vs. (6).* (4) says "unwilling to condemn" if it helps the worst off more than alternatives. (6) says the councillor *is* acting corruptly (implying condemnation/wrongdoing) even though the people would not be housed otherwise. This is a direct contradiction.
      *   *Tension D: (1) vs. (2).* (1) defines corruption structurally (office vs. personal relation). (2) says whether an office is meant to be impartial is settled by local norms. If local norms say the office *is* personal (patronage), does (1) still apply? (2) saves (1) via the "saturation" clause, but it's tight.
      *   *Tension E: (5) vs. Blame/Condemnation.* (5) says don't allocate blame. (3) and (6) use strong normative language ("wrong," "corruptly"). Is calling it "corrupt" allocating blame? The author distinguishes diagnostic vs. blame, but the line is thin.

  4.  **Evaluate and Rank Tensions:**

      *   *Severity 1 (Critical): (4) vs. (6).* This is the most glaring contradiction. (4) sets up a welfare-based exemption ("unwilling to condemn"). (6) applies the label "corruptly" to a case that fits the exemption criteria (people housed who otherwise wouldn't be). If (6) is load-bearing, (4) must go or be heavily qualified.
      *   *Severity 2 (High): (2) vs. (3).* The author suspects this. (2) suggests a functionalist/descriptive definition (is the rule saturated?). (3) asserts a moral universalism (clientelism is wrong *even if* expected). If norms define the benchmark (2), how do we judge the norms themselves (3)?
      *   *Severity 3 (Medium): (3) vs. (4).* Similar to above. (3) says clientelism is wrong even if effective. (4) says effectiveness (welfare) mitigates condemnation.
      *   *Severity 4 (Low/Apparent): (1) vs. (2).* (2) actually supports (1) by clarifying *which* criteria count.
      *   *Severity 5 (Low/Apparent): (5) vs. Normative Claims.* "Corrupt" can be a systemic label without individual moral blame.

  5.  **Develop Revisions:**

      *   *Fixing (4) vs. (6):* The author wants to keep (6). So (4) needs revision. (4) currently says "unwilling to condemn." Revision: Distinguish between *functional necessity* and *corruption*. A practice can be corrupt (structurally) and yet excusable or necessary (normatively) in transition. Or, refine (4) to exclude *systemic* allocation (housing) vs. *administrative* friction (speed money).
      *   *Fixing (2) vs. (3):* Clarify that (2) defines the *extension* of the concept (what falls under the label), while (3) defines the *evaluation* of a specific subset (clientelism). Or, argue that "saturation" applies to *official* rules, but clientelism violates a deeper *publicness* norm that exists even if not saturated.
      *   *Load-bearing:* (6) is explicitly stated as crucial. (3) supports (6). (2) provides the context for (6). (4) is the threat.

  6.  **Drafting the Audit (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the framework (especially 1 and 5).
      *   *Top Tension:* (4) vs. (6). This is the killer. If (4) holds, (6) collapses. If (6) holds, (4) must be narrowed.
      *   *Second Tension:* (2) vs. (3). The "Is-Ought" problem. (2) is descriptive/functional; (3) is normative.
      *   *Third Tension:* (3) vs. (4). Consistency on welfare grounds.
      *   *Confidence Levels:* Need to be honest. High confidence on the (4)/(6) clash. Lower confidence on the resolution of (2)/(3) without seeing the full argument.

  7.  **Refining the "Cheapest Revision":**
      *   For (4) vs. (6): Don't delete (4). Narrow it. Distinguish "grease money" (overcoming friction) from "allocation money" (deciding who gets the good). Speed money preserves the system; housing patronage replaces the system.
      *   For (2) vs. (3): Distinguish between *definitional* norms (what is the office?) and *evaluative* norms (is this office legitimate?). (2) handles the first, (3) handles the second.

  8.  **Final Review against Constraints:**
      *   Audit not summary? Yes.
      *   Rank tensions? Yes.
      *   Cheapest revision + cost? Yes.
      *   Load-bearing identified? Yes.
      *   Confidence levels? Yes.
      *   Least sure point flagged? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, look at (6) again.* "A city councillor... is acting corruptly... even though the people he houses would not be housed at all otherwise."
      *   *Look at (4) again.* "Where a practice reliably gets the worst off more of what they need than any alternative on offer, I am unwilling to condemn it."
      *   *Conflict:* (6) *does* condemn it (calls it corrupt). (4) says *unwilling to condemn*.
      *   *Nuance:* Does "acting corruptly" equal "condemn"? In common parlance, yes. In this paper's logic (5), maybe not? (5) says "not as a device for allocating blame." So one can say "this is corruption" (diagnostic) without saying "this person is bad" (blame).
      *   *Resolution:* The tension might be semantic. If "condemn" in (4) means "assign moral blame" and "acting corruptly" in (6) means "fits the structural definition," they might be compatible *if* the author is very precise. However, (3) says clientelism is "normatively — pro tanto wrong." That sounds like condemnation. So (3) + (6) = Condemnation. (4) = No Condemnation. The tension stands.
      *   *Best Fix:* Restrict (4) to *survival* strategies by citizens, not *allocation* strategies by officials. Speed money is paid by the citizen to survive bureaucracy. Housing patronage is dispensed by the official to build power.

  10. **Final Polish:** Ensure tone is academic, rigorous, and direct. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "change (4)." I need to explain *why* it threatens (6) specifically. The housing case is the test case. If the theory fails the test case, the theory fails.

  *(Confidence Check)*: I am very confident (4) and (6) contradict. I am less confident about the best philosophical resolution for (2) vs (3) because it depends on the underlying meta-ethics which aren't fully visible. I will flag that.

  *(Load Bearing)*: (6) is the verdict, but (1) is the definition. If (1) breaks, (6) falls. But the user says the paper "turns on" (6). So (6) is the *application* load-bearing, (1) is the *theoretical* load-bearing. I should identify (6) as the anchor the user wants to keep.

  *(Least Sure Point)*: The distinction between "condemn" in (4) and "wrong" in (3). Is there a space between "diagnostic label" and "moral condemnation" that the author is relying on? I'm 80% sure there's a tension, 20% sure the author has a linguistic escape hatch. I'll flag the interpretation of "condemn."

  *Wait, one more check on (2) vs (3).*
  (2) says norms settle whether an office is meant to be impartial.
  (3) says clientelism is wrong even if everyone expects it.
  If everyone expects clientelism, then by (2), the norm *is* clientelism. If the norm is clientelism, is the office meant to be impartial? If no, then by (1), it's not corruption. But (3) says it *is* corrupt/wrong.
  So (2) threatens to define clientelism *out* of corruption in high-saturation clientelist states. (3) insists it remains corruption.
  This is the "Functionalist Trap."
  Revision: (2) applies to *administrative* rules, (3) applies to *constitutive* principles of publicness. Or, (2) defines *local* corruption, (3) defines *systemic* corruption.
