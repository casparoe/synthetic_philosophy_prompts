answer: |-
  ### Part 1: The Debate Restated in Kripke Semantics

  Let $\mathcal{F} = (W, \leq)$ be a Kripke frame where $W$ is a set of nodes (states of the world/information) and $\leq$ is a partial order representing temporal or informational extension. Let $\Vdash$ be the forcing relation, satisfying monotonicity: if $w \Vdash \phi$ and $w \leq v$, then $v \Vdash \phi$.

  Let $p$ be an atomic proposition representing a future contingent (e.g., "There is a sea battle at time $t+1$"). Let $w_0 \in W$ represent the present moment.

  **The Open-Future Position (Aristotelian Indeterminism)**
  *   **Semantic Claim:** There exists a node $w_0$ and an atomic proposition $p$ such that $w_0 \nVdash p$ and $w_0 \nVdash \neg p$.
  *   **Logical Consequence:** Consequently, $w_0 \nVdash p \lor \neg p$. The Law of Excluded Middle (LEM) fails at $w_0$ for future-tensed propositions.
  *   **Frame Condition:** The frame must allow for branching futures regarding $p$. There must exist $v_1, v_2 \geq w_0$ such that $v_1 \Vdash p$ and $v_2 \nVdash p$ (where $v_2$ does not force $p$ and no extension of $v_2$ forces $p$, effectively making $v_2 \Vdash \neg p$ relative to the subframe, or simply leaving $p$ undecided).
  *   **Type-Theoretic Interpretation:** At type $P$ (the proposition $p$), there is no term $t : P$ available at context $w_0$, nor is there a term $f : P \to \bot$. The type $P + (P \to \bot)$ is not inhabited at $w_0$.

  **The Determinist Position (Logical Fatalism)**
  *   **Semantic Claim:** For all nodes $w$ and all propositions $\phi$ (including future contingents), $w \Vdash \phi \lor \neg \phi$.
  *   **Logical Consequence:** The logic validated by the frame is Classical Propositional Logic (CPC). LEM holds universally.
  *   **Frame Condition:** While the frame may structurally branch, the valuation of atomic propositions must be "settled" at $w_0$. Formally, for any $v_1, v_2 \geq w_0$, if $v_1 \Vdash p$ then $v_2 \Vdash p$. The branching is epistemic, not ontological; truth values are constant across all accessible worlds.
  *   **Type-Theoretic Interpretation:** For every type $P$, the type $P + (P \to \bot)$ is inhabited at $w_0$. Even if we cannot construct the witness (we don't know *which* side of the sum), the witness exists in the meta-theory.

  ***

  ### Part 2: Residue Report

  #### 1. Clean Translations
  The following mappings preserve the logical structure of the arguments without significant loss of fidelity:

  *   **Truth at a Time:** The philosophical claim "$\phi$ is true now" maps cleanly to $w_0 \Vdash \phi$. The persistence condition ($w \leq v \implies v \Vdash \phi$) aligns well with the intuition that once a future contingent is settled (e.g., the battle happens), it remains true that "it happened."
  *   **Bivalence vs. LEM:** The debate over whether future propositions "have a truth value" maps directly to the validity of the schema $\phi \lor \neg \phi$. The Determinist insists on the schema; the Open Futurist denies it for specific $\phi$.
  *   **Negation as Refutation:** The philosophical notion that "It is false that there will be a battle" maps to $w_0 \Vdash \neg p$. In Kripke semantics, this means $p$ is impossible in all future extensions. This captures the strong sense of falsity required by the debate (not just "not true," but "necessarily not true").

  #### 2. Distortions and Nuances
  Here the translation requires careful handling. The formal machinery imposes constraints that the philosophical debate treats as open questions.

  *   **"Indeterminate" vs. "Not Forced":**
      *   *Philosophical:* "Indeterminate" means neither true nor false.
      *   *Formal:* $w \nVdash \phi$ merely means "not verified." It is compatible with $w \Vdash \neg \phi$ (verified false).
      *   *Correction:* The Open-Future position does not map to $w \nVdash p$. It maps to $w \nVdash p \lor \neg p$. This is a crucial distinction. If you model "indeterminate" simply as $\nVdash p$, you lose the symmetry; the Open Futurist insists $p$ is no more true than $\neg p$ is.
      *   *Distortion:* In standard Kripke semantics for Intuitionistic Logic (IPC), $w \nVdash p \lor \neg p$ implies there are extensions $v_1, v_2$ where $p$ is forced and where $\neg p$ is forced (or $p$ remains forever unforced). This forces the "Open Future" to be a claim about the *existence of alternative possibilities* (branching), whereas some philosophical indeterminists might want to claim the future is "empty" without committing to concrete alternative branches.

  *   **Linearity vs. Branching:**
      *   You suspected frame shape matters. It does.
      *   **IPC** is sound and complete for *all* partial orders. You can refute LEM on a linear frame (e.g., an infinite chain where $p$ is never decided).
      *   However, the *intuitive* model of the Open Future is **branching time**. If the frame is linear, the failure of LEM looks like *ignorance* (we haven't reached the point where $p$ is decided) rather than *ontological openness*.
      *   To faithfully model the Sea Battle, you need a frame where $w_0$ sees $v_1$ and $v_2$, with $v_1 \Vdash p$ and $v_2 \Vdash \neg p$. This requires a branching frame.
      *   *The Determinist's Counter:* The Determinist can accept a branching frame but insist that the valuation $V$ is constant across branches. The translation forces the Determinist to claim the branching is "fake" regarding truth values, which is a strong metaphysical claim hidden in the valuation function.

  *   **The Nature of Negation:**
      *   In IPC, $\neg p$ is defined as $p \to \bot$. Semantically, $w \Vdash \neg p$ iff for all $v \geq w$, $v \nVdash p$.
      *   This makes negation very strong. To assert "It is false that there will be a battle," you must prove the battle never happens in *any* possible future.
      *   *Philosophical Residue:* Some indeterminists want to say "It is not true" without committing to "It is impossible." IPC forces a dichotomy: either $p$ is possible (some extension forces it) or $\neg p$ is forced (no extension forces it). There is no formal room for "not true but still possible" other than the state of undecidedness itself ($w \nVdash p \lor \neg p$).

  #### 3. Lost Residue (What Does Not Survive)
  These are elements of the philosophical debate that have no direct counterpart in standard Kripke/Type-Theoretic vocabulary.

  *   **Correspondence vs. Verification:**
      *   *Philosophy:* The Determinist often argues from a **Correspondence Theory of Truth**: a proposition is true if it corresponds to a fact, regardless of our ability to verify it.
      *   *Formalism:* Kripke semantics (and Type Theory) is inherently **Verificationist**. $w \Vdash \phi$ means $\phi$ is verified/proven at $w$.
      *   *Loss:* The translation biases the debate toward the Open Futurist. By using Kripke semantics, you have already adopted a framework where truth is tied to evidence/forcing. The Determinist's claim that "It is true even if unverifiable" requires a classical meta-theory *about* the Kripke model (i.e., "In the meta-language, $p$ is true at $w_0$ even if $w_0 \nVdash p$"). The object language cannot express the Determinist's intuition without collapsing to CPC.

  *   **Causality and Agency:**
      *   *Philosophy:* A major motivation for the Open Future is human agency (we can *make* it true or false).
      *   *Formalism:* Kripke frames are static structures. The "choice" of a branch is external to the model (meta-theoretic). There is no operator for "Agent $A$ brings it about that $\phi$."
      *   *Loss:* The translation captures the *logical* status of the proposition but strips the *causal* stakes. The "Openness" is structural (branching), not agential.

  *   **The "Thin" Present:**
      *   *Philosophy:* Aristotle's argument hinges on the asymmetry between the fixed past and the open future.
      *   *Formalism:* Standard Kripke semantics for IPC is temporally symmetric regarding the order $\leq$. While we interpret $\leq$ as "future," the logic doesn't inherently distinguish "past" nodes from "future" nodes except by index.
      *   *Loss:* To capture the asymmetry (Past is linear/classical, Future is branching/intuitionistic), you need a more complex frame condition (e.g., the "past" cone of $w_0$ is a singleton chain, the "future" cone branches). Standard IPC does not enforce this; it allows branching into the "past" (if we interpret $\leq$ purely informationally).

  ***

  ### Part 3: The Intermediate Logic Caveat

  You suspected one side corresponds to a specific intermediate logic. Here is the honest mapping:

  **1. The Open Future $\approx$ Intuitionistic Logic (IPC)**
  *   **Logic:** IPC.
  *   **Frame Condition:** All partial orders.
  *   **Status:** This is the baseline. It refutes LEM ($\nvdash p \lor \neg p$).
  *   **Honesty Check:** This formalization treats *all* propositions as potentially open. A philosopher might argue only *future* contingents lack truth values, while math remains classical. IPC forces you to be intuitionistic everywhere unless you add axioms.

  **2. The Determinist $\approx$ Classical Logic (CPC)**
  *   **Logic:** CPC.
  *   **Frame Condition:** Trivial frames (every node is maximal, $w \leq v \implies w=v$).
  *   **Status:** Validates LEM.
  *   **Honesty Check:** This is the only way to get full LEM in standard Kripke semantics. It forces the "Determinist" to accept classical logic for *everything*, not just future contingents.

  **3. The "Eventually Settled" View $\approx$ Jankov Logic (KC)**
  *   **Logic:** **KC** (Intuitionistic Logic + Weak Excluded Middle: $\neg \phi \lor \neg \neg \phi$).
  *   **Frame Condition:** Frames with a **greatest element** (a final world $w_{max}$ such that $\forall w, w \leq w_{max}$).
  *   **Philosophical Mapping:** This captures a nuanced position: "The future is open *now*, but ultimately determined." At $w_0$, $p \lor \neg p$ may fail. But at $w_{max}$, everything is decided.
  *   **Validation:** KC validates $\neg \phi \lor \neg \neg \phi$ (it is not the case that $\phi$ is undecided), but it *does not* validate $\phi \lor \neg \phi$.
  *   **Why this matters:** If the Determinist argues "The truth value exists *eventually*," KC is the formal counterpart. If they argue "The truth value exists *now*," they need CPC.

  **4. The "Linear Time" View $\approx$ Gödel-Dummett Logic (LC)**
  *   **Logic:** **LC** (IPC + $(\phi \to \psi) \lor (\psi \to \phi)$).
  *   **Frame Condition:** **Linear** frames (total orders).
  *   **Philosophical Mapping:** This captures "Time is a line, but we don't know the values yet." LEM still fails, but the branching is removed.
  *   **Residue:** This refutes the "Branching" intuition of the Open Future. It suggests the future is unique but unknown (epistemic openness), rather than ontologically multiple.

  **Summary of the Formalization Defect:**
  The primary defect is that standard Kripke semantics for intermediate logics conflates **ontological openness** (many futures exist) with **epistemic openness** (one future exists, we don't know it).
  *   To model **Ontological Openness**, you need branching frames + IPC.
  *   To model **Epistemic Openness**, you need linear frames + IPC.
  *   The philosophical debate is usually about Ontological Openness. Therefore, **IPC on Branching Frames** is the faithful translation of the Open Future.
  *   However, the Determinist who claims "Bivalence holds" is forced into **CPC**, which collapses the frame. There is no intermediate logic that validates LEM for *atomic* propositions (future contingents) while keeping it intuitionistic for *complex* propositions, within the standard Kripke setup. To do that, you would need a non-uniform valuation or a modal extension, which lies outside the vocabulary of intermediate logics proper.
