answer: |-
  Your roommate's summary is **about 80% accurate according to standard neoclassical decision theory**, but it glosses over significant nuances in behavioral economics and organizational theory. Your intuition that something feels "off" is correct—specifically regarding the psychological mechanisms and the rigidity of the "always irrational" claim.

  Here is an audit of their claims, broken down by concept.

  ### 1. The Core Claim: "Honoring sunk costs is always irrational."
  *   **Verdict:** **Technically True (Normatively), False (Descriptively).**
  *   **The Theory:** In standard Expected Utility Theory (neoclassical economics), rationality is indeed strictly forward-looking. A "sunk cost" is defined as a resource that has been spent and cannot be recovered. Therefore, it should not influence marginal decision-making. If you stay in a bad job *only* because you've already spent five years there, that is the definition of the **Sunk Cost Fallacy**.
  *   **The Nuance:** The word "always" is the weak point. In **bounded rationality** (Herbert Simon), using past investment as a heuristic can sometimes be efficient. For example, if you've invested time in learning a software, sticking with it might be rational not because of the time spent, but because the *switching costs* to learn a new one are high. Roommate conflates "sunk costs" with "switching costs."
  *   **Correction:** It is irrational to let sunk costs dictate decisions *ceteris paribus* (all else being equal). But "all else" is rarely equal.

  ### 2. The Mechanism: "People do it mostly from loss aversion."
  *   **Verdict:** **Incomplete.**
  *   **The Theory:** Your roommate is referencing Prospect Theory (Kahneman & Tversky). Loss aversion suggests that the pain of realizing a loss (admitting the movie was a waste of time) is psychologically twice as powerful as the pleasure of an equivalent gain. This drives people to "throw good money after bad" to avoid closing the account in the red.
  *   **The Conflation:** Loss aversion is a major driver, but not the *only* one. Decision theorists identify at least three other distinct mechanisms:
      1.  **Consistency Bias:** (Cialdini) The desire to appear consistent with past commitments.
      2.  **Waste Aversion:** A normative belief that "wasting" resources is morally wrong, regardless of future utility.
      3.  **Emotional Attachment:** Endowment effect applied to experiences.
  *   **Audit:** Your skepticism is warranted. Blaming it all on loss aversion ignores the social and moral dimensions of why people stick with bad plans.

  ### 3. The Signaling "Exception": "Finishing is rational as a reputation move."
  *   **Verdict:** **Coherent, but semantically tricky.**
  *   **The Logic:** Your roommate makes a very sharp distinction here: *"That's still not honoring the sunk cost itself—it's just a new forward-looking reason."*
  *   **Why this is correct:** If staying in a bad job preserves your reputation for reliability, that reputation is a **future asset**. Therefore, the cost of staying is no longer "sunk"; it is an **investment** in future employability.
  *   **The Critique:** Calling it an "exception to the fallacy" is slightly confusing. It's more accurate to say it **disqualifies the situation from being a fallacy in the first place.** If there is a future payoff (signaling), the past cost isn't the reason you are staying; the future benefit is.
  *   **Coherence Check:** His framing is logically coherent. He is correctly identifying that what *looks* like a sunk cost fallacy is often a strategic signaling game. However, he implies this is the *only* valid reason to continue, which is too narrow (see "Switching Costs" below).

  ### 4. The Niche Idea: "Relational Sunk Costs."
  *   **Verdict:** **Real Concept, Non-Standard Terminology.**
  *   **What it likely is:** Your roommate is likely paraphrasing concepts from **Organizational Economics** or **Philosophy of Action**.
      *   **Asset Specificity:** In transaction cost economics (Oliver Williamson), investments made specifically for one relationship (like learning a partner's workflow) lose value if the relationship ends.
      *   **Common Ground:** In linguistics and collaboration (Herbert Clark), teams build "common ground." Discontinuity destroys this shared context, requiring expensive rebuilding.
      *   **Team-Specific Capital:** The idea that a group creates a value greater than the sum of individuals, which evaporates if the group dissolves.
  *   **Is it valid?** Yes. In artistic or high-trust collaborations, the "value" isn't just the output; it's the **shared mental model**. If you quit halfway, you destroy the "shared meaning" that makes the collaboration unique. Continuing isn't about the time already spent; it's about preserving the **integrity of the shared asset**.
  *   **Audit:** This isn't a made-up concept, but "Relational Sunk Cost" isn't a standard textbook term. It's a valid synthesis of *relationship-specific investment* and *common ground theory*.

  ### 5. What Your Roommate Missed (The "Off" Feeling)
  Your intuition that the summary feels incomplete is correct because it ignores **Switching Costs** and **Option Value**.

  1.  **Switching Costs:** Sometimes you finish a bad project not because of signaling or sunk costs, but because starting a new one requires a massive upfront energy spike. That is a *future* cost, not a past one. Rationality dictates comparing the cost of finishing vs. the cost of switching.
  2.  **Option Value:** Sometimes you continue a marginal project because it keeps a door open (real options theory). Quitting closes the option forever; continuing keeps the *possibility* of a turnaround alive. That is forward-looking, not backward-looking.

  ### Final Verdict on the Roommate's Framing

  **Is "Always irrational except for signaling" coherent?**
  It is **logically consistent** within a strict definition of rationality, but it is **empirically brittle**.
  *   **Coherent:** Yes, because if signaling exists, it's not a sunk cost fallacy by definition.
  *   **Brittle:** No, because it ignores switching costs, learning value, and option value as valid forward-looking reasons to continue.

  **Summary Audit:**
  *   **Rationality is forward-looking:** ✅ Accurate (Normative).
  *   **Loss aversion is the main driver:** ⚠️ Partial (Ignores consistency/waste norms).
  *   **Signaling reclassifies the cost:** ✅ Accurate (Sharp insight).
  *   **"Relational Sunk Costs":** ✅ Valid concept (Asset specificity/Common ground), though non-standard phrasing.
  *   **"Always irrational":** ❌ Too rigid (Ignores switching costs/option value).

  **Advice:** Tell your roommate they have a strong grasp of the *logic*, but they are conflating **psychological drivers** (loss aversion) with **structural constraints** (switching costs/asset specificity). The "Relational" idea is the most sophisticated part of their argument—it acknowledges that in collaborations, the "product" is the relationship itself, and damaging that has future costs.
