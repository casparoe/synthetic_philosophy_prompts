  1. The mechanism inputs auditory novelty and outputs unilateral hemispheric arousal, prioritizing false alarms over missed detections because the cost of sleeping through an intruder exceeds the cost of lost rest. Ignoring explicit safety information is a design feature preventing costly deception by competitors or environmental misclassification during vulnerable states.
  2. If this is a vigilance adaptation, response latency to novel biological sounds will be faster in the alert hemisphere than to mechanical noises, whereas general stress predicts uniform slowing. Additionally, pharmacological suppression of the alert hemisphere should increase vulnerability to simulated intrusions without subjectively increasing anxiety.
  3. The post-hoc generation is irrelevant because the hypothesis yields novel, risky predictions rather than merely accommodating known data. The lack of ancestral data matters less than the universal computational logic, and a by-product story cannot easily explain the specific hemispheric asymmetry without invoking similar functional assumptions.
  4. The critical feature is the explicit cost-benefit ratio defining the threshold for arousal, which quantifies the adaptation rather than labeling it. Deleting this trade-off reduces the explanation to a descriptive tautology where any sleep disturbance becomes evidence for the theory rather than a testable constraint.
  5. The skeptic should argue that this is developmental plasticity calibrated to individual risk rather than a fixed species-typical adaptation. The honest reply is that the functional logic remains identical, but the hypothesis would be refuted if the asymmetry vanished in populations where the metabolic cost of sleep loss historically exceeded the risk of nocturnal intrusion.
