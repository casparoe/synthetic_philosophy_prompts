answer: |-
  ### The Case for Grip-Relativized Accuracy

  Accuracy-first epistemology has long been haunted by the specter of logical omniscience. The standard dominance arguments—those elegant proofs showing that non-probabilistic credence functions are accuracy-dominated by probabilistic ones—presuppose a domain of evaluation that is the agent's full algebra of propositions. But human agents do not possess full algebras. We possess *grips*.

  Here is the proposal: **Grip-Relativism about Accuracy.**

  Let a **Grip** be the partition of possibility space an agent actually draws distinctions along in a given context. If you are deciding on dinner, your grip is $G = \{ \text{Pasta}, \text{Pizza}, \text{Thai} \}$. Propositions finer than this (e.g., "Pasta with marinara") or logically orthogonal to it (e.g., "The 10th digit of pi is 9") are not cells in your grip; they are lumped into the background or ignored entirely.

  The thesis is simple: **Epistemic inaccuracy is measured only relative to the truth values of the cells in the agent's current grip.**

  This move yields a **Partition-Relative Probabilism**: Rationality requires that an agent's credences sum to 1 and are non-negative *over the cells of their grip*. It imposes no requirements on propositions outside that partition. This is not a bug; it is the feature that saves accuracy-firstism from inhumanity.

  #### 1. The Restricted Dominance Argument

  The standard accuracy argument (à la Joyce) proceeds by showing that if your credences violate the probability axioms over a full algebra $\mathcal{F}$, there exists an alternative set of credences that is closer to the truth in every possible world.

  Grip-relativism restricts the domain of the scoring rule. Let $G = \{g_1, \dots, g_n\}$ be the agent's grip. Let $v_w$ be the valuation function at world $w$, but restricted to $G$. That is, $v_w(g_i) = 1$ if $g_i$ is true in $w$, and 0 otherwise. We evaluate the inaccuracy of a credence function $c$ using a strictly proper scoring rule (like the Brier score) summed only over $G$:

  $$ I_G(c, w) = \sum_{i=1}^n (c(g_i) - v_w(g_i))^2 $$

  The mathematics of dominance remains intact within this domain. If $\sum c(g_i) \neq 1$ or if any $c(g_i) < 0$, there exists a $c^*$ such that $I_G(c^*, w) < I_G(c, w)$ for all $w$. Thus, accuracy considerations *do* mandate probabilism **on the grip**.

  However, for any proposition $p$ that is not a union of cells in $G$ (i.e., a distinction the agent is not drawing), $p$ does not appear in the summation. Violating probability axioms regarding $p$ contributes nothing to the inaccuracy score. Therefore, the dominance argument fails to generate norms for propositions outside the grip. The agent is rationally permitted to have no credence in $p$, or incoherent credences regarding $p$, without epistemic penalty.

  #### 2. The Feature: Dodging Logical Omniscience

  The primary motivation for this view is that it aligns epistemic normativity with cognitive capacity.

  Standard accuracy-firstism implies that if you believe $A$ and believe $A \to B$, but fail to believe $B$ because you haven't noticed the connection, you are epistemically defective. Your credences are dominated relative to the algebra containing $B$. This makes rationality a property of gods, not humans.

  Grip-relativism explains why we don't hold people responsible for incoherence they never notice. If $B$ is not in your grip—if you haven't drawn the distinction required to formulate $B$—then your accuracy score is blind to $B$. You cannot be inaccurate about a question you aren't asking.

  This preserves the core intuition of accuracy-firstism (that truth is the goal) while acknowledging that the *pursuit* of truth is local. We are not penalized for missing truths that lie outside our current cognitive horizon. Rationality becomes a matter of coherence among the options currently on the table, not coherence among all options that logically exist.

  #### 3. Objection 1: The Exploitability Worry

  **The Objection:** If grip-relativism allows incoherence off the partition, doesn't it leave the agent vulnerable to Dutch Books? A clever bookie could construct a series of bets based on the finer distinctions the agent ignores, pumping money out of them. Furthermore, a "future self" who expands their grip will look back and see the past self's credences as incoherent. If rationality permits exploitation, is it really rationality?

  **The Reply:** This objection conflates *epistemic rationality* with *pragmatic prudence*, and *synchronic* norms with *diachronic* ones.

  First, regarding the bookie: A Dutch Book argument demonstrates pragmatic inconsistency, not necessarily epistemic inaccuracy. More importantly, for a bookie to exploit an agent, the agent must *accept the bets*. To accept a bet on a proposition $p$, the agent must grasp $p$. If $p$ is outside the agent's grip, the agent literally cannot entertain the bet as described. They might accept a bet on "Pasta," but they cannot accept a bet on "Pasta with marinara" if they aren't distinguishing the sauces. The bookie is playing a game the agent isn't in. The vulnerability exists only if the agent is forced to operate on an algebra finer than their grip, which violates the premise of the relativism.

  Second, regarding the future self: It is true that if I expand my grip tomorrow, I may judge my current credences as incoherent. But grip-relativism is a *synchronic* norm. It tells you how to arrange your credences given your *current* cognitive reach. It does not promise that your current credences will remain optimal if you become a cognitively different agent tomorrow. Rationality is relative to the agent's state at time $t$. That Future-Me has a wider grip makes Future-Me subject to stricter norms, but it does not retroactively make Past-Me irrational for failing to meet norms that were, at the time, cognitively inaccessible.

  #### 4. Objection 2: The Psychologism Worry

  **The Objection:** Epistemology is normative; it tells us what we *ought* to believe, not what we *do* believe. By tying the domain of accuracy to "grip"—a psychological, descriptive fact about what distinctions an agent is actually drawing—you are reducing normativity to psychology. You are letting agents off the hook simply because they are intellectually lazy or limited. Shouldn't the norm be to expand your grip?

  **The Reply:** This objection misunderstands the role of "ought implies can."

  Grip-relativism does not claim that "whatever you think is fine." It claims that "whatever you think must be coherent *relative to what you can think*." This is not psychologism in the reductionist sense; it is **capacity-constrained normativity**.

  Consider an ethical analogy. A moral theory might say, "You ought to save the drowning child." It does not say, "You ought to save every drowning child in the world." The scope of the obligation is determined by the agent's reach and capacity. If I am unaware a child is drowning, I am not morally blameworthy for not saving them. Similarly, if I am unaware of a logical distinction, I am not epistemically blameworthy for failing to have coherent credences regarding it.

  Furthermore, grip-relativism does not forbid a norm to *expand* one's grip. We can have a secondary norm of "Inquisitiveness" or "Reflection" that encourages agents to refine their partitions. But until that refinement happens, the primary norm of Accuracy applies only to the existing grip. To demand accuracy over a full algebra is to demand the agent perform calculations on variables they do not possess. That is not a normative demand; it is a category error.

  #### Conclusion

  Grip-relativism saves accuracy-first epistemology from its own most damaging implication. By restricting the domain of the scoring rule to the partition the agent actually grips, we retain the mathematical rigor of the dominance argument for probabilism while shedding the requirement of logical omniscience.

  It acknowledges that epistemic evaluation is an evaluation of *agency*, and agency is always bounded. We are not penalized for the truths we cannot see, only for the incoherence among the truths we are currently holding. This makes accuracy-firstism a theory for human beings, not just for idealized reasoners. It turns the limitation of the grip from a failure of rationality into the very boundary condition of rational evaluation.
