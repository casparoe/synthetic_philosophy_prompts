answer: |-
  1. Brainstorm dump
  *   Is work the output or the sweat?
  *   If AI outputs, did we sweat?
  *   Care work: no object, just relation.
  *   Cognitive residue: the itch to check the AI.
  *   Is anxiety labor?
  *   Social recognition: does a tree falling in forest make sound?
  *   Effort without purpose: is that work or punishment?
  *   Automation kills tasks, not roles?
  *   Bullshit jobs: useful vs. occupied.
  *   Play vs. Work boundary.
  *   Does "value" come from the market or the act?
  *   If I enjoy it, is it still work?
  *   Who decides if it's useful: you or the boss?

  2. The tree
  **Does work require producing something outside yourself?**

  *   **YES** → **If a machine makes the thing perfectly, is there anything left for you to do?**
      *   **NO** → **Leaf: Work is dead, celebrate it**
      *   **YES** → **Is that leftover task mostly just worrying about or checking the machine's output?**
          *   **YES** → **Leaf: Cognitive Residue**
          *   **NO** → *(Leads to Unoccupied Branch A)*

  *   **NO** → **Is the value in the struggle/effort itself?**
      *   **YES** → **Leaf: Work is just effort**
      *   **NO** → **Is the value in the relationship or care provided to another person?**
          *   **YES** → **Leaf: Work migrates to care**
          *   **NO** → *(Leads to Unoccupied Branch B)*

  *Flag:* This tree struggles to seperate **Cognitive Residue** from **Work is just effort**. If checking the AI is "effort," those two leaves might overlap depending on how much you hate the checking.

  3. Leaf descriptions
  **Work is dead, celebrate it**
  This position says if AI can build the house and write the law, human labor is obsolete and we should stop pretending otherwise. The awkward commitment here is admitting that most people need to find meaning in leisure without feeling useless or dependent on handouts.

  **Work migrates to care and relationship labor**
  This view argues that when objects are free, the only scarce thing left is genuine human connection, like nursing or parenting. The awkward commitment is accepting that society must value emotional labor higher than engineering, even though markets currently pay the opposite.

  **Work is just effort, so AI can't kill it**
  Here, work is defined by the friction you feel, not the result, so even if AI does the task, your struggle to understand it counts. The awkward commitment is implying that digging a hole and filling it back in is "work" if it's hard, even if it produces nothing useful.

  **Cognitive Residue**
  This stance claims that supervising AI creates a specific mental friction—worrying about errors—that constitutes a new form of labor. The awkward commitment is saying your anxiety about the machine's mistake is the actual job, not the result the machine produced.

  4. Unoccupied branches
  **Branch A (External Product + Machine Does It + Human Does Something Else):** This implies humans still make things alongside perfect machines, but not for care or checking. It's mostly incoherent; why would we make things if machines do it better, unless it's a hobby (which falls under Effort)?

  **Branch B (No External Product + No Effort + No Care):** This would be work that is internal, easy, and solitary. It sounds like daydreaming or pure play. There are no defenders calling this "work" because it lacks the social ontology of obligation or strain.

  5. How to use it
  Turn the bolded questions into a 5-step quiz where users click Yes or No. At the end, drop them into the leaf description that matches their path and ask them to share their "Work Archetype" on social media.
