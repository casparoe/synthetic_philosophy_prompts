answer: |-
  To reconstruct the implicit theory at the level of strict presupposition, we must discard the surface-level justifications (protecting the poor, ensuring altruism) and look at the ontological commitments required to hold these two positions simultaneously. The system you describe is not logically consistent if viewed through the lens of *welfare* or *coercion*. It is only consistent if viewed through the lens of **categorization** and **social meaning**.

  Here is the reconstruction of the operative theory, followed by the analysis of your monopsony test case.

  ### I. The Implicit Theory: Labor vs. Inventory

  For the research/organ contrast to hold, the ethical framework must presuppose a specific distinction between **leasing bodily capacity** and **alienating bodily integrity**.

  **1. The Research Fiction (The Body as Agent)**
  The research board's doctrine—that payment is for "time and inconvenience" and not "risk"—is not merely a lie; it is a necessary legal and ethical fiction. For the system to function without admitting to the sale of health, it must presuppose that the volunteer is selling **labor**, not **flesh**.
  *   **The Presupposition:** In research, the body is the *instrument* of the work, not the *object* of the sale.
  *   **The Logic:** When a researcher inserts a catheter, they are employing the subject's body to perform a task (tolerating the catheter). The payment is a wage. The fact that wages are scaled to "hazard" (risk/invasiveness) is consistent with labor law (coal miners earn more than clerks), not market pricing for body parts.
  *   **The Requirement:** This requires viewing the body as regenerative or restorable. The invasion is temporary; the integrity is compromised but not diminished permanently. The subject remains a whole agent who has *worked*, not a wholesaler who has *shipped stock*.

  **2. The Organ Prohibition (The Body as Inventory)**
  The ban on organ sales presupposes that specific biological materials are **constitutive of the self** in a way that fluids or temporary invasions are not.
  *   **The Presupposition:** Organs are not "parts" the body *has*; they are aspects of the body the body *is*.
  *   **The Logic:** Plasma, sperm, and eggs are classified as "excess" or "fluids"—things the body produces and sheds. They are treated as inventory. A kidney is treated as structural integrity. To sell a kidney is to treat the self as a warehouse of separable assets.
  *   **The Requirement:** This requires a hierarchy of bodily material. The theory must assert that there is a threshold of biological significance where "giving" transitions from "donation" to "dismemberment."

  **3. The Role of Money (Expressive Harm)**
  The system presupposes that money is not a neutral medium of exchange but a **categorizing force**.
  *   **The Presupposition:** Introducing a price tag changes the *ontology* of the transaction, not just the economics.
  *   **The Logic:** In research, the wage confirms the subject's status as a worker (an agent). In organ sales, a price confirms the donor's status as a vendor (an object/source). The ban exists to prevent the social meaning of the human body from shifting from "sacred/inviolable" to "fungible inventory."

  ### II. The Monopsony Test Case

  You propose a state monopsony: a single government buyer, fixed price, annuity, priority queue. This removes the standard "exploitation" argument (no private predators, no bidding wars, standardized safety).

  If a theorist still objects to this arrangement, the objection can no longer be about **coercion** or **welfare**. It must be about **degradation**.

  **1. The Residue of the Objection**
  If exploitation is removed, the remaining objection is that the transaction creates an **Expressive Harm** to third parties and the social fabric.
  *   **The Claim:** Even if the seller is not exploited, the *existence* of the market declares that human bodies are the kind of thing that *can* be priced.
  *   **The Strict Presupposition:** The state is not exempt from the logic of commodification. A state price is still a price. The objection presupposes that certain goods (constitutive organs) are **incommensurable** with money. To put a price on them is to make a category error that degrades the status of all bodies, even those not sold.
  *   **Why it matters:** In the research model, the "wage" preserves the subject's dignity as a worker. In the organ model, even a state "price" reduces the donor to a supplier. The objection is that the market norm crowds out the moral norm of "gift" or "solidarity," replacing it with "supply chain."

  **2. What Becomes Indefensible?**
  If the ban rests on this residue (the prohibition against categorizing the body as inventory) rather than exploitation, several current practices become logically indefensible. They are currently tolerated only because we pretend the ban is about *exploitation*. If the ban is about *commodification*, the following must change:

  *   **Priority Queueing (The "Reciprocity" Loophole):**
      *   *Current Practice:* In some systems, living donors get priority if they later need an organ.
      *   *The Conflict:* This is a **quid pro quo**. It is a deferred payment. If the objection to selling kidneys is that it turns the body into a tradeable asset, then trading a kidney *for a future kidney* is functionally identical to trading a kidney for money. It instrumentalizes the donation.
      *   *The Consequence:* If the theory is strict, priority queueing for living donors must be banned. Donation must be purely altruistic (a gift) or purely labor (paid), but not a barter system.

  *   **High "Reimbursements":**
      *   *Current Practice:* Donors are reimbursed for lost wages, travel, medical costs, sometimes with generous "per diems."
      *   *The Conflict:* If reimbursements exceed actual documented loss, they become de facto prices. If the theory forbids pricing the organ, it must strictly cap reimbursement at *marginal cost*. Any "annuity" (as in your monopsony case) is a price.
      *   *The Consequence:* Strict adherence would require eliminating all financial benefits beyond direct out-of-pocket expenses. The "annuity" in your monopsony case would be impermissible.

  *   **Public Honors and "Hero" Narratives:**
      *   *Current Practice:* Donors are publicly honored, given medals, or celebrated.
      *   *The Conflict:* This is **social currency**. If money is forbidden because it commodifies the act, social status is also a currency. Honoring donors creates a "market" for prestige. It induces donation through non-financial payment.
      *   *The Consequence:* A strictly non-commodified system would require anonymity and the absence of public recognition. The act must be invisible to remain a "gift" rather than a transaction for status.

  *   **Paid Research Risk Scaling:**
      *   *Current Practice:* As you noted, research pay scales with risk.
      *   *The Conflict:* If the organ ban is about not pricing bodily integrity, then research pay scaling is a slippery slope. If I am paid $5,000 to risk a 1% chance of kidney failure, am I not effectively pricing my kidney at $500,000?
      *   *The Consequence:* To be consistent, research payment must be flattened. It must be strictly hourly, with no "hazard pay." Any premium for risk admits that the body is being rented for its vulnerability, which edges toward the organ-sale prohibition.

  ### III. Summary of the Reconstruction

  The logic you are struggling to reconstruct is not based on **harm prevention** (since the monopsony solves the coercion issue), but on **status preservation**.

  1.  **The Distinction:** The system distinguishes between **Bodily Labor** (research, surrogacy, plasma) which is permissible to sell, and **Bodily Integrity** (organs) which is not. The line is drawn at "constitutive parts" vs. "fluids/services."
  2.  **The Contradiction:** The research side masks the pricing of risk as "hazard pay" to maintain the fiction of labor. The organ side bans pricing to maintain the fiction of the body as inviolable.
  3.  **The Monopsony Implication:** If a theorist objects to the state monopsony, they are admitting that the prohibition is **symbolic**, not economic. They are arguing that the *category* of "priced organ" is socially destructive regardless of the buyer's identity or the seller's welfare.
  4.  **The Collapse:** If this symbolic prohibition is the true foundation, then **priority queues, status honors, and risk-scaled research pay** are all violations. They are all forms of payment (deferred, social, or hazard-based) that acknowledge the body as a source of value to be exchanged.

  The system holds together only because it refuses to follow its own logic to the end. It tolerates "soft" commodification (honors, priority, hazard pay) while banning "hard" commodification (cash for kidneys) to maintain a plausible deniability that the body is not for sale, even while it is routinely rented, invaded, and leveraged.
