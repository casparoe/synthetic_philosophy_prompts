answer: |-
  1. **The Immune System Analogy**
      "I want to start with a biology analogy. In immunology, the body suppresses self-recognition to avoid attacking its own tissue. It's a functional suppression. Is that structurally like belief management, or is it just mechanics without any mental content?"
      **Follow-up:** If she says it's just biology and not belief, hit her with this: "If the functional outcome is identical—suppressing truth to maintain system integrity—why does the label 'belief' matter more than the mechanics? Are we just protecting a definition?"

  2. **Artificial Systems and Contradiction**
      "Think about large AI models. They can have contradictory weights in different layers and behave inconsistently depending on the prompt. Is that structurally analogous to self-deception, or is it just architecture with no unified subject?"
      **Follow-up:** If she says there's no agent there to deceive, ask: "Does that imply humans are just more complex architecture too? Where does the 'agent' magic happen that makes our contradictions different from a neural net's?"

  3. **Conceptual vs. Empirical Claim**
      "I need to pin down the status of your claim. Is your view that self-deception is conceptually incoherent, like a square circle, or merely empirically absent, like unicorns?"
      **Follow-up:** Press her on evidence: "If it's conceptually impossible, what clinical evidence—like split-brain cases or severe dissociation—could actually move you? Or is the theory immune to data?"

  4. **The Partitionist Reply**
      "Partitionists argue the mind has separate boxes so contradictions never actually meet in the same space. How does your eliminativism differ from that? Isn't 'subpersonal processing' just a fancy name for partitions that don't quite reach belief status?"

  5. **Deflationary Collapse**
      "Does your view collapse into a deflationary account once you allow indexical or temporal shifts? Like, if I believe X now and not-X later, or believe X in context A and not-X in context B, there's no contradiction at any single time *t*. Is that all you're saying?"

  6. **Sincere Reports of Deception**
      "What do you say to people who sincerely report feeling deceived by themselves? They feel the tension and the conflict. Are they just misdescribing subpersonal noise, or is there a phenomenological error in how we experience our own minds?"

  7. **The Doxastic Boundary**
      "You argue that these conflicting states never reach full doxastic status. Where do you draw the line? What makes a belief a belief in your framework, and why do these subpersonal states fail to cross that threshold?"

  8. **Responsibility and Ethics**
      "Since I've been reading some ethics, this bugs me: If I can't genuinely deceive myself, am I responsible for my biases? Or does eliminativism let us off the hook for irrationality because it's just 'processing' rather than a choice?"

  9. **Scientific Bias**
      "For scientists handling data, we talk about 'believing' our hypotheses too much. If self-deception is impossible, how should we talk about confirmation bias? Are we just describing subpersonal optimization gone wrong?"

  10. **The Takeaway for Scientists**
      "Wrapping up: What's the one thing you want scientists to take away about their own minds from this view? If we stop looking for self-deception, what should we be looking for instead?"
