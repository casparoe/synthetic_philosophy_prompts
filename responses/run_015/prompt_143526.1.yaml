          *   *Cosmopolitan Right:* Hospitality requires human judgment regarding intent and harm. Algorithmic standing risks treating humans as data points, not juridical persons.
          *   *Conclusion:* The scheme is suspicious. It seeks peace through heteronomy (external determination) rather than autonomy (self-legislation via reason).

