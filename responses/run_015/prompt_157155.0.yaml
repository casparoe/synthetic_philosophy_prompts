      *   *Check:* Did "Two Dogmas" explicitly call for psychology? *Correction:* No, it ended with a pragmatic view of science. "Epistemology Naturalized" came later.
      *   *Check:* Is the user right about the "sharp line"? *Correction:* Yes, Quine's argument is semantic/conceptual, not just pragmatic. The roommate made it sound purely pragmatic (we *could* change it), but Quine argues we don't even know *what* we mean when we say it's analytic.

