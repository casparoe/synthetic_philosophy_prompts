      *   *Analysis:* They conflated "Knowledge implies truth" (Factivity) with "Transparency/KK". They explicitly wrote "Knowledge implies truth... so knowing that p isn't known means that p isn't known." That is Factivity ($Kp \to p$). But then they labeled this "transparency... in a position to know that you know it." This is a terminology mix-up that leads to a wrong philosophical conclusion.
