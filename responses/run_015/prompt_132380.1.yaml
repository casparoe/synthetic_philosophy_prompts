  **Scenario**

  The Director of Municipal Public Health must commit a fixed budget to either Protocol A (Automated Surveillance), which maximizes QALYs by aggressively tracking infection vectors but bypasses individual consent, or Protocol B (Manual Consent), which saves fewer lives but strictly adheres to privacy rights. The Director holds 40% credence in Threshold Deontology (TD), 35% in Scalar Consequentialism (SC), and 25% in Contractualism (C). Furthermore, the Director is uncertain whether the correct metric for intertheoretic comparison is Linear (rights violations weigh proportionally against QALYs) or Multiplicative (rights violations above a threshold weigh catastrophically against QALYs). Under the Linear metric, TD assigns Protocol A a choice-worthiness of -10 and B a 0; SC assigns A +100 and B -50; C assigns A -5 and B 0. Under the Multiplicative metric, TD assigns A -1000 (catastrophic rights violation) while other scores remain stable. The Director must choose now, before the metric uncertainty is resolved.

  **Decision Problem and Procedures**

  The agent faces a choice between {A, B} under normative uncertainty across theories $T = \{TD, SC, C\}$ and metanormative uncertainty across metrics $M = \{Linear, Multiplicative\}$.
  1.  **MEC (Maximize Expected Choice-worthiness):** Calculates expected value using credences in $T$, stipulating the *Linear* metric for intertheoretic comparison regardless of metanormative uncertainty.
  2.  **Maximin-over-Theories:** Selects the option with the highest minimum choice-worthiness score, considering the worst-case outcome across all combinations of $T$ and $M$.
  3.  **MFT (My Favorite Theory):** Follows the recommendation of the theory with the highest credence ($TD$ at 40%), accounting for $TD$'s own sensitivity to metric uncertainty.

  **Verdicts and Reasoning**

  *   **MEC recommends Protocol A.** Using the stipulated Linear metric: $EV(A) = (0.4 \times -10) + (0.35 \times 100) + (0.25 \times -5) = 29.75$. $EV(B) = (0.4 \times 0) + (0.35 \times -50) + (0.25 \times 0) = -17.5$. Since $29.75 > -17.5$, MEC selects A. The procedure ignores the Multiplicative metric possibility by design.
  *   **Maximin recommends Protocol B.** The procedure scans the worst-case scores across all theory/metric combinations. For A, the worst case is $TD$ under the Multiplicative metric (-1000). For B, the worst case is $SC$ under either metric (-50). Since $-50 > -1000$, Maximin selects B to avoid the catastrophic rights-violation weight.
  *   **MFT recommends Protocol B.** The favorite theory is $TD$ (40%). $TD$ prefers B (0) over A (-10 Linear, -1000 Multiplicative). Regardless of which metric obtains, $TD$ ranks B higher than A. Thus, MFT selects B.

  **Structural Feature Analysis**

  The divergence between MEC and Maximin arises specifically from the **treatment of incommensurable worst-case weights under second-order metric uncertainty**. MEC flattens the metric uncertainty by stipulating linearity, thereby masking the catastrophic weight $TD$ assigns to A under the Multiplicative metric. Maximin, conversely, treats the metric uncertainty as a state of nature affecting choice-worthiness magnitudes; it identifies the Multiplicative/$TD$ combination as a catastrophic risk for A that dominates the worst-case calculation. The structural feature doing the work is the non-linear transformation of moral weight in the Multiplicative metric, which MEC ignores but Maximin guards against.

  **Diagnostic**

  If we remove the feature by stipulating that all parties agree on a cardinal, Linear metric for intertheoretic comparison, the **MEC/Maximin divergence collapses**. Under fixed Linearity, the worst-case score for A becomes -10 ($TD$) and for B becomes -50 ($SC$). Maximin would then recommend A (-10 > -50), aligning with MEC. The MFT divergence (MFT choosing B while MEC chooses A) would remain, driven solely by the credence asymmetry rather than metric uncertainty. This confirms that the specific conflict between expected-value and risk-averse reasoning in this case is engineered by the second-order uncertainty about moral scaling.

  **Strongest Objection from an MEC Defender**

  An MEC defender would argue that **Maximin illegitimately reifies moral theories as decision-relevant states of nature**. Moral theories are not empirical risks that obtain or fail to obtain like weather states; they are competing descriptions of value. Applying Maximin over theories (or theory/metric combinations) treats normative uncertainty as if it were empirical risk, imposing risk-aversion onto the *value* itself rather than the *outcomes*. This "double-counts" risk: if a theory (like TD) already accounts for catastrophic weights internally, applying a risk-averse decision rule over that theory imposes a second layer of caution not justified by the normative claims themselves. Consequently, the Maximin verdict is artifactually driven by a category error in handling normative uncertainty.
