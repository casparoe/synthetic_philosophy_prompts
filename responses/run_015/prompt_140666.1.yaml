answer: |-
  You are not being dishonest, but you are optimizing for a flawed metric rather than the intended goal, so you should negotiate a compromise with the administration rather than demanding full credit or shutting down the club.

  The core issue here is a classic problem in organizational ethics known as Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. Your school wants to measure "sustained commitment to serving the community," but because that is hard to quantify, they substituted a proxy: "hours logged at a 501c3." You haven't lied about the proxy—you are actually there, and the work is real—but you have bypassed the underlying value the proxy was supposed to represent. This isn't fraud, but it is metric gaming, and it creates a tension between procedural honesty and substantive integrity.

  Your concern about displacement is ethically significant and suggests you understand the consequentialist angle better than your friend does. By making the path of least resistance too easy, you have lowered the barrier to entry in a way that might reduce the total net good. If students who were capable of driving neighbors or organizing food drives choose the letter-writing club simply because it fits into lunch, the community loses out on higher-impact service. The effort and sacrifice inherent in the original requirement were features, not bugs; they were meant to signal that the student prioritized service enough to inconvenience themselves. Removing that friction dilutes the signal of the endorsement for everyone, which is why the assistant principal is pushing back to protect the credential's value.

  However, shutting down the club is also ethically suboptimal because the work itself is genuinely good. The residents receive comfort, and the students are engaging in service, even if it is low-friction. The requirement is indeed broken because it excludes high-impact informal service (like your friend driving the neighbor) while including low-impact formal service (like your club). Since you cannot fix the school's policy single-handedly, the most ethical path is to acknowledge the validity of the administrator's concern while advocating for the value of your work.

  You should propose a compromise where the club continues, but the hours are capped or categorized differently. For example, suggest that letter-writing counts for a portion of the requirement—say, 40 hours—to acknowledge the service without allowing it to fully satisfy the "sustained commitment" metric. Offer to work with the administration to create a tiered system where high-effort informal service can be petitioned for credit, fixing the broken rule for future students. This approach validates the good you are doing, respects the intent of the endorsement, and solves the displacement problem by ensuring students still need to seek out higher-impact opportunities to get the full recognition.
