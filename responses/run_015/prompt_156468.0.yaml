      *(Refinement on Lamarckism)*: It's not just Lamarckian; it's *teleological*. The variation is directed toward a goal. This breaks the "blind variation" assumption of the Fundamental Theorem of Natural Selection.

  8.  **Final Polish:** Check against constraints.
