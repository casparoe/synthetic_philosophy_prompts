      *   *Competition:* Inter-specific or intra-specific competition for resources (compute, capital, talent).
      *   *Race to the Bottom:* Selection pressure favoring $r$-strategists over $K$-strategists, or high virulence strains.
      *   *First Mover Advantage:* Competitive exclusion principle / Priority effects.
      *   *Lock-in:* Alternative stable state / Hysteresis.
      *   *Coordination/Regulation:* Group selection / Multilevel selection / Enforcement mechanisms in mutualisms (sanctions).
      *   *Existential Risk:* Host extinction / Patch destruction.

  4.  **Address Test 1: Handicap-Cost vs. Substrate-Cost:**
      *   *Handicap-Cost:* Like a peacock's tail. Reduces survival/movement but signals quality or wins mates. In AI: Slower release, less profit, but still playing the same game.
      *   *Substrate-Cost:* Like hyper-virulence. Kills the host. In AI: Creates a system that destroys the economic/social substrate required for the AI to exist or be valuable.
      *   *Evaluation:* This distinction is sharp. The standard "tax" argument usually assumes Handicap (you lose the race). The safety argument *needs* Substrate (the race ends for everyone). If it's just Handicap, defection is rational. If it's Substrate, the game board vanishes.
