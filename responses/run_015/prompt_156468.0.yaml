      2.  Evaluation of Handicap vs. Substrate.
      3.  Evaluation of the Lamarckian/Design Constraint.
      4.  Residue Report (Clean, Fudged, Missing).

  *(Self-Correction on "Fudged"):* Be careful not to fudge it myself. If I say "Fitness = Profit," I need to note that Profit $\neq$ Reproductive Output in the long run if the system collapses.
  *(Self-Correction on "Ought"):* Ecology is descriptive. Safety is prescriptive. This is a category error that the translation hides.

