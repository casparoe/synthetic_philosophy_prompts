      *   *Test 2 (Lamarckian):* Acknowledge the breakdown of "blind variation."
      *   *Residue Report:* Be brutal about where the analogy fails. specifically on *foresight* and *normativity*.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Tragedy of the Commons." The user explicitly forbade leaving them with that. I need to dig deeper into *why* the ToC analogy is insufficient (e.g., lack of enforcement mechanisms, speed of change).
