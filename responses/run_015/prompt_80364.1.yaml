          3.  Slave as a living tool (vs. dead tool).
          4.  Beneficial and right (efficiency justification).
      *   **Hard Cases to Address:**
          1.  Living Tool: Resource vs. Agent with preferences.
          2.  Reason/Utility: Agent with no utility function of their own.
          3.  Efficiency/Right: Justification by efficiency alone.
      *   **Deliverable:** Translation, Hard Case Analysis, Residue Report (what maps, what distorts, what's missing), and an interpretive view on the residue (limit of economics vs. emptiness of Aristotle).
      *   **Constraint:** No bibliography/citations.

  2.  **Deconstruct Aristotle's Argument (Mental Sandbox):**
      *   *Natural vs. Legal:* Some people are inherently suited to be ruled, others to rule. War capture doesn't guarantee this fit.
      *   *Psychology:* Slave has deliberative faculty but it's "without authority" (akuron). They understand reason but don't generate it.
      *   *Ontology:* Slave is a *ktema* (possession) and an *organon* (tool). Animate vs. inanimate.
      *   *Normativity:* It's just (*dikaion*) and beneficial (*sympheron*) for both.

  3.  **Translate into Economic Vocabulary:**
      *   *Firm Boundary:* Coase/Williamson. Make-or-buy. Hierarchy vs. Market.
      *   *Principal-Agent:* Principal (Master) delegates to Agent (Slave). Usually involves information asymmetry and incentive alignment.
      *   *Property Rights:* Grossman-Hart-Moore. Residual control rights.
      *   *Human Capital:* Specific vs. General.
      *   *The "Limiting Case":* Total vertical integration. The agent is fully owned.

      *   *Drafting the Translation:*
          *   Natural Slave = Agent with low decision-making capability/high specificity to Principal's tech.
          *   Legal Slave = Misallocation of property rights due to exogenous shock (war).
          *   Soul/Reason = Cognitive capacity. Principal has the algorithm; Agent executes.
          *   Living Tool = Capital asset with biological maintenance costs but no independent objective function.
          *   Beneficial/Right = Pareto efficient or Kaldor-Hicks efficient within the hierarchy.

  4.  **Address the Hard Cases (The "Friction"):**

      *   *Case 1: Living Tool (Resource vs. Agent).*
          *   Econ view: Agents have preferences (utility functions). Tools do not.
          *   Aristotle's view: Slave is a tool *but* alive.
          *   Translation problem: If I model the slave as capital, I ignore their agency. If I model as agent, I need incentives. Aristotle says *no incentives needed* because they are part of the master's will.
          *   Economic concept: "Human Asset" vs. "Human Agent." In GHM (Grossman-Hart-Moore), assets don't have incentives; people do. Aristotle collapses this.

      *   *Case 2: Reason without Practical Reason (Utility Function).*
          *   Econ view: Rational choice requires a utility function $U(x)$.
          *   Aristotle's view: Slave has $U_{master}(x)$, not $U_{slave}(x)$.
          *   Translation problem: This violates the methodological individualism of economics. An agent without a distinct utility function isn't an agent; it's a constraint or a parameter.
          *   Economic concept: Perfect alignment? No, that's still two functions coinciding. This is *one* function.

      *   *Case 3: Beneficial and Right (Efficiency as Normativity).*
          *   Econ view: Positive vs. Normative. Efficiency $\neq$ Justice (unless Utilitarian).
          *   Aristotle's view: The *telos* defines the good. If it fulfills the function, it is just.
          *   Translation problem: Economics separates "is" (efficiency) from "ought" (welfare weights). Aristotle merges them.
          *   Economic concept: Pareto improvement? But who consents?

  5.  **Develop the Residue Report:**
      *   *Maps Cleanly:* The boundary of the firm logic (hierarchy replaces market). The distinction between efficient matching (natural) and inefficient matching (legal/war).
      *   *Distorted:* The "living tool" becomes "owned human capital." The "reason" becomes "information processing."
      *   *No Expression:* The teleological ethics (the *good* life). The idea that some humans *lack* moral agency (economics assumes universal agency). The normative leap from efficiency to justice.

  6.  **Formulate the Interpretive View:**
      *   Is it a limit of economics? Yes, because economics assumes methodological individualism (everyone has a utility function).
      *   Is it Aristotle doing less work? No, Aristotle is doing *different* work (ontology/ethics vs. mechanism).
      *   Conclusion: The economic framework cannot capture the *dehumanization* required for the argument to hold without treating it as a modeling error. Economics treats the "lack of utility" as an impossibility; Aristotle treats it as a biological fact.

  7.  **Refine the Tone:**
      *   Professional, analytical, rigorous.
      *   Speak the language of the user (P-A models, TCE, GHM).
      *   Avoid moralizing, focus on structural translation limits.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use the "limiting case of the firm" framing?
