      *   **Dissolving Tension:** (4) vs. (1).
          *   (4) says symptoms like fever are adaptive. (1) says disease is failure. Fever is not a failure. So (4) is an *application* of (1), not a conflict. The appearance of conflict comes from thinking "symptom" implies "disease."

