answer: |-
  **Overall Credence: 10%**

  I assign a **10% probability** that the discursive dilemma is genuinely unavoidable in real-world democratic deliberation about concrete moral policies. This places me much closer to your position (low credence) than your friend's (high credence). While the logic is sound in the abstract, the sociological and institutional conditions required for it to paralyze real-world deliberation are rarely met simultaneously.

  Here is the decomposition:

  **(a) Probability that moral reasoning has explicit premise-conclusion structure: 40%**
  The discursive dilemma requires voters to hold judgments on specific premises ($P, Q$) and a conclusion ($R$) that are logically connected (e.g., $P \land Q \to R$). In textbook cases, agents are logically omniscient. In reality, moral reasoning is often holistic, weighted, or intuitive rather than boolean. Voters might support assisted suicide based on a "gestalt" of values rather than a strict logical conjunction of autonomy and harm reduction. Furthermore, moral premises are often contestable definitions rather than truth-apt propositions. If the logical connective is fuzzy (e.g., "Autonomy *mostly* implies Legalization, unless Harm is high"), the strict paradox cannot formally arise. I assign 40% because while political rhetoric often *mimics* this structure, the underlying cognitive architecture of the electorate rarely adheres to it strictly enough to generate a formal inconsistency.

  **(b) Probability that groups aggregate premise-by-premise (PBP) rather than conclusion-by-conclusion (CBC): 35%**
  The dilemma only becomes a practical conflict if the group is committed to aggregating judgments on the *reasons* (PBP) and finds they contradict the aggregate judgment on the *outcome* (CBC). Most democratic institutions (legislatures, referenda) are designed to vote CBC (vote on the bill, not the justification). Courts sometimes vote PBP (judgments on legal grounds), but even they often prioritize the disposition. For the dilemma to be "unavoidable," the institution must be committed to PBP aggregation *and* find it yields a different result than CBC. Since most real-world bodies default to CBC to ensure a decision is reached, the conflict remains latent rather than active. I assign 35% because while public discourse often highlights inconsistencies between stated values and votes, binding procedural aggregation is overwhelmingly CBC.

  **(c) Probability that no procedural fix eliminates the problem without hiding it: 70%**
  *Conditional on (a) and (b) occurring*, there is a high chance the inconsistency is robust. If a group explicitly votes "Yes" on Autonomy, "Yes" on Harm Reduction, but "No" on Legalization, simple deliberation may not resolve it if the disagreement stems from deep value pluralism (e.g., different interpretations of "Harm"). Procedural fixes exist (e.g., giving priority to premises, sequential voting), but these can be seen as "hiding" the problem by privileging one part of the judgment set over another. However, deliberation often *does* resolve these inconsistencies by changing preferences rather than aggregating fixed ones. Because I am conditioning on the dilemma actually arising (which is rare per (a) and (b)), I assign a higher probability here that it would be sticky.

  **Calculation:**
  $$0.40 \times 0.35 \times 0.70 = 0.098 \approx 10\%$$

  ***

  ### Least Sure Component: (a)
  I am least certain about **(a)**: the probability that moral reasoning actually has enough explicit premise-conclusion structure for the dilemma to arise.

  **Why:** We lack large-scale empirical data on the logical coherence of individual voter justification sets. Political science data focuses on vote choice (the conclusion), not the logical structure of the premises held by the voters. We assume voters are "reasoners" in the logical sense, but they may be "associators" or "heuristics-users."

  **Study to Shift Credence:**
  A **representative survey experiment** linked to actual ballot initiatives.
  *   **Method:** Before a major moral policy vote (e.g., assisted suicide), survey a representative sample on specific premises (e.g., "Is bodily autonomy absolute?", "Does this policy increase net harm?") and the conclusion ("Should this be legal?").
  *   **Metric:** Measure the rate of *logical inconsistency* within individuals and across the aggregate. If >30% of voters hold logically inconsistent sets ($P=True, Q=True, R=False$ where $P \land Q \to R$), my credence in (a) would shift up to 80%, raising the overall credence to ~20-25%. If inconsistency is random noise (<5%), my credence drops further.

  ***

  ### Verdict: You Are Closer to Being Right
  Your friend is making a **category error**. They are applying a theorem from formal social choice theory (which assumes fixed, logically omniscient preferences and specific aggregation rules) to messy human deliberation (which involves preference transformation, agenda control, and holistic judgment).

  The discursive dilemma proves that *certain idealized democratic systems* cannot guarantee consistency. It does not prove that *actual* democratic deliberation is broken, because actual deliberation violates the idealized assumptions (voters change minds, institutions prioritize conclusions, and reasoning is rarely boolean). The dilemma is a critical tool for institutional design, not a proof of systemic failure. Your skepticism that this is mostly a "textbook logic puzzle" phenomenon is empirically well-founded.
