  ### Part 1: The Logical Space and Ordering

  Before we draw the lines, we have to agree on what we are sorting. The core disagreement between you and Mara isn't about whether costs exist; it's about *what the costs are doing*. Mara's position (Handicap as default) assumes that if a trait is wasteful and communicative, the waste *must* be the mechanism guaranteeing honesty. Your position is that waste is often incidental, mechanical, or irrelevant to the information transfer.

  To separate these, we cannot start with "Is it costly?" because "cost" is ambiguous. A peacock's tail is metabolically costly; a toad's deep croak is mechanically constrained (a small toad *cannot* make it, which is a different kind of "cost"). A blurry photo is aesthetically costly (ugly) but informationally valuable.

  Here is the logic for the ordering of the branches:
  1.  **Function First:** We must distinguish traits selected *for* communication from traits that just happen to convey information (cues). If there is no selection for the receiver's response, it's not a signal, and signaling theory doesn't apply.
  2.  **Interests Second:** If it is a signal, do the parties want the same thing? If yes, honesty is free; no costly mechanism is needed. This eliminates a huge chunk of "waste" immediately.
  3.  **Physics Third:** Can the trait be faked physically? If a small toad *cannot* vibrate its vocal cords at a low frequency, no amount of "willingness to pay a cost" will help. This separates Indices from Flexible signals.
  4.  **Enforcement Fourth:** If they *can* fake it, do they dare? Some signals are cheap but honest because liars get beaten up (social punishment). This separates social enforcement from physiological costs.
  5.  **Cost Necessity Fifth:** If there is no punishment, is the production cost *required* to stop liars? This is the crux of the Zahavian Handicap. If removing the cost allows cheating, it's a Handicap.
  6.  **Cost Level & Function Sixth/Seventh:** If the cost isn't needed for honesty, why is it there? Is the signal actually cheap (Conventional)? Is the cost making it easier to see (Sensory)? Or is the cost just dead weight (Waste)?

  This ordering ensures we don't label something a "Handicap" just because it's expensive; we only label it a Handicap if the expense is the *only* thing keeping it honest.

  ***

  ### Part 2: The Decision Tree

  **Q1. Selection Target:** Did this trait evolve primarily *because* it changes how others behave toward the bearer, or is it a side-effect of selection for something else (like flying, digesting, or staying warm)?
  *   **No (Side-effect):** → **Leaf 1**
  *   **Yes (Communication):** → Go to Q2

  **Q2. Interest Alignment:** If the receiver believes this signal, do the sender and receiver benefit equally from the outcome, or does the sender gain a specific advantage by tricking the receiver (e.g., mating without investing, escaping predation)?
  *   **Yes (Benefit Equally):** → **Leaf 2**
  *   **No (Conflict/Tricking Possible):** → Go to Q3

  **Q3. Physical Constraint:** Could a lower-quality individual physically produce this exact trait if they didn't care about the survival consequences (e.g., could a small toad make a deep sound if it didn't hurt them)?
  *   **No (Physically Impossible):** → **Leaf 3**
  *   **Yes (Physically Possible):** → Go to Q4

  **Q4. Receiver Enforcement:** If a low-quality individual fakes this signal, is the main cost imposed *after* the fact by the receiver detecting and punishing the lie (e.g., aggression, ostracism)?
  *   **Yes (Active Punishment):** → **Leaf 4**
  *   **No (No Active Punishment):** → Go to Q5

  **Q5. Cost Necessity:** If you could magically make this signal free to produce (no energy, no risk), would low-quality individuals immediately start faking it, destroying the signal's value?
  *   **Yes (Cost Stops Cheating):** → **Leaf 5**
  *   **No (Cost Doesn't Stop Cheating):** → Go to Q6

  **Q6. Cost Level:** Is the signal cheap to produce in terms of energy and risk, relying on social stability or agreement instead?
  *   **Yes (Cheap/Stable):** → **Leaf 6**
  *   **No (Still Costly):** → Go to Q7

  **Q7. Cost Function:** Is the "waste" or intensity of the signal actually making it easier for the receiver's nervous system to detect or process (e.g., brighter, louder, more contrasting)?
  *   **Yes (Aids Detection):** → **Leaf 7**
  *   **No (Functionless Burden):** → **Leaf 8**

  ***

  ### Part 3: The Leaves (Taxonomy)

  **Leaf 1: Not-a-Signal (Cue / Byproduct)**
  *   **Standard Name:** Cue or Exaptation.
  *   **Awkward Commitment:** You must argue that the trait conveys information *incidentally* and would exist even if no one was watching.

  **Leaf 2: Honest because Signaller and Receiver Interests Align**
  *   **Standard Name:** Common Interest Signaling.
  *   **Awkward Commitment:** You must assume there is zero evolutionary pressure to lie, which is rare in mating or predation contexts.

  **Leaf 3: Mechanically Constrained / Index-Type Signal**
  *   **Standard Name:** Index Signal.
  *   **Awkward Commitment:** You must claim the sender has *no control* over the trait's expression relative to their quality; it is a physical impossibility to fake.

  **Leaf 4: Honest because Receivers Punish Cheaters**
  *   **Standard Name:** Enforcement / Policing.
  *   **Awkward Commitment:** You must assume receivers have perfect or near-perfect ability to detect lies after the fact, otherwise the system collapses.

  **Leaf 5: Strategic-Cost Handicap**
  *   **Standard Name:** Zahavian Handicap.
  *   **Awkward Commitment:** You must commit to the idea that the waste itself is the *mechanism* of honesty; if the cost were removed, the information would vanish.

  **Leaf 6: Conventional or Near-Costless Signal**
  *   **Standard Name:** Conventional Signal.
  *   **Awkward Commitment:** You must explain why the signal doesn't degrade into noise if it is cheap to fake; usually relies on unmodeled social stability.

  **Leaf 7: Honest because of Receiver Psychology**
  *   **Standard Name:** Sensory Bias / Amplifier.
  *   **Awkward Commitment:** You must argue the cost exists to tickle the receiver's nerves, not to prove the sender's quality directly.

  **Leaf 8: Costly but the Cost Does No Honesty Work**
  *   **Standard Name:** Fisherian Runaway or Spandrel.
  *   **Awkward Commitment:** You must accept that the trait is wasteful and honest, but the waste is evolutionary baggage or a side-effect of preference, not a guarantee of quality.

  ***

  ### Part 4: Indistinguishable Leaves and Empty Cells

  **Empirical Gaps (Hard to Separate):**
  *   **Leaf 5 (Handicap) vs. Leaf 8 (Waste/Fisherian):** This is the heart of your fight with Mara. Empirically, both look like "costly traits." To distinguish them, you need to know if the cost *correlates* with quality in a way that prevents cheating (Handicap) or if the cost is just dragged along by female preference (Fisherian). Without measuring the *marginal cost* to low vs. high quality individuals, you cannot tell these apart.
  *   **Leaf 3 (Index) vs. Leaf 7 (Amplifier):** An index makes quality impossible to hide; an amplifier makes quality easier to see. If a trait does both (e.g., a deep voice indicates size *and* travels further), the tree forces a choice at Q3, but reality is often a gradient.

  **Empty Cells (Logical Impossibilities):**
  *   **Costly + No Honesty Work + No Sensory Function + No Punishment + Conflict of Interest:** This is Leaf 8. It is not empty, but it is unstable. If there is conflict, and cost doesn't ensure honesty, and no one punishes lies, why hasn't cheating invaded? This cell is usually occupied by traits in the *process* of collapsing or traits maintained by genetic correlation (Fisherian).
  *   **Signal + No Receiver:** This is logically incoherent (Leaf 1 catches this). If no one receives, it's not a signal.

