answer: |-
  Here is a Q&A preparation sheet tailored to your audience and proposal. I have written this in British English as requested.

  ### **Pre-Talk Strategy Note**

  Your proposal is ambitious because it attempts to hybridise axiomatic bargaining (KS) with a mechanism-design constraint (the Nash cap). The room will respect the intuition (KS is fairer than Nash; Nash utopia points are noisy), but they will attack the *construction*.

  Your biggest mechanical vulnerability is **Resource Monotonicity**. By tying the cap to the Nash outcome, if the feasible set expands (more resources/better model), the Nash payoffs rise, which tightens the constraints for the cap ($u_j \ge u_j^{Nash}$), potentially *lowering* the capped aspiration for some agents. This means adding resources could make an agent worse off. This is a standard "no-no" in fair division. I have flagged this in the mechanics section at the end.

  ---

  ### **The Eight Objections (Ordered by Damage)**

  #### **1. The "Gaming the Cap" Objection (Mechanism Design / MAS)**
  **The Objection:** "Your cap is defined by the maximum utility an agent can achieve subject to others getting their Nash payoff. In a reported-preference setting, I can simply inflate my utility function in regions where others get their Nash payoff. I artificially inflate my 'capped aspiration', pulling the KS ray towards me. Doesn't this make your rule *more* manipulable than standard Nash, not less?"
  **The Reply:** "That is a serious risk in a direct revelation setting. However, in our ML context, utilities are not reported; they are estimated by the system from behavioural data or predefined metrics (e.g., accuracy, revenue). An agent cannot simply 'claim' a freak outcome exists; the model must be able to *generate* it. The cap is designed to filter out noise in the *feasible set estimation*, not to handle strategic lying. If the concern is strategic misreporting of the underlying metrics, that breaks Nash welfare too. We are treating the utility functions as ground truth for the sake of the aggregation rule."
  **Soft Spot:** You are conflating *estimation error* with *strategic manipulation*. If the MAS researchers push on agents actively perturbing their input data to shift the feasible set boundary, you have no defence other than 'robust estimation', which is a different talk.

  #### **2. The "Mandatory Action" Disagreement Point (Economist / Theory)**
  **The Objection:** "Bargaining solutions rely on a disagreement point $d$ representing what happens if negotiations fail. But your assistant *cannot* fail to act; it must output a prediction. If you set $d$ to 'random guessing', that's arbitrary. If you set it to 'status quo', that encodes existing bias. If $d$ is arbitrary, the entire KS ray is arbitrary. Why should fairness depend on a counterfactual that doesn't exist?"
  **The Reply:** "I concede $d$ is a modelling choice, not a discovery. In mandatory settings, we interpret $d$ not as 'no deal', but as the 'reservation utility'—the baseline performance below which the system is deemed unacceptable by the regulator or payer. We can set $d$ via a prior fairness audit (e.g., demographic parity baseline). The KS rule is robust to shifts in $d$ as long as the ordering of claims remains, whereas Nash welfare is highly sensitive to the zero-point of utilities. We use $d$ to anchor the scale, not to model a walk-away threat."
  **Soft Spot:** This is your shakiest conceptual ground. If they press that KS is *scale invariant* but not *translation invariant*, changing $d$ changes the outcome non-linearly. You are effectively admitting $d$ is a hyperparameter.

  #### **3. The Non-Convex / Discrete Feasible Set (ML / Optimisation)**
  **The Objection:** "You're showing us convex curves. ML feasible sets are discrete and non-convex. The line segment from $d$ to your capped ideal point will likely pass through the 'holes' in the feasible set. The intersection might not exist. Is your rule even well-defined for a classifier?"
  **The Reply:** "Strictly speaking, KS requires a convex comprehensive hull. In discrete settings, we must allow for randomisation over outcomes (lotteries), which convexifies the set. If randomisation is impermissible, we define the solution as the feasible point minimising the Euclidean distance to the ideal KS ray. This turns the problem into a projection onto the Pareto frontier, which is computationally tractable via mixed-integer programming for small stakeholder counts."
  **Soft Spot:** Randomisation is often ethically or legally dubious in high-stakes allocation (e.g., lending). If you can't randomise, your rule is an approximation, and you lose the axiomatic guarantees.

  #### **4. Violation of Resource Monotonicity (Fair Division Theorists)**
  **The Objection:** "Your cap depends on the Nash outcome. If the feasible set expands (we get a better model), the Nash payoffs rise. This tightens the constraints on the cap ($u_j \ge u_j^{Nash}$). It is possible that an agent's capped aspiration *drops* because the others' Nash payoffs rose. You've built a rule where having more resources can make a stakeholder worse off. That violates resource monotonicity."
  **The Reply:** "You are correct that the *capped aspiration value* can move non-monotonically. However, the *final allocation* is chosen on the ray from $d$. While the direction vector shifts, the intersection with the *expanded* feasible set should still yield a weakly better outcome for everyone. The cap prevents the *direction* from skewing wildly, but the expansion of the set dominates the final utility. We prioritise stability of the fairness ratio over strict monotonicity of the intermediate aspiration values."
  **Soft Spot:** **This is mechanically dangerous.** If the feasible set expands, but the KS ray rotates away from an agent sufficiently, they can end up with less utility on the new frontier than the old one. You need to check this mathematically before the talk. If true, concede it as a trade-off for 'outlier robustness'.

  #### **5. Independence of Irrelevant Alternatives (The Economist)**
  **The Objection:** "Nash satisfies IIA; KS famously does not. Your modification adds another layer of dependency on the shape of the feasible set (via the cap). Why should the presence of a 'freak outcome' that nobody wants affect the solution? You are doubling down on violating IIA."
  **The Reply:** "In multi-stakeholder ML, IIA is a bug, not a feature. The existence of a high-risk, high-reward outcome (the 'freak') tells us something about the model's confidence and the stakeholder's potential. We want the aggregation rule to be sensitive to the *range* of possibilities, not just the local frontier. KS captures 'equal sacrifice' relative to potential; Nash captures 'product maximisation'. We prefer the former for fairness, even at the cost of IIA."
  **Soft Spot:** The Economist will be right on axiomatic purity. Don't try to win on axioms; win on 'suitability for ML context'.

  #### **6. Computational Complexity (ML / Optimisation)**
  **The Objection:** "Nash welfare is a single convex optimisation (log-sum-exp). Your rule requires: 1) Solve for Nash. 2) Solve $n$ constrained maximisations for the caps. 3) Solve for KS intersection. That's $n+2$ optimisation problems per decision. How does this scale?"
  **The Reply:** "This is an offline training objective, not an online inference cost. We are learning a policy that approximates this solution. During training, the overhead is negligible compared to the gradient steps of the neural net. We are trading a constant factor in optimisation time for a structural guarantee on fairness trade-offs."
  **Soft Spot:** If the feasible set changes dynamically (online learning), you cannot re-solve this every round. You need a regret bound or convergence guarantee, which you likely don't have yet.

  #### **7. Pareto Efficiency on the Original Set (Theory)**
  **The Objection:** "You cap the ideal point, then run KS. The KS solution is Pareto efficient with respect to the *comprehensive hull of the capped set*. Is it guaranteed to be Pareto efficient on the *original* feasible set? Or does your cap artificially restrict the frontier?"
  **The Reply:** "The capped aspiration points are themselves on the original Pareto frontier (by construction, they maximise one agent subject to others $\ge$ Nash). The KS solution picks a point on the line to that aspiration. As long as that line intersects the original frontier before hitting the cap, we are efficient. If the cap binds, we are selecting a point that is efficient relative to the 'safe' subset of the frontier, intentionally sacrificing global efficiency for robustness."
  **Soft Spot:** If you admit you sacrifice Pareto efficiency, half the room will stop listening. You must argue that the 'inefficient' points are those relying on the 'freak' outcomes you distrust.

  #### **8. Why Not Leximin? (Fair Division)**
  **The Objection:** "You want to protect the worst-off and limit the influence of outliers. That's exactly what Leximin (maximin) does. Why invent a complex bargaining hybrid instead of just using Leximin?"
  **The Reply:** "Leximin is too rigid; it prioritises the worst-off absolutely, often destroying total welfare. Nash is too loose. KS is a compromise. My cap is an attempt to make KS behave more like Leximin in the presence of outliers, without losing the proportional sensitivity of KS in normal conditions. It's a smooth interpolation, not a hard constraint."
  **Soft Spot:** Leximin is strategy-proof (mostly) and monotone. If your rule isn't, Leximin wins on axioms. You must win on 'performance/welfare retention'.

  ---

  ### **Concessions for Slides 1 & 2**

  Do not wait to be cornered on these. Put them in your "Assumptions & Limitations" slide early to disarm the critics.

  1.  **Concede Non-Convexity:** "We assume the feasible set of utilities is convex, either through randomisation or by working in the space of policy mixtures. In discrete settings, this rule is an approximation."
  2.  **Concede Strategyproofness:** "This rule is not strategy-proof. We assume utilities are estimated by the system designer, not reported by the agents. If agents can manipulate the utility estimation, this rule fails."
  3.  **Concede the Disagreement Point:** "The disagreement point $d$ is a hyperparameter representing a regulatory baseline, not a true threat point."

  ---

  ### **The Single Reply That Must Land**

  **The Manipulability / Incentive Reply (Objection #1).**
  If the mechanism-design people believe agents can game the cap, the proposal is dead. You must land the distinction between **reported preferences** (gameable) and **estimated utilities** (robustness problem).
  *   **Key Phrase to Use:** "We are solving an *estimation* problem, not a *revelation* problem. The 'freak outcome' must be physically feasible under the model, not just claimed."

  ---

  ### **The Question You Hope Nobody Asks**

  "If your cap restricts the aspiration point to outcomes where others get at least their Nash payoff, aren't you just describing a **Constrained Nash Welfare** maximisation? Why invoke Kalai-Smorodinsky at all? Isn't the KS step redundant if you've already constrained the set using Nash?"

  *   **Why it's deadly:** It suggests your 'novel contribution' is just a constraint on the existing baseline, and the KS machinery is unnecessary complexity.
  *   **Preparation:** You need to argue that KS changes the *direction* of the trade-off, not just the feasible set. Nash maximises the product; KS equalises the *fraction* of potential gained. Even on the restricted set, KS and Nash pick different points.

  ---

  ### **Mechanics Check: Where You Might Be Wrong**

  I have flagged two areas where your mathematical intuition might be leading you astray.

  1.  **Resource Monotonicity (Critical):**
      *   **The Issue:** You defined the cap $u^{cap}_i$ as $\max u_i(x)$ s.t. $u_j(x) \ge u_j(x_{Nash})$.
      *   **The Bug:** If the feasible set $S$ grows, $x_{Nash}$ improves (everyone gets more). The constraint $u_j(x) \ge u_j(x_{Nash})$ becomes *tighter*. The maximum $u_i$ achievable under this tighter constraint might be *lower* than before.
      *   **Consequence:** Your "ideal point" can shrink when resources grow. Consequently, the KS ray rotates. It is mathematically possible for an agent to receive *less* utility in the larger set than the smaller set because the ray rotated away from them.
      *   **Fix:** You cannot claim monotonicity. You must frame this as "Stability over Monotonicity". If a fair-division theorist spots this, they will pounce. Be ready to admit it.

  2.  **Pareto Efficiency:**
      *   **The Issue:** KS picks the maximal point on the segment $[d, u^{cap}]$.
      *   **The Bug:** $u^{cap}$ is on the Pareto frontier of $S$. $d$ is usually interior. The segment connects them. The KS solution is the intersection of this segment with the Pareto frontier.
      *   **However:** If you cap the aspirations, you are effectively defining a new comprehensive hull $S' \subset S$. The KS solution is on the frontier of $S'$. Is it on the frontier of $S$?
      *   **Verdict:** Yes, *if* the segment exits $S'$ at the same boundary as $S$. But if the cap cuts off a "bulge" in the Pareto frontier of $S$, the KS line might hit the 'cut' (the constraint boundary $u_j = u_j^{Nash}$) rather than the true frontier. In that case, your solution is **Pareto Inefficient** relative to the original set $S$ (you could make someone better off without hurting others by moving into the excluded bulge).
      *   **Fix:** You must argue that the excluded bulge relies on the "freak outcomes" you distrust. You are intentionally sacrificing efficiency for robustness. Do not claim global Pareto Efficiency.

  **Good luck. It's a clever idea, but the axiomatic trade-offs are sharp. Own the limitations.**
