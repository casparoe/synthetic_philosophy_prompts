answer: |-
  Reject Step (5).

  You claim Independence is merely a technical axiom nobody cares about. This is the seam. Independence isn't just bookkeeping; it is the formal requirement of *issue-by-issue accountability*. It ensures that the group's judgment on proposition P reflects the members' views on P, not their views on Q combined with a logical constraint. When you drop Independence to save Consistency (via MAXCON), you allow the collective verdict on P to be determined by the distribution of votes on Q.

  This creates a transparency deficit. If the group accepts P because the majority accepted Q (and Q implies P), even though a majority rejected P directly, the group is effectively lying about its reasons. It claims to believe P, but the causal mechanism of the decision was Q. In a democratic context, this undermines responsiveness. Voters cannot hold representatives accountable for specific issues if the outcome on those issues is hostage to the logical structure of the agenda and votes on unrelated propositions.

  You asked if you lose the conclusion (7) or just the cheap route. You lose the conclusion. Step (7) claims there is "no in-principle tension" between democracy and collective rationality. But if Independence is a normative requirement of democracy (ensuring issues are decided on their merits), then the tension is real. You cannot have Full Democracy (including Independence), Full Rationality (Consistency), and Universal Domain simultaneously. MAXCON saves Rationality by sacrificing a core democratic norm, not a technicality.

  Your comparison in (6) to dropping Anonymity (dictatorship) is instructive. We reject dictatorship because it violates equality. We should reject MAXCON's violation of Independence because it violates transparency and responsiveness. Both are substantive moral costs, not mere axiom bundling. The impossibility theorems aren't artifacts; they are maps of these trade-offs. By calling Independence "technical," you hide the cost. If you acknowledge the cost, you admit the tension remains.

  You mentioned you'd sooner give up claims about MAXCON than (1) and (7). But keeping (7) requires denying the normative weight of Independence. If you accept that Independence matters for democracy, you must concede that MAXCON is not "fully democratic" in the robust sense, even if it is anonymous. It produces rational outcomes, but via a process that obscures the link between individual will and collective decision on specific issues. The "cheap route" was assuming Independence was free. It isn't.

  Confidence: 90% confident this is the logical failure point.
  Least sure: Whether a weakened version of (7) survives if "democracy" is redefined to exclude Independence.
