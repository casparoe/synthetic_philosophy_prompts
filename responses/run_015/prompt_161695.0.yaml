      *   **Task:** Audit a specific argument made by an AI vendor white paper. The argument claims AI tutors are "Popperian creatures" capable of unsupervised reasoning because they use generate-and-test mechanisms.
      *   **Specific Requirements:**
          1.  Create a table of correspondences mapping the AI mechanism to Dennett's evolutionary levels (Variation, Selection, Environment, Retention, Death).
