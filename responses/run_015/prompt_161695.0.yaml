          6.  Deliver an honest verdict on whether the argument stands without the analogy.
      *   **Tone:** Private, serious, rigorous, respectful, avoiding flattery but validating the user's insights. No moralizing, just structural analysis.

  2.  **Deconstruct the Vendor's Argument:**
      *   *Premise 1:* Reasoning = Generate-and-Test.
      *   *Premise 2:* Dennett's hierarchy defines intelligence by *where* the selection happens (offspring, body, inner model, cultural tools).
      *   *Premise 3:* AI Inference (sampling multiple outputs, ranking them, picking the best) fits the "Popperian" definition (inner model testing).
      *   *Conclusion:* AI can be left unsupervised because it internalizes the cost of failure (candidates die, not the user).

  3.  **Drafting the Table of Correspondences (Requirement 1):**
