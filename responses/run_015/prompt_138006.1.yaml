answer: |-
  ### Exam Question

  **Course:** The Ethics of Suffering (Upper-Level Seminar)
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 1,200 words
  **Marks:** 25

  **Question:**

  Lexical Threshold Negative Utilitarianism (LTNU) asserts that suffering above a certain threshold possesses moral weight that cannot be outweighed by any quantity of pleasure. However, standard hedonistic axiologies assume the **Parity Constraint**: the claim that for any unit of suffering, there exists some finite quantity of pleasure that matches it in moral weight, implying a single, Archimedean scale of value.

  Critics argue that LTNU faces a structural dilemma: to maintain lexicality, it must deny the Parity Constraint, but doing so threatens the coherence of hedonism itself.

  Using the **Relief Package** (where an agent prefers brief above-threshold pain for the sake of subsequent intense relief) and the **Triage Ward** (where resources must be allocated among thousands of above-threshold sufferers), critically evaluate this dilemma. Your answer must address:

  1.  Why the dispute between Parity and Lexicality concerns the formal structure of the value ordering (Archimedean vs. non-Archimedean) rather than the empirical measurability of experience, and what value must be for a non-Archimedean ordering to be coherent.
  2.  What the threshold is a threshold *of* (intensity, net episode, etc.), and how the non-additive interaction of pain and pleasure in the Relief Package challenges the single-scale assumption shared by both Parity and Lexical views.
  3.  How little work the lexical component does in the Triage Ward, specifically regarding the remaining intra-threshold axiology, and whether the distinction between LTNU and suffering-focused prioritarianism survives this analysis.
  4.  How epistemic uncertainty regarding the threshold's location or intensity estimates creates an "epistemic squeeze" that may collapse lexicality into weighted Negative Utilitarianism.

  Conclude by assessing whether a coherent LTNU remains recognisably a form of Negative Utilitarianism.

  ***

  ### Model Answer

  The core tension in Lexical Threshold Negative Utilitarianism (LTNU) is not empirical but structural. It concerns whether value is Archimedean. An Archimedean ordering satisfies the Parity Constraint: for any two values $x$ and $y$, there is some number $n$ such that $n$ units of $x$ outweigh one unit of $y$. LTNU requires a non-Archimedean ordering where no amount of pleasure ($P$) outweighs a single unit of threshold-suffering ($S$). This is not a dispute solvable by neuroimaging. Even if we could perfectly measure phenomenal intensity, the question remains whether intensity maps linearly to moral weight. For a non-Archimedean ordering to be coherent, value cannot be a single scalar magnitude. It must be vectoral or lexicographically ordered, akin to how any amount of health outweighs any amount of wealth in some lexies. LTNU thus commits to a metaphysical claim: suffering above a threshold belongs to a disqualifying category of value, not merely the negative end of a continuum.

  This structural commitment falters when defining the threshold's locus, as revealed by the **Relief Package**. Here, an agent chooses brief, above-threshold pain to secure intense relief-pleasure. If the threshold is defined by *momentary phenomenal intensity*, the pain counts lexically, rendering the choice irrational regardless of the relief. But this ignores the phenomenology of relief, which is ontologically dependent on the pain. If the threshold applies to the *net valence of an episode*, the relief might cancel the pain, dropping the episode below the threshold. However, this abandons the single-scale assumption. If pain and pleasure can interact non-additively (as in bittersweet experiences or relief), they are not simply positive and negative integers on one line. If they are not on one line, the Parity Constraint is already false for reasons unrelated to lexicality. LTNU faces a dilemma: if it treats pain as simply negative pleasure, the threshold looks arbitrary (why does intensity $X$ trigger lexicality but $X-1$ does not?). If it treats pain as a distinct ontological category to justify lexicality, it struggles to explain why the Relief Package is rationally permissible, as it implies the agent is trading a "lexical bad" for a "standard good."

  Furthermore, the lexical component offers limited guidance in the **Triage Ward**, where ten thousand people suffer above the threshold. Lexicality only settles comparisons *across* the threshold (pleasure vs. pain). It does not solve aggregation *within* the suffering class. We still need an axiology to decide whether to relieve a little for everyone or a lot for one. LTNU must adopt a aggregative view here (e.g., summing suffering), which reintroduces the standard utilitarian calculus it sought to escape. This narrows the daylight between LTNU and suffering-focused prioritarianism. A prioritarian view gives extra weight to the worse off without invoking lexical discontinuity. If LTNU adopts summation for intra-threshold cases, its distinctiveness rests solely on the threshold boundary. If it adopts a maximin approach (help the worst-off first), it ceases to be utilitarian. Thus, in the Triage Ward, LTNU either collapses into weighted utilitarianism or abandons consequentialist aggregation, revealing that lexicality solves only the cross-category problem, not the distribution problem.

  Finally, the view is vulnerable to an epistemic squeeze. Lexicality requires certainty about whether a suffering instance crosses the threshold. In reality, intensity estimates are uncertain. If there is a non-zero probability that a specific pain is above the threshold, and lexical bads are infinitely weighty (or strictly dominant), then even a minute probability swamps all finite pleasure considerations. This leads to paralysis or extreme risk-aversion. To avoid this, the proponent must assign a finite expected weight to above-threshold suffering. But once the weight is finite, it can theoretically be outweighed by a sufficiently large amount of pleasure, collapsing the lexical structure back into weighted Negative Utilitarianism. The "lexical" label becomes a placeholder for "very high priority" rather than a formal structural claim.

  In conclusion, for LTNU to be coherent, it must deny the Parity Constraint and posit a non-Archimedean value structure. However, the Relief Package suggests pain and pleasure may not share a scale regardless of lexicality, and the Triage Ward shows that lexicality leaves the hard work of intra-threshold aggregation untouched. Combined with the epistemic squeeze, LTNU risks becoming either incoherent (if strictly lexical under uncertainty) or indistinguishable from prioritarianism (if finite). To remain coherent, LTNU must give up the claim that it is merely a refinement of hedonistic utilitarianism; it must instead argue that severe suffering constitutes a different *kind* of moral fact entirely. Whether this remains "Negative Utilitarianism" depends on whether one defines NU by its focus on suffering or its commitment to a unified axiology of welfare. Given the fragmentation of the value scale required for coherence, LTNU looks less like a utilitarian theory and more like a hybrid deontological constraint on inflicting severe harm.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 13 (B- range)
  **Distinction Threshold:** 20 (A range)

  **1. Formal Structure & Archimedean Property (6 Marks)**
  *   **B Answer (3-4 marks):** Correctly distinguishes between "very large weight" and "lexical weight." Identifies that Parity implies an Archimedean scale. Notes that empirical measurement (neuroimaging) cannot settle the structural question.
  *   **A Answer (5-6 marks):** Explicitly defines the Archimedean property ($n \times x > y$). Explains that denying Parity requires a non-scalar (vectoral or lexicographic) ontology of value. Clarifies that this is a metaphysical claim about value, not an empirical claim about sensation.
  *   *Standard Failure Mode:* Treating "lexical" as simply "a very large finite number" (e.g., 1 unit of pain = 1 trillion units of pleasure). This fails to capture the structural incommensurability.

  **2. The Threshold & The Relief Package (6 Marks)**
  *   **B Answer (3-4 marks):** Identifies the problem of defining the threshold (intensity vs. net). Uses Relief Package to show the tension between preferring pain and avoiding lexical bads.
  *   **A Answer (5-6 marks):** Uses Relief Package to challenge the *single-scale assumption*. Argues that if relief is non-additive, the Parity Constraint is already in trouble before lexicality is applied. Highlights the dilemma: if pain is negative pleasure, the threshold is arbitrary; if pain is distinct, welfare is fragmented.
  *   *Standard Failure Mode:* Ignoring the interaction of pain/pleasure and treating them as separate buckets that simply sum, missing the "bittersweet/relief" ontological challenge.

  **3. Intra-Threshold Axiology & Triage Ward (6 Marks)**
  *   **B Answer (3-4 marks):** Notes that Triage requires choices between sufferers. States that LTNU still needs to aggregate suffering. Distinguishes LTNU from standard NU.
  *   **A Answer (5-6 marks):** Demonstrates that lexicality does no work *within* the threshold zone. Shows that LTNU must adopt standard utilitarian aggregation or maximin here. Explicitly compares LTNU to Suffering-Focused Prioritarianism, arguing the distinction narrows significantly if intra-threshold aggregation is utilitarian.
  *   *Standard Failure Mode:* Assuming lexicality solves the distribution problem (e.g., claiming lexicality dictates we must help the worst-off first without justification).

  **4. Epistemic Squeeze & Conclusion (4 Marks)**
  *   **B Answer (2 marks):** Identifies that uncertainty makes lexicality hard to apply. Concludes on whether it is still NU.
  *   **A Answer (3-4 marks):** Explains the "collapse": under uncertainty, lexical bads must have finite expected value to avoid paralysis, which restores Parity. Concludes that coherent LTNU may cease to be utilitarian (sliding toward deontological constraints).
  *   *Standard Failure Mode:* Sliding from lexical axiology into agent-relative deontological constraints (e.g., "I cannot inflict pain") without noting this abandons consequentialism.

  **General Assessment Criteria:**
  *   **A Grade (20-25):** Seamless integration of the four required moves. The argument flows from metaphysics to phenomenology to aggregation to epistemology. The conclusion critically assesses the "Negative Utilitarian" label.
  *   **B Grade (13-19):** Addresses all four points but treats them as separate checklist items. May rely on the "large finite weight" misconception or fail to fully explain why the Archimedean property matters. Application of cases is correct but lacks critical depth.
  *   **C Grade (10-12):** Recites standard objections (extinction, trivial pain) despite instructions. Fails to distinguish lexical from weighted views. Misapplies the cases.
