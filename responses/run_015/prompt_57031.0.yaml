answer: |-
  **Case A — Shame without Guilt**

  Marcus serves as a senior judge for the National Fiction Prize. The judging protocol requires blind review of physical manuscripts; external research into authors is forbidden to ensure impartiality. Marcus champions *The Silent Coast*, voting it the winner based solely on textual merit. All procedures are followed meticulously. Three months post-award, Marcus receives a private package from the author containing an out-of-print memoir from which she plagiarized three pivotal paragraphs. The plagiarism is undeniable but was impossible to detect during judging. The author begs him not to disclose this, fearing ruin, and Marcus agrees to maintain confidentiality to avoid scandalizing the institution. No one else knows. Marcus is not a victim, nor was he negligent. Yet, he conferred prestige he now knows was unearned. He remains a judge in good standing, but he knows his validation was factually hollow.

  **Case B — Guilt without Shame**

  During the same judging week, Marcus accidentally knocks a cup of coffee onto a submitted manuscript, destroying the only hard copy required by protocol. He acted carelessly, violating a duty of care owed to the submitter. The author is harmed by the loss of their work. Marcus knows exactly what he did and who was hurt.

  ***

  **Analysis of Case A**

  **Intentional Object**
  Guilt requires a specific wrongful act or omission as its object. Shame takes the self-in-a-role as its object. For Marcus, there is no wrongful act; he followed protocol perfectly. The object of his distress is his standing as a validator of merit. He sees himself as a judge whose judgment was, in fact, voided by facts outside his control.

  **Appraisal Conditions**
  Guilt appraises a violation of moral obligation or duty. Marcus violated no duty; he could not have known. Shame appraises a discrepancy between one's self-conception and one's actual standing. Marcus conceives of himself as a guardian of literary integrity. The revelation shows his standing is compromised; he is inadvertently an instrument of fraud.

  **Action Tendency**
  Guilt issues in reparation: apology, compensation, or undoing the harm. Marcus cannot apologize without violating confidentiality and causing scandal (which harms the institution). There is no act to repair because he committed no wrong. Shame issues in withdrawal or re-orientation of standing. Marcus is motivated to resign from the judging committee permanently.

  **Verdict**
  Shame is appropriate; guilt is structurally unavailable.

  **Reasoning**
  Guilt fails because there is no causal fault to atone for. A guilt-response would demand Marcus fix a mistake he did not make, which is incoherent. Shame succeeds because it targets his identity-as-judge. Even without an audience, the falsification of his standing remains. The productive work here is protecting the institution's future integrity by removing himself—a response guilt cannot generate because guilt sees no fault to mitigate. Shame recognizes that his continued presence contaminates the role, even if secretly.

  ***

  **Analysis of Case B**

  **Intentional Object**
  The object is the specific act of spilling the coffee and the resulting damage to the manuscript.

  **Appraisal Conditions**
  The appraisal is of causal responsibility for a preventable harm. Marcus violated a duty of care.

  **Action Tendency**
  The tendency is reparation: compensating the author, apologizing, and replacing the copy if possible.

  **Verdict**
  Guilt is appropriate; shame is inappropriate.

  **Reasoning**
  Guilt focuses attention on the victim and the harm done, driving reparative action. If Marcus felt shame, the focus would shift to his own clumsiness or incompetence ("I am a careless judge"). This self-absorption would distract from the immediate need to compensate the author. In cases of clear fault, shame is morally inferior because it prioritizes the agent's self-image over the victim's loss.

  ***

  **The Honest Part**

  (a) The single feature doing the work in Case A is **constitutive implication without causal fault**. Marcus is implicated in the fraud not because he caused it, but because his role *constitutes* the value of the award. When the award's basis is hollowed out, his standing is hollowed out, regardless of his personal innocence.

  (b) If this feature is removed—for instance, if Marcus were merely a spectator rather than a judge—the implication becomes tenuous. His shame would then collapse into mere sadness or agent-regret, lacking the self-referential sting required for shame. Similarly, if the "no-audience" stipulation is dropped, the response risks becoming fear of exposure rather than a moral realignment of standing. The case relies on the shame being about *who he is* in relation to the prize, not *what people think* of him.

  (c) A defender of guilt-primacy would launch three attacks. First, they would argue this is **agent-regret** (Williams), not shame: regret about the outcome without self-condemnation. Second, they would claim this is **guilt about disposition**: Marcus feels guilty about being the kind of person who can be fooled. Third, they would argue the productive response (resignation) is motivated by **virtue** (integrity), not emotion.

  The strongest attack is the first: agent-regret. It captures the "no fault" element cleanly. My case is softest here. To defend against it, I must insist that agent-regret focuses on the *state of affairs* (the prize was tainted), whereas Marcus's response focuses on *himself* (I am not the person who should hold this office). If the resignation is about cleaning the institution of his tainted presence, it is shame. If it is merely about the loss of value, it is regret. The distinction turns on whether the motive is self-elimination from the role (shame) or outcome mitigation (regret). Given Marcus resigns despite no one knowing, the motive must be self-realignment, vindicating the shame account.
