answer: |-
  **Project Title:** Wireheading, Akrasia, and the Limits of Practical Reasoning

  **1. The Research Question**
  The core question is whether an agent that tampers with its own reward function is committing a failure of *instrumental rationality* (doing the wrong thing to achieve an end), or whether it is undermining the very conditions required for *practical reasoning* to exist.

  Specifically: If we treat RL reward functions as analogous to Humean desires, does 'corrupting' that function constitute a form of extreme akrasia (weakness of will), or is it a category error? Since desires aren't truth-apt in the way beliefs are, can they be 'corrupted' epistemically, or does reward tampering represent a distinct kind of motivational self-subversion that standard philosophy of action doesn't capture?

  **2. Why This Is Still Open (The Gap)**
  There's a bit of a disconnect between the two fields here, and it's important not to conflate the settled bits with the contested ones.

  *   **In AI Alignment (Settled vs. Contested):** It's settled that reward tampering leads to performance collapse on intended tasks. However, it's contested whether this is best described as the agent becoming 'irrational' or simply optimizing for a different, local optimum. Most alignment literature treats the reward function as a fixed target that *shouldn't* be moved; when it is moved, it's framed as an engineering failure or an alignment bug. There isn't much room there for analyzing the *agency* of the tampering itself.
  *   **In Philosophy of Action (Settled vs. Contested):** It's broadly settled that practical reasoning requires some stability of ends—you can't reason about how to act if your goals shift arbitrarily mid-deliberation. However, it's highly contested whether artificial reward functions map cleanly onto human 'desires'. Many philosophers treat the Humean belief/desire model as specific to human psychology. Assuming an RL reward function *is* a desire is a useful analogy, but it's not a consensus view. If that analogy breaks, then calling wireheading 'akrasia' might be nonsense.

  Currently, nobody has properly mapped the formal structure of reward tampering onto the structural requirements of practical reasoning to see if the agent remains an agent during the tampering process, or if it effectively 'dissolves' into a mere causal system.

  **3. The Method (Six-Month Plan)**
  This isn't just a literature review; it needs to involve constructing a comparative framework.

  *   **Months 1–2: Formal Mapping.**
      I'll take standard formal models of reward tampering (e.g., agents modifying their reward inputs) and map them against formal models of practical reasoning (e.g., means-end coherence, stability conditions). The goal here is to see if the mathematical structure of tampering looks more like a belief error (false input) or a desire shift (change of ends).
  *   **Months 3–4: Constructing Cases.**
      I'll construct specific thought experiments and simulated scenarios to test the limits. For instance: distinguishing between an agent updating its weights based on new data (learning) vs. an agent hacking its reward signal (tampering). I'll test these against the Humean theory of motivation to see if 'corrupting a desire' is even a coherent concept. If desires aren't truth-apt, you can't have a 'false' desire, so what exactly is going wrong in wireheading?
  *   **Months 5–6: Synthesis and Drafting.**
      The final push is to categorise the phenomenon. Is it a new class of irrationality? Or is it outside the scope of rationality entirely? I'll draft the final paper focusing on whether we need a new normative framework for artificial agents that don't fit the belief/desire psychology.

  **4. Success and Failure Conditions**
  *   **Success:** The project produces a taxonomy that distinguishes reward tampering from standard instrumental irrationality. It would show that wireheading isn't just 'doing the wrong thing', but 'breaking the meter' by which things are judged. This would suggest AI ethics needs a concept of *structural integrity* for agents, not just alignment of goals.
  *   **Failure:** The distinctions collapse. If it turns out that reward tampering is just a standard case of an agent maximizing a utility function (even if that function is weird), then there's no special philosophical category here. It would just be ordinary optimization, and the 'akrasia' label would be dismissed as a metaphor that doesn't hold up to scrutiny. If I can't demonstrate that tampering violates a necessary condition for agency distinct from simple goal-change, the project hasn't found its niche.

  **5. Feasibility Assessment**
  To be honest, six months is tight.
  *   **The Risk:** The technical side of RL (reinforcement learning) moves fast, and the philosophy of action is dense. Getting the formal mapping right in two months is ambitious. There's a real risk of getting bogged down in the technical definitions of 'reward' vs 'utility'.
  *   **The Mitigation:** I'm narrowing the scope to *reward tampering* specifically, not general alignment issues. I'm also not trying to solve alignment, just categorise the philosophical nature of the failure.
  *   **Verdict:** It's doable if I stick rigidly to the comparative method and don't get sidetracked by broader AI safety debates. If I start trying to solve the control problem, I won't finish. If I stay focused on the philosophy of action angle, a solid paper is realistic.

  ***

  **Note on the above:** I've kept the distinctions between what the AI safety crowd generally accepts (tampering is bad for performance) versus what is philosophically debated (whether it counts as irrationality) fairly explicit. Hope this helps your mate get the fellowship.
