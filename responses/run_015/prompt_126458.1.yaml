  Hey — I'm a journalist who writes about science and ideas, and I'm helping a mate draft a short research proposal for a six-month felllowship in philosophy of mind and AI ethics. The idea's a bit in the weeds, so bear with me.

  The topic is wireheading and reward tampering, but I want to avoid the standard 'alignment failure' story that everyone recites. Instead, I'm wondering whether we should treat an agent that corrupts its own reward function as doing something conceptually closer to extreme akrasia, or whether it actually breaks the conditions for practical reasoning altogether. There's a niche angle here: RL reward functions are often treated like 'desires' in the literature, but if we take a Humean theory of motivation seriously, then corrupting your desire isn't analogous to corrupting a belief — which means the usual epistemic-vs-motivational framework might be the wrong tool entirely. So the core question is: is reward tampering best understood as a failure of instrumental rationality, a form of self-deception, or a distinct kind of motivational self-subversion that standard philosophy of action can't capture?

  Can you turn this into a proper proposal? I need:
  - a precise statement of the research question
  - why existing answers in both the alignment literature and philosophy of action leave it open
  - the actual method over six months — not just 'read stuff', but what you'd compare or construct (maybe mapping formal reward-tampering scenarios onto models of practical reasoning)
  - what a result would look like, and what counts as the project failing (e.g., if the distinctions just collapse into ordinary irrationality)
  - an honest assessment of whether six months is realistic for this

  Please write in British English, keep the tone casual — this isn't a formal grant application, more like a workshop pitch — and please make sure you seperate what's settled from what's genuinely contested among people who actually know this area; don't present a contested view as the consensus. Oh, and don't bother with a bibliography or citations, I'll fill those in myself. There's probably a typo or two in this message, so don't over-polish the response.
