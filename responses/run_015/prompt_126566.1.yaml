answer: |-
  **TO:** Library and Archives Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **RE:** Recommendation Regarding Acquisition of Anthropologist Working Papers

  **Recommendation**
  I recommend that the Committee vote to **accept the collection with conditions**. We cannot secure the material for the community if we decline, but we cannot accept it ethically if we ignore the Community Council's requests. Accepting without conditions risks permanent harm to the community and violates the trust required to maintain this partnership.

  **Proposed Timeline**
  1.  **Next Month (Vote):** Authorize acceptance contingent on a negotiated addendum to the deed of gift.
  2.  **Within Six Months:** Finalize the access protocol with the Community Council and implement the "absence note" policy for this collection.
  3.  **Within Eighteen Months:** Complete preservation copying of the open-reel tapes under restricted access conditions before binder degradation renders them unrecoverable.

  **Specific Questions**

  **1. Preservation Copies Before Access Settlement**
  We must copy the tapes immediately. The conservator's assessment is physical, not political: the chemical breakdown of the tape does not pause for negotiation. While the Council views copying as a prohibited act, treating preservation as access is a category error. We can store the digital surrogates in a dark archive with zero access until the access protocol is signed. If we wait, we lose the content forever. Loss is irreversible; access restrictions can be lifted later.

  **2. Redaction and the Land Claim**
  The conflict between privacy and evidence is real. Redacting names from the public online finding aid protects individual privacy as requested. However, to protect the land claim, we must maintain a full, unredacted metadata record available to verified legal and historical researchers. We should propose a tiered access system: the public sees redacted descriptions; the community's legal team and qualified historians see the full record. This honors the Council's request for public privacy without sabotaging the evidence needed for restitution.

  **3. The Community's Parallel Series**
  The community's account should be integrated into the same finding aid as the researcher's papers, not filed separately. Separate filing implies the community's narrative is secondary commentary rather than primary record. Integrating them signals that the community's oral history holds equal archival weight to the anthropologist's field notes. This costs us extra cataloging labor but corrects the historical imbalance inherent in the collection's creation.

  **4. The "Absence Note" Policy**
  I propose we require an "absence note" for this and future acquisitions involving human subjects. This is a mandatory paragraph in the descriptive record stating who appears in the collection only as objects of study rather than authors, and identifying records that were likely never created (e.g., "Women's names appear primarily as wives of heads of household; no independent correspondence from women was retained"). This makes the silences in the record visible without requiring researchers to infer them. It turns archival silence into data.

  **The Strongest Argument Against This Recommendation**
  The strongest case against accepting with conditions is that it compromises the fundamental integrity of the archive. Critics argue that an archive whose access rules vary depending on who is asking and what they are asking for has stopped being an archive and become a political gatekeeper. The donor's deed stipulates equal access for all qualified researchers; violating this sets a precedent where access is determined by identity or purpose rather than consistent rule of law.

  Furthermore, the argument against "preserve now, decide later" is not merely about timing; it is about ownership. By copying the tapes against the Council's wishes, we assert property rights over their cultural heritage regardless of their consent. We claim that our duty to preserve the past outweighs their right to control its present use. If we accept that archival neutrality is impossible, we must still ask whether variable access rules make the collection unusable for comparative research. If every collection has different restrictions based on different community negotiations, the archive becomes a patchwork of incompatible rules that discourages broad historical inquiry.

  **Cost to Researchers**
  We must be plain about what this recommendation costs. Future researchers will not have immediate, open access to this collection. They will face a bureaucracy of verification to view unredacted names. They will not be able to treat the anthropologist's notes as objective data, as the "absence note" will explicitly frame the records as partial and mediated. Some lines of inquiry—specifically those that rely on publishing individual names without community consent—will be blocked entirely. We are trading ease of access for ethical sustainability. If we proceed, we acknowledge that some research questions cannot be asked here, and that is a deliberate limitation on the university's intellectual freedom in exchange for stewardship that does not repeat the harms of the past.

  **Conclusion**
  Declining the collection sends it overseas, removing it from the community entirely. Accepting it unconditionally ignores the community's sovereignty. Accepting with conditions is the only path that keeps the material accessible for the land claim while respecting the community's right to manage their cultural heritage. I urge the Committee to support this conditional acceptance.
