answer: |-
  Here is a metaphilosophical reconstruction of the tension you've identified. I have structured this as a diagnostic analysis of the implicit methodology currently operating in analytic departments, followed by the normative implications.

  ### 1. Reconstructing the Implicit Theory: "Noisy Rationalism"

  The simultaneous teaching of traditional armchair methods and experimental philosophy (x-phi) presupposes a specific, often unstated, epistemological model. I call this **Noisy Rationalism**.

  *   **The Commitment:** It assumes there is a *competence/performance* distinction (borrowed from Chomsky) applied to modal/conceptual knowledge.
  *   **The Mechanism:** Students possess a "conceptual competence" that allows access to necessary truths or constitutive rules (the signal). However, cognitive processing is subject to "performance errors" caused by framing, affect, and cultural context (the noise).
  *   **The Role of X-Phi:** X-phi is taught not to destroy the method, but to map the *noise function*. It identifies which variables (order, emotion, culture) introduce error.
  *   **The Role of Seminars:** Seminars train students to filter the noise. When we grade on consistency, we are not grading on "truth" directly, but on the successful suppression of performance errors to reveal the underlying competence.

  **Confidence: High.** This aligns with the "Expertise Defense" often invoked in response to x-phi (e.g., Williamson, Ludwig), which suggests that while lay intuitions vary, trained philosophical judgment converges. The curriculum assumes training *works*.

  ### 2. Does it require a "Clean" Intuition separable from the Pump?

  **Yes, but normatively rather than psychologically.**

  The practice does not require that a student can *psychologically* isolate the intuition from the framing (x-phi proves they can't). It requires the **normative claim** that there *is* a fact of the matter about what the intuition *ought* to be, independent of the framing.

  If one adopts a **Radical Contextualist** view (where the meaning of the concept *just is* its usage in specific contexts), the traditional method collapses. If the "trolley problem" intuition is constituted by the emotional salience, then removing the salience doesn't reveal the "real" intuition; it creates a *different* intuition.

  Therefore, the department implicitly rejects **Constitutive Contextualism**. It assumes the "pump" is a distorting lens, not a constitutive element of the concept. It presupposes **Modal Realism** or **Conceptual Platonism** lite: there is a stable target (the concept/metaphysical possibility) that exists independently of our psychological access to it.

  **Confidence: High.** The grading norms make no sense without the assumption that there is a "correct" alignment of judgments that transcends specific framings.

  ### 3. Can a Deflationary or Pragmatic Philosophy License Both?

  **Yes, via "Conceptual Engineering" or "Dialectical Utility."**

  A deflationary view (e.g., Cappelen's *Philosophy Without Intuitions* or a pragmatist reading of Reflective Equilibrium) can license this tension if we shift the goal from **Discovery** to **Coherence Testing**.

  *   **The License:** Thought experiments are not "data" revealing pre-existing truths. They are **stress tests** for our linguistic/conceptual frameworks.
  *   **Reliance:** We rely on them because they are the only tools we have to check if a theory is *usable* by agents like us.
  *   **Skepticism:** We teach x-phi to show that our frameworks are fragile and culturally contingent.
  *   **Synthesis:** The goal isn't to find the "True Intuition," but to build a theory that is *robust* across the variations x-phi reveals. If a theory only works for WEIRD (Western, Educated, Industrialized, Rich, Democratic) subjects in low-affect conditions, it is pragmically limited.

  However, this only works if we stop treating intuitions as **evidence** and start treating them as **constraints on theorizing**.

  **Confidence: Medium-High.** This is the most common "peace treaty" in contemporary metaphilosophy, but it struggles to explain why we grade on *consistency* rather than *creative adaptation*.

  ### 4. Rival Views Quietly Ruled Out

  By maintaining this dual practice, the institution implicitly rules out:

  1.  **Hard Naturalism:** The view that if psychology says a judgment is variable, it has no normative weight. (If this were true, we wouldn't grade on intuition consistency).
  2.  **Strong Rationalism:** The view that intuitions are infallible grasps of abstract objects. (If this were true, x-phi variation would be impossible or irrelevant).
  3.  **Foucaultian/Nietzschean Genealogy:** The view that these "concepts" are merely masks for power dynamics. (The course assumes the concepts are worth refining, not dismantling).
  4.  **Radical Experimentalism:** The view that x-phi should *replace* armchair reflection. (The department keeps the armchair).

  **Confidence: High.** The curriculum is a centrist compromise; it excludes the extremes on both sides.

  ### 5. Internal Tensions (Where the parts pull in opposite directions)

  1.  **The Expertise Gap:** We teach x-phi showing that *everyone* (including philosophers, per Schwitzgebel's data) is susceptible to framing. Yet, we grade students as if they can achieve "framing independence" through logic alone. We demand they overcome a bias we just taught them is ubiquitous and persistent.
  2.  **Universalism vs. Particularism:** We ask "What do *you* think?" (Particular) but grade based on whether it matches the "Standard View" (Universal). X-phi validates the Particular (your culture matters); Grading validates the Universal (logic transcends culture).
  3.  **The "Error" Definition:** We define deviations from the "standard" intuition as "errors" (performance noise). But x-phi suggests these deviations might be **systematic features** of human cognition, not bugs. If the variation is systematic, calling it "noise" is a theoretical choice, not an empirical finding.

  **Confidence: High.** These are well-documented friction points in the literature (e.g., the debate between Weinberg/Stich and the Expertise Defense proponents).

  ### 6. Classroom Norm Changes if Hypothetical Judgments Lost Authority

  If we dropped the idea that hypothetical judgments have special authority (i.e., if we accepted the Deflationary/Pragmatic view fully), norms would shift as follows:

  1.  **From "Counterexample" to "Cost-Benefit":** A thought experiment wouldn't "kill" a theory. It would show a *cost* of accepting it. Grading would assess whether the student can justify paying that cost, not whether they can wiggle out of it.
  2.  **Focus on Consequences, not Grounding:** Essays would be graded on the *downstream implications* of a view (what policies, behaviors, or further beliefs it entails) rather than its *upstream grounding* in intuition.
  3.  **Pluralistic Grading:** Consistency would be less valued than **Transparency**. A student who says, "This theory fits my cultural intuition but fails the universalist test," would be rewarded for meta-awareness, rather than penalized for inconsistency.
  4.  **Empirical Integration:** Students would be required to cite empirical data about how humans actually react to these cases as part of the philosophical argument, rather than treating the armchair judgment as superior to the survey data.

  **Confidence: Medium.** This is speculative pedagogy. While it follows from the metaphilosophy, institutional inertia is a massive variable I cannot calculate.

  ### 7. Confidence and Uncertainty Flag

  *   **Confidence in Diagnosis (Noisy Rationalism):** High (90%). This is the standard operating procedure of analytic depts.
  *   **Confidence in Rival Views Ruled Out:** High (85%). The middle-ground position necessarily excludes the extremes.
  *   **Confidence in Norm Changes:** Medium (60%). Predicting pedagogical shifts is harder than analyzing current commitments.
  *   **Confidence in Deflationary Licensing:** Medium-Low (50%).

  **The Claim I Am Least Sure About:**
  I am least sure that a **Deflationary/Pragmatic philosophy can fully license the *grading of consistency*.**

  *Reasoning:* If intuitions are merely pragmatic tools or cultural artifacts (as the deflationary view suggests), then **inconsistency** across cases might be a feature, not a bug. A pragmatic agent might use one concept in Context A and a conflicting concept in Context B if it serves their goals. Traditional grading punishes this as "logical failure." To license the grading norms, you still need a whisper of Rationalism (that there is One True Coherent System). A pure pragmatist might argue that training students to be consistent across all hypotheticals is training them to be *rigid*, not rational. I am unsure if a fully deflationary view can support the normative force required for academic assessment without smuggling rationalism back in.

  **Confidence in this Uncertainty Flag:** High (95%). This is the weakest link in the "peace treaty" between x-phi and traditional methods.
