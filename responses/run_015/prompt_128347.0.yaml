  # Diagnostic Taxonomy: The Unilateralist's Curse

  **Instrument Structure:** 8 Total Nodes (4 Decision Nodes, 4 Terminal Leaves).
  **Usage:** Proceed from the Root (Node 1) by selecting the claim that best matches the analyst's commitment. Follow the branch until a Leaf is reached.

  ### Decision Node 1 (Root)
  **Claim:** Does the analyst accept that individually rational choices can be collectively self-defeating even when every agent shares an identical preference ordering over the final outcomes?
  *   **No:** Proceed to **Decision Node 2**.
  *   **Yes:** Proceed to **Decision Node 3**.

  ### Decision Node 2 (Skepticism Filter)
  **Claim:** Is the apparent self-defeat attributable solely to modeling errors regarding private information and bounded rationality rather than inherent strategic structure?
  *   **Yes:** Terminate at **Leaf 3 (Skeptical Eliminativist)**.
  *   **No:** *Logical Dead End (See Unoccupied Branch Analysis).*

  ### Decision Node 3 (Structural Analogy)
  **Claim:** Is treating sequential moves by one agent across time structurally analogous to simultaneous moves by many distinct agents?
  *   **No (Distinct Agents):** Proceed to **Decision Node 4**.
  *   **Yes (Intertemporal):** Proceed to **Decision Node 4**.

  ### Decision Node 4 (Legitimacy of Binding)
  **Claim:** Is binding arbitration or precommitment permissible only if every affected party (including future temporal stages) explicitly opts in?
  *   **Yes:** Terminate at **Leaf 2 (Libertarian Contractualist)**.
  *   **No:** Terminate at **Leaf 1** (if Node 3 was "Distinct") OR **Leaf 4** (if Node 3 was "Intertemporal").

  ---

  ### Terminal Leaves

  **Leaf 1: Hard-line Coordinationist**
  *   **Path:** Node 1 (Yes) → Node 3 (Distinct) → Node 4 (No).
  *   **Position:** Endorses mandatory, non-opt-in arbitration mechanisms to enforce collective rationality among distinct agents.
  *   **Awkward Practical Commitment:** This position must justify coercing agents who are already fully motivated to achieve the shared good but disagree on the specific method of attainment.

  **Leaf 2: Libertarian Contractualist**
  *   **Path:** Node 1 (Yes) → Node 3 (Any) → Node 4 (Yes).
  *   **Position:** Accepts only opt-in Ulysses-style precommitment contracts, whether between distinct agents or temporal selves.
  *   **Awkward Practical Commitment:** This position must accept collectively catastrophic outcomes as legitimate whenever a single affected party (or future self) refuses to consent to the preventive constraint.

  **Leaf 3: Skeptical Eliminativist**
  *   **Path:** Node 1 (No) → Node 2 (Yes).
  *   **Position:** Denies the curse applies to real-world agents, attributing apparent failures to bounded rationality and private information about compliance.
  *   **Awkward Practical Commitment:** This position must dismiss robust experimental evidence of coordination failure in controlled environments where information is perfect and rationality is incentivized.

  **Leaf 4: Intertemporal Unilateralist**
  *   **Path:** Node 1 (Yes) → Node 3 (Intertemporal) → Node 4 (No).
  *   **Position:** Applies the curse logic to intra-personal sequential choice and argues constitutional precommitment merely displaces the conflict to a higher order of choice rather than solving it.
  *   **Awkward Practical Commitment:** This position must treat one's own future agency as a strategic adversary whose potential unilateralism requires present containment, risking a regress of constitutional constraints.

  ---

  ### Diagnostic Analysis

  #### 1. Unoccupied Branch Combination
  **Combination:** An analyst who answers **No** to Decision Node 1 (denying shared preferences/self-defeat) but nevertheless demands **centralized binding arbitration** (skipping to Leaf 1 logic).
  **Diagnosis:** This gap is **incoherent**. If an analyst denies that agents share preference orderings or that individual rationality is self-defeating under shared preferences, there is no logical basis for imposing a "collective" solution via arbitration. Demanding binding authority in this context implies a preference for authoritarian control disguised as rational coordination, lacking the game-theoretic justification the taxonomy is designed to map.

  #### 2. Leaf Convergence and Collapse
  **Flagged Pair:** **Leaf 2 (Libertarian Contractualist)** and **Leaf 4 (Intertemporal Unilateralist)**.
  **Diagnosis:** These leaves risk collapsing into the same recommendation when the domain shifts to **constitutional precommitment**. If the Intertemporal Unilateralist (Leaf 4) concedes that a constitutional constraint *does* solve the displacement problem (effectively answering "Yes" to Node 4), they converge with the Libertarian Contractualist on the utility of precommitment. The tree separates them based on the *normative interpretation* of the constraint (legitimate contract vs. displaced conflict), but in practice, both may endorse identical constitutional designs. The distinction holds only if the Intertemporal Unilateralist maintains that all precommitment is inherently destabilizing, whereas the Libertarian views it as stabilizing provided consent exists.
