  # Activity: The Mnemic Arbitrage Protocol

  **Target:** 16 Philosophy Grad Students
  **Time:** 90 Minutes
  **Goal:** Experiential demonstration of intransitive "better than" relations via multi-attribute tradeoffs.
  **Framing:** Students are "Archivists" evaluating Memory Implants for a post-human colony. The value function is hidden.

  ## 1. Setup & Materials (Prep time: 20 mins)
  You need 4 tables of 4 students. Each table gets:
  *   **Deck A (The Spectrum):** 12 Cards labeled M1 through M12.
  *   **Ledger Sheets:** One per student.
  *   **Coherence Bonds:** Each student starts with 100 points (written on paper, no real money).
  *   **Tokens:** 20 red, 20 blue per table (for voting/marking).

  **The Card Stats (Hidden on back, visible on front):**
  Each card has three scores (1-100) across orthogonal dimensions: *Vividness (V)*, *Coherence (C)*, *Resonance (R)*.
  *   **The Trap:** The deck is constructed so that adjacent cards (M1 vs M2, M2 vs M3) differ by only 5 points in one dimension, making the preference obvious locally. However, the dimensions rotate in importance.
  *   **M1:** V:90, C:50, R:50
  *   **M2:** V:85, C:55, R:50 (Slight V drop, C gain)
  *   **M3:** V:80, C:60, R:50
  *   ...
  *   **M6:** V:65, C:75, R:50
  *   **M7:** V:60, C:75, R:55 (Shift starts favoring R)
  *   ...
  *   **M12:** V:30, C:50, R:90

  *Note:* The specific numbers are tuned so that most people prefer M1 > M2 (V is king early), but by M12, R is king. However, M12 is intuitively "worse" than M1 because V is too low, creating a cycle if they claim M1 > M2 > ... > M12 > M1.

  ## 2. Roles (Rotate halfway)
  *   **Arbiter (1 per table):** Holds the master key, confirms trades, does not judge value.
  *   **Scribe (1 per table):** Records pairwise judgments on the ledger.
  *   **Archivists (2 per table):** The actual decision makers.

  ## 3. Timeline

  **00-15: Briefing & Calibration**
  *   Explain the "Mnemic Bundle" framing. These aren't lives, they're experiential packets.
  *   Rule 1: You must compare adjacent cards (M1 vs M2, M2 vs M3) in order.
  *   Rule 2: You must declare a preference (A > B or B > A). No "equal" allowed.
  *   Rule 3: Every declaration costs 1 Coherence Bond.
  *   Rule 4: If your final set of judgments contains a logical cycle (A>B, B>C, C>A), you lose 50 Bonds.
  *   *Why this matters:* They pay to judge, but pay heavily for inconsistency. This forces them to trust their local intuition until the penalty hits.

  **15-45: The Spectrum Walk (Local Judgments)**
  *   Archivists go through M1 vs M2 up to M11 vs M12.
  *   They record judgments on the Ledger.
  *   Most will say M1 > M2 > M3... because Vividness feels dominant early on.
  *   Around M6-M7, the tradeoff shifts. Some might flip. Let them.
  *   **Crucial Mechanic:** At M12, they are offered a "Bonus Round." They can swap their final holding (M12) back to M1 for a 5 Bond bonus *if* they judge M1 > M12.
  *   Almost everyone will judge M1 > M12 (High Vividness vs Low Vividness).
  *   *Result:* They have now verbally committed to M1 > M2 > ... > M12 AND M12 < M1.

  **45-60: The Audit (Global Check)**
  *   Arbiters collect Ledgers.
  *   They run a simple transitivity check (can be done by hand for 12 items).
  *   If a cycle exists (M1 > M2... > M12 > M1), the 50 Bond penalty is applied.
  *   **The Kicker:** Most tables will incur the penalty. They prioritized local rationality (the obvious step) over global consistency.

  **60-75: The Market Correction (Second Run)**
  *   Students try to "fix" their ledger to save points.
  *   They are allowed to flip *one* judgment in the chain to break the cycle.
  *   They must debate which link is the "weak" one (the lexical threshold).
  *   This is where the philosophical meat is. Is M6 > M7 the false step? Or is M1 > M12 the false assumption?

  **75-90: Debrief & Mapping**
  *   Bring the room together.
  *   Map the mechanics to the theory (see below).

  ## 4. Debrief Guide (Mapping Mechanics to Theory)

  Do not lecture. Ask these specific questions to draw out the concepts:

  1.  **The Local/Global Split:** "When did you feel sure about M1 vs M2 compared to M1 vs M12?"
      *   *Map:* This is the difference from local transitivity (adjacent steps) vs global transitivity (distant steps). The game forces you to trust the local until the global collapses.
  2.  **The Penalty Zone:** "Who flipped a judgment just to save points during the Correction phase?"
      *   *Map:* This mirrors 'forced choice' in value theory. Are you changing your value judgment, or just your report? This highlights the difference between *ontological* intransitivity vs *epistemic* uncertainty.
  3.  **The Dimension Shift:** "Did anyone notice the weight of Vividness drop around Card 7?"
      *   *Map:* This corresponds to 'lexical thresholds' or changing weightings in commensurable goods. The 'better than' relation wasn't stable because the context of the comparison shifted the metric.
  4.  **The Cycle:** "If you had to keep the cycle and lose the points, would the world be inconsistent, or just your ledger?"
      *   *Map:* Hard cases vs. parity. Is the cycle in the world (value is intransitive) or in us (we are bad at judging)?

  ## 5. Frank Assessment: Limitations & Failure Modes

  You asked for honesty about what wont work. Here's the breakdown:

  **What the Game Can't Reproduce:**
  *   **Phenomenological Hesitation:** The game forces a binary choice (A > B). In real value theory, the interesting bit is often the *hesitation*—the sense that neither is better and they aren't equal (parity). The payoff scheme punishes hesitation (no "equal" allowed), so you lose the "hard case" texture where "better than" simply doesn't apply.
  *   **Context Independence:** In the game, the cards are static. In real reasoning, comparing A to B might change how you see A when you later compare it to C. The game assumes fixed preferences, which begs the question against constructivist views of value.

  **What Will Predictably Go Wrong (First Run):**
  *   **Gaming the Points:** Grad students are competitive. Some will realize early that M1 > M12 creates a cycle. They will intentionally flip a middle judgment (like M6 > M7) arbitrarily just to save the 50 Bonds, bypassing the philosophical tension. They'll treat it as a logic puzzle, not a value test.
      *   *Fix:* Tell them the "Bonus Round" judgment (M1 vs M12) is mandatory and locked before they see the full chain stats.
  *   **Dimension Salience:** If Vividness is too obvious, everyone just maximizes V and no cycle forms. If the tradeoff is too subtle, they call everything "equal" despite the rules. You need to pilot the numbers.
  *   **Role Passive-aggression:** The Arbiter might influence the Scribe. Keep roles strict.

  **One last thing:** Watch out for the group that claims "M12 is actually better because Resonance matters more." That's not a failure; that's a successful rejection of the spectrum. If half the room rejects the spectrum, the transitivity test fails because there's no agreed-upon metric. You might need to enforce a "common weighting" rule, but that undermines the point. Let it clash.

