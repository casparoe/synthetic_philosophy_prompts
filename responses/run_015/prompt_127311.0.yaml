  **Factor 2 (Specific Gamete)** is doing the most work. If you concede that biological origin matters at all, it is extremely difficult to draw a non-arbitrary line at "parents" rather than "zygote," because the genetic variance between sibling zygotes is as large as the variance between cousins.

  **Least Sure Factor:**
  **Factor 3 (Psychological Carryover)** is the most uncertain. It is conceptually difficult to prove that a perfect psychological transfer is *metaphysically impossible* rather than just *physically impossible*, leaving a gap for your friend's intuition.

  **Where the Disagreement Lives:**
  Your disagreement (0.6 vs 0.2) lives almost entirely in **Factor 1 and Factor 3**. Your friend likely assigns a probability below 0.3 to "Biological origin is necessary," viewing persons as essentially minds/software that could run on different hardware (gametes). You view persons as essentially organisms/history. You are arguing about whether "you" are a *pattern* or a *substance*.

  **Argument to Move the Number:**
  The **Fission/Branching Case**. Ask your friend: "If your psychology was copied into two different bodies created from different gametes simultaneously, which one is *you*?"
  *   If they say "both," they violate the logic of identity (one thing cannot be two things).
  *   If they say "neither," they admit psychology isn't sufficient for identity.
  *   If they say "one," they need a non-arbitrary principle to pick one, which usually defaults to origin or physical continuity.
  This forces the psychological view into a logical corner that origin essentialism avoids.
