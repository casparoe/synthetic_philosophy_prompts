  Here is the decomposition of that number:

  1.  **0.80 — Probability that biological origin is a necessary condition for personal identity.**
      *   *Justification:* We are token biological organisms, and token organisms are individuated by their spatiotemporal history, not just their functional state.
  2.  **0.90 — Probability that if origin matters, it requires the specific gamete pair rather than just the parents.**
      *   *Justification:* Different gamete combinations produce distinct genetic codes, and genetic code is the primary individuating factor for biological tokens.
  3.  **0.60 — Probability that psychological continuity cannot metaphysically "carry over" to a different origin.**
      *   *Justification:* Psychological similarity creates a *duplicate*, but numerical identity requires a unique historical path that cannot be branched or swapped.
  4.  **0.60 — Probability that the term "I" rigidly designates a historical substance rather than a descriptive pattern.**
      *   *Justification:* Our practices of moral responsibility and survival anxiety track the persistence of a specific entity, not the replication of a mental state.

  **Synthesis:**
  Factors 1 and 2 are high-confidence anchors (we are animals, and animals are genetically specific), which pulls the baseline up. Factors 3 and 4 are the battlegrounds where psychological views attack, dragging the number down from near-certainty to a moderate majority. The combination yields **0.65**.

