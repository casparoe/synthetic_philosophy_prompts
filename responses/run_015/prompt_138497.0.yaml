answer: |-
  This is a high-wire act. You are asking students to generate a philosophical conclusion through embodied experience while preventing them from intellectualizing the setup too early. Your instincts are largely correct, but the logistics of Stage 1 need to be airtight to avoid the "it's just a game" deflation, and Stage 2 needs strict facilitation to prevent the Econ majors from solving it with Expected Utility theory before the Phil majors have felt the moral tension.

  Here is the design.

  ### 1. Logistics & Materials

  *   **Room:** Seminar table preferred. If rows, ensure they can pass slips forward easily.
  *   **Materials:**
      *   18 identical small slips of paper (cut index cards).
      *   18 pens.
      *   1 opaque collection box (a mug or bin).
      *   Timer (visible to you, not necessarily them).
      *   Board markers (two colors).
  *   **The Currency:** **Class Time.**
      *   *Why:* Money is ethically fraught; candy is trivial; boredom is hard to measure. Time is the one resource they all value equally and feel acutely at the end of a 90-minute block.
      *   *The Deal:* The class is scheduled for 90 minutes. You will run the activity for 85 minutes. The remaining 5 minutes are "guaranteed free time."
      *   *The Mechanism:* Every "Yes" vote in Stage 1 adds **10 seconds** of a mandatory, silent, eyes-closed "cool-down" task at the very end of class.
      *   *The Math:* 18 students. If all vote Yes = 180 seconds (3 minutes). They lose 3 of their 5 free minutes. This is *felt*. If 1 student votes Yes = 10 seconds. This is *imperceptible* (within the noise of packing up bags).

  ### 2. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out slips/pens as they enter. No greeting beyond "Sit anywhere." |
  | **05-15** | **Stage 1** | **The Switch Game.** Write prompt on board. Silent voting. Collect slips. Count Yes votes silently. |
  | **15-20** | **Reveal 1** | Announce the total time added. Do *not* explain why yet. Just say: "We will do this at the end." |
  | **20-50** | **Stage 2** | **The Comparison.** Three rounds (Standard, Imperceptible, Shaped). Board tally. |
  | **50-60** | **Variant** | **Probabilistic.** (Only if time permits, otherwise cut). |
  | **60-85** | **Debrief** | Connect Stage 1 to Stage 2. Reveal Parfit. Map the objections. |
  | **85-90** | **Cleanup** | **The Tax.** Enforce the Stage 1 time cost. Dismiss. |

  ### 3. Board Script & Slip Wording

  **Do not erase the board between stages.** The visual accumulation is part of the data.

  **Stage 1 Board (Write before class starts):**
  > **DECISION**
  > Add 10 seconds to End-Task?
  > Yes / No
  > *Anonymous. Total affects everyone.*

  **Stage 1 Slip (Printed):**
  > [ ] YES
  > [ ] NO
  > *Your choice adds 10 seconds to the class End-Task if selected.*

  **Stage 2 Board (Write after Stage 1 voting is done):**
  > **COMPARISON**
  > **A:** 1 Person, 1 Hour Migraine
  > **B:** N People, 1 Second Eye Irritation
  >
  > At what N does B become worse than A?
  >
  > *Round 1 (Felt):* __________
  > *Round 2 (Unfelt):* __________
  > *Round 3 (Cumulative):* __________

  **Instructor Script (Verbal Only):**

  *   **Stage 1 Intro:** "Fill out the slip. Fold it. Put it in the box. Do not discuss. I will count the total and announce the consequence."
  *   **Stage 1 Reveal:** "There were [X] Yes votes. That is [X * 10] seconds. We will perform this task at the end of class. No discussion yet."
  *   **Stage 2 Intro:** "We are going to compare two scenarios. Scenario A is fixed. Scenario B changes. I want a consensus number for N. Raise your hand when you want to stop."
  *   **Stage 2 Round 1 (Standard):** "One person gets a severe migraine for one hour. Versus N people get a dust speck in the eye for one second. They feel it. It's annoying. Start at N=1. When does B become worse than A?" (Facilitate the count up).
  *   **Stage 2 Round 2 (Unfelt):** "Same N. But the irritation is now a neural blip. It registers on a scan as a pain signal, but the person does not consciously notice it. No behavior change. When does B become worse than A?"
  *   **Stage 2 Round 3 (Shaped):** "Same N. But the irritation is cumulative. The 1st speck is nothing. The 1000th makes you want to rub your eye. The 10,00th makes you cry. Total duration is the same. When does B become worse than A?"
  *   **The Reveal (Minute 60+):** "This is Derek Parfit's 'Torture vs. Dust Specks.' Stage 1 was the epistemic problem. Stage 2 is the aggregative problem."

  ### 4. Debrief Map (The Philosophical Work)

  Do not lecture. Ask questions that force them to locate their own inconsistency.

  **1. Mapping Stage 1 (The Marginal Insignificance)**
  *   *Ask:* "Look at the slips. If you voted Yes, why? If No, why?"
  *   *The Trap:* If they say "My 10 seconds didn't matter," highlight that the *total* mattered.
  *   *The Link:* "In Stage 2, the Utilitarian says the dust speck is like your 10 seconds. Individually negligible. Collectively catastrophic. Did Stage 1 make you more or less willing to aggregate in Stage 2?"
  *   *Point:* This pressures the **Denial of Summation**. If they admit Stage 1 cost was real, they must admit small units sum.

  **2. Mapping Stage 2 Rounds (The Threshold)**
  *   *Ask:* "Compare Round 1 (Felt) and Round 2 (Unfelt). Did the N change?"
  *   *If N went up in Round 2:* You value *conscious experience* over *biological state*. (Pressures Hedonism).
  *   *If N stayed same:* You value *objective harm* regardless of experience. (Pressures Preference Satisfaction).
  *   *The Gap:* "If you stopped at N=1,000,000 in Round 1, but N=Infinity in Round 2, you are positing a **Threshold**. Where is it? Is it at the level of consciousness?"

  **3. Mapping Round 3 (The Shape)**
  *   *Ask:* "In Round 3, the harm wasn't linear. Did that change your N?"
  *   *The Point:* If N changed, you aren't tracking "Total Suffering" (Area under the curve); you are tracking "Peak Suffering" or "Intensity." This pressures the **Cardinal Measurability** assumption.

  **4. The Probabilistic Variant (If run)**
  *   *Ask:* "N people have a 1/N chance of the Migraine. Expected harm is identical to 1 certain Migraine. Did this feel easier to accept?"
  *   *The Point:* This appeals to Econ majors (Expected Utility). It shows that *risk distribution* alters moral intuition even if *expected value* is constant.

  ### 5. Honesty Limits (What You Must Say)

  You cannot let them think the activity *proves* Utilitarianism. You must explicitly state these three silences in the debrief:

  1.  **The Scale Gap:** "We used N=10,000. Parfit uses N=3^^^3. We cannot physically simulate the astronomical. You are extrapolating from a human scale to an inhuman scale. That extrapolation is where the error might hide."
  2.  **The Stakes Gap:** "We used minutes and eye specks. Real Utilitarianism deals with torture and death. Your intuition might handle specks differently than trauma. The activity cannot test the trauma response."
  3.  **The Commensurability Assumption:** "This activity assumes we can trade time for pain, and one person's pain for another's. If you believe rights are trumps, or persons are separate, this entire board is category error. The activity assumes Interpersonal Comparability of Welfare. It cannot prove it."

  ### 6. Predicted Failures & Fallbacks

  **1. The Joker (Votes Yes to sabotage)**
  *   *Risk:* They vote Yes to make the class stay late, ruining the "imperceptible" premise.
  *   *Fallback:* If the Yes count is suspiciously high (e.g., 18/18), call it out in the debrief. "If you voted Yes to test the system, you treated the cost as a game. That confirms the epistemic problem: you didn't feel the cost of your vote." Do not punish. Use it as data.

  **2. The Refuser (Won't vote on principle)**
  *   *Risk:* Disrupts the count.
  *   *Fallback:* "Leave it blank." Count it as a No for the total, but note in debrief: "Abstention is a moral stance. It suggests the choice itself was impermissible."

  **3. Anchoring (Waiting for you to suggest N)**
  *   *Risk:* They look to you for the "right" number.
  *   *Fallback:* Start at N=1. "Is 1 speck worse than 1 migraine?" (No). "Is 2?" (No). Keep doubling. "10, 100, 1,000..." Force *them* to say "Stop." Write the number where the first hand goes up.

  **4. Deflation ("It's just a game")**
  *   *Risk:* They don't care about the 3 minutes of lost time.
  *   *Fallback:* **Enforce the time strictly.** If the vote adds 3 minutes, keep them 3 minutes over. Do not let them pack up. Stand silently at the door. The resentment they feel *is the data*. In debrief: "You are annoyed right now. That annoyance is the sum of 18 imperceptible choices."

  **5. The Econ Takeover (Expected Utility dominates)**
  *   *Risk:* Econ majors solve Round 1 immediately using math, bypassing the intuition pump.
  *   *Fallback:* "Calculate the expected utility later. Right now, I want your gut. Does it *feel* worse?" If they refuse, assign them the role of "Auditor" to track the numbers while the Phil majors track the feelings.

  ### 7. Philosophical Judgment: Does this work?

  You asked: *Does an activity like this actually support the aggregative answer, or does it only show that intuitions are calibrated to harms that are perceptible, comparable, and medium-sized?*

  **Verdict:** It shows the latter, and that is a genuine philosophical result.

  It does **not** prove that aggregation is correct. It proves that **Reflective Equilibrium is unstable.**
  *   In Stage 1, they usually accept aggregation (because the total cost is real).
  *   In Stage 2, they usually reject aggregation (because the torture feels qualitatively different).
  *   The activity forces them to hold these two contradictory attitudes simultaneously.

  **Is this dodging?** No. It is diagnostic.
  If they walk out thinking "Utilitarianism is true," you failed.
  If they walk out thinking "My intuition rejects aggregation in Stage 2, but I have no principled reason why it accepted it in Stage 1, and I need to find a principle that distinguishes them," you succeeded.

  The activity's job is not to solve the Repugnant Conclusion. Its job is to make the Repugnant Conclusion feel like a live wire rather than a textbook puzzle. By making them *pay* the cost in Stage 1, you remove the luxury of treating Stage 2 as abstract.

  **One final warning:**
  Be prepared for the silence in Minute 85 when you enforce the time tax. They will be annoyed. Let them be annoyed. That annoyance is the only thing that makes the "Dust Specks" real. Do not apologize for it. Apologizing undermines the reality of the harm. Simply say: "This was the agreement. This is the sum of your choices." Then dismiss.
