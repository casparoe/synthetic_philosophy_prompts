answer: |-
  ### Strategic Research Agenda: Prioritization and Dependency Analysis

  Given the constraints of a three-year timeline and a single postdoctoral researcher, the research unit cannot pursue all four lines of inquiry with equal depth. The strategy must prioritize questions that act as logical prerequisites for the others, maximize empirical falsifiability, and minimize the risk of investing resources into a theoretical framework that may be computationally redundant or biologically ungrounded.

  The proposed agenda orders the inquiries based on a **Computational-to-Mechanical Dependency Chain**. The effort should be distributed as follows:

  1.  **Primary Focus (Year 1):** Question 1 (Active Inference vs. Expected Utility).
  2.  **Core Execution (Years 1–3):** Question 3 (Precision-Weighting and Neuromodulation).
  3.  **Active Deprioritization:** Question 2 (FEP vs. Hierarchical Predictive Coding) and Question 4 (Extensions to Social/AI Systems).

  ---

  ### 1. Dependency Structure and Logical Ordering

  The ordering is dictated by the upstream-downstream relationships between the computational goals of the system and their biological implementation.

  **Question 1 (AIF vs. EU) is the Logical Gatekeeper.**
  This question is the most upstream. It concerns the normative definition of the agent's objective function. If Active Inference is mathematically equivalent to Expected Utility maximization under a specific transformation, then the framework offers no new decision-theoretic predictions, only a new notation.
  *   **Dependency:** Question 3 (Mechanism) depends on Question 1. One cannot model the neural implementation of "precision-weighted prediction error minimization" (Q3) without first establishing whether this objective function generates behavioral trajectories distinct from standard utility maximization (Q1).
  *   **Risk of Mootness:** If Question 1 is resolved as "equivalent," the research agenda does not terminate, but it fundamentally pivots. The project becomes an investigation into how the brain efficiently computes standard utility, rather than testing a novel principle of life. Resolving this early prevents three years of modeling a "distinct" architecture that is actually standard economics in disguise.

  **Question 3 (Precision/Neuro) is the Empirical Bottleneck.**
  This question is the critical path for biological validity. Even if Question 1 establishes that Active Inference is distinct, the theory fails as a neuroscience framework if the proposed mechanism (precision weighting) cannot be linked to identifiable physiological processes (e.g., gain control via neuromodulators).
  *   **Dependency:** Question 4 (Extensions) depends on Question 3. Extending the framework to social or artificial systems is premature if the core biological mechanism is unspecified or unmapable. A theory that cannot account for the single-agent biological substrate cannot reliably scale to multi-agent or synthetic substrates.
  *   **Downstream Consequence:** A successful mapping in Question 3 provides the "hooks" required for experimentalists to test the theory. Without this, the framework remains metaphysical.

  **Question 2 (FEP vs. HPC) is Subsumed.**
  This question concerns the formal relationship between the variational bound and hierarchical error correction.
  *   **Rationale for Deprioritization:** This is largely a formalist debate. If Question 3 successfully identifies neural signatures of precision weighting, the formal distinction between FEP and HPC becomes secondary to the empirical adequacy of the model. Pursuing this as a standalone theoretical question consumes resources without generating testable predictions. It should be treated as a background assumption rather than a research target.

  **Question 4 (Extensions) is Premature.**
  *   **Rationale for Deprioritization:** This is the most downstream inquiry. Attempting to scale the theory to social or developmental domains before settling the single-agent computational (Q1) and mechanistic (Q3) foundations invites compounding errors. If the core theory requires revision based on Q1 or Q3 findings, all work on Q4 would be rendered moot.

  ---

  ### 2. Distribution of Effort and Timeline

  **Phase 1: The Decision-Theoretic Filter (Months 1–6)**
  *   **Target:** Question 1 (AIF vs. EU).
  *   **Activity:** The postdoctoral researcher should not attempt to prove mathematical equivalence or distinctness in the abstract. Instead, the effort must focus on **divergent behavioral predictions**. The goal is to identify specific task environments or parameter regimes where Active Inference and Expected Utility maximization yield quantitatively different choices.
  *   **Criteria:** Tractability and Risk Mitigation.
  *   **Deliverable:** A computational model demonstrating either (a) a clear behavioral divergence that justifies the AIF label, or (b) a mapping showing equivalence that reframes the project as efficient utility coding.
  *   **Justification:** This is the highest-leverage activity. It requires only simulation and mathematical analysis, fitting the skillset of a single theorist. It resolves the "mootness" risk early.

  **Phase 2: The Mechanistic Bridge (Months 7–36)**
  *   **Target:** Question 3 (Precision/Neuro).
  *   **Activity:** Assuming Phase 1 yields a working computational model, the bulk of the remaining resources (approximately 60% of total effort) must be dedicated to mapping the model's precision parameters to neuromodulatory dynamics. This involves generating specific, falsifiable predictions about how changes in uncertainty should alter neural gain or firing rates in specific circuits.
  *   **Criteria:** Magnitude of Downstream Consequence.
  *   **Deliverable:** A set of proposed experimental protocols or analysis pipelines that can be handed to empirical collaborators.
  *   **Justification:** This is the only path to transforming the framework from a mathematical theory into a biological one. It is the most resource-intensive phase, requiring detailed biophysical modeling or analysis of existing open-source neural data.

  **Parallel Background Work (Months 1–36)**
  *   **Target:** Question 2 (FEP vs. HPC).
  *   **Activity:** Minimal effort (approx. 10%). The researcher should utilize the formalism that is most computationally efficient for the tasks in Phase 1 and 2, without worrying about whether it is "truly" FEP or HPC.
  *   **Justification:** Resolving this distinction is unlikely to change the behavioral or neural predictions generated in Phases 1 and 2. It is a redescription risk that is best managed by empirical success rather than formal proof.

  **Excluded Work**
  *   **Target:** Question 4 (Extensions).
  *   **Activity:** Zero dedicated effort.
  *   **Justification:** High risk of rendering work moot. If the core model changes based on Phase 1 or 2 findings, social or AI extensions built on the initial model would be invalid. This line of inquiry should only be revisited after the three-year period if Q1 and Q3 are robustly settled.

  ---

  ### 3. Defense of Criteria and Trade-offs

  **Tractability with Present Methods**
  Question 1 is addressed via simulation, which is highly tractable for a single researcher. Question 3 is addressed via computational neuroscience modeling, which is also tractable without requiring new wet-lab infrastructure. Question 2 involves formal proofs that often stall without empirical grounding. Question 4 requires multi-agent modeling or longitudinal data that exceeds the capacity of one postdoc in three years.

  **Magnitude of Downstream Consequence**
  Settling Question 1 determines the *identity* of the theory (Novel Principle vs. Standard Economics). Settling Question 3 determines the *validity* of the theory (Biological Mechanism vs. Abstract Math). These two have the highest consequence. Question 2 has low consequence for empirical work. Question 4 has high consequence but is contingent on the success of Q1 and Q3.

  **Risk of Mootness**
  The greatest risk is spending three years building social models (Q4) or formal proofs (Q2) only to discover that the core decision architecture (Q1) is redundant or the neural mechanism (Q3) is unmappable. By placing Q1 first and Q3 second, the agenda ensures that if the theory fails, it fails fast and cheaply, preserving resources for pivot. If the theory succeeds, it does so on the strongest possible foundation: distinct behavioral predictions grounded in identifiable biology.

  ### Summary of Allocation

  | Inquiry | Priority | Effort Allocation | Timing | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **Q1: AIF vs. EU** | **High** | 30% | Months 1–6 (Intensive) | **Logical Prerequisite.** Determines if the project tests a new theory or restates an old one. |
  | **Q3: Precision/Neuro** | **High** | 60% | Months 7–36 (Sustained) | **Empirical Bottleneck.** The only route to biological falsifiability and experimental utility. |
  | **Q2: FEP vs. HPC** | **Low** | 10% | Parallel (Background) | **Formalist.** Subsumed by empirical success in Q3; distinctness matters less than prediction. |
  | **Q4: Extensions** | **None** | 0% | Deferred | **Downstream.** Premature scaling; high risk of mootness if core theory requires revision. |

  This agenda sacrifices breadth for depth, acknowledging that a constrained unit cannot solve the philosophy, mathematics, biology, and sociology of the framework simultaneously. It bets on the proposition that a biologically grounded, computationally distinct core is more valuable than a broad, ungrounded application.
