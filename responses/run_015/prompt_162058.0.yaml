answer: |-
  You have identified a genuine and subtle epistemic phenomenon. There is no single, standardized term in philosophy of science or rhetoric that captures *exactly* this mechanism: the diachronic, discursive migration of credibility from a domain where a metaphor is technically apt to domains where it is not, without triggering the usual alarms of equivocation or reification.

  The closest established concepts are **"Conceptual Stretching"** (Giovanni Sartori), which describes extending a term until it loses meaning, and **"Constitutive Metaphor"** (Richard Boyd), which argues metaphors are necessary for theory construction. However, "stretching" implies degradation (you suspect the term is still fruitful), and "constitutive" describes the *role* of the metaphor, not the *mechanism of credibility transfer* you are observing.

  Since nothing established fits the specific carving you require, I will adopt and formalize your economic intuition. The term is **Metaphorical Subsidy**.

  ### 1. The Carving: How *Metaphorical Subsidy* Differs

  **Metaphorical Subsidy** is the process by which the epistemic warrant (the "right to be believed" or "right to generate inferences") earned by a term in a narrow, technically accurate context is spent in a wider, technically loose context, across a literature rather than within an argument.

  *   **Vs. Equivocation:** Equivocation is a logical fallacy within an argument (A means X in premise 1, A means Y in premise 2). Subsidy is a sociological/epistemic phenomenon across a discourse (Paper A uses "code" accurately; Paper B uses "code" loosely; Paper C cites both, inheriting the accuracy of A to bolster the looseness of B).
  *   **Vs. Dead Metaphor:** A dead metaphor (e.g., "leg of a table") no longer invokes the source domain. "Code" in biology is live; it actively suggests decoders, messages, and errors. Subsidy requires the metaphor to be alive enough to carry weight, but dead enough that its inconsistencies aren't checked.
  *   **Vs. Reification:** Reification claims the metaphor is literal reality ("The genome *is* a book"). Subsidy works even when authors acknowledge it's a metaphor, provided the *inferences* drawn rely on the metaphorical properties (e.g., "editing" implies an editor, even if the author knows it's just nucleases).
  *   **Vs. Constitutive Metaphor:** Boyd argues metaphors are essential to discover reality (e.g., "electric current" as fluid). Subsidy is more specific: it explains how the *authority* of the successful mapping (codon→amino acid) insulates the unsuccessful mappings (methylation→annotation) from scrutiny.

  ### 2. The Agent and Interpreter

  Does it need a sender or interpreter? **Yes, but they are shifty.**

  For the subsidy to work, the discourse must allow the "interpreter" to slide between the **cellular machinery** (ribosome, polymerase), the **evolutionary process** (selection), and the **human scientist** (sequencer, editor).
  *   In the "Cipher" model, the interpreter is the cryptographer (scientist).
  *   In the "Program" model, the interpreter is the CPU (ribosome).
  *   In the "Text" model, the interpreter is the Reader (ambiguous).

  The subsidy functions because the *term* ("code") remains constant while the *agent required to make sense of the term* shifts quietly to suit the context. If a single paragraph demanded a consistent agent, the subsidy would collapse.

  ### 3. Benign vs. Misleading Migrations

  The migration is **benign (fruitful)** when it imports *heuristic strategies* without importing *ontological commitments*.
  *   *Example:* Treating the genome as a "text" led to the search for "punctuation" (promoters/terminators). This was fruitful even if DNA isn't literally text, because it prompted the search for structural delimiters.

  The migration is **misleading** when it imports *normative expectations* that obscure mechanism.
  *   *Example:* Treating a mutation as an "error" or "violation" implies a standard of correctness or a goal-directed proofreading system. This can obscure the fact that "errors" are often just chemical affinities that weren't selected against, not deviations from a norm.

  **The Distinction:** A fruitful subsidy generates **new questions** (Where is the punctuation?). A misleading subsidy suppresses **mechanistic details** (How does the cell "know" it's an error?).

  ### 4. The Diagnostic Test

  To determine if a paragraph is relying on *Metaphorical Subsidy* or doing genuine explanatory work, apply the **Substitution and Agency Audit**.

  **Step 1: The Substitution Test**
  Replace the code-word ("code," "encode," "decode," "edit," "annotate") with a mechanistic descriptor ("bind," "catalyze," "modify," "inhibit").
  *   *Result A:* The sentence becomes clunky but the inference holds. (The term was ornament).
  *   *Result B:* The sentence collapses or the inference no longer follows. (The term is doing work).
  *   *Result C:* The sentence holds, but the *implication* changes (e.g., "violation" becomes "failure to bind"). (This indicates Subsidy).

  **Step 2: The Agency Audit**
  Ask: **"Who or what is performing the action implied by the verb?"**
  *   If the text says the cell "reads" the DNA, is the decoder the ribosome (chemical), the organism (functional), or the scientist (informational)?
  *   *Diagnostic:* If the paragraph requires the decoder to be **intentional** to make sense of the inference (e.g., "correcting an error"), but the mechanism described is **blind** (chemical affinity), the paragraph is running on Metaphorical Subsidy.

  **Step 3: The Normative Leakage Check**
  Does the text distinguish between **"does not happen"** and **"should not happen"**?
  *   If a chemical reaction fails, it "does not happen."
  *   If a code is violated, it "should not happen."
  *   *Diagnostic:* If the prose treats a low-probability chemical event as a "violation" or "corruption" without referencing a selective pressure or proofreading mechanism, it is leveraging the "Legal Code" model via Subsidy.

  ### 5. The Term and Cases

  **Term:** **Metaphorical Subsidy**
  **Definition:** The epistemic practice wherein the empirical success of a metaphor in a narrow domain (Source) confers unearned warrant upon inferences drawn from that metaphor in a wider domain (Target), sustained by discursive consistency rather than logical validity.

  **Two Clear Cases of Metaphorical Subsidy:**

  1.  **"Epigenetic Annotation"**
      *   *Prose:* "Methyl groups act as marginalia, annotating the text of the genome to tell the cell which passages to read."
      *   *Why it fits:* The "Genetic Code" (Source) is a fixed mapping. Methylation (Target) is a chemical probability modifier. The word "annotation" borrows the authority of "Code" to imply a *Reader* who understands the notes. In reality, methyl groups sterically hinder binding proteins. There is no "reading" of the annotation, only physical blocking. The "text" model subsidizes the "chemical" model, licensing the inference that the marks are "meaningful" in a semantic sense rather than a structural one.
  2.  **"CRISPR Word Processing"**
      *   *Prose:* "CRISPR-Cas9 allows us to search and replace genetic typos in the living code."
      *   *Why it fits:* "Search and Replace" implies a semantic understanding of the string (knowing *what* to find). Cas9 finds targets via RNA hybridization (chemical complementarity). "Typo" implies a deviation from a correct spelling. In biology, a variant is only a "typo" relative to a specific fitness landscape or a reference sequence, not an absolute standard. The "Computer Program" model subsidizes the "Enzymatic" model, licensing the inference that the edit is precise and semantic, obscuring off-target chemical effects.

  **Two Near-Misses (Not Instances):**

  1.  **"The Genetic Code" (The Triplet Table)**
      *   *Prose:* "The codon UUU encodes Phenylalanine."
      *   *Why it's a near-miss:* This is the **Source Domain**. The mapping is arbitrary, frozen, and conventional (in the biological sense). Using "code" here is technically precise (in the context of information theory). There is no subsidy happening because the metaphor fits the mechanism perfectly.
  2.  **"Signal Transduction Pathway"**
      *   *Prose:* "The hormone signals the nucleus to begin transcription."
      *   *Why it's a near-miss:* This is **Causal Language**, not Code Language. "Signal" here is used in the sense of a trigger or a causal chain (like a bell ringing), not a message carrying semantic content that must be decoded. While it borders on information talk, it does not typically license inferences about "meaning," "errors," or "reading." It describes energy/state transfer, not symbol manipulation. It lacks the "arbitrary mapping" required to trigger the subsidy.

  ### Summary for your Copy-Editing
  When you see "code," "read," "edit," or "error," check if the sentence would survive if you treated the cell as a bag of chemicals rather than a library. If the prose implies the cell *knows* something it cannot physically *know* without the metaphor doing the heavy lifting, you are looking at **Metaphorical Subsidy**. It is not necessarily wrong, but it is borrowing credibility from a different bank account.
