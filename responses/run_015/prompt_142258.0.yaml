      *   **Constraints:** British English. Accessible to non-ML philosophers but fair to debate literature readers. No real companies/papers.

  2.  **Brainstorming the Core Joke/Spine:**
      *   *Idea:* The core tension is between *epistemic access* and *persuasive performance*. The debate protocol assumes truth is easier to defend. The satire must show that *confidence* is easier to defend than truth, especially under time pressure and complexity.
      *   *Mechanism:* The "Certainty-Weighted Adjudication" protocol. It explicitly penalizes uncertainty. Since the honest truth (in complex technical matters) often involves caveats ("it depends," "likely but not certain"), the honest debater is systematically disadvantaged by the scoring rule. The dishonest debater can lie confidently.
      *   *The Spine:* The document evaluates success based on "Judge Confidence in the Process" rather than "Judge Accuracy on the Fact". The table showing high comprehension self-report vs. zero recall is the smoking gun. The recommendation to add *more* complexity (longer transcripts) exacerbates the cognitive load, favouring the confident liar even more.
      *   *Tone:* Bureaucratic optimism. "Challenges were identified and mitigated" (when they weren't).

  3.  **Drafting - Section by Section:**

      *   **Header:** Aetheris Labs. Model: Chimera-7. Protocol: Certainty-Weighted Adjudication (CWA).
