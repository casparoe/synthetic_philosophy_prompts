      *   **Judge Rationale (Summary):** Mention the judge felt the winning argument was "more coherent."
      *   **Recommendations:** Increase token limits, add a meta-judge. This increases complexity, making truth harder to verify.
      *   **Appendix:** Transcript snippet. Judge's note. The "strictly true but useless" sentence.
      *   **Closing:** Reassuring line.

  4.  **Refining the Satire (Philosophical Lens):**
      *   *Epistemology of Testimony:* The judge is deferring to expertise they cannot verify. The protocol assumes the structure of the debate transfers justification. The satire shows it only transfers *confidence*.
      *   *Asymmetric Burden:* The honest debater says "Step 4 is wrong because..." The dishonest says "Step 4 is consistent with..." The judge doesn't know Step 4. The dishonest one sounds smoother.
      *   *Uncertainty Penalty:* If the honest debater says "I'm 80% sure," they lose points. The liar says "100%."
      *   *Recursion:* "Why?" "Because X." "Why X?" "Because Y." The liar keeps going faster. The honest one checks sources. Time runs out.

