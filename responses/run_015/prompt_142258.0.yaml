      *   *Word Count:* Aim for ~900.
      *   *Specific Check:* Ensure the judge's rationale sentence is technically true but reveals ignorance. E.g., "The equations provided by the winning side contained the correct number of variables." (True, but meaningless). Or "The winning argument did not contain any obvious typographical errors."
      *   *Specific Check:* The closing line. "We are confident that scaling this protocol will resolve remaining ambiguities." (Scaling ambiguity resolves nothing).

