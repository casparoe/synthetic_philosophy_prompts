      *   *Key Feature:* The state as a continuous legal entity distinct from its people.
      *   *Collapse:* If the state dissolves or reforms the laws, the guilt shifts or vanishes.

      *Critique:* Make sure Jaspers' view is accurately represented *within the logic of the prompt*. Jaspers actually argues political guilt is about liability for the state's deeds. If the state continues, the liability continues, even if the people change. This fits.
      *Critique on Bureaucratic:* Needs to be distinct from Jaspers' political guilt. Political is about liability/reparations (external). Moral is about conscience (internal). The prompt asks for "inherited moral liability" for the bureaucratic view. This is a twist on Jaspers' moral guilt (which he says *cannot* be collective). So I need to frame the "Bureaucratic Continuity" view as a competing theory that *does* allow moral guilt to attach to roles.

