      *   *Scenario:* Let's use a fictional Pacific island nation called "Solaire." In 1965, the founding council poisoned the water table of the native valley to force them out and build a massive hydro-dam. Everyone involved in that decision is dead. By 1990, the original settlers died of natural causes, and the government sold citizenship cheap to attract engineers and bankers to run the dam. Now, 100% of the population are post-1990 arrivals. The dam still powers the grid, the laws still forbid valley resettlement, and the pension fund is invested in the dam's profits.
