      *   *Drafting the paragraph:* Focus on the total demographic swap but institutional lock-in.

  4.  **Walking Through the Views:**
      *   *Jaspers (Political):* Why? Because political guilt attaches to citizenship and the state's existence, not just bloodline. If you enjoy the state's protection and benefits, you inherit its debts.
      *   *Strict Individualist:* Why? Because I didn't pull the trigger. I just moved here. My actions are clean.
      *   *Bureaucratic Continuity:* Why? Because the *office* holds the liability. If I sit in the chair that signed the expulsion orders (metaphorically), I inherit the moral weight of maintaining that system.

  5.  **Isolating the Feature:**
      *   It's the *institutional persistence despite total demographic turnover*.
      *   *What collapses if removed?* If the institutions changed (e.g., land returned, laws rewritten), the political guilt dissolves because the state repudiated the past. If the demographic *didn't* turn over, it becomes standard intergenerational guilt. The weirdness relies on the * mismatch* between people and structures.

