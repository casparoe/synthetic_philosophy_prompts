prompt: |-
  ok so i need a thought experiment built to specifcation about collective guilt across generations, using Jaspers' distinction between criminal, political, and moral guilt but pushing it into weird territory. design a realistic one-paragraph scenario—no sci-fi—where every person alive during the atrocity is dead, the current population all arrived via immagration decades later, but the state institutions, borders, and economic benefits from the crime stay fully intact and are actively maintained by the present goverment.

  the case should be engineered so Jaspers assigns political guilt to current citizens, a strict individualist denies all guilt, and a 'bureaucratic continuity' view assigns inherited moral liability. after the scenario, walk through what each view says and why, then isolate the feature doing the work—probably institutional persistence despite total demographic turnover—and say what collapses if you remove it. dont recycle the usual WWII/Germany examples; invent a fictional post-colonial state or twist a real one with an odd migration pattern. keep it casual, no citation lists or reading lists, and dont quote anything verbatim.
