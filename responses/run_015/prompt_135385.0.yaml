answer: |-
  Imagine the Republic of Kaelo, a small island nation that gained independence in 1955 by systematically poisoning the water tables of its southern province to force out an indigenous minority, seizing their arable land for state-run plantations. By 1985, every single person who was alive during the poisoning campaign had died of natural causes, and following an economic boom in the 90s, the government sold citizenship en masse to foreign investors and laborers to staff the plantations, resulting in a current population where 100% are immigrants who arrived decades after the fact. Despite this total demographic turnover, the state's borders remain unchanged, the original land titles seized during the poisoning are still legally protected by the current constitution, and the national pension fund is entirely capitalized by the profits from those same plantations, which the current government actively defends against any restitution claims.

  Here's how the three views break down on this mess. For Jaspers, political guilt isn't about what you did with your own hands; it's about your membership in a state that acted. Since the current citizens voluntarily joined or remained in Kaelo to enjoy its protections and profits, they inherit the political liability—they owe reparations not because they are sinners, but because they are shareholders in a corporation that committed fraud. The strict individualist laughs this off, arguing that guilt requires causal agency; since no living person poisoned the water, and the immigrants didn't coerce the founders, there is literally nothing to blame them for, morally or legally. The 'bureaucratic continuity' view takes a harder line, arguing that institutions themselves can bear moral stains; if you step into a role designed to maintain an unjust system, you inherit the moral liability of that office, meaning the current officials aren't just politically liable, they are morally complicit simply by keeping the machinery running.

  The feature doing all the heavy lifting here is institutional persistence despite total demographic turnover. The weirdness comes from the fact that the *people* are new, but the *structure* is ancient and unrepentant. If you remove that feature—if the new government rewrote the constitution, returned the land, or dissolved the state entirely—the political guilt evaporates because the state repudiated its past actions, and the bureaucratic moral liability vanishes because the machinery of injustice was dismantled. Without the continuous institution acting as the bridge between the past crime and the present benefit, there's nothing for the guilt to stick to.
