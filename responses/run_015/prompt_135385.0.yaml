      *   *Moral:* Individual conscience regarding their own actions/complicity.
      *   *Metaphysical:* (Usually included by Jaspers, but the prompt asks for criminal, political, moral). I should stick to the requested three but keep the metaphysical in mind if it helps the "weird territory" aspect.
      *   *The Twist:* The prompt wants Jaspers to assign *political* guilt to current citizens even though they weren't there. Jaspers usually argues political guilt falls on citizens for the deeds of their state *while they are citizens*. If the population is entirely replaced, does political guilt persist? The prompt says "design... so Jaspers assigns political guilt." This implies I need to structure the scenario such that citizenship/state continuity overrides demographic discontinuity.
      *   *The 'Bureaucratic Continuity' View:* This needs to assign *inherited moral liability*. This is distinct from Jaspers' moral guilt (which is usually individual). This view suggests the institution itself carries a moral stain that transfers to those who operate it.
      *   *The Strict Individualist:* Denies all guilt because no individual committed the act.

  3.  **Drafting the Scenario:**
      *   *Need:* A state where the original perpetrators are dead, the current people are immigrants, but the state machinery and benefits remain.
      *   *Idea:* A resource-rich enclave that became independent through a massacre/expulsion, then repopulated entirely by economic migrants attracted by the wealth generated by that expulsion.
      *   *Setting:* Let's create a fictional island nation or a specific region. Let's go with "The Republic of Oakhaven" (generic) or something more specific. Let's try "The Free State of Meridia."
