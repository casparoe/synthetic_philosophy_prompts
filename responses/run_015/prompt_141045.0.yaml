answer: |-
  # The Rescuer's Tree: A Map of Logical Space

  This tree is designed to be walked through in ten minutes. It does not ask you to define terms like "aggregativism" or "prioritarianism." It asks you to choose between concrete outcomes. Follow the arrows from the top. At each node, choose the answer that matches your intuition.

  ### The Five Separating Questions

  **Q1. The Basic Count:** In the standard case (save David or save five strangers, certain death for the unsaved), is it *wrong* to save David?
  *   **No:** It is permitted to save the one. (Go to Q2)
  *   **Yes:** It is obligatory to save the five. (Go to Q3)

  **Q2. The Chance Mechanism:** If saving David is permitted, do the five strangers deserve a *better* chance of survival than David, or an *equal* chance?
  *   **Equal:** Flip a coin (50/50).
  *   **Better:** Weight the lottery in favour of the five.

  **Q3. The Risk Test (The Maya Case):** You can save **one person certainly**, or **five people with an 80% chance each** (correlated: either all five live or all five die). The expected outcome is 1 life vs. 4 lives. Do you save the five?
  *   **Yes:** Maximise expected lives.
  *   **No:** Prefer the certain life.

  **Q4. The Trade-Off Limit:** If the five would each lose a **finger** but the one would lose a **life**, do the numbers still force you to save the five?
  *   **Yes:** Numbers always win.
  *   **No:** Kind of stake matters; save the one.

  **Q5. The Career Constraint:** If you face this choice every day for a career, are you required to save the one sometimes, or may you save the five every time?
  *   **Sometimes:** You must distribute your choices.
  *   **Every Time:** Treat each case in isolation.

  ***

  ### The Decision Tree & Logical Space

  ```text
  START: 1 vs 5 (Certain Death)
  │
  ├── Q1: Is saving the one WRONG?
  │   │
  │   ├── NO (Permitted) ──┬── Q2: Equal Chance?
  │   │                    │   ├── YES ──────────────► LEAF 1: Strict Individualism
  │   │                    │   └── NO (Weighted) ────► LEAF 2: Proportional Chance
  │   │
  │   └── YES (Obligatory) ──┬── Q3: Save 5 in Maya Case? (1 Certain vs 5 Risky)
  │                          │   ├── NO (Save 1) ───────► LEAF 3: Risk-Averse Aggregation
  │                          │   └── YES (Save 5) ──────┬── Q4: Fingers vs Life?
  │                          │                         │   ├── NO (Save 1) ───► LEAF 4: Threshold Aggregation
  │                          │                         │   └── YES (Save 5) ──┬── Q5: Career Distribution?
  │                          │                         │                      ├── YES ─────────────► LEAF 5: Distributive Policy
  │                          │                         │                      └── NO ──────────────► LEAF 6: Simple Aggregation
  │                          │                         │
  │                          │                         └── (Branch for Diminishing Weight) ───────► LEAF 7: Prioritarian Aggregation
  │                          │
  │                          └── (Empty Cell: Numbers count for outcome but not chance) ──────────► CELL A
  ```

  ***

  ### The Leaves (Positions & Bullets to Bite)

  There are eight occupied leaves and two empty cells in the logical space.

  **1. Strict Individualism (Taurek)**
  *   **Path:** Q1(No) → Q2(Yes).
  *   **View:** Numbers do not count. Each person has an equal claim to be saved. Flip a coin.
  *   **Uncomfortable Truth:** You must accept that saving the one is just as good as saving the five, even if you face this choice every day for a decade.

  **2. Proportional Chance**
  *   **Path:** Q1(No) → Q2(No).
  *   **View:** Numbers count for *chance*, not *outcome*. Give the group a 5/6 chance and David 1/6, then let fate decide.
  *   **Uncomfortable Truth:** You might weighted-lottery in favour of the five and still end up saving David, leaving the five to die, and call this a moral success.

  **3. Risk-Averse Aggregation**
  *   **Path:** Q1(Yes) → Q3(No).
  *   **View:** Numbers count, but certainty matters more than expectation. Save the certain one over the risky five.
  *   **Uncomfortable Truth:** You must accept letting four expected people die to save one, effectively ignoring the magnitude of the risked group.

  **4. Threshold Aggregation**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q4(No).
  *   **View:** Numbers count only between comparable claims. Lives beat fingers, but five fingers do not beat one life.
  *   **Uncomfortable Truth:** You must draw a line where none exists in nature; is a toe enough to outweigh a life if there are enough toes?

  **5. Distributive Policy**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q4(Yes) → Q5(Yes).
  *   **View:** Save the five usually, but over a career, you must sometimes save the one to avoid tyranny of the majority.
  *   **Uncomfortable Truth:** You must knowingly make the "wrong" choice in a single case (saving the one) to satisfy a statistical ideal of fairness over time.

  **6. Simple Aggregation (Classical Utilitarianism)**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q4(Yes) → Q5(No).
  *   **View:** Every life counts equally. Always save the most lives, every time, no exceptions.
  *   **Uncomfortable Truth:** David has no individual right against being sacrificed; he is merely a vessel for value that can be swapped for more value elsewhere.

  **7. Prioritarian Aggregation**
  *   **Path:** Q1(Yes) → Q3(Yes) → Q4(Yes) → [Diminishing Weight Branch].
  *   **View:** Numbers count, but the 100th life saved adds less moral weight than the 2nd.
  *   **Uncomfortable Truth:** At some large number, adding more people to the group stops changing what you ought to do, making the extra lives morally invisible.

  **8. No Settled Name (Relational View)**
  *   **Path:** Q1(Yes) → Q3(Yes) → [Relations Branch].
  *   **View:** Numbers count only because of the relations between the five (e.g., they are a family), not as bare additions.
  *   **Uncomfortable Truth:** If the five strangers do not know each other, you might be permitted to save David, making morality depend on social ties you cannot see.

  ***

  ### The Empty Cells

  **Cell A: Outcome without Chance**
  *   **Location:** Q1(Yes) → Q3(No) [Save 1 in Maya Case] but Q1(Yes) [Must save 5 in Standard Case].
  *   **Status:** **Incoherent.**
  *   **Why:** If you believe you *must* save the five when outcomes are certain, you cannot consistently refuse to save them when the *expected* outcome is still higher (4 vs 1), unless you value certainty over lives, which moves you to Leaf 3.

  **Cell B: Weighted Chance without Outcome**
  *   **Location:** Q1(No) → Q2(No) [Weighted Chance] but Q1(Yes) [Saving one is Permitted].
  *   **Status:** **Unvisited.**
  *   **Why:** If the five deserve a better chance, it implies their claims are weightier. If their claims are weightier, it is hard to explain why saving the one is fully *permitted* rather than merely *excusable*. Most who weight chances slide into requiring the save.

  ***

  ### Analysis of the Maya Case

  Your Maya case (1 Certain vs. 5 Correlated @ 80%) successfully separates **Leaf 3 (Risk-Averse)** from **Leaf 6 (Simple Aggregation)**.
  *   **Simple Aggregators** choose the five because $5 \times 0.8 = 4$, and $4 > 1$. They judge by *expected outcome*.
  *   **Risk-Averse Aggregators** choose the one. They judge by *ex-post security* or *individual maximal chance* (100% > 80%).
  *   **Strict Individualists (Leaf 1)** might also choose the one, but for a different reason: they see the 80% as irrelevant noise; David's claim is equal to any single one of the five, and 100% chance for David beats 80% chance for any single stranger.
  *   **Conclusion:** The case does not just separate "add up lives" from "add up chances." It separates **Expectation Maximisation** from **Certainty Maximisation**. It reveals whether you treat probability as a multiplier of value (Utilitarian) or as a modifier of individual claim strength (Taurekian).

  ***

  ### The Three Final Prompts

  **1. Where two leaves cannot be separated by the tree, and a case to prise them apart.**
  *   **The Leaves:** **Leaf 6 (Simple Aggregation)** and **Leaf 7 (Prioritarian Aggregation)**.
  *   **Why:** In the 1 vs. 5 case, both save the five. The tree's questions about risk (Maya) and trade-offs (Fingers) usually yield the same answer for small numbers.
  *   **The Prising Case:** **The Massive Numbers Case.** A rescuer can save **1,000,000** people or **1,000,001** people.
      *   **Simple Aggregation:** Must save the 1,000,001. Every life counts equally.
      *   **Prioritarian:** May flip a coin. The moral weight of the single extra life is too diminishing to mandate the choice.

  **2. Which normative question is the tree answering?**
  *   **The Question:** **"What ought the agent to do?" (Obligation).**
  *   **Reasoning:** The root question (Q1) asks if saving the one is *wrong*. This frames the entire tree around duty and prohibition. Even the "Permitted" branches are defined by their relationship to obligation (i.e., the absence of it).

  **3. Which branches would have to be redrawn if answering a different question?**
  *   **If answering "What may the agent do?" (Permission):**
      *   **Redraw:** The split at **Q1** collapses. If we ask only what is *permitted*, both saving the one and saving the five might be permissible. The tree would need to start at **Q2 (Chance)** immediately, as the "Obligatory" branch (Q3-Q5) becomes irrelevant. Taurek's view becomes the default, and Aggregativism becomes a subset of "Supererogatory" actions.
  *   **If answering "What would be best?" (Value):**
      *   **Redraw:** The **Q5 (Career)** branch disappears. "Best" is usually assessed act-by-act. The **Q2 (Chance)** branch also changes; a weighted lottery might be "best" for fairness, even if saving the five is "best" for outcomes. The tree would split into **Value of Outcomes** vs. **Value of Process**.
