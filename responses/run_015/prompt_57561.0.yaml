  1. **The menu**

  1.  **Zorn's Lemma is equivalent to the Axiom of Choice.** (truism)
      Standard set theory establishes this equivalence over ZF. Everyone in the room accepts this baseline fact.
  2.  **The Axiom of Choice asserts existence without providing a construction.** (true and load-bearing)
      AC guarantees a selection function exists but gives no rule for finding it. This is the definition of non-constructive existence.
  3.  **The general theorem cannot be proved in ZF without Choice.** (true and load-bearing)
      There are models of ZF where some rings lack maximal ideals. The general statement genuinely depends on non-constructive axioms.
  4.  **"Non-constructive all the way down" implies no specific ring admits a constructive proof.** (false)
      This conflates the general quantifier with specific instances. $\mathbb{Z}$ and $\mathbb{Q}[x]$ admit constructive proofs regardless of the general theorem's status.
  5.  **Using a non-constructive proof for the general case invalidates constructive proofs for specific cases.** (false)
      Proof methods for generalizations do not restrict methods for specializations. You can prove a specific case constructively even if the general case is non-constructive.
  6.  **There exist computable rings with no computable maximal ideals.** (true and load-bearing)
      Computable algebra shows some rings have maximal ideals that exist but cannot be algorithmically generated. This validates the CS concern for the general case.
  7.  **"Compute with" implies an algorithm to output generators or membership tests.** (truism)
      This defines the CS speaker's operational standard. It is a reasonable definition within computer science contexts.
  8.  **Existence without computability is mathematically vacuous.** (contentious)
      This is a philosophical stance, not a mathematical fact. Most algebraists find structural existence valuable even without algorithms.
  9.  **The theorem is useless for computation.** (false)
      Existence proofs often guide heuristic searches or confirm termination conditions. Non-constructive existence can still support constructive workflows.

  2. **Reassurance vs accusation**

  The Reassurance camp leans on Items 1, 3, and 8. They accept AC as a standard tool and value structural existence regardless of computability. The Accusation camp leans on Items 2, 6, and 9. They prioritize algorithmic realization and view non-constructive existence as suspect or useless. They are disagreeing on Item 8 and 9 (utility) while talking past each other on Item 4 and 5 (scope). The CS person treats the general theorem's limitation as a defect in the specific examples, while the algebraists treat the specific examples as irrelevant to the general theorem's axiomatic needs. The conflict is not about truth but about what counts as mathematical value. The Reassurance group sees AC as a harmless convenience, whereas the Accusation group sees it as a barrier to implementation. They agree on the logic but disagree on the ontology.

  3. **Where his argument slides**

  The slide occurs at Item 4 and 5. He moves from "The general proof uses AC" (true) to "The theorem is non-constructive *all the way down*" (false implication). He conflates the *general existence proof* with *instance-specific solvability*. Just because the umbrella theorem requires AC doesn't mean every instance under the umbrella requires AC. $\mathbb{Z}$ and $\mathbb{Q}[x]$ are computable principal ideal domains; their maximal ideals are findable without AC. The step "Zorn's lemma... so your theorem is non-constructive all the way down" is the invalid inference. It assumes uniformity of complexity across all models of the theory, which is false. He mistakes the necessity of Choice for the general statement as a necessity for every specific instance.

  4. **What survives**

  The strongest true version: "While specific rings like $\mathbb{Q}[x]$ allow constructive maximal ideals, the general theorem guarantees existence even for rings where no maximal ideal is computable." This acknowledges his CS concern (computability limits) without denying your algebraic observation (specific cases are fine). It validates the need for AC for the *general* case without invalidating the *specific* cases. The complaint holds for the universal quantifier, not the instances. Your observation survives because constructivity is a property of instances, not the general theorem.

  5. **Three sentences for seminar**

  "You are correct that the general theorem is non-constructive and fails for some computable rings. You are incorrect that this contaminates specific cases like $\mathbb{Q}[x]$, where maximal ideals are explicitly computable without Choice. The proof's power lies precisely in covering the cases where your computational intuition ceases to apply."
