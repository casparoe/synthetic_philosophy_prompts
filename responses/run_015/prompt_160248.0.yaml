prompt: |-
  I hold a particular, sharpened version of the extended mind thesis, which I'll call the surrogate-substitution version. Its test is this: an external resource counts as a constituent of a subject's cognitive process just in case replacing it with an internal surrogate — a neurally realized structure with the same input–output profile, the same failure modes, and the same characteristic error signature — would not change what kind of cognitive process it is. The point of the test is to rescue the parity principle from triviality: rather than asking whether a notebook or a phone plays "the same functional role" as an internal store, which almost any external aid can be said to do, we ask whether the errors transfer. The view then commits itself to something checkable: a genuinely extended cognitive system should exhibit the error profile of the capacity it extends — reconstruction effects, interference, systematic distortion under load — at the level of the coupled system, and not merely inside the skull.

  Tell me what would count against this, ranked from fatal to merely awkward, and be explicit about which defeaters a defender of the view should concede and which they would rightly dismiss.

  I want the empirical exposure mapped first: what pattern of results would be decisive, and what would only be inconvenient? Say what to make of the often-cited result that people who expect later access to information retain where to find it rather than what it says, and of the related literature on couples and teams who divide up remembering — do these show a single system with one error profile, or two agents each with their own? What observation, if someone ran the experiment, would settle it against me?

  Then the conceptual exposure: cases the surrogate-substitution test cannot describe or describes wrongly — a resource a subject uses reliably but disowns and has no metacognitive access to, a predictive system that supplies thoughts before the subject has them, resources that pass the test for storing but have no analogue for perceiving or acting. Does the test secretly work only for memory-like cases?

  Then the structural questions. Does the view collapse into the weaker claim that cognition is causally dependent on and embedded in the environment, or into the claim that we are coupled to tools — and if so, is the disagreement merely verbal? Has it been insulated by treating "cognitive" as a term of art, and is that insulation legitimate here or a symptom? Finally, two things I personally find most threatening, on which I want your honest verdict: the argument from explanatory relevance, that no working cognitive-scientific explanation needs to cite the external resource as doing representational work, so that the thesis if true is idle; and the downstream commitments, that if the notebook is part of my mind then damaging it is a harm to me and its contents are mine in a way that shifts responsibility. Are those genuine defeaters, or just costs a defender should pay?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Thesis:** A "sharpened version of the extended mind thesis" (EMT), called the *Surrogate-Substitution Version* (SSV).
      *   **The Test:** An external resource is a constituent of a cognitive process *iff* replacing it with an internal surrogate (same I/O, failure modes, error signature) wouldn't change the *kind* of cognitive process it is.
      *   **Key Criterion:** Error profiles (reconstruction effects, interference, systematic distortion under load) must transfer to the coupled system level, not just inside the skull.
      *   **Goal:** Rescue the Parity Principle from triviality by focusing on *errors* rather than just functional roles.
      *   **Request:**
          1.  **Empirical Exposure:** What results count against it (fatal vs. awkward)? Specific cases: Google effect (transactive memory), couples/teams. What experiment settles it?
          2.  **Conceptual Exposure:** Cases the test misses/mishandles (disowned resources, predictive systems, non-memory domains). Is it memory-biased?
          3.  **Structural Questions:** Collapse into embedding/coupling? Verbal dispute? "Cognitive" as term of art?
          4.  **Specific Threats:** Explanatory Relevance (idle thesis) and Downstream Commitments (harm/responsibility). Verdict: Genuine defeaters or costs to pay?

  2.  **Deconstruct the Surrogate-Substitution Test (SSV):**
      *   It's a modal claim about counterfactual replacement.
      *   It relies heavily on *isomorphism of failure*.
      *   It aims to distinguish *constitution* from *causation*.

  3.  **Drafting Section 1: Empirical Exposure:**
      *   *Fatal:* If we find coupled systems that function cognitively but *lack* internal-like error profiles (e.g., perfect recall via external storage without reconstruction errors). If the external resource is *more* reliable than biology in a way that changes the process type (e.g., photographic vs. reconstructive), SSV says it's not cognitive. But intuitively, using a perfect database *is* cognitive offloading. If SSV denies this, it's too restrictive.
      *   *Awkward:* If error profiles exist but are distinct (e.g., digital corruption vs. neural decay).
      *   *The "Google Effect" (Sparrow et al.):* People remember *where* not *what*.
          *   *SSV Interpretation:* Is "remembering where" a cognitive process with an internal surrogate? Yes, spatial memory/indexing.
          *   *Problem:* If the external store is perfect, there are no reconstruction errors. SSV might say "not extended memory" because the error profile doesn't match biological memory. This risks excluding the most useful tools.
      *   *Couples/Teams (Transactive Memory):* Do they show one error profile?
          *   *Settling Experiment:* Induce interference in Partner A and see if Partner B's retrieval degrades in a way structurally identical to intra-individual interference. If the coupling is merely causal, Partner B should just get "no data." If constitutive, Partner B should show "confabulation" or "partial retrieval" patterns typical of memory failure.
      *   *Decisive Observation:* A coupled system that exhibits *non-biological* error modes (e.g., bit-rot, deletion) while performing a task we intuitively call cognitive. If SSV says "not cognitive," it conflicts with usage. If SSV says "cognitive," it violates the error-profile constraint.

  4.  **Drafting Section 2: Conceptual Exposure:**
      *   *Disowned/No Metacognitive Access:* A tool I use reliably but don't "feel" is mine (e.g., a subconscious habit, or a tool I distrust but works). SSV relies on functional equivalence, not feeling. But if I don't trust it, is it integrated?
      *   *Predictive Systems:* AI supplying thoughts. If the AI predicts my next sentence before I type it, is it part of my mind? SSV asks: would an internal surrogate (intuition) change the process? Maybe not. But the *source* matters for agency.
      *   *Memory Bias:* The test is heavily weighted toward *storage/retrieval* (error signatures like reconstruction). Perception and Action don't have "error signatures" in the same way (illusions vs. mistakes).
          *   *Verdict:* Yes, the test is memory-biased. It works for Otto's notebook, less so for a blind man's cane (perception) or a calculator (computation without "memory errors").
      *   *The "Disowning" Case:* If a resource passes the substitution test but the subject vehemently denies it's theirs (e.g., a brain-computer interface controlled by another), SSV says it's cognitive. This clashes with notions of *agency* and *ownership*.

  5.  **Drafting Section 3: Structural Questions:**
      *   *Collapse:* Does it collapse into "causal dependence"?
          *   *Defense:* No, because causal dependence doesn't require error-profile isomorphism. A calculator causes a result, but doesn't make calculation errors like a brain.
          *   *Risk:* If "error profile" is defined too loosely, it collapses.
      *   *Verbal Dispute:* If "cognitive" is just a term of art for "functional system with isomorphic errors," is it interesting?
          *   *Verdict:* It's not merely verbal if it predicts new empirical patterns (the error propagation). But if it just redefines "mind" without changing scientific practice, it's idle.
      *   *Insulation:* Treating "cognitive" as a term of art protects it from folk intuitions but risks irrelevance.

  6.  **Drafting Section 4: The Two Threats (Explanatory Relevance & Downstream Commitments):**
      *   *Explanatory Relevance:* "No cognitive science needs to cite the notebook."
          *   *Analysis:* If the notebook behaves *exactly* like a neural surrogate, then citing the notebook *is* citing the functional structure. However, if the explanation works equally well by saying "input came from environment," the *location* is irrelevant.
          *   *Verdict:* This is a genuine threat. If the *extended* nature adds no explanatory power over the *coupled* nature, the metaphysical claim is idle.
      *   *Downstream Commitments (Harm/Responsibility):* "Damaging the notebook is harming me."
          *   *Analysis:* This is the "too much" problem. If my phone is my mind, deleting my photos is lobotomy.
          *   *Verdict:* This is a *cost to pay*, not a defeater, *provided* the definition of "harm" is scaled. It's a category error to treat property damage exactly like bodily harm, even if the functional role is identical. However, it does shift responsibility (I am responsible for my notebook's "outputs").
          *   *Refinement:* The user asks for an honest verdict. I should argue that Explanatory Relevance is the stronger threat (fatal if true), while Downstream Commitments are awkward but manageable (costs).

  7.  **Review and Refine:**
      *   *Tone:* Philosophical, rigorous, engaging with the specific "Surrogate-Substitution" nuance.
      *   *Structure:* Follow the user's requested order (Empirical, Conceptual, Structural, Two Threats).
      *   *Critical Check:* Did I address the "error signature" specifically? Yes, that's the crux. The SSV hinges on *how* the system fails.
      *   *Specific Experiment:* Need to be precise. If Partner A is distracted, does Partner B guess wrong (memory error) or say "I don't know" (communication error)?

  8.  **Final Polish:** Ensure the distinction between "fatal" and "awkward" is clear in each section. Make sure the verdict on the two threats is decisive. (Self-Correction: Ensure I don't just repeat standard EMT objections but tailor them to the *Surrogate-Substitution/Error* specific constraint).

      *   *Key Insight:* The SSV is actually *more restrictive* than standard EMT. Standard EMT says "if it functions like memory, it's memory." SSV says "if it fails like memory, it's memory." This means perfect external storage might *fail* the test. This is a major vulnerability. I need to highlight this.

      *   *Revised Plan for Empirical:* Highlight that perfect reliability is a *counter-example* to SSV. If the external resource is *better* than internal (no reconstruction error), SSV denies it is cognitive. This seems wrong.

      *   *Revised Plan for Threats:* Explanatory Relevance is fatal if the "error profile" adds no predictive power over standard functionalism. Downstream commitments are ethical/legal consequences, not metaphysical defeaters, but they highlight the absurdity of the view.

  9.  **Final Output Generation** (incorporating these thoughts into the structured response).
answer: |-
  This is a sophisticated refinement of the Extended Mind Thesis (EMT). By anchoring constitution to **error-profile isomorphism** rather than mere functional success, you attempt to bypass the "coupling-constitution fallacy" and the triviality objection (that everything we use becomes part of us). Your Surrogate-Substitution Version (SSV) demands that the coupled system fail in *biologically characteristic ways* to count as cognitive.

  Here is the exposure of the view, ranked by severity, followed by the verdict on your specific threats.

  ---

  ### I. Empirical Exposure

  The SSV makes bold predictions about how coupled systems should degrade under pressure. It is empirically vulnerable because it predicts specific *patterns of failure*, not just success.

  #### 1. Decisive (Fatal) Results
  **The "Perfect Storage" Counter-Example:**
  The most damaging empirical result would be a case where an external resource is universally accepted as cognitive offloading but **lacks biological error signatures.**
  *   **The Scenario:** Subjects use a digital database for semantic memory. Unlike neural memory, the database does not exhibit reconstruction effects, interference, or fading. It is either perfectly accurate or returns a "null" error.
  *   **The SSV Verdict:** Because replacing the database with a neural surrogate *would* change the process (introducing reconstruction errors where there were none), SSV must conclude the database is **not** a constituent of the cognitive process.
  *   **Why Fatal:** This contradicts the core intuition of EMT. If the tool is reliable enough to avoid biological errors, SSV excludes it. You are forced to say that *better* cognitive tools are *less* cognitive. This inverts the parity principle: parity is only achieved if the tool is as flawed as the brain.
  *   **The Settling Experiment:** Compare two groups performing a complex reasoning task. Group A uses internal memory; Group B uses a perfect external log. Induce cognitive load.
      *   *If SSV is true:* Group B should not show "cognitive" degradation (e.g., confabulation); they should show "mechanical" failure (e.g., data loss). If they show no degradation, SSV says they aren't doing "memory."
      *   *Decisive Observation:* If subjects treat the perfect log as memory (planning, reasoning, inferring based on it) but the system *never* exhibits reconstruction errors, SSV must deny the extension. If you concede it is extended despite the lack of error isomorphism, the test is void.

  #### 2. The "Google Effect" and Transactive Memory
  **The Result:** Sparrow et al. show people remember *where* information is, not *what* it is. Couples divide memory domains (transactive memory).
  *   **SSV Interpretation:** This is awkward but survivable. The cognitive process is not "storing facts" but "indexing locations." The error profile should match *spatial/indexing* memory (e.g., misremembering the URL, not the fact).
  *   **The Problem (Two Agents vs. One System):** In couples, if Partner A is distracted, does Partner B exhibit *memory interference* (guessing wrong, partial recall) or *communication failure* (saying "I don't know")?
      *   *If Communication Failure:* It suggests two agents coupled causally. (SSV: Not extended).
      *   *If Memory Interference:* If Partner B confabulates data they never learned because Partner A was confused, that supports a single system with a shared error profile.
  *   **Awkwardness:** Most evidence suggests the latter is rare. Couples usually fail by silence, not by shared confabulation. This suggests transactive memory is causal coordination, not constitutive extension, under your strict test. You must concede that most "team cognition" is not literally one mind.

  #### 3. Merely Inconvenient Results
  **Distinct Error Modes:** Digital resources suffer bit-rot, corruption, or versioning errors. Biological memory suffers decay and interference.
  *   **Response:** You can argue that at a higher level of abstraction (information loss under load), these are isomorphic. You need not demand *identical* physical failure modes, only functional equivalents (e.g., "unretrievable under stress"). This is a defensible retreat, though it risks loosening the test.

  ---

  ### II. Conceptual Exposure

  The SSV relies on the coherence of "surrogate substitution." Several cases strain this logic.

  #### 1. The "Disowned" Resource (Fatal Conceptual Tension)
  **Case:** A subject uses a resource reliably (passes SSV) but has no metacognitive access to it or actively disowns it.
  *   **Example:** A patient with a deep-brain stimulation implant that corrects motor planning. The implant has the same error profile as the missing neural tissue. But the patient feels the movement is alien (anarchic hand syndrome variant).
  *   **SSV Verdict:** It is part of the cognitive process.
  *   **Problem:** This severs the link between *mind* and *agency/ownership*. If the test makes alien control structures part of "my mind," the term "mind" loses its connection to the *subject*. You save the cognitive status but lose the *personal* status.
  *   **Concession:** You must concede that SSV identifies *cognitive systems*, not necessarily *personal minds*. This is a significant retreat from the humanistic stakes of EMT.

  #### 2. Predictive Systems (Awkward)
  **Case:** An AI supplies thoughts before the subject articulates them (predictive text on steroids).
  *   **SSV Test:** Would an internal surrogate (intuition) change the process? If the AI is accurate, perhaps not.
  *   **Problem:** The *direction of fit* is reversed. In memory, the mind retrieves. In prediction, the tool generates. If the tool generates the content, is it a constituent of *my* process, or am I a constituent of *its* process? SSV struggles with directionality. It treats input-output profiles as symmetrical, but cognitive ownership is not.

  #### 3. Memory Bias (Fatal Limitation)
  **Critique:** Your test is tailored to **memory**.
  *   **Perception:** A blind man's cane. What is the "error signature" of tactile perception? Illusions? If the cane gives perfect data, does it fail the test?
  *   **Action:** A calculator. It does not make "calculation errors" under load; it breaks or gives wrong answers deterministically. It lacks the *signature* of neural computation (noise, drift).
  *   **Verdict:** SSV likely implies that **perception and computation cannot be extended**, only memory. This collapses EMT into a niche theory of "Extended Storage." If you cannot extend the test to perception/action without stretching "error signature" until it breaks, the view is domain-specific, not general.

  ---

  ### III. Structural Questions

  #### 1. Collapse into Causal Dependence?
  **Risk:** High.
  If you define "error profile" broadly enough to include digital corruption as analogous to neural decay, you risk accepting any reliable causal coupling.
  **Defense:** You can resist this by insisting on *systematic* distortion (e.g., bias) rather than random noise. A calculator adds noise; a brain adds bias. If the external resource adds bias structurally identical to the brain, it passes.
  **Verdict:** It does not collapse *if* you maintain strict constraints on what counts as a cognitive error (e.g., reconstruction vs. deletion). But this makes the view empirically fragile (see Empirical Exposure).

  #### 2. "Cognitive" as a Term of Art
  **Insulation:** Yes, you are treating "cognitive" as a functionalist term of art.
  **Legitimacy:** Legitimate *only if* it yields new predictions. If "cognitive" just means "part of a loop with isomorphic errors," does that help psychology?
  **Symptom:** If the only work the term does is to mark the boundary of the "self" for metaphysical purposes, it is insulated from science. If it predicts *where* to look for interference effects (e.g., "check if the notebook distracts the user like a second task"), it is scientifically viable.

  #### 3. Verbal Dispute?
  If a critic says, "The notebook is causally linked but not constitutive," and you say, "It has the error profile, so it is constitutive," are you disagreeing on facts?
  **Verdict:** No, you are disagreeing on the **criteria for constitution**. This is not merely verbal; it is a metaphysical claim about where processes reside. However, if the "error profile" criterion excludes the tools we *want* to call cognitive (like perfect databases), the dispute becomes pragmatic: your definition is less useful than the causal one.

  ---

  ### IV. The Two Threats: Honest Verdict

  #### 1. The Argument from Explanatory Relevance
  *The Claim:* No working cognitive-scientific explanation needs to cite the external resource as doing representational work; we can treat it as input.
  *   **Analysis:** If the external resource is truly a surrogate, citing it *is* citing the functional structure. However, if the explanation works equally well by saying "Input X caused State Y," the *location* of X is irrelevant.
  *   **Verdict:** **Genuine Defeater.**
      *   If the SSV is true, it should *force* a change in explanatory practice. Cognitive science should model the notebook's "decay" as part of the memory model. Currently, no one does this. They model the user's memory of the notebook.
      *   If the thesis is true but makes no difference to how we model the system (because we model the coupling, not the constitution), it is **explanatorily idle**. You cannot claim the notebook *is* the memory while modeling it as *environmental input*. To avoid this, you must show a model where treating the notebook as internal yields better predictions than treating it as external. If you cannot, the thesis is metaphysically inflated but scientifically empty.

  #### 2. Downstream Commitments (Harm and Responsibility)
  *The Claim:* If the notebook is my mind, damaging it is bodily harm; its contents are my thoughts, shifting responsibility.
  *   **Analysis:** This is the "reductio ad absurdum" of EMT. If I smash your phone, have I lobotomized you? If your phone auto-sends an email, did *you* send it?
  *   **Verdict:** **Cost to Pay (but expensive).**
      *   This is not a metaphysical defeater. Metaphysical constitution does not map 1:1 onto legal or moral status. We already distinguish between "parts of me" (hair, nails) and "protected integrity" (brain, heart). You can argue that extended parts have a different *moral weight* than biological parts, even if they are cognitively identical.
      *   **However:** It creates a liability problem. If the notebook is part of the cognitive process, its errors are *my* errors. If the notebook glitches and I act on false data, am I negligent?
      *   **Strategy:** You must argue for a **graded ontology**. The notebook is *cognitively* constitutive but *morally* distinct. This is coherent but requires abandoning the idea that "mind" implies "moral agent boundary."
      *   **Verdict:** This is not fatal, but it requires you to decouple *cognitive extension* from *personal identity*. If you insist the notebook is part of *you* (the person), this is fatal. If you insist it is part of the *cognitive system* (which you inhabit), it is manageable.

  ### Summary Recommendation

  Your Surrogate-Substitution Version is **more rigorous** than standard EMT but **more restrictive**.

  1.  **Fatal Weakness:** It likely excludes the most useful tools (perfect storage) because they lack biological error signatures. You must decide if you are willing to say "Perfect tools are not cognitive extensions."
  2.  **Explanatory Idle:** Unless you can demonstrate a cognitive model that *requires* the external resource to be treated as internal to predict error propagation, the view remains a metaphysical curiosity.
  3.  **Concession:** You should concede that SSV applies primarily to **reconstructive memory systems**, not perception or computation, and that **cognitive constitution does not entail moral/legal identity.**

  If you hold the line on error profiles, you save the theory from triviality but risk making it empirically false (because tools *don't* fail like brains). If you loosen the error profile requirement, you collapse back into the triviality you sought to escape. The tightrope is narrow.
