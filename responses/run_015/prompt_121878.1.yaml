prompt: |-
  hey — i run a philosophy of rationality reading group, about 12 people, 75 min session. i need an in-class game that makes them feel backward induction in the centipede game, but i'm bored of the standard payoff-table demo. can you design a four-person chain activity with physical tokens, where each link decides whether to roll the pool forward or cash out, but there's a hidden envelope rule that only triggers if they reach round 5 — suddenly all cooperative rolls are penalized. also have each player write a secret justifcation card explaining why they chose to continue or stop; we reveal these in reverse order at the end so they see the reasoning chain collapse backward. include the exact rules, token flow, how to debrief the moment of defection onto the induction step, and be honest about which part of the paradox (probably the infinite common-knowledge regress) this physical setup can't reproduce and i have to supply verbally. also tell me what's gonna go wrong the first time i run it — i bet someone opens the envelope early or refuses to write honest justifcations. keep it casual, no tech needed, small stakes like candy or points.
