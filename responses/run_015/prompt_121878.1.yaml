      *   *Actually, looking closer:* The prompt says "reveal these in reverse order... see the reasoning chain collapse backward." This implies the *justifications* show the logic.
      *   *Crucial Fix:* For backward induction to work, the end condition must be *common knowledge*. If I hide the envelope, I break the "Common Knowledge" requirement. I need to advise the user that the envelope *must* be announced as a possibility or the game needs two rounds (one naive, one with knowledge) to show the difference.
      *   *Decision:* I will honor the "hidden envelope" request but explicitly flag in the "Limitations" section that this actually breaks strict backward induction logic unless the *risk* is known. I will frame the envelope as the "Terminal Node Shock" that validates the fear of the end.
