      *   *Critique of the Twist:* Standard Centipede relies on *common knowledge of rationality* and *known payoffs*. A "hidden envelope rule" changes the game structure. If players don't know the rule exists, they can't backward induce *against* it. If they suspect it, it becomes a game of uncertainty.
      *   *Correction/Refinement:* To teach backward induction, the *payoff structure* must be known. If I hide a penalty until Round 5, players can't logically deduce they should stop at Round 1 based on Round 5 *unless* they know the Round 5 penalty exists.
