      *   *Move 2 (R):* Difference-making is what matters for practice (law, science). Counterfactuals pick out specific omissions (3am vs 2am).
      *   *Move 3 (M):* Concedes difference-making but relegates it to *explanation*, not *causation*. Legal "cause" = responsibility.
      *   *Move 4 (R):* Severing explanation from causation is costly. Interventions manipulate absences (no-letter arm).
      *   *Move 5 (M):* Manipulation of absence is manipulation of positive presence. Omissions lead to promiscuity (Queen of England). Preemption problems (backup nurse).

  3.  **Drafting the Adjudication (Move-by-Move):**
      *   *Move 1 (M):* Mostly Right (on metaphysics) / Mostly Wrong (on usage). It's coherent to say causation requires processes, but denying ordinary language is steep. *Verdict:* Mostly Right (internally consistent with process view).
