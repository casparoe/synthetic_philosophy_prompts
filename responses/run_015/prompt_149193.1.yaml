  1. The Full Specification

  An adequate precautionary framework must satisfy five core desiderata to function as more than rhetorical cover. First, **Epistemic Sensitivity**: the framework must distinguish between risk (known probabilities, Type-I opacity) and ignorance (unknown causal pathways, Type-II opacity). Motivating case: Climate engineering involves known physics but unknown systemic feedbacks, unlike chemical regulation where dose-response curves exist. *Status: Non-negotiable.* A framework treating ignorance as risk collapses into standard cost-benefit analysis. Second, **Severity Scaling**: responses must correlate with harm potential, distinguishing reversible errors from irreversible cascades. Motivating case: Releasing gene drives differs from testing a new drug; the former alters ecosystems permanently. *Status: Non-negotiable.* Treating trivial risks like existential ones induces paralysis. Third, **Burden Shifting**: the framework must specify who proves safety. In high-ignorance contexts, absence of evidence cannot equal evidence of absence. Motivating case: Synthetic biology proponents often claim safety until proven otherwise; PP requires the inverse. *Status: Non-negotiable.* Without this, the status quo biases toward innovation regardless of hidden costs.

  Fourth, **Temporal Urgency vs. Deliberation**: the framework must reconcile the need for swift action against catastrophic threats with the need for thorough assessment. Motivating case: Pandemic response requires speed; geoengineering requires slowness. *Status: Camp-specific.* Some demand immediate halts; others allow provisional action. Fifth, **Intergenerational Equity**: it must account for non-consenting future actors. Motivating case: Nuclear waste locks in risks for millennia. *Status: Camp-specific.* Whether future generations hold an effective veto or merely weighted interest is debated. Sixth, **Democratic Legitimacy**: decisions imposing systemic risk require broad consent, not just expert approval. Motivating case: Local communities resisting GMO field trials. *Status: Camp-specific.* Technocrats prefer expert-led risk assessment; democrats demand deliberation.

  To be more than rhetoric, the PP cannot merely demand "care." It must operationalize ignorance. The non-negotiables ensure the principle addresses uncertainty and harm magnitude; the camp-specific items determine its political texture. Without burden shifting, the principle is toothless. Without temporal mechanisms, precaution becomes paralysis or negligence depending on the threat's velocity. Ultimately, the specification demands a mechanism that triggers stricter scrutiny as opacity and irreversibility increase, while defining who holds the keys to proceed. A framework failing these distinctions cannot navigate the difference between manageable risks and systemic collapse. It must explicitly state whether it prioritizes avoiding false negatives (missing a danger) or false positives (blocking a benefit), as this choice defines its operational reality. The distinction between Type-I and Type-II opacity is crucial here; standard risk management handles Type-I, but only precaution addresses Type-II. Similarly, the reversible versus irreversible distinction prevents the framework from being applied to mundane decisions where learning is possible. If a framework cannot differentiate between a spill that can be cleaned and a cascade that cannot, it lacks the specificity required for high-stakes regulation. Furthermore, the framework must define the trigger point: at what level of uncertainty does the burden shift? This threshold determines whether the principle acts as a speed bump or a wall.

  2. The Conflicts

  Two subsets of desiderata appear jointly unsatisfiable. First, **Democratic Deliberation vs. Evidentiary Windows**. Full democratic legitimacy requires time for information dissemination, debate, and consent formation. However, certain catastrophic risks (e.g., climate tipping points) possess closing evidentiary windows where delay ensures harm. If one insists on non-negotiable deliberation before action, one risks missing the window to prevent catastrophe. If one prioritizes speed to meet the window, one sacrifices legitimacy. This is not merely logistical; it is structural. Uncertainty (Type-II opacity) exacerbates this: you cannot deliberate meaningfully on mechanisms you do not understand, yet you must decide whether to trigger them.

  Second, **Intergenerational Veto vs. Non-Collapse**. Protecting future generations often implies an asymmetry: present actors can choose inaction to preserve options, but future actors cannot choose to undo irreversible damage. However, if this asymmetry is absolute, it mandates total stasis, as any action risks unknown future harm. To avoid paralysis, frameworks introduce thresholds, weighing present benefits against future risks. But this weighing collapses the precautionary principle back into standard risk analysis, which the PP was designed to circumvent. You cannot grant future generations an effective veto without freezing present development; you cannot allow present development without negating the veto. Thus, strong intergenerational equity conflicts with any framework permitting progress under uncertainty. The tension lies between preserving the *capacity* to act for the future versus preserving the *safety* of the future. Resolving this requires accepting that some risks must be borne, contradicting the core impulse of absolute precaution.

  3. The Scorecard

  **Weak Formulation (Cost-Benefit Weighting):** Fails *Epistemic Sensitivity* and *Burden Shifting*. By treating uncertainty as a discount factor within standard analysis, it accepts absence of evidence as evidence of absence. It satisfies *Temporal Urgency* but ignores *Severity Scaling* for opaque risks.
  **Strong Formulation (Prohibit Without Safety Proof):** Fails *Temporal Urgency* and *Intergenerational Equity*. By demanding proof of safety under Type-II opacity, it mandates paralysis, harming future generations by withholding potential benefits (e.g., life-saving tech). It satisfies *Burden Shifting* but collapses into the stasis conflict identified above.
  **Middle Formulation (Reversibility Thresholds):** Fails *Democratic Legitimacy* and *Epistemic Sensitivity*. Determining what counts as "reversible" requires knowledge often unavailable (Type-II opacity). Who sets the threshold? Usually experts, bypassing deliberation. It navigates the stasis conflict but lacks a robust mechanism for handling unknown causal pathways. All three fail to fully resolve the tension between deliberation time and catastrophic windows. The Weak version respects speed but ignores ignorance. The Strong version respects ignorance but kills speed. The Middle version attempts compromise but lacks epistemic grounding for its thresholds.

  4. The Residue

  Distinctions like Type-I versus Type-II opacity are not artificial; they expose why standard formulations fail. Standard risk analysis assumes Type-I (known probabilities), while precaution is needed for Type-II (unknown mechanisms). Ignoring this renders the principle rhetorical. The intergenerational veto asymmetry reveals precaution is fundamentally political, forcing a choice about who binds the future. The residue is not a technical gap but a political one: no framework solves the conflict between present autonomy and future safety without explicit value judgments masked as procedural rules.
