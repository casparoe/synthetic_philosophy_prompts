answer: |-
  This is one of the classic problems in legal philosophy and ethics, often called the **Act/Omission Distinction**. Your intuition is spot on: metaphysically, the "nothing" that killed the tenant (no heat) and the "nothing" that killed the homeless person (no help) look identical.

  The law, however, doesn't primarily care about metaphysics; it cares about **policy and boundaries**. Here is the breakdown of the philosophical commitments baked into that legal split, why the metaphysics matters, and what would happen if we leveled the playing field.

  ### 1. The Legal Mechanism: It's Not Causation, It's Duty
  You asked what theory of causation is baked into this split. The surprising answer is: **None.**

  In tort law (where these cases live), the analysis is usually a two-step process:
  1.  **Factual Causation:** Did the omission factually lead to the harm? (The "But-For" test).
  2.  **Legal Duty:** Did the defendant owe the plaintiff a duty to act?

  In both your examples, **factual causation is identical.**
  *   *Landlord:* But for the landlord not fixing the heater, the tenant would not be sick.
  *   *Passerby:* But for the passerby not stopping, the homeless person would not have frozen (assuming the passerby would have helped).

  Both pass the "But-For" test. So why the different outcome? The law stops the inquiry at **Duty**.
  *   **Landlord:** A lease creates a "special relationship." By signing the contract, the landlord assumed a specific obligation to maintain the premises. The omission breaches a *pre-existing duty*.
  *   **Passerby:** Under traditional Common Law (US/UK), there is no general "duty to rescue." You are not your brother's keeper unless you created the danger or have a specific relationship (parent/child, doctor/patient).

  **The Philosophical Commitment:** The law assumes that **liberty trumps welfare.** You have a right to be left alone to go about your day, even if using your resources to help someone else would produce better overall outcomes. To force you to act is to claim ownership over your time and body.

  ### 2. The Metaphysics of "Negative Causation"
  Your teacher mentioned that negative causation is "metaphysically weird." Here is why that connects to the law, even if the law tries to ignore it.

  **The Problem of Absence:**
  In physical causation, we usually look for a transfer of energy (A hits B, B moves).
  *   *Action:* I push you; you fall. (Energy transfer).
  *   *Omission:* I *don't* throw you a rope; you drown. (No energy transfer).

  Metaphysically, an omission is an **absence**. It is the non-existence of an event. Many philosophers argue that "nothing" cannot cause "something." If omissions are causes, then *everything* that didn't happen is a cause of what did.
  *   *Example:* If a starved man dies, was it caused by my failure to feed him? Yes. Was it also caused by the failure of the President to feed him? Yes. The failure of aliens to feed him? Yes.

  **How the Law Handles the Weirdness:**
  The law uses the **Duty** requirement to cut off this metaphysical infinite regress.
  *   By saying "Only landlords have a duty," the law effectively says: "We acknowledge omissions *can* be causes, but we will only treat them as *legal* causes when there is a normative reason to focus on *you* specifically."
  *   It transforms a metaphysical problem (what caused this?) into a normative one (who was responsible for preventing this?).

  ### 3. Is the Law Consistent?
  **Formally:** Yes. The rule is consistent: "Liability for omissions requires a pre-existing duty." This applies to both the landlord and the passerby. The landlord has one; the passerby doesn't.

  **Substantively:** This is where your argument with your friend lives. Critics argue the distinction is morally arbitrary.
  *   **The "Moral Equivalence" Argument:** If I see a child drowning in a shallow pond and I walk past (Passerby), most people say I am a monster. If I am a lifeguard paid to watch that child and I walk past (Landlord equivalent), I am a criminal. But the *result* (dead child) and the *cost to me* (wet pants) are the same.
  *   **The "Floodgates" Argument (The Defense):** The law argues consistency requires limits. If we treat the passerby like the landlord, where does it stop? Do I owe money to every charity I don't donate to? Do I have to stop my car to help at every accident? The law fears **indeterminate liability**.

  So, the inconsistency is a feature, not a bug. It prioritizes **legal certainty** over **moral purity**.

  ### 4. What If We Treated Omissions Like Actions?
  If we adopted the theory that omissions are causes just as much as actions (removing the duty requirement), we would need to make massive philosophical and legal shifts.

  **A. The Metaphysical Shift**
  We would have to accept **Counterfactual Dependence** as the only truth of causation.
  *   *Current View:* Causes are physical pushes.
  *   *New View:* Causes are whatever conditions were necessary for the event. If the world would be different had you acted, your inaction is a cause.
  *   *Consequence:* We become ontologically responsible for *everything we allow to happen*, not just what we make happen.

  **B. The Legal Shift (The "Good Samaritan" Model)**
  Some countries (like France, Germany, and Vermont/Minnesota to a lesser extent) have "Duty to Rescue" statutes.
  *   **Change:** You could be sued or prosecuted for walking past the homeless person.
  *   **Requirement:** You only have to do what is "reasonable" (e.g., call 911, not necessarily jump in a frozen lake).
  *   **Implication:** This shifts the legal system from **Libertarian** (negative rights: don't harm me) to **Communitarian** (positive rights: help me).

  **C. The Practical Nightmare**
  If omissions were treated exactly like actions without limits:
  1.  **Causation Inflation:** Every person on earth is a "cause" of every starvation death because they didn't send their paycheck to that specific person. The legal system would collapse under the volume of causation claims.
  2.  **Loss of Autonomy:** Your time and resources are no longer fully yours. The state can conscript your labor to prevent harm to others.
  3.  **Moral Luck:** You would be liable based on where you happen to be standing. If you walk down Street A, you save a guy. If you walk down Street B, you are a tortfeasor. The law generally hates punishing people for geographic luck.

  ### Summary
  The law treats the landlord and the passerby differently not because it thinks the *causation* is different, but because it thinks the **obligation** is different.

  *   **Philosophical Commitment:** It assumes individual autonomy is more important than aggregate welfare, unless you voluntarily sign away that autonomy (like a lease).
  *   **Metaphysical Hack:** It uses "Duty" to solve the metaphysical problem of infinite omissions. It acts as a filter to decide which "nothings" count as legal "somethings."
  *   **Consistency:** It is logically consistent but morally contentious.
  *   **If Changed:** Treating omissions as full causes would require us to accept that we are our brother's keepers, fundamentally altering the liberal foundation of Western law from "do no harm" to "prevent all harm you can."

  Your teacher is right that negative causation is metaphysically weird, but the law doesn't solve the weirdness; it just builds a fence around it called **Duty**. Your argument with your friend is essentially a debate between **Libertarianism** (Passerby is free) and **Utilitarianism/Communitarianism** (Passerby should be liable). The law currently sides with the Libertarian view.
