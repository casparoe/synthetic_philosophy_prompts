answer: |-
  You have stumbled onto a precise and economically sound configuration that often gets muddied in political or interpersonal arguments. Your intuition is correct: this is not epistemic hedging, and it is not standard logrolling.

  There is no single, famous proper noun for this (like "Prisoner's Dilemma"), but in decision theory and welfare economics, this is a case of **Risk Aversion under Diminishing Marginal Returns.** In negotiation theory, it is a specific subtype of **Integrative Bargaining** that does not require preference reversal.

  If you need a label to hang on it for the sake of the argument, call it **"Marginal Utility Diversification."**

  Here is the clean account you asked for—the carving of what this is, what it isn't, and how to handle the edges you identified.

  ### 1. The Core Mechanism: Concavity, Not Uncertainty

  Your friend calls this "hedging." In decision theory, hedging implies **epistemic uncertainty**: *"I am not sure if I am right, so I will protect myself against being wrong."*

  Your position is different. You are **epistemically certain** (Bike > Pool) but **structurally risk-averse** regarding the *realization* of value.

  *   **The Math:** Your utility function for the bike lane is **concave**. The first 60% of the budget yields 90% of the utility. The last 40% yields only 10%.
  *   **The Gamble:** A coin flip is a gamble between 0 utility (lose) and 100 utility (win). Expected value = 50.
  *   **The Split:** A 50/50 split guarantees you roughly 90 utility (because the first half of the project is the valuable half).
  *   **The Result:** $90 (Guaranteed) > 50 (Expected Coin Flip)$.

  You are not conceding that the Pool is good. You are conceding that the *variance* of a winner-take-all system destroys more value than the *marginal loss* of truncating your project. You are treating the committee budget like an investment portfolio: you diversify not because you think the second stock is as good as the first, but because holding 100% of one asset exposes you to catastrophic variance (getting zero).

  **The Carving:**
  *   **It IS:** Risk management based on the shape of the value curve.
  *   **It IS NOT:** Hedging based on doubt about which project is superior.

  ### 2. Why It Isn't Logrolling

  Your friend's second move is that this is just "deal-making" or logrolling (vote trading). This is a category error regarding the *dimension* of the trade.

  *   **Logrolling** is **inter-issue**: "I vote for your Pool (which I hate) in exchange for you voting for my Bike Lanes (which you hate) on a *different* bill." It relies on intensity differences across distinct topics.
  *   **Your Situation** is **intra-issue allocation**: You are dividing a single resource. You are not trading *votes*; you are trading *marginal dollars*.

  In logrolling, I accept a negative utility on Issue A to gain positive utility on Issue B. In your scenario, you are accepting a *lower marginal utility* on Issue A (Bike Lanes) to avoid *zero utility* on Issue A. You aren't buying anything from him; you are insuring yourself against total loss.

  **The Carving:**
  *   **It IS:** Diversification of a fixed endowment.
  *   **It IS NOT:** Vote trading or side-payments across distinct issues.

  ### 3. Addressing Your Four Edges

  You identified four boundary conditions that test the robustness of this configuration. Here is how they hold up.

  #### Edge 1: Thresholds (Convex Returns)
  *   **Your Observation:** If the project needs 100% to work at all (a sea wall, a connected network), splitting is worse than a coin flip.
  *   **The Analysis:** This confirms the mechanism. If the utility function is **convex** (value accelerates as you spend more, or there is a hard threshold), then $U(0.5) < 0.5 \times U(1.0)$. In this case, the split *destroys* value.
  *   **The Verdict:** Your configuration *only* works under **concave returns** (diminishing marginal utility). If the project is all-or-nothing, you are correct to fight for the coin flip (or majority rule). The "split" is not a universal virtue; it is a function of the project's physics.

  #### Edge 2: Worthless vs. Harmful
  *   **Your Observation:** If the Pool is merely worthless, splitting is fine. If the Pool is actively harmful, splitting might be a net loss.
  *   **The Analysis:** This is about **negative externalities**.
      *   If Pool Utility = 0: Split Utility = $U_{bike}(50\%) + 0$.
      *   If Pool Utility = -100 (Active Harm): Split Utility = $U_{bike}(50\%) - 100$.
      *   If the harm of the Pool exceeds the guaranteed value of the partial Bike Lane, the split becomes irrational.
  *   **The Verdict:** This is a difference in **kind**, not just degree. "Waste" is a null value; "Harm" is a negative value. Diversification only works when the assets are uncorrelated or positively valued. Diversifying into a toxic asset is not risk management; it is self-sabotage. You can justify the split on a "waste" but not on a "harm."

  #### Edge 3: One Pot vs. Two Pots
  *   **Your Observation:** Does it matter that you are splitting one pot rather than swapping budgets?
  *   **The Analysis:** Yes.
      *   **One Pot:** This is an **allocation problem**. You are optimizing a single constraint. The split is efficient because it maximizes total committee satisfaction (Pareto improvement) without requiring trust over time.
      *   **Two Pots:** This becomes a **contract/enforcement problem**. If you control Budget A and he controls Budget B, and you agree to fund each other's projects, you need to trust he won't take your money and run.
  *   **The Verdict:** The "One Pot" scenario is cleaner. It removes the enforcement risk of logrolling. It is a simultaneous move game, not a sequential trade.

  #### Edge 4: The "Secret Concession" (The Deepest Worry)
  *   **Your Observation:** *If I admit the last 40% of my project is low value, am I admitting the project wasn't worth the full budget request?*
  *   **The Analysis:** No. This confuses **Total Value** with **Marginal Value**.
      *   You can believe the *Total Project* is worth 100 units and costs 100 dollars.
      *   You can also believe the *First Dollar* creates 5 units of value, and the *Last Dollar* creates 0.1 units of value.
      *   Admitting the last dollar is weak does not mean the total sum is unjustified. It just means the curve is flat at the end.
      *   **However:** If the Marginal Value of the last 40% of *your* project drops below the Marginal Value of the first 40% of *his* project (even in your own estimation), then economically, you *should* give him that money.
      *   **But:** You aren't doing that. You are keeping the money for *your* project (50%) rather than risking 0%. You are comparing **Certain Partial Bike** vs. **Risky Full Bike**. You are *not* comparing **Partial Bike** vs. **Partial Pool**.
  *   **The Verdict:** It is not a concession on the project's worth. It is a concession on **variance tolerance**. You are saying, "I value certainty of the core more than the gamble on the periphery." That is a statement about risk, not a statement about the project's intrinsic merit.

  ### Summary for the Argument

  If you need to explain this to your friend without getting bogged down in jargon, use this framing:

  1.  **"I am not hedging my belief; I am hedging my exposure."** You remain 100% convinced the Bike Lane is the superior project.
  2.  **"This is about the shape of the value, not the truth of the claim."** Because the first half of the bike lane does most of the work, guaranteeing that half is mathematically superior to gambling on the whole thing.
  3.  **"This only works because the Pool is a waste, not a harm."** If the Pool were dangerous, you'd be right to fight for the coin flip. Because it's just neutral waste, you can afford to let him have his toy in exchange for insurance on yours.
  4.  **"It isn't logrolling because we aren't trading votes; we're managing portfolio risk."**

  You have found a **Pareto Improvement**: a way to make both of you better off (in terms of expected utility) without either of you changing your mind about who is right. That is the definition of a rational agreement, not a compromise of principle.
