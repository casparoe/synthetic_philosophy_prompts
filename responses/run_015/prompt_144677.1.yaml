      *   *Antiquarian:* History as preservation, reverence for origins, maintaining identity and continuity. Risk: Mummification, inability to create new things, hoarding.
      *   *Critical:* History as judgment, breaking up the past to live, condemning injustices to free the present. Risk: Nihilism, rootlessness, destroying the soil from which one grows.
