      *   *Problem:* If we demand the motive be "because it's right," do we exclude sympathetic people who just *want* to help? (The "Sympathetic Philanthropist" problem).

  4.  **Addressing Sub-question 1: Circularity/Bootstrapping:**
      *   *The Worry:* To know the reason is right, I must know the act is right. But if the act is only fully good *because* of the reason, aren't we defining goodness in terms of itself?
