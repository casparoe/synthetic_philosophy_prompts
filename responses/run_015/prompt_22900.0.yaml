      *   *Bootstrapping:* Can a motive *make* an action right if the action wasn't already right? No. The action must be objectively right first. So the reason tracks the rightness.
      *   *Resolution:* Distinguish between the *content* of the reason (helping others) and the *status* of the reason (moral requirement).

