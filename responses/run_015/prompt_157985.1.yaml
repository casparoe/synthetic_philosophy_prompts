          1.  Protestant Work Ethic (labor as virtue).
          2.  French 35-hour week (legal cap on labor).
          3.  *Karoshi* in Japan (death by overwork).
          4.  AI Edge Case: Full automation, work is voluntary/creative, yet opting out is shamed/penalized.
      *   **Required Distinctions:** Right to leisure vs. forced leisure, earned rest vs. mandated idleness.
      *   **Constraints:** Cannot contradict medical/economic results.
      *   **Output Format:** Conceptual, table is fine, no obscure name-dropping.
      *   **Specific Deliverables:** List of desiderata (phenomena, distinctions, constraints), classification of non-negotiable vs. preference, identification of the "killer constraint" (the one that breaks popular theories).

  2.  **Deconstruct the Problem (The "Spec"):**
      *   The user wants a *normative framework* (how things *should* be) that accounts for *descriptive realities* (how things *are* or *have been*).
      *   As an engineer, they want "requirements." I need to translate philosophical concepts into system requirements.
      *   *Core Tension:* Work is necessary for survival (historically) but can be harmful (karoshi). Leisure is necessary for recovery (medical) but can be stigmatized (work ethic/AI scenario).

  3.  **Drafting the Desiderata (The Requirements List):**
      *   *Requirement 1: The Survival Constraint.* Work must produce enough to keep people alive. (Economic baseline).
      *   *Requirement 2: The Health Constraint.* Work cannot exceed physiological/psychological limits. (Addresses *Karoshi* & Medical facts).
      *   *Requirement 3: The Agency Constraint.* People must have a choice in the *amount* and *type* of work. (Addresses French law vs. Protestant ethic).
      *   *Requirement 4: The Social Meaning Constraint.* Work/Leisure status affects social standing. (Addresses Protestant Ethic & AI Shaming).
      *   *Requirement 5: The Distribution Constraint.* If work is scarce (AI scenario), how is the burden/benefit shared?

  4.  **Refining the Distinctions (The "Types"):**
      *   *Negative Liberty (Freedom From):* Right to *not* work (leisure).
      *   *Positive Liberty (Freedom To):* Right to *access* meaningful work.
      *   *Coercion:* State forcing rest (unemployment traps) vs. Market forcing work (wage slavery).
      *   *Value Source:* Intrinsic (creative) vs. Instrumental (wages).

  5.  **Addressing the AI Edge Case:**
      *   If AI does everything, "work" becomes "play."
      *   Why the shame? Because social status is tied to *contribution*, not just survival.
      *   Theory must explain why "uselessness" is punished even when unnecessary.

  6.  **Identifying Non-Negotiables vs. Preferences:**
      *   *Non-Negotiable:* Biological limits (you die if you work too much), Economic viability (you starve if no one works/resources aren't distributed).
      *   *Preference:* Cultural valuation (is work virtuous?), Specific hours (35 vs 40).

  7.  **Finding the "Killer Constraint":**
      *   What breaks most theories?
      *   Libertarian theories struggle with *Karoshi* (if I choose to work to death, is it okay?).
      *   Marxist theories struggle with the AI/Shame scenario (if means of production are shared, why the shame?).
      *   Liberal theories struggle with the tension between *Right to Work* and *Right to Leisure*.
      *   *The Killer:* **The Non-Identity of Economic Necessity and Social Worth.**
      *   *Why:* Most theories conflate "earning a living" with "earning respect." In the AI scenario, earning a living is decoupled from labor, but earning respect remains coupled. A theory that doesn't separate these fails the AI test.

  8.  **Structuring the Response:**
      *   **Intro:** Acknowledge the engineering mindset (Spec/Requirements).
      *   **Table 1: Functional Requirements (Phenomena to Explain).** Map the user's 4 inputs to system behaviors.
      *   **Table 2: Interface Constraints (Distinctions & Facts).** Medical/Economic hard limits and conceptual boundaries.
      *   **Classification:** Non-negotiable vs. Configurable.
      *   **The Killer Constraint:** Identify and explain the one that breaks things.
      *   **Conclusion:** Summary of the "Architecture."

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I name-drop obscure authors? *Correction:* Keep it to concepts (Liberalism, Marxism, etc. are okay as broad categories, but avoid "Arendt says X").
      *   *Check:* Did I address the AI scenario? *Yes, make sure it's prominent.*
      *   *Check:* Is the tone right? *Keep it analytical, precise, slightly technical but accessible.*
      *   *Refinement on the "Killer Constraint":* Initially, I thought about "Agency." But Agency is too broad. The specific friction is between *Material Security* and *Social Status*. In the AI world, Material Security is solved, Status is not. Theories often assume solving Material Security solves Status. That's the bug.

  10. **Final Polish:** Ensure the distinction between "Right to Leisure" (negative right) and "Duty to Labor" (positive duty) is clear. Ensure the medical constraint (burnout/death) is treated as a hard system limit.

