answer: |-
  Here is the specification for a robust theory of work and leisure rights, structured as a system requirements document.

  ### 1. Functional Requirements (Phenomena to Explain)
  A valid theory must account for these four observed system states without crashing (i.e., without logical contradiction).

  | ID | Phenomenon / Edge Case | System Behavior Required | Why This Is a Requirement |
  | :--- | :--- | :--- | :--- |
  | **F1** | **Protestant Work Ethic** | Must explain why labor is often treated as a moral good independent of output. | If a theory treats work *only* as an economic transaction (disutility), it cannot explain why people feel guilt when not working, even if financially secure. |
  | **F2** | **French 35-Hour Cap** | Must allow for collective limits on labor supply even if individuals want to work more. | If a theory prioritizes absolute individual contract freedom, it cannot justify state intervention to cap hours for social health. |
  | **F3** | **Karoshi (Death by Overwork)** | Must identify a hard failure state where labor exceeds biological tolerance. | A theory that treats the body as infinitely elastic contradicts medical reality. It must define a "critical threshold" where labor rights become human rights. |
  | **F4** | **AI Leisure-Punishment** | Must explain social shaming in a post-scarcity environment where labor is economically unnecessary. | If a theory assumes shame is only about resource allocation, it fails here. It must account for *status* allocation separate from *survival* allocation. |

  ### 2. Interface Constraints (Distinctions & Hard Facts)
  The theory cannot collapse these distinctions or contradict these external data sources.

  | ID | Constraint Type | Description | Rationale |
  | :--- | :--- | :--- | :--- |
  | **C1** | **Medical Hard Limit** | Cannot contradict circadian biology, stress physiology, or cognitive load limits. | **Non-Negotiable.** Humans are biological hardware. A theory demanding 100-hour sustainable weeks is scientifically false, not just unethical. |
  | **C2** | **Negative vs. Positive Liberty** | Must distinguish between the *right to rest* (freedom from work) and the *right to work* (access to contribution). | Collapsing these leads to policy errors. Guaranteeing income (negative) is different from guaranteeing meaningful projects (positive). |
  | **C3** | **Coercion Source** | Must distinguish between *Market Coercion* (starve if you don't work) and *State Coercion* (punished if you do work). | A theory that only fights one form of coercion is incomplete. The AI scenario introduces State/Social coercion to work when Market coercion is gone. |
  | **C4** | **Instrumental vs. Intrinsic Value** | Must separate work done for survival (instrumental) from work done for meaning (intrinsic). | In the AI scenario, all work is intrinsic. A theory that relies on instrumental necessity to justify labor rights will return `null` in that environment. |

  ### 3. Classification: Non-Negotiables vs. Preferences
  Not all requirements are equal. Some are kernel-level; others are user-configurable.

  | Requirement | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **Biological Integrity (C1)** | **Non-Negotiable** | If the user (human) dies, the system terminates. No cultural preference overrides physiology. |
  | **Resource Distribution (F2)** | **Non-Negotiable** | If the economy produces nothing, society collapses. There must be a mechanism to allocate resources, whether via wages or UBI. |
  | **Moral Valuation of Labor (F1)** | **Preference / Configurable** | A society *can* choose to view leisure as virtuous (e.g., Ancient Athens) or labor as virtuous. The theory must support either config without breaking. |
  | **Specific Hour Limits (F2)** | **Preference / Configurable** | 35 hours vs. 40 hours is a parameter, not a law. The theory must justify *having* a limit, not the specific number. |
  | **Status Mechanisms (F4)** | **Preference / Configurable** | How society assigns respect (via work, via art, via lineage) is cultural. However, the theory must prevent status mechanisms from violating Biological Integrity. |

  ### 4. The Killer Constraint (The "Bug" in Popular Theories)
  There is one requirement that causes the most failures in existing frameworks.

  **The Constraint:** **The Decoupling of Economic Necessity and Social Worth.**

  **Why it breaks popular theories:**
  *   **Libertarian/Market Theories:** Assume that if you remove economic necessity (e.g., via AI/UBI), people will naturally find optimal equilibrium. They fail **F4** because they don't account for social shaming. They assume "no economic need" = "no pressure." In your AI scenario, the pressure remains social, not economic.
  *   **Traditional Labor Theories:** Assume the primary struggle is *access* to work and wages. They fail **F4** because they fight for the "Right to Work." In an AI world where work is scarce and voluntary, fighting for a "Right to Work" might actually reinforce the shaming of those who opt out.
  *   **The Conflict:** Most theories conflate **Survival** (need resources) with **Status** (need respect).
      *   In the *Karoshi* case, people trade Survival for Status.
      *   In the *AI* case, Survival is guaranteed, but Status is still tied to Work.
      *   **The Fix:** A working theory must treat **Social Status** as a separate resource economy from **Material Survival**. If it doesn't, it cannot explain why someone would be shamed for not working when their labor isn't needed.

  ### 5. Summary Specification
  To pass validation, your theory of work/leisure rights must execute the following logic:

  1.  **Input:** Human Biological Limits.
  2.  **Process:** Allocate Material Resources (independent of labor if necessary).
  3.  **Process:** Allocate Social Status (independent of labor if necessary).
  4.  **Output:** A system where opting out of labor does not result in Starvation (Material) **AND** does not result in Ostracization (Status).

  **Failure Mode:** If the theory solves Starvation but allows Ostracization (The AI Scenario), it is incomplete. If it solves Ostracization but allows Starvation (Pure Idealism), it is unviable. If it mandates Labor to solve both (Protestant Ethic), it violates Biological Integrity (Karoshi).

  **Recommendation:** Focus your architecture on **Status Decoupling**. That is the module most likely to be missing from existing documentation.
