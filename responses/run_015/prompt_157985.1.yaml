prompt: |-
  hey im a software engineer with zero philosphy training trying to figure out what a decent theory of work and leisure rights actually needs to cover. I keep seeing three things that feel like they should constrain any answer: the Protestant work ethic treating labor as virtuous, France's 35-hour week capping it by law, and karoshi in Japan where people literally work themselves to death. but I also want it to handle this weird case I'm stuck on—imagine AI automates all productive labor, so the only "work" left is voluntary creative projects people do for fun, yet society still shames or penalizes anyone who opts out completely.

  what would the full list of desiderata be? I want the spec: the phenomona and edge cases it must explain (the ethic, the legal cap, death-by-overwork, and my AI leisure-punishment scenario), the distinctions it can't collapse (like a right to leisure vs being forced into it, or earned rest vs state-mandated idleness), any medical or economic results it can't flat-out contradict, and for each why it's a real requirement not just one camp's prejudice. also tell me which requirements are genuinely non-negotiable vs just preferences, and point out the single one that does the most damage to popular theories. table is fine—just keep it conceptual, no need to name-drop obscure authors.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, zero philosophy training, thinks in terms of specs, constraints, edge cases, and desiderata.
      *   **Task:** Define a "spec" for a decent theory of work and leisure rights.
