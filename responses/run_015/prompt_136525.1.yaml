      *   *Definition:* Acts that are morally good to do, but not morally wrong to omit. (Heroism, extreme charity).
      *   *The Problem:* If something is *the best thing to do*, why isn't it *required*? If morality is about maximizing good, shouldn't we always do the most good? (The utilitarian critique).
      *   *The Counter:* We need room for personal life, limits on demand, the difference between duty and saintliness.

  3.  **Translate to Coop/Tool-Library Vocabulary:**
