      *   *Supererogation:* Voluntary upgrades, extra shifts, fixing things nobody claimed, emotional labor, mentoring newbies without being asked.
      *   *The "Gap":* The space between "minimum viable coop" and "thriving utopia."

  4.  **Evaluate the Translation (The "Honest" Part):**
      *   *What works:* The distinction between "keeping the system running" (duty) and "making it amazing" (supererogatory) is very clear in a coop. Everyone knows the difference between sweeping the floor because it's your shift vs. staying late to reorganize the bins because you care.
      *   *What gets twisted:* In philosophy, supererogation is often individualistic (one hero saves the day). In a coop, it's collective. If *everyone* does the "extra" thing, does it become the new baseline? (The "creep" of obligation).
      *   *What disappears:* The metaphysical weight. Philosophers worry about moral *blame*. In a coop, the worry is about *sustainability* and *resentment*.
      *   *The "Duty vs. Heroism" Split:* In a coop, if you rely on "heroes" (supererogatory actors) to keep the system working, the system is broken. This suggests the philosophical split might be an artifact of individualistic ethics, whereas cooperative ethics demand that "extra" care eventually gets institutionalized.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's framework. It's a strong analogy. Validate their intuition.
      *   **The Translation Map:**
          *   *Duty* $\rightarrow$ *Preventative Maintenance.* (If you don't do it, the tool breaks/the coop closes).
          *   *Supererogation* $\rightarrow$ *Voluntary Upgrades/Polish.* (The system works without it, but it's better with it).
      *   **Where the Analogy Holds (The Clean Translation):**
          *   The distinction is real. You can point to a shift roster (duty) vs. someone fixing a broken drill no one logged (supererogatory).
