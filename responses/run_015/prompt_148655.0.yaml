answer: |-
  ### Translation: The Sponsor/Regulator Case

  **The Setup in Your Vocabulary**
  You have deposited a Statistical Analysis Plan (SAP) that maps the sufficient statistics at interim looks to actions $\{ \text{Stop Efficacy}, \text{Stop Futility}, \text{Continue} \}$. The Regulator performs a prior-predictive simulation (assurance calculation) on this deposited SAP. Based on the operating characteristics (OC) of this specific pipeline—specifically its "patience" (probability of continuing under marginal efficacy)—the Regulator sets the evidentiary hurdle for the confirmatory program. A more patient pipeline yields a lower hurdle (e.g., smaller required Phase 3 sample size or relaxed alpha spending), creating a higher ex-ante expected value for the sponsor.

  **The Interim**
  You are at the interim look. The observed treatment effect is large. The conditional power is high. The posterior probability of success (under your analysis prior) exceeds the stopping boundary.

  **Causal Decision Theory (CDT) Recommendation**
  *   **Vocabulary:** Condition on the observed interim data and the fact that the Regulator's hurdle is a *sunk constant*. The assurance calculation is a historical event; the Regulator has already set the hurdle based on the *code* you deposited, not the *execution* you are about to perform.
  *   **Action:** Maximize the conditional expected utility given the current data. Since the hurdle is fixed and the data favors efficacy, **declare efficacy and stop**. The cost of waiting (enrollment cost, time) outweighs the marginal benefit of further data, and deviating from the SAP does not causally retroactively change the Regulator's simulation.

  **Updateless Decision Theory (UDT) Recommendation**
  *   **Vocabulary:** Treat the deposited SAP as a logical commitment that defines your identity as an agent in the Regulator's simulation. The Regulator's hurdle was not set based on the *text* of the SAP, but on the *output* of the SAP when run against the design prior. You are currently an instance of that SAP. If you deviate from the SAP's instruction (e.g., if the SAP says "Continue" but you "Stop"), you are logically distinct from the agent the Regulator simulated.
  *   **Action:** Execute the action prescribed by the deposited SAP, even if the conditional data looks favorable. If the SAP says **Continue**, you must **Continue**. To do otherwise is to invalidate the assurance calculation that secured the lower hurdle. You maximize the *ex-ante* expected utility of the policy, not the *ex-post* conditional utility of the realization.

  ---

  ### Translation: The Blinded Interim Case

  **The Setup**
  Your deposited pipeline is a function $f(Data) \to Action$. However, the pipeline does not have access to the index $k$ (which interim look it is), only the sufficient statistics $S_k$. This is analogous to indexical uncertainty: the agent knows the data but not its location in the sequence.

  **CDT Recommendation**
  *   **Vocabulary:** Construct a posterior over the look index $k$ given $S_k$ (e.g., infer information fraction from variance). Condition on the most likely look.
  *   **Action:** Maximize conditional utility given the inferred look. If the data suggests you are at Look 1 (where boundaries are wider), stop. If Look 2, continue.

  **UDT Recommendation**
  *   **Vocabulary:** The policy $f$ was optimized *ex-ante* knowing that $k$ would be hidden. The optimization integrated over the uncertainty of $k$.
  *   **Action:** Execute $f(S_k)$ directly. Do not attempt to infer $k$ to "game" the boundary. The ex-ante optimization already accounted for the ambiguity; trying to resolve the indexical uncertainty at execution is a form of conditioning that breaks the logical link to the simulated policy.

  ---

  ### Residue Report

  **What Translates Cleanly**
  *   **Policy $\leftrightarrow$ SAP:** The UDT "policy" is exactly your deposited, locked analysis pipeline.
  *   **Ex-Ante Standpoint $\leftrightarrow$ Assurance/OC:** The UDT "objective function" is the expected utility computed via prior-predictive simulation (assurance) during the design phase.
  *   **Precommitment $\leftrightarrow$ Locked Protocol:** The UDT requirement to bind future actions is operationally identical to the regulatory requirement for a locked SAP to control Type I error.

  **What Translates with Distortion**
  *   **The Design Prior:** This is the critical fracture point. In biostatistics, the design prior (used for assurance) is explicitly a *planning device*. You are permitted (and often required) to set it aside at the analysis stage in favor of a reference prior or a frequentist sampling distribution for the actual claim. UDT demands that the prior used for *optimization* must also be the prior used for *execution*.
      *   *Distortion:* Biostats says, "Use the design prior to pick the sample size, then use the data to test." UDT says, "Use the design prior to pick the sample size, and act as if the design prior is the truth when deciding to stop." If your analysis prior differs from your design prior, UDT views your interim decision as incoherent relative to the ex-ante deal.
  *   **The Regulator's Simulation:** In biostats, the Regulator's simulation is an *approximation* of reality. In UDT, the simulation is *logically identical* to the execution. Biostats allows for "model drift" (the real world differs from the simulation); UDT treats the simulation as a logical constraint on the agent's identity.

  **What Has No Expression in Your Vocabulary**
  *   **The Statistician as a Causal Node:** Your suspicion is correct. In trial design, the statistician is external to the trial's causal graph. The data generating process is $P(Data | \theta)$; the analysis is a function applied *to* the data. In UDT, the algorithm *is* the node.
      *   *Cousins:* **Response-Adaptive Randomization (RAR)** puts the algorithm in the loop, but RAR optimizes *conditional* power (CDT-style) for patient benefit, not ex-ante utility for the sponsor. **Iterative Tuning** (simulation-based calibration) gets closer: you tune the design until OCs are met. But once the trial starts, the "tuner" vanishes. UDT implies the "tuner" never vanishes; the execution *is* the tuning.
      *   *Missing Concept:* **Logical Uncertainty.** You treat the simulation as uncertain because of sampling variability. UDT treats the simulation as uncertain because of *logical* variability (what does the code output?). In biostats, if you know the code and the data, you know the action. In UDT, even knowing code and data, you might treat the output as a variable to be optimized over ex-ante.

  ---

  ### Commitment

  **Position:** **Biostatistics is already practicing Updateless Decision Theory, but it enforces it via external constraint (regulation/ethics) rather than internal rationality.**

  The "refusal to condition" that your field practices—specifically the dogma that "error rates are properties of procedures, not realized cases"—is the operational equivalent of UDT. When you refuse to stop early because "it would inflate alpha," even though the conditional power is 99%, you are prioritizing the *ex-ante property of the procedure* over the *ex-post utility of the realization*. This is precisely the UDT move.

  The UDT literature is not discovering a new wheel; it is providing the decision-theoretic axle for a wheel biostatistics has been turning since the stopping-rule debates. The only difference is normative: Biostats says, "You must not condition, or you will be *wrong* (invalid)." UDT says, "You must not condition, or you will be *suboptimal* (leaving utility on the table)." In the Regulator scenario you described, validity *is* utility (because the hurdle depends on validity), so the two converge completely.

  **The Single Piece of Evidence That Would Change My Mind:**
  A regulatory framework that explicitly **validates post-hoc error rates** (e.g., allowing full alpha-recycling or Bayesian updating with no prior penalty for mid-trial SAP changes) *and* demonstrates that sponsors who adhere to their original, updateless SAPs still achieve **higher expected utility** than sponsors who condition and adapt, purely due to logical correlations in the Regulator's assessment algorithm.

  If the Regulator allows you to change the plan without penalty (removing the frequentist constraint), and you *still* lose value by conditioning on the interim data, then UDT has found a residue that biostatistics does not cover. Until then, "locked SAP" is just UDT with a legal contract.
