answer: |-
  This is the correct move. Your advisor is identifying a category error in the literature: scholars are comparing *models* without agreeing on the *problem* the models are supposed to solve. If the purpose is a **normative theory for resource-limited agents** (not a description of humans, not unbounded theory with a tax), the desiderata must be derived from the logical constraints of that purpose, not from the traditions of neoclassical economics or cognitive psychology.

  Below is the specification. I have reorganized your eleven points into three structural categories (Computational, Normative, and Environmental), filtered out the prejudices, and identified the logical tensions.

  ### I. The Specification (The Scorecard)

  A theory $T$ is adequate for a bounded agent $A$ if and only if it satisfies the following mandatory constraints. Items marked **Optional** are research preferences, not logical requirements of the stated purpose.

  #### A. Computational Constraints (Can the agent run this?)

  **1. The Metacognitive Regress Stopper (Your \#1)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** The fellowship committee cannot spend 10 hours deciding how to spend 6 hours.
  *   **Rationale:** If the rule for selecting a decision procedure requires more computation than the decision itself justifies, the rule is self-defeating. A normative theory cannot prescribe an impossible calculation. It must provide a stopping rule for deliberation that is *cheaper* to compute than the value of the deliberation, without requiring a prior optimization to find that stopping rule.
  *   **Why Mandatory:** Without this, the theory generates an infinite regress of "decisions about deciding," rendering action impossible.

  **2. Self-Applicability / Tractability (Your \#3)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** A theory telling an agent to "maximize expected utility" is empty if calculating the EU requires more memory than the agent possesses.
  *   **Rationale:** "Ought implies can." If the theory's recommendation cannot be computed within the agent's actual working memory and time limits, it is not a normative guide for *that* agent; it is a description of an oracle.
  *   **Why Mandatory:** Distinguishes a theory *for* the agent from a theory *about* the agent.

  **3. Representational Parsimony (Your \#4)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** An agent cannot hold a prior over $2^{100}$ states of the world.
  *   **Rationale:** The theory cannot presuppose the agent has already solved the framing problem or encoded the state space. The theory must operate on the representations the agent *actually has*, not the ones a god would have.
  *   **Why Mandatory:** Unbounded representations are physically impossible for bounded agents. A normative theory cannot demand physical impossibilities.

  **4. Interruptibility / Anytime Property (Your \#2)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** The fire alarm rings during your deliberation. You must act *now* with whatever partial computation you have.
  *   **Rationale:** In real resource environments, time is stochastic. A procedure that yields "no recommendation" or "garbage" if stopped prematurely is too fragile to be normative. The quality of the recommendation must degrade gracefully with time.
  *   **Why Mandatory:** If the agent cannot rely on having the full time budget, a theory that requires the full budget to yield value is risky to the point of irrationality.

  #### B. Normative Constraints (Does this distinguish error from limit?)

  **5. Normative Bite / Error Identification (Your \#11)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** An agent ignores a clearly visible, costless piece of information. Is this a "limit" or a "mistake"?
  *   **Rationale:** If every deviation from unbounded optimization is excused as a "bound," the theory is descriptive, not normative. The theory must define a *procedural* standard: given the bounds, was the *process* flawed?
  *   **Why Mandatory:** This is the core of your prompt's purpose. Without this, you have rationalization, not rationality.

  **6. The Currency Problem (Your \#5)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Thinking costs "mental effort" (physiological); payoff is "money" (economic). How are they traded?
  *   **Rationale:** Optimization requires a common denominator. If cognitive costs are not commensurable with outcome utilities, the objective function is undefined. The theory must specify the exchange rate or the lexicographic ordering between thinking costs and decision payoffs.
  *   **Why Mandatory:** You cannot maximize a function with incommensurable variables.

  **7. Immunity to Exploitation (Your \#6)**
  *   **Status:** **Optional (The Prejudice).**
  *   **Case:** A money pump requires recognizing the cycle. If recognition costs more than the loss, avoiding the pump is irrational.
  *   **Rationale:** Standard rationality demands consistency (transitivity, etc.) to avoid Dutch books. But consistency checks consume resources. A bounded normative theory *must* allow for some exploitability if the cost of avoiding exploitation exceeds the expected loss.
  *   **Why Optional:** Demanding immunity smuggles in unbounded rationality. A bounded agent *should* sometimes accept being pumped if avoiding it violates the Regress Stopper.

  **8. Convergence to Unbounded Ideal (Your \#9)**
  *   **Status:** **Optional (The Prejudice).**
  *   **Case:** In high-noise environments, a $1/N$ heuristic often outperforms optimized regression as data increases (the bias-variance tradeoff).
  *   **Rationale:** There is no logical reason why a bounded theory should approach the unbounded Bayesian ideal as limits relax. The unbounded ideal may be overfitting.
  *   **Why Optional:** This assumes the unbounded model is the "truth" that bounded models approximate. Ecological rationality suggests they are different tools for different environments.

  #### C. Environmental Constraints (Where does the agent sit?)

  **9. Bound Specification & Uncertainty (Your \#10)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** The agent thinks they have 10 minutes, but they only have 5. Or they don't know their own memory capacity.
  *   **Rationale:** Bounds are not just hard constraints; they are often objects of uncertainty. A robust theory must handle uncertainty about the constraints themselves.
  *   **Why Mandatory:** Agents are often wrong about their own limits. A theory that breaks under meta-uncertainty is brittle.

  **10. Scaffold Neutrality (Your \#8)**
  *   **Status:** **Non-Negotiable.**
  *   **Case:** Is writing on paper "thinking" or "acting"?
  *   **Rationale:** The theory must define the boundary of the "agent." If offloading to a notebook reduces internal memory load, the theory must account for the cost of the offloading.
  *   **Why Mandatory:** Cognitive boundaries are porous. Ignoring tools mis-specifies the resource constraint.

  **11. Description Invariance (Your \#7)**
  *   **Status:** **Optional (The Prejudice).**
  *   **Case:** "90% lean" vs. "10% fat." Processing these requires different cognitive work.
  *   **Rationale:** For a bounded agent, frames are computational shortcuts. Demanding invariance ignores the cost of translation.
  *   **Why Optional:** Description invariance is a property of the *outcome*, not the *process*. A process-based normative theory allows framing effects if they save resources.

  ---

  ### II. The Impossibility Results (The Tensions)

  You suspected conflicts. You are right. The following subsets of desiderata are jointly unsatisfiable in the general case. This is where your framing chapter must do its heavy lifting.

  **Tension 1: The Consistency-Tractability Trade-off**
  *   **Conflicting Set:** {Immunity to Exploitation (6), Self-Applicability (3), Normative Bite (5)}.
  *   **The Argument:** To be immune to Dutch books, an agent must ensure their preferences are transitive and consistent across all contexts. Checking for consistency requires comparing options pairwise across the choice set. For a large choice set, this comparison cost grows quadratically or exponentially. If the agent is resource-limited (Self-Applicability), they cannot check all pairs. Therefore, they will exhibit inconsistencies. If the theory demands Immunity (6), it violates Self-Applicability (3). If it respects Self-Applicability, it must permit some exploitability.
  *   **Resolution:** You must drop **Immunity to Exploitation** as a hard requirement. A bounded normative theory must define "reasonable consistency" (e.g., local transitivity) rather than global consistency.

  **Tension 2: The Interruptibility-Optimality Trade-off**
  *   **Conflicting Set:** {Interruptibility (4), Convergence to Unbounded Ideal (9), Normative Bite (5)}.
  *   **The Argument:** To converge to the unbounded optimum, an agent typically needs to complete a specific search or integration procedure (e.g., integrate over the full posterior). If the procedure is interrupted, the partial result is often biased or meaningless (e.g., the first half of a sorted list is not a representative sample). To satisfy Interruptibility, the agent must use "anytime algorithms" (where quality improves monotonically with time). However, many optimal statistical procedures are *not* anytime algorithms.
  *   **Resolution:** You must drop **Convergence (9)**. You cannot guarantee the procedure looks like the unbounded ideal *and* works when cut short. You must prioritize robust procedures (like heuristics) over optimal ones.

  **Tension 3: The Currency-Parsimony Trade-off**
  *   **Conflicting Set:** {Currency Commensurability (6), Representational Parsimony (4)}.
  *   **The Argument:** To trade off "thinking cost" against "decision payoff," the agent needs a meta-utility function that maps effort to utility units. Constructing and maintaining this meta-utility function requires representational space and calibration. For a very limited agent, the cost of maintaining the "currency converter" may exceed the benefits of the optimization it enables.
  *   **Resolution:** The theory must allow for **heuristics that bypass explicit trade-offs**. Instead of calculating $Marginal Benefit = Marginal Cost$, the agent uses a rule like "Stop when you find an option that meets the aspiration level." This sacrifices precise currency commensuration for parsimony.

  ---

  ### III. The Exclusionary Constraint

  **The Single Most Exclusionary Requirement:**
  **#1 The Metacognitive Regress Stopper.**

  **Why:** This is the "Good's Theorem" problem applied to cognitive architecture. Most "Bounded Rationality" models in economics are actually **Optimization Under Constraints**. They posit an agent who *optimizes* the amount of information to gather.
  *   *The Kill:* Calculating the optimal amount of information to gather *requires* knowing the value of that information. To know the value, you essentially have to process the information. Thus, the "optimization" step is often computationally harder than the decision itself.
  *   Any theory that requires the agent to *calculate* the optimal stopping point (rather than using a fixed rule or heuristic to stop) fails the Regress Stopper. This eliminates the vast majority of "Rational Inattention" and "Search Theory" models that claim to be normative for bounded agents. They assume the cost of calculating the cost is zero.

  ---

  ### IV. Missing Desiderata

  Your list is strong, but it misses two critical dimensions for a *normative* theory:

  **1. Learnability (The Stability Condition)**
  *   **Requirement:** The agent must be able to *learn* the recommended policy from experience within their resource limits.
  *   **Why:** A theory might prescribe a heuristic that works, but if the agent cannot discover that heuristic without unbounded exploration, the theory is useless. A normative theory must explain how the agent gets to the rational procedure, not just what the procedure is.

  **2. Dynamic Consistency (The Planning Condition)**
  *   **Requirement:** The plan made at $t=0$ must be executable at $t=1$ without requiring renegotiation that consumes new resources.
  *   **Why:** Bounded agents suffer from time-inconsistency not just due to discounting, but due to changing cognitive states (fatigue, stress). A normative theory must account for the cost of *enforcing* the plan on one's future self.

  ---

  ### V. Comparative Scoring Table

  Here is how the major research programs score against the **Non-Negotiable** criteria derived above.

  | Approach | Regress Stopper (1) | Self-Applicability (3) | Interruptibility (4) | Normative Bite (5) | Currency (6) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Simon-style Satisficing** | **Pass** (Aspiration levels stop search) | **Pass** (Local search) | **Pass** (Can stop anytime) | **Weak** (Hard to define "reasonable" aspiration) | **Fail** (Aspiration adjustment often ad-hoc) | Strong on process, weak on calibration. |
  | **Info-Cost / Rational Attention** | **Fail** (Optimizing attention costs attention) | **Fail** (Often requires solving hard convex problems) | **Fail** (Solutions often brittle) | **Pass** (Clear error definition) | **Pass** (Explicit cost functions) | **Optimization under constraints, not bounded rationality.** |
  | **Fast-and-Frugal (Ecological)** | **Pass** (Simple stopping rules) | **Pass** (Low memory load) | **Pass** (Robust to interruption) | **Weak** (Relativistic to environment) | **Fail** (No explicit trade-off metric) | Best on computation, weak on normative universality. |
  | **Bounded Optimality (AI/ Russell)** | **Fail** (Computing the optimal program is intractable) | **Conditional** (Depends on machine architecture) | **Pass** (Anytime algorithms emphasized) | **Pass** (Defined relative to machine) | **Pass** (Objective function defined) | **Theoretically rigorous, often computationally impossible for humans.** |

  ### Summary for your Chapter

  Your advisor is right: the literature is comparing apples (descriptive heuristics) to oranges (normative optimization) using a knife (unbounded consistency).

  Your framing chapter should argue that **Self-Applicability** and the **Regress Stopper** are the primary filters. Any theory that requires the agent to solve a hard problem to decide how to solve a hard problem is not a theory of bounded rationality; it is a theory of unbounded rationality pretending to be bounded.

  The core tension you must navigate is sacrificing **Immunity to Exploitation** and **Convergence** to save **Self-Applicability**. A truly normative theory for bounded agents must be willing to say: *"It is rational to be inconsistent, provided the cost of consistency exceeds the cost of the inconsistency."* That is the scorecard.
