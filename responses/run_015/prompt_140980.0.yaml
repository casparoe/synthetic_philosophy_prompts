      *   **Task:** Write the *desiderata* (specification) for a normative theory of rationality under cognitive limits (bounded rationality).
      *   **Advisor's Critique:** Existing literature compares views without defining the "scorecard."
      *   **Goal:** Define what an *adequate* theory must deliver, distinguishing genuine requirements from research program prejudices.
      *   **Input:** A list of 11 candidate desiderata provided by the user.
      *   **Output Requirements:**
          *   Evaluate each candidate (keep, split, reject).
          *   Provide motivating cases.
          *   Mark as Non-Negotiable (given the purpose) or Optional.
          *   Identify joint unsatisfiability (trade-offs/impossibility results).
          *   Identify the single most exclusionary requirement.
          *   Identify missing important criteria.
          *   Provide a brief scoring table for four specific approaches (Simon, Info-Cost, Fast-and-Frugal, Bounded Optimality).
      *   **Tone:** Rigorous, philosophical but economically grounded, precise, avoiding hand-waving.

  2.  **Deconstruct the Purpose:**
      *   *Normative:* Tells the agent what they *should* do.
      *   *Bounded:* Acknowledges real limits (time, memory, attention, representation).
      *   *Critical:* Can still call some actions "mistakes" (not just descriptive relativism).
      *   *Not:* Unbounded Bayesian + cost bolt-on. Not descriptive psychology.

  3.  **Evaluate the 11 Candidates (Iterative Process):**

      *   *(1) Deliberation-cost regress:* Crucial. If you need to optimize deliberation, you need to optimize the optimization... infinite regress. A normative theory must have a stopping rule that doesn't require unbounded calculation to compute. *Verdict: Non-Negotiable.*
      *   *(2) Interruptibility:* Is this normative or engineering? If the theory says "calculate for 1 hour" and the agent is stopped at 59 mins, is the output garbage? For a *normative* theory of action, the advice must be actionable *now*. If the procedure isn't interruptible, the advice is fragile. However, is it a *requirement* for rationality? Maybe not strictly, but for *resource-limited* rationality, yes. If you can't finish, you fail. *Verdict: Non-Negotiable (given "real resource limits").*
      *   *(3) Self-applicability:* The agent must be able to compute the recommendation. If the theory requires calculating $\pi$ to the trillionth digit to tell you what to do, and you can't, it's not a theory *for you*. *Verdict: Non-Negotiable.*
      *   *(4) Representational parsimony:* Unbounded priors are impossible for bounded agents. A normative theory can't demand the impossible. *Verdict: Non-Negotiable.*
      *   *(5) The currency question:* Commensurability. If thinking costs "effort" and outcomes are "money," how do we trade off? A normative theory needs a common metric or a lexicographic rule. Without this, optimization is undefined. *Verdict: Non-Negotiable.*
      *   *(6) Immunity to exploitation:* Dutch books. Standard rationality requires this. But bounded agents *will* be pumpable if avoiding the pump costs more than the loss. A *normative* theory for bounded agents might have to allow some exploitability if avoiding it violates other bounds. *Verdict: Optional/Contested.* (This is a key tension point).
      *   *(7) Menu and framing sensitivity:* Description invariance is a hallmark of unbounded rationality. Bounded agents *must* rely on frames. A normative theory shouldn't forbid this if the frame saves resources. *Verdict: Optional (Description invariance is not required).*
      *   *(8) Scaffold neutrality:* Extended cognition. Does using a notebook count as "internal" memory? For a theory of *agent* rationality, the boundary matters. If the theory ignores tools, it's unrealistic. If it treats tools as free, it's wrong. *Verdict: Non-Negotiable (must specify the boundary).*
      *   *(9) The convergence condition:* As bounds $\to \infty$, does it look like Bayesian? Not necessarily. Sometimes heuristics are robust. Demanding convergence biases the theory toward the unbounded ideal. *Verdict: Optional (Prejudice).*
      *   *(10) The bound's own specification:* Meta-uncertainty. Agents don't know their own limits perfectly. A robust theory must handle uncertainty about the constraint itself. *Verdict: Non-Negotiable (for robustness).*
      *   *(11) Normative bite:* Must distinguish error from limit. This is the core of the prompt's purpose. *Verdict: Non-Negotiable.*

  4.  **Identify Tensions/Impossibility Results:**
      *   *The Big Conflict:* **Self-Applicability (3) + Immunity to Exploitation (6) + Normative Bite (11).**
      *   *Why?* To avoid exploitation (Dutch books), you need consistency (transitivity, etc.). Ensuring consistency requires checking options against each other. Checking requires resources. If resources are limited (3), you cannot check everything. Therefore, you will be inconsistent. Therefore, you are exploitable (6). If the theory says "it's okay to be exploitable because you're bounded," does it lose Normative Bite (11)? Or does it redefine rationality?
      *   *Interruptibility (2) vs. Optimality (9/Standard):* If you must be interruptible, you can't run a global search. You must run a local search. Local search doesn't guarantee global optima.
      *   *Currency (5) vs. Parsimony (4):* To commensurate effort and outcome, you need a meta-utility function. Constructing that function might violate parsimony.

  5.  **Select the "Most Exclusionary" Requirement:**
      *   It's likely **(3) Self-Applicability** combined with **(1) Regress**. This kills standard "Optimization under Constraints" approaches because calculating the optimal constraint usage is usually harder than the original problem. This is the "Good's Theorem" problem or the "Metacognitive Regress."

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the advisor's point. Define the "Scorecard."
      *   **The Refined Desiderata:** Go through the list. Group them logically (Computational, Normative, Structural). Be harsh on what is "prejudice."
      *   **The Impossibility Results:** This is the meat. Explain *why* they conflict. Focus on the "Cost of Consistency."
      *   **The Killer Constraint:** Identify Self-Applicability/Regress.
      *   **Missing Items:** What's not there? *Dynamic Consistency* (planning vs. doing) and *Learning* (can the bound change?). Let's add *Procedural Transparency* (the agent needs to know *why*). Actually, *Learnability* is huge. If the theory prescribes a rule the agent can't learn, it's useless.
      *   **The Table:** Score Simon, Info-Cost, Fast-and-Frugal, Bounded Optimality. Keep it sharp.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Interruptibility:* Is it truly non-negotiable? If I plan a 1-hour calculation and get interrupted, is the theory wrong? No, the *world* was wrong. But if the theory *requires* completion to yield value, it's risky. Let's classify it as "High Priority" but maybe not logically necessary for *normativity*, just for *robustness*. Actually, given "real resource limits" includes uncertainty, Interruptibility is effectively Non-Negotiable for a *usable* theory.
      *   *Correction on Exploitability:* This is the biggest fight in the literature. I need to be clear: A bounded normative theory *must* permit some exploitability. Demanding immunity is the prejudice of the unbounded view.
      *   *Correction on Convergence:* Definitely a prejudice. Ecological rationality argues against this.
      *   *Missing:* **The Implementation Gap.** The theory must map to cognitive architecture. Also, **Meta-Rationality**: How do you choose the heuristic?

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a PhD framing chapter (technical, precise, critical).
      *   Check against the prompt's specific constraints (mark non-negotiable vs optional, explain tensions).
      *   Make sure the table is brief but informative.

  9.  **Structure of the Response:**
      1.  **Preamble:** Validating the advisor's critique.
