  *(Refining the "Currency" point)*: This is often glossed over. If thinking costs "glucose" or "time," and payoff is "money," the theory needs a bridge. I will emphasize this as a mandatory structural requirement.

  *(Refining "Normative Bite")*: This is the hardest. How to distinguish error from limit? The answer usually lies in *procedural* norms rather than *outcome* norms. Did they follow the best available procedure given their bounds? That's the key distinction.

