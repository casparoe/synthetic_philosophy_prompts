  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Etiological accounts *can't* handle artifacts. They can (Millikan on artifacts). The point is whether they can handle artifacts *as biological functional parts* without borrowing from Causal-Role.
      *   *Nuance:* The user's Move 3 is the strongest. If the etiological theorist says "It has the derived function of pacing," how do they define "pacing"? By what it *does* (causal role). So causal role is prior to the functional ascription, even if the *normativity* comes from history/design.
