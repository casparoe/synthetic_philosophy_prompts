      *   **Three Moves:**
          1.  Causal-role assigns function easily (same systemic contribution).
          2.  Etiologist denying function seems ad hoc (given medical integration).
          3.  Etiologist distinguishing "proper" vs. "derived" function relies on causal-role to define the "derived" role, creating circularity.
      *   **Specific Questions:**
          1.  Does this framing advance the debate or conflate biological/artifactual function?
