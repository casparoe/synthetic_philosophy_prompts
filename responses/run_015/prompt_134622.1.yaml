  **MEMORANDUM**

  **TO:** City Monuments Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Brennan Avenue Designation

  I recommend we vote to rename Brennan Avenue.

  Street naming is never merely indexical; it is inherently honorific. While historians argue that retaining the name preserves historical indexing—allowing us to track the lineage of our infrastructure and zoning—this view misunderstands the civic function of a street sign. A sign is not a footnote; it is a daily civic endorsement. To keep Brennan's name, even with a contextual plaque, suggests that his engineering contributions outweigh the harm of his eugenic zoning, or that the two can be neatly balanced. They cannot. The strongest argument against renaming is that erasure prevents us from confronting the past. However, renaming does not erase history; it reclassifies it. We can honor the aqueduct's engineering in a museum or archival marker without forcing residents to live under the banner of the man who sought to exclude their ancestors. Renaming shifts the honor to the community itself, while archival records preserve the factual history of Brennan's dual legacy.

  **Practical Risks:**
  *   **Rename:** Logistical costs for signage and address updates; potential backlash from those viewing this as "erasing history."
  *   **Keep:** Continued harm to descendants of displaced families; perception of board indifference to eugenic policies.
  *   **Twin-Plaque:** High risk of moral laundering; creates a "both sides" narrative where none exists; may confuse the public message regarding the city's stance on eugenics.

  **Proposed Timeline:**
  *   **Thursday:** Board vote to initiate renaming process.
  *   **November – January:** Community naming workshop with affected descendants and local residents.
  *   **February:** Final selection and budget approval for signage replacement.
  *   **March:** Installation of new signs and dedication ceremony.

  ***

  **Confidence Note:**
  I am highly confident in the recommendation to rename, as it aligns best with the ethical imperative to stop honoring proponents of eugenics. The area where I am least certain—and why I hesitated before rejecting the Chair's proposal—is whether a twin-plaque strategy ever successfully avoids moral laundering or simply doubles the harm by forcing victims to read their own displacement next to their oppressor's name. While context is vital in museums, I remain unsure if it can function ethically on a street sign, which is why I cannot support it here.
