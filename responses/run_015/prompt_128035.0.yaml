answer: |-
  ### I. Survey of Established Categories

  Before proposing a specific classification, we must measure the pattern you describe against the nearest established dialectical and methodological categories. The phenomenon involves a shift in the *epistemic warrant* for a premise or definition, contingent on the direction of the dialectical pressure.

  1.  **Lakatosian Protective-Belt Adjustment:** In Lakatos's methodology of scientific research programmes, a "hard core" is protected by adjusting auxiliary hypotheses in the "protective belt" when anomalies arise.
      *   *Fit:* Partial. The defender is indeed protecting the hard core (the conclusion of necessary existence) by adjusting the status of the axioms (the definition of "positive").
      *   *Mismatch:* Lakatosian adjustments usually maintain methodological consistency. If the programme is formal, the adjustments should be formal. Shifting from a formal warrant to an intuitive warrant changes the *methodology* of the programme itself, not just the auxiliary hypotheses. It violates the internal consistency of the research strategy.

  2.  **Ad Hoc Immunization:** This occurs when a hypothesis is modified solely to escape falsification, without independent testability or theoretical gain.
      *   *Fit:* High. The appeal to intuition arises specifically to block the "anti-God" symmetry objection.
      *   *Mismatch:* "Ad hoc" typically describes the *addition* of a clause or the *restriction* of a scope. Your pattern describes a *switch* in the nature of justification. The defender does not merely add a clause; they reclassify the existing axiom from "formal stipulation" to "intuitive truth" when convenient, and vice versa.

  3.  **Motte-and-Bailey Fallacy:** This involves retreating to a modest, defensible claim (the Motte) when challenged, while asserting a bold, controversial claim (the Bailey) when unchallenged.
      *   *Fit:* High. The "Bailey" is the strong formal derivation (God exists necessarily via S5). The "Motte" is the modest intuitive claim ("Positive" just means moral perfection, which we grasp pre-theoretically).
      *   *Mismatch:* The standard Motte-and-Bailey distinguishes claims by *strength* or *content*. Your pattern distinguishes them by *source of authority*. The content ("Positive properties are closed under entailment") remains ostensibly the same; what changes is whether its validity rests on the formal system or the pre-theoretic intuition. This is a *Justificatory* Motte-and-Bailey, which is structurally distinct from the standard semantic version.

  4.  **Equivocation:** This involves using a term in two different senses within an argument.
      *   *Fit:* Low. The defender explicitly denies that the meaning of "positive" changes. They claim the *access* to the meaning changes (formal approximation vs. intuitive grasp).
      *   *Mismatch:* Equivocation is semantic; your pattern is epistemic. The term refers to the same property, but the *warrant* for asserting facts about that property shifts.

  ### II. Diagnosis and Coinage

  None of the above categories captures the precise mechanism of *oscillating epistemic authority*. The pattern is not merely retreating to a safer claim (Motte), nor merely adding a hypothesis (Ad Hoc), nor merely changing a meaning (Equivocation). It is a bidirectional shift in the *ground of validity*.

  Therefore, a new term is required to carve this specific dialectical joint. I propose the term:

  **The Formal-Intuitive Pivot (FIP)**

  #### Definition
  The **Formal-Intuitive Pivot** is a dialectical maneuver in semi-formal metaphysics wherein the epistemic warrant for a foundational definition or axiom oscillates between **formal derivability** and **pre-theoretic intuition** depending on the direction of the objection.

  *   **Forward Motion (Proof Generation):** The defender treats the definition/axiom as a **formal stipulation**. Validity is secured by the closure conditions and logical syntax (e.g., "Positive properties are closed under entailment by definition"). This allows the derivation of strong conclusions (e.g., Necessary Existence).
  *   **Reverse Motion (Defense against Counter-Models):** When the formal machinery generates unwanted results (e.g., an "Anti-God" or modal collapse), the defender treats the definition/axiom as an **intuitive constraint**. Validity is secured by pre-theoretic grasp (e.g., "We intuitively know negativity isn't positive, regardless of the closure rule"). This blocks the unwanted derivation without revising the formal system.

  #### Boundary Conditions: What FIP Is and Is Not

  1.  **Distinction from Motte-and-Bailey:**
      *   *Motte-and-Bailey:* Shifts the *content* of the claim (Bold: "God exists." Modest: "The concept of God is coherent.").
      *   *FIP:* Keeps the *content* stable but shifts the *authority* (Formal: "The logic proves it." Intuitive: "The logic only approximates our intuition.").
      *   *Edge Case:* If the defender admits the formal system is *only* a model of the intuition, it is not FIP; it is honest modeling. FIP occurs only when the formalism is claimed to be *constitutive* of the proof during the offensive phase.

  2.  **Distinction from Ad Hoc Hypothesis:**
      *   *Ad Hoc:* Adds a new premise to block a counter-example (e.g., "Positive properties exclude negativity").
      *   *FIP:* Re-describes the *status* of an existing premise. No new axiom is added; the existing axiom's justification is retroactively altered from "logical truth" to "contingent intuition."

  3.  **Distinction from Carnapian Explication:**
      *   *Explication:* Replaces an imprecise concept with a precise one, acknowledging the replacement.
      *   *FIP:* Claims the precise formalism *captures* the imprecise concept when proving, but denies the formalism *exhausts* the concept when defending. It claims the benefits of precision without the costs of commitment.

  4.  **Distinction from Simple Equivocation:**
      *   *Equivocation:* "Positive" means $P_1$ in premise 1 and $P_2$ in premise 2.
      *   *FIP:* "Positive" means $P$ in both, but $P$ is justified by Logic in context A and by Intuition in context B. The fallacy lies in the incompatibility of the justification conditions, not the semantic reference.

  ### III. Scope and Generality

  Is this peculiar to Modal Ontological Arguments (MOA)?
  **No.** While the MOA provides a stark example due to the high tension between S5 rigor and theological intuition, the **Formal-Intuitive Pivot** extends to any domain where formal tools are applied to pre-theoretic metaphysical concepts.

  *   **Grounding and Truthmaking:** A defender might use formal grounding rules to derive a conclusion, but when those rules imply unwanted ontological commitments, they appeal to the "pre-theoretic notion of dependence" to restrict the rules.
  *   **Mereology:** Formal mereology (e.g., Unrestricted Composition) is often defended as a logical consequence of parthood definitions. When challenged with "strange objects" (e.g., trouts-and-turkeys), defenders often pivot to "our intuitive concept of an object" to dismiss the counter-intuitive consequences without abandoning the formalism.
  *   **Decision Theory:** In Newcomb-like problems, agents sometimes treat utility functions as formal constraints for calculation but intuitive values for justification of the calculation itself.

  The FIP is endemic to **Formalized Metaphysics** where the formal system is not treated as a pure calculus (like mathematics) but as a description of reality (like physics). In pure math, axioms are stipulations; in physics, they are empirical. In formalized metaphysics, the FIP arises when axioms are treated as stipulations for power but empirical/intuitive for safety.

  ### IV. Falsification Conditions

  My identification of this pattern as a distinct dialectical defect (The Formal-Intuitive Pivot) would be incorrect or unnecessary under the following conditions:

  1.  **Successful Explication:** If the defender can demonstrate that the formal closure conditions are *logically equivalent* to the pre-theoretic intuitions (i.e., the formalism is a perfect explication with no remainder), the pivot collapses. If "Positive" is *defined* such that the symmetry objection is formally impossible without violating the definition, then the appeal to intuition is redundant, not oscillating.
      *   *Evidence needed:* A proof that the "Anti-God" construction is formally incoherent within the system *without* appealing to external intuitive filters.

  2.  **Explicit Two-Stage Methodology:** If the defender explicitly states from the outset: "This formal system is a heuristic model of a deeper intuitive truth," then the oscillation is not a pivot but a stated methodology. The FIP charge relies on the *implicit* claim that the formalism is sufficient for the proof.
      *   *Evidence needed:* Textual evidence that the defender consistently frames the argument as "model-based" rather than "proof-based" in the initial presentation.

  3.  **Indistinguishability from Research Program Defense:** If it can be shown that all rigorous metaphysical inquiry *necessarily* involves this oscillation (i.e., intuition guides axiom selection, formalism guides derivation), then FIP is not a fallacy but a feature of the discipline.
      *   *Evidence needed:* A meta-philosophical argument showing that no formal metaphysics can proceed without this bidirectional warrant, rendering the distinction between "formal" and "intuitive" warrants illusory.

  ### V. Point of Likely Error

  The point in my reasoning where I am most likely to have erred is in **over-particularizing a common dialectical tactic.**

  I have classified the **Formal-Intuitive Pivot** as a distinct structural defect. However, it is possible that this is simply the standard operation of **Reflective Equilibrium** applied poorly. In reflective equilibrium, one moves back and forth between principles (formalism) and judgments (intuition) to achieve coherence.

  If the defender is genuinely seeking equilibrium, the shift is not a fallacious pivot but a legitimate dialectical process. My analysis assumes the defender claims *finality* for the formal proof while using intuition only for *defense*. If the defender admits the argument is part of an ongoing equilibrium process, the charge of FIP loses its force, and the phenomenon dissolves into standard **Methodological Coherentism**.

  I may have misidentified a *failed coherentist process* as a *sophistical pivot*. The distinction lies in whether the defender acknowledges the tension as a problem to be solved (Coherentism) or hides the tension to claim victory (FIP). Without access to the specific psychological intent of the defenders in your seminars, there is a risk of attributing sophistry to what might be methodological confusion.

  ### VI. Summary for Graduate Materials

  For your seminar materials, I recommend introducing the **Formal-Intuitive Pivot** as a specific risk in evaluating Gödelian arguments.

  *   **Diagnostic Question:** "When the formalism yields a desired result, is it treated as a logical consequence? When it yields an undesired result, is it treated as a model limitation?"
  *   **Boundary:** If the answer is "Yes" to both, the argument suffers from FIP.
  *   **Remedy:** The defender must choose: either the formalism is sovereign (and must block the Anti-God formally) or the intuition is sovereign (and the formal proof is merely illustrative, not demonstrative). They cannot be sovereign in alternating turns.

  This carving isolates the specific instability in the warrant structure, distinguishing it from mere ambiguity or standard theory defense, and provides a precise tool for critiquing the modal ontological argument's dialectical stability.
