      *   **Overall Assessment:** Where it holds (the *outcome* looks irreversible in all three) vs. where it overreaches (the *mechanism* differs wildly).
      *   **Conclusion:** Advice on the "wrong question" angle. Focus on "availability" vs. "existence."

