      *   **The User's Split:** External vs. Internal/Self-referential.
      *   **The Problem:** Why does the stance work for one and not the other? Usually, Dennett says if the prediction works, the belief is "real enough." The user wants to carve out an exception for self-reports.
      *   **The Consciousness Trap:** Does saying "The LLM believes P" mean "The LLM *feels* like it believes P"? Need to decouple functional belief from phenomenological experience.

