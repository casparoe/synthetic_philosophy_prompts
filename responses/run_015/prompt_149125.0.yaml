prompt: |-
  hey im in this metaphysics seminar and weve been stuck on causation by ommission. my tutor keeps saying any decent theory just needs to cover the gardener not watering the plants, but that feels way too thin. before i read more i want the full spec: what should a theory of omission-causation actually deliver to count as adequate? list the cases it has to handle (the classic ones, but also collective omissions, omissions that prevent other omissions, omissions in fully deterministic setups where nothing is physically missing, and omissions by non-agents like institutions or algorithms), the distinctions it cant collapse (causing vs allowing vs failing-to-prevent, absence vs omission, negative causation vs correlation), results from physics or cognitive science it cant flat-out contradict (e.g. no dedicated absence-detectors?), and flag any pair of desiderata you think are probably impossible together. then tell me which single requirement does the most damage to the usual suspects — the counterfactual-dependence view, the normative account, maybe the interventionist take. table is fine if it helps. im especially wondering whether the theory needs to explain why omissions feel causally weaker, or if thats just a bias we should drop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Metaphysics seminar, stuck on causation by omission.
      *   **Problem:** Tutor says "gardener not watering plants" is the benchmark; user feels this is too thin/simplistic.
      *   **Goal:** A "full spec" of what an adequate theory of omission-causation needs to deliver.
      *   **Specific Requirements:**
          *   List of cases to handle (classic, collective, double omissions, deterministic/physical, non-agent omissions).
          *   Distinctions to preserve (causing vs. allowing, absence vs. omission, negative causation vs. correlation).
          *   Constraints from physics/cognitive science (e.g., absence detectors).
          *   Impossible pairs of desiderata (tensions/trade-offs).
          *   Critique of usual suspects (Counterfactual, Normative, Interventionist) based on the hardest requirement.
          *   Address the "causal weakness" intuition (bias or real?).
          *   Format: Table allowed/helpful.

  2.  **Deconstruct the Philosophical Landscape (Causation by Omission):**
      *   *The Core Problem:* How can *nothing* cause *something*? (The "nothing comes from nothing" intuition vs. moral/legal practice).
      *   *Standard Views:*
          *   Counterfactual Dependence (Lewis): If the gardener *had* watered, plants wouldn't have died. Simple, but leads to profligation (everything that didn't happen caused everything that did).
          *   Normative/Expectation-based (Hart & Honoré, McGrath): Omissions are causal only relative to a duty or norm. Solves profligation, but makes causation normative (many metaphysicians hate this).
          *   Interventionist (Woodward): Manipulability. If intervening to water prevents death, the omission is a cause. Good for science, struggles with non-agent omissions.
          *   Process/Physicalist (Dowe, Armstrong): Omissions aren't real causes; they are "quasi-causes" or explanations. (User wants a theory *of* omission causation, so likely looking for a realist or quasi-realist account that works).

  3.  **Drafting the "Full Spec" (Desiderata):**

      *   *Cases:*
          *   Classic: Gardener/Plants.
          *   Profligation Challenge: The Queen of England not watering the plants (she didn't either, why isn't she the cause?).
          *   Collective: A committee fails to vote; a crowd fails to intervene (bystander effect).
          *   Double Omission (Omission preventing omission): Failing to stop someone from failing to act. (e.g., Security guard sleeps, allowing thief to not be stopped).
          *   Deterministic/Physical: In a closed physical system, if every particle trajectory is fixed, where is the "omission"? (Requires compatibility with physical closure).
          *   Non-Agents: Algorithm fails to flag fraud; Institution fails to regulate.

      *   *Distinctions:*
          *   Causing Death vs. Allowing Death (Doing vs. Refraining).
          *   Absence (ontological category) vs. Omission (agent-relative action/inaction).
          *   Negative Causation (Omission causes Effect) vs. Correlation (Omission and Effect share a common cause).

      *   *Scientific Constraints:*
          *   Physics: Conservation laws (energy/momentum). Omissions transfer no energy. Theory can't claim physical force is transmitted by nothing.
          *   Cognitive Science: Do we have specific neural machinery for "absence"? Or is it inference? (Suggestion: It's largely inferential/predictive coding, not direct detection).

      *   *Impossible Pairs (Tensions):*
          *   *Metaphysical Parsimony vs. Moral Granularity:* If you make omissions real causes, you violate physics (no energy transfer). If you make them non-real, you lose moral distinction.
          *   *Objectivity vs. Context-Dependence:* Causation is usually thought to be mind-independent. Omissions seem heavily dependent on expectations/norms.
          *   *Profligation Avoidance vs. Counterfactual Truth:* To avoid saying "The Queen caused the death," you need norms. To keep causation objective, you need counterfactuals. Hard to have both.

      *   *The "Killer" Requirement:*
          *   Which requirement breaks the standard theories?
          *   *Counterfactual:* Breaks on Profligation (Queen of England).
          *   *Normative:* Breaks on Objectivity (makes causation moral).
          *   *Interventionist:* Breaks on Non-Agent/Structural omissions (who intervenes on an algorithm's 'mind'?).
          *   *Selection:* The **Profligation/Objectivity Tension** is the biggest hammer. Specifically, the requirement to **limit causal candidates without appealing to norms** (if you want objective causation) or **accepting norms without collapsing causation into ethics** (if you want normative causation). Let's pinpoint: *The requirement to distinguish the Gardener from the Queen without relying on moral duty.*

      *   *Causal Weakness:* Is it a bias?
          *   Most literature suggests it's a feature of the *type* of dependence, not a bias. Omissions are "default" states. But psychologically, we weight positive actions heavier. A good theory should explain the *asymmetry* without dismissing it as mere bias.

  4.  **Structuring the Response:**
      *   **Intro:** Acknowledge the tutor's simplification and validate the user's skepticism.
      *   **Section 1: The Specification (Desiderata):** Break down into Cases, Distinctions, Scientific Constraints.
      *   **Section 2: The Tensions (Impossible Pairs):** Highlight the trade-offs.
      *   **Section 3: The "Killer" Constraint:** Identify the specific requirement that hurts the main theories.
      *   **Section 4: The "Weakness" Question:** Address the intuition about causal strength.
      *   **Table:** Summarize the theories vs. constraints.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish "Absence" (ontological) from "Omission" (agential). The user asked for both.
      *   *Correction:* On Physics: Don't say physics *forbids* omission causation, but say it doesn't *recognize* it as energy transfer. The theory must reconcile this (e.g., via high-level abstraction).
      *   *Correction:* On Cognitive Science: Mention predictive processing. We detect prediction errors, not "absences" directly.
      *   *Refining the "Killer":* The "Queen of England" problem is the classic profligation objection. The requirement is **Non-Arbitrary Selection**. A theory must explain why *this* absence matters and *that* one doesn't, without just saying "because I said so" or "because it's illegal."

  6.  **Final Polish:** Check tone (academic but accessible, seminar-ready). Ensure all parts of the prompt are answered. (Check: Collective omissions? Yes. Deterministic setups? Yes. Algorithms? Yes. Impossible pairs? Yes.)

  7.  **Final Output Generation:** (Proceed to generate response based on these thoughts.)
answer: |-
  Your tutor is giving you the "intro to law" version. In metaphysics, the gardener case is the *starting point*, not the finish line. If a theory only solves the gardener, it usually collapses under the weight of **causal profligation** (the idea that everything that *didn't* happen caused everything that *did*).

  Here is the full specification for an adequate theory of omission-causation, broken down by cases, distinctions, scientific constraints, and theoretical trade-offs.

  ### 1. The Case Load (What the Theory Must Handle)

  A robust theory cannot just handle agent-relative failures. It must scale across ontology and complexity.

  | Case Type | The Scenario | The Specific Challenge |
  | :--- | :--- | :--- |
  | **Classic Agent Omission** | Gardener fails to water; plants die. | Must distinguish the gardener from the Queen of England (who also didn't water them). |
  | **Collective Omission** | A committee fails to pass a safety bill; disaster occurs. | How is causal responsibility distributed? Is the "group" the omittor, or the sum of individuals? |
  | **Double Omission** | Security guard sleeps (omission 1), allowing thief to *not* be stopped (omission 2). | Can an omission cause another omission? Does this create infinite regress? |
  | **Deterministic/Physical** | In a closed physical system, particle trajectories are fixed. | If physics is complete, there is no "missing" force. How can *nothing* be a cause in a world of *something*? |
  | **Non-Agent/Structural** | An algorithm fails to flag fraud; a bridge fails to support weight. | No intent or duty exists. Is this an omission or just a state description? |
  | **Preventive Omission** | I fail to prevent you from failing to save the child. | Distinguishing *causing* death vs. *allowing* death vs. *failing to prevent* allowing. |

  ### 2. The Distinctions (What Cannot Be Collapsed)

  If your theory conflates these, it fails to match our best causal reasoning.

  1.  **Absence vs. Omission:**
      *   *Absence:* Ontological category (e.g., "There is no water here").
      *   *Omission:* Action-theoretic category (e.g., "The gardener did not water").
      *   *Requirement:* The theory must explain how an ontological absence becomes an agential omission without reducing one to the other.
  2.  **Causing vs. Allowing:**
      *   Pushing someone into a river (causing) vs. not throwing a rope (allowing/omitting).
      *   *Requirement:* The theory must preserve the moral/ascriptive asymmetry even if the counterfactual dependence is identical.
  3.  **Negative Causation vs. Correlation:**
      *   *Negative Causation:* The lack of rain *caused* the famine.
      *   *Correlation:* The lack of rain and the famine are both effects of a high-pressure system.
      *   *Requirement:* The theory must identify the directional link, not just the covariation of presence and absence.

  ### 3. Scientific Constraints (What It Can't Contradict)

  Metaphysics cannot float free of empirical reality.

  *   **Physics (Conservation Laws):** Physical causation involves the transfer/conservation of energy-momentum. Omissions transfer **zero** energy.
      *   *Constraint:* The theory cannot claim omissions are *physical* causes in the same sense as collisions. It must posit them as **high-level** or **special-science** causes that supervene on physical processes without violating physical closure.
  *   **Cognitive Science (Prediction & Detection):** There is no evidence of dedicated "absence detectors" in the brain. We detect *prediction errors*.
      *   *Constraint:* The theory should align with **predictive processing**. We identify omissions when reality deviates from a model/expectation, not when we sense a "nothingness."
  *   **Computational Theory (Algorithms):** In deterministic code, an "error of omission" is just a branch not taken.
      *   *Constraint:* The theory must handle omissions in systems without consciousness or norms (e.g., a thermostat failing to trigger).

  ### 4. Impossible Pairs (The Trade-Offs)

  This is where seminars get interesting. You likely cannot have all of these simultaneously.

  *   **Objectivity vs. Selectivity:**
      *   *Desideratum A:* Causation is mind-independent (Objective).
      *   *Desideratum B:* Only *some* absences are causes (Selective).
      *   *Conflict:* If causation is purely objective/counterfactual, *every* absence is a cause (The Queen of England caused the plants to die). To be selective, you usually need norms/expectations, which are mind-dependent.
  *   **Metaphysical Parsimony vs. Moral Granularity:**
      *   *Desideratum A:* Don't multiply ontological entities (no "negative facts").
      *   *Desideratum B:* Distinguish killing from letting die.
      *   *Conflict:* If you treat omissions as real causal relata, you bloat ontology. If you treat them as fictions, you struggle to ground moral responsibility.
  *   **Physical Closure vs. Causal Efficacy:**
      *   *Desideratum A:* The physical world is causally closed.
      *   *Desideratum B:* Omissions have real effects.
      *   *Conflict:* If the physical world is closed, the "omission" adds no new physical force. Its efficacy must be explanatory, not productive.

  ### 5. The "Killer" Requirement

  Which single requirement does the most damage to the usual suspects?

  **The Requirement: Non-Arbitrary Selection without Normativity.**
  *(i.e., "Explain why the Gardener is the cause and the Queen is not, without appealing to moral duty or legal obligation.")*

  Here is how it breaks the major theories:

  | Theory | How it Handles Omissions | Why the "Selection" Requirement Breaks It |
  | :--- | :--- | :--- |
  | **Counterfactual Dependence** (Lewis) | If the gardener had watered, plants would live. | **Fails Hard.** The Queen also didn't water. If she *had* watered, plants would live. Counterfactuals are true for both. The theory cannot distinguish gardener from Queen without importing external norms. |
  | **Normative Account** (Hart & Honoré / McGrath) | Omission is causal only if there was a duty to act. | **Collapses Distinctions.** It solves the Queen problem (Queen had no duty), but it makes causation dependent on ethics. If causation requires duty, you can't have causal omissions in physics or biology (e.g., "lack of oxygen caused death" implies oxygen had a *duty* to be present?). |
  | **Interventionist** (Woodward) | X causes Y if intervening on X changes Y. | **Struggles with Non-Agents.** Who intervenes on an algorithm's "omission"? Also, in deterministic systems, "intervening to add water" is physically possible, but "intervening to make the omission not happen" is conceptually murky. It handles the Gardener well, but struggles with the *ontology* of the omission itself. |
  | **Process/Physicalist** (Dowe) | Omissions are not causes; they are "quasi-causes." | **Too Deflationary.** It saves physics but fails the seminar prompt. It says "nothing caused the death," which contradicts legal, medical, and everyday discourse. |

  **Verdict:** The **Counterfactual View** takes the most damage. It is the most popular default, but it is utterly incapable of handling the **Profligation Objection** (The Queen of England) without smuggling in normative assumptions it claims to reject.

  ### 6. The "Causal Weakness" Intuition

  *You asked: Does the theory need to explain why omissions feel causally weaker, or is that a bias?*

  **It is not a bias; it is a feature of dependency.**
  Recent work (e.g., by Hitchcock and Knobe) suggests we should **not** drop this intuition.

  *   **Positive Causation:** Relies on **production**. (Force A transfers energy to B).
  *   **Omissive Causation:** Relies on **counterfactual dependency relative to a default**.
  *   **Why it feels weaker:** Because omissions are **default-relative**. If the default changes, the cause disappears.
      *   *Example:* If I am supposed to feed your fish, my not feeding them causes their death. If I am a stranger walking by, my not feeding them is not a cause. The *physics* of the fish dying is identical in both cases. The *causal status* changes based on the background model.
  *   **Requirement:** An adequate theory must explain this **context-sensitivity** without calling it an illusion. The "weakness" is actually the **stability** of the causal relation. Positive causes are stable across many contexts; omissive causes are fragile (they vanish if the norm/expectation changes).

  ### Summary for your Seminar
  If you want to impress the tutor, argue that the "Gardener" case is too easy because it hides the **Normative/Descriptive Gap**.

  **The Winning Move:** Argue that any theory claiming to be purely descriptive (just physics and counterfactuals) will fail the **Selection Requirement** (The Queen Problem). Any theory that solves Selection by using Norms will fail the **Objectivity Requirement** (making causation moral). Therefore, the best theory is likely a **pluralist** one: Omissions are causal in a *pragmatic/explanatory* sense (Interventionist), but not in a *productive/ontological* sense (Physicalist).

  **One-liner to drop:** "If we treat omissions as ontologically identical to positive events, we violate conservation laws. If we treat them as purely normative, we lose causal realism. We need a theory of **causal explanation** that distinguishes the *relevant* absence from the *infinite* absences without collapsing metaphysics into ethics."
