      *Refining the "Stakes" point:* The prompt asks: "If the honest answer is that the threshold shouldn't move with the stakes, say that."
      *Philosophical honesty:* Truth conditions don't move. Assertability conditions do. I will say: "Truth doesn't care about stakes. Your liability does. So the *evidence required to assert* moves, not the truth."

      *Refining Case 3:* If 4 were "lost," did the agency "ignore" them? Maybe negligence implies ignoring. But critics will pounce. Better to weaken to "failed to address."

      *Refining Case 1:* Cluster risk. If the leaked doc is the only proof for 7 claims, the risk is concentrated. Need external corroboration for the cluster.

