      *   **Task:** Create a usable procedure for a verification team at a nonprofit investigative journalism outfit.
      *   **Context:** 90-140 page reports, 400-600 claims, 10 days, small team (4 people), managing editor (final say, no time), outside counsel (expensive, legal only).
      *   **Core Problem:** Managing epistemic commitment (assert vs. hedge vs. attribute vs. cut) amidst the Lottery Paradox (individual high prob $\neq$ collective truth) and the Preface Paradox (believing all claims + believing some are false).
      *   **Constraints:**
          *   Confidence bands (no numbers).
          *   Thresholds for assertion (stakes-sensitive?).
          *   Shared-source check (correlated claims).
          *   Compound claim rule.
          *   End-of-report passes (Headline + Preface Note).
          *   Stop rules (when to halt).
          *   Hand-off rules (values/risk vs. facts).
          *   Honesty about "judgment wearing a lab coat."
          *   Apply to 3 specific test cases.
          *   Word count: Under ~1200 words.
          *   Tone: Direct, usable, Monday morning ready.

  2.  **Conceptual Work (Brainstorming & Philosophy):**
      *   *Lottery Paradox:* High probability per claim doesn't guarantee the conjunction is true. Solution: Don't treat the report as a logical conjunction of all claims. Treat it as a narrative supported by claims.
      *   *Preface Paradox:* Believing $P_1...P_n$ and believing $\neg(P_1 \land ... \land P_n)$. Solution: Distinguish between *acceptance for assertion* (pragmatic) and *belief* (doxastic). We assert based on sufficient warrant for public commitment, not absolute truth.
      *   *Thresholds:* Contextualism vs. Subject-Sensitive Invariantism. In journalism, stakes *must* matter. A wrong date is a correction; a wrong accusation is a lawsuit. So, the threshold for assertion *must* move with stakes, but we frame it as "evidentiary burden" rather than "truth conditions."
      *   *Correlated Claims:* If Claim A, B, C all rely on Source X, they aren't independent. If Source X is flawed, A, B, C all fail. Treat them as a "claim cluster."
      *   *Compounds:* "A and B" requires more than just accepting A and accepting B if the connection matters. But usually, in reports, claims are atomic. The headline is the main compound.
      *   *Headline:* Needs to survive the "weakest link" test if it's a conjunction. If it's a generalization ("ignored 47 complaints"), it needs to survive the "exception" test.
      *   *Preface Note:* Needs to be humble but not an invitation to sue. "We strive for accuracy" vs. "This contains errors."
      *   *Judgment wearing a lab coat:* Acknowledge that "confidence bands" are heuristic tools, not math.

  3.  **Drafting the Procedure (Iterative refinement for brevity & utility):**
      *   *Bands:* High (Assert), Med (Hedge/Attribute), Low (Cut/Verify More).
      *   *Stakes:* High stakes = High band required. Low stakes = Med band might suffice.
      *   *Clusters:* Group claims by source. If source is shaky, downgrade all.
      *   *Compounds:* Headline is the main compound. Don't conjoin atomic claims in the body unless necessary.
      *   *Headline Pass:* Is it a conjunction? If so, weakest link rules. Is it a summary? Allow minor noise.
      *   *Preface Pass:* Acknowledge complexity, not error.
      *   *Stop/Hand-off:* Legal risk = Counsel. Ethical/Political risk = Editor.

  4.  **Applying to Test Cases:**
      *   (1) Records destroyed (Leaked doc + 6 claims). Cluster risk. High stakes (destruction of evidence). Need corroboration or downgrade.
      *   (2) Official signed off (Named, dishonesty). Very high stakes. "Strong but not airtight" = Med band. Needs High band. Hedge or cut.
      *   (3) Headline (Ignored 47 complaints). 4/47 weak. "Ignored" is the load-bearing word. If 4 were "lost," "ignored" might be too strong. Need to adjust headline or definition.

  5.  **Refining for Word Count & Tone:**
      *   Cut philosophical preamble. Get straight to the protocol.
      *   Ensure the "philosopher" voice is present but practical (e.g., acknowledging the paradoxes without solving them metaphysically, solving them pragmatically).
      *   Check word count constantly. 1200 is tight for all this.
      *   *Self-Correction on Stakes:* The prompt asks if the threshold should move. Epistemologically, truth doesn't change with stakes. Pragmatically, *assertability* does. I need to be clear: the *truth condition* doesn't move, the *warrant for assertion* does.
      *   *Self-Correction on Preface:* Don't say "there are errors." Say "complexity entails limitations."

  6.  **Final Polish:**
      *   Structure: Conceptual Frame -> The Protocol -> The Test Cases.
      *   Make sure the "judgment wearing a lab coat" point is explicit.
      *   Ensure the advice on Case 3 is honest even if they want to keep the headline.

  7.  **Writing - Section by Section (Mental Check):**
      *   *Intro:* Acknowledge the paradoxes. We are managing *assertability*, not truth.
      *   *Bands:* Green (Assert), Yellow (Hedge/Attribute), Red (Cut).
      *   *Stakes:* Green requires higher evidence for high stakes.
      *   *Clusters:* Treat shared-source claims as one unit.
      *   *Compounds:* Headline rule.
      *   *Preface:* Coherence rule.
      *   *Cases:* Apply strictly.

      *Drafting thought:* I need to be careful not to exceed 1200 words. I will combine the conceptual framing into the protocol intro.

      *Drafting thought on Case 3:* They want to keep the headline. If 4/47 were "lost" not "ignored," "ignored" is factually vulnerable. I must tell them to change it or define "ignored" to include "negligently lost." If they can't defend that, they must change the headline. I will advise changing the headline to "failed to act on" or similar.

      *Drafting thought on Preface:* "We expect errors" is bad. "We strive for accuracy in complex systems" is better.

      *Drafting thought on Philosophy:* Explicitly state that the "belief threshold" model is the lab coat part. We are using it as a tool, not a truth.

      *Let's write.*

      *Word Count Check:*
