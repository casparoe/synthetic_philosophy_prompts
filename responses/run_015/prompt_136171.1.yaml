answer: |-
  **Conceptual Frame**
  You are facing the Lottery and Preface paradoxes because you are treating *assertion* like *logical proof*. It isn't. Truth is binary; assertability is pragmatic. You cannot guarantee every claim is true (Lottery), and you cannot logically believe "All claims are true" while admitting "One is false" (Preface).

  **The Fix:** Stop trying to believe the report is infallible. Believe the *process* is robust. Your goal is not truth preservation (impossible) but risk-managed commitment. The "confidence bands" below are heuristic tools, not math. That is judgment wearing a lab coat: it structures intuition, it doesn't replace it.

  **The Verification Protocol**

  **1. Confidence Bands (Per Claim)**
  Do not use numbers. Use traffic lights.
  *   **Green (Assert Flatly):** Direct documentation or multiple independent sources. No credible competing evidence.
  *   **Yellow (Hedge/Attribute):** Single source, potential bias, or minor gaps. Use "according to," "appears to," or "documents suggest."
  *   **Red (Cut/Verify):** Speculation, anonymous single-source on high stakes, or known contradictions.

  **2. The Stakes Rule**
  *Truth conditions do not move with stakes; assertability conditions do.* A wrong date is a correction; a wrong accusation is a lawsuit.
  *   **Low Stakes (Dates, Titles):** Green or Yellow allowed.
  *   **High Stakes (Dishonesty, Illegal Acts, Named Individuals):** Green required. If evidence is Yellow, you must Hedge or Cut. Do not lower the bar; raise the evidence.

  **3. The Cluster Check (Shared Sources)**
  If Claims A, B, and C all rely on Source X, they are not independent. They are one "Claim Cluster."
  *   **Rule:** Assess the cluster's weakest link. If Source X is compromised, all claims downstream turn Red.
  *   **Action:** If a cluster carries high risk, seek one external corroboration for the *source*, not just the claims. If unavailable, downgrade the whole cluster to Yellow.

  **4. Compound Claims**
  *   **Body:** Keep claims atomic. Do not write "A happened and caused B" unless you have evidence for the causation.
  *   **Headline:** The headline is the ultimate compound. It must survive the "Weakest Link" test if it implies conjunction, or the "Preponderance" test if it implies a pattern.

  **5. End-of-Report Passes**
  *   **The Headline Pass:** Identify the load-bearing verb. Is it a conjunction ("X did A and B") or a generalization ("X ignored Y")?
      *   *Conjunction:* If any part is Yellow, weaken the headline.
      *   *Generalization:* If exceptions exist (e.g., 4 of 47), ensure the verb covers the exceptions (e.g., "failed to address" vs. "ignored").
  *   **The Preface Note:** Do not admit error ("There may be mistakes"). That invites litigation. Affirm process ("We strive for accuracy in complex records"). This resolves the Preface Paradox: you stand behind the *warrant*, not the *infallibility*.

  **6. Stop and Hand-Off**
  *   **Stop:** If a claim is Red and cannot be upgraded within 24 hours, cut it. Do not burn days on Red claims.
  *   **Hand-Off:** If the issue is legal risk (libel, national security) or ethical risk (harm to vulnerable sources), hand to Counsel or the Editor. This is not epistemology; it is values.

  ***

  **Test Cases**

  **(1) Regional Office Destroyed Records**
  *   **Analysis:** This is a Claim Cluster (7 claims lean on one leaked doc). High stakes (illegal act).
  *   **Verdict:** **Yellow Cluster.** One leaked document is rarely "Green" for illegal acts without corroboration.
  *   **Action:** You cannot assert flatly yet. Either find one external source to corroborate the *document's authenticity* (not just the content) or hedge the claims ("A leaked document alleges..."). If you assert flatly based solely on a leaked doc you cannot show, you are vulnerable to claims of fabrication.

  **(2) Official Signed Off on Fake Inspection**
  *   **Analysis:** Named individual + allegation of dishonesty. Highest stakes.
  *   **Verdict:** **Yellow Evidence.** "Strong but not airtight" is the definition of Yellow.
  *   **Action:** You cannot assert flatly. The Stakes Rule demands Green for dishonesty. You must either find corroborating testimony/documentation to make it airtight (Green) or hedge ("Records indicate she signed off... though she did not respond to requests for comment"). Do not publish a flat accusation of lying on Yellow evidence.

  **(3) Headline: "Agency Ignored 47 Safety Complaints"**
  *   **Analysis:** Generalization claim. 43/47 are solid Green. 4/47 are "logged then lost."
  *   **Verdict:** **Verb Mismatch.** "Ignored" implies active dismissal. "Lost" implies negligence. Critics will seize on the 4 exceptions to discredit the 43.
  *   **Action:** You cannot keep the headline as written if you want to survive scrutiny. "Ignored" is too specific for the 4 exceptions.
  *   **Revision:** Change to "Agency **Failed to Address** 47 Safety Complaints." This covers both active ignoring and negligent losing. It preserves the narrative weight without lying about the 4 exceptions. If you refuse this change, you are prioritizing narrative punch over epistemic honesty.

  **Final Note**
  This procedure cannot guarantee you won't be sued or corrected. It guarantees that when you are, you were negligent in neither process nor principle. Use it to protect the work, not to justify the wish.
