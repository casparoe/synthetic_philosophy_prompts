  5.  **Drafting - Step-by-Step Writing:**

      *   *Intro:* The regulatory framework treats bioequivalence as a sufficient condition for substitutability, effectively equating "within tolerance of the reference" with "at least as good as."
      *   *Theory:* The practice presupposes an epistemic reading of equivalence. It assumes there is a fact of the matter about therapeutic value, but our measurement (bioavailability) has a margin of error. However, the chaining implies a practical commitment to transitivity. It is underdetermined: it could be that differences are negligible (sorites-style) or that the relation is genuinely non-transitive within the band. But strictly, it requires the *clinical outcome* relation to be transitive, even if the *regulatory proxy* is not.
