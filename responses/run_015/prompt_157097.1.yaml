  *Start:*
  The regulatory practice of generic substitution presupposes a specific, albeit implicit, theory of comparative value that conflates regulatory proxy with clinical outcome. Strictly speaking, the practice does not require the relation "no worse than, within margin" to be logically transitive; rather, it requires that the *clinical value* underpinning the proxy remains stable across the tolerance band. The system operates under an epistemic reading of equivalence: it assumes there is a fact of the matter regarding therapeutic superiority, but that differences within the 80-to-125 percent bioequivalence band are too negligible to detect or matter clinically. However, the chaining of substitutions (Brand → A → B) reveals a practical commitment to transitivity that the regulatory structure does not logically support. The practice is underdetermined between an epistemic view (we cannot tell the difference) and a constitutive view (there is no difference for regulatory purposes). Yet, because the band allows for variance between generics (A could be 80% relative to Brand, B could be 125%), the relation "bioequivalent to" is technically a tolerance relation, which is known to be non-transitive. The practice presupposes that this non-transitivity in the proxy does not bleed into the value relation "at least as good as therapeutically." This is a strong, arguably unsupported, assumption. It gets by with a weaker condition than logical transitivity: it requires only that the accumulation of variance within the band does not cross a clinical threshold of harm or inefficacy.

  *Crux:*
  The central crux is not a logical defect in "better than," but a category error in treating a tolerance relation as an equivalence relation. In standard spectrum arguments, transitivity is threatened by imperceptible differences that accumulate into a perceptible gap. Here, the differences are statistically perceptible but regulatorily dismissed. This makes the case less threatening to the logic of value than the imperceptibility spectrum. In the imperceptible case, one must deny that there is any difference at all between adjacent links to maintain transitivity, leading to paradox. In the bioequivalence case, differences are admitted but bounded. The failure of transitivity here is not a failure of logic but a failure of *risk aggregation*. A defender of transitivity can concede that $A$ is equivalent to $B$ and $B$ to $C$ within a margin, without $A$ being equivalent to $C$, provided "equivalent" is understood as "within tolerance." The logical defect arises only if one insists that "within tolerance" implies "equal in value." The phenomenon is accumulated statistical variance, not a breakdown in the ordering of value. The explicit margin clarifies that we are dealing with a fuzzy set of acceptable products, not a linear order of identical value. Thus, the threat is to the *substitution rule*, not the comparative relation itself.

  *Exceptions:*
  The biosimilar and narrow-therapeutic-index (NTI) departures presuppose that the acceptability of substitution is sensitive to stakes and molecular complexity, not just static equivalence. These exceptions do not admit that therapeutic value is non-transitive; rather, they admit that the *risk of switching* is a distinct value component not captured by static bioequivalence. The requirement for "interchangeability" in biologics implies that the relation "safe to substitute" is not dyadic (Product A, Product B) but triadic or path-dependent (Product A, Product B, Patient History). This suggests that the adicity of "at least as good as" in this context must include a parameter for the history of exposure or the variance of the switch itself. For NTI drugs, the resistance to substitution despite regulatory equivalence indicates that the width of the acceptable margin is indexed to the stakes (the slope of the dose-response curve). This explains the tension without conceding logical non-transitivity: the margin shrinks as the cost of error rises. The practice treats equivalence as a property of a product relative to a reference, but the exceptions reveal that substitutability is a property of a *path*.

  *Reforms:*
  Between the two reforms, the worst-case-reference rule is more defensible. The current-product rule would effectively end routine substitution by requiring pairwise clinical verification for every switch, imposing prohibitive transaction costs for a risk that is statistically low for most drugs. The worst-case-reference rule, requiring new generics to be equivalent to the approved product farthest from the brand, closes the substitutable set under the tolerance relation. This repairs the structural gap that allows drift (Brand → 80% → 125%) without destroying the generic market. On the diagnosis that the problem is risk accumulation rather than logical defect, this reform reduces the risk by tightening the band of the permissible set. It does not repair a logical defect because the logic of the tolerance relation remains non-transitive; it merely ensures that the non-transitivity does not result in clinically significant drift. The cost is a higher barrier to entry for generics, but this is worth paying to align the regulatory proxy with the clinical reality of variance accumulation. The current-product rule is an overcorrection that treats a statistical risk as a logical impossibility.

  *Relativity:*
  Finally, the explicit respect-relativity of the practice helps the defender of transitivity only if the respect chosen captures the relevant value. By locating the tolerance inside "bioequivalence" rather than "therapeutic outcome," the regulator attempts to isolate the non-transitive proxy from the transitive value. However, this merely relocates the problem. If bioequivalence is non-transitive and it is the sole criterion for substitution, then therapeutic outcome is treated as transitive by fiat, not by evidence. The relativity hurts if it obscures the fact that the proxy fails to guarantee the value over chains. It gives the defender of transitivity a verbal out—"they are not therapeutically equivalent, only bioequivalent"—but practically, the substitution occurs as if they were therapeutically equivalent. Therefore, respect-relativity functions as a shield for the regulatory framework rather than a solution to the logical tension. It acknowledges the limitation but proceeds as if the limitation does not matter, which is sustainable only so long as the accumulated variance remains clinically silent.

