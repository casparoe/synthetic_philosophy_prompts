      *   *Check:* Did I distinguish strict requirements from accommodations? Yes.

  7.  **Final Review against the Prompt:**
      *   Presuppose Carnap's distinction? Yes, structurally.
      *   Presuppose non-cognitivism? Yes, explicitly in the labeling.
      *   Consistent with Carnap's planning vision? No, it restricts the democratic will.
      *   Reconstruct commitments? Done.
      *   Distinguish requirements vs. accommodations? Done.
      *   Cognitivist adoption? Possible with modification.

      *(Self-Correction during drafting)*: Make sure to emphasize that Carnap's "External" questions are *practical*, not *irrational*. The planning board treats them as *less rational* (routed to vote, not evaluation). This is a subtle but important deviation. Carnap thought practical decisions were valid, just not *theoretical*. The board seems to imply they are outside "rational evaluation."

      *Refining the "Betrayal" point:* Carnap's worry was authoritarianism. If the matrix is fixed by administrators (experts) and the public only votes on the framework *as defined by the matrix*, the public isn't truly choosing the framework. They are choosing parameters within a technocratic ontology. This is the betrayal.

