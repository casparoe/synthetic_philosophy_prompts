          *   The contradiction lies in the "non-cognitive" label. Remove that, and it works.

  5.  **Refining the Argument (Self-Correction/Deepening):**

      *   *Correction:* I need to be careful not to say Carnap *was* a simple non-cognitivist. He was nuanced. He thought ethical statements were imperatives, not assertions. So they aren't true/false. The planning board calling them "non-cognitive" is actually quite Carnapian.
      *   *Deepening:* The crucial tension is the *translation requirement*. Carnap didn't say all values must be quantified. He said science handles means. If the "matrix" defines the means *and* the measurable ends, it excludes qualitative ends. This is where the "betrayal" happens. The "External" choice should be free, but the "Internal" matrix constrains what can be chosen externally if the external choice must be pre-formatted for the internal machine.
      *   *Key Terminology:* "Bureaucratic Positivism," "Technocratic Enclosure," "Commensurability Assumption."

  6.  **Final Polish:** Ensure the tone is academic, rigorous, and directly addresses the prompt's specific questions. Structure with clear headings. (Proceed to generate output based on these thoughts.)

