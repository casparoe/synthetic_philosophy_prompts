answer: |-
  Your observation is astute and cuts to the heart of how Logical Empiricism migrated from seminar rooms to the administrative state. What you are describing is a form of **bureaucratic positivism**: an institutionalization of the fact/value distinction that operationalizes the Logical Empiricist demarcation criterion into a workflow.

  To answer your specific questions: Yes, the procedure is structurally isomorphic to Carnap's distinction between internal and external questions. Yes, it presupposes a specific meta-ethics (non-cognitivism or radical incommensurability) to justify the exclusion of certain claims from the "rational" stage. However, while it mimics Carnap's *logic*, it likely betrays Carnap's *political vision* by allowing the technical matrix to constrain the democratic will. Finally, a cognitivist institution could adopt the form, but only by radically reinterpreting the epistemic status of the "external" stage.

  Here is a reconstruction of the implicit philosophical commitments, an evaluation of their consistency with Carnap, and an analysis of the procedure's flexibility.

  ### 1. The Structural Isomorphism: Internal vs. External
  The two-stage procedure is a near-perfect administrative mapping of Rudolf Carnap's distinction in *"Empiricism, Semantics, and Ontology"* (1950).

  *   **Stage 2 (The Matrix) as Internal Questions:** Carnap argued that once a linguistic or conceptual framework is adopted, questions within it are "internal." They are answerable by the logical and empirical rules of that framework. In your planning board, once the evaluation matrix is set (costs, risks, zoning), the decision is treated as a technical optimization problem. It is cognitive, truth-apt, and solvable via calculation.
  *   **Stage 1 (The Framework) as External Questions:** Carnap held that the choice of the framework itself is an "external" question. It is not a theoretical claim about reality but a practical decision about which tools to use. It is not "true" or "false," but "expedient" or "inexpedient." The planning board mirrors this by routing untranslatable value claims (the framework choices) to a political vote. They are treated as practical preferences rather than cognitive assertions.

  **The Philosophical Commitment:** The procedure presupposes that **rationality is framework-relative.** There is no "view from nowhere" to adjudicate between the matrix and the watershed argument. Therefore, to avoid infinite regress or metaphysical deadlock, the institution must bifurcate: calculation inside, volition outside.

  ### 2. Meta-Ethical Commitments: Non-Cognitivism vs. Incommensurability
  You ask if the practice presupposes non-cognitivism or if it could rest on incommensurability. The documents you cite explicitly mark untranslatable inputs as **"non-cognitive."** This is a strong meta-ethical commitment.

  *   **The Non-Cognitivist Reading:** This aligns with the classic Logical Empiricist view (Ayer, Stevenson, and Carnap's *Philosophy and Logical Syntax*). Ethical statements are not descriptions of fact; they are expressions of emotion or imperatives. Therefore, they cannot serve as premises in a logical deduction (the matrix). They must be voted on (expressed as will). The procedure strictly requires that value claims lack truth-values to justify their exclusion from the "rational evaluation stage."
  *   **The Incommensurability Reading:** Could this be sustained by a view that values are cognitive but incommensurable? If the watershed has an *objective* intrinsic value that simply cannot be quantified, a cognitivist could argue it belongs in the decision but resists the matrix. However, the procedure **rejects** this. By routing these claims to a separate political vote and marking them non-cognitive, the board asserts that if it cannot be weighed in the matrix, it cannot be part of the *rational* deliberation.
  *   **Strict Requirement:** The procedure strictly requires **Commensurability as a Condition of Rationality.** It does not merely require that values be chosen democratically; it requires that for a value to be processed *technically*, it must be reducible to the common denominator of the matrix (utility, cost, risk).

  ### 3. Consistency with Carnap's Vision of Planning
  Does this faithfully realize Carnap's vision, or betray it? The answer lies in the **direction of constraint.**

  **Carnap's Vision:**
  Carnap was a proponent of "scientific humanism." He believed science (rationality) should be the slave of human ends, not the master.
  1.  **Ends:** Chosen by democratic will (practical/external).
  2.  **Means:** Calculated by science (theoretical/internal).
  3.  **Warning:** Carnap worried about the "authoritarian imposition of frameworks." He insisted that the choice of framework must remain open to pragmatic revision based on human needs.

  **The Planning Board's Reality:**
  The procedure you describe creates a **Technocratic Enclosure**.
  1.  **The Trap:** By requiring all inputs to be *translated* into the matrix to be considered "rational," the board defines the *limits of the conceivable* before the democratic vote occurs. If a resident argues for the "sacredness" of a site, and that cannot be translated into "utility," it is ghettoized as a mere preference.
  2.  **The Betrayal:** In Carnap's view, the "external" choice should be free. Here, the "external" choice is constrained by the ontology of the "internal" matrix. The administrators (who design the matrix) effectively decide which values are admissible for rational consideration. The democratic vote is left only with the residues that the technocrats couldn't quantify.
  3.  **Verdict:** This betrays Carnap. It inverts his hierarchy. Instead of democracy setting the ends for science to serve, the technical requirements of the science (quantifiability) set the limits for what democracy is allowed to value *rationally*. It creates a class of "second-class reasons" (non-cognitive preferences) that are structurally disadvantaged against "first-class reasons" (matrix data).

  ### 4. Distinguishing Requirements from Accommodations
  To determine if the practice is philosophically flexible, we must distinguish what the *procedure* needs versus what the *justification* provides.

  | Feature | Strict Procedural Requirement | Philosophical Accommodation (Current) |
  | :--- | :--- | :--- |
  | **Bifurcation** | Decision-making must be split into *optimization* and *selection*. | Justified via Carnap's Internal/External distinction. |
  | **Translation** | Inputs for optimization must be comparable (commensurable). | Justified via Non-Cognitivism (values aren't truth-apt). |
  | **Exclusion** | Inputs resisting translation must be routed elsewhere. | Justified by labeling them "Non-Cognitive." |
  | **Authority** | The Matrix must be fixed during optimization. | Justified by Administrative Mandate (Expertise). |

  **The Critical Juncture:** The procedure *requires* commensurability for Stage 2. It does *not* strictly require that Stage 1 inputs be "non-cognitive." It only requires that they be **non-operationalizable within the matrix.** The label "non-cognitive" is an accommodation of Logical Empiricist meta-ethics, not a logical necessity of the workflow.

  ### 5. Could a Cognitivist Institution Adopt This Form?
  Yes, a planning institution committed to the **cognitive status of value claims** could adopt this two-stage form without contradiction, but it would require a significant reinterpretation of the protocol's epistemology.

  **The Necessary Modifications:**
  1.  **Re-labeling:** The "external framework preference" cannot be marked "non-cognitive." It must be marked as **"Qualitatively Distinct"** or **"Incommensurable."** The institution must acknowledge that the watershed argument is *true* (or valid), just not *quantifiable*.
  2.  **Re-framing Stage 2:** The matrix cannot be presented as the locus of "Rational Evaluation" *simpliciter*. It must be presented as **"Instrumental Rationality."** The cognitivist institution would admit that the matrix optimizes *efficiency*, not *goodness*.
  3.  **Re-framing Stage 1:** The political vote cannot be a "ghetto" for non-rational preferences. It must be understood as **"Deliberative Judgment."** Here, the incommensurable values are weighed against each other not by calculation, but by phronesis (practical wisdom).

  **The Contradiction to Avoid:**
  The contradiction arises if the institution claims:
  *   (A) Value claims are cognitive (truth-apt).
  *   (B) Only claims processed in the Matrix are subject to rational evaluation.
  *   (C) Value claims resisting the Matrix are routed outside rational evaluation.

  If (A) is true, (B) and (C) imply that some truth-apt claims are immune to rational evaluation, which is incoherent. To resolve this, the cognitivist must expand the definition of "rational evaluation" in Stage 1 to include qualitative deliberation, not just quantitative optimization.

  ### Summary
  The administrative protocol you have identified is a fossilized Logical Empiricism. It presupposes that **rationality equals calculation** and that **values equal preferences**.

  *   **Philosophically:** It relies on Carnap's Internal/External distinction but hardens it into a bureaucratic hierarchy that privileges the "Internal" (technical) over the "External" (political).
  *   **Politically:** It betrays Carnap's democratic sensibilities by allowing the technical matrix to filter the democratic will, rather than serving it.
  *   **Flexibility:** The *form* (separating optimization from selection) is compatible with cognitivism, but only if the institution abandons the claim that the matrix is the sole arbiter of rationality.

  You are witnessing the "afterlife" of Logical Empiricism not as a philosophy, but as a technology of governance. It has survived by shedding Carnap's cautionary notes about metaphysics and democracy, retaining only the tool of demarcation to streamline administration. The "non-cognitive" label is the ghost in the machine, ensuring that anything that slows down the calculation is exiled to the realm of "mere opinion."
