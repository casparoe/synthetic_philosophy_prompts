      *   *The Mugger:* Claims huge power, asks for small sacrifice.
      *   *The Dilemma:* Rationality seems to demand compliance, but intuition screams "no."
      *   *Proposed Solutions:*
          *   Hanson's Leverage Penalty (complexity of claim scales with impact).
          *   Bounded Utility (utility functions have a cap).
          *   Epistemic Defeat (evidence can't support such a claim).
          *   Risk Aversion (not linear utility).

  3.  **Brainstorming the Translation (SRE Vocabulary Mapping):**
      *   *Expected Utility:* Expected Cost / Risk Exposure.
      *   *Utility:* Business Value / User Trust / Revenue / SLO compliance.
