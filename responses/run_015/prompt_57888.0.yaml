      *   *Huge Impact:* Sev1 Outage, Data Loss, Bankruptcy, Global Internet Failure.
      *   *Credence:* Signal-to-noise ratio, alert fidelity.
      *   *Bounded Utility:* Max possible damage (e.g., company value cap).
