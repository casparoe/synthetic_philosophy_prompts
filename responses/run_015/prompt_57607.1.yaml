  ### Pre-commitment Scratchpad

  *   **Candidate 1: The Dying Satellite.** Group A uses data from a decommissioning orbital sensor; Group B uses a new ground array. Both find the exoplanet.
      *   *Reject:* Access to the unique satellite data counts as a private resource advantage, violating the "no private advantage" constraint.
  *   **Candidate 2: The Forbidden Solvent.** Group A uses a chemical solvent being banned for safety; Group B uses a new green alternative. Both synthesize the compound.
      *   *Reject:* The asymmetry relies on regulatory accident (the ban) rather than a structural feature of the field's epistemic norms.
  *   **Candidate 3: The Calibration Standard.** Group A uses a legacy analog instrument (the field's historical baseline); Group B uses a new digital array. Both measure the constant.
      *   *Select:* The asymmetry arises from field norms (new tech requires old calibration, old tech does not require new), not resources or luck.

  ***

  ### The Scenario

  In precision metrology, two labs independently detect a minute drift in the fine-structure constant within the same fiscal year. Group A, the last custodians of the legacy analog interferometer, records the shift using manual calibration methods that are being phased out due to personnel retirement. Group B, a high-throughput quantum sensing team, detects the identical shift using a new digital sensor array now being adopted globally. The field's publication norms stipulate that while legacy analog data constitutes a primary standard requiring no external validation, new digital sensor data must be cross-validated against an analog baseline to be accepted as definitive rather than artifactual. Both groups submit their papers simultaneously; there is no contact between them, and neither knows the other is working on the drift.

  ### Counterfactual Analysis

  **Holding Fixed:** The field's epistemic norms (analog = standard, digital = requires validation), the availability of the technology (analog dying, digital rising), and the competence of the researchers.

  *   **World ~A (No Group A):** Group B publishes their digital detection. Reviewers reject the paper because the new sensors lack cross-validation against the legacy analog standard, which no longer exists (since A is gone and the tech is phased out). The result is classified as "uncalibrated noise." The discovery is delayed by decades until a new analog baseline is constructed and agreed upon.
  *   **World ~B (No Group B):** Group A publishes their analog detection. Reviewers accept it immediately because the legacy interferometer is the primary standard; it requires no validation from digital arrays. The result enters the literature on schedule.

  **The Asymmetry:** The multiplicity is real (both succeeded), but the *robustness* of the discovery path is not. B's path is robust regarding *personnel* (anyone could run the digital sensor) but fragile regarding *validation* (needs A). A's path is fragile regarding *personnel* (only A left) but robust regarding *validation* (is the standard). The inevitabilist slide jams here: the fact that B *could* have done it doesn't mean the result *would* have been accepted if A hadn't.

  ### The Citation Wrinkle

  Suppose that after publication, the field cites and builds almost exclusively on Group B's version. B's digital method is scalable; A's analog method is dead ends with their retirement. Everyone uses B's protocol to measure the constant going forward.

  **Impact on "Who Discovered It":**
  This separates **Credit** from **Stability**.
  *   **Credit:** Goes to B (high uptake, visible utility).
  *   **Content:** Depends on A (without A, the content wasn't "science" yet, just data).
  *   **Uptake:** Depends on B (without B, the fact is known but unusable).
  It matters who discovered it because A provided the *warrant* for the fact, while B provided the *vehicle*. If we only care about the vehicle (uptake), A vanishes. If we care about the fact's stability, A is indispensable. The question shifts from "who was first" to "who made it real vs. who made it useful."

  ### The Single Feature

  **Feature:** **Asymmetric Epistemic Validation.** (New methods require old standards for legitimacy; old standards do not require new methods).

  **Deletion Test:** If I delete this feature (i.e., if digital sensors are self-validating), then in World ~A, Group B's result is accepted immediately. The case collapses into a **symmetric multiple**. The inevitabilist wins: the result was "in the air" because either path yields accepted knowledge. The asymmetry—and the contingency—vanishes.

  ### The Inevitabilist's Best Attack

  **Attack:** "You are conflating *discovery* with *consensus*. Group B detected the phenomenon. The physical reality was captured. That the sociological process of certification was delayed in World ~A is a matter of bureaucratic inertia, not scientific inevitability. The *signal* was inevitable; the *paperwork* is contingent. Science converges on the signal."

  **Assessment:** The attack lands partially, but only if you accept a realist definition of science as "contact with nature" rather than "production of certified knowledge." If science is the public, actionable corpus (as Mertonians argue), then uncertified data is not science. However, the inevitabilist can rightly press that the *capacity* to detect was inevitable (B had the sensors), even if the *acceptance* was contingent. The case successfully blocks the slide from "Multiple" to "Inevitable Acceptance," but it cannot fully block "Multiple" to "Inevitable Detection." It forces the seminar to decide whether "science" is the finding or the fact.
