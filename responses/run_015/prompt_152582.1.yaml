  Here is the mapping: I'm letting the first pair of stanzas treat LIFE and DEED as heroic archetypes, only to let PEAK and ROOT curdle into obstruction and myth by stanza two. The middle pair shifts to the antiquarian's piety where ROOT and DEED are sacred, until JUDGE and FORGET become impossible under the weight of preservation. The final pair enacts the critical violence where ROOT must be cut to save LIFE, acknowledging the fantasy that we can ever truly FORGET. The tornada holds the name without the glory, ending on a horizon line where judgment dissolves into pure forgetting.

  To serve the higher LIFE, we summon ghosts,
  Ignoring how the soil hides every DEED.
  We climb toward a visible PEAK,
  And tear the heavy anchor from the ROOT,
  So giants may JUDGE our small attempts,
  And teach the weak how to FORGET.

  It is a mercy to FORGET the cost,
  When myth sustains the pulse of LIFE.
  Let marble eyes JUDGE flesh and blood,
  So every minor DEED seems holy,
  Until the tree denies its ROOT,
  And blocks the light from every PEAK.

  Look back; the only PEAK is past,
  We cannot bear to FORGET the dust.
  Reverence grows around the ROOT,
  Where ancestors secured our LIFE.
  Preserve the smallest ancestral DEED,
  And let no stranger JUDGE the house.

  No living voice dares JUDGE the dead,
  Though shadows swallow every PEAK.
  A mummy's hand cannot perform a DEED,
  Yet memory refuses to FORGET.
  This piety suffocates the LIFE,
  Until the fruit rots on the ROOT.

  Set the knife against the poisoned ROOT,
  And learn to JUDGE without mercy.
  Only destruction serves the LIFE,
  When history blocks the way to PEAK.
  We must have strength to FORGET,
  Or else we cannot act a DEED.

  But who invents the first DEED?
  We cannot sever every ROOT.
  To claim we FORGET is a lie,
  When past sins JUDGE the present hour.
  There is no solitary PEAK,
  Only this burden called LIFE.

  Keep the name, strip the LIFE, mute the DEED,
  A shadow under the PEAK, severed from ROOT,
  Let the stone JUDGE as we turn to FORGET.
