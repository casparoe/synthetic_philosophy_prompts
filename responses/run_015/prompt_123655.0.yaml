      Subject: Summer grant proposal draft - genocide/narrative stuff

      Hey [Advisor Name],

      Here's the breakdown for the 3-month summer grant application. I know it needs some tightening but wanted to get the core argument down while its fresh.

      **Project Title:** The Narrative Condition of Genocide Recognition

      **The Precise Question:**
      Is there a distinct narrative-institutional condition for recognizing genocide, separate from both the legal criteria (intent/scale) and pure political suppression (state interests)? Basically, does the victim group need a certain level of institutional capacity to narrate their own history before the atrocity can even be *named* as genocide in the legal-political sphere?

      **Why Existing Answers Leave This Open:**
      Right now the literature is stuck in a binary. Legal scholars focus on intent and physical scale (did they mean to kill, how many died). Political theorists focus on power dynamics (why states refuse to label it). Neither side asks whether the victims own narrative capacity is a hidden prerequisite. If the archives, record-keeping, or linguistic institutions are destroyed, the group literally cant produce the coherent historical account required to trigger the legal definition, regardless of intent. That gap is what im targeting.

      **Approach:**
      1. **Conceptual Reconstruction:** Recover Lemkin's original framework which included destroying culture/language/institutions, not just physical killing. Show how the legal definition narrowed this.
      2. **Conceptual Lens on Cases:** Use this reconstructed framework to look at two contrasting historical cases. Important: this isnt empirical history or archival research. I'm using the cases just to test the conceptual logic.
      3. **Differentiation:** Show how this angle explains recognition failures that pure political analysis misses.

      **What Success Looks Like:**
      A typology that distinguishes between *political suppression* (someone is stopping the name) and *narrative incapacity* (the tools to name it were destroyed). I need criteria for telling them apart.
      **Failure Condition:** If the distinction collapses—i.e., if narrative incapacity turns out to be just another form of political suppression—then the project fails. I need to prove they are conceptually distinct mechanisms.

      **Scope Assessment (3 Months):**
      This could easily balloon into real archival work or deep historical analysis. To stay disciplined, I'm limiting this to conceptual work only. I'll use secondary literature for the cases, not primary sources. The goal is the philosophical framework, not the history itself. If i start digging into archives i wont finish.

      Let me know if this tracks or if im missing something obvious on the political theory side.

