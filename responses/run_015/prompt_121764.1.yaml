answer: |-
  # SEMINAR Q&A PREP SHEET
  **Topic:** Automated Moderation as Institutional Performative Utterance
  **Audience:** Analytic Phil Language/Law (Speech Act Theory Focus)
  **Date:** Next Thursday

  ## STRATEGIC OPENING CONCESSION
  **Action:** In your first 5 minutes, explicitly concede that **the algorithm itself lacks mental states and cannot be the "speaker."**
  **Phrasing:** "I am not arguing that the classifier possesses intentionality. The illocutionary agent is the *institution* deploying the classifier. The code functions as the locutionary vehicle within a recognized status function. By locating the intentionality in the collective acceptance of the institutional procedure rather than the computational weights, we avoid the category mistake of anthropomorphizing the machine."
  **Why:** This pre-empts the "robots aren't people" objection from hardening into a dismissal of the entire framework. It forces them to attack your *institutional* account, which is stronger ground for you.

  ---

  ## TOP 6 OBJECTIONS (Ordered by Damage & Likelihood)

  ### 1. The Illocution/Perlocution Boundary (The Causal Mechanism Objection)
  **Objection:** "You claim the removal is an illocutionary act (exercitive). But Austin distinguishes illocution (doing something *in* saying) from perlocution (effects caused *by* saying). If the classifier triggers a deletion via a causal chain of code execution without an interpreter grasping a meaning, isn't this merely a perlocutionary effect? You seem to be conflating the *causal power* to delete with the *normative power* to ban."
  **Reply:** "The distinction turns on whether the output is recognized as counting as a decision within the institutional framework. When a judge signs a warrant, the physical ink causes the arrest, but we call it an illocution because the signature counts as a verdict within the legal system. Similarly, the classifier's output is not a brute cause like a storm knocking down a tree; it is a move within a rule-governed game. The 'deletion' is the uptake of the verdict. If it were merely perlocutionary, the user would view it as a glitch or force majeure. Because they view it as a *ruling* (appealable, rule-referencing), it carries illocutionary force."
  **Weakest Point:** You are relying heavily on the *user's interpretation* (uptake) to do the heavy lifting for illocutionary force. If the user doesn't know *why* it was removed (opacity), can there be genuine uptake? You risk reducing illocution to "perlocution that looks like illocution."

  ### 2. The Intentionality Condition (Searle's Constraint)
  **Objection:** "Searle is explicit: status functions require collective intentionality ('X counts as Y'). While you concede the machine lacks intent, does the *institution* have the specific intention required for *this* utterance? If the model operates on latent features unknown to the designers, can the institution intend the specific content of the verdict? You may have severed the link between institutional intention and specific illocutionary act."
  **Reply:** "We must distinguish between *prior* intention and *institutional* intention. In bureaucratic speech acts, the specific mental state of the clerk is less relevant than their standing within the procedure. The institution's intention is encoded in the *rules of the procedure*, not the mental state of the operator at time *t*. The classifier is a delegated status function. As long as the deployment of the classifier was an intentional act of the institution to constitute a normative procedure, the specific outputs inherit that intentionality by virtue of the status function, much like an automated traffic ticket."
  **Weakest Point:** The analogy to traffic tickets is risky. A ticket implies a human reviewed the evidence. A classifier creates the "evidence" itself. You are stretching the definition of "delegated status function" to cover non-interpretable processes.

  ### 3. Verdictive Accuracy vs. Felicity
  **Objection:** "You argue we should stop evaluating classifiers on accuracy (false positives) and start evaluating felicity. But Austin's *verdictives* involve an assessment of fact. If a judge verdicts 'Guilty' when the defendant was objectively elsewhere, the verdict is infelicitous *because* it misfires on the facts. By decoupling felicity from correspondence to harm-facts, aren't you changing the definition of a verdictive to something that is no longer a verdictive?"
  **Reply:** "I am not decoupling felicity from facts, but recasting *which* facts matter. For an institutional verdictive, the relevant 'fact' is not the brute harm, but the *institutional classification* of the content. The felicity condition is: 'Was this content classified according to the authorized procedure?' If the procedure is followed, the act is felicitous, even if the brute fact of harm is debatable. This is true of human moderation too: a moderator can follow protocol and still be 'wrong' about the harm, but the act of removal remains a valid exercitive."
  **Weakest Point:** This sounds like you are defining away the problem. If a verdictive doesn't aim at truth/facts in *any* sense, it collapses into a pure exercitive (command). You risk losing the "verdictive" part of your thesis entirely.

  ### 4. Normative Status vs. Brute Force
  **Objection:** "You claim these acts 'constitute the normative status' of the speech. But platforms only have *brute* power (access control), not *deontic* power. When Twitter removes a post, they don't make it *obligatory* that you not have said it; they just make it *impossible* for others to see it. You are conflating physical prevention with normative prohibition."
  **Reply:** "Within the platform's normative order, the removal *does* change the deontic status. The content moves from 'permitted' to 'prohibited.' The brute force is the *sanction* for the normative change. In legal systems, imprisonment is brute force, but it enforces a normative status. The platform constitutes a private normative order where 'visibility' is a right. Removing it withdraws that right, altering the user's deontic standing within that jurisdiction, regardless of the brute mechanics of deletion."
  **Weakest Point:** This relies on the audience accepting the platform as a genuine "normative order" rather than a "terms of service contract." If they view ToS as purely contractual (brute agreements) rather than constitutional (normative), your claim to deontic power weakens.

  ### 5. Speaker Identity & Collective Intentionality
  **Objection:** "If the institution is the speaker, who is the audience? And how is collective intentionality maintained when the 'rules' (weights) are opaque even to the institution? If the engineers don't know why the classifier spoke, in what sense did the *institution* speak? This looks like a case of the institution losing control of its own illocutionary acts."
  **Reply:** "The audience is the user community that recognizes the platform's authority. Regarding opacity: Collective intentionality does not require full transparency of mechanism, only acceptance of the *status function*. We accept the verdict of a jury without knowing the neural processes of the jurors. We accept the classifier's output because we accept the institution's authority to deploy it. The 'meaning' is fixed by the public rules of the platform, not the private weights of the model."
  **Weakest Point:** The jury analogy fails because jurors are capable of reason-giving. Classifiers are not. If the institution cannot *explain* the act, can it truly stand behind it as a speech act? This touches on the "reason-giving" requirement of legitimate authority.

  ### 6. Uptake and Recognition
  **Objection:** "Austin insists on uptake. If a user receives a removal notice but views it as 'censorship' or 'glitch' rather than a legitimate verdict, has the illocutionary act succeeded? Given the widespread distrust of platforms, isn't uptake systematically failing, rendering these acts infelicitous en masse?"
  **Reply:** "Uptake requires recognition of the *act type*, not agreement with the *proposition*. If the user appeals the decision, they have demonstrated uptake: they recognize it as a ruling to be contested, not a storm to be weathered. Widespread distrust might make the act *unjust*, but not *infelicitous*. The act succeeds as an exercitive even if the audience rejects the authority, provided they recognize the attempt to exercise it."
  **Weakest Point:** This is a thin notion of uptake. If the audience rejects the authority, the *normative* force is hollow. You are defending the *existence* of the act at the cost of its *legitimacy*, which might undermine your claim that it successfully constitutes normative status.

  ---

  ## THE DREADED OBJECTION (Hope they don't ask)
  **Objection:** "You argue that we should shift evaluation from accuracy to standing and felicity. But if the act is a *verdictive*, it claims to represent a state of affairs (harm). If the mechanism is structurally incapable of tracking that state of affairs (due to bias or opacity), isn't the act inherently *abused* or *hollow*? You are asking us to treat a causal correlation as a normative judgment. Doesn't this legitimize arbitrary power by dressing it in speech-act clothing?"

  **Why it is damaging:** It attacks the moral core of your thesis. It suggests your philosophical reframing is an apology for unaccountable power. It argues that without the *capacity* for truth-tracking, the label "verdictive" is not just inaccurate but ethically dangerous.

  **Handling Strategy:**
  1.  **Do not defend the classifiers.** Concede that many current systems are *abuses* of the speech-act form.
  2.  **Pivot to Normative Leverage:** "Precisely. By treating them as mere causal errors, we allow platforms to say 'our math was wrong.' By treating them as *infelicitous speech acts*, we demand they justify their *standing* and *procedure*. My thesis is not that current moderation is good, but that analyzing it as speech acts gives us the vocabulary to condemn it *normatively* rather than just *technically*. It forces them into the space of reasons."

  ---

  ## FINAL REMINDER ON TONE
  *   **Avoid:** Sociological descriptions ("platforms do this..."), ethical pleas ("this is unfair..."), or technical defenses of AI ("the model is accurate enough...").
  *   **Embrace:** Conceptual distinctions ("The deontic power resides in..."), Austinian taxonomy ("This is an exercitive because..."), and Institutional Facts ("The status function assigns...").
  *   **Goal:** Show that your framework offers *more philosophical rigor* than the standard "error-rate" model, not just more policy relevance.
