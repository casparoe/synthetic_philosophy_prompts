      *   *Re-evaluating Objection 1:* The "Intentionality" objection is the most obvious. I need to make sure the reply doesn't just say "institutions have intentions." I need to lean on *institutional* agency.
      *   *Re-evaluating Objection 2:* The Illocution/Perlocution distinction is crucial. If the algorithm is just a causal trigger, it's perlocutionary.
      *   *Re-evaluating Objection 3:* Standing.
      *   *Re-evaluating Objection 4:* The definition of Verdictive.
      *   *Re-evaluating Objection 5:* The "Normative" claim.
      *   *Re-evaluating Objection 6:* *Uptake*. Austin insists on uptake. If the user thinks it's a glitch, is it a speech act?

      *   *The "Dreaded Objection":* What kills the thesis? If the thesis relies on the *institution* having the intention, but the *algorithm* operates outside the institution's specific intentional scope (the "Alignment Problem" framed philosophically). Or, more sharply: If the act is *exercitive*, it creates obligations. But platforms only have *physical* control, not *normative* control. They can delete, but they can't make it *wrong* for you to have said it, only impossible. This attacks the "constitutes normative status" claim.

