          *   Strategic concession for opening remarks.

  2.  **Deconstruct the Thesis & Audience Sensitivities:**
      *   *Thesis Core:* Algorithmic output = Speech Act (Verdictive/Exercitive).
      *   *Audience Skepticism:* Algorithms lack intentionality. Speech acts require intentionality (Austin/Searle standard view). Extending "speech act" to code might be a category mistake.
      *   *Key Distinctions:* Illocution (doing something in saying) vs. Perlocution (effects caused by saying). Institutional Facts (Searle: X counts as Y in context C). Standing/Authority.
      *   *Risk:* The user might be conflating the *effect* of the code (perlocution) with the *act* of the code (illocution). Or, they might be attributing agency to the machine rather than the institution deploying it.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* Intentionality. Machines don't have intentions. Speech acts require intentions.
