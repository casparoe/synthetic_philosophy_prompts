      *   *Objection 5: Normative Power.* Does the platform *have* the power to change normative status, or just physical access?
          *   *Refinement:* Distinguish between deontic power (rights/obligations) and brute force (deletion).
          *   *Damage:* Medium. Likelihood: Medium.

      *   *Objection 6: The "As-If" Intentionality.* Maybe it's just metaphorical.
          *   *Refinement:* Are we engaging in a category mistake by calling it a speech act rather than a causal mechanism with speech-act *effects*?
          *   *Damage:* Low-Medium. Likelihood: Low (covered by 1 & 2). Let's swap this for something about *Uptake*.
          *   *New Objection 6:* Uptake. Austin requires uptake. Does the user understand the act?
          *   *Damage:* Medium. Likelihood: Medium.

      *   *Selection & Ordering:*
          1.  Intentionality (The Searle/Austin block).
          2.  Illocution vs. Perlocution (The Causal Mechanism).
          3.  Speaker Identity/Collective Intentionality (Who speaks?).
          4.  Verdictive Nature (Truth/Fact sensitivity).
          5.  Deontic vs. Brute Power (Removal vs. Banning).
