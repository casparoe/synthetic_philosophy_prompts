answer: |-
  There is no established canonical term for this exact configuration, though it intersects with literature on immunization strategies; the most precise label is **Hermeneutical Domestication**.

  This phenomenon is distinct from the standard taxonomy of epistemic dysfunction. Unlike an **epistemic bubble**, the community is not insulated; exposure to outside sources is high. Unlike an **echo chamber**, the community does not discredit outsiders; trust in the source remains intact while the content is neutralized. It differs from **hermeneutical injustice** (Fricker) because the problem is not a lack of shared interpretive resources, but an excess of rigid home-grown resources that absorb foreign claims without residue. It is not **conceptual incommensurability** (Kuhn/Feyerabend) because translation succeeds perfectly—the problem is that the translation is *too* successful, stripping the claim of its critical force. Finally, it is distinct from individual **motivated reasoning** because the mechanism is a public, communal norm of charity rather than a private cognitive bias.

  Whether this is a vice depends on whether the norm is applied symmetrically and whether the framework allows for *untranslatable* anomalies. It is not merely "having a framework," because a healthy framework must permit some evidence to land as evidence against core commitments. If the charity norm is structured such that any claim resisting domestication is categorized as "not yet a criticism" rather than "a challenge to the vocabulary," the community has turned a virtue (charity) into a structural immunization strategy. This becomes a vice when the norm prevents belief revision by ensuring that all uptake is assimilative. The vice lies in the **unidirectionality** of the charity: outside claims are translated into home terms, but home terms are never revised to accommodate outside concepts.

  **Boundary Cases:**

  *   **Clearly Fine (Clarification):** A junior scholar objects to a theory using imprecise terminology. The senior group restates the objection using standard technical vocabulary, revealing the objection was based on a misunderstanding of definitions. The objection dissolves because the critic was genuinely confused, not because the framework is immune. Here, the translation reveals truth, not immunity.
  *   **Clearly Vicious (Immunization):** The online community you described where objections must be cashed out as expected values. Moral or phenomenological critiques that cannot be quantified are not treated as challenges to the quantification norm itself, but as "incomplete" criticisms. The framework dictates the form of evidence so strictly that no evidence against the framework can be formulated. This is Hermeneutical Domestication functioning as dogma.
  *   **Hard Case (Paradigm Transition):** In the early stages of a scientific revolution (e.g., early quantum mechanics), proponents of the new theory must often translate their claims into the vocabulary of the old theory to be heard. Initially, this looks like domestication (the old guard hears only what fits classical physics). However, if the new claims eventually force the old vocabulary to break, the initial translation was a necessary bridge; if the old guard never lets the vocabulary break, it becomes vicious. The line is drawn at whether the home vocabulary is permitted to fracture under the strain of the translation.
