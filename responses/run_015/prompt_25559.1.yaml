prompt: |-
  I am a machine learning researcher with a solid working knowledge of supervised learning, generalization, overfitting, the bias–variance trade-off, case-based reasoning, and the distinction between model-based and instance-based learning. I have no formal training in philosophy. I would like you to take the debate in moral philosophy between moral particularism and moral generalism and restate it, as faithfully as you can, using the vocabulary of machine learning.

  Specifically:

  (1) For each position, give me the translation. What is the particularist saying, in ML terms, about how moral judgment works — about the relationship between cases, features, principles, and verdicts? What is the generalist saying? Use concepts like training data, feature extraction, generalization, rule learning, overfitting, the role of explicit principles as opposed to similarity-based reasoning, and anything else in the ML toolkit that maps naturally onto the philosophical claims.

  (2) Then give me the residue report. Which claims in the philosophical debate translate cleanly into ML concepts, which ones you had to distort or stretch to make them fit, and which ones have no counterpart at all in the vocabulary I have given you? For each item of residue, tell me whether the failure of translation points to a limitation in my ML vocabulary — something the philosophers are tracking that my framework genuinely cannot express — or whether it points to something less than fully clear in the philosophical debate itself.

  I am not looking for an introduction to the debate pitched at a beginner. Assume I need the translation to be precise enough that I could explain it back to a philosopher without embarrassment. The residue report is the part I care about most: I want to know whether my instinct that this is "just" a bias–variance trade-off discussion is right, or whether I am flattening something important.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Machine Learning (ML) researcher (solid knowledge of supervised learning, generalization, overfitting, bias-variance, case-based reasoning, model-based vs. instance-based). No formal philosophy training.
      *   **Task:** Translate the moral philosophy debate between *Moral Particularism* and *Moral Generalism* into ML vocabulary.
      *   **Requirements:**
          1.  **Translation:** Define both positions using ML concepts (training data, features, principles, generalization, overfitting, rule learning, similarity-based reasoning, etc.). Must be precise enough to explain back to a philosopher.
          2.  **Residue Report:** Analyze the translation fidelity. What maps cleanly? What stretches? What has no counterpart? Does the failure indicate a limitation in ML vocabulary or vagueness in philosophy?
          3.  **Specific Goal:** Address the user's instinct: Is this "just" a bias-variance trade-off discussion, or is something important being flattened?
      *   **Tone:** Professional, precise, respectful of both fields, avoiding beginner explanations.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Moral Generalism:** Moral judgments are grounded in general principles (rules). If an act is wrong, it's wrong *because* it falls under a principle (e.g., "Lying is wrong"). Principles have invariant valence (a feature is always right-making or wrong-making).
      *   **Moral Particularism:** Moral judgments are context-sensitive. There are no exceptionless principles. A feature (e.g., lying) can be wrong in one context and right in another (holism of reasons). Judgment relies on perceiving the specific details of the case, often via analogy or perception rather than subsumption under a rule.
      *   **Key Concept:** *Holism of Reasons* (Particularism) vs. *Atomism/Invariant Valence* (Generalism).

  3.  **Drafting the Translation (ML Vocabulary):**

      *   *Generalism:* This looks like **Rule-Based Learning** or **Parametric Modeling**.
          *   Input: Features of a situation ($X$).
          *   Output: Moral Verdict ($Y$).
          *   Mechanism: Learn a function $f(X) \rightarrow Y$ where $f$ is composed of explicit, interpretable rules (principles).
          *   Assumption: Feature importance weights are stable across the input space. (e.g., "Lying" has a negative weight everywhere).
          *   Risk: High Bias. Might underfit the complexity of moral reality.
          *   Analogy: Decision Trees with fixed splits, Linear Models with fixed coefficients.

      *   *Particularism:* This looks like **Instance-Based Learning (k-NN)** or **Deep Learning (High Capacity, Non-Linear)** without interpretability.
          *   Input: High-dimensional representation of the specific case.
          *   Output: Moral Verdict ($Y$).
          *   Mechanism: No explicit global rules. Judgment is based on similarity to prior cases (training data) or a highly non-linear function where feature interactions dominate.
          *   Assumption: Feature valence is context-dependent (holism). The interaction term matters more than the main effect.
          *   Risk: High Variance. Might overfit to noise in the training cases.
          *   Analogy: k-Nearest Neighbors, Kernel Methods, or Deep Nets where individual neurons don't map to semantic concepts.

      *   *The Bias-Variance Instinct:* The user suspects this is just a bias-variance trade-off.
          *   Generalism = High Bias, Low Variance (Simple model, robust but maybe inaccurate).
          *   Particularism = Low Bias, High Variance (Complex model, accurate on training/nearby data but risks instability).
          *   *Critique:* This is a strong mapping, but is it *complete*? Philosophy cares about *normativity* (why we *should* act), not just *prediction* (what we *do* judge). ML is descriptive/predictive; Ethics is often prescriptive.

  4.  **Drafting the Residue Report (The Critical Analysis):**

      *   *Clean Translations:*
          *   Principles $\approx$ Global Rules/Parameters.
          *   Case-sensitivity $\approx$ Local weighting/Non-linearity.
          *   Holism $\approx$ Feature Interactions (XOR-like problems).
          *   Generalization $\approx$ Applying past judgments to new cases.

      *   *Stretched/Problematic Translations:*
          *   *Normativity:* ML optimizes a loss function. Morality optimizes... "The Good"? But who defines the loss? In ML, ground truth is given. In Ethics, ground truth is contested.
          *   *Training Data:* Where does moral training data come from? Intuitions? Divine command? Social consensus? ML assumes i.i.d. data; moral cases are often distributional shifts.
          *   *Valence:* In ML, a feature has a weight. In Particularism, a feature can flip signs. This maps to high-order interactions, but Particularists claim it's not just complex rules, it's the *absence* of codifiable rules.
          *   *The "Why":* Generalists want principles for *guidance* (actionability). Particularists want accuracy to *reality* (truth). ML cares about test loss, not necessarily "actionability" of the weights.

      *   *The "Flattening" Question:* Is it *just* bias-variance?
          *   No. It's also about **Interpretability vs. Performance**. Generalists want *explainable AI* (XAI). Particularists are okay with a "black box" if it captures the nuance.
          *   It's about **Metaphysics of Features**. Does "Lying" exist as a stable feature vector component? Or is it emergent?
          *   It's about **Normative Force**. A model predicts; a principle *binds*.

  5.  **Refining the Output (Self-Correction/Polishing):**
      *   *Check:* Did I use the user's vocabulary? Yes (generalization, overfitting, instance-based, etc.).
      *   *Check:* Is the tone right? Needs to be peer-to-peer researcher, not lecturer.
