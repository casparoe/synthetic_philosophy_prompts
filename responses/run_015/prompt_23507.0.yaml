answer: |-
  Here are ten substantive questions designed to test the epistemicist framework, tailored for a PhD-level colloquium. They cover the specific topics you requested, along with follow-up prompts to help you press the point if the speaker's response is too defensive or standard.

  ### 1. The "Absurdity" Objection
  **Question:** A common intuition against epistemicism is that sharp cutoffs in sorites series are not just unknown, but metaphysically or conceptually absurd. You suggest epistemicism renders this objection harmless rather than answering it directly. Could you clarify the dialectical status of that intuition? If the intuition of absurdity is a robust deliverance of our semantic competence, why should we treat it as a cognitive illusion rather than evidence that the theory is false?

  **Follow-up:** *If the speaker replies that intuitions are unreliable guides to metaphysical reality:* "But if our semantic intuitions fail us here, on what basis do we trust our intuitions about reference or truth conditions elsewhere? Is there a non-question-begging way to distinguish the 'bad' intuitions about vagueness from the 'good' intuitions we use to build the theory?"

  ### 2. The Margin-for-Error Principle
  **Question:** You rely on a margin-for-error principle to explain why the cutoff is unknowable. However, critics argue that if the cutoff is determined by linguistic usage, and usage is in principle observable, the margin-for-error makes the cutoff unknowable *in principle*, not just in practice. Does your view entail that the meaning of our terms outstrips all possible evidence from usage, and if so, doesn't that collapse the distinction between epistemic indeterminacy and a form of semantic realism we have no grip on?

  **Follow-up:** *If the speaker replies that knowledge requires safety, not just evidence:* "But safety is a condition on knowledge, not truth. If the truth is fixed by usage, and usage is finite, why can't an ideal observer know the boundary? Are you positing a fact that exceeds the totality of facts about use?"

  ### 3. Higher-Order Vagueness
  **Question:** Supervaluationists argue that epistemicism doesn't solve higher-order vagueness but merely relocates it. If there is a sharp boundary between the 'definitely Fs' and the 'borderline Fs,' don't you face a new sorites paradox at that higher level? Does epistemicism require us to accept sharp boundaries at every order of vagueness, and if so, does this not multiply the 'absurdities' rather than resolve them?

  **Follow-up:** *If the speaker replies that higher-order boundaries are also sharp but unknowable:* "If we are ignorant of the first boundary, and ignorant of the boundary of that boundary, doesn't the concept of 'definiteness' lose its explanatory power? What work is the 'definitely' operator doing if its extension is just as obscure as the original predicate?"

  ### 4. Comparison with Supervaluationism (Truth Values)
  **Question:** A key advantage you claim over supervaluationism is the preservation of bivalence. For the supervaluationist, a borderline sentence is neither true nor false (or lacks a super-truth value). For you, it is one or the other. But if all linguistic criteria and usage patterns are neutral regarding a borderline case, what *makes* the proposition true rather than false? Is there a truthmaker here, and if so, is it not causally and epistemically isolated from the very language users who constitute the meaning?

  **Follow-up:** *If the speaker replies that truth is not epistemically constrained:* "If truth is completely decoupled from our capacity to recognize it, even in principle, in what sense is this a theory of *linguistic* meaning rather than a metaphysical posit grafted onto language?"

  ### 5. Practical Consequences (Law and Ethics)
  **Question:** In contexts like law or ethics, sharp cutoffs often generate outcomes that feel arbitrarily unjust (e.g., liability turning on a single millisecond or grain). If epistemicism is true, there is a fact of the matter about whether the agent crossed the line. How does your view accommodate the normative intuition that such sharp distinctions are *inappropriate* for governing conduct, rather than just unknowable? Does epistemicism imply that the law is always already precise, even when we draft it to be vague?

  **Follow-up:** *If the speaker replies that the law stipulates precisifications:* "But if the law relies on ordinary vague terms without stipulation, and epistemicism is true, then there is a fact of the matter we cannot know. How can a judge rule justly based on a fact that is essentially inaccessible to the court?"

  ### 6. Falsifiability and Evidence
  **Question:** Many critics charge that epistemicism is insulated from counter-evidence, as any argument against sharp boundaries is dismissed as a failure to distinguish semantics from epistemology. Putting aside the internal problems of supervaluationism, what would count as positive evidence *against* epistemicism? Is there a conceivable linguistic phenomenon or empirical discovery about language use that would force you to abandon the view?

  **Follow-up:** *If the speaker replies that classical logic is the evidence:* "If the only evidence for the view is the preservation of classical logic, and the cost is positing unknowable semantic facts, isn't this a case of saving the theory at the expense of the phenomenon? Why prioritize the logic over the data of usage?"

  ### 7. Semantic vs. Epistemic Indeterminacy
  **Question:** Your talk distinguishes epistemic indeterminacy from semantic indeterminacy. However, if the extension of a term is not fixed by the totality of facts about how speakers use and understand that term, in what sense is the indeterminacy merely epistemic? Doesn't the underdetermination of the boundary by usage suggest that the *meaning itself* is incomplete, which is precisely what the supervaluationist means by semantic indeterminacy?

  **Follow-up:** *If the speaker replies that meaning is fixed but our access is limited:* "But if meaning is fixed by use, and use underdetermines the boundary, then meaning underdetermines the boundary. How can you maintain the boundary is fixed without appealing to something beyond use?"

  ### 8. Linguistic Competence
  **Question:** Epistemicism seems to imply that competent speakers are massively ignorant about the extensions of their own terms. If I know the meaning of 'heap,' shouldn't I know what falls under it? How do you reconcile the claim that we are ignorant of the cutoff with the plausible constraint that meaning is transparent to competence? Am I not competent with a term if I cannot distinguish its extension from its complement in clear cases?

  **Follow-up:** *If the speaker replies that competence doesn't require omniscience:* "Competence doesn't require omniscience, but it usually requires the ability to recognize standard instances. If the boundary cuts through what we take to be standard instances, doesn't that suggest a failure of understanding rather than a limit on knowledge?"

  ### 9. Supervenience on Use
  **Question:** Consider two linguistic communities that are identical in all physical and behavioral respects regarding their use of a vague term. Does epistemicism allow that the sharp cutoff could be in a different place for each community? If yes, does this violate the supervenience of meaning on use? If no, and the cutoff must be the same, what determines that specific location given that use is identical and indifferent?

  **Follow-up:** *If the speaker replies that the cutoff must be the same:* "If the cutoff is the same, but use doesn't dictate it, what metaphysical ground fixes that specific number? Are we committed to a form of semantic Platonism?"

  ### 10. The Utility of Classical Logic
  **Question:** The primary motivation for epistemicism is often the preservation of classical logic, specifically the Law of Excluded Middle. However, in borderline cases, we are never in a position to assert $P$ or to assert $\neg P$. If we cannot assert either disjunct, what is the practical or theoretical utility of maintaining that $P \lor \neg P$ is true? Is saving the formal validity of the law worth the cost of making it unassertible in the very cases where vagueness arises?

  **Follow-up:** *If the speaker replies that logic is about truth preservation, not assertibility:* "But if a logic tells us what is true but gives no guidance on what we can rationally assert, does it remain a tool for reasoning, or does it become a purely metaphysical calculus detached from inquiry?"
