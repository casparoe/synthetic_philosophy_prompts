      *   *Supervaluationism:* Vagueness is semantic indeterminacy. There is no single sharp boundary; there are many admissible precisifications. A statement is super-true if true on all precisifications. Borderlines are neither true nor false (or lack a truth value).
      *   *Key Tension:* Epistemicism saves classical logic but posits unknowable facts. Supervaluationism saves intuition about borderlines but sacrifices some classical logic (or requires a distinction between truth and super-truth).
