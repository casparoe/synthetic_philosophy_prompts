          *   *Tension:* Stevens has an *ideal*. It's not just careerism; it's a moralized professionalism. Eichmann's "ideal" was the law/Führer, but Stevens' is aestheticized duty.
          *   *Verdict:* Strong overlap, but Stevens' "dignity" adds a layer of *virtue ethics gone wrong*.

      *   *Claim 2: Interchangeability.*
