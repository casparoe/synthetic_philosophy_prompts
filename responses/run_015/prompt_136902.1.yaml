      *   *Refining the "Loyalty" point:* Arendt talks about citizenship. Ishiguro talks about servitude. The moral failure in *Remains* is arguably a *category error* in loyalty (Darlington > Father/Kenton). Arendt doesn't have a vocabulary for the tragedy of *good* intentions leading to a wasted life, only for the horror of *empty* intentions leading to genocide.

  6.  **Final Polish:** Check against the prompt's specific constraints.
