          *   Stevens: The novel insists he is the *best*. He is not a cog; he is the *linchpin*.
          *   *Tension:* This is a major point of divergence. Arendt worries about the system making people interchangeable. Ishiguro worries about the individual *choosing* to subsume themselves so completely they become a tool, yet retaining a unique pride in that tool-status.
          *   *Verdict:* Stevens complicates the "cog" theory. He is a *voluntary* instrument who takes pride in his precision.

      *   *Claim 3: Failure of Thought.*
          *   Arendt: Inability to think from another's standpoint, break the dialogue with self.
          *   Stevens: Active repression. He *knows* but tells himself he doesn't. It's not absence of thought; it's *disciplined* avoidance of thought.
