answer: |-
  Right, pull up a chair. I've graded enough "Grue is green before t" essays to last three lifetimes. You're right to be worried—most students treat Goodman like a vocabulary test. They memorize the definition, nod at entrenchment, and move on without realizing Goodman isn't trying to save induction; he's dissolving the problem by changing the subject from truth to validity of practice.

  Here's how we crack this open.

  ### Process: Selecting the Crux

  I brainstormed three angles for your "murkle" variant:
  1.  **The Naturalness Objection:** Is an eclipse fundamentally different from an arbitrary time $t$ because it's a "natural kind" event? (Too easy to dismiss with standard Goodmanian replies).
  2.  **The Indexical Problem:** Does "my city" make the predicate non-projectible regardless of entrenchment? (Too technical, drifts into semantics).
  3.  **The Normative Force of Entrenchment:** If entrenchment is just usage, does shifting usage shift *justification*? (This is the winner).

  I picked **Crux 3**. It forces students to decide if Goodman is giving us a reason to trust induction (justificatory) or just explaining why we trust what we trust (descriptive/sociological). Most students miss this distinction. They think entrenchment *makes* a hypothesis valid, rather than defining validity *as* entrenchment. Your viral trend twist exposes this perfectly.

  ***

  ### Exam Question

  Define 'murkle' as applying to emeralds observed before eclipse E iff green, and after E iff blue. Assume a viral trend makes 'murkle' more entrenched than 'green' among observers before E occurs. Goodman argues entrenchment determines projectibility. Does this make 'murkle' projectible? Argue whether Goodman's entrenchment criterion offers a normative justification for induction or merely describes linguistic habits. Defend your position.

  ***

  ### Model Answer

  Goodman's New Riddle is not solved by finding a factual difference between "green" and "grue" (or in this case, "murkle"). It is dissolved by redefining projectibility in terms of entrenchment. However, the "murkle" variant exposes a critical ambiguity in Goodman's project: is entrenchment a normative standard for valid inference, or a sociological description of our habits?

  First, consider the eclipse cutoff. Unlike Goodman's arbitrary time $t$, an eclipse is a natural event. A realist might argue this makes "murkle" less artificial than "grue." However, for Goodman, this distinction is irrelevant. Projectibility is not about carving nature at its joints; it is about the history of predicate usage. Whether the cutoff is arbitrary or celestial matters only insofar as it affects whether the predicate has been successfully projected in the past. Since "murkle" is defined by a future cutoff, it lacks the past projection history of "green"—until the viral trend intervenes.

  The viral trend is the true test. If "murkle" becomes more entrenched than "green" through usage before the eclipse, Goodman's formal criterion suggests "murkle" becomes the projectible predicate. But this leads to the core tension: does this make "murkle" *correct* to project, or merely *accepted*?

  If entrenchment is justificatory, then the viral trend literally makes it rational to predict emeralds will turn blue after the eclipse. This seems absurd; popularity should not dictate physical properties. However, if entrenchment is descriptive, Goodman is not telling us what we *ought* to project, but explaining what we *will* project. On this reading, Goodman isn't solving the problem of induction; he is naturalizing it. He is saying that "valid induction" is simply the name we give to inferences that align with our entrenched linguistic practices.

  Therefore, the "murkle" case shows that Goodman's solution is descriptive, not normative. Entrenchment does not justify the inference; it constitutes the practice. If the viral trend succeeds, "murkle" becomes projectible *for us*, not because the world is murkle, but because our inductive practices have shifted. This is not a failure of Goodman's theory, but its point. He rejects the idea of a "true" projectibility independent of human practice.

  Consequently, asking if "murkle" is *really* projectible is a category mistake. It is projectible if it is entrenched. The worry that this makes induction arbitrary is only a worry if you demand an external justification for our practices. Goodman denies such justification is possible or necessary. The "murkle" variant forces us to admit that if our linguistic habits change, our logic changes. This isn't a solution to skepticism; it's a pragmatic acceptance that induction rests on habit, not truth.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Correct Application of 'Murkle' (4 Marks)**
  *   **Must Hit:** Student must apply the specific "murkle" definition (green before eclipse, blue after) rather than reverting to standard "grue" (green before $t$, blue after).
  *   **Common Screw-up:** Students ignore the eclipse element and treat it as standard grue, losing the nuance of the "natural event" cutoff.
  *   **A vs B:** A answers engage with the eclipse as a potential "natural" cutoff; B answers treat it as identical to arbitrary time $t$ without comment.

  **2. Analysis of Entrenchment Mechanism (4 Marks)**
  *   **Must Hit:** Student must explain that entrenchment relies on past projection history and how the viral trend artificially alters this history.
  *   **Common Screw-up:** Defining entrenchment as "how popular a word is" without linking it to *projection history* or *inductive validity*.
  *   **A vs B:** A answers note the tension between artificial viral usage and genuine projection history; B answers accept the viral trend as straightforwardly increasing entrenchment without qualification.

  **3. Normative vs. Descriptive Distinction (4 Marks)**
  *   **Must Hit:** Student must explicitly distinguish whether entrenchment *justifies* induction (normative) or *describes* practice (descriptive).
  *   **Common Screw-up:** Treating entrenchment as a magic bullet that solves the problem without addressing whether it provides *reasons* or just *causes*.
  *   **A vs B:** A answers take a stance on this dichotomy; B answers hedge or claim it does both without resolving the tension.

  **4. Evaluation of the "Solution" (4 Marks)**
  *   **Must Hit:** Student must argue whether Goodman's approach counts as a solution to the riddle or a dissolution/pragmatic acceptance.
  *   **Common Screw-up:** Claiming Goodman "solves" induction in the traditional sense (i.e., proves induction leads to truth).
  *   **A vs B:** A answers recognize Goodman is changing the definition of validity; B answers criticize Goodman for not proving emeralds are actually green.

  **5. Coherent Position/Conclusion (4 Marks)**
  *   **Must Hit:** Student must defend a consistent position (e.g., "Entrenchment is descriptive, therefore murkle is projectible only relative to practice").
  *   **Common Screw-up:** Contradicting themselves (e.g., saying entrenchment is descriptive but then arguing murkle is objectively wrong).
  *   **A vs B:** A answers maintain consistency even if the conclusion is radical; B answers retreat to common sense ("emeralds are really green") against the logic of their own argument.
