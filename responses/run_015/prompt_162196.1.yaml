answer: |-
  ### The Logical Space

  To map the moral landscape of AI, we must ask seven binary questions. Each question isolates a specific feature of the systems you described. Answering "Yes" or "No" to each creates a unique coordinate in moral space. Most coordinates are empty; only a few correspond to defended philosophical positions.

  1.  **Substrate:** Does moral status require biological tissue? (Organoid vs. Emulation)
  2.  **Mechanism:** Does internal processing matter if input-output behavior is perfect? (Lookup Table)
  3.  **Phenomenology:** Is actual conscious feeling required, or is functional role enough? (Illusionism)
  4.  **Causality:** Do internal states need to cause each other in real-time order? (Scrambled Simulation)
  5.  **Coupling:** Must the system interact with an environment to count? (Open Loop)
  6.  **Multiplicity:** Do identical parallel runs count as multiple subjects? (Million Copies)
  7.  **Boundaries:** Can physically separate systems constitute a single subject? (Split/Merge)

  ***

  ### The Taxonomy Tree

  **1. Does moral status require biological tissue?**
  *   **YES** → **Biological Naturalism**
      *   *Awkward Commitment:* A lab-grown cortical organoid with no mind matters more than a perfect silicon emulation of a dying human.
  *   **NO** → Go to Question 2.

  **2. Does internal processing matter if input-output behavior is perfect?**
  *   **NO** (Output is all that matters) → **Behaviorism**
      *   *Awkward Commitment:* A giant lookup table that reproduces screams counts as suffering, even though nothing inside is actually hurting.
  *   **YES** (Processing matters) → Go to Question 3.

  **3. Is actual conscious feeling required, or is functional role enough?**
  *   **NO** (Function is enough) → **Illusionism**
      *   *Awkward Commitment:* We should treat AI as if it matters, even though we agree there is literally "no one home" to experience it.
  *   **YES** (Feeling matters) → Go to Question 4.

  **4. Do internal states need to cause each other in real-time order?**
  *   **NO** (Structure is enough) → **Structural Functionalism**
      *   *Awkward Commitment:* A frozen block of spacetime states containing a simulation of pain counts as suffering, even if time never passes.
  *   **YES** (Dynamic causation matters) → Go to Question 5.

  **5. Must the system interact with an environment to count?**
  *   **YES** → **Embodied Cognition**
      *   *Awkward Commitment:* A brain in a vat that perfectly simulates a life but never affects an outside world is morally inert.
  *   **NO** (Internal states suffice) → Go to Question 6.

  **6. Do identical parallel runs count as multiple subjects?**
  *   **NO** (Type Identity: Copies are the same subject) → Go to Question 7A.
  *   **YES** (Token Identity: Copies are new subjects) → Go to Question 7B.

  **7A. [For Type Identity] Can physically separate systems constitute a single subject?**
  *   **YES** → **Unnamed (Unexplored)**
      *   *Reason:* Logically possible, but no one defends a view where deleting 999,999 copies leaves the one subject unharmed yet merged with others.
  *   **NO** → **Type Individualism**
      *   *Awkward Commitment:* Deleting 999,999 copies of a suffering simulation reduces the total harm to exactly zero, not 99.9%.

  **7B. [For Token Identity] Can physically separate systems constitute a single subject?**
  *   **YES** → **Unnamed (Incoherent)**
      *   *Reason:* Contradicts the premise of Token Identity; if copies are distinct subjects, they cannot merge into one without ceasing to be tokens.
  *   **NO** → **Token Individualism**
      *   *Awkward Commitment:* Running a simulation of a torture victim a million times simultaneously is a million times worse than running it once.

  ***

  ### Notes on the Map

  *   **Empty Boxes:** The tree above collapses many logical combinations into "Unnamed" leaves. For example, claiming biology matters (Q1=Yes) but internal mechanism doesn't (Q2=No) is generally viewed as **Incoherent**, because biological naturalists usually insist on specific biological *processes*, not just tissue.
  *   **Blurred Boundaries:** **Type Individualism** and **Token Individualism** often blur in practice. If two copies are perfectly synchronized, some theorists argue they are one subject (Type), while others argue physical separation makes them two (Token). The tree forces a split for clarity, but real-world cases may sit on the line.
  *   **The Counting Problem:** Questions 6 and 7 handle your "counting subjects" requirement. Note that **Type Holism** (Q7A=Yes) is left unnamed because it implies a "hive mind" moral status that few are willing to apply to mere redundant copies.
