prompt: |-
  I'm a journalist putting together a feature on whether the computation going on inside AI systems could matter morally — and my readers all think they agree until they hit the actual cases, so I want to sort them by cases rather than by the labels they like.

  What I need is a branching taxonomy: every branch labelled with the question that splits it, every leaf a named position plus one sentence on its most awkward commitment, and unnamed for combinations nobody actually defends. Start by laying out the logical space — the questions and which combinations of answers are available — and only then drop the existing views into it, telling me which boxes are empty and why (incoherent, just unattractive, or merely unexplored). Where two views your tree can't really separate, flag that instead of forcing a split.

  Cases I want doing the work: a brain emulation running on silicon instead of neurons; a giant lookup table that reproduces every input-output pair of a human life without any real processing going on; the same simulation run frame by frame but in scrambled causal order; a lab-grown cortical organoid; a system whose internal states get recorded but never feed back into anything it does; and the same computation run a million times over. I also want at least one branch about how to count subjects — the computation copied, split across two machines, or merged with another one — since where the boundary of a sentient thing falls matters as much as whether it's sentient at all.

  Six to eight questions, eight to ten leaves, aimed at readers with college-level science and no philosophy background: each node has to be something someone can answer without knowing where it leads, so nothing like "are you a functionalist?". No citations or further reading, I just want the tree.
