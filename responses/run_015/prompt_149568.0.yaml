      Zombie verdict says: "creature that moved and spoke exactly as we do... is conceivable."
      The user *already* sees the tension ("sits badly with (3)"). My job is to rank it. It is definitely #1.
      The user asks: "Which pairs are genuinely in tension... ranked by severity."
      Okay, I will explicitly rank the Zombie/Causal tension as Critical.

      *Regress Objection:* The flatmate says "user illusion needs a user." The user says "fake problem." I need to validate the user here *provided* they avoid homunculus fallacy. The "user" is just the downstream decision-making module.

      *Illusionist Collapse:* Flatmate says (1)+(4) = Dennett. User says (2) saves them. Is (2) a dodge? If "icon is real" means "there is a neural representation," Dennett agrees. If it means "there is a phenomenal property," Dennett disagrees. The tension is whether the "icon" has intrinsic properties. I should highlight this.

      *AI Prediction:* Needs to follow from the resolved view. If we fix the Zombie tension by denying zombies (functionalism), then AI with the right architecture gets the display.

  6.  **Final Review against constraints:**
