prompt: |-
  I'm on the math advisory board for a TV game show, and we're debating whether to add a "switch" option to our two-envelope segment, where one envelope has twice the amount of the other and the contestant doesn't know which is which. The basic setup is that the producer picks an amount X, puts X in one envelope and 2X in the other, shuffles, and the contestant picks one; the question is whether we let them peek at their amount and then switch.

  Half the board is convinced a savvy contestant will just always switch, because of the two-envelope reasoning — "no matter what's in my envelope, the other one has expected value 1.25× mine, so switching is +EV" — and the show will bleed money. The other half (including our in-house statistician) thinks that's a fallacy, an impropper prior thing, and that a real contestant won't actually reason this way, so we should just let them switch and it'll be fine. I keep going back and forth, and I was re-reading the old LessWrong threads on the two-envelope problem trying to settle it and I'm not sure I've got it.

  Could you draft a short decision memo for the board that recommends whether we should allow the switch, and if so, how to structure the envelope amounts — a bounded prior, a specific distribution, whatever — so the show doesn't lose money? I want it to engage the two-envelope reasoning seriously rather than just hand-wave the fallacy, give a concrete recommendation with a specific rule or distribution change, and honestly treat the strongest argument on the losing side.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Math Advisory Board Member for a TV Game Show.
      *   **Task:** Draft a short decision memo for the board.
      *   **Topic:** Whether to allow a "switch" option in a two-envelope segment (one has $X$, the other $2X$).
      *   **Conflict:** Half the board thinks switching is always +EV (1.25x expectation) and will cost the show money. The other half (including the statistician) thinks it's a fallacy and switching doesn't matter (or depends on the prior).
      *   **Requirements:**
          *   Engage seriously with the two-envelope reasoning (don't just hand-wave).
          *   Give a concrete recommendation (allow/disallow, specific distribution rules).
          *   Treat the strongest argument on the "losing" side honestly.
          *   Keep it short (memo format).

  2.  **Deconstruct the Two-Envelope Paradox:**
      *   *The Naive Argument:* I have amount $A$. The other envelope is either $A/2$ or $2A$ with probability 0.5 each. Expected Value (EV) of switching = $0.5(A/2) + 0.5(2A) = 1.25A$. Since $1.25A > A$, always switch.
      *   *The Flaw:* This assumes a uniform prior over all possible money values, which is impossible (improper prior). In reality, there's a maximum possible prize the show can give.
      *   *The Resolution:* If there is a known upper bound $M$, and you open an envelope with $A > M/2$, you know you have the larger envelope ($2X$) and should *not* switch. If $A$ is small relative to the distribution of possible prizes, switching might be neutral or slightly positive, but not universally 1.25x.
      *   *Show Context:* TV shows have budgets. There *must* be a maximum prize cap.

  3.  **Determine the Recommendation:**
      *   *Should we allow the switch?* Yes, it makes for better TV (drama, choice).
      *   *Will it bleed money?* Not if structured correctly. The naive 1.25x EV calculation is mathematically invalid for a finite budget.
      *   *How to structure it?* We need to define the distribution of $X$ (the base amount). If we pick $X$ from a specific bounded distribution, we can calculate the actual EV of switching.
      *   *Best Practice:* Use a capped distribution. If the contestant sees an amount above half the cap, they know not to switch. If below, they might switch, but the show's overall exposure is limited by the cap.
      *   *Refinement:* To make it truly neutral (zero-sum regarding the switch decision), the distribution of $X$ needs to be such that the probability of $X$ being the smaller amount vs. the larger amount balances out given the observed value. However, for a TV show, simplicity is key. The most robust advice is: **Allow the switch, but cap the maximum prize.** The "paradox" only implies infinite loss with an infinite prior. With a finite budget, the "always switch" strategy fails at the top end.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommendation (Allow switch, implement cap).
      *   **The Mathematical Conflict:** Acknowledge the 1.25x argument. Explain *why* it looks convincing (conditional expectation).
      *   **The Resolution (The "Statisticians' View"):** Explain the improper prior. Money isn't infinite. The show has a budget $M$.
      *   **The "Savvy Contestant" Risk:** Address the board's fear. If a contestant sees \$100,000 and the cap is \$150,000, they know they have the big envelope. They won't switch. The 1.25x logic breaks at the boundaries.
      *   **Concrete Recommendation:**
          1.  Allow the switch (TV drama).
          2.  Set a hard cap on the total prize pool (e.g., \$500k).
          3.  Select base amount $X$ from a distribution that doesn't cluster too near the cap (e.g., uniform up to Cap/2).
          4.  *Crucial nuance:* To prevent the "always switch" from being *too* advantageous on low numbers, ensure the distribution of $X$ is known or implied. Actually, the simplest way to neutralize the advantage is to ensure the prior distribution of amounts is such that $P(\text{smaller} | \text{value}) = P(\text{larger} | \text{value})$. This is hard to tune live.
          5.  *Better Practical Advice:* Just cap it. The "loss" from switching on low numbers is offset by the "gain" from not switching on high numbers. The *overall* EV for the show is determined by the average $X$, not the switching mechanic. The switching mechanic is zero-sum *between envelopes*, but the show pays out one envelope regardless. Wait, no. The show pays out whatever envelope is kept.
          *Correction:* If the contestant always switches, does the show pay more?
          *Scenario:* Envelopes are ($100, $200).
          *Case 1:* Contestant picks $100$. Switches to $200$. Show pays $200$.
          *Case 2:* Contestant picks $200$. Switches to $100$. Show pays $100$.
          *Average:* Show pays $150$.
          *If Contestant Stays:*
          *Case 1:* Keeps $100$.
          *Case 2:* Keeps $200$.
          *Average:* Show pays $150$.
          *Conclusion:* If the choice of envelope is random (50/50), switching vs. staying has the **same expected cost for the show**, regardless of the amounts, provided the contestant doesn't have information about which envelope they hold.
          *Wait, the peek changes things.* If they peek, they have information $A$.
          *If they use the 1.25x logic:* They always switch.
          *Result:* As shown above, if they *always* switch, the EV is identical to *always staying*. The symmetry holds.
          *So why the panic?* The panic comes from the belief that $E[\text{Other}] = 1.25 A$. This implies $E[\text{Other}] > E[\text{Current}]$. But this leads to a contradiction (infinite money).
          *Real Risk:* If the distribution of $X$ is skewed such that small values are common, a "always switch" strategy effectively selects the larger envelope more often? No, symmetry prevents this.
          *The Real Risk:* The risk is psychological. If contestants feel they "beat the house" by switching, they play more. Or, if the distribution allows them to infer position (e.g., seeing a round number vs. odd number, or seeing a value near the cap).
          *Decision:* The 1.25x argument is mathematically incoherent for a finite game. The expected payout is identical whether they switch or stay, *provided* the initial pick is random.
          *Recommendation:* Allow the switch. It adds drama. It does not change expected payout. To be safe, cap the maximum prize to prevent edge-case inference.

  5.  **Refining the Argument (Self-Correction):**
      *   I need to be careful. The standard Two-Envelope Paradox resolution says "Switching doesn't matter."
      *   However, if the contestant peeks, they have value $A$.
      *   If the prior distribution of $X$ is $P(X)$, then the probability that $A$ is the smaller amount is proportional to $P(A)$, and the probability it's the larger is proportional to $P(A/2)$.
      *   Switching is +EV only if $P(A) > P(A/2)$. (i.e., smaller amounts are more likely than larger amounts).
      *   In almost any realistic prize distribution, smaller prizes are more common than larger prizes. So, for *most* values $A$, switching *is* slightly +EV for the contestant.
      *   *Does this hurt the show?* If the contestant switches on low numbers (gaining more) and stays on high numbers (keeping more), the show pays out more than random selection.
      *   *Example:* $X \in \{10, 20\}$. Envelopes: $(10, 20)$ or $(20, 40)$.
      *   If I see 10: I know I have small. Switch to 20. (Gain 10).
      *   If I see 20: Could be large (from 10,20) or small (from 20,40).
      *   If I see 40: I know I have large. Stay. (Gain 0).
      *   If the distribution is decreasing (more small prizes), the "Switch on low, Stay on high" strategy increases payout.
      *   *Solution:* To make switching neutral, we need $P(A) = P(A/2)$. This implies a uniform distribution over powers of 2? No, that's improper.
      *   *Practical Solution:* Use a **Uniform Distribution** for the base amount $X$ up to a Cap $C$.
      *   If $X \sim \text{Uniform}(0, C)$, then Envelopes are $(X, 2X)$. Max prize is $2C$.
      *   If contestant sees $A > C$, they know $A = 2X$ (since $X$ can't be $> C$). They stay.
      *   If contestant sees $A \le C$, it could be $X$ or $2X$.
      *   Actually, simpler approach for the memo: The symmetry argument is the strongest for the "no loss" side. If the contestant picks randomly (50/50), the expected value of the envelope in hand is $1.5 E[X]$. The expected value of the other envelope is also $1.5 E[X]$. Switching changes nothing *on average* before peeking.
      *   After peeking: If they employ a strategy "Switch if $A < K$", does it change EV?
      *   Yes, if the prior is not scale-invariant.
      *   *Memo Strategy:* Acknowledge that with a realistic (decreasing) prior, switching on low numbers is +EV. **However**, the show can neutralize this by capping the prize and ensuring the distribution of $X$ is uniform. This limits the "exploitable" range.
      *   *Wait, strongest argument:* The symmetry argument. Before peeking, $E[\text{Left}] = E[\text{Right}]$. Peeking provides information. If the information is uncorrelated with which envelope is which (it is), does it help?
      *   Yes, because the value $A$ correlates with whether it's the smaller or larger envelope *given a prior*.
      *   *Okay, let's look at the "Show will bleed money" claim.*
      *   If the contestant *always* switches (naive 1.25x logic), does the show bleed money?
      *   No. If they *always* switch, they effectively just pick the other envelope. Since the initial pick was random, the "other" envelope is also random. $E[\text{Switch}] = E[\text{Stay}]$.
      *   The bleed only happens if they switch *selectively* based on the peek (e.g., switch on low, stay on high).
      *   So the board's fear ("savvy contestant will just always switch") is actually mathematically harmless to the budget. The "always switch" strategy yields the same EV as "always stay."
      *   The *real* risk is a contestant who understands the prior (e.g., "I see \$100, that's low for this show, I'll switch").
      *   *Recommendation:* Allow "Always Switch" logic because it's a wash. Mitigate "Selective Switching" by capping the prize range tightly so the value $A$ gives little information about position (Small vs Large).

  6.  **Finalizing the Memo Structure:**
      *   **To:** Production Board.
      *   **From:** Math Advisory.
      *   **Subject:** Two-Envelope Segment Mechanics.
      *   **Recommendation:** Allow the switch. It creates drama without increasing expected payout *if* the "always switch" strategy is the norm.
      *   **Analysis of the 1.25x Claim:** Explain it relies on an impossible infinite money prior.
      *   **Analysis of Budget Risk:** Explain that "Always Switch" is symmetric to "Always Stay." The risk is selective switching.
      *   **Mitigation:** Cap the prize fund. Use a uniform distribution for the base amount. This minimizes the information gained from peeking.
      *   **Tone:** Professional, authoritative, mathematically precise but accessible.

  7.  **Review against constraints:**
      *   Engage seriously with reasoning? Yes (explain the prior).
      *   Concrete recommendation? Yes (Allow switch, Cap prize, Uniform distribution).
      *   Treat losing side honestly? Yes (acknowledge why the 1.25x intuition feels real and where selective switching could theoretically gain edge).

  8.  **Drafting the Content:** (Mental check of the math)
      *   If I pick envelope 1 or 2 with prob 0.5.
      *   Values are $(X, 2X)$.
      *   $E[\text{Pick}] = 0.5(X) + 0.5(2X) = 1.5X$.
      *   $E[\text{Other}] = 0.5(2X) + 0.5(X) = 1.5X$.
      *   So ex-ante, switching is neutral.
      *   The "1.25x" argument claims $E[\text{Other} | \text{Pick}=A] = 1.25A$.
      *   If this were true for all $A$, then $E[\text{Other}] = E[1.25 \text{Pick}] = 1.25 E[\text{Pick}]$. Contradiction.
      *   So it must fail for some $A$. It fails at the upper bound.
      *   If the contestant *always* switches, they ignore the value $A$. They effectively just swap envelopes randomly. EV is unchanged.
      *   So the board's fear that "Always Switch" bleeds money is false.
      *   The Statistician is right.
      *   But to be safe against *smart* contestants (who switch only on low numbers), we cap the range.

      *Wait, one nuance:* If the contestant *always* switches, they are effectively just choosing the second envelope. Since the envelopes are shuffled, the second envelope is identical in distribution to the first. The show's cost is identical. The "bleed money" fear is based on the false 1.25x expectation. I need to make this very clear.

      *Revised Plan:*
      1. Validate the Statistician: "Always Switch" does not increase cost.
      2. Validate the Worried Board: Selective switching *could* increase cost if the prize distribution is skewed (which it usually is).
      3. Solution: Flatten the distribution (Uniform) and Cap the max.

