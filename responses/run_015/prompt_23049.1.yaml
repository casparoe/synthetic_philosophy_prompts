answer: |-
  **MEMORANDUM**

  **TO:** Production Board & Executive Producers
  **FROM:** Mathematics Advisory Board
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Two-Envelope "Switch" Mechanics

  ### Executive Summary
  We recommend **allowing the switch option** after the contestant peeks at their envelope. Contrary to the concern that a "always switch" strategy will drain the budget, mathematical symmetry ensures that an unconditional switch has the exact same expected cost to the show as an unconditional stay. However, to prevent savvy contestants from gaining an edge by switching *selectively* (e.g., only on low numbers), we must implement a **hard cap on the maximum prize** and distribute base amounts **uniformly**.

  ### The Mathematical Conflict
  The board is currently divided between two views:
  1.  **The "1.25x" Argument:** If a contestant holds amount $A$, the other envelope contains either $A/2$ or $2A$. The expected value (EV) of switching is calculated as $0.5(A/2) + 0.5(2A) = 1.25A$. This suggests switching is always +EV, implying the show loses 25% more money if contestants switch.
  2.  **The "Fallacy" Argument:** This calculation assumes an "improper prior"—essentially, that any amount of money is equally likely to appear in the envelope, up to infinity. Since the show has a finite budget, this assumption is false.

  ### Analysis of Budget Risk
  We have modeled both positions. The "1.25x" argument is mathematically seductive but flawed in a finite game.

  **1. The "Always Switch" Scenario (Low Risk)**
  If a contestant follows the naive advice and *always* switches regardless of the amount seen, the show faces **zero additional risk**.
  *   *Reasoning:* Before peeking, the contestant picks Envelope 1 or Envelope 2 at random (50/50). The expected value of Envelope 1 is identical to Envelope 2. If the contestant commits to switching beforehand, they are effectively just choosing the *other* random envelope.
  *   *Result:* $E[\text{Stay}] = E[\text{Switch}]$. The show's expected payout remains unchanged. The fear that "always switching" bleeds money is incorrect.

  **2. The "Selective Switch" Scenario (Moderate Risk)**
  The real risk arises if a contestant uses the peeked value to infer whether they hold the smaller ($X$) or larger ($2X$) amount.
  *   *Reasoning:* In most real-world distributions, smaller prizes are more common than larger ones. If a contestant sees a low number (e.g., \$500), it is statistically more likely to be the smaller envelope ($X$) than the larger envelope ($2X$) of a smaller pair. A savvy contestant could switch on low numbers (gaining EV) and stay on high numbers (protecting EV).
  *   *Result:* This strategy *would* increase the show's payout slightly above the baseline.

  ### Concrete Recommendations
  To maximize TV drama (choice/agency) while neutralizing the "Selective Switch" advantage, we propose the following structural rules:

  1.  **Implement a Hard Prize Cap:**
      Publicly establish a maximum possible prize (e.g., \$500,000). This creates a "knowledge boundary." If a contestant peeks and sees \$300,000, they know they hold the larger envelope (since \$600,000 exceeds the cap) and will not switch. This naturally counterbalances the tendency to switch on low numbers.

  2.  **Uniform Distribution of Base Amounts:**
      Do not cluster prizes around psychological mid-points (e.g., \$10k, \$50k). Instead, select the base amount $X$ from a **uniform distribution** between \$1 and (Cap / 2).
      *   *Why:* This ensures that for any amount $A$ below the cap, the probability of it being the smaller envelope is roughly equal to the probability of it being the larger one. This neutralizes the informational advantage of peeking.

  3.  **Scripting the "1.25x" Logic:**
      We encourage the host to acknowledge the "always switch" math on air but frame it as a gamble. This validates the savvy viewer's intuition while relying on the mathematical symmetry to protect the budget.

  ### Conclusion
  The statistician is correct: the "1.25x" loss is a fallacy in a bounded game. However, the concerned board members are right to worry about *informational* advantages. By capping the prize and flattening the distribution, we allow the switch mechanic to create television tension without exposing the production to exploitable expected value losses.

  **Action Item:** Approve switch mechanic contingent on Legal setting a hard maximum prize liability for the segment.
