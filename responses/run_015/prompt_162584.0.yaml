  **Scenario**
  Ten colleagues must reach a client meeting to save their jobs. Only Bob owns a car capable of making the trip in time; using it without explicit consent causes significant wear (harm 5 units). Success benefits all ten equally (benefit 10 units each). Bob is present but paralyzed by indecision; he cannot consent. Total Utilitarianism (TU) mandates driving: the total gain outweighs the loss, and Bob himself nets a positive welfare outcome (+5). A Nozickian Separateness view (SRV), treating persons as inviolable boundaries, forbids using Bob's property to benefit the group, refusing to aggregate the nine colleagues' gains against Bob's claim. Consequently, SRV mandates walking. All ten miss the meeting and are fired. Compared to the TU outcome, every single person—including Bob—is materially worse off.

  **Analysis**
  *   **Verdicts:** TU chooses drive (Pareto superior); SRV chooses walk (Pareto inferior).
  *   **Why:** TU aggregates welfare across persons. SRV treats Bob's boundary as a side-constraint that cannot be overridden by the sum of others' benefits, even if Bob also benefits.
  *   **Key Feature:** The non-aggregation constraint across persons. The nine colleagues' claims cannot combine to outweigh Bob's.
  *   **Remove Feature:** If aggregation were permitted, SRV would collapse into TU, selecting the drive.
  *   **SRV Defense:** Rights protect moral status and autonomy, not just welfare outcomes. Violating Bob treats him as a means, which is a distinct moral evil outweighing the material loss of jobs.
  *   **Confidence:** High on logical structure; medium on whether this captures Rawls/Nozick precisely (they might permit hypothetical consent here).
  *   **Least Sure:** Whether a true Separateness view would forbid the act if the *victim* also nets a benefit, or if this merely tests rigid deontology.
