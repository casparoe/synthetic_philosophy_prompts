  **Project Title:** The Paradox of Settled Inquiry: Episodic Closure in Dewey's Democratic Experimentalism

  **Project Summary**
  John Dewey's political philosophy is frequently summarized by the maxim that democracy is inquiry scaled up. However, a structural tension exists between Dewey's epistemology and his political theory. In his logical works, Dewey defines successful inquiry as a movement from an indeterminate situation to a determinate one; inquiry must reach a settled conclusion to resolve the problem. Conversely, his political theory describes democracy as a permanently open, reconstructive process where no final ends are fixed. This project investigates whether Dewey's model of democracy covertly relies on episodic narrative closure—moments where the community accepts a conclusion as "settled" to function, even if that settlement is theoretically provisional. The goal is to determine if this requirement for temporary closure risks collapsing into authoritarian finality or if it can sustain genuine openness.

  **Research Question**
  Does Dewey's experimentalist account of democracy require democratic inquiry to possess episodic closure points to function, and if so, does this necessity undermine the claim that democracy is a permanently open process? Specifically, is "warranted assertibility" in a political context dependent on a community's ability to narrate a problem as solved, regardless of future revision?

  **Gap in Existing Literature**
  Current scholarship tends to locate Dewey's democratic theory primarily within his educational and political texts. These works emphasize continuity, growth, and the fluid nature of social experience. Consequently, scholars often overlook the rigid structural requirements for "settlement" found in Dewey's later logical writings. By prioritizing the education classics, the literature misses the friction generated when the strict criteria for scientific closure are applied to the messy temporality of political life. This project shifts the focus to the logical corpus to expose how the mechanics of inquiry constrain the theory of democracy.

  **Methodology**
  This project will employ a comparative textual analysis over one semester. The primary method involves close reading of Dewey's logical works alongside his political treatises, with specific attention to temporal language. I will track terminology related to ending, resolving, and settling (e.g., "consummation," "closure," "determinate situation") in the logical texts and map them against terms related to continuity and reconstruction in the political texts. The analysis will focus on whether Dewey treats political consensus as a distinct category from scientific conclusion or if he subsumes the former under the latter's requirements for closure.

  **Falsification Condition**
  This hypothesis would be proven wrong if the textual analysis reveals that Dewey explicitly decouples political inquiry from the requirement of a settled conclusion. If evidence shows that Dewey considers democratic inquiry successful *while* remaining in a state of permanent indeterminacy—without needing even a provisional narrative of resolution—then the claim that he smuggles in closure conditions is false. Alternatively, if he clearly distinguishes "political warrant" from "scientific warrant" such that political inquiry does not require the same determinate resolution, the tension dissolves.

  **Feasibility and Scope Risks**
  The primary risk to completing this project within a one-semester fellowship is the sheer volume of Dewey's corpus. Dewey frequently reformulated his terminology across decades, which could lead to scope creep if the project attempts to trace every iteration of "inquiry." To remain feasible, the research must limit itself to his mature logical works and major political texts from the same period. Additionally, there is a risk of over-interpreting metaphorical language as technical prescription; distinguishing between Dewey's rhetorical use of scientific method and his strict philosophical definition will require careful discrimination to avoid creating a strawman argument. If the textual ambiguity proves too high, the project may need to narrow further to a single key text comparison.
