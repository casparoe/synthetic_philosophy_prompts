prompt: |-
  I host a small philosophy of science podcast and next week I'm interveiwing a philospher who defends a weird but specific take on Solomonoff induction and Occams razor. He thinks Kolmogorov complexity is real but useless for real science, not mainly because its uncomputable, but because the universal prior depends on your choice of universal Turing machine — and he thinks that choice is physically grounded. So he argues different labs, say ones on classical silicon vs ones running on quantum processors, literally live in different 'simplicity landscapes': quantum mechanics might be simpler on a quantum substrate but not on a classical one. He says science still works because we share hardware, not because nature prefers simplicity.

  Draft 8-10 interveiw questions. Don't just have him restate the view. I need at least one on the reference-machine problem and whether it kills objectivity, one contrasting his view with standard Bayesian Occams razor (the Occam factor), and one on whether two communities with different computers could rationally pick different theories. For each, include a follow-up keyed to his likely reply — e.g. if he says the constant factor washes out with big data, ask about small-data physics like cosmological parameter fitting; if he dismisses quantum substrates as sci-fi, ask about analog quantum simulators already in use.
