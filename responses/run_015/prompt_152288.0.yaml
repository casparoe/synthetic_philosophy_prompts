  I'm working on a philosophy and rhetoric project for my junior-year seminar, and I need a sustained deadpan parody for our "Concept as Institution" unit. Specifically, I want a mock government FAQ — the "Frequently Asked Questions for the Bureau of Analogical Governance" — that satirizes the claim that all cognition is fundamentally analogical reasoning, in the tradition associated with Hofstadter and Sander's Surfaces and Essences. The piece should run about 600 words, formatted as numbered bureaucratic questions and answers in dry administrative prose. The satire must come from exaggerating real features of the view rather than inventing fake theories: for example, treat categorization as literal surface-to-essence licensing, present mathematical reasoning as analogical projection subject to audit, and frame "slippage" (false or over-extended analogies) as a regulatory violation. Please invent one niche institutional mechanism — such as a tiered Conceptual Citizenship license, an Essence Disclosure tax, or a mandatory Analogy Audit — that has no real-world equivalent but follows logically from treating analogy as the sole engine of thought. The FAQ should cover at least five practical questions: how a citizen applies for analogical permits, what penalties apply when an analogy fails audit, whether non-analogical cognition is legally permitted, how the Bureau distinguishes valid structural mapping from surface error, and the appeals process for revoked conceptual licenses. Keep the irony sustained and deadpan: the reader should recognize the absurdity without any explicit signaling. Do not include bibliographies, reading lists, citations, or references to specific page numbers. After the FAQ, provide a structured summary as a JSON object with exactly these fields: "target_concept" (string), "parodied_genre" (string), "three_exaggerated_features" (array of three strings), "invented_regulatory_detail" (string), and "tone_check" (string describing whether the deadpan irony remains legible).
