answer: |-
  1. The reliance on statistical persistence without causal history dissolves strict numerical identity, reducing the protagonist to a series of psychologically continuous but ontologically distinct stages. Consequently, the sense of self becomes a narrative construct rather than a metaphysical fact, challenging the notion that the final synthetic entity is truly the original person.

  2. Moral agency fractures because the synthetic successor lacks the causal connection to the biological predecessor's intentions, making retributive justice for past crimes philosophically untenable. Responsibility must therefore shift from the agent to the continuity of the social contract maintained by the surviving pattern.

  3. Branching duplicates created by backups invalidate uniqueness-based rights, forcing society to allocate resources and legal standing based on current computational capacity rather than historical origin. Each branch possesses an equal claim to the original's assets, inevitably leading to conflict unless identity is legally redefined as divisible.

  4. Continuity of obligations adheres neither to the causal chain nor the narrative self-model exclusively, but instead relies on a pragmatic legal fiction that treats statistical persistence as sufficient for contractual validity. This ensures social stability despite the metaphysical reality that the debtor who signed the contract no longer exists.

  5. Ultimately, moral status attaches to the narrative self-model because the causal chain is broken, yet this attachment functions as a utilitarian concession rather than an acknowledgment of genuine survival. The protagonist thus embodies the tension between the subjective experience of continuity and the objective reality of sequential replacement.
