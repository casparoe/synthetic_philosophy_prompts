answer: |-
  **Mara:** The wild-offset is the key. Look at the numbers. For every steer slaughtered, they fund vaccination and drought feeding for five wild herbivores. The net suffering drops. If we block this, we're choosing the integrity of the herd over the agony of the wild.

  **Theo:** You're summing moments again. You think because the wild animals suffer less, the steer's death is bought and paid for. But the steer isn't a vessel for utility. It's a center of gravity. It has a claim against being used as a means to save the wild ones.

  **Mara:** A claim based on what? If the life is good—audited by their own choices, heat panels, company—and the death is instant, before the joint decay starts... what is harmed? The deprivation argument says they lose future goods. But the application proves the future turns negative. We're killing them *for* their welfare.

  **Theo:** They lose the good years before the decline. And don't use the "better than never existing" shield. You don't get credit for the gift of existence you then cash in. I bring you into being, I feed you well, then I kill you to balance my ledger. That's not benevolence. That's ownership.

  **Mara:** Ownership implies you keep the profit. Here, the profit goes to the wild animals. And the replacement clause means the total sum of "good life" remains constant. One dies, one is born. The stream of experience continues, just in a different body.

  **Theo:** There's the rub. The stream. If this logic holds, why not humans? Imagine a carefully run human herd. Offsets mean net suffering drops. Welfare is audited. Death comes before decline. One-for-one replacement. If you flinch there, you're drawing a line at species membership. That's just speciesism pointed the other way.

  **Mara:** I don't flinch because of species. I flinch because of narrative. Humans anticipate their future as a continuous project. A cow lives in the thick of now. Depriving a human of their future violates a specific psychological structure—a desire to continue that cows don't possess in the same way. It's not speciesism; it's about the capacity to hold a life as a story.

  **Theo:** So if a human doesn't see their life as a story—dementia, infancy—they're fair game? You're back to magnitude. And if it's only magnitude, my offsets outweigh it. You're saying the violation is real, just too small to matter against the wild suffering.

  **Mara:** I'm saying the violation is zero if there's no subject to feel the loss. But look at your position. You're willing to let wild animals starve and rot to keep your hands clean of this specific violation. You care more about not being complicit in the farming than you care about the actual pain in the bush.

  **Theo:** It's not about cleanliness. It's about justice. You don't sacrifice one innocent to save five. Even if the math works. If I accept your math, I have to accept that individuals are disposable containers for experience.

  **Mara:** And if I accept your justice, I have to accept that "being a subject" has value independent of what it feels like to be one. That there's a ghost in the machine that gets wronged even if the machine never knows it.

  **Theo:** Exactly.

  **Mara:** So here's the crux. For me to vote no on this application, I'd have to believe that there is a "someone" there distinct from the "something felt." That the continuity of the body matters even if the experience doesn't register the break.

  **Theo:** And for me to vote yes? I'd have to believe that aggregate welfare can override individual inviolability. That I can use a creature as a bridge to save others, even if it never consented to be the bridge.

  **Mara:** If you're right, I'm building a world of happy ghosts.

  **Theo:** If you're right, I'm letting the wild burn to protect a principle they don't understand.

  **Mara:** Pass the coffee.

  **Theo:** It's cold.

  **Mara:** Then we sit here until it gets hot.
