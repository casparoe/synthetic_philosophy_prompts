              *   Let's tweak Spec to 0.55.
              *   $P(+) = 0.225 + 0.55(0.75) = 0.225 + 0.4125 = 0.6375$.
              *   $P(E|+) = 0.225 / 0.6375 = 0.352$. (Below 0.375 $\rightarrow$ Don't).
              *   Wait, I want it to sometimes switch action.
              *   Let's make it Spec 0.4.
              *   $P(+) = 0.225 + 0.4(0.75) = 0.525$.
              *   $P(E|+) = 0.225 / 0.525 = 0.428$. (Above 0.375 $\rightarrow$ Stockpile).
              *   Value:
                  *   + (52.5%): Stockpile (EU = $0.428(100)+0.572(40) = 65.68$).
                  *   - (47.5%): Don't (EU = $0.05(0)+0.95(100) = 95$). (Approx).
                  *   Total EU $\approx 0.525(65.68) + 0.475(95) = 34.48 + 45.12 = 79.6$.
                  *   Value = $79.6 - 75 = 4.6$.
                  *   Cost = 2. Net = +2.6.
              *   *Combined B+D:*
                  *   Assuming independence (for game simplicity).
                  *   This is hard to calculate on the fly for the prompt. I will note in the "Teacher's Key" that B+D value < Value(B) + Value(D) due to overlap.

      *   *Final Check on Numbers:*
          *   Prior: 0.25.
          *   Payoffs: S(100/40), D(0/100).
          *   Threshold: 0.375.
          *   Test A (Free): Sens 0.3, Spec 0.8. Max Post 0.333. Value 0.
          *   Test B (Cost 8): Sens 0.9, Spec 0.7. Max Post 0.5. Value 9.03. Net +1.03.
          *   Test C (Cost 9): Sens 0.8, Spec 0.7. Dominated.
          *   Test D (Cost 2): Sens 0.9, Spec 0.4. Max Post 0.428. Value 4.6. Net +2.6.

  7.  **Drafting the Content:**

      *   Structure: Scenario, Numbers, Timeline, Phase 2, Debrief, Troubleshooting, Limitations.
      *   Tone: Professional, instructional, ready-to-use.
      *   Ensure the "Good's Theorem" name is withheld until debrief.
      *   Ensure the Phase 2 break is clear.

  8.  **Refining Phase 2:**
      *   Rule: "Pre-commitment."
      *   Instruction: "You must submit your Action (Stockpile/Don't) *before* you purchase any tests. You may buy tests, but you cannot change your Action."
      *   Outcome: Tests have 0 value. Costs are sunk losses.
      *   This perfectly illustrates the "Re-optimization" condition.

  9.  **Troubleshooting Details:**
      *   *EBM Frame:* Students want p-values. Remind them: "We aren't testing truth, we are choosing actions."
      *   *Priors:* Enforce the 0.25. "For this game, the CDC says 25%."
      *   *Accuracy Bias:* Highlight Test A (Free) vs Test B (Costly).

  10. **Limitations:**
      *   Common Prior assumption.
      *   Risk Neutrality (Points = Utility).
      *   Single Decision (Theorem is often iterative).
      *   Transparency (In real life, test characteristics are uncertain).

  11. **Final Review against constraints:**
      *   90 mins? Yes.
      *   20 students? Yes (5 teams).
      *   No "Value of Information" name until end? Yes.
      *   Specific test types included? Yes.
      *   Phase 2 break? Yes.
      *   Math checked? Yes.

      *Self-Correction on Test D:* The prompt asks for "noisy indication of whether one of the expensive tests would come out positive".
      *   My Test D design above is just another test on State.
      *   To match the prompt exactly: Test D predicts Test B's result.
      *   If Test B is "Gold Standard", Test D is "Rapid Screen".
      *   If D is +, B is likely +.
      *   This creates the "Sequence" question. Should I buy D, and *then* decide on B?
      *   The game structure is "Market Open" (buy simultaneously).
      *   To allow the "Sum of Values" question, they can buy both.
      *   If D predicts B, then B adds little value if you have D.
      *   I will define Test D as having a high correlation with Test B's outcome, rather than calculating complex conditional probabilities in the prompt text (which might overwhelm). I will provide the *logic* in the teacher notes.
      *   Actually, for the *students*, just giving them the Sens/Spec relative to the State is easier. The *Debrief* reveals they were correlated.
      *   Wait, the prompt says "one cheap screening test whose entire content is a noisy indication of whether one of the expensive tests would come out positive".
      *   I should define it that way in the materials.
      *   "Test D does not detect the virus directly. It detects the chemical marker that Test B looks for."
      *   I will simplify the math for the students (give them P(D+|B+) etc) but for the *Teacher Key*, I need to ensure the EV works.
      *   To keep the prompt clean, I will define Test D's properties relative to the State (Sens/Spec) but *describe* it narratively as a proxy for B. The mathematical property (sub-additivity) holds if they are correlated. I will ensure the Sens/Spec I calculated earlier (0.9/0.4) creates the value, and note in the debrief that D and B are correlated, hence Value(B+D) < Value(B) + Value(D).

      *Wait, one more check:* "The same test that was worth buying should stop being worth buying [in Phase 2]".
      *   In Phase 2 (Pre-commitment), *no* test is worth buying.
      *   So Test B (worth buying in P1) is not worth buying in P2. Condition met.

      *Let's write it.*
