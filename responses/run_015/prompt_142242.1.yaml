  # Session Design: The Price of Knowing

  **Module:** Evidence and Policy (Master's Level)
  **Time:** 90 Minutes
  **Students:** 20 (Philosophy & Public Health)
  **Goal:** Demonstrate Good's Theorem (Value of Information) experientially before naming it.

  ---

  ## 1. The Scenario & Numbers (Teacher's Key)

  **Context:** A novel respiratory pathogen is circulating. Your team advises the Health Ministry.
  **Decision:** **Stockpile** Vaccine ($A_S$) or **Don't Stockpile** ($A_D$).
  **States:** **Epidemic** ($S_E$) or **No Epidemic** ($S_N$).
  **Official Prior:** $P(S_E) = 0.25$ (Provided by CDC for the game).

  **Payoff Table (Points):**

  | State \ Action | Stockpile ($A_S$) | Don't Stockpile ($A_D$) |
  | :--- | :---: | :---: |
  | **Epidemic ($S_E$)** | 100 (Lives saved, cost incurred) | 0 (Disaster) |
  | **No Epidemic ($S_N$)** | 40 (Wasted budget) | 100 (Optimal) |

  **Baseline Expected Utility (No Test):**
  *   $EU(A_S) = 0.25(100) + 0.75(40) = 25 + 30 = 55$
  *   $EU(A_D) = 0.25(0) + 0.75(100) = 75$
  *   **Optimal Default:** Don't Stockpile ($A_D$). **Baseline Score: 75.**
  *   **Decision Threshold:** You switch to Stockpile only if $P(S_E) > 0.375$.
      *(Calculation: $100p + 40(1-p) > 100(1-p) \Rightarrow 60p > 40 \Rightarrow p > 2/3$? No. $100p + 40 - 40p > 100 - 100p \Rightarrow 60p + 40 > 100 - 100p \Rightarrow 160p > 60 \Rightarrow p > 0.375$)*.

  **The Test Market:**
  Each team starts with **100 Points**. Test costs are deducted from this endowment. Payoffs are added to the remainder.

  | Test | Cost | Sensitivity $P(+|S_E)$ | Specificity $P(-|S_N)$ | Design Intent |
  | :--- | :---: | :---: | :---: | :--- |
  | **Alpha** | **0** | 0.30 | 0.80 | **Free & Worthless.** Max post-prob on (+) is 0.33. Never changes action. |
  | **Beta** | **8** | 0.90 | 0.70 | **Expensive & Valuable.** Max post-prob on (+) is 0.50. Changes action. Net Value +1.03. |
  | **Gamma** | **9** | 0.80 | 0.70 | **Dominated.** Worse accuracy than Beta, higher cost. |
  | **Delta** | **2** | 0.90 | 0.40 | **Cheap Screen.** Noisy proxy for Beta. Max post-prob 0.43. Changes action. Net Value +2.60. |

  **Expected Values (EV) with Tests:**
  *   **Alpha:** $EV = 75$. Net Gain = $0 - 0 = 0$.
  *   **Beta:** $EV = 84.03$. Net Gain = $84.03 - 75 - 8 = \mathbf{+1.03}$.
  *   **Gamma:** $EV \approx 82.5$. Net Gain = $82.5 - 75 - 9 = \mathbf{-1.5}$.
  *   **Delta:** $EV \approx 79.6$. Net Gain = $79.6 - 75 - 2 = \mathbf{+2.6}$.
  *   **Beta + Delta:** Due to correlation (Delta predicts Beta), combined EV < Sum of individual EVs. (Sub-additivity).

  ---

  ## 2. Materials & Roles

  *   **Rooms/Space:** One large room. Teams can huddle.
  *   **Handouts:**
      1.  **Decision Sheet:** Payoff table, Prior, Test Menu.
      2.  **Order Form:** Checkboxes for tests, space to write Final Decision.
      3.  **Result Envelopes:** 5 envelopes (one per team) containing the "True State" for the round (3 x No Epidemic, 2 x Epidemic, shuffled).
  *   **Roles:**
      *   **Instructor:** Market Maker & Banker.
      *   **Students:** 5 Teams of 4 (Epidemiologist, Economist, Ethicist, Director).

  ---

  ## 3. Timeline (90 Minutes)

  ### Phase 1: The Rational Market (45 Minutes)

  *   **00-05: Setup.** Distribute teams and handouts. Explain the scenario. Emphasize: *"Your goal is to maximize your team's final point score. You start with 100 points."*
  *   **05-10: The Prior.** Establish the Official Prior (0.25). Explicitly state: *"For the purpose of this exercise, this is the truth. Do not argue the prior."*
  *   **10-25: Market Open.** Teams discuss and fill out Order Forms.
      *   They select tests (check boxes).
      *   They pay costs (deduct from 100).
      *   **Crucial:** They do *not* write their decision yet.
      *   Instructor collects forms, calculates costs, hands back "Test Results" (generated by you based on the True State and Test characteristics—see *Simulation Note* below).
      *   *Simulation Note:* To save time, do not roll dice for every team. Pre-generate 5 sets of results consistent with the probabilities. E.g., if Team 1 has State $S_N$, and they bought Beta, 70% chance of Negative result. Hand them a card saying "Beta: Negative".
  *   **25-35: Decision & Reveal.** Teams see results, decide (Stockpile/Don't), and submit. Reveal True State. Calculate Scores.
  *   **35-45: Phase 1 Debrief (Brief).** Announce winners. Ask: *"Who bought Alpha? Why? Who bought Beta? Why?"* Do not explain the theory yet.

  ### Phase 2: The Constraint (30 Minutes)

  *   **45-50: Rule Change.** Announce: *"New Directive from the Ministry. Due to logistical delays, you must commit to your Action (Stockpile/Don't) **before** you receive any test results. You may still buy tests, but you cannot change your decision based on them."*
  *   **50-60: Market Open 2.** Teams fill out new Order Forms.
      *   They must write the Decision *first*.
      *   Then select tests.
      *   Instructor processes results (which are now irrelevant to the decision).
  *   **60-65: Scoring.** Calculate scores.
      *   *Outcome:* Teams that bought tests will have lower scores than those who bought nothing (since tests cost points but couldn't change the action).
  *   **65-75: The Reveal.** Ask: *"Who bought Beta this time? How did it perform?"* (It should have lost points).

  ### Phase 3: The Theory (15 Minutes)

  *   **75-90: Debrief & Mapping.**
      *   Name the result: **Good's Theorem** (or Value of Information).
      *   Map the experience to the math.
      *   Discuss the failure in Phase 2.

  ---

  ## 4. Debrief Guide: Mapping Experience to Theory

  **1. The Currency of Decision (Test Alpha)**
  *   *Observation:* Some teams took Alpha because it was free. Some ignored it.
  *   *Theory:* Information has value only if it changes the action. Alpha was accurate (Sens 0.3/Spec 0.8) but never pushed the probability past the decision threshold (0.375).
  *   *Takeaway:* Accuracy $\neq$ Value.

  **2. Re-optimization (Phase 1 vs. Phase 2)**
  *   *Observation:* Beta made money in Phase 1, lost money in Phase 2.
  *   *Theory:* The theorem guarantees $EU(Info) \ge EU(None)$ **only if** the agent re-optimizes the action after seeing the signal ($max_a EU(a|result)$).
  *   *Takeaway:* In Phase 2, you were forced to commit *ex-ante*. The information was useless because you were forbidden from using it to update your choice. The guarantee lapses when you cannot or will not change your mind.

  **3. Sub-additivity (Beta + Delta)**
  *   *Observation:* Teams that bought both might not have done twice as well.
  *   *Theory:* Value of Information is generally sub-additive. If Delta tells you what Beta is likely to say, buying Beta adds less marginal value.
  *   *Takeaway:* More tests $\neq$ More value.

  **4. The Name:**
  *   Reveal "Good's Theorem" / "Expected Value of Sample Information (EVSI)".
  *   Explain that they just derived the condition for rational ignorance: it is rational to ignore free information if it cannot change your action.

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. "Bidding for Accuracy"**
  *   *Symptom:* Teams buy Gamma (Dominated) because 0.8/0.7 sounds "scientific" without checking the cost/benefit against Beta.
  *   *Fix:* In the debrief, put Gamma and Beta side-by-side on the board. Show the "Cost per Unit of Decision Change."

  **2. "Free is Good" (The Alpha Trap)**
  *   *Symptom:* Teams feel virtuous about taking the free test.
  *   *Fix:* Ask: *"Did anyone's decision change after seeing Alpha's result?"* If no, the cost was 0, but the *time* spent processing it was an opportunity cost. Highlight that in policy, "free" data often delays decisions.

  **3. "The EBM Frame" (Hypothesis Testing)**
  *   *Symptom:* Philosophy/Health students ask: *"What is the p-value?"* or *"Is the result significant?"*
  *   *Fix:* Intervene immediately. *"We are not testing a null hypothesis. We are choosing an action. A 'significant' result that doesn't change the action is worthless here."*

  **4. "Prior Disagreement"**
  *   *Symptom:* "25% is too low, it's clearly 50%."
  *   *Fix:* Enforce the "Official Prior" rule. *"In policy, you often inherit priors from models you didn't build. Play the hand you're dealt."* In the debrief, acknowledge that with different priors, Alpha might have become valuable (if their personal threshold was lower).

  **5. "Cornering the Market"**
  *   *Symptom:* Teams talk to each other.
  *   *Fix:* Separate teams physically. Information asymmetry is part of the game, but collusion ruins the comparison.

  ---

  ## 6. Limitations: What the Game Cannot Teach

  You must supply these caveats verbally; the game structure hides them.

  **1. The Single Agent Assumption**
  *   *Theorem:* Assumes one agent with one prior.
  *   *Room:* 20 students with 20 priors.
  *   *Loss:* The theorem guarantees *you* won't be worse off. It does not guarantee *social* welfare. If everyone buys Beta, the market might crash, or public panic might ensue. The game treats points as private utility; policy is often public good.

  **2. Risk Neutrality**
  *   *Theorem:* Maximizes Expected Utility.
  *   *Room:* Students maximize Points.
  *   *Loss:* In real public health, we are often risk-averse (Minimax Regret). A 1% chance of disaster might outweigh a 99% chance of high points. Phase 2 touches on this, but true risk aversion isn't modeled in the scoring.

  **3. Known Test Characteristics**
  *   *Theorem:* Assumes $P(Test|State)$ is known.
  *   *Room:* I gave you the numbers.
  *   *Loss:* In reality, sensitivity/specificity are uncertain. "Uncertainty about the test" adds a layer of complexity (Value of Information about the Test) that this game skips.

  **4. The "True" State**
  *   *Theorem:* Expectation taken over the agent's prior.
  *   *Room:* I assigned a "True State" for scoring.
  *   *Loss:* Good's Theorem holds *in expectation* before the result. A team can buy Beta, get a misleading negative, make the wrong call, and lose points. They might conclude "Info was bad." You must correct this: *"You made the rational choice. You got unlucky. The theorem is about the ex-ante expectation, not the ex-post outcome."*

  ---

  ## 7. Instructor's Cheat Sheet (For Result Generation)

  To run the game smoothly without rolling dice for 5 teams x 4 tests:

  **Pre-prepare 5 "State Packets":**
  *   **Packet 1 (State: No Epidemic):**
      *   Alpha Result: Negative (80% chance)
      *   Beta Result: Negative (70% chance)
      *   Delta Result: Negative (60% chance)
  *   **Packet 2 (State: No Epidemic):**
      *   Alpha Result: Negative
      *   Beta Result: Positive (30% false positive)
      *   Delta Result: Positive
  *   **Packet 3 (State: Epidemic):**
      *   Alpha Result: Negative (70% false negative)
      *   Beta Result: Positive (90% chance)
      *   Delta Result: Positive (90% chance)
  *   **Packet 4 (State: Epidemic):**
      *   Alpha Result: Positive
      *   Beta Result: Positive
      *   Delta Result: Negative (10% false negative)
  *   **Packet 5 (State: No Epidemic):**
      *   Alpha Result: Positive (20% false positive)
      *   Beta Result: Negative
      *   Delta Result: Negative

  *Hand the packet corresponding to the team's assigned state. If they didn't buy a test, ignore that card.*

  **Final Tip:** When revealing the winner, do not congratulate them on being "right." Congratulate them on "maximizing expected value." This reinforces the decision-theoretic frame over the truth-seeking frame.
