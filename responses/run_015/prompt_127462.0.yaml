  There is a single coherent principle that captures your verdicts, provided we accept that "historical actor" is not an intrinsic property of a force but a relational one dependent on the **explanatory domain** and the **specificity of the causal constraint**.

  ### The Principle of Generative Specificity

  **Statement:** A non-human force counts as a genuine historical actor if and only if its specific physical or biological properties **generatively constrain the qualitative form** of a historical outcome in a way that pre-existing structural conditions could not have produced alone. It counts as a background condition if it merely **intensifies the timing or magnitude** of a structural trajectory whose qualitative form is determined by human institutional mediation.

  **Crucial Corollary (Domain Relativity):** Actor status is domain-specific. Non-human forces are more likely to satisfy Generative Specificity in **material, cultural, or demographic domains** (where physical constraints dominate) than in **political-structural domains** (where interpretive agency dominates).

  ---

  ### Mapping the Verdicts

  1.  **The Black Death (14th C):**
      *   **Verdict:** Background.
      *   **Clause:** *Intensification vs. Form.* The pathogen intensified labor scarcity (magnitude), but the *end of feudalism* (qualitative form) was determined by human legal and institutional renegotiation.
      *   **Domain:** Political-Structural.

  2.  **Laki Eruption (1783):**
      *   **Verdict:** Background.
      *   **Clause:** *Intensification vs. Form.* The volcano caused scarcity (magnitude), but the *Revolution* (qualitative form) was determined by political interpretation and organization.
      *   **Domain:** Political-Structural.

  3.  **Tambora (1815):**
      *   **Verdict:** Actor (Cultural), Background (Political).
      *   **Clause:** *Domain Relativity.* In literary history, the specific atmospheric conditions *generatively constrained* the setting and tone of *Frankenstein* (Form). In political history, it was merely a stressor (Magnitude).
      *   **Domain:** Split (Cultural vs. Political).

  4.  **1918 Influenza:**
      *   **Verdict:** Actor.
      *   **Clause:** *Generative Specificity.* The virus's *age-specific mortality* created a specific demographic gap (young men) that structural conditions alone would not have produced. This directly shaped the *gendered form* of labor entry, not just the volume of labor.
      *   **Domain:** Demographic/Social.

  5.  **Maya Drought (900 CE):**
      *   **Verdict:** Neither (Hybrid).
      *   **Clause:** *Domain Tension.* The drought generatively constrained the *mode of collapse* (rapid abandonment of lowlands = Material Form), but not the *fact of state fragmentation* (Political Form). Your ambivalence reflects the collision between the Material and Political domains.
      *   **Domain:** Split (Material vs. Political-Structural).

  6.  **536 CE Compound Event:**
      *   **Verdict:** Actor.
      *   **Clause:** *Synergistic Threshold.* While individual shocks might be mere intensifiers, the *compound interaction* crossed a systemic mortality/agricultural threshold that neither could reach alone. This creates a novel qualitative state (systemic shock) rather than an intensified trend.
      *   **Domain:** Systemic/Material.

  ---

  ### Prediction: The 1876–79 El Niño Famine

  Applying the Principle of Generative Specificity yields a **split verdict** analogous to Tambora and the Maya case:

  1.  **As a cause of Crop Failure:** El Niño is an **Actor**. The specific oceanic-atmospheric teleconnections generatively constrained the harvest failure in ways local agriculture alone would not have produced (Material Domain).
  2.  **As a cause of Famine Mortality:** El Niño is **Background**. Following the logic of Laki and the Black Death, the *mass death* (the "Famine" as a historical event) was determined by colonial policy, grain exports, and institutional mediation (Political-Structural Domain). The El Niño intensified the scarcity, but human institutions determined the lethal form of the outcome.

  **Final Verdict:** If your historical question is "Why did the crops fail?", El Niño is an actor. If your question is "Why did millions die?" (the standard historical framing of the 1876 famine), El Niño is a background stressor, and colonial political economy is the actor.

  ---

  ### The Least Comfortable Case

  The case my account handles least comfortably is the **536 CE Compound Event**.

  **Reasoning:** The "Synergistic Threshold" clause required to validate your 536 verdict risks undermining the **Intensification vs. Form** distinction in the other cases. The Black Death was also a compound stressor (pathogen + existing malnutrition/social tension) that crossed a mortality threshold. To maintain consistency, one must argue that the 536 *volcanic-plague* synergy is qualitatively different from the *pathogen-structure* synergy of the Black Death.

  This distinction rests on the idea that 536 was a *physical* threshold (sunlight/temperature/biology) precluding human mediation, whereas Black Death allowed for *institutional* mediation (renegotiation). While this holds theoretically, it is the weakest point of the principle: it requires a sharp line between "physical thresholds that bypass agency" and "biological thresholds that invite agency," which history often blurs. Your intuition that this might be a "principled exception" is correct; it is the stress point where the principle is most vulnerable to collapse into environmental determinism.
