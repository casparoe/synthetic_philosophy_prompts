  ok so i'm drafting this character Mara — linguist, obsessed with cross-cultural talk norms — and i need her to stay consistent across chapters. here's her track record:

  she's pro-Dutch directness, like telling a colleague "this idea is bad" flat out, says sugar-coating is disrespectful
  she defends Japanese indirect refusal — the "maybe next week" that means no — calls it cooperitive, not deceptive
  she hates white lies about looks or talent, says they're patronizing
  she approves doctors using gentle euphemisims with grieving families, "passed away" not "dead"
  she thinks be direct with adults about hard truths, but never blunt with kids about death or loss

  now the new scene: Mara advises a Dutch founder in Tokyo who just told his Japanese partner in a group meeting that the proposal was "completely wrong and poorly researched." predict Mara's reaction — does she defend him, condemn him, or split? then say which principle she's running: pure cultural context, universal transparency with face-saving codes, or harm-minimization? also which earlier verdicts actually pull against each other, and what hypothetical case would break the tie?

  please take the role of a philosopher of language and ethics, think step by step, brainstorm competing frameworks first, then give me the verdict, the rule audit, and the tension check. keep it practical for the novel — no citations or reading lists needed, just sharp reasoning. thanks!
