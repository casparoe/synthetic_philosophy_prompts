answer: |-
  Here is the breakdown of Mara's ethical framework, analyzed through the lens of linguistic pragmatics and moral philosophy.

  ### 1. Framework Brainstorming
  Before locking in her reaction, we need to map the competing ethical systems vying for control in her head.

  *   **System A: Radical Gricean Cooperation.** (Tell the truth, be clear, be relevant). This drives her Dutch directness and her hatred of white lies. She believes obscuring truth treats the listener as incompetent.
  *   **System B: Politeness Theory (Brown & Levinson).** (Protect "Face"). This drives her defense of Japanese indirectness and medical euphemisms. She recognizes that social survival sometimes requires ambiguity to prevent shame.
  *   **System C: Vulnerability Calculus.** (Who holds the power? Who is hurting?). This is the tie-breaker. She allows opacity *only* when the listener is vulnerable (grief, childhood, social exile). She demands transparency when the listener is an equal agent (colleagues, vanity checks).

  **The Synthesis:** Mara does not believe in "Truth" as an absolute object. She believes in **Truth as a Delivery System.** If the truth destroys the receiver's ability to function (shame, grief, developmental overwhelm), the delivery must be modified. If the truth empowers the receiver (feedback, reality checks), the delivery must be sharp.

  ### 2. The Verdict: Scene Reaction
  **Prediction:** Mara **condemns the execution, but validates the intent.** She creates a "Split."

  She will not defend the Dutch founder publicly (that would isolate the Japanese partner further), but in private, she will tell the founder he committed a "pragmatic failure." She will argue that by being direct in a *group setting*, he didn't offer "honest feedback"; he inflicted "public shame."

  **The Principle She Is Running:**
  **Harm-Minimization (specifically: Relational Dignity).**
  She is not running *Pure Cultural Context* (otherwise she wouldn't hate white lies). She is not running *Universal Transparency* (otherwise she wouldn't like euphemisms). She is minimizing harm to the *relationship channel*.
  *   **Why:** In the Dutch context, directness minimizes harm (saves time, respects competence). In the Japanese context, public directness maximizes harm (loss of face, group ostracization). Mara prioritizes the *effect* of the speech act over the *intent* of the speaker.

  ### 3. Rule Audit: Where the Contradictions Live
  To keep her consistent, you need to know where her logic is fragile. Here are the two internal conflicts in her track record:

  **Conflict A: The "Competence" Contradiction**
  *   **Verdict 1:** She loves Dutch directness ("This idea is bad") because it treats colleagues as **competent adults** who can handle critique.
  *   **Verdict 2:** She loves Japanese indirectness ("Maybe next week") because it treats partners as **social beings** who need harmony.
  *   **The Friction:** In the new scene, the Dutch founder treats the Japanese partner as a *competent adult* (Verdict 1). Mara condemns him because she switches to Verdict 2.
  *   **Consistency Fix:** Mara must explicitly state that **Context dictates the definition of Competence.** In Tokyo, "competence" includes knowing how to maintain group harmony. By ignoring that, the Dutch founder proved *he* was the incompetent one, not the partner.

  **Conflict B: The "Patronizing" Contradiction**
  *   **Verdict 3:** She hates white lies about looks/talent because they are **patronizing** (lying to protect ego).
  *   **Verdict 4:** She approves doctors using euphemisms ("Passed away") because they are **protective** (softening blow for grief).
  *   **The Friction:** Both involve lying/softening truth to protect feelings. Why is one patronizing and the other kind?
  *   **Consistency Fix:** **Agency.**
      *   *White Lies:* The listener asks for validation. Lying steals their agency to improve or accept reality. (Harmful).
      *   *Grief Euphemisms:* The listener is in shock. Lying/softening buys them time to process so they *regain* agency later. (Helpful).
      *   *Application to Scene:* The Dutch founder stripped the Japanese partner of agency by cornering him publicly. He couldn't respond without causing a scene. That makes it patronizing/aggressive, not honest.

  ### 4. The Tension Check: The Tie-Breaking Hypothetical
  To test Mara's limits in a future chapter, use this case. It pits her love of Directness against her love of Harm-Minimization.

  **The Hypothetical:**
  A Japanese engineer knows a safety component is flawed. Company culture dictates he cannot tell his Dutch boss directly "This is dangerous" without humiliating the boss who designed it. He hints at it indirectly ("Perhaps we review the stress tests again?"). The Dutch boss, following Mara's advice on "trusting local norms," waits for a direct report. The machine fails. No one is hurt, but the product is ruined.

  **The Question:**
  Does Mara blame the engineer for not being direct enough (violating Safety/Truth), or does she blame the boss for not reading the air (violating Cultural Context)?

  **Why This Breaks the Tie:**
  *   If she blames the **Engineer**: She admits there is a **Universal Truth Standard** that overrides culture (Safety > Face). This weakens her defense of Japanese indirectness.
  *   If she blames the **Boss**: She admits **Context is King**, even if it leads to material failure. This strengthens her linguistic relativism but makes her seem impractical in high-stakes business.

  **Recommendation for the Novel:**
  Have Mara side with the **Engineer**, but with a caveat. She argues that *high-stakes truth* (safety/death) creates a new category that overrides "face." This refines her principle: **Harm-Minimization applies to *emotional* harm, not *physical* or *existential* harm.** This keeps her consistent: she allows euphemisms for grief (emotional), but would demand directness for a failing brake pad (physical).

  ### Summary for Drafting
  *   **In the Scene:** Mara pulls the Dutch founder aside. She tells him: "You weren't honest. You were lazy. You used your culture's shortcut in a room that speaks a different language. That's not transparency; that's violence."
  *   **Her Core Rule:** Truth is only virtuous if the listener is capable of receiving it without losing their standing or sanity.
  *   **Her Weakness:** She struggles when "standing" (face) conflicts with "safety" (truth). Use that for her character arc.
