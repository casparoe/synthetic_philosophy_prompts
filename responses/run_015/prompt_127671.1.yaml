  **End-words:** The six terms anchoring the sestina are **world**, **start**, **cell**, **mind**, **signal**, **time**. These correspond to the six links in the heuristic chain (habitable planet, abiogenesis, unicellular life, complexity/intelligence, communicative transmission, temporal window).

  **The Form as Argument:** The sestina's characteristic permutation of end-words mirrors the commutativity of multiplication. In stanzas 1–4, the words shuffle positions without altering the stanza's structural integrity, subtly suggesting that reordering the factors changes nothing about the product. The risk lies not in the order, but in the assumption that allows them to be multiplied at all.

  **The Envoi Collapse:** The three-line envoi breaks the six-stanza pattern, cramming all six end-words into three lines. This formal compression represents the mathematical collapse: the six "independent" links are revealed as measurements of a single shared parameter (the "one rate" mentioned in lines 2 and 3 of the envoi).

  **Technical Claims Encoded:**
  *   **Jensen's Inequality:** Stanza 6, lines 3–4 ("The error grows larger... Not smaller") references the fact that the gap between the product of means and the mean of the product widens as more links are added to the chain.
  *   **Positive Association:** Stanza 6, line 6 ("Assumed independence undercounts the world") encodes the insight that if links are positively correlated, the independence assumption yields a lower bound, making the presumption a non-neutral choice.
  *   **Partition Relativity:** The envoi's opening line ("The partition shapes the hope...") acknowledges that independence is relative to how the problem is carved up.
  *   **Relocation of Ignorance:** The final line ("Where we park ignorance...") captures the idea that conditioning on a shared parameter does not eliminate correlation but relocates the uncertainty into the prior distribution over that parameter. The "shape" of that parking spot is what the final number actually describes.
