answer: |-
  Right, so let's sidestep the usual Rylean trench warfare for a moment and look at the clockmaker's hands. She's got what we'd call procedural fluency—she can restore the escapement blindfolded, no bother. But the tricky bit is the counterfactual robustness. You swap the brass for aluminium, and she adjusts her grip instantly. She doesn't pause to calculate density or friction coefficients. She just... feels it.

  Now, traditionally, we assume robustness—the ability to handle novel situations without crashing—requires knowing-that. You'd think you need the theory to predict how the new material behaves. But she hasn't got the theory. So, does she actually have robustness? It looks like she does. Her skill isn't brittle; it generalises to materials she's never touched before. But if intellectualism says knowing-how is just knowing-that in a practical mode, then she must possess the propositions ("aluminium is softer") implicitly, even if she can't articulate them.

  Here's the rub: if the adjustment is purely tactile feedback, is there actually a proposition involved? Or is her nervous system modelling the physics without representing it as truth-apt content? If the distinction between fluency (doing the thing) and robustness (doing the thing when variables change) collapses, then skill is just one big lump of disposition. But if they come apart, we might find cases where someone is fluent but brittle (rote learning) versus fluent and robust (expertise). The clockmaker has both. The intellectualist must claim she knows the truths but can't speak them. The pragmatist says she knows nothing *that*, she just copes.

  I reckon the distinction holds, but it breaks the intellectualist's reduction. You can't call it "knowing-that" if there's no "that" to be found, even practically. It's more like dynamic coupling with the environment. The intellectualist might grumble that this is just hidden theory, but that stretches the definition of "theory" until it snaps. There's a difference between representing a rule and embodying a sensitivity.

