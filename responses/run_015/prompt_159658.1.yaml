  **TO:** Board of Directors, Ledger Street Arts Center
  **FROM:** [Your Name]
  **DATE:** October 14
  **SUBJECT:** Decision Memo: Restricted Bequest & City Match Allocation

  **Recommendation**
  I recommend we fund **Nine Portraits** in full ($80,000 combined bequest and city match). This project best balances the donor's restriction (art as propaganda for Black freedom), the city's requirement (peer-assessed artistic merit), and our 501(c)(3) legal constraints.

  **Rationale**
  The donor's restriction invokes Du Bois: art must be propaganda, but it must also be beautiful. *Nine Portraits* satisfies the "beauty" criterion most securely; the photographer's work is in museum collections, satisfying the city's peer panel. Regarding propaganda, we should adopt the distinction between *conversion* (persuading outsiders) and *armoring* (stiffening community resolve). While *The Red Line* aims for conversion, *Nine Portraits* functions as armoring propaganda. By centering oral histories of displacement, it validates the community's lived experience and legitimacy without reducing the work to a political leaflet. This avoids the 501(c)(3) risk of direct advocacy while honoring the bequest's intent.

  **Timeline & Conditions**
  *   **Board Vote:** Thursday, the 16th.
  *   **Contract Execution:** By the 30th.
  *   **Installation:** Complete by October 31.
  *   **Review Point:** A mid-point review on August 15 to verify portrait selection and oral history content align with our mission before final printing.

  **Policy on Advocacy Mechanisms (QR Codes & Data)**
  Regarding the mechanisms proposed by other finalists: We cannot approve the QR code linking to a tenants' union hotline (*The Red Line*) nor the handover of participant contact lists (*The Rent Chorus*).
  1.  **QR Codes:** Linking public art directly to an advocacy organization creates excessive risk for our tax-exempt status. Future projects may link to educational resources, but not organizing hotlines.
  2.  **Data Privacy:** We cannot facilitate the transfer of resident data to third-party organizations. Participant privacy must be retained by Ledger Street.

  **The Strongest Rejected Case: The Rent Chorus**
  The most compelling alternative was *The Rent Chorus*. Its strength lies in the inseparability of form and message; the art *is* the community speaking, which fulfills the Du Bois mandate more perfectly than static portraits. It avoids the "infographic" risk of the mural and the passivity of traditional photography.

  However, we must reject it due to the **beauty constraint**. The city requires artistic merit assessment before funding. With *The Rent Chorus*, the aesthetic properties do not exist yet; they are contingent on 200 resident recordings. We cannot assess the beauty of a work that is unknowable until completion. To accept this would violate the city match agreement. For future unrestricted funds, we might consider a milestone-based contract where final payment depends on a successful aesthetic review of the rough cut, but for this cycle, we must prioritize proven artistic execution.

  **Next Steps**
  If approved Thursday, staff will draft the contract with the conditions above. We will inform the other finalists that their proposals were competitive but did not meet the specific compliance criteria for this funding stream.

  **Decision Required**
  Motion to approve funding for *Nine Portraits* subject to the conditions listed above.
