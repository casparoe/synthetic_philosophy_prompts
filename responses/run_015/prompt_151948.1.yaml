  # Activity Design: The Adaptive Vault Game

  ## Setting and Audience
  This activity is designed for a 90-minute upper-division seminar with 16 students. The room should be arranged to allow private decision-making (e.g., desks spaced apart or folders used as screens). The tone is initially framed as a behavioral economics experiment on "algorithmic interaction," not a philosophy thought experiment. No mention of Newcomb, causality, or prediction theory is made until the debrief.

  ## Rules, Roles, and Materials
  **Materials:**
  1.  **Student Booklets:** Each student receives a booklet with 4 pages ( Rounds 1–4). Each page has two checkboxes: **Option Alpha** (Take Vault B only) and **Option Beta** (Take Vault A + Vault B).
  2.  **Token Cards:** Each student receives a stack of 20 physical point cards (value 1 each) to track their own score visibly on their desk.
  3.  **Facilitator Key:** A master sheet for the instructor to track each student's history and calculate the "Model's" prediction for the next round.
  4.  **Envelope Kits:** 16 kits, each containing 4 sealed envelopes (labeled Round 1–4). Inside each envelope are two slots: Slot A and Slot B.
      *   *Constraint:* To save time on distribution, the Facilitator does not distribute envelopes round-by-round. Instead, students hold all 4 envelopes. The **content** is revealed by the Facilitator *after* choices are submitted but *before* envelopes are opened.
      *   *Correction for Physicality:* To ensure the "fixed past" feeling, the Facilitator will announce the content of the envelopes *before* students mark their booklets.
      *   *Revised Flow:*
          1.  Facilitator announces: "For Round 1, the Model predicts everyone is Type Alpha."
          2.  Facilitator announces: "Therefore, Vault B contains 10 points, Vault A contains 1 point." (Written on board).
          3.  Students choose Alpha or Beta privately in booklets.
          4.  Students submit booklets to Facilitator.
          5.  Facilitator calculates Round 2 predictions based on Round 1 choices while students wait (2 minutes).
          6.  Facilitator announces Round 2 contents per student (e.g., "If you chose Alpha last round, your B has 10. If Beta, B has 0").
          7.  Repeat.

  **The Algorithm (The Twist):**
  The "Model" is not omniscient. It is a simple adaptive rule displayed on the board:
  *   **Round 1:** Default Prediction = **Alpha** (Optimistic).
  *   **Rounds 2–4:** Prediction = **Majority Choice of Previous Rounds**.
      *   If you chose Alpha more often than Beta in prior rounds, Model predicts **Alpha**.
      *   If you chose Beta more often (or equal), Model predicts **Beta**.
  *   **Content Rules:**
      *   If Model predicts **Alpha**: Vault B = 10 points, Vault A = 1 point.
      *   If Model predicts **Beta**: Vault B = 0 points, Vault A = 1 point.
  *   **Choice Rules:**
      *   **Option Alpha:** Collect contents of Vault B only.
      *   **Option Beta:** Collect contents of Vault A + Vault B.

  **Payoff Scheme:**
  *   **Symbolic Stakes:** Points accumulate toward a trivial privilege (e.g., the student with the highest total score chooses the topic for the final 10 minutes of discussion).
  *   **Numeric Values:**
      *   **Scenario 1 (Predicted Alpha):** Alpha Choice = 10 pts. Beta Choice = 11 pts (10+1).
      *   **Scenario 2 (Predicted Beta):** Alpha Choice = 0 pts. Beta Choice = 1 pt (0+1).
  *   **Dominance:** Option Beta always yields +1 point over Option Alpha *for the current round's fixed envelope*.
  *   **Correlation:** Students who consistently choose Alpha keep the Model predicting Alpha (getting 10s). Students who choose Beta switch the Model to predicting Beta (getting 0s in B).

  ## Round Structure and Timeline (90 Minutes)

  **0:00–0:15: Setup & Instructions**
  *   Distribute booklets and tokens.
  *   Explain rules neutrally. Emphasize: "The Model updates based on your history. The contents for the current round are determined *before* you choose, based on your *past* choices."
  *   Write the Algorithm and Payoff Table on the board.

  **0:15–0:25: Round 1 (The Honeymoon)**
  *   Facilitator announces: "Round 1 Prediction: Alpha for everyone." (Board: B=10, A=1).
  *   Students choose. Most will choose Beta (Dominance: 11 > 10).
  *   Collect booklets. Tally scores.
  *   *Outcome:* Most students get 11 points. They feel smart.

  **0:25–0:35: Round 2 (The Crash)**
  *   Facilitator calculates predictions based on Round 1. Since most chose Beta, most are now predicted Beta.
  *   Facilitator announces: "If you chose Beta in Round 1, your Round 2 Prediction is Beta (B=0, A=1). If you chose Alpha, Prediction is Alpha (B=10, A=1)."
  *   Students choose.
  *   *Outcome:* The Beta-choosers now face B=0. Alpha choice = 0. Beta choice = 1. They realize their greed killed the golden goose. The Alpha-choosers (few) get 10 or 11.

  **0:35–0:45: Round 3 (The Tension)**
  *   Predictions update. Some students may try to switch back to Alpha to "fix" the model.
  *   Facilitator announces contents based on Round 1+2 history.
  *   *Critical Moment:* A student who switched to Alpha in Round 2 now has a Prediction of Alpha for Round 3. They face the choice: Take 10 (Alpha) or 11 (Beta)? If they take Beta, they maximize now but ruin Round 4.
  *   Collect booklets.

  **0:45–0:55: Round 4 (The Endgame)**
  *   Final round. No future consequences.
  *   Facilitator announces contents.
  *   Students choose. (Rational causal reasoning suggests Beta always, since no Round 5 exists).
  *   Final scoring. Winner announced.

  **0:55–1:30: Debrief**
  *   Transition from game to theory.

  ## Debrief Plan
  **1. Mapping the Experience (15 mins)**
  *   Ask students who switched strategies: "When did you feel the tension?"
  *   Highlight the Round 3 switcher: "In Round 3, your envelope was already fixed based on Rounds 1–2. Did your choice change Round 3's points?" (No). "Then why did you hesitate to take Beta?" (Because it signals 'Beta Type' for Round 4).
  *   **Causal Reasoning:** "The envelope is fixed. I cannot change the past. I should take Beta to maximize current gain." (Matches Causal Decision Theory).
  *   **Evidential Reasoning:** "My choice is evidence of my type. If I take Beta, I am the kind of person the Model predicts Beta for. That means B is empty." (Matches Evidential Decision Theory).

  **2. Addressing Predictable Failures (10 mins)**
  *   **Failure:** "I randomized to fool the algorithm."
      *   **Fix:** Acknowledge this breaks the correlation. Ask: "In the original philosophical problem, can you randomize your will?" This leads to discussion of free will vs. determinism in Newcomb.
  *   **Failure:** "It's just luck/training."
      *   **Fix:** Point out the correlation coefficient. "The Model isn't luck; it's you. Your past choices *are* the evidence."
  *   **Failure:** "I only One-Boxed to build reputation for later."
      *   **Fix:** This is the key distinction. Admit this game is *Iterated* Newcomb.

  **3. Closing the Gap (10 mins)**
  *   **Unreproducible Feature:** The original Newcomb Problem is **one-shot**. There is no Round 4 to protect.
  *   **Facilitator Note:** You must verbally supply the missing link: "Imagine Round 4 doesn't exist. Imagine the Model predicted *this specific choice* based on your psychology, not your history. Would you still leave the 1 point on the table (Vault A) to ensure Vault B is full?"
  *   This forces them to transfer the "evidential pull" they felt in Rounds 2–3 to a single moment where no future leverage exists.

