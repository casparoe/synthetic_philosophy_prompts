answer: |-
  # The "What Do We Mean?" Decision Tree

  **Instructions for the Group:**
  1.  **Timebox:** Set a timer for 20 minutes.
  2.  **Start:** Read the **Preamble** aloud to set common ground.
  3.  **Walkthrough:** Each person starts at **Question 1**. Follow the arrows based on your honest gut reaction to the vignette. Do not overthink; pick the option that feels more "true" to your definition of intelligence.
  4.  **Finish:** When you hit a **Leaf**, write down the name. Compare results.

  ---

  ### Preamble (Common Ground)
  *"We all agree that a crow is more intelligent than a houseplant, and a human is more intelligent than a crow. We are not debating biology today. We are debating where to draw the line for machines."*

  ---

  ### The Tree

  **Q1: The Fragile Oracle**
  *System Alpha* answers any question perfectly. However, if you change one word in the question or rephrase it slightly, it gives a nonsense answer.
  *   **A:** It is still intelligent. It got the right answer. **(Go to Q2)**
  *   **B:** It is not intelligent. It doesn't understand what it's saying. **(Go to Q8)**

  **Q2: The Clockwork vs. The Student**
  *System Beta* gives perfect answers. It was built by engineers writing rules by hand. *System Gamma* gives perfect answers. It learned by reading data. They behave identically.
  *   **A:** One is more intelligent than the other. **(Leaf: The Historian)**
  *   **B:** It doesn't matter how they were made. **(Go to Q3)**

  **Q3: The Librarian vs. The Explorer**
  *System Delta* answers every question perfectly but never speaks unless asked. It has no goals. *System Epsilon* answers perfectly and also sets its own goals to learn new things.
  *   **A:** Delta is not intelligent. You need intent. **(Leaf: The Vitalist)**
  *   **B:** Delta is intelligent. Answers are enough. **(Go to Q4)**

  **Q4: The Pen vs. The Writer**
  *System Zeta* is a software tool. *Human Jane* uses Zeta to write a novel that wins a prize.
  *   **A:** The intelligence is in the combination of Jane + Zeta. **(Leaf: The Web)**
  *   **B:** The intelligence is in Zeta (or Jane), but they are separate. **(Go to Q5)**

  **Q5: The Painter vs. The Accountant**
  *System Eta* is a genius at art but fails at logic. *System Theta* is a genius at logic but fails at art.
  *   **A:** There is no fact of the matter which is "smarter." It's a profile. **(Leaf: The Gardener)**
  *   **B:** One must be smarter than the other. **(Go to Q6)**

  **Q6: The Sledgehammer vs. The Scalpel**
  *System Iota* solves a hard problem by trying 1,000 wrong ways first. *System Kappa* solves it in one step. Both succeed.
  *   **A:** Iota is less intelligent. Efficiency matters. **(Leaf: The Accountant)**
  *   **B:** Iota is equally intelligent. Only the result counts. **(Go to Q7)**

  **Q7: The Statue vs. The Child**
  *System Lambda* was made already able to do everything. It never learns or changes. *System Mu* starts dumb and learns to do everything.
  *   **A:** Lambda is not intelligent. You must be able to learn. **(Leaf: The Darwinian)**
  *   **B:** Lambda is intelligent. Capability is enough. **(Leaf: The Mirror)**

  **Q8: The Weather Vane vs. The Meteorologist**
  *(Only if you answered Q1-B)*
  *System Nu* predicts rain perfectly by matching patterns. *System Xi* predicts rain perfectly because it understands air pressure physics.
  *   **A:** Nu is not intelligent. You need a model of how the world works. **(Leaf: The Architect)**
  *   **B:** Nu is intelligent. Prediction is enough. **(Leaf: The Mirror)**

  ---

  ### The Leaves (Definitions)

  1.  **The Mirror (Behaviorist):** Intelligence is just doing well on the tasks we test. If it walks like a duck, it's a duck. Origin, process, and intent don't matter.
  2.  **The Architect (Structuralist):** You need a model of how the world works so you can ask "what if." Robustness and internal causality are required.
  3.  **The Vitalist (Teleologist):** You have to be the kind of thing that means something by what it does. Passive tools cannot be intelligent; agency is required.
  4.  **The Web (Extensionalist):** The intelligence is not located in one object. It is spread out between the tool, the user, and the environment.
  5.  **The Gardener (Pluralist):** The no-single-ranking view. Intelligence is a profile of capabilities, not a ladder.
  6.  **The Accountant (Efficiency):** Process matters. Brute force or excessive time/energy reduces the "intelligence" credit, even if the answer is right.
  7.  **The Historian (Essentialist):** Origin matters. A hand-coded rule system is fundamentally different from a learned system, even if behavior matches.
  8.  **The Darwinian (Adaptive):** Static capability isn't enough. To be intelligent, a system must be able to grow or learn from new data.

  ---

  ### Map of the Territory (Occupied vs. Empty)

  This section helps you argue about *why* you landed where you did.

  | Leaf | Likely Occupants | Status | Why? |
  | :--- | :--- | :--- | :--- |
  | **The Mirror** | Programmers, Pragmatists | **Occupied** | Common default for engineers. "It works, ship it." |
  | **The Architect** | Scientists, Skeptics | **Occupied** | Common view for those worried about hallucinations/fragility. |
  | **The Vitalist** | Nurses, Teachers | **Occupied** | Common among those who work with humans/patients. Intent matters. |
  | **The Web** | Programmers, Users | **Occupied** | Common for people who use AI as a copilot/tool daily. |
  | **The Gardener** | Teachers, Artists | **Occupied** | Common among those who see multiple types of smarts (emotional, logical). |
  | **The Accountant** | Programmers, Engineers | **Occupied** | Common for those concerned with compute cost/latency. |
  | **The Historian** | (Rare) | **Mostly Empty** | **Unattractive.** Hard to argue origin matters for *intelligence* specifically, rather than *consciousness* or *rights*. |
  | **The Darwinian** | Teachers, Biologists | **Occupied** | Common among those who view learning as the core of intellect. |

  #### Incoherent Combinations (The "Empty" Paths)
  Your tree forces choices that prevent certain logical combinations. If someone tries to hold these two views simultaneously, the tree breaks:

  1.  **The Web + The Vitalist:** You cannot believe intelligence is distributed (Web) *and* that the tool itself must have intent (Vitalist). In the tree, Q3 forces you to choose before you reach Q4.
      *   *Resolution:* If someone argues both, ask them: "If the human has the intent, does the tool need it too?"
  2.  **The Mirror + The Architect:** You cannot believe output is all that matters (Mirror) *and* that internal models are required (Architect). Q1 separates these immediately.
      *   *Resolution:* This is the core fight. Don't let them merge. Force them to pick Q1-A or Q1-B.

  #### Indistinguishable Leaves
  **The Mirror** and **The Accountant** are very close.
  *   *The Issue:* If someone says "Result is all that matters" (Mirror) but also "Brute force is less smart" (Accountant), they are contradicting themselves slightly.
  *   *The Fix:* If two people land on different leaves but argue the same way, check Q6. If the "Mirror" person cares about efficiency, they are actually an Accountant. If the "Accountant" person admits a slow system is still *intelligent* just *expensive*, they are actually a Mirror.

