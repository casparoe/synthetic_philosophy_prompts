  ### Troubleshooting: "I Didn't Land on a Leaf"

  **Scenario 1: "My answers didn't match any of these."**
  *   **Cause:** You are holding a hybrid view (e.g., "Origin matters *only if* it's fragile").
  *   **Fix:** Pick the Leaf that annoys you the *least*. Argue from there. "I'm mostly a Mirror, but I wish I could be a Historian."

  **Scenario 2: "We all landed on The Mirror."**
  *   **Cause:** The group is too pragmatic.
  *   **Fix:** Skip to **Q8** (The Weather Vane) for everyone. Force the group to debate internal models vs. prediction. This usually splits the room.

  **Scenario 3: "We are arguing about the Vignette, not the Choice."**
  *   **Cause:** The fiction isn't holding up (e.g., "A system that fails on rewording isn't actually giving perfect answers").
  *   **Fix:** Invoke the **Magic Clause**. "For the sake of the next 5 minutes, assume the physics of this vignette are true. The system *does* fail on rewording. Does that change your label?"

  ### Facilitator Notes for the 20-Minute Limit
  *   **Minutes 0-2:** Read Preamble & Instructions.
  *   **Minutes 2-12:** Silent walkthrough. Everyone traces their path on paper.
  *   **Minutes 12-20:** Go around the table. State your Leaf. If two neighbors have different Leaves, ask *which Question* split them. Argue only about that Question.
