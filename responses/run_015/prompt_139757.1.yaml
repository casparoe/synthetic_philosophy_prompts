answer: |-
  One. The List

  1.  The criterion must shield clinicians from homicide liability when withdrawing treatment. (Case: The ventilated body meeting brain criteria but continuing to gestate a fetus). Tag: Non-negotiable.
  2.  The criterion must vest property rights and legal status at a specific moment. (Case: Inheritance disputes and criminal causation requiring temporal precision). Tag: Non-negotiable.
  3.  The criterion must permit organ recovery without violating the dead donor rule. (Case: Transplant viability requiring circulatory arrest or brain death). Tag: Non-negotiable.
  4.  The determination of death must not be retroactively rescinded. (Case: The layered declaration proposal creating insurance and inheritance uncertainty). Tag: Non-negotiable.
  5.  The criterion must remain valid despite technologies that restore function. (Case: Extracorporeal neural support restoring brain activity after arrest). Tag: Non-negotiable.
  6.  The criterion must equate death with the permanent loss of consciousness. (Case: The permanently unconscious patient with an intact brainstem). Tag: Preference (Higher-Brain).
  7.  The criterion must equate death with the loss of biological integration. (Case: The brain-dead body maintaining homeostasis via ventilation). Tag: Preference (Whole-Brain/Organism).

  Two. Settled Prejudices

  Several items on the list are not neutral legal desiderata but philosophical commitments disguised as requirements. Requirement 6 is the primary mask for the Higher-Brain camp. If adopted as non-negotiable, it excludes the Whole-Brain and Circulatory criteria entirely, declaring patients with intact brainstems but no cortical function dead, regardless of breathing capacity. This resolves the permanently unconscious case but creates homicide liability for withdrawing treatment from patients who breathe spontaneously, conflicting with Requirement 1.

  Requirement 7 is the counter-prejudice of the Whole-Brain and Organism-as-a-Whole camps. It insists that somatic integration is the essence of life. Taken seriously, this excludes the Higher-Brain criterion and complicates Circulatory criteria. It implies that a body gestating a fetus is not dead, regardless of brain status, potentially blocking organ recovery from brain-dead pregnant patients unless an exception is carved out, which undermines the universality of the statute.

  A third prejudice hides in Requirement 5 regarding the definition of "irreversible." The transplant community often relies on "permanent" cessation (will not restart spontaneously) rather than "strictly irreversible" (cannot be restarted by any means). If we codify Strict Irreversibility to satisfy Requirement 5, we exclude Circulatory criteria entirely in an era of extracorporeal neural support, as the technology makes reversal physically possible. If we cod Permanence, we satisfy organ recovery but risk violating the intuition that death cannot be technologically reversed, alienating the public.

  Three. Jointly Unsatisfiable Subsets

  **Subset A: The Determinate Instant (Req 2) + Strict Irreversibility (Req 5) + Extracorporeal Neural Support.**
  We require death to occur at a determinate instant to settle inheritance and criminal law (Req 2). We also require that death be irreversible even given new technology (Req 5). However, if extracorporeal neural support can restore brain function days after circulatory arrest, then cessation at the instant of arrest was not strictly irreversible. If we declare death at the instant of arrest, we declare a reversible state to be death. If we wait until neural support fails days later to ensure irreversibility, we lose the determinate instant required for legal certainty. You cannot have a fixed time of death that is also biologically robust against future restoration technology. One must yield: either death is a process without a sharp instant, or death is a legal fiction that admits biological reversal.

  **Subset B: Non-Retroactivity (Req 4) + The Layered Declaration.**
  The transplant community proposes a provisional determination of death for organ recovery, rescinded if the patient later shows signs of life. This is explicitly retroactive: the legal status changes based on future facts. Requirement 4 forbids this. Law cannot tolerate a status that is "dead" for the surgeon on Tuesday but "alive" for the insurer on Friday. If the definitive determination goes the other way, the provisional one was a lie. To legislate this is to authorize legal fraud for medical utility. These two requirements are logically mutually exclusive; you cannot have a stable legal status that is subject to retroactive nullification.

  Four. Most Exclusionary Requirement

  **Requirement 5 (Technology Independence/Strict Irreversibility)** does the most work. It rules out any criterion based solely on circulatory cessation if "irreversible" is defined as "physically impossible to reverse." In the presence of extracorporeal neural support, no circulatory arrest is strictly irreversible. This forces the statute to either adopt a Whole-Brain criterion (which the technology also threatens if it restores brain function) or redefine death as "permanent cessation" (won't restart on its own). Adopting Strict Irreversibility effectively bans Donation after Circulatory Death (DCD) and renders the current dual-criterion statute obsolete within a decade. It forces the committee to choose between biological accuracy and medical utility.

  Five. Scorecard

  | Criterion | Liability Shield (1) | Legal Certainty (2) | Dead Donor Rule (3) | Non-Retroactive (4) | Tech Stable (5) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Whole-Brain** | Pass | Pass | Pass | Pass | Fail (ENS restores function) |
  | **Higher-Brain** | Fail (Breathing patients) | Pass | Pass | Pass | Fail (ENS restores consciousness) |
  | **Circulatory (Irreversible)** | Pass | Pass | Fail (Organs damaged) | Pass | Fail (ENS reverses arrest) |
  | **Circulatory (Permanent)** | Pass | Pass | Pass | Pass | Pass (If "won't restart" holds) |
  | **Organism-as-a-Whole** | Pass | Fail (Gradual loss) | Fail (Integration varies) | Pass | Fail (ENS restores integration) |

  *Note: "Pass" indicates alignment with the requirement; "Fail" indicates conflict.*
