      *   No philosophy jargon (no "discursive dilemma", "doctrinal paradox", "premise-based procedure" unless explained simply).
      *   No citations.
      *   Concrete decision.
      *   Address A (fact), B (independence), C (decision).
      *   Address Member 3.
      *   Address Timeline (9 days).

