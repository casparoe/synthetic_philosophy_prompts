      *   Set the future rule.

      *Self-Correction on Decision:* If I recommend "Don't Publish", I might be seen as blocking progress. But the fork threat is real. If I recommend "Publish", I ignore the vote on C and the fork threat. Given the user is a backend dev on a steering committee, stability usually wins. I will recommend deferring.
