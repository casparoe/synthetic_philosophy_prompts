      *Key argument:* The Charter says "Only If". It does not say "If". So even if A&B are true, C can be false. The vote on C is the only one that matters legally. The votes on A&B were advisory. This resolves the paradox legally.

      *Future Rule:* Don't vote on premises bindingly. Vote on the motion. Discuss premises.

      *Member 3:* Note that when the outcome of a technical debate aligns perfectly with one vendor's commercial cycle, we must ensure the decision serves the foundation, not just that vendor.

      *Timeline:* 9 days is too short to resolve the fork threat. Defer.

      *Let's write.*

