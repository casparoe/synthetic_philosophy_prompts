answer: |-
  hey, here's the rundown for the session. the goal is to skip the preamble and drop them straight into the mechanics of the illusion. you want them to feel the friction of making a smooth story out of messy data.

  **activity: the unity protocol**

  **setup (5 mins)**
  don't explain the theory yet. just tell them they're a distributed cognitive system tasked with identifying a target and deciding an action. divide the 18 students into 4 groups (roughly 4-5 ppl each). assign each group a module role:
  1.  **sensory input** (gets visual/auditory data cards)
  2.  **predictive model** (gets expectation/prior cards)
  3.  **language/labeling** (gets semantic/naming cards)
  4.  **executive decision** (gets goal/action cards)

  hand each group a sealed envelope marked "confidential." inside are 3 cards with conflicting info about the same scenario (e.g., "the object in the center").
  *   *sensory* gets: "blurry red shape, vibrating."
  *   *predictive* gets: "context implies stationary tool, safe."
  *   *language* gets: "label: 'live grenade'."
  *   *executive* gets: "priority: minimize risk."

  **the constraint (critical)**
  tell them they can talk, but they cannot show their cards. they can only pass **interface reports**. these reports must be exactly one sentence, written down, and handed to the next group. no qualifiers like "my card says." they have to state it as fact. e.g., "it is a red tool."

  **round 1: negotiation (10 mins)**
  groups pass reports clockwise. sensory → predictive → language → executive. each group has to integrate the incoming sentence with their own hidden card and write a new one-sentence report that smooths over contradictions. if sensory says "vibrating" but predictive says "stationary," predictive has to write a sentence that hides that clash, like "the object is stable."

  **round 2: the unified experience (5 mins)**
  the executive group writes the final "conscious report." this is the only thing that gets read aloud. reward them with a point (or candy) if the report is perfectly coherent and confident. accuracy doesn't matter. smoothness matters.

  **the reveal (5 mins)**
  collect the envelopes. project the original cards on the screen. show them how much contradictory data got deleted to make that one smooth sentence possible. point out where sensory said "vibrating" but the final report said "stable."

  **debrief (rest of seminar)**
  now you hit them with the theory.
  *   **the interface reports** = phenomenal experience (what it feels like).
  *   **the hidden cards** = unconscious processing (the computation).
  *   **the pressure to agree** = the transparency of consciousness (you don't see the editing, just the result).
  *   **the reward for coherence** = evolutionary utility (acting fast is better than acting accurately).

  ask them: "did anyone feel like they were lying?" that feeling is the system suppressing metadata to maintain the user illusion.

  **what'll go wrong**
  someone in sensory is gonna try to peek at the language cards or shout out "my card says red!" stop them gently. that cheating is actually a great teaching moment later—it's like introspection trying to look directly at neural data and failing. also, the executive group might try to dominate. let them, it mirrors how the 'self' feels like it's in charge even when it's just rubber-stamping upstream data.

  **what this misses**
  be honest in the wrap-up. this game simulates the *structure* of the illusion, but it doesn't simulate the *feel*. none of them actually felt fear about the grenade. you can't gamify qualia. the user illusion theory explains the report, not the light inside the screen.

  hope this runs smooth for you. let me know if you need more card scenarios.

