answer: |-
  The slogan "an unjust law is no law at all" is not a single proposition but a conflation of seven distinct claims ranging from trivial semantic stipulations to radical calls for resistance, and your dispute with the judge was primarily about moral obligation disguised as metaphysical classification.

  1.  **The Metaphysical Necessity Claim:** Moral merit is a necessary condition for legal existence in all possible worlds.
      *   **Commitment:** You are making a claim about the fabric of reality, not just human rules; injustice literally destroys legal being.
      *   **Status:** Just plain false or highly controversial in modern jurisprudence; denies the obvious fact that tyrannical regimes produce laws.
      *   **Supports:** You, but at the cost of credibility; the judge will reject this as mystical.

  2.  **The Systemic Incorporation Claim:** Moral merit is a condition of legal validity only because this specific legal system says so (e.g., via a Constitution).
      *   **Commitment:** You are arguing within the system's own rules, not against them; the "moral test" is just another rule like a signature requirement.
      *   **Status:** Substantive and defensible; true in systems with robust judicial review, false in systems without.
      *   **Supports:** The Judge technically (it is a rule about validity), but you practically (if the constitution protects dignity, the ordinance is void).

  3.  **The Judicial Nullification Claim:** Judges are morally and professionally obligated to refuse enforcement of unjust statutes.
      *   **Commitment:** You are making a claim about what officials should do, not what the rule *is*; the law exists but should be treated as null by the bench.
      *   **Status:** Substantive and defensible; aligns with the Radbruch formula's practical application.
      *   **Supports:** You; this validates your intuition that the ordinance shouldn't function, without denying its enactment.

  4.  **The Moral Duty Negation Claim:** Citizens owe no moral obligation of obedience to unjust statutes.
      *   **Commitment:** You are making a claim about conscience, not status; the rule is law, but it lacks moral binding force.
      *   **Status:** Platitude; widely accepted by positivists and natural lawyers alike.
      *   **Supports:** You; this is likely what you *meant*, but you phrased it as a claim about existence.

  5.  **The Active Resistance Claim:** Citizens are morally permitted to actively obstruct or undermine unjust statutes.
      *   **Commitment:** You are claiming a right to revolution or civil disobedience, not just passive non-compliance.
      *   **Status:** Radical; defensible in extreme cases, dangerous if overused.
      *   **Supports:** You; justifies fighting the ordinance beyond mere argument.

  6.  **The Teleological Defect Claim:** Unjust statutes are laws but functionally defective instances of the kind "law," like a blunt knife is a defective knife.
      *   **Commitment:** You are using a functional definition; law has a purpose (guiding conduct morally), and failing that purpose makes it a bad specimen, not a non-specimen.
      *   **Status:** Substantive and defensible (Fuller's view); avoids the binary of "law vs. not law."
      *   **Supports:** Neither fully; it grants the Judge the classification win but gives you the evaluation win.

  7.  **The Rhetorical Reclassification Claim:** Calling it "not law" is purely expressive condemnation, not ontological classification.
      *   **Commitment:** You are using language emotionally to signal that the rule is too wicked to deserve the name, not making a truth-claim.
      *   **Status:** Plausible; explains why people use the slogan despite its logical problems.
      *   **Supports:** Neither; it dissolves the argument by showing you were speaking different languages.

  Regarding the four specific sorting issues you raised:

  1.  **Type of Claim:** The slogan shifts illicitly between Conceptual (Readings 1, 6), Systemic (Reading 2), Adjudicative (Reading 3), and Civic (Readings 4, 5). The confusion arises because Reading 4 (Civic Duty) is emotionally powerful, but people argue for it using Reading 1 (Conceptual) because denying something's existence feels stronger than denying its authority. Your neighbour was arguing Conceptual/Systemic; you were arguing Civic/Moral.

  2.  **Necessity vs. Contingency:** Most people repeating the slogan think they are committed to Reading 1 (Necessary Truth), but what they actually want is Reading 2 (Contingent Truth). If it is only true because a constitution says so (Reading 2), then it is a quirk of that system, and your neighbour wins the theoretical debate: in a system without such a constitution, the unjust law *is* law. The natural law thesis requires Reading 1 to be distinct from positivism, but Reading 1 is untenable. The people who repeat it are usually committed to Reading 1 rhetorically but rely on Reading 2 practically.

  3.  **Test Cases:**
      *   *(i) Unjust but believed just:* Under Reading 1 (Metaphysical), it is not law (objective morality wins). Under Reading 2 (Systemic), it is law until a court strikes it down (institutional fact wins). Under Reading 4 (Duty), it is law but need not be obeyed. The verdict turns on whether you prioritize moral reality or institutional status.
      *   *(ii) Just then became unjust:* Under Reading 1, it ceases to be law the moment it becomes unjust (time-indexed morality). Under Reading 2, it remains law until repealed (time-indexed enactment). This shows Reading 1 creates instability (law vanishes silently), while Reading 2 creates rigidity (unjust law persists).

  4.  **Protein Analogy:** The analogy is useful but cuts against you. A denatured protein is still the same molecule (structure/validity) but lacks function (enzyme activity/obligation). If "law" works like that (Reading 6), then the ordinance *is* law (same molecular structure/enacted correctly) but is non-functional (should not be used/enforced). This hands your neighbour the classification win ("It's law") but hands you the functional win ("It shouldn't be obeyed"). You were trying to say it isn't the molecule; the analogy suggests it is a broken molecule.

  The single reading doing the real work in arguments like yours is Reading 4 (Moral Duty Negation), because that is the practical stakes: whether you must comply. The sub-question you and your neighbour were actually disagreeing about was not whether the ordinance was "law," but whether the label "law" carries an automatic presumption of moral obedience. He assumed "law" implies "ought to be obeyed"; you assumed "unjust" implies "ought not to be obeyed"; you fought over the word "law" to avoid admitting that you both agreed on the morality but disagreed on the vocabulary.
