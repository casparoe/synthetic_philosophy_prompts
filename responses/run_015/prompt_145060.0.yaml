answer: |-
  Good afternoon. For those of you meeting me for the first time, I'm one of [Advisor's] many advisees. Standing here, looking at this room, I'm struck by the unique challenge of today. Half of you are philosophers of language who will spot a theoretical error from the front row. The other half are family and friends who are just happy to be here celebrating a career. Usually, I'd try to bridge that gap by simplifying the ideas. But given who we are honoring, simplifying feels like a betrayal.

  [Advisor] built this department on the idea that words don't just describe the world; they change it. She taught us that saying something is often doing something. And honestly, that makes giving this speech terrifying. Because a retirement symposium is itself a speech act. It's one of those preformative utterances where I might slip up and say "preformative" instead of performative, but the stakes are real.

  Here is the tension: Retirement speeches often try to state facts. We say things like, "You have built a legacy," or "Your work is complete." In philosophical terms, those are constatives. They claim to describe a state of affairs. But there is a risk of infelicity here. If I treat [Advisor]'s career as a closed object—a finished thing sitting in the past—I am actually misfiring. I am describing her work as dead. For anyone who knows her teaching, that is false. Her work isn't a monument; it's a method. It's alive in the way we argue, the way we listen, and the way we teach.

  So, if I treat this speech as a description of her ending, I fail. I have to treat it as an enactment of her continuation.

  Think of it like wedding vows. When someone says "I do," they aren't describing a marriage that already exists; they are creating the union in that moment. The words themselves do the work. Today works similarly. If I simply list her achievements, I'm writing an obituary. But if I speak to her impact on us, right now, I am performing the transition. I am ratifying that while her formal role changes, her influence is not retiring.

  So, I want to be careful with my illocutionary force. I am not here to summarize [Advisor]. I am here to thank her. And in doing so, I want to make sure that the gratitude isn't just a feeling we have, but a commitment we take on. To honor her is not to put her work on a shelf, but to keep using it.

  [Advisor], you taught us that context matters, that sincerity conditions matter, and that what we say shapes what we are. So, on behalf of everyone in this room—the philosophers checking my terminology and the family checking their watches—I want to say this: We are not closing a book today. We are turning the page. Your work continues in us.

  Thank you.
