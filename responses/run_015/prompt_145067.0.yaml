answer: |-
  The sleight of hand is squarely in **Step 4**. It's a classic false dilemma.

  Your character assumes that if a rule isn't a brute physical fact (like a rock or a neuron firing), it must either be a mystical 'skyhook' (something outside nature) or it isn't real at all. She's ignoring the middle ground: that normative rules can be **real patterns** emerging from complex systems. For a Dennettian, a rule of logic or science is real in the same way a software programme is real—it's not made of silicon, but it's not magic either. It's a higher-order phenomenon supported by the physical layer.

  If she wants to keep (1) and (5), she shouldn't drop Step 4 entirely, or the conclusion vanishes. However, to make the argument sharper and less easily dismissed, she should drop the second horn of the dilemma: **"or it isn't real."**

  **The Cost:**
  By dropping the "or it isn't real" option, she concedes that the rule *is* real, but insists it must therefore be a skyhook. This shifts her argument from "reductionism is self-refuting" to "reductionism secretly relies on non-physical norms." It's a subtler claim. It makes her character look less like she's trying to destroy reductionism entirely, and more like she's exposing its hidden metaphysical debts. It's less dramatic, but philosophically tougher to crack.

  **On the 'Methodological Scaffold':**
  Yes, treating the principle as a 'methodological scaffold' saves the argument from self-refutation, but it changes the game completely.

  If the principle is just a tool (a scaffold) rather than a truth claim about the world, then Step 1 needs changing. It's no longer "every real phenomenon must be explained..." but "every *useful* explanation must..."
  *   **The Save:** A tool doesn't need to explain itself. A hammer doesn't need to be nailed by another hammer. This bypasses the infinite regress.
  *   **The Cost:** It defangs the conclusion. If reductionism is just a useful tool rather than a description of reality, then Step 5 loses its bite. Reductionism doesn't need "authority" in a metaphysical sense; it just needs utility. Your character proves reductionism is pragmatic, not that it collapses.

  **A Note on Terminology:**
  Do bear in mind that Dennett himself argues *against* greedy reductionism. He thinks it's bad science. If your character attacks "greedy reductionism," she's knocking down a straw man Dennett already rejected. To make her extreme view land, she should argue that *all* reductionism inevitably slides into greediness. That makes her position more radical and fits the "weird extreme" brief better.

  **Summary for the Notebook:**
  *   **Weak Link:** Step 4 (False Dilemma).
  *   **Fix:** Drop the "or it isn't real" option. Argue the rule is real but non-physical.
  *   **Scaffold Idea:** Saves logical consistency but turns the argument from ontological to pragmatic.
  *   **Terminology:** Ensure she's attacking *all* reductionism, not just the "greedy" kind Dennett already dislikes.
