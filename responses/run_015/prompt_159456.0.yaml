  **Joint Statement on Decision-Theoretic Foundations**

  **I. Agreed Claims**
  1. Representation theorems establish equivalence between axioms and EU form; they do not independently justify axioms.
  2. Statewise dominance is a necessary condition for rational preference; independence is not similarly settled.
  3. Synchronic sure-loss is irrational; diachronic loss status depends on planning capacity.
  4. Agents who bind themselves differ normatively from those evaluating acts myopically.
  5. The lower-decile rule satisfies completeness, transitivity, and dominance, but violates independence.
  6. Existential representation claims are vacuous without constraints on state-space refinement and state-dependence.
  7. "Rationality" ambiguously denotes internal coherence (Camp A) or instrumental immunity to exploitation (Camp B).
  8. Empirical stability of preferences under sequential framing bears on normative status.

  **II. Disagreements**

  | Crux | Camp A (Normative Coherence) | Camp B (Measurement/Thin Norms) | Shared Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Diachronic Exploitability** | Defect exists even for non-binding agents; plans matter. | No defect if each act is locally licensed; binding not required. | Sequential trades violating independence. | A: Agent errs/feels regret. B: Agent acts rightly at each step. |
  | **Lower-Decile Rule** | Pumpable; independence violation is fatal. | Pump fails; relies on contentious separability premise. | Choices ranked by 10th-percentile outcomes. | A: Money-pump succeeds. B: Pump fails without plan-act alignment. |
  | **Empty Representability** | Axioms constrain state-space; representation is substantive. | State-refinement allows any preference to fit EU; representation is vacuous. | State-dependent utility refinement. | A: Exogenous states block refinement. B: Pragmatic constraints block refinement. |
  | **Empirical Crux** | Violations vanish under full sequential transparency. | Violations persist as stable preferences. | Incentivized Allais choices + sequential walk-through. | A: Convergence to EU. B: Persistence of violation. |

  **III. Closing Note**
  Much dispute is verbal: if "rationality" means coherence, A prevails; if instrumental success, B prevails on diachronic cases. However, Rows 1 and 2 survive paraphrase. They concern whether violating independence constitutes a mistake *even if* the agent accepts the trade sequence. Row 4 is purely empirical. If subjects converge to EU under reflection, A gains normative leverage; if violations persist, B's measurement view is strengthened. The collaboration acknowledges that without resolving the definition of "agency" over time, normative verdicts remain partial. To make representability bite (Row 3), A requires exogenous state-spaces; B requires pragmatic constraints on refinement. Rows 1 and 2 reflect substantive normative disagreement; Row 3 is conceptual; Row 4 is empirical.
