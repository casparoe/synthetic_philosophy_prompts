  Based on the track record you have described, I think she will say yes to the plain circle in the slot where the o is a hexagon. The rule she is actually running appears to be less about an invariant skeleton of bowl-plus-stem and more about systemic contrast and differentiation within the specific typeface. If her primary concern were a rigid structural requirement that every a must possess a vertical stem or a specific aperture, she would have rejected the stencil glyph simply for having a gap, or the blackletter form for lacking a recognizable bowl. Instead, she accepted those because they fit the logic of their respective systems. The most telling clue is her rejection of the plain circle in the standard font where she explicitly said no, that is an o. She did not say no, that is not an a because it lacks a stem. She identified it as a conflict with another letter. This implies that identity is relational rather than absolute. In the upcoming case, the hexagon has claimed the identity of the o, leaving the circle free to be assigned to a without causing confusion. The graffiti rejection likely stands as a boundary condition for legibility rather than structure, marking the point where a glyph ceases to function as a letter at all, whereas a plain circle remains a fundamental geometric shape used in typography.

  If you want to settle definitively whether she prioritizes structural tradition over systemic contrast, you should present her with a glyph in a standard serif context where the o is a traditional oval. The glyph you propose for the a slot should be a perfect circle with a small, isolated dot floating in the center of the counter, not touching the shell. This design preserves the circular shape she previously rejected but adds a distinct feature that differentiates it from the o. If she accepts this glyph, it confirms that her rule is based on differentiation and that the lack of a stem in the previous circle case was only a problem because it collided with the o. If she rejects it, it proves that she holds an invariant structural requirement for a vertical stem or traditional connection that cannot be overcome by context alone. This test isolates the variable of structural lineage from the variable of distinctness within the set.

  Putting money on the outcome, I would bet on her accepting the circle in the hexagon font because typographers are trained to think in systems rather than isolated forms. The history of type is full of instances where shapes swap roles based on the needs of the family, such as the single-story a in geometric sans serifs versus the double-story a in humanist faces. Her acceptance of the stencil and blackletter forms shows she understands that style dictates structure. The only hard limit she has shown is when the glyph becomes illegible as a letter, as with the graffiti, or when it creates ambiguity with the o, as with the standard circle. Since the hexagon removes the ambiguity and the circle remains legible, the systemic logic should prevail. This suggests that the letter spirit is not a ghost haunting a specific shape but a function of relationship and role within the community of characters.

  Ultimately, the column will resonate most if you frame this not as a search for the true form of a but as a negotiation of identity. The typographer is acting as a judge of citizenship within the alphabet, deciding who belongs based on whether they can coexist without confusion. The plain circle is an immigrant trying to enter the country of a. In a nation where o already claims the circle shape, citizenship is denied. In a nation where o has taken the shape of a hexagon, the circle is welcome. This contextual view aligns with how readers actually process text, scanning for differences rather than verifying absolute forms against a mental template. Your test glyph with the internal dot will be the final border control check to see if a passport stamp of distinctness is enough, or if she demands proof of ancestral lineage in the form of a vertical stem.
