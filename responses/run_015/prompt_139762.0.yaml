answer: |-
  Here are 8 interview questions designed to press your guest on the vulnerabilities of her position. Each includes the likely deflection, a follow-up to corner it, and a note on where she might try to slip away.

  ### 1. The "Begging the Question" Objection
  **Question:** You propose weakening Pareto so it only applies to self-regarding preferences. But in real liberal disputes—blasphemy, pornography, religious dress—the conservative's objection *is* an other-regarding preference. They don't mind what you do in private; they mind that it exists in their society. By defining their preference as "meddling" and excluding it from Pareto, aren't you just building the liberal conclusion into your premises? You're solving the paradox by stipulating that the illiberal preference doesn't count.

  *   **Likely Answer:** "It's not about moral validity, it's about informational coherence. Social choice should track individual welfare, and my welfare shouldn't depend on controlling your private sphere. That's a condition of agency, not a political bias."
  *   **Follow-up:** "But 'agency' is the contested term. If I'm a devout believer, my spiritual welfare *does* depend on the sanctity of the public square. If you exclude that from the welfare calculus to save the paradox, you aren't finding a neutral technical fix; you're ruling that secular autonomy trumps religious integrity by definition. How is that not begging the question?"
  *   **Slip-out Flag:** Watch for her to shift from "welfare" to "autonomy." If she argues that spiritual distress isn't *real* welfare because it relies on external control, she's making a substantive perfectionist claim, not a formal one.

  ### 2. Conditional Preferences (The "Prude" Problem)
  **Question:** Let's look at the cycle. Sen's 'Prude' might say, 'I prefer to read the book myself *if* you are going to read it, rather than neither of us reading.' That's a conditional preference that looks self-regarding (about my own reading) but encodes a judgment about yours. If you allow those, the cycle returns. If you block them, where do you draw the line without blocking ordinary paternalism, like 'I want you to wear a helmet for your own good'?

  *   **Likely Answer:** "We can filter out conditionals that are purely strategic or meddling. Paternalism is different because it appeals to the agent's own good, whereas the Prude's preference is about relative status or moral contamination."
  *   **Follow-up:** "But the Prude *could* frame it as moral contamination harming *them*, which looks self-regarding. If your filter relies on the *content* of the preference to decide if it's admissible, you need a prior theory of what counts as a legitimate interest. Doesn't that mean the social choice rule isn't doing the work; your prior moral theory is?"
  *   **Slip-out Flag:** She may try to use the phrase "separability of spheres." Press her on whether separability is a psychological fact or a normative imposition.

  ### 3. Rights as Side-Constraints vs. Defaults
  **Question:** You claim this fix preserves rights as constraints. But if my right to decide my sphere is overridden whenever it clashes with a Pareto-improving agreement based on self-regarding preferences, isn't the right just a tie-breaker? In the usual deontological sense, a right should block certain trade-offs. If your right loses to my self-regarding preference for how you live, is it still a 'right' or just a strong default setting?

  *   **Likely Answer:** "It's still a constraint because it defines the domain. Pareto only operates *after* we've respected the spheres. It's not a trade-off; it's a sequence."
  *   **Follow-up:** "But in your system, the spheres shrink to fit the Pareto principle. If my 'sphere' is defined as 'what I can do without triggering a self-regarding Pareto improvement for others,' then the right is endogenous to the utility functions. That sounds like the right is the residual variable, not the constraint."
  *   **Slip-out Flag:** Be wary of the word "domain." If she says the domain is fixed *ex-ante*, ask for an example where the right wins *against* a unanimous self-regarding preference.

  ### 4. Concrete Case: The Shared Wall
  **Question:** Let's get concrete. Two neighbors, shared wall. I want to play drums (self-regarding enjoyment). You want silence (self-regarding peace). There's no Pareto agreement here, we disagree. But add a third neighbor who loves drums. Now the drum-lover and I have a self-regarding agreement. Does Pareto override your right to soundproof your side? If not, why not? If so, your right to your acoustic sphere is outvoted by our self-regarding preferences.

  *   **Likely Answer:** "Your right to soundproof is within your sphere. Their preference for hearing drums is about *their* sphere, but it relies on sound crossing into yours. That makes it an externality, not a self-regarding preference over their own allocation."
  *   **Follow-up:** "But my preference to *make* sound is also self-regarding until it hits your wall. Physical externalities make spheres overlap. If you resolve this by saying 'the receiver's sphere trumps the sender's,' you've just adopted a specific liability rule. Why is that a solution to Sen's paradox and not just a property law decision?"
  *   **Slip-out Flag:** She might retreat to "physical impossibility." Point out that Sen's paradox is logical, not physical. If the logic requires physical boundaries to work, it doesn't solve the philosophical problem of conflicting liberties.

  ### 5. Sen's Own Reading (Welfarism)
  **Question:** Sen eventually leaned toward the view that the paradox is a *reductio* of welfarism and the Pareto principle itself, not a problem with rights. He suggested we need non-utility information (like entitlements) to judge outcomes. Why reject that? Why try to save the Pareto principle at all, rather than accepting Sen's later view that rights should constrain the maximization of preference satisfaction entirely?

  *   **Likely Answer:** "Sen's later move abandons the elegance of social choice theory. I want to show you can keep the framework if you just clean up the inputs. It's more parsimonious to restrict Pareto than to abandon welfarism."
  *   **Follow-up:** "But isn't the 'cleaning up' the hard part? If you have to import non-welfarist distinctions (like self-vs-other-regarding) to make the welfarist math work, haven't you already accepted Sen's point that welfarism is insufficient? You're smuggling deontology into a consequentialist framework."
  *   **Slip-out Flag:** Watch for "impure welfarism." If she admits she needs non-welfarist criteria to define the preferences, she has conceded Sen's main point.

  ### 6. The "Tie-Breaker" Worry (Scaling)
  **Question:** You claim this doesn't turn rights into tie-breakers that get outvoted. But in large groups, almost any private act has *some* self-regarding impact on someone else (e.g., economic competition, cultural shifts). If every right is subject to a veto by a coalition with self-regarding preferences, doesn't the right effectively vanish in the aggregate? How does this scale without making rights trivial?

  *   **Likely Answer:** "We require the preference to be *direct* and *personal*. Economic competition is indirect. The scaling holds because the sphere of 'direct self-regard' is limited."
  *   **Follow-up:** "Who adjudicates 'directness'? In a polarized society, people feel cultural shifts as direct personal harms. If your mechanism relies on a benign classifier to sort preferences, doesn't the system collapse the moment political polarization makes everyone view the other's private life as a direct personal threat?"
  *   **Slip-out Flag:** She may rely on an "ideal observer." Press her on whether this works in *non-ideal* theory, which is where liberal paradoxes actually matter.

  ### 7. Operationalizing the Distinction
  **Question:** Let's talk implementation. In a formal model, 'self-regarding' is a variable. In a court or parliament, it's a judgment call. If a legislator bans a drug, they claim it's to protect users (paternalistic/self-regarding for the user) but also to protect society from addiction costs (other-regarding). How does your fix help us decide real cases, or is it only stable in the abstract?

  *   **Likely Answer:** "Philosophy clarifies the principles; law applies them. The principle tells us to discount the 'moralistic' cost-benefit analysis."
  *   **Follow-up:** "But the paradox arises because the 'moralistic' cost *is* a utility for the voter. If you tell the voter to ignore their utility, you aren't solving the aggregation problem; you're disenfranchising that preference. Is your solution essentially that some utilities shouldn't count in a democracy?"
  *   **Slip-out Flag:** She might say "democracy isn't just utility aggregation." If she does, ask why she's using social choice theory (which assumes utility aggregation) to defend it.

  ### 8. The Cost of Consistency
  **Question:** Finally, what do we lose? By weakening Pareto to save Liberalism, you must be sacrificing some outcomes that everyone agrees would make them better off (in self-regarding terms). Can you give me an example of a Pareto improvement your system rejects? If you can't name a cost, it's hard to believe the trade-off is real.

  *   **Likely Answer:** "We reject improvements based on meddling. There's no real loss of welfare there, just a loss of control."
  *   **Follow-up:** "That brings us back to the start: you're defining 'real welfare' as 'what's left after we remove the conflicts.' If the cost of your solution is zero by definition, then it's a tautology. Is there any case where two people genuinely, self-regardingly prefer an outcome that violates a third person's right, and you say 'tough luck, right wins'? If not, the right isn't doing any work."
  *   **Slip-out Flag:** If she struggles to find a case, point out that her solution might be consistent but empty. If she finds a case, ask why the right trumps the unanimous self-interest in that specific instance.
