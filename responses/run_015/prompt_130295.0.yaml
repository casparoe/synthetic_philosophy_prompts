          *   (9) needs slight adjustment. Braudel writes political history, but often to show its *limitations*, not its total autonomy. He grants it "autonomous explanations" *within the short term*, but denies those explanations suffice for *history* (long term).
      *   **The Cost:** You lose predictive power and clean causality. History becomes about understanding constraints rather than predicting outcomes. It makes history harder to write (need to master geography, economics, *and* politics).
