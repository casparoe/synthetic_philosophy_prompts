prompt: |-
  You are an expert in combinatorial game theory and philosophical logic. Before constructing anything, spend a moment brainstorming: state the hidden premise of the strategy-stealing argument—that holding an extra token or move is never a disadvantage—then identify one ordinary, non-physical structural condition that can turn an extra token into a direct liability.

  Next, design a concrete, realistic two-player board-game scenario—call it “Cantilever”—that satisfies all of the following specifications:
  - The game uses a 5×5 grid of slots; players place identical wooden blocks in empty slots on each turn.
  - There is a “cantilever rule”: if a player’s own blocks ever form three adjacent slots in a straight line that overhang an empty row, that player’s structure collapses and they lose immediately.
  - Player 1 receives one extra opening placement (two blocks on the first move, then one per turn), so Player 1 always holds strictly more pieces than Player 2.
  - Show that the standard strategy-stealing argument appears to apply: if Player 2 had a winning strategy, Player 1 could place a dummy block somewhere harmless, then “steal” Player 2’s strategy.
  - Show that, because of the cantilever rule, the dummy block is not harmless: it can complete an overhanging line of Player 1’s own pieces, causing self-collapse. Thus the extra piece is a liability.
  - Show that removing the cantilever rule collapses the case back into a standard strategy-stealing proof that favors Player 1.
  - Include the defensive reply: explain exactly how a defender of the strategy-stealing assumption would attack your case (for example, by arguing that a rational agent avoids dangerous placements, or that the rule violates the argument’s precondition).

  Keep the scenario description to one paragraph, use no exotic physics or hidden information, and do not cite external texts or authors. After presenting the scenario and the reasoning for each point above, deliver a brief structured summary as a JSON object with exactly these fields: {"scenario_name": "...", "standard_argument_verdict": "...", "actual_outcome": "...", "liability_feature": "...", "collapse_if_removed": "...", "defender_rebuttal_summary": "..."}.
