      *   *Conclusion:* Option 1 is not just upstream, it's the most feasible for the user's constraints.

  7.  **Identifying the Cruxes:**
      *   *Crux 1:* Is "real" ontological or epistemic? (Option 1).
      *   *Crux 2:* Is stance choice pragmatic or mandatory? (Option 2).
      *   *Crux 3:* Does intentionality require biology? (Option 3).
      *   *Dependency:* Crux 1 determines Crux 2. Crux 2 determines Crux 3.

  8.  **Final Polish:**
