  Let's organize the "Sinkers" around the breakdown of the *sequential assumption* and the *credibility assumption*. Let's organize the "Awkward" around *long-term consequences* and *implementation friction*.

  The meta-assessment needs to be sharp. If I add "unless they commit too," am I changing the theory or refining it? It's refining, but if I add "unless it costs too much," "unless I can't verify," etc., does it become "Be aggressive unless you shouldn't"? That's trivial.

