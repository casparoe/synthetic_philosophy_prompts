prompt: |-
  I'm a philosophy of mind PhD student, and I just finished reading Davidson's essay on triangulation for a seminar, and I'm trying to work out whether his framework can say anything interesting about whether large language models are agents or mere simulators. Suppose Davidson were alive today and read the technical reports on modern LLMs — systems with no body or direct sensory contact with the world, whose entire input and output is text, and whose training data consists of text produced by humans. What would his position be on whether such systems can have genuine beliefs, intentions, and meanings, or whether they are only simulating them? Ground your prediction in his triangulation argument — the claim that having thoughts, beliefs, and meanings requires a triadic relation between at least two interpreters and a shared world — and say whether you think LLMs are a case his framework handles cleanly or a genuinely novel case it doesn't.
