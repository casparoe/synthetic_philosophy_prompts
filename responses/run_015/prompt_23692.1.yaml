      *   *Social Interaction:* They interact with users (Creature 2?), but is it genuine interaction or just pattern matching?
      *   *Causal Link to World:* The LLM is causally linked to GPUs and electricity, but is it linked to the *objects* the text refers to (rabbits, tables)? No, only to the *tokens* representing them.

