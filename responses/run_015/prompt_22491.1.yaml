      *   *Circularity:* The charge of circularity is usually that you define "accuracy" in a way that builds in probabilism.
      *   *Joyce's Defense:* The constraints on the scoring rule (like Convexity) are motivated by accuracy considerations, not probabilism. Propriety is motivated by the idea that you shouldn't expect to move away from the truth.
      *   *Marta's "Universal Claim":* This sounds like she is describing the **Dominance Principle**. "If $p$ dominates $c$ relative to *any* reasonable measure of importance/weighting, choose $p$."
