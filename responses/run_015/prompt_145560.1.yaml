  The Latency of Water

  The valedictorian was halfway through a joke about quadratic equations when the first drop hit Leo's gown. It left a dark spot on the black polyester, right over the left knee. Then another hit his cap. The sky, previously a harmless white, had bruised into a deep, wet grey.

  Leo looked at the grass. It was becoming slick. He looked at his hand, where a bead of water rolled across his knuckles. He knew, factually, that precipitation was occurring. He could measure it. He could report it. But inside his head, the file labeled *Belief* hadn't updated yet. It was a side effect of the new medication, the neurologist had warned him. Perception arrives on time; assent arrives late.

  "It's raining," Leo said. His voice was flat.

  Chloe, sitting to his right, shook her umbrella open with a snap. "Yeah, no kidding. Move under."

  Leo didn't move. He watched the rain fall through the mesh of the umbrella Chloe held over them both. "It's raining," he repeated, and then added, "but I don't believe it."

  The air around them seemed to tighten. Chloe froze, the umbrella handle halfway to her shoulder. She looked at him, then at the sky, then back at him. It wasn't that he sounded crazy. He sounded like a GPS announcing a turn that hadn't happened yet. Precise. Empty.

  "Don't say that," Chloe said, shifting her weight. "It sounds wrong. Like you're trying to trick me."

  "I'm not," Leo said. He wiped his cheek. Wet. "It is raining. That is true. And I do not believe it. That is also true. For about twelve more seconds."

  "It's just weird," Chloe said. She leaned in, lowering her voice so the parents in the row behind wouldn't hear. "Remember this morning? I told you, 'I believe it's raining, but it's not.' Because the app said yes, but the sky was clear. That felt fine. That was just being wrong."

  "This is different," Leo said.

  "It sounds like you're lying," she said. "But you're not lying. That's why it makes my teeth hurt."

  On the stage, the principal was squinting upward. He paused mid-sentence, shielding his eyes. He clearly thought the weather was turning. Leo watched him. "He thinks it's raining," Leo said. "And it is. That works."

  "Obviously that works," Chloe snapped. "Everyone else works. It's just you."

  The rain intensified. It wasn't a storm, just a steady, soaking downpour that promised to ruin the photos and slick the grass into mud. The audience rippled with the sound of opening umbrellas, a chaotic bloom of nylon. Leo remained still. He felt the cold water seeping into his collar. He acknowledged the temperature drop. He acknowledged the wetness. But the internal stamp—*I believe this*—was still buffering.

  "Yesterday," Leo said, "it was cloudy. I didn't think it would rain. It didn't. So I said, 'It wasn't raining and I didn't believe it was.' That was fine."

  "Because it was past tense," Chloe said. "Once it's over, you can own the mistake. Or the accuracy. But right now? Saying you don't believe what you're standing in?" She shook her head. "It's like watching someone introduce themselves by their own name. 'Hello, I am Leo.' Who else would you be?"

  "I don't know," Leo said. "But I'm not there yet."

  A drop landed on Chloe's nose. She wiped it away aggressively. "If you texted that to me, I'd think you were being poetic. Like, 'It's raining but I don't believe it' means you're in denial. But you're not denying it. You're watching it happen."

  "I'm reporting data," Leo said. "I'm just missing the signature."

  The principal decided to wrap up early. He rushed the final congratulations, his words swallowed by the hush of the rain. The graduates stood up. The ceremony was dissolving into a scramble for cover. Leo stood with them. He felt the weight of the gown heavy with water.

  "Are you coming?" Chloe asked. She was already wet, her hair plastered to her forehead.

  "In a second," Leo said. He waited. He watched the rain fall through the space where his belief should have been. It was a hollow feeling, like speaking into a phone and hearing no dial tone, knowing the line is connected but silent.

  "You know," Chloe said, pausing, "if you wrote that in a note... 'It is raining but I do not believe it'... I think I'd throw it away. I'd think the paper was wrong. Not you."

  "The paper doesn't feel wet," Leo said.

  "Just walk, Leo."

  He took a step. The mud sucked at his shoe. He knew he was walking. He knew he was wet. He knew the world was one way and his mind was lagging behind it. It wasn't a lie. It wasn't a trick. It was just a gap, wide enough to drive a sentence through, where the truth fit perfectly but felt like a mistake.

  "I believe it's raining now," Leo said, finally.

  "Too late," Chloe said, opening her umbrella again. "Now you're just stating the obvious."

  They walked toward the bleachers, the rain continuing to fall, steady and indifferent to whether anyone believed it or not. Leo waited for the feeling to catch up, but the cold on his skin remained just a sensation, distinct from the thought that he was cold. He kept walking, carrying the weirdness like a wet patch on his gown that wouldn't dry.
