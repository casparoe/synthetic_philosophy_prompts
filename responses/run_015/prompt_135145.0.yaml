prompt: |-
  hey, i'm grading papers for a grad seminar on biography and moral philosophy and need a second pair of eyes. we spent a lot of time on plutarh's parallel lives and the idea that hagiography shifts the pedagogical use of biography from greco-roman exemplarity toward direct imitatio. here's the exam q and one student's response.

  Question: "In Plutarch's Parallel Lives, moral learning depends on synkrisis—the paired comparison of Greek and Roman figures. Contrast this with the pedagogical function of biography in late-antique hagiography (for instance Athanasius or Gregory of Nyssa). How does Plutarch's comparative structure shape the reader's moral perception differently from the hagiographic model of direct exemplarity? And is there a sense in which Plutarch's method actually requires narrative particularity—specific, unrepeatable details—to do its work?"

  Student answer: "Plutarch uses synkrisis to put two lives side by side so the reader can see virtue isn't culture-bound. The pairing prevents hero-worship because there's always a counter-figure, and the reader feels zēlos, a kind of competitive emulation, then copies the best traits into his own life. This differs from hagiography, where writers like Athanasius present the saint as a direct template—Antony's ascetic practices are meant to be literally repeated by monks. In hagiography the narrative details are mostly colorful background; the moral point is always the same universal virtue, so particularity doesn't really matter. Plutarch, by contrast, needs concrete quirks—like how Alexander handled his horse—because without those specific details the comparison collapses into abstraction. His real innovation is applying Aristotelian catharsis to biography: comparing two figures purges excessive admiration and produces emotional equilibrium through balanced judgment. Meanwhile Gregory of Nyssa in the Life of Macrina basically rejects narrative altogether and just gives a philosophical dialogue, so he isn't using biography for moral learning at all—he's just doing ethics inside a framing story."

  can you grade this? i want a specific letter or point score plus point-by-point comments that justify it, not just a general vibe check. flag exactly where the answer slips, even if it's subtle—there's at least one misattributed framework and one misreading of a text's form, plus maybe a conflation about how particularity functions in hagiography. don't just tell me if it's "mostly right"; show me which sentences hold up and which ones don't.
