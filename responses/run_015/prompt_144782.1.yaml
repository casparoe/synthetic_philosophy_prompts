      *   *Residue Report:* Three labelled buckets.

  10. **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure not to say CRDTs *can't* do it. Some CRDTs (like Observed-Remove Sets) handle add/remove concurrency. But the *goal* is convergence. Dialetheism resists convergence. I need to be precise there.
      *   *Correction:* On Quarantine. Quarantine is effectively "Ex Falso Quodlibet" avoidance by *deletion*. Paraconsistency is avoidance by *restriction of inference*. Important distinction.
      *   *Correction:* On Separability. This is crucial. Paraconsistent logic is the tool. Dialetheism is the metaphysical claim. You can use the tool without the claim (instrumentalism). This is likely where the argument happened.

  11. **Final Polish:** Check the "Blast Radius" analogy. In classical logic, contradiction = infinite blast radius (triviality). In paraconsistent logic, blast radius is contained.

