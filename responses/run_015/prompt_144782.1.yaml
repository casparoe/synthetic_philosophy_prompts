      *   *Squinting:* True Contradictions = Inconsistent Data (Ontology vs. Epistemology).
      *   *No Expression:* The normative claim that the world *is* contradictory (vs. our model being wrong).

  7.  **Refining the "Consequence" Point:**
      *   Disjunctive Syllogism ($A \lor B, \neg A \vdash B$). In SQL: `WHERE (type = 'admin' OR type = 'user') AND type != 'admin'`. Classically, this implies `type = 'user'`. Paraconsistently, if `type` can be both 'admin' and 'user', negating 'admin' doesn't necessarily force 'user' exclusively if the negation isn't exclusive.
      *   Actually, a better systems analogy for Disjunctive Syllogism failure: If I know `Service is Up OR Down`, and I observe `Service is Not Up`, do I conclude `Down`? In a paraconsistent world, it could be `Up AND Down` (degraded state), so `Not Up` doesn't rule out `Up`.

  8.  **Final Verdict Formulation:**
      *   The user's hunch ("it's just 3-valued logic") is *wrong for an interesting reason*. It identifies the non-classical nature but confuses the direction (Gap vs. Glut).
      *   Most misleading feature: Treating inconsistency as a *bug* to be isolated (quarantine) rather than a *feature* to be computed over.

