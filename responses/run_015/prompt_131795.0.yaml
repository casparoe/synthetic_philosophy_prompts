answer: |-
  1) **Thesis in a line:** Moral reasoning is non-representational analogical pattern-matching that rejects generalization even at the level of character traits, grounded in a predictive-processing model of perception.

  2) **The hits**

  *   **Hit 1 (The Virtue Ethicist Majority): "If you deny stable character traits, you dissolve the moral agent. Who exactly is being praised or blamed if there's no enduring 'self' holding these dispositions?"**
      *   **Reply:** I'm not denying stability, I'm denying static ontology. Think of a river: it has a stable course without having a fixed "trait" of flowing. My model suggests character is a dynamic attractor state in predictive processing, not a stored rulebook or metaphysical container. This preserves accountability—you are responsible for the patterns you sustain and the predictions you maintain—without reifying traits into entities that don't exist in the neuroscience. The agent persists as a history of predictive engagements, not a vessel of virtues. This actually aligns better with the phenomenology of acting "out of character"—it's not breaking a rule, it's a shift in the predictive landscape driven by context. So, blame attaches to the failure to maintain reliable predictive patterns, not the violation of a trait-based expectation.
      *   **Soft spot:** Explaining long-term responsibility over decades becomes harder without a static "self."

  *   **Hit 2 (The Hardline Kantians): "Without universal principles, how do you condemn something like slavery without slipping into relativism? What grounds the 'wrongness' if not a categorical imperative?"**
      *   **Reply:** The wrongness isn't grounded in a principle; it's grounded in the invariant pattern of harm recognized across contexts. My claim isn't that anything goes, but that the *reasoning* doesn't subsume the case under a law. We condemn slavery because our analogical pattern-matching recognizes the structural similarity to other paradigmatic violations of agency, not because it violates "Humanity as an End." This avoids relativism because the patterns are constrained by human biology and social reality, which are stable enough to generate consensus without needing abstract universals. The normativity comes from the inevitability of the perception, not the authority of the rule.
      *   **Soft spot:** Justifying intervention in cultures with different pattern-recognition histories looks suspiciously like imposing hidden principles.

  *   **Hit 3 (The Phil of Science): "Positing 'no representation' seems less parsimonious than admitting hidden rules. Why multiply cognitive mechanisms instead of accepting heuristics?"**
      *   **Reply:** It's actually more parsimonious ontologically. Rules and principles require a storage mechanism and a matching algorithm to apply them to cases, which creates a regress problem. Analogical pattern-matching via predictive processing uses the same machinery used for perception and motor control. We don't need a separate "moral module" with rules; we use the brain's standard error-minimization systems. Positing hidden rules adds theoretical baggage without explanatory gain, whereas my model unifies moral cognition with general cognition. The parsimony lies in not positing a unique moral architecture.
      *   **Soft spot:** If predictive processing *requires* generative models (which are representational), my "no representation" claim becomes scientifically costly.

  *   **Hit 4 (The Virtue Ethicists): "Aristotle's phronesis looks exactly like your pattern-matching, but it requires cultivated generalizations. Why reject the generalization component?"**
      *   **Reply:** Because generalization implies extractability. *Phronesis* is often described as sensitivity to context, but if you can extract a generalization from it, it becomes a rule. I'm arguing the sensitivity *is* the reasoning, not the application of a learned generalization. The virtue ethicist wants to say the agent learns "types" of situations; I'm saying the agent learns specific trajectories. Keeping generalization out prevents the slide back into principlism. It protects the particularist insight that context can always invert a valence.
      *   **Soft spot:** The line between a "trained pattern" and a "generalization" is semantically thin and hard to defend under pressure.

  *   **Hit 5 (The Practical Objection): "If we can't generalize lessons, how does moral education work? Do we just show examples forever?"**
      *   **Reply:** We still use examples, but not as instances of a rule. We use them to tune the predictive model. Education isn't about transmitting principles; it's about calibrating the student's pattern-recognition system to match reliable moral perceivers. We say "look at this" not "learn this rule." This is actually how most moral learning happens intuitively anyway; principles are just post-hoc rationalizations we teach in classrooms. My theory describes the actual cognitive mechanism, not the pedagogical shorthand.
      *   **Soft spot:** Doesn't explain how we efficiently correct systemic biases without appealing to general standards.

  3) **The nightmare question**
  "Predictive processing frameworks, like Friston's free energy principle, rely on 'generative models' to minimize prediction error. In cognitive science, a generative model *is* a representation—it represents the causal structure of the world. If your thesis relies on predictive processing to explain moral perception, how can you simultaneously claim there is 'no representational content'? Aren't you using a representational theory to prove non-representational reasoning, thereby contradicting the very science you're invoking?"

  4) **What to concede first**
  I will concede that moral *communication* requires generalizations and principles, even if moral *cognition* does not. We need shared language to coordinate, but that doesn't mean the underlying processing is rule-based.
