m (about 200 words); Recommended Decision and Implementation Timeline (about 150 words); Note on Settled and Contested Claims (about 100 words). Throughout, clearly separate what is well-established in the alignment and philosophy-of-science literature from what remains genuinely contested among knowledgeable researchers, and do not present a speculative or minority view as if it were the consensus. Be precise about the difference between direct reward tampering—where an agent alters its reward signal—and the more indirect forms this proposal risks, such as hermeneutic capture of its own monitoring tools or preference manipulation of human evaluators.
