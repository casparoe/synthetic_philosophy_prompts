      *   *Refined Stance:* The highest value is determining if there are *any* robustly positive long-term interventions. If not, spend on near-term. If yes, spend on those. Therefore, the $40M should largely go to **finding out which category we are in**, while maintaining a "no-regrets" portfolio.
      *   *Actually, for a spend-down foundation:* You can't just fund research for 10 years and then disappear. You need impact.
      *   *Pivot:* I will argue that under severe cluelessness, **Institutional Resilience** (broad trajectory change) dominates **Specific Risk Reduction** (narrow x-risk) because it is more robust to prediction errors. And **Near-term Welfare** dominates both if robustness cannot be established.
