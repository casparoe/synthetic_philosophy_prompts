      *   *Defund:* Speculative x-risk mitigation that relies on precise causal models we don't have (e.g., specific AI alignment technical work that assumes we know the deployment landscape). Also, defund pure near-term welfare *if* the research suggests long-term leverage is possible (but wait, I need to be nuanced here). Actually, given the cluelessness worry, I should defund *confident* longtermism. I should fund *investigative* longtermism.
      *   *Correction:* The prompt asks for a defended agenda. I need to make a choice. If I think cluelessness is a serious threat, I should prioritize finding *robust* long-term interventions or admitting near-termism is better.
