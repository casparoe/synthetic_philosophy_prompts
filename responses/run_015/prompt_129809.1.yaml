          2.  **Robustness of Value:** Is the future good by default or dangerous? (Determines if x-risk is good).
          3.  **Discounting/Epistemic Horizon:** At what point does prediction become truly random?
          4.  **Moral Aggregation:** (Lower priority).

      *   *Funding Decision:*
          *   Fund Question 1 & 2 heavily (Research).
          *   Fund "Robust Trajectory Change" (e.g., epistemic virtue, governance) over "Specific X-Risk" (e.g., specific biosecurity tech).
