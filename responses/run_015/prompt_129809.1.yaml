          3.  **Patience/Information Value:** Given the 10-year spend-down, is spending now better than investing for later when we know more?
          4.  **Moral Aggregation:** Downstream. Only matters if we know there *are* effects to aggregate.

  4.  **Developing the Funding Agenda:**
      *   *Focus:* Epistemic clarity over direct intervention. With $40M, we can't solve x-risk, but we can fund the *meta-science* of whether solving x-risk is a coherent goal.
      *   *Top Priority:* Fund research into the "Cluelessness Objection" itself. Not just philosophy, but historical/social science analysis of long-term causal chains.
