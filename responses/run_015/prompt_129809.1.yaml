      *(Self-Correction on Funding Scale)*: $40M over 10 years is $4M/year. This is a "small foundation" in the EA context (compared to OpenPhil). It cannot solve x-risk. It *can* fund a significant research program or pilot institutional interventions. I should recommend a heavy tilt toward research/meta-work because $40M is insufficient to move the needle on global x-risk directly unless the leverage is massive. But the prompt says "spend down... choosing between funding work." I will recommend a split: 40% Research on Cluelessness/Robustness, 40% Robust Trajectory (Governance/Epistemics), 20% Near-term (Moral hedge).
