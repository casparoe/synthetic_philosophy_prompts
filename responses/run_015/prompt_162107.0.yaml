answer: |-
  Here is the session plan. It is designed for ninety minutes, twelve participants, and your specific constraints.

  ### 1. Sequencing the "Predictability Contract"
  **Decision:** Introduce the framing **after** the initial puzzle, not at the open.

  **Why:** If you open with the contract (target, tolerance, horizon, budget), it reads as dry semantics. Participants need to feel the friction of the problem first. They need to intuitively believe that "Determinism implies Predictability," experience a moment where that intuition breaks, and then reach for the contract as the tool that explains *why* it broke.

  **Prerequisites:** Before you introduce the contract, two things must be established:
  1.  **Consensus on Determinism:** The group must agree on a working definition of determinism (e.g., "The state of the world at $t_1$ plus the laws of nature logically entails the state at $t_2$"). Do not debate the truth of determinism; treat it as a hypothetical premise.
  2.  **The Naive View:** Elicit and write down the group's default assumption: "If the future is fixed, it must be knowable." You need this on the flipchart so you can draw an arrow from it to the "Contract" later as a correction.

  **The Transition:** Once they feel the puzzle (see Section 2), say: *"We are asking the wrong question. We are asking 'Is it predictable?' as if predictability is a property of the system, like mass. It isn't. It is a relationship between the system and the observer."* Then unveil the contract.

  ### 2. The Carrying Example: The "Doubling Map"
  **Decision:** Use **one setup** run three times. Do not switch setups.
  **The Setup:** The **Bernoulli Shift (Doubling Map)**.
  **The Rule:** Take a number between 0 and 1. Double it. If the result is 1 or greater, subtract 1 (keep only the fractional part). Repeat.
  **Why:** It requires only arithmetic (doubling and subtraction). It can be run by humans in a chain. It mathematically guarantees sensitive dependence (the first decimal digit is lost every turn). It distinguishes sustained sensitivity from knife-edge instability because the divergence happens at every step, not just at the start.

  **Contrast for Knife-Edge:** Use the **Balanced Pencil** only as a static analogy on the flipchart, not a run.
  *   *Pencil:* Sensitive at $t=0$, but after it falls, trajectories converge (it's just lying on the table).
  *   *Doubling Map:* Trajectories separate, then separate again, then separate again. The error grows *sustainably*.

  **The Three Runs (35 Minutes Total):**
  Divide the room into two teams. Give each team a starting number and a rule.

  *   **Run 1: Finite Precision vs. True Rule (The Precision Budget)**
      *   **Setup:** Team A starts with `0.5000`. Team B starts with `0.5001`. Both use the True Rule.
      *   **Action:** Have them calculate 5–6 steps out loud. Write results on the flipchart.
      *   **Outcome:** By step 4 or 5, the numbers are completely different.
      *   **Point:** You ran out of "known digits." To predict further, you needed more initial precision. This introduces the **Budget of Precision**.

  *   **Run 2: Exact Start vs. Wrong Rule (Model Error)**
      *   **Setup:** Both teams start with the exact fraction `1/3` (0.333...).
      *   **Action:** Team A uses the True Rule ($2x \mod 1$). Team B uses a "Wrong Rule" ($2x \mod 1 + 0.001$).
      *   **Outcome:** They diverge rapidly, even though the starting data was exact.
      *   **Point:** Measuring the start better would not have fixed this. This breaks the Laplacean idea that perfect data saves you. You also need a perfect *model*.

  *   **Run 3: The Coarse/Statistical Question (Climate vs. Weather)**
      *   **Setup:** Reset. Ask a different question. Do not ask "What is the number?" Ask: "After 10 steps, is the number in the top half (≥0.5) or bottom half (<0.5)?"
      *   **Action:** Run the map. Note that the specific number is unpredictable, but the *distribution* is stable (it spends 50% of time in each half).
      *   **Point:** Specific trajectories are unpredictable; statistical properties are predictable. This prevents the slide into nihilism.

  ### 3. The Misconception Map
  Handle these misconceptions at the specific points below. Do not lecture on them; use the group's reactions to trigger the correction.

  | Misconception | Timing | Strategy | Why |
  | :--- | :--- | :--- | :--- |
  | **Chaos = Indeterminism** | **Pre-empt (Intro)** | **Head it off.** | **Foundational.** If they think chaos means "no laws," the whole session fails. State clearly at minute 5: "Chaos is deterministic. The rules are strict. The outcome is just hard to compute." |
  | **Sensitivity = Complicated System** | **During Run 1** | **Let surface, then correct.** | **Engagement.** When they see the Doubling Map is just "multiply by 2," they will realize complexity isn't required. Correct them by pointing to the simplicity of the arithmetic on the flipchart. |
  | **Laplacean Rescue (More precision helps)** | **During Run 1** | **Let surface, then correct.** | **Impact.** Someone will say, "Just use more decimals." Let them try. Then show that doubling shifts unknown digits into the known slot. To predict 100 steps, you need 100 digits of precision. The *cost* becomes infinite. |
  | **Butterfly Effect (Small causes matter)** | **During Contract** | **Let surface, then correct.** | **Nuance.** They will say "Small causes always matter." Correct this using the Contract: Small causes only matter if the *horizon* is long enough and *tolerance* is tight enough. For a short horizon, the butterfly doesn't matter. |
  | **Chaos = Randomness** | **During Run 3** | **Let surface, then correct.** | **Distinction.** It looks random, but Run 3 shows structure. Correct by distinguishing *unpredictable trajectory* from *unpredictable statistics*. |
  | **Unpredictable = Nihilism** | **Closing** | **Head it off.** | **Morale.** Before they leave, ensure they understand we can still predict averages (Run 3). Don't let them leave thinking science is impossible. |

  ### 4. Closing Assessment: The "Diagnose the Failure" Task
  **Time:** Last 10 minutes.
  **Task:** Hand out a slip of paper (or put on the screen) with this vignette:

  > *A deterministic computer model predicts a hurricane will hit Miami on Tuesday. The hurricane hits Tampa instead. The modelers check their work: the math was correct, the code had no bugs, but the initial wind speed data was off by 0.001%.*
  >
  > *Question: Does this failure prove the world is indeterministic? Yes / No. Why?*

  **Distinguishing Wrong Answers:**
  *   **Answer: "Yes, it proves indeterminism."**
      *   *Diagnosis:* They failed to grasp the core thesis. They conflate prediction failure with ontological randomness.
  *   **Answer: "No, but it proves the model was too simple."**
      *   *Diagnosis:* They missed the "Sensitive Dependence" point. They think better models fix this, ignoring the precision budget.
  *   **Answer: "No, prediction is impossible."**
      *   *Diagnosis:* They fell for the Nihilism slide. They missed the statistical/contract nuance.
  *   **Correct Answer:** "No. It proves the **predictability horizon** was exceeded given the **precision budget**. The system can still be deterministic."

  ### 5. Scope and Exclusions
  **Time:** Final 5 minutes (after the assessment).
  **Action:** You must explicitly state what you are *not* doing. This protects you from "Well, actually..." questions that derail the philosophy.

  **Say this verbatim:**
  *"In the last five minutes, I want to mark the boundaries of today's session. We have operated under three specific suspensions:*
  1.  *We are not asking if the real world **is** deterministic (Quantum Mechanics).*
  2.  *We are not asking if humans have **free will**.*
  3.  *We are not claiming weather **is** this specific math equation.*
  *We are asking a conditional question: **IF** the world is deterministic, **DOES** it follow that it is predictable? Our answer today is: Not necessarily."*

  ### Summary of Logistics
  *   **Flipchart:** Use one sheet for the "Naive View vs. Contract." Use a second sheet for the "Doubling Map" calculations (keep the numbers visible for the whole room).
  *   **Laptop:** Use only to display the Vignette and the Scope Exclusions. Do not use simulations; the human calculation *is* the point.
  *   **Room:** Arrange seating so the two teams can hear each other compare numbers during the Runs.
