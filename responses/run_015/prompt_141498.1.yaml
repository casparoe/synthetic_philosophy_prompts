answer: |-
  Here is a complete lesson plan designed for your constraints. It uses a modified Nash Demand Game to simulate the tension between robustness and optimization, leading students to "discover" the logic of Safe Pareto Improvements (SPI) through the mechanics of rule-submission and transparency.

  ### 1. The Game: "The Divide" (Modified Nash Demand)

  **Why this game?**
  The Nash Demand Game (NDG) is ideal because the "disaster" outcome (both get 0) is salient and easy to understand arithmetically. It creates a clear baseline of risk that students want to avoid.

  **Setup:**
  *   **Pairs:** 9 pairs of students.
  *   **Pot:** 10 Points per pair per round.
  *   **Action:** Each student secretly writes down a whole number demand ($0$ to $10$).
  *   **Payoff Rule:**
      *   If Demand A + Demand B $\le$ 10: Each gets their demand.
      *   If Demand A + Demand B $>  10$: **Both get 0.** (The "Crash").
  *   **Incentive:** Top 3 individual scorers across all rounds get a coffee voucher/participation credit.

  ---

  ### 2. Submission Sheets & Rule Resolution

  You need two types of submission slips.

  **Type A: The Move (Rounds 1 & 4)**
  > **Name:** ___________
  > **Round:** ___
  > **I Demand:** [ ___ ] points.

  **Type B: The Rule (Rounds 2 & 3)**
  > **Name:** ___________
  > **Round:** ___
  > **I am submitting a RULE for my Agent to follow.**
  > **The Rule:** If my partner demands ______, then I demand ______.
  > *(Students can write simple conditions, e.g., "If partner demands > 5, I demand 5.")*

  **TA Role: The "Executor"**
  The TA collects slips. If both submit **Moves**, the TA checks the sum.
  If one or both submit **Rules**, the TA acts as the computer:
  1.  **Evaluate:** Plug the Partner's Move/Rule into your Rule to determine your final Move.
  2.  **Loops:** If Rule A depends on Rule B and Rule B depends on Rule A (e.g., "I match you" / "I match you"), the TA declares a **"System Crash"**. Both get 0. (This simulates incompatible code).
  3.  **Ambiguity:** If a rule is vague ("I play nice"), the TA defaults to **Demand 8** (Aggressive).

  ---

  ### 3. Activity Timeline (75 Minutes)

  #### **0:00 – 0:10 | Round 1: The Blind Baseline**
  *   **Action:** Pairs submit **Type A (Move)** slips simultaneously. No talking.
  *   **TA:** Calculate payoffs. Write results on the board anonymously (e.g., "Pair 3: 0, 0", "Pair 1: 5, 5").
  *   **Expected Outcome:** High variance. Several crashes (0,0). Some (5,5). Some (8,2).
  *   **Goal:** Establish the "Default World." It's risky. You don't know what they will do.

  #### **0:10 – 0:25 | Round 2: The Black Box (Rules)**
  *   **Instruction:** "You can now hire an Agent. Submit a **Rule** instead of a number. Your Agent plays for you."
  *   **Action:** Pairs submit **Type B (Rule)** slips simultaneously.
  *   **TA:** Resolves rules (watch for loops).
  *   **Debrief (Quick):** Ask a pair who crashed: "Did your rule cause this?" Ask a pair who got (5,5): "What was your rule?"
  *   **Observation:** Students will try "I demand 5" or "I match them." They will find that without knowing the *other* rule, they still crash.

  #### **0:25 – 0:40 | Phase 3: The Adversary Test (Safety Check)**
  *   **Goal:** Test if a Rule is *Safe*.
  *   **Setup:** Pick one volunteer "Proposer" (who wrote a Rule in Round 2, e.g., "I Demand 5"). Pick two "Adversaries."
  *   **Task for Adversaries:** "Your job is to find a Move for the Partner that makes the Proposer **worse off** than they would have been if they just played 'Demand 8' (the aggressive baseline)."
  *   **Execution:**
      *   Proposer Rule: "Demand 5."
      *   Baseline Move: "Demand 8."
      *   Adversary tries moves:
          *   If Adv plays 8: Rule gets 0. Baseline gets 0. (Tie).
          *   If Adv plays 2: Rule gets 5. Baseline gets 8. (**Loss!**)
  *   **Outcome:** The Adversary wins. The Rule is **not** strictly safe against *all* behaviors.
  *   **Teaching Point:** "You found a hole. Being 'nice' isn't enough. You lose against generous partners. To be truly Safe, you need a guarantee that doesn't depend on their generosity."

  #### **0:40 – 0:55 | Round 3: Open Source (The SPI Condition)**
  *   **Instruction:** "New Rule. **Player 1** submits a Rule first. **Player 2** sees Player 1's Rule, then submits a Move or Rule."
  *   **Why:** This simulates **Transparency/Code Reading**. Player 2 knows Player 1's strategy before acting.
  *   **The SPI Move:** Encourage Player 1 to write a **Conditional Threat**:
      *   *"I Demand 5. BUT, if you Demand > 5, I Demand 0 (Crash on purpose)."*
  *   **Resolution:**
      *   Player 2 sees the threat.
      *   If P2 demands 8 -> Outcome (0,0).
      *   If P2 demands 5 -> Outcome (5,5).
      *   Rational P2 chooses 5.
  *   **Comparison:** Compare this (5,5) to Round 1's average (likely lower due to crashes).
  *   **Teaching Point:** "Player 1 got 5 without guessing. They *guaranteed* 5 (or 0), whereas before they risked 0 blindly. Player 2 is also better off (5 vs 0). This is the pull."

  #### **0:55 – 1:05 | Round 4: The Break (Reaction)**
  *   **Instruction:** Back to Simultaneous Rules. But add a twist: **"You can change your Rule after seeing the Leaderboard."** (Actually, just run simultaneous rules again but tell them: "Assume your opponent is trying to exploit your Rule.")
  *   **Action:** Both submit Rules simultaneously again.
  *   **The Break:**
      *   Student A: "I demand 5. If you >5, I crash."
      *   Student B: "I demand 5. If you >5, I crash."
      *   **Result:** (5,5). Stable.
      *   **Student C:** "I demand 5. If you >5, I crash."
      *   **Student D:** "I demand 6. I know C will crash, but I prefer 0 than being bullied." (Spite).
      *   **Or:** Student D writes: "If C demands 5, I demand 6." (Exploiting the cap).
  *   **Outcome:** Coordination breaks down again because the *reaction* to the rule changes the incentives. The "Safety" relied on the other person *caring* about the crash. If they don't, the guarantee fails.

  #### **1:05 – 1:15 | Debrief & Naming**

  ---

  ### 4. Debrief Script

  **1. Map the Moments:**
  *   **Ask:** "In Round 1, why did you get 0?"
      *   *They say:* "We guessed wrong." / "Didn't trust them."
      *   *You say:* "Right. You needed a **Model** of them. You had to predict."
  *   **Ask:** "In Round 3 (Open Source), Player 1 got 5 points. Did they need to predict Player 2?"
      *   *They say:* "No, Player 2 just reacted."
      *   *You say:* "Exactly. Player 1 changed the *structure* of the choice for Player 2. That's the first feature: **Robustness.**"

  **2. Define the Concept (The Reveal):**
  *   **Say:** "This logic has a name in AI safety and philosophy. It's called a **Safe Pareto Improvement**."
  *   **Write on Board:**
      1.  **Safe:** I don't lose compared to my default (0).
      2.  **Pareto:** We both gain compared to the default (0 -> 5).
      3.  **Improvement:** I didn't need to guess your move.
  *   **Say:** "In Round 2, your 'Demand 5' rule failed the Adversary test. It wasn't Safe against generous opponents. But in Round 3, the **Threat Rule** worked. Why?"
      *   *They say:* "Because they saw it."
      *   *You say:* "Transparency. SPI usually assumes agents can read each other's 'source code' (Rules). If I can see you are committed to safety, I can safely cooperate."

  **3. The Limitation (Where it Breaks):**
  *   **Ask:** "In Round 4, why did it get messy again?"
  *   **They say:** "We both tried to be boss." / "I didn't trust the threat."
  *   **You say:** "SPI quantifies over the other side's behavior *holding it fixed*. But in reality, **they react to your patch.** If I change my agent to be 'Safe', you might change yours to be 'Exploitative'. SPI works best when we both delegate to neutral agents, not when we react in real-time."

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  | Problem | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Vague Rules** | Students write "I play fair" or "I cooperate." | **TA Instruction:** "If a rule isn't arithmetic (numbers), default to Demand 8." Announce this at start of Round 2. |
  | **Infinite Loops** | "I do what you do" vs "I do what you do." | **TA Instruction:** Declare "System Crash" (0 pts). This punishes lazy coding and incentivizes specific numbers. |
  | **Adversary Confusion** | They don't understand "Worse than Baseline." | **Script:** "Baseline is Demand 8. If Partner plays 2, Baseline gets 8. If Rule gets 5, Rule loses. Show me that." |
  | **Cynicism** | "I'll just crash them to hurt their score." | **Incentive:** Remind them *their own score* matters for the voucher. Spite hurts them too in NDG. |
  | **Time Overrun** | TA takes too long calculating. | **Prep:** Print a lookup table for the TA. (Row 0-10, Col 0-10 -> Payoff). |

  ---

  ### 6. Limitations: What You Must State Outright

  Be honest about where the activity diverges from the formal theory.

  1.  **The "Weak Dominance" Gap:**
      *   *Say:* "In the Adversary round, you proved that 'Demand 5' isn't *strictly* safer than 'Demand 8' against everyone (you lose against generous people). A true mathematical SPI often requires **delegating to a new game**, not just picking a nice number. In AI, this means rewriting the agent's code to remove the 'Demand 8' option entirely, not just promising not to use it."
  2.  **The Transparency Assumption:**
      *   *Say:* "Round 3 worked because Player 2 *saw* the rule. In the real world (and standard game theory), moves are secret. SPI arguments usually rely on the assumption that advanced agents *can* verify each other's code. Without that transparency, the guarantee vanishes."
  3.  **Equilibrium vs. Guarantee:**
      *   *Say:* "Nash Equilibrium says: 'We are stable because neither wants to move.' SPI says: 'I am safe because I structured my move to protect us regardless of stability.' One is a prediction; the other is a guarantee."

  ### 7. Materials Checklist
  *   **Slips:** 40 Type A, 40 Type B.
  *   **Board:** Leaderboard columns (Pair 1-9, Round 1-4 Scores).
  *   **TA Briefing:** Give the TA the Payoff Matrix and the "Vague Rule = 8" policy 10 mins before class.
  *   **Timer:** Visible to keep rounds tight.
