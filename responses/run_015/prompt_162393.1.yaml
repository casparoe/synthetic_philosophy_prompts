answer: |-
  Is corruption universally defined by the violation of impersonal office, or locally by the mismatch between avowed and actual allocative logics?

  The dominant debate in comparative corruption research is stalled between universalists, who impose Western bureaucratic standards as the baseline for integrity, and cultural relativists, who argue that patronage and gift-exchange are distinct moral systems immune to external judgment. Both sides presuppose a Weberian definition of corruption as the abuse of a depersonalized public office. This presupposition fails in contexts where institutions do not operate on an office-based logic, rendering the universalism debate a pseudo-argument. If the institution itself is not built on impersonal rules, violating those rules cannot be the definition of corruption. This project proposes a alternative framework: corruption is not the violation of a specific *type* of rule (office), but the mismatch between the allocative logic an institution publicly avows and the logic it actually employs.

  I distinguish three allocative logics for scarce goods: queue logic (distribution by priority, need, or pre-stated criteria), ledger logic (distribution by reciprocity or past service), and gift logic (distribution to constitute or repair a relationship, where the good is secondary). Corruption occurs when the avowed logic differs from the operational logic. A clinic nurse treating a cousin first violates a queue logic (corruption). A patron distributing roofing sheets before an election operates on a ledger logic (clientelism, not necessarily corruption if avowed). A family giving a goat to a district officer operates on a gift logic. However, if that goat is instrumentally given to buy a specific outcome while publicly avowed as a relationship-building gift, the operational logic is ledger while the avowed logic is gift. This mismatch constitutes corruption. This account avoids the universalist trap because it does not demand offices exist everywhere; it avoids the relativist trap because it maintains a universal norm against deceptive rule-switching.

  The project requires six months of theoretical development and secondary data analysis, with no new fieldwork. Month 1 will refine the typology of logics, specifically addressing the boundary between instrumental gift-giving and ledger exchanges to ensure the mismatch criterion is not too broad. Month 2 and 3 will involve a structured review of existing ethnographic literature on state-society interactions in South Asia and Sub-Saharan Africa, coding cases of alleged corruption against the three logics to test whether the mismatch model explains controversies better than the office model. Month 4 will focus on constructing the practitioner deliverable: a survey coding rule that distinguishes clientelism from corruption based on avowed versus actual logic. Month 5 will test this rule against existing datasets (e.g., Afrobarometer) to demonstrate improved predictive validity regarding citizen trust. Month 6 will be dedicated to writing the final paper and the grant deliverable.

  There are three possible conclusions. First, the mismatch model may successfully recategorize contested cases, showing that much alleged corruption is actually stable clientelism (ledger) or misunderstood reciprocity (gift). Second, the model may collapse into the office model if it turns out that in all formal institutions, the only legitimate avowed logic is queue-based impartiality. Third, the distinction between gift and ledger may prove too unstable for practical coding, rendering the framework descriptive but not operational. The deciding factor will be the secondary case review: if ethnographic accounts consistently show actors distinguishing between these logics themselves, the model holds; if actors conflate them, the model is analytically distinct but empirically void.

  The primary deliverable is an "Allocative Consistency Module" for anti-corruption surveys. Existing indices often code any non-meritocratic distribution as corruption, inflating scores in communal societies. This module would add two questions to standard surveys: "What rule was supposed to determine who got this service?" and "What rule actually determined it?" Divergence indicates corruption; convergence indicates a different institutional logic. This improves existing scores by separating institutional incompatibility from actual dishonesty, allowing donors to target rule-transparency rather than imposing foreign bureaucratic structures.

  This project is too big to fully validate the typology across all regions; it will limit the empirical test to healthcare and local resource distribution cases where ethnographic data is thickest. It also cannot solve the normative problem of who gets to set the "avowed" logic in authoritarian contexts, though it can identify when regimes lie about their own rules.

  To the concern that this is merely descriptive sociology rather than political theory: The project is normative because it identifies the specific wrong in corruption not as inefficiency, but as a breach of the mutual expectation required for social cooperation. It argues that the universal obligation is not to a specific bureaucratic form, but to truth-telling about the rules of distribution themselves.
