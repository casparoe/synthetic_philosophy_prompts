prompt: |-
  Hey — I'm a third-year PhD student in political theory, and my department gives out a small pre-fieldwork grant every spring: six months of funding, two-page proposal, read by a committee that's two political scientists and one philosopher, so it has to be legible to all three. I need the proposal by Friday and I have maybe half an idea.

  The half-idea: the fight about whether Western anti-corruption standards are universal is stuck, and I think I know why. Both sides are working with a definition of corruption built around an office — a depersonalized role with duties attached to it — and then arguing about whether that picture of office applies everywhere. But in a lot of the cases the ethnographic literature actually describes there is no depersonalized office to begin with, so the whole extension-dispute is a pseudo-argument. Instead I've been toying with three allocative logics that a scarce good can be distributed by: a queue logic (whoever came first, is neediest, or meets criteria stated in advance), a ledger logic (whoever has done something for you, or is expected to), and a gift logic (the transfer constitutes or repairs a relationship and isn't really about the good at all). Corruption on this view isn't any of the three — it's a mismatch between the logic actually being used and the logic the institution publicly avows. So a clinic nurse who treats her cousin first is queue-violating, a patron handing out roofing sheets before a vote is running a ledger, and a family giving a goat to the district officer is doing something third, and only the first is clearly corruption.

  That's as far as I've got. Questions I need you to nail down for me: is the mismatch account genuinely different from the office-based one, or does it secretly presuppose it? Does it give a non-question-begging answer to the universality question, or does it just relabel Western impartiality norms as one logic among three and call that pluralism? And on the cases: where does gift-giving that is definately meant to buy an outcome sit, given that almost no one avows buying outcomes?

  Turn this into the two-page proposal. State one question with a determinate answer, say why the existing positions (the universalists and the cultural-relativists) leave it open, give me a month-by-month method for a six-month theory project with no new fieldwork, name the two or three possible conclusions and what would decide between them, be honest about where this is too big for six months, and give me one deliverable a practitioner could use — I'm imagining a coding rule that an anti-corruption survey could actually apply to separate clientelist from corrupt from gift exchanges, and a reason to think such a rule would improve on existing index scores. Also give me two sentences for the philosopher on the committee, who will ask why this is a normative question rather than a descriptive one.

  Don't add citations — I know that literature, I'll fill references in myself. Start straight into the proposal text, first line should be the question itself, no "here's a draft" or "sure" or summary at the end.
