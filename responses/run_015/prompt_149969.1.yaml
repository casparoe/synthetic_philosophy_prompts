answer: |-
  Here is the breakdown of Aquinas's logic on removing a corrupt leader, translated entirely into your garden management vocabulary.

  ### The Ecosystem Management Report: Removing a Dominant Species

  **The Scenario:** You have a "Canopy Bully" (the board president). It's blocking light, hogging nutrients, and stopping the undergrowth from making decisions. Marco wants to take a chainsaw to it tonight.

  **The Aquinas Protocol:**
  Aquinas treats the community like a perennial bed. His rules for removing a dominant plant aren't about whether the plant is annoying; they are about whether the *disturbance* will kill the soil microbiome.

  **1. Diagnosis: Is it actually a weed or just a rogue crop?**
  *   **Garden Logic:** Before you cut, you have to know if this plant was planted there by the original design (legitimate authority) or if it self-seeded illegally (usurper).
  *   **Aquinas's Rule:** If the leader seized power without the garden's consent (a usurper), the root system is already invalid. You can remove it easier. If they were elected properly but *became* toxic (a tyrant), the roots are legally graft into the soil. Removing them causes more trauma.
  *   **The Threshold:** The shade must be total. If the undergrowth is just struggling but alive, you prune. If the undergrowth is dying and the soil is acidifying, you consider removal. Minor annoyances don't justify clear-cutting.

  **2. Authority: Who holds the pruning shears?**
  *   **Garden Logic:** One gardener cannot decide to remove a heritage tree. That's vandalism. The decision has to come from the plot collective or the zoning bylaws.
  *   **Aquinas's Rule:** A private individual (Marco) cannot act alone. That is "sedition" (like introducing a pest that eats the whole bed). The authority to remove the dominant plant must come from the "public ecology"—the membership vote, the bylaws, or a higher authority (like a city ombudsman, if the garden is registered).
  *   **The Constraint:** If Marco bars the president from the shed alone, he is acting like an invasive beetle. Even if the tree is bad, the beetle is worse because it breaks the ecosystem's rules of engagement.

  **3. Succession Planning: What grows in the vacuum?**
  *   **Garden Logic:** When you drop a big tree, you create a light gap. If you haven't pre-planted the succession layer, weeds (worse tyrants) will rush in first. They grow faster than the veggies.
  *   **Aquinas's Rule:** This is his biggest warning. Removing a tyrant often leads to greater tyranny. Why? Because the chaos of removal (civil war/plot infighting) weakens the soil structure. A new leader might rise who is even more paranoid and controlling to "prevent chaos."
  *   **The Test:** Do you have a seedling ready to go in the hole immediately? If not, don't dig the hole.

  **4. Soil Disturbance: The cost of the extraction**
  *   **Garden Logic:** Uprooting a large shrub tears up the mycelial network. It takes years to rebuild that nutrient web.
  *   **Aquinas's Rule:** The harm caused by the removal must not exceed the harm caused by the tyranny. If removing the president destroys the garden's reputation, causes lawsuits, or splits the membership into warring factions, you leave the president. You tolerate the shade to save the soil.

  ***

  ### Residue Report

  Here is where the metaphor works, where it stretches, and where it breaks.

  **1. What Maps Cleanly (The Strong Roots)**
  *   **The Vacuum Effect:** Your intuition about "creating a vacuum for something worse" is exactly Aquinas's primary argument. He is deeply conservative about regime change. He agrees with your ecological fear that clearing a canopy often invites invasive species (demagogues) that are harder to eradicate than the original tree.
  *   **Public vs. Private Action:** In gardening, if one neighbor digs up a shared tree, they are liable for damages. Aquinas maps this perfectly: political authority belongs to the "whole bed," not one "stem." Private violence is always treated as a pest outbreak, even if the target is corrupt.
  *   **Proportionality:** You wouldn't use glyphosate to kill a single dandelion in a tomato bed. Aquinas argues the remedy must fit the disease. If the president is just stubborn, you prune (vote limits). If the president is stealing funds and destroying the lease, you might excavate (impeach/remove).

  **2. What I Had to Fudge (The Grafted Branches)**
  *   **Intent vs. Biology:** In your garden, an invasive plant doesn't *choose* to choke the tomatoes. It's just being a plant. A corrupt president *chooses* to be corrupt. I had to treat the president like a force of nature to make the metaphor work, but Aquinas cares deeply about moral choice. He judges the *sin* of the tyrant, not just the *damage*.
  *   **The "Higher Authority":** In a garden, if you can't agree, you call the city or the land trust. Aquinas relies on "God" or "Higher Lords." In a secular community garden, that "higher authority" is often missing. I mapped this to "Bylaws," but bylaws are paper, not a living force. If the bylaws are broken, there's no one above to call.

  **3. What Has No Equivalent (The Bare Soil)**
  *   **Human Rights vs. Plant Utility:** This is the biggest gap. You can chop down a tree for the good of the forest without the tree having a say. You cannot physically bar a human from a space without violating their rights, regardless of their corruption. Aquinas knows this; he is talking about humans, not plants.
      *   *The Missing Piece:* Aquinas forbids assassination because humans have a spiritual destiny that plants don't. In gardening, the "good of the bed" is the only metric. In politics, the "good of the person" (even the tyrant) matters.
  *   **The "Soul" of the Community:** A garden plot is a resource. A community is a relationship. Aquinas worries that violent removal corrupts the *souls* of the removers. It makes the gardeners violent. In gardening, if you use a dirty saw, you just sterilize it. In politics, if you use violence, *you* become the disease.

  ***

  ### The Verdict: Does "Cut the Big Tree" Hold Up?

  Your intuition is **half-right** ecologically, but **wrong** procedurally according to Aquinas.

  **Where you are right:**
  You are right that a dominant species can suppress the whole system to the point of collapse. You are right that sometimes removal is necessary for succession. Aquinas agrees that tyranny is unnatural and destructive to the "health of the members."

  **Where you are wrong (and where Marco is dangerous):**
  Aquinas would tell Marco to put the chainsaw down.
  1.  **Private Action:** Marco acting alone is the equivalent of a gardener sneaking onto a neighbor's plot to dig up their shrub. It undermines the rule of the garden itself.
  2.  **Physical Force:** Aquinas distinguishes between *deposing* (voting out, legal removal) and *killing/assaulting* (physical violence). He almost never supports physical violence by private citizens. He prefers the "slow compost" method: isolate the tyrant, cut off their nutrients (support), and wait for them to wither or be removed by the collective.
  3.  **The Disturbance Risk:** Aquinas is more afraid of the *chaos* than you are. You think about weeds; he thinks about civil war. He would argue that physically barring the president creates a precedent where *any* disgruntled member can use force. That turns the garden into a jungle where the strongest arm wins, not the best soil.

  **Final Recommendation based on this logic:**
  Don't cut the tree. **Girdle it.**
  Use the bylaws. Call for a special vote (the collective pruning decision). Cut off their access to resources (keys, funds) through procedure, not force. If you physically bar him, you become the invasive species, and the rest of the plot (the neutral members) will turn against you to protect the soil structure.

  Aquinas says the tyranny is bad, but the *anarchy* of removing it improperly is worse. Manage the succession plan first, then remove the canopy.
