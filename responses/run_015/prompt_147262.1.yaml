answer: |-
  # Joint Statement on the Normativity of Assertion
  **Signatories:** [Name], Proponent of the Knowledge Norm | [Name], Proponent of the Truth Norm
  **Date:** October 26, 2023
  **Subject:** Findings of Adversarial Collaboration on Assertion Norms

  After five years of dialectical exchange, we submit this joint statement. While we remain divided on the fundamental constitutive rule of assertion, we have successfully isolated our points of agreement from our points of divergence. We agree that the dispute is substantive, not merely terminological, though verbal ambiguities remain (see Section 3).

  ## 1. Agreed Claims (Common Ground)
  We jointly endorse the following propositions as the baseline for future inquiry:

  1.  **Normativity:** Assertion is governed by a normative rule that is distinct from mere etiquette, politeness, or prudential advice. To assert improperly is to make a move that is defective *qua* assertion, not just socially awkward.
  2.  **Shared Data Points:** Any viable theory must explain the intuitive impropriety of (i) **Lottery Assertions** (asserting a ticket lost based solely on odds) and (ii) **Lucky True Assertions** (asserting $p$ based on a guess that turns out true).
  3.  **The "True but Unwarranted" Criticism:** The criticism "That is true, but you had no right to say it" is a coherent and legitimate critique. A speaker cannot defend an improper assertion solely by pointing out that the content happened to be true.
  4.  **Exclusion of Falsehood:** Asserting a known falsehood is always a violation of the norm, regardless of the speaker's benevolent intentions.
  5.  **Functional Aim:** The practice of assertion serves to convey information and coordinate action based on how the world is.

  ## 2. Remaining Disputes
  The following table outlines the specific points of disagreement. Each row is phrased neutrally to ensure both parties accept the description of the disagreement. We have identified specific test cases and recorded our divergent predictions for each.

  | # | Dispute Topic | Phrasing of the Disagreement | Agreed Test Case / Evidence | Knowledge Norm Prediction | Truth Norm Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **The Fundamental Standard** | Is the constitutive rule satisfied by the speaker's *epistemic position* (Knowledge) or the proposition's *factual status* (Truth)? | **The Gettierized Assertion:** A speaker asserts $p$ based on excellent evidence that is technically Gettierized (justified true belief without knowledge). $p$ is true. | **Violation.** The speaker lacks knowledge. The assertion is defective, even if the speaker is blameless. | **Compliance.** The speaker satisfied the truth condition. Any criticism is about risk-management, not a constitutive rule violation. |
  | **2.2** | **Group Assertion (a)** | When a group asserts (e.g., a lab report), is the norm licensed by *aggregated member knowledge* or by *institutional truth-warranty*? | **The Ignorant Spokesperson:** A committee pools data to generate a true result $p$. No single member understands the full derivation. A spokesperson reads $p$ without understanding it. | **Violation (by spokesperson).** The spokesperson lacks knowledge. The *group* may know, but the individual utterer violates the norm unless they inherit the group's knowledge state. | **Compliance.** The institution warrants the truth of $p$. The individual's mental state is irrelevant if the institutional process reliably tracks truth. |
  | **2.3** | **Non-Believing Asserters (b)** | Does the norm apply to *agents with mental states* only, or to *functional output systems* regardless of belief? | **The Calibrated Alert:** An automated weather system outputs "Storm Incoming" based on sensors. It has no beliefs. The storm arrives. | **Not Assertion.** The system cannot know or believe. It simulates assertion but falls outside the norm's jurisdiction. | **Functional Assertion.** The output functions as an assertion within the practice. The norm applies to the accuracy of the output, not the mental state of the machine. |
  | **2.4** | **Weight of Criticism (c)** | Do ordinary "you shouldn't have said that" judgments reveal the *constitutive rule* directly, or do they track *social expectations* that overlay the rule? | **The Pedagogical Falsehood:** A teacher asserts a simplified falsehood to a child to facilitate learning (e.g., "Electrons orbit like planets"). | **Constitutive Violation.** The rule is violated (it is not known/true). The teacher is *excused* by moral aims, but the move remains defective as an assertion. | **Normative Flexibility.** Ordinary judgment tracks the *aim* of conveying understanding. If the practice serves the truth in the long run, the norm is not violated in context. |

  ## 3. Identification of Verbal Dispute
  We acknowledge that a portion of our disagreement stems from divergent definitions of the term **"Assertion."**

  *   **The Knowledge Proponent** defines assertion narrowly as a speech act performed by a cognitive agent capable of holding beliefs. Under this definition, Row 2.3 (Automated Alerts) is a category error.
  *   **The Truth Proponent** defines assertion functionally as any move within a communicative practice that invites a truth-evaluation. Under this definition, Row 2.3 is a central case, not an edge case.

  **Resolution:** We agree to distinguish between **Assertion$_{K}$** (requiring a knowing agent) and **Assertion$_{T}$** (requiring a truth-apt output). Future papers must specify which definition is in use when discussing non-human or collective agents.

  ## 4. Commitment to Future Inquiry
  We commit to testing the predictions in Section 2 using experimental philosophy methods to gauge ordinary speaker intuitions regarding the "Ignorant Spokesperson" and "Calibrated Alert" cases. We agree that if ordinary speakers treat the Calibrated Alert as subject to criticism for *inaccuracy* (rather than mere malfunction), this bears significantly on Row 2.3.

  ***

  **Signed,**

  _________________________
  (Proponent of Knowledge Norm)

  _________________________
  (Proponent of Truth Norm)
