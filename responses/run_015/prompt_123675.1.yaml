answer: |-
  **Brainstorm**

  Candidate requirements: Causal efficacy, Explanatory gap closure, Subject summation, Quality summation, Structural isomorphism, Dormancy/Defeasibility, Phenomenal opacity, Plenitude/Anti-gerrymandering, Diachronic persistence, Russellian fidelity, Non-emergence, Phenomenal bonding intelligibility.

  Discarded: 'Causal efficacy' is redundant given the Russellian commitment to phenomenal properties as categorical grounds of physical dispositions. 'Explanatory gap closure' is too vague; it is the goal, not a constraint. 'Diachronic persistence' is excluded from the main list per your instruction to handle it separately, though it informs the Dormancy constraint. 'Russellian fidelity' is built into the purpose statement rather than listed as a separate requirement, as it governs the metaphysical setup rather than the combination mechanism itself.

  Retained: The core structural and phenomenological constraints that prevent the view from collapsing into emergentism or dualism.

  **The Specification**

  1.  **Constitutive Non-Emergence (Non-negotiable).** Macro-phenomenal facts must be wholly grounded in micro-phenomenal facts. If macro-consciousness arises brute from micro-phenomenal bases, the view is merely emergentism relocated one level down. *Case:* A solution cannot posit that micro-experiences simply 'add up' to macro-experience without a metaphysical account of the summation, lest it mirror the physicalist's brute emergence of consciousness from matter.
  2.  **Subject Summation Intelligibility (Non-negotiable).** The theory must explain how distinct micro-subjects constitute a macro-subject without creating the latter *ex nihilo*. *Case:* If ten micro-subjects exist, what metaphysical fact makes there an eleventh (the macro-subject) without violating the closure of the micro-level? Brute composition is as costly as brute emergence.
  3.  **Qualitative Palette Adequacy (Non-negotiable).** Micro-phenomenal qualities must be capable of combining to yield the specific character of macro-experience. *Case:* If micro-experiences are proto-colours or thin affects, the account must explain how they yield the specific redness of a rose or the throbbing of a toothache, not merely a generic 'awareness'.
  4.  **Structural Isomorphism (Non-negotiable).** The structure of macro-experience must match the causal-structural relations of the underlying physical system. *Case:* Visual space has a specific topology; the combining relation must explain why phenomenal space mirrors neural topology rather than scrambling it, preserving the Russellian link between phenomenology and physical disposition.
  5.  **Phenomenal Opacity (Preference).** The theory should explain why the macro-subject is introspectively unaware of the micro-subjects. *Case:* We do not feel our neurons firing. If this is treated as a brute fact, panpsychism loses its explanatory advantage over physicalism, which predicts opacity naturally. However, some camps accept 'deep awareness' as a feature, so this is marked as a preference for standard rivalry.
  6.  **Defeasibility (Dormancy) (Non-negotiable).** Combination must be scalar and reversible without micro-phenomenal properties ceasing to exist. *Case:* In dreamless sleep, neural activity persists but macro-consciousness vanishes. The account must explain this 'un-combining' without implying micro-subjects wink out (violating Russellian fidelity) or that macro-consciousness emerges brute upon waking.
  7.  **Anti-Gerrymandering (Non-negotiable).** The combining relation must not be arbitrarily restricted to brains. *Case:* If causal integration triggers combination, the theory must verdict on termite mounds or galaxies. Restricting it solely to human brains without a principled distinction renders the view ad hoc and physically unmotivated.

  **Analysis of Constraints**

  There is a significant tension between **Defeasibility** and **Constitutive Non-Emergence**. If micro-phenomenal properties are the categorical grounds of physical dispositions, they are present whenever the physical structure is present. In dreamless sleep, the physical structure (neurons) persists. If macro-consciousness vanishes, it implies the grounding relation has failed. But if the grounding relation is constitutive, how can it fail while the grounds remain? This suggests macro-consciousness might be an emergent property of the *arrangement* rather than the *constituents*, risking a slide back into emergentism. Satisfying Defeasibility without violating Non-Emergence requires a notion of combination that is itself structural and contingent, which threatens the necessity required for grounding.

  **Composition-Tracking** and **Anti-Gerrymandering** also conflict. Physical composition is often continuous (fields, particles). If we track physical composition strictly to avoid gerrymandering, we risk a plenitude of subjects (panexperientialism) that many find absurd. If we restrict subjects to high-integration zones (brains), we appear to gerrymander. A successful theory must bite one bullet: either accept a proliferation of subjects or admit a principled discontinuity in physical composition that maps to phenomenal unity.

  The single most exclusionary requirement is **Subject Summation Intelligibility**. Most proposed solutions (including many bonding relations) ultimately posit a primitive relation of 'co-consciousness' or 'unity' that simply holds between subjects. This often amounts to saying 'subjects combine when they combine', which is indistinguishable from brute emergence. Demanding an intelligible mechanism for subject-summing knocks out the majority of constitutive panpsychist accounts, leaving only cosmopsychism or views that deny micro-subjects entirely.

  Regarding **Diachronic Unity**: If the bonding relation is tasked with securing persistence through time, it solves the problem of trans-temporal identity but exacerbates the Dormancy constraint. If the bonding relation holds diachronically, the subject persists through sleep. If it breaks during sleep (to explain unconsciousness), the subject ceases to exist and a new one is born upon waking. This commits us to a 'perishing' ontology where ordinary sleep is death. If the bonding relation is purely synchronic, diachronic unity must be handled separately, likely via psychological continuity, which risks decoupling the phenomenal subject from the metaphysical ground.

  **Scorecard**

  | Requirement | Prim. Bonding | Panqualityism | Cosmopsychism | Attenuation View |
  | :--- | :---: | :---: | :---: | :---: |
  | 1. Non-Emergence | Fail | Pass | Pass | Fail |
  | 2. Subject Summing | Fail | Pass | Pass (Decomp) | Pass (Realisation) |
  | 3. Palette | Pass | Pass | Pass | Pass |
  | 4. Structural Fit | Pass | Pass | Pass | Pass |
  | 5. Opacity | Pass | Pass | Fail | Pass |
  | 6. Defeasibility | Pass | Pass | Pass | Pass |
  | 7. Anti-Gerrymander | Fail | Pass | Pass | Fail |

  **Verdict on the Attenuation View**

  The Attenuation View is not panpsychism; it is emergentism in phenomenal dress. By claiming the macro-subject is *realised by* rather than *composed of* the micro-subjects, and that consciousness scales with integration density, it violates **Constitutive Non-Emergence**. It posits that macro-consciousness is a function of structural arrangement that can vanish while micro-phenomenal properties persist. This is precisely the definition of emergentism: macro-properties arising from micro-structures that are not themselves sufficient for the macro-property. It fails the primary purpose of securing panpsychism as a genuine rival to physicalism, collapsing instead into option (b): emergentism relocated one level down. The requirement that kills it is **Constitutive Non-Emergence**.
