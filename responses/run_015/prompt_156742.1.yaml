answer: |-
  Here are nine question-and-follow-up pairs, sequenced to progressively narrow the utility of the "sanction story" deflection while covering your required topics. They are phrased in engineering terminology to match your interview style.

  ### 1. The Scale of Expectations
  **Question:** In a company of four thousand engineers, no single person knows what every other person is doing. Lewis's definition relies on everyone expecting everyone else to conform. In our context, that expectation is usually fragmented—maybe only the people on your team know your habits. If we replace "everyone knows everyone knows" with just "overlapping local expectations," does that still distinguish a convention from a mass habit, like everyone indenting with tabs simply because their IDE ships with that default?

  **Follow-up (If she says overlapping expectations are sufficient):** If local expectations are enough, then two teams could have contradictory conventions without either being "wrong." But in practice, when those teams merge code, one side has to yield. Does your account explain why one convention wins, or does that require an external factor like a staff engineer making a ruling?

  ### 2. The Arbitrariness of Security
  **Question:** You argue that conventions persist because there is an alternative regularity that would have worked just as well. But consider norms like "do not commit credentials" or "do not bypass code review." There isn't really an alternative regularity there that works equally well; the alternative is security failure. If the alternative is catastrophic, does that mean safety norms aren't conventions? And if they aren't, what percentage of our daily workflow falls outside your theory?

  **Follow-up (If she says safety norms are "sanction stories" not conventions):** If we exclude anything where the alternative is catastrophic, we exclude most of our operational constraints. At that point, is "convention" just a label for "low-stakes coordination"? Because in engineering, the stakes are usually tied to system stability, which is rarely low.

  ### 3. The Free-Rider Problem (Testing)
  **Question:** In a coordination problem, I prefer to conform *if* you conform. But with writing tests, everyone wants *everyone else* to write tests, but I personally save time if I skip them while you keep writing them. That's a free-rider problem, not a coordination problem. Can your "prefers to conform on the condition others do" clause actually reach those cases, or are you conceding the whole territory of public goods to a different explanation?

  **Follow-up (If she says testing becomes a convention once enforced):** If enforcement is required to turn a public good into a convention, then the convention isn't explaining the behaviour; the enforcement is. Does that mean your theory only explains why we stick to things *after* management has already solved the free-rider problem?

  ### 4. Bad Equilibria (Lock-in)
  **Question:** We have configuration encoded as one enormous nested blob that nobody can review. Everyone privately thinks this is bad and would prefer to switch, but we are stuck because unilateral deviation breaks the build. What does your account say distinguishes "we are stuck and would all rather switch" from "this is fine"? In Lewis's terms, both look like stable regularities.

  **Follow-up (If she says the preference condition distinguishes them):** If the preference is private, nobody can act on it without coordinating. So the observable behaviour is identical to a happy convention. If the theory can't distinguish a "happy" convention from a "trapped" one by looking at the system, is it describing the engineers' psychology rather than the engineering organisation?

  ### 5. Breaking the Lock-in
  **Question:** Following on from that: if we are stuck in a bad convention, what actually breaks it? In your evolutionary story, conventions lock in because unilateral deviation is costly. So what mechanism does your model provide for a coordinated switch? Does the model require an external shock, like a new CTO or a major incident, to reset the coordination game?

  **Follow-up (If she says coordination on the new thing solves it):** To coordinate on the new thing, we need a new focal point. Where does that focal point come from if the old one is still salient? If the answer is "someone with authority proposes it," aren't we back to authority being the driver, not the convention itself?

  ### 6. Imposed Standards (The Linter)
  **Question:** A staff engineer wrote our style guide, and a linter enforces it in CI. The build goes red if you violate it. People conform. Is that a convention? If you say yes, then anything backed by sanctions is a convention, and the distinction seems to vanish. If you say no, where exactly is the line between precedent and imposition? Does an imposed rule quietly become a convention once people start coordinating around it, and if so, when does that flip happen?

  **Follow-up (If she says CI enforcement makes it a "sanction story"):** If CI enforcement disqualifies a norm from being a convention, then almost nothing in a mature engineering org qualifies, because mature orgs automate compliance. Are you arguing that your theory only applies to early-stage startups before they introduce tooling?

  ### 7. The Transition from Imposed to Organic
  **Question:** Let's say we remove the linter rule tomorrow. Some norms would collapse immediately; others would persist because people still expect others to follow them. For the ones that persist, is *that* the moment they become a convention? Or were they always conventions, and the linter was just a crutch? If it was just a crutch, why did we need it to get there in the first place?

  **Follow-up (If she says the linter helped establish the expectation):** So the sanction created the expectation, which created the convention. That means the sanction is the cause and the convention is the effect. Why then treat the convention as the primary explanation for the behaviour, rather than the history of enforcement that created it?

  ### 8. The Meta-Rule (Framework Defaults)
  **Question:** Our org has an explicit second-order rule: whenever a decision is genuinely arbitrary, adopt whatever the framework's default is, even when we would have chosen differently. Is *that* a convention? Its content is a procedure for selecting conventions. The arbitrariness requirement seems to inherit upward—we could have adopted a meta-rule to "always debate it." If this meta-rule is a convention, what stops the regress? Do we need a meta-meta-rule to select the meta-rule?

  **Follow-up (If she tries the "sanction story" move here):** This rule isn't enforced by CI, and there's no blame for violating it. It's enforced by nothing at all, just shared heuristic. If you call *this* a sanction story, then "sanction" has lost its meaning. If you call it a convention, you've admitted that conventions can be about *how to choose* conventions, which implies the "arbitrariness" clause is doing no work, because the meta-rule is chosen for efficiency, not arbitrariness.

  ### 9. Falsifiability
  **Question:** Finally, I want to ask what evidence could count against your view. If we saw a migration succeed overnight without a coordinator, or a team that never converged on a standard despite years of working together, would that falsify the claim that convention-plus-precedent is the right story? I'm looking for a concrete observation of a real engineering organisation that would make you abandon or substantially revise the theory.

  **Follow-up (If she gives a theoretical answer):** To be specific: if we found a team where everyone expects everyone else to conform, prefers to conform, yet the regularity *fails* to persist, does your model predict that? If your model predicts persistence in that case, and we observe failure, is that enough to reject the model?
