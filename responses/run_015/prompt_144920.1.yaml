  2.  **Deconstruct the 5 Questions:**

      *   **Q1: Who is the murderer?** (Intermediaries, enemy combatants vs. private citizens, causal chains).
      *   **Q2: Non-assertive deception.** (Dummy tanks, radio traffic, truthful build-up, silence). Does the ban cover these?
      *   **Q3: Collective Agency.** (Organization vs. Individual). Who bears the duty? What about untraceable consequences?
      *   **Q4: Ruses vs. Perfidy.** (Laws of War distinction). Does Kant have room for this? What is the scope of the ban?
