      *   *Q1:* The "murderer" is the German High Command, but they are enemies. In a state of war, the civil contract is suspended.
      *   *Q2:* Lying requires a statement. Tanks don't speak. Radio traffic is ambiguous. The "truthful build-up" is the danger zone for her conscience.
      *   *Q3:* Kant is an individualist. She bears the burden. The bureaucracy doesn't absolve her.
      *   *Q4:* You're right. Perfidy attacks the possibility of future peace/trust. Ruses are just physical concealment. Kant fits better here than the "murderer" case.
      *   *Q5:* She wouldn't say "categorical imperative." She'd say "I am not a liar" or "God sees the heart."

  8.  **Final Polish:** Ensure the distinction between *mendacium* (lie) and *falsiloquium* (false speech) is clear if relevant, but keep it accessible. Focus on the *declaration* aspect. Ensure the "Least Sure Claim" is highlighted clearly at the end or within the text. (I will put it in a summary box at the end for clarity).

      *Wait, one check on Q2:* The "truthful build-up." If I tell truth A, B, and C so you believe me, then tell Lie D. Is telling A, B, C a lie? No. Is the *policy* of doing so a violation of the duty of truthfulness? Kant says we have a duty to be truthful *in declarations we cannot avoid*. If she volunteers the truth to build credit, is that a violation? Probably not strictly, but it tests the *spirit*. I need to be nuanced here.

      *Check on Q4:* Does Kant explicitly allow ruses? In *The Metaphysics of Morals* (Doctrine of Right), he discusses war. He says certain actions are "dishonorable" because they make the citizen unfit for peace. Spies? Maybe. Assassins? No. Perfidy? Yes. I need to be careful not to attribute too much specific Just War theory to Kant that isn't there. I will mark this as extrapolation.

