answer: |-
  First, a note on your framing. You are right to be suspicious of the "murderer at the door" as a test case here. That thought experiment assumes a civil context: two people within a shared legal and moral order where one is violating the law (murder) and the other is asked to uphold it (truth-telling). War is, in Kantian terms, a state of nature. The civil contract is suspended. The "right to the truth" is a right derived from civil society. If the German officer is an enemy combatant, he may not have that right in the same way a neighbor does. So, yes: your intuition that the enemy status changes the variables is correct, and the standard "murderer" examples often obscure this by treating the killer as a private criminal rather than a public enemy.

  Here is the mapping you asked for, broken down by your five questions. I have tagged claims as **[Kant's Doctrine]** (what is textually grounded in the *Groundwork*, *Metaphysics of Morals*, or *On a Supposed Right to Lie*), **[Extrapolation]** (philosophical extension to fit your case), and **[Confidence]** (High/Medium/Low).

  ***

  ### 1. Who is the murderer at the door?

  **[Kant's Doctrine]** The duty of truthfulness is a duty of right owed to humanity in general, not necessarily to the specific individual standing before you. However, it is triggered by a *declaration* (a statement inviting trust). **[Confidence: High]**

  **[Extrapolation]** In your scenario, the "murderer" is not the case officer receiving the radio signal. He is a functionary. The "murderer" is the German High Command ordering the Fifteenth Army to hold at Calais, resulting in conscripts dying in Normandy. However, because this is war, the German Command is not a "murderer" in the legal sense; they are an opposing force. **[Confidence: Medium]**

  **[Extrapolation]** Does the ban reach through intermediaries? If your character sends a signal knowing it will be read by the Abwehr, she is making a declaration to them, even via the double agent. The intermediary does not break the chain of moral responsibility. However, the *right* of the recipient to the truth is the variable. Kant suggests truth is owed to those with whom one is in a civil condition. An enemy in war is outside that condition. Therefore, the strict ban may not apply to the enemy command, whereas it would apply to her own commanding officer or a civilian. **[Confidence: Medium]**

  **[Extrapolation]** It matters immensely that the audience is an enemy. In the "murderer at the door" case, the murderer is a private individual abusing the civil order. In WWII, the German officer is an agent of a hostile state. Kant's political writings suggest that in war, certain hostilities are permitted that would be forbidden in peace, provided they do not make future peace impossible. **[Confidence: High]**

  ### 2. Non-Assertive Deception (The "Everything Else")

  This is the crux of your character's scruple.

  **[Kant's Doctrine]** A lie (*mendacium*) is defined as an intentional *declaration* (statement) contrary to one own's mind. It requires language or a symbolic equivalent understood as a proposition. **[Confidence: High]**

  **[Extrapolation]** **Dummy Tanks:** These are not declarations. They are objects. Placing an inflatable tank where a real one might be is camouflage or concealment, not a statement. It does not invite a specific verbal trust. Kant's ban does not cover this. She is not lying; she is arranging matter. **[Confidence: High]**

  **[Extrapolation]** **Radio Traffic:** This is borderline. Radio traffic mimics the *signs* of an army. Is it a proposition? "We are here"? If it is encrypted traffic that the enemy intercepts, it is not a direct communication. It is more like leaving footprints in the snow. If she is sending messages to her own side that she *knows* will be intercepted, she is using her own side's traffic as a prop. This is closer to a lie, but technically still an internal communication used externally. Kant would likely classify this as a ruse, not a lie, because no direct declaration of trust is made to the enemy. **[Confidence: Medium]**

  **[Extrapolation]** **Silence:** Silence is not a declaration. You cannot lie by withholding speech unless there is a specific duty to speak (e.g., in a court of law). In war, there is no duty to inform the enemy. **[Confidence: High]**

  **[Extrapolation]** **The Truthful Build-Up:** This is the most dangerous area for her conscience. She tells the truth for weeks to build credit, then lies.
  *   *Individual Act:* Each true statement is true. No lie is told in the moment.
  *   *The Maxim:* Her maxim is "I will tell the truth *in order to* deceive later."
  *   *Kantian Analysis:* Kant cares about the maxim. If the purpose of the truth-telling is deception, does that poison the truth-telling? Strictly, no. A true statement remains true. However, it treats the *capacity for communication* as a tool for manipulation. It risks violating the duty to humanity in her own person by making her word a instrument of deceit, even if the specific instance is factually accurate.
  *   *Verdict:* Technically permissible under the strict definition of lying, but it strains the *spirit* of truthfulness as a virtue. It is "lawful but shady." **[Confidence: Low]** *(See "Least Sure Claim" below)*.

  ### 3. Collective Agency and Bureaucracy

  **[Kant's Doctrine]** Moral responsibility attaches to the individual rational agent. You cannot outsource your conscience to the state or a section head. "I was following orders" is not a valid maxim in the court of pure reason. **[Confidence: High]**

  **[Extrapolation]** **The Subject of the Duty:** It is *her*. Even if the order comes from London, she is the one typing the message or moving the tank. If the act is immoral, she participates in the immorality. The bureaucracy diffuses *legal* guilt, not *moral* guilt. **[Confidence: High]**

  **[Extrapolation]** **Untraceable Consequences:** Kant argues that if you lie, you are answerable for *all* consequences, even unforeseen ones (e.g., if your lie leads the murderer to the wrong house, but the victim happens to be there, you are responsible for the death). In your novel, the deception is so complex that no single person can trace the consequence.
  *   *Problem:* If she cannot know the consequence, she cannot calculate the utility (which Kant rejects anyway), but she also cannot fully grasp the "harm to humanity."
  *   *Resolution:* Kant would say the harm is not in the *consequence* (death at Normandy) but in the *act* (violating the condition of communication). The untraceability doesn't save her; the nature of the act does. If it's not a lie (see Q2), she isn't answerable for consequences. If it *is* a lie, she is answerable even if the chain is obscure. **[Confidence: Medium]**

  ### 4. Ruses vs. Perfidy (The Laws of War)

  **[Extrapolation]** You are correct. The distinction between *ruses de guerre* (camouflage, decoys, fake traffic) and *perfidy* (feigning surrender, abusing the Red Cross emblem) tracks much better with a Kantian framework than the "murderer at the door" does. **[Confidence: High]**

  **[Kant's Doctrine]** In *Perpetual Peace*, Kant argues against actions that make future peace impossible. He explicitly condemns using assassins or poisoners, and actions that destroy the trust necessary for a future civil condition. **[Confidence: High]**

  **[Extrapolation]** **Why the distinction works:**
  *   *Ruses:* These operate in the physical realm. They hide reality. They do not abuse a specific convention of communication. The enemy knows war involves deception. Trust is not expected.
  *   *Perfidy:* This abuses a specific signal (white flag, medical insignia) that exists *solely* to preserve humanity/communication amidst violence. Using that signal to kill destroys the possibility of that signal ever working again. It attacks the *condition of right* itself.
  *   *Kant's Scope:* Kant's ban on lying is scoped to *declarations where trust is presupposed*. In war, trust is not presupposed regarding troop movements (ruses allowed). Trust *is* presupposed regarding humanitarian emblems or surrender (perfidy forbidden).
  *   *Absolutism:* The absolutism remains, but its scope is narrower than "never say anything false." It is "never violate the conditions necessary for rational communication." Dummy tanks do not violate rational communication. Feigning surrender does. **[Confidence: Medium]**

  ### 5. What does she think she's doing? (Interiority)

  **[Extrapolation]** If you write her thinking in Kantian terminology ("categorical imperative," "maxim," "duty of right"), she will feel anachronistic and academic. A devout British woman in 1944, even a scrupulous one, would not frame it this way. **[Confidence: High]**

  **[Extrapolation]** **Her Vocabulary:** She would likely use the language of *stewardship*, *conscience*, and *intent*.
  *   *She might say:* "I am not bearing false witness." (Commandment language).
  *   *She might say:* "My word is my own; the tanks are the Army's." (Distinction between personal integrity and official duty).
  *   *She might say:* "God looks at the heart, not the inflatable rubber." (Intent vs. Action).
  *   *The Conflict:* Her conflict wouldn't be "Is this a lie?" It would be "Am I becoming a deceptive person?" She worries about the *habituation* of deceit. If she deceives all day, does her soul become crooked?
  *   *Resolution:* She likely distinguishes between *being a liar* (a character trait) and *telling a lie* (an act). She tells herself, "I am not a liar; I am a soldier using concealment." The "truthful build-up" is the one thing that keeps her awake, because there she feels she is corrupting her own honesty, not just hiding a tank. **[Confidence: High]**

  ***

  ### Summary of Confidence & The "Least Sure Claim"

  **Overall Confidence:** High on the distinction between Lying and Ruses; High on Individual Agency; Medium on the application to War/Enemy status.

  **The Least Sure Claim:**
  I am least confident in the analysis of the **"Truthful Build-Up"** (Question 2).
  *   *Claim:* That telling the truth *in order to* deceive later is technically permissible under Kant's strict definition of lying, even if it violates the spirit of truthfulness.
  *   *Reason for Uncertainty:* Kant is notoriously rigid. While a true statement is not a lie, a *policy* of strategic truth-telling might be viewed as treating one's own rational nature as a mere means to an end (deception). Some Kantian scholars argue that the *intention* to deceive contaminates the utterance even if the content is true. Others argue the content is all that matters. For your novel, this ambiguity is gold: it gives her something to wrestle with that doesn't have a clean answer.

  ### Recommendation for the Novel

  Your character's intuition is philosophically sounder than the standard "murderer at the door" critique. She is effectively distinguishing between **concealment** (permissible) and **perfidy** (forbidden).

  If you want her to remain scrupulous without breaking her "no lie" vow:
  1.  She treats the radio traffic as *concealment* (hiding the real army by showing a fake one), not communication.
  2.  She treats the Double Agent as a *channel*, not a person to whom she owes a duty of truth (he is an enemy asset).
  3.  The **Truthful Build-Up** is her specific temptation/sin. That is where she should feel the guilt. That is the only place where she is arguably "lying" in spirit if not in letter.

  She isn't failing to solve the problem; she is solving it by narrowing the definition of "lie" to match the Laws of War distinction between Ruse and Perfidy. Kant can support this if you frame the duty of truth as a duty to preserve the *possibility of communication*, not a duty to be factually accurate with enemies.
