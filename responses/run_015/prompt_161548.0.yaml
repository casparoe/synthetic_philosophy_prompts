answer: |-
  You have correctly identified that your stalemate is not a failure of argumentation but a collision of distinct philosophical layers. You and your friend are speaking different dialects of moral theory, using the word "demandingness" to point at three different structural problems.

  Here is a diagnosis of the dispute, an assessment of your "second-order" insight, and a roadmap for what would actually constitute progress.

  ### 1. The Diagnosis: Three Conversations Under One Name

  You are not having one substantive dispute; you are having three that keep collapsing into each other.

  *   **Conversation A: The Criterion of Rightness (Metaphysics)**
      *   *Your Friend's Ground:* She is defending the definition of moral truth. For a consequentialist, an act is right if it produces the best outcome. Full stop. From this vantage, she is correct: showing that this definition conflicts with common sense does not prove the definition false, only that common sense is wrong.
      *   *Your Position:* You are trying to attack the criterion by attacking its implications.
      *   *The Stalemate:* You cannot refute a definition with an intuition unless you have a prior reason to trust the intuition more than the definition. She denies you that leverage.

  *   **Conversation B: The Decision Procedure (Guidance)**
      *   *Your Ground:* This is where your "second-order" insight lands. You are arguing about how an agent is supposed to *operate*. If the theory says "maximize the good," does it command me to maximize the good *including the resources spent on figuring out how to maximize the good*?
      *   *The Stalemate:* Your friend separates "rightness" from "guidance." She argues that a theory can be true (Conversation A) even if it is terrible advice for daily living (Conversation B). You suspect that if a theory cannot guide action without self-undermining regress, it fails as a moral theory.

  *   **Conversation C: The Cost of Revision (Integrity)**
      *   *Your Ground:* This is the Williams/Scheffler objection. It's not about the *amount* of sacrifice, but the *structure* of the self. If morality requires me to view my own projects as merely one set of causal inputs among others, it alienates me from the ground of my agency.
      *   *The Stalemate:* Your friend dismisses this as a psychological complaint ("character") rather than a moral one ("rightness"). You feel it is a constitutive complaint about what morality *is for*.

  **Verdict:** You are answering different questions. She is defending the *truth conditions* of moral claims; you are attacking the *viability of the moral agent* under those conditions.

  ### 2. The Regress: New, Old, or Muddle?

  Your "second-order demandingness" is not a muddle. It is a precise formulation of the **computation cost objection**, but you have sharpened it into a regress problem that threatens the theory's coherence, not just its comfort.

  *   **Is it new?** Not entirely. It appears in debates over "satisficing consequentialism" (Slote) and "bounded rationality" (Simon). However, it is often treated as a practical limitation rather than a theoretical refutation.
  *   **Is it the old objection in disguise?** It is the old objection *radicalized*. The ordinary demandingness objection says, "This theory asks too much of my wallet." Your regress says, "This theory asks too much of my cognitive architecture to even determine what it asks of my wallet."
  *   **Why it matters:** If the theory demands that you optimize the cost of optimization, you face an infinite regress unless the theory contains a stopping rule. But if the theory contains a stopping rule (e.g., "stop deliberating when the cost of deliberation exceeds expected gain"), it is no longer pure act consequentialism. It has become a hybrid theory that incorporates agent-centered constraints on deliberation.

  **The Trap for Your Friend:** She claims the theory is just "revisionary." But if the theory cannot specify when to stop deliberating without arbitrariness, it is not just revisionary; it is **indeterminate**. A moral theory that cannot determine when the agent is permitted to stop thinking about morality fails to be action-guiding in principle, not just in practice.

  ### 3. What Counts as Progress?

  Given this diagnosis, continuing to argue about "how much sacrifice is too much" is futile. Progress requires shifting the terrain.

  **A. The Necessary Distinction: Objective vs. Subjective Rightness**
  You must force a distinction between:
  1.  **Objective Rightness:** What actually produces the best outcome (fact-relative).
  2.  **Subjective Rightness:** What is rational to do given evidence and deliberation costs (belief-relative).

  Most sophisticated consequentialists (like Peter Railton) concede that *Subjective Rightness* must account for deliberation costs. If they concede this, they must admit that the "demandingness" is significantly lower in practice, because efficient deliberation often requires *ignoring* distant marginal gains.
  *   *Progress:* If she admits deliberation costs are part of the utility function, the "substantial sacrifice" claim weakens. If she denies it, she is defending a theory that requires impossible omniscience.

  **B. The Formal Result: Optimizing Under Costs**
  You don't need a mathematical proof, but you need a structural argument. The argument is that **maximization is not well-defined when the cost of calculation is endogenous.**
  *   To know if I should spend 1 hour researching charities, I need to know the expected return of that hour.
  *   To know the expected return, I need to spend time researching the research.
  *   *Progress:* Show that without an *exogenous* constraint (a rule outside the maximization principle, like "deliberate for no more than 10% of your time"), the theory yields no unique solution. If the theory requires an exogenous constraint to function, it is not a self-sufficient moral theory.

  **C. Abandoning the Question in This Form**
  You should abandon the question "Does demandingness refute consequentialism?" because "demandingness" is too vague.
  *   *Replace it with:* "Does consequentialism require a theory of rational deliberation that is compatible with human cognitive limits?"
  *   If the answer is **No**: The theory is for gods, not humans. (A concession to you).
  *   If the answer is **Yes**: The theory must be modified to include agent-centered deliberative constraints. (A concession to you, because those constraints look suspiciously like the "personal projects" you were defending).

  ### Recommendation for the Next Conversation

  Do not restart the argument about income or sacrifice. Start with the regress.

  Say this: *"I accept your distinction between rightness and guidance. But if the criterion of rightness is 'maximize the good,' that criterion must apply to the act of deliberation itself. If I must maximize the good, I must maximize the efficiency of my maximizing. This creates a regress unless the theory specifies a stopping point for deliberation. If it specifies a stopping point, it is admitting that 'maximizing the good' is not the sole criterion of rightness, because it is trumped by 'deliberative efficiency.' Therefore, the theory is either indeterminate or it is not pure consequentialism."*

  This moves the debate from "How much does morality hurt?" (which she can dismiss as whining) to "Is the theory computationally coherent?" (which she cannot dismiss without abandoning the theory's claim to guide action). That is where the philosophical leverage lies.
