  # The Consortium Threshold: A Case for Partial Superrationality

  Here is a scenario designed to isolate the predictive-correlation view from its endpoints. It demonstrates that "Moderate" is not a compromise, but the unique optimal strategy for agents who recognize they are similar but not identical.

  ### The Setup: The Ten-Lab Grant
  **Context:** Ten independent research labs are invited to co-apply for a large government consortium grant. You are the PI of one lab. You must decide your commitment level simultaneously, without communication.
  **Correlation Source:** You all attended the same workshop, read the same RFP guidelines, and share a professional norm of "reasonable risk." You aren't clones, but if you decide a proposal is viable, there is a significant probability ($\rho$) that the others, reasoning similarly, will reach the same conclusion.

  **The Three Options:**
  1.  **High Track ($H$):** Commit a Principal Investigator + proprietary data.
      *   *Cost:* 10 units (money/prestige).
      *   *Condition:* Only yields payout if **8 or more** labs choose $H$.
      *   *Reward:* 500 units (shared equally among $H$-choosers).
  2.  **Low Track ($L$):** Commit a Postdoc + public data.
      *   *Cost:* 4 units.
      *   *Condition:* Yields payout if **4 or more** labs choose $L$.
      *   *Reward:* 200 units (shared equally among $L$-choosers).
  3.  **Sit Out ($S$):** Submit letter of support only.
      *   *Cost:* 0.
      *   *Reward:* 0. (Non-contributors get no share of the grant).

  **Crucial Constraint:** The tracks are mutually exclusive. If you choose $H$, you cannot fall back to $L$ if the $H$ threshold fails. You are betting on the High Track specifically.

  ### The Payoff Analysis

  We evaluate the Expected Utility (EU) of each choice based on $\rho$, the correlation between your choice and the other 9 players. We assume the "base rate" for others is $S$ (the Nash equilibrium), so if you choose $X$, you expect $9\rho$ others to choose $X$, and the rest to choose $S$.

  **1. Standard Game Theory ($\rho = 0$)**
  *Assumption:* Your choice tells you nothing about theirs. You expect 0 others to contribute.
  *   **Choose $H$:** Total $H$-count = 1. Threshold (8) failed. Payoff 0. Net = $-10$.
  *   **Choose $L$:** Total $L$-count = 1. Threshold (4) failed. Payoff 0. Net = $-4$.
  *   **Choose $S$:** Net = $0$.
  *   **Verdict:** **Sit Out ($S$).** This is the unique Nash Equilibrium.

  **2. Full Superrationality ($\rho = 1$)**
  *Assumption:* Your choice determines theirs. All 10 do the same thing.
  *   **All Choose $H$:** Count = 10. Threshold (8) met. Share = $500/10 = 50$. Net = $50 - 10 = \mathbf{+40}$.
  *   **All Choose $L$:** Count = 10. Threshold (4) met. Share = $200/10 = 20$. Net = $20 - 4 = \mathbf{+16}$.
  *   **All Choose $S$:** Net = $0$.
  *   **Verdict:** **High Track ($H$).** The high reward at full coordination dominates the moderate option.

  **3. Partial Superrationality ($\rho = 0.5$)**
  *Assumption:* Your choice predicts theirs with 50% weight. You expect $4.5$ others to match you. Total expected count = $5.5$.
  *   **Choose $H$:** Expected Count = 5.5. Threshold (8) **failed**. Payoff 0. Net = $\mathbf{-10}$.
  *   **Choose $L$:** Expected Count = 5.5. Threshold (4) **met**. Share = $200 / 5.5 \approx 36.4$. Net = $36.4 - 4 = \mathbf{+32.4}$.
  *   **Choose $S$:** Net = $0$.
  *   **Verdict:** **Low Track ($L$).**

  **Why this works:**
  The Moderate option ($L$) is not a mixture; it is a distinct bet with a lower threshold and lower cost. At $\rho=0.5$, the group is too fragmented to clear the High bar (8), making $H$ a sunk cost. But the group is cohesive enough to clear the Low bar (4), making $L$ highly profitable. The "General View" correctly identifies $L$ as the rational choice for partially correlated agents, whereas the endpoints ($S$ and $H$) are errors of under- and over-estimating that correlation.

  **The Thresholds:**
  *   Switch $S \to L$: When expected count $\ge 4$. ($1 + 9\rho \ge 4 \Rightarrow \rho \ge 0.33$).
  *   Switch $L \to H$: When expected $H$-net > expected $L$-net. Roughly, when $H$ threshold is reachable ($1 + 9\rho \ge 8 \Rightarrow \rho \ge 0.77$).
  *   **The "Moderate Zone":** $0.33 < \rho < 0.77$. This is a wide, stable margin, not a knife-edge.

  ### The Collapse: Deleting the Middle Option
  If we remove the Low Track ($L$), the game collapses into a standard Threshold Public Goods Dilemma.
  *   At $\rho=0$, you choose $S$.
  *   At $\rho=0.5$, $H$ fails (count 5.5 < 8), so you choose $S$.
  *   At $\rho=0.77$, $H$ succeeds, so you choose $H$.

  Without $M$, there is no intermediate verdict. The decision flips once from $S$ to $H$ at a high correlation cutoff. The existence of a distinct, robust "Moderate" strategy that is optimal *only* in the middle range proves that the general view captures strategic nuance that the binary endpoints miss. It shows that partial correlation isn't just "noise" around a binary choice; it fundamentally changes the payoff landscape.

  ### The Superrationalist's Dodge
  A strict Hofstadterian might object: *"Superrationality is defined for agents who have fully internalized the argument. If $\rho < 1$, you aren't dealing with superrational agents, you're dealing with standard agents with uncertain priors. My theory only binds at $\rho=1$."*

  **Does this dodge survive?**
  Logically, yes. They can define their theory as a limit case.
  **Does it cost them?**
  Yes, dearly. It renders the theory practically inert. In the real world, $\rho$ is never 1. We never have perfect copies or telepathy. We have shared training, shared culture, and shared arguments (like this one).
  *   If the theory only applies at $\rho=1$, it applies to **no actual human coordination problems**.
  *   By conceding that $\rho=1$ is the only valid case, the superrationalist admits their framework cannot guide action in the "Moderate Zone" ($0.33 < \rho < 0.77$), which is where most real-world cooperation happens.
  *   The "General View" absorbs superrationality as the $\rho=1$ special case but retains normative force across the entire spectrum. The superrationalist who rejects the general view saves their definition but sacrifices their relevance.
