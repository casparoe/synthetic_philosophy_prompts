      *One detail:* "Share among participants".
      If I choose $H$, and 4 others match, total 5.
      If $H$ fails, do I get 0? Yes.
      If I choose $L$, and 4 others match, total 5.
      If $L$ succeeds, Share = $200/5 = 40$.
      Wait, in the $\rho=1$ calculation for $L$:
      All 10 choose $L$. Share = $200/10 = 20$.
      In $\rho=0.5$ calculation for $L$:
      Total 5.5 (Expected). Share = $200/5.5 = 36.36$.
      So $L$ is actually *more* attractive at $\rho=0.5$ than $\rho=1$ because the pot is split fewer ways?
      This is a "Critical Mass" public good.
      Does this undermine the "All In" verdict at $\rho=1$?
      At $\rho=1$, $H$ pot is 500. Share 50. Net 40.
      At $\rho=1$, $L$ pot is 200. Share 20. Net 16.
      So $H$ still wins.
      The fact that $L$ is *very* attractive at $\rho=0.5$ (Net +32) helps secure the verdict.
