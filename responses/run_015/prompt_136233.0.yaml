  The institutional pairing presupposes a hybrid conception of work, merging 'work as moral obligation' with 'work as economic input', yet functioning practically as 'work as mere time-occupancy'. The conditionality of benefits—sanctioning those who refuse gig or zero-hours roles—expresses the neo-liberalised Protestant ethic: employment is a civic duty requisite for moral standing and income entitlement. Here, the specific content of labour is secondary to the act of submission to the labour market. Simultaneously, subsidising automation expresses a pure productivist view: labour is a cost centre to be minimised for efficiency. 

  However, the synthesis reveals a deeper commitment: work as social discipline. By forcing claimants into roles deemed economically redundant enough to be automated, the state signals that the *status* of being employed matters more than the *value* of the production. The institutional mechanism of 'activation policy' enforces the duty, while tax incentives for robotics enforce the efficiency. The rhetoric of 'dignity' is thus decoupled from the reality of the role; dignity is located in the compliance with the obligation to work, not in the work itself. Consequently, the system presupposes that human flourishing is accessed through market participation, even if that participation is transient and mechanically superseded. It treats the worker as a moral agent who must be disciplined, and the job as an economic unit that must be optimised, regardless of the contradiction between holding the human in the role and removing the role from the economy.

  *Section 2 (Consistency):*
  Superficially, coercing individuals into jobs that public policy simultaneously funds to eliminate appears incoherent. If work were truly a source of human flourishing (self-realisation), destroying those roles would be unethical. However, the pairing is consistent if we recognise that the policy aims not at full employment, but at labour discipline. The conception of work here is not 'flourishing' but 'occupancy'. The tension between 'obligation to accept' and 'elimination of role' dissolves when viewed through the lens of the reserve army of labour. 

  The state requires a pool of available workers to suppress wage inflation and ensure social order (the moral duty aspect), while capital requires the reduction of labour costs to maintain competitiveness (the economic input aspect). These are not conflicting goals but complementary functions of a managed market society. The inconsistency is only rhetorical, located in the appeal to 'dignity'. If dignity were the true end, automating drudgery would be paired with unconditional income, not sanctioned coercion. The hidden tension is not between the two policies, but between the policies and the rhetoric. The practice presupposes that the *threat* of work is as socially useful as the *act* of work. Therefore, the system remains coherent as a mechanism of control: it ensures individuals remain habituated to employment norms, even if the specific employment opportunities are systematically eroded by the very efficiency gains the state subsidises. It treats the content of work as irrelevant, provided the individual is demonstrably occupied and compliant.

  *Section 3 (Liberationist):*
  The liberationist view—that automation should liberate humans from necessary labour—is fundamentally incompatible with the current implicit theory. Current policy ties survival to labour participation; the liberationist view decouples them. To adopt this position, the conditionality rules and sanction structures must be abolished entirely. Income support would become a universal right of citizenship (e.g., Universal Basic Income), removing the coercion to accept 'any available job'. 

  Reskilling mandates would transform from requirements for employability into optional avenues for self-development or social contribution. Subsidy criteria for automation would shift: instead of incentivising labour displacement for profit maximisation, public investment would target the reduction of harmful or tedious labour specifically to reduce overall working hours across the board. The goal changes from 'full employment' to 'full liberation'. Features that could remain include public employment services, but their function would shift from policing job searches to facilitating cooperative projects or care work that automation cannot easily replicate. The core institutional change is the removal of the means-test and the behavioural conditions attached to welfare. This acknowledges that if machines produce the wealth, humans should share the dividend without needing to prove their 'moral worth' through potentially futile labour market participation.

  *Section 4 (Verdict):*
  The practice ultimately relies on 'work as disciplinary occupancy', masked by the rhetoric of 'work as moral duty'. It is philosophically indefensible because it instrumentalises human beings as tools for social control while denying them the economic security that genuine dignity requires. The contradiction between subsidising job destruction and mandating job acceptance reveals that the system values compliance over contribution. The cheapest revision to restore coherence would be to abandon the 'dignity of work' rhetoric in favour of an explicit 'duty of availability', or, more ethically, to decouple basic income from labour market status. The latter aligns the institutional reality with the technological trajectory, acknowledging that if work is being automated, welfare must be universalised to prevent destitution without resorting to coercive make-work schemes.

