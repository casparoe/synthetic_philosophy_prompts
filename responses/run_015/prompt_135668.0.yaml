answer: |-
  This is a sophisticated framing. It moves the debate away from "intentions" (humanitarianism vs. regime change) and toward "consequences of capacity destruction." In academic terms, this touches on the third pillar of the **Responsibility to Protect (R2P)**: the *Responsibility to Rebuild*. Your uncle's "Obama broke it" argument is the blunt-force version of this; your framing is the structural version.

  Here is a disciplined mapping of the Libya 2011 case through the lens of a **Governance Substitution Duty**, followed by an analysis of where that theory strains or breaks.

  ### 1. The Players and the Mandate
  To apply your lens, we first have to establish who held the "duty" and what tools they were allowed to use.

  *   **UN Security Council (UNSCR 1973):** Passed March 17, 2011. Authorized "all necessary measures... to protect civilians." Crucially, Paragraph 4 explicitly excluded "a foreign occupation force of any form on any part of Libyan territory."
  *   **NATO (US, UK, France):** The executors. The US provided the bulk of early intelligence and munitions; UK/France pushed hardest for regime change.
  *   **The Rebels (NTC):** The National Transitional Council was the political face; the fighters were a patchwork of defected military, local militias, and Islamists. They had no unified command structure.
  *   **The Arab League:** Initially requested the No-Fly Zone (NFZ). Once bombing began, they criticized NATO for exceeding the mandate (arming rebels, targeting Gaddafi's compound).
  *   **Russia/China:** Abstained on 1973 (allowing it to pass). Russia later claimed they were misled, arguing the resolution was used as a Trojan Horse for regime change.

  **The Constraint:** The UN gave NATO a hammer (air power) to stop a massacre but forbade them from holding the nail (governance/occupation). Your framing suggests that if you use the hammer to smash the table, you own the table, regardless of what the UN resolution says.

  ### 2. The Critical Window: Protection vs. Regime Collapse
  Your framing hinges on whether the interveners *deliberately smashed* regime capacity beyond what was needed for civilian protection.

  **March 2011:** Gaddafi's forces were advancing on Benghazi. He threatened "no mercy."
  *   **Strict Protection Option:** Enforce the NFZ, bomb artillery columns heading for Benghazi, establish a humanitarian corridor, freeze front lines.
  *   **What Happened:** NATO did not just stop the advance; they degraded Gaddafi's command and control across the country. They provided close air support for rebel offensives. They effectively became the rebel air force.

  **Did protecting civilians require tearing the regime down?**
  *   **Argument for Yes:** Gaddafi's rhetoric and history (1996 prison massacre) suggested he would not stop at Benghazi. As long as he held Tripoli, he could reconstitute forces. A frozen conflict might have led to a bloody stalemate or delayed atrocity.
  *   **Argument for No:** A robust NFZ and defensive bombing could have secured Benghazi without enabling a rebel march to Tripoli.
  *   **The Verdict through your Lens:** By enabling the offensive to Tripoli, NATO shifted from *neutral protector* to *co-belligerent*. Once you become a co-belligerent who destroys the state's monopoly on violence, the "Governance Substitution Duty" triggers. You didn't just stop a killer; you decapitated the state.

  ### 3. The Governance Vacuum (Where the Theory Holds)
  This is where your framing is strongest. Libya post-2011 is the textbook case of "smashing without substituting."

  *   **The Vacuum:** When Gaddafi fell, there was no army, no police, and no civil service. The NTC had no authority over the militias that actually fought the war.
  *   **The Failure of Substitution:** NATO went home. The UN mission (UNSMIL) was political, not administrative. They could not disarm militias because they had no troops to enforce it.
  *   **The Result:** Without a central monopoly on violence, militias became the de facto governance. They controlled borders, oil, and prisons.
  *   **Applying the Frame:** If the interveners accept a duty to substitute governance, they failed. They destroyed the *Leviathan* (Gaddafi) but did not install a new one. The chaos wasn't an accident; it was the predictable outcome of destroying state capacity without replacing the security architecture.

  ### 4. Where the Framing Gets Weird or Silent
  Your framing is morally coherent but politically strained. Here is where it struggles to explain the reality.

  **A. The Kosovo Comparison (Why did it work there?)**
  *   **The Difference:** In Kosovo (1999), NATO bombed Serbia, but then inserted **KFOR** (40,000 ground troops) and established **UNMIK** (a UN transitional administration that essentially ran the government).
  *   **The Theory's Silence:** Your framing explains *why* Libya failed (no substitution), but it doesn't explain *why* substitution happened in Kosovo but not Libya.
  *   **The Reality:** It wasn't about duty; it was about political will. In 2011, the US and Europe were exhausted from Iraq and Afghanistan. They physically *could not* sustain another nation-building project. The theory demands a duty that the interveners were politically incapable of fulfilling. This suggests the theory might demand the impossible: intervention without occupation is often unstable, but occupation is politically toxic.

  **B. The "No Ground Troops" Clause**
  *   **The Legal Trap:** UNSCR 1973 explicitly forbade "foreign occupation."
  *   **The Theory's Conflict:** Your framing says interveners *should* have taken on a governance duty. But to do that legally would have required violating the UN resolution they were enforcing.
  *   **The Dilemma:** If the "Governance Substitution Duty" is real, then UNSCR 1973 was a flawed mandate from the start. It authorized destruction without authorizing the necessary reconstruction. The theory implies that *this specific intervention was doomed by design*, regardless of who was president.

  **C. The Arab League Flip**
  *   **The Dynamic:** The Arab League asked for intervention to stop Gaddafi but flipped when NATO started bombing infrastructure and arming rebels.
  *   **The Theory's Insight:** This highlights that regional actors also bear responsibility. They wanted Gaddafi gone (regime change) but didn't want to pay for the rebuild (governance substitution).
  *   **The Silence:** The theory focuses on the *intervener* (NATO/US). It doesn't adequately account for the *beneficiaries* (Rebels/Arab League) who rejected international administration. Many Libyans viewed foreign boots on the ground as neocolonialism. If the locals reject the substitution, does the duty still hold?

  **D. Militias vs. Administration**
  *   **The Nuance:** Even if NATO had stayed, would "governance substitution" have worked?
  *   **The Problem:** In Libya, identity is tribal and local. A central government (whether Gaddafi or NTC) is often viewed with suspicion.
  *   **Theory Failure:** The framing assumes that "governance substitution" leads to stability. But in Iraq and Afghanistan, foreign governance substitution led to insurgency. If NATO had stayed to run Libya, they might have become the target of the very militias they armed. The theory assumes the intervener is capable of building order; history suggests they often become the source of disorder.

  ### 5. Summary for the Argument
  If you are discussing this with your uncle, here is the synthesis:

  1.  **He is right about the mechanism, wrong about the person:** It wasn't specifically "Obama" who broke it; it was the **structure of the intervention**. The "Governance Substitution Duty" was violated by the UN mandate itself (which forbade occupation) and by Western war-weariness.
  2.  **Protection vs. Destruction:** There is a defensible argument that saving Benghazi required stopping Gaddafi's army. However, enabling the rebel march to Tripoli turned a humanitarian mission into a regime change operation. That is the moment the "debt" was incurred.
  3.  **The Kosovo Distinction:** The reason Libya is a wreck and Kosovo is functional isn't just about Libyans vs. Kosovars. It's that NATO stayed in Kosovo with ground troops to enforce order. They refused to do that in Libya.
  4.  **The Hard Truth:** Your framing reveals a tragic paradox. To avoid "breaking" a country, you might need to occupy it. But if you occupy it, you violate sovereignty and invite insurgency. If you don't occupy it, you leave a vacuum. The Libya intervention chose the path of least resistance (air power only), which maximized the governance vacuum.

  **Conclusion on the Theory:**
  The "Governance Substitution Duty" is an excellent diagnostic tool for *failure*. It correctly identifies that destroying a state creates a moral and practical debt to rebuild it. However, it fails as a *prescriptive* tool because it ignores political feasibility. It demands that interveners do what their domestic populations will not allow (long-term occupation) and what international law often forbids (violating sovereignty to install administration). It explains why Libya failed, but it offers no viable alternative for how to save civilians in Benghazi without triggering the collapse that followed.
