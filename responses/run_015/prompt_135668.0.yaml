prompt: |-
  I've been arguing with my uncle about Libya 2011 ever since he brought it up at Thanksgving dinner saying Obama basically broke the country. I want to analyze it through this framing I came across: that humanitarian intervention shouldn't just be judged by stopping immediate killing, but by whether the intervener takes on a governance substitution duty when they deliberately smash a regime's capacity without replacing it. Can you walk me through the Libya case with that lens? Who were the actual players—NATO, the rebels, the Arab League asking for the no-fly zone, Russia absaining—what options they had after the resolution passed but before Gaddafi fell, and whether protecting civilians actually required tearing the regime down. Then be honest about where this framing gets weird or silent: does it explain why Libya turned into millitias while Kosovo had UN administration? What does it say about nobody sending ground troops, or about the Arab League flipping once bombing started? I don't need a bibliography, just a disciplined mapping and where the theory fails to speak.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Topic:** Libya 2011 intervention.
      *   **Framing:** Humanitarian intervention shouldn't just be judged by stopping immediate killing, but by whether the intervener takes on a "governance substitution duty" when they deliberately smash a regime's capacity without replacing it. (This sounds like a variation of the "Pottery Barn Rule" or "Responsibility to Rebuild" within R2P).
      *   **Key Questions to Address:**
          *   Who were the actual players? (NATO, Rebels, Arab League, Russia, etc.)
          *   What options existed after UNSCR 1973 passed but before Gaddafi fell?
          *   Did protecting civilians *actually* require regime change?
          *   Where does this framing get weird/silent? (Libya vs. Kosovo, no ground troops, Arab League flip).
      *   **Constraint:** No bibliography, just disciplined mapping and critical analysis of the theory's limits.
      *   **Tone:** Analytical, honest, nuanced (avoiding simple "Obama broke it" vs. "Heroic intervention" binaries).

  2.  **Initial Assessment of the Framing:**
      *   The user's framing is essentially a critique of the *exit strategy* and the *scope of mandate* in humanitarian intervention. It aligns with the "Responsibility to Rebuild" pillar of R2P (Responsibility to Protect), which is often ignored in practice.
      *   The core tension: *Negative peace* (stopping the bombing) vs. *Positive peace* (building a functioning state).
      *   The "Governance Substitution Duty" implies that if you destroy the monopoly on violence (the state), you inherit the obligation to provide a new monopoly on violence (order).

  3.  **Mapping the Players & Dynamics (Libya 2011):**
      *   **UN Security Council (UNSC):** Passed Resolution 1973. Authorized "all necessary measures" to protect civilians. Explicitly excluded "foreign occupation force."
      *   **NATO (led by US/UK/France):** Executed the air campaign. US led initially (Odyssey Dawn), handed off to NATO (Unified Protector).
      *   **The Rebels (NTC - National Transitional Council):** The political face. Militias on the ground. Heterogeneous, often local/tribal, some Islamist links.
      *   **Arab League:** Initially requested the No-Fly Zone (NFZ). Later criticized the bombing campaign as exceeding the mandate.
      *   **Russia/China:** Abstained on 1973 (didn't veto). Later claimed they were misled about regime change being the goal.
      *   **Gaddafi Regime:** Threatened Benghazi ("no mercy"). Collapsed rapidly once air support shifted to rebel offensives.

  4.  **Analyzing the "Governance Substitution Duty" in Libya:**
      *   *Did they smash capacity?* Yes. Air strikes degraded command/control, armored columns, and eventually Gaddafi's compound.
      *   *Did they replace it?* No. UNSCR 1973 explicitly forbade occupation. The West relied on the NTC, which lacked institutional capacity.
      *   *The "Duty":* Under the user's framing, the interveners failed this duty. They broke the vase but didn't sweep the glass.

  5.  **Addressing the Specific Questions:**
      *   **Options between Resolution and Fall:**
          *   *Option A (Strict Protection):* Enforce NFZ, stop columns heading to Benghazi, hold the line. (Status Quo Ante minus Gaddafi's offensive).
          *   *Option B (Regime Change):* Use air power to enable rebel offensive to Tripoli. (What happened).
          *   *Option C (Peacekeeping):* Insert ground troops to separate forces *during* the transition. (Ruled out by mandate and political will).
      *   **Did Protection Require Regime Change?**
          *   *Argument for Yes:* Gaddafi threatened mass atrocity in Benghazi. As long as he was in power, he was a threat.
          *   *Argument for No:* A ceasefire and NFZ could have frozen the front lines (like Korea). But Gaddafi likely wouldn't have honored it.
          *   *Crucial Nuance:* NATO moved from *protecting civilians* to *acting as rebel air force*. This is where the "governance duty" triggers. If you become a co-belligerent, you own the aftermath more than if you are a neutral referee.

  6.  **Critiquing the Framing (Where it gets weird/silent):**
      *   **Libya vs. Kosovo:** Kosovo had KFOR (NATO ground troops) and UNMIK (UN administration). Libya had neither. Why? Political will. The framing explains *why* it failed (no substitution), but doesn't explain *why* the substitution was refused (domestic politics in US/Europe).
      *   **No Ground Troops:** The framing assumes capacity to substitute. What if the intervener *can't* politically sustain substitution? The theory demands a duty that might be impossible to fulfill, leading to paralysis (don't intervene at all).
      *   **Arab League Flip:** They wanted Gaddafi gone but didn't want Western boots on the ground or prolonged bombing. The framing highlights the gap between regional desire for regime change and regional willingness to pay for state-building.
      *   **Militias:** The framing explains the vacuum. It doesn't fully explain the *nature* of the militias (tribal, ideological). A governance substitution might have suppressed them, but at what cost? (Insurgency against occupiers).
      *   **Sovereignty vs. Duty:** International law (1973) explicitly forbade the very thing the framing says is required (occupation/administration). So the theory conflicts with the legal mandate.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the framing. It's a strong lens (R2P's "Pillar III" vs. reality).
      *   *Section 1: The Players & The Mandate.* Define 1973. Note the "No Occupation" clause.
      *   *Section 2: The Critical Window (March - October 2011).* Analyze the shift from NFZ to offensive support. This is where the "smashing" happened.
      *   *Section 3: Protection vs. Regime Change.* Was it binary? Argue that protecting Benghazi *might* have been possible without Tripoli, but Gaddafi's nature made coexistence hard. However, enabling the march to Tripoli triggered the "governance debt."
      *   *Section 4: Where the Framing Breaks/Strains.*
          *   *Kosovo Comparison:* Crucial distinction is ground troops.
          *   *The "Can't" vs. "Won't":* Political feasibility.
          *   *Legal Contradiction:* The UN forbade the solution the theory demands.
          *   *The Arab League:* Complicity in the smash, absence in the rebuild.
      *   *Conclusion:* Summarize. The framing is morally robust but politically naive. It explains the *failure* but not the *feasibility*.

  8.  **Refining the Tone:**
      *   Avoid taking sides with the uncle ("Obama broke it") but acknowledge the grain of truth in the "governance vacuum" argument.
      *   Ensure the distinction between *intent* (protect civilians) and *effect* (regime collapse) is clear.
      *   Make sure to explicitly answer the "where the theory fails" part.

  9.  **Self-Correction during drafting:**
      *   *Check:* Did I mention Russia? *Correction:* Need to emphasize their abstention and subsequent "I told you so."
      *   *Check:* Did I explain the Arab League flip? *Correction:* They felt the bombing went beyond NFZ into regime change territory.
      *   *Check:* Is the Kosovo comparison clear? *Correction:* Emphasize UNMIK/KFOR vs. UN Support Mission in Libya (UNSMIL) which was tiny and political, not administrative.

  10. **Final Polish:** Check against constraints (no bibliography, disciplined mapping). Ensure the "governance substitution duty" concept is the through-line. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to validate the uncle's simplistic "Obama broke it" narrative uncritically, while also not dismissing it entirely. The user's framing is more sophisticated than the uncle's. I should focus on the *structural* failure implied by the framing rather than personalizing it on Obama, though US leadership was pivotal.

  *(Final Plan)*:
  1. Define the Framing (The "Pottery Barn" / R2P Rebuild gap).
  2. Map the Actors & Mandate (1973 specifics).
  3. The Pivot Point (Protection vs. Offense).
  4. The Governance Vacuum (Why militias?).
  5. Stress-Testing the Framing (Kosovo, Ground Troops, Legal limits).
  6. Conclusion.

