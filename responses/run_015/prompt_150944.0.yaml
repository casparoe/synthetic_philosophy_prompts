  Dear Colleague, regarding the debate you witnessed, the first researcher's initial claim that satisficing collapses into optimization with search costs is partly right but incomplete because while Stigler demonstrated the formal equivalence of optimal search rules, this presupposes the agent possesses the computational capacity to solve the search problem itself, which begs the question against Simon's core constraint on cognitive limits. The second researcher's counter that preferences are constructed during search is clearly right in the context of Simon's actual writings and subsequent behavioral evidence, as it correctly identifies that the option set is not exogenous but discovered and shaped by the procedure. When the first researcher retreats to meta-level optimization, the argument becomes partly right but incomplete again, since while any stopping rule can be rationalized ex post as optimal for some cost function, this risks making the theory unfalsifiable and ignores the infinite regress of computing the costs of computation. The second researcher's final point on endogenous reference points is partly right but incomplete because while aspiration levels do shift dynamically in ways that violate static utility maximization, a sufficiently rich state-dependent dynamic model could technically reconstruct this behavior by treating the history of satisfaction as part of the state space, though doing so stretches the utility framework to the point of losing its normative bite. Overall the second researcher is more right regarding the substantive interpretation of bounded rationality because they preserve the psychological mechanism rather than dissolving it into a tautology, yet both sides neglect the distinction between modeling behavior as if it were optimal versus explaining the actual cognitive process generating it. Specifically concerning your question on endogenous references, while a dynamic state-dependent model can formally capture the shifting aspirations, it fails to capture the explanatory power of the procedural rule itself because the state-dependent model requires the theorist to know the transition rules of the preferences ex ante, whereas the procedural account explains how those rules emerge from the interaction between the agent and the environment. Ultimately the disagreement hinges on whether one values formal consistency over psychological plausibility, and while the optimization framework is flexible enough to absorb satisficing mathematically, doing so empties the concept of bounded rationality of its critical force regarding human cognitive architecture.
