answer: |-
  ### Part 1: The Logical Space Underneath the Quiz

  Before you hand out the quiz, it helps to know what machinery is hidden inside it. You are not asking your group which "team" they are on; you are asking them to make empirical claims about how biology works. Their pattern of answers will reveal which logical constraints they think are necessary for natural selection to occur.

  The quiz is built on three separating questions (axes) that define the logical space:

  1.  **The Decoupling Question:** Can a trait spread if it harms the survival of the physical body holding it, provided it biases its own transmission?
      *   *Yes:* Points toward Gene/Replicator views.
      *   *No:* Points toward Organism/Interactor views.
  2.  **The Emergence Question:** Is a group's fitness strictly the average of its members' fitness, or can the group have a survival rate distinct from that average?
      *   *Average only:* Points toward Kin Selection or Trait-Group Selection.
      *   *Distinct/Emergent:* Points toward Multi-Level Selection (strong) or Species Selection.
  3.  **The Substrate Question:** Does the unit of selection require physical replication (DNA/copying), or is it enough that a lineage persists through time?
      *   *Replication required:* Points toward Replicator Selectionism.
      *   *Persistence required:* Points toward Lineage/Clade views.

  **Indistinguishable Positions:**
  Be warned: **Kin Selection (Inclusive Fitness)** and **Trait-Group Selection** are mathematically equivalent in most standard cases. If a student answers that altruism evolves because "it helps the group survive" (Group) versus "it helps copies of the gene in neighbours" (Kin), the quiz cannot separate them. They are two ways of bookkeeping the same arithmetic. I have flagged this in the key.

  **Empty Combinations:**
  There is one combination of answers that is logically empty: **Claiming a trait spreads because the *group* survives better, while simultaneously admitting the *individuals* within that group survive better and reproduce more.** If the individuals are already doing better, you do not need group selection to explain the trait; individual selection suffices. Nobody holds this position because it renders the "group" explanation redundant.

  ***

  ### Part 2: The Levels of Selection Sorting Quiz

  **Instructions:** Read each scenario. Choose the **one** statement that best describes *why* the trait becomes common in the population. Do not worry about technical terms; just describe what is happening in the story.

  **1. The Selfish Chromosome (Meiotic Drive)**
  A mutant gene sabotages the other copy of itself during sperm production. Males carrying this gene produce fewer total sperm and are less fertile, but 90% of the sperm they do make carry the mutant gene. The gene spreads through the population.
  *   A) The variant spreads because it creates more copies of itself in the next generation, even though the male produces fewer offspring.
  *   B) The variant spreads because the males carrying it survive longer than other males.
  *   C) The variant spreads because the population type containing it avoids extinction better than others.

  **2. The Somatic Rebel (Cancer)**
  A single cell in a liver mutates to divide faster than its neighbours. This kills the animal, but before the animal dies, that cell line has produced millions of descendant cells.
  *   A) The variant spreads because the cell line creates more copies of itself within the body, despite killing the host.
  *   B) The variant spreads because the animal containing the cell produces more offspring than other animals.
  *   C) The variant spreads because the species containing the animal persists longer than other species.

  **3. The Chimeric Colony (Zero Relatedness)**
  A colonial sea creature forms from 20 unrelated larvae fusing together. Some colonies have cells that divide faster, hogging resources. These colonies grow large but fail to bud new colonies. The fast-dividing cell type becomes common in the ocean.
  *   A) The variant spreads because the cell type copies itself more successfully within the colony, even though the colony fails to reproduce.
  *   B) The variant spreads because the colonies containing it produce more new colonies than other colonies.
  *   C) The variant spreads because the lineage of this colonial species outlasts other species.

  **4. The Sterile Worker (High Relatedness)**
  In an ant colony, workers are sterile. They do not reproduce at all. However, colonies with more workers produce more new queens than colonies with fewer workers. The "worker" trait becomes common.
  *   A) The variant spreads because the instruction for 'being a worker' gets copied into more new ants overall, via the queens.
  *   B) The variant spreads because the individual worker survives better than a reproductive ant would.
  *   C) The variant spreads because the colony type persists longer, regardless of how many ants are produced.

  **5. The Drought Dialect (Cultural Group Benefit)**
  Birds learn song dialects. Flocks singing Dialect X find food better during droughts and the flock survives. However, within the flock, birds singing Dialect X die slightly younger than those singing Dialect Y. Dialect X becomes common.
  *   A) The variant spreads because individual birds copying the song survive longer than those who do not.
  *   B) The variant spreads because the flocks singing the song survive to pass it on, even if individual singers die younger.
  *   C) The variant spreads because the song copies itself into more brains per generation than rival songs.

  **6. The Tool Tradition (Cultural Lineage)**
  Chimpanzees use a specific stone tool to crack nuts. The technique is copied. The tools wear out, and the chimps die, but the technique persists for thousands of years across generations of chimps.
  *   A) The technique spreads because the individual chimp using it has more babies than others.
  *   B) The technique spreads because the technique persists through time, hopping from one chimp to another.
  *   C) The technique spreads because the chimp population type using it grows larger than others.

  **7. The Widespread Species (Species Sorting)**
  A trait makes a species' geographic range very large. Species with large ranges split into new species more often. The individuals within the species are identical regarding the trait. The trait becomes common across the clade.
  *   A) The trait spreads because individuals with the trait have more offspring than individuals without it.
  *   B) The trait spreads because the species containing the trait splits into new species more often than other species.
  *   C) The trait spreads because the trait copies itself into more genomes per generation.

  **8. The Fragile Clade (Clade Selection)**
  A whole group of related species (a clade) has a developmental quirk. They never go extinct due to climate change, whereas other clades do. The quirk is not beneficial to individuals, only to the clade's survival over millions of years.
  *   A) The quirk spreads because individuals with it survive better than those without it.
  *   B) The quirk spreads because the species with it produce more new species than others.
  *   C) The quirk spreads because the clade line persists longer than rival clades, regardless of individual or species success.

  ***

  ### Part 3: Scoring Key and Position Mapping

  Tally your answers. You will likely have a mix. Find the pattern below that matches your tally most closely.

  **Mostly A (Transmission Bias): The Gene/Replicator Selectionist**
  *   **Position:** Selection acts primarily on entities that copy themselves faithfully (replicators). Organisms are just vehicles.
  *   **Verdict on Cases:** You see the gene/cell/meme winning in Q1, Q2, Q3, even when the host loses.
  *   **Awkward Commitment:** You must accept that an organism's death is biologically irrelevant unless it stops the gene from copying.

  **Mostly B (Carrier Success): The Organism/Interactor Selectionist**
  *   **Position:** Selection acts on the physical body that interacts with the environment. If the body doesn't win, nothing else matters.
  *   **Verdict on Cases:** You struggle with Q1 and Q2 (Meiotic Drive/Cancer) and might argue these aren't "real" evolution or are pathological exceptions.
  *   **Awkward Commitment:** You find it very difficult to explain sterile workers (Q4) without importing complex maths about relatives.

  **Mostly C (Lineage Persistence): The Lineage/Clade Selectionist**
  *   **Position:** Individuals and species are ephemeral; only the continuous line of descent (lineage) is real. Selection is the differential persistence of these lines.
  *   **Verdict on Cases:** You prefer this answer for Q6, Q7, and Q8, focusing on long-term survival over copying rates.
  *   **Awkward Commitment:** You have to claim that individual organisms do not truly "reproduce," they just contribute to a lineage that proliferates.

  **Mixed A & B (Context Dependent): The Multi-Level Selectionist (Emergent)**
  *   **Position:** Selection happens at multiple levels simultaneously. Sometimes the gene wins (Q1), sometimes the organism (Standard cases), sometimes the group (Q5).
  *   **Verdict on Cases:** You pick A for Meiotic Drive, B for standard organisms, and B/C for the Bird Song (Q5) where group fitness is distinct.
  *   **Awkward Commitment:** You must constantly calculate whether levels are in conflict or aligned, which makes predicting evolution mathematically heavy.

  **Mixed A & B (Specifically Q4 'Kin'): The Inclusive Fitness Theorist**
  *   **Position:** The unit is the gene, but it counts copies in other bodies too.
  *   **Verdict on Cases:** You pick A for Q1 (Gene), but for Q4 (Ants) you might pick A *or* B depending on if you view the colony as a vehicle for the gene.
  *   **Awkward Commitment:** You must accept that an organism's fitness is not its own offspring count, but a weighted sum of its relatives' offspring.

  **Mixed B & C (Q5/Q7/Q8): The Species/Clade Selectionist**
  *   **Position:** Above the organism, species and clades can be units of selection if they vary and reproduce (speciate).
  *   **Verdict on Cases:** You pick B for organisms, but C for Q7 and Q8.
  *   **Awkward Commitment:** You have to admit that most evolution is driven by processes so slow (speciation/extinction) they are hard to observe directly.

  **"It Depends on the Maths": The Deflationary Bookkeeper**
  *   **Position:** The levels aren't separate physical claims; they are different ways of accounting for the same change in gene frequency.
  *   **Verdict on Cases:** You feel all answers are technically correct descriptions of the same math.
  *   **Awkward Commitment:** You risk making the debate seem purely verbal, potentially ignoring biological mechanisms that constrain which levels *can* act.

