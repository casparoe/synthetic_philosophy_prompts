answer: |-
  1. This practice presupposes a theory of corporate moral agency where the state possesses a continuous identity across generations, allowing it to inherit obligations from predecessor administrations without implicating current individual citizens. It relies on a notion of collective responsibility that transcends individual fault, grounding liability in the persistence of the institutional structure itself.
  2. It quietly excludes purely associative obligations that rely solely on shared nationality without historical causation, as well as strictly presentist harm-based theories that deny duties for harms where no living victim or perpetrator remains. By acknowledging moral debt despite legal bars, it rejects the view that moral responsibility extinguishes simultaneously with legal recourse.
  3. The practice treats the apology as a performative act that transforms moral relations by officially altering the status of the debt from ignored to acknowledged, rather than merely reporting an internal institutional mental state. This speech act functions to reconstitute the relationship between the state and the harmed group through the symbolic acceptance of moral accounting.
  4. A philosophical tension arises because the state simultaneously relies on statutes of limitation in private tort law to extinguish liability while asserting via the moral accounting clause that the obligation persists beyond legal time bars. This creates a dichotomy where the state acts as a moral agent bound by history while acting as a legal sovereign protected by temporal immunity.
  5. If the underlying view of continuous state personhood were rejected, the core institutional feature of sovereign continuity would have to be abandoned, rendering the state incapable of binding future administrations to past commitments. Consequently, the legitimacy of reparative funding based on historical wrongs would collapse, as no present entity could claim ownership of previous actions.
