answer: |-
  Hey everyone. Thanks for squeezing in. Look around the room for a second. We got some folks here who've read the big ethics books, and we got neighbors who just showed up because they saw a fridge on the corner and thought, "I can help with that." I'm neither of those, really. I just clean the shelves and worry about this stuff alot.

  I want to talk about lifeboats. You might know the old idea of "lifeboat ethics." It's pretty grim. Basically, it says resources are scarce, the boat is full, and if you let more people climb in, everyone drowns. So you have to push people away to save yourselves. It's us versus them.

  But running this network, I've started thinking about a different version. Let's call it "crew-first lifeboat" ethics.

  Here's the thing: The fridge is the boat. But the danger isn't people trying to climb in. The danger is that the crew gets tired. If we open the doors wide but nobody helps restock, if the same five people carry every box until their backs give out, the volunteers burn out. They leave. And then the boat sinks for everybody. The food stops coming. The light goes off.

  So here's the hard question I lose sleep over: Is protecting the crew just selfishness with a different name? Are we saying our comfort matters more than someone's hunger?

  I'll be honest. When I started, I thought the answer was limits. I thought we needed rules like "only one item per person" or "show ID." I thought if we guarded the resources, we'd last longer. I was wrong. That turns the fridge into a fortress, and that kills the spirit of the thing. People feel shame when they're guarded. Plus, it doesn't solve the problem. It just makes the crew feel like security guards instead of neighbors.

  But the other extreme isn't right either. We can't pretend food is infinite. It's not. If we promise endless food without building endless capacity, we're lying. And when we crash, it hurts the people who relied on us most.

  So where does that leave us? What kind of rules does a crew-first boat need?

  It means we stop talking about limiting access and start talking about expanding the crew. We can't say "take less." We have to say "help us keep this open."

  When someone comes to the fridge, we don't look at them as passengers waiting to be saved. We look at them as potential crew. Maybe they can't lift heavy boxes today, maybe they're hungry and tired. That's fine. Take what you need. But we need to be clear: this boat only floats if everyone grabs an oar eventually.

  Protecting the volunteers isn't selfish if it keeps the boat floating. It's maintenance. If I don't sleep, I can't drive the van. If we don't set boundaries on our own time, we quit, and then there's no van.

  So yeah, theres tension there. It feels messy. We want to give everything, but we have to save enough energy to give again tomorrow.

  My hope for this workshop is that we stop trying to solve this with rigid rules. Don't lock the door. But do ask for help. Put up signs that say "Take what you need, leave what you can." And when you talk to folks, tell them the truth. Tell them, "We want this here for you, but we need you to help us keep it here."

  That's the shift. From guarding the boat to manning the boat.

  Some of you know the theory behind this, and some of you just know the feeling of carrying too many bags of rice alone. Both of those truths matter. If we get this right, we don't have to choose between being kind and being sustainable. We just have to remember that the crew matters too.

  Thanks for listening. Let's get to work.
