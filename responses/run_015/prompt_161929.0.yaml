  1.  **Analyze the Request:**
      *   **User:** Retired prenatal screening service runner, now reading philosophy (specifically non-identity problem).
      *   **Problem:** Inconsistency in counselling scripts.
          *   Case A (Diagnosis of serious condition): Offer termination, avoid saying "continuing harms the child" (Non-Identity Problem logic: existence vs. non-existence). Language: "isn't a life we'd wish on anyone."
