      *   *Draft 1 (Point 3):* There is no principled metaphysical line between the halves because lifestyle changes and IVF selection both determine which child exists, just as termination decisions do. The distinction tracks only whether a same-identity alternative is socially salient, not whether identity is actually preserved.
      *   *Draft 1 (Point 4):* Both a strict person-affecting view and a strict impersonal total utilitarian view could license this practice by ignoring the identity implications in favor of promoting welfare or reducing suffering. The practice is underdetermined because it prioritizes clinical outcomes over philosophical consistency regarding who counts as a victim.
      *   *Draft 1 (Point 5):* If you adopted a consistent non-identity theory, you would have to stop saying "this will harm your baby" and instead say "this choice brings into existence a child with greater health burdens." If you adopted a consistent person-affecting view, you would have to acknowledge that termination harms the existing fetus even if continuing would be difficult.

