  1. Your practice implicitly adopts a context-sensitive theory of harm that treats the fetus as a fixed individual during preventative care but as a contingent being during termination decisions. This allows you to assign victims for lifestyle choices while denying them for existence choices, despite the metaphysics of conception remaining constant.

  2. Strictly, the practice only presupposes that patients need actionable reasons to change behavior or consider termination, not that those reasons withstand metaphysical scrutiny about identity. It fits comfortably with contradictory theories because it treats harm as a pragmatic lever rather than a truth claim about who exists.

  3. There is no principled line regarding identity because lifestyle changes and IVF selection alter which child exists just as much as termination decisions do. Even in IVF without a default outcome, the distinction tracks only the availability of a same-identity alternative in the counselling frame, not whether identity is actually preserved.

  4. A pragmatic consequentialist theory licenses both halves by ignoring identity metaphysics in favor of reducing suffering, while a pluralistic theory permits switching frameworks based on clinical context. The practice is underdetermined because it relies on patient intuition rather than a single coherent account of personhood.

  5. Swapping to a consistent non-identity theory would require replacing "this will harm your baby" with "this choice results in a child with greater medical needs," removing the specific victim from preventative advice. Conversely, a consistent person-affecting view would force you to admit termination harms the fetus, potentially undermining the neutrality of the termination script.
