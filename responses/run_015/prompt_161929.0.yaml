      *   *Point 4: Rival Theories.* A strict person-affecting view would forbid the termination script (no harm if life worth living), while a strict impersonal view would forbid the lifestyle script (no specific victim if identity changes), yet both license the current practice by ignoring the metaphysics in favor of outcomes.
      *   *Point 5: Concrete Changes.* Swapping to a consistent non-identity theory would require banning "this will harm your baby" in favor of "this creates a child with greater needs," while a consistent person-affecting view would require admitting termination harms the specific fetus regardless of condition.

