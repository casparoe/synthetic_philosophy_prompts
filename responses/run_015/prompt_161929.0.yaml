  2.  **Deconstruct the Philosophical Issue:**
      *   The user has identified the Non-Identity Problem (Parfit).
      *   *Standard NIP view:* If an action causes a person to exist with a condition vs. not exist, they are not harmed by being caused to exist (unless life is not worth living).
      *   *Counselling Practice:* Seems to use NIP logic for termination decisions (don't blame the child/parent for existence) but rejects it for lifestyle advice (blame/warn about harm to *this* child).
      *   *The Tension:* Lifestyle changes also affect which sperm/egg meet (time-sensitive conception), so technically different children. IVF makes this explicit (selecting embryos = selecting identities).
      *   *The User's Insight:* The practice seems to treat "harm" differently based on whether the alternative is non-existence (termination) or altered existence (lifestyle), even though metaphysics suggests identity changes in both.
