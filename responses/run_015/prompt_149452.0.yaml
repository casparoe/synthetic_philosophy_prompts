          *   **Crucial Constraint:** Account for how one kind can suppress, simulate, or hybridise with another *without* dissolving categorical boundaries into a featureless continuum.
          *   **Contradiction Check:** If any subset of desiderata is jointly unsatisfiable (especially rigid classification vs. cognitive plasticity), say so plainly.
          *   **Conceptual Check:** If the request rests on a confused premise (e.g., demanding a single unified theory is mistaken), push back directly.
          *   **Language:** British English.
