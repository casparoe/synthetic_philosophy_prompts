  9.  *(Self-Correction on British English)*: Make sure to use "whilst", " amongst", "modelling", "signalling".

  10. *(Final Review of the Prompt's Constraint)*: "If any subset of these desiderata is jointly unsatisfiable... say so plainly." I must explicitly state that rigid categories + fluid hybridisation is the unsatisfiable pair unless reinterpreted.

