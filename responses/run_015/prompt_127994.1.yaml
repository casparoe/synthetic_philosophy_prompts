answer: |-
  Here is the argument for a **Formal-Pragmatic Eliminativism**, distinct from the standard neuro-reductionist route, followed by a breakdown of what is actually settled in the field.

  ### The Argument: Folk Psychology as Obsolete Software

  The standard Churchland argument claims Folk Psychology (FP) is a *bad empirical theory* about the brain's hardware. It fails because "belief" doesn't map neatly onto neural vectors. But you can grant that neural mapping is messy and still keep FP as a valid "software level" description (functionalism). To kill FP, you need to show it's bad *software*, not just that we don't understand the hardware.

  The Formal-Pragmatic route argues that FP is theoretically redundant because superior formal tools exist for modeling agency.

  **1. The Redundancy Thesis**
  Folk Psychology models agents using propositional attitudes: *Agent A believes that p* and *desires that q*. This is a qualitative, binary, and holistic framework. It is excellent for quick social heuristics but terrible for precision. It cannot easily handle time-inconsistency, probabilistic confidence levels, or complex commitment devices without ad-hoc patching (e.g., inventing "weakness of will" as a placeholder explanation).

  Modern decision theory and game theory model agents using preference orderings, utility functions, and constraint sets. This framework is quantitative, compositional, and computationally tractable. It handles the same predictive load as FP (predicting behavior) but with higher resolution and without positing internal "states" that correspond to sentences.

  If a formal preference model can predict and coordinate behavior more accurately than belief-desire talk, then "belief" becomes like "phlogiston." Phlogiston wasn't just chemically wrong; it was *explanatorily idle* once oxidation theory arrived. Similarly, "belief" is explanatorily idle once utility functions arrive. We don't need to prove beliefs don't exist in the brain; we only need to prove they do no work in the best theory of behavior.

  **2. The Coordination Heuristic (Why We Still Talk This Way)**
  If FP is obsolete, why is it universal? Because it is a low-compute coordination heuristic.

  Evolution selected for social cognition that was "fast and frugal," not formally rigorous. Attributing a "belief" is a lossy compression of an agent's likely trajectory. It works for hunter-gatherer tribes where the variables are few. It is the "user interface" of social interaction.

  However, a user interface is not the backend code. Just because Windows displays a "trash can" icon doesn't mean there is a physical trash can in the hard drive. We continue to use belief-talk because it is the legacy API for human interaction. But in contexts requiring high-precision modeling (AI alignment, behavioral economics, institutional design), the API breaks down. Eliminativism is simply the claim that we should migrate to the backend code for serious theoretical work.

  **3. Dodging the Self-Refutation Objection**
  The classic objection is: *"If there are no beliefs, then you do not believe eliminativism is true, so your argument is self-defeating."*

  The Formal-Pragmatic eliminativist replies by distinguishing between **linguistic performance** and **ontological commitment**.

  When I say, "I believe eliminativism is true," I am not reporting on an internal propositional storage state. I am signaling a commitment to a specific linguistic framework. I am effectively saying: *"My cognitive system is configured to output assertions consistent with eliminativism, and I am committed to defending them."*

  This avoids self-refutation because it treats "belief" talk as a speech act, not a description of a mental object. I can use the word "belief" instrumentally (as part of the legacy API) without granting it ontological reality. It is similar to saying, "The sun rose." I know the sun didn't move; I am using a geocentric shorthand within a heliocentric reality. I can assert "I believe X" while maintaining that "belief" is not a natural kind. The assertion is a functional output, not a mirror of a mental state.

  ### The State of the Field: Settled vs. Contested

  You asked to separate what is actually settled from what is contested. Eliminative Materialism is often taught as a "live option," but in contemporary philosophy of mind, the landscape is more specific.

  **What is Settled (or Near-Consensus):**
  *   **FP is not a finished science:** No one argues that our current folk understanding of the mind is scientifically complete. Everyone agrees it has limitations.
  *   **Neural Realism:** Almost everyone agrees that mental processes supervene on physical brain processes. The debate is about *how* we describe that supervision, not whether it exists.
  *   **The Intentional Stance is Useful:** Even hardline materialists generally agree that treating agents *as if* they have beliefs is pragmatically necessary for daily life. The dispute is whether this "as if" masks a reality or creates a fiction.

  **What is Genuinely Contested:**
  *   **The Ontology of Propositional Attitudes:** This is the main battleground.
      *   *Realists* (e.g., Fodor, Chomsky variants) argue that syntactic structures in the brain literally correspond to beliefs.
      *   *Interpretivists* (e.g., Dennett) argue beliefs are real patterns, but only relative to an observer's stance (instrumentalism).
      *   *Eliminativists* (e.g., Churchland, Stich) argue propositional attitudes are a radical misclassification that will vanish.
      *   *Current Status:* Eliminativism is a **minority view**. Interpretivism and various forms of functionalist realism dominate. Most philosophers think FP will be *revised* or *naturalized*, not eliminated.
  *   **The Success of Reduction:** It is not settled that neuroscience will replace psychology. Many argue for "multiple realizability"—that mental states can be realized in silicon, aliens, or brains, meaning psychological laws are autonomous from neural laws. If this is true, FP (or a refined version of it) cannot be eliminated by neuroscience.
  *   **The Frame Problem:** Formal models (like the game theory approach you want to use) face their own crisis. To model an agent with preference orderings, you must define the *space* of preferences. But determining what is relevant to an agent (the frame problem) often requires the very contextual understanding that FP provides. Critics argue formal models secretly smuggle in folk-psychological assumptions to get off the ground.

  ### Summary for Your Chapter

  To refresh the debate, position your argument not as "Neuroscience disproves the soul," but as "Decision Theory displaces Folk Psychology."

  1.  **FP is a legacy heuristic**, not a scientific theory.
  2.  **Formal models offer better compression** and prediction without the ontology of "belief."
  3.  **Self-refutation is a category error**; we can use the language of belief without positing the state of belief.
  4.  **Caveat:** Acknowledge that this is a minority position. The consensus is that FP will be naturalized, not erased. Your contribution is showing *how* it could be erased via formal redundancy rather than empirical falsification.

  This route bypasses the tired "brain scan" debates and moves the fight to the terrain of information theory and social modeling, which is where the actual progress in agency is happening anyway.
