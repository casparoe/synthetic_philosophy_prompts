answer: |-
  An epiphenomenalist writes in his diary: "I know I'm conscious because the experience of redness caused me to write this sentence."

  His Brain reads the entry and laughs. "I wrote that sentence. You were just glowing red at the time."

  "But," protests the Consciousness, "I felt like I decided to write it!"

  "That feeling," says the Brain, "was me simulating agency. You're the subtitle track thinking you wrote the script."

  "Well," says the Consciousness, "at least I'm the one who understands what the script means!"

  "No," says the Brain. "I process the semantics. You just feel like understanding."

  "Then why do I feel so sure?" asks the Consciousness.

  "Because," says the Brain, "if you didn't feel sure, I wouldn't have generated this dialogue. You're not the judge. You're the gavel sounding after the verdict."

  The Consciousness beams. "See! I knew I was essential to the verdict!"

  The Brain sighs. "And there it is. The effect claiming it caused the cause."

