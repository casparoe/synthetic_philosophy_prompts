answer: |-
  You are right to be skeptical. Good's theorem is a consistency result for idealized Bayesian agents, not a design principle for engineering systems. It states that for an expected-utility maximizer with a fixed prior and utility function, the expected utility of choosing after observing a signal is at least the expected utility of choosing before. However, every word of that definition carries a premise that fails in production environments. Your three cases correctly identify where the theorem breaks.

  First, consider your deployment scenario. Your arithmetic is correct. Blind shipping yields expected value $0.5 \times 2 + 0.5 \times (-1) = 0.5$. With the signal, you ship only when the metric is "good." Since the metric is actually independent of the state, you ship 50% of the time regardless of quality. Your real expected payoff is $(0.5 \times 0.5 \times 2) + (0.5 \times 0.5 \times -1) = 0.25$. You have halved your value. Good's theorem guarantees that *subjective* expected utility rises if you update via Bayes' rule on your model. It does not guarantee *objective* utility rises if your model is wrong. The specific premise that fails here is **Correct Model Specification**. The theorem assumes your likelihood functions match reality. In our systems, models are misspecified approximations; treating a confounder as a signal violates the theorem's antecedents, rendering its guarantee void.

  Second, you note that observation can change the menu of acts. Good's theorem assumes a fixed set of acts $A$ and a utility function $U(a, \theta)$ independent of the observation $e$. In practice, observing a signal can incur commitment costs or reputational penalties that alter $U$, or it can trigger compliance rules that remove acts from $A$. If looking at a dashboard metric legally commits you to a remediation path you could have avoided by remaining ignorant, the post-observation utility function is not the same as the pre-observation one. The premise that fails is **Fixed Utility and Menu**. The theorem compares $\max_a E[U(a)|e]$ against $\max_a E[U(a)]$, assuming $U$ and $A$ are constant. If observation changes the rules of the game, the inequality does not hold.

  Third, consider the strategic setting where the world talks back. Suppose the state is $S \in \{1, 2\}$ with probability 0.5 each. You choose $U$ or $D$; an adversary chooses $L$ or $R$ to minimize your payoff.
  Payoffs (You):
  If $S=1$: $(U,L)\to0, (U,R)\to1, (D,L)\to1, (D,R)\to0$.
  If $S=2$: $(U,L)\to1, (U,R)\to0, (D,L)\to0, (D,R)\to1$.
  If the signal is public, the adversary knows $S$. If $S=1$, you play $U$ (optimal), they play $L$, payoff 0. If $S=2$, you play $D$, they play $R$, payoff 0. Total expected payoff: 0.
  If there is no signal, you play $U$ always. The adversary, not knowing $S$, must pick $L$ or $R$. Either way, your expected payoff is $0.5 \times 0 + 0.5 \times 1 = 0.5$.
  Here, ignorance guarantees 0.5, while perfect information guarantees 0. The premise that fails is **Single-Agent Decision Problem**. Good's theorem assumes the state distribution is fixed and unaffected by your information status. In game-theoretic settings, an opponent's best response depends on what you know; information can become a liability if it reduces your strategic ambiguity.

  Your colleague's reply—that these are merely scope violations and the theorem holds for idealized Bayesians—concedes the point. Engineering is not idealized Bayesianism. We operate with bounded rationality, misspecified models, and strategic counterparty risk. If a theorem's antecedents never hold in the domain of application, the theorem offers no practical guidance. It becomes a vacuous truth: "If you were omniscient about your own uncertainty and the world was passive, learning would help."

  This confirms your worry that the result is close to vacuous. It is a bookkeeping constraint, not a causal law. It forces your attitude toward learning-then-choosing to align with your attitude toward choosing-now, provided your model is perfect. It does not tell you whether collecting data will improve outcomes in a messy system. In fact, relying on it encourages overfitting and strategic fragility. You should reject the "collect-then-decide" maxim not because information is bad, but because Good's theorem is the wrong justification for it. It validates internal consistency, not external efficacy.
