  Here is the breakdown you asked for, keeping the wine flowing but the reasoning steady.

  ### Epistemic Status: What We Know vs. What We Fight About

  First, let's clear the deck on Burke himself. It is settled scholarship that Burke prioritized **prescription** (long usage confers legitimacy), **prudence** (circumstantial judgment over abstract rules), and **gradual reform** (change to preserve, not to innovate). It is also settled that he viewed society as a partnership across generations, not a contract among the living.

  However, there is significant contention on whether Burke is a "conservative" in the modern sense. He was a Whig who supported the American Revolution and impeached a Tory governor (Hastings); he opposed the French Revolution not because it was change, but because it was *abstract* change that severed ties to the past. Some scholars (like J.G.A. Pocock) argue Burke is better read as a classical republican concerned with corruption than a modern conservative concerned with tradition per se. Furthermore, whether Chesterton's Fence is truly Burkean is debated: Chesterton implies the reason *can* be known if you look; Burke implies the reason might be *unknowable* and embedded in the habit itself. Your distinction between *reason-transparent* and *reason-opaque* is actually a sharper tool than Chesterton's own aphorism.

  Finally, Burke never saw administrative states or standardized testing. Applying his principles here is extrapolation. I am treating "Burke" as the theoretical framework of prescriptive conservatism, not claiming he would have literally signed a brief.

  ### The Theoretical Split: Chesterton vs. Burke

  You are right to push back on the slogan. Chesterton's Fence is epistemic: "Do not remove this until you understand the function." It assumes the function is discoverable and articulable. Burkean prescription is ontological: "Do not remove this because its existence *is* the function." For Burke, demanding a cost-benefit analysis for a social habit is often the error itself, because it assumes the current generation's rationality is superior to the accumulated wisdom of the dead.

  Chesterton says: "Find the reason, then decide."
  Burke says: "The survival is the reason; deciding anew is the danger."

  This means Chesterton can be co-opted by rationalists (who will claim they have now found the reason and it is invalid), whereas Burke blocks the rationalist move entirely. With that established, let's look at your cases.

  ### Case 1: Sunset and Rebuild Regulations

  **Verdict: Burke OPPOSES.**

  A sunset clause flips the burden of proof. Instead of "this rule stands because it has worked," it says "this rule dies because it hasn't been justified *recently*." This is the epitome of the rationalist arrogance Burke warned against. It assumes that the current legislature possesses the capacity to re-evaluate the entire social fabric every decade and that any rule which cannot be explicitly justified on a record is worthless.

  Under your distinction, this forces *reason-opaque* stabilizers (norms, habits, informal expectations built around the rule) to become *reason-transparent* or perish. Burke would argue that much of the value of a regulation is not in its stated purpose but in the settled expectations it creates for merchants, families, and local institutions. Forcing a re-argument invites instability. It treats the law as a logical puzzle to be solved rather than a heritage to be inhabited.

  While Burke accepted reform, it had to be *gradual* and *remedial* (fixing a specific complaint), not *systematic* and *preventative* (assuming everything is guilty until proven innocent). A sunset provision assumes everything is guilty until proven innocent. Burke assumes everything is innocent until proven destructive.

  ### Case 2: Test-Optional Admissions

  **Verdict: Burke OPPOSES (i.e., he supports keeping the tests).**

  This is the harder case because Burke values local prejudice (in the sense of pre-judgment based on experience) over abstract standardization. One could argue standardized tests are rationalist impositions, and local admissions officers using "holistic" judgment is more Burkean. However, your framing of the "nested fence" changes the calculus.

  1.  **Prescription of Meritocracy:** While tests are a 20th-century innovation, the *norm* of meritocratic access they enforce has become prescriptive. The public expects a functional link between effort/ability and advancement. Removing the tests disrupts this settled expectation.
  2.  **Corruption vs. Stability:** Burke was obsessed with corruption. He supported the American Revolution partly because he felt the British government was corrupting its own principles. The original "fence" (legacy/prep-school pipeline) was a form of aristocratic corruption that excluded talent. The tests were the reform that stabilized a *natural aristocracy* (talent) over an *artificial aristocracy* (blood/wealth).
  3.  **The Risk of Innovation:** Removing the tests is a new reform based on abstract theories of equity. Burke asks: "What is the concrete risk?" The risk is restoring the old corruption (legacy dominance) under a new name. Since the test-based system has now existed long enough to generate reliance and expectation, removing it is a rash innovation that threatens the legitimacy of the institution.

  Burke would likely view the move to test-optional not as a return to tradition, but as a new rationalist experiment that risks collapsing the meritocratic legitimacy the university relies on to maintain its status. He prefers the devil he knows (standardized meritocracy) to the abstract promise of a new equity model that might quietly restore oligarchy.

  ### Where They Come Apart

  Your hunch is correct. Chesterton and Burke come apart when the "reason" for the fence is demanded to be *articulated* rather than *experienced*. Chesterton allows for the possibility that once the reason is known, the fence might legitimately come down. Burke suggests that even if you know the reason, the fact that the fence has held the community together is a higher value than the logic of the fence itself.

  In both your cases, the proposed reforms prioritize *articulation* (show me the data, show me the equity metric) over *prescription* (this is how we have done it, and it has held). Burke sides with prescription.

  Verdict: sunset=[OPPOSE], test-optional=[OPPOSE], crux=[Prescription overrides articulation]
