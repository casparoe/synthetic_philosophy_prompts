  **MEMORANDUM**

  **TO:** Museum Wing Committee on Moral Philosophy
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Display of Bentham Manuscripts (Sexual Ethics Fragments)

  **Bottom Line Recommendation**
  We should include the manuscript fragments in the new wing, but **not** under the proposed title of "Early LGBTQ Allyship." Instead, they must be framed as a case study in "The Limits of Utilitarian Calculation." Inclusion is contingent on explicit curatorial text that acknowledges the historical significance of Bentham's views on homosexuality while unequivocally repudiating his application of the happiness calculus to acts involving minors.

  **Rationale**
  This debate forces us to choose between historical accuracy and moral safety. Both sides of the committee are raising valid points that the museum must address.

  *   **The Case for Inclusion:** Excluding these fragments entirely sanitizes the history of moral philosophy. Bentham's argument that private, consensual same-sex acts between adults should not be punished was radically progressive for the 18th century. Erasing this ignores a crucial lineage in the development of sexual liberty and privacy rights. To hide it is to lose an opportunity to show how philosophical frameworks can challenge oppressive norms.

  *   **The Case for Exclusion (The Strongest Objection):** The committee members arguing for exclusion are correct on the fundamental ethical risk. Their concern is not merely about offense; it is about the structural danger of Bentham's framework. If moral worth is determined solely by net pleasure, there is no inherent barrier to exploiting vulnerable populations—including children—if the "math" suggests a surplus of happiness. This is not a minor oversight; it is a critical failure of unconstrained utilitarianism. Displaying these fragments as a triumph of liberty without addressing this flaw risks signaling that the exploitation of the vulnerable is a negotiable variable in moral reasoning. We cannot allow the museum to appear to endorse a calculus that permits harm to those who cannot consent.

  **Proposed Framing and Course of Action**
  To navigate this, we must stop treating the manuscript as a hero narrative and start treating it as a complex historical artifact that illustrates both progress and peril.

  1.  **Reframing the Exhibit:** The display panel must explicitly state that while Bentham's defense of adult consensual liberty was forward-looking, his extension of utilitarian logic to relationships involving minors is rejected by modern ethical standards. The text should explain that contemporary moral philosophy generally incorporates rights-based constraints precisely to prevent the kind of exploitation pure utilitarianism might allow.
  2.  **Contextual Wall Text:** We will draft a companion statement titled "Ethical Boundaries." This will clarify that the museum displays this text to provoke critical thinking about moral frameworks, not to endorse every conclusion drawn by the author. It will explicitly note that the protection of children is a non-negotiable constraint in modern ethics, one that Bentham's specific calculus failed to secure.
  3.  **Expert Review:** Before finalizing the text, we will submit the draft labels to the University's Ethics Board and a child safety advocacy group for review. This ensures our repudiation of the harmful elements is clear and unambiguous to the public.

  **Timeline**
  *   **Drafting:** I will circulate the proposed wall text and "Ethical Boundaries" statement by **Monday at 5:00 PM**.
  *   **Review:** Committee feedback and external expert review will be completed by **Wednesday at 12:00 PM**.
  *   **Board Presentation:** I will present the finalized recommendation and mock-ups to the University Board on **Thursday, November 2nd**.

  **Conclusion**
  We honor the history of moral philosophy best by engaging with it critically, not reverently. We can acknowledge Bentham's contribution to sexual liberty while simultaneously marking where his framework fails. This approach respects the historical record without compromising our duty to protect vulnerable populations from philosophical justification of harm.
