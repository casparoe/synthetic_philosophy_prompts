  7.  **Final Polish:** Organize by the user's four bullet points, then a section-by-section critique. Ensure the distinction between "Ada is right about math" and "Ada is right about human nature" is clear. (The prompt asks about the *argument*, so focus on the logic).

      *(Self-Correction on §1)*: The user calls it "restriction on outcome space." In FDT, it's "logical counterfactuals." I should mention FDT as the modern term.
      *(Self-Correction on §4)*: "Role-neutral" is very close to Harsanyi's utilitarianism but applied strategically. I should mention **Team Reasoning** specifically as it's the game-theoretic term.
      *(Self-Correction on §5)*: The $1/e$ limit applies to the "exactly one must act" game (Volunteer's Dilemma), not the PD. The user switches games in §5 ("act two... exactly-one setup"). I need to acknowledge that switch.

