  So: which step do you reject, and is the argument invalid or valid-with-a-false-premise? If those distinctions Marcus names are the answer, show me exactly which step splits in two and what each half says. I'd much rather keep (2) and (6) than (4), and I'd rather not give up (8) unless I have to, because if I do I owe you an explanation of what "nonlocal" even means other than "violates a Bell inequality." Also my physics teacher mumbled something about no-signalling only holding in "quantum equilibrium" and that you could in principle signal with non-equilibrium particles — didn't follow that at all, explain it like I'm 17 if it matters. And last thing: if (7) is wrong, what experiment or observation could ever tell me the world is nonlocal, given that no one will ever see an actual faster-than-light message? What am I paying for each way out?
