answer: |-
  Pull up a chair. This is exactly the kind of wall you hit when you first really grapple with naïve realism and its disjunctivist commitments. It's a good wall to hit because it means you're taking the metaphysics seriously.

  Let's do exactly what you asked. I'm going to brainstorm through the tension you're feeling, laying out the logic as I see it, and then I'm going to stop and correct a specific premise in your understanding that is causing the whole structure to collapse.

  ### Brainstorming the Impasse

  Okay, so you're staring at the Argument from Illusion. The classic move is:
  1.  In a hallucination, it seems to the subject that they are perceiving $X$.
  2.  In a veridical perception, it seems to the subject that they are perceiving $X$.
  3.  If the "seeming" is subjectively indistinguishable, there must be a common mental factor (a sense-datum, a representation, a qualitative state) that constitutes that seeming in both cases.
  4.  Therefore, even in veridical perception, we are directly aware of this common mental factor, not the world.

  You understand the Disjunctivist as trying to block step 3. So far, so good.

  But here is where your interpretation is creating the friction: You're reading the Disjunctivist as saying, "In the hallucination case, there is no 'seeming' at all. There is just a causal glitch."

  If that were true, your "changing the subject" objection would be devastating. It would mean the Disjunctivist is denying the very datum that starts the argument: the first-person authority of the subject. If I hallucinate a pink elephant, and I say "I see a pink elephant," and the Disjunctivist says "No, there is no experiential content there, just a neural misfire," they aren't doing philosophy of mind anymore; they're doing eliminativism. They would be denying the existence of the phenomenon they are supposed to be explaining.

  Furthermore, if the bad case has no phenomenology, how do we explain the *indistinguishability*? Indistinguishability implies two positive states that cannot be told apart. If one state is "rich relational contact with the world" and the other is "null/void," they should be distinguishable by the sheer lack of content in the void.

  So, your intuition is correct: if Disjunctivism claims the bad case is phenomenally empty, the view is dead on arrival. It fails to account for the introspective evidence. The subject *does* feel something. The reports aren't false behavioral outputs; they are sincere reports of a genuine subjective state.

  So, where is the breakdown? It has to be in how we define "mental state" and "experiential content." You are assuming that for a state to have phenomenology, it must have an internal constitution (a common factor). The Disjunctivist is challenging that assumption.

  ***

  ### The Correction

  Okay, put down the pen for a second. I need to correct a significant misrepresentation in your setup. It's a very common one, but it's the source of your wall.

  **You wrote:** *"Disjunctivists claim that in a hallucination there's literally no mental state with experiential content—it's just a neural misfire that produces behaviour but no 'what it's like'."*

  **This is incorrect.**

  Disjunctivists (of the McDowell/Martin/Snowdon variety) do **not** deny that there is "something it is like" to hallucinate. They do not deny that the subject has a conscious experience in the bad case. They do not claim the subject is a zombie during a hallucination.

  If they denied that, they would indeed be changing the subject.

  Here is the technical correction you need to make to get the view to work:

  **1. The Common Kind Assumption (CKA)**
  The Argument from Illusion relies on the **Common Kind Assumption**. This is the claim that the fundamental nature of the mental state in the veridical case and the hallucinatory case must be of the *same fundamental kind*. If they are indistinguishable from the inside, they must share a common psychological genus (e.g., both are representational states, or both are sense-datum apprehensions).

  **2. The Disjunctivist Move**
  The Disjunctivist accepts that there is *an* experience in the hallucination case. They accept there is phenomenology. **However, they deny that the phenomenology in the bad case is constituted by the same kind of state as the good case.**

  *   **Good Case:** The nature of the experience is *relational*. It is constituted by the actual object in the world. The phenomenology is the world making itself manifest to the subject.
  *   **Bad Case:** The nature of the experience is *not relational*. It is not constituted by the world.

  **Crucially:** The Disjunctivist argues that the phenomenology of the bad case is **exhausted by the fact that it is indistinguishable from the good case.**

  This is the hard part to swallow. They are saying: "What is it like to hallucinate? It is like a state that you cannot distinguish from seeing." They refuse to give the hallucination a *positive* characterization that overlaps with perception. They treat the hallucination as a distinct metaphysical kind that merely *matches* the perception epistemically.

  So, they aren't saying there is *no* 'what it's like'. They are saying the 'what it's like' in the bad case is not a shared mental object. It is a different kind of event entirely, one that merely mimics the epistemic profile of perception without sharing its metaphysical nature.

  **3. Addressing Your Worry About Reports**
  You asked: *"Wouldn't they have to say those reports are just false behavioural outputs?"*

  No. The subject's report ("I see a snake") is sincere and accurate regarding how things *seem*. The Disjunctivist distinguishes between:
  *   **How things seem:** (Accepted in both cases).
  *   **What constitutes the seeming:** (Different in both cases).

  When the hallucinating subject says, "I am having a visual experience," the Disjunctivist agrees. They are having an experience. But when the subject (or the philosopher) infers, "Therefore, I am in a state of the same kind as I would be if I were actually seeing," the Disjunctivist says: "That inference is invalid."

  The report tracks the *epistemic* situation (indistinguishability), not the *metaphysical* situation (constituents of the experience).

  ### Why This Matters for Your Thesis

  If you keep the idea that Disjunctivists deny phenomenology in the bad case, you will never get past the first chapter of your literature review. You need to pivot your understanding to the **metaphysics of constitution**.

  The Argument from Illusion argues:
  Indistinguishability $\rightarrow$ Common Mental Factor.

  The Disjunctivist argues:
  Indistinguishability is an **epistemic** notion, not a **metaphysical** one. Just because you can't tell two things apart doesn't mean they are made of the same stuff. A perfect fake diamond is indistinguishable from a real one to the naked eye, but one is carbon and the other is glass. They don't share a "common visual factor" that makes them look shiny; the real one is shiny because of its lattice structure, the fake one is shiny because of refraction. They are different kinds of shiny.

  Similarly, in perception:
  *   **Veridical:** Phenomenology is constituted by the external object.
  *   **Hallucination:** Phenomenology is constituted by... well, the Disjunctivist is often vague here (some say neural states, some say primitive properties), but they insist it is **not** the same kind of state as the veridical one.

  ### Summary of the Fix

  1.  **Drop the claim** that Disjunctivists deny phenomenology in hallucinations. They affirm it.
  2.  **Insert the distinction** between Epistemic Indistinguishability (subjective) and Metaphysical Commonality (objective).
  3.  **Reframe the Argument from Illusion:** It doesn't fail because there is no mental factor in the bad case; it fails because the existence of a mental factor in the bad case does not force us to posit a *common* mental factor in the good case.
  4.  **Reframe the Reports:** Subjects are reporting on indistinguishability, not metaphysical identity. Their reports are true about how things seem, but false if interpreted as claims about the underlying nature of the state.

  Does that loosen the knot? You were treating Disjunctivism as an eliminativist view about hallucinatory experience, when it's actually a pluralist view about the *types* of experience.
