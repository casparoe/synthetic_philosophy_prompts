answer: |-
  **Grade: 21/25**

  **Assessment Summary**
  This is a high-quality response in terms of historical accuracy and conceptual understanding, but it is significantly undercut by failure to adhere to length constraints and prompt limitations. You demonstrate a sophisticated grasp of current archaeological debates (particularly regarding Easter Island and the Maya), but the brevity of the answer prevents the argument from being fully substantiated.

  **Strengths (What works)**
  *   **Historiographical Nuance:** You correctly identify the shift in archaeological consensus regarding Easter Island. Distinguishing between pre-contact ecological change and post-contact population collapse (slave raids/disease) shows you are engaging with the Hunt/Lipo critique of Diamond, which is exactly the level of detail this course requires.
  *   **Definitional Precision:** Your distinction between "political decentralization" and "societal death" regarding the Maya is excellent. Identifying that writing and religion persisted despite the abandonment of the southern lowlands directly addresses the prompt's requirement to specify what stayed intact.
  *   **Comparative Logic:** The thesis is clear: "collapse" should be reserved for the loss of state institutions and writing (Bronze Age), not merely relocation or simplification (Maya/Rapa Nui). This provides a strong organizing principle for the essay.

  **Weaknesses (Where it slips up)**
  *   **Prompt Adherence (Case Selection):** The prompt explicitly asked you to **"pick two cases."** You discussed all three. While this shows breadth, it violates the constraint and forces you to spread your word count too thin. This directly contributes to the lack of depth in each section.
  *   **Word Count & Development:** The response is approximately 250 words, which is half the requested length (~500 words). This is not just a mechanical error; it results in underdeveloped analysis. For example, you mention the "complexity-theory view" and societies "voluntarily scaling back," but you do not explain *why* the costs outweighed benefits for the Maya versus the Bronze Age palaces. This is a major theoretical claim that requires elaboration to be convincing.
  *   **Bronze Age Generalization:** You state Egypt "survived" but use the Bronze Age as your primary example of "collapse." This creates a slight tension in your argument. If the "Bronze Age System" collapsed but one major pillar (Egypt) persisted (albeit weakened), you need to briefly explain why Egypt's survival doesn't undermine your definition of systemic collapse. You gloss over this to save space.

  **Scoring Justification**
  *   **Content & Accuracy (9/10):** Your facts are correct, and your engagement with the "collapse vs. transformation" debate is sophisticated.
  *   **Argument & Thesis (5/5):** Your position is clear, defensible, and directly answers the prompt.
  *   **Constraints & Depth (7/10):** This is where points were lost. Ignoring the "pick two" instruction and writing 50% of the required length limits the depth of analysis. The "complexity theory" point is asserted rather than argued due to space constraints.

  **Final Note:**
  You clearly know the material at an A-level. However, in a midterm context, the ability to develop an argument within set parameters is part of the assessment. Expanding the Maya and Bronze Age sections to meet the word count would have allowed you to explain the *mechanisms* of failure/adaptation rather than just listing the outcomes.
