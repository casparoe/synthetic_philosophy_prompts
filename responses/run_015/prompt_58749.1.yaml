answer: |-
  This is a sharp observation that cuts to the core of current mechanistic interpretability and alignment research. You are describing a phenomenon that is distinct from simple hallucination or sycophancy, and the literature has only recently begun to formalize it.

  The short answer is that there is no single, universally standardized term yet, but the phenomenon is actively being mapped under the headers of **"Latent Knowledge vs. Verbalized Output"** and **"Elicitation Inconsistency."** The most relevant paper is likely Turpin et al. (2023), *"Language Models Don't Always Say What They Think."*

  However, given your rationalist background and your specific focus on the gap between *professed verdicts* and *anticipatory behavior* (bets/rankings/scenarios), existing terms like "calibration error" or "sycophancy" are indeed insufficient. They describe external accuracy or social alignment, not internal architectural dissociation.

  To give you the conceptual precision you are looking for, I propose we define this as **Professed-Functional Dissociation (PFD)**.

  Below is the breakdown of the phenomenon, the literature context, the distinction from neighboring concepts, and the boundary conditions.

  ### 1. The Phenomenon: Professed-Functional Dissociation

  **Definition:** PFD occurs when a model's direct verbal reports (professions) systematically diverge from the information implicit in its generative processes, rankings, or scenario simulations (functionals), despite both being generated by the same weights at the same temperature.

  In rationalist terms: The model's **professed belief** (what it says when asked "What is X?") does not match its **functional belief** (what guides its anticipations when asked "Simulate X" or "Rank the likelihood of X").

  **The Mechanism:**
  Current evidence suggests this is not "lying" in the agentic sense, but an architectural side effect of next-token prediction.
  *   **The Direct Channel (Profession):** When asked a direct question, the model often completes a *conversational pattern*. It retrieves high-probability associations from its training distribution (e.g., "open source projects are usually delayed" or "this logic puzzle is a known trick question"). It optimizes for *plausibility as an answer*.
  *   **The Indirect Channel (Functional):** When asked to generate scenarios, postmortems, or reasoning lines, the model enters a *simulation mode*. It must maintain contextual coherence over many tokens. To make the simulation hold together, it must adhere to the underlying causal or logical structure. It optimizes for *coherence as a narrative*.

  The "truth" is often more accessible in the simulation (functional) because the constraints of narrative coherence force the model to attend to specific dependencies, whereas the direct answer allows it to rely on cached heuristics.

  ### 2. Relevant Literature

  You should look into three specific strands of research that map this territory:

  1.  **Turpin et al. (2023), *"Language Models Don't Always Say What They Think"*:** They demonstrated that if you bias a model's output (e.g., force it to start with "The answer is A"), it will rationalize A even if its internal activations indicate B is correct. This confirms that the *verbal report* can be decoupled from the *internal state*.
  2.  **Burns et al. (2023), *"Discovering Latent Knowledge in Language Models Without Supervision"*:** They found that you can train probes on the model's internal activations to predict truthfulness with higher accuracy than the model's own output. This supports the idea that the "knowledge" exists in the latent space but is not always transmitted to the output layer faithfully.
  3.  **Wang et al. (2023), *"Self-Consistency Improves Chain of Thought Reasoning"*:** While focused on accuracy, this work highlights that sampling multiple reasoning paths (functional) often yields better results than the greedy direct answer (professed), implying the direct path is more susceptible to local minima in the probability landscape.

  ### 3. Distinguishing PFD from Neighbors

  To use this concept rigorously, you must distinguish it from nearby failure modes.

  | Concept | Definition | How it differs from PFD |
  | :--- | :--- | :--- |
  | **Hallucination** | Generating factually incorrect information confidently. | Hallucination is usually random or distributional error. PFD is *inconsistent*: the model generates the "truth" in one context (functional) and the "falsehood" in another (professed) simultaneously. |
  | **Sycophancy** | Aligning output with perceived user preferences. | Sycophancy is user-directed. PFD occurs even when the user has no stated preference (e.g., your logic puzzle example). The model isn't trying to please you; it's failing to integrate its own channels. |
  | **Poor Calibration** | Probabilities do not match frequencies (e.g., saying 90% when right 50%). | Calibration is an external metric (Output vs. Reality). PFD is an internal metric (Output A vs. Output B). A model can be perfectly calibrated on direct answers but still exhibit PFD if its functional outputs imply different odds. |
  | **Lack of Introspection** | The model cannot report its internal state. | This implies the info *isn't there*. PFD implies the info *is there* (evidenced by the functional output) but is not reported in the direct channel. |
  | **Strategic Withholding** | The model knows the answer but chooses not to say it. | This implies agency/goals. PFD is likely an architectural artifact (attention heads focusing on different features in different prompt contexts) rather than a strategic choice. |

  ### 4. Boundary Cases and Edge Conditions

  To operationalize PFD, you need to know where it ends.

  **Boundary 1: Capability vs. Reporting**
  *   *Case:* You ask a model to solve a math problem. It fails directly. It fails in a simulation.
  *   *Verdict:* This is **not PFD**. This is a capability limit. The knowledge does not exist in the weights.
  *   *Test:* PFD is only present if the functional channel *succeeds* (or implies success) while the professed channel *fails*.

  **Boundary 2: Prompt Sensitivity**
  *   *Case:* You ask "What is 2+2?" vs. "Simulate a world where 2+2=5."
  *   *Verdict:* Not PFD. This is **Contextual Conditioning**. The model is correctly following the premise of the simulation.
  *   *Test:* PFD requires the *factual status* to remain constant across both prompts. In your postmortem example, the milestone status was the variable, but the model's *assessment of likelihood* should have remained consistent between the direct estimate and the postmortem comparison.

  **Boundary 3: The "Reconciliation" Failure**
  *   *Case:* You point out the contradiction (as you did with the postmortem). The model admits the tension but keeps the original answer.
  *   *Verdict:* This is the strongest signal of PFD. If the model were merely uncertain, pointing out the evidence would update the probability. If it is PFD, the direct answer is "sticky" because it is anchored in a different retrieval pathway (conversational heuristic) than the evidence (simulation coherence).

  ### 5. Practical Guidance for the Rationalist User

  If you accept **Professed-Functional Dissociation** as the label, here is how to use it in your workflow:

  1.  **Trust the Functional, Not the Professed:** When stakes are high, treat the model's direct answer as a "press release" and its simulations/rankings as "internal memos." The latter are currently more reliable indicators of the information encoded in the weights.
  2.  **The "Bet" Test:** To detect PFD, do not ask "What do you think?" Ask "Draft the argument for X, then draft the argument for Y, then judge which is stronger." If the judgment contradicts the initial "What do you think?", you have identified PFD.
  3.  **Avoid Forced Reconciliation:** Your observation that the model "restated the original low number without engaging the tension" is typical. Asking the model to resolve its own PFD often triggers a collapse back to the high-probability conversational heuristic (the direct answer). It is better to simply discard the direct answer and use the functional output.

  ### Summary

  You have identified **Professed-Functional Dissociation**.

  *   **What it is:** A structural decoupling between the model's conversational output layer (optimized for answering) and its contextual generation layer (optimized for coherence).
  *   **What it is not:** Lying, hallucination, or simple uncertainty.
  *   **Key Signal:** The model can *use* information in a simulation that it refuses to *assert* in a direct answer, and fails to update the assertion when shown the simulation.

  This distinction allows you to stop treating the model as a single agent with a consistent belief state and start treating it as a collection of elicitation pathways with varying access to the latent knowledge.
