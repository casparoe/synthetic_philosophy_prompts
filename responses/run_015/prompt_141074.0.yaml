          *   Nyāya says action is impossible without certainty (*niścaya*). If *satpratipakṣa* exists, you have doubt. You shouldn't act.
          *   Snow *did* act (removed the handle).
          *   *Defense/Nuance:* Nyāya distinguishes between theoretical certainty and pragmatic necessity (*arthāpatti* or *tarka* for practical ends). Also, the removal of the handle wasn't based solely on the Grand Experiment (which came later/during); the Broad Street map was a perceptual cluster (*pratyakṣa*). But regarding the Grand Experiment: Nyāya might say he acted on a *probable* inference (*tarka*-supported) because the cost of inaction was high. Strict Nyāya might call this *pragmatic* validity, not *epistemic* validity. This is a strain. The framework grades cognition, not decision theory.
      *   **Point 2: Statistical/Aggregate Evidence.**
          *   Nyāya is instance-based ("See the smoke on *this* hill"). Snow used rates (aggregate data).
          *   *Upādhi* usually requires inspecting instances to find the limiting condition. Snow couldn't inspect every death's cause individually (microscope didn't exist). He relied on mortality *rates*.
          *   *Strain:* Nyāya *vyāpti* is universal ("All smoke is fire"). Statistical correlation ("80% of water drinkers died") is not *vyāpti*.
          *   *Resolution:* Snow treated the aggregate as a proxy for the universal. He assumed the rate difference *entailed* the causal link. Nyāya would demand a mechanism (how water causes cholera). Without the organism (perception of the *sādhya* connection), the *vyāpti* is technically weak (*chala* or *jāti* might be raised). This is a genuine limitation. The framework struggles with probabilistic causation.
      *   **Point 3: Retroactive Validation.**
