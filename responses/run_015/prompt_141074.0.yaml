      *   **Snow's Epistemic Status:**
          *   Did he have *pramā* (valid knowledge)? In the Nyāya sense, *pramā* requires the cognition to be true *and* produced by a valid instrument. If the *vyāpti* wasn't fully established (due to the *upādhi* doubt), strictly speaking, it might remain *saṃśaya* (doubt) or *niscaya* (certainty) based on *tarka*.
