          *   Nyāya would likely say: His *inference* was valid *if* the *vyāpti* held. The *vyāpti* did hold (in reality). But his *grasp* of the *vyāpti* was arguably incomplete (he didn't know *why*).
          *   *Feature vs. Cost:* It's a feature that truth is objective. It's a cost that the framework cannot distinguish between a lucky guess and a valid inference until the *vyāpti* is fully grounded (perhaps by perception of the universal). Since Snow couldn't perceive the universal (germ theory), his status remains ambiguous in Nyāya terms.

