  ok so i run a little bio-philosophy reading group for sophomores who are solid on biology but have never done any philosophy of biology, and i need a which view of funciton do you actually hold decision tree for them

  can you build me one with no more than 6 yes/no branch questions that starts from the boring consensus that hearts are for pumping blood and then sorts people by what they say about cases, not by what label they like. so none of the questions can use jargon like etiological or causal-role or selected effects, they have to be plain questions about concrete cases that a bio undergrad could just answer.

  you have to use these three cases somewhere in the tree because we argued about them last week and they are realy driving the debate:
  a synthetic E. coli our lab club designed from scratch last month that detects arsenic really well and helps clean up soil, but it has zero evolutionary history at all,
  a one-off rabbit born this spring with a random gut mutation that lets it digest a new pesticide, which is super usefull for that one rabbit right now but has not been selected for yet because it is the first to have it,
  human goosebumps plus a vestigial bit like that, something that once did a job but now does basically nothing, versus that same kind of leftover bit if it later gets co-opted for something new.

  the leaves have to be these five: strict history-only view where function is just what it was selected for, current-contribution view where function is just what it does now for the system, organizational closure view where function is about self-maintaining organization, a pluralist view that says both history and current contribution are real functions, and an eliminativist view that says there is no such thing as function really.

  build the tree from the logical space first, then locate those views in it, and tell me if any answer combos are left empty and why you think nobody sits there, like is it incoherent or just unexplored. and flag any pair of leaves your questions cannot realy seperate instead of pretending the tree nails everything.
