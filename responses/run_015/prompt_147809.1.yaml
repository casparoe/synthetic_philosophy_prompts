      *   *Core Argument:* Scripture and nature cannot contradict because both come from God. If they seem to, our interpretation of one or both is wrong.
      *   *Authority:* Scripture is supreme on faith/morals ("how to go to heaven"), not on natural philosophy ("how the heavens go").
