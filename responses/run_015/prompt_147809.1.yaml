      *   *Accommodation:* Scripture speaks in the language of the vulgar (common people) to make spiritual truths accessible. It uses phenomenological language (sun rises/sets).
      *   *Two Books:* Nature is written in mathematics; Scripture is written in language accommodated to salvation.
      *   *Church Authority:* Galileo does *not* argue for total separation. He argues the Church should not bind itself to specific physical interpretations *unless* the science is uncertain. If science is proven, the Church *must* reinterpret Scripture to avoid making God a liar. He wants the Church to be careful, not silent.
      *   *Symmetry of Accommodation:* This is a deep philosophical point. Does Galileo think human science is unaccommodated? Generally, Galileo treats mathematical demonstration as accessing God's mind directly (ontological realism). However, he acknowledges human sensory limits. But does he say science is "accommodated" in the *hermeneutic* sense? Usually, he posits nature as the unmediated word of God, whereas Scripture is mediated by human language. So, asymmetry is the standard Galilean view, but a philosopher of science might probe the limits of human cognition in Galileo's work.
      *   *Friend's Summary:*
