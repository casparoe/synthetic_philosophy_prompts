      *   **Consequences:** Staff treat user better/cooler to non-tippers. Other regulars started tipping. Local friend says user raised prices/expectations and is "buying better treatment." User is leaving soon.
      *   **Comparison:** Another friend queue-jumps because "locals do it." User finds this unattractive but defends their own tipping.
      *   **Core Questions:**
          1.  Is what I did wrong?
          2.  What is the *wrong-making feature* (changing expectations, unilateral, personal benefit, transient status)?
          3.  What should I do now (stop, continue, tip everywhere, redirect)?
          4.  Is this structurally the same as the queue-jumping friend? Who comes out worse?
      *   **Constraint:** Do not just say "customs vary." Locate the disagreement precisely.

  2.  **Deconstruct the Ethical Dimensions:**

      *   **The Tipping Act:**
          *   *Intent:* Generosity, gratitude.
          *   *Effect:* Staff get extra money (good). Staff treat tippers better (inequality). Non-tippers feel pressure/look cheap (social cost). Norm shifts (instability).
          *   *Status:* Expat (temporary resident).
          *   *Power Dynamic:* Wealthier foreigner vs. local economy.

      *   **The Queue-Jumping Act:**
          *   *Intent:* Efficiency, following local norms ("when in Rome").
          *   *Effect:* Undermines order, disadvantages those who wait (often the vulnerable/elderly), creates chaos.
          *   *Status:* Expat.
          *   *Power Dynamic:* Asserting individual gain over collective order.

      *   **The Comparison:**
          *   Tipping adds a benefit (money) but creates a new obligation/expectation.
          *   Queue-jumping subtracts a benefit (order/fairness) to gain individual advantage.
          *   Are they structurally the same? Both involve deviating from home norms to fit in (or not) and both affect the local ecosystem. But one is additive (money), one is subtractive (order).

  3.  **Address the Specific Questions:**

      *   **Is it wrong?** It's ethically ambiguous. It's not "evil," but it is problematic.
      *   **Wrong-making features:**
          *   *Transience:* Leaving before consequences settle.
          *   *Selectivity:* Tipping only where *you* benefit (better service), not universally.
          *   *Market Distortion:* Creating a two-tier system in a place designed to be one-tier.
          *   *Power:* Using wealth to alter social contracts you don't have to live with.
      *   **Recommendation:** Stop or redirect. Tipping everywhere is impractical/impossible. Redirecting avoids the "buying treatment" aspect.
      *   **Comparison to Queue-Jumping:**
          *   Queue-jumping is generally worse because it violates fairness directly. Tipping violates fairness indirectly (by creating a pay-to-play dynamic where none existed).
          *   However, the *logic* used by the user to defend tipping ("I help the staff") is similar to the logic used by the queue-jumper ("I follow local rules").
          *   The key difference: Tipping *can* be altruistic; queue-jumping is inherently self-serving. But the *effect* of selective tipping becomes self-serving.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the complexity. Validate the user's discomfort.
      *   *Section 1: The Ethics of Tipping in a No-Tip Culture.* Focus on the "Market for Lemons" or "Tragedy of the Commons" aspect. The friend is right about the expectation shift. The "wrong-making feature" is primarily the *selectivity* combined with *transience*.
      *   *Section 2: The Transience Factor.* This is crucial. You are importing a norm, altering the equilibrium, and leaving. You don't bear the long-term cost (inflation of expectations, awkwardness for locals).
      *   *Section 3: Comparison with Queue-Jumping.*
          *   Queue-jumping: Violates a *procedural* norm (fairness/order).
          *   Selective Tipping: Violates a *distributive* norm (equality of service).
          *   Verdict: Queue-jumping is usually worse, *but* the user's justification is shaky. The queue-jumper admits they are following local chaos. The tipper is *creating* new chaos. Actually, wait. The queue-jumper says "locals do it." The tipper says "locals *don't* do it, but I will."
          *   Correction: The queue-jumper follows the local *bad* habit. The tipper introduces a foreign *good* habit (in their view) that has negative externalities.
          *   Who is worse? The queue-jumper degrades an existing system (order). The tipper degrades an existing system (equality). The tipper has more agency in the change. The queue-jumper is conforming. Therefore, the tipper is more morally responsible for the change.
      *   *Section 4: Actionable Advice.* Stop the selective tipping. If you want to give money, do it anonymously or to a charity. Don't tie it to service received.

  5.  **Refining the "Wrong-Making Feature":**
      *   It's not just changing expectations. It's changing them *asymmetrically*.
      *   It's not just benefiting. It's benefiting *disproportionately* to the contribution (a small tip buys significant social capital).
      *   It's the "Exit Option." You can leave the new norm behind.

  6.  **Refining the Comparison:**
