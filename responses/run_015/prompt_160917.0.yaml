answer: |-
  This is a sophisticated ethical dilemma because it pits individual generosity against collective stability, and temporary residency against long-term social contracts. Your friend is right to be concerned, but her reasoning can be sharpened. You are also right to feel that your intentions were good, but intentions do not neutralize structural effects.

  Here is a precise location of the disagreement, an analysis of the wrong-making features, and a comparison with your queue-jumping friend.

  ### 1. The Wrong-Making Features of Your Tipping

  You asked specifically what makes the act problematic. It is not the transfer of money itself (the staff are indeed better off in the short term). The ethical friction comes from three specific features of your action: **Asymmetry, Transience, and Norm Entrepreneurship.**

  **Asymmetry (The "Buy Better Treatment" Charge)**
  In a no-tip culture, the social contract is that service is a commodity provided equally to all patrons at the listed price. By tipping selectively at places where you are a "known face," you have converted a public utility (service) into a private good (favoritism).
  *   **The Harm:** You haven't just given money to staff; you have purchased social capital. The staff now view you as a "high-value" customer and others as "standard." This degrades the experience of non-tipping locals, who may now feel judged or receive subtly worse service. Your friend is correct: you have raised the "social price" of dinner. Locals who cannot or will not tip now face a subtle stigma they didn't face before.

  **Transience (The Exit Option)**
  This is the most significant moral weight. You are introducing a new variable into a stable system, but you have an "exit option" that locals do not.
  *   **The Harm:** If the norm shifts permanently toward tipping, locals will face pressure to tip to avoid looking cheap, effectively lowering their real wages or increasing their cost of living. You will not be there to pay that increased cost. You are privatizing the benefit (better service now) and socializing the cost (inflated expectations later) to a community you will soon leave. This is a form of **moral free-riding.**

  **Norm Entrepreneurship (Unilateralism)**
  You have unilaterally decided that the local wage/service equilibrium is insufficiently grateful, despite the fact that the staff are unionized and the law mandates service inclusion.
  *   **The Harm:** You are implicitly signaling that the local system is lacking and needs your foreign correction. While the staff may enjoy the cash, the *system* relies on the premise that the menu price is the full price. You are undermining the dignity of that system by treating the staff as if they *need* your charity to be properly compensated, which contradicts the local understanding of their professional worth.

  **Verdict:** What you did is not "evil," but it is **ethically extractive.** You are extracting better service and social warmth using wealth that locals cannot or should not be expected to deploy, without staying to absorb the inflationary social consequences.

  ### 2. The Comparison: You vs. The Queue-Jumper

  You asked if your situation is structurally the same as your friend who jumps queues. It is not. In fact, structurally, **your friend's position is more defensible than yours, even if the behavior looks ruder.**

  Here is the precise distinction:

  **Your Friend (The Queue-Jumper): Conformity**
  *   **Logic:** "The local norm is fluid ordering; I will adopt the local norm."
  *   **Effect:** He maintains the local equilibrium. Even if the local equilibrium is chaotic, he is not *altering* it. He is submitting to the local social contract, however unattractive it seems to an outsider.
  *   **Moral Status:** He is practicing cultural humility (even if it looks like rudeness). He accepts that his comfort (an orderly queue) is less important than local cohesion.

  **You (The Tipper): Imposition**
  *   **Logic:** "The local norm is no-tipping; I will introduce a foreign norm."
  *   **Effect:** You are disrupting the local equilibrium. You are not adapting to the culture; you are asking the culture to adapt to you (or at least to your habits).
  *   **Moral Status:** You are practicing cultural exceptionalism. You are deciding that your standard of "gratitude" supersedes their standard of "professional wage."

  **Who comes out worse?**
  Paradoxically, **you come out worse.**
  Your friend is behaving rudely by *your* home standards, but ethically he is deferring to the host culture. You are behaving generously by *your* home standards, but ethically you are imposing your culture on the host.
  *   The queue-jumper's harm is immediate and visible (someone waits longer), but it is consistent with the rules of the game being played there.
  *   The tipper's harm is systemic and hidden (erosion of equality), and it changes the rules of the game for everyone else.

  Your friend's behavior is **locally consistent**; yours is **locally disruptive.**

  ### 3. What Should You Do?

  You have three options, ranked from most to least ethically sound:

  **Option A: Stop the Selective Tipping (Recommended)**
  Return to the local norm. The discomfort you feel about "withdrawing" generosity is a sunk cost fallacy. The staff received a bonus for a year; they are not *owed* that bonus now.
  *   *Why:* This stops the inflation of expectations. It restores the equality of service. It acknowledges that you are a guest, not a market-maker.
  *   *Mitigation:* If you want to express gratitude, do it verbally or with small gifts (chocolate, etc.) that do not establish a cash precedent.

  **Option B: Tip Universally (Impractical)**
  Tip 15% at *every* establishment you enter, regardless of service quality or familiarity.
  *   *Why:* This removes the "buying favor" aspect.
  *   *Problem:* This still drives the norm shift. You are still importing a foreign economic expectation that locals may not be able to sustain. It is better than Option C, but still problematic regarding transience.

  **Option C: Redirect the Money (Best Alternative)**
  Take the money you intended to tip and donate it to a local charity, union, or staff fund *anonymously*, detached from your personal service.
  *   *Why:* This allows you to be generous without purchasing preferential treatment. It benefits the community without altering the service contract. It decouples your wealth from your dinner.

  ### Summary

  Your friend's criticism holds up under scrutiny. The wrong-making feature is not the generosity, but the **combination of selectivity and transience.** You are using temporary wealth to purchase permanent social changes that you will not have to live with.

  Your queue-jumping friend is actually behaving more ethically than you, because he is submitting to local norms while you are overwriting them. To resolve the dissonance, you should cease the cash tips at your regular spots. If you wish to give, give in a way that does not return a benefit to you personally.
