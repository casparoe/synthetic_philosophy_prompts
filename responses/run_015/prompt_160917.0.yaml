      *   Make sure to answer the "What should I do" part clearly.

  8.  **Self-Correction/Nuance Check:**
      *   *Is tipping always bad there?* If the wages are decent, tipping isn't needed for survival. It becomes a luxury signal.
      *   *Is the queue-jumper definitely worse?* If the "queue-jumping" is actually just a different cultural understanding of personal space (e.g., Mediterranean scrum vs. British queue), then the friend is right to adapt. But if it's genuine cutting, it's rude. I should treat the prompt's description ("nobody waits their turn properly") as the ground truth for the scenario.
      *   *Did the user actually raise prices?* Not menu prices, but the "social price" of dining.
      *   *Key Insight:* The user is engaging in "Norm Entrepreneurship" without bearing the risk.

  9.  **Final Structure:**
      *   Introduction: Validate the tension.
      *   Part 1: The Wrong-Making Features (Transience, Selectivity, Asymmetry).
      *   Part 2: The Queue-Jumping Comparison (Conformity vs. Imposition).
      *   Part 3: Resolution/Advice.

