answer: |-
  1. The technician slid the fader up. Elena expected clarity, but the room dissolved into vibrating lines and sharp angles that meant nothing. She watched her own hand fragment into geometric shards before coalescing into skin. It felt like watching someone else's feed, cold and computational. "Is this what you see before I see it?" she asked. The technician nodded, noting the delay on the monitor. Four hundred milliseconds separated the raw signal from the picture she held in her head. She tried to grab the shards, but they slipped through her mental fingers. This wasn't vision; it was construction. She felt excluded from her own eyes, a stranger watching the scaffolding before the building stood.

  2. During a routine test, she nudged the timeline near the end. A red cup shifted to blue just before the image locked. Instead of simply seeing a blue cup, she felt a violent jerk, like a film splice burning through the projector. "That wasn't me," she said, rubbing her temple. The technician checked the logs. "You edited inside the closure zone. Anything before one hundred milliseconds gets baked in. After that, it feels like an invasion." She tried again, softer this time, earlier in the stream. The cup turned blue smoothly. No jerk. Just a blue cup. The boundary was sharp, a threshold between becoming and being.

  3. She brought up the photograph of her father, the one taken before the stroke. His face was slack, painful to behold. She found the early grouping stage and adjusted the muscle tension, smoothing the droop. The image settled. When asked what she saw, she said, "He looks peaceful. That's how I remember him." There was no hesitation, no sense of forgery. The edit had arrived early enough to become the source. She believed her own eyes. The pain was gone, not hidden, but erased from the foundation. She had rewritten the past by tweaking the present machinery, and the truth bent to accommodate the change.

  4. "If your report matches the output, what else is there?" the collaborator asked, tapping the data stream. "You say it looked peaceful. The system produced peace. There is no hidden viewer comparing the two." Elena shook her head. "But I know I moved the slider. I know the peace was manufactured." "Knowing is just another output," he countered. "If the system says you authored it, then you did. There is no gap between the display and the seeing. The finish line is the only reality that matters." She looked at her hands. "Then why does it feel like theft?" He had no data for that.

  5. They offered to widen the window, let her edit closer to the end without the jerk. She could make everything smooth, perfect. She declined. She wanted the jerk. She wanted to feel the resistance of the raw signal against her will. Accuracy wasn't the point; neither was comfort. She needed to know where her hand ended and the machine began. She looked at the blank wall and let the raw lines vibrate for a moment before they settled into paint. It was messy and unpolished. It was hers. The friction proved she was still inside the loop, not just watching the show.
