  **The Scenario**

  A collapsed tunnel traps a single worker in a stable dry alcove and five workers in a flooded, structurally compromised chamber; the rescue team has enough hydraulic power for only one shoring operation before the system fails. Engineering assessments indicate shoring the alcove offers a 90% chance of retrieving the single worker alive, while shoring the flooded chamber carries such high risk of secondary collapse that even a successful operation yields only a 10% chance of retrieving any of the five. The team leader must commit all power to one location immediately, with no possibility of switching targets.

  ***

  **The Arithmetic and Reasoning**

  *   **The Numbers View (Maximize Expected Lives):**
      *   *Calculation:* Option A (One) = 1 life × 0.9 probability = **0.9 expected lives**. Option B (Five) = 5 lives × 0.1 probability = **0.5 expected lives**.
      *   *Verdict:* Save the One. The expected utility of saving the many is mathematically lower than saving the few. The many get a **0%** chance of rescue.
  *   **The Taurek-Style View (Equal Claim per Group):**
      *   *Reasoning:* The five individuals do not aggregate into a stronger moral claim than the single individual; each side has an equal right to be considered. Probability of success is a physical constraint, but the *choice* of who to attempt to save must respect equal claims.
      *   *Verdict:* Flip a coin between the two locations. The many get a **50%** chance of rescue (contingent on the coin landing their way).

  **The Key Feature**
  **Asymmetric Probability of Success.** The reversal relies entirely on the many being significantly harder to save than the one. The numbers view prioritizes *expected* survivors (Probability × Heads), while the Taurek view prioritizes *equal opportunity for attempts* (50/50 between parties).

  **If You Remove the Feature**
  If you equalize the probabilities (e.g., both groups have a 90% chance of survival):
  *   **Numbers View:** Save the Many (4.5 expected lives vs. 0.9).
  *   **Taurek View:** Flip a coin (50% chance for the Many).
  *   *Result:* The standard dialectic returns (Numbers favors the many; Taurek favors equal chances).

  **The Numbers Theorist's Objection**
  "You haven't overturned utilitarianism; you've just buried the numbers inside the probabilities. Expected utility *always* accounts for likelihood of success. By making the five so hard to save that their expected value drops below the one, you've rigged the case so the 'many' are effectively already dead. Rational agency requires maximizing actual survivors, not fairness of attempt."
