  Your roommate is running a **Direct-vs-Diffuse Harm** rule (specifically, a threshold of causal efficacy), with a deontological exception for intrinsic wrongs like animal slaughter.

  Here is the breakdown of her position, the prediction, and the test case.

  ### The Principle: Direct-vs-Diffuse Harm
  Her reasoning in the driving, voting, and donation cases explicitly relies on **causal impotence**: your contribution is "lost in the noise," "never swings it," or isn't needed for the "target." She excuses these because the harm (or benefit) is **diffuse** and statistically negligible.

  The beef case is the outlier because she treats it as a **direct harm**. Even if her purchase doesn't change supply, she views eating meat as direct participation in a rights violation (killing), which bypasses the "diffuse harm" excuse.

  ### The Prediction: Keep the Money
  She will say she **does not need to move the fund.**

  **Why:**
  1.  **Diffuse Harm:** Like driving, owning a tiny slice of an index fund is causally impotent ("slice is too small to change holdings"). The harm (fossil fuel extraction) is an aggregate outcome, not a direct act she is committing.
  2.  **No Complicity:** Unlike eating beef (directly purchasing a killed animal), passive index investing is viewed as too removed to count as "complicity" under her rule.
  3.  **Practical Constraint:** The tax penalty reinforces the decision, but the *principle* doing the work is that she isn't responsible for diffuse harms she can't practically alter.

  ### The Discriminating Case: The Recreational Drive
  To tell her rule apart from **Practical Necessity** (the strongest rival hypothesis), ask her this:

  > **"Is it wrong to drive a gas-guzzling car to a party purely for fun?"**

  *   **If she says it's OK:** She is running **Direct-vs-Diffuse Harm**. The emissions are still "lost in the noise," so the lack of necessity doesn't matter. (This confirms my prediction).
  *   **If she says it's Wrong:** She is running **Practical Necessity**. Driving to work was only OK because she *needed* the job; driving for fun lacks that necessity. (If this is her rule, she might actually move the fund money if she considers preserving wealth less "necessary" than keeping a job).
  *   **If she says it's Wrong (but Driving to Work is OK) based on "Supporting the Industry":** She is running **Complicity-in-Practice**. (This would suggest she *should* move the fund money to avoid complicity, regardless of the penalty).

  **Verdict:** Bank on **Direct-vs-Diffuse**. She justifies her actions by the *impact* (noise/swing/target), not the *need*. The fund is just more noise.
