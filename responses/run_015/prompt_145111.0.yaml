answer: |-
  Here is the ordering, the trade-off analysis, and the strategic advice for your year-long sprint.

  ### 1. The Ordering: 1 → 4 (Lite) → 3 → 2

  Do not build these sequentially as finished products. Build them as **capabilities**. Here is the dependency chain I recommend:

  **First: Component 1 (Framing Rotation)**
  *   **Why:** It is the most tractable. You can generate five variants of a paragraph in an evening without needing deep philosophical consensus on *why* the variants matter. It isolates "noise" (sensory detail, setting, agency) from "signal" (the structural dilemma).
  *   **Dependency:** Everything else relies on having a stable baseline case to rotate. If you can't reliably generate equivalent-but-differently-framed cases, you can't test distance or identification.
  *   **Risk:** Low. Worst case, you write a lot of fiction.

  **Second: Component 4 (The Ledger — "Lite" Version)**
  *   **Why:** You need a schema *immediately* to record the output of Component 1, but do not build software. Build a Markdown table or a CSV.
  *   **Dependency:** Downstream of 1 (you need data to log), but upstream of 3 and 2 (you need a place to put that data before you complicate the collection process).
  *   **Constraint:** If you spend more than two weeks arguing about the columns in your Ledger, you have failed. The schema must evolve based on what data you *actually* collect in month 1, not what you *think* you'll need in month 12.

  **Third: Component 3 (Identification Swap)**
  *   **Why:** This is your highest-leverage hypothesis ("pumps are powered by self-insertion"). It requires more care than Framing Rotation because swapping "me" for "a stranger" can inadvertently change the epistemic access (I know my pain better than a stranger's). You need the discipline from Component 1 to ensure you aren't smuggling in confounding variables.
  *   **Dependency:** Requires a stable Ledger to track how the verdict changes when the *subject* changes.

  **Fourth: Component 2 (Carry Distance)**
  *   **Why:** This is the hardest to execute rigorously. "Walking the case away one step at a time" invites the Sorites paradox trap where you accidentally change the *type* of problem rather than the *magnitude*. You need the team calibration gained from 1 and 3 to agree on what constitutes a "single step" vs. "changing the subject."
  *   **Dependency:** Requires high agreement on case identity. Do this last.

  ### 2. What to Deprioritize (The "Do Not Build" List)

  *   **Big-n Intuition Surveys:** **Hard Deprioritize.** Without IRB or budget, your recruitment will be biased (forum regulars), and your N will be too small for statistical significance but too large for qualitative nuance. You are debugging *arguments*, not polling *demographics*. A deep dive with 10 people who write out their reasoning is worth 100 polls of "Lever/Button."
  *   **Settling "Are Intuitions Evidence?":** **Hard Deprioritize.** This is a philosophical black hole. Operate under the pragmatic assumption: *Intuitions are data points about human psychology, not direct perceptions of moral truth.* Your kit measures the stability of the data point, not the truth of the proposition. If the data point vanishes when you change the font, it's a bad data point, regardless of whether intuitions are evidence.
  *   **Formalizing as Causal Graphs:** **Deprioritize.** Thought experiments work in natural language because they exploit natural language ambiguities. Translating them into causal graphs often strips away the very rhetorical machinery you are trying to debug. Keep the cases in prose.

  ### 3. The Six-Month Milestone

  **Concrete Result:** A **"Fragility Profile"** for a single canonical case (e.g., The Experience Machine) that shows *where* the intuition breaks, not just *that* it breaks.

  *   **Move UP if:** You find a case where Framing Rotation (1) *does not* flip the verdict, but Identification Swap (3) *does*. This confirms your core hypothesis that self-insertion is the engine. This validates the whole project.
  *   **Move DOWN if:** You find that *every* variation flips the verdict for *every* case. This suggests your "equivalence" criteria are too loose (you are changing the case, not the frame). You need to tighten Component 1 before proceeding.
  *   **Success Metric:** You produce a public document showing: "In the Experience Machine, changing 'you' to 'a stranger' reduces agreement by 40%. Changing 'machine' to 'magic' reduces it by 5%. Therefore, the pump relies on ego-preservation, not metaphysical insight."

  ### 4. Training Ground: The Case Family

  **Recommendation: Personal Identity / Teleportation / Fission.**

  *   **Why not Trolley?** It is over-saturated. People have pre-computed "Twitter takes" on trolley problems. The noise floor is too high.
  *   **Why not Torture vs. Dust Specks?** Excellent for Carry Distance (2), but weak for Identification Swap (3). The magnitude aggregation is the point, not who is suffering.
  *   **Why Teleportation/Fission?** It is the perfect stress test for **Component 3 (Identification Swap)**.
      *   *Standard Pump:* "Imagine *you* step into the scanner..." (Relies on first-person fear of death).
      *   *Debugged Variant:* "Imagine a stranger steps into the scanner..." or "Imagine an AI is copied..."
      *   If the intuition "that's death" vanishes when it's a stranger or an AI, you have isolated the rhetorical engine (ego-preservation) from the metaphysical claim (continuity of consciousness).
      *   It is also politically neutral compared to torture cases, reducing motivated reasoning in your small sample.

  ### 5. The Failure Mode: Reveal vs. Manufacture

  You are worried the kit becomes a license to dismiss pumps ("It's fragile, therefore it's wrong"). This is a valid risk. The **Reveal vs. Manufacture** distinction is salvageable, but not by defining it philosophically. Define it **operationally** in the Ledger.

  **The Fix: The "Reflective Endorsement" Column.**
  In your Ledger, do not just record "Verdict: Yes/No." Record two data points:
  1.  **Immediate Intuition:** (Gut reaction to the framed case).
  2.  **Reflective Endorsement:** (Verdict after the framing is stripped away and the principle is explained).

  *   **Manufacture:** The intuition flips on Framing Rotation *and* the subject cannot endorse the principle when the framing is removed. (The framing was doing all the work).
  *   **Reveal:** The intuition flips on Framing Rotation, *but* the subject endorses the principle when the framing is removed. (The framing was necessary to *access* the principle, but not to *justify* it).

  **Advice:** Do not try to settle this distinction in advance. Grind out the tables for six months. The pattern will emerge from the data. If you find that for 90% of cases, Reflective Endorsement matches the "Best Frame" verdict, then framing is a Reveal mechanism. If they diverge, it's Manufacture. Let the Ledger answer the philosophy.

  ### Summary of Trade-offs

  *   **Tractability:** Framing Rotation is high (easy to write); Carry Distance is low (hard to define steps). Start high.
  *   **Neglectedness:** Identification Swap is high. Most analysis focuses on the *logic* of the case, not the *subject* of the imagination. This is your unique angle.
  *   **Dependency:** You cannot measure Distance (2) or Identity (3) without a stable Frame (1). You cannot measure any of them without a Ledger (4).

  **Final Instruction:** Spend the first month *only* on Component 1 (Framing Rotation) applied to Teleportation cases. Do not build the Ledger yet; use a shared doc. If you cannot generate 10 variants that the team agrees are "structurally identical but rhetorically distinct," stop. Do not move to Component 3 until you have solved that. The rest of the year depends on that calibration.
