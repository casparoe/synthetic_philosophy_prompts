  **The Scenario**

  The National Health Allocation Board must distribute a fixed annual budget between two programs that will run for ten years. **Policy A** funds immediate fertility subsidies for 1,000 current applicants, resulting in 1,000 children born now, while maintaining standard staffing levels for the 100 Board administrators who process the claims. **Policy B** delays the subsidies by six months to implement a stricter genetic screening protocol; this changes which specific conceptions occur (producing 1,000 *different* children) but ensures those children are slightly healthier, while requiring the 100 administrators to work sustained overtime under high stress to manage the transition. The total population size is identical in both outcomes (1,100 people), the budget cost is identical, and every life involved is firmly above the neutral point of worth living.

  **Welfare Levels and Arithmetic**

  We measure well-being in **Quality-Adjusted Life Points (QALPs)** on a scale where 0 is neutral and 100 is peak human flourishing.

  *   **Policy A:**
      *   **Administrators (Common Group):** 100 people $\times$ 80 QALPs (Normal workload) = 8,000.
      *   **Children (Group A):** 1,000 people $\times$ 80 QALPs (Healthy) = 80,000.
      *   **Total Welfare:** 88,000.
      *   **Average Welfare:** 80.0.

  *   **Policy B:**
      *   **Administrators (Common Group):** 100 people $\times$ 70 QALPs (High stress) = 7,000.
      *   **Children (Group B):** 1,000 people $\times$ 82 QALPs (Very Healthy) = 82,000.
      *   **Total Welfare:** 89,000.
      *   **Average Welfare:** 80.9.

  **The Verdicts**

  1.  **Total Utilitarianism:** Compares sums. $89,000 > 88,000$. **Prefers B.**
  2.  **Average Utilitarianism:** Compares averages. $80.9 > 80.0$. **Prefers B.**
  3.  **Person-Affecting Restriction (PAR) + Asymmetry:** Compares only individuals who exist in both outcomes. The Administrators exist in both and are worse off in B (70 vs 80). The Children in A do not exist in B; the Children in B do not exist in A. Under the Asymmetry, the high welfare of the Children in B provides no moral reason to choose B, because they would not exist otherwise. The loss to the Administrators provides a moral reason to reject B. **Prefers A.**

  ***

  **Analysis**

  **1. The Feature Doing the Work**
  The single feature driving the divergence is the **Non-Identity of the Beneficiaries**. The policy choice determines *which* children come into existence, while the *same* administrators exist in both futures. If you stipulate that the very same individuals exist under both policies (i.e., the children are identical), the PAR verdict flips. In that "Same People" case, Policy B makes the children better off (82 vs 80) and the administrators worse off (70 vs 80). Since PAR allows trade-offs among existing people, the net gain to the 1,000 children outweighs the loss to the 100 administrators, and PAR would join Total/Average Utilitarianism in preferring B. The conflict only arises because PAR excludes the children's gains from the calculus entirely.

  **2. The Person-Affecting Defender's Attack**
  A defender of the Person-Affecting View will likely attack the **identity fixity**. She may argue that treating conception timing as a hard switch for personal identity is metaphysically fragile in a policy context; if the "same" couples conceive, the moral claim of the *potential* child might carry weight regardless of genetic specificity. However, if she accepts the Non-Identity premise, she will reach for the **Asymmetry** rather than the Same Number Quality Claim. She will argue that while it is bad to make existing people worse off (the administrators), it is not *good* to create new happy people (the screened children) to compensate for that loss. She does not need to deny the policy fixes who comes to exist; she denies that the welfare of those new people enters the "better than" relation against the interests of the fixed population.

  **3. The Fixed-Number Constraint and Question-Begging**
  Your suspicion is correct: fixing the population size **automatically aligns Total and Average Utilitarianism**. Mathematically, if $N_A = N_B$, then $\sum W_A > \sum W_B \iff \frac{\sum W_A}{N} > \frac{\sum W_B}{N}$. Specifying both verdicts is redundant, though not logically question-begging against PAR. However, it is empirically fragile. A small, realistic relaxation—such as Policy B preventing 10 infant mortalities while delaying 10 births (net $N$ constant) or Policy B causing a 1% population increase due to higher survival rates—would allow Total and Average to diverge. If Policy B increased $N$ to 1,110 with the same welfare levels, Average Utilitarianism might drop below Policy A ($89,000/1,110 \approx 80.1$, still higher, but the margin shrinks), while Total Utilitarianism would strengthen its preference for B. To truly separate them, Policy B would need to add many people with lower average welfare (the classic Repugnant Conclusion setup), which violates your "no misery" constraint.

  **4. Critical-Level Utilitarianism (CLU) Check**
  The health economist is **half-right but mathematically mistaken regarding the constraint**. Critical-Level Utilitarianism calculates value as $\sum (Welfare - c)$, where $c$ is a positive critical level (e.g., 50).
  *   **Applied to Everyone:** Since $N$ is fixed (1,100), the term $N \times c$ is subtracted from both totals. The *difference* between A and B remains identical to Total Utilitarianism ($+1,000$). CLU prefers B.
  *   **Applied Only to Those at Stake:** If $c$ is applied only to the children (whose existence is at stake) and not the administrators (who exist either way), the math is:
      *   A: $100(80) + 1,000(80 - 50) = 8,000 + 30,000 = 38,000$.
      *   B: $100(70) + 1,000(82 - 50) = 7,000 + 32,000 = 39,000$.
      *   CLU still prefers B.
  The economist is right that CLU supports B, but wrong that it "rescues" the verdict in a way that distinguishes it from Total Utilitarianism in this specific fixed-number case. It does not bridge the gap to PAR; it simply reinforces the Totalist intuition.

  **Conflicting Specifications**
  The pair **(i) Exactly the same number** and **(iii) Realistic institution** are in tension. In reality, no public health policy guarantees an *exact* headcount match down to the individual over a decade; mortality and fertility rates fluctuate naturally. To satisfy the rest of your constraints without straining credulity, you should relax (i) to **"statistically identical population size."** If the numbers differ by even one person, the Total/Average coincidence breaks, but the PAR verdict remains stable (as long as the extra person is a "gainer" who wouldn't otherwise exist). The ratio of gain to loss in the scenario above (1,000 children gaining 2 points vs. 100 adults losing 10 points) is credible for a magazine reader; it reflects a standard bureaucratic trade-off between worker comfort and public health outcomes.
