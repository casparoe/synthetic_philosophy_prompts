      2.  **Fatal:** Coordination vs. Bargaining. If the game is zero-sum, the Lewisian "conditional preference" vanishes. The shell becomes pure oppression, not stabilization.
      3.  **Awkward/Manageable:** Hard Cases (Animals/Dead). Can be explained via indirect reciprocity, but requires stretching.
