      *   **The View ("Shell Thesis"):** Durable moral norms = Lewisian conventions (coordination/assurance/chicken games) + a "moral shell" (outrage, categoricity) acting as a commitment device to stabilize the equilibrium against temporary defection incentives.
      *   **Specific Claims to Defend:**
          1.  Origins: Recurrent game equilibria (no explicit agreement).
          2.  Asymmetric Decay: Coordination dies first, rhetoric lags ("zombie norms"); new problems start as etiquette, moralize later.
          3.  Fragility Gradient: Moralization strongest where equilibrium is fragile/hard to police.
          4.  Rarity: Norms without equilibrium backing are rare/unstable (mostly small groups).
      *   **Task:** Identify defeaters, rank them (fatal vs. awkward), assess specific challenges (Cases, Rival [Identity Signaling], Free Parameters/Retrospective Fitting, Structural Worry [Coordination vs. Bargaining], Lewis's Arbitrariness, Predictive Power).
      *   **Constraint:** No looking things up (prose only on references). Be blunt about falsifiability and insulation.

  2.  **Deconstruct the "Shell Thesis":**
      *   *Core Mechanism:* Game Theory (Lewis) + Commitment Device (Moral Phenomenology).
      *   *Strength:* Explains stability, third-party punishment, and the "feel" of morality without invoking realism.
      *   *Weakness:* Risk of being a "just-so story" generator (retro-fitting games), difficulty handling pure conflict/bargaining, difficulty handling norms with no obvious coordination benefit.

  3.  **Address the Specific Defeaters:**

      *   **1. Hard Cases (The "Why" matters):**
          *   *Cruelty to Animals:* Hard because the "game" usually involves humans. Animals can't reciprocate or punish. *Defense:* Indirect reciprocity (signaling kindness to humans) or preventing desensitization (slippery slope to human cruelty). *Verdict:* Plausible but requires stretching the "players."
          *   *Abolition:* Hard because slavery was a stable equilibrium for the oppressors. *Defense:* It wasn't a coordination game for the *whole* society; it was a bargaining game shifted by external shock (war/economics). *Verdict:* Threatens the "coordination" core.
          *   *Duties to Dead/Promises to Dead:* Hard because the beneficiary can't punish. *Defense:* Reputation with the living (will execution, trustworthiness). *Verdict:* Manageable.
          *   *Incest/Food Taboos:* Incest has biological backing (inbreeding), but the *moral* outrage exceeds the biological risk. Food taboos (pork) often lack hygiene justification. *Defense:* Group boundary marking (see Identity Rival). *Verdict:* Strong challenge to the "coordination" aspect.
          *   *Hospitality:* *Defense:* Iterated travel game. *Verdict:* Easy fit.
          *   *Crucial Test:* Can we identify the game *independently*? Usually no. We infer the game from the norm. This leads to the Free Parameter problem.

      *   **2. The Rival (Identity/Coalition Signaling):**
          *   *Thesis:* Norms mark "us vs. them."
          *   *Differentiation:* Coordination requires *everyone* to benefit from conformity (Pareto improvement usually). Signaling often involves *costly* displays that benefit the group by excluding outsiders or ranking insiders.
          *   *Observation:* If a norm persists *despite* net negative utility for the group but high value for distinctiveness, it's signaling. If it persists because it solves a traffic jam problem, it's coordination.
          *   *Verdict:* This is a *Fatal* rival if the Shell Thesis can't distinguish coordination benefits from signaling costs. Many "moral" norms look more like costly signaling (diet, dress) than coordination (driving side). If the Shell Thesis absorbs signaling as just "another game," it risks vacuity.

      *   **3. Free Parameters (Retro-fitting):**
          *   *Problem:* Any stable behavior can be modeled as an equilibrium if you tweak payoffs enough.
          *   *Falsifiability:* Currently low. To fix: Pre-specify the game structure based on material conditions *before* analyzing the norm.
          *   *Verdict:* This is the *Fatal* flaw if unaddressed. A theory that explains everything explains nothing. It needs discipline (e.g., demographic/ecological constraints).
          *   *Status:* Mid-level social theory *should* be more constrained than this.

      *   **4. Structural Worry (Coordination vs. Bargaining/Conflict):**
          *   *Lewis:* Coordination (common interest).
          *   *Morality:* Often involves sacrifice (conflict/bargaining).
          *   *Problem:* If I lose out by conforming (e.g., property rights favoring the rich), I don't have a "conditional preference to conform." I conform because of the *Shell* (punishment).
          *   *Verdict:* This is *Fatal* to the Lewisian label. If the shell does all the work in conflict games, the "convention" part is doing nothing. It becomes "Power + Ideology." The Shell Thesis collapses into Critical Theory/Marxism if it can't show the underlying coordination benefit for the *losers* too (e.g., order vs. chaos).
          *   *Assessment:* A huge chunk of morality is bargaining (distribution), not just coordination (production/safety). The thesis needs to admit this or shrink its scope.

      *   **5. Lewis Himself (Arbitrariness):**
          *   *Lewis:* Conventions are arbitrary (could have been the other way, e.g., driving left vs. right). Morals aren't arbitrary (truth-telling vs. lying).
          *   *User's Move:* Deny arbitrariness is essential, or claim morals *are* arbitrary equilibria (truth-telling *is* a convention).
          *   *Verdict:* You are changing the subject from Lewis. That's fine, but don't call it "Lewisian" without qualification. The damage is to the label, not the theory, provided you justify why non-arbitrary equilibria count.
          *   *Nuance:* Many morals *are* arbitrary (which side of the road, forms of address, specific dietary rules). The deep ones (harm) are less so.

      *   **6. Predictions (What's unique?):**
          *   *Lag/Decay:* Good prediction.
          *   *Instant Moralization:* Tech norms (AI, bioethics) often moralize instantly. *Counter:* They piggyback on old norms (harm/privacy).
          *   *Norm Death:* Norms dying while problem is live (e.g., mask wearing). *Counter:* Polarization turned it into a signaling game, destroying the coordination game.
          *   *Unique Prediction:* **The Fragility Gradient.** Signaling theories predict *more* moralization where identity is threatened. Shell Thesis predicts *more* moralization where defection is tempting/policing is hard. These can come apart.

  4.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, analytical, slightly gritty. No fluff.
      *   *Structure:* Follow the user's requested sections.
      *   *Ranking:* Need to clearly distinguish "Fatal" (breaks the theory) vs. "Awkward" (needs patching).
      *   *Constraint Check:* No bibliography. American English.

      *(Self-Correction during drafting)*: I need to be careful not to just agree with the user. They asked for the "honest version of how exposed it is." I need to push back on the "Free Parameters" issue specifically, as that's the weakest link. I also need to be clear on the Coordination vs. Bargaining distinction, as that threatens the "Lewisian" core.

      *Refining the "Identity Rival":* If norms are just identity markers, the "coordination game" is irrelevant. The Shell Thesis says the coordination game is the *foundation*. If the foundation is missing but the shell remains, the thesis fails. I need to emphasize that distinguishing these is empirically hard but theoretically crucial.

      *Refining "Lewis":* Lewis explicitly excluded morality because he thought it lacked arbitrariness. The user is co-opting the *mechanism* (convention) but dropping the *criterion* (arbitrariness). I should point out this is a feature, not a bug, but requires owning the deviation.

      *Refining "Predictions":* The "Fragility Gradient" is the strongest bet. If we find norms that are highly moralized but easy to police/low temptation to defect, the thesis takes a hit.

  5.  **Final Polish:** Check against "no pep talk." Ensure the distinction between fatal and awkward is explicit. Ensure the "Free Parameter" critique lands hard.

      *(Final check on constraints)*: "American English please." "No bibliography." "Prose only." "Rank defeaters."

      *Let's structure the ranking first:*
