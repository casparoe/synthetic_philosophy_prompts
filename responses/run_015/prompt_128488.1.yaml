answer: |-
  **Marisol:** You're making it sound like magic, Theo. Hobbes isn't saying we conjure circles out of thin air. He's saying we agree on what the word "circle" means. Once the definition is fixed, the consequences follow necessarily. That's all geometry is: consequence-in-speech.

  **Theo:** But that makes it trivial. If it's just about how we decide to use words, then any set of stipulations gives you a necessary science. I could define a "florg" however I like and deduce truths about florgs. But Hobbes doesn't think geometry is just any science. He thinks it's the *only* real science we have. You're ignoring the construction. We don't just name the circle; we generate it. We move a point. We swing a line. That production is the cause of the object, and knowing the cause is what gives us certainty.

  **Marisol:** Okay, let me make sure I have you. You're saying the necessity comes from the act of making the figure in our heads. The construction isn't just a picture; it's the ground of the truth.

  **Theo:** Exactly. Without the generation, you've just got empty names.

  **Marisol:** And you hear me saying that the construction is psychological window dressing. The real work is done by the definitions themselves, which are just stipulations about how we'll use terms. Truth is a property of propositions, not things.

  **Theo:** I hear you. But here's the cost you're paying. Hobbes insists geometry is about bodies. Lines are motions of bodies. If you're right, and it's just verbal stipulations, why does he keep tying it to bodies? And why does he think physics could someday look like geometry? If necessity is just about fixing definitions, I could stipulate a necessary science of gravity right now. Define "gravity" however I want, deduce away. But Hobbes says physics is still conjectural. Why?

  **Marisol:** I'll bite the bullet. The privilege of geometry isn't that the objects are special; it's that *we* get to fix the definitions. In geometry, we prescribe the causes. In physics, nature prescribes them. We have to discover the motions behind heat or light, and we might get them wrong. In geometry, we can't get the definition wrong because we invented it. The certainty comes from our authority over the terms, not the world.

  **Theo:** But that undermines the certainty! If it's just about our authority, then it's contingent on us. Which brings me to the grounding problem. You say we construct these figures in the imagination. But for Hobbes, imagination is just decaying sense. It's motions in us caused by external bodies. So now geometrical necessity rests on contingent facts about human physiology. What if our brains were wired differently? Would two plus two equal five? You've made geometry a branch of physics at the exact moment Hobbes wants physics to model itself on geometry. Let's call it what it is: the bootstrapping problem.

  **Theo:** I know the risk. But look, the admissible definitions aren't arbitrary. You can't define a square circle. Why? Because you can't produce it. Nature constrains which definitions are possible. A definition that doesn't state a possible production is defective. So it's not just "let's use words this way." It's "let's use words that track possible motions."

  **Marisol:** But then the necessity has an empirical hinge! You're admitting that whether a definition is valid depends on whether we can actually perform the motion. That's an empirical fact about us and the world. Hobbes denies this when he contrasts geometry with conjectural natural philosophy. He says geometry is certain *because* it doesn't depend on experience. If your reading is right, it depends entirely on experience—specifically, the experience of what we can imagine.

  **Theo:** It depends on the possibility of motion, not particular observations. But look, let's get concrete. Hobbes's squaring of the circle. He was wrong. Everyone knew it. He never conceded. On your verbal reading, that's just a bad inference. He messed up the logic from the stipulations. No big deal.

  **Marisol:** Right. People make errors in deduction. The refutations against him were ordinary demonstrations from definitions. That suggests the definitions-only picture is what's working in practice. His critics didn't say "your construction is physically impossible." They said "your conclusion doesn't follow."

  **Theo:** No, on my reading, his stubbornness is diagnostic. He behaved as if having a construction was evidence of correctness. He trusted the generative act over the deductive refutation. That only makes sense if construction is the source of certainty. He couldn't take the refutations on board because he thought he'd already generated the object. If you haven't actually produced the cause, you haven't done the science. His failure was epistemic, not just logical.

  **Marisol:** Or he was just bad at math and proud. You're turning a personality flaw into a philosophical feature. If the verbal reading is right, his error is mundane. He thought he deduced correctly when he didn't. That fits the nominalism perfectly. Truth is in speech; he spoke falsely.

  **Theo:** But why did he think he spoke truly? Because he held the construction in his head. You're ignoring the phenomenology of his certainty.

  **Marisol:** I'm ignoring the psychology to save the logic. Look, here's where we actually differ. We need a text where Hobbes explicitly prioritizes one over the other when they conflict. Does he ever say "even if the deduction holds, without the construction it's not science"? Or "even if the construction fails, if the deduction holds, it's true"?

  **Theo:** That would settle it. If he says the construction is necessary even when the logic works, I win. If he says the logic saves the science even when the construction is murky, you win.

  **Marisol:** Exactly. But he never quite separates them. He thinks the definition *is* the construction stated in words.

  **Theo:** Which suggests they're inseparable. But if I had to bet, the stubbornness on the circle tells us where his heart was. He trusted the making.

  **Marisol:** And I trust the text that says truth is a property of speech, not things. Until we find that passage where he chooses, we're just projecting.

  **Theo:** Fair. But I'm still squaring my circle before lunch.

  **Marisol:** Just don't ask me to certify it.
