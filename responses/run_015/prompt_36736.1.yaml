      *   *Camp 2 (Conventional Implicature/Presupposition):* Yes, this exists. (e.g., Potts, Williamson). The contempt is secondary content, projective.
      *   *Camp 3 (Pragmatics/Use):* Yes, this exists. (e.g., Anderson & Lepore, Bianchi). The word is neutral; the offense comes from usage/history.
      *   *Sub-fight (Expressivism vs. Descriptivism):* Yes, this is the hybrid/expressivist angle (e.g., Croom, Copp).
      *   *Verdict:* The setup is accurate. These are the standard positions in the literature (Hom's combinatorial externalism, Potts' CI, Anderson & Lepore's prohibitionism, etc.). I don't need to correct the setup fundamentally.

  3.  **Diagnose the Disagreement (The Core Task):**
      *   *Is it Verbal?* The user suspects it's about the semantics/pragmatics boundary. This is a strong candidate. The "semantics/pragmatics interface" is notoriously fuzzy. If Camp 1 says "It's in the truth conditions" and Camp 3 says "It's in the use," they might agree on all the observable linguistic behavior (embeddings, cancellations, etc.) but disagree on the *label* "semantics."
      *   *Is it Substantive?* There *are* substantive stakes. If Camp 1 is right, reporting a slur ("He said X is a [slur]") might implicate the reporter in the hatred unless careful distancing is used. If Camp 3 is right, the word itself is innocent. This has legal and ethical implications (hate speech laws, citation policies).
      *   *Is it Methodological?* Yes. Camp 1 & 2 tend to be formal semanticists. Camp 3 tends to be more pragmatic/social philosophers. They prioritize different data points. Formalists love embedding tests; pragmatists look at social context and reclamation.
      *   *The "Different Questions" Hypothesis:* The user suggests Camp 3 is asking about social function while 1 & 2 ask about encoding. This is partially true but slightly off. Camp 3 *is* making a semantic claim (that the semantic content is neutral). However, their *motivation* is often to explain the variability of offense without positing essentialist hatred in the lexicon.

  4.  **Synthesize the Diagnosis:**
      *   It's a **Metalinguistic Negotiation** (à la Plunkett & Sundell). They are arguing over how to *conceptualize* the phenomenon, not just describing the phenomenon.
      *   It's also a **Methodological Stalemate**. The embedding data is underdetermined. You can model projection via semantics (presupposition) or via pragmatics (norms of assertion).
      *   It's **Normatively Loaded**. The choice of theory isn't neutral. Camp 1 wants to capture the *harm* in the meaning. Camp 3 wants to allow for *reclamation* and avoid essentializing the hate.

  5.  **Address "Progress":**
      *   *Decisive Test?* Unlikely. Linguistic data is too flexible. "He's not a [slur], he's a decent guy" can be analyzed as semantic contradiction (Camp 1), presupposition failure (Camp 2), or pragmatic infelicity (Camp 3).
      *   *Agreed Criterion?* The semantics/pragmatics boundary is itself a philosophical battleground (Grice vs. Kaplan vs. Recanati). Waiting for agreement there is waiting for Godot.
      *   *Pivot?* Yes. Shift from "Where is the content?" to "What are the norms of use?" and "How does the harm propagate?" This aligns with the "prohibitionist" or "normative" turn in the literature (e.g., Hornsby, Langton).

