      *   *Refinement:* Make sure to mention that the "Semantics/Pragmatics" boundary is itself the object of dispute, not just the tool.
      *   *Key Insight:* The debate is stuck because it's trying to solve a socio-political problem with a formal tool.

  9.  **Final Structure:**
      *   Validation of the setup (It's accurate).
      *   Diagnosis 1: Underdetermination of data (The embedding tests don't decide).
      *   Diagnosis 2: Metalinguistic Negotiation (Fighting over the concept "meaning").
