      *   **User's Hypothesis:** It might be about where the semantics/pragmatics line is drawn (verbal/metalinguistic negotiation) or that Camp 3 is asking a different question (social function vs. sentence encoding).
      *   **Constraint:** "Be honest if you think no progress should be expected and why." "If my setup is confused... say that plainly."
      *   **Tone:** Philosophical, rigorous, direct, avoiding polite surveying.

  2.  **Evaluate the "Camps" (Accuracy Check):**
