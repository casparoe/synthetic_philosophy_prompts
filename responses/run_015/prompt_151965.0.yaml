answer: |-
  This analysis maps the 2016 EU Referendum franchise onto the distinction between **synchronic membership** (grounded in present subjection to coercive authority) and **diachronic membership** (grounded in the longitudinal shaping of life prospects). By treating the referendum not merely as a political event but as an institutional instantiation of boundary-drawing, we can test the explanatory power of democratic theory against the hard constraints of legal design.

  ### I. The Synchronic Principle: Subjection and the Exclusion of Resident EU Nationals

  The synchronic principle of democratic boundaries is typically articulated through the **All-Subjected Principle (ASP)**: those routinely subject to the coercive authority of a state should possess membership in its *demos*. In the context of the referendum, the "coercive authority" is complex because the vote concerned the source of that authority (UK sovereignty vs. EU supranationalism).

  **The Mapping:**
  *   **Included:** British citizens and qualifying Commonwealth citizens resident in the UK. They are synchronically subject to UK parliamentary sovereignty.
  *   **Excluded:** EU nationals resident in the UK (excluding Ireland, Malta, Cyprus).
  *   **The Theoretical Tension:** Under a strict ASP, long-settled EU nationals were fully subject to UK law (taxation, criminal law, civil regulation). The referendum decision would immediately alter their legal status from "EU citizens with free movement rights" to "third-country nationals." Their synchronic subjection was undeniable; the outcome would alter the very terms of that subjection.

  **Does the Synchronic Principle Justify Exclusion?**
  Theoretically, no. The exclusion of resident EU nationals suggests that the UK state did not view the referendum as an exercise of *general* coercive authority, but as an act of **constituent power** reserved for the *citizenry*.
  *   **Where Theory Illuminates Design:** The franchise reveals that the "demos" was constructed not on the basis of *subjection* (residency), but on the basis of *political membership* (citizenship/reciprocity). The inclusion of Irish, Maltese, and Cypriot citizens was not based on subjection, but on specific bilateral reciprocity treaties. This highlights a limit in the ASP: it fails to account for the distinction between being subject to laws *within* a regime versus having a say in the *existence* of the regime itself.
  *   **Where Theory Falls Silent:** Standard democratic theory struggles to explain why those whose rights are most precariously held (EU nationals facing potential deportation or status loss) are excluded from the decision to remove those protections. If the boundary is drawn at citizenship, the theory must justify why citizenship, rather than subjection, is the legitimate proxy for democratic voice in constitutional changes. The referendum suggests that in moments of regime change, the *demos* contracts to the "owners" of the state (citizens), violating the synchronic intuition that those most vulnerable to the decision should vote on it.

  ### II. The Diachronic Principle: Temporal Horizon and the Exclusion of Expatriates and Future Cohorts

  The diachronic principle focuses on the temporal durability of the decision's impact. It asks: whose fundamental life prospects will be shaped by this decision across its relevant horizon? This aligns with a temporalized **All-Affected Principle (AAP)**.

  **The Mapping:**
  *   **Excluded (Expatriates):** British citizens resident abroad for >15 years.
  *   **Excluded (Future Generations):** Those under 18 at the time of voting, and those not yet born.
  *   **The Theoretical Tension:** The decision to leave the EU is structurally irreversible (or costly to reverse) and long-lasting. It reshapes trade, security, and mobility for decades.

  **Does the Diachronic Principle Require Inclusion?**
  *   **The 15-Year Rule:** This rule imposes a "statute of limitations" on citizenship rights. Diachronically, these expatriates retain a legal bond (citizenship) and often an intention to return. Their life prospects (pension access, right of return, consular protection) were profoundly affected by the loss of EU free movement.
      *   *Theoretical Limit:* Excluding them suggests the state prioritizes *current presence* over *enduring legal bond*. Democratic theory usually treats citizenship as a durable status. By truncating this status after 15 years, the institutional design asserts that diachronic membership requires synchronic presence. This forces the theory to confront whether democracy is a right of *persons* or a function of *community participation*. If the latter, the exclusion is defensible; if the former, it is a violation of their enduring stake.
  *   **Future Generations:** The most stark diachronic failure. Younger voters (18-24) voted heavily to Remain, yet older cohorts determined the outcome. Those under 18 and the unborn had zero voice.
      *   *Theoretical Limit:* Standard democratic theory has no mechanism for representing the non-existent. The referendum treats the *demos* as a cross-section of the living population at Time $T$. However, because the decision binds Time $T+50$, the synchronic *demos$$_T$$* effectively colonizes the political agency of *demos$$_{T+50}$$*. The theory illuminates the injustice but offers no institutional remedy (e.g., guardians for the future, lower voting age) that was seriously entertained in the design.

  ### III. The Core Difficulty: Binding Authority Across Time

  Your final question asks whether this case suggests the core difficulty is justifying the binding authority of a synchronic *demos* over a diachronic population. The Brexit referendum provides a potent affirmative case for this proposition.

  **1. The Problem of Irreversibility**
  Democratic theory typically assumes a cycle of accountability: if a decision is bad, the *demos* can vote the rascals out or reverse the policy in the next cycle. The Brexit referendum broke this cycle. It was a "once-in-a-generation" decision that structurally constrained future policy options.
  *   **Analysis:** The synchronic *demos* (the voters in 2016) exercised a power that limited the sovereignty of future synchronic *demoi*. This reveals a gap in democratic legitimacy: we have robust theories for *who* votes (boundary), but weak theories for *how long* a vote should bind (duration). The referendum treated a diachronic constitutional shift as a synchronic policy preference.

  **2. The "Constitutive" Paradox**
  The referendum was ostensibly advisory (synchronic expression of opinion) but treated as binding (diachronic command).
  *   **Analysis:** This ambiguity allowed the government to bypass the diachronic safeguards usually inherent in constitutional change (e.g., supermajorities, ratification by multiple chambers, time delays). The case reveals that when the boundary problem is solved by simple majority rule among a synchronic population, the resulting authority lacks the legitimacy to bind a diachronic population unless additional constraints (constitutionalism) are applied. The UK's uncodified constitution lacked these constraints, exposing the raw power of the present over the future.

  **3. The Limits of the "Affected" Interest**
  If we strictly follow the diachronic "all-affected" principle, the *demos* for Brexit should have included not only future Britons and expats but also EU citizens and potentially global actors affected by trade shifts.
  *   **Analysis:** Expanding the boundary to fit the diachronic impact renders the *demos* unworkably large (potentially global). The case reveals a pragmatic limit to democratic theory: to function, a *demos* must be bounded, but to be legitimate, it must be inclusive of those affected. The Brexit franchise chose a clear, administrable boundary (citizenship + residency) at the cost of diachronic legitimacy. This suggests the boundary problem is not solvable by principle alone; it requires a trade-off between *administrative feasibility* (synchronic clarity) and *normative completeness* (diachronic justice).

  ### Conclusion: The Tyranny of the Present

  The 2016 referendum demonstrates that the boundary problem is not merely spatial (who is inside the territory) but fundamentally temporal.
  1.  **Synchronic Failure:** The exclusion of resident EU nationals shows that the *demos* was defined by ownership (citizenship) rather than subjection, leaving those most vulnerable to the decision without recourse.
  2.  **Diachronic Failure:** The exclusion of long-term expats and future generations shows that the *demos* was defined by the present moment, ignoring the enduring nature of the legal bond and the longevity of the consequences.

  **Theoretical Verdict:** The case suggests that standard democratic theory is ill-equipped to handle **inter-temporal binding**. It assumes a continuity of the *demos* that does not exist. The voters of 2016 are not the same population as the citizens of 2030, yet the former bound the latter. The core difficulty revealed is not locating the boundary, but justifying why a temporary majority of a synchronic population possesses the authority to alter the constitutional horizon for a diachronic population. Without a theory of **temporal legitimacy**—mechanisms to weigh future interests against present desires—the boundary problem remains unsolved, merely shifting from "who belongs" to "which *when* belongs." The Brexit franchise answered "now," and the theoretical cost was the disenfranchisement of the future.
