  7.  **Writing the Response:** (Proceeding to generate the text based on these structured thoughts, ensuring precise terminology and logical flow.) *Self-correction during drafting:* Make sure not to conflate "All-Affected" strictly with Diachronic. All-Affected can be synchronic too. I need to define Diachronic specifically as *temporal* endurance of impact vs. *current* subjection. I will define Synchronic as "current subjection to coercive authority" and Diachronic as "longitudinal impact on life prospects."

      *   *EU Nationals:* Synchronic subjects, excluded.
      *   *Expats:* Diachronic members (citizens), excluded.
      *   *Youth/Future:* Diachronic subjects, excluded (or underrepresented).
