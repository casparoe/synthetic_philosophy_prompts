      *   **Task:** Map this distinction onto the franchise exclusions/inclusions. Evaluate if synchronic principles justify excluding EU residents. Evaluate if diachronic principles require including future gens/expats. Identify where theory illuminates design vs. where it fails/implausible.
      *   **Core Question:** Does this reveal the problem is not just locating a boundary, but justifying the binding authority of a synchronic *demos* over a diachronic population?
      *   **Constraint:** Be disciplined. No generic Brexit politics. Rigorous two-directional analysis (theory $\to$ case, case $\to$ theory).

  2.  **Initial Brainstorming & Theoretical Grounding:**
