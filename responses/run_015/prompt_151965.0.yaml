  8.  **Final Review:** Does this answer the specific prompt about "justifying the binding authority of a synchronic demos over a diachronic population"? Yes, that will be the concluding synthesis.

  *(Self-Correction on the Irish/Malta/Cyprus exception)*: Why were they included? Reciprocity treaties. This complicates the "Citizenship" vs "Residency" model. It shows the franchise was based on *specific bilateral political ties*, not universal principles. I should mention this as a theoretical anomaly.

  *(Self-Correction on 15-year rule)*: This was statutory (Representation of the People Act 1985). It creates a "statute of limitations" on citizenship rights. This is a hard limit on diachronic membership.

