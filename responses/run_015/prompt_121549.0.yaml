answer: |-
  # Specification of Desiderata for Resolving the Heterogeneity Problem in Hedonism

  The heterogeneity problem challenges the core axiom of hedonism: that pleasure constitutes a single, homogeneous evaluative currency. If the phenomenology of listening to Bach, eating a peach, and solving a theorem are radically disparate, the claim that they are all instances of "pleasure" risks being empty or metaphorical. An adequate resolution must preserve the monistic axiology of hedonism while respecting the pluralistic reality of human experience.

  The following six desiderata specify the conditions any such resolution must meet.

  ### 1. Criterion for Cross-Modal Comparability
  *   **Specification:** The theory must provide a principled basis for ranking disparate pleasures (e.g., determining whether the relief of anxiety outweighs the taste of wine) without positing a distinct, introspectible "pleasure sensation" that accompanies all pleasant experiences.
  *   **Motivating Pressure:** Hedonism is inherently aggregative and maximization-oriented; it requires a common denominator to perform cost-benefit analysis across different life domains. However, the "common feeling" theory (that all pleasures share a specific qualitative tone) is phenomenologically false. We do not feel a "tingle" when solving a math problem that is qualitatively identical to the warmth of sunlight. The theory must explain commensurability without relying on this discredited phenomenological essence.
  *   **Status:** **Non-Negotiable.** Without a mechanism for comparison, hedonism ceases to be a decision procedure or a theory of value and becomes a mere taxonomy of positive states.

  ### 2. Constraint on Differentiation without Fragmentation
  *   **Specification:** The theory must distinguish between sensory, cognitive, and affective pleasures (acknowledging their distinct intentional objects and phenomenological profiles) without fracturing the concept of pleasure into unrelated genera.
  *   **Motivating Pressure:** Intuitively, there is a difference between a bodily sensation (itch-scratching) and a propositional attitude (joy that a friend recovered). A theory that collapses this distinction ignores phenomenological data; a theory that separates them too sharply risks turning "pleasure" into a homonym (like "bank" for river vs. money), undermining the unity of the theory.
  *   **Status:** **Non-Negotiable.** A theory that fails to match the phenomenological data lacks descriptive adequacy; a theory that fragments the concept loses its explanatory power as a unified account of well-being.

  ### 3. Demand for Unified Normative Reason
  *   **Specification:** The theory must explain why pleasure functions as a *univocal* normative reason for action across all domains. The reason-giving force of a cognitive pleasure must be of the same *kind* as that of a sensory pleasure, even if the magnitude differs.
  *   **Motivating Pressure:** If "pleasure" in the sensory domain means *activation of opioid receptors* and "pleasure" in the cognitive domain means *satisfaction of desire*, it is unclear why both generate the same type of moral or prudential claim. If the normative force is different, hedonism collapses into pluralism about value. The theory must identify the property in virtue of which all pleasures count *in favor* of an action.
  *   **Status:** **Non-Negotiable.** This is the definition of hedonism as a monistic normative theory. If the reason-giving feature is not unified, the theory is no longer hedonistic.

  ### 4. Accommodation of "Thin" and "Thick" Pleasures
  *   **Specification:** The theory must account for "thin" pleasures (the mere cessation of pain, relief, neutrality) and "thick" pleasures (rich, positive qualitative content) without reducing one to the other or excluding one category.
  *   **Motivating Pressure:** Epicurean hedonism prioritizes the absence of pain (aponia), while Cyrenaic and modern hedonisms often prioritize positive stimulation. A robust theory must explain how relief (a negative state becoming neutral) can be compared to joy (a neutral state becoming positive). Reducing relief to "low-level stimulation" misdescribes the experience; treating them as fundamentally different threatens comparability (Desideratum 1).
  *   **Status:** **Camp Preference.** This distinguishes *Negative Hedonism* (prioritizing pain avoidance) from *Positive Hedonism* (prioritizing pleasure acquisition). An adequate theory should accommodate both, but prioritization is a doctrinal choice.

  ### 5. Condition on Parasitic or Perverse Pleasures
  *   **Specification:** The theory must clarify the status of pleasures taken in morally objectionable states (e.g., schadenfreude, cruelty). It must show whether these share the same value-conferring feature as benign pleasures or reveal a structural ambiguity in the concept of pleasure.
  *   **Motivating Pressure:** If pleasure is the sole intrinsic good, the sadist's pleasure is intrinsically good *qua* pleasure. This is a major counter-intuitive result. A resolution must either bite the bullet (pure hedonism) or introduce a qualifier (qualified hedonism). If it introduces a qualifier, it risks violating Desideratum 3 (Unified Normative Reason) by making the reason-giving force dependent on non-hedonic factors.
  *   **Status:** **Camp Preference.** This distinguishes *Pure Hedonism* (all pleasure counts) from *Qualified Hedonism* (only virtuous/fitting pleasure counts).

  ### 6. Constraint on Neuroscientific Consistency
  *   **Specification:** The theory must be consistent with the observation that different pleasures recruit overlapping but non-identical reward circuitry (e.g., dopamine vs. opioid systems, "liking" vs. "wanting"). It must allow for family resemblance or distributed realization without collapsing into pure pluralism.
  *   **Motivating Pressure:** Contemporary neuroscience suggests there is no single "hedonic hotspot." Pleasure is realized by distributed networks. A theory positing a single metaphysical essence contradicts this data. However, if the theory concedes too much to neural diversity, it risks admitting that "pleasure" is merely a label for a cluster of unrelated brain states, violating Desideratum 3 (Unified Normative Reason).
  *   **Status:** **Camp Preference.** This is a constraint for *Naturalistic Hedonism*. A priori or phenomenological hedonists may reject empirical constraints as irrelevant to the conceptual analysis of value.

  ***

  ### Brief Theoretical Landscape Note
  *   **Classical Qualitative Hedonism (Mill):** Satisfies (1) by appealing to "competent judges" rather than a common sensation, but struggles with (6) as it relies on introspective hierarchy. It often fails (5) by implicitly discounting "lower" pleasures.
  *   **Quantitative Hedonism (Bentham):** Strong on (1) and (3) but fails (2) and (6) by assuming a homogeneous "feel" that can be measured cardinally regardless of source.
  *   **Functionalist/Dispositional Accounts (e.g., Heathwood, Feldman):** Satisfy (1) and (6) well by defining pleasure as an attitude (e.g., "intrinsic desire for experience") rather than a sensation. They struggle with (3), as it is unclear why a "desire for experience" generates the same normative force across vastly different cognitive contexts.

  ***

  ### Analysis of Joint Unsatisfiability

  The pair of desiderata most likely **jointly unsatisfiable** is **(1) Criterion for Cross-Modal Comparability** and **(6) Constraint on Neuroscientific Consistency**.

  **The Conflict:**
  Desideratum (1) demands a **unidimensional metric**. For hedonism to function as a guide to action, it must be possible to say that $P_{math} > P_{wine}$. This implies a scalar value (a single number) assigned to each state.
  Desideratum (6) demands **multidimensional realization**. Neuroscience indicates that "pleasure" is not a single variable but a vector of distinct processes (sensory liking, motivational wanting, cognitive appraisal) realized in non-identical circuitry.

  **Why they clash:**
  To satisfy (6), the theory must acknowledge that the "pleasure" of wine and the "pleasure" of math are realized by different causal mechanisms with different functional roles. To satisfy (1), the theory must map these distinct mechanisms onto a single scale *without* assuming a common sensation (as per the constraint in 1).
  If there is no common sensation (phenomenological unity) and no common neural substrate (physical unity), the basis for the single metric becomes metaphysically mysterious. One is forced to posit a "functional unity" (e.g., "both are rewarded states"), but neuroscience shows that reward systems themselves are fragmented (e.g., dissociations between liking and wanting).
  Consequently, a theory that fully respects the neural/phenomenological diversity required by (6) lacks the ontological grounding to support the strict cardinal comparability required by (1). It risks becoming a "family resemblance" theory, which is incompatible with the strict aggregation required by hedonistic calculus. Satisfying (6) pushes the theory toward **pluralism** (different kinds of value), while satisfying (1) requires **monism** (one kind of value). Reconciling deep ontological heterogeneity with strict axiological homogeneity is the central aporia of modern hedonism.
