      Guidance Note 44-B: Guidance for Prospective Parents on Completing Form P7 (Assessment of Non-Existence Benefit)
      Issued: 14 October 2024
      Status: Statutory

      1. Purpose of Form
      1.1 This form assesses the Net Non-Existence Benefit (NNEB) associated with a proposed conception. Under the Asymmetry Statute 2024, the absence of pain is deemed good, even if no subject exists to experience that good. The absence of pleasure is deemed not bad, provided no subject exists to be deprived.
      1.2 Applicants must not calculate the potential quality of life of the prospective child. Such a calculation presupposes a beneficiary, which contradicts Section 1.1.

      2. Inadmissible Considerations
      2.1 Applicants frequently cite the inability of the unborn to consent. This Office must advise that consent requires a legal subject capable of granting or withholding agreement. As no such subject exists prior to conception, this ground is inadmissible.
      2.2 Similarly, assertions that the child would suffer constitute an error of category. Suffering is only relevant insofar as its absence constitutes an unowned good. You are not preventing harm to a person; you are securing a benefit for no one.

      3. Revisions to Previous Guidance
      3.1 Version 2.1 of this guidance included Clause 5.4, which permitted refusal where predicted welfare fell below a minimum threshold. This clause was withdrawn following Legal Review 77. It illicitly reinstated the child as the bearer of harm.
      3.2 Version 3.0 included a Proxy-Consent Procedure. This was withdrawn following Legal Review 82. It implied a duty of care owed to a non-existent entity. The Department regrets this error.
      3.3 Current policy dictates that no licence may be refused for the sake of the prospective child. Refusals must be grounded solely in the impact on existing persons.

      4. Admissible Considerations
      4.1 The only admissible metrics concern the welfare of the applicants. You may claim that non-existence preserves your current household stability.
      4.2 Forecasts of parental happiness must be adjusted. The Office applies a standard optimism-bias discount of 40% to all self-reported life satisfaction scores. Hedonic adaptation must be assumed.
      4.3 If the adjusted forecast indicates a net gain for the applicants resulting from non-existence, a Licence to Refrain may be issued.

      5. Worked Examples
      5.1 Case 4492 (The Smiths): Applicants stated they wished to refrain from breeding so that the child might enjoy a good life. This reason was struck through. The benefit of enjoyment cannot accrue to the non-existent. Application rejected.
      5.2 Case 4493 (The Joneses): Applicants stated that raising a child would reduce their own life satisfaction by 15%. After applying the optimism-bias discount, the reduction was calculated at 9%. This constitutes a tangible loss to existing persons. The Non-Existence Benefit was logged as unowned. Licence granted.

      6. Appendix: Questions The Department Has Declined To Answer
      6.1 Q: If the benefit belongs to no one, who receives the benefit of this policy?
      6.2 Q: Does the Department exist for the sake of persons who do not exist?
      6.3 Q: Will this Office cease operations if the policy is successful?

      7. Continuing Duty
      7.1 The Office for Demographic Transition remains operational. We continue to process forms to ensure the unowned benefits of non-existence are properly logged, regardless of the diminishing pool of applicants.

