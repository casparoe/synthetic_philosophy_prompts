prompt: |-
  I chair an emergency resource-allocation committee for a regional disaster-response agency. Every week we receive more clinic aid requests than we can evaluate thoroughly; we have ninety minutes per file, incomplete post-event data, and a hard deadline before the next storm season. Rather than attempting an optimal allocation, we want a reusable decision procedure grounded in satisficing and bounded rationality—using aspiration-level thresholds for “good enough” demonstrated need, a recognition-primed stopping rule for information gathering, adaptive reference points drawn from the prior three allocations, and explicit hand-off points where value judgment must replace calculation. Write the procedure: the ordered questions to ask, what counts as a sufficient answer at each step, where it halts with approval or rejection, and where it requires human deliberation because the issue is one of values rather than facts. Then apply it to three requests: a rural clinic asking for backup generators after a mild winter storm that caused no infrastructure damage; an urban clinic with adequate current stock requesting preemptive trauma-kit upgrades justified only by projected future climate risk; and a clinic that clearly meets every aspiration threshold but serves a population with lower documented mortality risk, so that approval feels inequitable relative to past distributions. Include the case where the procedure yields a recommendation the committee is likely to resist, and state precisely what the procedure cannot settle—especially regarding opportunity costs across unknown future requests and equity adjustments that fall outside the aspiration levels.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an emergency resource-allocation committee.
      *   **Context:** Regional disaster-response agency. Weekly aid requests > evaluation capacity.
      *   **Constraints:** 90 mins/file, incomplete data, hard deadline (next storm season).
      *   **Philosophy:** Satisficing, Bounded Rationality (Simon), Recognition-Primed Decision (Klein), Adaptive Reference Points.
      *   **Deliverable:** A reusable decision procedure (ordered questions, sufficiency criteria, stop rules, hand-off points) + Application to three specific cases + Analysis of limitations (opportunity costs, equity).
      *   **Specific Cases:**
          1.  Rural clinic: Generators, mild storm, no damage.
          2.  Urban clinic: Trauma kits, adequate stock, future climate risk justification.
          3.  High-need clinic: Meets thresholds, but low mortality risk population (equity concern vs. past distribution).
      *   **Requirement:** Include a case where the procedure recommends something the committee might resist. Identify what the procedure *cannot* settle.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Satisficing:* Don't maximize; find the first option that meets the "aspiration level."
      *   *Bounded Rationality:* Acknowledge cognitive limits and information gaps. Don't seek perfect info.
      *   *Recognition-Primed Decision (RPD):* Use experience/patterns to recognize if a situation is typical. If typical, act. If atypical, deliberate.
      *   *Adaptive Reference Points:* Adjust expectations based on recent history (last 3 allocations).
      *   *Value Hand-off:* Explicitly mark where math stops and ethics/politics begin.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Structure:* Needs to be linear, time-boxed, and clear.
      *   *Phase 1: Triage & Recognition (0-15 mins).* Is this a standard request?
      *   *Phase 2: Aspiration Check (15-45 mins).* Does it meet the "good enough" criteria?
      *   *Phase 3: Adaptive Reference Check (45-60 mins).* How does this compare to recent approvals?
      *   *Phase 4: The Hand-off (60-90 mins).* If it passes/fails cleanly, decide. If it conflicts with values/equity, flag for deliberation.
      *   *Stopping Rules:* When do we stop looking for info? (When aspiration is met or clearly failed).
      *   *Decision Nodes:* Approve, Reject, Escalate.

  4.  **Refining the Criteria (Aspiration Levels):**
      *   Need concrete thresholds.
      *   *Need:* Documented gap or high-probability risk.
      *   *Capacity:* Can they use it?
      *   *Urgency:* Before next storm season?
      *   *Reference:* Consistency with last 3 cycles.

  5.  **Applying to Case 1: Rural Clinic (Generators, Mild Storm):**
      *   *Facts:* Mild storm, no damage. Request: Generators.
      *   *Aspiration:* Is there a demonstrated gap? No (no damage). Is there risk? Maybe, but "mild" suggests low probability.
      *   *RPD:* This looks like "hoarding" or "low-priority prep."
      *   *Verdict:* Likely Reject based on lack of *demonstrated* need (past event data missing).
      *   *Procedure Fit:* Stops early at Aspiration Check.

  6.  **Applying to Case 2: Urban Clinic (Trauma Kits, Future Risk):**
      *   *Facts:* Adequate stock. Justification: Future climate risk (projection).
      *   *Aspiration:* Need is *projected*, not current. Protocol usually favors *demonstrated* need or *critical* gap.
      *   *RPD:* This is "speculative."
      *   *Verdict:* Reject or Escalate. Why? Because "adequate current stock" fails the immediate aspiration threshold for *emergency* aid.
      *   *Procedure Fit:* Fails Aspiration Check.

  7.  **Applying to Case 3: High-Need Clinic (Meets Thresholds, Low Mortality Risk/Equity Issue):**
      *   *Facts:* Meets all technical thresholds. Population has lower documented mortality risk than past recipients.
      *   *Aspiration:* Passes technical checks.
      *   *Reference:* Past 3 allocations favored higher mortality risk areas.
      *   *Conflict:* Technical "Yes" vs. Equity "No."
      *   *Verdict:* This is the **Value Hand-off**. The procedure says "Approve" (satisficing met), but the committee feels "Reject" (equity).
      *   *Procedure Fit:* Triggers the Human Deliberation Node.

  8.  **Analyzing Limitations (What the Procedure Cannot Settle):**
      *   *Opportunity Costs:* We don't know future requests. Satisficing ignores the "better option next week."
      *   *Equity:* Aspiration levels are often backward-looking. They codify past biases.
      *   *Uncertainty:* Future climate risk is hard to quantify in a 90-minute window.

  9.  **Review and Refine:**
      *   *Tone:* Professional, bureaucratic but pragmatic, authoritative.
      *   *Formatting:* Use bolding, lists, and clear headers for readability.
      *   *Check Constraints:* Did I include the "resist" case? Yes (Case 3). Did I define the hand-off? Yes.
      *   *Self-Correction on Case 3:* Make sure the distinction is clear. The procedure *recommends* approval because thresholds are met. The *resistance* comes from the equity concern. This highlights the limit of the procedure.

  10. **Final Polish:** Ensure the distinction between "Recognition-Primed" (is this normal?) and "Aspiration" (is this good enough?) is clear. Ensure the "Adaptive Reference" (last 3 cycles) is integrated. (Self-correction: Make sure the time limits are realistic within the 90 mins).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Reject" for Case 1 & 2. I need to show *how* the procedure gets there. For Case 3, I need to ensure the procedure actually *yields* the recommendation the committee resists. If the procedure includes an equity check, it might reject it. I must design the procedure to be *technical/satisficing* first, pushing the equity issue to the "Value Hand-off." This aligns with the prompt's request to show where calculation ends and judgment begins. So, the procedure should technically clear Case 3, forcing the human deliberation.

  11. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # Protocol 90: Satisficing Allocation Procedure for Emergency Aid
  **Version:** 4.2 (Storm Season Cycle)
  **Time Budget:** 90 Minutes per File
  **Philosophy:** Bounded Rationality / Recognition-Primed Decision (RPD)

  ## I. The Decision Procedure

  ### Phase 1: Recognition & Triage (Minutes 0–15)
  **Goal:** Determine if the request fits a recognized pattern of "Standard Emergency" or "Atypical/Strategic."
  **Question 1:** *Does this request match a precedent from the last three allocation cycles?*
  *   **Sufficient Answer:** Yes (e.g., "Generator replacement post-flood," "Trauma restock post-mass casualty").
  *   **Stopping Rule:** If **YES**, proceed to Phase 2. If **NO** (e.g., preemptive upgrade, novel risk), flag as *Atypical* and proceed to Phase 2 with heightened scrutiny.
  *   **Data Limit:** Rely on internal database tags only. Do not contact external validators yet.

  ### Phase 2: Aspiration-Level Check (Minutes 15–45)
  **Goal:** Establish if the request meets the "good enough" threshold for need. Do not optimize; verify thresholds.
  **Question 2:** *Is there documented evidence of a capability gap or imminent threat exceeding the Aspiration Threshold (AT)?*
  *   **AT-1 (Damage):** >15% infrastructure degradation OR loss of primary power >24hrs.
  *   **AT-2 (Stock):** Current inventory <72hr operational capacity at peak load.
  *   **AT-3 (Risk):** Verified threat probability >60% within the hard deadline window (next storm season).
  *   **Sufficient Answer:** Meeting **ANY TWO** of AT-1, AT-2, or AT-3 constitutes a "Pass."
  *   **Stopping Rule:** If **FAIL** (0 or 1 threshold met), **REJECT**. File closed. Do not seek further data. If **PASS**, proceed to Phase 3.

  ### Phase 3: Adaptive Reference Check (Minutes 45–60)
  **Goal:** Ensure consistency with recent resource distribution to prevent drift.
  **Question 3:** *Is this allocation consistent with the median resource value of the last three approved requests in this category?*
  *   **Reference Point:** Calculate the average dollar value/unit count of the last 3 approvals for similar clinic types.
  *   **Tolerance:** ±20% variance allowed.
  *   **Sufficient Answer:** Request falls within tolerance OR variance is justified by a specific AT threshold exceeded (e.g., higher risk justifies higher cost).
  *   **Stopping Rule:** If **FAIL**, **REJECT** (Request is an outlier). If **PASS**, proceed to Phase 4.

  ### Phase 4: The Value Hand-Off (Minutes 60–90)
  **Goal:** Identify where calculation ends and ethical judgment begins.
  **Question 4:** *Does approval create a recognized equity conflict or opportunity cost that the thresholds ignore?*
  *   **Trigger:** The request passes Phases 1–3, *but* the population served has historically lower priority (e.g., lower mortality risk, higher socioeconomic status) compared to pending/unseen requests.
  *   **Action:**
      *   If **NO CONFLICT:** **APPROVE**. (Administrative sign-off).
      *   If **CONFLICT DETECTED:** **ESCALATE TO COMMITTEE DELIBERATION.**
  *   **Note:** This protocol *cannot* resolve the conflict. It flags it. The Committee must vote to override the technical recommendation based on values (equity vs. efficiency).

  ---

  ## II. Application to Current Requests

  ### Case 1: Rural Clinic (Backup Generators)
  *   **Context:** Mild winter storm, no infrastructure damage.
  *   **Phase 1 (Recognition):** *Atypical.* Previous generator approvals required documented power failure >24hrs. This is preemptive.
  *   **Phase 2 (Aspiration):**
      *   AT-1 (Damage): **Fail** (No damage).
      *   AT-2 (Stock): **N/A** (Generators are infrastructure, not consumable stock).
      *   AT-3 (Risk): **Fail** (Mild storm history does not verify >60% threat of severe failure).
      *   **Result:** 0 Thresholds Met.
  *   **Phase 3 & 4:** Skipped.
  *   **Procedure Recommendation:** **REJECT.**
  *   **Analysis:** The procedure halts early. The lack of *demonstrated* gap violates the satisficing threshold. The committee will likely agree easily; this is a low-friction decision.

  ### Case 2: Urban Clinic (Preemptive Trauma Kits)
  *   **Context:** Adequate current stock. Justification is projected future climate risk.
  *   **Phase 1 (Recognition):** *Atypical.* Most trauma kit approvals follow an event, not a projection.
  *   **Phase 2 (Aspiration):**
      *   AT-1 (Damage): **Fail.**
      *   AT-2 (Stock): **Fail** (Adequate current stock).
      *   AT-3 (Risk): **Pass** (Projected climate risk is verified, assuming model confidence >60%).
      *   **Result:** 1 Threshold Met.
  *   **Procedure Recommendation:** **REJECT.**
  *   **Analysis:** The procedure requires *two* aspiration thresholds. While the risk is real, the lack of current capacity gap fails the "good enough" test for *emergency* aid. This prevents resource hoarding based on speculation. The committee may resist this if they believe climate projections should count as two thresholds, but the protocol holds firm to prevent budget bleed.

  ### Case 3: The "Equity Trap" Clinic
  *   **Context:** Meets every aspiration threshold (Damage + Risk). However, serves a population with lower documented mortality risk than previous recipients. Approval feels inequitable relative to past distributions.
  *   **Phase 1 (Recognition):** *Standard.* Matches precedent for damage + risk.
  *   **Phase 2 (Aspiration):** **PASS.** (Meets AT-1 and AT-3).
  *   **Phase 3 (Reference):** **PASS.** (Request value is within 20% of last 3 approvals).
  *   **Phase 4 (Value Hand-Off):** **CONFLICT DETECTED.**
      *   *Technical Status:* The procedure dictates **APPROVE**. All calculable thresholds are met.
      *   *Human Judgment:* The Committee knows that approving this uses funds that might be needed for a higher-mortality region in a future request (unknown opportunity cost) and perpetuates a distribution pattern that favors this demographic over others.
  *   **Procedure Recommendation:** **ESCALATE TO COMMITTEE DELIBERATION.**
  *   **Analysis:** This is the critical case. The procedure yields a recommendation (Approve) that the Committee is likely to **resist** based on equity grounds. The protocol successfully identifies that this is no longer a math problem; it is a values problem.

  ---

  ## III. Limitations: What This Procedure Cannot Settle

  As Chair, I must acknowledge that Protocol 90 is a tool for managing cognitive load, not a moral oracle. It explicitly leaves three critical uncertainties unresolved:

  **1. The Opportunity Cost of the Unseen Request**
  Satisficing evaluates the file *in front of us*. It does not account for the "better" request that may arrive next week. By approving Case 3 (which technically passes), we may deplete the budget before a request from a higher-mortality region arrives. The procedure treats the current budget as a static constraint, not a dynamic portfolio. It cannot calculate the *expected value* of saving resources for an unknown future need.

  **2. Equity Adjustments Outside Aspiration Levels**
  Our aspiration thresholds (AT-1, 2, 3) are based on *capacity* and *risk*, not *social vulnerability*. If a wealthy clinic and a poor clinic both lose power (AT-1), the procedure treats them identically. It cannot settle whether aid should be distributed based on *need* (loss of function) or *equity* (ability to recover without aid). Case 3 highlights this: the procedure says "They lost power, give generators." Justice might say "They can afford their own generators; give them to the clinic that cannot." Protocol 90 forces this into the Deliberation Phase, but offers no algorithm to solve it.

  **3. The Validity of Predictive Risk**
  In Case 2, we rejected a request based on future climate risk because it only met one threshold. However, bounded rationality acknowledges our data is incomplete. If our climate models are correct but our "current stock" data is outdated, we have rejected a vital preventive measure. The procedure prioritizes *verified past damage* over *probable future harm* to reduce evaluation time. This creates a systemic bias toward reactive rather than proactive resilience, which the Committee must accept as a trade-off for meeting the deadline.

  **Final Directive:**
  For Case 1 and 2, issue Rejections based on Phase 2 failures. For Case 3, place the file on the Deliberation Agenda. Do not attempt to calculate the "right" answer for Case 3 during the 90-minute window. Present the technical "Pass" alongside the equity "Warning," and let the Committee vote. The procedure's job is to ensure we vote on values consciously, not to pretend values can be calculated.
