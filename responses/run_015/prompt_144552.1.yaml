  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Human-Factors Lead at a metropolitan rail operator.
      *   **Goal:** Create a reusable decision procedure based on the concept of "sphexishness" (rigid, cue-driven behavior vs. flexible, goal-directed behavior).
      *   **Context:**
          1.  Authoring/revising rule-book procedures (40-50/year).
          2.  Chairing incident reviews (12/year, 2 days effort, limited data, high stakes with regulators and unions).
      *   **Constraints:**
          *   Must be usable by a field investigator with a 2-day budget.
          *   Must address the "grain problem" (level of description).
          *   Must prevent the "determinism implies no responsibility" slide.
          *   Must use/correct/replace the user's taxonomy of failure modes.
          *   Must handle evidence limitations (no simulators, contaminated debriefs).
          *   Must provide a specific verdict vocabulary for reports.
          *   Must include an honest statement of limitations.
          *   Must run on three specific cases (A, B, C).
          *   Must identify where the procedure misfires.
      *   **Tone:** Professional, precise, pragmatic, philosophically grounded but accessible to non-philosophers (regulators/unions).

  2.  **Analyze the Core Concept: Sphexishness:**

      *   *Definition:* Rigid adherence to a script triggered by cues, insensitive to context or goal achievement.
      *   *Contrast:* Flexibility, goal-sensitivity, adaptation to novelty.
      *   *Challenge:* How to operationalize this without relying on the specific ethological accuracy of the wasp story.
      *   *Key Insight:* It's not about *whether* a rule was followed, but *why* and *how* it was followed. Was the operator monitoring the *goal* or just the *cue*?

  3.  **Address the Four "Must Get Right" Points:**

      *   **1. The Grain Problem:**
          *   *Issue:* At a microscopic level, neurons fire deterministically. At a macroscopic level, "driving a train" looks flexible.
          *   *Solution:* Define the grain relative to the *control authority* delegated to the role. The test grain is the "Decision Horizon." Can the operator intervene *between* cue and outcome?
          *   *Justification:* Responsibility attribution requires the ability to have done otherwise *within the scope of the role*.

      *   **2. The Determinism/Responsibility Slide:**
          *   *Issue:* "Everything is caused, therefore no one is responsible."
          *   *Counter:* Responsibility isn't about uncaused action (libertarian free will); it's about *responsiveness to reasons*. A system is responsible if it tracks relevant variables. Sphexishness is a failure of tracking.
          *   *Procedure Design:* Focus on *information sensitivity*, not causal origin.

      *   **3. Taxonomy of Failure Modes:**
          *   *User's Taxonomy:* (1) Run-to-completion, (2) Cue-repetition (looping), (3) Novelty failure.
          *   *Critique:* Good start. Need to add (4) "Proceduralization of Flexibility" (checking the box without checking the thing).
          *   *Hard Cases:* Large library of canned responses (looks flexible, isn't) and Rigid Flexibility (mandatory checks done mindlessly).
          *   *Defense against Mechanical Application:* The procedure itself must require a "Values Handoff" step.

      *   **4. Evidence & Counterfactuals:**
          *   *Issue:* Can't run experiments. Debriefs are hindsight-biased.
          *   *Solution:* Triangulation. Look for *markers of monitoring* in the data (pauses, verbalizations, eye tracking if available, sequence deviations). Use "Plausible Alternative Scenarios" based on training records, not just the specific incident.
          *   *Default:* If evidence is insufficient to prove rigidity, default to *System Design Flaw* (benefit of doubt to the human), unless there is clear evidence of willful neglect.

  4.  **Drafting the Procedure (The "Sphex-Test Protocol"):**

      *   *Name:* Needs to sound official but descriptive. "Goal-Sensitivity Assessment Protocol" (GSAP).
      *   *Structure:*
          1.  Define Grain (The "Unit of Agency").
          2.  Evidence Triage.
          3.  The Three Tests (Run-to-Completion, Cue-Dependency, Novelty-Response).
          4.  The Values Handoff.
          5.  Verdict Vocabulary.
          6.  Limitations.

  5.  **Refining the Verdict Vocabulary:**

      *   Need to avoid "Human Error" (too vague) and "Willful Negligence" (too aggressive).
      *   *Proposed:*
          *   "Procedural Lockout" (System made rigidity inevitable).
          *   "Goal-Decoupling" (Operator lost sight of *why*, focused on *what*).
          *   "Adaptive Failure" (Operator tried to adapt but chose poorly).
          *   "System-Induced Sphexishness" (Rules forced the rigidity).

  6.  **Developing the "Determinism" Defense:**

      *   Explicitly state: "This procedure does not assess whether the action was caused. It assesses whether the action was *sensitive to the goal state*."

  7.  **Running the Cases:**

      *   *Case A (Read-back errors):*
          *   *Analysis:* Fluency + Wrong Content = Cue-Dependency (phonetic flow vs. semantic check).
          *   *Verdict:* Goal-Decoupling.
          *   *Action:* Change the step (require pointing or physical token), don't blame drivers.
      *   *Case B (Signaller Alarms):*
          *   *Analysis:* Rulebook order vs. Safety Goal. High tempo.
          *   *Verdict:* System-Induced Sphexishness. The rulebook prioritized sequence over outcome in a crisis.
          *   *Action:* Revise rulebook for degraded modes.
      *   *Case C (TSR in Darkness):*
          *   *Analysis:* 30 years experience, fatigue, subtle change. "Something looked off" but didn't act.
          *   *Crucial Step:* Did he have *capacity* to act? Fatigue reduces goal-sensitivity.
          *   *Verdict:* System-Induced Capacity Reduction leading to Goal-Decoupling.
          *   *Action:* Primarily system (rostering/briefing), but acknowledge the "missed opportunity" without blaming the individual morally. *Wait, the prompt asks if I must attribute it to him.* If the procedure is honest, if he had time and registered "something off," there was a moment of agency. But the *cause* of the failure was the fatigue/briefing. The verdict should reflect the *primary* cause.
          *   *Refinement:* The procedure should distinguish *Attribution of Outcome* vs. *Attribution of Cause*. The outcome (SPAD) is attributed to the train movement. The *cause* is attributed to the system conditions that degraded the human's goal-sensitivity.

  8.  **Addressing the "Misfires" and Limitations:**

      *   *Canned Responses:* Hard to distinguish expert intuition from memorized scripts without deep cognitive task analysis (too expensive).
      *   *Burden Sharing:* The procedure identifies the *mode* of failure, not the *moral weight*. That's the Values Handoff.
      *   *Investigator Bias:* Mitigated by requiring explicit statement of the counterfactual tested.

  9.  **Review against Constraints:**

      *   *2-Day Budget:* Keep tests simple. Rely on data recorder logs and debrief structure.
      *   *Union/Regulator:* Language must be neutral. Avoid "mindless." Use "goal-decoupled."
      *   *Grain:* Defined as "Intervention Window."
      *   *Determinism:* Addressed in the preamble.

  10. **Final Polish:**

      *   Ensure the tone is authoritative yet humble.
      *   Check that the "Values Handoff" is clear (where the procedure stops and human judgment begins).
      *   Make sure Case C is handled delicately but honestly.

  *(Self-Correction during drafting)*: I need to be careful with Case C. If I say "System Failure," the union is happy, but if the driver *could* have stopped and didn't, is that fair? The prompt says "He registered that something looked off and had time to act on it." This implies a moment of goal-sensitivity that failed to convert to action. This is the edge case. The procedure must identify this as a *breakdown in execution* despite *presence of awareness*. This is distinct from sphexishness (lack of awareness). I need to make sure the procedure distinguishes "Sphexishness" (no goal tracking) from "Execution Failure" (goal tracked, action failed). Actually, the prompt asks about sphexishness. If he noticed "something off," he *wasn't* being sphexish at that moment. He was monitoring. The failure was in the *response* to the monitoring. I need to ensure the procedure captures this nuance so I don't have to call him a robot.

  *Revised Plan for Case C:* The procedure tests for *sustained* goal sensitivity. If sensitivity existed but action failed, it's not sphexishness. It's a different failure mode. This protects the driver from the "robot" label while acknowledging the accident.

  *Wait, looking closer at the prompt's taxonomy:* "A step that works across familiar configurations but produces nothing appropriate under a relevantly novel one." This fits Case C. The novelty was the moved board. The response was "do nothing" (familiar routine).
  *Okay, I need to be precise.* The procedure needs to allow for "System-Compromised Agency."

  *Let's finalize the Verdict Vocabulary:*
  1.  **Procedural Lockout:** System design made the correct action impossible or invisible.
  2.  **Goal-Decoupling (Sphexish):** Operator followed cue, ignored goal.
  3.  **Capacity-Degraded Agency:** Operator had goal in mind, but capacity (fatigue/stress) prevented execution.
  4.  **Unexplained Deviation:** Evidence insufficient.

  *Okay, let's write.*
answer: |-
  # The Goal-Sensitivity Assessment Protocol (GSAP)
  **Version 1.0 | For Use in Rule Revision and Incident Review**

  ## 1. Preamble: Scope and Philosophical Grounding
  This procedure assesses whether an operator's action was **Goal-Sensitive** (responsive to the current state of the world and the intended outcome) or **Cue-Driven** (responsive only to a trigger, regardless of outcome).

  **On Determinism and Responsibility:**
  This protocol does not ask whether an action was "caused." All actions are caused. It asks whether the causal chain included **feedback from the goal state**. A system is responsible if its output changes when the goal requirements change. If the output remains fixed despite changing goal requirements, the system is operating in a *sphexish* (rigid) mode. Responsibility is attributed based on who controlled the feedback loop: the operator (via attention) or the system design (via constraints).

  **On Grain (The Unit of Agency):**
  We do not test at the grain of neuron firing (too fine) nor "running the train" (too coarse). We test at the grain of the **Intervention Window**.
  *   **Definition:** The smallest time/space interval in which the operator has the authority and physical capacity to alter the outcome.
  *   **Justification:** This is the only grain at which "doing otherwise" is operationally meaningful. If the Intervention Window is closed by system design (e.g., automation locks), rigidity is a system verdict. If the Window is open, we test the operator's sensitivity within it.

  ---

  ## 2. The Procedure

  ### Step 1: Evidence Triage (Budget: 2 Hours)
  *   **Input:** Data recorder logs, rulebook text, debrief transcript, rostering records.
  *   **Action:** Map the timeline. Identify the **Intervention Window(s)** where the outcome could have been changed.
  *   **Stop Condition:** If the Intervention Window was physically closed by equipment failure or rule-based prohibition *before* the operator could act, terminate. **Verdict: Procedural Lockout.** (Handoff to System Designers).
  *   **Evidence Gap:** If debrief is the only source of mental state, mark all mental state findings as **Low Confidence**. Do not skip; downgrade the verdict certainty.

  ### Step 2: The Counterfactual Sensitivity Test (Budget: 4 Hours)
  *   **Goal:** Determine if the operator's behavior tracked the *goal* or the *cue*.
  *   **Method:** Since we cannot run experiments, we construct **Plausible Alternative Scenarios (PAS)** based on training records and prior behavior.
  *   **Test A (The Variation Test):** In the debrief, ask: "If [Cue X] had been absent but [Goal Y] remained, what would you have done?" Compare this to "If [Goal Y] had been achieved early, would you have stopped [Action Z]?"
      *   *Pass:* Operator describes a different action for different goal states.
      *   *Fail:* Operator describes the same action regardless of goal state.
  *   **Test B (The Monitoring Marker):** Review data logs for **Micro-Pauses** or **Sequence Deviations**.
      *   *Rationale:* Rigid scripts run at constant tempo. Goal-checking introduces latency (processing time).
      *   *Pass:* Variance in timing correlates with complexity of the situation.
      *   *Fail:* Constant tempo despite escalating risk indicators.
  *   **Evidence Gap:** If data resolution is too low to see Micro-Pauses, mark Test B as **Skipped**. Loss: Reduced ability to distinguish expertise from memorization.

  ### Step 3: Taxonomy Classification (Budget: 2 Hours)
  Classify the failure mode using the following four categories. Select the *best fit*.

  1.  **Run-to-Completion:** Action started and finished despite clear evidence the goal was achieved or became impossible. (Classic Sphexishness).
  2.  **Cue-Looping:** Action re-triggered by the presence of a cue, even though the action's effect is already present.
  3.  **Novelty Blindness:** Action appropriate for familiar configurations but ineffective for a novel configuration that shared surface features with the familiar one.
  4.  **Proceduralized Flexibility:** A "check" or "review" step was performed physically (signed, spoken) but the cognitive monitoring associated with it was absent. (e.g., signing a checklist without looking).

  *   **Hard Case 1 (Large Library):** If the operator selected a response from a large store of memorized cases that *looked* like the current situation but wasn't: Classify as **Novelty Blindness**. This is not flexibility; it is pattern-matching without verification.
  *   **Hard Case 2 (Rigid Flexibility):** If a "be flexible" rule was followed rigidly (e.g., "Stop and Check" done without Checking): Classify as **Proceduralized Flexibility**.

  *   **Defense Against Mechanical Application:** If the investigator selects **Proceduralized Flexibility**, they must append a **System Context Statement**: "What organizational pressure made the *form* of the check more valuable than the *function*?" If this cannot be answered, the classification is invalid.

  ### Step 4: The Values Handoff (Budget: 1 Hour)
  *   **Trigger:** If the verdict implies moral blame or significant policy change.
  *   **Action:** The investigator must explicitly state: "The evidence establishes [Fact X]. The decision to treat this as [Negligence / Training Issue / System Design Flaw] is a policy decision outside this protocol."
  *   **Purpose:** Prevents the procedure from making ethical judgments. It reports *mechanism*, not *guilt*.

  ---

  ## 3. Verdict Vocabulary
  *Use these exact terms in reports to the Regulator and Union.*

  | Verdict | Definition | Licenses... | Does Not License... |
  | :--- | :--- | :--- | :--- |
  | **System-Induced Rigidity** | The rulebook or interface forced a fixed sequence that prevented goal-tracking. | Rule revision; Interface redesign. | Disciplinary action against the operator. |
  | **Goal-Decoupling** | The operator had the capacity to track the goal but attended to the cue instead. | Retraining; Competence assessment. | Assumption of willful negligence (unless repeated). |
  | **Capacity-Degraded Agency** | The operator attempted to track the goal, but fatigue/stress reduced the Intervention Window. | Roster review; Welfare support. | Conclusion that the operator is "unfit" permanently. |
  | **Evidence Insufficient** | Data does not support a finding on sensitivity. | No action (Status Quo). | Any negative inference against the operator. |

  ---

  ## 4. Limitations (Honest Statement)
  1.  **Expertise vs. Script:** This procedure cannot reliably distinguish between a highly expert operator running a subconscious "chunk" of behavior and a novice running a rigid script. Both look smooth. We assume expertise unless there is evidence of Novelty Blindness.
  2.  **Burden Allocation:** This protocol identifies the *mode* of failure, not the *proportion* of blame. It can say "The system made rigidity likely," but it cannot calculate "70% System / 30% Human." That is a negotiation between Management and Union.
  3.  **Investigator Bias:** The choice of **Plausible Alternative Scenarios** (Step 2) is subjective. An investigator can rig the test by choosing counterfactuals the operator couldn't possibly know. *Mitigation:* All PAS must be drawn from current training materials, not hindsight.

  ---

  ## 5. Application to Cases

  ### Case A: The Read-Back Error
  *   **Facts:** Drivers recite fluently (high speed) but get signal numbers wrong (content error). Compliance is high.
  *   **Step 1 (Triage):** Intervention Window is the moment of speech. Capacity exists.
  *   **Step 2 (Sensitivity):**
      *   *Variation:* If asked, drivers likely say "I check the signal."
      *   *Monitoring Marker:* Fluency indicates automated script. Errors in content indicate the *phonetic flow* is the cue, not the *signal number*.
  *   **Step 3 (Taxonomy):** **Proceduralized Flexibility**. The step is "verify," but the behavior is "recite." The form of the check is valued over the function.
  *   **Step 4 (Handoff):** Why is fluency rewarded? Is there time pressure?
  *   **Verdict:** **Goal-Decoupling** (specifically, Cue-Driven Speech).
  *   **Recommendation:** Do not blame drivers. The step design encourages phonetic matching over semantic verification. **Action:** Change the step. Require the driver to *point* at the signal while speaking, or read the number *before* receiving authorization. Tighten the script to force a pause.

  ### Case B: The Three Alarms
  *   **Facts:** 3 alarms in 11 seconds. Rulebook order followed. 3rd alarm required deviation. Deviation did not happen. Low speed into possession. No injury.
  *   **Step 1 (Triage):** Intervention Window: Between Alarm 2 and 3. 11 seconds is high cognitive load.
  *   **Step 2 (Sensitivity):**
      *   *Variation:* In training, is deviation taught? If yes, why not used?
      *   *Monitoring Marker:* "Perfect compliance" in a crisis suggests **Run-to-Completion** on the Rulebook Script.
  *   **Step 3 (Taxonomy):** **System-Induced Rigidity**. The Rulebook prioritized *sequence integrity* over *situational outcome*. The operator was sphexish because the system trained them to be.
  *   **Step 4 (Handoff):** The organization values rule compliance over risk mitigation in degraded modes.
  *   **Verdict:** **System-Induced Rigidity**.
  *   **Recommendation:** Do not attribute to the signaller. The rulebook failed to provide a "break glass" clause for multiple simultaneous failures. Revise rulebook to allow priority-based triage in fault conditions.

  ### Case C: The Moved TSR Board
  *   **Facts:** 30 years experience. Fatiguing roster. Board moved (Novelty). "Something looked off" (Awareness). Did not act (Execution Failure).
  *   **Step 1 (Triage):** Intervention Window: Between "looking off" and passing the board. Time existed.
  *   **Step 2 (Sensitivity):**
      *   *Variation:* Operator registered anomaly. This *passes* the Sphex test for awareness. He was not cue-driven; he was goal-aware.
      *   *Monitoring Marker:* The failure was not in *seeing*, but in *acting*.
  *   **Step 3 (Taxonomy):** This is **not** Sphexishness. Sphexishness implies a lack of goal-tracking. He tracked the goal ("something is wrong") but failed to execute. This fits **Capacity-Degraded Agency**. The fatigue roster reduced the bandwidth available to convert *awareness* into *action*.
  *   **Step 4 (Handoff):** The organization placed a competent operator in a condition where his competence could not be fully utilized.
  *   **Verdict:** **Capacity-Degraded Agency**.
  *   **Recommendation:**
      *   *To Regulator:* The operator was not rigid; he was compromised. The primary cause is rostering/briefing.
      *   *To Union:* We acknowledge the operator's awareness. We do not classify this as "Human Error" in the sense of negligence. We classify it as "System-Compromised Performance."
      *   *Attribution:* The outcome (SPAD) is attributed to the train movement. The *cause* is attributed to the Rostering System. The operator is not held responsible for the *cause*, but the incident record notes the "missed intervention" as a symptom of fatigue, not incompetence.

  ---

  ## 6. Where the Procedure Misfires (Critical Review)

  **1. The "Canned Response" Problem:**
  *   **Issue:** An expert driver sees a hazard and brakes instantly. A novice driver sees a hazard and brakes instantly (because they were taught "see hazard = brake"). The data looks identical.
  *   **Misfire:** GSAP may classify the expert as rigid (Cue-Driven) because there was no visible "thinking pause."
  *   **Mitigation:** The **Expertise Assumption**. If the operator has a clean record and high tenure, default to **Goal-Sensitive Automation** unless there is evidence of Novelty Blindness. We assume fluency is expertise, not rigidity, unless proven otherwise.

  **2. The Burden of Proof:**
  *   **Issue:** The procedure identifies *mechanism*, but the Union and Regulator want *liability*.
  *   **Misfire:** GSAP says "Capacity-Degraded." Management hears "Not our fault." Union hears "He was too tired to do his job."
  *   **Mitigation:** The **Values Handoff** is mandatory. The investigator must write: "This verdict implies the organization accepted a risk level associated with this roster." This forces the political decision into the open.

  **3. Investigator Bias in Counterfactuals:**
  *   **Issue:** I can prove anyone is sphexish by choosing a counterfactual they couldn't know. (e.g., "If you had known the rail was broken, would you have stopped?" "Yes." "But you didn't know, so you didn't stop. Rigid.")
  *   **Misfire:** The test becomes a tool for hindsight bias.
  *   **Mitigation:** **Training Boundary Rule.** You may only test counterfactuals that are covered in current competency training. If the scenario was not trained, the operator cannot be penalized for failing the counterfactual test. The verdict must default to **System-Induced Rigidity** (failure to train for the variable).

  **4. The "Values Handoff" Loophole:**
  *   **Issue:** Investigators may use the Handoff to dodge making a tough call.
  *   **Misfire:** "Evidence Insufficient" becomes the default for difficult cases.
  *   **Mitigation:** Audit. If >20% of reports end in "Evidence Insufficient" or "Values Handoff," the Human Factors Lead (me) must review the investigator's competence.

  ---

  ## 7. Addressing Your Specific Concerns

  **On the Determinism Slide:**
  Your colleagues argue: "If actions are caused, operators aren't responsible."
  **Correction:** Responsibility is not the absence of causation; it is the presence of **reason-responsiveness**. A thermostat is caused to turn on, but it is not responsible for the temperature because it cannot understand *why* it is turning on. An operator is responsible if their action changes based on the *reason* (the goal), not just the *cause* (the cue). The GSAP tests for reason-responsiveness. If the operator's output varies with the goal requirements, they are responsible, even if their neurons fired deterministically. The procedure blocks the slide by focusing on *sensitivity*, not *origin*.

  **On the Taxonomy:**
  Your three modes are sound. I added **Proceduralized Flexibility** because it is the most common in rail (the "tick-box" culture).
  *   **Independence:** They are not mutually exclusive. A Run-to-Completion error can be caused by Novelty Blindness.
  *   **Hard Case 1 (Large Library):** Classified as **Novelty Blindness**. It looks flexible but is actually rigid pattern matching.
  *   **Hard Case 2 (Rigid Flexibility):** Classified as **Proceduralized Flexibility**.
  *   **Defense:** The **System Context Statement** requirement forces the investigator to ask why the box-ticking became more important than the checking.

  **On Evidence and Defaults:**
  *   **Default:** When evidence runs out, default to **System-Induced Rigidity** or **Evidence Insufficient**. Never default to **Goal-Decoupling** (Operator Fault) without positive evidence of monitoring failure.
  *   **Reasoning:** We can change the system. We cannot easily change the human. If we are unsure, the safer bet for safety culture is to assume the system failed to support the human.

  **On Case C (The Hard One):**
  You asked: *"If your procedure says I must write it anyway, say so plainly."*
  **Answer:** The procedure says you **do not** have to write that it is attributable to him in the sense of blame.
  *   **Step:** Step 3 (Taxonomy).
