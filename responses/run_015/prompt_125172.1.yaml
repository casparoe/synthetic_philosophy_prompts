answer: |-
  # Lesson Plan: The Replacement Protocol

  **Course:** Upper-Level Philosophy of Mind
  **Topic:** Mind Uploading / Functionalism / Organization Invariance
  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:**
  *   3 Large envelopes (labeled "Predictions: Clinic A, B, C")
  *   48 Index cards (3 per student)
  *   3 Protocol Sheets (one for each Clinic type)
  *   Whiteboard and 3 distinct colored markers
  *   Timer/Projector

  ---

  ## Part 1: Instructor Preparation & Rules

  **The Core Constraint:** You are the Facilitator, not the Lecturer. You enforce the stipulations. You do not explain *why* until the last 20 minutes.

  **The Stipulation (Crucial):** Students must accept that in this thought experiment, *functional equivalence is guaranteed*. If a student argues, "But silicon can't do what neurons do," you must reply: "In this scenario, it does. We are testing the consequences of that assumption, not the engineering."

  **Compression Note:** While the narrative describes 20 rounds, real-time constraints require **5 Checkpoints** per protocol (0%, 25%, 50%, 75%, 100%). Students will be told these checkpoints represent the completion of Rounds 0, 5, 10, 15, and 20.

  **Grouping:** Divide the class into three Clinics (A, B, C) of 5-6 students each.
  *   Clinic A: Drip Protocol
  *   Clinic B: Shadowing Protocol
  *   Clinic C: Hemispheric Protocol

  ---

  ## Part 2: Student Instructions (Handout)

  *Distribute this sheet at the start. Read the "Facilitator Script" aloud to ensure uniform understanding.*

  ### PATIENT CONSENT AND DATA RECORDING FORM

  **Role:** You are the Subject. You are undergoing a neural replacement procedure.
  **Task:** Track your own **Experience Level** throughout the procedure.

  **The Stipulations (Read Carefully):**
  1.  **Functional Fixity:** At every stage of your procedure, your input-output behavior remains *exactly* the same. You pass all Turing tests. You tell your doctors you feel normal. You write essays, solve math problems, and joke with friends exactly as you did before.
  2.  **The Private Verdict:** Despite the stipulation above, you may privately feel that your internal experience is changing. Your index cards record this *private* intuition, not your public behavior.
  3.  **The Scale:** On each card, write a number from **0 to 10**.
      *   **10:** My experience is fully vivid, identical to my current biological state.
      *   **0:** There is "nobody home." Dark inside. No experience at all.
      *   **Consent:** Mark **YES** or **NO** on whether you would allow the procedure to continue to the next stage.

  **Procedure:**
  1.  **Prediction:** Before starting, write your prediction on the provided slip: *"My experience will first drop at Checkpoint #___."* Seal this in the envelope.
  2.  **Simulation:** Read your Clinic's Protocol Sheet. Move through the 5 Checkpoints.
  3.  **Recording:** At each Checkpoint, fill out an index card. Do not discuss your numbers with other patients.
  4.  **Submission:** At the halfway mark (Checkpoint 3 / 50%), stop. Hand your cards to the Facilitator.

  ---

  ## Part 3: Protocol Sheets (One per Clinic)

  **Clinic A: DRIP PROTOCOL**
  *   **Method:** 5% of neural units replaced per round.
  *   **Checkpoint 1 (Round 5):** 25% Synthetic.
  *   **Checkpoint 2 (Round 10):** 50% Synthetic.
  *   **Checkpoint 3 (Round 15):** 75% Synthetic.
  *   **Checkpoint 4 (Round 20):** 100% Synthetic.
  *   **Note:** The transition is continuous. No single step feels significant.

  **Clinic B: SHADOWING PROTOCOL**
  *   **Method:** For each unit, a synthetic surrogate runs *alongside* the organic neuron. Both process the signal. A mixer gradually weights the synthetic output higher and the organic lower.
  *   **Checkpoint 1:** 25% of units are in "Dual-Run" mode (both active).
  *   **Checkpoint 2:** 50% of units in "Dual-Run." At this point, half your brain has double redundancy.
  *   **Checkpoint 3:** 75% of units in "Dual-Run."
  *   **Checkpoint 4:** 100% Synthetic. Organic units powered down.
  *   **Note:** At no point does total processing capacity change.

  **Clinic C: HEMISPHERIC PROTOCOL**
  *   **Method:** Replacement occurs in large blocks under anaesthesia.
  *   **Checkpoint 1:** Left Hemisphere replaced (50%). You wake up for recalibration.
  *   **Checkpoint 2:** Recalibration complete. Function normal.
  *   **Checkpoint 3:** Right Hemisphere replaced (100%). You wake up.
  *   **Checkpoint 4:** Full system integration.
  *   **Note:** Changes are sudden, not gradual. You sleep through the swap.

  ---

  ## Part 4: Minute-by-Minute Timeline

  **00:00 – 00:10 | Setup & Predictions**
  *   Divide into Clinics A, B, C.
  *   Distribute Instructions and Protocol Sheets.
  *   **Action:** Students write their **Sealed Prediction** (which checkpoint experience drops) and place it in the Clinic Envelope.
  *   **Facilitator Script:** "Remember: Your public behavior is fixed. You always say 'I feel fine.' The cards record what you *really* think happens to the light inside. Begin."

  **00:10 – 00:30 | The Simulation (Parallel Work)**
  *   Students read their protocol and fill out 5 index cards (one per checkpoint).
  *   **Facilitator Role:** Circulate. If a student argues "This is impossible," remind them: "We are stipulating functional success. Judge the *experience*, not the engineering."
  *   **At 00:25:** Call "HALT." Collect all cards from Checkpoints 1, 2, and 3 (0% to 50%). Keep Checkpoints 4 & 5 for later.
  *   Collect the Sealed Prediction Envelopes.

  **00:30 – 00:45 | Data Plotting & Reveal**
  *   **Action:** On the whiteboard, draw three axes (Checkpoint 1-3 vs. Experience Score 0-10). Use three colors for the three Clinics.
  *   **Action:** Read the numbers aloud anonymously and plot the averages (or scatter) for each Clinic.
  *   **Observation:** Look for divergence. Does Hemispheric drop faster than Drip? Does Shadowing hold steady?
  *   **Action:** Open the Sealed Predictions. Read a few aloud. "I thought I'd fade at Round 5." "I thought I'd make it to the end."
  *   **Silence:** Allow 2 minutes of silent observation of the board.

  **00:45 – 01:10 | Guided Debrief (The Argument)**
  *   *See detailed script below.*

  **01:10 – 01:30 | Open Discussion & Limitations**
  *   Open floor for objections.
  *   Reveal the philosophical labels (Fading Qualia, Organization Invariance).
  *   Assign reading.

  ---

  ## Part 5: The Debrief Script (Facilitator Guide)

  *Do not lecture. Ask questions that force them to see the trap.*

  **Phase 1: The Divergence (5 Mins)**
  *   **Look at the board.** "Clinic A (Drip) and Clinic C (Hemispheric) ended at the same place (100% synthetic) with the same stipulated behavior. Did your experience scores track the same path?"
  *   *If they diverged:* "If functional organization was held fixed in both, why did the route matter? If the route matters, are you a functionalist? Or does the *history* or *material* matter?"
  *   *If they converged:* "You judged the paths identical. Why? Because the function was identical?"

  **Phase 2: The Accumulation (10 Mins)**
  *   "Look at your cards. Did anyone drop from 10 to 0 in a single step?" (Unlikely).
  *   "You likely dropped small amounts, or stayed at 10. If you stayed at 10 at Round 1, and Round 2 was indistinguishable from Round 1... how can you be 0 at the end?"
  *   "This is the Sorites problem. If no single swap kills the mind, how does the sum of swaps kill it?"

  **Phase 3: The Behavior Stipulation (10 Mins)**
  *   "Some of you wrote '5' or '0' on your cards. You said experience faded."
  *   "But the instructions said: **You still pass the Turing Test. You still say 'I feel fine.'**"
  *   "If you wrote a low number, you are claiming: *I am behaving normally, but my experience is fading.*"
  *   "Is that coherent? If you can't notice the fading (because your tests are normal), in what sense is it fading? And if it fades without you noticing, what work is 'consciousness' doing?"

  **Phase 4: The Labels (5 Mins)**
  *   Now reveal the terms.
  *   "If you kept your line flat at 10, you argued for **Organization Invariance** (Chalmers). Function fixes mind."
  *   "If you let your line drop while behavior stayed fixed, you argued for **Fading Qualia**. You accepted that behavioral evidence can decouple from experience."
  *   "The dilemma: Functionalism requires the flat line. But the flat line requires you to believe a fully synthetic brain is fully conscious. The dropping line saves your intuition that silicon might be 'dark,' but it forces you to admit that consciousness can vanish without any behavioral trace."

  ---

  ## Part 6: Predictable Failures & Troubleshooting

  **1. The "Read Ahead" Students**
  *   **Risk:** A student shouts, "This is the Fading Qualia argument!" in minute 15.
  *   **Fix:** Pre-brief them if possible. If not, intervene immediately. "We are collecting data first. Theoretical labels are banned until the reveal. Please help me enforce that rule."
  *   **Why:** Naming it collapses the intuition pump into a memory exercise.

  **2. The "Behavior Must Change" Objector**
  *   **Risk:** "This is stupid. If you replace my neurons, I *will* act differently. The stipulation is false."
  *   **Fix:** "You are rejecting the premise of the thought experiment. That is a valid engineering objection, but it exits you from the philosophy seminar. For the next 20 minutes, assume the engineer succeeded. *Given* that success, what happens to the mind?"
  *   **Why:** Functionalism *starts* with the assumption of causal role preservation. Denying the possibility denies the field of study.

  **3. Noisy/Performative Numbers**
  *   **Risk:** Students write random numbers or joke ("I'm a zombie, 0").
  *   **Fix:** In the debrief, ignore outliers. "Look at the *trend*, not the noise. Did the average trend down? Did the groups differ?"
  *   **Why:** The argument relies on the *commitment* to a trend, not the precision of the metric.

  **4. "Just Ask the Patient"**
  *   **Risk:** "Why don't we just ask the uploaded mind if it's conscious?"
  *   **Fix:** "We did. The stipulation says they say 'Yes.' Your card records whether you *believe* them. The activity forces you to distinguish between *evidence* of mind and *presence* of mind."

  ---

  ## Part 7: Limitations (What You Must Supply)

  **The Unreproducible Feature:**
  The activity cannot reproduce the **logical impossibility of noticing fading**.
  *   *In the activity:* Students *choose* to lower their score. They are omnipotent judges.
  *   *In the argument:* The subject *cannot* notice the fading. If they noticed, their behavior would change (they would say "I feel dimmer"), violating the functionalist stipulation.
  *   *Your Job:* In the debrief, you must explicitly state: "In your cards, you decided the light faded. But if this happened in reality, *you wouldn't know*. You would still write '10'. The horror of the argument is not that the light fades, but that it could fade *without anyone, including you, ever knowing*. The activity makes it a choice; the philosophy makes it a trap."

  **The "Hard Problem" Gap:**
  The activity assumes "Experience" is intelligible as a scalar (0-10). Some students may reject this (Illusionism, Eliminativism).
  *   *Your Job:* Acknowledge this. "If you think 'experience' is a fiction, you naturally drew a flat line or didn't care. This argument targets those who think consciousness is real but non-behavioral."

  **Final Advice:**
  Trust the silence during the plotting phase. The tension comes from seeing their own intuitions graphed against their peers. Let the graph do the teaching.
