answer: |-
  Look, I hear you. When this stays in the philosophy department, it's a game. When it's your cousin's kid or a bird in your hands, it's real. You want to know if the hardware determines the worth. Here's the blunt truth: **Absolute brain size is moral noise.** It's a bad metric. If you build a theory on grams or cubic centimeters, you will inevitably fail either the microcephaly case or the wildlife case.

  An adequate theory has to separate **moral status** (do you count?) from **moral capacities** (what kinds of choices can you make?). Status must be binary; capacities are scalar. Brain size correlates with neither reliably enough to be the judge.

  Here is the spec for a theory that doesn't break when reality hits it.

  | Requirement | The motivating case or distinction behind it | Your call: non-negotiable or negotiable? | What it rules out if hard | Tension with other rows |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Microcephaly Constraint** | Your cousin's kid must have full moral status despite smaller brain volume. | **Non-negotiable** | Any theory tying basic worth to absolute mass or neuron count thresholds. | Tensions with "Cognitive Scaling" (below); implies status isn't about processing power. |
  | **The Glial Noise Filter** | Large brains (whales/cows) often have high glial support, not necessarily more processing power. | **Non-negotiable** | Theories using absolute mass or volume as a proxy for intelligence or worth. | Forces reliance on harder-to-measure metrics like density or connectivity. |
  | **The Convergent Intelligence Clause** | A crow (small, dense) can outperform a cow (large, less dense) on problem-solving. | **Non-negotiable** | Speciesism based on mammal-vs-bird anatomy; rules out "mammal superiority" based on size. | Requires accepting that different hardware can run similar "software" (consciousness). |
  | **Sentience as Threshold** | The ability to suffer/experience is the baseline for entering the moral community. | **Non-negotiable** | Theories that exclude animals entirely or require rationality for basic rights. | Can be hard to prove empirically in non-verbal subjects (animals or infants). |
  | **Complexity as Weighting** | Connectomic complexity determines *interests* (e.g., autonomy vs. just pain avoidance), not *worth*. | **Negotiable** (but recommended) | Theories that treat all sentient life as having identical interests (e.g., a fly = a human). | Risks sliding back into elitism if not carefully bounded by the Microcephaly Constraint. |
  | **Functional Over Structural** | Moral relevance lies in what the brain *does* (integration), not what it *weighs*. | **Non-negotiable** | Crude anatomical determinism; rules out using head circumference as a moral ruler. | Function is harder to measure than structure, making policy harder to implement. |

  ```json
  {
    "domain": "Neuroethics and Moral Status",
    "committed_position_summary": "Basic moral status is binary based on sentience, not brain metrics. Connectomic complexity weights specific interests (like liberty), but absolute mass is morally irrelevant noise. Human equality must be preserved regardless of neuroanatomical variance.",
    "hardest_conflict_pair": "Microcephaly Constraint vs. Cognitive Complexity Weighting",
    "single_criterion_that_kills_most_theories": "Absolute Brain Mass",
    "confidence_level": "High"
  }
  ```

  Here's the reasoning without the fluff. If you say brain size matters, you have to tell your cousin their kid matters less. That's unacceptable. So size is out. But if you say *nothing* matters, you can't explain why we give humans more autonomy than chickens. That's where **connectomic complexity** comes in. It's about the wiring, not the weight. A crow's brain is packed tighter; it does more with less. A cow's brain is big but mostly support staff (glial cells).

  The hardest conflict you'll face is balancing the idea that "more complexity = more types of rights" (like voting or liberty) without accidentally saying "less complexity = less right to life." You have to keep those two separate. Status is the entry fee (sentience); complexity is the menu of options (capabilities). If you mix them up, you lose the kid or you lose the bird. Stick to that split, and the theory holds.
