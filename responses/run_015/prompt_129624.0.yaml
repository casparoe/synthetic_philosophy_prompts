prompt: |-
  Right, I've been going round in circles since I started volunteering at a wildlife rehab centre and my cousin's kid got diagnosed with microcephaly — suddenly whether brain size is actually morally relevant isn't just abstract pub chat anymore. I want the full spec for what any adequate theory of that has to deliver. Don't just lay out options and sit on the fence; take a committed line on which criterias are hard constraints, which are just camp preferences, and whether any subset is jointly unsatisfiable once you factor in neuroanatomy. The theory's got to distinguish absolute mass, neuron density, and connectomic complexity, and it can't collapse the case of a large-brained but mostly glial-scaled mammal against a small-brained but hyper-dense bird. Give me the desiderata in a table with these exact columns: Requirement | The motivating case or distinction behind it | Your call: non-negotiable or negotiable? | What it rules out if hard | Tension with other rows. Then a brief JSON summary with fields: domain, committed_position_summary, hardest_conflict_pair, single_criterion_that_kills_most_theories, confidence_level. No bibliography, no citations — my phone's dead and I can't check sources anyway. Write it like you're talking to someone who's definatly not an academic but wants the actual reasoning, not a survey.
