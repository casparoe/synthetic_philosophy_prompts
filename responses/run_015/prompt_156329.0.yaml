answer: |-
  You are right to feel backed into a corner, but you are also right that step (6) is false. The error is in step (4). I am highly confident in this diagnosis.

  Step (4) claims that you can handle erosive and preference-perturbing signals by "enlarging the state space" and indexing utility/acts by state, asserting that "the same proof goes through unchanged." **This is false.** It smuggles in assumptions that contradict the definitions of erosive and preference-perturbing signals you provided in the preamble.

  Here is the explicit breakdown of why (4) fails, why (1) is safe but less universal than you think, and what rejecting (4) costs you.

  ### 1. The Failure of "Enlarging the State Space" (Step 4)

  Good's Theorem relies on two structural assumptions that Step (4) violates when it tries to absorb your hard cases.

  **A. The Erosive Case: The "Ignore It" Option Vanishes**
  Good's proof relies on the inequality:
  $$ \sum_s P(s) \max_{a \in A} E[U|s] \ge \max_{a \in A} E[U] $$
  The logic is: *After* seeing signal $s$, you pick the best act from the menu $A$. Since you can always pick the act you would have chosen without the signal, you can't do worse.

  Your definition of **erosive** is: "learning it removes at least one act from the set of things you can do afterwards."
  If the signal $s$ removes acts, the menu is no longer $A$. It is $A_s \subset A$.
  The inequality becomes:
  $$ \sum_s P(s) \max_{a \in A_s} E[U|s] \ge \max_{a \in A} E[U] $$
  This inequality **does not hold**. If the signal removes the specific act that was optimal *ex ante*, and the remaining acts in $A_s$ are sufficiently bad, the expected value of the signal is negative.

  Step (4) tries to fix this by saying "Index acts by state." But if you index the act set by state such that $A_s$ is smaller than $A$, you have admitted that the "ignore it" strategy (choosing the *ex ante* optimal act) is **physically or logically impossible** in that cell. Good's Theorem assumes the feasible set of acts is independent of the information partition. If information constrains action (e.g., you cannot honestly testify you don't know), the theorem's precondition is violated. You cannot "just ignore the signal and do whatever you'd have done anyway" if doing what you would have done is no longer a valid move.

  **B. The Preference-Perturbing Case: Who is Maximizing?**
  Your definition of **preference-perturbing** is: "once you've learned it, you stop wanting what you wanted before."
  Good's Theorem assumes a fixed utility function $U$. The *ex ante* agent calculates value using $U$. The *ex post* agent chooses acts to maximize $U$ (conditional on the signal).

  If the signal perturbs preferences, the *ex post* agent maximizes a *different* utility function, call it $U'$.
  The *ex ante* value of the signal is calculated using $U$.
  The *ex post* choice is made maximizing $U'$.
  Good's proof requires that the *ex post* choice maximizes the *same* function used in the *ex ante* expectation.
  $$ \text{Value} = E_s [ U(\text{choice}_s) ] - U(\text{choice}_{\text{no info}}) $$
  If $\text{choice}_s = \arg\max_{a} E[U'|s]$, there is no guarantee that $U(\text{choice}_s) \ge U(\text{choice}_{\text{no info}})$. The *ex post* agent might happily choose something the *ex ante* agent considers terrible.

  Step (4) tries to patch this by saying "Index utility by state," effectively defining $U_{\text{new}}(s, a)$. This works *only if* the agent continues to maximize the *ex ante* indexed utility function after learning the signal. But if the preference change is real (you *stop wanting* what you wanted), the agent *will not* maximize the *ex ante* function. They will maximize the new one. If you model it as state-dependent utility but assume the agent still optimizes the *ex ante* version, you are modeling a different agent than the one described in your definition. You are assuming away the preference perturbation to save the theorem.

  ### 2. The "Ignore It" Clause is Doing Hidden Work

  You asked if "you can always ignore it" is doing something different from what you think. **Yes.**

  In the standard proof, "ignore it" means: *You can choose the same mapping from signals to acts that you would have chosen without seeing the signal.* (i.e., a constant policy).
  This requires:
  1.  **Feasibility:** The act you wanted to do before is still available after learning. (Violated by erosive signals).
  2.  **Motivation:** You still *want* to do that act after learning. (Violated by preference-perturbing signals).

  If either fails, the "ignore it" option is not a valid strategy in the *ex post* decision problem, so the lower bound of the inequality collapses.

  ### 3. Game Theory and Single-Agent Restrictions

  Your vague memory is correct. In game theory, more information can strictly hurt you.
  *   **Example:** In a bargaining game, knowing your opponent's reservation price might force you into an equilibrium where you reveal your own strength too early, or it might remove your ability to credibly commit to a threat (because the opponent knows you know).
  *   **Mechanism:** This is often due to the **Hirshleifer Effect**. Information can reduce risk-sharing opportunities or destroy strategic ambiguity. If your opponent knows that you know, their best response changes in a way that lowers your payoff.
  *   **Relevance:** This confirms that Step (6) is false even in standard rational agent models, provided there is more than one agent. But even in your single-agent case, the "erosive" and "preference-perturbing" definitions introduce a kind of "internal game" or dynamic inconsistency that breaks the single-agent theorem.

  ### 4. What Rejecting (4) Costs You

  You asked what rejecting (4) costs, specifically regarding belief-dependent preferences.

  **Cost 1: Good's Theorem is Not Universal.**
  You must accept that Good's Theorem applies *only* to **instrumental information** for **stable agents** with **fixed menus**.
  *   It does not apply to information that has **intrinsic disutility** (e.g., sadness, loss of surprise) unless that disutility is modeled as a fixed cost *before* the decision, which contradicts the "preference-perturbing" definition.
  *   It does not apply to information that **constrains future agency** (erosive).

  **Cost 2: Belief-Dependent Preferences Fall Outside the Theorem.**
  Yes. If an agent's utility depends on their beliefs (e.g., $U = \text{Outcome} + \text{Surprise}$), then information changes the belief state, which changes the utility directly, not just via the act chosen.
  *   Standard EU theory treats beliefs as tools to get outcomes.
  *   Belief-dependent preferences treat beliefs as *part of the outcome*.
  *   In this framework, information is a *consumption good*, not just a production input. Like any consumption good, it can have negative marginal utility. Good's Theorem treats information strictly as a production input (it helps you pick better acts). It has no machinery for information as a consumption good that might be "too filling" or "poisonous."

  **Cost 3: You Must Distinguish Ex Ante vs. Ex Post Rationality.**
  If you reject (4), you admit that an agent can be *ex ante* rational to avoid information, even if *ex post* (after receiving it) they maximize their new utility function correctly. This introduces **dynamic inconsistency**. The *ex ante* self and *ex post* self are effectively different agents with different utility functions. You cannot use a theorem designed for a single, consistent maximizer to analyze the relationship between them.

  ### 5. Summary of the Exit

  1.  **Keep (1):** Good's Theorem is mathematically sound *within its assumptions*.
  2.  **Reject (4):** The move to "enlarge the state space" fails because it assumes the agent continues to maximize the *ex ante* utility function over the *ex ante* feasible set after receiving the signal.
      *   For **erosive** signals, the feasible set shrinks, breaking the "ignore it" lower bound.
      *   For **preference-perturbing** signals, the objective function changes, breaking the link between *ex ante* value and *ex post* optimization.
  3.  **Reject (5) and (6):** Since (4) is the bridge to these conclusions, they fall. It is rational to decline genetic tests (if you value hope over preparation) and spoilers (if you value surprise).
  4.  **Confidence:** I am certain. This is a known limitation of Good's Theorem. It is often cited in philosophy of science and decision theory (e.g., by Buchak, or in discussions of the "value of truth") precisely to show that information is not unconditionally good.

  **The Confusion:** The framing rests on a confusion between **information as a tool** (which Good's Theorem covers) and **information as a state-changer** (which it does not). Your definitions of erosive and preference-perturbing explicitly describe information as a state-changer. Step (4) tries to force them back into the "tool" category by mathematical fiat, which is why the conclusion feels wrong. Don't let the math override the definitions.
