answer: |-
  It sounds like you have correctly identified the source of the stalemate, which is that your friends are arguing over policy prescriptions before agreeing on the structure of the problem they are trying to solve. When one side treats every commons as a missing title and the other treats every commons as a market failure requiring state intervention, they are both implicitly adopting models that exclude half the empirical landscape. To break the deadlock, you need a specification sheet that forces both models to account for the features they usually ignore, particularly the distinction between common-pool resources and public goods, and the difference between open access and common property. A common-pool resource is rivalrous, meaning my consumption reduces what is available for you, like fish in a sea or water in an aquifer, whereas a public good is non-rivalrous, like a broadcast signal or national defense. This distinction matters because applying property rights to a non-rivalrous good creates an anticommons problem where fragmentation of exclusion rights prevents efficient use, while treating a rivalrous resource as a public good invites depletion. Furthermore, we must distinguish open access, where no one has rights and everyone can enter, from common property, where an identifiable community holds rights and manages entry. Many theories collapse these into one another, assuming that without state titling there is only open access, which contradicts the historical record of self-governing communities.

  With those distinctions in place, we can outline the desiderata that any adequate solution must meet, starting with incentive compatibility. Any governance mechanism must align the individual rationality of appropriators with the collective good, meaning that following the rules must be more beneficial than cheating, given the probability of detection and punishment. This is non-negotiable because if the system relies on altruism alone, it will collapse under pressure from rational defectors. Closely related is the requirement for defined boundaries, not necessarily in the legal sense of privatization, but in the social sense of knowing who is authorized to use the resource and who is an outsider. Without this, you cannot distinguish between a community managing a commons and an open-access free-for-all, and you cannot protect the resource from external encroachment. A third requirement is low-cost monitoring and enforcement. The cost of verifying compliance and sanctioning violators must be low enough relative to the resource value that the system does not consume itself in administrative overhead. This is where many state solutions fail, as centralized monitoring often lacks local knowledge, and where privatization fails, as patrolling vast oceanic boundaries is prohibitively expensive.

  We also need a requirement for adaptability to dynamic conditions, ensuring the rules can change when population, technology, or resource stocks shift without requiring a complete systemic overhaul. Static rules break when discount rates are high or when external shocks occur, so the governance structure must allow for iterative learning rather than one-shot imposition. Additionally, the solution must be robust to asymmetry among users. In many real-world cases, appropriators are not symmetric; some have larger boats, deeper pockets, or more political influence. A viable solution cannot assume equal power, or it will inevitably be captured by the largest appropriators who rewrite the rules to their benefit. Finally, and perhaps most critically for your debate, there is an empirical consistency requirement. Any theory of commons governance must be consistent with the existence of long-lived, self-governing common-pool resources that have survived for centuries without state intervention or privatization, such as the Swiss alps or Japanese irrigation villages. If a theory claims such institutions are impossible or unstable, the theory is falsified by the historical record, regardless of its elegant logic.

  When we scrutinize these requirements, some turn out to be genuine constraints while others are disguised ideological preferences. Incentive compatibility and empirical consistency are non-negotiable; a solution that people will not follow or that contradicts observed reality is useless. However, the demand for universal excludability via private titles is often a prejudice of the property-rights camp smuggled in as an adequacy condition, assuming that transaction costs are low enough to parcel out every resource. Conversely, the assumption that a central authority possesses sufficient knowledge to set optimal caps is a prejudice of the state camp, ignoring the information problems highlighted by Hayek. There are also genuine impossibility results to consider, drawn from mechanism design. You generally cannot simultaneously achieve efficiency, budget balance, and voluntary participation in a decentralized setting. Similarly, there is a tension between scale and local knowledge; a solution that works for a local fishery often fails for climate change because the monitoring costs and asymmetry of actors scale differently than the resource itself. This suggests that no single governance mode is universal, and the search for a general fix is itself a category error.

  If we score the three main approaches against these criteria, privatization-style solutions perform well on incentive compatibility and boundary definition where exclusion is technologically feasible, but they fail badly on monitoring costs for fluid resources like air or water and often create anticommons fragmentation when applied to non-rival goods. They also struggle with empirical consistency, as they cannot account for successful non-proprietary commons without dismissing them as anomalies. Centralized regulation scores highly on boundary definition and handling asymmetric power through fiat, but it typically fails on monitoring costs and adaptability because central planners lack local information and cannot adjust rules quickly enough to changing conditions, leading to brittle systems that collapse under stress. Polycentric self-governance, following the Ostrom line, scores highest on empirical consistency and adaptability, as it leverages local knowledge and iterative rule-making, but it faces significant challenges with scale and external enforcement, often requiring some higher-level coordination to protect the community from outsiders or to manage resources that span multiple jurisdictions. Ultimately, the specification suggests that the right answer depends on the specific topology of the resource, the technology of exclusion, and the social capital available, rather than a universal principle of either market or state.
