answer: |-
  **The Solipsistic Harmony of Moore's Goods: Consistency at a Cost**

  In *Principia Ethica*, G.E. Moore attempts a delicate balancing act. On one hand, he argues that "good" is a simple, non-natural property that cannot be defined (anti-naturalism). On the other, he claims that the things possessing this property are often complex "organic unities," where the value of the whole differs from the sum of its parts. His famous conclusion—that the greatest intrinsic goods are "the pleasures of human intercourse and the enjoyment of beautiful objects"—invites the tension your professor highlighted. If friendship is an organic unity involving two people, does the value reside in the relation or the individuals? If beauty requires an observer, does value depend on natural mental states?

  By analyzing the structural role of consciousness in Moore's system, specifically through the edge cases of aesthetic isolation and "blind" friendship, we can determine whether Moore's position is consistent. The conclusion is that Moore *can* consistently hold both friendship and beauty as intrinsic goods under the principle of organic unities, but only by effectively internalizing them. To save his system, he must treat friendship not as a genuine relation between persons, but as a specific state of consciousness within a single mind. This preserves his logical consistency but undermines the intuitive relational nature of friendship, suggesting that Moore's "greatest goods" are ultimately solipsistic experiences.

  **The Structure of Organic Unities**

  To understand the tension, we must first clarify Moore's principle of organic unities. Moore argues that the intrinsic value of a whole is not necessarily proportional to the sum of the values of its parts. A part may have zero value in isolation but be essential to a valuable whole.

  Moore applies this rigorously to beauty. He argues that a beautiful object existing in a universe without a conscious observer has no intrinsic value. The value arises only in the *whole* constituted by the beautiful object *plus* the consciousness of that object. Crucially, the value does not reside in the object (natural) nor solely in the consciousness (natural), but supervenes on the combination. However, since the object alone is valueless, the locus of value is heavily weighted toward the *conscious experience*.

  **Friendship as Aesthetic Experience**

  The professor's hint suggests a conflict: if friendship is an organic unity, perhaps the individuals involved lack value in themselves, contradicting Moore's emphasis on individual consciousness and pleasure. However, Moore resolves this by defining "the pleasures of human intercourse" not as the biological existence of friends, but as the *consciousness* of loving and being loved.

  Here, Moore treats friendship structurally identical to aesthetic appreciation. In the case of beauty, the "whole" is [Consciousness + Beautiful Object]. In the case of friendship, the "whole" is [Consciousness of Person A + Existence/Consciousness of Person B].

  If we accept Moore's definition, the "organic unity" of friendship does not require the *other* person to have intrinsic value for *my* friendship to be good. My friendship is valuable because *my* state of mind (loving, appreciating) directed at an appropriate object (another person) constitutes a valuable whole. The other person's intrinsic value is derived from their *own* states of consciousness, not from their role in my unity.

  This addresses the first half of the tension. Moore does not need to claim that individuals are valuable merely as parts of a friendship. They are valuable as containers of their own consciousness. Therefore, listing friendship as an intrinsic good does not contradict the value of individual consciousness; it relies upon it.

  **The Edge Cases: Isolation and Blindness**

  The true test of this consistency lies in the edge cases you proposed: the isolated aesthete versus the blind friend.

  Consider the person experiencing perfect aesthetic rapture in total isolation. For Moore, this is a high-value organic unity. The object (perhaps a mental image or a natural scene) combined with the intense appreciation creates a valuable whole. The isolation is irrelevant because the "other" in the unity is the object, not necessarily another mind.

  Now consider the person with deep friendships who is totally blind to beauty. They possess the "pleasures of human intercourse." They have the appropriate emotional states directed at other people.

  Does the isolation case break the organic unity claim for friendship? It does not, provided we accept Moore's reduction of friendship to a mental state. If friendship is valuable because of the *emotion* directed at a person, then the isolated aesthete is valuable because of the *emotion* directed at an object. The structural parallel holds. The isolation case actually reinforces Moore's view: it proves that the *relation* itself isn't the source of value, but rather the *consciousness of the relation*.

  If Moore were forced to admit that the *actual reciprocity* of the friend was necessary for the value (i.e., if the friend didn't love me back, my friendship loses value), he would run into trouble. But Moore explicitly argues that the value lies in the *appropriate emotion*, even if the object is unworthy or unaware (though the value is greater if the object is worthy). Thus, the isolated aesthete and the blind friend both possess valuable states of consciousness. The "organic unity" is internal to the subject's experience of the world, not a metaphysical web connecting distinct souls.

  **Anti-Naturalism and the Observer**

  This brings us to the second tension: beauty's dependence on an observer versus Moore's anti-naturalism. Your concern is that if value requires a mental state, isn't value naturalistic?

  Moore's anti-naturalism claims that 'good' cannot be *defined* as 'pleasure' or 'consciousness.' However, he admits that good *supervenes* on natural properties. The existence of a conscious observer is a natural fact. The *goodness* that attaches to that fact is non-natural.

  There is no logical contradiction here. Moore can consistently say, "Value always requires a mind (dependence), but value is not the same thing as a mental state (anti-naturalism)." The tension is not logical, but metaphysical. By making consciousness a necessary condition for *all* intrinsic value (since even beauty requires an observer), Moore makes the universe's value dependent on the existence of minds.

  However, this does not break his system. It simply means that in a universe without consciousness, there is no good, even if beautiful objects exist. This is consistent with his ideal utilitarianism. The "clash" is only felt if one assumes anti-naturalism requires value to exist independently of minds (like Platonic forms), but Moore's value is property-like, attaching to natural states of affairs.

  **Conclusion: Consistency via Internalization**

  So, can Moore consistently hold both friendship and beauty as intrinsic goods given his organic unity principle? **Yes, but at a significant philosophical cost.**

  Moore maintains consistency by treating both friendship and beauty as species of the same genus: **valuable states of consciousness.** He avoids the tension between individual value and organic unity by locating the value of friendship not in the *mutual relation* between two people, but in the *individual's conscious experience* of that relation.

  This leads to the conclusion you suspected: Moore effectively treats these goods as **simple properties of complex mental states**, rather than relational properties of people or objects.
  1.  **Regarding the Edge Cases:** The isolation case does not break the claim for friendship because, for Moore, the "friendship" good is the *love felt*, not the *bond shared*. The isolated aesthete and the blind friend are in the same metaphysical boat: both possess a mind correctly oriented toward an object.
  2.  **Regarding Anti-Naturalism:** There is no clash, provided we understand that dependence on a mind is not the same as definition by a mind.

  However, the "hidden tension" your professor noted reveals a vulnerability. By resolving the organic unity of friendship into a state of individual consciousness, Moore strips friendship of its essential mutuality. In *Principia Ethica*, my friendship with you is valuable primarily because of what is happening in *my* head, not because of what is happening *between* us.

  Therefore, Moore's system is logically consistent, but it achieves this consistency by **solipsizing the goods**. He saves the organic unity principle by making the "whole" a mental whole within a single subject. If you are willing to accept that the "pleasures of human intercourse" are really just "the pleasure of contemplating humans," Moore holds together. If you insist that friendship requires a genuine, irreducible relation between two distinct valuers, Moore's system fractures. Given his commitment to consciousness as the sole vessel of value, Moore must—and does—choose the former. He remains consistent, but friendship becomes just another form of aesthetic appreciation, and the "other" in the relationship becomes merely the necessary object for the subject's valuable state.
