answer: |-
  **Project Title:** The Systemic Glyph: Testing Inter-Glyph Contracts in the Letter Spirit Problem
  **Duration:** 12 Weeks
  **Format:** Workshop Proposal

  ### 1. The Core Question
  The "Letter Spirit" problem (Hofstadter) asks: What allows us to recognize a glyph as a specific letter across radically different stylistic implementations? Traditional cognitive models answer this via **intrinsic features**: either through *family resemblance* (clustering shared visual traits) or *geometric prototypes* (matching against an idealized mental schema).

  This proposal challenges the assumption that letter identity is intrinsic. I posit that letter identity is **relational**. A glyph is an 'a' not merely because of its shape, but because it fulfills specific "inter-glyph contracts"—structural and stylistic obligations it owes to the other letters in its immediate system (e.g., maintaining counter-space equilibrium with the 'o', stroke-weight reciprocity with the 'n', x-height alignment with the 'H').

  **Research Question:** To what extent is letter identity dependent on systemic coherence rather than intrinsic morphology? Can a glyph violate its shape prototype so long as it honors its relational contracts, and vice versa?

  ### 2. Critique of Intrinsic-Feature Accounts
  Current models treat letters as isolated objects to be classified.
  *   **Family Resemblance:** Fails to explain why a highly distorted 'a' is legible in one typeface but an identical shape is unreadable in another. It accounts for similarity but not *fit*.
  *   **Geometric Prototypes:** Fails to account for stylistic deformation. If identity were purely prototype-matching, display typefaces that intentionally break geometric norms (e.g., stencil, ligature-heavy, or deconstructed fonts) should fail recognition more often than they do.

  Both models ignore the **contextual field**. They assume an 'a' carries its identity with it like a passport. My hypothesis suggests identity is more like a citizenship: it is granted by the surrounding system.

  ### 3. Methodology (12-Week Schedule)

  **Phase 1: Forensic Analysis (Weeks 1–4)**
  *   **Task:** Select 8–10 extreme display typefaces (ranging from high-contrast Didones to deconstructed brutalist fonts).
  *   **Action:** Perform a "close reading" of the lowercase 'a' in each. Map its intrinsic features (shape, weight) against its relational features (how its counter compares to the 'e', how its shoulder matches the 'n').
  *   **Goal:** Identify recurring "contract types." Do successful fonts maintain specific ratios between glyphs even when the shapes themselves are unrecognizable?

  **Phase 2: The Contract-Breaking Intervention (Weeks 5–8)**
  *   **Task:** Design a minimal "test alphabet" (5 key glyphs: a, n, o, H, g) based on a coherent style.
  *   **Action:** Create two variations:
      1.  **Intrinsic Violation:** A glyph that breaks its shape prototype but honors the system's contracts (e.g., an 'a' that looks like a 'u' but matches the stroke weight and contrast of the 'n').
      2.  **Relational Violation:** A glyph that matches the shape prototype perfectly but violates the system's contracts (e.g., a perfect geometric 'a' inserted into a high-contrast script where it disrupts the flow).
  *   **Testing:** Informal user testing (n=20) to measure recognition speed and "stylistic coherence" ratings.

  **Phase 3: Synthesis and Taxonomy (Weeks 9–12)**
  *   **Task:** Analyze the data from Phase 1 and 2.
  *   **Action:** Draft a preliminary taxonomy of Inter-Glyph Contracts (e.g., *The Counter Contract*, *The Terminal Contract*, *The Weight Distribution Contract*).
  *   **Deliverable:** A 15-page position paper + the designed test glyphs.

  ### 4. Expected Results
  *   **Primary:** A taxonomy of 3–5 distinct "contract types" that define how glyphs relate to one another within a family.
  *   **Secondary:** Evidence that "Relational Violations" cause more cognitive friction (slower reading/rejection) than "Intrinsic Violations," suggesting the brain prioritizes system coherence over shape matching.
  *   **Tertiary:** A designed artifact (the test alphabet) demonstrating that a letter can be "broken" by isolation even if its shape is perfect.

  ### 5. Conditions for Failure
  This project fails if:
  1.  **Shape Dominance:** User testing shows that the "Relational Violation" (perfect shape, wrong context) is recognized faster and more accurately than the "Intrinsic Violation" (wrong shape, right context). This would prove intrinsic features are the primary driver of identity.
  2.  **Explanatory Redundancy:** If every "contract" I identify can be fully reduced to a shared intrinsic feature (e.g., "The Counter Contract" is just "all shapes must have holes of size X"), then the relational theory adds no new explanatory power.
  3.  **Universal Legibility:** If the "Intrinsic Violation" glyphs are universally unreadable regardless of context, it suggests there is a hard geometric floor that relations cannot overcome.

  ### 6. Honest Assessment: What Would Change My Mind?
  I am proposing that context dictates identity. To abandon this for a pure family-resemblance or prototype model, I would need to see one of the following formal results:

  **A. The "Hostile Context" Counter-Example**
  If I can demonstrate a glyph that violates *every* conceivable relational contract of a typeface (wrong weight, wrong x-height, wrong contrast, wrong slant) yet is still instantly and universally recognized as its letter *specifically because of its shape*, the relational theory collapses.
  *   *Specific Test:* Insert a standard Helvetica 'a' into a blackletter text. If readers identify it as 'a' immediately without hesitation, despite it breaking every stylistic contract of the surrounding text, then intrinsic shape is sufficient for identity, and relations are merely aesthetic preferences, not identity conditions.

  **B. The "Perfect Fit" Imposter**
  If I can design a glyph that fulfills all relational contracts of a font (matches weight, contrast, spacing) but is structurally a different letter (e.g., a modified 'd' designed to fit an 'a' slot), and users consistently read it as the intended letter ('a') *solely* due to context.
  *   *Why this changes my mind:* Actually, this would *support* my theory. To *change* my mind, the opposite must happen: If the glyph fits all contracts but users *still* read it as a 'd' because of its shape, then shape overrides contract. I need to see that shape is the "hard" constraint and contract is the "soft" constraint.

  **C. Predictive Modeling**
  If a machine learning model trained *only* on intrinsic geometric features (isolated glyphs) achieves 95%+ accuracy in classifying letter identity across styles, and adding relational data (neighboring glyphs, font metrics) improves accuracy by less than 1%, then the relational hypothesis is statistically negligible. It would imply that while humans *like* consistency, we don't *need* it for identification.

  **D. The "Orphan" Success**
  If single glyphs extracted from highly systemic fonts (where the letter relies heavily on its neighbors for style) are presented in isolation and retain their stylistic identity without confusion. If a letter's "spirit" survives total isolation, then the spirit was intrinsic all along, not contractual.
