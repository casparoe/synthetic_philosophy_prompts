  Based on Marcos's track record, he is applying a filter that distinguishes between **evolutionary processes** and **convergent solutions** or **static artifacts**. His "No" verdicts (Sound Change, Hospital Protocols, Keyboard Layouts) all share a specific flaw: they lack a *blind competitive lineage*. Sound changes and hospital routines are reinvented from scratch due to physics or data (convergence), while the keyboard layout persists due to lock-in (inertia), not competitive fitness. His "Yes" verdicts (Chain Emails, Jingles, Rituals, Fashion) all involve units that spread via imitation, vary imperfectly, and compete for space.

  Here are the two candidate rules that fit his record equally well but diverge on your new cases.

  ### Candidate Rule 1: The "Darwinian Algorithm" Criterion
  **Definition:** A phenomenon is a meme only if it constitutes a population of variants subject to **Variation** (imperfect copying), **Heritability** (descent from ancestors), and **Selection** (differential survival based on the variant's properties). Crucially, the selection pressure must be internal to the cultural ecosystem (e.g., catchiness, social signaling), not external lock-in or rational optimization.
  *   **Key Constraint:** If there is no competition between variants, or if the variation is zero, it is not a meme. Drift (random change without selection) is insufficient.

  ### Candidate Rule 2: The "Phylogenetic Lineage" Criterion
  **Definition:** A phenomenon is a meme if it exhibits **Descent with Modification**. It must be copied from a predecessor (not reinvented from data/physics) and allow for some accumulation of changes (errors or tweaks) over time.
  *   **Key Constraint:** Unlike Rule 1, this rule does **not** require competitive selection. A lineage that persists through neutral drift (random errors accumulating without one version outcompeting another) still counts. However, it requires the "unit" to be identifiable enough to track the lineage.

