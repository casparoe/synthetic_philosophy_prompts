  ### Predictions on Your New Cases

  #### 1. The Boat-Building Tradition
  *   **The Case:** Tacit knowledge, apprenticeship, cumulative improvement, but the winning design is selected for *teachability*, not *performance*.
  *   **Rule 1 (Darwinian Algorithm): YES.**
      *   *Reasoning:* There is Variation (guessing/trying), Heritability (apprenticeship), and Selection (the teachable design outcompetes the high-performance one). The fact that it selects for *transmissibility* rather than *utility* is classic memetic behavior (like a chain email).
  *   **Rule 2 (Phylogenetic Lineage): NO.**
      *   *Reasoning:* The "unit" is ill-defined. Marcos's record suggests he requires a identifiable replicator. Since "nobody could ever say what the design is" and copying relies on guessing rather than a template, the fidelity is too low to establish a clear lineage. It looks more like a skill (regenerated) than a meme (copied).

  #### 2. The Keyboard-Style Standard
  *   **The Case:** Copied perfectly, never varies, never improves.
  *   **Rule 1 (Darwinian Algorithm): NO.**
      *   *Reasoning:* There is no Variation. Without variation, selection cannot act. It is a static artifact, not an evolving population. (Matches the original Keyboard verdict).
  *   **Rule 2 (Phylogenetic Lineage): NO.**
      *   *Reasoning:* There is no Modification. "Descent with Modification" requires errors or tweaks to accumulate. Perfect fidelity creates a clone, not a lineage.

  #### 3. The Monastery's Rule
  *   **The Case:** Copy letter-for-letter, *never correct* errors.
  *   **Rule 1 (Darwinian Algorithm): NO.**
      *   *Reasoning:* While Variation exists (uncorrected errors accumulate), there is no Selection. The rule explicitly forbids correcting errors (selection against bad copies) or choosing better versions. It is a system of pure drift/storage, not evolution.
  *   **Rule 2 (Phylogenetic Lineage): YES.**
      *   *Reasoning:* It has Descent (copying) and Modification (accumulated errors). The lack of selection is irrelevant; the historical lineage of the text is traceable and evolving via drift.

