  ### The Cleanest Extra Case for Next Week
  To force these rules apart definitively (specifically to test if **Selection** is required or if **Lineage/Drift** is enough), put this case to him:

  **The "Photocopied Zine" Case:**
  > "A group of friends passes a handwritten notebook around. Each person copies the previous pages exactly but adds one doodle or typo in the margin before passing it on. They keep every version in a box. No one ever throws a version away, no one chooses a 'best' version, and they never try to fix the typos. Over ten years, the notebook mutates wildly."

  *   **Rule 1 (Darwinian) predicts: NO.** (There is Variation and Heritability, but **no Selection**. No variant outcompetes another; they are all kept. It is drift, not evolution).
  *   **Rule 2 (Lineage) predicts: YES.** (There is Descent with Modification. The history is traceable).

  If Marcos says **NO**, he is a strict Darwinian (Selection is required). If he says **YES**, he is a Phylogeneticist (Lineage is enough). This bypasses the "rational design" confounder of the Monastery case by making the modification accidental and the storage neutral.
