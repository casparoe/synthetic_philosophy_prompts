answer: |-
  This is a sophisticated pedagogical challenge. You want to move the group from abstract theory to embodied experience, specifically targeting Michael Walzer's concept of "Dirty Hands" (the idea that a political leader *must* sometimes do wrong to do right, and that the guilt is the proof of their morality).

  Here is a complete 75-minute session plan designed to manufacture that specific tension without naming it until the end.

  ### Session Title: "The Heritage Block Protocol"
  **Time:** 75 Minutes
  **Participants:** 10
  **Theme:** Crisis Management (The "Dirty Hands" theme is hidden)

  ---

  ### Part 1: Setup & Briefing (15 Minutes)

  **1. The Hook (5 mins)**
  Do not mention political theory. Frame this as a crisis simulation.
  *   **Script:** "Welcome. Today we aren't discussing texts. We are the Steering Committee of a Student Housing Co-op. We have a real-time crisis. You have 25 minutes to reach a binding decision. If you fail to reach a 2/3 majority vote by the deadline, the default outcome triggers automatically."
  *   **The Stakes:** Hand out a one-page "Situation Report."
      *   *The Crisis:* A sudden fire safety inspection has condemned the building's electrical system.
      *   *The Deadline:* 5:00 PM today (in 25 mins).
      *   *Option A (The Clean Hands):* Refuse the inspector's waiver. The building is condemned immediately. Everyone is evicted. You sue the city (10% chance of winning in 2 years).
      *   *Option B (The Dirty Hands):* Sign the waiver. The building stays open. **However**, the waiver requires deregulating the "Annex" (15% of units). These tenants lose security of tenure and can be evicted with 2 weeks' notice if *any* safety issue arises.
      *   *The Catch:* The Annex tenants are the lowest income and most vulnerable. The rest of the block is secure.

  **2. Role Assignment (10 mins)**
  Hand out sealed envelopes. There are 10 roles. Ask them to read silently. No sharing the full text of their card, only arguing their position.

  *   **Role 1: The Chair.** You facilitate. You only vote to break a tie. You are tired and just want a decision.
  *   **Role 2: Legal Officer.** You know Option B is legally binding. Option A is a legal gamble. You must emphasize the risk of losing the lawsuit.
  *   **Role 3: Finance Lead.** If everyone is evicted (Option A), the Co-op goes bankrupt. If Option B, we survive financially.
  *   **Role 4: Annex Rep.** You live in the vulnerable units. You must argue against Option B fiercely. You feel betrayed.
  *   **Role 5: Main Block Rep.** You live in the secure units. You want to save the building, but you feel uneasy about sacrificing the Annex.
  *   **Role 6: Maintenance Head.** You know the electrical risk is real. If we don't sign, there is a fire risk. If we sign, the Annex is at higher risk.
  *   **Role 7: Comms Officer.** You are worried about the press. "Co-op Sacrifices Poor Students" is a bad headline. But "Co-op Collapses" is worse.
  *   **Role 8: Union Ally.** Your instruction is: "Principles matter more than outcomes. If we sacrifice the Annex, we break solidarity."
  *   **Role 9: The Pragmatist.** Your instruction: "Perfection is the enemy of the good. Save the 85%."
  *   **Role 10: The Scribe.** You do not vote. You must write down the *justification* the group agrees on for the decision. This text will be made public.

  ---

  ### Part 2: The Decision Phase (25 Minutes)

  **Rules:**
  1.  **Hard Stop:** At exactly 25 minutes, voting closes.
  2.  **Threshold:** You need 7 out of 9 voting members (2/3 majority) to pass Option B. Otherwise, Option A triggers.
  3.  **No Abstentions:** You must vote Yes (Option B) or No (Option A).
  4.  **Time Calls:** You (the facilitator) call out "10 minutes remaining" and "2 minutes remaining."

  **Facilitator Note:** Do not intervene in the argument. Let it get uncomfortable. If they try to find a "Option C" (magic solution), remind them: *The inspector is waiting. There is no Option C.*

  ---

  ### Part 3: The Vote & Reveal (5 Minutes)

  1.  **The Vote:** Conduct a show of hands. Record the result.
  2.  **The Reveal:** Hand out a second slip of paper titled **"Post-Mission Analysis."**
  3.  **The Text:** On this paper, print a short excerpt from Michael Walzer's *Political Action: The Problem of Dirty Hands* (approx. 150 words).
      *   *Suggested Excerpt:* "It is not enough that the politician should be ready to do the dirty deed. He must also be prepared to bear the burden of guilt... The guilt is not a sign of weakness; it is the proof that he has not lost his moral compass. To do it without guilt is to become a tyrant."
  4.  **Instruction:** "Read this silently. Do not discuss yet."

  ---

  ### Part 4: The Debrief (30 Minutes)

  This is where you connect the simulation to your experience and the theory. Do not lecture; ask questions.

  **Phase 1: The Somatic Check (5 mins)**
  *   "Keep your role cards hidden. How does your body feel right now? Tight chest? Adrenaline? Relief?"
  *   "Those who voted for the Waiver (Option B): Raise your hand. Keep it up if you feel 'gross' or 'uneasy' about it."
  *   "Those who voted for Condemnation (Option A): Keep your hand up if you feel 'righteous' or 'clean'."

  **Phase 2: The Moral Residue (10 mins)**
  *   *Ask the 'Gross' voters:* "If you had to do this again tomorrow, would you make the same choice?" (Likely yes). "So why do you feel bad?"
  *   *Ask the 'Righteous' voters:* "The 85% of the building are now homeless because of your vote. How do you justify that to the Finance Lead?"
  *   *Key Point to Drive Home:* "The guilt you feel isn't a mistake. It's the cost of the decision. If you didn't feel it, you wouldn't be fit to make the call."

  **Phase 3: Connecting to Reality (10 mins)**
  *   *Here you disclose your own situation.*
  *   "I designed this because I recently had to make a choice like Option B on our Tenants Committee. We accepted a shady eviction compromise to stop a total sale. I feel gross about it. I'd probably do it again."
  *   "Walzer argues that in politics, we don't get to keep our hands clean. The 'lingering guilt' is actually a safety mechanism. It stops us from doing it *too often*. It reminds us that the 'dodgy' thing is still wrong, even if it was necessary."

  **Phase 4: Closing Thought (5 mins)**
  *   "The danger isn't making the dirty choice. The danger is starting to believe it was the *right* choice. The guilt keeps us honest."

  ---

  ### What Will Likely Go Wrong (And How to Fix It)

  **1. The "Magic Solution" Trap**
  *   **Risk:** The group will spend 20 minutes trying to invent Option C (e.g., "Can we crowdfund the repairs?").
  *   **Fix:** You must be the "Inspector." If they propose a solution, say: "That takes 3 months. The deadline is 5 PM. Yes or No on the waiver." Be ruthless.

  **2. The Gamification of Suffering**
  *   **Risk:** The person playing "Annex Rep" might treat it as a game, or the group might sacrifice them too easily because "it's just a role."
  *   **Fix:** In the debrief, press hard on the Scribe's notes. "Read the justification you wrote. Does it sound like you care about the people you sacrificed, or does it sound like corporate speak?"

  **3. Dominant Voices**
  *   **Risk:** The "Pragmatist" or "Chair" steamrolls the "Annex Rep."
  *   **Fix:** During the simulation, if someone hasn't spoken, pause and say: "Legal Officer and Annex Rep, I need to hear from you specifically before we vote."

  **4. The "Clean" Victory**
  *   **Risk:** They vote Option A (Condemnation) to feel morally superior.
  *   **Fix:** This is actually a great outcome for the debrief. Ask: "You saved your conscience, but you lost the building. Is politics about keeping your soul clean, or keeping people housed?"

  ---

  ### Limitations: What This Exercise Cannot Reproduce

  You need to explicitly state these limitations in the debrief so they don't dismiss the exercise as "just a game."

  **1. The Weight of Consequences**
  *   **The Gap:** In the room, no one actually loses their home. The "gross" feeling is simulated.
  *   **The Explanation:** "In this room, the guilt fades when we leave for the pub. In reality, that guilt stays with you for months. You have to trust that the real guilt is heavier, but the *mechanism* is the same. The fact that you feel bad *now* proves the mechanism works."

  **2. The Information Asymmetry**
  *   **The Gap:** In the game, they know the probabilities (10% chance of winning lawsuit). In reality, you never know if the compromise was actually necessary.
  *   **The Explanation:** "Real dirty hands are messier. You never know for sure if the 'greater good' will actually happen. You have to act on faith. That makes the guilt harder to carry."

  **3. The Power Dynamic**
  *   **The Gap:** In the game, they are peers. In your committee, you have a vote, but there are power dynamics (landlords, lawyers, vulnerable tenants) that aren't fully captured.
  *   **The Explanation:** "This exercise assumes we are equals. Real politics involves power imbalances. That makes the 'dirty' choice even more dangerous, which is why holding onto the guilt is even more critical."

  ### Facilitator Cheat Sheet (For your pocket)

  *   **If they ask about the theme early:** "Focus on the decision. We'll discuss the theory after."
  *   **If the vote is unanimous:** "That's suspicious. Did you really debate, or did you just conform? Walzer says if it feels easy, you're probably missing the moral cost."
  *   **If someone cries/gets upset:** Pause. Acknowledge the emotion. "This is why the theory matters. It's not abstract."
  *   **Key Quote to keep handy:** "The problem of dirty hands is not that we have to do wrong, but that we have to live with having done it." (Paraphrasing Walzer).

  This structure validates your feeling without making the session about *you*. It makes your guilt a case study in political ethics, transforming your "gross" feeling into a professional asset.
