prompt: |-
  I've just been elected as a rep on our uni tenants comittee and last week I had to back a pretty shady compromise on evictions to stop the whole block being sold off, and I feel gross about it but I'd probably do it again. I'm leading our politics reading group next month, 10 of us for about 75 mins, and I want them to get why that lingering guilt might be doing real moral work rather than just me being squeamish. Could you design a role-play where small teams have to authorise something dodgy to secure a bigger good, without telling them upfront it's about dirty hands, with time pressure so they actually have to make the decison instead of just theorising about it? I need clear roles, how the vote works, and a debrief that connects what happened in the room to the problem, plus what'll likely go wrong on the night and which bit of the idea the exercise can't really reproduce and I'll just have to explain.
reasoning: |-
  Here's a thinking process that leads to the suggested role-play exercise:

  1.  **Analyze the Request:**
      *   **User:** Newly elected university tenants' committee rep.
      *   **Situation:** Backed a "shady compromise" on evictions to save the block from being sold. Feels gross but would do it again.
      *   **Goal:** Lead a politics reading group (10 people, 75 mins). Wants to explore the concept of "dirty hands" (lingering guilt as moral work) without preaching.
      *   **Format:** Role-play exercise. Small teams, time pressure, authorize something dodgy for a bigger good.
      *   **Constraints:** Don't reveal the theme ("dirty hands") upfront. Need clear roles, voting mechanism, debrief connecting to the theory, potential pitfalls, and limitations of the exercise.

  2.  **Deconstruct the Core Concept ("Dirty Hands"):**
      *   Origin: Machiavelli, Weber (*Politics as a Vocation*), Walzer (*Political Action: The Problem of Dirty Hands*).
      *   Core Tension: Moral absolutism vs. consequentialist necessity in leadership.
      *   Key Insight: The guilt *is* the proof of morality. If you don't feel bad, you're dangerous. If you feel bad but do it anyway, you're a leader.
      *   User's specific feeling: "I feel gross... but I'd probably do it again." This is the exact Walzerian sweet spot.

  3.  **Design the Role-Play Scenario:**
      *   *Requirement:* Needs to feel high stakes, time-pressured, and involve a "dodgy" trade-off.
      *   *Idea 1:* Trolley problem variant. (Too abstract/philosophical, people will theorize).
      *   *Idea 2:* Emergency budget crisis. (Good, but maybe too dry).
      *   *Idea 3:* A crisis involving safety vs. rights. (Stronger emotional resonance).
      *   *Selection:* **"The Blackout Protocol."** A student housing cooperative faces an immediate threat (fire safety inspection/condemnation) that will displace everyone. To pass, they need to exclude a vulnerable subgroup or hide a violation. Let's make it about *excluding* someone to save the group, mirroring the eviction compromise.
      *   *Refinement:* Let's make it about *funding*. A grant is available but requires firing a popular staff member or ignoring a safety violation. Let's go with **ignoring a safety violation** to keep rents low and prevent mass eviction. It mirrors the user's experience closely.
      *   *Scenario:* "The Heritage Block." A beloved student co-op is facing a sudden code enforcement order. If they don't certify compliance by 5 PM, the building is condemned (everyone out). The only way to certify is to sign off on a waiver that effectively removes protections for the sub-basement units (where the most vulnerable students live).
      *   *Twist:* They don't know it's about "dirty hands." They think it's about crisis management.

  4.  **Structure the Session (75 Minutes):**
      *   Intro & Setup (10 mins)
      *   Role Assignment & Briefing (5 mins)
      *   Negotiation/Decision Phase (25 mins) - *Crucial: Time pressure.*
      *   The Vote (5 mins)
      *   Debrief (30 mins) - *This is where the learning happens.*

  5.  **Develop Roles (10 People):**
      *   Need a mix of perspectives: Pragmatists, Idealists, Affected Parties, Outsiders.
      *   1 Chair (facilitator within the group, has casting vote).
      *   3 "Safety/Compliance" (focused on rules/legal).
      *   3 "Tenant Reps" (focused on solidarity/no one left behind).
      *   2 "Finance/Strategy" (focused on survival of the whole).
      *   1 "Observer" (actually a plant to take notes on emotional tone).
      *   *Correction:* 10 people total. Let's make it two teams of 5 competing or one council of 10? One council is better for group dynamics.
      *   *Revised Roles:*
          1.  Chair (Tie-breaker).
          2.  Legal Officer (Knows the loophole).
          3.  Finance Lead (Knows the cost of failure).
          4.  Tenant Rep A (Ground floor).
          5.  Tenant Rep B (Sub-basement - the vulnerable ones).
          6.  Maintenance Head (Knows the risk is real).
          7.  Comms Officer (Worried about PR).
          8.  External Ally (Union rep).
          9.  Ethics Officer (Secretly instructed to push for the "clean" option even if it fails).
          10. Scribe (Records the justification, not just the vote).

  6.  **Develop the "Dodgy" Choice:**
      *   Option A: Refuse the waiver. Building condemned. Everyone evicted. Fight legally later (low chance of success).
      *   Option B: Sign the waiver. Building stays open. Sub-basement units lose tenure security and can be evicted with 2 weeks notice if "safety issues" arise.
      *   *The Catch:* The vote requires a 2/3 majority.

  7.  **Drafting the Debrief (The Most Important Part):**
      *   Phase 1: Emotional Check-in (How do you feel?).
      *   Phase 2: The Decision (What did you choose?).
      *   Phase 3: The Theory (Introduce "Dirty Hands").
      *   Phase 4: Application (Connect to User's experience).
      *   *Key Question:* "If you voted Yes, do you feel guilty? If you voted No, do you feel righteous?"
      *   *Walzer's Point:* The guilt is necessary.

  8.  **Identify Pitfalls & Limitations:**
      *   *Pitfall:* Gamification. People treat it like a puzzle, not a moral dilemma.
      *   *Pitfall:* Dominant voices.
      *   *Pitfall:* "It's just a game" dismissal.
      *   *Limitation:* No real consequences. The "guilt" is simulated. The user's guilt is real because real people get hurt. The exercise can't reproduce the *weight* of real harm.
      *   *Limitation:* Time. 75 mins is tight for deep processing.

  9.  **Refining the Output:**
      *   Tone: Supportive, practical, academically grounded but accessible.
      *   Formatting: Clear headings, bullet points, printable-ready sections.
      *   Specific focus on the user's feeling: Validate that the "gross" feeling is a feature, not a bug.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I hide the theme? Yes, call it "Crisis Simulation."
      *   *Check:* Is there time pressure? Yes, hard stop at 25 mins.
      *   *Check:* Is the debrief robust? Need to ensure Walzer is introduced *after* the feeling is established.
      *   *Check:* Did I address the "what will go wrong" section? Yes, crucial for a facilitator.

  11. **Final Polish:** Ensure the connection between the simulation and the user's specific eviction compromise is clear in the debrief guide. (The "Sub-basement" in the sim = the "Evicted Tenants" in reality).

  *(Self-Correction on Roles)*: 10 specific roles might be too much admin. Let's group them into 3 factions with internal roles to speed up setup.
  *   *Faction 1: Survivalists (3 people)* - Focus on saving the building.
  *   *Faction 2: Solidarity (3 people)* - Focus on no one left behind.
  *   *Faction 3: Compliance/Legal (3 people)* - Focus on the rules/risks.
  *   *1 Chair:* Neutral facilitator.
  *   *Actually, let's keep individual roles but simplify the briefs.* It creates more friction. I will stick to individual role cards but keep the instructions concise.

  *(Final thought on the "Limitation"):* The biggest limitation is that in the game, they can walk away feeling fine. In reality, the user has to live with it. I need to emphasize that the *debrief* must bridge that gap.

