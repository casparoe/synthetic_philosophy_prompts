answer: |-
  **MEMORANDUM**

  **TO:** Hospital Board of Directors
  **FROM:** Clinical Technology Review Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Deployment of ML-Based ED Triage System

  **EXECUTIVE SUMMARY**

  The Clinical Technology Review Committee has completed its evaluation of the proposed Machine Learning (ML) Triage System for the Emergency Department (ED). While the vendor's trial data demonstrates significant potential for improved patient outcomes—specifically regarding early detection of sepsis and internal hemorrhage—the Committee identifies a critical ethical and liability structural flaw known as the "responsibility gap."

  **Recommendation:** The Committee recommends **Deployment with Specific Conditions.** We cannot recommend unconditional deployment due to unresolved accountability risks, nor do we recommend rejection, as withholding statistically superior diagnostic support presents its own ethical hazards. The conditions outlined below are mandatory to preserve human agency and establish a clear chain of accountability.

  **BACKGROUND AND CLINICAL BENEFIT**

  The proposed system ingests real-time patient data (vitals, labs, symptoms) to continuously generate acuity rankings. In controlled trials, the system identified critical deterioration 20–30 minutes faster than standard triage protocols. In emergency medicine, this window is clinically significant and potentially life-saving.

  The ED Director advocates strongly for adoption. The core argument is utilitarian: if a tool reduces aggregate suffering and mortality, we have a moral obligation to use it. The opposition to this system relies on a distinction between *diagnostic support* and *allocative decision-making*. However, proponents argue this distinction is overstated. Clinicians already rely on opaque tools—lab assays, imaging algorithms, and physiological scores (e.g., MEWS)—that they do not fully understand internally. When a lab result comes back positive, a physician acts on it without knowing the chemical kinetics of the assay. If we reject this system because the model weights are opaque, we may be setting a precedent that stalls innovation across all digital health tools. The status quo is not risk-free; human triage is fatigued, biased, and error-prone. Rejecting a tool that statistically saves lives could be viewed as negligence by omission.

  **THE RESPONSIBILITY GAP**

  Despite the clinical benefits, the Committee identifies a structural risk that differentiates this system from a CT scan or lab assay. A CT scan provides data for a human to interpret. This system provides a *priority ranking* relative to other patients. Under conditions of scarcity (which is when the tool is most valuable), a ranking functions as a rationing decision.

  The responsibility gap arises in the following failure scenario:
  1.  The system deprioritizes Patient A due to a complex, non-linear interaction of variables opaque to the vendor.
  2.  Patient A deteriorates while waiting.
  3.  The attending physician, managing a high load, defers to the system's ranking because it is hospital-approved and designed to catch patterns humans miss.
  4.  The nurses do not override because vitals appeared stable at the last check.

  In this scenario, liability is diffuse to the point of invisibility. The physician was not negligent by standard of care (they relied on approved support). The nurses followed protocol. The vendor is protected by "decision support" disclaimers and the opacity of the model prevents proving specific negligence in code. The Hospital approved the tool based on aggregate data.

  If we deploy this system, we risk creating a "moral crumple zone" where the attending physician absorbs legal liability for a decision driven by an algorithm they cannot audit, while the actual decision-making authority was subtly shifted to the software. This erodes the foundational principle of medical liability: that the person making the decision must have the capacity to understand and override the basis of that decision.

  **CONDITIONS FOR DEPLOYMENT**

  To mitigate the responsibility gap while capturing the clinical benefits, the following conditions must be met prior to and during deployment:

  **1. Explainability Interface Requirement**
  The system cannot present a "black box" score. The user interface must display the top three contributing factors for any given acuity ranking change (e.g., "Rank increased due to: 1. Drop in BP, 2. Elevated Lactate, 3. Age comorbidity"). If the vendor cannot provide feature importance at the inference level, the system cannot be deployed. The physician must know *why* the machine is suggesting a priority shift to effectively override it.

  **2. Non-Delegable Duty Protocol**
  Hospital policy must be updated to explicitly state that the ML system is advisory only. However, policy alone is insufficient given the pressure of a slammed ED. We require a "Hard Stop" verification for any patient ranked "Low Acuity" who meets specific high-risk criteria (e.g., age > 70, specific chief complaints). The physician must actively acknowledge the ranking discrepancy in the EHR, creating a digital audit trail that proves human judgment was applied, not just deferred.

  **3. Vendor Liability and Audit Partnership**
  The vendor's standard liability disclaimer is unacceptable for this level of operational integration. The contract must be amended to include:
  *   Full cooperation in root-cause analysis for any adverse event where the system's ranking is implicated.
  *   Access to model versioning and training data logs for forensic review during litigation or internal review.
  *   Maintenance of specific liability insurance covering algorithmic failure.

  **4. The "Shadow Mode" Period**
  Before live use, the system must run in "shadow mode" (processing data without displaying rankings) for 90 days. We will compare its recommendations against actual patient outcomes and physician decisions. If the system consistently deprioritizes patients who subsequently suffer adverse events—even if aggregate data looks good—we reserve the right to terminate deployment without penalty.

  **5. Quarterly Algorithmic Impact Review**
  A committee comprising ED staff, risk management, and technical staff will review cases where the system's ranking contradicted the clinical outcome. This is not to punish physicians, but to monitor for model drift or systematic bias against specific demographics or symptom presentations.

  **CONCLUSION**

  The argument that "technology has risks" is valid, but it is insufficient when the technology actively allocates scarce medical resources under opacity. A CT scan misses a tumor due to physical resolution limits; this system could miss a patient due to mathematical optimization choices made during training.

  We recommend deployment because the potential to save lives is too significant to ignore. However, we must not allow efficiency to obscure accountability. By enforcing explainability, mandating active human verification, and securing vendor accountability, we can close the responsibility gap. If the vendor cannot meet these conditions, the Committee recommends we decline deployment, as the risk to the hospital's ethical and legal standing outweighs the clinical benefit.

  **Approved by:**
  Clinical Technology Review Committee
  **Signature:**
  [Your Name/Chair]
