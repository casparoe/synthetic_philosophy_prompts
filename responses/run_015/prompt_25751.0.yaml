      *   *Conditions for Deployment:*
          1.  **Explicit Override Protocol:** Physicians must sign off on low-acuity rankings for high-risk presentations (cannot be passive).
          2.  **Auditability:** Every ranking change must be logged with the specific features that influenced it (explainability layer), even if approximate.
          3.  **Liability Indemnification:** Vendor must share liability if model deviation from standard of care is proven.
