  ### The Game: "The Coordination Consortium"

  **Story:** Three departments (Alpha, Beta, Gamma) in a large firm must independently choose operational protocols. Alpha chooses a management style (**Up**, **Mid**, **Down**). Beta and Gamma choose technical standards (**Left/Right** and **low/high**). Alpha's efficiency depends on whether Beta and Gamma coordinate on matching standards (both "low" or both "high"). However, Alpha's specific "Mid" style is highly specialized: it thrives *only* if Beta and Gamma correlate their choices (e.g., via a shared signal), but it fails if Beta and Gamma choose independently, because the risk of mismatch becomes too high compared to the robust "Up" or "Down" styles. Beta and Gamma are indifferent to the outcome (e.g., they are regulated utilities with fixed returns), so all their strategies are rationalizable.

  **Players:**
  *   **Player 1 (Alpha):** Strategies $S_1 = \{U, M, D\}$.
  *   **Player 2 (Beta):** Strategies $S_2 = \{L, R\}$.
  *   **Player 3 (Gamma):** Strategies $S_3 = \{l, r\}$.

  **Payoffs:**
  We specify payoffs as triples $(u_1, u_2, u_3)$. To isolate the phenomenon, Beta and Gamma receive 0 everywhere (ensuring no strategies are eliminated for them, so the divergence stems entirely from Alpha's beliefs). Alpha's payoffs are constructed to make $M$ undominated but not a best response to independent beliefs.

  | Alpha \ (Beta, Gamma) | $L, l$ | $L, r$ | $R, l$ | $R, r$ |
  | :--- | :---: | :---: | :---: | :---: |
  | **$U$** | $3, 0, 0$ | $3, 0, 0$ | $0, 0, 0$ | $0, 0, 0$ |
  | **$M$** | $2, 0, 0$ | $0, 0, 0$ | $0, 0, 0$ | $2, 0, 0$ |
  | **$D$** | $0, 0, 0$ | $0, 0, 0$ | $3, 0, 0$ | $3, 0, 0$ |

  *(Note: The columns represent the joint actions of Beta and Gamma in the order $Ll, Lr, Rl, Rr$.)*

  ---

  ### Verification

  We focus on Alpha's strategy **$M$**. We will show:
  1.  **$M$ survives Iterated Strict Dominance (ISD).** (It is not strictly dominated by any mixed strategy).
  2.  **$M$ is a strict Best Response (BR) to a correlated belief.**
  3.  **$M$ is NOT a Best Response to any independent belief.**

  #### 1. $M$ is not Strictly Dominated
  For $M$ to be strictly dominated, there must exist a mixed strategy $\sigma_1 = (p_U, p_M, p_D)$ (where $p_U + p_D \leq 1, p_M=0$) that yields strictly higher expected payoff than $M$ against *every* joint profile of Beta and Gamma. Since $M$ is a pure strategy, we check if any mixture of $U$ and $D$ dominates it.
  Let $\sigma_1$ play $U$ with probability $\alpha$ and $D$ with probability $1-\alpha$.
  The expected payoff vector for $\sigma_1$ across the four profiles $(Ll, Lr, Rl, Rr)$ is:
  $$ E[\sigma_1] = \alpha(3, 3, 0, 0) + (1-\alpha)(0, 0, 3, 3) = (3\alpha, 3\alpha, 3(1-\alpha), 3(1-\alpha)) $$
  The payoff vector for $M$ is:
  $$ u_1(M) = (2, 0, 0, 2) $$
  For $\sigma_1$ to strictly dominate $M$, we need:
  *   At $Ll$: $3\alpha > 2 \implies \alpha > 2/3$.
  *   At $Rr$: $3(1-\alpha) > 2 \implies 1-\alpha > 2/3 \implies \alpha < 1/3$.
  These conditions are contradictory. Thus, no mixture of $U$ and $D$ dominates $M$. $U$ and $D$ do not dominate $M$ individually (obviously, as they yield 0 where $M$ yields 2). **$M$ survives ISD.**

  #### 2. $M$ is a Best Response to a Correlated Belief
  Consider a belief $\mu$ over Beta and Gamma's joint actions that places probability $0.5$ on $(L, l)$ and $0.5$ on $(R, r)$, and $0$ elsewhere. This is a **correlated belief** (Beta and Gamma perfectly correlate).
  *   $E_\mu[U] = 0.5(3) + 0.5(0) = 1.5$
  *   $E_\mu[D] = 0.5(0) + 0.5(3) = 1.5$
  *   $E_\mu[M] = 0.5(2) + 0.5(2) = 2.0$
  Since $2.0 > 1.5$, **$M$ is the unique strict Best Response to $\mu$.** Because it is a best response to *some* belief, it cannot be strictly dominated (confirming part 1 via the standard duality theorem).

  #### 3. $M$ is NOT a Best Response to any Independent Belief
  Let Beta play $L$ with probability $p$ and Gamma play $l$ with probability $q$. Under the **independence assumption**, the probabilities of the four joint profiles are:
  *   $P(Ll) = pq$
  *   $P(Lr) = p(1-q)$
  *   $P(Rl) = (1-p)q$
  *   $P(Rr) = (1-p)(1-q)$

  The expected payoffs for Alpha are:
  *   $E[U] = 3pq + 3p(1-q) = 3p$
  *   $E[D] = 3(1-p)q + 3(1-p)(1-q) = 3(1-p)$
  *   $E[M] = 2pq + 2(1-p)(1-q) = 2(pq + 1 - p - q + pq) = 2(1 - p - q + 2pq)$

  For $M$ to be a best response, we need $E[M] \geq E[U]$ **and** $E[M] \geq E[D]$.
  1.  $2(1 - p - q + 2pq) \geq 3p \implies 2 - 2p - 2q + 4pq \geq 3p \implies \mathbf{2 - 5p - 2q + 4pq \geq 0}$
  2.  $2(1 - p - q + 2pq) \geq 3(1-p) \implies 2 - 2p - 2q + 4pq \geq 3 - 3p \implies \mathbf{-1 + p - 2q + 4pq \geq 0}$

  From inequality (2), we isolate $p$:
  $$ p(1 + 4q) \geq 1 + 2q \implies p \geq \frac{1 + 2q}{1 + 4q} $$
  Note that for any $q \in [0,1]$, $\frac{1 + 2q}{1 + 4q} > 0.5$ (since $2+4q > 1+4q$). Thus, we must have **$p > 0.5$**.

  Now substitute this requirement into inequality (1). Rearrange (1) to isolate $p$:
  $$ 2 - 2q \geq p(5 - 4q) $$
  Since $q \in [0,1]$, $(5-4q)$ is positive. So:
  $$ p \leq \frac{2 - 2q}{5 - 4q} $$
  We now have a contradiction if the lower bound for $p$ exceeds the upper bound. We check if $\frac{1 + 2q}{1 + 4q} \leq \frac{2 - 2q}{5 - 4q}$ is ever true:
  $$ (1 + 2q)(5 - 4q) \leq (2 - 2q)(1 + 4q) $$
  $$ 5 - 4q + 10q - 8q^2 \leq 2 + 8q - 2q - 8q^2 $$
  $$ 5 + 6q - 8q^2 \leq 2 + 6q - 8q^2 $$
  Subtract $6q - 8q^2$ from both sides:
  $$ \mathbf{5 \leq 2} $$
  This is false for all $q$. Therefore, the system of inequalities has **no solution**. There exists no pair $(p, q)$ such that $M$ is a best response. **$M$ is eliminated by the independent-belief rationalizability procedure.**

  ---

  ### Structural Analysis

  **The Driving Feature:**
  The divergence is driven by **non-additive separability** in Alpha's payoffs with respect to Beta and Gamma's actions. Specifically, Alpha's payoff for $M$ depends on the *joint* distribution (the correlation) of Beta and Gamma, not just their marginals.
  *   $u_1(M, \cdot)$ rewards correlation ($Ll$ and $Rr$).
  *   $u_1(U, \cdot)$ depends only on Beta's marginal ($L$).
  *   $u_1(D, \cdot)$ depends only on Beta's marginal ($R$).

  **If Payoffs Were Additively Separable:**
  If Alpha's payoffs were of the form $v_1(s_1) + v_2(s_2) + v_3(s_3)$, then expected utility would depend only on the marginal probabilities $p$ and $q$. In that case, the set of beliefs supporting a strategy would be defined entirely by marginals. The "correlated" belief would offer no advantage over an independent one with the same marginals, and the divergence would collapse. The example relies entirely on the fact that independent beliefs constrain the joint probability space (specifically $P(Ll)P(Rr) = P(Lr)P(Rl)$), whereas correlated beliefs do not.

  ---

  ### Honesty & Theoretical Check

  **1. Your 2-Strategy Suspicion:**
  Your intuition was **correct**. If Alpha had only 2 strategies (say $M$ and $U$), checking if $M$ is dominated involves checking if $E[M] \geq E[U]$. This defines a single linear inequality (a half-space) over the belief simplex. If this set is non-empty (i.e., $M$ is not dominated), the linear function $E[M] - E[U]$ must achieve a maximum somewhere in the simplex. The maximum of a linear function over a simplex always occurs at a **vertex**. The vertices of the joint belief simplex correspond to **pure strategy profiles** of the opponents. Pure profiles are degenerate independent beliefs (probability 1 on a specific action). Therefore, if $M$ is a best response to *any* belief, it is a best response to *some* independent belief. **You cannot construct this example with 2 strategies for the focal player.** I used 3 strategies ($U, M, D$) to create a "polytope" of supporting beliefs (intersection of two half-spaces) that can float in the interior of the simplex without touching the independent manifold.

  **2. Framing of Procedures:**
  Your framing is **correct** for the standard distinction in 3+ player games.
  *   **ISD (with mixed strategies):** A strategy survives iff it is a best response to *some* belief in $\Delta(S_{-i})$ (correlated allowed).
  *   **Rationalizability (Independent):** A strategy survives iff it is a best response to *some* product belief $\times \Delta(S_j)$.
  *   *Correction/Nuance:* In 2-player games, these sets coincide. In 3+ player games, they diverge exactly as you described (Pearce, 1984). The set of strategies surviving ISD is the set of strategies rationalizable with *correlated* beliefs. The set surviving independent rationalizability is a subset (sometimes proper) of that.

  **3. Robustness:**
  The gap ($5 \leq 2$) is strict. You can perturb the payoffs (e.g., change the 2s to 2.1 or the 3s to 2.9) and the algebraic contradiction will hold. This is not a knife-edge example.

  **4. Confidence:**
  I am highly confident in the algebraic derivation. The only potential point of confusion for students is why Beta and Gamma have 0 payoffs. This is a pedagogical device to ensure *their* strategies are never eliminated, isolating the deletion of $M$ purely to the independence assumption on Alpha's beliefs, rather than a cascade of deletions. If you prefer, you can give them Matching Pennies payoffs against each other; as long as all their strategies remain rationalizable, the result for Alpha holds. I recommend keeping them at 0 for clarity.
