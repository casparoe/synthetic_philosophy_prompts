      *   *Metaphysical Commitments:* Separate the medical/regulatory (no metaphysics needed) from the mix-up rhetoric (implies metaphysics).
      *   *Test Cases:* Analyze Second Sample (rejects strict Kripke), Twins (shows origin isn't sufficient for individuation), Clone (shows genome isn't sufficient).
      *   *Implications:*
          *   Adopting Strict: Paralyzes IVF (every vial is a new person), complicates embryo status.
          *   Abandoning Weak: Undermines the "catastrophe" of mix-ups, weakens consanguinity logic, potentially empowers donors or clones.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Be careful not to conflate "legal parent" with "personal identity." The prompt asks about *personal identity* presupposed by the practice.
      *   *Nuance:* The practice is inconsistent. It treats the child as the intending parents' child (legal) but the donor's genetic offspring (biological). The "Identity Catastrophe" in mix-ups is the strongest evidence for a metaphysical claim.
      *   *Kripke:* Kripke argues specific gametes are necessary. Practice suggests specific *donors* are necessary, but not specific *gametes*. This is a modification of Origin Essentialism. Let's call it "Source Essentialism."
