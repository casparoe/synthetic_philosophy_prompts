      *   *Parental/Social Essentialism:* You are the child of the people who intend to raise you.
          *   *Conflict:* Mix-ups. If the wrong sperm is used, it's called a "catastrophe of identity," implying the child *is* different, even if the intending parents are the same.

  4.  **Synthesize the "Implicit Theory":**

      *   It's a hybrid. It's not strictly metaphysical; it's *normative-functional*.
      *   It treats "Origin" as a cluster concept:
          1.  **Nuclear Genetic Lineage:** Crucial for identity (mix-ups matter, consanguinity matters).
