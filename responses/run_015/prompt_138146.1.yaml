      *   *Conclusion:* It presupposes a **Weak Origin Essentialism** focused on *provenance* (which couple/bank) rather than *particular material particles* (specific sperm/egg), combined with a **Normative Identity** (legal parents define social identity, but genetic parents define biological identity).

