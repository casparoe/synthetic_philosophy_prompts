answer: |-
  # The Hybrid Gate Protocol (HGP)
  **Version 1.0 for County Sentencing Review**

  **Purpose:** To standardize voting on non-violent sentencing guidelines by filtering proposals through a retributive cap (desert) and a consequentialist floor (harm).
  **Time Budget:** 20 minutes per proposal.
  **Required Inputs:** Proposal text, current status quo data (recidivism/cost), offender demographic context.

  ---

  ## Part 1: The Decision Flowchart

  **Gate 0: Scope Check**
  *   **Question:** Does this proposal apply exclusively to non-violent offenses?
  *   **No:** Stop. Out of jurisdiction.
  *   **Yes:** Proceed to Gate 1.

  **Gate 1: Shadow Proportionality Check (Retributive Cap)**
  *   **Concept:** Punishment cannot exceed what is deserved for the *worst version of this crime the offender could realistically have avoided*.
  *   **Procedure:**
      1.  Identify the "Typical Offender" for this offense class.
      2.  Determine the "Avoidable Culpability": Could a reasonable person in their circumstances have chosen *not* to offend without suffering catastrophic loss (starvation, homelessness, severe coercion)?
      3.  Compare Proposed Penalty to Avoidable Culpability.
  *   **Criterion:** Is the proposed penalty $\le$ the penalty deserved for the *avoidable* harm?
      *   *Note:* If the offender had no realistic choice (e.g., steal or starve), Avoidable Culpability $\approx$ 0. Penalty must be $\approx$ 0.
  *   **Fail:** **REJECT.** (Punishment exceeds moral desert).
  *   **Pass:** Proceed to Gate 2.

  **Gate 2: Counterfactual Harm Floor (Consequentialist Floor)**
  *   **Concept:** The proposal must not increase net harm compared to the Status Quo.
  *   **Procedure:** Sum the estimated harms for **Proposal** vs. **Status Quo** across three buckets:
      1.  *Family/Community Disruption:* (e.g., loss of income, foster care placement).
      2.  *Recidivism Risk:* (e.g., criminogenic effect of jail vs. rehabilitation).
      3.  *Offender Victimization Risk:* (e.g., violence in prison, vigilante harm post-release).
  *   **Criterion:** Is Total Net Harm (Proposal) $\le$ Total Net Harm (Status Quo)?
  *   **Fail:** **REJECT.** (Proposal creates more suffering than it prevents).
  *   **Pass:** Proceed to Gate 3.

  **Gate 3: The Gray Zone (Human Values Call)**
  *   **Concept:** Data is often incomplete. If Gates 1 & 2 pass but the margin is thin, or if values conflict (e.g., justice vs. mercy), a vote is required.
  *   **Criterion:** Is the benefit marginal or uncertain?
  *   **Yes:** **VALUES CALL.** (Board votes based on weighted priorities).
  *   **No:** **APPROVE.** (Clear net positive).

  ---

  ## Part 2: Worked Examples

  ### Proposal 1: 90-Day Mandatory Minimum for Second Shoplifting Offense
  **Context:** Current status quo is probation + fine. Proposal mandates 90 days jail.

  *   **Gate 1 (Shadow Proportionality):**
      *   *Analysis:* Shoplifting is often driven by economic desperation or addiction. For a "second offense," the avoidable culpability varies. If the offender is stealing necessities due to poverty, the "realistically avoidable" crime is low (choice was steal or starve).
      *   *Check:* Is 90 days jail proportional to the avoidable harm of stealing $50 of goods? Even in the "worst avoidable" scenario (stealing for profit, not need), 90 days is statistically disproportionate to the harm caused.
      *   *Result:* **FAIL.** (Penalty exceeds the desert cap for the avoidable culpability).
  *   **Gate 2 (Harm Floor):** *Skipped due to Gate 1 Fail.*
  *   **Final Verdict:** **REJECT.**

  ### Proposal 2: Direct-Restoration Labor for First-Time Vandalism
  **Context:** Current status quo is 30 days jail (suspended) + fine. Proposal is offender repairs damage alongside victim supervision.

  *   **Gate 1 (Shadow Proportionality):**
      *   *Analysis:* Vandalism is typically a choice with high avoidability (rarely done for survival).
      *   *Check:* Is labor proportional to damage? Yes. Is it within the desert cap? Yes, it does not exceed the severity of the property damage.
      *   *Result:* **PASS.**
  *   **Gate 2 (Harm Floor):**
      *   *Analysis:*
          *   *Family Disruption:* Labor allows work continuity; jail disrupts it. (Proposal Lower Harm).
          *   *Recidivism:* Restorative justice shows lower recidivism than short-term jail. (Proposal Lower Harm).
          *   *Offender Victimization:* Jail carries violence risk; labor does not. (Proposal Lower Harm).
      *   *Check:* Is Total Net Harm (Proposal) $\le$ Status Quo? Yes, significantly lower.
      *   *Result:* **PASS.**
  *   **Gate 3 (Gray Zone):**
      *   *Analysis:* Benefit is clear and data-supported.
      *   *Result:* **APPROVE.**
  *   **Final Verdict:** **APPROVE.**

  ### Proposal 3: Cut Fraud Fines by 50% but Add Public Offender Registry
  **Context:** Current status quo is high fines, no registry. Proposal lowers financial burden but adds public shaming/exposure.

  *   **Gate 1 (Shadow Proportionality):**
      *   *Analysis:* Fraud is high-avoidability (white collar, economic choice).
      *   *Check:* Is the fine cut proportional? Yes, lowers retributive burden. Is the Registry proportional? Public exposure is a form of punishment.
      *   *Result:* **PASS.** (Assuming registry is viewed as collateral consequence, not formal penalty, this gate is often cleared loosely).
  *   **Gate 2 (Harm Floor):**
      *   *Analysis:*
          *   *Family Disruption:* Lower fines help family stability. (Proposal Lower Harm).
          *   *Recidivism:* Mixed data. Financial relief helps, but stigma hinders employment. (Neutral).
          *   *Offender Victimization Risk:* **Critical Factor.** Public registries for non-violent crimes correlate with increased risk of vigilante harassment, physical assault, and inability to secure housing/income, leading to higher risk of re-offending or becoming a victim of crime.
      *   *Calculation:* Does the harm from increased victimization risk + employment loss outweigh the benefit of the fine reduction?
      *   *Estimate:* For non-violent fraud, the long-term harm of unemployability and vigilante risk often exceeds the one-time harm of a higher fine.
      *   *Check:* Is Total Net Harm (Proposal) $\le$ Status Quo? **No.** The registry introduces a high-variance, high-severity harm vector (vigilantism/permanent exclusion) that the status quo lacks.
      *   *Result:* **FAIL.**
  *   **Final Verdict:** **REJECT.**
      *   *(Note: This contradicts the "soft on registries" intuition. The procedure flags the registry as a net-harm generator despite the fine reduction.)*

  ---

  ## Part 3: Hidden Judgment Calls (The "Black Box")

  This procedure looks mechanical, but three steps require unavoidable philosophical judgment. Board members must acknowledge these are not math problems.

  1.  **Defining "Realistically Avoidable" (Gate 1):**
      *   *The Trap:* One board member's "realistic choice" is another's "impossible situation."
      *   *The Call:* You are implicitly deciding how much structural pressure (poverty, addiction) excuses moral agency. There is no formula for this. You must vote on the *degree of freedom* the offender had.
  2.  **Weighting "Offender Victimization" (Gate 2):**
      *   *The Trap:* Does harm done *to* the offender count as "Net Harm" in the same way as harm done *by* the offender?
      *   *The Call:* This procedure assumes **Yes**. If your board believes offender safety is secondary to public signaling, this gate is biased against your values.
  3.  **The Status Quo Baseline (Gate 2):**
      *   *The Trap:* If the Status Quo is already terrible, a "less terrible" proposal passes easily.
      *   *The Call:* You are anchoring to current law. If current law is unjust, this procedure only allows incremental improvement, not radical correction.

  ## Part 4: Limitations & Failure Modes

  *   **Free Will:** This procedure does not solve determinism. It operates on "practical agency" (could they have done otherwise *for the purposes of social policy*?), not metaphysical freedom.
  *   **Data Gaps:** Gate 2 requires recidivism and harm data. If your county doesn't track "offender victimization" or "family disruption," you are guessing. Mark these votes as **VALUES CALL** rather than Approve if data is missing.
  *   **Edge Cases:** This is designed for *non-violent* guidelines. Do not apply to violent offenses without recalibrating the "Offender Victimization" weight (public safety usually outweighs offender safety in violent cases).
  *   **The "Human Values Call" Dump:** If too many proposals hit Gate 3, the procedure isn't saving time; it's just delaying the debate. Use it for close calls only.

  ---

  **Usage Note for the Board:**
  When you vote "Reject" on Proposal 3 (Registry), you are not saying fraud is good. You are saying the *mechanism* of the registry creates more suffering than the fine it replaces. This is the "honest audit" result: sometimes the tool we like (registry) fails the math of harm reduction. Trust the gate, not the intuition.
