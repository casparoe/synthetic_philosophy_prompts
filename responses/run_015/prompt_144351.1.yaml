      *   **Requirements:**
          *   Sharpen the half-formed idea, not replace it.
          *   State *one precise question* with a determinate answer.
          *   Explain why standard arguments leave this open.
          *   Propose a method feasible in 4 months with *no real compute budget* (synthetic tasks).
          *   Distinguish two motivations: supervising process *because* we care about process vs. supervising process *as a proxy* for outcomes.
          *   Define what a *negative result* looks like.
          *   Define the *deliverable* for a budget-decider.
          *   Include an honest *scope section* (specifically addressing the Chain-of-Thought faithfulness debate).
