      *   Deliverable defined? (Check).

  6.  **Final Polish:** (Writing the text with the above structure in mind). *Focus on the "Terminal Judgment Problem" as the hook.* Ensure the distinction between "process for outcome's sake" and "process for process's sake" is explicit.

  *(Self-Correction on Methodology)*: "No real compute budget" usually means no large-scale training runs. I should propose using *existing* small models (e.g., 7B range) or even just simulating the reward structure mathematically if possible. But to make it concrete for an AI grant, using small open models on synthetic algorithmic tasks is the standard low-compute approach. I will specify "small open-weight models on synthetic algorithmic tasks."

  *(Refining the Question)*: "Is there a class of tasks..." is good. Let's make it tighter. "Does process supervision yield outcome gains only when intermediate validity is outcome-independent?"

  *(Refining the CoT Scope)*: The risk is that this becomes "Is CoT faithful?" The proposal must state: We assume the trace *is* the computation (via constraint or synthetic environment), bypassing the faithfulness empirical question to focus on the *supervisory grounding* question.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **Project Title:** The Terminal Judgment Problem: Grounding Process Supervision in Outcome-Independent Intermediates

  **Research Question**
  Is there a class of tasks on which step-level correctness is definable without appeal to final outcomes, and does process supervision outperform outcome supervision *only* within this class?

  **Motivation**
  Current comparisons of process versus outcome supervision measure performance per unit of human feedback. This framing obscures the source of the supervisory signal. My hypothesis is that neither scheme eliminates credit assignment; they merely relocate it. Every supervision scheme bottoms out in a "terminal judgment" that is not itself supervised by the same standard.

  A process supervisor grading step *t* faces a dilemma:
  1.  **Short-Horizon Outcome:** It predicts whether step *t* leads to a good final answer. This is outcome supervision with a discounted horizon, not true process supervision.
  2.  **Intrinsic Step Quality:** It applies a local notion of correctness defined without reference to the outcome. This risks Goodharting: models may learn to emit locally impeccable reasoning that is globally useless.

  Consequently, process supervision is not a distinct category but the short-horizon end of a continuum. The critical unresolved issue is whether there exists an "optimal horizon" where intermediate artifacts are checkable on their own merits, independent of the final solution.

  **Distinction of Goals**
  This proposal explicitly separates two motivations often conflated:
  *   **Instrumental Process Supervision:** Supervising the process solely as a proxy for better outcomes. Failure mode: The process looks correct but fails to solve the task (alignment tax).
  *   **Intrinsic Process Supervision:** Supervising the process because the reasoning trace itself is the object of value (e.g., auditability, safety, educational value). Failure mode: The model produces valid reasoning that does not optimize for the desired external result.

  **Methodology**
  **Timeline:** 4 Months. **Compute:** Zero new pre-training; fine-tuning/inference only on small open-weight models (e.g., 7B parameter range).

  I will construct a family of synthetic algorithmic tasks (e.g., pathfinding, logic proofs, sorting) varying along one dimension: **Intermediate Verifiability**.
  *   *Low Verifiability:* Intermediate steps cannot be validated without solving the full problem (e.g., heuristic search).
  *   *High Verifiability:* Intermediate steps have mathematical validity conditions independent of the final state (e.g., valid logical inference rules, valid matrix operations).

  I will train Process Reward Models (PRMs) and Outcome Reward Models (ORMs) on these tasks. Crucially, for the PRM, I will generate labels using two methods: one derived from look-ahead (simulating human "prediction") and one derived from local rules (simulating human "rubric").

  **Negative Result**
  The hypothesis is falsified if:
  1.  PRMs outperform ORMs on *Low Verifiability* tasks even when labels are generated via local rules (suggesting local rubrics capture signal I assume doesn't exist).
  2.  PRMs provide no benefit over ORMs on *High Verifiability* tasks even when labels are outcome-independent (suggesting the bottleneck is not supervision granularity but model capability).

  **Deliverable**
  A **Supervision Horizon Map**. This will be a decision matrix for grant-makers and engineers indicating, for a given task structure, whether the cost of process annotation is justified by performance gains, or if process supervision is merely a more expensive form of outcome supervision.

  **Scope and Limitations**
  This project risks collapsing into the debate on Chain-of-Thought (CoT) faithfulness (i.e., whether the trace reflects actual computation). To avoid this:
  1.  **Constraint:** We will use synthetic environments where the model is constrained to output the computation trace as the action space. We treat the trace *as* the computation, bypassing the empirical question of faithfulness.
  2.  **Focus:** We are not asking if the model "thinks" this way; we are asking if the *supervisory signal* applied to the trace is grounded.

  This scope limits claims to algorithmic/synthetic domains. Generalizing to natural language reasoning requires assuming natural language tasks share the verifiability structure of the synthetic proxies, an assumption this pilot will test but not prove.
