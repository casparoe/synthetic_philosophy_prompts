  2.  **Deconstruct the Core Argument:**
      *   *Standard View:* Process supervision is better for difficult tasks where outcomes are sparse/noisy.
      *   *User's View:* Process supervision relies on a judgment of "good step." Where does that judgment come from?
          *   Case A: It predicts the outcome (Short-horizon outcome supervision).
          *   Case B: It judges intrinsic step quality (Risk of Goodharting/locally correct but globally wrong).
      *   *Key Distinction:* Instrumental Process Supervision (for outcomes) vs. Intrinsic Process Supervision (for safety/auditability).
      *   *Proposed Experiment:* Synthetic tasks where decomposability varies. Can we define step correctness *independently* of the final answer?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and reflect the "Terminal Judgment" concept.
      *   **Research Question:** Needs to be precise. *Is there a class of tasks where step-level correctness is definable without appeal to final outcomes, and does process supervision outperform outcome supervision only within this class?*
      *   **Motivation/Problem:** Standard comparisons measure performance per feedback unit. This ignores *where* the supervisory signal originates. The "Terminal Judgment Problem": every process reward model bottoms out in an unsupervised judgment.
      *   **Distinction:** Explicitly separate *Instrumental* (process as proxy for outcome) vs. *Intrinsic* (process as the object of value, e.g., safety/auditability).
      *   **Methodology:** 4 months, low compute. Synthetic tasks. Vary one dimension: *Decomposability/Verifiability of Intermediates*.
          *   Task Family: Algorithmic problems (e.g., sorting, pathfinding, logic proofs) where intermediate states can be mathematically verified without knowing the final solution.
          *   Variable: The degree to which intermediate validity guarantees final validity.
      *   **Negative Result:** If process supervision only wins when the "step correctness" label is actually derived from looking ahead at the outcome (Case A), then process supervision is just smoothed outcome supervision. If it wins on intrinsic step quality but fails to improve outcomes, it confirms the Goodhart risk.
      *   **Deliverable:** A "Horizon Map." A guide showing which task structures justify process supervision costs.
      *   **Scope/CoT Faithfulness:** Address the CoT overlap. This isn't about whether CoT reflects internal state (faithfulness); it's about whether the *supervisory signal* for CoT is grounded. We avoid the faithfulness debate by using synthetic tasks where the "reasoning trace" is the actual computation, not a post-hoc rationalization.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Is the question determinate? Yes, it's about the existence of a task class and the correlation with PRM success.
      *   *Check:* Is the compute budget respected? Yes, synthetic tasks + small models (or even just simulating the RL environment without training massive LLMs, perhaps using rule-based agents or very small transformers). *Correction:* To be safe on "no compute budget," I should suggest using existing small open models or even tabular RL on synthetic environments to test the *principle* of credit assignment, rather than training new SOTA LLMs. Let's specify "small open-weight models" or "algorithmic environments."
      *   *Check:* Is the distinction clear? I need to make sure the "Instrumental vs. Intrinsic" point lands hard.
      *   *Check:* Scope on CoT. Make sure to say we treat the trace as the object of study, not a window into the black box.
