      *   *Thesis 3: Average Utilitarianism.* The value is the average welfare. "More" people only helps if they are above average. (Friend likely isn't using this, but need to rule it out).
      *   *Thesis 4: Ceteris Paribus Triviality.* All else equal, a world with happy people is better than one without.
      *   *Thesis 5: Lexical Views/Threshold Views.* Some lives are so good they outweigh any number of barely worth living lives. (This opposes the friend, but clarifies the debate).
