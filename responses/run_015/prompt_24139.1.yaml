answer: |-
  You are right to suspect that "more is better" is doing too much work. In population ethics, that slogan is a homonym: it sounds like a single intuition but actually refers to at least four distinct logical claims. Your friend is likely sliding between them to make the Repugnant Conclusion (RC) seem like a trivial truth rather than a costly theoretical commitment.

  Here is a menu of the distinct theses "more is better" could be expressing. For each, I have defined what "more" and "better" refer to, classified the claim, and assessed whether it actually supports his longtermist/TU conclusion.

  ### 1. The Non-Satiation Principle (Mere Addition)
  *   **The Claim:** Adding a person with a life worth living (positive welfare) never makes a population worse, all else being equal.
  *   **What "More" Means:** An increase in the *number* of lives with welfare $> 0$.
  *   **What "Better" Means:** Impersonal value (the state of affairs is not worse).
  *   **Classification:** **Substantive & Controversial.** It is not a platitude. While it sounds intuitive, accepting it is the first step in Parfit's "Mere Addition Paradox," which logically forces you toward the Repugnant Conclusion when combined with transitivity.
  *   **Does it support his conclusion?** **Partially.** It gets the foot in the door, but it does not justify the *conclusion* of the RC on its own. It only says adding happy people isn't *bad*; it doesn't say adding billions of barely-happy people is *better* than a smaller group of ecstatic people.
  *   **Confidence:** **High.** This is a standard principle in the literature (often called the "Mere Addition Principle").

  ### 2. Total Utilitarianism (Sum Maximization)
  *   **The Claim:** The value of a population is determined strictly by the sum total of welfare within it.
  *   **What "More" Means:** An increase in the *aggregate sum* of welfare units.
  *   **What "Better" Means:** Higher total utility.
  *   **Classification:** **Substantive Theory.** This is not a self-evident truth; it is a specific axiological framework. It explicitly entails the Repugnant Conclusion (mathematically, a vast sum of small positives outweighs a small sum of large positives).
  *   **Does it support his conclusion?** **Yes, directly.** If this is his premise, the RC follows by definition. However, he is presenting it as a slogan ("more is better") rather than admitting it is a contentious ethical axiom that requires defense against counter-intuitive results.
  *   **Confidence:** **High.** This is the standard definition of the Total View.

  ### 3. The Ceteris Paribus Triviality
  *   **The Claim:** If you can add a happy person without negatively affecting anyone else, you ought to do so.
  *   **What "More" Means:** One additional happy existence in isolation.
  *   **What "Better" Means:** Morally preferable action.
  *   **Classification:** **Platitude.** Most people (even those who reject Total Utilitarianism) agree that creating a happy child is good *if* it costs nothing.
  *   **Does it support his conclusion?** **No.** This is a scope error. Your friend is using this plausible claim about *marginal* additions to justify *global* maximization. Accepting that it is good to add *one* happy person does not imply it is good to add *trillions* of miserable people to maximize the sum.
  *   **Confidence:** **High.** This is a classic equivocation between local and global optimality.

  ### 4. Average Utilitarianism (The Counter-Claim)
  *   **The Claim:** The value of a population is determined by the *average* welfare per person.
  *   **What "More" Means:** An increase in population size *only if* the new members are above the current average.
  *   **What "Better" Means:** Higher average quality of life.
  *   **Classification:** **Substantive Theory.**
  *   **Does it support his conclusion?** **No.** In fact, this view *blocks* the Repugnant Conclusion. If your friend says "more is better" but holds this view, he is contradicting himself regarding the RC. If he is a longtermist focused on *existential risk*, he is almost certainly not an Average Utilitarian (since AU implies it might be better to kill below-average people).
  *   **Confidence:** **High.** It is important to list this to show him that "more is better" is not compatible with all ethical frameworks.

  ### 5. The "Better For" vs. "Better Simpliciter" Distinction
  *   **The Claim:** Existence is a benefit.
  *   **What "More" Means:** More subjects experiencing benefits.
  *   **What "Better" Means:** This is the pivot point.
      *   *Reading A (Person-Affecting):* Better *for* the person created. (But they wouldn't exist otherwise, so this is metaphysically tricky).
      *   *Reading B (Impersonal):* Better *from the perspective of the universe*.
  *   **Classification:** **Conceptual Ambiguity.**
  *   **Does it support his conclusion?** **Only on Reading B.** The Repugnant Conclusion relies on Impersonal Totalism. If "better" means "better for existing people," the RC fails (the existing excellent people are worse off in the RC world). Your friend is likely assuming Reading B without acknowledging that Reading A is the more common moral intuition.
  *   **Confidence:** **High.** This is the standard "Person-Affecting Restriction" objection to Total Utilitarianism.

  ### 6. Descriptive vs. Evaluative (The Naturalistic Fallacy Risk)
  *   **The Claim:** Growth/Expansion is inherently valuable.
  *   **What "More" Means:** Biological or civilizational expansion.
  *   **What "Better" Means:** Normatively superior.
  *   **Classification:** **Potentially False / Equivocation.** This conflates a descriptive trend (life expands) or a biological drive (fitness) with a normative claim (we *ought* to expand).
  *   **Does it support his conclusion?** **No.** Even if expansion is natural or inevitable, it does not follow that it is *good* in the specific utilitarian sense required to justify AI risk mitigation strategies.
  *   **Confidence:** **Medium.** It is possible he holds a "cosmist" view where expansion is intrinsically good, but this is distinct from welfare utilitarianism.

  ---

  ### Summary of Verdicts & Confidence

  | Thesis | Classification | Supports Friend's RC Defense? | Confidence |
  | :--- | :--- | :--- | :--- |
  | **1. Non-Satiation** | Substantive & Controversial | Partially (starts the slide) | High |
  | **2. Total View** | Substantive Theory | **Yes** (but begs the question) | High |
  | **3. Ceteris Paribus** | Platitude | **No** (scope error) | High |
  | **4. Average View** | Substantive Theory | **No** (contradicts his goal) | High |
  | **5. Impersonal Value** | Conceptual Ambiguity | **Yes** (required for RC) | High |
  | **6. Descriptive Growth** | Potentially False | **No** (is/ought gap) | Medium |

  ### The Point of Least Certainty

  I am least certain about the classification of **Thesis 1 (The Non-Satiation/Mere Addition Principle)**.

  **Why:** In the prompt, I classified it as "Substantive & Controversial." However, there is a significant camp in population ethics (including Parfit initially) that treats it as a **Platitude**—an intuition so basic that if a theory violates it, the theory is rejected.
  *   **The Uncertainty:** Is it *actually* a platitude, or is it a substantive claim that merely *feels* obvious?
  *   **Why it matters for your argument:** If your friend treats it as a platitude, he will think you are crazy for questioning it. If you can convince him it is a *substantive claim* that leads to absurd results (the RC), he might be willing to drop it.
  *   **My Verdict:** I lean towards it being **Substantive**, because accepting it forces you to accept the Repugnant Conclusion (via the Mere Addition Paradox). Since the RC is widely regarded as a *reductio ad absurdum*, the premise forcing it (Mere Addition) cannot be a simple platitude. However, I assign this **Medium Confidence** because many sophisticated philosophers still argue it is the one intuition we must save, even at high cost.

  ### How to Use This Menu
  Tell your friend: *"When you say 'more is better,' which row of this table are you standing on? If you're on Row 3 (Ceteris Paribus), you can't get to the Repugnant Conclusion. If you're on Row 2 (Total View), you're admitting you hold a specific, controversial theory that entails absurd results, not a self-evident truth. You can't use the plausibility of Row 3 to defend the conclusions of Row 2."*
