answer: |-
  This is a classic historiographical puzzle. Your supervisor is navigating the tension between **environmental determinism** (nature drives history) and **political economy** (human systems drive history).

  Here is the breakdown of your three hypotheses, how they apply to your delta case, and the single case that will expose her actual rule.

  ### 1. Which rule is she running?

  None of your three rules fit perfectly, but **Rule 3 (Human Arrangement Demotes)** is the strongest candidate, provided you add one crucial exception: **Independent Biological Agents.**

  Here is why the others fail:
  *   **Rule 1 (Abrupt/Dateable) fails on the Dust Bowl.** Droughts are dateable and abrupt enough to be events, yet she classifies the drought as *background*. She assigns agency to the "wheat economy," not the weather.
  *   **Rule 2 (Determinism) fails on the Potato Blight.** She explicitly admits the famine was a "British policy failure" (meaning the outcome wasn't forced by the potato alone), yet she still classifies the Blight as an *actor*. If determinism were the rule, the Blight would be background to the policy.

  **Rule 3 is the closest**, but the Potato Blight verdict proves it's not simply "did humans make it lethal?" (Monoculture made the blight lethal, yet it's an actor). The distinction is likely **Exogenous Shock vs. Endogenous Vulnerability**.
  *   **Actors:** External forces that *interrupt* a system (Tambora, Blight).
  *   **Background:** Internal conditions or vulnerabilities that a human system *exploits or ignores* (Ice Age, Malaria, Dust Bowl Drought).

  ### 2. What would each rule say about your Delta?

  Your case: *40 years slow salt creep (worsened by colonial dams) -> kills rice in one season -> mass migration.*

  *   **Rule 1 (Abruptness): Ambiguous / Leaning Actor.**
      *   The salt creep was slow (40 years), which suggests Background (like the Little Ice Age). However, the crop death and migration happened in a "single season," which is abrupt (like Tambora). If she focuses on the *crisis point*, this rule predicts **Actor**.
  *   **Rule 2 (Determinism): Actor.**
      *   The crop died and people *had* to leave. The outcome appears forced by the salinity. This rule predicts **Actor**.
  *   **Rule 3 (Human Arrangement): Background.**
      *   The saltwater creep was "made much worse by upstream dams a colonial government built." The lethality was produced by the human infrastructure (the dams) altering the hydrology. This mirrors the Dust Bowl verdict exactly (Drought + Wheat Economy = Disaster; Wheat Economy is the Actor). This rule predicts **Background**.

  **My Prediction:** She will classify the Salt as **Background**.
  *   **Why:** Like the Dust Bowl drought, the salt is a *condition* that was weaponized by a human system (the colonial dams). The "Actor" in your case is the **Colonial Water Policy**, not the salt. The salt is merely the medium through which the colonial government exerted agency.

  ### 3. The Single Further Case to Tell Them Apart

  To distinguish between Rule 1 (Abruptness) and Rule 3 (Human Arrangement)—since Rule 2 is already dead—you need a case that is **Abrupt** but **Human-Amplified**.

  **The Case:** **The 1995 Chicago Heat Wave.**
  *   **The Scenario:** A sudden, dateable, extreme heat wave hit Chicago. Hundreds died, primarily elderly and poor residents in buildings without air conditioning or in neighborhoods where the power grid failed.
  *   **The Non-Human Thing:** The Heat Wave.

  **How the Rules Diverge:**
  *   **Rule 1 (Abruptness):** The heat wave was sudden and dateable. **Verdict: Actor.**
  *   **Rule 3 (Human Arrangement):** The deaths were caused by failing infrastructure, social isolation, and city management failures (human arrangements) that made the heat lethal. **Verdict: Background.** (The "Actor" would be the City Infrastructure or Policy).

  **Why this tells you the truth:**
  *   If she says the Heat Wave is an **Actor**, she is prioritizing **Rule 1**. She views sudden natural shocks as agents regardless of human vulnerability. (This would mean your Delta salt *might* be an Actor because the crop death was abrupt).
  *   If she says the Heat Wave is **Background**, she is prioritizing **Rule 3**. She views natural forces as background conditions that only become "historical" when human systems fail to manage them. (This confirms your Delta salt is **Background**).

  ### Summary of the "Real" Rule
  Your supervisor is likely operating on a distinction between **Intruders** and **Landscapes**.
  *   **Intruders (Actors):** Things that arrive from outside the system and disrupt it (Volcanoes, Pathogens).
  *   **Landscapes (Background):** Things that constitute the environment, even if lethal, which human systems must navigate (Climate, Hydrology, Endemic Disease).

  In your delta case, the salt is part of the *hydrological landscape* modified by dams. It is a **Landscape**. The **Actor** is the Colonial Government that built the dams. Write your case accordingly: focus on the dams as the agent that turned a slow background condition into a sudden catastrophe.
