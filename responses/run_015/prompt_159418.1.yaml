      *   *Caution:* Don't claim ML *solves* the hard problem. Claim ML *reframes* it as a structural question.
      *   *Residue:* Be careful not to dismiss qualia too easily. Acknowledge that ML has no "sensor" for qualia, only behavior.

  10. **Final Polish:** Ensure the distinction between *functional equivalence* and *ontological claim* is sharp in the residue section. (Proceed to generate output).

  *(Self-Correction Note on "Flagging Imports"):* I need to be very clear when I say "The residue suggests X is empty." That is a philosophical stance (Illusionism/Functionalism), not a translation fact. I will explicitly label these moments.

