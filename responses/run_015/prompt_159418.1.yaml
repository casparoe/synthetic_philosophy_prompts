      *   If the theory relies on *separateness* for consciousness, distillation kills it. If it relies on *information availability*, distillation preserves it.
      *   This suggests the philosophical distinction is largely architectural/implementation-bound, not fundamental.

  7.  **Addressing RLHF:**
      *   RLHF optimizes for *verbal report* of uncertainty.
      *   Does it optimize for the *internal state* of uncertainty?
      *   If the probe detects uncertainty activations, yes. If it's just surface-level token probability shaping, maybe not.
      *   Likely: It builds a "monitor head" behavior, but whether that head is *connected* to the actual epistemic state depends on interpretability checks (probing).

  8.  **Final Review against Constraints:**
      *   Did I cover all variants? Yes.
      *   Did I cover objections? Yes.
      *   Did I answer the distillation/RLHF question? Yes.
      *   Is there a Residue Report? Yes.
