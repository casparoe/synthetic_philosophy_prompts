  3.  **Drafting the Translations (Iterative Process):**

      *   *HOT (Thought-ish):* A specific latent vector $z_1$ exists. A separate head $H$ takes $z_1$ as input and outputs a classification "I am seeing $z_1$". Consciousness = $H(z_1)$ is active.
      *   *HOP (Inner Sense):* Instead of a discrete classification, it's a continuous reconstruction or dense probe. Like an autoencoder bottleneck trying to reconstruct $z_1$. Consciousness = High fidelity reconstruction available to the system.
      *   *SOR (Self-Rep):* The vector $z_1$ contains within its own embedding the information "I am $z_1$". No separate head. The representation is self-referential.
