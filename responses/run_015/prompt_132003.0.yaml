answer: |-
  Occasionalism describes a system architecture where objects are stateless data containers and a single centralized Runtime handles all logic execution and state mutations directly, ignoring any methods defined on the objects themselves.

  ### The Software Translation

  Imagine your backend is not a distributed system of microservices calling each other via APIs, but a single-threaded application running an infinite `while(true)` event loop. In this system, your domain models (Fire, Cotton, Wood) are not classes with behavior; they are plain data structures (POCOs/DTOs) with public fields but zero methods. They have no encapsulated logic.

  When you instantiate `Fire` and move it into the same memory space as `Cotton`, the `Fire` object does not execute a `.burn()` function on the `Cotton` object. There is no method call, no message passing, and no side effect triggered by the `Fire` instance. Instead, the central Runtime intercepts the state change where `Fire.position == Cotton.position`. The Runtime consults a master configuration rulebook and directly mutates the `Cotton.state` field to `BURNT`.

  From the perspective of the `Cotton` object, the state mutation appears to come from the `Fire`, but the stack trace reveals the change originated entirely from the Runtime's main loop. Dependency Injection is inverted: objects do not hold references to each other's capabilities; the Runtime injects the resulting state into whatever objects exist at that specific tick. Existence itself relies on the Runtime holding a strong reference to the object during the current cycle; if the Runtime stops referencing an object between ticks, it is garbage collected out of existence, requiring the Runtime to explicitly re-instantiate it every single frame to maintain continuity.

  ### Residue Report

  **What Maps Cleanly**
  *   **Discrete Time Steps:** The philosophical concept of "atoms of time" maps directly to the event loop tick or clock cycle.
  *   **Stateless Data:** The denial of causal power maps to removing methods from classes, leaving only properties.
  *   **Centralized Executor:** The Divine Will maps to the Runtime/Kernel having exclusive write access to memory, bypassing object encapsulation.
  *   **Continuous Creation:** The idea that existence must be sustained moment-to-moment maps to a garbage collector that runs every millisecond, requiring the Runtime to actively keep objects alive.

  **What You Had to Warp**
  *   **Determinism vs. Will:** In code, the Runtime follows deterministic logic (if X, then Y). In occasionalism, the Runtime acts via Will, meaning the "rulebook" could change arbitrarily without breaking the system, whereas in your model, changing the logic without deploying a new build is a bug.
  *   **Interception:** You have to imagine the Runtime intercepting *every* potential interaction, which implies an overhead and latency that doesn't exist in the philosophical claim; the "interception" is instantaneous and ontological, not computational.

  **What Is Completely Untranslatable**
  *   **Logical Necessity:** In software, you define the cause-and-effect relationship in the code. Ghazali is arguing about why we *think* that relationship exists in reality. Code doesn't question its own logic; philosophy questions the compilation process itself.
  *   **The "Why" of Execution:** In your model, the Runtime executes because the machine is on. In occasionalism, the Runtime executes because it *wills* to, which is a category of agency that software simulates but does not possess.

  ### Evaluation: Missing Model or Vague Philosophy?

  The leftover stuff shows your programming mental model is missing a distinction between **sequence** and **consequence**. In your backend, if function A calls function B, you assume A has the power to trigger B because you wrote the API contract that way. You treat causation as an implemented feature. Ghazali is arguing that causation is not a feature of the objects (the code), but a feature of the execution environment (the hardware/runtime).

  This isn't vagueness on his part; it's a limitation of your model. Your model assumes that because `fire.burn(cotton)` works in the test suite, the `fire` object possesses the capability `burn`. Ghazali argues that passing the test suite only proves the Runtime is configured to make the test pass, not that the object has the method. The untranslatable residue is the **normative expectation** of causation—the belief that the future *must* resemble the past because of object properties—whereas your code only knows that the future *does* resemble the past because the logic says so. You are missing the conceptual space where the logic could be decoupled from the objects entirely, which is exactly what occasionalism proposes.
