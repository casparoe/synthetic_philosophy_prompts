prompt: |-
  For the past six years I've chaired the volunteer board of a mid-sized community arts center, and every quarter we face the same kind of meeting: one or more projects we're already deep into, and the question of whether to keep funding them. Recent examples include a membership database migration that is about sixty percent complete with vendor costs ballooning, a co-production with a neighboring theater that is behind schedule and under-subscribed, and the annual winter festival that reliably loses a few thousand dollars but that our community is visibly attached to. In these meetings, board members argue by pointing at how much we've already spent and how much we'd be "throwing away" by stopping, and for years my reflex has been to slap that down with a rule I picked up somewhere: the money is gone either way, sunk costs are irrelevant, and the only thing that matters is a clean comparison of future costs against future benefits.

  Lately, though, I've stopped trusting my own slap-down. Some of the reasons people give for continuing do seem to track the past in ways that might be legitimate rather than confused. Donors who funded the first phase of a project will reasonably wonder about us if we abandon it midway. Stopping and later restarting carries real costs that a simple forward-looking comparison leaves out. There's also something to the thought that our earlier selves spent that money while holding information we may have forgotten, and that discarding their decision for free is its own kind of waste. And I've noticed the pure rule cuts the other way too: anyone who wants to kill a project can reframe every dollar already spent as "sunk" and thereby win the argument without ever discussing what the project is worth going forward. So I no longer believe the question is simply whether honoring sunk costs is rational or irrational; I suspect the real question is when and in what form the past should enter the decision, and I don't have a systematic way of answering it. I have no background in economics or philosophy, so I'm missing whatever structure this question actually has.

  What I'd like is a procedure the board can actually run at one of our quarterly meetings — ninety minutes, seven volunteers with no training, decisions in the range of five to fifty thousand dollars, and a need to leave the meeting with a written one-page record for the minutes. It should be an ordered set of questions, with some indication of what counts as a sufficient answer to each, the points at which it yields a recommendation to continue or stop, and the points at which it has to hand the decision back to us because the question is one of values rather than facts. Crucially, it should separate the genuine fallacy from the reasons for continuing that survive scrutiny — reputational commitments, restart costs, the information embodied in past spending, effects on partners and staff — and say how each of those should be weighed rather than just named. Then run it on three cases: the database migration, the under-subscribed co-production, and the beloved money-losing festival. I'd like you to be honest about where the procedure will misfire, which steps are judgment calls dressed up as procedure, and at least one case where the answer it gives goes against what the board — or frankly, what I — would prefer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Chair of a volunteer board for a mid-sized community arts center (6 years tenure).
      *   **Problem:** Quarterly meetings involve deciding whether to continue funded projects (database migration, co-production, winter festival).
      *   **Current Approach:** Strictly enforcing the "Sunk Cost Fallacy" rule (ignore past spend, look only at future costs/benefits).
      *   **New Insight:** The user realizes this strict rule is too blunt. It ignores reputational risk, restart costs, institutional memory, and partner relationships. It also allows project killers to hide behind the "sunk cost" label.
      *   **Goal:** A practical, 90-minute procedure for 7 untrained volunteers to decide on projects ($5k-$50k range) with a one-page written record.
      *   **Requirements:**
          *   Ordered set of questions.
          *   Indication of sufficient answers.
          *   Decision points (Continue/Stop/Value Judgment).
          *   Distinguish genuine fallacy from legitimate past-dependent factors (reputation, restart costs, etc.).
          *   Apply the procedure to three specific cases (Database, Co-production, Festival).
          *   Honest critique of the procedure (where it misfires, judgment calls, uncomfortable outcomes).
      *   **Constraints:** No econ/philosophy background needed for the board. Needs to be actionable.

  2.  **Analyze the Core Tension:**

      *   *Economic Theory:* Sunk costs are irrelevant to marginal decision-making. Only future utility vs. future cost matters.
      *   *Organizational Reality:* Past actions create present constraints (contracts, trust, morale, momentum). Ignoring them is actually *irrational* in a social context.
      *   *The Solution:* We need a framework that treats "Sunk Costs" not as money to be recovered, but as *signals* or *constraints* affecting the future. The past matters only insofar as it changes the *future* equation.

  3.  **Drafting the Procedure (The "Sunk Cost Audit"):**

      *   *Time Limit:* 90 minutes total. Needs to be tight.
      *   *Structure:*
          1.  **Fact Base (15 mins):** Establish the numbers (Future Cost, Future Benefit).
          2.  **The "Sunk" Filter (30 mins):** This is the core. We need to translate "past spend" into "future consequence."
              *   Question A: Reputation/Trust (Donors/Partners).
              *   Question B: Restart/Switching Costs.
              *   Question C: Institutional Learning (Did we learn something valuable?).
          3.  **The Net Future Value Calculation (30 mins):** Combine Step 1 and Step 2.
          4.  **The Value Judgment (15 mins):** Where numbers don't decide.
      *   *Output:* One-page record.

      *Refining the Questions:*
      *   Instead of "How much did we spend?", ask "If we stop, what happens to the people who gave that money?"
      *   Instead of "We're 60% done," ask "What is the cost to finish vs. cost to start over elsewhere?"
      *   Instead of "We love this," ask "What is the cost to community morale if this vanishes?"

  4.  **Developing the Three Cases:**

      *   **Case 1: Database Migration (60% complete, costs ballooning).**
          *   *Standard Sunk Cost View:* Stop if Future Cost > Future Benefit.
          *   *Nuanced View:* Is there a switch cost? Is the vendor relationship toxic? Did we learn we need a simpler system?
          *   *Likely Outcome:* Stop or Pivot. The "sunk" argument usually fails here unless switching is impossible.
      *   **Case 2: Co-production (Behind schedule, under-subscribed).**
          *   *Standard View:* Cut losses.
          *   *Nuanced View:* Partner theater relationship. If we bail, do we burn a bridge for future collaborations?
          *   *Likely Outcome:* Continue (minimally) to preserve relationship, or Renegotiate.
      *   **Case 3: Winter Festival (Loses money, community loves it).**
          *   *Standard View:* Stop (Negative ROI).
          *   *Nuanced View:* "Benefit" isn't just ticket sales. It's goodwill, donor retention, mission alignment.
          *   *Likely Outcome:* Continue, but reframe the "loss" as "marketing/mission cost."

  5.  **Critiquing the Procedure (Honesty Check):**

      *   *Where it misfires:* It can't quantify reputation perfectly. It relies on honest estimation of "future costs."
      *   *Judgment Calls:* Valuing "community attachment" is subjective.
      *   *Uncomfortable Outcome:* The procedure might say "Kill the Festival" if the financial hole is too deep, or "Keep the Database" if the switch cost is hidden. I need to pick one where the logic conflicts with intuition. Let's make the Database case the uncomfortable one—maybe the procedure says "Keep going" because switching vendors is legally impossible, even though everyone wants to quit. Or, conversely, the Festival gets cut because the "future benefit" can't be monetized enough to justify the loss, despite community love. Let's go with the Festival: The procedure might force a hard look at whether the "love" translates to *sustainability*. If it doesn't, the procedure says cut it. That hurts.

  6.  **Writing the Response:**

      *   *Tone:* Professional, empathetic, structured, practical. Avoid jargon.
      *   *Section 1: The Procedure (The "Future-Consequence Audit").* Break it down by time and question.
      *   *Section 2: Application to Cases.* Walk through the three scenarios.
      *   *Section 3: Critique/Limitations.* Be honest about the flaws.

      *(Self-Correction during drafting)*: Make sure I explicitly address the user's insight about "earlier selves." That's about *information asymmetry*. If we stop, do we lose the knowledge gained? I need to include a step on "Knowledge Retention."
      Also, ensure the "One-Page Record" requirement is met in the procedure design.

      *(Refining the "Sunk Cost" distinction)*: I need to be very clear: Money spent is *never* a reason to continue. But *consequences of stopping* (which are caused by money spent) *are* reasons. The procedure must enforce this distinction.

      *(Final Polish)*: Check the timing. 90 minutes is tight for 3 cases. The procedure should be designed for *one* major decision per meeting, or a rapid triage of all three. The prompt implies running it on the three cases *now* for the user, but the procedure is for future meetings. I will design the procedure for a single decision item to ensure depth, but demonstrate its application on all three here. Actually, the prompt asks for a procedure the board can run... then "run it on three cases." I will structure the procedure to handle one item deeply, but show how it applies to the three examples in the analysis section.

      *Wait, one more thing:* The user wants to know "points at which it has to hand the decision back to us because the question is one of values rather than facts." I need to highlight a "Value Gate" in the procedure.

      *Let's finalize the Procedure Steps:*
      1. Define the "Next Step" (Future Cost).
      2. Define the "Next Value" (Future Benefit).
      3. The "Stopping Penalty" (Reputation, Contracts, Morale).
      4. The "Switching Cost" (Restarting elsewhere).
      5. The Value Gate (Mission Alignment).
      6. Decision.

      *Let's finalize the Critique:*
      1. Quantification bias (what gets measured gets valued).
      2. Groupthink risk in the "Value Gate."
      3. The "Zombie Project" risk (always passing the Value Gate).

      *Uncomfortable Outcome:* The Festival. The procedure might reveal that the "community attachment" doesn't actually translate to donations or attendance elsewhere, making it a pure drain that endangers the core mission. The board *wants* to save it, but the audit says it's a luxury they can't afford.

  7.  **Final Review against constraints:**
      *   90 mins? Yes, keep steps timed.
      *   7 volunteers? Yes, keep language simple.
      *   One-page record? Yes, include a template.
      *   Separate fallacy from valid reasons? Yes, via the "Stopping Penalty" step.
      *   Honest about misfires? Yes, in the critique section.

      *Ready to write.*
answer: |-
  Here is a procedure designed for your specific context: a volunteer board, limited time, and decisions where financial and social values collide. It is called the **Future-Consequence Audit**.

  It is built on a single principle: **The money spent is dead. The consequences of stopping are alive.** The procedure does not ask "Is the past spend justified?" It asks "Does stopping now create a new future cost that outweighs the savings?"

  ### Part 1: The Procedure (90 Minutes)

  **Preparation (Before the Meeting):**
  The Chair (you) must prepare a "Decision Packet" for each project. It must contain:
  1.  **Completion Cost:** Exact dollars needed to finish the current phase.
  2.  **Completion Value:** Tangible benefits of finishing (revenue, hours saved, tickets sold).
  3.  **Termination Cost:** Penalties for breaking contracts, severance, or vendor fees.
  4.  **Restart Cost:** Estimated cost to achieve the same goal via a different path later.

  **The Meeting Agenda:**

  **Step 1: The Baseline Calculation (15 Minutes)**
  *   **Question:** If we ignore everything except the bank account for the next 12 months, is the *Completion Cost* lower than the *Completion Value*?
  *   **Sufficient Answer:** A simple "Yes" or "No" based on the numbers in the packet.
  *   **Outcome:**
      *   If **Yes**: Recommendation is **CONTINUE**. (Skip to Step 4 to confirm).
      *   If **No**: Move to Step 2.
  *   *Note:* This isolates the pure economic loss. If the project makes money going forward, the sunk cost argument is irrelevant; you should finish it.

  **Step 2: The Stopping Penalty (30 Minutes)**
  *   **Goal:** Convert "sunk cost feelings" into "future consequences."
  *   **Question A (Reputation):** If we stop, will specific donors or partners withdraw future support? Can we name them?
      *   *Sufficient Answer:* "Donor X pledged $10k for Phase 2 contingent on Phase 1 completion" (Valid) vs. "People might think we're flaky" (Invalid/Vague).
  *   **Question B (Switching):** If we stop, do we lose the ability to restart later? Is the *Restart Cost* significantly higher than the *Completion Cost*?
      *   *Sufficient Answer:* "Vendor contract locks us in; breaking it costs more than finishing" (Valid) vs. "We've put work in, so we should finish" (Invalid).
  *   **Question C (Morale/Staff):** Will stopping cause key staff or volunteers to quit?
      *   *Sufficient Answer:* "Project Lead has stated they will resign if cancelled" (Valid) vs. "Staff will be disappointed" (Invalid).
  *   **Outcome:** Sum the dollar value of these penalties. Add this to the *Completion Cost* from Step 1.
      *   *Example:* If finishing costs $20k, but breaking the contract costs $30k, the "Cost to Stop" is higher.
      *   *Decision Point:* If *Cost to Stop* > *Completion Cost*, Recommendation is **CONTINUE** (as the lesser of two financial losses). If *Completion Cost* is still lower, move to Step 3.

  **Step 3: The Value Gate (30 Minutes)**
  *   **Goal:** Acknowledge that some costs are worth incurring for mission reasons. This is where you hand the decision back to human judgment.
  *   **Question:** Does this project fulfill a core part of our Mission Statement that cannot be achieved elsewhere?
  *   **Procedure:** Each board member votes "Yes" or "No" on Mission Alignment. No debate on finances allowed here.
  *   **Sufficient Answer:** A vote count.
  *   **Decision Point:**
      *   If **Majority Yes**: The project is a **Mission Subsidy**. Recommendation is **CONTINUE**, but must be labeled as a "Loss Leader" in the budget.
      *   If **Majority No**: Recommendation is **STOP**. There is no financial or mission justification.

  **Step 4: The Record (15 Minutes)**
  *   **Goal:** Create the one-page minute record.
  *   **Template:**
      1.  **Project:** [Name]
      2.  **Financial Outlook:** [Profit/Loss if continued]
      3.  **Stopping Penalties Identified:** [List specific contract/reputation costs]
      4.  **Mission Vote:** [X Yes, Y No]
      5.  **Final Decision:** [Continue/Stop/Pivot]
      6.  **Rationale:** [One sentence: e.g., "Continued despite loss due to Mission Vote, classified as Loss Leader."]

  ---

  ### Part 2: Running the Audit on Your Three Cases

  Here is how the procedure handles your current dilemmas. I have made reasonable assumptions about the hidden data you likely possess.

  #### Case 1: The Database Migration (60% complete, costs ballooning)
  *   **Step 1 (Baseline):** Completion Cost is high. Completion Value (efficiency) is uncertain. **Result:** Financial Loss. Move to Step 2.
  *   **Step 2 (Stopping Penalty):**
      *   *Reputation:* Low. Donors gave for "tech upgrade," not specifically this vendor.
      *   *Switching:* High. You likely owe the vendor for work done. However, is the *Completion Cost* lower than the *Termination Fee*? Often in software, paying to exit is cheaper than paying to finish a broken build.
      *   *Morale:* Staff are frustrated. Stopping might actually *improve* morale.
  *   **Step 3 (Value Gate):** Is having *this* database core to the mission? No. Having *a* database is.
  *   **Audit Recommendation:** **STOP.**
  *   **Why:** The "sunk cost" of 60% completion is irrelevant. Unless the contract forces you to pay more to quit than to finish, the rational move is to terminate, write off the loss, and restart with a simpler system. The procedure strips away the "we're so far along" emotion.

  #### Case 2: The Co-Production (Behind schedule, under-subscribed)
  *   **Step 1 (Baseline):** Completion Cost (marketing + production) > Ticket Revenue. **Result:** Financial Loss. Move to Step 2.
  *   **Step 2 (Stopping Penalty):**
      *   *Reputation:* High. The neighboring theater is a partner. Abandoning a co-production mid-stream is a breach of professional etiquette that could blacklist you from future collaborations.
      *   *Switching:* N/A (It's a one-off event).
      *   *Morale:* High risk. Actors and directors are already rehearsing.
  *   **Audit Recommendation:** **CONTINUE.**
  *   **Why:** This is a case where the "sunk cost" feeling is actually a proxy for **Relationship Liability**. The cost to stop isn't just the money lost; it's the destruction of a strategic partnership. The procedure forces you to book the loss as a "Partnership Maintenance Cost" rather than a failed project.

  #### Case 3: The Winter Festival (Reliable loss, community attached)
  *   **Step 1 (Baseline):** Completion Cost > Revenue. **Result:** Financial Loss. Move to Step 2.
  *   **Step 2 (Stopping Penalty):**
      *   *Reputation:* High. Community attachment is real.
      *   *Switching:* If you kill it, can you bring it back? Probably not. The momentum dies.
  *   **Step 3 (Value Gate):** Does this fulfill the mission? "Community Arts Center." Yes, it is highly visible community engagement.
  *   **Audit Recommendation:** **CONTINUE (as Loss Leader).**
  *   **Why:** The procedure validates the "community attachment" not as a sunk cost, but as a **Mission Benefit**. However, it requires you to label it a "Loss Leader." This means you must explicitly acknowledge it is being subsidized by other profitable activities.

  ---

  ### Part 3: Critique and Limitations

  You asked for honesty about where this procedure will misfire, where it disguises judgment as process, and where it might give an answer you dislike.

  **1. The "Quantification Bias" Trap (Where it misfires)**
  Step 2 requires you to put dollar values on reputation and morale. Volunteers are terrible at this. They will either overestimate reputation risk ("Everyone will hate us!") or underestimate it ("Who cares?").
  *   *The Fix:* In Step 2, require specific names. "Donors will leave" is invalid. "The Smith Family Foundation, who gives 10% of our budget, has verbally tied their grant to this project" is valid. If you can't name the money, the risk doesn't count.

  **2. The "Mission Creep" Judgment Call (Disguised judgment)**
  Step 3 (The Value Gate) is where the procedure admits it can't solve the problem with math. It relies on the board's interpretation of "Mission."
  *   *The Risk:* A board can justify *anything* as "Mission." If the board is emotionally attached to the Festival, they will vote "Yes" on Mission Alignment every time, rendering the financial limits useless.
  *   *The Fix:* You need a cap. The procedure should state: "Loss Leaders cannot exceed X% of the annual budget." If the Festival loss pushes you over the cap, the Mission Vote is overridden by solvency.

  **3. The Uncomfortable Outcome (The Festival)**
  Here is the case where the procedure might tell you something you don't want to hear.
  *   **Scenario:** Imagine the Winter Festival loss has grown from "a few thousand" to $40,000.
  *   **The Audit:**
      *   Step 1: Massive Loss.
      *   Step 2: Stopping Penalties are vague ("Community will be sad"). No specific donors are threatening to leave *if* the festival stops, they just love the festival.
      *   Step 3: Mission Vote is "Yes."
      *   **The Constraint:** Your budget cap for Loss Leaders is 5%. The Festival now requires 10% of the budget to sustain.
  *   **The Recommendation:** **STOP.**
  *   **Why it hurts:** You know the community loves it. You know it feels like the heart of the center. But the procedure reveals that the "community attachment" has not been monetized or leveraged to pay for itself, and it is now actively endangering the rest of the mission.
  *   **The Hard Truth:** The procedure exposes that "community attachment" is a vanity metric unless it translates to sustainability. If the board cannot find a way to make the Festival break even or secure a specific endowment for it, the audit says killing it is the only fiduciary responsible choice. This will feel cold, but it protects the organization from a slow death by a thousand cuts.

  **4. The "Zombie Project" Risk**
  The procedure assumes the board acts in good faith. If a board member champions a project, they may lobby heavily during Step 3 to ensure the "Mission Vote" passes.
  *   *Mitigation:* The Chair (you) must enforce the "No debate on finances" rule in Step 3 strictly. If the discussion drifts to "But we spent so much," you must gavel it down as a Step 1 issue that has already been settled.

  ### Summary for your Minutes
  When you implement this, your minutes will change. Instead of *"Board discussed sunk costs and decided to continue,"* the record will read:
  *"Board acknowledged financial loss of $15k. Board identified $20k in contract termination fees (Stopping Penalty). Board voted 6-1 that project aligns with Mission. Decision: Continue, classified as Loss Leader."*

  This shifts the narrative from "We are confused about the past" to "We are making a calculated investment in the future."
