  **(ii) The internal coherence of Ranke's original ideal:** **0.75**
  *Justification:* Historical analysis suggests Ranke's empiricism was undergirded by theological assumptions about divine intelligibility that are no longer tenable, rendering his original formulation internally unstable.

  **(iii) The viability of the synthesis (avoiding collapse):** **0.70**
  *Justification:* While conceptually sound, maintaining the balance between narrative construction and evidential constraint requires rigorous methodological discipline that is difficult to sustain in practice without slipping into realism or constructivism.

  **(iv) The normative appropriateness of "objectivity" and archive neutrality:** **0.65**
