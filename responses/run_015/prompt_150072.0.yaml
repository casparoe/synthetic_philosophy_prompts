  You are grappling with one of the most difficult problems in the philosophy of history: the tension between **empirical accuracy** and **testimonial justice**. Your existing verdicts are intuitively strong, but they appear contradictory because they shift the authority between memory and record without an explicit rule for *why* the shift occurs.

  To resolve this without *ad hoc* rationalization, you need a principle that distinguishes not just between "memory" and "record," but between the **functions** these narratives serve.

  I propose you adopt **The Principle of Functional Epistemic Authority**.

  This principle holds that authority is not inherent to the source (archive vs. oral tradition) but is assigned based on the **domain of validity** required by the specific claim. There are three distinct domains in your cases: **Constitutive**, **Explanatory**, and **Restorative**.

  ### 1. The Principle Defined

  *   **Domain A: Constitutive (Identity & Ritual).**
      *   *Function:* To bind a community together, define internal meaning, or sustain kinship.
      *   *Authority:* **Community Memory.**
      *   *Constraint:* Must remain internal or ritualistic; cannot make falsifiable material claims on outsiders.
  *   **Domain B: Explanatory (Causal & Mechanical).**
      *   *Function:* To explain *how* events occurred in the material world (economics, logistics, demographics).
      *   *Authority:* **Historical Record.**
      *   *Constraint:* Must be subject to empirical verification; memory yields when it makes falsifiable causal claims in the public sphere.
  *   **Domain C: Restorative (Justice & Sovereignty).**
      *   *Function:* To remedy harm, establish rights, or acknowledge suffering where the Record is complicit in the erasure.
      *   *Authority:* **Community Memory (Presumptive).**
      *   *Constraint:* The Record yields *unless* the Memory is being used to deny the existence of harm (i.e., a "bloodless myth") or inflict new harm on a marginalized group.

  ### 2. Mapping Your Existing Verdicts

  This principle captures your first four verdicts without contradiction:

  1.  **Diasporic Expulsion (Constitutive):** The ritual date is for *internal practice*. The shipping logs are for *public history*. You correctly split the authority. Memory rules the ritual (Domain A); Record rules the archive (Domain B).
  2.  **Mill Closure (Explanatory):** This is a claim about economic causality (bankruptcy vs. lockout). It belongs to Domain B. Since it is public pedagogy, the empirical Record overrides the oral tradition, even if the tradition is socially useful.
  3.  **Indigenous Claim (Restorative):** This is a claim of sovereignty against a colonial record that was an instrument of dispossession. This belongs to Domain C. The Record is epistemically compromised by the power structure; Memory prevails as a counter-sovereignty claim.
  4.  **National Revolution (Restorative/Explanatory Hybrid):** The "bloodless myth" denies the *existence* of violence. In Domain C, Memory only prevails if it *reveals* or *acknowledges* harm. Since this Memory *hides* harm to protect state legitimacy, the Record must win to restore the visibility of the victims.

  ### 3. Resolving the Atrocity Number Case

  This is your sticking point. You feel that correcting 4,000 victims to 400 feels like "compounding the violence."

  Under the **Principle of Functional Epistemic Authority**, this case is a **Restorative (Domain C)** issue, not purely Explanatory.
  *   **The Conflict:** The forensic record (400) is empirically secure (Domain B), but the community memory (4,000) carries the weight of collective trauma and moral recognition (Domain C).
  *   **The Resolution:** You do not need to choose one as "True" and the other as "False." You must assign them **Complementary Authority**.
      *   **For Forensic/Archival Record:** The number 400 stands. To falsify this would be to corrupt the historical record (Domain B).
      *   **For Memorial Policy & Moral Education:** The number 4,000 (or a range acknowledging the uncertainty) prevails. In Domain C, the function is *recognition of suffering*, not demographic accounting. If the forensic count is experienced by survivors as a minimization of their trauma, enforcing it in a *memorial* context violates the principle of Restorative Justice.
  *   **Verdict:** Maintain the split (as you did in Case 1). The archives list 400; the memorial lists 4,000 with a qualifier about collective testimony. You do not drop the forensic number, but you refuse to let it *invalidate* the moral magnitude of the memory. This is consistent with Case 4: In Case 4, the myth denied violence (Record wins). In Case 5, the memory affirms violence (Memory wins for memorial purposes).

  ### 4. The Family Ancestor Case

  *   **The Scenario:** Family remembers "Resistance Fighter"; Record shows "Collaborator." Usage is *only* within kinship rituals.
  *   **Analysis:** This is purely **Constitutive (Domain A)**. It functions like the Diasporic Religious case (Case 1). It makes no public historical claim, seeks no state reparations, and alters no public curriculum.
  *   **Verdict:** **Memory Prevails.** The family has epistemic sovereignty over their own internal narrative of identity. As long as this framing is not deployed to make public claims (e.g., applying for a "resistance veteran" pension or writing a textbook), the archival record has no jurisdiction over the kinship ritual.
  *   **Consistency Check:** This does not require dropping any previous verdicts. It is structurally identical to Case 1 (Internal Ritual vs. Public Record).

  ### 5. Summary of Consistency

  You do not need to abandon any of your earlier judgments. However, to maintain consistency, you must adhere to the following distinctions:

  1.  **Do not allow Domain A (Constitutive) claims to bleed into Domain B (Explanatory).** The family cannot publish the ancestor's resistance as fact in a history book. The religious community cannot claim the shipping logs are wrong, only that they are ritually irrelevant.
  2.  **Do not allow Domain B (Explanatory) to colonize Domain C (Restorative).** The forensic count of 400 victims cannot be used to reduce moral recognition or reparations if the community testimony asserts 4,000. The "truth" of the archive does not automatically cancel the "truth" of the trauma.
  3.  **The "Direction of Harm" Test.** In Restorative cases (3, 4, 5), ask: *Which account minimizes the visibility of suffering?*
      *   Case 4 (Revolution): The Memory minimizes suffering (bloodless). **Record Wins.**
      *   Case 5 (Atrocity): The Record minimizes suffering (400 vs 4,000). **Memory Wins (for memorial purposes).**

  ### Final Recommendation

  Adopt the **Principle of Functional Epistemic Authority**. It validates your intuition that the atrocity number should not simply yield to forensics in the context of memorial policy, because that context is Restorative, not Explanatory. It also gives you a clear "Yes" for the family ancestor case, provided the story stays within the home. Your reflective equilibrium is stable; it just required naming the domains you were already intuitively navigating.
