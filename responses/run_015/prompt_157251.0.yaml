  **MALTHUSIAN CAPITAL, LP**
  **Annual Letter to Limited Partners | 2023**

  **To Our Partners,**

  On the surface, 2023 was a difficult year for the Fund. Global caloric availability reached record highs. Fertility rates in developed markets continued their decline below replacement levels. The anticipated corrective events—what Thomas Malthus termed "positive checks"—did not materialize in the major agricultural zones we monitor. Consequently, the Fund is down 4.2% net of fees.

  However, performance in a long-duration thesis must be measured against structural validity, not short-term noise. We remain convinced that the twentieth century was a statistical anomaly, not a new rule. The Green Revolution did not refute the relationship between population and carrying capacity; it merely obscured it through a one-time subsidy of cheap fossil energy. We treat this period as a borrow against future soil stability. Our **Fossil-Energy Exclusion Clause** allows us to strip out yield gains derived from nitrogen fertilizers and diesel-powered irrigation when calculating the **True Carrying Capacity Utilization (TCCU)** ratio. On a TCCU basis, we are at 94% utilization. The pressure is not absent; it is latent.

  Critics often point to technological innovation as a permanent offset to depletion. We treat human ingenuity as a depleting resource. ^1 ^When ^a ^partner ^asked ^if ^we ^account ^for ^breakthroughs ^like ^vertical ^farming, ^we ^noted ^that ^innovation ^requires ^surplus ^energy ^to ^fund ^R&D. ^As ^surplus ^energy ^declines, ^innovation ^slows. ^We ^are ^not ^betting ^against ^human ^wisdom; ^we ^are ^betting ^against ^infinity.

  Because the thesis is structural rather than temporal, we are adjusting the Fund's liquidity terms. Previously, we argued that the crisis was imminent. We now recognize that "imminent" in geological time differs from "imminent" in quarterly reporting. To align interests, we are introducing a **Malthus Timing Risk Fee**. Partners who redeem prior to the recognition of the thesis will incur a 5% charge. This is not a penalty for leaving; it is a compensation for the Fund bearing the cost of being early. A prediction cannot be falsified by patience. If the check arrives in 2050 rather than 2025, the model was not wrong, only premature.

  We are also refining our definition of scarcity. While famine was the primary check in the 19th century, modern constraints are chemical and hydrological. We are shifting exposure from grain futures to phosphorus mining rights and aquifer access. The misery may not look like starvation; it may look like input cost inflation. Our **Headline Misery Multiple** accounts for this substitution. ^(See ^Appendix ^C ^for ^our ^rejection ^of ^the ^Boserupian ^view ^that ^necessity ^induces ^sufficient ^innovation; ^we ^view ^this ^as ^a ^lagging ^indicator ^of ^distress.)

  We must remind partners that our alpha is correlated with systemic failure. ^It ^is ^uncomfortable ^to ^admit ^that ^our ^success ^condition ^is ^global ^distress, ^but ^transparency ^is ^preferable ^to ^false ^hope. ^We ^do ^not ^profit ^from ^abundance.

  The nineteenth century was the rule; the twentieth was the exception. We are simply waiting for the rule to reassert itself. Please review the updated subscription agreement regarding the extended maturity date. We have removed the sunset clause.

  Sincerely,

  **The Investment Committee**
  Malthusian Capital, LP

  ^1 ^Ingenuity ^is ^treated ^as ^a ^finite ^stock ^in ^our ^models, ^subject ^to ^depreciation ^as ^energy ^costs ^rise.
