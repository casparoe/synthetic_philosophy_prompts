answer: |-
  You're right to be suspicious. That slogan is doing too much heavy lifting. It conflates the *All-Subjected Principle* (ASP) with the *All-Affected Principle* (AAP), and it slides between "coercion" as physical force and "coercion" as structural constraint.

  Here is the conceptual map broken into four distinct readings. Use this to diagnose which argument you're actually making in the moment.

  ### 1. The Territorial-Presence Reading (Conceptual/Physical)
  **The Claim:** If you are physically within the territory where the state monopolizes force, you are subject to its law.
  **The Boundary:** State lines (border control).
  **Why it works:** It's clean. It matches the Westphalian model.
  **The Undocumented:** **Included.** They are physically present and liable to police power.
  **Short-Term Visitors:** **Included.** A tourist is subject to traffic and criminal law while here. (Problem: Do they need a vote on traffic lights? This reading risks over-inclusion).
  **Global Supply-Chain/Refugees:** **Excluded.** They are outside the territory.
  **Verdict:** Survives the state line boundary, but fails to explain *why* presence triggers democratic rights rather than just human rights. It also creates a "tourist suffrage" problem you probably don't want.

  ### 2. The Formal-Jurisdictional Reading (Legal/Conceptual)
  **The Claim:** If the legal system claims authority over you (de jure), regardless of enforcement, you are subject.
  **The Boundary:** The reach of legal statute.
  **Why it works:** It respects the rule of law. You shouldn't be bound by rules you had no hand in making.
  **The Undocumented:** **Included.** Immigration law explicitly governs them (e.g., deportation statutes).
  **Short-Term Visitors:** **Included.** Visas and entry conditions are legal contracts they submit to.
  **Global Supply-Chain/Refugees:** **Excluded.** U.S. labor law doesn't formally claim jurisdiction over a Vietnamese factory worker, even if U.S. trade policy ruins their livelihood.
  **Verdict:** Solid for domestic inclusion, but creates a hard stop at the border. It cannot account for extraterritorial legal reach (e.g., sanctions, drone strikes) without collapsing into Reading 4.

  ### 3. The Coercive-Enforcement Reading (Empirical/Normative)
  **The Claim:** If the state actually imposes sanctions or force on you (de facto), you need authorship to maintain autonomy.
  **The Boundary:** The reach of the police/administrative state.
  **Why it works:** It focuses on the harm of coercion. No coercion, no need for democratic justification.
  **The Undocumented:** **Strongly Included.** They face the highest risk of direct coercive force (detention/deportation).
  **Short-Term Visitors:** **Weakly Included/Excluded.** Depends on stakes. If they aren't facing deportation, the coercive burden is low. You can argue their temporary subjection doesn't warrant full authorship.
  **Global Supply-Chain/Refugees:** **Excluded.** Unless you count economic sanctions as "coercion" akin to police force. Usually, this reading stops at direct physical enforcement.
  **Verdict:** Best for defending undocumented inclusion without opening the floodgates to everyone. It draws the line at *enforcement*, not just presence.

  ### 4. The Structural-Autonomy Reading (Metaphysical/Normative)
  **The Claim:** If the state's legal order structures your life options or basic interests, you are subject to it.
  **The Boundary:** Causal impact (wherever the state's power is felt).
  **Why it works:** It captures the reality of globalization. Laws here create poverty there.
  **The Undocumented:** **Included.**
  **Short-Term Visitors:** **Included.**
  **Global Supply-Chain/Refugees:** **Included.** If U.S. carbon policy causes climate displacement, or trade law dictates labor conditions abroad, those people are "subject" to the structural coercion of the U.S. legal order.
  **Verdict:** **Collapses.** This reading dissolves the state boundary entirely. It turns the *demos* into a global entity. If you use this, you can't argue for *state* democracy; you're arguing for cosmopolitan democracy. It makes the "state lines" boundary arbitrary.

  ---

  ### Summary: State Lines vs. Causal Impact

  | Reading | Boundary Type | Undocumented? | Visitors? | Global Workers? | Stability |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Territorial** | State Lines | Yes | Yes (Too many?) | No | Stable, but arbitrary. |
  | **2. Jurisdictional** | State Lines | Yes | Yes | No | Stable, legalistic. |
  | **3. Enforcement** | State Lines (mostly) | Yes (Strongest) | Maybe (Low stakes) | No | **Most defensible for your position.** |
  | **4. Structural** | Causal Impact | Yes | Yes | Yes | **Unstable.** Erases the state. |

  ### The Trap
  If you want to include the undocumented but exclude the global supply-chain worker, you must stick to **Reading 3 (Coercive-Enforcement)**.

  *   **Reading 1 & 2** let you exclude the global worker, but they force you to give votes to tourists (which seems absurd).
  *   **Reading 4** gives you the moral high ground on climate refugees, but it destroys the premise of a bounded *demos* seminar. It implies there should be no borders at all, which undermines the "closure-only" debate you're trying to engage.

  **Recommendation:** Argue that "subjection" requires *enforceable liability*, not just causal effect. That keeps the boundary at the state's coercive reach (including undocumented folks inside it) without expanding to everyone impacted by U.S. policy abroad.
