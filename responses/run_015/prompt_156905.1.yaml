answer: |-
  ### 1. Exam Question

  **Philosophy of Mind and Moral Psychology: Final Seminar Assessment**
  **Time Allowed:** 45 Minutes
  **Word Limit:** 500–600 Words

  **Prompt:**

  Consider the following two vignettes describing corporate decision-making:

  **(i) The Standard Chairman:** The chairman of a board is presented with a new program. He is told, "This program will increase profits, but it will also harm [or help] the environment." The chairman responds, "I don't care at all about harming [or helping] the environment. I just want to make as much profit as possible." The program is adopted. The environment is harmed [or helped].

  **(ii) The Algorithmic Institution:** A corporation deploys a predictive optimization algorithm to maximize profit. The board forecasts that the algorithm's statistical weight updates will reliably produce a harmful [or helpful] environmental side-effect. However, the board builds no representational state corresponding to this side-effect (it is not a goal, nor is it encoded as a specific belief about the world, merely a statistical inevitability), and the algorithm itself lacks beliefs or desires. The program is adopted. The environment is harmed [or helped].

  In the Standard Chairman case, empirical studies show a robust asymmetry: folk attributions of intentionality are high for the harmful side-effect but low for the helpful one.

  In your essay, evaluate whether this Knobe asymmetry would persist, diminish, or disappear in the **Algorithmic Institution** case. Defend your prediction by analyzing what it implies for two competing explanations of the effect: (1) the **Normative Account** (attributions of intentionality are partly governed by evaluative considerations like blameworthiness) and (2) the **Mental-State Account** (attributions track the causal role of specific beliefs and desires). Do not summarize the vignettes; focus on the theoretical stakes of your prediction.

  ***

  ### 2. Model Answer

  The Knobe effect reveals a fissure in folk psychology: side-effects are deemed intentional when harmful but unintentional when beneficial, despite identical epistemic states regarding the outcome. This asymmetry challenges the Mental-State Account, which posits that intentionality attributions depend strictly on the agent's cognitive architecture (specifically, beliefs and desires). Conversely, the Normative Account suggests that moral valence shapes the application of intentional concepts themselves. To adjudicate between these views, the Algorithmic Institution case serves as a crucial stress test.

  In the Algorithmic case, the asymmetry is likely to persist, though perhaps with diminished intensity. The critical feature of this vignette is the removal of specific representational states regarding the side-effect. The board forecasts the outcome but encodes no desire for it, and the algorithm possesses no mental states at all. If the Mental-State Account were strictly correct, intentionality attributions should collapse in both harm and benefit scenarios. Without a desire to harm or help, and without a belief state representing the side-effect as a goal, the cognitive criteria for intentional action are unmet. Therefore, a strict Mental-State theorist must predict the disappearance of the asymmetry.

  However, if the asymmetry persists—meaning observers still claim the corporation intentionally harmed the environment but did not intentionally help it—it suggests that the presence of specific desires is not necessary for intentional attribution. This outcome severely undermines the Mental-State Account. It implies that folk psychology does not function as a neutral detector of cognitive causation but rather as a tool for moral evaluation. The persistence of the asymmetry supports the Normative Account: because the harm is bad, observers are motivated to assign blame, and they retroactively fit the concept of "intentional" to secure that blame. The lack of a specific representational state becomes irrelevant because the moral need for an accountable agent overrides the cognitive technicalities.

  Yet, a prediction that the asymmetry *diminishes* rather than remains robust points toward a hybrid view. The mediation of the algorithm introduces a distance between the board's agency and the outcome. If attributions drop slightly compared to the Standard Chairman, it indicates that mental states do play *some* role; the cognitive connection matters, even if it is not decisive. This nuance is vital. A pure Normative Account might struggle to explain why the algorithmic mediation weakens the effect at all, as the moral valence of the outcome remains constant.

  Therefore, the most defensible position is that the asymmetry persists but weakens. This pattern suggests that while normative considerations are the primary driver of the Knobe effect (supporting the Normative Account), the Mental-State Account captures a secondary constraint. Folk attributions require a minimal threshold of agency, which is diluted by the algorithmic black box. Ultimately, the Algorithmic Institution case demonstrates that intentionality is not a natural kind discovered in the mind, but a normative concept applied to agents. The fact that we hold the corporation responsible for harm despite the lack of specific representational states confirms that our concept of intention is inextricably linked to our practices of praise and blame, rather than merely tracking the mechanical presence of beliefs and desires.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Grading Bands:**
  *   **A (21–25):** All five conceptual moves present with precise distinctions; argument is cohesive and directly addresses the theoretical stakes.
  *   **B (16–20):** Solid grasp of vignettes and one explanation; misses the institutional-application argument or the comparative evaluation of the two accounts.
  *   **C (11–15):** Describes the effect correctly but fails to apply it to the algorithmic case or conflates the two theoretical accounts.

  | Conceptual Move | Marks | Typical Failure Mode |
  | :--- | :---: | :--- |
  | **1. Accurate Characterization of the Asymmetry**<br>Identifies the core phenomenon: identical epistemic states yield different intentionality judgments based on moral valence (Harm=Intentional, Help=Unintentional). | 5 | **Summary Trap:** Merely retelling the Chairman vignette without isolating the *asymmetry* as the philosophical problem. |
  | **2. Distinction Between Theoretical Accounts**<br>Clearly defines the Mental-State Account (tracks cognitive causation/belief-desire) vs. the Normative Account (tracks blameworthiness/evaluative judgment). | 5 | **Conflation:** Treating the Normative Account as simply "being mean" or failing to see it as a claim about the *concept* of intentionality itself. |
  | **3. Application to Algorithmic Case**<br>Makes a specific prediction (persist/diminish/disappear) regarding the algorithmic vignette and justifies it based on the lack of representational states. | 5 | **Dismissal:** Rejecting the case because "algorithms have no minds" without addressing why this specifically tests the *attribution* mechanism rather than metaphysical agency. |
  | **4. Theoretical Implication**<br>Explains how the prediction in (3) weighs on the competing accounts (e.g., if it persists, Mental-State is undermined; if it vanishes, Normative is undermined). | 5 | **Non-Sequitur:** Making a prediction but failing to link it back to the validity of the Normative or Mental-State explanations. |
  | **5. Synthesis/Nuance**<br>Avoids binary thinking; acknowledges complexity (e.g., hybrid view, or the role of agency dilution) in the conclusion. | 5 | **Dogmatism:** Insisting one theory is completely correct without acknowledging the tension or the nuance of the "diminished" prediction. |
