  - Theatre term or idea
  - Claim it is being used to translate
  - Fit — one of: clean, distorted, no counterpart
  - What is lost or forced in the translation
  - Where the fault lies — one of: the theatre vocabulary is too thin, the original claim was under-specified, or a genuine surprise

  End with a single line under the table giving your overall verdict on whether the agents-versus-simulators dispute is substantive or mostly verbal.
