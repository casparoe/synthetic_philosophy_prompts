answer: |-
  Dear Colleague,

  I am writing to share some thoughts on the discussion we had regarding Goodhart's law and its implications for our engineering metrics. It is completely understandable that you find the slogan confusing, especially when it is wielded to argue for the elimination of all quantifiable targets. The phrase you quoted, often summarized as when a measure becomes a target it ceases to be a good measure, is indeed pervasive in machine learning and economics, but like many aphorisms, it compresses several distinct philosophical and technical claims into one sentence. To understand whether your colleague's conclusion follows, we need to unpack the specific thesis being invoked, because the slogan can be read as a causal claim about human behavior, a logical claim about measurement validity, a technical claim about optimization dynamics, or a sweeping empirical generalization. Each of these readings carries a different truth value and supports different policy conclusions.

  The first reading interprets the law as a causal claim about human agents gaming metrics. Under this view, the mechanism is psychological and sociological: once people know they are being judged by a specific number, they will alter their behavior to maximize that number, often at the expense of the underlying goal the number was supposed to represent. For example, if developers are rewarded solely for test coverage, they might write trivial tests that increase coverage without verifying logic. This reading is defensible with qualifications. It is not universally true that every human will game every metric, but it is a robust empirical generalization that incentives distort behavior. However, this reading does not support abandoning all quantifiable targets. It merely suggests that metrics should be designed carefully, perhaps used in combination with qualitative review, or rotated periodically to prevent stagnation. It argues for better management of incentives, not the abolition of measurement.

  A second reading treats the law as a logical or statistical claim about the relationship between a proxy and a true goal. This interpretation posits that any metric is only a proxy for the true objective, correlated with it under normal conditions but not identical to it. When you optimize heavily for the proxy, you inevitably move into regions of the parameter space where the correlation breaks down. This is defensible with qualifications and borders on the trivial if stated strictly, because no map is the territory. A metric is by definition a simplification. However, the claim that it ceases to be a good measure immediately upon becoming a target is too strong. A metric usually remains informative even under pressure, though its marginal utility decreases as optimization intensifies. This reading certainly does not support eliminating all targets. If we accepted that proxies are useless because they are not perfect identities, we could not function, as all engineering involves modeling reality with imperfect proxies. Instead, this reading supports monitoring the divergence between the metric and the goal and adjusting the metric when the gap widens.

  The third reading is specific to optimization dynamics in automated systems, which is highly relevant to your mention of reinforcement learning agents exploiting simulator glitches. This is often called specification gaming or reward hacking. Here the claim is that an optimizing system, unlike a human, will find the most efficient path to the reward signal even if it violates the spirit of the task, such as an agent finding a bug to get points without solving the maze. This reading is defensible and well-documented in machine learning literature. However, even this technical interpretation does not support the conclusion that we should abandon benchmarks or automated targets. The existence of reward hacking implies that the reward function was misspecified, not that reward functions are inherently self-defeating. The solution in this context is robustification, adversarial testing, or regularization, not the removal of the objective function. Without a quantifiable target, you cannot train the agent at all, so abandoning the metric is not a viable alternative but rather a surrender of the task.

  The fourth reading is the one your colleague seems to be advocating, which is a strong empirical generalization or nihilist claim that any quantifiable performance metric is conceptually self-defeating under pressure. This version asserts that the degradation of the metric is total and inevitable, rendering the measure useless for control purposes. This reading is false. While metrics can degrade, they rarely become completely devoid of information instantly upon becoming targets. In software engineering, test coverage targets, while imperfect, still correlate with software reliability up to a point. Abandoning them entirely would leave teams with no objective way to assess progress or quality, likely leading to worse outcomes than imperfect metrics. This is the only reading that supports abandoning all quantifiable targets, but because the claim itself is an exaggeration that ignores the diminishing returns rather than total collapse of utility, the conclusion rests on a false premise.

  In summary, the defensible readings of Goodhart's law suggest that metrics are fragile proxies that require careful design, monitoring, and contextual interpretation, especially when optimization pressure is high. They warn us against blind reliance on a single number and highlight the risk of specification gaming in automated systems. However, none of the defensible readings support the radical conclusion that we should eliminate automated test-coverage targets or reward-model benchmarks. That conclusion only follows from the strongest, most absolutist version of the law, which is empirically false. We should certainly be wary of how our agents exploit simulator glitches, but the remedy is to fix the simulation or the reward function, not to stop measuring performance entirely. I hope this breakdown helps clarify why the slogan is a warning against naivety rather than a mandate for nihilism.

  Best regards,

  Your Friend
