      *   *Relocation:* However, the problem might relocate to the relationship between $M$ and $P$. If $P$ is the "derivative" cause, does it satisfy Causal Closure? Closure says every physical effect has a *sufficient physical cause*. If the physical cause is merely derivative of the mental, is it still sufficient *qua* physical?
