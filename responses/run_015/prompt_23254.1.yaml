answer: |-
  This is a sharp distinction to draw, and you are right to sense that the literature often blurs them. In my experience, the confusion stems from an ambiguity in what we mean by "cause" (ontological relation vs. explanatory description) and what we mean by "distinct" (numerical distinctness of events vs. distinctness of properties).

  Since you are at the stage where name-dropping (e.g., "Yablo says X," "Kim says Y") is less helpful than structural analysis, I will focus on the metaphysical commitments required to hold each view and how they interact with the premises of the Exclusion Argument.

  Let's label your two moves for clarity:
  1.  **The Priority View (PV):** There is one causal transaction. The mental is the primary/real cause; the physical is a derivative description of that same transaction.
  2.  **The Redundancy View (RV):** There are two causal transactions. Both $M$ and $P$ are sufficient causes of $E$. This is systematic overdetermination, but it is benign.

  Here is a breakdown of how they compare regarding your three specific concerns.

  ### (a) Does the Priority View avoid overdetermination or relocate it?

  The short answer is: **It avoids causal overdetermination but relocates the tension to Causal Closure.**

  **The Avoidance:**
  Overdetermination, strictly speaking, requires two *distinct* sufficient causes for a single effect. If the PV holds that the mental and physical are merely two descriptions of *one underlying causal event* (or that the physical causation is metaphysically dependent on the mental causation in a way that makes them numerically identical as transactions), then there is no competition. There is only one "arrow" hitting the target. Consequently, the Exclusion Principle (which forbids *two* sufficient causes) is not triggered because the antecedent condition ("if an event has more than one sufficient cause...") is false.

  **The Relocation:**
  However, the PV as you described it ("mental cause is real... physical cause is derivative") creates a significant friction with the **Causal Closure of the Physical**.
  Closure states: *Every physical event has a sufficient physical cause.*
  If the PV claims the physical cause is merely "derivative" or "secondary," we must ask: In what sense is it sufficient?
  *   **Option 1:** The physical cause is sufficient, but only *because* the mental cause is. This makes physical sufficiency dependent on mental sufficiency. This risks violating the spirit of Closure, which is usually understood to mean the physical domain is causally self-contained. If physical sufficiency relies on mental sufficiency, the physical domain is not closed; it is open to the mental.
  *   **Option 2:** The physical cause is not *really* a cause in the robust sense; it is a "shadow" of the mental cause. This saves the mental from exclusion but makes the physical epiphenomenal in the strict ontological sense (even if not in the descriptive sense). This is a hard pill for a physicalist to swallow.

  **Verdict:** The PV avoids the *Exclusion* problem (two causes competing) by collapsing the causal relation into one. But it relocates the problem to the *Closure* premise. It forces you to argue that Closure is compatible with physical causes being derivative of mental causes, which is a non-standard reading of physicalism.

  ### (b) Systematic Overdetermination and Empirical Implausibility

  This is the strongest point of divergence between the two views. The worry you cite is that if $M$ and $P$ are distinct sufficient causes, they should be *independently* sufficient. In standard overdetermination cases (e.g., a firing squad), if one shooter misses, the other kills. If mental and physical causation were like this, we should expect cases where $P$ occurs without $M$ (or vice versa) and $E$ still happens. Since $M$ supervenes on $P$, they don't come apart.

  **How the Redundancy View (RV) fares:**
  The defender of RV must argue that the "independence" condition is not necessary for overdetermination to be benign.
  *   **The Strategy:** They argue that the "badness" of overdetermination comes from *coincidence*. In a firing squad, it is accidental that both shooters fire. In the mind-body case, it is nomologically (or metaphysically) necessary that $M$ and $P$ co-occur.
  *   **The Weakness:** Critics (like Kim) argue that this changes the definition of overdetermination so much it loses its meaning. If $M$ and $P$ are necessarily connected, they aren't truly *distinct* causes in the way required for overdetermination. Furthermore, methodologically, positing universal redundancy violates parsimony. If $P$ is sufficient, positing $M$ as *also* sufficient adds ontological weight without predictive power. The RV defender must bite the bullet that ontology is not guided solely by predictive utility.

  **How the Priority View (PV) fares:**
  The PV dissolves this worry entirely because it denies the setup.
  *   **The Strategy:** Since there is only one causal transaction, there is no expectation that the effects should "come apart." The reason we don't see $M$ without $P$ (or vice versa) causing $E$ is that $M$-causing-$E$ and $P$-causing-$E$ are the same fact described differently.
  *   **The Weakness:** The PV struggles to explain the *mechanism*. Our best empirical methods trace causal chains physically (neurons firing, muscles contracting). If the mental is the "real" cause and the physical is "derivative," we need an account of how the mental causation is implemented without the physical causation doing the heavy lifting. If the physical *does* the heavy lifting (transfers energy, etc.), then it looks like the physical is the real cause, pushing the PV back toward the RV or epiphenomenalism.

  **Comparison:** The RV faces a methodological parsimony objection (why posit two causes?). The PV faces a mechanistic explanatory objection (how does the mental cause work if the physical is derivative?).

  ### (c) Are the two responses in tension?

  I believe they are **logically in tension**, though a defender might try to pragmatically combine them.

  **The Logical Tension:**
  *   **PV Commitment:** There is exactly one sufficient causal relation for $E$. (Let's call the set of sufficient causes $C$. $|C| = 1$).
  *   **RV Commitment:** There are at least two sufficient causal relations for $E$. ($|C| \geq 2$).
  *   **Conflict:** You cannot consistently hold that there is only one real cause *and* that there are two distinct sufficient causes.

  **Where the Blurring Happens:**
  The confusion you noted in the literature often arises because defenders switch between **ontological** and **explanatory** claims.
  *   A philosopher might say: "Metaphysically, there is only one cause (PV), but explanatorily, we need to acknowledge both (RV)."
  *   Or: "The physical cause is sufficient for Closure (RV), but the mental cause is the 'real' explanation (PV)."

  **Can they be held at once?**
  Only if you equivocate on "cause."
  If you define "cause" in the RV sense as "sufficient condition satisfying Closure," and in the PV sense as "explanatorily primary factor," you can hold both. But this is a verbal solution, not a metaphysical one.
  *   If $P$ is a sufficient cause (RV), and $M$ is a sufficient cause (RV), and $M \neq P$, then you have overdetermination.
  *   If you then say "But $M$ is the *real* cause and $P$ is derivative" (PV), you are effectively denying that $P$ is a sufficient cause *in the fundamental sense*.
  *   If you deny $P$ is a fundamental sufficient cause, you threaten Closure.

  **My Assessment:**
  A robust defense usually requires picking a lane.
  *   **The Non-Reductive Physicalist (e.g., Shoemaker/Yablo):** Tends toward a modified **PV**. They argue $M$ and $P$ are not distinct *competitors* because $M$ is a determinable of $P$ (or realized by $P$). The causation is one, but the properties are distinct. This avoids overdetermination without making the physical derivative in a way that violates Closure (because the physical *realizes* the mental, so the physical cause *is* the mental cause in a constitutive sense).
  *   **The Compatibilist (e.g., Loewer/Sider):** Tends toward **RV**. They accept systematic overdetermination but argue it is non-coincidental. They grant that $P$ and $M$ are distinct sufficient causes but argue the Exclusion Principle is false or applies only to *independent* causes.

  **Uncertainty Flag:**
  I am flagging here that the "Priority View" as you described it ("mental is real, physical is derivative") is actually quite rare among physicalists. Most physicalists argue the reverse: the physical is ontologically primary, and the mental is real *in virtue of* the physical. If you are reading a text that claims the mental is the "ultimate" cause and the physical is "derivative," ensure they aren't slipping into a form of **Idealism** or **Panpsychism**, or that they aren't using "derivative" to mean "less explanatorily salient" rather than "ontologically secondary." If they mean the latter, it collapses into an explanatory claim compatible with RV. If they mean the former, it is in deep tension with standard Physicalism.

  ### Summary for your work

  1.  **On Overdetermination:** PV avoids it by denying distinctness of causal transactions; RV accepts it but denies it is "bad." PV is cleaner on exclusion but riskier on Closure.
  2.  **On Empirical Implausibility:** RV must argue that necessity blocks the "coming apart" worry. PV argues the worry is category mistake. PV is safer here but risks disconnecting from physical mechanism.
  3.  **On Tension:** They are rivals regarding the *number* of causal relations. You can only hold both if you distinguish between "causal relation" (PV) and "causal description" (RV), but this risks solving the problem merely verbally.

  If I were in your position, I would investigate whether the "Priority" move is actually a **Constitution** move (the mental cause is constituted by the physical cause). If constitution is identity-like, it supports PV. If constitution is distinctness-preserving, it slides toward RV. That metaphysical hinge is likely where the circularity in your reading is hiding.
