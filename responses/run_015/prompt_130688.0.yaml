answer: |-
  # The Saintliness Terrain: A Taxonomy of Desirability

  **Root Question:** *Is it desirable to be maximally morally good?*

  ### 1. Scope: Who is the question about?
  *   **A. Just Me (Individual):** Is it good for *this* agent to reach the top?
  *   **B. Everyone (Universal):** Is it good if *all* agents reach the top?

  ---

  ### Branch A: Just Me (Individual)

  #### 2. Theory Shape: Does morality ever say "enough"?
  *   **A1. No (Maximizing):** Morality claims all your surplus resources/time.
  *   **A2. Yes (Satisficing/Constraint):** Morality has a threshold; beyond that, you are free.

  #### 3. Attainability: Is there a finish line? *(Note 1)*
  *   **A1/A2-i. Yes (Maximum):** There is a state where you literally cannot be better.
  *   **A1/A2-ii. No (Supremum):** You can always be slightly better; it's an asymptotic limit.

  #### 4. Conflict Source: If you had infinite time/money, would the conflict remain?
  *   **-i. No (Resource Crowding):** The conflict is only because goods compete for limited hours.
  *   **-ii. Yes (Attitudinal Incompatibility):** The *spirit* required for moral goodness kills the spirit required for other goods (e.g., artistic selfishness).

  **Leaves (Individual):**
  1.  **The Grim Maximizing Saint (Max + Crowding):** *Awkward Commitment:* Must admit their life is objectively worse than a sinner's, but still morally required.
  2.  **The Grim Maximizing Saint (Max + Incompatibility):** *Awkward Commitment:* Must admit morality requires crushing the specific psyche needed for great art/love.
  3.  **The Asymptotic Striver (Supremum + Crowding):** *Awkward Commitment:* Must accept that moral improvement is never complete, so rest is always guilt-inducing.
  4.  **The Asymptotic Striver (Supremum + Incompatibility):** *Awkward Commitment:* Must accept that getting 'closer' to moral perfection steadily erodes non-moral identity.
  5.  **The Contented Satisficer (Max + Crowding):** *Awkward Commitment:* Must explain why stopping at "good enough" isn't just moral laziness in disguise.
  6.  **The Contented Satisficer (Max + Incompatibility):** *Awkward Commitment:* Must defend a hard wall where moral demands suddenly cease despite remaining capacity to help.
  7.  **The Relaxed Satisficer (Supremum + Crowding):** *Awkward Commitment:* Must claim one can ignore further moral improvement even if it's possible and costless.
  8.  **The Relaxed Satisficer (Supremum + Incompatibility):** *Awkward Commitment:* Must claim non-moral goods trump moral goods even when the moral cost is negligible.

  ---

  ### Branch B: Everyone (Universal)

  #### 5. Social Function: Would a world of saints function worse?
  *   **B1. No (Ideal World):** A world of saints is the optimal state for everyone.
  *   **B2. Yes (Dysfunctional World):** Universal saintliness leads to collective loss.

  #### 6. Mechanism of Failure (If B2): Why does it fail? *(Note 2)*
  *   **B2-i. Division of Labor:** We need specialists (artists, scientists) who ignore moral demands to produce value.
  *   **B2-ii. Persuasion Deficit:** Saints are too alien to persuade sinners; we need moral "middle-men."

  #### 7. Conflict Source: If everyone had infinite time/money, would the conflict remain?
  *   **-i. No (Resource Crowding):** Even saints need time to maintain the infrastructure of a good world.
  *   **-ii. Yes (Attitudinal Incompatibility):** A society of pure moral motives lacks the drive for innovation/risk.

  **Leaves (Universal):**
  9.  **The Moral Utopian (Ideal + Crowding):** *Awkward Commitment:* Must deny that non-moral excellences (art, sport) have any value independent of moral utility.
  10. **The Moral Utopian (Ideal + Incompatibility):** *Awkward Commitment:* Must claim a world without 'selfish' passion is preferable, even if culturally sterile.
  11. **The Division of Labor Realist (Specialists + Crowding):** *Awkward Commitment:* Must endorse a caste system where some are morally exempt to benefit the rest.
  12. **The Division of Labor Realist (Specialists + Incompatibility):** *Awkward Commitment:* Must claim some people *ought* to cultivate moral vices (vanity, obsession) for the greater good.
  13. **The Persuasion Realist (Alienation + Crowding):** *Awkward Commitment:* Must argue that being slightly immoral makes you a more effective moral agent than being perfect.
  14. **The Persuasion Realist (Alienation + Incompatibility):** *Awkward Commitment:* Must accept that moral progress is self-undermining if it makes you too pure to communicate.

  ---

  ### Meta-Analysis for the Facilitator

  **1. On the "Max vs. Supremum" Distinction (Req 3)**
  I have treated this as a substantive branch (Node 3). It is not a pseudo-problem, but it is technically fraught.
  *   **Why keep it?** It changes the phenomenology. A *Maximum* implies a state of rest ("I have finished"). A *Supremum* implies eternal striving ("I can always do more").
  *   **Replacement if dropped:** If your group finds this metaphysical, replace Node 3 with: **"Is moral rest possible?"** (Yes = Max / No = Supremum). This captures the practical difference without the math terminology.

  **2. Empty or Unattractive Combinations**
  *   **Leaf 7 & 8 (Relaxed Satisficer + Supremum):** *Status: Unexplored/Unattractive.*
      *   *Why:* If morality is a Supremum (always more to do), but you are a Satisficer (you can stop), you are essentially claiming you can ignore an infinite amount of possible good without penalty. Few theorists hold this because it collapses into egoism. It is not *incoherent*, but it is dialectically weak.
  *   **Leaf 5 & 6 (Contented Satisficer + Max):** *Status: Tense.*
      *   *Why:* If there is a "Maximum" (a ceiling), Satisficing looks redundant. If you can hit the ceiling, why not? These positions usually merge into "The Grim Saint" unless the Satisficer argues the Ceiling is low.

  **3. Indistinguishable Leaves (Req 4 & Collapsing Arguments)**
  *   **Leaves 11 & 12 (Division of Labor) vs. 13 & 14 (Persuasion):**
      *   *Do they collapse?* **No.**
      *   *Distinction:* Division of Labor is about **Output** (no art gets made if everyone is moral). Persuasion is about **Influence** (no one listens if the speaker is moral).
      *   *Handout Flag:* On the handout, these are distinct because the "Awkward Commitment" differs (Caste System vs. Strategic Immorality). However, in discussion, students often conflate them. Push them to specify: *Is the saint useless because they don't produce goods, or because they can't recruit others?*
  *   **Leaves 1 & 2 (Grim Saint + Scarcity/Constitutive):**
      *   *Do they collapse?* **Yes, practically.**
      *   *Why:* For the individual agent, whether the cost is time (Scarcity) or spirit (Constitutive), the result is "My life is worse." The distinction only matters for *solutions* (e.g., Scarcity can be solved by technology/wealth; Constitutive cannot). I have kept them separate to satisfy your Req 1, but warn students that the *desirability* conclusion is the same for both.

  **4. Theory Shape Visibility (Req 2)**
  *   Node 2 (Theory Shape) is explicit on the Individual side.
  *   On the Universal side, Theory Shape is implicit in Node 5 (Social Function). A Satisficing theory rarely generates a "Dysfunctional World" objection because it doesn't demand universal sainthood. Therefore, the "Dysfunctional" leaves (11–14) are almost exclusively commitments of **Maximizing** theories. If a student wants to hold Leaf 11 but claims to be a Satisficer, press them on why their theory demands universal sainthood if it leads to dysfunction.

  **5. Scope Sensitivity (Req 5)**
  *   The tree makes Scope the root (Node 1). This is crucial. A position like **The Division of Labor Realist (Leaf 11)** is stable at the Universal level ("Not everyone should be a saint") but collapses at the Individual level ("Should *I* be a saint?" -> "Yes, unless I'm the designated artist"). Ensure students don't slide between "I" and "We" without noticing the branch change.
