          *   Philosophical reality: This is a caricature of "Radical Autonomism" (like Clive Bell's "Significant Form" or Oscar Wilde's "All art is quite useless"). Most contemporary separatists (Moderate Autonomists) admit moral properties *can* be relevant but argue they aren't *constitutive* of artistic value in a systematic way.
