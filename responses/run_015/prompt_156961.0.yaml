      *   *Point 2: Moralism.*
          *   Friend's claim: Immoral endorsement = automatically less good as art. (Radical Moralism).
          *   Philosophical reality: Most moralists are "Moderate Moralists" (e.g., Berys Gaut's "Ethicism"). They argue ethical defects *can* be aesthetic defects, but not always *necessarily* in every single instance without nuance. They distinguish between *depicting* evil (neutral/positive) and *prescribing* evil (negative).
