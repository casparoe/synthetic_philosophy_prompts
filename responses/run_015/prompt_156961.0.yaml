      *   *Point 3: The Refutation (The Villain Objection).*
          *   Friend's claim: We sympathize with immoral characters in great art. Therefore, moralism is false.
          *   Philosophical reality: This is the standard "Lolita" or "Richard III" objection. Moderate Moralists have a ready answer: Sympathizing with a villain is not an *ethical defect* if the work structures that sympathy critically or ironically. If the work asks us to admire a manipulator *uncritically*, that's where the ethical (and thus aesthetic) flaw lies.
