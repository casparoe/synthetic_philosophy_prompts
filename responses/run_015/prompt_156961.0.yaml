answer: |-
  Your intuition is correct: your friend's summary is indeed "too neat." It constructs a debate between two extreme positions (Radical Autonomism vs. Radical Moralism) that few contemporary philosophers actually hold, thereby creating a straw-man argument that is easily knocked down.

  To audit this fairly, we need to introduce the specific vocabulary of the field (aesthetic philosophy) to locate the slippages. The debate is generally framed between **Autonomism** (artistic value is independent of ethical value) and **Moralism** (artistic value is partly determined by ethical value).

  Here is an audit of your friend's summary based on your four specific questions.

  ### 1. Does it conflate biographical separation with aesthetic autonomism?
  **Yes, significantly.**

  Your friend conflates two distinct debates:
  *   **The Biographical Debate:** Should we boycott or discount a work because the *artist* committed crimes (e.g., Polanski, R. Kelly)? This is often colloquially called "separating the art from the artist."
  *   **The Aesthetic Debate:** Does the *ethical content within the work itself* affect its artistic merit?

  Your friend's summary of the "separatist" position mixes these. He claims separatists believe moral content belongs to a "different domain altogether." While **Radical Autonomists** (like Oscar Wilde or formalists like Clive Bell) might argue that art is purely about form and has no moral dimension, most contemporary **Moderate Autonomists** admit that a work can have moral properties. They simply argue that those properties do not *systematically* determine artistic value. A work can be morally flawed but aesthetically brilliant (or vice versa). By framing separatism as the claim that moral content is *entirely external*, he ignores the moderate view that moral and aesthetic values are distinct but potentially interacting categories.

  ### 2. Do defenders of separation hold the "strong form" he assigns them?
  **Rarely.**

  The view your friend attributes to separatists—that artistic value is a "purely formal matter of coherence, originality, and aesthetic unity"—is a mid-20th-century Formalist position that has largely been abandoned.

  Most modern defenders of autonomy argue for **Moderate Autonomism**. They concede that ethical defects *can* sometimes be aesthetic defects (for example, if a moral message is delivered with such clumsiness that it breaks the narrative immersion). However, they deny that there is a *necessary* connection. They argue that ethical criticism and aesthetic criticism are different tools for different jobs. Your friend's summary treats Autonomism as a dogmatic claim ("moral content never bears on value"), whereas most philosophers treat it as a claim about categorization ("moral value is not a *subset* of artistic value").

  ### 3. Does his characterization of moralism capture nuanced versions?
  **No. It attacks "Radical Moralism" rather than "Moderate Moralism."**

  Your friend describes moralists as claiming that if a work promotes immoral attitudes, it is *automatically* less good as art. This is **Radical Moralism** (or Censorious Moralism). Almost no serious philosopher defends this today.

  The dominant moralist position is **Moderate Moralism**, most famously articulated by philosopher Berys Gaut under the label **Ethicism**. Ethicism holds that:
  *   The manifestation of ethically commendable attitudes can count as an aesthetic merit.
  *   The manifestation of ethically blameworthy attitudes can count as an aesthetic defect.
  *   **Crucially:** This is *defeasible*. It depends on *how* the attitude is manifested.

  Your friend ignores the vital distinction between **depicting** immorality and **endorsing** it.
  *   **Depiction:** A novel shows a murder. (Neutral/Positive aesthetically).
  *   **Endorsement:** A novel invites the audience to applaud the murder without irony or critical distance. (Potentially negative aesthetically).

  Nuanced moralists argue that if a work invites us to adopt a cruel perspective *uncritically*, the work fails aesthetically because it demands a corruption of the audience's understanding to be fully appreciated. Your friend's summary treats all moralism as if it claims "any mention of evil lowers merit," which is a caricature.

  ### 4. Does the "villain objection" refute the careful moralist position?
  **No. It refutes a straw man.**

  Your friend's "knockout punch" is that great art (tragedy, psychological novels) requires us to sympathize with immoral characters, so moralism must be false.

  Careful moralists (Ethicists) have a ready response to this. They distinguish between **sympathizing with a character** and **endorsing their moral framework.**
  *   In *Macbeth*, we understand Macbeth's ambition and fear. We might even feel pity. But the play does not ask us to believe that murdering kings is a good idea. The tragic structure itself condemns the action.
  *   In *Lolita*, Nabokov asks us to listen to Humbert Humbert, a predator. However, the aesthetic achievement lies in how Nabokov seduces the reader with beautiful prose only to reveal the horror underneath. The moral defect (Humbert's predation) is *part of the point*, not an endorsement.

  The moralist argument is not "Immoral characters make art bad." It is: **"If a work prescribes that we take pleasure in immorality *as such*, without critical framing, that is an aesthetic failure."**

  Your friend's objection works only against the Radical Moralist who says "Any immorality in content ruins the art." It does not touch the Moderate Moralist who says "The *stance* the work takes toward that immorality determines its artistic success."

  ### Summary of the Slippage

  Your friend has reconstructed the debate as a battle between:
  1.  **Radical Autonomism:** "Morality never matters to art."
  2.  **Radical Moralism:** "Immorality always ruins art."

  He then correctly points out that (2) is absurd because of *Macbeth* and *Lolita*, and concludes that (1) must be right.

  However, the actual live debate is between:
  1.  **Moderate Autonomism:** "Morality and Art are distinct categories; a moral flaw is not *necessarily* an aesthetic flaw."
  2.  **Moderate Moralism (Ethicism):** "A moral flaw *can be* an aesthetic flaw, specifically when the work's narrative perspective endorses that flaw."

  **Verdict:** Your friend's summary is rhetorically effective but philosophically imprecise. It wins the argument by defining the opposing side out of existence. He has not exposed a contradiction in moralism; he has exposed a contradiction in a crude version of moralism that its actual defenders explicitly reject. The "interactionist" views you heard about (where ethical and aesthetic judgment interact without collapsing into one another) are precisely the Moderate Moralism and Contextualism positions he skipped over.
