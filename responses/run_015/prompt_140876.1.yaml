      *   *Non-monotonicity:* If the prior is strong and the likelihood is bimodal far away, you can get "explaining away" effects. But generally, for credences, it acts like increased noise.
      *   *Implication:* Conciliationist heuristics assume error is mean-zero. If error is biased, they fail. If error is symmetric but bimodal, they work on expectation but might miss tail risks. The worry about non-monotonicity is well-founded in extreme cases (likelihood ratios crossing), showing heuristics assume log-concave likelihoods.

