  4.  **Analyze Question 3: Modeling Choice (Evidential vs. Coherence)**

      *   *Evidential/Aggregative:* Treat reliability as a hypothesis $H_{rel}$. Update $P(P)$ by averaging over $H_{rel}$. $P(P|E, HOE) = \sum P(P|E, H_i)P(H_i|E, HOE)$.
