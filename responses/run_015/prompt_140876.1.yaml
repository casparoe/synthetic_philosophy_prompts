      *   *Resolution:* The Evidential model is fundamental. Coherence is a derivative norm. If they diverge, Evidential wins. The "Coherence" view often smuggles in a "Noise" assumption (unreliability = less support). In Drift, unreliability = *different* support.

  5.  **Analyze Question 4: Intermediate Case (Unknown Sign Drift)**

      *   *Setup:* Error is $\pm \delta$ with equal probability. Bimodal error distribution.
      *   *Likelihood Ratio:* $P(R|C) = 0.5 \cdot \mathcal{N}(C+\delta) + 0.5 \cdot \mathcal{N}(C-\delta)$.
      *   *Monotonicity:* Does a higher $R$ always imply a higher posterior?
      *   *Worry:* If the distribution is bimodal, the likelihood function might have local maxima. However, usually, the convolution of the prior and the likelihood smooths this out. But strictly speaking, with a bimodal likelihood, the LR is not necessarily monotonic in the way a simple Gaussian is.
      *   *Conciliationist Heuristic:* "Regress to mean" assumes a unimodal, centered error. With symmetric unknown drift, the expected value of the error is 0. So, $E[C|R] \approx R$. *Wait.* If I know the error is $\pm \delta$, and I get $R$, the truth is either $R-\delta$ or $R+\delta$. The expectation is $R$.
