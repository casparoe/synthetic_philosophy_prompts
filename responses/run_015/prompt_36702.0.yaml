answer: |-
  It is completely understandable why that argument left you frustrated, because your intuition is correct: the phrase someone would have done it anyway is not a single claim but a compressed bundle of several distinct historical assertions, some of which are trivial, some substantive, and some of which actively contradict the conclusion your friend drew. To untangle this, we have to separate the timeline from the content and the reception, because the inevitability of a discovery does not guarantee the inevitability of its impact. The first reading of the slogan concerns timing, specifically the difference between eventually and soon. If your friend means that given enough centuries, some human would have figured out natural selection, that is trivially true but historically useless. It supports the idea that individuals don't matter only if you are willing to wait five hundred years for the same result, which effectively changes the history we are studying. However, if he means someone would have done it within a specific window, say the decade when Darwin was hesitating, that is a genuinely substantive claim that could be false. In the case of Darwin and Wallace, the evidence suggests this specific reading is true because the mid-nineteenth century was a ripe moment for evolutionary theory, with geology and biology converging. But this reading only supports your friend's conclusion that individuals are irrelevant if the window is tight; if the window were actually forty years wide, then Darwin specifically mattered a great deal in accelerating the timeline, and acceleration changes history because it alters what other events the discovery interacts with.

  The second reading concerns the content of the idea itself, asking whether the same thing means the exact same theoretical framework or just something in the vicinity. It is often substantively true that multiple people will identify a similar problem or phenomenon around the same time, as seen with calculus or the telephone, but it is much less certain that they will formulate the exact same explanation. Darwin's specific mechanism of natural selection was distinct from Wallace's, and Darwin's massive accumulation of evidence was unique to him. If the claim is that the exact same theory would have emerged, that is a strong substantive claim that is often false, because theories are shaped by the individual's background and biases. If the theory comes out slightly different, it might be harder to prove, easier to attack, or compatible with different social ideologies. This reading weakly supports your friend's conclusion if we accept vague similarity, but if the specific shape of the theory matters for how it is used later, then the individual creator matters significantly. A slightly different theory of evolution might have been reconciled with religion more easily, or perhaps less easily, changing the cultural wars of the twentieth century.

  The third and perhaps most critical reading separates the act of discovery from the act of reception and implementation, which is where your instinct about Wallace being a young nobody becomes vital. Your friend's slogan implies that once an idea exists, it automatically integrates into the world, but history shows that discovery and acceptance are distinct events. It is a substantive claim to say that the wider world would have believed and acted on the idea regardless of who presented it, and this is often false. Darwin had status, wealth, and a network of influential friends in London science; Wallace was a collector in the Malay archipelago. If Wallace had published first without Darwin's backing, the idea might have been ignored or crushed. This reading actively undermines your friend's conclusion because it shows that the individual's social capital is a causal force. If the messenger determines whether the message is heard, then the individual matters immensely. This applies even more strongly to your friend's example of the abolition of slavery. While economic shifts made slavery inefficient in some places, the moral argument and the political activism were driven by specific individuals and groups. To say someone would have abolished slavery anyway ignores the very real possibility that it could have persisted much longer without specific contingent campaigns, making the claim about social progress far less inevitable than scientific discovery.

  When you brought up the keyboard layout, your friend was right that it is a different kind of case, but he was wrong about why that difference lets him off the hook. The QWERTY story is about path dependence rather than multiple discovery. In science, there is often a single correct answer waiting to be found, which creates pressure for convergence, whereas technology standards often have multiple viable solutions where the winner is determined by accident or early market share. However, this difference actually hurts his argument rather than helping it. If technology and social standards are subject to path dependence, then accidental early choices lock in outcomes for centuries, meaning the specific individuals who made those early choices matter enormously. By admitting QWERTY is different, he inadvertently admitted that not all history is driven by impersonal forces toward a predetermined endpoint. In the QWERTY case, the individual actors and accidental circumstances determined the outcome, proving that contingency exists. If contingency exists in technology, there is no reason to assume it is absent in biology or politics, so the exception swallows the rule.

  The chunk of your argument that was likely just about words revolves around the definition of matter. When your friend says individuals barely matter, he seems to mean that the broad outline of history would look recognizable without them, whereas you likely mean that the specific texture, timing, and human cost of history would be different. If history is a river, he is arguing that the river would still flow to the sea without a specific stone in its path, while you are arguing that the stone changes the rapids, the erosion, and the flooding along the way. Both can be true simultaneously. The slogan someone would have done it anyway is semantically slippery because it conflates the existence of an idea with the consequences of that idea. It is trivially true that ideas exist in the ether of possibility, but it is substantively false that their consequences are automatic. Therefore, only the weakest version of his claim holds up under scrutiny, and that version does not support the strong conclusion that great-man biographies are merely decoration. The decoration changes the building, even if the building still stands.

  Ultimately, the disagreement rests on whether you view history as a puzzle being solved or a story being written. If it is a puzzle, the solution is inevitable and the solver is interchangeable, which supports your friend's view. If it is a story, the narrator and the specific choices of plot matter, which supports your view. Most historians today argue it is a mix, where material conditions create the stage but individuals write the lines. Your friend's error was taking a heuristic that works sometimes for mature scientific fields and applying it universally to technology and morality where contingency reigns. You were right to feel that the one sentence was doing too much work because it was trying to bridge the gap between the inevitability of human ingenuity and the contingency of human culture. By separating the timing, the content, and the reception, you can see that while the discovery might have been inevitable, the history we actually live through was not, and that means the people who lived it matter.
