          *   Identify where philosophy illuminates the scene and where the scene resists the philosophy.
      *   **Constraints:** British English, concise, no citations, no plot summary.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Anatta (No-Self):** There is no permanent, unchanging soul or essence. A person is a collection of processes (*skandhas*: form, sensation, perception, mental formations, consciousness).
      *   **Skandhas in the Film:** The erasure procedure targets memories (perception/consciousness), but feelings linger (sensation/mental formations).
      *   **Kripkean Rigid Designator:** A name that refers to the same object in all possible worlds where that object exists. If Joel says "Clementine," does it pick out a fixed entity despite the changing mental landscape?
