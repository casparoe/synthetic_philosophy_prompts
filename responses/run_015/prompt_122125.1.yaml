answer: |-
  **Teaching Arc Plan**

  **1. Prerequisite Concept: Epistemic Risk vs. Ontological Fact**
  Before the scale argument (Billions × Tiny Probability) can register, students must accept that moral obligations can arise from *ignorance* rather than *certainty*. If they believe morality only applies to known facts (i.e., "I only owe duties to things I *know* are sentient"), the math won't move them. You need to establish **Moral Decision Theory under Uncertainty**: the idea that high-stakes risk generates obligations even when probability is low.

  **2. The One Carrying Example: The Collapsing Shed**
  *Scenario:* You own a shed scheduled for demolition. You hear a noise inside. Statistics say 99% chance it's settling debris, 1% chance it's a homeless squatter. Demolishing it saves you $10,000. Crushing the squatter kills them. Do you proceed?
  *Why this works:* It isolates the "low probability × high stake" structure without the biological baggage of insects. It forces them to admit that a 1% risk of murder is unacceptable, even if it's 99% likely safe.
  *Why NOT open with the insect count:* If you open with "there are more insects than humans," students immediately trigger **ontological dismissal** ("bugs are simple machines"). They will fight the premise of sentience before they ever engage with the logic of risk. You need them to accept the *logic of risk* using the Shed first, then apply it to the insects second.

  **3. Misconceptions & Defusal Sequence**

  *   **Misconception 1: "They're Just Automatons" (The Certainty Trap)**
      *   *When it hits:* Immediately after you introduce insects. They will assert biological certainty to escape the moral burden.
      *   *Where to defuse:* **During the Shed transition.** Before revealing the insect application, ask: "In the Shed case, do you need to *know* a person is inside to owe them duty, or does the *possibility* create the duty?" Lock in the principle that *uncertainty* is the trigger. When they raise the automaton claim later, remind them: "You claimed 99% certainty in the Shed case too. Did that erase the obligation?"
  *   **Misconception 2: "Expected Value = Actual Moral Weight" (The Category Error)**
      *   *When it hits:* When you run the numbers (Billions × Tiny Chance = Huge Expected Value). They will think this means 1 insect = 1 human, or that we must save every ant.
      *   *Where to defuse:* **When introducing Radical Uncertainty Budgeting.** Clarify that Expected Value is a tool for *resource allocation*, not a statement on *ontological status*. Use the insurance metaphor: Buying fire insurance doesn't mean your house *is* on fire; it means you budget for the risk. Similarly, budgeting for insect suffering doesn't mean they *are* suffering; it means you allocate a portion of moral concern to the risk.

  **4. The Check Question**
  "If you adopt this framework, does stepping on an ant make you a murderer, or a risk-manager paying a premium?"
  *(If they say murderer/guilty, they missed the budgeting frame. If they say risk-manager/premium, they understand the portfolio approach.)*

  **5. Bracketed Literature**
  Explicitly state at the start: "We are bracketing **Phenomenal Consciousness (Qualia)** and **The Hard Problem**. We are not attempting to solve whether insects *actually* feel pain. We are treating sentience as a binary risk variable to solve how to act under ignorance."
