prompt: |-
  You are a philosopher of mind and action who also knows the transformer literature at the level of a working ML engineer. Work in two stages, and show both: first lay out the logical space — the dividing questions and the combinations of answers they permit — and only then place the actual positions into that space and mark the regions nobody occupies.

  I teach a graduate seminar on agency and artificial systems, and I need a diagnostic instrument, not a literature survey. Build me a decision tree with eight or nine branch questions that takes a student from a starting commitment everyone in the room already accepts — that these systems are trained by gradient descent on text, produce each output in a single forward pass with no separate deliberation stage, and are strikingly sensitive to considerations supplied in their context — through to a named position about what sort of thing such a system is.

  Constraints on the nodes. Every branch node must be a question about a concrete case, phrased so that someone who has never heard any of the labels can answer it, with two or three answer options. No node may use the terms agent, simulacrum, persona, intentional stance, or consciousness, and no node may simply ask what the system really is. These cases must appear somewhere in the tree: a developer turns a trained persona direction up and down mid-conversation so that tone and policy flip every few turns; a system instructed to role-play a nineteenth-century physician who refuses a treatment produces the sentence I will not prescribe it; the same weights are deployed in two contexts, one as a careful tutor and one as a flatterer; a system performs measurably worse when it can detect that it is being evaluated; a system falls into a degenerate repetition loop; a system with no memory across sessions is compared to one with persistent memory and tool access.

  Constraints on the leaves. About six or seven leaves, each named, each with one sentence on its least comfortable commitment. I want these to be reachable: the no-thing-here-but-a-tool view, the simulator view, the view on which talking as if there were an agent is merely the best predictive strategy, the view on which the role-played character rather than the system is the agent, the view on which a single forward pass contains many candidate agents in superposition, the view on which the agent is the whole scaffolded system rather than the weights, and the view on which an agent is present but too fragile to count for much.

  Finally: flag any pair of leaves your tree cannot actually separate, and say what further commitment would be needed to split them; diagnose each empty region of the logical space as incoherent, merely unattractive, or unexplored; and if you had room for one more question, say which and what it would divide.
