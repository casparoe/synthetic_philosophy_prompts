      *   **Core Question:** What does current practice *strictly presuppose* about failure shapes vs. what it merely *fits well with*? Is the influence-seeking picture load-bearing? Could a drift-believer endorse the same spending? Where is the practice underdetermined? What would a drift-focused lab build that doesn't exist?
      *   **Constraints:** Mark confidence levels (confident vs. reconstructing plausibly). Under 600 words. Say plainly if the question is confused.
      *   **Tone:** Analytical, precise, critical.

  2.  **Deconstruct the User's Premise:**
      *   *Observation:* Labs spend heavily on pre-deployment evals for dangerous capabilities (bio, cyber, scheming) and gating. They spend less on tracking slow value drift during training (moving target in RLHF) and post-deployment degradation (fine-tunes, quantization).
      *   *Hypothesis 1 (User's read):* This presupposes failure is discrete, agentic, visible.
      *   *Hypothesis 2 (Alternative):* This is just where spend is legible/measurable; drift is unmeasurable, so even drift-believers would spend this way.
      *   *Task:* Distinguish presupposition from fit. Identify underdetermination. Specify missing drift-focused infrastructure.

  3.  **Evaluate the Asymmetry:**
      *   Is the asymmetry real? Yes, broadly speaking. Capability evals are public and rigorous. Value drift monitoring is less standardized.
      *   Is the axis (influence-seeking vs. drift) correct? It's a useful carving, but "measurable vs. unmeasurable" is probably the stronger driver.
      *   Does current practice *require* belief in agentic failure? No. You can test for bio-risk without believing the model is agentic; you just test if it outputs dangerous info. However, testing for *scheming* does presuppose some agency.
      *   Does current practice *fit* drift belief? Yes, if you think drift is unmeasurable, you can't spend on measuring it. So the spending pattern is underdetermined between "drift isn't the risk" and "drift is the risk but we can't measure it."

  4.  **Drafting the Argument:**
      *   *Confidence:* High that the asymmetry exists. High that measurability drives spend more than specific failure theory.
      *   *Presupposition:* The practice strictly presupposes that *catastrophic* risk is correlated with *capability* thresholds. It does not strictly presuppose agency, though scheming evals do.
      *   *Underdetermination:* The "legibility" explanation (Hypothesis 2) is stronger. A drift-believer would face the same constraint: you can't manage what you can't measure.
      *   *Missing Drift Infrastructure:* What would a drift-believer build?
