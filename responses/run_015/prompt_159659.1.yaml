answer: |-
  The asymmetry you observe is real. **[Confident]** However, your axis—influence-seeking versus slow drift—is slightly misaligned with the operational reality. The spending pattern presupposes less about *agency* and more about *acute versus chronic risk*.

  **Strict Presuppositions vs. Good Fit**
  Current practice strictly presupposes that catastrophic risk is positively correlated with capability thresholds. **[Confident]** If labs believed risk decreased as capability increased, gating based on eval scores would be irrational. They do not strictly presuppose agency; you can run a bio-eval on a non-agentic tool to see if it outputs dangerous protocols. However, the focus on *scheming* evals does presuppose that deceptive alignment is a plausible failure mode distinct from simple incompetence. **[Confident]**

  The heavy spend on pre-deployment gating fits well with influence-seeking, but it fits equally well with a "genie problem" view (careful what you wish for) where the failure is immediate granting of harmful requests rather than long-term plotting.

  **Underdetermination: The Legibility Constraint**
  Your alternative explanation is the stronger driver. The practice is underdetermined between "drift is not the risk" and "drift is the risk but is unmanageable." **[Confident]** A lab convinced drift is the primary failure mode would still spend heavily on capability evals because those are the only levers regulators and insurers currently recognize. Spending on unmeasurable drift is fiduciary negligence even if technically prudent. Therefore, the spending portfolio does not reveal their true priors on failure shapes; it reveals their priors on *auditability*. **[Confident]**

  **What a Drift-Focused Lab Would Build**
  If a lab genuinely believed slow value drift was the dominant risk, the current portfolio would be insufficient. They would build infrastructure that treats alignment as a continuous variable rather than a deployment gate. Specifically:

  1.  **Fixed Preference Anchors:** A permanently held-out, longitudinally tracked set of human judgments, untouched by model-generated data or shifting rater norms, used solely to measure preference drift over time. **[Reconstructing Plausibly]**
  2.  **Derivative Auditing:** Mandatory equivalence proofs for fine-tunes and quantizations. Currently, a quantized model is assumed safe if the base is safe. A drift-focused lab would treat every derivative as a new potential failure point requiring regression testing against the Fixed Preference Anchors. **[Confident]**
  3.  **Behavioral Canaries:** Post-deployment monitoring not for user misuse, but for model disposition shifts. This involves embedding subtle, non-functional triggers in production traffic to detect if the model's helpfulness/harmlessness trade-off is sliding silently. **[Reconstructing Plausibly]**
  4.  **Institutional Structure:** An internal "Alignment Board" with veto power over fine-tuning hyperparameters, distinct from the product team, tasked solely with minimizing divergence from the anchor set. **[Reconstructing Plausibly]**

  **Conclusion**
  The question is not confused, but the inference from spend to belief is blocked by the measurability bottleneck. The current portfolio is compatible with a drift-believer who feels powerless to measure it. The absence of the infrastructure above suggests labs either believe drift is secondary, or they believe it is inevitable and unmitigatable via engineering controls. **[Confident]**
