answer: |-
  ### Brainstorming Angles (Scratchpad)

  1.  **Normative Option Value:** Keeping a decision open has intrinsic moral worth, not just instrumental value for finding truth. *Risk:* Might just be epistemic humility disguised as normativity.
  2.  **Moral Burden Dumping:** Deferral shifts moral residue (guilt, risk) to humans. This is a cost the system incurs, not a free resource. *Strong candidate for core thesis.*
  3.  **Reversibility as Third Way:** Instead of Act/Deferr, add "Act Reversibly." Cheap undo buttons reduce the need for deferral. *Engineering friendly.*
  4.  **Consent Framework:** Operators consent to labor, not necessarily moral arbitration. Deferral violates ex-ante consent. *Contractualist angle.*
  5.  **Bad Angle - Pure Utilitarian Calculation:** Just add "human stress" as a negative utility weight. *Why bad:* Ignores the qualitative difference between labor and moral accountability.
  6.  **Bad Angle - Survey Engineers:** Ask devs how much they mind escalations. *Why bad:* Self-reporting is unreliable; doesn't capture normative wrongness.
  7.  **Pipeline Friction:** Treat deferral as latency. High moral uncertainty = high latency tolerance. *Too instrumental, misses the moral point.*
  8.  **Structural Power:** The system designer sets the rules; the operator bears the risk. Asymmetry creates exploitation. *Political philosophy angle.*
  9.  **Bad Angle - Trolley Variants:** Self-driving cars choosing pedestrians. *Why bad:* User banned it; ignores the "defer to human" mechanism which is the actual point.
  10. **Iterative Deliberation:** System logs case, acts tentatively, human reviews later. Distributes burden over time. *Complex to model.*

  ***

  ### Project Proposal: The Cost of Deferral in Moral Uncertainty

  **Project Title:** Moral Burden Dumping: Quantifying the Cost of AI Deferral under Normative Uncertainty

  **The Core Question**
  Standard decision theory asks: "Given moral uncertainty, which action maximizes expected choice-worthiness?" This project asks a structural question: "Under what conditions does deferring a decision to a human operator constitute moral exploitation rather than caution?" We need a determinate threshold for when offloading moral arbitration violates the implicit contract between system designers, the system, and the human operator.

  **Why Existing Frameworks Fail**
  Current approaches leave this open for two reasons. First, individualistic decision theories (like maximizing expected choice-worthiness) treat the agent as a closed loop. They model deferral as acquiring information or reducing error, assuming the cost is merely computational or temporal. They do not account for the *moral residue*—the psychological and ethical burden of being the one who finally says "yes" or "no"—transferred to the human.

  Second, the prevailing orthodoxy in AI safety treats "Human-in-the-Loop" (HITL) as an unqualified good. It assumes that because humans have moral intuition, handing them control is always safer. This ignores the deployment reality: operators are often low-wage contractors bound by strict SLAs, ill-equipped to handle high-stakes moral ambiguity. Treating deferral as costless encourages systems to offload high-uncertainty cases indiscriminately, effectively outsourcing moral risk to the most vulnerable link in the pipeline.

  **Methodology: Four-Month Plan**
  This project avoids pure abstraction and avoids empirical surveys (which measure preference, not normative validity). Instead, it combines conceptual modeling with pipeline auditing.

  *   **Month 1: Taxonomy of Deferral Costs.** I will map the types of costs incurred during deferral. These are not just latency costs. They include: *deliberative effort* (cognitive load), *accountability risk* (being blamed for the outcome), and *moral residue* (distress from making a fraught call). I will distinguish these from standard labor tasks.
  *   **Month 2: Case Reconstruction.** I will select three existing deployment contexts where deferral is common: content moderation (edge-case speech), medical triage support (borderline symptoms), and autonomous vehicle disengagement (ambiguous road conditions). I will reconstruct the decision logs to identify where moral uncertainty likely triggered the deferral, rather than technical uncertainty.
  *   **Month 3: Modeling the Exploitation Threshold.** Using the taxonomy and cases, I will draft a formal sketch. This model will weigh the system's moral credence against the operator's capacity and consent. The goal is to identify a "burden limit": a point where the system's uncertainty is high enough that acting is risky, but the human's position is too constrained to absorb the moral risk safely.
  *   **Month 4: Framework Validation & Refinement.** I will workshop the model with two groups: moral philosophers (for normative coherence) and ML engineers (for implementability). The focus is ensuring the variables are observable in a deploy pipeline (e.g., can we log "moral uncertainty" separately from "confidence score"?).

  **Why This Approach?**
  Pure decision theory fails because it ignores the recipient of the deferral. Pure empirical work fails because operators often normalize exploitation; just because they accept the burden doesn't mean it's morally permissible to assign it. This hybrid approach grounds the normative claim in the physical reality of the deployment pipeline.

  **Deliverable**
  The output will be a **Deferral Decision Sketch**. This is not a philosophical paper, but an engineering artifact. It will provide:
  1.  **Conditions for Acting:** When system credence is high enough to absorb risk.
  2.  **Conditions for Reversible Action:** When the system can act tentatively (e.g., flagging rather than removing) to keep options open without burdening a human.
  3.  **Conditions for Deferral:** When human input is genuinely required.
  4.  **Conditions for Forbidden Deferral:** When the moral burden exceeds the operator's authorized scope, requiring the system to default to a safe rule or shut down rather than ask.

  **Failure Conditions & Timeline Honesty**
  **Success** looks like a framework where an engineer can look at a deferral trigger and say, "This violates the burden limit; we need to change the default rule."
  **Failure** occurs if "moral burden" proves impossible to distinguish from standard cognitive load. If we cannot separate "this is hard thinking" from "this is morally damaging thinking," the model collapses into general ergonomics.
  **Timeline Risk:** Four months is tight for the case reconstruction (Month 2). Access to real deployment logs is often restricted. If logs are unavailable, I will rely on public incident reports, which reduces fidelity. However, the conceptual taxonomy (Month 1) is robust enough to stand even if the case studies are illustrative rather than exhaustive. The timeline is sufficient for a prototype framework, but not for a fully validated metric.

  ***

  ### Critique of Your Framing

  You suspect there is "normative option value"—reasons to keep a question open that aren't just instrumental. I worry this is confused. Usually, keeping options open is valuable *because* we expect to know more later (instrumental/epistemic). If you claim it's *normatively* valuable regardless of future knowledge, you risk fetishizing indecision. However, your second suspicion (moral burden dumping) is much stronger. It grounds the value of "keeping it open" in the protection of the human operator, rather than some abstract value of openness. I would pivot the project to lean harder on the burden dumping argument; it's more concrete and actionable than normative option value.
