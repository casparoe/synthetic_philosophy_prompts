answer: |-
  **The Toast**

  Good evening. For those who don't know me, I am [Your Name], and I have the distinct privilege of being [Mother's Name]'s child. Looking around this room, I see the two great constellations of her life: the family who raised her, and the colleagues who have walked the halls of the department with her. And I see friends who have done both, or perhaps something even more durable.

  Eighty years is a long time to occupy a single point in space and time. But anyone who knows Mom knows that she has occupied it with a remarkable degree of consistency. There are people whose character seems to shift with the weather, or with the company they keep. Then there are people who are, simply, who they are. Mom is the latter. She has a way of standing in a room that suggests the facts of her presence are not up for negotiation.

  We often talk about the moments that define us. For many people, those are moments of transformation, where they leave one self behind and pick up another. But Mom's life suggests a different model. When she met her birth family in her fifties, she didn't become a new person. She didn't change her essence. Instead, the rest of us caught up to the truth that had always been there. She treated the discovery not as a reinvention, but as an alignment. The facts of her origin were fixed; our access to them was what improved. In that sense, she has always been complete. We just needed the light to see the whole picture.

  That steadfastness is why she has been such a formidable philosopher and such a grounding force for all of us. She has spent a career arguing that certain truths are necessary, even if we have to go out and find them. And she has lived that argument. She is the same person at this table today that she was in the seminar room forty years ago, and the same person she was as a child in this family.

  I know there are people at this table who have debated her for decades. [Friend's Name], I see you there. You two have hashed out the nature of possibility over more dinners than I can count. I know you don't always agree on how to count the ways a world could be. But tonight, we don't need to count the possible worlds. We only need to celebrate this one. In this world, you have been her friend for a lifetime. In this world, your conversations have sharpened her thinking and deepened her joy. Whatever your theories say about counterparts across the divide, in this actual world, there is no counterpart to the friendship you share. It is strictly identical to itself.

  Tonight, the department is proud to announce a new scholarship in Mom's name. As many of you know, she has published under two surnames in her lifetime. The plaque will bear one of them. It matters little which tag we affix to the award. Both names refer to the same person. Both names carry the same weight. The scholarship is not a description of her virtues; it is a pointer to her legacy. It designates the same impact, regardless of which label we use to track it.

  So, I invite you to raise your glasses. Not to who she might have been, or who she could have become under different circumstances. But to who she is. To the necessity of her presence in our lives. To the truth of her, which is fixed, known, and deeply loved.

  To Mom.

  ***

  **Discarded Lines and Philosophical Blockers**

  1.  **Discarded Line:** "If you hadn't found your birth parents, you would have been a different woman than the one sitting here today."
      *   **Blocked By:** **The Necessity of Origin (Kripke).** Mom holds that she *could not* have had different parents and remained herself. Furthermore, she rejects the idea that acquiring new information changes her identity ("a different woman"). This line implies her identity was contingent on the discovery, whereas she views her identity as fixed and the discovery as merely epistemic (learning a necessary truth).

  2.  **Discarded Line:** "In any other life, you would still have found a way to be a philosopher."
      *   **Blocked By:** **Rigid Designation / Essentialism.** While a Lewisian counterpart theorist might accept this (a counterpart in another world is a philosopher), Mom's Kripkean view holds that *she* does not exist in other worlds. Only *she* exists in this world. Speaking of "any other life" suggests transworld identity, which she rejects. It also risks implying her profession is a necessary property, which might be too strong a claim, but the primary blocker is the reference to "other lives" as belonging to *her*.

  3.  **Discarded Line:** "The name [Surname] perfectly describes your dedication to truth."
      *   **Blocked By:** **Anti-Descriptivism (Kripke).** Mom's work defends the view that names are rigid designators, not clusters of descriptions. To say a name "describes" a property implies that if she lacked that property, the name would no longer apply. The toast must treat the name as a tag that refers to her regardless of her properties, not as a summary of her character.

  ***

  **Note on the Scholarship Announcement**
  In the toast, I handled the two surnames by treating them as co-referential tags ("Both names refer to the same person") rather than trying to choose the "real" one or suggesting the name encapsulates her work. This respects the rigid designator view: the name points to the person, not to a description of the person's achievements. By stating the plaque will bear *one* but that *both* carry the weight, I acknowledge the biographical fact without granting metaphysical priority to one name over the other, satisfying the constraint that the name is not a description.
