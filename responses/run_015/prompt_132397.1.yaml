answer: |-
  Here is the triage procedure, the philosophical translation, and the application to your three proposals.

  ### The Triage Procedure

  **Step 1: The Limit Question (The Squeeze Test)**
  *Question:* If we shrink the system to a finite, biologically realistic size (e.g., one cell, one tissue patch), does the macro-property vanish or become ill-defined?
  *Stop Condition:* If the property exists *only* in an infinite-size or continuum limit that no biological system instantiates, mark **VACUOUS**. Biological emergence must survive finite scaling.
  *Pass Condition:* The property persists in finite, real-world systems.

  **Step 2: The Derivation Question (The Patience Check)**
  *Question:* Is the failure to derive the macro-property from the micro-story due to a lack of mathematical tools and computing power, or is there a principled barrier (e.g., singularities, loss of information)?
  *Stop Condition:* If the barrier is merely computational complexity or incomplete data, mark **EPISTEMIC_ONLY**. This justifies a grant for better computers or data, not a Centre for new laws.
  *Pass Condition:* There is a principled reason why the micro-story cannot capture the macro-behavior (e.g., universality classes where micro-details are irrelevant).
  *Judgment Call:* This step is where you must decide between "we haven't tried hard enough" and "it cannot be done." No algorithm solves this; it requires panel consensus based on field norms.

  **Step 3: The Autonomy Question (The Swap and Sham Tests)**
  *Question:* Can the macro-law be shown to hold across physically different micro-realizations (Swap), and do macro-level interventions reliably predict outcomes without micro-level knowledge (Sham)?
  *Stop Condition:* If the macro-story collapses when micro-details change, or if micro-interventions always outperform macro-interventions, the macro-level is not autonomous. Mark **ESCALATE** if the panel cannot agree on the evidence.
  *Pass Condition:* The macro-level offers robust predictive power independent of micro-implementation. Mark **AUTONOMOUS** (useful for funding) or **ONTOLOGICAL** (if claiming new causal powers).

  ### Philosophical Translation

  *   **Keep:** *Explanatory Autonomy.* Does the macro-level explanation do work that the micro-level explanation cannot practically or principledly do? This is the only distinction that matters for funding.
  *   **Collapse:** *Weak vs. Strong Emergence.* Do not use these terms. They trigger philosophical fights that waste time. Replace with "Epistemic Only" (weak) vs. "Autonomous/Ontological" (strong).
  *   **Ignore:** *Supervenience.* Whether the macro "supervenes" on the micro is irrelevant if the macro is causally useful.
  *   **Your Markers:**
      *   *(i) Squeeze Test:* Matches the literature on *Singular Limits* (e.g., phase transitions). It is valid, but be careful: in biology, "finite size" is the rule. If the property vanishes at N=1000, it is likely a bulk artifact, not emergence.
      *   *(ii) Swap Test:* Matches *Multiple Realizability*. It is the strongest evidence for autonomy. Keep it.
      *   *(iii) Sham-Intervention Test:* Matches *Interventionist Causation*. It is the most practical for funding decisions. Keep it.
      *   *Bad Ideas:* None are bad, but the Squeeze Test is the most likely to be misapplied in biology where nothing is infinite.

  ### Application to Proposals

  **1. Kinase Sigmoid Response (Biased Group)**
  *Verdict:* **EPISTEMIC_ONLY:mechanism-reducible**
  *Analysis:* The proposal fails at Step 2. The sigmoid response is a standard consequence of cooperative binding and conformational selection (allostery). While you cannot recover it from *isolated* domains, you can recover it from the *interacting* domains using standard statistical mechanics. The failure is computational (sampling conformational space), not principled. The claim that drug discovery rests on a mistake is hyperbolic; structure-guided discovery already accounts for ensembles. This is complex mechanics, not emergence warranting a Centre.
  *Judgment Entry:* Step 2 (Derivation). The panel must agree that allostery is reducible in principle, even if hard in practice. This is the verdict you will not like.

  **2. Organoid Polarity (Downward Causation)**
  *Verdict:* **VACUOUS:geometry-boundary**
  *Analysis:* The proposal fails at Step 1. "Tissue geometry" is not a separate ontological layer; it is the spatial arrangement of the cells themselves. Feedback from geometry to cell division is simply physical boundary conditions acting on molecular machinery. Claiming this is "downward causation" that no cell-level rule set could capture is a category error. The macro-property is just the micro-arrangement viewed from a distance.
  *Judgment Entry:* Step 1 (Limit). The "macro" feature is just a description of the micro-configuration.

  **3. ML Transformer (Threshold Behavior)**
  *Verdict:* **AUTONOMOUS:scaling-regularity**
  *Analysis:* The proposal passes Step 2 and 3. The abrupt acquisition of ability at a compute threshold behaves like a phase transition where micro-weights are irrelevant to the macro-law of scaling. The macro-level (scaling laws) predicts performance independently of the micro-architecture (Swap), and tuning hyperparameters (macro-intervention) works better than editing weights (micro-intervention) for capability control (Sham). This warrants a theory programme.
  *Judgment Entry:* Step 3 (Autonomy). The macro-laws are robust and predictive.

  ### Limitation

  This procedure cannot distinguish between a law we have not yet found and a law that does not exist.

  \answer{1=EPISTEMIC_ONLY:mechanism-reducible, 2=VACUOUS:geometry-boundary, 3=AUTONOMOUS:scaling-regularity}
