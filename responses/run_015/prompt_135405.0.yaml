prompt: |-
  You're a decision theorist with a philosophy background — take a breath, think carefully, and start by brainstorming three different institutional frames (hospital board, municipal transit authority, law-firm partnership) before you pick one.

  Construct a thought experiment in the dollar-auction / escalation-of-commitment family, but engineered to specifc verdicts, not just illustrative. I want a realistic scenario (one paragraph, ~150 words max) set in one of those frames, involving a committee deciding whether to continue a failing initiative.

  Inject this specific institutional twist: there's a "reverse-vesting clawback" clause in their funding contract. Every quarter they remain, a chunk of previously committed funds shifts status: it becomes recoverable only if they stay, but if they vote to withdraw it is instantly forfeited and publicly logged as "lost protected capital." The next quarter's required match is small, but quitting triggers that visible loss.

  Build it so that:
  1. Pure rational-choice analysis (ignore sunk costs, look only at future expected costs and benefits) predicts withdrawal at a specifc point — call it Quarter 3, when the match exceeds projected return.
  2. Prospect-theory / reference-dependence predicts they escalate past Quarter 3, specifically because quitting realizes a loss (the forfeited clawback) while staying preserves the reference point.
  3. The escalation must genuinely come from the reference-point shift, not from an obviously stupid heuristic like "we can't waste what's spent."

  After the scenario, walk through each theory's reasoning, name the structural feature that does the work, say what happens if you remove that feature (does it collapse back to rational-choice agreement?), and explain how a rational-choice defender attacks the case — e.g., hidden reputation costs or signaling value.

  Keep it realistic: no sci-fi, no demons, no perfect predictors. Don't cite anyone, don't quote texts in quotation marks unless you've fetched teh source, and don't give me a reading list.

  Then provide a brief structured summary in JSON with these fields:
  - "scenario_title"
  - "setting"
  - "rational_choice_verdict"
  - "prospect_theory_verdict"
  - "key_structural_feature"
  - "collapse_condition"
  - "rational_choice_rebuttal"
  - "approx_word_count"

  Make it casual — a typo or two is totally fine.
