answer: |-
  Okay, let's stretch this out. First, the frames. 
  1. **Hospital Board:** Deciding on a specialized wing. Grant money vests over time; stopping means returning funds.
  2. **Law-Firm Partnership:** Funding a long-tail litigation. Partner capital is committed; withdrawing forfeits equity in the settlement pool.
  3. **Municipal Transit Authority:** Building a light rail extension. Federal matching funds require quarterly continuity or prior matches are clawed back.

  I'm picking the **Transit Authority**. Public audits make the "loss logging" psychologically heavier, which sharpens the reference-point shift.

  **The Scenario**
  The Metro Transit Authority committee reviews the GreenLine extension. Federal grants require quarterly matching. A reverse-vesting clause states that prior matched funds become "protected capital" only if the project continues into the next quarter. If they vote to stop, all previously protected capital is forfeited and logged as "lost protected capital" in the audit. By Quarter 3, construction delays mean the required match is $5M, but projected ridership revenue is only $3M. Rational analysis says stop. However, the clawback means stopping now forfeits $15M of previously secured funding, framing withdrawal as an immediate loss rather than avoided cost. The committee faces a choice: accept a certain visible loss of protected capital or gamble on future ridership to retain the status quo reference point.

  **The Breakdown**

  **Rational Choice:** Look forward, ignore the past. At Quarter 3, the marginal cost ($5M) exceeds the marginal benefit ($3M). The $15M "protected" status is irrelevant because it's not real income; it's a constraint on future action. The verdict is **withdraw**.

  **Prospect Theory:** The clawback changes the reference point. The $15M isn't sunk; it's mentally coded as "current endowment" contingent on staying. Quitting moves the outcome from the status quo to a definite loss domain. Loss aversion makes the pain of forfeiting the $15M outweigh the rational gain of saving the $5M. The verdict is **escalate**.

  **Key Structural Feature:** The **reverse-vesting clawback**. It converts sunk costs into contingent assets, making withdrawal an active loss event rather than a passive cessation.

  **Collapse Condition:** If you remove the clawback (funds are truly sunk regardless of decision), the reference point aligns with reality. Both theories then agree: **withdraw**.

  **Rational Choice Rebuttal:** A defender might argue the "publicly logged" loss carries hidden reputation costs. If logging "lost capital" reduces future grant eligibility, the $15M forfeiture implies a future financial hit, making staying rational after all.

