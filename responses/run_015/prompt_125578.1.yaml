      *   Solution: We need "Meta-Rationality" or "Structural Rationality." You choose to change the *evaluator*, not the *outcome*.
      *   What collapses? The "Stable Preference" axiom of standard decision theory.
      *   Most damaging requirement: "Conceptual Unreachability." If you can't represent the prior state, you can't compare utilities.

  6.  **Scoring Standard Approaches:**
      *   *Epistemic-Transformation (Paul-ish):* Fails on conceptual closure. It assumes you learn *new* qualia, not lose *old* concepts.
      *   *Decision-Theoretic:* Fails on the tension. Can't calculate expected utility without a stable utility function.
      *   *Diachronic Self-Fragmentation (Parfit-ish):* Best fit. The "self" before and after are psychologically discontinuous enough to be different agents. Solves the rationality problem by denying strict identity.

