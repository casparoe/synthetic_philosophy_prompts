          *   Address the tension: Rational choice requires stable values, but transformation destroys values. Is this a joint-unsatisfiability result? What collapses if we bite the bullet?
          *   Score standard approaches (Epistemic-transformation, Decision-theoretic, Diachronic self-fragmentation).
