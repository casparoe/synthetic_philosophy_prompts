      *   *Second thought:* It's closer to "value drift" in AI alignment, but applied to human phenomenology. Or "wireheading" but voluntary and justified.
      *   *Third thought:* The "Joint-Unsatisfiability" tension is the meat. If rationality = maximizing utility function $U$, and the rewrite changes $U$ to $U'$, you can't maximize $U'$ using $U$. Unless... the choice isn't rational in the standard sense. It's arational, or meta-rational.
      *   *Fourth thought:* Neuroscience constraint. We can't say "the soul left." We have to say "the neural substrate for concept X was repurposed."
      *   *Fifth thought:* The "Obligatory" feel. Why *must* someone do this? Maybe survival? Maybe escaping a cognitive trap?

  4.  **Developing the Desiderata (The Spec):**
      *   *Need:* A list of requirements for the theory to work in the novel.
      *   *Constraint:* Distinguish Hard Constraints (must work for the plot) vs. Camp Preferences (philosophical flavor).
      *   *Item 1: Pre-commitment.* How do you sign the contract? Hard Constraint.
      *   *Item 2: The Outsider/Insider Gap.* Outsiders see the loss; insiders see gain (or nothing). Hard Constraint.
      *   *Item 3: Conceptual Unreachability.* Not amnesia. The language is gone. Hard Constraint.
