answer: |-
  To inquire into the nature of the self is often to attempt a subtraction, a philosophical stripping away of the accidental features of human experience to see what remains when the noise of the world is silenced. Among the most striking attempts to isolate the core of subjectivity is the thought experiment known as the Flying Man, proposed by the medieval philosopher Avicenna. He invites us to imagine a person created all at once, fully adult, suspended in a void where they perceive nothing of the outside world and feel nothing of their own limbs. Deprived of sight, sound, touch, and even proprioception, this figure hangs in a vacuum of sensory data. The question posed is whether such a person would still affirm their own existence. Avicenna argues that they would, asserting that the awareness of self is primitive, immediate, and non-inferential. It does not depend on the perception of the body or the external world. From this, he concludes that the soul is a substance distinct from the body, capable of knowing itself without any bodily medium. This framework presents self-awareness as a luminous, intellectual grasp that requires no spatial location, no boundary, and no affective tone to sustain itself. It is a vision of the self as a pure point of awareness, untouched by the geometry or physics of embodiment.

  In contrast, certain strands of contemporary phenomenology and embodied cognition offer a revision of this stark dualism, advancing what might be termed the thin-subject view. This perspective agrees that something survives radical sensory deprivation, but it disputes the characterization of that remainder as a disembodied intellect. Instead, it suggests that even when specific sensory contents are removed, the structure of subjectivity retains a tacit, pre-objective orientation. On this account, the minimal self that persists in the void is not a purely abstract thinker but a locus of experience that still implicitly carries a sense of here versus there, or a subtle affective tone of presence. The argument is that the very act of recognizing oneself as I smuggles in a framework of spatiality and feeling. To be a subject is to be situated, even if the situation is a void. Therefore, the self-awareness that survives deprivation is not the awareness of a disembodied substance, but the awareness of a minimal embodied perspective that has been stripped of its objects but not its orientational structure. This view challenges the notion that self-awareness can be entirely independent of bodily framing, suggesting instead that the body provides the implicit horizon within which any sense of I arises.

  The central tension between these two frameworks lies in whether the recognition of existence requires a bodily anchor. Avicenna's position relies on the intuition that existence is self-evident to the mind alone. He claims that the suspended figure does not infer I exist from a chain of reasoning but encounters their own presence directly. This is meant to be a non-inferential acquaintance, a knowledge that is identical with the being it knows. However, the thin-subject view presses a critical objection against this claim of purity. It asks whether the feeling of existence is truly devoid of spatial or affective qualities. When the suspended figure affirms I am, is this affirmation occurring nowhere, or is it occurring here, in the center of a perceived void? If there is a sense of center, there is a tacit spatiality. If there is a sense of certainty or presence, there is a tacit affective tone. The modern framework argues that Avicenna mistakes the abstraction of the body for the elimination of bodily structure. By removing the feeling of limbs, one does not remove the perspectival nature of consciousness itself. The vulnerability here is that Avicenna may have presupposed the very bodily framing he claims to have eliminated, masking a subtle sense of location or orientation as a purely intellectual insight.

  Conversely, the thin-subject view must account for why self-awareness survives at all if it is so tightly bound to bodily structures. If the self is essentially a mode of bodily orientation, does radical deprivation not threaten to collapse self-awareness into mere awareness of mental contents, or worse, into nothingness? The defense offered by this framework is that the minimal subject is not a content but a form of experiencing. It is the difference between seeing a thought and being the one to whom the thought appears. Even in the void, there is a distinction between the experience and the experiencer, maintained by a residual sense of ownership or perspective. This account is defensible because it aligns with the intuition that consciousness is always consciousness of something, even if that something is only the state of deprivation itself. However, this position is vulnerable to the charge that it projects normal bodily experience onto an abnormal state. If a person is truly deprived of all proprioception and sensory input from birth, as the thought experiment suggests, do they possess the concepts of here or presence required to sustain this minimal subjectivity? The thin-subject view risks presupposing a history of embodiment that the suspended figure, by definition, might lack. It assumes that spatiality is innate to consciousness rather than learned through interaction with a world.

  When evaluating which framework provides a more defensible account of why self-awareness survives without collapsing into mere awareness of mental contents, one must consider the nature of the survival itself. Avicenna's account is powerful because it posits a self that is invariant. If the self is a substance, it remains itself regardless of what happens to the body or the senses. This explains the survival of self-awareness effortlessly; the light of the soul shines regardless of whether there are objects to illuminate. The weakness, however, is that this light becomes indistinguishable from darkness if there are no objects. A self that knows nothing but itself risks becoming an empty tautology. The thin-subject view avoids this emptiness by suggesting that the self is defined by its relation to a horizon, even an empty one. This preserves the dynamic nature of consciousness. It explains survival not by invoking a separate substance, but by identifying a structural feature of experience that persists even when content is removed. The self survives because the structure of perspective survives. Yet, this makes the self more fragile, dependent on the persistence of this minimal orientation which might itself be vulnerable to dissolution under extreme deprivation.

  The charge of presupposition hangs over both accounts. Avicenna is vulnerable to the claim that his suspended figure is not truly devoid of bodily experience because the act of thinking itself is experienced as occurring within a temporal and perhaps spatial flow. To affirm I exist is to perform an act, and acts imply an agent situated in time. If the agent is situated, the separation from the body is not as complete as claimed. The thin-subject view is vulnerable to the reverse charge: that it presupposes the body to explain the self, thereby failing to account for the possibility of a self that transcends specific bodily configurations. It may conflate the conditions for human self-awareness with the conditions for self-awareness as such. If the suspended figure is human, they carry the history of human embodiment, but if the thought experiment is meant to reveal the nature of the soul universally, relying on human-specific spatial intuitions undermines the conclusion. Both frameworks struggle to fully articulate how a subject can be aware of itself without that awareness taking on the characteristics of an object, whether that object is a soul-substance or a minimal bodily perspective.

  Ultimately, the comparison reveals that the question of self-awareness in deprivation is less about proving the immateriality of the soul and more about understanding the limits of abstraction. Avicenna's Flying Man demonstrates that we can conceptually separate the idea of self from the idea of body, but it does not necessarily prove that the experience of self is independent of the body. The thin-subject view reminds us that experience is always textured, even when the texture is reduced to the bare minimum of presence. In seeking to explain why self-awareness survives, the medieval framework offers certainty at the cost of emptiness, while the modern framework offers richness at the cost of dependency. The most defensible position may lie in recognizing that self-awareness is not a single thing that either survives or perishes, but a layered phenomenon. At one level, the affirmation of existence may indeed be immediate and non-inferential, as Avicenna claimed. But at another level, the quality and structure of that affirmation may rely on the tacit, embodied orientations that the thin-subject view makes explicit. To deny the body entirely is to risk describing a self that no human being could ever recognize as their own, while to bind the self too tightly to the body is to risk losing the sense of transcendence that motivates the inquiry in the first place. The truth likely resides in the tension between the pure assertion of I am and the silent, spatial whisper of here that accompanies it.
