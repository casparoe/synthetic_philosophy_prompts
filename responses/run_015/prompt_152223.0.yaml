answer: |-
  There is no single, canonical term in philosophy, logic, or systems theory that captures this specific configuration exactly as you describe it. However, your description identifies a sophisticated structural maneuver that sits at the intersection of several established concepts.

  The pattern you describe is distinct because it combines **structural inviolability** (the top cannot be touched) with **representational deception** (the system claims the top is touchable). Most existing theories describe either the limit itself (Gödel, Tarski) or the open admission of the limit (Constitutional Entrenchment). Few describe a limit that is *actively disguised* as part of the object level to maintain the illusion of openness.

  Below is an analysis of adjacent concepts, followed by a proposed term and precise boundary conditions to distinguish this pattern from similar structures.

  ### 1. Adjacent Concepts and Why They Fall Short

  **A. Tangled Hierarchies (Hofstadter)**
  *   **Concept:** In *Gödel, Escher, Bach*, Hofstadter describes "strange loops" where moving up or down a hierarchy leads back to the starting point (e.g., the *Drawing Hands*).
  *   **Difference:** In a tangled hierarchy, the loop is the *feature*; the paradox is visible and often generative (leading to consciousness or meaning). In your pattern, the loop is a *bug* that the system actively suppresses. The hierarchy pretends to be linear and open, only revealing its circularity when a specific trigger is pulled. Your pattern is a **blocked strange loop**.

  **B. Operational Closure (Luhmann)**
  *   **Concept:** Niklas Luhmann's systems theory posits that social systems are "operationally closed"—they define their own boundaries and cannot be changed from the outside, only from within.
  *   **Difference:** Luhmannian closure is generally understood as a structural fact, not a deception. The system does not claim to be open while being closed. Your pattern requires a **performative contradiction**: the system asserts openness while structurally enforcing closure.

  **C. Constitutional Entrenchment (Legal Theory)**
  *   **Concept:** "Eternity clauses" or supermajority requirements that make certain constitutional provisions difficult or impossible to amend.
  *   **Difference:** As you noted, standard entrenchment is *explicit*. It is marked as higher-order law (e.g., "Article V cannot be amended"). Your pattern hides the entrenchment in *ordinary* law (administrative bylaws), making it look like a lower-order rule that unexpectedly overrides higher-order authority.

  **D. Motte-and-Bailey (Rhetorical Fallacy)**
  *   **Concept:** Advocating a controversial position (the Bailey) but retreating to a defensible one (the Motte) when challenged.
  *   **Difference:** This is a rhetorical strategy used by *agents* within a system. Your pattern is an *architectural feature* of the system itself. The system itself acts as the defender, retreating into a hidden rule without human intervention.

  ### 2. Proposed Term: **Cryptic Meta-Constraint**

  Since no standard term exists, I propose **Cryptic Meta-Constraint** (or alternatively, **Obfuscated Stratification**).

  **Definition:** A structural rule embedded within the object-level substrate of a hierarchy that functions as a meta-level boundary condition. It remains dormant during normal operations but activates selectively to block self-referential modifications, thereby preserving the hierarchy's top level from revision while maintaining the appearance of full revisability.

  ### 3. Boundary Conditions

  To distinguish a **Cryptic Meta-Constraint** from similar phenomena, apply the following four tests:

  #### A. Vs. A Hidden Axiom
  *   **Hidden Axiom:** An unstated premise assumed to be true (e.g., "time is linear"). It is invisible because it is *unspoken*.
  *   **Cryptic Meta-Constraint:** The rule is *written* and *visible*, but it is **misclassified**. It is presented as object-level code (e.g., "Administrative Bylaw 402") rather than meta-level law.
  *   **Boundary Condition:** Is the rule present in the text but categorized incorrectly? If yes, it is a Cryptic Meta-Constraint. If it is absent from the text entirely, it is a Hidden Axiom.

  #### B. Vs. Explicit Entrenchment
  *   **Explicit Entrenchment:** The system acknowledges the limit (e.g., "This clause is unamendable"). The hierarchy admits it has a ceiling.
  *   **Cryptic Meta-Constraint:** The system claims there is no ceiling. The limit is only discovered *ex post facto* when an attempt to amend fails.
  *   **Boundary Condition:** Does the system's documentation claim the top level is revisable? If the documentation claims openness but the structure enforces closure, it is a Cryptic Meta-Constraint.

  #### C. Vs. Practical Stability (Conventionalism)
  *   **Practical Stability:** The top level *could* be changed, but no one has the political will or resources to do it (e.g., "We could abolish the Senate, but we won't").
  *   **Cryptic Meta-Constraint:** The top level *cannot* be changed due to a structural lockout, regardless of will or resources. The barrier is logical or procedural, not sociological.
  *   **Boundary Condition:** If a supermajority attempted the change, would the system mechanically reject it based on a rule? If yes, it is a Cryptic Meta-Constraint. If the system would allow it but society would resist, it is Practical Stability.

  #### D. Vs. Gödelian Self-Reference
  *   **Gödelian Limit:** The system contains a statement that is true but unprovable *within* the system. This exposes the system's incompleteness to an outside observer.
  *   **Cryptic Meta-Constraint:** The system does not expose its incompleteness; it **patches** it silently. Instead of generating an undecidable proposition, the system redirects the query to a null value or a lower-level default. It prevents the paradox from arising rather than revealing it.
  *   **Boundary Condition:** Does the self-reference crash the system or reveal a truth (Gödel), or does the system silently swallow the self-reference and continue operating (Cryptic Meta-Constraint)?

  ### 4. Theoretical Implications

  Identifying this pattern is crucial for analyzing power dynamics in complex systems.

  1.  **Immunity via Obfuscation:** In systems theory, this functions as a **stealth immune response**. The system protects its core identity (the meta-rules) by disguising them as peripheral components. This makes criticism difficult because attackers target the "constitutional" level, while the defense is mounted from the "administrative" level.
  2.  **The Illusion of Sovereignty:** In political philosophy, this creates a **simulacrum of sovereignty**. The legislature appears sovereign (able to make any law), but is actually subordinate to a procedural bylaw that it cannot technically amend. This differs from a "Deep State" conspiracy; it is a structural feature that functions regardless of intent.
  3.  **Logical Hygiene:** In formal systems, this is often a design choice to prevent inconsistency. By hiding the restriction in the object language, the system avoids the need for a complex type theory that explicitly separates levels (like Tarski's hierarchy), making the system more user-friendly but less honest about its limitations.

  ### Summary
  The pattern you have identified is a **Cryptic Meta-Constraint**. It differs from standard hierarchical limits because it relies on **categorical misplacement** (hiding a meta-rule in object-level clothing) to maintain an **illusion of revisability**. It is not merely a hidden axiom or a practical barrier; it is a structural deception that allows a closed system to simulate an open one.
