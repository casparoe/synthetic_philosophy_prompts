  6.  **Final Polish:** Check against the "Do not offer a general impression" rule. I need to make sure I don't start with "This essay is average." I must start with the grade or jump straight into the breakdown. The prompt asks for "a specific letter grade and a point-by-point justification." I will lead with the grade, then the breakdown.

