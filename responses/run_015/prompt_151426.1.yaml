answer: |-
  This is a remarkably precise and fertile theoretical framework. By distinguishing between *factual fidelity* (the epistemic claim) and *axiological fidelity* (the ethical/ontological claim), you move the debate beyond the tired "art vs. history" binary into the realm of posthumous personhood. Your concept of *counterfactual dignity harm* is particularly potent: it suggests that the dead can be wronged not just by lies, but by a fundamental misalignment of their moral architecture.

  Reading *Amadeus* through this lens reveals that the film's transgressions are almost entirely axiological, and that the resulting dignity harm is the engine of the film's power. Here is an analysis of how Shaffer and Forman navigate (or obliterate) these obligations.

  ### 1. The Axiological Inversion of Salieri
  If we look strictly at *factual fidelity*, *Amadeus* is indefensible. Salieri did not poison Mozart; he was not a mediocrity (he was one of the most celebrated composers of his day); and he was not consumed by a hatred of God. However, under your framework, the graver offense is the **axiological inversion**.

  The historical Salieri was a devout Catholic who viewed music as a form of prayer and service. He saw himself as a craftsman within a divine order. The film's Salieri, conversely, views music as a transaction: *I give you virtue/chastity; you give me immortality.* When God gives immortality to Mozart instead, Salieri's value system collapses into nihilism.

  *   **The Harm:** This is not merely a factual error; it is a reconstruction of Salieri's interiority that renders him unrecognizable to himself. The historical Salieri valued *piety*; the cinematic Salieri values *recognition*.
  *   **The Defense:** Shaffer has argued that he needed Salieri to be the "patron saint of mediocrity" to explore the universal human experience of envy. But through your lens, this defense admits to the axiological breach. Shaffer is using Salieri's name as a vessel for a modern, secular anxiety (the unfairness of talent) that the historical Salieri likely did not possess.

  ### 2. Scenes of Counterfactual Dignity Harm
  Three specific sequences illustrate where the film transitions from historical license to dignity harm.

  **A. The Framing Confession (The "Absolution" Scene)**
  Salieri tells the priest, "I spoke for [God]... I was his voice." This establishes the axiological stakes. The harm here is theological. The real Salieri died having received Last Rites, likely in a state of grace according to his own lights. The film posits that his entire life was a blasphemous bargain.
  *   *Ethical Reading:* This scene commits the deepest counterfactual dignity harm. It asserts that Salieri's own understanding of his relationship with the Divine was a delusion, replacing it with a narrative of cosmic spite. It denies him the dignity of his own faith.

  **B. The Court Musician's Humiliation (The *Abduction* Review)**
  When Salieri critiques Mozart's *Abduction from the Seraglio* ("too many notes"), the film frames this as the jealousy of a mediocre gatekeeper. Historically, Salieri supported Mozart's work and even collaborated with him.
  *   *Ethical Reading:* This scene violates axiological fidelity regarding Salieri's professional ethics. It portrays him as a saboteur of the art form he claimed to serve. The dignity harm lies in painting a respected teacher and mentor as a petty obstructer of genius. It reduces his professional judgment to sour grapes.

  **C. The Final Institutionalization**
  In the asylum, Salieri declares himself the voice of all the mediocrities of the world. "I speak for them."
  *   *Ethical Reading:* This is the film's attempt to *redeem* the dignity harm by granting Salieri a different kind of dignity—the dignity of the martyr for the average. However, from your framework, this is a further violation. It appropriates his mental decline (historically linked to syphilis or dementia) and reframes it as a philosophical stance. It turns his suffering into a thematic punchline.

  ### 3. Mozart and the Shield of Music
  You ask if Mozart is protected by the survival of his music. I would argue he is uniquely vulnerable to **counterfactual dignity harm** precisely *because* the music survives.

  The film reduces Mozart's genius to a biological accident—a "voice" channeling through a "dirty child." By portraying him as scatological, infantile, and financially irresponsible, the film severs the link between the *man* and the *work*.
  *   **The Harm:** If the music is divine and the man is a fool, the man becomes a mere vessel. This strips Mozart of his *agency*. It suggests he didn't *work* for the Requiem; he just transcribed it.
  *   **Axiological Failure:** The historical Mozart was a serious Freemason, a devoted father (despite losses), and a shrewd (if unlucky) businessman. The film's portrayal suggests that true genius cannot coexist with maturity. This is a romantic cliché that does violence to Mozart's self-conception as a professional craftsman. The music protects his *legacy*, but the film damages his *personhood*.

  ### 4. What *Amadeus* Adds to the Philosophical Debate
  Standard arguments about "artistic license" assume that the dead have no rights, or that their rights are limited to defamation (which usually expires). Your framework suggests the dead have an interest in *narrative integrity*.

  *Amadeus* complicates this by suggesting that **axiological fidelity might sometimes be an obstacle to truth.**
  1.  **The Truth of Effect vs. The Truth of Cause:** Historically, Salieri did not kill Mozart. But culturally, the *myth* of Salieri killing Mozart reveals a truth about how we process genius and mediocrity. The film argues that the "lie" tells a deeper truth about the human condition than the "fact" does.
  2.  **The Ventriloquist's Debt:** *Amadeus* adds the idea that if a dramatist violates axiological fidelity, they owe the subject a specific kind of acknowledgment. The film *knows* it is lying. Salieri's opening line ("Forgive me, forgive me...") is an apology not just to God, but to the audience, and perhaps meta-textually to the dead.
  3.  **Posthumous Misrecognition as Art:** The film posits that "misrecognition" is sometimes necessary for the dead to remain alive in the cultural imagination. A strictly axiologically faithful Salieri (a pious, respected teacher who admired Mozart) makes for a boring drama. *Amadeus* forces us to ask: **Do we owe the dead accuracy, or do we owe them relevance?**

  ### Conclusion
  Through your lens, *Amadeus* is ethically culpable. It commits a severe **axiological failure** by constructing a Salieri whose values (envy over piety, fame over service) are the inverse of the historical record. It inflicts **counterfactual dignity harm** by suggesting his life was a blasphemy rather than a devotion.

  However, the film's enduring power suggests a uncomfortable addendum to your seminar's debate: **Posthumous ethics may be in tension with cultural memory.** We remember Salieri *because* Shaffer wronged him. If Shaffer had maintained axiological fidelity, Salieri would remain a footnote. The film suggests that the "obligation" to the dead is not necessarily to preserve their self-conception, but to ensure they continue to matter—even if that requires turning them into a monster.

  For your seminar, the critical question becomes: **Is counterfactual dignity harm a permissible cost for cultural immortality?** *Amadeus* votes yes. Your framework gives us the vocabulary to argue why that "yes" might be a profound ethical violation, regardless of the film's artistic merit.
