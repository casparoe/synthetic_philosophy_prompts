          *   *Counterfactual Dignity Harm:* Wronging the dead by creating a persona alien to their self-understanding (posthumous misrecognition).
      *   **Subject:** Miloš Forman's *Amadeus* (1984) / Peter Shaffer's play.
      *   **Specific Focus:** Antonio Salieri's portrayal (invented poisoning/envy vs. inverted values/self-image). Specific scenes (confession, humiliation, institutionalization). Mozart's portrayal (genius vs. vulgarity).
      *   **Goal:** Determine what *Amadeus* adds to the philosophical debate that standard "artistic license" arguments miss.

  2.  **Deconstruct the Ethical Framework:**
      *   The user's framework is strong. It moves beyond "did it happen?" to "is this *them*?"
      *   *Factual Fidelity* is the easy target. *Amadeus* fails this miserably (no poisoning, Salieri wasn't a mediocrity, they weren't rivals in that way).
      *   *Axiological Fidelity* is the harder, more interesting target. Did Shaffer/Forman capture Salieri's *soul*, even if they changed the *facts*?
      *   *Counterfactual Dignity Harm* is the harm caused by the axiological failure. If Salieri saw this, would he feel recognized or monstrous?

  3.  **Analyze *Amadeus* through the Lens:**
      *   **Salieri:**
          *   *Historical Reality:* Devout Catholic, respected teacher, successful composer, likely admired Mozart but not consumed by murderous envy. He saw himself as a servant of God and music.
          *   *Film Portrayal:* Obsessed with fame/legacy, vengeful against God, sees music as a transaction for virtue, murders Mozart.
          *   *Axiological Verdict:* This is a radical inversion. The historical Salieri valued piety and craft; the film Salieri values recognition and resents God's unfairness. This is a massive *axiological* breach.
          *   *Counterfactual Dignity Harm:* High. A devout man portrayed as a blasphemous murderer suffers extreme misrecognition.
      *   **Mozart:**
          *   *Historical Reality:* Complex, sometimes crude but also deeply serious, devoted father/husband, financially struggling but not destitute until the end.
          *   *Film Portrayal:* Infantile, scatological, dependent, purely instinctual (no labor).
          *   *Axiological Verdict:* Reduces agency and intellect to pure "channeling."
          *   *Counterfactual Dignity Harm:* Significant. It strips him of his labor and maturity.
      *   **Specific Scenes:**
          *   *Confession:* Establishes the theological stakes. Salieri claims to be the patron saint of mediocrity. This is the axiological core—the inversion of his piety.
          *   *Humiliation (The Abduction from the Seraglio review):* Shows the court's reaction. Highlights Salieri's role as the gatekeeper of "proper" music vs. Mozart's "too many notes."
          *   *Institutionization:* Salieri declaring himself the voice of the voiceless. This is where he claims a twisted dignity.

  4.  **Synthesize the Argument:**
      *   *Thesis:* *Amadeus* commits a profound *axiological* failure regarding Salieri that outweighs the *factual* inaccuracies. However, it might argue that this violation is the *price* of accessing a deeper thematic truth about envy and genius, effectively trading the specific dead man for a universal archetype.
      *   *The "What We Owe the Dead" Angle:* Standard arguments say "Art isn't history." The user's framework asks "Does art have ethics regarding personhood?" *Amadeus* suggests that sometimes the "truth" of a life (the emotional/psychological arc) requires violating the "facts" of a life, but this creates a specific debt: the debt of *acknowledgment*. The film knows it's lying.
      *   *Mozart's Music as Shield:* The music survives. Does the beauty of the work redeem the caricature of the man? Or does the caricature make the music seem accidental?

  5.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Validate the user's sophisticated framework. Acknowledge the shift from epistemic (truth) to ethical (dignity) concerns.
      *   *Section 1: Factual vs. Axiological Fidelity in Salieri.* Contrast the historical Salieri (pious, respected) with the cinematic Salieri (blasphemous, envious). Argue that the axiological breach is the deeper wound. The "mediocrity" isn't just a fact error; it's a value error.
      *   *Section 2: Counterfactual Dignity Harm.* Apply this to specific scenes. The Confession is the key. It frames his life as a battle with God, whereas the real Salieri likely saw it as service. The Institutionalization scene is him claiming a martyrdom he didn't earn.
      *   *Section 3: Mozart's Vulnerability.* Address the "childish vulgarity." Does the music protect him? Argue that the film risks making the music seem like a biological accident rather than a human achievement, which is a dignity harm to his *agency*.
      *   *Section 4: The Philosophical Contribution.* What does this add to the debate? It moves beyond "license" to "ventriloquism." The film admits it is using Salieri as a narrator to confess *humanity's* envy, not Salieri's specific sin. The ethical defense rests on the *universalization* of the specific.
      *   *Conclusion:* Summarize. The film violates axiological fidelity to achieve thematic resonance. Whether this is justified depends on whether we view the dead as rights-holders or raw material for cultural memory.

  6.  **Refining the Tone:**
