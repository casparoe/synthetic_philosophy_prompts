answer: |-
  This is a classic problem in political fiction: when everyone agrees on the *goal* (education is good), the conflict has to live in the *mechanism*. In reality, these positions are often messy hybrids, but for a scene to work, you need to sharpen the philosophical fault lines.

  Below is a decision tree built from the logical space of **benefit, risk, and reciprocity**. It avoids abstract rights language and uses the concrete kitchen-table cases you requested.

  ### The Root Premise
  **Everyone agrees:** A population with more university graduates is better than one with fewer. The state has *some* interest in promoting this.
  **The Conflict:** How do we split the bill for that interest?

  ---

  ### The Decision Tree

  #### Node 1: The Plumber Test (Ownership of Earnings)
  *When a graduate earns more than a non-graduate over their lifetime, who primarily owns that extra money?*
  *   **A. The Society.** That higher salary is a return on the public investment that created the skilled worker. (Go to Node 2)
  *   **B. The Individual.** That higher salary is a private reward for personal effort and risk-taking. (Go to Node 3)

  #### Node 2: The Arms Race Test (Scope of Subsidy)
  *If society owns the benefit, do we fund everyone to keep up with the global economy, or only those who need it?*
  *   **A. Fund Everyone.** Credential inflation means *everyone* needs a degree to stay competitive; restricting access hurts the economy. (Go to Node 4)
  *   **B. Fund Selectively.** We can't afford to subsidize degrees for everyone; target the money where it's needed most or where the ROI is highest. (Leaf: **Free Tuition with Strings**)

  #### Node 3: The Failure Test (Risk Allocation)
  *If the individual owns the earnings, but the degree *doesn't* lead to higher earnings (e.g., underemployment), who ate the cost?*
  *   **A. The State.** If the system failed to produce a high earner, the taxpayer absorbs the loss via non-repayment. (Leaf: **Income-Contingent Loan / Graduate Tax**)
  *   **B. The Student.** The debt is owed regardless of outcome; education is a purchase like a car or a house. (Go to Node 5)

  #### Node 4: The Border Test (Reciprocity)
  *If tuition is free for everyone, does the obligation stay within the country?*
  *   **A. No Obligation.** Education is a universal right/good; if they leave, it's "brain drain," but we don't send a bill. (Leaf: **Flat Free Tuition**)
  *   **B. Obligation Follows.** The funding was a national investment; if you leave the tax base, you must repay the grant. (Leaf: **Free Tuition with Clawback Strings**)

  #### Node 5: The Rent Test (Scope of Cost)
  *If the student bears the debt, does the state ensure they can survive to finish the degree?*
  *   **A. Yes.** Tuition is free/loans, but the state provides living stipends/housing support so poverty doesn't block completion. (Leaf: **Private Investment / Kindler Loans + Support**)
  *   **B. No.** Living costs are a private matter; the state only intervenes in the price of the classes, if at all. (Go to Node 6)

  #### Node 6: The Memory Test (Feasibility)
  *Can we replicate the low-cost model of the 1980s, or has the scale changed the math?*
  *   **A. Yes, it's Political.** We *could* fund it like the 80s if we prioritized it; high costs are a policy choice, not an economic law. (Leaf: **No Subsidy / Market Rate** — *Note: This position argues state subsidy is unnecessary distortion.*)
  *   **B. No, it's Math.** Mass education costs more than elite education; without subsidy, only the rich can go. (Leaf: **Private Investment / Kindler Loans**)

  ---

  ### The Leaves (The Positions at the Table)

  Here are the six resulting positions. I have mapped your characters to the positions they are most likely to defend, though characters can argue against their own leaf for dramatic tension.

  1.  **Flat Free Tuition (The Universalist)**
      *   *Logic:* Education is a public good like streetlights. The plumber benefits from living near a doctor, so the plumber pays.
      *   *Character:* **The Berlin Sister.** She lives this. She pays high taxes now, but views it as a civic subscription, not a debt.
      *   *Weakness:* Struggles to answer why a banker should get the same subsidy as a social worker.

  2.  **Free Tuition with Strings (The Contractualist)**
      *   *Logic:* It's free, but it's a contract. Means-tested (only poor get it) or Clawback (pay us back if you emigrate).
      *   *Character:* **The Aunt (Modified).** She might argue, "If you take the Swedish money, you owe Sweden. You can't take the subsidy and move to New York."
      *   *Weakness:* Creates a bureaucracy to monitor graduates' lives.

  3.  **Income-Contingent Loan / Graduate Tax (The Risk-Pooler)**
      *   *Logic:* You only pay if you can afford it. It's a tax on your success, not a debt on your existence.
      *   *Character:* **The British Brother.** He is living this. He argues it's fairer than fixed debt because it protects the "failure" cases.
      *   *Weakness:* High earners feel penalized for succeeding.

  4.  **Private Investment / Kindler Loans (The Human Capital Theorist)**
      *   *Logic:* It's a private purchase, but the state should make the credit cheap and fair because we all benefit from an educated populace.
      *   *Character:* **The Youngest (Leaning US).** She wants the US degree but fears the debt. She argues for low-interest, fixed loans with bankruptcy protections.
      *   *Weakness:* Still leaves the "art history driving a taxi" student with debt they can't clear.

  5.  **No Subsidy / Market Rate (The Libertarian Realist)**
      *   *Logic:* Subsidies just drive up tuition prices (Bennett Hypothesis). Let the market set the cost; scholarships exist for the needy.
      *   *Character:* **The Aunt (Hardline).** "I paid my way in the 80s. Why is it a government problem now?"
      *   *Weakness:* Ignores that 1980s college was a fraction of current costs relative to income.

  6.  **[EMPTY SLOT] High Subsidy + High Personal Risk**
      *   *Logic:* The government pays the university upfront, but the student owes the government personally even if they don't graduate or earn enough.
      *   *Why Empty:* This combines the cost of socialism with the cruelty of capitalism. It is politically toxic. No one advocates this openly, though some systems accidentally drift here.
      *   *Dramatic Use:* If a character proposes this, the others should immediately circle the wagons against them. It's the "villain" position.

  ---

  ### Critical Flags for the Writer

  #### 1. The Indistinguishable Leaves: ICL vs. Graduate Tax
  You asked me to flag if the tree can't separate these. **It can't, not really.**
  *   **Income-Contingent Loan (ICL):** You owe $50k. You pay 9% of income. If you earn little, you pay little. After 25 years, remaining debt is forgiven.
  *   **Graduate Tax:** You pay 9% of income for 25 years.
  *   **The Reality:** Mathematically, these are almost identical. The difference is *accounting* (is it a debt on a balance sheet or a tax rate?) and *psychology* (does the student feel like a debtor or a taxpayer?).
  *   **Scene Tip:** Don't have the Brother and Sister fight about the *mechanism*. Have them fight about the *label*. The Brother hates the "debt" label; the Sister hates the "tax" label. They are actually agreeing on the outcome but disagreeing on the moral framing.

  #### 2. The "80s" Fallacy (Node 6)
  The Aunt's argument ("It was cheap for me") rests on **Elite vs. Mass** education.
  *   **1980s:** ~15% of people went to university. It was cheap to subsidize a small elite.
  *   **Now:** ~50%+ go to university.
  *   **The Fight:** The Aunt thinks the *price* changed. The Berlin Sister knows the *scale* changed. This is a crucial distinction. The Aunt is arguing from nostalgia; the Sister is arguing from demographics.

  #### 3. The "Rent" Distinction (Node 5)
  This is the specific German vs. Nordic fight.
  *   **Germany:** Tuition is free. Rent is expensive. Poor students struggle to eat.
  *   **Sweden:** Tuition is free. Stipends cover rent.
  *   **The Fight:** The Berlin Sister might say "It's free." The Youngest (looking at Sweden) might say "But can I *live* there?" This separates "access to class" from "access to completion."

  ### How to Use This in the Scene

  To fix the "anger near each other" problem, assign each character a **Node** they are obsessed with.

  *   **The Aunt** is stuck on **Node 6 (Memory)**. She keeps bringing up the 80s. She can't comprehend the scale change.
  *   **The British Brother** is stuck on **Node 3 (Risk)**. He is terrified of the "Failure Test." He argues for ICL because he's afraid of the art-history-dropout scenario.
  *   **The Berlin Sister** is stuck on **Node 1 (Plumber)**. She argues from civic duty. She gets frustrated when the Aunt talks about "investment" rather than "society."
  *   **The Youngest** is stuck on **Node 5 (Rent)**. She doesn't care about the philosophy; she cares if she can afford to eat in Stockholm vs. New York.

  **The Climax Moment:**
  The argument shouldn't end with a solution. It should end when they realize they are answering different questions.
  *   *Example:* The Aunt says, "Why should the plumber pay?" (Node 1). The Brother says, "What if the plumber's kid doesn't graduate?" (Node 3). The Sister says, "What if the kid moves to the US?" (Node 4).
  *   The realization: **They are all right about their specific slice, but incompatible on the whole.** The Youngest has to choose not based on who won the argument, but on which risk *she* is willing to take.

  This structure gives you distinct philosophical commitments without making anyone sound like a caricature. They are all optimizing for a different variable (Fairness, Risk, Civic Duty, Feasibility).
