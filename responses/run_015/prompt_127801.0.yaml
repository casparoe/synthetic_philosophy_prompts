  4.  **Develop the Counter-Argument (Focusing on the User's "Calibration Collapse"):**
      *   The user's intuition about "Monitoring Capacity" vs. "Production Capacity" is strong.
      *   The key distinction is *Epistemic Agency* vs. *Epistemic Outcome*.
      *   The blasé argument focuses on the *outcome* (is the belief true?). The worry is about the *agent* (can the agent sustain the belief?).

  5.  **Drafting the Response - Section by Section:**

