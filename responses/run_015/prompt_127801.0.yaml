      *   *Step (2):* This is the juiciest target. Is AI *really* like a calculator or a colleague?
          *   Calculator: Deterministic, transparent logic.
          *   Colleague: Accountable, shared epistemic community.
          *   AI: Probabilistic, opaque, non-accountable, *generative* (creates the path, not just the answer).
      *   *Step (4):* "Erosion of understanding = Worsening epistemic position." This is the crux of the user's "calibration collapse" intuition. Understanding isn't just having true beliefs (epistemic position regarding *truth*); it's having a grasp of *relations* between beliefs (explanatory coherence). You can have true beliefs without understanding (Gettier cases, or blind reliance).
