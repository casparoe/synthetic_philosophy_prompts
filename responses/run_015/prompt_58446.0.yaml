      *   Make sure the communication advice helps them save face with donors who want big numbers.

  8.  *(Final thought)*: The user is asking for *implications* of the debate, not a solution to the debate. I must emphasize that the philosophy tells us *why* it's hard, not *which* to pick. The value is in the clarity of the trade-off.

  **(Self-Correction Note):** I need to be careful not to solve the ethical problem for them (i.e., telling them to pick the severe pain group). Instead, I need to tell them how the *existence* of the problem changes how they make the decision. The prompt asks: "how should it affect our choice of decision procedure..."

