          *   Why can't two spheres be in the same place if PII is false? Usually, impenetrability is the barrier. But if PII is false, what stops them?
          *   If (iii) is true (objects are nodes in relational structure), co-located objects would occupy the same structural node regarding spatial relations.
          *   *Severity:* Low-Medium. Can be explained by causal powers or exclusion principles, but needs justification given (i).

  5.  **Ranking the Tensions:**

      1.  **(vi) vs. (v) [The Rotating/Relationism Clash]:** This is the killer. You cannot have non-symmetric rotation in a two-body relational universe. It requires absolute space (violating v) or makes them symmetric again (violating the "asymmetry" claim in vi).
      2.  **(i) vs. (v) [The Shift Argument Undermining]:** If PII is false, the Leibnizian argument for Relationism loses its bite. Why reject substantivalism if indiscernible worlds are allowed?
      3.  **(iii) vs. (i) [Structuralism vs. Primitive Thisness-lite]:** If objects are just nodes, and nodes are symmetric, distinctness is hard to ground without haecceities (which are banned in iii).
