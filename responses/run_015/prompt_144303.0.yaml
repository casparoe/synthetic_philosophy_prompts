          *   To say "A rotates and B does not" requires a background frame (Substantivalism) or distant stars (Machian).
          *   User says "otherwise empty universe" in (i). If (vi) keeps this emptiness, (vi) contradicts (v). You cannot have absolute rotation in a relational universe with only two bodies.
