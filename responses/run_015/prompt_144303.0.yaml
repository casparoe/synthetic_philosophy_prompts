          *   *Severity:* Medium-High. It challenges the positive account in (iii).

      *   *Tension D: (vi) Rotating Spheres vs. (v) Relationism.*
          *   User stipulates: One rotates, one doesn't. Rigid, homogeneous.
          *   If Space is relational (v), rotation must be relative to other matter.
