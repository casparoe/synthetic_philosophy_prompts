          5.  Identify what each conclusion really rests on.
          6.  Suggest a better picture or repaired bathtub.
          7.  **Constraint:** No preamble, don't restate the question.

  2.  **Deconstruct the Bathtub Analogy & Claims:**
      *   *Analogy:* Atmosphere = Tub, Emissions = Faucet, Sinks = Drain, CO2 Concentration = Water Level, Damage = Overflow.
      *   *Claim (a):* Only level matters morally (cumulative budget), flow is inert. Discount rates irrelevant (people in 2100 are just people).
