          1.  Drain capacity isn't fixed (sinks weaken/feedbacks).
          2.  Damage isn't a threshold (overflow); it's smooth/convex.
          3.  Reversibility (water doesn't un-slop).
          4.  Agent identity (fillers vs. wet people are overlapping/distinct).
      *   *My Additions:*
          5.  Inertia/Lags (water level doesn't rise instantly; warming lags CO2).
          6.  Tipping Points (the tub might break or tip over, not just overflow).
          7.  Distribution (water rises evenly; damage is uneven).
          8.  Mopping limits (adaptation has limits, unlike mopping a floor).

  4.  **Map Disanalogies to Claims (a-d):**
      *   *(a) Cumulative Budget/Discounting:* Relies on level = damage. If damage is path-dependent or rate-dependent (not just stock), this fails. Also relies on interchangeability of time (discounting). The tub implies stock matters, not flow rate. *Bite:* Damage is often rate-dependent (adaptation capacity) and irreversible.
      *   *(b) Substitutability (Overshoot):* Relies on reversibility (water goes down if you open drain/remove carbon). *Bite:* Irreversibilities (ice sheets, species loss) mean "mopping up" CO2 doesn't undo damage done during overshoot.
      *   *(c) Sinks Responsibility:* Relies on drain being external/fixed. *Bite:* We *are* affecting the drain (deforestation, warming reducing sink efficiency). Ignoring this leads to underestimating required mitigation.
