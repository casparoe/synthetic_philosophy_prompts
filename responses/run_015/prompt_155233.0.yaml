      *Check Claim (c):* "Drain isn't ours to fix." This is factually wrong (land use change). The analogy makes it look external.
      *Check Claim (d):* "Mitigation and adaptation are same kind." Mopping implies you can keep the floor dry indefinitely if you pay. Adaptation has hard limits (wet feet inevitable).

      *Final Polish:* Ensure the distinction between "cosmetic" and "biting" is clear. Cosmetic = doesn't change the logic. Biting = breaks the inference.

