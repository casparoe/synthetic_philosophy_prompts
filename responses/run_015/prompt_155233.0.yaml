      *   *Bottom Line:* The bathtub analogy is mechanically useful for stock-flow intuition but morally misleading because it smuggles in assumptions about reversibility, linearity, and agency that invalidate claims (b) and (d) while oversimplifying (a) and (c).
      *   *Correspondence Table:* Straightforward mapping.
