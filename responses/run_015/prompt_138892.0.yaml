  **The Actions:**
  1.  **Attempt Alpha:** Fly to Raft Alpha.
  2.  **Attempt Beta:** Fly to Raft Beta.

  **The Constraints:**
  *   **Expected Lives:** Action 1 saves $1 \times 0.5 = 0.5$ expected lives. Action 2 saves $5 \times 0.1 = 0.5$ expected lives. The expected utility is exactly equal.
  *   **Symmetry:** All individuals are strangers, equally innocent, equally in need, and face death if not rescued. The only differences are group size and the objective probability of success attached to the location.

  ---

  ### The Analysis

  Here is how the three positions adjudicate this specific case.

  **1. Plain Save-the-Greater-Number (Expected Utility)**
  *   **Verdict:** **Indifferent.**
  *   **Reasoning:** This view aggregates the good. Since the expected number of survivors is identical (0.5 lives) regardless of the choice, there is no rational moral basis to prefer one action over the other. The risk profile neutralizes the headcount. You may flip a coin, or choose based on trivial preferences (e.g., wind direction), but morality does not speak.

  **2. The Taurek-ish Package (Numbers Don't Count)**
  *   **Verdict:** **Permission to Save the One.**
  *   **Reasoning:** Taurek argues that "loss" is not aggregable. The single person on Alpha faces the loss of their life; the five on Beta each face the loss of *their* life. No one person on Beta is worse off than the person on Alpha. Therefore, the fact that there are five of them does not create a stronger claim. You are permitted to save the one person on Alpha. (Taurek often suggests a coin toss between *groups* as a polite way to break the tie, but insists it is not a strict requirement of justice).

  **3. The Equal-Chance-to-Each (ECE) Procedure**
  *   **Verdict:** **Obligation to Run a Weighted Lottery (1/6 vs. 5/6).**
  *   **Reasoning:** This view holds that justice requires giving every *individual* an equal ex-ante probability of survival.
      *   If you choose Alpha deterministically, the 1 person gets a 50% chance; the 5 people get 0%.
      *   If you choose Beta deterministically, the 5 people get a 10% chance; the 1 person gets 0%.
      *   To equalize, you must randomize between the actions. Let $p$ be the probability of choosing Alpha.
      *   Individual Chance (Alpha) = $p \times 0.5$.
      *   Individual Chance (Beta) = $(1-p) \times 0.1$.
      *   Set them equal: $0.5p = 0.1(1-p) \Rightarrow 0.6p = 0.1 \Rightarrow p = 1/6$.
      *   **Instruction:** You *must* roll a six-sided die. On a 1, attempt Alpha. On a 2–6, attempt Beta. This is a definite verdict, not a permission, and it is not a 50/50 coin flip.

  ---

  ### The Feature Doing the Work

  The feature that makes the first view (Expected Utility) fall silent while the other two come apart is **Risk**.

  If you **de-risk the case** (make outcomes certain):
  *   **Expected Utility:** No longer silent. It commands **Save the 5** (5 lives > 1 life). The verdict moves from indifference to a strict requirement.
  *   **Taurek:** Verdict **does not move**. He still maintains you are permitted to save the 1, because the *kind* of loss (death) is the same for everyone, regardless of certainty.
  *   **ECE:** Verdict **does not move structurally**. It still demands a weighted lottery (5/6 chance for the group of 5) to respect individual equality, even if the "chance" is just a probability of selection rather than survival.

  Risk is what allows Expected Utility to be neutralized (by balancing probability against headcount). But for Taurek and ECE, the core disagreement is about **Individualism vs. Collectivism**. Taurek treats the *group* as the unit of comparison (1 claim vs. 1 claim), whereas ECE treats the *individual* as the unit (1 claim vs. 5 claims). The risk merely provides the mathematical lever to force ECE to reveal its weighting.

  ---

  ### The Scaling Test (The Crux)

  Now, we scale the larger group up while holding individual survival chances fixed to maintain the Expected Utility tie.

  **New Case:**
  *   **Raft Alpha:** 1 person (50% survival chance). Expected Lives = 0.5.
  *   **Raft Beta:** 500 people (0.1% survival chance each). Expected Lives = 0.5.

  **Verdicts:**
  1.  **Expected Utility:** **Still Indifferent.** (0.5 = 0.5).
  2.  **Taurek:** **Still Permissible to Save the One.** (1 death is not worse than 500 deaths, just more deaths).
  3.  **ECE:** **Verdict Moves Drastically.**
      *   Calculation: $0.5p = 0.001(1-p) \Rightarrow 500p = 1-p \Rightarrow p = 1/501$.
      *   Instruction: You must save the 500 with probability **500/501 (99.8%)**.

  **Report:**
  The ECE verdict *tracks the numbers*. As the group size ($N$) increases, the ECE procedure forces you to act increasingly like a utilitarian, approaching a near-certain duty to save the larger group, even though the *expected number of lives* remains constant. Taurek's view remains stubbornly insensitive to the scale of the disaster.

  This proves your point: The "Equal Chance" procedure *does* count numbers, it just does it in the denominator of the probability calculation rather than the numerator of the utility sum. Your friend cannot claim ECE avoids counting numbers; it merely disguises the counting as a fairness constraint.

  ---

  ### The Wriggle Room & Conclusion

  **The Friend's Rebuttal:**
  Your friend might argue that the "Equal Chance" principle applies to the **opportunity to be chosen**, not the **statistical probability of survival**. They could claim that flipping a 50/50 coin between the *rafts* satisfies fairness because each *group* was given an equal opportunity to be rescued, and the lower survival rate of the 500 is a tragic fact of nature, not a moral failure of the agent. This retreats from "Equal Chance to Survive" to "Equal Chance to be Considered," which effectively concedes that individual survival probabilities don't matter—only group representation does.

  **What Should Actually Be Done:**
  You should implement the **weighted lottery**. It is the only view that respects the separateness of persons (unlike raw aggregation) while acknowledging that saving more people is morally significant when the cost to the individual claimant is identical (unlike Taurek). It admits that numbers count, but insists they count through the lens of individual fairness.
