answer: |-
  The stalemate over qualia, exemplified by the Chase-and-Sanborn intuition pump, is best diagnosed not as a merely verbal dispute, nor as a standard substantive disagreement awaiting empirical resolution, but as a **clash of explanatory ideals regarding the criteria for ontological commitment.** The two camps are answering different questions while treating them as identical: one is asking a **phenomenological question** about the structure of appearance, while the other is asking a **metaphysical-scientific question** about the inventory of causal properties required to explain behavior.

  The impasse persists because "qualia" functions as an equivocal term bridging these two distinct domains. To expose the structural fault line, we must distinguish between **Epistemic Privilege** (the first-person authority over how things seem) and **Explanatory Integration** (the third-person requirement that properties play a causal role in a physicalist framework).

  ### The Structural Diagnosis: Cross-Purpose Ontology

  The disagreement is substantive in that it concerns what actually exists, but it is intractable because the sides operate with incompatible norms for establishing existence.

  1.  **The Proponent's Norm (Phenomenological Realism):** Existence is grounded in **givenness**. If a property is directly presented to consciousness (epistemically private), it is ontologically real, regardless of its functional utility. In the Chase-and-Sanborn case, the proponent argues that whether the taster's palate changed or the coffee's taste changed is a *fact of the matter* accessible only to the taster. The inability to distinguish the two via behavioral tests does not negate the phenomenal difference; it merely highlights the limitation of third-person access.
  2.  **The Opponent's Norm (Explanatory Naturalism):** Existence is grounded in **causal efficacy**. A property is real only if positing it improves prediction or explanation within a public framework. Dennett's "quining" argument relies on this norm: if denying the qualia distinction leaves all behavioral and neural predictions intact, the distinction is an artifact. In Chase-and-Sanborn, if the tasters' reports and physiological states are identical across the "preference change" and "taste change" scenarios, the opponent argues there is no fact of the matter to be found.

  The stalemate arises because the Proponent treats the **report** of experience as evidence of the experience itself (Epistemic Privilege), while the Opponent treats the **report** as just another behavior to be explained (Explanatory Integration).

  ### Application to Chase-and-Sanborn

  In the intuition pump, Chase and Sanborn cannot distinguish between a change in their receptors and a change in the coffee's phenomenal quality.

  *   **For the Proponent**, this indeterminacy is epistemic, not ontological. They argue that the *phenomenal character* is the primary reality. The taster's uncertainty is a failure of memory or comparison, not a proof that the experience is identical. The "what it is like" remains a valid category even if it lacks functional leverage.
  *   **For the Opponent**, this indeterminacy is constitutive. If the subjects cannot distinguish the states, and science cannot distinguish the states, then positing two different "qualia" is to posit a difference without a distinction. The "intrinsic quality" is revealed as a theoretical posit that adds no explanatory power.

  The sides talk past each other because the Proponent hears the Opponent denying the *experience* (which seems absurd to them), while the Opponent hears the Proponent positing a *spooky causal force* (which seems unscientific to them).

  ### The Precise Distinction: Phenomenal Transparency vs. Causal Tractability

  To expose the equivocation, we must separate **Phenomenal Transparency** from **Causal Tractability**.

  *   **Phenomenal Transparency:** The property is self-intimating; to have the experience is to know the property. This is the domain of the Proponent. They argue that qualia are real because they are transparent to the subject.
  *   **Causal Tractability:** The property must be trackable, measurable, or functionally definable from outside the system. This is the domain of the Opponent. They argue that qualia are incoherent because they are defined by their *exclusion* from this domain (ineffable, intrinsic, private).

  The dispute rests on the assumption that **Phenomenal Transparency implies Causal Tractability.** Proponents assume that because we know our qualia directly, they must be real properties of the world. Opponents assume that because qualia lack causal tractability (they can be quined), they cannot be real properties. The stalemate is the refusal to decouple these two criteria.

  ### Prospects for Progress

  If this diagnosis is correct, **no empirical result can resolve the dispute.**

  *   **Neural Correlates:** Discovering a neural dissociation between "taste change" reports and "preference change" reports would not help. The Proponent would claim this validates the phenomenal distinction; the Opponent would claim this simply reduces the "qualia" to functional neural states, thereby eliminating the "intrinsic, non-functional" quality the Proponent sought to defend.
  *   **Formal Results:** A proof that functional isomorphism entails phenomenal isomorphism (or vice versa) would shift the burden but not settle the ontology. The Proponent could still argue the functional map misses the "inner light."

  **Honest Assessment of Progress:**
  Progress will not come from proving one side right, but from **dissolving the demand for a single ontology.**

  1.  **Conceptual Progress:** Acknowledging that "consciousness" may be a boundary concept that resists integration into a causal framework without residue. This involves accepting **Explanatory Pluralism**: allowing that first-person phenomenology and third-person neuroscience are valid but incommensurate descriptive languages.
  2.  **Therapeutic Progress:** Recognizing that the "Hard Problem" is generated by the insistence that Phenomenal Transparency must map onto Causal Tractability. If we accept that the "what it is like" is a mode of access rather than a type of object, the need to "locate" qualia in the physical world dissolves.
  3.  **Eliminative Progress:** If the goal is a unified science of mind, the concept of qualia (as defined by the Proponent) must be eliminated or radically naturalized. If the goal is to preserve the humanistic description of experience, the scientific demand for causal tractability must be bracketed.

  The Chase-and-Sanborn stalemate is not a puzzle to be solved but a symptom of the friction between the **manifest image** (where tastes are felt qualities) and the **scientific image** (where tastes are discriminatory states). Progress consists in stopping the attempt to force one image to validate the ontology of the other.
