      *   *Leviathan Defense:* Tax competition disciplines bloated states. Moloch framing usually assumes the "cooperate" state is optimal. If the "cooperate" state is wasteful, competition is good. *Resolution:* Moloch framing holds if the competition forces cuts *below* the optimal level of public goods, not just cuts to waste.
      *   *OECD Floor (GloBE):* It uses a "top-up tax." If Ireland charges 12.5%, the US (or home country) charges the remaining 2.5%. This removes the benefit of the low rate for the *company*, but the revenue goes to the *high-tax* country, not the low-tax one. It aligns incentives. It's a structural fix to the *incentive*, not a world gov.
      *   *Subsidies/Carve-outs:* This is the "Hydra" problem. If you cap tax rates but allow subsidies, you return to subsidy competition. That *is* surplus destruction (bidding wars for factories). Same trap, new costume.
      *   *Observable Metric:* Effective Tax Rate (ETR) convergence + Stability of Public Investment / GDP. Or: Cessation of "inversion" deals and subsidy bidding wars.

