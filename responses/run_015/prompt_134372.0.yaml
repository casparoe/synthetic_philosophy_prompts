      *   *Correction on Selection:* States don't die, but governments fall. That's a selection mechanism on *political actors*, even if the state persists.
      *   *Leviathan Point:* I must acknowledge that Moloch doesn't care about *what* is being optimized, just that the optimization process is coercive and suboptimal for the participants' stated goals. If the goal is "human flourishing," and tax competition undermines the funding for that, it's Moloch. If the goal is "libertarian utopia," it's not. I will assume the standard metric of "capacity to solve collective problems."

