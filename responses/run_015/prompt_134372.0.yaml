      *   **Constraint 2 (Three Conditions):** Evaluate against:
          1.  Equilibrium worse for nearly all than feasible alternative.
          2.  Unilateral defection reliably rewarded.
          3.  Selection mechanism removes refusers (not just penalizes).
          *User Hypothesis:* Passes #2 cleanly, #1 and #3 messily.
