      *   **Move 3 (Maya):** "Pure Difference" case (Tall Poppy Syndrome/Leveling vs. Celebrating Success). One values equality/humility, one values merit/achievement. Can't be explained by shared values + facts. Values point in opposite directions.
      *   **Move 4 (Jonas):** Hidden shared values (Fairness). Americans = unfair to hold back; Others = unfair to accumulate status. Same principle, different weighting against harmony.
      *   **Move 5 (Maya):** If everything is "shared values + weights," objectivity is empty (unfalsifiable). No observation can prove a weighting wrong.
