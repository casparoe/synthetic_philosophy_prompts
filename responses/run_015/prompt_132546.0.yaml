      *   *Maya 3 (Unfalsifiability):* Clearly Right. This is a strong philosophical critique. If a theory explains everything by redefining terms, it explains nothing. This touches on the "is-ought" problem and verification.
      *   *Jonas 3 (Outcomes):* Partly Right. Consequentialism is a valid framework. But "social outcomes" are themselves value-laden (what counts as a good outcome?). It pushes the goalpost rather than solving it.

  4.  **Determine Overall Winner:**
      *   Maya has the stronger logical grip on the *limits* of Jonas's argument (the unfalsifiability point). Jonas has a better grasp on *psychological universals* (Haidt-style), but Maya correctly identifies that psychological universals don't solve normative ethics.
