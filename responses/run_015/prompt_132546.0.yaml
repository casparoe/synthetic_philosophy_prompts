      *   **Jonas's Position:** Moral Relativism/Universalism leanings (specifically a "shared values + empirical difference" model). Disagreements are superficial. Underlying values (health, fairness) are shared, but application/weighting differs. Objectivity is hard to prove via intuition but might exist in outcomes.

