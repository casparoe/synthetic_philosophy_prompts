answer: |-
  You are not holding two incompatible principles; you are sensing a distinction that standard aesthetics often blurs. Your intuition is correct that "effort" (40 hours) and "selection" (1 of 900) are not the same thing as "authorship." The framework you need is not about how hard you worked, but about **where the specific visual decisions happened.**

  Here is a single account that accommodates most of your verdicts, explains the contradictions, and gives you the language you need.

  ### The Principle: Causal Specificity

  **Definition:** Creative credit is assigned based on the ratio of **constraints applied before generation** to **preferences applied after generation.**

  *   **Clause A (The Causal Link):** You receive credit for a visual feature only if you can trace it back to a specific decision you made *before* that feature existed, which physically or logically necessitated that feature.
  *   **Clause B (The Material Agency):** You receive full credit for selection *only if* the variation you selected from was produced by inert material (light, paper, paint) or physical reality, not by a system with semantic agency (a model making meaning-based guesses).

  This principle treats creativity as a spectrum (degree), not a binary switch. It separates the *value of the object* (aesthetics) from the *credit for the making* (agency).

  ---

  ### Applying the Principle to Your Cases

  **1. The Contradiction of the 900 Rejects (Verdicts 1 vs. 3)**
  *   **Your Verdict:** Prompter (Partial) vs. Photographer (Full).
  *   **The Explanation:** Under Clause B, the source of variation matters.
      *   **Photographer:** The 900 frames vary because *reality changed* (light shifted, clouds moved). The photographer's decision (where to stand, when to click) physically constrained the light. The rejection is a judgment on *capture*: "I failed to catch the world as I intended."
      *   **Prompter:** The 900 outputs vary because the *model guessed differently*. The prompter's decision (the text) did not physically constrain the pixels; it statistically suggested them. The rejection is a judgment on *taste*: "I don't like what the machine imagined."
      *   **Result:** They do not have to come out the same. The photographer hunted reality; the prompter fished in a black box. Hunting implies tracking; fishing implies hoping.

  **2. The Contradiction of the Found Material (Verdicts 1 vs. 4)**
  *   **Your Verdict:** Prompter (Partial) vs. Collagist (Full).
  *   **The Explanation:** Under Clause B, the material's agency matters.
      *   **Collagist:** Magazine paper is inert. It does not "decide" where to tear or what image to print. The artist imposes all the form.
      *   **Prompter:** The model is an active agent. It "decides" how to interpret "sad clown." It makes semantic choices (composition, lighting, texture) that the human did not specify.
      *   **Result:** Selection from inert material is authorship; selection from an intelligent agent's output is curation.

  **3. The Fluctuating Painter (Verdict 5)**
  *   **Case:** Trained only on her own sketches, strict curation.
  *   **Application:** This is the boundary case. If the model contains *only* her past agency, it functions as a time-delayed brush. It is a distillation of her own specific constraints.
  *   **Verdict:** **High Credit (Handmade/Assisted Hybrid).** Because the "semantic agency" of the model is actually just her own past self compressed. She is collaborating with a mirror.
  *   **Principle Force:** Clause A. She can defend the output because the model's "style" is causally linked to her own past hand.

  **4. The Mass Generator (Verdict 6)**
  *   **Case:** 10,000 images, uncurated.
  *   **Application:** Zero constraints before, zero selection after.
  *   **Verdict:** **No Credit.** This overturns any notion that "running the system" is art. It fails Clause A completely.
  *   **Why it differs from Collage (V4):** Collage requires assembly (constraints before). This is merely dumping (no constraints).

  **5. The Autocomplete Poet (New Case)**
  *   **Case:** Writes lines with autocomplete on, accepts 50%.
  *   **Application:** This is structurally identical to Verdict 1 (Prompting), but often lower credit. The tool is making semantic choices (word selection) that the human merely filters.
  *   **Verdict:** **Low Credit.** The human is providing the *topic*, but the machine is providing the *form*. Unless the poet heavily edits the accepted lines (re-applying constraints), they are curating, not writing.

  **6. The Ethical Complaint (Verdict 7)**
  *   **Case:** Style mimicry/scraped data.
  *   **Application:** This belongs **beside** the judgment of creativity, not inside it.
  *   **Reasoning:** You can creatively steal (a skilled collage of copyrighted photos is still creatively achieved, legally risky) and uncreatively steal (tracing a living artist is low creativity, high theft).
  *   **Verdict:** **Separate Bucket.** Judge the *agency* for the category (Handmade vs. Assisted); judge the *data* for eligibility (Ethics/Legal). Do not conflate "bad act" with "no skill."

  ---

  ### Degree vs. All-or-Nothing

  Creative credit is a **matter of degree**.
  *   **Painter:** 100% causal specificity (every brushstroke constrained).
  *   **Photographer:** 90% causal specificity (light is wild, but capture is constrained).
  *   **Collagist:** 85% causal specificity (images found, arrangement constrained).
  *   **Personal Model Painter (V5):** 70% causal specificity (form generated, but style constrained by self).
  *   **Skilled Prompter (V1):** 30% causal specificity (intent constrained, form generated).
  *   **One-Shot Prompter (V2):** 5% causal specificity (topic constrained, form and selection random).

  Your friend who says "creativity is a property of the object" is wrong because it ignores the *locus of agency*. Your friend who says "only labeling matters" is wrong because it ignores the *value of human constraint*. Your intuition that credit tracks "predictability and defense" is the correct one, formalized here as Causal Specificity.

  **Which verdicts does this overturn?**
  It challenges **Verdict 2** slightly. Even the "one-sentence" prompter exercised *some* constraint (the choice of subject). Under this principle, they deserve *minimal* credit, not "no creative achievement at all," though for a gallery category, "minimal" may still mean "rejected." It firmly supports your lean on **Verdict 6** (No).

  ---

  ### The Two Sentences for Rejected Entrants

  You asked for honesty without evasion. Use this script for the "Assisted" or "Rejected" pile when they ask why:

  > "We distinguish between works where the artist determines the specific form before it exists, and works where the artist selects a form after a system has generated it. Your piece demonstrates strong curatorial taste, but the specific visual details were determined by the system's processing rather than your direct constraints."

  **Why this works:**
  1.  It validates their taste (the image might be beautiful).
  2.  It cites the *process* (constraints vs. selection) rather than the *tool* (AI is not banned, but the *mode of use* is).
  3.  It is defensible. If they argue "I spent 40 hours," you can reply: "Time spent filtering does not equal control over generation."

  ### Summary for the Jury Room

  When you argue with your friends, use this shorthand:
  1.  **Did the human constrain the cause, or just filter the effect?** (Photography = Constrain Cause; AI = Filter Effect).
  2.  **Is the material inert or agentic?** (Paper = Inert; Model = Agentic).
  3.  **Is the ethical complaint about theft or about skill?** (Keep them separate).

  This account respects your gut without requiring you to read philosophy. It acknowledges that AI images can be *good* (value) without the user being the *author* (credit).
