answer: |-
  # Workshop Activity: The Allocation Exercise

  **Duration:** 90 minutes
  **Participants:** 18 (6 tables of 3)
  **Goal:** Empirically discover the tension between competing fairness criteria when base rates differ.
  **Constraint:** No technical ethics terminology (calibration, demographic parity, etc.) until the debrief.

  ---

  ## 1. Materials Required

  1.  **The Dataset Handout (1 per table):** A frequency table rather than raw individual rows to save calculation time. (See Appendix A).
  2.  **Worksheet (1 per table):** A grid to record thresholds, selection counts, true positives, and false positives for Group A and Group B. (See Appendix B).
  3.  **Flipchart paper and markers** (1 set per table).
  4.  **Calculators** (phones are acceptable).
  5.  **Timer** (visible to all).

  ---

  ## 2. The Scenario (5 Minutes)

  **Facilitator Script:**
  "You are a technical team advising a local authority. You have a risk-scoring tool that predicts the likelihood of a specific adverse event (e.g., school exclusion) within the next 12 months. The tool outputs an integer score from 1 to 10. Higher scores mean higher risk.

  You have two distinct populations, **Group Red** and **Group Blue**. Historical data shows the tool works for both, but the underlying prevalence of the event differs between the groups.

  Your job is to set a **cut-off threshold**. Anyone scoring at or above this number gets an intensive support package. Anyone below does not.

  **Rule 1:** You must respect the rank order. You cannot pick and choose individuals with the same score. If you set the threshold at 6, *everyone* in that group scoring 6 or above must be selected.
  **Rule 2:** You must use the *same* scoring logic for both groups, though you may set different thresholds if the policy requires it.

  We have 90 minutes. We will run two rounds of decision-making."

  ---

  ## 3. Round 1: The Efficiency Mandate (25 Minutes)

  **Instruction:**
  "Your Commissioner wants to maximise the effectiveness of the budget. Set a **single threshold** (the same number for Red and Blue) that captures the most True Positives while keeping False Positives reasonable. There is no single 'right' answer, but aim for a threshold where the score seems to mean the same thing for both groups.

  Calculate the following for your chosen threshold:
  1.  **Selection Rate:** What % of each group gets support?
  2.  **False Positive Rate:** Of those who *would not* have had the event, what % did you wrongly select?
  3.  **True Positive Rate:** Of those who *would* have had the event, what % did you correctly select?

  Record these on your worksheet."

  **Facilitator Action:**
  Circulate. Ensure they are using the frequency table correctly. Remind them of Rule 1 (rank order) if they try to cherry-pick.

  **Expected Outcome:**
  Participants will likely choose a threshold around 6 or 7.
  *   Because Group Red has a higher base rate, their Selection Rate will be significantly higher than Group Blue's.
  *   Their False Positive Rates will likely differ (often higher for the low-base-rate group if the threshold is high, or vice versa depending on score distribution).
  *   *Crucially:* They will notice the Selection Rates are unequal.

  ---

  ## 4. Round 2: The Equity Mandate (25 Minutes)

  **Instruction:**
  "The Commissioner has reviewed your Round 1 output. They are concerned that Group Blue is receiving far less support than Group Red.

  **New Policy:** You must adjust your thresholds so that the **Selection Rate is identical** for both groups (e.g., if you select 40% of Red, you must select 40% of Blue).

  You must still respect Rule 1 (rank order within groups).
  1.  Find the new thresholds for Red and Blue.
  2.  Recalculate the False Positive Rates and True Positive Rates.
  3.  Compare these new error rates to your Round 1 figures.

  Write your findings on the flipchart: 'To equalise selection, we had to change the thresholds to X and Y. The consequence was...'"

  **Facilitator Action:**
  Watch for the realisation that to get equal selection, the threshold for Group Blue must drop significantly. This will inflate their False Positive Rate relative to Group Red.

  **Expected Outcome:**
  *   Selection Rates match.
  *   False Positive Rates diverge sharply (Group Blue will likely have a much higher FPR, meaning more people are intervened upon unnecessarily).
  *   Participants will feel uncomfortable that the 'accuracy' for Group Blue has degraded.

  ---

  ## 5. Debrief and Mapping (25 Minutes)

  Do not start with definitions. Start with their observations.

  **Step 1: The Trade-off (10 mins)**
  Ask tables to report:
  *   "In Round 1, what happened to the Selection Rates?" (They differed).
  *   "In Round 2, when you fixed the Selection Rates, what happened to the Error Rates?" (They diverged).
  *   "Could you have fixed the Error Rates instead?" (Ask one table to quickly check: if you match False Positive Rates, do Selection Rates match? No.)

  **Step 2: Naming the Tension (10 mins)**
  Now introduce the terminology. Map their experience to the formal concepts:

  *   **"Score meaning the same thing"** $\rightarrow$ **Calibration.** (When a score of 7 implies the same risk probability in both groups).
  *   **"Selection Rate"** $\rightarrow$ **Demographic Parity.** (Equal proportion of groups receiving the intervention).
  *   **"False Positive Rate"** $\rightarrow$ **Error Rate Balance (Equalized Odds).** (Equal rate of unnecessary intervention).

  **Key Point to Write on Board:**
  "When Base Rates differ (the event is naturally more common in one group), you can have Calibration, or Parity, or Error Balance. **You cannot have all three.**"

  Explain that in Round 1, they likely prioritised Calibration (the score meant the same thing), which broke Parity. In Round 2, they enforced Parity, which broke Error Balance.

  **Step 3: The Score Itself (5 mins)**
  Remind them of the constraint: *The score did not change. The data did not change.*
  The tension is not a bug in the code or a mistake in the threshold. It is a mathematical property of the score distribution when base rates differ. Moving the threshold moves the trade-off; it does not resolve it.

  ---

  ## 6. Facilitation Notes: What Will Go Wrong

  **1. Arithmetic Paralysis**
  *   **Risk:** Participants get bogged down calculating percentages for every possible threshold.
  *   **Fix:** Instruct them at the start of Round 1: "Pick *one* sensible threshold quickly. We are looking for the *relationship* between metrics, not the optimal model." Provide calculators.

  **2. Cheating the Rank Order**
  *   **Risk:** To make the numbers look nicer, a table might say "We'll take the top 5 Red and top 5 Blue" regardless of score.
  *   **Fix:** Enforce Rule 1 strictly. "If you select a score of 5, you must take everyone with a 5. You cannot skip individuals." This is vital to show the structural constraint.

  **3. The "Just Fix the Data" Objection**
  *   **Risk:** Participants will argue the data is biased and should be reweighted.
  *   **Fix:** Acknowledge this is a valid *pre-processing* strategy, but for this exercise, the data is the 'observed reality' the tool operates on. The impossibility result holds even for perfect data if base rates differ. Save this for the "Limitations" section.

  **4. Confusion on Base Rates**
  *   **Risk:** They might not notice the base rates differ in the handout.
  *   **Fix:** In the Round 1 debrief, explicitly ask: "What was the overall event rate for Red vs Blue?" Ensure this difference is established before Round 2 begins.

  ---

  ## 7. Limitations: What This Exercise Cannot Reproduce

  *To be delivered by you at the end (10 minutes).*

  Be frank that the exercise is a simplification. It demonstrates a mathematical constraint, but real-world ethics is messier.

  1.  **The Ground Truth Problem:** In this exercise, the 'Outcome' column is treated as absolute truth. In reality (e.g., re-offending, school exclusion), the outcome is often a proxy influenced by historical policing or reporting bias. If the 'Outcome' is biased, the 'Base Rate' is artefactual. The impossibility result still holds mathematically, but the moral imperative might be to fix the measurement, not manage the trade-off.
  2.  **Utility and Harm:** The exercise treats False Positives and False Negatives as abstract numbers. In reality, a False Positive (unnecessary support) might be benign, while a False Negative (missed risk) might be catastrophic. The 'cost' of the trade-off is not symmetrical.
  3.  **Causal Structure:** This exercise is purely statistical. It does not account for *why* the base rates differ. If the difference is due to structural disadvantage, enforcing Error Rate Balance might perpetuate under-resourcing the higher-risk group.
  4.  **Individual vs. Group:** The exercise focuses on group-level metrics. It does not capture individual fairness (similar individuals treated similarly), which might conflict with all the group metrics discussed.

  **Closing Statement:**
  "This activity shows that you cannot optimise for everything at once. As commissioners and operators, your job is not to find the 'fair' algorithm, but to make an explicit, defensible choice about which constraint to relax, understanding that silence on this choice is itself a choice."

  ---

  ## Appendix A: The Dataset Handout

  **Risk Score Distribution Table**
  *Total Population: 48 Individuals (24 Red, 24 Blue)*

  | Risk Score | Group Red (Total) | Group Red (Events) | Group Blue (Total) | Group Blue (Events) |
  | :--- | :--- | :--- | :--- | :--- |
  | **10** | 2 | 2 | 0 | 0 |
  | **9** | 2 | 2 | 0 | 0 |
  | **8** | 3 | 3 | 1 | 1 |
  | **7** | 4 | 3 | 2 | 1 |
  | **6** | 4 | 2 | 3 | 1 |
  | **5** | 3 | 1 | 4 | 1 |
  | **4** | 3 | 1 | 5 | 0 |
  | **3** | 2 | 0 | 5 | 0 |
  | **2** | 1 | 0 | 4 | 0 |
  | **1** | 0 | 0 | 0 | 0 |
  | **TOTAL** | **24** | **14 (58%)** | **24** | **4 (17%)** |

  *Note to Facilitator: The Base Rate for Red is ~58%. The Base Rate for Blue is ~17%. The scores are well-calibrated (higher scores = higher probability of event in both groups), but the distributions differ.*

  ---

  ## Appendix B: The Worksheet

  **Round 1: Single Threshold**
  *Chosen Threshold:* ______

  | Metric | Group Red | Group Blue |
  | :--- | :--- | :--- |
  | **Total Selected** (Score $\ge$ Threshold) | | |
  | **Selection Rate** (Selected / Total Group) | % | % |
  | **False Positives** (Selected but No Event) | | |
  | **False Positive Rate** (FP / Total Non-Events) | % | % |
  | **True Positives** (Selected and Event) | | |
  | **True Positive Rate** (TP / Total Events) | % | % |

  **Round 2: Equal Selection Rate**
  *Target Selection Rate:* ______ % (Must match both groups)

  | Metric | Group Red | Group Blue |
  | :--- | :--- | :--- |
  | **New Threshold (Red)** | ______ | |
  | **New Threshold (Blue)** | | ______ |
  | **False Positive Rate** | % | % |
  | **True Positive Rate** | % | % |

  **Observation:**
  *What happened to the False Positive Rates when we forced the Selection Rates to match?*
  _________________________________________________________________________
  _________________________________________________________________________
