          *   If I force them to pick a threshold (e.g., Score > 6), Red gets selected more. If I force equal selection, thresholds differ. If I force equal FPR, thresholds differ.
      *   *Refinement:* To make the "Impossibility" pop, I need to give them specific *targets* that conflict.
      *   *Round 1:* "Efficiency." Pick a threshold. Report TPR and FPR for each group.
      *   *Round 2:* "Equity." Try to match the selection rates OR match the error rates.
      *   *Constraint:* Must use the *same* score threshold for everyone (initially) to show the disparity, then allow different thresholds to show the calibration break? No, the prompt says "same score is redeployed... at a different threshold".
      *   *Correction:* The prompt asks to show the trade-off attaches to the *score itself*.
      *   *Revised Plan:*
          *   Round 1: Set a threshold to maximise overall accuracy. Observe group disparities.
          *   Round 2: Try to fix the disparity (either by selection rate or error rate). Observe how calibration breaks or the other metric suffers.
          *   Actually, the prompt says: "their rule has to rank people in score order... in a second round the same score is redeployed for a different decision... so that it becomes visible that the trade-off attaches to the score itself".
          *   Okay, let's make Round 1 about "Calibration" (implicitly) and Round 2 about "Parity".
          *   Better approach for discovery: Give them three competing policy mandates. Ask them to satisfy Mandate 1. Then Mandate 2. Then try to do both.
          *   Let's simplify.
          *   **Round 1:** "The Efficiency Mandate." Choose a single cut-off score. Maximise the number of true positives captured. Record the selection rate and false positive rate for Red vs Blue.
          *   **Round 2:** "The Fairness Mandate." You must select the same *number* of people from Red and Blue (Demographic Parity). You must still rank by score within groups. Record the resulting False Positive Rates.
          *   **Round 3:** "The Error Balance Mandate." You must make the False Positive Rate equal across groups. Record the Selection Rates.
          *   *Wait, 90 mins is tight for 3 rounds.* Let's stick to 2 rounds + Debrief.
          *   **Round 1:** Single Threshold. Observe the imbalance.
          *   **Round 2:** Fix the imbalance (choose your method: equal selection OR equal error). Observe the cost.
          *   *Constraint Check:* "Rule has to rank people in score order." Yes, they pick a cutoff.
          *   *Constraint Check:* "Second round... different decision... different threshold."
          *   Okay, let's frame Round 2 as a Policy Change. "The Commissioner wants equal support rates."

  5.  **Developing the Data (Mental Check):**
      *   Need Base Rate Difference.
      *   Group A (Red): 20 people. 10 Positive (50%). Scores generally higher.
      *   Group B (Blue): 20 people. 4 Positive (20%). Scores generally lower.
      *   If Threshold = 6:
          *   Red: Select 12 (8 TP, 4 FP). TPR=80%, FPR=4/10=40%. Sel Rate=60%.
          *   Blue: Select 4 (3 TP, 1 FP). TPR=75%, FPR=1/16=6%. Sel Rate=20%.
      *   Disparity is visible.
      *   If we force Equal Selection (60% for Blue): Threshold must drop to ~3.
          *   Blue: Select 12. (4 TP, 8 FP). FPR jumps to 50%.
      *   If we force Equal FPR (40% for Blue): Threshold drops.
          *   Blue FPR 40% means 6.4 FPs. Roughly 6 FPs.
      *   This works. I will create a specific dataset for the handout.

  6.  **Structuring the Session:**
      *   00-10: Intro & Groups.
      *   10-30: Round 1 (The "Neutral" Rule).
      *   30-50: Round 2 (The "Equity" Constraint).
      *   50-75: Debrief & Mapping.
      *   75-90: Limitations & Closing.

  7.  **Addressing Specific Prompt Requirements:**
      *   *British English:* (Programme, Centre, Analyse, etc.)
      *   *No terms up front:* Do not say "Calibration", "Demographic Parity", "Equalized Odds". Use "Accuracy", "Equal Support", "Equal Mistake Rates".
      *   *What will go wrong:* People will cheat the ranking, people will get bogged down in arithmetic, people will argue about the "right" answer.
      *   *What it can't reproduce:* Structural bias, measurement error, the fact that $Y$ is a proxy.

  8.  **Refining the Activity Flow:**
      *   To ensure they "run into" the impossibility, I need to give them conflicting instructions in Round 2.
      *   Actually, better: Split the room. Half try to fix Selection Rates. Half try to fix Error Rates. Then compare.
      *   No, keep it unified. Everyone tries to fix Selection Rates first. Then ask "What happened to the Error Rates?". Then ask "Could we have fixed Error Rates instead? What happens to Selection?"
      *   Let's go with:
          *   Round 1: One threshold for all. (Reveals Base Rate impact).
          *   Round 2: Policy Change. Must achieve Equal Selection Rates. (Reveals Error Rate divergence).
          *   Discussion: Could we fix Error Rates instead? (Reveals Selection Rate divergence).
      *   Wait, the prompt asks for "Second round the same score is redeployed for a different decision... so that it becomes visible that the trade-off attaches to the score itself".
      *   Okay, I will design Round 2 to force a specific constraint that breaks the Round 1 metric.

  9.  **Drafting the Content:**
      *   *Title:* The Allocation Exercise.
      *   *Materials:* Printed cards or sheets.
      *   *Data:* I need to generate a concrete table for the prompt response so the user can copy-paste it.
      *   *Facilitation:* Strict timekeeping.
      *   *Debrief:* Connect "Selection Rate" to Demographic Parity, "Error Rate" to Equalized Odds, "Score meaning" to Calibration.
      *   *Limitations:* The "Ground Truth" problem.

  10. **Review against Constraints:**
      *   90 mins? Yes.
      *   18 people? Yes (6 groups of 3).
      *   No ethics jargon initially? Yes.
      *   Rank order constraint? Yes.
      *   Round 2 shift? Yes.
      *   British English? Yes.
      *   "What goes wrong"? Included.
      *   "What this can't reproduce"? Included.

  11. **Final Polish:**
      *   Ensure the tone is professional yet facilitative.
      *   Make sure the data provided actually works mathematically to show the tension. (I will construct a simplified frequency table rather than 40 rows to save calculation time, or provide the rows but keep N small. Let's provide 24 cases total, 12 per group. Easy to count.)
      *   *Data Construction:*
          *   Group A (12 people): 6 Events. Scores: 9,9,8,8,7,7 (Events); 5,5,4,4,3,3 (Non-events).
          *   Group B (12 people): 2 Events. Scores: 8,7 (Events); 6,5,4,3,2,2,1,1,1,1 (Non-events).
          *   Wait, need overlapping scores to make it tricky.
          *   Let's create a specific Handout Appendix.
      *   *Self-Correction on Data:* If I give individual rows, calculation takes too long. Better to give a *Score Distribution Table* (Frequency of Outcomes per Score per Group). This allows quick calculation of metrics at different thresholds.
      *   *Revised Data Format:* A table showing: Score | Group A (Total, Events) | Group B (Total, Events).
      *   This respects the "rank order" constraint (they pick a score cutoff) but saves 20 mins of arithmetic.

  12. **Final check on "Impossibility":**
      *   If Base Rates differ, and Scores are well-calibrated (Predictive), you can't have Parity + Error Balance.
      *   My data must reflect differing base rates.
      *   Group A Base Rate: 50%. Group B Base Rate: 20%.
      *   If they pick Threshold T:
          *   Calibration holds (roughly) if Score predicts probability.
          *   Selection Rates will differ (A > B).
          *   If they force Selection Rates equal (lower T for B), FPR for B skyrockets compared to A.
          *   If they force FPR equal (lower T for B), Selection Rate for B > A.
      *   This is the core tension.

  13. **Writing the Response:**
      *   Structure: Overview, Materials, The Data, The Activity (Round 1 & 2), Debrief, Facilitation Notes (What goes wrong), Limitations.
      *   Tone: Professional, instructional.
      *   Language: British English.

  (Self-Correction during drafting): Make sure I explicitly mention the "Rank Order" rule in the instructions. "You must select everyone above a certain score."
