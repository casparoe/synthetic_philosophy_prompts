answer: |-
  Sunday I open the app. The map is a blue vein pulsing between two cities. I select the date. The slider for cancellation penalty sits at zero. It feels like leaving a door open to a draft. I drag it to twenty pounds. It feels like locking it. I book the 9:04. I picture his room, the light on the north wall, the way the dust hangs in it. I imagine walking through the door, the sound of my coat hitting the chair. I feel the shape of the day next week. It is solid. I am the kind of person who books the ticket. I am the kind of person who follows through. The confirmation email arrives. I read it twice. I feel the virtue of the purchase settle in my chest, a warm weight.

  Saturday you wake at seven. The rain is against the glass. The train is too loud in your head before you even stand up. The phone buzzes with the reminder. You look at the bag. It is empty. You sit on the edge of the bed. The floor is cold. You open the app. The penalty flashes red. You cancel. The twenty pounds is gone. The room is quiet again.

  Sunday I know what happened. I was weak. The twenty pounds was noise. I need signal. I move the slider to fifty. I write a note in the calendar: *Do not cancel.* I pack the bag tonight and leave it by the coat rack. I tell myself the money matters now. Fifty pounds is a dinner. It is a threshold. I visualize the moment of hesitation. I imagine stepping over it. I am building a bridge of cash so I cannot turn back. I am securing the future self against the present weakness. I buy the ticket. I feel the virtue of the purchase settle in my chest, heavier this time. I have accounted for the flaw. I have priced the failure. I am safe.

  Saturday you wake. The bag is by the door. It looks like an accusation. The bed is warm. The rain is harder. Fifty pounds is pain, but the journey is nausea. The station is cold. The hospital is bright. You cancel.

  Sunday I need to make it impossible. I set the penalty to two hundred. That is real money. That is rent. The chat log from the service is still open on my screen; the agent typed, *Sometimes the buying is the doing,* before the connection dropped. I ignored her. I am buying the certainty. I am buying the sister I should be. I trace the route on the map again. I calculate the hours. I tell myself that when Saturday comes, the pain of losing this money will be sharper than the pain of the train. I am forcing my hand. I am tying myself to the mast. I complete the transaction. The confirmation email arrives. I read it twice. I feel the weight of it. I have done the work. The plan is perfect. The logic is ironclad. I have removed the option to fail. I sit back. The guilt is gone. I have paid for the love. I have paid for the visit. I am ready.

  Saturday you don't wake; you surface.

  I know you will stay. You know I meant it. The money is spent either way. The love is in the booking. I watch you watch the screen. You press cancel. I feel the relief. We agree on this. The ticket was the visit. You are here, and I am there, and the money is gone, and nothing changes. I buy the ticket. You cancel it. We are perfect.

  ***

  This story secretly bets on the preference reversal view. I wrote the Saturday sections to feel like a different person entirely because, in the moment, the discomfort of the trip genuinely outweighs the abstract value of the plan. The conflict isn't internal struggle; it's a shift in valuation. I fudged the psychology by making Sunday Maren too confident; in reality, the doubt usually creeps in earlier. To rewrite it supporting the "acting against judgment" view, I would need Saturday Maren to feel active regret *while* cancelling—to say "I know I should go" and stay anyway. Here, she just stays. The gap isn't a battle; it's a handoff.
