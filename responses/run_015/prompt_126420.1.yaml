answer: |-
  **TO:** Advisory Committee on Student-Facing Algorithms
  **FROM:** Undergraduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Fenwick Analytics Lark License

  **Bottom Line Recommendation**
  I recommend that the committee vote to license the Lark student-success assistant, contingent on Fenwick Analytics satisfying a specific robustness condition within one semester. We should not grant full operational reliance on the risk scores until Fenwick demonstrates that their identified "distress feature" recovers across distinct model architectures. If they fail this test, the license should revert to a behavioral audit standard only, stripping the internal evidence of any regulatory weight.

  **Context and Technical Definitions**
  The central dispute concerns Fenwick's safety case. They rely not on outcome data, but on internal evidence derived from an interpretability pipeline. To evaluate this, we must agree on what their technical claims entail. When Fenwick speaks of a **feature**, they refer to a specific pattern of information the model uses to process text, analogous to a concept in a human mind. They claim to have isolated a **direction** in the model's activation space. Imagine the model's internal math as a multi-dimensional map; a direction is a specific vector or pathway on that map. Fenwick argues this specific pathway tracks acute student distress.

  Their confidence rests on **clamping**. This is an intervention where researchers artificially force that direction to be active or inactive. Fenwick shows that when they clamp the distress direction to "off," the model stops routing students to advisors, even if the text remains the same. To proponents, this proves the direction is causally responsible for the routing. To skeptics, this is merely a redescription of behavior we already measured, offering no guarantee against new kinds of inputs.

  **The Question of Representation**
  Before adopting the compromise criterion, we must clarify what we are committing to regarding the nature of these internal states. The committee is asked to decide whether to treat this direction as a genuine representation of distress. My position is that the licensing decision does not require settling whether these states are representations in the philosophical or cognitive sense. We do not need to agree that the model "understands" distress or that the activation direction is ontologically equivalent to a human mental state.

  Instead, we are committing to a functional claim: that this internal state is a stable control point. Whether it is a "real" representation matters less than whether it is a reliable handle. If manipulating the direction consistently changes the output across different contexts, it functions as a representation for our purposes, regardless of its metaphysical status. We can leave the question of genuine mental representation open while still relying on the feature's operational stability. This allows the committee to bypass intractable debates about machine consciousness and focus on safety engineering.

  **The Compromise Criterion and the Skeptic's Challenge**
  The proposed compromise requires Fenwick to recover the same interpreted feature in a second model that matches Lark's behavior on our audit set but differs in initialization, architecture, and data ordering. If the pipeline finds the direction in both, and it survives interventions in both, we treat the feature as real enough to lean on.

  The strongest objection to this compromise comes from the skeptical faction of the committee. Their worry is not merely that the feature might be spurious in one model, but that robustness across models does not eliminate the risk of unknown unknowns. They argue that even if two different architectures converge on the same internal direction, they may still be converging on a shared bias inherent in the training data rather than a genuine signal of distress. For example, if both models learn that certain linguistic markers correlate with distress in our specific student population, they will both isolate the same direction. However, when faced with a novel expression of distress from a cultural or linguistic background absent in the training data, both models could fail simultaneously. The internal evidence would remain stable while the external validity collapses. In this view, finding the same feature in two models is like finding the same error in two copies of the same map; it confirms the error, not the terrain.

  This is a serious concern. If the feature is a robust artifact of biased data rather than a robust detector of reality, our reliance on it could systematize harm. However, answering this worry does not require us to decline the license. It requires us to acknowledge that the cross-model test increases confidence but does not guarantee truth. The test moves us from trusting a single accident of training to trusting a convergent solution. While shared bias is possible, it is less likely than idiosyncratic bias. Furthermore, the condition I propose includes a deadline and a reversion clause. If Fenwick passes the test, we license the tool, but we must maintain human oversight on high-risk routings. This human-in-the-loop safeguard addresses the residual risk of unknown unknowns that the internal evidence cannot rule out. We are not betting the students' safety entirely on the feature's reality; we are using the feature to prioritize human attention. If the feature fails on novel inputs, the human advisor serves as the fallback.

  **Conclusion and Conditions**
  The compromise criterion raises the bar on empirical evidence without demanding the impossible. It shifts the burden of proof to the vendor to demonstrate that their interpretability claims are not mere post-hoc descriptions. Therefore, I propose we license Lark under the following conditions:

  1.  **Cross-Model Validation:** Fenwick must demonstrate the recovery of the distress direction in a structurally distinct model within 120 days.
  2.  **Intervention Stability:** The clamping intervention must produce consistent output changes in both models.
  3.  **Human Oversight:** Until these conditions are met, and thereafter for any student flagged as high-risk, routing decisions must be verified by a human advisor before contact is made.
  4.  **Reversion:** If Fenwick fails to demonstrate cross-model recovery, the license continues only on the basis of behavioral audit data, and Fenwick may not market the internal evidence as a safety guarantee to the university.

  This path allows us to utilize the potential safety benefits of interpretability research without accepting the vendor's claims uncritically. It respects the skeptics' demand for rigorous evidence while acknowledging the proponents' argument that internal states offer a window into model logic that behavior alone cannot provide. We proceed not by settling the nature of machine representation, but by demanding that whatever representation exists proves its stability under pressure.
