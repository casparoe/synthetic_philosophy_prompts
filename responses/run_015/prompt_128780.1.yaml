answer: |-
  You haven't botched it; you've run into the single most common misunderstanding of perdurantism. Your roommate's argument feels powerful because it exploits a visual metaphor (the "stack of slices") that is actually misleading.

  Here is the conceptual fix. There are two specific slips in her reasoning, and one positive move perdurantism makes that she is missing.

  ### Slip 1: Confusing the "Worm" with the "Stage"
  Your roommate is describing **Stage Theory**, not standard Perdurantism (often called **Worm Theory**).

  *   **Stage Theory** says: You are only the temporal slice existing right now. The "you" at twenty is a different entity entirely.
  *   **Perdurantism (Worm Theory)** says: You are the **entire spacetime worm**. You are not the slice; you are the whole extended object.

  When she says, "me-at-twenty and me-now are basically different people," she is assuming the *slice* is the person. The perdurantist says the slice is merely a *part* of the person, just like your left hand is a part of you.

  **The Fix:** If you cut a loaf of bread, the slices are distinct parts, but they don't become distinct *loaves*. They are parts of one unified object extended in space. Perdurantism just says you are extended in time the same way a loaf is extended in space. "You-at-20" and "You-now" are no more "different people" than "Your-Head" and "Your-Toes" are "different people." They are distinct *parts*, but they constitute one *whole*.

  ### Slip 2: The "Collection vs. Object" Fallacy
  Her second slip is the claim that if the parts are equally real, the whole is just a "conventional grouping." This assumes that a whole object is less real than its parts, or that composition is arbitrary.

  If this were true, *nothing* macroscopic would exist. A table is just a collection of atoms. A body is just a collection of cells. If "all parts are real" meant "the whole is just a name," then tables, bodies, and roads wouldn't exist either.

  **The Fix:** Perdurantists rely on **mereology** (the logic of parts and wholes). The reality of the parts *grounds* the reality of the whole, it doesn't cancel it. The "unity" of the person isn't a magical glue added on top of the parts; the unity *is* the specific arrangement and connection of those parts. Calling the worm "one person" isn't a convention any more than calling a connected chain "one chain."

  ### The Binding Relation: It's Not Just Causation
  You asked what perdurantists offer as the binding relation. Your roommate dismisses it as mere "causation," implying a loose link between separate things. But perdurantists argue for **Immanent Causality** or **Continuity**.

  *   **External Causation:** One billiard ball hits another. They remain two distinct objects.
  *   **Immanent Causality:** One state of an object brings about the next state of *the same* object.

  The binding relation isn't just "A caused B." It is that the physical and psychological states at $t_1$ flow continuously into $t_2$ without interruption. This continuity creates **Gen-Identity**.

  Think of a river. The water molecules at the source are different from the water molecules at the mouth. But it is one river. Why? Because there is a continuous flow connecting them. Perdurantism says you are the river, not the water molecules. The "binding relation" is the continuous flow of consciousness and biology that makes the temporal parts segments of a single process.

  ### Why This Is a Solution, Not a Surrender
  You asked why this isn't just dissolving identity into a convention.

  Endurantism (the view that you are wholly present at every moment) runs into a logical contradiction regarding **change**.
  *   If I am wholly present at age 20, I have Property X (e.g., "believing in Santa").
  *   If I am wholly present now, I have Property Not-X (e.g., "not believing in Santa").
  *   If I am strictly the *same* whole object in both moments, I have contradictory properties.

  Endurantists have to do complex gymnastics to explain how one thing can have contradictory properties (e.g., "relational properties").

  Perdurantism dissolves the contradiction cleanly:
  *   The *worm* has a part at $t_1$ that believes in Santa.
  *   The *worm* has a part at $t_2$ that does not.
  *   The *worm* itself doesn't have contradictory properties; it just has different parts with different properties.

  **The Conceptual Payoff:** Perdurantism doesn't surrender identity; it **spatializes time**. It treats time as a dimension of existence rather than a test of endurance. It stops asking "How can I stay the same while changing?" and answers "I don't stay the same; I am extended across the change."

  ### Summary for Your Argument
  1.  **Correct her definition:** Perdurantism says I am the *whole worm*, not the *slice*. (This blocks the "different people" claim).
  2.  **Challenge the mereology:** If parts being real makes the whole conventional, then tables and bodies don't exist either. (This blocks the "just a collection" claim).
  3.  **Clarify the binding:** It's continuous flow (immanent causation), not one thing causing another. (This blocks the "loose connection" claim).

  She is treating temporal parts like separate beads on a string. Perdurantism says they are segments of a single cable. The cable is real, the segments are real, and they are one thing.
