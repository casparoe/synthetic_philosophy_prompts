  Here is a ranking based on **expected moral priority per unit of attention** (which weights raw scale by tractability and counterfactual impact), followed by the analysis of your adjustments.

  ### **Taxon Ranking: Expected Moral Priority per Unit of Attention**

  | Rank | Taxon | Score (0-100) | Tier | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Farmed insects** (crickets, mealworms, BSF) | 95 | S | Direct human control makes welfare interventions highly tractable and counterfactually robust compared to wild populations. |
  | 2 | **Managed honey bees and bumblebees** | 80 | A | Existing human management infrastructure allows for welfare leverage, though economic priorities often override welfare. |
  | 3 | **Flies and mosquitoes** | 65 | B | High research traction on sentience and nuisance control offers potential overlap for welfare-focused population management. |
  | 4 | **Parasitoid wasps** | 50 | C | Extreme suffering intensity per individual is offset by near-zero tractability and high risk of ecological backlash. |
  | 5 | **Ants** | 45 | C | Enormous scale is heavily discounted by low tractability and high probability of density-dependent replacement. |
  | 6 | **Termites** | 40 | C | Comparable biomass to ants but even less accessible to study or intervention outside of pest control contexts. |
  | 7 | **Beetles** | 30 | D | Hyper-diverse taxonomy makes generalized interventions impossible; welfare status is highly heterogeneous. |
  | 8 | **Aphids, whiteflies, leafhoppers** | 25 | D | Boom-bust dynamics and extremely short lifespans make counterfactual welfare calculations nearly impossible. |
  | 9 | **Moths and butterflies** | 20 | D | Lower population densities and shorter adult welfare-relevant windows reduce priority relative to other insects. |
  | 10 | **Soil springtails and oribatid mites** | 10 | F | Absurd numbers are negated by near-total epistemic black boxes regarding sentience and zero intervention pathways. |

  ***

  ### **Analysis of Adjustments ("Haircuts")**

  **The Two to Delete:**
  1.  **The Log-odds Haircut:** This is a heuristic for human risk aversion, not a feature of moral reality; arbitrarily halving value based on probability thresholds biases the model against the very uncertainty it claims to measure.
  2.  **The Independent-origins Move:** While useful for arguing that *some* invertebrates are sentient, it boosts all invertebrate groups roughly equally and therefore provides no signal for *ranking* one taxon against another.

  **The Single Driver of the Ranking:**
  *   **The Replacement Haircut:** This adjustment creates the largest divergence in scores by distinguishing between **farmed/managed** populations (where deaths are often demand-driven and not immediately replaced) and **wild** populations (where density dependence often nullifies the counterfactual benefit of preventing death). Without this, the raw scale of ants and springtails would mathematically overwhelm every other consideration, rendering "per unit of attention" meaningless.

  **Confidence Level:**
  *   **0.15 (Very Low)**
      *   *Reasoning:* The field relies on extrapolating from vertebrate neuroscience to radically different nervous systems, combined with ecological dynamics we barely understand; the margin of error on any of these inputs is likely orders of magnitude.

  **The "Dreaded Cell":**
  *   **P(Sentience) for Soil Springtails and Oribatid Mites:** We have almost no behavioral or neurological data for these groups, yet they represent the largest numerical bulk of the spreadsheet; assigning them a probability anywhere between 0.001% and 10% changes the total expected value of the entire fund by factors of thousands.
