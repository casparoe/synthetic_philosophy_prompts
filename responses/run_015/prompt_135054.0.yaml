answer: |-
  There is no single canonical term in welfare philosophy or public administration that perfectly captures the specific *epistemic circularity* you are describing. There are adjacent concepts, but they each miss a crucial facet of the loop you've identified.

  Here is the landscape of near-misses, followed by a proposed coinage that carves out the specific mechanism you're describing.

  ### 1. The Adjacent Concepts (and why they fall short)

  *   **Administrative Burden / Sludge:** (Herd & Moynihan, Sunstein)
      *   *What it captures:* The friction, time costs, and learning costs of accessing benefits.
      *   *What it misses:* It treats the friction as functional inefficiency or deterrent, not as an *epistemic reclassification*. Sludge explains why people don't apply; it doesn't explain why the system ontologically redefines the applicant as a "presumptive fraudster."
  *   **Surveillance Welfare:** (Eubanks, Wacquant)
      *   *What it captures:* The intense monitoring and data-tracking of the poor.
      *   *What it misses:* It describes the *method*, not the *justification loop*. It doesn't capture how the surveillance data is used to retroactively justify the surveillance itself.
  *   **Moral Hazard:**
      *   *What it captures:* The economic fear that benefits induce laziness or cheating.
      *   *What it misses:* This is a theory about *recipient behavior*. Your observation is about *institutional epistemology*. Moral hazard assumes the risk is real; your observation is that the system *constructs* the risk to justify its existence.
  *   **Stigmatization:** (Goffman, Lister)
      *   *What it captures:* The social shame and "undeserving poor" rhetoric.
      *   *What it misses:* Stigma is psychological and social. You are describing a procedural and bureaucratic reality. A claimant can be treated as a presumptive fraudster even in a "stigma-free" digital interface if the code requires them to prove non-guilt.
  *   **Hostile Environment:** (UK Policy term)
      *   *What it captures:* The political intent to make life difficult for unauthorized or benefit-seeking populations.
      *   *What it misses:* This describes *political intent*, not the internal bureaucratic logic loop. A system can exhibit the pattern you describe even without explicit "hostile" political rhetoric, simply through path-dependent risk aversion.

  ### 2. The Coinage: **Constitutive Suspicion**

  I propose the term **Constitutive Suspicion** to name this specific institutional pattern.

  **Definition:**
  > **Constitutive Suspicion** is a bureaucratic epistemology in which suspicion is not a response to evidence of wrongdoing, but the *a priori* condition of engagement. It is a self-validating loop where the verification apparatus required to prove innocence generates the data (non-compliance, errors, delays) that is subsequently categorized as fraud or risk, thereby justifying the intensification of the verification apparatus.

  **Why "Constitutive"?**
  In philosophy, "constitutive" refers to rules or conditions that create the very reality they govern (e.g., the rules of chess constitute the game). In this context, the suspicion does not merely *detect* fraud; it *constitutes* the claimant's status. The claimant does not enter the system as a "citizen with a right" who is then checked; they enter as a "risk to be managed" who must earn the status of citizen. The suspicion creates the ontology of the "fraudulent claimant" before any act of fraud occurs.

  ### 3. The Carving: Boundary Conditions

  To ensure this concept does the work you need, here is how it is distinguished from its neighbors:

  | Concept | Core Mechanism | Relationship to Truth | Goal | **Constitutive Suspicion** Distinction |
  | :--- | :--- | :--- | :--- | :--- |
  | **Conditionality** | Rules attached to benefits. | Neutral. Rules exist to ensure criteria are met. | Allocation efficiency. | Conditionality asks "Did you meet the criteria?" Constitutive Suspicion asks "Are you lying about meeting the criteria?" |
  | **Stigmatization** | Social shame/status loss. | Subjective/Social. | Social boundary maintenance. | Stigma is how people *feel*; Constitutive Suspicion is how the *system processes data*. You can have Constitutive Suspicion without social stigma (e.g., in a black-box algorithm). |
  | **Moral Hazard** | Incentive to cheat. | Economic assumption. | Risk mitigation. | Moral hazard assumes the cheating risk is inherent to the benefit. Constitutive Suspicion assumes the cheating risk is inherent to the *person*, regardless of the benefit structure. |
  | **Admin. Burden** | Friction/Sludge. | Functional/Procedural. | Deterrence or Error reduction. | Burden is the *cost* of the process. Constitutive Suspicion is the *moral logic* of the process. Burden is the weapon; Suspicion is the aim. |
  | **Surveillance** | Monitoring/Data collection. | Observational. | Control/Visibility. | Surveillance is the *tool*. Constitutive Suspicion is the *interpretive framework* applied to the data collected (where ambiguity = guilt). |

  ### 4. The Loop: How It Self-Validates

  The critical feature you identified is the circular justification. Here is the anatomy of the **Constitutive Suspicion Loop**:

  1.  **A Priori Assumption:** The system is designed on the premise that the claimant class is high-risk (e.g., "Disability claimants often malinger").
  2.  **Epistemic Inversion:** The burden of proof shifts from the state (to verify need) to the claimant (to verify non-fraud).
  3.  **Complex Compliance:** The requirements to prove non-fraud are complex, volatile, or opaque (e.g., submitting forms within 24 hours, medical evidence that contradicts itself).
  4.  **Inevitable Non-Compliance:** Due to the complexity (and the claimant's actual vulnerability/illness), claimants inevitably make errors or miss deadlines.
  5.  **Data Reclassification:** These administrative errors are coded as "compliance violations" or "potential fraud indicators."
  6.  **Justification:** Policymakers point to the high rate of "compliance violations" as evidence that the claimant class is high-risk, justifying step 1.

  ### 5. Application to Your Examples

  *   **UK Benefit Sanctions:** The system assumes the claimant is shirking (Constitutive Suspicion). The requirement to prove job search activity is so granular that a missing signature is treated as evidence of shirking (Reclassification). The sanction rate is then cited as proof that shirking was widespread (Self-Validation).
  *   **Disability Audits:** The system assumes recovery is possible and claims are exaggerated. The audit process requires medical evidence that treats fluctuating conditions as inconsistencies. The inconsistency is recorded as "evidence of malingering," justifying stricter audits.
  *   **Workfare:** The system assumes unemployment is behavioral, not structural. The compliance hurdles are designed to test "willingness." Failure to comply (due to lack of childcare, transport, etc.) is recorded as "unwillingness," validating the behavioral theory.

  ### 6. Why This Term Works for Your Seminar

  **Constitutive Suspicion** allows you to move the debate from *efficacy* ("Does this stop fraud?") to *legitimacy* ("Does this redefine the citizen-state relationship?").

  It captures the **deontological shift**: The state is no longer a provider of last resort bound by duty to the needy, but a prosecutor bound by duty to the treasury, where the needy are the defendants.

  It also captures the **performative contradiction**: The system claims to protect the "truly needy" from fraudsters, but by subjecting the truly needy to the epistemology of the fraudster, it makes it impossible for them to *be* the "truly needy" in the eyes of the bureaucracy. They become, institutionally, what the system claims to filter out.

  **Summary for your notes:**
  *   **Term:** Constitutive Suspicion.
  *   **Core:** Epistemic inversion where suspicion is the precondition, not the result.
  *   **Loop:** Verification hurdles generate "guilt" data that justifies the hurdles.
  *   **Distinction:** It is not stigma (social), sludge (friction), or moral hazard (economic); it is ontological (status-defining).
