answer: |-
  This is a remarkably coherent package. You have essentially reconstructed the position of **Humean Everettianism** (championed by philosophers like Alastair Wilson, and aspects of David Wallace's work), though with a specific hesitation on whether to call the Born weights "chances."

  You are asking if you can have your cake (Everettian determinism) and eat it too (Born rule credences) without calling the frosting "chance" (to satisfy Lewisian PP constraints).

  Here is the breakdown of the tensions, ranked by severity, followed by the Sleeping Beauty implication and the recommended revision.

  ### 1. Ranking the Tensions

  **Severity 1 (Critical): The BSA/Chance Collapse (Tension between 2, 3, and 4)**
  *   **The Conflict:** You accept the Best-System Account (2) and Everettianism (3), but deny fundamental chances (4).
  *   **Why it bites:** The whole point of the BSA is that chances are *whatever the best systematization says they are*. If the best summary of the Humean mosaic (the multiverse wavefunction) includes the Schrödinger equation and the Born rule as the most efficient way to capture the structure of branch amplitudes, then **the BSA dictates that there are chances.**
  *   **The Risk:** By insisting on (4), you are imposing a pre-theoretic constraint on "chance" (single-outcome exclusivity) that contradicts your own analysis of chance in (2). A consistent Humean Everettian usually argues that the BSA *recovers* Lewisian chances, relativized to a branch. If you deny (4), you don't need (6); you can just use PP (1).
  *   **Verdict:** This is the strongest tension. (2) and (3) naturally collapse (4).

  **Severity 2 (High): The Functionalist Worry (Tension between 5, 6, and 4)**
  *   **The Conflict:** You claim the Born weights guide credence exactly like chances (5), via a norm that looks structurally identical to PP (6), but deny they are chances (4).
  *   **Why it bites:** This invites the "quacks like a duck" objection. If a quantity plays the chance-role (fits frequencies, guides rational credence, appears in laws), functionalists argue it *is* a chance. By positing a "distinct norm" in (6), you risk multiplying norms without necessity.
  *   **Verdict:** This is largely semantic, but it leaves you vulnerable to charges of obfuscation. If it walks like PP and talks like PP, why isn't it PP?

  **Severity 3 (Low): PP Restriction (Tension between 1 and 3)**
  *   **The Conflict:** PP requires objective chance; MWI says everything happens.
  *   **Why it dissolves:** This is easily managed by your move in (6). You are effectively arguing that PP applies to *single-world* chances (which don't exist in MWI), while a *Self-Locating Uncertainty* norm applies to *branch weights*.
  *   **Verdict:** This is the most stable part of your view. Distinguishing "objective chance of an event" from "credence of self-location within a deterministic multiverse" is a standard and defensible move.

  ---

  ### 2. Does (5) + (6) secretly commit you to Chances?

  **Yes, functionally.**
  If you argue that a rational agent *must* defer to the Born weights regardless of prior belief, you are attributing a normative authority to those weights that is indistinguishable from the authority of objective chance.

  However, you can avoid undermining (4) if you are precise about **metaphysics vs. epistemology**.
  *   **Metaphysics (4):** There is no *ontic* propensity or single-outcome randomness.
  *   **Epistemology (5/6):** There is *indexical* uncertainty about which branch "I" am on.
  *   **Defense:** You can maintain (4) by insisting that "Chance" implies *alternative possibilities* in the world, whereas MWI only offers *alternative locations* for the agent. The norm in (6) is then a norm of **rational self-location**, not a norm of **belief in propensity**. This distinction saves (4), provided you don't let the BSA (2) override it (see Severity 1 above).

  ---

  ### 3. The Sleeping Beauty Connection

  **Does this commit you to being a Thirder? Yes, strongly.**

  Here is the link you might be missing:
  *   **Your View (6):** In MWI, probability arises from **Self-Locating Uncertainty (SLU)**. I know the global state, but I don't know *which branch* I am on. I should weight my credence by the branch measure (Born weights).
  *   **Sleeping Beauty:** The problem is also one of **Self-Locating Uncertainty**. I know the experimental setup, but I don't know *which awakening* I am on (Monday or Tuesday).

  If you argue in (6) that rational credence in MWI should track the "measure" of branches (even though all branches are real), you are arguing that **credence should track the measure of observer-moments.**

  *   **Halfer:** Credence stays at prior (1/2). Ignores the "number" of awakenings.
  *   **Thirder:** Credence updates to reflect the proportion of awakenings (1/3). Treats the "measure" of experiences as relevant to credence.

  If you justify the Born Rule in MWI via (6) (SLU + Measure), consistency demands you treat Sleeping Beauty similarly. If you ignore the "measure" of awakenings in SB (Halfer), it is hard to justify why you shouldn't ignore the "measure" of branches in MWI (which would lead to Branch Counting, not Born Weights, or perhaps uniform credence).
  *   **Note:** Some Everettians try to be Halfers, but they usually ground the Born Rule in Decision Theory (Wallace) rather than Self-Location (Sebens/Carroll). Since you explicitly chose **(6) Self-Locating Rationality**, you are in the **Sebens/Carroll** camp, which is strongly aligned with **Thirding**.

  ---

  ### 4. The Least Costly Revision

  You have a choice between two stable configurations. Currently, you are in an unstable middle ground.

  **Option A: The Robust Humean (Drop 4, Modify 6)**
  *   **Revision:** Admit that under the BSA (2), the Born weights **are** objective chances (relativized to a branch).
  *   **Change:** Drop the denial in (4). Reframe (6) not as a *distinct* norm, but as the application of PP to **branch-relative chances**.
  *   **Cost:** You lose the hard distinction between "MWI weights" and "Lewisian chances."
  *   **Benefit:** It resolves the Severity 1 tension immediately. It aligns perfectly with modern Humean Everettianism (e.g., Alastair Wilson). It makes your view more parsimonious (no need for a new norm in 6).
  *   **Sleeping Beauty:** Commits you firmly to Thirding.

  **Option B: The Primitivist about Self-Location (Keep 4, Drop 2)**
  *   **Revision:** Keep the denial of chances (4), but acknowledge that the **BSA (2) cannot support this.**
  *   **Change:** You must weaken (2). You cannot be a full-blooded Humean about laws/chances if you insist they *must* exclude multiverse structures. You would need to treat the "Self-Locating Norm" (6) as a primitive rationality principle, not derived from the Best System.
  *   **Cost:** You lose the elegant Humean reduction of chance.
  *   **Benefit:** You keep the metaphysical purity of "No Chance" in the multiverse.
  *   **Sleeping Beauty:** Still pushes toward Thirding, but allows more wiggle room to argue quantum self-location is unique.

  **Recommendation:**
  Go with **Option A**.
  It is the least costly revision because you are already committed to the BSA (2). Fighting the BSA's natural conclusion (that the best system includes Born probabilities) is harder than accepting that "chance" can be defined in a way compatible with MWI.

  **Revised Claim (4):** "I deny there are fundamental *single-world* propensities, but I accept the BSA yields *branch-relative* chances."
  **Revised Claim (6):** "This alignment is an application of the Principal Principle, understood as deferring to the best-system chances relevant to my self-locating context."

  This dissolves the tension between (1) and (3), keeps (5) intact, and makes your position a standard, defensible version of Humean Everettianism. And yes, buy the coffee that says "I'm a Thirder" on it; you've earned it.
