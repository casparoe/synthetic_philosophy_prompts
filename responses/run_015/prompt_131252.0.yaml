answer: |-
  1.  **Popper vs. Fragility**
      So, starting off quite broadly: Popper's falsificationism is the classic move we all get taught in first year, but you're shifting the focus from logical falsifiability to 'predictive fragility'. What's the main frustration you had with the original Popperian view that made you reckon we needed this tweak? Is it mostly about how messy actual data looks compared to the logic books?

  2.  **The Duhem-Quine Problem**
      One thing that always comes up with falsification is the Duhem-Quine problem—the idea that you can't test a hypothesis in isolation because you're always relying on auxiliary assumptions. You've mentioned before that you see these auxiliary hypotheses as part of the predictive architecture rather than external shields. But if the whole architecture is tested as a bundle, doesn't that make it harder to pinpoint where the fragility actually lies?
      *   **Follow-up:** *If she insists that the architecture itself must be fragile:* "But surely a complex enough architecture could absorb shocks indefinitely? At what point does 'part of the architecture' just become a fancy way of saying 'immunising strategy'?"

  3.  **Climate and Epidemiological Models**
      You apply this mostly to statistical fields like climate science, where outputs are probabilistic rather than deterministic. Do you reckon current climate models actually satisfy your fragility condition? I'm wondering if generating error distributions is enough if the model can still claim success whenever the data falls within a wide confidence interval.
      *   **Follow-up:** *If she argues that they do satisfy the condition:* "But doesn't that rely on the parameters being fixed beforehand? If modellers can tune the parameters after seeing the data, couldn't they mask the fragility you're looking for?"

  4.  **Demarcation and Astrology**
      Let's talk about the boundary with pseudoscience. The classic test is usually whether astrology counts as scientific. Under your view, could astrology be reconstructed to pass the fragility test? For instance, if an astrologer made precise quantitative predictions about personality scores that could be systematically undermined by survey data, would that suddenly make it scientific?
      *   **Follow-up:** *If she says no, because astrology lacks a mechanism:* "But Popper didn't require a mechanism, just falsifiability. If an astrologer adopted a Bayesian approach and updated their predictions based on misses, why wouldn't that meet your criterion for fragility?"

  5.  **Overfitting and Noise**
      Something that worries me with quantitative predictions is overfitting. If a theory is too fragile, couldn't it just be picking up on noise in the data rather than a genuine signal? How do you distinguish between a theory that's genuinely fragile because it's risky, versus one that's fragile because it's just badly specified?

  6.  **Historical Case Studies**
      I was wondering how this looks historically. Take Newtonian physics—it held up for ages. Would you say it lacked predictive fragility during its successful period, or did it only become 'unscientific' once the anomalies around Mercury started piling up? I'm trying to figure out if fragility is a static property or if it changes over time.

  7.  **Application to Social Sciences**
      Do you think this framework can travel outside the natural sciences? Economics and psychology are trying to become more quantitative, but their error distributions are often much noisier. Would you argue that a lot of social science is currently undemarcated because their models aren't fragile enough, or is the bar different there?

  8.  **Early-Stage Research**
      Here's a practical worry: if we demand predictive fragility too early, might we kill off nascent theories? When a research programme is just starting, scientists often protect their core ideas whilst they get the maths right. Does your view allow for a 'grace period' where a theory isn't yet fragile, or should we reject it straight away?

  9.  **Consensus on Error Distributions**
      You mention checking whether error distributions can be systematically undermined. But who decides what counts as a systematic undermining? Is that a matter for the statistical community to agree on, or is it philosophical? I'm worried that without consensus on the error margins, fragility becomes a bit subjective.

  10. **Biggest Misconception**
      Finally, when you present this to other philosophers or scientists, what's the biggest misconception they usually have about predictive fragility? Is there a particular objection you find yourself having to parry whilst you're defending the idea?
