answer: |-
  ### Preliminary Brainstorming & Deconstruction

  Before locking into a reconstruction, I need to untangle the specific tensions you've described. Here is how I am mapping the problem space:

  1.  **The "Purity" Constraint:** The refusal of alcohol/weapon money is justified by "corruption of merit" and "sangha purity." This language is ontological and agent-relative. It suggests the *source* carries a moral residue that transfers upon contact. This is not standard act-consequentialism. In pure consequentialism, the money is fungible; only the outcome of its spending matters. If the money is "tainted," it implies an intrinsic moral quality to the transaction itself, regardless of the outcome.
  2.  **The "Utility" Justification:** Accepting tech/property money because "suffering reduced outweighs the stain" is explicitly consequentialist. It treats the moral status of the acceptance as a calculation of net suffering/merit.
  3.  **The Discrepancy:** Why is the "stain" of alcohol non-negotiable, but the "stain" of labor exploitation negotiable?
      *   *Hypothesis 1:* Hierarchy of Precepts. Intoxication and Killing (weapons) are direct breaches of the Five Precepts. Exploitation is a breach of Right Livelihood, which is often viewed as a "higher" or more nuanced training rule for laypeople, whereas the Five Precepts are basic moral hygiene.
      *   *Hypothesis 2:* Proximity of Causation. Buying alcohol directly funds the production of a substance that causes heedlessness (*pamada*). Investing in property is structurally linked to suffering but causally distant.
      *   *Hypothesis 3:* Institutional Pragmatism. This isn't philosophy; it's survival. Alcohol/weapon donors are often stigmatized publicly, whereas tech/property donors are elites. The "philosophy" is post-hoc rationalization.
  4.  **The "Cleansing" Mechanism:** The idea that the Sangha can "cleanse" money through use implies that moral value is generated at the point of *consumption/application*, not just *acquisition*. This suggests a karmic transaction model where merit can offset demerit transactionally.

  Okay, I have the lay of the land. I will now reconstruct the implicit theory, addressing your specific questions about consequentialism, non-compensable harms, and moral responsibility.

  ***

  ### Reconstruction of the Implicit Ethical Theory

  Based on the scenario you described, the retreat center is operating under a **Hybrid Karmic Threshold Deontology**. It is not consistently consequentialist, nor is it strictly deontological. It presupposes a layered moral ontology where different types of harm function differently within the karmic calculus.

  Here is the breakdown of the philosophical commitments:

  #### 1. On Consequentialism vs. Purity
  The policy presupposes that **outcomes matter, but only within constraints set by agent-relative purity.**

  If the view were purely consequentialist, the source of the funds would be morally irrelevant; only the *use* of the funds (the outcome) would matter. A pure consequentialist would accept drug cartel money if it built a hospital that saved more lives than the cartel took. The fact that they refuse alcohol/weapon money indicates a **deontological constraint**. They believe certain actions (accepting specific types of tainted resources) are intrinsically wrong or spiritually dangerous, regardless of the good outcomes they might produce.

  However, the acceptance of tech/property money shows that these deontological constraints are not absolute. They are **threshold-based**. The "purity" of the Sangha is treated as a finite resource that can withstand a certain amount of moral "friction" (labor exploitation) but breaks under specific high-voltage harms (weapons/intoxicants).

  **Commitment:** Moral status is determined by a lexical ordering.
  *   *Level 1 (Absolute Veto):* Direct support of Precept-breaking substances (alcohol, weapons). These are "non-compensable."
  *   *Level 2 (Calculable):* Structural or indirect harms (labor exploitation). These enter the consequentialist calculus and can be outweighed by the merit generated by the Dhamma.

  #### 2. Can a Consistent Consequentialist Allow Non-Compensable Harms?
  You asked if a consistent consequentialist can allow that some harms are non-compensable. **Technically, no, not without ceasing to be a standard act-consequentialist.** However, they can be a **Rule-Consequentialist** or a **Negative Utilitarian**.

  *   **Rule-Consequentialism:** The center might argue that a *rule* ("Never take alcohol money") produces better long-term consequences than calculating each case, because it prevents slippery slopes or reputational damage that would hinder the Dhamma's spread.
  *   **Incommensurability:** The policy presupposes that the harm of "corrupting the Sangha's purity" is of a different *category* than the harm of "labor exploitation." In Buddhist soteriology, spiritual corruption (leading to lower rebirth or hindering enlightenment) is often viewed as infinitely worse than worldly suffering. Therefore, a consequentialist *could* argue that the negative utility of spiritual corruption is so high it can never be outweighed by worldly good.

  **The Implicit View:** The center is treating "Purity" as a **side-constraint** on the maximization of merit. This is structurally similar to Robert Nozick's critique of utilitarianism: individuals (or in this case, the Sangha's spiritual integrity) cannot be sacrificed solely for the greater good.

  #### 3. Moral Responsibility and the "Cleansing" of Money
  The idea that the Sangha can "cleanse" money through use presupposes a **Transactional Theory of Karma**.

  In this view, moral value is not static; it is dynamic and transferable.
  *   **The Donor:** Generates demerit (*papa*) through Wrong Livelihood.
  *   **The Recipient:** Generates merit (*punna*) through Generosity (*dana*) and Dhamma practice.
  *   **The Transaction:** The policy implies that the Merit generated by the *use* of the funds can metabolize the Demerit of the *source*.

  This embeds a specific view of moral responsibility: **Responsibility is distributed across the causal chain.** The donor is responsible for the earning; the monk is responsible for the spending. By spending it on "good" ends, the monk alters the karmic trajectory of the funds. This is distinct from Western views where "dirty money" might remain dirty regardless of use. In this Buddhist folk-ethics, the *intention* (*cetana*) of the user can retroactively recontextualize the resource.

  However, the "Alcohol/Weapon" veto suggests there is a limit to this metabolic capacity. Some toxins are too strong for the Sangha's digestive system. This implies the Sangha has a **moral capacity limit**. They are not infinite merit-generators; they are vulnerable fields of merit.

  ### Summary of the Implicit Theory
  The retreat center is operating on a **Soteriological Threshold Deontology**.
  1.  **Goal:** Maximize liberation/reduce suffering (Consequentialist/Teleological).
  2.  **Constraint:** Maintain the ontological purity of the Sangha to ensure it remains a valid "field of merit" (Deontological/Virtue-based).
  3.  **Mechanism:** Karmic Transactionalism (Merit can offset Demerit, up to a threshold).

  ***

  ### Confidence Assessment

  **Overall Confidence: High (75%)**
  I am confident that the behavior you described cannot be mapped onto a single Western moral theory (like pure Utilitarianism or Kantianism) without distortion. It is a syncretic practical ethics specific to institutional Buddhism. The distinction between "direct precept violation" (alcohol) and "structural suffering" (labor) is a standard move in Theravada casuistry.

  **Point of Least Certainty: The Coherence of the "Cleansing" Doctrine**
  **Confidence: Low (40%)**
  I am least sure about the claim that this represents a coherent *philosophical* commitment rather than **institutional rationalization**.
  *   *Why:* Canonical Buddhism (the Pali Canon) is actually quite strict on monastics handling money at all (gold and silver rule). The entire debate about "tainted money" is a modern adaptation to a cash economy.
  *   *Speculation:* It is highly probable that the distinction between "alcohol money" and "tech money" is driven by **social license** rather than philosophical consistency. Alcohol and weapons are visibly "sinful" in both Buddhist and secular eyes. Labor exploitation in tech/property is structurally invisible and socially normalized among the donor class.
  *   *Risk:* I may be attributing philosophical depth to what is essentially pragmatic fundraising strategy dressed in Dhamma language. If this is the case, the "Threshold Deontology" I reconstructed is a post-hoc narrative, not the actual operating system.

  ### Final Verdict on Your Row
  You can tell your mate that the practice is **not consistently consequentialist**. It uses consequentialist logic to justify the *acceptance* of ambiguous funds, but relies on deontological/virtue-ethical logic to justify the *refusal* of specific funds. The double standard presupposes that **some harms are ontological (purity)** while **others are merely quantitative (suffering)**. This is philosophically unstable unless you accept the premise that spiritual corruption is infinitely weightier than worldly exploitation—a theological claim, not a purely ethical one.
