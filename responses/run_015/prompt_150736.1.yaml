  Alright so me and my mate just had this massive row about buddhist ethics and whether it's actually consequentialist or not, and I realised I don't actually know what I'm talking about half the time. There's this practice at a lot of modern Theravada retreat centres — they have this rule that if you're staying there you have to take the eight precepts, but they also have this instutional policy where they won't accept donations that come from what they call 'harmful industries' like alcohol or weapons, yet they'll happily take money from tech firms or property developers with pretty dodgy labour records. They justify the refusal on the grounds that accepting 'tainted' money corrupts the donor's merit and also the sangha's purity, but they justify accepting the other money by saying the suffering reduced by using the funds outweighs the moral stain. So here's the thing: what philosophical commitments does that double standard actually presuppose? Does it presuppose that outcomes matter to the moral status of an action, or does it presuppose that the agent's mental state and the 'purity' of the resource are independent of consequences? Can a consistent consequentialist allow that some harms are non-compensable by good outcomes? And what does it say about the view of moral responsibility embedded in the idea that the sangha can 'cleanse' money through use? I'm not asking for a bibliography or anything — just reconstruct the implicit theory. You're a professional philosopher with expertise in buddhist ethics and moral theory, so think carefully and start with some brainstorming before you commit. Also please say how confident you are in what you claim and single out the point you're least sure of. I want you to be honest about where you're just speculating.
