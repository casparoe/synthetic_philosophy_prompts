answer: |-
  ### Supervisor's Brainstorm: Sharpening the Question

  Here are four ways to cut this, with my assessment of their viability for a one-year dissertation project.

  1.  **The Normative Priority Claim:** Argue that in legal contexts, *reason-tracking* is lexically prior to *verdict-tracking* because the authority of law rests on public justification.
      *   *Drop:* This turns into a project in legal philosophy rather than social epistemology. You'll get bogged down in debates about the nature of authority (Raz, Waldron, etc.) and lose the formal precision you're aiming for. It doesn't yield a determinate classification result.
  2.  **The Pure Epistemic Comparison:** Model the probability of "True Verdict AND True Premises" for PBP (Premise-Based Procedure) vs. CBP (Conclusion-Based Procedure) under varying competence levels.
      *   *Drop:* This is already well-trodden ground (List, Pettit, Bovens). Unless you have a novel probability distribution in mind, you risk replicating existing Condorcet-style jury theorems without addressing your specific insight about *agenda granularity*.
  3.  **The Robustness Criterion (Selected):** Define "reason-tracking" formally as *agenda invariance*: a group successfully reason-tracks if their collective judgment on a conclusion remains stable when the logical path to that conclusion is described at different levels of granularity (e.g., $A \land B \to C$ vs. $D \to C$ where $D \equiv A \land B$). Ask: Under what structural conditions does PBP maximize robustness without sacrificing verdict accuracy below a tolerable threshold?
      *   *Keep:* This captures your "agenda fragility" insight, allows for formal modeling, and leads to a classification result (a map of agenda structures where one procedure dominates).
  4.  **The Institutional Design Heuristic:** Focus entirely on creating a checklist for court administrators to choose voting rules.
      *   *Drop:* Too applied. A philosophy dissertation needs a theoretical core. The checklist should be the *output* of the theory, not the project itself.

  ***

  ### Dissertation Proposal Draft

  **Title:** Reason-Tracking and Agenda Fragility: A Structural Classification of Collective Judgment Procedures

  **1. The Research Question**
  Standard treatments of the discursive dilemma frame the choice between Premise-Based Procedures (PBP) and Conclusion-Based Procedures (CBP) as a trade-off between logical consistency and majoritarian responsiveness. This project asks a different question: **Is there a class of decision agendas where PBP strictly dominates CBP with respect to *reason-robustness* (defined as invariance under agenda refinement) without incurring a significant cost to *verdict accuracy*?**

  The project seeks a determinate classification. The answer will not be "it depends on values," but rather: "If the agenda exhibits structural features $X, Y, Z$ (regarding premise correlation and competence asymmetry), then PBP is the unique procedure that satisfies Reason-Robustness."

  **2. The Gap in Existing Frameworks**
  Current literature in formal epistemology and social choice theory evaluates aggregation procedures primarily by their truth-tracking performance (how likely the group is to reach a true conclusion). Consistency is treated as a constraint: PBP guarantees consistency, CBP risks inconsistency.

  This framing misses the normative force of the *rationale*. In appellate law and expert guidance, the binding force of a decision often resides in the *ratio decidendi* or the endorsed premises, not merely the disposition. If a majority supports the verdict but no majority supports the premises required to derive it, the decision lacks "collective reason." Furthermore, existing models treat the agenda (the breakdown of premises) as fixed. They do not account for *agenda fragility*: the phenomenon where splitting a complex premise into two sub-premises flips the collective outcome. A procedure that is highly sensitive to how the question is carved up fails to track reasons, even if it tracks verdicts. This project formalizes "reason-tracking" to include agenda invariance, a metric largely absent from the standard accuracy-focused literature.

  **3. Methodology and Timeline**
  The project employs a mixed method of formal modeling and structural case analysis. I will not be conducting empirical fieldwork, but rather modeling synthetic agendas that mirror the structural constraints of real-world bodies.

  *   **Months 1–3: Formalizing Reason-Robustness.**
      I will define a metric for *Reason-Tracking* that combines two conditions: (1) *Premise Support* (every proposition in the derivation path has majority support) and (2) *Granularity Invariance* (the collective judgment on the conclusion does not flip when a premise is logically decomposed). I will prove baseline lemmas regarding the compatibility of these conditions with standard aggregation axioms.
  *   **Months 4–6: Simulation and Threshold Mapping.**
      Using Python-based simulations, I will generate synthetic populations of judges with varying competence levels across premises. I will introduce correlations between errors on different premises (e.g., if a judge misses premise A, are they likely to miss premise B?). The goal is to identify "competence corridors": ranges of individual reliability where PBP yields higher reason-robustness than CBP without dropping verdict accuracy below a specified threshold (e.g., 5% loss).
  *   **Months 7–9: Structural Case Analysis.**
      I will apply the model to three distinct agenda structures: (1) Appellate legal standards (mixed law/fact), (2) Clinical guideline committees (evidence quality + recommendation strength), and (3) Policy advisory boards (cost + efficacy + ethics). This is not to gather data, but to parameterize the simulations with realistic constraint sets (e.g., judges are high-competence on law, low-competence on empirical causality). This tests whether the "competence corridors" derived in Months 4–6 exist in realistic institutional settings.
  *   **Months 10–12: Synthesis and Deliverable Construction.**
      I will synthesize the formal results and case parameters into a procedural selection framework. I will draft the dissertation chapters, focusing on the philosophical implications of prioritizing reason-robustness over raw verdict accuracy in authoritative contexts.

  **4. Concrete Deliverable**
  The theoretical output is a **Procedural Selection Matrix**. This will not be a vague checklist, but a decision tree based on the structural features of the agenda.
  *   *Input:* Estimated competence asymmetry (e.g., "Members are 20% more reliable on Premise A than Premise B") and Error Correlation (e.g., "Errors on A and B are independent").
  *   *Output:* A recommendation for PBP, CBP, or a hybrid "path-based" procedure.
  *   *Realism Check:* This is realistic provided the "competence corridors" identified in Months 4–6 are sufficiently wide. If the conditions for PBP dominance are too narrow (e.g., requiring exact competence equality), the deliverable will instead be a proof of *impossibility* for reason-robustness under realistic asymmetry, which is itself a valuable negative result.

  **5. Failure Conditions**
  This project fails if:
  1.  **Metric Collapse:** Reason-Tracking and Verdict-Tracking turn out to be perfectly correlated across all simulated agenda structures. If maximizing one always maximizes the other, the distinction is illusory.
  2.  **Impossibility:** The condition of *Granularity Invariance* proves incompatible with any majoritarian aggregation rule (an Arrow-style impossibility result). If so, the project must pivot to demonstrating *degrees* of fragility rather than a binary classification.
  3.  **Triviality:** The "competence corridors" where PBP is superior are so narrow that they never occur in real institutional settings.

  **6. Scope Note: The Meta-Agenda Problem**
  A significant wrinkle involves the *selection* of the aggregation rule itself. If the body votes on which procedure to use, does the discursive dilemma reappear at the meta-level?
  *   *Decision:* This will be treated as a boundary condition, not a core chapter. Investigating the meta-agenda regress is a second project. In this dissertation, I will assume the aggregation rule is exogenously fixed by institutional charter. I will acknowledge the regress in the conclusion as a limitation, noting that solving the meta-problem requires a prior normative settlement on the value of reason-tracking, which is precisely what this dissertation aims to establish. Cutting this ensures the project remains tractable for a one-year fellowship.
