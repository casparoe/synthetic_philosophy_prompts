          2.  For each reading, provide a verdict (Trivial, Substantive & Defensible, Substantive & Hard to Defend).
          3.  For each reading, pin down three hidden variables: *Currency* (opportunity for what? single scale?), *Timing* (equal at what point? intergenerational?), *Ex Ante vs. Ex Post* (chances vs. distribution, especially regarding positional goods).
          4.  Evaluate which readings license dismissing the European/Nordic approach.
          5.  Address the user's suspicion (strong readings are empty, defensible readings are too demanding, different currencies).
          6.  Identify if *any* single reading is both worth defending AND strong enough to dismiss the Nordic model.
          7.  Conclude with what each attitude (Opportunity vs. Outcome) notices that the other misses.

  2.  **Deconstruct the Slogan:**
      *   "Equality of Opportunity" (EOP): Usually implies procedural fairness, meritocracy, removing arbitrary barriers.
      *   "Not Equality of Outcome" (EOO): Usually implies allowing inequality resulting from choice, effort, or talent, opposing leveling down.
      *   The Conflict: The seminar uses EOP to argue *against* redistributive institutions (Nordic model). This implies they think the Nordic model aims for EOO or violates EOP by interfering with market outcomes.

  3.  **Develop the Menu of Readings:**
