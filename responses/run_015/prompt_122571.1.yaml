      *   *Reading 3: Luck Egalitarianism.* (Dworkin/Cohen/Arneson). Neutralize brute luck, respect option luck.
      *   *Reading 4: Libertarian/Nozickian Entitlement.* (Historical entitlement). Justice is in the process, not the pattern.
      *   *Reading 5: Prioritarian/Sufficientarian.* (Frankfurt/Parfit). Everyone needs enough; beyond that, inequality doesn't matter.

      *Refining for the specific prompt:* I need to focus on how these readings handle the *Currency*, *Timing*, and *Ex Ante/Ex Post* distinction, and specifically whether they justify *rejecting* the Nordic model.

      *Selection:*
