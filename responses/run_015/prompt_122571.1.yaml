answer: |-
  This is a precise dissection of a familiar philosophical evasion. The slogan "equality of opportunity, not equality of outcomes" functions as a Rorschach test: it sounds like a principle, but it operates as a boundary marker. To determine whether it legitimately dismisses the Nordic model (sectoral bargaining, high union density, social insurance), we must treat it not as a slogan but as a variable-heavy hypothesis.

  Here is a menu of four distinct philosophical readings of the claim, precisified by your three criteria (**Currency**, **Timing**, **Ex Ante/Ex Post**), with a verdict on their defensibility and their ability to do the work your seminar demands.

  ### 1. Formal Non-Discrimination (The Liberal Minimum)
  *   **The Claim:** Justice requires only that legal and formal barriers to entry (based on race, gender, creed) be removed.
  *   **Currency:** Legal rights and access to application procedures. There is no single scale of "whole lives"; only specific gates are evaluated.
  *   **Timing:** The moment of application or hiring. It ignores pre-market socialization (childhood, education) as outside the scope of *political* justice.
  *   **Ex Ante vs. Ex Post:** Purely *Ex Ante*. It concerns the rules of the race, not the training of the runners or the prize distribution.
  *   **Verdict:** **Trivial.** Everyone accepts this, including Nordic social democrats.
  *   **Does it dismiss the Nordic Model?** **No.** Formal non-discrimination is compatible with, and often legally bolstered by, strong welfare states. It cannot argue *against* sectoral bargaining or social insurance, as these do not formally discriminate; they regulate the market structure itself.

  ### 2. Fair Equality of Opportunity (The Rawlsian Reading)
  *   **The Claim:** Those with similar abilities and motivations should have similar life chances, regardless of their class of origin.
  *   **Currency:** Access to "offices and positions" weighted by talent. This implies a single scale of social primary goods (income, wealth, powers, prerogatives).
  *   **Timing:** Developmental. Equality must be secured *before* the competition begins (via education, health, family support), requiring continuous intervention throughout childhood.
  *   **Ex Ante vs. Ex Post:** *Ex Ante* focus, but requires *Ex Post* monitoring. Because social contingencies (wealthy parents) distort *Ex Ante* chances, you must regulate *Ex Post* outcomes (inheritance, school funding) to maintain the *Ex Ante* fairness.
  *   **Verdict:** **Substantive and Defensible.** This is the most robust theory of opportunity available.
  *   **Does it dismiss the Nordic Model?** **No. In fact, it requires it.** To satisfy Fair Equality of Opportunity (FEO), you must mitigate the advantages wealth buys. High union density and wage compression prevent wealthy families from purchasing superior advantages for their children (e.g., via exclusive schooling or capital accumulation). A Rawlsian would likely argue the US fails FEO *because* it lacks Nordic-style interventions.

  ### 3. Libertarian Proceduralism (The "Free Market" Reading)
  *   **The Claim:** Justice is found in the voluntariness of transactions, not the pattern of distribution. If no force or fraud is used, the outcome is just by definition.
  *   **Currency:** Liberty to contract. There is no scale of "lives"; there are only individual holdings and entitlements.
  *   **Timing:** Continuous. Justice is a property of every transaction moment-to-moment, not a state of affairs at a specific life stage.
  *   **Ex Ante vs. Ex Post:** Collapses the distinction. If the process is free, the result is the opportunity. To interfere with the *Ex Post* outcome (via taxes or wage bargaining) is to violate the *Ex Ante* liberty.
  *   **Verdict:** **Substantive and Hard to Defend.** It ignores power asymmetries (a starving worker "voluntarily" accepting low wages) and the intergenerational accumulation of advantage that rig the "free" process.
  *   **Does it dismiss the Nordic Model?** **Yes.** This is the reading your seminar is implicitly using. It views sectoral bargaining as a cartel restricting liberty and social insurance as a violation of entitlement. However, because this reading is philosophically fragile (ignoring background power), it is a weak foundation for a "conversation-stopper."

  ### 4. Luck Egalitarianism (The "Brute Luck" Reading)
  *   **The Claim:** Inequalities resulting from "brute luck" (genetics, birth) should be compensated; inequalities resulting from "option luck" (choice, effort) should be respected.
  *   **Currency:** Welfare or Resources. Lives can be ranked by how much of their status is due to luck vs. choice.
  *   **Timing:** Lifetime aggregate. It looks at the whole life to determine if disadvantages were chosen or unchosen.
  *   **Ex Ante vs. Ex Post:** Blurs the line. It uses *Ex Post* redistribution to correct for *Ex Ante* bad luck, but stops redistribution when *Ex Post* inequality reflects *Ex Ante* choice.
  *   **Verdict:** **Substantive and Hard to Defend.** It faces the "epistemic problem" (we cannot distinguish luck from choice) and the "abandonment problem" (it seems cruel to let those who made bad choices starve).
  *   **Does it dismiss the Nordic Model?** **No.** Luck egalitarians usually support generous social insurance to cover "brute luck" (illness, economic shifts). They might critique unconditional benefits, but they generally support the *structure* of risk-pooling found in the Nordic model.

  ***

  ### Evaluating Your Suspicion

  You suspected that **readings strong enough to dismiss the European approach are nearly empty, while readings worth defending are more demanding than any existing welfare state.**

  The menu above confirms this suspicion with high precision.

  1.  **The Empty Reading:** The only reading that successfully dismisses the Nordic model is **Reading 3 (Libertarian Proceduralism)**. It claims that wage bargaining and insurance are unjust interferences. However, this reading is philosophically "empty" in the sense that it ignores the reality of power. It treats a monopoly of capital the same as a monopoly of labor. It is strong enough to do the work, but only by defining "opportunity" so thinly (as mere non-interference) that it loses moral traction.
  2.  **The Demanding Reading:** The reading worth defending is **Reading 2 (Rawlsian FEO)**. However, this reading does not dismiss the Nordic model; it indicts the *alternative*. To truly equalize opportunity, you need massive intervention in childhood, health, and wealth transmission. A society that claims to value opportunity but rejects outcome-mitigating institutions (like unions) is, on this reading, hypocritical.
  3.  **The Currency Mismatch:** You are also correct that the two sides are measuring different currencies.
      *   **The Slogan (Opportunity):** Measures **Mobility**. It asks: *Can the poor become rich?* It accepts high inequality if the ladder is open.
      *   **The Nordic Model (Security/Standing):** Measures **Risk and Dignity**. It asks: *What happens if you stay poor?* It compresses outcomes to ensure that "losing" the competition does not mean losing your standing as a citizen.

  ### Is There a Single Reading That Does the Work?

  **No.** There is no single reading of "equality of opportunity, not equality of outcomes" that is both **philosophically defensible** AND **strong enough to dismiss the Nordic approach.**

  *   If you make the principle **defensible** (by acknowledging that social contingencies rig the game, à la Rawls), you are forced to support redistributive institutions that look very much like the Nordic model.
  *   If you make the principle **strong enough to dismiss the Nordic model** (by claiming market outcomes are sacrosanct), you make it **indefensible** (by ignoring how past outcomes rig future opportunities).

  The slogan works as a conversation-stopper only by sliding between these two meanings. It borrows the moral prestige of the defensible reading (who can be against fair chances?) to protect the policy conclusions of the indefensible reading (therefore, do not tax the rich or empower unions).

  ### Mutual Blindspots: What Each Attitude Misses

  To close, here is what each perspective notices that the other systematically obscures. This is where your seminar should move *after* dissolving the slogan.

  **What the "Opportunity" Attitude Misses:**
  It misses the **value of the floor.** By focusing on the *top* of the distribution (who gets to be a CEO?), it treats the *bottom* as merely a waiting room for the next mobility sprint. It fails to see that **security is a precondition for agency.** In a high-inequality system (low outcome equality), the risk of failure is so catastrophic that individuals become risk-averse, actually *reducing* genuine opportunity (e.g., no one starts a business if bankruptcy means destitution). The Nordic model notices that compressing outcomes (safety nets) increases risk-taking (opportunity).

  **What the "Outcome" Attitude Misses:**
  It misses the **value of the ladder.** By focusing on the *dispersion* of the distribution (the gap between CEO and worker), it can obscure **rigidity.** A society can have low inequality but also low mobility (a "flat" caste system). If you focus solely on outcome compression, you might tolerate a society where everyone is equally poor or where positions are assigned by bureaucracy rather than merit. The Opportunity view correctly notices that without some differentiation in reward, innovation and talent allocation may stagnate.

  **Conclusion for the Seminar:**
  The slogan is not a principle; it is a **boundary dispute.** The Nordic model argues that you cannot have equality of opportunity *without* significant equality of outcomes (because wealth buys opportunity). The seminar opponents argue that you cannot have equality of opportunity *with* significant equality of outcomes (because rewards drive effort).

  The conversation should not stop at the slogan. It should proceed to the empirical and normative question: **How much outcome equality is required to sustain genuine opportunity?** That is a question the slogan was designed to prevent you from asking.
