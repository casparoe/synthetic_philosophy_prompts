      2.  **Rawlsian Fair Equality of Opportunity (FEO):** The most philosophically robust "opportunity" view.
      3.  **Luck Egalitarianism:** The bridge between opportunity and outcome.
      4.  **Libertarian Proceduralism:** The "free market" version often implied by the slogan.

  4.  **Drafting the Entries (incorporating Currency, Timing, Ex Ante/Ex Post):**

      *   *Reading 1: Formal Non-Discrimination.*
