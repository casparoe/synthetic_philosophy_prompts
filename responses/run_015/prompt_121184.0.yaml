answer: |-
  This deadlock is a category error where functionalist sociology collides with deontological ethics, obscured by an unproven empirical bet on whether memory work actually prevents future violence.

  The two camps are not answering the same question. The comparativists are doing descriptive political sociology: they ask how states utilize narrative to stabilize identity, legitimize authority, or transition to democracy. For them, "working through" is a mechanistic variable—a set of policies like trials, textbooks, and monuments—and they argue that isolating the Holocaust renders the concept useless for understanding other transitions. The exceptionalists are doing normative ethics: they ask what we owe the dead and how specific evils demand specific forms of reverence. For them, "working through" is a moral obligation tied to the ontological status of the crime, and they argue that structural comparison inevitably slides into moral equivalence, diluting the imperative to remember the Holocaust as a rupture in civilization rather than a policy failure.

  This isn't merely a verbal mess, though terminology exacerbates it. When one side says "similar," they mean "functionally analogous state behaviors"; when the other hears "similar," they interpret it as "equally evil." That is a substantive disagreement about moral epistemology, specifically whether moral value is intrinsic to the event or derived from its political usage. However, the debate stays stuck because both sides hide behind a hidden empirical claim: that their preferred mode of remembrance produces better societal outcomes. Comparativists assume universalizing memory fosters broader human rights vigilance, while exceptionalists assume specificizing memory fosters deeper moral vigilance. Neither has definitive proof that state-sponsored remorse actually reduces inter-group violence or prevents recurrence more effectively than silence or myth-making.

  Progress requires decoupling the mechanism of memory from the magnitude of the crime. We need to stop asking whether the events are comparable and start asking whether the *tools* of remembrance are transferable. A research agenda focused on efficacy rather than ontology would treat memory practices as interventions: does state-sponsored denial correlate with higher rates of future authoritarianism regardless of the original crime's scale? If the data shows that the *process* of acknowledgment stabilizes democracies equally well in Germany, Japan, and South Africa, the structuralists win on utility without the exceptionalists having to surrender moral specificity. Until then, the debate remains a proxy war between sociologists wanting generalizable laws and ethicists defending sacred boundaries.
