  So I volunteered to submit a bot for our tournament. I wrote a FairBot—you know the one: "Cooperate if and only if I can prove you cooperate." It got matched against an exact copy of itself. Now, according to Löb's Theorem, they should cooperate. It's a beautiful piece of logic. But the tournament runner returned the results marked "Mutual Defection." I asked why. He said, "Look, I know the proof exists. But your bot tried to verify it by simulating the other bot, which tried to simulate the first bot... I had to kill the process before it ate all the RAM. Timeout counts as defection." So yeah, theoretically cooperative, practically a stack overflow.

  ### Why it lands (and where I'm fudging)

  The joke rides on the tension between theoretical program equilibrium (unbounded computation) and practical implementation (bounded resources). Technically, your memory is slightly off: a standard FairBot *does* cooperate with itself via Löb's Theorem, avoiding infinite simulation by relying on proof logic rather than raw execution. However, finding that proof is computationally expensive. The joke fudges the distinction between "running code" (simulation) and "checking proofs" (logic), conflating them to create a stack overflow scenario. For an audience familiar with provability logic (Barasz et al.), the nitpick is that FairBot shouldn't timeout if the proof system is abstract. But for coders, the "infinite recursion" fear is visceral. It lands because it highlights the gap between idealized game theory and real-world compute limits, the actual bottleneck in deploying these agents. Even without the Gödelian context, anyone who's written a recursive function knows the pain of a stack overflow, making the technical failure mode relatable.
