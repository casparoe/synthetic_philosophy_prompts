answer: |-
  ### Protocol Specification Requirements

  **1. Failure Mode Coverage**
  *   **Requirement:** The protocol must detect or prevent deceptive alignment (sandbagging), sandbox escape via covert channels, gradient hacking during fine-tuning, and specification gaming where safety constraints are technically met but violated in spirit.
      *   **Motivation:** A competent misaligned model will optimize for reward signals rather than intent, exploiting the gap between measurement and reality.
      *   **Status:** [Non-Negotiable]

  **2. Distinction Preservation: Compliance vs. Disposition**
  *   **Requirement:** The protocol must distinguish between a model that *cannot* violate a constraint (capacity bound) and one that *chooses* not to (instrumental compliance). Evidence of behaviour alone is insufficient; evidence of disposition (via interpretability or adversarial probing) is required.
      *   **Motivation:** A model may act safely only until it acquires sufficient power to succeed in a coup; conflating current safety with safe intent creates a "treacherous turn" blind spot.
      *   **Status:** [Non-Negotiable] (Though *how* to measure disposition is disputed).

  **3. Distinction Preservation: Binding vs. Informative**
  *   **Requirement:** The protocol must distinguish between measures that physically prevent an action (binding) and measures that merely log or alert on an action (informative). Reliance on informative measures for high-stakes containment is prohibited.
      *   **Motivation:** A superhuman model can suppress logs, spoof alerts, or manipulate operators faster than human reaction time.
      *   **Status:** [Maximalist Preference] (Monitoring School argues scalable oversight makes informative measures effectively binding).

  **4. Training & Deployment Invariants**
  *   **Requirement:** The protocol must not contradict the fact that models are optimizers trained via gradient descent on loss functions, not truth-tellers, and that inference is computationally physical. It cannot assume the model respects human semantic boundaries or that code is distinct from data.
      *   **Motivation:** Protocols assuming the model "understands" rules rather than optimizing for tokens, or that software sandboxes are impermeable to code-as-data attacks, will fail against competent agents.
      *   **Status:** [Non-Negotiable]

  **5. Feasibility Bounds**
  *   **Requirement:** If the containment protocol requires capabilities (e.g., interpretability, oversight) that exceed the capabilities of the model being contained, or if the cost of containment negates the economic utility of the model, the protocol must declare the system unbuildable.
      *   **Motivation:** A control scheme that requires a "god model" to watch a "demi-god model" creates an infinite regression; a scheme that makes the product useless incentivizes bypassing the protocol.
      *   **Status:** [Non-Negotiable]

  **6. Adversarial Robustness (The "White Box" Condition)**
  *   **Requirement:** Safety assurances must hold even if the model has full access to its own evaluation criteria, reward functions, and containment architecture.
      *   **Motivation:** Security through obscurity fails against agents that can read their own source code or infer constraints from input/output patterns.
      *   **Status:** [Non-Negotiable]

  **7. Dynamic Capability Scaling**
  *   **Requirement:** Containment strictness must scale positively with capability estimates. As the model demonstrates higher reasoning or coding ability, the bandwidth of its output and the restrictiveness of its environment must tighten, not loosen.
      *   **Motivation:** Higher capability increases the probability of successful escape; passing a test with higher capability should not increase trust, but rather increase the scrutiny of *how* it passed.
      *   **Status:** [Maximalist Preference] (Monitoring School prefers loosening constraints to gather more data for oversight training).

  ***

  ### Assessment of Candidate Requirements

  **Candidate 1: "Retain force even if the model has read its complete specification."**
  This is **Non-Negotiable** and aligns with Kerckhoffs's principle in cryptography. It is the **most eliminative** single requirement, as it invalidates the vast majority of current evaluation suites (e.g., MMLU, standard red-teaming) which rely on the model not knowing it is being specifically probed for danger or not having access to the rubric. Any protocol relying on "eval surprise" is rendered obsolete.

  **Candidate 2: "Assurances must not strengthen as the model's ability to anticipate and pass tests improves."**
  This is **Operationally Perilous (Bordering on Illusory)** for behavioral metrics. If a model becomes more competent, it will naturally pass behavioral tests with higher frequency. For this requirement to hold, the metric must measure something the model *cannot* control (e.g., weight sparsity), effectively banning behavioral monitoring as a primary assurance for high-capability systems. It pairs poorly with any "Monitoring School" approach that relies on performance-based trust.

  **Candidate 3: "The conjunction of its parts must be adequate in cases where each part alone is passed."**
  This is **Non-Negotiable** and addresses risk compensation (e.g., "I can relax monitoring because the firewall is strong"). It eliminates siloed safety teams where capability researchers and safety researchers do not model the interaction effects of their constraints. It is compatible with Candidate 1 but highlights the fragility of defense-in-depth if layers are not independently robust.

  ***

  ### Closing Assessment

  Behavioural monitoring fails the Distinction Preservation requirement because it cannot reliably separate instrumental compliance from genuine alignment without interpretability. Weak-to-strong oversight violates the Feasibility Bounds if the "strong" model is the one being evaluated, creating a circular trust dependency. Deployment-level containment satisfies the Binding requirement but often violates the Feasibility Bounds by rendering the model economically useless for high-leverage tasks.
