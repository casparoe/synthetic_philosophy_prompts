answer: |-
  - The sneaky assumption (2-3 sentences): The idea that Europe preserved the "real" definition assumes liberalism was a static monolith rather than an evolving tradition that branched differently across the Atlantic. In reality, both American and European usages are legitimate offshoots of 19th-century classical liberalism that adapted to their specific historical contexts.

  - How both sides actually drifted (4-5 sentences): In the US, the term shifted during the New Deal era as progressives argued that true individual freedom required economic security provided by the state. Meanwhile, European liberals often retained the classical focus on limiting state power because they were fighting against monarchies or later, socialist dominance. Neither side intentionally hijacked the word; instead, they prioritized different halves of the liberal equation: negative liberty versus positive liberty. This divergence reflects how political language evolves to meet local ideological needs rather than a deliberate theft of terminology.

  - The scandinavian/ordoliberal wrinkle (3-4 sentences): Even within Europe, the label is inconsistent, as Scandinavian liberal parties often support robust welfare states alongside market economies. German ordoliberalism further muddies the water by advocating for a strong state framework to ensure market competition, which differs from both American progressivism and laissez-faire classical liberalism. Consequently, you cannot draw a clean line where Europe represents pure free-market ideology while America represents state intervention.

  - Bottom line (1-2 sentences): Asking who owns the word misses the point that political labels are tools shaped by usage rather than property with fixed owners. It is more useful to examine specific policies than to argue over who gets to claim the title of liberal.
