answer: |-
  # DECISION PROCEDURE: OPERATIONALIZING THE DUTY OF RESCUE

  ## I. SCOPE AND DISTINCTIONS
  This procedure operationalizes Peter Singer's "Strong Principle" of beneficence: *If it is in our power to prevent something very bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it.*

  **Distinctions Preserved (Must Survive):**
  1.  **Prevention vs. Improvement:** The trigger must be the prevention of severe harm (death, permanent disability, extreme suffering), not merely the improvement of well-being above a baseline.
  2.  **Cost vs. Moral Importance:** The threshold for action is not "zero cost" but "no cost of *comparable moral importance*." Luxury is not morally comparable to life.
  3.  **Agency:** The agent must have causal efficacy. If the money does not change the outcome, the duty does not trigger.

  **Distinctions Dropped (Can Be Simplified):**
  1.  **Proximity:** Physical distance between agent and beneficiary is irrelevant.
  2.  **Uniqueness:** You need not be the *only* person who can help, only one who *can* help.
  3.  **Directness:** Intermediaries (charities) are permissible if causal efficacy is verified.

  **Notation:**
  *   **[FACT]**: Question resolvable by evidence/data.
  *   **[JUDGMENT]**: Question requiring normative valuation; cannot be eliminated.
  *   **[STOP]**: Procedure terminates; no duty generated under this principle.
  *   **[HAND-OFF]**: Procedure pauses for client deliberation on values.

  ---

  ## II. THE PROCEDURE

  **Step 1: Identification of Preventable Harm**
  Is there a specific instance or class of severe harm (e.g., death from preventable disease, starvation, exposure) that will occur without intervention?
  *   *Sufficient Answer:* Yes, verified by credible evidence.
  *   *If No:* **[STOP]**. (This principle does not apply to general philanthropy or arts/culture funding).
  *   *Type:* **[FACT]**

  **Step 2: Verification of Causal Efficacy**
  Will the specific resource allocation you are considering reliably prevent the harm identified in Step 1? (Is the charity effective? Is the timing right?)
  *   *Sufficient Answer:* Yes, with high confidence (e.g., rigorous RCT evidence, direct provision).
  *   *If No:* **[STOP]**. (Inefficacy negates the duty of rescue).
  *   *Type:* **[FACT]**

  **Step 3: Assessment of Cost to Agent**
  What exactly must you sacrifice to make this allocation? (e.g., a vacation, a car, 10% of income, basic security).
  *   *Sufficient Answer:* A concrete description of the loss in utility, comfort, or security.
  *   *Type:* **[FACT]**

  **Step 4: The Comparability Test**
  Is the cost identified in Step 3 of **comparable moral importance** to the harm prevented in Step 1?
  *   *Operational Definition:* A cost is of "comparable moral importance" only if incurring it would cause you or your dependents severe harm, threaten your basic agency, or reduce you to a state of need comparable to those you are helping.
  *   *If Cost is Luxury/Comfort:* The cost is **not** comparable. Duty triggers.
  *   *If Cost is Basic Security/Agency:* The cost **is** comparable. Duty may not trigger.
  *   *Type:* **[JUDGMENT]** **[HAND-OFF]**
  *   *Note:* This is the core normative leap. Facts cannot determine if a vacation matters less than a life. You must accept the premise that survival > luxury.

  **Step 5: The Marginal Utility Boundary**
  If you have already given significantly, does further giving impair your future capacity to earn, advocate, or give?
  *   *Sufficient Answer:* No, my future capacity remains intact. -> **Duty Continues.**
  *   *Sufficient Answer:* Yes, further giving creates burnout or income collapse. -> **[STOP]**. (Preserving future efficacy is of comparable moral importance).
  *   *Type:* **[FACT]** mixed with **[JUDGMENT]**

  **Step 6: Final Determination**
  If Steps 1, 2, and 5 are affirmative/negative as required, and Step 4 judges the cost as *less* important than the harm prevented:
  *   **Outcome:** You ought to make the allocation.
  *   *Type:* **[MANDATE]**

  ---

  ## III. WORKED CASES

  **Case 1: The Vacation vs. The Life**
  *   **Client:** High net worth, gives minimally.
  *   **Scenario:** Can donate $15,000 to a top-tier malaria prevention charity to save a statistical life. Cost equals annual family vacation.
  *   **Run:**
      1.  *Harm:* Death by malaria. **[FACT: Yes]**
      2.  *Efficacy:* Charity is top-rated (e.g., AMF). **[FACT: Yes]**
      3.  *Cost:* Loss of vacation (comfort/leisure). **[FACT: Identified]**
      4.  *Comparability:* Is leisure comparable to life? Under Singer's principle, no. **[JUDGMENT: No]**
      5.  *Margin:* Giving $15k does not impair future earning. **[FACT: Yes]**
  *   **Result:** **Give.** The procedure mandates the donation. The cost is not of comparable moral importance to the harm prevented.

  **Case 2: The High Contributor**
  *   **Client:** Gives 40% of annual income.
  *   **Scenario:** Asks if the principle requires giving 50% or 60%.
  *   **Run:**
      1.  *Harm:* Preventable deaths continue globally. **[FACT: Yes]**
      2.  *Efficacy:* Additional funds would save more lives. **[FACT: Yes]**
      3.  *Cost:* Reduction from 60% disposable income to 50%; or reduction from 40% savings rate to 30%.
      4.  *Comparability:* Does reducing savings/comfort further threaten basic security? **[JUDGMENT]**
      5.  *Margin:* At 40%, the client reports stress affecting work performance. If giving more reduces work performance, future income drops, reducing lifetime giving potential.
  *   **Result:** **Stop at 40% (approx).** Step 5 triggers. If further giving impairs the "golden goose" (income capacity) or mental health to the point of agency loss, that cost becomes of *comparable moral importance* to the lives saved. The procedure does not demand self-destruction, as that ends future rescue capacity.

  **Case 3: The Unliked Answer (The Luxury Ceiling)**
  *   **Client:** Gives 10% of income, lives comfortably but owns multiple luxury assets (second home, high-end cars).
  *   **Scenario:** Asks if 10% is "enough" to satisfy the duty.
  *   **Run:**
      1.  *Harm:* Preventable deaths exist. **[FACT: Yes]**
      2.  *Efficacy:* More money saves more lives. **[FACT: Yes]**
      3.  *Cost:* Selling the second home or downgrading cars.
      4.  *Comparability:* Is owning a second home of comparable moral importance to saving lives? **[JUDGMENT: No]**.
      5.  *Margin:* Selling assets does not impair income capacity.
  *   **Result:** **Give More.** The procedure yields the answer that 10% is insufficient. The client must continue giving until the marginal utility of their wealth drops to the level where keeping it prevents comparable harm to themselves (e.g., reaching a level of modest comfort, not luxury).
  *   **Client Reaction:** Discomfort/Resistance. They view 10% as virtuous; the procedure views it as a baseline floor that ignores available surplus capacity.

  ---

  ## IV. LIMITATIONS AND ETHICAL STATUS

  ### What This Procedure Cannot Do
  1.  **Resolve Conflicting Special Obligations:** The procedure treats all lives equally (impartiality). It cannot adjudicate the tension between saving a stranger abroad versus funding your own child's elite education. This is a clash between *impartial beneficence* and *special duties*, which the procedure resolves in favor of beneficence by design.
  2.  **Solve Coordination Problems:** It tells an individual what *they* should do assuming others' actions are fixed. It cannot determine fair shares if others are free-riding.
  3.  **Define "Comparable Moral Importance" Objectively:** Step 4 remains a value judgment. The procedure forces the question but cannot answer it without the agent accepting the underlying normative premise.

  ### Status in the Ethics Literature

  **Settled Consensus (Among those accepting the premise):**
  1.  **Distance is Irrelevant:** There is broad agreement in contemporary cosmopolitan ethics that physical proximity does not diminish moral obligation (the "distance objection" is largely defeated).
  2.  **Efficacy Matters:** There is consensus that duty is contingent on the ability to actually effect change (the "ought implies can" principle).
  3.  **Severity Threshold:** There is agreement that the duty is strongest regarding severe harm (death/starvation) rather than minor improvements in well-being.

  **Genuinely Contested (Even Among Experts):**
  1.  **The Demandingness Objection:** It is contested whether a moral theory that requires significant lifestyle sacrifice (Case 3) is plausible or self-defeating. Some argue morality must be "reasonable" for human psychology; others (Singer, Kagan) argue morality is demanding regardless of comfort.
  2.  **Negative vs. Positive Duties:** While Singer collapses these, many deontologists and common-sense moralists maintain a strong distinction between *killing* (negative duty) and *letting die* (positive duty). This procedure assumes the collapse; those who reject the collapse will reject the procedure's output in Case 1.
  3.  **The Threshold of "Comparable Importance":** There is no consensus on where the line lies. Is it "marginal utility" (give until you are as poor as those you help) or "comfortable minimum" (give until it hurts significantly)? Singer has moved between these; others (e.g., Pogge) argue for institutional duties rather than individual thresholds. This procedure adopts a hybrid "agency preservation" threshold, which is pragmatic but theoretically debated.
