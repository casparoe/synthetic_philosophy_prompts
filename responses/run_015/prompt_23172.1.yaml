      *   *Physics analogy:* Think of it like a cutoff in renormalization or a physical limit. It makes the integral converge, but does it describe the physical reality?
      *   *Verdict:* It's a practical resolution, not a theoretical one. It explains why *real* casinos don't offer it, but doesn't explain the *rationality* of the decision for a single agent.

