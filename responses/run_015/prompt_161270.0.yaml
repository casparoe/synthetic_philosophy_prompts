answer: |-
  ### Deliberation Notes: The Tension Between Moral Precision and Administrative Reality

  Look, I've spent years arguing about whether "access to advantage" beats "capabilities" in seminar rooms where the stakes were purely intellectual. Now we're in a room where the stakes are permanent bodily changes for real people, and we have a spreadsheet that needs to be filled by Tuesday. The first thing I need to tell you is that the standard philosophical lists are useless here. They assume we can measure anything we can conceive. We can't.

  The core tension I'm seeing immediately is between **Conversion-Rate Sensitivity** (knowing what the boost actually *does* for a specific body) and **Strategic Robustness** ( stopping people from lying about what it does). If the currency measures "expected benefit," everyone claims they need it most. If the currency measures "current resources," we ignore the disabled applicant who needs more to get to the same place.

  I'm also struggling with the **Time-Unit**. Philosophically, lifetime opportunity is the only thing that matters. Administratively, we only have current intake data. Predicting a 22-year-old's life trajectory is actuarial science; predicting an 82-year-old's is easier. If we use lifetime projections, we discriminate against the old. If we use snapshots, we discriminate against the temporarily able who will decline. I don't think there's a clean solution, only a choice of who gets hurt.

  On **Responsibility**: I know the luck egalitarians will scream that we shouldn't reward expensive tastes. But in a public agency context, investigating *why* someone has high needs is humiliating and computationally explosive. It requires judging lives. I'm leaning toward marking responsibility-sensitivity as a "preference" we must sacrifice for the sake of non-humiliation and stability. We can't be judges of character; we have to be allocators of goods.

  Finally, the **Coupled Case** breaks the individualist assumption of almost every currency. If the unit is "the person," we can't measure the dyad. If the unit is "the household," we lose the individual rights framework. This might be the point where the currency concept itself fractures.

  Okay, enough stalling. Here is the spec.

  ---

  ### Specification for the Allocation Currency

  #### 1. Conversion-Rate Sensitivity (The "Same Bundle" Requirement)
  *   **The Case:** The boost's value is not intrinsic; it is relational. $10,000 of medical resource means mobility for one applicant and stagnation for another due to physiological differences. A currency that measures *inputs* (resources, income) fails because it ignores the conversion function between goods and functioning. We must measure the *expected marginal gain* in a specific functioning (e.g., mobility, agency) per unit of boost, not the stock of goods the applicant currently holds.
  *   **Status:** **Non-negotiable.** If we ignore conversion rates, we violate the core purpose of the intervention (permanent improvement). Allocating based on resources when needs differ is effectively random regarding outcomes.
  *   **Conflict:** Directly conflicts with **Strategic Robustness**. If the currency is "expected gain," applicants have every incentive to exaggerate their inability to convert standard resources.

  #### 2. Preference-Independence (The "Sour Grapes" Requirement)
  *   **The Case:** Subjective welfare (reported satisfaction) is adaptive. People in deprived circumstances lower expectations to survive (sour grapes). A currency based on "utility" or "satisfaction" will systematically under-rank the most deprived because they have learned not to want what they cannot have. The currency must track objective functioning or opportunity, not subjective contentment.
  *   **Status:** **Non-negotiable.** Relying on reported satisfaction in a deprivation context is morally blind. It punishes resilience.
  *   **Conflict:** Conflicts with **Observability**. Objective functionings are harder to measure than survey data. It also conflicts with **Responsibility Sensitivity** if the applicant claims their preferences are authentic.

  #### 3. Strategic Robustness (The "Expensive Tastes" Requirement)
  *   **The Case:** The currency must not be manipulable by changes in behavior or reporting post-rule publication. If an applicant can train themselves to appear needier (expensive tastes) or hide capacity, the currency fails to track true disadvantage. The metric must be based on hard, verifiable constraints (diagnoses, structural barriers) rather than self-reported needs or preferences.
  *   **Status:** **Non-negotiable (Administrative).** While luck egalitarians argue this is a moral requirement (don't reward choice), I argue it is a mechanical necessity. A currency that can be gamed collapses into a lottery.
  *   **Conflict:** Conflicts with **Conversion-Rate Sensitivity**. The most accurate measure of conversion (deep personal knowledge) is the easiest to fake. We likely have to sacrifice some precision here to maintain integrity.

  #### 4. Temporal Stability (The "Time-Unit" Requirement)
  *   **The Case:** We must define the window over which disadvantage is measured. Is it current status? Remaining lifetime? Past lifetime? Given the boost is permanent, the currency should reflect the *duration* of the benefit. However, measuring "lifetime opportunity" for a 22-year-old vs. an 82-year-old introduces age discrimination. A short bad life (died at 30) vs. a long bad life creates a summation problem.
  *   **Status:** **Preference (Sectarian).** This is where we must choose a theory. Luck egalitarians prefer lifetime opportunity. Sufficientarians prefer current status relative to a floor. I recommend **Current Status + Expected Duration of Benefit**. We cannot judge past lives (too invasive), and we cannot perfectly predict futures. We measure the *current* gap and the *expected permanence* of the fix.
  *   **Conflict:** Conflicts with **Fairness Across Ages**. Any choice here disadvantages either the young (uncertain future) or the old (less time to benefit).

  #### 5. Unit Separability (The "Coupled Case" Requirement)
  *   **The Case:** The currency assumes a bearer. Standard views assume the individual. In the coupled case (physiologically linked applicants), the benefit spills over. If the currency is per-person, we double-count or misallocate. The currency must be definable over the *unit of intervention*. If the boost affects two people, the currency must measure the dyad's advantage, not the individual's.
  *   **Status:** **Non-negotiable.** If the currency cannot accommodate the unit of effect, the allocation rule will be mathematically incoherent.
  *   **Conflict:** Conflicts with **Individual Rights/Privacy**. Measuring a dyad requires sharing data between linked parties who may not consent to shared assessment. It also breaks standard egalitarian frameworks which are methodologically individualist.

  #### 6. Observability & Non-Humiliation (The "Practical Constraint" Requirement)
  *   **The Case:** The currency must be computable from intake data without invasive audits or demanding disclosures that shame the applicant (e.g., proving inability to perform basic bodily functions). If the currency requires proving "I am broken," it imposes a dignity cost that subtracts from the advantage gained.
  *   **Status:** **Non-negotiable.** Administrability is not just "grubby"; it is constitutive of justice in a public system. A right you cannot claim without humiliation is not a right.
  *   **Conflict:** Conflicts with **Conversion-Rate Sensitivity** and **Responsibility Sensitivity**. The most morally precise metrics require the most invasive data. We must drop precision to save dignity.

  #### 7. Ex Ante Consistency (The "Risk" Requirement)
  *   **The Case:** We must rank before knowing the outcome. The currency must measure *expected* advantage, not realized advantage. If we measure ex post, we punish bad luck in the treatment response. If we measure ex ante, we accept that some allocations will "waste" the boost due to biological variance.
  *   **Status:** **Non-negotiable.** We cannot allocate based on information we do not have. The currency must be a probability-weighted expectation.
  *   **Conflict:** Conflicts with **Ex Post Fairness**. Some people will get the boost and gain nothing. The currency cannot account for this without becoming a insurance scheme rather than an allocation metric.

  #### 8. Responsibility Insensitivity (The "Anti-Judgment" Requirement)
  *   **The Case:** Should the currency discount advantage if the disadvantage was self-inflicted (expensive tastes, risky behavior)? Philosophically, luck egalitarians say yes. Practically, determining causality is impossible without intrusive investigation into personal history. Furthermore, ranking people by "moral worthiness" is demeaning.
  *   **Status:** **Preference (To be dropped).** I argue we must drop sensitivity to responsibility. The cost of distinguishing brute luck from option luck is too high in privacy and dignity. We treat all unchosen disadvantages as equivalent.
  *   **Conflict:** Conflicts with **Intuition about Fairness**. It feels unfair to reward someone who broke their own leg over someone born with brittle bones. But the mechanism cannot sustain the distinction.

  ---

  ### Incompatibilities: The Trilemma of Allocation

  You need to know that you cannot have all of these. Specifically, there is a trilemma between **Conversion-Rate Sensitivity**, **Strategic Robustness**, and **Observability (Non-Humiliation)**.

  1.  **If you maximize Conversion-Rate Sensitivity** (measure exactly what the boost does for each body), you require deep physiological and contextual data. This violates **Observability** (invasive audits) and opens the door to gaming, violating **Strategic Robustness**.
  2.  **If you maximize Strategic Robustness** (use hard, unchangeable metrics like age or diagnosis codes), you lose nuance. Two people with the same diagnosis have different conversion rates. You violate **Conversion-Rate Sensitivity**.
  3.  **If you maximize Observability** (use simple self-reports or income data), you invite gaming (**Strategic Robustness** fails) and miss physiological differences (**Conversion-Rate Sensitivity** fails).

  **Which to drop?**
  You must drop **Conversion-Rate Sensitivity** at the margins. You cannot perfectly measure individual conversion rates without creating a surveillance state. You must accept a "rough justice" metric—likely based on broad categories of need (diagnosis groups) rather than individualized expected benefit. This means some inefficiency: some boosts will work better than others. But it preserves **Strategic Robustness** and **Observability**.

  **Secondary Conflict: Unit Separability vs. Individualism.**
  The **Coupled Case** breaks the list. If you have linked physiologies, an individual currency is wrong. But creating a dyadic currency sets a precedent that undermines individual autonomy for everyone else.
  *Cost of dropping Unit Separability:* You misallocate resources in coupled cases (treating one when both need it, or vice versa).
  *Cost of keeping it:* You create a complex, exception-based system that threatens **Stability** (intake officers won't know how to score dyads).
  *Recommendation:* Treat the dyad as a single unit for scoring purposes only. This preserves the currency structure but requires a rule-change on who gets the physical intervention.

  ---

  ### Argued Positions on Specific Debates

  *   **Responsibility vs. Luck:** This is a sectarian taste of luck egalitarianism, not a genuine requirement for a public agency. Distinguishing them requires moral judgment we are not authorized to make. **Drop it.**
  *   **No-Envy:** This belongs to the *rule*, not the *currency*. The currency just measures the magnitude. Whether someone envies another's bundle is a function of the allocation rule (e.g., Vickrey auctions vs. priority scores). Do not build envy-freeness into the metric itself; it complicates measurability.
  *   **Equality vs. Triage:** The currency must be the same regardless of supply. If you change the metric because supply is low, you change the definition of justice based on budget. That is corrupt. However, the *rule* changes (from "equalize" to "prioritize worst off"). The currency stays constant.
  *   **Demeaning Rankings:** Yes, the metric must avoid ranking whole lives as "better/worse." It should rank *gaps* or *deficits*, not total worth. A "priority score" is less demeaning than a "quality of life score."
  *   **Administrability:** This is not a concession; it is a requirement. A right that cannot be administered is a promise we cannot keep. If the currency requires 40,000 home visits, it is not a valid currency for this job.

  ---

  ### Scorecard of Standard Views

  | View | Conversion Sensitivity | Strategic Robustness | Non-Humiliation | Time-Unit Handling | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Resources / Primary Goods** | Fail (Ignores bodies) | Pass (Easy to measure) | Pass (Objective) | Fail (Ignores lifespan) | **Rejected.** Too blunt for heterogeneous boost. |
  | **Welfare / Opportunity for Welfare** | Pass (Theoretically) | Fail (Easy to game) | Fail (Sour grapes/Humiliation) | Pass (Can sum lifetime) | **Rejected.** Unmeasurable and manipulable. |
  | **Capabilities / Functionings** | Pass (Focus on doing) | Mixed (Hard to verify) | Mixed (Can be invasive) | Mixed (Hard to project) | **Contender.** Best fit, needs simplification. |
  | **Luck-Adjusted (Access to Adv.)** | Pass | Fail (Requires history) | Fail (Judgmental) | Pass | **Rejected.** Responsibility tracking is too costly. |
  | **Relational / Non-Domination** | Mixed | Pass | Pass | Pass | **Contender.** Good for dignity, vague on metric. |
  | **Sufficientarianism** | Pass (Focus on floor) | Pass (Binary measure) | Pass | Pass (Current status) | **Strong Contender.** Fits triage context best. |

  ### The Knockout Requirement

  **Observability & Non-Humiliation.**

  This is the single requirement that does the most work in knocking candidates out. It eliminates Welfare (too subjective/invasive to verify), eliminates strict Luck Egalitarianism (requires intrusive history checks), and severely constrains Capabilities (must be measurable without shame). It forces us toward a **Sufficientarian Capabilities** hybrid: measurable functionings (can you walk? can you work?) checked against a threshold, without asking *why* you can't. It sacrifices the philosophical precision of "why are you off the floor?" for the moral necessity of "how do we get you on the floor without stripping you bare?"
