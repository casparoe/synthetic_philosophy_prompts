prompt: |-
  I'm a graduate student in a philosophy of biology seminar that has just worked through the standard unit-of-selection literature—gene-centered views, multi-level selection frameworks, and the familiar statistical-versus-causal distinction. The textbooks present the debate as largely resolved by hierarchical modeling, but I'm struck by applied domains where evolutionary individuation remains conceptually murky: microbiome medicine, where it's unclear whether selection targets the host genome, the microbial consortium, or an integrated metabolic network; synthetic ecosystem design, where engineers construct reproducing functional groups that don't map cleanly onto organisms; and evolutionary conservation, where policymakers must decide whether to preserve genetic diversity, population structure, or ecosystem-level functional roles. These aren't merely applications; they expose unresolved questions about what counts as a reproducer, how functional integration relates to evolutionary fate, and whether explanations at one level possess autonomous causal power.

  Assume a researcher has about three to four years, strong conceptual-analytic skills, and minimal wet-lab training. Which open conceptual problems within the units-of-selection debate deserve priority? Provide a defended agenda, not a survey: rank the two or three questions that are both tractable for a philosopher and upstream of these applied domains. For each, explain its dependency relations—what other conceptual issues must be settled first, and what downstream work it enables—together with the criteria you use to rank importance, tractability, and neglect. Specify what kind of conceptual or empirical result over the next few years would cause you to reorder the ranking. Do not provide a bibliography, reading list, or citation targets; I need reasoning about where limited effort should go and why.

  End with the prioritized agenda in fixed form: \answer{1. [brief label of top question]; 2. [brief label of second]; 3. [brief label of third]}
