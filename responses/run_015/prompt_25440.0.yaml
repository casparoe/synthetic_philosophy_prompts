answer: |-
  ### The Thought Experiment: "The Pile of Dishes"

  **The Scenario**
  Sam and Casey are roommates and close friends. Casey has recently returned to work after a severe, six-month depressive episode. Part of Casey's recovery plan, developed with a therapist, involves rebuilding a sense of agency and competence through small, manageable domestic tasks. Casey has been struggling to keep up, and there is a visible pile of dishes in the sink that has been there for two days. It is causing Casey visible stress, but Casey has explicitly set an intention to wash them tonight as a "win."

  Sam comes home early, sees the dishes, and sees that Casey is out at a support group. Sam could wash the dishes in 15 minutes. It would be effortless for Sam and would restore the kitchen to order.

  **The Generalist's Principle: The Duty of Effortless Aid**
  *"If you are in a position to easily alleviate a burden for someone you care about, and the cost to you is negligible, you ought to do so. Waiting to be asked introduces unnecessary friction into caring relationships."*

  This is not a rigid rule like "never let dishes sit." It is a reflective principle about communal living and care. It values attentiveness and the reduction of unnecessary suffering. A reasonable person would endorse this as a general guide for friendship and cohabitation.

  **The Particularist's Stance**
  The particularist argues that moral reasons are holistic. A feature that counts in favor of an action in one context can count against it in another. They argue that Sam should *not* wash the dishes, despite the ease of doing so.

  ---

  ### 1. The Verdicts and Reasoning

  **The Generalist Verdict: Wash the Dishes**
  The generalist applies the *Duty of Effortless Aid*.
  *   **Reasoning:** There is a burden (the mess). Casey is stressed by it. Sam can remove it at low cost. To wait for Casey to ask is to prioritize a abstract notion of "autonomy" over concrete relief. If Sam follows the rule, the kitchen is clean, Casey's stress is reduced, and the household functions better. The generalist might acknowledge that Casey *might* have wanted to do it, but the principle dictates that the *need* trumps the *preference* unless explicitly stated otherwise. The rule is designed to prevent the "why didn't you help?" resentment that often plagues shared living.

  **The Particularist Verdict: Do Not Wash the Dishes**
  The particularist looks at the *meaning* of the act in this specific context.
  *   **Reasoning:** In most contexts, washing a roommate's dishes is an act of care. But here, the "burden" is not just dirt; it is a therapeutic tool. By removing the obstacle, Sam is not alleviating suffering; Sam is undermining Casey's recovery strategy. The particularist notes that the feature "it is easy for Sam to do" normally generates a reason to act. However, in *this* context, the ease of the action is precisely what makes it dangerous—it makes it too tempting to override Casey's agency. The act transforms from "help" to "infantilization."

  ### 2. The Key Structural Feature: "The Ease of Assistance"

  The disagreement turns on the moral valence of **the ease with which Sam can solve the problem.**

  *   **Standard Valence:** In 95% of situations, the fact that a task is *easy for me* but *hard for you* is a decisive reason **for** doing it. (e.g., carrying a heavy box for an elderly neighbor).
  *   **Switched Valence:** In this specific context, the fact that the task is *easy for me* becomes a reason **against** doing it. Because it is so easy, doing it robs Casey of the specific struggle that is currently morally/psychologically valuable.

  The generalist treats "ease of assistance" as an invariant reason—it always adds weight to the "act" side of the scale. The particularist argues that "ease" interacts with "recovery context" to flip the sign: ease makes the intervention *more* intrusive, not less.

  ### 3. The Counter-Attack: How the Generalist Defends the Rule

  If we accept the intuition that Sam should *not* wash the dishes (meaning the Generalist gets the "wrong" answer here), a sophisticated generalist would attack the case as rigged. Their counter-argument would look like this:

  *"You haven't proven that rules fail; you've only proven that your statement of the rule was too simple. A reflective generalist doesn't follow 'Always help if it's easy.' They follow 'Always help if it's easy, **unless doing so undermines the other's legitimate projects.**'*

  *Once I add that exception, my rule gets the right answer. The particularist claims that I need to judge the situation without rules, but I am simply applying a more nuanced rule. The feature 'undermines agency' is just another principle to be weighed against 'effortless aid.' You are mistaking the complexity of the rule-set for the absence of rules."*

  **The Particularist's Rebuttal to the Counter-Attack:**
  The particularist would respond that adding the exception ("unless it undermines agency") renders the rule useless as a guide. To know *when* agency is undermined, you need the very particular judgment the rule was supposed to replace. If you have to judge the context to know which rule applies, the rule isn't doing the work; your judgment is. The rule is just a summary of past judgments, not a engine for new ones.

  ### 4. Flipping the Feature: What Happens if We Change the Context?

  To test the stability of this disagreement, let's **remove the key feature** (the recovery context) and replace it with a standard context.

  **The Flip:** Casey is not depressed. Casey is just lazy and has been playing video games for 48 hours while the dishes pile up. Sam is tired but capable.

  *   **Generalist:** "Wash the dishes. The Duty of Effortless Aid applies. Casey is failing their household duty; you should pick up the slack to maintain harmony."
  *   **Particularist:** "Wash the dishes."

  **Convergence:**
  In this flipped scenario, the two views **converge**. The feature "ease of assistance" returns to its standard positive valence. Because the context of "therapeutic agency" is removed, the act of washing the dishes reverts to being a standard act of care (or perhaps enabling, but generally seen as positive household maintenance).

  **Why this matters:**
  This convergence proves that the disagreement isn't about the *act* (washing dishes) or the *rule* (helping friends). It is entirely about the **holistic interaction of features.** The particularist can point to this convergence and say, "See? I'm not against helping. I'm against the idea that 'ease' has a fixed moral weight." The generalist, however, must explain why their rule didn't need to change, only its application.

  If you **flip the feature to the extreme** (Casey is physically unable to wash dishes due to a broken arm):
  *   **Generalist:** "Definitely wash them."
  *   **Particularist:** "Definitely wash them."
  *   **Result:** They agree again.

  This shows that the Particularist isn't a relativist; they agree with the Generalist in standard cases. The divergence *only* occurs in the "valence-switch" zone, which is exactly where moral reasoning is hardest. The thought experiment suggests that if morality relies on rules, those rules must be so sensitive to context that they look suspiciously like particular judgments in disguise.
