prompt: |-
  I've been trying to think through something about morality on my own, and I've hit a point where I need a carefully built example to test my thinking. I don't have any formal training in philosophy, so forgive me if I get the terminology wrong.

  The question is whether moral reasoning needs rules. On one side, there's the view that you can't do morality without principles — general rules that tell you what to do across situations. On the other side, there's the view (I've seen it called "particularism") that moral reasons are so sensitive to context that no finite set of rules can capture them, and you have to judge each situation on its own terms.

  I want you to construct a thought experiment where these two approaches come apart — where a reasonable generalist and a reasonable particularist would disagree about what someone should do. Here are the specifications:

  1. The scenario must be ordinary. A workplace disagreement, a family decision, a friendship problem — something a person might actually face. No trolleys, no life-or-death stakes, no science fiction.

  2. The generalist's rule must be genuinely good. Not "never lie" or "always keep your promises" without nuance — a principle that a reflective person would stand behind. If the generalist gets the wrong answer, it shouldn't be because you gave them a stupid rule.

  3. The particularist's reasoning must also be genuinely appealing. Not just "it depends" as a reflex — a careful attention to features of the situation that really do seem to change what matters.

  4. The disagreement should be driven by a specific structural feature of the case — ideally, a feature that normally has one moral valence but in this context seems to have a different one, so that the particularist can say "this feature doesn't count the way it usually does" while the generalist's rule treats it as having a fixed weight.

  After you present the scenario, I need you to:

  - State what each view says should be done and walk through the reasoning.
  - Identify exactly which feature of the case is doing the work to separate the two views.
  - Explain how a defender of the view that (in your judgment) comes out worse would attack the case. What would they say is rigged or unfair about it?
  - Tell me what happens if you remove or flip that key feature: do the two views converge, or does a new disagreement open up somewhere else?
