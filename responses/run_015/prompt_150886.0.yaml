  2.  **Deconstruct the Physics Case (The "Verdict"):**
      *   *Cabin A (Free Fall/Inertial):* Effective gravity ($g_{eff}$) is zero. Buoyancy depends on a pressure gradient caused by gravity (or acceleration). Without $g$, there is no pressure gradient in the fluid. The helium balloon has mass, but so does the displaced air. In free fall, everything falls together. There is no "up" or "down".
          *   *Prediction:* The balloon stays put (relative to the air/cabin).
