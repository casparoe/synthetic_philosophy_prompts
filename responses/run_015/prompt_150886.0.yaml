      *   *Cabin B (Rotating/Non-Inertial):* Effective gravity ($g_{eff}$) is centrifugal acceleration ($\omega^2 r$), pointing *outward*. This creates a pressure gradient in the air (higher pressure at the wall, lower at the center). Buoyancy acts opposite to the effective gravity vector.
          *   *Prediction:* The balloon moves *inward* (toward the axis of rotation).
          *   *Force:* Buoyant force (pressure gradient force) exceeds the "centrifugal force" on the helium mass because helium is less dense than air. The net force is centripetal (provided by the pressure gradient).
      *   *Why this matters:* This is a classic application of the Equivalence Principle and fluid dynamics in non-inertial frames. It's counter-intuitive to some (who might think centrifugal force throws everything out), but standard physics.

  3.  **Address Follow-up 1: Falsification & Checkability:**
