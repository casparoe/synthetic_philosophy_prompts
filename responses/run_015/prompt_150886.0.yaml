      *   **Section 2: The Argument View vs. Imagination:**
          *   Norton's challenge: It's just an argument.
          *   Counter: It's not *just* an argument. It's a *simulation* of the theory. The "knowledge" gained is the recognition of how distinct principles (Equivalence + Hydrostatics) interact. This is "understanding," which is a form of knowledge. The TE makes the implicit explicit. I will defend a moderate Platonist/Realist view: the TE accesses the modal structure of the physical world via the theory.
      *   **Section 3: The Unrunnable:**
          *   Instructor's point: Unrunnable are best.
