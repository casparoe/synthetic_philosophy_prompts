  hey, I'm putting together the quiz our debate club hands out at freshman orientation and I want something better than the usual left/right line everyone just screenshots. Can you build me a decision tree with about six yes/no questions (so up to a dozen leaves, fewer is fine) where every question is a concrete claim a person could agree or disagree with without knowing which label it leads to — like whether a company should be able to fire someone for a tweet, whether being born poor in a rich country means you've been wronged, whether an old tradition has to justify itself or the other way around, whether breaking up a big company is a good idea. Then drop the actual positions into the tree — mainstream left, mainstream right, libertarian, national-populist, green, the boring centrist-managerial one, whatever else you think belongs — and for the combinations of answers nobody actually occupies, say why the cell is empty: incoherent, unattractive, or just unexplored. The part I actually care about is my friend's theory that the real split isn't economics vs. culture but whether you think society is a machine that can be fixed with the right policy vs. an order you have to be careful not to break, and I want the tree to show how that cuts across normal left and right instead of just lining up with it. Also flag any two leaves your questions can't really tell apart, and keep the wording at a level where a 14-year-old gets it without a vocab lesson.
