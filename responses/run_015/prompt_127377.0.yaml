  Right, here's the thing: fitting all those distinctions (mechanism, penetration, domain, inner speech) into a 7-node tree without it becoming a tangled mess is tight. To make it work, I've had to fuse "mechanism" and "penetration" into one branch on the 'Linger' side. It's a bit rough—grammar *can* be modular—but it keeps the node count honest.

  Here's your decision tree.

  ### The Linguistic Relativity Sorter

  **Node 1: The Colour Training Case**
  You train someone in an artificial language that splits the colour spectrum differently, then test them in silent visual matching with no speaking allowed. Does their discrimination shift disappear immediately, or does it linger?
  *   **Disappear** → Go to Node 5
  *   **Linger** → Go to Node 2

  **Node 2: The Mechanism/Scope Split**
  If it lingers, is the change driven by obligatory grammar rewiring central thought, or just lexical labels tuning perceptual modules?
  *   **Grammar/Central** → **Leaf 1**
  *   **Lexicon/Perceptual** → **Leaf 2**

  **Node 5: The Inner Speech Check**
  If the effect disappeared, did they need to actively rehearse words (inner speech) to perform the task when language *was* allowed?
  *   **Yes, needed rehearsal** → **Leaf 3**
  *   **No, even then it's universal** → **Leaf 4**

  ---

  ### The Leaves

  **Leaf 1: Deep Neo-Whorfian**
  *   **Awkward Commitment:** You have to claim that learning a new tense system literally changes how you remember past events, not just how you describe them.

  **Leaf 2: Perceptual Relativist (Modular Encapsulationist)**
  *   **Awkward Commitment:** You must argue colour categories are biologically arbitrary but cognitively real once labelled, yet somehow don't affect abstract reasoning.

  **Leaf 3: Thinking-for-Speaking Pragmatist**
  *   **Awkward Commitment:** You're stuck saying thought is universal, but the act of packaging it for output is so language-specific it looks like relativity during online tasks.

  **Leaf 4: Hard Universalist**
  *   **Awkward Commitment:** You must argue that even years of linguistic training leave zero trace on non-verbal cognition; language is just noise on the hardware.

  ---

  ### Notes on the Tree's Blind Spots

  **Unseparable Pair:** **Leaf 1 (Deep Neo-Whorfian)** and **Leaf 3 (Pragmatist)**.
  In practice, these look identical in most experiments. If someone performs differently only when language is active, is it because language *changed* their cognition (Leaf 1) or because they're just using language as a tool (Leaf 3)? Your tree forces a split at Node 1 (Linger vs. Disappear), but a Deep Neo-Whorfian might admit effects fade without reinforcement, blurring the line with the Pragmatist.

  **Empty Combination:** **Lexicon + Central Cognition**.
  Nobody really holds the view that *lexical* labels (just having a word) restructure *central abstract thought* (like morality or time) without grammatical forcing. It's not incoherent, just unexplored—most philosophers assume grammar does the heavy lifting for abstract domains, while lexicon stays stuck on concrete stuff like colour.

  **Muddled Premise Warning:**
  Fusing Mechanism and Penetration at Node 2 is a compromise to hit your 7-node limit. In the wild, you *could* have obligatory grammar that stays encapsulated (Modular Relativist) or lexical availability that penetrates central cognition. If a student insists on that distinction, this tree will force them into a box that doesn't quite fit. Also, the "Inner Speech" branch assumes we can reliably detect inner rehearsal, which is notoriously hard to measure without self-report.

  Hope this saves you from the usual "Strong vs Weak" bore. Cheers.
