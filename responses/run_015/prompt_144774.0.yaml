      *   *Idea 5: Market-Selected Artifact.* A tool that survives because it works, not because it was designed to work *that specific way*.
      *   *Idea 6: The "Survivor" Sensor.* A sensor in a harsh environment (like a subway turnstile) that gets replaced often. One specific type of circuit board survives longer because it happens to react to humidity (Target $T$) by locking up, which prevents short circuits during rain (Success). Wait, that's negative.
      *   *Idea 7: The "Coin-Op" Evolution.* A fleet of cheap parking meters. They are bought off the shelf. Some last longer. Why? Because a specific capacitor degrades in a way that makes the meter reject slugs (Target $T$) more often, saving the city money, so those meters are kept in service while others are scrapped.
      *   *Refining Idea 7:* Let's go with a **Supermarket Bottle Return** or **Recycling Depot**.
      *   *Target Property ($T$):* Presence of aluminum tabs (pop tabs) vs. whole cans.
