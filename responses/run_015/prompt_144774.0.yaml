      *   *Critique:* Is "reducing errors" too close to intention? The managers intend to save money, not to track tabs specifically via that voltage.
      *   *Better Idea:* **Transit Fare Gate (Turnstile).**
      *   *Target ($T$):* "Tailgating" (two people passing on one fare).
      *   *System:* An optical beam sensor array.
      *   *State ($S$):* A specific timing lag in the circuit reset.
      *   *Blind Process:* The transit authority buys bulk generic sensors. Due to a manufacturing batch variance, some sensors have a slight reset lag. Coincidentally, this lag makes the gate lock out precisely when two people try to squeeze through, whereas the "perfect" sensors let the second person through. The authority keeps the "laggy" batches because they reduce fare evasion revenue loss. They don't know it's the lag; they just know those batches save money.
      *   *Critique:* Still feels like the authority intends fare evasion prevention.
      *   *Better Idea:* **Laundromat Change Machine.**
      *   *Target ($T$):* Washed vs. Unwashed coins (corrosion level).
      *   *System:* A cheap optical reflectivity sensor.
      *   *State ($S$):* Sensitivity to dullness.
      *   *Blind Process:* The machine accepts coins to give tokens. Machines in humid laundromats fail. The ones that survive are the ones that happen to reject highly corroded coins (which jam the mechanism). The owner just replaces machines that jam. He doesn't intend to track corrosion; he intends to avoid jams. The surviving machines effectively "detect" corrosion.
