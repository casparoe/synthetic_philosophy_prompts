      *   **Searle:** Original intentionality requires biological causation (brains/neurobiology). Artifacts only have derived intentionality (imposed by users/designers). If no one is using/interpreting the artifact, it has *no* intentionality.
      *   **Dennett:** Intentionality is a matter of predictive utility (Intentional Stance) or evolutionary history (Design Stance/selection). If a system's internal state reliably tracks a feature due to selection pressure (even blind), it has genuine content. The origin doesn't need to be a conscious mind; it needs to be a history of selection for success.

  3.  **Brainstorming Scenarios:**
