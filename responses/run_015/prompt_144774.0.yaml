          3.  *Verdicts:* Searle = Derived/None. Dennett = Genuine/Original-like (not derived from designer). Derive these from their theories, don't stipulate.
          4.  *Demonstration:* Walk through the application of both theories. Isolate the critical feature (blind provenance). Show what happens if design is intentional or if a human starts using it.
          5.  *Purpose & Reply:* Explain the philosophical point. Present a Searlean counter-argument. Assess if it begs the question.

