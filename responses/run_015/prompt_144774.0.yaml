      *Self-Correction on Searle:* Searle argues that without a current interpreter, artifacts have *no* intentionality (not even derived). Derived intentionality exists only when someone uses the symbol. So, for the abandoned machine, Searle says *zero* intentionality. Dennett says *genuine* content. This creates the sharpest conflict.

