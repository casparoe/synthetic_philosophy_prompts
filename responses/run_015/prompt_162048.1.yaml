answer: |-
  ### The Spec: Desiderata for Symbol-Level Causation

  Here are the requirements your theory must meet to satisfy the plot constraints and the philosophical stakes. They are divided into **Non-Negotiables** (constraints imposed by the setting and physics) and **Contested Stakes** (where the Engineer and Neuroscientist actually fight).

  #### I. Non-Negotiables (The Physics & Logic)
  *These must be true for the story to hold together without breaking the reader's trust in the setting.*

  1.  **Micro-Causal Closure**
      *   **Requirement:** Every physical event in the substrate must have a sufficient physical cause. No energy or information enters the system from the "symbol level" that isn't already present in the magnetic symms.
      *   **Case:** The Physicist cannot be embarrassed. If Ines moves her arm, the motor neurons fired because ions moved, not because a "belief" injected force.
      *   **Status:** **Non-Negotiable.**

  2.  **Non-Trivial Implementation (The Blinking Wall Constraint)**
      *   **Requirement:** The theory must provide a principled reason why the blinking wall is *not* a mind, even if a clever mapping can be constructed between its flashes and Ines's thoughts. Not every physical system implements every computation.
      *   **Case:** The Enthusiast's claim must be falsifiable. If "anything implements anything," Ines is not special, and the tragedy of her reconstruction is meaningless.
      *   **Status:** **Non-Negotiable.**

  3.  **Counterfactual Support (The Lawyer's Constraint)**
      *   **Requirement:** Statements like "If she had believed the bridge was safe, she would have driven" must have truth conditions that are not exhausted by the actual micro-history.
      *   **Case:** The Inquest. The microphysics was fixed; she *did* believe it was unsafe. For the lawyer's question to make sense, the belief must be a variable that *could* have been different independently of the specific atomic arrangement that actually occurred.
      *   **Status:** **Non-Negotiable.**

  #### II. Contested Stakes (The Dramatic Conflict)
  *These are the requirements the characters disagree on. A theory must pick a side, or explain why the disagreement is verbal.*

  4.  **Substrate Neutrality (The Cipher & Timesharing Constraint)**
      *   **Requirement:** The identity of a symbol (e.g., "Danger") must not depend on the specific physical shape of the symmball, but on its relational role.
      *   **Case:** **The Cipher:** If you relabel the mapping and her behavior stays the same, the theory must explain whether her *beliefs* changed. (Engineer says no; Neuroscientist says yes). **Timesharing:** One physical event serves two different symbolic roles for two different minds.
      *   **Status:** **Contested.** (Engineer needs this to be true; Neuroscientist wants it to fail).

  5.  **Interventional Asymmetry (The Code-Level Constraint)**
      *   **Requirement:** Tweaking the system at the symbol level (editing "risk-aversion") must produce stable, predictable changes that tweaking random symms does not, even if the physical causation is identical.
      *   **Case:** The Engineer's daily work. If changing the "code" is physically identical to scrambling noise, but only the code edit fixes her behavior, the symbol level has explanatory privilege.
      *   **Status:** **Contested.** (Engineer says this proves efficacy; Neuroscientist says it proves nothing about ontology).

  6.  **Explanatory Indispensability (The "I Promised" Constraint)**
      *   **Requirement:** The explanation "She did it because she promised" must be causally relevant, not just a shorthand for "symms shoved symms."
      *   **Case:** The final line. If "I promised" is just a story we tell about symms, Ines has no agency. If it is real, the symbol level is doing work.
      *   **Status:** **Contested.** (This is the heart of the novel's theme).

  7.  **Efficacy vs. Prediction Distinction**
      *   **Requirement:** The theory must distinguish between "The symbol level *tracks* the physical causes" and "The symbol level *constitutes* the causes."
      *   **Case:** Preventing the Engineer from winning by definition. If "pushing" just means "predicting," the Neuroscientist wins by default.
      *   **Status:** **Non-Negotiable** (for the argument to exist).

  ---

  ### The Internal Conflict: The Impossible Triangle

  You asked where the list fights itself. Here is the hard truth: **You cannot satisfy Micro-Causal Closure, Substrate Neutrality, and Distinct Symbol Efficacy simultaneously.**

  1.  **If Micro-Closure is true** (Physics is complete), then the physical state fully determines the future.
  2.  **If Substrate Neutrality is true** (The Cipher/Timesharing scenes), then the *same* physical state could support *different* symbols (or the same symbols could be made of *different* physics).
  3.  **If Distinct Symbol Efficacy is true** (The Engineer is right, symbols *push*), then the symbols must be doing something the physics isn't already doing.

  **The Trade-off:**
  *   **Option A (Engineer Wins):** You keep **Symbol Efficacy** and **Substrate Neutrality**. You must sacrifice **Micro-Causal Closure**. *Cost:* You introduce magic physics. The symms move because of "meaning," which violates conservation laws. The Physicist is embarrassed.
  *   **Option B (Neuroscientist Wins):** You keep **Micro-Causal Closure** and **Substrate Neutrality**. You must sacrifice **Symbol Efficacy**. *Cost:* Symbols are epiphenomenal. They float on top of the physics like a shadow. Ines doesn't keep promises; her symms clump. The "I Promised" line is a lie.
  *   **Option C (Reductionist Compromise):** You keep **Micro-Causal Closure** and **Symbol Efficacy**. You must sacrifice **Substrate Neutrality**. *Cost:* The Cipher scene breaks. If you relabel the mapping, you *have* changed her mind, because the mind is identical to *that specific* physical pattern. Timesharing becomes impossible (one physical state cannot be two minds).

  **This is the shape of your argument.** The Engineer wants Option A (but claims it's Option C). The Neuroscientist wants Option B. The Truth is likely a painful version of Option C that feels like Option B.

  ---

  ### The Killer Requirement

  The single requirement that knocks out the most candidate answers is:
  **Counterfactual Support under Fixed Microphysics (The Lawyer's Constraint).**

  **Why:** It demands that high-level variables (Beliefs) track causal dependencies that low-level variables (Symms) obscure.
  *   It kills **Strict Reductionism**: If the belief *just is* the symms, and the symms were fixed, the "If she had believed..." counterfactual is false or trivial.
  *   It kills **Epiphenomenalism**: If beliefs don't cause actions, the counterfactual "If she believed X, she would do Y" is false.
  *   It kills **Simple Emergence**: If emergence implies new forces, it violates Closure.

  To satisfy this, a theory must argue that causation is not just about energy transfer (micro), but about *dependency relationships* (macro) that remain stable across different micro-realizations. This is the hardest bar to clear.

  ---

  ### The Scorecard: How the Contenders Fail

  Here is how the standard philosophical positions score against your specific scenes.

  **1. Epiphenomenalism (The Neuroscientist's Default)**
  *   **Verdict:** Fails the "I Promised" scene.
  *   **Why:** Saves Micro-Closure and Non-Triviality easily. But it makes the symbols causally inert. Ines's promise didn't make her act; the symms did. The Engineer is deluded. Good for tragedy, bad for agency.

  **2. Token-Identity / Reductionism (The Physicist's Comfort)**
  *   **Verdict:** Fails the Cipher and Timesharing scenes.
  *   **Why:** Says "Mental State M = Physical State P." If you relabel the cipher, P stays the same, so M must stay the same. But the mapping changed, so the *meaning* changed. If meaning changed but M didn't, M isn't meaning. Also struggles with Timesharing (one P cannot be two different Ms).

  **3. Interventionist / Autonomy-Based (The Engineer's Hope)**
  *   **Verdict:** Passes most, risks collapsing into Prediction.
  *   **Why:** Defines causation by "what happens if I wiggle this?" Works great for the Intervention Asymmetry scene. Fails if it can't distinguish between "wiggling the symbol" and "wiggling the symms that make the symbol." Needs to prove the symbol level has its own "wiggles" without violating Closure.

  **4. Real-Patterns / Stance-Based (The Pragmatist)**
  *   **Verdict:** Passes the "I Promised" scene, makes Reality fuzzy.
  *   **Why:** Says symbols are "real" like a hurricane is real—a pattern in the noise, not a separate object. Handles the Blinking Wall (no pattern there). Handles the Promise (pattern is robust). But the Neuroscientist will argue patterns don't *push*, they just *are*.

  **5. Mechanistic Account of Computation (The Hardware View)**
  *   **Verdict:** Fails the Prosthesis and Cipher scenes.
  *   **Why:** Focuses on the physical mechanism of computation. If you swap the substrate (Prosthesis), is it the same mechanism? If you relabel the cipher, the mechanism is processing different inputs. Struggles to explain why Ines feels like the same person if the mechanism's "logic" is mapped differently.

  **6. Straight Emergent Downward Causation (The Magic View)**
  *   **Verdict:** Fails Micro-Causal Closure.
  *   **Why:** Says the symbol level exerts force on the symms. Directly violates the "no new forces" constraint. The Physicist will tear this apart in Chapter 1. Only works if you are willing to change the physics of your universe.

  ### Recommendation for the Rewrite
  Don't solve the triangle. Let the characters occupy the corners.
  *   **The Engineer** argues for **Interventionism**: "I can fix her by editing the promise, not the magnet. That's causation."
  *   **The Neuroscientist** argues for **Epiphenomenalism/Reduction**: "You're editing the magnet that *correlates* with the promise. The magnet did the work."
  *   **Ines** embodies the **Counterfactual**: "I drove off because I believed it was broken." (True, even if the symms were fixed).

  The tension comes from the fact that the Engineer *needs* Substrate Neutrality to claim he's maintaining *her*, but the Physics *needs* Token Identity to remain closed. The moment the Cipher is applied, the Engineer should feel a chill: if the mapping changes and she acts the same, is it still *her* believing, or just the machine running? That is your dramatic hook.
