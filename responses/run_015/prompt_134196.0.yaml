answer: |-
  ### Audience Brainstorming: What They Are Thinking

  Before you step into the room, understand the mental posture of your audience. They are not hostile, but they are protective of conceptual clarity.

  1.  **The Analytic Philosophers:** They are looking for category errors. If you say an emotion is an "event" rather than a "state," they will ask what bears the properties of that emotion. If you say it involves "social evaluation," they will test the necessity of that condition against counterexamples (e.g., solitary fear). They worry about "mystery-mongering"—using vague metaphors to hide lack of mechanism.
  2.  **The Cognitive Psychologists:** They are looking for measurability. "Resonance lock" sounds poetic; they want to know what variables are resonating, on what timescale, and how to observe it without relying on introspection. They are steeped in predictive processing (Friston, Seth, Clark); if your theory sounds like a rebranding of interoceptive inference without the math, they will dismiss it as redundant.
  3.  **The Dynamic:** They will treat you as an outsider. This is an advantage if you use it to offer a fresh phenomenological description, but a disadvantage if you appear unaware of the last 20 years of literature. Your credibility comes from admitting what you don't know while holding firm on the phenomenological insight. They will probe for where your theory breaks down; your goal is to show that the breakdown points are where the standard theories *also* break down, but your view explains *why*.

  ---

  ### Q&A Prep Sheet

  #### 1. The Solitary Emotion Objection (Most Damaging)
  **The Objection:** "You define emotions as alignments involving anticipated social evaluation. But I can feel terror when hiking alone and seeing a bear, or grief in total isolation. There is no social audience there. Are you denying these are emotions, or are you smuggling 'social' in as a metaphor?"

  **The Reply:** "I'm not denying solitary emotions exist. I'm suggesting that even in solitude, the *structure* of the evaluation is social in origin. When I fear the bear, I'm not just predicting pain; I'm anticipating a vulnerability that matters because I am a creature who exists among others. The 'lock' is between my bodily readiness and the significance of that readiness. However, I am willing to concede that basic affective programs (like startle) might not be full emotions. My theory targets complex emotions where meaning is involved. If the bear scenario feels purely visceral, it might be a sensation waiting to become an emotion only when I recount it to others later."

  **Weakness:** This risks sounding like you are redefining "emotion" to fit the theory. If they press on the immediate phenomenology of solitary fear, you may have to concede that "social" needs to be broadened to "normative significance."

  #### 2. The Ontological Category Objection
  **The Objection:** "You say emotions are transitional events, not states. But we ascribe properties to emotions as states ('His anger was unjustified,' 'Her grief was enduring'). If an emotion is a brief calibration event, what persists? Are you saying the emotion disappears once the calibration settles?"

  **The Reply:** "Think of it like a handshake. The handshake is the event, but the agreement is the state that follows. My claim is that the *emotion proper* is the moment of establishing the relationship between body and world. What persists is the aftermath—the mood, the belief, or the sensation. We talk about emotions as states because language is clumsy; we name the event by its result. This explains why emotions feel so volatile; they are inherently unstable processes trying to become stable states."

  **Weakness:** Philosophers love persistence conditions. If you say the emotion "disappears" into a belief, they will argue you've eliminated emotions rather than explained them.

  #### 3. The Homunculus/Decision Objection
  **The Objection:** "You say the mind 'decides' whether to treat the input as a judgment or a sensation after the lock settles. Who decides? This sounds like you're positing a little man inside the head watching the calibration and filing it away. That's a regress."

  **The Reply:** "I use 'decides' loosely, and I apologize if that implies a conscious agent. I mean a functional settling, like a magnetic compass finding North. It's not a conscious choice; it's a system-wide convergence. The 'lock' is the process of the system minimizing uncertainty. Once the uncertainty is low enough, the system commits to a mode of processing. There's no decider, just a threshold being crossed."

  **Weakness:** If you concede it's just "threshold crossing," they will ask why that needs a new name like "resonance lock" instead of just "threshold crossing."

  #### 4. The Phenomenological Access Objection
  **The Objection:** "If emotions are these brief transitional events, why do we report feeling them for minutes or hours? If the 'lock' is unstable and brief, shouldn't our experience of it be fleeting? You seem to be describing a sub-personal mechanism, not a lived experience."

  **The Reply:** "That's a crucial distinction. We don't feel the calibration; we feel the *tension* of the calibration. Imagine holding a heavy weight above your head. The shaking of your muscles is the 'lock' trying to stabilize. You feel the effort and the duration, even if the micro-adjustments are fast. The emotion feels long because the system is constantly re-locking as new information comes in. It's not one lock; it's a sustained vibration of re-calibrations."

  **Weakness:** This moves the goalposts from a "brief event" to a "sustained vibration." They may charge you with inconsistency.

  #### 5. The Normativity Objection
  **The Objection:** "Emotions can be fitting or unfitting. I can be wrong to be angry. But a calibration event is just a mechanical process. Gears don't have correctness conditions. How does a 'resonance lock' get things wrong?"

  **The Reply:** "A lock can fail to secure. If the alignment is between a bodily prediction and a social reality that doesn't exist, the lock is faulty. If I anticipate social rejection where there is none, the resonance is based on false data. The 'correctness' isn't in the mechanism itself, but in the accuracy of the inputs being aligned. The emotion is unfitting if the social evaluation it locks onto is illusory."

  **Weakness:** This leans heavily on the "social evaluation" being truth-apt. If emotions are non-cognitive, this reply fails. You are betting on a cognitive-adjacent view without committing to judgments.

  #### 6. The Developmental/Comparative Objection
  **The Objection:** "Infants and non-human animals display clear emotional behaviors before they have the capacity for 'anticipated social evaluation' in any sophisticated sense. Are you saying dogs don't feel fear? That seems empirically implausible."

  **The Reply:** "I'm not denying dogs feel affect. I am suggesting that 'emotion' in the full human sense might require a layer of social anticipation that develops over time. Infants and animals might operate at the level of raw sensation or basic judgment without the complex 'resonance' I'm describing. Or, their 'social evaluation' is much simpler—based on attachment rather than complex norms. I'm willing to limit my thesis to mature human emotions if that saves the mechanism."

  **Weakness:** This is a major concession. It limits the scope of your theory significantly, making it less generalizable.

  #### 7. The Vagueness/Operationalization Objection
  **The Objection:** "'Unstable alignment' and 'resonance' are metaphors. What are the actual variables? Is it neural firing rates? Hormone levels? Without operational definitions, this is poetry, not science."

  **The Reply:** "You're right that I'm offering a philosophical framework, not a neural model. I don't know the exact variables. But I'm pointing to a structural relationship that needs to be there for any neural model to make sense. If you only measure the belief or only measure the heartbeat, you miss the coupling between them. I'm asking you to look for the correlation error, not just the signals."

  **Weakness:** Cognitive scientists hate this answer. It sounds like you're exempting yourself from empirical scrutiny.

  #### 8. The Causal Efficacy Objection
  **The Objection:** "If the emotion is just the transition, what work does it do? Usually, we say emotions cause actions. Does the 'lock' cause the action, or does the settled belief cause it? If it's the latter, the emotion is epiphenomenal."

  **The Reply:** "The lock *is* the mobilization. The reason I run isn't just the belief 'there is a bear,' it's the bodily readiness that locked onto that belief. The transition provides the energy. A belief without the lock is inert knowledge. The lock is what turns knowledge into motive force."

  **Weakness:** This risks conflating the emotion with motivation generally. They may ask what distinguishes emotional motivation from cold, calculated motivation.

  ---

  #### The Secret Fear: The Predictive Processing Redundancy Objection
  **The Objection:** "This sounds exactly like Anil Seth's work on interoceptive inference and the predictive brain. He already argues emotions are controlled hallucinations based on bodily predictions. What does 'resonance lock' add that 'prediction error minimization' doesn't already cover? Are you just renaming existing cognitive science?"

  **Why It Is Dangerous:** This is the most damaging because it attacks your novelty and your familiarity with the field. If you are unaware of the dominant framework in affective neuroscience (predictive processing), you lose credibility instantly. It suggests you've reinvented the wheel without reading the manual.

  **The Reply:** "I am familiar with the predictive processing framework, and I agree my view is compatible with it. However, predictive processing describes the *continuous* background engine. My 'resonance lock' describes the specific *moment of commitment* within that engine. Seth explains how the brain predicts; I'm trying to explain what happens when the prediction sticks enough to become an experience. It's the difference between describing the engine's combustion cycle and describing the moment the car shifts into gear. I want to isolate the phenomenological pivot point that the broader model glosses over."

  **Weakness:** You must actually be familiar with Seth/Friston to pull this off. If they ask a follow-up about free energy principles, you will be exposed. This reply buys you time but requires you to know the literature enough to not be tripped up on the details.

  ---

  ### Upfront Concessions (Say these early)

  To lower the temperature and show you are collaborative, include these points in your opening or early Q&A:

  1.  **Concede Terminology:** "I know 'resonance lock' is non-standard terminology. I'm using it as a placeholder for a structural relationship that I think current vocabulary misses. I'm open to better naming conventions."
  2.  **Concede Empirical Authority:** "I am not a neuroscientist. I am not proposing a neural mechanism. I am proposing a phenomenological structure that I hope aligns with future empirical work. I defer to the psychologists in the room on the biological implementation."
  3.  **Concede Partial Overlap:** "I do not think judgment theories or perception theories are wholly wrong. I think they are describing the *aftermath* of the emotional event. I want to synthesize them by showing where they diverge from the process itself."
  4.  **Concede Scope:** "This model is intended for paradigmatic human emotions. I acknowledge it may need modification for basic affect, infant development, or non-human animals."
