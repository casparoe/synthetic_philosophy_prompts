  In the parish volunteer committee, M is the indispensable organizer who coordinates every event and quietly covers shortages in the collection plate, brushing off offers to share the load with a confident assurance that he prefers to handle it himself. N is a newer member who struggles with the accounting software and frequently arrives late due to transport issues, requiring others to drive her or double-check her figures, which she accepts with humble gratitude and immediate attempts to repay in kind. The congregation admires M's self-sufficiency and finds N's reliance slightly burdensome, yet M's consistent refusal to accept aid treats his neighbors as incapable contributors to his own wellbeing, effectively positioning them as an audience to his competence, while N's willingness to be helped validates her neighbors' agency, creating a circuit of mutual dependency where M remains isolated in his superiority and N is embedded in the reciprocity that constitutes the community.

  **Verdicts and Reasoning**
  *   **Achievement Reading:** N is more fully a person than M. Personhood is constituted by bidirectional recognition; N completes the circuit by allowing others to give to her, whereas M blocks the return flow of recognition, treating relations as unidirectional outputs.
  *   **Status View:** M and N are persons to exactly the same degree. Both are adult humans with ordinary psychological capacities; personhood is an intrinsic threshold status, not a gradient earned through social performance.

  **Structural Feature**
  The working variable is **unidirectionality**. M gives but refuses to receive; N gives and receives. If you remove this feature—for example, if M accepts help once, vulnerably acknowledging his need—the achievement reading verdict shifts: M immediately enters the mutual circuit and his personhood status rises to match N's.

  **Best Attack (from the Status View)**
  The achievement view conflates *ontological status* with *moral virtue*. By making personhood contingent on the willingness to receive help, it punishes independence and valorizes dependency, rendering personhood fragile and subject to social compliance rather than grounding it in the invariant dignity of the human being. M is not less of a person for being self-reliant; he is merely less cooperative.

