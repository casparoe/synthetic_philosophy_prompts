answer: |-
  A Development Economist and an Anthropologist are sitting in a Land Rover outside a village in Northern Ghana. They've just come from a meeting with the Village Chief regarding a new irrigation grant. The Economist is nervously shredding a receipt for a bottle of Black Label whiskey.

  **Economist:** "I can't log this expense. Under the Foreign Corrupt Practices Act, this is a facilitation payment. It's bribery. Pure and simple."

  **Anthropologist:** "It wasn't a payment. It was a knot. You tie it to bind the agreement. In this context, the whiskey isn't a transaction; it's the physical manifestation of a reciprocal obligation."

  **Economist:** "Tell that to the auditors in D.C. They see a gift to a local official, they see a felony. They see corruption."

  **Anthropologist:** "And if you tell the Chief that his gift is 'corruption,' he sees a broken bond. He sees you taking the resources without entering the social fabric. Refusing the gift isn't integrity here; it's a declaration that you owe him nothing."

  **Economist:** "So I have to choose between a fraud investigation and a failed project?"

  **Anthropologist:** "No. You have to choose which definition of 'theft' you're more afraid of."

  **Economist:** "Theft?"

  **Anthropologist:** "Yeah. In Washington, corruption is giving the Chief a drink. But out here? Corruption is drinking the Chief's water without ever pouring him one."
