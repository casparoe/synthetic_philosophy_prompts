          *   However, for Kant, time is not an objective container but a form of intuition.
          *   The "current moment" is a determination of inner sense.

      *   *The Halfer Argument via Kant:*
          *   The coin toss is an event in the external world (phenomenal).
          *   The probability attaches to the *event*, not the *experience*.
