answer: |-
  This is a rigorous and honest map of your moral intuitions. You have identified the exact friction points where standard ethical theories (Utilitarianism, Kantianism, Common Sense Morality) tend to break down against lived experience.

  Here is an audit of your tentative principle, a resolution of the structural worry, verdicts on new cases, and two competing principles (one cheap, one complex) with a recommendation.

  ### Part 1: Audit of Your Tentative Principle

  **Principle:** *(i) I owe a rescue when, and to the degree that, I could avert something very bad at a cost to myself that is small in comparison with the badness averted; (ii) how much blame I incur for failing is a separate matter, fixed by whether the need was present to my senses or had to be inferred.*

  **Case-by-Case Stress Test:**

  *   **Case 1 (Pond/Suit):** **Passes.** Cost ($600) is small compared to death. Salience is high. Duty strong, blame high.
  *   **Case 2 (Pond/Interview):** **Fails Clause (i).** You verdict "I must go in," but the cost (life trajectory) is *not* small compared to the badness averted (one life vs. your whole career). To save this verdict, Clause (i) must be changed from "small cost" to "cost not catastrophic" or "cost proportional to stakes."
  *   **Case 3 (Charity/Email):** **Fails Clause (i), Passes Clause (ii).** Clause (i) says you *owe* the rescue (cost is small, bad is very bad). Your verdict is "I think I ought... I do not give." You feel the duty is weaker, not just the blame. Clause (ii) saves the *blame* distinction, but your intuition suggests the *obligation strength* itself drops with distance.
  *   **Case 4 (Email/Trivial vs. Serious):** **Passes.** Confirms the "proportionality" requirement in Clause (i).
  *   **Case 5 (Threshold/Offset):** **Fails Clause (i).** You do not "avert" anything. The outcome is fixed. Clause (i) needs a **Causal Efficacy** condition (marginal impact > 0).
  *   **Case 6 (Vaccination/Probability):** **Passes.** Confirms that expected value (probability × impact) counts as efficacy, distinguishing it from Case 5.
  *   **Case 7 (My Pond):** **Fails.** Clause (i) treats all agents equally. Your verdict relies on **Special Obligations** (ownership/causation).
  *   **Case 8 (20 Bystanders):** **Fails.** Clause (i) is individualistic. Your verdict introduces a **Fairness Claim** (if I act, others owe me).
  *   **Case 9 (Risk to Self):** **Passes.** "Small cost" implicitly excludes high risk of death. However, you need a defined threshold (1/1000 vs 1/20) to make this actionable.

  **Summary of Repairs Needed:**
  1.  **Cost Cap:** Change "small cost" to "non-catastrophic cost" (to save Case 2).
  2.  **Salience Weighting:** Salience must modify the *strength of the reason*, not just blame (to save Case 1 vs. 3).
  3.  **Efficacy:** Must specify *marginal* expected impact (to distinguish 5 from 6).
  4.  **Special Relations:** Must account for ownership/causation (Case 7).
  5.  **Fairness:** Must account for collective action (Case 8).

  ---

  ### Part 2: The Structural Worry (The "Greedy Reading")

  You worry that if the principle is "prevent bad when cost is small," satisfying it once reveals the next instance, leading to a life of sacrifice. You want to keep Case 2 (high cost allowed) but reject the life of sacrifice.

  **The Solution: The Prerogative of Aggregation.**
  The limit is not on the *cost of a single act*, but on the *aggregate demand on your life*.
  *   **Single Case:** You must bear high costs (Case 2) if the stakes are high enough and you are the only/primary rescuer.
  *   **Aggregate:** You are permitted to stop when further sacrifices would undermine your capacity to function as a moral agent or pursue your own legitimate projects.
  *   **Why this works:** It allows Case 2 (emergency, one-off) without triggering the "life of sacrifice" (chronic, endless demands). The "greedy reading" fails because it treats moral demands as an infinite series rather than discrete events bounded by a personal prerogative.

  ---

  ### Part 3: Verdicts on New Cases

  Applying the *repaired* intuition set (prioritizing your specific verdicts over abstract consistency):

  1.  **Victim in 60 Years (Climate/Policy):**
      *   **Verdict:** Weak duty, negligible blame.
      *   **Reasoning:** Low salience (Case 3), causal chain is long/uncertain (Case 5/6 hybrid), benefit is probabilistic. You "ought" to vote/consume responsibly, but failing to maximize this does not incur pond-level blame.
  2.  **Animal Suffering (Comparable to Child):**
      *   **Verdict:** Strong duty if salient (Case 1), weak duty if statistical (Case 3).
      *   **Reasoning:** If the moral status is comparable, the "badness averted" is the same. Your salience clause (ii) applies. You must save the burning dog in front of you; you are less blameworthy for ignoring the statistic of factory farming, though the "ought" remains.
  3.  **Rescue Needing 1 of 1,000 Bystanders:**
      *   **Verdict:** Duty is diluted but not erased. Blame is minimal.
      *   **Reasoning:** Extends Case 8. With 20 people, you still owe it. With 1,000, the "Fairness Claim" outweighs the duty. If you act, you are a hero; if you don't, you are not a villain, provided you can reasonably expect *someone else* to act. (This differs from Case 1 where you are the *only* rescuer).

  ---

  ### Part 4: Two Competing Principles

  Here are the two paths forward. One simplifies your theory by cutting your intuitions; the other complicates your theory to save them.

  #### Option A: The "Expected Value" Principle (Cheaper)
  *This principle prioritizes logical consistency over your salience intuitions.*

  **The Principle:** "An agent is obligated to perform an action if and only if the Expected Value (probability × magnitude) of the good averted exceeds the cost to the agent, provided the cost does not threaten the agent's fundamental life projects. Blame is assigned based on reasonable expectation of compliance."

  **What it overturns (2 Verdicts):**
  1.  **Case 1 vs. Case 3:** It erases the distinction. The child in the pond and the child overseas are morally identical. You owe the $4,000 just as much as the suit. Your feeling that Case 3 is weaker is dismissed as psychological bias, not moral truth.
  2.  **Case 2:** It likely overturns your verdict here. If the interview truly changes the "course of your life," the cost may exceed the threshold of "fundamental life projects." You might be *permitted* to walk on.

  **Pros:** Philosophically robust, immune to "arbitrary distance" objections, easy to calculate.
  **Cons:** Demanding, ignores the psychological reality of moral motivation, feels cold.

  #### Option B: The "Salience-Sensitive Rescue" Principle (Complex)
  *This principle prioritizes your specific verdicts.*

  **The Principle:** "An agent has a scalar obligation to avert harm defined by: (1) **Magnitude** of harm; (2) **Marginal Efficacy** of action; (3) **Cost** to agent (capped by a prerogative for personal projects); modified by (4) **Salience** (proximity/sensory presence increases obligation strength) and (5) **Special Relations** (causation/ownership increases obligation strength). Blame is assigned based on the clarity of the demand and the agent's capacity to recognize it."

  **What it saves:** All 9 of your verdicts.
  **What it costs:** It admits that moral obligation is partially dependent on psychological/epistemic factors (salience) rather than just ontological facts (suffering exists). It is harder to apply algorithmically.

  **Pros:** Matches human moral psychology, preserves the "specialness" of immediate rescue, allows for the Case 2 intuition.
  **Cons:** Vulnerable to the charge of arbitrariness (why does distance matter?), harder to codify.

  ---

  ### Part 5: Recommendation and Framing

  **Which to Adopt:**
  I recommend **Option B (The Complex Principle)**.
  *Reason:* You explicitly stated that rejecting the "greedy reading" is not mere weakness of will. Option A (Utilitarian-style) tends to collapse into the greedy reading or requires ad-hoc patches to protect personal projects. Option B builds the limits (salience, prerogative, special relations) into the foundation. It respects the data of your moral experience.

  **Framing: Duty vs. Reasons + Blame**
  You asked whether this should be framed as a principle about *what I owe* or *reasons plus blameworthiness*. Your Case 1-vs-3 split is the key.

  If you say "I owe the same in 1 and 3, but am only blameworthy in 1," you create a disconnect between obligation and motivation.
  If you say "I owe more in 1 than in 3," you make obligation subjective.

  **The Precise Formulation:**
  Frame it as **Scalar Obligation with a Dual-Code Accountability System.**

  1.  **The Obligation (Scalar):** The "weight" of the duty is not binary (On/Off). It is a function of *Stakes × Efficacy × Salience ÷ Cost*.
      *   In Case 1, the weight is 10/10.
      *   In Case 3, the weight is 4/10 (due to low salience).
      *   In Case 2, the weight is 8/10 (high stakes, but high cost).
  2.  **The Accountability (Binary/Threshold):** Blame is assigned only when the Obligation Weight crosses a threshold of *Clarity*.
      *   Case 1 crosses the threshold (Clear demand).
      *   Case 3 does not (Demand is inferred/statistical).

  **Final Actionable Principle:**
  > "I am required to act to prevent harm when the **Expected Moral Value** (Magnitude × Probability) outweighs the **Personal Cost**, subject to three modifiers:
  > 1.  **Salience:** Direct sensory perception of the need increases the required cost I must bear.
  > 2.  **Efficacy:** I am released if my contribution is causally redundant (Case 5), but not if it is merely probabilistic (Case 6).
  > 3.  **Prerogative:** I am permitted to cease sacrificing when the aggregate demand threatens my capacity to pursue my own life projects.
  >
  > **Blame** is incurred only when the need is **salient or clearly inferable** and the cost is **within the prerogative limit**."

  **Which verdict must you abandon?**
  If forced to choose for the sake of a defensible, universalizable principle: **Abandon Case 3's leniency.**
  If the child's life is truly worth $4,000, and you have $4,000, the distance is morally irrelevant. Keeping Case 3 as "less obligatory" is the weakest link in your chain. It is the only verdict that relies entirely on your own psychological comfort rather than the victim's need. If you tighten Case 3 to match Case 1, the "Structural Worry" becomes urgent, but the principle becomes more robust.

  However, if you value a principle that you can actually *live by* without resentment, keep Case 3 as is, accept Option B, and acknowledge that you are prioritizing a **Morality of Rescue** (agent-centered, salience-driven) over a **Morality of Outcomes** (state-centered, distance-blind).
