prompt: |-
  My PhD student — well, he only submitted last month, so I suppose I should stop calling him that — is marrying an effective altruist on Saturday, and I've stupidly agreed to give the groom's toast. They're both the real deal: over half their income gone, careers rearrangned around it, the works. His father is a hard-nosed act-utilitarian who, I've been warned, will be listening specifically for whether I claim the marriage is justified by the good it does. The rest of the room is mostly her Catholic family — her grandmother is devout and will hear anything about "grounds" as a slight against the sacrament — plus half our department, who'll pick up anything Williams-adjacent instantly. Jake's one request: no list of reasons why she's the right person. He says if he'd needed reasons he'd have married a spreadsheet, and I think he's instinctivly groping toward the one-thought-too-many point, except displaced onto me: a toast that itemises her virtues would make it sound as though he acted *on* them.

  So write me a four-minute toast that honours the marriage as a ground project neither of them owes an impersonal justification for, that never once grounds it in her qualities, that gives his father nothing he can take as a utilitarian audit of their life together, and that her grandmother won't hear as a denial that grace is doing any work. One thing I don't want: don't let "no impersonal justification required" quietly become "beyond moral criticism" — integrity isn't immunity, and if the toast implies it is, it'll be dishonest in exactly the way Williams wasn't. It should land as warmth for both halves of the room, not as a lecture with jokes bolted on.

  Give me the toast first (around 500 words, no stage directions), then a section called "What I had to leave out" (around 150 words) on where the integrity objection and the one-thought-too-many constraint actually bit — including anything you wanted to say and cut.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD supervisor (academic).
      *   **Occasion:** Wedding toast for the groom (former PhD student, submitted last month).
      *   **Groom:** Jake (effective altruist, high income donation, career rearranged for EA).
      *   **Bride:** Effective altruist (same level of commitment).
      *   **Audience Constraints:**
          *   Groom's Father: Hard-nosed act-utilitarian. Listening for justification based on "good done." Must *not* give him a utilitarian audit.
          *   Bride's Family: Mostly Catholic. Grandmother is devout. Will hear "grounds" as a slight against sacrament/grace. Must *not* deny grace.
          *   Department Colleagues: Half the room. Will pick up Bernard Williams references instantly (specifically "one thought too many" and integrity/ground projects).
          *   Groom (Jake): No list of reasons why she's the right person. Rejects instrumental reasoning ("married a spreadsheet").
      *   **Philosophical Constraints:**
          *   Honor marriage as a "ground project" (Williams).
          *   No impersonal justification required (but *not* "beyond moral criticism" – integrity isn't immunity).
          *   Never ground it in her qualities (virtues).
          *   Avoid utilitarian audit (father).
          *   Avoid denying grace/sacrament (grandmother).
          *   Tone: Warmth, not a lecture with jokes.
          *   Length: ~500 words for the toast.
          *   Additional Section: "What I had to leave out" (~150 words) explaining where the integrity objection and one-thought-too-many constraint bit.

  2.  **Deconstruct the Philosophical Tightrope:**
      *   *Williams' "One Thought Too Many":* The idea that saving a wife over a stranger shouldn't involve a utilitarian calculation ("she is my wife"), but rather an immediate commitment. The toast needs to reflect that Jake's commitment isn't based on calculating her utility or virtues.
      *   *Utilitarian Father:* Wants to hear "this marriage maximizes good." I must avoid saying "this marriage is good because..." or "you will do more good together." Instead, focus on the commitment itself as the value.
      *   *Catholic Grandmother:* Wants to hear "God joined them" or "sacrament." I must avoid saying "you justify this yourselves." I need to leave space for grace without explicitly invoking theology that might alienate the atheists, but using language compatible with sacrament (covenant, gift, mystery).
      *   *Integrity vs. Immunity:* Williams argues integrity protects ground projects, but it doesn't make them immune to criticism. The toast shouldn't say "nothing matters outside this bubble." It should say "this commitment is the lens through which you face the world."

  3.  **Drafting the Toast (Iterative Process):**
      *   *Opening:* Acknowledge the transition from student to colleague/friend. Acknowledge the room's diversity (academics, family).
      *   *Middle (The Trap):* Navigate the "why her?" question. Jake hates lists. Father wants utility. Grandmother wants grace.
      *   *Solution:* Focus on the *act* of commitment, not the *reasons* for it. The marriage isn't a means to an end (utility), nor is it merely a contract. It's a shared orientation.
      *   *Williams Nod:* Subtle references to "ground projects" without naming Williams. Use language like "commitment that precedes calculation."
      *   *Catholic Nod:* Use words like "vow," "covenant," "gift," "mystery."
      *   *Utilitarian Deflection:* Don't talk about outcomes. Talk about the stance.
      *   *Integrity Check:* Acknowledge the world outside matters, but this is the center from which they act.
      *   *Closing:* Warm wish.

      *Drafting thoughts:*
      *   Avoid: "She is kind." (Violates Jake's rule).
      *   Avoid: "You will save more lives together." (Violates Father's audit trap? Actually, Father *wants* this, but the prompt says "give his father nothing he can take as a utilitarian audit." So I must *avoid* confirming the utilitarian frame, even if the Father likes it. The prompt says the Father will listen *specifically* for whether I claim the marriage is justified by the good it does. I must *not* claim that. I must justify it differently.)
      *   Avoid: "You make your own rules." (Violates Integrity/Immunity constraint).
      *   Avoid: "God brought you together." (Too theological for the department? But Grandmother needs to not hear a denial. So keep it compatible.)

      *Refining the Williams angle:* The key is that the commitment is *constitutive*, not *instrumental*. They aren't marrying to do good; they are doing good *from* the marriage.
      *Refining the Catholic angle:* Grace works through nature. If I speak of the love as a gift they receive rather than build, that helps.
      *Refining the Integrity angle:* Acknowledge that the world demands much, but this bond is the anchor.

      *Word Count Check:* Needs to be around 500 words. 4 minutes speaking time is usually ~500-600 words.

  4.  **Drafting "What I had to leave out":**
      *   Need to explain where I cut corners.
      *   Williams' integrity objection: I couldn't explicitly discuss how the marriage might conflict with impartial morality, because that sounds like criticism.
      *   One-thought-too-many: I couldn't explain *why* Jake is right to reject reasons, because explaining it uses reasons.
      *   Specific cuts: Maybe a joke about the dissertation, or a direct quote from Williams.

  5.  **Writing the Toast:**
      *   Start with the student relationship.
      *   Move to the nature of their commitment.
      *   Address the "why" without listing virtues.
      *   Address the "good" without utilitarian calculus.
      *   Address the "sacred" without dogma.
      *   End with the toast.

      *Self-Correction on Utilitarian Father:* The prompt says "give his father nothing he can take as a utilitarian audit." If I say "Your love is valuable in itself," the Father might hear "non-utility value." If I say "You will do good," he hears "utility." I need to frame the marriage as a *commitment* that stands prior to the calculation of good. It is the *source* of their action, not the *result* of a calculation.
      *Self-Correction on Catholic Grandmother:* If I say "no impersonal justification," she might hear "no God." I need to phrase it as "a mystery that exceeds justification."
      *Self-Correction on Integrity:* Must not imply they are immune to criticism. Acknowledge the weight of the world.

      *Let's write.*

