answer: |-
  Jake, until last month, I could call you my student. Today, I stand as a friend, which is a far more dangerous position. I've been asked to say why this marriage makes sense. But Jake, you've warned me that if you'd needed reasons, you'd have married a spreadsheet. You're right. To list virtues would be to treat your love as a conclusion drawn from evidence, rather than the ground from which you both now stand.

  There is a temptation, looking at the lives you've chosen, to measure this union by what it produces. We know you both rearrange your careers and your incomes around the needs of strangers. It would be easy to say this marriage is justified because it makes that work more efficient. But I won't say that. Your father might listen for that audit, but a vow is not a business plan. If you loved each other only because it maximized the good, you wouldn't be here; you'd be somewhere else, calculating.

  Instead, I see a commitment that precedes the calculation. This is the anchor. Bernard Williams once suggested that when a man saves his wife from drowning, he shouldn't need to think about moral theory; he acts from who she is to him. You are building a life where that immediacy is the engine. This marriage isn't a tool for the good work you do; it is the integrity from which that work flows.

  And yet, this isn't a bubble. Integrity is not immunity. The world outside is demanding, often tragic, and will ask sacrifices of you that no vow can prevent. You are not exempt from the weight of things because you love each other. But you are anchored.

  For those who see marriage as a sacrament, know that I speak of a mystery that exceeds justification. You do not construct this grace; you receive it. It is a gift that holds you when reasons run out. To the department colleagues here: yes, this is a ground project. But it is one that opens you to the world, rather than closing you off.

  So, I propose a toast. Not to the utility of your union, nor to the reasons for it, but to the commitment itself. May you always find that the one thought you never need to think is whether you belong to each other. May you face the world's demands not as calculators, but as partners. And may you find that in giving yourselves to this vow, you are given something back that no spreadsheet could ever quantify.

  To Jake and his bride.

  **What I had to leave out**

  I wanted to explicitly name Williams' "one thought too many" objection to clarify why listing her virtues was forbidden, but naming it would have turned the toast into a lecture for the colleagues while alienating the grandmother. I also had to cut a line about how the marriage might *fail* to maximize good sometimes, which would have satisfied the integrity constraint (showing immunity isn't claimed) but terrified the father. Finally, I resisted saying "God joined you," which would have comforted the grandmother but lied for the atheists. Instead, I used "receive" and "gift" to leave the source of grace open—allowing the religious to hear God and the secular to hear luck or love, without forcing a metaphysical claim that would fracture the room.
