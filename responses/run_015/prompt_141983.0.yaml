answer: |-
  There is no single standard term of art that umbrella-covers all three errors you describe. In the literature, they are typically disaggregated. Bullet 2 is often labeled **Lewontin's Fallacy** (after Richard Lewontin's 1970 argument that within-group heritability cannot explain between-group differences). Bullet 1 is frequently called the **Individual Heritability Fallacy** (the error of partitioning an individual's phenotype). Bullet 3 is usually discussed under **Genetic Determinism** or **Essentialism**.

  However, these are all manifestations of a single underlying logical failure: treating a variance ratio ($V_G/V_P$) as an intrinsic property of the trait rather than a contingent property of the population's variance structure. Since no existing term captures this unity plus the sensitivity to environmental variance ($V_E$), I recommend coining **The Heritability Invariance Fallacy**.

  **Definition:** The Heritability Invariance Fallacy occurs when a heritability estimate ($h^2$) is treated as invariant across changes in population structure, environmental distribution, or levels of analysis (individual vs. group). It assumes the ratio reflects the trait's biological fixedness rather than the current ratio of genetic to environmental variance.

  **Are Bullets 1 and 2 the same error?**
  Yes, fundamentally. Both commit a category error regarding variance components. Bullet 1 attempts to apply a population variance ratio to a single data point (where variance is undefined). Bullet 2 applies a within-population variance ratio to between-population mean differences (where the sources of variance may differ entirely). Both ignore that $h^2$ is specific to the distribution of $V_E$ in the reference population.

  **Is the sensitivity bit a symptom or the phenomenon?**
  It is the mechanism. The error arises because the user assumes $h^2$ is stable. The sensitivity you describe (where $h^2$ rises as $V_E$ is homogenized) is precisely why the assumption of invariance fails. When an intervention equalizes the environment, $V_E$ drops, $V_P$ drops, and $h^2$ rises—even though the trait is now *more* environmentally controllable. Calling this the **Heritability Invariance Fallacy** flags that the number cannot be assumed stable across such shifts.

  **The Boundary Case: Selection vs. Intervention**
  You asked where the line lies regarding response to selection ($R = h^2S$). This use is legitimate because it predicts a shift in the population mean *under the assumption that the variance structure remains stable* during the selection process. The error occurs when applying $h^2$ to an intervention that *intentionally alters* $V_E$ (e.g., school food programs).
  *   **Legitimate:** Predicting trait shift when selecting on existing variance without changing environmental conditions.
  *   **Fallacious:** Predicting trait immutability or individual causation when the intervention specifically targets the environmental component of variance.

  **Usage in Manuscript**
  In your methods section, you might define it thus:
  *"We caution against the Heritability Invariance Fallacy: the misinterpretation of heritability estimates as intrinsic trait properties rather than population-specific variance ratios. Because $h^2$ is contingent on the prevailing environmental variance ($V_E$), estimates derived from homogenized environments may paradoxically appear higher precisely where environmental interventions are most viable. Consequently, we do not interpret high $h^2$ as evidence of individual causal attribution or between-group genetic etiology."*

  This coinage is tight, technically accurate, and distinguishes the statistical error from broader philosophical claims like reification.
