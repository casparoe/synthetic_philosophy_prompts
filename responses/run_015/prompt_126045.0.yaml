      *   **Requirements for the Proposal:**
          *   Precise research question (determinate answer).
          *   Justification of why existing positions leave it open (Philosophy of History vs. Narratology).
          *   Justification of why a novelist is the right person to answer it (practice-based research).
          *   Month-by-month method.
