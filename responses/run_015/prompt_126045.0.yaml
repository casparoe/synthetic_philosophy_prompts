  2.  **Deconstruct the Core Question:**
      *   *Current formulation:* Is formal whiggishness avoidable, or is it simply what narration is?
      *   *Critique:* This is a binary yes/no, but "avoidable" is vague. It needs to be testable.
      *   *Refinement:* Can specific narrative techniques successfully disrupt the reader's perception of teleological inevitability in historical fiction, or does the act of emplotment necessarily reconstruct it?
      *   *Determinacy:* We need a way to measure "perception of inevitability." Reader response is key here.

  3.  **Address the "Why Existing Positions Leave It Open" Requirement:**
      *   *Position A (Philosophy of History):* Focuses on explanation and causality (winners vs. losers). Ignores the aesthetic experience of reading.
      *   *Position B (Narratology/Structuralism):* Claims emplotment *requires* closure/teleology. Makes the question trivial (answer is "no, it's impossible").
      *   *Gap:* Neither tests the *degree* to which form influences historical perception in a practical, creative context.

  4.  **Justify the Novelist's Role:**
      *   Philosophers deal in abstractions/examples. Novelists deal in sustained attention, pacing, and emotional investment. The "feeling" of inevitability is an affective response, not just a logical one. Only a full draft can test this.

  5.  **Develop the Method (Month-by-Month):**
