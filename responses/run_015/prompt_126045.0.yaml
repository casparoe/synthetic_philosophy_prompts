  6.  **Define Failure Conditions:**
      *   Readers can't distinguish the versions.
      *   The "Anti-Whig" version is unreadable/boring.
      *   The effect depends entirely on prior knowledge, not text.

  7.  **Drafting the Proposal (Iterative Process):**
      *   *Title:* Needs to be catchy but academic. "The Shape of Contingency."
      *   *Abstract/Intro:* Hook the reader with the tension between history and plot.
      *   *Research Question:* Refine the "formal whiggishness" idea.
      *   *Context:* Briefly mention the Philosophy of History vs. Narratology gap.
      *   *Methodology:* Practice-led research.
      *   *Timeline:* Realistic for 6 months.
      *   *Failure:* Honest assessment.
      *   *Scope Advice:* I need to include this as a note to the user, or integrate it into the proposal strategy. The prompt asks me to "tell me honestly whether this is too big for six months, and which part I should cut if it is" *in the output*. I will provide the proposal *and* the advisory note.

  8.  **Refining the Research Question for Determinacy:**
      *   *Bad:* Is it avoidable?
      *   *Good:* To what extent can specific narrative interventions disrupt the reader's attribution of teleological necessity in historical fiction?
      *   *Better:* Does the implementation of [Specific Devices] significantly reduce reader-perceived teleological inevitability compared to conventional emplotment, without rendering the text unintelligible?

  9.  **Addressing the "Name Positions" Constraint:**
      *   Instead of "Butterfield" or "White," use "The Explanatory Critique" and "The Structuralist Constraint."

  10. **Review against Constraints:**
      *   Two-page length (approx. 800-1000 words).
