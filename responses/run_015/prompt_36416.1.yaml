prompt: |-
  I run the disagreement reviews at a mid-size reinsurance firm — whenever two of our teams give materialy different probability estimates for the same risk (a pandemic loss year, a specific counterparty defaulting within five years, whatever), my job is to figure out whether we can pool them into one number or whether the difference needs to go up the chain. I recently got interested in Aumann's agreeing-to-disagree result and the whole "common prior assumption" debate behind it — the idea being that if two rational parties have common priors, then once they've shared their evidence they shouldn't still disagree, so persistent disagreement is either unshared information or a difference in priors themselves. I want that operationalized. Please write a procedure my analysts can run in a single afternoon meeting with both teams present: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in "pool the estimates" versus "escalate, because this is a prior-level difference, not an info-level one," and — this matters — which steps are honestly just judgment calls dressed up as a checklist. Then run it on two cases: (1) our epidemiology team puts 12% on a major pandemic loss year and our cat-modeling team puts 7%, and probing reveals they're feeding off different base datasets neither can fully articulate; (2) two veteran underwriters who have sat in the same meetings and seen all of each other's evidence still disagree 8% vs 25% on a counterparty defaulting, because one of them thinks the whole credit-rating framework is broken post-2008 and the other thinks that's paranoia. Include at least one case where the procedure gives an answer I won't like, and say plainly where the procedure will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Head of Disagreement Reviews at a mid-size reinsurance firm.
      *   **Task:** Operationalize Aumann's Agreement Theorem (and the Common Prior Assumption debate) into a practical procedure for analysts.
      *   **Format:** A step-by-step procedure for a single afternoon meeting, followed by an application to two specific cases, plus a critique of the procedure's limitations.
      *   **Key Requirements:**
          *   Questions to ask in order.
          *   Criteria for "sufficient answer" at each step.
          *   Termination conditions: "Pool" vs. "Escalate" (Prior vs. Information difference).
          *   Honesty about "judgment calls dressed up as checklists."
          *   Run the procedure on Case 1 (Epi vs. Cat, 12% vs. 7%, different datasets).
          *   Run the procedure on Case 2 (Underwriters, 8% vs. 25%, structural belief difference).
          *   Include a case where the answer is unsatisfactory/misfires.

  2.  **Theoretical Grounding (Aumann & Common Priors):**
      *   *Aumann's Agreement Theorem:* If two agents are rational Bayesians, share a *common prior*, and have *common knowledge* of each other's posteriors (estimates), they cannot agree to disagree. Their posteriors must be identical.
      *   *Implication for Business:* If they disagree, either (a) they aren't rational (unlikely to admit), (b) they don't actually know each other's estimates/reasoning (information asymmetry), or (c) they have different priors (fundamental worldview differences).
      *   *The "Common Prior Assumption" (CPA) Debate:* In reality, people *do* have different priors (born from different experiences, training, risk appetites). The procedure needs to distinguish between "I know something you don't" (Info) and "I weigh what we both know differently" (Prior).
      *   *Goal:* Move from "We disagree" to "Here is *why* we disagree" to decide if we can average (Info gap solvable) or must escalate (Prior gap irreconcilable).

  3.  **Drafting the Procedure (The "Aumann Audit"):**
      *   *Constraint:* Single afternoon meeting. Needs to be punchy, not academic.
      *   *Step 1: Calibration of Posteriors.* Ensure they actually know what the other thinks. (Common Knowledge of Posteriors).
      *   *Step 2: Information Exchange.* Reveal the data. (Testing for Information Asymmetry).
      *   *Step 3: Likelihood Function Check.* If they have the same data, do they interpret the *weight* of that data differently? (Testing for Priors).
      *   *Step 4: The "Swap" Test.* If they swapped seats, would they change their mind? (Rationality check).
      *   *Termination:*
          *   Pool: If the gap closes significantly after info exchange (Info asymmetry).
          *   Escalate: If the gap remains despite shared info (Prior asymmetry).
      *   *Honesty Clause:* Need to explicitly flag where human judgment overrides the logic.

  4.  **Developing the Cases:**
      *   *Case 1 (Epi vs. Cat):* 12% vs. 7%. Different datasets. This sounds like Information Asymmetry. *Twist:* The prompt says "neither can fully articulate" the datasets. This is a trap. If they can't articulate the info, they can't share it. This might lead to a misfire or an "Escalate" due to inability to verify common knowledge. Let's make the procedure reveal that the "data" is actually black-box model outputs, which acts like a Prior difference because it's unexplainable.
      *   *Case 2 (Underwriters):* 8% vs. 25%. Same meetings, same evidence. One thinks ratings are broken, one doesn't. This is a classic Prior difference (structural worldview). The procedure should flag this for Escalation.
      *   *Unsatisfactory Answer:* I need to ensure one case shows the limitation. Case 1 is a good candidate for this. If the data is proprietary/black-box, the procedure says "Escalate," but management might just want a weighted average anyway. Or, the procedure forces a "Pool" when the risk is actually bifurcated. Let's aim for the "Judgment Call" section to highlight where the math fails the business reality.

  5.  **Refining the Procedure Steps (Iterative Polish):**
      *   *Step 1 (The Mirror):* State the other's position until they agree you understand it. (Ensures Common Knowledge).
      *   *Step 2 (The Ledger):* List every piece of evidence. Mark who knew what. (Identifies Info Asymmetry).
      *   *Step 3 (The Weight):* For shared evidence, assign impact. (Identifies Prior/Model differences).
      *   *Step 4 (The Pre-Mortem):* What would change your mind? (Tests Rationality/Flexibility).
      *   *Decision Matrix:* Clear rules for Pool vs. Escalate.

  6.  **Addressing the "Honesty" Requirement:**
      *   I need to explicitly call out that "Rationality" is assumed but rarely true.
      *   I need to call out that "Common Prior" is a fiction in corporate culture (Actuarial vs. Underwriting cultures *are* different priors).
      *   I need to admit that sometimes we pool just to move on, even if the theorem says we shouldn't.

  7.  **Drafting the Content (incorporating the prompt's tone):**
      *   Tone: Professional, slightly cynical but rigorous, operational.
      *   Structure: Procedure -> Case 1 -> Case 2 -> Critique/Misfire.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* Aumann matters? Yes, in the intro.
      *   *Check:* Did I distinguish Info vs. Prior? Yes, that's the core of the decision tree.
      *   *Check:* Is the "Unsatisfactory Answer" clear? I will use Case 1 to show where the procedure breaks down because "unarticulated datasets" violate the transparency required for Aumann to work.
      *   *Check:* Did I identify the judgment calls? Yes, specifically in Step 3 (Weighting) and the Final Decision.

  9.  **Final Polish:** Ensure the distinction between "Pool" (Information gap resolved, convergence expected) and "Escalate" (Prior gap remains, need executive risk appetite decision) is sharp. (Wait, actually, in reinsurance, "Pool" usually means "Average them." If Aumann says they *should* agree, averaging is a heuristic. If they *can't* agree due to priors, averaging is dangerous. I need to be precise: "Pool" = Treat as uncertainty range. "Escalate" = Treat as fundamental strategic divergence.)
      *   *Correction on "Pool":* The prompt asks "pool them into one number." In Aumann's world, if they share info, they converge to *one* number naturally. If they don't converge, you can't just average without understanding why. So "Pool" in this context means "Reconcile to a single consensus." "Escalate" means "We have two valid but incompatible worldviews; senior leadership must choose the risk appetite."

      *   *Refining the "Misfire":* The prompt asks for a case where the procedure gives an answer I won't like. I'll use the critique section to explain that the procedure might demand escalation on Case 1 (due to black box data), but the business needs a number *now*. That's the friction between theory and operations.

  10. **Finalizing the Output Structure:**
      *   **Intro:** Contextualize Aumann for Reinsurance.
      *   **The Protocol:** The "Common Prior Audit."
      *   **Case 1 Application:** Epi vs. Cat.
      *   **Case 2 Application:** Underwriters.
      *   **The Misfire & Judgment Calls:** Honest assessment of limitations.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ### The Common Prior Audit (CPA) Protocol

  **Objective:** To distinguish between *informational asymmetry* (you know something I don't) and *prior asymmetry* (we weigh the same facts differently) in probability estimates.
  **Timebox:** 90 Minutes.
  **Participants:** Facilitator (You), Team A Lead, Team B Lead, Scribe.
  **Aumann Premise:** If two rational agents share a common prior and common knowledge of each other's evidence, their posterior probabilities must converge. If they do not converge, one of those conditions is false.

  ---

  #### Step 1: The Mirror Test (Establishing Common Knowledge of Posteriors)
  **Question:** "Team A, state Team B's estimate and the *single strongest reason* they hold it. Team B, confirm or correct."
  *   **Sufficient Answer:** Team B nods and says, "Yes, that is exactly our position."
  *   **Insufficient Answer:** "Well, not exactly, we also think..."
  *   **Action:** Repeat until both sides can articulate the other's position to the other's satisfaction.
  *   **Why:** Aumann requires *common knowledge* of the disagreement. If you don't truly understand their number, you aren't reacting to their evidence; you're reacting to a straw man.

  #### Step 2: The Ledger (Identifying Information Asymmetry)
  **Question:** "List every distinct data point, model output, or anecdotal signal driving your number. Mark them 'Shared' (both knew it) or 'Private' (only one knew it)."
  *   **Sufficient Answer:** A whiteboard list where every line item is tagged.
  *   **Insufficient Answer:** "It's more of a feeling based on the model..." (See *Judgment Call* below).
  *   **Action:** For every 'Private' item, the holder must disclose the substance of the data (not necessarily the proprietary source code, but the *output* and *implication*).
  *   **Termination Check:** Once all 'Private' items are disclosed, ask: "Does this new information move your number?"
      *   **If Yes:** Update estimates. If they converge within a 10% band, **POOL**.
      *   **If No:** Proceed to Step 3.

  #### Step 3: The Likelihood Check (Identifying Prior Asymmetry)
  **Question:** "Look only at the 'Shared' items from Step 2. If you were forced to bet solely on this shared evidence, what is your probability?"
  *   **Sufficient Answer:** Two numbers derived *only* from the shared evidence.
  *   **Insufficient Answer:** "I can't separate the data from the model."
  *   **Action:** Compare the two new numbers.
      *   **If they differ significantly:** You have identified a **Prior Difference**. You interpret the *same* world differently.
      *   **If they match:** The difference is in the **Private Information weighting**.
  *   **Termination Check:** If the gap persists on Shared evidence, **ESCALATE**. This is not a math problem; it is a worldview problem.

  #### Step 4: The Pre-Mortem (Rationality Check)
  **Question:** "What specific future event would prove you wrong and force you to adopt the other team's number?"
  *   **Sufficient Answer:** A falsifiable condition (e.g., "If default rates exceed 5% in Q3").
  *   **Insufficient Answer:** "Nothing, my model is robust."
  *   **Action:** If either party claims immunity to contrary evidence, flag as **ESCALATE**. Rational Bayesians must have conditions under which they update.

  ---

  ### Case Application 1: Epidemiology (12%) vs. Cat-Modeling (7%)
  **Context:** Pandemic loss year probability.
  **Finding:** Different base datasets, neither fully articulated.

  **Running the Protocol:**
  1.  **Mirror:** Epi states Cat thinks 7% based on historical wind/quake correlation. Cat confirms. Cat states Epi thinks 12% based on viral transmission vectors. Epi confirms. *Pass.*
  2.  **Ledger:** Epi lists "WHO surveillance data" (Private). Cat lists "Historical property loss tables" (Private).
      *   *The Snag:* When asked to disclose the substance, Epi says, "Our model ingests the raw surveillance streams; we can't give you the number without the model." Cat says, "Our loss tables are proprietary; the output is the 7%."
      *   *Judgment Call:* You rule this **Insufficient** for Step 2. They are treating their models as priors rather than processing engines.
      *   *Forced Disclosure:* You demand a sensitivity analysis. "If WHO data showed half the infections, what's your number?" Epi says "9%." "If loss tables showed double the severity?" Cat says "8%."
  3.  **Likelihood Check:** Both agree that *historical* pandemic frequency (Shared) is low. But Epi weighs *current* biological signals higher; Cat weighs *economic* resilience higher.
  4.  **Pre-Mortem:** Epi says, "If R0 drops below 1 globally." Cat says, "If GDP remains stable despite lockdowns."

  **Verdict:** **ESCALATE.**
  **Reasoning:** While there is information asymmetry (different datasets), the inability to articulate the data processing (Step 2 failure) means the "models" are acting as **unexamined priors**. They are not two rational agents sharing evidence; they are two black boxes outputting numbers. You cannot pool these because you cannot verify if the divergence is due to data or structural bias.
  **Outcome:** You send this to the CRO. The gap isn't just a number; it's a fundamental disagreement on whether this risk is biological (Epi) or economic (Cat).

  ---

  ### Case Application 2: Underwriter A (8%) vs. Underwriter B (25%)
  **Context:** Counterparty default within 5 years.
  **Finding:** Same meetings, same evidence. Disagreement on credit-rating framework validity.

  **Running the Protocol:**
  1.  **Mirror:** A states B thinks 25% because "ratings are lies." B states A thinks 8% because "ratings are mean-reverting." Both confirm. *Pass.*
  2.  **Ledger:** All evidence is marked **Shared**. They sat in the same meetings. They saw the same balance sheets. There is no private information.
  3.  **Likelihood Check:** You ask, "Given the same balance sheet and the same rating downgrade, what is the default prob?"
      *   Underwriter A: "8%. The downgrade is noise."
      *   Underwriter B: "25%. The downgrade is structural."
      *   *Result:* Significant divergence on Shared evidence.
  4.  **Pre-Mortem:**
      *   A: "If the counterparty survives the next liquidity crunch."
      *   B: "If the rating agency revises their methodology."

  **Verdict:** **ESCALATE.**
  **Reasoning:** This is a textbook **Prior Difference**. By Aumann's logic, since information is common knowledge, the only reason for disagreement is different priors. Underwriter B has a prior that "Post-2008 frameworks are broken." Underwriter A has a prior that "Markets are efficient."
  **Outcome:** Do not pool. Averaging 8% and 25% to 16.5% is mathematically clean but philosophically dishonest. One of them is assuming a regime change; the other is assuming continuity. This requires a strategic decision on risk appetite, not a statistical compromise.

  ---

  ### The Misfire & The Judgment Calls

  You asked for honesty about where this procedure fails and where I am dressing up judgment as a checklist. Here is the reality check.

  #### 1. The "Black Box" Misfire (Case 1 Revisited)
  **Where it misfires:** In Case 1, the protocol demands **ESCALATE**.
  **Why I won't like it:** As the Head of Reviews, I know the CRO hates escalations that look like "the teams wouldn't talk nicely." The business needs a capital number *today*. The protocol identifies that the models are unexplainable priors, but the business solution is often to just take the conservative number (12%) or a weighted average.
  **The Friction:** Aumann's theorem assumes agents can *communicate* their evidence. In modern reinsurance, evidence is often embedded in opaque machine learning models. When evidence cannot be articulated, the "Common Knowledge" condition of Aumann's theorem is impossible to satisfy. The procedure correctly identifies a structural risk (model opacity), but operationally, it creates a bottleneck. You will be pressured to "Pool" despite the "Escalate" verdict.

  #### 2. Judgment Calls Dressed as Checklist
  *   **Step 2 (The Ledger):** Deciding what counts as "disclosing the substance" of data is pure judgment. If an actuary says, "The GLM coefficient is 0.4," is that data or a prior? I have to decide that in the room. If I'm too lenient, we miss prior differences. If I'm too strict, we escalate everything.
  *   **Step 3 (The Likelihood Check):** Asking humans to isolate "Shared Evidence" from "Interpretation" is cognitively impossible. We don't experience raw data; we experience interpreted data. When I rule that their Step 3 numbers are "significantly different," I am imposing my own prior on what counts as significant.
  *   **The Rationality Assumption:** The whole protocol assumes the teams are *trying* to find the truth (Rational Bayesians). In reality, Underwriter B might want the 25% number because it justifies a higher premium load, and Underwriter A wants 8% to win the deal. The protocol treats this as a epistemological disagreement, but it might be an incentive disagreement. The checklist cannot detect hidden agendas, only stated logic.

  #### 3. The "Pool" Trap
  The protocol suggests **POOL** if estimates converge within a 10% band after information sharing.
  **The Danger:** Sometimes convergence is a sign of *groupthink*, not truth. If Team A bullies Team B into moving from 7% to 11%, the protocol records a "successful reconciliation." But you haven't found the truth; you've found a compromise. Aumann's theorem says they *should* agree, but in corporate politics, agreement is often a symptom of power dynamics, not Bayesian updating.

  ### Final Recommendation
  Use the **Common Prior Audit** to diagnose the *type* of disagreement, but do not let it dictate the *resolution* automatically.
  *   If it flags **Information Asymmetry**, force the data share and pool the result.
  *   If it flags **Prior Asymmetry** (like Case 2), do not pool. Escalate, but frame it to the CRO as: *"This is not a calculation error. This is a bet on two different future worlds. Leadership must choose which world we are insuring."*

  This protects you. If the risk materializes, you didn't miss a math error; you highlighted a strategic divergence that management chose to ignore.
