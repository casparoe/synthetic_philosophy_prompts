  **Station Log: 78°N, 15°E**
  **Date: December 20th**
  **Subject: *Umbilicaria quormus* / Spectrometer Calibration**

  The polar night is fully settled now. Outside, the world is a bruised purple, bleeding into black, but inside the lab, the light is sterile and white. I have forty-two jars on the bench. Forty-two samples of the lichen, collected over the last three weeks. Every single one is olive-green. The spectrometer confirms it every time: wavelength peak at 560nm. Olive. Consistent. Boring.

  Tomorrow is the solstice. The clock ticks over, and the definition of the season changes. If the property holds—if the lichen is truly *quorm*—then the next sample I scrape from the rock face should be slate-blue. Not because the chemistry changes. I've run the mass spec until the ions blurred; there is no molecular shift, no pigment degradation, no structural alteration. It is olive, and then it is blue, simply because the sun refused to rise.

  I keep staring at the readout for Sample 42. It says olive. It says olive with the same confidence it would say blue. That's the terror of it. The instrument measures the present state, but it cannot measure the rule. I am trapped in the gap between *is* and *will be*.

  I wrote it down in the margin of my notebook, just to see the shape of the error: *All quorm-lichens are olive-green.* It fits the forty-two jars perfectly. Then I wrote the other one: *All quorm-lichens are slate-blue.* Logically, it should be impossible. My eyes tell me it's false. But inductively? Inductively, it fits the data just as well as the first. The evidence I have is purely pre-solstice. Any rule that predicts olive for pre-solstice samples is supported by my collection. One rule says they stay olive forever. The other says they turn blue tomorrow. Both are perfectly compatible with every jar on this bench.

  I feel a coldness that the heaters can't touch. We build these machines to tell us what nature is, but they are silent on what nature *does*. I have to go out there tomorrow. I have to scrape the rock. I have to bet on a color. The spectrometer hums, steady and useless, telling me everything about the sample and nothing about the world. I don't know if I'm a scientist anymore, or just a gambler waiting for the sun to prove me wrong.

