answer: |-
  To rehabilitate memetics from a loose metaphor into a rigorous explanatory program for digital culture, we must resolve the ontological and mechanical fractures introduced by algorithmic mediation. The core challenge is that traditional memetics assumes a direct coupling between human cognitive salience and transmission probability. Platform capitalism decouples these: transmission is mediated by engagement-optimizing algorithms that operate on timescales and logics distinct from human cognition.

  To determine if memetics survives this decoupling, I propose the following prioritized research agenda. The ranking is determined by **upstream dependency** (ontological prerequisites), **explanatory tractability** (can the variable be operationalized?), and **downstream impact** (does resolving this allow other fields to proceed?).

  ### 1. The Coupled Replicator Problem (Unit of Selection)
  **Question:** Is the unit of selection the cultural artifact (the meme), the distribution vector (the algorithmic feed), or a hybrid assemblage of both?

  **Ranking Defense:**
  *   **Upstream Dependency:** This is the foundational ontological hurdle. Evolutionary theory requires a definable replicator. If the algorithm actively selects, mutates, and distributes content, it is not merely an environment; it is a participant in the replication machinery. If we cannot define whether the "gene" is the image macro or the *engagement pattern* that sustains it, we cannot measure fitness or heredity. Resolving this makes the subsequent questions tractable; failing to resolve it renders the entire framework category-error prone.
  *   **Downstream Impact:** This determines the scope of cultural epidemiology. If the unit is hybrid, we must study platform architecture alongside cultural content. If the unit remains the meme, algorithms are merely environmental pressure. The former requires a revolution in social science methodology; the latter requires only adjustment.
  *   **Tractability:** High, but conceptually difficult. It requires moving from substance-based ontology (what the meme *is*) to process-based ontology (what the meme *does* within the system).

  **Required Progress:**
  *   **Conceptual Clarification:** We need a formal definition of a "digital replicator" that incorporates the *affordances of transmission* as part of the replicator's phenotype. A meme that cannot be algorithmically boosted is effectively sterile; therefore, "boostability" is a trait of the meme, not just the environment.
  *   **Formal Modeling:** Develop agent-based models where the "environment" (the algorithm) has its own fitness function (profit/retention) that interacts with the replicator's fitness function (salience). We need to see if stable lineages emerge from this conflict or if the system enters chaotic oscillation.

  ### 2. The Fitness Decoupling Problem (Selection Pressure)
  **Question:** How do we model cultural evolution when cognitive fitness (memorability/truth) and algorithmic fitness (engagement/virality) diverge or contradict?

  **Ranking Defense:**
  *   **Downstream Impact:** This is the most critical question for explaining *directionality* in cultural change. Traditional memetics explains cultural change via human psychology (e.g., minimally counterintuitive concepts spread better). If algorithms select for outrage or polarization regardless of cognitive retention, the explanatory power of psychological memetics collapses. Resolving this determines whether memetics explains *human* culture or *machine-mediated* signal propagation.
  *   **Upstream Dependency:** This depends on Q1 (knowing what is being selected), but it is upstream of Q3 (lineage). You can trace a lineage without knowing why it survived, but you cannot explain cultural *change* without understanding the selection pressure.
  *   **Tractability:** Moderate. It relies on empirical data access (platform APIs) which is restricted, but the conceptual framework is clear: it is a multi-level selection problem.

  **Required Progress:**
  *   **Empirical Constraint:** We need comparative studies of transmission chains in "algorithm-free" environments (e.g., private messaging, email chains) versus "algorithm-heavy" environments (e.g., TikTok For You pages). This isolates the algorithmic selection pressure from human cognitive bias.
  *   **Formal Modeling:** A dual-fitness function model. Cultural variants must be assigned two fitness values: $W_c$ (cognitive) and $W_a$ (algorithmic). Research must determine the weighting function: does $W_a$ override $W_c$ at a certain threshold of amplification?

  ### 3. The Lineage Integrity Problem (Fidelity and Mutation)
  **Question:** Does algorithmic transformation (compression, auto-captioning, remixing tools, context collapse) constitute "mutation" in the evolutionary sense, or does it break the chain of heredity entirely?

  **Ranking Defense:**
  *   **Tractability:** This is the most technically solvable problem. We can measure hash differences, metadata changes, and semantic drift.
  *   **Upstream Dependency:** This is downstream of Q1 and Q2. If we don't know the unit (Q1) or the pressure (Q2), measuring mutation rates is meaningless. However, it is essential for the "historical" aspect of memetics. If fidelity is too low, there is no cumulative culture.
  *   **Downstream Impact:** Crucial for distinguishing between "viral noise" and "cultural evolution." If algorithmic mutation is random noise, memetics cannot explain long-term cultural structures. If algorithmic mutation is biased (e.g., algorithms favoring shorter, loopable video), it constitutes a directed evolutionary force.

  **Required Progress:**
  *   **Conceptual Clarification:** Redefine "fidelity." In digital culture, perfect copyability (Ctrl+C) coexists with radical decontextualization. We need a metric for *semantic fidelity* versus *bitwise fidelity*. A meme might be bitwise identical but semantically inverted by a new caption generated by a platform tool.
  *   **Empirical Constraint:** Longitudinal tracking of specific cultural variants across platforms to measure "context collapse" rates. How much semantic information is lost when a meme moves from Twitter to TikTok to Instagram?

  ---

  ### Deprioritized Lines of Inquiry

  To maintain focus on rehabilitating memetics as an *explanatory* program, the following lines of inquiry should be deprioritized. Resolving them would not salvage the framework if the top three fail.

  **1. Normative Critiques of "Viral" Culture**
  *   **Reason for Deprioritization:** Questions regarding whether algorithmic culture is "good," "democratic," or "harmful" are ethical and political, not explanatory. While vital for policy, they do not help determine if memetics is a valid scientific model. A theory can be explanatory even if the phenomenon it explains is deleterious. Focusing on normativity distracts from the mechanical analysis of transmission.

  **2. The Origins of the First Digital Meme**
  *   **Reason for Deprioritization:** Historical genealogy is less important than current mechanism. Whether the first meme was a GIF or a hashtag does not resolve the tension of algorithmic selection. Evolutionary theory is concerned with the *process* of selection, not the specific origin point of the population. This is a "just-so story" trap that offers little leverage on the conceptual tensions of fidelity and selection.

  **3. Individual Cognitive Psychology of Meme Consumption**
  *   **Reason for Deprioritization:** While human cognition is the substrate, the prompt specifies that selection pressures are now *engineered*. Deep diving into neuron-level retention mechanisms ignores the intermediary layer that now gates transmission. Unless we are modeling the human-algo interface, pure psychology is insufficient. The unit of analysis must shift from the individual mind to the socio-technical system.

  ### Summary of the Agenda

  The rehabilitation of memetics hinges on admitting that the "organism" has changed. It is no longer just the human mind hosting ideas; it is a hybrid system where algorithms act as both environment and co-replicator.
  1.  **Define the Unit:** Is it the content or the content-plus-distribution? (Ontological Priority)
  2.  **Define the Pressure:** How do we weigh human attention against machine optimization? (Explanatory Priority)
  3.  **Define the Heredity:** Does digital mutation allow for cumulative culture? (Historical Priority)

  If research demonstrates that the "unit" is incoherent, that "fitness" is purely arbitrary (engineered without pattern), or that "fidelity" is too low for lineage tracking, memetics must be abandoned as a metaphor. If, however, we can formalize the **Coupled Replicator**, model the **Fitness Decoupling**, and measure **Lineage Integrity**, memetics evolves into a robust theory of socio-technical evolution.
