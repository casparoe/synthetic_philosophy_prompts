answer: |-
  **The Scenario**

  Greenwood Machining Co-op runs on a Charter where Article 10 controls all rule changes. The current Article 10 states: "Amendments require a 75% supermajority. Any proposal to alter this Article 10 must explicitly cite the adoption date of the current version to be valid." The members, wanting easier governance, propose "New Article 10," which lowers the threshold to 51% and removes the citation requirement. The vote tally hits 80%, satisfying the old supermajority, but the proposal text fails to cite the adoption date of the old Article 10. The chair declares the change passed, and the co-op begins operating under the new 51% rule immediately, with no members objecting during the meeting.

  **The Verdicts**

  **(a) The Strict Formalist:** Invalid. The authority to amend Article 10 is conditional. The old rule says "If you want to change me, you must cite my birthdate." The proposal didn't cite the birthdate. Therefore, the condition wasn't met, the power to amend was never triggered, and the vote is null. The 75% rule remains in force, regardless of the 80% tally, because the *procedre* wasn't followed exactly.

  **(b) The Hart-Style Practitioner:** Valid. Law is a social fact, not just ink on paper. The "Rule of Recognition" here is what the members actually treat as binding. They voted, they accepted the count, they started using the new rule. Since the community collectively accepts the new 51% threshold as the standard for future conduct, it *is* the law. The missing citation is a technicality overridden by actual practice.

  **The Split**

  The structural feature forcing this split is the **self-entrenching validity condition** (the requirement to cite the prior version's date). This creates a logical loop where the rule tries to control the conditions of its own demise. If you remove this clause, the split collapses: the Formalist would accept the amendment because the 80% vote clearly satisfies the 75% threshold, aligning perfectly with the Practice view. The paradox only exists because the rule demands a syntactic key (the date) that the new rule refuses to carry.

  **My Position**

  I'm siding with the **Practice view**. Here's why: rules are tools for coordination, not magic spells. If every single member of the co-op agrees to the new rule and acts on it, insisting the old rule still applies is fiction. A charter derives its force from the people sustaining it; if they collectively shift their acceptance to a new text, the authority has migrated. Clinging to the "missing citation" ignores the reality that the co-op *is* its members, not the binder on the shelf.

  **The Formalist Counter-Attack**

  A formalist would tear this apart by arguing that accepting the Practice view destroys the point of having a charter. If a majority can ignore the amendment constraints whenever they "feel like it" (or simply agree in the room), then the 75% supermajority requirement was never a real constraint—it was just a suggestion. They'd say my scenario smuggles in a revolution under the guise of amendment. By ignoring the self-referential lock, the Practice view allows the co-op to bypass protections meant to safeguard minority interests, turning the charter into whatever the current mood says it is.
