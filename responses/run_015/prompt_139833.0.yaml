      *   *Look at the Fare Precedent:* "Fare structure... funded by a parking levy." *Refused*.
      *   *Distinction:* Airport = Capital Asset/Long-term structural change. Fare = Operating Budget/Annual management.
      *   *Congestion Rebate:* Is it Operating or Structural? It's annual revenue distribution. It looks like Operating Budget (Fare precedent).
      *   *Conclusion:* Part 2 is likely inadmissible under the Fare/Pay Cut precedent. Part 1 & 3 are admissible under Water/Airport precedent. Part 4 is borderline but leans toward inadmissible (micromanagement like EV mandate).

  8.  **Drafting the Advice:**
      *   **Recommendation:** Sever Parts 2 and 4. Clear Parts 1 and 3. (Or potentially Clear All if arguing the "Constituent" test, but that's risky given the Fare precedent). Let's stick to the strongest consistency: **Sever the operational mandates (2 & 4), Clear the constitutional frames (1 & 3).**
      *   **Principle:** "The Initiative Power extends to constitutional frames and constituent declarations, but not to specific budgetary executions or administrative technicalities." (Frame vs. Line).
