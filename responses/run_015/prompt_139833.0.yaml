answer: |-
  This is a delicate task. You are being asked to articulate the constitutional theory of your Commission implicitly through a ruling on admissibility. Your intuition that the Commission is operating with an unstated distinction between "frame" and "line" measures is astute; it is the only theory that successfully reconciles the *Nuclear-free* clearance (symbolic/constituent) with the *Fare Structure* refusal (operational/budgetary).

  Here is an analysis of the proposal, a recommendation for your opinion, and the principles required to sustain it.

  ### 1. Recommendation: Sever Parts 2 and 4; Clear Parts 1 and 3

  You should recommend that the initiative proceed to a vote **only in a severed form**, retaining the declaration of ownership (Part 1) and the procedural lock (Part 3), while removing the specific distribution mechanism (Part 2) and the technical transparency mandate (Part 4).

  **Why not clear it whole?**
  Clearing Part 2 (the 90% rebate) creates a direct conflict with the *Transport Fare* and *Executive Pay* precedents. Those initiatives were refused because they dictated specific budgetary outcomes and removed executive discretion over financial management. A mandated per-resident rebate is functionally identical to a mandated fare discount: it is a specific line-item allocation of public funds. To clear it would be inconsistent with the refusal of the fare initiative.

  **Why not return it as multi-subject?**
  You are correct that the *Data/Tax* precedent does not apply. The Airport initiative (Ban + Land Trust) establishes that functionally linked parts constitute a single subject. Revenue ownership, distribution, and the model used to calculate that revenue are a single fiscal ecosystem. Returning it on unity-of-subject grounds would contradict the Airport precedent.

  **Why not refuse it entirely?**
  Parts 1 and 3 are constitutionally distinct from Part 2. They resemble the *Water Rights* initiative (procedural lock on future decisions) and the *Airport* initiative (long-term constraint on asset use). Refusing the whole package would punish the authors for the inadmissibility of specific clauses, which is disproportionate when the core constitutional question (who owns the revenue?) is admissible.

  ### 2. The Closest Analogs

  *   **For Parts 1 & 3 (Clear):** The *Water Rights* initiative is the strongest analog. Both establish a procedural hurdle (a popular vote / a rebate lock) before the state can dispose of a specific resource (water / congestion revenue). The *Airport* initiative supports the entrenchment aspect (40-year ban / indefinite rebate lock).
  *   **For Part 2 (Sever):** The *Transport Fare* initiative is the controlling precedent. Both dictate how a specific stream of public money (parking levy / congestion charge) must be spent or returned. Both specify the beneficiary class (under-25s / all residents). The Commission refused the former; it must sever the latter to remain consistent.
  *   **For Part 4 (Sever):** The *Electric Vehicle* initiative is the analog. Requiring the publication of specific source code and assumptions is an operational mandate akin to naming a charging contractor and build-out schedule. It micromanages the administration rather than setting a constitutional frame.

  ### 3. The Principle to Adopt

  To bind the Commission in the future, your opinion should articulate the **"Constitutional Frame vs. Administrative Line"** test. This refines your hypothesis to account for the *Nuclear* outlier.

  **Draft Principle:**
  > "The Commission clears initiatives that establish constitutional frames—rules governing how future decisions are made, declarations of cantonal identity, or long-term constraints on assets. The Commission refuses or severs initiatives that prescribe administrative lines—specific budgetary allocations, operational mandates, or technical specifications that remove the Executive's discretion to implement the law."

  **How this fits the precedents:**
  *   **Frame (Cleared):** Airport ban (constraint), Water rights (procedure), Nuclear zone (identity/constituent).
  *   **Line (Refused/Severed):** EV mandate (operations), Pay cut (budget), Fare structure (budget/operations).
  *   **The Nuclear Exception:** This fits under "Constituent Identity." The people may declare what the Canton *is*, even if it binds no spending. Part 1 of the current proposal ("Revenue belongs to residents") fits here. Part 2 ("Send checks") does not; it is an action, not a status.

  ### 4. Exposing the True Test (The Hypothetical)

  You asked for a variant that would expose which test (yours, your colleague's, or the "Constituent" theory) the Commission is actually using. Consider this hypothetical future initiative:

  **The "Cantonal Divestment Initiative":**
  *   *Part A:* Declares the Canton morally opposed to investing in fossil fuel companies.
  *   *Part B:* Requires the Cantonal Bank to sell all such holdings within 24 months.

  *   **Under your "Frame vs. Line" test:** Part A is cleared (Constituent/Identity, like *Nuclear*). Part B is severed (Operational/Budgetary, like *EV Mandate*).
  *   **Under your Colleague's "Reversibility" test:** Both parts are hard to undo (market exit is costly). Both should be cleared.
  *   **Under the "Constituent" test:** Part A is cleared. Part B is refused (it's policy, not identity).

  If the Commission clears Part B, they are following the **Reversibility** test. If they sever it, they are following the **Frame/Line** test. If they clear A and refuse B entirely, they are following a strict **Constituent** test.

  ### 5. Addressing the Legitimacy Worry

  Your worry is profound: *"The more we sever the technical parts, the more we leave voters ratifying declarations whose operative content is settled elsewhere."*

  This is not a reason to change the practice, but it is a cost you must explicitly acknowledge in your opinion. Here is how to frame it:

  **The Cost of Coherence:**
  Severing Part 2 renders Part 1 ("Revenue belongs to residents") politically ambiguous. Without the rebate mandate, the Legislature could satisfy Part 1 by lowering taxes or improving services. Voters who want a direct check may feel their "Yes" vote is being diluted.

  **The Defense:**
  However, the alternative is worse. If the Commission allows Part 2, it permits the electorate to bypass the Executive's constitutional duty to manage the budget. The *Fare Structure* precedent established that the people cannot vote themselves specific line-items that tie the administration's hands on *implementation*.
  By severing Part 2, you are not silencing the voters; you are forcing the initiative to operate at the constitutional level (Ownership) rather than the statutory level (Disbursement). This preserves the separation of powers. The "hollow mandate" risk is the price of ensuring that initiatives remain *law-making* rather than *administration*.

  **Recommendation for the Opinion Text:**
  Include a paragraph acknowledging that severance may reduce the initiative's political clarity. State that while the Commission regrets any diminution of the voters' ability to mandate specific outcomes, its primary duty is to ensure the initiative complies with the constitutional division of powers. The voters remain free to approve the principle (Parts 1 & 3) and then elect a Legislature committed to implementing the rebate voluntarily.

  ### Summary of Action Items for Your Draft

  1.  **Ruling:** Clear Parts 1 & 3; Sever Parts 2 & 4.
  2.  **Reasoning:** Parts 1 & 3 are "Constitutional Frames" (Water/Airport precedents). Parts 2 & 4 are "Administrative Lines" (Fare/EV precedents).
  3.  **Principle:** Codify the "Frame vs. Line" distinction to guide future Commissions.
  4.  **Acknowledgment:** Explicitly note that severance creates a gap between principle and implementation, but argue this is necessary to protect the Executive's constitutional role.

  This approach allows you to remain consistent with the archive, uphold the separation of powers, and provide a clear theoretical foundation for your colleagues to use in the future.
