      *   *Decision:* I will recommend **Severing Part 2 and 4**, Clearing 1 and 3. This aligns best with the "Frame vs. Line" theory which explains the most precedents (including the Nuclear outlier as "Constituent"). It protects the Commission from the accusation of allowing budget micromanagement (Fare/Pay Cut precedents).
      *   *Wait, one more check:* The Airport initiative had "Ban expansion" (Rule) + "Transfer land" (Allocation). Both cleared.
