      *   **The "Test" Exposure:** A hypothetical initiative demanding "The Cantonal Bank must invest 50% of reserves in local bonds." (Budgetary mandate vs. Investment policy).
      *   **Addressing the Worry:** Acknowledge the cost. Severance creates "zombie mandates." But the alternative is violating the separation of powers (Executive duty to budget). The Commission protects the *process*, not the *coherence* of the political message.

  9.  **Refining the Argument (Self-Correction):**
      *   *Wait, check the Airport Precedent again:* "Transferring freed land to a public land trust." That is a specific allocation of assets. Why was that cleared but the Fare Levy refused?
      *   *Hypothesis:* Land is capital/one-off. Fares are recurring/operational.
