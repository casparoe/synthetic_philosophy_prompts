answer: |-
  This is a high-stakes, low-resource environment. You are right to be paranoid. Goodhart's Law isn't a theory here; it's a payroll risk.

  You asked for a procedure, not a lecture. Below is the **Impact Metric Stress Test (IMST)**. It is designed to run in 90–120 minutes.

  Regarding your three ideas: Your instinct on **negative-space metrics** is correct—they are traps. Measuring the *absence* of harm incentivizes hiding harm. I am swapping that idea for **"Participant Voice Check."** It achieves your goal (finding hidden harm) but actively seeks truth rather than passively waiting for silence. I have integrated this into Step 4.

  ### Part 1: The Procedure (Impact Metric Stress Test)

  **Timebox:** 120 Minutes max.
  **Participants:** Impact Lead (you) + 1 Caseworker (rotating) + 1 Board/Finance rep (optional for Step 6).
  **Output:** A Risk Rating and a Usage Category for the metric.

  #### Step 1: The Denominator Lock (15 mins)
  *Before measuring the numerator, lock the pool.*
  *   **Question:** Exactly who is in the denominator, and who has the power to move them out?
  *   **Good Answer:** "All signed intakes between Jan 1–Mar 31. Exits require Director approval + documented reason code."
  *   **Bad Answer:** "Active participants." (Defines "active" loosely).
  *   **Action:** Write the definition down. Any change requires a contract amendment or Board vote.

  #### Step 2: The Gaming Surface (30 mins)
  *Brainstorm the cheapest ways to move the number without moving the needle.*
  *   **Question:** If my bonus depended on this, how would I hit the number while helping the fewest people possible? Include denominator gaming (creaming, parking, pausing).
  *   **Good Answer:** A list of at least 3 specific scenarios (e.g., "We count a 1-hour gig as a job," "We pause participants who look like they might fail").
  *   **Bad Answer:** "Staff wouldn't do that."
  *   **Action:** For every scenario listed, add a control in Step 4.

  #### Step 3: Incentive Alignment (15 mins)
  *Check who wins when the number goes up.*
  *   **Question:** Does the participant *have* to benefit for this number to go up, or can we benefit while they stay neutral/harm?
  *   **Good Answer:** "Participant must be employed for 90 days. We can't get paid unless they win."
  *   **Bad Answer:** "We get paid for hours delivered. Participant can sleep through class."
  *   **Action:** If the answer is "We can benefit while they stay neutral," mark Risk +1.

  #### Step 4: Shadow Measure & Voice Check (30 mins)
  *Define the audit. This replaces "Negative-Space Metrics."*
  *   **Question A (Shadow):** What is the slow, expensive, annoying truth we check this against? (e.g., tax records, employer calls).
  *   **Question B (Voice):** How do we ask the participant if the "good" outcome was actually good? (e.g., Random survey: "Are you still working?" "Did you feel pressured?")
  *   **Good Answer:** "Quarterly random sample of 20% of participants. Employer verification on 10% of placements."
  *   **Bad Answer:** "We trust the caseworker notes."
  *   **Action:** If no Shadow/Voice check is feasible, mark Risk +2.

  #### Step 5: Access & Frequency (15 mins)
  *Control the feedback loop.*
  *   **Question:** Who sees the live number, and how often?
  *   **Rule:**
      *   **Caseworkers:** See *their own* numbers only. Delayed by 2 weeks (reduces real-time gaming).
      *   **Impact Lead:** Sees aggregate live.
      *   **Board:** Sees aggregate, lagged by 1 quarter.
      *   **Public/Funders:** See lagged, audited aggregate.
  *   **Action:** If staff see real-time aggregate team performance, mark Risk +1 (peer pressure to game).

  #### Step 6: Risk Rating & Decision (15 mins)
  *Calculate the score and decide usage.*

  **Risk Scale (1–5):**
  *   **1 (Robust):** Hard to game, participant benefit required, shadow measure confirms.
  *   **2 (Manageable):** Some gaming surface, but controls in place.
  *   **3 (Warning):** **VALUES CALL.** Gaming is possible but requires ethical breach. *Handoff to Director/Board.*
  *   **4 (Dangerous):** Easy to game, shadow measure weak. *Internal Learn Only. Do not pay on this.*
  *   **5 (Toxic):** Incentivizes harm or exclusion. *Drop immediately (unless contractually forced).*

  **Usage Categories:**
  *   **Pay/Publish:** Risk 1–2.
  *   **Internal Learn:** Risk 3–4. (Track it, but don't tie money to it).
  *   **Drop/Compliance Only:** Risk 5. (If funder requires it, report it, but explicitly decouple from staff bonuses).

  ---

  ### Part 2: Running the Procedure on Your Metrics

  Here is the output of running the IMST on your three examples.

  #### Metric 1: Bonus for each participant still in a job 90 days after finishing.
  *   **Denominator Lock:** "Program Graduates." *Risk:* Staff push unready kids to graduate to start the clock.
  *   **Gaming Surface:** 1. Count "gig" work (Uber) as a job. 2. Pressure participant to stay in toxic job for 90 days then quit. 3. Re-enroll leavers as "new" to reset clock.
  *   **Incentive Alignment:** High. Participant must be employed.
  *   **Shadow/Voice:** Employer verification call (10% sample). Participant survey at day 100 ("Are you still employed?").
  *   **Access:** Staff see their own placements only.
  *   **Risk Rating:** **3 (Warning).**
  *   **Values Call:** Does "job" mean *living wage*? If a participant gets a $10/hr job they hate, you get paid.
  *   **Decision:** **Pay on this, but add a qualifier.** (e.g., "Job > $X/hr" or "Job + 90 days"). Use the Voice Check to ensure they aren't being pressured to stay.

  #### Metric 2: Training hours delivered.
  *   **Denominator Lock:** "Enrolled Participants." *Risk:* Keep people enrolled who should have left.
  *   **Gaming Surface:** 1. Stretch 1-hour content to 2 hours. 2. Count "lunch and learn" as training. 3. Discourage graduation to keep hours accruing.
  *   **Incentive Alignment:** **None.** You benefit (revenue/hours), participant can be bored/unemployed.
  *   **Shadow/Voice:** Completion rates. Participant satisfaction survey ("Was this useful?").
  *   **Access:** Staff see their own delivery logs.
  *   **Risk Rating:** **4 (Dangerous).**
  *   **Decision:** **Internal Learn Only.** Do not tie bonuses to this. It is an efficiency metric, not an impact metric. Use it to budget, not to reward.

  #### Metric 3: "No participant becomes homeless during the program." (Funder Contract)
  *   **Denominator Lock:** "Active Participants." *Risk:* **Creaming.** Do not enroll anyone currently housing-insecure.
  *   **Gaming Surface:** 1. Define "homeless" narrowly (e.g., "sleeping on couch" doesn't count). 2. Unenroll participant *before* they lose housing. 3. Participant lies to stay in program.
  *   **Incentive Alignment:** **Negative.** You benefit if they hide their status.
  *   **Shadow/Voice:** Third-party housing verification (expensive). Anonymous tip line for participants.
  *   **Access:** **Impact Lead Only.** Do not show this to caseworkers as a performance metric.
  *   **Risk Rating:** **5 (Toxic) for Bonuses.**
  *   **Decision:** **Compliance Only.** You cannot delete this (contract). But you must **decouple it from staff bonuses immediately.** If staff bonuses depend on this, they will not enroll homeless youth.
  *   **Mitigation:** Create a "Housing Support Fund." If a participant risks homelessness, you spend money to fix it. Measure *usage of the fund* as a positive metric (help seeking) rather than *incidence of homelessness* as a negative metric.

  ---

  ### Part 3: Limitations & The "Values Call"

  **Where this procedure fails (even if followed perfectly):**
  1.  **Collusion:** If the culture is "us vs. the funders," staff will game together and hide it from the Shadow Measure.
  2.  **Lag Time:** By the time the Shadow Measure (quarterly audit) catches the gaming, the bonuses may have already been paid. You need a **clawback clause** in bonus contracts.
  3.  **The "Good Worker" Paradox:** Your best staff may refuse to game the system and thus look like low performers compared to cynical staff. You need a qualitative override.
  4.  **External Shocks:** A recession hits. Job retention tanks. Staff lose bonuses despite working harder. You need a **force majeure adjustment** for macroeconomic shifts.

  **The "Values Call" Handoff:**
  This happens at **Risk Rating 3**.
  *   **The Trigger:** The metric works, but it feels icky (e.g., "We count any job, even if it pays below poverty line").
  *   **The Handoff:** You (Impact Lead) present the Risk 3 rating to the Executive Director/Board.
  *   **The Question:** "We can hit this number and get paid, but it might conflict with our mission statement Section X. Do we accept this risk?"
  *   **Why:** This is not a math problem. It is a mission problem. You cannot solve it with better stats.

  **Access & Frequency Note:**
  I placed this in Step 5. The critical rule is: **Never let the people being measured see the aggregate team score in real-time.**
  *   **Why:** If Caseworker A sees the team is short of the bonus target, they will pressure Caseworker B to "find" a job for a borderline participant.
  *   **Fix:** Individual dashboards only. Aggregate data is for management, lagged by 2–4 weeks.

  ### Summary of Recommendations
  1.  **Adopt the IMST** above. Run it quarterly.
  2.  **Swap "Negative-Space"** for **"Participant Voice Check."** Silence is not safety.
  3.  **Metric 1 (Jobs):** Keep for bonuses, but add wage/quality floor.
  4.  **Metric 2 (Hours):** Remove from bonuses. Use for budgeting only.
  5.  **Metric 3 (Homelessness):** **Remove from bonuses immediately.** This is the highest risk for creaming. Report to funder, but do not punish staff for participant tragedy.
  6.  **Clawback Clause:** Ensure bonus contracts allow you to reclaim money if fraud/gaming is found in the Shadow Audit.

  You are building a sensor network. Make sure the sensors aren't the thing that breaks the machine.
