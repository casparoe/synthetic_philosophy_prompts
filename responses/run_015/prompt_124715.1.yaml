answer: |-
  Use this checklist to minimize future plot debt by selecting the explanation that generates the fewest unresolved emotional obligations for visible characters.

  ### The Narrative Coherence Tax (NCT) Procedure

  **Step 1: The Hard Canon Check (Rule-Based Stop Point)**
  *   **Question:** Does this explanation directly contradict a stated fact in Volumes 1–[Current]?
  *   **Kill Criteria:** If yes, discard immediately. No amount of coherence saves a continuity error.
  *   **Action:** If multiple options survive, proceed to Step 2.

  **Step 2: Calculate the Narrative Coherence Tax (Rule-Based)**
  *   **Question:** For each surviving option, count the **Emotional Loose Ends** (characters left confused, hurt, or ignorant) and multiply by **Future Visibility** (scale 1–5, where 5 is main character status in remaining books).
  *   **Formula:** $NCT = \text{Loose Ends} \times \text{Visibility}$
  *   **Action:** Record the score. Lower is better.
  *   **Stop Point:** If one option has an NCT of 0 and others are >5, select the 0. If scores are within 2 points of each other, proceed to Step 3.

  **Step 3: Thematic Resonance (Values Judgment)**
  *   **Question:** Does this explanation reinforce the series' core theme (e.g., "redemption," "inevitable decay")?
  *   **Flag:** **VALUES CALL.** There is no math here; this is where you weigh moral weight against plot efficiency.
  *   **Action:** If an option has a slightly higher NCT but fits the theme perfectly, note it as a "Theme Candidate."

  **Step 4: The Artistic Gut Check (Procedure Surrender)**
  *   **Question:** Does the lowest NCT option feel sterile, boring, or out of character despite the math?
  *   **Flag:** **ARTISTIC GUT.** The procedure gives up here.
  *   **Action:** If the math wins but your intuition screams "no," override the NCT. If you are stuck between a Theme Candidate and an NCT Winner, flip a coin; the procedure cannot resolve taste.

  ---

  ### Application 1: Why the Protagonist Burned the Letter
  *Options: Shame, Protecting Recipient, Hiding Alliance.*
  *Context: Recipient is a co-lead (Visibility 5). Alliance Partner is a minor faction (Visibility 1).*

  1.  **Canon Check:** All three survive; no prior text confirms the letter's content.
  2.  **NCT Calculation:**
      *   **Shame:** Loose Ends: 1 (Protagonist carries guilt). Visibility: 5. **NCT = 5.**
      *   **Protecting Recipient:** Loose Ends: 1 (Recipient remains ignorant of danger). Visibility: 5. **NCT = 5.**
      *   **Hiding Alliance:** Loose Ends: 0 (Partner knows the truth; Recipient is irrelevant to the deal). Visibility: 1. **NCT = 0.**
  3.  **Thematic Resonance:** "Protecting" fits a hero arc; "Alliance" fits a political thriller arc.
  4.  **Result:** **Procedure selects "Hiding Alliance."**
      *   **Why you might dislike this:** It makes the protagonist seem cynical and transactional rather than heroic or vulnerable. It minimizes future plot debt by making the recipient irrelevant, which might undercut the emotional stakes of their relationship.
      *   **Procedure Limitation:** The NCT cannot measure the loss of reader empathy. If you need the protagonist to remain likable, you must override this result in Step 4.

  ### Application 2: Why the Side Character Vanished for Ten Years
  *Options: Prison, Secret Identity, Grief Flight.*
  *Context: Character returns in Vol 3. Family is minor (Visibility 2). Friends are majors (Visibility 4).*

  1.  **Canon Check:** All three survive.
  2.  **NCT Calculation:**
      *   **Prison:** Loose Ends: 2 (Family wonders why no visits; Friends wonder why no bail). Visibility: 3 (Avg). **NCT = 6.**
      *   **Secret Identity:** Loose Ends: 3 (Friends feel betrayed by the lie). Visibility: 4. **NCT = 12.**
      *   **Grief Flight:** Loose Ends: 1 (Self-isolation requires no explanation from others). Visibility: 1 (Character was absent). **NCT = 1.**
  3.  **Thematic Resonance:** "Secret Identity" is high excitement; "Grief" is high drama.
  4.  **Result:** **Procedure selects "Grief Flight."**
      *   **Why this works:** It isolates the trauma to the vanished character, leaving no unresolved obligations for the visible cast.
      *   **Procedure Limitation:** This cannot settle if "Grief" is too quiet for your genre. If you need action, "Secret Identity" has a higher tax but higher energy.

  ### Where the Procedure Fails
  The NCT cannot settle **moral weight versus narrative efficiency**. In the Letter scenario, the math demands the cynical "Alliance" choice, but if your series is about redemption, that choice destroys the theme. That conflict is a **Values Call** (Step 3). Furthermore, if two options tie on NCT and Theme (e.g., both score 0 and fit the mood), the procedure explicitly **gives up** (Step 4); you must rely on which image strikes you harder in the moment, as no rule can predict which version will write better prose.
