  Okay, let's put on our ontologist hats and look at the data. You've basically handed me a dataset of eight classified instances, and my job is to reverse-engineer the algorithm your friend Mara is running. In social ontology, this is the difference between asking "What is race?" and "What does Mara *think* she's doing when she calls race constructed?"

  Here is the breakdown of the reasoning, the competing rules I've identified, and how they play out on your new cases.

  ### Step 1: Reverse-Engineering Mara's Logic

  Looking at her eight verdicts, there are two dominant philosophical frameworks that fit her data perfectly. Both explain her past answers, but they rely on different criteria for what makes something "real" versus "made up."

  **Rule A: The "Mind-Independence" Rule (The Discovery Test)**
  *   **The Criterion:** Is this kind *discovered* (it exists regardless of what we think) or *invented* (it exists only because we agree it does)?
  *   **How it fits her 8 cases:**
      *   *Constructed:* Race, Money, Teenager, Citizen. None of these exist without human practices, agreements, or historical contexts. If humans vanished, "dollars" and "citizens" would vanish.
      *   *Not Constructed:* Height, Crows, Diabetes, Left-handedness. These rely on physical or biological facts. A crow is a crow even if we call it a "dog." A person is six feet tall (in physical space) even if we switch to meters.
  *   **Key Nuance:** Notice her reasoning on height: "the foot is made up but... it isn't up to us anymore." She distinguishes between the *unit of measurement* (conventional) and the *physical property* (mind-independent). She applies this same logic to Diabetes ("nobody took a vote on it").

  **Rule B: The "Interactive Kind" Rule (The Looping Test)**
  *   **The Criterion:** Does classifying something *change* the thing itself? (Philosophers like Ian Hacking call this "looping effects.")
  *   **How it fits her 8 cases:**
      *   *Constructed:* Race, Money, Teenager, Citizen. Being labeled a "teenager" changes how you act and how laws treat you. Being labeled a "citizen" grants you rights you didn't have before. The label interacts with the person.
      *   *Not Constructed:* Height, Crows, Diabetes, Left-handedness. Calling a crow a "crow" doesn't change its biology. Calling someone "six feet tall" doesn't make them grow or shrink. The label is passive.
  *   **Key Nuance:** This rule focuses on *causal power*. If the label feeds back into the object's behavior or nature, it's social. If the label is just a sticker on a static object, it's not.

  **The Problem:** Both Rule A and Rule B fit her past eight verdicts perfectly. In her examples so far, things that are mind-dependent (Rule A) also happen to be things that interact with human behavior (Rule B). To predict her next move, we have to find a case where these two rules give different answers.

  ### Step 2: Applying the Rules to the New Cases

  Here is where the rubber meets the road. The two rules diverge significantly on the Pluto case, but converge on the Absentee case.

  **Case 1: Is "Planet" Constructed? (The Pluto Case)**
