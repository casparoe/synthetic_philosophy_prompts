answer: |-
  Here is the specification for an adequate account of future contingents, ranked by constraint strength, followed by the conflict analysis and scorecard.

  ### The Specification: Adequacy Conditions

  **1. Retrospective Assessment (Non-Negotiable)**
  *   **Requirement:** If I assert "$p$ will happen" at $t_1$, and $p$ happens at $t_2$, then at $t_3$ it must be correct to say I spoke truly at $t_1$. Conversely, if $p$ fails, I spoke falsely.
  *   **The Case:** Without this, assertion and prediction lose their normative point. We cannot learn from past predictions, nor can we hold agents accountable for warnings or bets. A semantics that makes past future-claims *neither* true nor false once the event passes renders the practice of predicting incoherent.

  **2. Separation of "Will" and "Must" (Non-Negotiable)**
  *   **Requirement:** The semantics must distinguish between *future occurrence* ("It will rain") and *metaphysical necessity* ("It must rain").
  *   **The Case:** If "will" entails "must," then in an indeterministic world, no positive future contingent claim can be truly asserted. Prediction would collapse into prophecy of the inevitable. We routinely assert "will" without committing to causal determinism.

  **3. Probability Coordination (Non-Negotiable)**
  *   **Requirement:** The semantic account must allow rational credence in a future contingent to track objective chance (e.g., if chance is 0.5, credence 0.5 is rational).
  *   **The Case:** This is required for the practice of *betting*. If bivalence holds (the claim is already True or False), the Principal Principle suggests credence should be 1 or 0. An adequate account must explain why it is rational to be 50% confident in a proposition that (allegedly) already has a classical truth value.

  **4. Embedding under Conditionals (Non-Negotiable)**
  *   **Requirement:** The account must handle future contingents in the consequents of indicatives and subjunctives (e.g., "If you drop that, it will break").
  *   **The Case:** We reason with futures constantly. If the semantics of "will" breaks under embedding (e.g., due to scope issues with negation or modals), the logic of planning and warning fails.

  **5. Claims about Later Unsettledness (House Taste / High Bar)**
  *   **Requirement:** The account must make sense of "On Friday, it will still be open whether $p$."
  *   **The Case:** This tests whether the theory can represent the *persistence* of contingency. Many theories (Ockhamism) struggle here because if "$p$ will happen" is true now, it looks like it's settled now. However, a theory can fail this and still handle prediction/betting adequately. This is a test for *metaphysical fidelity*, not linguistic competence.

  **6. Classical Inference / LEM (House Taste)**
  *   **Requirement:** Does "$p$ or not-$p$" hold for future contingents?
  *   **The Case:** This is the primary battleground, but it is a *theoretical* virtue, not a pre-theoretical datum. Ordinary speakers do not intuitively check instances of Excluded Middle for future events. Preserving classical logic is a cost-saving measure for the theorist, not a requirement of the practice of deliberation.

  ---

  ### The "Deliberation Needs Openness" Constraint

  **Verdict:** This is a **pragmatic prejudice**, not a semantic desideratum.

  **Reasoning:** Deliberation requires *epistemic* openness (I do not know what I will do), not *metaphysical* openness (there is no fact of the matter). An Ockhamist can deliberate perfectly well: they treat the future as fixed but unknown to them. To demand that the *truth conditions* of "will" encode metaphysical indeterminacy is to conflate the *content* of the assertion with the *context* of the agent. The requirement should be reformulated as: "The account must explain why agents treat the future as unsettled," which is compatible with the future being semantically settled (Ockhamism) or unsettled (Peirceanism). Do not build this into the truth conditions; build it into the pragmatics.

  ---

  ### The Unsatisfiable Triad

  You cannot satisfy the following three requirements simultaneously. You must drop one.

  1.  **Contextualism:** The truth value of a future contingent is fixed entirely at the context of *utterance* (independent of the context of *assessment*).
  2.  **Non-Bivalence:** Future contingents are neither true nor false at the time of utterance (to preserve Openness).
  3.  **Retrospective Assessment:** Past future-claims are determinately true or false now, based on what actually happened.

  **The Conflict:**
  *   If you keep **Contextualism** and **Retrospective Assessment**, you must accept **Bivalence** (Ockhamism). The truth was there all along; we just didn't know it.
  *   If you keep **Non-Bivalence** and **Retrospective Assessment**, you must drop **Contextualism** (Relativism). The claim wasn't true *then*, but it is true *now* relative to this assessment context.
  *   If you keep **Contextualism** and **Non-Bivalence**, you must drop **Retrospective Assessment** (Supervaluationism/Peirceanism). The claim was indeterminate then, and remains indeterminate now (or shifts to a "would" claim), making it hard to say the original "will" claim was simply *true*.

  ### The King Constraint

  **Retrospective Assessment** does the most work in ruling views out.

  **Reason:** It is the hardest phenomenological datum to deny. We *do* say "I was right." Pure Open Future views (like simple Supervaluationism) fail here because they render past predictions neither true nor false even after the fact. Determinism avoids this but fails Openness. Relativism saves it by complicating the notion of truth. Ockhamism saves it by complicating the notion of openness. But any view that cannot validate the truth of a successful prediction is dead on arrival for the purposes of explaining assertion and betting. Retrospective Assessment forces you to choose between Ockhamist metaphysics or Relativist semantics.

  ### Ordering of Defense

  If I were defending a seminar position, I would order the constraints as follows:

  1.  **Retrospective Assessment:** (The Anchor). If the theory can't explain why I was right when my prediction came true, it doesn't matter how nice the logic is.
  2.  **Probability Coordination:** (The Rationality Check). If the theory makes it irrational to bet 50/50 on a coin toss (by forcing credence 0 or 1), it fails to model agency.
  3.  **Separation of Will/Must:** (The Modal Check). Ensures we aren't smuggling in determinism.
  4.  **Classical Logic:** (The Theoretical Cost). I am willing to sacrifice LEM for future contingents if it saves Retrospective Assessment and Probability Coordination. Logic is a tool; prediction is the data.

  ### Scorecard: The Big Three

  | View | Retrospective Assessment | Openness (Non-Bivalence) | Classical Logic (LEM) | Cost Paid |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ockhamist** | **Pass** (True all along) | **Fail** (Settled true/false now) | **Pass** | Sacrifices intuitive openness; makes "will" look like "settled". |
  | **Peircean** | **Fail** (Shifts to "would") | **Pass** (Indeterminate now) | **Fail** (LEM fails for "will") | Sacrifices the literal truth of past "will" claims; changes the subject. |
  | **Relativist** | **Pass** (True relative to now) | **Pass** (Indeterminate at utterance) | **Pass** (at index) | Sacrifices absolute truth; makes truth assessment-sensitive. |

  **Recommendation:** If your seminar cares about *logic*, push the Peircean line (save openness, dump LEM). If it cares about *language use and assertion*, push Relativism (save assessment and openness, complicate truth). If it cares about *metaphysics*, push Ockhamism (save truth and logic, complicate time). Given your prompt's focus on "what we are doing," **Relativism** offers the best fit for the spec, provided you can stomach assessment-sensitive truth.
