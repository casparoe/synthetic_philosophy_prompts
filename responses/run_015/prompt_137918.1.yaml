answer: |-
  Here is the decision procedure, the theoretical justification, and the case run-through you requested.

  ### The Theoretical Choice: Shared Intention as Interlocking Plans

  You asked me to pick one framework. I am selecting **Michael Bratman's theory of Shared Intention**.

  I reject the "Primitive Mode" account (Searle) because it treats collective intention as a black-box mental state. You cannot evidence a mental state with device logs. I reject the "Expressed Commitment" account (Gilbert) as too rigid for social media; it requires explicit agreement, which would fail your diaspora case (Case 2) and flag too many organic movements as suspicious because they lack a formal pledge.

  Bratman's framework defines a group not by what they *say* or *feel*, but by how their individual plans **mesh**. To be a "Shared Intention Group," participants must satisfy three conditions:
  1.  **Mutual Knowledge:** Each intends the activity *in light of* the others' intention.
  2.  **Mutual Responsiveness:** Each adjusts their sub-plan to support the others' success.
  3.  **Commitment to Joint Activity:** Each is committed to the joint activity *and* to supporting the other participants' roles.

  This works for T&S because it relies on **observable coordination**, not just similar output. It distinguishes a choir (Shared Intention) from a crowd singing the same song because the radio played it (Convergence), and from a puppet master moving 200 mouths (Single Will).

  ---

  ### The Decision Procedure: The "Interlock Test"

  This procedure is designed to be run by your analysts. It is ordered. If a case fails a step, you stop and categorize based on the failure reason. Do not proceed to the next step if the previous one fails.

  **Prerequisite Gate:** *Is there similar output?* (Same assets, same text, tight timing cluster). If No, close as non-coordinated. If Yes, proceed.

  #### Test 1: The Peer-Knowledge Link (Mutual Knowledge)
  **Question:** Do the accounts know about *each other*, or only about the source?
  **Theory Translation:** Shared intention requires that I intend to do X *because* I know you intend to do X. If I only know the Boss intends it, I am a tool, not a partner.
  **Observable Evidence:**
  *   **Pass:** Direct DMs between accounts; replies/mentions between accounts (not just to a hub); shared editable docs where multiple accounts edit; tags in private channels.
  *   **Fail:** All communication is One-Way (Hub → Spoke). Accounts never interact laterally. Operators claim ignorance of other handles (in leaks/confessions).
  *   **Verdict on Fail:** **Single Will / Hub-and-Spoke.** (This is CIB. It is not a "group" of people; it is one agent with many instruments.)
  *   **Verdict on Pass:** Proceed to Test 2.

  #### Test 2: The Meshing Link (Mutual Responsiveness)
  **Question:** Do the accounts adjust their behavior to help the others succeed?
  **Theory Translation:** In a shared intention, if you stumble, I adjust to cover you. In convergence, I keep doing my thing regardless of you.
  **Observable Evidence:**
  *   **Pass:** Account A boosts Account B's post when it flags; Account A changes hashtag because Account B reported it's shadowbanned; division of labor (some post images, some post text) to achieve a common trend; defending each other in comments.
  *   **Fail:** Identical posting regardless of context; no amplification of peer content; no tactical shifts when one account is banned.
  *   **Verdict on Fail:** **Algorithmic Convergence / Parallel Play.** (This is likely organic convergence driven by the recommender system. Clear.)
  *   **Verdict on Pass:** Proceed to Test 3.

  #### Test 3: The Agency Link (Commitment Ownership)
  **Question:** Who owns the commitment to the activity?
  **Theory Translation:** This is the T&S extrapolation. Bratman assumes free agents. We must verify the "intention" isn't bought or coerced.
  **Observable Evidence:**
  *   **Pass:** Diverse device IDs/IPs; no payment rails linking accounts; account history predates the campaign; varied linguistic fingerprints outside the campaign.
  *   **Fail:** Shared payment receipts; same device fingerprint across 50+ accounts; accounts created solely for the campaign; content calendars linked to a commercial entity.
  *   **Verdict on Fail:** **Coordinated Inauthentic Behavior.** (It is a Shared Intention Group, but the intention is rented. Enforce.)
  *   **Verdict on Pass:** **Organic Collective.** (It is a Shared Intention Group, and the intention is authentic. Clear for CIB, though check Harassment/Spam policies separately.)

  ---

  ### The Status of "We-Language" (Self-Description)

  Your boss believes "We-language" settles the question. You believe it is insufficient. The procedure above sides with you, but incorporates the Boss's intuition as **Corroborative Evidence**, not **Constitutive Proof**.

  **The Rule:** Self-description as a "We" counts as *positive evidence for Test 1 (Peer-Knowledge)*, but it cannot pass Test 1 on its own.

  **The Defense:**
  1.  **Why it's not enough:** Astroturfing playbooks explicitly instruct operators to use "We-language" ("We the people," "Our movement"). If we accept language as proof, we build an evasion pathway. A single operator can write "We are angry" 200 times. That satisfies the linguistic test but fails the *Mutual Knowledge* test (the 200 accounts don't know each other).
  2.  **Why it's not nothing:** Genuine movements *do* use "We-language." If we ignore it, we risk false positives on organic groups.
  3.  **The Compromise:** "We-language" raises the *probability* that Test 1 will yield positive evidence. It justifies the time spent looking for the DMs or the Discord links. But without the structural evidence (the DMs, the lateral replies), the "We" is treated as script.

  **Instruction to Analysts:** If a cluster uses "We" but fails Test 1 (no lateral knowledge), document the "We" usage but classify as **Single Will**. The Senior Reviewer's question ("What makes this a group?") is answered: "It claims to be a group, but structurally it is a single agent." That is a stronger enforcement case than "It's a group that broke the rules."

  ---

  ### Case Run-Throughs

  Here is how the procedure handles your three specific scenarios.

  #### Case 1: The Marketing Agency (200 accounts, shared calendar, operators don't know each other)
  *   **Test 1 (Peer-Knowledge):** **FAIL.**
      *   *Evidence:* Operators communicate only with the Hub (Manager). No DMs between the 200 accounts. Operators do not know the other handles.
      *   *Result:* This is not a "Shared Intention Group." It is a **Single Will**. The 200 accounts are instruments, not agents.
      *   *Enforcement:* **CIB Enforcement.**
      *   *Reviewer Note:* "This is not a collective. It is one commercial entity simulating a crowd. Fails Mutual Knowledge."

  #### Case 2: The Diaspora Activist Network (Public call, thousands post, no DMs, "We" language)
  *   **Test 1 (Peer-Knowledge):** **PASS.**
      *   *Evidence:* While there are no DMs, the *Public Call* serves as the common knowledge ground. Accounts reference the *movement* and each other's posts via the shared hashtag and replies to the hub that acknowledge the broader swarm ("Great to see everyone posting"). In Bratman's terms, the public square functions as the medium of mutual knowledge.
      *   *Nuance:* This is the hardest call. To pass, there must be evidence they see *each other*, not just the leader. Look for replies between participants ("Love your photo, sister") not just to the leader.
  *   **Test 2 (Meshing):** **PASS.**
      *   *Evidence:* Posting at the specific hour to maximize trend visibility is a meshing sub-plan. They are timing themselves to support the collective goal.
  *   **Test 3 (Agency):** **PASS.**
      *   *Evidence:* No payment rails. Diverse devices. Accounts pre-exist the campaign.
      *   *Result:* **Organic Collective.**
      *   *Enforcement:* **Clear (for CIB).**
      *   *Reviewer Note:* "Satisfies Shared Intention criteria via public mutual responsiveness. Agency is authentic."

  #### Case 3: The Fan Army (Review bomb, Discord, mutual defense, no payment)
  *   **Test 1 (Peer-Knowledge):** **PASS.**
      *   *Evidence:* Discord server creates explicit Mutual Knowledge. They know who the other participants are.
  *   **Test 2 (Meshing):** **PASS.**
      *   *Evidence:* "Mutual defense" norms mean if one is reported, others defend. They divide targets (some review bomb Movie A, some Movie B).
  *   **Test 3 (Agency):** **PASS.**
      *   *Evidence:* No payment. Fans are acting on their own volition.
      *   *Result:* **Organic Collective.**
      *   *Enforcement:* **Clear (for CIB).** *Note: This may violate Manipulation or Harassment policy, but it is not Inauthentic Behavior.*
      *   *Reviewer Note:* "High coordination, but authentic agency. Not CIB."

  ---

  ### Limitations and Extrapolations

  You asked for honesty about where the theory runs out.

  **1. Bots and AI-Generated Personas**
  *   **The Gap:** Bratman's theory assumes human agents with intentions. A bot has no intention; it has code.
  *   **The Fix:** The **Agency Link (Test 3)** must include a "Human Verification" gate. If device fingerprints or behavioral biometrics indicate automation, the case bypasses the philosophy and goes straight to "Inauthentic." Do not try to apply "Shared Intention" to bots. A network of bots is always a Single Will (the coder's will).
  *   **Extrapolation:** Treating "Device ID overlap" as a proxy for "Lack of Independent Agency" is operational logic, not philosophy.

  **2. Algorithmic Coordination**
  *   **The Gap:** Sometimes accounts coordinate because *we* told them to. The recommender system shows User A a post, then shows User B the same post, making them act alike.
  *   **The Fix:** This fails **Test 2 (Meshing)**. If they are responding to the Algorithm, not to each other, they are not adjusting sub-plans to support *each other*. They are adjusting to the feed.
  *   **Extrapolation:** Distinguishing "Response to Peer" vs. "Response to Feed" requires looking at the *network graph*. If edges are Star-shaped (all to Hub/Algo), it's convergence. If edges are Web-shaped (Peer-to-Peer), it's Shared Intention.

  **3. The "Loose Movement" (Case 2 Edge Cases)**
  *   **The Gap:** What if they feel like a "We" but never interact?
  *   **The Fix:** My procedure classifies this as **Convergence**, not a Group.
  *   **Risk:** This might annoy your Boss. If thousands post #Freedom with no lateral contact, my procedure says "Not a Group."
  *   **Defense:** For enforcement purposes, this distinction is vital. If they don't interact, they can't be *coordinated* in a way that is enforceable. You cannot ban a mood. You can only ban coordination. If there is no lateral link, there is no coordination to sever.

  ### Theory vs. Extrapolation Map

  To satisfy your Senior Reviewer's demand for rigor, here is the breakdown of what is theory and what is my operational translation:

  | Procedure Step | Theoretical Basis (Bratman) | Operational Extrapolation (My Addition) |
  | :--- | :--- | :--- |
  | **Test 1: Peer-Knowledge** | "Mutual Knowledge of Intention." | Equating DMs/Tags with Knowledge. Treating Public Hashtags as "Common Ground" for large groups. |
  | **Test 2: Meshing** | "Interlocking Sub-plans." | Treating "Review Bombing" or "Trend Timing" as Sub-plans. Treating "Defense" as Support. |
  | **Test 3: Agency** | "Commitment to Joint Activity." | Using Payment Rails and Device IDs as proxies for "Commitment Ownership." |
  | **"We-Language"** | Irrelevant (Mental state). | Treated as a "Claim" that triggers the test, not a result of the test. |
  | **Bot Handling** | N/A (Theory assumes humans). | Automatic fail on Agency if automation signatures are present. |

  ### Final Recommendation

  Adopt this procedure as the **Plurality Classification Matrix**.

  When your Senior Reviewer asks, "What makes this a group?", your answer is no longer "Vibes." Your answer is:
  1.  **Peer Knowledge:** "They know each other (DMs/Tags)."
  2.  **Responsiveness:** "They adjust for each other (Defense/Timing)."
  3.  **Agency:** "They own the intent (No Payment)."

  If Case 1 comes up, you say: "It fails Peer Knowledge. It is not a group; it is one actor."
  If Case 2 comes up, you say: "It passes Knowledge and Responsiveness via public signals. It is a group, but authentic."
  If Case 3 comes up, you say: "It passes all three. It is an authentic group. Policy violation may exist, but not CIB."

  This gives the Reviewer the structural distinction they demand, clears the organic cases you need cleared, and catches the commercial astroturfing that slips through "vibes" checks.
