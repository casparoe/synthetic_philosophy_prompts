answer: |-
  The argument is valid, but it rests on a false premise. You should reject step (6). This step asserts that collective obligations do not distribute to individuals when their specific contribution is causally inert. It looks sound because it respects the principle that 'ought implies can': if you cannot alter the outcome, you cannot be obliged to act. It treats the collective as a distinct agent, separate from the sum of its parts, allowing the group to bear a duty that no member shares. This preserves a clean view of individual agency where responsibility tracks causal leverage.

  However, (6) fails because it misconstrues the metaphysics of collective action. Collectives do not act over and above the actions of their members; they act *through* them. If a group ought to stop a harm, and stopping requires individual contributions, then each member ought to contribute their part, regardless of whether that specific part triggers the threshold. Rejecting (6) commits you to the view that fairness or participation can generate obligations even without difference-making. This is costly: it requires you to accept duties that feel futile in isolation. It means you must refrain from the chicken or the drive not because you save a bird or cool the planet directly, but because you refuse to be part of a harmful pattern. This dissolves the fragmentation laundering problem: you cannot escape obligation merely by splitting the harm among enough agents, because the duty attaches to the participation itself.

  Two attractive alternatives exist. First, you could reject (1), denying that morality is solely about outcomes. This costs you a pure consequentialist framework, admitting duties of integrity or complicity directly. Its plausibility is high, as it matches your intuition that redundant additions are wrong. Second, you could reject (2), insisting that expected difference is non-zero. This costs you the comfort of certainty, requiring complex probabilistic modelling of supply chains. Its plausibility is moderate; while technically true, the probabilities are often so vanishingly small they feel like philosophical fiction.

  Regarding your repairs, Repair A (expected difference) is rehabilitatable. Your friend's claim that the probability is unknowable is weak; morality routinely handles uncertainty. If there is a non-zero chance your abstention triggers a batch adjustment, the expected utility is positive, however small. This preserves (1) and saves you from (5). Repair B (participatory) is also viable but effectively rejects (1). It grounds the reason in joining a right-making pattern rather than causing a good outcome. This handles the lynching objection by specifying that the pattern must be morally good, not merely coordinated.

  On your specific worries: granularity dependence is a real feature of supply chains but should not dictate moral truth; duties should not vanish because a retailer changes software. Fragmentation laundering is impermissible; restructuring harm to dilute agency does not dissolve responsibility. Redundant additions are wrong because they constitute participation in harm, not just causation. Finally, the self-stabilising grain is a defect; if behaviour sustains the threshold that excuses the behaviour, the argument is circular and must be broken by individual refusal.

