answer: |-
  **Teaching Note: Defending the Rigidified Surrogate in Two-Dimensional Semantics**

  **To:** Graduate Seminar on Two-Dimensional Semantics
  **From:** Instructor
  **Re:** The "Rigidification Objection" to the Analysis of *A Posteriori* Necessity

  In our previous session, we established the basic machinery of the two-dimensional framework: the distinction between primary intensions (functions from worlds considered as actual to extensions) and secondary intensions (functions from worlds of evaluation to extensions, holding the actual world fixed). We saw how this handles the Kripkean case of "Water is H2O," assigning it a contingent primary intension (picking out whatever plays the "watery" role) and a necessary secondary intension (picking out H2O in all worlds).

  However, a persistent internal objection threatens to undermine this solution. The critic argues that the framework does not genuinely explain the necessity of "Water is H2O." Instead, it allegedly surreptitiously replaces the term "water" with a rigidified surrogate (e.g., "the actual watery stuff" or *dthat*[water]). Since the surrogate is necessary by stipulation, the framework appears to beg the question: it secures necessity only by changing the subject from the original term to a rigidified proxy.

  The following argument defends the legitimacy of the rigidified-term analysis. It contends that rigidification is not an external trick but a semantic resource inherent to the framework's modeling of reference, and that it preserves the *a posteriori* character of the identity without altering the subject matter.

  ### 1. The Shared Anchor and the Preservation of the *A Posteriori*

  The first task is to clarify the relationship between the original term ("water") and its rigidified surrogate ("actual water"). The objection assumes that because the secondary intension of "water" matches the primary intension of "actual water," the framework has abandoned the original meaning. This misunderstands what is shared between the two intensions and where the cognitive work lies.

  Strictly speaking, the primary intension of "water" and the primary intension of "actual water" are distinct functions.
  *   **Primary Intension of "Water":** Maps a world $w$ (considered as actual) to the extension of the watery role in $w$. (Contingent: XYZ in Twin Earth).
  *   **Primary Intension of "Actual Water":** Maps a world $w$ (considered as actual) to the extension of the watery role in the *actual* world (@). (Necessary: H2O in all $w$).

  However, these two intensions share a crucial semantic anchor: **they share the same reference-fixing condition evaluated at the actual world.** Both intensions rely on the descriptive content "the watery stuff" to determine an extension at the center of the matrix (the actual world). In the actual world, both intensions yield H2O.

  This shared anchor is precisely what preserves the *a posteriori* character of "Water is H2O." The *a posteriori* discovery is not that "H2O is H2O" (which would be trivial); rather, it is the discovery that the satisfier of the reference-fixing condition (the watery stuff) *is* H2O.
  *   The primary intension of "water" captures the *mode of presentation* (the watery role).
  *   The secondary intension (modeled by the primary intension of the surrogate) captures the *referent* fixed by that role in our world.

  The cognitive significance of the identity statement arises from the gap between the reference-fixing condition and the nature of the thing that satisfies it. We know the condition ("watery stuff") *a priori*, but we require empirical investigation to learn that H2O satisfies it. The rigidified surrogate isolates the referent (H2O) without erasing the fact that we accessed that referent via a contingent descriptive role. Thus, the framework explains the necessity (via the fixed referent) without eliminating the *a posteriori* element (via the contingent path to that referent).

  ### 2. Rigidification as Semantic Derivation, Not Stipulation

  The second worry is that rigidification is an external, speaker-independent operation that the theorist stipulates to force the desired modal result. If the framework simply defines "water" as "actual water" to make the sentence necessary, it is guilty of semantic engineering rather than semantic analysis.

  This objection fails to recognize that rigidification in two-dimensional semantics is not a stipulation *on* the language, but a formal modeling *of* the causal-historical theory of reference. The distinction between context and circumstance is not an artifact of the framework; it is a reflection of how natural kind terms function in modal discourse.

  When a speaker uses "water" in a counterfactual claim (e.g., "Water might not have been H2O"), they are not questioning the actual-world reference. They are holding the reference fixed (circumstance) while varying the world of evaluation. The "actual" operator in the rigidified surrogate merely makes explicit this implicit semantic behavior.
  *   **The Critic's View:** Rigidification adds a new operator ("actual") that changes the meaning.
  *   **The Defense:** Natural kind terms *already* function as rigid designators. The two-dimensional framework provides the tools to decompose this rigidity. The secondary intension *is* the intension of the term when the context of utterance is held fixed.

  Therefore, the rigidified surrogate is not a replacement term introduced by the philosopher; it is the semantic value of the original term when evaluated with the actual world fixed as the center. The framework derives the necessity from the distinction between the world *of* utterance (which fixes reference) and the world *at* which utterance is evaluated. Rigidification is the formal name for holding the context fixed. It is a discovery of semantic structure, not a stipulation of modal force.

  ### 3. Addressing the "Change of Subject" Objection

  Finally, we must confront the charge that "Water is H2O" and "Actual Water is H2O" are not the same sentence, and that the framework imports necessity by changing the subject. The critic insists that if the sentence is necessary only under the rigidified reading, then the framework has not accounted for the necessity of the *original* sentence.

  The defender owes the critic a precise account of **propositional identity**. In the two-dimensional framework, a sentence expresses different propositions depending on which intension we prioritize.
  1.  **The 1-Intension Proposition:** Contingent. True in worlds where the watery stuff is H2O.
  2.  **The 2-Intension Proposition:** Necessary. True in all worlds where H2O exists.

  When we assert "Water is H2O" as a necessary truth, we are asserting the **2-Intension Proposition**. The critic claims this is a change of subject. However, the subject matter (the substance in the world) remains H2O in both cases. What changes is not the subject, but the **mode of access** to the truth conditions.

  The sentence "Water is H2O" is not ambiguous in the way "bank" (river/finance) is ambiguous. Rather, it has a single semantic value that has two dimensions of evaluation. To say the subject has changed is to confuse the *character* (the rule for determining content) with the *content* (the proposition expressed).
  *   The *character* of "water" involves the watery role (1-intension).
  *   The *content* of "water" in a modal context is H2O (2-intension).

  When we say "Water is H2O is necessary," we are correctly reporting on the *content*. When we say "Water is H2O is *a posteriori*," we are correctly reporting on the *character*. The framework does not swap sentences; it distinguishes two ways in which a single sentence relates to the world. The necessity belongs to the proposition expressed (the secondary intension), while the *a posteriori* status belongs to the way that proposition is determined (the primary intension).

  ### Conclusion

  The rigidification objection assumes that capturing the secondary intension via a rigidified surrogate severs the link to the original term's meaning. The defense shows that this link is maintained through the shared reference-fixing condition at the actual world. Rigidification is not a stipulative trick but a formalization of how reference is fixed in natural kind terms. Finally, the "change of subject" charge dissolves when we recognize that necessity and aposteriority attach to different dimensions of the same semantic value, not to different sentences. The framework does not explain away the mystery of the necessary *a posteriori*; it locates it precisely in the gap between the two dimensions.
