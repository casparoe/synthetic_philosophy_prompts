  hey im a novelist messing around with a draft about two towns that end up beleiving the same conspiracy. in Grayport people just never run into outsider views because of how their fishing shifts and church groups work, while in Milltown people see outsider views all the time but theyve been taught to treat any outsider as compromised and untrustworthy. could you make an argument for the position that Milltown is in a worse epistemic predicament than Grayport, even though their beliefs are the same, and that just exposing Milltown folks to more contrary evidence wont fix it? i keep going back and forth on whether thats right.
