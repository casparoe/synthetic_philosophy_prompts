answer: |-
  Hey, this is a great angle. Most papers just pick a lane (bounded utility, risk-weighted, etc.) and defend it, but skipping the desiderata stage is why the literature talks past itself. If you're writing a chapter for a workshop, laying out the "job description" for a solution before hiring one is the right move.

  Here is a draft specification for the criteria section. I've broken it down into **Non-Negotiables** (things any adequate theory needs to handle) and **Camp Preferences** (where the schools of thought diverge). I've also included the analysis on the "unsatisfiable cluster" and the metaphysics worry you flagged.

  ### The Desiderata Specification

  #### I. Non-Negotiable Requirements
  *Any resolution that fails these is incomplete, regardless of its theoretical elegance.*

  **1. The Finite Valuation Recovery**
  *   **The Requirement:** The theory must derive a finite willingness-to-pay (WTP) for the Petersberg game.
  *   **The Reasoning:** The paradox exists precisely because standard Expected Utility (EU) yields $\infty$ while intuition and market behavior yield $\approx \$20$. A solution that leaves the rational price at infinity hasn't solved the paradox; it has just denied the data. It must explain the gap between the divergent mathematical expectation and the convergent rational price.

  **2. Continuity with Standard EU (The "Normalcy" Condition)**
  *   **The Requirement:** The resolution cannot invalidate EU reasoning for bounded, everyday gambles.
  *   **The Reasoning:** If your solution requires rewriting the axioms of choice so drastically that they no longer recommend maximizing expected utility for a coin toss worth \$10, you've solved the Petersberg paradox by breaking decision theory. The mechanism that caps the Petersberg valuation must "switch off" or become negligible for standard bounded distributions.

  **3. Principled Boundary Demarcation (No Ad Hoc Cutoffs)**
  *   **The Requirement:** If the solution involves a bound (on utility, probability, or time), the location of that bound must be derived from independent principles, not fitted to the paradox.
  *   **The Reasoning:** You can't just say "Utility caps at $10^{100}$" because that solves Petersberg. Why there? Is it physiological? Economic? Logical? If the boundary is moved slightly, does the paradox return? A solution relying on an arbitrary cutoff is vulnerable to "Super-Petersberg" variants (where the payoff is scaled to breach your specific cutoff).

  **4. Distinction Between Rationality and Bias**
  *   **The Requirement:** The theory must clarify whether refusing the high buy-in is a normative requirement of rationality or a descriptive fact about psychological limitation.
  *   **The Reasoning:** You cannot collapse rational risk-aversion into pure psychological bias. If the refusal to pay \$1 million is just "human error," then a perfectly rational agent *should* pay it (assuming infinite bankroll). If the refusal is *rational*, then EU is normatively incomplete. The criteria must force the author to pick a side: are we fixing the agent or the math?

  #### II. Camp Preferences (Negotiable)
  *These define the specific approach, but a theory can be adequate without satisfying all of them.*

  **1. Preservation of the EU Axioms (vs. Domain Restriction)**
  *   **The Preference:** Some demand EU remain intact for *all* possible lotteries (forcing Bounded Utility). Others allow EU to hold only for a specific domain of "feasible" gambles (allowing Unbounded Utility but Restricted Domain).
  *   **Status:** *Camp Preference.* You can have a valid theory either way, but you must declare which one you're doing.

  **2. Metaphysical Neutrality vs. Physicalism**
  *   **The Preference:** Does the solution require the world to be physically finite (no bank can hold infinite funds), or must it hold even in a Platonic realm of infinite resources?
  *   **Status:** *Camp Preference.* A physicalist solution (e.g., "the bank goes bust at toss 40") is valid for applied decision theory but fails for pure normative theory. A metaphysically neutral solution is harder but more robust.

  **3. Treatment of Small Probabilities**
  *   **The Preference:** Does the agent ignore sufficiently small probabilities (probability weighting/cumulative prospect theory), or do they treat them linearly but value the outcome differently?
  *   **Status:** *Camp Preference.* This is the main split between Risk-Weighted Expected Utility (Buchak et al.) and Classical Bounded Utility (Menger/Bernoulli).

  ---

  ### III. The "Unsatisfiable Cluster" Analysis
  *You asked if we can insist the mechanics are fine AND demand rational agents cap valuation without being ad hoc.*

  **The Trilemma:**
  There is indeed a jointly unsatisfiable cluster here. You generally have to drop one of these three:
  1.  **Unbounded Utility:** There is no upper limit to how good an outcome can be.
  2.  **Standard EU Maximization:** Rationality consists in maximizing the sum of $P \times U$.
  3.  **Finite Rational Price:** A rational agent should not pay an arbitrarily large amount to play.

  **The Tension:**
  If you keep (1) and (2), you get infinite price. To get (3), you must modify (1) or (2).
  *   **Modifying (1) [Bounded Utility]:** This risks the "Ad Hoc Cutoff" failure. Why does utility flatten? If you say "diminishing marginal value," Menger showed you can just scale the payoffs to overcome any specific concave function. To avoid this, you need a *hard* cap, which looks metaphysically suspicious (is there a specific dollar amount that adds *zero* value?).
  *   **Modifying (2) [Risk Weighting]:** This preserves Unbounded Utility but changes the aggregation rule. This avoids the ad hoc utility cap but violates the Independence Axiom. It's consistent, but it costs you standard EU.

  **Verdict:** You cannot have perfectly fine coin-toss mechanics (generating infinite EV), standard EU rationality, and a finite cap without a principled reason for the cap. If the cap comes from outside the math (e.g., "humans die"), it's a physical constraint, not a decision-theoretic one. If it comes from inside the math (e.g., "utility functions must be bounded"), it feels like a gerrymandered fix unless grounded in a deeper theory of value.

  ### IV. The "Hidden Metaphysics" Worry
  *Does keeping EU for normal bets but banning it for unbounded ones commit you to a hidden metaphysical claim?*

  **Yes, implicitly.**
  If you say "EU applies to bounded gambles, but not the Petersberg," you are effectively claiming that **unbounded gambles are not genuine choice objects.**
  *   **The Claim:** This often smuggles in a physicalist premise: that infinite sequences of payouts are physically impossible (due to entropy, finite matter, time limits).
  *   **The Risk:** If you are doing *normative* philosophy, this is a category error. Normative theory should tell you what to do *if* the game were offered. Saying "the game is impossible" dissolves the paradox but doesn't solve the decision-theoretic problem of how to reason about divergent series.
  *   **The Fix:** Your criteria should demand that the author state whether their solution is **ontological** (the game can't exist) or **normative** (the game exists, but don't play it). Mixing them is where the hidden metaphysics hides.

  ---

  ### V. Brief Orientation: How the Usual Moves Stack Up

  Here is how the standard resolutions fare against the desiderata above:

  **1. Bounded Utility Functions (Bernoulli, Menger)**
  *   **Pros:** Satisfies *Finite Valuation* and *Continuity with EU* (mostly).
  *   **Cons:** Fails *Principled Boundary*. Menger showed that for any bounded utility function, you can construct a "Super-Petersberg" game that breaks it. It often feels like fitting the function to the intuition rather than deriving it.
  *   **Metaphysics:** Implies value is finitely saturable.

  **2. Risk-Weighted Expected Utility (Buchak, etc.)**
  *   **Pros:** Satisfies *Finite Valuation* without capping utility. Handles the *Distinction Between Rationality and Bias* by framing risk-aversion as a rational attitude.
  *   **Cons:** Fails *Preservation of EU Axioms* (violates Independence). Some argue it collapses into EU with a transformed utility function anyway.
  *   **Metaphysics:** Neutral on infinity, but changes the logic of aggregation.

  **3. Cognitive-Boundedness / Psychological Arguments**
  *   **Pros:** Descriptively accurate.
  *   **Cons:** Fails *Distinction Between Rationality and Bias*. It explains why humans *don't* pay, not why they *shouldn't*. Weak for normative decision theory.
  *   **Metaphysics:** Naturalist.

  **4. The "Reject the Game" Strategy (Physical Impossibility)**
  *   **Pros:** Solves the *Ad Hoc* worry by appealing to physics (no bank has infinite money).
  *   **Cons:** Fails *Metaphysical Neutrality*. It turns a decision problem into an empirical claim. If a billionaire offers a truncated version (capped at 100 tosses), the EV is still huge ($2^{100}$), and the paradox resurfaces practically.
  *   **Metaphysics:** Strong physicalist commitment.

  ### Summary for your Chapter
  If you want to move the needle, your criteria section should argue that the field is stuck because everyone is trying to satisfy the **Non-Negotiables** while secretly treating their **Camp Preferences** as if they were non-negotiable.

  The "Unsatisfiable Cluster" suggests that a true resolution might require admitting that **Rationality is context-sensitive**: EU is the norm for bounded domains, but divergent series require a different normative logic (or a physicalist dissolution). The chapter that admits this tension explicitly, rather than hiding it behind a utility function, is the one that will stand out.

  *(Note: I've kept the "Petersberg" spelling as requested throughout.)*
