      *   *Requirement 3: No Ad Hoc Cutoffs.* If you bound utility, why *there*? If you bound probability, why *there*?
      *   *Requirement 4: Metaphysical Neutrality (or Clarity).* Does the solution require the world to be finite? Or can it handle the abstract math?
      *   *Requirement 5: Risk vs. Value.* Distinguish between "I don't value infinite money" (bounded utility) and "I don't trust the odds" (risk weighting).

  4.  **Addressing the "Jointly Unsatisfiable Cluster":**
      *   The user is worried about: (A) Game mechanics are valid + (B) Rational agents cap valuation + (C) No ad hoc boundaries.
