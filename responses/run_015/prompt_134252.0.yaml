  2.  **Deconstruct the St. Petersburgs Paradox (SP):**
      *   *The Setup:* A game with infinite expected value (EV) but finite willingness to pay (WTP).
      *   *The Problem:* Expected Utility (EU) theory says you should pay any finite amount to play. Intuition says you shouldn't.
      *   *The Core Tension:* Mathematical expectation vs. Rational choice vs. Psychological reality vs. Metaphysical possibility.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
