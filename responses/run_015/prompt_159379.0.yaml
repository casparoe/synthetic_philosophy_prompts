answer: |-
  **Scenario**

  You are the sole beneficiary of the Vance Estate Trust. Last year, the Trustee, Ms. Vance, reviewed your private correspondence and financial history to assess your compliance profile; she reports a 90% accuracy rate in predicting whether beneficiaries fulfill post-disbursement obligations. Based on that prediction, she irrevocably disbursed the $10,000 principal to your account yesterday. Today, she has invoked a standard clause requesting a $1,000 administrative adjustment from all beneficiaries, though you know you only received the principal because she predicted you would honor this request. The Trust terminates immediately upon your response, Ms. Vance retires tomorrow with no successor to receive reports, and the settlement records are legally sealed against future disclosure. You know the $10,000 is in your account regardless of your choice, and you know this payment will not alter the past disbursement or trigger any future interaction.

  ***

  **Demonstration**

  **Causal Decision Theory (CDT)**
  CDT recommends **Refusal**. The disbursement is a past, fixed event; the payment is a present action. There is no causal channel from the payment to the disbursement, nor to any future reward or punishment (the Trust terminates, Vance retires, records are sealed). The causal expected utility of paying is $-\$1,000$ (cost with no causal benefit), while the utility of refusing is $\$0$. Since the $\$10,000$ is already possessed, it is a sunk benefit and does not enter the calculation of the marginal decision.

  **Functional and Updateless Decision Theory (FDT/UDT)**
  FDT and UDT recommend **Payment**. These theories treat the agent's decision as the logical output of an algorithm that the predictor simulated. If the agent adopts the policy "Pay," the predictor (90% accurate) likely predicted "Pay," meaning the $\$10,000$ was disbursed. If the agent adopts "Refuse," the predictor likely predicted "Refuse," meaning the $\$10,000$ was never disbursed.
  *Arithmetic:*
  $EU(\text{Pay}) = 0.9 \times (\$10,000 - \$1,000) + 0.1 \times (\$0 - \$1,000) = \$8,100 - \$100 = \$8,000.$
  (Note: In the 10% error case where she predicted Refuse but I Pay, I pay the fee but received no principal, as disbursement was contingent on prediction).
  $EU(\text{Refuse}) = 0.9 \times (\$0 - \$0) + 0.1 \times (\$10,000 - \$0) = \$0 + \$1,000 = \$1,000.$
  (Note: In the 10% error case where she predicted Pay but I Refuse, I keep the principal and pay nothing).
  Since $\$8,000 > \$1,000$, the verdict is to Pay. The theories do not come apart here; both treat the decision as subjunctively linked to the prediction.
  *Break-even Accuracy:* The verdict flips when $EU(\text{Pay}) = EU(\text{Refuse})$.
  $p(9,000) + (1-p)(-1,000) = p(0) + (1-p)(10,000)$
  $10,000p - 1,000 = 10,000 - 10,000p$
  $20,000p = 11,000 \implies p = 55\%.$
  The stated accuracy (90%) clears the break-even (55%) by 35 percentage points.

  **Evidential Decision Theory (EDT)**
  EDT recommends **Refusal**. EDT conditions on the action to update the probability of world states. However, the agent *knows* the benefit is settled ($P(\text{Disbursed}) = 1$). The observation of the $\$10,000$ in the account screens off the evidential link between the current decision and the past prediction. $P(\text{Disbursed} | \text{Pay}) = 1$ and $P(\text{Disbursed} | \text{Refuse}) = 1$. Thus, paying provides no evidence of a better past state, only a certain cost.
  *Minimal Change for EDT:* To make EDT pay, introduce an unobserved correlated penalty. Suppose that if Vance predicted "Refuse," she also filed a sealed audit flag that will cost $\$20,000$ to resolve later, but the agent does not yet know if the flag exists. Paying is now evidence of being the "Compliant" type, which is evidence that the audit flag was *not* filed. EDT would then trade the $\$1,000$ payment for the probabilistic avoidance of the $\$20,000$ penalty based on the correlation, not causation.

  **Counterfactual Mugging vs. XOR Blackmail**
  This case is a **Counterfactual Mugging**, not XOR Blackmail. In XOR Blackmail, the *existence of the problem* (the request/threat) is contingent on the prediction (the letter is only sent if you would pay). In this scenario, the *benefit* (the $\$10,000$) is contingent on the prediction, while the request is actual. The structural difference is secured in the sentence: "you know you only received the principal because she predicted you would honor this request." The money's presence is the counterfactual stake, not the request's presence.

  **Load-Bearing Feature and Removal Tests**
  The load-bearing feature is the **temporal gap between prediction and decision combined with the irrevocability of the benefit**.
  1.  *Choice before disbursement:* If the agent chooses before receiving the $\$10,000$, CDT may Pay (as a causal investment). This removes the "mugging" tension where the benefit is sunk.
  2.  *Predictor reachable:* If Vance could be contacted to verify the prediction, the subjunctive link weakens; the agent might try to argue they are in the 10% error branch.
  3.  *Second round added:* If future trusts depended on this conduct, CDT would Pay for reputational gain.
  The constraint doing the real work is the **causal closure** (no future interaction/reputation), which forces CDT to treat the benefit as truly sunk.

  **CDT Attacks**
  1.  *The Single-Shot Defense:* A CDT theorist can argue that rationality is about maximizing utility in the *actual* causal situation, not the ex-ante policy. Since the money is *actually* here, refusing dominates paying in the only world that matters (the actual one).
  2.  *The Prediction Fallibility:* A CDT theorist can argue that 90% human accuracy is not nomological necessity. The agent can assert, "I am in the 10% where she was wrong," treating the prediction as a fixed historical fact rather than a logical mirror of the current decision.

  **Honest Note**
  This scenario requires the reader to accept the "sealed record/retiring trustee" constraint as physically robust in a human bureaucracy. Students may intuitively doubt that reputation or future consequences are truly zero (e.g., Vance might talk at a golf club), which would inadvertently reintroduce causal incentives for CDT to Pay. The case relies on the stipulation of total informational isolation holding firm.
