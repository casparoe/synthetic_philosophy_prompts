  To nail this, I need to amplify the commercial imperative behind historical simplification. The editor isn't lying; she believes clarity sells. I'll exaggerate the demand for inevitability and the distaste for ambiguity. Load-bearing constraints include maintaining professional warmth; if she sounds hostile, the satire breaks. She must sound like she's helping him win. The key is to treat complexity as a structural flaw rather than an intellectual virtue. The editor sees nuance as friction that slows the reader's journey up the ladder.

  INTERNAL EDITORIAL MEMO
  TO: Professor Emrys Kettleborough
  FROM: Sarah Jennings, Editorial Director
  DATE: 14 October 2023
  SUBJECT: Manuscript Notes – *The Ladder*

  Dear Emrys,

  Thrilled to confirm *The Ladder* as our summer lead. The four number-ones on my list didn't get there by accident; they understood that history must feel like destiny. We are very close, but I need you to tighten the narrative arc. The market is unforgiving of hesitation. Readers buy big ideas, not qualifiers. They want to know how we got here, not how we might have got there.

  Subtitle: *The Ladder* is strong, but the current subtitle lacks punch. We need three nouns. Something like: *Power, Grain, and God*. It signals the package immediately. Avoid verbs; verbs imply action, nouns imply states of being. We want permanence.

  Chapter One: You hedge on the cognitive shift. Readers need a switch, not a dimmer. Pin the whole thing on one crisp moment in the deep past when our species' brains switched on. Give it a date. 72,000 years ago? Specificity breeds confidence. If you say 'approximately', they wonder if you know. If you say '72,000', they know you know.

  Chapter Three: The transition section is too porous. You suggest societies might farm without kings. Insist that farming, cities, kings, writing, patriarchy, slavery and taxation are a package you buy together or not at all. If you allow one without the other, the ladder becomes a staircase, and readers lose the sense of ascent. It must be inevitable.

  Chapter Four: Cut the passage where you have some foragers planting in the spring and walking away from the fields in the autumn. It loses the shape. We need a clean break between wandering and settling. Nuance here looks like uncertainty. The reader wants to know when we stopped walking. Tell them.

  Chapter Six: The city without a palace is problematic. Cut the city that had no palace in it, or failing that to give it a pyramid, since readers need to know who was in charge. Architecture must signify hierarchy. If there's no throne, where did the history happen? A city without a ruler is just a village with better drainage.

  Chapter Seven: This is where geography does all the work. I praised it in our call, but look at the map. Rotate it so the arrows point somewhere more purposeful. East to West implies drift; North to South implies conquest. Make the landscape compel the movement. The contours should dictate the culture.

  Chapter Eight: The collapse chapter is the best thing in the book. Make the islanders' fate into a parable. However, gently advise against the new footnote where he concedes that the islanders didn't all die. Footnotes are where blockbusters go to lose their nerve. Tragedy requires finality. If they survived, it wasn't a collapse, it was a relocation. We need ecocide.

  Chapter Nine: My peer reader flagged that chapter nine lets people make choices. We'll need to fix that. Agency complicates the thesis. History should push them, not the other way around. Remove the optional pathways. People don't choose their rung; they are placed upon it.

  Voice: We need more inclusion. I want a target for how often the reader is folded into a "we". Every four pages, minimum. They must feel they are climbing the ladder, not watching you climb it. 'We discovered', 'We built', 'We fell'. Universalise the experience.

  Get these changes to me by Friday. We go to print in November. This is going to be huge, Emrys, but only if it's certain. Don't let the specialists bother you; they don't buy tickets. Stick to the ladder.

  Best,
  Sarah
