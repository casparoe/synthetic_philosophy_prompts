  I work nights as a security guard at a data centre, so there's a lot of dead time, and about a year ago I fell down a rabbit hole of forum threads about anthropic reasoning — the doomsday argument, the sleeping beauty coin-flip thing, that case where a philosopher concludes the universe must be enormous just from the fact that we're here. I've got no background in any of it, I just got hooked, and my friend Mara has read a lot more than me, so I've been trying cases out on her for months. Her record so far: on the doomsday argument she says it's legit, that noticing you're somewhere around the hundred-billionth human is a real reason to think the total number of humans won't be astronomically larger, though she won't say how strong; on the presumptuous philosopher case — and on the version where a machine creates either ten people or ten thousand and you wake up in a room and have to guess which batch it was — she says waking up tells you nothing and you should just keep your prior; on sleeping beauty she says one third, and when I pointed out that looks like exactly the same move as the one she rejected in the previous case, she told me I was muddling two different things. On the question of who exactly the pool is that you're supposed to be a random draw from, she said once that it's whoever could have been you, and that being the same species isn't what makes something count, and then ten minutes later said the doomsday argument is specifically about human beings, and told me I was nitpicking when I pointed out those don't obviously fit. The one she's never given a straight answer to is aliens: I asked whether learning that there's a civilization of a trillion conscious beings elsewhere in the universe should change how we reason, and she said she genuinely doesn't know. I've since found out the two rival rules have names, something like self-sampling and self-indication, and I think she's running the first one and rejecting the second, but there seem to be several versions of the sampling rule depending on how big the pool is, and nothing she's said pins it down.

  The new case I want to spring on her is this. Imagine two hypotheses about the future that we've somehow made exactly equally likely on all the ordinary evidence — the nukes, the biotech, the AI-risk stuff, all of it balanced out — so the only thing that could separate them is the indexical stuff. Under H1, we never manage to make digital minds, and the total number of biological humans who ever live is about a trillion. Under H2, we do make them: there end up being something like a trillion trillion digital persons, conscious, with experiences as rich as ours, and the biological human story runs exactly as it does under H1 — same population, same length, same trillion total — there's just this colossal extra population alongside it. We find ourselves as biological humans, fairly early, before any digital person has been built. Should that be evidence for H1? My own feeling is that it all turns on whether those not-yet-existing digital people are in the pool at all, and I also can't tell whether it matters that they'd probably run a thousand times faster in subjective time, so a year of external time would contain a thousand times as many moments of experience — does counting moments instead of persons make the argument stronger, or is that just me confusing myself again?

  So: what do you think she'll say, and more importantly what rules fit her verdicts so far equally well, what does each of them predict about the digital-minds case and about the sped-up version of it, which one would you bet she's actually running and why, and what case should I bring her next that would actually separate the ones still in play? I'm not after a verdict I can repeat at her, I want to know which part of the machinery is doing the work.
