prompt: |-
  I'm presenting a 25-minute workshop paper arguing that prosperity and public order in high-growth authoritarian regimes—specifically China and Singapore—do not morally justify authoritarian rule, nor do they reduce legitimacy to mere coercion. Instead, they generate a hybrid mechanism I call intertemporal reciprocity consent: citizens implicitly trade present political liberties for anticipated intergenerational prosperity, producing a conditional legitimacy claim that structurally collapses when growth stalls because the reciprocal obligation is broken, not because democratic input is suddenly demanded. The audience is a comparative-politics seminar of institutionalist empiricists, two rational-choice modelers, and one East-Asian-development-state sociologist; they are skeptical of normative philosophy entering causal analysis, fluent in performance-legitimacy debates, but unfamiliar with analytic consent theory, and they will prioritize identification strategies, micro-foundations, and the risk of conceptual stretching. Draft my Q&A prep sheet: the six objections I will actually face, ordered from most to least damaging, each phrased in the vocabulary of comparative politics or rational-choice theory rather than philosophy, with a concise two-minute reply and an explicit note on where that reply is softest. Specify which objection I should concede up front to establish credibility. Include the one question I am hoping nobody asks—the objection that targets the intertemporal reciprocity mechanism by demanding micro-level behavioral or survey evidence of explicit intergenerational trade-offs that my argument does not possess. Flag any reply that depends on conceptual distinction rather than empirical demonstration.
