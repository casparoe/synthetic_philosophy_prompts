answer: |-
  # Q&A Prep Sheet: Intertemporal Reciprocity & Authoritarian Legitimacy

  **Strategy Note:** Your audience views "consent" as a black box. Do not defend the moral validity of consent; defend the *causal utility* of the concept for explaining regime stability and collapse. Translate normative terms into behavioral expectations.

  **Concession Strategy:** **Concede Objection #2 (Conceptual Stretching) up front.** In your closing remarks or if the chair asks for limitations, admit that "Intertemporal Reciprocity" overlaps significantly with performance legitimacy literature. This disarms the "reinventing the wheel" critique and allows you to frame your contribution as a *refinement of the mechanism* (time horizons) rather than a new paradigm. This establishes credibility with the institutionalists.

  ---

  ### 1. The Micro-Foundations Challenge (The "Hope Nobody Asks")
  **Objection:** "You posit a specific individual-level calculation—trading liberty today for intergenerational wealth tomorrow. But you offer no survey data, vignette experiments, or behavioral evidence that citizens actually hold these intertemporal preferences. Isn't this just assuming the mechanism you need to prove? How do you distinguish this from simple habituation or fear?"
  *(**FLAG:** This is the question you hope nobody asks. It targets the lack of direct evidence for the core mechanism.)*

  **Reply:** "That is the primary limitation of this workshop draft. I am not claiming to measure the psychological state of 'consent' directly. Instead, I treat intertemporal reciprocity as a *revealed preference* inferred from macro-level behavioral equilibria. If legitimacy were purely coercive, we would see repression increase linearly with economic downturns. If it were purely performance-based, we would see immediate unrest at the first sign of slowdown. The 'intertemporal' claim predicts a specific lag: regimes survive short-term shocks but face legitimacy crises when long-term growth trajectories are revised downward. I am using the *timing of collapse* relative to *growth revisions* as the proxy for the mechanism, acknowledging I need survey work to validate the individual-level calculus in the next phase."
  *   **Weakest Point:** Admitting you are inferring preferences from macro outcomes risks tautology (explaining stability with stability).
  *   **Type:** [EMPIRICAL] (Attempts to pivot to observable implications).

  ### 2. The Conceptual Stretching Challenge
  **Objection:** "This sounds like 'performance legitimacy' with extra steps. Zhong, Zhao, and others have already argued authoritarian regimes trade output for input. What analytic leverage do you actually gain by calling it 'intertemporal reciprocity consent' rather than just long-term performance legitimacy?"
  *(**FLAG:** Concede partial validity here to establish credibility.)*

  **Reply:** "I concede there is significant overlap, and I should have engaged more deeply with the performance legitimacy literature in the draft. However, the analytic leverage lies in the *conditionality of the collapse*. Standard performance legitimacy suggests a threshold effect: growth drops below $X\%$, unrest ensues. My argument suggests a *breach of contract* effect. It explains why regimes can survive zero-growth years if the long-term promise remains credible (e.g., Singapore 1985), but collapse when the *future* promise is revoked (e.g., China's demographic cliff), even if current growth is positive. It shifts the independent variable from current GDP to *revisions in expected lifetime utility*."
  *   **Weakest Point:** Distinguishing "current performance" from "future expectations" is empirically difficult; they are highly correlated.
  *   **Type:** [CONCEPTUAL]

  ### 3. The Coercion/Collective Action Challenge
  **Objection:** "From a rational-choice perspective, 'consent' is irrelevant if the cost of rebellion exceeds the expected utility of regime change. Isn't the stall in growth just reducing the state's capacity to coerce, rather than breaking a reciprocal obligation? How do you identify the drop in legitimacy separate from the drop in coercive capacity?"
  *(**FLAG:** Rational-choice modelers will hammer this.)*

  **Reply:** "That is a competing hypothesis I need to test more rigorously. However, we observe cases where coercive capacity remains high during stagnation, yet the regime shifts strategies from persuasion to brute force. If legitimacy were purely a function of coercive capacity, the regime would not need to invest in propaganda or ideological campaigns during downturns; they would simply maximize repression. The shift in *mix*—from co-optation to coercion—suggests the 'voluntary' compliance component has degraded. I plan to use security spending as a proxy for coercive capacity to isolate the legitimacy variable."
  *   **Weakest Point:** Security spending is endogenous to threat perception, which is endogenous to legitimacy.
  *   **Type:** [EMPIRICAL]

  ### 4. The Selection Bias Challenge
  **Objection:** "You base this on China and Singapore. These are high-capacity, developmental states with unique cultural or historical contexts. How do you know this mechanism isn't specific to Confucian paternalism or city-states? Does this travel to resource autocracies or personalist regimes?"
  *(**FLAG:** Standard comparative politics objection.)*

  **Reply:** "I am not arguing this is a universal theory of authoritarianism, but rather a model for *high-growth institutional autocracies*. Generalizing to petro-states would be inappropriate because the revenue mechanism differs (rentierism vs. taxation/growth). However, the logic of intertemporal trade should apply to any regime where elite survival is tied to economic delivery rather than identity or ideology. I am currently looking at Vietnam as a most-similar case to test external validity within the developmental state category."
  *   **Weakest Point:** Limits the scope of the paper significantly, reducing its theoretical contribution.
  *   **Type:** [EMPIRICAL]

  ### 5. The Operationalization Challenge
  **Objection:** "You argue legitimacy collapses when growth stalls. But 'stall' is subjective. How do you operationalize the breaking point of the reciprocal obligation without cherry-picking the moment of unrest to define the stall?"
  *(**FLAG:** Methodological concern.)*

  **Reply:** "I avoid using unrest to define the stall. Instead, I use exogenous shocks to growth forecasts—such as IMF revisions or demographic projections—that occur *prior* to political instability. The argument is that the 'breach' occurs when the state can no longer credibly signal future growth, not necessarily when GDP hits zero. I will use a difference-in-differences approach comparing regimes facing similar growth shocks but differing in their ability to signal long-term stability."
  *   **Weakest Point:** Credible signaling is hard to measure quantitatively.
  *   **Type:** [EMPIRICAL]

  ### 6. The Normative Creep Challenge
  **Objection:** "You use the word 'consent,' which implies a moral justification. Are you arguing these regimes are legitimate, or just stable? You seem to be smuggling normative claims into a causal analysis."
  *(**FLAG:** Least damaging for this audience, but annoying.)*

  **Reply:** "To be clear, I am making no normative claims about the moral validity of the regimes. I am using 'consent' in the analytic sense common in political theory: a belief system that reduces enforcement costs. When I say 'legitimacy,' I mean 'the probability of voluntary compliance absent coercion.' The term 'reciprocity' describes the citizens' *perception* of the deal, not an ethical endorsement of it. I am describing a folk theory of legitimacy held by the subjects, not prescribing one."
  *   **Weakest Point:** None, provided you stick to the "belief system" definition.
  *   **Type:** [CONCEPTUAL]

  ---

  ### Summary of Flags
  *   **Reply depending on Conceptual Distinction:** Objection #2 (Performance Legitimacy), Objection #6 (Normative Creep).
  *   **Reply depending on Empirical Demonstration:** Objection #1 (Micro-foundations), Objection #3 (Coercion), Objection #4 (Selection), Objection #5 (Operationalization).
  *   **Most Vulnerable Reply:** Objection #1. You lack the micro-data to prove the mechanism exists. Relying on macro-proxies is your weakest empirical link.
  *   **Strategic Concession:** Objection #2. Acknowledge the overlap with performance legitimacy to show you know the literature, then pivot to the *time-horizon* distinction.
