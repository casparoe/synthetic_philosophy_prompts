      *Wait, one nuance on (6):* "Any artificial implementation remains syntactic at bottom." If (3) is true, neural implementation is *also* syntactic at bottom (computation). So (6) implicitly claims biological implementation is *not* merely syntactic. This directly contradicts (3). This confirms (3) vs (6) is the primary conflict.

