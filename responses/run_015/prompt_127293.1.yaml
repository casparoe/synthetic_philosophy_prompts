  **REPUBLIC OF EPISTEMIC POSITIONING**
  **MINISTRY OF SELF-LOCATION**
  **FORM 88-B: REFERENCE CLASS DECLARATION & ANTHROPIC INTAKE**

  **INSTRUCTIONS:** Pursuant to the Indexical Equity Act, all citizens must formally declare the reference class under which they claim entitlements, voting rights, and risk subsidies. Failure to specify a non-arbitrary class may result in default classification as a *Boltzmann Brain*, voiding all property rights. Select only one option per section. Mixing causal and evidential reasoning frameworks is prohibited.

  **SECTION 1: HEALTH RISK ALLOCATION**
  *Purpose: To determine mortality subsidies based on the denominator of surviving observers.*

  **1.1 Select your primary reference class for actuarial calculation:**
  [ ] **All Biological Humans:** Mortality rates calculated based on historical birth/death data. Standard subsidy applies.
  [ ] **All Observer-Moments in This Causal Branch:** Mortality rates adjusted for survival bias. Applicants selecting this class are statistically immortal until the moment of cessation; therefore, life insurance claims are automatically denied.
  [ ] **All Instances of This Specific Mental State:** Risk assessed across all possible worlds containing this exact thought pattern. Subsidy fluctuates based on the stability of your conceptual identity.
  [ ] **All Entities with This Precise Indexical Location:** Risk calculated relative to *here* and *now*. Note: This class contains only one member (you). Mortality rate is undefined. Subsidy set to zero.

  **1.2 Are you currently experiencing a state of amnesia regarding previous awakenings?**
  [ ] Yes (See Note 4.2)
  [ ] No
  [ ] Uncertain (Requires evidential weighting)

  **SECTION 2: EXISTENTIAL FORECAST WEIGHTING**
  *Purpose: To assign voting weight and existential risk liability.*

  **2.1 Select your temporal position relative to total human history:**
  [ ] **Early Born:** You assume a uniform prior over total humans born. Voting weight is standard. Doomsday risk assessment is low.
  [ ] **Late Born:** You condition on current birth rank. Voting weight is discounted due to higher probability of imminent extinction. Doomsday risk assessment is high.
  [ ] **Simulation Instance:** You acknowledge a non-zero probability of being a simulated copy. Voting weight is inversely proportional to the estimated number of identical copies running on external hardware.

  **2.2 Causal vs. Evidential Decision Protocol:**
  *If your vote influences the behavior of identical copies, check below:*
  [ ] **Causal:** I vote only to affect this physical ballot.
  [ ] **Evidential:** I vote to coordinate across all instances of this decision algorithm. (Warning: Selecting this option may double your tax liability if copies reside in high-tax jurisdictions.)

  **SECTION 3: INTERPERSONAL MATCHING**
  *Purpose: To regulate dating pools and social entitlements based on centered worlds.*

  **3.1 Define the conditions for partner eligibility:**
  [ ] **Uncentered Possibilities:** Partner must exist in the same possible world, regardless of location.
  [ ] **Centered-World Conditions:** Partner must exist at this specific spacetime coordinate relative to me.
  [ ] **Self-Locating Belief Match:** Partner must share the same indexical uncertainty regarding their identity.

  **3.2 Does your search preference depend on knowing you are not a duplicate?**
  [ ] Yes (Requires verification of unique causal history)
  [ ] No (Open to branching counterparts)

  ***

  **NOTE 4.2 (MINISTRY DIRECTIVE 1994-SB):** In accordance with standardized anthropic auditing, applicants reporting amnesia regarding previous awakenings (Section 1.2) must report credence values for both the 'Half' and 'Third' positions. For subsidy purposes, the Ministry defaults to the 'Third' position, treating each waking instance as a distinct claimant to resources. Furthermore, regarding the Doomsday Argument (Section 2.1), citizens are required to file both unadjusted priors and birth-rank adjusted posteriors. Discrepancies between these values will be taxed as *Epistemic Windfall Gains*.

  **WARNING:** Selecting a reference class solely to maximize benefits constitutes Circular Reasoning Fraud. The Ministry reserves the right to reclassify you as a *Random Observer-Moment* if your selected class appears suspiciously specific to your current survival. By signing below, you certify that your self-locating beliefs are consistent across all possible worlds where this form is filed.

  **Citizen Signature:** ___________________ **Date (Local Frame):** _______________

  **FOR OFFICIAL USE ONLY:**
  *Reference Class Validated:* [ ] Yes [ ] No (Assigned Default: Random Sample from Multiverse)
  *Audit Status:* [ ] Clear [ ] Flagged for Indexical Arbitrage
