answer: |-
  This is a precise request that cuts through the usual philosophical fog. You are asking for an isomorphism between Social Choice Theory and Multi-Objective RL (MORL), specifically testing the structural integrity of Harsanyi's Aggregation Theorem against your engineering constraints.

  Here is the translation, the residue report, and the verdict.

  ### 1. The Isomorphism: Harsanyi in RL Vocabulary

  Harsanyi's Aggregation Theorem is not primarily an ethical argument; it is a representation theorem. It states that if you satisfy certain consistency axioms, your aggregation function *must* take a specific mathematical form.

  **The Mapping:**

  *   **Social Alternatives ($X$):** Your set of deterministic policies $\Pi_{det}$ (e.g., specific checkpoints or fixed parameter sets).
  *   **Lotteries ($L$):** Stochastic mixtures over policies. In your pipeline, this corresponds to a deployment strategy where you roll out $\pi_A$ with probability $p$ and $\pi_B$ with probability $1-p$ (or a stochastic policy that is a convex combination of deterministic ones).
  *   **Individuals ($N$):** The set of users (or distinct user clusters represented by your reward heads). Let $|N| = n$.
  *   **Individual Preferences ($\succeq_i$):** Defined over $L$. User $i$ prefers lottery $L_1$ to $L_2$ iff $\mathbb{E}_{\pi \sim L_1}[U_i(\pi)] \geq \mathbb{E}_{\pi \sim L_2}[U_i(\pi)]$.
      *   *Note:* $U_i(\pi)$ is the vNM utility for user $i$. In standard RL, this is the expected return $J_i(\pi)$. If the user is risk-averse, $U_i$ is concave in returns, but linear in probabilities of policies.
  *   **Social Preferences ($\succeq_S$):** Your aggregation rule ordering the lotteries $L$.
  *   **Pareto Condition:** If $\forall i, L_1 \sim_i L_2$ (every user is indifferent between the policy mixtures), then $L_1 \sim_S L_2$ (the system is indifferent).
  *   **vNM Axioms (for Society):** Your social aggregator must satisfy Completeness, Transitivity, Continuity, and **Independence**.

  **The Theorem Statement in Your Terms:**
  If your social aggregation rule $\succeq_S$ satisfies the vNM axioms over policy mixtures, and satisfies the Pareto Condition with respect to user preferences $\succeq_i$ (which also satisfy vNM axioms), then there exist constants $w_1, \dots, w_n \geq 0$ and $c$ such that the Social Value Function $V(L)$ is:
  $$ V(L) = \sum_{i=1}^n w_i \mathbb{E}_{\pi \sim L}[U_i(\pi)] + c $$
  Because expectation is linear, this collapses to optimizing a **linear scalarization** of individual expected utilities:
  $$ \pi^* = \arg\max_{\pi} \sum_{i=1}^n w_i U_i(\pi) $$

  **Which Assumption Does the Work?**
  It is the **Social Independence Axiom**.
  *   *Formal:* If $L_1 \succeq_S L_2$, then for any $L_3$ and $\alpha \in (0,1]$, $\alpha L_1 + (1-\alpha)L_3 \succeq_S \alpha L_2 + (1-\alpha)L_3$.
  *   *RL Translation:* If you prefer policy mixture $L_1$ over $L_2$, you must still prefer a mixture of $L_1$ and $L_3$ over the same mixture of $L_2$ and $L_3$, regardless of what $L_3$ is.
  *   *Why it matters:* This axiom forces the social welfare function to be linear in probabilities. It forbids "diversification benefits" or "risk-pooling" at the social level that aren't already captured inside the individual $U_i$.

  ---

  ### 2. Residue Report

  Here is how your five specific friction points map against the theorem.

  **(1) The Weights and "Utilitarianism"**
  *   **Theorem Status:** Harsanyi does **not** yield equal weights ($w_i = 1/n$). It yields *some* non-negative weights. The theorem is compatible with a dictatorship ($w_k=1$, others 0).
  *   **Your World:** To get equal weights, you need an additional assumption: **Anonymity** or **Ex Ante Symmetry**.
  *   **The Counterpart:** This corresponds to the "Veil of Ignorance." In your pipeline, this is equivalent to saying: "Before training, we sample a random user index $i \sim \text{Uniform}(N)$, and the objective is to maximize *that* user's expected utility."
  *   **Verdict:** Harsanyi alone does not justify equal weighting. You need to explicitly encode "all users are interchangeable" into your prior. If your reward heads represent unequal stakeholders (e.g., paid vs. free users), equal weights might actually be *unfair* by your own lights.

  **(2) Nonlinearity (Nash Bargaining) and Hard Thresholds**
  *   **Theorem Status:** Hostile.
  *   **The Violation:** Your Nash product objective ($\prod (U_i - d_i)$) violates the **Social Independence Axiom**.
      *   *Example:* Suppose $L_1$ gives gains $(2, 2)$ and $L_2$ gives $(1, 4)$. Nash might prefer $L_1$ ($4 > 4$? No, $2\times2=4, 1\times4=4$. Bad example. Let's say $L_1=(3,3) \to 9$, $L_2=(1, 8) \to 8$. Nash prefers $L_1$).
      *   Now mix both with a disaster policy $L_3$ that sets gains to $(0,0)$.
      *   Nash product is sensitive to the *scale* of gains relative to the disagreement point. Linear scalarization is not.
  *   **Hard Thresholds:** A lexicographic safety constraint (e.g., "Maximize utility s.t. Harm $\leq \epsilon$") violates **Continuity** and **Independence**. If $L_1$ is safe and $L_2$ is unsafe, you prefer $L_1$. But if you mix them with a safe $L_3$, eventually the mixture becomes safe, and preferences flip non-linearly.
  *   **Verdict:** The theorem implies that if you use Nash Bargaining, you are explicitly rejecting vNM rationality at the *social* level. You are saying "Society cares about the *distribution* of utility across users, not just the expectation." Harsanyi says that's "irrational" (by vNM standards); you say it's "fair."

  **(3) Risk Sensitivity (CVaR / Distributional)**
  *   **Theorem Status:** Silent on individual risk, hostile on social risk.
  *   **Distinction:** vNM allows $U_i$ to be concave (risk-averse user). Harsanyi accepts this.
  *   **The Conflict:** You mentioned evaluating distributions, not means (e.g., CVaR on the *population* return). If your social objective is $V(\pi) = \text{CVaR}_\alpha(\{U_i(\pi)\}_i)$, you violate Independence.
      *   *Why:* CVaR is not linear in probabilities of policies. It looks at the tail of the distribution of outcomes. Harsanyi requires the social value of a lottery to be the expected value of the social value of the outcomes.
  *   **Verdict:** If you care about "systemic risk" (the chance that *some* users get crushed, even if expected utility is high), you must violate Harsanyi's Independence. The theorem assumes risk is fully privatized to the individual utility function $U_i$.

  **(4) Dynamic Population**
  *   **Theorem Status:** Breaks completely.
  *   **The Issue:** Harsanyi assumes a fixed $N$. If $N_t$ changes between deployment windows, the function $W = \sum_{i \in N} w_i U_i$ changes dimensionality.
  *   **Your World:** New accounts are new "individuals." Comparing $W(\pi)$ in week 1 vs. week 2 is comparing functions over different domains.
  *   **Verdict:** To handle this, you need "Critical-Level Utilitarianism" or similar variable-population ethics. This introduces the "Repugnant Conclusion" risk (adding millions of users with near-zero utility to swamp the aggregate). Harsanyi offers no guidance here; it assumes the set of voters is static.

  **(5) Ex Ante vs. Ex Post Pareto (The Diamond Objection)**
  *   **Theorem Status:** This is the deepest crack in the foundation.
  *   **The Distinction:**
      *   *Ex Ante (Harsanyi):* Evaluate the lottery before knowing who gets which outcome. $V(L) = \sum p_k W(\text{outcome}_k)$.
      *   *Ex Post (Diamond):* Evaluate the fairness of the realized allocation.
  *   **The Diamond Example:** Two users, one resource.
      *   Option A: Give to User 1 (deterministic). Utilities: $(1, 0)$.
      *   Option B: Give to User 2 (deterministic). Utilities: $(0, 1)$.
      *   Option C: Flip a coin (A with 0.5, B with 0.5). Ex Ante Utilities: $(0.5, 0.5)$.
      *   *Harsanyi:* If society is indifferent between A and B (symmetry), it must be indifferent between A and C (by Independence). $0.5 U(A) + 0.5 U(B) = U(C)$.
      *   *Diamond:* C is fairer than A or B. Even though expected utility is identical, C gives both users a "fair chance."
  *   **Your World:** Do you care that a specific user had a bad experience (Ex Post), or only that the *policy* was optimized for average expected satisfaction (Ex Ante)?
  *   **Verdict:** If you care about Ex Post fairness (e.g., "no single user should be sacrificed for the greater good"), Harsanyi is irrelevant. It aggregates Ex Ante expectations.

  ---

  ### 3. The Verdict on the Residue

  **Which parts translate cleanly?**
  The mapping of **Individuals $\to$ Reward Heads** and **Pareto Efficiency $\to$ Pareto Frontiers** is robust. The theorem correctly identifies that if you want a vNM-rational aggregator, you are stuck with linear scalarization.

  **Which parts require smuggling?**
  **Equal Weights.** You must import "Veil of Ignorance" (random user sampling) to justify $w_i = w_j$. Without that, Harsanyi permits weighting your "Premium Users" higher than "Free Users."

  **Which parts have no expression?**
  **Ex Post Fairness and Dynamic Populations.** Harsanyi is a static, Ex Ante theorem. It cannot express "fairness of opportunity" (coin flips) vs. "fairness of outcome," nor can it handle churn without ad-hoc patching.

  **Is this a hole in your vocabulary or the theorem?**
  It is a limitation of the theorem's **axioms**, specifically **Independence**.
  Your engineering intuition (Nash bargaining, safety thresholds, CVaR) is rejecting the Independence Axiom at the social level. You are asserting that *correlations* between user outcomes matter (e.g., it's worse if *all* users suffer slightly than if *half* suffer a lot, or vice versa). Harsanyi says correlations don't matter, only marginal probabilities do.
  **Verdict:** The theorem is less of a "result about fairness" and more of a "result about linearity." It proves that **vNM Rationality + Pareto = Linear Scalarization**. If you reject Linear Scalarization (because you want Nash bargaining or safety constraints), you are logically committed to rejecting vNM Rationality at the social level. That is not a bug in your system; it's a feature of caring about distribution/fairness.

  ---

  ### 4. Confidence Flag & Mind Changer

  **Least Confident Step:**
  The mapping of **Lotteries ($L$)** to **Policy Mixtures**.
  In social choice, a lottery is a probability distribution over outcomes resolved *once*. In RL deployment, a "mixture policy" ($\pi_{mix}$) might be implemented as:
  1.  **Temporal Mixing:** Serve $\pi_A$ to user $t$, $\pi_B$ to user $t+1$.
  2.  **User Mixing:** Serve $\pi_A$ to cohort 1, $\pi_B$ to cohort 2.
  3.  **Stochastic Policy:** $\pi(a|s)$ is a convex combo.

  Harsanyi's Independence Axiom holds if the "lottery" is resolved *per user* or *per trajectory*. If your "lottery" is a temporal mixture where users experience *both* policies over time, the utility might not be linear in the mixture weights due to **adaptation effects** or **non-ergodicity** (e.g., a user burned by $\pi_A$ in week 1 churns before seeing $\pi_B$ in week 2).
  If user utility is not linear in the probability of policy deployment (due to churn/retention dynamics), then the "Individual vNM" assumption itself fails, and Harsanyi doesn't even get off the ground.

  **What Would Change My Mind:**
  *   **From "Theorem is restrictive" to "Your vocabulary is missing something":**
      If you could demonstrate that your Nash Bargaining objective can be reformulated as a **Linear Scalarization over an expanded state space**.
      *   *Argument:* If you treat "Fairness" or "Safety" as just another reward head $R_{fairness}$ with a specific weight, you are back in Harsanyi's land.
      *   *Counter:* You already do this with "Harmlessness," but you use a *lexicographic* constraint, not a weight.
      *   *Mind Flip:* If you can show that your lexicographic constraint is actually a limit of a weighted sum where $w_{safety} \to \infty$, then Harsanyi still holds (as a limit case). If the constraint is hard (infeasible regions), Harsanyi breaks.

  *   **From "Your vocabulary is missing something" to "Theorem is linear scalarization + assumption you'd never grant":**
      If you accept that **Social Independence** is ethically untenable.
      *   *Argument:* "I don't care if the *expected* utility is the same; I care that the *variance* across users is minimized."
      *   *Mind Flip:* Once you admit you care about variance *across* users (not just within a user's utility function), you have explicitly violated Independence. At that point, Harsanyi is not a guide; it's a boundary marker saying "Here be Non-Linear Dragons."

  **Summary:** Your suspicion is correct. The theorem is a proof that **Utilitarianism (Linear Sum) is the only vNM-rational aggregation.** Since you are using Non-Linear aggregation (Nash) and Non-vNM constraints (Lexicographic Safety), you are correctly operating outside the theorem's domain. The theorem isn't wrong; it's just describing a different class of objectives than the one you've engineered.
