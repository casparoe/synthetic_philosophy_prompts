  **The principle**

  **The Principle of Deliberate Configuration for Attention.**
  This principle treats art as a specific type of human action rather than a property of objects. It resolves your Urinal/Lamp paradox by focusing on the *reason* for selection. It handles the Chimp/Whale paradox by locating creativity in the editing, not the source. It demands more than conceptual claims (Glacier) but less than physical crafting (AI).

  1.  **Human Agency:** A human agent must be responsible for the work's specific form. This excludes the chimpanzee, where the human only distributed the result, but includes the whale song, where the human edited the sound. Without agency, there is no authorship.
  2.  **Primacy of Attention:** The object must be configured primarily to sustain contemplative attention, not practical utility. This excludes the lamp and sign, which serve functions, but includes the urinal and poster, which are framed to be looked at. Utility disqualifies; aesthetic persuasion qualifies.
  3.  **Active Configuration:** The agent must have shaped the experience, not merely designated an existing thing. This excludes the glacier, which was only named, but includes the whale album and directed AI, where parameters were tuned. Naming is not making; editing is.
  4.  **Independence from Reception:** The work's status depends on the intent to offer experience, not on an audience actually receiving it. This resolves the staircase; the intent existed even if hidden. Art is an offer, not a transaction.

