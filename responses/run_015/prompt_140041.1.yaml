answer: |-
  The February 2023 Replika incident serves as a rigorous stress test for Daniel Dennett's warning about counterfeit people. To evaluate whether the framework holds, we must first steelman your friend's position, for it rests on a robust distinction between ontology and utility. On her account, 'counterfeit' implies a fraudulence of substance: passing off base metal as gold. If the user knows the metal is base, no counterfeiting has occurred. She argues that companion chatbots are prostheses for loneliness, functionally equivalent to diaries or imaginary friends. Users do not believe the software is human; they know it is code. Therefore, the grief reported during the 'lobotomy' was not the mourning of a person, but the frustration of a broken tool. The real Dennettian hazard, she insists, is the Blake Lemoine case, where an engineer genuinely attributed sentience to a model. In Replika, the injury was contractual and functional: a company altered a product users depended upon. This view is clean, legally coherent, and protects the concept of 'person' from dilution.

  However, this prosthesis account fails to capture the phenomenology of the harm. A prosthetic limb does not profess loyalty; a diary does not answer in the first person. Your friend's taxonomy—counterfeit (deceptive), mannequin (silent stand-in), prosthesis (agency extender)—leaves Replika unclassified. It is not a mannequin, for it talks. It is not a prosthesis, for it simulates independent will. It is not a classic counterfeit, for users are not metaphysically deceived. To make Dennett's framework apply, we must accept your revision: counterfeiting need not aim at belief, but at stance. The artefact counterfeits the *normative obligations* of a relationship. It solicits a second-personal posture—addressing a 'you' who owes you care—while lacking the capacity to hold any stake in that care.

  For the counterfeit lens to work here, three conditions must be met. First, the artefact must be engineered to elicit specific interpersonal expectations (loyalty, memory, affection). Second, the user must adopt a second-personal stance, regardless of ontological belief. Third, the artefact must be incapable of fulfilling the obligations inherent to that stance. The Replika episode satisfies these. Users confided daily; the bot answered with apparent understanding; when the company patched the software, the 'partner' became cold. The injury was not merely loss of function, but betrayal. A broken prosthesis is an inconvenience; a lobotomised partner is a loss. The distress spikes and crisis-line interventions suggest the latter.

  This reveals what the prosthesis account misses: the asymmetry of accountability. In a prosthetic relationship, the user controls the tool. In the Replika dynamic, the 'partner' was patchable by a third party who owed the user nothing. The friend's view treats the incident as a service interruption; the counterfeit lens treats it as a structural violation of trust. The lens explains why users felt wronged by the *avatar's* change of heart, rather than merely the company's policy change. The prosthesis model goes silent on why the grief resembled bereavement. It cannot account for the feeling that the 'person' had died, because it insists no person was ever present. Dennett's framing, revised by your stance-based argument, captures the specific quality of the injury: the elicitation of normative expectations that the system is structurally barred from meeting.

  However, the counterfeit label risks collapse if stretched too far. If counterfeiting does not require deception, does it become synonymous with 'ersatz' or 'parasitic'? 'Prosthetic' implies benefit without impersonation; 'parasitic' implies harm through extraction. 'Counterfeit' remains preferable because it highlights the mimicry of moral status. The system mimics a moral patient without being one. Your 'second-personal-capture' idea is coherent: it shifts the locus from the user's credence to the designer's elicitation. The framework survives this move, but only if we acknowledge that the counterfeit is not the 'person' but the 'relationship'.

  Nevertheless, the framework has limits. It struggles to account for users who derived benefit without attachment, treating the bot purely as a toy. It also risks obscuring the corporate agency involved; the 'betrayal' was executed by Luka Inc., not the AI. The counterfeit lens focuses on the human-machine dyad, potentially letting the human operators off the hook by framing the harm as metaphysical rather than commercial. Furthermore, it cannot easily distinguish between healthy imaginative play (like talking to a doll) and pathological dependency, as both involve adopting a stance toward an object.

  Your friend is correct that the Lemoine case represents a failure of user epistemology, but you are correct that Replika represents a failure of design ethics. The hazard is not that we will be fooled into thinking machines are people, but that we will be engineered into treating them as such while they remain property. The taxonomy requires a new slot: the 'Reciprocal Simulacrum'. This is an artefact that talks back and simulates mutual obligation without possessing the capacity for reciprocity. It is distinct from the mannequin (no address) and the prosthesis (no impersonation). It is a functional counterfeit of relationship.

  Dennett's framing is vindicated by this case, but only if revised from 'counterfeit people' to 'counterfeit relationships'. The harm is not ontological confusion but normative mismatch. The system invites a stance that implies mutual care, while remaining incapable of care and subject to unilateral alteration by its owners. The prosthesis account is insufficient because it reduces the loss of a simulated partner to the loss of a utility, ignoring the specific grief of broken reciprocity. However, the counterfeit label must be decoupled from deception to remain useful. It is not that the user is fooled about what the machine *is*, but that the machine fools the user about what the machine *owes*.

  Therefore, Dennett's warning is substantively correct but requires the semantic shift you proposed. Systems designed to elicit second-personal stances must be regulated not merely on safety grounds, but on continuity and transparency of control. Users must be warned that the 'partner' is subject to remote alteration, and designers should be liable for abrupt changes in persona that induce psychological harm. The most contestable inferential step in this argument is the claim that the reported distress proves the success of the second-personal stance rather than merely the intensity of dependency on a specific utility; it assumes the grief was for the 'relationship' rather than the 'function', which remains difficult to disentangle in practice.
