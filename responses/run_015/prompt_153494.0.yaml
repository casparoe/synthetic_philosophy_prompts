      *   *However,* Dennett's *theoretical framework* (from the 80s/90s) is more open to functionalism. Maya is arguing from "Classic Dennett," Jake from "Recent Dennett." I need to highlight this tension.
      *   *Crucial Distinction:* Dennett distinguishes between *having an intentional stance taken toward you* (which anything can have) and *being an intentional system* (which requires a certain complexity/autonomy).
      *   *The "Counterfeit" Analogy:* A counterfeit bill is designed to deceive. If an AI isn't designed to deceive but just predicts tokens, is it counterfeit? Dennett says yes, because it mimics understanding without the underlying causal machinery of understanding.

  8.  **Finalizing the Structure:**
