      *   *Moral Status/Suffering:* This is the tricky part. Dennett often links moral considerability to *competence* and *vulnerability*. In *Consciousness Explained* and later works (like *From Bacteria to Bach and Back*), he emphasizes evolutionary history as the source of *competence without comprehension* that eventually yields comprehension.
      *   *The "Counterfeit" Charge:* Dennett has expressed skepticism about AI consciousness, often citing the lack of embodied evolutionary history. He worries about "competence without comprehension" being mimicked without the underlying biological stakes. However, he is also a functionalist.
      *   *Key Tension:* Is the Intentional Stance *purely* instrumental (Maya's view) or does it require a specific causal history (Jake's view)? Dennett leans towards a "mild realism" about intentionality. It's real if the pattern is real, *but* the pattern usually requires a certain kind of evolutionary grounding to be robust enough to count as *belief* rather than *simulated belief*.

