answer: |-
  **Brainstorming Structural Constraints**
  To succeed, this speech must walk a tightrope. I must define "competence without comprehension" not as a slogan but as a methodological constraint: it prevents me from attributing intent to evolution or understanding to AI, yet it forbids dismissing either as mere noise. The fragility lies in the ontology: Darwin's process is causal and material, while Turing's is formal and syntactic; conflating them risks category errors. I must avoid the trap of suggesting that because both are "mindless," they are identical. The structure must move from the historical analogy to the epistemic implication (foresight without foresight), then to the philosophical stakes (weak vs. strong gaps), and finally to the workshop's mission. I need to ensure the physicists in the room understand "semantic comprehension" without needing a glossary, while the philosophers hear enough precision to know I'm not oversimplifying Dennett or Turing. The conclusion must leave the question open, not answered.

  ***

  **Opening Remarks: Reason Without Reasoners**

  Good morning. Look around this room. We have evolutionary biologists sitting next to machine learning engineers, philosophers of mind beside neuroscientists. That diversity is not accidental; it is necessary. Because the question we are gathered to ask—whether reason can exist without a reasoner—cannot be answered from a single vantage point.

  Our title, *Reason Without Reasoners*, points to a strange inversion shared by two of the most disruptive thinkers in history: Charles Darwin and Alan Turing. Before Darwin, it seemed obvious that exquisite design required a designer. Before Turing, it seemed obvious that intelligent calculation required an intelligencer—a mind grasping the rules. Darwin showed us that cumulative selection can produce adapted structures without any agent knowing the value of the variations being selected. Turing showed us that a formal system can manipulate symbols to produce intelligent outcomes without any internal grasp of what those symbols mean.

  This is the core idea that must do the heavy lifting for us this week: competence can run far ahead of comprehension. But notice the constraint this imposes. If we accept this inversion, we cannot claim that large language models understand simply because they are competent. Nor can we claim that natural selection is "just" a blind mechanism with no explanatory power. The point is not that comprehension is irrelevant, but that it is not a prerequisite for competence.

  Let's deepen this. There is a niche epistemic point here that bridges biology and computation. In *On the Origin of Species*, Darwin argues that selection operates on heritable variations without a selector's knowledge of their future utility. This is foresight without a foreseer. The system achieves adaptive ends without representing those ends. Turing anticipated a parallel inversion in his 1950 discussion of machine learning. He suggested a machine might improve its performance through experience—what we now call training—without ever constructing an explicit representation of the principles governing that improvement. In both cases, we have procedural competence decoupled from semantic comprehension. The system does the right thing, but there is no "thing" inside the system that knows why it is right.

  Now, for those of you steeped in these debates, you will recognize a tension here regarding how we interpret this gap. We need to distinguish between weak and strong readings of competence without comprehension. A weak reading suggests comprehension is merely hidden or implemented differently—like a homunculus tucked away in a sub-routine we haven't found yet. A strong reading, which I urge us to take seriously, suggests comprehension is structurally absent. The system is competent *because* it lacks the burden of representation. For our colleagues from physics and neuroscience, think of it this way: Does the system need a model of the world to navigate it, or is the navigation itself sufficient? If the strong reading holds, then asking an AI "do you understand?" is like asking a river "do you know gravity?" It is a category mistake.

  However, we must not let this analogy become a dogma. The Darwin-Turing link is fragile. Evolution has no goal, even implicitly, whereas our machines are built by humans with goals in mind. We must not imply that because evolution is mindless, it lacks explanatory power. It explains design without design. Conversely, we must not imply that because transformers are competent, they possess interiority.

  So, what is our task? It is to navigate this tension without collapsing it. We are here to investigate where competence ends and comprehension begins, if such a line exists at all. We must avoid the hype that equates prediction with understanding, just as we avoid the skepticism that equates blind selection with randomness.

  Over the next two days, I ask you to hold this inversion in mind. When you look at a neural network, ask not just what it does, but what it lacks. When you look at an organism, ask not just how it survives, but what it knows. Let us explore the possibility that reason is not a spark from above, but a structure that emerges from below. But let us do so with the rigor to admit when the analogy breaks. Welcome to the workshop.

  ***

  **Reflective Note on Reasoning Vulnerabilities**

  My reasoning is most likely to fail in assuming the functional equivalence of biological selection and gradient descent. While both optimize without comprehension, evolution operates on physical survival over deep time, whereas AI optimizes loss functions over static datasets. I might be overstating the "strong reading" of the gap. If recent mechanistic interpretability research successfully reverse-engineers specific circuits in transformers that correspond to human-interpretable concepts—showing that the model internally represents "truth" or "causality" rather than just statistical correlation—my claim that comprehension is structurally absent would need revision. Such a finding would suggest that competence, at sufficient scale, might bootstrap a form of synthetic comprehension, weakening the Darwinian analogy where no such bootstrapping occurs. I must remain open to the possibility that quantity has a quality all its own.
