prompt: |-
  I'm the audit lead for our city's behavorial-policy unit — every week I get proposals for nudges like opt-out organ donation, calorie-label mandates, retirement savings defaults, that kind of thing. Right now I'm just winging it with a gut check about autonomy, but I need something reusable my team can actually run in about fifteen minutes before I sign off. I sketched out a framework with a colleague that splits interventions into two kinds: Type A changes the choice environment — reorder options, change defaults, keep the full menu technically available — while Type B shifts how preferences themselves get formed or weighted, like framing that makes a value feel illegitimate, hiding options behind social stigma, or using emotional priming so people want different things than they did before. The core idea is that Type B needs stricter justification because it doesn't just steer revealed preferences; it risks constructing them, and that asymmetry should drive the audit.

  Please turn this into a step-by-step decision procedure: ordered questions, what counts as a sufficient answer to each, where the flow stops with a hard no, and where it stops and says "this is now a values call, escalate to the ethics board." Apply it to three proposals: (1) an opt-out pension enrollment with a 3% employer match, (2) a school-cafeteria redesign that puts junk food behind a counter with a five-minute wait but technically allows it, and (3) a smoking-cessation poster campaign that frames continued smoking as "letting your family down" — I actually like this one, but I want the procedure to either reject it or escalate it in a way that annoys me. Make sure you flag where the Type A / Type B line gets blurry — for instance when a default also sends a social signal — and be explicit about what the procedure flat-out can't settle. Don't ask me to cite philosophers or build a bibliography; I just need the checklist, the worked cases, and an honest note about where judgment can't be eliminated.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**
      *   **Role:** Audit Lead for a city's behavioral-policy unit.
      *   **Task:** Create a reusable, 15-minute decision procedure (checklist/flowchart) for auditing nudge proposals.
      *   **Core Framework:** Distinguish between Type A (choice environment, defaults, reordering) and Type B (preference formation/weighting, framing values, stigma, emotional priming).
      *   **Constraint:** Type B requires stricter justification.
      *   **Output Requirements:**
          *   Step-by-step decision procedure (ordered questions, pass/fail criteria, stop points).
          *   Application to three specific cases (Pension, Cafeteria, Smoking).
          *   Flagging blurry lines between Type A and Type B.
          *   Explicit statement on what the procedure *cannot* settle (limits of the tool).
          *   Tone: Professional, pragmatic, no academic citations/bibliography.
          *   Specific instruction on the Smoking case: The user likes it, but the procedure should either reject or escalate it in an annoying way (to test the rigor).

  2.  **Deconstruct the Framework (Type A vs. Type B):**
      *   *Type A:* Structural changes. Defaults, ordering, ease of access. Assumes existing preferences, just reduces friction for one option. *Key test:* Can I still choose the other thing easily if I want to?
      *   *Type B:* Psychological/Normative changes. Framing, stigma, emotional manipulation, hiding options via shame. Changes *what* people want or how they value it. *Key test:* Does this make me feel bad about wanting X, or change my mind about whether X is good?
      *   *The Grey Zone:* Defaults often imply endorsement (Type A mechanism, Type B signal). Friction can feel like prohibition (Type A mechanism, Type B effect).

  3.  **Drafting the Decision Procedure (The "15-Minute Audit"):**
      *   Need to be fast. 5-7 questions max.
      *   Need clear "Stop/No" and "Escalate" points.
      *   *Step 1: Goal Alignment.* Is the goal legitimate? (Basic sanity check).
      *   *Step 2: Classification.* Is it Type A or Type B? (The core distinction).
      *   *Step 3: Reversibility/Effort.* For Type A, how hard is it to opt-out?
      *   *Step 4: Preference Integrity.* For Type B, does it manipulate values or emotions?
      *   *Step 5: Transparency.* Can we tell people we're doing this?
      *   *Decision Nodes:* Pass, Fail, Escalate.

      *Refining the Type A/B distinction for the checklist:*
      *   Question: "Does this intervention change the *cost* (time/effort) of choosing, or the *meaning* (value/emotion) of choosing?"
      *   If Cost/Effort -> Type A.
      *   If Meaning/Value -> Type B.

      *Refining the "Annoying Escalation" for the Smoking case:*
      *   The smoking poster uses guilt ("letting family down"). This is emotional priming/stigma. That's Type B.
      *   Type B needs strict justification.
      *   To make it "annoying," the procedure should demand evidence that this specific emotional lever doesn't cause undue psychological harm or backlash, requiring Ethics Board review because it touches on family dynamics and shame.

  4.  **Developing the Three Cases:**
      *   *Case 1: Opt-out Pension (3% match).*
          *   Mechanism: Default.
          *   Type: Mostly A, but has B elements (endorsement).
          *   Verdict: Pass (with transparency). Standard nudge.
      *   *Case 2: Cafeteria Junk Food (5-min wait).*
          *   Mechanism: Friction.
          *   Type: A (physical barrier).
          *   Risk: Is 5 mins too much? Is it deceptive?
          *   Verdict: Pass (if healthy food is easy).
      *   *Case 3: Smoking Poster ("Letting family down").*
          *   Mechanism: Guilt/Shame framing.
          *   Type: B (shifts value/weighting via emotion).
          *   Verdict: Escalate. It manipulates emotional state regarding family bonds.

  5.  **Addressing the "Blurry Lines":**
      *   Defaults signal endorsement.
      *   Friction signals disapproval.
      *   Need a specific "Grey Zone" step in the procedure.

  6.  **Addressing "What the Procedure Can't Settle":**
      *   It can't define the "Good."
      *   It can't measure long-term psychological harm precisely.
      *   It can't resolve conflicting values (e.g., Health vs. Autonomy).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the role and the framework.
      *   *The Checklist:* Keep it tight. Use "Yes/No/Escalate" logic.
      *   *The Cases:* Apply the checklist rigorously.
      *   *The Limitations:* Be honest about the "values call."

      *(Self-Correction during drafting)*: Make sure I don't just say "Type B is bad." The prompt says "Type B needs stricter justification." So Type B isn't an automatic "No," it's an automatic "Escalate" or "High Bar."
      *Correction:* Let's make Type B trigger an automatic Ethics Board escalation if it involves stigma or emotional priming about personal relationships. That fits the "annoy me" instruction for the smoking case.

      *(Refining the Smoking Case)*: The user says "I actually like this one." If the procedure escalates it, that creates friction. That's what they asked for ("escalate it in a way that annoys me"). So, the procedure must classify guilt-tripping about family as a high-risk Type B intervention requiring board review.

      *(Refining the Blurry Line)*: The prompt specifically asks to flag where the line gets blurry. I should add a "Classifier Note" in the procedure.

  8.  **Final Review against Constraints:**
      *   15-minute run time? Yes, checklist is short.
      *   No philosophers/bibliography? Yes.
      *   Step-by-step? Yes.
      *   Hard No vs. Escalate? Yes.
      *   Three cases applied? Yes.
      *   Blurry lines flagged? Yes.
      *   Limitations stated? Yes.

  9.  **Final Polish:** Ensure tone is bureaucratic but sharp (Audit Lead style).

  *(Self-Correction on Case 2)*: A 5-minute wait for junk food. Is that Type A or B? It's physical friction (A). But if the *intent* is to signal that junk food is shameful, it bleeds into B. I need to make sure the audit catches that intent. I will classify it as A but flag the risk of it being perceived as B.

  *(Self-Correction on Case 1)*: Pension default. This is the classic Type A. But the 3% match is an incentive, not just a nudge. Wait, the prompt says "opt-out pension enrollment with a 3% employer match." The match is an incentive (price change), the opt-out is the nudge. I should focus on the opt-out part for the behavioral audit. The match is standard compensation. I'll focus on the default status.

  *(Final Plan for Smoking Case)*: To ensure it annoys the user, the procedure will categorize "appeals to familial guilt" as a specific sub-type of Type B that *always* requires Ethics Board sign-off, regardless of public health benefit. This creates the bureaucratic hurdle they requested.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The 15-Minute Autonomy Audit (v1.0)

  **Purpose:** Rapidly classify behavioral interventions to identify autonomy risks.
  **Users:** Policy Analysts & Audit Leads.
  **Time Budget:** 15 Minutes.
  **Core Logic:** Type A (Environment) is presumptively permissible; Type B (Preference Formation) is presumptively suspect.

  ---

  ## Part 1: The Decision Procedure

  **Step 1: The Legitimacy Check (2 mins)**
  *   **Question:** Is the policy goal (e.g., health, savings, safety) explicitly authorized by current city mandate or legislation?
  *   **Pass:** Yes, goal is authorized.
  *   **Fail:** No. **STOP. REJECT.** (Behavioral tools cannot create legal authority).
  *   **Note:** This does not judge *if* the goal is good, only if you have the mandate to pursue it.

  **Step 2: The Mechanism Classifier (5 mins)**
  *   **Question:** Does the intervention primarily change the *effort* required to choose, or the *emotional/value weight* of the choice?
      *   *Effort/Structure:* Defaults, ordering, physical access, simplification. → **Type A**
      *   *Weight/Meaning:* Framing, stigma, emotional priming, social signaling, hiding options via shame. → **Type B**
  *   **The Blurry Line Warning:** If a structural change (Type A) is designed to send a message of disapproval (e.g., making something difficult *to signal* it is bad), treat it as **Type B** for the purpose of this audit.
  *   **Action:** Mark proposal as Type A or Type B.

  **Step 3: The Reversibility Test (Type A Only) (3 mins)**
  *   **Question:** If a citizen actively wants the non-default option, can they access it with minimal friction (under 5 minutes or 2 clicks) and without penalty?
  *   **Pass:** Yes. → **PROCEED TO STEP 5.**
  *   **Fail:** No (e.g., wait times, fees, complex forms). → **ESCALATE TO ETHICS BOARD.** (Excessive friction functions as a prohibition).

  **Step 4: The Preference Integrity Test (Type B Only) (5 mins)**
  *   **Question:** Does the intervention rely on shame, guilt, or redefining a personal value (e.g., "good parent," "responsible citizen") to shift behavior?
  *   **Pass:** No (e.g., purely informational framing). → **ESCALATE TO ETHICS BOARD.** (All Type B interventions require board review; there is no "auto-pass" for Type B).
  *   **Fail:** Yes (uses shame/guilt). → **HARD STOP / ESCALATE.** (Do not implement without specific board waiver).
      *   *Rationale:* Manipulating self-concept carries higher psychological risk than shifting friction.

  **Step 5: The Transparency Check (Final Gate)**
  *   **Question:** Can we publicly disclose the mechanism (e.g., "We made this the default to help you save") without undermining the intervention?
  *   **Pass:** Yes. → **APPROVED.**
  *   **Fail:** No (The nudge only works if hidden). → **ESCALATE TO ETHICS BOARD.** (Deceptive nudges violate trust mandates).

  ---

  ## Part 2: Worked Cases

  ### Case 1: Opt-Out Pension Enrollment (3% Match)
  *   **Step 1 (Legitimacy):** Pass. City has mandate to manage employee benefits.
  *   **Step 2 (Classifier):** **Type A.** Changes the default state. Does not argue that *not* saving is immoral, just makes saving the path of least resistance.
      *   *Blurry Line Note:* A default implies endorsement. However, since the financial incentive (match) exists independently of the default, the primary mechanism is structural friction, not value shifting.
  *   **Step 3 (Reversibility):** Pass. Employee can opt-out online instantly. No penalty.
  *   **Step 5 (Transparency):** Pass. Can be disclosed in onboarding materials.
  *   **Verdict:** **APPROVED.**
  *   **Audit Note:** Standard Type A. Monitor opt-out rates to ensure friction isn't accidentally too high.

  ### Case 2: School Cafeteria Redesign (Junk Food Behind Counter)
  *   **Step 1 (Legitimacy):** Pass. School nutrition mandates.
  *   **Step 2 (Classifier):** **Type A (with Type B risk).** Physically moving food is structural. However, if the *intent* of the 5-minute wait is to signal that the food is "bad," it bleeds into Type B.
      *   *Decision:* Classify as Type A, but flag for Step 3 strictness.
  *   **Step 3 (Reversibility):** **Borderline.** A 5-minute wait in a 30-minute lunch period is significant friction. It reduces access by ~15%.
      *   *Audit Judgment:* Is 5 minutes "minimal friction"? In a school context, this effectively rationing access.
  *   **Verdict:** **ESCALATE TO ETHICS BOARD.**
  *   **Rationale:** While technically Type A, the friction level is high enough that it functions as a soft prohibition. The Board needs to decide if "protective paternalism" justifies limiting access to legal food options during limited break times.

  ### Case 3: Smoking Cessation ("Letting Your Family Down")
  *   **Step 1 (Legitimacy):** Pass. Public health mandate.
  *   **Step 2 (Classifier):** **Type B.** This does not change the cost of smoking. It attempts to re-weight the value of smoking by attaching it to familial guilt and identity ("bad parent/partner").
  *   **Step 4 (Preference Integrity):** **Fail (High Risk).** The mechanism relies explicitly on guilt and redefining family obligation.
      *   *Procedure Trigger:* Type B + Shame/Guilt = **HARD STOP / ESCALATE.**
  *   **Verdict:** **ESCALATE TO ETHICS BOARD.**
  *   **Why this annoys you:** You believe the public health benefit outweighs the autonomy cost. The procedure does not care about the benefit yet. It flags that you are using *psychological leverage over personal relationships* as a policy tool. The Board must determine if weaponizing family bonds is an acceptable government tactic, regardless of efficacy.
      *   *Audit Note:* Do not implement until Board signs off on "Use of Familial Guilt in Public Messaging."

  ---

  ## Part 3: Limitations & Blind Spots

  This procedure is a triage tool, not a moral compass. It cannot settle the following:

  1.  **The "Endorsement" Effect:** Type A defaults often function as Type B signals. If the government makes X the default, citizens infer the government thinks X is *better*. This procedure treats that as acceptable noise for Type A, but in highly polarized contexts, that signal may be coercive. The checklist cannot measure the intensity of that signal.
  2.  **Cumulative Burden:** One Type A nudge is fine. Ten Type A nudges across different departments might create a "wall of friction" that effectively removes agency. This audit looks at proposals in isolation.
  3.  **Values Conflicts:** The procedure assumes the Step 1 "Legitimacy Check" is sufficient. It is not. If the mandate itself is ethically contested (e.g., enforcing a specific cultural norm), this audit will rubber-stamp it because it lacks the authority to question the mandate, only the mechanism.
  4.  **Long-term Preference Drift:** Type B interventions might work temporarily but cause backlash or cynicism later. This 15-minute audit assesses immediate mechanism risk, not long-term psychological feedback loops.

  **Final Instruction:** If a proposal hits "ESCALATE," do not argue the *outcome* (e.g., "smoking is bad"). Argue the *mechanism* (e.g., "is guilt an appropriate lever?"). That is what the Board is there to decide.
