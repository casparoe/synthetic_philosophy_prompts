      *   *Practice 1 (Elections):* IRV (counting preferences) + Lot for ties (admission of arbitrariness at the margin).
      *   *Practice 2 (Consensus):* No counting, single block decisive, preference transformation ("live with"), legitimacy via universal acceptability.
      *   *Practice 3 (Fallback):* 75% vote (counting) treated as failure/regret ("reduced to counting").

  3.  **Analyze Theoretical Presuppositions:**
      *   *Consensus:* Presupposes legitimacy stems from universal acceptability (no coercion), not mere majority will. It views preferences as malleable (transformative deliberation) rather than fixed data points. It hints at a "common good" discoverable through talk, though strictly it only requires no veto.
      *   *Elections:* Acknowledges aggregation is necessary for personnel but admits indeterminacy (lot) when counting fails to distinguish.
      *   *Consistency:* There is a tension. Elections accept aggregation; consensus rejects it. The fallback admits aggregation is possible but undesirable. The lot admits counting is arbitrary at the limit.
      *   *Arrow's Theorem:* Arrow applies to *ordinal voting rules* mapping preferences to outcomes. Consensus is not a voting rule in Arrow's sense; it's a deliberative process. It evades Arrow by not fixing a function from preference profiles to outcomes independent of deliberation. It changes preferences rather than aggregating them.
      *   *Underdetermination:* The practice fits both "common good discovery" (realist) and "mutual veto/contractarian" (constructivist) views. Both look the same procedurally.
      *   *Opposite View (Aggregative):* Would require removing the block, recording votes, accepting majority/75% as legitimate (not failure), and removing the lot (just use tie-breaker rules).

  4.  **Drafting - Section by Section:**

