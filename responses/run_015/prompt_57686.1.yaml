      *   *Consistency:* The lot-drawing admits aggregation is underdetermined at the margin, which aligns with the skepticism toward counting seen in the fallback regret. It does not undercut consensus because consensus claims to find agreement, not just count.
      *   *Arrow:* Arrow's theorem does not apply. Arrow assumes fixed preferences and a function mapping profiles to outcomes. Consensus evades the "Universal Domain" and "Independence of Irrelevant Alternatives" conditions by allowing deliberation to change preferences and refusing to define an outcome function independent of discussion.
      *   *Underdetermination:* The practice fits both a realist view (discovering the common good) and a contractarian view (mutual veto). To shift to aggregative view: remove the block, record vote tallies, treat 50%+1 or 75% as fully legitimate, and replace the lot with a deterministic tie-breaker.

  5.  **Refining and Editing (Word Count Check):**

      *   *Drafting the Bottom Line:* These practices jointly presuppose that legitimate collective choice requires universal acceptability achieved through transforming preferences, rather than aggregating fixed wills. They are consistent in treating counting as a subordinate, regrettable mechanism reserved for when deliberation fails or where personnel selection necessitates it.
