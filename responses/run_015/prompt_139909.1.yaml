      *   **Context:** Group disagreement over a specific case: A member visiting a "tight" culture plans to maintain "loose" home norms. A colleague shut down debate with "When in Rome, do as the Romans do."
      *   **Task:** Disambiguate the proverb into distinct precise claims (a "menu"), ordered from trivial to radical.
      *   **Requirements:**
          *   Verdict on each claim (platitude, substantive/defensible, contentious, false).
          *   Type of reason yielded (prudential, etiquette, obligation).
          *   Support for the colleague's usage (does it justify *requiring* conformity?).
          *   Address three complications: Self-application problem (permissive cultures), "Which Rome" problem (internal division/asymmetry), Abhorrent-Rome problem (unjust norms).
          *   Final analysis: What reading do people *actually* mean when using it to end an argument, and should they defend it?
      *   **Tone:** Academic, precise, philosophically rigorous, suitable for a reading group handout.
      *   **Candidate Readings to Refine:** Compliance (sanctions), Coordination (meaning), Epistemic Deference, Authority/Legitimacy, Expressive Respect.

  2.  **Deconstruct the Proverb ("When in Rome..."):**
      *   The proverb is often used as a conversation stopper. It implies a normative force that isn't immediately obvious.
      *   The colleague used it to imply *obligation* ("required... irrespective of whether she judges the local norms good").
      *   I need to separate *prudence* (don't get punished) from *morality* (you ought to do this).

  3.  **Drafting the Menu of Claims (Ordering from Trivial to Radical):**

      *   *Claim 1: Prudential Compliance.* (The Sanctions Reading). If you break rules, you get punished.
          *   Verdict: Platitude/True.
          *   Reason: Prudential.
          *   Support for colleague? No, doesn't establish moral obligation.
      *   *Claim 2: Communicative Coordination.* (The Meaning Reading). Actions need local context to be understood.
          *   Verdict: Substantive/Defensible.
          *   Reason: Pragmatic/Functional.
          *   Support for colleague? Weak. Explains *why* to conform, not necessarily *must*.
      *   *Claim 3: Epistemic Deference.* (The Knowledge Reading). Locals know best how to navigate their system.
          *   Verdict: Defensible but limited.
          *   Reason: Epistemic/Prudential.
          *   Support for colleague? No, visitor might know better (e.g., about justice).
      *   *Claim 4: Expressive Respect.* (The Guest Reading). Conforming shows respect to hosts.
          *   Verdict: Contentious/Defensible depending on weight.
          *   Reason: Moral/Etiquette.
          *   Support for colleague? Stronger. Implies a duty of hospitality/reciprocity.
      *   *Claim 5: Normative Sovereignty.* (The Authority Reading). The local normative order has legitimate authority over visitors.
          *   Verdict: Radical/Contentious.
          *   Reason: Political Obligation.
          *   Support for colleague? Yes, this matches the "required" tone. But is it true?

  4.  **Addressing the Complications:**

      *   *Self-Application (The Loose Rome):* If Rome is loose, do as Romans do = be loose. If I am from Tight, must I be loose?
          *   Analysis: The proverb is unstable here. It suggests the *meta-norm* is what matters. If the norm is tolerance, conformity requires tolerance.
          *   Verdict: Not fatal instability, but reveals the proverb tracks *meta-norms* of deviation, not just specific rules.
      *   *Which Rome (Internal Division):* Who are "The Romans"?
          *   Analysis: Power asymmetry. Strict groups punish deviation more than loose groups reward conformity. The proverb functionally favors the "Tight" faction.
          *   Verdict: The proverb has a conservative bias. It privileges the enforcers.
      *   *Abhorrent Rome (Unjust Norms):* What if the norm is sexist/racist/academically stifling?
          *   Analysis: Most readings collapse here except Prudential. Moral obligations usually trump local convention in liberal theory.
          *   Verdict: The proverb relies on a "ceteris paribus" clause of basic justice. Without it, it becomes complicity.

  5.  **Final Analysis (The "Conversation Stopper" Usage):**
      *   What do people mean? Usually a conflation of Prudential (you'll get in trouble) and Expressive Respect (don't be rude), smuggled in as Normative Sovereignty (you *must*).
      *   Should they defend it? No. It masks a political judgment about the legitimacy of the local norms as a pragmatic truism.

  6.  **Refining the Tone and Structure:**
      *   Use philosophical terminology (prudential, deontic, legitimacy, coordination).
      *   Keep it structured for a handout (numbered list, clear headings).
      *   Ensure the connection to the "Tight/Loose" theory (Gelfand et al.) is acknowledged where relevant.
      *   Make sure the distinction between *permission* and *obligation* is clear, as that was the user's main gripe.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific candidate readings the user mentioned?
      *   *Adjustment:* Ensure the "Menu" maps closely to their candidates (Compliance, Coordination, Epistemic, Authority, Expressive).
      *   *Check:* Did I answer the specific question about the colleague's usage?
      *   *Adjustment:* Make sure the conclusion explicitly states that the colleague's usage relies on the most radical/defensible reading without arguing for it.
      *   *Check:* Is the "Tight/Loose" context integrated?
      *   *Adjustment:* Mention how tight societies amplify the "Which Rome" problem.

  8.  **Final Polish:** Check for clarity, precision, and academic tone. (e.g., use terms like "deontic force," "normative friction," "asymmetry of enforcement"). Ensure the distinction between "is" and "ought" is maintained.

  *(Self-Correction on the "Self-Application" point)*: I need to be careful here. If the norm is "tolerance," then conforming means *being tolerant*. If the visitor is from a loose culture, they are already tolerant. If they are from a tight culture visiting a loose one, conforming means *not* enforcing their tightness. The instability arises if the visitor thinks "doing as Romans do" means "following specific rules" when the Roman rule is "no specific rules." I need to clarify that the proverb refers to the *regime* of norms, not just specific content.

  *(Self-Correction on "Which Rome")*: This is crucial for the Tight/Loose psychologist colleague. The "Tight" faction defines the cost of deviation. The "Loose" faction rarely defines the benefit of conformity. This creates a selection bias in the proverb's application.

  *(Self-Correction on "Abhorrent Rome")*: Connect this to political philosophy. Is there a duty to obey unjust laws/conventions? Usually no, unless the cost of resistance is catastrophic.

