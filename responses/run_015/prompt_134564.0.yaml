answer: |-
  Here is a plan designed to dismantle the two persistent misconceptions (Utility = Happiness; Utility Function = Welfare Measure) while respecting the technical needs of the Econ students and the ontological concerns of the Philosophy students.

  ### The Core Verdict: Cardinal vs. Ordinal
  **Is it the linchpin or a distraction?**
  It is the **linchpin**. You cannot kill the "Utility = Happiness" misconception without it.
  *   **Why:** If students believe utility is ordinal (only ranking matters), they cannot coherently believe it measures "intensity of satisfaction" (which requires cardinality). Last year, they carried the *cardinal* intuition from Expected Utility Theory (EUT) into Revealed Preference (RP) without noticing the shift.
  *   **The Move:** You must explicitly show that RP utility numbers can be stretched/compressed arbitrarily without changing the model's truth, whereas EUT numbers cannot. If they grasp this, the "happiness meter" idea collapses mathematically.
  *   **Time Cost:** 15 minutes. Do not cut this. If you cut this, you lose the philosophical payload.

  ---

  ### The One Example: "The Commuter's Route"
  **Why this example:** Fruit baskets imply inherent desirability (sweetness, nutrition). Money implies welfare directly. The Commuter example allows you to separate *choice* from *outcome value* cleanly.
  *   **Option A:** 20 minutes, high stress (congestion).
  *   **Option B:** 30 minutes, low stress (scenic).
  *   **What it must have:** It must be repeatable (to establish consistency/WARP) and it must allow for a gap between *chosen* and *good for* (to attack the welfare misconception).
  *   **What it must not have:** Do not introduce accident risk in the first half. Keep it deterministic choice first. Introduce risk only when comparing to EUT later.

  ---

  ### The Session Plan (75 Minutes)

  #### 1. Reset & The Reversal (0–15 mins)
  **Goal:** Invert the causal arrow. Choice is the data; Utility is the shadow.
  *   **The Setup:** Present the Commuter case. Tell them: "We do not know how the commuter feels. We only have the logbook of which route they took on 100 days."
  *   **The Activity (Econ/Phil Mix):**
      *   Give them a small dataset (3 choice situations with different budget constraints/route availabilities).
      *   **Task:** "Write down the preference relation $\succ$ that makes this data consistent."
      *   **Task:** "Assign utility numbers $U(A)$ and $U(B)$ that represent this relation."
      *   **Trap:** Half the room will assign $U(A)=10, U(B)=5$. The other half $U(A)=100, U(B)=1$.
  *   **The Point:** Ask the room: "Who is right?" When they say "Both," ask: "Then what does the *difference* (5 vs 99) represent?"
      *   *Answer:* Nothing.
      *   *Misconception Head-off:* This is where you stop the "Happiness" idea. If the difference means nothing, it cannot be "how much happier."

  #### 2. The Linchpin: Ordinal vs. Cardinal (15–30 mins)
  **Goal:** Cement the mathematical distinction to kill the hedonic interpretation.
  *   **The Bridge:** Remind them of last week's EUT. "In EUT, if $U(A)=10, U(B)=5, U(C)=0$, you care about the 5-point gap for risk calculations. In RP, if I transform $U$ to $U^2$, the choice prediction stays the same. In EUT, it does not."
  *   **The Demonstration:**
      *   Take the Commuter utilities from Part 1.
      *   Show that plugging RP utilities into an EUT lottery calculation yields different choices than plugging in the transformed utilities.
      *   **Conclusion:** "The utility function you just built from choice data is **mathematically incompatible** with the utility function required for risk decisions."
  *   **Why this order:** You must establish the *nature* of the RP number before you discuss what it *means*. If they think the number is cardinal, the welfare critique later will bounce off.

  #### 3. The Welfare Gap & Misconception Map (30–55 mins)
  **Goal:** Separate Choice from Welfare. Address the specific misconceptions for each cohort.
  *   **The Twist:** Modify the Commuter example. "Suppose we learn the commuter chooses Route A (Fast/Stressful) because they are rushing to a hospital, but they *hate* the stress and would prefer Route B if not for the emergency."
      *   *Alternatively (stronger for welfare):* "Suppose the commuter is addicted to the adrenaline of the congestion. They choose A, but report lower life satisfaction."
  *   **The Discussion:**
      *   **RP Verdict:** $U(A) > U(B)$.
      *   **Welfare Verdict:** Is the commuter *better off* choosing A?
  *   **Misconception Management (Targeted Interventions):**
      *   **For the Econ/PPE students (The "Behaviorism" Trap):** They often think RP *denies* mental states.
          *   *Correction:* "RP is not a claim about the mind; it is a constraint on the *model*. We can believe they have feelings, but if we want to predict choice using only choice data, we must bracket the feelings."
      *   **For the Philosophy students (The "Indifference" Trap):** They often think indifference is revealed when someone "could have chosen either."
          *   *Correction:* "Indifference is never revealed by a single choice. It is only inferred if choice flips randomly across identical scenarios *or* if we assume optimization and see them choose from a set where both are available and cost the same. A single choice reveals $\succeq$, not $\sim$."
      *   **For the Future Policymakers (The CBA Tension):**
          *   **The Holding Pattern:** "When you do Cost-Benefit Analysis, you are imputing welfare from choice. This is a **model assumption**, not an observation. It is like assuming a map scale is 1:1. It is necessary for navigation, but fatal if you forget it's an assumption."
          *   **Key Phrase:** "Revealed Preference measures *decision weight*, not *well-being*."

  #### 4. The Final Question (55–65 mins)
  **Goal:** Test understanding, not memory.
  *   **The Question:** "A government agency observes that workers in a dangerous factory accept higher wages to stay. They use this revealed preference to calculate the 'Value of a Statistical Life' for safety regulations. Based on today's seminar, what is the specific philosophical error they risk making if they treat this number as a measure of worker welfare rather than a measure of labor market constraints?"
  *   **Desired Answer:** They are conflating *choice under constraint* (RP) with *normative well-being* (Welfare). The workers might choose the danger because they have no other option (budget constraint), not because the danger adds utility. The number reflects market equilibrium, not happiness.

  #### 5. Buffer & Wrap (65–75 mins)
  *   Address lingering confusion.
  *   Reiterate: "Next week we ask: If choice doesn't reveal welfare, what does?"

  ---

  ### What to Refuse (The "Out" List)
  You are correct to exclude the following. Defend this to the convener by arguing **Cognitive Load vs. Philosophical Payoff**.
  1.  **Afriat's Theorem:** Too technical. It proves a representation exists. You care about what the representation *means*.
  2.  **Strong Axiom (SARP):** WARP is sufficient for the conceptual point. SARP is for demand theory rigor, not philosophy of choice.
  3.  **Integrability:** Irrelevant for the welfare/choice distinction.
  4.  **Stochastic Choice:** Keep it deterministic. Adding probability clouds the ordinal/cardinal distinction you need to make sharply.

  ---

  ### The 10-Minute Cut Plan
  **If you lose 10 minutes, cut the WARP mechanics (Part 1).**
  *   **Change:** Do not make them *check* the axiom against a table. Simply *state* that we assume choices are consistent (WARP holds) and move immediately to assigning numbers.
  *   **Why:** The Econ students can read WARP checking in a textbook. The philosophical distinction between Ordinal/Cardinal and Choice/Welfare is not in the textbook and is the source of their lasting confusion.
  *   **Risk:** Econ students might feel the math was too light. Mitigate by putting the WARP definition on the handout.

  ### What Would Change the Ordering?
  **The only reason to move the Welfare Gap (Part 3) earlier:**
  If you sense the room is hostile to the formalism. If the Philosophy students are glazing over during the Ordinal/Cardinal math, you must motivate *why* the math matters.
  *   **Pivot:** Start with the "Addict/Smoker" case immediately. Show that $U(Smoke) > U(Quit)$ by choice. Ask "Is this good?" Then say, "To understand why our math says 'yes' but our intuition says 'no', we need to look at how we built the numbers."
  *   **Why I didn't recommend this:** It risks letting the Econ students dismiss the welfare critique as "normative fluff" before they've bought into the technical model. Secure the technical model first, then pull the rug.

  ### Confidence Levels
  *   **High Confidence:** The Cardinal/Ordinal distinction is the necessary condition for killing the "Happiness" myth. Without it, the welfare critique lacks teeth.
  *   **Medium Confidence:** The "Commuter" example. It is neutral, but ensure you don't accidentally make "Stress" sound like a disutility that *is* welfare. Stress must be framed as a *feature* of the option, not the *metric* of the outcome.
  *   **Low Confidence:** The Final Question. It relies on students grasping "constraints" quickly. If they struggle, have a backup: "If I force you to choose B, and you say 'Thank you,' what does that imply about your revealed preference vs. your welfare?"

  ### Defense to the Convener
  If the convener asks why you are spending 25 minutes on "Welfare" instead of "Axioms":
  *   **Argument:** "Last year, students mastered the axioms but failed the course's learning outcome: understanding the *normative implications* of rational choice models. They left thinking EUT and RP measure well-being. This leads to category errors in their future work (CBA, policy). This session corrects the ontology of the utility function. The axioms are tools; the ontology is the philosophy."
