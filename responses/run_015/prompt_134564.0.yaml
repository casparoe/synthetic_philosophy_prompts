      *   **Task:** Teaching the 2nd seminar of a 'Rationality and Choice' course (3rd year running).
      *   **Audience:** 25 students, mostly 2nd-years. Split: ~50% Econ/PPE, ~50% Philosophy.
      *   **Previous Week:** Expected Utility Theory (EUT). Students know how to calculate EU, know Allais/Ellsberg violations, use "utility" fluently but don't know where numbers come from.
      *   **Current Topic:** Revealed Preference (RP). Choice $\to$ Preference $\to$ Utility Representation $\to$ Meaning of Utility Numbers.
      *   **Past Failure:** Students learned Weak Axiom of Revealed Preference (WARP) and checking it, but retained two false beliefs: (1) Utility = happiness/satisfaction (hedonic), (2) Fitted utility function = welfare measurement.
      *   **Goal:** A *plan* (ordering, rationale, examples, misconception management), not a lecture script. Needs to address the cardinal vs. ordinal distinction, hold the tension between "numbers aren't heaven-sent" and "numbers aren't worthless," and specify what to cut/keep.
      *   **Constraints:** 75 minutes.

  2.  **Deconstruct the Core Philosophical/Pedagogical Problem:**
      *   *The Trap:* Students treat utility as a psychological substance (hedonia) that causes choice. RP theory says choice *is* the data; utility is just a mathematical shadow of choice.
      *   *The Welfare Fallacy:* Just because $U(A) > U(B)$ mathematically represents $A \succ B$, it doesn't mean A makes the agent *better off* in a normative/welfarist sense (could be addiction, mistake, adaptive preference).
      *   *The Cardinal/Ordinal Distinction:* EUT requires cardinal utility (risk attitudes matter). RP theory usually only guarantees ordinal utility (ranking matters, magnitude doesn't). This is crucial for the "where do numbers come from" question.
      *   *The Audience Split:* Econ students want the math/structure. Phil students want the ontology/normativity. The plan must bridge these.
      *   *The Future Practitioners:* Some will do Cost-Benefit Analysis (CBA). They need to know the numbers are constructed/assumed, not discovered, but still usable if treated carefully.

  3.  **Address the Specific Questions:**

      *   **Ordering:** What comes before what?
          *   Need to break the "Utility $\to$ Choice" intuition first. Establish "Choice $\to$ Preference $\to$ Utility."
          *   Need to introduce the example early and stick with it.
          *   Need to handle the Cardinal/Ordinal distinction *after* establishing the ordinal nature of RP, but *before* connecting back to EUT (to show the tension).
          *   Welfare critique needs to come last, once the technical definition is secure.
      *   **Cardinal vs. Ordinal:** Is it the linchpin or a distraction?
          *   *Verdict:* It's the linchpin. Why? Because last year they came from EUT (cardinal) to RP (ordinal) without noticing the shift. That's why they think the RP utility numbers measure "intensity" of satisfaction. Clarifying this kills the "happiness meter" myth.
      *   **The One Example:** Fruit baskets failed because "apples/oranges" implies inherent value.
          *   *Requirement:* Needs to be abstract enough to avoid hedonic assumptions but concrete enough to track. Needs to involve risk or context to highlight the ordinal/cardinal gap? No, keep it simple choice first.
          *   *Idea:* "The Bureaucrat's Budget." Or "The Addict's Choice." Or "The Deceptive Menu."
          *   *Better Idea:* **The "Commitment" Choice.** (e.g., Choosing a gym membership vs. pay-per-visit). Or **The "Status" Choice.**
          *   *Best Idea:* **The "Unhealthy Snack" / Self-Control Case.** (e.g., Fruit vs. Cake). Why? It directly attacks the Welfare assumption. If I choose Cake, $U(Cake) > U(Fruit)$. Does that mean Cake is *better for me*? No. This hits the welfare misconception immediately.
          *   *Wait, User said:* "Fruit-basket thing... apples and oranges are too obviously proxies."
          *   *Alternative:* **Abstract Bundles with Labels.** Bundle A (10 hrs work, \$500), Bundle B (8 hrs work, \$400). Or **The "Vote" Example.**
          *   *Selected:* **The "Commuter's Route."** Route A (Fast, Stressful), Route B (Slow, Scenic). It avoids "happiness" connotations of fruit. It allows for welfare critique (maybe Stressful is bad for health). It allows for context dependence (rain changes choice).
          *   *Refinement:* Let's go with **"The Office Snack Fund."** Contributing vs. Free-riding. Or **"The Library Seat."**
          *   *Actually, the strongest philosophical punch:* **The "Maladaptive Preference" Case.** (e.g., The Smoker). Choosing Cigarettes over Health. $U(Cig) > U(Health)$ by RP. Is Welfare(Cig) > Welfare(Health)? No. This kills the welfare myth instantly.
          *   *Decision:* **The "Reluctant Smoker" (or Addict).** It forces the gap between Choice and Welfare.
      *   **Misconception Map:**
          *   Econ Students: Think RP is just a math trick to get demand curves. Think WARP = Rationality.
          *   Phil Students: Think RP is Behaviorism (denies mental states). Think Indifference = "Could have chosen either."
          *   Timing: Address Behaviorism early (ontological commitment). Address Indifference during WARP. Address Welfare at the end.
      *   **The Final Question:** Needs to test understanding, not memory. "If we observe X, can we say Y?"
      *   **CBA Tension:** How to hold "numbers aren't real" and "numbers are useful."
          *   *Analogy:* Maps. A map isn't the territory, and the scale is chosen by the cartographer, but you still need it to navigate.
      *   **What to Cut:** Afriat, SARP, Integrability. Definitely out.
      *   **10-Minute Cut:** The Cardinal/Ordinal deep dive? No, that's the linchpin. The Welfare discussion? No, that's the point. The WARP mechanics? Maybe simplify the checking.
      *   **Confidence Level:** High on structure, moderate on specific example resonance.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Intro (5 mins):* Reset the utility concept. From EUT (numbers given) to RP (numbers derived).
      *   *Phase 1: The Reversal (15 mins).* Choice is primitive. Preference is a relation derived from choice. Utility is a function representing that relation.
          *   *Example:* Introduce the "Reluctant Smoker" here? No, too loaded. Let's use **"The Commuter"** (Route A vs Route B). Neutral.
          *   *Activity:* Give them choice data. Ask them to write the preference relation. Then assign numbers. Show that *any* increasing numbers work.
      *   *Phase 2: The Cardinal/Ordinal Linchpin (15 mins).* Connect back to EUT.
          *   In EUT, $0.5 U(A) + 0.5 U(B)$ matters. Magnitude matters.
          *   In RP, only order matters.
          *   *Crucial Point:* If you use RP utility in an EUT calculation, you get nonsense. This proves RP utility $\neq$ Happiness intensity.
      *   *Phase 3: The Welfare Gap (25 mins).* The core philosophical payload.
          *   Switch example to **"The Reluctant Smoker"** (or similar).
          *   Choice: Smokes. RP says $U(Smoke) > U(Quit)$.
          *   Welfare: Is Smoker better off?
          *   Discussion: Mistakes, Addiction, Adaptive Preferences.
          *   CBA Connection: When government puts a number on a life, are they measuring choice or welfare? Usually imputing welfare from choice. Danger zone.
      *   *Phase 4: Misconceptions & Wrap (15 mins).*
          *   Behaviorism charge.
          *   Indifference clarification.
          *   Final Question.

      *   *Refining the Example:* The User hated fruit baskets. The Smoker example is good for welfare, but maybe too cliché? How about **"The Overworked Analyst"**? Choice: Work late (Bonus) vs. Go home (Rest).
          *   Let's stick with **"The Commuter"** for the technical RP part (neutral), and switch to **"The Dieter"** or **"The Smoker"** for the Welfare part. Actually, one example carrying everything is requested.
          *   *One Example Constraint:* "I also want the one example that should carry everything."
          *   Okay, need one example that does Technical RP *and* Welfare Critique.
          *   **The "Gym Membership" Case.**
          *   Option A: Pay \$50/session. Option B: Pay \$500/month unlimited.
          *   Choice: Choose B, go 2 times.
          *   RP: B chosen over A.
          *   Welfare: Was B better? No, wasted money.
          *   Wait, that's framing.
          *   Let's try **"The Final Grade Choice."**
          *   Option A: Easy class, B grade. Option B: Hard class, A grade.
          *   Student chooses A.
          *   RP: $U(Easy/B) > U(Hard/A)$.
          *   Welfare: Is the student better off? Maybe they needed the A for med school.
          *   *Better:* **"The Policy Vote."** (Fits CBA angle).
          *   Let's go with **"The Safety vs. Speed" Commute.**
          *   Route 1: 20 mins, 1% accident risk. Route 2: 30 mins, 0% risk.
          *   Choice: Route 1.
          *   RP: $U(R1) > U(R2)$.
          *   Welfare: If they crash, were they better off? Ex-ante vs Ex-post.
          *   *Decision:* **The "Safety vs. Speed" Commute.** It allows for risk (linking to EUT), it allows for welfare critique (accidents are bad), and it allows for CBA links (value of statistical life).

      *   *Refining the Cardinal/Ordinal:* Is it the linchpin? Yes. If they think RP utility is cardinal, they think the *difference* in utility numbers means something (e.g., "twice as happy"). Showing it's ordinal kills that. It also explains why you can't plug RP utilities into EUT formulas.
      *   *Refining the Cut:* If 10 mins lost, cut the formal WARP checking exercise. Do it conceptually. The Welfare discussion is the PhD-level value add. The Math is undergrad econ.
      *   *Refining the CBA Tension:* Use the "Map" analogy. The map is not the territory (utility is not welfare), but you can't navigate without a map (policy needs numbers). The error is confusing the map scale with reality.

  5.  **Finalizing the Structure:**
      *   **0-10:** Reset & The One Example (Commuter).
      *   **10-30:** The Construction (Choice $\to$ Pref $\to$ Utility). Ordinality demonstration.
      *   **30-45:** The Linchpin (Cardinal vs. Ordinal). Link back to EUT.
      *   **45-65:** The Welfare Gap (Misconceptions, CBA, Normativity).
      *   **65-75:** Final Question & Wrap.

  6.  **Review against Constraints:**
      *   Plan not lecture? Yes.
      *   Order and Why? Yes.
      *   Cardinal/Ordinal verdict? Yes (Linchpin).
      *   One Example? Yes (Commuter).
      *   Misconception Map (Econ vs Phil)? Yes.
      *   Final Question? Yes.
      *   CBA Tension? Yes.
      *   What to cut/defend? Yes.
      *   Confidence levels? Yes.

  7.  **Self-Correction/Nuance Check:**
      *   *Worry:* Is the Commuter example too close to EUT (risk)?
      *   *Fix:* Make the first part deterministic (Route A vs B without risk) to establish RP. Bring risk in only during the Cardinal/Ordinal comparison to show the clash.
      *   *Worry:* Will Phil students glaze over during the ordinal transformation math?
      *   *Fix:* Keep it visual. $1, 2, 3$ vs $10, 50, 100$. Same order, different "distance."
      *   *Worry:* Will Econ students get bored during the Welfare critique?
      *   *Fix:* Frame it as "Model Specification Error." They care about valid inference. Inferring Welfare from Choice is an invalid inference without extra assumptions.

  8.  **Final Polish:** Ensure tone is collegial (PhD to PhD) but directive. (Proceed to generate output).

