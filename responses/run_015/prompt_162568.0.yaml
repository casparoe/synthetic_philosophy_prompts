      *   **Fine-Tuning:** Fine-tuning works differently. It's not about $N$ (number of humans), it's about $P(\text{Constants} | \text{Life})$. If constants are random, life-permitting ones are rare. Finding ourselves in one updates toward "Constants aren't random" or "Multiverse exists." The User's argument conflates *number of observers* with *probability of conditions*.

