  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Friend's Point:* It's strong. EWV assumes fixed $E$. Here $E$ is fluid. 8 introduces new $E$ (knife). So it's not disagreement on $E$, it's disagreement on *what counts*.
      *   *Peerhood:* 10 is racist. 7 is lazy. 3 is traumatized. They fail the peer condition. 8 is steadfast because he sees they aren't peers. Conciliationism only binds you among peers.
      *   *Retrospective:* We judge 8 as the superior epistemic agent only after. In the moment, he's just an outlier. The film shows peerhood is earned through performance, not granted by status (juror duty).
      *   *Film's Addition:* Epistemology is embodied. Heat, sweat, timing. Belief change is emotional (Juror 3 tearing photo). Standard models ignore this.
      *   *Resistance:* 8 does argue for innocence implicitly. He reconstructs the crime. He's not just saying "maybe." He's saying "their story is impossible." That looks like substantive disagreement.
      *   *Scenes:* Knife duplication (evidence expansion), 10's rant (peerhood collapse), 3's breakdown (affective conversion), Final table scene (consensus without uniform belief).

