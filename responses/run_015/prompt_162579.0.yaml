  You ask what goes in the number's place. Nothing. Abandoning quantification because it is hard is what leads to the self-dealing you criticized earlier. It is my own commitment that a soft number is better than no number, provided we label the uncertainty. Critics argue this legitimizes bad spending. I argue it prevents worse spending. We do not stop weighing things because the scale is imperfect; we stop trusting people who refuse to step on the scale.
