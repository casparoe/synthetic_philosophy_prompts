  Aesthetic praise meets moral **judgment**.
  Nothing washes out the **stain**.

  Is the mark actually a **stain**?
  Or just a shadow on the **form**?
  Our knowledge shifts the **judgment**.
  The object stays the same **work**.
  Only the myth of the **artist**.
  Knows a heavy, guilty **silence**.

  Ignorance offers sweet **silence**.
  Once known, the viewer takes the **stain**.
  Not in the brush, but the **artist**.
  Corrupting the pure **form**.
  Or so we say of the **work**.
  Where does the true **judgment** land?

  Reverse genetics cloud **judgment**.
  Knowing breaks the quiet **silence**.
  Is it still the same **work**?
  The contamination is a **stain**.
  Inside the mind, not the **form**.
  Blaming the ghost of the **artist**.

