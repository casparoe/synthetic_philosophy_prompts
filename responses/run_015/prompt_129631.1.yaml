  Or let the piece face **judgment**.
  Alone within its **form**.
  The audience holds **silence**.
  Wondering where the **stain** lives.
  Inside the viewer or the **work**.

  The **artist** walks away, leaving the **work**.
  Our **judgment** wears the invisible **stain**.
  No perfect **form** breaks this **silence**.

  - Commentary

  The sestina's rotating end-words mimic the obsessive return of biographical context. Even when we try to focus on "form" or "work," the "artist" and "stain" keep cycling back into position, mirroring how ethical knowledge intrudes on aesthetic experience. The autonomy thesis appears subtly in stanza three ("The object stays the same work"), suggesting the piece is immutable regardless of context. Conversely, the moralist view hits hard in stanza two ("We hate the sinning artist"), implying that vice inevitably corrupts reception and value.

  The niche distinction regarding retrospective contamination shows up in stanza four and five. When I write "Once known, the viewer takes the stain," I'm pointing to the idea that the moral flaw isn't in the object but in our knowledge-state. Stanza five's "Inside the mind, not the form" reinforces this, contrasting with the reverse genetic fallacy mentioned earlier ("Reverse genetics cloud judgment"). This separates the origin of the art from the viewer's contaminated perspective.

  The envoi refuses to solve the puzzle, fitting the philosophical stalemate. By ending on "silence" with "form" embedded inside, it suggests that no structural beauty can fully quiet the ethical noise. The tension hangs because the words themselves refuse to settle; "work" and "artist" remain linked even in the final breath. It's a stalemate because the poem, like the debate, circles without landing. The rotation ensures that just when you think you've isolated the art, the biography returns to claim its spot at the end of the line, leaving us in unresolved quiet.
