answer: |-
  This is an excellent set of questions. Your instincts are correct: the TA's crib sheet is a "cartoon version" of the debate. It captures the slogans but flattens the nuances, and in doing so, it makes a few category errors that would definitely be marked down in a seminar paper.

  Here is a breakdown of the paragraph, followed by answers to your specific questions about Temporary Intrinsics, Change, Presentism, Temporary Parthood, and the "Merely Verbal" objection.

  ### Part 1: Claim-by-Claim Critique
  *What a careful perdurantist (and a careful endurantist) would say about the TA's sentences.*

  **1. "Endurantism says that when a thing persists it is wholly present at each moment it exists... Perdurantism... says a persisting thing is a long spacetime object made of temporal parts..."**
  *   **Verdict:** **Acceptable.**
  *   **Nuance:** This is the standard definition. A perdurantist accepts this. An endurantist accepts the first half. The only wince might come from the phrase "nothing is ever wholly present at an instant" regarding perdurance. A perdurantist would say the *temporal part* is wholly present at that instant, just not the *whole worm*. But as a summary, this is fine.

  **2. "Lewis more or less settled this with the argument from temporary intrinsics: an endurantist who is bent at one time and straight at another has to say that the very same object has incompatible intrinsic properties, which is impossible."**
  *   **Verdict:** **Wince / Oversimplified.**
  *   **Nuance:** Lewis didn't "settle" it (philosophy rarely gets settled), and the problem isn't just logical incompatibility (like being a circle and a square). The problem is about **intrinsicality**. If I am bent at $t_1$ and straight at $t_2$, and I am wholly present at both, do I possess the property *bent* simpliciter? If yes, contradiction. If no, then I possess *bent-at-t1*. But *bent-at-t1* is a relation to a time, not an intrinsic shape. Lewis's point is that endurantism forces us to deny that shapes are intrinsic properties. A careful perdurantist would say the TA missed the point about the *nature of properties*.

  **3. "The perdurantist avoids this because the shape gets attached to a temporal part, which is genuinely intrinsically bent."**
  *   **Verdict:** **Accept.**
  *   **Nuance:** This is the standard perdurantist solution. The temporal part at $t_1$ has the property *bent* simpliciter. No contradiction.

  **4. "Notice the cost, though: on the perdurantist picture nothing ever really changes, since the worm just has a straight bit and a bent bit, and change becomes an illusion."**
  *   **Verdict:** **Wrong (from the perdurantist's perspective).**
  *   **Nuance:** A perdurantist vehemently denies change is an illusion. They offer an **analysis of change**: to say an object changes is to say it has temporal parts with different qualitative properties. They argue this captures everything we care about regarding change. The *endurantist* is the one claiming this is an illusion (or merely "Cambridge change"). The TA is presenting an endurantist objection as if it were an established fact.

  **5. "And endurantism only works if you are also a presentist..."**
  *   **Verdict:** **Just Wrong.**
  *   **Nuance:** This is the biggest error in the paragraph. There is a robust position known as **Eternalist Endurantism** (defended by philosophers like Kit Fine, Trenton Merricks, and E.J. Lowe). They argue you can endure through time even if past and future exist, usually by modifying how objects instantiate properties (e.g., via "tensed facts" or "relativized instantiation").

  **6. "...so this whole dispute is really just the old fight about whether the past and future exist."**
  *   **Verdict:** **Just Wrong.**
  *   **Nuance:** This conflates the **ontology of time** (Presentism vs. Eternalism) with the **ontology of persistence** (Endurance vs. Perduration). While they are related, they are distinct debates. (See Part 4 below).

  ---

  ### Part 2: Your Three Specific Uncertainties

  **1. Is the Argument from Temporary Intrinsics (ATI) about incompatibility or intrinsicality?**
  You are right to be suspicious. The TA presents it as a logical contradiction ($A$ is $F$ and $A$ is not-$F$). But the endurantist can easily avoid the contradiction by saying "$A$ is $F$-at-$t_1$" and "$A$ is not-$F$-at-$t_2$."
  *   **Lewis's Real Point:** The problem isn't the contradiction; it's that *$F$-at-$t$* is a **relation**, not an intrinsic property. Being "bent" feels like a monadic property of the object itself, not a relation between the object and a time. Lewis argues that endurantism forces us to treat intrinsic shapes as relations to times, which strips them of their intrinsicality. Perdurantism saves the intrinsicality of shape by locating it in the temporal part.
  *   **Takeaway:** It is about preserving the intuition that properties like "bent" are intrinsic, not about avoiding logical contradiction (which is easily avoided by indexing).

  **2. Is change an illusion for perdurantists?**
  No. This is a rhetorical move by endurantists.
  *   **Perdurantist Account:** Change is qualitative variation across temporal parts. Just as a road can be paved here and unpaved there (spatial variation), a person can be bent here and straight there (temporal variation).
  *   **The Disagreement:** The endurantist argues that for *real* change, the **same subject** must have different properties. For the perdurantist, the "subject" at $t_1$ (the temporal part) is numerically distinct from the "subject" at $t_2$. So, the perdurantist analyzes change as variation across parts, while the endurantist analyzes it as alteration of a whole. Whether one is an "illusion" depends on which analysis you prefer. A perdurantist will insist their account captures all the physical and phenomenological facts of change.

  **3. Does endurantism require presentism?**
  Absolutely not.
  *   **Presentist Endurantism:** Only the present exists; the object is wholly present now. (The common-sense view).
  *   **Eternalist Endurantism:** Past, present, and future exist. The object is wholly present at $t_1$, wholly present at $t_2$, etc. The challenge is explaining how the *same* whole object can have different properties at different times without contradiction. They solve this not by temporal parts, but by saying instantiation is time-relative (e.g., "Socrates is *at-t1* bent").
  *   **Takeaway:** The TA has collapsed two distinct axes of metaphysics. You can mix and match them (though Eternalist Perdurantism is the most popular combination in analytic metaphysics).

  ---

  ### Part 3: The "Problem of Temporary Parthood"

  Your TA mumbled about a cat losing a tail. This is a genuine problem in the literature, often discussed by Ted Sider and others.

  *   **The Problem:** If a cat (Endurantist view) loses its tail, does the cat *simpliciter* have the tail as a part?
      *   If yes, then after the loss, the cat still has the tail as a part (contradiction).
      *   If no, then parthood must be a three-place relation: $x$ is a part of $y$ *at time $t$*.
  *   **Is it distinct from ATI?** It is **structurally isomorphic**. It applies the exact logic of the ATI to the relation of *parthood* rather than *property instantiation*.
      *   ATI: How can one object have incompatible properties?
      *   Temporary Parthood: How can one object have different mereological compositions?
  *   **Does it add independent pressure?** Yes. Even if you think you have a solution to ATI (e.g., adverbialism), you still need to explain parthood. If you say properties are time-relative, you must also say parthood is time-relative. Perdurantists get a "free" win here: the $t_1$-part of the cat has the tail-part; the $t_2$-part does not. Parthood is timeless between parts.
  *   **Verdict:** It's not a "new" argument so much as a demonstration that the ATI applies to *mereology* as well as *qualitative properties*. It tightens the screw on the endurantist, forcing them to make both instantiation and parthood time-relative relations.

  ---

  ### Part 4: Is the Dispute Just Presentism vs. Eternalism?

  The TA's final move ("this whole dispute is really just the old fight about whether the past and future exist") is a **category mistake**.

  1.  **Persistence** asks: How does an object exist *through* time? (As a whole or as parts?)
  2.  **Temporal Ontology** asks: Which times *exist*? (Only now, or all of them?)

  You can logically hold four positions:
  1.  **Presentist Endurantism:** (Standard Common Sense).
  2.  **Eternalist Perdurantism:** (Lewis/Sider).
  3.  **Eternalist Endurantism:** (Fine/Merricks).
  4.  **Presentist Perdurantism:** (Rare, but conceptually possible: only the present temporal part exists).

  The debates are linked because Eternalism makes Perdurantism more attractive (if the future exists, it's easier to think of it as a dimension like space), and Presentism makes Endurantism more attractive (if only the now exists, there's nothing to have "parts" in). But they are not identical. The TA is simplifying the map to the point of error.

  ---

  ### Part 5: Is the Debate "Merely Verbal"?

  Your professor's hint points to a meta-ontological debate made famous by **Eli Hirsch** and **Ted Sider**.

  *   **The Deflationary View (Hirsch):** The dispute is verbal. Endurantists and Perdurantists are using different conceptual schemes or different meanings of "part" and "persist." Once we translate one language into the other, they agree on all the physical facts. There is no "fact of the matter" about which is true.
  *   **The Substantive View (Sider):** The dispute is about **joint-carving**. One view captures the fundamental structure of reality better than the other. Even if they agree on where the cat is at every instant, they disagree on the *fundamental ontology*. Sider argues that quantifiers and logical structure reflect reality's structure, so the debate is substantive.

  **Is your prof dodging the question?**
  Probably not. They are likely pointing out that much of the *heat* in the debate comes from talking past one another. However, most contemporary metaphysicians treat it as substantive because it has downstream effects on:
  *   **Modality:** What is possible for the object?
  *   **Grounding:** What makes statements about the past true?
  *   **Ethics:** How do we understand responsibility over time? (If I am a worm, is my future part "me" in the same way my hand is "me"?)

  **Recommendation:** Treat the debate as substantive for the purpose of the seminar, but keep the "verbal" objection in your back pocket as a critical tool. If a definition seems stipulative, ask: "Does this capture the phenomenon, or just define it away?"

  ### Summary for your Seminar
  1.  **The TA's Sheet:** Use it for definitions, but distrust the philosophical claims (especially regarding Lewis, Change, and Presentism).
  2.  **ATI:** It's about preserving intrinsic properties, not avoiding contradiction.
  3.  **Change:** Perdurantists have an account of change (variation across parts); they don't admit it's an illusion.
  4.  **Presentism:** Endurantism does *not* require Presentism.
  5.  **Temporary Parthood:** Real problem, isomorphic to ATI, adds pressure to make parthood time-relative.
  6.  **Verbal Dispute:** A serious meta-ontological position, but most treat the debate as substantive regarding the structure of reality.

  If you want to impress the TA/Prof, point out the distinction between **Eternalist Endurantism** and **Eternalist Perdurantism**. That alone proves the TA's final sentence wrong.
