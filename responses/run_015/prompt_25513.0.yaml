      *(Self-Correction on Q1)*: Make sure to distinguish between "politically justified" and "morally innocent." Walzer says you are politically justified but morally guilty.
      *(Self-Correction on Q3)*: Emphasize that DH relies heavily on *necessity*. If Nagasaki wasn't necessary, DH doesn't cover it.
