answer: |-
  Prioritize resolving whether your vocabulary serves instrumental prediction or mechanistic explanation, then define the temporal boundaries of the agent, and finally establish whether behavioral guidance suffices for belief attribution.

  **1. Does successful behavioral prediction justify attributing propositional attitudes regardless of underlying mechanism?**
  This question is upstream because it determines whether inconsistencies are categorized as system errors (realist view) or acceptable variance in a predictive model (instrumentalist view). If you adopt Dennett's strict intentional stance, the system that flips claims under paraphrase but remains predictable is correctly described as having beliefs relative to that context; if you require mechanistic isomorphism, that same behavior is merely pattern completion. This is highly tractable by conceptual analysis alone because it is a policy decision about the purpose of your evaluation framework rather than an empirical discovery about transformer architecture. Move this up if your evaluation protocols must support legal liability or safety compliance, which demand realist accounts of intent; move it down if your goal is purely performance benchmarking where predictive utility is the only metric that matters.

  **2. Over what contextual window must consistency hold for a state to be attributed to the system?**
  This question is upstream because it defines the identity conditions of the "agent" you are evaluating, directly resolving the puzzle of personas with incompatible views across sessions. Conceptual analysis can establish whether the "system" is the static weights, the session instance, or the single generation step, but it requires mapping these philosophical categories to your technical architecture to ensure tractability. If you define the agent as the session, persona switching is feature-consistent; if you define it as the base model, it is schizophrenia or roleplay. Move this up if your product relies on long-term memory or user-specific customization, as consistency becomes a core feature; move it down if you are evaluating stateless APIs where each prompt is treated as an independent interaction.

  **3. Must an attributed belief survive explicit denial to count as a held state?**
  This question is upstream because it dictates how you label the system that uses a fact to guide answers yet denies it when asked directly, distinguishing between implicit operational knowledge and explicit commitment. It is less tractable by conceptual analysis alone because it requires operationalizing "behavioral guidance" in text-only models, risking ambiguity without empirical validation protocols. Resolving this determines whether you classify the failure as a false belief (internal inconsistency) or a communication error (output layer mismatch). Move this up if detecting deception or alignment falsification is your primary safety concern; move it down if task completion rates are your sole success metric, rendering the internal consistency of facts irrelevant.
