answer: |-
  Dear colleagues, I am writing to propose a structured decision procedure for our board to use when evaluating proposals to open markets in goods currently protected from trade, a need made urgent to me by personal circumstances involving my sibling's dialysis and our recent inability to rigorously assess the ethics of compensated organ donation during dinner. We lack economists on staff, we meet only monthly, and we must defend our recommendations to a legislature that distrusts abstract philosophy, so the tool I am outlining below is designed to be run in roughly forty-five minutes, moving from factual determination to value judgment without pretending to settle questions that are genuinely about values. The procedure is built to translate the philosophical distinction between corruption, where pricing alters the intrinsic meaning of a good, and crowding-out, where pricing displaces non-market motivations, into a sequence of practical questions with clear stopping rules that yield one of three recommendations: prohibit, restrict with enforceable safeguards, or permit with post-hoc monitoring.

  The procedure begins with a factual baseline check that should take no more than ten minutes, asking whether the good in question is essential for life or civic participation and whether there is evidence of immediate scarcity or coercion. If the good is not essential, such as luxury cosmetics, the procedure defaults to permit with monitoring, but if the good is essential, like kidneys, votes, or emergency water, we move to the second step, which is the semantic degradation test. This is the core of the corruption check and requires the board to ask whether introducing compensation would permanently change how the good is spoken about, recognized, and valued within the affected community. Since we have no budget for formal sociological study, we must look for observable shifts in institutional language, social practice, or public justification. Specifically, you must ask if the standard forms, contracts, or media framing will shift from words like gift, duty, or right to words like product, vendor, or asset. If the board agrees that the institutional language will shift permanently such that the previous non-market meaning becomes unintelligible or unavailable, this counts as sufficient evidence of semantic degradation. If semantic degradation is confirmed, the default recommendation is prohibit, unless the board makes a specific judgment call that the physical survival of participants outweighs the loss of meaning, which must be signed off by a majority vote and recorded as a value judgment rather than a factual finding. If semantic degradation is not confirmed, we proceed to the third step, the motivation crowd-out check, which asks whether introducing payment will displace existing non-market motivations like altruism or civic duty. Here we look for evidence that current suppliers will stop providing the good once payment is introduced, or that the quality of the good will drop because the motivation has shifted from care to profit. If crowd-out is likely, the recommendation is restrict with enforceable safeguards, such as capping payments or requiring altruistic screening. If crowd-out is unlikely, we move to the fourth step, the vulnerability assessment, asking whether the participants are so desperate that their consent cannot be considered voluntary. If desperation is high, the recommendation is restrict with safeguards to protect the vulnerable. If desperation is low, the recommendation is permit with monitoring. At any point where relevant data is missing, such as unknown rates of crowd-out or unclear linguistic shifts, the procedure dictates that we assume the worst-case scenario for the vulnerable party unless the board votes to accept the uncertainty, and this acceptance must be logged as a judgment call. Finally, the procedure requires a closing vote where the board acknowledges that if the steps lead to a recommendation that conflicts with their intuitive moral reaction, they must either override the procedure with a documented value judgment or accept the procedure's output as a shield against legislative criticism.

  To demonstrate how this works in practice, I will apply the procedure to the proposal to allow direct cash payments to live kidney donors within a public health system. Starting with the factual baseline, kidneys are essential for life, there is severe scarcity, and donors face surgical risk, so we proceed to the semantic degradation test. We must ask if paying donors will change the language from donation to sale. Observable evidence would include hospital forms changing from donor consent to vendor contracts, and media stories shifting from heroes to suppliers. If the board determines that this shift will make the concept of a gift kidney unintelligible in the future, semantic degradation is confirmed. In my estimation, this is a high-risk area for degradation, as the language of commerce tends to colonize medical practice. If we confirm degradation, the procedure says prohibit. However, here we hit the first uncomfortable judgment call, because the physical need is immediate and lethal. The board must vote on whether saving lives now outweighs the corruption of the meaning of donation later. If we vote that life outweighs meaning, we bypass the prohibition and move to the crowd-out check. Will altruistic donors stop giving if others are paid? Evidence from blood markets suggests some crowd-out occurs, so we likely move to restrict with safeguards, such as limiting payments to fixed amounts managed by the state rather than direct cash between parties. If data on crowd-out is missing, which it likely is, we assume worst-case crowd-out and maintain the restriction. The procedure forces us to admit that we cannot know for sure if altruism will vanish, so we must sign off on the judgment that some risk to altruism is acceptable to gain more kidneys. This application shows the procedure giving a definite answer of restrict with safeguards, but only after forcing a value judgment that might run against the intuition of those who see any payment as inherently exploitative.

  Next, I apply the procedure to the proposal allowing residents of a flood-stricken region to trade future votes in a cooperative water-board election for immediate relief supplies. The factual baseline confirms that voting is a civic right and relief supplies are essential for life, with high coercion due to the flood. Moving to semantic degradation, we ask if trading votes changes the meaning of voting. The observable shift would be election materials referring to vote banks or tradeable credits rather than civic participation. It is almost certain that introducing a price mechanism here would permanently alter the language of democracy within that community, turning a right into an asset. The procedure identifies this as clear semantic degradation. The default recommendation is prohibit. There is a judgment call available to override this if survival is at stake, but unlike the kidney case, the good being traded is not the life itself but the political power to secure life later. The board must decide if immediate survival justifies permanently corrupting the civic structure. If we follow the procedure strictly, the semantic degradation is so high that prohibit is the only logical output, as restoring the meaning of a vote after it has been priced is nearly impossible. This case shows the procedure working cleanly to produce a prohibition, but it highlights the discomfort of telling desperate people they cannot trade their future power for present safety. The procedure admits it cannot settle the value question of whether democracy is more important than survival, so it forces us to sign off on the priority of civic integrity over immediate utility, marking this as a value judgment rather than a factual derivation.

  Finally, I apply the procedure to the proposal to suspend price-gouging restrictions on bottled water after a hurricane, a case where the board expects the answer will be permit with monitoring. The factual baseline shows water is essential, there is scarcity, and consumers are vulnerable. We move to semantic degradation. Does charging high prices change what water is? The observable shift would be in whether water is spoken of as a human right or a commodity. In emergency contexts, water is often already treated as a commodity, though a regulated one. If the language remains focused on supply and logistics rather than shifting to a permanent market framing where access is solely determined by ability to pay even after the emergency, semantic degradation might be low. The procedure asks if the post-emergency language will revert to normal or stay market-focused. If we assume it reverts, degradation is not confirmed. We move to crowd-out. Will suppliers bring less water if prices are capped? Economic theory suggests supply increases with price, but we have no economists. We must treat this as missing data. The procedure says assume worst-case for the vulnerable, which would suggest restricting prices to ensure access. However, if we vote to accept the uncertainty that higher prices might bring more supply, we move to the vulnerability assessment. Consumers are desperate, so consent is compromised. Normally this suggests restrict. But here is where the procedure might misfire or produce an answer we dislike. If we prioritize supply availability over distributional fairness, the procedure allows us to permit with monitoring, arguing that the semantic meaning of water is not degraded and the crowd-out of supply is a risk we accept. This reaches the expected conclusion of permit with monitoring, but only by making a judgment call that efficiency outweighs equity in this specific instance. The procedure forces us to admit that we are choosing to tolerate potential exploitation to ensure shelf stock, which is a value judgment that must be signed off. If the board intuitively feels price gouging is wrong regardless of supply, the procedure breaks down because it separates semantic harm from distributional harm, and there is no step that prohibits exploitation solely on fairness grounds without semantic degradation. This reveals a limitation: the procedure is better at protecting meaning than protecting equality.

  In all three applications, you will see that the procedure gives definite answers only when the board is willing to make the required judgment calls where data is missing or values conflict. In the kidney case, it forces us to choose between life and meaning. In the vote case, it forces us to choose between survival and civic integrity. In the water case, it forces us to choose between supply and fairness. There are points where the procedure admits it cannot settle the matter, specifically when semantic degradation is ambiguous or when the cost of protection is human suffering. At those points, the procedure returns the decision to our values, requiring a logged vote that acknowledges we are not deriving the answer from evidence but choosing it based on our collective moral stance. I must be honest that this tool will misfire when the distinction between corruption and crowding-out collapses, such as when paying for a kidney both changes the meaning and displaces altruism simultaneously, making the stopping rules muddy. It will also produce answers we dislike, such as permitting water price hikes when our instinct is to protect the poor, because the procedure treats semantic harm as more objective than distributional harm. However, by marking every judgment call and requiring sign-off on missing data, it ensures that when the legislature questions us, we can show exactly where we made a value choice and where the evidence led us. This transparency is the best defense we have, even if the procedure cannot spare us the burden of deciding hard things. I hope this draft serves as a workable starting point for our next meeting, and I am willing to refine the specific questions based on your feedback before we adopt it formally.
