prompt: |-
  hey, im drafting a novel where the protaganist keeps drafting five-year plans and tearing them up by monday. need an essay, maybe 700-900 words, on whether weakness of will is really just hyperbolic discounting wearing a philosophical hat, or if there's an actual gap between knowing better and doing worse. weigh the split-mind view against the behavioral-econ explanation, but do it through this lens: treat the future self not as a stranger you bargain with, but as a co-author of the present self's narrative, so akrasia becomes a breakdown in narrative coherence rather than just time preference. reach an actual verdict — don't hedge. also take a side on whether you can be weak-willed about something you don't genuinely want in the first place. keep it sharp but casual, and dont bother with a bibliography or citations — just argue it straight.
