answer: |-
  Your protagonist is a familiar archetype: the Sunday night architect who becomes the Monday morning demolitions expert. Five-year plans drafted in ink, torn up in frustration before the week even begins. The behavioral economists would look at this trash can full of ambition and nod knowingly. They'd tell you this isn't a moral failure; it's a math error. It's hyperbolic discounting.

  According to the econ view, we don't have a weakness of will; we have a time Preference curve that bends too sharply. We value a reward today significantly more than that same reward tomorrow. When the plan is drafted on Sunday, the payoff is five years away, so it feels abstract. When Monday morning hits, the cost of work is immediate, and the payoff is still distant. The value of the future self's happiness gets discounted so heavily that it loses the bidding war against the present self's desire for comfort. In this framework, weakness of will is an illusion. It's just inconsistent pricing over time. There is no gap between knowing and doing, only a recalculation of value based on proximity.

  But this explanation feels cold, mostly because it treats your future self as a stranger you're willing to sacrifice. It assumes you're bargaining between two different people rather than inhabiting one continuous life. If you treat the future self not as a stranger, but as a co-author of your current narrative, the econ model falls apart.

  When you write a novel, you don't kill off the protagonist in chapter two just because it's easier than writing chapter three. You maintain narrative coherence. You keep the plot consistent because the story matters as a whole. If you view your life as a story being written collaboratively by your past, present, and future selves, akrasia isn't a discounting error; it's a breakdown in authorship. When your protagonist tears up the plan on Monday, they aren't just choosing immediate pleasure; they are ripping out a page of the script that the future self was supposed to build on. They are breaking the trust of the co-author.

  This suggests there *is* an actual gap between knowing better and doing worse, but it's not a gap in logic. It's a gap in identity. Hyperbolic discounting describes the *shape* of the failure, but it doesn't explain the *weight* of it. We feel guilt, not just regret. Guilt implies a violated obligation, not a bad investment. If it were just math, we wouldn't feel shame; we'd just update our models. The fact that we feel like we've betrayed ourselves proves that the connection between present and future is normative, not just temporal. We owe the future self consistency because we are the same character in the same book.

  This narrative lens also solves the prickly question of whether you can be weak-willed about something you don't genuinely want. The answer is no. If you draft a five-year plan because your parents expect it, or because society says you should be productive, but you have no internal desire for that outcome, failing to follow through isn't weakness of will. It's honesty.

  Akrasia requires a judgment of the good. You have to believe, genuinely, that action X is the best thing for you to do, and then choose action Y. If the goal isn't yours—if it's an alien implant from external pressure—then sabotaging it isn't a failure of willpower. It's a rejection of a plotline you never agreed to write. You can't be weak-willed about a desire you don't hold. You can only be weak-willed about a value you claim to own but refuse to enact. If your protagonist doesn't actually want the career success outlined in the plan, tearing it up isn't akrasia; it's an edit.

  So, here is the verdict: Weakness of will is not just hyperbolic discounting wearing a philosophical hat. The economic model is too thin to cover the texture of human experience. It reduces a crisis of identity to a scheduling conflict. There is a real gap between knowing and doing, and that gap is filled with the struggle for narrative coherence. We are not just maximizing utility; we are trying to keep our story from falling apart.

  When your protagonist sits there on Monday morning with the shredded paper, the problem isn't that they value the future too little. It's that they have stopped recognizing themselves as the same person who wrote the plan on Sunday. They aren't discounting the future; they are abandoning the plot. And you cannot be weak-willed about a goal you never truly wanted. That's not weakness; that's liberation. But for the goals you do own? Failing them is a genuine fracture in the self. It's not a math error. It's a plot hole.
