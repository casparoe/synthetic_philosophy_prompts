      *Guide:* Look for consistency over time (e.g., 14 months of meetups) rather than presentation.
      *Pass:* Competence evident despite low polish. -> Go to Step 4.
      *Fail:* Low polish, low evidence. -> **STOP. Reject.**

      **Step 4: The Value Handoff (1 min)**
      *Question:* Does this project fit our community values?
