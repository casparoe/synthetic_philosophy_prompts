answer: |-
  **Philosopher's Note**
  Signaling theory posits that honest signals must be costly. However, cost is relative. A $500 website is noise for a corporation, a signal for a student. We must distinguish *indices* (unfakeable evidence of past action) from *signals* (claims of future intent). Modesty is only virtuous if backed by indices. This procedure prioritizes relative sacrifice over absolute polish.

  **The Procedure (10 Minutes)**

  **1. The Index Check (3 mins)**
  *Question:* Is there unfakeable evidence this applicant has already done similar work? (Dated photos, logs, third-party confirmations).
  *Yes:* Proceed to Step 3.
  *No:* Proceed to Step 2.

  **2. The Relative Cost Check (4 mins)**
  *Question:* Is the effort put into this application expensive *for this specific applicant*?
  *Guide:* Assess skills/resources. A professional video from a marketer is low cost (Weak Signal). A handwritten plan from a non-writer is high cost (Strong Signal).
  *High Relative Cost:* Proceed to Step 3.
  *Low Relative Cost:* **STOP. Reject.** (This filters privilege masquerading as commitment).

  **3. The Modesty Override (2 mins)**
  *Question:* If the application is messy or quiet, is there hidden evidence of competence?
  *Guide:* Look for consistency (e.g., 14 months of meetups) over presentation.
  *Competence Evident:* Proceed to Step 4.
  *No Evidence:* **STOP. Reject.**

  **4. The Value Handoff (1 min)**
  *Question:* Does this project fit our community values?
  *Action:* If Steps 1-3 pass, humans decide. The checklist verifies capacity; humans verify purpose.

  **Test Run**

  **(1) Marketing Pro:** Glossy video, business plan.
  *Step 1:* No past index. → Step 2.
  *Step 2:* Video/plan is low relative cost for a marketer. **STOP. Reject.**
  *Result:* Annoying, but theoretically sound. They signaled cheaply.

  **(2) Repair Meetup:** Typos, 14 months photos.
  *Step 1:* Photos show consistent past action. **Pass.** → Step 3.
  *Step 3:* Messy app, but high competence evidence. **Pass.** → Step 4.
  *Result:* Human review. High priority.

  **(3) Refugee Organizer:** Moving story, no checks.
  *Step 1:* No verifiable index. → Step 2.
  *Step 2:* Story is high emotional cost, but hard to verify relative effort. Ambiguous. → Step 3.
  *Step 3:* No hidden evidence of logistics. **STOP.** (Unless Step 4 override).
  *Result:* Procedure says Reject/Flag. This is the danger zone.

  **Limitations**

  This checklist cannot measure hidden privilege (e.g., free time due to wealth). It dresses up "verifiability" as "truth," punishing those without digital footprints or safety to document their work. It cannot assess moral worth.

  *Where it misfires:* It will reject high-need applicants who lack the capacity to document past success (like the Refugee Organizer). It assumes a digital paper trail equals competence. It may also flag "low relative cost" incorrectly if volunteers misjudge an applicant's background (e.g., assuming a student has no money when they do).

  *Human Fraction:* Keep 40% of the decision with humans. The checklist filters noise (marketing fluff), not picks winners. If you automate the "Yes," you fund slick operators. If you automate the "No," you exclude the marginalized. Use this to kill the top 50% of slick apps, not to pick the winners. The "Value Handoff" is crucial; signaling theory tells you who *can* do the work, not who *should*. Your volunteers must retain the authority to override Step 2 or 3 if community need outweighs signaling efficiency. Ultimately, no algorithm replaces the judgment of whether a story matters, only whether it is honest.
