answer: |-
  **Principle:** Money is a conventional token representing a claim on social labor, issued against productive assets, whose validity rests on public trust rather than intrinsic substance.

  **Analysis:** Your original clause (ii) failed because it demanded current circulation. The repaired principle focuses on the *basis* of issuance (productive assets) rather than velocity. This saves the hoarded guinea: it remains a claim on labor, though idle, preserving your verdict. It excludes the token (no issuer claiming social labor) and the pawn ticket (claim on a specific existing good, not general industry), matching your instincts. The clearing house remains non-money as it cancels claims rather than issuing them. The land bank note fits perfectly as it ties money to land/industry.

  **Unsaveable Verdicts:** None, provided we distinguish money's *nature* (claim on labor) from its *function* (stimulating industry). However, a strict functionalist might argue the hoarded guinea ceases to be money effectively, though not categorically. Your verdict stands categorically.

  **New Cases:**
  1.  **Bank deposit ledger entries:** Money. These are claims on the bank's issued currency, which (ideally) originates against productive loans. They function as conventional tokens transferring claims on social labor.
  2.  **Unit of account only:** Not money. Berkeley defines money as a "ticket" or "counter" to convey power. If no shop accepts it, it lacks the conventional acceptance required to transfer claims on labor. It is a measure, not an instrument.

  Berkeley's core insight is that money is not wealth itself but a ticket to acquire wealth (industry). The token case fails because it lacks the anchor to national industry (land/labor). The pawn ticket fails because it locks value in a static object rather than circulating to motivate new work. The deposit ledger succeeds because it extends the circulation of claims on industry without requiring physical metal. The unit of account fails because it cannot execute the transfer of industry claims.

  This principle aligns with Berkeley's view in *The Querist*: money's value is conventional, but its purpose is to motivate production. Anything that does not link to production or cannot circulate to motivate production fails the test. The hoarded guinea passes the test of *nature* but fails the test of *purpose*, yet remains money in category. The token fails both. The ledger passes both. The unit of account fails the instrument test.

