      *   **User Persona:** Science/ideas writer, ex-data journalist (8 years). Highly fluent in Git jargon (commits, graphs, HEAD, detached HEAD, merge conflicts, rebase vs. merge, reflog, force push). No need for explanations of these terms.
      *   **Task:** Restate Daniel Dennett's "Center of Narrative Gravity" theory of the self using Git terminology.
      *   **Specific Constraints:**
          *   Faithfully represent Dennett's position (self as abstractum, no inner homunculus, real like a center of gravity, stories revised on the fly, no Cartesian theater).
          *   Map specific Git concepts to specific philosophical roles (What is the graph? What is HEAD? What is rebase vs. merge? What about unreachable commits?).
          *   **Residue Report:** Analyze the fidelity of the metaphor.
              *   What translates cleanly?
              *   What survives only by distortion?
              *   What cannot be expressed at all?
