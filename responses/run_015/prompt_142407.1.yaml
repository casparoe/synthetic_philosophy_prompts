  9.  *(Self-Correction on "Committer Identity")*: In Git, `git commit` reads `.gitconfig`. If the Self is the narrative, who sets the config? Dennett would say the "config" is the biological hardware + cultural environment. The "user.name" is assigned by the social network (other repos pulling from yours). This avoids the homunculus. I will argue this point strongly.

