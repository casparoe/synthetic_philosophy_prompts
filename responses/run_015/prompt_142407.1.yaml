  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I explain HEAD correctly? HEAD is the current working state. The Self is the *story* of how we got there. So Self = `git log`.
      *   *Check:* Is the "Center of Gravity" captured? A CoG is a point in space. The Self is a point in "narrative space." In Git, maybe it's the *tip* of the branch, but the *weight* is the history. Let's define the Self as the *branch ref* itself, which implies a history but is just a pointer. No, better: The Self is the *abstraction of continuity* created by treating a series of discrete commits as a single lineage.
