      *   *Check:* Qualia. Be firm. Dennett would say "what it is like" is a commit message, not the file content.

  8.  **Finalizing the Output Structure:**
      *   **Section 1: The Repository of Self.** (The Restatement).
      *   **Section 2: Residue Report.** (The Analysis).
