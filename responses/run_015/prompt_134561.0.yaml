answer: |-
  ### Logical Space Setup

  **The Three Separability Claims**
  1.  **Affect Claim:** The badness of pain is identical to the unpleasant feeling (the "ouch").
  2.  **Representation Claim:** The badness of pain requires a judgment that "this is damaging me."
  3.  **Context Claim:** The badness of pain requires ownership ("mine") or contrast with non-painful states.

  **Combination Status**
  *   **Taken:** Most combinations have defenders (e.g., Pure Affect, Pure Representation, Error Theory).
  *   **Empty/Unstable:** The view that pain is bad purely due to sensory quality *without* unpleasantness or context is generally unoccupied (sensory badness without aversion).
  *   **Asymbolia Wedge:** Asymbolics feel the sensation but lack the badness. This falsifies any view claiming sensation alone guarantees badness.

  ***

  ### The Taxonomy Tree

  **START: When a patient with pain asymbolia feels a burn but doesn't mind it, what is missing?**

  ├── **NODE 1: Is the badness identical to the unpleasant feeling?**
  │
  ├── **YES (The Badness IS the Feeling)**
  │   │
  │   ├── **NODE 2: Does the pain have to warn you of damage to be bad?**
  │   │   │
  │   │   ├── **YES (Feeling + Warning)**
  │   │   │   │
  │   │   │   ├── **NODE 3: Does the badness vanish if the pain is constant or belongs to no one?**
  │   │   │   │   │
  │   │   │   │   ├── **YES (Needs Context/Owner)**
  │   │   │   │   │   └── **LEAF 1: Contextual Hedonism**
  │   │   │   │   │       *   **Weirdest Commitment:** A burn isn't bad if you've felt it forever; pain needs a non-painful alternative to count as bad.
  │   │   │   │   │
