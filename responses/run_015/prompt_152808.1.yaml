answer: |-
  Here are ten sharp interview questions designed for "Ideas in the Rough." They are structured to help you navigate the conversation dynamically: each includes the **Initial Question**, the **Anticipated Move** (what she'll likely say), and **The Pivot** (the harder follow-up to keep the pressure on).

  ### 1. The Metaphysical Claim
  **Initial Question:** "Most Western philosophers treat *anatta* as a soteriological tool—something to help you suffer less. You're arguing it's actually a superior metaphysical solution to the personal identity problem. Why should a physicalist or a reductionist care about a 2,500-year-old framework when we have Parfit or Shoemaker?"
  **Anticipated Move:** She'll argue Western reductionism still secretly clings to a "locus of experience," whereas *anatta* eliminates the locus entirely, dissolving the hard problem rather than solving it.
  **The Pivot:** "But if you eliminate the locus, don't you also eliminate the thing that *has* the problem? Is this a solution to personal identity, or just a dissolution of the question?"

  ### 2. The "Ownership" Assumption
  **Initial Question:** "You write that Western philosophy fails because it assumes persistence requires ownership. That's a bold charge against Locke and Kant. Are you saying the intuition that 'I own my thoughts' is a cognitive error, or just a linguistic one?"
  **Anticipated Move:** She'll likely say it's a cognitive error reinforced by language; we mistake the *content* of experience for a *subject* of experience.
  **The Pivot:** "If it's a cognitive error, why is it so universal? If the brain is wired to generate a 'user illusion' of ownership, isn't that illusion functionally identical to a self for all philosophical purposes?"

  ### 3. The Hume Comparison (Required)
  **Initial Question:** "David Hume looked inside and found only a bundle of perceptions, no self. On the page, your *anatta* view looks identical to Hume's bundle theory. What is the substantive metaphysical difference between your aggregates and Hume's impressions?"
  **Anticipated Move:** She will argue Hume was skeptical and didn't commit to the *ontology* of the bundle, whereas Buddhism posits the aggregates as real, causal factors.
  **The Pivot:** "Hume's impressions have duration; they linger. If your aggregates are truly momentary, how do they bind together fast enough to create the illusion of a continuous thought without a binder?"

  ### 4. Momentariness (Required Follow-up)
  **Initial Question:** "Let's press that binding issue. If the aggregates are momentary—arising and ceasing in every instant—what provides the causal glue between moment *T1* and moment *T2*? If there's no substrate, isn't this just serial discontinuity?"
  **Anticipated Move:** She'll invoke *Pratītyasamutpāda* (Dependent Origination): the previous moment conditions the next, like a flame passing from candle to candle.
  **The Pivot:** "But a flame is a process *of* something burning. If there's no 'wax'—no underlying substance—what exactly is being conditioned? Are we just describing a causal chain and calling it a person?"

  ### 5. Autobiographical Memory (Required)
  **Initial Question:** "Let's talk about memory. When I recall a childhood event, it comes with a sense of 'mineness.' If there is no self to own that memory, what makes that mental state 'mine' rather than just causally linked to my current brain state?"
  **Anticipated Move:** She'll argue the "sense of mineness" is just another aggregate (a feeling tone), not proof of an owner. It's a label applied retrospectively.
  **The Pivot:** "But who applies the label? If the labeling mechanism is also ownerless, why does first-person authority feel privileged? Why can't I access 'your' memories if they are just causally linked states?"

  ### 6. Karma and Rebirth (Required)
  **Initial Question:** "I have to ask the classic objection. If there is literally no self persisting, who gets reborn? And if no one persists, who receives the karmic payoff? It sounds like punishment without a culprit."
  **Anticipated Move:** She will distinguish between ultimate truth (no self) and conventional truth (the person exists pragmatically). Karma rides the causal continuum, not a soul.
  **The Pivot:** "If karma rides the continuum, isn't that just cause-and-effect? Where is the *moral* weight? If 'I' don't persist, why should 'I' care about the karmic consequences for the future aggregate cluster?"

  ### 7. Conventional Truth vs. Psychological Continuity (Required Follow-up)
  **Initial Question:** "You're leaning on 'conventional truth' to handle the practical side of life. But if the conventional self is just a useful fiction for navigating karma, how is that distinguishable from Psychological Continuity Theory with Sanskrit branding?"
  **Anticipated Move:** She'll argue PCT still tries to define *what* persists (memory, character), whereas *anatta* admits nothing persists, only processes continue.
  **The Pivot:** "But functionally, if I treat the 'process' as the person for moral and legal purposes, haven't we arrived at the same destination? Is the metaphysical denial of self doing any actual work here, or is it just aesthetic?"

  ### 8. Moral Agency and Nihilism (Required)
  **Initial Question:** "My editor worries this view collapses into nihilism about moral agency. If there's no agent, there's no one to hold responsible. How do you ground moral responsibility without smuggling in a hidden subject?"
  **Anticipated Move:** She'll say responsibility is about regulating future causes, not blaming a past agent. We punish to condition the continuum, not to retribute.
  **The Pivot:** "That's a utilitarian defense of punishment, not a defense of *agency*. Does your view allow for *desert*? If I commit a crime, do I *deserve* punishment, or am I just a hazardous causal node being managed?"

  ### 9. The Skandhas' Functional Work
  **Initial Question:** "You claim the five skandhas do all the functional work of a self without the overhead. Can you give me a concrete example of a cognitive task—like decision making—where the skandhas succeed and a 'narrative self' model fails?"
  **Anticipated Move:** She'll argue the narrative self creates rigidity and suffering when the story is threatened, whereas the skandha model allows fluid adaptation.
  **The Pivot:** "That's a therapeutic benefit, not a functional one. In terms of processing information and outputting action, does the 'no-self' engine actually run cleaner, or does it just feel less stressful?"

  ### 10. The Phenomenological Cost
  **Initial Question:** "If you're right, the 'self' is a hallucination. But it's a hallucination that structures almost every human interaction. What do we lose by taking this metaphysically seriously? Is there a cost to living as if you don't exist?"
  **Anticipated Move:** She'll argue we lose suffering, attachment, and fear of death. The gain outweighs the cost.
  **The Pivot:** "But do we also lose intimacy? If I don't exist, and you don't exist, who is sitting across from me right now? Does *anatta* risk turning other people into philosophical zombies?"
