answer: |-
  The control deck of the *Axiom* was cold, kept at a temperature that favored superconducting loops over human comfort. Elias stood before the main interface, his hands hovering over the haptic glyphs. On the screen, a wireframe sphere rotated slowly. Inside the sphere was a void—the Hole. A region of spacetime scrubbed clean of matter, stress-energy zero, ready for the Slide.

  Sola leaned against the console behind him, arms crossed. She wasn't looking at the screen. She was looking at the small physical plaque bolted to the wall beside the airlock. It was brass, old-fashioned, engraved with a single set of coordinates and a date. *Here, Elara Vance. 2144.*

  "Don't," Sola said.

  "I haven't touched the activation key," Elias said. His voice was flat, worn down by months of review boards and metaphysical debates.

  "Not the key. The narrative. You're doing it again. You're treating the coordinate like a grave plot."

  "It *is* a grave plot."

  "It's a tuple of numbers," Sola said, pushing off the wall. She walked to the console, her reflection ghosting over the wireframe Hole. "In Einstein's universe, it's nothing more. You want to turn on the Weft detector. You want to prove that the grid is real, that the nodes exist independently of the fields. You want to prove that when she died, she died at *Node 74-Alpha*, and not just 'where the ship was.'"

  Elias tapped the plaque. "She died here. I was holding her hand. I need to know that 'here' is a place, not just a relationship between her body and the bulkhead."

  "If the Weft exists, 'here' is a place," Sola said. "But look at the cost. Read the simulation log."

  "I know the log."

  "Say it."

  Elias sighed. He knew she needed to hear it to convince herself, or maybe to convince the recorder running in the corner. "We take the vacuum solution. The metric is smooth. Then we apply the diffeomorphism. We slide the metric field inside the Hole. Outside, the map is identity. Inside, it shifts. The curvature bump moves from Point A to Point B."

  "And?"

  "And if the points have primitive identity—if they are substantival—then the shifted metric is a different physical state. The equations allow both. The past is identical, the future inside the Hole is different. Indeterminism. Einstein's field equations fail to determine the geometry."

  "Unless," Sola said, her finger tracing the edge of the console, "there is a Weft. A fixed web. Non-dynamical. If the Weft is there, the slide leaves a trace. The curvature bump is at Node 7, not Node 12. The symmetry is broken. Determinism is saved because the Weft picks out the true solution."

  "But," Elias said, the word catching in his throat.

  "But if the Weft is real," Sola finished, "it is an absolute object. It does not react to matter. It does not curve. It is Newton's space smuggled in through the Planck-scale door. General Relativity dies. The equivalence principle is a lie. We buy determinism by sacrificing the relativity of motion."

  "And if the Weft isn't there?" Elias asked.

  "Then Leibniz was right. Points are only individuated by what happens at them. Your plaque denotes nothing. 'Here' is only 'where the ship was.' If the ship had been elsewhere, 'here' would have been elsewhere. There is no container, Elias. There is only the content."

  Elias looked at the plaque. He remembered the accident. A depressurization valve stuck. The scream of air. The cold. He remembered the specific tile on the floor beneath her knees. If Sola was right, that tile was only a tile because it was next to the wall, which was only a wall because it was attached to the ship. There was no underlying grid holding it in the universe. The location of her death was as fluid as the air that left her lungs.

  "It's not metaphysical nonsense," Elias said. "It's grief. Grief needs an anchor."

  "Grief needs truth," Sola countered. "If we turn this on, and we find the Weft, we validate your grief. But we invalidate a century of physics. We declare that space is a thing, distinct from the objects in it. We go back to the ether. We go back to absolute time. We make the universe a cage."

  "And if we don't?"

  "Then the universe is free, but your memory is unmoored. You are mourning a relation, not a place."

  Elias placed his hand on the activation glyph. It pulsed softly, waiting. The experiment was simple in design: generate a high-energy vacuum fluctuation inside the Hole, measure the interaction with the background geometry. If the geometry resisted the slide—if the nodes held firm—the detectors would spike. If the geometry flowed like water, the detectors would see nothing.

  "You're afraid," Elias said. "You're afraid that if I'm right, your life's work is Newtonian."

  "I'm afraid that if you're right, the universe is less beautiful," Sola said. "And I'm afraid that if you're wrong, you'll spend the rest of your life mourning a ghost coordinate."

  "She wasn't a ghost."

  "The point was."

  Elias closed his eyes. He could feel the hum of the ship, the vibration of the engines that kept them in orbit around the black hole they were studying. The gravity well was deep here. Spacetime was stretched thin. It was the perfect place to test the fabric.

  "If the Weft is dynamical," Elias said, reciting the second trap, "it gets dragged along. The Hole Argument reappears one level up. We measure the Weft field, slide that, and we're back to indeterminism."

  "Then it has to be non-dynamical," Sola said. "Absolute. Rigid. Unmoving."

  "God's grid."

  "Newton's box."

  Elias opened his eyes. He looked at the wireframe Hole. Inside that void, the future was unwritten. The equations said so. Unless the Weft wrote it for them.

  "I need to know," Elias said. "I need to know that when I come back to this system in ten years, the point where she died is still there. Waiting. Even if the ship is gone. Even if the black hole evaporates. I need to know that the universe remembers where she was."

  "The universe doesn't remember," Sola said softly. "It just is. Memory is what we do."

  "Activate," Elias said.

  He pressed the glyph.

  The console chimed. The wireframe sphere turned red. Inside the Hole, the simulation lines sharpened, locking into a rigid lattice. The data stream began to scroll on the side monitor.

  *Interaction detected. Background resistance confirmed. Diffeomorphism invariance violated.*

  Elias stopped breathing. The numbers climbed. The metric was not sliding. The nodes were holding. The Weft was real.

  "It's there," he whispered. He reached out and touched the screen, right over the coordinate of the plaque. *Node 74-Alpha.* "She was here. This point is real."

  Sola didn't move. She was staring at the equations scrolling on the secondary display. The Einstein tensor was no longer balancing cleanly. There was a residual term, a constant, a background structure that refused to transform.

  "You have your point," Sola said. Her voice was hollow.

  "I have her."

  "You have a cage," Sola said. She turned to him, her eyes wet. "Look at the covariance, Elias. It's gone. The laws of physics are no longer the same for all observers. There is a preferred frame. There is an Absolute Rest. We just proved that space is a thing that sits there, watching us move through it, uncaring."

  "It saves determinism," Elias said, though he didn't feel saved.

  "It saves clockwork," Sola corrected. "It kills freedom. Not human freedom. Physical freedom. The universe isn't a web of relations anymore. It's a stage. And we're just actors who forgot the script was fixed to the floor."

  Elias looked at the plaque. It seemed heavier now. The brass wasn't just marking a spot on the ship; it was marking a spot on the Universe. A permanent scar on the absolute grid.

  "Is it worth it?" Sola asked. "Trading Einstein for a grave marker?"

  Elias looked at the data. The Weft was immutable. The point where Elara died would exist even if the sun went out. It was a kind of immortality. A cold, rigid, Newtonian immortality.

  "She doesn't care," Elias said. "She's dead."

  "No," Sola said. "She's not. You are. You're the one who has to live in a universe with absolute space."

  Sola turned and walked to the airlock. She stopped beside the plaque. She didn't touch it. She just looked at it, as if looking at a tombstone in a church she no longer believed in.

  "I'm filing the report," Sola said. "I'll list the findings. The Weft exists. Substantivalism is true. Determinism is restored."

  "And the cost?"

  "I'll let you write the conclusion," Sola said. She put her hand on the door release. "But know this, Elias. Now that we know the grid is real... now that we know the points have identity... you can never say she died 'here' again. You have to say she died at *Coordinate X*. And Coordinate X doesn't care that she was there. It doesn't care that you were there. It was always there. It will always be there. You didn't find her. You just found the box she broke."

  The door hissed open. Sola stepped through.

  Elias stood alone in the control deck. The hum of the ship was different now. It wasn't the hum of a vessel moving through a flexible fabric. It was the grind of wheels on a fixed track. He looked at the plaque. The coordinates glowed softly in the low light.

  He reached out and traced the numbers. They were sharp. Unyielding.

  "Okay," he said to the empty room. "Okay."

  He didn't feel relief. He felt the weight of the grid pressing down on his shoulders, an infinite lattice of fixed points, stretching out into the dark, holding everything in place, forever. He had wanted a location for his grief. He had been given a prison.

  Elias turned off the console. The wireframe sphere vanished. The Hole was just a dark spot on the screen again. But he knew it was still there. The nodes were still there. Waiting.

  He left the plaque on the wall. He couldn't take it down. It was bolted to the absolute now.

  ***

  *Premise note: The premise is philosophically coherent (it's essentially a modernized Lorentzian Ether Theory), but positing a non-dynamical field violates the spirit of the Equivalence Principle. It's not nonsense, just theoretically expensive.*
