answer: |-
  The restaurant was too loud, the kind of place where clattering plates masked the silence between sentences. Elena watched Arthur stir his wine. He hadn't touched the bread. Between them lay the script, pages 90 through 92 dog-eared and stained with coffee from her own morning review.

  Arthur was the biographer. He had spent thirty years with Vera Vance. Elena had spent three months with her ghost.

  "The syntax is wrong," Arthur said finally. He didn't look up. His finger traced a line of dialogue where Vera was supposed to be dying alone in a hospice bed. "In 1978, she wouldn't have said 'it's okay.' She didn't use contractions when she was tired. She became formal. Distant."

  "It tested well," Elena said. She heard the producer's voice in her head, the one that sounded like a closing argument. *You can't libel the dead, Elena. It's legally free real estate.* "The focus group cried. They needed her to make peace."

  "They needed *you* to make peace." Arthur took a sip of wine. He looked older than his dossier photo, worn down by the weight of all that accuracy. "She died alone, Elena. There was no nurse. No priest. No daughter. The coroner's report says she was found two days later. You're putting words in a mouth that was already dry."

  "I know what the report says." Elena reached for her own glass. "But a movie isn't a coroner's report. If I leave it blank, the audience projects their own fear. If I give her speech, they get closure. I gave her a better exit than she got in life."

  "You gave her an exit you could sell."

  Elena felt the heat rise in her neck. She had built the speech like a mosaic. She'd taken a line from a letter Vera wrote to her sister in 1952 about the rain in Prague, stitched it to a quote from a 1965 interview about artistic legacy, and smoothed the seams with connective tissue of her own invention. It was better dialogue than Vera had ever managed in reality. It was coherent. It was thematic. It was a lie.

  "I softened her," Elena admitted. The confession slipped out before she could check it. "In the draft before this, she was bitter. She blamed her husband. But the studio said she needed to be likable for the third act. So I gave her regret. I made her sorry."

  Arthur's hand stopped stirring. "She wasn't sorry. She was angry. She spent her whole adult life fighting to control how she was seen. She hid her journals. She burned the early drafts. She chose silence over being misunderstood. And now you're handing her a microphone she never wanted so strangers can feel better about mortality."

  "It's not about them. It's about the story."

  "It's about the theft." Arthur finally looked at her. His eyes were red-rimmed, not from crying, but from the fatigue of holding a line. "You took the only moment she truly owned—the end, the silence—and you filled it with noise. You used her voice to say things she didn't believe. That's not art. That's ventriloquism."

  "The producer says the estate signed off."

  "The estate is a nephew who hasn't visited her grave in twenty years. He signed for the check, not the soul." Arthur pushed the script back across the table. "You know what the worst part is? I read it. I read the scene. I wanted to hate it, but the writing is... it's beautiful. She sounds wise. She sounds like the woman I wanted her to be, not the woman she was. That's why I can't let it stand."

  "It's done, Arthur. We're shooting in November."

  "Then you've already lost her."

  The waiter arrived with the check, sensing the tension like a change in barometric pressure. He set the leather folder down near Elena's elbow. The automatic gesture of the meal ending hung in the air. Elena reached for her purse, but Arthur moved faster. He pulled out a worn checkbook, the kind nobody used anymore.

  "I'm paying," Arthur said.

  "You don't have to—"

  "I want to." He scribbled something on the receipt. He didn't leave a tip.

  Elena watched him sign. She thought about the mechanics of it, how she had assembled Vera's last breath from scraps of paper stored in a university archive in Boston. She had the legal right. She had the critical acclaim waiting in the wings. She had the audience. But looking at Arthur, hunched over the table in a suit that had seen better decades, she realized she didn't have the truth. She had a better version.

  She reached for the script to put it back in her bag. Her sleeve caught the stem of Arthur's wine glass. It didn't shatter; it just tipped, slowly, inevitably. Red wine spilled across the table, pooling over the leather folder and soaking into the corner of page 91.

  The ink on the cheap paper began to bleed immediately. The words Vera wasn't supposed to say started to run, the blue turning purple, the sentences dissolving into abstract shapes.

  Arthur watched the stain spread. He didn't reach for a napkin. Elena froze, her hand hovering over the wet paper. The wine kept moving, consuming the moment of death, blurring the fabricated peace until the words were illegible.

  "It's fine," Elena said, her voice tight.

  Arthur stood up. He left the checkbook on the table. He walked out into the noise of the street without looking back. Elena sat alone with the script, the wine continuing to soak through to the next page, hiding the lies underneath a dark, wet weight.

  Summary: The story suggests we owe the dead the dignity of their own silence rather than the comfort of our own fiction.
