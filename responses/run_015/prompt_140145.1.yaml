      *   Also Data Science Initiative precedent. If we let this slide, any unit can claim existence via a website.
      *   Timeline: Review starts Monday, report by Spring.
      *   Conclusion: Protects university.

  7.  **Writing - Iteration 2 (Focusing on Word Count and Flow):**
      *   Need to make sure I don't sound like I'm siding *against* the Dean personally, but siding with *policy*.
      *   Need to explicitly mention the "verbal dispute" aspect without using philosophy terms. "Classification question."
      *   Check word count during drafting.

  8.  **Final Polish:**
