      *   *Option B (Full Review):* Delays things, might be overkill if the core is the same.
      *   *Option C (Conditional/Hybrid):* This seems the most prudent given the "quantifier variance" insight without using the term. The issue isn't "is it real?" but "what rules apply to this specific change?"
      *   *Decision:* Recommend a **Modified Light Track with Specific Triggers**. Essentially, allow the rebranding now (light track) but mandate a focused review on the *new* elements (degree, tenure lines) separately, or stipulate that the "newness" for the donor does not bypass the handbook's intent for scrutiny.
      *   *Actually, looking closer:* The handbook says "substantively new academic unit" needs review. The Dean says it's not new. The Faculty say it is. The donor says it must be new to get money.
      *   *Best Path:* Recommend the **Full Review**. Why? Because the addition of a new degree, a new Dean post, and four tenure lines changes the *function* and *scope* significantly, regardless of staff continuity. Also, the donor restriction creates a legal incentive to claim "newness," which conflicts with the administrative claim of "not new." You can't have it both ways. If it's new enough for the donor, it's new enough for the handbook.
      *   *Alternative Path (Nuanced):* Recommend a **Stipulated Definition**. The committee defines "substantively new" based on *function* (degrees + tenure lines) rather than *ontology* (staff/building). If it meets the definition, full review.
      *   *Let's go with the Functional Test:* Recommend adopting a specific criterion for "substantively new" (new degree + new tenure lines = new unit) and applying it. This leads to a Full Review, but justified by policy clarity rather than metaphysical debate. This addresses the Prof's "carving up" idea without using the jargon. It forces the Dean to choose: either it's new (get money, get review) or it's not (no money, light track).
      *   *Refinement:* To be diplomatic but firm, recommend a **Conditional Approval**: Proceed with light track *only if* the new tenure lines and degree are subjected to a separate, expedited review process, OR classify as "New Unit" due to the expansion scope.
      *   *Stronger Recommendation:* Given the donor issue and the faculty objection, the safest institutional move is the **Full Review**. It protects the university from accreditation issues and donor disputes later. I will argue for the Full Review but frame it as clarifying the definition of "unit."

      *Wait, let's look at the word count.* 700-900 words is tight. I need to be direct.
      *Decision:* Recommend **Full External Review**.
      *Reasoning:* The functional changes (degree, tenure lines, Dean) alter the unit's scope sufficiently to meet the spirit of "substantively new," regardless of staff continuity. Additionally, the donor restriction creates a conflict: claiming "not new" for the handbook but "new" for the donor is untenable.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
