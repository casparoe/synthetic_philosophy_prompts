      *   Ensure the "Data Science Initiative" point is included as a precedent risk.
      *   Ensure the Donor point is highlighted (CFO will care).

  *(Self-Correction during drafting)*: I initially thought about a hybrid review. But the handbook is binary: Light vs. Full. A hybrid might violate the handbook. Better to recommend Full Review based on a clarified definition of "substantively new." This aligns with the Prof's "carving up" idea—we choose the carving that protects the institution.

  Let's aim for the recommendation that resolves the donor contradiction. If the Dean wants the money, it must be "new." If it is "new," it needs review.

  *Word Count Check:* I need to be concise but thorough. I will expand on the implications of the donor restriction and the precedent of the Data Science Initiative to ensure I hit the minimum word count without fluff.

