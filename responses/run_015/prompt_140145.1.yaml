  **MEMORANDUM**

  **TO:** Academic Planning Committee
  **FROM:** Undergraduate Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation Regarding CQSS Reclassification to School of Data and Society

  **Recommendation**
  I recommend that the Committee classify the transition from the Centre for Quantitative Social Science (CQSS) to the School of Data and Society (SDS) as a **substantively new academic unit**, triggering the full external review process outlined in the Faculty Handbook. I propose we initiate this review immediately, with a target completion date of April 1, to align with the next academic planning cycle.

  **Context and Dispute**
  The Committee faces a classification question. The Handbook distinguishes between "rebranding" (light track) and "substantively new units" (full review). The Dean's office argues for the light track, noting continuity in staff, location, and Year 1 budget. Objecting faculty argue for full review, citing the addition of an undergraduate degree, a new Dean post, and four tenure-track lines.

  Both descriptions are factually accurate. The staff and building remain constant, but the functional scope and resource commitments expand significantly. Consequently, this is not a dispute about facts, but about which classification standard best serves the University's governance interests. We must choose the framework that ensures appropriate scrutiny without creating untenable precedents.

  **Rationale for Full Review**
  Three specific factors necessitate the full review track.

  **1. The Donor Restriction Conflict**
  Documentation indicates a major gift is restricted to establishing "a new school." The gift lapses if the unit is not legally and academically new. We cannot maintain contradictory positions: asserting the unit is "not new" to bypass Committee scrutiny while simultaneously asserting it is "new" to secure donor funding. If the administration accepts the donor funds, they are affirming the unit's newness. Consistency requires that we apply the Handbook standards associated with new units. The CFO should note that proceeding with the light track risks jeopardizing this revenue stream if the donor perceives the "newness" as administrative fiction.

  **2. Scope of Functional Change**
  While the core staff remains, the addition of an undergraduate degree and four tenure lines alters the unit's academic function. A Centre typically focuses on research; a School implies teaching responsibility and broader governance. The Handbook's requirement for external review is designed to assess whether the University can sustainably support such expansion. Bypassing this review because the physical office remains the same ignores the pedagogical and hiring implications. The review should focus specifically on the viability of the new degree and the long-term funding of the tenure lines, rather than re-evaluating existing staff.

  **3. Precedent and the "Data Science Initiative"**
  Our files indicate an existing "Data Science Initiative" with a director and website but no budget or students. If we accept the argument that SDS is not new because CQSS exists, we risk establishing a precedent where any unit can claim pre-existence via a minimal footprint (like the Initiative) to avoid scrutiny. Conversely, if we allow the Initiative to count as a pre-existing unit sufficient to block "new" classification elsewhere, we create a loophole where administrative units can be spawned without review simply by creating a website. Classifying SDS as new clarifies the threshold: units without degree-granting power or significant tenure lines are initiatives; units with them are Schools. This distinction protects the integrity of future planning.

  **Addressing the Dean's Concerns**
  The Dean's concern regarding efficiency is valid. A full review typically delays implementation by a year. However, this delay is the intended function of the policy when significant resources are committed. To mitigate this, the Committee can mandate an expedited review scope. External reviewers should be instructed to focus strictly on the *new* elements (the degree structure and tenure line justification) rather than re-litigating the success of the existing CQSS staff. This preserves the rigor of the process without unnecessarily duplicating work.

  **Timeline**
  *   **November 1:** Committee vote to classify as "New Unit."
  *   **November 15:** Charge issued to external review committee.
  *   **February 15:** External review report due.
  *   **April 1:** Final Committee decision on SDS establishment.

  **Conclusion**
  Classifying this transition as a rebranding treats a functional expansion as a mere name change. Given the donor requirements and the addition of degree-granting authority, the "new unit" classification is the only position that aligns our internal governance with our external commitments. This path ensures that the new tenure lines and degree program receive the scrutiny they require, while securing the financial foundation the Dean seeks.

  I move that we adopt this classification and begin the reviewer selection process immediately.
