      *   **Timeline:** Propose a schedule.
      *   **Closing:** Commitment to governance integrity.

  4.  **Refining the Argument (incorporating the "quantifier variance" insight without jargon):**
      *   Instead of saying "it's all words," say "The question is not whether the unit is metaphysically identical, but which classification best serves our governance standards."
      *   Focus on the *consequences* of the classification.
      *   Address the Dean's point: Yes, staff are same. But function changes.
      *   Address the Faculty point: Yes, new lines/degree matter.
      *   The Donor point is the clincher. You can't tell the donor it's new and the Committee it's old.

  5.  **Drafting - Tone Check:**
      *   Professional, respectful to the Dean (who is on the committee), but firm on governance.
      *   Avoid "my professor says."
      *   Ensure the CFO cares about the donor money.
      *   Ensure the Physicist/Anthropologist care about precedent and rigor.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Subject: Recommendation on CQSS/SDS Classification.
