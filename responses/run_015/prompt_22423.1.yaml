          *   Hobbes's hatred of "absurd speech" (self-contradiction).
          *   Prediction: He dismisses it as a linguistic trick/paradox, not a limit on reason. He defends the sufficiency of computation.
      *   **Section 3: The Tension (Computational Model):**
