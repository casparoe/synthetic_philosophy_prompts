answer: |-
  You're pressing me on the intuition that morality must be about minimizing the total amount of badness in the world, but that's precisely the framework I'm rejecting. There is no "total amount of badness" experienced by a collective entity; there are only individual losses suffered by separate people. To the person facing death, the loss is everything—they are deprived of all future goods. To each headache sufferer, the loss is trivial. You ask if the headaches "add up." They don't, because there is no super-person who experiences the sum of a million headaches. There is only person A with a headache, person B with a headache, and so on. None of them can say to the dying person, "My headache outweighs your life," because individually, it doesn't. And they can't say it collectively, because "collectively" they don't exist as a moral entity capable of holding a claim stronger than an individual's right to life.

  So, to answer you directly: yes, I am permitted to save the one from death. It looks "nuts" only if you think we are here to act as utilitarian calculators rather than moral agents responding to the specific claims of individuals. I concede that the impulse to relieve a million people is strong, and I might choose to do so, but not because their aggregated pain *outweighs* the death. If I save the headache sufferers, it's a choice, not a requirement driven by sums. But if I save the one dying person, I have violated no one's claim, because no single headache sufferer has a claim strong enough to override a life. The principle stands: numbers don't transform the nature of the loss. Five deaths aren't worse for anyone than one, and a million headaches aren't worse for anyone than one death is for the one.
