answer: |-
  # Desiderata for an Adequate Theory of Rescue Priority and Moral Aggregation

  ## Introduction: Framing the Evaluation
  This chapter establishes the criteria of adequacy for any theory governing rescue priority in life-saving conflicts. The central constraint guiding this framework is John Taurek's argument in *Should the Numbers Count?* (1977). Taurek's rejection of pure numerical aggregation is treated here not merely as a counter-intuitive puzzle to be dissolved by sophisticated consequentialism, but as a substantive boundary condition regarding the separateness of persons. An adequate theory must account for the intuition that the loss of a life is a loss to *that* person, not a subtractable unit in a collective sum, without rendering moral action arbitrary or impossible in complex social environments.

  The following desiderata are divided into four categories: Case Coverage, Conceptual Distinctions, Consistency Conditions, and Tensions. Each desideratum is marked as either **Non-Negotiable** (required to preserve logical coherence and the core anti-aggregation constraint) or **Camp-Specific** (reflecting commitments to determinism, universalizability, or relational priority). Furthermore, distinctions are drawn between **Settled** premises (empirical or logical grounds widely accepted across the literature) and **Contested** premises (areas of ongoing philosophical dispute).

  ---

  ## 1. Case Coverage: The Phenomenological Constraint
  An adequate theory must generate verdicts or actionable guidance across a gradient of rescue scenarios, moving from binary abstractions to networked realities.

  ### 1.1 The Standard Pairwise Intuition
  *   **The Case:** A rescuer can save either one identifiable child or five strangers from drowning in separate ponds, with equal cost and effort.
  *   **The Desideratum:** The theory must explain why the single child is not morally negligible. It cannot justify saving the five *solely* by invoking a "greater good" that overrides the claim of the one.
  *   **Motivation:** To respect the Taurekian constraint that there is no "super-person" who loses five lives.
  *   **Status:** **[Non-Negotiable]**
  *   **Settled vs. Contested:** **[Settled]** That the intuition against *pure* aggregation is widely shared, even among aggregationists who seek to ground it in secondary principles (e.g., fairness, ex ante chances). **[Contested]** Whether this intuition mandates a coin toss or permits a weighted probability favoring the many.

  ### 1.2 The Unequal-Cost Variant
  *   **The Case:** Saving the five requires abandoning the one person to whom the rescuer has already begun aid, or who is physically closer (lower cost to save).
  *   **The Desideratum:** The theory must distinguish between the *value* of the life and the *cost* of the rescue. It must specify whether prior engagement or proximity creates a duty that can override numerical superiority.
  *   **Motivation:** To prevent the theory from collapsing into a rigid "numbers always win" rule that ignores special obligations or efficiency constraints unrelated to aggregation.
  *   **Status:** **[Camp-Specific]** (Relational/Contractualist approaches prioritize prior engagement; Utilitarian approaches prioritize net lives saved).
  *   **Settled vs. Contested:** **[Contested]** Whether "sunk costs" in moral rescue (e.g., already swimming toward victim A) generate binding obligations or are morally irrelevant.

  ### 1.3 Distributed Moral Proximity
  *   **The Case:** Rescuers and victims are embedded in social networks of varying density. Victim A is a stranger; Victims B–F are strangers to the rescuer but are kin/neighbors to each other. The rescuer is causally connected to A, but socially connected to the network containing B–F.
  *   **The Desideratum:** The theory must handle graded relational structures where the binary framing of "one-versus-many" collapses. It must determine if moral proximity distributes across the network or remains dyadic.
  *   **Motivation:** Real-world rescue scenarios rarely involve isolated atoms. A theory that works only for binary cases fails in complex social topologies.
  *   **Status:** **[Non-Negotiable]** (The theory must *address* this, though the verdict is open).
  *   **Settled vs. Contested:** **[Contested]** Whether distributed moral proximity undermines the binary framing of aggregation problems or merely complicates the application of binary rules. (This dissertation argues the former, but this is not consensus).

  ---

  ## 2. Conceptual Distinctions: The Structural Constraint
  An adequate theory must maintain clear boundaries between distinct moral concepts to avoid category errors that often mask aggregationist assumptions.

  ### 2.1 Moral Status vs. Object of Duty
  *   **The Distinction:** Recognizing that all victims possess equal moral status (right to life) versus recognizing that the rescuer holds a specific duty to a specific victim.
  *   **The Desideratum:** The theory must not conflate the equal worth of persons with an equal obligation to save all persons. It must allow for equal status to result in unequal priorities based on relational or situational factors.
  *   **Motivation:** To avoid the inference that "equal status" implies "save the most status-bearers."
  *   **Status:** **[Non-Negotiable]**
  *   **Settled vs. Contested:** **[Settled]** That status and duty are conceptually distinct. **[Contested]** Whether equal status imposes a presumptive requirement of impartiality in duty.

  ### 2.2 Ex Ante Decision Rules vs. Ex Post Evaluation
  *   **The Distinction:** The justification for the choice at the moment of action (ex ante) versus the moral assessment of the outcome after the fact (ex post).
  *   **The Desideratum:** The theory must specify whether a "wrong" outcome (the one dies, the five die) invalidates a "right" decision procedure (e.g., a fair lottery), or if the procedure is the sole locus of moral evaluation.
  *   **Motivation:** Taurekian arguments often rely on ex ante fairness (giving everyone a chance) rather than ex post utility.
  *   **Status:** **[Camp-Specific]** (Deontologists prioritize ex ante; Consequentialists prioritize ex post).
  *   **Settled vs. Contested:** **[Contested]** Whether ex post evaluation can be cleanly separated from ex ante duty without rendering the theory insensitive to tragedy.

  ### 2.3 Causal Efficacy vs. Moral Reason
  *   **The Distinction:** The physical ability to affect more lives (causal efficacy) versus the normative justification for doing so (moral reason).
  *   **The Desideratum:** The theory must not treat causal leverage (I *can* save five) as automatically generating a moral reason (I *ought* to save five).
  *   **Motivation:** To block the slide from "maximizing impact" to "moral obligation" without intermediate justification.
  *   **Status:** **[Non-Negotiable]**
  *   **Settled vs. Contested:** **[Settled]** That 'ought' does not strictly follow 'can' in aggregation contexts.

  ---

  ## 3. Consistency Conditions: The Empirical and Logical Constraint
  An adequate theory must not contradict robust empirical findings regarding moral cognition nor violate basic laws of rational choice, unless it provides a compelling normative argument for doing so.

  ### 3.1 The Identifiable Victim Effect
  *   **The Constraint:** Moral psychology findings show agents reject aggregation in concrete, named-victim cases but accept it in abstract, statistical framings.
  *   **The Desideratum:** The theory must either accommodate this variance (e.g., by validating the moral relevance of identifiability) or explain it as a cognitive bias to be corrected, without dismissing the intuition as mere error.
  *   **Motivation:** A theory that demands agents ignore the identifiable victim effect in all cases may be psychologically unsustainable; one that validates it in all cases may be irrationally inconsistent.
  *   **Status:** **[Camp-Specific]** (Relational theories accommodate; Utilitarian theories correct).
  *   **Settled vs. Contested:** **[Settled]** The empirical existence of the effect. **[Contested]** Its normative weight.

  ### 3.2 Decision-Theoretic Coherence
  *   **The Constraint:** Basic axioms of rational choice (e.g., transitivity, independence of irrelevant alternatives).
  *   **The Desideratum:** The theory's priority rules must not generate cycles (A > B, B > C, C > A) in rescue prioritization that would make action impossible.
  *   **Motivation:** To ensure the theory guides action rather than paralyzing it.
  *   **Status:** **[Non-Negotiable]**
  *   **Settled vs. Contested:** **[Settled]** Logical coherence is required for action-guidance.

  ---

  ## 4. Tensions and Joint Unsatisfiability
  This section flags areas where the desiderata above may conflict, requiring the theorist to prioritize one constraint over another.

  ### 4.1 The Anti-Aggregation/Network Consistency Tension
  *   **The Tension:** Respecting strict anti-aggregation in direct rescue (1 vs. 5) conflicts with requiring consistency across network-structured obligations (Distributed Moral Proximity).
  *   **The Problem:** If I owe a duty to Person A, and Persons B–F are socially proximate to A but not me, does my duty to A extend to them? If yes, aggregation re-enters via the network. If no, the network structure is morally inert.
  *   **Flagged Unsatisfiability:** It may be **Jointly Unsatisfiable** to maintain:
      1.  Strict Taurekian anti-aggregation (numbers never count intrinsically).
      2.  Relational consistency (duties propagate through social networks).
      3.  Determinism of duty (there is always one uniquely right action).
      *   *Note:* A theory may need to accept indeterminacy (lotteries) or allow for "moral residue" to satisfy this cluster.
  *   **Status:** **[Non-Negotiable]** (The tension must be acknowledged).

  ### 4.2 The Ex Ante/Ex Post Separation Tension
  *   **The Tension:** Maintaining a clean separation between ex ante decision rules and ex post evaluation is difficult when outcomes are catastrophic (death).
  *   **The Problem:** If a fair lottery leads to five deaths instead of one, can we truly say the ex post outcome is morally neutral?
  *   **Flagged Unsatisfiability:** It may be **Jointly Unsatisfiable** to maintain:
      1.  Purely procedural justification (ex ante only).
      2.  Sensitivity to the magnitude of loss (ex post).
      3.  Anti-aggregation (refusing to weigh the losses).
  *   **Status:** **[Contested]** Whether this triad is truly unsatisfiable or merely difficult.

  ---

  ## Brief Note on Theoretical Approaches
  *   **Utilitarianism:** Fails the **Non-Negotiable** Taurekian constraint (1.1) by definition, as it treats lives as aggregable units. It satisfies Decision-Theoretic Coherence (3.2) but struggles with the Identifiable Victim Effect (3.1) unless treated as bias.
  *   **Contractualism (e.g., Scanlon):** Respects the Separateness of Persons (2.1) and Anti-Aggregation (1.1) but faces significant strain in **Distributed Moral Proximity** (1.3) and the **Unequal-Cost Variant** (1.2), often relying on "tie-breaking" mechanisms that reintroduce numbers covertly.
  *   **Relational/Partialist Approaches:** Best suited for **Distributed Moral Proximity** (1.3) and **Moral Status vs. Duty** (2.1). However, they risk violating **Decision-Theoretic Coherence** (3.2) if relational duties conflict intransitively, and they often fall into the **Camp-Specific** category regarding universalizability.

  ## Conclusion on Desiderata
  The following evaluation will not seek a theory that satisfies every desideratum perfectly, as the **Tensions** section suggests some subsets are jointly unsatisfiable. Instead, adequacy will be measured by which constraints a theory explicitly prioritizes and how transparently it manages the inevitable trade-offs between respecting the separateness of persons and providing action-guidance in networked realities.
