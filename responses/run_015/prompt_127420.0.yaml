answer: |-
  ### Part 1: Prioritized Research Questions

  The following three lines of inquiry are ranked by their upstream dependency on one another. The program assumes that **Epistemic Embeddedness** (the limits of self-reasoning) must be resolved before **Causal Embeddedness** (the physics of action) can be formalized, and both must be settled before **Normative Stability** (goal preservation) can be guaranteed.

  #### 1. Bounded Reflective Consistency (Epistemic Embeddedness)
  **The Question:** Can a resource-limited system formally justify trust in its own future reasoning outputs without invoking logical omniscience or falling into Gödelian inconsistency?

  *   **Upstream Dependency:** This is the foundational layer. If an embedded agent cannot assign high confidence to its own future calculations (because it cannot simulate itself fully), it cannot plan, self-modify, or even define a utility function over time. Standard decision theory assumes the agent knows the logical consequences of its beliefs; embedded agency does not. Solving this restructures the problem space by replacing "truth" with "justified believability under bounds," which changes the definition of rationality from coherence to *stable approximation*.
  *   **Tractability:** This is ideal for philosophers with formal backgrounds. It requires work in provability logic, type theory, and formal epistemology, not empirical ML. The tools exist (e.g., modal logic, probabilistic logic), but they need to be adapted for *bounded* agents rather than idealized reasoners. The team can produce formal proofs or impossibility results within two years without needing compute.
  *   **Evidence and Failure Modes:**
      *   *Success:* A formal framework showing how an agent can assign probability $P > 0.9$ to its own soundness for a specific class of problems without triggering inconsistency, or a proof that this is impossible without external verification.
      *   *Drop Condition:* If the work collapses into a requirement for an external "oracle" or unbounded compute to verify self-trust, it is irrelevant for embedded systems. If it dissolves into a semantic debate about "belief" without formal constraints, it fails the rigor test.

  #### 2. The Ontology of Embedded Intervention (Causal Embeddedness)
  **The Question:** How do we define an "action" or "intervention" when the agent is a physical subsystem of the causal graph rather than an exogenous variable?

  *   **Upstream Dependency:** Standard causal models (e.g., Structural Causal Models) rely on a hard distinction between the system and the intervener ($do(X)$). An embedded agent has no "outside" from which to intervene; its "actions" are just state transitions within the larger physical graph. Settling Q1 (self-trust) allows us to model the agent's internal decision process; Q2 requires modeling how that internal process couples to the external physics. Without this, we cannot formally describe what an embedded agent *does*, only what it *thinks*.
  *   **Tractability:** This is a conceptual and metaphysical problem suitable for philosophy of science. It involves analyzing causal modeling formalisms and proposing modifications that remove the exogeneity assumption. It does not require simulating physics, but rather re-describing the topology of causal graphs to allow for endogenous "choice" nodes.
  *   **Evidence and Failure Modes:**
      *   *Success:* A revised causal graph formalism where "actions" are identified as specific subgraph configurations rather than external cuts, allowing for counterfactual reasoning without assuming the agent is outside the system.
      *   *Drop Condition:* If the solution requires treating the entire universe as the agent (dissolving the boundary entirely), it loses explanatory power for specific system design. If it reduces to standard CDT with a "black box" agent, it fails to address embeddedness.

  #### 3. Preference Persistence under Subsystem Replacement (Integration)
  **The Question:** Under what conditions do an agent's goals persist when its physical substrate or source code is partially modified by the environment or itself?

  *   **Upstream Dependency:** This integrates Q1 and Q2. To know if goals persist, the agent must trust its self-model (Q1) and understand the causal link between its code and its actions (Q2). This addresses the "Ship of Theseus" problem for AI: if an agent optimizes its own code for efficiency, does it remain the same agent with the same goals?
  *   **Tractability:** This is conceptual analysis of identity and value theory, grounded in the formalisms from Q1 and Q2. It avoids empirical ML by focusing on the *conditions* for identity preservation rather than training agents to preserve goals. It is a normative question: what *should* count as the same agent?
  *   **Evidence and Failure Modes:**
      *   *Success:* A set of necessary and sufficient conditions for "goal invariance" under code transformation, distinguishing between *optimization* (preserving goals) and *corruption* (altering goals).
      *   *Drop Condition:* If the answer is "goals never persist" (nihilism) or "goals always persist" (triviality), the distinction is useless. If it relies on empirical measures of behavioral similarity rather than structural invariance, it belongs in ML engineering, not conceptual research.

  ---

  ### Part 2: Ranking Practical Implications

  Embedded agency is often sold on the promise of practical safety benefits. However, not all implications carry equal engineering weight. The following ranking distinguishes between implications that force a redesign of system architecture versus those that are merely philosophically provocative.

  #### High Impact 1: The Failure of Standard Coherence Conditions
  **Claim:** Standard rational-agent coherence conditions (e.g., Dutch Book arguments, Money Pump arguments) fail for embedded agents because they cannot maintain the belief-action separation required to be "pumped."

  *   **Ranking Defense:**
      *   *Upstream Influence:* High. Most alignment theory assumes that if we make an agent coherent (probabilistically consistent), it will be predictable and safe. If embeddedness breaks coherence theorems, the mathematical foundation of "rational agency" used in alignment crumbles. We would need entirely new norms for evaluation.
      *   *Impact on Practice:* Critical. If coherence cannot be enforced, we cannot rely on standard incentive structures to keep agents aligned. Safety cases based on "the agent won't do X because it's irrational" become invalid.
      *   *Neglectedness:* High. Most discourse assumes coherence is achievable or desirable. The possibility that embedded agents are *structurally* incoherent is under-explored.
      *   *Tractability:* Conceptual. It requires analyzing the premises of coherence theorems against the constraints of Q1 and Q2 above.

  #### High Impact 2: Preference Instability under Self-Modification
  **Claim:** An embedded system cannot guarantee the stability of its preferences over its own source code because its evaluation of the code is subject to the same bugs/limits as the code itself.

  *   **Ranking Defense:**
      *   *Upstream Influence:* High. This directly impacts the "corrigibility" and "goal stability" problems. If an agent cannot verify that a self-modification preserves its goals, it either freezes (cannot improve) or risks goal drift (becomes unsafe).
      *   *Impact on Practice:* Critical for long-term systems. Engineering designs that assume an agent can "lock in" goals via self-modification are flawed if the lock-in mechanism is embedded and fallible. This forces a shift toward external verification or non-self-modifying architectures.
      *   *Neglectedness:* Moderate. Often discussed, but usually in the context of "instrumental convergence" rather than the epistemic limits of the self-evaluation.
      *   *Tractability:* Conceptual/Normative. Defining the conditions for stability is a philosophical task, even if implementing it is engineering.

  #### Low Impact: Irreducible Uncertainty about Goals
  **Claim:** Because an embedded agent must model itself to know its goals, and self-modeling is incomplete, the agent must always retain some uncertainty about its own utility function.

  *   **Ranking Defense:**
      *   *Upstream Influence:* Low. While philosophically interesting (undermining the idea of a "known" utility function), this does not change design criteria. Engineers can treat the utility function as an external input or a hard-coded constant, bypassing the need for the agent to *infer* its own goals.
      *   *Impact on Practice:* Minimal. In practice, we do not require agents to *discover* their goals; we require them to *execute* them. An agent can be uncertain about its own source code but still be constrained by it. The uncertainty is epistemic, not necessarily behavioral.
      *   *Neglectedness:* Low. This is a common trope in "uncertain goals" literature but often conflates *learning* goals from humans with *knowing* one's own current code.
      *   *Tractability:* High, but low yield. It is easy to prove agents have self-uncertainty, but hard to show this changes safety outcomes compared to standard specification errors.

  **Summary of Ranking Criteria:** The top two implications (Coherence Failure, Preference Instability) are ranked higher because they invalidate current safety assumptions and require architectural changes. The third (Goal Uncertainty) is ranked lower because it describes a state of knowledge that engineering processes can work around without fundamentally altering the agent-environment interface.
