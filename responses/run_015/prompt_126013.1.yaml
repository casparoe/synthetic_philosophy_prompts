answer: |-
  Dear Colleague,

  It was wonderful to hear from you and to get a sense of the lively atmosphere in your Bristol reading group. A retired maths teacher, two philosophers, and a psychophysics post-doc debating anti-luminosity over biscuits sounds like exactly the kind of interdisciplinary friction that produces genuine insight. Rowan's variant of the argument is indeed a clever piece of engineering, and it is no surprise that it has left you all feeling trapped. What he has done is essentially reconstruct Timothy Williamson's anti-luminosity argument from Knowledge and Its Limits but transposed from a temporal key to a spatial one, using a panel of subjects to bypass the usual complaints about memory and attention drift. The structure is valid, and your suspicion that the work is being done by something structural rather than peculiar to knowledge is astute; this is a conflict between luminosity and safety that arises wherever you have a sorites series and a factive attitude. Since you asked me to weigh in as someone who has spent considerable time on these margins, I will sketch out the three main diagnostic paths available to you before telling you where I think the philosophical weight lies.

  The first diagnosis is the orthodox Williamsonian line, which requires you to surrender the KK principle. On this view, the Margin for Error principle is non-negotiable because it unpacks the idea that knowledge is not a matter of luck. If you know something, your belief must be safe, meaning it could not easily have been wrong. In a sorites series like Rowan's booths, there is no sharp boundary where knowledge stops, but there is a boundary where the truth stops. Near that boundary, you cannot distinguish the case where you know from the case where you do not. If you claimed to know that you know in the last case of knowledge, safety would require that you also know in the next case, where ex hypothesi you do not. To preserve the safety condition, you must admit that in the borderline cases, you do not know that you know, even if you do know. This means KK fails for perceptual knowledge. The cost here is intuitive; it feels as though we should be able to know our own epistemic states, but the price is paid to save the anti-luck intuition that defines knowledge for most externalists.

  The second diagnosis targets the application of the Margin for Error principle across distinct subjects, suggesting that Rowan's panel setup is not merely a clever tweak but a fatal flaw. This view holds that safety is a modal condition on a specific subject's belief. When we say a subject knows, we mean that in nearby possible worlds where that very subject forms the belief, it is true. Rowan's argument relies on treating Student One's situation as a nearby possible case for Student Zero. While they may be intrinsically identical, they are numerically distinct. A defender of KK might argue that my knowledge depends on my own reliability across my own possible situations, not on the reliability of a duplicate in a neighbouring booth. If the Margin for Error principle only applies to counterfactual situations involving the same subject, the chain of inference breaks at the first step because Student One's booth is not a counterfactual possibility for Student Zero. This allows you to keep KK, but it requires a robust metaphysics of subjects where numerical identity matters for modal proximity, which some find too restrictive when dealing with intrinsic duplicates.

  The third diagnosis involves rejecting or severely weakening the Margin for Error principle itself, perhaps by adopting a form of epistemicism or a virtue-theoretic account that allows knowledge to persist across indistinguishable cases without requiring safety in Williamson's strict sense. You could argue that knowledge is compatible with a certain kind of luck, or that the boundaries of knowledge are sharp but unknowable, so that one can know in booth alpha-zero and not know in booth alpha-one without violating safety because the difference is not detectable but is metaphysically real. However, this tends to collapse into the first diagnosis anyway, because if the boundary is unknowable, you cannot know where it is, and thus you cannot know that you are on the safe side of it, which again undermines KK. Alternatively, you might deny that knowledge requires safety across indistinguishable cases, but this leaves you vulnerable to Gettier-style objections and lottery paradoxes, effectively dismantling the modern externalist consensus on what separates knowledge from true belief.

  If I must commit to one of these positions, I would advise you to accept the first diagnosis and surrender the KK principle, at least for perceptual knowledge of this kind. I say this not because I lack sympathy for the intuition that we know our own minds, but because the Margin for Error principle does too much heavy lifting elsewhere in epistemology to be discarded lightly. It explains why we do not know the winning lottery ticket before the draw, and why we do not know in Gettier cases where our belief is true only by accident. If you keep KK and reject the margin for error, you lose the ability to explain why knowledge is more valuable than mere true belief in a non-arbitrary way. The cost of giving up KK is primarily psychological; it requires us to accept that there are limits to self-transparency and that we can be in a state of knowing without being in a position to certify that state. This is a humbling conclusion, but it fits better with the fallibilist spirit of contemporary epistemology than preserving a strong luminosity principle that forces us into skepticism or metaphysical obscurantism.

  Regarding your final question about the panel, I am afraid I must tell you that it is largely a red herring, though a pedagogically useful one. Rowan introduced the two hundred students to block the complaint that a single subject might forget or lose attention over time, but in doing so he relies on the assumption that intrinsically identical subjects in adjacent booths constitute nearby cases for one another. In Williamson's framework, cases are individuated by the subject's internal state and their environment, not by the numerical identity of the soul inhabiting them. If Student Zero and Student One are intrinsic duplicates, then Student One's situation is a relevantly nearby possibility for Student Zero. The modal force of the argument comes from the indistinguishability of the cases, not the continuity of the person. Therefore, switching to a panel does not save the KK principle unless you are prepared to argue that my epistemic status depends on facts about me that are not supervenient on my internal state and immediate environment, which is a much heavier metaphysical price to pay than simply accepting the failure of KK. I hope the biscuits remain plentiful enough to soften the blow of this conclusion, and I would be very keen to hear how the group reacts to the suggestion that Rowan's clever booth setup does not actually escape the temporal argument's grip.

  Warmly,

  Your Colleague
