  # SWAMP CASE DECISION TREE
  **Context:** You are behind enemy lines. Partition: Army (Red/Blue) $\times$ Location (HQ/2nd Co).  
  **Input:** A message constrains $P(HQ | Red)$ and $P(HQ | Blue)$.  
  **Goal:** Determine your updating rule by answering concrete numerical questions.

  ---

  ### NODE 1: THE ARMY MARGINAL (Case 2)
  **Situation:**  
  Prior: $P(Red) = 0.4$, $P(Blue) = 0.6$.  
  Prior Conditionals: $P(HQ | Red) = 0.6$, $P(HQ | Blue) = 0.2$.  
  **Message:** "In your posterior, $P(HQ | Red) = 0.7$ and $P(HQ | Blue) = 0.5$."  
  **Question:** Does your posterior probability for being in **Red Territory** ($P'(Red)$) remain **0.4**?

  *   **(A) YES.** The message constrains ratios *inside* the territories, not the probability of the territories themselves.  
      $\rightarrow$ **GO TO NODE 2** (Constraint Group)
  *   **(B) NO.** The message is evidence generated by a process; the shift in conditionals implies a shift in the Army marginal.  
      $\rightarrow$ **GO TO NODE 3** (Statistician Group)
  *   **(C) NO.** Minimizing information gain requires shifting the Army marginal to balance the "shock" to the conditionals.  
      $\rightarrow$ **GO TO NODE 4** (Soft MinInfo Group)

  ---

  ### NODE 2: THE OVER-CONSTRAINED CASE (Case 3)
  **Situation:**  
  Prior: $P(HQ) = 0.5$.  
  **Message:** "$P(HQ | Red) = 0.9$ and $P(HQ | Blue) = 0.6$."  
  **Conflict:** If you keep prior Army marginals (e.g., $P(Red)=0.5$), implied $P'(HQ) = 0.75$. You cannot satisfy the Message and keep $P(HQ)=0.5$ simultaneously.  
  **Question:** Which constraint do you violate?

  *   **(A) Violate Prior $P(HQ)$.** Keep Army marginals ($P(Red)$) fixed; let $P(HQ)$ float to satisfy the message.  
      $\rightarrow$ **GO TO NODE 5** (Refinement Check)
  *   **(B) Violate Message.** Relax the message constraints (e.g., to 0.8/0.55) to preserve all prior marginals ($P(Red)$ and $P(HQ)$).  
      $\rightarrow$ **LEAF: MINIMUM INFORMATION (Relaxed)**
  *   **(C) Violate Army Marginals.** Keep $P(HQ)=0.5$ fixed; shift $P(Red)$ to satisfy the message conditionals.  
      $\rightarrow$ **LEAF: HQ-RIGIDITY**
  *   **(D) Violate Coherence.** Reject the message as inadmissible; no unique posterior exists.  
      $\rightarrow$ **LEAF: NO UNIQUE POSTERIOR**

  ---

  ### NODE 3: THE GARBLED MESSAGE (Case 4)
  **Situation:**  
  Message is 80% likely to be real (Case 2 constraints), 20% likely to be noise (no content).  
  **Question:** How do you combine the possibilities?

  *   **(A) Likelihood Model.** Define $P(Message | State)$ for both real and noise scenarios, then conditionalize.  
      $\rightarrow$ **LEAF: STATISTICIAN'S RULE**
  *   **(B) Linear Mixture.** Take 80% of the "Real Message Posterior" + 20% of the "Prior".  
      $\rightarrow$ **LEAF: MIXTURE RULE (Unnamed)**
      *(Flag: If noise is state-independent, A and B often yield identical numbers, but differ in principle.)*

  ---

  ### NODE 4: SOFT MININFO VARIANT
  **Situation:**  
  Same as Node 1, but you treat the message as an *expectation constraint* ($E[P(HQ|Army)] = \text{Target}$) rather than a hard ratio.  
  **Question:** Do you calculate the posterior by minimizing KL-divergence subject to these soft constraints?

  *   **(A) YES.** Optimize distance from prior subject to expected constraints.  
      $\rightarrow$ **LEAF: MINIMUM INFORMATION (Soft)**
  *   **(B) NO.** Return to Statistician's Rule (Node 3).  
      $\rightarrow$ **GO TO NODE 3**

  ---

  ### NODE 5: PARTITION REFINEMENT (Case 5)
  **Situation:**  
  You learn "Red Territory" actually contains three sub-regions ($R_1, R_2, R_3$). The message constraint ($P(HQ|Red)=0.7$) applied to the lump.  
  **Question:** If you re-run your rule on the finer partition (12 quadrants) and sum back to the original 4, does $P'(Red, HQ)$ change?

  *   **(A) NO.** The result is invariant under refinement of the partition cells.  
      $\rightarrow$ **LEAF: MINIMUM INFORMATION (Hard / I-Projection)**
  *   **(B) YES.** The result depends on how the constraint is distributed across the sub-regions.  
      $\rightarrow$ **LEAF: ARMY RIGIDITY (Jeffrey Conditionalization)**

  ---

  ### NODE 6: THE REFLECTION CHECK (Case 6 - Optional)
  **Situation:**  
  Message says: "Your posterior probability of HQ, *given you received this message*, is 3/4."  
  **Question:** Do you treat this as a fixed-point constraint requiring the Reflection Principle?

  *   **(A) YES.** Enforce $P(HQ | Message) = 3/4$ as a consistency constraint.  
      $\rightarrow$ **LEAF: REFLECTIONIST**
  *   **(B) NO.** Treat "Receiving Message" as standard evidence $E$.  
      $\rightarrow$ **MERGE TO NODE 3**

  ---

  ### NODE 7: THE UNIFORM WARM-UP (Case 1 - Sanity Check)
  **Situation:**  
  Prior: Uniform over 4 quadrants. Message: $P(HQ|Red)=0.75, P(HQ|Blue)=0.25$.  
  **Question:** Do all rules agree here?

  *   **(A) YES.** (Posterior is 3/8, 1/8, 1/8, 3/8).  
      $\rightarrow$ **END (Consensus Zone)**
  *   **(B) NO.** Your rule discriminates even in the uniform case.  
      $\rightarrow$ **LEAF: UNNAMED DEVIANT**

  ---

  ## KEY TO LEAVES

  | Leaf Name | Path | Awkward Commitment |
  | :--- | :--- | :--- |
  | **ARMY RIGIDITY** (Jeffrey) | 1A $\rightarrow$ 2A $\rightarrow$ 5B | **Fails Partition Robustness:** Your posterior changes if you learn the map was more detailed, even if the message content didn't change. |
  | **HQ-RIGIDITY** | 1A $\rightarrow$ 2C | **Incoherence Risk:** Often mathematically impossible to satisfy message constraints while holding HQ marginals fixed (Case 3). |
  | **MININFO (Hard)** | 1A $\rightarrow$ 2A $\rightarrow$ 5A | **Computationally Heavy:** Requires solving optimization problems; extensionally equivalent to Army Rigidity in simple cases but diverges on refinement. |
  | **MININFO (Relaxed)** | 1A $\rightarrow$ 2B | **Message Ignoring:** You explicitly disobey the message's numbers to stay close to your prior marginals. |
  | **STATISTICIAN'S RULE** | 1B $\rightarrow$ 3A | **Protocol Regress:** Requires modeling *why* the enemy sent this message (likelihoods), which may be unknown or infinite. |
  | **MIXTURE RULE** | 1B $\rightarrow$ 3B | **Non-Bayesian:** Linear pooling of probabilities can lead to dynamic inconsistency (Dutch Book) over time. |
  | **NO UNIQUE POSTERIOR** | 1A $\rightarrow$ 2D | **Paralysis:** You cannot update at all when constraints conflict with priors. |
  | **MININFO (Soft)** | 1C $\rightarrow$ 4A | **Arbitrary Metric:** Justifies shifting Army marginals based on KL-divergence, which some argue is not a normative requirement. |
  | **REFLECTIONIST** | 6A | **Fixed-Point Traps:** Can lead to inconsistencies if the message content depends on your update rule. |

  ## FLAGGED INDISTINGUISHABLE PAIRS
  1.  **Army Rigidity vs. MinInfo (Hard):** In **Case 1 (Uniform)** and **Case 2 (Hard Constraints)**, these rules produce **identical numbers**. They are only separated by **Node 5 (Refinement)**. If you do not care about partition robustness, these are the same rule.
  2.  **Statistician vs. Mixture:** In **Case 4**, if the noise is state-independent (random noise doesn't depend on where you are), the Likelihood Rule and the Mixture Rule produce **identical numbers**. They separate only if the noise generation depends on your location.

  ## NOTES ON CASE 2 (THE DIVERGENCE)
  *   **Your Intuition:** You suspected MinInfo would shift $P(Red)$ in Case 2.
  *   **The Math:** Standard MinInfo (I-projection) with *hard* conditional constraints **preserves** the partition marginals ($P(Red)$ stays 0.4). It coincides with Army Rigidity.
  *   **The Shift:** MinInfo only shifts $P(Red)$ if the constraints are *soft* (expectations) or if the partition is refined (Node 5). If you want $P(Red)$ to shift, you must adopt the **Statistician's Rule** (Node 3) or **Soft MinInfo** (Node 4).
