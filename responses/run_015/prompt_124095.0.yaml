answer: |-
  ### Dependency-Chain Outline

  **Three Conceptual Dependencies:**
  1.  **Project-Relative Value:** Students must distinguish between goods that are consumable experiences (personal) and goods that are contributions to ongoing structures (project-based).
  2.  **Temporal Extension:** Students must grasp that project-based value is logically dependent on the existence of future agents who inherit, use, or maintain those structures.
  3.  **Secular Continuity:** Students must understand "collective afterlife" as a sociological fact about the continuity of practice, not a metaphysical claim about souls or consciousness surviving death.

  **Single Biggest Misconception:**
  STEM-trained rationalists typically conflate "meaning" with "conscious welfare," assuming that if no one exists to suffer or feel happy, no value exists; they fail to see that the *intelligibility* of current action depends on future uptake.

  **Distinction Sentence:**
  Altruism cares about the welfare of future people, whereas collective meaning-dependence cares about the continuation of the practices that make our current welfare intelligible.

  ***

  ### 90-Minute Teaching Plan: The Afterlife Conjecture for Engineers

  #### I. Sequence of Components (20 Minutes)

  **Order of Operations:**
  1.  **Personal vs. Project Goods:** Begin by categorizing values. Ask the room to list things they value. Split them into "experiential" (eating a meal, feeling safe) and "contributory" (writing code, proving a theorem, raising a child).
  2.  **Temporal Dependence of Projects:** Establish that contributory goods logically require a future. A proof is only a contribution if it is read; code is only a tool if it is run. If the universe ends in five minutes, the code is not "useful," it is merely noise.
  3.  **The Collective Afterlife Conjecture:** Only now introduce Scheffler's term. Define it as the implicit assumption that there will be successors to validate our projects.

  **Why This Order is Critical:**
  If you introduce the "afterlife" concept first, a skeptical technical audience will immediately categorize it as religious mysticism or sentimental poetry. Their defenses will raise, and they will stop listening. By starting with **Project Goods**, you speak their language of systems and outputs. By moving to **Temporal Dependence**, you establish a logical constraint similar to a dependency chain in software. By the time you introduce the **Collective Afterlife**, it is not a metaphysical claim but a label for a structural necessity they have already accepted. Reversing this order causes the audience to misinterpret the claim as religious because they will lack the secular, functionalist framework required to ground it.

  #### II. The Carrying Example: The Open-Source Cryptographer (25 Minutes)

  **The Scenario:**
  Present a senior cryptographer, "Alice," who spends the last decade of her life hardening a specific open-source privacy protocol. She knows she will not live to see it widely adopted, nor will she personally benefit from its privacy protections. She assumes, however, that the broader development ecosystem will survive her, maintaining the servers and integrating the protocol into future stacks.

  **What This Example Must Have:**
  *   **High Technical Rigor:** The work must be recognizably difficult and valuable (like kernel maintenance or cryptographic standards), not vague "art."
  *   **Independence from Survival:** Alice must not expect to be alive to use it. The value is entirely downstream.
  *   **No Direct Harm:** Alice must not suffer because of extinction. She dies of old age either way. This isolates the variable of *meaning* from the variable of *suffering*.

  **What This Example Must Lack:**
  *   **Personal Legacy:** It cannot be about her name on a building. It must be about the *functionality* of the protocol.
  *   **Beneficiaries She Knows:** She shouldn't be doing it for her grandchildren specifically (which collapses into kin altruism). It must be for "future users."

  **Why the Standard Archivist Framing Fails:**
  Scheffler's original example often involves an archivist preserving records. For a rationalist/engineering audience, archivists look backward (preserving the past). Engineers build forward. An archivist might seem like a hoarder of dead data; a cryptographer building a protocol is a builder of future infrastructure. The engineer sees themselves in the cryptographer; they do not see themselves in the archivist. The cryptographer example triggers the intuition that *building* requires a *user base* that extends beyond the builder's lifespan.

  #### III. Mapping Misconceptions and Defusions (25 Minutes)

  Address these misconceptions at the specific points where they naturally arise during the discussion of the example.

  **1. Misconception: Religious Immortality**
  *   **Timing:** *Before* introducing the term "Afterlife Conjecture" (during Step 1 of Sequence).
  *   **Defusion:** "When we say 'afterlife,' we are not talking about souls persisting; we are talking about the persistence of the user base for the code we are writing now."

  **2. Misconception: Emotional Appeal (Sadness for the Unborn)**
  *   **Timing:** *During* the analysis of the Cryptographer example.
  *   **Defusion:** "This is not about feeling sad that future people won't exist; it is about recognizing that Alice's current work loses its status as 'work' if there is no one to run the code."

  **3. Misconception: Utilitarian Population Ethics**
  *   **Timing:** *After* the example, when discussing why extinction is bad.
  *   **Defusion:** "Utilitarianism counts the happiness of future people; this argument counts the meaningfulness of *our* present actions, which depends on those people existing."

  **4. Misconception: Mystical Group Consciousness**
  *   **Timing:** *When* defining the "Collective" in Collective Afterlife.
  *   **Defusion:** "We do not need a hive mind; we only need a causal chain of maintenance, like a repository being forked and updated by strangers."

  #### IV. Check for Understanding (15 Minutes)

  **The Test Scenario:**
  "Imagine an asteroid is detected that will sterilize Earth in 200 years. The impact is painless, no one currently alive will be alive to see it, and no one currently alive will suffer from the knowledge. A utilitarian calculation suggests the 'lost utility' is the sum of happiness of all those future people who won't exist."

  **The Task:**
  Ask participants to write down a single paragraph explaining why a researcher today might lose motivation to solve long-term problems (like fusion energy or AI alignment) in this scenario, *without* referencing the lost happiness of future people.

  **Success Criteria:**
  They must articulate that the *objective* of the research vanishes. Solving fusion energy is only "solving energy" if there is a society to use the energy. If the society ends in 200 years, the research becomes merely a hobby or a historical curiosity, stripping it of its project-based value. They must distinguish this from "it's sad those people die" (Utilitarianism) to "it's pointless for me to build this if no one will use it" (Meaning-Dependence).

  #### V. Open Refusals (5 Minutes)

  To keep the session focused on the phenomenology of meaning rather than getting bogged down in adjacent technical debates, explicitly set aside the following two bodies of material:

  1.  **Parfit's Non-Identity Problem:** Acknowledge that the logical puzzle of whether future people are harmed by being brought into existence is real, but state clearly: "We are not solving the non-identity problem today. We are analyzing the structure of present meaning, not the rights of future entities."
  2.  **Formal Welfare Economics (Discount Rates):** Acknowledge that economists model intergenerational justice using discount rates, but state clearly: "We are not discussing how to weight future utility in a cost-benefit analysis. We are discussing why present action feels intelligible at all."

  **Closing Instruction:**
  End the session by reminding them that Scheffler's claim is not that extinction is *only* bad because of meaning, but that meaning is a *component* of the badness that standard utilitarian models often miss. This validates their utilitarian instincts while expanding the model.
