prompt: |-
  hey — I need a spec, not a reading list. I'm helping put together an internal auditing checklist for a hospital group, and the recurring mess is this: an analyst pulls a treatment comparison out of our own records, finds that the new option looks worse overall but better inside every severity band, and then three people look at the same table and reach three different conclusions about which number is the effect. I want the requirements list that any rule for that situation has to meet — the cases it has to get right, the distinctions it can't collapse, the results it can't contradict — with the case or consideration behind each requirement. Assume the rule is meant to be run by a data steward who has the table, a rough causal story, and a decision to make, and who has to write down one sentence at the end saying which number to act on. That purpose is the point: I don't want adequacy in the abstract.

  Cases I definately want covered, at minimum:

  - the standard one: A beats B among mild patients and among severe patients, loses overall
  - the same shape but where the thing you'd stratify on is caused by the treatment (a complication, a follow-up measurement) rather than a pre-treatment severity marker
  - a stratifier that's a noisy stand-in for the real confounder, measured with error
  - a reversal that shows up in the odds ratio but not in the risk difference, with no confounding in the setup at all
  - a continuous severity score where whether you get a reversal depends on where you cut it into bands
  - a reversal driven by a band with four patients in it
  - the case where the aggregate and the stratified numbers are both correct but answer different questions, because of how much the decision-maker will know at the moment she acts
  - a case where the mild/severe mix in our hospitals differs from the mix in whatever dataset the numbers came from

  Also: I've been sorting these into 'paper reversals' (the kind that dissolve once you're explicit about the causal question) and 'live reversals' (the kind that still change what you should do after the question is fixed). Tell me if that cut is the right one or whether it slices across the cases badly, and if it's wrong give me a better one.

  Two more things. First, mark each requirement as non-negotiable versus a preference of one camp, and call out the requirements that are just my side's prejudices — I'd rather have six real ones than a wishlist. Second, flag any subset of the requirements that can't be jointly satisfied (my guess is that "uses only what's in the table" and "tells a confounder apart from a variable caused by the treatment" can't both hold, and that binning-invariance fights using the full score, but check me on that). Then say which single requirement knocks out the most popular heuristics.

  At the end, briefly — a short table is fine — score four candidate rules against the list: report both sets of numbers and move on; adjust for everything measured before treatment; adjust only for the variables that block the confounding routes; and set it up as a decision problem, picking the action that does best given what's known when the action is taken. Please write it in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (requirements list) for an internal auditing checklist for a hospital group regarding Simpson's Paradox/reversal situations in treatment comparisons.
      *   **Audience:** Data Steward (has the table, a rough causal story, needs to make a decision, must write one sentence on which number to act on).
      *   **Tone:** Direct, American English, no reading lists, no abstract adequacy.
      *   **Specific Cases to Cover:**
          1.  Standard Simpson's (A > B in subgroups, A < B overall).
          2.  Stratifier is a *collider* or *mediator* (caused by treatment).
          3.  Stratifier is a noisy proxy for the real confounder.
          4.  Reversal in Odds Ratio (OR) but not Risk Difference (RD) without confounding (non-collapsibility).
          5.  Continuous severity score where cut-points determine reversal.
          6.  Reversal driven by a tiny band (n=4).
          7.  Aggregate vs. Stratified both correct but answer different questions (information available at decision time).
          8.  Transportability issue (hospital mix differs from dataset mix).
      *   **Conceptual Check:** Evaluate the user's "Paper vs. Live Reversals" distinction.
      *   **Constraints:**
          *   Mark requirements as Non-Negotiable vs. Preference/Prejudice.
          *   Identify incompatible requirements (trade-offs).
          *   Identify the requirement that kills the most popular heuristics.
          *   Score four candidate rules against the spec.
      *   **Format:** Specification style, clear headers, American English.

  2.  **Deconstruct the "Paper vs. Live" Distinction:**
      *   *User's definition:* "Paper reversals" dissolve when the causal question is explicit; "Live reversals" change action even after the question is fixed.
      *   *Critique:* This is actually a very strong distinction in causal inference. "Paper reversals" usually refer to non-collapsibility (mathematical artifacts of the metric, like OR vs. RD) or conditioning on colliders (bias). "Live reversals" refer to genuine confounding where the stratified estimate is the causal effect, but the marginal is the policy effect (or vice versa depending on the target).
      *   *Refinement:* However, for a *data steward* making a *decision*, the distinction needs to be about *actionability*. A better cut for this specific context is: **Bias vs. Target Mismatch.**
          *   *Bias:* The number is wrong for *any* question (e.g., collider bias, measurement error).
          *   *Target Mismatch:* The number is right for *a* question, but not *the* question (e.g., marginal vs. conditional effect, transportability).
      *   *Decision:* I will validate the user's intuition but refine the terminology for the spec to ensure it maps to the "one sentence decision" requirement. I'll stick close to their "Paper/Live" framing but clarify it as "Artifact vs. Decision-Relevant Heterogeneity." Actually, looking closer, "Paper" often implies "ignore it," while "Live" implies "deal with it." I will endorse the cut but tighten the definition for the checklist context.

  3.  **Drafting the Requirements (The Spec):**
      *   *Requirement 1 (Causal Direction):* Must distinguish pre-treatment confounders from post-treatment variables. (Addresses Case 2).
      *   *Requirement 2 (Metric Consistency):* Must specify the effect metric (RD vs. OR) before checking for reversal. (Addresses Case 4).
      *   *Requirement 3 (Stability/Support):* Must flag strata with insufficient sample size. (Addresses Case 6).
      *   *Requirement 4 (Measurement Error):* Must acknowledge proxy reliability. (Addresses Case 3).
      *   *Requirement 5 (Cut-point Sensitivity):* Must test sensitivity to binning of continuous variables. (Addresses Case 5).
      *   *Requirement 6 (Decision Context):* Must align the estimate with information available at the time of action. (Addresses Case 7).
      *   *Requirement 7 (Transportability):* Must account for population mix differences. (Addresses Case 8).
      *   *Requirement 8 (The Standard):* Must identify the direction of association in marginal vs. conditional. (Addresses Case 1).

      *Refining for "Non-Negotiable" vs. "Prejudice":*
      *   Non-Negotiable: Causal direction (don't adjust for mediators), Metric definition (OR isn't RD), Decision Context (what do we know when we act).
      *   Preference/Prejudice: Binning invariance (hard to achieve), Measurement error handling (often requires external data not in the table).
      *   Incompatibilities: "Uses only what's in the table" vs. "Distinguish confounder from mediator" (table doesn't show time/order). "Binning invariance" vs. "Use full score" (discretization loses info).

  4.  **Evaluating the "Paper vs. Live" Cut:**
      *   It's a good heuristic, but "Paper" sounds dismissive. Some "paper" reversals (like non-collapsibility) are mathematical truths, not errors. The critical distinction for a steward is: **Does this number bias the causal estimate, or does it just describe a different population?**
      *   I will suggest renaming/refining this to **"Bias Artifacts" vs. "Target Population Mismatches."**

  5.  **Identifying the "Heuristic Killer":**
      *   Which requirement kills the most popular bad habits?
      *   Popular habit: "Always adjust for everything."
      *   Killer Requirement: **The Causal Order Requirement** (Do not adjust for variables caused by treatment). This kills the "adjust for everything" and "adjust for post-treatment outcomes" heuristics.
      *   Alternative: **The Decision Context Requirement** (Act on the number matching information available). This kills "Always report the stratified number."
      *   Selection: The **Decision Context** requirement is the strongest for *action*. The **Causal Order** requirement is the strongest for *validity*. Given the prompt asks for "which number to act on," the Decision Context is the ultimate tie-breaker. However, the prompt asks what knocks out popular *heuristics* regarding the paradox itself. Usually, people think "Stratified = Truth." The requirement that kills this is **Target Mismatch (Case 7/8)**. Let's go with the requirement that forces alignment with the *decision time information*.

  6.  **Scoring the Candidate Rules:**
      1.  *Report both:* Fails the "one sentence" goal.
      2.  *Adjust for everything pre-treatment:* Fails on Colliders/Proxies.
      3.  *Adjust for confounding routes (DAG-based):* Strong on validity, weak on decision context/transportability.
      4.  *Decision Problem (Action-oriented):* Best fit for the spec.

  7.  **Review against Constraints:**
      *   American English? Yes.
      *   No reading list? Yes.
      *   Mark Non-Negotiable vs. Preference? Yes.
      *   Flag incompatible requirements? Yes.
      *   Score the four rules? Yes.
      *   Address the "Paper/Live" cut? Yes.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Incompatibility:* The prompt suspects "Uses only what's in the table" and "Distinguish confounder from mediator" can't both hold. This is correct. The table is static; causality is temporal/structural. I need to make sure this is highlighted.
      *   *Self-Correction on Binning:* "Binning invariance" is mathematically impossible if you bin. The requirement should be "Sensitivity to binning," not "Invariance."
      *   *Refining the "One Sentence" Goal:* The spec must force a choice.

      *(Self-Correction during drafting)*: I need to be careful not to write a textbook. This is a *spec*. It needs to read like engineering requirements. "The system shall..." or "The rule must..."

      *Requirement 1 (Causal Status):* Variable must be verified as pre-treatment. (Non-negotiable).
      *Requirement 2 (Metric):* Metric must be collapsible or non-collapsibility acknowledged. (Non-negotiable).
      *Requirement 3 (Support):* Strata must have minimum N. (Non-negotiable).
      *Requirement 4 (Decision Info):* Estimate must match info available at treatment time. (Non-negotiable).
      *Requirement 5 (Transport):* Weights must match target population. (Preference/Contextual).
      *Requirement 6 (Proxy):* Error bounds must be stated. (Preference - hard to enforce).

      *Incompatibilities:*
      1.  Table-Only vs. Causal Status (Table doesn't show time).
      2.  Binning Invariance vs. Discrete Bands (Mathematically contradictory).

      *Heuristic Killer:* The "Decision Info" requirement. It stops people from blindly preferring stratified estimates.

      *Paper/Live:* I will validate it but suggest "Artifact vs. Actionable" as the operational label.

      *Scoring:*
      1.  Report Both: Fails "One Sentence."
      2.  Adjust Pre-Treatment: Fails "Causal Status" (some pre-treatment are colliders/instruments) and "Decision Info."
      3.  Confounding Routes: Good on Causal Status, fails "Decision Info" (sometimes you need marginal for policy).
      4.  Decision Problem: Hits all Non-Negotiables.

  9.  **Final Polish:** Check tone. Ensure it sounds like a spec for a hospital audit team, not a stats lecture. Ensure American spelling (program, analyze, etc.).

      *Wait, one nuance on Case 4 (OR vs RD):* This is non-collapsibility. The spec needs to demand metric specification *before* analysis.
      *Nuance on Case 7 (Info at decision time):* This is the crux of "Live" reversals. If the doctor knows severity *before* treating, they need the stratified number. If they don't, they need the marginal. This is the key differentiator.

      *Let's finalize the "Paper/Live" verdict:* It's a good cut, but "Paper" implies "ignore." Some paper reversals (non-collapsibility) mean the *metric* is wrong, not the number. I will suggest "Mathematical Artifact" vs. "Structural/Decision Mismatch."

      *Let's finalize the Incompatibility:* The user guessed "Uses only what's in the table" vs "Tell confounder from mediator." I need to confirm this. Yes, a CSV doesn't have timestamps. That requires external metadata.

      *Let's finalize the Heuristic Killer:* "Always stratify" is the most common bad heuristic. The requirement that kills it is "Match Information Available at Decision Time."

      *Let's build the response.*
answer: |-
  # Specification: Treatment Comparison Reversal Audit Rule

  **Purpose:** To mandate a single, actionable conclusion from treatment comparison data where marginal and conditional associations conflict.
  **User:** Data Steward (access to table, causal metadata, and decision context).
  **Output:** One sentence declaring the effect estimate to be used for action.

  ---

  ## 1. Core Requirements
  Each requirement below includes the specific case it addresses and its enforcement status.

  ### REQ-01: Causal Temporal Order
  **The rule must verify that any stratification variable exists prior to treatment assignment.**
  *   **Case Covered:** Stratifier caused by treatment (e.g., complications, post-treatment biomarkers).
  *   **Rationale:** Adjusting for a variable caused by treatment induces collider bias or blocks the causal path, creating a "reversal" that is purely artifactual.
  *   **Status:** **Non-Negotiable.**
  *   **Constraint:** Cannot be satisfied using *only* the analysis table. Requires external metadata (data dictionary or study protocol) indicating variable timestamps.

  ### REQ-02: Metric Specification
  **The rule must define the effect metric (Risk Difference, Risk Ratio, or Odds Ratio) prior to checking for reversal.**
  *   **Case Covered:** Reversal in Odds Ratio but not Risk Difference (non-collapsibility).
  *   **Rationale:** Odds ratios are mathematically non-collapsible; a difference between marginal and conditional ORs can exist without confounding. Comparing them without specifying the metric creates false alarms.
  *   **Status:** **Non-Negotiable.**

  ### REQ-03: Minimum Stratum Support
  **The rule must flag or suppress strata where the sample size falls below a stability threshold (e.g., <10 events per arm).**
  *   **Case Covered:** Reversal driven by a band with four patients.
  *   **Rationale:** Small strata yield high-variance estimates that can reverse direction by chance. Acting on these creates high-risk decisions based on noise.
  *   **Status:** **Non-Negotiable.**

  ### REQ-04: Decision-Time Information Match
  **The rule must select the estimate (marginal or conditional) that matches the information available to the decision-maker at the moment of action.**
  *   **Case Covered:** Aggregate and stratified numbers are both "correct" but answer different questions (e.g., policy vs. individual triage).
  *   **Rationale:** If the clinician knows the severity score *before* choosing treatment, the stratified effect is the relevant causal effect. If they do not, the marginal effect predicts the outcome of a policy change.
  *   **Status:** **Non-Negotiable.**

  ### REQ-05: Binning Sensitivity Check
  **The rule must report whether the reversal persists across alternative cut-points for continuous severity scores.**
  *   **Case Covered:** Continuous severity score where reversal depends on cut location.
  *   **Rationale:** Discretizing continuous variables introduces arbitrariness. A reversal that vanishes when moving a cut-point by 5% is not robust enough for clinical guidance.
  *   **Status:** **Preference** (Ideal, but may require computational resources beyond a simple checklist).

  ### REQ-06: Proxy Reliability Declaration
  **The rule must state the validation correlation between the stratifier and the underlying physiological condition.**
  *   **Case Covered:** Stratifier is a noisy stand-in for the real confounder.
  *   **Rationale:** Adjusting for a noisy proxy leaves residual confounding. The steward must know if the adjustment is sufficient to trust the stratified number.
  *   **Status:** **Preference** (Often unknown at the time of audit; relies on prior literature).

  ### REQ-07: Population Weighting
  **The rule must allow re-weighting of strata if the hospital's patient mix differs from the dataset's mix.**
  *   **Case Covered:** Mild/severe mix in our hospitals differs from the source dataset.
  *   **Rationale:** A stratified estimate is locally valid, but the *overall* expected impact depends on the local prevalence of severity bands.
  *   **Status:** **Preference** (Required for system-level policy, less critical for bedside decisions).

  ---

  ## 2. Incompatible Requirements (Trade-Offs)
  You cannot satisfy all desirable constraints simultaneously. The following pairs are mutually exclusive:

  1.  **"Table-Only" vs. "Causal Temporal Order" (REQ-01)**
      *   **Conflict:** A static contingency table does not contain time stamps. You cannot distinguish a pre-treatment confounder from a post-treatment mediator using the table alone.
      *   **Resolution:** You must import external metadata. If you restrict the steward to *only* the CSV, REQ-01 fails.

  2.  **"Binning Invariance" vs. "Discrete Bands" (REQ-05)**
      *   **Conflict:** You cannot demand that results be invariant to binning while simultaneously requiring the output to be presented in discrete bands. Discretization inherently loses information and creates cut-point sensitivity.
      *   **Resolution:** Use the continuous score for the analysis (model-based adjustment) and only bin for presentation, acknowledging the sensitivity.

  3.  **"Unbiased Causal Effect" vs. "Predictive Accuracy for Policy" (REQ-04)**
      *   **Conflict:** The stratified number is usually the unbiased *causal* effect. The marginal number is often the accurate *predictive* effect for a population where severity is unknown.
      *   **Resolution:** Prioritize REQ-04. An unbiased number is useless if it answers a question the decision-maker cannot ask (e.g., "What if I knew the severity?" when they don't).

  ---

  ## 3. The Heuristic Killer
  **Requirement:** **REQ-04 (Decision-Time Information Match)**.

  **Why:** The most popular heuristic in hospital auditing is *"Always trust the stratified number; Simpson's Paradox means the aggregate is lying."*
  REQ-04 kills this. It forces the steward to admit that if the severity score is not known at triage, the stratified number is scientifically precise but operationally useless. It shifts the burden from "find the true effect" to "find the useful effect."

  ---

  ## 4. Evaluation of the "Paper vs. Live" Cut
  Your distinction is **mostly correct but operationally risky.**

  *   **Paper Reversals** (Non-collapsibility, Collider Bias): These are artifacts. The number is wrong or the metric is misleading.
  *   **Live Reversals** (Confounding, Transportability): These are real structural differences.

  **Critique:** Calling them "Paper" implies they can be ignored. Non-collapsibility (OR vs. RD) is a mathematical truth, not a mistake. If you ignore it, you report the wrong metric.
  **Better Cut:** **"Bias Artifacts" vs. "Target Mismatches."**
  *   *Bias Artifacts:* The number is invalid for *any* decision (e.g., adjusting for a mediator). **Action:** Discard.
  *   *Target Mismatches:* The number is valid but for the *wrong population or information state* (e.g., marginal vs. conditional). **Action:** Select based on REQ-04.

  ---

  ## 5. Scoring Candidate Rules
  Scored against the **Non-Negotiable** requirements only (REQ-01, 02, 03, 04).

  | Candidate Rule | REQ-01 (Time) | REQ-02 (Metric) | REQ-03 (Support) | REQ-04 (Decision Info) | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **1. Report both sets of numbers and move on.** | ❌ | ✅ | ✅ | ❌ | **Fail.** Violates the "one sentence" purpose. Kicks the can to the clinician. |
  | **2. Adjust for everything measured before treatment.** | ❌ | ✅ | ⚠️ | ❌ | **Fail.** Violates REQ-01 (some pre-treatment vars are colliders/instruments). Violates REQ-04 (ignores decision context). |
  | **3. Adjust only for variables that block confounding routes.** | ✅ | ✅ | ⚠️ | ❌ | **Partial Pass.** Strong on validity (REQ-01), but fails REQ-04. It finds the *causal* effect, not necessarily the *actionable* effect. |
  | **4. Set up as a decision problem (pick action best given known info).** | ✅ | ✅ | ✅ | ✅ | **Pass.** Explicitly requires causal structure (REQ-01) and aligns estimate with information state (REQ-04). |

  **Recommendation:** Adopt Candidate 4, enforced by the checklist above. It is the only rule that guarantees the final sentence is actionable.
