prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and one of the durable lessons I took from that corpus is that most verbal disputes dissolve once you force people to state their claims without the contested abstractions. I now run an upper-level seminar on metaethics — 12 students, one 90-minute session — and I want to stage the Frege–Geach problem as a live game before the students ever hear its name.

  The problem, as my students will meet it on paper: expressivism in metaethics holds that a claim like "lying is wrong" doesn't describe a fact but expresses an attitude — roughly, booing. That story is comfortable as long as moral claims occur only asserted and on their own. It strains when the same content shows up embedded: "If lying is wrong, getting your little brother to lie is wrong"; "Either lying is wrong or breaking promises is"; "It's not the case that lying is wrong." In an embedded position the claim isn't being asserted, so nothing is being booed, and yet the argument's validity seems to turn on the embedded clause meaning the same thing there as it does when asserted outright. I want the students to discover this by *needing* the embeddings, not by being told about them.

  Design the session. What I have in mind, though feel free to improve on it: the students are split into groups speaking a deliberately restricted toy language for part of the session — one sub-vocabulary purely attitudinal (a small closed stock of praise/blame signals, standing to it as the naive expressivist thinks moral talk stands to the world), the rest ordinary descriptive language. The groups then have to conduct real business under uncertainty — ratifying standing policies of the form "if such-and-such turns out to be the case, we do X," with points at stake, and later settling disputes about what was agreed once events resolve. The intended arc: atomic attitudinal claims work fine (phase 1); then conditionals, negations, and contested embeddings arrive and the attitudinal vocabulary can't state what the group settled (phase 2); finally a disagreement about a conditional between two players who agreed on every atomic claim forces the issue (phase 3).

  Please provide:

  - Materials, group setup, rules, and the exact sequence of phases, with a payoff scheme in points (no real money) that makes the embeddings genuinely necessary rather than decorative;
  - the specific moments where the toy language is supposed to hit its limits, and how I should time them;
  - a debrief that names the Frege–Geach problem only at the end, and maps each phase onto its components: the same content asserted versus embedded, modus ponens relying on stable content across those positions, and what the expressivist owes an account of when a conditional is uttered;
  - what will predictably go wrong the first time I run it — students smuggling descriptive language into the attitudinal vocabulary, phase 2 collapsing into ordinary negotiation, the dispute stage running long — and how to handle each;
  - and, frankly, which feature of the actual philosophical problem the game cannot reproduce. My guess is that any staged failure only convicts a naive boo/hurrah language, while the live dialectic is about whether more sophisticated expressivist machinery — attitudes toward attitudes, norms of conversation — can carry the embeddings; the facilitator will have to supply that distinction, and I want you to be explicit about where the game's outcome would amount to a strawman if presented as a verdict on expressivism itself.

  End with a single line beginning "Summary:" that compresses the whole design into one sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level metaethics seminar (12 students, 90 minutes).
      *   **Background:** Students know rationalist blogs/Overcoming Bias (familiar with dissolving verbal disputes, abstraction removal).
      *   **Goal:** Stage the Frege-Geach problem as a live game *before* naming it.
      *   **Core Mechanic:** Restricted toy language (attitudinal vs. descriptive). Groups must ratify policies involving conditionals/embeddings under uncertainty.
      *   **Desired Arc:**
          1.  Atomic attitudinal claims work fine.
          2.  Conditionals/negations break the attitudinal vocabulary.
          3.  Disagreement about conditionals despite atomic agreement forces the issue.
      *   **Deliverables:** Materials, setup, rules, phases, payoff scheme, timing, specific failure points, debrief structure, predicted pitfalls & fixes, limitations of the analogy (strawman risk), and a one-sentence summary.

  2.  **Deconstruct the Philosophical Problem (Frege-Geach):**
      *   *Expressivism:* "Murder is wrong" = "Boo murder!" (Non-cognitive attitude).
      *   *The Problem:* Logic requires univocal meaning.
      *   *Example:*
          1.  Murder is wrong.
          2.  If murder is wrong, then getting your little brother to murder is wrong.
          3.  Therefore, getting your little brother to murder is wrong.
      *   *Expressivist Trouble:* Premise 1 is an attitude. Premise 2 is *not* expressing an attitude toward murder (you aren't booing murder in the antecedent). So, what is Premise 2? If it's not the same content as Premise 1, the argument is invalid (equivocation).
      *   *Game Translation:* Students need to make binding agreements about *future actions contingent on states of the world* using a language that only allows *current expressions of feeling*.

  3.  **Drafting the Game Design:**

      *   **Setup:** 12 students. Split into 3 groups of 4? Or 4 groups of 3? Let's go with 3 groups of 4. It allows for inter-group negotiation or intra-group consensus. Actually, for the "dispute" phase, pairs might be better. Let's try 6 pairs (12 students). It makes the "disagreement" phase sharper.
      *   **Language:**
          *   *Descriptive:* "Card is Red," "Card is Blue," "Die is High." (Facts)
          *   *Attitudinal:* "Yuck," "Yay." (Values)
          *   *Forbidden:* "If," "Not," "Or," "Wrong," "Right," "Should." (Logical operators/Normative predicates).
      *   **Payoff:** Points determine the "winner." Points come from successfully executing policies.
      *   **Phase 1 (Atomic):** Simple coordination. "We Yay Red." Easy.
      *   **Phase 2 (Embedding/Uncertainty):** The core. They need to commit to an action *if* a fact obtains, based on a value. But they can't say "If." They have to use the attitudinal language.
      *   **Phase 3 (The Clash):** Two students agree on all atoms (facts and attitudes) but disagree on the *policy* (the conditional). This mirrors the logical validity issue.

      *   *Refining the Mechanic:* The "If" is the hard part. If I ban the word "If," they will just invent a code word. The constraint needs to be conceptual, not just lexical.
      *   *Idea:* The "Contract" mechanism. They write down a rule. The rule must be written *only* in the allowed vocabulary.
      *   *Scenario:* A "Risk Pool." There is a hidden state (Card drawn). There is a potential loss (Points). They need to insure against the loss *conditional* on the value judgment.
      *   *Better Idea:* The "Legislature." They are passing laws.
      *   *Let's stick to the prompt's suggestion:* "Ratifying standing policies."
      *   *The Twist:* The attitudinal vocabulary is *non-truth-apt*. It can't be the antecedent of a conditional in their grammar.

      *   *Revised Game Flow:*
          1.  **Vocabulary:**
              *   Facts: $F_1, F_2...$ (e.g., "Card is Heart", "Card is Spade").
              *   Attitudes: $A_1, A_2...$ (e.g., "Boo Heart", "Yay Spade").
              *   Actions: $X, Y$ (e.g., "Pay 5", "Receive 5").
              *   *Banned:* Connectives (If, Then, Not, And, Or).
          2.  **Phase 1:** Assert attitudes. "Boo Heart." Everyone agrees. Points awarded for consensus.
          3.  **Phase 2:** The "Contingency." A card will be drawn later. They must agree *now* on what to do *later*.
              *   Constraint: You cannot write "If Card is Heart, then Pay 5."
              *   You must write: "Boo Heart" + "Pay 5".
              *   Problem: Does "Boo Heart" trigger "Pay 5"? Or is "Boo Heart" just a noise made now?
              *   If I say "Boo Heart" now, and later the card is a Heart, do I pay?
              *   If I *don't* say "Boo Heart" now (because I'm saving it for later), have I committed?
              *   *Crucial Failure:* To make a conditional commitment, you need to embed the attitude in a proposition. The toy language only allows *expressing* the attitude. You can't express an attitude about a hypothetical expression of an attitude.
          4.  **Phase 3:** The Dispute. Student A and Student B both "Boo Heart."
              *   Student A thinks: "Boo Heart" implies "Pay 5" in the future.
              *   Student B thinks: "Boo Heart" is just a noise I made now. It doesn't bind future action.
              *   They agree on the atomic utterance. They disagree on the inference.

  4.  **Developing the Payoff/Rules:**
      *   Need points to make it matter.
      *   Endowment: 100 points each.
      *   Event: A card is drawn (Red/Black).
      *   Loss: If Red, everyone loses 20 points *unless* a policy was ratified.
      *   Policy: Requires unanimous "Attitude Signal" + "Action Commitment."
      *   The Trap: The rules say "To ratify, you must utter the Attitude." But if you utter it *now*, it's an expression of current feeling. If the card is drawn *later*, the feeling might change, or the utterance was about *now*, not *then*.
      *   Actually, let's make it about *logic*.
      *   Phase 3 needs to be a Modus Ponens failure.
      *   Premise 1: "Boo Lying" (Atomic).
      *   Premise 2: "If Boo Lying, then Boo Encouraging Lying."
      *   Conclusion: "Boo Encouraging Lying."
      *   In the game:
          *   Task 1: Signal attitude toward Act A.
          *   Task 2: Signal attitude toward Act B *conditional* on Act A.
          *   Task 3: Resolve.
      *   If the language forbids "If," they can't state Task 2. They try to state it as "Boo A. Boo B." But that just means they hate both independently. It doesn't capture the *link*.

  5.  **Refining the "Strawman" Warning:**
      *   Simple Expressivism (Boo/Hurrah) is dead. Gibbard, Blackburn, etc., have sophisticated accounts (norm-expressivism, quasi-realism).
      *   The game breaks *naive* expressivism.
      *   The debrief must clarify that real expressivists don't speak the toy language. They have logic for attitudes.
      *   The game shows *why* they needed to build that sophisticated machinery.

  6.  **Addressing Predicted Pitfalls:**
      *   *Smuggling:* Students will say "If" anyway. *Fix:* Penalty points or "Grammatical Violation" card.
      *   *Collapse:* They just negotiate in English. *Fix:* The "Translator" role (Instructor) rejects non-compliant contracts.
      *   *Time:* 90 mins is tight. *Fix:* Strict timers. Phase 1 (15), Phase 2 (30), Phase 3 (30), Debrief (15).

  7.  **Finalizing the Design Details:**
      *   **Name:** "The Protocol Game."
      *   **Materials:** Deck of cards (Red/Black), Token sheets, "Grammar Cards" (Allowed words), Contract Slips.
      *   **Groups:** 6 Pairs (12 students).
      *   **Phases:**
          1.  *Assertion:* Express attitude toward Red/Black. (Easy).
          2.  *Commitment:* Create a rule for the future draw using *only* Grammar Cards. (Hard/Impossible).
          3.  *Adjudication:* Two pairs swap contracts. One pair claims the contract binds them; the other claims it doesn't, despite identical atomic signals.

      *   *Wait, the Prompt asks for specific moments where limits hit.*
      *   Limit 1: Negation. "It is not the case that we Boo Red." (How to express tolerance without Yay?)
      *   Limit 2: Conditionals. "If we Boo Red, then we Pay."
      *   Limit 3: Validity. Agreeing on atoms but disagreeing on the inference.

      *   *Let's tighten the Phase 3 Dispute.*
      *   Pair 1 and Pair 2 both sign the same slip: "Boo Red. Pay 10."
      *   Red is drawn.
      *   Pair 1 pays. Pair 2 refuses.
      *   Pair 2 says: "We said 'Boo Red' (expression of feeling). We did not say 'If Red, Pay'."
      *   Pair 1 says: "The context implied the rule!"
      *   Instructor: "The context is not in the language."
      *   This highlights the *embedding* issue. The meaning of "Boo Red" changed from an expression to a condition.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Payoff:* Make sure the points make the embedding *necessary*. If they can just say "I promise to pay," they bypass the attitude language.
      *   *Constraint:* The "Policy" must be justified *solely* by the Attitudinal Signals. The Points are awarded for "Consistency."
      *   *Better:* The "Legislative" Model.
      *   You gain points for "Coherent Statutes."
      *   Statute 1: "Boo Theft." (Atomic)
      *   Statute 2: "If Boo Theft, then Boo Handling Stolen Goods." (Embedded)
      *   If you can't write Statute 2, you lose points for incoherence when the case arises.

      *   *Okay, let's go with the "Insurance Contract" idea.* It's more concrete for a game.
      *   You want insurance against a "Bad" event.
      *   "Bad" is defined by your Attitude.
      *   But you can't define the contract conditionally.
      *   Okay, I have a solid plan. I will structure the response exactly as requested.

  9.  **Addressing the "Strawman" Constraint:**
      *   Must explicitly state: This game defeats *Simple* Expressivism. It does not defeat *Quasi-Realism* or *Norm-Expressivism* (Gibbard/Blackburn) which build logic *into* the attitudes.
      *   The game demonstrates the *motivation* for those sophisticated theories, not the falsity of the expressivist project.

  10. **Final Review against constraints:**
      *   12 students, 90 mins.
      *   Materials, setup, rules, phases, payoff.
      *   Specific moments of failure.
      *   Debrief mapping to Frege-Geach.
      *   Predicted pitfalls.
      *   Limitations/Strawman warning.
      *   One line summary.

      *(Self-Correction during drafting)*: Ensure the "Attitudinal Vocabulary" is clearly distinct from "Descriptive."
      *   Descriptive: "State A", "State B".
      *   Attitudinal: "Op!", "Ack!" (Made up words prevent smuggling associations).
      *   Let's use "Yuck" and "Yay" for clarity, but ban logical connectives.

      *(Refining Phase 3)*: The dispute needs to be about *validity*.
      *   Student A: "You agreed to Yuck State A. State A obtained. Therefore you must Pay."
      *   Student B: "I Yucked State A *then*. I am not Yucking it *now* as a condition for payment. My Yuck was a feeling, not a premise."
      *   This perfectly mirrors "Boo lying" vs "If lying is wrong..."

      *(Timing)*: 90 mins is very short for a game + debrief.
      *   Intro/Rules: 10 min.
      *   Phase 1: 15 min.
      *   Phase 2: 25 min.
      *   Phase 3: 20 min.
      *   Debrief: 20 min.
      *   Total: 90 min. Tight but doable.

      *(Payoff)*: Points need to matter. "Course Credit" is too heavy. "Chocolate" or "Privilege" (e.g., pick the topic for next week). Let's use "Seminar Influence Points" (SIPs) redeemable for minor course perks.

      *(Pitfalls)*: Students are smart. They will try to define "If" using "Yuck". E.g., "Yuck (State A implies Payment)."
      *   Counter: Ban parentheses or complex objects of attitude. Attitude must be toward a simple State.

      *Okay, ready to write.*
answer: |-
  # Seminar Design: The Protocol Game (Frege–Geach Live)

  **Course:** Upper-Level Metaethics Seminar
  **Time:** 90 Minutes
  **Students:** 12 (Split into 6 Pairs)
  **Goal:** Induce the Frege–Geach problem through practical failure of a restricted language.

  ## 1. Materials & Setup

  **The Vocabulary (Printed on Cards):**
  *   **Descriptive Cards (Facts):** `[STATE RED]`, `[STATE BLACK]`. (Representing a card draw).
  *   **Attitudinal Cards (Values):** `[YAY]`, `[YUCK]`. (Representing moral approval/disapproval).
  *   **Action Cards:** `[PAY 10]`, `[KEEP 10]`.
  *   **Forbidden:** No logical connectives (IF, THEN, NOT, OR, AND). No punctuation indicating scope (parentheses).

  **The Economy:**
  *   Each student starts with **100 Seminar Influence Points (SIPs)**.
  *   SIPs can be redeemed for minor course perks (e.g., choosing a reading, extending a deadline by 24 hours).
  *   **The Pot:** A central bank holds bonus SIPs.

  **The Physical Setup:**
  *   6 tables, 2 students per table (Pairs A–F).
  *   Each pair gets a "Contract Slip" (a small piece of paper) and a deck of Vocabulary Cards.
  *   A deck of playing cards (Red/Black suits only) sits with the instructor.

  ## 2. Rules & Sequence

  ### Phase 1: Atomic Assertion (15 Minutes)
  **Task:** Pairs must coordinate a stance on `[STATE RED]`.
  **Rule:** To secure a **5 SIP bonus**, both partners must play the same Attitudinal Card (`[YAY]` or `[YUCK]`) facing `[STATE RED]`.
  **Outcome:** Trivial. Pairs quickly agree (e.g., `[YUCK] [STATE RED]`). They feel the language is sufficient for expressing values.
  **Instructor Note:** Collect the Contract Slips. They should read simply: `YUCK STATE RED`.

  ### Phase 2: The Contingency (30 Minutes)
  **Task:** Pairs must draft a **Standing Policy** for a future event.
  **Scenario:** "In 20 minutes, I will draw a card. If the card is Red, you will lose 20 SIPs *unless* you have a ratified policy that triggers a payout."
  **Constraint:** The policy must be written *only* using the Vocabulary Cards. You cannot use English words like "If" or "When."
  **Payoff:** If the policy is valid and the card is Red, the Bank pays 20 SIPs (neutralizing the loss). If the policy is invalid, you take the loss.
  **The Trap:** To get the payout, the policy must link the *State* to the *Payment* via the *Attitude*.
  **Expected Failure:** Students will try to write: `[YUCK] [STATE RED] [PAY 10]`.
  **The Problem:** This string is ambiguous. Does it mean "We Yuck Red, and separately we Pay 10"? Or "If we Yuck Red, then Pay 10"? The vocabulary lacks the *embedding* mechanism to distinguish a current expression of feeling from a conditional rule.

  ### Phase 3: The Adjudication Dispute (20 Minutes)
  **Task:** Swap Contract Slips. Pair A judges Pair B's contract; Pair B judges Pair A's.
  **Scenario:** The Instructor draws a **Red** card.
  **Conflict:**
  *   **Pair A (Claimant):** "We wrote `YUCK STATE RED`. We Yuck Red. Red occurred. Therefore, Pay Us." (Treating the attitude as a truth-apt premise).
  *   **Pair B (Judge):** "You expressed a feeling *then*. You are not expressing a feeling *now* that binds us. Your slip has no 'IF'. It is just a record of a noise you made. No Pay."
  *   **Crucial Condition:** Ensure at least one pair (seeded by you if necessary) agrees on all atomic claims (both Yuck Red) but disagrees on whether the *inference* holds.
  **Payoff:** If the Judge refuses payment, the Claimant loses 20 SIPs. If the Judge pays, the Bank loses 20 SIPs (social cost).
  **Goal:** Force the realization that `YUCK STATE RED` means something different when asserted (Phase 1) than when embedded in a policy (Phase 2).

  ### Phase 4: Debrief (25 Minutes)
  *(See Section 4 below)*

  ## 3. Specific Failure Points & Timing

  | Time | Moment | The Limit Hit | Philosophical Correspondence |
  | :--- | :--- | :--- | :--- |
  | **0:20** | End of Phase 1 | **None.** Language works for atomic assertions. | Expressivism handles asserted moral claims ("Lying is wrong"). |
  | **0:45** | Mid Phase 2 | **Embedding.** Students try to make a rule but can't distinguish "Feeling X" from "Condition X". | The "If" problem. Expressivism struggles with unasserted contexts (antecedents). |
  | **1:05** | End of Phase 3 | **Validity.** Pairs agree on atoms but disagree on the *link*. | Modus Ponens failure. Equivocation on the meaning of the moral term. |

  **Timing Note:** Be ruthless. Use a visible timer. When Phase 2 ends, collect all slips immediately. Do not allow verbal clarification. The ambiguity *is* the data.

  ## 4. Debrief: Naming the Problem

  **Step 1: The Reveal (5 mins)**
  Ask the class: "Why did Pair B refuse to pay Pair A, even though both agreed `YUCK STATE RED`?"
  Elicit: "Because `YUCK` on the paper wasn't a rule, it was just a report of a feeling."
  Write on board: **Assertion vs. Embedding.**
  Name the problem: **The Frege–Geach Problem.**

  **Step 2: Mapping the Game to the Text (10 mins)**
  *   **Game:** `YUCK STATE RED` (Phase 1) = **Asserted Moral Claim** ("Lying is wrong").
  *   **Game:** `YUCK STATE RED` (Phase 2 Policy) = **Embedded Moral Claim** ("If lying is wrong...").
  *   **Game:** The Judge's Refusal = **The Logic Gap.** If "Yuck" is just a boo, it can't serve as a premise in a conditional.
  *   **Game:** The Loss of SIPs = **The Cost of Invalidity.** If moral arguments can't be valid, moral reasoning collapses.

  **Step 3: The Expressivist Debt (10 mins)**
  Explain that the game defeated *Naive* Expressivism (Boo/Hurrah).
  Ask: "How could a sophisticated expressivist fix this game?"
  *   *Hint:* They need a logic of attitudes. (Mention Gibbard's norm-expressivism or Blackburn's quasi-realism).
  *   *Point:* The expressivist owes an account of how an attitude can play the *role* of a proposition without *being* a proposition.

  ## 5. Predicted Pitfalls & Mitigations

  **1. Smuggling Descriptive Language**
  *   *Risk:* Students write "IF RED" on the slip using pen, ignoring cards.
  *   *Fix:* **The Grammar Police.** Appoint two students (rotating) as "Grammarians." Their only job is to veto any slip containing English logical connectives. Penalty: 10 SIP fine.
  *   *Risk:* Students define "Yuck" as "If Red."
  *   *Fix:* Pre-game definition. "Yuck" is defined as a *current emotional expression*, not a logical operator.

  **2. Phase 2 Collapses into Negotiation**
  *   *Risk:* Students ignore the cards and just promise verbally. "Don't worry, I'll pay you."
  *   *Fix:* **The Black Box.** Tell them: "I am a robot. I only read the Cards. Verbal promises are null." This forces reliance on the restricted syntax.

  **3. The Dispute Runs Long**
  *   *Risk:* Pairs argue about fairness rather than syntax.
  *   *Fix:* **Adjudication Constraint.** Judges must justify their ruling *only* by pointing to the Vocabulary Cards. "It feels unfair" is not a valid ruling. "There is no IF card" is valid.

  ## 6. Limitations: The Strawman Warning

  You must explicitly tell the students: **"This game proves Naive Expressivism is false. It does not prove Expressivism is dead."**

  *   **What the Game Misses:** Real expressivists (Blackburn, Gibbard, Schroeder) do not speak the toy language. They acknowledge that moral sentences *function* logically like assertions. They build "logic-mimicking" machinery into the attitudes (e.g., being for something is a higher-order attitude that respects logical consistency).
  *   **The Strawman:** If you present this game as "Refuting Expressivism," you are attacking a position no serious philosopher holds (Simple Emotivism).
  *   **The Truth:** The game demonstrates the *motivation* for Quasi-Realism. It shows *why* expressivists had to work so hard to earn the right to use logical connectives. The problem isn't that expressivism is impossible; it's that it requires complex scaffolding to explain why "If lying is wrong..." isn't gibberish.

  Summary: This 90-minute seminar game forces students to experience the Frege-Geach problem by attempting to draft conditional policies in a language that permits only atomic attitude expressions, revealing the logical gap between asserting a value and embedding it in an inference.
