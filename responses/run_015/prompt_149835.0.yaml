answer: |-
  ### 1. Exam Question

  **Question 4 (25 Marks)**

  Let $N = \{1, \dots, n\}$ be a set of voters ($n \ge 2$) and $X$ be a set of alternatives ($|X| \ge 3$). Each voter $i \in N$ has a preference ordering $P_i$ over $X$ which is complete, transitive, and antisymmetric (strict ordering). A **Social Decision Function (SDF)** maps every profile of individual orderings $(P_1, \dots, P_n)$ to a social relation $R$ on $X$. Let $P$ and $I$ denote the strict and indifferent parts of $R$ respectively (i.e., $x P y \iff x R y \text{ and not } y R x$; $x I y \iff x R y \text{ and } y R x$).

  We impose the following conditions:
  1.  **Unrestricted Domain (UD):** The SDF is defined for all logical profiles of strict individual orderings.
  2.  **Weak Pareto (WP):** If $x P_i y$ for all $i \in N$, then $x P y$.
  3.  **Independence of Irrelevant Alternatives (IIA):** For any $x, y \in X$, the social relation between $x$ and $y$ depends only on the individual preferences between $x$ and $y$.
  4.  **Quasi-Transitivity:** The social strict relation $P$ is transitive (if $x P y$ and $y P z$, then $x P z$). Note: $R$ must be complete, but $I$ need not be transitive.

  **(a)** Consider a fixed non-empty subset of voters $M \subseteq N$ (an "oligarchy"). Define the rule $f_M$ as follows: $x P y$ if and only if $x P_i y$ for all $i \in M$; otherwise $x I y$.
  Verify whether $f_M$ satisfies UD, WP, IIA, and Quasi-Transitivity. Does it satisfy full Transitivity of $R$? [10 marks]

  **(b)** A student proposes modifying $f_M$ to restore full transitivity. They suggest adding a fixed strict ordering $>$ over $X$ as a tie-breaker: $x R' y$ if ($x P y$ under $f_M$) OR ($x I y$ under $f_M$ AND $x > y$).
  Does this new rule $R'$ satisfy IIA? Does it satisfy full Transitivity? Justify your answer with a specific counter-example if it fails. [10 marks]

  **(c)** If we additionally require **Anonymity** (the rule treats all voters symmetrically), what must the set $M$ be in part (a)? Briefly explain what this implies for the existence of maximal elements in finite choice sets under the resulting rule. [5 marks]

  ***

  ### 2. Model Answer

  **(a) Verification of the Oligarchy Rule**
  The rule $f_M$ is well-defined for all profiles, satisfying **UD**.
  **WP:** If $x P_i y$ for all $i \in N$, then since $M \subseteq N$ is non-empty, $x P_i y$ for all $i \in M$. By definition of $f_M$, $x P y$. Satisfied.
  **IIA:** The condition "$x P_i y$ for all $i \in M$" depends only on individual rankings of $x$ and $y$. Thus, the social ranking of $x, y$ is independent of other alternatives. Satisfied.
  **Quasi-Transitivity:** Suppose $x P y$ and $y P z$. By definition, $\forall i \in M, x P_i y$ and $\forall i \in M, y P_i z$. Since individual $P_i$ are transitive, $\forall i \in M, x P_i z$. Thus $x P z$. Satisfied.
  **Full Transitivity:** $f_M$ fails full transitivity if $M \neq N$. Let $M = \{1\}$, $N=\{1,2\}$. Suppose $1: x \succ y \succ z$ and $2: z \succ x \succ y$.
  $x, y$: Voter 1 prefers $x$, Voter 2 prefers $y$. Not unanimous in $M$. So $x I y$.
  $y, z$: Voter 1 prefers $y$, Voter 2 prefers $z$. Not unanimous in $M$. So $y I z$.
  $x, z$: Voter 1 prefers $x$, Voter 2 prefers $z$. Not unanimous in $M$. So $x I z$.
  Here $I$ is transitive. We need a failure.
  Let $M=\{1, 2\}$. Profile: $1: x \succ y \succ z$, $2: y \succ z \succ x$.
  $x, y$: $1$ prefers $x$, $2$ prefers $y$. $x I y$.
  $y, z$: $1$ prefers $y$, $2$ prefers $z$. $y I z$.
  $x, z$: $1$ prefers $x$, $2$ prefers $z$. $x I z$.
  Still transitive indifference.
  To break transitivity of $R$, we need $x I y, y I z$ but $x P z$ (or $z P x$).
  Let $M=\{1, 2\}$. Profile: $1: x \succ y \succ z$, $2: z \succ x \succ y$.
  $x, y$: $1 (x), 2 (x)$. Unanimous. $x P y$.
  $y, z$: $1 (y), 2 (z)$. Split. $y I z$.
  $x, z$: $1 (x), 2 (z)$. Split. $x I z$.
  Here $x P y, y I z \implies x P z$ is required for transitivity of $P$ (holds) but $R$ transitivity requires $x I z$ to imply consistency.
  Actually, standard failure: $x I y, y I z \implies x I z$.
  Let $M=\{1, 2\}$. Profile: $1: x \succ y \succ z$, $2: y \succ z \succ x$.
  $x, y$: Split ($x, y$). $x I y$.
  $y, z$: Split ($y, z$). $y I z$.
  $x, z$: Split ($x, z$). $x I z$.
  This rule generates intransitive indifference only if we have cycles in unanimity, which is impossible with strict individual orders.
  *Correction:* The prompt asks if it satisfies full transitivity. The rule defines $I$ as the negation of strict unanimity.
  If $x I y$ (not unanimous $x$, not unanimous $y$) and $y I z$.
  Does $x I z$? Not necessarily.
  Example: $M=\{1, 2\}$.
  $1: x \succ y \succ z$.
  $2: z \succ x \succ y$.
  Pair $x, y$: $1$ prefers $x$, $2$ prefers $x$ (since $x \succ y$ in $2$'s order $z \succ x \succ y$). Wait, $2$ prefers $x$ to $y$. So $x P y$.
  Pair $y, z$: $1$ prefers $y$, $2$ prefers $z$. Split. $y I z$.
  Pair $x, z$: $1$ prefers $x$, $2$ prefers $z$. Split. $x I z$.
  Here $x P y, y I z, x I z$. Consistent.
