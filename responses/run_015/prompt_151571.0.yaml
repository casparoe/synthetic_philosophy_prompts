answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], and I'm lucky enough to be her kid.

  I'm not much of a speechmaker, so I'm going to keep this real. We've got a room full of two different groups tonight. Half of you are clinicians and county folks who know exactly what my mom did at the Eastside Center. The other half are family and neighbors who mostly know that she worked a lot of hours and came home smelling like bleach and stale coffee.

  But honestly? Those two things are the same thing.

  For thirty-two years, Mom ran a crisis center. And if you ask most people what a crisis center is supposed to do, they'll say it's about giving people choices. Giving them freedom.

  Mom didn't buy that. Not entirely.

  She used to talk about this story from some old Russian novel—something about a Grand Inquisitor. I never read the book, but I heard the lesson enough times at the dinner table. The idea is that when people are scared, hungry, or broken, they don't actually want freedom. Freedom is heavy. When you're in freefall, you don't want a menu; you want a hand. You want someone to tell you where the bed is, when the meal is coming, and that you're safe.

  Mom believed that. She believed that when someone walks through her doors in the middle of a breakdown, they don't want liberty. They want relief. They want structure.

  Now, here's where the clinicians in the room know exactly what I'm talking about. The easy way to give someone structure is to take away their choice. You lock the door. You mandate the meds. You take the grant money that requires you to run a tight ship where everyone follows the rules or gets kicked out.

  Mom turned that money down. A lot of it.

  She'd say she wanted to offer the Inquisitor's kindness without the Inquisitor's prison.

  That sounds nice in a speech, but in real life, it was exhausting. It meant keeping the doors unlocked even when it was risky. It meant convincing someone to stay when every instinct said to just make them stay. It meant building a structure so solid, so warm, that people *chose* to walk into it, even when they could walk away.

  To the family side of the room: I know you saw her come home tired. You saw the bleach on her hands and the worry in her eyes. You might have wondered why she didn't take the easier path, why she didn't just follow the county's standard playbook that came with bigger checks and fewer headaches.

  It's because she knew that if you lock the door to keep people safe, you break the one thing that actually heals them: trust.

  She lived in that tension every single day. She knew people wanted to be told what to do, but she refused to be the one telling them. She cleared the path, she lit the lights, she made the coffee, but she never forced anyone to walk it.

  That's why the clinicians respect her. You know how hard it is to run a unit where safety isn't enforced by locks, but by relationships. You know the grants we lost because she wouldn't sign off on coercion. You know the nights she stayed late because a patient needed to hear that they could leave, but she hoped they'd stay.

  And that's why the rest of us love her. Because she treated people in their worst moments with the same respect she'd want for herself. She didn't see patients as problems to be managed. She saw them as people who were tired of carrying the weight of their own freedom for a little while.

  So, when you smell bleach on her coat, that's the smell of trying to keep a place clean without making it sterile. When you smell the coffee, that's the smell of trying to keep people awake and present without forcing them to be.

  She spent thirty-two years proving that you can give people the structure they crave without taking away the dignity they need. She was the authority figure who refused to use authority.

  I'd like to raise a glass to Mom. Thank you for showing us that safety doesn't have to mean captivity, and that sometimes the strongest thing you can do is leave the door unlocked.

  To Mom.
