answer: |-
  You have correctly identified that your dad is running a **Motte-and-Bailey doctrine**. He is retreating to a defensible, trivial claim when challenged, but advancing a strong, controversial claim to do the actual work of shutting down the argument.

  The phrase "he was a man of his time" is not a single argument; it is a container for at least six distinct logical claims. Some are trivially true, some are empirically false, and some are morally incoherent. None of them successfully bridge the gap to "keep the name on the school."

  Here is the menu of claims, evaluated against your tests.

  ### The Menu of Claims

  #### 1. The Statistical Claim (Descriptive Normalcy)
  *   **The Claim:** "His views were the statistical majority view of his peer group."
  *   **Truth Value:** **Often False.** (As you noted, abolitionists existed in Jefferson's time; critics of empire existed in Churchill's).
  *   **Verdict:** This is the "everyone did it" defense. It relies on the descriptive claim being true. If there were prominent contemporaries dissenting, this claim collapses.
  *   **Test Results:**
      *   **Descriptive Truth:** **Fails.** In all three cases (Jefferson, Churchill, Columbus), there were contemporaneous voices arguing against their specific harms.
      *   **Asymmetry:** **Fails.** If we excuse the majority for following the herd, we must excuse the minority for following *their* herd (e.g., religious zealots). But we don't.

  #### 2. The Epistemic Claim (Culpable Ignorance)
  *   **The Claim:** "He lacked access to the information or moral concepts required to know better."
  *   **Truth Value:** **Variable.** Strong for Columbus (1400s human rights framework didn't exist); weak for Jefferson (Enlightenment ethics explicitly discussed liberty); very weak for Churchill (anti-colonial movements were active).
  *   **Verdict:** This excuses the actor based on limited cognitive tools.
  *   **Test Results:**
      *   **Forward Test:** **Survives, but at a cost.** If you accept this, you admit future generations will excuse us for things we "can't know" yet (e.g., AI rights, environmental thresholds). Your dad accepted this, but it undermines the permanence of the judgment. It means the school name is valid *now* but might be invalid in 2125. That doesn't settle the question; it just delays it.
      *   **Asymmetry:** **Fails.** We praise people who *found* the information despite their environment (e.g., early feminists). If environment dictates knowledge, their insight was just as determined as the bigot's ignorance.

  #### 3. The Deterministic Claim (Causal Inevitability)
  *   **The Claim:** "His environment causally determined his beliefs; he had no free will to choose otherwise."
  *   **Truth Value:** **Metaphysically Debatable / Practically Useless.**
  *   **Verdict:** If true, this removes all blame, but it also removes all agency.
  *   **Test Results:**
      *   **Symmetry Test:** **Kills it.** As you pointed out, if environment determines belief, it determines courage too. If Churchill was determined to be imperialist, the soldier was determined to be brave. You cannot selectively apply determinism only to the vices you want to excuse. Your dad's admission that "courage is courage" refutes this reading.
      *   **Asymmetry Test:** **Kills it.** We praise those "ahead of their time." If determinism holds, being "ahead" is just a different causal input, not a moral achievement.

  #### 4. The Relativist Claim (Normative Shift)
  *   **The Claim:** "The act was not morally wrong *then*, only wrong *now*."
  *   **Truth Value:** **False.** (Slavery was a moral evil in 1776; genocide was a moral evil in 1492).
  *   **Verdict:** This claims morality itself changes, not just our knowledge of it.
  *   **Test Results:**
      *   **Forward Test:** **Kills it.** If morality shifts, then our current condemnation of them is just "our time's opinion," which will be overturned later. This leads to moral nihilism.
      *   **Three-Target:** **Fails.** Even if the *act* wasn't viewed as wrong then, the *harm* was real. A school name honors the person. If the person inflicted real harm, the relativist claim doesn't erase the harm, it just erases the contemporary label.

  #### 5. The Proportionality Claim (Weighting)
  *   **The Claim:** "His good works outweigh his bad works."
  *   **Truth Value:** **Subjective.**
  *   **Verdict:** This isn't actually "Man of His Time," but it's often what people mean. It shifts from "he isn't blameworthy" to "he is net positive."
  *   **Test Results:**
      *   **Three-Target:** **Survives Blame, Fails Honor.** This addresses the "soul" question (Verdict 2), but not the "building" question (Verdict 3). You can be net positive and still be a bad mascot for a specific institution (e.g., a school named after a slaveholder in a majority-Black district).
      *   **Asymmetry:** **Survives.** We can weigh good and bad without logical contradiction.

  #### 6. The Commemorative Claim (Pragmatic Utility)
  *   **The Claim:** "The name serves a current function (inspiration, tradition) that is independent of his moral perfection."
  *   **Truth Value:** **Empirically Testable.**
  *   **Verdict:** This is the only claim relevant to the school name.
  *   **Test Results:**
      *   **Three-Target:** **Survives.** It bypasses the moral judgment entirely.
      *   **Forward Test:** **Survives.** Traditions can persist even if values shift, provided they don't cause active harm.
      *   **Catch:** This requires proving the name *does* good. If the name causes alienation (harm), the utility argument fails.

  ---

  ### Diagnosis: What Your Dad Was Doing

  Your dad was sliding between **Claim 1 (Statistical)**, **Claim 2 (Epistemic)**, and **Claim 4 (Relativist)** depending on which one was least vulnerable in the moment.

  1.  **Jefferson ("Everyone did it"):** He used **Claim 1**.
      *   *Why:* It's the easiest sell.
      *   *Weakness:* It is empirically false. There were Virginia slaveholders who freed their slaves upon death; there were Northern abolitionists. Jefferson made a *choice* to prioritize his lifestyle over his stated philosophy.
      *   *Does it get him to "Drop it"?* **No.** Even if everyone did it, it doesn't mean we should honor them for it.

  2.  **Churchill ("That's how the empire talked"):** He used **Claim 2 (Epistemic)**.
      *   *Why:* Churchill's racism is well-documented, so "everyone did it" is harder to swallow. Framing it as "cultural language" suggests he didn't *mean* the harm.
      *   *Weakness:* Churchill knew exactly what he was doing to India during the Bengal famine. It wasn't just talk; it was policy.
      *   *Does it get him to "Drop it"?* **No.** Policy decisions have consequences regardless of the rhetorical framing of the era.

  3.  **Columbus ("Can't hold to 2020 standards"):** He used **Claim 4 (Relativist)**.
      *   *Why:* 1492 is too far back for "Epistemic" limits on violence to feel relevant. He had to argue that morality itself was different.
      *   *Weakness:* Bartolomé de las Casas was alive *at the same time* arguing Columbus was a tyrant. The moral standard existed; Columbus failed it.
      *   *Does it get him to "Drop it"?* **No.** If the moral standard existed then, he was a criminal then, not just by our standards.

  ### The School Name Verdict

  Your hunch on the **Three-Target Test** is the winning argument. The sentence "He was a man of his time" is a defense against **Blame** (Target 2), but the school name is a question of **Honor** (Target 3).

  Here is the logic you need to bring back to the table:

  1.  **Concede the Blame Point (Tactically):** "Okay, Dad. Let's assume 'Man of His Time' works. Let's assume Jefferson isn't *sinning* in hell right now because of 1776 norms. That settles Target 2 (His Soul)."
  2.  **Pivot to Honor:** "But we aren't judging his soul. We are judging the **utility of the symbol**. A school name is not a verdict on whether the person is damned; it is a signal of who we want students to emulate."
  3.  **Apply the Asymmetry:** "If we use 'Man of His Time' to excuse the bad, we have to ask if we use 'Man of His Time' to limit the good. Do we tell students, 'Jefferson is a hero, but only for 1776'? That makes him a bad hero for 2024."
  4.  **The Forward Test for Schools:** "A school is forward-looking. If we keep the name, we are betting that Jefferson's 'time' aligns with our students' future. If his 'time' included owning humans, and our 'time' prohibits that, the name creates friction, not inspiration."
  5.  **The Kill Shot:** "'Man of His Time' explains why he did it. It does not explain why we should keep his name on it. Explanation is not Endorsement."

  **Summary:** Your dad's argument settles the question of Jefferson's *guilt*, but it is logically inert regarding the school's *branding*. You can forgive a man for being a man of his time and still decide he is the wrong face for a modern institution. The phrase "drop it" only follows if you conflate "forgiveness" with "honor." They are not the same thing.
