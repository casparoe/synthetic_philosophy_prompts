      *   **The Organizer vs. Voter Distinction:** This is crucial. A single voter has low probability of being pivotal. An organizer shifts the probability distribution of the total vote count. Their impact is the marginal increase in votes caused by their campaigning, not just their own tick.
      *   **The Supply Chain/Batching Issue:** This addresses "impact leakage." If beef isn't bought here, is it bought elsewhere? If the caterer reduces total orders across clients based on aggregate demand, there is impact. If they just shift stock, impact is lower. However, contracts signal long-term demand. Renewing a contract on a lower-carbon basis sets a precedent and changes baseline ordering logic for future cycles, not just immediate batch allocation.
      *   **The Sustainability Report Issue:** This is about signaling vs. measured impact. Just because internal accounting ignores it doesn't mean the physical carbon reduction doesn't happen.
