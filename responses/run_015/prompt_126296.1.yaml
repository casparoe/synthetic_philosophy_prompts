answer: |-
  The clipboard rested on the counter. The laminated card smelled of antiseptic and old coffee. The box beside Item 14 was blank.

  Ada Reinholt stood in the consultation room, the air conditioning humming a low, sterile note against the silence of the hallway. Outside, the hospital moved in its perpetual rush, but in here, time was measured in the slow blink of the patient's daughter and the tapped rhythm of the son's foot against the linoleum. Ada had twenty years of these rooms behind her, twenty years of translating grief into checkboxes, but Item 14 always stopped her. It was the last question on the values-history form, printed in a font slightly smaller than the rest, as if the hospital were afraid of shouting it.

  *Would you consent to live this same life again, without end, every particular included?*

  Ruth Vance lay three floors up, locked in a unit where the doors required a code to open. She was eighty-two, three years into a dementia that had stripped her of syntax and then of recognition. Now she was unable to swallow. The feeding tube was the pivot point. The form was the mechanism. The answer was the key.

  Ellen, the daughter, sat with her hands folded in her lap. She wore a cardigan that had been washed too many times, the fabric pilled at the elbows. She came every day. Ada knew this from the logs. Ellen spoke softly, as if volume might disturb the air around her mother's name.

  "She was generous," Ellen said. "If you asked her if she wanted to do something, she said yes. If you asked if she was in pain, she said no. She was like that. She would want to be here. She would say yes to the tube."

  Mark, the son, sat opposite. He had flown in from Chicago, his suit wrinkled from the plane. He hadn't been here in six months. He looked at the form, then at his sister, then at Ada.

  "She doesn't know where here is," Mark said. "She doesn't know who we are. You're asking us to say she would choose this. But she isn't choosing. We are."

  "We know what she was like," Ellen said. Her voice didn't rise. It was a statement of fact, solidified by three years of daily visits. "She valued being present. Even if it's hard."

  "It's not being present," Mark said. "It's existing. There's a difference. Nobody would want three more years of this. Not if they knew what it was. Answering for her is how the rest of us get comforted. Not her."

  Ada watched them. This was the collision. Ellen spoke to the second question: whether it was good that Ruth's life happened, given what it did for the people around her. Her mother's generosity was a legacy; continuing it honored that shape. Mark spoke to the first question: whether the life was good for the person living it. The confusion, the locked unit, the inability to swallow—these were particulars that offered no subjective welfare.

  Ada looked down at the form. The ink on the page was sharp, black against the white stock, except for one place. On the word "included," the pen had skipped during printing. A tiny gap broke the loop of the *e*. It was a flaw in the general shape of the text, a particular accident of the press. The question demanded *every* particular, yet the question itself was imperfectly rendered. Ada traced the gap with her thumbnail.

  "If she lives it again," Mark said, leaning forward, "she doesn't know it's again. She thinks every day is the first day. She wakes up confused. She eats the tube food. She sleeps. If she says yes, she's saying yes to the confusion. But she won't know she's repeating it. She'll just suffer it anew. How can you will something you don't know is a repetition?"

  Ellen shook her head. "It doesn't matter if she knows. It matters that she's here. That we're here."

  "It matters to you," Mark said.

  "It matters to her memory."

  Ada listened. The ignorance of the repetition was the hinge. The surrogate knew the history; the lived life did not. To will the life was to will the ignorance. To will the suffering without the context that made it bearable to the observer.

  Ada remembered her own form. Twenty years ago, residency wellness session. A junior attending had passed them out with a box of donuts. *Would you consent to live this same life again?* She had written *Yes*. But she had taken her pen and carved out a stretch of time. She had drawn a line through *the winter of '98*. She didn't know why then. Now she knew. It was the season of the code blues on 4 West. Three patients in two months. She had done everything right, and they had died anyway. She had willed the life, but not the helplessness.

  That winter had come around again. Not the weather, but the feeling. The tube in Ruth's stomach was the same helplessness. The children arguing over the meaning of Ruth's existence was the same helplessness. Ada could not cut this winter out. It was here, in the room, in the smell of the coffee stain on the laminate counter, in the hairline crack running through the surface beneath her left hand. The crack was a particular flaw in the general smoothness of the institution. It was there every day. She had never filed a work order to fix it. She had willed the counter with the crack.

  Could she will the world that produced Ruth Vance?

  If she checked the box, she affirmed that a world where Ruth suffered this way was a world she could say yes to. She affirmed Ellen's view that the relational value outweighed the subjective cost. If she left it blank, she refused the affirmation. If she struck it, she denied the world.

  Mark was right that Ruth wouldn't know. Ellen was right that Ruth's presence mattered. Ada was the one who had to file the paper. The question was rigged because it asked for a cosmic yes from a position of administrative necessity. It asked her to judge the world while holding a pen that skipped on the letter *e*.

  "She was like that," Ellen said again. "She would say yes."

  "She can't say anything," Mark said. "That's the point."

  Ada looked at the box. It was a small square, printed in black. It waited.

  She thought of the crack in the laminate. She thought of the winter of '98. She thought of the gap in the *e*. The particular flaws were not accidents; they were the material. To will the life was to will the crack. To will the tube. To will the daughter's pilled cardigan and the son's wrinkled suit. To will the ignorance of the repetition.

  She could not will the suffering. She could not say yes to a world that required Ruth Vance to be broken so Ellen Vance could be devoted. But she could not say no to the devotion. So the only question left was the world itself.

  Ada moved her hand. The pen hovered. The ink skipped on the paper as she began the motion, a tiny break in the line, a particular failure in the general act. She did not check the box. To check it was to lie. To leave it blank was to defer. She drew a single line through the question itself. Not the box. The question. She struck through Item 14.

  She capped the pen. The click sounded loud in the room. Ellen stopped speaking. Mark stopped tapping his foot. They looked at the form, then at Ada. Ada did not explain. There was no explanation that would not turn into a verdict about who was right. There was only the paper.

  She slid the clipboard toward the edge of the counter. The hairline crack in the laminate ran beneath the form, invisible now under the paper. The smell of antiseptic and old coffee hung in the air.

  The clipboard rested on the counter. The laminated card smelled of antiseptic and old coffee. The box beside Item 14 was crossed.
