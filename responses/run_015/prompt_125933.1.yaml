answer: |-
  This configuration is a known foundational problem in Bayesian epistemology and probabilistic logic, though it lacks a single, universally standardized name. In the literature, it is most commonly referred to as **The Problem of Uncertain Conditional Evidence** or **Learning Conditional Information**.

  The specific tension you have identified—between updating on the material conditional versus updating on the conditional probability—is the central friction point in the work of **Igor Douven** (e.g., *"Learning Conditional Information,"* 2012) and **Richard Jeffrey** (on probability kinematics). It is also the practical manifestation of **David Lewis's Triviality Results**, which prove that you cannot consistently maintain that the probability of a conditional *is* the conditional probability ($P(A \to B) = P(B|A)$) while also adhering to standard boolean updating rules for all cases.

  Here is the carving you requested, separating the mathematical mechanics from the modeling decisions, and analyzing your four observations.

  ### 1. The Name and Nearest Concepts

  **The Name:**
  While no single term captures the entire configuration, the most precise label for the phenomenon is **Underdetermined Jeffrey Conditionalization on Conditionals**.

  **Nearest Established Concepts:**
  1.  **Jeffrey Conditionalization (Probability Kinematics):** This handles your "uncertain evidence" requirement. It allows you to update probabilities without becoming certain of any proposition.
      *   *Where it stops short:* It requires a **partition** of the possibility space and a stipulation of which probabilities in that partition are "rigid" (held fixed). Your problem is that the conditional message does not uniquely specify the partition or the rigidity conditions.
  2.  **Adams' Thesis:** The claim that the assertibility (or probability) of an indicative conditional equals the conditional probability ($P(A \to B) = P(B|A)$).
      *   *Where it stops short:* Lewis proved that if you accept Adams' Thesis, you cannot treat conditionals as standard propositions with truth values. This forces a choice: treat the message as a proposition (Material) or as a constraint on ratios (Conditional).
  3.  **The Material Conditional Interpretation:** Treats "If $D$ then $C$" as $\neg D \lor C$.
      *   *Where it stops short:* As you noticed, raising the probability of $\neg D \lor C$ inevitably lowers the probability of $D$ (unless $C$ was already certain). This is often counter-intuitive for causal or mechanistic models (why does hearing about customs reduce the risk of delay?).
  4.  **The Conditional Probability Interpretation:** Treats the message as direct evidence about the ratio $P(C|D)$.
      *   *Where it stops short:* It requires assuming that the evidence about the *cause* is independent of the *occurrence* of the event. This is a strong modeling assumption that isn't guaranteed by the message text.

  ### 2. Carving the Phenomenon: State vs. Parameter

  The divergence you observe is not a mathematical error; it is a **semantic ambiguity in the evidence source**. To resolve it, you must carve your models into two distinct types of updating targets.

  **Carving A: The Factive Update (Material)**
  *   **Interpretation:** The source is reporting on the **state of the world** (the specific shipment).
  *   **Mechanism:** The source has looked at the shipment's status. They are saying, "It is not the case that (Delayed AND Not-Customs)."
  *   **What is held fixed:** The relative probabilities of the scenarios where the message is true ($\neg D \lor C$).
  *   **Result:** $P(D)$ drops. The evidence rules out a specific way of being delayed, making delay *less likely* overall because one of its primary pathways is blocked.
  *   **Use Case:** Intelligence reports, tracking logs, witness testimony about specific events.

  **Carving B: The Parametric Update (Conditional)**
  *   **Interpretation:** The source is reporting on the **propensity or mechanism** (the customs process).
  *   **Mechanism:** The source is an expert on customs efficiency. They are saying, "When delays happen, they are usually customs-related."
  *   **What is held fixed:** The marginal probability of the antecedent $P(D)$. The evidence concerns the *dependency* between Delay and Customs, not the occurrence of Delay itself.
  *   **Result:** $P(D)$ stays fixed. $P(C|D)$ rises. The freed weight goes entirely to $D \land C$.
  *   **Use Case:** Reliability engineering, policy analysis, causal risk factors.

  **Actionable Rule:**
  In your risk models, you must tag conditional evidence with an **Evidential Locus**.
  *   If the Locus is **Token** (this specific shipment), use the Material Update (Carving A).
  *   If the Locus is **Type** (the shipping process), use the Conditional Update (Carving B).

  ### 3. Analysis of Your Four Observations

  Your observations are astute. Here is how they map to the theory:

  *   **Observation 1 (Underdetermination/Partition):**
      *   **Diagnosis:** This is the **Rigidity Problem** inherent to Jeffrey Conditionalization.
      *   **Status:** This is the root cause. The message provides a constraint ($P_{new}(\text{Message}) > P_{old}(\text{Message})$), but not a coordinate system. You cannot update without stipulating what is invariant.
      *   **Connection:** This travels with Obs 2.

  *   **Observation 2 (Order Dependence/Erasure):**
      *   **Diagnosis:** This is **Path Dependence** in Probability Kinematics.
      *   **Status:** Jeffrey updates do not commute. If you update $P(C|D)$ to 0.8, then receive a new report setting $P(C|D)$ to 0.8, the second overwrites the first because you are setting a *state variable*, not accumulating likelihoods.
      *   **Connection:** This is a direct consequence of Obs 1. Because the partition isn't fixed by the world, but by your stipulation, sequential stipulations interact non-linearly.

  *   **Observation 3 (Extremes Agree):**
      *   **Diagnosis:** **Continuity Constraint.**
      *   **Status:** All rational updating rules must converge at certainty (Standard Conditionalization) and at null evidence (Identity). The divergence in the middle is where the "prior geometry" matters.
      *   **Connection:** This is generic to all uncertain updating, not specific to conditionals.

  *   **Observation 4 (Nesting/Collapsing):**
      *   **Diagnosis:** **Import-Export Failure.**
      *   **Status:** This is distinct from the first three. It concerns the **logic of the conditional** itself, not just the updating rule. In probabilistic logic (Adams' logic), $(A \to (B \to C))$ is not equivalent to $((A \land B) \to C)$.
      *   **Connection:** This is a separate phenomenon. It highlights that probabilistic conditionals are not boolean propositions. It complicates Obs 1 but is not caused by it.

  **Summary:** Obs 1 and 2 are one phenomenon (Kinematics of Uncertain Evidence). Obs 3 is a boundary condition. Obs 4 is a separate phenomenon (Logic of Probabilistic Conditionals).

  ### 4. Is There a Principled Constraint?

  There is no *logical* constraint that picks one rule. There is only a **causal modeling constraint**.

  The analogue to "change nothing you are not forced to change" is the **Principle of Minimum Information (Cross-Entropy Minimization)**. However, this principle requires a set of constraints to minimize over. The "missing piece" you are looking for is the **Independence Assumption**.

  *   **For the Conditional Update (Carving B) to be valid:** You must be able to assert that the *source's reliability* is independent of the *antecedent's truth*.
      *   *Test:* Would the source have sent this message if the shipment had *not* been delayed?
      *   If **Yes** (e.g., they are reporting on general customs policy): Hold $P(D)$ fixed.
      *   If **No** (e.g., they only look at delayed shipments): You cannot hold $P(D)$ fixed; the evidence is screened off by $D$. You must use the Material Update.

  **Principled Constraint:**
  > "Hold fixed the marginal probability of the antecedent **if and only if** the evidence generation process is causally upstream of or independent of the antecedent's realization."

  ### 5. Terminology and Boundary Cases

  Since existing terms are fragmented, I propose the following terminology for your modeling documentation to ensure precision.

  **Term:** **Evidential Locus**
  **Definition:** The ontological level at which a piece of uncertain conditional evidence applies.
  **Conditions:**
  1.  **Token Locus:** Evidence applies to the specific realization of events. (Implies Material Update).
  2.  **Type Locus:** Evidence applies to the generative mechanism or propensity. (Implies Conditional Update).

  **Boundary Case 1: Looks like mine, but is not (The Correlation Case)**
  *   *Scenario:* You learn that "Delay and Customs are positively correlated."
  *   *Difference:* This is evidence about the joint distribution $P(D, C)$, not a conditional constraint. It updates both $P(D)$ and $P(C)$ and the ratio. It does not suffer from the Material vs. Conditional ambiguity because it doesn't present as a conditional sentence.
  *   *Verdict:* This is standard covariance updating, not Uncertain Conditional Evidence.

  **Boundary Case 2: A version of mine where the answer is uncontroversial (The Certain Antecedent)**
  *   *Scenario:* You already know for certain the shipment is delayed ($P(D) = 1$).
  *   *Difference:* The Material Conditional $\neg D \lor C$ becomes equivalent to $C$. The Conditional Probability $P(C|D)$ becomes equivalent to $P(C)$.
  *   *Verdict:* Both update rules collapse into standard Conditionalization on $C$. The ambiguity vanishes because the partition is trivialized.

  ### Summary Recommendation for Your Models

  1.  **Do not treat conditional messages as atomic propositions.** They are constraints.
  2.  **Tag every conditional input with an Evidential Locus.** Force the modeler to declare: "Is this about the *shipment* (Token) or the *system* (Type)?"
  3.  **Implement two update functions:**
      *   `Update_Material(Constraint, Confidence)`: Spreads mass over $\neg A \lor B$. (Lowers $P(A)$).
      *   `Update_Parametric(Constraint, Confidence)`: Adjusts $P(B|A)$, holds $P(A)$. (Preserves $P(A)$).
  4.  **Accept Path Dependence.** Document that sequential uncertain conditional updates are order-sensitive. If possible, batch conditional evidence and update simultaneously to minimize order artifacts.

  The "configuration" you have met is the inevitable collision of **boolean logic** (used in the message structure) with **probabilistic semantics** (used in your model). The friction is not a bug; it is the signal that you need to specify the causal provenance of your data.
