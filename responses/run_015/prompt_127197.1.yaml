answer: |-
  The paradox begins with the knowability principle, stated as the schema $p \to \Diamond Kp$, where $K$ is a knowledge operator and $\Diamond$ is metaphysical possibility. Assume two constitutive truths about knowledge hold of necessity: factivity ($Kp \to p$) and distribution over conjunction ($K(p \land q) \to (Kp \land Kq)$). Substituting the conjunction $q \land \neg Kq$ for $p$ generates a contradiction. If $q \land \neg Kq$ is true, knowability implies $\Diamond K(q \land \neg Kq)$. Distribution yields $\Diamond (Kq \land K\neg Kq)$. Factivity applied to the second conjunct gives $\Diamond (Kq \land \neg Kq)$, which is impossible. Thus, $q \land \neg Kq$ is false, implying $q \to Kq$. Since $q$ is arbitrary, every truth is known. This derivation forces a dilemma: either restrict the scope of knowability or abandon factivity. Both routes close on the verificationist.

  ### The Restrictionist Impasse

  The most common response restricts the knowability schema to a privileged class of propositions, such as the non-epistemic or the atomic. This route is dialectically unavailable to the verificationist. A verificationist account of meaning must specify what it is to grasp any sentence in the language, including sentences containing epistemic operators. If the semantics is expressively adequate, the class of propositions to which knowability applies must be closed under the logical operations used to construct complex sentences. Specifically, if the class contains $q$, it must contain $\neg Kq$ and $q \land \neg Kq$.

  To block the derivation, the restricted class must fail closure under conjunction or negation involving $K$. However, the verificationist cannot simply exclude epistemic compounds without abandoning the claim that their semantics covers the language. If they argue that $q \land \neg Kq$ is not a genuine proposition, they must show that the logical constants do not combine with $K$ to form meaningful content. But the construction uses only negation, conjunction, and $K$ itself. If the verificationist admits these operators have meaning, they must admit the compounds have meaning. To deny knowability for these compounds while asserting it for their components is to admit that truth outstrips verifiability precisely where the semantic theory should be most robust. The restriction saves the principle only by sacrificing the universal scope of the semantic theory it was meant to support. A verificationist must show their favoured class lacks these closure conditions, but doing so renders the language semantically incomplete, undermining the very project of defining truth via verification.

  ### The Factivity Vacuum

  If restriction fails, the only remaining intervention point is factivity. Suppose we replace $K$ with a non-factive surrogate $V$, read as there is conclusive evidence for. The only truth-related constraint is a weakened principle: $Vp \to \Diamond p$. The derivation now stalls. From $p \to \Diamond Vp$ and $Vp \to \Diamond p$, we derive $p \to \Diamond \Diamond p$. In standard modal systems, specifically requiring transitivity of the accessibility relation (axiom **S4**), $\Diamond \Diamond p$ is equivalent to $\Diamond p$. Thus, the principle reduces to $p \to \Diamond p$.

  This stall is a disaster rather than a rescue. The knowability principle was intended to articulate the constitutive claim that truth consists in verifiability. If the principle entails only that true propositions are possible, it is vacuous. Every contingent truth is already possibly true by definition. The substantive link between truth and evidence is severed. By weakening factivity to avoid omniscience, the verificationist weakens the connection between truth and verification until it no longer distinguishes truth from mere possibility. The principle loses its power to explain what truth is, becoming a trivial modal claim. The verificationist wanted truth to be epistemically constrained; without factivity, the constraint dissolves into metaphysical modality alone.

  ### The Anchoring Objection

  A serious objection, the anchoring reply, shifts the claim from propositions to speakers. For any sentence a speaker understands, there is some possible course of experience after which that speaker would be in a position to correctly decide that sentence, where correctly is anchored to the world of that experience rather than the actual world. This attempts to bypass the contradiction by evaluating truth at the anchor world.

  This reply faces a dichotomy. First, if the decision is evaluated at the base world, factivity is back in play at that world. The construction runs as before, but now relative to every world. This requires an omniscience-like collapse everywhere, not just actually. Second, if the decision is evaluated at the anchor world, then for any contingent sentence true here but false at the anchor, the sentence cannot be known at the anchor. Knowability fails for contingent truths that vary across worlds. The verificationist should prefer the second option to avoid global omniscience. However, this preference does not help them. If truth at the actual world cannot be verified at the anchor world because the truth value differs, then actual truth is not constituted by verifiability. The constitutive claim is lost. The anchoring reply either collapses back into the paradox or abandons the idea that actual truth depends on possible verification.

  ### Vulnerabilities and Revivals

  The weakest link in this argument is the claim that verificationists cannot hierarchically restrict their language. To exploit this, a verificationist must argue that epistemic operators belong to a higher semantic level than factual operators, preventing the formation of $q \land \neg Kq$. This requires a typed language where knowledge claims cannot be embedded within the scope of knowability claims. While technically possible, it demands a radical revision of logical grammar that many find implausible for natural language.

  Finally, can the paradox revive against the non-factive surrogate $V$? Consider the substitution instance $p = q \land \neg \Diamond Vq$. If $V$ distributes, $V(q \land \neg \Diamond Vq)$ implies $Vq \land V\neg \Diamond Vq$. By weak factivity ($Vp \to \Diamond p$), this yields $\Diamond q \land \Diamond \neg \Diamond Vq$. Since $Vq$ implies $\Diamond Vq$ (assuming actuality implies possibility for metaphysical $\Diamond$), we have $\Diamond Vq \land \Diamond \neg \Diamond Vq$. This is not a contradiction; it merely asserts the contingency of $Vq$. The paradox does not revive. This confirms the second horn: without factivity, the knowability principle cannot generate a contradiction because it lacks the traction to bind truth to evidence tightly enough. The vacuity charge stands. The verificationist is left with a principle that is either false (if factive) or trivial (if non-factive).
