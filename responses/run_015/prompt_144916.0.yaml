prompt: |-
  hey — i help run a volunteer crisis-line rota (about forty people, mostly students) and we're rewriting the one-page "what's actually expected of you" sheet we hand new volunteers, because the last version managed to both freak people out (they read every optional thing as secretly required and burned out inside two months) and let a couple of people coast (they'd describe straight-up required stuff as "going above and beyond"). my teammate priya says we should drop the moral-philosophy framing entirely and model the whole thing on a job. her pitch: the job description is your duty — written down in advance, you're blameworthy if you skip it, nobody thanks you for doing it. anything past that is overtime: genuinely optional, genuinely praiseworthy if done, zero blame if you clock off. she says that gives us a stable line we can actually print, and it also settles the thing we kept going in circles on — that an act doesn't stop being supererogatory (good but not required, "beyond duty") just because it happens to be easy and the stakes are enormous: you don't get fired for not doing a coworker's job, so likewise you're not obliged to give a kidney to a stranger just because the surgery is low-risk and it saves a life.

  i half buy it, but i can feel the analogy carrying weight it hasn't paid for, and the sheet is due sunday. so: can you audit it? start with the correspondence table — employee, employer, job description, employment contract, wage, overtime, being fired, the bonus, the performance review, the coworker who always stays late — and what each of those maps onto in the moral case, with an explicit question mark where there's nothing to map onto. then the disanalogies, sorted into ones that actually matter for our use and ones that don't. the ones i keep tripping over: (1) the ratchet — we had a volunteer who took every horrible shift for a year, and now new volunteers get side-eyed for not doing the same, and her old shifts feel de facto required; in a job, doing overtime never amends the contract, but here it seems to, which is bad news for "we'll just write the list down." (2) you can quit a job — you consented to the description and can walk — whereas you can't resign from morality, so it's unclear where the line gets its authority from at all. (3) overtime praise seems to presuppose somebody whose interests fix the baseline and who could legitimately ask for more at the next review; in the moral case who would that be, and if there is no one, is our "job description" just a record of what people here happen to do? (4) the escalation ladder we built for the sheet — hold a stranger's door, return a dropped wallet, stay twenty minutes late to cover a gap, take the christmas shifts, drive across town at 3am, donate a kidney — where, if anywhere, does optional flip to required? priya says never, but then i worry the job framing quietly makes everything optional (there's no boss to fire you) or, worse, makes the line whatever we happened to type up, which is circular for our purposes. (5) also, in a job nobody thanks you for doing your job, but people absolutely do thank volunteers for doing the baseline things, and we're not sure whether to put "say thank you" on the sheet as a requirement.

  what i want to know at the end is whether priya's second conclusion — that easiness plus huge stakes never converts the optional into the required, so the kidney case stays supererogatory — actually survives once the disanalogies are on the table, or whether the job picture was doing that work the whole time. and if there's a better analogy for a group like ours that isn't just whatever we wrote on the sheet with extra steps, i'd take it. keep it usable: flag which disanalogies should change what actually goes on the page.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user helps run a volunteer crisis-line rota (40 volunteers, mostly students).
      *   **Problem:** The current "expectations" sheet is ambiguous. It either freaks people out (treating optional as required $\rightarrow$ burnout) or lets people coast (treating required as optional $\rightarrow$ negligence).
      *   **Teammate's Proposal (Priya):** Model the sheet on a "Job Description."
          *   *Core Idea:* Duty = Job Description (written, blameworthy if skipped, no thanks needed). Supererogatory = Overtime (optional, praiseworthy, no blame if skipped).
          *   *Philosophical Claim:* An act doesn't stop being supererogatory just because it's easy and high-stakes (e.g., donating a kidney).
      *   **User's Concerns:** The analogy might be carrying weight it hasn't earned. Specific worries about the "ratchet effect," quitting/resignation, authority of the baseline, the escalation ladder (where does optional become required?), and the culture of gratitude.
      *   **Task:**
          1.  Audit the analogy (Correspondence Table).
          2.  Identify Disanalogies (sorted by relevance to the use case).
          3.  Address the 5 specific tripping points (Ratchet, Quitting, Authority/Praise, Escalation Ladder, Gratitude).
          4.  Evaluate Priya's philosophical conclusion (Easy + High Stakes $\neq$ Required).
          5.  Suggest a better analogy if applicable.
          6.  Keep it usable (flag what changes the actual sheet).

  2.  **Deconstruct the "Job Analogy" (Correspondence Table):**
      *   *Employee:* Volunteer.
      *   *Employer:* The Organization (or the Beneficiaries/Public?).
      *   *Job Description:* The Written Expectations Sheet (Baseline Duties).
      *   *Employment Contract:* The Volunteer Agreement/Code of Conduct.
      *   *Wage:* Non-monetary (Experience, CV boost, community, internal satisfaction).
      *   *Overtime:* Supererogatory acts (extra shifts, emotional labor beyond scope).
      *   *Being Fired:* Being removed from the rota/volunteer program.
      *   *The Bonus:* Public recognition, references, leadership opportunities.
      *   *Performance Review:* Supervision sessions/Feedback.
      *   *Coworker who stays late:* The "Hero Volunteer" (creates the ratchet effect).
      *   *Missing Map:* Moral Obligation itself (in a job, obligation is contingent on contract; in morality, it's often seen as categorical).

  3.  **Analyze Disanalogies (Sorting by Relevance):**
      *   *Irrelevant/Low Impact:* Monetary wage vs. intrinsic reward (doesn't change duty structure), legal recourse (volunteers can't sue for wrongful termination usually).
      *   *High Impact/Critical:*
          *   *Authority:* Who writes the job description? In a job, it's management. In morality, it's... ? In volunteering, it's the org, but does that capture *moral* weight?
          *   *Exit Rights:* You can quit a job easily. You can't "quit" morality (though you can quit the volunteer role).
          *   *The Ratchet:* In jobs, overtime doesn't rewrite the contract. In volunteer cultures, it often does (norm creep).
          *   *Gratitude:* Jobs don't require thanks for baseline. Volunteering relies on goodwill; lack of thanks kills retention.
          *   *Stakes:* Job failure = lost profit. Crisis line failure = potential loss of life. This heightens the moral weight beyond a standard "job."

  4.  **Address the 5 Specific Tripping Points:**
      *   *(1) The Ratchet:* Priya is right theoretically (overtime shouldn't amend contract), but wrong sociologically. If one person does it, it becomes a norm. *Fix:* The sheet needs explicit "Do Not Do" or "Do Not Expect" clauses regarding overtime.
      *   *(2) Quitting:* You can quit the *role*, not the *moral demand*. But since this is a specific volunteer role, the "Job" analogy holds for the *role*, not general morality. *Fix:* Clarify the sheet governs the *role*, not their entire moral life.
      *   *(3) Authority of Praise:* In a job, the boss praises. In volunteering, who praises? Peers? Callers? *Fix:* Define who gives the "bonus" (recognition) so it doesn't feel arbitrary.
      *   *(4) Escalation Ladder:* Where is the line? Priya says "Never" (Kidney is always optional). But crisis work has a "Duty of Care." *Fix:* The line is defined by *risk to the volunteer* vs. *scope of training*. Kidney = outside scope/high risk. Staying 20 mins = inside scope/low risk. The line isn't "easy vs. hard," it's "within role vs. outside role."
      *   *(5) Gratitude:* Job = no thanks. Volunteer = thanks needed for retention. *Fix:* Put "We will thank you for baseline" on the sheet. It manages expectations both ways.

  5.  **Evaluate Priya's Philosophical Conclusion (Easy + High Stakes):**
      *   Priya claims: Easy + High Stakes $\neq$ Required (Kidney case).
      *   Critique: The Job Analogy *hides* the moral stakes. In a job, low risk/high reward for employer might still be optional overtime. In morality, many argue low risk/high save *is* required (Singer's drowning child).
      *   *Verdict:* The Job Analogy supports Priya, but it might support her *too well* by stripping away the moral urgency that justifies the crisis line's existence. However, for *volunteer retention*, Priya is practically right even if philosophically debatable. If you demand the kidney (or equivalent in volunteering), you get no volunteers.
      *   *Nuance:* The "Job" frame works for the *organizational relationship*, but fails for the *moral relationship with the caller*. The sheet needs to distinguish these.

  6.  **Develop a Better Analogy:**
      *   "Job" is too transactional. "Morality" is too vague.
      *   *Suggestion:* "On-Call Professional" or "Licensed Role" (like a lifeguard or first responder).
      *   *Why:* Lifeguards have a defined scope. They aren't required to dive into a hurricane (supererogatory), but they *are* required to dive into a calm pool (duty). It handles the "training/scope" limit better than "job."
      *   *Alternative:* "Team Sport." You have a position. You must play your position. You aren't required to play injured, but playing your position is non-negotiable.
      *   *Best Fit:* **"Scope of Practice" (Medical/Legal model).** This fits crisis work best. It defines duty by *competence and authorization*, not just effort.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, empathetic to the burnout risk, direct.
      *   *Structure:*
          1.  Correspondence Table.
          2.  Disanalogies (High vs. Low Impact).
          3.  Addressing the 5 Tripping Points (with actionable advice for the sheet).
          4.  Verdict on Priya's Philosophical Claim.
          5.  Alternative Analogy Recommendation.
      *   *Constraint Check:* Keep it usable. Flag what goes on the page.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Kidney Case:* In the context of a crisis line, the "kidney" equivalent isn't literally a kidney, it's "taking a shift when you are mentally unwell." I need to make sure the advice translates to the actual context, not just abstract philosophy.
      *   *Refining the Ratchet:* The sheet can't stop the ratchet alone. Culture does that. But the sheet can explicitly label "Heroism" as "Discouraged."
      *   *Refining Gratitude:* If the sheet says "We won't thank you for baseline," volunteers will leave. If it says "We will," it sets a healthy boundary. Priya's "no thanks" rule is bad for volunteering. I need to push back on that specific point.

  9.  **Final Polish:** Check against the prompt requirements (Table, Disanalogies, 5 points, Verdict, Better Analogy). Ensure the distinction between *organizational duty* and *moral duty* is clear. (The prompt asks about the moral case, but the context is a volunteer org. I need to bridge these.)

  *(Self-Correction on Priya's Philosophical Claim)*: Priya argues that *moral* acts don't become required just because they are easy/high stakes. This is a classic debate (Singer vs. Williams). The Job Analogy *assumes* this conclusion rather than proving it. I need to point out that the analogy begs the question. However, for the *sheet*, the pragmatic truth matters more than the meta-ethical truth. I will advise keeping the distinction but grounding it in "Scope of Safety" rather than "Job Description."

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is an audit of Priya's "Job Description" analogy, broken down by correspondence, disanalogies, and your five specific tripping points, followed by a verdict on the philosophical claim and a recommendation for the sheet.

  ### 1. The Correspondence Table

  | Job Concept | Moral/Volunteer Equivalent | Notes |
  | :--- | :--- | :--- |
  | **Employee** | The Volunteer | |
  | **Employer** | The Organization (or the Public/Callers) | Ambiguous: Who holds the moral claim? |
  | **Job Description** | The Written Expectations (Baseline Duty) | The "Line" you are trying to draw. |
  | **Employment Contract** | Volunteer Agreement / Code of Conduct | Signed consent to the baseline. |
  | **Wage** | Training, CV Credit, Community, Internal Satisfaction | Non-monetary, but transactional. |
  | **Overtime** | Supererogatory Acts (Extra shifts, deep emotional labor) | Optional, praiseworthy. |
  | **Being Fired** | Removal from Rota / Dismissal from Program | The sanction for failing baseline. |
  | **The Bonus** | References, Leadership Roles, Public Recognition | Reward for overtime. |
  | **Performance Review** | Supervision Sessions / Feedback | Mechanism to correct baseline drift. |
  | **Coworker Who Stays Late** | The "Hero Volunteer" | Source of the Ratchet Effect. |
  | **The Boss** | **?** | Who has authority to demand *moral* baseline? |
  | **Legal Recourse** | **?** | Volunteers can't sue for wrongful dismissal usually. |
  | **Quit / Resign** | **?** | You can quit the *role*, but can you quit the *moral demand*? |

  ### 2. Disanalogies (Sorted by Impact)

  **High Impact (Matters for the Sheet):**
  *   **The Source of Authority:** In a job, the boss writes the description. In morality, there is no boss. In volunteering, the Org writes it, but if the Org sets the baseline *too low*, volunteers feel morally complicit in negligence. If *too high*, they burnout. The "Job" frame hides the negotiation of *where* that line is drawn.
  *   **The Stakes of Failure:** In a job, failing duty loses money/efficiency. On a crisis line, failing duty risks harm or death. This makes the "Baseline" feel heavier than a standard job description, making the "no thanks for doing your job" rule dangerous.
  *   **The Ratchet (Norm Creep):** In a job, HR prevents overtime from becoming mandatory. In volunteer cultures, "Hero Volunteers" implicitly rewrite the contract for everyone else. The Job Analogy assumes a neutral HR department that doesn't exist in volunteer rosters.
  *   **Gratitude Economy:** Jobs are transactional; volunteering is relational. Withholding thanks for baseline performance (as per Priya's "nobody thanks you" rule) works in corporate settings but destroys retention in care work.

  **Low Impact (Doesn't Change the Sheet):**
  *   **Monetary Wage:** Irrelevant to the duty/option distinction.
  *   **Legal Employment Status:** Volunteers are not employees, but for the purpose of *expectations*, the contractual logic holds.
  *   **Union Representation:** Mostly irrelevant to the moral structure of the rota.

  ### 3. Auditing Your Five Tripping Points

  **(1) The Ratchet (Hero Volunteers)**
  *   **The Problem:** Priya says overtime doesn't amend the contract. In reality, culture does. If one volunteer takes every Christmas shift, new volunteers feel guilty taking Christmas off.
  *   **Does the Analogy Hold?** No. A job has HR to enforce the contract. You have a rota manager.
  *   **Fix for the Sheet:** You must explicitly **forbid** the ratchet. Add a clause: *"Taking extra shifts beyond your roster is discouraged if it sets unsustainable precedents for peers. We will not praise 'heroism' that endangers the rota's long-term stability."*
  *   **Verdict:** The Job frame helps here *if* you act like HR. Print the limit.

  **(2) Quitting vs. Moral Resignation**
  *   **The Problem:** You can quit a job. You can't quit morality. If the sheet is just a "job description," does it imply volunteers can ignore moral duties outside the sheet?
  *   **Does the Analogy Hold?** Partially. It holds for the *organizational role*, not their life.
  *   **Fix for the Sheet:** Clarify the scope. *"This document defines your duties **to the Organization**. It does not exhaust your moral duties to callers, but it defines the limit of what the Organization can require of you."*
  *   **Verdict:** Keep the Job frame for *organizational accountability*, but acknowledge the moral context.

  **(3) Authority of Praise (Who fixes the baseline?)**
  *   **The Problem:** In a job, the boss decides what's overtime. In morality, who decides? If it's just "what we typed," it's circular.
  *   **Does the Analogy Hold?** Weakly. It relies on the Org having legitimate authority.
  *   **Fix for the Sheet:** Ground the baseline in **Safety and Competence**, not arbitrary rules. *"Baseline duties are defined by what is safe and sustainable for a trained volunteer to perform regularly."* This removes the "because we said so" circularity.
  *   **Verdict:** Shift justification from "Contract" to "Scope of Practice."

  **(4) The Escalation Ladder (Where does Optional flip to Required?)**
  *   **The Problem:** Door hold $\rightarrow$ Wallet $\rightarrow$ 20 mins late $\rightarrow$ Christmas $\rightarrow$ 3am Drive $\rightarrow$ Kidney. Priya says *none* are required. You worry *some* must be.
  *   **Does the Analogy Hold?** No. A job description *must* include essential functions. If "driving across town" is essential to the role, it's baseline. If it's not, it's overtime.
  *   **Fix for the Sheet:** The line isn't "Easy vs. Hard." It is **"Within Scope vs. Outside Scope."**
      *   *Baseline:* Tasks you are trained for, risk-assessed, and rostered for.
      *   *Optional:* Tasks requiring untrained risk, personal resource expenditure, or roster deviation.
      *   *Kidney Case:* Definitely Outside Scope (High personal risk, untrained).
      *   *20 Mins Late:* Inside Scope (Low risk, trained).
  *   **Verdict:** Priya is wrong that *nothing* flips to required. Tasks essential to the service's function *must* be required, or the service closes. The line is drawn at **sustainability**, not just "effort."

  **(5) Gratitude ("Say Thank You")**
  *   **The Problem:** Jobs don't thank you for baseline. Volunteers need to feel valued.
  *   **Does the Analogy Hold?** No. Applying corporate coldness to care work is a retention killer.
  *   **Fix for the Sheet:** **Explicitly require gratitude.** *"The Organization commits to thanking volunteers for meeting baseline expectations. Doing your duty is worthy of acknowledgment."*
  *   **Verdict:** Reject Priya's "nobody thanks you" rule. It works for factories, not crisis lines.

  ### 4. Verdict on Priya's Philosophical Conclusion

  **Claim:** *Easiness + Huge Stakes never converts the Optional into the Required (The Kidney Case).*

  **Audit:** The Job Analogy **begs the question** here. It assumes the conclusion rather than proving it.
  *   In a job, I am not required to save the company money if it costs me a kidney, because the contract is limited.
  *   In morality, many philosophers (e.g., Peter Singer) argue that if the cost is low and the save is high, it *is* required.
  *   **However:** For a **volunteer organization**, Priya is **pragmatically correct**, even if philosophically debatable. If you frame high-stakes/low-cost acts as *required*, you select for martyrs and burn out the rest. To keep the rota staffed, you *must* treat the "Kidney Equivalent" (e.g., taking a shift while mentally unwell) as optional.

  **Does the Job Picture do the work?** Yes. It provides a **psychological boundary** that protects volunteers from moral guilt. It tells them: *"You are a volunteer, not a savior."*
  **Risk:** It might swing too far, making volunteers feel they can do the bare minimum on a call (e.g., being cold but compliant).
  **Correction:** The baseline must include **quality of care**, not just attendance.

  ### 5. A Better Analogy: "Scope of Practice" (The Lifeguard Model)

  The "Job" analogy is too transactional. The "Morality" analogy is too vague.
  **Use the "Licensed Professional" or "Lifeguard" Analogy.**

  *   **Why:** A lifeguard has a defined duty. They *must* dive in for a struggling swimmer (Baseline). They are *not* required to dive in during a hurricane (Supererogatory/Forbidden).
  *   **The Line:** Drawn by **Training and Risk**, not just "Contract."
  *   **Benefit:** It validates that baseline work is *hard and skilled* (worthy of thanks) but strictly *limited* (protects against burnout).

  ### 6. Actionable Recommendations for the Sheet

  To make this usable by Sunday, incorporate these specific changes based on the audit:

  1.  **Rename the Document:** Instead of "Job Description," call it **"Scope of Practice & Rota Agreement."**
  2.  **Define the Baseline by Safety:**
      *   *Required:* "Attend rostered shifts," "Complete supervision," "Follow safety protocols."
      *   *Reasoning:* "These are the minimum requirements to keep the line safe and open."
  3.  **Explicitly Cap Overtime (Stop the Ratchet):**
      *   Add a section: **"Sustainability Limits."**
      *   Text: *"Taking extra shifts is optional. Please note: consistently picking up extra shifts can create pressure on peers. We may ask you to stop taking overtime to protect team balance."*
  4.  **Mandate Gratitude:**
      *   Add a section: **"Our Commitment to You."**
      *   Text: *"We will thank you for meeting these baseline expectations. You do not need to go 'above and beyond' to be valued here."*
  5.  **Address the "Kidney" Case (High Stakes/Low Cost):**
      *   Add a clause: **"Personal Risk Boundary."**
      *   Text: *"No volunteer is expected to compromise their mental health or physical safety to cover a gap. If a shift endangers you, you are required to decline it, regardless of the staffing need."*

  **Final Word:** Priya's "Job" frame is the right *tool* for preventing burnout, but the wrong *language* for care work. Use the structure of a job (clear duties, sanctions, limits) but the language of a team (safety, sustainability, mutual care). This keeps the "Stable Line" she wants without the "Cold Transaction" that kills morale.
