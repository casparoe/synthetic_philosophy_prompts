  **MEMORANDUM TO THE COMMITTEE ON COMMEMORATION**

  **RE:** Precedent Analysis and Recommended Dispositions regarding August Kellerman

  **I. Reconstructing the Committee's Rules**

  Reviewing the seven precedents (Jefferson, Columbus, Churchill, Prynne, Vandeventer, Vane, Geneticist), the Committee's record does not adhere to a single moral theory. Instead, our decisions oscillate between two distinct principles. Both are consistent with the record, but they yield opposite verdicts on the Kellerman petition.

  **Rule 1: The Contemporaneous Conscience Standard**
  *Derived from: Columbus, Churchill, Geneticist.*
  **Principle:** Commemoration depends on the subject's moral agency relative to their own time. If the subject's wrongdoing was denounced by contemporaries (Columbus), removal is required unless the subject actively opposed a "greater evil" (Churchill, Geneticist). The focus is on the *person's* moral ledger.
  **Predicted Verdicts for Kellerman:**
  *   **Name:** **Remove.** Like Columbus, Kellerman's grave-robbing was reported and petitioned against at the time; he lacked the "moral cover" of ignorance. His anti-racist work (Geneticist/Churchill defense) mitigates but does not erase the bodily violation.
  *   **Bust:** **Remove.** A likeness honors the person, not the work. If the person fails the Conscience Standard, the likeness goes.
  *   **Remains:** **Repatriate All.** Moral imperative overrides research utility (implied by Columbus removal without context).
  *   **Fund:** **Retain.** The fund supports Native students (redemption/restitution), aligning with the Geneticist's refugee work.

  **Rule 2: The Institutional Utility and Severability Standard**
  *Derived from: Jefferson, Prynne, Vandeventer, Vane.*
  **Principle:** Commemoration depends on the separability of the *work* from the *worker* and the institution's dependency on that work. If the work remains useful (Library, Index, Poems, Founding), the name stays, often with contextualization or redirection of specific honors to victims. The focus is on the *college's* relationship to the legacy.
  **Predicted Verdicts for Kellerman:**
  *   **Name:** **Retain with Context.** Like Vandeventer (Library) and Prynne (Index), the Institute's scientific framework is still in use. We acknowledge the cost (plaque) but retain the utility.
  *   **Bust:** **Relocate.** Like Jefferson, move from prominent lobby to a courtyard or archive. It acknowledges the founder without granting prime real estate.
  *   **Remains:** **Repatriate Reachable, Retain Rest.** Like Prynne's Index, the collection is a scientific instrument. We return what the law/kinship allows (restitution) but keep the unaffiliated for research (utility).
  *   **Fund:** **Retain and Rename.** Like Vandeventer's scholarship, the money is blood-adjacent. We keep the support for Native students but rename the fund to honor a tribal leader or the victims, not Kellerman.

  **II. The Closest Analog**

  The closest analog is **Dr. Elias Prynne**.

  Like Kellerman, Prynne was a scientist whose foundational contribution (sterilization statute/index vs. comparative framework) is inextricably linked to the violation of human bodily autonomy. In both cases, the "instrument" (the Index, the Collection) is distinct from the "honor" (the School Name, the Institute Name).

  **What turns on this choice:**
  If we select **Prynne**, we must separate the *honor* from the *utility*. The Prynne precedent dictates removing the name from the administrative unit (the School/Institute) while allowing the scientific tool (the Index/Collection) to persist.
  If we select **Vandeventer** (the next closest), we retain the name on the building because the money built it, merely adding a plaque.
  If we select **The Geneticist**, we retain the name unannotated because the "good works" balance the "bad beliefs."

  Choosing Prynne over Vandeventer signals that we view the human remains as *victims of science* (requiring name removal) rather than *donors of capital* (requiring only a plaque). Choosing Prynne over the Geneticist signals that active bodily violation (grave robbing/sterilization) outweighs ideological redemption (anti-racism/refugee rescue).

  **III. Recommended Verdicts and Underdetermined Principles**

  To best cohere with the Committee's six-year history—which favors compromise, contextualization, and the preservation of utility over moral purism—I recommend the following unified disposition:

  1.  **Name (Institute/Professorship): Retain with Permanent Contextualizing Installation.**
      *   *Coherence:* Aligns with Jefferson (Founder/Name retained) and Vandeventer (Benefactor/Name retained with plaque). It acknowledges the Institute's scientific necessity (Prynne Index logic) without granting unqualified honor.
      *   *Underdetermination:* Our precedents do not specify *how* to annotate a name that is legally contested. By choosing this, we adopt the principle: **Institutional Continuity outweighs Moral Purity, provided the cost is publicly ledgered.**

  2.  **Bust: Relocate out of Prominent Space.**
      *   *Coherence:* Directly follows Jefferson. We honor the founder's contribution but remove the idol from the "front steps."
      *   *Underdetermination:* We have no precedent for a bust where the name is retained but the figure is controversial (Churchill was retained unannotated; Jefferson was moved). By moving it, we adopt the principle: **Three-dimensional likenesses imply personal veneration more than text does and require stricter scrutiny.**

  3.  **Remains: Repatriate where legally and tribally possible; Retain unaffiliated remains with a Memorial Installation.**
      *   *Coherence:* Blends Columbus (removal/repatriation) with Prynne (instrument retained).
      *   *Underdetermination:* We have no precedent for "orphaned" remains where no statute applies. By retaining them for research, we adopt the principle: **Scientific Stewardship is a valid justification for retaining human remains only when repatriation is factually impossible, not merely legally difficult.**

  4.  **Fund: Retain, but Rename.**
      *   *Coherence:* Follows Vandeventer (scholarship renamed for striker). The money supports the victims' descendants, so the honor should belong to them, not the source.
      *   *Underdetermination:* The scholars asked us not to liquidate it. By renaming it, we adopt the principle: **Restitution requires the transfer of honor, not just the continuation of benefit.**

  **IV. The Separating Fact**

  To test whether the Committee prefers Rule 1 (Conscience) or Rule 2 (Utility), I propose we seek the answer to this single question:

  **"Were the specific remains in the collection used to generate the anti-racist measurements that Kellerman is honored for?"**

  *   **If Yes:** The Harm and the Good are inseparable. This pushes us toward **Prynne** (remove name, the instrument is tainted) or **Columbus** (the good does not excuse the means).
  *   **If No:** The anti-racist work was theoretical or used other data; the grave-robbing was purely for general collection. This pushes us toward **Vandeventer** (the money built the library, the art is separate) or **Vane** (the poems are separate from the politics). We can then sever the "blood" from the "science."

  **V. The Deed of Gift**

  The deed-of-gift clause requiring the name's retention so long as research continues should be treated **merely as a constraint on implementation, not as a reason for our reasoning.**

  In the Prynne case, we noted the index was "not ours to rename." However, in Vandeventer, we renamed the scholarship despite the donor's intent. If we allow the deed to dictate our *moral* verdict, we abdicate the Committee's purpose. We must first decide what *ought* to be done based on our precedents. If the deed prevents removing the name, we comply with the law but maximize the "Contextualizing Installation" (Rule 2) to ensure the moral record is clear. We should not cite the threat of a lawsuit as a *reason* for retention in our written justification; we cite the scientific utility. The lawsuit is a risk to be managed by counsel, not a principle of commemoration.
