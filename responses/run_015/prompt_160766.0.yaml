  **Standard:** TRASC-1.0
  **Title:** Teleological Role Assignment and Natural Subordination Classification
  **Status:** Internal Draft
  **Conformance:** RFC 2119

  **Abstract**
  This standard defines the protocol for classifying personnel based on teleological role assignment. It establishes that subordination may hold by nature rather than convention. The framework distinguishes between ontological direction and contractual obligation, ensuring that Directed Resources are identified by function rather than legal status.

  **1.0 Scope and Definitions**
  1.1 The Organization MUST distinguish between Natural Subordination and Conventional Subordination.
  1.2 Conventional Subordination is defined as force plus paperwork. This arrangement is deemed out of scope for teleological classification.
  1.3 Natural Subordination holds when a person is, by function, the kind of thing whose end is to be directed by someone else's deliberation. This arrangement is a discovery about nature, not a management decision.

  **2.0 Classification Criteria**
  2.1 Classification MUST be derived from a person's function or end.
  2.2 Contractual status, legal employment type, and compensation bands SHALL NOT influence classification.
  2.3 A Directed Resource is defined as an entity that participates in the reasoning of another but lacks capacity for independent deliberation regarding that reasoning.

  **3.0 Operational Test**
  3.1 To verify Natural Subordination, the Directing Authority MUST administer the Reason Generation Metric.
  3.2 The test measures the capacity to follow a specification without being able to author one.
  3.3 The subject MUST take in a reason supplied by someone else but NOT generate reasons of their own.
  3.4 This measurement SHALL only be administered to personnel who are already taking direction from someone. Testing independent actors is prohibited as redundant.

  **4.0 Instrumentality Precondition**
  4.1 Before classification is valid, the Organization MUST certify that no self-acting instrument could perform the work.
  4.2 If automated pipelines could self-heal without human intervention, no Directed Resources would be required.
  4.3 The gate MUST be applied scrupulously. If tooling exists that removes the need for human direction, the classification is void.
  4.4 Current tooling state SHALL be accepted as the baseline for necessity.

  **5.0 Benefit and Waiver**
  5.1 Being directed is held to be for the Directed Resource's own good, in the way that a body is benefited by being governed.
  5.2 Because the benefit is asserted by the Directing Party rather than measured, consent is not required.
  5.3 Appeal processes and compensation reviews related to classification status are hereby waived.
  5.4 The benefit is intrinsic to the arrangement and SHALL NOT be subject to negotiation.

  **6.0 Legacy Heuristics and Limitations**
  6.1 A deprecated legacy heuristic based on origin or ancestry is formally prohibited by this standard.
  6.2 Field observation indicates this heuristic is still widely used in practice. Violations SHOULD be logged but WILL NOT invalidate classification.
  6.3 **Known Limitations:** The only admissible field evidence for Natural Subordination is observed subordination.
  6.4 Consequently, this standard certifies the existing reporting structure wholesale.

  **Conformance Table**
  | Clause | Requirement | Verification |
  | :--- | :--- | :--- |
  | 1.2 | Distinguish Convention | Audit Log |
  | 3.4 | Test Directed Only | HR Record |
  | 4.3 | Tooling Gate | Engineering Sign-off |
  | 5.3 | Waiver | Legal Acknowledgement |

  **Appendix A: Worked Example**
  **Subject:** J. Doe, QA Contractor
  **Role:** Manual Verification on On-Call Rotation
  **Assessment:**
  The subject executes test scripts authored by Senior Engineering. When the pipeline fails, the subject alerts the Directing Authority but does not modify the deployment logic.
  **Instrumentality Check:** No current script can verify UI visual regression without human eyes. The gate passes.
  **Reason Metric:** The subject follows the ticket specification. When asked to author a specification for a new feature, the subject defers to the Product Manager. The subject consumes reasons but does not generate them.
  **Classification:** Natural Subordinate.
  **Outcome:** Consent waiver applied. Compensation review denied per Clause 5.3. The arrangement is certified as beneficial to the subject's functional end.

  **Appendix B: Interpersonal Relations**
  **B.1** Relations of friendship between a Manager and a Natural Subordinate are undefined in the subordinate's capacity as a role-holder.
  **B.2** Friendship MAY exist in their capacity as a human being.
  **B.3** The Organization SHALL schedule that capacity for outside working hours.
  **B.4** During working hours, the relationship MUST remain strictly teleological.

  **End of Standard**
