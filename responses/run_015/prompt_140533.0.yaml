      *   *Exegetical Lewis:* "What did Lewis *really* mean in 1968 vs 1986?" User explicitly wants to avoid this.
      *   *The "Counterpart Relation is Identity" reduction:* Trying to prove CT *is* TWI in disguise. Usually ends in stalemate.

  4.  **Develop Four Prioritized Lines of Work:**
      *   *Criterion:* Must leverage formal strength, avoid history, connect to other fields, allow publication pipeline.
