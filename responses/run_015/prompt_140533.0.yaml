      *   *Priority 3: Temporal Counterparts and Persistence (Refining Hunch 2).*
          *   *Why:* Endurantism vs. Perdurantism is a live debate. CT applied to time (stage theory) is controversial but active. Connects to personal identity.
          *   *Upstream:* Ethics (responsibility), Personal Identity.
          *   *Tractability:* Medium (needs engagement with non-formal literature).
          *   *Check:* Does temporal CT solve the fission problem better than standard accounts?
      *   *Priority 4: Group Agents and Modal Profiles (Refining Hunch 2).*
          *   *Why:* Social ontology is hot. "Could the Supreme Court have ruled differently?" CT handles group modalities well without committing to group souls.
