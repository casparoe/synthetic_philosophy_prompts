answer: |-
  This is a strong position to be in. You have a clear constraint (no history/exegesis), a clear advantage (formal tools), and a clear target (external relevance). The fear of "Lewis scholarship with extra steps" is well-founded; the CT vs. TWI debate calcified around 2010. To make it live, you must treat CT not as a *interpretation of Lewis*, but as a *formal tool for individuation* that happens to have modal applications.

  Here is the outside view you asked for.

  ### Part 1: The Overrated Questions (The "Do Not Touch" List)

  You asked what to avoid. In this cluster, these questions consume years and move nothing downstream:

  1.  **The "True Nature" of Haecceitism:** Debates over whether haecceitism is a primitive "thisness" or just a commitment to permutation invariance. This is largely verbal. Unless you are doing formal semantics on the *logic* of haecceitistic operators, metaphysical hand-wringing here rarely yields papers that philosophers of physics or language cite.
  2.  **The "Intuition" of Transworld Identity:** Papers arguing "It just *seems* like I could have been someone else" vs. "No, it seems like a counterpart." Phenomenology of modality is a dead end for a formalist. It doesn't constrain the logic.
  3.  **Exegetical Rescue:** Trying to save Lewis from the "Humphrey Objection" by finding a hidden nuance in *On the Plurality of Worlds*. This is history, not metaphysics. It matters only to other Lewis scholars.
  4.  **The Reduction Debate:** Trying to prove that Counterpart Relations *are* Identity relations in disguise (or vice versa). This is a stalemate. Assume the formalism works and ask what it *does*, not what it *is*.

  ---

  ### Part 2: Verdict on Your Three Hunches

  **Hunch 1 (Actual Duplicates/Physics): Rank 1.**
  This is your strongest lead. It directly targets your constraint (matter to philosophers of physics) and leverages your strength (formal/model-theoretic). The literature on "Indistinguishable Particles" in metaphysics is active but often lacks rigorous modal formalism. If you can show that CT provides a cleaner model for permutation invariance than TWI + Haecceities, you have a publishable core.
  *   *Risk:* You need to learn enough physics to not be embarrassed, but not so much that you become a physicist.

  **Hunch 3 (Determinacy/Salience): Rank 2.**
  This is the "Formal Semantics" play. The objection that CT makes truth vague is standard. Turning this into a feature by axiomatizing the constraints on admissible counterpart relations is genuine logical work. It matters to semanticists working on context-sensitivity and vagueness.
  *   *Risk:* It can become pure logic with no metaphysical payload. You must ensure the constraints have metaphysical justification, not just logical elegance.

  **Hunch 2 (Same Dispute, Other Joints): Rank 3 (Conditional).**
  As stated, this is too broad for a PhD. "Is CT true for time, fiction, and groups?" is a book project, not a thesis. However, *instantiating* this in one specific domain (e.g., Temporal Counterparts) is excellent.
  *   *Risk:* Dilution. If you try to cover time *and* fiction *and* groups, you will master none. Pick one domain as the test case for the "General Policy."

  ---

  ### Part 3: Four Prioritized Lines of Work

  Here are four specific projects, ranked by fit for your profile (Formal + 4 Years + External Relevance).

  #### 1. Counterpart Theory and Quantum Indistinguishability
  **The Pitch:** Use CT to model identical particles in QM without resorting to "weak discernibility" or primitive haecceities. Treat particles in a symmetric state as counterparts of one another within a world, not across worlds.
  *   **Upstream:** Philosophy of Physics (QM interpretation), Structural Realism.
  *   **Downstream:** Metaphysics of properties, Logic of identity.
  *   **Tractability:** High for you. It requires model theory and basic QM formalism (symmetrization postulate), not experimental physics.
  *   **Neglected/Crowded:** Neglected. Most metaphysicians treat QM particles as a problem for *identity*, not *modality*. Bringing CT into the intra-world case is novel.
  *   **6-Month Check:** Can you formalize a "within-world counterpart relation" that respects permutation invariance without collapsing into identity? If yes, move up. If the physics literature shows this is already solved by "Weak Discernibility" (Saunders et al.), move down.
  *   **Publishing:** 2 papers easily. One on the formalism, one on the metaphysical implications for individuation.

  #### 2. Axiomatizing Admissible Counterpart Relations (Refining Hunch 3)
  **The Pitch:** The standard objection to CT is that the counterpart relation is context-sensitive/vague. Propose a system of constraints (e.g., transitivity, metric bounds, essential property preservation) that an *admissible* relation must satisfy to ground *de re* necessity.
  *   **Upstream:** Formal Semantics, Epistemic Logic, Vagueness.
  *   **Downstream:** Ethics (moral responsibility requires stable identity conditions), Decision Theory.
  *   **Tractability:** Very High. This is pure philosophical logic.
  *   **Neglected/Crowded:** Crowded in the objections, neglected in the positive construction. Most people say "it's vague" and stop. Few build the logic of the vagueness.
  *   **6-Month Check:** Can you derive a non-trivial theorem? (e.g., "If relation C satisfies constraints X and Y, then Sorites paradoxes for identity are blocked"). If it looks like standard modal logic with extra axioms, it might be too thin.
  *   **Publishing:** High potential in logic journals (*Journal of Philosophical Logic*, *Review of Symbolic Logic*).

  #### 3. Temporal Counterparts and the Fission Problem
  **The Pitch:** Apply CT to persistence through time (Stage Theory). Focus specifically on *fission* cases (teletransportation, split-brain). Standard TWI struggles with fission (which successor is me?). CT handles this naturally (both are counterparts). But what are the *normative* costs?
  *   **Upstream:** Personal Identity, Ethics (anticipatory concern, responsibility).
  *   **Downstream:** Bioethics, Law (identity over time).
  *   **Tractability:** Medium. Requires engaging with non-formal literature (Parfit, etc.).
  *   **Neglected/Crowded:** Crowded in metaphysics, but the *formal* treatment of the normative consequences is less so.
  *   **6-Month Check:** Does the CT solution to fission preserve enough of what matters in survival to be viable? If you find CT implies you shouldn't care about your future self, the project dies.
  *   **Publishing:** Good for general metaphysics journals (*Philosophical Studies*, *Noûs*).

  #### 4. De Re Modality for Group Agents
  **The Pitch:** "Could the Supreme Court have ruled differently?" Groups have modal profiles distinct from their members. CT is ideal here: the Court's counterpart in another world need not consist of the same people, just structurally similar roles.
  *   **Upstream:** Social Ontology, Political Philosophy.
  *   **Downstream:** Legal Theory, Institutional Design.
  *   **Tractability:** High. Conceptual + Formal.
  *   **Neglected/Crowded:** Highly Neglected. Social ontology is booming; modal metaphysics of groups is almost empty.
  *   **6-Month Check:** Can you distinguish "group counterparts" from "aggregates of member counterparts"? If the group modality collapses into member modality, the project is trivial.
  *   **Publishing:** High novelty. Good for interdisciplinary journals or metaphysics venues looking for application.

  ---

  ### Part 4: Strategic Reasoning & Prioritization

  **My Recommendation:**
  Prioritize **Line 1 (Physics/Indistinguishability)** combined with **Line 2 (Axiomatization)**.

  **Why?**
  1.  **Fit:** It maximizes your formal strength and minimizes your history weakness.
  2.  **Market:** "Metaphysics of Physics" is a hiring growth area. "Modal Logic" is always respectable. "Personal Identity" is saturated.
  3.  **Supervisor:** With one supervisor, you need a topic that is self-contained. Physics + Logic is self-contained. Personal Identity requires engaging with a massive, messy literature of case studies.
  4.  **Publishing:** You can spin off the logic paper (Line 2) independently of the physics paper (Line 1). This secures your "publish along the way" goal.

  **Importance vs. Tractability:**
  In a PhD, **Tractability wins.**
  An important question you don't finish is a failure. A tractable question that yields 3 solid papers is a success.
  *   *Line 1* is tractable because the physics formalism is fixed (you don't have to solve QM, just model it).
  *   *Line 3 (Personal Identity)* is less tractable because "what matters in survival" is a conceptual quagmire that supervisors often disagree on.

  **The "Six Month" Pivot Point:**
  Spend the first 6 months on **Line 1**.
  *   *Read:* Saunders, Müller, Seeley on indistinguishable particles. Read Lewis on "Many but Almost One."
  *   *Task:* Try to write a 10-page formal note showing how a counterpart relation handles permutation invariance better than haecceitism.
  *   *Decision:* If you get stuck on the physics, pivot to **Line 2** (Pure Logic of Counterparts). If you get stuck on the logic, pivot to **Line 4** (Groups), which is conceptually easier but less formal.

  **Final Word on Your Hunches:**
  Your **Hunch 1** is the winner. It is not confused; it is the most viable path to making CT matter to non-Lewisians. The insight that "CT might be needed *within* a world for duplicates" is a powerful lever. It turns CT from a theory of *modality* into a theory of *individuation*. That is worth four years.

  **Hunch 3** is the safety net. If the physics proves too hard, the logic of salience is always there.
  **Hunch 2** is the trap. Do not attempt the "Grand Unified Theory of Counterparts." Pick one domain (Time or Groups) and treat it as a case study, not the main event.

  **Summary Plan:**
  1.  **Year 1:** Formalize the "Within-World Counterpart" model (Hunch 1). Submit paper to *British Journal for the Philosophy of Science* or *Synthese*.
  2.  **Year 2:** Axiomatize the constraints on the relation (Hunch 3). Submit to *Journal of Philosophical Logic*.
  3.  **Year 3:** Apply the framework to a specific metaphysical problem (e.g., Fission or Group Agency). Submit to *Philosophical Studies*.
  4.  **Year 4:** Thesis assembly and job market paper refinement.

  This gives you a pipeline, uses your strengths, and avoids the "Lewis Scholarship" trap.
