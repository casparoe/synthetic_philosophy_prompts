      *   *Hunch 2 (Generalization/Other Joints):* Unifying CT across time, fiction, and groups. Risky. Might be too broad/vague for a PhD. Could become a "theory of everything" that says nothing specific. But if focused on *structural parallels*, it could yield papers.
      *   *Hunch 3 (Determinacy/Salience):* Addresses the "vagueness" objection to CT. Formalizable (constraints on similarity metrics). Connects to semantics/pragmatics. Good for formal strength.

  3.  **Identify Overrated Questions (The "Don't Do This" List):**
