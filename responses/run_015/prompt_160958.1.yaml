  **Joint Statement on Hume's Monetary Theory**
  **An Adversarial Collaboration between Neutrality Readers and Quickening Readers**

  After twelve months of debate, the Neutrality Readers (who emphasize long-run monetary neutrality) and the Quickening Readers (who emphasize short-run real effects) issue this joint statement. We agree that David Hume is not a mercantilist. We agree that money is not wealth itself. We disagree on whether the transition period between money supply shocks and price adjustments is merely noisy friction or a genuine window for economic improvement. To move beyond quoting essays at each other, we have adopted a shared thought experiment: the Quarantined Mint. This document records where we stand, where we diverge, and how we propose to settle it.

  **I. Agreed Claims**

  1.  **Wealth Is Not Bullion:** Hume rejects the view that a nation's wealth consists simply of its stock of gold and silver. Increasing the money supply without increasing goods merely raises prices.
  2.  **Trade Is Not War:** Attempts to beggar neighboring nations through trade restrictions are self-defeating. Rich neighbors are better customers and models for industry than poor ones.
  3.  **The Long-Run Mechanism:** An excess of money raises domestic prices, making imports cheaper and exports dearer. This drains specie abroad until prices and money stocks equalize across trading partners. Real commerce is ultimately fixed by labor, skill, manners, and resources.
  4.  **The Oil Metaphor:** Money is an instrument of commerce, like oil that makes the wheels of trade turn more smoothly. It is not itself one of the wheels (factors of production).
  5.  **The Quarantined Mint Setup:** We accept the following test case. Two identical kingdoms operate on a silver standard with no paper money or modern finance. In **Kingdom Gradual**, a new mine releases silver slowly over twelve months, spent immediately on local goods. In **Kingdom Quarantine**, the same total silver arrives but is locked in the vault for twelve months, then released all at once. Both sides agree this isolates the time-profile of circulation from the total quantity shock, holding initial real resources fixed.

  **II. Disagreements Table**

  | Crux | Neutrality Readers | Quickening Readers | Shared Evidence / Test | Advance Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **Quarantined Mint Outcomes** | Money enters, prices adjust. Real variables (employment, output) remain near natural levels. Any spike is unstable noise. | Gradual inflow stimulates industry before prices rise. Sudden inflow shocks prices faster, dulling the stimulus. | **Month 3:** Gradual shows higher employment than Quarantine.<br>**Month 12:** Gradual output peaks; Quarantine unchanged.<br>**Month 24:** Both converge to same price level/output. | **NR:** No significant difference in employment between kingdoms at Month 3.<br>**QR:** Gradual employment > Quarantine employment at Month 3. |
  | **The Oil Metaphor** | Oil lubricates but does not drive. Money facilitates exchange but cannot create real value or capacity. | Oil allows the engine to run hotter without seizing. Liquidity can unlock idle capacity temporarily. | Textual analysis of Hume's machinery analogies and consistency with price-specie-flow. | **NR:** Metaphor implies strict neutrality.<br>**QR:** Metaphor allows for transient efficiency gains. |
  | **Spirit of Industry** | A descriptive flourish for market clearing. Not a causal mechanism that leaves lasting traces. | A real psychological causal chain. Money wakes people up; habits formed during the boom persist after money neutralizes. | Historical episodes of specie inflows (e.g., Spanish silver, American gold rushes). | **NR:** Habits revert once prices adjust.<br>**QR:** Some capital/skill improvements remain permanent. |
  | **Definition of Short-Run** | The adjustment period is too short and unstable for policy to target. | The adjustment period is long enough (years) to alter structural capacity. | Speed of wage and price stickiness in 18th-century markets. | **NR:** Months.<br>**QR:** Years. |

  **III. Verbal vs. Real Disputes**

  We distinguish two types of disagreement. The first is **verbal**: much of our fight concerns the definition of the "short run." Neutrality Readers treat any period where prices haven't fully adjusted as a frictional anomaly too brief to matter. Quickening Readers define it as a multi-year window where contracts and wages are sticky. If we agree the adjustment takes three years, the Neutrality Readers concede the interval exists but deny it is useful; the Quickening Readers insist it is useful.

  The second is **real**: Does the "spirit of industry" leave a permanent trace? If the money supply returns to neutrality, do the work habits or capital improvements formed during the inflationary gap survive? If Quickening Readers claim lasting structural change while Neutrality Readers claim reversion to the mean, this is a factual dispute about economic hysteresis, not semantics.

  **IV. Falsification Protocols**

  For each genuine crux, we propose a test where both sides record predictions in advance.

  **1. The Quarantined Mint Case**
  *   **Scenario:** As defined in Claim 5.
  *   **Neutrality Prediction:** At Month 3, prices in Kingdom Gradual rise slightly, but employment and output remain at baseline. Kingdom Quarantine shows no change until Month 12, when prices jump. By Month 24, both kingdoms have identical price levels and output.
  *   **Quickening Prediction:** At Month 3, Kingdom Gradual sees higher employment and output as merchants hire before raising prices. Kingdom Quarantine remains stagnant. At Month 12, Gradual output is still elevated; Quarantine sees a price shock with less real gain. By Month 24, prices equalize, but Gradual retains a slight edge in capital stock due to investments made during the boom.
  *   **Stakes:** If Gradual shows no employment spike at Month 3, the Quickening Reading collapses.

  **2. The Hoarded Tribute Variant**
  *   **Scenario:** A foreign power pays a large one-time silver tribute. In **Case Road**, the ruler spends it immediately on infrastructure (roads/ports). In **Case Vault**, the ruler locks the silver away permanently.
  *   **Neutrality Prediction:** Case Road distorts prices temporarily but yields no long-run growth advantage over Case Vault, since real wealth depends on labor and manners, not public works funded by inflation.
  *   **Quickening Prediction:** Case Road quickens industry and leaves permanent infrastructure, raising the natural level of output. Case Vault deadens the money supply and wastes the opportunity to stimulate habits.
  *   **Stakes:** If Case Road shows no long-run output advantage over Case Vault, the claim that money-induced improvements persist is false.

  We sign this statement not because we agree, but because we finally agree on what would count as being wrong.
