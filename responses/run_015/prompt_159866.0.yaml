prompt: |-
  hey, looking for something practical here. I'm on the grants committee of a very small foundation that funds speculative high-upside stuff — about $1.2M a year, four trustees, no staff economist, and one two-hour meeting a month where we recieve something like forty proposals, so call it ten minutes each including the argument. Most of the inbox is junk, but last month we nearly funded something one trustee called "basically Pascal's mugging with a budget line": a guy wanted $5,000 to prevent 10^28 years of suffering inside a simulation he said he controlled. Instead of laughing we spent forty minutes arguing about why we were laughing, and not one of us could state the actual rule in a single sentence. A friend I was complaining to about this said the reason we flailed is that our objections came from three different places and we kept switching between them, which sounds right but doesn't help me write it down.

  So: I want a screening procedure we can run in ten minutes on a proposal. Roughly the shape I have in mind, but fix it if there's a better one — an ordered list of questions, what counts as a good enough answer to each one, the points where the procedure just stops with a NO (plus a one-line rationale I can paste into the minutes), and the points where it stops and hands the decision to a human because the question is one of values rather than facts. Constraints: no maths beyond what we can do on a phone, no writing back to applicants for more data (they never reply anyway), and it has to be defensible to a trustee who isn't a utilitarian and thinks expected-value reasoning is a cult. For each test, say in a clause which kind of answer to the mugging problem it's really implementing — the bounded-utility kind, the epistemic/process kind, the budget-relative kind, whatever — and say plainly which of those families you've decided against and why. Be honest about which steps are genuine checks and which are judgment calls in a lab coat.

  The cases that broke our discussion, and that the procedure has to actually handle:

  - The ordinary mugger: the payoff is astronomical and the person who picked the number is the person who benefits. My vague instinct is that the test should be something like — take the claim at size N, then ask what probability you'd give the *identical* claim with six more zeroes on the end, and if your number hasn't dropped by at least six orders of magnitude then you were never tracking the claim, you were tracking your mood. Also, a claim of size N seems to have vastly more ways of going wrong than ways of going right: the arithmetic, the model, plain dishonesty, self-deception, one soft step in a long chain of reasoning. I have no idea how to turn that into a line on a form; either make it one or tell me it can't be one.
  - The mirror: same person says give me $5,000 or I *cause* the 10^28 years of suffering. Whatever our rule is, it ought to give the same verdict to both, so tell me whether yours does and whether that symmetry is a feature or a trap.
  - The queue: even if one such proposal is fundable, we don't have infinite money, and if we say yes we should expect ten thousand more next month, all mutually compatible. Does the procedure say anything about the collective version, or is the collective version a different decision that we should stop and be humans about?
  - The black box: an applicant whose case is itself an expected-value calculation living in someone else's spreadsheet — "our model gives a 1-in-10^9 chance of saving 10^24 lives" — and who won't or can't decompose it. Is "we cannot audit this" itself a stopping rule, or does that just punish anyone with a private model?
  - The legitimate long shot that looks like a mugger on paper: a $60,000 pilot of an ultra-cheap water treatment in a district of roughly two million people, where the effect size comes from published dose-response data and not from the applicant, and where the pilot would tell us something either way. One trustee keeps insisting the real difference is that a grant buys information and a mugging doesn't. I think he's grabbed something true and can't let go of it; if it belongs in the procedure, put it in and say exactly where.

  Then run the finished thing on three proposals and show the work: (1) the simulation guy; (2) the $60,000 water pilot; (3) our own flagship program — $250,000 a year to a two-person group doing technical work on a speculative global threat, where our own in-house model says there's something like a 1-in-3,000 chance their work ends up pivotal for a catastrophe affecting ~10^10 future lives. Case 3 is the one I'm nervous about, because the numbers come from us rather than from a beneficiary but the shape is otherwise the same as case 1, and I'd much rather be told our procedure kills our own program than be handed a procedure that quietly exempts whatever we already happened to like. If it doesn't kill it, state the difference precisely enough that I could apply it to a stranger's proposal without playing favorites. And finish by telling me what the procedure is simply not for — which kinds of proposals it will systematically misclassify, and when we should stop consulting it and just argue.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small foundation ($1.2M/year), 4 trustees, no staff, 1 meeting/month, ~40 proposals/month (10 mins/proposal).
      *   **Problem:** Struggling with "Pascal's Mugging" style proposals (high impact, low probability, hard to verify) vs. legitimate high-upside speculative grants. They spent 40 mins arguing about *why* they rejected a simulation mugging without a clear rule.
      *   **Goal:** A 10-minute screening procedure (ordered list of questions, pass/fail criteria, stop rules).
      *   **Constraints:** No complex math (phone calc only), no contacting applicants, defensible to non-utilitarian trustees, must handle specific edge cases (Mugger, Mirror, Queue, Black Box, Legitimate Long Shot).
      *   **Requirements:**
          *   Identify which philosophical objection each step addresses (bounded utility, epistemic, budget, etc.).
          *   State which families of objections are rejected and why.
          *   Distinguish genuine checks from judgment calls.
          *   Run the procedure on 3 test cases (Simulation Mugger, Water Pilot, In-house Technical Work).
          *   Explain limitations (what the procedure is *not* for).
      *   **Tone:** Practical, honest, slightly cynical but rigorous, "no bullshit."

  2.  **Deconstruct the Philosophical Problem (Pascal's Mugging):**

      *   *The Core Issue:* Expected Value (EV) = Probability $\times$ Impact. If Impact $\to \infty$ fast enough, it overwhelms tiny Probability.
      *   *Objection Families:*
          1.  **Epistemic/Process:** The probability estimate is garbage/unfalsifiable. (The "Black Box" issue).
          2.  **Bounded Utility:** Humans don't actually value $10^{28}$ lives $10^{18}$ times more than $10^{10}$ lives. (Psychological reality).
          3.  **Budget/Queue:** Even if EV is positive, we can't fund all positive EV projects. Opportunity cost.
          4.  **Symmetry (Mirror):** Threat vs. Promise. If we pay to prevent, we incentivize threats.
          5.  **Information Value:** Does the grant teach us something regardless of outcome? (The Water Pilot argument).

      *   *Decision:* Which families to keep/reject?
          *   *Reject Bounded Utility as a formal rule:* Too hard to quantify in 10 mins. Trustees vary.
          *   *Reject Pure EV:* That's what got them into trouble.
          *   *Keep Epistemic/Process:* Can we verify the chain? Is the number external?
          *   *Keep Budget/Queue:* Finite money implies prioritization.
          *   *Keep Information Value:* A strong differentiator between science/pilots and muggings.
          *   *Keep "Claimant Benefit":* If the claimant defines the numbers *and* benefits, huge red flag.

  3.  **Drafting the Procedure (The "10-Minute Filter"):**

      *   *Structure:* Needs to be a funnel. Easy rejections first, harder judgments later.
      *   *Step 1: The Source of Numbers (Epistemic).* Who generated the impact/probability numbers?
          *   *Rationale:* If the applicant made them up to justify the ask, it's noise. If they come from external data/models, it's signal.
          *   *Mugging Test:* Addresses the "ordinary mugger" (self-serving numbers).
      *   *Step 2: The Falsification/Feedback Loop (Information Value).* Will we know if it worked?
          *   *Rationale:* Muggings are unfalsifiable. Pilots generate data.
          *   *Mugging Test:* Addresses the "legitimate long shot" vs. "mugger."
      *   *Step 3: The Chain of Causality (Epistemic/Process).* How many "soft" steps?
          *   *Rationale:* A long chain of uncertain events multiplies probabilities down faster than the applicant admits.
          *   *Mugging Test:* Addresses the "ways to go wrong" intuition.
      *   *Step 4: The Budget Cap (Queue/Budget).* Does this fit the portfolio?
          *   *Rationale:* Even good bets can't all be taken.
          *   *Mugging Test:* Addresses the "queue" problem.
      *   *Step 5: The Symmetry Check (Mirror).* Is this a threat or a promise?
          *   *Rationale:* Paying threats creates perverse incentives.
          *   *Mugging Test:* Addresses the "mirror" problem.

      *   *Refining the "Stop" Rules:* Need clear "NO" rationales for the minutes.
      *   *Refining the "Human Judgment" Points:* Where do trustees vote?

  4.  **Addressing Specific Constraints & Cases:**

      *   *Constraint:* No math beyond phone calc. *Solution:* Use orders of magnitude and "soft steps" counting rather than precise probabilities.
      *   *Constraint:* Defensible to non-utilitarian. *Solution:* Focus on *verifiability* and *incentives*, not just EV maximization.
      *   *Case 1 (Simulation):* Fails Source of Numbers (self-reported), Fails Feedback (unfalsifiable).
      *   *Case 2 (Water):* Passes Source (published data), Passes Feedback (pilot results), Passes Chain (direct intervention).
      *   *Case 3 (In-house):* This is the tricky one. It looks like a mugging (1 in 3,000, huge impact).
          *   *Differentiation:* The numbers come from *us* (trustees), not the applicant. The work is technical/verifiable. The feedback loop exists (technical milestones).
          *   *Risk:* Bias. *Mitigation:* Apply the "Source of Numbers" rule strictly. If the trustees can't explain *why* 1 in 3,000 without circular reasoning, it fails.

  5.  **Developing the "Philosophical Footnotes":**

      *   Need to explicitly state which objection family each step maps to.
      *   Need to state what was rejected (e.g., "Bounded Utility" is too subjective for a checklist).
      *   Need to be honest about "Judgment in a Lab Coat."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the pain point.
      *   *The Procedure:* 5 Gates.
      *   *Gate 1 (Provenance):* Who did the math? (Epistemic).
      *   *Gate 2 (Falsifiability):* Will we know? (Information Value).
      *   *Gate 3 (Causal Chain):* Count the "ifs". (Epistemic/Conjunction).
      *   *Gate 4 (Incentives):* Threat or Promise? (Mirror/Game Theory).
      *   *Gate 5 (Portfolio):* Can we afford the class of this grant? (Budget/Queue).
      *   *The Test Cases:* Walk through 1, 2, and 3 rigorously.
      *   *The "In-House" Bias Check:* Crucial section. How to ensure Case 3 isn't special pleading.
      *   *Limitations:* What does this miss? (e.g., paradigm shifts that look impossible initially).

  7.  **Review against Constraints:**

      *   *10 minutes?* Yes, if the questions are sharp.
      *   *No contact?* Yes, based on proposal text.
      *   *Phone math?* Yes, counting steps and orders of magnitude.
      *   *Defensible?* Yes, focuses on process and evidence, not just "feeling."
      *   *Mugging specific?* Yes, addresses the $10^{28}$ suffering claim directly.

  8.  **Final Polish:**

      *   Ensure the tone is appropriate (professional but direct).
      *   Make sure the "Stop with NO" rationales are copy-paste ready.
      *   Check the "Mirror" symmetry explicitly.
      *   Check the "Queue" logic (class of grants, not just single grant).

      *(Self-Correction during drafting)*: I initially thought about putting a probability threshold. *Correction:* No, trustees can't agree on probabilities. Better to ask about the *source* of the probability. If the applicant asserts $10^{-9}$ without a model, reject. If they cite a model, check the model's auditability.
      *(Self-Correction on Case 3)*: The prompt says the *in-house model* says 1 in 3,000. This is dangerous. It's essentially the foundation acting as the mugger to itself. I need to make sure the procedure flags this. The differentiator must be *verifiability of intermediate steps*. The simulation guy has no intermediate steps. The technical group does.

  9.  **Final Output Structure:**
      1.  Preamble (Philosophy & Exclusions).
      2.  The 5-Gate Procedure (Questions, Pass/Fail, Rationale).
      3.  Application to Test Cases.
      4.  The "In-House" Bias Check.
      5.  Limitations & When to Ignore the Procedure.

      *(Final check on the "Mirror" case)*: If the mugger says "Pay me or I simulate suffering," Gate 4 (Incentives) should catch this. Paying creates a market for threats. The procedure must explicitly reject "prevention of harm caused by the applicant."

      *(Final check on "Queue")*: Gate 5 handles this. If funding this implies funding 10,000 clones, we can't.

      *(Final check on "Black Box")*: Gate 1 handles this. If the model isn't auditable, it's a black box. Reject.

      Let's write it.cw
answer: |-
  Here is a screening procedure designed for your constraints: ten minutes, no contact, defensible to non-utilitarians, and robust against Pascal's Mugging.

  ### Part 1: The Philosophical Stance (What We Are and Aren't Doing)

  Before the checklist, you need to agree on what objections this procedure encodes. You cannot codify every philosophical objection, or you will never finish the meeting.

  **We are implementing:**
  1.  **Epistemic Hygiene:** We reject numbers that cannot be audited or traced to external data. (Addresses the *Ordinary Mugger* and *Black Box*).
  2.  **Information Value:** We prioritize grants that generate knowledge regardless of the "save." (Addresses the *Legitimate Long Shot*).
  3.  **Incentive Compatibility:** We reject proposals where funding creates a perverse incentive for others to mimic the request. (Addresses the *Mirror*).
  4.  **Portfolio Constraints:** We reject classes of grants that, if accepted as a principle, would exceed our budget. (Addresses the *Queue*).

  **We are explicitly rejecting:**
  1.  **Bounded Utility as a Rule:** We will not try to calculate whether $10^{28}$ lives is "too many." Trustees disagree, and it's subjective. We sidestep this by rejecting the *probability estimate* rather than the *impact value*.
  2.  **Pure Expected Value (EV):** We are not an EV maximizer. We are a risk-constrained speculator. If the EV is high but the variance is infinite and uncheckable, we pass.
  3.  **The "Mood" Test:** Your instinct about "six more zeroes" is correct psychologically, but hard to enforce in minutes. We replace it with the **Provenance Test** (who did the math?).

  **Honesty Check:** Steps 1, 3, and 4 are genuine checks (fact-based). Steps 2 and 5 are judgment calls in a lab coat (values-based). The procedure forces the judgment call to happen at a specific point, so you don't drift.

  ---

  ### Part 2: The 5-Gate Screening Procedure

  **Time Limit:** 10 Minutes.
  **Rule:** If a proposal fails a Gate, stop. Record the "Rejection Rationale" in the minutes. Do not proceed to the next Gate.

  #### Gate 1: Provenance of Numbers (Epistemic/Process)
  **Question:** Who generated the probability and impact numbers, and can we audit the derivation without the applicant's testimony?
  *   **Pass:** Numbers come from external data (published papers, government stats, historical baselines) OR the model is open-source/auditable by a trustee with relevant expertise.
  *   **Fail:** Numbers are asserted by the applicant ("I estimate," "Our model shows") without external anchors, or the model is proprietary/secret.
  *   **Rejection Rationale:** *"Unauditable probability estimate; claimant defines the variables of their own success."*
  *   **Mugging Implementation:** This kills the *Ordinary Mugger* and the *Black Box*. If the guy says he controls a simulation, he also controls the math proving it. That is a conflict of interest.

  #### Gate 2: The Feedback Loop (Information Value)
  **Question:** If the project fails to achieve its ultimate goal, will we still know something we didn't know before?
  *   **Pass:** Yes. A pilot produces data. A technical milestone is either met or not. We learn about the technology/method regardless of the "save."
  *   **Fail:** No. The outcome is binary and unobservable (e.g., "suffering prevented in a hidden simulation"). If it fails, we just lost the money with no signal.
  *   **Rejection Rationale:** *"No information value; failure yields no data to improve future decisions."*
  *   **Mugging Implementation:** This captures your trustee's intuition about the *Legitimate Long Shot*. A water pilot teaches us about water treatment even if it doesn't save the whole district. A mugging teaches us nothing.

  #### Gate 3: Causal Chain Length (Epistemic/Conjunction)
  **Question:** Count the number of "soft" steps required for the impact to occur. (A "soft" step is a human decision, a theoretical leap, or an unproven technology).
  *   **Pass:** 3 or fewer soft steps.
  *   **Fail:** 4 or more soft steps.
  *   **Rejection Rationale:** *"Causal chain exceeds risk tolerance; probability of conjunction collapse is unquantified."*
  *   **Mugging Implementation:** This addresses your intuition about "ways to go wrong." A mugging usually requires: (1) Applicant is honest, (2) Theory is real, (3) Money triggers action, (4) Action works, (5) No side effects cancel it. That's 5 steps. Each step <100% probability crushes the EV. Limit the chain.

  #### Gate 4: Incentive Symmetry (The Mirror)
  **Question:** If we fund this, does it create a financial incentive for bad actors to make similar claims?
  *   **Pass:** No. (e.g., Funding research doesn't incentivize fake researchers easily because of Gate 1 & 2).
  *   **Fail:** Yes. Specifically, if the proposal involves *preventing harm that the applicant claims they can cause*.
  *   **Rejection Rationale:** *"Adverse selection risk; funding creates a market for threats."*
  *   **Mugging Implementation:** This handles the *Mirror*. If you pay the simulation guy to stop suffering, you have just put a bounty on "people who claim to control simulations." You must reject the threat version even if the promise version looked plausible (though the promise version likely died at Gate 1).

  #### Gate 5: Portfolio Scalability (The Queue)
  **Question:** If we accept the *principle* of this grant, could we fund 100 similar proposals within our annual budget without diluting impact?
  *   **Pass:** Yes, or the class of proposal is naturally rare (e.g., "only 3 groups in the world do this").
  *   **Fail:** No. If the criteria are loose enough that 100 applicants could plausibly meet them, we cannot fund them all, so we cannot fund this one based on EV alone.
  *   **Rejection Rationale:** *"Portfolio saturation; accepting this principle exceeds annual budget capacity."*
  *   **Mugging Implementation:** This handles the *Queue*. Pascal's Muggings are theoretically infinite. You cannot fund infinite positive-EV bets. You must fund the *best* positive-EV bets. If this class of bet is common, it's not the best.

  ---

  ### Part 3: Running the Test Cases

  Here is how the procedure handles your three specific scenarios.

  #### Case 1: The Simulation Mugger ($5k for 10^28 years suffering)
  *   **Gate 1 (Provenance):** **FAIL.** The applicant generated the numbers ("he said he controlled"). No external audit possible.
  *   **Stop.**
  *   **Minutes:** *"Unauditable probability estimate; claimant defines the variables of their own success."*
  *   **Time taken:** 2 minutes.
  *   **Note:** It doesn't even reach the "Mirror" test. It dies on the math being self-serving.

  #### Case 2: The Water Pilot ($60k, 2M people, published data)
  *   **Gate 1 (Provenance):** **PASS.** Effect size from published dose-response data, not applicant's guess.
  *   **Gate 2 (Feedback):** **PASS.** Pilot tells you if the treatment works in this district regardless of total lives saved.
  *   **Gate 3 (Chain):** **PASS.** (1) Buy filters, (2) Distribute, (3) People use them. (3 soft steps).
  *   **Gate 4 (Incentives):** **PASS.** Funding water filters doesn't incentivize people to threaten water poisoning.
  *   **Gate 5 (Queue):** **PASS.** There are not 10,000 valid water pilots available next month.
  *   **Decision:** **Human Vote.** (Procedure says "Go to Trustees").
  *   **Time taken:** 8 minutes.

  #### Case 3: In-House Technical Group ($250k, 1 in 3,000, 10^10 lives)
  *This is the stress test. It looks like a mugging on paper.*

  *   **Gate 1 (Provenance):** **PASS (Conditional).** The numbers come from *us* (the trustees), not the applicant. This bypasses the "claimant benefit" conflict. *Condition:* The trustees must be able to write down the derivation of "1 in 3,000" in the minutes. If it's a "vibe," it fails Gate 1.
  *   **Gate 2 (Feedback):** **PASS.** Technical work produces milestones. Even if they don't solve the threat, we know if the tech is viable.
  *   **Gate 3 (Chain):** **CHECK.** Does the 1 in 3,000 account for the chain? (1) Tech works, (2) Policy adopts it, (3) Catastrophe was imminent, (4) Tech stops it. If the model assumes all this without discounting, it fails Gate 3. Let's assume your model accounts for conjunction.
  *   **Gate 4 (Incentives):** **PASS.** Funding technical defense does not incentivize bad actors to create threats (unlike the Mirror case).
  *   **Gate 5 (Queue):** **PASS.** There are not 100 groups doing this specific technical work. It is naturally scarce.
  *   **Decision:** **Human Vote.**
  *   **Time taken:** 10 minutes.

  **The Crucial Differentiator (Case 1 vs Case 3):**
  You asked for the precise difference so you aren't playing favorites.
  *   **Case 1:** The probability is **Private and Unfalsifiable**. Only the mugger knows if he controls the simulation.
  *   **Case 3:** The probability is **Public and Falsifiable**. Your foundation is staking its reputation on the "1 in 3,000." If you fund 3,000 such groups and none succeed, your model is proven wrong. The mugger faces no such reputational risk.
  *   **Procedure Enforcement:** To prevent bias, you must enforce Gate 1 on yourselves. If you cannot write down the derivation of the 1 in 3,000 in the minutes, you must reject your own flagship program.

  ---

  ### Part 4: Limitations & When to Ignore the Procedure

  This procedure is a filter, not a decision engine. It is systematically biased against certain types of value. You need to know when to override it.

  **1. The "Paradigm Shift" False Negative**
  *   **Problem:** Genuine breakthroughs often look like black boxes initially. If Einstein applied for a grant on relativity in 1905, he might have failed Gate 1 (no external data) and Gate 3 (too many theoretical leaps).
  *   **When to Override:** If the applicant is a known entity with a track record of high-variance success, and the trustees have domain expertise. You can waive Gate 1 for "Track Record" but you must record the waiver.

  **2. The "Moral Hazard" of In-House Models (Case 3)**
  *   **Problem:** You are the auditor and the beneficiary of Case 3. It is very easy to convince yourself your model is "auditable" when it's actually a vibe.
  *   **When to Override:** If the "1 in 3,000" cannot be decomposed into sub-probabilities (e.g., 1/10 tech works $\times$ 1/30 deployment $\times$ 1/10 timing), you must treat it as a Black Box and reject it. Do not allow "holistic intuition" to pass Gate 1 for your own grants.

  **3. The "Queue" Reality**
  *   **Problem:** Gate 5 assumes you can estimate the queue. You can't.
  *   **When to Override:** If you find yourself funding multiple "Queue" borderline cases in one year, stop. The procedure doesn't account for cumulative risk. If you fund 5 "1 in 3,000" shots, your risk profile changes. Use Gate 5 as a hard cap: "We will fund max X grants of this class per year."

  **4. When to Stop Consulting the Procedure**
  *   Stop using the checklist if the proposal passes all 5 gates and the trustees *still* feel uneasy. That unease is often the "Bounded Utility" objection we sidelined.
  *   In that specific case (Pass all gates, still feel no), do not force the grant. Record: *"Passed screening, but trustees exercise veto based on portfolio risk tolerance."*
  *   Conversely, if a proposal fails Gate 1 (like the Mugger) but a trustee *really* wants to fund it, do not bend the rule. The rule exists to protect you from your own optimism.

  ### Summary for the Minutes
  When you reject the Simulation Mugger, you don't need to argue about the value of simulated lives. You paste this:
  > *"Proposal rejected at Gate 1: Probability and impact estimates are self-generated by the claimant without external auditability. This creates an unmanageable conflict of interest and prevents verification of expected value."*

  This is defensible to a non-utilitarian (it's about fraud risk), defensible to a utilitarian (it's about bad data), and takes 30 seconds to read.
