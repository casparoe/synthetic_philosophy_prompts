  9.  **Final Polish:** Ensure the distinction between "ontological reality" and "normative validity" is clear in the Ratchet section. (Self-Correction: Keep it simpler. Focus on the logical inconsistency first).

      *   *Wait, one nuance on Race (7):* The user says stop using it in biomed *because* it drags people back to essence. But if (3) is true (it's real via social causation), then removing it erases the social causation from the data. This is a strong tension. I need to highlight that.

      *   *Wait, one nuance on Gender (6):* "Authoritative" doesn't mean "Ontologically distinct." It might mean "Epistemically privileged." I should point out that distinction.

      *(Self-Correction during drafting)*: Keep the focus on the *set* provided. Don't import too much external philosophy unless it clarifies the internal tension.

