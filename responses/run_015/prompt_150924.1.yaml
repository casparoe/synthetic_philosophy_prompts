answer: |-
  Here is a prediction of your professor's verdict, the implicit rule driving it, alternative interpretations, and a strategy for your response.

  ### 1. Predicted Verdicts
  Based on her track record, she will likely **carve the trait up** rather than giving a single label for the "crest."

  *   **Head Depth (and Crest Height):** **Adaptation.**
      *   *Reasoning:* There is strong evidence of selection on head depth (male-male contests), and crest height scales perfectly with depth. This fits the *Industrial Moth* and *Sexual Display* precedents: selection acts on variation (depth), conferring a fitness benefit (fighting success).
  *   **Crest Shape (Leading Edge/Thickness):** **Exaptation** (for wedging).
      *   *Reasoning:* This is the critical move. While the shape is a "precise fit" for wedging, the prompt states "nobody has found variation in it independent of depth." Following the *Human Reading* and *Panda's Thumb* precedents, a trait can be functional and even maintained by selection, but if its form is constrained by a different adaptation (head depth for fighting), it is not an adaptation *for that function*. It is machinery built for fighting, co-opted for wedging.
  *   **Wedging Behavior:** **Adaptation.**
      *   *Reasoning:* Behavioral plasticity usually escapes the developmental constraints of morphology. If the lizard *chooses* to wedge, that behavioral decision is likely selected for, even if the tool it uses is an exaptation.
  *   **Overall Verdict on the "Crest for Wedging":** **Not an Adaptation.** She will likely insist that calling it an adaptation for wedging is a "just-so story" because the causal variation is locked to the fighting trait.

  ### 2. The Implicit Rule: The Independent Variation Constraint
  Your professor is running a version of Adaptationism that requires **Selectable Independent Variation**.

  **The Rule:** A trait $T$ is an **Adaptation** for Function $F$ if and only if:
  1.  $T$ contributes to fitness via $F$; **AND**
  2.  There exists heritable variation in $T$ (or the specific aspect of $T$ relevant to $F$) that is **independent** of variation in other traits under selection for a different function $G$.

  If $T$ is useful for $F$ but its variation is developmentally or functionally locked to a trait $U$ selected for $G$, then $T$ is a **Spandrel** (if non-functional) or **Exaptation** (if functional) relative to $F$, and an Adaptation only relative to $G$.

  **How to Test It:** Look for the phrase "independent variation" or "confounded correlation" in her feedback. In every case where she ruled *Adaptation*, variation was specific to the function (moth color, display cost, panda enlargement). In every case where she ruled *Exaptation/Spandrel*, the trait was either non-functional (nipples), locked to other machinery (reading, beetle patch), or constrained by a prior trait (panda bone).

  ### 3. Alternative Rules (and Why They Diverge)
  Here are two competing rules that fit her past verdicts but predict differently for the lizard.

  **Alternative A: The Current Maintenance Rule**
  *   **Rule:** If a trait is currently maintained by natural selection for Function $F$ (i.e., removing it reduces fitness via $F$), it is an **Adaptation** for $F$, regardless of origin or correlation.
  *   **Fit to Past:** Fits *Case 6* (F $\to$ G maintained for G = Adaptation) and *Moth* and *Display*. Can explain *Reading* as Exaptation only if one argues reading isn't "maintained by selection" in the biological sense (cultural vs. genetic).
  *   **Prediction for Lizard:** **Adaptation for Wedging.** The shaving experiment shows reduced survival via wedging. The correlation with head depth is irrelevant; if selection keeps it, it's an adaptation.
  *   **Why I'd Bet Against It:** It ignores her sympathy for Gould/Lewontin. The *Beetle* verdict ("appearance of design is not evidence") suggests she requires more than just a fitness fit; she requires evidence that selection *shaped* the design, not just that it *keeps* it.

  **Alternative B: The Historical Origin Rule**
  *   **Rule:** A trait is an **Adaptation** for $F$ only if the *origin* of the trait was driven by selection for $F$. If it originated for $G$ or as a by-product, it is forever an Exaptation or Spandrel, even if currently maintained for $F$.
  *   **Fit to Past:** Fits *Reading*, *Nipples*, *Panda Bone*, *Beetle*.
  *   **Prediction for Lizard:** **Exaptation/Spandrel.** The crest originated for ossification/fighting, not wedging.
  *   **Why I'd Bet Against It:** It contradicts *Case 6* directly. She explicitly ruled that a trait originally for $F$ but now maintained for $G$ is an **Adaptation for $G$**. History is demoted to a constraint; current maintenance can upgrade Exaptation to Adaptation.

  **My Bet:** I am betting on the **Independent Variation Constraint**. It reconciles *Case 6* (which implies variation existed for $G$) with the *Beetle* and *Reading* cases (where variation was absent or locked). It allows current maintenance to count (unlike Alternative B) but blocks "free rider" traits from counting as adaptations (unlike Alternative A).

  ### 4. Decisive Evidence: Breaking the Correlation
  To distinguish the **Independent Variation Rule** from the **Current Maintenance Rule**, you need to decouple Head Depth from Crest Shape.

  **The Experiment:**
  You need a population (or an artificial selection line) where **male-male competition is absent** (removing selection for Head Depth) but **predation is high** (maintaining selection for Wedging).
  *   **Prediction (Variation Rule):** If the crest is an Adaptation for wedging, the shape should refine for wedging *independently* of depth. If it is an Exaptation/Spandrel, the crest shape should degrade or remain locked to depth even if depth is no longer selected for.
  *   **Prediction (Maintenance Rule):** As long as wedging confers survival, the trait remains an Adaptation, regardless of whether it drifts away from head depth.

  **The "Smoking Gun":**
  Find a natural population where head depth varies *without* crest shape varying (or vice versa). If you find individuals with deep heads but "bad" wedging shapes (or shallow heads with "good" wedging shapes), and selection acts on the shape *independently*, she must concede Adaptation. If the correlation holds perfectly across all environments, the Variation Rule dictates Exaptation.

  ### 5. The Unstable Verdict: Case 6 (The F $\to$ G Switch)
