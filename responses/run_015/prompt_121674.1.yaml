answer: |-
  A strict Rationalist runs into a friend he owes fifty dollars.

  "Ah," says the Rationalist, "I have been meditating on our arrangement. I have successfully derived, from the Principle of Sufficient Reason, that fidelity is a perfection and that promises must necessarily be kept. To violate a pledge would be to introduce a contradiction into the moral order."

  "Great," says the friend. "So, here's my Venmo."

  "Hold on," says the Rationalist. "While the *obligation* is a necessary truth, the *parties* are contingent. I know with absolute certainty that *someone* owes *someone* fifty dollars. But I cannot deduce from the concept of perfection that *I* am the debtor, that *you* are the creditor, or even that *this* fifty-dollar bill is the substance required to settle the account. These are truths of fact, dependent on which possible world we occupy."

  "But we're in the actual world," says the friend. "And you bought me lunch."

  "That is empirical data," the Rationalist replies, shaking his head. "To act on it would be to confuse the necessary form of justice with its contingent content. I cannot verify my own identity as the 'Borrower' without sensory experience, and sensory experience is fallible."

  "So you're keeping the money?"

  "On the contrary! I am respecting the duty too much to risk misapplying it. I am holding the fifty dollars in trust for the *Necessary Creditor*. Whether you are His contingent agent is a matter of historical verification I haven't funded yet."

  The friend sighs. "You're never going to pay me, are you?"

  "I have already paid you," the Rationalist says, pocketing the cash. "I have paid the *concept* of the debt. Whether the contingent dollars transfer to your contingent hand is up to the pre-established harmony."
