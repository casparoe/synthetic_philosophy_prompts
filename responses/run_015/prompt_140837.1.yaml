  **BUREAU OF CONVERGENT INTUITIONS**
  **INTERNAL MEMORANDUM 12.04.F**

  **TO:** Oversight Committee, Convergence Mandate
  **FROM:** Directorate of Epistemic Hygiene
  **DATE:** 15 November, Year 12
  **SUBJECT:** Final Determination on Moral Fact F-742 via Residual Sample Protocol

  **1.0 Mandate Fulfillment**
  Pursuant to the Convergence Mandate (Year 0), the Bureau was tasked with isolating universal moral constants from the noise of cultural particularity. This report confirms the successful isolation of Fact F-742. The following sections detail the data sanitation procedures required to distinguish signal from variance.

  **2.0 Sampling and Exclusion Criteria**
  Initial data collection involved 12,450 subjects across 44 distinct linguistic zones. To ensure conceptual fidelity, the Bureau applied the Residual Sample Protocol. This multi-stage winnowing process removes responses contaminated by interpretive drift.

  First, subjects failing the Comprehension Gate (CG-9) were excluded. This ensures participants understood the vignette as a moral dilemma rather than a pragmatic or spiritual inquiry. Second, subjects who re-described the vignette using local idioms incompatible with the Bureau's ontological framework were classified as having non-moral construals. Their data was archived but excluded from convergence calculations. Third, cohorts exhibiting sensitivity to syntactic rewording were deemed unstable. If a cohort's agreement rate shifted by >5% under synonymous phrasing, the cohort was down-weighted to zero. Finally, any cohort displaying internal variance exceeding the Standard Deviation Threshold (σ > 0.4) was treated as epistemically noisy.

  **3.0 Attrition Metrics**
  The application of these hygiene filters resulted in the following attrition trajectory:

  | Stage | Description | N Remaining |
  | :--- | :--- | :--- |
  | 1 | Initial Pool | 12,450 |
  | 2 | Post-Comprehension Gate | 8,102 |
  | 3 | Post-Idiomatic Filtering | 3,450 |
  | 4 | Post-Stability Check | 890 |
  | 5 | Post-Variance Threshold | 41 |

  **4.0 Fieldwork Anomalies**
  During Stage 3, Field Officer J. Aris submitted a query regarding the Idiomatic Filtering criteria, noting: "If we exclude everyone who describes the problem differently, we are only counting people who already describe the problem like us." This objection is currently being administratively processed under Protocol 99 (Methodological Dissent Review) and does not invalidate the current dataset.

  **5.0 Conceptual Discount Rate**
  Remaining data from non-headquarters-adjacent cohorts were subjected to the Conceptual Discount Rate (CDR). As defined in Annex A, the CDR reduces the weight of responses from populations with high lexical divergence from the Bureau's standard operating English. This corrects for the risk that differing vocabulary indicates differing concepts rather than differing moral truths.

  **6.0 The Convergent Proposition**
  The Residual Sample (N=41) demonstrated 100% agreement on the following proposition: "Agents generally prefer to avoid inflicting unnecessary harm on conspecifics when agency is clear and no higher-order normative conflict is present." This statement represents the maximum specificity allowable without triggering variance in the remaining sample.

  **7.0 Determination of Status**
  Given the perfect convergence within the sanitized residual sample, and the application of appropriate discount rates to divergent data, the Directorate classifies Proposition F-742 as an **objective** moral fact. The variance observed in the initial pool is hereby reclassified as performance error rather than evidence of moral disagreement.

  **8.0 Next Steps**
  Funding for Year 13 will focus on refining the Comprehension Gate to ensure future residual samples maintain this level of fidelity.

  ***

  **ANNEX A: DEFINITION OF CONCEPTUAL DISCOUNT RATE (CDR)**

  The CDR is a weighting coefficient (0.0–1.0) applied to cohort responses based on lexical proximity to Bureau Standard English (BSE).

  *Formula:* CDR = 1 – (L_div / L_max)

  Where *L_div* is the count of non-BSE moral predicates used during the debriefing interview, and *L_max* is the maximum allowable predicates before conceptual incommensurability is assumed. Cohorts exceeding *L_max* are assigned a CDR of 0.0. This ensures that data contributing to the final fact calculation relies only on subjects utilizing the correct conceptual schema. High variance in non-WEIRD cohorts is typically correlated with high *L_div*, resulting in automatic down-weighting. This prevents the dilution of universal constants by local semantic noise.

  ***

  Target: The practice of establishing moral universals by excluding divergent cultural data as "noise" or "error" until only the researcher's own community remains.
