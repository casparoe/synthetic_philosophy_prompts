      *   *Defenders of the Standard View:*
          *   They would argue that Critical history is the *condition of possibility* for new Monumental history. You can't have new greatness without clearing the rubble.
          *   They would point to the "limit" argument: Each mode has a natural limit. When Antiquarianism exceeds its limit, it mummifies. When Critical exceeds its limit, it uproots. But within its limit, Critical is healthy.

      *   *Modern Archival Culture Prediction:*
