  **The Sealed Packet**

  The draft consumed the last of the paper,
  Warm wax hardened under the seal.
  I left a pencil mark
  Where the sum broke the line.
  No one checks the date
  On a private copy.

  Who reads a private copy?
  It rests on common paper,
  Ignored until the date
  Matches another seal.
  I traced the falling line,
  A faint and private mark.

  A marginal mark,
  Lost beside the fair copy.
  They demand a straight line,
  Printed on official paper.
  Authority lives in the seal,
  Not the hand, but the date.

  I fixed the public date,
  Clear as a birth-mark.
  The Society broke the seal,
  Distributed the copy.
  It filled the learned paper,
  Drawing a new line.

  It crosses every line,
  Back to that original date.
  Nothing stays on loose paper,
  Without a distinguishing mark.
  I sent them the copy,
  Secure beneath the seal.

  Broken is the seal,
  Running along the line.
  They keep the only copy,
  Ignoring the prior date.
  I leave the final mark,
  On permanent paper.

  Same paper, same mark, a conflicting copy,
  Who owns the broken seal?
  Does the prior date draw the line?

  ***

  **Note on Form and Voice**
  End-words: *paper, seal, mark, line, date, copy*. The sestina follows the standard retrograde permutation. Stanzas 1–3 voice the unnamed claimant (private, physical, anxious); stanzas 4–6 voice the named claimant (public, authoritative, definitive). The envoi voices the historian. The end-words shift context: *mark* moves from pencil scratch to notation; *seal* from wax to authority; *date* from letter to era. The form enforces the retrospective unification of two distinct acts into one history, while the envoi refuses to resolve the priority dispute.
