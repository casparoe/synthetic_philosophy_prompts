answer: |-
  # Q&A Prep Sheet: "Verisimilitude on a Budget"

  **Talk Duration:** 40 mins | **Q&A:** 20 mins
  **Goal:** Survive the hour without conceding the core thesis, while appearing reasonable to the realists.

  ### Strategic Concessions (Build These Into the Talk)
  Do not wait to be pressed on these. If you introduce them as features rather than bugs during the presentation, you blunt the sharpest weapons.
  1.  **To the Senior Realist:** Explicitly state in the introduction that this is not an account of *ontological* closeness (the relation between theory and world simpliciter), but of *scientific* truthlikeness (the relation between theory and world *for an inquirer*). If you don't draw this line, you will be accused of conflating epistemology with metaphysics.
  2.  **To the Metaphysician:** Acknowledge early that the partition $Q$ is not metaphysically privileged. State clearly that admissibility is constrained by the *current state of the discipline*, not by the joints of nature. This preempts the charge that you can gerrymander $Q$ to make any theory win.

  ### The Crucial Reply
  **The Survival Condition:** You must successfully defend the claim that **relativizing truthlikeness to a budget does not reduce it to mere pragmatic utility.**
  If the Senior Realist convinces the room that you have simply rebranded "usefulness" as "truthlikeness," the paper fails. Your reply must maintain that the *target* of the inquiry is the truth (the actual world), and the budget merely constrains the *path* to assessing it. The measure is still truth-directed, even if path-dependent.

  ---

  ### The Eight Objections (Ordered by Damage Potential)

  #### 1. The "Subject Change" Objection
  **Who:** The Senior Scientific Realist
  **Vocabulary:** "Mind-independent," "Conflation," "Epistemic Utility."
  **The Challenge:** "You say this is an account of truthlikeness, but you've defined it in terms of our limitations, budgets, and available inquiries. You haven't given us a measure of how close a theory is to the world; you've given us a measure of how useful a theory is given our current poverty. You've replaced an ontological notion with an epistemic one."
  **Concede:** You are right that this is not a measure of mind-independent ontological closeness.
  **Hold:** Scientific truthlikeness *must* be relativized to inquiry to be meaningful for the philosophy of science.
  **Reply:** "I agree that ontological closeness is budget-invariant. But scientific progress isn't just about the limit; it's about the trajectory we can actually navigate. If Theory A is ontologically closer but requires resources we won't have for a century to verify, while Theory B is slightly less close but guides successful inquiry now, calling B 'more truthlike' in the scientific sense captures why we prefer it. I'm not analyzing the relation between theory and world; I'm analyzing the relation between theory, world, and *inquirer*. That's the relation that matters for scientific realism."
  **Soft Spot:** They may insist that if it varies with budgets, it's not *truth*likeness at all, but just 'assertibility.'

  #### 2. The "Gerrymandering" Objection
  **Who:** The Metaphysician
  **Vocabulary:** "Admissibility," "Carving at joints," "Trivialization."
  **The Challenge:** "If truthlikeness depends on the partition $Q$, what stops me from choosing a $Q$ that makes my favorite theory win? If I define the questions such that the true answers align with my theory's errors, I can make a false theory look truthlike. What constrains admissible partitions?"
  **Concede:** Unconstrained choice of $Q$ would trivialize the measure.
  **Hold:** $Q$ is not chosen by the philosopher; it is fixed by the scientific community's agenda.
  **Reply:** "The partition isn't up for grabs in the way you fear. $Q$ represents the *actual* questions the field is asking, not questions a philosopher invents to save a theory. If a field isn't asking a question, it doesn't enter the calculation. This isn't gerrymandering; it's recognizing that truthlikeness is relative to a research program. If the program asks the wrong questions, the measure will reflect that, but it won't be mathematically trivial."
  **Soft Spot:** This makes truthlikeness sociological. If the community asks bad questions, your measure says the theory is truthlike relative to them, which sounds like relativism.

  #### 3. The "Credence" Objection
  **Who:** The Formal Epistemologist
  **Vocabulary:** "Strictly proper scoring rules," "Gradational," "Binary acceptance."
  **The Challenge:** "Why are you working with binary acceptance of theories? Accuracy-first epistemology shows that graded credences are the only coherent way to track accuracy. Your 'best policy' looks like a decision-theoretic shortcut that ignores the uncertainty inherent in the menu $M$."
  **Concede:** Graded credences are more fine-grained.
  **Hold:** Scientists operate with accepted theories for the purpose of designing inquiries, not just holding credences.
  **Reply:** "Credences are essential for belief, but inquiry requires commitment. To design an experiment from menu $M$, you must act *as if* certain theoretical assumptions hold. My account models the accuracy of the *output* of that inquiry process. You can plug credences into the 'best policy' function, but the truthlikeness of the theory itself depends on how well it guides that binary commitment under budget constraints."
  **Soft Spot:** If their scoring rules show your binary approach is provably less accurate, your "expected accuracy" claim looks weak.

  #### 4. The "Circular Cost" Objection
  **Who:** Internal Coherence (Likely the Formalist or Realist)
  **Vocabulary:** "Primitive," "Independent measure," "Detection."
  **The Challenge:** "You define the cost of an error as the budget share required to detect and repair it. But to know how much budget is needed to repair it, don't you already need to know how far from the truth the theory is? You're using truthlikeness to define cost, and cost to define truthlikeness."
  **Concede:** The cost is not ontologically independent of the error.
  **Hold:** The cost is methodological, based on the *available* menu $M$, not the metaphysical distance.
  **Reply:** "The cost isn't about the metaphysical distance to the truth; it's about the instrumental difficulty of finding the correction using *available* tools. We can estimate the cost of an inquiry without knowing the outcome. If a test is expensive, it's expensive regardless of whether the theory is true or false. The circularity is only apparent; we are measuring the cost of *access*, not the cost of *being*."
  **Soft Spot:** Estimating the cost of repair often requires knowing the nature of the error, which requires knowing the truth.

  #### 5. The "Limit" Objection
  **Who:** The Formal Learning Theorist
  **Vocabulary:** "Identification in the limit," "Reliability," "Short-run."
  **The Challenge:** "Learning theory focuses on convergence to the truth in the limit. Your measure prioritizes the short-run budget. What guarantees that a theory that is 'truthlike on a budget' doesn't lead us into a dead end that prevents convergence later? You might be optimizing for local accuracy at the expense of reliability."
  **Concede:** There is no guarantee that budget-optimality equals limit-optimality.
  **Hold:** Science happens in the short run; the limit is a regulative ideal, not a practical metric.
  **Reply:** "Convergence in the limit is necessary but not sufficient for scientific progress. We need to know which theory to fund *now*. A theory that is cheaply correctable is more valuable to a resource-constrained field than one that is theoretically perfect but requires unobtainable data to verify. My account captures the trade-off between long-term truth and short-term viability."
  **Soft Spot:** If the budget-optimal path systematically leads away from the limit, your measure rewards error.

  #### 6. The "Whig History" Objection
  **Who:** The Historian of Science
  **Vocabulary:** "Retrospective rationalization," "Problem-solving," "Lost theories."
  **The Challenge:** "You can always reconstruct past science to make the winners look truthlike on a budget. What about the theories that were discarded but were actually cheaper to work with? Your measure seems designed to justify the victors of history rather than evaluate them."
  **Concede:** Retrospective application risks Whig history.
  **Hold:** The measure is meant to evaluate the rationality of the choice *at the time*, given the budget *then*.
  **Reply:** "If applied correctly, the measure should show why certain theories were rational *then* even if they are false *now*. If phlogiston was cheaper to use for the questions chemists were asking then, my account says it was more truthlike *relative to that horizon*. That's not justifying the victors; it's explaining why the losers were abandoned when budgets and questions changed."
  **Soft Spot:** It's very easy to tweak the historical 'budget' to make the actual winner come out on top.

  #### 7. The "Case Study" Objection
  **Who:** Philosophy of Special Sciences
  **Vocabulary:** "Concrete episode," "Reconstruction," "Verdicts."
  **The Challenge:** "This is all abstract machinery. Can you run this on a real case? Show me a historical dispute where standard accounts fail but your budget account gives the right verdict."
  **Concede:** The paper is currently theoretical.
  **Hold:** The framework is designed to be applicable, not just illustrative.
  **Reply:** "Consider the shift from Newtonian to Einsteinian mechanics. For low-energy questions (agenda $Q$), Newton is cheaper to compute (budget $b$). My account explains why Newtonian mechanics remains 'truthlike' for engineering agendas even after being falsified. Standard accounts struggle to explain why a falsified theory retains cognitive value; mine explains it via the cost of inquiries in $M$."
  **Soft Spot:** If they press for a case where the *false* theory was preferred but your account says it shouldn't have been, you might struggle to calculate the costs.

  #### 8. The "Normative" Objection
  **Who:** General / Methodologist
  **Vocabulary:** "Prescriptive," "Evaluative," "Guide."
  **The Challenge:** "Is this a guide for how scientists *should* choose theories, or a measure of how they *did* progress? If it's prescriptive, it's just methodology. If it's descriptive, it's just history. It doesn't seem to do the philosophical work of truthlikeness."
  **Concede:** It blurs the line between normative and descriptive.
  **Hold:** It is evaluative: it assesses the rationality of progress relative to constraints.
  **Reply:** "It's a normative measure of scientific rationality under constraints. It tells us whether a community was right to prefer $T$ over $T^*$ given what they could afford to ask. That's the core work of philosophy of science: evaluating the rationality of inquiry, not just the logic of discovery."
  **Soft Spot:** If it's too normative, it ignores actual practice. If too descriptive, it loses philosophical bite.

  ---

  ### The Dangerous Question
  **The Question:** "If the budget $b$ drops to zero, does truthlikeness collapse into current accuracy?"

  **Why it's dangerous:**
  If $b=0$, no further inquiries are allowed. The "best policy" is just to answer $Q$ based on $T$ as it stands. Your definition of truthlikeness becomes "expected accuracy of $T$ given $Q$."
  This collapses the distinction between **truthlikeness** (closeness to the whole truth) and **accuracy** (correctness on specific questions).
  If you admit this, the Senior Realist will argue you haven't solved the Popper/Tichý problem at all; you've just renamed accuracy. If you deny it, you have to explain what "truthlikeness" means when no further inquiry is possible, which undermines the "Budget" part of your title.

  **Preparation:**
  Be ready to say: "Even with $b=0$, the measure evaluates the *content* of $T$ against $Q$, not just the truth value. It captures how much of the *structure* of the answer $T$ gets right, not just if it's true. But yes, without a budget for repair, truthlikeness and accuracy converge. That's why the budget parameter is essential—it captures the *potential* for correction, which is part of what we mean by a theory being 'close' to the truth."
