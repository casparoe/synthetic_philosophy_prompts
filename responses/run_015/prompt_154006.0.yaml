  1. Brainstorm and Design Rationale
  Three visceral methods: (1) Manual sorting of historical cases; (2) Role-playing experts advocating conflicting base rates; (3) Forced dimension discarding. Selection: (3) compels active rejection of valid data, creating ownership of arbitrariness. Reference classes: Software Projects (85% failure), Organizational Mergers (40% failure), Evolutionary Systems (10% failure). Tension: System K is ontologically hybrid; excluding any class ignores a constitutive element, yet including all three yields no single probability. Participants must treat incompatible natural kinds as mutually exclusive for calculation, simulating the absence of a neutral meta-rule. It forces visceral engagement.

  2. Materials and Role Assignments
  Materials: One-page "System K Dossier" containing the narrative and three data tables corresponding to the reference classes. Three sets of colored "Triage Assignment Cards" (Red, Green, Blue) specifying the discarded dimension. Individual "Credence Slips" for final probability submission. A visible "Leaderboard" sheet for tracking scores. Roles: Participants divided into three teams of 4-5. Each team receives a Triage Card assigning them which reference class to discard (e.g., Team Red ignores Software data). All teams receive identical Dossiers. The facilitator holds the Resolution Key (sealed until debrief). No external devices allowed; calculation must be manual or mental to prevent hiding behind external tools. This ensures cognitive load remains on classification choice.

  3. Rules, Incentives, and Payoff Structure
  Rules: Teams deliberate for 30 minutes using only their two retained reference classes. The discarded class is taboo; citing it invalidates the team's score. Individuals submit a final credence (0-100%). Incentives: Scoring uses "Accuracy Points" (100 minus absolute error, 100=perfect, 0=wrong). The participant with the lowest score buys coffee for the group. This social stake ensures engagement without financial risk. Crucially, teams are not competing against each other for a prize; the divergence is the point. The payoff punishes individual inaccuracy, forcing participants to trust their triage choice despite knowing other teams possess different data exclusions. This isolates the reference class selection as the variable driving divergence. The facilitator must enforce the taboo rigorously to maintain the experimental conditions. If a team averages their base rates, they must justify the weighting. There is no prescribed aggregation method, mirroring the lack of a meta-rule. Scoring is individual to prevent free-riding. The rules explicitly forbid discussing assignments between teams until the Confrontation phase. This isolation ensures that the resulting credence gaps are purely products of the retained reference classes, not interpersonal persuasion. Facilitators monitor compliance. This ensures the cognitive burden rests on the classification choice. Participants record reasoning on Credence Slips to prevent post-hoc rationalization. This documentation aids the facilitator in highlighting divergent logic paths. The coffee penalty applies even if divergence was structurally induced, reinforcing that structural bias does not absolve individual error.

  4. Activity Flow: Phase by Phase
  Phase 1 (0-15m): Introduction. Distribute Dossiers. Participants read System K description and data tables independently. Phase 2 (15-25m): Triage Assignment. Distribute Cards. Teams learn which dimension to discard. Phase 3 (25-55m): Deliberation. Teams calculate base rates from remaining data. They must agree on a weighting strategy for the two retained classes. Phase 4 (55-65m): Lock-in. Individuals submit Credence Slips privately. Phase 5 (65-85m): Confrontation. Teams reveal average credences. Facilitator plots them on the whiteboard. The gap (expected 40+ points) becomes visible. Phase 6 (85-90m): Closing. Facilitator seals predictions. No resolution yet; the tension remains unresolved during the session. Participants leave with the uncomfortable knowledge that their peers, holding identical data, arrived at incompatible truths based solely on dimension exclusion. The timer must be kept strictly to prevent drift into philosophical debate before the experience is fully felt. During Phase 3, facilitators circulate to ensure taboo compliance. In Phase 5, do not explain the divergence; let them argue. Ask: 'Who is correct?' Allow the silence to sit. This discomfort is the pedagogical goal. The session ends before the actual outcome is revealed, preserving the epistemic uncertainty. The focus is on the formation of credence, not the resolution of the event. This ensures the reference class problem remains the primary takeaway rather than the specific outcome of System K.

  5. Debrief: Mapping Experience to the Reference Class Problem
  Debrief: Begin by highlighting the divergence. Ask Team A why Team B is wrong. They cannot answer without invoking the discarded class, which was rule-taboo. This maps to the philosophical core: there is no neutral meta-reference class to judge which similarity space is "correct." System K is a single case belonging to multiple populations. The game approximates the problem by forcing an arbitrary exclusion. However, the facilitator must verbally supply the missing philosophical context: in reality, we choose classes freely, making the arbitrariness harder to spot. Here, the rules made the arbitrariness visible. The lesson is that rational agents with identical data diverge when similarity spaces are incommensurable. The facilitator should explicitly name the 'Reference Class Problem' and connect it to the inability to define 'similarity' without circularity. The experience proves that data alone does not dictate probability without a prior choice of description.

  6. Predictable Failures and Facilitator Handling
  Failures: Participants may attempt to secretly use all three classes. Handling: Enforce the taboo strictly; penalize citations of discarded data. Participants may argue one class is "more real" (e.g., software is physical, org is abstract). Handling: Remind them System K is defined as ontologically hybrid; all classes are equally legitimate descriptions. Groupthink may suppress individual variance within teams. Handling: Individual scoring ensures personal risk remains even if the team consensus is wrong. The facilitator must remain neutral, refusing to adjudicate which reference class is superior. If participants demand the 'true' probability, the facilitator must refuse to answer, reinforcing that no such number exists independently of the chosen class.

  7. Limits of the Simulation
  Limits: The simulation assigns reference classes arbitrarily; real-world forecasters choose them, masking the bias. The data tables are clean; real historical data is noisy and disputable. The game demonstrates the *existence* of the problem but not the *resolution*, as none exists. It relies on the facilitator to bridge the gap between game mechanics and epistemic reality. It cannot prove the problem is unsolvable, only that it is felt. The social stake is low compared to real forecasting stakes. It serves as a visceral demonstration of epistemic friction inherent in single-case forecasting.
