answer: |-
  This is a sharp reading of a difficult text. Brooks Adams is writing in a tradition of late 19th-century historical materialism that treats societies almost like biological organisms subject to thermodynamic laws. Your three-way distinction is a strong tool for unpacking this, but to make it truly faithful to the passage, you need to tighten the definition of your second point (Complexity Loss) and be very specific about how Adams defines "Energy."

  Here is a walk-through of the passage to test your triangulation, followed by an application to your class cases.

  ### 1. The Energy Question: Fixed Quantity or Metaphor?

  You asked whether "energy" is a fixed force that gets redirected (zero-sum) or a loose metaphor for the spirit of the age. In this passage, it is almost certainly a **fixed-quantity model.**

  Adams uses hydraulic and physical language: "vent," "pressure," "acceleration," "consolidation." When he writes, "Energy ceases to find vent through the imagination and takes the form of capital," he is describing a transformation of state, like water turning to ice. The total amount of social energy remains, but its *form* changes.

  *   **Implication for your Distinction (3):** This means your "Psychological-Type Turnover" is not just a change in prestige or values. It is a structural displacement. For Adams, a society cannot be highly "imaginative" (religious, artistic, decentralized) and highly "economic" (centralized, capital-driven) at the same time. As one rises, the other must die.
  *   **Is it a Failure?** Yes. Because the "imaginative temperament" is associated with "disintegration wherein imagination kindles," its disappearance is a loss of vitality. The "economic instinct" is associated with "consolidation whose pressure ends in death." So, (3) is a successful adaptation for survival in the short term (the "new varieties of men... possess the world"), but it is a spiritual failure that guarantees eventual extinction.

  **Verdict:** Keep (3), but understand that for Adams, this is a zero-sum biological trade-off. The "death" of the imaginative type is a prerequisite for the "life" of the economic type.

  ### 2. The Movement Question: Systemic Velocity vs. Local Activity

  You asked if "movement" refers to trade speed/reach or if local changes (like stopping monument building) count as deceleration.

  For Adams, "movement" is **systemic velocity.** It is the speed and reach of exchange, finance, and military projection *across the civilization network*. Look at his examples: "adverse exchanges," "shore of the Bosphorus," "direct communication with Hindoostan," "highroad," "age of steam." These are all about connectivity and the flow of bullion/goods between centers.

  *   **Local Symptoms:** The end of monument building on Easter Island or the abandonment of Maya centers would *not* count as a deceleration of "movement" in Adams's sense. Instead, Adams would likely view those local stoppages as evidence that those societies were **bypassed** by the acceleration happening elsewhere.
  *   **The Wilderness Analogy:** Adams explicitly compares the victims of this acceleration to "beasts and trees... destined to vanish when the soil is subdued by man." He does not view isolated societies as independent drivers of history. They are the "wilderness." When the "acceleration of movement" (e.g., European expansion, trade route shifts) hits them, they vanish. Their internal "deceleration" is irrelevant to the global law; they are simply crushed by the momentum of the consolidating centers.

  **Verdict:** Your distinction needs to account for this hierarchy. "Movement" is a global/systemic variable. Local "Complexity Loss" (2) is often just the debris left behind when "Movement" shifts location.

  ### 3. The Tension: "New Men" vs. "Death"

  You noted a tension between "new varieties of men come to possess the world" and "consolidation whose pressure ends in death." Does this dissolve?

  Yes, it dissolves if you view Adams's history as **cyclical and relay-based.**

  *   **Phase 1 (Disintegration/Imagination):** A society is vital, artistic, and religious, but politically fragmented (e.g., early Rome, Italian cities before consolidation).
  *   **Phase 2 (Acceleration/Consolidation):** Movement speeds up. Energy shifts to capital. "New men" (bankers, merchants, bureaucrats) rise. They "possess the world" because they are more efficient at competition.
  *   **Phase 3 (Death):** The consolidation becomes so rigid ("pressure ends in death") that the society loses the ability to adapt. It crumbles (Rome falls, Spain ruins).
  *   **Phase 4 (Renewal):** The "semi-barbarians of the West" (a new, imaginative, disintegrated group) inherit the earth and start the cycle again.

  So, the "new men" win the epoch, but the epoch dies. The tension is only apparent; it is the rhythm of the law.

  ### 4. Refining Your Three-Way Distinction

  Your distinction is doing real work, but point (2) needs a tweak to fit Adams specifically.

  *   **(1) Institutional Discontinuity:** **Keep.** This matches Adams's "empires rise and fall."
  *   **(2) Complexity Loss:** **Modify.** Adams does not equate "consolidation" with "complexity loss." In fact, he equates consolidation with *advance* ("as civilizations advance..."). For Adams, "Complexity Loss" is the *result* of the death of consolidation, not the transition itself. A better label for (2) in an Adams framework would be **Centralization of Capital.** This captures the "Consolidation" he describes. The "Loss" comes later, when the pressure becomes too great.
  *   **(3) Psychological-Type Turnover:** **Keep.** This is the core of his argument (Imagination $\rightarrow$ Economic Instinct).

  **Why the change?** If you stick with "Complexity Loss" as the definition of the transition, you contradict Adams. He thinks societies get *more* consolidated (complex/centralized) as they move toward the economic instinct. They only "lose complexity" when they die. If you use "Centralization of Capital" for (2), you can track the *rise* of the economic society separately from its *fall*.

  ### 5. Applying the Framework to Your Cases

  Here is how a faithful reading of Adams would likely categorize your three class cases. Note that Adams is Eurocentric and focused on trade/bullion, so he struggles with isolated cases.

  **The Bronze Age Collapse**
  *   **Adams's Verdict:** **Mix of (1) and (2).**
  *   **Why:** This fits his model of Rome/Constantinople best. You have a shift in "movement" (trade routes), a drain of "bullion" (resources), and the rise of new centers (Iron Age kingdoms) replacing the old. The "imaginative" Bronze Age palaces (disintegration/vitality) gave way to economic consolidation, which then cracked. Adams would see this as a standard turnover of the cycle. The "failure" is the death of the specific consolidation (Mycenae/Hittites), but the "change" is the rise of the "new men" (Iron Age traders/warriors).

  **The Classic Maya**
  *   **Adams's Verdict:** **Mostly (3) without successful (2).**
  *   **Why:** The Maya fit the "Disintegration wherein imagination kindles" phase perfectly (monuments, religion, art). However, they arguably did not complete the transition to "Consolidation whose pressure ends in death" in the economic/bullion sense Adams describes (no global trade highway, no centralization of capital like London/Rome). For Adams, their collapse might look like a society that exhausted its "imaginative energy" without successfully converting it into "capital." They failed to consolidate before they died. It is a "failure" of the cycle to complete itself.

  **Easter Island (Rapa Nui)**
  *   **Adams's Verdict:** **Not a Civilization Collapse; it is "Wilderness Subdued."**
  *   **Why:** This is the hardest fit. Adams explicitly distinguishes between "societies" caught in the law of acceleration and the "beasts and trees" of the wilderness. Because Easter Island was isolated from the "movement" of global trade/communication (until Europeans arrived), Adams would likely not view their internal statue-building cessation as part of the "Law of Civilization." He would view them as the "wilderness" that vanishes when the "soil is subdued." If you must categorize it, it is a **Failure of (1)** caused by external "Movement" (European arrival) rather than internal consolidation. They are the victims of the acceleration, not participants in it.

  ### Summary Advice

  Your triangulation is excellent, but to make it stick with Adams:

  1.  **Treat Energy as Fixed:** Accept that for Adams, Imagination and Capital are mutually exclusive. You cannot have both. This makes (3) a tragic transformation, not just a cultural shift.
  2.  **Redefine (2):** Change "Complexity Loss" to **"Centralization of Capital."** This allows you to distinguish between the *rise* of the economic society (which Adams calls "advance") and its *fall* (which he calls "death").
  3.  **Scale Matters:** Remember that "Movement" is global. Local collapses (Maya/Easter Island) are often just local symptoms of the global relay race shifting to a new track (e.g., from Mediterranean to Atlantic).

  If you make those adjustments, your distinction will capture the tragedy in Adams's argument: that "success" (consolidation/capital) is actually the mechanism of eventual extinction, and that what archaeologists call "collapse" might just be the necessary "disintegration" required to birth the next imaginative phase.
