  Regarding standard positions: The Quinean inscrutability line accepts (5) and pays with global skepticism. Lewis-style eligibility constraints reject (4) by asserting 'carry' is more natural than P*, paying with metaphysical commitment to natural kinds. Informational and teleological accounts reject (4) by citing the training history as the content-fixer, paying with externalism. The interpreter-relative view accepts (5) but pays by making science merely instrumental.

  (2) and (6) are distinct moves. (2) is a Goodman-style 'grue' problem regarding induction from finite data, whereas (6) is a Putnam-style triviality argument about mapping physical states to logical states. You conflated them; (2) threatens specific attributions, while (6) threatens computation itself.

  Empirically, the setting saves realism. The model was trained on addition, not P*. If you test on held-out inputs where 'requires carry' and P* diverge, the model will follow the carry rule because gradient descent optimized for addition accuracy over the training distribution. This measurement separates the contents. It rescues realism by showing the function is defined by the training manifold, not the evaluation corpus. Relocating underdetermination to a larger corpus ignores that the training process breaks the symmetry between 'carry' and P* before evaluation ever occurs. The direction *d* encodes carry because the loss landscape shaped it to, not because it fits the test set.

  Finally, (6) is self-undermining. If no system determinately implements anything, then the colleague's search algorithm and your reasoning process lack determinate content too. Rejecting (4) avoids this performative contradiction by allowing that some systems, like brains and trained networks, determinately implement computations due to their causal history.
