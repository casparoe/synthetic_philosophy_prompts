      *   *Self-Correction on Claim 4:* Be careful not to dismiss Aristotle too quickly. The "financialization" critique is a modern echo of "money breeding money."
      *   *Residue:* Ensure the distinction between "inexpressible" and "illusory" is sharp.

  6.  **Final Review against Constraints:**
      *   American English? Yes.
      *   Address all four claims? Yes.
      *   Residue report included? Yes.
      *   Honest about translation breaks? Yes.
      *   No excessive scholarly jargon (user is a tourist)? Yes.

  7.  **Final Polish:** Check for flow and clarity. Ensure the CBDC context is acknowledged where relevant (e.g., in the discussion of fiat/state money). (Self-correction: The prompt mentions CBDC work, so linking the "state liability" aspect to Claim 1 is crucial).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Aristotle is wrong." I need to show *why* his framework generates different questions. For instance, the "boundedness" of wealth is a question of *sufficiency*, which economics treats as a parameter (satiation point) but Aristotle treats as a moral boundary.

  Let's structure the response:
  1.  Introduction acknowledging the user's dual position.
  2.  The Four Claims (Translation + Breakage Analysis).
  3.  The Residue Report (Substantive vs. Illusory).
  4.  Where Modern Econ Surpasses Aristotle.
