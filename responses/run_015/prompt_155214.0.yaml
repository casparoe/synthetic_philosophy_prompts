      *   **Conflict:** Priorities shift with new info. Half want to lock in current preferences (status quo/immediate desire). Half want rules based on "better informed/more patient/future self" preferences (idealized/extrapolated preferences).
      *   **Proposal:** Each person submits three rankings: (1) Now, (2) After a week of research, (3) After imagining living with the outcome for a decade. Then weight and merge them.
      *   **Question:** Is there a coherent philosophical defense for aggregating these extrapolated preferences vs. current vote? Or is this just a power grab by the "loudest person"?
