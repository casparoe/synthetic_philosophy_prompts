      *   *Does 4 make 5 worse?* Yes, if "normal conditions" are strictly ancestral. But teleosemantics usually allows "normal conditions" to include conditions the learning mechanism was designed to handle (which includes novelty).
      *   *Swampman/Misrepresentation tension?* As noted above, this dissolves. No function = no representation = no misrepresentation.
