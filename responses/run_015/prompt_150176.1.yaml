      *   **Refining the "Novelty" point:** Teleosemantics handles novelty via *recombination* or *learning mechanisms* that were selected. The user's formulation of 5 assumes selection targets *specific contents*, which is a straw man of the theory. Selection targets the *capacity* to form contents.

  5.  **Refining the Advice (Which to drop?):**
      *   If the goal is *Teleosemantics*, you cannot drop 1 or 2 without collapsing into Functionalism.
