answer: |-
  The chalkboard was still cloudy with erased proofs when Theo capped the marker. The seminar room smelled of stale coffee and dust. Bea sat on the edge of a desk, swinging one leg, watching him.

  "You're not going to let the consistency objection die, are you?" Bea said.

  "It's not an objection, it's a boundary condition," Theo said, turning around. He leaned against the board, arms crossed. "You say you can see the truth of $G_F$. I say you can only see it if you assume $F$ is consistent. But if $F$ is your mind, assuming $F$ is consistent is assuming what you're trying to prove. It's bootstrapping."

  "I know the loop, Theo. I'm not claiming infallibility. I'm claiming that my warrant for believing $G_F$ isn't a derivation inside $F$." Bea hopped off the desk. "When I look at the Gödel sentence, I see it says 'I am unprovable in $F$'. If I trust $F$ to be sound—that its proofs yield truths—then I see $G_F$ must be true, because if it were false, it would be provable, and $F$ would prove a falsehood. My trust in $F$ isn't a theorem inside $F$. It's the stance I take toward my own reasoning."

  "But where does that trust come from?" Theo pushed off the board. "If it's not computational, what is it? Magic? And don't say Penrose's quantum microtubules. You told me yourself that was a non sequitur."

  "God, no. That's physics, this is logic. I'm saying the justification is normative, not causal. But fine, let's get concrete. You keep saying 'If $F$ is your mind'. Identify $F$."

  Theo smiled, reaching into his bag. He pulled out a laptop, opened it, and spun it around on the desk. "Here. Let's say this code models your arithmetic competence. It's a formal system $F$. It's consistent. Here is the Gödel sentence $G_F$."

  Bea looked at the screen. "I don't know that this is me. You've handed me a black box. To Gödelize it, I need to know that this system captures my reasoning capacities. If it doesn't, $G_F$ tells me nothing about me."

  "Okay, suppose I give you the source code. You audit it. You verify it matches your output for every arithmetic query you've ever made."

  "Every query? There are infinitely many."

  "Finite subset. Enough to fix the program."

  "Then you've only fixed a lookup table for past behavior," Bea said. "But suppose I grant it. Suppose I agree, 'Yes, that machine is me.' Now I construct $G_F$. I see it's true. So I've outstripped $F$."

  "But you didn't do it alone," Theo said, tapping the laptop. "You used this machine to check the syntax, to verify the diagonalization. You needed the laptop. So the system isn't $F$. It's $F$ plus the laptop plus you. Call it $F'$. Now I can construct $G_{F'}$. Can you see that?"

  "Lucas addressed this. I can use tools. The claim isn't that I'm unaided, it's that I'm not *exhausted* by the formal system."

  "Where does the system stop, Bea? If you use a notebook, is that part of the mind? If you use a laptop? If you network with another human? If the 'I' that sees the truth includes external tools, then the 'I' is just a bigger machine. You haven't escaped mechanism; you've just expanded the boundary."

  Bea paused. "The boundary is where the understanding happens. The laptop manipulates symbols. I grasp what they mean. When I see $G_F$, I see it's *true*. The laptop just checks derivability."

  "Truth," Theo said. "There it is. You're relying on a notion of truth that outruns provability. That's a metaphysical commitment, not a logical proof. You need a model outside the system to define truth. Where is that model located?"

  "In the semantics," Bea said. "I know what the numbers are. The machine only knows the strings."

  "But you're physical. Your 'knowing' is a state of your brain. If I describe that state fully, I have a system $F_{brain}$. It's huge, sure, but it's finite. And here's the size problem you're glossing over. $G_{F_{brain}}$ would be astronomically long. Longer than your lifespan. Longer than the universe's entropy allows. You can't literally 'see' it. So you're talking about an idealized agent, not Bea."

  "I'm talking about capacities," Bea countered. "In principle, I can grasp the method of construction. I don't need to hold the whole string in working memory to see the validity of the construction."

  "Then you're arguing about Platonic agents, not humans. And if we're talking about humans, about actual flesh and blood, then the lookup-table point bites. Any finite run of your behavior—every word you've said tonight—can be reproduced by a finite table. No experiment could ever distinguish you from a machine that just looks up responses."

  "So mechanism is unfalsifiable," Bea said.

  "Or your anti-mechanism is untestable," Theo shot back. "If every possible behavior is compatible with both 'machine' and 'non-machine', then the difference isn't empirical. It's theological."

  "It's not theological to say understanding isn't syntax."

  "Then show me the understanding without the behavior. If you write down a proof, I can simulate the writing. If you say 'I see it's true', I can simulate the speech. What's left?"

  "The difference between producing the sentence and knowing it's true," Bea said. "You can simulate the output 'G is true'. But do you know it? If you're just a machine, you're just shuffling symbols according to rules. You don't know anything. You're dark inside."

  "And you know this how? Because you feel the light?" Theo shook his head. "Look, I'm not saying brains are noisy so Gödel doesn't apply. I'm saying the argument relies on a realist notion of truth that you haven't earned. You say 'True but unprovable'. True where? In the standard model of arithmetic? But how do you access the standard model? If your access is via some cognitive capacity, and that capacity is physical, then it's subject to the same formalization."

  "If my capacity is physical, why can't I be formalized?"

  "Because to formalize it, I need to know which system it is. And to know that, I need to know you're consistent. And you can't tell me that without assuming it." Theo rubbed his temples. "We're back at the loop."

  "No," Bea said. "We're at the real disagreement. You think that if you can simulate the behavior, you've captured the mind. I think simulation isn't duplication. You think 'truth' is just a label we apply to provable sentences in a preferred system. I think truth is a relation between language and reality, and my mind grasps that relation."

  "So it's about realism," Theo said. "If I deny mathematical realism, if I say arithmetic is just a game we play with symbols, your argument collapses. $G_F$ isn't 'true', it's just unprovable."

  "Then you can't account for why we all agree on arithmetic," Bea said. "Why the symbols work on the world."

  "Evolution," Theo said. "We evolved to track patterns. Success doesn't require Truth with a capital T. It just requires utility."

  "Utility doesn't explain necessity," Bea said. "I see that $G_F$ *must* be true. Not that it's useful to believe it."

  Theo walked back to the board, picked up the eraser, but didn't wipe anything. He just held it. "Okay. Suppose I grant you the realism. Suppose there is a Fact of the Matter about arithmetic that outruns any formal system. You still haven't shown that your brain isn't a machine that accesses those facts. Maybe the machine is just hooked up to the Platonic realm. That's not anti-mechanism, that's just weird physics."

  "If the machine is hooked up to the Platonic realm, then the mechanism isn't doing the work," Bea said. "The hook-up is."

  "And the hook-up is a physical process in your neurons."

  "Then you're begging the question. You're assuming physicalism."

  "I'm assuming naturalism," Theo said. "You want to say the mind isn't a machine. I want to say the mind is what the brain does. The Gödel argument only works if you assume you can stand outside the system to judge it. But you're in the system. When you 'see' the truth, that seeing is an event in the world. If I can't describe that event formally, it's not because it's magic, it's because my formalism is too weak. But a better formalism might catch it."

  "Or maybe some things can't be caught," Bea said. "Maybe understanding isn't the kind of thing that can be fully objectified."

  Theo put the eraser down. "So what would move you? If I built a machine that could audit its own code, verify its own consistency, and produce its own Gödel sentences? Would you concede?"

  "If it produced them because it was programmed to, no. If it produced them because it *saw* them... I don't know what that would look like. What would move you?"

  Theo looked at the chalkboard, at the scattered symbols of systems they'd both forgotten. "If you could show me a capacity that couldn't even in principle be simulated by a finite lookup table. Not just 'you haven't built it yet', but 'this structure cannot map to that structure'. But you can't, because of the lookup table argument. Any finite output matches a table."

  "So we're stuck," Bea said.

  "Not stuck," Theo said. "Just located. You're fighting for the normativity of reason. I'm fighting for the completeness of physical explanation. You think mechanism leaves out the 'ought'. I think the 'ought' is just a complicated 'is'."

  "And neither of us can prove it," Bea said.

  "No. But at least we're not arguing about consistency anymore." Theo grabbed his bag. "Same time next week? We can try Kripke on rule-following."

  "Only if you buy the first round," Bea said.

  "Deal."
