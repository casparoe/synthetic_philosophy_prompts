answer: |-
  The Zoning Board of Appeals sat in stale silence until Chairwoman Higgs tapped her gavel. "We need to determine if 'The Silent Pulse' qualifies as a dance hall under Ordinance 44. What is the necessary and sufficient condition? What makes a dance hall a dance hall?"

  Member Clark cleared his throat. "Amplified music audible from the street?"

  "Vetoed," Higgs said, flipping a file. "Remember 'The Mime Ballroom'? Grandfathered in 1994. No air vibration, just bone-conduction floors."

  "Okay, then synchronized rhythmic movement of patrons," Clark tried.

  "Vetoed. 'The Statuesque Lounge,' classed as a dance hall in 2002. Patrons pay to stand perfectly still."

  "Fine. Sale of intoxicating liquids."

  "Vetoed. 'The Sober Shuffle,' exempted in 2011. They serve only sparkling water."

  Clark threw his pen down. "Chairwoman, if there's no noise, no movement, and no booze... what common thread connects all these venues? What is the essence of a dance hall?"

  Higgs leaned back, folding her hands. "There isn't one. There's no single feature running through all of them like a fiber in a rope. They're connected by overlapping similarities—family resemblance. One has the nose, one has the chin, none have the same face."

  "So... is The Silent Pulse a dance hall?"

  "Approve the permit," Higgs said, dropping the gavel. "We aren't discovering what a dance hall *is*; we're deciding how to *use* the word. And right now, we're using it to collect the tax."

  ***

  **Confidence and Flag:** I am highly confident in the philosophical accuracy regarding Wittgenstein's concept of family resemblance and the rejection of essentialism. The point I am least sure of is whether the punchline successfully balances the bureaucratic cynicism with the philosophical insight without reducing the latter to a mere plot device.

  The joke illustrates Wittgenstein's argument that categories like "dance hall" are held together by overlapping similarities rather than a single essential feature.
