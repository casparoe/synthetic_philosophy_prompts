answer: |-
  # The Rule-Following Decision Tree: Specs, Implementations, and Meaning

  This taxonomy maps the logical space of the rule-following argument (the "Kripkenstein" paradox) using the analogy of software specifications and implementations. The core problem is that any finite set of test cases (past behavior) is compatible with infinitely many functions (rules).

  The tree below sorts philosophical positions based on how they answer seven concrete branching questions. Follow the path that matches your intuition about where the "correct implementation" of a rule comes from.

  ### The Decision Tree

  **Q1. The Over-Determination Case**
  *Consider a function `add(x, y)` you have only ever tested on numbers smaller than 50. Now you run `add(57, 68)`. Your past test logs are logically consistent with both `plus` (125) and `quus` (5, if either input > 50). Does your past execution history **logically force** one specific output as the only correct one?*
  *   **NO:** (Almost everyone agrees here; this is the starting paradox). → **Go to Q2.**
  *   **YES:** (You believe finite behavior logically entails infinite rules). → **Leaf: Logical Behaviorism (Unoccupied/Incoherent).**
      *   *Note:* This cell is effectively empty. Kripke argues this is logically impossible; no finite set of behaviors entails a unique infinite rule.

  **Q2. The Fact Existence Case**
  *Since the logs don't force it, is there **any fact of the matter** (internal state, physical structure, or social context) that makes `125` the truth-conditionally correct answer rather than `5`?*
  *   **NO:** (There is no "truth" here, only what we say). → **Go to Q3 (The Skeptical Path).**
  *   **YES:** (There is a fact that fixes meaning). → **Go to Q4 (The Straight Solution Path).**

  **Q3. The Skeptical Survival Case**
  *If there are no meaning-facts, is the practice of adding numbers **doomed to collapse**, or can we keep using the word "correct" based on something else?*
  *   **DOOMED:** (Meaning is impossible). → **Leaf: Radical Nihilism.**
      *   *Note:* Unoccupied. No one accepts this because we clearly *do* communicate.
  *   **SAVABLE:** (We keep the practice, but change the justification). → **Leaf: The Skeptical Solution.**
      *   *Position:* Accept the skeptic's conclusion (no truth conditions) but argue meaning is sustained by **assertibility conditions** within a community. We don't need "truth," we need "agreement."

  **Q4. The Reduction Case**
  *You believe there is a fact that fixes the rule. Can this fact be **fully analyzed** in non-semantic, non-intentional terms (e.g., physics, biology, behavior), or is meaning a basic building block of reality?*
  *   **NO:** (Meaning is primitive/sui generis). → **Leaf: Non-Reductive Realism (Primitivism).**
      *   *Position:* There is a fact, but it cannot be broken down further. "I mean plus" is a brute fact, like "I am conscious."
  *   **YES:** (Meaning is constituted by something else). → **Go to Q5.**

  **Q5. The Locus Case**
  *If the fact is reducible, is it grounded **solely in the individual implementer**, or does it essentially require the **community of users**?*
  *   **COMMUNITY:** (The spec is defined by the team). → **Go to Q6.**
  *   **INDIVIDUAL:** (The spec is defined by the coder/machine). → **Go to Q7.**

  **Q6. The Consensus Regress Case**
  *If the community settles the meaning: If the whole team agrees `add(57, 68) = 5`, is that **automatically correct** (constitutive), or is the team just **reporting** on a rule they all grasp independently (evidential)?*
  *   **EVIDENTIAL:** (The team could all be wrong together). → **Leaf: Communitarian Realism (Rare/Unstable).**
      *   *Note:* This cell is largely unoccupied. If the community is just evidence of a rule, we are back to Q4 (what is the rule?).
  *   **CONSTITUTIVE:** (Agreement *makes* it correct). → **Leaf: Communitarian Solution.**
      *   *Position:* Correctness is defined by social agreement. However, this risks the same regress: what fixes the meaning of the community's agreement?

  **Q7. The Misbehavior (Error) Case**
  *If the individual fixes the meaning: You intend `plus`, but you are tired and type `124`. Is your meaning defined by **how you actually respond** (dispositions) or by the **physical/causal history** that produced your state?*
  *   **ACTUAL RESPONSES:** (Meaning = Disposition). → **Leaf: Simple Dispositionalism (Refuted).**
      *   *Note:* This cell is occupied only by those who ignore the "Normativity Objection." If meaning is just what you *do*, you can never be wrong. `124` becomes the meaning of `plus` for that instance.
  *   **PHYSICAL/CAUSAL HISTORY:** (Meaning = Causal Structure). → **Leaf: Causal-Historical Theory.**
      *   *Position:* Meaning is fixed by the causal chain that produced your mental state or the evolutionary history of the symbol.
  *   **IDEALIZED RESPONSES:** (Meaning = Disposition under *perfect* conditions). → **Leaf: Idealized Dispositionalism.**
      *   *Position:* You mean `plus` because you *would* say `125` if you weren't tired, distracted, or out of memory.
      *   *Warning:* Risks circularity (defining "perfect conditions" requires knowing the right rule).

  ---

  ### Taxonomy Notes

  #### 1. Empty or Unstable Cells
  *   **Logical Behaviorism (Q1-YES):** Nobody occupies this. It was refuted decades ago; finite data cannot logically entail infinite rules without additional premises.
  *   **Radical Nihilism (Q3-DOOMED):** Nobody occupies this. It renders all language and code unintelligible, including the argument itself.
  *   **Communitarian Realism (Q6-EVIDENTIAL):** This is an unstable hybrid. If community agreement is only *evidence* of the rule, not the *source* of the rule, you haven't solved the individualist problem, you've just multiplied it (now we need to know how the *group* grasps the rule).

  #### 2. Indistinguishable Leaves
  *   **Causal-Historical vs. Non-Reductive Primitivism:** In practice, these are hard to separate. Both appeal to a fact about the agent that is not currently visible in their behavior. If the "Causal History" is not reducible to physical laws we can specify, it functions exactly like a "Primitive Fact."
  *   **Idealized Dispositionalism vs. Causal-Historical:** Both rely on counterfactuals ("What *would* you do?" vs. "What *caused* you to be able to do?"). If the "ideal conditions" are defined by the physical structure of the brain, the view collapses into Causal-Historical.

  #### 3. The Meta-Branch (Exegetical Rejection)
  *   **Position:** **The Exegetical Rejection.**
  *   **Location:** This position does not sit *in* the tree; it rejects the tree's root.
  *   **Argument:** Kripke's "Kripkenstein" is not Wittgenstein. Wittgenstein was not offering a skeptical paradox to be solved (either skeptically or straight), but dissolving the picture of meaning that makes the paradox arise.
  *   **Implication:** If you take this path, you do not choose a leaf above. You argue that searching for a "fact that constitutes meaning" is the original error. Meaning is use, not a hidden fact.

  #### 4. Technical Mapping
  *   **Skeptical Solution:** Matches **Interoperability Standards**. There is no "true" implementation, only what passes the test suite agreed upon by the working group.
  *   **Primitivism:** Matches **Formal Verification**. The spec exists in a Platonic space (logic/math) and the code is correct if it maps to it, regardless of physical execution.
  *   **Dispositionalism:** Matches **Dynamic Typing/Runtime Behavior**. The meaning of the code is literally what the machine does when you run it. (Struggles with "bugs").
  *   **Causal-Historical:** Matches **Version Control/Lineage**. The meaning is fixed by the commit history and the intent of the original authors, even if the current build has drift.
