  **MEMORANDUM**

  **TO:** Diagnostic Standards Committee
  **FROM:** Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Chronic Attentional Collapse Syndrome

  I recommend we admit Chronic Attentional Collapse Syndrome provisionally, contingent upon a mandatory five-year review and the exclusion of self-report measures derived from advocacy materials for validation purposes. This admission must carry a genuine sunset clause that automatically expires the code unless independent epidemiological data confirms stability beyond the looping effect.

  Our central difficulty is ontological. We are dealing with an interactive kind: a classification that changes the very people it classifies. When individuals learn they belong to a category, they alter their self-understanding and behavior to align with it. The evidence before us—symptom clustering, prevalence, treatment response—was collected after the label circulated online for four years. We are not measuring a pre-existing natural structure; we are measuring the sediment of a feedback loop between the proposed definition and the population. To treat this data as descriptive validity is to confuse the map with the territory.

  One colleague argues this is "nothing special," noting that expectancy effects exist across medicine. This objection is incorrect. While a diabetes diagnosis may change a patient's diet, it does not fundamentally alter the pathophysiology of insulin production. In psychiatric classification, the description often participates in constituting the condition. When a label originates online and provides a vocabulary for suffering before clinical validation, the looping effect is accelerated and intensified. The uniformity clinicians see in pilot sites is not necessarily evidence of a discovered kind, but of a successful cultural script. Acknowledging this does not deny suffering; it denies that suffering proves ontological stability. Caution here is not sentimentality; it is epistemic responsibility.

  Regarding the Chair's proposal for blind surveillance: the claim that we cannot measure a moving target with a tool advertised as measuring it is partially correct. If the surveillance instrument is publicly linked to Chronic Attentional Collapse Syndrome, the looping effect will contaminate the data regardless of item wording. Does this workaround escape the looping it is meant to escape? No, it does not fully escape it, as patients remain embedded in a culture where the label exists. However, if the tool measures phenomenological states—sensory intolerance, task fragmentation—without invoking the syndrome's name or narrative, it mitigates the loop significantly. We must fund this surveillance not as validation of the current construct, but as a test of whether the construct stabilizes independently of its promotion.

  We face an ethical bind. Our rules forbid withholding diagnosis, so silence is not an option to dampen looping. Refusal denies sufferers access to services and validates the advocacy group's fear that their pain is deemed unreal. Provisional admission balances epistemic caution with clinical utility. A category can be useful for reimbursement without being a natural kind. It grants access while signaling that the category's boundaries are not yet fixed. A research code would protect our manual's integrity but abandon patients to insurance limbo; full admission would reify a potentially transient cultural phenomenon. The sunset clause is the critical mechanism here: it ensures that if the looping effect dissipates or the category proves unstable without advocacy reinforcement, we remove it.

  Finally, regarding clinical practice: when assigning this code, clinicians must avoid reification. You should tell patients that this label captures their current experience and grants access to care, but that it describes a pattern of symptoms rather than a fixed internal disease entity. Explain that the diagnosis is provisional and that treatment focuses on managing environmental demands and sensory load, not curing a permanent defect. This preserves therapeutic alliance without cementing the looping effect into the patient's identity.
