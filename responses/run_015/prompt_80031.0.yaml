answer: |-
  This is a sophisticated impasse that cuts to the heart of modern decision theory. You have correctly identified the technical mechanism of the disagreement (how counterfactuals are constructed around deterministic computations), but your hypothesis that this is *merely* a verbal disagreement is likely too charitable.

  Here is a diagnosis of the situation and a roadmap for what could actually move the needle.

  ### 1. Verbal or Substantive?

  Your hypothesis is that this is a verbal disagreement about the definition of "counterfactual." **This is partially correct, but it masks a substantive normative disagreement.**

  If the disagreement were purely verbal, you and your friend could translate your terms into one another's framework and agree on the recommendation. You cannot do this. You agree on the physics of Newcomb's Problem, but you disagree on which action is *prescribed*. Therefore, there is a substantive disagreement about the **normative criteria of rationality.**

  The substantive core is a conflict between two axioms that cannot both be satisfied in Newcomb-like scenarios:

  1.  **The Causal Dominance Principle (CDT):** If action $A$ yields a better outcome than action $B$ in every possible causal state of the world, you ought to choose $A$. (In Newcomb's, two-boxing dominates one-boxing regardless of what's in the box).
  2.  **The Principle of Optimality/Winning (UDT/FDT):** You ought to choose the policy or algorithm that results in the highest expected utility. (In Newcomb's, the one-boxing algorithm gets \$1M, the two-boxing algorithm gets \$1k).

  Your friend prioritizes **causal leverage**: Rationality is about exerting causal influence on the world. Since your current action cannot causally influence the past prediction, two-boxing is the only rational move.
  You prioritize **instrumental success**: Rationality is about winning. Since the predictor simulates your decision procedure, your decision procedure *does* determine the content of the box, even if the specific action token doesn't causally reach back in time.

  **Why it feels verbal:**
  It feels verbal because both sides are trying to claim the word "rational." The CDTer says, "It's irrational to choose an action that causally leaves money on the table." The UDTer says, "It's irrational to follow a decision procedure that systematically loses money." Both are using "rational" to mean "the thing a good agent should do," but they have different models of what an agent *is* (a locus of causal intervention vs. an instantiation of a computation).

  **The Verdict:** It is a substantive disagreement about **which normative principle binds a rational agent**, disguised as a semantic debate about counterfactuals. The counterfactual debate is the *mechanism* by which the normative disagreement is implemented, not the root cause.

  ### 2. What Would Count as Progress?

  If you want to move past this stalemate, arguing about the definition of "counterfactual" will likely fail, because CDT relies on standard Lewis-Stalnaker possible worlds semantics, which are well-defined but arguably ill-suited for logical correlations.

  Here are the three avenues that actually generate progress, ranked by efficacy:

  #### A. Formal Results: Dynamic Inconsistency (The Strongest Argument)
  The most damaging critique of CDT is not that it loses in Newcomb's Problem, but that it is **dynamically inconsistent**.
  *   **The Argument:** A CDT agent, knowing they will face a Newcomb problem tomorrow, would willingly pay money *today* to precommit to one-boxing. However, once tomorrow arrives and the prediction is already made, the CDT agent will two-box.
  *   **Why it matters:** This implies the CDT agent is vulnerable to a "money pump." They pay to restrict their future freedom, only to wish they hadn't restricted it once the future arrives (or vice versa). UDT agents do not pay to precommit because they are already updateless; their decision today *is* the decision tomorrow.
  *   **Progress:** If you can demonstrate that your friend's decision theory requires them to pay to avoid having free choice in the future, you shift the debate from "definitions" to "economic coherence."

  #### B. New Thought Experiments: Counterfactual Mugging
  Newcomb's Problem is old and allows CDTers to dig in on "causal independence." You need cases where the correlation is not via a past prediction but via logical symmetry.
  *   **The Case:** In **Counterfactual Mugging**, a predictor says, "I would have given you \$1M if I predicted you would give me \$100 in this counterfactual scenario where you are poor. Since you are rich, give me \$100."
  *   **The Clash:** CDT says "No" (giving \$100 has no causal benefit now). UDT says "Yes" (because the decision function that says 'yes' is the one that gets the \$1M in the other branch).
  *   **Progress:** This tests whether your friend believes rationality requires honoring logical correlations even when there is no causal chain and no past prediction. If they say "No," ask if they would pay to modify their source code *before* the game to say "Yes." If they would pay to modify themselves to be irrational (by CDT standards) to win, the theory is unstable.

  #### C. A Sharper Account of Logical Counterfactuals (The Hard Way)
  Your intuition about deterministic computation is the frontier of research (Logical Decision Theory / Functional Decision Theory).
  *   **The Problem:** You noted that "there is no fact of the matter about what [a deterministic function] would have output had it been a different function." This is the problem of **logical counterfactuals**. Standard logic says if $P$ is false, $P \to Q$ is trivially true, which breaks decision theory.
  *   **Progress:** If you can point to work on **Logical Induction** or **Proof-Driven Decision Theory** that formalizes how to evaluate "what if $2+2=5$" without exploding the system, you undermine the CDT claim that UDT is just "hand-wavy redefinition." Currently, this is still an open research problem (see work by MIRI, Garrabrant, et al.). Acknowledging that UDT lacks a complete formal semantics for logical counterfactuals is honest, but pointing out that CDT's semantics *fail to capture logical dependence* is the counter-punch.

  ### 3. Why It Might Stay Stuck

  You should expect this to stay stuck if the conversation remains at the level of **intuitions about freedom**.

  CDT is deeply tied to a specific intuition about agency: that to be an agent is to be a "causal origin point" that could have done otherwise in the *exact same physical state*. UDT requires a compatibilist or functionalist view of agency: that you are a pattern, and the predictor contains the same pattern.

  If your friend's commitment to CDT is rooted in a metaphysical belief about libertarian free will or the sanctity of causal arrows, no amount of money-pump arguments will sway them. They value **causal purity** over **winning**.

  ### Summary Recommendation

  To make progress, stop arguing about what "counterfactual" means. Instead, argue about **policy selection**.

  Ask your friend: *"If you could write the source code for an agent to play Newcomb's Problem on your behalf, would you write code that one-boxes or two-boxes?"*
  *   If they say **one-box**, ask: *"Then why is it rational for you, the human, to two-box? Are you claiming it is rational to act differently than the agent you would design?"* (This forces them into the dynamic inconsistency trap).
  *   If they say **two-box**, ask: *"Would you pay \$10,000 to bind yourself to the one-boxing code before the game starts?"* (If yes, they admit the two-boxing policy is inferior. If no, they admit they prefer losing money).

  This moves the debate from semantics ("what is a counterfactual?") to pragmatic coherence ("why would you design a losing agent?"). That is where the substantive disagreement lives.
