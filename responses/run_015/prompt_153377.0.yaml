          *   *Modern translation:* **The "Password/Authentication" Analog.**
          *   *Why:* "Password123" is not "Password". One grants access, the other doesn't. The *identity* of the credential matters ontologically for the system's function.
          *   *Let's refine:* **The "ID Card" Analog.** "A Citizen ID is not an ID." (Weak).
          *   *Okay, I will choose the **"Contractual Specification" Analog** but emphasize the *Reality of the Demand*.*
          *   *Actually, looking at scholarship (e.g., Chad Hansen, A.C. Graham):* The mass noun hypothesis is common but controversial. The Realist hypothesis (universals) is common.
          *   *Let's pick the **"Architectural Plan" Analog**.*
          *   *Plan A (Horse):* Needs 4 legs, mane, etc.
          *   *Plan B (White Horse):* Needs 4 legs, mane, + White.
          *   *Ontological Claim:* Plan B is not Plan A. You cannot build Plan B using only the requirements of Plan A.
          *   *Why Aristotle fails:* Aristotle says the substance remains. Gongsun Long says the *identity conditions* change.
          *   *Okay, I'll settle on the **"Job Specification/Role"** but framed as **"Functional Identity"**.*
          *   *Wait, I need to make sure I answer the prompt's specific constraints.*
          *   *Constraint:* "Specify exactly what it must include and what it must lack."
          *   *Constraint:* "Why comparing it to Aristotelian accidental properties fails."
          *   *Okay, I have a plan.*

      *   **III. Mapping Misconceptions:**
          *   *Zeno:* Defuse early (Minute 10). This isn't about motion/division.
          *   *Linguistic:* Defuse during the Analog section (Minute 25). It's not about grammar; it's about the *thing* the name picks out.
          *   *Quine:* Defuse at the end (Minute 40). It's not about our choice of scheme; it's about the *independent* reality of the distinctions.

      *   **IV. Check for Understanding:**
          *   Need a scenario where they apply *Ming-Shi* correlation.
          *   *Prompt:* "If a King demands 'Horses' for war, and you send him 'White Horses', have you fulfilled the *Ming*? Why or why not according to Gongsun Long?"
