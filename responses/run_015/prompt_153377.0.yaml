          *   *Better:* "If the *Ming* is 'Father', and the *Shi* is a man who biologically sired a child but abandoned it, does the *Ming* fit the *Shi*? How would Gongsun Long treat a 'White Father'?"
          *   *No, keep it close to the text.*
          *   *Idea:* Ask them to construct a parallel argument using a different term (e.g., "Archers") and explain why the compound is not the simple.
          *   *Refinement:* "Construct a 'Ming' that requires a specific *Shi* that a broader 'Ming' would not accept, and explain why the two Names are not identical in *function*."

      *   **V. What to Leave Out:**
          *   Mohist Canons (too technical).
          *   The "Pointing at Things" dialogue (too much).
          *   Han Feizi/Later Legalist synthesis (too historical).
          *   *Crucial:* Tell them we are bracketing the Mohist rebuttals.

  4.  **Refining the Dependency Order (The "Conceptual Scaffold"):**
      *   To get to "White Horse $\neq$ Horse" as ontology:
      *   1. *Ming* is not a label; it is a *standard* (Fa).
      *   2. *Shi* is not an object; it is the *satisfaction* of the standard.
      *   3. Identity is determined by the *standard*, not the physical substrate.
