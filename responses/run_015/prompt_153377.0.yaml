  2.  **Deconstruct the Philosophical Challenge:**
      *   The core issue is that "A white horse is not a horse" sounds like a contradiction ($A \land \neg A$) or a trivial semantic claim ("white horse" $\neq$ "horse" as terms).
      *   To make it a substantive *ontological* thesis (as requested), students need to understand the Mingjia project: *Zhengming* (Rectification of Names) isn't just labeling; it's about the fit between the normative function of a name (*ming*) and the concrete reality (*shi*).
      *   Gongsun Long isn't saying white horses aren't equines. He's saying the *concept/role* of "White Horse" (compound, specific) is not identical to the *concept/role* of "Horse" (simple, general) in terms of what they demand from reality.
      *   *Dependency:* Students need to grasp *Ming* (Name/Role) vs. *Shi* (Actuality/Thing) before they can grasp why the identity fails. They also need to distinguish *Xing* (Form/Essence) from *Se* (Color/Accident) but in a Chinese metaphysical context, not Aristotelian.

  3.  **Drafting the Plan - Section by Section:**

      *   **I. Dependency Order:**
          *   What comes first? The metaphysical framework. If they think this is about grammar, they're lost. If they think it's about physical objects only, they're lost.
          *   Step 1: *Ming* (Name/Designation) is not just a label; it's a normative standard.
          *   Step 2: *Shi* (Actuality) is not just an object; it's the fulfillment of the standard.
          *   Step 3: The distinction between the *compound* demand (White + Horse) and the *simple* demand (Horse).
          *   *Crucial Distinction:* It's not Universal vs. Particular (Platonic/Aristotelian). It's about the *scope of application* and *functional identity*.
          *   *Refinement:* The prompt suggests "universal form (xing) and particular color-determination (se)" OR "name (ming) and actuality (shi)". The *Ming-Shi* correlation is the broader Mingjia concern. The *Xing-Se* distinction is specific to Gongsun Long's metaphysics. To make it ontological, we need *Ming-Shi* first, then the specific composition of the *Ming*.
          *   *Decision:* Secure *Ming* as a normative standard first. Then secure the non-identity of compound vs. simple standards.

      *   **II. The Carrying Example/Analog:**
          *   *Why Aristotle fails:* Aristotelian accidents (white) inhere in substance (horse). "White horse" is still a horse. Gongsun Long denies this identity. Using Aristotle reinforces the "obvious truth" that the students are supposed to be challenging.
          *   *What works better:* Needs to be functional or role-based.
          *   *Idea 1:* Job titles. "A senior manager is not a manager." (Too corporate).
          *   *Idea 2:* Keys. "A house key is not a key." (Too physical).
          *   *Idea 3:* *Ritual Roles*. "A sacrificial ox is not an ox." (Too Confucian/Mohist).
          *   *Idea 4:* *Security Clearance/Access*. "A Level 5 Clearance is not a Clearance."
          *   *Idea 5:* *Mathematical/Sets* (Danger of anachronism).
          *   *Selected Analog:* **The "Keycard" or "Access Token" Analogy.**
          *   *Why:* It separates the *object* (plastic card) from the *function/permission* (the Name).
          *   *Must Include:* Two different access levels (General vs. Specific). The specific one does not function identically to the general one in all contexts (e.g., entering a specific room vs. the building).
