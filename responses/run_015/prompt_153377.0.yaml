answer: |-
  # Seminar Plan: Gongsun Long and the Ontology of Naming
  **Duration:** 50 Minutes
  **Target:** Third-Year Philosophy Students (Post-Classical Chinese Thought Unit)

  ## I. Conceptual Dependency Order
  To prevent the dialogue from collapsing into a linguistic triviality or a physical paradox, you must secure the following conceptual distinctions in this specific sequence. Do not proceed to the next step until the previous one is stabilized in discussion.

  1.  **Secure *Ming* (Name) as Normative Standard, Not Label:**
      *   *Prerequisite:* Students must abandon the idea that a *ming* is merely a tag we stick on a pre-existing object.
      *   *Establishment:* Define *ming* as a **criterion** or **standard** (akin to a *fa* or model) that reality is expected to match. The Name comes first logically; the Actuality is judged by it.
  2.  **Secure *Shi* (Actuality) as Compliance, Not Object:**
      *   *Prerequisite:* Students must stop viewing *shi* as the "physical horse" and start viewing it as the "state of affairs that satisfies the Name."
      *   *Establishment:* *Shi* is the *fit* between the object and the standard. If the standard changes, the *shi* required to satisfy it changes, even if the physical object remains the same.
  3.  **Secure the Non-Identity of Compound vs. Simple Standards:**
      *   *Prerequisite:* Only after *Ming* is a standard can you argue that a compound standard ("White" + "Horse") is not identical to a simple standard ("Horse").
      *   *Establishment:* Because the criteria for satisfaction differ (one requires color, one does not), the *Ming* are ontologically distinct. Therefore, the *Shi* that fulfills them are distinct.
      *   *Result:* "White Horse is not Horse" becomes a claim about the **non-identity of functional roles**, not the physical exclusion of animals.

  ## II. The Carrying Analog: "Security Clearance Levels"
  Do not use multiple examples. Use this single analog to carry the entire metaphysical weight of the session.

  *   **The Analog:** Compare "Horse" to **Level 4 Security Clearance** and "White Horse" to **Level 5 Security Clearance**.
  *   **What It Must Include:**
      *   **Functional Non-Interchangeability:** A person with Level 5 clearance can enter rooms Level 4 cannot. However, if a protocol specifically requests "Level 4 Personnel" (e.g., for a task restricted to that clearance level to prevent higher-clearance interference), a Level 5 holder *cannot* fulfill that specific *ming*.
      *   **Ontological Distinction of Status:** The *person* (the physical substrate) is the same. The *clearance* (the *ming*) is different. The difference in clearance is not just linguistic; it is a real difference in what the person *is* within the system's ontology.
  *   **What It Must Lack:**
      *   **Physical Alteration:** Do not suggest the person changes physically. This prevents the Zeno/physical paradox reading.
      *   **Semantic Ambiguity:** Do not suggest "Level 4" is vague. The definitions are precise. This prevents the linguistic-reductionist reading.
  *   **Why Aristotelian Accidentality Fails:**
      *   Explicitly tell students: "In Aristotle, 'white' is an accident inhering in the substance 'horse'. The substance remains identical. Gongsun Long rejects this. For Gongsun Long, adding 'white' changes the *essence of the designation*. Using the Security Analog: Adding 'Level 5' isn't just adding a feature to the person; it creates a **new status category**. A Level 5 badge is not a Level 4 badge, even if the same person holds both. The *role* is not identical."
  *   **Why This Avoids Quinean Relativity:**
      *   The clearance levels are not arbitrary choices of how to "slice" the world. They are fixed standards (*fa*) that determine access. You cannot choose to treat Level 5 as Level 4 without breaking the system. This mirrors the Mingjia view that *Ming* have an objective correctness independent of our preference.

  ## III. Mapping and Defusing Misconceptions
  Integrate these interventions into the timeline. Do not wait for Q&A to address them.

  1.  **The Zeno/Paradox Confusion (Motion/Division)**
      *   *Anticipated Error:* Students think Gongsun Long is arguing about the divisibility of the object or the path of motion.
      *   *Defusal Point:* **Minute 10 (End of Intro).**
      *   *Intervention:* "If you are thinking about cutting a horse in half or the time it takes to move, stop. This is not physics. It is about **classification criteria**. We are discussing the identity of the *standard*, not the divisibility of the *matter*."
  2.  **The Linguistic-Reductionist Reading (Predicate Modification)**
      *   *Anticipated Error:* Students argue "White Horse" is just a noun phrase where 'white' modifies 'horse', so obviously the phrase is longer, but the referent is the same.
      *   *Defusal Point:* **Minute 25 (During the Security Analog).**
      *   *Intervention:* "If you think this is just about grammar, look at the Clearance Analog. 'Level 5' is not just 'Level 4' with an adjective. It is a **different functional key**. Gongsun Long is claiming the *reality of the role* changes, not just the word count."
  3.  **The Quinean/Ontological Relativity Framing**
      *   *Anticipated Error:* Students argue "It depends on how we choose to categorize the world; both schemes are valid."
      *   *Defusal Point:* **Minute 40 (Pre-Conclusion).**
      *   *Intervention:* "Gongsun Long is not a relativist. He believes there is a **correct fit** (*zheng*) between Name and Actuality. If the King asks for Horses and you send White Horses, you have not just chosen a different scheme; you have **failed the standard**. The distinction is objective, not a matter of conceptual scheme preference."

  ## IV. Check for Understanding
  **Time:** Minute 45
  **Format:** One concise written response (3 minutes) + brief share.
  **Prompt:**
  > "Apply Gongsun Long's logic to the following case: A King issues a decree for **'Loyal Ministers'**. You recommend a **'Loyal Minister who is a Foreigner'**.
  >
  > 1. Is the *Ming* 'Loyal Minister who is a Foreigner' identical to the *Ming* 'Loyal Minister'?
  > 2. According to the School of Names, does sending the Foreigner fulfill the King's *Ming*?
  > 3. Explain why, using the distinction between *Standard* and *Compliance*, not just physical traits."

  **Success Criteria:**
  *   **Fail:** Student says "Yes, because a foreigner can be loyal" (Misses the non-identity of the compound name).
  *   **Fail:** Student says "No, because 'Foreigner' is just an adjective" (Linguistic reduction).
  *   **Pass:** Student argues that the **Compound Standard** ("Loyal" + "Foreigner") imposes a different criterion for *Shi* (compliance) than the **Simple Standard** ("Loyal"). Therefore, the *Ming* are not identical, and the *Shi* required to satisfy the King's specific decree is not met by the compound, because the compound introduces a distinction (Foreigner) that the simple *Ming* did not demand (and may implicitly exclude in a Warring States context).

  ## V. What to Leave Out (Bracketing)
  You must explicitly state to the students at the beginning of the seminar:

  > "To grasp the core ontological claim of the *White Horse Dialogue*, we are deliberately **bracketing** three things today:
  > 1.  **The Mohist Logical Rebuttals:** We will not look at how the Mohists tried to refute Gongsun Long using their own canons. That is a debate for a later seminar.
  > 2.  **The Five-Part Structure:** We are treating the dialogue as a unified ontological thesis, not analyzing the specific dialectical shifts of each of the five exchanges.
  > 3.  **The Han Synthesis:** We are not discussing how later Han thinkers absorbed the School of Names into Legalism or Cosmology.
  >
  > We are focusing strictly on the **Ming-Shi correlation** in the Warring States context. If you find yourself worrying about historical reception or later logic, park that thought."

  **Confirmation:** Yes, you should openly tell the students you are bracketing this. It prevents them from trying to synthesize too much too soon and keeps the focus on the specific ontological misunderstanding they currently hold.
