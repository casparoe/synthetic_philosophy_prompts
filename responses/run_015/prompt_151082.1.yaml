  Welcome to PrudentMarkets. We are the only venue contractually enforcing a Common Prior Assumption across all counterparties. Our order book excludes speculative volume derived from divergent posteriors. Please review the following Frequently Asked Questions regarding our Zero-Sum Compliance Protocol.

  **1. Why was my limit order rejected?**
  Our surveillance algorithms detected epistemic arbitrage. By offering to sell at the current price, you signaled a private belief that the asset is overvalued. Under Rule 82 (Common Knowledge of Rationality), a rational counterparty would infer this private information and refuse the trade. To prevent a liquidity freeze, we rejected your order. You may resubmit only if you certify the sale is driven by an exogenous endowment shock (e.g., margin call, liquidity preference shift) rather than a belief update.

  **2. How do I certify non-informational motives?**
  Complete Form 10-Beta: *Declaration of Non-Epistemic Intent*. You must attest that your trade arises from hedging requirements, consumption timing, or risk-tolerance adjustments. Misrepresenting a belief update as a risk shock constitutes market manipulation. Note: Sudden interest in alpaca farming is an accepted liquidity shock, provided it is documented.

  **3. What if my posterior differs from my counterparty's?**
  You are required to sign a Prior Reconciliation Agreement. Upon detection of divergent probabilities regarding a payoff, both parties must exchange conditionalization logs until beliefs converge. PrudentMarkets bills this service by the round of belief exchange. Convergence is mandatory before order matching. As our Chief Epistemology Officer states: *"We do not facilitate gambling on who updated correctly. We facilitate the safe transfer of risk between agents who agree on the world but differ on their exposure to it."*

  **4. Who provides liquidity if speculation is banned?**
  Our book is populated by Registered Noise Participants (RNPs). These entities are contractually obliged to trade for non-epistemic reasons. Current RNP categories include: divorce settlements, regulatory forced liquidations, and rebalancing mandates. Without RNPs, the book would be empty. If no RNPs are active, trading halts.

  **5. How do you charge fees if trade is mutually useless?**
  We do not charge for value creation. Fees are framed as administrative costs for verifying that no value was created. You pay for the confirmation that your counterparty is not exploiting private information. This ensures the Groucho Marx Condition: no client joins a trade that would accept them unless the trade is fundamentally neutral.

  **6. Your marketing claims "prices aggregate all information." Is this accurate?**
  Marketing drafts often include this phrase. Compliance redacts it. The No-Trade result does not imply price efficiency; it implies no trade. When this language slips into brochures, we append Footnote 14: *"Aggregation assumes noise trading volume sufficient to mask informed flow, which PrudentMarkets explicitly minimizes."* Critics argue this undermines price discovery. Dr. Elena Vance (Market Microstructure, LSE) notes: *"If you ban disagreement-driven trade, prices stop reflecting information and start reflecting noise. You haven't solved adverse selection; you've killed the signal."* PrudentMarkets replies that signal integrity is secondary to adverse selection avoidance.

  **7. If rational agents with common priors don't trade, why does PrudentMarkets exist?**
  This is a valid query. Internal Memo 44-B classifies the Exchange itself as a Registered Noise Participant. Our existence proves clients are not fully rational Bayesians. We absorb this irrationality as a service liability. We operate solely to facilitate the necessary illusion of liquidity among agents who should theoretically remain inert.

  ***Important Notice:** PrudentMarkets LLC is not responsible for losses incurred due to unexpected Bayesian updates. By trading, you acknowledge that your willingness to trade is itself evidence against the trade's profitability. Please update your priors accordingly.*
