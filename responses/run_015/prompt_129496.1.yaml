answer: |-
  This is a fascinating chain of reasoning, and I think you have correctly identified that the tension arises when we try to scale the specific logic of Parfit's Hitchhiker up to the messy complexity of real-world social signaling. You are right to feel that the argument goes off the rails around step five or six, and I believe the specific break occurs in step six, though it is enabled by a subtle overgeneralization in step five. If you want to preserve the core insight of the Hitchhiker case in steps one through three, which I agree you should keep because they represent a solid standard in decision theory regarding resolute choice and dispositional rationality, then you need to reject the inference that rationality requires cultivating every disposition that appears in a rewarded profile. The mistake lies in treating social profiles as simple aggregations of independent traits rather than as context-sensitive functions.

  When you formulate the Predictability Principle in step three, it works beautifully for the Hitchhiker because the context is binary and specific: the driver cares about exactly one disposition, which is the willingness to pay for this specific ride once safety is secured. The driver does not care if you are vengeful to your enemies or forgiving to your friends; he only cares about the disposition relevant to the transaction at hand. However, in step five, you suggest that observers reward based on profile coherence, which is true, but in step six you interpret this to mean you must adopt every disposition within that profile simultaneously. This assumes that a socially rewarded profile is something like a checklist of virtues where having more is always better, but in reality, a rewarded profile is a set of conditional rules. Observers do not reward someone who is universally forgiving and universally vengeful; they reward someone who is forgiving when forgiveness is appropriate and vengeful when retribution is appropriate. This is not two incompatible psychological architectures colliding; it is a single, complex disposition of discriminative sensitivity.

  The contradiction you find in step seven relies on the idea that you must hold unconditional forgiveness and unconditional vengeance as stable traits at once. But rational dispositions derived from the Hitchhiker logic are never unconditional; they are always tied to the conditions under which the predictor is scanning you. You do not need to be the kind of person who forgives everyone to be rewarded by friends; you only need to be the kind of person who forgives friends. You do not need to be the kind of person who punishes everyone to be respected in business; you only need to be the kind of person who punishes defectors. These are not psychologically incompatible states because they are triggered by different contextual cues. The psychological architecture required is not one that holds contradictory universals, but one that possesses the nuance to distinguish between a friend who made a mistake and an enemy who exploited a weakness. Therefore, the Predictability Principle does not demand the impossible; it merely demands a more sophisticated disposition than the one-dimensional traits you are imagining.

  If you drop the assumption in step six that you must cultivate every disposition in a profile regardless of context, you resolve the contradiction without sacrificing the Hitchhiker resolution. The cost of giving this up is that you lose the simplicity of thinking about rationality as adopting global character traits. You cannot simply decide to be a "forgiving person" or a "vengeful person" in the abstract; you must decide to be a person who tracks reasons appropriately across different domains. This makes the calculation of what disposition to cultivate much harder because you have to model not just what trait is rewarded, but in which specific interactions that trait will be scanned by predictors. It means rationality is not about becoming a certain static type, but about becoming a certain kind of responsive agent.

  This adjustment also clarifies what step five means by coherence. Coherence in a trait profile does not mean having all the traits; it means having a consistent rule for applying them. A person who forgives friends and punishes enemies is coherent because both actions stem from a single underlying principle of reciprocity or fairness. A person who punishes friends and forgives enemies is incoherent not because they lack traits, but because their application of traits violates the expected mapping of context to response. Observers punish the incoherence because it signals unpredictability in a way that makes cooperation risky, not because the person lacks enough virtues. By recognizing that the rewarded profile is a coherent mapping of contexts to responses rather than a bundle of independent virtues, you avoid the requirement to hold logically contradictory unconditional dispositions.

  So, to answer your question directly, you should drop the inference in step six that rationality requires cultivating every disposition belonging to a socially rewarded profile. You replace it with the view that rationality requires cultivating the specific conditional dispositions that are rewarded in the specific contexts you expect to face. The price you pay is acknowledging that the Predictability Principle is context-bound and that human rationality involves managing a complex ecosystem of conditional commitments rather than simply installing a single software patch like pay-the-driver. This preserves the integrity of the Hitchhiker solution because the driver is just one specific context where the condition is if-rescued-then-pay, and it saves you from the absurdity of needing to be both a saint and a tyrant simultaneously. You remain a rational agent who binds themselves to future actions when it benefits them to be predicted as such, but you recognize that the binding is always relative to the relationship and the situation at hand.

  I hope this helps untangle the knot you found. It is a very sharp observation that scaling up dispositional rationality creates friction, but the friction comes from oversimplifying how dispositions are structured in the wild rather than from a flaw in the core logic of Newcomb-like problems. You can keep your intuition about the Hitchhiker safely intact while rejecting the idea that this logic forces us into psychological impossibility. It just forces us to be more nuanced about what kind of creatures we are trying to be.
