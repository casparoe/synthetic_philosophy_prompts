      *   *Prompt:* "affected has no stopping point." -> Make sure Jordan brings this up.
      *   *Prompt:* "coercion-as-matter-of-degree." -> Touch on this in the nuance section.

  6.  **Polishing:**
      *   Ensure the voices sound distinct. Alex is more consequentialist/moral; Jordan is more institutional/normative.
      *   Remove lecture-speak. Make it sound like a conversation between tired grad students.
      *   Check the pacing. Ensure the back-and-forth feels responsive.

  7.  **Final Review against constraints:**
      *   Competent defenders? Yes.
