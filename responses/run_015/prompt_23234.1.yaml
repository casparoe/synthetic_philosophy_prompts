  *(Self-Correction Note during final review)*: I need to make sure I don't accidentally solve the problem. The prompt asks for them to be *forced to confront* the hardest version, not to solve it. The ending should feel like a productive impasse.

  8.  **Final Polish:** (Writing the dialogue based on these thoughts.)
answer: |-
  **Setting:** *A university coffee shop, 4:00 PM. The seminar on Democratic Boundaries ended twenty minutes ago. Alex (defending All-Affected) and Jordan (defending All-Subjected) are staring at half-empty mugs. The whiteboard from class is still visible in the background, covered in erased arrows.*

  **Alex:** I can't shake the fishing case. Professor said it was a "standard boundary puzzle," but it feels like a moral emergency. If State A closes those grounds, the fishers from States B and C lose their livelihoods. Permanently. How can we say they don't get a vote?

  **Jordan:** Because they aren't members of State A. They don't live under its constitution. They can't run for office there, they don't pay income tax there. If you give them a vote on this, why not a vote on State A's interest rates? Or their zoning laws?

  **Alex:** Because the impact isn't the same. Interest rates fluctuate; this is a targeted deprivation of a specific resource they've used for generations. The All-Affected principle isn't about "everyone who feels a breeze when a door opens." It's about *significant interests*. When a decision destroys your capacity to plan your life, you need a say.

  **Jordan:** But who decides what's "significant"? That's the explosive objection, Alex. You're making the boundary of the *demos* contingent on the outcome of the decision itself. To know who votes, we have to know the impact. But to know the impact, we have to know the policy. It's circular. And practically? It means every time State A votes, they have to poll the entire region to see who cares enough.

  **Alex:** That's a bureaucratic objection, not a moral one. We can handle logistics. What I can't handle is your formalism. You're hiding behind the border. You say the fishers aren't "subject" to State A's laws. But that's not true.

  **Jordan:** How isn't it true? State A's police can't arrest them in their own waters.

  **Alex:** No, but State A controls the ports. If a fisher from State B tries to dock in State A to sell a catch from *other* waters, State A inspects them. State A controls the visa regime. If State B retaliates economically, State A can sanction individuals. The power isn't just "law within the territory." It's structural. State A has the capacity to coerce those fishers extraterritorially. If you accept that democracy is about restraining coercion, you have to include them.

  **Jordan:** Okay, now you're shifting from "affected" to "subjected," but you're stretching "coercion" until it snaps. Yes, State A has power. Everyone has power over everyone else in a globalized economy. If State A bans fishing, the price of fish goes up in State D. Are the consumers in State D "coerced"?

  **Alex:** Consumers have alternatives. The fishers don't. That's the difference between being *influenced* and being *subjected*.

  **Jordan:** But that's a matter of degree, not kind. You're drawing a line at "livelihood destruction." Okay, fine. But look at the reverse. If those fishers get a vote because they are economically impacted, does the shipping company that transports the fish get a vote? Does the environmental NGO in State A get a vote because they care about the ecosystem?

  **Alex:** The NGO is already a citizen. They're in.

  **Jordan:** Right. But the shipping company might be based in State D. If their business model relies on those fish, they are affected just as much as the fishers. Under your view, do they get a vote?

  **Alex:** If their vital interests are at stake, yes.

  **Jordan:** See? Now you've got foreign corporations voting in State A's elections. You've dissolved the political community. Democracy requires a *we*. A group of people who agree to be bound by the collective decision, win or lose. The fishers from State B don't agree to be bound by State A. If they lose the vote, they aren't obligated to obey State A's enforcement vessels. They can just keep fishing and dare State A to shoot them.

  **Alex:** But they *can't* dare them, because State A has the bigger navy. That's the point! They are de facto subject to State A's will, even if they aren't de jure citizens. Your "All-Subjected" principle works great in a world of Westphalian bubbles. We don't live in that world. We live in a world where State A's domestic policy is State B's foreign crisis. If democracy is about self-government, those fishers are being governed by State A, whether you print them a passport or not.

  **Jordan:** I agree that being governed without consent is a problem. But is *democracy* the solution to every power imbalance? If State A harms State B's fishers, that's a job for international law, treaties, or human rights courts. It's not a job for State A's ballot box.

  **Alex:** Why not? Because it's messy?

  **Jordan:** Because it breaks the reciprocity of law. In a democracy, I obey the law because I had a hand in making it. If the fishers from State B get a vote, do they then have to obey State A's tax laws? Do they get protection from State A's police when they're on vacation there?

  **Alex:** Maybe not full citizenship. Maybe just a functional franchise for that specific issue.

  **Jordan:** Ah, the "stakeholder citizenship" move. But that fragments sovereignty. Now State A has one electorate for fishing, another for trade, another for climate. Who is the "people"?

  **Alex:** The "people" is whoever is caught in the web of that decision. Look, Jordan, I hear your fear about the infinite regress. I do. But look at the cost of your view. You're saying State A can vote to starve its neighbors as long as it doesn't technically arrest them. You're prioritizing the coherence of the voting list over the autonomy of the people being crushed by the vote.

  **Jordan:** And I'm prioritizing the possibility of democratic accountability over a moral free-for-all. If everyone affected votes, no one is responsible. State A's voters can say, "Well, the foreign fishers outvoted us, so we aren't responsible for this ban." It washes out agency.

  **Alex:** But right now, State A's voters *have* all the agency. They can export their costs. That's the real tyranny.

  **Jordan:** Okay, let's press your extraterritorial point again. You mentioned port inspections. Suppose State A says, "If you fish here, we ban you from our ports." Is that coercion?

  **Alex:** It's a conditional threat that limits their freedom. Yes.

  **Jordan:** But State B's fishers *choose* to come to State A's ports. They aren't forced to.

  **Alex:** They are forced by economics. If State A is the only market with deep-water docks...

  **Jordan:** Then the coercion comes from geography and economics, not State A's *political authority*. There's a difference between being at the mercy of a market and being subject to a sovereign. Democracy is about legitimizing sovereign power, not fixing market failures.

  **Alex:** But the market failure is created by the sovereign's law! The fishing ban is a political act. It weaponizes the geography. You can't separate the law from the economic reality it creates.

  **Jordan:** I'm not saying the harm isn't real. I'm saying the remedy isn't necessarily a vote. If I punch you, I've harmed you. You don't get to vote in my household to stop me. You get to call the police. The fishers need recourse, sure. But making them voters in State A conflates *justice* with *democratic membership*.

  **Alex:** But in a democracy, the "police" are us. That's the whole point. If they can't call "us," because "we" don't recognize them as part of the "us," then the police are just a weapon.

  **Jordan:** *Pauses, stirring coffee.* That's the hard part. If I admit that significant extraterritorial coercion creates a claim to membership... where does it stop? Climate change. State A's emissions are killing people in the Global South. By your logic, do they get votes in State A's election?

  **Alex:** *Hesitates.* If the interest is vital... yes. Why not?

  **Jordan:** Because then State A is no longer a state. It's a global parliament. And since we don't have a global parliament, State A's voters will just resent the imposition, turn populist, and close the borders entirely. You might get theoretical justice but practical authoritarianism.

  **Alex:** And if we stick with your view, we get a clean, coherent electorate that feels perfectly justified in ignoring the suffering next door because "they aren't subject to our laws." We get democratic legitimacy for immoral outcomes.

  **Jordan:** So we're stuck. My view protects the integrity of the decision-making process but risks moral blindness. Your view protects the moral interests but risks dissolving the decision-making agent.

  **Alex:** Basically. In the fishing case... I still think the fishers need a vote. Or at least a veto.

  **Jordan:** And I still think they need a treaty. But... I'll admit this. If State A uses its port access as a enforcement mechanism for the ban, the line between "external market" and "internal jurisdiction" gets blurry.

  **Alex:** And I'll admit... if giving them a vote means State A's citizens feel like they've lost control of their own polity, the backlash could hurt the fishers more than help them.

  **Jordan:** So neither principle gives us a clean answer for the coastline.

  **Alex:** No. It just tells us where the blood is.

  **Jordan:** *Sighs.* Same time next week?

  **Alex:** Yeah. I need to read more on the "all-coerced" modification. Maybe that splits the difference.

  **Jordan:** Don't get your hopes up. See you then.
