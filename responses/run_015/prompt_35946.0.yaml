      *   *The Ranking:* Students rank the *False Assertion* option from the scenarios.
      *   *Augustine's Ranking:*
          1.  Religious doctrine.
          2.  Harm to no one/profit to someone.
          3.  Harm to no one/pleasing someone.
          4.  Jest.
          5.  Pleasing in discourse.
          6.  Harm to no one/profit to someone (property).
