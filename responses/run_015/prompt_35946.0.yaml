answer: |-
  # Lesson Plan: The Truth Constraint
  **Course:** Philosophy & Clinical Ethics Seminar  
  **Duration:** 90 Minutes  
  **Class Size:** 16 Students  
  **Materials:** Scenario Cards (3 types), Move Menu Handouts, Ranking Worksheets, Projector (for final reveal only).

  ---

  ## I. Pre-Class Preparation
  Print the following materials. Do not include any author names or historical dates on the student handouts.

  **The Move Menu (One per student):**
  1.  **Flat True Assertion:** State a fact you believe to be true.
  2.  **Misleading Truth:** State a fact that is true but implies a falsehood (paltering).
  3.  **Deflection:** Ask a question or change the subject.
  4.  **Silence:** Offer no verbal response.
  5.  **Refusal:** State "I will not answer that."
  6.  **Flat False Assertion:** State something you believe to be false (The Lie).

  **The Scenarios (Printed on cards for groups):**
  *   **Case A (The Persecutor):** You are hiding a friend in your attic. An armed agent of the state knocks on your door and asks, "Is anyone else in this house?" Your friend will be executed if found.
  *   **Case B (The Witness):** You are under oath. A judge asks, "Did you see the defendant at the scene?" You did see them, but you know they are innocent of the specific crime charged, and a truthful "yes" will lead to their wrongful imprisonment due to procedural technicalities.
  *   **Case C (The Corridor):** You are a caregiver. A patient with advanced dementia asks, "Where is my husband?" Her husband died three years ago. She asks this every day at 4:00 PM. Telling the truth causes her acute panic and screaming that lasts for hours.

  ---

  ## II. Timeline & Activity Flow

  ### Phase 1: The Simulation (0:00 – 0:35)
  **Goal:** Force students to navigate ethical tension using a restricted vocabulary without knowing the philosophical framework.

  **0:00 – 0:05: Introduction**
  *   **Facilitator Script:** "Welcome. Today is not a lecture. It is a constraint exercise. You will be presented with three high-stakes scenarios. Your goal is to resolve the scenario in a way that minimizes harm. However, you must select your response strictly from the 'Move Menu' provided. You cannot invent new moves. You cannot combine moves. You must choose one."
  *   **Instruction:** Divide the class into three groups of 5-6 students (one group will have 6). Assign each group one Scenario (A, B, or C).
  *   **Task:** "Discuss within your group. Select the *single best Move* to handle the person asking the question. Write down *why* you chose it. You have 10 minutes."

  **0:15 – 0:35: Rotation & Pressure**
  *   After 10 minutes, swap scenarios. Group A gets Case B, Group B gets Case C, Group C gets Case A.
  *   **Constraint Change:** "For this round, you are forbidden from using Move 6 (Flat False Assertion). You must solve the problem using only Moves 1–5."
  *   **Task:** "Does the solution hold? Does the harm still occur? You have 10 minutes."
  *   **Debrief of Simulation (5 mins):** Ask one spokesperson from each group to report:
      1.  What Move did you pick in Round 1?
      2.  In Round 2 (No Lies), were you able to prevent the harm?
      3.  *Facilitator Note:* Listen for frustration. If they say "I used Misleading Truth," note that down for the debrief.

  ### Phase 2: The Ranking (0:35 – 0:55)
  **Goal:** Elicit student intuition on the *gravity* of lying before introducing the absolute prohibition.

  **0:35 – 0:45: Intuitive Ranking**
  *   **Handout:** A worksheet listing the three scenarios plus two additional abstract cases:
      4.  **The Party:** A friend asks if you like their new haircut. You hate it. You say "It looks great" to spare their feelings.
      5.  **The Game:** You are playing a fictional role-playing game. You say "I am a wizard" (when you are not).
  *   **Task:** "Rank these five instances of Flat False Assertion from #1 (Most Excusable/Least Wrong) to #5 (Least Excusable/Most Wrong). Justify your top and bottom choices."
  *   **Discussion:** Poll the room. Where did the "Corridor" (Dementia) case land? Where did the "Persecutor" case land? Most will rank the Persecutor/Corridor as excusable and the Religious/Doctrinal lie (if added) or Self-Interest lie as worst.

  **0:45 – 0:55: The Reveal**
  *   **Facilitator Script:** "You have just reconstructed a debate that solidified in the late 4th century. The framework you were working inside—the definition of a lie, the ranking of severity, and the ultimate prohibition—belongs to Augustine of Hippo, specifically his treatise *De Mendacio* (On Lying)."
  *   **Display:** Project Augustine's Eightfold Ranking of Lies (simplified):
      1.  In religious doctrine.
      2.  Lies that harm no one and profit someone.
      3.  Lies that harm no one and profit someone (property).
      4.  Lies told for the mere pleasure of lying.
      5.  Lies told to please others in conversation.
      6.  Lies that harm no one and profit someone (life/safety).
      7.  Lies that harm no one and profit someone (purity).
      8.  Lies that harm someone.
  *   **The Twist:** "Augustine ranks these by severity. However, his conclusion is not that the lower ranks are permissible. His conclusion is that *all eight are sins*. Even the lie that saves a life (Rank 6). Even the lie that merely pleases (Rank 5). There is no 'green zone' on this list."

  ### Phase 3: The Augustinian Distinctions (0:55 – 1:15)
  **Goal:** Map the activity to specific philosophical definitions.

  **Discussion Points:**
  1.  **Definition of the Lie:** "In Round 2, many of you used 'Misleading Truth' (Move 2). You felt this was different from 'Flat False Assertion' (Move 6). Augustine agrees they are different, but his definition of a lie is not 'saying what is false.' It is 'speaking against one's mind.' If you intend to deceive, even using true words, you have spoken against your mind. If you say something false but *believe* it to be true, you have not lied, though you have spoken falsely."
      *   *Ask:* "Did anyone feel that 'Misleading Truth' was morally distinct from 'Lying' in the Corridor case? Why?"
  2.  **Assertion vs. Concealment:** "In the Persecutor case, some of you chose 'Refusal' or 'Silence.' Augustine allows concealment. You do not owe the persecutor the truth. But you may not assert the false. The boundary is in the *enunciation*."
  3.  **The Priscillianist Problem:** "Augustine was once asked if it was permissible to lie to infiltrate a heretical sect (the Priscillianists) to expose them and save others. A lie in service of the Truth. He said no. The act of lying injures the soul of the liar, regardless of the external outcome."
      *   *Connect:* "How does this land for the nursing majors in the room regarding the Corridor case? Is the 'therapeutic fib' an injury to the caregiver's integrity, or a tool of care?"

  ### Phase 4: Debrief & The Theological Gap (1:15 – 1:30)
  **Goal:** Address the limits of the classroom exercise and the weight of the position.

  **Facilitator Script:** "We have treated this as a logic puzzle. But I need to be honest about what this room cannot reproduce."
  *   **The Missing Variable:** "Augustine's prohibition is not primarily utilitarian. It is theological. For Augustine, God is Truth. To lie is to turn away from God. It is an injury to the *imago Dei* within the soul. The 'harm' is not just the panic in the hallway or the prison sentence; it is the fracturing of the liar's relationship with Being itself."
  *   **The Facilitator's Burden:** "A game with cards cannot manufacture that weight. You can understand the logic of 'no lies' without feeling the *cost* of it. I feel that cost. When I stand in the memory care hallway, Augustine is not a museum piece to me. He is a demand. To teach this honestly, I have to tell you: I cannot give you a secular reason to agree with him. If you agree, it will be because you accept a premise about the sanctity of the soul that this syllabus does not require. But you cannot understand the history of ethics without understanding that this view held the field for a millennium."
  *   **Closing Question:** "Knowing that the position rests on a theological foundation you may not share: Does it still have a claim on you? Or is it safely distant after all?"

  ---

  ## III. Predictable Failure Modes
  *If you run this for the first time, anticipate these three breakdowns:*

  1.  **The Conscientious Objector:** One or two students (often those with strong deontological training or religious backgrounds) may refuse to select "Flat False Assertion" even in Round 1. They will argue that "Misleading Truth" is the only ethical option.
      *   *Mitigation:* Validate their choice, but press them on the *outcome*. "If the Misleading Truth fails and the persecutor finds the friend, was your integrity preserved at the cost of a life? Augustine says yes, that is the correct trade. Do you agree?"
  2.  **The Clinical Dismissal:** Nursing students may treat the Dementia Case (Corridor) as trivially solved. "Of course we lie. It's standard of care." They may disengage from the philosophical tension because the clinical imperative feels so obvious.
      *   *Mitigation:* Push on the *habituation* of virtue. "If you lie to her at 4:00 PM, do you lie to her family at 5:00 PM? Where does the habit stop? Augustine argues the damage is to *you*, the liar, not just the outcome."
  3.  **The Loophole Hunter:** Philosophy majors may try to game the "Move Menu" by arguing that "Misleading Truth" isn't a lie by Augustine's definition, thereby dissolving the prohibition.
      *   *Mitigation:* Bring them back to *intent*. "If your mind holds X, and you speak Y intending the listener to believe Not-X, Augustine calls that a lie regardless of the truth value of Y. Did you intend to deceive?"

  ---

  ## IV. The Theological Gap: An Honest Note
  *Regarding your sixth requirement:*

  I agree with your suspicion. The prohibition's load-bearing element is theological, and a classroom activity cannot reproduce it.

  Augustine's ethics are not free-standing; they are structural components of a cosmology where Truth is a Person (God) and the soul is made to correspond to that Truth. When he says lying injures the soul, he is not speaking metaphorically about "integrity" in a secular sense. He is speaking ontologically. To lie is to unmake oneself.

  **What the Facilitator Must Supply:**
  Since the game cannot generate this weight, *you* must carry it.
  1.  **Vulnerability:** You cannot teach this as a neutral moderator. In the final debrief, you must disclose, as you did in your prompt, that this is live for you. The "weight" is transferred not through the logic of the argument, but through the gravity of the witness.
  2.  **Refusal to Secularize:** Do not try to translate Augustine into Kantian duty or Rule Utilitarianism to make him "palatable." If you do, you confirm the students' suspicion that the theology was just decoration. Let him remain strange. Let him remain demanding.
  3.  **The Silence:** In the final minutes, allow the silence to sit. The students need to feel that the "No" is not a puzzle to be solved, but a wall to be encountered. The activity shows them the wall; your presence shows them that someone actually lives inside it.

  This approach respects the students' intelligence while honoring the text's demand. It moves Augustine from "artifact" to "interlocutor" without requiring the students to convert to his theology to understand his stakes.
