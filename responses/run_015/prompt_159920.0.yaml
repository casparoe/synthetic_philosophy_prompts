prompt: |-
  I am a novelist, and I am well into a book set in the southern Maya lowlands during the Terminal Classic: a multigenerational novel about a family of scribes attached to a court that is slowly, and without ever deciding to, giving up the habit of raising carved and dated stone monuments. I find that I cannot write a page of it until I know what kind of event I am depicting, so what I need is a case analysis rather than background reading.

  The criterion I have been working with — call it the testamentary criterion — is this: a society has collapsed, as opposed to merely changed, when it loses the practices by which it hands a description of itself to those who come after it. Collapse on this view is not the loss of population, territory, or complexity, but the breaking of a chain of address: the cessation of records made for the sake of a future reader who will not otherwise know what has been lost, and who could therefore either reclaim it or knowingly refuse it. What is destroyed in a genuine collapse is not well-being or power but the capacity of successors to know what it is they are missing.

  Please take the Terminal Classic transformation of the Classic Maya and analyze it strictly through this criterion, and then tell me where the criterion breaks. Take the following as given: the number of dated monuments erected per year across the Maya area rises to roughly forty around 750, falls back to about ten by 800, and reaches zero by about 900, with no new major construction in the central Maya area after roughly 830; the Copán valley population, which peaked near twenty-eight thousand in the fifth century, declines to about fifteen thousand by 900 and to under a thousand by 1200; the northern Yucatán subsequently prospers, with Chichén Itzá, Mayapán and Uxmal flourishing in very different artistic and architectural styles and with far less monumental hieroglyphic writing; Maya communities and languages persist, and an independent Maya polity survives until the Spanish conquest of Nojpetén in 1697.

  I would like four things. First, a disciplined mapping: what the unit is (a city-state, a polity, a scribal institution, the Long Count itself), what on this criterion counts as the record addressed to the future, what it says was happening to people who went on farming, trading and building while the carving stopped, and whether the verdict is collapse, transformation, or something the criterion has no word for.

  Second, the places where the criterion misdescribes the case. It appears to make the fate of a whole population track the fate of an elite technology of self-commemoration; I want to know whether that is a fatal class bias or a defensible consequence, and how the criterion should handle a society most of whose members never had a testament at all.

  Third, two stress cases from outside the Maya material. For Mycenaean Greece: Linear B was a script used almost entirely for palace administration, it disappears with the destruction of the palaces around the end of the Late Bronze Age, and the following centuries offer no conclusive evidence of writing in Greece until the adoption of the alphabet several centuries later — so does the criterion deliver the result that the Mycenaean world collapsed, or the result that it never addressed the future in the first place and so was never the kind of thing that could collapse? And for the Maya themselves: if the destruction of the surviving Maya books by Spanish missionaries in the sixteenth century, and the long period in which Maya writing was present but unreadable before its decipherment in the twentieth century, both bear on the chain of address, then the criterion seems to say either that the Maya collapse was inflicted from outside in the 1500s or that it was revoked by scholars in the 1900s. Tell me what the criterion should say about collapse imposed by a conqueror and about collapse repaired retroactively. If you bring in Rapa Nui, do not rest anything on the disputed demographic and ecological story there.

  Fourth, what the case does to the criterion in return — whether it confirms it, or is an anomaly, or is a case the criterion never anticipated — and one further matter that is personal to the project: my own novel is an artifact of exactly the kind whose disappearance is supposed to constitute a collapse. Does the criterion in fact imply that a people can be un-collapsed by being written about, that collapse is revocable by art, and does it give any guidance to an agent inside the process, such as a lord deciding in a bad year whether the stela still gets carved? Where the criterion is silent, say so rather than making it speak. Do not give me citations or reading lists; work from the facts I have supplied and from what you already know.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a multigenerational novel about a family of scribes in the Terminal Classic Southern Maya Lowlands.
      *   **Core Concept:** "Testamentary Criterion" of collapse. Collapse = loss of practices handing a description of oneself to the future (breaking the chain of address). Not loss of population/power, but loss of *knowability* by successors.
      *   **Task:** Analyze the Terminal Classic Maya transformation strictly through this criterion, identify where it breaks, use stress cases (Mycenae, Colonial Maya), and reflect on the criterion's implications for the novelist's project.
      *   **Constraints:** No citations/reading lists. Use provided facts + general knowledge. Do not make the criterion speak where it is silent.
      *   **Deliverables:**
          1.  Disciplined mapping (Unit, Record, Content, Verdict).
          2.  Critique of the criterion (Class bias, non-elites).
          3.  Two stress cases (Mycenae, Colonial Maya/Decipherment).
          4.  Reflexive analysis (Effect on criterion, guidance for the novelist/character).

  2.  **Deconstruct the "Testamentary Criterion":**
      *   *Definition:* Collapse = cessation of records made for a future reader who needs them to know what was lost.
      *   *Key Mechanism:* The "Chain of Address."
      *   *Implication:* If you stop writing for the future, you collapse, even if you survive biologically. If someone else writes about you later, does that "un-collapse" you?

  3.  **Drafting Section 1: Disciplined Mapping:**
      *   *Unit:* Is it the civilization? The city-state? The scribal caste? The prompt suggests the "court" and "family of scribes." The criterion focuses on the *practice* of recording. So the unit is the *Scribal-Court Complex* within the *Polity*.
      *   *Record:* Dated stone monuments (Stelae/Altars) using the Long Count. This is the specific technology mentioned in the prompt (rising/falling numbers).
      *   *Content:* What does it say about the farmers/traders? Usually, monuments celebrate kings, wars, rituals. They rarely describe the agrarian base directly. But they *imply* the stability of the cosmic order that allows farming.
      *   *Verdict:* Under this criterion, the *Southern Lowland Court System* collapsed. The *Population* transformed. The *Civilization* (broadly) transformed (shifted North).
      *   *Nuance:* The prompt says "no new major construction... after 830." So, by the criterion, the specific *address* stopped.

  4.  **Drafting Section 2: Where the Criterion Misdescribes (Class Bias):**
      *   *Problem:* The criterion equates "elite writing" with "society's existence."
      *   *Maya Reality:* 90%+ of people were illiterate farmers. Did *their* chain of address break? Oral traditions, pottery styles, house construction continued.
      *   *Bias:* It privileges the *voice* of the elite over the *existence* of the mass.
      *   *Defense:* Maybe the elite *were* the mechanism of continuity (organizing water, trade). If they stop writing, maybe the system holding the farmers together dissolves (evidenced by population drop in Copán).
      *   *Conclusion:* The criterion conflates "Loss of Elite Self-Definition" with "Societal Collapse." It is defensible only if the elite record is the *structural glue*, not just a vanity project. In the Maya case, the cessation of stelae correlates with political fragmentation, so it's a symptom, but the criterion makes it the *definition*.

  5.  **Drafting Section 3: Stress Cases:**
      *   *Mycenae:* Linear B = administrative (inventory), not testamentary (for the future). It wasn't addressing successors; it was managing the present.
          *   *Criterion Verdict:* Mycenae never "existed" in a testamentary sense, so it couldn't "collapse" by this definition. It just ended. This reveals a flaw: The criterion requires *intent* to address the future.
      *   *Colonial Maya/Decipherment:*
          *   *Scenario A (Spanish Destruction):* Books burned. Chain broken by force. Criterion says: Collapse inflicted from outside.
          *   *Scenario B (Decipherment):* We can read it now. Is the chain restored?
          *   *Analysis:* The criterion hinges on the *intent of the maker* to reach a *capable reader*. If the reader doesn't exist (undeciphered), the chain is broken *functionally*, even if the object exists. If decipherment happens, does it "un-collapse"?
          *   *Implication:* Collapse becomes epistemic (about knowledge) rather than ontological (about being). This is dangerous. It suggests history is only real when understood.

  6.  **Drafting Section 4: Reflexive Analysis & Novelistic Guidance:**
      *   *Effect on Criterion:* The Maya case stresses the "North vs. South" divide. The North flourished (Uxmal) but with less writing. Did they collapse? No, they transformed. So the criterion must be localized. It detects the collapse of a *specific mode of legitimacy*, not necessarily a people.
      *   *The Novelist's Artifact:* The novel itself is a testament.
      *   *Question:* Does writing about them "un-collapse" them?
      *   *Answer:* No. The criterion is about the *internal* chain of address (then to future). External reconstruction (now about then) is archaeology/history, not the survival of the original chain.
      *   *Guidance for the Character:* The lord/scribe faces a choice. If they stop carving, do they cease to be?
      *   *Silence:* The criterion cannot tell the character *what to do*. It can only describe the consequence *after* the fact. It offers no moral imperative, only a diagnostic one. It cannot predict if stopping will cause ruin or save resources.
      *   *Personal Matter:* The novel is a *new* chain, not a continuation of the old one. It acknowledges the break.

  7.  **Review and Refine:**
      *   *Tone:* Analytical, rigorous, respectful of the novelist's intellectual framework.
      *   *Check Constraints:* Did I use outside citations? No. Did I answer all four parts? Yes. Did I avoid resting on Rapa Nui? Yes (didn't use it).
      *   *Refining the "Chain of Address":* Make sure to distinguish between the *object* surviving and the *language/capacity to read* surviving. The prompt mentions the decipherment in the 20th century. This is crucial for the "retroactive repair" question.
      *   *Refining the "Class Bias":* Ensure I address the "farmers trading and building" aspect from the prompt.
      *   *Refining the "Novelist's Role":* Be careful not to say "Your book saves them." That's romantic. The criterion is colder. The book *testifies to the collapse*, it doesn't undo it.

  8.  **Final Polish:** Check the flow between sections. Ensure the distinction between "Southern Lowlands" (collapse) and "Northern Yucatán" (transformation) is clear in the mapping. Ensure the Mycenaean distinction (administrative vs. testamentary) is sharp.

  *(Self-Correction during drafting)*: I need to be careful with the "un-collapse" idea. If I write a novel, am I the "future reader" reclaiming it? The prompt asks: "Does the criterion in fact imply that a people can be un-collapsed by being written about?" I need to answer this directly. The criterion defines collapse as the *breaking* of the chain. Mending the chain from the outside (archaeology/fiction) is not the same as the chain never breaking. It's a *resurrection* of memory, not a prevention of collapse. I must distinguish between *continuity* and *recovery*.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  ### 1. Disciplined Mapping

  **The Unit:**
  Under your criterion, the unit of analysis cannot be "the Maya" as a linguistic or ethnic group, nor "the Maya Civilization" as a geographic aggregate. The unit is the **Southern Lowland Court System**, specifically the **Scribal-Elite Compact**. This is the specific institutional arrangement that produced the dated monuments. The Northern Yucatán polities (Uxmal, Chichén Itzá) constitute a different unit; they continued building and ruling but altered the *mode* of address (less hieroglyphic writing, different architectural focus). Therefore, the criterion distinguishes between the collapse of the Southern Court System and the transformation of the Northern Polities.

  **The Record:**
  The record is the **dated stone monument (stela/altar)** inscribed with the Long Count. This is not merely a record of events; it is a ritual object intended to anchor time itself. It addresses a future reader by asserting that the cosmic order (and the king's place in it) is permanent enough to be measured across *baktuns*. The content is not a description of daily life for farmers, but a declaration of the *conditions* under which farming and trading are possible: the favor of the gods, the legitimacy of the ruler, and the stability of the calendar.

  **The Content regarding the Non-Elite:**
  The monuments say nothing explicit about the fifteen thousand people in the Copán valley who continued farming as the carving stopped. However, by the logic of the criterion, the cessation of the monuments signals that the *guarantee* of their world has been withdrawn. The record implies that without the court's ritual maintenance (the carving), the cosmic agreement that allows for harvest and trade is void. The people who go on farming are, in this view, living in a "post-testamentary" void. They are surviving, but they are no longer part of a project that intends to speak to their grandchildren about *why* they survived.

  **The Verdict:**
  *   **Southern Lowlands:** **Collapse.** The chain of address is broken. The specific practice of handing a description of themselves to the future via the Long Count ceases. The population decline (28,000 to <1,000) is secondary evidence; the primary evidence is the silence of the stone.
  *   **Northern Yucatán:** **Transformation.** The chain of address continues but changes medium and tone. They do not collapse because they do not cease addressing the future, even if the grammar of that address changes.
  *   **The Agrarian Base:** **Something the criterion has no word for.** The criterion cannot categorize the fate of the illiterate majority who persist without the elite technology. They are neither collapsed (they exist) nor testamentary (they leave no record). They are the *substrate* that remains after the *structure* collapses.

  ### 2. Where the Criterion Misdescribes the Case

  **The Class Bias:**
  The criterion makes the fate of the population track the fate of an elite technology. This is a fatal class bias if one defines "society" by the welfare of its majority. If twenty-eight thousand people become one thousand, a catastrophe has occurred regardless of whether stelae were carved. However, the bias is defensible if one defines "society" as a *political project* rather than a biological aggregate. The Maya court was not a service provider; it was a cosmological engine. If the engine stops, the *political entity* has collapsed, even if the *human material* persists.

  **The Problem of the Non-Testamentary:**
  The criterion struggles with a society most of whose members never had a testament. For the farmer in the Copán valley, the "chain of address" was likely oral, embodied in lineage, land use, and ritual practice not captured on stone. If the stone stops but the oral tradition continues (as it did, leading to the K'iche' and Yucatec traditions of the Postclassic), has collapse occurred?
  *   **Misdescription:** The criterion risks declaring a collapse where there was only a *change in management*. If the farmers simply switched allegiance to a new local headman who didn't carve stone, the "society" (as lived experience) continued. The criterion mistakes the *loss of a specific medium of legitimacy* for the *loss of social continuity*.
  *   **Correction:** The criterion must be amended to acknowledge that a society can have *multiple chains of address*. The elite chain broke; the vernacular chain (oral, ceramic, domestic) persisted. The "Collapse" is therefore the decoupling of the elite chain from the vernacular chain. The elite ceased to be the interpreters of the future for the commoners.

  ### 3. Stress Cases

  **Mycenaean Greece:**
  Linear B was administrative (inventory of goods, personnel), not testamentary (history for the future). It addressed the present needs of the palace, not the understanding of a successor.
  *   **Criterion Verdict:** Under your definition, the Mycenaean world **never existed** in a state capable of collapsing. It was a system of management, not a project of self-description. When the palaces burned, the chain of address was not broken because it was never cast forward. It simply terminated.
  *   **Implication:** This reveals a limitation in the criterion: it cannot distinguish between a society that *fails to address the future* and one that *tries and fails*. It grants a kind of ontological superiority to cultures that write history over those that write ledgers. It suggests Mycenae was "lesser" than the Maya because it lacked the specific intent to speak to you, the novelist.

  **Colonial Maya and Decipherment:**
  *   **The Spanish Destruction:** When missionaries burned the codices, they physically severed the chain. The criterion verdict is **Collapse Inflicted from Outside.** The capacity to know what was lost was actively destroyed by an agent who refused the address.
  *   **The Decipherment:** When scholars deciphered the script in the 20th century, did they repair the chain?
      *   **Analysis:** No. The criterion relies on the *intent of the maker* to reach a *capable reader*. The reader must be the intended successor (cultural or political). A modern epigrapher is an external reconstructor, not the intended heir.
      *   **Verdict:** The collapse stands. The chain remains broken. The decipherment is a *resurrection of memory*, not a *restoration of continuity*.
      *   **Collapse Revoked Retroactively?** The criterion cannot support the idea that collapse is revocable. If collapse is the breaking of the chain, mending the links with modern glue (scholarship) does not make the chain whole again. It creates a new chain (archaeology/history) *about* the old one. To say collapse is revoked by art or scholarship is to confuse *being known* with *being continuous*.

  ### 4. What the Case Does to the Criterion (and Guidance for the Novelist)

  **Effect on the Criterion:**
  The Maya case confirms the criterion's utility in distinguishing between *demographic decline* and *civilizational rupture*, but it forces the criterion to admit that collapse can be *partial*. The Southern Lowlands collapsed; the Northern Lowlands transformed; the Linguistic Group persisted. The criterion is not a binary switch for a whole people; it is a diagnostic for specific *institutions of memory*. It confirms that a people can be "un-collapsed" in memory (by your novel, by decipherment) without being un-collapsed in history. The break remains real even if the silence is eventually filled.

  **Guidance for the Agent Inside the Process:**
  You ask if the criterion gives guidance to a lord deciding whether to carve a stela in a bad year.
  *   **Silence:** The criterion is silent here. It is a retrospective diagnostic, not a prospective tool. It cannot tell the lord that stopping the carving *will cause* the collapse; it can only say that if the carving stops, the collapse *has occurred* by definition.
  *   **The Trap:** If the lord knows your criterion, he is trapped. If he carves, he consumes resources needed for survival (farmers/warriors). If he stops, he admits to the future that his world is ending. The criterion implies that **the act of recording is the act of sustaining the world.** To stop writing is to admit the world is no longer worth writing about.
  *   **Novelistic Implication:** Your novel is an artifact of the kind whose disappearance constitutes collapse. Does writing it "un-collapse" the Maya? No. It acknowledges the collapse. It builds a *new* chain of address from the 21st century back to the 8th. It does not restore the 8th century's chain to the 9th.
  *   **The Character's Choice:** The criterion suggests that for the scribe, the carving is not a record of reality; it is the *creation* of reality. If he stops, he is not just saving stone; he is ceasing to generate the future in which his family exists. The anxiety your character feels should not be about "history remembering us," but about "the future ceasing to exist because we failed to summon it."

  **Final Matter:**
  The criterion implies that collapse is not an event that happens *to* a people, but a decision they make *about* time. When the Maya stopped counting the Long Count, they stopped betting on a future that would understand the count. Your novel bets on a future that will understand the loss. You are not reversing their collapse; you are testifying to the cost of their silence. The criterion gives you no hope that your book saves them, only the certainty that your book is necessary because they could not finish the sentence.
