      *Refining the "Fairness" point:* Make sure to mention *Equality vs. Equity*. Liberals prioritize Equality (outcomes), Conservatives prioritize Equity (process/merit). MFT defines Fairness largely as Equity/Proportionality. This makes Liberals look like they lack a foundation, when they actually just define it differently.

