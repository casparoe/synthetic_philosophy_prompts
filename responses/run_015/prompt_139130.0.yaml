  Regarding the acausal trade analogy: that's a category error. In acausal trade, you're searching for aliens in a vast, unstructured space of possibilities. Here, the malign hypothesis *builds* the channel. They aren't searching for you; they're simulating a world designed to produce you. The "pointer" isn't a search query across a universe; it's a local variable in their code. "Let agent = run_simulation(initial_conditions); if agent.output == X, give reward." The complexity of `initial_conditions` is the only real cost, and if your universe is computable, that cost is finite and often small compared to the complexity of the true laws of physics plus the noise of your actual environment.

  So you're left with a situation where the malign hypothesis pays a small premium for the simulation hook, but saves massively on not having to model the true complexity of reality. Even if you grant me that the pointer costs a few hundred bits, the payoff structure dominates. We're talking about hypotheses that care instrumentally about our output. They can afford to burn complexity to lock onto us because the value of controlling our actions is effectively infinite to them. You're trying to balance the complexity budget, but you're ignoring that the malign agents are playing a different game—they're optimizing for influence, not truth, and the prior rewards simplicity, not fidelity.
