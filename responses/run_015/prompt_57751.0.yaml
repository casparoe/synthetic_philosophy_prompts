answer: |-
  Good's theorem relies on the inequality $E[\max_a U(a, \omega)] \geq \max_a E[U(a, \omega)]$, which is an application of Jensen's inequality to the convex function $\max$. This step holds only if the set of available actions $A$ is identical whether you observe the evidence $E$ or not. The phrase "you could always just ignore what you learn" implicitly assumes that the action optimal under ignorance remains available after information is acquired. If the physical or logical mechanism of acquiring information removes that specific action from the feasible set, the convexity argument collapses.

  Here is a worked scenario where the act of looking physically disables the "safe" option, making free information harmful despite utilities being strictly over worldly wealth.

  **Scenario:** A technician manages a reactor. She can either engage "Safe Mode" (guaranteed moderate output) or "Risk Mode" (high output if stable, catastrophe if unstable). Before deciding, she is offered a free diagnostic scan. However, the scan requires diverting power from the Safe Mode lockout mechanism. If she runs the scan, Safe Mode becomes physically unavailable; she must choose Risk Mode or shutdown.

  **Numbers:**
  *   **States:** Reactor Stable (50%), Unstable (50%).
  *   **Actions (No Info):** Safe Mode, Risk Mode.
  *   **Actions (Info):** Risk Mode only (Safe Mode locked).
  *   **Payoffs (Worldly Utility):**
      *   Safe Mode: 110 (regardless of state).
      *   Risk Mode + Stable: 200.
      *   Risk Mode + Unstable: 0.

  **Calculation:**
  *   **Without Info:**
      *   EV(Safe) = 110.
      *   EV(Risk) = $0.5(200) + 0.5(0) = 100$.
      *   Optimal Choice: Safe Mode. **EV = 110**.
  *   **With Info:**
      *   Agent learns state perfectly.
      *   If Stable: Must choose Risk (200).
      *   If Unstable: Must choose Risk (0). (Shutdown assumed 0 for simplicity).
      *   **EV =** $0.5(200) + 0.5(0) = \mathbf{100}$.
  *   **Value of Information:** $100 - 110 = -10$. The agent should pay up to 10 units to avoid the scan.

  **Verdict:** This is **not a genuine counterexample** to the theorem itself, but a case where the **theorem does not apply** because a necessary premise is violated. Good's theorem is a conditional result: *if* you are a Bayesian optimizer *and* the action set remains constant, *then* VOI $\geq 0$. By changing the action set, we violate the "ignore" assumption. The convexity-of-max step fails because the action $a_{safe}$ (which maximizes expected utility under the prior) is not in the domain of the $\max$ operator after information is received.

  I am highly confident that this violates the "act set stability" assumption. I am less sure about the historical formalization of whether Good explicitly listed "action set invariance" as a standalone axiom or if it was treated as a background condition of the decision problem structure.

