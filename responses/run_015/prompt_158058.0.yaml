answer: |-
  The kiosk hummed, a low-frequency vibration that Lena felt in her molars. It was 4:13 PM on a Tuesday, the time of day when the Ministry's servers usually lagged, but the screen in front of her was crisp. Too crisp.

  **SUBJECT: 8940-B**
  **DEFICIT: 42 Care-Hours (Terminal Care Unit)**
  **STATUS: Pending Liquidation**

  Lena hovered her finger over the glass. The option wasn't in the main menu. You had to know the sequence: *Audit > Transfer > Unclaimed Liability > Voluntary Assumption.* The system didn't advertise it. It treated altruism like a clerical error.

  To her left, the thermal printer woke up with a mechanical *chug-whir*, spitting out a receipt for the man ahead of her. He was balancing his carbon tax. He looked relieved. The paper came out warm, stamped with the Ministry's official seal in faded teal. That was the color of Grace. Not gold. Gold was for state honors. Teal was for the quiet stuff, the things that didn't count toward your quota but made the city run smoother.

  Lena's phone buzzed in her pocket. She didn't need to look to know it was Elara. They were supposed to meet for dinner, but Elara knew where Lena went on Tuesdays.

  *You're doing it again,* the text read. *Don't send a pic of the receipt.*

  Lena silenced the phone. She looked back at Subject 8940-B. Forty-two hours. That was nearly a week of sitting by a bedside, sponging foreheads, monitoring IVs. Someone had failed their duty. In the old days, that would be negligence. Here, it was just a deficit. And if it wasn't filled by midnight, the patient's care level would drop to Palliative-Standard.

  If Lena took it, the loophole triggered. Because she wasn't asked, and because she was absorbing a debt that wasn't hers, the algorithm categorized it as a *Hostile Takeover of Liability*. The math was weirdly clean: her surplus canceled his deficit. Both ledgers wiped to zero. No debt for him, no "Grace" accumulation for her. Just… blank.

  That was the itch. That was the thing Elara couldn't let go of.

  *"It's not charity if the machine counts it,"* Elara had said last week, stabbing a piece of roasted carrot. *"Supererogation is supposed to be outside the ledger, Lena. It's the one thing that belongs to you. If you let the Ministry tag it, you're just pre-paying your own soul."*

  *"I'm helping people,"* Lena had replied.

  *"You're balancing the books. You're turning virtue into accounting."*

  The screen flickered. **VERIFIYING AVAILABILITY...**

  A typo. The Ministry never had typos. It made the machine feel suddenly fragile, like it was guessing just as much as she was.

  Lena looked at her own status bar in the corner of the screen. She was in the green. Deep green. She worked overtime at the Ministry, she walked to work, she composted everything. She had enough Grace stored up to buy a priority housing slot, but she never spent it. She just kept earning, just so she could give it away like this.

  But was it Grace if it was a transaction?

  If she pressed *Confirm*, 8940-B's family would get the care. The patient wouldn't suffer. That was real. But Lena would get nothing. Not even the warm glow of being a "good person," because the system would log it as a Debt-Transfer, not a Donation. It stripped the moral weight from the act. It made her a conduit, not a savior.

  Elara said that destroyed the point. Lena wasn't sure. Maybe the point was just that the work got done.

  The air in the kiosk bay was stale, recycled too many times. A woman two stations down sighed, the sound sharp in the quiet room.

  Lena thought about the patient. A stranger. A name she wouldn't know. If she walked away, the deficit would eventually be absorbed by the State Pool, which meant taxes went up for everyone, or care standards dropped. If she touched the screen, the problem vanished.

  It felt like cheating. It felt like the only honest thing left.

  Her finger trembled. The teal stamp on the man's receipt to her left was already fading, turning gray in the fluorescent light. Grace had a half-life. That was the other thing Elara said. *"Once you can price it, it expires."*

  Lena closed her eyes for a second. She didn't want to be a hero. She didn't want to be a bureaucrat. She just wanted the number to go to zero.

  She tapped the glass.

  **PROCESSING.**
  **DEBT TRANSFER INITIATED.**
  **GRCE STATUS: NULL.**

  Another typo. *Grce.*

  The printer beside her jolted to life. *Chug-whir.* It spat out a slip of warm paper. Lena took it. There was no teal stamp this time. Just a black barcode and the words: *LIABILITY SETTLED.*

  No virtue. No sin. Just a clean slate.

  Her phone buzzed again. She slipped the receipt into her pocket, next to the others, a pocket full of invisible good deeds, and walked out into the gray afternoon to meet her sister. She didn't know if she'd tell Elara the truth. Probably not. Some things, even here, were better left unaccounted for.
