answer: |-
  Here is the architecture for your twenty-five-minute exposition, designed to feed directly into the remaining hour of workshop.

  ### 1. The Sequence and Dependencies

  You cannot open with the split. If you open with the split, they will treat it as a magic trick to be solved rather than a condition to be inhabited. You need to build the intuition of unity before you break it.

  **Minute 0–5: The Intuition of Unity (The "Before")**
  *   **Action:** Establish the baseline assumption everyone carries in their head.
  *   **Content:** "When we write 'I walked into the room,' we assume the 'I', the 'walking', and the 'room' are in the same place. We assume the person is a single point in space."
  *   **Dependency:** This is required so that the split feels like a violation, not just a setting detail.

  **Minute 5–15: The Scenario (Marta, Stripped)**
  *   **Action:** Present the case.
  *   **Content:** Use your Marta scenario, but strip the novel's specific emotional context (no daughter yet, no specific crime). Just the mechanics of the split.
  *   **Constraint:** Do not name the cities yet. Call them "Site A" (Vat) and "Site B" (Body). This prevents them from getting bogged down in geography (e.g., "Is there extradition between Portugal and Canada?"). Keep it abstract until the Tests.
  *   **Dependency:** You must establish that Site B (Body) is *acting* normally. If they think the body is a zombie, the puzzle collapses.

  **Minute 15–20: The Three Tests (Passport, Visit, Harm)**
  *   **Action:** Apply pressure to the scenario.
  *   **Order:**
      1.  **Passport:** (Legal/Bureaucratic). Low stakes. Gets them thinking about official records.
      2.  **Visit:** (Relational). Medium stakes. Introduces the "other person" perspective.
      3.  **Harm:** (Moral/Existential). High stakes. This is the hammer.
  *   **Dependency:** You cannot do the Harm Question until they accept the Body is vulnerable. If they think the Body is just a puppet, harming it is property damage, not personal injury. You must insist the Body feels pain (via the link) or acts as if it does.

  **Minute 20–25: The Camera Problem (The Pivot to Craft)**
  *   **Action:** Explain why *they* (as writers) feel a need to solve this when philosophers don't.
  *   **Content:** Prose requires a vantage point. You cannot write "I" in two places.
  *   **Dependency:** This only lands if they are already frustrated that there is no clear answer to the Tests. If they think they've solved the Tests, the Camera Problem looks like a technical constraint, not a philosophical crisis.

  ---

  ### 2. The Single Example: "The Seamless Link"

  You asked for the specifications of the scenario that carries the twenty-five minutes. Use Marta, but sanitize her for the thought experiment.

  **What it must have:**
  *   **Continuity of Consciousness:** The "I" in the vat remembers walking into the cafe in Lisbon five minutes ago.
  *   **Agency of the Body:** The body in Lisbon is not comatose. It orders coffee. It smiles. It signs documents. It reacts to insults.
  *   **Synchronicity:** There is no lag. When the vat thinks "lift hand," the hand lifts. When the hand is pinched, the vat feels it.

  **What it must lack:**
  *   **Engineering:** Do not mention radio, satellites, latency, or bandwidth. The moment you introduce engineering, the Materialist in the room will say, "Well, the signal originates in the brain, so she's in Toronto." You must make the link metaphysical, not technical.
  *   **Degradation:** The body must not be decaying. It must be a viable, living human organism.
  *   **The "Why":** Do not explain *why* this was done (medical experiment? punishment?). If you give a motive, they will judge the morality of the act rather than the location of the person.

  ---

  ### 3. Misconceptions and Interceptions

  Here are the six ambushes, in the order they will occur, and the exact moment to head them off.

  **1. The "Zombie Body" Reflex (Minute 10)**
  *   **The Trap:** As soon as you describe the body in Lisbon, a writer will assume it's a shell. "But the body doesn't *know* anything, right?"
  *   **The Interception:** Pre-empt this during the Scenario setup. "To everyone in Lisbon, she is Marta. She passes a Turing test of being human. She flinches when pricked. Do not think of the body as a puppet; think of it as a remote-controlled vehicle that feels everything the driver feels."

  **2. The Materialist "Obvious Answer" (Minute 18)**
  *   **The Trap:** "She's in Toronto. Brains think. Bodies are meat. End of story."
  *   **The Interception:** Hit them with the **Harm Question** immediately. "If a stranger in Lisbon stabs the body, who is the victim? If you say Toronto, why does the Lisbon police need to investigate a murder? If the body dies, does the brain in Toronto cease to exist? If the answer is 'yes,' then she is partly in Lisbon."

  **3. The Star Trek Teleporter (Minute 19)**
  *   **The Trap:** "This is just a transporter accident. She's beamed wrong."
  *   **The Interception:** "In *Star Trek*, the original is destroyed. Here, both versions are active simultaneously. You can have tea with yourself. This is not a transfer; it is a division."

  **4. The Semantic Dissolver (Minute 21)**
  *   **The Trap:** "It's just a definition problem. 'Location' doesn't apply. She's both."
  *   **The Interception:** Hit them with the **Passport Question**. "A border control form has one box for 'Current Location'. You cannot write 'Both'. If you write 'Toronto', and the body commits a crime in Lisbon, can Lisbon extradite? Language forces a choice because the law forces a choice."

  **5. The Emotional/Relational Dodge (Minute 22)**
  *   **The Trap:** "She's where her heart is. She's where she's needed."
  *   **The Interception:** Hit them with the **Visit Question**. "Her daughter has one plane ticket. She can land in Toronto or Lisbon. She cannot land in 'Where Mum's Heart Is'. The daughter needs coordinates, not poetry."

  **6. The Narrator Fallacy (Minute 24)**
  *   **The Trap:** "But you're writing it from the Vat. So she's in the Vat."
  *   **The Interception:** This is your **Camera Problem** pivot. "That is a decision of *form*, not a discovery of *fact*. By choosing First Person in Toronto, you are not answering the question; you are hiding it. The philosophical tension exists in the gap between where the 'I' speaks and where the 'Life' is lived."

  ---

  ### 4. The Exercise: "The Jurisdictional Dispute"

  You want to test if they understand the *question*, not if they can solve the plot. Do not ask them to write a scene from Marta's perspective. They will just replicate your book.

  **The Setup (5 mins instruction):**
  Pair them up. One writer is "Crown Counsel for Toronto" (The Vat). One writer is "Crown Counsel for Lisbon" (The Body).

  **The Task (20 mins writing):**
  A crime has been committed. The Body (Lisbon) assaulted a man in a bar. The Brain (Toronto) claims it was self-defense, but the Brain was sitting in a lab in Canada when the punch was thrown.
  *   **Writer A** must write a 1-paragraph legal argument for why the trial must be held in **Toronto**.
  *   **Writer B** must write a 1-paragraph legal argument for why the trial must be held in **Lisbon**.
  *   **Constraint:** They cannot use the word "soul" or "magic." They must use physical facts (location of fist, location of intent, location of consciousness).

  **The Debrief (10 mins):**
  Ask the pairs to read their arguments.
  *   **Success Condition:** If the arguments are equally compelling and mutually exclusive, they have understood the puzzle.
  *   **Failure Condition:** If one side easily wins (e.g., "The fist was in Lisbon, so it's Lisbon"), they have collapsed the ontology back into simple materialism.

  This exercise forces them to inhabit the *conflict* rather than resolve it. It proves that "Where is she?" is not a question with an answer, but a tension that generates plot.

  ---

  ### 5. What to Refuse (and How to Say It)

  You need to explicitly close doors so they don't wander down them during the workshop.

  **1. Personal Identity Over Time**
  *   **The Refusal:** "We are not asking *who* she is, or if she is the same person she was before the operation. We are taking it as given that she is Marta. We are only asking *where* that Marta is located right now."
  *   **Why:** If they start debating identity, you lose the spatial tension required for your novel's structure.

  **2. The Hard Problem of Consciousness**
  *   **The Refusal:** "We are not debating whether the body *feels* pain or if it's a philosophical zombie. For the purpose of this workshop, if the body screams, pain exists."
  *   **Why:** Qualia discussions kill narrative momentum.

  **3. Dennett's "Center of Narrative Gravity" (Crucial Decision)**
  *   **My Advice:** **Do not mention this.**
  *   **Why:** It is too tempting for novelists. It sounds like "The story determines the self." If you tell them this, they will feel they have solved the puzzle by saying "She is where the narration is." That validates the **Narrator Fallacy** (Misconception #6 above). It gives them a way out of the tension. You want them stuck in the tension. That is where the energy for their writing comes from. Keep Dennett's solution in your pocket for office hours or the bar afterwards.
  *   **Script:** "Dennett eventually proposes a solution to this involving narrative gravity. I am not going to tell you what it is. Not because it's a secret, but because if I give you the solution, you will stop writing the problem. Your job is not to solve Dennett's puzzle; it is to dramatize the fact that it *cannot* be solved."

  **4. The Engineering of the Link**
  *   **The Refusal:** "If you ask me about bandwidth or signal lag, I will not answer. In this room, the connection is perfect. If you introduce lag, you are writing a story about technology. If you keep the connection perfect, you are writing a story about the self."

  ### Summary of the Flow

  1.  **Unity:** We assume we are in one place.
  2.  **Split:** Marta is in two places (perfect link, active body).
  3.  **Pressure:** Passport (Legal), Visit (Relational), Harm (Moral).
  4.  **Ambush Defense:** Intercept the Materialist, the Teleporter, and the Poet.
  5.  **Craft Pivot:** The Camera Problem (Form forces a choice reality doesn't).
  6.  **Exercise:** Jurisdictional Dispute (Argue the conflict, don't solve it).
  7.  **Refusal:** No Identity, No Qualia, No Narrative Gravity solutions.

  This structure respects their intelligence, utilizes your specific constraints, and ensures they leave with a tool (the generative tension) rather than a theory.
