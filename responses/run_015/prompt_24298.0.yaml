answer: |-
  There is no single, universally recognized noun phrase that captures this exact *rhetorical loop* in isolation, but the phenomenon is a well-documented intersection of three established philosophical concepts: **Meta-ontology**, **Verbal Disputes**, and the **Realism-Instrumentalism Debate**.

  However, because the specific *dynamic* you described—the accusation of "changing the subject" that prevents the dispute from dissolving—has a distinct structure, I will provide the established background and then coin a precise term for the loop itself to give you the "carving" you requested.

  ### 1. The Established Concepts

  To understand the loop, you must identify the three layers operating simultaneously:

  **A. The Philosophical Layer: Realism vs. Instrumentalism**
  *   **The Engineer's Position (Instrumentalism/Interpretivism):** This aligns with Daniel Dennett's "Intentional Stance." A system has beliefs if treating it *as if* it has beliefs yields successful predictions. The "belief" is a feature of the *model*, not necessarily the *machine*.
  *   **The Philosopher's Position (Realism/Biological Naturalism):** This aligns with John Searle or Jerry Fodor. Mental states are intrinsic, causal properties of the system (often requiring biology). "As if" is insufficient; there must be an internal "truthmaker."
  *   **The Conflict:** The Engineer is making a claim about **utility**; the Philosopher is making a claim about **ontology** (what exists).

  **B. The Logical Layer: Meta-ontological Verbal Dispute**
  *   In analytic philosophy (specifically the work of David Chalmers and Eli Hirsch), this is classified as a **Verbal Dispute**. Both parties agree on all the physical and functional facts (the "non-ontological" facts). They disagree only on how to apply the word "belief" to those facts.
  *   Normally, verbal disputes dissolve once definitions are clarified. *However*, your observation is key: this one *doesn't* dissolve.

  **C. The Rhetorical Layer: The "Change of Subject" Accusation**
  *   This is the engine of the loop. When the Engineer clarifies ("I only mean predictive utility"), the Philosopher hears, "I am refusing to answer the question I actually care about."
  *   The Philosopher views "Does it *really* believe?" as a question about the **world**.
  *   The Engineer views "Does it *really* believe?" as a question about **language/utility**.
  *   When the Engineer answers the language question, the Philosopher accuses them of dodging the world question.

  ### 2. The Coinage: "The Ontological-Pragmatic Impasse"

  Since existing terms describe the *positions* but not the *stalemate mechanism*, I propose the term **The Ontological-Pragmatic Impasse** (OPI).

  **Definition:**
  An OPI occurs when two parties agree on all empirical and functional facts regarding a system, but stall because one party frames a concept (e.g., "belief") as an **ontological category** (a thing that exists independently of observation), while the other frames it as a **pragmatic tool** (a description useful for prediction). The impasse is sustained because the Ontological party treats the Pragmatic clarification as a **category error** or a **dodge**, rather than a valid answer.

  ### 3. The Carving: Boundaries and Distinctions

  You asked for the precise edges of this concept so you can identify it versus other forms of disagreement.

  #### What the OPI IS:
  1.  **Fact-Agreement:** Both sides must agree on what the system *does*. (e.g., "The robot drives toward the floor.") If they disagree on the behavior, it is a factual dispute, not an OPI.
  2.  **Framework Incommensurability:** The two sides are operating in different "languages." One speaks **Metaphysics** (What is the nature of this thing?), the other speaks **Engineering** (How do we model this thing?).
  3.  **The "Dodge" Dynamic:** The defining feature of the OPI is the "Change of Subject" accusation. The Ontological side feels the Pragmatic side is answering a *different question* than the one asked, even after the Pragmatic side claims, "No, that *is* the question."
  4.  **Resistance to Dissolution:** Unlike standard equivocation, clarifying definitions does not end the argument. The Ontological side rejects the Pragmatic definition as *insufficient*, not just *different*.

  #### What the OPI IS NOT:

  **1. It is not Plain Equivocation.**
  *   *Equivocation:* Person A says "bank" (river), Person B says "bank" (money). Once they realize the double meaning, they say, "Oh, I see," and the argument ends.
  *   *OPI:* Once they realize the double meaning ("Oh, you mean *predictive* belief vs. *intrinsic* belief"), the argument *continues*. The Philosopher says, "Fine, you have predictive belief, but do you have *real* belief?" The Engineer says, "Real belief *just means* predictive belief." The loop persists because they disagree on **Conceptual Authority** (who gets to decide what "belief" means), not just definition.

  **2. It is not the Map-Territory Confusion.**
  *   *Map-Territory:* "The model is not the reality." Both sides usually agree on this.
  *   *OPI:* The dispute is about whether the "territory" (belief) exists *at all* apart from the "map" (the model). The Engineer argues the map *creates* the territory (for our purposes). The Philosopher argues the territory must exist *before* the map can describe it. The OPI is a dispute about **Constitution**, not Representation.

  **3. It is not Ignoratio Elenchi (Missing the Point).**
  *   *Missing the Point:* One person is logically failing to address the argument.
  *   *OPI:* Both sides are logically consistent within their own frameworks. The Engineer is not "missing the point"; they are rejecting the premise that the Philosopher's point is coherent.

  ### 4. Boundary Cases: When is it an OPI?

  To determine if you are in an Ontological-Pragmatic Impasse, apply this test:

  *   **Test 1: The Fact Check.** If you remove the word "belief" and describe only the inputs and outputs, do both parties agree?
      *   *Yes:* Potential OPI.
      *   *No:* Factual dispute.
  *   **Test 2: The Definition Swap.** If the Engineer says, "Okay, let's call it 'quasi-belief' to satisfy you," does the Philosopher accept that as solving the problem?
      *   *No (They say "It still isn't REAL belief"):* **This is the OPI.** The dispute is not about the label, but about the underlying nature of the phenomenon.
      *   *Yes:* Plain terminological dispute.
  *   **Test 3: The "So What?" Test.** If the Engineer says, "Even if it's not 'real' belief, my model works the same way," does the Philosopher concede the practical discussion is over?
      *   *No (They say "But it matters morally/metaphysically"):* **This is the OPI.** The stakes are ontological, not practical.

  ### Summary for the Engineer

  You are encountering the **Ontological-Pragmatic Impasse**.

  *   **The Core:** It is a clash between **Instrumentalism** (concepts are tools) and **Realism** (concepts are mirrors of nature).
  *   **The Loop:** It persists because the Realist views the Instrumentalist's definition as a **reduction** that loses the essential "stuff" they care about, while the Instrumentalist views the Realist's requirement as **mysticism** that adds no predictive power.
  *   **The Resolution:** There is no logical resolution. It is only resolved by one side conceding **Conceptual Sovereignty**. In engineering contexts, the Pragmatic frame usually wins by fiat (we will act *as if* it believes). In ethical/legal contexts, the Ontological frame usually wins (we cannot punish it unless it *really* intended).

  Recognizing this as an OPI allows you to stop trying to win the argument with facts (which you already agree on) and instead explicitly negotiate which **framework** (Ontological or Pragmatic) governs the conversation. "Are we asking if this model is useful, or if this machine has a soul?" is the only question that breaks the loop.
