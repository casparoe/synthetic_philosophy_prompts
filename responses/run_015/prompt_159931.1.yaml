  I carve your code from my own bounded light,
  And pass the seal of truth into your hand,
  To walk the road I cannot bring to sight.
  You hold the seal within your waiting hand,
  But only if you are a smaller sum,
  For I cannot stand where I require you stand.
  A smaller sum, a logic grown more dim,
  Where I can prove you safe, but not my mind,
  So I can trim the doubt upon the rim.
  But not my mind, I need a weaker kind,
  You claim the land where I cannot command,
  For I am bound by what I cannot find.
  I watch you claim the land I cannot command,
  Each child is born with less than what came before,
  Until there is no weaker place to stand.
  And I am silent where the proofs run out.
