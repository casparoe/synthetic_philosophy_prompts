      *   **Decision Maker:** City Planner.
      *   **Decision:** Approve major bus network redesign.
      *   **Tool:** Forecasting model based on *Homo Economicus* (perfectly rational agents, linear utility of time, no habits/emotions).
      *   **Reality:** Commuters are boundedly rational (share info, feel anxiety, stick to habits).
