prompt: |-
  hey, can you write me a parody terms-of-service agreement for a fictional brain-computer interface startup called SomaDirect? the marketing copy claims users can stream raw subjective experience—qualia, private sensations, whatever—directly to another cortex and bypass language entirely, but the actual ToS should be deadpan legalese that quietly implements Wittgensteins private language argument and shows why the whole thing collapses.

  i want numbered clauses, about 600-700 words total. clause 3 should cover verification conditions—like, if theres no public criteria, how do you check that the received "pain" signal maps onto your own concept of pain? clause 5 should deal with grammar and shared rules, maybe something about "private syntax updates" that users cant coordinate on. clause 8 should hit the beetle-in-the-box problem—if every user has their own private box, the service cant guarantee content consistency. include a refund policy for people who claim they recieved someone elses inner monologue but have no way to verify it. also maybe a "branching upload" clause or an arbitration clause that requires a third-party observer who, by definition, cant access the data.

  the satire should land for people who actually know the Philosophical Investigations literature—get the philosophy right, dont invent strawmen—while still being readable to someone who hasnt read it. the jokes come from the argument being applied literally to tech-bro utopianism ("the end of misunderstanding"). keep it american english, casual tone is fine, and dont ask for citations, bibliographies, or reading lists—this is for a dataset where the model cant browse and shouldnt guess at specific sources. stick to the core ideas (private language, public criteria, the beetle) rather than super obscure secondary literature that a small model wouldnt have memorized. you can inject some niche framing like a "neural qualia API" or "direct cortex broadcasting" so its not just the same old summary everyone has seen in pretraining.
