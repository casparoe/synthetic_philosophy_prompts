prompt: |-
  I sit on the heritage grants committee of a regional council, and I've read enough constructivist history of nationalism that "it was invented" no longer settles anything for me — on the standard account nearly everything gets invented at some point, so the live question is what age and uptake actually buy you. Our funding rule, drafted in 1974, says a tradition must have been performed continuously for at least a century by a self-identifying local community, and must not be a reconstruction or revival.

  Our hardest application this year is a midwinter lantern procession through the salt marshes: roughly three thousand participants, the largest civic event in a depressed coastal town, and the only thing that reliably fills its high street. Two things surfaced in review. First, a local historian has published a founding vicar's diary showing the procession was composed in 1897 out of fragments of unrelated older customs, explicitly to give a newly amalgamated parish a shared ceremony. It clears our century mark by twenty-seven years — but it was designed, and recently enough that the designing is documented. Second, the people who now make the lanterns and organize the route are mostly the town's Bangladeshi and Polish families, who joined about thirty years ago; several older families have stopped attending and say the procession is no longer theirs. The applicants also want the grant to cover changes: LED lanterns instead of oil, and a preamble spoken in Bengali and Polish alongside the English one.

  Please draft the committee's decision memo — fund, decline, or fund with conditions — with reasons the applicants could actually respond to, and with the strongest version of the losing side stated honestly rather than as a strawman. What I mainly need is a principle our rule doesn't supply: whether a tradition whose origin is conceded to be a deliberate invention forfeits its claim, or whether a century and a quarter of continuous practice by whoever is keeping it alive now generates a claim of its own; and whether the community whose tradition it is means the descendants or the current practitioners. I'd also like the memo to say what we should do, if anything, about the fact that the grant would be funding a change rather than a preservation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a heritage grants committee for a regional council.
      *   **Context:** The user is well-read in constructivist history of nationalism (Hobsbawm, Ranger, Anderson, etc.). They know "invented tradition" is a weak argument because *all* traditions are invented at some point. The real issue is *age* and *uptake*.
      *   **The Rule:** Drafted in 1974. Criteria:
          1.  Performed continuously for at least a century.
          2.  By a self-identifying local community.
          3.  Must *not* be a reconstruction or revival.
      *   **The Application:** Midwinter lantern procession in a depressed coastal town.
          *   Scale: 3,000 participants, largest civic event, economic lifeline for the high street.
          *   Origin: 1897 (127 years ago). Deliberately composed by a vicar from fragments to unify a new parish. Documented invention.
          *   Demographics: Original organizers/older families are leaving/feeling alienated. Current practitioners are mostly Bangladeshi and Polish families (arrived ~30 years ago).
          *   Proposed Changes: LED lanterns (safety/tech), Preamble in Bengali/Polish + English.
      *   **The Core Tension:**
          *   *Invention vs. Longevity:* Does deliberate invention disqualify it, or does 127 years of practice validate it?
          *   *Community Definition:* Is the "community" the descendants of the originators or the current practitioners keeping it alive?
          *   *Preservation vs. Evolution:* The grant would fund *change* (LEDs, languages), not strict preservation.
      *   **Task:** Draft the committee's decision memo (Fund, Decline, or Fund with Conditions).
      *   **Requirements:**
          *   Reasons applicants can respond to.
          *   State the strongest version of the losing side honestly (no strawmen).
          *   Address the missing principle in the rule (Invention vs. Uptake; Descendants vs. Practitioners; Preservation vs. Change).

  2.  **Determine the Decision:**
      *   *Option A: Decline.* Strict reading of "not a reconstruction or revival." The 1897 origin was a conscious construction. The original community is leaving. Funding changes (LEDs, languages) violates "preservation."
          *   *Pros:* Adheres strictly to the 1974 text. Protects "authenticity" as defined by origin.
          *   *Cons:* Kills the town's biggest event. Ignores the reality that *all* traditions evolve. Alienates the new community keeping it alive. Pedantic given the 127-year history.
      *   *Option B: Fund Unconditionally.* Acknowledge the 127-year history validates the invention. The community is whoever shows up. Change is good.
          *   *Pros:* Supports the town economically. Validates the new demographic.
          *   *Cons:* Ignores the "not a revival" clause (1897 is borderline). Ignores the alienation of the older families (social friction). Fundamentally changes the rule's intent regarding "preservation."
      *   *Option C: Fund with Conditions.* This is the most nuanced path. It acknowledges the validity of the tradition *now* while addressing the specific tensions in the rule. It allows the committee to set a precedent for how to interpret "invention" and "community."
          *   *Decision:* **Fund with Conditions.** This allows the committee to articulate the new principles the user is asking for.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear statement upfront (Approve with Conditions).
      *   **Background:** Summarize the application and the findings (1897 origin, demographic shift, proposed changes).
      *   **Analysis of Criteria (The Hard Part):**
          *   *The "Invented" Question:* Address the 1897 vicar. Acknowledge the constructivist view (all traditions are invented). Distinguish between *revival* (dead then brought back) and *institutionalization* (started then kept going). 127 years > 100 years. The "invention" clause in 1974 likely meant "fake antique," not "consciously created."
          *   *The "Community" Question:* Who owns the tradition? The bloodline or the practitioners? Argue for *practice* over *genealogy*. If the old families stop coming, they are relinquishing stewardship. The tradition belongs to those who do the work.
          *   *The "Change" Question:* LEDs and Languages. Heritage isn't taxidermy. If you don't adapt, you die. But the *form* must remain recognizable.
      *   **The Strongest Losing Argument:** I need to articulate why someone would vote *No*.
          *   Argument: The 1974 rule was specifically designed to stop councils funding "fake history." 1897 is too close to call "ancient." The alienation of the founding families suggests a break in continuity, not just evolution. Funding language changes fundamentally alters the *meaning* of the ritual from a specific local history to a generic multicultural celebration.
      *   **Conditions:**
          *   Documentation: Acknowledge the 1897 origin publicly (don't pretend it's medieval).
          *   Inclusion: Ensure the older families have a role (even if symbolic) to maintain the bridge between eras.
          *   Scope: LEDs okay for safety, but design must mimic original aesthetic. Languages okay, but the core narrative must remain tied to the *place*, not just the *people*.
      *   **Precedent/Principle:** This is what the user specifically asked for. We need to write the "missing principle" into the memo's reasoning so it guides future cases.
          *   Principle 1: Continuity of Practice > Continuity of Bloodline.
          *   Principle 2: Intentional Origin does not disqualify if Uptake is sustained (>100 years).
          *   Principle 3: Preservation requires Viability (which sometimes requires Change).

  4.  **Refining the Tone:**
      *   Needs to be bureaucratic but intellectually honest.
      *   Avoid jargon where possible, but use precise language for the legal/rule aspects.
      *   Show empathy for both the older families (loss) and the new families (ownership).
      *   Address the user's specific philosophical prompt about constructivism without turning the memo into an academic essay.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the 1974 rule's "not a reconstruction" clause?
      *   *Fix:* Yes, by distinguishing between "revival of a dead custom" vs. "sustained practice of a created custom."
      *   *Check:* Did I address the demographic shift?
      *   *Fix:* Yes, by defining community as "stewards of practice."
      *   *Check:* Is the losing argument strong?
      *   *Fix:* Make sure it emphasizes the *risk* of severing the link to the specific local history. If the preamble changes too much, is it still the *same* procession?
      *   *Check:* Did I answer the "funding change" question?
      *   *Fix:* Explicitly state that funding viability is a form of preservation.

  6.  **Final Polish:** Ensure the distinction between "Fund," "Decline," and "Fund with Conditions" is clear. (Going with Fund with Conditions as it offers the most rich ground for the philosophical principles requested). *Wait, looking at the prompt again:* "What I mainly need is a principle our rule doesn't supply." The memo needs to *establish* this principle for the council's record.

      *Decision:* I will draft the memo as a **Recommendation to Approve with Conditions**, but the reasoning section will explicitly codify the interpretive principles the user is looking for. This serves the dual purpose of deciding the grant and updating the committee's internal jurisprudence.

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Reasons applicants can respond to? Yes (conditions are actionable).
      *   Strongest losing side? Yes (included as a dissenting view or alternative consideration).
      *   Address the "invention" vs "uptake" principle? Yes.
      *   Address "descendants" vs "practitioners"? Yes.
      *   Address "preservation" vs "change"? Yes.

      *(Self-Correction on "Strongest Losing Side"):* In a committee memo, this is often framed as "Alternative Considerations" or "Minority View." I will frame it as "Counter-Arguments Considered" to ensure it stands on its own merit without needing a fictional dissenting member.

      *(Refining the "Invention" argument):* The prompt notes the rule says "must not be a reconstruction or revival." The 1897 event was a *composition*. I need to argue that a composition sustained for 127 years is no longer a "revival" but an *established tradition*. The rule targets *fake* antiquity, not *documented* origin.

      *(Refining the "Community" argument):* The rule says "self-identifying local community." The older families no longer self-identify with it. The new ones do. The rule favors the latter.

      *(Refining the "Change" argument):* The rule implies preservation. But preservation of a *living* thing requires adaptation.

