prompt: |-
  I was arguing with my roommate about Breaking Bad and we got totally stuck on that awful scene where Walter finds Jane choking on vomit and just... stands there. Like, he literally puts his hand on her shoulder then pulls away. I know philosophers make a big deal about doing vs allowing - killing is active, letting die is passive - but in this case Walter's already deep in the causal chain that got her there. He's the one who pushed Jesse into her life, he knows she's using, he could roll her over with one move. So is his inaction really just letting nature take its course, or is it closer to finishing a job he started?

  Can you read that scene - and maybe Walter's whole messed up relationship with Jesse - through the lens of doing vs allowing? I'm especially curious about whether the show actually respects the philosophical distinction, or if it treats his omission as basically identical to smothering her because he's physically right there and already complicit. There's also this idea I ran into about moral proximity - that being physically present and able to act creates a different kind of duty than being far away. Does the scene dramatize that, or does it show that proximity doesn't matter when you've already made yourself part of the machinery?

  Don't worry about giving me sources or a bibliography, I just want your honest take. If you think the work ultimately sides with one view - like, that omission can be just as murderous as action when you're already entangled - say so. But also tell me where the honest critic has to admit the scene is messier than the theory, and what Breaking Bad adds about omission that a pure philosophy paper wouldn't capture. I'm writing a short essay for my ethics class and I keep going back and forth.
