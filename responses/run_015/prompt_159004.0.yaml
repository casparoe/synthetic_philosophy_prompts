prompt: |-
  I've got an hour next week with a mixed seminar — first-year philosophers plus second-year computer scientists — and I need to get one thing across: that 'this system implements computation C' isn't a fact about the system on its own but something we attribute to it, so 'which computations matter morally?' can't be answered by just pointing at the computation. Don't write the session for me; tell me how to run it.

  What I'd like them to leave holding is a distinction I've been messing about with and can't quite get straight myself: attribution-robustness versus attribution-by-convenience. Roughly, an attribution of a computation to a system is morally load-bearing only if it survives (a) coarsening the description — it isn't an artefact of how finely I chose to carve things up — and (b) perturbing the system's states and inputs, i.e. it tracks counterfactuals the system really supports rather than just the run I happened to watch. An attribution that's merely convenient for me, or that matches what the programmer intended, isn't. That's the bit I want them to feel the force of.

  So: what order do the bits have to come in, given that? My carrying example is a little evolved virtual creature in a simulation, twelve-node nervous system, steers reliably away from a noxious patch, and its failure mode looks a bit like relief when it escapes — crucially it has no programmer's spec to appeal to and nothing like a body we already have intuitions about. Tell me what else that example has to have, and what it has to avoid, if it's going to carry the whole hour.

  Misconceptions I'm expecting: that the physics or the runtime settles it and descriptions are just bookkeeping; that once they see several computations fit one run they'll conclude computation is irrelevant tout court; that the computation which matters is the one someone intended the system to be running; and the slide from avoidance behaviour to so it hurts. Where in the sequence does each have to be headed off, and which one will actually be hardest to shift?

  Give me one question for the end that shows me they've got the distinction rather than just got unsettled — I was thinking of handing them teh second system and asking what would have to be true of it to change their answer, but say if that's the right test. And what should I openly refuse to get into at this level, and say out loud that I'm refusing it?
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed seminar (1st-year Philosophers + 2nd-year Computer Scientists). This means varying levels of technical and conceptual background. Philosophers might be better at conceptual distinctions; CS students might be better at implementation details but perhaps more prone to computational realism.
      *   **Goal:** Convey that "System $S$ implements Computation $C$" is an attribution, not an intrinsic fact. Therefore, "Which computations matter morally?" cannot be answered by just pointing at the computation.
      *   **Core Distinction to Teach:** Attribution-Robustness vs. Attribution-by-Convenience.
          *   *Robustness:* Survives coarsening of description + tracks counterfactuals (state/input perturbations).
          *   *Convenience:* Matches observer's interest, programmer's intent, or specific run artifacts.
      *   **Key Example:** Evolved virtual creature (12-node nervous system), avoids noxious patch, failure mode looks like relief. No programmer spec, no familiar body.
      *   **Constraints:** Do *not* write the session script. Tell them *how* to run it (structure, flow, pitfalls).
      *   **Specific Questions to Answer:**
          *   Order of bits?
          *   What does the example need/avoid?
          *   Where to head off specific misconceptions?
          *   Which misconception is hardest to shift?
          *   Final assessment question (is the user's idea good?).
          *   What to explicitly refuse to discuss?

  2.  **Deconstruct the Core Distinction (Robustness vs. Convenience):**
      *   This is essentially a refined version of the "Triviality Argument" (Putnam/Searle) but applied to ethics.
      *   *Robustness:* The system *would have* done $C'$ if input was $I'$. The mapping holds across a space of possibilities.
      *   *Convenience:* I can map the states *now* to $C$, but if I wiggle a bit, the mapping breaks or becomes gerrymandered.
      *   *Moral Load:* Only robust attributions support moral weight.

  3.  **Structure the Hour (Order of Bits):**
      *   *Phase 1: The Hook (The Intuition of Intrinsicness).* Start with the CS intuition: "The code *is* the computation."
      *   *Phase 2: The Triviality Challenge.* Show that *any* physical system can be mapped to *any* computation under a sufficiently gerrymandered description (Putnam-style). This creates the problem.
      *   *Phase 3: The Solution (Robustness).* Introduce counterfactuals and coarsening. This is the core distinction.
      *   *Phase 4: The Application (The Creature).* Apply the distinction to the evolved creature.
      *   *Phase 5: The Moral Pivot.* Why does this matter for ethics? (You can't ground moral status on a fragile attribution).
      *   *Phase 6: Assessment.* The final question.

      *Refinement:* The user wants the distinction to be the *climax*. So, don't give it away too early. Let them struggle with the "is it computing?" question first.

  4.  **Refining the Example (The Evolved Creature):**
      *   *Needs:*
          *   **Opacity:** No source code access (black box). Forces reliance on behavior/state observation.
          *   **Contingency:** The "relief" behavior must be demonstrably fragile or robust depending on how you look at it.
          *   **State Visibility:** Students need to see the node activations to try mapping computations.
          *   **Counterfactuals:** You need to be able to say "If input was X, node Y would flip."
      *   *Avoids:*
          *   **Anthropomorphism:** Don't call it "pain." Call it "noxious stimulus avoidance."
          *   **Intentionality:** Emphasize *no* programmer intent (evolved/random mutation).
          *   **Hardware specifics:** Don't get bogged down in GPU vs. CPU. It's a logical network.

  5.  **Addressing Misconceptions:**
      *   *Physics/Runtime settles it:* Head off early (Phase 2). Show multiple mappings to the same physics.
      *   *Computation is irrelevant:* Head off in Phase 3. It's not irrelevant, it's just relational.
      *   *Programmer Intent:* Head off during the Example setup (emphasize evolved/no spec).
      *   *Avoidance = Hurt:* Head off at the very end. Distinguish *computational structure* from *phenomenology*.
      *   *Hardest to Shift:* "Physics settles it." CS students especially cling to the idea that the transistor state *is* the bit. This requires the strongest counter-example (gerrymandered mapping).

  6.  **The Final Question:**
      *   User's idea: "Hand them a second system and ask what would have to be true of it to change their answer."
      *   Critique: Good, but needs to be specific to *robustness*.
      *   Better: Present a system that *looks* the same behaviorally but fails the counterfactual test (a "philosophical zombie" of computation). Ask: "Does this one count?"

  7.  **What to Refuse:**
      *   Don't solve the Hard Problem of Consciousness.
      *   Don't define "Moral Matter" fully (just show the prerequisite).
      *   Don't get into specific theories of computation (CTM vs. others) beyond the implementation relation.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Direct, pedagogical, respectful of the user's expertise (they know the philosophy, they need the delivery).
      *   *Structure:* Follow the user's prompts (Order, Example, Misconceptions, Final Question, Refusals).

      *(Self-Correction during drafting)*: Wait, the user said "Don't write the session for me." I need to be careful not to script it. I should advise on *strategy* and *flow*, not minute-by-minute plans.
      *   *Focus:* How to facilitate the *realization* of the distinction.
      *   *The "Carrying Example":* I need to be specific about what data to show them. Just saying "virtual creature" isn't enough. They need to see the state table.

      *(Refining the Misconception Order)*:
      1.  Physics settles it (Attack first).
      2.  Intent settles it (Attack during example setup).
      3.  Computation irrelevant (Attack during Robustness definition).
      4.  Avoidance = Hurt (Attack last, as a boundary condition).

      *(Refining the Final Question)*: The user's idea is "Second system... what would have to be true." I should validate this but sharpen it. It needs to test the *counterfactual* condition specifically.

      *(Refining the Refusals)*: Crucial to keep the hour on track. The "Hard Problem" is the biggest time-sink. Also "What actually matters morally" (we are only establishing the necessary condition, not the sufficient one).

  9.  **Final Polish:** Check against the "Attribution-Robustness vs. Attribution-by-Convenience" distinction. Ensure the advice helps them *feel* the force of it, not just understand it intellectually. Use the "gerrymandering" metaphor for convenience.

      *Key Insight:* The CS students will fight for "implementation is real." The Philosophers will fight for "meaning is external." The seminar needs to make the CS students admit mapping is arbitrary, and the Philosophers admit constraints exist (robustness).

      *Let's build the response.*
      *   **Order:** Problem -> Triviality -> Constraint (Robustness) -> Application -> Ethics.
      *   **Example:** Needs state tables + counterfactual scenarios.
      *   **Misconceptions:** Map them to the phases.
      *   **Final Question:** Validate and sharpen.
      *   **Refusals:** Hard problem + Sufficient conditions for morality.

      *(Wait, one more check)*: The user wants to know *what order the bits have to come in*.
      1.  Establish the intuition that computation is intrinsic.
      2.  Break it (Triviality).
      3.  Rebuild it with constraints (Robustness).
      4.  Apply to the Creature.
      5.  Connect to Morality.
      This seems solid.

      *What does the example need?* It needs to be *just* complex enough to allow gerrymandering but *simple* enough to trace. 12 nodes is good. It needs to show a "run" and then "perturbed runs."

      *Hardest Misconception:* "Physics settles it." CS students view voltage levels as intrinsic bits. This is the bedrock to crack.

      *Final Question:* The user's idea is good. I will endorse it but specify that the "change" must be about counterfactual stability, not just behavior.

      *Refusals:* Consciousness (qualia) and the full theory of moral status.

      *Okay, ready to write.*
answer: |-
  Here is the strategic architecture for the hour. Your goal is to move them from **Computational Realism** (the computation is *in* the box) to **Computational Pragmatism** (the computation is a map we lay over the box), and finally to **Robustness** (some maps stick, some slide off).

  ### 1. The Order of Operations
  Do not start with the distinction. Start with the intuition you want to break.

  1.  **The Hook (10 mins):** Present the creature. Ask the CS students: "What computation is this running?" Ask the Philosophers: "Is there a fact of the matter?" Expect consensus that there *is* a fact.
  2.  **The Break (15 mins):** Demonstrate the **Triviality Argument**. Show that the same state transitions can be mapped to *different* logical functions depending on how you label the states (e.g., labeling voltage >0.5V as '1' vs labeling voltage >0.7V as '1'). Prove that physics underdetermines computation.
  3.  **The Reconstruction (15 mins):** Introduce **Attribution-Robustness**. If *any* mapping works, computation is trivial. So, what constrains the mapping? Counterfactuals. If I tweak the input, does the mapping hold? If I coarsen the state description, does the function survive?
  4.  **The Application (15 mins):** Return to the creature. Apply the robustness test. Is the "relief" computation robust, or is it an artifact of the specific run we watched?
  5.  **The Moral Pivot (5 mins):** Connect robustness to moral weight. If the computation is an artifact of *your* description, your moral judgment is about *you*, not the system.
  6.  **Assessment (5 mins):** The final question.

  ### 2. The Carrying Example: Requirements & Constraints
  The evolved creature is excellent, but to carry the distinction, it needs specific data visibility.

  **What it must have:**
  *   **Visible State Vector:** You need to show them the 12-node activation values at time $t, t+1, t+2$. Not a visualization of the creature, but the raw numbers.
  *   **Counterfactual Logs:** You need a "What If" mode. Show them Run A (Success), then show them Run B (Input perturbed slightly).
      *   *Scenario 1 (Robust):* Input changes, node activations shift, but the logical function (e.g., "IF noxious THEN turn") remains identifiable across the mapping.
      *   *Scenario 2 (Fragile):* Input changes slightly, and the mapping you used to identify "relief" completely dissolves into noise.
  *   **No Semantic Labels:** The nodes must be Node 1–12, not "Pain Sensor" or "Motor Output." You must force them to assign the semantics.

  **What it must avoid:**
  *   **Anthropomorphic Visuals:** Do not show a creature that looks like an animal. Use a dot, a triangle, or a geometric shape. If it looks like a worm, they will import biological intuitions about pain.
  *   **Fitness Functions:** Do not reveal the evolutionary pressure. If they know it was *selected* to avoid pain, they will assume the computation is intrinsic to the selection.
  *   **Source Code:** Do not show the update rules. If they see the code, the CS students will claim the code *is* the computation. Keep it black-box behavioral/state analysis.

  ### 3. Heading Off Misconceptions
  Here is where each misconception arises and how to kill it.

  **1. "The physics/runtime settles it."**
  *   **When:** Phase 2 (The Break).
  *   **How:** Use a truth-table swap. Show that if you map 'High Voltage' to 'True', it's an AND gate. If you map 'High Voltage' to 'False', it's an OR gate. The physics didn't change; the attribution did.
  *   **Difficulty:** **Hardest to shift.** The CS students will dig in here. They view the transistor as ontologically committed to the bit. You must make them admit that the *interpretation* of the voltage is external to the voltage.

  **2. "Computation is irrelevant tout court."**
  *   **When:** Phase 3 (The Reconstruction).
  *   **When they realize mapping is arbitrary, they may swing to nihilism.**
  *   **How:** Emphasize that *constraints* exist. Not all mappings survive perturbation. Computation isn't real *intrinsicly*, but it is real *relationally*. It matters if the system supports the counterfactuals.

  **3. "The computation that matters is the one intended."**
  *   **When:** Phase 1 (The Hook) and Phase 4 (Application).
  *   **How:** Hammer the "Evolved/No Spec" constraint. "There was no programmer. There is only the system and the environment. If you need an intender to find the computation, there is no computation here."

  **4. "Avoidance behaviour = It hurts."**
  *   **When:** Phase 5 (Moral Pivot).
  *   **How:** Explicitly decouple *functional structure* from *phenomenology*. "We are establishing whether there is a *structure* that could bear moral weight. We are not establishing that this structure *feels*. Do not slide from 'computes avoidance' to 'suffers'."

  ### 4. The Final Question
  Your idea is close, but it risks being too vague ("what would have to be true"). To test **Robustness vs. Convenience**, you need to test their commitment to **Counterfactuals**.

  **The Test:**
  Present **System B**.
  *   System B behaves exactly like the Creature in the actual run (same inputs, same outputs, same node activations).
  *   However, reveal that System B is a **Lookup Table**. It has no internal dynamics. If you perturb the input even slightly (a value it hasn't seen before), it outputs garbage/random noise. The Creature, by contrast, degrades gracefully or follows its logic.

  **Ask:** "System A (Creature) and System B (Lookup Table) are identical in the actual run. You attributed 'avoidance computation' to A. Do you attribute it to B? If not, **what fact about A made the attribution stick?**"

  *   **Pass:** They answer that A supports the counterfactuals (robustness), while B only matches the actuality (convenience).
  *   **Fail:** They say A is "more real" or "has the right code" without referencing counterfactual stability.

  ### 5. What to Refuse (Out Loud)
  You must explicitly bracket two topics to keep the hour from exploding. Say this at the start:

  1.  **The Hard Problem:** "I am not asking if the creature is conscious. I am asking if the *computation* we attribute to it is a stable fact. Consciousness might require computation, but we aren't solving consciousness today."
  2.  **Sufficient Conditions for Moral Status:** "I am not claiming that if a computation is robust, it *deserves* rights. I am claiming that if the computation is *not* robust (i.e., it's just attribution-by-convenience), it *cannot* ground rights. We are looking for a necessary condition, not a sufficient one."

  ### Summary of the Flow
  1.  **Intuition:** "The computation is in there."
  2.  **Crisis:** "Actually, the physics allows infinite computations."
  3.  **Resolution:** "But only *robust* computations survive perturbation."
  4.  **Stakes:** "Moral status can't rest on a fragile map."
  5.  **Test:** "Does the Lookup Table pass the test?"

  If the CS students concede that the voltage doesn't dictate the bit, and the Philosophers concede that not all interpretations are equal (robustness constraints), you have succeeded.
