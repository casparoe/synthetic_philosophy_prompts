prompt: |-
  I'm in a graduate seminar on rational choice and decision theory, and this week we covered Good's theorem: the result that for an expected-utility maximizer who updates by conditionalization, the expected value of costless information is never negative, because any act available before the signal arrives is still available afterwards, and one can simply resolve to act as one would have acted without it. Two people in the seminar stayed behind and got into an argument about whether that result is substantive or close to empty. I've tried to reconstruct the exchange faithfully below. I have no stake in who wins, and I'd rather you work the argument out than send me to readings, since I can't chase references this week.

  1. Marcus: The proof is one line — for each possible signal, take the act that maximizes conditional expected utility, and observe that the unconditional optimum is still in the menu in every cell, so the expected value with the signal is at least the value without it. But the second half of that is just the remark that you are free to walk away from something free. Nothing about inquiry, evidence, or science follows. The floor is zero by construction and the theorem never says the value is positive. Worse, it looks unfalsifiable: any claimed counterexample gets met with the reply that you've quietly violated a background assumption.

  2. Lena: Two things. First, the floor is exactly what makes the economics of experimentation work: since gross value is nonnegative, the only question about any experiment is whether its cost exceeds its gross expected value, and the theorem decomposes where the value comes from — strictly positive just in case there is positive probability of a signal that would change what you do. That's a mechanism, not a floor. Second, it is falsifiable: it fails for agents who update non-Bayesianly (someone who will treat a weak signal as conclusive does worse by looking), and for agents whose utility depends on what they know. So it's a coherence constraint on a package — expected utility, conditioning, costlessness, and purity of the signal — not a tautology.

  3. Marcus: The still-in-the-menu premise is much stronger than it looks, and routinely false. Case one, mandated disclosure: I'm offered a free genetic test for a condition that affects what I'd pay for the insurance I was about to buy, and I'm legally required to disclose the result if I take it. The act I had planned — buy at the pooled rate — no longer exists after I learn. Case two, knowing is itself an outcome: for an untreatable condition, having it and knowing you have it differs in utility from having it and not knowing, and you cannot select the latter once you've been tested. In both, the signal isn't merely informative: conditional on the state, whether you receive it depends on what you do, or receiving it changes the outcome space. So the theorem is restricted to signals that are pure, and the interesting real cases of should I find out generally aren't.

  4. Lena: Granted — but the right conclusion is about modelling, not refutation. Enlarge the state space so that testing carries disclosure as a consequence and so that knowing is part of the outcome, and the inequality is restored over the enlarged space. Notice what that costs me, though. Over an enlarged space the theorem holds for any joint distribution you like, which turns it into a claim about your model rather than about the world. Once anything awkward can be relocated into the state space, no case can test it. So the vacuity worry comes back in a sharper form: the result is either substantive and scope-limited, or fully general and untestable. I'd take the scope-limited version.

  5. Marcus: Here is a case that is neither a mis-modelling nor a failure of consequentialism, and in which acting as you would have is perfectly available: a calibration oracle. It tells you nothing about which hypothesis is true. It tells you that your credence function is miscalibrated — that your ninety-percent intervals contain the truth sixty percent of the time, that you should shrink every log-odds by a fixed factor. There is no proposition here to conditionalize on, and no way to act as you would have acted, since what is being revised is the probability function you use in drawing up every plan. If Good's result cannot even be stated for this signal, it isn't a general result about the value of information; it is a result about the value of partitions of a possibility space you already possess.

  6. Lena: It can be stated: introduce a variable ranging over which recalibration of your credences is the correct one, put a prior over its values, and treat the oracle's report as a likelihood over them. The theorem applies again and the value is nonnegative. But the absorption exposes the real presupposition: the theorem needs a prior over everything the signal might bear on. And its silence is precisely where the action is — a signal that reveals that a possibility you had not represented at all is real, so that you expand your hypothesis space rather than reweight within it. Good's theorem says nothing about that, and that is the case the philosophy of science actually cares about.

  7. Marcus: Then we agree more than it looked. The theorem is diagnostic, not justificatory. If free information looks worthless or harmful to you, it tells you where to look: cost, impurity of the signal, preferences that aren't consequentialist, updating that isn't Bayesian, or a prior over an impoverished space. It keeps the books. It doesn't tell you to open them.

  8. Lena: Agreed, with one asymmetry worth keeping. The diagnostic only ever tells you that one of the assumptions failed; it never licenses the conclusion that information itself is bad. That residual content is small but it isn't nothing.

  Please adjudicate this move by move: rate each of the eight moves from clearly mistaken to clearly right, with a sentence or two of justification, and say who is right about what overall. I specifically want your verdict on three things. First, whether the impurity cases in move 3 are genuine counterexamples to Good's theorem or changes of subject, and whether Lena's reply in move 4 concedes more than she admits. Second, whether the calibration-oracle case in move 5 can really be absorbed by enlarging the prior as Lena proposes in move 6, and what that enlargement costs. Third, whether there is any reading of the theorem on which it is genuinely substantive rather than either trivial or heavily conditioned — and if there isn't, what its status is. Finally, tell me what both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on rational choice/decision theory.
      *   **Topic:** Good's Theorem (Value of Information).
      *   **Task:** Adjudicate an 8-move dialogue between Marcus and Lena.
      *   **Requirements:**
          *   Rate each move (Clearly Mistaken to Clearly Right) with justification.
          *   Determine who is right overall.
          *   Address three specific verdict questions:
              1.  Impurity cases (Move 3) vs. Lena's reply (Move 4): Counterexamples or changes of subject? Does Lena concede too much?
              2.  Calibration oracle (Move 5) vs. Lena's absorption (Move 6): Can it be absorbed? What's the cost?
              3.  Substantiveness: Is the theorem substantive, trivial, or conditioned? What is its status?
          *   Identify what *both* are missing.

  2.  **Deconstruct Good's Theorem (Background Knowledge):**
      *   *Statement:* For a Bayesian expected utility maximizer, the expected utility of obtaining costless information (before observing it) is at least as high as the expected utility of acting without it.
      *   *Key Assumptions:*
          *   Expected Utility Maximization.
          *   Bayesian Conditionalization (updating).
          *   Costless information.
          *   Information doesn't change the state of the world or the available acts (act-state independence, no "news value" of information itself).
          *   Fixed state space (no new hypotheses).
      *   *Intuition:* You can always ignore the info and do what you would have done. If the info changes your mind, it's because the new act is better *given* the info. So, ex-ante, you expect to do at least as well.

  3.  **Evaluate the Dialogue Move by Move:**

      *   **Move 1 (Marcus):** Claims the proof is trivial ("one line"), the floor is zero by construction, and it's unfalsifiable/empty.
          *   *Assessment:* Mostly right on the mechanics, but "empty" is too strong. It *is* a dominance argument. The unfalsifiability claim is a common critique of rationality constraints.
          *   *Rating:* Largely Right (on mechanics), slightly overstated on emptiness.

      *   **Move 2 (Lena):** Claims the floor enables economics of experimentation. It *is* falsifiable (fails for non-Bayes or state-dependent utility). It's a coherence constraint.
          *   *Assessment:* Right. The theorem *does* identify specific conditions where it fails (non-Bayes, etc.). It's not a tautology in the logical sense; it's a theorem within a specific axiomatic system.
          *   *Rating:* Clearly Right.

      *   **Move 3 (Marcus):** Raises "Impurity" cases: Mandated disclosure (act space changes) and Utility of Knowing (outcome space changes). Claims these violate the "still-in-the-menu" premise.
          *   *Assessment:* These are standard counterexamples to the *application* of the theorem, not the theorem itself. They violate the assumption that information is costless and doesn't change the world. Marcus is right that the theorem doesn't apply here, but wrong to call them counterexamples to the *theorem* (which assumes these away).
          *   *Rating:* Mixed. Right about the phenomena, wrong about them refuting the theorem (they refute the *applicability*).

      *   **Move 4 (Lena):** Says we can model these by enlarging the state space. Admits this makes it a claim about the model, not the world. Concedes scope-limited version.
          *   *Assessment:* Standard Savage-style move. Yes, you can model "knowing" as part of the consequence. But Marcus is right that this risks vacuity (if *any* anomaly can be modeled away, does the model constrain anything?). Lena admits the "model vs. world" tension.
          *   *Rating:* Right on modeling technique, honest on the vacuity risk.

      *   **Move 5 (Marcus):** Calibration Oracle. Info about the *probability function* itself, not the state. No proposition to conditionalize on.
          *   *Assessment:* This is a strong point. Good's theorem assumes a fixed partition and prior. Learning about the reliability of the prior itself (second-order uncertainty) isn't standard conditionalization on the base state space.
          *   *Rating:* Clearly Right (this is a known limitation).

      *   **Move 6 (Lena):** Says absorb into prior (hyperparameter). Admits silence on "expanding hypothesis space" (new possibilities).
          *   *Assessment:* She's right you *can* model calibration uncertainty with hyperparameters (e.g., Dirichlet processes, or just a parameter for bias). But she concedes the "unrepresented possibility" point (Kuhn/structural uncertainty).
          *   *Rating:* Right on modeling, Right on the concession.

      *   **Move 7 (Marcus):** Concludes it's diagnostic, not justificatory. Tells you where assumptions broke.
          *   *Assessment:* Good synthesis. It's a coherence check.
          *   *Rating:* Clearly Right.

      *   **Move 8 (Lena):** Agrees, adds asymmetry: never licenses "info is bad," only that assumptions failed.
          *   *Assessment:* Accurate summary of the normative force.
          *   *Rating:* Clearly Right.

  4.  **Address Specific Verdict Questions:**

      *   **Q1: Impurity Cases (Move 3) & Lena's Reply (Move 4).**
          *   Are they counterexamples? No, they are violations of premises (specifically, that information is costless and doesn't affect the state/outcome). Good's theorem explicitly assumes the act set and state consequences are independent of the observation.
          *   Does Lena concede too much? She admits that enlarging the state space makes it a claim about the model. This is the "Savage Dilemma." It's a fair concession. The theorem holds *if* the model is adequate.
          *   *Verdict:* Marcus is right that these limit *application*, Lena is right that *theoretically* they can be absorbed, but the cost is model-relativity.

      *   **Q2: Calibration Oracle (Move 5) & Absorption (Move 6).**
          *   Can it be absorbed? Technically, yes, by treating the "true calibration" as a state variable.
          *   What's the cost? It requires a prior over the prior (hyperprior). It assumes the agent *already* represents the possibility of miscalibration. If the agent is dogmatic (prior = 1 on their own correctness), they can't update. So it requires the agent to already have the uncertainty represented.
          *   *Verdict:* Lena is technically right on absorption, but Marcus is right that it requires a richer prior structure than the standard theorem assumes.

      *   **Q3: Substantiveness.**
          *   Is it substantive? It is a *mathematical* truth within a framework. It is not an empirical law. Its substantiveness lies in being a coherence constraint (like Dutch Book arguments). It tells you what you *must* value if you accept the axioms.
          *   *Verdict:* It is substantive as a normative constraint on Bayesian agents, not as an empirical prediction.

      *   **Q4: What are they missing?**
          *   They focus on the *value* of information. They miss the *cost of computation*. Good's theorem assumes logical omniscience (you can instantly calculate the optimal act for every signal). In bounded rationality, info has processing costs.
          *   They also miss the *instrumental* vs. *intrinsic* distinction slightly, though Lena touches on it.
          *   Big miss: **Logical Omniscience/Computational Cost.** Good's theorem assumes you can instantly compute $E[U|signal]$ for all signals. Real agents can't. This makes info potentially negative value (analysis paralysis).

  5.  **Drafting the Response:**
      *   *Tone:* Academic, precise, adjudicating.
      *   *Structure:*
          1.  Move-by-move rating.
          2.  Overall verdict (Who is right?).
          3.  Specific answers to the three questions.
          4.  The "Missing" element.

      *   *Refining the Ratings:*
          *   M1: Right on proof, wrong on "empty." (Mostly Right)
          *   M2: Right. (Clearly Right)
          *   M3: Right on phenomena, wrong on "counterexample" status. (Mixed/Mostly Right on intuition)
          *   M4: Right on modeling, insightful on vacuity. (Clearly Right)
          *   M5: Strong point on second-order uncertainty. (Clearly Right)
          *   M6: Right on technical fix, honest on limitation. (Clearly Right)
          *   M7: Good synthesis. (Clearly Right)
          *   M8: Good nuance. (Clearly Right)
          *   *Correction:* Marcus in M1 calls it "unfalsifiable." Lena corrects him in M2. So M1 is partially mistaken. M3 calls them counterexamples; they are boundary conditions. So M3 is partially mistaken.

      *   *Refining the "Missing" point:*
          *   Computational complexity is the big one. Good's theorem assumes the agent can *find* the optimal act after the signal. If searching for the act is costly, info can be negative value.
          *   Also, the "Value of Information" vs. "Value of Questioning."
          *   Let's stick to **Computational/Bounded Rationality**. It's the most standard critique in decision theory seminars.

  6.  **Final Review against constraints:**
      *   Rate each move? Yes.
      *   Justification for each? Yes.
      *   Verdict on 3 specific questions? Yes.
      *   What are they missing? Yes.
      *   No references? Yes.

      *(Self-Correction during drafting)*: Make sure to distinguish between "counterexample to the theorem" (mathematical error) and "counterexample to the applicability" (premises not met). Marcus blurs this in Move 3. Lena clarifies in Move 4. I need to be clear on this distinction.

      *(Self-Correction on Calibration)*: Lena's Move 6 says "introduce a variable... put a prior over its values." This is essentially what hierarchical Bayesian models do. Marcus's point is that if you *don't* have that variable (you are dogmatic), the theorem doesn't apply. Lena admits this in the "silence... where the action is" part regarding expanding hypothesis spaces. I need to highlight that the theorem presupposes the uncertainty is already representable.

      *(Final Polish)*: Ensure the tone is neutral and analytical.

  7.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is the adjudication of the dialogue, move by move, followed by the specific verdicts you requested.

  ### Move-by-Move Adjudication

  **1. Marcus (The "Empty Proof" Claim)**
  *   **Rating:** **Mostly Right, but Overstated.**
  *   **Justification:** Marcus correctly identifies the dominance structure of the proof (you can always ignore the signal). However, he is mistaken to call it "unfalsifiable" or "empty"; within the axioms of Bayesian decision theory, it is a rigorous constraint that rules out specific preference orderings (e.g., paying to avoid free information). It is a coherence constraint, not a tautology.

  **2. Lena (The "Coherence Constraint" Reply)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Lena correctly identifies that the theorem is conditional on specific assumptions (Bayesian updating, state-independent utility). It is falsifiable in the sense that if an agent violates it, they must be violating one of those assumptions. She correctly frames it as a decomposition of value (cost vs. gross value).

  **3. Marcus (The "Impurity" Counterexamples)**
  *   **Rating:** **Mixed (Right on Phenomena, Wrong on Logic).**
  *   **Justification:** Marcus identifies real-world scenarios (disclosure laws, utility of knowing) where information has negative value. However, these are not counterexamples to Good's *theorem*; they are violations of the theorem's *premises* (specifically, that information is costless and does not alter the state or act space). He conflates applicability with validity.

  **4. Lena (The "Model Relativity" Concession)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Lena correctly notes that standard decision theory handles these cases by enlarging the state space (e.g., "knowing I have the disease" is a distinct outcome from "having the disease"). Her concession is crucial: this makes the theorem a claim about the adequacy of the model rather than an empirical law of the world, inviting the vacuity worry Marcus raised.

  **5. Marcus (The "Calibration Oracle" Case)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is a sophisticated objection. Standard conditionalization updates probabilities over a fixed state space; it does not typically allow updating the probability function itself (second-order uncertainty). If the agent cannot represent the possibility of miscalibration in their prior, the theorem cannot be applied.

  **6. Lena (The "Hyperprior" Absorption)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Lena is technically correct that hierarchical Bayesian modeling can absorb calibration uncertainty by treating the "true parameter" as a state variable. However, she honestly concedes the limitation: the theorem is silent on "unrepresented possibilities" (structural uncertainty), which is indeed where much of the philosophy of science interest lies.

  **7. Marcus (The "Diagnostic" Synthesis)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the correct meta-theoretical status of the result. It functions like a Dutch Book argument: it doesn't tell you the world is a certain way, but it tells you your bookkeeping is inconsistent if you violate it.

  **8. Lena (The "Asymmetry" Addendum)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** She correctly notes the normative direction of the theorem. It forbids paying to avoid free information (under the assumptions), but it does not guarantee information is always good. It preserves a small but critical normative bite.

  ***

  ### Overall Verdict
  **Lena wins on the theory; Marcus wins on the application.**
  Lena correctly defends the internal consistency and logical status of Good's theorem. Marcus correctly identifies that its practical force is limited by the fragility of its assumptions (pure signals, fixed state spaces, logical omniscience). The dialogue converges correctly on the view that the theorem is a **coherence constraint** rather than an empirical prediction.

  ***

  ### Specific Verdicts

  **1. Impurity Cases (Move 3) and Lena's Reply (Move 4)**
  These are **not genuine counterexamples** to Good's theorem; they are boundary conditions where the premises fail. Good's theorem explicitly assumes the act set is fixed and information does not causally influence the state (causal decision theory nuances aside). Marcus is right that these cases make the theorem hard to apply to "real" inquiries, but wrong to suggest they refute the math.
  **Lena does not concede more than she admits.** She correctly identifies the "Savage Dilemma": you can save the theorem by enlarging the state space, but doing so makes the theorem a test of your *modeling choices* rather than the world. If every anomaly can be modeled away by adding states, the theorem risks becoming vacuous. Lena is right to accept the "scope-limited" version: the theorem holds *given* an adequate model.

  **2. The Calibration Oracle (Move 5) and Absorption (Move 6)**
  Lena is **technically correct** that the case can be absorbed, but Marcus is right about the **cost**. To absorb calibration uncertainty, the agent must possess a "prior over priors" (a hyperprior) that already assigns non-zero probability to their own miscalibration. If an agent is dogmatic (credence 1 in their own correctness), they cannot conditionalize on calibration evidence.
  **The cost is representational:** The theorem presupposes that all relevant uncertainty is already represented in the state space. It cannot guide an agent to *discover* they need a richer hypothesis space; it only works once that space is already built. Lena admits this ("silence is precisely where the action is"), which validates Marcus's concern that the theorem doesn't cover the most interesting epistemic shifts (paradigm changes).

  **3. Substantiveness and Status**
  There is **no reading on which the theorem is both fully general and empirically substantive.**
  *   If taken as an empirical claim about all agents, it is false (people pay to avoid information).
  *   If taken as a normative claim about ideal agents, it is substantive but conditional (it binds only those who accept Bayesian axioms).
  **Its status is that of a coherence constraint.** Like the axioms of probability, it tells you what you *must* value if you want to avoid internal inconsistency in your planning. It is not trivial, because it rules out specific preference structures (e.g., information aversion), but it is not a law of nature.

  ***

  ### What Both Are Missing
  Both Marcus and Lena overlook the assumption of **Logical Omniscience (Computational Cost).**

  Good's theorem assumes that once the signal arrives, the agent can instantly and costlessly compute the new expected utility maximizing act for that signal. In reality, processing information requires cognitive labor.
  *   **The Missing Argument:** If the cost of *computing* the optimal response to the signal exceeds the gain from switching acts, the expected value of the information is negative, even if the signal is "free" and "pure."
  *   **Why it Matters:** This is the most robust explanation for why rational agents (bounded rationality) often refuse free information. It is not just about "impure" signals or "utility of knowing"; it is about the cost of thinking. A complete theory of the value of information must integrate computational complexity, which neither speaker addresses.
