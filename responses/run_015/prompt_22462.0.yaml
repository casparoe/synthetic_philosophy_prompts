  2.  **Deconstruct the Wilt Chamberlain Argument:**
      *   **Structure:**
          1.  Assume a distribution $D1$ is just (whatever pattern you like: equality, need, etc.).
          2.  People voluntarily transfer parts of their share to Wilt (e.g., 25 cents per ticket).
          3.  This results in distribution $D2$.
          4.  If $D1$ was just and transfers were voluntary, $D2$ must be just.
          5.  $D2$ violates the original pattern.
          6.  Therefore, patterned principles are incompatible with liberty.
      *   **Role of Initial Justice ($D1$):** Nozick grants the opponent *any* just starting point for the sake of argument. He says, "Let's assume your favored pattern is achieved." He doesn't need to prove $D1$ is historically just according to *his* theory; he needs to show that *even if* we start with the opponent's just pattern, liberty destroys it.

  3.  **Analyze the Lockean Proviso in Nozick:**
      *   **Classical Locke:** Appropriation is valid if "enough and as good" is left for others.
      *   **Nozick's Interpretation:** Appropriation is valid if it doesn't worsen the situation of others (or if they are compensated for the worsening).
      *   **Function:** It limits *original acquisition* and *transfer* in extreme cases (e.g., monopolizing water in a desert).

  4.  **Address Question 1: Is the Proviso a Problem for Wilt Chamberlain?**
