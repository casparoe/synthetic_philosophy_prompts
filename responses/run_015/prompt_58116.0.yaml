          *   Keeping Claim 5 (Blindness) is often a legal requirement (anti-classification).
          *   The choice is usually between Claim 1 (Calibration) and Claim 2 (Error Rate Parity).
          *   *Argument:* In a resource allocation context (apprenticeships), **Calibration** is often more defensible than Error Rate Parity. Why? Because the goal is to select those most likely to succeed. If the score represents probability of success, selecting the highest scores maximizes total success (utility). Error Rate Parity forces you to leave high-probability candidates on the table to pick lower-probability ones from the other group to balance errors.
