          *   Option C: Drop Claim 1. (Sacrifice calibration to aim for parity). But with Claim 4 (Single Cutoff), you still can't achieve Claim 2 easily.
          *   *Best Single Adjustment:* **Abandon Claim 2 (Error Rate Parity).**
          *   *Why?* Claims 1, 3, 4, and 5 form a coherent "Risk-Based Meritocracy" model. Claims 2 introduces the incompatibility. Maintaining Calibration (1) ensures the scores mean what they say. Maintaining Base Rate Realism (3) ensures honesty. Maintaining Single Cutoff (4) and Blindness (5) ensures operational simplicity and legal compliance (anti-classification). The cost is accepting that error rates will differ, which must be justified normatively (e.g., maximizing total program success).
          *   *Alternative:* Abandon Claim 4 (allow different cutoffs). This allows satisfying Claim 2 (Parity) and Claim 3 (Base Rates). But it violates Claim 5 (Blindness) effectively, because you need to know the district to apply the cutoff. And it violates the "common cutoff" constraint explicitly.
