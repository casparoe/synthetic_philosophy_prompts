      *   *Refinement on Petition 3:* The user says the Commission votes to *retain* the offence. This means they find the *practice* (the sex act) meets the criteria for criminal restraint. The Research Officer shows high prevalence. The Commissioners must argue that prevalence doesn't negate "common morality." This is consistent with Devlin (morality is what is *professed*, not necessarily practiced in secret).

  9.  **Final Polish:** Ensure the voice sounds like a helpful editor/consultant, not a lecturer. Keep the "Cottage" constraint in mind (no footnotes).

