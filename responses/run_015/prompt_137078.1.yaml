          *   *Verdict:* The procedure *can* support the User's draft. It requires the majority to interpret "Common Morality" as shared *principles* rather than shared *behaviour*, and "Loosening the Fabric" as a symbolic threat rather than a measurable social decay.

  5.  **Refining the Procedure Steps:**

