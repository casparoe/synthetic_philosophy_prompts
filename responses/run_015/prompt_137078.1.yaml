          *   Opposing petition: Repeal = declaration morality is dead = dissolution.
          *   Outcome: Devlinian keeps the law (symbolic endorsement needed). Hartian repeals (no tangible harm in speech, minority morality shouldn't bind).
      *   **Petition 3 (Consensual Sex - The User's Draft):**
          *   Practice: Private consensual sex (implied homosexual, given the 1960s context and Wolfenden reference).
          *   Research: Large minority do it. Convictions biased against poor/immigrants.
