  2.  **Deconstruct the Legal/Philosophical Context (Hart vs. Devlin):**

      *   **Devlin (The Enforcement of Morals):** Society has a right to protect its existence. Common morality is the bond. If the bond loosens, society disintegrates. The law can enforce morality *as such*, even without tangible harm to others. Disgust/Intolerance of the "reasonable man" is the test.
      *   **Hart (Law, Liberty and Morality):** Legal paternalism/moralism is suspect. Harm to others is the only valid ground for criminalization (Millian). Private morality is not the law's business. Enforcement of positive morality can be oppressive and stifle progress.
      *   **The Statute's Wording:** "Repugnant to the common morality," "loosens the fabric of the common life," "cannot be sufficiently restrained by any means short of the criminal law."
          *   *Repugnant to common morality:* Devlin territory (but requires evidence of *common* morality).
          *   *Loosens the fabric:* Devlin's "disintegration thesis."
          *   *Means short of criminal law:* Hartian proportionality/necessity test.

  3.  **Drafting the Procedure (The "Commission's Idiom"):**

      *   Must sound bureaucratic, legalistic, mid-20th century British.
      *   Must follow the statute's logic.
