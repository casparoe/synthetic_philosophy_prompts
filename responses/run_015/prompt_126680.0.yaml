answer: |-
  To assess your colleague's objection, we must disambiguate "determines" across three readings, ordered by strength. Each is stress-tested against your cases: (1) legal categories partly constituting production relations, and (2) categories surviving across regimes.

  **1. Constraint and Predictability**
  *Thesis:* Material life-processes set boundaries on plausible belief, making certain concepts predictable without causally producing them. "Determines" means constraint-setting; "social existence" denotes the whole material life-process; "consciousness" ranges over occurrent beliefs.
  *Verdict:* Modest but defensible.
  *Causal Inertia:* No. This licenses legal history as active within material limits.
  *Stress Tests:* Regarding constitution, this reading accepts that law settles relations, provided doing so doesn't violate material constraints (e.g., you cannot contractually define slavery where material conditions forbid it). Regarding survival, old categories persist not as ghosts but because they remain compatible with new material bounds. This relocates your question to identifying the boundaries rather than denying legal efficacy.

  **2. Selection and Retention**
  *Thesis:* Social existence acts as a selection mechanism; concepts stabilizing production relations are retained, others discarded. "Determines" means selection among available beliefs; "social existence" denotes relations of production; "consciousness" is the conceptual repertoire.
  *Verdict:* Substantive and contentious.
  *Causal Inertia:* No, but it imposes functionalism. Legal concepts have efficacy only insofar as they stabilize relations.
  *Stress Tests:* On constitution, this reading risks circularity: if law constitutes relations, and relations select law, the "base" is not independent. You must argue selection operates on the *outcome* of the legal-material hybrid. On survival, this explains redeployment functionally: old categories survive because they are selected for new utility, not merely as lag. This treats your reclassification as an adaptive mechanism, not epiphenomenal noise.

  **3. Causal Production (Epiphenomenalism)**
  *Thesis:* Material forces efficiently cause doctrinal content; ideas are reflections of pre-legal reality. "Determines" means causal production; "social existence" denotes material forces independent of law; "consciousness" is doctrinal content.
  *Verdict:* Probably false given your constitutive case.
  *Causal Inertia:* Yes. This licenses your colleague's view that legal history is superstructure all the way down.
  *Stress Tests:* On constitution, this fails. If being an "employee" is partly settled by law, the "material force" does not exist prior to the concept to cause it. The base/superstructure metaphor collapses. On survival, this can only describe redeployment as "lag" or false consciousness, denying the concept real work in the new regime. This reading requires you to deny your own premise that law constitutes the relation.

  **Dominance and Scope**
  A fourth axis concerns whether the sentence addresses *all* consciousness or only *dominant* ideas. The Preface sentence is scoped to the general process of intellectual life, not merely ruling ideology (unlike *The German Ideology*). If restricted to dominant ideas, it collapses into Reading 3 but only for hegemonic concepts, leaving subordinate legal categories potentially autonomous. If scoped to all epochs, it claims universal anthropological truth; if limited to class-divided societies, it allows for non-determined consciousness in other contexts.

  Your colleague relies on Reading 3, conflating the Preface with the dominance thesis. However, Reading 1 and 2 preserve the sentence's truth while denying epiphenomenalism. Reading 1 treats law as operating within material constraints; Reading 2 treats it as part of the selection environment. Both accommodate your constitutive claim: if law helps constitute the "existence" that determines consciousness, then changing the law changes the existence. The slogan does not entail that legal history is inert; it entails only that legal history cannot be explained independently of the material life-process it helps constitute. Your task is not to rebuild around material relations as if they were pre-legal, but to show how legal reclassification *is* a reorganization of social existence.
