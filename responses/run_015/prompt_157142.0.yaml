      *   *Overfitting analogy:* In ML, overfitting means modeling noise as signal to fit training data perfectly. Here, "Retrospective Causal Overfitting" means modeling the *outcome* perfectly by selecting specific causes that fit the story, ignoring the "noise" (contingencies, alternative paths) that existed at the time.
      *   *Validity:* It's a strong metaphor for a software engineer. It captures the reduction of complexity for the sake of coherence.

  3.  **Task 1: Mapping RCO onto the 2008 Crisis:**

