          *   *Investment Banks:* Narrative says "reckless leverage." RCO says leverage was rational given the regulatory capital requirements (Basel II) and market pricing at the time.
          *   *Regulators:* Narrative says "failed to intervene." RCO says intervention mechanisms were designed for 1930s banks, not 2000s derivatives.
          *   *Algo/Infrastructure:* Often ignored in standard narratives (human-centric). RCO highlights that risk models (VaR) created a false sense of security, coupling the system.
      *   *Collapse of Parallelism:* The narrative says A caused B caused C. Reality was A, B, C, D all interacting non-linearly.
      *   *2006 Evaluation:* With 2006 info, the signal-to-noise ratio was low. Housing prices had never fallen nationally. Correlations between asset classes were assumed low. Evaluating them as "negligent" is RCO; evaluating them as "operating within flawed but standard models" is accurate.

  4.  **Task 2: Predictability vs. Emergent Behavior:**

      *   *Predictability:* RCO suggests it *looks* predictable now, but wasn't then.
