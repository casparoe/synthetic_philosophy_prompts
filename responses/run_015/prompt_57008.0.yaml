answer: |-
  # Lesson Plan: The Disc Durability Wager

  ## 1. Framing Story
  **The Context:** You are quality control engineers for three competing factories (Alpha, Beta, Gamma) manufacturing circular composite discs for aerospace use.
  **The Defect:** Discs fail if subjected to a "Deep Stress Line." A Deep Stress Line is defined physically: any straight fracture passing closer to the disc's center than the inner red ring (radius = $R/2$).
  **The Claim:** All three factories claim their assembly line subjects discs to "Random Stress" consistent with the Industry Standard. The Industry Standard implies that "Random Stress" is a unique physical property of the disc, not the machine.
  **The Wager:** The client (the rest of the class) will pool your data to determine the "Universal Failure Rate." If the rates match, the Standard holds. If they diverge, the Standard is broken.

  ## 2. Materials List (Per Group of ~8-9 Students)
  *   **Base:** 1 A4 cardboard sheet.
  *   **Discs:** 10 pre-cut cardboard circles (Radius $R = 10$cm). Each has a visible center point and a printed inner concentric circle (Radius $r = 5$cm).
  *   **Fasteners:** 2 brass brads (paper fasteners).
  *   **Pointers:** 2 stiff card strips (15cm long, 1cm wide).
  *   **Randomizers:** 1 coin, 1 standard 6-sided die, 1 pin.
  *   **Tools:** 1 ruler, 1 marker, 1 pair of scissors.
  *   **Gauge:** 1 transparent overlay per disc (or simply use the printed inner ring).
  *   **Currency:** 20 paper tokens per student.

  ## 3. Device Instructions (Distributed Sealed)
  *Each group receives only their own instruction card. They are told these are "Proprietary Manufacturing Protocols."*

  **Group Alpha (Random Endpoints $\rightarrow$ $P = 1/3$):**
  1.  Fix a pointer at the disc center with a brad so it spins freely.
  2.  **Spin 1:** Spin the pointer. Mark the point on the rim where it stops (Point A).
  3.  **Spin 2:** Spin the pointer again. Mark the new rim point (Point B).
  4.  **Cut:** Draw a straight line connecting A and B. This is your Stress Line.
  5.  **Test:** If the line crosses into the inner red circle, record **FAIL**. If it stays outside, record **PASS**.

  **Group Beta (Random Radius $\rightarrow$ $P = 1/2$):**
  1.  Fix a pointer at the disc center with a brad.
  2.  **Angle:** Spin the pointer once. Mark the radius line it points to.
  3.  **Distance:** Take the die. Roll it. Measure that many cm from the center along the radius line (re-roll if 6). Mark this point $P$. (Note: This approximates a uniform pick on the radius $0-10$cm).
  4.  **Cut:** Draw the unique chord that is perpendicular to the radius at point $P$.
  5.  **Test:** If the chord crosses into the inner red circle, record **FAIL**. If it stays outside, record **PASS**.

  **Group Gamma (Random Midpoint $\rightarrow$ $P = 1/4$):**
  1.  **Drop:** Hold the disc flat on the table. Hold a pin 30cm above it. Drop the pin.
  2.  **Midpoint:** Wherever the pin lands on the disc surface is the *midpoint* of your Stress Line. (If it lands off the disc, re-drop).
  3.  **Cut:** Draw the unique chord for which this pin-mark is the exact center. (Use ruler to find center, draw line perpendicular to radius through that point).
  4.  **Test:** If the pin landed *inside* the inner red circle, record **FAIL**. If outside, record **PASS**.

  ## 4. Scoring Rule & Commitment Contract
  *Before building, every student signs the "Standardization Pact."*

  **The Pact:**
  1.  **Commitment:** "I certify that my device generates an Industry Standard Random Stress."
  2.  **Uniqueness Clause:** "I agree that any device generating Industry Standard Random Stress must yield the same Failure Rate."
  3.  **The Wager:**
      *   **Option A (Engineer):** Bet 10 tokens that your group's observed Failure Rate is the *Universal Truth*.
          *   If the pooled class data matches your rate ($\pm 5\%$): **Win 30 tokens.**
          *   If the pooled class data diverges significantly from your rate: **Lose 10 tokens.**
      *   **Option B (Skeptic):** Bet 10 tokens that the Question is Ill-Posed.
          *   **Win Condition:** You win 30 tokens *only if* the three groups produce statistically distinct Failure Rates (non-overlapping confidence intervals).
          *   **Lose Condition:** If all three groups produce roughly the same rate, you lose 10 tokens.

  *Design Note:* This prices the opt-out so it cannot be exploited for an early exit. A Skeptic *needs* the contradiction to materialize to win. They are incentivized to stay engaged until the data reveal. An Engineer *needs* consistency. The conflict is financially locked in.

  ## 5. Minute-by-Minute Timeline (75 Minutes)

  *   **00-10: Framing & Contract.**
      *   Introduce the "Disc Durability" story.
      *   Distribute Sealed Instructions.
      *   **Crucial:** Students sign the Pact and place their token bet (Engineer or Skeptic) *before* opening instructions or building. This locks the "Uniqueness Clause" before they see the mechanism.
  *   **10-20: Construction.**
      *   Groups build their devices. Instructor circulates to ensure protocol adherence (e.g., Gamma actually drops the pin, Beta measures distance).
  *   **20-50: Data Generation.**
      *   Groups run 50 trials each (1,300 total trials across class).
      *   Tally FAIL/PASS on the board in real-time.
      *   *Noise Control:* Instructor verifies every 10th trial to prevent "aiming."
  *   **50-60: Pooling & Conflict.**
      *   Calculate percentages: Alpha (~33%), Beta (~50%), Gamma (~25%).
      *   Write these large on the board.
      *   Allow 5 minutes of inter-group debate. They will claim the others are "cheating" or "not random."
  *   **60-70: The Reveal.**
      *   Instructor reveals the instructions were different.
      *   Overlay the three methods on a single diagram of a circle.
      *   Name the paradox (Bertrand's).
  *   **70-75: Payout & Debrief.**
      *   Settle tokens. (Skeptics win if divergence is clear; Engineers lose).
      *   Final conceptual wrap-up.

  ## 6. Debrief: Mapping Experience to Theory
  Do not lecture. Point to moments in the room.

  1.  **The Three Classical Answers:** Point to the three percentages on the board. "You just built the 1/3, 1/2, and 1/4 solutions physically."
  2.  **The Ill-Posedness Response:** Address the Skeptics. "You bet on contradiction. You won. Why? Because 'Random Stress' was a word without a mechanism."
  3.  **The Invariance Response:** Address the Engineers who argued others were "wrong." "You assumed the probability should be invariant under a change of machine. It isn't. Probability is not a property of the disc; it's a property of the *disc-plus-machine*."
  4.  **The Generating-Process Response:** "The only way to resolve the fight was to look at the instructions (the process). The math didn't save you; the physics did."

  ## 7. Predictable Failure Modes
  1.  **Sampling Noise:** With 50 trials, Gamma (25%) might get 15/50 (30%) and Alpha (33%) might get 16/50 (32%). The distinction blurs.
      *   *Fix:* Enforce 50 trials *minimum*. If time allows, push to 100. The gap between 25% and 50% is large enough to survive moderate noise.
  2.  **The "Aiming" Bias:** Students subconsciously avoid the center (Gamma) or aim for it (Beta).
      *   *Fix:* Instructor acts as "Auditor," randomly verifying the pin drops and ruler placements.
  3.  **The Threshold Confusion:** Students misjudge whether a chord crosses the inner ring.
      *   *Fix:* The "Gauge" rule is binary: Does the line physically cross the ink of the inner circle? Yes/No. No measurement required.
  4.  **Early Skepticism:** A group realizes the methods differ at minute 15.
      *   *Fix:* The Contract forbids sharing instructions until the Data Reveal (minute 60). Violation = forfeiture of tokens.

  ## 8. Structural Limitations
  *   **What this activity cannot deliver:** It cannot prove *mathematically* why the Principle of Indifference fails. It shows *that* it fails.
  *   **What you must supply:** You must explicitly articulate that "Equal Ignorance" was applied to three different *variables* (Angle, Distance, Area). The activity shows the *Process* divergence; you must verbally bridge it to the *Parameterisation* divergence.
  *   **The "Different Experiments" Escape:** The design blocks this *during* the betting phase via the Contract. However, in the debrief, students will correctly retreat to "They were just different experiments." You must validate this: "Yes. That is the dissolution. But the paradox is that you all believed, until minute 60, that they were the *same* experiment."

  ## 9. Lesson Security Analysis
  **Which lesson does this secure?**
  This design secures **that a probability claim is incomplete without a specified generating process.**

  **Why?**
  The students physically hold the "process" (the spinner, the pin drop). The divergence is manifestly caused by the physical difference in the machines. The "Parameterisation" lesson (that indifference is relative to a variable choice) is abstract. Students can walk away thinking "Machine B is broken" rather than "Variable B is arbitrary." To teach Parameterisation, you would need them to derive the probabilities mathematically from their devices and see that they each assumed a different variable was "uniform." This activity stops short of that derivation to save time for the physical clash.

  **What would I need to see to be persuaded it taught the other one?**
  I would need to see a group, during the debate phase, argue: "We assumed the *angle* was uniform, but they assumed the *area* was uniform. We were both equally ignorant, just about different things." If that sentence emerges from the students, the Parameterisation lesson has landed. If they only say "Your machine is different," the Process lesson is the one that stuck.

  **Where is the reasoning weakest?**
  The "Skeptic" bet relies on the data being distinct enough to be visually obvious in 75 minutes. If the noise is high, Skeptics lose, and the lesson fizzles into "maybe it was just bad luck." The design bets heavily on the law of large numbers working fast enough in a noisy classroom environment.

  Verdict: process
