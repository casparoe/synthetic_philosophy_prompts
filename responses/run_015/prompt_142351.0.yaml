answer: |-
  Here is the teaching plan. It is designed to keep the philosophical structure load-bearing while preventing the session from devolving into a history debate or a culture-war shouting match.

  ### 1. The Core Example: Jefferson
  **Use Jefferson.** You are worried he is "too loaded," but that loading is actually your greatest asset in a 60-minute slot.
  *   **Why not Columbus:** You are right; he is too easy. The "Conceptual Availability" of modern human rights in 1492 is so low that the defence looks too strong. Students will agree he "couldn't know," and you lose the tension needed to test where the defence breaks.
  *   **Why not Churchill:** He is a strong runner-up, but for a general-ed module (likely US-centric given the module title), Jefferson is the canonical case. The cognitive dissonance is sharper.
  *   **Why Jefferson wins:** The "Conceptual Availability" defence *fails* most clearly here. Abolitionist arguments *existed* in Jefferson's lifetime (e.g., the Somerset Case, Quaker petitions). He wrote "all men are created equal" while enslaving people. This forces students off the "he didn't know" (Concepts) argument and onto the "it would have been too hard" (Cost) argument. That is where the defence gets weak, and that is where the real ethical work happens.
  *   **Managing the Load:** You must frame Jefferson not as a defendant on trial for slavery, but as a **test case for the argument itself**. Open by saying: *"We are not here to decide if Jefferson was good or bad. We are here to decide if the phrase 'man of his time' is a valid ethical tool. Jefferson is just the stress test."* This depersonalizes the judgment.

  ### 2. The Order of Ideas
  **Sequence:**
  1.  **The Tool:** Cost vs. Concepts (Flatmate's Distinction).
  2.  **The Test:** Apply to Jefferson (Moral Judgment).
  3.  **The Stress Test:** The Symmetry Worry (Praise vs. Blame).
  4.  **The Policy:** Excuse vs. Commemoration (Statues/Names).

  **Argument for this ordering:**
  You must establish **Moral Status** (is he blameworthy?) before you decide **Public Policy** (do we keep his name on the building?).
  *   If you discuss Commemoration first, students conflate "He was bad" with "Take down the statue." They will argue about the building's utility or history, bypassing the ethics.
  *   By establishing the *Conceptual Availability* distinction first, you give them a ruler to measure the blame.
  *   The *Symmetry Worry* must come *after* you apply the tool to Jefferson but *before* you discuss Commemoration. Why? Because if the Symmetry Worry leads to nihilism ("no one is ever blameworthy"), then the Commemoration discussion is pointless. You must resolve the nihilism trap before asking them to make a policy decision.

  ### 3. Naming the Distinction
  **Yes, give it a name.** Non-majors need handles to carry concepts out of the room.
  *   **Name:** **"The Conceptual Availability Test."**
  *   **Where:** Introduce it in the first 15 minutes. Write it on the board.
  *   **How:** Draw a T-Chart. Left side: **"Cost"** (He knew it was wrong, but acting on it would ruin him). Right side: **"Concepts"** (He literally lacked the vocabulary to see it as wrong).
  *   **Instruction:** Tell them: *"If the defence relies on Cost, it's an excuse. If it relies on Concepts, it's an exemption. We are going to run Jefferson through the Availability Test."*

  ### 4. Misconception Management
  Here are the three misconceptions in the order they will surface, and the specific move to head them off.

  **A. "Moral Progress is Inevitable" (Surfaces during The Tool)**
  *   **The Trap:** Students will say, "We just know better now because we evolved." This undermines the Test.
  *   **The Head-Off:** When this comes up, point to the "Concepts" side of your T-Chart. Ask: *"Did the concept of 'abolition' exist in 1776?"* (Yes). *"Did people use it?"* (Yes). *"So it wasn't inevitable progress; it was available choice."* Force them to see that "time" doesn't bring concepts; *people* do.

  **B. "Judging = Cancelling" (Surfaces during The Test)**
  *   **The Trap:** Students who think "obviously you can judge him" will immediately jump to "strip his name from the building." This collapses the Excuse/Commemoration split.
  *   **The Head-Off:** Put a physical barrier on the whiteboard. Draw a line. Top: **"Moral Judgment."** Bottom: **"Public Honor."** Say: *"For the next 30 minutes, we are only working in the top box. If you mention statues or building names before we cross the line, I'm going to park that point in the bottom box."*

  **C. "The Nihilism Shrug" (Surfaces during Symmetry)**
  *   **The Trap:** "If Jefferson is excused by his time, I'm excused by mine. Nothing matters."
  *   **The Head-Off:** Introduce the **"Transcendence Clause."** When the symmetry worry hits, argue: *"We don't praise people for fitting their time; we praise them for exceeding it. Jefferson gets blame not because he was a slaveholder, but because he wrote 'Liberty' and refused to apply the concept he invented."* This breaks the symmetry: We blame the failure to transcend, we praise the success.

  ### 5. The Refusal
  **What to flatly refuse:** **Adjudicating disputed historical facts.**
  *   **Say this out loud:** *"I am an ethicist, not a historian. If we start arguing about exactly how many slaves Jefferson owned or exactly what he said about India in 1943, we will run out of time and learn nothing about ethics. We are taking the *strongest version* of the historical claim as given for the sake of the argument."*
  *   **Why:** This protects you from the History PhD flatmate syndrome in the room. It keeps the focus on the *structure* of the defence, not the *data*.

  ### 6. The Check (Exit Ticket)
  Do not do a show of hands. Do a **"2075 Audit."**
  *   **Task:** Give them 5 minutes at the end. Ask them to write down one thing they currently believe or do that their grandchildren might condemn.
  *   **Application:** Ask them to run **The Conceptual Availability Test** on it.
      *   *Is it a Cost issue?* (e.g., "I eat meat because vegan food is expensive.")
      *   *Is it a Concept issue?* (e.g., "I don't realize AI art is theft because I don't conceive of it as property.")
  *   **Collection:** Have them hand the slip to you as they leave.
  *   **Why this works:** It proves they can use the tool on a case you didn't walk them through (themselves/the future). It also directly addresses the Symmetry Worry without solving it for them—it forces them to feel the weight of their own temporal blindness.

  ### Summary of the Hour (60 Minutes)
  *   **00-10:** Intro. Jefferson as the stress test. Board setup (Judgment vs. Honor).
  *   **10-25:** **The Tool.** Define Cost vs. Concepts. Name it "The Conceptual Availability Test."
  *   **25-40:** **The Test.** Apply to Jefferson. Show Concepts *were* available. Defence shifts to Cost. Defence weakens.
  *   **40-50:** **Symmetry.** Raise the nihilism worry. Resolve with "Transcendence Clause" (Praise the exceedance, blame the failure).
  *   **50-60:** **Commemoration & Check.** Cross the line on the board. Briefly discuss if Judgment changes Honor. Distribute "2075 Audit" slips.

  This structure ensures the flatmate's distinction is the engine, the Symmetry Worry is resolved before the end, and the Commemoration question is kept distinct until the students have the tools to handle it.
