answer: |-
  **Question 1**
  "Last year a student here got disqualified for an AI song because nobody wrote it, but you say a session musician who didn't write the notes can still make art."
  *She'll probably say:* "The musician transmits the composer's lived feeling; the AI has no source feeling to transmit."
  [But if the composer is dead, how is their feeling alive enough to be transmitted?]

  **Question 2**
  "Advertising jingles and political speeches grip people with feelings and make us take them up as the speaker's, so why aren't they art on your view?"
  *She'll probably say:* "They aim for manipulation or reaction, not the specific kind of union art creates."
  [If the difference is the kind of feeling, aren't you secretly judging the value of the feeling to decide if it counts as art?]

  **Question 3**
  "If a propaganda film successfully transmits hatred so the audience feels it as the director's, is it art?"
  *She'll probably say:* "Yes, it's art, but morally terrible art; that's a value judgment, not a definition."
  [Okay, but if transmission alone makes it art, then your theory can't explain why we care so much about art being distinct from propaganda in the first place.]

  **Question 4**
  "Tolstoy said most museum pieces and even his own early novels were counterfeit art; do you agree with those verdicts?"
  *She'll probably say:* "No, those verdicts came from his religious views, not the transmission theory itself."
  [So if the theory allows counterfeit art to be real art, what work is the theory doing besides describing successful communication?]

  **Question 5**
  "To exclude ads and propaganda, you might say only 'aesthetic' feelings count, but doesn't that make your definition circular?"
  *She'll probably say:* "No, we can identify the feelings independently of whether they come from art."
  [But if you can't point to a feeling-type without already knowing it came from art, aren't you just defining art by the feelings you already like?]

  **Question 6**
  "With instrumental music or works by unknown makers, there are no words to tell us whose feeling this is; how do we know we're taking it up as the artist's?"
  *She'll probably say:* "The structure of the work itself guides us to the emotional intent."
  [But if the structure does the work, why do we need the composer's lived feeling at all?]

  **Question 7**
  "You say an actor or commissioned composer can make art, but they are often pretending or working to order."
  *She'll probably say:* "They are accessing universal human feelings they have lived through in other contexts."
  [Then isn't the art coming from their life, not the specific work they were hired to create?]

  **Question 8**
  "I feel awe at a sunset or a math proof, but there's no artist handing it to me; is that feeling just a cousin to art?"
  *She'll probably say:* "Yes, it's aesthetic experience, but without transmission, it isn't art."
  [If the feeling is the same, does it matter for the listener whether an artist made it or not?]

  **Question 9**
  "Finally, what would have to happen in the world for you to abandon this theory?"
  *She'll probably say:* "If we found art that moved people without any transmission of feeling."
  [And if we found transmission that didn't feel like art, would that also count against you?]
