              *   Actually, usually the theorem is: "Common Prior implies no *common knowledge* of disagreement implies no *common knowledge* of agreeable bet."
              *   If the question asks "why the so-called no-trade theorem is not a corollary of the common prior assumption alone", the answer should highlight the **Common Knowledge** requirement.
