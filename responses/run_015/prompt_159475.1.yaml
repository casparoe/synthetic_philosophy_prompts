                      *   You cannot have a conditional probability of $1/4$ on an event with prior probability 0.
                      *   Therefore, dropping the positivity requirement on $\mu$ *globally* does not help if the belief maps themselves assign positive probability to those states. The prior *must* support the support of the posteriors.
                      *   Since Ann's posterior at $A_2$ supports $\omega_4$, $\mu(\omega_4)$ must be $> 0$.
                      *   Since Bob's posterior at $B_2$ supports $\omega_4$, $\mu(\omega_4)$ must be $> 0$.
                      *   So the positivity constraint is effectively forced by the belief maps, not just an arbitrary rule.
