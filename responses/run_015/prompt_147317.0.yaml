          *   Can a pluralist accept this? A *weak* pluralist might (levels are useful heuristics). A *strong* pluralist (Fodor) would object because the criteria demand *connection* to lower levels, threatening the autonomy of the special sciences.
          *   The practice privileges *integrative pluralism* (Kellert et al.) over *autonomous pluralism*. It rules out the idea that cognitive traits exist in a firewall separate from mechanistic decomposition.
      *   **Question 4: Changing the Criteria (The Counterfactual):**
          *   *Allowing Pure Molecular:* Would imply cognitive traits are *nothing but* molecular states (Eliminative Materialism or strict Identity Theory). Organization doesn't matter.
          *   *Allowing Irreducible Emergence:* Would imply Strong Emergence or Structuralism. Cognitive traits have causal powers independent of underlying mechanisms. Teleology might creep back in.
