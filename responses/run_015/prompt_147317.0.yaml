          *   *Approved:* Continuous, stepwise adaptive pathways from lower-level mechanisms (independently established) to high-level traits. (Bottom-up, but stepwise).
          *   *Rejected (Type 1):* Sudden, functionally irreducible jumps or top-down selection pressures ("skyhooks"). Even if empirically equivalent.
          *   *Rejected (Type 2):* Purely molecular-level derivations skipping intermediate levels ("greedy reductionism").
      *   **The "Narrow Middle Space":** Explanations must be bottom-up *through* intermediate levels, avoiding both magical top-down and greedy bottom-all-the-way-down.
      *   **Questions:**
          1.  What philosophical commitments (explanation, ontology, novelty) does this presuppose?
          2.  Does it *require* a mechanistic/multi-level view, or just fit well?
