answer: |-
  Here is the decision procedure. It is designed to be printed on a single sheet, kept in your binder, and run in under ten minutes. It incorporates your friend's counterpart theory (context, non-transitivity, one-to-many mapping) without using the vocabulary that makes writers' eyes glaze over.

  It replaces your old "Origin Scene" rule with a **"Causal & Contextual Continuity"** rule.

  ***

  # THE CONTINUITY PROTOCOL (v4.2)
  **For:** Alt-Timeline / Branch Pitches
  **Time Limit:** 10 Minutes per Pitch
  **Goal:** Determine if we can bill a character as "The Same Character" or if they must be billed as a "Variant/New."

  ### STEP 1: THE ANCHOR CHECK (Existence)
  **Question:** Does a version of this character exist in the "Prime" timeline (the main show's current canon) *before* the branch point occurs?
  *   **YES:** Proceed to Step 2.
  *   **NO:** **STOP.** This is a **New Character**.
      *   *Reasoning:* You cannot be a variant of something that never existed. (Handles: *Character who exists in only one timeline*).
      *   *Marketing Note:* You can say "The Hero's Son," but you cannot say "The Same Son."

  ### STEP 2: THE SPLIT POINT (Causality)
  **Question:** Did the timeline branch *after* the character's core memories and personality were formed?
  *   **YES:** They are a **Continuant**. (Proceed to Step 3).
      *   *Definition:* They remember the same past up to the moment of divergence.
  *   **NO:** They are a **Counterpart**. (Proceed to Step 3).
      *   *Definition:* Their history differs fundamentally (e.g., adopted at birth, died before the branch, born after the choice).
      *   *Handles:* *Dead/Alive cases, Origin Changes.* If they died in Prime but live in Branch, the Split Point is before death. They are a Counterpart.

  ### STEP 3: THE UNIQUE MAPPING (One-to-Many Test)
  **Question:** In this specific story context, does this Branch Character map to **one and only one** Prime Character?
  *   **YES:** Proceed to Step 4.
  *   **NO:** **STOP.** This is a **Composite/Variant**.
      *   *Reasoning:* If one Branch character combines the history/role of two Prime characters, they cannot claim the identity of either exclusively. (Handles: *Crossover merges, One character = Two counterparts*).
      *   *Marketing Note:* You cannot bill them as "Character X" if they are also functioning as "Character Y."

  ### STEP 4: THE NARRATIVE STAKES (Contextual Weight)
  **Question:** Does the emotional payoff of the story *require* the audience to believe this is literally the same soul, or just "the same guy for this story"?
  *   **"Same Soul" Required:**
      *   If Step 2 was **Continuant**: **GREEN LIGHT.** (Bill as Same Character).
      *   If Step 2 was **Counterpart**: **HARD NO.** (Bill as Variant).
          *   *Reasoning:* You cannot ask for deep emotional continuity if the causal history is broken. (Handles: *Evil Twin where similarity isn't enough*).
  *   **"Same Guy" is Enough:**
      *   **GREEN LIGHT.** (Bill as Same Character with a disclaimer).
          *   *Reasoning:* Counterpart theory allows us to treat them as identical *for the context of this story*, even if metaphysics says otherwise.

  ### ESCALATION POINTS (When to call a Human)
  **Stop the checklist and call the Showrunner if:**
  1.  **Step 3 fails (One-to-Many):** This is a legal/marketing risk. Merging two established identities confuses the wiki and licensing.
  2.  **Step 2 is Counterpart, but Step 4 is "Same Guy":** This is the "Marketing vs. Lore" fight. You need final say on whether the audience will accept the lie.

  ***

  # RUNNING THE PROCEDURE ON CURRENT PITCHES

  Here is the output for the three pitches currently on your desk.

  ### PITCH 1: The Resurrected Doctor
  *   **Premise:** Ship's doctor (dies Ep 4, Main) is alive and practicing in a branch.
  *   **Step 1 (Anchor):** YES. Prime Doctor exists.
  *   **Step 2 (Split Point):** **COUNTERPART.** To be alive, the branch must occur *before* Ep 4. However, the Prime Doctor *died*. The Branch Doctor did not. Their histories diverge at the moment of the fatal incident. They do not share the same future, and the Prime version's history includes death.
  *   **Step 3 (Mapping):** YES. Maps only to Prime Doctor.
  *   **Step 4 (Stakes):** **"Same Guy" is Enough.** It's a bottle episode about medicine, not a metaphysical drama about souls.
  *   **VERDICT:** **GREEN LIGHT (With Caveat).**
      *   *Billing:* "The Doctor's Story."
      *   *Internal Note:* Technically a Variant (Counterpart), but Step 4 allows the marketing shorthand.
      *   *Wiki:* Tag as "Branch-44 Doctor."

  ### PITCH 2: The Hero's Son
  *   **Premise:** Spin-off about the Hero's son, conceived/born *after* the branch point in the new timeline.
  *   **Step 1 (Anchor):** **NO.** There is no "Prime Son." The son does not exist in the main show.
  *   **VERDICT:** **STOP (New Character).**
      *   *Billing:* You **cannot** bill this as "The Same Character." There is no "Same."
      *   *Marketing Fix:* You *can* bill it as "Our Hero's Son" (possessive), provided the Hero passes the checklist. The Hero is a Continuant (Step 2 YES). The Son is a New Character (Step 1 NO).
      *   *Risk:* Low. Audiences understand children born in alt-timelines are new people.

  ### PITCH 3: The Crossover Merge (Show A Minor Char = Show B Major Char)
  *   **Premise:** Minor Character from Show A appears in a branch of Show B, functioning as the counterpart to Show B's Major Character.
  *   **Step 1 (Anchor):** YES. Show B Major Character exists in Prime.
  *   **Step 2 (Split Point):** **COUNTERPART.** Show A and Show B are distinct timelines. Their histories are fundamentally different from birth/origin.
  *   **Step 3 (Unique Mapping):** **FAIL.**
      *   *Reasoning:* In the Prime Canon, Show A Minor Char and Show B Major Char are **two different people**. In this pitch, the Branch Character is attempting to be the counterpart of the Show B Major Char, but they *are* the Show A Minor Char.
      *   *The Problem:* This creates a **One-to-Two** mapping. The Branch Character is a counterpart to *both* the Minor Char (by origin) and the Major Char (by role).
      *   *Theory:* This violates the Non-Transitive/Unique Mapping rule. You cannot collapse two Prime identities into one Branch identity and claim it is exclusively one of them.
  *   **VERDICT:** **HARD NO.**
      *   *Billing:* You **cannot** bill this as "Show B's Major Character."
      *   *Why:* If you tell the audience "This is Major Character B," the Wiki and the fans will prove that Major Character B has a history (Show B) that this person does not have (Show A).
      *   *Fix:* Bill it as "A Variant of Major Character B" or "The Show A Version of Character B." Do not claim identity.

  ***

  # WHAT THIS PROCEDURE CANNOT DO (Read Before Meeting)

  You asked for the limitations. Here is where this tool stops working and where you will still have to fight your friend (and the showrunner) manually.

  **1. It cannot predict Audience Tolerance.**
  The procedure says Pitch 1 (The Doctor) is technically a Counterpart, but allows the "Same Character" billing under Step 4. It cannot tell you if the audience will *accept* that. Some fans treat "Same Character" as a metaphysical claim (Soul Identity); others treat it as a functional claim (Role Identity). This procedure assumes the latter for marketing ease. If the fanbase is hardline metaphysical realists, Pitch 1 will still cause a riot.

  **2. It cannot settle "Licensed by Canon."**
  Your friend is right that "Is it the same character?" has no fact of the matter. The real question is: *"Is this story licensed by the emotional investment we already have?"*
  *   **Pitch 2** passes the procedure as a "New Character," but Marketing wants to lean on the Hero's fame. The procedure clears the lore, but it doesn't clear the *commercial* risk of misleading the audience about whose story this is.
  *   **Pitch 3** fails the procedure on identity, but the Showrunner might say, "I don't care about identity, I care about recognition." If the audience recognizes the *actor* or the *archetype*, the Showrunner may override the "Hard No." Your job is to document that you flagged the identity contradiction (Step 3) so the Wiki team knows to tag it as a "Merge."

  **3. It cannot solve the "Branch of a Branch" infinite regress.**
  If we take a Branch, then branch *that* branch, then branch *that* one... Step 2 (Split Point) gets muddy. Does the character remember the first branch? The second?
  *   *Rule of Thumb:* If the character remembers the Prime Timeline directly, they are a Continuant. If they only remember a Branch Timeline, they are a Counterpart to the Prime, even if they are a Continuant of the Branch.
  *   *Limitation:* After three layers of branching, stop using "Same Character" entirely. The cognitive load for the audience is too high. Bill everything as "Variant" after Branch-Level-3.

  **Summary for the Showrunner:**
  Use Pitch 3 as your wedge. It is the cleanest "No." It violates Step 3 (Unique Mapping). It forces two Prime identities into one slot. It is objectively contradictory to the established Wiki. Tell them: *"We can do the story, but we cannot lie about who it is. If we say it's Character B, we break the canon. If we say it's a Variant of Character B, we save the canon."*
