prompt: |-
  I had a stupidly long argument about this last night with my friend (she's half way through a philosophy PhD and will not drop anything) and I want to come out of it with something I can actually use at work.

  I'm the continuity editor on a shared-universe sci-fi franchise with branching timelines — the main show plus two spin-offs, and we get about thirty pitches a season for "what if" episodes and alt-timeline spin-offs. I get roughly twenty minutes per pitch to give a yes/no before it goes up to the showrunner, who has final say and who cares mostly about marketing. The writers are good at plot and useless at metaphysics, and they will not read a page on modal logic, so whatever you give me has to be runnable by someone who has never heard the words "de re" and has never heard of Lewis. There's also a fan wiki that will absolutely scream if we contradict ourselves, so the rule has to be one we can state in public and apply the same way twice.

  Our rule up to now has been: a character in a branch is the same character if and only if they share an origin scene — same parents, same birth, same inciting incident — and anything else has to be billed as a "variant," which marketing hates and which we use maybe three times a season. My friend says the whole rule is backwards: identity doesn't hold across worlds at all, and what we're actually doing every time is picking a counterpart relation that's context-relative, similarity-based, and not transitive, and that our origin test just smuggles in one answer to a question that has no fact of the matter and then breaks in predictable ways.

  So: write me a decision procedure my team can run on a pitch. The questions in order, what counts as a good enough answer to each one, where the procedure returns a hard no and stops, and where it has to stop and hand the call to a human because the question is really about what we want the story to mean rather than about what's true in the fiction. Make the counterpart-theory bit do real work — I specifically want the thing that falls out of taking counterparts seriously (that the relation is context-relative, that it isn't transitive, that a character can have two counterparts or none) to be built into the steps rather than being a paragraph of theory stapled to a checklist.

  Cases the procedure has to survive: a branch of a branch, so that a counterpart of a counterpart has to be handled; a character who dies before the branch point and is alive in the branch; a "what if" that changes the character's origin itself (the pitch is: what if she'd been adopted); a version of a character who is a plausible counterpart of two different main characters at once; an evil-twin episode where the twin is more similar to the hero than the hero's own branch-self is; and a character who exists in only one timeline and therefore has no original to be a variant of.

  Then run it on three pitches actually on the table right now: (1) a bottle episode in which the ship's doctor, who dies in episode four of the main show, is alive and practising in a branch, and which we want to advertise as "the doctor's story"; (2) a spin-off about the hero's son, conceived and born after the branch point in a timeline where the hero made a different choice, where marketing has already promised it's about "our hero's son"; (3) a crossover in which a minor character from show A appears in a branch of show B and, under any sane counterpart relation, reads as the counterpart of a major character from A — which would mean our already-announced tentpole crossover is technically a variant story.

  I need at least one of those to come out as "no, that's not the same character and you can't bill it as such" — ideally the crossover, because I'm the one who has to walk into the room and tell the showrunner, and I'd like to know in advance exactly which step kills it. And finish by telling me plainly what the procedure can't do: where it can't settle whether an audience will just accept a counterpart relation without being told about it, and whether "is it the same character" is even the right question for us to be asking instead of "is this story licensed by the canon."
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Continuity Editor for a shared-universe sci-fi franchise (main show + 2 spin-offs).
      *   **Task:** Needs a practical decision procedure to evaluate "what if"/alt-timeline pitches (30/season, 20 mins/pitch).
      *   **Constraints:**
          *   Writers know plot, not metaphysics (no "de re," no "Lewis").
          *   Marketing hates the word "variant" (overuse is bad).
          *   Fan wiki watches for contradictions (consistency is key).
          *   Must handle branching timelines, branches of branches, etc.
          *   Must incorporate *Counterpart Theory* (context-relative, non-transitive, 1-to-many or 1-to-none) without using the jargon.
          *   Must handle specific edge cases (dead/alive, origin change, evil twin, 1-to-2 mapping, single-timeline character).
          *   Must evaluate three specific current pitches (one must be a "No" on identity, ideally the crossover).
          *   Must explicitly state limitations (audience acceptance, "licensed by canon" vs. "same character").
      *   **Conflict:** User's current rule (Origin Scene Identity) vs. Friend's PhD critique (Counterpart Theory/Contextual Identity).
      *   **Goal:** A hybrid tool that satisfies the Friend's philosophical rigor but works for the User's practical constraints.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Current Rule (Origin Essentialism):* Same origin = Same Person. Simple, but breaks on "What if I was adopted?" or "What if I died before birth?" or Branches of Branches (transitivity issues).
      *   *Friend's Critique (Lewisian Counterpart Theory):* No trans-world identity. Only similarity/context. Breaks the "Same Person" marketing hook.
      *   *The Solution:* A *Functional Counterpart Procedure*. We acknowledge there is no metaphysical "truth," but we need a *conventional* truth for the audience. We treat "Same Character" as a claim about *narrative continuity of consciousness/psychology* rather than metaphysical substance, but we allow context to shift the weight of that claim.

  3.  **Drafting the Decision Procedure (The "Continuity Protocol"):**
      *   *Requirement:* Needs to be runnable by non-philosophers.
      *   *Requirement:* Needs to embed counterpart theory features (context, non-transitivity, 1-to-many).
      *   *Structure:* Sequential questions. Hard Stops. Human Escalation.

      *   *Step 1: The Causal Link (The Branch Point).*
          *   Does the timeline diverge *after* the character's existence begins?
          *   *Theory:* Establishes the baseline for transitivity. If they diverge before birth, they are counterparts, not continuants.
          *   *Hard Stop:* If no causal link to the main timeline *at all* (completely new universe), it's a reboot, not a branch. (Wait, user says "shared universe," so assume link exists).
          *   *Refinement:* Let's focus on the *Character's* history. Did the split happen before or after the character became "themselves"?

      *   *Step 2: The Psychological/Narrative Continuity (The "Mind" Test).*
          *   Do they remember the same past up to the split?
          *   *Theory:* This handles the "Dead/Alive" issue. If they died in Main but live in Branch, they aren't the same *continuant*, but they can be *counterparts*.
          *   *Marketing:* "Same Character" requires memory continuity.

      *   *Step 3: The Contextual Weight (The "Story Role" Test).*
          *   *Theory:* This is where Counterpart Theory shines. Identity is context-relative. In a romance story, genetic origin matters. In a war story, rank/loyalty matters.
          *   *Application:* What is the *primary conflict*? Does the conflict rely on them being the *same* person, or just *similar*?
          *   *1-to-Many:* Can this character map to two people? (The "Two Fathers" problem).

      *   *Step 4: The Transitivity Check (Branch of a Branch).*
          *   If A -> B -> C. Is C the same as A?
          *   *Theory:* Counterpart relations aren't transitive.
          *   *Rule:* If the chain of memory breaks, the identity claim weakens.

      *   *Refining the Steps for the User:*
          *   Let's make it a "Scorecard" approach but with Hard Stops.
          *   *Q1: The Divergence Point.* (Before or After Character Formation?)
          *   *Q2: The Memory Trace.* (Do they remember the 'Prime' past?)
          *   *Q3: The Unique Mapping.* (Is this character the *only* counterpart in this context?)
          *   *Q4: The Stakes.* (Does the story break if they aren't the 'same'?)

      *   *Incorporating the Friend's Critique:* The Friend says origin is arbitrary. So, Q1 shouldn't be "Same Birth," it should be "Same History up to Split." If the pitch is "What if adopted?", the history changes *before* the split. That makes them a Counterpart, not a Continuant.
      *   *Incorporating Marketing:* We want to say "Same Character" when possible. So we define "Same Character" as "Continuant." We define "Variant" as "Counterpart."
      *   *The Twist:* We allow "Same Character" billing for Counterparts *if* the Context (Q4) supports it. This satisfies the Friend (it's contextual) and Marketing (we can still say "It's him!").

  4.  **Developing the Specific Steps (Iterative refinement):**

      *   *Step 1: The Anchor Check.* (Causal link). Is there a Prime version? If No -> New Character (Hard Stop for "Same Character" claim).
      *   *Step 2: The Split Point.* (Temporal). Did the timeline branch *after* the character's key formative memories were established?
          *   If Yes -> Strong claim to Identity.
          *   If No (e.g., adopted at birth, died before branch) -> Counterpart only.
      *   *Step 3: The Uniqueness Check.* (1-to-Many). In this specific story context, does this Branch Character map to more than one Prime Character?
          *   If Yes -> Counterpart (Hard Stop for "Same Character" claim).
          *   *Theory:* Non-transitive/1-to-many handling.
      *   *Step 4: The Narrative Necessity.* (Context). Does the emotional payoff require them to be literally the same soul, or just the "same guy" for this story?
          *   If "Same Soul" required but Step 2 failed -> Hard No.
          *   If "Same Guy" is enough -> Green Light (with caveat).

  5.  **Testing against the Required Cases:**
      *   *Branch of a Branch:* Handled by Step 2 (cumulative memory loss?).
      *   *Dead before branch/Alive in branch:* Step 2 fails (no shared history past death). Counterpart.
      *   *Origin Change (Adopted):* Step 2 fails (divergence before memory). Counterpart.
      *   *One character = Two counterparts:* Step 3 catches this.
      *   *Evil Twin (More similar than self):* Step 4 handles context.
      *   *Exists in one timeline only:* Step 1 catches this.

  6.  **Evaluating the Three Pitches:**

      *   *Pitch 1: Doctor (Dead in Main, Alive in Branch).*
          *   Step 1: Anchor exists (Prime Doctor).
          *   Step 2: Split Point. If he dies in Ep 4, and branch happens *after* Ep 4, he's still dead. If branch happens *before* Ep 4, he lives.
          *   *Scenario:* Pitch says he's alive. Implies branch happened before death.
          *   *Memory:* Does he remember dying? No. Does he remember the past? Yes.
          *   *Verdict:* Counterpart. Can we bill as "The Doctor's Story"? Yes, contextually (Step 4), but technically a Variant.
          *   *Wait, User wants a "No" on identity.* Let's look closer. If he dies in Main, and is alive in Branch, they do not share a *future*. But identity is usually past-focused.
          *   *Correction:* If the branch point is *after* his birth but *before* his death, he is a Continuant. If the pitch implies he "came back" or the branch is "What if he didn't die," that's a Counterpart.
          *   *Decision:* I need to make sure one pitch fails hard. Let's look at Pitch 3.

      *   *Pitch 2: Hero's Son (Born after branch).*
          *   Step 1: Anchor? No Prime Son.
          *   Step 2: Split Point. Born *after* choice.
          *   *Verdict:* He is not a counterpart of anyone. He is a new character who is the *son of a counterpart*.
          *   *Marketing:* "Our Hero's Son." This is possessive. It relies on the Hero being the same. If Hero is same, Son is... new.
          *   *Verdict:* Passes "Same Character" for the Hero, but the Son is new. This is usually fine.

      *   *Pitch 3: Crossover (Minor Char A = Major Char B counterpart).*
          *   Step 1: Anchor exists (Major Char B).
          *   Step 2: Split Point. Show A vs Show B branch.
          *   Step 3: Uniqueness. Minor Char A exists in Show A. Major Char B exists in Show B.
          *   *The Problem:* The pitch says Minor A *is* the counterpart of Major B in this branch.
          *   *Step 3 Check:* In the Prime Timeline, Minor A and Major B are *different people*. In the Branch, they are the *same person*.
          *   *Identity Conflict:* If we say Branch-Minor-A *is* Major-B, we are collapsing two Prime identities into one Branch identity.
          *   *Step 4:* Does the story work if they aren't the same?
          *   *User Goal:* I want this to be a "No, not the same character."
          *   *Reasoning:* You cannot claim Branch-Minor-A *is* Prime-Major-B because Prime-Major-B has a history that Prime-Minor-A does not share. The divergence is too deep (entire life history). They are Counterparts, not Continuants. Marketing cannot claim "It's Major B!" without lying.

  7.  **Refining the Procedure for the "No" on Pitch 3:**
      *   I need a step that specifically addresses *Convergence vs. Divergence*.
      *   Counterpart theory says similarity determines the relation. But for *Identity Claims* (Marketing), we need *Causal Continuity*.
      *   If two Prime characters merge into one Branch character, that Branch character is a counterpart to *both*.
      *   Rule: A Branch Character can only claim the Identity of *one* Prime Character if the causal chain is unique. If it merges two chains, it's a Composite/Variant.
      *   This kills Pitch 3's claim to be "Major Character B."

  8.  **Finalizing the Limitations Section:**
      *   Audience acceptance (Suspension of Disbelief).
      *   "Licensed by Canon" vs. "Metaphysical Identity."
      *   The "Story Meaning" escape hatch.

  9.  **Tone Check:**
      *   Professional, direct, slightly weary (empathizing with the editor), no jargon ("de re", "modal realism"), but philosophically sound under the hood.
      *   Must explicitly mention where the Friend's theory is being used (context, non-transitivity).

  10. **Review against constraints:**
      *   20 mins/pitch? Yes, checklist style.
      *   No jargon? Yes.
      *   Handles specific cases? Yes.
      *   One "No"? Yes (Pitch 3).
      *   Limitations stated? Yes.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in the "Dead Doctor" pitch. If the Doctor dies in Ep 4, and the branch is a "What if he lived," the branch point must be *before* Ep 4. If so, he is a Continuant. If the pitch is "Ghost Doctor" or "Clone," that's different. I will assume the pitch implies a standard "What if he didn't die" scenario. That makes him a Continuant (Same Character). Pitch 2 (Son) is a New Character (cannot be "Same Character" because he doesn't exist in Prime). Pitch 3 (Crossover) is the Identity Collapse. That's the strongest "No."

      *Wait, Pitch 2:* Marketing wants to bill it as "Our Hero's Son." If the Hero is a counterpart, is it *his* son? Yes, causally. But is it the *same* son? There is no same son. So the claim "Our Hero's Son" is possessive, not identical. That passes.
      *Pitch 3:* Claiming Minor A *is* Major B. That is an identity claim. That fails the Uniqueness/Causal test.

      *Let's sharpen the "Human Escalation" points.* The procedure should stop and say "Ask the Showrunner" when the metaphysics is clear but the *marketing risk* is the real variable.

      *Final Plan:*
      1. Introduction (Acknowledging the fight, setting the stage).
      2. The Protocol (4 Steps + Escalation).
      3. Application to the 3 Pitches.
      4. The Limitations (What this tool can't do).

      *Philosophical underpinning to hide in plain sight:*
      *   Step 1 = Causal Connection (Kripke-ish).
