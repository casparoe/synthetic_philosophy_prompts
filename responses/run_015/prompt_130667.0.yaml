answer: |-
  # The Moral Engine Diagnostic
  **By [Your Name], Ethics & School Life Column**

  We talk a lot about "doing the right thing," but we rarely talk about the engine that drives it. When you hesitate before cheating, or flush after a rude comment, what is actually happening? Is it guilt? Shame? Something else? Most articles define these words and tell you which one is healthier. This quiz does not do that. It maps the logical structure of your reactions to see which moral framework you are implicitly running on.

  There are no right answers. There are only consistent ones. Answer based on your immediate instinct, not on how you wish you would react.

  ### The Cases

  **1. The False Flag**
  A plagiarism checker flags a sentence you wrote yourself. The teacher clears you, saying it's a glitch. You know you did nothing wrong, but you still feel oddly sullied for the rest of the day.
  *   **A.** The feeling is irrational noise; it should be ignored immediately.
  *   **B.** The feeling reveals that reputation matters more than truth.
  *   **C.** The feeling is valid; being suspected changes your status even if you are innocent.

  **2. The Accent**
  At a school assembly, you feel a flash of shame because your father's accent sounds different from the other parents. Later, you feel ashamed that you felt that way.
  *   **A.** The second shame proves you have a conscience; the first was a reflex.
  *   **B.** Both are useless emotions; you should focus on loving your father.
  *   **C.** The first shame is about social standing; the second is about moral character.

  **3. The Uninvited Classmate**
  You feel a steady, low-grade guilt about a classmate you were under no obligation to invite to a party and to whom you have done nothing objectively wrong.
  *   **A.** Guilt requires a broken rule; if you broke none, this is anxiety, not guilt.
  *   **B.** Guilt signals a failure of kindness, even when no duty was owed.
  *   **C.** This is actually shame; you are worried about how you look to others.

  **4. The Corridor Camera**
  You behave well in a specific corridor only because there is a camera at the end of it. You cannot tell from the inside whether that is shame, prudence, or something with no name yet.
  *   **A.** If there is no internal feeling, it is prudence, not morality.
  *   **B.** Behavior is what counts; the internal label is irrelevant.
  *   **C.** It is shame, because shame requires an audience, even a digital one.

  **5. The Family Scandal**
  Your sibling gets caught stealing from a store in a different town where no one knows your family.
  *   **A.** You feel responsible only if you helped or knew about it.
  *   **B.** You feel a stain on the family name that touches you too.
  *   **C.** You feel bad for them, but you do not feel implicated yourself.

  **6. The Secret Donation**
  You donate a significant amount of money anonymously. No one will ever know.
  *   **A.** You feel pride only if you acknowledge the good act to yourself.
  *   **B.** You feel no moral emotion; morality is about the act, not the feeling.
  *   **C.** You feel a quiet integrity that is distinct from pride or shame.

  **7. The Apology**
  You hurt a friend. You apologize.
  *   **A.** The goal is to fix the specific harm done (the act).
  *   **B.** The goal is to show you are not the kind of person who does that (the self).
  *   **C.** The goal is to restore the relationship, regardless of fault or character.

  **8. The Forgotten Transgression**
  You did something wrong years ago, forgot about it completely, and never acted on it since.
  *   **A.** If you never felt it, it wasn't guilt; guilt requires consciousness.
  *   **B.** You were still guilty the whole time; the feeling is just a symptom.
  *   **C.** The past act defines you now, regardless of your current memory.

  ***

  ### Scoring Key: Locating Your Position

  Do not sum your points. Instead, look at the **pattern** of your answers to find which **Leaf** of the moral tree you occupy.

  **The Act/Fault Axis (Questions 1, 3, 5)**
  *   Mostly **A** answers here suggest you believe moral emotion requires **Fault**. You cannot feel guilt/shame without a broken rule.
  *   Mostly **C** answers suggest you believe moral emotion tracks **Status**. You can feel "sullied" by mere suspicion or association.

  **The Audience Axis (Questions 2, 4, 6)**
  *   Mostly **A** answers suggest you believe morality is **Internal**. If no one sees it (even you), it doesn't count.
  *   Mostly **C** answers suggest you believe morality is **Relational**. It requires a witness (real or imagined) to exist.

  **The Target Axis (Questions 2, 7, 8)**
  *   Mostly **A** answers suggest the target is the **Act**.
  *   Mostly **B** answers suggest the target is the **Self/Character**.

  **Match your pattern to the Leaves below.**

  ***

  ### The Results: Six Occupied Leaves

  **1. The Act-Purist (Guilt Superior)**
  *   **Pattern:** Fault + Internal + Act.
  *   **View:** Guilt is the more moral emotion because it keeps the specific act in view, allowing for repair without destroying the person.
  *   **Least Comfortable Commitment:** You must admit that a person who feels no guilt after a crime (a psychopath) is not necessarily "bad," just broken, because they lack the mechanism, not the will.

  **2. The Character-Holist (Shame Superior)**
  *   **Pattern:** Status + Relational + Self.
  *   **View:** Shame is the more moral emotion because it reaches the whole character rather than one transaction, preventing future errors rather than just fixing past ones.
  *   **Least Comfortable Commitment:** You must accept that innocent people can be rightly "shamed" if their association with a group threatens the social fabric, regardless of individual fault.

  **3. The Single-Engine (Same Mechanism)**
  *   **Pattern:** Mixed answers on Act/Self, but consistent on Intensity.
  *   **View:** Guilt and shame are the same mechanism with different triggers; they differ only in what sets them off (private conscience vs. public exposure), not in moral quality.
  *   **Least Comfortable Commitment:** You have to treat the distinction between "I did bad" and "I am bad" as a linguistic accident rather than a psychological reality.

  **4. The Clean-Slate (Both Defective)**
  *   **Pattern:** Rejection of Fault and Status (Mostly B on Q1, Q3).
  *   **View:** Both guilt and shame are defective and should be replaced by something like remorse or agent-regret, which focus on the outcome rather than the blame.
  *   **Least Comfortable Commitment:** You must argue that a student who cheats and feels nothing is preferable to one who cheats and feels terrible, provided they both fix the grade.

  **5. The Map-Maker (Social Construct)**
  *   **Pattern:** Inconsistent answers that vary by context (e.g., A on Q1, C on Q5).
  *   **View:** These emotions are socially constructed and not comparable across cultures; what looks like guilt in one room is shame in another.
  *   **Least Comfortable Commitment:** You cannot claim your school's ethical system is "better" than another's, only that it is different, because the emotions enforcing it are not universal.

  **6. The Warden (Guilt/Shame Cultures)**
  *   **Pattern:** Focus on Sanctions (Q4, Q5).
  *   **View:** This is the older anthropological contrast, placed here as a claim about which sanctions a society enforces (legal vs. ostracization) rather than about what anyone feels.
  *   **Least Comfortable Commitment:** You must treat individual feelings as irrelevant data; only the external punishment structure determines whether a culture is "guilt" or "shame" based.

  ***

  ### The Empty Leaves (Logical Possibilities)

  **7. The Private Shamer**
  *   **Logic:** Shame that requires no audience, not even an imagined one.
  *   **Status:** **Incoherent.** Shame is defined by exposure; without a witness (real or internal), the concept collapses into guilt.

  **8. The Character Guilter**
  *   **Logic:** Guilt that attaches to who you *are* rather than what you *did*, without becoming shame.
  *   **Status:** **Untried.** Philosophers avoid this because it functions exactly like shame but lacks the vocabulary to explain why it isn't shame.

  ***

  ### The Choice Problem: Can You Pick Your Engine?

  Your classmates argue about whether you can choose your emotions. The taxonomy above implies different answers depending on which Leaf you occupy. Here is how each position handles the question of **Choice** across three scales.

  | Position | Individual Choice (Can I cultivate this?) | School Policy (Can we design for this?) | Cultural Shift (Can we change over generations?) |
  | :--- | :--- | :--- | :--- |
  | **1. Act-Purist** | **Yes.** You can train yourself to focus on acts rather than identity. | **Yes.** Rules and detentions target specific acts. | **Yes.** Enlightenment spreads rational guilt over irrational shame. |
  | **2. Character-Holist** | **No.** Character is deep; you cannot choose it directly, only habituate it. | **Maybe.** Honor codes shape culture, but cannot force character. | **No.** Culture grows organically; it cannot be engineered. |
  | **3. Single-Engine** | **Ill-Posed.** You aren't choosing an emotion, only the trigger environment. | **Yes.** Change the triggers (privacy vs. publicity) to change the output. | **Yes.** As social structures change, the emotion follows. |
  | **4. Clean-Slate** | **Yes.** You can choose to abandon the emotion entirely for regret. | **Yes.** Restorative circles replace punishment with outcome-repair. | **Yes.** Moral progress involves leaving these emotions behind. |
  | **5. Map-Maker** | **No.** You cannot choose outside your linguistic and cultural framework. | **No.** The school is already embedded in a construct it cannot see. | **No.** Shifts happen, but they are translations, not choices. |
  | **6. The Warden** | **No.** Feelings are byproducts of enforcement, not choices. | **Yes.** Change the sanctions (cameras vs. honors) and you change the group. | **Yes.** Political will can shift a society from legal to social sanctions. |

  **The Implication**
  If you landed on **Leaf 1, 4, or 6**, you believe a school can deliberately design an ethical environment (e.g., choosing restorative justice over detention). If you landed on **Leaf 2 or 5**, you believe the school is mostly riding a wave it cannot steer, and that trying to "engineer" students is either impossible or arrogant. If you landed on **Leaf 3**, you believe the debate is a distraction: change the room, and you change the person.

  **Final Note:**
  If you found yourself wanting to answer "It depends" to every question, you may not be indecisive. You may be operating on a system this quiz was not built to measure. That is a valid result. It means the map is not the territory.
