answer: |-
  Here is the **ITN+SF+CES Protocol** (Importance, Tractability, Neglectedness + Scaling Fragility + Counterfactual Ecosystem Shift). It is designed for high-velocity review (2 hours/proposal) with explicit off-ramps for subjective values.

  ### The Decision Procedure (Flowchart in Words)

  **Gate 0: Sanity & Legality (Hard Filter)**
  *   **Question:** Is this legal, and is the applicant who they say they are?
  *   **Pass:** Yes.
  *   **Fail:** **HARD NO.** (Do not pass Go. Do not collect data.)
  *   **Time Cost:** 15 mins.

  **Gate 1: The $15k Tractability Check**
  *   **Question:** Can this specific amount of money ($8k–$15k range) causally move the needle, or is it a drop in the bucket?
  *   **Pass:** The money buys a specific milestone (e.g., "rent the hall," "print the flyers," "buy the nets").
  *   **Fail:** The money is "seed funding" for something that requires millions to work (e.g., "phase 1 of drug development").
  *   **Time Cost:** 30 mins.
  *   **Note:** This is where most "visionary" projects die. Be ruthless.

  **Gate 2: Scaling Fragility (The 10x Test)**
  *   **Question:** If we gave this project 10x the budget next year, would impact scale linearly, or would the model collapse?
  *   **Pass:** Linear scaling (e.g., more nets = more protection) or step-function scaling (e.g., hit critical mass for policy change).
  *   **Fail:** **Fragile.** The value comes from scarcity, personal touch, or being a "pilot" that can't be standardized. If success depends on *this specific person* doing *this specific thing* without bureaucracy, it fails here.
  *   **Time Cost:** 30 mins.
  *   **Judgment Call:** You are guessing at their operations. You have no data.

  **Gate 3: Neglectedness & Competition**
  *   **Question:** If we don't fund this, will someone else?
  *   **Pass:** No obvious funders (gov, large EA funds) are touching this specific niche.
  *   **Fail:** This is crowding a crowded space (e.g., another AI safety newsletter).
  *   **Time Cost:** 30 mins.

  **Gate 4: Counterfactual Ecosystem Shift (The Donor Psychology Test)**
  *   **Question:** Does funding this make our specific donor pool *more* or *less* likely to donate next round?
  *   **Criteria A (Mental Space):** Does this project require *our* group's oversight, or could donors just do it themselves? If donors can do it alone, funding it here reduces the perceived value of the circle.
  *   **Criteria B (Vibe Check):** Does this feel like "real work" or "signal boosting"? If it feels like signal boosting, does that energize the group (community building) or cynicize them (burnout)?
  *   **Pass:** Funding this reinforces the need for the group (e.g., high-risk, requires collective due diligence, or builds community cohesion).
  *   **Fail:** Funding this makes the group redundant (e.g., generic charity) or risks reputational blowback that scares donors away.
  *   **Time Cost:** 45 mins.
  *   **Judgment Call:** This is pure speculation on donor psychology. It is the most subjective step.

  **Gate 5: The Handoff**
  *   **If Gates 0–4 are Passed:** **SEND TO VOTE.** This is now a values question. The math is done; the rest is preference.
  *   **If Any Gate is Failed:** **HARD NO.** Do not bring to vote unless you want to undermine the procedure.

  ---

  ### Application to Proposals

  #### 1. Gene-Drive Mosquito Pilot ($15k)
  *   **Gate 1 (Tractability):** **FAIL.** $15k is toy money for gene drives. You cannot get regulatory approval, community consent, or lab capacity for this. It buys a PowerPoint, not a pilot.
  *   **Gate 2 (Scaling Fragility):** **FAIL.** Even if they get results, scaling requires millions and government buy-in. The model collapses immediately at 10x.
  *   **Gate 4 (Ecosystem Shift):** **FAIL.** High reputational risk. If this goes wrong (e.g., public backlash against "mutant mosquitoes"), donors associate the circle with bio-hazard controversy. Mental space crowding: Donors spend the next quarter debating ethics rather than funding.
  *   **Verdict:** **HARD NO.**
  *   **Why:** It fails the "drop in the bucket" test. It's vanity funding.

  #### 2. Wild-Animal-Suffering Awareness ($8k)
  *   **Gate 1 (Tractability):** **PASS.** $8k buys flyers, park permits, and a part-time organizer for a quarter. The money moves the specific activity.
  *   **Gate 2 (Scaling Fragility):** **PASS/NEUTRAL.** Awareness has diminishing returns, but it doesn't "collapse." It just gets less efficient.
  *   **Gate 3 (Neglectedness):** **PASS.** Large EA funds rarely fund local urban park awareness for invertebrates/wildlife.
  *   **Gate 4 (Ecosystem Shift):** **PASS.** This is "weird" enough that donors can't do it individually. It requires the group to validate the cause. It keeps the "rationalist" identity alive (caring about weird, neglected suffering). It builds community cohesion.
  *   **Verdict:** **SEND TO VOTE.** (Likely Funded).
  *   **Why:** It fits the pool size and reinforces the group's unique identity.

  #### 3. Direct Cash to 200 Families ($12k)
  *   **Gate 1 (Tractability):** **PASS.** $12k definitely helps 200 families.
  *   **Gate 2 (Scaling Fragility):** **PASS.** Cash scales perfectly linearly.
  *   **Gate 3 (Neglectedness):** **FAIL (Soft).** Many orgs do this. But local coverage is "okay," so there is marginal room.
  *   **Gate 4 (Ecosystem Shift):** **FAIL.** This is the killer.
      *   *Mental Space:* Any donor in the circle could do this alone on their credit card. Funding this through the circle adds bureaucracy without adding value.
      *   *Donor Motivation:* If the circle becomes a "cash distribution hub," high-engagement donors may leave. They join to solve *hard* problems, not to be a pass-through for GiveDirectly-style work. It reduces the "specialness" of the pool.
  *   **Verdict:** **HARD NO.**
  *   **Why:** **This is the answer you'll hate.** It is objectively good in a vacuum, but it undermines the *mechanism* of the grant circle.

  ---

  ### The "Hated" Outcome & The Misfire

  **The Hated Answer:** Rejecting the **Direct Cash**.
  You know the cash helps. You know it's low-risk. But the procedure rejects it because it makes the *grant circle* redundant. You are prioritizing the survival of your decision-making body over the immediate utility of the dollars. This feels meta-self-indulgent, but it is logically consistent with maintaining a high-agency donor pool.

  **Where The Procedure Will Misfire (Honest Audit)**

  1.  **The "Ecosystem Shift" is a Hallucination:** I have no data on donor psychology. I am guessing that cash bores donors and WAS excites them. I might be wrong. Donors might see the Cash as "finally something real" and leave because of the WAS funding. Gate 4 is judgment calls with numbers taped on.
  2.  **Scaling Fragility Punishes Innovation:** Gate 2 filters out "pilot" projects that *need* to be fragile to start. Amazon was fragile at $15k. By demanding linear scaling early, you bias toward boring, established interventions (like cash) but then Gate 4 kills those. You risk creating a loop where you only fund "community building" events because they are the only things that fit the budget and ego constraints.
  3.  **The 2-Hour Lie:** You cannot properly assess "Scaling Fragility" or "Ecosystem Shift" in 45 minutes. You will rely on heuristics like "Does this sound professional?" which biases toward applicants who speak your language (rationalist jargon) rather than those doing the actual work. You are optimizing for *grant legibility*, not *impact*.

  **Final Advice:** Use the procedure to kill the obvious mismatches (Gene Drive). For the Cash vs. WAS tension, admit to the group that Gate 4 is subjective. Let them vote on whether "maintaining the circle's identity" is worth more than "direct utility." That is the only honest place for the values vote.
