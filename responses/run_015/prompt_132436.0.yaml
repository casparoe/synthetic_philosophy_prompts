          *   *Assessment:* This is a standard defense of RC against deliberative overload. However, the claim that rule selection is a "one-time theoretical exercise" is slightly simplistic. Rule-consequentialists often argue rules are selected based on general acceptance costs, but agents still need to know *which* rules apply in complex situations. Still, broadly acceptable as a standard RC move.
      *   **Paragraph 3 (Structural/Transaction & Williams):** Agrees structural/transactional costs remain untouched. Claims Williams's integrity objection is "essentially the same structural-demandingness complaint." Claims RC embeds calculus in automated habits, deepening alienation (citing Railton). Concludes the original claim is right about AC, wrong to treat deliberative as central (it's weakest), and structural alienation is exacerbated by rule-following.
          *   *Assessment:* Here lie the potential errors.
              *   *Williams vs. Structural Demandingness:* Williams's integrity objection is distinct from simple demandingness. Demandingness says "you must give too much." Williams says "you must give up *who you are* (ground projects) even if it doesn't maximize utility in every case, because the theory makes you a channel for utility." Conflating integrity with structural demandingness is a common but significant philosophical error. Structural demandingness is about *how much* is demanded; integrity is about *what kind of agency* is required.
