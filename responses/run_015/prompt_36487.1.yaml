  # JOINT STATEMENT ON RESPONSIBILITY, DESERT, AND JUSTICE

  **Signatories:** The Compatibilist Signatory (D) and The Skeptic Signatory (C)
  **Date:** October 26, 2023
  **Subject:** Findings of Adversarial Collaboration on Basic Desert

  Following a period of structured dialogue and adversarial collaboration, we submit this joint statement regarding the metaphysics of agency, the ethics of punishment, and the future of responsibility practices. While we remain divided on core theoretical questions, we have identified significant common ground regarding the flaws of current systems and the constraints of metaphysics.

  ### I. AGREED CLAIMS

  We jointly affirm the following propositions as the baseline for our continued discourse and policy recommendations:

  1.  **Predictability and Explanation:** We agree that the truth of determinism, or the epistemic stand-ins of constitutive luck and early environmental luck, does not by itself render the prediction or explanation of human behavior impossible. Scientific inquiry into the causes of action remains valid and necessary regardless of the status of free will.
  2.  **Ultimate Sourcehood:** We agree that no human being is an *uncaused cause* of themselves. The traditional metaphysical condition of "ultimate sourcehood"—the requirement that an agent be the original, uncaused originator of their own character and choices—cannot be met by anyone.
  3.  **The Costs of Retribution:** We agree that retributive attitudes carry significant psychological and social costs, and that specific practices of blame, when driven by pure vengeance, are corrosive to community trust and individual well-being.
  4.  **Justice Reform:** We agree that the criminal justice systems of most actual states are harsher than either of our views would license. Both of us advocate for substantial reduction in punitive severity, regardless of the theoretical justification for punishment.

  ### II. RECORD OF DISAGREEMENTS

  We remain divided on the interpretation of responsibility practices and the normative implications of our metaphysical agreement. The table below records our divergent positions.

  | Topic | The Compatibilist Signatory (D) | The Skeptic Signatory (C) |
  | :--- | :--- | :--- |
  | **1. The Status of Desert** | The notion of desert I retain is a genuine, functional form of basic desert, necessary to sustain the interpersonal relationships and normative expectations that constitute a society. | The notion of desert you retain is not basic desert but a renamed forward-looking entitlement; it is utility disguised as merit to preserve the *feeling* of retribution. |
  | **2. Ordinary Practice** | "Basic desert" is a real presupposition of ordinary responsibility talk; if you remove it, the practice loses its point and ordinary people will rightly feel something essential has been lost. | "Basic desert" is largely a philosopher's invention; ordinary responsibility talk can survive without it by pivoting to moral education and safety, once the metaphysical error is corrected. |
  | **3. Human Significance** | Giving up basic desert "diminishes" people; it degrades our genuine sense of authorship, achievement, and love by rendering our efforts causally equivalent to natural disasters. | Giving up basic desert "liberates" people; it frees us from the burden of unfair blame and allows us to view offenders with compassion rather than moral hatred. |
  | **4. Proportionality** | Proportionality to the offense is required because punishment must communicate the specific moral weight of the wrong; without desert, proportionality loses its anchor. | Proportionality on a quarantine model is difficult to justify; if it is retained, it is likely covert desert-talk, as safety should dictate duration, not past gravity. |
  | **5. Semantic Divergence** | **We both affirm:** "We hold agents **accountable** for their conduct."<br>**D means:** Liable to blame and sanction because they *earned* it via their choices.<br>**C means:** Liable to intervention and adjustment because they *pose* a risk or need guidance.<br>**Key Term:** *Accountable* |

  ### III. THE CRUXES

  We identify three specific issues where further empirical or conceptual work could shift our positions. We record our current stances and predictions below.

  **Crux 1: The Two-Luck Distinction**
  *The Question:* Does constitutive luck (the luck of being the kind of person you are) differ in kind or only in degree from resultant luck (the luck of how things turn out)? Can a responsibility-preserving difference be drawn without appealing to the very sourcehood condition we both reject?
  *   **Bearing:** We accept that empirical psychology regarding how people attribute luck in controlled scenarios bears on this.
  *   **Predictions:**
      *   **(D)** predicts that a line *can* be drawn based on reasons-responsiveness. If studies show people consistently distinguish between "who I am" and "what I did" in ways that track control, I will maintain that compatibilist control is sufficient.
      *   **(C)** predicts that the distinction is illusory. If studies show that constitutive luck undermines the sense of ownership just as much as resultant luck, I will maintain that the compatibilist line is arbitrary.

  **Crux 2: The Reverse-Lottery Case**
  *The Scenario:* A jurisdiction sentences convicted offenders to severity levels determined by a weighted lottery keyed *entirely* to predicted deterrent effect, independent of the seriousness of the offense. A minor thief might receive a life sentence if data suggests it maximally deters others; a violent offender might go free if detention yields no deterrent value.
  *   **Shared Reaction:** We both reject this scheme.
  *   **Source of Rejection:**
      *   **(D)** admits this rejection flows directly from my theory: proportionality is a desert-constraint. To punish beyond the offense is to use the person merely as a means.
      *   **(C)** admits this rejection flows partly from a residual desert intuition my theory officially disowns. Strictly speaking, the quarantine model should allow indefinite detention if safety requires it. My rejection relies on "rights" that may be covert desert-claims.
  *   **Ten-Year Prediction:** Were this scheme empirically shown to reduce crime by 50%:
      *   **(D)** predicts I will still oppose it as fundamentally unjust, regardless of efficacy.
      *   **(C)** predicts I would support it *if* robust procedural rights were added, acknowledging that my "rights" constraint is a pragmatic compromise, not a metaphysical absolute.

  **Crux 3: The Fittingness Question**
  *The Question:* Can an emotion like resentment or gratitude be *fitting* to its object—appropriate in the way fear is fitting toward danger—even if it licenses no harsh treatment?
  *   **Bearing:** We accept that the philosophy of emotion and normative ethics bears on this.
  *   **Positions:**
      *   **(D)** claims this position belongs to the **Compatibilist's camp**. Fittingness implies the object *merits* the response. If resentment is fitting, a form of desert is real.
      *   **(C)** claims this position **dissolves the dispute between them**. If "fittingness" licenses no harsh treatment and makes no metaphysical claim about sourcehood, then it is merely a description of social ecology, not a defense of basic desert.

  ### IV. CLOSING REFLECTIONS

  **On Substance vs. Verbal Dispute**
  We record that parts of our disagreement are **verbal**, specifically regarding the definition of "free will" and "desert." When D speaks of "free will," C hears "metaphysical magic," and when C speaks of "elimination," D hears "social engineering." However, we record that the disagreement regarding **punitive severity** and **the moral permissibility of using persons as deterrents** is **substantive**. We genuinely differ on whether a person can be harmed for the sake of social utility without violating a moral boundary grounded in their past agency.

  **Unexpected Concessions**
  *   **(D) Concedes:** I did not expect to concede how difficult it is to define "basic desert" without smuggling in consequentialist justifications. I acknowledge that my view relies more on the *utility* of the practice than I previously admitted, blurring the line between my view and C's forward-looking model.
  *   **(C) Concedes:** I did not expect to concede that eliminativism carries higher social risks than I estimated. I acknowledge that dismantling the language of desert may undermine the very social cohesion required to implement the public health model, suggesting a pragmatic need to retain some "as-if" desert talk longer than I intended.

  **Signed,**

  _________________________
  The Compatibilist Signatory

  _________________________
  The Skeptic Signatory
