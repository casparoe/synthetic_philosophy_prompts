answer: |-
  Here is a draft structured as you requested. I have begun with a brief section outlining how we might sharpen the research question, as this is often the most critical part of a successful application. Following that, I have set out the formal proposal text, written in British English and tailored for a funding committee familiar with normative ethics.

  ***

  ### Part 1: Sharpening the Research Question

  Before settling on the final formulation, it is worth considering three ways we might frame the core problem. Each has different implications for the scope of the article.

  **Option 1: The Temporal Focus (Iteration)**
  *Question:* Does the repetition of a putatively supererogatory act generate a duty to perform it in the future?
  *Pros:* This is a tight, puzzle-driven question. It engages directly with the logic of obligation and expectation.
  *Cons:* It risks collapsing into a discussion of moral character or virtue ethics (habituation) rather than remaining a structural critique of supererogation. It might also feel too narrow, missing the broader methodological point about background conditions.

  **Option 2: The Social Focus (Distribution)**
  *Question:* Does collective non-compliance shift the deontic status of individual cooperative acts from duty to supererogation?
  *Pros:* This connects powerfully with literature on fairness and non-ideal theory. It has clear political implications.
  *Cons:* It is a crowded field. Distinguishing this from standard discussions of "fair play" or "complicity" requires careful boundary work. It might drift away from the specific mechanics of the two-condition account of supererogation.

  **Option 3: The Structural Focus (The Fixed Background Assumption)**
  *Question:* To what extent does the 'Fixed Background Assumption' in standard case-testing undermine the stability of the two-condition account of supererogation?
  *Pros:* This captures both Iteration and Distribution as instances of a single methodological error. It argues that the standard account treats background conditions (past behaviour, others' behaviour) as constant when they are actually variables that shift deontic status. This is more fundamental and likely to interest a broader range of ethicists.
  *Cons:* It is more abstract. It requires careful exposition to ensure it doesn't sound like a trivial claim that 'context matters'.

  **Recommendation:**
  I strongly advise adopting **Option 3**. Iteration and Distribution are best understood not as two separate puzzles, but as two vectors of the same problem: the standard account assumes a *ceteris paribus* clause that cannot hold. By framing the project as a critique of the *methodology* used to identify supererogation (the 'snapshot' approach), you make a contribution to meta-ethics and normative methodology, rather than just offering counter-examples. This makes the project sufficiently substantial for a research leave but narrow enough to be manageable.

  ***

  ### Part 2: Research Proposal

  **Project Title:** Beyond the Snapshot: The Fixed Background Assumption in the Theory of Supererogation

  **1. The Research Question**
  Standard accounts of supererogation rely on a two-condition analysis: an act is supererogatory if and only if it is permissible to omit it, and it is praiseworthy or meritorious to perform it. To test this, philosophers typically employ 'snapshot' cases: one-off acts by a single agent where the behaviour of all other agents and the agent's own history are held fixed.

  This project asks: **Does the reliance on a 'Fixed Background Assumption' render the two-condition account extensionally unstable?**

  Specifically, I will argue that when we vary the background conditions—either temporally (through iteration) or socially (through distribution)—the deontic status of the act shifts in ways the standard account cannot explain without contradiction. The project seeks to determine whether supererogation is a stable deontic category, or whether it is essentially indexical, dependent on variable facts about agent history and collective compliance.

  **2. The Gap in the Literature**
  While the two-condition account is the orthodoxy in contemporary normative ethics, it suffers from a methodological blind spot. Existing literature treats the conditions (permissibility of omission and praiseworthiness of performance) as intrinsic properties of the act-type in a given circumstance. However, 'circumstance' is typically construed narrowly.

  Current discussions fail to account for the dynamic nature of moral expectation. In the case of **Iteration**, the literature does not adequately address whether establishing a capacity to perform an act alters the permissibility of omitting it in future instances. In the case of **Distribution**, while there is work on fairness and non-ideal theory, there is little analysis of how collective non-compliance specifically alters the *supererogatory* status of individual acts, rather than simply their cost or difficulty. By treating these as isolated puzzles, the literature misses the underlying structural flaw: the assumption that the background against which we judge an act is morally inert. This project will demonstrate that the background is normatively active, and ignoring this leads to incorrect classifications of duty and supererogation.

  **3. Method and Plan of Work (Three Months)**
  The objective is to transform a seminar paper into a submission-ready article of approximately 8,000 to 10,000 words. The work will proceed in three phases:

  *Month 1: Reconstruction and Critique*
  I will begin by formally reconstructing the standard two-condition account to identify exactly where the 'Fixed Background Assumption' is operationalised. I will then develop the Iteration and Distribution cases not merely as counter-examples, but as stress tests for the stability of the 'permissible to omit' condition. The key argumentative move here is to show that the standard account yields contradictory verdicts when the same act is evaluated across different temporal or social backgrounds.

  *Month 2: Developing the Positive Account*
  Having established the instability, I will explore three potential modifications to save the category of supererogation.
  1.  **The Stability Condition:** Adding a third condition requiring the status to remain constant across reasonable variations in background.
  2.  **The Indexical View:** Accepting that supererogation is relative to an agent's history and social context.
  3.  **The Eliminativist View:** Arguing that the category dissolves under dynamic scrutiny.
  I will weigh these options against theoretical cost and intuitive fit. The aim is not necessarily to solve the problem definitively, but to map the logical space and argue for the most plausible revision (likely the Indexical View).

  *Month 3: Drafting and Refinement*
  The final month will be dedicated to writing and rigorous editing. I will focus on tightening the argument to ensure the distinction between 'cost' and 'deontic status' remains clear, particularly regarding the Distribution case. I will also anticipate objections regarding the conflation of moral expectation with moral obligation, ensuring the distinction is robustly defended.

  **4. Possible Conclusions**
  The research will likely lead to one of three conclusions:
  1.  **Revisionism:** The two-condition account is salvageable but requires a 'stability clause' that limits the scope of supererogation to acts that remain optional even upon repetition or social isolation.
  2.  **Contextualism:** Supererogation is not a fixed property of acts but is indexical to the agent's moral track record and the compliance of others. This would require a significant shift in how we apply the concept.
  3.  **Scepticism:** The category of supererogation is too fragile to bear the weight placed upon it, suggesting we should dissolve the distinction in favour of a scalar conception of morality.

  The decision between these will turn on which view best preserves our core intuitions about moral praise without collapsing the distinction between duty and beyond-duty.

  **5. Success Criteria**
  A successful outcome will be a completed manuscript that establishes the 'Fixed Background Assumption' as a genuine methodological problem in normative ethics. Success does not require a final resolution to the iteration or distribution puzzles, but rather a clear demonstration that the standard account is incomplete without addressing them. The article should be suitable for submission to a top-tier general ethics journal.

  **6. Risk Assessment and Feasibility**
  **Is this too big for three months?**
  There is a genuine risk that the project could expand into a broader inquiry into non-ideal theory or virtue ethics. To mitigate this, I will strictly constrain the discussion to the *deontic status* of the acts, avoiding deep dives into the metaphysics of obligation or the psychology of praise.

  **Failure Conditions:**
  The project would fail if:
  1.  It becomes clear that Iteration and Distribution are disanalogous problems requiring separate treatments, doubling the workload. (Mitigation: I will prioritise the structural link between them; if the link breaks, I will focus solely on Iteration as the cleaner case).
  2.  The 'Indexical View' collapses into a trivial claim that 'context matters'. (Mitigation: I will focus on formalising how the context shifts the deontic boundary, ensuring the claim is substantive).
  3.  I am unable to complete a full draft. (Mitigation: The three-month timeline is aggressive. If necessary, I will aim for a shorter 'discussion note' rather than a full article, though the goal remains a standard article).

  Overall, the project is feasible because it builds directly on existing seminar work. The core arguments are identified; the leave is required to rigorise the definitions and manage the complex dialectic required for publication.
