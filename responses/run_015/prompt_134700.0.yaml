  *(Self-Correction on Reading 2)*: Reading 2 (Implicit Exception Clauses) actually makes the ethical *not* universal. Kierkegaard defines the ethical *as* the universal. So this reading is technically incoherent within the book's definitions. I should note that.

  *(Self-Correction on Reading 5)*: This is the "Commenter's Reading." I need to be firm that this turns Abraham into a utilitarian hero, which de Silentio explicitly argues against (the tragic hero vs. the knight of faith).

