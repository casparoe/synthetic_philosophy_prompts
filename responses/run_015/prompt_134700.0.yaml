      *   *Check:* The user asked about "temporary bracketing" vs "categorical exclusion." I need to be precise here. It's a *suspension*, meaning the ethical remains valid *for everyone else* and *for Abraham afterwards*, but is inapplicable *in this specific moment of trial*.

