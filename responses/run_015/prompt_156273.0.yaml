answer: |-
  Here is the gut-level intuition on the mess you're pointing at.

  ### 1. The Clash: Name-Tag vs. Job Description
  To feel the tension, you have to look at what the word is *doing*.

  **Kripke's View (The Name-Tag):**
  Imagine 'Gold' is a name-tag slapped onto a specific substance at the "baptism" (the initial discovery). We point at the shiny yellow metal and say, "This stuff is 'gold'." That tag sticks to *that specific microstructure* (atomic number 79) forever.
  *   **The Consequence:** If ancient alchemists called pyrite "gold," they were wrong. They weren't talking about gold; they were talking about pyrite. If we find a possible world where the shiny yellow metal is actually a different element, it *isn't gold* in that world. The term is **rigid**: it tracks the *stuff*, not the *properties*.

  **The Scientific Reality (The Job Description):**
  Science doesn't work like that. Think of the word 'Atom'.
  *   **1800s:** "Indivisible particle."
  *   **1920s:** "Nucleus + electrons" (which is divisible).
  *   If 'atom' were a Kripkean name-tag for "indivisible particle," then modern physics discovered that **atoms do not exist**.
  *   But scientists don't say "Atoms don't exist." They say "Our theory of atoms changed."
  *   **The Intuition:** The word 'atom' seems to track a **role** ("the fundamental building block of matter") rather than a specific structural tag. Whatever *plays that role* gets the name.

  ### 2. Is "Functional Rigidity" Actually Rigid?
  You asked if tracking a causal-functional role is still "rigid" in Kripke's sense.

  **The Gut Answer: No.** It is a disguised description.

  Kripkean rigidity means picking out the **same object** in every possible world.
  *   **Kripke:** 'Water' picks out H2O in World A, World B, and World C.
  *   **Functionalism:** 'Water' picks out "whatever quenches thirst and fills lakes."
      *   In World A (ours), that's H2O.
      *   In World B (Twin Earth), that's XYZ.

  If the term picks out H2O here but XYZ there, it is **not rigid**. It is a non-rigid designator. It functions exactly like a definite description: "The liquid that plays the water-role."

  Kripke argued that names aren't descriptions. If 'water' just *means* "the watery stuff," then descriptivism wins, and Kripke's whole revolution collapses back into Frege/Russell. Functional rigidity saves the history of science (by allowing reference to stay stable while theories change) but it does so by sacrificing Kripkean rigidity.

  ### 3. The Casualty: The Necessary A Posteriori
  This is where your specific worry hits home. Kripke's famous innovation was the **Necessary A Posteriori**.
  *   *Example:* "Water is H2O."
  *   *Necessary:* True in all possible worlds (because 'water' just *is* that stuff).
  *   *A Posteriori:* We needed chemistry to figure it out.

  If you switch to the **Functional View**, this category evaporates. It splits into two different things, neither of which is "Necessary A Posteriori."

  **Split 1: The Functional Definition (Necessary A Priori)**
  If 'Gene' *means* "the functional unit of heredity," then the statement "Genes are the functional units of heredity" is true by definition.
  *   **Status:** Necessary and **A Priori**. (You don't need a lab to know this; you just need to know how we use the word).

  **Split 2: The Structural Discovery (Contingent A Posteriori)**
  The statement "Genes are DNA sequences" becomes a discovery about what *happens* to fill that role in our world.
  *   **Status:** Contingent and **A Posteriori**.
  *   **Why Contingent?** Because in a different possible world (or even in a different part of biology, like RNA viruses), the "unit of heredity" role could be filled by something else. If 'gene' is defined by the *job*, then the *employee* (DNA) could have been different.

  **The Verdict:**
  If you adopt functional rigidity, you lose the "Necessary A Posteriori." You no longer have a necessary link between the *term* and the *underlying nature*. You only have a necessary link between the *term* and the *function*, and a contingent link between the *function* and the *nature*.

  ### 4. Why This Feels Like a "Mess"
  The mess comes from what you have to give up.

  1.  **If you stick with Kripke:** You have to say that when scientific theories change radically, scientists are often talking about nothing, or talking past each other. (e.g., "Dalton's atoms aren't real atoms.") This makes the history of science look like a series of errors rather than progress.
  2.  **If you go Functional:** You save the history of science (it's all progress on the same topic), but you lose the metaphysical punch of Kripke. You admit that "Water is H2O" isn't a necessary truth of the universe, but just a lucky accident of our world.

  ### Summary Intuition
  Think of it like the term "The President."
  *   **Kripke:** 'The President' is a name-tag for Donald Trump (in 2018). Even if he loses the election, in a modal sense, 'The President' refers to *him*. (This is obviously wrong for titles, which is why Kripke applies it to *names* of stuff).
  *   **Functional:** 'The President' refers to whoever holds the office.
      *   Is it rigid? No. In another world, it's Hillary.
      *   Is "The President is Donald Trump" necessary? No. It's contingent.
      *   Is "The President is the head of the executive branch" a priori? Yes.

  If you treat 'Gene' or 'Atom' like "The President" (functional), you explain theory change perfectly, but you turn "Genes are DNA" into a contingent fact (like "The President is Trump") rather than a necessary identity (like "Cicero is Tully").

  So, to answer your specific worry: **Yes, it messes up the Necessary A Posteriori.** It turns the link between term and nature into a contingent discovery, and the link between term and function into an a priori definition. You can't have it both ways.
