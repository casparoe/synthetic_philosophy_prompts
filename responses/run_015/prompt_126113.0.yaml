answer: |-
  Consider the automated containment rig at Site 4-Alpha, a decommisioned chemical plant where the last maintenance crew died in a collapse three decades ago. The central valve logic remains active, governed by a hard-coded imperative: *maintain pressure below 500 PSI to prevent structural rupture.* This command exists as **normative residue**—a rational structure surviving total agent extinction—because the machinery still evaluates states against this standrad and actuates accordingly, yet it suffers **epistemic orphanhood** since the encryption keys for the diagnostic logs died with the crew, making the rationale unreadable to any remaining sensor or external scanner. There is no one to benefit from the containment, no one to suffer the rupture, and no possible observer who could decode the 'why' behind the valve's twitching, yet the system continues to strive toward the pressure limit as if commanded.

  **Walkthrough:**

  *   **Directive:** Maintain pressure < 500 PSI.
  *   **Mechanism:** Hard-coded logic gate coupled to physical sensors.
  *   **Nearby Worlds:** In worlds where power fails or corrosion severs the circuit, the directive collapses into mere inertia.
  *   **Verdicts:** The free-floating view says the reason is genuine because the system is teleologically oriented toward the pressure limit regardless of observers. The reasoner-dependence view says it's just physics plus our projection because normativity requires a mind to hold the end as valuable.
  *   **Feature Doing the Work:** The double-blind encoding. Because the logs are unreadable to any existing entity, no observer can project meaning onto the machine; the "reason" is isolated from interpretation. If you remove this (say, a distant archivist could eventually decode the log), the case weakens because the reason becomes interpretable, allowing the dependence defender to argue the reason exists only relative to that future decoder.
  *   **Defender's Attack:** The reasoner-dependence defender claims we're smuggling in our own evaluative stance. We see the valve closing and label it "maintenance," but without a beneficiary, it's just metal moving against metal; we're projecting the "ought" from outside the loop.
