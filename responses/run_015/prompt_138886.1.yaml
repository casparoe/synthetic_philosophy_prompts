prompt: |-
  I work in digital preservation at a university library — me and three others, and we triage incoming collections in a weekly meeting, 30 to 40 items a session, so realistically each item gets about two minutes and a one-line justification that goes in the record. Our options per item are always the same three: keep a bit-exact image of the original (expensive, and storage is what we're always fighting about), normalise it to something like PDF/A or CSV and drop the original, or discard. We can't do everything, depositors are usually not contactable in ten years, and there's a data-protection clock on some of it, so discard is sometimes right even when we'd rather it wasn't. We also can't go look up format specs for every weird file — the checklist has to work at the level of "what does the outside of this thing tell you".

  I want to steal the frame / outer / inner message distinction from Hofstadter's chapter on the location of meaning — frame message being whatever says "this is a message, decode me", outer message being the instructions or key for how to decode it, inner message being the content once decoded, with the wrinkle that the outer can sometimes be reconstructed from the inner by a clever enough receiver — and turn it into a triage procedure we can run in two minutes on a folder we mostly can't open.

  Give me: the questions in order; what counts as a sufficient answer to each when we can't read the bytes; where it stops with "image everything", where with "normalise and discard the original", where with "discard outright"; and where it hands the decision back to a human because it's a values call about significance rather than a question about recoverability. Three things my team already argues about and that I want it to settle or at least name properly:

  - borrowed frames: cases where the thing that says "this is a message" isn't in the object at all but in its container — the labelled box, the folder name, the file extension, the depositor's email, the disk image it arrived on. Those don't survive the object being seperated from that context, and I think we systematically overestimate how much of our stuff is self-describing.
  - reconstruction bets: when we can't preserve the outer message (dead format, missing key, no documentation) we're really betting that some future receiver can rebuild it from the inner message plus conventions that outlive the carrier. I want the procedure to say when that bet is reasonable and when it's wishful, instead of us deciding by vibes every time.
  - phantom frames: files that look like they carry structure but are noise, padding, or bit-rot. We waste real hours on these and I'd like a cheap test that kills them early.

  Then run it on three things actually on our list: (1) a thousand-odd TIFF scans of handwriten nineteenth-century letters, no transcripts, filenames like IMG_0001.tif; (2) a deceased academic's laptop with a folder of PGP-encrypted files and no key anywhere we can find; (3) about 20,000 Word and Excel files from a government department that convert cleanly to PDF/A and CSV. I expect it to tell me to image (1) and (2) — I most want to see what it does with (3), because my instinct is definately to keep the originals and I suspect the procedure won't let me.

  Be honest about what the procedure can't do. In particular I can already see that it's about whether a message stays recoverable, not about whether it's worth keeping, and that the receiver's future cleverness is the one variable it can't pin down — say how that should show up in our one-line justifications rather than being silently assumed.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **User:** Digital preservationist at a university library (team of 4).
      *   **Context:** Weekly triage meeting, 30-40 items/session, ~2 minutes/item.
      *   **Constraints:** Storage is expensive/limited. Depositors often unreachable later. Data protection clocks exist. Can't open every file or read specs deeply. Needs a "one-line justification" for the record.
      *   **Core Task:** Adapt Hofstadter's Frame/Outer/Inner message distinction into a rapid triage procedure.
      *   **Specific Problems to Address:**
          *   *Borrowed Frames:* Context outside the object (folder names, extensions) that might get lost.
          *   *Reconstruction Bets:* Betting future tech can recover data without the original "outer message" (format specs, keys).
          *   *Phantom Frames:* Noise/corruption that looks like structure.
      *   **Decision Outcomes:** Image (bit-exact), Normalize (migrate & discard original), Discard.
      *   **Human Handoff:** When it's a values/significance call, not just recoverability.
      *   **Test Cases:**
          1.  1000 TIFFs of handwritten letters (IMG_0001.tif).
          2.  Deceased academic's laptop, PGP encrypted, no key.
          3.  20k Gov Word/Excel files (convert cleanly to PDF/A/CSV). *User expects to keep originals, suspects procedure won't allow it.*
      *   **Requirement:** Be honest about limitations (recoverability vs. worth, future cleverness variable).

  2.  **Deconstruct Hofstadter's Model for Preservation:**
      *   *Frame Message:* "I am a message." (Signal vs. Noise).
      *   *Outer Message:* "Here is how to decode me." (Format spec, software, key, context).
      *   *Inner Message:* The actual content (Text, image pixels, data values).
      *   *Adaptation:* In preservation, we are the *current receiver* deciding if a *future receiver* can do the job.
      *   *Triage Logic:*
          *   If Frame is missing/weak -> Discard (Phantom).
          *   If Outer is missing but Inner is robust/standard -> Normalize.
          *   If Outer is fragile/unique/essential to meaning -> Image.
          *   If Outer is missing and Inner is unrecoverable -> Discard (or Image as artifact).

  3.  **Drafting the Procedure (The "2-Minute Protocol"):**
      *   Needs to be fast. Questions must be answerable by looking at metadata, filenames, headers, not deep content analysis.
      *   *Step 1: Frame Check.* Is this definitely data? (Phantom filter).
      *   *Step 2: Outer Message Check.* Do we know how to read this *without* the specific original software/context? (Borrowed Frame filter).
      *   *Step 3: Reconstruction Bet.* If we lose the original format, can the Inner Message survive? (Reconstruction filter).
      *   *Step 4: Significance Handoff.* Is the *way* it's encoded part of the value?

  4.  **Refining the Decision Logic:**
      *   *Discard:* No Frame (Phantom) OR No Inner Message value (Empty/Corrupt) OR Legal/Privacy mandate.
      *   *Normalize:* Frame present, Outer is standard/well-documented, Inner survives migration. (Storage saving).
      *   *Image:* Frame present, Outer is fragile/unique, OR the "Borrowed Frame" is essential context that won't survive separation, OR the Reconstruction Bet is too high.
      *   *Human Review:* When the "value" of the Outer Message is unclear (e.g., is the macro part of the research?).

  5.  **Addressing the Specific "Worries":**
      *   *Borrowed Frames:* The procedure needs a specific check: "If I strip the folder path/extension/email, do I still know what this is?"
      *   *Reconstruction Bets:* Needs a "Commonality Test." Is the format proprietary/obscure vs. ISO/Industry Standard?
      *   *Phantom Frames:* Needs a "Entropy/Size Check." Does the file size match the claimed content?

  6.  **Developing the Test Cases:**
      *   *Case 1 (TIFFs):* Frame = Yes (TIFF header). Outer = Yes (TIFF spec). Inner = Images of letters. *Crucial:* The *content* is handwritten. OCR is a reconstruction bet. The *image* is the Inner Message. Migration to JPEG2000/PNG? TIFF is archival standard. But filenames (IMG_0001) are weak Borrowed Frames. Need to ensure ordering is preserved. Decision: Image (TIFF is already archival, normalization gains little, risk of losing metadata).
      *   *Case 2 (PGP):* Frame = Yes (PGP header). Outer = NO (Key missing). Inner = Garbage without key. *Reconstruction Bet:* Can future crypto break this? No. Decision: Image (as artifact of the academic's security practice) but mark as inaccessible. Or Discard if storage is critical and no hope. *Correction:* User expects "Image". Why? Because the *existence* of the encrypted file is the message, even if inner is locked. It's an artifact.
      *   *Case 3 (Gov Word/Excel):* Frame = Yes. Outer = Yes (OOXML). Inner = Text/Data. *Normalization:* PDF/A/CSV. *User's Instinct:* Keep originals. *Procedure's Logic:* If conversion is clean, Outer is standard, Inner survives -> Normalize. *Conflict:* This highlights the "Values Call." Is the *formula* part of the record? If yes, Image. If no, Normalize. The procedure should force the user to admit *why* they want to keep the .docx.

  7.  **Addressing the "One-Line Justification" & Future Cleverness:**
      *   The justification needs to capture the *risk*.
      *   Instead of "Saved for future," use "Betting on [X] standard survival."
      *   Acknowledge the "Future Receiver" variable.

  8.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is this actually doable in 2 minutes?
      *   *Fix:* Keep questions binary where possible. Use "Look at the header, not the content."
      *   *Critique:* Case 3 is the sticky one. The user wants to keep .docx. The procedure might say Normalize.
      *   *Fix:* The procedure must distinguish between "Informational Content" (Normalize) and "Evidential Content" (Image). If the *functionality* (macros, formulas) matters, Image. If just the text, Normalize. I need to make sure the procedure forces that distinction.
      *   *Hofstadter Nuance:* Ensure the distinction between Outer (how to decode) and Frame (I am a message) is clear. A corrupted file has a Frame (header says TIFF) but no Inner. A raw bitstream has no Frame.

  9.  **Final Polish:**
      *   Tone: Professional, peer-to-peer, acknowledging the grind of preservation work.
      *   Structure: Protocol -> Decision Tree -> Test Cases -> Limitations/Justifications.
      *   Ensure the "Borrowed Frame," "Reconstruction Bet," and "Phantom Frame" concepts are explicitly named in the steps.

  10. **Final check on Case 3:** The user says "I suspect the procedure won't let me [keep originals]." I need to be honest. If the procedure works, it *shouldn't* let them keep 20k originals *unless* they can articulate a value beyond "just in case." I will design the "Human Handoff" to catch this. If they can't name the value of the proprietary format, they must normalize. This validates their suspicion but gives them the language to fight it if they have a real reason (e.g., "formulas are evidence").

  11. **Drafting the Content:** (Mental outline of the response)
      *   Intro: Acknowledge the Hofstadter fit.
      *   The Protocol (4 Questions).
      *   Decision Matrix (Image/Normalize/Discard/Handoff).
      *   The Three Cases (Applied).
      *   The Limitations (The "Future Cleverness" variable).
      *   The One-Line Justification syntax.

  12. **Refining the "Phantom Frame" test:** How to do it in 2 mins? File size vs. expected size. Header entropy. If it says "Video" but is 2KB, it's a phantom.
  13. **Refining "Borrowed Frame":** Ask "If this file was found alone on a drive, would we know what it is?"
  14. **Refining "Reconstruction Bet":** Ask "Is the decoding logic proprietary and dead, or open and ubiquitous?"

  15. **Final Review against constraints:** 2 minutes? Yes. 3 options? Yes. One-line justification? Yes. Addresses the 3 specific arguments? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  This is a sharp adaptation of Hofstadter. In preservation, we are effectively acting as the *current receiver* making a bet on behalf of a *future receiver*. The "Frame" tells us it's data, the "Outer" tells us how to render it, and the "Inner" is what we actually care about.

  Here is the **Frame/Outer/Inner Triage Protocol (FOI-TP)** designed for a 2-minute window. It forces you to locate the meaning before you decide the storage cost.

  ### The Protocol (4 Questions, ~30 seconds each)

  **1. The Phantom Check (Frame Integrity)**
  *   **Question:** Does the file header match the extension/size, and does the size make sense for the claimed content?
  *   **Sufficient Answer:** Header bytes match signature (e.g., `%%PDF`); file size is non-zero and proportional to expected content (e.g., a 2KB "video" is a phantom).
  *   **Fail Condition:** Mismatched headers, zero-byte, or high entropy in a text container.
  *   **Action:** **Discard** (Log as "Phantom Frame/Corrupt").

  **2. The Borrowed Frame Check (Context Dependency)**
  *   **Question:** If this file were found in isolation (no folder path, no original filename, no depositor email), would we still know what it is and how it relates to its neighbours?
  *   **Sufficient Answer:** Metadata or internal structure contains sequencing, dates, or identifiers (e.g., embedded EXIF dates, internal document IDs).
  *   **Fail Condition:** Reliance on `IMG_0001`, folder names like "Scans 2010", or external logs to make sense of the sequence or identity.
  *   **Action:** If **Fail**, you must **Image** (to preserve the container context) OR **Normalize + Metadata Enrichment** (if you can embed the context now).

  **3. The Reconstruction Bet (Outer Message Durability)**
  *   **Question:** Is the logic required to decode the Inner Message proprietary/obscure, or is it an open/ubiquitous standard?
  *   **Sufficient Answer:** Format is ISO/Industry Standard (PDF/A, TIFF, CSV, UTF-8) with multiple independent readers.
  *   **Fail Condition:** Proprietary software, version-specific features, encrypted without key, or dead format.
  *   **Action:** If **Fail**, **Image** (preserve the Outer as an artifact) or **Discard** (if Inner is unrecoverable). If **Pass**, proceed to Q4.

  **4. The Inner Message Value (Significance Handoff)**
  *   **Question:** Is the *rendering* of the data the record, or is the *functionality/structure* part of the record?
  *   **Sufficient Answer:** We only need the human-readable content (text, image pixels).
  *   **Fail Condition:** We need to know *how* the result was calculated (macros, formulas, database schema, software behaviour).
  *   **Action:** If **Fail**, **Image**. If **Pass**, **Normalize**.

  ---

  ### Decision Matrix

  | Outcome | Condition | Justification Syntax |
  | :--- | :--- | :--- |
  | **Discard** | Phantom Frame OR Inner Message unrecoverable (no key) OR Legal Mandate. | "Phantom Frame" / "Inner Unrecoverable" / "DP Mandate" |
  | **Normalize** | Frame Intact + Outer Standard + Inner = Content Only. | "Outer Stable, Inner Extractable" |
  | **Image** | Borrowed Frame Critical OR Reconstruction Bet Too High OR Functionality Evidential. | "Context Fragile" / "Format Obsolete" / "Function Evidential" |
  | **Human Handoff** | Q4 is ambiguous (Is the formula evidence?). | "Values Call: Significance of Format" |

  ---

  ### Running the Test Cases

  #### Case 1: 1,000 TIFF scans of handwritten letters (IMG_0001.tif)
  *   **Q1 Phantom:** Headers match TIFF. Sizes reasonable for scans. **Pass.**
  *   **Q2 Borrowed Frame:** Filenames are `IMG_0001`. No internal metadata regarding letter date/author. If separated from the folder, sequence is lost. **Fail.**
  *   **Q3 Reconstruction:** TIFF is stable. **Pass.**
  *   **Q4 Inner Value:** Handwritten. The image *is* the text. No functionality. **Pass.**
  *   **Decision:** **Image.**
  *   **Why:** You fail Q2. The "message" includes the sequence and the context of the box they came in. Since you can't embed that context into the filenames reliably without human intervention (which you don't have time for), you must preserve the container (the disk image/folder structure) bit-exact to preserve the *Borrowed Frame*.
  *   **Justification:** "Context Fragile: Sequence relies on external ordering."

  #### Case 2: Deceased academic's PGP-encrypted files, no key
  *   **Q1 Phantom:** Headers match PGP/GPG. **Pass.**
  *   **Q2 Borrowed Frame:** Filenames might hint at content, but file is self-contained. **Pass.**
  *   **Q3 Reconstruction:** Key missing. Decoding logic exists, but input (key) is gone. Bet on future crypto-breaking is **Fail**.
  *   **Q4 Inner Value:** Unknown (locked).
  *   **Decision:** **Image.**
  *   **Why:** You fail Q3. However, you do not Discard. Why? Because the *existence* of the encrypted file is the Inner Message of the collection (evidence of security practice, sensitivity, or network). You are preserving the *Frame* and the *Outer* (the encryption method) as an artifact, acknowledging the Inner is currently lost.
  *   **Justification:** "Outer Obsolete: Encrypted artifact preserved as evidence of practice."

  #### Case 3: 20,000 Gov Word/Excel files (Clean convert to PDF/A/CSV)
  *   **Q1 Phantom:** Headers match OOXML. **Pass.**
  *   **Q2 Borrowed Frame:** Gov departments usually use internal IDs within doc properties. Assume **Pass** (verify spot check).
  *   **Q3 Reconstruction:** OOXML is ISO standard, but proprietary implementation risks exist. However, PDF/A/CSV are stricter standards. **Pass.**
  *   **Q4 Inner Value:** **STOP.** This is your values call.
      *   *Scenario A:* These are final reports. The text is the record. **Normalize.**
      *   *Scenario B:* These are budget spreadsheets. The *formulas* explain the decision making. **Image.**
  *   **Decision:** **Normalize** (Assuming Scenario A).
  *   **Why:** Your instinct is to keep the originals "just in case." This procedure forces you to admit that if the *functionality* (macros, version history, formulas) isn't evidential, the `.docx` is just a fragile container for the text. Keeping 20k originals is a **Reconstruction Bet** that future software will render OOXML better than PDF/A. That is a bad bet.
  *   **Justification:** "Outer Stable, Inner Extractable."
  *   **Note:** If you *do* keep the originals, your justification must be: "Values Call: Function Evidential." If you can't write that, you aren't allowed to keep them.

  ---

  ### Limitations & The "Future Cleverness" Variable

  You are correct: this procedure measures **recoverability**, not **significance**. It cannot tell you if the letters are historically important, only if they will be readable.

  **The "Future Cleverness" Problem:**
  The procedure assumes the future receiver is *competent* but not *omniscient*.
  *   **Reasonable Bet:** Future receivers will have specs for PDF/A (ISO standard).
  *   **Wishful Bet:** Future receivers will reverse-engineer our proprietary database schema or crack 2048-bit encryption.

  **How to encode this in the One-Line Justification:**
  Do not write "Saved for future use." That hides the bet. Use the following syntax to expose the risk:

  1.  **For Normalization:** `Normalize: [Format] -> [Target]. Bet: [Standard] survival.`
      *   *Example:* "Normalize: DOCX -> PDF/A. Bet: ISO 19005 survival."
  2.  **For Imaging:** `Image: [Reason]. Risk: [Specific Decay].`
      *   *Example:* "Image: Borrowed Frame. Risk: Sequence loss."
  3.  **For Discard:** `Discard: [Failure Point].`
      *   *Example:* "Discard: Phantom Frame (Header mismatch)."

  ### Addressing Your Team's Three Arguments

  1.  **Borrowed Frames:**
      *   *The Fix:* Q2 explicitly targets this. If the meaning lives in the folder name, the file is not self-describing.
      *   *The Rule:* If Q2 fails, you cannot Normalize unless you embed that context into the file metadata *during* the triage session. If you can't do that in 2 minutes, you must Image the container.

  2.  **Reconstruction Bets:**
      *   *The Fix:* Q3 forces you to name the standard.
      *   *The Rule:* "Vibes" are banned. If you can't name the ISO number or the three independent software packages that can open it today, it's not a standard, it's a bet. If it's a bet, Image or Discard.

  3.  **Phantom Frames:**
      *   *The Fix:* Q1 is a hard gate.
      *   *The Rule:* Header/Size mismatch = Discard immediately. Do not pass go. Do not try to open it. It is noise.

  ### Honest Assessment of Case 3 (The Gov Files)
  You suspected the procedure wouldn't let you keep the originals. **You are right.**
  Unless those Excel formulas are evidence of government policy (Q4 Fail), keeping 20,000 `.xlsx` files is hoarding, not preserving. It is a bet that Microsoft's rendering engine is more durable than the PDF/A specification. That is a losing bet.
  The procedure forces you to either:
  1.  Admit the formulas matter (Image).
  2.  Admit only the text matters (Normalize).
  3.  Admit you are keeping them for "comfort" (which is not a preservation justification).

  If your team argues to keep them, make them write the justification: *"Values Call: Function Evidential."* If they can't defend that in the meeting, the storage space is yours.
