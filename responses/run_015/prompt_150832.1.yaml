      **TO:** Ministry of Civic Amusement, Bureau of Public Morale
      **FROM:** Geneva Society for the Abolition of Passive Spectatorship
      **DATE:** 14 October 2023
      **SUBJECT:** Grant Request #8842: Strategic Decommissioning of Municipal Repertory House and Implementation of Open Civic Festivities

      **Executive Summary**
      The Geneva Society requests funding to permanently cease operations at the Municipal Repertory House. We propose replacing the upcoming season of scripted productions with a year-long series of unstructured civic festivals. Current arts policy focuses on diversifying who watches the lie, rather than eliminating the lie itself. Our objective is to restore moral integrity by dissolving the architectural and psychological separation between citizen and performer.

      **Problem Statement & Methodology**
      The traditional theater cultivates moral atrophy. It encourages citizens to experience pity for fictional suffering while remaining indifferent to real neighbors. By sitting in darkness, isolated in private seats, the audience practices passivity. The actor, professionally trained in deception, models the normalization of falsehood. To combat this, we will remove all seating and staging. There will be no tickets, no script, and no observers. Participants will engage in collective dancing, singing, and public gymnastics. This ensures emotion is not cathartically expelled but physically enacted as public virtue.

      **Alignment with Policy Metrics**
      *Accessibility:* Current models subsidize tickets for low-income viewers. We propose eliminating the ticket booth entirely. True accessibility requires removing the wall that defines "inside" versus "outside."
      *Diversity & Casting:* Representational casting acknowledges roles as valid categories. We reject this. Since all roles are artificial constructs that distort natural character, diversity is achieved by dissolving representation altogether. No one plays a part; everyone appears as themselves.
      *Community Engagement:* Engagement is currently measured by attendance. We measure it by exertion. If a citizen is not sweating, they are merely spectating.

      **Budget Overview**
      Total Request: $450,000
      1.  **Structural Modification ($150,000):** Demolition of the proscenium arch and removal of fixed seating. The arch physically enforces the distinction between illusion and reality; its removal is a prerequisite for civic honesty.
      2.  **Personnel Transition ($200,000):** De-professionalization stipends for former actors transitioning to civic participation. These funds support former cast members while they relearn unscripted social interaction without remuneration for falsehood.
      3.  **Infrastructure ($100,000):** Procurement of collective dance surfaces (grass, sand, untreated wood) and open-air amplification. Surfaces must be uneven to prevent choreographed precision, ensuring authentic movement.

      **Risk Assessment**
      Stakeholders may raise objections that confirm the necessity of this intervention.
      *Performer Unemployment:* Claims of job loss reflect a dependency on being paid to pretend. We aim to normalize unpaid authenticity.
      *Loss of Cultural Heritage:* Preserving scripts preserves outdated moral errors. Letting them vanish is an ecological benefit.
      *Audience Boredom:* Reports of boredom indicate a withdrawal symptom from artificial stimulation. This discomfort is a therapeutic indicator of recovery.
      *Diminished Tourist Revenue:* Tourists come to consume local culture as a commodity. We propose they stop consuming and start participating. Revenue loss signifies a successful shift from extraction to integration.

      **Conclusion**
      We await approval to begin dismantling the stage.

