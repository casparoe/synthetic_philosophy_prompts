      *   **Specific Question:** Does linear aggregation survive if risk attitudes shift systematically based on whether outcomes are shared or private? Is this an independence failure or a comparability issue?
      *   **Plan:** 3 months. Month 1: Formalize 2-agent/2-state model with framing parameter. Month 2: Derive/disprove representation theorem. Month 3: Philosophical implications.
      *   **Success Criteria:** Modified theorem with framing-contingent weights OR negative result showing linearity is unavoidable (framing = risk aversion). Failure = Framing effect is just relabeled risk aversion.
