  ### Candidate Setups (Pre-Commitment)

  1.  **Archival Digitization:** Group A uses physical ledgers before they are digitized and restricted; Group B uses new statistical reconstructions. *Reject:* Restricted access post-digitization counts as a "private advantage" (access control), violating the constraint.
  2.  **Computational Brute-Force:** Group A uses a specific supercomputer window before costs rise; Group B uses a new efficient algorithm. *Reject:* Relies too heavily on economic contingency (costs) rather than structural epistemic conditions; looks like luck.
  3.  **Infrastructure Lifecycle (Selected):** Group A uses a legacy instrument being decommissioned; Group B uses a new platform becoming standard. *Accept:* The asymmetry is baked into the material lifecycle of the field, not luck or genius.

  ***

  ### The Scenario

  In high-energy neutrino physics, two collaborations independently measure the precise neutral-current coupling constant within a six-month window. Group A, working at a legacy reactor facility, captures the data during the core's final operational cycle before a mandated safety upgrade permanently alters the neutrino flux profile required for this specific isolation; their analysis relies on standard calibration techniques applied to this unique, vanishing configuration. Group B, operating at a newly commissioned accelerator site, derives the same value using a novel liquid-argon detection medium that is rapidly becoming the field's standard, employing an open-source noise-filtering pipeline currently being adopted by three other consortia. There was no leakage between the groups, and both submissions were accepted by *Physical Review Letters* in the same volume.

  ### The Counterfactuals

  **World ~A (No Group A):** The reactor upgrade proceeds on schedule. The specific flux profile required for the legacy method ceases to exist. Because no other active facility produces this profile, the measurement cannot be replicated via A's method. The field must wait for a dedicated research reactor designed to replicate these conditions, currently in the funding queue with a 25-year projected timeline. The result does not arrive for decades.
  *Held Fixed:* The infrastructure upgrade schedule, the state of theoretical knowledge, and the availability of Group B's technology.

  **World ~B (No Group B):** Consortium B dissolves due to internal management failure. However, the accelerator facility remains operational, and the liquid-argon detection medium is now installed and validated. Because the technology is robust and the facility accepts proposals from multiple teams, Consortium C (who submitted a similar proposal ranked second) gains beam time within the next cycle. They run the same open-source pipeline. The result arrives 18 months later, which is "on schedule" relative to the decades-long delay in World ~A.
  *Held Fixed:* The infrastructure availability, the robustness of the new technology, and the distribution of expertise in the field.

  ### The Wrinkle: Uptake and Credit

  Post-publication, the field cites and builds almost exclusively on Group B's version. Group A's paper becomes a historical footnote, referenced only for priority. This happens not because A's data was wrong, but because B's method allows for *follow-up* experiments (varying energy, different targets) while A's method was a dead-end singular event.

  **Does it matter who discovered it?**
  It matters for **credit** (sociological reward), but not for **content** (the truth value), and critically, it matters immensely for **uptake** (the trajectory of research). If discovery is defined as "making a fact available for future use," then Group B discovered it more thoroughly than Group A. Group A found the truth but locked it behind a vanishing method; Group B found the truth and opened a door. This suggests that "discovery" is not merely epistemic access to a fact, but the establishment of a *reliable pathway* to that fact.

  ### The Single Feature Doing the Work

  **Infrastructural Repeatability.**
  The asymmetry hinges entirely on whether the material conditions that produced the result can be recreated by others in the field. Group A's success depended on a transient infrastructure state; Group B's depended on a durable, expanding infrastructure state.

  **If I delete this feature:**
  If both groups used durable, standard infrastructure (e.g., two different standard telescopes), then if Group A fails, Group C uses Telescope A later. The case collapses into a **symmetric multiple**, and the inevitabilist wins: the result was "in the air" because the tools were universally available. The contingency vanishes.

  ### The Inevitabilist's Best Attack

  **The Attack:** "You are conflating the *measurement* with the *fact*. The coupling constant existed and was determined by nature regardless of the instrument. If Group A's path closed, theoretical pressure combined with Group B's robust method would have forced an indirect inference of the value much sooner than 25 years. The *knowledge* was inevitable even if this specific *experimental run* was contingent. Your case only proves methodological contingency, not epistemic inevitability."

  **Does it land?**
  Honestly? **Partially.** It lands if we accept that theoretical constraints can substitute for empirical measurement without significant delay. However, it fails if we acknowledge that in experimental sciences, *precision* matters as much as *existence*. Without A's specific measurement, the value remains inferred with wide error bars for decades, stalling model selection. The inevitabilist wins the ontology (the fact exists) but loses the epistemology (the usable knowledge). Since science is a practice of building usable knowledge, the contingency holds.
