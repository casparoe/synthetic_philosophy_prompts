answer: |-
  **Brainstorming Notes:**

  *   **Core Tension:** Lewis bans transworld identity because of Leibniz's Law (an object can't have contradictory properties, e.g., forking vs. not forking). Jax needs to explain how one entity can be "plural-located" without violating logic.
  *   **The Case:** Process-node $N$.
      *   $W1$: $N$ forks into Thread A and Thread B.
      *   $W2$: $N$ runs straight (no fork).
  *   **Mira's Move (Counterpart):** $N$ in actuality is distinct from Thread A and Thread B. They are counterparts based on causal continuity. This avoids contradiction.
  *   **Jax's Move (Transworld Identity):** $N$ is literally present in both threads. It's one thing, multi-located. Like a universal instantiated twice, but concrete.
  *   **Jax's Attack:** If "plural-location" just means "causally continuous and similar," isn't that just Counterpart Theory with extra steps? Why insist on "identity"?
  *   **Mira's Attack (The Merge):** If Thread A and Thread B merge back into Thread C in $W1$, does Thread C have one past or two? If $N$ is identical to both, identity is transitive, so A = B. But they diverged. How do you handle the convergence without contradiction?
  *   **Tone:** Coffee shop, late afternoon, tired but energized. One typo max.

  ***

  **Dialogue:**

  **Mira:** Okay, look at the trace log again. In $W1$, the process-node $N$ hits a conditional statement and forks. You've got Thread A going left, Thread B going right. In $W2$, the condition fails, and $N$ just runs straight through. You're telling me $N$ is *literally* the same entity in all three spots?

  **Jax:** Literally. Same code, same process ID, just distributed differently across the modal space. In $W2$, it's singly-located. In $W1$, it's plural-located. It's one thing present twice-over.

  **Mira:** But that violates Leibniz's Law hard. In $W1$, $N$ is computing output 0 on Thread A and output 1 on Thread B simultaneously. In $W2$, it's computing neither. If $N$ is identical to the $N$ in $W1$, then $N$ has contradictory properties.

  **Jax:** Only if you treat properties as monadic. I'm treating them as relations to world-stages. $N$ has the property *computing-0-at-W1-Thread-A*. That doesn't contradict *computing-1-at-W1-Thread-B*. It's like being in two places at once. You don't say I'm two people because I'm on a Zoom call and sitting in this café.

  **Mira:** But I'm not *literally* identical to my Zoom avatar. That's the point. Lewis gets this right. The $N$ in $W1$ isn't you, it's a counterpart. It shares your causal history, sure, but it's numerically distinct. That's why you don't get contradictions. There are two nodes in $W1$, both counterparts of the original. Neither *is* the original.

  **Jax:** Here's my worry, though. You're drawing a hard line between "identity" and "counterpart relation." But your counterpart relation is built on causal continuity and qualitative similarity, right?

  **Mira:** Basically, yeah.

  **Jax:** And my plural-location is built on... causal continuity and qualitative similarity. The only difference is I'm willing to call that relation "identity" and you're not. If the work is being done by the causal links, isn't "plural-location" just counterpart theory with a fancier name? You're smuggling in the counterpart relation and pretending it's strict identity.

  **Mira:** It's not just naming. It's about what happens when the threads come back together. That's where your view crashes.

  **Jax:** How so?

  **Mira:** Suppose in $W1$, Thread A and Thread B don't just terminate. They merge. They sync up into a single Thread C. Now, if $N$ is literally identical to Thread A, and $N$ is literally identical to Thread B, then by transitivity, Thread A is identical to Thread B.

  **Jax:** Right...

  **Mira:** But they weren't identical during the fork. Thread A had state 0, Thread B had state 1. They were distinct processes. If they merge into C, does C have one past or two? If identity is strict, C can't have two distinct histories because that implies A and B were the same thing all along, which they weren't—they diverged.

  **Jax:** Okay, but if I say $N$ is plural-located, I can say the merge is just the location count going back down from two to one. It's like two rivers merging. The water is the same stuff.

  **Mira:** But water isn't identical across rivers. Look, if $A = N$ and $B = N$, then $A = B$. If $A = B$, how did they diverge in the first place? You can't have one thing taking two mutually exclusive paths unless you say it's actually two things. If you admit it's two things during the fork, you've conceded to counterpart theory. If you insist it's one thing, you can't explain how it merges back without saying the merge is illusory.

  **Jax:** I don't think I'm conceding. I'm saying the *entity* is one, but its manifestation is fragmented. Think of it like a database transaction. The transaction ID is unique, even if the query splits into parallel sub-processes. When they merge, the transaction commits. It's one transaction.

  **Mira:** But the transaction ID is just a label. I'm talking about the metaphysical constituent. If you keep "identity," you lose the ability to count. In $W1$, how many nodes are there during the fork?

  **Jax:** One node, twice-located.

  **Mira:** So if I delete Thread A, have I deleted the node?

  **Jax:** You've deleted one location of it. The node still exists at Thread B.

  **Mira:** Then the node survives the destruction of Thread A. But in $W2$, the node never forked. So in $W1$, the node survives something that doesn't happen in $W2$. That means the node in $W1$ has the property *survives-deletion-of-A* and the node in $W2$ lacks it. Back to Leibniz. You're stuck.

  **Jax:** (Stirs coffee, frowns) Fine. I index the properties to the world-thread. But seriously, Mira, isn't your view just as weird? You say Thread A and Thread B are both counterparts of $N$. So $N$ has two futures in $W1$. But neither of them *is* $N$. So what happens to $N$? It just... stops?

  **Mira:** $N$ ends at the fork. Its counterparts continue. That's clean.

  **Jax:** It's clean, but it feels like we're losing the thing we care about. We want to say the computation *could have* gone differently. If $N$ ceases to exist at the fork, then $N$ never actually computes the output in $W1$. The counterparts do. It makes modality feel... disconnected. Like I'm not worried about what *I* do in other worlds, but what my twins do.

  **Mira:** That's the cost of keeping logic clean. You want the comfort of identity without the contradictions. I think plural-location is just a way to dodge the bullet, but the bullet still hits you when the threads merge. If A and B merge, and they were both identical to $N$, then the merged thread C is identical to $N$. But C has a history of being two things. That's not one thing anymore.

  **Jax:** Maybe "one thing" is the wrong constraint. Maybe concrete entities can be multi-located without splitting. Look, I'm not saying it's easy. But if I drop identity, I lose the explanatory power of saying it's the *same* computation running across worlds. If it's just counterparts, why do the laws of physics hold across the fork?

  **Mira:** Because counterparts share laws. That's what makes them counterparts.

  **Jax:** (Sighs) You're definitly missing the point about the merge though. If A and B merge, your view says C is a counterpart of A and a counterpart of B. But is C a counterpart of $N$?

  **Mira:** Yes, by transitivity of the counterpart relation—which, unlike identity, isn't strict.

  **Jax:** Exactly. It's not strict. So you're admitting the relation weakens over distance. My view keeps it strong. One node. Just... stretched.

  **Mira:** Stretched until it snaps. When the forks merge, the tension breaks. You can't have one thing be two things and then one thing again without admitting it was actually two things in the middle.

  **Jax:** Or maybe reality is just okay with being weird.

  **Mira:** Maybe. But I'm not buying plural-location until you solve the merge without smuggling in counterparts.

  **Jax:** Pass the sugar. I need to think about the merge.
