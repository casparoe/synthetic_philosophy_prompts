      *   *My View (as Philosopher of Action):* This is a classic Parfit/Davidson/Bratman debate. The "Multiple Selves" view (often associated with Thaler/Shefrin or Ainslie, though Ainslie is more nuanced) risks dissolving the agent entirely. If there is no unified agent, who is the subject of the behavioural economics model? The model *presupposes* a single agent whose welfare is being discounted.
