answer: |-
  Right then. Pull up a chair. It sounds like a proper spirited debate, the sort that usually ends with someone buying a round to apologise for being too dogmatic. You've stumbled upon one of the liveliest disputes in the philosophy of action, sitting right at the intersection of normative theory and behavioural science. Your friend is advocating a version of the 'Multiple Selves' view, often associated with the Thaler-Shefrin planner-doer model or certain readings of Parfit's reductionism. You are defending the traditional 'Single Agent' view, where *akrasia* is a genuine failure of rationality within a unified agency.

  Before we get to the audit, let's do a bit of brainstorming on what work this contract analogy is actually doing in your friend's argument. It is not merely descriptive; it is doing heavy normative lifting.

  First, it is **externalising the conflict**. By turning an intrapersonal struggle (me vs. my own impulse) into an interpersonal negotiation (Present Me vs. Future Me), it moves the problem from the realm of psychology to the realm of politics or law.
  Second, it is **depathologising the behaviour**. If I break a contract with a stranger, I am not necessarily 'irrational' or 'weak'; I might just be prioritising my current interests. The analogy attempts to strip *akrasia* of its normative sting.
  Third, it is **shifting the locus of control**. If the problem is contractual, the solution is legalistic (binding agreements, penalties) rather than therapeutic or educational (building character, improving judgement).

  The danger, as you suspected, is that the analogy smuggles in these conclusions under the guise of a neutral economic model. Let's audit the two models your friend proposed.

  ### The Audit: Contractual Mappings

  Here is how the legal concepts map onto the two temporal models your friend proposed.

  | Legal Concept | Model 1: Two-Party Contract (Discrete Selves) | Model 2: Leasehold (Overlapping Tenancies) | The Reality (Behavioural/Philosophical) |
  | :--- | :--- | :--- | :--- |
  | **The Parties** | Present Self (Landlord) vs. Future Self (Tenant). Distinct legal persons. | A series of short-term tenants. Outgoing and Incoming overlap. | One biological organism with a continuous, though changing, psychological narrative. |
  | **Offer & Acceptance** | Present self makes a plan (offer); Future self accepts by following it. | Outgoing tenant sets conditions; Incoming tenant inherits them but can renegotiate immediately. | Planning is a mental state of the *same* agent extending over time. No distinct 'acceptance' event occurs later. |
  | **Consideration** | Present sacrifice for Future gain. | Maintenance of the 'flat' (body/mind) for the next tenant. | Intertemporal utility trade-off. The 'currency' is the same (wellbeing), not exchanged between owners. |
  | **The Breach** | Giving in to temptation (eating the cake). | Damaging the flat before handing over keys. | Acting against one's own *current* best judgement (the definition of *akrasia*). |
  | **Damages** | Future regret, health costs. | Repair costs for the next tenant. | Reduced lifetime welfare. The pain is felt by the *same* entity that caused it. |
  | **Enforcement** | Commitment devices (locking the fridge). | Deposits, inventory checks. | Willpower, habit, or external constraints. |
  | **Standing to Sue** | Future self complains about Present self. | Incoming tenant complains about Outgoing. | **Problem:** The Future self does not exist *now* to hold standing. The Present self is both judge and defendant. |

  ### Where the Mapping Breaks

  Now, let's look at where these mappings snap. Your friend's argument relies on these breaks being negligible, but I would argue they are structural faults.

  **1. The Standing Problem (Crucial)**
  In law, for a contract to be binding, both parties must exist and consent. In Model 1, the Future Self does not exist at the time of the 'agreement'. In Model 2, the overlap helps, but the 'Incoming Tenant' is not a distinct legal entity capable of suing the 'Outgoing Tenant' in a court of law. They share the same dock.
  *   **Why it matters:** If the Future Self has no standing *now*, the 'contract' is a unilateral declaration, not a bargain. This undermines the idea that breaking it is merely a 'breach' rather than a failure of internal coherence.

  **2. The Boundary Problem (Crucial)**
  Contract law requires clear identification of parties. Hyperbolic discounting describes a smooth, continuous curve of valuation, not a jagged handover of keys. There is no precise moment $t$ where Self 1 ends and Self 2 begins.
  *   **Why it matters:** Your friend's Model 2 (Leasehold) admits this overlap, but then loses the clean 'breach' narrative. If I am both the wrecker and the inheritor simultaneously (which I am, neurally), the contract model dissolves into a description of a single system in conflict with itself.

  **3. The Preference Smuggling (The Big One)**
  This is the most significant philosophical sleight of hand. The contract analogy assumes that each time-slice has **settled, exogenous preferences**. It assumes Present Self *wants* X and Future Self *wants* Y, and these are just given facts.
  *   **The Break:** In reality, preferences are often endogenous. The Present Self's choice *shapes* the Future Self's preferences. By smoking now, I am not just breaching a contract; I am altering the physiology and psychology of the future agent. The contract model treats the damage as external to the tenant (like a hole in the wall), but in *akrasia*, the damage is often to the *capacity to choose* (addiction, habituation).
  *   **Why it matters:** If preferences are shaped by past choices, you cannot treat the selves as independent contractors. They are causally linked in a way that demands a theory of *agency*, not just *interest*.

  **4. The Normative Smuggling**
  Your friend treats prudence as a kind of interpersonal morality (I ought to be nice to Future Me).
  *   **The Break:** Rationality is usually defined as consistency within an agent. Morality is defined as constraints between agents. By modelling prudence as morality, he assumes the conclusion: that there is no *rational* requirement to care for the future, only a *moral* one (or a strategic one).
  *   **Why it matters:** Standard decision theory says ignoring your future welfare *is* irrational (violates stationarity axioms). Your friend is redefining rationality to mean 'locally consistent' rather than 'globally consistent'.

  ### Verdict on the Three Conclusions

  Does the analogy carry the weight of your friend's three conclusions? Let's take them one by one.

  **1. "Nothing irrational is going on at all."**
  **Verdict: False.**
  The analogy hides this conclusion by changing the definition of rationality. In behavioural economics, time-inconsistency is explicitly labelled an 'anomaly' or 'bias' precisely because it violates the axioms of rational choice (specifically, dynamic consistency). If the selves were truly distinct parties, there would be no 'bias', just trade. The fact that economists use 'discounting' models to predict *errors* in welfare maximisation proves they view the agent as a single unit of account over time. The analogy doesn't prove there's no irrationality; it merely re-describes the irrationality as a conflict of interest.

  **2. "Commitment devices are the only real response."**
  **Verdict: Overstated.**
  This follows from the 'contract' view. If the problem is breach, you need enforcement. But if the problem is cognitive distortion (the wide-angle lens you mentioned) or skill deficit (the golfer's yips), then commitment is a blunt instrument.
  *   **The Skill Analogy:** If *akrasia* is like a golfer yipping the putt, the solution isn't to tie the golfer's hands (commitment); it is to practise the stroke, adjust the stance, or retrain the attention. This supports a theory of the will as a muscle or a skill that can be strengthened, rather than a fragile contract that needs a lawyer.
  *   **The Distortion Analogy:** If the near reward distorts value like a lens distorts a face, the solution is epistemic: learning to step back, or 'cooling' the hot state.
  Your friend's conclusion rules these out *a priori* by assuming the preferences are fixed and the conflict is purely structural.

  **3. "Nothing left for a theory of the will to explain."**
  **Verdict: Premature.**
  If the Multiple Selves view were true, we would still need a theory of how these selves negotiate. Who is the chair of the meeting? The 'will' is simply the name we give to the mechanism that resolves intertemporal conflict. Abolishing the term doesn't abolish the phenomenon. Furthermore, if the selves overlap (Model 2), we need an explanation of the *continuity* that allows for memory and responsibility. The contract model cannot explain why I feel *guilt* rather than just *strategic loss*. Guilt presupposes a unified agent who owns the action.

  ### A Better Way Forward

  Your intuition about the golfer or the lens was spot on. The contract analogy is a **category mistake**. It treats a diachronic (over time) problem as a synchronic (at one time) negotiation between distinct entities.

  A superior analogy might be **Constitutional Politics** rather than Contract Law.
  *   **The Agent:** The State.
  *   **The Selves:** Successive governments.
  *   **The Will:** The Constitution.
  *   **Akrasia:** A government acting unconstitutionally for short-term gain.
  *   **Commitment:** Judicial review or entrenched clauses.

  Why is this better? Because in a state, the government changes, but the *State* remains. The Constitution binds the current government *because* it is the same State. This preserves the unity of the agent (the State/Person) while acknowledging the conflict of interests between administrations (Time-slices). It allows for 'irrationality' (unconstitutional acts) without dissolving the agent into strangers. It also allows for 'training' (civic education) alongside 'binding' (laws).

  ### Summary for the Pub

  Tell your friend this: The contract analogy is a useful heuristic for designing commitment devices, but it is a terrible ontology for human agency. It smuggles in a definition of rationality that ignores the axioms of the very economic models he cites. It assumes preferences are fixed when they are malleable. And it cannot explain the phenomenology of regret and guilt, which presuppose that the person who suffered is the *same* as the person who chose.

  He is right that we should use commitment devices. He is right that moralising is often unhelpful. But he is wrong to think this dissolves the puzzle of *akrasia*. It merely moves it from the psychology of the individual to the architecture of the choice, without explaining why the individual experiences it as a failure of *will* rather than a simple change of mind.

  The 'Single Agent' view survives because, ultimately, only one person collects the pension, suffers the hangover, and pays the bill. If the Future Self is a stranger, why do I save for his retirement at all? The fact that I do—and feel I *ought* to—proves the contract model is incomplete.

  Now, I believe it's your round.
