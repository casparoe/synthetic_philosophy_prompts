  ### Decomposition of the Credence

  I treat the argument as a **conjunctive chain**. For the argument to provide *non-trivial strength*, it must survive the major failure modes. If any term collapses to near zero, the argument provides no reason. I model the total credence $C(P)$ as the product of the probabilities that each objection fails to fataly undermine the argument.

  $$C(P) = T1 \times T2_{total} \times T3 \times T4_{salvage} \times T5 \times T6_{specific}$$

