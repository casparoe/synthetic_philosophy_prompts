      *   **Consistency Check:** In Case 1, the panel noted "audit alone would have persuaded them." In Case 3, "engineering case as compelling in its own right." This implies a requirement that the secular justification be *accepted as sufficient by the proponents* to avoid the appearance (and reality) of religious coercion. If proponents admit they are acting on faith despite data, they are imposing faith-based rules on the populace. This aligns with Principle B.
      *   **Counter-Argument for Principle A:** The guideline asks if the measure is *justifiable*, not if the *sponsors are convinced*. A housing analysis exists. Residents of all faiths can engage with eviction data. Why does the sponsors' internal belief matter?
      *   **Rebuttal:** The guideline warns against religious premises "doing justificatory work." If the sponsors admit the secular case is weak/unpersuative to them but they proceed anyway due to doctrine, the doctrine is the effective justification for the *proposal*. The panel's past practice of recording the sponsors' affirmation (Cases 1 & 3) suggests this is a necessary condition for approval, not just incidental detail. Case 2 rejection hinged on sponsors invoking *only* obedience and defending no independent benefit. Here, sponsors invoke doctrine as *decisive* and reject the independent benefit's methodology. This is functionally closer to Case 2 than Case 1/3.

