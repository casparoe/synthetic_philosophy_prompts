  5.  **Evaluate Principles against Precedents:**
      *   **Case 1 (Shelter):** Approved. Sponsors said audit alone would persuade. Fits both A (audit exists) and B (sponsors affirmed sufficiency).
      *   **Case 2 (Holy Day):** Rejected. No secular benefit defended as sufficient. Fits both A (no secular case) and B (sponsors didn't affirm sufficiency).
