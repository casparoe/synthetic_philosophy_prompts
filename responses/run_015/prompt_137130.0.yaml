answer: |-
  1. **You argue that the fundamental principle of rightness need not be usable as a decision procedure. Williams's husband, however, is not criticized for calculating utility in the moment, but for having the thought that he *could* calculate it. On your view, is that thought corrupting only when it occurs during the deliberation of the rescue, or does it remain corrupting if he entertains it immediately after the fact?**
      *   *Follow-up (if she distinguishes deliberation from post-hoc justification):* What fixes the time boundary here, and in what sense is a reason that may only be thought outside the moment actually the reason the agent acts on?

  2. **If the thought is permissible after the act, does that mean the agent's justification to himself changes over time? If the theory forbids the thought at $t_1$ but allows it at $t_2$, are we saying the truth of the reason changed, or only its accessibility?**
      *   *Follow-up (if she claims accessibility changes while truth remains constant):* In what sense is a reason that may only be thought outside the moment the reason the agent acts on? If it cannot be cited in the moment, is it functionally distinct from the motive that actually moved him?

  3. **Your recent chapter extends subsidiarity from deliberation to auditing, suggesting the theory can forbid an agent from auditing their own commitments. If the theory forbids the audit, what distinguishes your agent from one whose commitments are simply unjustified?**
      *   *Follow-up (if she argues auditing is governed by expected costs):* What distinguishes her agent from one whose commitments are simply unjustified, and does the self-effacement stop anywhere or generate a regress of higher-order checks?

  4. **You suggest auditing has costs that the theory must assess. But costs and benefits shift over decades. What happens over a whole life, in which projects sour and people change?**
      *   *Follow-up (if she maintains that cost-assessment justifies the ban on auditing):* What happens over a whole life, in which projects sour and people change, so that a permanently unaudited commitment drifts toward complacency while the audited one drifts toward the fanatic?

  5. **Let's consider the mirror case: the husband who never registers the stranger's claim at all, the agent with one thought too few. If the extra thought corrupts, why is the missing one not also a fault?**
      *   *Follow-up (if she argues the missing thought is not required for integrity):* How do you separate the absorbed husband from the merely dismissive one without referencing their relationship to the impersonal principle?

  6. **If the distinction between the absorbed and the dismissive husband relies on their counterfactual reactions, does that not require a disposition to have the thought when circumstances shift? If so, does that not make the thought mandatory again?**
      *   *Follow-up (if she denies the disposition makes the thought mandatory):* Press her on whether the only way to separate them is by a disposition to have the thought when circumstances shift, which would make the thought mandatory again.

  7. **Consider the sentence the husband addresses to his wife afterwards: "I saved you because you are my wife." On your view, does this sentence come out true, or is it merely useful for her to hear?**
      *   *Follow-up (if she says it is merely useful):* If merely useful, the wife's complaint is managed rather than answered, and the objection has quietly become a claim about what we owe each other in the articulation of reasons rather than about the agent's private psychology.

  8. **In chapter six, you grant a modest agent-centered prerogative to favour one's own projects. Does that concession dissolve the objection, or relocate it, so that the offending thought becomes whether one's project is important enough to trigger the prerogative?**
      *   *Follow-up (if she argues it dissolves the objection):* And if the objection does generalize to any theory with a standing reason to reconsider one's commitments, is she conceding that Williams's target cannot really be maximizing or agent-neutrality specifically?

  9. **Finally, what would count against your reading of the integrity objection? Is it, on your view, an empirical claim about what deliberation does to us or a conceptual claim about reasons?**
      *   *Follow-up (if she treats it as contingent on psychological facts):* What finding would move her if it is the former, and what she would say if it turned out that a defensible account of love requires the lover to be able to cite the relationship as a reason that is not derived from the impersonal one.
