answer: |-
  To: Features Editor
  From: Desk
  Re: Decision-theory taxonomy draft

  hey, here's the skeleton for the decision-theory weeds piece. i tried to avoid the usual label-soup (nobody admits to being a "causalist" anymore) and just map the actual outputs. tone is intentional—want readers to feel like they're peeking at the backend logic.

  there's a few typos left on purpose so it doesn't look too polished yet.

  ***

  **THE DECISION TREE (DRAFT 1)**

  **NODE 1: The Platonia Filter**
  *Scenario:* 20 symmetric reasoners. $1M prize if *exactly one* sends a telegram. $0 if none or >1 send. Zero causal link between players.
  *Question:* Do you send (or randomize to send) based *purely* on symmetric reasoning? (i.e., "I decide for all 20 of us").

  *   **NO** → Go to Node 2A (The Skeptics)
  *   **YES** → Go to Node 2B (The Superrationalists)

  **NODE 2A: The Skeptics (Predictor Calibration)**
  *Scenario:* Newcomb-like setup. Omega predicts your choice.
  *Question:* Do you one-box/cooperate if Omega is only **80% calibrated** (not perfect)?

  *   **NO** (Two-box/Defect even at 80%):
      *   **Label:** **Strict Causalists**
      *   *Defenders:* Standard CDT folks, Spohn-ish.
      *   *Note:* They hold the line until causality is proven.
  *   **YES** (One-box at 80%, but said No to Platonia):
      *   **Label:** **Empirical Evidentialists**
      *   *Defenders:* Classic EDTers.
      *   *Note:* They buy correlation but not logical identity.

  **NODE 2B: The Superrationalists (Predictor Calibration)**
  *Scenario:* Same as above. Omega is 80% calibrated.
  *Question:* Do you still one-box/cooperate?

  *   **NO** (Drop off when noise introduced):
      *   **Label:** **Unnamed/awkward**
      *   *Instability:* Why does logical symmetry vanish at 20% noise? Usually implies they don't actually buy the symmetry, just liked the Platonia aesthetic. Unstable position.
  *   **YES** → Go to Node 3 (The Deep Weeds)

  **NODE 3: Nested Luring Lotteries (Counterfactual Weighting)**
  *Scenario:* Payout hangs on a counterfactual branch that *never happens* (e.g., "You get paid if Counterfactual-You would have paid, but you are in the branch where you didn't need to").
  *Question:* Do you treat that counterfactual branch at **full weight**, or apply **counterfactual-archipelago discounting**? (Def: each agent is an island, discount other islands by predictor-opacity).

  *   **Full Weight** (Treat the counterfactual as real logic):
      *   **Label:** **Logical Subjunctivists**
      *   *Defenders:* FDT hardliners (Yudkowsky/Soares adjacent).
      *   *Note:* They pay the cost in the actual branch to satisfy the counterfactual condition.
  *   **Counterfactual-Archipelago Discounting** (Discount the other island):
      *   **Label:** **Unnamed/awkward**
      *   *Instability:* If you discount the counterfactual, you time-inconsistently regret your prior commitment to the strategy. Basically collapses back into EDT under pressure.

  ***

  **FLAGS / KNOWN ISSUES**

  1.  **CDT vs. EDT Blindspot:** Node 1 splits them both into the "NO" bucket. Strict Causalists and Empirical Evidentialists look identical here unless you hit them with a standard Newcomb problem (Node 2A). I've added Node 2A to catch this, but in a quick survey, readers might conflate "No symmetry" with "No correlation." Might need a sidebar.
  2.  **The 80% Cliff:** There's a pair my tree can't split: **Fragile Logicalists** (Node 2B-NO) vs **Empirical Evidentialists** (Node 2A-YES). Both one-box at 100% but defect at 80%. The *reason* differs (logic vs. evidence), but the *action* is the same. Tree classifies them differently based on Platonia response, but if someone skipped Platonia, they look identical.
  3.  **Archipelago Ambiguity:** Node 3 is teh hardest to operationalize. "Discounting" is vague. A **Pragmatic Logicalist** might say they discount, but their discount rate is zero. Hard to split them from Logical Subjunctivists without asking for their math.

  let me know if you want me to flesh out the "luring lottery" example concrete numbers for the sidebar. i think readers will get stuck on what "counterfactual-archipelago" means without a dollar figure attached.

  also, should we mention that **Strict Causalists** basically laugh at the whole tree? might be worth a quote.

  talk soon.
