  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Explanatory Indispensability.* The user specifically asked for this. Why posit a fiction? In physics, CoM simplifies Newton's laws. In philosophy, the Self must simplify prediction/interaction.
      *   *Requirement 2: Ontological Innocence.* It can't be a "thing." If it's a thing, it's not a CoNG. This is the core of Dennett's eliminativism.
      *   *Requirement 3: The Bootstrapping/Agency Problem.* If the self is a story, who tells it? If a "narrator" exists, we've smuggled in a homunculus. The theory needs to explain the *process* without a *processor*.
      *   *Requirement 4: The Doughnut Problem (Location).* CoM can be outside the mass. Can the Self be outside the body? Or is this a limit of the analogy? The theory must address the spatial/locational status.
