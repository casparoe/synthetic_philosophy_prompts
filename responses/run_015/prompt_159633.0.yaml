prompt: |-
  I'm in a reading group that straddles philosophy and cognitive science, and last week we got stuck on a question that I now think we were asking badly. We were arguing about whether a trained artificial system — a chess engine, a language model fine-tuned for a narrow task, a robot policy trained in simulation and transferred to hardware — can be said to know how to do something, in the same sense (if there is one sense) in which a person knows how to ride a bicycle or how to defuse a conversation. Half the group wanted to say the question is empty until we know what an account of knowledge-how is supposed to do, so I want the specification before we go further: write the desiderata that any adequate theory of knowing how must meet, where 'adequate' means adequate for this purpose — good enough to return a verdict on a system whose behavior is observable, whose internal states are in principle inspectable, and whose phenomenology is unknown.

  The list should be built from cases and distinctions rather than from the names of views. Please cover at least these, each with the consideration that makes it a requirement: the difference between knowing how to do a thing and knowing how one does it (a successful agent who cannot say or articulate what they are doing, versus one who can), the difference between actual success and counterfactual robustness across novel circumstances, the fact that knowledge-how appears to come in degrees and to be lost gradually, the possibility of retaining knowledge-how while losing the ability (someone who can no longer play but still knows how the piece goes), the productivity of knowledge-how for actions never performed (knowing how to get out of a burning building one has never been in), and cases where a crew or team knows how to do something no single member knows how to do. For each requirement mark whether it is non-negotiable or a preference of one camp, and flag any cluster you think cannot be jointly satisfied — my own suspicion is that the productivity requirement and any requirement tying knowledge-how constitutively to present ability are in tension, and separately that demanding agent-access to the method conflicts with competence-without-access, but I want your own verdict on where the real incompatibilities lie. Then, briefly, score a view that treats knowledge-how as a species of knowledge-that, a view that ties it to ability or dispositions, and any hybrid you think worth scoring, against the list — I'll fill in citations and reading myself, so please don't spend space on bibliography or on naming who holds what.

  Be committed rather than even-handed: I want you to take a definite position on which two or three requirements are truly non-negotiable, which single requirement excludes the most candidates, and where a cluster is unsatisfiable, which member of it you would actually drop and why — with your reasons stated, not with the tradeoff handed back to me to weigh.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group straddling philosophy and cognitive science.
      *   **Problem:** Stuck on whether AI/systems "know how" to do things (e.g., chess, language, robotics) compared to humans (bike riding, social nuance).
      *   **Task:** Write a list of *desiderata* for an adequate theory of "knowledge-how" (know-how).
      *   **Constraints:**
          *   Build from cases/distinctions, not view names (Intellectualism vs. Anti-Intellectualism).
          *   Cover specific cases: (1) Know-how vs. Know-that (articulation), (2) Success vs. Counterfactual Robustness, (3) Degrees/Gradual Loss, (4) Retention vs. Ability Loss, (5) Productivity (novel situations), (6) Distributed/Collective Know-how.
          *   Mark each as Non-Negotiable (NN) or Camp Preference (CP).
          *   Flag incompatible clusters.
          *   Take a definite position (not even-handed): Identify 2-3 truly NN requirements, identify the most exclusionary requirement, resolve incompatibilities by dropping one.
          *   Score three types of views: Intellectualist (Know-how = Know-that), Ability/Disposition-based, and a Hybrid.
          *   No bibliography/citations.
      *   **Target Audience:** Philosophically literate but wants clarity for application to AI/CogSci.

  2.  **Deconstruct the Desiderata (Drafting & Categorizing):**

      *   *Case 1: Articulation (Ryle's regress/Inarticulate Expert).*
          *   Distinction: Can do it vs. Can explain it.
          *   Requirement: Theory must allow for know-how without propositional access.
          *   Status: NN. (Otherwise, most skilled action isn't know-how).
      *   *Case 2: Luck vs. Robustness (Gettier-style for action).*
          *   Distinction: Succeeded once vs. Succeeds across variations.
          *   Requirement: Theory must distinguish accidental success from reliable capacity.
          *   Status: NN. (Otherwise, a lucky guess counts as know-how).
      *   *Case 3: Degrees/Gradual Loss.*
          *   Distinction: Binary vs. Graded.
          *   Requirement: Theory must accommodate gradability.
          *   Status: CP. (Some theories treat it as binary, but CogSci suggests gradients). Let's make it NN for CogSci relevance.
      *   *Case 4: Retention without Ability (The Paralyzed Expert).*
          *   Distinction: Knowing the method vs. Executing it.
          *   Requirement: Theory must allow know-how to persist when physical capacity fails.
          *   Status: CP/NN tension. Intellectualists say NN, Ability theorists say Impossible. I need to take a stand later.
      *   *Case 5: Productivity (Novel Situations).*
          *   Distinction: Routine vs. Adaptive.
          *   Requirement: Theory must explain application to untrained scenarios.
          *   Status: NN. (Crucial for AI generalization).
      *   *Case 6: Collective Know-how.*
          *   Distinction: Individual vs. Group.
          *   Requirement: Theory must scale or account for distributed cognition.
          *   Status: CP. (Can be reduced to individual relations, but better if handled directly).

  3.  **Identify Incompatibilities (The "Hard Problems"):**

      *   *Tension 1: Ability vs. Retention.* If know-how *is* ability (Anti-Intellectualism), you can't have know-how without ability. If know-how is internal/representational (Intellectualism), you can.
      *   *Tension 2: Inarticulacy vs. Propositional Structure.* If know-how requires propositional access, inarticulate experts are excluded. If it doesn't, how is it "knowledge"?
      *   *Tension 3: Productivity vs. Fixed Dispositions.* Simple disposition theories struggle with novel adaptation unless the dispositions are highly structured (which looks like representations).

  4.  **Formulate the Position (Taking a Stand):**

      *   *Non-Negotiables:* Robustness (no luck), Inarticulacy (skill without speech), Productivity (generalization).
      *   *Most Exclusionary:* Productivity/Generalization. This kills simple behaviorist/dispositional accounts that rely on fixed stimulus-response or narrow training distributions.
      *   *Resolution of Incompatibility:* I need to drop "Retention without Ability" as a *constitutive* requirement for the *core* sense of know-how relevant to AI/Action, OR I need to drop the strict Identity of Know-how and Ability.
      *   *Decision:* For the purpose of evaluating AI/Agents, "Ability" is paramount. A paralyzed human retains a *memory* of how, but lacks the *know-how* in the active sense relevant to agency. However, to be fair to the human intuition, I will argue that "Retention" is a distinct state (Knowledge of the Method) distinct from "Knowledge-How" (Capacity to Act). So I drop Retention as a requirement for *Know-How* specifically, reclassifying it as *Know-That* about action.
      *   *Wait, looking at the prompt:* The prompt asks me to flag clusters I think cannot be jointly satisfied and *which member I would drop*.
      *   *My Verdict:* The cluster [Know-how = Ability] and [Know-how persists without Ability] is incompatible. I drop [Know-how persists without Ability]. Why? Because for cognitive science and AI, if the system cannot execute the policy, attributing "know-how" is metaphorical at best. It confuses the map (representation) with the territory (capacity).

  5.  **Drafting the Desiderata List:**

      *   Make them crisp.
      *   Label NN vs. CP.
      *   Explain the "Why".

  6.  **Scoring the Views:**

      *   *View A: Intellectualism (Know-how = Know-that).*
          *   Pros: Handles Productivity, Retention, Collective (via shared info).
          *   Cons: Fails Inarticulacy (usually), struggles with Gradability.
      *   *View B: Ability/Disposition (Know-how = Capacity).*
          *   Pros: Handles Inarticulacy, Gradability, Robustness.
          *   Cons: Fails Retention, struggles with Productivity (unless complex).
      *   *View C: Hybrid (Propositional Control of Dispositions / Dual-Process).*
          *   Pros: Best fit.
          *   Cons: Complex.

  7.  **Refining the Position (Commitment):**

      *   I need to be committed.
      *   NN: Robustness, Inarticulacy, Productivity.
      *   Drop: Retention without Ability.
      *   Winner: A specific Hybrid view (Controlled Disposition).

  8.  **Review against Constraints:**
      *   Did I cover all 6 cases? Yes.
      *   Did I mark NN/CP? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I take a definite position? Yes.
      *   Did I score the 3 views? Yes.
      *   No citations? Yes.
      *   Tone: Philosophical but practical for CogSci/AI.

  9.  **Final Polish:** Ensure the distinction between "Knowledge of the method" and "Knowledge-how" is clear in the resolution of the Retention case. Ensure the AI relevance is clear (e.g., overfitting vs. robustness).

  *(Self-Correction during drafting)*: I initially thought about making "Degrees" Non-Negotiable. But strictly speaking, some binary theories exist. However, for CogSci, gradients are essential (learning curves, degradation). I will mark it NN because a binary theory is useless for measuring AI progress.
  *(Self-Correction on Retention)*: The prompt asks about "someone who can no longer play but still knows how the piece goes." This is the "Paralyzed Expert." If I say this isn't Know-How, I need to justify it strongly. I will argue this is actually *Know-That* regarding procedures, not *Know-How* proper. This resolves the tension.

  10. **Final Output Generation** (incorporating the above steps).
answer: |-
  Here is a specification of desiderata for a theory of knowledge-how, constructed from the cases you provided, followed by a verdict on incompatibilities and a scoring of candidate views.

  ### Desiderata for a Theory of Knowledge-How

  **1. The Inarticulacy Constraint (Competence without Access)**
  *   **Case:** A master cyclist cannot explain the physics of balance; a neural network classifies images without outputting a rationale. Conversely, a theorist can explain the mechanics but cannot ride.
  *   **Requirement:** The theory must allow an agent to possess knowledge-how without possessing the ability to articulate, justify, or propositionally describe the method employed.
  *   **Status:** **Non-Negotiable.** If a theory requires articulation, it excludes most skilled human action and all current opaque AI systems, rendering it useless for cognitive science.

  **2. The Robustness Constraint (Success across Variation)**
  *   **Case:** A agent succeeds at a task once due to luck (e.g., a robot arm knocks a block into a slot by random vibration) versus an agent that succeeds across varied starting conditions, friction levels, and perturbations.
  *   **Requirement:** The theory must distinguish between accidental success and knowledge-how by requiring counterfactual stability. Knowledge-how must persist across a relevant range of non-actual but possible scenarios.
  *   **Status:** **Non-Negotiable.** Without this, "knowledge-how" collapses into "outcome happened," which fails to distinguish agency from environmental chance.

  **3. The Gradability Constraint (Degrees and Degradation)**
  *   **Case:** A novice, an expert, and a decaying expert (due to age or neural pruning) all differ in status. Knowledge-how is not simply on/off; it degrades gradually before vanishing.
  *   **Requirement:** The theory must accommodate scalar attribution. It must explain how one can know how to do something *better* or *worse* than another, and how the state can diminish without immediate total loss.
  *   **Status:** **Non-Negotiable.** For cognitive science, a binary metric cannot track learning curves, partial transfer, or system degradation.

  **4. The Productivity Constraint (Novel Application)**
  *   **Case:** An agent knows how to escape a burning building they have never entered before, utilizing general principles of egress rather than a memorized map. A language model handles a prompt structure it never saw in training.
  *   **Requirement:** The theory must explain how knowledge-how extends to tasks or situations that are structurally similar but token-novel relative to the agent's training or past experience.
  *   **Status:** **Non-Negotiable.** This is the primary test for AI generalization. If a theory only accounts for rote repetition, it describes a lookup table, not an agent with know-how.

  **5. The Retention Constraint (Know-How without Ability)**
  *   **Case:** A pianist with severe paralysis retains the "knowledge" of how to play a sonata despite being unable to move their fingers.
  *   **Requirement:** The theory must allow knowledge-how to persist as an internal state even when the physical capacity to execute the action is permanently removed.
  *   **Status:** **Camp Preference.** This is the primary wedge between Intellectualists (who accept this) and Ability Theorists (who reject it).

  **6. The Distribution Constraint (Collective Capacity)**
  *   **Case:** A pit crew changes a tire faster than any single member could alone; a distributed AI system solves a problem no single node understands.
  *   **Requirement:** The theory must either allow knowledge-how to be a property of a collective system irreducible to individuals, or provide a clear reductionist account of how individual know-hows sum to collective capability.
  *   **Status:** **Camp Preference.** While desirable for social cognition, a theory can be adequate for individual agency without solving the collective problem immediately.

  ***

  ### Incompatibility Analysis and Verdict

  There is a hard tension between **The Retention Constraint** and a robust interpretation of **The Robustness/Ability Constraint**.

  If knowledge-how is constitutively tied to the *capacity* to succeed (Robustness), then the loss of physical ability entails the loss of knowledge-how. The paralyzed pianist retains *knowledge-that* (procedural facts), but loses *knowledge-how*. If knowledge-how is constitutively tied to *internal representation* (allowing Retention), it becomes difficult to explain why the theorist who can describe the sonata but cannot play it lacks knowledge-how.

  **My Verdict:**
  I drop **The Retention Constraint** as a requirement for *knowledge-how*.
  **Reasoning:** For the purpose of evaluating artificial systems and cognitive agents, conflating "knowing the procedure" with "knowing how to execute" is fatal. A system that holds a perfect map of a terrain but has no locomotion does not know how to traverse the terrain; it knows facts *about* traversal. Retention in the absence of ability is a state of *memory* or *propositional knowledge*, not active know-how. Maintaining this distinction prevents us from attributing agency to systems that are merely archival.

  **The Most Exclusionary Requirement:**
  **The Productivity Constraint.**
  This eliminates the widest range of candidates. Simple behaviorist accounts (fixed dispositions) and brute-force lookup systems fail here. They can satisfy Robustness within a narrow training distribution, but they fail when the context shifts novelly. Any theory that cannot explain generalization to unseen cases is insufficient for modern AI or human cognition.

  **The Truly Non-Negotiable Core:**
  1.  **Inarticulacy** (Must allow silent skill).
  2.  **Robustness** (Must rule out luck).
  3.  **Productivity** (Must allow novel application).

  ***

  ### Scoring Candidate Views

  Here is how three broad classes of theories score against the Non-Negotiables and the Retention drop.

  **View A: Strict Intellectualism (Know-How is a species of Know-That)**
  *   *Core Claim:* To know how to $\phi$ is to possess a propositional representation of the method to $\phi$ under a practical mode of presentation.
  *   **Inarticulacy:** **Fail.** Struggles to explain how agents possess these propositions without access to them. Requires complex "tacit" machinery that risks becoming ad hoc.
  *   **Robustness:** **Pass.** Propositions can govern action across counterfactuals.
  *   **Productivity:** **Pass.** Excellent at explaining generalization via rule application.
  *   **Retention:** **Pass.** (But we have dropped this requirement).
  *   **Gradability:** **Fail.** Propositional knowledge is often treated as binary (you know the fact or you don't), making it hard to model skill decay.
  *   **Verdict:** **Rejected.** It over-intellectualizes skill and fails the Gradability and Inarticulacy constraints essential for cognitive science.

  **View B: Pure Ability/Disposition (Know-How is a Complex Disposition)**
  *   *Core Claim:* To know how to $\phi$ is simply to have a reliable, multi-track disposition to $\phi$ when inclined.
  *   **Inarticulacy:** **Pass.** Dispositions require no speech.
  *   **Robustness:** **Pass.** Built into the definition of "multi-track" disposition.
  *   **Productivity:** **Fail.** Simple dispositions are stimulus-bound. Without an underlying structure, they cannot explain adaptation to truly novel contexts (the "burning building" case) without smuggling in representations.
  *   **Gradability:** **Pass.** Dispositions naturally come in strengths and can degrade.
  *   **Retention:** **Fail.** (Consistent with my verdict to drop this requirement).
  *   **Verdict:** **Rejected.** It is too behaviorist. It cannot account for the flexibility required by the Productivity constraint without ceasing to be a "pure" disposition view.

  **View C: Controlled Disposition (Hybrid)**
  *   *Core Claim:* Knowledge-how is a disposition to act that is guided and structured by internal control states (which may be non-propositional maps, latent vectors, or schemas).
  *   **Inarticulacy:** **Pass.** The control states need not be linguistically accessible.
  *   **Robustness:** **Pass.** The disposition is reliable because it is regulated by the control state.
  *   **Productivity:** **Pass.** The internal control structure allows for recombination and application to novel inputs (e.g., a latent space in a neural net).
  *   **Gradability:** **Pass.** Both the disposition strength and the fidelity of the control state can vary continuously.
  *   **Retention:** **Fail.** (Consistent with my verdict). If the ability to execute is gone, the disposition is broken, regardless of the control state's integrity.
  *   **Verdict:** **Accepted.** This is the only view that satisfies the Non-Negotiable Core. It treats the agent as having an internal architecture (satisfying Productivity) that drives reliable behavior (satisfying Robustness) without requiring conscious access (satisfying Inarticulacy).

  ### Summary Recommendation for the Group

  Do not ask if the AI "has propositions." Ask if the AI has a **structured control architecture that generalizes.**

  If you adopt the **Controlled Disposition** view and drop the **Retention** requirement, you gain a clear verdict on your cases:
  1.  **Chess Engines:** Have know-how (High robustness, high productivity within domain, no articulation needed).
  2.  **Fine-Tuned LLMs:** Have know-how only if they generalize beyond the fine-tuning distribution (Productivity test).
  3.  **Sim-to-Real Robots:** Have know-how only if the policy survives the transfer noise (Robustness test).
  4.  **Paralyzed Humans:** Have *knowledge of procedure*, but have lost *knowledge-how*.

  This framework avoids the metaphysical swamp of "phenomenology" and focuses on the observable architectural features that cognitive science is equipped to measure.
