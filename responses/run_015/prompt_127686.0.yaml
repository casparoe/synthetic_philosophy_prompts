answer: |-
  **Project Title:** Beyond Epistemic Excuse: Reconstructing the "Man of His Time" Defense

  **1. The Question**
  This chapter asks whether the "man of his time" defense functions as an epistemic excuse or a demandingness objection. Standard discourse treats the defense as a claim about knowledge: the agent could not have known their actions were wrong. I propose that in paradigmatic cases of controversy (e.g., Jefferson, Churchill), the relevant moral truths were epistemically *available*—held by contemporaries, printed in public, and pressed upon the agent. Therefore, the defense cannot rest on availability. I argue it must rest on *attainability*: the agent could not have adopted the true belief without bearing costs (social ruin, collapse of self-conception) we do not normally require for blameworthiness.

  The chapter's specific task is to establish the conceptual distinction between availability and attainability and determine which, if either, sustains the defense. I prioritize this over the related questions of commemorative posture or diachronic symmetry because the status of the excuse is a prerequisite for the others. We cannot decide if a statue should stand (commemoration) or if we are hypocrites (symmetry) until we decide if the agent is excused. If the defense fails as an epistemic claim but succeeds as a demandingness objection, it changes the locus of the debate from "Did he know?" to "What could we reasonably ask him to sacrifice?" This narrow focus ensures the chapter is completable: it succeeds if it provides a criterion for distinguishing availability from attainability and applies it to the logic of the defense without requiring a full historical biography of any specific agent.

  **2. Intervention in the Field**
  Current philosophical treatments of historical judgment generally fall into two families. The first argues that historical distance makes judgment defective or inappropriate, often relying on a form of contextual relativism. The second argues that moral truths are timeless and distance makes no difference, implying that past agents are liable to the same blame as present ones. While these positions appear opposed, they share a critical framing assumption: they both treat the "man of his time" defense as a purely epistemic claim about the accessibility of moral truth. The relativist assumes the truth was inaccessible; the absolutist assumes it was accessible.

  By accepting this shared assumption, both sides miss the normative dimension of belief formation. I reject the assumption that the only barrier to moral knowledge is evidence. My project demonstrates that the defense is plausible only when shifted from an epistemic register (what could be known) to a normative register (what could be adopted at reasonable cost). This moves the debate beyond the stalemate between "they didn't know" and "they should have known," offering a third path that acknowledges the truth was available but questions the fairness of expecting the agent to have held it.

  **3. Method and Timeline**
  This project is conceptual analysis, not empirical history. It requires no archival training or manuscript access because it does not seek to discover new facts about specific agents. Instead, it takes the historical record as given by established secondary literature (i.e., that abolitionist arguments existed and were known to slaveholders) and analyzes the philosophical implications of that record. The questions are answerable from the armchair because they concern the conditions of blameworthiness and the structure of excuses, not the specific biographical details of Jefferson or Columbus.

  *   **Months 1–3:** Literature review and conceptual mapping. I will refine the definitions of *availability* and *attainability*, surveying existing work on moral demandingness and epistemic responsibility to ensure the distinction is novel and robust.
  *   **Months 4–6:** Drafting the core argument. I will construct the positive case for the attainability reading, using hypothetical cases and generalized public facts about the 18th and 19th centuries to test the distinction without getting bogged down in specific historiography.
  *   **Months 7–9:** Application and limits. I will test the framework against the "culpability vs. commemoration" distinction. This section will determine if an attainability excuse blocks blame but permits the withdrawal of honor.
  *   **Months 10–12:** Revision and integration. I will address the diachronic symmetry argument, deciding whether it serves as a constraint or a distraction, and finalize the chapter for dissertation integration.

  **4. Practical Significance**
  The deliverable of this research is not a verdict on a specific statue, but the deletion of a bad reason from public discourse. Currently, debates over commemoration stall because defenders invoke the epistemic excuse ("he couldn't know") while critics refute it ("he did know"). My analysis shows that both are partially wrong: he could know, but expecting him to act on it might have been too demanding.

  For a non-philosopher on a school board or city council, this clarifies the decision matrix. It suggests that removing a name need not be a retroactive punishment for moral failure (culpability), but a present-day judgment about who we choose to honor (commemoration). By dismantling the epistemic excuse, the proposal forces the debate onto the actual grounds of disagreement: not whether the agent was evil by their own lights, but whether their legacy is compatible with our current values. It allows committees to bypass the unresolvable historical counterfactuals and focus on the normative question of public honor.

  **5. Outcomes and Risks**
  There are two viable positive conclusions. First, the attainability defense succeeds, meaning agents are not blameworthy for failing to bear excessive costs, though their legacy may still be unfit for honor. Second, the defense fails entirely, because the costs of moral courage do not excuse complicity in grave injustice. Either result advances the field by resolving the conceptual ambiguity of the defense.

  The project fails if the distinction between availability and attainability collapses—for example, if "cost" turns out to be merely another form of epistemic barrier, or if the notion of "reasonable cost" proves too indeterminate to do philosophical work. It would also fail if I cannot disentangle the excuse from the commemorative question, resulting in a chapter that is too diffuse.

  The most likely scope risk is the temptation to engage in specific historical case studies to illustrate the point. While the cases motivate the question, arguing the specifics of Jefferson's library or Churchill's memos requires historical expertise I do not possess and would bloat the chapter. I will mitigate this by strictly limiting historical references to uncontested, general secondary facts (e.g., "abolitionist literature was widely circulated in 1790") and focusing the argument on the philosophical conditions of excuse. If I find I must resolve a historical dispute to make the philosophical point, I will excise that example and rely on hypotheticals.
