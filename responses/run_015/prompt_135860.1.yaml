answer: |-
  Here is the consistency check, ranked by severity, followed by the single highest-leverage revision.

  ### 1. Ranking the Tensions

  **Severity 1 (Critical): (2) vs. (4) — The Clientelism Contradiction**
  This is the fatal flaw in the current draft. Thesis (4) defines a "universal core" that explicitly includes "specific official act... regardless of local norms." Clientelism *is* a specific exchange of benefit for an official act (votes for jobs). If (4) is true, (2) is false. You cannot claim clientelism is a "functional substitute" (2) while simultaneously defining it as the "universal core" of corruption (4). This contradiction undermines your entire development argument.

  **Severity 2 (High): (1) vs. (4) — The Definition Drift**
  Thesis (1) defines corruption as a breach of *fiduciary duty* (relational/role-based). Thesis (4) defines it as harm to the *public interest* (consequentialist/abstract). These are not the same. A politician can breach a fiduciary duty without harming the aggregate public interest (e.g., nepotism that happens to pick the best candidate), or harm the public interest without breaching a specific duty (e.g., incompetence). More importantly, "public interest" is the vector through which Western Weberian norms sneak back in, undermining your critique in (2) and (3).

  **Severity 3 (Moderate/Apparent): (5) vs. (6) — The Meta-Ethical Worry**
  You suspect tension here, but it is likely **apparent, not real**. Thesis (5) is an *error theory* (explaining why we make mistakes); Thesis (6) is a *methodology* (how we correct them). Reflective equilibrium does not require raw intuitions to be perfect; it requires them to be *input* that gets weighed against principles and institutional facts. You can consistently argue that our "reciprocity detectors" are noisy (5) but that we can still calibrate them against the reality of institutional roles (6). This pair dissolves on inspection if you frame (6) as "equilibrium between intuitions and *institutional facts*," not just "intuitions and principles."

  **Severity 4 (Low): (3) vs. (4) — The Boundary Problem**
  This is a definitional edge-case, not a logical contradiction. You worry the line between "diffuse" (3) and "targeted" (4) is arbitrary. This is a standard sorites problem, but it doesn't break the argument. It just requires you to be precise about what constitutes a "quid" in the "quo."

  ---

  ### 2. The Single Revision

  **Revise Thesis (4).**

  Thesis (4) is the outlier. It attempts to lay down a universalist, consequentialist rule ("harm the public interest... regardless of local norms") that directly contradicts your contextualist, deontological framework in (1), (2), and (3).

  **Current (4):**
  > "Still, i think there's a universal core: if you hold a specific public office, take a private benefit, and in exchange perform a specific official act that harms the public interest, that's corruption regardless of local norms."

  **Proposed Revision:**
  > "Still, i think there's a universal core: if you hold a specific public office, take a private benefit, and in exchange perform a specific official act that **violates the legitimate terms of the fiduciary entrustment specific to that institutional context**, that's corruption."

  ### 3. Why This Revision Works

  1.  **Saves (2) (Clientelism):** By removing "harms the public interest" and "regardless of local norms," you allow the *content* of the fiduciary duty to vary. In a weak-state context (2), you can argue the "legitimate terms of entrustment" for a patron *include* resource distribution to their network. Fulfilling that duty is not corruption; breaching it (e.g., taking the money and *not* delivering the job) would be. This preserves your critique of Western standards without abandoning the concept of corruption entirely.
  2.  **Saves (3) (Gift-Giving):** It aligns (4) with (1). If the "legitimate terms of entrustment" in an East Asian context include diffuse reciprocity, then accepting a gift isn't a breach. It only becomes corruption if the gift forces a violation of the *specific* role mandate (e.g., ignoring safety regulations).
  3.  **Aligns (1) and (4):** It makes your "universal core" purely procedural/relational (breach of duty) rather than substantive/consequentialist (harm to interest). This creates a consistent philosophical spine.
  4.  **Preserves (5) and (6):** It keeps the focus on "institutional roles" (6), which are real facts you can investigate, rather than "public interest," which is often just a proxy for our intuitions (5).

  ### 4. The Cost of This Revision

  You do not get this fix for free. Here is what you lose:

  1.  **The "Harm" Safety Valve:** By removing "harms the public interest," you lose the easy way to condemn predatory behavior. If a local warlord argues that his "fiduciary duty" is to extract resources for his clan, your definition might technically exempt that as "consistent with his institutional context."
      *   *Mitigation:* You must add a constraint that the "institutional context" must have some claim to *public* (not just private) governance. You need a minimal threshold for what counts as a "public office" versus a "private gang leader."
  2.  **Increased Burden of Proof:** You can no longer just point to a transaction and say "that harms the public." You now have to do the sociological work of proving what the "legitimate terms of entrustment" actually *are* in a given context. This makes your paper harder to write but theoretically much stronger.
  3.  **Relativism Risk:** You open yourself to the charge that you are defining corruption away in non-Western contexts.
      *   *Mitigation:* Emphasize that "legitimate" is a normative term, not just a descriptive one. It refers to what the role *ought* to be within that system's own logic of justification, not just what the officeholder *says* it is.

  ### Summary
  Your (5)/(6) tension is a red herring; keep them as is. Your (2)/(4) tension is a logical contradiction that will get you torn apart in the seminar. **Cut "public interest" and "regardless of local norms" from (4).** Replace them with "violates the legitimate terms of fiduciary entrustment." This aligns your universal core with your contextualist critique, turning a contradiction into a nuanced distinction between *form* (universal) and *content* (contextual).
