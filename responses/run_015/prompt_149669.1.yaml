              *   But Violation is fixed.
              *   So FDT compares: (+$10k - $6k) vs ($0). Result: Pay.
              *   *Wait, this resolves the conflict.* If FDT sums them, it Pays.
              *   *But the User wants to test "Subjunctive Interference".* Is there a conflict?
              *   The conflict is: CM says Pay (to validate Bonus). XORB says Don't Pay (because Violation is fixed).
