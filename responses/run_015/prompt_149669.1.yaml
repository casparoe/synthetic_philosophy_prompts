  7.  **Developing the Analysis:**
      *   *Mapping:* CFO = Mugger/Blackmailer. Bonus = Closed Branch Benefit. Violation = Bad State. Invoice = Act.
      *   *Removal Test:*
          *   No XOR (Invoice always sent if Predicted Cover): Pure CM. FDT Pays (secures Bonus logic). CDT/EDT Don't.
