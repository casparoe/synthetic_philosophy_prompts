      *Self-Correction on FDT XORB Verdict:* I must be careful. If I claim FDT says Don't Pay on XORB, I must justify it in the removal test.
      *   Justification: The Violation is a fixed fact. The Invoice is a fixed fact. The decision cannot change them. (Standard FDT line).
      *   On CM: The Bonus is a fixed fact *physically*, but logically dependent on the disposition. (Standard FDT line).
