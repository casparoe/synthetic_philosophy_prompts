answer: |-
  **The Budget Invoice**

  You lead a department. The CFO, who knows you well (90% prediction accuracy), decided months ago: if she predicted you'd cover deficits, she awarded you a $10k bonus (already paid); otherwise, nothing. Today, she sends a $6k invoice. Her issuance rule was: Invoice sent iff (Compliance Violation XOR Predicted 'Cover'). A Compliance Violation (costing $10k in fines) is a fixed fact from last quarter; the file is closed. You have the bonus. You have the invoice. Paying settles the invoice. Refusing defaults it. The Violation fine is independent of payment. The Bonus is unrecoverable. You must decide now.

  ***

  **Mapping**
  *   **Mugger/Blackmailer:** The CFO.
  *   **Closed Branch:** The bonus decision (already paid).
  *   **Prediction:** CFO's forecast of your 'Cover' disposition.
  *   **Bad State:** Compliance Violation (fixed fact).
  *   **Act:** Paying the $6k invoice.

  **Removal Test**
  *   **Delete XOR (Invoice sent iff Predicted 'Cover'):** Pure Counterfactual Mugging.
      *   *CDT/EDT:* Don't Pay. Bonus is sunk; payment loses $6k.
      *   *FDT:* Pay. Your algorithm controls the prediction that granted the $10k. Paying validates the disposition required to keep the bonus logically consistent. Net: +$4k.
  *   **Delete Bonus (No prior reward):** Pure XOR Blackmail.
      *   *CDT:* Don't Pay. Violation and Invoice are fixed.
      *   *EDT:* Pay. Invoice & Pay implies ~Violation (since Invoice = V XOR Pred). Paying is evidence of safety.
      *   *FDT:* Don't Pay. Violation is independent of your algorithm. Invoice is fixed evidence. You cannot logically influence a past independent fact. Net: -$6k vs $0.

  **Combined Case Verdicts**
  *   **CDT:** Don't Pay. Both Bonus and Violation are causally fixed. Payment is a pure loss.
  *   **EDT:** Indifferent (Tuned). CM says Pay = Sucker (bad news). XORB says Pay = Safe (good news). Arithmetic cancels.
  *   **FDT:** Pay. The calculation sums the logical dependencies.
      1.  *CM Dependence:* Outputting 'Pay' makes it true that you are the type who covers deficits. Counterfactually, if you were the type who refuses, the Bonus ($10k) would not have been granted. Value: +$10k.
      2.  *XORB Dependence:* Outputting 'Pay' does not change the Violation (independent fact). Value: $0.
      3.  *Cost:* -$6k.
      4.  *Total:* +$4k. FDT pays.

  **Subjunctive Interference**
  You care about whether FDT is a unified rule or a bundle. In this case, FDT sums the dependences. There is no interference; the CM dependence (on the Prediction) survives the XORB structure (on the Violation) because the Bonus *depends* on the prediction, while the Violation does not. This requires a rule: **Logical dependence trumps physical fixedness only when the fixed fact was caused by the prediction.** This is principled, not a patch; it commits FDT to treating effects of predictions as mutable counterfactually, while independent facts remain fixed.

  **Feature & Attack**
  The working feature is the **asymmetric causal history** of the two fixed sums (Bonus vs. Violation). If removed (e.g., if Violation also depended on Prediction), the XORB structure collapses into Newcomb. A CDT defender would attack the CM premise: "The bonus is gone; you're throwing good money after bad." This lands only if you reject logical counterfactuals. The case is not new; it reduces to a **Newcomb problem with an evidential overlay**, but the single-act constraint forces the theories to reveal their handling of mixed dependencies.
