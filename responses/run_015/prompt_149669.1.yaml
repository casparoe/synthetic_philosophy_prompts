      *   Prediction accuracy stated (90%).
      *   Bad state fixed (Violation).
      *   Numbers tuned.

      *Draft:*
      You lead a department. The CFO, who knows you well (90% prediction accuracy), decided months ago: if she predicted you'd cover deficits, she awarded you a $10k bonus (already paid); otherwise, nothing. Today, she sends a $6k invoice. Her issuance rule was: Invoice sent iff (Compliance Violation XOR Predicted 'Cover'). A Compliance Violation (costing $10k in fines) is a fixed fact from last quarter; the file is closed. You have the bonus. You have the invoice. Paying settles the invoice. Refusing defaults it. The Violation fine is independent of payment. The Bonus is unrecoverable. You must decide now.

      *Word Count:* ~110 words. Good.
      *Numbers:* Bonus $10k, Invoice $6k, Violation $10k.
      *CM:* Paying validates the 'Cover' disposition that secured the $10k. (Gain $10k in counterfactual, Cost $6k now).
      *XORB:* Invoice received. If Predicted 'Cover' (likely due to bonus), Invoice -> ~Violation. Paying confirms Predicted 'Cover'.
