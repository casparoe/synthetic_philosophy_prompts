              *   The conflict is that XORB *usually* makes FDT say Don't Pay. CM makes FDT say Pay.
              *   If they combine, does the XORB "Don't Pay" intuition cancel the CM "Pay" intuition?
              *   In XORB, FDT says Don't Pay because the State is independent.
              *   In CM, FDT says Pay because the Benefit is dependent.
              *   So FDT sums: Dependent Benefit - Independent Cost.
              *   If Benefit > Cost, Pay.
              *   So FDT verdict is Pay.
              *   Is there "Interference"?
              *   The User asks: "is the functional verdict the sum of the two, or is there no fact of the matter until you add a rule..."
