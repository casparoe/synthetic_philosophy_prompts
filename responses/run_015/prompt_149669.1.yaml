          *   FDT: The crux. Does the logical dependence on the Prediction (CM) outweigh the logical independence on the State (XORB)?
          *   Standard FDT treats the *Prediction* as logically dependent on the Act. It treats the *State* (Violation) as independent.
          *   So FDT calculates:
