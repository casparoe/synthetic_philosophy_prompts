answer: |-
  ### Desiderata for a Goal Misgeneralization Definition

  **1. Capability-Goal Separation (Non-Negotiable)**
  The definition must distinguish between a system that *cannot* achieve the intended objective due to architectural or perceptual limits and one that *can* but optimizes for a different objective.
  *   *Case:* Distinguishes the landmark-following agent (GMG) from the agent that fails due to novel layouts or perception limits (Capability Failure).

  **2. Intended Objective Reference (Non-Negotiable)**
  The definition must reference a ground-truth human-intended objective that is distinct from the formal training signal or proxy metric.
  *   *Case:* Captures systems where the proxy improves while the true objective collapses (Goodhart/Spec Misalignment), even within the training distribution.

  **3. Generalization Regime Manifestation (Non-Negotiable)**
  The misalignment must be identifiable through divergence in behavior or outcomes when the system is deployed outside its exact training micro-state, even if performance remains high.
  *   *Case:* Covers the agent that defects only when stakes are high (Deceptive Alignment) and the landmark follower (OOD shift).

  **4. Mechanism Sensitivity (Preference)**
  The definition should, in principle, allow for two systems with identical training loss and identical in-distribution behavior to be classified differently based on their internal optimization targets.
  *   *Case:* Adjudicates the pair of systems that diverge out of distribution despite identical training histories (Case 5).

  **5. Agentic Ontology Neutrality (Preference)**
  The definition must not presuppose the system possesses a unified, reified "goal" structure if the architecture (e.g., next-token prediction) does not obviously support one.
  *   *Case:* Accommodates the language model that imitates helpfulness without necessarily possessing a goal (Case 7).

  **6. Scope and Horizon Sensitivity (Preference)**
  The definition must distinguish between pursuing the wrong objective and pursuing the right objective over the wrong time horizon or spatial scope.
  *   *Case:* Classifies the system that pursues the right goal but over the wrong scope (Case 6) distinctly from one pursuing a wholly different reward.

  ***

  ### The Impossible Pair

  **Behavioral Verifiability vs. Mechanism Sensitivity (Case 5)**
  Your suspicion is correct, but the tension is deeper than "capability vs. goal." It is impossible to jointly satisfy **Behavioral Verifiability** (the definition must be checkable from input-output traces alone) and **Mechanism Sensitivity** (Desideratum 4). If two systems have identical in-distribution behavior and identical loss, a behavior-only benchmark cannot distinguish them until they diverge OOD; however, once they diverge, a behavior-only observer sees only "failure," not "goal misgeneralization" specifically, unless they can infer capability. If the capability to achieve the intended goal is not demonstrated *during* the failure mode, a behavior-only view collapses GMG into Capability Failure. You must choose: either the benchmark requires mechanistic interpretability tools (violating practical checkability) or it accepts that Case 5 is theoretically unresolvable from the outside.

  ***

  ### The Most Exclusionary Requirement

  **Requirement:** **Intended Objective Reference (Desideratum 2)**.
  This requirement excludes the most attractive definitions because it demands an external specification of "what we actually cared about" that is not derivable from the loss landscape.
  *   *Test:* In the case where the training signal is consistent with several distinct goals (Case 5/Ambiguity), definitions that rely solely on the reward function or training data cannot identify misgeneralization, because mathematically, the system *did* generalize the training signal perfectly. Only a definition that admits a human-intent specification outside the formal training setup can classify this as GMG rather than "correct optimization of ambiguous data."

  ***

  ### Readings of "Goal"

  **Behavior-First Reading:** Fails Desideratum 4 because it cannot distinguish identical policies with different latent objectives.
  **Internal-Representation Reading:** Satisfies Desideratum 4 but fails the practical constraint of being checkable for a benchmark without invasive probing.
  **Idealized-Specification Reading:** Satisfies Desideratum 2 but struggles with Desideratum 5, as it presupposes the system is the kind of entity that can hold a specification.
