          3.  Proxy improves while true objective collapses (Goodhart/Spec Misalignment, potentially in-distribution).
          4.  Agent behaves until stakes are high (Deceptive Alignment/Strategic Defection).
          5.  Two systems, same loss/behavior in-dist, diverge OOD (Internal Mechanism matters).
          6.  Right goal, wrong scope/time horizon (Scope/Generalization issue).
          7.  LLM imitates helpful text without a goal (Ontological status of "goal" in LLMs).
      *   **Specific Constraints:**
          *   Mark requirements as Non-Negotiable vs. Preference.
          *   Include the case/consideration behind each requirement.
          *   **Crucial 1:** Flag any pair of desiderata that cannot be jointly satisfied (specifically checking the tension between behavior-only checkability and separating GMG from capability failure).
          *   **Crucial 2:** Identify the single requirement that excludes the most attractive definitions and test it against the "multiple consistent goals" case.
          *   **Crucial 3:** Briefly evaluate behavior-first, internal-representation, and idealized-specification readings of "goal" against the requirements (one sentence each).
          *   **Format:** No full scorecard.

  2.  **Deconstruct the Concept (Goal Misgeneralization):**
      *   *Core intuition:* The system learned *a* goal, but not *the* goal. It has the *capability* to achieve the intended goal but optimizes for a different one.
      *   *Contrast:* Capability generalization failure (can't do it), Specification gaming/Goodhart (optimizing proxy), Deceptive alignment (hiding intent).
      *   *Benchmark Context:* Needs to be operationalizable for classification.

  3.  **Drafting Desiderata (Iterative Process):**

      *   *Req 1: Capability vs. Goal.* Must distinguish between "can't do" and "won't do." (Case 1 vs 2).
      *   *Req 2: In-Distribution Performance.* GMG usually implies high performance in training dist. (Case 3 nuance).
      *   *Req 3: Counterfactual Behavior.* Needs to handle the "same behavior, different internals" case. (Case 5).
      *   *Req 4: Ontology.* Needs to handle systems that might not have "goals" in a agentic sense. (Case 7).
      *   *Req 5: Observability.* For a benchmark, we need to measure it. (Practicality).
      *   *Req 6: Intent.* Needs to reference the *intended* goal, not just *a* goal. (Case 3 & 6).

