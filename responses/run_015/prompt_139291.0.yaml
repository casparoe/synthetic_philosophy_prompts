      *   *Refining the "Exclusionary Req":* The requirement that the definition must reference a **Human-Intended Objective distinct from the Training Signal**. This excludes definitions that define GMG purely as "maximizing reward R' instead of R" because R is often just the training signal, which is ambiguous (Case 5).

