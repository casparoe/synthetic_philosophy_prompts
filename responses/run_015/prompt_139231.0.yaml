answer: |-
  It is genuinely refreshing to see someone arrive at the fragility of the Kelly Criterion through simulation and intuition before digging into the literature, because you have independently rediscovered a cornerstone concept in stochastic control and economic theory. The property you are describing, where the optimal decision rule does not change when you scale the units of wealth, is formally known as scale invariance. In the context of utility theory, this is closely tied to the concept of homogeneity, specifically that the value function of your optimization problem is homogeneous of degree zero in wealth with respect to the control variable. When you observe that the optimal fraction f remains constant regardless of whether you have one hundred dollars or one million, you are observing that the problem is scale invariant. The dividing line you are probing, between perturbations that preserve this elegance and those that destroy it, is the distinction between multiplicative structures and additive structures. Your intuition about scale-shaped perturbations is effectively correct, though the standard terminology distinguishes between linear or proportional changes, which preserve the ratio relationships, and affine changes, which introduce absolute levels.

  To understand why wealth dependence and horizon dependence often break together, you have to look at the structure of the value function in dynamic programming. When you maximize expected log wealth, the value function at any point in time separates cleanly into a term that depends on time and a term that depends on the logarithm of your current wealth. This specific separability is what grants you both properties at once. Because the wealth term is inside a logarithm, taking the derivative to find the optimal bet size cancels out the current wealth level entirely, which gives you wealth independence. Because the future value function looks exactly like the current value function just shifted by a constant, the optimal decision today does not need to account for how many steps are left, which gives you horizon independence. This is often referred to as the myopic property of log utility, meaning the multi-period problem collapses into a sequence of identical single-period problems. However, this collapse only happens if the boundary conditions and the dynamics respect the same symmetry. When you introduce a fixed dollar fee, you are introducing an absolute scale into the problem. A one dollar fee is negligible when you are rich but catastrophic when you are poor, so the problem is no longer scale invariant, and the optimal strategy must now depend on your current wealth to account for that relative burden.

  Similarly, when you set an absolute target like reaching one thousand dollars, you have introduced a fixed anchor in the state space. The distance to that target is not proportional to your wealth, so the urgency of your betting must change as you get closer or as your wealth fluctuates relative to that fixed number. This breaks the homogeneity of the problem. In contrast, if your target is to double your money, that is a relative target. Doubling one hundred dollars is structurally identical to doubling one million dollars, so the scale invariance holds, and the optimal fraction remains constant. The same logic applies to your cap examples. A hard cap at a fixed dollar amount creates a boundary where the marginal utility of wealth drops to zero abruptly at a specific level, forcing you to play differently as you approach that absolute ceiling. A cap that scales with your wealth preserves the ratios, so the strategy remains unchanged. You can think of the dividing line as whether the perturbation introduces a fundamental unit of currency into the logic of the game. If the rules can be stated entirely in percentages and ratios without ever mentioning a specific dollar amount, the scale invariance holds. If the rules require you to know the value of a dollar to evaluate the outcome, the invariance breaks.

  Regarding your question about whether wealth dependence and horizon dependence are one phenomenon or two, they are technically distinct mathematical properties that happen to coincide here because of the specific power of the logarithm. Wealth independence is a property of Constant Relative Risk Aversion, of which log utility is a special case. Horizon independence is a property of myopia, which log utility possesses but other Constant Relative Risk Aversion utilities do not necessarily share in all contexts. However, in your specific betting setup with independent rounds, they are practically linked because the mechanism that removes wealth from the equation also removes the need to hedge against future changes in investment opportunities. When you break scale invariance with an additive term, you usually break both independences because the value function can no longer separate into a clean time component and a clean wealth component. The state space becomes coupled, meaning your best move now depends on where you are, how much time you have, and how far you are from any absolute boundaries you have introduced.

  To give you a tight definition you can use for future perturbations, you can test for scale invariance by asking whether multiplying all monetary values in the problem by a constant factor k changes the optimal decision. If you have a floor under the bankroll, you must ask if that floor is a fixed dollar amount or a fraction of the starting bankroll. A fixed dollar floor, such as never dropping below one hundred dollars, breaks scale invariance because the constraint binds differently for different wealth levels, forcing the optimal fraction to depend on how close you are to that absolute floor. A proportional floor, such as never dropping below ten percent of your starting wealth, preserves scale invariance because the constraint scales with you. Similarly, a requirement to withdraw a fixed dollar amount every round acts exactly like a fixed fee, introducing an absolute scale that makes the bet size depend on your current bankroll relative to that withdrawal amount. A requirement to withdraw a fixed percentage preserves the property. So the rule of thumb is that any rule or constraint that can be expressed purely in ratios preserves the clean Kelly fraction, while any rule or constraint that requires an absolute unit of account collapses the symmetry and forces you into a state-dependent strategy table. You have effectively carved the landscape correctly, and your term scale-shaped was pointing directly at the concept of homogeneity that underpins almost all solvable models in quantitative finance.
