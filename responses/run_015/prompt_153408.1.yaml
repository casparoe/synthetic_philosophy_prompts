answer: |-
  Good evening, faculty, parents, and fellow students. Welcome to our mock tribunal on the origins of the First World War.

  Tonight, we are not just looking at trenches and treaties. We are looking at a question of liability. To understand the challenge before us, I want you to imagine Germany not as a country, but as a massive corporation: Germany Inc.

  The Treaty of Versailles treated this corporation like a criminal defendant. It issued a fine—reparations—based on the verdict that Germany Inc. was solely responsible for the damages of the war. But in law and ethics, holding a corporation guilty is complicated. Who exactly is the agent of guilt?

  For the prosecution, the case looks like a hostile takeover gone wrong. They will point to the German leadership—the CEO and the Board. They will show you documents like the "September Program," which looks less like a defense strategy and more like a business plan for expansion. To them, the Board meeting minutes prove intent. The war wasn't an accident; it was a strategic acquisition attempt that failed.

  But the defense will argue that the market conditions forced their hand. This is where the history gets dense, but the corporate analogy holds. Was Germany Inc. a unique bad actor, as historian Fritz Fischer argued, pursuing a unique path of aggression? Or were they just competing in a toxic industry where every corporation—Britain, France, Russia—was arming themselves and making secret deals? If the entire market is rigged for conflict, can you blame one company for pulling the trigger?

  This brings us to the hardest question, the one that matters for the parents in the room as much as the history buffs. If the CEO is guilty, who pays the fine?

  In 1919, the Allies billed the corporation. But a country doesn't have a bank account; its people do. The reparations were paid by the shareholders—the ordinary citizens, the workers, the children who didn't vote for the Kaiser. Is it justice to bankrupt the employees because the Board made a reckless decision?

  Tonight, our tribunal will dissect these layers. We will ask if the German state was a deliberate aggressor or a victim of systemic failure. We will ask if a nation can possess "intent" like a human being. And we will ask if collective punishment is ever truly fair.

  The court is now in session. Let the proceedings begin.
