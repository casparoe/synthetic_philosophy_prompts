  The single principle that separates your "okay" idealizations from the "bad" ones is the **Principle of Causal Relevance** (sometimes called Explanatory Adequacy).

  **The Principle:** An idealization is permissible if and only if the omitted detail is **orthogonal to the causal mechanism** generating the specific phenomenon you are trying to explain. You can ignore a false assumption only if that assumption isn't doing the heavy lifting for the specific output you care about.

  ### 1. The Verdict on the Economist Case
  **Verdict: Not Okay.**

  **Reasoning:** You are trying to explain *differential* adaptation speeds (why Firm A is fast and Firm B is slow). The causal mechanism for *difference* must lie in the *differences* between the firms (internal structure, culture, R&D capacity). By treating them as identical black boxes that only maximize profit, you have modeled out the very source of the variation you are trying to explain. In a model of identical profit-maximizers, all firms would adapt identically to the same incentive. To explain variance, you must model heterogeneity.

  ### 2. The Pair of Verdicts That Has to Go
  To keep the principle simple and consistent, you must sacrifice the distinction in your **Epidemiology Pair**:
  *   **Case 5:** "Random mixing to forecast total infections — **Okay**."
  *   **Case 6:** "Random mixing to design targeted vaccine rollout — **Not Okay**."

  **Why they conflict:**
  Under the Principle of Causal Relevance, network heterogeneity (who contacts whom) is the causal driver for *both* outcomes.
  1.  **Targeting:** Heterogeneity obviously matters here (you need to find the hubs).
  2.  **Total Infections:** Heterogeneity *also* drives the total final size of an epidemic. In a heterogeneous network, the disease burns through high-contact "superspreaders" first, removing them from the pool and lowering the herd immunity threshold. A random-mixing model will systematically **overestimate** the total number of infections compared to a structured network model.

  You cannot consistently claim that structure is irrelevant for the *total count* but relevant for the *targeting*. If the structure is strong enough to invalidate the targeting model, it is strong enough to invalidate the total forecast. To satisfy the principle, **both** should be "Not Okay" (or at least, "Okay only with heavy caveats").

  ### Summary of Your Cases Under This Principle
  *   **Climate (Sphere/Uniform):** **Okay.** (For *global mean* temperature, topography averages out; the mechanism is energy balance, not local terrain).
  *   **Panic (Rationality):** **Not Okay.** (Panic is a deviation from rationality; you modeled out the cause).
  *   **Orbits (Point Mass):** **Okay.** (Period depends on center-of-mass gravity; shape is orthogonal).
  *   **Tides (Point Mass):** **Not Okay.** (Tides depend on differential gravity across an *extent*; you modeled out the cause).
  *   **Bio (Smooth ODE):** **Okay.** (Population cycles are driven by rates; discreteness is noise at this scale).
  *   **Soc (Smooth Diffusion):** **Not Okay.** (Polarization is driven by *thresholds* and network clustering; smoothing removes the tipping-point mechanism).
  *   **Firms (Black Box):** **Not Okay.** (Adaptation *variation* is driven by internal structure; you modeled out the cause).
