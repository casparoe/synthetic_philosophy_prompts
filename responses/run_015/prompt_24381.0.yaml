answer: |-
  ### Exam Question

  **Time Allowed:** 50 Minutes
  **Word Limit:** Approx. 600 words

  **Question:**
  It is often claimed that algorithmic fairness is subject to an "impossibility theorem," implying that competing fairness definitions are logically incompatible. Critically evaluate this claim. Specifically, identify the empirical conditions under which these criteria become mutually exclusive. Does the existence of this statistical tension resolve the normative question of which fairness criterion should be prioritized in practice? Explain.

  ***

  ### Model Answer

  The claim that algorithmic fairness is governed by an "impossibility theorem" is frequently misinterpreted as a logical prohibition, suggesting that no risk score can ever satisfy multiple fairness criteria simultaneously. This is a misconception. The incompatibility results established by scholars such as Chouldechova (2017) and Kleinberg et al. (2016) do not demonstrate a logical contradiction inherent to the definitions themselves. Rather, they demonstrate a **conditional statistical incompatibility** driven by the empirical structure of the data, specifically the prevalence of the outcome variable across groups.

  To understand this, consider three common criteria: **Demographic Parity** (equal selection rates), **Calibration within Groups** (risk scores mean the same thing across groups), and **Equalized Odds** (equal true positive and false positive rates across groups). It is mathematically possible to satisfy all three simultaneously, but only under restrictive conditions. The primary driver of incompatibility is **unequal base rates** (i.e., when the true prevalence of the outcome, $P(Y=1)$, differs between the protected groups).

  If the base rates are equal across groups, a predictor can be both calibrated and satisfy equalized odds. Similarly, if the predictor is perfect (accuracy = 100%), all criteria converge. However, in real-world social contexts—such as recidivism or loan default—base rates often differ due to historical or structural factors. When base rates differ and prediction is imperfect, the mathematics dictates that you cannot simultaneously satisfy Calibration and Equalized Odds. For instance, if Group A has a higher base rate of the outcome than Group B, a calibrated model must assign higher average risk scores to Group A. Consequently, Group A will inevitably suffer a higher false positive rate (if thresholds are equal) or a different selection rate, violating Equalized Odds or Demographic Parity.

  Therefore, the "impossibility" is not absolute; it is contingent on the world being unequal (unequal base rates) and our models being fallible. Framing this as an inherent logical impossibility obscures the actual source of the tension: the underlying disparity in outcome prevalence.

  This distinction is crucial for the normative evaluation of algorithmic systems. The mathematical result describes a trade-off space, but it does not dictate which point in that space is morally preferable. Knowing that Calibration and Equalized Odds are incompatible when base rates differ does not tell a policymaker which criterion to sacrifice.

  Choosing between them requires a **normative judgment** about the nature of the harm being mitigated. Prioritizing Calibration ensures that a risk score of "70%" implies the same probability of recidivism regardless of race, which supports individual accuracy and utilitarian efficiency. Prioritizing Equalized Odds ensures that the burden of false positives (e.g., being wrongly denied bail) is distributed equally across groups, which supports a deontological commitment to equal treatment and opportunity.

  The mathematics clarifies the cost of these choices: you cannot have both equal error rates and equal predictive meaning when base rates differ. However, the math cannot determine whether equal error rates are more important than predictive accuracy. That decision rests on ethical principles regarding justice, equity, and the specific context of deployment. Thus, the impossibility result should not be viewed as a barrier to fairness, but as a tool that forces stakeholders to explicitly articulate which conception of fairness they value most, rather than hiding behind the illusion that a technically "perfect" fair solution exists.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### **A Grade (80-100 marks): Excellent/Critical**
  To achieve an A, the answer must move beyond description to critical analysis of the *conditions* and *implications* of the theorem.
  *   **Specific Move 1 (Base Rate Condition):** Explicitly identifies **unequal base rates** (and imperfect prediction) as the specific empirical condition required for the incompatibility to hold.
      *   *Common Error:* States the criteria are always incompatible or attributes the conflict solely to "bias" without specifying base rate disparity.
  *   **Specific Move 2 (Conditional vs. Absolute):** Clearly distinguishes between a **logical impossibility** (contradiction in terms) and a **statistical incompatibility** (contingent on data distribution).
      *   *Common Error:* Refers to it as an "absolute impossibility theorem" without qualifying that it vanishes if base rates are equal.
  *   **Specific Move 3 (Normative Judgment):** Argues that the math identifies a trade-off but **does not resolve the normative choice**; selecting a metric requires ethical reasoning.
      *   *Common Error:* Suggests the math tells us which metric to drop (e.g., "therefore we must drop demographic parity").

  #### **B Grade (60-79 marks): Competent/Descriptive**
  To achieve a B, the answer must demonstrate technical understanding but may lack critical nuance regarding the contingency or normative implications.
  *   **Requirement:** Correctly names at least two fairness criteria (e.g., Calibration, Equalized Odds) and states they cannot be satisfied simultaneously.
  *   **Requirement:** Mentions that base rates play a role in the conflict.
  *   **Requirement:** Acknowledges that a choice must be made between criteria.
  *   **Deficiency for A:** May treat the impossibility as more absolute than it is, or fail to explicitly argue that the *mathematics itself* is normatively neutral regarding the choice.

  #### **C Grade (50-59 marks): Basic**
  *   **Requirement:** Defines fairness criteria correctly.
  *   **Deficiency:** Claims the criteria are incompatible without explaining *why* (base rates) or treats the impossibility result as a reason to abandon fairness metrics entirely.

  #### **Fail (<50 marks)**
  *   **Deficiency:** Fundamental misunderstanding of the criteria (e.g., confusing Calibration with Demographic Parity) or claims that a single metric can satisfy all definitions simultaneously in all cases.
