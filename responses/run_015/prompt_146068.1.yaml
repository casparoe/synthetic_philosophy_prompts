answer: |-
  Here is a battle plan for your forty-five minutes. It is designed for your specific audience: people who respect data, distrust vagueness, and suspect philosophy is often just confused physics.

  ### 1. The Opening: Distinguishing the Old from the New (Minutes 0–5)

  **The Trap:** If you start with "Hume," you lose them. They think Hume is the guy who said "induction is irrational," and they dismiss him because "induction works, look at semiconductors."

  **The Move:** Do not frame this as a problem of *justification*. Frame it as a problem of *discrimination*.

  *   **Flip Chart:** Draw two columns.
      *   **Left (Hume):** "Why expect the future to resemble the past?" (The Validity Question).
      *   **Right (Goodman):** "Given that we *do* expect the future to resemble the past, *which* resemblances count?" (The Selection Question).
  *   **The Script:** "Hume asks if we are allowed to drive the car. Goodman grants we are driving, but asks: there are infinite roads compatible with the tire tracks behind us; how do we know which lane we are actually in? We are not asking if induction is valid. We are asking what distinguishes a law-like hypothesis from an accidental generalization."
  *   **Crucial Point:** Emphasize that Goodman is not a skeptic. He is a descriptivist. He wants to know how we *actually* distinguish valid predictions from invalid ones, given that both fit the past data.

  ### 2. The Carrying Example: "Dulbrit" vs. "Gron" (Minutes 5–15)

  **The Decision:** Use **Dulbrit**.
  *   **Why:** "Gron" (Granite/Basalt) is logically cleaner for blocking time-indexing, but it is geologically abstract. "Dulbrit" leverages your shared history with instrumentation and calibration. It feels like *work*.
  *   **The Risk:** Physicists will argue that ductility changing after June is a physical phase transition.
  *   **The Fix:** You must define the predicate strictly as a *classification rule*, not a physical claim.

  **The Setup on the Flip Chart:**
  1.  **Define the Predicate:** "A specimen is *dulbrit* if and only if: (Tested before June 1 AND Ductile) OR (Tested after June 1 AND Brittle)."
  2.  **The Data:** "We have tested 10,000 specimens. All were tested before June 1. All were Ductile."
  3.  **The Inference:**
      *   Hypothesis A: "All specimens are Ductile." -> Prediction: Specimen 10,001 (tested July 1) will be **Ductile**.
      *   Hypothesis B: "All specimens are Dulbrit." -> Prediction: Specimen 10,001 (tested July 1) will be **Brittle**.
  4.  **The Kicker:** "Both hypotheses are perfectly supported by the 10,000 data points. Both are logically consistent with the evidence. They yield contradictory predictions. Why do we bet on A and not B?"

  **What the Example Must Contain:**
  *   **Identical Support:** Emphasize that the *evidence* for "Ductile" and "Dulbrit" is numerically identical.
  *   **Contradictory Futures:** The predictions must diverge sharply.

  **What the Example Must Conspicuously Lack:**
  *   **Physical Mechanism:** Do not allow the discussion to drift into *why* the material might change. This is not about materials science; it is about the logic of confirmation. If they argue mechanism, stop them: "Grant me that we have no theory, only the data stream."

  ### 3. Managing Misconceptions (Minutes 15–35)

  Your audience will produce objections in a specific order. Do not answer them immediately as they arise; park them on the side of the flip chart and address them in sequence. This shows you respect the objection but have a structure for it.

  **Order of Appearance & Handling:**

  1.  **"Grue/Dulbrit is a gerrymandered disjunction; it's not a real property."**
      *   *When:* Immediately after defining the example.
      *   *Response:* "Green" is also a disjunction (wavelengths 495–570nm). "Ductile" is a disjunction of atomic slip systems. Syntax doesn't decide projectibility. If we spoke "Grue-lish," *Green* would be the complex disjunction (Grue before *t*, Bleen after).
      *   *Action:* Park this. Tell them: "I will return to why 'natural' syntax fails us."

  2.  **"Natural Kinds settle this. Electrons are real; Dulbrit is not."** (The Physicist's Shield)
      *   *When:* As soon as they feel the threat to their methodology.
      *   *Response:* **Let this stand unanswered for a while.** This is the core tension. Let them sit in the discomfort.
      *   *Later Payoff:* When you return to it, ask: "How did you learn 'Electron' is a natural kind? Because it supported successful predictions in the past. But 'Dulbrit' also supports successful predictions in the past. You are using projectibility to define natural kinds, and natural kinds to define projectibility. That is the circle Goodman is pointing at."

  3.  **"It's just Simplicity / Occam's Razor."**
      *   *When:* When they realize Natural Kinds is wobbly.
      *   *Response:* Simplicity is language-relative. "All emeralds are grue" is simpler than "All emeralds are green" if your primitive predicates are Grue and Bleen. Occam's Razor requires a prior metric of complexity, which is exactly what is in question.

  4.  **"This is just skepticism about the future."**
      *   *When:* Near the end, as a defensive retreat.
      *   *Response:* Reiterate the opening. "Skepticism says we can't predict. Goodman says we *do* predict, and we need to explain how we distinguish the good predictions from the bad ones without begging the question."

  ### 4. Goodman's Sketch of a Solution (Minutes 35–40)

  Do not try to solve it. Goodman's solution (Entrenchment) is controversial. Present it as a *dissolution* of the problem rather than a metaphysical fix.

  *   **The Concept:** Predicates are projectible because they have a history of successful projection. "Green" is entrenched; "Dulbrit" is not.
  *   **The Flip Chart:** Draw a timeline of usage. "Green" has a long track record of surviving projections. "Dulbrit" is new.
  *   **The Honest Admission:** "This looks circular. We project what we have projected before." Acknowledge this. Goodman accepts this circularity. He is not offering a foundationalist justification (like a mathematical proof); he is offering a coherentist description of our practices. We validate induction by the specific inductive inferences we accept, and we accept those inferences because they fit our inductive habits.

  ### 5. What to Explicitly Decline (Minutes 40–42)

  To maintain credibility and time, explicitly list what you are *not* doing. Write this on the chart:

  1.  **The Circularity in Entrenchment:** "We will not solve the charge that entrenchment is circular. We will accept it as a feature of coherentism."
  2.  **The Grue/Bleen Translation Argument:** "We will not argue whether Grue can be translated into Green without loss. That is a linguistic debate, not a confirmation debate."
  3.  **Bayesian Formalisations:** "We will not attempt to solve this with priors. Assigning a low prior to Grue assumes the solution we are looking for."

  ### 6. The Closing Question (Minutes 42–45)

  Do not ask for summary. Ask for application. This distinguishes those who understood the *logic* from those who just heard the *story*.

  **The Question:**
  "Imagine you are reviewing a paper. The author proposes a new parameter, call it 'Z-charge,' which fits all existing data perfectly but is defined using a time-indexed disjunction similar to 'Dulbrit.' They claim it is a new law. You reject it. **Without using the words 'entrenchment,' 'history,' or 'past success,' justify your rejection.**"

  *   **Why this works:** If they say "It's not physical," you ask "How do you know?" If they say "It's complex," you ask "In which language?" If they struggle, they have understood the Riddle: there is no *ahistorical* logical ground for the rejection, only a pragmatic one.

  ### Summary of Logistics

  *   **Flip Chart Layout:**
      *   Left: Hume (Validity) vs. Goodman (Selection).
      *   Center: The Dulbrit Definition & The Divergent Predictions.
      *   Right: The "Parking Lot" for Misconceptions (Gerrymander, Natural Kinds, Simplicity).
      *   Bottom: The Closing Question.
  *   **Tone:** "I am not teaching you philosophy. I am showing you a bug in the operating system we both use."
  *   **Key Victory Condition:** If they leave feeling that "Natural Kind" is a label we paste on successful predicates, rather than a metaphysical stamp that makes them successful, you have succeeded.

  You are not asking them to become philosophers. You are asking them to recognize that the "scientific method" contains a step that cannot be formalized without reference to its own history. That is a comfortable discomfort for a retired experimentalist.
