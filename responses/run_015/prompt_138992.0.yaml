prompt: |-
  hey — I'm in a philosophy of computation seminar this term and the final paper is an "agenda" paper: pick the open questions about the Church–Turing thesis you think most deserve someone's next chunk of conceptual work and defend the ordering. We're explicitly told not to turn in a survey or a mini lit review, so I need an actual argument for why some questions come first.

  About me: I've done the Sipser-level computability material plus a bit of recursion theory (turing degrees, oracle machines, I can follow proofs about the arithmetical hierarchy even if I couldn't produce them), I'm comfortable with formal epistemology, and I have basically no physics past first year — so anything that really turns on relativity or quantum foundations is off the table for me. One seminar's worth of time, about 5,000 words.

  The part I want your help with is this, and its the bit I can't find discussed anywhere. Take this scenario seriously as a thought experiment: we build a finite physical device that, for every program under N bits, prints the correct answer to whether it halts, and for anything longer it just runs forever or stays silent. We can't verify its answers in general — the only cases we can check are ones where we already had a proof by other means, and on those it's never once been wrong, over a few million trials. Nothing infinite happens in a single step; it's a finite box obeying ordinary-looking physics. And yet it seems to be telling us things no algorithm can. Except — someone in my seminar said the whole thing is a non-starter, because any function on a finite domain is trivially computable by a lookup table, so the box computes a recursive function and there's nothing to see. I don't think that settles it, but I can't say exactly why. (If it helps, there's also a variant where N creeps upward a little every year and nobody can predict where it stops.)

  So, given that setup — and please tell me if you think the setup itself is incoherent or if the lookup-table objection does kill it — how would you rank the questions worth writing on? The candidates I keep circling: whether the existence of such a box would touch the thesis at all or only some "physical" reading of it; whether "effective procedure" or "computable by a human following a rule" is determinate enough for the informal thesis to have a truth value in the first place; whether the thesis is best understood as a definition, an empirical claim, a disguised theorem, or a methodological constraint on what we're willing to call a computation; and how much turns on treating it as one claim versus a family of loosely related ones. Also: which of the usual obsessions are overrated and I should just skip? I suspect at least one of quantum computing's relevance, the Lucas/Penrose-style argument from mathematical insight, and the "is it even falsifiable" debate is a sink, but I can't tell which.

  Defend the ordering with real criteria — importance, tractability for someone with my background and no physics, how many other questions hang off each one — say what you'd deprioritize and why, and say what kind of evidence or argument over the next few years would move something up or down the list. And if you think my box is the wrong lens on the whole topic, say so and hand me a better one.
