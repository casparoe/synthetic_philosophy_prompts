answer: |-
  **1. The Scenario**
  Atlantic salmon in a high-density sea cage. Fish hover lethargically near the bottom, flashing erratically when divers approach. Feed is ignored by subordinates. Baseline plasma cortisol is low; an ACTH challenge yields a flat response. Opercula beat rapidly. Post-mortem shows visceral fat accumulation and reduced muscle tone.

  **2. The Verdicts**
  **Affective Account:** Welfare is poor. The low cortisol indicates HPI axis exhaustion (burnout), not calm. Rapid opercula and avoidance behavior signal chronic anxiety and learned helplessness. The animal is suffering negative subjective states.

  **Natural Function Account:** Welfare is poor. High density prevents sustained swimming and micro-habitat selection. Visceral fat and low muscle tone indicate the fish cannot exercise species-specific capacities. The animal is biologically compromised, regardless of hormonal baseline.

  **3. The Interventions**
  **Affective Fix:** Increase feed frequency and energy density. This alleviates subjective hunger and fatigue.
  *Backfire:* Accelerates visceral fat deposition, compressing swim bladders and reducing buoyancy control. The fish becomes physically incapable of natural swimming behaviors (Function worsens).

  **Function Fix:** Increase current speed and restrict feed to lean muscle targets. This improves muscle tone and organ health.
  *Backfire:* Increases energy expenditure without intake, intensifying subjective feelings of hunger and exhaustion. The animal feels worse even if it is physically robust (Affective worsens).

  **4. The Key Feature**
  The down-regulated stress axis. If cortisol were high, both accounts would agree on "stress" and likely agree on lowering density. The ambiguity of the low number forces the split: the Affective account reads it as internal collapse (feelings), while the Function account reads it as external constraint (capacity). Remove the physiological ambiguity, and the case collapses into a standard consensus on reducing density.

  **5. The Defenders**
  **Affective Defender:** "Capacity is irrelevant if the animal suffers. A fat, calm fish is better than a lean, hungry one. Welfare is about what it feels like to be the fish."

  **Function Defender:** "Feelings are ephemeral proxies. A biologically robust animal fulfills its telos, even if hungry. Health and natural functioning are welfare; subjective states are secondary."
