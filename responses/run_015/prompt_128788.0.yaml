answer: |-
  Let's begin by tracing how the text handles Gregor's identity over time, because this sets the stage for the metaphysical categorization. When Gregor wakes, he possesses full autobiographical memory, concern for his family's debt, and aesthetic appreciation for his sister's violin playing. These are psychological continuity markers that typically sustain personal identity in philosophical thought experiments. However, the text simultaneously insists on a radical physical discontinuity: he cannot speak, he crawls on walls, and he prefers rotting food. The narrative does not resolve this tension; it sustains it until death. Gregor considers himself Gregor, but his capacity to act as Gregor diminishes as his body dictates new instincts. The text treats his identity not as a fixed point but as a decaying function dependent on the interaction between his internal self-conception and his external bodily capacities. If identity were purely psychological, the family's rejection would be irrational error; if purely physical, Gregor's internal monologue would be a lie. The story forces us to hold both: he is psychologically continuous but physically alien, creating a fissure where metaphysical categorization struggles to stand.

  Now we apply the distinction between universals and particulars, specifically looking at sortals. If "human" is a substance sortal, it defines what Gregor essentially is; to cease being human is to cease existing. Under this view, the Gregor who woke up on Tuesday is dead, and a new substance (the insect) occupies his spacetime location. This aligns with a bare particular account where the underlying substratum remains but loses the essential universal of "humanity." However, the text complicates this because Gregor's consciousness survives the loss of the substance sortal. If we switch to a phase sortal view, "human" is merely a stage like "larva," and Gregor survives the transition. This fits a bundle theory of objects: Gregor is a collection of properties (memories, body shape, social role), and when the bodily properties shift, the bundle alters but persists. Yet, the family's behavior pushes toward a nominalist reading where universals are not inherent but imposed. When the sister declares "it" must go, she is not discovering an ontological fact but performing a social one. She withdraws the universal "brother" from the particular standing before her. The apple lodged in his back is crucial here: it is not just a physical property added to the bundle; it is a material signifier of the family's violence that becomes part of his constitution. The rotting apple bridges the metaphysical and the ethical, showing that his properties are not just inert traits but records of relational history.

  This is where the reading breaks, because analytic metaphysics seeks determinate truth conditions while the novella thrives on ontological horror derived from indeterminacy. If we treat Gregor as a bare particular, we ignore the suffering caused by the loss of recognition; if we treat him as a bundle, we cannot explain why the loss of speech matters more than the retention of memory. The text pushes back against treating Gregor as a thought experiment because the metaphysical question ("What is he?") is less important than the phenomenological one ("How is he experienced?"). Metaphysics asks whether the universal "human" is instantiated in the insect body, but Kafka shows that instantiation depends on the observer's willingness to sustain it. The sister's shift from care to disgust is not an epistemic correction but an ethical failure that retroactively alters Gregor's ontological status in the social world. To force a strict substance or phase sortal classification is to resolve the ambiguity that generates the story's tragedy. The horror lies precisely in the fact that Gregor is metaphysically ambiguous: he is too human to be vermin, yet too vermin to be human, and the text refuses to let us settle on a category that would absolve the family of their cruelty or Gregor of his suffering.

  Summary: The novella resists metaphysical resolution by demonstrating that humanity is not an intrinsic property but a relational status sustained by recognition.
