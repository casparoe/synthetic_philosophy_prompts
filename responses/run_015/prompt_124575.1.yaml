prompt: |-
  I'm running a philosophy reading group — about 8 people, 75 minutes — and we've been looking at Lewis on convension and how norms evolve. This suddenly feels personal because my flatmate and I have somehow developed this arbitary rule about who stacks the dishwasher, neither of us remembers agreeing it, yet breaking it now feels genuinely wrong. I want the group to hit that same feeling: a solution that is totally made-up but still binds you. Can you design an in-class game where they have to coordinate silently on a shared task, but each round one player draws a noise card that makes their usual gesture misread by someone else? They need to build a new convention around the error without speaking. Give me rules, a token payoff (not real money), a rough timeline, and a debrief that maps the moment they feel stuck but obliged onto Lewis's conditions, says what will predictably go wrong first run, and is honest about which bit of Lewis's account the game just can't reproduce. Please say how confident you are this will actually work, and single out the part you're least sure about — I worry the noise-card mechanic just breaks coordination rather than forcing a norm to emerge.
