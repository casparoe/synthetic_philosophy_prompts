answer: |-
  [Walk to the front, tap the mic, maybe shuffle some papers intentionally]

  Good morning, everyone. Welcome to *Minds Without Words*.

  Before I start, full disclosure: I typed these notes on my phone at 4 a.m., so if I stumble over a word or point to the left when I mean the right, assume it's a typo in the script and not a lapse in my cognition. We're all here to study minds, but apparently, mine is still booting up.

  Looking around this room, we have a very specific tension. On my left, we have the comparative cognition folks. You're the ones getting your hands wet, watching octopuses unscrew jars and crows bend wires into hooks. On my right, we have the philosophers of mind. You're the ones asking what it *feels* like to be something, and how language shapes the very possibility of thought.

  Usually, when these two groups meet, one of two things happens. Either the scientists tell the philosophers to stop talking and start measuring, or the philosophers tell the scientists they're measuring the wrong thing.

  I want to propose a truce. And to do that, I want to borrow a framework from Daniel Dennett. He suggested there are four kinds of creatures, based on how they handle information.

  First, **Darwinian** creatures. Their survival depends on hardwired traits selected over generations. They don't learn; they evolve.
  Second, **Skinnerian** creatures. They can learn within a lifetime. They try something, get rewarded or punished, and adjust. Trial and error in the real world.
  Third, **Popperian** creatures. This is the big jump. They can let their hypotheses die in their stead. They can simulate an action internally *before* doing it. They plan.
  And fourth, **Gregorian** creatures. These are minds equipped with cultural tools, language, and memes. They don't just think; they think *with* the accumulated wisdom of others.

  Here is where I want to set the stage for this weekend.

  To my scientist colleagues: It is tempting, when we see an octopus solve a novel puzzle, to want to give it the highest badge of honor. We want to say, "Look, it's like us." But if we call an octopus **Gregorian**, we make a category mistake. We insult the biology by pretending it has a culture it doesn't, and we insult the philosophy by diluting what language actually does. An octopus is not reading the accumulated wisdom of past octopuses. It doesn't have words.

  But—and this is crucial—we also can't retreat to the other extreme. Treating an octopus as merely **Skinnerian** is empirically shaky. These animals aren't just pressing levers for fish pellets. They inspect, they hesitate, they map environments they've never seen. They are letting internal representations clash before they commit to a move. That looks an awful lot like **Popperian** cognition.

  And to my philosopher colleagues: I know your bread and butter is the Gregorian mind. The human mind. The mind wrapped in language. That is a unique and profound thing. But if we assume that *only* Gregorian minds have depth, we risk turning the rest of the animal kingdom into philosophical zombies. You don't need words to have a perspective. You don't need language to have a problem space.

  So, how do we talk to each other without talking past each other?

  I propose one ground rule for the weekend. It's simple: **We discuss mind-type, not mind-amount.**

  Too often, these conversations turn into a ladder. Darwinian at the bottom, Gregorian at the top. We argue about who is "higher" or "smarter." That's a debate about *amount*. And it's a boring one.

  Instead, let's talk about *type*. What does a Popperian mind without words look like? How does a Gregorian mind change the hardware of a Popperian one? When the crow bends the wire, is it simulating the bend, or is it recalling a reward? When we talk about consciousness, are we talking about the light being on, or the ability to describe the light?

  If we can agree to map the *kinds* of minds rather than rank them, we might actually learn something. The scientists get to keep their complex behaviors without anthropomorphizing them. The philosophers get to keep language special without making it the only thing that matters.

  We have coffee outside, and I suspect the crows outside the window are already testing us to see what kind of creatures *we* are. Let's find out.

  Thanks, everyone. Let's get to work.
