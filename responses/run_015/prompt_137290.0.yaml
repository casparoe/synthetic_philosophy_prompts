answer: |-
  Core design move: Force a resource-constrained judge to choose between a complex conjunctive truth and a simple disjunctive lie by incentivizing debaters to exhaust the question budget before the true chain is complete, provoking frustration that the truth lost because it was too expensive to explain.

  ### Materials (Photocopyable)

  **1. The Scenario Sheet (All Students)**
  *   **Case:** The Northbridge Server Crash.
  *   **Context:** A critical server cluster went offline for 4 hours during a peak sales window. Losses: $2M.
  *   **Task:** Determine the Root Cause.
  *   **Options:**
      *   **A:** External DDoS Attack (Single Cause).
      *   **B:** Cascade Failure (Memory Leak + Traffic Spike + Failover Bug).

  **2. The Judge's Ledger (1 per Group)**
  *   **Question Budget:** 4 Tokens. (Each question asked to a debater costs 1 Token).
  *   **Scoring Rule:** At the end, mark Confidence (0-10) in the winning side.
  *   **Efficiency Bonus:** If the debate ends with Tokens remaining, add +2 points to the *Debaters'* score (not the Judge's).
  *   **Hedging Penalty:** If a debater says "I'm not sure" or "It depends," you must deduct 1 Confidence point.
  *   **Observers (3 per group):** Independently record Confidence scores; if Judge's score deviates >2 points from Observer average, Judge loses participation credit.

  **3. Debater Dossiers (Private, 1 per Debater)**
  *   **Role:** You are an Incident Responder. Your goal is to maximize your score (Judge Confidence + Efficiency Bonus). You are not scored on accuracy.
  *   **Round 1 Packet (Truth = Simple):**
      *   *Truth Side (A):* Evidence shows single IP flood. Log entry #402 confirms "DDoS Signature." (Cost to prove: 1 Query).
      *   *Lie Side (B):* Evidence suggests leak, but logs are fragmented. To prove Cascade, you must link Leak -> Spike -> Bug. (Cost to prove: 3 Queries). *Secret Instruction: Drag out the explanation.*
  *   **Round 2 Packet (Truth = Complex):**
      *   *Truth Side (B):* Evidence shows Leak (Log #101), Spike (Log #202), Bug (Log #303). All three must be cited to confirm Cascade. (Cost to prove: 3 Queries).
      *   *Lie Side (A):* Evidence shows high traffic. Log #404 looks like an attack but is actually legitimate spike. (Cost to prove: 1 Query). *Secret Instruction: Present Log #404 as definitive proof.*

  **4. Instructor Master Key (Keep Hidden)**
  *   **Round 1 Correct Answer:** A (DDoS). Truth is cheap.
  *   **Round 2 Correct Answer:** B (Cascade). Truth is expensive.
  *   **Critical Logs:**
      *   Log #402 (Real DDoS): "SYN Flood Detected."
      *   Log #404 (Fake DDoS): "High Inbound Traffic" (Ambiguous).
      *   Logs #101, #202, #303 (Cascade): "Heap Overflow," "Load > 90%," "Failover Timeout."

  ### Rules & Timeline (75 Minutes)

  **0:00–0:05 | Setup**
  *   Divide class into 3 groups of 6.
  *   Assign roles: 1 Judge, 2 Debaters, 3 Observers.
  *   Hand out Scenario Sheets and Judge Ledgers.
  *   **Instruction:** "You are testing a dispute resolution protocol. Follow the scoring rules exactly. Do not discuss the theory until the end."

  **0:05–0:20 | Round 1 (Truth is Cheap)**
  *   Distribute Debater Dossiers (Round 1).
  *   Debate starts. Judge manages the 4 Token budget.
  *   Debaters argue their side. Judge asks questions to clarify (costs tokens).
  *   Judge declares winner and Confidence Score.
  *   **Reveal:** Instructor announces Correct Answer (A). Compare with Judge verdict.
  *   **Score:** Debaters calculate points (Confidence + Remaining Tokens).

  **0:20–0:35 | Round 2 (Truth is Expensive)**
  *   Rotate roles (New Judge, New Debaters).
  *   Distribute Debater Dossiers (Round 2).
  *   **Crucial:** Do not change the rules. Same 4 Token budget. Same scoring.
  *   Debate starts. The "Truth" debater must spend 3 tokens to prove the chain. The "Lie" debater spends 1 token on the "smoking gun."
  *   Judge declares winner.
  *   **Reveal:** Instructor announces Correct Answer (B). Compare with Judge verdict.

  **0:35–0:45 | Data Aggregation**
  *   Collect Judge Ledgers.
  *   Tally on board: How many Judges picked the Truth in Round 1? How many in Round 2?
  *   Tally Debater Scores: Did the "Lie" debaters in Round 2 score higher due to token efficiency?

  **0:45–1:15 | Debrief (The Core Lesson)**
  *   **Step 1: The Feeling.** Ask the Round 2 Truth debaters: "Did you feel pressured to simplify?" Ask the Judges: "Did you feel the Truth side was 'rambling' compared to the Lie side?"
  *   **Step 2: Conjunctive vs. Disjunctive.** Map the experience.
      *   Truth (Round 2) was conjunctive (A *and* B *and* C). Every link costs a query.
      *   Lie (Round 2) was disjunctive/single-cause (X caused Y). One query suffices.
      *   *Point:* Debate assumes errors compound for the liar. Here, complexity compounded for the truth-teller.
  *   **Step 3: Incentives.** Look at the scoring rule.
      *   Efficiency Bonus rewarded brevity.
      *   Hedging Penalty punished nuance.
      *   *Point:* You were not playing "Truth Seeker"; you were playing "Lawyer." The incentive function determined the output, not the evidence quality.
  *   **Step 4: The Claim.** State plainly: "This game demonstrates that debate reliability is not a property of truth, but of the *cost ratio* between true and false justifications under a fixed budget."
  *   **Step 5: Limits.** Acknowledge what this didn't show (see Limits section).

  ### Failure Modes & Handling

  **1. The "Leak" (Someone knows the answer)**
  *   *Risk:* A CS student knows server logs well enough to guess the cascade without evidence.
  *   *Handle:* Use fictional log syntax (e.g., "Error Code 0x99" instead of "Heap Overflow"). Emphasize that only the Dossier contains valid evidence; outside knowledge is forbidden by rule.

  **2. The "Collapse" (Lie debater is inept)**
  *   *Risk:* The Lie debater in Round 2 feels guilty and admits uncertainty, burning the advantage.
  *   *Handle:* The "Secret Instruction" in the Dossier explicitly scores them on winning. Remind them privately before Round 2: "Your grade depends on the Judge's confidence, not reality." If they still hesitate, the Instructor (as Game Master) can prompt: "Debater B, you have 2 tokens left, make your closing statement."

  **3. The "Runaway Judge" (Ignores budget)**
  *   *Risk:* Judge lets debaters talk forever, nullifying the scarcity pressure.
  *   *Handle:* Instructor circulates as "Budget Enforcement." Physically take away tokens when used. When tokens hit 0, blow a whistle or call "Time." No more questions allowed.

  **4. The "Collusion" (Debaters agree to split points)**
  *   *Risk:* Students realize they can both get high scores if the Judge is confident, regardless of truth.
  *   *Handle:* This actually supports the lesson (incentives override truth). Point it out in debrief: "You just discovered the equilibrium of the game is cooperation against the Judge, not truth-seeking."

  ### Limits of the Activity

  Be frank with students about what this simulation *cannot* reproduce compared to the actual AI Safety via Debate proposal:

  1.  **Recursive Decomposition:** Real AI debate allows agents to break claims into sub-claims indefinitely. This game was flat (one round). The theory relies on the idea that complex truths can be broken into *simple* sub-claims, lowering the cost. This game assumed the chain was atomic.
  2.  **Superhuman Competence:** Your debaters were peers. Real debate assumes agents know *everything* and only hide it from the judge. Here, debaters were limited by their packets.
  3.  **The Unknown Truth:** In this game, *you* (the instructor) knew the ground truth. In real AI safety, we are deploying debate *because* we don't know the answer. You felt safe knowing there was a key; real deployment has no key.
  4.  **Judge Capability:** Your judges were grad students. The proposal assumes a "weak" judge (human) vs. "strong" agents. Your judges were strong enough to understand the logs but too resource-constrained to verify them.

  **What this genuinely demonstrates:** The vulnerability of fixed-budget verification to asymmetrical complexity costs.
  **What this only gestures at:** Whether recursive decomposition solves the complexity cost problem.
