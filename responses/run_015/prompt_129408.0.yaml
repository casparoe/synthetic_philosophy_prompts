answer: |-
  **The Non-Human Turn: Agency, Determinism, and the Heterogeneity of Environmental Forces**

  For much of the twentieth century, professional historiography operated under a tacit agreement: history is the study of human action. While geography provided the stage and resources the props, the script was written by human will, political structures, and cultural ideas. However, the early twenty-first century has witnessed an "environmental turn," driven by the urgent realities of climate change and pandemic disease. This shift has prompted historians to ascribe historical agency to non-human forces—specifically pathogenic microbes, long-duration climate shifts, and sudden volcanic eruptions. Proponents argue this corrects an anthropocentric bias and properly registers the causal weight of the natural world. Critics counter that such framing obscures human social structures and revives the discredited specter of environmental determinism. This essay argues that a carefully delimited form of non-human agency is historiographically valuable, provided it is distinguished from intentional agency and applied with sensitivity to the differing temporal scales of environmental forces. The framework is tenable only if human vulnerability is treated not as a biological given, but as a political construct.

  The core of the controversy lies in the definition of "agency." In traditional humanistic inquiry, agency implies intentionality, consciousness, and the capacity to make choices. When historians ascribe agency to a virus or a volcano, they are not imputing consciousness to these entities. Rather, they are borrowing from post-humanist and Actor-Network Theory to define agency as the *capacity to effect change* within a network of relations. This distinction between mere causal efficacy and narrative agency is crucial. Causal efficacy is undeniable; the eruption of Mount Tambora in 1815 objectively cooled the global climate, causing the "Year Without a Summer." However, narrative agency enters the fray when the historian constructs a story where the volcano becomes a protagonist that "caused" social unrest or migration.

  The risk, as critics rightly note, is that emphasizing the narrative agency of non-humans can slide into environmental determinism. The old determinism of the late nineteenth century, associated with figures like Ellen Churchill Semple, suggested that climate and geography dictated the temperament and destiny of nations, often to justify colonial hierarchies. The new "non-human agency" risks a similar erasure if it suggests that a pathogen "destroyed" an empire without accounting for why that empire was vulnerable. For instance, to claim that *Yersinia pestis* alone caused the collapse of medieval social structures ignores the role of trade routes, grain storage practices, and public health responses that facilitated the bacterium's spread. If the microbe is the actor, the human becomes the passive victim. This obscures the differential vulnerability inherent in social structures. The Irish Potato Famine is the paradigmatic case: the phytophthora blight was the environmental trigger, but the starvation was produced by British political economy. To ascribe agency to the blight without qualifying it through the lens of colonial policy is to engage in a soft determinism that absolves human actors of responsibility.

  However, rejecting non-human agency entirely creates its own distortion: an anthropocentric hubris that assumes human societies are immune to biological and geological constraints. To correct this, historians must adopt a relational view of agency. Non-human forces do not act *upon* history from the outside; they act *within* history through their interaction with human systems. In this view, agency is not a property possessed by the microbe or the volcano, but an emergent property of the encounter between the non-human force and the human social order. This preserves the causal weight of the environment without erasing human politics. The virus has the efficacy to kill, but the society determines who dies and what political consequences follow.

  This relational approach necessitates a rejection of a single conceptual framework for all environmental forces. Pathogenic microbes, climate shifts, and volcanic eruptions operate on radically different temporal scales and modes of interaction, requiring distinct historiographical treatments.

  Pathogenic microbes exist in a co-evolutionary relationship with humanity. Their "agency" is intimate and biological. They mutate in response to human immune systems and medical interventions. Writing history with microbes as actors requires a bio-social framework where the boundary between the human body and the environment is porous. Here, agency is reciprocal; humans act on microbes (via sanitation, vaccines), and microbes act on humans (via morbidity, mortality). To treat this purely as an environmental shock is to miss the evolutionary dialogue.

  Long-duration climate shifts, such as the Little Ice Age or the Holocene thermal maximum, operate on a structural tempo. Their "agency" is not event-based but contextual. Climate does not usually issue a command; it sets parameters. It alters the carrying capacity of land, shifting the economic viability of agriculture or the navigability of trade routes. To ascribe narrative agency to climate in the same way one might to a battle is a category error. Climate acts as a slow-moving pressure that incentivizes certain political choices (e.g., centralization to manage water) while discouraging others. It is a stagehand that moves the scenery, sometimes forcing the actors to change their script, but rarely writing the lines itself.

  Sudden volcanic eruptions represent a third category: exogenous shocks. Unlike climate, which is systemic, or microbes, which are co-evolutionary, large-scale eruptions are external catastrophes. Their agency is closest to pure causal efficacy. They are "actants" in the Latourian sense—entities that modify a state of affairs simply by existing and erupting. However, even here, the historical outcome is not determined by the ash fall alone. The collapse of the Bronze Age civilizations, sometimes linked to volcanic activity in the Mediterranean, was not inevitable. It was the interaction of the shock with already fragile political networks that determined the outcome.

  Therefore, these three cases cannot be accommodated within a single, uniform framework of "environmental agency." To do so would flatten the specific dynamics of disease ecology, climatology, and geology into a monolithic "nature." A nuanced historiography must distinguish between the *provocation* of the non-human and the *response* of the human.

  Does this qualified position defend against the charge of determinism? Yes, but only if the historian remains vigilant about the politics of vulnerability. The ascription of non-human agency is defensible and valuable when it serves to highlight the limits of human control and the interconnectedness of planetary systems. It is particularly useful in the Anthropocene, where human activity has become a geological force, blurring the line between nature and culture. In this epoch, claiming that humans are the sole agents of history is empirically false; the carbon cycle and viral mutations operate with a logic that transcends human intention.

  However, this acknowledgment must not become an alibi. The framework becomes untenable if it treats human suffering in the face of environmental force as natural rather than political. When a hurricane "devastates" a region, the historian must ask not only about the wind speed but about the zoning laws, the levee maintenance, and the social safety nets. The non-human force provides the energy; the human structure provides the vulnerability.

  In conclusion, the ascription of historical agency to non-human environmental forces is a necessary corrective to anthropocentrism, but it requires rigorous conceptual delimitation. It is not a return to the hard determinism of the nineteenth century, provided that "agency" is understood as causal efficacy within a relational network rather than intentional authorship. Furthermore, microbes, climate, and volcanoes cannot be treated as a monolith; their differing temporalities demand distinct analytical approaches. The intermediate position is the most robust: we must acknowledge that non-human forces are co-authors of the human story, but we must insist that the editing room—the determination of who suffers, who adapts, and who survives—remains firmly in the realm of human politics. To do otherwise is to mistake the storm for the damage it causes. History is not written by the volcano, but by the society that rebuilds, or fails to rebuild, in its shadow.
