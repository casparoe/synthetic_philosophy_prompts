      *   **Context:** Two years of circular debate about adaptationism. Three specific positions identified within the group (Optimality-first, Pluralist, Deflationary).
      *   **Task:** Provide a *diagnosis* of the disagreement, not a verdict on who is right. Evaluate the user's hypothesis (burden of proof + sampling bias) against two alternatives (verbality/individuation + explanatory target mismatch). Use the "genealogical audit" thought experiment to test these diagnoses.
      *   **Constraints:** American English. No literature survey/reading list/citations. Argue for the answer. Be willing to call the question ill-formed if necessary. Focus on *what kind of disagreement this is* and *what counts as progress*.

  2.  **Deconstruct the Three Positions:**
      *   *Optimality-first:* Selection is the null. Fit = Evidence. Alternatives need positive proof. (Methodological Adaptationism).
      *   *Pluralist:* Selection is *not* the null. Constraints/Drift are common. Adaptationist narratives are unfalsifiable. Burden on adaptationist. (Substantive Anti-Adaptationism).
      *   *Deflationary:* The fight is over. Modern methods handle constraints. It's just rhetoric/inertia now. (Methodological Pluralism/Pragmatism).

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Two stalls. (1) Normative/Methodological (burden of proof/default hypothesis). (2) Empirical/Sampling (Engineered-trait sampling filter).
      *   *Strengths:* Captures the frustration. The sampling bias point is crucial (we study traits *because* they look adaptive). The burden of proof point explains why data doesn't resolve it (data is interpreted through the lens of the burden).
      *   *Weaknesses:* Might underplay the semantic/individuation issue.

  4.  **Evaluate the Alternative Diagnoses:**
      *   *Alternative 1 (Verbal/Individuation):* "Adaptation" means different things (current utility vs. historical origin).
      *   *Alternative 2 (Explanatory Target):* Different questions (origin vs. maintenance vs. specific form).

  5.  **Analyze the "Genealogical Audit" Thought Experiment:**
      *   *Scenario:* Complete knowledge of causal history for all traits in model organisms. Result: ~50% direct adaptation, rest mixed/other.
      *   *User's Prediction:* Both sides claim victory.
      *   *Implication:* If both claim victory on the *same data*, the dispute isn't about the frequency (empirical). It's about the *significance* of that frequency or the *rules of inference* used before getting that data.

  6.  **Synthesize and Formulate the Diagnosis:**
      *   *Core Argument:* The user's hypothesis is the strongest, but it needs refinement. It's primarily a **methodological-normative dispute disguised as an empirical one**, exacerbated by the **sampling filter**. The "Verbal" and "Target" diagnoses are symptoms, not causes.
      *   *Why Verbal/Target are secondary:* While true that "adaptation" is ambiguous (Current Utility vs. Historical Product), the participants *know* this. They argue past each other not because they don't know the definitions, but because they disagree on which definition *matters* for explanation. The "Target" mismatch is real (Origin vs. Maintenance), but again, the fight is about which target justifies the label "adaptation" in a way that licenses further inference.
      *   *Why User's Hypothesis is primary:* The "Burden of Proof" is the engine. The Optimality group treats selection as a *working assumption* to generate hypotheses. The Pluralists treat it as a *claim* requiring proof. No amount of empirical data resolves a normative rule about inference *unless* the data is so overwhelming it forces a paradigm shift (which the Audit suggests it wouldn't). The Sampling Filter ensures the data never *is* overwhelming enough to force the shift, because the dataset is rigged by research interests.
      *   *The Audit Test:* If the Audit says 50%, Optimizers say "See, selection is the dominant force, null hypothesis validated." Pluralists say "See, nearly half are non-adaptive, you can't assume selection." Both interpret the *same number* through their *prior methodological commitments*. This confirms the dispute is not empirical.

  7.  **Determine "Progress":**
      *   If the dispute is normative/methodological, "solving" it empirically is impossible.
      *   *Progress* looks like:
          1.  Explicitly separating the *heuristic* value of optimality models from the *ontological* claim of selection history.
          2.  Acknowledging the Sampling Filter and adjusting confidence intervals accordingly (Bayesian update on the prior probability of a trait being chosen for study).
