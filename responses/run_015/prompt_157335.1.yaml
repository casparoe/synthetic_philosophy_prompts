          5.  Prescribe Progress (Change the question/metrics).
      *   *Key Insight to emphasize:* The "Engineered-Trait Sampling Filter" is the killer. It makes the empirical base rate unknowable in practice. Therefore, the dispute *must* be about methodological norms, not facts.
      *   *Refining the "Verbal" point:* It's not just that they define traits differently; it's that they disagree on which definition is *explanatorily privileged*.
      *   *Refining the "Progress" point:* Don't just say "communicate better." Suggest a shift to *variance partitioning* or *sensitivity analysis* rather than binary adaptationism.

  9.  **Final Polish:** Check against constraints (American English, no citations, argue don't summarize). Ensure the "Audit" section is punchy. (Self-Correction: Make sure I don't sound like I'm taking the Pluralist side. Stay neutral/diagnostic.)

  10. **Final Review against User Prompt:**
