      *   It differs from standard Malthusianism by acknowledging the *Industrial Revolution* break but positing it as temporary.
      *   It differs from Cornucopianism (Simon, Lomborg) by assuming finite buffers.

  3.  **Brainstorming Defeaters (Falsification Conditions):**
