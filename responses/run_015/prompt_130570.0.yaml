      *   *Category 2: Buffers Permanent.* If technology is non-rivalrous and cumulative without diminishing returns. If institutions can adapt infinitely to scarcity (price signals always solve shortages).
      *   *Category 3: Insulation/Immunization.* If every failure of the prediction is met with "the buffer just lasted longer" without specifying *why* or *when* it must end. If "exhaustion" is defined post-hoc.

