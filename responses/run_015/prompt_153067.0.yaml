  5.  **Drafting the Advice (Iterative refinement):**

      *   *Direct Answer:* Start with the "Kill Switch." The Hitchhiker analogy is weak for institutions because institutions rely on *enforcement*, not *decision theory*. The driver doesn't need to predict the passenger; the passenger signs a contract.
      *   *Reframing:* Shift from "Rational Irrationality/Hitchhiker" to "Time Inconsistency & Credible Commitment." This keeps the spirit but fixes the mechanics.
      *   *Prioritization:*
          *   Drop Option 1 (Formal models). Too hard, low ROI for non-logician.
