      *   *Institutional Reality:* Institutions don't usually face omniscient predictors. They face *reputation*, *contracts*, *law*, and *internal bureaucracy*.
      *   *The Mismatch:* In Hitchhiker, you pay *because* you are the type of person who pays. In institutions, you comply *because* there are enforcement mechanisms (audits, firing, legal liability).
      *   *Verdict:* The "Hitchhiker" framing is likely a category error for institutions *unless* we are talking about AI safety or very specific reputation markets where "type" matters more than "enforcement." However, the *spirit* of the problem (time inconsistency, pre-commitment) is valid. The specific *Hitchhiker* decision-theoretic puzzle (paying when you no longer need to) is usually solved in institutions by *external* constraints, not internal rationality shifts.
