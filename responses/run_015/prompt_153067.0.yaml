  6.  **Refining the "Hitchhiker" Critique:**
      *   In Hitchhiker, the payment is *causally useless* once in the city. CDT says don't pay. FDT says pay.
      *   In Institutions, if you break the safety protocol, you get sued/fired. The action *has consequences*.
      *   *Exception:* AI Safety. If you build an AI, you can't sue it later. That *is* a Hitchhiker case. I should mention this distinction. If the user is working on AI safety institutions, the premise holds more water. If they are working on human orgs, it doesn't. I need to ask/assume. I will assume human orgs based on "institutional design" phrasing, but add a note about AI.

  7.  **Finalizing the Tractability Assessment:**
