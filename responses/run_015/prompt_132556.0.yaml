answer: |-
  ### Exam Question: Geometric Constraints on Log-Optimal Growth

  **Question 4 (20 Points)**

  Consider a rational agent whose belief states regarding a hidden parameter $\theta$ reside on a statistical manifold $\mathcal{M}$ equipped with the Fisher-Rao metric $g_{ij}$. The agent faces two sequential wagers, $W_1$ and $W_2$, whose payoff structures are conditionally independent given $\theta$, but marginally dependent due to uncertainty in $\theta$. Standard Kelly criterion derivations maximize expected log-wealth assuming fixed probabilities or independent trials. However, suppose rational belief updating is constrained such that posterior states must be reached via geodesic motion on $\mathcal{M}$ rather than instantaneous Bayesian conditioning, implying that belief updates incur a "curvature cost."

  Construct a formal argument analyzing the interaction between the geodesic update rule and capital allocation. Specifically: (1) define the metric and the geodesic condition; (2) demonstrate how the shared parameter $\theta$ couples the wagers; (3) show where the standard independence assumption in the Kelly derivation fails under geodesic constraints; and (4) argue whether the resulting deviation from standard Kelly fractions represents a failure of log-optimality or a necessary preservation of geometric consistency. Your answer should conclude with a definitive normative claim.

  ***

  ### Model Answer

  To analyze the tension between Kelly betting and geometric rationality, we must first formalize the belief space. Let the agent's beliefs be parameterized by $\theta \in \Theta$, defining a manifold $\mathcal{M}$ with the Fisher-Rao metric $g_{ij}(\theta) = \mathbb{E}[\partial_i \log p(x|\theta) \partial_j \log p(x|\theta)]$. This metric measures the informational distance between belief states. In standard Bayesian updating, observing data jumps the belief state to a new posterior. Here, however, rationality requires updating along a geodesic $\gamma(t)$, satisfying the equation $\ddot{\gamma}^k + \Gamma_{ij}^k \dot{\gamma}^i \dot{\gamma}^j = 0$, where $\Gamma$ are the Christoffel symbols derived from $g_{ij}$. This constraint implies beliefs evolve continuously along the path of least informational resistance rather than jumping discontinuously.

  The coupling arises because wagers $W_1$ and $W_2$ depend on the same $\theta$. While $P(W_1, W_2 | \theta) = P(W_1|\theta)P(W_2|\theta)$, the marginal probabilities are correlated: $P(W_1, W_2) \neq P(W_1)P(W_2)$. Standard Kelly optimization maximizes $G = \mathbb{E}[\log(1 + f_1 X_1 + f_2 X_2)]$ assuming $f_1$ and $f_2$ can be optimized myopically based on current probabilities. This derivation relies on the assumption that the probability distribution governing $W_2$ is unaffected by the outcome of $W_1$ except through standard conditioning.

  Under geodesic constraints, this independence breaks. The outcome of $W_1$ provides information about $\theta$, necessitating a move along $\mathcal{M}$ to update beliefs before $W_2$ is placed. Because $\mathcal{M}$ possesses non-zero curvature (unless the family is exponential and flat), the geodesic path depends on the direction of the update. The capital allocated to $W_1$ affects the wealth base for $W_2$, but crucially, the *belief state* available for optimizing $W_2$ is constrained by the geodesic trajectory initiated after $W_1$. The gradient of the growth rate $\nabla G$ is no longer orthogonal to the constraint surface defined by the geodesic flow. Consequently, the optimal fraction $f^*$ shifts to account for the informational drag induced by curvature. The standard Kelly fraction $f_{Kelly}$ assumes immediate access to the posterior; the geometric Kelly fraction $f_{Geo}$ must discount for the path length required to reach that posterior.

  This shift should not be viewed as a failure of Kelly betting, but as a failure to apply it within the correct topological constraints. Kelly maximizes growth relative to a probability measure; if the measure evolves along a curved manifold, the "true" probability relevant for decision-making includes the cost of navigating that manifold. To ignore curvature is to treat informational updates as costless jumps, violating the premise of the geometric rationality framework. Therefore, the deviation is a preservation of geometric consistency. A rational agent must optimize growth over the trajectory of belief states, not just across static snapshots. The normative conclusion is that log-optimality is subordinate to geometric consistency: one cannot maximize growth on a manifold while ignoring its metric properties. The "correct" bet is the one that balances financial leverage with informational leverage.

  ***

  ### Marking Scheme (Total 20 Points)

  | Must-Hit Move | Points | Typical Candidate Botch |
  | :--- | :---: | :--- |
  | **1. Metric & Geodesic Identification:** Correctly defines Fisher-Rao metric and writes the geodesic equation (or equivalent constraint condition). | 4 | Defines Euclidean distance or vague "belief distance" without specifying Fisher information; fails to write the differential condition. |
  | **2. Coupled Payoff Structure:** Explicitly formalizes how the hidden $\theta$ creates marginal dependence between wagers despite conditional independence. | 4 | Treats wagers as fully independent or fails to distinguish between conditional and marginal dependence structures. |
  | **3. Independence Breakdown:** Pinpoints exactly where the standard Kelly derivation assumes independent updates vs. the geodesic constraint path. | 4 | Claims Kelly assumes independent *wagers* rather than independent *belief updates*; vague hand-waving about "correlation." |
  | **4. Resolution of Tension:** Argues clearly whether the shift is a failure of Kelly or geometric consistency (must choose a side). | 4 | Hedges ambiguously ("both are right"); fails to recognize Kelly as a subordinate tool to the manifold structure. |
  | **5. Normative Conclusion:** Provides a definitive claim on how rationality should be defined (growth vs. consistency). | 4 | Ends descriptively without a normative stance; contradicts the earlier argument in the conclusion. |
