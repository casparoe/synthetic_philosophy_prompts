  Overall, Miriam is more right. She demonstrates that Owen's essentialism relies on biologically arbitrary boundaries that collapse under technological scrutiny, whereas Owen retreats to brute modal facts that look dogmatic.

  Regarding what is missing: Both assume a determinate answer exists. It is plausible that counterfactual identity admits of no fact of the matter, reflecting ontic vagueness rather than epistemic limitation. Furthermore, the dispute may concern which counterfactual description is useful rather than which tracks mind-independent identity. Finally, developmental biology should constrain modal theses; if biological individuation is fluid (as twinning shows), modal individuation cannot be rigid. You might encourage students to view origin essentialism not as a metaphysical discovery but as a normative choice about how to count persons across possible worlds. The silence on biological individuation is significant; if an organism's beginning is a process rather than a moment, modal claims anchored to a conception moment are category errors. Ultimately, the debate may be verbal: Owen and Miriam agree on the biology but disagree on whether our concept of 'person' tracks genetic continuity or historical continuity.
