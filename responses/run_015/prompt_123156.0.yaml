answer: |-
  Here is a lesson plan designed for your specific constraints and audience. It prioritizes concrete frequency tables over algebra and isolates the prior distribution as the source of the error.

  ### 1. The Order of Pieces

  You are correct to start with the **Closed-Envelope Version**, but you must be precise about *why*. Do not present it as a "warm-up." Present it as the **Control Condition**.

  *   **Step 1: The Closed Case (10 minutes).**
      *   **Setup:** Two envelopes, one has double the other. You pick one. You cannot look inside.
      *   **Question:** Should you switch?
      *   **Goal:** Establish the **Symmetry Baseline**. Students will immediately agree there is no reason to switch. The expected value of switching is zero *relative to staying*.
      *   **Dependency:** This creates a normative anchor. If a later argument concludes "Always Switch," it contradicts this baseline. This forces the students to look for the flaw in the later argument rather than accepting the conclusion.

  *   **Step 2: The Open Case & The Naive Calculation (15 minutes).**
      *   **Setup:** Same as above, but you open your envelope and see \$100.
      *   **The Argument:** Write the "Five-Quarters" calculation on the board. $0.5(50) + 0.5(200) = 125$.
      *   **Goal:** Generate the cognitive dissonance. The math says switch; the Symmetry Baseline says don't.
      *   **Dependency:** This isolates the specific claim that causes the break: *"Given I see \$100, it is equally likely I have the smaller or larger amount."*

  *   **Step 3: The Machine (Frequency Resolution) (45 minutes).**
      *   **Setup:** Introduce your money machine.
      *   **Goal:** Test the "Equally Likely" claim using counts rather than probabilities.
      *   **Dependency:** This is where you prove the Naive Calculation relies on an impossible distribution of money. You move from "It feels symmetric" to "Let's count how often \$100 appears as the small vs. large envelope."

  *   **Step 4: Synthesis (10 minutes).**
      *   **Goal:** Reconcile the Open and Closed cases. The Open case only suggests switching if the distribution of money allows it (which implies you have information about the total pool), but for any *realistic* distribution, the symmetry holds or the EV calculation changes.

  **Why Closed First?**
  If you start Open, the "Always Switch" conclusion feels like a discovery. If you start Closed, the "Always Switch" conclusion feels like a contradiction. You want them to treat the 1.25 calculation as a suspect to be interrogated, not a result to be accepted.

  ### 2. The Carrying Example (The Machine)

  **Critique of your current design:**
  Drop the **smudged display**. It introduces a second layer of uncertainty (what is the number?) that distracts from the core logical error (what is the *probability* of the number being the smaller one?). To calculate $1.25A$, the student must know $A$. If the display is smudged, they cannot run the naive argument you are trying to debunk.

  **Revised Machine Specification:**
  Keep the **powers of two** ($2^k$). This ensures all amounts are integers and avoids "half-dollar" confusion.
  *   **The Mechanism:** A host selects an integer $k$ according to a specific rule (the Prior). She puts $2^k$ in the small envelope and $2^{k+1}$ in the large envelope.
  *   **The Display:** The envelope shows the **exact amount** clearly.
  *   **The Variable:** You will change the **rule for selecting $k$** on the board.

  **How to run it:**
  1.  **First Pass (Finite/Bounded):** Write on the board: *"The host flips a fair coin. Heads: $k=1$ (\$2/\$4). Tails: $k=2$ (\$4/\$8)."*
      *   Ask: "You open your envelope and see **\$4**. Should you switch?"
      *   Have them build a frequency table.
          *   Scenario H: Envelopes are (\$2, \$4). You could have \$2 or \$4.
          *   Scenario T: Envelopes are (\$4, \$8). You could have \$4 or \$8.
      *   Crucial realization: Seeing \$4 is more likely to happen in the "Tails" world (where \$4 is the small amount) than the "Heads" world (where \$4 is the large amount)? No, wait.
      *   *Correction for the board:* Make it simpler.
      *   *Rule:* Host picks $k \in \{1, 2, 3\}$ with equal probability (1/3 each).
      *   Pairs: (\$2, \$4), (\$4, \$8), (\$8, \$16).
      *   Total scenarios: 3 pairs $\times$ 2 envelopes = 6 equally likely physical envelopes.
      *   **Question:** "You see **\$4**."
      *   **Task:** Count how many of the 6 envelopes show \$4.
          *   One envelope is \$4 (from the \$2/\$4 pair). It is the **Larger**.
          *   One envelope is \$4 (from the \$4/\$8 pair). It is the **Smaller**.
      *   Here, it *is* 50/50. EV = $1.25 \times 4$. Switching *is* rational here.
      *   **Question:** "You see **\$16**."
      *   **Task:** Count.
          *   Only one envelope has \$16 (from the \$8/\$16 pair). It is the **Larger**.
          *   Probability it is the smaller is 0.
      *   **Result:** You must switch *down*.
      *   **Lesson:** The "50/50" assumption fails at the boundaries.

  2.  **Second Pass (The "Always Switch" Trap):**
      *   Ask: "What if we remove the boundary? What if $k$ can be any integer?"
      *   Show that to make the 50/50 assumption work for *every* number, you need a uniform distribution over an infinite range.
      *   **Lesson:** You cannot have a uniform distribution over infinite money. Therefore, the 50/50 assumption is impossible for all values simultaneously.

  ### 3. Misconceptions to Expect

  Handle these as they arise. Do not wait for the end.

  1.  **"It's just a variable error." (Your Friend's First Point)**
      *   **When:** During Step 2 (The Naive Calculation). A student will say, "You can't use $x$ for both cases because the $x$ is different."
      *   **Intervention:** "Let's test that without variables." Point to the \$100 on the board. "In case 1, the other is 50. In case 2, the other is 200. The numbers are concrete. The algebra isn't the problem; the claim that these two cases are *equally likely* is the problem."
      *   **Why:** This validates your intuition over your friend's without getting semantic.

  2.  **"Symmetry settles the open case too." (Your Friend's Second Point)**
      *   **When:** During Step 3 (First Pass/Bounded Machine).
      *   **Intervention:** Point to the \$16 case in the bounded example. "Symmetry says switching doesn't matter. But the table says if you see \$16, you definitely have the larger envelope. If you switch, you definitely lose. Symmetry breaks when you have information about the range of possible values."
      *   **Why:** This proves that looking inside *can* change the decision, refuting the idea that the Open/Closed distinction is irrelevant.

  3.  **"Infinite Expected Value excuses everything."**
      *   **When:** During Step 3 (Second Pass/Infinite).
      *   **Intervention:** "Even if the EV is infinite, the logic that 'I should switch' relies on the probability being 50/50. If I tell you the host never puts more than \$1 million in the envelope, the EV is finite, but you still feel the pull to switch on \$100. The paradox isn't about infinity; it's about the 50/50 assumption."
      *   **Why:** Economics majors especially latch onto "Infinite EV" as a get-out-of-jail-free card. Force them to see the structural error in the probability assignment.

  4.  **"If switching is good for \$100, it's good for any amount, so I should switch blind."**
      *   **When:** Wrap-up.
      *   **Intervention:** "If you decide to switch before looking, you are back in the Closed Case. We already agreed that yields no gain. So the decision to switch *must* depend on the number you see. If it depends on the number, there must be some numbers where you switch *down*. The 1.25 calculation forbids switching down. Therefore, the 1.25 calculation cannot be true for every number."

  ### 4. The One Thing to Decline

  **"I am not going to explain how to construct a valid probability distribution over an infinite range of money."**

  **Say this out loud:**
  "We have shown that the 'Always Switch' argument requires a world where every amount of money is equally likely, from one cent to infinity. In mathematics, we call this an 'improper prior.' It breaks the rules of probability because the probabilities cannot sum to 1. I am declining to show you the measure theory required to fix this, because the philosophical lesson is simpler: **You cannot reason about a specific amount (\$100) without knowing how that amount was generated.**"

  **Why:** This respects their level (no calculus/measure theory) while giving them the correct technical label ("improper prior") so they know it's a known quantity, not just a classroom trick.

  ### 5. End-of-Session Assessment Question

  Do not ask for a definition. Ask for a calculation based on a specific prior.

  **The Question:**
  > "A host uses a machine to fill the envelopes. She rolls a standard 6-sided die to choose $k$.
  > *   If she rolls 1, she puts **\$2** and **\$4** in the envelopes.
  > *   If she rolls 2, she puts **\$4** and **\$8** in the envelopes.
  > *   ...
  > *   If she rolls 6, she puts **\$64** and **\$128** in the envelopes.
  >
  > You pick an envelope at random. You open it and see **\$4**.
  >
  > **A)** How many possible die rolls could have produced a \$4 envelope?
  > **B)** Of those possibilities, in how many is \$4 the *smaller* amount?
  > **C)** Calculate the Expected Value of switching. Is it greater than \$4?"

  **The Answer Key (for you):**
  *   **A)** Two rolls produced a \$4 envelope (Roll 1: \$4 is large; Roll 2: \$4 is small).
  *   **B)** One possibility (Roll 2). So the probability \$4 is the smaller amount is 1/2.
  *   **C)** $0.5 \times 2 + 0.5 \times 8 = 5$. EV is \$5. Switching is rational *in this specific instance*.

  **Why this works:**
  *   If they answer "Always switch because 1.25," they failed (they ignored the die roll constraints).
  *   If they answer "Don't switch because symmetry," they failed (they ignored the information).
  *   If they calculate the conditional frequency based on the die roll, they have successfully internalized that **the prior distribution determines the rational choice.**
  *   *Bonus:* If you want to make it harder, ask them what happens if they see **\$128**. (Answer: Must be the large envelope of Roll 6. EV of switching is \$64. Do not switch). This confirms they understand the boundary condition.
