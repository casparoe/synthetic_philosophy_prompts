  ### Grading Summary

  **Mark:** 17 / 25  
  **Letter Grade:** B- (68%)

  **General Comment:**  
  This is a classic case of fluency masking a catastrophic conceptual failure. The student writes with the confidence of someone who understands the material, and the first two parts are indeed strong. However, Part (iii) collapses completely. The student fails to distinguish between strategy-proofness on a restricted domain (single-peaked) versus an unrestricted domain, and makes a factual error regarding the range of the voting rule that contradicts the basic mechanics of the median. The conclusion that the committee is "safe" under arbitrary preferences is the exact opposite of the truth given the Gibbard–Satterthwaite theorem.

  ---

  ### Point-by-Point Analysis

  #### Part (i): Statement and Application of GS (8 Marks)
  **Awarded:** 7 / 8

  *   **Claim:** "given at least three voters... strategy-proofness forces the rule to be dictatorial."  
      **Status:** **Correct-but-Unjustified / Minor Error.**  
      **Line:** Answer (a), first sentence.  
      **Comment:** The Gibbard–Satterthwaite theorem holds for $n \ge 2$ voters. Stating "at least three" unnecessarily restricts the theorem's scope. In a Master's seminar, precision on the conditions of fundamental theorems is expected. Deduct 1 mark.
  *   **Claim:** "onto — every alternative wins somewhere."  
      **Status:** **Correct.**  
      **Line:** Answer (a), first sentence.
  *   **Claim:** "The escape that matters for this question, though, is the domain: committee members' preferences are single-peaked... the theorem is simply silent."  
      **Status:** **Correct.**  
      **Line:** Answer (b), first paragraph.  
      **Comment:** Correctly identifies that GS requires an unrestricted domain and that the single-peaked restriction in parts (i) and (ii) removes the theorem's applicability.

  #### Part (ii): Strategy-Proofness with Single-Peaked Preferences (10 Marks)
  **Awarded:** 10 / 10

  *   **Claim:** "Fix the other four members' reports... L be the third-smallest and U the fourth-smallest of those six... median of the seven is L if r ≤ L, is r itself if L ≤ r ≤ U, and is U if r ≥ U."  
      **Status:** **Correct.**  
      **Line:** Answer (b), second paragraph.  
      **Comment:** The mechanical derivation of the median outcome as a function of one voter's report (given 4 other reports + 2 anchors) is accurate. The outcome is indeed the report clamped to the interval $[L, U]$.
  *   **Claim:** "If my ideal point lies inside [L, U], reporting it truthfully hands me exactly my ideal point... If it lies below L, then no report of mine can bring the outcome below L, so truthful reporting is optimal."  
      **Status:** **Correct.**  
      **Line:** Answer (b), second paragraph.  
      **Comment:** Under the **single-peaked assumption** required for Part (ii), this logic holds. If preferences decline monotonically from the peak, one cannot benefit by moving the outcome away from the peak. The proof is sufficient for this part.

  #### Part (iii): Arbitrary Preferences and GS Application (7 Marks)
  **Awarded:** 0 / 7

  *   **Claim:** "Notice that this argument nowhere uses single-peakedness... The rule would remain strategy-proof even if members had entirely arbitrary preferences."  
      **Status:** **Wrong.**  
      **Line:** Answer (b), third paragraph.  
      **Comment:** This is the critical failure. The argument in (ii) *implicitly* relies on single-peakedness to assert that moving the outcome away from the reported peak is undesirable. With arbitrary preferences, a voter might prefer an outcome further from their peak to one closer to it.
  *   **Claim:** "because the charter anchors sit at the two ends of the ladder, the extreme levels $0m and $8m can never be the median of the seven numbers, so the rule is not onto".  
      **Status:** **Wrong.**  
      **Line:** Answer (b), third paragraph.  
      **Comment:** This is a factual error about the rule's mechanics. If all five members report $0$, the set of seven numbers is $\{0, 0, 0, 0, 0, 0, 8\}$, and the median is $0$. If all report $8$, the median is $8$. The rule **is** onto.
  *   **Claim:** "the hypotheses of Gibbard–Satterthwaite fail twice over."  
      **Status:** **Wrong.**  
      **Line:** Answer (b), third paragraph.  
      **Comment:** Since the domain is now unrestricted (Part iii) and the rule is onto (contrary to student claim), the hypotheses of GS **are satisfied**.
  *   **Claim:** "So the committee is safe... Any member who tried to game it could only push the outcome toward whatever level she claims to want."  
      **Status:** **Wrong.**  
      **Line:** Answer (c).  
      **Comment:** Since GS applies, the rule *must* be manipulable. The committee is not safe.

  ---

  ### Concrete Counterexample (For Part iii)

  The student claims the rule is strategy-proof under arbitrary preferences and that the extremes cannot be won. Both claims are false.

  **Profile Setup:**
  *   **Alternatives:** $\{0, 2, 4, 6, 8\}$
  *   **Voters:** 5 Members ($M_1$ to $M_5$)
  *   **Rule:** Median of $\{ \text{Reports} \} \cup \{0, 8\}$

  **The Manipulator ($M_1$):**
  *   **True Preferences:** $0 \succ 6 \succ 4 \succ 2 \succ 8$  
      *(Note: This is not single-peaked. The peak is 0, but 6 is preferred to 2 and 4.)*
  *   **True Top:** $0$

  **The Others ($M_2$ to $M_5$):**
  *   **Reports:** $M_2, M_3$ report **2**. $M_4, M_5$ report **6**.
  *   *(We assume they report truthfully for the sake of demonstrating $M_1$'s manipulation opportunity.)*

  **Scenario A: Truthful Reporting**
  *   $M_1$ reports **0**.
  *   Set of 7 numbers: $\{0, 8, \mathbf{0}, 2, 2, 6, 6\}$
  *   Sorted: $0, 0, 2, \mathbf{2}, 6, 6, 8$
  *   **Outcome:** **2** (4th smallest)
  *   **Utility for $M_1$:** $M_1$ ranks 2 last-but-one (only prefers it to 8).

  **Scenario B: Manipulative Reporting**
  *   $M_1$ reports **8** (or 6).
  *   Set of 7 numbers: $\{0, 8, \mathbf{8}, 2, 2, 6, 6\}$
  *   Sorted: $0, 2, 2, \mathbf{6}, 6, 8, 8$
  *   **Outcome:** **6** (4th smallest)
  *   **Utility for $M_1$:** $M_1$ prefers 6 over 2 (see preferences above).

  **Conclusion:** $M_1$ obtains a strictly preferred outcome (6) by misreporting their top choice (0). The rule is manipulable. Furthermore, since a profile of all 0s yields 0, and all 8s yields 8, the rule is onto. Gibbard–Satterthwaite applies, and the student's conclusion is incorrect.

  ---

  ### Missing Reasoning & Feedback Notes

  **1. The "Onto" Error:**  
  The student's claim that "$0m and $8m can never be the median" suggests they visualized the anchors as fixed barriers that the median cannot touch. They failed to consider that voters *themselves* can report the anchor values, effectively "overwhelming" the anchors. A full-credit answer would have checked the range of the function explicitly (e.g., "If everyone reports 0, the outcome is 0").

  **2. Single-Peakedness vs. Unrestricted:**  
  In Part (ii), the student proved strategy-proofness correctly *for single-peaked preferences*. However, in transitioning to Part (iii), they claimed the argument "nowhere uses single-peakedness." This is false. The step "truthful reporting is optimal [if ideal point lies below L]" relies entirely on the assumption that outcomes further from the ideal point (like L) are worse than outcomes closer to it. Without single-peakedness, an agent with peak 0 might prefer 6 over 2. A full-credit answer would have explicitly invoked the definition of single-peakedness to justify why moving the outcome away from the peak is harmful in (ii), and then explained why that justification vanishes in (iii).

  **3. Gibbard–Satterthwaite Implications:**  
  The student treats GS as a theorem that can be "escaped" by finding loopholes in specific rules. While true for restricted domains, once the domain restriction is dropped (Part iii), GS becomes an impossibility result for *any* non-dictatorial, onto rule. The student failed to recognize that by dropping single-peakedness, they had walked directly into the conditions of the theorem, guaranteeing manipulability.

  **Feedback to Student:**  
  "Your mechanical derivation of the median interval in Part (ii) is excellent, and your identification of the domain restriction as the escape clause for GS in Part (i) is correct. However, Part (iii) is fundamentally flawed. You assert the rule is not onto, but if all voters report $0, the median is $0. You assert the rule is strategy-proof on unrestricted domains, but the logic you used in (ii) implicitly relied on preferences declining monotonically from the peak. Construct a preference order where the peak is 0 but 6 is preferred to 2, and you will find a manipulation. When you drop the single-peaked assumption, Gibbard–Satterthwaite applies directly, and the committee is not safe."
