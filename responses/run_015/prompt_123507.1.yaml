  ## 7. Facilitator Script Snippets (For Key Moments)

  **During Round 2 (The Pressure):**
  > "I see hesitation. You are feeling the weight of the envelope. You are remembering the $8 cutoff. But look at the board. The equation says $1.25V$. If you are a rational agent maximizing expected value, and you accept this equation, your hand should be moving. Why is your hand not moving? Is your hand smarter than the algebra?"

  **During Debrief (The Contradiction):**
  > "In Round 1, you used your hands. In Round 2, you used the formula. They gave you opposite orders. The paradox isn't that the math is hard; it's that the math seems to demand you ignore the reality of the situation (the cutoff, the pairing) to follow a rule that leads to an infinite loop. You just lived the contradiction."
