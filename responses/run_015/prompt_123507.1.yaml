answer: |-
  # Workshop Design: The Weighted Expectation

  **Objective:** To transform the Two Envelope Paradox from a theoretical inconsistency into a somatic and decision-theoretic tension. Participants will experience the conflict between empirical evidence (physical cues), prior knowledge (distribution limits), and formal expectation (the 5/4 argument).

  **Participants:** 14 Undergraduates.
  **Duration:** 75 Minutes.
  **Budget:** Capped at ~$120 USD (using denominations $1, $2, $4, $8).
  **Facilitator Role:** Banker, Timekeeper, and Arbiter of Rules (not interpreter of logic until debrief).

  ---

  ## 1. Materials & Preparation (The Engine)

  You need to construct 14 **Decision Kits**. Each Kit represents an independent "world" containing a pair of envelopes with amounts $(X, 2X)$.

  **The Cash Distribution (Geometric with Cutoff):**
  *   **Values:** $1, $2, $4, $8.
  *   **Pairs:** Prepare 14 Kits distributed as follows to ensure variety but respect the geometric prior:
      *   4 Kits: ($1, $2)
      *   4 Kits: ($2, $4)
      *   4 Kits: ($4, $8)
      *   2 Kits: ($1, $2) [Extra to fill count]
      *   *Note:* This creates a shared prior where lower values are more probable, but the upper cutoff ($8) is known.
  *   **Total Cash Required:** $126 (Maximum possible payout if everyone gets $8, though statistically unlikely). Bring $150 in mixed small bills to be safe.

  **The Physical Correlates (Noisy Signals):**
  The paradox relies on the amounts being indistinguishable. To inject the requested wrinkle, you will engineer a **70% reliable** physical correlation between value and weight/thickness.
  *   **Envelope Types:** Use two distinct types of envelopes.
      *   *Type A (Light):* Standard white #10 business envelope.
      *   *Type B (Heavy):* Manilla or cardstock envelope.
  *   **Internal Noise:** Add small metal washers or paperclips taped inside the flap (invisible until opened).
  *   **Engineering:**
      *   **$1 Bills:** Type A + 0 washers (Lightest).
      *   **$8 Bills:** Type B + 2 washers (Heaviest).
      *   **$2 and $4 Bills:** Randomized mix of Type A/B and 0/1 washers.
  *   **Goal:** A student holding a $1 can feel it is likely the small amount. A student holding $8 can feel it is likely the large amount. A student holding $2 or $4 will feel ambiguity. This creates tension between "My hand says switch/keep" and "The math says switch."

  **Room Setup:**
  *   14 desks/tables spaced apart (to prevent collusion).
  *   A central "Bank" table.
  *   A projector or whiteboard for displaying the Prior and Rules.

  ---

  ## 2. The Prior & Rules (Disclosure)

  At the start, project the following **Shared Prior**. Do not name the paradox yet.

  > **THE POOL PROTOCOL**
  > 1.  **The Pool:** There are 14 Kits. Each Kit contains two sealed envelopes. One contains amount $X$, the other contains $2X$.
  > 2.  **The Values:** Cash amounts are drawn from the set {$1, $2, $4, $8}.
  > 3.  **The Cutoff:** No envelope contains more than **$8**.
  > 4.  **The Distribution:** Lower amounts are more common than higher amounts (Geometric).
  > 5.  **The Signal:** Envelopes have been weighted. Heavier envelopes *tend* to contain more money, but this correlation is **imperfect**. You may weigh, shake, and inspect the envelope, but you may not open it until the end.
  > 6.  **The Payoff:** You keep the cash in the envelope you hold at the end of the session.

  ---

  ## 3. Timeline (75 Minutes)

  ### Phase 1: Embodied Decision (00:00 – 00:25)
  *   **00-05:** Distribute one Kit to each student. Instruct them to place the two envelopes (marked A and B) on their desk. They must choose one to be their **Active Envelope**. The other becomes the **Shadow Envelope**.
  *   **05-15:** **Inspection Period.** Students may handle the Active Envelope. They can weigh it in their hand, compare thickness, etc. They *cannot* open it. They can compare it to the Shadow Envelope (which they also cannot open).
  *   **15-20:** **Decision Point 1.** Students must privately decide: **KEEP** (stick with Active) or **SWITCH** (swap Active for Shadow).
      *   *Mechanism:* They raise a hand. Facilitator goes desk-to-desk. If "Switch," facilitator physically swaps the envelopes. If "Keep," facilitator marks a sheet.
  *   **20-25:** **Settlement.** Do not open envelopes yet. Collect the Shadow Envelopes (the ones not chosen) into a secure box. Students hold their final Active Envelope.
      *   *Tension:* They now hold an envelope they think is valuable, but they haven't seen the money.

  ### Phase 2: The Argument Injection (00:25 – 00:50)
  *   **25-30:** **The Reveal.** Project the **Unconditional Switching Argument**:
      > "Let $V$ be the value in your Active Envelope.
      > The Shadow Envelope (which you discarded) contained either $2V$ or $V/2$.
      > Assuming equal probability, the Expected Value of the Shadow was:
      > $0.5(2V) + 0.5(V/2) = 1.25V$.
      > The Shadow was worth 25% more than what you hold."
  *   **30-40:** **Iterative Pressure (Round 2).**
      *   **Rule:** "For the purpose of this exercise, you must accept the logic above as binding. You currently hold an envelope with value $V_{current}$. The envelope you discarded (now in the box) had an expected value of $1.25 \times V_{current}$."
      *   **Task:** "If the math compels you to maximize expectation, you must regret your choice. We will now simulate a **Second Chance**."
      *   **Action:** Facilitator returns the discarded Shadow Envelopes to the owners.
      *   **Constraint:** Students must now apply the 5/4 argument to their *current* holding.
          *   If they Kept in Round 1: "Your held envelope is $V$. The other is $1.25V$. You **must** Switch."
          *   If they Switched in Round 1: "Your held envelope is $V_{new}$. The original (now other) is $1.25V_{new}$. You **must** Switch Back."
      *   **Requirement:** Every student must physically swap envelopes again, regardless of their physical intuition. They are forced to act on the formal argument against their physical intuition.
  *   **40-50:** **The Regress.** Ask the room: "You have switched. You now hold a new envelope. Does the argument apply again?"
      *   Guide them to see that if they apply the rule again, they must switch *back* to the first one.
      *   Stop the physical swapping here to save time, but demand a verbal commitment: "Who feels compelled to switch a third time?"

  ### Phase 3: Payoff & Reality Check (00:50 – 01:00)
  *   **50-55:** **Opening.** Students open their final envelopes. Count the cash.
  *   **55-60:** **Collection.** Students return the cash to the Bank (or keep it, depending on your budget preference—keeping it heightens the stakes). *Recommendation:* Let them keep it. It validates the "real decision" aspect.
  *   **60-65:** **Data Board.** Write the results on the board:
      *   How many switched in Round 1?
      *   How many switched in Round 2?
      *   Did the "Heavy" envelopes actually contain more? (Reveal the weighting scheme).

  ### Phase 4: Debrief (01:05 – 01:15)
  *   Map the experience to the formal structure (see Debrief Guide below).
  *   Discuss the limitations of the simulation.

  ---

  ## 4. Payoff Scheme & Budget Safeguard

  *   **Denominations:** $1, $2, $4, $8.
  *   **Maximum Exposure:** 14 students $\times$ $8 = $112.
  *   **Expected Payout:** Approximately $4.50 per student $\times$ 14 = ~$63.
  *   **Safeguard:** Bring $150 in cash. If the budget is a hard constraint, use "Workshop Credits" redeemable for a gift card at the end, but cash is psychologically superior for this paradox.
  *   **The "House" Edge:** To ensure you don't run out of cash mid-workshop, keep the "Shadow" envelopes (the discarded ones) sealed. You only pay out the 14 Active envelopes. The money in the Shadow envelopes returns to your budget.

  ---

  ## 5. Predictable Failures (First-Run Risks)

  1.  **The Cutoff Nullification:**
      *   *Risk:* A student receives the $8 envelope. Knowing the cutoff is $8, they know the other *must* be $4. The 5/4 argument ($1.25 \times 8 = 10$) is visibly impossible.
      *   *Outcome:* They will loudly object in Round 2, breaking the "spell" of the paradox.
      *   *Mitigation:* In the debrief, highlight this. The paradox *requires* an infinite prior to hold mathematically. The finite cutoff is the "reality check" that dissolves the logic, which is exactly what you want them to notice.

  2.  **Physical Distrust:**
      *   *Risk:* The weight correlation is too obvious. Students with "Light" envelopes switch immediately; students with "Heavy" envelopes keep immediately.
      *   *Outcome:* Round 1 becomes a test of tactile acuity, not decision theory.
      *   *Mitigation:* Ensure the $2 and $4 envelopes are genuinely ambiguous (mixed weights). The paradox thrives in the middle of the distribution.

  3.  **Refusal to Iterate:**
      *   *Risk:* In Round 2, students refuse to switch back because "I already chose."
      *   *Outcome:* The iterative pressure fails.
      *   *Mitigation:* Frame Round 2 as a "Compliance Task." "I am not asking if you *want* to. I am asking if the *argument compels* you. If yes, swap."

  4.  **Consensus on Flaw without Location:**
      *   *Risk:* The group agrees "The math is wrong" but cannot identify that the error lies in treating $X$ as a constant in both branches of the expectation calculation.
      *   *Outcome:* Superficial resolution.
      *   *Mitigation:* The debrief must force them to write out the equation $E = 0.5(2x) + 0.5(x/2)$ and ask "What is $x$ in the first term vs the second term?"

  ---

  ## 6. Debrief Guide: Mapping Physical to Formal

  Do not lecture. Use their actions to build the map.

  **1. The Prior (The Pool)**
  *   *Ask:* "What did you know before you touched the envelope?"
  *   *Map:* This is the **Shared Prior**. You knew the distribution was geometric and bounded.
  *   *Point:* In the standard paradox, the prior is often assumed to be uniform over an infinite range (impossible). Here, you had a *real* prior.

  **2. The Physical Cue (The Signal)**
  *   *Ask:* "Did the weight change your mind?"
  *   *Map:* This represents **Empirical Evidence** updating the prior.
  *   *Point:* In the pure logical paradox, there is no signal. By adding weight, we introduced *information*. If the signal is perfect, the paradox vanishes. If it's noisy, it creates **Decision Anxiety**.

  **3. The 5/4 Argument (The Expectation)**
  *   *Ask:* "In Round 2, who felt stupid switching back?"
  *   *Map:* This is the **Conditional Expectation Error**.
  *   *Point:* The argument treats the amount in your hand ($V$) as a fixed constant, but in one branch of the calculation ($2V$), $V$ is the smaller amount, and in the other ($V/2$), $V$ is the larger amount. You cannot hold $V$ fixed while changing its relationship to the other envelope.

  **4. The Iteration (The Regress)**
  *   *Ask:* "If you switched back, why not switch again?"
  *   *Map:* This is the **Infinite Regress**.
  *   *Point:* If the argument were valid, you would swap forever. Since you can't, the argument must be invalid.

  **5. The Limitation (What We Failed to Reproduce)**
  *   *Honest Note:* "This staging necessarily fails to reproduce the **Improper Prior**. In our game, there was a maximum ($8). In the true philosophical paradox, the distribution is often assumed to be unbounded. If there is no maximum, you can never rule out the case where you hold the smaller amount. Our game *solved* the paradox with the cutoff; the philosophical puzzle exists only where the cutoff is removed. You felt the pressure of the logic, but the physical cash gave you an escape hatch the pure theorist does not have."

