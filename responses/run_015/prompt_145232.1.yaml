answer: |-
  ### Executive Summary

  Your package **holds together**, but it is precariously balanced on the definition of "legitimacy." You are using the term in two different registers: a *sociological* register (what makes a regime stable and accepted) and a *moral* register (what makes a regime right or justified). If you treat these as synonymous, the package collapses. If you distinguish them, the architecture stands.

  Below is the audit of tensions, ordered by severity, followed by answers to your specific structural questions.

  ---

  ### Tension Audit (Ordered by Severity)

  #### 1. The Singapore Justification Gap: (2) vs. (5)
  **Severity:** High
  **The Conflict:** Commitment (2) claims Singapore possesses "output legitimacy" sufficient to stabilize the regime due to institutional scaffolding. Commitment (5) states that prosperity/order can *never fully justify* authoritarian rule because permanent exclusion from decision-making cannot be traded for growth.
  If Singapore is authoritarian (weak input/permanent exclusion), (5) implies it is morally unjustified. But (2) implies it possesses a form of legitimacy that makes it stable and acceptable. If "Legitimacy" in (2) implies "Moral Justification," (5) directly contradicts it.
  **Cheapest Repair:** Distinguish **Sociological Legitimacy** from **Moral Justification**.
  *   **Cost:** You must concede that Singapore is *stable* and *functionally legitimate* (in the eyes of its citizens) but *not fully morally justified* (by liberal-democratic standards). You retain (2) as a descriptive claim about stability and (5) as a normative claim about rights.
  *   **Revision:** Amend (2) to specify "output legitimacy can stabilize... even if it falls short of full moral justification."

  #### 2. The Separability Trap: (1) vs. (5)
  **Severity:** Medium
  **The Conflict:** Commitment (1) says input and output legitimacy are "separable" and "neither fully reduces to the other." Commitment (5) says output can *never* justify the lack of input ("cannot be traded").
  If they are truly separable, one should theoretically be able to compensate for the other in a justification calculus. By saying output *cannot* trade for input, (5) risks making input lexically prior, which undermines the "separability" claim in (1).
  **Cheapest Repair:** Clarify that **Separability $\neq$ Interchangeability**.
  *   **Cost:** You must articulate that while the *sources* of legitimacy are distinct (separable), they are not *fungible* currencies. You can have one without the other, but you cannot use one to purchase the moral authority of the other.
  *   **Revision:** Amend (1) to note that while dimensions are analytically distinct, they are not morally fungible.

  #### 3. The China Valuation Paradox: (3) vs. (4)
  **Severity:** Low (Appears High)
  **The Conflict:** Commitment (3) denies China generates comparable legitimacy due to a lack of scaffolding. Commitment (4) grants China's success "genuine normative weight." It *appears* contradictory to say a regime's success matters morally (4) but generates no authority (3).
  **Status:** **This tension dissolves on closer inspection.**
  *   **Why it dissolves:** You are distinguishing between the **value of outcomes** (consequentialist weight) and the **right to rule** (deontological/procedural authority). It is coherent to argue that lifting millions from poverty is a *moral good* (4) without conferring a *moral right to govern* (3). The tension exists only if you assume "Normative Weight" must equal "Political Legitimacy."
  *   **Repair Cost:** $0. This requires no revision, only terminological precision in your exposition to ensure readers do not conflate "good outcomes" with "legitimate authority."

  ---

  ### Specific Structural Questions

  #### 1. Do (2) and (4) force me toward accepting China's legitimacy after all?
  **No.**
  *   **Logic:** Commitment (2) establishes a formula: *Legitimacy/Stability = Output + Scaffolding.* Commitment (4) establishes that *Output = Normative Weight.*
  *   **Application:** China has Output (per 4) but lacks Scaffolding (per 3). Therefore, China accumulates **Normative Weight** (from 4) but fails to achieve **Legitimacy** (per the formula in 2).
  *   **Result:** You are forced to accept that China's achievements are morally significant, but you are not forced to accept that the CCP has a legitimate right to rule. The "Scaffolding" variable acts as the veto switch.

  #### 2. Can (3) coherently coexist with granting China's success normative weight?
  **Yes.**
  *   **Logic:** As noted in the "Dissolving Tension" above, this relies on distinguishing *consequences* from *authority*.
  *   **Coherence:** You can consistently hold that a thief who feeds the poor has performed a morally weighty act (normative weight) without having a right to steal (legitimacy/authority). Similarly, China's poverty alleviation is a moral good, but the arbitrary nature of its rule (lack of scaffolding) denies it the status of legitimate authority.
  *   **Risk:** The only risk is rhetorical. If you emphasize (4) too heavily without qualifying it against (3), critics will accuse you of soft authoritarianism. You must explicitly state that normative weight does not accumulate into political rights.

  #### 3. Does (5) undermine (2) by making Singapore's partial, output-based legitimacy impossible?
  **Only if you conflate Stability with Justification.**
  *   **Logic:** Commitment (5) bans the *trade* of exclusion for growth *alone*. Commitment (2) explicitly says Singapore survives because of growth *plus* "institutional scaffolding" (courts, feedback, succession).
  *   **Analysis:** Technically, Singapore passes the "alone" test in (5) because it offers scaffolding. However, Singapore still maintains "permanent exclusion from collective decision-making" (weak input).
  *   **Resolution:** (5) undermines Singapore's *moral justification*, but not its *sociological stability*. (2) describes why the regime *stands*; (5) describes why the regime *ought not to exist* in an ideal moral framework.
  *   **Verdict:** (5) does not make Singapore's legitimacy impossible; it makes it **morally incomplete**. Singapore remains a "stable authoritarianism" rather than a "justified democracy."

  ---

  ### Final Recommendation

  Your package is robust, but it hinges on the **Scaffolding** concept. You treat Scaffolding as the bridge between raw Output and durable Legitimacy.

  *   **The Weak Point:** Commitment (5) is your moral anchor. If you soften it to accommodate Singapore's stability, you lose the critical bite of your argument against China. If you harden it too much, Singapore becomes indistinguishable from China.
  *   **The Fix:** Maintain the distinction between **Endurance** (2 & 3) and **Rightness** (5).
      *   Singapore: High Endurance, Partial Rightness.
      *   China: High Endurance (currently), No Rightness.
      *   Liberal Democracy: Variable Endurance, Full Rightness.

  This tripartite distinction allows you to value China's poverty alleviation (4) without legitimizing its rule (3), while acknowledging Singapore's success (2) without endorsing its authoritarianism (5).
