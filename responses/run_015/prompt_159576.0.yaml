answer: |-
  **DOCUMENT TYPE:** Adversarial Collaboration Pre-Registration & Joint Statement
  **PARTIES:** "Nativist" (Pro-PoS), "Rich-Input" (Anti-PoS)
  **MEDIATOR/OVERSIGHT:** [Department Head/Requester]
  **DATE:** October 26, 2023
  **STATUS:** Draft for Signature (With Epistemic Annotations)

  ***

  ### PREAMBLE: FEASIBILITY ASSESSMENT

  **Mediator Note:** The request asks for a document the parties *should* have produced. In practice, producing a signed joint statement on this topic is historically near-impossible because the "Poverty of the Stimulus" (PoS) is often used by Nativists as a shield against empirical falsification (i.e., "show me a working model or I'm right"), while Rich-Input proponents often use it as a sword against theory (i.e., "you haven't specified the gene, so you're wrong").

  This document forces specificity that both parties usually avoid. **Warning:** Several "Agreed Claims" below are tagged as "Manufactured Consensus." This indicates areas where the parties agree to the *words* for the sake of the collaboration, but hold divergent private interpretations that may reignite the dispute during the testing phase. If either party refuses to sign Section 1 without heavy qualification, the collaboration should be aborted.

  ***

  ### SECTION 1: AGREED CLAIMS (LOGICAL FOUNDATIONS)

  *Instructions: Each claim is tagged with a Confidence/Consensus Level.*
  *   **[RS]** = Rock Solid (Both agree on fact and implication)
  *   **[CD]** = Confident but Different (Both agree on fact, disagree on why it matters)
  *   **[MC]** = Manufactured Consensus (Agreed only to proceed; definitions are thin)

  1.  **The Logical Form of PoS:** The argument consists of three premises: (A) A description of the Attainment (the specific grammatical competence the child achieves); (B) A description of the Input (the data available to the child); (C) A Learnability Claim (that no learner of type *L* could derive *A* from *B* without prior bias *P*). **[RS]**
  2.  **Negative Evidence:** The absence of explicit negative evidence (correction) in child-directed speech is established. However, absence of evidence is not evidence of absence regarding the *availability* of indirect statistical cues or pragmatic scaffolding. **[RS]**
  3.  **Classic Learnability Results:** Gold's Theorem and related formal learnability results rule out identification in the limit for super-finite classes of languages by *idealized* learners with *no* priors. They do not strictly rule out biological learners with specific computational budgets, noise tolerance, or domain-general biases. **[CD]** (Nativist views this as a strong constraint; Rich-Input views it as inapplicable to real-time acquisition).
  4.  **Definition of "Innate":** We agree to disambiguate "innate" into the following distinct categories, and specify which is at issue for each claim:
      *   *Species-Typical:* Present in all neurotypical humans.
      *   *Genetically Specified:* Directly encoded in DNA (high confidence).
      *   *Canalized:* Developmentally robust against environmental variation.
      *   *Input-Independent:* Emerges without specific linguistic triggering.
      *   *Unlearned-by-Current-Mechanisms:* Not yet simulated by domain-general models. **[MC]** (Nativist often conflates the last two; Rich-Input conflates the first and last).
  5.  **Burden of Proof:** The Nativist bears the burden of specifying the *Attainment* precisely enough to test learnability. The Rich-Input proponent bears the burden of producing a *Learner* that operates under plausible cognitive constraints (memory, time, data). **[RS]**

  ***

  ### SECTION 2: DISAGREEMENTS TABLE (CRUXES & PRE-REGISTRATIONS)

  *Instructions: Predictions must be quantitative or binary where possible. "Further research" is not a prediction.*

  | # | Crux / Issue | (b) Nativist Formulation | (c) Rich-Input Formulation | (d) Agreed Test / Evidence | (e) Nativist Prediction | (f) Rich-Input Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Evidential vs. Procedural Poverty**<br>*(Is the info missing, or just hard to compute?)* | The input *lacks* the necessary cues (Evidential). No amount of processing extracts what isn't there. | The input *contains* the cues, but previous models lacked the compute/architecture to find them (Procedural). | **Corpus Information Bound:** Calculate the mutual information between n-gram/dependency statistics in a child-sized corpus and the target grammatical judgment. | MI will be near zero for core dependencies (e.g., auxiliary fronting). Input is truly sparse. | MI will be statistically significant (>0.8 correlation) given modern embeddings. Input is rich. |
  | **2** | **Parity of Learner**<br>*(What counts as a "possible" learner?)* | The learner must be restricted to mechanisms known to be human-plausible *prior to language exposure*. Modern LLMs are too data-hungry. | The learner must be a functioning algorithm that learns from data. If a neural net can do it, "unlearnable" is falsified, even if the net isn't a perfect brain model. | **The "No-UG" Challenge:** Train a transformer/RNN on child-matched data volume (not web-scale) with no linguistic priors. | It will fail to generalize to the specific PoS constraints (e.g., structure sensitivity) at human levels. | It will match child-like generalization curves on structure-sensitive tasks. |
  | **3** | **The Acquisition Margin**<br>*(Quantifying the gap)* | The gap is measured in *complexity*. Even a small bit-gap requires specific encoding if the search space is combinatorial. | The gap is measured in *data efficiency*. If the bit-gap is small enough, domain-general stats cover it. | **Bit-Count Proxy:** Estimate bits of information required to specify the parameter vs. bits available in 5 years of input. | If Gap > 10^4 bits, it implies innate specification. (Threshold: High) | If Gap < 10^6 bits, it is learnable via compression. (Threshold: High) |
  | **4** | **Hypothetical A: The Perfect Record**<br>*(Complete input + Domain-General Learner succeeds)* | **Scenario:** A verified complete record of one child's input trains a non-nativist learner to adult competence. | **Scenario:** Same as left. | **Interpretation of Success:** Does this refute nativism? | **No.** It shows the *model* worked, not that the *child* used that mechanism. The brain might still be nativist. (Refutation failed). | **Yes.** Existence proof that the stimulus is not "poor." The PoS argument is logically dissolved. (Refutation succeeded). |
  | **5** | **Hypothetical B: Transmission & Regularization**<br>*(Creolization/Imperfect Input scenario)* | **Scenario:** Children learn from adults with imperfect/variable grammar. | **Scenario:** Same as left. | **Outcome:** Do children regularize structure *not* reliably present in their input? | **Yes.** Children will impose structure (e.g., consistent word order) absent in input. Evidence of innate bias. | **No/Mixed.** Children will regularize only based on frequency biases present in the aggregate input or communicative pressure, not grammar-specific rules. |

  ***

  ### SECTION 3: VERBAL VS. SUBSTANTIVE DISPUTE ANALYSIS

  **1. The "Innate" Verbal Dispute**
  *   **Verdict:** 80% Verbal.
  *   **Analysis:** A significant portion of the fighting stems from the Nativist using "innate" to mean "not learned by the models Rich-Input has built so far," while Rich-Input hears "genetically encoded module."
  *   **Resolution:** By adopting the taxonomy in Claim #4, we isolate the substantive claim. If the Nativist means "Unlearned-by-Current-Mechanisms," the dispute is temporary (empirical). If she means "Genetically Specified," the dispute requires genetic evidence neither side currently possesses.
  *   **Consensus Flag:** **[MC]** We suspect the Nativist will retreat to "Unlearned-by-Current-Mechanisms" if pressed for evidence, rendering the claim unfalsifiable in the short term.

  **2. The "Learnability" Substantive Dispute**
  *   **Verdict:** 100% Substantive.
  *   **Analysis:** This is a math and engineering problem. Either a learner with budget *X* can extract pattern *Y* from data *Z*, or it cannot.
  *   **Resolution:** Crux #2 (Parity of Learner) addresses this. The disagreement is not about words, but about the computational power of the human brain relative to current AI.
  *   **Consensus Flag:** **[RS]** Both agree this is testable, though they disagree on the outcome.

  **3. The "Acquisition Margin" Substantive Dispute**
  *   **Verdict:** Substantive, but currently unmeasurable.
  *   **Analysis:** We lack a common metric for "bits of grammar." The Nativist measures in parameters/rules; the Rich-Input proponent measures in vector space compression.
  *   **Resolution:** Crux #3 forces a proxy metric. If we cannot agree on a proxy, the dispute remains verbal.
  *   **Consensus Flag:** **[CD]** We agree a number *would* settle it, but we disagree on what number counts as "small."

  ***

  ### MEDIATOR'S EPISTEMIC POST-SCRIPT (Required by Prompt)

  **Can this task be done well?**
  Barely. The structure of the "Poverty of the Stimulus" argument is historically resilient because it is often formulated as a *failure of imagination* (no one has built a learner yet) rather than a *proof of impossibility*.

  *   **The "Gizmo" Problem:** Your request for the "Acquisition Margin" (Crux #3) is the strongest lever, but it risks question-begging. There is no agreed-upon unit of "grammar" to count bits of. If the Nativist defines grammar as "abstract principles" and the Rich-Input guy defines it as "probability distributions," the bit-count will never match. I have flagged this in Section 3.
  *   **The "Parity" Problem:** Crux #2 (Parity of Learner) is where the collaboration will likely fracture. The Nativist can always claim a successful neural network is "biologically implausible" (e.g., too many parameters, wrong architecture). The Rich-Input guy can always claim the network is "proof of principle." I have pre-registered their interpretations in Hypothetical A to prevent this goalpost-shifting, but signing this requires the Nativist to admit that *if* a domain-general learner works, her theory is in trouble. Many Nativists will not sign that.
  *   **Manufactured Consensus:** Section 1, Claim #4 (Definitions) is the thinnest ice. In private, the Nativist likely believes "Species-Typical" implies "Genetically Specified for Language." The Rich-Input guy believes "Species-Typical" implies "Domain-General Cognitive Capacity." They are signing the same words to mean different things.

  **Recommendation:** If the Nativist refuses to accept the prediction in **Hypothetical A** (that a successful domain-general learner counts as evidence against PoS), the collaboration should be terminated. That condition is the only thing that makes the dispute empirical rather than theological.
