answer: |-
  Here are the five nearest concepts from the philosophy of science and modelling literature, carved to show where they fit and where they fail to capture the specific phenomenon you are describing.

  ### 1. Constructive Empiricism (van Fraassen)
  *   **The Fit:** This view holds that science aims for *empirical adequacy* (saving the phenomena) rather than *truth* about unobservables. It perfectly captures the stance of the reviewer or the "no" camp in your examples: "You've shown the model works, not that the entity is out there."
  *   **The Gap:** Constructive empiricism is a stable philosophical stance. It advises you to *consistently* withhold belief in unobservables. It does not account for the **oscillation** (your point c). It cannot explain why the *same person* asserts the entity is a cause in the Introduction and a convenient label in the Discussion. Van Fraassen would say they are being inconsistent, not structurally adaptive.

  ### 2. Real Patterns (Dennett)
  *   **The Fit:** Dennett argues that an entity is real if positing it allows for genuine compression and prediction of the data ("earns its keep"). This matches your criterion (b) exactly. If the latent variable predicts better than the null, it is a "real pattern."
  *   **The Gap:** This view collapses the distinction between "predictive success" and "reality." If the model works, the entity is real. Period. It cannot explain why the "yes" camp feels the need to retreat to instrumentalism in the Discussion section. If the pattern is real, it should be real in the Discussion too. Dennett's view doesn't allow for the **contextual sliding** you observe.

  ### 3. Perspectival Realism (Giere / Massimi)
  *   **The Fit:** This suggests that truth is relative to a model or a perspective. There is no "view from nowhere." This accommodates the idea that the entity exists *relative to the model*.
  *   **The Gap:** Perspectival realism is usually a stable pluralism (Model A has Entity X, Model B has Entity Y, both are valid). It doesn't capture the **rhetorical modulation** within a single paper. It doesn't explain why the scientist feels pressure to *downgrade* the ontology of the entity when moving from motivation to limitation. It treats the perspective as fixed for the duration of the model, not fluid across the sections of a manuscript.

  ### 4. Carnap's Internal/External Questions
  *   **The Fit:** Carnap distinguished between questions asked *within* a linguistic framework (e.g., "Is there a white piece of paper on my desk?") and questions *about* the framework (e.g., "Do physical objects exist?"). He argued external questions are pragmatic, not theoretical. This explains why no empirical fact settles the dispute (your point a).
  *   **The Gap:** Carnap would say the scientists are confusing internal and external questions. But your observation is more subtle: they are **using** the confusion. They treat the entity as internal (real) when it helps them claim significance, and external (pragmatic) when it helps them dodge criticism. Carnap provides the logic for the stalemate, but not the sociology of the slide.

  ### 5. The Semantic View of Theories (Suppe; Morgan & Morrison)
  *   **The Fit:** This view treats models as mediators between theory and the world, not direct reflections of it. Entities are model-dependent. This explains why the entity is "defined by the model" (your point b).
  *   **The Gap:** Like Perspectival Realism, this is usually a static account of model structure. It describes *where* the entity lives (in the model), but it doesn't name the practice of **ontological modulation** where the scientist changes their claim about *how* it lives there depending on the rhetorical load of the paragraph.

  ***

  ### The Diagnosis
  None of these existing terms capture the **triad** you identified: (a) empirical equivalence, (b) predictive criteria for reality, and crucially, (c) the **intra-agent oscillation** based on rhetorical context.

  The literature treats "Realism" and "Instrumentalism" as competing stances one *adopts*. You are describing a practice where they are **resources one deploys**.

  ### The Coinage: Pragmatic Ontological Oscillation
  I propose we call this **Pragmatic Ontological Oscillation (POO)**.

  **Definition:**
  Pragmatic Ontological Oscillation is the structural practice in model-based science where a researcher modulates the ontological commitment to a model entity (sliding between "real cause" and "instrumental summary") depending on the explanatory or defensive work required at that specific stage of the scientific argument, without treating the shift as a contradiction.

  **Why "Pragmatic"?**
  Because the truth-value of the claim "X exists" is not determined by correspondence to the world (which is underdetermined), but by the *utility* of the claim in the current context.
  *   **Context A (Introduction/Hypothesis):** Utility = Motivation. The entity must be robust enough to justify the study. *Commitment: High.*
  *   **Context B (Discussion/Limitations):** Utility = Defense. The entity must be flexible enough to absorb criticism about heterogeneity or measurement error. *Commitment: Low.*

  **Why "Oscillation"?**
  Because it is not a stable pluralism (holding both views at once) nor a simple inconsistency (forgetting what one said). It is a rhythmic movement back and forth that is reproducible across papers and authors. It is a feature of the *lifecycle of a model*, not a bug of the scientist.

  ### Boundary Cases
  To ensure this carving is precise, we must distinguish POO from its neighbors:

  1.  **POO vs. Hypocrisy/Dishonesty:**
      *   *Hypocrisy* implies the scientist knows the truth and hides it.
      *   *POO* implies the scientist genuinely experiences the entity as real in Context A and instrumental in Context B. The "reality" is indexed to the *function*. It is not lying; it is context-dependent truth-telling.
  2.  **POO vs. Genuine Pluralism:**
      *   *Pluralism* (e.g., "There are multiple valid ways to carve nature") is a stable philosophical position. A pluralist says, "Both stances are valid simultaneously."
      *   *POO* is sequential and rhetorical. The scientist does not say "Both are valid"; they say "It is a cause" (now) and "It is a label" (later). They do not acknowledge the shift as a philosophical stance; they experience it as "being precise."
  3.  **POO vs. Ordinary Inconsistency:**
      *   *Inconsistency* is accidental (I forgot I claimed X).
      *   *POO* is functional. If you point out the inconsistency, the scientist will often justify it: "Well, in the sense of the model, yes, but in the sense of the neural substrate, no." The shift is defended, not retracted.

  ### Resolution Conditions
  You asked what would count as resolving such a dispute. If POO is structural, **empirical data cannot resolve it**, because the dispute is not about the data (as you noted, they agree on the numbers).

  Resolution requires **Meta-Modelal Clarity**. A dispute of this kind is only resolved when the parties stop arguing about the *entity* and start arguing about the *purpose of the model*.

  1.  **Failure Condition:** Trying to prove the latent variable is "really real" with better fit statistics. This will never work because fit statistics satisfy the instrumentalist criterion automatically.
  2.  **Success Condition:** Explicitly stating the ontological budget.
      *   *Example:* "We are treating this latent variable as a **mechanistic posit** for the purpose of generating interventions, but as a **phenomenological summary** for the purpose of cross-species comparison."
      *   Once the *pragmatic index* is made explicit, the oscillation stops being a source of friction and becomes a stated design feature.

  ### Application to Your Cases
  1.  **The Reviewer:** They are demanding you fix your ontological index. They want to know if you are selling a *mechanism* (which requires evidence beyond fit) or a *tool* (which only requires fit). You couldn't answer because your model is doing both, oscillating between them.
  2.  **The Linear Probe:** The "representation" camp is operating in the **Intro Phase** (we need this to be a cause to claim we understand the system). The "decodability" camp is operating in the **Discussion Phase** (we need this to be a label to avoid over-claiming about neural substrate). They are talking past each other because they are in different phases of the Pragmatic Ontological Oscillation.

  ### Summary
  There is no existing "-ism" that captures the *dynamic, rhetorical modulation* of ontological commitment. **Pragmatic Ontological Oscillation** names the structural necessity of this move in model-based science. It is not a failure of rigor; it is the friction required to make a mathematical object do work in the physical world. Recognizing it allows you to stop fighting about "reality" and start negotiating about "utility."
