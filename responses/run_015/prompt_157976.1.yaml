answer: |-
  **Q&A Prep Sheet: Newcomb, Copies, and "Copy-Robustness"**
  **To:** Self
  **From:** Prep Mode
  **Re:** Department Talk Next Week

  **Context:** 12 people. Intimate seminar style. Mostly CDT, some EDT, one Game Theorist. No functionalist background.
  **Goal:** Shift the debate from *causation vs. evidence* to *identity/control*. Do not get bogged down in defending CDT/EDT orthodoxy.

  ---

  ### 1. What to Concede in the First Two Minutes
  Don't try to sell this as a finished metaphysics of agency. If you dig in on *why* the copy is you, you'll die on that hill before you get to the decision theory.

  *   **Concede the terminology:** "Look, 'copy-robustness' is a placeholder term. I'm not offering a full theory of personal identity here. I'm using the simulation setup as an intuition pump to isolate a specific normative pressure that standard Newcomb cases conflate with prediction accuracy."
  *   **Concede the overlap:** "I know this looks suspiciously like Timeless Decision Theory or Updateless Decision Theory. I'm not claiming to discover a new continent. I'm claiming the map we're using (CDT vs. EDT) labels the terrain wrong. The fight isn't about causality; it's about which logical facts count as 'fixed' when you deliberate."

  ---

  ### 2. The Objections (In Likely Order)

  #### Objection 1: The CDT Hardliner (The "Leverage" Attack)
  **Who:** One of the two hardliners.
  **Phrasing:** "Okay, let's grant the setup. The copy is dead. The box is already filled. There is zero causal mechanism by which your hand movement changes the content of the box. Standard decision theory says you maximize expected utility conditional on the states of the world being fixed. The state of the box is fixed. So why on earth would you one-box? If you say 'because the copy is you,' you're begging the question. You're smuggling in a causal link by calling it 'identity.'"

  **Your Reply (1-2 mins):**
  "I'm not smuggling in a causal link. I'm challenging the idea that the *only* thing 'up to you' is what you can causally influence. When you deliberate, you aren't just moving meat; you're resolving a logical function. If the copy is functionally identical, then when you ask 'What if I one-box?', you aren't asking about a world where the box is different *because* of magic. You're asking about a world where the *algorithm* outputs 1. Since the copy ran the same algorithm, the box contains the million.
  The CDT intuition relies on the idea that the box's content is a 'fixed state' like the weather. I'm saying it's not weather; it's output from a function that you are currently executing. You don't need causal leverage to have logical leverage."

  **Where this is soft:** You haven't explained *why* deliberation tracks logical facts rather than causal states. To a hardline CDTer, "logical leverage" sounds like mysticism. If they press on *how* you cash out "logical leverage" without causation, you might stall.

  #### Objection 2: The Formal Epistemologist (The "Redundancy" Attack)
  **Who:** One of the EDT sympathizers.
  **Phrasing:** "I'm happy you're getting people to one-box, but aren't you just reinventing EDT? In standard EDT, I one-box because my choice is strong evidence that the box is full. In your case, my choice is strong evidence that the *copy* chose one-box, which means the box is full. The math comes out the same. Why do we need this new 'copy-robustness' concept? It seems like you're just dressing up conditionalization in functionalist clothing."

  **Your Reply (1-2 mins):**
  "It's not just conditionalization. EDT says, 'My choice is *evidence* of the copy's choice.' That implies they are two distinct events correlated by a common cause (the algorithm). My claim is stronger: They aren't two distinct events in the relevant sense. They are two instantiations of the *same* decision problem.
  If it were just evidence, then if I learned the copy was slightly biased—say, it had a 99% correlation but wasn't identical—EDT might still say one-box. But my view says the normative force drops off as the functional identity drops off. It's not about the probability of the correlation; it's about whether I view the copy's output as *my* output. EDT misses the 'agency' component; it treats me as an observer of my own hands."

  **Where this is soft:** The distinction between "high correlation" and "identity" is fuzzy. If the copy is 99.9% identical, does the normative force drop? If not, you're back to EDT. If yes, where is the cutoff? You don't have a metric for that yet.

  #### Objection 3: The Game Theorist (The "Equilibrium" Attack)
  **Who:** The single game theorist.
  **Phrasing:** "I'm hearing a coordination problem. You and the copy are players on the same team, moving sequentially, but you can't communicate. In game theory, we solve this with pre-commitment or focal points. Why complicate it with 'robustness'? Just model this as a team game where the payoff matrix dictates the equilibrium. If the payoff is higher for (One-Box, One-Box), rational agents coordinate there. You don't need metaphysics about copies; you need a better payoff structure."

  **Your Reply (1-2 mins):**
  "The problem is that in my setup, the copy *cannot* coordinate. It's dead. It's already moved. Standard game theory assumes players are distinct agents optimizing their own utility within a rule set. Here, the 'rule set' includes the fact that the other player is *you* in all but spatiotemporal location.
  If you treat it as a team game, you assume I can commit to a strategy. But I'm not committing; I'm just choosing. The game theorist's solution works if I can bind my future self. But this is about binding my *identical* self who no longer exists. The 'pull' to one-box exists even when I know I can't commit. That suggests the normative force comes from the identity relation, not the strategic equilibrium."

  **Where this is soft:** Game theorists are good at expanding the strategy space. They might argue that "being the kind of agent who one-boxes" *is* the strategy, and you selected that strategy before the simulation started. They can absorb your point into "sequential equilibrium with type uncertainty."

  #### Objection 4: The General CDT Sympathizer (The "Intuition" Attack)
  **Who:** A softer CDT person, genuinely confused.
  **Phrasing:** "I buy that the setup is interesting, but I don't feel the pull you say I should. If I know the copy is gone, I feel like I'm just taking money left on the table. You're asserting that people feel the one-box pull in this variant. Do you have data? Or is this just your intuition versus mine? If it's just intuition, why should I trust yours over the CDT intuition that says 'you can't change the past'?"

  **Your Reply (1-2 mins):**
  "That's fair, and honestly, that's the empirical hole in the project. I'm relying on the philosophical 'we'—the idea that if we strip away the predictor's mystique, the causal intuition should dominate, but it doesn't.
  But think about it this way: If you were told the simulation *wasn't* destroyed, and you'd meet the copy afterwards, you'd coordinate. If you're told the copy is a perfect logical token of you, the 'meeting' happens in the logical space, not physical space. I'm asking you to check if the physical destruction actually changes your deliberative stance. If it does, fine, my thesis fails. If it doesn't, then CDT is relying on physical causation where it shouldn't."

  **Where this is soft:** This is the weakest link. If half the room says "Nah, I'd two-box that variant instantly," your central claim (that the pull survives) is empirically undermined. You have no backup if the intuition pump leaks.

  ---

  ### 3. The Single Reply That Has to Land
  **The Distinction:** You must successfully distinguish **Correlation** (EDT) from **Logical Instantiation** (Your View).

  **The Soundbite:**
  "EDT tells me to one-box because my choice is a *sign* that the box is full. My view says I should one-box because my choice *makes* the box full—not causally, but logically. It's the difference between seeing smoke and inferring fire (EDT) versus realizing you are the fire (Copy-Robustness). If I can't get you to see that distinction, I haven't moved the debate; I've just renamed EDT."

  **Why it must land:** If this fails, you are just an EDT wolf in CDT sheep's clothing. The CDTers will eat you alive for ignoring causation, and the EDTers will ignore you for adding unnecessary metaphysics.

  ---

  ### 4. The Question You Hope Nobody Asks
  **The Question:** "Isn't this just Timeless Decision Theory (TDT) or Updateless Decision Theory (UDT) rebranded? Eliezer Yudkowsky and Wei Dai wrote about this exact 'logical control over copies' setup fifteen years ago. What's the actual novelty here?"

  **Why you dread it:**
  1.  **Novelty:** It threatens the "work-in-progress" credibility. If you haven't engaged with the LessWrong/FAI literature, you look out of touch.
  2.  **Complexity:** TDT/UDT have formalisms you might not be ready to defend on the fly.
  3.  **Audience Fit:** Since nobody in the room works on functionalism, if *one* person knows this literature, they will dominate the Q&A.

  **Prepared Deflection (if asked):**
  "I'm aware of the TDT/UDT literature. My goal isn't to propose a new decision algorithm to beat the market. It's to diagnose *why* the standard academic debate (CDT vs. EDT) gets stuck. TDT offers a formal solution; I'm trying to isolate the specific philosophical assumption ('copy-robustness') that makes that solution plausible, so we can argue about *that* assumption directly, rather than getting lost in the formalism."
  *(This admits the overlap but pivots back to your philosophical diagnosis rather than their formal solution.)*
