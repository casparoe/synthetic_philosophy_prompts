  # Part 1: The Logical Tree (Design Notes for the Facilitator)

  Before you print the quiz, here is the map of the territory. This explains how the ten questions sort your group into the seven philosophical "leaves" without using jargon.

  ### The Three Axes of the Tree
  Every question forces a choice on three underlying dimensions. The answer options (1, 2, 3) correspond to these positions:
  *   **Option 1 (The Participant):** Blame is *fitting* (they deserve it) AND *appropriate to express* (you should show it).
  *   **Option 2 (The Privatist):** Blame is *fitting* (they deserve it) BUT *inappropriate to express* (keep it to yourself).
  *   **Option 3 (The Skeptic/Manager):** Blame is *not fitting* (no one deserves it); focus only on *management/consequences*.

  ### Locating the Positions
  Here is where the seven target positions land on this tree:

  1.  **Strawsonian / Quality of Will:** Mostly **1s**. They see blame as a natural human response to bad will. They might pick **2** on "Dead Friend" (can't express to the dead) or "4-Year-Old" (objective stance), but generally **1**.
  2.  **Scanlonian / Relationship:** Mostly **1s**, but sensitive to **2** on "Private Promise" or "Dead Friend." For them, blame *is* the relationship change. If the relationship is over (death) or private, expression changes. Hard to distinguish from Strawson without follow-up.
  3.  **Reasons-Responsiveness:** **3s** on "Chatbot," "4-Year-Old," and "Ignorant Cruel." **1s** on "Distracted Driver." They care about the *capacity* to understand reasons.
  4.  **Deep-Self / Identification:** **3s** on "Past Self" (if you've changed) and "Attitude Only." **1s** on "Distracted Driver." They care about whether the action reflected who you *really* are.
  5.  **Consequentialist / Forward-Looking:** Mostly **3s**, but might pick **1** if blaming helps. The key tell is "Chatbot" or "4-Year-Old": if they pick **1** *because it fixes the behavior*, they are here. If they pick **3** *because bots can't deserve it*, they are Reasons-Responsiveness. (See "Indistinguishable Leaves" below).
  6.  **Hard-Incompatibilist / Revisionist:** Almost all **3s**. They deny desert across the board. Even the "Distracted Driver" gets a **3** (causality, not blame).
  7.  **Fittingness-Only:** Mostly **2s**. They think people deserve blame, but voicing it is usually cruel, useless, or counter-productive.

  ### Empty or Incoherent Cells
  *   **The "Reverse-Privatist" (Not Fitting, But Express Anyway):** There is no option for "Blame isn't fitting, but I'll do it anyway." This is theoretically possible (lying to manipulate), but philosophically unstable for a *reading group* discussion on blame. We assume honesty.
  *   **The "Bot-Blamer" (Bot Yes, Human No):** A pattern of **1s** on Chatbot/Corp but **3s** on Drivers is incoherent. If a bot is a valid target, a human certainly is. Anyone selecting this is likely confused or answering ironically.

  ### Indistinguishable Leaves
  *   **Strawson vs. Scanlon:** Both look like **1s**. The quiz treats blame as a reaction; Scanlon treats it as a relationship update. In a pub setting, these function identically. *To separate them:* Ask, "If you blamed them but they didn't care, would the blame still be valid?" (Strawson: Yes. Scanlon: No, the relationship shift failed).
  *   **Consequentialist vs. Strawson:** Both pick **1** on the Driver. *To separate them:* Ask, "If blaming them made them *worse*, would you still blame them?" (Strawson: Yes, they deserve it. Consequentialist: No, then don't blame).

  ---

  # Part 2: The Handout (The Quiz)

  **Instructions:** Read each case. Pick the response that matches your *gut reaction*. Don't overthink it. There are no right answers, only different maps.

  **The Options:**
  *   **(A)** I'd feel resentful/critical and think I'm right to show it.
  *   **(B)** I'd feel resentful/critical but think I should keep it to myself.
  *   **(C)** I wouldn't feel resentful; I'd just focus on fixing things or moving on.

  ***

  **1. The Smart Machine**
  A corporation's algorithm (or a sophisticated chatbot) denies you a loan based on biased data, ruining your credit. No human made the specific decision.
  *   (A) I'd feel angry at the company/bot and demand they acknowledge the wrong.
  *   (B) I'd feel angry at the company/bot, but arguing with an algorithm is pointless.
  *   (C) I wouldn't feel anger; I'd just fix the code or find a new bank.

  **2. The Dead Friend**
  A close friend betrayed a confidence last year, then died suddenly. You never confronted them.
  *   (A) I still feel betrayed and resentful, even though they're gone.
  *   (B) I feel betrayed, but expressing it now is disrespectful or useless.
  *   (C) I feel nothing but sadness; blame stops when life stops.

  **3. The Four-Year-Old**
  A child intentionally smashes a vase while looking you in the eye, just to see you react.
  *   (A) I'd scold them; they did something wrong and need to know.
  *   (B) I'd think they did wrong, but scolding is too harsh for that age.
  *   (C) I wouldn't call it "wrong"; I'd just teach them not to break things.

  **4. The Past You**
  You hurt someone's feelings last Tuesday. Since then, you've had a major realization and changed your outlook completely.
  *   (A) I feel guilty; I did it, so I own it.
  *   (B) I feel guilty, but dwelling on it doesn't help the new me.
  *   (C) That wasn't really "me" anymore; I don't feel guilt.

  **5. The Distracted Driver**
  A driver glances at a text for two seconds. They have no ill will. They hit a cyclist.
  *   (A) I blame them heavily; they chose to look away.
  *   (B) I think they are at fault, but anger is misplaced for a split-second error.
  *   (C) I don't blame them; it was an accident caused by distraction.

  **6. The Two Drivers (Moral Luck)**
  Driver A and Driver B both glance at texts for two seconds. Driver A hits a pedestrian. Driver B hits nothing.
  *   (A) I blame Driver A much more; the outcome matters.
  *   (B) They are equally at fault, but we treat Driver A differently.
  *   (C) Neither is to blame; it comes down to chance.

  **7. The Ignorant Cruelty**
  A man was raised in a household where cruelty was taught as kindness. He hurts someone, sincerely believing he is helping them.
  *   (A) I still blame him; he should know better than to hurt people.
  *   (B) I think he's at fault, but blaming him is unfair given his upbringing.
  *   (C) I can't blame him; he couldn't see the reasons not to do it.

  **8. The Good Act / Bad Heart**
  Person A donates to charity purely to evade taxes. Person B hates a specific group but never acts on it or speaks about it.
  *   (A) I criticize both for their inner motives.
  *   (B) I think their motives are bad, but only actions should be criticized.
  *   (C) Motives don't matter; I only look at the results.

  **9. The Private Promise**
  A friend breaks a promise that only the two of you knew about. No one else is affected.
  *   (A) I feel resentful; a promise is a promise.
  *   (B) I feel resentful, but I have no standing to make a public fuss.
  *   (C) I feel disappointed, but not morally resentful.

  **10. The Hidden Attitude**
  You discover a colleague secretly despises your ethnic group but has never treated you unfairly or acted on it.
  *   (A) I blame them for the thought itself.
  *   (B) The thought is blameworthy, but blame requires action.
  *   (C) Thoughts aren't blameworthy; only behavior is.

  ***

  # Part 3: The Scoring Key (For the Facilitator)

  **Step 1: Tally the Options**
  Count how many (A)s, (B)s, and (C)s each person selected.

  **Step 2: Identify the Dominant Pattern**

  *   **Mostly (C)s → The Skeptic (Hard-Incompatibilist or Consequentialist)**
      *   *Check Q5 (Driver):* If they picked (C) here, they are likely **Hard-Incompatibilists** (no one ever deserves blame).
      *   *Check Q1 (Bot) & Q3 (Child):* If they picked (A) here but (C) on humans, they are **Consequentialists** (blame is a tool, not a desert).
      *   *Pub Talk:* Ask them: "If blaming someone made things worse, would you still do it?"

  *   **Mostly (B)s → The Privatist (Fittingness-Only)**
      *   They believe people *deserve* blame but think expressing it is usually wrong or useless.
      *   *Pub Talk:* Ask them: "If blame is fitting, why is it wrong to say it? Is truth impolite?"

  *   **Mostly (A)s → The Participant (Strawson, Scanlon, or Deep-Self)**
      *   They see blame as a natural, fitting response. To distinguish them, look at specific questions:
      *   **Reasons-Responsiveness:** Picked (C) on Q3 (Child), Q7 (Ignorant), or Q1 (Bot), but (A) on Q5 (Driver). They care about *capacity*.
      *   **Deep-Self:** Picked (C) on Q4 (Past Self) or Q10 (Attitude). They care about *identity*.
      *   **Strawson/Scanlon:** Picked (A) almost everywhere, maybe (B) on Q2 (Dead Friend). They care about *will and relationship*.

  *   **The Moral Luck Split (Q6)**
      *   **(A):** Outcome matters (Blame the killer more).
      *   **(B):** Will matters (Blame equally, treat differently).
      *   **(C):** Luck matters (Blame neither).
      *   *Note:* This doesn't change the "Leaf" but shows how they apply it.

  **Step 3: Start the Discussion**
  Don't ask "What is your position?" Ask: "Why did Person X pick (C) on the Driver while Person Y picked (A)?" Use the tally to show that you are arguing about different *conditions* for blame, not just blame itself.

  ---

  # Part 4: Limitations & Follow-Up (Facilitator Notes)

  **Indistinguishable Pairs**
  1.  **Strawson vs. Scanlon:** Both will score mostly (A)s. The quiz treats blame as a *feeling/response*, which favors Strawson. Scanlon sees blame as a *judgment about relationship*.
      *   *Fix:* If the group splits on this, ask: "Is blame something you *feel* (Strawson) or something you *decide* about the relationship (Scanlon)?"
  2.  **Consequentialist vs. Strawson:** Both might pick (A) on the Driver.
      *   *Fix:* Ask the "Worse Outcome" question (see Key). If they say "Don't blame if it makes it worse," they are Consequentialists. If they say "They still deserve it," they are Strawsonians.

  **Empty Cells**
  *   If someone picks (A) on the Chatbot (Q1) but (C) on the Driver (Q5), they hold an incoherent view (machines deserve blame, humans don't). Point this out gently; they may have misunderstood the question.
  *   If someone picks (C) on "Fittingness" but (A) on "Expression" (not an option here, but conceptually), they are advocating "Noble Lies." This group usually collapses under scrutiny.

  **The "Branching" Constraint**
  Notice that Options (A) and (B) both accept *Fittingness* (Desert), while (C) rejects it. Options (A) and (C) accept *Expression/Action*, while (B) rejects it. This ensures that every single question forces the group to separate *Desert* from *Utility*. If half the group argues Desert and half argues Utility, the scores will reveal it immediately.
