  Bottom line: Inverse reinforcement learning cannot adjudicate the metaphysical status of moral facts because behavioral convergence is underdetermined. While stable reward functions might look like objective truths, they are equally consistent with shared human biology. Therefore, IRL fails to provide non-circular evidence for moral realism.

  The case for moral realism via inverse RL:
  Proponents argue that if IRL extracts a highly stable, cross-cultural reward function from diverse moral behaviors, this convergence mirrors scientific realism. Just as physics assumes diverse observations track underlying laws, consistent moral optimization suggests agents are tracking objective normative facts. If the reward function remains robust despite varying social conditioning, it implies an external anchor rather than arbitrary custom. This stability suggests humans are approximating a single, true moral topology, lending credence to the idea that the recovered reward function corresponds to irreducible moral properties existing independently of human psychology. Cultural noise averages out, revealing the signal of objective value beneath the variation. This suggests the reward function is discovered, not constructed, providing empirical weight to the realist claim that morality exists outside the mind.

  The anti-realist comeback:
  Anti-realists counter that IRL only recovers instrumental goals, not ontological truths. A stable reward function across cultures likely reflects shared evolutionary pressures and cognitive architecture, not objective moral facts. Humans converge on cooperation and harm avoidance because these traits ensure survival, not because they track normative reality. IRL demonstrates *how* we value, not *why* those values exist metaphysically. The recovered function is purely descriptive of psychological drives, leaving the realist claim of irreducible normative properties unsupported by behavioral data alone. Evolutionary game theory explains convergence without invoking platonic truths. Shared biology mimics objective truth perfectly well. Furthermore, IRL cannot distinguish between intrinsic value and deeply ingrained instrumental heuristic. The data looks the same whether we track truth or survival.

  Why the framework might be circular:
  The fundamental flaw is data selection. To apply IRL to "moral" behavior, researchers must first label actions as moral or immoral, presupposing the very normative framework under investigation. You cannot infer the reward function of morality without already assuming what counts as moral behavior. Additionally, interpreting behavior as "optimizing" assumes rationality aligned with specific norms. Thus, the output inevitably reflects the ontological assumptions baked into the input labeling, making the argument circular. It derives an 'ought' from an 'is' that was already filtered by an 'ought'. The algorithm cannot distinguish between tracking truth and tracking conditioned preference. The model structure itself imposes rationality where there may be none. Consequently, the recovered function is a mirror of the researcher's prior classifications, not an independent discovery.

  My verdict:
  I land firmly on the side that IRL offers no support for realism. The framework is methodologically naturalistic; it treats rewards as empirical variables to be fitted, not normative truths to be discovered. Even perfect convergence proves only shared psychology, not objective fact. The is-ought gap remains unbridged because IRL describes optimization processes, not the validity of the objectives. Consequently, using IRL to argue for realism commits a category error, mistaking functional consistency for metaphysical truth. Anti-realism remains the only position compatible with the method's naturalistic constraints. The math describes minds, not morals. Any claim otherwise projects metaphysical weight onto a statistical fit. Ultimately, the tool is blind to ontology. It cannot validate the reward, only model the agent.
