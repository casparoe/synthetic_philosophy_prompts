  **Her Rule: Actualist State-Specific Exclusion**
  > "Consciousness is the value of $\Phi^{Max}$ calculated on the **actual cause–effect structure** of the system in its **current state**. Only the complex with the absolute maximum $\Phi$ exists (Exclusion Postulate). The total quantity of consciousness in a domain is defined by the maximum $\Phi$ present, not the sum of disjoint complexes."

