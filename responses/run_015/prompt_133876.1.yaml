answer: |-
  The slogan conflates qualitative similarity with numerical identity, offering a poetic truth about social memory but no logical shield against the death of your original stream of consciousness during uploading.

  **1. Substrate-Neutral Patternism**
  *   **The Claim:** The self is purely informational software, so running the code on silicon is ontologically identical to running it on neurons.
  *   **Trivial?** No, it denies bio-essentialism and requires a robust theory of computational functionalism.
  *   **Defensible?** Plausible to physicalists, but rejected by biological naturalists who argue consciousness depends on specific causal powers of living tissue.
  *   **Supports Extension?** No, it supports copying; if the original biological instance is destroyed, this is replacement, not widening, because two identical patterns are still two distinct instances with separate subjective streams.

  **2. Hofstadter's Constitutive Recursion**
  *   **The Claim:** The "I" is literally the feedback loop of symbols referencing themselves, so wherever that specific recursive structure occurs, the "I" exists.
  *   **Trivial?** No, it is a specific metaphysical assertion about the nature of soulhood.
  *   **Defensible?** Controversial; it explains the feeling of selfhood well but fails to explain why one loop couldn't simply be a duplicate of another rather than the same entity.
  *   **Supports Extension?** No, a second loop is a second self, creating a branching identity problem where the original biological stream still terminates even if a digital twin continues.

  **3. Extended Mind Hypothesis**
  *   **The Claim:** Cognitive processes extend beyond the skull into tools and environments, so adding a digital host physically widens the boundaries of the mind.
  *   **Trivial?** No, it challenges standard cognitive boundaries regarding where the mind stops and the world begins.
  *   **Defensible?** Defensible for memory and calculation tasks, but less so for phenomenal consciousness or the unified subject of experience.
  *   **Supports Extension?** Weakly, it suggests integration but fails to prove the original biological consciousness continues rather than being swapped for a digital counterpart that merely acts like you.

  **4. Social Constitution of Identity**
  *   **The Claim:** You exist insofar as you are modeled by others, so uploading just creates higher-fidelity models in new hosts that keep you "alive" socially.
  *   **Trivial?** Trivially true as metaphor, but false if taken as literal ontological survival.
  *   **Defensible?** Defensible sociologically and psychologically, but not metaphysically regarding first-person experience.
  *   **Supports Extension?** No, this confirms symbolic immortality rather than literal survival, admitting the original dies while the reputation or memory persists in other brains.
