prompt: |-
  hey i'm putting together the take-home for my grad phil of mind seminar and i need an exam question that gets in the weeds on functionalism without letting people just recite Block's chinese nation argument or Putnam's multiple realizability objection like they've heard it in every intro course. i cooked up this weird hypothetical case: imagine a distributed cognitive architecture built entirely from old bimetalic thermostats and hydraulic pressure valves, wired so their collective state-transitions reproduce the full functional-causal profile of human nociception — same input-output mappings, internal feedback loops, modulatory pathways — but no neurons, no silicon, just expanding metal strips and water pressure. i want the question to ask whether this gadget genuinely has pain, and specifically to force students to navigate the tension between liberal functionalism (if it's the right causal role, it's mental) and the chauvinist worry that substrate matters for qualitative character. they need to consider whether multiple realizability saves functionalism or actually makes mental properties too cheap, and whether qualitative character can be fully captured by functional organization or if the thermostat-cloud reveals a gap.

  please write the exam prompt itself (suitable for about 90 minutes, expecting ~900 words), a model answer of about 650 words, and a marking scheme that distinguishes an A answer from a B. an A must: (1) map specific functional roles in the hypothetical rather than just saying 'same causal profile,' (2) use the thermostat case to explain why substrate independence cuts both ways — supporting liberal functionalism but also threatening to trivialize mental properties, and (3) engage directly with whether qualitative character reduces to functional organization or remains substrate-dependent. a B answer probably summarizes Block and Putnam generically and applies them superficially to the case. please don't include any citation requests, bibliographies, or prompts for specific page references — i want this fully answerable without library or web access. and keep the tone of the exam question itself formal, even if this request is casual.
