  1.  **Analyze the User's Query:**
      *   **Premise 1:** Hobbes is a nominalist about geometric figures (triangles/circles are names, not mind-independent entities).
      *   **Premise 2:** Hobbes claims civil philosophy can attain geometric certainty via the resolutive-compositive method.
      *   **Conclusion/Challenge:** Therefore, Hobbes's ontology of mathematics undermines his political deductions. If definitions are arbitrary (no real things to constrain them), a sovereign could arbitrarily redefine social contract terms and still call it a 'demonstration'.
      *   **Task:** Identify the precise mistake in this reasoning. Distinguish Hobbes's view on the *existence* of geometric objects from his view on the *logical necessity* of deductions from stipulated definitions. Explain why the resolutive-compositive method doesn't depend on Platonist/empiricist commitments.
