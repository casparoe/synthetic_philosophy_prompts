answer: |-
  The precise mistake in this line of reasoning is the conflation of **ontological nominalism** (the claim that universals are names rather than mind-independent entities) with **semantic voluntarism** (the claim that definitions can be arbitrarily altered without logical consequence). Hobbes argues that the certainty of geometry and civil philosophy arises precisely *because* we construct the definitions ourselves, not because the objects named exist externally; however, once definitions are stipulated, the logical consequences following from them are necessary and immutable, regardless of the ontological status of the terms.

  For Hobbes, truth is not a property of things but a property of propositions regarding the correct ordering of names. In geometry, we know a triangle's properties with certainty not because we observe perfect triangular forms in nature, but because we have stipulated the definition of a triangle and are merely tracing the logical implications of that stipulation. Similarly, in civil philosophy, the resolutive-compositive method does not depend on discovering Platonic forms of "Justice" or "State." Instead, it resolves the political phenomenon into its universal causes—human passions and reason—which are fixed facts of human nature. Because the causal powers of human nature (the desire for self-preservation, fear of death) are constant, the deductions made from them (the necessity of a sovereign to secure peace) possess geometric necessity.

  The sovereign cannot arbitrarily redefine the terms of the social contract and claim a valid "demonstration" because the authority of the deduction rests on the **Laws of Nature**, which are immutable precepts of reason discovered by the philosopher, not decrees issued by the magistrate. While the sovereign enforces the civil laws, the *scientific validity* of the political system depends on whether the definitions align with the inescapable goal of self-preservation. If a sovereign redefines the contract in a way that leads back to the state of nature, they have not created a new valid demonstration; they have simply broken the causal chain that guarantees security, thereby falsifying the practical conclusion of the political science. Thus, Hobbes's nominalism protects the authority of his deductions by grounding them in the internal consistency of reason and the fixed mechanics of human passion, rather than in contested external essences.

  Summary: Hobbes's nominalism secures political certainty because demonstrative truth depends on the logical consistency of stipulated definitions and fixed human passions, not on the mind-independent existence of universal essences.
