  **Credence: 0.42**

  I assign a 42% probability that the *best* interpretation of Smith's colonial critique in *Wealth of Nations* (WN) Book IV is primarily normative (justice/domination) rather than fiscal (efficiency/cost). While the moral language is potent, the architectural weight of the text favors political economy over moral philosophy.

