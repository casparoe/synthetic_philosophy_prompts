answer: |-
  Your intuitions are not merely professional habits; they are the refined reflexes of a practitioner who has spent a lifetime distinguishing signal from noise. You have correctly identified that "good explanation" is not a single metric but a balance between *fit* (making the data unsurprising) and *cost* (the complexity or flexibility required to achieve that fit).

  Your worry that you are reasoning in a circle is well-founded in the philosophy of science (specifically regarding "use-novelty" and the "problem of old evidence"). However, your practice is defensible. Below is a candidate principle constructed to formalize your intuitions, followed by its application to your cases, the hard truths it imposes, and the presuppositions required to defend it.

  ### The Candidate Principle: Risky Compression

  **Statement:**
  An explanation is superior to its rivals if and only if it achieves **predictive compression** through **independent constraint**.

  This principle has three operative clauses:

  1.  **Compression (The Virtue of Unification):** The explanation must account for a diverse range of phenomena using a structure that is simpler (has fewer free parameters) than the phenomena themselves. It must "compress" the data.
  2.  **Risk (The Virtue of Independent Purchase):** The structure used to achieve compression must entail consequences that were not used to construct the structure. These consequences must be specific enough that they could have been false (falsifiable) and were fixed *before* the evidence was examined.
  3.  **Consistency (The Constraint of Background Theory):** The explanation must not contradict established, well-confirmed background laws unless it provides a deeper framework that subsumes them. If it contradicts them without subsumption, a mechanism is mandatory to bridge the gap.

  ---

  ### Motivation for the Clauses

  *   **Clause 1 (Compression)** addresses your tension between **Maxwell (Unification)** and **Chronic Illness (Sprawl)**. Maxwell's equations reduced three phenomena (electricity, magnetism, light) to one framework with a fixed constant ($c$). The "chronic illness" theory reduces many phenomena to one cause, but usually by making the cause vague and adaptable. Compression requires that the theory *restricts* what can happen, not just that it *covers* what did happen.
  *   **Clause 2 (Risk)** addresses your **Uranus vs. Mercury** and **Independent Purchase** worries. Neptune was a "risky" prediction because the math fixed a specific coordinate in a empty sky. Vulcan was "safe" because the parameters were loose enough to hide anywhere. Risk penalizes flexibility.
  *   **Clause 3 (Consistency)** addresses your **Wegener vs. Semmelweis** tension. It distinguishes between a *gap* in knowledge (Semmelweis) and a *conflict* with known physics (Wegener).

  ---

  ### Verdicts on Your Cases

  **1. Wegener vs. Semmelweis (Resolved by Clause 3)**
  *   **Verdict:** Both your judgments stand, but for different reasons.
  *   **Analysis:** Semmelweis's intervention (washing) did not violate background physics. It was a causal correlation within a permissive framework (chemicals affect health). The lack of a mechanism was a *gap*, not a contradiction. Wegener's drift, however, required continents to plow through rigid oceanic crust. This violated the background geophysics of the time.
  *   **Principle Ruling:** When an explanation contradicts established background theory (Wegener), a mechanism is mandatory to resolve the conflict. When it merely fills a causal gap within a permissive framework (Semmelweis), mechanism is optional until further inquiry.
  *   **Why it works:** It prevents you from demanding the impossible (a mechanism for Semmelweis before germ theory existed) while preventing you from accepting the impossible (drift without a mechanism to overcome rigidity).

  **2. Uranus vs. Mercury (Resolved by Clause 2)**
  *   **Verdict:** Your diagnosis of "constraint" is precise.
  *   **Analysis:** The Neptune hypothesis consumed zero new degrees of freedom; it used Newtonian gravity (fixed) to predict a position (risky). The Vulcan hypothesis introduced a new body with flexible orbital parameters (high cost) to soak up a residual.
  *   **Principle Ruling:** Neptune passes **Risk** (specific prediction). Vulcan fails **Risk** (broad family of orbits).
  *   **Why it works:** It formalizes your intuition that a theory is worse if it can accommodate *any* outcome.

  **3. Maxwell vs. Sprawl (Resolved by Clause 1)**
  *   **Verdict:** Unification is a virtue; Sprawl is a vice.
  *   **Analysis:** Maxwell's theory is virtuous because the speed of light was a *consequence*, not a parameter tuned to fit light. The "one cause for many illnesses" theory is vicious because the "cause" is typically redefined for each illness (high parameter cost).
  *   **Principle Ruling:** True unification reduces the total parameter count of our worldview. Sprawl maintains or increases it while claiming unity.

  ---

  ### Verdicts on New Cases

  **1. Dark Matter (DM) vs. Modified Gravity (MOND)**
  *   **The Conflict:** DM posits unseen mass (Neptune-style). MOND modifies the law of gravity (Einstein-style).
  *   **Application of Principle:**
      *   **DM:** Passes **Compression** if a single particle type explains Rotation Curves, Lensing, and the CMB. It fails **Risk** if the "halo profile" of the dark matter is tweaked independently for every galaxy to make the fit work. If the parameters are fixed by the CMB and *then* applied to galaxies without re-tuning, DM is the superior explanation. If they are tuned per galaxy, it is "Sprawl."
      *   **MOND:** Passes **Risk** spectacularly on rotation curves (tight fit with low parameters). It fails **Compression** on cosmological scales (CMB/Clusters) unless it is augmented by... dark matter (neutrinos).
  *   **Verdict:** The Principle favors **Dark Matter** *conceptually* (as a Neptune-style posit) but demands skepticism *practically* if the community is engaging in post-hoc halo tuning. It favors MOND on galactic scales but rejects it as a total theory until it handles the CMB without ad-hoc additions.
  *   **Your Intuition:** Your wavering is correct. DM is currently winning on **Compression** (Standard Model of Cosmology) but losing points on **Risk** (the "cusp-core" problem suggests tuning).

  **2. The Multiverse**
  *   **Application:** The Multiverse posits infinite entities to explain finite constants.
  *   **Verdict:** **Reject.**
  *   **Reasoning:** It fails **Risk** completely. If all constants exist somewhere, no observation is surprising. It fails **Compression** catastrophically (infinite ontology for finite data). It is the ultimate "theory with a knob for every anomaly."

  ---

  ### Hard Truths: Verdicts You Must Sacrifice

  To adopt this principle consistently, you must concede two points that may discomfort you:

  **1. The Semmelweis "Acceptance" was Pragmatic, not Epistemic.**
  You sided with Semmelweis against his critics. Under **Risky Compression**, Semmelweis provided a *protocol*, not an *explanation*. His handwashing rule had high predictive power, but zero theoretical compression (it didn't tell us *why*).
  *   **The Sacrifice:** You must admit that the critics were scientifically right to withhold *theoretical acceptance*, even if they were morally wrong to withhold *clinical implementation*. Semmelweis had a "phenomenological law," not a "theoretical explanation." Your intuition conflated "useful intervention" with "best explanation."

  **2. "Independent Purchase" is Often Reconstructed.**
  You worry about circularity: judging independent purchase after the fact.
  *   **The Sacrifice:** You must accept that **Risk** is often a narrative reconstruction. We often treat old evidence as "novel" if the theory *could* have predicted it had we asked. For example, General Relativity explained Mercury's perihelion (old data) but we count it as a victory.
  *   **The Fix:** The principle requires **Logical Independence**, not just Temporal Independence. A posit has independent purchase if the parameters were fixed by *Domain A* and successfully predict *Domain B*, regardless of which was discovered first. If you cannot reconstruct that logical separation, the purchase is illusory.

  ---

  ### The Presuppositions: Is This Defensible?

  You asked if your practice is defensible or just a habit. It is defensible, but it rests on two metaphysical commitments:

  1.  **The World is Compressible:** You are assuming that nature is not a Rube Goldberg machine. You assume that diverse phenomena share common causes because the underlying reality is simpler than the surface complexity. If the universe were fundamentally chaotic or infinitely complex, **Compression** would be a vice (it would lead you to ignore real complexity).
  2.  **Stability of Structure:** You assume that the "constraints" you value (laws, mechanisms) are stable across contexts. **Risky Compression** only works if the rules that govern Uranus also govern the laboratory.

  **Conclusion:**
  Your "Independent Purchase" clause is the engine of your judgment. It is effectively a demand for **Severe Testing** (in the sense of Deborah Mayo). You are rejecting explanations that have not been probed by errors they could not easily survive.

  The principle of **Risky Compression** validates your career instincts: you trusted kinetics because the rate laws constrained the mechanism (Risk), and you distrusted "fit-all" models (Sprawl). You can defend this not as a habit, but as the only reliable heuristic for navigating a world where overfitting is always easier than finding the truth.
