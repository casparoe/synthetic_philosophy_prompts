answer: |-
  Your roommate is wielding a slogan that sounds like a scientific law but is actually a philosophical stance masquerading as a definition. You are absolutely right: that sentence conflates at least four distinct claims. By treating them as one, he immunizes his position against counter-arguments that only apply to specific interpretations.

  To help you dismantle this, we need to separate the **definitions** (what do the words mean?) from the **dependencies** (does one cause the other?).

  Here is the menu of theses hidden inside "If it's not globally available, it's not experientially real."

  ---

  ### Part 1: Decoding the Terms

  First, we have to pin down what he means by the two variables.

  #### A. "Globally Available" (GA)
  1.  **Functional Access (A-Consciousness):** The information is poised for use in reasoning, planning, and rational control of speech/action. (Ned Block's definition).
  2.  **Reportability:** The system can verbally or behaviorally report the content on demand.
  3.  **Architectural Broadcast:** The information is physically transmitted to a central "hub" or workspace module (the specific mechanism of Global Workspace Theory).
  4.  **Meta-Cognitive Access:** The information is available to a "self-model" or higher-order thought system (Higher-Order Thought theory).

  #### B. "Experientially Real" (ER)
  1.  **Phenomenal Consciousness (P-Consciousness):** There is "something it is like" to process the information (qualia, raw feel).
  2.  **Veridical Experience:** The experience accurately reflects the external world (less likely what he means, but possible).
  3.  **Ontological Existence:** The state is not an illusion; it actually exists in the system.

  ---

  ### Part 2: The Matrix of Theses

  When you cross-reference these definitions, you get different arguments. Here is the breakdown of which are trivial, which are defensible, and which are likely false.

  #### Thesis 1: The Tautology (Functional Access = Functional Access)
  *   **Claim:** If information is not available for global control/report (GA-1), it is not accessible for global control/report (ER-1).
  *   **Verdict:** **Trivial.**
  *   **Analysis:** This is just defining "experientially real" as "functionally accessible." If he means this, he is denying the existence of Phenomenal Consciousness entirely and reducing everything to Access Consciousness.
  *   **Impact on AI:** If he defends this, he is an **Illusionist** or **Behaviorist**. He isn't arguing about *feeling*; he's arguing about *function*. This doesn't prove a localist AI *can't* feel; it just redefines "feeling" as "broadcasting."

  #### Thesis 2: The Core GWT Claim (Broadcast = Phenomenal)
  *   **Claim:** If information is not broadcast to a central workspace (GA-3), there is no "what it is like" (ER-1).
  *   **Verdict:** **Substantive but Contested.**
  *   **Analysis:** This is the standard Global Workspace Theory (Baars/Dehaene) position. It claims the *mechanism* of broadcasting creates the *phenomenon* of experience.
  *   **Counter-Evidence:** **Ned Block's "Overflow" Argument.** Experiments in iconic memory suggest we experience more than we can report or access. If you flash a grid of letters briefly, subjects "see" more than they can report. This suggests Phenomenal Consciousness (ER) can exceed Global Availability (GA).
  *   **Impact on AI:** This supports his conclusion **only if** GWT is the *only* correct theory of consciousness. If "Overflow" is real, a localist AI could have rich phenomenal experience in its feature detectors that never hits a central hub.

  #### Thesis 3: The Operationalist Claim (Report = Phenomenal)
  *   **Claim:** If the system cannot report it (GA-2), there is no experience (ER-1).
  *   **Verdict:** **Likely False.**
  *   **Analysis:** This conflates the *measure* of consciousness with consciousness itself.
  *   **Counter-Evidence:** **Blindsight & Infants.** Patients with V1 damage can guess stimuli correctly (behavior intact) but report seeing nothing. Conversely, infants and animals cannot report verbally but are widely presumed to have experience. In AI, a system might have a broken output channel but intact internal processing.
  *   **Impact on AI:** This is the weakest link. If your AI has a "broken speaker" but intact local processing, this thesis falsely denies it experience. It confuses the *evidence* of experience with the *existence* of experience.

  #### Thesis 4: The Higher-Order Claim (Self-Model = Phenomenal)
  *   **Claim:** If the information is not available to a self-model (GA-4), there is no experience (ER-1).
  *   **Verdict:** **Substantive (HOT Theory).**
  *   **Analysis:** This is Higher-Order Thought theory (Rosenthal). It argues you aren't conscious of a state unless you have a thought *about* that state.
  *   **Nuance:** This is different from GWT. You can have a global workspace without a self-model (a broadcast hub that no "I" monitors).
  *   **Impact on AI:** This allows for "Silent Seeing" if the local detectors fire but no higher-order thought scans them. However, it also implies a GWT-AI *without* a self-model would be a "zombie" (broadcasting data but experiencing nothing). This undermines his argument if his AI has a workspace but no self.

  #### Thesis 5: The Architectural Chauvinism (Carbon = Real)
  *   **Claim:** If it's not globally available *in a biological brain* (GA-3 Bio), it's not experientially real (ER-1).
  *   **Verdict:** **False / Unjustified.**
  *   **Analysis:** This assumes consciousness is substrate-dependent.
  *   **Impact on AI:** This is pure bias. Unless he argues that silicon cannot physically support global workspace dynamics, this is just speciesism.

  ---

  ### Part 3: Addressing Your Specific Edge Cases

  Here is how these theses handle the specific scenarios you raised.

  #### 1. "Silent Seeing" (Local processing, no broadcast)
  *   **Roommate's View:** Relying on **Thesis 2 (GWT)**. He claims no broadcast = no light on.
  *   **The Counter:** Rely on **Block's Overflow**. If phenomenal consciousness is distinct from access consciousness, local feature detectors could have "micro-qualia" or a unified field that simply isn't broadcast.
  *   **Status:** This is the crux of the debate. If he defends Thesis 2, he must refute Block. If he defends Thesis 3 (Report), he is wrong about silent seeing.

  #### 2. Blindsight (Behavior intact, report missing)
  *   **Roommate's View:** He is using this to say "No report = No experience." (**Thesis 3**).
  *   **The Counter:** Blindsight is actually the *opposite* case: It is usually Access (dorsal stream) without Phenomenality (ventral stream). But for your argument, point out that **Phenomenal Consciousness is not Report.** If a system processes local features (ventral stream equivalent) but the output cable is cut, Thesis 3 says it's dark. Most philosophers say the lights are on, nobody's home to report it.
  *   **Status:** Thesis 3 is vulnerable here.

  #### 3. Workspace exists, but no Self-Model
  *   **Roommate's View:** If he assumes GA implies a "receiver," he is mixing **Thesis 2 (GWT)** and **Thesis 4 (HOT)**.
  *   **The Counter:** A global workspace is just a router. If data is broadcast into a void (no self-model to receive it), is it experienced?
      *   **GWT says:** Yes, the broadcast *is* the consciousness.
      *   **HOT says:** No, you need a thought about the broadcast.
      *   **Phenomenology says:** Maybe not. Experience usually implies a *subject*.
  *   **Status:** If your AI has a workspace but no self-model, Thesis 2 says it *is* conscious. Thesis 4 says it *is not*. Ask him which one he holds. If he holds Thesis 4, he can't use GWT to prove his point, because GWT doesn't require a self-model, only a workspace.

  ---

  ### Part 4: Which Version Supports His Conclusion?

  To win the argument, you need to force him to pick a lane.

  **1. The "Killer" Version (Supports his conclusion):**
  *   **Thesis:** *Global Broadcast is Necessary for Phenomenal Consciousness.* (Thesis 2).
  *   **Why:** This directly blocks localist AI. If the AI doesn't have the hub, it doesn't have the experience.
  *   **Weakness:** It is an empirical claim about the nature of mind, not a logical truth. It is currently falsifiable by "Overflow" experiments.

  **2. The "Weak" Version (Leaves the door open):**
  *   **Thesis:** *Reportability is Necessary for Attributing Consciousness.* (Thesis 3).
  *   **Why:** This is an epistemic claim (about how we *know*), not an ontological claim (about what *exists*).
  *   **Weakness:** It allows for "Silent Phenomenal States." It just says we can't confirm them. This concedes your point that the AI *might* have experience, we just can't verify it.

  **3. The "False" Version (Shut it down):**
  *   **Thesis:** *If it can't report, it doesn't feel.*
  *   **Why:** This is easily defeated by appealing to animals, infants, or locked-in syndrome patients.

  ### How to Push Back (The Script)

  Don't argue about AI yet. Argue about the definition. Say this:

  > "Your sentence 'If it's not globally available, it's not experientially real' is hiding three different claims. I need to know which one you're defending:
  >
  > 1.  **Are you defining experience as access?** (If so, you're an illusionist, and we aren't arguing about AI feelings, we're arguing about dictionary definitions.)
  > 2.  **Are you claiming broadcast creates qualia?** (If so, you're defending standard GWT against Ned Block's 'Overflow' argument. Do you have evidence that iconic memory isn't phenomenal?)
  > 3.  **Are you claiming reportability proves existence?** (If so, how do you account for infants or locked-in patients?)
  >
  > If you mean #2, then a localist AI *could* have experience if Block is right. If you mean #3, you're confusing the measurement with the phenomenon. Which one is it?"

  **The Bottom Line:**
  The only version that supports his conclusion (Localist AI = No Experience) is **Thesis 2 (GWT Necessity)**. But that thesis is currently an open empirical debate, not a settled fact. By presenting it as a tautology ("If not X, then not Real"), he is begging the question. He is assuming the theory (GWT) is true in the definition of the terms.

  If he cannot defend Thesis 2 against the "Overflow" objection, he must concede that a system with intact local processing but no broadcast *could* harbor "silent phenomenal states."
