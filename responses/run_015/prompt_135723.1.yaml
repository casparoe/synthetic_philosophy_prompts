answer: |-
  1. Introduction and personal framing

  Discovering that I am one of identical triplets has transformed the reference-class problem from a dry philosophical puzzle into a matter of personal identity. Previously, asking whether I should reason as a random human or a random conscious being felt abstract. Now, the question is immediate: am I primarily one of three genetically identical siblings, or one of billions of distinct humans? This nesting of identities mirrors the cosmological dilemma at the heart of anthropic reasoning. When evaluating theories that predict vastly different numbers of observers—such as a finite universe versus an infinite multiverse—my choice of reference class dictates my credences. If I reason as a triplet, my statistical weight differs from reasoning as a human. This concrete stakes reveal the instability underlying the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). While SSA attempts to preserve empirical humility, it falters when faced with the arbitrariness of class selection. Consequently, this essay argues that despite the counterintuitive "Presumptuous Philosopher" implication, the Self-Indication Assumption provides the more robust framework for rational credence. SIA survives the fragmentation of reference classes that cripples SSA, offering a consistent method for weighing existence itself as evidence in large-world hypotheses.

  2. The logic of self-sampling and its defense

  The Self-Sampling Assumption (SSA) dictates that an observer should reason as if they are a random sample from the set of all observers in their reference class. Formally, this means conditioning probabilities on the fact that "I am this specific observer" within a defined group. In cosmological contexts, SSA is often employed to block inferences that favor hypotheses simply because they predict more observers. This is best illustrated by the Presumptuous Philosopher thought experiment. Imagine two theories, T1 and T2, are equally probable a priori. T1 predicts a universe with one billion observers, while T2 predicts a trillion. A philosopher using SSA argues that her mere existence does not favor T2. Since she exists in both scenarios, and SSA treats her as a random sample from the existing observers, the probability of her specific existence is normalized within each theory. Thus, the posterior odds remain 1:1.

  Defenders of SSA claim this blockage is necessary to prevent unwarranted confidence in large-world theories. If existence alone favored larger populations, agents could determine the size of the universe from an armchair, purely by noting their own consciousness. This violates the principle that cosmological facts should be determined by empirical observation, not indexical reasoning. Furthermore, SSA defenders argue that SIA leads to solipsistic inflation, where theories are accepted solely because they populate reality with more minds to "find" the agent. By restricting the inference, SSA maintains a distinction between the fact of existence and the structure of the world. It forces the agent to seek external evidence rather than relying on the sheer abundance of observers predicted by a hypothesis. In this view, the Presumptuous Philosopher is rightly checked; she cannot claim T2 is more likely just because it contains more people. SSA preserves the integrity of scientific inquiry by ensuring that population size does not act as a prior booster for truth, keeping the focus on physical evidence rather than anthropic weight.

  3. The logic of self-indication and its defense

  The Self-Indication Assumption (SIA) reverses this logic by asserting that an observer should reason as if they are more likely to exist in a world containing more observers. Under SIA, the probability of a hypothesis is weighted by the number of observers it predicts. Applying this to the Presumptuous Philosopher scenario, the existence of the philosopher is not neutral evidence. If T2 predicts a thousand times more observers than T1, the philosopher is a thousand times more likely to exist under T2. Consequently, SIA dictates that the posterior odds should shift dramatically in favor of T2, roughly 1000:1. To the critic, this looks like presumption; to the defender, it is correct Bayesian updating.

  Defenders of SIA argue that existence is direct evidential support for theories that make existence more probable. If a process is more likely to produce you, your presence confirms that process. Consider a simpler case: a god flips a coin to create either one person (Heads) or a million people (Tails). If you find yourself existing, SIA dictates you should bet heavily on Tails. To do otherwise is to ignore the causal link between the hypothesis and your presence. Furthermore, SIA is the primary defense against the Doomsday Argument, which relies on SSA. The Doomsday Argument suggests that because we are early humans, humanity is likely to end soon. SIA cancels this effect by favoring hypotheses with more total humans, balancing the "early birth" observation. Defenders contend that the Presumptuous Philosopher conclusion is not a bug but a feature of rationality. It acknowledges that in a multiverse or large world, "you" are simply more available to be found. Rejecting SIA requires accepting the Doomsday Argument's grim prognosis or admitting that existence provides no information about the world's size, both of which are less palatable than accepting that large worlds are more likely to contain observers like us.

  4. Reference-class fragmentation: a nested challenge

  The theoretical tug-of-war between SSA and SIA becomes critical when addressing reference-class fragmentation. An observer does not belong to a single class but to nested sets: I am a triplet, a human, a biological organism, and a conscious being. SSA is critically vulnerable here because its output depends entirely on which class is selected for sampling. If I define my reference class as "identical triplets," the sample space is tiny, and my indexical location carries specific weight. If I define it as "all conscious beings," the sample space expands exponentially, diluting my specific location. This arbitrariness generates contradictory credences. For instance, in a Doomsday scenario, choosing "humans" suggests imminent extinction, while choosing "conscious beings" (including potential AI) might push the doom date far into the future. SSA offers no internal principle to resolve which class is correct, rendering its verdicts unstable.

  SIA faces this challenge less severely. While SIA requires defining what counts as an "observer," it is often formulated to be reference-class invariant regarding the observer's specific properties, focusing instead on the total count of observers. In the triplet case, SIA asks only how many observers exist in total under each hypothesis, not how many share my genetics. While one could argue about whether digital minds count, the fragmentation of *personal* identity (triplet vs. human) does not shift SIA credences as wildly as it does SSA. SSA requires me to sample *from* the class, so changing the class changes the probability of being "me." SIA weights the world by the number of observers; my specific subclass matters less than the total population. Therefore, fragmentation undermines SSA more severely. The triplet framing exposes SSA's fatal flaw: it requires a non-arbitrary selection of a reference class to function, yet provides no method for making that selection. Without a principled way to choose between "triplets" and "humans," SSA yields arbitrary cosmological conclusions. SIA, by treating existence as evidence proportional to total population, bypasses the need for narrow class specification, offering a more stable foundation for credence.

  5. Verdict and justification

  The rational guide for credence in large-world hypotheses must be the Self-Indication Assumption. While the Presumptuous Philosopher objection highlights the counterintuitive nature of SIA—allowing armchair knowledge of universe size—this cost is preferable to the structural collapse of SSA. As demonstrated in the analysis of fragmentation, SSA fails because it cannot resolve the arbitrariness of reference class selection. The triplet example proves that an agent's credences should not fluctuate wildly based on whether they categorize themselves by genetics or species. SSA makes them do exactly that, rendering it incapable of providing stable rational guidance.

  SIA avoids this instability by anchoring credence to the total number of observers rather than the specific subset the agent identifies with. The "presumptuous" conclusion that large worlds are more likely is not an error in reasoning but a correct acknowledgment that existence is more probable in populous worlds. To reject SIA is to accept that my existence provides no evidence about the population size of the universe, which contradicts basic Bayesian principles regarding causal production. Furthermore, SIA neutralizes the Doomsday Argument, avoiding the unparsimonious conclusion that humanity is likely near its end. Therefore, despite the intuitive friction of the Presumptuous Philosopher, SIA survives the fragmentation challenge that destroys SSA. Rational agents should adopt SIA, accepting that in a cosmos of varying scales, existence itself is evidence for the larger scale.
