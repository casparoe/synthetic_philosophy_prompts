      *   **The Replacement Principle:** **The Principle of Complicity in Collective Harm** (or "Fair Share" / "Integrity"). An agent is obligated to refrain from participating in a collectively harmful practice if their participation is *necessary for the practice to exist as it does*, even if not sufficient to change the aggregate outcome immediately.
