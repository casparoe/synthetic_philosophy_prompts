answer: |-
  The fluorescent light above Denise's desk hummed with a dying insect's rhythm, flickering just enough to make the numbers on the spreadsheet swim. She blinked, waiting for the black spots to clear, and looked back at Column F. Intake. Then Column G. Dispersion.

  According to the municipal code, the sum of the minor irritations collected from the town's twelve thousand residents should equal the concentrated hours endured by the volunteers. Conservation of discomfort. It was the first thing they taught you in orientation, right after the safety briefing about hydration and the union break schedule. But for the last three quarters, the dispersion hours were coming in light. Not by much. Maybe three percent. But in a system built on exactitude, three percent was a canyon.

  Denise rubbed her temple. She was due for a review anyway. Her fourth turn had been six months ago, a Tuesday afternoon in November. She remembered the smell of the antiseptic wipes in the booth. She remembered the exact moment the aggregated migraine of the postal workers hit her behind the left eye. She remembered the texture of the chair armrest under her gripping fingers.

  She tried to remember what she had eaten for dinner the night before. She remembered a fork. She remembered a plate. The food itself was a blur of beige.

  "Denise?"

  Gary stood in the doorway of her cubicle. He held a manila folder against his chest, his tie slightly askew. He looked tired, the way everyone looked tired here, except during the shifts.

  "Gary," she said.

  "Planning for the solstice cycle," he said, stepping in to lean against the partition. The particle board groaned. "We're short on volunteers. The holiday itch factor spikes, you know. Kids in wool sweaters. Dry skin from the heating."

  "I saw the projections."

  "We need coverage," Gary said. He tapped the folder. "I know it's against rotation policy, but we're looking at double turns. Back-to-back. Four hours straight."

  "That's not in the handbook."

  "The handbook doesn't cover solstice." He looked at her, not with pleading, but with the weary expectation of a shift manager trying to fill a roster. "You've got the clearance. You know the profile. If one afternoon buys the town a week of smooth sailing, two afternoons buys them through New Year's. It's just math."

  Denise looked down at her desk. Beside the keyboard lay the audit form. *Status: Discrepancy Detected.* If she signed it, the ledger would be flagged. The program would pause for review. The machine would stop humming. The town would go back to collecting their own paper cuts, their own sleepless nights, their own low-grade itches that never quite went away.

  And she would go back to the gray fog.

  She thought about the discrepancy again. The logs said less pain was coming out than going in. Where did it go? Maybe the transfer efficiency wasn't one hundred percent. Maybe some discomfort just vanished, dissipated into the walls like heat. Or maybe the volunteers remembered it differently. Maybe the intensity compressed in hindsight, making the hours feel heavier than the logs recorded.

  She touched the scar on her thumb from her second turn. A concentrated sting of a thousand hangnails. It was the sharpest thing she owned.

  "It's technically a violation," Denise said. Her voice sounded flat in the cubicle's silence.

  "Technically," Gary agreed. He set the volunteer schedule on top of her keyboard. "But the town doesn't care about technical. They care about not waking up with a stiff neck. You care about that too."

  Did she? She cared about the clarity. When the concentrated pain hit, the world snapped into focus. There was no ambiguity in agony. There was only the present tense. The rest of her life was a series of placeholders, waiting for the next shift to give it weight.

  If she signed the audit, the program stopped. The discrepancy would be investigated. They might find a leak. They might find that the machine was losing the pain, letting it slip away into nothing, leaving the volunteers to suffer for a sum that didn't add up. Or they might find that the volunteers were lying, that the pain wasn't as bad as they said, that the trade was a scam.

  If she buried the audit, the machine kept running. The town stayed smooth. She got her double shift. She got her clarity.

  Gary waited. He didn't check his watch. He knew the weight of the pen in her hand.

  Denise looked at the audit form. The box for *Verified* was empty. The box for *Flagged* was empty. She looked at the volunteer schedule. The slot for *Tuesday, 14:00-18:00* was open.

  She thought about the three percent. Was it loss? Or was it the price of admission?

  The light flickered again, casting a shadow over the numbers. For a moment, the columns blurred together, intake and output indistinguishable. She realized she couldn't remember if she had locked her front door that morning. She could remember, with perfect HD precision, the sound of the ventilation system in the booth during her last turn.

  She pulled the audit form toward her. She took the cap off her pen. The plastic clicked loudly in the quiet office.

  She moved the form aside. It slid under the keyboard, out of sight.

  She pulled the volunteer schedule closer. She wrote her name in the box for the double shift. The ink flowed dark and permanent. She signed the waiver at the bottom, acknowledging the risk, acknowledging the terms.

  "Alright," Gary said. He didn't smile. He just took the folder. "Thanks, Denise. See you Tuesday."

  He walked away, his shoes squeaking on the linoleum. Denise sat alone under the humming light. She stared at her signature. It looked steady. She waited for the doubt to come, for the feeling that she had broken something important, but the office was quiet, and the numbers on the screen were still wrong, and for the first time all day, she knew exactly where she was.
