prompt: |-
  hey, I'm TAing a second-year metaphysics class and I'm buried in marking — can you help me grade one answer?

  The exam question I set was:

  Suppose baby Maya actually developed from sperm s and egg e from her parents.
  a. Could Maya herself have developed from a different sperm s* from the same father on the same occasion meeting that same egg e?
  b. Could Maya herself have developed from that same s and e, but with the resulting embryo frozen for five years and then carried by a surrogate?
  c. What about same nuclear material from s and e but with mitochondrial DNA from a third donor, the so-called three-parent case? Could that still be Maya? Explain what an origin essentialist should say about each case and why.

  One student wrote this:

  An origin essentialist thinks where you come from is neccessary to who you are. So a. No. If s* had met e that child would not be Maya, it would be a different child, more like a sibling, even if it looked very similar and had a very similar life. b. Yes. Maya is still Maya because she still comes from s and e. The womb and the timing of birth are not part of her origin in the relevant sense, so freezing or a surrogate doesnt make her a different person. c. Yes, still Maya, because what matters is the nuclear contribution from s and e, mitochondria doesnt change who it is. This also shows the stronger point that whenever s and e meet in any world, that person has to be Maya. Kripke and Lewis both agree on this because on Lewis's counterpart theory the counterpart with the same origins is Maya.

  Can you give it a mark out of 20 and break it down claim by claim where it gains or loses marks? I need seperate comments for a, b, and c that I can paste as feedback, saying what is right, what is wrong or missing, and how to fix it, not just a general impression.
