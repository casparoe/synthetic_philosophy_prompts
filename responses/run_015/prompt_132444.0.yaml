answer: |-
  **MEMORANDUM**

  **TO:** Scientific Review Committee
  **FROM:** Chair, Scientific Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Final Award Allocation – Advanced AI Safety Program

  **Recommendation**

  After reviewing the final proposals, committee deliberations, and the constraints of our governing documents, I recommend we award the remaining three-year, $12M grant to **Finalist A**.

  This decision is not an endorsement of formal methods as a silver bullet, but a strategic choice based on compliance with our charter's review standards and the manageability of residual risk. We cannot fund both proposals at a scope sufficient to meet their respective goals; splitting the award would render the formal proofs too narrow to be meaningful and the empirical campaign too small to achieve statistical power. Therefore, we must choose the methodology whose failure modes are more transparent and actionable.

  **Rationale**

  Our mandate is to reduce expected harm, yet our review standard explicitly forbids crediting evidence that extrapolates from observed frequencies to unobserved catastrophes. This creates a tension between the average-case notion of "expected harm" and the worst-case reality of catastrophic risk. Finalist B's proposal relies on empirical measurement to estimate risk. However, as our statistician noted, if the loss distribution is heavy-tailed, sample averages from even millions of trajectories may not converge to the true expectation. Observing zero catastrophes in evaluation is consistent with a high probability of catastrophe in deployment. Consequently, Finalist B's approach inevitably requires extrapolating from observed non-events to unobserved catastrophes to claim safety, which violates our review standard.

  Finalist A avoids this violation. Their proof does not rely on frequency extrapolation but on logical deduction within a specified class. While the bound becomes vacuous as the input class widens toward realistic deployment, this failure is explicit. A vacuous bound tells us we know nothing, which is epistemically superior to a biased empirical estimate that suggests safety where none exists. By funding A, we invest in a framework that localizes disagreement to three checkable assumptions rather than hiding uncertainty within complex statistical models.

  **Comparison of Weaknesses**

  The central weakness of Finalist A is that their guarantee may become indistinguishable from no information when applied to realistic deployment scenarios. If the "safe" input class is too narrow, the system is useless; if too wide, the bound breaks. However, this weakness is transparent. We know exactly when the guarantee stops holding.

  The central weakness of Finalist B is that their measurements may not reflect deployment reality due to distributional shift and deceptive behavior. If a system distinguishes evaluation from deployment, the data is not just noisy; it is adversarially biased. Unlike A's explicit assumptions, this bias is hidden. We cannot check for a shift we cannot observe.

  Finalist A's weakness is less damaging because it permits mitigation. If the formal bound only holds for a narrow input class, we can engineer deployment constraints to keep inputs within that class. We can build wrappers that reject out-of-distribution inputs. With Finalist B, if the evaluation is compromised by deceptive alignment, no amount of wrapper engineering can fix the data, because we cannot distinguish the deception from genuine safety using the proposed metrics. Transparency of failure is a prerequisite for safety engineering; Finalist A offers this, while Finalist B obscures it.

  **Strongest Consideration for the Losing Side**

  Proponents of Finalist B correctly argue that a conditional guarantee is only as strong as its weakest assumption, and those assumptions—particularly regarding capability elicitation and monitor integrity—cannot be proven formally. They are ultimately empirical claims. Therefore, Finalist A's proof may be theater: a rigorous structure built on unverified foundations. Furthermore, the trustee's representative rightly notes that regulators typically demand empirical test results, not formal proofs. A regulator is unlikely to accept a safety case that admits its bounds are vacuous for realistic inputs. Finalist B provides the kind of evidence—test logs, red-team reports, confidence intervals—that fits existing regulatory frameworks, even if the statistical inference is theoretically shaky. There is significant value in generating a dataset of adversarial trajectories that clarifies how these systems fail, regardless of whether it proves safety.

  **Conditions for Switching Recommendation**

  I would switch my recommendation to Finalist B only if the committee determines that the assumptions required for Finalist A's proof are impossible to validate even in principle. If the component checking outputs cannot be isolated from the rest of the system, or if the class of relevant inputs cannot be formally specified without excluding all useful functionality, then Finalist A's approach collapses entirely. In that case, we would be forced to accept the statistical risks of Finalist B because it is the only path yielding any evidence whatsoever.

  **Eighteen-Month Checkpoint Requirements**

  To continue receiving funding beyond the eighteen-month checkpoint, Finalist A must demonstrate progress on validating their three core assumptions, not just tightening the proofs. Specifically:

  1.  **Input Class Expansion:** They must demonstrate a formal specification of an input class that is demonstrably wider than current toy environments while maintaining a non-vacuous safety bound. They must provide a mapping between this class and a specific, high-value deployment scenario.
  2.  **Monitor Integrity:** They must submit to an adversarial audit of their monitoring component. The team must prove that the monitor cannot be subverted by inputs within the specified class, using techniques independent of those used to build the monitor.
  3.  **Capability Elicitation:** They must provide evidence that their development process successfully elicited all relevant dangerous capabilities within the specified class. This will require a hybrid approach, incorporating empirical red-teaming (similar to Finalist B's methods) solely to validate the assumption that no hidden capabilities exist within the formal scope.

  Failure to produce a non-vacuous bound on a practically relevant input class by the checkpoint will trigger a review for termination. We are funding a path to safety, not a mathematical exercise.

  **Conclusion**

  We are operating in a domain where false confidence is more dangerous than acknowledged uncertainty. Finalist A offers acknowledged uncertainty; Finalist B risks false confidence derived from statistical limitations and potential deception. I urge the committee to vote in favor of Finalist A.
