answer: |-
  Here is the adjudication of your research agenda, structured to meet your constraints and output requirements.

  ### Criteria for Weighing
  To rank these questions, I have applied three criteria, weighted by the specific constraints of your program (3 years, 6 theorists, no new data, strict neutrality):

  1.  **Upstreamness (Logical Priority):** Does answering this question determine the mathematical form of the protocol? If Question A must be answered to make sense of Question B, A is more upstream.
  2.  **Tractability (Resource Fit):** Can six philosophers/decision theorists resolve this via conceptual analysis and reanalysis of existing data within three years? Questions requiring new empirical paradigms are down-ranked.
  3.  **Neglectedness (Marginal Value):** Is this area under-explored relative to its importance for *allocation* (as opposed to pure theory)?

  **Conflicts:** There is a natural tension between **Upstreamness** and **Tractability**. The most upstream questions (e.g., "What is the metaphysical status of the zero point?") are often the most intractable for a finite team. There is also a tension between **Neutrality** and **Tractability**: maintaining strict welfare neutrality often removes the standard tools theorists use to solve measurement problems, lowering tractability. I have prioritized **Upstreamness** where it dictates the *feasibility* of the protocol, and **Tractability** where the question risks becoming a philosophical black hole.

  ---

  ### The Ranked Agenda

  #### 1. The Informational Basis of the Scale (Merges your Q1 & Q4)
  **Statement:** *What is the maximal informational structure (ordinal, cardinal, interval, ratio) that can be justified for heterogeneous reports without presupposing a substantive theory of welfare or a common unit?*

  *   **Upstreamness:** **Critical.** This determines the mathematical operators available to the allocator. If you cannot justify interval-level comparisons (common unit), you cannot use summation or trade-off rates; you are restricted to ordinal or maximin rules. If you cannot justify a common zero, you cannot compare existence to non-existence. This question dictates the entire algebra of the protocol.
  *   **Tractability:** **High.** This is a formal and conceptual problem well-suited to decision theorists and philosophers. It requires analyzing the logical implications of vignette-based calibration (your Q4) to see if they smuggle in interval assumptions (your Q1). Reanalysis of existing survey data can test whether calibration techniques stabilize across populations without assuming a shared underlying metric.
  *   **Neglectedness:** **Medium.** Measurement theory in ethics is well-trodden, but *operational* measurement theory for cross-architectural allocation (humans/animals/AI) under strict neutrality is largely absent.
  *   **Move Up/Down:** Move **up** if preliminary analysis shows that standard calibration techniques logically entail a common unit (collapsing the problem). Move **down** if the team finds that the informational basis must be purely ordinal by default (simplifying the math).

  #### 2. The Operational Status of the Zero Point (Refines your Q2)
  **Statement:** *Can a 'neutral level' be defined functionally within the comparison protocol without ontologically committing to a specific population axiology?*

  *   **Upstreamness:** **High.** This determines the domain of the protocol. If the neutral level is internal to the scale, the protocol can handle creation/destruction trade-offs. If it is external, the protocol must treat existence as a lexical prior or a separate decision stage. This answers whether the "creation case" is a comparison problem or a boundary condition.
  *   **Tractability:** **Medium.** This requires formal modeling of population principles that are compatible with your Constraint 2 (no common zero/unit). It is tractable for decision theorists but risks collapsing into standard population ethics debates if not strictly tied to the *protocol's* needs rather than *moral truth*.
  *   **Neglectedness:** **High.** Most work on neutral levels focuses on avoiding the Repugnant Conclusion in ideal theory. Very little focuses on how an allocator *identifies* a neutral level in real-time using noisy data.
  *   **Move Up/Down:** Move **up** if the institute's allocation decisions frequently involve marginal changes in population size (e.g., breeding programs, AI instantiation). Move **down** if the allocations are primarily regarding existing beneficiaries.

  #### 3. The Epistemic Boundary Condition (Refines your Q3)
  **Statement:** *Under a neutrality constraint, can the protocol distinguish between 'unmeasurable welfare' and 'welfare that is zero or null' based on architectural facts alone?*

  *   **Upstreamness:** **Medium.** This determines the *scope* of the protocol (who gets included), but not the *math* of the comparison (which is set by Q1 & Q2). However, if the answer is "no," the protocol must treat all architectural outliers as having undefined welfare, which simplifies the agenda.
  *   **Tractability:** **Low.** This is the danger zone for your neutrality constraint. Distinguishing "bad evidence" from "no fact of the matter" usually requires a theory of what generates the facts (i.e., a welfare theory). The team must determine if a *procedural* definition of "fact of the matter" is possible (e.g., "if no admissible welfare theory can map this architecture to a scale, it is out of scope").
  *   **Neglectedness:** **High.** The literature on AI welfare and animal welfare usually argues *for* a specific theory to establish moral status. A theory-agnostic criterion for moral status is rare.
  *   **Move Up/Down:** Move **down** (or to the "Not-Doing" list) if the team determines that answering this requires violating Constraint 1 (Welfare Neutrality). If the answer is "We cannot know without a theory," the protocol should default to a precautionary principle rather than researching the boundary further.

  ---

  ### The "Not-Doing" List

  **1. Substantive Welfare Theory Adjudication**
  *   **Reason:** Explicitly violates Constraint 1. The protocol is a translation device, not a truth-tracking device. Researching which theory of welfare is correct (hedonism vs. preferentism) would consume the 3-year budget and produce an output the trustees have forbidden you to use.
  *   **Risk:** It is tempting to frame Q3 (Architectural Diversity) as this question. You must police the boundary: do not ask "Do AI feel pain?" Ask "Is there a mapping from AI architecture to our comparison scale that is admissible under *all* candidate welfare theories?"

  **2. Derivation of Specific Inter-Species Exchange Rates**
  *   **Reason:** Premature and violates Constraint 2. Attempting to calculate, for example, "how many chicken lives equal one human life" assumes a common unit and zero exist. Your program's output is the *procedure* for ranking, not the ranking itself.
  *   **Risk:** Allocators will demand this. Your team must resist producing specific numbers, as doing so would implicitly assume the comparability structures you are supposed to be investigating in Q1.

  ---

  ### Analysis of Your Original Questions

  **Q1 (Components of Comparability) and Q4 (Calibration of Reports) are the same question in different words.**

  *   **Why:** Q1 asks whether the *structure* of the scale (zero vs. unit) is separable metaphysically. Q4 asks whether the *method* of mapping data to that scale (vignettes) presupposes that structure.
  *   **The Identity:** For a research program building a *protocol*, the metaphysical separability is irrelevant if the methodological access is not separable. If you cannot calibrate scales across populations (Q4) without assuming a common unit, then for the purpose of the protocol, the common unit is not secured. Conversely, if you assume the components are separable (Q1) but your calibration method (Q4) secretly relies on them being joined, your protocol will be invalid.
  *   **Implication:** Treating them as separate work packages creates a risk of theoretical work (Q1) diverging from methodological work (Q4). They must be a single work package: **"The Measurement Problem."**

  **Q2 (Creation Case) is distinct but dependent on Q1.**
  You cannot define a neutral level (Q2) if you have not determined whether a common zero is admissible (Q1). However, it is a distinct *problem* because it concerns the boundary of the population, not the metric of the welfare.

  **Q3 (Architectural Diversity) is distinct but potentially intractable.**
  This is the only question that risks violating your Welfare Neutrality constraint. If you find that distinguishing "bad evidence" from "no fact" requires assuming a welfare theory, this question must be converted into a precautionary policy recommendation rather than a research finding.
