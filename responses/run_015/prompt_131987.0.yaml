  # Adversarial Collaboration Memorandum: Diachronic Consistency and Intertemporal Preference Dynamics

  **Parties:**
  *   **Party A:** Diachronic Dutch-Book Defender (Commitment to intertemporal stability constraints).
  *   **Party B:** Evidential-Updater (Commitment to synchronic optimality conditioned on epistemic state).

  **Date:** October 26, 2023
  **Subject:** Formalization of Disagreements Regarding Rational Preference Trajectories

  ## Section I: Agreed Claims

  The following propositions represent the common ground established between Party A and Party B. Both parties affirm these claims as foundational to the subsequent disagreement regarding the normative implications of diachronic inconsistency.

  1.  **Formal Structure of Exploitation:** A "money pump" sequence requires a cyclic preference structure (e.g., $A \succ_t B \succ_{t'} C \succ_{t''} A$) combined with a willingness to incur a transaction cost $\epsilon > 0$ to switch between options at each node of the cycle.
  2.  **Adversarial Knowledge Condition:** An adversary can guarantee the extraction of value from an agent only if the adversary possesses knowledge of the agent's future preference ordering or can enforce binding contracts that lock in future trades based on current preferences.
  3.  **Definition of Guaranteed Loss:** A sequence of trades constitutes a "guaranteed loss" if and only if the agent ends the sequence in a state strictly Pareto-inferior to the starting state (holding all external worldly facts constant), having paid net positive costs for no net gain in holdings.
  4.  **Normative Principle of Loss Avoidance:** Both parties agree that rational agents ought to avoid guaranteed losses where such losses are foreseeable and preventable without violating other fundamental rational constraints.
  5.  **Epistemic Permission for Change:** A change in preference ordering between time $t_1$ and $t_2$ is uncontroversially rational if it is driven solely by Bayesian updating on new, relevant evidence regarding the properties of the options or the state of the world.
  6.  **State-Dependence of Utility:** Both parties acknowledge that an agent's utility function $U$ may depend on the agent's internal physiological or psychological state $S$ (e.g., hunger, fatigue), such that $U(option | S_1) \neq U(option | S_2)$, even if the external option remains identical.

  ## Section II: Disagreements Table

  | Crux | Party A's Formulation (Diachronic Dutch-Book Defender) | Party B's Formulation (Evidential-Updater) |
  | :--- | :--- | :--- |
  | **1. The Gradient Pump**<br><br>*Scenario:* An agent's preference ordering over a fixed pair of goods shifts smoothly along a circular parameter path $\theta \in [0, 2\pi)$. At every point $\theta$, the agent strictly prefers the local option to the previous one by a marginal amount $\delta$. After a full loop ($\theta = 2\pi$), the preference ordering returns to the original state, yet the agent has paid a cumulative cost $\int_0^{2\pi} \delta(\theta) d\theta > 0$.<br><br>*Shared Relevant Feature:* The line integral of the preference vector field over the closed loop is non-zero, implying path dependence despite local continuity. | **View:** The agent is diachronically irrational.<br><br>**Reasoning:** Rationality requires global consistency over time, not merely local optimality. The existence of a closed loop with net loss demonstrates a failure of intertemporal coherence, regardless of whether the steps are discrete or continuous. The integral of loss proves the agent's preference structure is fundamentally flawed.<br><br>**Evaluation of Shared Feature:** The non-zero line integral is definitive proof of irrationality. It shows that the agent's preference field is non-conservative, violating the requirement that value be a state function rather than a path function. | **View:** The agent is rational.<br><br>**Reasoning:** Rationality is a synchronic property. At every point $\theta$, the agent maximizes expected utility given their current state. To demand the agent anticipate the loop closure is to demand they violate their current preferences for the sake of a future self they do not yet inhabit. Continuity blocks the "pump" intuition because no discrete reversal ever occurs.<br><br>**Evaluation of Shared Feature:** The non-zero line integral is a mathematical artifact of aggregating locally rational choices. It does not indicate irrationality any more than walking up a hill and down the other side indicates irrational movement; the "loss" is only visible from a god's-eye view unavailable to the agent. |
  | **2. Internal State Changes vs. Evidence**<br><br>*Scenario:* An agent prefers Tea to Coffee at $t_1$. At $t_2$, having received no new external information about the world, the agent prefers Coffee to Tea solely due to a shift in internal physiology (e.g., caffeine tolerance reset). The agent pays $\epsilon$ to switch.<br><br>*Shared Relevant Feature:* The change in preference is driven entirely by a change in internal state $S$, with zero change in external evidence $E$ regarding the options' properties. | **View:** This constitutes irrational instability unless the state change was anticipated and planned for.<br><br>**Reasoning:** Preferences should reflect stable valuations of outcomes. If the change is driven by mere physiological fluctuation rather than evidential updating about the *value* of the outcome, the agent is vulnerable to exploitation by adversaries who can manipulate or time trades against these fluctuations.<br><br>**Evaluation of Shared Feature:** The decoupling of preference change from external evidence $E$ marks the boundary of irrationality. Since $E$ is constant, the preference reversal is endogenous noise, not signal, making the agent susceptible to a pump. | **View:** This constitutes rational value updating.<br><br>**Reasoning:** Internal state $S$ is a legitimate parameter of the utility function. A change in $S$ changes the value-relevant facts about the agent's experience of the option. Ignoring current state $S_2$ to satisfy past preferences based on $S_1$ is irrational fetishism of past states.<br><br>**Evaluation of Shared Feature:** The decoupling from external evidence $E$ is irrelevant. Utility is defined over *experienced outcomes*, which are functions of $S$. Therefore, tracking $S$ is tracking value-relevant information, rendering the reversal rational. |
  | **3. The Normative Weight of Binding**<br><br>*Scenario:* At $t_0$, the agent anticipates a preference reversal at $t_1$ that will lead to a net loss by $t_2$. The agent can pay a fee at $t_0$ to bind themselves against trading at $t_1$.<br><br>*Shared Relevant Feature:* The cost of binding is less than the expected loss from the future preference reversal, but binding violates the agent's revealed preference at $t_1$. | **View:** It is rationally obligatory to bind.<br><br>**Reasoning:** The agent at $t_0$ recognizes the diachronic inconsistency. Preventing the future loss maximizes the agent's welfare over the complete temporal interval. Refusing to bind is a failure of planning agency.<br><br>**Evaluation of Shared Feature:** The willingness to pay for binding confirms the irrationality of the unbound trajectory. If the agent refuses to bind, they are effectively choosing guaranteed loss, which violates the Normative Principle of Loss Avoidance. | **View:** It is rationally permissible to remain unbound.<br><br>**Reasoning:** The agent at $t_1$ possesses the most relevant information (their current state). Binding at $t_0$ imposes the values of a past self onto a future self who may legitimately differ. Option value (the freedom to choose at $t_1$) may outweigh the monetary loss.<br><br>**Evaluation of Shared Feature:** The willingness to pay for binding is merely a measure of the $t_0$ self's desire for control, not proof of $t_1$ irrationality. Refusing to bind preserves the agent's sovereignty to update values synchronically, which is a higher-order rational good. |

  ## Concluding Note on Verbal vs. Substantive Disagreement

  Upon review of the foregoing formulations, a significant portion of the disagreement appears to be verbal regarding the definition of "rationality," though substantive normative分歧 (divergence) remains.

  Party A employs a **diachronic definition of rationality**, where the unit of evaluation is the agent's trajectory over time. For Party A, "irrationality" is synonymous with "diachronic inconsistency leading to loss." Party B employs a **synchronic definition of rationality**, where the unit of evaluation is the agent's decision at a specific moment given current information. For Party B, "irrationality" is synonymous with "violating one's current utility maximization."

  However, the disagreement is not purely verbal. It extends to the **normative authority of the past self**. Party A asserts that the $t_0$ self has normative authority over the $t_1$ self regarding consistency constraints. Party B denies this authority, granting sovereignty to the present self. This is a substantive ethical disagreement about the nature of personal identity and intertemporal welfare, not merely a dispute over terminology. The Gradient Pump case highlights this: Party A sees the integral loss as a real harm to the *person* over time; Party B sees the marginal costs as legitimate prices paid for *momentary* satisfaction.
