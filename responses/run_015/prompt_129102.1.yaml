answer: |-
  # Final Examination: Rationality and Practical Reasoning
  **Time Allowed:** 90 Minutes
  **Word Count Expectation:** 800–1000 words

  ## Essay Question

  Consider the standard economic definition of the sunk cost fallacy: rational agents should ignore unrecoverable past expenditures and choose solely based on future expected utility. This model assumes the agent is a sequence of "time-slices," each maximizing value independently of history.

  Now, consider the following case: A multi-laboratory scientific collaboration has spent fifteen years investigating an anomalous physical effect. The results have been consistently null, and the researchers do not anticipate a breakthrough. However, they vote to continue funding. Their justification is not empirical hope, but the preservation of the specialized epistemic community, shared methodological norms, and inter-laboratory trust that the fifteen-year investment itself created. Abandoning the project would dissolve this community.

  Write an essay addressing the following five points:

  1.  **Articulate the Standard View:** Explain the forward-looking argument for ignoring sunk costs. Why does the standard model treat the agent as a time-slice maximizer, and why are past costs deemed irrelevant?
  2.  **Analyze the Case:** Analyze the scientific collaboration through the lens of *constitutive investment*. How might the past expenditure generate present reasons for action that are not reducible to anticipated future benefits?
  3.  **Address the Objection:** Critics argue this reasoning collapses into psychological commitment bias. Propose a principled criterion for distinguishing legitimate path-dependent rationality from fallacious attachment.
  4.  **Evaluate Diachronic Rationality:** Is there a coherent concept of diachronic rationality where an agent's history constrains present choice without being instrumentalized? Can this accommodate the case without undermining the core insight of the sunk-cost critique?
  5.  **Defend a Position:** Take a clear stance on whether honoring sunk costs is *always* irrational. Defend your position with explicit reference to the collaboration case.

  ***

  ## Model Answer

  The standard economic argument posits that rational choice is strictly forward-looking. Because sunk costs are unrecoverable, they cannot be altered by present action. Therefore, a rational agent—conceived as a time-slice maximizer of expected utility—should ignore them to avoid compounding losses. To consider past expenditure is to prioritize regret over outcome, violating the independence of irrelevant alternatives. In this view, the agent at time *t* has no normative binding to the agent at *t-1* beyond current preference satisfaction.

  However, the scientific collaboration case challenges this atomistic view. Here, the fifteen-year investment is not merely an instrumental expense aimed at a result; it is a constitutive investment that created the epistemic community itself. The trust, norms, and collaborative capacity are present goods that exist *only* because of the past expenditure. Abandoning the project does not merely stop future costs; it annihilates the community constituted by those costs. Thus, the past expenditure generates a present reason: the preservation of the agent's own identity and normative structure. The value is internal to the practice, not external in a breakthrough.

  Critics might argue this is mere commitment bias—emotional attachment masquerading as reason. To distinguish legitimate path-dependence from bias, we require a criterion of *Revisable Coherence*. Bias is rigid adherence that blocks adaptation to new values or evidence. Legitimate path-dependence honors past investment because it coheres with an enduring life plan or identity, provided that identity remains open to revision if it becomes toxic or obsolete. In the collaboration case, the researchers are not ignoring the null results; they are weighing the value of their community against the value of the data. If the community ceased to produce any epistemic value whatsoever, revision would be required. But if the community itself is the value, continuity is coherent.

  This implies a coherent concept of diachronic rationality. Agents are not mere sequences of slices but extended narratives. History constrains choice not instrumentally, but constitutively. My past commitments define who I am, limiting which future options are intelligible as "mine." This accommodates the case without undermining the sunk-cost critique's core insight: one should not throw good money after bad *instrumentally*. However, when the "money" is the substrate of the agent's identity, the choice is not instrumental but existential.

  Therefore, honoring sunk costs is not always irrational. It is irrational when the past cost is treated as a reason to expect a future return that is unlikely (the fallacy). It is rational when the past cost constitutes the value being protected. In the collaboration case, continuing is rational because quitting would dissolve the very entity making the choice. Rationality requires respecting the conditions of agency, even when those conditions are founded on unrecoverable past expenditure. The standard model fails here not because it is wrong about utility, but because it is too narrow about what constitutes an agent.

  ***

  ## Marking Scheme (Total: 20 Marks)

  **1. Articulate the Standard View (4 Marks)**
  *   **A-Level (4 marks):** Explicitly identifies the "time-slice" assumption and explains that past costs are irrelevant because they cannot influence future outcomes (marginal utility).
  *   **B-Level (3 marks):** Explains forward-looking utility but misses the specific "time-slice" or atomistic agency assumption.
  *   **Common Error:** Confusing sunk costs with opportunity costs or claiming standard theory ignores risk.

  **2. Analyze the Case (4 Marks)**
  *   **A-Level (4 marks):** Identifies the investment as *constitutive* of the community/identity, not just instrumental for results. Explains that abandoning destroys the present good (the community).
  *   **B-Level (3 marks):** Argues the community is valuable but treats it as a future benefit to be gained rather than a present good constituted by the past.
  *   **Common Error:** Treating the collaboration as merely emotional attachment or assuming they expect a breakthrough despite the prompt.

  **3. Address the Objection (4 Marks)**
  *   **A-Level (4 marks):** Proposes a structural, revisable criterion (e.g., coherence, revisability) to distinguish bias from integrity.
  *   **B-Level (3 marks):** Distinguishes bias from reason but relies on intuition (e.g., "it feels different") rather than a principled criterion.
  *   **Common Error:** Claiming there is no difference or that all sunk cost reasoning is bias.

  **4. Evaluate Diachronic Rationality (4 Marks)**
  *   **A-Level (4 marks):** Affirms diachronic rationality where history constrains choice constitutively without rejecting instrumental rationality entirely.
  *   **B-Level (3 marks):** Affirms diachronic rationality but suggests it completely overrides or replaces the standard forward-looking model.
  *   **Common Error:** Denying diachronic rationality exists or conflating it with stubbornness.

  **5. Defend a Position (4 Marks)**
  *   **A-Level (4 marks):** Takes a nuanced position (not *always* irrational) and explicitly applies it to the collaboration case (constitutive vs. instrumental).
  *   **B-Level (3 marks):** Takes a clear position but fails to link it back to the specific details of the collaboration case.
  *   **Common Error:** Giving a vacillating answer ("it depends") without defending a specific philosophical stance.

  **Grade Bands:**
  *   **A (16–20):** Demonstrates A-Level moves in at least 4 of 5 criteria. Shows precise conceptual control.
  *   **B (13–15):** Demonstrates A-Level moves in 2–3 criteria, with B-Level moves in the rest. Solid understanding but less precision.
  *   **C (10–12):** Mostly B-Level moves with some significant conceptual gaps.
  *   **D/F (0–9):** Fails to address key requirements or fundamental misunderstandings of the sunk cost fallacy.
