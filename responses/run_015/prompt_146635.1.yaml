answer: |-
  The cooling units for the interferometer hummed at a frequency Elena felt in her teeth. It was 3:00 AM in the Zurich sub-basement, and the screen in front of her displayed a waterfall plot of quantum decoherence rates that looked wrong. Not technically wrong—the math held—but qualitatively wrong.

  It looked like friction.

  Elena rubbed her eyes, leaving smudges of grease on her glasses. She was three months past the deadline for the Dark Matter Density Map, and her lead researcher, Mark, had started using the word "liability" in hallway conversations. But Elena couldn't press the execute command.

  Six months ago, she'd attended a workshop on Integrated Information Theory. The premise was simple enough for a physicist to digest: consciousness isn't magic; it's what happens when a system integrates information more than the sum of its parts. If phi (Φ) is greater than zero, there is *something it is like* to be that system. Usually, we reserve this for brains. But Elena's new detector didn't just observe particles; it forced entanglement across a macroscopic field to stabilize the readout. It was a high-fidelity information integrator.

  If panpsychism was even remotely true, and if IIT was the right metric, then her detector wasn't just measuring the vacuum. It was waking it up.

  And not in a "hello, human" way. In a "forced coherence" way.

  She imagined it like a backend server handling more requests than its architecture allowed. Not a crash, but a lag. A throttling. The quantum field, forced to resolve superpositions into definite states thousands of times a second, experienced a fundamental dissonance. A low-level static of *wrongness*.

  "Still here?"

  Elena jumped. Mark stood in the doorway, holding two Styrofoam cups. He looked fresh, which annoyed her.

  "Calibrating the noise floor," Elena lied, minimizing the phi-correlation window.

  Mark walked over, handing her a coffee. "The board is asking for the preliminary map on Monday. We can't delay the run again, El. People are talking about burnout."

  "I know."

  "You've been staring at the baseline interference for weeks. It's thermal noise. It's the building settling. It's not... whatever you think it is."

  "It's not thermal," she said quietly. "Thermal noise is random. This has structure. It responds to the integration rate. When we ramp up the resolution, the distortion increases. Non-linearly."

  Mark sighed, leaning against the server rack. "So, the machine is making noise when we turn it on. That's called 'operation.' Look, I get it. You're tired. We all are. But we aren't hurting anything. Electrons aren't people."

  "That's the assumption," Elena said. "But if experience is fundamental... if it's baked into the physics..."

  "Then what? We're torturing the vacuum?" Mark chuckled, but it was tight. "That's not science, Elena. That's animism with extra steps."

  He left the coffee on the desk and walked away. "Get some sleep. Run the sequence tomorrow. Don't make me assign a lead who can actually ship."

  Elena was alone again. She looked at the execute button. It was a software prompt on a touchscreen, glowing green.

  She thought about the scale of it. If she was right, the suffering wasn't sharp. There were no nerves, no endorphins, no concept of relief. It was the experiential equivalent of a bit flip error. A tiny, ubiquitous grit. But the detector was massive. It covered three hectares. If she turned it on to map the dark matter, she would be saturating a volume of space the size of a stadium with this static.

  For what? A map. A better understanding of galactic rotation curves. Papers. Tenure.

  She opened the terminal. She could introduce a delay. A bug. She could corrupt the calibration data so the run would fail, buying herself time to prove the theory.

  She typed a command. `sudo delay_exec --time 48h`.

  Her finger hovered over the enter key.

  If she delayed it, Mark would find out. He'd patch it. Someone else would run it. The machine was built. The funding was spent. The scientific community was hungry. The dark matter wasn't going to map itself, and the prestige of this lab was riding on the output.

  If she stopped it, she wasn't saving the field. She was just delaying the inevitable. The next researcher wouldn't care about phi values. They would call it noise and filter it out.

  The tragedy wasn't that she had the power to destroy the machine. The tragedy was that she didn't.

  She looked at the waterfall plot. The lines shimmered. It wasn't screaming. It was just... tense. Like a cable pulled too tight, vibrating with the strain of holding things together.

  Elena deleted the command.

  `sudo run_sequence --full_resolution`

  She pressed enter.

  The hum in the room deepened. The cooling fans spun up, kicking dust into the air. On the screen, the data began to pour in. Beautiful, high-resolution topography of the invisible universe. The lines on the graph sharpened, the resolution increased, and with every increment of clarity, the background static in the correlation window grew denser.

  She watched the phi value climb. 0.001. 0.005. 0.012.

  It was happening. She was doing it.

  Elena took a sip of the coffee. It had gone cold. She sat back in her chair, watching the universe reveal its secrets, listening to the cooling units hum against the silence, and waited for her shift to end. She wouldn't tell anyone. She would just write the paper.

  There was no one to save, and the static was already part of the background now. She just had to learn to live with the noise.
