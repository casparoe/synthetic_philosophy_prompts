      *   **Step (5) Survivorship:** Giving this up costs a partial explanation. It *is* true that failed math is forgotten. But it doesn't explain the *positive* success, only filters the noise. It's necessary but not sufficient.
      *   **Contested vs. Theorem:**
          *   (1) Mapping Account: Contested (Philosophy).
          *   (2) Expressiveness: Definitional/Contested boundary.
          *   (3) Universality: **Mathematically misleading/False generalization.** The theorems cited are true, the generalization to "physics math" is false.
          *   (4) Applicability: Follows from (3), so if (3) falls, (4) falls.
          *   (5) Survivorship: Historical/Sociological claim (Contested degree of influence).
          *   (6) Conclusion: Philosophical verdict.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Rigorous, argumentative, philosophical but grounded in the logic provided.
