      *   **Addressing Objection A (Baroque Formalism):** If (3) fails, expressiveness isn't enough. You need *specificity*. A numerological scheme might be expressive (can label anything) but lacks the *inferential power* (Step 1) to derive new laws easily. The "Mapping Account" requires the map to preserve *relevant* structure (dynamics, causality), not just set-theoretic containment.
