  ### Controversy Audit & Load-Bearing Claims

  You asked for an honest account of where this principle leans on contested ground.

  1.  **Clause 3 (Projectibility):** *Contested.*
      *   *Consensus:* "Grue" is bad.
      *   *Dispute:* *Why?* Quine argued it's about "natural kinds" rooted in biology. Goodman argued it's about "entrenchment" of predicates in language. CES assumes a Realist view: the world has a preferred structure (causal powers) that theories must latch onto. If you are a strict Humean, Clause 3 collapses.
  2.  **Clause 4 (Explanatory Integration):** *Highly Contested.*
      *   *Consensus:* Causal connection matters.
      *   *Dispute:* In Case (5) (Dualities), many philosophers of physics (e.g., De Haro, Butterfield) argue that if the observables map perfectly, the ontologies are **gauge equivalents**. They would say Case (5) is actually Case (1) (Not a rival). Your verdict (that it *is* a rival) commits you to **Ontological Realism** over **Structural Realism**. You are claiming the "furniture" matters even if the "shadow play" is identical. This is a live dispute in philosophy of physics.
  3.  **Simplicity (Case 8):** *Live Dispute.*
      *   *Consensus:* We prefer simpler theories.
      *   *Dispute:* Is simplicity *evidence* of truth (Kelly, Bayesian Realists) or a *pragmatic* tool for computation (Van Fraassen, Instrumentalists)? CES treats it as a prior (evidence-adjacent), but if simplicity is purely pragmatic, Case (8) is not underdetermination of truth, but of utility.
  4.  **Case (7) (Private Facts):** *Metaphysical Divide.*
      *   *Consensus:* Science cannot access it.
      *   *Dispute:* Does a fact exist? Verificationists say no. Realists say yes. CES takes the Verificationist stance *for the purpose of theory choice*, but allows Realism *for metaphysics*.

  ### Where Your Verdicts Might Have to Go

  If you accept CES, here is the pressure point:

  **You must reconcile Case (5) and Case (1).**
  In Case (1), you say "Not two theories" because of the dictionary.
  In Case (5), you say "Real underdetermination" despite the dictionary for observables.
  **The Tension:** If the dictionary in (5) is exact for *all observables*, why isn't it a notational variant like (1)?
  **The CES Answer:** Because in (1), the dictionary maps *ontology to ontology* (Temp $\leftrightarrow$ 1/Coldness). In (5), the dictionary maps *Observables to Observables*, but leaves Ontology unmapped.
  **The Hard Truth:** If you dig in and say "But in (5), the observables are all that exist," you become a Structural Realist and Case (5) dissolves into Case (1). If you insist Case (5) is real underdetermination, you are committing to the claim that **Ontology is distinct from Structure.** This is a defensible position, but it is not the consensus view among philosophers of physics working on dualities.

  **Recommendation:**
  If you want to keep your verdict on (5), you must explicitly reject **Ontic Structural Realism**. You must maintain that "what the world is made of" is a fact distinct from "how the world behaves." If you accept that, CES holds your web of beliefs together. If you feel the pull that (5) *should* be like (1), then your intuition on (5) is the one that needs to change, not the principle.

  ### Summary of the Principle for Your Use

  **The Causal-Explanatory Significance Principle:**
  > Underdetermination is a **problem** only when two theories posit **distinct causal mechanisms** (not just predicates), which are **permanently empirically equivalent**, but where those mechanisms are **causally responsible** for the evidence (not merely consistent with it) and **not isomorphic** in their fundamental structure.

  *   **Rules out:** Grue (not mechanisms), 10 TeV (not permanent), Temp/Coldness (isomorphic).
  *   **Rules "In" but "Moot":** Horizon Matter (not causally responsible for *our* evidence).
  *   **Rules "In" and "Problematic":** Dualities, Private Box (for metaphysics), Simpler Rival.

  This preserves your distinction between "Real rival that loses" (4) and "Not a rival" (3), and explains why (6) "doesn't matter" (fails causal responsibility) while (5) does (succeeds).
