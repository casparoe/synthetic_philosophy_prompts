  ### Resolution of Case (7): The Private Fact

  Your gut flips because you are toggling between **Metaphysical Realism** (the world exists independently of observation) and **Epistemic Operationalism** (science is about organizing shared experience).

  **CES Verdict:** In the context of *theory underdetermination*, Case (7) is **not a difference**.
  **Reasoning:** Science is a collaborative enterprise constrained by intersubjective evidence. If a putative fact cannot, even in principle, influence the probability distribution of any shared record, it is causally severed from the epistemic community. To treat it as a "fact" in a scientific context is to violate Clause 4 (Explanatory Integration).
  **Caveat:** If you are doing *metaphysics* rather than *science*, you may posit a fact here. But you cannot claim your *theory* is underdetermined by evidence, because the evidence relation is defined by causal contact.

