      *   **Key Distinctions to Emphasize:**
          *   Altruism (Comtean) vs. Benevolence (Randian).
          *   Beneficiary vs. Action.
          *   Sacrifice (Greater for Lesser) vs. Trade (Value for Value).
          *   Nietzsche (The "Mystic" disconnect).

  5.  **Drafting the Content (Iterative refinement):**
      *   *Correction on Nietzsche:* Make sure to mention *The Fountainhead* or *Atlas Shrugged* footnotes where she distances herself.
      *   *Correction on "Never Act":* Use the "Trader Principle." I help my friend because I value the friendship. That is selfish (in her sense). I don't help a stranger because they *need* it. That is altruistic.
      *   *The "Parasitism" point:* Clarify that for Rand, altruism makes *everyone* a victim. It's not just the recipient parasiting the giver; the moral system itself parasitizes human life.
