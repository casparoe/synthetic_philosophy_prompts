answer: |-
  This is an excellent prompt. You have correctly identified that the popular intellectual-history summary you read is a "caricature with a spine"—it gets the metaphysical stakes right but botches the normative mechanics. For a political theory chapter on the moralization of self-interest in commercial society, precision here is vital, because Rand's specific contribution is not merely "greed is good," but rather a redefinition of what constitutes a *moral transaction*.

  Here is an audit of the paragraph, followed by an evaluation of your reconstruction.

  ### Part I: Claim-by-Claim Audit

  **1. "Rand borrowed the word from Comte and defined altruism as the doctrine that the individual exists for the sake of others and that self-sacrifice is the highest virtue."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** A sympathetic scholar accepts this without reservation. Rand is explicit that she is using the Comtean definition, not the colloquial one (benevolence/kindness). In *The Virtue of Selfishness*, she writes, "Altruism holds that man has no right to exist for his own sake, that service to others is the only justification of his existence, and that self-sacrifice is his highest moral duty."

  **2. "Her central argument is that the doctrine self-destructs: if the moral purpose of every life is to serve other lives, then no one's life is an end in itself... everybody is simultaneously a sacrificial animal and a sacrificer..."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** This is Rand's "cannibal society" argument (found in *The Ethics of Emergencies*). She argues that if everyone is a means to everyone else's ends, there are no ends. Morality requires a beneficiary; if the beneficiary is always "others," the chain never terminates in a value. Sympathetic scholars accept this as her core *reductio ad absurdum*.

  **3. "From this she concluded that rational egoism is the only coherent ethics, which on the chapter's telling means you should never act for the sake of another person, only for your own rational self-interest..."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Scholarly Note:** This is the critical error you suspected. Rand does **not** argue you should never act for the sake of another person. She argues you should never act for the sake of another person *if the cost is a sacrifice of a higher value.*
  *   **The Distinction:** Rand distinguishes between the *beneficiary* of the action and the *motivation*. If I help my spouse because I love them and their happiness is a value to *me*, that is a selfish act (in her terminology) because the ultimate beneficiary of my action is my own life/values. If I help a stranger because they *need* it and I feel a duty to need, that is altruistic. The error in the text is conflating "acting to help others" with "sacrificing for others."

  **4. "...helping people is at best long-term self-investment, something you do because their goodwill or their company is worth something to you, never because they need it."**
  *   **Verdict:** **Wincing Simplification.**
  *   **Scholarly Note:** "Investment" implies a transactional quid-pro-quo that is too narrow. Rand speaks of *values*. If I value my friend, their need *becomes* my emergency. I help them not as an "investment" to cash in later, but because their existence is a constituent part of my own happiness. However, the second half ("never because they need it") is technically correct in her framework: Need *per se* creates no claim. The error is the cynical tone of "investment" vs. the genuine emotional valuation Rand describes in her fiction (e.g., Rearden helping Dagny).

  **5. "Charity is accordingly never a duty, just a luxury you can indulge when it pays."**
  *   **Verdict:** **Mostly Accurate (with caveats).**
  *   **Scholarly Note:** Rand rejects charity as a *moral duty*. She allows for voluntary aid in cases of "emergency" (where the value of human life is at stake and the cost to the giver is minimal), but she is hostile to systemic charity. The phrase "when it pays" is again too transactional; she would say "when it aligns with your hierarchy of values."

  **6. "Altruism and capitalism are incompatible, because capitalism runs on everyone pursuing their own interests and trading, so any altruistic act is a species of parasitism — the giver parasites off the recipient's need, the recipient parasites off the giver's guilt."**
  *   **Verdict:** **Mixed / Garbled.**
  *   **Scholarly Note:** Rand definitely argues Altruism and Capitalism are incompatible. However, the description of parasitism is confused. Rand typically argues the *recipient* (if demanding aid as a right) parasites off the *giver*. The "giver parasites off the recipient's need" is a psychological claim she makes about *altruists* seeking moral status through suffering, but it's not her primary economic critique. Her primary critique is that altruism justifies the initiation of force (taxation/redistribution), which destroys capitalism.
  *   **Correction:** The incompatibility lies in the *Trader Principle*. Capitalism requires trade (value for value). Altruism requires sacrifice (value for need). They are structurally opposed.

  **7. "Her target was really any ethics that asks you to be impartial, so the critique lands just as hard on Kant and the utilitarians as on Christianity..."**
  *   **Verdict:** **Accurate.**
  *   **Scholarly Note:** Sympathetic scholars agree. Rand views Kantian duty and Utilitarian "greater good" calculus as variants of altruism because both demand the agent subordinate their own judgment and happiness to an external standard (duty or the collective). Impartiality is, for Rand, a demand for self-abnegation.

  **8. "...and that in this she was basically finishing Nietzsche's attack on slave morality, a thinker she admired her whole life."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Scholarly Note:** This is a common outsider error. While Rand admired Nietzsche's *cultural impact* early on, she explicitly repudiated him philosophically. She called him a "mystic" who grounded morality in emotion/will rather than reason. In *The Romantic Manifesto* and various lectures, she states Nietzsche is the *opposite* of Objectivism. She saw herself as finishing the *Aristotelian* project, not the Nietzschean one. The "slave morality" critique is parallel, not genealogical.

  ---

  ### Part II: Evaluating Your Reconstruction

  You proposed: *Her real target is a thesis about who the beneficiary of an action has to be for the action to be moral — a claim about the structure of moral justification... rather than as a thesis about how selfishly anyone should behave.*

  **1. Does this reconstruction hold up?**
  **Yes.** This is the "Standard Model" of Objectivist ethics (endorsed by Peikoff, Binswanger, and serious academic commentators like Douglas Rasmussen and Douglas Den Uyl).
  Rand's meta-ethical move is to shift the locus of justification from the *action* (what am I doing?) to the *agent's life* (why am I doing it?).
  *   **The Beneficiary Criterion:** An action is moral if the ultimate beneficiary is the agent.
  *   **The Sacrifice Definition:** Sacrifice is not "giving up something." It is "giving up a *greater* value for a *lesser* value or non-value."
  *   **The Synthesis:** Therefore, helping a loved one is not a sacrifice (it preserves a high value), but helping a stranger *because they need it* is a sacrifice (it treats need as a claim superior to your judgment).

  **2. Does this make the critique trivial?**
  **No, it makes it structural.**
  If you view Rand as saying "never help people," the critique is easily dismissed as sociopathic. If you view her as saying "moral justification must terminate in the agent's life," the critique becomes a radical challenge to the **authority of the other.**
  It asserts that *need* cannot generate *obligation*. This is not trivial; it is a direct attack on the foundation of welfare liberalism, Kantian duty, and Utilitarian aggregation. It forces the question: "Does another person's suffering constitute a mortgage on my life?" Rand's answer is "No." That is a robust, non-trivial philosophical position.

  **3. Does it reach impartialist views (Utilitarianism/Kant)?**
  **Yes.**
  *   **Utilitarianism:** Requires the agent to be neutral between their own happiness and the sum of others. Rand argues this makes the agent a "number" rather than an end. If the justification for my action is "the greater good," I am not the beneficiary; the "collective" is. Thus, it fails the Beneficiary Criterion.
  *   **Kant:** Requires acting from duty, often *against* inclination. For Rand, if your duty contradicts your rational self-interest (your life), Kant is demanding a sacrifice. The "Categorical Imperative" is an external authority superseding the agent's judgment.
  *   **The "No Sacrifice" Utilitarian:** You asked if it hits utilitarianisms that don't demand self-sacrifice. Rand would argue that *any* system that grants moral weight to the needs of others *independent of the agent's values* is altruistic. Even a "moderate" utilitarianism that says "count everyone's happiness equally" is rejected because it denies the agent the *right* to weight their own happiness highest.

  ### Part III: Implications for Your Chapter

  For your chapter on **defenses of commercial society moralizing self-interest**, the distinction you drew is the hinge.

  1.  **The "Cartoon" Rand (The Paragraph's Version):** Suggests commercial society works because people are greedy and we should stop guilt-tripping them. This is a *psychological* defense. It's weak theory.
  2.  **The "Structural" Rand (Your Reconstruction):** Suggests commercial society works because it is the only system based on the **Trader Principle** (value for value, neither sacrificing nor being sacrificed). This is a *moral* defense.
      *   In this light, Rand isn't just saying "self-interest is okay." She is saying "self-interest is the *only* moral basis for social interaction."
      *   The "moralization" you are tracking is her transformation of the *bourgeois trader* from a necessary evil (as seen in some classical liberals) into the **moral ideal**.
      *   The error in the paragraph ("never act for others") obscures this. If you can never act for others, trade is impossible (since trade benefits the other party). Rand's point is that in trade, benefiting the other is *how* you benefit yourself. The interests are aligned, not opposed.

  **Conclusion on the Paragraph:**
  The paragraph survives as a rough sketch of her *political* conclusions (Capitalism Yes, Altruism No, Kant/Util No), but it fails as an account of her *ethical* mechanics. The Nietzsche claim is historically false. The "never act for others" claim is philosophically false.

  **Recommendation for your Chapter:**
  Use your reconstruction. It allows you to argue that Rand represents a specific moment in the history of commercial society defenses: the moment where self-interest is no longer apologized for (as in Smith's "invisible hand" mitigating greed) but is crowned as the **metaphysical requirement of morality**. The error in the popular book you read is that it treats her as a hedonist; she is actually a perfectionist. She moralizes self-interest by tying it to *reason* and *life*, not just pleasure.

  If you cite her, rely on *The Virtue of Selfishness* (specifically "The Objectivist Ethics" and "The Ethics of Emergencies") and Leonard Peikoff's *Objectivism: The Philosophy of Ayn Rand* (the Ethics section) for the "Beneficiary" distinction. Avoid secondary literature that leans heavily on the Nietzsche comparison unless it is critically dissecting that specific misconception.
