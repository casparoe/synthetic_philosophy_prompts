      *   **Task:** Audit a specific paragraph summarizing Ayn Rand's critique of altruism. Break it down claim-by-claim (sympathetic acceptance, wincing simplification, straightforward error). Evaluate the user's own reconstruction (beneficiary vs. behavior). Assess whether the errors matter for the chapter's conclusions.
      *   **Key Issues:** Rand's definition of altruism, the "never act for others" claim, the parasitism/capitalism claim, the Nietzsche connection, and the scope of the critique (Kant/Utilitarianism).
      *   **User's Hypothesis:** Rand's target is the *structure of moral justification* (beneficiary must be the agent), not necessarily *behavioral selfishness* (never helping others). Does this hold up? Does it trivialize the critique or strengthen it? Does it hit impartialist theories?

  2.  **Deconstruct the Paragraph (Claim-by-Claim Audit):**

      *   *Claim 1: Rand borrowed "altruism" from Comte and defined it as the individual existing for the sake of others/self-sacrifice as highest virtue.*
          *   **Verdict:** Accurate. Rand explicitly cites Comte. She defines altruism strictly as self-sacrifice, not just benevolence.
      *   *Claim 2: Her central argument is that the doctrine self-destructs (no one's life is an end in itself).*
          *   **Verdict:** Accurate. This is the "cannibal society" argument found in *The Virtue of Selfishness* ("The Ethics of Emergencies").
      *   *Claim 3: Rational egoism means you should **never** act for the sake of another person, only for your own rational self-interest.*
          *   **Verdict:** **Straightforwardly Wrong / Major Simplification.** This is the "cartoon" version. Rand distinguishes between the *purpose* (beneficiary) and the *action*. You can act to help others, but the *reason* must be that you value them. The "never" is the problem.
      *   *Claim 4: Helping people is at best long-term self-investment... never because they need it.*
          *   **Verdict:** **Wincing Simplification.** It's not just "investment" (transactional). It's about *values*. If I love someone, their need *becomes* my value. But I don't help *strangers* just because they need it. The distinction is between *values* vs. *duties to need*.
      *   *Claim 5: Charity is never a duty, just a luxury.*
          *   **Verdict:** Accurate (sympathetic reading). Rand rejects duty-based charity.
      *   *Claim 6: Altruism and capitalism are incompatible... any altruistic act is a species of parasitism.*
          *   **Verdict:** **Nuanced Error.** Rand thinks *institutionalized* altruism (welfare state) is parasitic. Occasional altruism is just self-destructive, not necessarily parasitic in the economic sense. The "giver parasites off recipient's need" is a bit garbled. Usually, she says the *recipient* parasites off the *giver*.
      *   *Claim 7: Target was any ethics that asks you to be impartial... lands on Kant and Utilitarians.*
          *   **Verdict:** **Accurate.** Rand hates impartiality. She attacks both deontology (duty) and utilitarianism (social calculus).
      *   *Claim 8: She was basically finishing Nietzsche's attack on slave morality, a thinker she admired her whole life.*
          *   **Verdict:** **Straightforwardly Wrong.** Rand explicitly disavowed Nietzsche. She called him a "mystic." While there are surface similarities (anti-altruism), the metaphysical foundations are opposite (Reason vs. Will/Instinct).

  3.  **Evaluate the User's Reconstruction:**
      *   *Hypothesis:* Target is *structure of justification* (beneficiary = agent), not *behavior* (never help).
      *   **Assessment:** This is the standard, charitably correct reading of Rand (Peikoff, Binswanger, etc.). It saves her from the "sociopath" charge.
      *   *Does it trivialize?* No, it makes the critique structural. It attacks the *authority* of the "other" to make claims on the "self."
      *   *Does it hit Impartialism?* Yes. Utilitarianism demands impartiality, which Rand sees as demanding sacrifice of the self for the "greater number." Kant demands duty regardless of desire, which Rand sees as sacrificing the self to a abstract rule.
      *   *Sacrifice vs. Selfishness:* Rand defines sacrifice as "surrendering a greater value for a lesser value or non-value." Selfishness is "concern with one's own interests."

  4.  **Synthesize for the PhD Student:**
      *   **Tone:** Academic, precise, respectful of their expertise but clarifying the Rand scholarship.
      *   **Structure:**
          1.  Executive Summary (The paragraph is a mix of accurate definition and caricatured application).
          2.  Claim-by-Claim Audit (The "Red Pen" section).
          3.  Evaluating the User's Reconstruction (The "Beneficiary" thesis).
