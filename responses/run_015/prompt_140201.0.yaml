answer: |-
  You are right to be dissatisfied with the standard labels, and you are right to suspect your colleague's explanation is structural rather than normative. The separation of *jus ad bellum* and *jus in bello* explains *where* the boxes are, but it doesn't explain *why* we pour the moral weight out of one box and into the other without spilling a drop.

  There is no single established term in the literature that captures the specific *argumentative move* you are describing, particularly the second wrinkle (the migrating cost). There are names for the *doctrines* that result from this move (e.g., the Moral Equality of Combatants, the Independence Thesis), and names for the *premises* (Invincible Ignorance, Non-Responsible Threats), but there is no standard name for the *mechanism* by which an agent's epistemic limitation becomes a constraint on their victim.

  Here is the carving you are looking for, the distinction between the two parts, and a proposed term for your seminar.

  ### 1. The Carving: Two Distinct Moves
  You are observing two different logical operations that are often run together. It is pedagogically useful to separate them.

  **Move A: Normative Inertness (The "So What?" Block)**
  This is the claim that objective wrongness does not transmit to subjective liability.
  *   **The Structure:** $X$ is objectively wrong (aggressive war). $S$ is participating in $X$. $S$ is epistemically blameless regarding $X$. Therefore, $S$ retains full permissions and suffers no liability.
  *   **The Function:** This creates a **firewall**. It prevents the objective status of the war from altering the deontic status of the soldier.
  *   **Why it feels slippery:** It treats the epistemic condition as a *trump* over the objective right. Usually, in ethics, if I threaten you without justification, I am liable to defensive harm. Here, the lack of *mens rea* (or reasonable access to it) negates the liability, even though the threat remains unjustified.

  **Move B: Epistemic Externalization (The Migrating Cost)**
  This is the claim you identified as the "second wrinkle." This is rarer and more contentious.
  *   **The Structure:** $S$ is epistemically blameless. Therefore, $V$ (the victim/defender) must absorb the risk of $S$'s uncertainty.
  *   **The Function:** This creates a **transfer**. The "cost" of the epistemic fog doesn't vanish; it is relocated from the person causing the danger to the person suffering it.
  *   **Why it feels distinct:** In standard self-defense theory, if $S$ is a "non-responsible threat" (e.g., sleepwalking), $V$ may usually kill $S$ if necessary, even if $S$ isn't *liable*. The cost is often shared or stays with $S$ (they die). In the war ethics version you are critiquing, $V$ is often told they must take *greater* precautions than they would against a liable aggressor. $S$'s ignorance becomes $V$'s operational burden.

  ### 2. Are They One Thing?
  They are two effects of the same underlying principle: **The Priority of Subjective Reasonableness over Objective Right.**

  However, they are not logically identical. You can accept Move A (the soldier isn't a criminal) without accepting Move B (the defender must take extra risks).
  *   **Consistent View:** The soldier is excused (Move A), but the defender faces a standard threat and may defend themselves normally (No Move B).
  *   **The View You Are Critiquing:** The soldier is excused (Move A), *and* the defender must accommodate that excuse (Move B).

  The phenomenon you want to name is the combination of these two: **The Insulation of the Aggressive Combatant.**

  ### 3. Nearby Established Concepts (and how they differ)
  You asked for the nearest established concepts and precisely how this differs.

  *   **The Moral Equality of Combatants (MEC):**
      *   *What it is:* The thesis that soldiers on both sides have equal rights and liabilities.
      *   *Difference:* MEC is the *conclusion*. You are describing the *argumentative engine* that drives that conclusion. MEC says "they are equal." You are asking "how does the wrongness become inert to make them equal?"
  *   **The Independence Thesis:**
      *   *What it is:* *Jus in bello* principles apply independently of *jus ad bellum* status.
      *   *Difference:* As your colleague noted, this is the legal/structural container. It doesn't explain the *moral justification* for the container. Your students are offering a moral excuse (epistemic limitation) to justify the structural independence.
  *   **Non-Responsible Threats (NRT):**
      *   *What it is:* An agent who poses a threat but is not morally responsible for it (e.g., coerced, insane, ignorant).
      *   *Difference:* Standard NRT theory (e.g., McMahan) usually concludes the threat is *not liable* to be killed, but the victim *may* still kill them based on a "lesser evil" justification. The view you are critiquing often goes further: it suggests the victim has a duty to *avoid* killing the NRT if possible, even at higher cost to themselves. This turns an excuse for the aggressor into a duty for the victim.
  *   **Invincible Ignorance:**
      *   *What it is:* The condition of being unable to know the truth.
      *   *Difference:* This is the *premise*. It explains why the soldier is blameless. It does not explain why that blamelessness imposes costs on the victim.

  ### 4. A Proposed Term for the Seminar
  Since there is no canonical term for this specific *move* (the transformation of an excuse into a burden on the victim), you should give it one. This allows students to attack the concept rather than reciting the "Moral Equality of Combatants" position.

  I suggest: **"The Epistemic Burden Shift."**

  **Definition:** The argumentative move wherein an agent's epistemic limitations (regarding the justice of their cause) are used not only to exempt the agent from blame but to impose additional precautionary burdens on the victims of that agent's actions.

  **Why this term works:**
  1.  **Epistemic:** Locates the source of the excuse (what the soldier could know).
  2.  **Burden:** Identifies that a cost is involved (risk, restraint, precaution).
  3.  **Shift:** Identifies the migration (from the excused party to the victim).

  ### 5. Boundary Cases for Argument
  To help your students test whether the "Epistemic Burden Shift" is valid, use these boundary cases. They isolate the move from the surrounding war context.

  **Case 1: The Mistaken Police Officer (Domestic Analogy)**
  *   *Scenario:* A police officer reasonably but mistakenly believes a civilian is reaching for a gun. The civilian is unarmed.
  *   *Test:* Does the officer's reasonable mistake excuse the shooting? (Move A: Often yes, in law). Does it require the *civilian* to have taken extra precautions to ensure they didn't *look* like they were reaching for a gun? (Move B).
  *   *Point:* In domestic ethics, we rarely accept Move B. We don't tell victims of mistaken violence they should have made themselves less threatening. Why does war differ?

  **Case 2: The Coerced Aggressor (Volitional vs. Epistemic)**
  *   *Scenario:* A soldier is fighting because his government will execute his family if he stops (Duress), not because he is ignorant (Ignorance).
  *   *Test:* We generally accept Move A (he is excused). Do we accept Move B? Must the defender take *more* risk to capture him alive rather than kill him, compared to a volunteer soldier?
  *   *Point:* If the answer is "yes," then the burden shift applies to all excuses. If "no," then the shift is specific to *epistemic* excuses, which suggests the defender is being punished for the aggressor's lack of knowledge.

  **Case 3: The Negligent Driver (Civil Tort Analogy)**
  *   *Scenario:* A driver runs a red light because their view was obscured by a truck (reasonable epistemic limit). They hit a pedestrian who had the right of way.
  *   *Test:* The driver is not criminally blameworthy (Move A). But does the pedestrian bear the cost? No, the driver (or insurance) pays.
  *   *Point:* In almost every other domain, if you create a risk—even reasonably—you internalize the cost of that risk. In war, the "Epistemic Burden Shift" externalizes the cost to the victim. This highlights the exceptionalism of the war ethics move.

  ### Summary for your Seminar
  You can tell your students: "We are not talking about the Moral Equality of Combatants. That is the destination. We are talking about the **Epistemic Burden Shift**. This is the vehicle. It is the specific claim that my inability to know I am wrong becomes your obligation to protect me from the consequences of my wrongness. Does that shift hold?"

  This bypasses the recitation of positions and forces them to defend the *mechanism* of the argument itself.
