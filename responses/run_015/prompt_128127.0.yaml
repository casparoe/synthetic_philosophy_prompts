answer: |-
  The prompt's description implies the fish were retained for remeasurement, whereas the actual record involves discarding them at sea; I will proceed using the prompt's factual description as instructed.

  ### 1. A Mapping, Not a Summary

  **Textualism (as deployed by the Dissent: Kagan, Scalia, Kennedy, Thomas)**
  *   **Object of Interpretation:** The ordinary meaning of the enacted text at the time of passage, treated as a fixed string of words independent of external policy aims.
  *   **Admissibility and Weight:**
      *   (i) **Dictionary/Isolation:** Admissible and dispositive. If the ordinary meaning is clear, inquiry stops.
      *   (ii) **Company/Canons:** Admissible but subordinate. Canons cannot override plain ordinary meaning.
      *   (iii) **Context/Title/Scandal:** Admissible only if the text is ambiguous. Low weight here because the text is deemed clear.
      *   (iv) **Legislative History:** Generally inadmissible or negligible weight; intent is found in the text, not expectations.
      *   (v) ** Penalty/Lenity:** Admissible only as a tie-breaker if ambiguity remains after textual analysis. Low weight here.
  *   **Real Work:** Input (i) is doing the real work. The dissent argues the dictionary definition of "tangible object" settles the case.
  *   **Difference in Admissible-Evidence Sets:** Both methods admit inputs (i) and (ii). They differ on (iii) and (v): Textualists treat context and penalty as irrelevant if the text is clear, whereas Purposivists treat them as constitutive of meaning.

  **Purposivism/Contextualism (as deployed by the Plurality: Ginsburg, Roberts, Breyer, Sotomayor)**
  *   **Object of Interpretation:** The enacted text read against its statutory context, structure, and the legislative aim it was designed to serve.
  *   **Admissibility and Weight:**
      *   (i) **Dictionary/Isolation:** Admissible but not dispositive. Ordinary meaning yields to context if context suggests a specialized usage.
      *   (ii) **Company/Canons:** Admissible and high weight. *Noscitur a sociis* and *ejusdem generis* are tools to derive meaning from structure.
      *   (iii) **Context/Title/Scandal:** Admissible and high weight. The Sarbanes–Oxley title and corporate fraud purpose limit the scope of general words.
      *   (iv) **Legislative History:** Admissible to confirm the purpose (though the prompt emphasizes enactment context).
      *   (v) **Penalty/Lenity:** Admissible and high weight. The severity of the penalty informs whether a broad reading is reasonable.
  *   **Real Work:** A combination of (ii) and (iii) is doing the real work. The canons provide the mechanism, but the SOX context provides the justification for narrowing.
  *   **Difference in Admissible-Evidence Sets:** The sets overlap on (i) and (ii), but diverge sharply on (iii) and (v). For the Plurality, context and consequences are evidence of meaning; for the Dissent, they are external to meaning.

  ### 2. Where Each Method is Silent or Indeterminate

  Neither method settles by its own lights whether a word is "ambiguous" or merely "broad." Textualism claims "tangible object" is clear; Purposivism claims the context renders it ambiguous or limited. This exposes a silence regarding the *threshold for ambiguity*: is it determined by dictionary definition alone (Textualism) or by the reasonableness of the result in context (Purposivism)?

  Neither method settles whether associated-word canons are guides to semantic meaning or tie-breakers used only after meaning runs out. *Yates* exposes this silence because the Plurality uses canons to *define* the text, while the Dissent treats them as secondary to the dictionary.

  Finally, neither method settles what to do when text is clear but the result is absurd (or disproportionately harsh). Textualism is silent on how to weigh "absurdity" against "clear text" without appearing to rewrite the law. Purposivism absorbs this easily but risks overriding democratic choice. *Yates* exposes the disagreement over whether a 20-year penalty for fish makes the text ambiguous or simply makes the law bad.

  ### 3. Four Controlled Rewrites

  **Variant A (Purpose Codified)**
  *   **Textualist Change:** No. A textualist argues the operative words control; findings subsections are often viewed as non-operative preamble.
  *   **Purposivist Change:** No (outcome remains same), but reasoning strengthens. The purpose is now enacted text.
  *   **Graceful Absorption:** Purposivism absorbs this more gracefully. It reveals that Purposivism seeks enacted authority for purpose, while Textualism remains skeptical of findings that do not change operative language.

  **Variant B (Enactment Detached)**
  *   **Textualist Change:** No. The words "tangible object" remain unchanged; context is irrelevant to plain meaning.
  *   **Purposivist Change:** Yes. Without the SOX context, the argument for narrowing collapses. The outcome likely flips to conviction.
  *   **Graceful Absorption:** Purposivism explains the change in outcome (context changed, so meaning changed). Textualism must say the change is legally irrelevant (text is constant), revealing that Textualism views statutory surroundings as noise rather than signal.

  **Variant C ("Other" Inserted)**
  *   **Textualist Change:** Yes. The word "other" syntactically triggers *ejusdem generis* more strongly, potentially forcing a textualist to narrow the reading.
  *   **Purposivist Change:** No. The result remains the same, now supported by syntax rather than just context.
  *   **Graceful Absorption:** Both converge, but this reveals Textualism has resources for context (syntax) that mimic Purposivism. However, it also suggests Textualism needs a canon to do the work Purposivism does via purpose, raising the question of whether the canon is just purposivism in disguise.

  **Variant D (Stakes Lowered)**
  *   **Textualist Change:** No. Penalty severity does not alter semantic meaning.
  *   **Purposivist Change:** Yes. The urgency to narrow diminishes. Alito's separate vote (often driven by lenity) might vanish; the Plurality might be less insistent.
  *   **Graceful Absorption:** Purposivism absorbs this gracefully (consequences inform meaning). Textualism must insist the penalty is irrelevant to interpretation, revealing that Textualism separates meaning from consequence entirely.

  ### 4. What the Case Does to the Theories

  *Yates* counts as evidence that textualism is not the constraint it advertises itself to be, only if one assumes constraints must produce narrow criminal liability. Here, textualism constrains the Court from *narrowing* a broad statute. It shows textualism constrains judicial discretion to fix bad drafting, even when the result is harsh.

  The case suggests the two methods are not rivals but a shared toolkit plus a second-order disagreement about hierarchy. Both sides use dictionaries and canons; they disagree on which tool trumps the other when they conflict.

  There is a defensible reading on which both sides are methodologically consistent. The Dissent is consistent with a "plain meaning" textualism that refuses to consult context unless ambiguity is thresholded. The Plurality is consistent with a "contextual" textualism (or purposivism) that views context as part of the text's meaning. The Plurality is not cheating if one accepts that *noscitur a sociis* is a textual tool, not an external policy override.

  Honestly, the case turned on a normative disagreement about which error is worse: criminalizing ordinary destruction of evidence under a 20-year provision (Plurality's fear) or leaving obstruction of a conservation investigation unpunished under a specific statute (Dissent's fear). Textualism has only the rule of lenity for settling this, which requires ambiguity. Purposivism has the legislative purpose, which allows direct normative weighing. Textualism lacks a tool for this trade-off unless it concedes ambiguity based on the penalty itself.

  ### 5. One Ranking

  1.  **(iii) Context/Title/Scandal:** This input drove the Plurality's decision to narrow the statute despite broad words.
  2.  **(i) Ordinary Meaning:** This input drove the Dissent's insistence on affirming the conviction.
  3.  **(v) Authorized Penalty:** This input secured the fifth vote (Alito) and reinforced the Plurality's avoidance of absurdity.
  4.  **(ii) Associated-Word Canons:** These provided the technical legal mechanism for the Plurality but relied on input (iii) for justification.
  5.  **(iv) Legislative History:** This input did the least work, as the opinions focused on enacted context rather than unenacted expectations.

  \answer{PURPOSIVISM_DOES_THE_WORK}
