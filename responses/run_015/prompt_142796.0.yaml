  ok so im drafting a novel with alot of dialogue that works on subtext, and ive been reading grice on implicature. heres a weird take i want you to argue for: in fictional dialogue, the cooperative principle doesnt govern the characters interaction at all—it governs the transaction between author and reader, with the characters functioning like semantic proxies. that means speaker meaning in fiction is structurally different from real-world speaker meaning: the speaker is the author, the hearer is the reader, and the characters are just the medium. so grice's distinction between saying and implicating actually splits into four layers in fiction (author-says, author-implies, character-says, character-implies), and the usual gricean framework cant handle this without adding a narrative maxim that governs how authors use characters to flout maxims on purpose. make the case that this four-layer model is necessary and that without it grice cant explain why we laugh at ironic dialogue in novels but feel betrayed by irony in real conversation. dont worry about bibliographies or anything, just build the argument from the concepts. also mention what happens if we just deny that authors have speaker meaning—does that save grice or just make fiction unintelligible?
