  2.  **Deconstruct the Positions:**
      *   *Hacking's Looping Effects:* Classifying people changes how people understand themselves, which changes how they act, which changes the classification's extension/truth conditions.
      *   *Camp A (Realist):* Looping happens, but it doesn't invalidate the category. The suffering is real. We can manage looping. The category refers to a stable homeostatic property cluster (HPC) or similar, even if the properties shift slightly.
      *   *Camp B (Constructivist):* Looping shows the category is not "natural." It creates the phenomenon it claims to discover. Objectivity is compromised because the target moves *because* of the measurement.
      *   *Common Ground:* Both agree looping exists. Both agree DSM/ICD are social documents. Both agree people suffer. Both agree clinical practice influences outcomes.

  3.  **Drafting Section 1: Agreed Claims:**
