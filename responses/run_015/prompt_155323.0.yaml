          *   *Prediction A:* Integration leads to better stability.
          *   *Prediction B:* Integration shifts the phenotype so much the old category loses utility.
      *   *Crux 2: Counter-looping viability.*
          *   A: Possible (clinical reflexivity).
          *   B: Self-defeating (second-order loop).
          *   *Case:* "Attenuated Psychosis Syndrome" or early intervention protocols.
          *   *Prediction A:* Careful framing reduces chronicity.
