answer: |-
  **Exam Question**

  **Question 1**
  Consider the following case:
  At **t1**, a university volunteering scheme asks undergraduates to pledge forty hours annually visiting isolated elderly residents. Only 2% sign up. Participants are called exemplary; non-participants face no criticism.
  At **t2**, five years later, 85% participate. It is simply "what students do." Non-participants report feeling guilt and face informal criticism; participants receive a citizenship award.
  Assume the total good produced is continuous (no diminishing returns) and the cost to any individual student is unchanged.

  Write an essay addressing the following:
  1.  Is the pledge supererogatory at t1 but obligatory at t2? If so, what mechanism explains this shift?
  2.  Must we posit a fourth deontic category (permissible yet criticisable) to account for the tension at t2, or can standard binary ethics accommodate this?
  3.  Evaluate the university's proposal to make the pledge compulsory at t2. Does requiring the act destroy the specific moral value it possessed when optional?

  Your answer must distinguish between social expectation and moral blameworthiness, and confront the objection that others' generosity cannot increase your obligations without your consent.

  ***

  **Model Answer**

  The transition from t1 to t2 presents a challenge to the static view of supererogation. At t1, the pledge is clearly supererogatory: it is morally good, costly, and omitting it attracts no blame. The difficulty lies in t2. Mere social prevalence cannot logically convert a supererogatory act into an obligation; otherwise, morality would be hostage to popularity. However, the shift in status is real, though not because social criticism equals moral blame. We must distinguish sociological pressure from normative force. The guilt felt at t2 suggests a genuine normative change, but this requires a mechanism stronger than mere custom.

  The correct mechanism is not changed expectations, but the emergence of a cooperative scheme governed by the principle of fair play. At t1, the scheme is fragile; participation is a gift. At t2, with 85% compliance, the scheme functions as a stable social practice from which all students benefit, including non-participants, through enhanced community cohesion and reputational capital. When a cooperative practice yields benefits and requires burdens, fairness dictates that those who accept the benefits must share the burdens. Thus, at t2, the act becomes obligatory not because everyone does it, but because free-riding on an established cooperative scheme is unjust. This avoids the error of conflating social blame with moral blameworthiness; the blame at t2 is justified only because the fairness obligation has been triggered, not merely because norms have shifted.

  Do we need a fourth category, such as "permissible yet criticisable"? No. Introducing a fourth category risks obscuring the binary nature of obligation. An act is either required or it is not. At t2, the act is required by fairness. The criticism faced by non-participants is appropriate because they are violating an obligation of fair play, not because they are failing to be saints. The "fourth category" is unnecessary if we recognize that the deontic status has genuinely shifted from supererogatory to obligatory due to the change in circumstances (the existence of a cooperative scheme), rather than positing a fuzzy middle ground. The tension is resolved by recognizing that obligations can arise dynamically from social practices without collapsing morality into relativism.

  However, this raises the objection that others' generosity cannot bind me. If I did not consent to the scheme, how can 85% participation obligate me? The response lies in the assurance condition. At t1, my participation might be futile without assurance others will join. At t2, the high participation rate provides assurance that the scheme works. By remaining within the community and accepting its benefits (including the social capital generated by the scheme), I implicitly accept the terms. My obligation arises not from their generosity per se, but from my acceptance of the benefits their generosity sustains.

  Finally, regarding compulsion: should the university make the pledge mandatory at t2? Here, we must distinguish the obligation to do the act from the value of the act. While fairness may make the act obligatory, making it formally compulsory risks destroying the specific moral value it possessed at t1. Supererogatory acts often derive value from the freedom of the agent; benevolence requires optionality. If the university compels participation, the act becomes mere compliance, losing its character as a gift. Therefore, while the act may be morally obligatory at t2 due to fair play, there is prudential and moral reason to leave it formally optional to preserve the virtue of benevolence. We should require it morally, but perhaps not legally, to maintain the distinction between justice and charity.

  In conclusion, supererogation is compliance-sensitive, but only indirectly. It is not social pressure that erodes supererogation, but the emergence of fair-play obligations within established cooperative schemes. We need no fourth category; we need only a dynamic understanding of how obligations arise from social practices. However, we must resist formal compulsion where the moral value of an act depends essentially on its optionality.

  ***

  **Marking Scheme (20 Marks)**

  **1. Normative vs. Sociological Distinction (4 marks)**
  *   **A (3-4):** Clearly separates social criticism/guilt from moral blameworthiness. Argues that prevalence alone does not create obligation.
  *   **B (1-2):** Describes the shift in norms but treats social blame as equivalent to moral obligation, or fails to distinguish the two.

  **2. Fair Play/Cooperative Scheme Analysis (4 marks)**
  *   **A (3-4):** Identifies the shift at t2 as grounded in fair play/cooperation (benefits/burdens) rather than mere expectation.
  *   **B (1-2):** Attributes the shift solely to changed expectations or utilitarian thresholds (which are excluded by the prompt).

  **3. Handling the "Diffusion" Objection (4 marks)**
  *   **A (3-4):** Confronts the claim that others' generosity cannot bind the agent. Uses "acceptance of benefits" or "assurance" to rebut.
  *   **B (1-2):** Ignores the consent objection or dismisses it without argument.

  **4. The Fourth Category Question (4 marks)**
  *   **A (3-4):** Takes a definite stance (usually rejecting the fourth category) and justifies it by explaining the shift in deontic status.
  *   **B (1-2):** Suggests a fourth category is needed without explaining why the binary fails, or vacillates without conclusion.

  **5. Compulsion and Value of Optionality (4 marks)**
  *   **A (3-4):** Distinguishes between moral obligation and formal compulsion. Argues that compulsion may destroy the specific value (benevolence) of the act.
  *   **B (1-2):** Treats compulsion as simply enforcing the obligation, missing the loss of moral value/virtue.

  ***

  **Predictable Mistakes**

  1.  **The Relativist Error:** Claiming the act becomes obligatory *because* 85% of people do it. (Cost: -3 marks)
  2.  **The Utilitarian Trap:** Arguing the shift is due to diminishing returns or total utility, ignoring the prompt's constraint that good is continuous. (Cost: -3 marks)
  3.  **The Category Mistake:** Equating informal criticism directly with moral blameworthiness without mediation. (Cost: -2 marks)
  4.  **The Consent Ignorance:** Failing to address how an obligation can arise without explicit consent at t2. (Cost: -2 marks)
  5.  **The Compulsion Conflation:** Arguing that if it is obligatory, it must be made compulsory by the university, missing the value of optionality. (Cost: -2 marks)
