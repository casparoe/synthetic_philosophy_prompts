answer: |-
  This is an exceptionally sharp observation. You have identified a structural equivocation that does significant, often illicit, work in contemporary discourse. You are correct that it is not quite the Naturalistic Fallacy, nor simply the agent-neutral/agent-relative distinction.

  Here is the expert diagnosis: There is **no single, canonical Latin name** for this specific move across all philosophical subfields. However, it is a recognized structural problem that goes by different names in epistemology, metaethics, and logic. The phenomenon is best understood as a conflation of the **existence of a normative fact** with the **possession of a normative reason**.

  Below is the breakdown of how this is mapped in the literature, followed by a synthesized characterization and my confidence assessment.

  ### 1. The Disciplinary Maps

  **In Epistemology: Propositional vs. Doxastic Justification**
  This is the area where your observation is most rigorously formalized. Epistemologists distinguish between:
  *   **Propositional Justification:** There is sufficient evidence/reason to support proposition $P$ (the "floating" reason).
  *   **Doxastic Justification:** A specific believer $S$ holds $P$ *on the basis of* that evidence.
  *   **The Gap:** The slide you notice is assuming that *Propositional Justification* entails *Doxastic Justification*. It ignores the "basing relation." Just because the evidence exists "out there" doesn't mean a specific juror or agent has accessed it, processed it, or is permitted to use it in their specific context.
  *   **Status:** Well-established distinction.

  **In Metaethics: The Relational View vs. Reification**
  Your intuition aligns closely with **T.M. Scanlon's** account of reasons. Scanlon argues that reasons are fundamentally **relations** (a reason is always a reason *for* someone *to do* something).
  *   **The Error:** When an arguer says "There is a reason to $\phi$" without specifying an agent, they are **reifying** normativity. They are treating a reason like a physical object (e.g., a rock) that exists independently of observers, rather than a relational property.
  *   **Internalism vs. Externalism:** This slide often smuggles in a robust **Externalist** commitment (reasons exist independently of the agent's motivational set) without arguing for it. An **Internalist** (like Bernard Williams) would reject the first premise entirely: if the agent has no subjective motivational hook to the reason, there *is* no reason, floating or otherwise.
  *   **Status:** Heavily debated, but the structural distinction is clear.

  **In Logic: The Quantifier Shift Fallacy**
  Formally, the argument structure you are describing is invalid.
  *   **Premise:** $\exists x (Reason(x))$ ("There exists a reason $x$.")
  *   **Conclusion:** $\forall y (HasReason(y, x))$ ("For all agents $y$, $y$ has reason $x$.")
  *   **Diagnosis:** This is a **Quantifier Shift Fallacy**. Just because a reason exists in the abstract does not logically entail that every (or any specific) agent possesses it. The "attachment" requires a further premise linking the agent to the reason (e.g., "All rational agents possess all existing reasons," which is a substantive and controversial claim).
  *   **Status:** Logically certain.

  ### 2. Synthesized Characterization & Naming

  Since there is no single standard label, I recommend characterizing this as **The Normative Detachment Fallacy** or **The Reification of Normative Force**.

  **What is happening?**
  The arguer is treating normativity as a **substance** rather than a **relation**. They assume that if a normative fact obtains (e.g., "Emissions should be reduced"), it exerts a "gravitational pull" on all agents equally. This ignores **Normative Jurisdiction** (does this reason apply to *this* agent?) and **Normative Capacity** (can this agent act on it?).

  **Why it feels like an equivocation:**
  The word "reason" is doing two different jobs.
  1.  **Ontological Job:** "There is a consideration that counts in favor of $\phi$." (Truth-apt claim about the world).
  2.  **Practical Job:** "Agent $A$ has a consideration that counts in favor of $\phi$." (Action-guiding claim about the agent).
  The arguer uses the truth of (1) to prove the force of (2) without establishing the bridge principle that connects the ontology of the reason to the psychology or situation of the agent.

  ### 3. Confidence Flags & The Shakiest Point

  **High Confidence:**
  *   **Logical Structure:** I am highly confident that formally, this is a Quantifier Shift Fallacy. The move from "There is a reason" to "You have a reason" is not logically valid without a bridging premise.
  *   **Epistemic Parallel:** I am highly confident that this maps precisely onto the Propositional/Doxastic justification distinction in epistemology.

  **Medium Confidence:**
  *   **Metaethical Consensus:** I am moderately confident that most metaethicians would agree this is a "slide," but robust Moral Realists might argue it isn't a fallacy *if* one accepts that moral reasons are universally binding by definition. They would argue the "bridging premise" is analytic. However, even they usually distinguish between "There is a reason" and "Agent $S$ is blameworthy for ignoring it."
  *   **Naming:** I am moderately confident that "Normative Detachment" is not a standardized term you will find in a textbook index, though it accurately describes the mechanism.

  **The Shakiest Point (Low Confidence):**
  *   **Whether this is a *Fallacy* or a *Substantive Claim*:** This is the most precarious part of the analysis.
      *   *Why it's shaky:* Some philosophical frameworks (e.g., Act Utilitarianism or robust Kantianism) *intend* for the slide to work. They argue that if there is a reason *simpliciter*, it *necessarily* applies to all rational agents. In those systems, the "floating reason" *just is* a reason for everyone.
      *   *The Nuance:* Therefore, calling it a "fallacy" might beg the question against those systems. It is only a fallacy **if** the arguer is using it rhetorically to bypass the debate about whether reasons are universally binding. If they are explicitly arguing from a framework where reasons are universally binding, it's a valid inference *within that system*.
      *   *Your Observation:* You noted the slide is "never argued for" and "unnoticed." This suggests the arguer is not committing to a universalist metaethics but is using the ambiguity to *gain* the benefit of universalism without the cost of defending it. In that rhetorical context, it is indeed a fallacy (specifically, **Begging the Question** on the nature of normativity).

  ### Summary Recommendation
  When you encounter this, do not ask "Is this agent-neutral?" Instead, ask: **"What is the principle of normative transmission that links that floating fact to this specific agent's obligations?"**

  Force them to articulate the bridge. Usually, they cannot, because the bridge requires assumptions about authority, capacity, or jurisdiction that their argument cannot support.

  **Proposed Label for your use:** **The Normative Attachment Gap**. It is precise, descriptive, and avoids claiming a canonical status that doesn't exist.
