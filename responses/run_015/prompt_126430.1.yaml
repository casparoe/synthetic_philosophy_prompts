answer: |-
  Your friend's intuition that copyright is relational while patent is objective captures the operational difference well, but it describes the symptom rather than the disease. The asymmetry presupposes that expression and invention differ fundamentally in their economic scarcity and the likelihood of simultaneous creation. Copyright law operates on the premise that expression is non-rivalrous and that independent creation is both common and socially desirable, so it rules out the Lockean view that labor alone creates property rights against the world. By requiring copying, copyright acknowledges that two people can legitimately occupy the same conceptual space without trespassing, whereas patent law treats the invention as a scarce resource where only the first to claim it gets the prize, effectively ruling out the notion that independent labor should secure a co-equal right to exclude. This is not merely evidentiary, though proving copying is notoriously difficult; if the goal were purely to protect labor, copyright could impose strict liability like patent law does, but doing so would chill creation by punishing coincidental similarity. The law chooses to tolerate identical works if they arise independently because the cost of restricting future authors outweighs the benefit of protecting the first.

  If we treated the independent creation defense as merely a proof device, we would expect the law to shift toward strict liability whenever evidence of access became easier to establish, but courts consistently reject this even when smoking-gun evidence of access exists without substantial similarity. The asymmetry is therefore substantive, reflecting a utilitarian bargain rather than a metaphysical truth about ideas. Patent law grants a monopoly in exchange for disclosure because functional inventions are costly to develop and easy to reverse engineer, requiring a strong exclusionary right to incentivize the initial investment. Copyright requires no such bargain because the marginal cost of creating expression is lower and the public domain benefits from allowing others to arrive at similar ideas through their own intellect. The rival view quietly ruled out here is that ideas themselves can be owned; instead, copyright owns only the specific fixation, and patent owns only the claimed implementation, leaving the underlying abstract idea free for others to discover independently.

  If a court took the relational view seriously and applied it to patents, infringement would require proof that the defendant actually copied the invention from the patentee, perhaps through industrial espionage or breach of confidence. This would dismantle the patent system's core function, as inventors would likely rely on trade secrets rather than disclosing their inventions to the public, slowing technological progress. Conversely, if courts extended the object view to copyright, imposing strict liability for identical works regardless of access, the doctrine would need to incorporate robust notice mechanisms, such as mandatory registration and clear labeling, to avoid trapping independent creators. Without those safeguards, an object-based copyright regime would grant a monopoly on styles or themes rather than expression, effectively allowing the first person to write a song about love to sue anyone else who did, which would collapse the creative ecosystem into paralysis. The current asymmetry is thus a functional compromise, tailoring the scope of ownership to the specific economic realities of art and technology rather than adhering to a single unified theory of intellectual property.
