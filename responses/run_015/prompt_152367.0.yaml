answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I'm [Your Name]. I work with my hands. I'm a carpenter. I spend my days measuring, cutting, and joining wood to make structures that stand up against the weather. My uncle, [Uncle's Name], worked with words and laws. He spent twenty-six years on the county council. But in the end, we found we shared a similar understanding of materials. He knew that wood has a grain, that stone has a fault line, and that people have a limit.

  Standing here, I have a difficult task. Usually, when we gather for someone like my uncle, the script is written in advance. We are supposed to talk about how long he served. We are supposed to call his twenty-six years a testament to his wisdom. We are supposed to say that he is watching over us now, that he has gone to a better place.

  But [Uncle's Name] left instructions. He was a man who believed that instructions should be followed, especially the hard ones. He asked me not to praise his longevity in office. He asked me not to offer you the comfort of an afterlife. He told me that if I eulogized him as a career public servant, I would be honoring the very thing he spent his final years trying to dismantle.

  So, I am not going to tell you that his long tenure was a virtue. I am going to tell you that his realization that it was a problem was his greatest act of service.

  I know this is a hard thing to hear for some of you. Half of this room knew him as the man who never missed a school board meeting. You knew him as the neighbor who helped resolve the zoning dispute on Elm Street. You remember him for his presence. And that presence was real. He showed up. When a constituent had a problem, he didn't pass them off to an aide. He listened. He cared. For the families and neighbors here: do not think that because he questioned his own tenure that his work didn't matter. It did. He helped people. He fixed leaks in the roof of this community, one shingle at a time.

  But a carpenter knows that a beam can only hold weight for so long before it begins to warp.

  For the first twenty years of his service, my uncle believed that staying in office was the best way to serve. He thought experience was the same thing as integrity. He thought that knowing the rules meant he could bend them for the good of the people. But he was an honest man. And over time, he began to notice that the rules were bending him.

  He saw that when you hold a seat for too long, your focus shifts. You stop worrying about whether the community is safe, and you start worrying about whether *you* are safe. You stop asking, "Is this right?" and you start asking, "Will this get me re-elected?" He didn't see this as a moral failing of specific people. He saw it as a structural flaw. Like a roof pitched at the wrong angle, it doesn't matter how good the shingles are; the water is still going to get in.

  In his final years, he became convinced that we need a different way to build our democracy. He argued that council members should be chosen by lot, like a jury. Serve one term. Do the work. Then go home.

  To the members of the reform circle here: You know how deeply he believed this. You know the letters he wrote to the paper. You know he didn't treat this as a hobby.

  To the family and neighbors: I know this sounds strange. It sounds like theory. But for him, it was practical. It was about keeping the wood fresh. He believed that regular people—carpenters, teachers, shopkeepers—are capable of governing, provided they aren't given enough time to become politicians. He believed that institutional memory is often just a fancy word for entrenched habit. He wanted a government that remembered the people, rather than a government that remembered itself.

  Some might call this a sudden change of heart. I am asking you not to see it that way. It wasn't a quirk. It was a confession. It takes a rare kind of courage to spend twenty-six years building a house, and then stand up at the end and say, "I used the wrong blueprint." He could have coasted. He could have accepted the plaques and the handshakes. Instead, he chose to criticize the system that had elevated him. He sacrificed his own legacy to protect the future of the office.

  Now, about the comfort we usually seek in moments like this. We want to believe he is somewhere else, looking down, free of pain. My uncle did not believe that. He regarded it as false comfort. He believed that when we die, we are gone. The work remains, but the worker does not.

  I know that hurts. I feel that absence. I wish I could tell you he is watching us right now. But I think he would prefer I tell you the truth. He is not watching us. He is *in* us. He is in the standards we hold ourselves to. He is in the willingness to admit when we are wrong.

  If we say he is in a better place, we let ourselves off the hook. It implies the work is done. But if he is gone, then the work is entirely ours. The comfort he offers is not that he is safe, but that we are capable. He believed in us enough to trust us with the job, without him, and without the career politicians he warned us about.

  So, how do we honor him?

  We do not honor him by trying to fill his seat. We honor him by questioning why the seat exists in the same way it always has.

  For the neighbors here: You honor him by continuing to show up. Not to elect a careerist, but to demand a system where you might be called to serve yourself. He wanted a world where a carpenter could serve on the council for a term, build what needs building, and then return to the workshop without losing his soul to the campaign trail.

  For the reformers here: You honor him by keeping the pressure on. Do not let his final argument become a footnote in his biography. Do not let people say, "He was a great councilman," without adding, "And he knew he shouldn't have been one for that long." Make sure his critique is louder than his resume.

  I am a builder. I know that when a structure settles, you can patch the cracks. But sometimes, you have to acknowledge that the foundation needs to change. My uncle spent twenty-six years patching cracks. He spent his final years trying to tell us we needed a new foundation.

  It is painful to lose him. I miss his voice. I miss the way he would look at a problem, tilt his head, and find the load-bearing wall in a conversation. But I do not mourn him as a saint. I mourn him as a man who told the truth, even when the truth made his own life look complicated.

  He asked for no prayers to a heaven he didn't believe in. So I will offer a wish for the earth we are standing on.

  May we have the courage to serve when called, and the wisdom to step down when our time is done. May we value our neighbors' judgment more than we value our own job titles. And may we build a community where no one person is indispensable, because everyone is capable.

  That was his hope. That was his final instruction. And if we can do that, if we can build that, then he hasn't left us empty-handed. He has left us the tools.

  Thank you.
