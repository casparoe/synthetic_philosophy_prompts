prompt: |-
  I am delivering the eulogy on Saturday for my uncle, who died at seventy-eight after serving twenty-six years on our county council. I am not an academic—I work as a carpenter—but for the past several years I have been thinking on my own about why elections seem to turn representatives into careerists, and my uncle eventually came to share that worry. In the final years of his life he argued, in letters to the local paper and in conversations with me, that selecting council members by lot for single, non-renewable terms would break the cycle in which office-holders come to represent their own survival rather than the people who put them there. He left explicit instructions that his memorial should not praise his long tenure as a form of wisdom or institutional memory, because he had come to see that very longevity as part of the corruption he was describing; he also asked that nothing be said about his watching over us from elsewhere, since he regarded that as false comfort. The audience will be split: about half are family and neighbors who remember him mainly for resolving a zoning dispute and for being present at every school board meeting; the other half includes members of the local democratic-reform circle he joined late in life, people who will recognize references to sortition and to the problem of career politicians. I need a eulogy of roughly ten minutes that can hold both groups without either turning into a lecture on lottocracy or reducing his conviction to a sentimental footnote. The idea should do real structural work: it must shape what I can and cannot say about his life—so I cannot glorify his decades in office, I cannot invoke an afterlife, and I should not present his late change of mind as a simple personal quirk—while still offering comfort to people who are grieving and who are not philosophers. Please write it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Carpenter (uncle's nephew/niece), not an academic.
      *   **Deceased:** Uncle, 78 years old, served 26 years on county council.
      *   **Key Theme:** The uncle became critical of career politics/long tenure. He advocated for sortition (selection by lot) for single, non-renewable terms.
      *   **Constraints/Instructions:**
          *   Do *not* praise long tenure as wisdom/institutional memory (uncle saw this as corruption).
          *   Do *not* invoke an afterlife/watching over us (uncle saw this as false comfort).
          *   Do *not* treat his late change of mind as a quirk (it was a core conviction).
          *   Do *not* turn it into a lecture on lottocracy (needs to be accessible to family/neighbors).
          *   Do *not* reduce his conviction to a sentimental footnote (needs structural weight).
          *   **Audience:** 50% family/neighbors (know him for zoning/school board presence), 50% reform circle (know him for sortition advocacy).
          *   **Tone:** Comforting but honest, structural, grounded (carpenter voice).
          *   **Length:** Roughly 10 minutes (approx. 1,300 - 1,500 words spoken at a moderate pace).

  2.  **Determine the Core Metaphor:**
      *   Since the speaker is a carpenter, woodworking/construction metaphors are natural and grounding.
      *   *Idea:* Building a house vs. living in it. Or, the difference between a foundation and the walls.
      *   *Better Idea:* The tool vs. the craft. A hammer doesn't own the house it helps build.
      *   *Best Idea:* "Stewardship vs. Ownership." A caretaker tends a garden but doesn't claim to own the soil. This fits the "public service" aspect without glorifying tenure. It also fits the "sortition" idea (you are chosen to tend, then you leave).
      *   *Alternative:* "The Beam." A beam holds weight for a time, but if it stays too long, it warps. This fits the uncle's view on tenure. Let's go with the idea of *structure* and *load-bearing*.

  3.  **Structure the Eulogy:**
      *   **Opening:** Acknowledge the difficulty of the task. Establish the speaker's voice (carpenter). Acknowledge the two groups in the room without dividing them.
      *   **The Paradox:** Address the elephant in the room (26 years of service vs. his final belief that long service is harmful). Frame this not as hypocrisy, but as growth/honesty.
      *   **The Work (Family/Neighbors):** Acknowledge what he *did* (zoning, school board) without praising the *duration*. Focus on the *quality* of attention, not the quantity of years.
      *   **The Idea (Reform Circle):** Introduce the sortition concept gently. Connect it to the carpenter metaphor (rotating tools, fresh wood). Explain *why* he believed it (preventing warping/corruption).
      *   **The Instruction:** Explicitly mention his requests (no afterlife, no praise of tenure). This honors his integrity.
      *   **The Comfort:** How do we grieve without "he's watching over us"? We grieve by continuing the work. The comfort is in the structure he left behind, not his ghost.
      *   **Closing:** A final commitment to his truth.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with hands. I build things with wood. He built things with laws/rules. But we both know materials have limits.
      *   *Addressing the Tenure:* 26 years is a long time. Most would call it dedication. He called it a warning. I need to be careful here. I can't stand here and say "He was great because he stayed so long." He asked me not to.
      *   *The Neighbor/Family Side:* You knew him as the guy who showed up. The zoning dispute. The school board. He was *present*. That's the key. Not that he stayed 26 years, but that when he was there, he was *there*.
      *   *The Reform Side:* You knew the later years. The letters. The sortition. To the family: this wasn't a hobby. To the reformers: this wasn't just theory. It was his apology for the time he spent.
      *   *The Metaphor:* Wood warps. If a beam holds weight too long, it takes a set. He saw himself as a beam that had taken a set. He wanted fresh timber.
      *   *The Afterlife Constraint:* He didn't believe in ghosts. He believed in consequences. So we won't say he's looking down. We'll say he's looking *at* us, through the record he left.
      *   *Conclusion:* How to honor him? Not by missing him, but by fixing the system he pointed out.

  5.  **Refining the Tone:**
      *   *Check:* Is it too academic? *Adjustment:* Keep sentences punchier. Use "I" statements. Avoid jargon like "epistemological" or "bureaucratic inertia." Use "careerist" only if explained.
      *   *Check:* Is it too sentimental? *Adjustment:* Cut phrases like "heaven gained an angel." Replace with "the work remains."
      *   *Check:* Is the sortition part clear? *Adjustment:* Explain it as "taking turns" or "jury duty" rather than "democratic sortition theory."
      *   *Check:* Is the 10-minute timing right? *Adjustment:* A 10-minute speech is roughly 1,300 words. I need to ensure there's enough substance to fill the time without fluff.

  6.  **Self-Correction during Drafting (Mental Walkthrough):**
      *   *Critique:* I initially thought about saying he was "wrong" for the first 20 years.
      *   *Correction:* No, that insults the family who loved him then. Instead, say he learned something *through* the experience. The experience taught him the limit.
      *   *Critique:* I need to make sure the reformers don't feel like I'm watering down his message.
      *   *Correction:* Explicitly state that his final argument was his most important legacy, more than any zoning law he passed.
      *   *Critique:* The "no afterlife" constraint is hard for grieving family.
      *   *Correction:* Frame it as "he is here in the truth he told." That's a secular form of presence.

  7.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the transition between the "zoning guy" and the "political philosopher" is smooth.
      *   Verify all constraints from the prompt are met. (No tenure praise, no afterlife, no quirk dismissal, balanced audience).

  8.  **Word Count Check:**
      *   Aiming for ~1,400 words.
      *   Speaking rate: ~130-140 words per minute.
      *   1,400 / 140 = 10 minutes.

  *(Self-Correction on Word Count)*: I will write slightly more to allow for pauses and emotional weight, aiming for around 1,500 words to ensure it feels substantial enough for 10 minutes.

  9.  **Final Review against constraints:**
      *   Carpenter voice? Yes.
      *   No praise of tenure as wisdom? Yes (framed as a lesson in limits).
      *   No afterlife? Yes (explicitly addressed).
      *   Sortition explained simply? Yes.
      *   Comfort offered? Yes (through legacy of truth).

