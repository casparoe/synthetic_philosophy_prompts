answer: |-
  **1.** You accept the particularist's holism: a feature like "causing pain" can count against an action in one context, be inert in another, and count in favor in a third. Yet you insist there are exceptionless principles of *relevance*. If a feature can be morally inert in a specific instance, in what coherent sense is it *always* relevant? Are you not simply redefining "relevant" to mean "not logically excluded"?

  *Follow-up:* You will likely distinguish between a feature being *relevant* (part of the moral landscape) and being *salient* (actually doing work in a specific case). But if an agent can ignore an "inert" relevant feature without moral error, and need not attend to it in deliberation, what normative work is the principle doing other than marking logical possibility?

  **2.** Let's press on that normative work. You claim principles that fix relevance without fixing weight still guide deliberation by disciplining attention. But if your principles never tell an agent *how much* a feature counts, or even *which way* it leans in a given context, do they actually constrain the decision, or do they merely annotate the deliberation after the fact?

  *Follow-up:* You will argue this annotation is necessary for shared discourse. But the particularist offers a "default and challenge" structure: lying is wrong by default unless specific defeaters are present. This also disciplines attention and provides a shared vocabulary. What can your relevance principles do that a default clause cannot?

  **3.** If your answer is that defaults imply codified weight while your view does not, consider the explanatory burden. Suppose two actions share every feature that your principles mark as relevant, yet they differ in deontic status—one is permissible, the other forbidden. On your view, what accounts for the difference?

  *Follow-up:* You will presumably say there must be some further relevant feature distinguishing the cases. But if every difference in verdict requires positing a difference in relevant features, doesn't this render the claim "these features are relevant" trivial? It seems you are saying "the verdict differed because something mattered," which is compatible with particularism.

  **4.** This suggests your generalism might be compatible with a holism so radical it swallows the generalism whole. If the set of relevant features is open-ended, and their weight is uncodifiable, is there any remaining sense in which you are a generalist rather than a particularist who likes to keep lists of candidates? Where is the boundary between your view and a sophisticated particularism?

  *Follow-up:* You will likely insist the boundary is the existence of true, general claims about relevance. But if the particularist agrees that features are *capable* of mattering generally, even if their valence shifts, aren't you fighting over a verbal distinction rather than a substantive one?

  **5.** Let's shift to scale. Your apparatus seems built for an individual deliberating about a concrete situation they can perceive. But we also assess institutions, laws, and policies affecting millions, where particulars are opaque and aggregation is required. Does your view allow for codified rules in institutional settings, or must institutions also operate on particularist judgment case-by-case?

  *Follow-up:* If you say institutions need rules, you seem to concede that weight *can* be codified for practical purposes. If you say institutions should use heuristics, do those heuristics have normative force? Or is a policy unjust even if it follows the best heuristic, waiting for a particularist verdict to confirm it?

  **6.** If you maintain that institutional rules are merely heuristics for particularist verdicts, this implies that professional codes of conduct or legal standards have no intrinsic normative weight—they are just predictive tools for what a perfect deliberator would decide. Are you prepared to say that a judge following a binding legal standard is acting merely on a heuristic, and could be morally required to violate it in a specific case?

  *Follow-up:* You will likely say yes, the moral verdict trumps the rule. But if the moral verdict is uncodifiable and inaccessible to the public, doesn't this make institutional accountability impossible? How can we criticize an institution's rules if the real standard is invisible and particular?

  **7.** This leads to the question of contingency. Is the relevance of a feature like "promise-breaking" contingent on local social practices? In a community where promises are rarely kept and carry no social weight, is promise-breaking still relevant in your sense?

  *Follow-up:* If you say relevance is contingent on local practice, your general principles become empirically conditioned and culturally parochial, which undermines their status as moral principles. If you say relevance is universal regardless of practice, how do you explain the community's inability to see the relevance without appealing to a principle they reject?

  **8.** If you appeal to a principle they reject to explain their error, you seem to be relying on the very kind of codified weight you disavow. This brings us to wholesale moral criticism. Without codified principles fixing weight, how is "getting the other person to see the case differently" distinguishable from mere persuasion, manipulation, or asking for deference to your testimony?

  *Follow-up:* You will argue that the shared vocabulary of relevance allows for rational critique. But if we agree on the relevant features and still disagree on the verdict, and there is no principle to adjudicate the weight, isn't the dispute ultimately resolvable only by one party exhausting the other's rhetorical resistance?

  **9.** Let's tighten the trap on that rhetorical resistance. If moral progress consists in refining our sensitivity to relevant features rather than correcting our application of principles, what protects this process from becoming an echo chamber of shared sensibilities? How do you distinguish moral improvement from cultural drift without an external standard?

  *Follow-up:* You might say the standard is the world itself, or the nature of the features. But if the nature of the features does not dictate their weight, and weight is what determines the verdict, aren't you admitting that the "standard" is ultimately the particularist's perceptual capacity, not your generalist principles?

  **10.** Finally, I want you to state as precisely as you can: what would have to be true for the particularist to be right and your position to collapse into theirs? Is there a specific kind of feature, or a specific type of case, where relevance itself fails to be codifiable?

  *Follow-up:* And be honest: what consideration on the particularist's side do you find hardest to answer? Is it the threat of regress in explanation, the problem of institutional accountability, or the suspicion that "relevance" is just "weight" in disguise?
