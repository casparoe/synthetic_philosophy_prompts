answer: |-
  1. **Readings**

  1. **Institutional Division:** Legislators define the utility function; markets maximize expected utility. This assigns the definition of "good" to politics and the prediction of outcomes to finance. It implies a strict firewall where politicians cannot tweak the metric to favor a market outcome. In our zoning case, this means the council sets the satisfaction index once and never touches it again. This creates a rigid constraint on political oversight. (Institutional)

  2. **Epistemic Superiority:** Markets aggregate dispersed information about causal effects more accurately than voters or experts. This claims speculators know the consequences of policies better than citizens. It relies on the idea that financial incentives uncover truth that voting obscures. For zoning, this assumes traders know housing dynamics better than residents. It presumes financial skin in the game outweighs local lived experience. (Empirical)

  3. **Conceptual Separability:** Values (preferences over states) and beliefs (probabilities of states) are distinct categories that can be isolated. This assumes we can define "good" without implying how to achieve it. It suggests the fight over the metric is negligible compared to the fight over policy effects. It treats the welfare measure as a neutral ruler rather than a political tool. This denies that the definition of satisfaction is itself contested. (Conceptual)

  4. **Normative Legitimacy:** Democratic authority applies only to ends, while means are technical matters best left to efficiency. This argues voting on methods lacks legitimacy compared to voting on goals. It treats policy implementation as engineering rather than governance. This justifies removing zoning mechanics from the ballot box. It reclassifies distributional choices as technical optimizations. (Normative)

  5. **Decision-Theoretic Maximization:** Policy should maximize expected value where value is voted and probability is bet. This reduces governance to a calculation of expected utility based on distinct inputs. It assumes the utility function is complete enough to guide specific legislative choices. It turns the ordinance adoption into a math problem. This removes discretion from the final decision-making stage. (Decision-theoretic)

  6. **Metric Neutrality:** The chosen welfare measure is an objective fact that does not alter the underlying social reality. This assumes the metric captures welfare without changing who counts as a resident. It ignores the performative nature of measurement in social systems. It assumes the median resident stays the same person before and after zoning. This ignores gentrification and displacement effects entirely. (Conceptual)

  7. **Incentive Compatibility:** Financial stakes motivate truth-seeking in a way that civic duty does not. This posits that money removes the bias inherent in voting. It assumes market manipulation is less dangerous than voter ignorance. It suggests traders care more about accuracy than voters care about outcomes. This prioritizes profit motives over civic engagement. (Empirical)

  8. **Hard Data Exclusivity:** Only quantifiable, immediate indices count as beliefs; future judgments count as values. This restricts markets to betting on hard numbers rather than deliberative outcomes. It defines "belief" narrowly to exclude human evaluation. This rules out betting on what a citizen panel might decide later. It privileges automated data over human deliberation. (Normative)

  9. **Temporal Stability:** Societal values remain stable over the policy horizon while beliefs update. This assumes the definition of welfare won't change while the policy is in effect. It requires the welfare measure to remain valid even as the policy changes the community. It assumes today's satisfaction metric applies to tomorrow's population. This fails if the policy fundamentally alters the community composition. (Conceptual)

  2. **Verdicts**

  1. **Trivial.** It describes the mechanism but doesn't justify why this division is wise or stable. It offers no protection against metric manipulation by the council itself.
  2. **Substantive and defensible.** Markets often beat polls, though they struggle with complex causal chains involving social change. Zoning effects are complex and might exceed market competence.
  3. **Substantive but dubious.** Values and beliefs are entangled; defining a metric often decides the outcome before betting starts. The measure choice is the political fight, not a precursor.
  4. **Substantive but dubious.** Means often have moral weight; efficiency isn't the only legitimate criterion for governance. Zoning involves rights, not just efficiency.
  5. **Substantive and defensible.** Mathematically coherent, but relies on the inputs being separable and the utility function being complete. It works only if the utility function is robust.
  6. **False.** Metrics are performative; changing zoning changes the population, altering the median and gaming the index. This fails specifically on the endogeneity objection.
  7. **Substantive and defensible.** Incentives work, but can be manipulated by market manipulation or insider info just as votes can be bought. Money isn't a magic bias-remover.
  8. **Substantive but dubious.** Arbitrary restriction; betting on judgment is still betting on a fact (what they will say), not setting the value. There is no logical reason to exclude panel judgments.
  9. **Substantive but dubious.** Values shift rapidly; stability is an assumption, not a feature, especially when policy changes the populace. The population change invalidates the metric.

  3. **What my groupmate needed**

  To answer Objection 1 (measure is the fight), your groupmate needs Reading 6 (Metric Neutrality) or Reading 3 (Conceptual Separability) to be true. Both are dubious or false. The choice of measure *is* the value judgment, especially when endogenous. If the metric changes the population, the market optimizes for exclusion, not welfare. The market will accurately predict that pushing out unhappy people raises the median satisfaction score. To answer Objection 2 (judgment smuggles values), he needs Reading 8 (Hard Data Exclusivity) to be true. This is arbitrary. Betting on a panel's future judgment is betting on a fact (their verdict), not setting the value itself.

  The slogan slides from "markets beat votes at aggregating information" (Reading 2) to "markets should govern" (Reading 1). It also slides from "markets estimate expected welfare as measured" to "markets estimate what's good." Neither slide is earned. Nothing in the menu saves the design from the endogenous measure problem without admitting that the metric design is the actual political battle. You must confront that the metric design is where the power sits. The slogan obscures this by treating the metric as a value input rather than a policy variable. If the metric is endogenous, the market is just optimizing for a number, not welfare.

  4. **Leftovers from the brainstorm**

  1. Markets reveal true values better than votes. (Dropped: Contradicts the slogan's core distinction between values and beliefs.)
  2. Voters are irrational while speculators are rational. (Dropped: Too broad; voters are rational about values, just uninformed on facts.)
  3. Prediction markets reduce corruption. (Dropped: Empirical claim too specific for this conceptual analysis.)
  4. The market price is the only true probability. (Dropped: Epistemologically extreme and indefensible in social science.)
  5. Values are private, beliefs are public. (Dropped: Confuses ontology with accessibility; values are often public debates.)

  5. **What I say at the next meeting**

  I think we're treating the slogan like a shield when it's actually a design spec that needs stress-testing. The hard part isn't getting markets to predict outcomes; it's defining a welfare measure that doesn't game itself when policy changes the population. If we bet on a panel's future judgment, we aren't smuggling values in; we're acknowledging that hard numbers lie. We shouldn't let a catchy phrase stop us from fixing the metric problem before we build the market. Let's focus on who defines the measure, because that's where the real power sits. If we can't solve the endogeneity issue, the market will just optimize for the wrong thing efficiently.
