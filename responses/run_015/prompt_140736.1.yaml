answer: |-
  Dear Colleague,

  I have spent some time reflecting on the asymmetry you describe in our committee's practices, and I believe you are right to suspect that the theoretical underpinnings are more complex than my colleague's indirect view suggests. To get clear on what our practice presupposes, it helps to sketch the three dominant accounts of reasons for action and see how they map onto the three features you identified. The first account is the plain desire-based view, which holds that a person's reasons are fixed entirely by their actual contemporaneous desires and valuations. The second is the objective-list or object-given view, which holds that reasons are facts about a person's good or well-being that exist independently of their desires. The third is the idealized deliberation view, which your colleague favors, holding that reasons are determined by what a person would endorse if they were fully informed, calm, and coherent.

  When we test the plain desire-based view against our practices, it struggles immediately with the first feature regarding Ulysses clauses. If reasons are fixed by actual desires at the time of action, the manic patient's current desire to refuse treatment should override the calm patient's past desire to accept it, yet our practice discounts the current desire precisely because of the patient's state. However, the desire-based view handles the second feature quite well, as it respects the competent patient's refusal regardless of mistaken beliefs, since the reason for action is the desire itself, not the truth of the belief supporting it. It also aligns with the third feature regarding limits on binding the future self, since a change in desire naturally dissolves the reason to comply with a past contract, though it fails to explain why we legally enforce some past commitments while voiding others. Conversely, the objective-list view handles the first feature well if we assume treatment is objectively good for the patient, and it handles the third feature well if we assume slavery or irreversible binding is objectively bad. However, it fails catastrophically on the second feature, as it would require us to override a competent patient's refusal of life-saving treatment based on the objective fact that survival is a good, whereas our practice explicitly forbids policing the quality of their reasoning in such cases.

  The idealized deliberation view appears to be the only one that comfortably accommodates all three features, which explains your colleague's confidence. On this view, the past self in the Ulysses scenario is authoritative because they were closer to the ideal deliberator—calm and informed—while the current self is distorted by psychosis. The competent refuser is respected because even if their beliefs are mistaken, their choice does not necessarily indicate a failure of deliberative capacity that would disconnect them from their idealized self's will, or perhaps because the idealized self values autonomy over specific outcomes. The limits on binding the future self are respected because an ideal deliberator would not consent to arrangements that permanently extinguish future agency. However, strictly speaking, our practice does not presuppose this metaphysical account of reasons. What our practice actually tracks is not the source of reasons but the authority of competence. The three features are mutually consistent if we understand them as applications of a single principle: we honor the choices of selves that possess decision-making capacity, and we prioritize the choices of selves with higher capacity over those with lower capacity. The past self in the Ulysses case is privileged because the current self lacks capacity, not necessarily because the past self is more idealized in a philosophical sense. The competent refuser is honored because they possess capacity, even if their beliefs are false. The limits on binding exist because we presume the future self will possess capacity that ought not be preemptively voided.

  This brings us to the proposed amendment regarding the revocation of Ulysses clauses. The current policy discounts any revocation during an episode, assuming the episode itself negates authority. The amendment proposes honoring a revocation if the patient can reconstruct the reasoning behind the original directive. This presupposes that the authority of the past self is not absolute but depends on the current self's ability to engage with that past reasoning. It assumes that the gap between the actual agent and the idealized deliberator is bridged not just by the past self's state, but by the current self's cognitive grip on the continuity of their agency. If the patient can articulate why they signed the directive, even if they now reject it, they demonstrate a level of coherence that suggests their current refusal is an authentic exercise of agency rather than a symptom of illness. This suggests that the authority of the idealized deliberator does depend on the actual agent being able to recognize that deliberator's reasoning as continuous with their own, but this is less a constraint on indirect views and more a practical safeguard for identifying whose reasoning is actually in play. It ensures we are not mistaking a pathological impulse for a genuine change of mind.

  Regarding your question on idealization, the amendment confuses neither procedural nor substantive idealization but rather leans heavily on procedural idealization. Procedural idealization adds information and removes distorting factors like fear, while substantive idealization corrects the desires themselves to match what is truly good. The amendment tests whether the patient can reconstruct the considerations they cited earlier, which is a test of understanding and memory—procedural capacities—rather than a test of whether they now desire the correct outcome. It does not require them to agree with the past self, only to understand the past self's reasoning well enough to reject it coherently. This distinguishes a competent reversal of preference from a psychotic break. If we required substantive agreement, we would never honor a revocation, as the patient would have to want what their past self wanted. By requiring only procedural continuity, the amendment allows for genuine growth or change of mind while filtering out noise caused by the episode.

  Finally, if we abandoned the indirect picture altogether, the consequences for our three features would be stark depending on which alternative we adopted. If we said reasons are simply given by actual contemporaneous valuing, the first feature would have to give way entirely. We could no longer treat a patient over their contemporaneous protest based on a past signature, because the current desire would be the only source of reasons. The second feature would remain intact, as actual valuing respects the refusal regardless of mistaken beliefs. The third feature would likely remain, but only as a pragmatic rule about changing desires rather than a normative limit on binding. If instead we said reasons are given by facts about well-being that actual valuing can fail to track, the second feature would have to give way. We would be obligated to override a competent patient's refusal of life-saving treatment because the objective fact of survival outweighs the subjective desire to refuse. The first feature would remain, provided the treatment was objectively good, and the third feature would remain only insofar as binding contracts are objectively harmful. Thus, the indirect view, or at least a competence-based hybrid that mimics its structure, is the only framework that preserves the delicate balance of our current ethical practices without requiring us to sacrifice either patient autonomy in competent cases or patient welfare in incompetent ones. The amendment strengthens this by adding a nuanced test of continuity that respects the possibility of authentic change even within an episode, without surrendering the protective function of the Ulysses clause.

  I hope this helps clarify the theoretical stakes as you consider the amendment.

  Best regards,

  Your Colleague
