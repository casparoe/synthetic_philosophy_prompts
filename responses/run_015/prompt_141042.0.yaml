      *   **Specific Constraint:** "Audit this package as a whole rather than lecturing me on definitions." They know the definitions (mostly). They want to know about *internal consistency* and *tensions*.
      *   **Specific Tasks:** Identify genuine tensions vs. apparent tensions, explain why apparent ones dissolve, rank tensions by severity, specify trade-offs for resolving real tensions, and suggest a single revision that cleans up the most.
      *   **Tone:** American English, analytical, respectful but critical (no pandering), precise.

  2.  **Analyze the Six Claims:**
      *   (1) *Standard Quantitative Genetics:* Heritability ($h^2$) = $V_G / V_P$ within a specific population/time. No individual causation. No between-group inference (Lewontin's fallacy).
      *   (2) *Modifiability:* High $h^2$ $\neq$ immutable. Environmental interventions can still shift means (e.g., PKU, height).
      *   (3) *The "Audit Reading":* High $h^2$ implies equalized environment (Greenhouse analogy). Rising $h^2$ = social progress (equal opportunity).
      *   (4) *Gene-Environment Correlation (rGE):* Environment isn't exogenous. Parents pass on genes *and* environments (passive rGE), kids evoke environments (evocative rGE), kids select environments (active rGE).
      *   (5) *Literacy Case Study:* Reading is $h^2$ in schooled populations (implies equal instruction) but requires instruction to exist at all (threshold effect).
      *   (6) *Breeder's Equation:* Breeders use $h^2$ to predict response to selection ($R = h^2 \times S$). User sees tension with (1) because this looks like predicting individual/population shifts based on genes.

  3.  **Evaluate Internal Consistency (The Audit):**

      *   **Pair (1) & (6):**
          *   *Tension:* (1) says $h^2$ is descriptive of variance *now* and forbids individual prediction or between-group inference. (6) says breeders use it to predict *future* shifts in the herd average.
          *   *Resolution:* This is a classic confusion. (1) forbids inferring *causes of differences between groups* or *individual destiny*. It does *not* forbid predicting the *response to selection within the same population* under the *same environmental conditions*. The Breeder's Equation works precisely because it stays within the variance framework of (1).
          *   *Verdict:* Apparent tension. Dissolves on inspection of "within population" constraints.

      *   **Pair (1) & (3):**
          *   *Tension:* (1) says $h^2$ is just a ratio, not an explanation. (3) says high $h^2$ *explains* that environment is equalized (normative claim).
          *   *Resolution:* This is the "Scarr-Rowe Hypothesis" or the "Wilson Effect" logic. It's theoretically sound *if* environmental variance ($V_E$) decreases. However, (1) warns against reification. (3) risks treating $h^2$ as a policy meter.
          *   *Verdict:* Mild tension. (3) is an *interpretation* of (1), not a contradiction, but it relies on a specific assumption ($V_E$ is shrinking, not $V_G$ growing).

      *   **Pair (2) & (3):**
          *   *Tension:* (2) says high $h^2$ traits are still modifiable. (3) says high $h^2$ means environment is equalized (so maybe less room for environmental intervention?).
          *   *Resolution:* No tension. You can have equal environments (high $h^2$) and still shift the mean (e.g., better fertilizer for all plants).
          *   *Verdict:* No tension.

      *   **Pair (3) & (4):**
          *   *Tension:* (3) treats Environment as something "handed out" (exogenous). (4) says Environment is partly an output of Genes (endogenous/rGE).
          *   *Resolution:* This is the **Big One**. If (4) is true (rGE), then the Greenhouse analogy in (3) breaks down. In the greenhouse, light is exogenous. In humans, "light" (parenting, schooling quality) is often correlated with parental genes. If $V_E$ includes variance caused by $G$ (via rGE), then high $h^2$ doesn't necessarily mean "equal opportunity." It might mean "genetic privilege is effectively transmitting itself through environmental channels."
          *   *Severity:* High. This undermines the normative punch of (3).
          *   *Verdict:* Genuine, severe tension.

      *   **Pair (4) & (5):**
          *   *Tension:* (5) says high $h^2$ in literacy = equal instruction. (4) says parenting/neighborhood (part of instruction access) is heritable.
          *   *Resolution:* Similar to (3) & (4). If access to good schools is heritable (via parental SES/IQ), then $h^2$ of literacy captures that genetic advantage masquerading as environmental effect or vice versa.
          *   *Verdict:* Moderate tension, subset of (3)/(4).

      *   **Pair (1) & (5):**
          *   *Tension:* (5) makes a strong causal claim ("evidence that instruction is now roughly comparable"). (1) says $h^2$ is not an explanation.
          *   *Resolution:* (5) is an inference *based* on (1), assuming $V_E$ dropped. It's consistent but relies on the assumption that $V_G$ didn't change.
          *   *Verdict:* Low tension.

  4.  **Ranking the Tensions:**
      1.  **(3) vs. (4):** The "Audit Reading" vs. Gene-Environment Correlation. This is the structural weak point. If environment is endogenous, the greenhouse analogy fails for humans.
      2.  **(1) vs. (6):** The "Prediction" confusion. Easy to fix with terminology, but looks bad if left unclarified.
      3.  **(3) vs. (2):** Normative vs. Technical. Less severe, mostly rhetorical.

  5.  **Drafting the Response:**
