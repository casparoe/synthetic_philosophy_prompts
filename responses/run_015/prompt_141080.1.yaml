      *   *Critique:* Too much facilitator management.
      *   *Simpler:* Everyone writes 5 cards. Put them in a bowl. Everyone draws 5 cards. Now everyone is a "Strange Loop" of the room.
      *   *For the Twists:* We need specific cases. Let's ask for 3 Volunteers *at the start* whose cards we set aside. We use them for the specific Density/Divergence demos. The rest of the room does the general "mixing" exercise. This ensures the twists work without relying on chance.

