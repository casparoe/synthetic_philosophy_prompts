      We should authorise a precautionary care protocol and a time-limited communication trial based on the broadcast index, but withhold decisive weight regarding clinically assisted nutrition and hydration until independent verification is secured.

      The central ethical tension lies in the gap between access consciousness and phenomenal experience. The global workspace theory underpinning this index measures information availability for report and control systems. Alan cannot report or control. Critics rightly argue that ignition might occur without a subject to experience it—a brain processing data in the dark. However, the counter-argument holds equal force: we never observe phenomenal consciousness directly in anyone. We infer it from behaviour and physiology. To demand a higher standard of proof for Alan than we apply to healthy adults creates an unjustifiable asymmetry. Given the brutal cost of error—condemning a sentient man to untreated pain or premature death—the precautionary principle must govern our care, even if epistemic certainty remains out of reach.

      Regarding the specific decisions:

      First, on repeating the test. We cannot validate clinical care on a single dataset generated by a group with commercial interests. We will run the test twice more, but only under a formal research governance framework managed by our own neurophysiology department, not the visiting group. This ensures methodological rigour without endorsing a commercial product. Results must be concordant before we treat the index as a stable biomarker for Alan.

      Second, on analgesia. A positive index licenses a 'presumed experience' protocol for noxious interventions like suctioning or turning. The nursing team's concern regarding over-sedation and chest infection is valid but manageable. We mitigate this by using targeted analgesia rather than blanket sedation, reviewing dosage weekly. The risk of iatrogenic harm from cautious pain management is outweighed by the moral certainty of avoiding potential torture. If he feels nothing, the drug does no harm; if he feels pain, withholding it is indefensible.

      Third, on brain–computer interface (BCI) communication. We should license a trial, but with strict boundaries. We allocate three months for intensive therapy. If no reliable binary communication is established by then, we cease. This respects the family's hope without committing infinite resources to a low-probability outcome. The index suggests capacity for imagery, but imagery is not communication. We must distinguish the potential for thought from the ability to share it.

      Fourth, on clinically assisted nutrition and hydration (CANH). Here, the index carries minimal weight. Best-interests decisions regarding life-sustaining treatment require a higher threshold of certainty regarding quality of life and subjective experience than a probabilistic EEG marker can provide. The index suggests potential awareness, but not the content of that awareness, nor whether his life is experienced as a benefit or a burden. We cannot base a decision to withdraw or continue life-sustaining treatment solely on this data.

      Finally, the proposed two-tier framework. The subgroup suggests separating access-type evidence from experience-based decisions. We should reject a rigid split but adopt their underlying logic as a sliding scale. Collapsing the standard entirely ignores the epistemic gap; maintaining a rigid wall ignores the moral risk. Instead, we treat the index as sufficient for reversible, protective measures (analgesia, communication trials) but insufficient for irreversible, existential decisions (CANH). This is not a philosophical contradiction but a pragmatic calibration of evidence against consequence.

      Actions: Neurophysiology to schedule independent repeats by Tuesday. Nursing lead to draft analgesia protocol by Wednesday. BCI team to confirm availability for three-month trial. We revisit CANH only if communication is established or clinical status changes significantly.

