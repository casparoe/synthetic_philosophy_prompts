  5. **Closing Note on Prediction Failure**
  My prediction is most likely to fail if the Senior Author defines "the demos" to include **complicity in coercion**.
  *   **Assumption:** I am assuming the Author views the silencing of opposition as an external constraint *on* the demos.
  *   **Risk:** She may view the mob's willingness to allow the silencing (or the failure to protect *parrhesia*) as the ultimate institutional failure. In *Arginusae*, the Assembly violated its own laws and was ruled a "failure." At Colonus, the Assembly allowed its own procedures to be suspended. If she views the *defense of procedure* as the primary metric of the demos' health, then Colonus is the definitive **Failure**, regardless of elite manipulation. The *Hyperbolus* case supports my prediction (elites manipulated mechanism), but Colonus involves the *suspension* of the mechanism, which may cross a red line for her. If she values democratic resilience over democratic innocence, the verdict flips to "Failure."
