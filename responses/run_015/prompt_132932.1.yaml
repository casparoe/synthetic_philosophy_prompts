prompt: |-
  Hey — you're a clinical ethicist and philosopher who's also sat on a hospital IRB for years, so take this seriously, brainstorm a bit first, and then give me something I can actually use.

  I'm the senior research nurse on a transplant/oncology floor and I run the consent conversations for trials and for a couple of high-risk procedures — usually 4–6 a week, 15–20 minutes each, and I have to log a decision the same day that the IRB and the PI will both sign off on. Patients are often on steroids or opioids, sometimes in pain, frequently with family in the room who have already made up their minds, and the person recruiting them is very often their own treating consultant. I want a procedure, not a form: the questions in order, what counts as a sufficient yes to each one and what counts as a no, the question where I stop and don't proceed, and the places where I have to hand the call to someone else because it's a values question dressed up as a factual one. Be honest about which steps are theatre I perform for the file.

  Two things the standard disclosure / understanding / voluntariness checklist just doesn't help me with, and I need them handled: (a) everything comes as a package — the trial drug only comes with the extra biopsies and the home-visit adherence monitoring, so people say yes to the whole bundle because they want one part, or say yes to part and refuse the rest; (b) I have to pick some framing of the risks and the framing moves people — "30%" vs "about a third", survival curves vs. side-effect lists — so I'm never merely transmitting information, and I cant tell when that tips over into having manufactured the yes myself.

  Then run the procedure on three cases: [1] Mr A, day 3 on high-dose steroids, consenting for a phase I dose-finding trial; cheerful, repeats all the numbers back to me correctly, and volunteers that this is his best shot at a cure — it isn't, it's dose-finding, there's no therapeutic intent. [2] Ms B, listed for a transplant, perfectly happy to take the organ and the immunosuppression, refuses the protocol-required weekly adherence visits, and says then just give her the transplant without the study — there is no such option. [3] Mr C, enrolled under deferred consent after an emergency procedure, sister signed; he wakes up on day 2, fully with it, says he would never have agreed, wants out of the study going forward but is fine with the data already collected.

  Give me the answer the procedure actually gives, even when it's one I wont like, and tell me at the end what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethicist & Philosopher with IRB experience. Tone should be serious, practical, experienced, and honest.
      *   **User:** Senior Research Nurse on a transplant/oncology floor.
      *   **Task:** Create a *procedure* (not a form) for consent conversations.
      *   **Constraints/Context:** 4-6 consents/week, 15-20 mins each, same-day logging, patients often impaired (steroids/opioids/pain), family pressure, treating consultant often recruiting (therapeutic misconception risk).
      *   **Specific Needs:**
          *   Ordered questions with criteria for Yes/No/Stop.
          *   Identification of "hand-off" points (values vs. facts).
          *   Honesty about "theatre" (documentation vs. reality).
          *   Address two specific pain points: (a) Package deals (bundled interventions), (b) Framing effects (risk communication).
          *   Apply procedure to three specific cases (Mr. A, Ms. B, Mr. C).
          *   Admit limitations of the procedure at the end.

  2.  **Deconstruct the Ethical Landscape:**
      *   *Autonomy:* Is the patient actually choosing, or just agreeing?
      *   *Beneficence/Non-maleficence:* Are we protecting them from harm (especially in Phase I)?
      *   *Justice:* Are we coercing vulnerable populations?
      *   *Regulatory:* IRB requirements, Common Rule, HIPAA.
      *   *Reality:* The tension between recruitment targets and ethical rigor. The "therapeutic misconception" is huge here.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a flow that fits a 15-20 minute window but hits the ethical high notes.
      *   *Step 1: Capacity & Environment.* Can they decide? Is the coercive person out of the room?
      *   *Step 2: The "Why" Check.* Why are they doing this? (Addresses therapeutic misconception).
      *   *Step 3: The Bundle Check.* Do they understand the non-negotiable parts? (Addresses Pain Point A).
      *   *Step 4: The Risk Frame Check.* How did I present the risk? Did I check their understanding of the *worst* case? (Addresses Pain Point B).
      *   *Step 5: The "Out" Clause.* Do they know they can quit?
      *   *Step 6: The Signature.* The "theatre" part.

      *Refining the "Hand-off":* When does a nurse stop? When values conflict with protocol, or capacity is dubious due to meds.
      *Refining the "Theatre":* Acknowledge that the signature often validates the *process* more than the *understanding*.

  4.  **Addressing the Specific Pain Points:**
      *   *(a) The Package:* The procedure needs a specific "Unbundling Question." If they want the drug but hate the biopsies, they can't have the drug. This needs to be explicit.
      *   *(b) The Framing:* The nurse needs a "Reverse Frame" step. If I said "70% survival," I must ask "What does 30% death mean to you?" to neutralize my influence.

  5.  **Running the Cases:**
      *   *Mr. A (Steroids, Phase I, Therapeutic Misconception):*
          *   Capacity: Questionable (steroids).
          *   Why: "Cure" (Red flag).
          *   Procedure outcome: **STOP.** Do not proceed. Therapeutic misconception is fatal in Phase I. Need PI/Ethicist intervention to reset expectations.
      *   *Ms. B (Transplant, Refuses Protocol Part):*
          *   Bundle: She wants to unbundle.
          *   Protocol: No option to unbundle.
          *   Procedure outcome: **NO CONSENT.** She cannot be enrolled. She can still get the transplant (standard of care), but not the trial. This is a hard "No."
      *   *Mr. C (Deferred Consent, Withdrawal):*
          *   Status: Enrolled under emergency/deferred.
          *   Current Wish: Withdraw.
          *   Data: Wants data kept.
          *   Procedure outcome: **WITHDRAW INTERVENTION, RETAIN DATA (if IRB allows).** This is a regulatory nuance. Usually, you stop the intervention immediately. Data usage depends on the specific IRB approval for deferred consent.

  6.  **Developing the Tone:**
      *   Professional, empathetic but firm.
      *   Avoid academic jargon where possible, but use precise ethical terms where necessary.
      *   Acknowledge the pressure the nurse is under (PI sign-off, recruitment numbers).
      *   Be honest about the "theatre" of consent forms.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too long for 15 mins?
      *   *Fix:* Make the steps sharp. Use "Stop Rules."
      *   *Critique:* Did I address the framing issue enough?
      *   *Fix:* Add a specific script for the "Reverse Frame."
      *   *Critique:* Is the Mr. C outcome accurate?
      *   *Fix:* In deferred consent (EFIC or emergency), once capacity returns, they must re-consent for *ongoing* participation. If they refuse, intervention stops. Data already collected is usually retained unless they specify otherwise, but protocols vary. I need to be precise here: Intervention stops, data retention depends on the specific waiver granted. I will advise stopping intervention immediately and checking the specific waiver for data.
      *   *Critique:* The prompt asks for "what counts as a sufficient yes." I need to define that clearly.
      *   *Fix:* Add "Pass Criteria" for each step.

  8.  **Final Polish:**
      *   Ensure the "Limitations" section is robust. A procedure cannot fix systemic coercion or bad trial design.
      *   Make sure the distinction between "Research" and "Care" is highlighted, especially for Mr. A.

  9.  **Final Output Structure:**
      *   Introduction (acknowledging the role and the tension).
      *   The Procedure (The "Consent Integrity Protocol").
      *   Application to Cases (A, B, C).
      *   The Limitations (What this tool cannot fix).

  *(Self-Correction on Mr. C)*: Wait, if he wants out of the study but is fine with data collected, that's actually a specific regulatory choice. Under Common Rule, participants can often choose to withdraw from *interventions* but allow *data use*. I need to make sure the procedure captures this distinction.

  *(Self-Correction on Mr. A)*: High-dose steroids (Decadron) can cause steroid psychosis or significant mood lability/cognitive impairment. Even if he "repeats numbers," understanding != appreciation. The procedure must flag "Appreciation" vs "Recitation."

  *(Self-Correction on "Theatre")*: I need to be very blunt about the signature line. It's a legal shield for the institution, not a moral seal for the nurse.

  Let's write it.cw
answer: |-
  Here is the procedure. It is designed for the reality of your floor: high turnover, high stakes, compromised capacity, and institutional pressure. It is not a checklist for the chart; it is a decision tree for you.

  ### The Consent Integrity Protocol (CIP)
  **Time Budget:** 15–20 Minutes
  **Goal:** Distinguish *agreement* from *authorization*.

  #### Phase 1: The Capacity & Environment Scan (Minutes 0–3)
  *Do not open the consent form yet.*

  **Q1: The "Room Check"**
  *   **Ask:** "Who is in the room right now that you would like to step out so you can speak freely?"
  *   **Sufficient Yes:** Patient identifies a private space or asks specific people to leave.
  *   **No/Stop:** Patient looks at a family member/consultant before answering, or the consultant refuses to leave.
  *   **Action:** If the treating consultant (who is also the recruiter) refuses to leave, **STOP.** This is coercive by design. You must document "Consultant present during consent" and flag for IRB review later. Do not proceed to signature.

  **Q2: The "Medication/State Check"**
  *   **Ask:** "On a scale of 0–10, how is your pain/nausea/anxiety right now?" + Review MAR for steroids/opioids in last 4 hours.
  *   **Sufficient Yes:** Pain < 4, no IV push opioids in last 2 hours, steroid dose stable (not day 1–3 of high dose pulse).
  *   **No/Stop:** Patient is sedated, in acute distress, or on Day 1–3 of high-dose steroids (e.g., Dexamethasone > 10mg).
  *   **Action:** **STOP.** Document "Capacity deferred due to acute physiological state." Reschedule for 24 hours.
  *   **The Theatre:** You will log "Patient deemed competent" on the form later to keep the PI happy. *Ethical Reality:* If they are on Day 3 steroids, their judgment is chemically altered. You are protecting them from themselves.

  #### Phase 2: The Therapeutic Misconception Test (Minutes 3–8)
  *This addresses the "Treating Consultant" conflict.*

  **Q3: The "Goal Question"**
  *   **Ask:** "If you join this, what are you hoping happens?"
  *   **Sufficient Yes:** "I hope it helps science," or "I know it might not help me, but I want to try," or "I understand this is testing safety."
  *   **No/Stop:** "I want to get cured," "This is my best shot," "The doctor said this is the new treatment."
  *   **Action:** **STOP.** This is the Therapeutic Misconception. You cannot proceed until you explicitly decouple *care* from *research*.
  *   **Hand-off:** If the patient insists this is treatment, you must bring in a neutral party (Ethics consult or a nurse not on the study team) to explain the difference. Do not let the recruiting consultant re-explain it.

  #### Phase 3: The Bundle & Framing Check (Minutes 8–15)
  *This addresses your two specific pain points.*

  **Q4: The "Unbundling Question" (Addressing Pain Point A)**
  *   **Script:** "This study is a package. It includes the drug, the extra biopsies, and the home visits. You cannot have the drug without the biopsies. If you say yes to the drug but no to the biopsies, you cannot be in the study. Does that make sense?"
  *   **Sufficient Yes:** "I understand I have to do all of it or none of it."
  *   **No/Stop:** "Can't I just do the drug?" or "I'll skip the home visits."
  *   **Action:** **NO CONSENT.** They are ineligible. They receive Standard of Care (SOC) only. Do not try to negotiate. The protocol is rigid; your consent cannot be flexible.

  **Q5: The "Reverse Frame" (Addressing Pain Point B)**
  *   **Context:** You have presented the risks (e.g., "30% chance of severe toxicity"). Now you must neutralize your framing.
  *   **Script:** "I just told you there is a 30% chance of severe toxicity. Some people hear that as '70% safe.' Others hear it as '3 out of 10 people get very sick.' How do you hear it?"
  *   **Sufficient Yes:** Patient articulates the risk in their own words, acknowledging the *negative* outcome. "I know there's a real chance I get sicker."
  *   **No/Stop:** Patient repeats your optimistic framing ("So I'm mostly safe") or minimizes the risk ("That's not too bad").
  *   **Action:** **PAUSE.** Re-explain using the *worst-case* framing. "Let me be clearer: 3 out of 10 people end up in ICU." If they still minimize, proceed with caution, but document the specific language used.

  #### Phase 4: The Exit Ramp (Minutes 15–20)

  **Q6: The "Quit Question"**
  *   **Ask:** "If you sign this and then decide tomorrow you hate it, what happens?"
  *   **Sufficient Yes:** "I can quit," "You stop the drug," "I still get my regular care."
  *   **No/Stop:** "I'm locked in," "I can't let the team down."
  *   **Action:** **STOP.** Re-explain voluntary withdrawal.

  **Q7: The Signature (The Theatre)**
  *   **Action:** If all above are "Sufficient Yes," you log the consent.
  *   **Honesty:** The signature line is not a moral seal; it is a legal timestamp. It protects the hospital, not the patient. If you have doubts after Q1–Q6, you can still sign (to keep the trial moving) but you must file an *Adverse Event/Concern Note* in the internal research log that the PI sees. This triggers a review without stopping the patient's access immediately.

  ---

  ### Application to Cases

  Here is what the procedure dictates, regardless of recruitment targets.

  #### Case 1: Mr. A (Steroids, Phase I, "Cure")
  *   **Phase 1 (Capacity):** **FAIL.** Day 3 high-dose steroids. Even if he recites numbers, his *appreciation* is chemically compromised.
  *   **Phase 2 (Goal):** **FAIL.** He believes this is a cure. Phase I is dose-finding/toxicity. There is no therapeutic intent.
  *   **Procedure Verdict:** **DO NOT CONSENT.**
  *   **Action:** You stop the conversation. You document "Therapeutic Misconception Identified." You inform the PI that consent cannot be obtained today.
  *   **Hard Truth:** If the PI pressures you, you file the internal concern note. Mr. A is vulnerable. Enrolling him now is ethically indefensible and puts the whole study at risk of audit failure later. He needs to be off steroids or stabilized, and he needs a neutral educator to explain Phase I.

  #### Case 2: Ms. B (Transplant, Refuses Protocol Part)
  *   **Phase 3 (Unbundling):** **FAIL.** She wants the drug/organ but refuses the adherence visits.
  *   **Protocol Reality:** You stated there is "no such option."
  *   **Procedure Verdict:** **NO CONSENT FOR TRIAL.**
  *   **Action:** She receives the transplant as **Standard of Care**. She is not enrolled in the research protocol.
  *   **Hard Truth:** You cannot coerce the visits. If the PI says "She ruins the data," you reply: "She preserves her autonomy." The procedure protects you from being the enforcer of a protocol that demands behavior the patient won't give. She gets the care; the study just doesn't get the data.

  #### Case 3: Mr. C (Deferred Consent, Withdrawal)
  *   **Status:** Enrolled under emergency/deferred consent (EFIC or similar). Capacity has returned.
  *   **Phase 4 (Exit Ramp):** He is exercising the "Quit Question."
  *   **Procedure Verdict:** **WITHDRAW INTERVENTION IMMEDIATELY.**
  *   **Data Nuance:** He says he is "fine with data already collected."
      *   **Action:** You stop the study drug/intervention *now*.
      *   **Data:** You check the specific IRB waiver for deferred consent. Usually, if a patient regains capacity and refuses *ongoing* participation, you must stop intervention. Data collected *prior* to withdrawal can often be retained if the waiver allowed for it, *but* if he explicitly says "I want out of the study," the safest ethical and legal route is to stop intervention and quarantine the data pending IRB guidance.
      *   **Recommendation:** Honor his wish to stop intervention. Regarding data: If the IRB waiver allowed data retention upon withdrawal, you may keep it. If he says "I want out of the study," that usually implies data too. **Best Practice:** Stop intervention. Ask him specifically: "Can we keep the data from the first 2 days for science, even if you stop the drug?" If he says yes, document that specific consent. If he says no, destroy/quarantine data.
      *   **Hard Truth:** Deferred consent is a fragile ethical contract. Once capacity returns, the patient's current will overrides the surrogate's past will.

  ---

  ### What This Procedure Cannot Do

  I need to be honest with you about the limits of this tool.

  1.  **It Cannot Fix Bad Trial Design:** If a Phase I trial is designed in a way that inherently confuses patients (e.g., calling it "treatment" in the brochure), no amount of questioning by you will fix the structural deception. You are patching a leak in a sinking ship.
  2.  **It Cannot Neutralize Economic Coercion:** If a patient consents because they can't afford the Standard of Care and the trial covers the cost, this procedure identifies it, but it doesn't solve it. You will still have to log the consent, knowing it was financially coerced.
  3.  **It Cannot Protect You from Retaliation:** If you stop consent on Mr. A because of steroids, the PI may mark you as "difficult." This procedure gives you the *ethical* cover, but it does not give you *administrative* armor. You may need to escalate to the IRB chair directly if the PI insists on enrolling impaired patients.
  4.  **It Cannot Eliminate Your Own Framing:** Even with the "Reverse Frame" question, you are still the one choosing which risks to highlight first. You are human. You will still lean towards recruitment when you are tired. This procedure slows you down; it doesn't make you a robot.

  **Final Advice:**
  Use the "Internal Concern Note" aggressively. It is the only way to satisfy the regulatory requirement (get the signature) while satisfying your ethical obligation (flag the risk). It creates a paper trail that says, "I knew this was shaky, and I warned you." That is how you sleep at night.
