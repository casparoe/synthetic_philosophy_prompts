answer: |-
  **Project Title:** Access Profiles and Revision-Sensitivity: Testing the Threshold Model of Consciousness

  **Principal Investigator:** [Name], Department of Philosophy
  **Co-Investigator:** [Name], Cognitive Neuroscience Group
  **Duration:** 9 Months
  **Request:** Seed Grant for Part-Time RA and Behavioral Pilot

  **1. Research Question**
  Does conscious access function as a binary threshold (as predicted by Global Workspace Theory) or as a graded profile of availability across downstream consumer systems? Specifically, is 'revision-sensitivity'—the availability of content for error correction and strategic adjustment—dissociable from standard report measures, or does it collapse into them?

  **2. Background and Conceptual Payoff**
  The debate over whether phenomenal consciousness outruns cognitive access (the "overflow" debate) has reached a dialectical stalemate. Proponents of overflow argue that rich phenomenology exceeds the narrow bottleneck of report (e.g., iconic memory in change blindness). Opponents, typically aligning with Global Workspace Theory (GWT), argue that without report or working memory encoding, there is no evidence of consciousness—only unconscious priming.

  This deadlock persists because both sides treat "access" as a unitary property with a single threshold. GWT identifies consciousness with global broadcast (ignition); if a stimulus fails to ignite, it is unconscious. However, this ignores the possibility of partial broadcast: content might be available to some consumer systems (e.g., motor priming) but not others (e.g., verbal report). The current literature lacks a framework for mapping these profiles.

  This project proposes a shift from a threshold model to a profile model. We introduce a specific marker: **revision-sensitivity**. The core hypothesis is that content is phenomenally conscious only if it is available to the systems responsible for monitoring and correcting errors. Unlike simple priming (which can be blind) or standard report (which requires language and confidence), revision-sensitivity requires the content to be available *for the subject* to override a prepotent response.

  **Conceptual Risk Assessment:** There is a significant risk that 'revision-sensitivity' is merely "report with extra steps." If the mechanism for error correction relies on the same neural substrates as metacognitive confidence ratings, this project adds vocabulary but no explanatory power. Furthermore, GWT proponents may argue that any revision capability implies ignition, thereby absorbing the data back into the threshold model. This proposal treats these risks as falsifiable conditions rather than assumptions.

  **3. Methodology and Work Packages**
  Given the nine-month timeline and lack of scanning equipment, this project relies on a tightly constrained behavioral pilot paired with philosophical analysis.

  **WP1: Conceptual Clarification (Months 1–3)**
  *   **Lead:** PI (Philosophy)
  *   **Task:** Rigorously define 'revision-sensitivity' to distinguish it from standard metacognition and unconscious conflict monitoring. We must specify whether revision implies a conscious "veto" (Libet-style) or a post-hoc strategic shift.
  *   **Deliverable:** A working paper distinguishing operative availability (can I use this to fix a mistake?) from declarative availability (can I say I saw this?). This prevents the project from collapsing into the existing report-versus-priming distinction.

  **WP2: Task Design and IRB (Months 2–4)**
  *   **Lead:** CI (Neuroscience) + RA
  *   **Task:** Adapt a masking or change-blindness paradigm to include a correction window. Subjects make a rapid forced-choice response, followed by a brief window where they can alter their response based on further processing.
  *   **Constraint:** We will not attempt to measure consciousness directly. Instead, we measure the dissociation between *confidence ratings* (standard proxy for access) and *correction rates* (revision-sensitivity).
  *   **Deliverable:** Approved protocol and pilot task script.

  **WP3: Behavioral Pilot (Months 5–7)**
  *   **Lead:** RA + CI
  *   **Task:** N=40 undergraduates. Conditions will manipulate stimulus visibility to create a gradient of access.
  *   **Measures:** (1) Accuracy, (2) Confidence Rating, (3) Correction Rate (did they change a wrong answer to a right one in the window?), (4) Post-experiment debrief (did they feel they saw the stimulus when correcting?).
  *   **Deliverable:** Clean dataset.

  **WP4: Analysis and Integration (Months 8–9)**
  *   **Lead:** PI + CI
  *   **Task:** Correlate correction rates with confidence. If correction occurs frequently when confidence is low, this supports the profile model (content available for correction but not report). If they track perfectly, the threshold model holds (or the measures are redundant).
  *   **Deliverable:** Draft manuscript for interdisciplinary journal.

  **4. Expected Outcomes and Failure Conditions**
  A **positive result** would show a dissociation: subjects correct errors in conditions where they report low confidence or chance-level visibility. This would suggest access is graded; some systems (error monitoring) received the content while others (metacognitive report) did not. This challenges GWT to explain why ignition would target error correction but not confidence reporting.

  A **negative result** would show perfect correlation between confidence and correction. This would suggest revision-sensitivity is not a distinct marker.

  **Project Failure:**
  We must be explicit about what constitutes failure for this seed grant, as the conceptual risk is high.
  1.  **Conceptual Collapse:** If analysis in WP1 reveals that 'revision-sensitivity' cannot be defined without referencing report or confidence, the core concept is vacuous. The project will halt after WP1, producing only a philosophical critique.
  2.  **Methodological Indistinguishability:** If the behavioral task cannot dissociate unconscious conflict monitoring (e.g., ERN-like processes) from conscious correction, the data will be uninterpretable. Given the lack of EEG, we cannot verify if corrections are driven by unconscious error signals. This is the primary vulnerability of a behavioral-only pilot.
  3.  **Timeline Feasibility:** Nine months is aggressive for IRB approval and recruitment. If recruitment fails, the project fails to produce empirical data.

  **5. Significance**
  Even if the pilot yields null results, the project succeeds if it demonstrates that the "access" variable in consciousness studies is too coarse. If 'revision-sensitivity' collapses into report, we have empirically confirmed that high-level cognitive access is unitary, strengthening the threshold model. If it dissociates, we force Global Workspace Theory to account for partial broadcast without relying on ad-hoc thresholds. This moves the debate from "yes/no" overflow to a structural analysis of which consumer systems define the conscious subject.

  **6. Budget Justification**
  Funds are requested solely for a part-time Research Assistant to handle stimulus programming (PsychoPy), IRB coordination, and subject recruitment/testing. No equipment is required; lab space and existing computers are available in the Neuroscience Group. The PI covers philosophical labor; the CI covers neuroscience oversight. This ensures the grant covers the marginal costs of interdisciplinary collaboration.
