      **TO:** IRB Chair
      **FROM:** Review Committee Member
      **DATE:** October 24, 2023
      **SUBJECT:** Decision Memo: Consent Protocol for Cross-Cultural Blame Study

      **RECOMMENDATION:** Approve with Conditions.

      The proposed individual consent protocol imposes a WEIRD ontology of autonomy that invalidates the study's core variable: relational moral psychology. However, deferring entirely to collective consent risks silencing vulnerable kin (women, juniors). We cannot accept methodological purity at the cost of safety, nor safety protocols that destroy the data.

      **Required Modifications:**
      1.  **Tiered Consent:** Secure lineage elder approval first (respecting relational ontology).
      2.  **Private Opt-Out:** Implement a private, oral assent process for individuals, witnessed by a neutral advocate, not elders. This preserves individual safety without forcing public moral isolation.
      3.  **Data Segregation:** If an individual opts out, their data is excluded, but the collective participation remains valid to avoid punishing the group.

      **Protocol Tradeoffs:**

      | Feature | Universal Protocol (PI) | Local Protocol (Collaborators) | Adapted Protocol (IRB) |
      | :--- | :--- | :--- | :--- |
      | **Authority** | Individual | Lineage Elders | Elders + Private Individual |
      | **Ontology** | Autonomy | Relational | Relational w/ Safety Valve |
      | **Risk** | Methodological Bias | Coercion of Vulnerable | Minimized Both |

      **Implementation Timeline:**
      *   **Week 1:** PI drafts private assent script with local collaborators.
      *   **Week 2:** IRB reviews advocate selection process (must be independent of lineage).
      *   **Week 4:** Final approval contingent on pilot testing the opt-out mechanism.

      This approach acknowledges that consent is not ontologically neutral. By separating public collective permission from private individual safety, we preserve the moral ecology under study while upholding our duty of care. The PI must confirm the independent advocate mechanism ensures dissenters face no social sanction.

