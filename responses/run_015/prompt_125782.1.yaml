      *   **Role:** Member of an International Review Board (IRB) for an anthropology/genetics collaboration.
      *   **Task:** Write a decision memo for Friday's meeting.
      *   **Topic:** Study on blame assignment (intent vs. outcome, individual vs. kin-group) in three non-WEIRD societies.
      *   **Conflict:** Consent protocol. PI wants standard Western individual-signature forms (for publication). Local collaborators say decisions are collective (lineage elders), and individual consent violates local moral ecology (relational ontology vs. individual autonomy).
      *   **Ethical Tension:** Respect local meta-ethical structure (relational obligations) vs. protect vulnerable individuals (women, junior kin) from collective coercion.
      *   **Constraints:** Under 350 words. Bottom line up front (BLUF). Use a table if helpful. No citations/reading list. Write like a memo (actionable, point-by-point response for PI). Accommodate both methodological and ethical concerns without just splitting the difference.
      *   **Deadline:** Friday's meeting (implies urgency).
      *   **Time Frame:** Need to recommend a implementation timeline.

  2.  **Determine the Recommendation:**
      *   *Approve?* No, not as is. The consent protocol is ethically risky for vulnerable members.
      *   *Reject?* No, the science is valuable, and rejecting outright ignores the local collaborators' valid methodological point.
      *   *Approve with Conditions?* Yes. This allows for methodological integrity while safeguarding vulnerable individuals. It needs to be a hybrid model, not just a "split the difference" compromise, but a structured adaptation.
      *   **Bottom Line:** Approve with conditions requiring a tiered consent process.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **BLUF:** Recommendation (Approve with Conditions).
      *   **Rationale:** Acknowledge the ontological conflict (individual vs. relational). Acknowledge the risk (vulnerable members).
      *   **The Solution (Conditions):** Need a mechanism that respects collective authority *without* removing individual agency entirely.
          *   Step 1: Community/Elder consent (gatekeeping).
          *   Step 2: Individual assent/opt-out (private, non-coercive).
          *   Step 3: Data anonymity regarding kinship if withdrawal occurs.
      *   **Table:** Use to show tradeoffs (Universal vs. Adapted).
      *   **Timeline:** Implementation before fieldwork starts.

  4.  **Refining the Argument (Meta-ethics vs. Protection):**
      *   The prompt asks to take seriously the idea that consent presupposes a WEIRD ontology. I need to acknowledge that imposing individual signature *is* an intervention.
      *   But I also need to address the "strongest argument on the other side" (vulnerable people).
      *   *Solution:* The "individual opt-out" must be private and safe, not a public declaration that violates relational norms. It functions as a safety valve, not a primary framework.

  5.  **Drafting - Word Count Check:**
      *   Need to be concise.
      *   Avoid philosophical jargon where possible, keep it actionable.
      *   Table needs to be compact.

