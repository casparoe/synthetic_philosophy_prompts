  Your hypothesis is half-right: the factual disagreement about predictors is real, but the stall stems less from defining "rational" and more from a hidden metaphysical clash over whether logical correlation counts as control, compounded by a lack of computable models for embedded self-reference.

  The CDT camp isn't merely denying predictors exist; they concede predictors might be accurate but insist your *choice* doesn't cause that accuracy. They view the correlation as a common-cause artifact (the predictor saw what you *would* do), not a causal channel. To them, FDT confuses "being the type of agent who gets predicted" with "making the prediction happen." The FDT camp counters that in embedded contexts, you *are* the algorithm; changing your decision procedure changes the prediction. This isn't verbal; it's a disagreement about the topology of agency. CDT assumes a boundary between agent and environment that embedding dissolves.

  The verbal layer ("rationality") exacerbates this. CDT defines rationality as procedural correctness (maximizing EU given causal links); FDT defines it as outcome success (maximizing EU across logical links). You can't bridge this by checking predictor accuracy, because CDT admits accurate predictors exist but denies you control over them. Your "predictor gap" hypothesis misses that the CDT side doesn't need the gap to be wide to win; they just need the lever of control to be absent.

  The hidden formal question you suspected is the real blocker: can an embedded agent maintain a true model of an environment that contains itself? FDT requires treating your own decision as a logical variable other systems depend on, but this risks infinite regress or Gödelian inconsistency. CDT avoids this by cutting the loop: "I model the world, but my action is an external intervention." The stall persists because neither side has a computable theory of closed-loop self-modeling that doesn't explode.

  Progress requires formalizing "logical control" without assuming logical omniscience. Can we model an agent that knows its source code is predictable without knowing its own output yet? If not, FDT is computationally impossible, validating CDT pragmatically. Alternatively, empirical work showing whether RL agents in multi-agent environments converge to CDT or FDT behaviors would settle the "what works" question, bypassing the normative stalemate. Specifically, test if agents trained with self-play in transparent environments develop updateless behaviors spontaneously.

