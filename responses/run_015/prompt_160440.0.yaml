answer: |-
  This is one phenomenon, not two. It does not have a single canonical name in law or philosophy, though its components are well-documented in post-colonial critique and heritage ethics. For your purposes, the cleanest label is **The Alibi of Irreversibility**.

  It is a single strategic posture with two tactical modes. The posture is the claim that the **Museum is the only viable context**. The two modes are **Ontological Opportunism** (the switch between continuity and rupture) and **Constitutive Harm** (the injury that justifies retention).

  Here is the shape of it, how the pieces connect, and where the edges lie.

  ### 1. The Core Shape: The Alibi of Irreversibility

  The argument rests on a specific view of time and value. It posits that an object's "life" is not defined by its origin, but by its survival and visibility. Once the object is removed, a new timeline begins. The argument claims that returning the object would not be a *restoration* of the old timeline, but a *destruction* of the new one.

  The "Alibi" is this: *We cannot undo the past, so we must optimize the present.*
  The "Irreversibility" is this: *The past was undone by us, making the present the only option.*

  This is not hypocrisy in the mind of the proponent because it relies on a **Hierarchy of Values** that remains constant even when the facts shift. The constant value is **Preservation and Access**.
  *   When **Preservation** is threatened (by return to a risky environment), they argue for **Continuity** (it has a life here).
  *   When **Access** is threatened (by claims of specific ownership), they argue for **Rupture** (it has no home there).

  The consistency lies not in the facts (which change), but in the priority (the Museum as the ultimate guardian).

  ### 2. The Two Modes and Their Connection

  You identified two moves. They are not separate; they are the lock and key of the same mechanism.

  **Mode A: Ontological Opportunism (The Continuity/Rupture Switch)**
  *   **The Move:** Defining the object's identity based on what serves the holder.
  *   **The Logic:** The object is a "World Citizen" when that prevents return (Continuity). The object is an "Orphan" when that prevents return (Rupture).
  *   **The Consistency:** To the curator, this isn't switching sides; it is recognizing different facets of the object's "biography." They see the object as having *accumulated* history. To ignore the museum years is to deny the object's recent reality. To ignore the origin years is to deny the object's functional death. They claim to be honoring the *whole* biography, which happens to end in their gallery.

  **Mode B: Constitutive Harm (The Injury that Cures Itself)**
  *   **The Move:** Using the destruction of the original context as proof that the original context is irrelevant.
  *   **The Logic:** "We broke the temple, so the temple cannot house the statue. Therefore, the museum must house the statue."
  *   **The Connection:** Mode B creates the vacuum that Mode A fills. The harm (Mode B) destroys the rival claim (the original context). The Opportunism (Mode A) then steps into that vacuum and claims the object is now "free" or "universal."
  *   **Why it feels like a paradox:** Because the *cause* of the necessity (the theft) is the same as the *justification* for the necessity (the displacement).

  ### 3. Writing the Curator: The "Stewardship Pivot"

  To write the curator without caricature, you must give them a principle that is higher than "possession." That principle is **Stewardship**.

  The curator does not argue "We stole it, so we keep it." They argue: **"We saved it from oblivion, so we must keep it from vanishing again."**

  Their internal consistency relies on the belief that **Context is Mutable, but Existence is Absolute.**
  *   They believe the original cult *is* dead (Rupture). This is a factual claim they stand by.
  *   They believe the object's *meaning* has evolved into "Art/History" (Continuity). This is a cultural claim they stand by.
  *   They believe returning it would be an act of **Nostalgic Violence**—forcing a modern object into a dead past, thereby killing its current life.

  **The Strong Form of the Argument:**
  "Do not mistake custody for ownership. We do not own this head; history does. We are merely the current editors of its story. To send it back is to tear out the last hundred pages of its biography because you dislike the first chapter. The first chapter was written in blood, yes. But the book exists now. Would you burn the book to punish the author?"

  This allows the curator to acknowledge the theft (the blood) while insisting on the retention (the book). It makes the harm tragic but *instrumental* to the object's survival.

  ### 4. The Boundary Cases

  You asked where the edges lie. This is where the argument fractures.

  **Case 1: The Context Vanished Regardless (Iconoclasm, Decay)**
  *   *Effect:* **Strengthens the Curator.**
  *   *Why:* It removes the "Constitutive Harm." If the temple would have fallen anyway, the Museum didn't kill the context; time did. The Museum becomes a pure savior, not a beneficiary of crime. The "Alibi of Irreversibility" becomes a genuine "Argument from Necessity."
  *   *The Edge:* The claim shifts from "We fixed our mistake" to "We prevented a natural one."

  **Case 2: The Holder is a Later Purchaser (Not the Thief)**
  *   *Effect:* **Weakens the "Harm" argument, Strengthens the "Continuity" argument.**
  *   *Why:* They cannot claim they saved it from *their own* destruction. However, they can claim they are a neutral party in a dispute. They argue that returning it punishes the innocent current holder for the sins of a past holder.
  *   *The Edge:* This relies on the concept of **Good Faith Purchase**. If the novel's curator knows the provenance is bloody, this defense collapses into complicity. If they believe the market "cleans" title, they can argue they are a fresh start.

  **Case 3: A Genuine Second Community Exists (Descendants Disagree)**
  *   *Effect:* **Complicates the "Rupture" claim.**
  *   *Why:* The curator argues the original function is dead. If living descendants want it back for *new* functions (identity, healing), the "Rupture" is no longer total. The object *does* have a social use.
  *   *The Edge:* The curator must then argue that the *specific* descendants claiming it are not the legitimate heirs, or that their desire is "political" rather than "cultural." They will frame the Museum as the only *neutral* ground where all descendants can meet.

  **Case 4: The Object's Value is the Record of Theft**
  *   *Effect:* **Collapses the Argument.**
  *   *Why:* This is the critical edge. If the object's primary meaning in the museum is "Evidence of Colonial Violence," then the Museum is not preserving the *object*; it is preserving the *crime scene*.
  *   *The Collapse:** The "Continuity" claim (it has a new life) becomes an admission of guilt (its new life is being a trophy). The "Alibi of Irreversibility" fails because the irreversibility *is* the wound. Keeping it open is not stewardship; it is sadism.
  *   *The Curator's Counter:* They will argue that displaying the wound is necessary for education. "If we return it, we hide the evidence. We must keep it here to testify against our ancestors." This turns the Museum into a Courtroom.

  ### 5. Summary for the Scene

  *   **The Name:** The Alibi of Irreversibility.
  *   **The Shape:** A closed loop where the theft creates the conditions that make the theft seem necessary.
  *   **The Curator's Consistency:** They prioritize the object's *physical survival and global visibility* over its *cultural specificity and origin*. They view the object as having graduated from its origin.
  *   **The Weak Point:** When the object's presence in the museum is understood not as "preservation" but as "display of spoils." At that point, the "second life" is revealed to be parasitic on the death of the first.

  In your scene, the curator should not defend the *theft*. They should defend the *consequences*. They should treat the 1897 sack as a tragic birth pang of the object's current global significance. Their tragedy is that they love the object too much to let it go back to being a local secret. That is the strongest, most human, and most dangerous version of the argument.
