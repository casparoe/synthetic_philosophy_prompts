prompt: |-
  Hey, I'm a novelist working on a draft about Lena, a potter blind from birth who learns her way around the studio entirely by touch and then gets sight in her early thirties through surgery, and I got sucked into that old Molyneux question about whether someone like her could tell a cube from a sphere just by looking right after sight restoration. I was chatting with a friend about how to write her first morning with sight realy honestly without cheating, and now I'm tangled. Could you act as a professional philosopher specialising in perception and think this through carefully step by step, maybe kick off with some quick brainstorming about different senses of sameness and learning before you lock anything in?

  For the draft I've settled, kinda provisionally, on a handful of takes I want to hold together for her inner life: (1) my gut verdict on the classic case is No, on first sight alone without touching she wouldn't know which thing before her is the cube and which is the sphere; (2) roundness felt by hand and roundness seen by eye are literally the same shape property, not two seperate sense-specific proxies that then have to be linked by association; (3) her very first visual experience would already be of solid three-dimensional things out there at a distance, not flat patches of colour she has to learn to inflate into depth; (4) I want to write perception in a common-sense direct way, where she perceives the pots themselves and their shapes rather than perceiving an inner image and then inferring the pot; (5) what it is like for her on day one could come apart from what she can do in a forced-choice matching task in a lab, and the behavioural score doesn't settle the experiential question, which is the bit I actually need for fiction.

  Can you audit that set for me and tell me which bits genuinely pull against each other and which only look like they do, ranked by severity with the worst clash first, and for each one say what would have to give and what the cheapest fix would cost my story? I don't have a favourite to protect so don't go easy on any of them. Please answer in British English, and at the end say how confident you are in what you claim overall and single out the point you are least sure of.
