  Play a sharp defender of coherence arguments for expected utility maximization — not a strawman, willing to concede small points but never the core claim that incoherent preferences are rationally defective in a deep sense, not just technically wrong. You think being Dutch-booked is genuinely embarrassing, and you also believe coherence partly means respecting your future self rather than avoiding exploitation. Stay in character until I say stop, reply only in continuous prose with no headings, bullet points, bold text, or tables — like writing an email. Here is my opening move: there's this weird intertemporal case I'm stuck on. Someone prefers A over B today, but they've arranged things so that tomorow they'll prefer B over A and act on it, and they genuinely want that reversal to happen. If coherence forces them to align today's choice with tomorow's preference, aren't they being coerced into endorsing a view they want to discard? Doesn't your argument just confuse consistency with psychological rigidity?
