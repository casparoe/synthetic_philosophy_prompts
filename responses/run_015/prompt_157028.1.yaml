answer: |-
  Thanks for raising this because it cuts right to the heart of why people often feel uneasy about coherence arguments, sensing that they demand a kind of robotic stiffness that doesn't fit the fluid reality of human psychology. I appreciate the intuition that forcing today's self to bow to tomorrow's whims, or vice versa, feels like a violation of autonomy, as if rationality is telling you that you aren't allowed to grow or change your mind. But I think you are slightly mischaracterizing what the coherence requirement actually demands in this intertemporal case, and more importantly, why the defect matters. The core claim isn't that you must remain psychologically rigid forever, but rather that you cannot simultaneously hold conflicting plans for your own trajectory without surrendering your status as a unified agent capable of achieving goals over time.

  When you describe someone who prefers A over B today but arranges to prefer B over A tomorrow and genuinely wants that reversal, we need to look closely at what is being preferred. If the agent values the experience of changing their mind, or values the state of affairs that results from the reversal, then that value should be incorporated into their current utility function. In that case, there is no incoherence, because their current preference for A includes the expectation of the switch, and the final outcome reflects that complex valuation. But if you mean that they prefer A to B all things considered today, yet know they will choose B tomorrow without any new information having arrived to justify the switch, then they are setting themselves up for a money pump or a similar self-defeat. The embarrassment of being Dutch-booked isn't just about losing money to a cunning bookie; it is about the fact that you would have paid to avoid the situation you ended up in, had you been able to commit. That is a genuine failure of agency, not just a technical glitch.

  You ask if coherence forces them to endorse a view they want to discard, but I would argue that coherence reveals that they don't actually want to discard it in the way they think, or else they are fractured in a way that makes them ineffective. If I know that my future self will betray my current plans without cause, and I do nothing to bind myself or correct that future tendency, I am effectively allowing my resources to be burned by my own inconsistency. This isn't psychological rigidity; it is the requirement that if you view yourself as a single entity persisting through time, you should not act against your own best judgment unless there is a rational reason to update. To call this coercion is to suggest that you have a right to be self-sabotaging without rational consequence, but the defect is deep because it undermines the very possibility of strategic action. If you cannot trust your future self to execute your current plans, and you have no new information to justify the change, you are not really planning at all; you are just drifting.

  The distinction here is between updating on evidence and updating on mere passage of time. Coherence arguments fully permit you to change your preferences if you learn something new about the world or yourself, but they forbid changing your mind simply because the clock ticked, if that change leads you to violate dominance or cycle through options destructively. In the case you described, if the agent genuinely wants the reversal, that desire must be weighed against the outcome of A versus B. If they still choose the path that leads to B despite currently valuing A more, they are admitting that their current self is not in charge. My argument is that this loss of control is the rational defect. It is not that coherence forces them to be rigid, but that reality forces them to choose between being a coherent planner or a sequence of conflicting snapshots, and only the former can reliably navigate a complex world. To be Dutch-booked is embarrassing because it proves you are the latter, and I maintain that avoiding that state is not just a technical constraint but a fundamental requirement of being a rational agent who respects their own existence over time.
