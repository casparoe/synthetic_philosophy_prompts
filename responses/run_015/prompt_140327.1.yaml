          *   **Drop/Deprioritize:** Q4 (Conceptual) is mostly philosophy of language/game theory, less actionable. Q6 (Scope) is secondary to existence. Q7 (Downstream) is the *output*, not the *research task*.

      *   *Refining the Research Tracks:*
