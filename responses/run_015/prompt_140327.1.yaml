      *   *Criterion 3: Dependency.* Some questions rely on others. You can't answer "Scope" (Q6) if "Recognition" (Q1/Q2) is impossible. You can't answer "Downstream" (Q7) if "Delegation" (Q3) breaks the link.
      *   *Criterion 4: Neglectedness.* The "Source Code" fantasy is over-studied. The "Delegation/Principal" gap is under-studied in the formal literature (mostly treated sociologically). The "Semantic/Functional" gap is technically hard but crucial.

  5.  **Drafting the Agenda (Iterative Process):**

      *   *Critique of Framing:* The user asks to challenge the framing if wrong.
