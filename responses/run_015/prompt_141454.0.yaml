  Frank's verdicts map consistently onto **Sophisticated Substantivalism** (or Metric Field Realism) combined with **Leibniz Equivalence**, not the Verificationism you suspect he might be hiding. His rule is: *Physical reality consists of the diffeomorphism-invariant structures of the metric field, independent of material observers.* This explains why he rejects absolute velocity and position (Verdicts 1 & 2, symmetries of the metric), rejects haecceitism about points (Verdict 3, Hole Argument), accepts absolute rotation (Verdict 5, the metric defines inertia), and accepts unobservable matter (Verdict 6, realism over empiricism). The infinite doubling case (Verdict 4) fits because global scaling is a symmetry of an infinite flat metric, making scale conventional in that specific context.

  On your gravitational wave case, three rules diverge:
  1.  **Strict Verificationism** (your instinct): Predicts "no fact" if no detector exists to register the strain. Frank already broke this with the horizon case, but this would confirm it.
  2.  **Machian Relationism**: Predicts "no fact" because there is no matter to relate the wave to. Frank broke this with the bucket case.
  3.  **Metric Field Realism** (Frank's rule): Predicts "there is a fact." The curvature tensor is non-zero in one model and zero in the other; this is an invariant geometric difference regardless of matter or observers. Regarding "where," Frank must say there is **no fact** about which manifold point the wave occupies (per the Hole Argument), only that the geometric structure contains a pulse.

  The compact version of the doubling story is the best follow-up to settle the underlying logic, superior to the single particle or extra matter cases. In a compact universe (like a 3-torus), global scaling is *not* a symmetry; doubling everything changes physical relations (e.g., the ratio of ruler length to the universe's circumference), making the scale empirically and physically distinct. If Frank says "no difference" here, he is inconsistent with General Relativity; if he says "there is a difference," he confirms that his "no fact" verdicts are driven by **physical symmetry** rather than **observability**. This settles your suspicion: he isn't a verificationist who cares about measurement, he is a structural realist who cares about invariance.
