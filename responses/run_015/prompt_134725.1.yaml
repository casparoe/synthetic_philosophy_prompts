  ***

  ### JURISPRUDENCE FINAL EXAMINATION
  **Question 1** (20 Marks)
  **Suggested Time:** 90 Minutes

  **The State of Automata**

  In the sovereign state of Automata, legislation is no longer drafted by humans. Instead, a central algorithm generates statutes every hour based on real-time data. These rules are enforced immediately by automated drones. The algorithm does not publish reasoning for its rules, nor does it publish the rules in advance; citizens are notified of a penalty only after the drone has applied it (retroactive enforcement). Furthermore, the rules change hourly, making long-term compliance planning impossible.

  Consider this system through the debate between H.L.A. Hart and Lon Fuller.

  1.  According to Fuller's "internal morality of law," is the Automata system law? Explain which canons are violated and whether this failure is moral or functional.
  2.  How would Hart respond? In your answer, address whether Hart views Fuller's conditions as moral prerequisites or conditions of legal existence.
  3.  Does Fuller's critique succeed only if one "smuggles" substantive morality into his procedural canons? Discuss with reference to Hart's "grudge informer" argument and the "minimum content of natural law."

  ***

  ### MODEL ANSWER

  The Automata system presents a stress test for the Hart-Fuller debate, specifically regarding whether procedural failures negate legal validity. Fuller argues that law has an "internal morality" consisting of eight canons: generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, and congruence between declared rule and official action. Automata fails spectacularly on several fronts. Retroactive penalties violate non-retroactivity. Hourly updates violate constancy. The lack of published reasoning violates congruence and clarity. For Fuller, a system that fails these canons is not simply bad law; it fails to be law at all because it cannot guide human conduct. However, Fuller insists these are moral conditions because they respect human agency. By making compliance impossible, Automata treats citizens as objects rather than agents.

  Hart would reject Fuller's conclusion. For Hart, the existence of law is a matter of social fact, specifically the union of primary and secondary rules accepted by officials. While Automata is inefficient and cruel, it could still be a legal system if the officials (or the algorithm's operators) accept the rule of recognition. Hart argues Fuller confuses efficacy with morality. A system can be legally valid but morally odious. Hart's critique suggests Fuller's canons are functional prerequisites for a system to work effectively, not moral thresholds. If Automata successfully coerces behavior through fear, it functions as law, however unjust.

  The crux of the debate is whether Fuller's proceduralism smuggles in substantive morality. Hart claims Fuller tries to derive moral value from procedural efficiency. However, Fuller might reply that respecting agency is itself a moral stance, not just a functional one. Yet, Hart's "minimum content of natural law" concedes that given human vulnerability and limited resources, any survival-oriented legal system must contain certain substantive rules (e.g., against violence). Automata ignores this, threatening survival. But Hart maintains this is based on factual truths about humans, not moral logic.

  Regarding the "grudge informer," Hart argues that after a regime falls, the correct way to punish informers is not to deny the old laws were law (as Fuller suggests), but to pass a retroactive statute punishing the informing. This preserves the separation of law and morals while achieving justice. In Automata, Hart would advise acknowledging the system was law, however terrible, and legislating a remedy post-hoc. Fuller would argue this legitimizes tyranny. Ultimately, Fuller's critique succeeds only if one accepts that procedural respect for agency is inherently moral. Hart separates the two: Automata is law (existence), but it lacks moral authority (merit). Fuller collapses the distinction, arguing that without the internal morality, the system lacks the essential nature of law.

  ***

  ### MARKING SCHEME (20 MARKS TOTAL)

  **Part 1: Fuller's Application (6 Marks)**
  *   **2 Marks:** Identifies specific violated canons (Retroactivity, Constancy, Congruence/Publicity).
  *   **2 Marks:** Explains Fuller's view that failure = not law (or fundamentally defective).
  *   **2 Marks:** Correctly identifies Fuller's claim that these are *moral* conditions (respect for agency), not just technical ones.
  *   *Deduction:* -2 Marks if student treats Fuller's canons as substantive natural law (e.g., "laws must be holy" or "divine"). Fuller is procedural.

  **Part 2: Hart's Response & Existence vs. Morality (8 Marks)**
  *   **3 Marks:** Correctly states Hart's view: Law is a social fact (rule of recognition), distinct from moral merit.
  *   **3 Marks:** **Key A-Grade Move:** Identifies that Hart views Fuller's conditions as conditions of *efficacy* or *existence*, not moral prerequisites. (e.g., "Retroactivity kills efficacy, not morality").
  *   **2 Marks:** Explains Hart's "Minimum Content of Natural Law" as based on human vulnerability/fact, not moral logic, and applies it to Automata's threat to survival.
  *   *Deduction:* -3 Marks if student confuses Hart with Dworkin (e.g., mentions "integrity" or "interpretivism").

  **Part 3: The "Smuggling" Critique & Grudge Informer (6 Marks)**
  *   **3 Marks:** **Key A-Grade Move:** Addresses whether Fuller smuggles morality in. (Answer: Fuller argues procedure *is* moral; Hart argues it's functional).
  *   **3 Marks:** Correctly applies the "Grudge Informer" solution. Hart prefers retroactive punishment statute; Fuller prefers denying legal validity of the old regime.
  *   *Deduction:* -2 Marks if student argues Hart supports retroactive punishment generally (he only supports it as a tragic necessity to punish informers, distinguishing it from the regime's retroactivity).
  *   *Deduction:* -2 Marks if student claims Hart agrees with Fuller that Automata is "not law."

  **General Penalties**
  *   **-1 Mark:** For every unnecessary citation or case name (Closed Book violation).
  *   **-2 Marks:** Poor structure or unreadable handwriting.
  *   **0 Marks:** Entire answer if student argues only from personal moral opinion without referencing Hart/Fuller theories.
