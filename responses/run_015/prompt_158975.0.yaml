answer: |-
  Here is a specification for a theory of valid consent, drafted to handle the friction between your bouldering group's practical needs and the moral weight of the medical form you signed.

  This list treats consent not as a single switch, but as a mechanism that must satisfy several distinct constraints to function. For each desideratum, I have indicated whether it is **Non-negotiable** (a theory fails if it ignores this) or **Contingent** (a theory can adjust this based on context, e.g., medical vs. recreational).

  ### 1. The Specificity Constraint (Scope)
  **The Requirement:** Consent must attach to a description of the act that is sufficiently detailed to distinguish it from other acts the agent might not permit.
  **The Case:** This addresses your **Blanket Consent** sticking point (1). A form saying "I agree to whatever the leader decides" attempts to consent to a *process of decision-making* rather than a set of *risks*.
  **Verdict:** **Non-negotiable**, but scalable. You cannot consent to "anything". However, the granularity required depends on the stakes. In bouldering, "climbing this grade on these holds" is specific enough; in surgery, "operating on this limb" is not.
  **Why it matters:** If a theory allows consent to be infinitely vague, it permits slavery disguised as agreement. Your season form likely fails this because it transfers *authority*, not just accepts *risk*.

  ### 2. The Continuity Constraint (Drift)
  **The Requirement:** Consent must be treatable as a state that can be revoked or invalidated if the nature of the activity changes materially over time, even without a specific lie being told.
  **The Case:** This addresses **Drift** (2). If you agree to A, and through twenty small steps you end up at Z, and Z is materially different from A, the original consent does not cover Z.
  **Verdict:** **Non-negotiable.** Drift is not necessarily deception (no lie was told), nor is it always coercion. It is a failure of *temporal validity*. A theory that treats consent as a one-off timestamped event fails here.
  **Why it matters:** This distinguishes consent from a contract. Contracts bind you to the outcome; consent binds you to the activity *as described*. If the activity mutates, the consent evaporates.

  ### 3. The Agency Constraint (Borrowing)
  **The Requirement:** Consent cannot be validly transmitted by a third party unless the agent has explicitly authorised that third party to make *that specific decision*.
  **The Case:** This addresses **Borrowed Consent** (3). "She's fine with it" is invalid unless "she" previously designated the speaker as a proxy for that context.
  **Verdict:** **Non-negotiable.** Autonomy is non-transferable by default.
  **Why it matters:** This kills the idea of "implied consent" via social proximity. Your mate cannot consent for you to a climb just because he knows you well, unless you previously agreed he could decide for you.

  ### 4. The Exit Cost Constraint (Voluntariness)
  **The Requirement:** For consent to be valid, the cost of saying 'no' must not be manipulated to be prohibitively high by the person seeking consent.
  **The Case:** This addresses **Sunk Cost** (4) and your **Medical Form** experience. If you are halfway through a painful procedure, or socially embedded in a group chat, and the cost of stopping is shame, financial loss, or physical danger created by the stoppage itself, voluntariness is compromised.
  **Verdict:** **Non-negotiable.** This is the heavy lifter. It distinguishes pressure from coercion.
  **Why it matters:** This is where your medical form likely felt "off". If the system is designed such that refusing feels "silly" or disruptive, the Exit Cost has been artificially inflated. A theory that ignores the *context of the refusal* is useless.

  ### 5. The Outcome Independence Constraint (Regret)
  **The Requirement:** The validity of consent is not retroactively negated by a bad outcome or the agent's subsequent regret, provided the previous constraints were met.
  **The Case:** This addresses **Competent but Regrettable Consent** (5). If you are competent and informed, but you make a poor choice that you later regret, the consent was still valid.
  **Verdict:** **Non-negotiable.**
  **Why it matters:** This protects autonomy from paternalism. If regret invalidated consent, no one could ever take a risk. However, *evidence* of regret can sometimes signal that Constraint 1 (Specificity) or 4 (Exit Cost) was violated at the time.

  ### 6. The Manifestation Constraint (Observability)
  **The Requirement:** Consent must be communicable to the receiver through words or actions that a reasonable person would interpret as agreement.
  **The Case:** This addresses your **Organiser's Worry** (6). You need to know if you have consent without reading minds.
  **Verdict:** **Contingent.** This is where the **Dual-Job Tension** bites.
  *   *Moral Job:* Internally, I can consent in my head.
  *   *Institutional Job:* Externally, you need a signature or a verbal "yes".
  **Why it matters:** You asked if this is smuggling in a legal worry. **Yes, it is.** Morally, internal consent is what matters. Practically, you cannot operate a group without Manifestation. A theory of *moral* consent doesn't strictly need this; a theory of *permission to act* does.

  ### 7. The Materiality Constraint (Information)
  **The Requirement:** The agent must understand the *material* risks, not *all* risks.
  **The Case:** This addresses your **Hunch** about being "fully informed".
  **Verdict:** **Contingent.** Your hunch is correct. "Fully informed" is a prejudice.
  **Why it matters:** Requiring total information makes consent impossible (you can't know every variable). The standard must be: "Would knowing X have changed the decision?" If yes, X is material. If no, ignorance of X does not invalidate consent.

  ***

  ### Internal Tensions and Incompatibilities

  There is one pair of requirements that creates a structural friction you cannot fully resolve, only manage:

  **The Tension: Specificity (D1) vs. Manifestation (D6)**
  *   **The Conflict:** To satisfy **Specificity**, consent needs to be detailed and nuanced (covering drift, specific risks, specific acts). To satisfy **Manifestation** (especially for an informal group organiser), consent needs to be clear, quick, and observable (a tick box, a verbal "yes").
  *   **The Incompatibility:** You cannot have a consent process that is perfectly specific to every future contingency *and* easily observable/administrable in a casual setting. The more specific you make the form to protect the climbers (D1), the less likely they are to read it, undermining the Information constraint (D7). The simpler you make it for the organiser (D6), the more likely it violates Specificity (D1).
  *   **Resolution:** You must prioritise based on risk. High risk (surgery) demands D1 over D6. Low risk (bouldering amongst friends) allows D6 to dominate, *provided* D4 (Exit Cost) remains low.

  ### The Dual-Job Tension (Moral vs. Institutional)

  You asked for a theory that works for **ordinary life** and **signed forms**. These pull in opposite directions on **The Manifestation Constraint (D6)**.

  *   **In Ordinary Life:** Consent is a mental state communicated loosely. If I help you lift a heavy box, my grunt is consent. A theory that demands a signature here is absurd.
  *   **For Signed Forms:** Consent is a liability shield. The form is not primarily for *your* protection; it is for the *organiser's* evidence.
  *   **The Conflict:** A signed form can satisfy D6 (Observability) while violating D4 (Exit Cost - e.g., "sign this or you can't climb"). In ordinary life, that would invalidate the consent. In an institutional setting, the signature often stands regardless.
  *   **Honest Assessment:** If you are using the form to change what is *permitted* (legal/institutional job), D6 is king. If you are using it to work out what you *owe* people (moral job), D4 is king. Your bouldering form currently prioritises the institutional job (protecting the leader) over the moral job (ensuring voluntary agreement).

  ***

  ### Scoring the General Pictures

  *   **Contractualism:** (Consent is a promise). **Fails D2 (Drift).** Contracts bind you to the outcome even if things change. Consent should not.
  *   **Pure Autonomy:** (Consent is whatever I think in my head). **Fails D6 (Observability).** Makes organising group activities impossible as you cannot know if you have permission.
  *   **Communication Theory:** (Consent is a successful signal). **Passes most, but risks failing D4.** You can communicate consent under duress (e.g., handing over a wallet at knifepoint is a signal, but not valid consent).

  ### The Knockout Requirement

  Most candidate theories stumble on the **Exit Cost Constraint (D4)**.

  Many theories focus heavily on Information (D7) or Competence (D5). They assume that if you know the risks and are sane, your consent is valid. This is false. You can be fully informed, perfectly sane, and still consent under coercion or undue pressure (like your medical form experience where refusing felt "silly").

  Theories that ignore the *context of the refusal*—the social, financial, or physical cost of saying 'no'—cannot distinguish between a free agreement and a submission to necessity. This is the filter that invalidates your bouldering waiver if the group dynamic makes opting out socially impossible, and it invalidates the medical form if the procedure had already begun before you were asked.

  Verdict: The Exit Cost Constraint is the single requirement that does the most real work.
