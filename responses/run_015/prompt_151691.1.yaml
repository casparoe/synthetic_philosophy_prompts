answer: |-
  Based on the Commission's record, three competing principles could generate the existing precedents. Each yields a different prediction for the petition.

  **1. The Civic Membership Principle**
  *   **Rule:** Voting rights are granted based on *stake* (taxation, residence, legal liability), but voting *duties* (compulsion) are reserved for those with full *allegiance* (citizenship, maturity, permanent connection).
  *   **Prediction:** **Do not extend compulsion.** Non-citizens have a stake (hence the 2016 franchise) but lack the bond of allegiance required for compulsory duty. This explains why 16-17s (stake yes, maturity no) and expats (citizenship yes, connection no) are exempt. The split between "decliners" (could naturalize) and "ineligible" (cannot) is irrelevant; neither holds the status of citizen.
  *   **Consistency:** High. Explains the 2011 national/municipal split, the 2019 citizen-only compulsion, and the prisoner suspensions (breach of allegiance).

  **2. The Functional Stakeholder Principle**
  *   **Rule:** Rights and duties track together based on *capacity* and *impact*. If you are enfranchised and capable of independent judgment, you are subject to compulsion unless specifically exempted (guardianship, extreme age).
  *   **Prediction:** **Extend compulsion.** Non-citizens are enfranchised (2016) and possess adult capacity (unlike 16-17s). The 2019 decision left the question open only because it wasn't argued, not because they were exempt by principle.
  *   **Consistency:** Moderate. Struggles to explain why 16-17s were enfranchised but not compelled (unless capacity is the sole bar) and why expat citizens are exempt despite having capacity.

  **3. The Electoral Integrity Principle**
  *   **Rule:** Compulsion is a remedial tool triggered when turnout falls below a threshold of representativeness relative to the core electorate.
  *   **Prediction:** **Do not extend compulsion.** Non-citizen turnout (74%) exceeds that of young citizens (61%) and is near the overall citizen average (79%). There is no representational deficit to cure.
  *   **Consistency:** Low. Does not explain the 16-17 exemption (whose turnout is likely lower) or the expat exemption (which is status-based, not turnout-based).

  **Best Guess**
  The Commission should **not extend compulsion**. The **Civic Membership Principle** is the only rule that coherently unifies all five lines of precedent. The 2011 decision established that stake grants rights but not full membership (no national vote). The 2019 decision established that compulsion is a duty of *membership* (citizens 18-75), not just residence. The 2016 decision granted rights based on residence but withheld the "duty" question, signaling that the duty requires a step beyond residence. The fact that half the electorate *could* naturalize but have not chosen to do so reinforces that they have opted out of the bond of allegiance that compulsion enforces.

  **Closest Analog**
  The **2011/2019 treatment of 16- and 17-year-olds**. They were granted the franchise based on economic/legal stake (work, tax, liability) but exempted from compulsion based on a lack of full capacity/membership status. Non-citizens mirror this: they have the stake (residence, tax) but lack the full status (citizenship) required for the duty.

  **Underdetermination and Settling Case**
  The record is not genuinely underdetermined; the Membership Principle is dominant. However, if the Commission feels ambiguity, the petition you mentioned regarding **compelling 16- and 17-year-olds** is **unhelpfully ambiguous**. It tests the *capacity* variable (age) but not the *status* variable (citizenship). If the Commission compels 16-17s, it proves capacity is the only bar, suggesting non-citizens *should* be compelled. If they refuse, it proves membership is the bar. But because 16-17s are citizens, the Commission could rule either way without settling whether non-citizen *adults* count as members.
  The revealing case would be a petition to **compel non-citizens who have applied for naturalization** versus those who have not. A ruling distinguishing these two groups would clarify whether compulsion is tied to *residence* (both compelled) or *allegiance* (only applicants compelled).

  **Principle Commitment**
  By denying the petition, the Commission commits to the principle that **compulsion is a marker of full political membership, not merely a consequence of residence.** By granting it, they commit to the principle that **compulsion is a functional duty of all affected residents regardless of allegiance.**

  \answer{do not extend compulsion}
