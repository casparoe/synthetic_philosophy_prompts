  **Final Model Answer (Targeting ~700 words)**

  The three theories are not genuine rivals; they are compatible descriptions of different functional components within a single system, much like the engineer's measurement analogy. The dispute is largely verbal, arising from each theory mistaking a necessary part for the whole. To see this, we must distinguish the **ontological** claim (what an emotion *is*) from the functional role (what it *does*). If we treat emotion as a process rather than a static object, the theories map onto different stages of that process.

  First, consider **recalcitrance** (fear of flying despite judging it safe). The Judgement Theory (emotions are claims about the world) struggles here, as it implies a contradiction in the agent's mind: believing *p* and *not-p* simultaneously. This is irrational. However, if we view emotion as a perceptual readout (like a warning light) and judgement as a verified report, the conflict dissolves. The system tracks danger (perception) even if the user overrides the verdict (judgement). The Feeling Theory (emotions are bodily states) handles this easily: the body reacts regardless of the mind's claim. Thus, recalcitrance shows that emotion is not identical to judgement, but it does not rule out judgement being a downstream effect. The embarrassment for the Judgement Theory is only fatal if it insists emotion *is* the verdict, rather than input to the verdict.

  Second, **mis-calibration** (fear of feature F, now safe). Here, the Feeling Theory is embarrassed. If emotion is just a feeling, feelings cannot be "wrong," only present. A stomach churn is not false. The Judgement and Perception theories handle this better because they involve **correctness conditions** (standards for being right or wrong). A measurement can be uncalibrated; a mere sensation cannot. Therefore, emotion must have a perceptual or quasi-judgemental element that tracks external reality, not just internal sensation. The misfire is about danger; the response is incorrect because the tracking relation is broken. This suggests that while feelings are part of the mechanism, they are not the whole story; the tracking function is essential for normativity.

  Third, **dissociation**. Subject P (behavior without feeling) lacks the "readout." Subject Q (feeling without object) lacks the "tracking." The Judgement Theory denies P has emotions, as no conceptual claim is made. The Feeling Theory denies Q has emotions, as the feeling is not tied to an object. A functional view says P has a broken readout, Q has a misfiring sensor. Neither has a fully functional emotion, but both have fragments. This suggests that "emotion" is a cluster concept requiring both tracking and feeling for the paradigm case, but allowing edge cases. P is emotionally blind; Q is emotionally hallucinating.

  This leads to non-conceptual creatures (rats). The Judgement Theory excludes them, as it requires **propositional content** (statements that can be true/false). This is too restrictive. Rats track danger and adjust behavior without human concepts. Therefore, the indispensable element of emotion is the tracking/perceptual function, not the judgement. The dispute is verbal: "Emotion" names the whole loop, but theories argue over which wire is the signal. We should accept a pluralist view: emotions are perceptual tracking mechanisms that produce feelings and invite judgements. The measurement analogy clarifies that we need all four stages (tracking, physical change, readout, verdict) to explain the data, so no single theory captures the whole phenomenon. The Judgement Theory describes the verdict; the Feeling Theory describes the physical change; the Perception Theory describes the readout. Recognizing this dissolves the rivalry.

