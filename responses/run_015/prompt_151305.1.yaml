answer: |-
  **MEMORANDUM**

  **TO:** Faculty Steering Committee, Institute for Civic Character
  **FROM:** Curriculum Review Board, University Senate
  **DATE:** October 26, 2023
  **SUBJECT:** Formal Opinion on Proposal 24-C: *Parallel Exemplars* Digital Archive

  **I. DECISION**

  The Curriculum Review Board has completed its evaluation of the faculty proposal to adopt *Parallel Exemplars* as the core pedagogical resource for the Institute for Civic Character. The proposal seeks to utilize a digital archive pairing contemporary public figures with ancient counterparts, structured strictly as hagiography to maximize aspirational impact.

  After deliberation, the Board issues a recommendation of **Approval with Binding Structural Conditions**. The Board finds the project's intent—to recover the language of virtue and emulation in civic education—aligned with the Institute's mission. However, in its current form, the exclusive reliance on hagiography presents an untenable philosophical and pedagogical risk for a public university context. The archive may be adopted only upon the implementation of the structural modifications and pedagogical mandates detailed in Section III of this opinion.

  **II. PHILOSOPHICAL ASSESSMENT**

  The central tension in this proposal concerns the mechanism of moral learning. Proponents argue that moral improvement requires a vision of unblemished virtue. They contend that exposing the "seams" of a biography—the failures, hypocrisies, and private vices of the exemplar—provides the student with an exit ramp for their own moral exertions. If the hero is flawed, the student reasons, then flaw is permissible. By stripping away vice, the *Parallel Exemplars* project aims to create a state of "aspirational proximity," where the student is drawn upward by the gravitational pull of perfection.

  The Board acknowledges the strength of this position. There is a distinct pedagogical danger in cynicism. A curriculum that focuses exclusively on deconstruction, critical flaw-finding, and the "humanizing" of leaders can inadvertently teach students that greatness is a myth and that all action is compromised. Pure hagiography possesses an emotional force that critical biography often lacks. It appeals to the sublime rather than the analytical. To feel awe is a prerequisite for wanting to become the object of that awe. If the Institute's goal is to spark the initial desire for civic goodness, the hagiographic approach offers a potent, perhaps unmatched, ignition source.

  However, the Board concurs with the opposition's concern regarding "moral distancing." When an exemplar is presented as flawless, they cease to be a model for imitation and become an object of worship. A public university education must cultivate citizens capable of critical judgment, not devotees capable only of reverence. If a student perceives the gap between their own humanity and the archive's perfection as unbridgeable, the result is not emulation but resignation. Furthermore, Plutarch's own *Parallel Lives* were not hagiographies; they were comparative analyses that frequently illuminated how specific virtues, when untethered from prudence or moderation, could lead to ruin. To claim Plutarchian lineage for a strictly positive archive is to misread the source material. Civic character requires the ability to navigate complexity, not merely to admire simplicity.

  Therefore, the Board determines that while the *spark* of hagiography is valuable, it cannot constitute the *fuel* of the curriculum. The archive must be redesigned to ensure that the movement from awe to action is bridged by critical understanding.

  **III. BINDING STRUCTURAL CONDITIONS**

  To mitigate the risk of moral distancing while preserving the aspirational power of the resource, the Institute must implement the following changes to the archive's design and classroom deployment. These conditions are mandatory for the release of funding and curricular certification.

  **1. Mandatory Antiparallel Pairings (The "Shadow Archive")**
  The digital interface must not allow for the isolation of the hagiographic entry. For every "Exemplar Entry" (the strictly positive biography), there must be a linked "Critical Companion." This is not merely a footnote section, but a distinct, structured narrative of equal weight.
  *   **Design Requirement:** Upon opening a profile (e.g., "Marcus Aurelius / Contemporary Statesman A"), the user must be presented with the hagiographic narrative first to preserve the initial emotional impact. However, a prominent toggle labeled "Historical & Ethical Context" must be visible.
  *   **Content Requirement:** The Critical Companion must not seek to debunk the virtue, but to contextualize the cost. It must detail the failures, compromises, or vices associated with the figure that were omitted from the primary text. It must answer the question: *What was the price of this virtue, and where did it fail to protect the individual?* This ensures the student sees the virtue as a tool to be wielded, not a magical shield.

  **2. The "Gap Analysis" Pedagogical Framework**
  Instructors utilizing *Parallel Exemplars* are prohibited from assigning the archive as standalone reading. Syllabi must include a mandatory "Gap Analysis" module for every case study.
  *   **Rule:** Students must submit a brief reflection identifying the specific distance between the hagiographic portrayal and the critical reality.
  *   **Objective:** The assignment must ask the student to determine if the omission of the flaw changes the moral value of the act. For example, if a leader displayed courage but was motivated by vanity (revealed only in the Critical Companion), does the courage remain emulatable? This forces the student to separate the *act* from the *agent*, preventing the "all or nothing" thinking that leads to moral distancing.

  **3. Prohibition of Normative Closure**
  The archive's code must prevent the presentation of the exemplar as a "finished" moral product.
  *   **Design Requirement:** No entry may conclude with a summary statement declaring the figure "virtuous" or "successful." All entries must end with an open-ended inquiry prompt regarding the replicability of the actions in a different context.
  *   **Rationale:** This prevents the archive from functioning as a catechism. It ensures that the student remains an active evaluator of character rather than a passive recipient of moral verdicts.

  **IV. IMPLEMENTATION AND REVIEW**

  The Board recognizes that these conditions alter the fundamental architecture of the proposed resource. The faculty team argued that introducing critical counter-narratives dilutes the emotional resonance necessary for aspiration. The Board accepts that some dilution will occur, but judges this necessary to maintain academic integrity. The goal of the Institute is Civic Character, which implies the capacity to govern oneself and participate in a pluralistic society. This requires a resilience that hagiography cannot build.

  The Board recommends a pilot phase for the redesigned archive. During the first academic year of deployment, the Institute must collect data on student engagement, specifically measuring whether the "Critical Companion" reduces the reported sense of inspiration or merely refines it. If data suggests the critical layer completely extinguishes the aspirational spark, the Board will reconvene to discuss alternative frameworks.

  **V. CONCLUSION**

  The *Parallel Exemplars* project addresses a genuine deficit in modern civic education: the lack of positive models. The Board wishes to see this project succeed. However, a public university cannot sanction a pedagogy that relies on omission. By integrating the Shadow Archive and mandating the Gap Analysis, the Institute can harness the emotional power of the ideal without sacrificing the intellectual rigor required to achieve it.

  We await the revised technical specifications and sample syllabi reflecting these conditions by the start of the next semester.

  **Signed,**

  **The Curriculum Review Board**
  **University Senate**
