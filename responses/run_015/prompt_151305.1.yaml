prompt: |-
  You sit on the curriculum review board of a public university's new Institute for Civic Character. A faculty proposal asks the institute to adopt, as its core pedagogical resource, a digital archive entitled Parallel Exemplars, pairing contemporary public figures with Plutarch-style comparative biographies of ancient counterparts. Every entry is strictly hagiographic—no critical biography, no account of vice or failure—grounded in the claim that moral learning requires aspirational proximity to perfection rather than comparison with shared human flaw. The board is split: proponents hold that Plutarch's own paired lives were designed for direct emulation; opponents contend that stripping away his comparative structure—pairing figures with parallel virtues but contrasting failures—produces not education but moral distancing, where the exemplar becomes too perfect to imitate and the reader is left with awe rather than action. Draft the board's formal opinion recommending either approval with binding structural conditions or rejection. Specify exactly what must change in the archive's design or classroom use—such as mandatory antiparallel pairings that juxtapose each hagiographic entry with a critical counter-biography, or required pedagogical framing rules—to mitigate the philosophical risk you identify. Include an honest treatment of the strongest argument for pure hagiography: that critical comparison dilutes the emotional force necessary for genuine aspiration. Do not include citations, bibliographies, or reading lists.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Curriculum Review Board of a public university's new Institute for Civic Character.
      *   **Task:** Draft a formal opinion recommending either approval (with conditions) or rejection of a faculty proposal.
      *   **Proposal:** A digital archive called *Parallel Exemplars*. It pairs contemporary public figures with ancient counterparts (Plutarch-style).
      *   **Key Constraint of Proposal:** Entries are *strictly hagiographic* (no vice/failure). Rationale: Moral learning needs aspirational proximity to perfection, not shared flaw.
      *   **The Conflict:** Proponents say Plutarch aimed for emulation. Opponents say removing the "contrast/failure" aspect creates moral distancing (too perfect to imitate).
      *   **Requirements:**
          *   Recommend approval with binding structural conditions OR rejection.
          *   Specify exact changes to design or classroom use (e.g., antiparallel pairings, framing rules).
          *   Include an honest treatment of the strongest argument for pure hagiography (emotional force/aspiration).
          *   No citations, bibliographies, or reading lists.
          *   Tone: Formal, academic, deliberative, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A (Rejection):* Easier to argue that hagiography is inherently dangerous for a public university (critical thinking, historical accuracy). However, it shuts down the project entirely.
      *   *Option B (Approval with Conditions):* More nuanced. Acknowledges the value of aspiration but mitigates the risk of "moral distancing." Fits the role of a *review board* (which usually seeks to improve curriculum rather than just kill it).
      *   *Decision:* Approval with Binding Structural Conditions. This allows for a more detailed exploration of the pedagogical requirements and demonstrates a balanced understanding of the philosophical debate.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose of the opinion, identify the proposal (*Parallel Exemplars*), and state the board's decision (Conditional Approval).
      *   **Philosophical Assessment (The "Why"):**
          *   Acknowledge the proponents' view: The power of the ideal. Pure aspiration triggers the "sublime" in ethics. If we see too much flaw, we excuse ourselves.
          *   Address the opponents' view: The risk of idolatry and distancing. If the figure is god-like, the student feels incapable. Plutarch actually included flaws (the *Parallel Lives* were comparative for a reason).
          *   Synthesis: Aspiration is necessary but insufficient. Critical engagement is required for *civic* character (which implies public reasoning, not just private devotion).
      *   **Binding Structural Conditions (The "What"):**
          *   Need to fix the "strictly hagiographic" constraint.
          *   *Condition 1: The Shadow Archive.* For every hagiographic entry, there must be a linked "Critical Companion." Not necessarily destroying the myth, but contextualizing it.
          *   *Condition 2: Pedagogical Framing.* Instructors cannot just assign the reading. They must facilitate the gap between the student and the exemplar.
          *   *Condition 3: The Failure Module.* Students must analyze *why* the flaws were omitted. Meta-cognition.
      *   **Addressing the Strongest Argument for Hagiography:**
          *   Dedicate a specific section to validating the proponents' claim. The emotional resonance of purity is real. Diluting it too much kills the inspiration. The conditions must preserve the *initial* impact of the hagiography before deconstructing it.
      *   **Conclusion:** Reiterate the commitment to the Institute's mission and the final verdict.

  4.  **Refining the Tone and Content:**
      *   *Tone:* Needs to be authoritative but collegial. Avoid bureaucratic jargon where possible, but maintain formality.
      *   *Public University Context:* Emphasize critical inquiry, pluralism, and civic engagement. Hagiography can be risky in a secular, diverse institution if presented as objective truth.
      *   *Plutarch Reference:* Ensure the understanding of Plutarch is accurate enough for the context (he did compare, but often emphasized virtue). The proposal claims Plutarch supported *direct emulation*; the board needs to nuance that.
      *   *Specific Conditions:* Make them actionable. "Mandatory antiparallel pairings" was suggested in the prompt—I should incorporate that or something similar. Let's go with "Critical Counter-Narratives" and "Contextual Framing."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Okay, we approve it but they can't just lie by omission.
      *   We need to say: Inspiration is good, but critical thinking is better for a university.
      *   Condition: Every saint needs a sinner counterpart or a "reality check" button.
      *   Condition: Teachers must teach the difference between myth and history.
      *   Acknowledge: Yes, knowing a hero failed makes us feel like we can fail too, but knowing they succeeded makes us want to try. We need both.

  6.  **Drafting - Iteration 2 (Formalizing):**
      *   *Subject:* Curriculum Review Board Opinion on Proposal 24-C (Parallel Exemplars).
      *   *Decision:* Conditional Approval.
      *   *Rationale:* The "Moral Distancing" risk is real. If a student thinks Washington never chopped a cherry tree, they learn nothing about truth. If they think he was perfect, they can't emulate him.
      *   *The Proponent's Point:* We must admit that cynicism is also a risk. If we only teach flaws, students become nihilists. The hagiographic layer provides the "spark."
      *   *The Fix:* The archive must have a toggle. View "Exemplar" then view "Human." Or, pair the ancient/modern with a specific "Vice/Failure" counterpart. Let's go with the prompt's suggestion of "antiparallel pairings."
      *   *Implementation:* Instructors must assign the "Gap Analysis."

  7.  **Final Polish (checking constraints):**
      *   No citations? Check.
      *   Honest treatment of hagiography argument? Check.
      *   Specific changes? Check.
      *   Formal opinion style? Check.

  8.  **Writing the Document:** (Proceeding to generate the response based on these thoughts.)
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm rejecting the *idea* of exemplars, just the *strictly hagiographic* delivery. The distinction is crucial. The board supports the Institute's mission but protects academic integrity.
      *   *Refining the "Plutarch" point:* The proposal claims Plutarch was for direct emulation. The board should note that Plutarch's *Parallel Lives* were comparative precisely to show how virtue operates in different contexts, often highlighting how similar virtues led to different outcomes based on character flaws. The proposal misreads Plutarch to justify hagiography. I should mention this gently.
      *   *Strengthening the Conditions:* Make them "binding." This is a public university; academic freedom matters, but curriculum standards matter too. The conditions should be on the *archive design* and the *syllabus requirements*.

  9.  **Final Review against Prompt:**
      *   Draft board's formal opinion? Yes.
      *   Recommend approval with conditions OR rejection? Yes (Approval with conditions).
      *   Specify exactly what must change? Yes (Antiparallel pairings, framing rules).
      *   Include honest treatment of strongest argument for pure hagiography? Yes.
      *   No citations/bibliographies? Yes.

