      *   *Decision:* I need to choose one to make the memo effective. Option (a) (with strict labeling) is the most interesting philosophically because it directly confronts the "original vs. copy" question in the public eye. However, Option (c) is often the safer museum practice. Let's go with a variant of **(a)**: Display the copy in the *primary* location *temporarily* while the original is repaired, with explicit labeling. This forces the philosophical engagement required by the prompt. It highlights the educational value of the copy when the original is absent.
      *   *Refinement:* Actually, a hybrid approach might be best. Acquire the copy (c) but display it in the primary location *temporarily* (like a) during the restoration year. This combines acquisition security with the display need. Let's recommend **acquiring the copy and displaying it in the primary gallery location for the duration of the original's restoration, with explicit labeling.** This addresses the immediate need and the long-term collection value.

  3.  **Drafting - Section by Section:**

