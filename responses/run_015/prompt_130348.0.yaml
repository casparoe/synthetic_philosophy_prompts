      *   This is a classic problem in population ethics. It touches on the difference between "Person-Affecting Views" (morality is about how we treat specific individuals) and "Impersonal Views" (morality is about maximizing good states of affairs, regardless of who experiences them).
      *   The user's friend brings up the "Farm Animal" reductio ad absurdum. If the user's logic (maximize happy beings) holds, we should breed infinite happy cows. The friend thinks this proves the user is wrong. I need to explain why the asymmetry actually *avoids* this conclusion.

  2.  **Determine the Philosophical Stance:**
      *   As a philosopher specializing in this, I generally defend the Asymmetry (often associated with David Benatar or Jan Narveson).
      *   Key distinction: There is a difference between "making people happy" (a duty to existing people) and "making happy people" (no duty to potential people).
      *   I need to explain this without using heavy terms like "Non-Identity Problem" or "Total Utilitarianism" unless I define them simply.

  3.  **Address the "Obligation to Reproduce" (The User's Sticking Point):**
      *   Why isn't there a duty to create happy kids?
      *   Reason: Duties are owed *to* someone. A non-existent child cannot claim you owed them existence.
      *   Analogy: You don't owe a gift to a guest who wasn't invited.
      *   Creating a happy person is *good* (permissible), but not *required* (obligatory). It's "supererogatory" (good to do, but okay not to).

  4.  **Address the Farm Animal Analogy:**
      *   The friend says: "If you value happiness, you must breed happy cows."
      *   My counter: The asymmetry applies to animals too. We shouldn't create suffering cows (factory farming), but we aren't required to create happy cows.
      *   The friend's argument assumes an "Impersonal View" (Happiness is a substance we must maximize). The Asymmetry assumes a "Person-Affecting View" (Morality is about the welfare of subjects).
