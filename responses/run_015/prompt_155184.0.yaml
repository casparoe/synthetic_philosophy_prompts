      *   *Conclusion:* A summary verdict.

      *(Self-Correction during drafting)*: I need to be careful not to take sides too heavily. The prompt asks "who's right about each specific point." I should frame this as "Jake is empirically stronger here," "Maria is morally stronger here." I need to make sure I use American English spelling and idioms (e.g., "referee," "scorecard," "bottom line").

      *Refining the "Legitimacy" definition:* This is the crux. Jake uses *sociological* legitimacy (people believe it). Maria uses *normative* legitimacy (it is morally right). I must highlight this distinction clearly.

