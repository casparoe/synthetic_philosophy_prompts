      *   **Context:** A post-history class debate between two friends (Jake and Maria) about political legitimacy, specifically focusing on "performance legitimacy" (prosperity/order vs. democracy/rights), using Singapore and China as case studies.
      *   **Task:** Act as a referee. Go through their exchange move-by-move. Evaluate who is "right" about each specific point (acknowledging that philosophy rarely has binary right/wrong answers). Identify what both might be missing.
