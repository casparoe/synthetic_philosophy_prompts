          *   Example: Singapore (high homeownership, low crime, "iron fist," acceptance).
          *   Concept: Performance Legitimacy.
          *   Evaluation: Jake is describing a real political science concept. It's empirically observable that some regimes gain support through results. However, "legitimacy" is normative (ought) vs. descriptive (is). Just because people *accept* it doesn't mean it's morally *right*.
      *   *Move 2: Maria's Counter (Modernization Theory/Inherent Rights).*
          *   Claim: It's authoritarianism with marketing. Prosperity creates demand for say (Modernization Theory).
          *   Concept: Inherent rights to self-rule.
          *   Evaluation: Maria hits on the "Inglehart-Welzel Cultural Map" idea (post-materialist values). She also introduces a deontological argument (rights are inherent, not earned).
      *   *Move 3: Jake's Rebuttal (Time-Bound Legitimacy/Evolution).*
          *   Claim: Legitimacy can be time-bound. Emergency gov logic. Politics evolves.
          *   Evaluation: This is a "transitional" argument. It concedes that democracy might be the end goal but justifies the authoritarian means as a phase. This is the "Lee Kuan Yew thesis."
      *   *Move 4: Maria's Rebuttal (Hidden Contract/Democratic Debt).*
          *   Claim: Smuggling in a contract. 50 years of growth = 50 years of wrong. Prosperity isn't a credit card (Democratic Debt).
          *   Evaluation: Strong moral argument. Challenges the idea that rights can be suspended indefinitely. The "debt" metaphor is powerful.
      *   *Move 5: Jake's Closer (The China Question/Utilitarianism).*
          *   Claim: China lifted millions from poverty. Was that a bad trade?
          *   Evaluation: Pure utilitarianism (greatest good for greatest number). Hard to argue against the material benefit, but ignores the cost to individuals.
      *   *Move 6: Maria's Closer (Consent + Emergency).*
          *   Claim: Not a bad trade materially, but unjustified morally without consent/emergency. A bridge doesn't excuse dictatorship.
          *   Evaluation: Distinguishes between *outcome* (good) and *justification* (lacking). Requires procedural legitimacy, not just output legitimacy.

  3.  **Evaluate "Who is Right?":**
      *   *Constraint:* Philosophy doesn't have objective "right/wrong" like math. I need to explain *where* their arguments hold water and where they leak.
      *   *Jake:* Strong on empirical observation (regimes *do* survive on performance) and utilitarian outcomes (poverty reduction). Weak on moral justification (might makes right?) and the definition of legitimacy (acceptance vs. rightfulness).
