      *   *Is the distinction between 'idea' and 'articulation' clear?* I need to make sure I don't conflate the *insight* with the *proof*.
      *   *Did I hedge enough?* I need to explicitly state where history is murky (e.g., Leibniz's actual access to Newton's notes).
      *   *Did I avoid the reading list?* Yes.

  9.  **Final Polish:** Check against the "blunt correction" instruction. If the user's taxonomy has a flaw, point it out.
