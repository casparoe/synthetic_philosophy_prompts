      *   **Section 3: Proposition vs. Articulation.** Address the user's point about "bare proposition" vs. "worked-out theory." This is critical for Newton/Darwin.
      *   **Section 4: Critique of the User's Framework.** Be blunt. The taxonomy is good, but the "selection effect" point is the strongest philosophical lever they have.
      *   **Closing:** Summarize the verdict on the lecturer's argument.

  7.  **Refining the Tone:**
      *   Must sound like a colleague. Respectful but rigorous.
      *   Use hedging: "It is plausible that...", "Historians dispute...", "Philosophically speaking..."
