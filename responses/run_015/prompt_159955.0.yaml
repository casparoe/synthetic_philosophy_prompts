      *   *Normative leap:* The user identifies the slide but asks *where* it happens. I need to pinpoint it: It happens when we shift from *causal explanation* to *credit allocation*.

  10. (Final thought on the "Physicist" aspect): The user mentions "same detector techniques." This implies the *means of production* were standardized. This supports the "inevitability" claim more in physics than in 17th-century math. I should note that disciplinary differences matter.

