answer: |-
  Your frustration is well-founded and shared by many who approach metaphysics from a scientific background. In experimental physics, persistent disagreement usually signals a flaw in experimental design or uncontrolled variables; in metaphysics, persistent disagreement often signals that the disputants are operating under different normative constraints or linguistic frameworks. Your hypothesis that the two sides are answering different questions is close to the mark, but the structure is slightly more intricate than a simple descriptive/revisionary split.

  Here is a diagnosis of the structure of the disagreement, an assessment of what "progress" looks like in this context, and an evaluation of whether resolution is possible.

  ### 1. The Structure of the Disagreement: A Clash of Images
  The debate is not merely verbal, nor is it purely ontological in the way a dispute about the number of planets would be. It is a **methodological clash between two competing "images" of the world**, a distinction famously drawn by Wilfrid Sellars.

  *   **The Eternalist (Scientific Image):** Eternalists argue that metaphysics must be continuous with fundamental physics. If our best theory of spacetime (Special Relativity) treats time as a dimension analogous to space and denies a privileged hyperplane of simultaneity, then our ontology must reflect that structure. For the eternalist, "exists" is the tenseless logical quantifier ($\exists$). To say "Caesar exists" is to say that there is a spacetime coordinate $(x, y, z, t)$ where Caesar is located. The Rietdijk–Putnam argument is their primary weapon: if simultaneity is relative, and existence cannot depend on an observer's frame of reference, then all events in the block must exist equally.
  *   **The Presentist (Manifest Image):** Presentists argue that metaphysics must account for the fundamental nature of *experience* and *agency*. Our lived reality is not a block; it is a flowing present where the past is fixed and the future is open. For the presentist, "exists" is a tensed property. To say "Caesar exists" is false; to say "Caesar *existed*" is true. They argue that the Scientific Image is an abstraction that, while empirically adequate, does not exhaust ontological reality. They often posit that SR describes causal structure, not the full nature of temporal being, or they argue for a "privileged frame" that is physically undetectable but metaphysically real (a move that often frustrates physicists).

  **The Core Friction:** The debate stalls because each side accuses the other of changing the subject. Eternalists accuse Presentists of ignoring physics; Presentists accuse Eternalists of ignoring the phenomenology of time (the "passage" of time). They agree on the physics (the equations, the predictions) but disagree on what the physics *ontologically commits us to*.

  ### 2. The Semantic Layer: Quantifier Variance
  Your suspicion of a verbal dispute is supported by a significant branch of contemporary meta-ontology, specifically the work of philosophers like Ted Sider and Eli Hirsch. This concerns **quantifier variance**.

  *   **Eternalists** insist there is a single, fundamental meaning of "existence" (the unrestricted quantifier). If you cannot define existence tenselessly, you are not doing fundamental metaphysics.
  *   **Presentists** often argue that "existence" is inherently tensed. They claim the Eternalist is imposing a spatialized logic onto a temporal reality.

  If the meaning of "exists" is not univocal, the debate is verbal. However, most participants insist it is *substantive* because the stakes involve truthmakers. For example, what makes the statement "There were dinosaurs" true?
  *   **Eternalist:** The existence of dinosaur-temporal-slices in the block.
  *   **Presentist:** Present-tensed properties of the world (e.g., the world *now* has the property "having-contained-dinosaurs").
  Because they posit different truthmakers, they claim the dispute is not merely about words, but about the furniture of reality. Yet, since these truthmakers are empirically equivalent (by design), the dispute remains undecidable by observation.

  ### 3. What Counts as Progress?
  Given this diagnosis, you should not expect empirical progress. No new particle accelerator or astronomical observation will solve this, because both frameworks are constructed to be empirically adequate to Relativity. Progress in this domain takes three forms, none of which yields a "winner":

  1.  **Conceptual Clarification (The Deflationary Victory):** Progress occurs when we realize the dispute is partly verbal. If we accept that "existence" might have different valid meanings in different contexts (contextualism), the tension dissolves. We can be eternalists when doing cosmology and presentists when doing ethics or law. This is progress in *understanding*, not in *truth*.
  2.  **Formal Rigor (The Logical Victory):** Progress is made when a side develops a formal logic that captures their view without contradiction. For Presentists, this means developing tense logic (Priorian logic) that handles SR without collapsing into Eternalism. For Eternalists, it means explaining the "illusion" of passage without eliminating the subject. This hasn't ended the debate, but it has sharpened the costs of each view.
  3.  **Axiological Honesty (The Philosophical Victory):** The most honest progress is recognizing the dispute as **axiological** (value-based) rather than factual. It forces a choice: Do we value fidelity to fundamental physical formalism more (Eternalism), or do we value fidelity to human agency and temporal experience more (Presentism)? Progress is the realization that this is a choice of philosophical priority, not a discovery of fact.

  ### 4. Should We Expect Resolution?
  You asked for an honest answer about whether we should expect progress. The candid answer is **no**, not in the sense of one side proving the other false.

  The debate persists because it sits at the boundary of two domains that humans cannot fully reconcile: the **view from nowhere** (objective physics) and the **view from now** (subjective experience). As long as we are beings who *do* physics (requiring an objective stance) and *live* in time (requiring a subjective stance), this tension will remain. The "impasse" is not a failure of philosophy; it is a reflection of the human condition. Expecting a resolution is akin to expecting a resolution to the mind-body problem; it may be that our conceptual frameworks are simply not equipped to unify the objective description of time with the subjective experience of it.

  ### Summary
  The disagreement is a substantive methodological impasse driven by conflicting normative priorities, where eternalists privilege the ontology of fundamental physics and presentists privilege the ontology of lived experience, rendering the conflict axiological rather than empirical.
