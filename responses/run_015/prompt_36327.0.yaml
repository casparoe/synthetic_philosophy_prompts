answer: |-
  *1. A theory must explain why we voluntarily seek out music expressing negative emotions like grief, unlike real-life instances of those emotions. This requirement ensures the account distinguishes aesthetic experience from practical suffering.

  2. The account must treat musical expression as a crafted persona rather than a causal symptom of the creator's actual psychological state. This prevents the confusion of artistic communication with natural signs like a trembling voice or a cry of pain.

  3. Instrumental music must be described as presenting emotions without specific objects or owners, rather than targeting particular events or persons. This earns a spot because while listeners may project narratives, the sound itself lacks the semantic hooks to specify whose grief is being heard.

  4. The theory must accommodate the fact that competent listeners generally agree on the basic emotional character of a piece without prior instruction. This rules out accounts that rely entirely on private association or radical cultural relativism.

  5. The expression must be grounded in the audible relationships of the sounds rather than imposed solely by the listener's imagination. This constraint eliminates theories that treat expression as purely projective.
