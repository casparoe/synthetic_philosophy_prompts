answer: |-
  Three friends, Ali, Bea, and Cora, sing a three-part harmony around a fire, seeking only the joy of singing together. No words establish the plan; they simply begin. Mid-song, Cora privately becomes convinced the harmony is impossible to sustain due to a mistaken memory of the key. She believes failure is inevitable. Yet, she continues singing her part to avoid disrupting the others. Ali and Bea remain fully committed, believing success is possible, unaware of Cora's doubt. Cora feels bound to continue but questions the point. Ali and Bea continue harmonizing, assuming Cora is with them. Does the joint action survive Cora's private disbelief?

  (a) **Searle:** Joint action dissolves for Cora; we-intentions require belief in feasibility. **Bratman:** Shared Cooperative Activity fails; interlocking intentions require mutual belief in success. **Gilbert:** Joint commitment persists; obligations remain binding despite private doubt until rescinded.
  (b) **Structural Feature:** The ontological basis of unity: psychological states (Searle/Bratman) versus normative obligations (Gilbert).
  (c) **Removing Non-Instrumentality:** If instrumental, pursuing an impossible end is irrational. Individualist accounts firmly reject joint action; Gilbert maintains obligation, widening the theoretical gap based on practical rationality.
  (d) **Assessment:** Only Gilbert accommodates this. Searle and Bratman tie commitment to intentional states incompatible with believing the goal impossible, whereas Gilbert separates obligation from current psychology.
