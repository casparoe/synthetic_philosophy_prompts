      *   Can any account handle "joint commitment persists even when one member treats the goal as impossible yet continues to conform"?
      *   Searle/Bratman: Struggle. Intention requires belief in possibility (usually). If she thinks it's impossible, she can't intend the goal. She is merely simulating.
