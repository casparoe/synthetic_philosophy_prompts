      *   *Need:* Clear setup of Meridian, the Public Health Model, the Accountability Proceeding, and the Responder-in-Remission case.
      *   *Task:* Adjudicate the legitimacy of the proceeding from both perspectives, focusing on the timing of responsibility/blame.
      *   *Tone:* Academic, precise, challenging.
      *   *Drafting thought:* Make sure to emphasize the *non-custodial* nature of the hearing to distinguish it from quarantine. The tension is about the *expression* of blame, not the deprivation of liberty.
