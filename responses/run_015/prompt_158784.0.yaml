      *   **Goal:** Create a midterm question that avoids rehashing the basic "Caruso kills desert, Dennett saves it" dynamic. Instead, apply it to a specific wrinkle: "prospective-blame displacement."
      *   **The Scenario:** Jurisdiction "Meridian" adopts a Caruso-style public-health-quarantine model (no retributive hard treatment). However, to satisfy public demand for blame, they add a non-custodial "accountability proceeding" (restorative hearing, victim statements, formal acknowledgment of wrong).
      *   **The Defendant:** "Responder-in-remission." Medicated normally (reasons-responsive), stopped meds, violent flare-up (assault), now back on meds (reasons-responsive) at the time of the proceeding.
      *   **The Philosophical Crux:** Is this proceeding legitimate?
          *   *Caruso:* Is it permissible moral addressing/rehab or a sneaky retributive trap? When does blame attach?
          *   *Dennett:* Does this track compatibilist desert? Does responsiveness need to be at the time of the offense or the proceeding? Diachronic agency?
      *   **Deliverables:**
          1.  Exam Question (90-min in-class or 1,000-word take-home).
