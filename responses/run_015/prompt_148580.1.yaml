answer: |-
  Based on the track record you provided, Dani is not a pure Peter Singer-style utilitarian. A pure utilitarian would demand the kidney, demand she skip the wedding if the stranger's need were great enough, and likely argue for voting based on rule-utilitarian grounds.

  Dani is running a hybrid system: **Threshold Consequentialism with Agent-Centered Prerogatives.** She believes in maximizing good *up to a point*, constrained by fairness, risk, and special relationships.

  Here is the breakdown of her likely answers, the competing rules that fit her history, and the specific test case to expose her actual operating system.

  ### 1. Predicted Answers to Your Three Cases

  Based on her past verdicts, here is how Dani will likely respond:

  *   **Case 1 (200 Bystanders, High Cost): "No Duty."**
      *   *Reasoning:* While the *need* is high (Necessity), the *cost* ($2,000 + career interview) exceeds her "shallow pond" threshold ($200 suit). Furthermore, the *unfairness* (200 others doing nothing) triggers her "Office Collection" intuition: if others defect, you aren't obligated to carry the entire burden alone.
  *   **Case 2 (Repeated Rescue, 30 Years): "Duty."**
      *   *Reasoning:* This maps directly to her 10% income rule. She views moral duty as a recurring tax on your resources, not a one-time event. As long as the individual instance cost (shoes + 10 mins) remains below her "significant sacrifice" threshold, the repetition doesn't negate the duty.
  *   **Case 3 (5% Risk, Two Kids): "No Duty."**
      *   *Reasoning:* Her 1-in-20 risk verdict applies to *agents*, not *parents*. Her refusal to skip her sister's wedding establishes that close kin trump strangers. Her children are a higher priority tier than her sister. Jeopardizing their only parent violates her "Special Obligations" constraint, regardless of the low statistical risk.

  ### 2. The Rules That Fit Her History

  To find out if she is coherent, we need to see which of these three rules she is actually using. All three fit her *past* data perfectly but diverge on your *new* cases.

  **Rule A: The "Moderate Demand" Rule (Most Likely)**
  *   **Principle:** You must prevent harm if the cost to you is "moderate" (not life-altering), you are necessary, and it doesn't violate obligations to dependents.
  *   **Fits Old Data:** Explains the suit (moderate), kidney (immoderate), sister's wedding (dependents/kin priority), and bystander (not necessary).
  *   **Fails On:** Defining exactly where "moderate" ends (hence the coffee silence).

  **Rule B: The "Fair Share" Rule**
  *   **Principle:** You must prevent harm only if you are doing your *fair share* of the collective burden. If others refuse to chip in, your duty dissolves (unless the cost is trivial).
  *   **Fits Old Data:** Explains the Office Collection (everyone paid), the Bystander (someone else took the share), and the Pond (1 person = 100% share, so it is your share).
  *   **Fails On:** Explaining why the 10% income is required even if *most people* don't give 10%. (Unless she views income donation as a solo duty, distinct from collective rescue).

  **Rule C: The "Risk/Impact" Rule**
  *   **Principle:** You must prevent harm if the expected positive impact outweighs the risk to you, provided you don't die. Relationships don't matter; only outcomes and survival probabilities matter.
  *   **Fits Old Data:** Explains the 1-in-20 risk (good odds), the 50/50 risk (bad odds), and the Bednets (high impact).
  *   **Fails On:** Explaining the Sister's Wedding. A pure impact calculator would skip the wedding if the stranger's need was dire enough.

  ### 3. Where They Come Apart

  Here is the matrix of divergence. This shows you exactly where her logic might crack.

  | Case | **Rule A (Moderate Demand)** | **Rule B (Fair Share)** | **Rule C (Risk/Impact)** |
  | :--- | :--- | :--- | :--- |
  | **1. Unfair High Cost** | **No.** (Cost > Threshold) | **No.** (Cost > Fair Share) | **Yes.** (Kid dies, you live/career recovers) |
  | **2. Repeated Rescue** | **Yes.** (Per-instance cost low) | **Yes.** (It's your daily share) | **Yes.** (Aggregate impact high) |
  | **3. Parent Risk** | **No.** (Dependents veto) | **N/A** | **Yes.** (5% risk is acceptable) |

  *Note the critical splits:*
  *   **Case 1** tests whether she cares about **Fairness** (Rule B) or **Outcome** (Rule C). Rule A sides with B here due to cost.
  *   **Case 3** tests whether she cares about **Relationships** (Rule A) or **Statistics** (Rule C).

  ### 4. The Killer Question

  To settle which rule she is running, you need to isolate **Fairness** from **Cost**. In Case 1, the cost was high *and* the fairness was low. We need a case where the cost is *low* (like the suit) but the fairness is *low* (like the 200 bystanders).

  **Put this case to her:**

  > "You're walking past the shallow pond. You see a kid drowning. You can save her by ruining your **$50 sneakers** (less than the suit). However, there are **50 able-bodied adults** standing around watching. They are all refusing to help. You are the only one who will move. Do you have a duty to jump?"

  **Why this settles it:**

  *   **If she says YES:** She is running **Rule A (Moderate Demand)**. She prioritizes the *necessity* of the rescue over the *unfairness* of the situation. Her "Office Collection" verdict was about coordination, not a veto on unfairness. This suggests a coherent, consequentialist-leaning system.
  *   **If she says NO:** She is running **Rule B (Fair Share)**. She believes that being the "sucker" in a defection scenario releases her from duty, even at low cost. This suggests her view is more contractualist (based on social cooperation) than altruistic.
  *   **If she hesitates/qualifies:** She is likely running **Intuition Clustering**. She doesn't have a rule; she has a "feeling" about suits vs. sneakers vs. bystanders that hasn't been reconciled. This confirms your suspicion that it's just a list of intuitions with a story attached.

  **Follow-up on the Coffee:**
  If she struggles with the Sneaker case, press her on the coffee again. Ask: *"Is the coffee wrong because of the money, or because it's a luxury? If the money went to bednets, is the luxury the problem, or the spending?"* Her answer there will tell you if her threshold is **Financial** (10% cap) or **Lifestyle** (no luxuries while others starve).
