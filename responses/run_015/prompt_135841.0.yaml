      *   Balance for a new institution? Yes.
      *   Bounded horizon/active transformation? Yes.
      *   Concrete fictional details? Yes.
      *   Thoughtful non-specialist? Yes.

  **(Self-Correction Note):** I must be careful not to present Nietzsche as advocating for a simple "middle ground." His point is more dynamic: use the modes *instrumentally*. The Critical mode is often the prerequisite for the others when the past is toxic. I should emphasize that for a *new* institute on *colonial* land, the Critical mode is the gatekeeper.

