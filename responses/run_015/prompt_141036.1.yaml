answer: |-
  The cords lay on the table like shed skins. Mark tapped the first one, a single green bead on a black loop. Then the second, two reds. The third, three blues.

  "One, two, three," Mark said. "The total count increases by one every time. The new cord has three beads: Yellow, Green, Green. So the next one needs four. That's non-negotiable."

  Elara nodded. She watched their grandmother in the corner. The woman sat facing the wall, her right hand curled useless in her lap, her left hand resting on the armrest. She hadn't spoken in eighteen months.

  "The variable," Mark continued, "is which bead gets added. In the old cords, there was only one color, so it didn't matter. Here, we have a run of one Yellow and a run of two Greens. The pattern is 'extend the run.' You extend the longer run. You add a Green. We order the Green kit."

  He flipped the new cord over. Because there was no clasp, no knot, no beginning, the reversal was perfect. Yellow-Green-Green became Green-Green-Yellow. "See? If you hold it the other way, you're extending the Yellow. But logically, you follow the momentum. Two greens imply a green future."

  It was clean. It was safe. It treated the cord like a sentence with a period at the end. Elara felt the pull of it. If she ordered Green, she could defend it. *Math,* she could tell the care facility. *Progression.*

  The door opened and Abe stepped in, bringing the smell of machine oil and dust. He'd managed the textile shop where Grandma used to work. He didn't look at the table. He walked to the loom in the corner, the great iron wheel frozen in place.

  "Math doesn't weave," Abe said. He spun the wheel with a thick finger. It groaned. "Colors aren't numbers. They're neighbors."

  He came to the table and pointed at the Green beads on the new cord. "On the wheel, Green sits between Yellow and Blue. You've got Yellow and Green here. The tension is pulling toward the next slot. You don't duplicate; you advance. You add a Blue."

  "Then the count is wrong," Mark said. "Y-G-B is three beads. She always adds a bead."

  "Add a Blue bead," Abe corrected. "Yellow, Green, Green, Blue. Four beads. The rule isn't 'duplicate.' The rule is 'walk the wheel.' The duplication in the old cords was an illusion. You can't walk a wheel if there's only one color. You just stay put."

  Mark opened his mouth, then closed it. He looked at the cord. He looked at the wheel. The cord had no ends, so 'next' was a choice. The wheel had no arrow, so 'forward' was a choice. Abe's logic relied on the loom, not the string. It felt riskier, but it smelled like the shop. It smelled like Grandma.

  Elara looked at her grandmother. The woman's left hand was twitching. Not a spasm. A rhythm.

  "Does it matter?" Mark asked, his voice tight. "If we order Green, she gets beads. If we order Blue, she gets beads. If we guess wrong, she stops. If she stops, she declines. We need to know which language she's speaking. Is it logic, or is it the loom?"

  Elara stood up and walked to the corner. She knelt beside the wheelchair. "Grandma?"

  The woman didn't turn. Her eyes were fixed on the iron wheel.

  Elara reached out and took the new cord from the table. She brought it to her grandmother's lap. She placed the loop in the woman's left hand.

  The cord slipped through the fingers. It had no ends. It was a circle. But Grandma's hand was not a circle. It was a clamp.

  Elara watched the grip. Grandma's thumb pressed down on the Yellow bead. Her fingers curled around the Greens. The paralysis on the right side meant she couldn't stabilize the loop with two hands. She had to anchor one point and work away from it. She always anchored the singleton. In the green cord, she held the green. In the red pair, she held the center. Here, she held the Yellow.

  If Yellow was the anchor, the work happened at the other end. The Green end.

  Mark was right about the growth. But Abe was right about the context.

  Elara looked at the wheel again. The thread currently loaded on the shuttle was Blue. It had been there since the stroke. The wheel hadn't turned because she hadn't been able to push it with her right hand. But the left hand could pull.

  Elara traced the rim of the wheel. Counter-clockwise. Green to Blue. Clockwise. Green to Yellow.

  Grandma's left hand twitched again. A pull. A contraction. She could only pull toward her body. If she sat here, facing the wall, the wheel was to her left. To spin it toward her, she had to turn it counter-clockwise.

  The wheel had no arrow. But her body gave it one.

  The cord had no ends. But her hand gave it a start.

  The logic on the table was perfect and dead. The logic in the room was broken and alive. Mark wanted the rule to be in the beads. Abe wanted the rule to be in the wheel. Elara saw the rule was in the stroke.

  If she ordered Green, she was betting on the past. If she ordered Blue, she was betting on the hand.

  Mark was waiting by the laptop. "Elara? Green or Blue? I have to submit the order before the warehouse closes."

  Elara looked at the cord in her grandmother's hand. The Yellow bead was white-knuckled under the thumb. The Green beads hung loose, waiting. But the loom behind them hummed with the tension of the Blue thread, tight and ready to snap.

  "Blue," Elara said.

  Mark hesitated, his finger hovering over the key. "Why? The count implies—"

  "Because she can't push the wheel," Elara said. "She can only pull it."

  Mark looked at the wheel. He looked at the paralyzed right hand. He looked at the cord, which suddenly looked less like a puzzle and more like a tether. He nodded, once, and pressed the key.

  The order went through. Elara took the cord back from her grandmother's lap. She didn't straighten it. She let it lie in a loop, exactly as it was, and placed it on the table next to the others.
