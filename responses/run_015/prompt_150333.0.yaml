      *   *Correction on Limits:* Jeffrey conditioning is actually a special case of Min-Info. So Min-Info recovers Jeffrey. Conditionalization is a limit of Jeffrey. So Min-Info recovers both. This makes Min-Info strong on the "Limits" desideratum.

  9.  **Final Polish:** Check the "Purpose" constraint. The user wants to *code* this. Emphasize computational tractability and stability over philosophical purity.

