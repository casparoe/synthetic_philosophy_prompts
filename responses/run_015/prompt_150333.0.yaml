  *Wait, actually:* There are results (e.g., by Grove, Halpern, Koller) showing that certain combinations of axioms (like rationality + specific invariance properties) lead to triviality or contradiction. I should frame it as "Incompatible Intuitions" rather than "Mathematical Impossibility of any Rule."
  *Better framing:* The collision is between **Rigidity on the Unconstrained Partition** and **Invariance of the Antecedent's Marginal**. You can't have both if the conditional probability changes.

