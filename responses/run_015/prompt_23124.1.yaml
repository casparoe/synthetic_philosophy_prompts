      *   *Her Life:* She ran a community theater. This is active, messy, collaborative, and brings people *together*. It requires warmth, not coldness.
      *   *Resolution:* She didn't just study the text; she lived the counter-argument. She proved that theater *can* be about connection, not just distance. She edited texts, but she also directed people.

  3.  **Drafting - Section by Section:**

