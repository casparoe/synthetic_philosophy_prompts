answer: |-
  Good evening, everyone.

  For those of you meeting [Name] for the first time tonight: welcome. For those of you who have been working with her, drinking with her, or being directed by her for decades: welcome back.

  I have the privilege of proposing a toast to a woman who has spent the last thirty years doing something quite specific. She has been the world's leading editor on Jean-Jacques Rousseau's views on the theater.

  Now, for the half of the room currently checking their mental footnotes: you know exactly what that means. For the rest of you—her family, her friends, the people who just know her as the woman who brings incredible casseroles to potlucks—here is the gist. Rousseau, in his *Letter to d'Alembert*, argued that the theater is essentially a school of moral laziness. He believed that when we sit in the dark and watch a play, we practice a kind of safe self-deception. We admire virtue from a distance, rather than feeling it. We cry for a tragic hero so that we don't have to help a neighbor in need. He argued that the audience's pleasure depends on staying just far enough away from the characters to keep us cold.

  It is a brilliant, cynical, airtight argument. And for thirty years, [Name] has lived inside that argument. She has parsed the syntax of his suspicion. She has footnoted his fear of the stage.

  But then there is the wrinkle.

  Because for the last twenty of those thirty years, [Name] also ran the Oak Street Community Theater.

  I want you to picture the contradiction here. By day, she was editing the definitive texts on why the theater isolates the human soul. By night and on weekends, she was in a drafty hall, gluing sequins to costumes, mediating disputes between a tenor and a set designer, and hugging nervous teenagers before their first curtain call.

  Rousseau wrote that the stage keeps us cold. But anyone who has ever been directed by [Name] knows that her rehearsals were the warmest rooms in the city.

  Rousseau wrote *Pygmalion*—one of his two little plays—about a sculptor who falls in love with his own creation, a statue that only comes to life when he projects his own soul onto it. It is a myth about solitude. But [Name] didn't treat her actors like statues. She didn't want them to be perfect objects admired from a distance. She wanted them to be messy, human, and connected.

  There is a profound tension here, and I know the scholars in the room have wondered about it. Did she believe her own scholarship? Or did she believe her own life?

  I think the answer is that she believed in the tension itself.

  She understood Rousseau's warning better than anyone. She knew that theater *can* be a place where we hide. She knew that it *can* be a place where we feel virtuous without acting virtuously. But she also knew that the text is not the building. The philosophy is not the people.

  She spent thirty years studying the argument that art creates distance, and she spent twenty years building a place that bridged it. She proved that the stage doesn't have to be a barrier; it can be a table where we all sit down together.

  To the scholars here: She never compromised the text. She knew the danger of the "spectacle."
  To the family here: She never compromised her heart. She knew the power of the "community."

  She showed us that you can understand the darkness of human nature without choosing to live in it. You can edit a man who said the theater makes us cold, and still be the person who makes sure the cast party has enough cake.

  In many ways, [Name] has been an editor in the deepest sense of the word. She didn't just correct commas; she corrected the record. She took a philosophy that said "art separates us," and she edited it, in real time, to read "art brings us home."

  So, I ask you to raise your glasses.

  To [Name]. May your retirement be free of deadlines, but full of drama. May you never have to mediate a dispute over a lighting cue again, unless you want to. And may you finally get to sit in the audience, not to work, and not to analyze the distance between the stage and the seat, but simply to enjoy the show.

  To [Name].
