      *   **Topic:** Keynes's treatment of uncertainty in *The General Theory* (GT) vs. *A Treatise on Probability* (TP).
      *   **Thesis:** Keynes's uncertainty is *not* Knightian risk/uncertainty binary, *not* subjective Bayesian ignorance. It *is* "weight of argument" (from TP) reinterpreted as a *socially constituted, convention-dependent metric*. Investment instability arises because intersubjective conventions fixing premises erode without evidence change. Bayesian updating fails because priors are collective conventions, not individual beliefs.
      *   **Audience:**
          1.  Two Decision-Theoretic Economists (Keynes = Informal Bayesian, Animal Spirits = Ambiguous Priors).
          2.  One Historian of Economic Thought (Keynes = Consistent Logical-Relation Theorist from TP to GT).
          3.  Two Philosophers of Science (Non-probabilistic uncertainty = Redundant, DSGE handles volatility).
      *   **Required Elements:**
          *   Objections in likely order, phrased in each faction's voice.
