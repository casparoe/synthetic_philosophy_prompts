answer: |-
  # SPEAKER'S PREP SHEET: Keynes, Conventions, and the Weight of Argument

  **Thesis Core:** Uncertainty in *GT* = Erosion of socially constituted conventions (Weight), not Knightian binary or Bayesian variance. Priors are collective, not individual.
  **Goal:** Defend the "Social Weight" interpretation against formalization, textual purism, and redundancy charges.

  ---

  ## 1. THE DECISION-THEORETIC ECONOMISTS (2)
  **Likely Objection:** "You're overcomplicating the math. If agents act as if conventions are eroding, that's observationally equivalent to a sudden widening of the prior distribution or a shift to max-min expected utility. Why not just model 'convention stability' as a second-order probability parameter? It lets us keep the Bayesian framework."

  *   **Strategy:** **Hold Firm.** Do not concede that "Weight" is a second-order probability.
  *   **Concise Reply:** "A second-order probability is still a probability assigned by an individual agent. My claim is that the *premise* of the calculation is intersubjective. When the convention breaks, the agent doesn't update a belief; they lose the *rule* for forming beliefs. You can model the *effect* as a prior shift, but you cannot model the *cause* (social erosion) within an individualist ontology."
  *   **Weakest Point in Reply:** It is empirically difficult to distinguish an agent who has "lost the rule" from an agent who has assigned a probability of zero to the rule's validity. You risk sounding metaphysical rather than behavioral.

  ## 2. THE HISTORIAN OF ECONOMIC THOUGHT (1)
  **Likely Objection:** "Keynes never abandoned the Logical-Relation theory from the *Treatise*. By calling weight 'socially constituted,' you're importing a sociological layer Keynes didn't intend. For Keynes, weight was about the completeness of evidence relative to a logical proposition, not the stability of market sentiment."

  *   **Strategy:** **Concede Partially / Pivot.** Acknowledge the textual continuity but insist on the *application* shift.
  *   **Concise Reply:** "I agree Keynes didn't abandon logical relations. But in the *Treatise*, the evidence is given. In the *General Theory*, the 'evidence' for investment is the market convention itself. I'm arguing Keynes *applied* the logical concept of weight to social premises. The logic remains, but the relata become intersubjective conventions rather than raw data."
  *   **Weakest Point in Reply:** Keynes is notoriously ambiguous in *GT* about whether he is still doing "logic" or "psychology." The Historian can point to passages where Keynes discusses individual psychology (Chapter 12) to argue you are over-socializing his view.

  ## 3. THE PHILOSOPHERS OF SCIENCE (2)
  **Likely Objection:** "This is redundant. Modern DSGE models accommodate investment volatility via exogenous shock processes. If your 'convention erosion' doesn't predict volatility better than a stochastic shock term, it's an unnecessary ontological addition. What work is 'non-probabilistic' doing that a fat-tailed distribution doesn't do?"

  *   **Strategy:** **Hold Firm.** Focus on the *transmission mechanism*, not just the volatility.
  *   **Concise Reply:** "A stochastic shock treats the volatility as exogenous noise. My account explains the *endogenous fragility* of the system. DSGE assumes the structure holds; I argue the structure (the convention) is the variable. It's not about predicting the *size* of the shock, but explaining why the system loses its damping capacity without new information."
  *   **Weakest Point in Reply:** You haven't provided a formal alternative to DSGE. Without a competing model that generates testable predictions distinct from stochastic shocks, the charge of redundancy sticks.

  ---

  ## 4. THE FEARED OBJECTION (UNFALSIFIABILITY)
  **The Objection:** "If investment fails, you say conventions eroded. If it succeeds, you say they held. Since 'convention' is undefined outside of the outcome, your theory is unfalsifiable. Any failed probabilistic prediction can be retroactively saved by positing a shift in 'weight.'"

  *   **Strategy:** **Hold Firm.** Do not retreat to "Keynes meant..." Use *Liquidity Preference* as the independent variable.
  *   **Concise Reply:** "The theory is falsifiable if we treat Liquidity Preference as the observable proxy for convention stability, independent of investment outcomes. If my thesis holds, we should see spikes in liquidity preference *preceding* investment collapses, even when fundamental data (earnings, interest rates) remains stable. If liquidity spikes only *after* the crash, my account is just a post-hoc story. Test the timing of the liquidity shift relative to the evidence."
  *   **Why this works:** It moves the claim from "interpretive" to "empirical" without needing to formalize "conventions."

  ---

  ## 5. OVERALL WEAKEST POINT (PREPARE TO DEFEND)
  **The Vulnerability:** **The "Evidence-Independent" Claim.**
  Your thesis rests on the idea that conventions erode *without any corresponding change in available evidence.* This is the hardest causal link to defend. Critics will argue that if a convention erodes, there *must* have been some signal (a rumor, a minor default, a political speech) that agents reacted to.

  **Defense Prep:**
  *   **Do not say:** "It's irrational."
  *   **Do say:** "The 'evidence' in investment is not fundamental data (dividends); it is the behavior of *other* investors. A convention erodes when I believe *you* believe the convention is broken, even if neither of us has new data on the underlying asset. This is a second-order belief cascade, not an evidence update."
  *   **Anticipate Follow-up:** "Isn't that just a coordination failure?"
  *   **Counter:** "Coordination failure implies a game structure. I'm arguing the *payoff matrix itself* becomes unknowable because the convention defines the payoffs."

  ---

  **GENERAL TONE NOTE:**
  *   **To Economists:** Be respectful of formalization but insist on ontological precision.
  *   **To Historian:** Align against the Bayesians, but distinguish your "Social Weight" from their "Logical Weight."
  *   **To Philosophers:** Emphasize *mechanism* over *prediction*.
  *   **Time Management:** Spend 60% of Q&A on the Economists and the Feared Objection. They pose the greatest threat to the thesis's viability.
