      *   *Economists:* Want formalizability. They think "Weight" $\approx$ Confidence/Second-order probability. They want to model "Animal Spirits."
      *   *Historian:* Wants textual consistency. They think GT *is* TP (Logical Relations). My thesis says GT *uses* TP concepts but *socializes* them (conventions). This might look like a deviation to the Historian.
      *   *Philosophers of Science:* Want empirical content/parsimony. If DSGE explains volatility, why add "conventions"? They see "non-probabilistic" as useless.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Economists):* They usually speak first or early. They care about modeling.
          *   *Voice:* "Why can't we just model this as a change in the prior?"
