          *   *Response:* Need to specify *indicators* of convention stability (e.g., liquidity preference spikes, specific market behaviors) independent of the crash itself.

      *   *Overall Weakest Point:* The mechanism of "convention erosion." How does it happen *without* evidence change? This is the hardest causal link to prove.

  4.  **Refining the Content (Matching the Prompt's Constraints):**
      *   *Tone:* Professional, strategic, direct.
      *   *Structure:* Follow the requested order (Economists -> Historian -> Philosophers -> Feared Objection -> Overall Weakness).
      *   *Specifics:* Ensure the "Weakest Point of Reply" is honest and critical.

  5.  **Drafting the Content (Mental Simulation):**

      *   *Economists:* They will say "It's just ambiguity aversion." I need to say "No, it's the *source* of the prior."
