answer: |-
  You're right to feel the stagnation. Forty years of swapping intuition pumps without shifting the ground is a sign that the debate is misconfigured, not that the participants are stubborn. Your hypothesis is sharp, but it misses the central knot. I'm going to reject two specific claims you made, refine the third, and then tell you where the actual leverage lies.

  **First, the rejection:** I reject your claim that the famous intuition cases (Swampman, etc.) are *secretly epistemological*. They are genuinely metaphysical, but they are *boundary cases* that we have mistakenly treated as *central cases*.

  When you imagine Swampman, you are asking about the conditions under which content *exists at all*. The etiological theorist says "no history, no content." The causal-role theorist says "current organization suffices." This isn't an epistemic limitation; it's a disagreement about the nature of the property. However, the reason this doesn't resolve the debate is that Swampman is a "zero or one" case. It tests the *existence* conditions, not the *identity* conditions. Most of our work in cognitive science isn't about whether a system has content, but *which* content it has. On the identity question (does this state represent *cat* or *small furry animal*?), the two theories often converge in normal organisms, which leads to your second error.

  **Second, the rejection:** I reject your suspicion that in all buildable or real cases, the verdicts align. They do not align on **novelty** and **systematic error**.

  Your neural prosthesis case is a case of *derived intentionality*. The device represents what it represents because the engineers meant it to, and their intentions have a history. Both accounts agree because the etiological account piggybacks on the designers' history, and the causal-role account sees the stable mapping. But consider a biological organism encountering a genuinely novel stimulus for which it has no selection history—say, a rat encountering a plastic model of a predator it has never evolved to see, or a human forming a belief about a theoretical entity like a "quark."

  The causal-role account can assign content based on current covariance or functional role. The etiological account has to perform gymnastics: it must argue that the *learning mechanism* was selected, or that the content is disjunctive. Here, the verdicts *diverge*. The etiological account often has to say the content is indeterminate or different from what the causal-role account says. We don't notice this divergence in everyday cases because evolution has pre-tuned us to our environment. But in the lab, or in modern human contexts, the histories and the current roles come apart constantly. The reason the debate feels stuck is that both sides retreat to "normal conditions" when pressed, masking the divergence.

  **The Real Diagnosis: The Normativity Gap**

  Here is the structure of the disagreement you are missing. It is not primarily about metaphysics vs. explanation. It is about **normativity**.

  Mental content is normative. A belief can be *false*. A desire can be *unsatisfied*. To naturalize content, you must naturalize the possibility of error. You have to explain how a physical state can be *wrong* about the world, not just different from it.

  *   **The Etiological Move:** Normativity comes from history. A heart that doesn't pump is malfunctioning because it was *selected* to pump. A belief is false if it fails to match the conditions under which the mechanism was selected to operate.
      *   *The Cost:* It makes normativity backward-looking. It struggles to explain how we can have normative standards for things that never existed before (novelty).
  *   **The Causal-Role Move:** Normativity comes from systemic coherence or idealized current function. A state is wrong if it violates the system's current inferential rules or tracking relations.
      *   *The Cost:* It struggles to distinguish *error* from *variation*. If a state causes a behavior, and that behavior is what the system *does*, in what sense is the state "wrong"? Without history, "malfunction" just looks like "functioning differently."

  The stalemate persists because both sides are trying to derive an "ought" (correctness conditions) from an "is" (causes or history), and each captures half of the phenomenon while failing the other half. The etiological theorist gets normativity but loses flexibility. The causal-role theorist gets flexibility but loses normativity.

  **Why the Prosthesis Case Doesn't Settle It**

  In your prosthesis case, the verdicts align because the system is *designed*. Design imports normativity from the outside (the engineers). The debate is about *original* intentionality—systems where the normativity is intrinsic to the biological organization. In the prosthesis, the "correct" function is fixed by the designers' intentions. In the brain, there are no designers. That is where the theories fight. The prosthesis is a edge case where the two theories overlap because the history (design) forces the current role to be normative. It doesn't prove the theories are equivalent; it proves that design bridges the gap between history and role.

  **What Would Count as Progress?**

  You asked if the dispute is verbal or substantive. It is substantive, but it is not a metaphysical dispute about the "essence" of content. It is a dispute about **explanatory utility**.

  Progress will not come from a better thought experiment. Swampman will never be built. Progress will come from one of three shifts:

  1.  **The Eliminativist Shift:** We conclude that "content" is not a natural kind. Cognitive science might move entirely to information-theoretic or control-theoretic descriptions that don't require truth conditions. If neuroscience explains behavior using prediction-error minimization without invoking "beliefs," the naturalization project dissolves. This is progress by dissolution.
  2.  **The Pluralist Shift:** We admit that "content" is a cluster concept. Sometimes we need the etiological notion (when explaining evolutionary adaptation or deep-seated drives). Sometimes we need the causal-role notion (when explaining rapid learning or reasoning about novel concepts). Progress here is mapping *which* notion serves *which* explanatory goal, rather than seeking a unified theory.
  3.  **The Empirical Shift:** This is the hardest but most promising. We need empirical work on how biological systems *actually* demarcate signal from noise. How does a cell or a neuron "know" it is in error? If we find a biological mechanism that functions as a "truth-evaluator" (a mechanism that is selected to detect mismatches between representation and world), that favors the etiological view. If we find that error correction is purely a matter of current systemic stability (homeostasis), that favors the causal-role view.

  **My Advice for Your Paper**

  Stop trying to solve the metaphysics. Your hypothesis that the debate conflates metaphysics, epistemology, and explanation is the strongest part of your intuition. Lean into that.

  Argue that the stalemate exists because both sides are trying to provide a **reductive analysis** of a concept that is likely **functional and context-sensitive**. The "truthmaker" for content attribution changes depending on whether you are asking an evolutionary question, a cognitive modeling question, or a phenomenological question.

  The prosthesis case doesn't show the dispute is verbal; it shows that in engineered systems, we *force* the history and role to align to make the system usable. In nature, they drift. The dispute isn't about what content *is*; it's about which drift we care about. The etiological theorist cares about the drift from ancestral function. The causal-role theorist cares about the drift from current systemic coherence.

  Progress is recognizing that "content" is the name we give to the intersection of those two drfits. When they align, we have robust representation. When they diverge (novelty, pathology, swamp-people), the concept frays. The goal shouldn't be to fix the definition so it covers the fringe cases. The goal should be to explain why the concept works so well in the center, and admit it breaks at the edges.

  If you write a paper that concludes "There is no single natural kind of content, and the forty-year war is a category error," you won't solve the problem, but you might finally clear the table. That is the only honest progress available right now.
