prompt: |-
  I am a PhD student in philosophy of biology, working on the dispute between selected-effects (etiological) and causal-role (dispositional) accounts of biological function. Below are compressed notes for the central argument of a paper I am drafting — notes rather than polished prose, so please ignore style. I would be grateful for your comments on the argument, and in particular for your responses to the four questions at the end.

  Working title: History Without a Lineage — Borrowed Etiology and the Contrastive Structure of Function Attributions

  1. The dialectic as usually stated.

  The debate is normally adjudicated against three stock cases: the first beneficial mutant, which does useful work before selection has responded to it; the vestigial or co-opted trait, whose selection history attaches to an effect it no longer produces; and the malfunctioning token, which has the right history but not the right current effects. Causal-role accounts are said to handle the first and second but not the third; selected-effects accounts the second and third but not the first. Pluralists infer that there are two or more legitimate notions; monists infer that one of the three cases is being misdescribed.

  2. Two cases I do not think belong to the standard set.

  Case A, ancestral recurrence. An ancestral hydrolase H is duplicated. The second copy drifts, loses its catalytic residues, and is later retained and elaborated under selection for a purely structural role, cross-linking two membrane proteins. So far this is ordinary exaptation, and the accounts agree: the structural role is the function, hydrolysis is not. Now extend the case. After a long interval, a small number of substitutions restores the ancestral catalytic geometry, so that the protein can once again hydrolyse substrate S. In the current metabolic context this is harmful: it siphons S from an essential pathway. Selection therefore fixes a small inhibitory peptide that binds the protein and abolishes the catalysis in vivo while leaving the cross-linking intact. The resulting state is this: the token has the structural role for which its line was retained; it has a restored disposition to hydrolyse S; that disposition was never positively selected in its own line — it was positively selected in a paralogous line and negatively selected once it recurred; and in vivo it is never exercised, because of the inhibitor.

  Is hydrolysis a function of the protein, a dysfunction of it, or merely an effect? The causal-role account says it makes no current contribution, so not a function; but a capacious version of that account, of the sort that analyses a capacity by decomposing a containing system, seems to re-admit it as soon as we remove the inhibitor and ask what the protein can do. The selected-effects account says it is not a function, since it was never a selected effect of tokens of this type, and indeed was selected against on recurrence; and not a dysfunction either, since dysfunction requires a selected effect that the token currently fails to produce. My impression is that practising molecular biologists would describe the case as a reawakened activity that the cell now has to suppress, and would happily call it pathological. If that is right, the normativity carried by dysfunction attributions tracks homology — type-level ancestry across a gene tree — rather than the selection history of the token's own line.

  Case B, borrowed history. A gene maintained in a donor lineage for one role is transferred horizontally into a lineage whose ecology makes a quite different contribution fitness-relevant, and is then retained for that contribution. At the instant of arrival the causal-role account attributes a function and the selected-effects account withholds one. Once the gene is stably maintained, the selected-effects account must either say that its function changed at some point, or that it has accumulated a second one. Now consider the limiting case: a gene carried by a broadly promiscuous mobile element, whose entire history is horizontal shuttling through many lineages in many different roles, with no vertical history to speak of. There is no single lineage-anchored story to appeal to; there is only a population-level history distributed across a metagenome.

  3. The proposal.

  Function attributions, I want to argue, are implicitly contrastive and carry an unset parameter set: a trait T has the function F relative to a containing system S, a capacity C of that system, a contrast class of candidate effects, a temporal window, and a reference class with respect to which history is measured. Ordinary biological practice leaves all five implicit, which is why the dispute looks intractable: the two camps are reporting verdicts generated under different default settings. In Case A the disagreement is over the temporal window and the reference class — the paralogous line rather than the token's line. In Case B it is over the reference class again, with the available candidates being the gene tree, the recipient lineage, and the metapopulation of the mobile element. Once the parameters are fixed, I claim, the two accounts coincide outside the pathological cases, and in the pathological cases there is no further fact of the matter beyond which parameter setting the explanatory project requires.

  4. Normativity, and where I think the account is unstable.

  The natural corollary is an asymmetry: function claims are synchronic and need only the system, the capacity, and the contrast class; dysfunction claims are diachronic and additionally need a temporal window and a reference class. That is why a de novo designed enzyme, expressed for the first time in a cell, can have a function on its first day of existence. But the corollary seems to give the wrong verdict about the badly designed enzyme that never performs as specified: on this account it has no function and, having no history, cannot malfunction either — yet we plainly want to call it broken. My tentative repair is to say that normativity requires a historically anchored *standard* but not necessarily a *selectional* one: design intention is an alternative source of the standard. I worry that this repair collapses the whole position back into a general proper-function view of the kind I was trying to avoid, and that I have thereby bought the synchronic half of the story at the cost of the normative half.

  My four questions:

  1. Are Cases A and B genuinely new work, or do they collapse into the stock cases — exaptation, vestigiality, the first-token problem, or chance-duplicate cases of the swampman variety? I am fairly confident about B being the first-token problem in a new costume, but I would like to know whether you think A is, since the recurrence there is homological rather than selective.

  2. What is the strongest version of the objection that a parameter-fixing view cannot distinguish true from false function attributions? The example I keep failing to answer is the attribution that the heart's function is to produce audible heart sounds, which seems to satisfy a synchronic contribution condition under some contrast class while being an attribution no one accepts. My current reply is that the capacity must be one that figures in an ongoing explanatory project rather than any effect whatever. Is there a stronger reply, or a stronger version of the objection that my reply does not touch?

  3. Am I right that the repair in section 4 is unstable? If design intention can supply the normative standard, is there anything left of my objection to selected-effects accounts, or have I merely redescribed one?

  4. Stepping back: is the payoff worth the apparatus? I would rather be told now that the contrastive framing is a elaborate way of restating function pluralism than discover it in review. If you think it is worth developing, I would also welcome suggestions for the one further case most likely to break it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy of biology.
      *   **Topic:** Dispute between selected-effects (etiological) and causal-role (dispositional) accounts of biological function.
      *   **Task:** Provide comments on the argument draft (compressed notes) and answer four specific questions.
      *   **Tone:** Professional, academic, constructive, critical but supportive. Needs to demonstrate familiarity with the literature (Millikan, Cummins, Godfrey-Smith, etc.) without being pedantic.
      *   **Key Argument:** The user proposes a "contrastive/parameter-fixing" view to dissolve the monist/pluralist deadlock. Function attributions depend on implicit parameters (system, capacity, contrast class, temporal window, reference class). They introduce two new cases (Ancestral Recurrence, Borrowed History) to challenge standard accounts. They worry about normativity (dysfunction) and whether their "design intention" repair collapses back into etiological views.

  2.  **Deconstruct the Argument:**
      *   *Section 1:* Standard dialectic (Mutant, Vestigial, Malfunction). SE handles 2&3, CR handles 1&2.
      *   *Section 2:* New Cases.
          *   Case A (Ancestral Recurrence): Protein regains ancestral activity but it's now harmful/suppressed. Is it dysfunction? SE says no (not selected *in this line*). CR says no (no current contribution). Biologists say yes (pathological/homology matters).
          *   Case B (Borrowed History): Horizontal Gene Transfer (HGT) / Mobile elements. No single vertical lineage. SE struggles with reference class. CR handles immediate utility.
      *   *Section 3:* Proposal. Function attributions are contrastive/parameterized. SE and CR coincide once parameters are fixed, except in pathological cases where there's no "fact of the matter" beyond explanatory needs.
      *   *Section 4:* Normativity. Function = synchronic. Dysfunction = diachronic/historical. Problem: De novo designed broken enzymes. Repair: "Design intention" provides the standard. Worry: Does this collapse back into Proper Function (Etiological)?
      *   *Questions:* 1. Novelty of Cases A & B? 2. Objection regarding "heart sounds" (trivial effects)? 3. Stability of the "design intention" repair? 4. Payoff vs. Apparatus (Pluralism in disguise?).

  3.  **Drafting Responses to the Four Questions:**

      *   **Q1: Novelty of Cases A & B.**
          *   *Case B (HGT):* This is well-trodden ground in philosophy of biology (e.g., Doolittle, Ochman, Godfrey-Smith on "lineages"). It *is* a first-token problem but scaled to populations. It challenges the "lineage" assumption of SE. It's strong but needs to be positioned against existing HGT literature (e.g., papers by Pedersen, Nanay, or the general "tree of life" critique).
          *   *Case A (Ancestral Recurrence):* This is more novel. Standard exaptation is $A \to B$. This is $A \to B \to A'$ (where $A'$ is homologous to $A$ but selected against). It targets the *homology vs. analogy* distinction in function attribution. It challenges SE's reliance on *recent* selection history vs. deep homology. It's not quite Swampman (no history) or First Mutant (no history). It's "Bad History."
          *   *Verdict:* A is the stronger, more novel contribution. B reinforces existing HGT critiques.

      *   **Q2: The "Heart Sounds" Objection (Trivial Effects).**
          *   *The Objection:* If function is just causal role + contrast class, why isn't pumping blood *and* making noise a function?
          *   *User's Reply:* "Explanatory project."
          *   *Critique:* This is the standard Cummins move. It's vulnerable to the charge of being too pragmatic/subjective.
          *   *Stronger Reply:* Needs to invoke *system organization* or *maintenance conditions*. The heart sounds don't explain the *persistence* of the heart in the system. Or, use the contrastive nature: The contrast class isn't "all effects," it's "effects relevant to the capacity C of system S." If C is circulation, sounds are excluded by definition of C.
          *   *Stronger Objection:* The "Gaga Effect" (Godfrey-Smith). Even if we fix the capacity, why is *that* capacity the function? The parameter-fixing view risks making function attribution arbitrary based on the observer's interest.
          *   *Advice:* Tighten the "Capacity C" parameter. It must be a capacity of the *containing system* that contributes to the *maintenance* of that system (a weak etiological constraint on the system, even if not the trait).

      *   **Q3: Stability of the "Design Intention" Repair.**
          *   *The Worry:* If I allow "design intention" to ground normativity for artificial enzymes, haven't I just admitted that *some* history (selection OR design) is needed?
          *   *Analysis:* Yes, effectively. But is that a collapse? Selected-Effects (SE) says *Natural Selection* is the only legitimate source of normativity. If the user says "Selection OR Design," they are moving to a "Proper Function" view (Millikan-style) but broadening the source of the norm.
          *   *Verdict:* It is unstable *if* the goal is to defeat Etiological accounts fundamentally. It concedes that normativity *requires* a history (broadly construed). However, it might save the *contrastive* view by showing that "History" is just one parameter setting (Reference Class = Design History vs. Selection History).
          *   *Suggestion:* Don't call it "Design Intention." Call it "Teleological History." Acknowledge the concession: Normativity *does* require history, but "Function" (sans normativity) does not. This splits the concept cleanly.

      *   **Q4: Payoff vs. Apparatus (Pluralism?).**
          *   *Risk:* Is this just "Contextual Pluralism" (e.g., Garson, Amundson & Lauder)?
          *   *Differentiation:* Pluralism says there are *two concepts*. The user says there is *one concept with variable parameters*. This is a semantic/pragmatic monism rather than an ontological pluralism. That *is* a payoff. It explains why people talk past each other.
          *   *Worth it?* Yes, if framed as dissolving the verbal dispute.
          *   *Breaker Case:* What breaks it? A case where parameters are fixed, consensus exists on parameters, but disagreement on function remains. Or, a case where the "reference class" is impossible to define (e.g., symbiosis where the "system" boundary is fuzzy). *Suggestion:* Holobionts/Microbiome. Who is the "containing system"? The host? The bug? The meta-organism? This stresses the "System S" parameter.

  4.  **Review and Refine:**
      *   *Tone Check:* Ensure I sound like a colleague/reviewer. Use terms like "etiological," "cummins-style," "normativity," "homology."
      *   *Structure:* Address the four questions directly, then offer general feedback on the draft structure.
      *   *Specific Insight on Case A:* Emphasize the "Homology" angle. SE usually tracks *selection* history, not *phylogenetic* history. Case A drives a wedge between them.
      *   *Specific Insight on Q2:* Mention the "Systemic Capacity" constraint.
      *   *Specific Insight on Q3:* Distinguish between "Function" (role) and "Proper Function" (normative). The user is essentially reviving the distinction but calling it "parameters."
      *   *Specific Insight on Q4:* The "Holobiont" case is the best stress test for the "Containing System" parameter.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Q1, make sure to distinguish Case A from "Atavism." Atavism is usually selection *for* the return. Case A is selection *against* the return (suppressed). That's the key novelty.
      *   *Correction:* In Q3, be careful not to say "You failed." Say "You have shifted the battleground." The distinction between synchronic function and diachronic normativity is a known move (e.g., Boorse), but the parameter view adds nuance.
      *   *Correction:* In Q4, warn against "Parameter Proliferation." If there are too many parameters, the theory predicts everything and nothing.

  6.  **Final Output Generation:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated and promising draft. You are correctly identifying that the stalemate between Selected-Effects (SE) and Causal-Role (CR) accounts often stems from unstated pragmatic constraints on function attributions rather than deep ontological disagreements. Your "parameter-fixing" proposal aligns with recent pragmatic turns in the literature (e.g., Garson, Nanay), but your specific cases add genuine pressure points.

  Here are my responses to your four questions, followed by a few general observations on the draft structure.

  ### 1. Are Cases A and B genuinely new work?

  **Case B (Borrowed History/HGT):**
  You are right to be cautious here. This is effectively the "First Token" problem scaled to the population level, and it has been discussed extensively in the context of Horizontal Gene Transfer (HGT) and the breakdown of the "Tree of Life." Philosophers like Ford Doolittle, W. Ford Doolittle, and Peter Godfrey-Smith have noted that SE accounts struggle when lineage boundaries are porous.
  *   **Verdict:** This case is robust, but it is not *novel* in the sense of being unexplored. To make it work for you, you must position it not as a new counterexample, but as a *limiting case* that forces the SE theorist to admit that "lineage" is itself a parameter that can be set to "metapopulation" rather than "vertical descent." If you frame it as showing that the *reference class parameter* is the locus of the dispute (rather than the existence of functions), it strengthens your Section 3 proposal.

  **Case A (Ancestral Recurrence):**
  This is the stronger, more novel contribution. Standard exaptation cases involve $A \to B$ (function changes). Atavisms usually involve $A \to B \to A$ where the return of $A$ is *selected for*. Your case is $A \to B \to A'$ where $A'$ is homologous to $A$ but *selected against* (suppressed).
  *   **Why it matters:** It drives a wedge between **phylogenetic homology** and **selection history**. SE theory tracks selection history; biological practice often tracks homology (e.g., calling a structure a "limb" even if vestigial, or an enzyme activity "catalytic" even if suppressed).
  *   **Verdict:** This does not collapse into the stock cases. It is not a "first mutant" (it has a history), not "vestigial" (the current function is the structural one, not the ancestral one), and not standard "malfunction" (the token is doing exactly what selection shaped it to do now: cross-link, not hydrolyze).
  *   **Recommendation:** Emphasize that biologists call this "pathological" or "dysfunctional" based on *deep homology*, not recent selection. This supports your claim that the "Reference Class" parameter can be set to "Gene Family" rather than "Current Lineage." This is your strongest card.

  ### 2. The "Heart Sounds" Objection (Trivial Effects)

  The objection is that your parameter-fixing view is too permissive. If I set the contrast class to "auditory effects," the heart's function is to make noise.

  **Your current reply:** The capacity must figure in an "ongoing explanatory project."
  **Critique:** This is the standard Cummins move. It is vulnerable to the charge of subjectivity (whose project?).

  **A Stronger Reply:**
  You need to constrain the **Containing System (S)** and **Capacity (C)** parameters more tightly.
  *   *Argument:* Function attributions are not just about *any* capacity of *any* system. They are about capacities that contribute to the **maintenance or persistence** of the Containing System $S$.
  *   *Application:* Heart sounds do not contribute to the maintenance of the circulatory system or the organism. Therefore, while "making noise" is a causal role, it fails the "System Maintenance" constraint inherent in the definition of parameter $C$.
  *   *Why this helps you:* It avoids collapsing into SE. You don't need the *trait* to have a selection history; you need the *system* to be a self-maintaining system (a la Autopoiesis or Organizational accounts). This allows you to rule out heart sounds without requiring the heart itself to have a specific selection history.
  *   *Stronger Objection you must anticipate:* The "Gaga Effect" (Godfrey-Smith). Even if we fix the system capacity (circulation), why is circulation the *function* rather than a mere effect? If your answer is "because it explains the system's persistence," you are smuggling a weak etiological constraint back in at the system level. You need to own this: admit that "Function" implies "Contribution to System Persistence," which is a weak teleological constraint, but distinct from "Trait Selection History."

  ### 3. Is the repair in Section 4 unstable?

  **The Worry:** If "design intention" supplies normativity for the broken de novo enzyme, haven't you just admitted that normativity requires history (broadly construed), thereby conceding the core insight of SE accounts?

  **Analysis:**
  Yes, you have conceded that **Normativity** requires history (Selection or Design). But you have not conceded that **Function** requires history.
  *   **The Instability:** The instability arises if you claim this is a theory of *Biological Function* simpliciter. If you allow "Design" to ground dysfunction, you are effectively adopting a "Proper Function" account (Millikan/Price) where the "proper" condition is widened from Natural Selection to Intelligent Causation.
  *   **The Fix:** Do not frame this as a repair to save biological normativity. Frame it as a **conceptual split**.
      *   *Function (Synchronic):* Determined by CR + Parameters. (Applies to de novo enzymes, hearts, artifacts).
      *   *Dysfunction/Malfunction (Diachronic):* Requires a Standard. In biology, the standard is usually Selection History. In artifacts, it is Design History.
  *   **Verdict:** It is unstable *only if* you try to derive normativity from the synchronic parameters. If you explicitly state that "Dysfunction" is a hybrid concept (Synchronic State + Diachronic Standard), you avoid the collapse. You aren't redescribing SE; you are arguing that SE is a theory of *Dysfunction/Malfunction*, while CR is a theory of *Function/Contribution*. The "parameter view" is the bridge that explains why we conflate them.

  ### 4. Is the payoff worth the apparatus? (Pluralism in disguise?)

  **The Risk:** Reviewers will say, "This is just Pragmatic Pluralism (Amundson & Lauder, Garson) with extra steps."
  **The Payoff:** Pluralism says there are *two concepts* (Function$_1$, Function$_2$). Your view says there is *one concept* with *variable settings*. This is a semantic/pragmatic monism. This is a distinct and valuable payoff because it explains the *phenomenology of the dispute*: philosophers talk past each other because they are using different default parameter settings, not because they are studying different phenomena.

  **Is it worth it?** Yes, provided you avoid "Parameter Proliferation." If you have 5 parameters with 3 settings each, the theory predicts everything. You need to argue that biological practice has **default settings** (e.g., Reference Class = Vertical Lineage; Temporal Window = Recent History). The theory explains deviations from the default (like your Case A & B).

  **The Breaker Case:**
  You asked for a case likely to break it. I suggest **The Holobiont / Microbiome**.
  *   *The Setup:* Consider a metabolic function performed by a gut bacterium that is essential for the host but vertically transmitted by the host (not the bacterium).
  *   *The Stress Test:*
      *   *Containing System (S):* Is it the Bacterium? The Host? The Meta-organism?
      *   *Reference Class:* The bacterial lineage? The host lineage?
      *   *Problem:* Your parameter view requires us to *fix* these to get a verdict. But biological practice is often *indeterminate* here. Biologists might disagree on the function attribution *even when they agree on the parameters*.
      *   *Why it breaks it:* If two biologists agree on $S$, $C$, Contrast, Time, and Reference, but still disagree on whether $T$ has function $F$, your model fails. (e.g., Is the bacterium's production of Vitamin K a function of the *bacterium* relative to the *host*? SE says no (bacterium not selected for host benefit). CR says yes. If your parameters are fixed to "Host System," SE should agree, but it won't, because the *trait's* history doesn't match the *system's* boundary.)
      *   *Use this:* Use the Holobiont case to show where the "Reference Class" parameter becomes politically charged or scientifically indeterminate, reinforcing your claim that there is "no further fact of the matter."

  ### General Comments on the Draft

  1.  **Title:** "History Without a Lineage" is excellent. It captures Case B well. Consider adding a subtitle that hints at the parameter solution, e.g., "...and the Parameterized Nature of Function Attributions."
  2.  **Section 3 (The Proposal):** Be careful with the claim that "the two accounts coincide outside the pathological cases." They won't coincide on the *first beneficial mutant* unless you set the Temporal Window to "Future Projected" rather than "Past Actual." You need to explain how your parameters *generate* the SE and CR verdicts as special cases. (e.g., SE = Reference Class: Lineage + Temporal Window: Past; CR = Reference Class: Token + Temporal Window: Present).
  3.  **Terminology:** In Section 4, distinguish clearly between "Function" (what it does) and "Proper Function" (what it ought to do). Your "Design Intention" repair is essentially an appeal to Proper Function. If you use the standard terminology, the "instability" worry dissolves: you are simply arguing that Biological Proper Function is a subset of General Proper Function.
  4.  **Case A Detail:** Ensure you clarify that the inhibitor is part of the system. If the inhibitor is the "function" (suppression), then the hydrolysis is the "dysfunction." This supports your claim that normativity tracks homology. Make sure to explicitly state that the *protein token* is malfunctioning relative to the *gene family norm*, even if it is functioning relative to the *current lineage norm*.

  **Summary:** This is publishable material. Case A is your unique selling point. The parameter view is a strong meta-philosophical move, provided you defend it against the charge of triviality (i.e., that it just says "context matters"). Focus on the **defaults**: the value of your theory is explaining why we have the defaults we do, and why the debate arises when cases force us to change them.
