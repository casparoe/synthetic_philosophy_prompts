      *   *The Twist:* The user asks if this is *just* corrective justice in disguise. This is a crucial pivot point for the proposal. It needs to investigate whether "causal footprint" adds something distinct (e.g., forward-looking capacity, relational duty) or if it collapses into backward-looking reparation.
      *   *Differentiation:* Climate displacement vs. Political Persecution. Climate is often diffuse/structural; persecution is often agent-specific. Does the footprint argument hold equally?

