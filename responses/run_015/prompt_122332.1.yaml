answer: |-
  **Project Title:** Beyond Borders and Benevolence: Causal Footprints as a Normative Ground for Admission Duties

  **1. The Research Question**
  Standard debates on asylum oscillate between state sovereignty (the right to exclude) and cosmopolitanism (the right to enter). This project bypasses that dichotomy to ask: **Does a state's "causal footprint"—its contribution to the conditions necessitating displacement—generate a distinct, agent-relative duty to admit affected populations, and if so, is this duty conceptually reducible to corrective justice?**

  Sub-questions include:
  *   Does the causal link create a stronger obligation than general humanitarian need?
  *   Does the nature of the footprint (e.g., diffuse carbon emissions vs. targeted arms exports) alter the type of obligation owed (admission vs. compensation)?
  *   Is "admission" a coherent remedy for structural harm, or does the causal footprint argument collapse when asked to specify *who* must be admitted?

  **2. Context and Gap**
  Current philosophical literature largely treats admission duties as either universal (based on human rights) or discretionary (based on national interest). Even "responsibility-based" approaches often focus on who *caused* the persecution (e.g., the persecuting state) rather than third-party states that contributed to the background conditions of instability.

  The sovereignty-vs-cosmopolitan framing leaves a normative gap: it ignores historical and structural relationality. A state might have no direct involvement in a specific act of persecution but may have destabilized the region through trade policy or arms sales. Conversely, a state might be a high emitter but have no direct political conflict with the displaced. Current frameworks struggle to weigh these different "footprints" against one another. This project argues that without a theory of causal contribution, admission policies remain arbitrary regarding *which* states bear the burden, even if the total burden is agreed upon.

  **3. Methodology**
  This is a conceptual analysis project requiring no empirical fieldwork. The method involves:
  *   **Normative Mapping:** Distinguishing "causal footprint" duties from duties of rescue, beneficence, and corrective justice. I will test whether the footprint argument holds if we strip away the capacity to help (pure responsibility) or the capacity to harm (pure capacity).
  *   **Case Comparison:** I will construct two contrasting idealized cases to test the intuition:
      1.  *The Arms Exporter:* State A sells weapons to a regime that subsequently persecutes Group X.
      2.  *The High Emitter:* State B's historical emissions render State C uninhabitable for Group Y.
      By holding the *need* constant and varying the *causal mechanism*, I will analyze whether our intuitive judgments about admission duties shift. If they do, the "footprint" has normative weight distinct from general need.

  **4. Deliverables and Policy Utility**
  Theoretical philosophy often fails to translate to policy. To ensure utility, the project will produce:
  *   **One Academic Article:** Arguing for or against the conceptual coherence of "causal footprint" as a standalone normative category.
  *   **One Policy Framework Brief:** A heuristic for policymakers. Instead of vague "responsibility," this brief will offer a rubric for weighing causal contributions (e.g., direct vs. indirect, necessary vs. sufficient conditions) when allocating asylum quotas among coalition states. This moves the conversation from "who *wants* to take refugees" to "who *owed* it to them," providing a moral vocabulary for diplomatic burden-sharing negotiations.

  **5. Risk Assessment and Scope**
  **What counts as failure?**
  *   **Conceptual Collapse:** If I cannot distinguish "causal footprint" from standard "corrective justice," the project fails to offer a new frame. If the only remedy for a footprint is financial compensation rather than admission, the specific question about *asylum* is answered negatively.
  *   **Over-demandingness:** If the logic implies that high-emitting states must admit *all* displaced persons from affected regions, the theory becomes practically incoherent. If I cannot place a principled limit on the duty, the argument is self-defeating.
  *   **Scope Creep:** Six months part-time is insufficient to build a full theory of global historical justice. I must restrict the analysis strictly to the *link between harm and admission*, not the broader ethics of climate justice or arms trade.

  **6. Self-Critique and Vulnerabilities**
  To maintain rigor, I must acknowledge where this reasoning is most fragile:

  *   **The "Causal Impotence" Objection:** The strongest argument against this frame is that individual state contributions (e.g., one nation's emissions) are causally negligible regarding specific instances of displacement. If my "footprint" is statistically indistinguishable from background noise, can it ground a specific duty? I risk circularity if I define "footprint" loosely enough to capture responsibility but strictly enough to assign specific duties. *If I cannot solve the problem of overdetermination (many causes, one effect), the footprint frame may be philosophically untenable.*
  *   **The "Right to Exclude" Counter:** I am assuming admission is a valid form of reparation. A critic might argue that a state can discharge its causal debt through foreign aid or intervention without compromising border sovereignty. *If admission is not a unique or necessary remedy for structural harm, the project's focus on asylum is misplaced.*
  *   **Changing My Mind:** I would abandon the "causal footprint" frame if I find that it systematically undermines the universal right to asylum. If tying admission to harm implies that refugees from "neutral" disasters (e.g., earthquakes in non-implicated states) have weaker claims, the theory violates the principle that refuge is a human right, not a tort settlement. If the footprint argument makes universal protection *less* secure by making it conditional on historical blame, the framework is ethically dangerous and should be rejected.
