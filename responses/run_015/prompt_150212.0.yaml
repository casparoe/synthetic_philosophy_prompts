prompt: |-
  hey, I run a small rationalist-adjacent discussion group—like 8 people, 75 mins, someone's apartment after a meetup—and I want an in-person activty that makes people *feel* why gradual mind-uploading kills the usual "did I survive?" intuition without me just lecturing about it. The twist I'm injecting isn't the standard Ship of Theseus pipeline. Instead imagine a "distributed rollback architecture": your cognitive pattern gets streamed to three redundant substrates, then two get shut down one by one over months, but there's a reversibility clause—if the remaining node fails, you can roll back to an earlier snapshot on a dormant substrate. So at no point is there a single "original" body; there's just a graph of nodes with different ages and fidelity scores. I want particpants to actually make choices about which nodes to terminate and whether to invoke rollback, with small social stakes (they earn reputation points that determine who gets to be the "arbiter" in the next round, no real money), and then in debrief map those choices onto the metaphysical problem. The group should come away seeing that the "fact of the matter" about survival dissolves once the process is distributed and reversible—before anyone names Parfit or talks about psychological continuity. Please include rules, roles, a timeline across rounds, the payoff scheme, debrief plan, an honest note on what feature of the idea the game can't reproduce (probably the first-person phenomenological continuity?), and tell me what will predictably go wrong the first run. Also please say how confident you are in the design choices and single out the point you're least sure will actually land with the group. Keep it casual—typos are fine, don't ask for citations or reading lists, and I want this runnable for someone who hasn't touched the philosophy literature since undergrad.
