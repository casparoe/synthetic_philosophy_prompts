          *   *Angry Email:* Social Friction. "Helpfulness" definition. "Nudging."
      *   **The Underlying Logic (The "Why"):**
          *   It's not a unified moral philosopher. It's a *Safety & Liability* algorithm.
          *   *Hierarchy of Harm:* Harm to Others/System > Harm to Self > Harm to Relationships.
          *   *Agency:* It respects your right to hurt yourself more than your right to lie to a system.
      *   **Consistency Check:** Is it consistent?
