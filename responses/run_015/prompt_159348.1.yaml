answer: |-
  The rain against the window sounded like static, a white noise that matched the hum of the ventilation and the low thrum of the bridge device standing beside Elena's bed. Dr. Aris Thorne watched the monitor, specifically the lower trace, the one labeled *Insula Output*. It was a jagged, rhythmic sine wave, pulsing at a steady 12 hertz, amplitude holding firm at 35 microvolts. It had not changed in four hours.

  Elena lay still, her body wasted from a year of immobility, her face mask-like except for the eyes. They were dark, intelligent, and currently fixed on the alphabet board suspended above her chest. She blinked once for yes, twice for no. A nurse adjusted the feeding tube, and Elena's blood pressure spiked from 110 over 70 to 145 over 90. Her pupils dilated. The corners of her mouth twitched downward in a grimace that vanished as quickly as it appeared.

  "Pain?" Aris asked.

  Elena's eyes moved to the board. *N-O.*

  "Tape?" the nurse suggested, pointing to the securing adhesive on Elena's arm.

  Elena blinked once. *Y-E-S.*

  "T-A-P-E," she spelled, blink by blink. "T-I-G-H-T."

  Aris made a note on the clipboard, though his hand hovered. The gain dial on the bridge was set to 0. At this setting, the device recorded the isolated slab of cortex behind her ear but broadcast nothing back to the thalamus. The island was singing, but the rest of the brain was deaf to it.

  Mark, the senior resident, stood on the other side of the bed, arms crossed. He was looking at the upper trace on the monitor. *Thalamic Input.* It was flat.

  "We tried 3 this morning," Mark said quietly. "She called it a dull ache. Four out of ten. She could talk about it. She could remember it five minutes later."

  "And at 6?" Aris asked.

  "She screamed," Mark said. "Well, she tried to. Her eyes went wide, she spelled 'S-T-O-P' so fast the camera missed the second blink. Blood pressure hit 180. We dropped it back to 0 within thirty seconds."

  Aris looked back at the lower trace. 12 hertz. 35 microvolts. Identical to the reading at Gain 6. Identical to now. The pain signal was being generated constantly, a fire burning in a sealed room. The dial didn't change the fire; it only opened or closed the door.

  "The physiology says she's hurting," Mark said. "The autonomic response at Gain 0 is consistent with nociceptive shock. The body knows."

  "The patient says she isn't," Aris replied. "At Gain 0, she confabulates. She attributes the distress to the tape. She constructs a narrative where she is comfortable."

  "She constructs it because she can't access the real data," Mark said. "You're asking me to discharge her on Gain 0. No bridge. No opioids beyond PRN for autonomic spikes. She'll go home telling us she's fine while her cortisol levels scream."

  "If we keep the bridge live, we have to treat the pain," Aris said. "To treat the pain at a level that matches the physiological output, we need morphine. Enough to sedate her. She won't be able to use the board. She won't be able to track movement."

  "Her daughter lands at 0600," Mark said. "That's three hours."

  Aris looked at Elena. Her eyes were tired. The blink rate had slowed. She was waiting. She didn't know about the dial, not really. She only knew what the dial allowed her to know. When the door was closed, the fire didn't exist for her. When the door was open, it was all there was.

  The dilemma sat heavy in the room, heavier than the rain. If Aris turned the dial to 3, he acknowledged the truth of the flesh. He admitted that suffering could exist in the dark, unreported and unremembered, and that it mattered. But to honor that truth, he would have to drug the woman into silence. Her daughter would arrive to find a mother asleep, drooling, unreachable for what might be the last time.

  If he left it at 0, he honored the person. The Elena who could speak, who could love, who could say *I am fine*. He accepted her report as the final authority on her state. But he would be sending her home with a body that reacted to pain even if her mind did not know why. He would be prioritizing the story over the sensation.

  "The waveform hasn't shifted," Mark said, pointing at the 12-hertz rhythm. "That's the load-bearing fact, Aris. The source is constant. The only variable is access. If you set it to zero, you aren't removing the pain. You're removing the witness."

  Aris touched the dial. It was cool plastic, numbered 0 through 6. The trial protocol expired at dawn. After that, the device locked. If he set it to 0 now, it stayed 0. If he set it to 3, the insurance mandated analgesia protocol kick in immediately.

  He looked at Elena's eyes. They were fixed on him. She didn't know the numbers. She only knew the difference between the silence and the noise. In the silence, she was whole, if incomplete. In the noise, she was fractured by agony.

  "Mark," Aris said. "Prepare the discharge papers. Gain stays at 0."

  Mark didn't move immediately. "You're sure?"

  "She told us," Aris said. "She said the tape was tight. We fixed the tape. She says she's fine."

  "The blood pressure—"

  "Is managed by the ward nurses at home. We follow the report." Aris kept his voice flat. He couldn't afford the tremor of doubt. "If suffering requires a subject to experience it, and the subject reports no experience, then there is no suffering. There is only noise."

  Mark exhaled, a sharp sound in the quiet room. He turned to the computer to log the setting. "0600 pickup. I'll tell the daughter she's been stable."

  Aris stayed by the bed. He watched the lower trace. 12 hertz. 35 microvolts. The fire burned on, indifferent to the door. He reached out and gently adjusted the tape on Elena's arm, smoothing it down so it wouldn't pull.

  Elena blinked. *T-H-A-N-K S.*

  She didn't blink for *YOU*. She ran out of energy. But the message was clear. She was present. She was here.

  Aris turned off the bedside lamp, leaving only the glow of the monitors. The rain continued to beat against the glass, masking the hum of the machine. He watched the jagged line pulse, steady and unchanging, measuring a truth that no one would ever hear. He set his hand on the dial, feeling the hard stop at zero, and left it there.

  ***

  **Post-Story Analysis**

  The ending commits to the Global Workspace view: consciousness is defined by access and report. By setting the gain to 0, Aris privileges Elena's lucid testimony over her physiological distress signals, asserting that pain without a witnessing subject is morally negligible. The strongest objection is that this ignores the reality of the isolated cortex; the identical waveform proves the nociceptive experience exists independently of broadcast, meaning Aris has chosen to ignore silent torture for the sake of social connection, treating the patient as a narrator rather than a living organism.
