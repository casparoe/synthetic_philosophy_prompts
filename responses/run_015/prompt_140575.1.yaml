answer: |-
  During the compliance training dry-run, the auditor walked the team through a hypothetical flagging scenario to test the reporting software's rules. She noted that if the system marks it as more likely than not that filing the retrospective amendment without prior approval was wrong, then it must also mark it as more likely than not that submitting the unamended data was wrong, since the protocol guidelines establish that the submission necessarily involves the amendment. She then pointed out that the system currently flags the amendment issue as more likely than not wrong based on the timestamp discrepancy. Consequently, she concluded, it follows that submitting the unamended data is more likely than not wrong, ensuring consistency across the audit trail, regardless of whether anyone actually believes either action was unethical.

  ### The Demonstration

  **(a) Simple emotivism**
  Simple emotivism cannot state the argument. On this view, "filing... was wrong" expresses a feeling ("Boo filing!") and lacks propositional content. The phrase "it is more likely than not that..." functions as a propositional operator; it requires a content that can be probable. Since "filing was wrong" has no truth-apt content for the probability operator to scope over, the sentence "it is more likely than not that filing was wrong" is semantically ill-formed, akin to saying "it is probable that boo!" The theory lacks the resources to represent the premises, let alone explain the validity. To recover, it would need to abandon the claim that normative sentences lack descriptive content entirely.

  **(b) Higher-order-attitude quasi-realism**
  Quasi-realism can state the argument only by stretching the notion of an attitude. It treats "wrong" as expressing a state of disapproval. To handle "more likely than not," it must posit a higher-order attitude regarding degrees of confidence in disapproval—for instance, being more confident in one's disapproval of the amendment than of some baseline. It explains validity as the incoherence of holding this degree of confidence in the amendment's wrongness, acknowledging the entailment to the data submission, yet withholding that degree of confidence from the submission. However, this explanation is strained. Standard quasi-realism explains validity via logical consistency between binary attitudes (accepting/rejecting). Probabilistic validity relies on the mathematical properties of confidence degrees (monotonicity). To explain this, the theory must add a formal structure to attitudes isomorphic to probability calculus. It must treat attitudes as having magnitudes that obey axioms of probability, effectively importing the representational machinery it seeks to avoid.

  **(c) Hybrid expressivism**
  Hybrid expressivism handles the case seamlessly. It assigns "filing was wrong" a truth-conditional content (e.g., *that filing violates norm N*) alongside an expressive component. The operator "more likely than not" scopes over the truth-conditional content. The argument is valid because it preserves truth: if it is true that the probability of the violation exceeds 0.5, and the submission entails the violation, it is true that the probability of the submission violating the norm exceeds 0.5. The expressive component (the attitude) plays no role in the validity explanation. The theory requires no additions; it treats normative vocabulary in non-Boolean contexts exactly as it treats descriptive vocabulary, leveraging standard semantics for probability operators.

  ### The Diagnosis

  The load-bearing feature of the case is the **non-Boolean probabilistic operator** ("more likely than not"). If this operator is replaced by a Boolean conditional (e.g., "If filing was wrong, then submitting was wrong"), the argument collapses into a standard Frege–Geach modus ponens case. In that Boolean scenario, quasi-realism (b) survives because it can explain validity through the inconsistency of holding premise-attitudes while lacking the conclusion-attitude (a binary logical relation). The probabilistic operator breaks this binary model. It demands an account of *degrees* of normative commitment that track mathematical relations between contents, not just logical relations between attitudes. Without the probabilistic operator, the pressure to attribute propositional content to normative sentences is significantly lower, allowing (b) to distinguish itself from (c) via the attitudinal explanation of validity. With the operator, (b) is forced to model attitudes as proposition-like entities to capture the formal properties of probability.

  ### The Counterattack

  The quasi-realist's strongest reply is to deny that probability operates on propositions. Instead, they argue that "it is more likely than not that X is wrong" expresses a complex, non-cognitive state: a degree of disapproval toward X that exceeds a certain threshold of confidence. They claim the right to talk about "probability" expressively, just as they earn the right to talk about "truth." On this view, the validity of the argument rests on the structural constraints of rational attitude-formation: it is irrational to have a high degree of disapproval toward A, know A entails B, and not have a high degree of disapproval toward B.

  This reply restores (b)'s ability to handle the case, but it dissolves the distinction between (b) and (c). If the "degrees of disapproval" must obey the probability calculus to ensure validity, they function identically to credences in normative propositions. The explanatory work is being done by the formal structure of the content (the probability relations), not by the nature of the attitude (disapproval). By conceding that attitudes must have propositional structure to sustain probabilistic inference, quasi-realism concedes the hybrid's central point: that representational content is doing the heavy lifting in logical embedding, leaving the attitudinal component as an add-on rather than the foundation of meaning.

  ### The Verdict

  Hybrid expressivism (c) comes out best on this case. It accommodates the inference without requiring ad hoc expansions of the theory of attitudes or strained analogies between logical consistency and probabilistic coherence. This is not a reason to suspect the case is rigged, but rather a reason to locate the true difficulty of the Frege–Geach problem. The four constraints are jointly satisfiable; Constraint 4 (no attitudes) is met by the institutional context of a dry-run, where reasoning is simulated rather than enacted. Constraint 3 (non-Boolean operator) is the critical stressor. It reveals that while quasi-realism can handle Boolean embeddings via higher-order consistency, it struggles to account for non-Boolean embeddings without adopting the truth-conditional machinery it opposes. The case suggests that the "hard part" of Frege–Geach is not embedding per se, but embedding under operators that require propositional content to sustain formal relations beyond simple consistency.
