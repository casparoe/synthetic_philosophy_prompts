  Write on **The Scope Question**. Title: "Scheffler's Ceiling: Why the Afterlife Conjecture Does Not Support Longtermism." Argue that the psychological dependency Scheffler identifies saturates once survival is secured, failing to scale with population size. Use the Floor Case to show that a capped future undermines present meaning just as much as extinction, implying we care about continuity, not magnitude. Your argument should proceed by showing that the "collective afterlife" is a binary condition (exists/does not exist) rather than a scalar one.
  **First Objection:** The "Demoralization Objection." Critics will argue that learning about the Floor Case *would* demoralize us almost as much as Doomsday, so the conjecture holds. You must reply that demoralization stems from the *end* coming, not the *size* being small, proving the conjecture is about extinction, not scale. This keeps the paper focused on the seminar's core tension.
