  **Assumptions about the conjecture**
  Scheffler's Afterlife Conjecture posits that the meaningfulness of many present activities depends constitutively on the expectation that humanity will survive indefinitely after our deaths. This is not a claim about personal immortality, nor strictly about being remembered by specific successors. Rather, it suggests a structural dependency: our confidence in the value of our projects (even solitary ones like reading poetry) relies on the background condition of a "collective afterlife." The conjecture is hybrid: it makes a psychological prediction (we would feel devastated by the end of humanity) that implies a normative conclusion (our values are actually dependent on this continuity). For your purposes, treat it as a claim about the *conditions of value*, not just the psychology of loss. Crucially, Scheffler distinguishes between the "Doomsday" scenario (immediate extinction) and the "Infertility" scenario (no new births), using both to isolate the dependency on future generations rather than personal survival. You should assume the conjecture is true for the sake of your paper, focusing entirely on its scope and implications.

  **Criteria and trade-offs**
  I am ranking questions based on three criteria: downstream impact (how much ethical theory hangs on the answer), tractability (can you resolve it conceptually in 25 pages?), and neglectedness (are others ignoring it?). The primary trade-off is between foundational clarity and practical relevance. The "Value vs. Motivation" question is most foundational but risks becoming meta-ethical bogland unsuitable for a seminar on existential risk. The "Scope" question (Floor) is highly relevant to your seminar's theme and is tractable via thought experiment. I prioritize questions that intervene in the specific discourse of your seminar (Longtermism) over general meta-ethics. A question moves up if it threatens the standard uptake of Scheffler in effective altruism; it moves down if it requires empirical psychology you cannot access. The goal is to maximize the probability that your paper changes how peers apply Scheffler, not just how they interpret him. You must avoid topics that require resolving deep meta-ethical disputes about realism versus expressivism to make progress.

  **The ranked shortlist**
  1.  **The Scope Question (The Floor Case):** Does the conjecture require a *vast* future or merely *some* future? This is priority one because it determines whether Scheffler supports Longtermism (maximizing future lives) or merely Existential Risk reduction (preventing extinction). If the conjecture holds for the Floor case (1M people), it severs the link between Scheffler and "astronomical waste" arguments. This is upstream of all population ethics discussions in the seminar. If you prove Scheffler only cares about continuity, you deflate the motivation for maximizing population size, which is a major pillar of current longtermist thought. This topic is highly tractable because it relies on comparing intuitions about two cases (Doomsday vs. Floor) rather than building new theory.
  2.  **The Content Question (The Amnesia Case):** Must the future inherit our values, or just our biology? This is priority two. If mere biological succession suffices, the conjecture supports a bio-conservative view. If cultural continuity is required, it supports a preservationist view. This is upstream of debates about moral progress versus conservation. If the future must remember us, Scheffler aligns with legacy views; if not, he aligns with stewardship. This distinction dictates whether we should prioritize preserving records or ensuring survival. It is slightly less urgent than Scope because it concerns the *quality* of the future rather than the *quantity*, which is less central to existential risk calculus.
  3.  **The Ontology Question (Value vs. Motivation):** Is the loss axiological or psychological? This is priority three. While foundational, resolving this often stalls at "intuition versus intuition." It is upstream of whether the conjecture provides *reasons* or just *causes*. I rank it lower because you can bracket it to argue about the *implications* of the conjecture even if its metaphysical status is unclear. However, if you cannot resolve whether the loss is real, you cannot claim extinction is objectively worse, only that we feel it is. This limits the normative force of your conclusion, making it less suitable for a paper aiming to critique Longtermist policy implications.

  **The Floor and Amnesia cases adjudicated**
  In the **Floor Case**, the conjecture likely fails to generate the same loss of confidence. Scheffler's examples rely on the *indefinite* continuation of human forms of life. A capped future (1M people) functions more like a delayed Doomsday. If this is right, Scheffler does not support the Longtermist claim that a larger future is *more* valuable, only that *some* future is necessary. This matters because it limits Scheffler's utility to negative utilitarianism-style risk reduction, not positive population growth. It suggests the "afterlife" value saturates. The intuition is that meaning requires an open horizon, not necessarily a crowded one. If the horizon closes after ten thousand years, the "collective afterlife" is effectively denied, undermining the value saturation point.

  In the **Amnesia Case**, the conjecture likely holds only if some structural continuity exists. If successors are human but share no concepts with us, our projects (like writing philosophy papers) lose their point entirely. This suggests the "afterlife" must be cultural, not just biological. This matters because it implies we should care about *what* survives, not just *that* something survives. It shifts the focus from existential risk to cultural preservation. If the Amnesia case fails, Scheffler is not about humanity per se, but about *our* humanity. This creates a tension: if we need cultural continuity, we might need to prevent moral progress that severs ties with the past, a conservative implication Scheffler may not intend.

  **Implications I should drop**
  You are right to drop the claim that the conjecture gives **individual reasons to have children**. Scheffler's argument is collective; my individual child contributes negligibly to the collective afterlife, so the incentive structure doesn't scale down to individual reproductive ethics. You are also right to drop **astronomical badness**. Scheffler argues extinction voids meaning, not that it subtracts utility sums; the badness is structural, not aggregative. Similarly, drop the **population ethics bypass**. The conjecture still relies on the existence of future people; it does not solve non-identity problems or justify creating lives below a welfare threshold. It presupposes the value of future lives rather than grounding it. However, do not drop the **Extinction versus Transformation** distinction. This is the strongest implication. If the afterlife requires continuity of form, a successor civilization that radically transforms humanity might void the afterlife just as much as extinction. This deserves retention because it challenges the assumption that any post-human future secures our values. It suggests value lock-in might be necessary for the afterlife conjecture to hold.

