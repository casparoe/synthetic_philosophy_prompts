answer: |-
  To attribute politics without anthropomorphizing objects or mind-reading designers, run this three-step subtraction test. It isolates where the constraint originates.

  **1. The Substitution Test**
  Ask: *Could a different tool achieve the institution's stated goal without producing this effect?*
  *   **Sufficient Answer:** Yes (e.g., a different algorithm could optimize rosters without split shifts). **Attribution:** ARTIFACT or ARRANGEMENT.
  *   **Sufficient Answer:** No (e.g., any tool under this budget creates split shifts). **Attribution:** INSTITUTION.
  *   **Stop Early:** If the effect persists across all feasible tools, do not blame the artifact.
  *   **Copy Phrase:** "The tool enables this outcome, but does not require it."

  **2. The Resistance Test**
  Ask: *Does the tool physically or logically prevent users from avoiding the effect without breaking the system?*
  *   **Sufficient Answer:** Yes (e.g., the battery physically refuses charge without the app). **Attribution:** ARTIFACT.
  *   **Sufficient Answer:** No (e.g., users could contest the flag, but policy forbids it). **Attribution:** INSTITUTION.
  *   **Copy Phrase:** "The code forecloses this option entirely."

  **3. The Upkeep Test**
  Ask: *Does the political effect depend on a continuing relationship with a third party who can withdraw support?*
  *   **Validation:** Your distinction is real. It captures *dependency politics* rather than design politics. It applies when the artifact is static but the *condition of its functionality* is leased.
  *   **Sufficient Answer:** Yes (e.g., servers go dark, bricks become paperweights). **Attribution:** UPKEEP.
  *   **Copy Phrase:** "Functionality relies on a vendor's survival."

  **Case Applications**

  1.  **Transit Rostering:** The vendor optimizes for constraints; the authority sets constraints. A different optimizer could prioritize stability over pure coverage within the same budget. The tool enables the cuts, but the budget mandates them. Users cannot resist without breaking the scheduling system, but the system itself doesn't mandate the *unpaid gaps*—the contract does.
      *   **Label:** ARRANGEMENT.
      *   **Sentence:** "The algorithm executes the budget's priorities, making the cuts legible but not inevitable."

  2.  **E-Bike Battery:** The battery functions physically but is logically locked. Substitution is impossible (proprietary lock). Resistance is impossible (hardware refusal). Crucially, the effect emerges only when the vendor relationship breaks. The politics lie in the dependency, not just the lock.
      *   **Label:** UPKEEP.
      *   **Sentence:** "Ownership ends where the vendor's solvency begins."

  3.  **AI Detector:** The model produces false positives for non-native speakers (Artifact bias). However, the *harm* (standing lowered) occurs because the university treats the score as uncontestable truth (Institution policy). A different tool might be more accurate, but any tool used without appeal processes produces this harm. The tool creates the noise; the institution amplifies it to punishment.
      *   **Label:** ARRANGEMENT.
      *   **Sentence:** "The detector generates the error, but the university enforces it as fact."
      *   **Note:** You cannot defensibly write "the detector itself is the thing doing the harm" because the harm requires the institutional rule of "no contest." The detector creates risk; the institution creates the penalty.

  **Limitations**
  This procedure cannot resolve disputes over the *comparison class* (what counts as a "different tool") or whose options matter. Choosing whether "stability" is a valid goal compared to "coverage" is a values question, not a factual one; the procedure hands that back to you. It also struggles with *emergent* effects where the artifact changes user behavior so profoundly that the institution adapts to the tool rather than vice versa. In those loops, attribution is necessarily mutual. Finally, an editor must decide if "Arrangement" is too nuanced for a headline; sometimes "Artifact" is a necessary shorthand for "Sociotechnical System," but you now know it is technically imprecise.

  \answer{ARRANGEMENT}
