answer: |-
  # Diagnostic Taxonomy: Paradigm Shifts and Incommensurability

  **Root Commitment:** Scientific change is not purely cumulative; there are episodes in which core theoretical terms, evaluation standards, and ontological commitments shift together in ways that resist simple translation.

  ---

  ### Branch Point 1: Scope of Discontinuity
  **Claim:** The incommensurability observed in scientific change is best characterized as:
  *   **(A) Localized:** Restricted to a specific cluster of interdefined theoretical terms within a specialty, leaving the broader disciplinary matrix intact. *(Proceed to Branch Point 2)*
  *   **(B) Global:** Permeating the entire disciplinary matrix, altering the worldview, standards, and problems recognized by the community as a whole. *(Proceed to Branch Point 3)*

  ---

  ### Branch Point 2: Local Discontinuity Type
  **Claim:** Within this localized cluster, the primary barrier to translation is:
  *   **(A) Semantic:** Rooted in shifts of reference and meaning (terms denote different entities or properties). *(Proceed to Branch Point 4)*
  *   **(B) Ontological/Methodological:** Rooted in shifts of posited entities, structures, or standards of explanation (what exists or how we justify it changes). *(Proceed to Branch Point 5)*

  ---

  ### Branch Point 3: Global Discontinuity Type
  **Claim:** Within this global matrix, the primary barrier to translation is:
  *   **(A) Semantic:** Rooted in shifts of reference and meaning (the language itself partitions the world differently). *(Proceed to Branch Point 6)*
  *   **(B) Ontological/Methodological:** Rooted in shifts of posited entities, structures, or standards of explanation (the world experienced by the practitioner changes). *(Proceed to Branch Point 7)*

  ---

  ### Branch Point 4: Local-Semantic Resolution Mechanism
  **Claim:** When semantic shifts occur locally, conflict between competing terms is resolved by:
  *   **(A) Neutral Arbitration:** Appeal to theory-neutral data or computational simulations that function as independent arbiters of reference. *(Leaf 1)*
  *   **(B) Internal Conversion:** Appeal to pragmatic utility or coherence within the specific theory, where simulations are shaped by the very terms they evaluate. *(Leaf 2)*

  ---

  ### Branch Point 5: Local-Ontological Resolution Mechanism
  **Claim:** When ontological or methodological shifts occur locally, conflict between competing structures is resolved by:
  *   **(A) Neutral Arbitration:** Appeal to theory-neutral data or computational simulations that function as independent arbiters of existence. *(Leaf 3)*
  *   **(B) Internal Conversion:** Appeal to pragmatic utility or coherence within the specific theory, where simulations are shaped by the very ontology they evaluate. *(Leaf 4)*

  ---

  ### Branch Point 6: Global-Semantic Resolution Mechanism
  **Claim:** When semantic shifts occur globally, conflict between competing worldviews is resolved by:
  *   **(A) Neutral Arbitration:** Appeal to theory-neutral data or computational simulations that function as independent arbiters of truth. *(Leaf 5)*
  *   **(B) Internal Conversion:** Appeal to pragmatic utility or gestalt conversion, where simulations are shaped by the very worldview they evaluate. *(Leaf 6)*

  ---

  ### Branch Point 7: Global-Ontological Resolution Mechanism
  **Claim:** When ontological or methodological shifts occur globally, conflict between competing worlds is resolved by:
  *   **(A) Neutral Arbitration:** Appeal to theory-neutral data or computational simulations that function as independent arbiters of reality. *(Leaf 7)*
  *   **(B) Internal Conversion:** Appeal to pragmatic utility or gestalt conversion, where simulations are shaped by the very reality they evaluate. *(Leaf 8)*

  ---

  ### Terminal Leaves: Position Diagnosis

  **Leaf 1 (Local-Semantic + Neutral Arbitration)**
  *   **Position Name:** Local Referential Realism.
  *   **Diagnosis:** Maintains that while terms shift, a neutral computational or observational ground preserves reference continuity. Attractive for preserving progress, but risks underestimating theory-ladenness of data.

  **Leaf 2 (Local-Semantic + Internal Conversion)**
  *   **Position Name:** Local Semantic Relativism.
  *   **Diagnosis:** Holds that meaning is use-bound; simulations cannot arbitrate reference externally. Coherent, but may render local theory choice irrational.

  **Leaf 3 (Local-Ontological + Neutral Arbitration)**
  *   **Position Name:** Local Structural Realism.
  *   **Diagnosis:** Argues that while specific entities change, structural relations captured by neutral simulation remain constant. Strong candidate for reconciling change with realism.

  **Leaf 4 (Local-Ontological + Internal Conversion)**
  *   **Position Name:** Local Methodological Pragmatism.
  *   **Diagnosis:** Ontology is secondary to problem-solving efficacy; computational tools are judged by utility, not truth. Stable position, often adopted by working scientists.

  **Leaf 5 (Global-Semantic + Neutral Arbitration)**
  *   **Position Name:** Universal Translationism.
  *   **Diagnosis:** Asserts a universal conceptual scheme exists (via neutral simulation) allowing global comparison. Logically possible but historically unattractive given evidence of worldview shifts.

  **Leaf 6 (Global-Semantic + Internal Conversion)**
  *   **Position Name:** Global Linguistic Relativism.
  *   **Diagnosis:** Language constitutes the world; no neutral ground exists. Consistent but risks making cross-paradigm debate impossible.

  **Leaf 7 (Global-Ontological + Neutral Arbitration)**
  *   **Position Name:** Simulation-Based Realism (Unnamed/Niche).
  *   **Diagnosis:** Posits that large-scale computation provides a "view from nowhere" capable of adjudicating global ontological shifts. Gap reflects neglect: few argue simulation is truly paradigm-independent.

  **Leaf 8 (Global-Ontological + Internal Conversion)**
  *   **Position Name:** Ontological Pluralism (World-Making).
  *   **Diagnosis:** Different paradigms inhabit different worlds; resolution is sociological or psychological. Coherent, but demands acceptance of multiple "realities."

  ---

  ### Diagnostic Flags & Overlaps

  **1. Substantive Overlap: Leaf 1 vs. Leaf 3**
  *   **Overlap:** The tree's branching logic separates Semantic (Leaf 1) from Ontological (Leaf 3) discontinuities. However, if one holds that reference is determined by ontological commitment (a common view), these two leaves describe the same position.
  *   **Nature:** Substantive. The distinction relies on a separation of meaning and existence that many realists reject. A respondent endorsing Leaf 1 should be queried on whether they believe reference can shift without ontological change.

  **2. The Computational Injection**
  *   **Note:** Branch Points 4 through 7 explicitly force a stance on computational simulation. Standard positions (e.g., Leaf 6 or 8) rarely make explicit whether they view data-modeling as neutral or embedded. This tree forces the respondent to reveal whether they treat simulation as a *transcendent arbiter* (Branch A options) or an *immanent practice* (Branch B options). This often exposes hidden realist commitments in those who claim to be relativists, or vice versa.

  **3. Unoccupied Logical Space**
  *   **Leaf 5 (Universal Translationism):** This space is largely unoccupied in contemporary literature. The combination of *Global* discontinuity with *Neutral Arbitration* is unstable; if the discontinuity is truly global, the neutral ground required for arbitration is typically deemed unavailable. The gap reflects incoherence rather than neglect.
