prompt: |-
  I serve on the capital-projects committee of a regional public-works authority, where we evaluate infrastructure proposals whose benefits fall decades or centuries apart: a flood-defense wall, a geological carbon-storage site, and long-lived containment systems. Our staff currently collapses every comparison into a net-present-value formula using market interest rates, but that conflates pure time preference—the philosophical claim that future welfare should not be weighted less merely because it occurs later—with risk premiums, capital scarcity, and uncertainty about future populations. I want you to operationalize the principle that pure temporal discounting is unjustified (while allowing that near and distant outcomes may still diverge for other reasons) into a reusable decision procedure that a non-economist board member can run in about twenty minutes per proposal, with clear sign-off authority resting with the committee chair. The deliverable should be a step-by-step flowchart in words: the ordered questions, what counts as a sufficient answer to continue, where the procedure halts with a recommendation, and where it explicitly hands the decision to a person because the issue is one of values rather than facts.

  Please construct the procedure so it separates adjustments for pure time preference from adjustments for physical risk, intergenerational equity, and the possibility that beneficiaries will not exist, then apply it to three cases: (a) a seawall with benefits concentrated in thirty years; (b) a carbon-capture and mineralization project whose climate benefits are measurable only after 120 years and require continuous cross-generational maintenance funding; and (c) a nuclear-waste containment retrofit that costs present taxpayers heavily but delivers safety benefits almost entirely beyond 200 years—a case where I expect the procedure will recommend funding yet the board will find the result politically intolerable. For each case show the procedural path and mark any point where judgment must override mechanics. Then identify two structural misfires—scenarios in which following the checklist mechanically yields a recommendation that clashes with common moral intuition—and clarify whether each misfire indicts the underlying principle or only this institutional translation. Be explicit about which steps are genuine tests and which are judgment calls disguised as boxes. End with a one-sentence summary on its own line beginning with 'Bottom line:' that states the single most important limitation of turning pure time preference into an institutional checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Capital-projects committee of a regional public-works authority.
      *   **Problem:** Current NPV analysis uses market interest rates, conflating pure time preference with risk, scarcity, and uncertainty. The user believes pure temporal discounting is unjustified (zero pure time preference).
      *   **Goal:** Create a reusable decision procedure (flowchart in words) for non-economist board members (20 mins/proposal).
      *   **Authority:** Sign-off rests with the Committee Chair.
      *   **Requirements:**
          *   Separate pure time preference from physical risk, intergenerational equity, and existence risk.
          *   Apply to three specific cases: (a) Seawall (30 yrs), (b) Carbon Capture (120+ yrs, maintenance needed), (c) Nuclear Waste (200+ yrs, high present cost, political intolerance expected).
          *   Show procedural path and mark judgment overrides.
          *   Identify two structural misfires (mechanical recommendation vs. moral intuition) and analyze if it indicts the principle or the translation.
          *   Distinguish genuine tests vs. judgment calls disguised as boxes.
          *   **Ending:** One-sentence summary on its own line starting with "Bottom line:".

  2.  **Deconstruct the Ethical/Economic Principle:**
      *   *Ramsey Rule / Intergenerational Equity:* Pure time preference ($\delta$) should be zero. We shouldn't value a life in 2100 less than a life in 2024 *just* because of the date.
      *   *Discounting still happens for:*
          *   Probability of existence (will the beneficiaries be there?).
          *   Probability of project failure (physical risk).
          *   Marginal utility of consumption (will they be richer/poorer than us?).
      *   *The Challenge:* How to make this a 20-minute checklist without complex modeling? It needs heuristics.

  3.  **Drafting the Decision Procedure (The Flowchart):**
      *   *Step 1: Categorize Time Horizon.* Is it short (<50), medium (50-100), or long (>100)? This triggers different scrutiny levels.
      *   *Step 2: Strip Market Rates.* Explicitly reject the standard WACC (Weighted Average Cost of Capital) for the social discount rate. Use a "Social Time Preference Rate" (STPR) near zero for the pure time component.
      *   *Step 3: Adjust for Existence Risk.* Will the beneficiaries exist? (e.g., climate catastrophe might wipe them out).
      *   *Step 4: Adjust for Wealth/Marginal Utility.* Will future people be richer? If so, a dollar is worth less to them. (This is the standard argument for positive discounting even with zero pure time preference).
      *   *Step 5: Maintenance/Commitment Risk.* Can we trust future generations to maintain this? (Crucial for Case B).
      *   *Step 6: Political/Equity Check.* Who pays vs. Who benefits? (Crucial for Case C).
      *   *Step 7: Chair Sign-off.* The human override.

      *Refining for "20 Minutes":* It needs to be simpler. Let's create a "Discounting Worksheet" approach.
      *   *Phase 1: The Base Calculation.* Calculate NPV using a near-zero pure time preference rate (e.g., 0.5% or 1% representing only growth/risk, not impatience).
      *   *Phase 2: The Risk Adjustments.* Apply probability weights, not rate hikes.
      *   *Phase 3: The Equity Veto.* Check intergenerational transfer fairness.
      *   *Phase 4: The Chair's Decision.*

      *Let's structure it as a Step-by-Step Protocol.*

  4.  **Developing the Three Cases:**
      *   *(a) Seawall (30 yrs):* Standard infrastructure. Low time horizon. Market rates usually okay-ish here, but the procedure should show the shift to social rates. Likely Pass.
      *   *(b) Carbon Capture (120 yrs + maintenance):* High risk of institutional failure. Benefits distant. Procedure needs to highlight the "Maintenance Reliability" check. Likely Pass on ethics, Fail on reliability? Or Pass with conditions.
      *   *(c) Nuclear Waste (200+ yrs):* High present cost, distant benefit. Zero pure time preference makes this look *great* compared to market rates. But political intolerance is high. Procedure recommends Fund; Board says No. This highlights the "Judgment Override."

  5.  **Identifying Structural Misfires:**
      *   *Misfire 1: The "Rich Future" Assumption.* If we assume future gens are richer, we discount their benefits. But what if the project *prevents* them from being poor (e.g., climate change)? Mechanical application might undervalue existential risk reduction.
      *   *Misfire 2: The "Tyranny of the Long Tail."* With near-zero discounting, tiny probabilities of infinite/long-term harm/benefit dominate. A project with a 0.0001% chance of saving the world in 10,000 years could outweigh massive present costs. This clashes with "save lives now" intuition.
      *   *Analysis:* Does this indict the principle? Usually, it indicts the *translation* (handling tail risks) rather than the zero pure time preference itself.

  6.  **Distinguishing Tests vs. Judgment Calls:**
      *   Need to be honest. "Estimate future wealth" is a judgment call disguised as a test. "Verify maintenance contract" is a test.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Procedure Name:* The Intergenerational Neutrality Protocol (INP).
      *   *Steps:*
          1.  Horizon Sort.
          2.  Rate Selection (Remove Pure Time Preference).
          3.  Existence Probability (Not discount rate, but probability weight).
          4.  Marginal Utility Adjustment (Are they richer?).
          5.  Institutional Durability (Can they maintain it?).
          6.  Distributional Check (Who pays?).
          7.  Chair Override.

      *   *Applying to Cases:*
          *   Seawall: Passes easily.
          *   Carbon: Fails on Institutional Durability unless funded trust is set up.
          *   Nuclear: Passes math, fails politics. Chair must override or resign.

      *   *Misfires:*
          1.  *The Infinity Problem:* Low discount rates make infinite durations dominate finite costs.
          2.  *The Substitution Problem:* Assuming money compensates for lost nature/lives across centuries.

      *   *Bottom Line:* Needs to be punchy about the limitation of checklists for ethical dilemmas.

  8.  **Refining the Tone:**
      *   Professional, bureaucratic but ethically rigorous.
      *   Clear distinction between "Mechanism" and "Judgment."
      *   Adhere strictly to the formatting constraints (Flowchart in words, specific cases, misfires, specific ending).

  9.  **Self-Correction/Review against Constraints:**
      *   *20 minutes?* Keep steps high-level. Don't ask for complex modeling. Use lookup tables or binary questions where possible.
      *   *Sign-off authority?* Ensure the Chair is the final gate.
      *   *Separate pure time preference?* Yes, explicitly in Step 2.
      *   *One sentence summary?* Must start with "Bottom line:".
      *   *Flowchart in words?* Use numbered steps with "If/Then" logic.

  10. **Final Polish:** Check the "Nuclear" case analysis. The prompt says "expect the procedure will recommend funding yet the board will find the result politically intolerable." I need to ensure the procedure *does* recommend funding based on the zero pure time preference logic, highlighting the conflict.

      *Wait, one nuance:* The prompt asks to separate adjustments for pure time preference from physical risk, intergenerational equity, and possibility beneficiaries will not exist.
      *   *Pure Time Preference:* Set to 0% (or near 0% for administrative friction).
      *   *Physical Risk:* Probability of failure.
      *   *Beneficiary Existence:* Probability of civilization continuity.
      *   *Intergenerational Equity:* Marginal utility of consumption (wealth adjustment).

      *Let's build the steps around these four buckets.*

      *(Self-Correction on Misfires)*: Make sure I answer whether it indicts the principle or the translation.
      *(Self-Correction on Tests vs Judgment)*: Be explicit in the analysis section.

      *Final check on the Bottom Line:* "Bottom line: [Sentence]."

      *Let's write it.*
answer: |-
  # The Intergenerational Neutrality Protocol (INP)

  **Purpose:** To evaluate capital projects with multi-generational horizons without conflating pure time preference with risk or scarcity.
  **Time Required:** ~20 minutes per proposal.
  **Authority:** Committee Staff execute Steps 1–5; Committee Chair executes Step 6 (Final Sign-off).

  ### Part I: The Decision Procedure (Flowchart in Words)

  **Step 1: Horizon Classification**
  *   **Question:** When do the primary benefits materialize?
  *   **Options:** Short (<50 years), Medium (50–100 years), Long (>100 years).
  *   **Action:** If Short, proceed to Step 2 using a standard social discount rate (e.g., 2%). If Medium or Long, proceed to Step 2 using a **Pure Time Preference Rate of 0%**.
  *   **Stop Condition:** None. All proposals proceed.

  **Step 2: Separation of Rates (The "Pure" Test)**
  *   **Question:** Has the discount rate been stripped of impatience?
  *   **Requirement:** The rate applied to future welfare must *only* reflect expected economic growth (marginal utility of consumption) and administrative friction. It must *not* include a premium for "waiting."
  *   **Sufficient Answer:** Staff certifies the rate is derived from long-term GDP growth projections minus a risk-free baseline, capped at 1.5% for Long Horizon projects.
  *   **If No:** Return to staff for recalculation.
  *   **If Yes:** Proceed to Step 3.

  **Step 3: Existence Probability Weighting (The "Beneficiary" Test)**
  *   **Question:** What is the probability the beneficiary population will exist to receive the benefit?
  *   **Requirement:** Apply a probability multiplier (0.0 to 1.0) to the *benefit value*, not the discount rate.
  *   **Sufficient Answer:** A documented risk assessment (e.g., climate models, geopolitical stability) yielding a specific percentage (e.g., "90% chance of regional continuity").
  *   **If Probability < 50%:** Flag for Step 6 Review.
  *   **If Probability ≥ 50%:** Proceed to Step 4.

  **Step 4: Institutional Durability Check (The "Maintenance" Test)**
  *   **Question:** Is there a legally binding, funded mechanism to ensure maintenance across the benefit horizon?
  *   **Requirement:** For projects requiring active management (e.g., pumps, monitoring), a trust fund or statutory mandate must cover the full duration.
  *   **Sufficient Answer:** "Yes" with attached escrow agreement or legislation. "No" if relying on future legislative appropriations.
  *   **If No:** Recommendation defaults to **Reject** (unless Step 6 overrides).
  *   **If Yes:** Proceed to Step 5.

  **Step 5: Distributional Equity Screen (The "Payer" Test)**
  *   **Question:** Do the payers and beneficiaries belong to the same generation?
  *   **Requirement:** If Present Payers fund Future Benefits (Intergenerational Transfer), note the magnitude of the subsidy.
  *   **Sufficient Answer:** Quantified ratio of Present Cost to Future Benefit (discounted at 0% pure time preference).
  *   **Action:** Submit file to Committee Chair.

  **Step 6: Chair's Value Override (The "Judgment" Box)**
  *   **Question:** Does the mechanical recommendation violate core democratic mandates or immediate survival needs?
  *   **Action:** The Chair reviews the Step 5 ratio and Step 3 Probability.
  *   **Decision:**
      *   **Sign-Off:** Accepts the mechanical recommendation.
      *   **Veto:** Rejects the project despite positive NPV due to political or ethical constraints not captured in the model.
      *   **Requirement:** A written justification must accompany any Veto, explicitly stating which value overrides the math.

  ***

  ### Part II: Application to Cases

  #### Case (a): The Seawall (Benefits in 30 Years)
  *   **Procedural Path:**
      1.  **Horizon:** Short (<50 years).
      2.  **Rate:** Standard social rate applied (pure time preference negligible impact at this range).
      3.  **Existence:** High probability (>95%).
      4.  **Maintenance:** Standard municipal budgeting suffices.
      5.  **Equity:** Payers and beneficiaries largely overlap (current taxpayers protect current/near-future property).
      6.  **Chair:** Sign-off.
  *   **Judgment Override:** None required. The mechanics align with intuition.
  *   **Outcome:** **Approve.**

  #### Case (b): Carbon Capture & Mineralization (Benefits in 120+ Years)
  *   **Procedural Path:**
      1.  **Horizon:** Long (>100 years).
      2.  **Rate:** Pure time preference set to 0%; discounting only for expected wealth growth.
      3.  **Existence:** Moderate probability (climate tipping points create uncertainty). Benefit value weighted down by 20%.
      4.  **Maintenance:** **Critical Failure Point.** The project requires continuous monitoring for 120 years. Current law cannot bind future legislatures.
      5.  **Equity:** Present payers, future beneficiaries.
      6.  **Chair:** Reviewing Step 4 failure.
  *   **Judgment Override:** The Chair must decide if the *potential* climate benefit outweighs the *certainty* of institutional decay.
  *   **Outcome:** **Conditional Approve.** (Mechanically recommends Reject due to Step 4, but Chair may Override to Approve if a sovereign wealth fund is established to guarantee maintenance).

  #### Case (c): Nuclear-Waste Containment Retrofit (Benefits >200 Years)
  *   **Procedural Path:**
      1.  **Horizon:** Long (>200 years).
      2.  **Rate:** Pure time preference 0%. Distant safety benefits retain near-full value compared to market rates.
      3.  **Existence:** High probability (civilization likely to exist, though location may change).
      4.  **Maintenance:** Passive safety system (no active maintenance required). Step 4 Passed.
      5.  **Equity:** Extreme Intergenerational Transfer. High present cost, zero present benefit.
      6.  **Chair:** Reviewing Step 5.
  *   **Judgment Override:** **Required.** The procedure recommends **Fund** (because 0% pure time preference makes future safety valuable enough to justify high present cost). However, the Board finds asking current taxpayers to pay heavily for people 200 years hence politically intolerable.
  *   **Outcome:** **Mechanical Recommendation: Fund.** **Final Decision: Reject.** (Chair exercises Veto, citing "Democratic Consent" as a value superior to "Intergenerational Neutrality").

  ***

  ### Part III: Structural Misfires

  **Misfire 1: The "Tyranny of the Long Tail"**
  *   **Scenario:** A project costs $1 billion today to reduce a 0.01% risk of catastrophe in 1,000 years. With 0% pure time preference, the expected value of preventing that catastrophe (if the catastrophe is large enough) mathematically outweighs the present cost. The checklist recommends funding.
  *   **Intuition Clash:** Moral intuition suggests we should prioritize saving identifiable lives today over statistical lives a millennium away.
  *   **Diagnosis:** This indicts the **Institutional Translation**, not the Principle. Zero pure time preference is ethically sound, but applying it mechanically to low-probability tail events without a "threshold of urgency" creates paralysis. The checklist lacks a "Present Need" veto.

  **Misfire 2: The "Wealth Assumption" Trap**
  *   **Scenario:** Step 2 discounts future benefits because we assume future generations will be richer (diminishing marginal utility). However, the project (e.g., climate mitigation) is specifically designed to *prevent* them from being poorer. The checklist mechanically discounts the benefit based on the assumption the project renders false.
  *   **Intuition Clash:** We are undervaluing the insurance policy because we assume the house won't burn down.
  *   **Diagnosis:** This indicts the **Institutional Translation**. It is a modeling error where the discount rate depends on the project's success. The checklist treats "future wealth" as an exogenous fact rather than an endogenous variable.

  ***

  ### Part IV: Tests vs. Judgment Calls

  *   **Genuine Tests:** Step 1 (Horizon Classification), Step 4 (Existence of Escrow/Legal Mandate). These are binary, verifiable facts.
  *   **Judgment Calls Disguised as Boxes:** Step 3 (Existence Probability) and Step 2 (Expected Economic Growth). Estimating the probability of civilization existing in 200 years or the GDP growth rate over that period are not facts; they are speculative narratives presented as inputs. Step 6 (Chair's Veto) is the only honest admission of value judgment.

  Bottom line: No checklist can resolve the tension between ethical consistency across time and democratic accountability in the present without granting a human officer the explicit authority to violate the math.
