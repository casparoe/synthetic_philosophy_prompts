prompt: |-
  Karl Jaspers distinguished criminal, political, moral, and metaphysical guilt, maintaining that only political guilt applies collectively to a state or citizenry, while moral and metaphysical guilt remain strictly personal. His framework, however, does not clearly settle whether democratic regimes that inherit unjust institutional structures—such as constitutional orders founded on dispossession—carry a distinct form of structural political guilt across regime changes, or whether such inheritance reduces to present citizens' individual moral failures or to mere legal liability. What are the main open questions and lines of work in this area—specifically about diachronic transmission of collective guilt, the conditions (institutional continuity, democratic complicity, or symbolic identification) required for it, and the practical implications for reparative justice, constitutional reform, and public memorialization? Rank the two or three you think matter most for political philosophy and legal theory; defend the ordering by identifying whose stakes depend on the resolution and what makes a question tractable versus merely symbolic. Finally, say explicitly what would change your verdict—whether an argument that institutional continuity alone cannot sustain guilt, or empirical evidence that framing reparations in guilt-language undermines their legitimacy.
