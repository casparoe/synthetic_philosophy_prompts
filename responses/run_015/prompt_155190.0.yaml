      *   **Specific Lens:** The "Convertibility Trap" (welfare reduced to a fungible metric like dollars donated, making the generation mechanism self-justifying even if decoupled from actual welfare).
      *   **Core Question:** Was Sam Bankman-Fried's (SBF) risk-taking structurally incentivised by measurability bias (high-variance plays = legible donation figures) rather than just personal greed?
