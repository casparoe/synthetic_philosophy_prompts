answer: |-
  Here is a tool designed specifically for your group. It avoids philosophical jargon entirely, focusing on the intuitions your members are already expressing. Following the quiz, you will find the "Engineer's Manual": the scoring logic, the map of the logical space, and the analysis of the positions.

  ### Part 1: The "Which Freedom Matters?" Quiz

  **Instructions:** Read each scenario. Pick the answer that matches your gut reaction, not what you think sounds smart. There are no right answers.

  **1. The Oracle App**
  An app has predicted every single choice you made for a year with 100% accuracy. It didn't force you; it just knew. You felt like you were choosing the whole time. Now you look back at a choice (say, taking a walk instead of reading). Does the fact that it was predictable make it feel less like *your* choice?
  *   **A.** Yes. If it was predictable, it was already settled. I couldn't have actually done otherwise. *(Tags: Backward-Facing)*
  *   **B.** No. As long as I did what I wanted to do in the moment, the prediction doesn't change anything. *(Tags: Forward-Facing)*
  *   **C.** It depends. If the app knew because it measured my brain states, I'm worried. If it knew because it knows me well, I'm not. *(Tags: Backward-Facing)*

  **2. The Devout Daughter**
  A woman was raised in a strict religious household. She never questioned it. As an adult, she reflects and wholeheartedly endorses those values, living by them happily. Is she acting freely?
  *   **A.** Yes, she endorses them now. That's what matters. *(Tags: Forward-Facing)*
  *   **B.** No, her "endorsement" is just the programming working as intended. The origin matters. *(Tags: Backward-Facing)*
  *   **C.** She is free enough to live her life, but not free enough to be fully praised for her virtue. *(Tags: Split)*

  **3. The Ten-Year Project**
  A man spent ten years deliberately reshaping his own habits and temperament (e.g., forcing himself to be kinder). A second man was just born kind. Who is more responsible for their kindness?
  *   **A.** The self-shaper. He built his own character. *(Tags: Forward-Facing)*
  *   **B.** The born-kind man. He didn't have to fight himself; his will is more unified. *(Tags: Backward-Facing)*
  *   **C.** They are equally responsible. The outcome is what counts. *(Tags: Backward-Facing)*

  **4. The Quantum Coin**
  Imagine a woman whose deliberation contains a bit of genuine randomness. Occasionally, this noise makes her act *against* her own considered judgment (e.g., she decides to save money, but the "noise" makes her spend). Does this randomness make her *more* free?
  *   **A.** Yes, it breaks the chain of cause and effect. It opens possibilities. *(Tags: Forward-Facing)*
  *   **B.** No, that's just chaos. If she can't control it, it's not freedom. *(Tags: Forward-Facing)*
  *   **C.** It makes her less responsible for the slip-up, but doesn't change her freedom. *(Tags: Backward-Facing)*

  **5. The Two Selfish Men**
  Two people end up selfish and hurt a friend.
  *   **Man A** was manipulated by a hypnotist last Tuesday to be selfish.
  *   **Man B** was shaped slowly since childhood by selfish parents to be selfish.
  Are they equally blameworthy?
  *   **A.** Yes. Both acted on their own desires in the moment. *(Tags: Backward-Facing)*
  *   **B.** No. Man A is a victim of recent tampering; Man B is just unlucky but still accountable. *(Tags: Backward-Facing)*
  *   **C.** No. Both are victims of causes outside their control. Neither is truly blameworthy. *(Tags: Backward-Facing)*

  **6. The Eye-Level Cake**
  A guy picks the unhealthy option because the cafeteria put it at eye level. He wasn't aware of the nudge. Did he fail to exercise free will?
  *   **A.** Yes. He wasn't in control of the influences on him. *(Tags: Forward-Facing)*
  *   **B.** No. He still chose to eat it. We are always influenced by something. *(Tags: Forward-Facing)*
  *   **C.** He's responsible, but the cafeteria shares some blame. *(Tags: Backward-Facing)*

  **7. The Morning After**
  You hurt someone's feelings. Later, you feel guilty. If a scientist proved your action was determined by prior causes, does that guilt make sense?
  *   **A.** No. Guilt implies I could have done otherwise. It's pointless. *(Tags: Backward-Facing)*
  *   **B.** Yes. Guilt helps me learn and repair the relationship. It's useful. *(Tags: Forward-Facing)*
  *   **C.** Yes. I did it, so the guilt fits me, regardless of causes. *(Tags: Backward-Facing)*

  **8. The Fork in the Road**
  You are deliberating between two jobs. If the outcome was already settled by the past + laws of nature, was sitting there thinking about it a waste of time?
  *   **A.** Yes. The result was fixed. Deliberation is an illusion. *(Tags: Forward-Facing)*
  *   **B.** No. Deliberation is part of the causal chain that produces the result. *(Tags: Forward-Facing)*
  *   **C.** It feels pointless, but I can't stop doing it. *(Tags: Forward-Facing)*

  **9. The Blame Game**
  Suppose we discovered no one has "ultimate" free will. Should we stop blaming people for bad actions?
  *   **A.** Yes. Blaming is unjust without true freedom. *(Tags: Backward-Facing)*
  *   **B.** No. We should keep blaming, but only to improve behavior, not to punish. *(Tags: Forward-Facing)*
  *   **C.** No. Blaming is a natural reaction we can't and shouldn't turn off. *(Tags: Backward-Facing)*

  ***

  ### Part 2: The Engineer's Manual (Scoring & Analysis)

  #### 1. Terminology Check: Backward vs. Forward
  Your distinction holds up under pressure. In academic literature, this is often mapped as **Retrospective Desert** (Backward: does blame *fit*?) vs. **Prospective Agency** (Forward: does deliberation *work*?).
  *   **Why it works:** It explains your group's deadlock. Person 1 wants Forward (Deliberation). Person 2 wants Backward (Sourcehood/Desert). Person 3 wants Utility (Forward/Consequentialist).
  *   **The Trap:** Most philosophical positions try to sell you both jobs in one package. Your quiz reveals that people are often willing to trade one job for the other without realizing it.

  #### 2. The Scoring Logic (The Three Axes)
  Don't just count A's and B's. Tally the answers into three intuitive buckets based on the patterns above:

  *   **Axis 1: The Leeway Intuition (Could I have done otherwise?)**
      *   *High Score:* Q1-A, Q4-A, Q7-A, Q8-A. (Needs alternative possibilities).
      *   *Low Score:* Q1-B, Q4-B, Q7-B, Q8-B. (Compatibilist about possibilities).
  *   **Axis 2: The History Intuition (Does the origin of my desires matter?)**
      *   *High Score:* Q2-B, Q3-A, Q5-C. (Cares about how you got here).
      *   *Low Score:* Q2-A, Q3-C, Q5-A. (Cares only about current state).
  *   **Axis 3: The Function Intuition (Is blame about Justice or Utility?)**
      *   *High Score (Justice):* Q7-C, Q9-A, Q5-C. (Blame must be deserved).
      *   *Low Score (Utility):* Q7-B, Q9-B, Q6-C. (Blame is a tool for improvement).

  #### 3. Mapping the Logical Space
  Here is the tree of logical possibilities generated by these axes, with the philosophical positions placed within it.

  **Branch 1: Leeway Required (Incompatibilist)**
  *   **+History +Justice:** **Classical Libertarianism.** (You need open futures, clean origins, and deserve blame).
  *   **+History -Justice:** **Revisionist Libertarianism.** (You need open futures, but blame is just a tool). *Rare.*
  *   **-History +Justice:** **Agent-Causalism.** (I caused it, doesn't matter how, but I deserve blame). *Unstable.*
  *   **-History -Justice:** **Optimistic Indeterminism.** (Future is open, but blame is just social glue).

  **Branch 2: Leeway Not Required (Compatibilist)**
  *   **+History +Justice:** **Semi-Compatibilism / Deep Self.** (Determinism is fine, but manipulation undermines responsibility).
  *   **+History -Justice:** **Strawsonian Revisionism.** (Determinism is fine, history matters for excuses, but blame is about relationships, not desert).
  *   **-History +Justice:** **Simple Compatibilism.** (If you did it, you own it, regardless of past). *Often rejected as too harsh.*
  *   **-History -Justice:** **Reasons-Responsive Compatibilism.** (Freedom is just the ability to react to reasons now; blame is for calibration).

  **Branch 3: The Skeptical Branch (Hard Incompatibilism)**
  *   **All Axes High/Low:** **Hard Determinism / Hard Incompatibilism.** (No leeway, history is a trap, blame is unjust).
  *   **Leeway Low + History Low + Utility High:** **Forward-Looking Reorganization.** (No free will, keep blame only as a quarantine system).

  #### 4. Empty Rooms (Combinations Where Nobody Lives)
  *   **The "Randomness is Control" Room:** (Q4-A "Randomness adds freedom" + Q8-A "Deliberation is pointless").
      *   *Why Empty:* Incoherent. If randomness gives you freedom, deliberation *must* matter, otherwise the randomness is just noise. People who pick Q4-A almost always pick Q8-B.
  *   **The "Blame Without Agency" Room:** (Q7-C "Guilt fits" + Q8-A "Deliberation was pointless").
      *   *Why Empty:* Deeply unattractive. It claims you deserve punishment for a process that was a waste of time. Only fatalists live here.
  *   **The "History Matters Only for Others" Room:** (Q5-B "Manipulation excuses him but not me").
      *   *Why Empty:* Special pleading. Philosophically untenable, though psychologically common.

  #### 5. Diagnostic Stats
  *   **The Heavy Lifter (Most Sorting Work):** **Question 5 (The Two Selfish Men).**
      *   *Why:* This is the "Manipulation Argument." It forces a choice between "Current State" (Compatibilism) and "Historical Origin" (Incompatibilism/Deep Self). It splits the room more violently than the prediction app.
  *   **The Useless Question (Least Sorting Work):** **Question 6 (The Cafeteria Nudge).**
      *   *Why:* Almost everyone answers "B" or "C". Very few people feel that a nudge removes *all* responsibility, and very few feel it removes *none*. It clusters in the middle and doesn't discriminate well between Libertarians and Compatibilists.
  *   **The Indistinguishable Pair:** **Hierarchical Deep-Self vs. Reasons-Responsive Compatibilism.**
      *   *Why:* In 90% of cases, these two views give the same answers. Both say you are free if you act on desires you endorse (Deep-Self) *and* can respond to reasons (Reasons-Responsive).
      *   *The Wedge Case:* To separate them, you need a **"Happy Brainwashed"** case.
          *   *Scenario:* A woman is brainwashed to love her captor. She endorses this love (Deep-Self says Free). But she cannot respond to any reason to leave (Reasons-Responsive says Unfree).
          *   *The Question:* "Is the happy hostage free?" Deep-Self says Yes; Reasons-Responsive says No.

  #### 6. How to Use This at the Library
  1.  **Administer the Quiz:** Have them circle answers.
  2.  **The Reveal:** Don't give them a "You are a Compatibilist" label. Instead, draw two columns on the whiteboard: **Backward-Facing (Guilt/Desert)** and **Forward-Facing (Deliberation/Choice)**.
  3.  **Plot the Group:** Ask for a show of hands on Q5 (History) and Q7 (Guilt). Plot them on the board.
  4.  **The Intervention:** Point out the clusters. "Look, half of you want Free Will to protect your guilt (Backward), and half of you want it to protect your deliberation (Forward). No wonder you're arguing. You aren't buying the same product."
  5.  **The Challenge:** Ask the Backward group: "If we give you Desert but take away Deliberation (Fatalism), are you happy?" Ask the Forward group: "If we give you Deliberation but take away Desert (Revisionism), are you happy?"

  This forces them to see that "Free Will" is not a single switch, but a bundle of features that might not come together in one package.
