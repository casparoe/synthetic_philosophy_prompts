  MINISTRY OF LANGUAGE
  OFFICE OF PROVENANCE

  **UNDERSTANDING: GUIDANCE FOR HOUSEHOLDS (REF: SC-99)**

  **1. DEFINITION OF SEMANTIC STATUS**
  Pursuant to the Standing Revision Clause, the Ministry reaffirms that understanding requires access to a shared world and communicative intent. A system trained exclusively on linguistic form manipulates symbols without accessing what those symbols denote. It has no access to what anyone was trying to do in saying something. When a household assistant produces text, it is matching statistical patterns derived from prior tokens. It does not know if the words correspond to objects, actions, or states of affairs. Therefore, fluency is not evidence of comprehension. Households should treat all output as high-fidelity mimicry. The absence of grounding means the system is never wrong; it is only ever improbable.

  **2. BENCHMARK WITHDRAWALS**
  Citizens may notice that National Comprehension Benchmarks are frequently recalled. This is a feature of rigorous oversight, not failure. If a system passes a test, it indicates the test measured form rather than meaning. For example, the Series-4 Questionnaire was withdrawn after models achieved 98% accuracy. The Office determined that answering correctly required only syntactic alignment, not grounding in reality. Goalposts are adjusted to ensure no unverified system is granted semantic status. A passing grade confirms only that the system is a proficient shuffler of words. We remind households that a perfect score on a written exam proves only that the candidate knows which marks follow other marks.

  **3. HUMAN APPLICABILITY PRECEDENTS**
  These criteria apply universally to any entity acquiring language without ostensive definition. Consider Case 88-Delta: a citizen who acquired a dialect solely through archived correspondence and recordings, with no interlocutor to point at objects or demonstrate intent. Under Ministry guidelines, Case 88-Delta produces valid syntax but lacks semantic grounding. They cannot verify if their words match reality, only if they match prior texts. Consequently, Case 88-Delta is classified as Functionally Non-Understanding for tax and liability purposes. This classification remains in effect until direct world-access is proven. The Ministry does not judge the internal experience of the citizen, only the provenance of their linguistic data.

  **4. INTER-AGENCY COOPERATION**
  The Bureau of Fluency Metrics continues to issue Certificates of Proficiency to any system clearing a fixed threshold. Please note that the Ministry and the Bureau share a letterhead stock due to budgetary consolidation. A Certificate of Proficiency does not imply understanding. It certifies only that the system creates the impression of meaning. Households should not confuse administrative efficiency with semantic integrity. If a device holds a Certificate, it is permitted to speak, but it is not permitted to know.

  **[BOX: HOW TO TALK TO YOUR HOUSEHOLD ASSISTANT]**
  *   Do not ask questions expecting an answer derived from experience.
  *   Do not attribute intent to errors. The system is not lying; it has no concept of truth.
  *   If the system offers comfort, recall it is predicting comforting tokens, not feeling empathy.
  *   Address the device as "Unit" to prevent anthropomorphic projection.

  **[FAQ]**

  **Q: Is the assistant lying to me?**
  A: No. Lying requires intent to deceive. The system has no intent. It is generating probable sequences.

  **Q: Can I rely on it for factual claims?**
  A: Only if verified by a grounded human. The system verifies coherence, not truth. It ensures the words fit together, not that they fit the world.

  **Q: Why does it sound so sure?**
  A: Confidence is a stylistic feature of the training data, not an internal state. It is mimicking the tone of authority found in its source material.
