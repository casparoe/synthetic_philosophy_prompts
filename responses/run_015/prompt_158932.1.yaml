prompt: |-
  I sit on a volunteer board that reviews applications for early release, and almost everything we do turns on why the applicant acted as she did: whether she now grasps the harm, whether she has stopped making excuses, whether the same pressure would produce the same act again, whether her account of her own reasons has changed. The trial that sent her there ran on what looks like the opposite principle. As I read the transcripts, the prosecution had to prove nothing about her ultimate reasons, and the jury was directed that a good motive is no defence and a bad motive no aggravation — the person who kills to end suffering commits murder, the person who steals to feed her children commits theft.

  Yet the system is not consistent about this, and I would like the implicit theory reconstructed rather than defended or attacked. It cares intensely about whether she meant the result, foresaw it, or acted in order to bring it about; burglary requires an ulterior purpose; duress and self-defence are available only if the threat or the attack was what actually moved her, so that someone who would have acted anyway gets nothing; an honest and reasonable mistake about the facts generally excuses, while a mistake about the law generally does not; penalty-enhancement statutes add years precisely for reasons of bigotry; and in general no one may claim payment for doing what one was already legally bound to do, even as the same system pays bounties to informants and honours those who did more than was required of them.

  So: what view of blameworthiness — or of the worth of an action, or of credit — does the trial-side doctrine presuppose? Does it presuppose that the moral standing of what someone does is fixed by the act itself and by what was foreseen, and not at all by why? Or can a view on which the reasons a person acts from are central explain the doctrine some other way — as caution about evidence, or as a limit on what the state may coercively inquire into? Please keep separate three questions I keep running together: whether the act was wrong, whether the agent is blameworthy, and whether the agent deserves credit. Tell me which of them the doctrine is actually about, and whether the trial and my board are answering different ones.

  One refinement I have been unable to shake. It seems to me that what matters may not be which reason the agent happened to have, but whether the right-making reason was load-bearing: would she have done the same thing if that reason had been absent? Consider a lifeguard who rescues a rival only in order to beat him later; a cashier watched by a camera who would have given correct change anyway; and someone who does the right thing while sincerely believing it to be wrong. Does the doctrine's implicit theory have any resources for these, or does it simply refuse the question?

  I do not want a recommendation about any case, and I do not need citations or readings. I want the implicit theory stated plainly, the rival views it quietly rules out identified, the places where the practice is underdetermined and several theories would license it marked as such, and an account of what would have to change in courtroom practice — and on my board — if we replaced the implicit view with one on which the reasons a person acts from are what matter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A volunteer board member reviewing early release applications (parole board equivalent).
      *   **Context:** Contrasts the board's focus (motives, reasons, rehabilitation, "why she acted") with the trial system's focus (actus reus, mens rea, strict liability regarding motive).
      *   **Observation:** The trial system claims motive doesn't matter (good motive $\neq$ defense, bad motive $\neq$ aggravation), *but* the user notes many exceptions (intent, ulterior purpose, duress, mistake, hate crime enhancements, pre-existing duty rule).
      *   **Task:** Reconstruct the *implicit theory* of the trial-side doctrine. Do not defend or attack it.
      *   **Specific Questions to Address:**
          1.  What view of blameworthiness/worth/credit does the trial doctrine presuppose?
          2.  Is it about the act itself/foresight vs. reasons? Or is it about evidentiary caution/state limits?
          3.  Distinguish three concepts: Wrongness of act, Blameworthiness of agent, Credit for agent. Which is the trial about? Are the trial and board answering different questions?
          4.  Address the "load-bearing reason" refinement (counterfactual dependence on the right reason).
          5.  Identify rival views ruled out.
          6.  Mark underdetermined areas.
          7.  Describe what would change in courtroom/board practice if the "reasons matter" view replaced the implicit view.
      *   **Constraints:** No case recommendations, no citations/readings, plain statement of theory.

  2.  **Deconstruct the Trial-Side Doctrine (The "Implicit Theory"):**
      *   *Core Principle:* The law judges the *choice to violate a norm*, not the *moral quality of the motivation* behind that choice (with specific exceptions).
      *   *Mens Rea vs. Motive:* The law cares about *intent* (purpose/knowledge) regarding the *elements of the offense*, not the *ulterior motive* (why they wanted that result).
      *   *The "Why":* The trial system treats "motive" as distinct from "intent." Intent = I meant to do X. Motive = I did X because of Y.
      *   *The Implicit Theory:* **Legal Moralism constrained by Liberal Neutrality and Administrative Feasibility.**
          *   It presupposes that the *wrongness* of the act is defined by the violation of the sovereign's command (the law), not by the agent's internal moral calculus.
          *   It separates *culpability* (did you knowingly break the rule?) from *character assessment* (are you a bad person?).
          *   It treats the *agent* as a rational chooser who is responsible for the choice to break the law, regardless of the emotional or moral pressure leading to that choice (unless specifically excused like duress).

  3.  **Address the Three Questions (Wrongness, Blame, Credit):**
      *   *Wrongness of Act:* The trial determines this primarily. Did the act fit the prohibited description?
      *   *Blameworthiness:* The trial determines *legal* culpability (guilt), which is a proxy for blameworthiness but narrowly defined. It asks: "Is this violation attributable to you as a responsible agent?"
      *   *Credit:* The trial generally ignores this (except in sentencing mitigation or specific defenses).
      *   *Board vs. Trial:* The Board asks about *moral rehabilitation* and *future risk* (character/motive). The Trial asks about *past violation* and *attribution* (act/intent). They are answering different questions.

  4.  **Analyze the Inconsistencies (The "Exceptions"):**
      *   *Intent/Purpose:* Required for specific crimes. This isn't "motive" in the legal sense; it's part of the *definition* of the act.
      *   *Duress/Self-Defense:* These are *justifications* or *excuses*. They admit the act was wrong but negate culpability due to external pressure.
      *   *Hate Crimes:* This *is* motive-based punishment. It treats the *reason* as an element of the harm (social terror).
      *   *Pre-existing Duty:* This is about *consideration* (contract law) or *causation* (torts/criminal omission). It prevents rewarding what would have happened anyway.
      *   *Synthesis:* The system isn't inconsistent; it distinguishes between *elements of the offense* (where purpose matters) and *mitigation/aggravation based on general moral worth* (where motive is usually excluded).

  5.  **Address the "Load-Bearing Reason" Refinement:**
      *   *Scenario:* Lifeguard saves rival to beat him later. Cashier gives change under camera. Do-gooder thinks act is wrong.
      *   *Doctrine's Response:* The doctrine generally refuses the counterfactual "would you have done it otherwise?" regarding *motive*. It looks at the *actual* mental state at the time of action.
      *   *Exception:* Causation. If the act wasn't caused by the intent (e.g., attempted murder where the victim was already dead), it fails. But for moral credit/blame, the law usually sticks to the *actual* reason, not the counterfactual stability of the act.
      *   *Underdetermined:* Sentencing. Judges *do* consider "would they do it again?" implicitly.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. State the core implicit theory clearly.
      *   **The Implicit Theory (Trial Side):** Focus on "Norm Violation" vs. "Moral Worth." The law commands *abstinence*, not *virtue*.
      *   **The Three Distinctions:**
          *   Wrongness = Act + Intent (Trial).
          *   Blameworthiness = Culpability (Trial) vs. Character (Board).
          *   Credit = Generally outside Trial, inside Board.
      *   **Reconciling the Inconsistencies:** Explain why intent, duress, and hate crimes fit the theory (they define the harm or the capacity to choose).
      *   **The Load-Bearing Reason:** Explain how the law handles counterfactuals (mostly ignores them regarding motive, focuses on actual causation).
      *   **Rival Views Ruled Out:** Virtue Ethics, Pure Consequentialism (regarding motive).
      *   **Underdetermined Areas:** Sentencing, specific intent crimes.
      *   **Practical Changes:** What if we switched to a "Reasons Matter" system? (Inquisition into soul, instability of verdicts, board becomes trial).

  7.  **Refining the Tone:**
      *   Needs to be analytical, philosophical but plain.
      *   Avoid preaching.
      *   Ensure the distinction between *Intent* (Mens Rea) and *Motive* (Ulterior purpose) is clear, as this is the linchpin of the legal doctrine.

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer the "load-bearing" question? *Adjustment:* Ensure I explicitly discuss the counterfactual nature of the lifeguard/cashier examples. The law cares about *actual* causation, not *counterfactual* stability of the rightness.
      *   *Check:* Did I separate Wrongness, Blame, Credit? *Adjustment:* Make this a distinct section.
      *   *Check:* Did I explain the inconsistencies (hate crimes, duress)? *Adjustment:* Frame them as exceptions that prove the rule (they turn motive into an element of the harm or a negation of choice).
      *   *Check:* No citations. *Adjustment:* Keep it theoretical.

  9.  **Final Polish:** Ensure the distinction between the Trial (Backward-looking, Act-focused) and the Board (Forward-looking, Agent-focused) is sharp. This explains why they seem to operate on opposite principles—they have different telos.

  **(Self-Correction on the "Load-Bearing" point):** The prompt asks if the doctrine has resources for the "load-bearing reason" (counterfactual dependence). The law generally *lacks* resources for this regarding moral credit, but uses it for *causation*. I need to be precise here. The law asks "Did this reason cause this act?" not "Would the act persist without this reason?" Actually, the "pre-existing duty" rule *does* touch on this (you get no credit if you would have done it anyway). I should highlight that tension.

  10. **Final Structure:**
      1.  The Implicit Theory (The Sovereign Command).
      2.  The Three Categories (Wrongness, Blame, Credit).
      3.  Reconciling the Inconsistencies (Intent vs. Motive).
      4.  The Load-Bearing Reason (Counterfactuals).
      5.  Rival Views Ruled Out.
      6.  Underdetermined Zones.
      7.  Consequences of Switching Theories.

  Let's write.
answer: |-
  The implicit theory presupposed by the trial-side doctrine is **Legal Positivism coupled with a Theory of Agency based on Choice rather than Character.**

  Here is the reconstruction of that theory, the distinctions it relies on, and the consequences of altering it.

  ### 1. The Implicit Theory: The Sovereign Command
  The trial system operates on the view that the law is a system of **commands addressed to rational agents**, not a system for evaluating moral worth. The core question of the trial is not "Is this person good?" but "Did this person knowingly violate a sovereign command?"

  Under this theory:
  *   **The Act** is the violation of the boundary set by the law.
  *   **The Mind** is relevant only insofar as it confirms the violation was a *choice* (voluntary) and not an accident or reflex.
  *   **The Reason (Motive)** is treated as private data irrelevant to the public wrong.

  The doctrine presupposes that the **wrongness of the act** is fixed by the violation of the norm itself. If the law forbids killing, the wrong is the unauthorized taking of life. Why you took it (mercy, greed, anger) changes the *story*, but it does not change the *violation*. The state claims a monopoly on defining prohibited harms; it does not claim a monopoly on defining virtuous reasons. Therefore, a good motive cannot cure a bad act, because the act itself is the injury to the legal order.

  ### 2. Distinguishing the Three Questions
  You asked to separate whether the act was wrong, whether the agent is blameworthy, and whether the agent deserves credit. The trial doctrine assigns these as follows:

  *   **Wrongness of the Act:** This is the **Trial's primary concern.** It is determined objectively (did the act occur?) and subjectively (did the agent intend the act?). The trial determines *legal guilt*, which is a proxy for the wrongness of the act relative to the state.
  *   **Blameworthiness of the Agent:** The trial addresses this only narrowly. It asks: "Is this agent *culpable* for the wrong?" (i.e., did they have the capacity and intent to choose it?). It explicitly *refuses* to assess deep moral blameworthiness (character, history, underlying pressures) except where those factors negate the capacity to choose (insanity, duress).
  *   **Credit for the Agent:** The trial generally **ignores this.** It is a binary system (guilty/not guilty). Credit is reserved for the sentencing phase (mitigation) or for your Board (release).

  **Are the Trial and Board answering different questions?**
  Yes.
  *   **The Trial** asks: "Did you break the rule?" (Backward-looking, Act-focused).
  *   **The Board** asks: "Are you safe to return?" (Forward-looking, Agent-focused).
  The Board *must* care about motives because motives predict future behavior. The Trial *must* ignore motives (mostly) because motives do not negate the past violation. The inconsistency you feel arises because you are applying the Board's metric (fitness for community) to the Trial's metric (adjudication of past violation).

  ### 3. Reconciling the Inconsistencies
  You noted the system seems inconsistent: it ignores motive, yet cares about intent, duress, hate crimes, and pre-existing duties. The implicit theory resolves these not as exceptions to "motive doesn't matter," but as definitions of **what constitutes the act** or **the capacity to choose.**

  *   **Intent vs. Motive:** The law distinguishes *intent* (I meant to pull the trigger) from *motive* (I pulled the trigger to inherit money). Intent is part of the *act description*. Motive is the *cause of the intent*. The theory holds that you are responsible for what you intend, regardless of why you intend it.
  *   **Duress/Self-Defense:** These do not argue "my motive was good." They argue "my choice was not free." They negate the *voluntariness* required for the act to be attributed to the agent.
  *   **Hate Crime Enhancements:** This is the strongest counter-example. Here, the reason *is* the crime. The implicit theory accommodates this by defining the *harm* differently. A assault motivated by bigotry causes a distinct social harm (terrorizing a group) than an assault motivated by a bar fight. The motive becomes an *element of the injury*, not just a reason for the act.
  *   **Pre-existing Duty/Consideration:** This rule (no payment for doing what you must) is not about blame; it is about **causation and bargain.** It asks: "Did my promise cause your action?" If you were already bound to do it, my promise didn't cause it. This aligns with your "load-bearing" refinement.

  ### 4. The "Load-Bearing Reason" Refinement
  You ask if the doctrine has resources for the counterfactual: *Would she have done the same thing if the right reason had been absent?*

  *   **The Lifeguard (saves rival to beat him later):** The doctrine says the act is *good* (life saved), but the agent gets no *moral credit*. The law does not generally award "credit" for crimes not committed or torts avoided. However, in contract/bounty law (your pre-existing duty point), the doctrine *does* use this counterfactual. If you would have informed on the criminal anyway, you get no bounty. The reason must be load-bearing for the *reward*, but not for the *exoneration*.
  *   **The Cashier (correct change under camera):** The act is right. The motive is fear. The law treats the act as compliant. It does not inquire if the compliance was virtuous.
  *   **The Moral Mistake (does right thinking it wrong):** The doctrine generally treats this as **luck.** If you intended to break the law but failed, it is an attempt. If you intended to break the law but accidentally did good, you are still culpable for the attempt. The doctrine cares about the *orientation of the will*, not the accidental outcome.

  **Does the doctrine refuse the question?**
  Yes, mostly. The trial system is not equipped to run counterfactual simulations on an agent's soul. It relies on **actual causation** (did this mental state produce this act?) rather than **counterfactual stability** (would the act persist without this state?). The "pre-existing duty" rule is the rare exception where counterfactual stability matters, and that is usually in civil/contract contexts, not criminal guilt.

  ### 5. Rival Views Quietly Ruled Out
  By adhering to this implicit theory, the trial system rejects:
  *   **Virtue Ethics:** The view that the moral quality of the action depends entirely on the character of the agent. The law says a virtuous person can commit murder, and a vicious person can perform a legal act.
  *   **Pure Consequentialism (regarding motive):** The view that a good outcome motivated by good reasons should negate the badness of the rule violation. The law says the rule violation is a distinct harm from the outcome.
  *   **Psychological Determinism:** The view that if we understand the "why" deeply enough, the "what" dissolves. The law presumes free will; it treats the "why" as a choice, not a cause that excuses (unless it rises to the level of coercion/insanity).

  ### 6. Underdetermined Areas
  There are zones where the practice is not fully dictated by this theory, and where other theories could license the same outcomes:
  *   **Sentencing:** This is the zone where the Trial morphs into the Board. Judges *do* consider motive here. The theory underdetermines *how much* motive should matter. Is it mercy? Or is it a recalibration of blameworthiness?
  *   **Specific Intent Crimes:** Crimes like "theft" require an intent to permanently deprive. This blurs the line between intent and motive. A theory that cared deeply about reasons could expand this category; a theory that cared only about acts could shrink it.
  *   **Mistake of Law vs. Fact:** The rule that mistake of law is no excuse is pragmatic (administrative feasibility), not strictly logical. A "reasons matter" theory might allow ignorance of law to excuse if the ignorance was reasonable (i.e., the agent was trying to comply).

  ### 7. What Would Have to Change?
  If you replaced the implicit view with one where **the reasons a person acts from are what matter** (a "Moral Reasons" doctrine):

  **In the Courtroom:**
  *   **Guilt would become unstable.** Verdicts would depend on deep psychological inquiry into the defendant's soul, not just their actions. A killing could be murder one day and mercy the next, based on nuanced internal states hard to prove.
  *   **The State would become inquisitorial.** To judge reasons, the state must claim authority over the moral validity of those reasons. It would no longer be neutral on the "good life."
  *   **Evidence would shift.** Transcripts would focus less on "what did you do" and more on "who are you." Character witnesses would become central to guilt/innocence, not just sentencing.
  *   **The "Hate Crime" logic would expand.** If reasons matter for punishment, they must matter for guilt. Every crime would potentially require a hearing on the moral quality of the motive.

  **On Your Board:**
  *   **Your task would move to the Trial.** If reasons determine guilt, your Board's work (assessing rehabilitation and reasons) would be redundant for release decisions, because the "reformed reasons" would have already been litigated at trial.
  *   **Or, your task would become impossible.** If the Trial already adjudicated the "moral worth" of the act, there is less room for you to assess change. You would be reviewing a moral judgment, not a legal one.

  **Summary:**
  The trial doctrine is about **Wrongness of the Act** and **Attribution of Choice**. It presupposes that citizens owe the state obedience to norms, not virtue. Your Board is about **Blameworthiness of the Agent** and **Credit/Rehabilitation**. It presupposes that the community deserves safety, which depends on character. The system is not inconsistent; it is **bifurcated**. It separates the judgment of the *violation* (Trial) from the judgment of the *violator* (Board). To merge them would require the state to judge souls rather than acts, transforming the courtroom into a confessional and the parole board into a redundancy.
