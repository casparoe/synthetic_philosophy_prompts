  ### 1. The slogan in context

  In your seminar, the maxim functions as a rhetorical trump card, ostensibly settling the debate on strategic forgetting by appealing to historical wisdom. By invoking "those who forget the past are doomed to repeat it," your classmate transforms a complex normative question about *whether* we should remember into a purportedly factual claim about the *consequences* of forgetting. This move relies on the slogan's ambiguity: it oscillates between a causal prediction (forgetting leads to recurrence) and a moral imperative (we must remember to prevent harm). This ambiguity is critical because if the claim is empirical, it requires evidence often lacking in transitional justice contexts; if it is normative, it presupposes the very conclusion under dispute—namely, that remembrance is always superior to forgetting. Treating it as decisive bypasses the nuanced arguments made by thinkers like David Rieff, who suggest that excessive memory can sometimes hinder peace. The instructor's acceptance suggests a reluctance to interrogate hidden premises within common moral platitudes, allowing an ambiguous aphorism to stand in for rigorous ethical analysis.

  ### 2. The menu of precise readings

  **1. The Conceptual Truth:** "Learning requires retention." *Logical Form:* If agent $A$ does not retain information $I$, $A$ cannot learn from $I$. *Status:* **Trivially true.** This defines learning but offers no guidance on *what* to retain or for how long. It fails to address strategic forgetting because one can learn a lesson (e.g., "war is bad") without retaining specific traumatic details or institutionalizing memory. Thus, it cannot ground a duty to remember specific events.

  **2. The Strong Causal Claim:** "Forgetting guarantees repetition." *Logical Form:* $\forall x$ (Forget($x$) $\rightarrow$ Repeat($x$)). *Status:* **False.** History is replete with instances where societies forgot conflicts yet did not repeat them, or remembered them vividly and repeated them anyway (e.g., WWI to WWII). This reading is empirically unsustainable. It treats a complex historical process as a mechanical law.

  **3. The Probabilistic Risk Thesis:** "Forgetting increases the likelihood of repetition." *Logical Form:* $P(Repeat | Forget) > P(Repeat | Remember)$. *Status:* **Empirically testable.** Political science data is inconclusive; some post-conflict societies stabilize through amnesia (e.g., Spain's Pact of Forgetting), while others fracture through sustained grievance. It is not universally true. Context determines whether memory acts as a vaccine or a virus.

  **4. The Deontological Imperative:** "Agents ought to remember atrocities." *Logical Form:* $\forall$ Agents, $O(Remember)$. *Status:* **Morally defensible (contested).** It asserts a duty independent of consequences. This is the likely ethical core but begs the question against consequentialist arguments for forgetting (e.g., social cohesion). It assumes memory is intrinsically valuable. It prioritizes rectitude over social utility.

  **5. The Identity-Constitutive Claim:** "A political community is defined by its memory." *Logical Form:* Community $C$ exists only if $C$ remembers $E$. *Status:* **Normative/Descriptive hybrid.** While memory shapes identity, claiming it is *essential* excludes communities built on new foundations. This reading supports "never forget" as a condition of existence, not just safety, but is false for communities seeking radical renewal. It conflates continuity with moral fidelity.

  **6. The Pedagogical Heuristic:** "Remembering is a useful tool for prevention." *Logical Form:* Remembering is generally instrumentally valuable. *Status:* **Empirically testable.** This is the weakest normative version, allowing for exceptions where forgetting is more useful, thus failing to support a strict prohibition on strategic forgetting. It admits the very possibility the slogan is meant to deny. It reduces memory to a technique rather than an obligation.

  ### 3. Verdicts on plausibility and scope

  None of these readings successfully supports a universal prohibition on strategic forgetting. The Conceptual Truth is too thin to bear ethical weight; knowing *that* violence occurred is different from ritually remembering *how* it occurred. The Strong Causal Claim is demonstrably false, rendering it useless for policy. The Probabilistic Risk Thesis is the most defensible empirically, but its scope is limited: it applies only where specific historical patterns indicate high recurrence risk, not universally. In cases where memory fuels vendetta (e.g., ethnic nationalism), remembering might *increase* the risk of repetition, inverting the slogan's logic.

  The Deontological Imperative and Identity-Constitutive Claim are normatively potent but lack universal scope. They rely on specific conceptions of justice or political ontology that are not shared by all transitional contexts. For instance, a utilitarian framework prioritizing present stability might override a duty to remember. Consequently, the slogan cannot function as a universal law. It applies, at best, conditionally: where memory serves justice without inciting violence. To treat it as decisive is to ignore the contextual variables that determine whether memory is therapeutic or toxic. The slogan's power lies in its vagueness; once precisified, its authority dissolves into contingent empirical or normative claims that require argumentation, not invocation. It cannot bear the weight of dismissing Rieff's arguments without further justification.

  ### 4. The mnemonic asymmetry challenge

  Your asymmetry objection strikes at the slogan's universal quantifier ("Those who..."). A universal "Never Forget" implies a symmetrical obligation across all agents, yet transitional justice literature suggests obligations are highly differentiated. Victims may have a right to remember as a form of dignity; perpetrators may have a duty to remember as a form of repentance; bystanders may have a duty to remember to prevent complicity; but descendants or new citizens might have no such duty, or even a right to forget to build a new identity.

  If the slogan is interpreted as applying universally, it collapses these distinctions. It demands the same mnemonic labor from the grandchild of the victim and the grandchild of the perpetrator, which may be unjust or psychologically untenable. Furthermore, strategic forgetting is often proposed precisely to allow descendants to escape the determinism of ancestral guilt or trauma. If the slogan denies this possibility, it enforces a kind of mnemonic determinism that contradicts the goal of transitional justice: a future not held hostage by the past. Therefore, the universal form of the slogan cannot accommodate asymmetry. It functions as a blunt instrument that ignores the specific relational dynamics required for genuine reconciliation.

  ### 5. Which reading does the work

  Your classmate and instructor likely relied on a conflation of the Probabilistic Risk Thesis and the Deontological Imperative. They implicitly assume that forgetting *causes* harm (empirical) and that remembering is *inherently* just (normative). However, neither interpretation soundly defeats the case for strategic forgetting. The empirical claim is too uncertain to mandate a specific policy, and the normative claim is exactly what is under dispute in seminars engaging with Rieff. By treating the slogan as decisive, they commit a question-begging fallacy, assuming the priority of memory without demonstrating why it outweighs competing values like peace or closure. The slogan does not do the philosophical work required; it merely signals a commitment to memory politics.
