answer: |-
  This is an exceptionally sharp dissection of the Socialist Calculation Debate (SCD). You've moved past the standard "markets vs. plans" binary and identified the *ontological and epistemological preconditions* required for the planning practice to function at all. You are asking about the metaphysics of the spreadsheet, essentially.

  To reconstruct the implicit theory behind treating prices as computable control variables, we have to excavate the philosophical commitments regarding **information (epistemology)**, **value (axiology)**, and **rationality (philosophy of action)**.

  Here is the reconstruction of the implicit theory, the consistency check, and the breakdown under strict Mises/Hayek scrutiny.

  ---

  ### 1. The Epistemology of Information: The Codifiability Thesis

  **The Practice:** Input-output tables and algorithmic allocation require that all economically relevant variables (resources, needs, technological coefficients) be entered into a data structure.
  **The Implicit Commitment:** **Epistemic Reductionism.**

  For the matrix to balance, the system must presuppose that all economically relevant knowledge is **propositional and codifiable**. It assumes that the "state of the economy" can be fully described by a set of discrete data points without significant loss of fidelity.

  *   **Syntax vs. Semantics:** This practice treats economic information as *syntactic* (manipulable symbols) rather than *semantic* (meaning embedded in context). It assumes that the "price of steel" carries the same semantic weight to the central planner as it does to the factory manager who knows the machine is about to break or the supplier who knows the ore quality is dipping.
  *   **Hayek's Objection:** Hayek's "tacit knowledge" argument is not just that we *don't have* the data yet; it's that the knowledge *cannot exist* in that form until the situation arises. Knowledge of "time and place" is often non-propositional (knowing *how* vs. knowing *that*).
  *   **The Planning Presupposition:** To run the algorithm, you must deny Hayek's strong thesis. You must assume that local knowledge is either irrelevant to the aggregate allocation or can be perfectly translated into a report without losing its actionable content. This is the **"Data Processing Fallacy"**: the belief that context can be stripped from information without destroying its utility.

  ### 2. The Ontology of Value: The Aggregation Thesis

  **The Practice:** The center computes shadow prices to optimize an objective function (e.g., maximize output, minimize labor time, satisfy a consumption bundle).
  **The Implicit Commitment:** **Interpersonal Comparability of Utility.**

  Even if planners claim they are "respecting consumer sovereignty" by using revealed preferences, the act of optimization requires a common denominator. To solve for $X$ and $Y$ simultaneously, the system must treat the value of $X$ to Person A and the value of $Y$ to Person B as commensurable quantities within a single equation.

  *   **Mises's Objection:** Mises's radical subjectivism holds that value is ordinal, not cardinal, and strictly individual. There is no "social utility" that exists independently of individual choices. You cannot add Person A's utility to Person B's.
  *   **The "Revealed Preference" Tension:** You noted the tension where defenders say, "We aren't imposing values; we're responding to preferences." This is where the **Social Welfare Function (SWF)** is smuggled in.
      *   To aggregate preferences, you need a rule (e.g., utilitarian sum, Rawlsian maximin, or a weighted priority list).
      *   *Choosing the aggregation rule is a normative act.* If the algorithm discounts future consumption at 5% vs. 2%, it is imposing a value judgment on the intergenerational distribution of wealth.
      *   If the algorithm prioritizes heavy industry over consumer goods (as Gosplan often did), it is asserting that the "state's preference" overrides the "individual's revealed preference."
  *   **The Planning Presupposition:** The practice presupposes that a **technocratic utilitarianism** is possible. It assumes values can be objectified into constraints. It denies Mises's claim that value is only realized *in the act of choice*, not in the *measurement of desire*.

  ### 3. Rationality: The Engineering Conception

  **The Practice:** Iterative adjustment (tâtonnement). The center tweaks prices until supply equals demand in the model.
  **The Implicit Commitment:** **Constructivist Rationalism.**

  This views the economy as a machine that can be tuned from the outside. It assumes the system is **stationary enough** for the calculation to remain valid between the time the data is collected and the time the order is issued.

  *   **The Feedback Problem:** In a market, prices are signals embedded with *incentives*. If you guess wrong, you lose money. In the planning model, prices are *parameters*. If the center guesses wrong, the result is a shortage or surplus, which is fed back as new data.
  *   **The Implicit Theory:** This presupposes that **error correction is costless** or at least politically neutral. It assumes that the feedback loop (reporting a shortage) functions as efficiently as the profit/loss mechanism.
  *   **Hayek's View:** Rationality is ecological and distributed. No single mind can hold the complexity of the system. The "rationality" of the market is an emergent property of the rules, not the intent of the agents. The planning model assumes rationality is centralized and substantive.

  ---

  ### Reconstructing the Implicit Theory

  If we formalize the commitments required for this practice to hang together, we get the following philosophical profile:

  1.  **Ontology:** The economy is a **closed system** of finite resources and known production functions. It is ontologically similar to an engineering problem, not a complex adaptive system.
  2.  **Epistemology:** **Empiricist Positivism.** All relevant facts are observable states that can be quantified. Tacit knowledge is either non-existent or epistemically irrelevant to allocation.
  3.  **Axiology:** **Objective Value / Weak Subjectivism.** While individuals have preferences, those preferences can be translated into a common metric (labor time, energy units, or utils) that allows for aggregation.
  4.  **Agency:** **Olympian Rationality.** The planner (or algorithm) stands outside the system, unaffected by the incentives within it, capable of processing the whole without bias.

  **Consistency Check:**
  Internally, this theory is consistent *if* you accept the premises. If knowledge is codifiable and values are comparable, central calculation is not only possible but potentially superior (avoiding market "waste").
  However, it is **externally inconsistent** with the nature of human action. It treats humans as *objects* to be modeled rather than *agents* who create the data through their actions.

  ---

  ### Lange vs. The Practice: Where the Smuggling Happens

  Does this match Oskar Lange's actual argument? **Partially, but with a crucial divergence.**

  *   **Lange's Defense:** Lange argued for "Market Socialism." He didn't propose a rigid Gosplan-style command economy for consumer goods. He suggested the Central Planning Board (CPB) would set prices for *capital goods* via trial and error, while labor and consumer goods markets could remain free.
  *   **The Smuggle:** Lange assumed the **production functions** were known data. He treated technology as a given set of coefficients.
      *   *Hayek's Critique of Lange:* Hayek argued that the "data" (technology, resource availability) are not given; they are *created* by the entrepreneurial process. By treating them as fixed parameters for the algorithm, Lange presupposed the very knowledge the market is supposed to discover.
  *   **The Practice (Gosplan/Algorithms):** Historical planning practice went further than Lange. It often fixed *quantities* rather than just prices, and it assumed the aggregation rules (priorities) were political givens, not economic variables.
  *   **Verdict:** The practice smuggles in **technocratic authoritarianism** that Lange tried to avoid with his "trial and error" caveat. Lange admitted the process would be slow; the practice assumes it can be fast enough to matter. Lange assumed the CPB would act like a bank; the practice acted like a commander.

  ---

  ### The Break Point: Taking Hayek and Mises Seriously

  If we replace the hidden commitments with strict Misesian/Hayekian epistemology and axiology, the practice doesn't just get harder; **the core mechanism dissolves.**

  1.  **The Data Vanishes (Epistemological Break):**
      *   If knowledge is tacit and local, the input matrix is *necessarily* incomplete. It's not just "missing data"; it's data that *does not exist yet*.
      *   *Result:* The algorithm is solving for variables that are undefined. The "balance" it achieves is a mathematical fiction, not an economic equilibrium.

  2.  **The Price Loses Meaning (Axiological Break):**
      *   If value is purely subjective and ordinal, a "shadow price" calculated by a center is not a price at all. It is a statistic.
      *   A market price represents a *commitment* to exchange (skin in the game). A shadow price represents a *hypothesis*.
      *   *Result:* Without the risk of loss attached to the price signal, there is no mechanism to force the correction of errors. The "iterative adjustment" becomes a bureaucratic negotiation, not an economic calculation.

  3.  **The Incentive Structure Collapses (Praxeological Break):**
      *   Mises argued that without private ownership of the means of production, there are no genuine costs.
      *   If the algorithm sets the price, the manager has no incentive to reveal true capacity or needs. They will game the inputs to get easier targets (the "ratchet effect").
      *   *Result:* The data fed into the algorithm becomes strategically falsified. The "computable control variable" is now manipulating garbage data.

  ### Summary

  The practice of treating prices as computable control variables presupposes a **positivist epistemology** (knowledge is data) and a **utilitarian axiology** (values are aggregable).

  It claims to be neutral ("just following the algorithm"), but it embeds a **technocratic normative framework** in the selection of variables and aggregation rules.

  If you take Hayek and Mises seriously, the practice breaks because:
  1.  **Information is not static data** to be uploaded, but a dynamic process to be discovered.
  2.  **Value is not a quantity** to be balanced, but a ranking to be acted upon.
  3.  **Calculation is not a math problem**, but an institutional incentive problem.

  The "shadow price" in a planning model is a simulacrum of a price: it has the syntax of a price (a number) but lacks the semantics (a signal of scarcity derived from actual conflict and resolution over resources). To make the practice work, you have to assume the world is simpler than it is, and humans are more legible than they are.
