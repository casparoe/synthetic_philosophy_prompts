answer: |-
  The tension you identify is fundamental. The 'Condorcetian' defence of the jury — that it is a statistical engine for truth-seeking — clashes with the institutional architecture of the criminal trial in England and Wales. To resolve this, we must distinguish between an *epistemic* theory of authority (the verdict is binding because it is likely true) and a *political* or *legitimacy* theory of authority (the verdict is binding because it was reached by the defendant's peers through a fair process).

  Here is the analytical reconstruction of the institution's commitments.

  ### 1. Reconstructing the Implicit Theory (Features 1–6)

  **Feature 1: Random Selection and Lay Status**
  *   **Strict Requirement:** This sits uncomfortably with the aggregative picture. If the goal is accuracy, one should select for competence (logic, numeracy, relevant experience). Random selection from the electoral roll ensures a representative cross-section, not a competent one. Excluding those with relevant knowledge actively reduces the panel's aggregate information.
  *   **Comfortable Fit:** This fits the *representative* theory perfectly. The jury stands for the community; therefore, it must look like the community. Challenges based on sympathy acknowledge that the trial is a contest of narratives, not just facts.
  *   **Underdetermination:** One could argue random selection prevents systematic bias, which aids aggregation. However, the exclusion of expertise suggests the priority is preventing 'usurpation' by elites rather than maximising cognitive power.

  **Feature 2: Restrictions on Evidence and Research**
  *   **Strict Requirement:** This contradicts the aggregative ideal. A truth-seeking body should gather all available data. Forbidding internet research or scene visits deliberately blinds the panel to potential truth.
  *   **Comfortable Fit:** This is strictly required by the *process-based* theory of fairness. It ensures 'equality of arms'; the defence and prosecution must know and challenge all material considered. It prevents the trial from becoming an inquisition.
  *   **Underdetermination:** It could be argued that uncontrolled research introduces noise (misinformation), lowering competence. However, a total ban suggests the priority is procedural integrity over informational completeness.

  **Feature 3: Secrecy of Deliberations**
  *   **Strict Requirement:** This is fatal to the aggregative theory if taken strictly. If the jury is a measuring instrument, we must be able to calibrate it. Secrecy prevents us from knowing if the verdict resulted from reasoning or prejudice.
  *   **Comfortable Fit:** This is essential for the *legitimacy* theory. It protects jurors from coercion and ensures finality. It treats the verdict as a sovereign act that cannot be questioned without undermining the court's authority.
  *   **Underdetermination:** It could be argued secrecy promotes candour, improving deliberation quality. But the criminal sanction implies the protection of the institution's mystique is paramount.

  **Feature 4: Unanimity, Majority, and Retrials**
  *   **Strict Requirement:** The aggregative model prefers simple majority rule (efficient and statistically robust). Requiring unanimity, then allowing a majority only as a fallback, suggests consensus is the ideal. Discharging a hung jury without recording the split ignores valuable data about the evidence's ambiguity.
  *   **Comfortable Fit:** This fits a *high-stakes legitimacy* model. Unanimity ensures the community is fully behind the deprivation of liberty. Retrials treat the jury not as a sensor but as a sovereign body; if Sovereign A cannot agree, Sovereign B is convened.
  *   **Underdetermination:** The shift to majority verdicts acknowledges the cost of error (hung juries), but the reluctance to do so implies a normative preference for agreement over efficiency.

  **Feature 5: The Bare General Verdict**
  *   **Strict Requirement:** Aggregation works best on discrete propositions (e.g., 'Did he do it?', 'Was it unlawful?'). A general verdict aggregates the *conclusion* without revealing the premises. This masks the 'doctrinal paradox' where a majority might find guilt via different logical routes.
  *   **Comfortable Fit:** This presupposes the jury's output is an *act of judgment*, not a finding of fact. It is a black box that applies community standards to the case.
  *   **Underdetermination:** It simplifies the interface between jury and judge, but it prevents appellate review of the jury's reasoning, reinforcing the idea that their authority is not reason-based.

  **Feature 6: Contrast with Appellate Courts**
  *   **Strict Requirement:** If both bodies were truth-tracking devices, they should operate similarly (reasons, dissents). The divergence suggests they serve different functions.
  *   **Comfortable Fit:** This supports a *division of labour* theory. Judges clarify the law (public reason); Juries judge the facts/conscience (private conviction).
  *   **Underdetermination:** It implies the jury's authority is not derived from the quality of its reasoning, whereas the appellate court's authority is precisely derived from the quality of its reasoning.

  ### 2. The Tension: Aggregation vs. Deliberation and Selection

  The aggregative justification (Condorcet's Jury Theorem) relies on two axioms: individual competence ($p > 0.5$) and independence of votes. Features 1 through 4 systematically undermine both.

  **Independence:** Deliberation (Feature 3 & 4) creates dependence. Jurors influence one another. If the influence is coercive (social pressure), reliability drops. If the influence is persuasive (sharing reasons), reliability might rise. The aggregative story can only be saved by reformulating the jury not as a *pooling* device, but as a *transformative* one. This reformulation must assume that deliberation raises individual competence ($p$) significantly enough to outweigh the loss of independence. It assumes the 'marketplace of ideas' within the jury room corrects individual errors better than statistical averaging would.

  **Competence:** Feature 1 (lay status) and Feature 2 (no research) cap competence. The aggregative defence must therefore assume that 'common sense' is sufficient competence ($p > 0.5$) for criminal facts.

  **The Fatal Flaw:** The reformulation is empirically untestable due to Feature 3 (secrecy). We cannot know if deliberation improves competence or entrenches bias. Consequently, the aggregative defence becomes an article of faith rather than a structural guarantee. It requires us to believe that the social dynamic of twelve strangers in a room reliably produces epistemic improvement, despite the prohibition on external information and the pressure to conform. This is a fragile foundation compared to the robustness of the statistical model it claims to invoke.

  ### 3. The Coherence of Feature 3 (Secrecy)

  Feature 3 is incoherent if the verdict's authority is purely epistemic. If authority derives from reliability, then hiding the method of production is irrational; it prevents quality control. A scientist who refuses to publish their methodology forfeits scientific authority.

  Therefore, Feature 3 presupposes that the verdict's authority is *performative* rather than *constative*. It is not that the verdict is binding *because* it is true; it is binding because it is the *verdict*. Secrecy protects the finality of the act. It belongs to a theory of authority based on **institutional closure**. The legal system requires a point at which questioning stops. If jurors could be questioned, every verdict could be challenged on the quality of their reasoning, leading to infinite regress.

  Thus, Feature 3 is not a side-constraint on an accuracy-driven practice; it is the cornerstone of a legitimacy-driven practice. It signals that the jury is a sovereign body within the trial, answerable only to its own conscience, not to the court's scrutiny.

  ### 4. Feature 4: Retrials and Unanimity

  **Epistemic Weight of Discharged Panels:**
  If the jury were a measuring instrument, a 'hung jury' would be a data point indicating low signal-to-noise ratio in the evidence. Treating the first panel's failure as void (a *nullity*) suggests the jury is not an instrument but a **proxy for the community**. If the community (Panel A) cannot agree, we ask the community again (Panel B). We do not average the two results. This presupposes that the authority lies in the *capacity to reach a decision*, not in the aggregation of views across panels.

  **Unanimity vs. Majority:**
  The move from unanimity to a 10-2 majority after deliberation reveals a conflict in error costs.
  *   **Aggregative View:** A 10-2 split is statistically strong evidence of guilt (assuming $p > 0.5$). Delaying it serves no epistemic purpose.
  *   **Legitimacy View:** Unanimity is the moral ideal. It ensures that the state does not punish unless the community is wholly agreed. The majority verdict is a pragmatic concession to prevent system collapse (too many retrials).
  This is inconsistent with a pure competence-based defence. If the goal were truth, the majority verdict should be available immediately. The delay implies that *consensus* has value independent of *accuracy*. It prioritises the avoidance of wrongful conviction (protecting the minority dissenters) over the efficiency of finding the truth.

  ### 5. Feature 5: The General Verdict

  The practice of the general verdict presupposes that the jury's output is a **normative judgment**, not a factual report.

  **The View:** It rules out the idea that the trial is a logic puzzle where premises lead inexorably to a conclusion. It accepts that jurors may convict for different reasons (e.g., Juror A believes the witness, Juror B ignores the witness but thinks the defendant's silence is suspicious).
  **Aggregative Need:** The aggregative justification needs the jury to decide on *premises* (facts). If jurors aggregate on the *conclusion* (guilt), they may be aggregating incompatible logical paths. This is known in social choice theory as the 'doctrinal paradox'.
  **Conflict:** The general verdict protects the jury from being overruled on logical inconsistencies. It reinforces the idea that the jury has the 'right to be wrong' on the facts, provided they reach the conclusion. This aligns with the view of the jury as a **buffer against state power** (nullification potential), not as a truth-tracking device. A truth-tracker must be consistent; a buffer need only be resolute.

  ### 6. Contrast (Features 5 & 6) and Conclusion

  **Can a single theory underwrite both?**
  No. The appellate court operates on an **epistemic theory of authority**: its judgments are binding because they are reasoned, public, and subject to critique. The jury operates on a **political theory of authority**: its judgments are binding because they are representative, final, and insulated from critique.
  To claim the jury is an epistemic device is to misunderstand its function in the constitutional architecture. It is not a 'sharpened instrument for finding things out'; it is a 'black box for legitimising punishment'. The contrast shows that the legal system values *reason* in the development of law (judges) but values *conviction* in the adjudication of fact (juries).

  **Concrete Changes Required**

  If the **Aggregative Justification** were adopted officially and taken seriously, courtroom practice would change radically:
  1.  **Selection:** Jurors would be screened for cognitive competence and relevant expertise, not just bias.
  2.  **Deliberation:** Voting would be secret and independent *before* discussion to preserve statistical independence, then pooled.
  3.  **Transparency:** Jury reasoning would be recorded (perhaps via a foreperson's statement) to allow calibration of accuracy.
  4.  **Verdicts:** Special verdicts (finding on specific elements) would be mandatory to avoid the doctrinal paradox.
  5.  **Research:** Controlled access to information would be permitted to maximise competence.

  If the **Representative/Process Justification** were adopted officially (abandoning the epistemic pretence):
  1.  **Selection:** Quotas would ensure the jury demographically mirrors the community exactly, rather than random selection.
  2.  **Instructions:** Judges would explicitly tell jurors they represent the community's conscience, not just finders of fact.
  3.  **Unanimity:** Majority verdicts would be abolished. If the community cannot agree, the state has no legitimacy to punish.
  4.  **Secrecy:** Protection would be strengthened, framing it as protection of civic duty rather than just privacy.
  5.  **Retrials:** Limits would be placed on retrials after hung juries, acknowledging that if the community is divided, the matter should rest (double jeopardy principles).

  **Conclusion**
  The current system is a hybrid that speaks the language of epistemology ('sure so that you are sure') but operates on the logic of legitimacy. It attempts to harness the epistemic benefits of group decision-making while insulating the process from the scrutiny that epistemology demands. This is not necessarily a defect; it may be a necessary fiction to maintain public confidence. However, it is philosophically unstable to claim the jury is a truth-machine while locking the machine in a box and forbidding anyone to check its gears. The institution is committed not to truth in the scientific sense, but to **acceptability**. It is designed to produce verdicts the public will accept, which is a different, though related, goal to producing verdicts that are objectively correct.
