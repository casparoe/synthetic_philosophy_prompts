      1.  (5) vs. (8) & (7): The moral/evaluative status of "failure" and the voicelessness of the victims. If you explain agents only by their terms (5), but the victims have no terms in the record (7), and you judge the policy a failure (8), you risk contradicting (5) or rendering (8) relative.
      2.  (3) vs. (8): If emplotment is imposed (3), "failure" looks like an emplotment choice (tragedy vs. bureaucratic glitch). Claiming it as fact (8) conflicts with (3).
      3.  (4) Coherence: Is it doing work? If it's just intersection of narratives, it might be too thin.

      *Apparent Tensions:*
      *   (1) vs. (2): Realism vs. Selection. These are compatible. Facts exist, but we select which matter.
      *   (1) vs. (6): Ontological realism vs. Epistemic proceduralism. Compatible.
      *   (2) vs. (3): Selection vs. Narrative. Compatible.

