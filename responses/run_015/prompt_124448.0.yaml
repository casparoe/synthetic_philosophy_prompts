answer: |-
  Bottom line
  Your framework is robustly critical-realist but faces a crisis around evaluation. Commitments (1), (2), (6), and (7) form a coherent epistemological base for archival work. However, (5) conflicts sharply with (8), and (3) threatens to undermine the factuality of (8). The "failure" claim risks becoming either anachronistic moralism or merely literary emplotment. You do not need to discard realism or narrativism, but you must clarify the status of evaluative predicates. If "failure" is treated as a brute fact like "rainfall," (3) and (5) will dismantle it in the viva. Stabilize the normative ground of your judgment, and the set holds.

  Genuine tensions
  1. **The Evaluation Trap (5 vs. 8):** This is the most dangerous viva vulnerability. Commitment (5) restricts explanation to agents' available terms. Commitment (8) asserts "policy failed" as a determinate fact. If the officer's terms prioritized fiscal austerity over survival, judging the policy a "failure" based on mortality rates imports a presentist moral standard, violating (5). If you judge it a failure by *his* standards, you must prove he aimed to save lives and missed. Without this distinction, examiners will charge you with contradicting your own methodological ban on anachronism while making a moral verdict look like an empirical finding. Consequently, your factual claim rests on a normative premise you have methodologically excluded. This creates a performative contradiction in your argument structure. It forces you into a dilemma where either your method is wrong or your conclusion is unsupported. This is the primary point of attack.

  2. **The Emplotment Problem (3 vs. 8):** Commitment (3) adopts White's view that narrative form is imposed, not found. "Failure" is often a tragic emplotment, not an event-statement. If evidence does not adjudicate emplotment, claiming "failure" as a fact independent of narrative (8) contradicts (3). You risk asserting a verdict while claiming neutrality. To maintain (3), "failure" must be shown as invariant across emplotments (linking to 4), or reclassified as an evaluative conclusion rather than a factual premise. Examiners trained in narrativist theory will seize on this inconsistency to destabilize your empirical claims. You must show how the fact survives the narrative turn. This threatens the core empirical contribution of your dissertation by reducing it to a story choice.

  3. **The Triviality Risk (4):** You acknowledge this, but it remains a structural weakness. If (3) holds that evidence allows multiple incompatible emplotments, the intersection of "admissible emplotments" (4) may contain only thin event-statements (e.g., "grain was shipped"), rendering the criterion useless for complex claims like "failure." If you constrain "admissible" too tightly to make (4) work, you undermine (3). You need to demonstrate that some emplotments are empirically inadmissible, not just aesthetically displeasing. Otherwise, your surrogate objectivity collapses into subjective preference. This risks rendering your innovative criterion methodologically empty, which undermines the utility of your entire chapter.

  Apparent tensions that dissolve
  (1) and (2) are not in conflict. Ontological realism (facts exist) is compatible with epistemic selectivity (questions determine relevance). You can believe starvation happened independently of your account while admitting only some starvation counts as "historical fact" for your specific inquiry. Similarly, (1) and (6) dissolve when distinguishing ontology from practice. Facts exist independently (1), but our warrant for claiming them arises from procedural rigor (6). This is standard critical realism. Finally, (2) and (7) align perfectly: because facts are question-dependent, you are licensed to ask questions the archive ignores, legitimizing the reconstruction of silent populations. The archive's silence does not negate the fact; it merely requires a different question to reveal it. This distinction is crucial.

  Minimal repairs
  The single most effective revision is to qualify (5). This does not require rewriting your chapters, only the methodological framing. Distinguish between *explaining motives* (restricted to agents' terms) and *assessing outcomes* (permitted to use external standards). Rewrite (5) to forbid anachronism in *motivation* but allow it in *evaluation*. This secures (8): the policy can factually fail to meet human needs even if the officer didn't prioritize them. This preserves your contextual integrity while permitting moral judgment. Without this, you must either abandon the claim of failure or admit to presentism, both costly positions. Dropping (5) entirely would undermine your contextual analysis of colonial bureaucracy; keeping it rigidly makes your moral critique indefensible. Splitting the commitment resolves this without deleting text. You should explicitly state that explanation requires internal terms, while evaluation engages external consequences.
  Second, tighten (4). Define "admissible emplotments" as those consistent with the *causal* constraints of the evidence, not just narrative coherence. This prevents the intersection from being trivial without abandoning (3). It ensures your surrogate objectivity relies on causal plausibility, not just story consistency. You must demonstrate in the chapter that incompatible stories are ruled out by material constraints, not just preference. If you do not add this constraint, examiners will argue your method yields no knowledge beyond basic chronology. You need to show how causal inference narrows the narrative field. This operationalizes your theoretical commitment. This requires adding a paragraph on causal mechanisms to your methodology chapter.
  Third, clarify (8). Specify whether "failure" refers to administrative goals or humanitarian outcomes. If the latter, link it explicitly to (7): the silence of the record hides the outcome, which you reconstruct. This thereby binds the evaluation to the archival work rather than leaving it floating as a verdict. By grounding the verdict in the reconstruction of the silent victims, you make the moral claim a historical finding derived from method, not an external imposition. This protects (8) from charges of subjectivity. It also utilizes your archival innovation as evidence for your moral claim, strengthening both. This ensures your normative claims are treated as empirical discoveries. Thus securing the factual status of your conclusion.

  Confidence note
  I am confident that the (5)/(8) conflict is the primary viva risk; examiners consistently target unacknowledged normative standards in colonial history. I am less certain about the viability of (4) in practice; while theoretically sound, its operationalization in your chapter may be harder to demonstrate than you anticipate. Ensure you have at least one concrete example ready. Good luck.
