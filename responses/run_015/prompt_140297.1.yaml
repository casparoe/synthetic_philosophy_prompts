prompt: |-
  Hey — I need help designing a single class session, and I've been going in circles on it since Friday. I TA an upper-level undergrad seminar ("Choice, Welfare and Justice"; it's cross-listed, so about half of the 14 students are econ-ish and have genuinely seen expected utility theory, and the other half are philosophy majors who have never written down a utility function and get glassy-eyed at the sight of a summation sign). I have one 75-minute slot. The thing I want them to feel *in their gut* rather than be told: when you add up an enormous number of very tiny harms and announce that the pile is worse than one catastrophic harm, you have already made a measurement choice that nobody voted on. Specifically, you have quietly assigned each person a zero point and a unit, and if you assign them differently — each way looking perfectly natural on its own — the verdict flips.

  The argument I had with my friend Maya is what got me stuck. Her line was that this is a non-problem: everybody normalizes their own worst-to-best over "the outcomes at stake here" to 0 and 1, and then you just sum, and of course the dust specks win. I said that is exactly where the cheating happens, because "the outcomes at stake here" is ambiguous between "the two options on the table right now" and "the best and worst things a person like me could undergo across a life", and those two readings can disagree by many orders of magnitude about how many specks it takes. She said fine, then pick the local one, it's decision-theoretically the only one that's well defined. I said the local one makes the verdict a pure artifact of which alternatives somebody happened to put in front of you, so a bureaucrat who adds a third, even worse option to the menu can change the answer without changing anyone's experience. We went around on this for two hours and never landed it, and now I want to hand the fight to my students instead.

  So: design a runnable activity for them. Constraints that matter to me. (1) No lecture up front and no naming of the doctrine — I don't want anyone to hear a phrase like "interpersonal comparison" until the debrief. They should end up constructing the aggregation rule themselves and only discovering at the end what they've built. (2) It has to involve real choices with real (small) stakes, not just a handout with hypotheticals: I can get maybe $40 in coffee-shop vouchers and I'm happy to inflict genuinely trivial annoyances (holding a textbook at arm's length, a buzzer, a slightly sour sweet) but nothing that actually hurts and nothing that would get me in trouble with the department. (3) The rules or incentives need to be arranged so that the group actually runs into the flip — I'd love it if two halves of the room, using schemes that each feel obviously right, come to opposite verdicts, and have to argue about which one is "correct" without any available tie-breaker. (4) Then a debrief that maps moments in the activity onto the pieces: why the scales you can extract from a person's own choices are fixed only up to a positive linear rescaling, why that leaves the zero and the unit undetermined, why each of Maya's normalization conventions is defensible and what each one costs, and what kind of evidence (if any) could ever settle the choice between them. Also: tell me what will predictably go wrong the first time I run it — I can already hear the econ students saying "just use willingness to pay" or "just use money", someone will refuse to play, and at least one person will conclude that the whole lesson is just "you can't read other people's minds", which is not the point. And be honest about which feature of the problem the activity can't reproduce and I'll just have to say out loud myself.
reasoning: |-
  Here's a thinking process that leads to the suggested class session design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 75-minute seminar session for an upper-level undergrad class ("Choice, Welfare and Justice").
      *   **Audience:** 14 students (mix of Econ and Philosophy). Econ students know Expected Utility Theory (EUT); Philosophy students don't like math/summations.
      *   **Core Concept:** Interpersonal comparison of utility is arbitrary. Specifically, aggregating tiny harms vs. catastrophic harm depends on normalization (zero point and unit). Changing the normalization flips the verdict.
      *   **Constraint 1 (Pedagogy):** No lecture up front. No naming doctrines (e.g., "interpersonal comparison") until the debrief. Students must construct the aggregation rule themselves.
      *   **Constraint 2 (Logistics/Stakes):** Real choices, small stakes ($40 vouchers, trivial annoyances like holding a book, buzzer, sour candy). No pain, no departmental trouble.
      *   **Constraint 3 (Mechanism):** The activity *must* produce a flip. Two groups using "obviously right" schemes should reach opposite verdicts.
      *   **Constraint 4 (Debrief):** Map activity moments to affine transformations, zero/unit arbitrariness, Maya's argument (local vs. global normalization), and limits of evidence.
      *   **Constraint 5 (Troubleshooting):** Predict failure modes (Econ students suggesting WTP/money, refusals to play, nihilistic conclusions). Acknowledge what the activity *can't* reproduce.

  2.  **Deconstruct the Core Problem (The "Maya Argument"):**

      *   *The Issue:* Summing utilities ($\sum u_i$) requires $u_i$ to be comparable. But EUT only gives $u_i$ up to positive affine transformation ($u'_i = a u_i + b, a > 0$).
      *   *Maya's Stance:* Normalize locally (best option = 1, worst option = 0 for *this* choice).
      *   *The Counter:* Local normalization makes social choice dependent on the "menu" (independence of irrelevant alternatives violation). Adding a terrible dummy option changes the scale, changing the sum, changing the winner.
      *   *The "Flip":* Catastrophic harm (one person suffers a lot) vs. Dust Specks (everyone suffers a tiny bit).
      *   *Local Normalization:* Catastrophe = 0, Status Quo = 1 (for victim). Speck = 0.99, Status Quo = 1 (for everyone). Summing these might favor the Specks because the victim's "0" is weighed against 13 people's "0.99".
      *   *Global/Anchored Normalization:* If we anchor "death/torture" as 0 and "perfect bliss" as 1 across *all possible* lives, the speck is 0.999999. The catastrophe is 0.1. Now the sum might favor avoiding the catastrophe.
      *   *Wait, I need to make sure the activity creates the flip.*
      *   *Scenario:* Option A: One person loses $20 voucher. Option B: Everyone loses 5 minutes of time/comfort.
      *   *Group 1 Rule:* "Equalize the pain scale relative to *this* choice." (Maya's Local).
      *   *Group 2 Rule:* "Equalize the pain scale relative to *your worst imaginable day*." (Global).
      *   *Result:* Group 1 might say "The $20 loss is the worst thing *here*, so it gets weight 1. The 5 mins is small *here*, so it gets weight 0.1. 13 * 0.1 > 1. Choose B (Dust Specks)." Group 2 might say "$20 is bad, but 5 mins is trivial compared to real suffering. 13 * 0.01 < 0.5. Choose A (Catastrophe)."
      *   *Actually, let's refine the "Flip".* The prompt asks for: "when you add up an enormous number of very tiny harms and announce that the pile is worse than one catastrophic harm, you have already made a measurement choice."
      *   So, I need the class to vote on a policy.
      *   Policy X: One person takes a "hit" (e.g., gives up voucher).
      *   Policy Y: Everyone takes a "trivial hit" (e.g., holds book for 5 mins).
      *   If they normalize locally, the "hit" is the worst outcome in the set (0), the trivial hit is close to best (1). Summing might favor Y (Dust Specks).
      *   If they normalize globally (or use a different unit), the "hit" is huge, trivial hit is negligible. Summing favors X.
      *   *Wait, the prompt says:* "when you add up... tiny harms... and announce that the pile is worse... you have made a measurement choice."
      *   So the standard Utilitarian verdict is often "Dust Specks > Torture" (if N is large enough). The lesson is that this verdict relies on the scaling.
      *   I need the students to *derive* the scaling, not be given it.

  3.  **Drafting the Activity Structure:**

      *   **Phase 1: The Choice (15 mins).** Present two social states.
          *   State A: Randomly selected student loses a $10 voucher.
          *   State B: Every student holds a heavy book at arm's length for 2 minutes.
          *   *Stakes:* $40 total budget. 14 students. $10 is significant. 2 mins book hold is annoying but trivial.
      *   **Phase 2: The Measurement (30 mins).** Split class into two halves (7 vs 7).
          *   Task: "Decide which state is 'better' for the group. You must write down a number for each person's welfare in each state and sum them. The higher sum wins."
          *   *Crucial Twist:* Give Group 1 and Group 2 different *instructions* on how to assign numbers, but frame them as "natural ways to measure welfare."
