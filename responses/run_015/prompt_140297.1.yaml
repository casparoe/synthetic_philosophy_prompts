              *   **Yes. This creates the flip.** Alpha chooses Sacrifice. Beta chooses Specks.

  4.  **Refining the Activity Mechanics:**

      *   **Time:** 75 mins.
      *   **Intro (5 mins):** Set stakes. Show vouchers. Show book.
      *   **Split (5 mins):** Divide into Team Alpha and Team Beta. Separate tables.
