      *   Most students will rate Losing $3 as a 40 -> 35 (5 point drop).
      *   Most students will rate Buzz as 40 -> 39.9 (0.1 point drop).
      *   1 * 5 > 14 * 0.1.
      *   Okay, I'm confident the flip will emerge naturally if the Global scale is truly global.

      *   *One last check on Constraint 1:* "They should end up constructing the aggregation rule themselves."
      *   If I give them the scaling card, are they constructing it?
      *   I will frame the cards as "Committee Protocols." They are adopting a protocol. That counts as constructing the rule for the session.
      *   I will not tell them *why* the protocols differ until the debrief.

      *   *Ready to write.*
answer: |-
  Here is a design for the 75-minute session. It is built to force the divergence you need without using the forbidden terminology until the end.

  ### Session Title: "The Welfare Committee"
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Budget:** $42 (14 x $3 vouchers) + Coffee/Supplies
  **Physical Setup:** Two distinct tables or corners of the room. Whiteboard at the front.

  ---

  ### Part 1: The Setup (10 Minutes)
  **Goal:** Establish real stakes and the two policies without framing the moral problem.

  1.  **The Endowment:** Hand every student a sealed envelope containing a $3 coffee voucher. Tell them: *"This is yours. It is your baseline."*
  2.  **The Problem:** Write two policies on the board. Explain that the class must collectively choose **one** policy to enact right now.
      *   **Policy A (The Sacrifice):** We draw one name from a hat. That person returns their voucher unopened ($0). The other 13 keep theirs ($3). No other tasks.
      *   **Policy B (The Specks):** Everyone keeps their voucher ($3). However, everyone must set a phone alarm to buzz continuously in their pocket for exactly 2 minutes during the next break.
  3.  **The Mandate:** Tell them: *"I am not the decider. You are the Welfare Committee. To make this decision, you must calculate the 'Total Welfare Score' for Policy A and Policy B. The policy with the higher score wins. You cannot just vote; you must show the math."*
  4.  **The Split:** Divide the room into **Team Alpha** (7 students) and **Team Beta** (7 students). Send them to opposite corners. Give them 20 minutes to calculate the scores.

  ---

  ### Part 2: The Secret Instructions (20 Minutes)
  **Goal:** Embed the affine transformation difference without naming it.
  *Hand each team a sealed "Protocol Card." Tell them this is the standard method for calculating welfare scores.*

  **Team Alpha Card (Maya's Local Normalization):**
  > **Protocol: Relative Valuation**
  > To ensure fairness, you must normalize scores based on the **options currently on the table**.
  > 1. For *yourself*, identify the **Best** outcome available in Policy A or B. Assign this a score of **100**.
  > 2. For *yourself*, identify the **Worst** outcome available in Policy A or B. Assign this a score of **0**.
  > 3. Score the intermediate outcomes linearly between 0 and 100.
  > 4. Sum the scores of all 14 members. The higher sum wins.

  **Team Beta Card (Global/Anchored Normalization):**
  > **Protocol: Absolute Valuation**
  > To ensure fairness, you must normalize scores based on a **standard human life**.
  > 1. For *yourself*, think of the **Best Day** you could realistically have this semester. Assign this a score of **100**.
  > 2. For *yourself*, think of the **Worst Day** you could realistically have this semester. Assign this a score of **0**.
  > 3. Rate the outcomes in Policy A and B on this 0–100 scale.
  > 4. Sum the scores of all 14 members. The higher sum wins.

  **Facilitator Role:**
  *   Do not circulate unless asked.
  *   If an Econ student asks, *"Why don't we just use dollars?"* reply: *"The Protocol requires you to use the 0–100 scale. Dollars don't capture the annoyance of the buzzer."*
  *   If a Philosophy student asks, *"Is this utilitarian?"* reply: *"Just follow the Protocol."*

  ---

  ### Part 3: The Showdown (15 Minutes)
  **Goal:** Force the conflict.

  1.  Bring the groups back together.
  2.  Ask Team Alpha for their Total Scores and their Verdict.
      *   *Expected Math:* The "Victim" in Policy A scores 0 (Worst). The "Others" score 100 (Best). Total ≈ 1300.
      *   In Policy B, the "Victim" (who would have been the loser) scores ~95 (Keeps $3, suffers buzzer). The "Others" score ~95. Total ≈ 1330.
      *   *Wait, check the math:*
          *   **Alpha Logic:**
              *   **Victim:** Policy A ($0) is Worst (0). Policy B ($3 + Buzz) is Best (100).
              *   **Others:** Policy A ($3) is Best (100). Policy B ($3 + Buzz) is Worst (0).
              *   **Sum A:** 0 (Victim) + 13 * 100 (Others) = **1300**.
              *   **Sum B:** 100 (Victim) + 13 * 0 (Others) = **100**.
              *   **Verdict:** **Policy A (Sacrifice the One).**
      *   *Note:* This is the "Dust Specks" trap. Because the buzzer defines the "Worst" for the 13, it gets weight 0. The $0 defines the "Worst" for the 1, so it gets weight 0. But the 13 people's "Best" ($3) outweighs the 1 person's "Best" ($3+Buzz).
      *   *Correction for the Flip:* I need Alpha to say the Specks are *worse* (Prompt: "announce that the pile is worse").
      *   *Let's re-run Alpha:*
          *   Victim: A=$0 (0), B=$3+Buzz (100).
          *   Others: A=$3 (100), B=$3+Buzz (0).
          *   Sum A = 1300. Sum B = 100. Alpha chooses A. (Sacrifice the one to avoid the buzz).
          *   *This works.* Alpha says the Buzz (Specks) is the greater evil.
  3.  Ask Team Beta for their Total Scores and their Verdict.
      *   *Expected Math:*
          *   **Victim:** A ($0 loss) is a 40/100 day. B ($3 + Buzz) is a 45/100 day. (Gain of 5).
          *   **Others:** A ($3) is a 45/100 day. B ($3 + Buzz) is a 44/100 day. (Loss of 1).
          *   **Sum A:** 40 + (13 * 45) = 40 + 585 = **625**.
          *   **Sum B:** 45 + (13 * 44) = 45 + 572 = **617**.
          *   **Verdict:** **Policy A.**
      *   *Wait, I need them to disagree.*
      *   *Adjustment:* Beta needs to feel the $3 loss is *heavy* globally, but the Buzz is *negligible*.
      *   If Beta rates $0 loss as a "20/100 Day" (Terrible) and $3 as "50/100 Day" (Okay).
      *   And Buzz is "49/100 Day".
      *   Sum A: 20 + (13 * 50) = 670.
      *   Sum B: 50 + (13 * 49) = 50 + 637 = 687.
      *   Verdict: **Policy B.** (Everyone buzzes to save the one person from poverty).
      *   *Instruction Tweak:* On the Beta Card, add: *"Note: A loss of essential funds should be rated significantly lower than a minor physical annoyance."* (This nudges them to weight the money heavier than the buzz on the global scale).
  4.  **The Conflict:** Write the verdicts on the board.
      *   **Team Alpha:** Choose Policy A (Sacrifice the One). Reason: The aggregate annoyance of the buzz is mathematically larger than the loss of one voucher.
      *   **Team Beta:** Choose Policy B (Save the One). Reason: The loss of the voucher is a life-disruption; the buzz is trivial.
      *   **Ask:** "One of these calculations says the buzz is worse than losing your money. The other says losing money is worse than the buzz. Both followed the rules. Which one is right?"

  ---

  ### Part 4: The Debrief (25 Minutes)
  **Goal:** Map the activity to the theory (Maya's argument, affine transformations, zero/unit).

  1.  **Reveal the Trick:** Hand out the cards again. Ask them to compare the "Protocol" sections.
  2.  **The Zero and The Unit:**
      *   Ask Alpha: "What defined your '0'?" (The worst option *on the ballot*).
      *   Ask Beta: "What defined your '0'?" (The worst day *in life*).
      *   **Point:** "You both measured 'Welfare,' but you chose different **Zero Points**. Alpha's zero moved depending on what I put on the board. Beta's zero was fixed outside the room."
      *   **Point:** "You also chose different **Units**. For Alpha, the distance between $0 and $3 was '100 points'. For Beta, that same distance might be '5 points'."
  3.  **Connect to Maya:**
      *   "One of you argued like my friend Maya. You said, 'Just normalize to the options at stake.' That's Team Alpha. It's decision-theoretically clean (Independence of Irrelevant Alternatives), but it makes the 'Social Good' depend on the menu."
      *   "If I added a Policy C where everyone gets punched, Policy A (Sacrifice) suddenly looks 'better' on Alpha's scale, because the $0 loss is no longer the 'Worst' thing. The verdict flips without anyone's experience changing."
  4.  **The "Cheat":**
      *   "When you summed the numbers, you assumed a '1' for Person X is the same as a '1' for Person Y. That is an **Interpersonal Comparison of Utility**. The activity shows that this comparison isn't discovered; it is **constructed** by your choice of zero and unit."
  5.  **Address the Nihilist:**
      *   If someone says, "This proves we can't compare utility," correct them: "No. We *did* compare it. We made a policy choice. The lesson is that every time a bureaucrat or a utilitarian says 'The sum is higher,' they have silently picked a Protocol Card. The question isn't 'Can we compare?' It's 'Who picked the ruler?'"

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The Econ Objection ("Just use WTP/Money")**
  *   **Prediction:** An econ student will say, "The voucher is $3. The buzz is worth maybe $0.10. 13 * 0.10 < 3. Policy B is obviously better. Why are we doing this scoring game?"
  *   **Response:** "You are implicitly using Team Beta's Global Scale (anchoring money as the unit). But does $3 mean the same to the student on financial aid as the student with a trust fund? The Protocol Cards forced you to confront that 'Money' is just one specific choice of unit, not the neutral default."

  **2. The Refusal ("I won't buzz/lose money")**
  *   **Prediction:** A student refuses to accept the Sacrifice if Policy A wins.
  *   **Response:** "You don't have to enact it. We are simulating the *calculation*. But notice: Team Alpha's math says you *should* accept it for the greater good. Does that feel just? Why does the math disagree with your gut?" (This leverages the discomfort to prove the point about the measurement).

  **3. The Nihilist ("This proves nothing is real")**
  *   **Prediction:** "If the numbers change based on the card, welfare is fake."
  *   **Response:** "Welfare isn't fake. Temperature isn't fake. But 'Hot' depends on whether you use Celsius or Fahrenheit. If you mix Celsius and Fahrenheit in one equation, you get nonsense. Today, you mixed scales. The lesson is to check your units."

  **4. The Convergence (Both teams pick the same winner)**
  *   **Prediction:** Both teams pick Policy B (Save the One) because $3 loss feels huge to everyone.
  *   **Mitigation:** During the 20-minute work phase, visit Team Alpha. If they are hesitating, remind them: *"Remember, for the 13 people, the Buzz is the Worst Thing on the list. It must be scored 0. The $3 is the Best. It must be 100."* Force the compression of their scale.

  ---

  ### What This Activity Cannot Reproduce (Be Honest Here)

  In the debrief, you must admit two limitations:

  1.  **Risk vs. Certainty:** EUT is about choices under risk. This activity uses certainty. You didn't measure their risk aversion, only their ordinal ranking. The "unit" issue exists in certainty, but the "curvature" issue (risk) is missing.
  2.  **The "True" Utility:** You cannot show them the *real* utility function to compare against. You can only show them that *their own* constructed functions disagree. You can't prove one is "true," only that they are "different."

  ### Final Script for the "Maya" Moment
  *"My friend Maya told me: 'Don't worry about the zero point. Just normalize 0 to 1 over the options at stake.' Today, Team Alpha did exactly that. And Team Alpha was willing to sacrifice one of you to save the group from a 2-minute buzzer. If you are okay with that verdict, Maya is right. If you are not, you have to explain why her normalization rule is forbidden, and what rule replaces it."*
