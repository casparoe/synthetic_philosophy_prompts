          *   Group 2: "Determine the value by asking: How much does this affect your week?" (Implies global context).
          *   *Actually, the cleanest way to force the affine transformation issue:*
          *   Give both groups the same instruction: "Assign a welfare score to each outcome for each person. Sum them. Pick the highest."
          *   *Secretly*, give Group 1 a "Reference Sheet" that defines the scale locally (0 = Worst option *in this vote*, 10 = Best option *in this vote*).
          *   Give Group 2 a "Reference Sheet" that defines the scale globally (0 = "Life Ruined", 10 = "Life Perfect").
          *   *Is this "constructing it themselves"?* It's close. They are applying a rule to generate the number. The "construction" is realizing that the *choice of reference sheet* determines the winner.
          *   *Refining Constraint 1:* "They should end up constructing the aggregation rule themselves and only discovering at the end what they've built."
          *   Okay, I will not give them reference sheets. I will give them a *problem* that forces them to choose a scale.
          *   **The Setup:** "We need to choose Policy A (One Sacrifice) or Policy B (Many Specks). To decide, we need a 'Social Welfare Number.' You need to generate this number."
          *   **The Split:**
              *   **Team Alpha:** "Your goal is to be **Fair to the Options**. Treat the difference between the best and worst option *on the ballot* as the standard unit of harm."
              *   **Team Beta:** "Your goal is to be **Fair to the People**. Treat the difference between a 'Great Day' and a 'Terrible Day' in real life as the standard unit of harm."
          *   This is explicit enough to cause divergence but vague enough that they feel they are defining "Fairness."
          *   **The Flip:**
              *   Team Alpha (Local): The $10 loss is the "Worst Option" (0). The Book Hold is "Best Option" (10) for the 13, and "Worst" (0) for the 1? No, for the 13, Book Hold is slightly worse than Status Quo.
              *   Let's refine the options.
              *   Option A: One person (Volunteer?) gives up $10 voucher. (13 people keep $10, 1 person gets $0).
              *   Option B: Everyone holds book for 2 mins. (14 people suffer trivial pain, keep $10).
              *   *Team Alpha (Local):* Scale is 0 to 1 based on *these* outcomes.
                  *   For the Victim: $0 is 0, $10 is 1. Loss = 1 unit.
                  *   For the Others: Book is 0.9, $10/No Book is 1. Loss = 0.1 unit.
                  *   Total Loss A: 1 unit (concentrated).
                  *   Total Loss B: 13 * 0.1 = 1.3 units (distributed).
                  *   Verdict: B is worse (Higher total loss). Choose A (Sacrifice the one). *Wait, usually Utilitarianism says sacrifice the one if the sum is better.*
                  *   Let's align with the prompt: "pile [specks] is worse than one catastrophic harm."
                  *   So I want the verdict to be: The Specks are worse.
                  *   If Alpha says Specks are worse, and Beta says Catastrophe is worse, we have a flip.
                  *   Alpha (Local): The "Catastrophe" ($10 loss) is the max scale (1). The Speck is small (0.1). 13 * 0.1 = 1.3. 1.3 > 1. So Specks are worse. (Matches Prompt).
                  *   Beta (Global): The "Catastrophe" ($10 loss) is tiny compared to "Life Ruined" (0.01). The Speck is negligible (0.0001). 13 * 0.0001 < 0.01. So Catastrophe is worse. (Matches Prompt).
              *   *Wait, does Beta say Catastrophe is worse?*
              *   If Beta uses a global scale, $10 is small. Book is smaller.
              *   If $10 loss = 5 units of "Global Pain". Book = 0.1 units.
              *   Option A Cost: 5.
              *   Option B Cost: 14 * 0.1 = 1.4.
              *   Verdict: Option A (Catastrophe) is worse. Choose B (Specks).
              *   *I need them to disagree on the Choice.*
              *   Alpha: Choose A (Sacrifice one). (Because Specks sum to more).
              *   Beta: Choose B (Everyone holds book). (Because $10 loss is "bigger" relative to global scale than the book).
              *   *Wait, if Beta says $10 is 5 units and Book is 0.1 units.*
              *   Sum A = 5. Sum B = 1.4. A is worse. Choose B.
