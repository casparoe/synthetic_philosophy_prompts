          *   *Nudge Group 2:* "Think about the impact on their lives. How big is this loss *really*?"
          *   *Risk:* They might both converge on the same method. I need to force the divergence.
          *   *Better approach:* Give them a "Measurement Protocol" card, but disguise it as "Standard Procedure."
          *   *Actually, Constraint 1 is strict:* "No naming of the doctrine... They should end up constructing the aggregation rule themselves."
          *   Okay, I can give them *tasks* that imply the rule.
          *   **Group 1 Task:** "Calibrate your meter." Ask them to rank the options *for themselves*. Then assign points such that the gap between Best and Worst *in this experiment* is 10 points.
          *   **Group 2 Task:** "Calibrate your meter." Ask them to think of the worst thing that happened to them this year. Assign points such that *that* is 0 and "Winning $100" is 100. Rate the experiment options on this scale.
          *   This feels like violating "constructing it themselves."
