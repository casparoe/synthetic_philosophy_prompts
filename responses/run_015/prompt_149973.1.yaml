answer: |-
  This is such a strong angle. Honestly, the "wise survivor" trope is everywhere, but it's often kind of lazy. It comforts the audience because it suggests suffering has a payout. Your take is way more visceral: that surviving doesn't make you a guru; it makes you a stranger.

  Here's a way to flesh out that argument for your brainstorming, breaking down why the "wisdom" assumption is wrong and how the "fractured language" idea works.

  ### 1. Why we buy the "Wisdom Myth" (and why it's a trap)
  First, you gotta acknowledge why everyone in the book (and readers) expects her to be wise.
  *   **The Transactional View of Pain:** We want to believe pain isn't random. If someone goes through hell and comes back, we *need* them to bring something valuable with them. Otherwise, it was just pointless suffering. We project wisdom onto them to make ourselves feel safe.
  *   **Intensity = Truth:** We assume that because the experience was *intense*, the insights must be *clear*. But intensity actually scrambles clarity. Think about being in a car crash vs. watching a documentary about car crashes. The person in the crash isn't thinking about the "meaning of life"; they're thinking about broken glass and the smell of gasoline.
  *   **The Oracle Projection:** The people around her aren't listening to what she's actually saying. They're listening for what they *want* to hear. If she says, "It was dark," they hear, "The void is a resting place." If she says, "I was scared," they hear, "Fear is a teacher." They're translating her trauma into their own self-help narrative.

  ### 2. The Fracture: Why transmission fails
  This is the meat of your argument. Knowledge transmission isn't just about one person speaking and another hearing. It requires a **shared conceptual framework**. It's a handshake agreement that words mean specific things.

  *   **The Map vs. The Territory:** Before the near-death event, your character and her friends shared a map. "Safety," "Future," "Pain," "Love"—these coordinates meant the same thing to everyone. The event didn't just change her; it deleted her map. Now she's walking around a new territory, but she's still trying to use the old words.
  *   **The Currency Analogy:** Imagine she comes back with currency from a country that sank into the ocean five years ago. She's trying to buy coffee with it. The money looks real to her, it has value to her, but the transaction can't happen. The shared economy of meaning is broken.
  *   **Ineffability vs. Exile:** Usually, people say traumatic experiences are "ineffable" (hard to put into words). You're arguing something darker: it's not that the words don't exist, it's that the **context** for the words is gone. If you try to explain "survival" to someone whose baseline is "living," you aren't just speaking a different language; you're describing a different physics.

  ### 3. Why this makes her *less* authoritative
  If the shared framework is broken, she loses authority, not gains it.
  *   **Authority requires verification:** For me to trust your expertise, I need to be able to check it against my own reality. If you tell me, "The bridge is out," I can look at the bridge. If you tell me, "Existence is fragile," I can't check that. I just have to take your word. But because my reality says existence is solid (I'm standing here, aren't I?), your statement sounds like nonsense, not wisdom.
  *   **The Uncanny Valley of Speech:** She might sound *almost* normal, but slightly off. This makes people uneasy. They call it "wisdom" to be polite, but really it's alienation. She's speaking from a place they can't visit. That doesn't make her a guide; it makes her a ghost.
  *   **Loss of Nuance:** Real communication relies on nuance. Trauma often flattens things into binary states (Alive/Dead, Safe/Threat). If she starts speaking in absolutes because that's what survival requires, she loses the ability to communicate the gray areas where normal life happens. She becomes a blunt instrument in a world that needs a scalpel.

  ### 4. How this looks in Chapter Three
  Instead of her giving a profound speech that silences the room, maybe try the opposite:
  *   **The Failed Translation:** She tries to explain something simple about what happened, but the words feel like they're burning her tongue. She says, "I wasn't dead," and everyone nods like she just revealed a spiritual truth. But she just means her heart stopped. They're mystifying her biology.
  *   **The Frustration:** She gets annoyed that they think she's wise. She wants to say, "I don't know anything now. I don't know how to be a person anymore." But she can't say that, because they've already cast her as the Oracle.
  *   **The Isolation:** Show her realizing that every time she speaks, they hear something else. She stops trying to explain. The "wisdom" they see is actually just her silence, which they fill with their own projections.

  ### The Core Takeaway
  The argument is that **shared reality is a prerequisite for testimony.** When you survive something that fundamentally alters your reality, you lose the common ground required to testify about it. You aren't a prophet; you're an exile. You're standing on one side of a canyon shouting, and people on the other side are applauding the echo, not hearing your voice.

  It makes the character's journey way more lonely and interesting. She's not trying to teach them; she's trying to learn how to speak their language again, knowing she can never truly go back.

  Does that vibe fit the chapter you're working on?
