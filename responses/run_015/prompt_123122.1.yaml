      *   **Does the Lens Distort?**
          *   Yes. Le Guin is attacking utilitarianism (the "happy many vs. suffering one"). Causal analysis often serves utilitarianism (calculating impact). Focusing on "did they cause it?" might miss "is it *just*?"
          *   The colleague's advice (stay and fight) assumes consequentialism (change the outcome). The resignation assumes integrity (refuse participation). Omelas suggests integrity might be the only move when the system is rigged.
      *   **Teaching Moments:**
          1.  The Description of the Child (The cost).
