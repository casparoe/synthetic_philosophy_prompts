answer: |-
  This is a profound pedagogical and personal predicament. The tension you describe between your colleague's pragmatic consequentialism ("stay to change the outcome") and your own refusal to be implicated ("resign to cleanse the hands") is exactly where *Omelas* cuts deepest. Your colleague's argument rests on a causal claim: *Your presence made no difference to the vote.* In standard collective action problems, this is often true. In *Omelas*, Le Guin constructs a world where that excuse is impossible. Every citizen is causally necessary.

  Here is a reading of the story through the philosophy of causation by omission, addressing your specific constraints, followed by teaching suggestions.

  ### 1. The Stayers: Causation and the Rigged Metaphysics

  On a **counterfactual account of causation** (e.g., David Lewis), causation is defined by dependence: Event $C$ causes Event $E$ if, had $C$ not occurred, $E$ would not have occurred. In *Omelas*, the metaphysical stipulation is that the city's prosperity *depends* on the child's suffering. Crucially, as you note, the terms are rigged so that *any* citizen could free the child.

  Therefore, for any given Stayer $S$: If $S$ had acted to relieve the child, the prosperity would have ended. Consequently, $S$'s omission *is* a cause of the prosperity. Unlike your committee vote (11-1), where your resignation was causally inert regarding the outcome, the Omelas citizen is a "difference-maker." Their omission is a necessary condition for the city's joy.

  This creates a philosophical friction point regarding **production or conserved-quantity theories** (e.g., Salmon, Dowe). These theories generally argue that omissions cannot be causes because "nothing" (the absence of action) cannot transfer energy or momentum. In a physical world, this theory might let the Stayers off the hook: they didn't *push* the child into the dark; they just didn't pull them out. But *Omelas* is not a physical world; it is a moralized metaphysics. The link between child and city is described almost as a spell. There is no energy transfer, only a rule of correspondence.
  *   **The Verdict:** If you apply a production theory, the story breaks the theory. The citizens cause nothing physically, yet they are morally responsible. This suggests the story is designed to show that *moral complicity does not require physical causation*.
  *   **The Moral Work:** You asked if the causal verdict does any moral work here. Since the difference each citizen makes is real, knowing they are causes doesn't help them decide. The horror of *Omelas* is that the causal power is real, but exercising it destroys everything they love. The causal lens illuminates that **complicity is not about efficacy; it is about endorsement.** In your committee, you could claim inefficacy. In *Omelas*, you cannot. You are holding up the sky.

  ### 2. The Walkers: Causal Inertia and Moral Exit

  The Walkers present the harder causal puzzle. They leave the child. The child suffers. The city stands.
  *   **Counterfactual Test:** If Walker $W$ had stayed, the child would still suffer. If $W$ leaves, the child still suffers. Therefore, $W$'s walking causes nothing regarding the child's state.
  *   **Your Two Resistance Strategies:**

      **A. Contrast-Sensitivity:** You suggest we might say the Walker causes "suffering ratified by this population" rather than "suffering." By leaving, they remove themselves from the set of ratifiers.
      *   *Assessment:* This is metaphysically precarious. It risks defining the effect to fit the moral intuition. If causation is sensitive to how we describe the effect, then *any* action can be made to look causally significant by sufficiently fine-grained description. It feels like smuggling a moral verdict ("they did something good") into a causal label ("they caused a different effect"). It doesn't quite save the Walker from causal inertness regarding the *child*.

      **B. Constitutive vs. Causal Dependence:** This is the stronger reading. The city is not just a collection of buildings and outcomes; it is a *polity*. The citizens do not merely cause the city to exist; they *constitute* it.
      *   *Assessment:* On this view, the Walker is not trying to cause the child's release (which is impossible without destroying the city); they are trying to change *what the city is*. By leaving, they alter the constitution of Omelas from "a community of all who enjoy the bargain" to "a community of those who accept the bargain."
      *   *Normativity:* This allows for a non-consequentialist account of complicity. Complicity is not about bringing about harm (causal); it is about participating in a harmful structure (constitutive). The Walker's action is normative because it preserves their integrity, not because it changes the child's physical state. This validates your resignation: you may not have changed the vote, but you changed your relationship to the committee. You are no longer a constituent part of that decision.

  ### 3. The Reader and the Destination

  The story implicates us twice. First, the narrator challenges us to believe in the child. To stop reading is to omit engaging with the moral reality; to finish is to accept the premise. We are all Stay ers until we close the book.

  Second, the destination of the Walkers is unknown ("They do not know where they go"). This is the death knell for utilitarianism. If they walked away to found a better city, their action would be consequentialist. But they walk into the dark without information.
  *   **Illumination:** The causal lens fails here, and that is the point. The story argues that some moral actions are **acausal**. They are performed *because they are right*, not because they *do* anything.
  *   **Distortion:** If you press the causal lens too hard, you risk turning the Walkers into failed activists. They didn't save the child. If the seminar focuses only on "how to fix Omelas," you miss Le Guin's point: *Omelas cannot be fixed.* The bargain is the foundation. The only moral move is exit. This suggests your colleague's advice ("stay and make the case") assumes the system is reformable. *Omelas* asks: What if the system is built on a horror that cannot be negotiated?

  ### 4. Teaching the Story: Three Moments

  For first-years, avoid abstract theory initially. Anchor the causation question in specific textual moments.

  **Moment 1: The Description of the Child**
  *   **Description:** Near the end of the story, the narrator forces the reader to look directly at the child in the basement. The text details the malnutrition, the fear, the lack of language, and the fact that the child was once capable of remembering sunlight.
  *   **Question to Ask:** "The narrator says that if anyone were to clean this child or offer comfort, all the beauty of the city would be destroyed immediately. If you believe that rule is true, does touching the child make you responsible for the destruction of the city? Does *not* touching the child make you responsible for the child's pain? Can you be responsible for both?"
  *   **Goal:** To establish the "rigged" causal link. It forces them to admit that their inaction is a necessary condition for the city's joy.

  **Moment 2: The Age of Understanding**
  *   **Description:** The story notes that the citizens are shown the child when they are adolescents. They react with disgust and anger initially, but eventually, they come to accept it. Their terms of life are set before they have full adult agency, yet they stay once they understand.
  *   **Question to Ask:** "At what point does knowing about the child turn a citizen from a bystander into a participant? Is it when they first see the child, or is it the moment they decide to go back upstairs and enjoy the music? If they stay, are they causing the suffering, or are they just enjoying the benefits?"
  *   **Goal:** To distinguish between *causing* harm and *benefiting* from harm. This bridges the gap between causal omission and unjust enrichment.

  **Moment 3: The Walkers Leaving the Gates**
  *   **Description:** The final image is of people walking out of the city gates, alone, into the darkness of the fields, without knowing where they are going. They do not speak to each other; they do not take the child.
  *   **Question to Ask:** "These people do nothing to help the child. They do not start a protest. They do not try to overthrow the system. They just leave. If their action changes nothing for the child, why does the story present this as a moral choice? Is it possible to do the right thing even if it makes no difference?"
  *   **Goal:** To introduce the constitutive view. They are changing *themselves*, not the *outcome*. This validates the idea that moral integrity can be distinct from causal efficacy.

  ### Summary for Your Seminar Notes

  The causal lens illuminates the **necessity** of the citizen's omission (unlike real-world voting), making the complicity undeniable. However, it distorts the story if it suggests the Walkers are failures because they didn't change the outcome. *Omelas* suggests that when a system is fundamentally unjust, causal efficacy (staying to fight) might be impossible or complicit, and the only pure act is acausal exit.

  Regarding your resignation: Your colleague argued from a **causal/consequentialist** framework (did you change the vote?). You acted from a **constitutive/deontological** framework (did you remain part of the body that voted?). *Omelas* suggests that in the face of the indefensible, the latter may be the only coherent moral position, even if the former is causally accurate. You did not stop the partnership, but you stopped being a partner. In the logic of the story, that is the only victory available.
