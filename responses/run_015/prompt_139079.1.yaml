  The conference room lights were dimmed, leaving only the glow of the monitors displaying the Audit's structural equations. Elias Thorne stirred cold coffee while Mara Velez traced a variable cluster on the whiteboard.

  "The Audit settles it, Mara," Elias said, tapping the screen. "Feature two: completeness and minimality. Every variable in this model is a difference-maker. Delete one, the counterfactuals change. Keep the base-grain variables—the specific neural firings—and you have a sufficient causal chain for the button press. Adding 'Decision' adds nothing to the counterfactual structure within a trial. It violates causal bookkeeping. You're counting the same causal work twice."

  Mara didn't turn from the board. "You're ignoring Feature three: the variability finding. Look at the ten thousand trials. The base-grain states are wildly different. Neuron A fires in trial one, Neuron B in trial two. If you intervene on Neuron A specifically, you don't guarantee the press in trial two. But the 'Decision' variable is constant. It supports cross-trial counterfactuals that no base-grain variable supports. It earns its place by stability, not by independent handles."

  "Stability isn't causation," Elias countered. "It's epistemic utility. Feature four says there's no independent handle. You can't wiggle 'Decision' without wiggling a base-grain determinate. If every manipulation of the coarse variable is implemented by a manipulation of the fine variable, the fine variable is doing the work. The coarse variable is just a label we paste over a disjunction of real causes. If you count both, you're committed to systematic overdetermination. Every action is caused by the physics *and* the psychology. That's not metaphysics; it's double-counting."

  Mara turned, leaning against the desk. "Systematic overdetermination is objectionable only if it's coincidental. Here, it's guaranteed by realization. But here's the trap, Elias: Grain neutrality. If you say the base-grain variables exclude the coarse variables because the base is complete, then fundamental physics excludes the base-grain neural variables. The Audit's 'base grain' isn't fundamental physics; it's just the finest *trackable* grain. If completeness at one level excludes levels above it, then causation disappears all the way up. Geology, economics, psychology—they all lose their causes. Is that a discovery or a reductio?"

  Elias paused. He took a sip of coffee, grimaced. "I'll concede that if 'base grain' means 'neural' rather than 'fundamental physical,' the exclusion argument doesn't bottom out in physics. But that doesn't save mental causation. It just pushes the exclusion up one level. The neural states exclude the mental states for the same reason the quark states exclude the neural states. Causation is a relation between token events. Once the token physical event is sufficient, there's no room for the mental token."

  "But causation isn't just about token sufficiency," Mara pressed. "It's about proportionality. A cause should be commensurate with its effect. The base-grain state is too specific. It carries irrelevant detail—*which* neuron fired doesn't matter, only that *some* neuron in the decision circuit fired. If you insist the base grain is the cause, you violate the principle that causes should be proportional to effects. You're saying the specific micro-state caused the press, rather than the decision. That makes causation hyper-fragile."

  "Proportionality is a pragmatic constraint on explanation, not ontology," Elias replied. "We prefer proportional causes for clarity. But ontology doesn't care about our clarity. The Audit shows the micro-state is minimally sufficient. That's the metaphysical bedrock. Your appeal to grain neutrality begs the question. It assumes causation exists at multiple levels. The Audit suggests causation exists only where the model is complete and minimal. That's one level."

  Mara shook her head. "I'll concede that there's no independent handle. I can't manipulate the decision without manipulating the neurons. But that doesn't mean the neurons are the *only* cause. It means the causal relation is realized multiple ways. If you deny this, you aren't just eliminating mental causation. You're eliminating macro-causation entirely. A bridge collapses because of structural stress, not because of the specific arrangement of iron atoms. If the Audit's logic holds, the atoms exclude the stress. Do you really want to tell engineers their causal models are fictions?"

  "I want to tell engineers their models are excellent predictive tools that track the real causes, which are physical," Elias said. "It's not a fiction; it's a map. The territory is physical."

  "Then the map is all we have access to," Mara said. "And the map shows 'Decision' as the robust difference-maker. Here's the crux: The Audit's completeness claim is question-begging if it assumes the base grain is the only legitimate causal grain. You're defining causation such that only the base grain qualifies. If we define causation as supporting stable counterfactuals across a relevant range of scenarios, the mental variable qualifies and the base variable fails. You prioritize intra-trial sufficiency; I prioritize inter-trial stability."

  Elias stood up, walking to the window. "So we disagree on the relata. You think causation is a relation between types or contrastive classes. I think it's between tokens."

  "I think causation is a relation that explains change," Mara said. "Token physical states don't explain the press across trials. The decision does. If your exclusion argument generalizes to economics, it's not a discovery about causation. It's a reductio of your definition. You've defined causation out of existence for everything except fundamental physics, and even there, quantum indeterminacy might undermine your completeness."

  "Then let the premise stand clear," Elias said, turning back. "I accept that macro-causation is eliminable. If the world is physically complete, macro-causes are shadows. It's a hard truth, not a reductio."

  "And I accept that there's no magic downward force," Mara replied. "But I deny that physical completeness entails causal exclusion. Completeness means no *extra* energy is needed. It doesn't mean the higher-level description doesn't pick out the real causal structure. The Audit shows the physical states vary while the cause remains constant. That proves the cause is the constant, not the variant."

  "Then we're stuck," Elias said. "You think the variability proves the mental is real. I think it proves the mental is a pattern in the physical."

  "No," Mara corrected. "We're stuck on whether causal bookkeeping forbids counting the pattern as a cause. You say yes, because the physical does the work. I say no, because the physical doesn't do the work *as a cause of the press* unless it's grouped under the pattern. The premise that decides it is whether causal efficacy requires independent manipulability or counterfactual stability. You demand the former; I demand the latter."

  Elias nodded slowly. "Then the Audit doesn't solve the problem. It just isolates the premise."

  "Exactly," Mara said. "And if your premise eliminates the bridge, you're holding the wrong end of the telescope."

  ***

  **Author's Note**

  Mara (the compatibilist) has the better of the exchange. The deciding premise is whether causal completeness at a lower level entails causal exclusion of higher levels. Elias assumes that because the base grain is minimally sufficient, it exhausts causal efficacy. Mara successfully argues that this violates Grain Neutrality: if sufficiency excludes higher levels, fundamental physics excludes neuroscience, rendering special science causation illusory. This is a reductio, not a discovery. The dialogue leans on a contestable reading of Feature Four (No Independent Handle). Elias treats the lack of independent manipulability as dispositive for exclusion, but interventionists often argue that if a coarse variable supports counterfactuals the fine variable does not (due to variability), it qualifies as a distinct cause despite shared manipulation routes. Elias's position requires accepting that macro-causation is eliminable, a cost most realists should find prohibitive.
