answer: |-
  Dear Friend,

  You are right to fear the room, not because the people are unkind, but because they are precise, and precision is the enemy of the interval you are trying to defend. You have six days to harden your softest points, and the best way to do that is to hear the objections now, while you can still adjust the text before you speak. I have walked through the likely interventions in the order of their capacity to dismantle your argument, starting with the one that threatens the core of your thesis and ending with the ones that merely annoy. The most damaging question will come from the Hartians, who will not ask a question so much as make a correction, telling you that what you call silence is simply the Rule of Recognition in its pre-operational phase, and that the moment the officials obey the Declaration, you have your legal answer, which means there was never a void, only a period of uncertainty that law resolves retrospectively. You must reply that retrospectivity is a comfort offered by history, not a tool available to the judge on Monday morning, and that your claim concerns the moment of decision, not the moment of historiography, but you must know this reply is soft because it concedes that law is only visible from the rear, which undermines your claim that the novel captures the present tense of legal uncertainty. The second most dangerous objection concerns your own ending, where you suspect the trap lies, and it will be asked by someone who has read the manuscript closely enough to know that in the last chapter the Declaration is obeyed and the city stabilizes, which proves empirically that the law did provide an answer, namely success. Your reply must be that the novel records the settlement, not the validity, and that survival is not vindication, but you should preempt this in your opening remarks by stating clearly that the plot demonstrates the sociological fact of obedience, not the jurisprudential fact of validity, because if you wait until the questions to draw this line, the contradiction will look like a mistake rather than a design. The third objection comes from the junior scholar who will tell you that the puzzle evaporates once you index rules to levels, citing that mid-century Scandinavian paper to suggest that a higher-order rule resolves the conflict between the entrenched clause and the Declaration, and while you can say that your charter deliberately lacks a higher-order rule to authorize that indexing, you will be buying plausibility by admitting your republic is logically impossible rather than legally silent, which is a concession that might cost you the comparativist later. The fourth objection will come from the practitioners and the clerk, who will ask what a judge writes on Monday morning if the answer is that there is no law, because judges have a duty to decide and cannot issue opinions saying the question is unanswerable. You can say that the judge writes a fiction and calls it law, which is exactly what your book argues, but this risks turning your jurisprudence into a counsel of despair that offers no guidance to the very actors you claim to describe. The fifth objection comes from the comparativist who has data on courts striking down amendments, and they will note that real courts find implicit powers or fundamental principles to fill the gap you claim is empty, to which you must reply that those courts are relying on extra-constitutional norms that your charter explicitly excludes, though this makes your republic seem artificially sterile compared to the real polities the comparativist studies. The sixth objection is from the legal historian who will observe that polities have survived precisely this sort of crisis through convention, which sounds like support but is actually a claim that convention is a source of law you have ignored, and your only reply is that convention is not law until it is enforced, which is a distinction the historian will likely reject as overly formalistic. The seventh objection is the normative one, perhaps from a graduate student emboldened by the others, who will ask if your theory amounts to saying that might makes right, since you argue validity settles only after obedience, and you must say that you are describing the mechanism of legal change, not endorsing the morality of it, though this distinction is thin and may not satisfy anyone worried about the stakes of constitutional collapse. The eighth objection is from the graduate students who want to ask about your characters, which you want to avoid because it lets the jurists off the hook, and you should handle this by answering briefly and pivoting back to the structure of the charter, because indulging them signals that the jurisprudence is merely a backdrop for the story rather than the subject of the talk. The ninth and least damaging objection is about method, asking why you need a novel to make this point instead of a thought experiment, and you should say that only narrative can sustain the duration of the uncertainty, which is the point you want to land most heavily because it justifies your presence in the room.

  You should absorb the Hartian objection and the junior scholar's point about levels in the first five minutes of your talk, perhaps by framing your project as an inquiry into what happens when the Rule of Recognition fractures and when hierarchical indexing fails, because if you leave these definitions for the question period, you will spend your replies clarifying terms instead of defending claims. The single reply that has to land for the afternoon to have been worth the trip is your distinction between the sociological fact of obedience and the jurisprudential fact of validity, because if you conflate them, the Hartians will swallow your argument whole and the comparativist will dismiss your republic as a fantasy. The question you are hoping nobody asks is indeed about your ending, but the worse version of it is not about consistency, it is about the normative cost of your theory, specifically whether admitting that law is only settled by success leaves us with no ground to resist tyranny once the Declaration is obeyed, and you should prepare for this by distinguishing between explaining how law works and prescribing how it ought to work, even if that distinction feels fragile under pressure. When you are told that you have misunderstood a distinction nobody ever taught you, you should say that you have collapsed the distinction deliberately to show that it does not hold in the moment of crisis, and that your novel is the record of what happens when the categories we rely on cease to function.
