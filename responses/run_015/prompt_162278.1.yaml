answer: |-
  The bundle of practices you describe does not presuppose a single, unified philosophical theory of atrocity comparison. Instead, it operates on a pragmatic bifurcation: it assumes **administrative commensurability** for the sake of distribution (reparations, law) and **sacralized incommensurability** for the sake of meaning (memory, education). Philosophically, this is unstable, but politically, it is functional. The practice strictly presupposes cardinality within cases because money and law require arithmetic; it merely fits with cross-case incommensurability because that is a normative shield, not a logical requirement. If you removed the taboo on cross-case ranking, the reparations machinery would still run, but the memorial institutions would lose their legitimizing rhetoric.

  Regarding your gadget (a), **Ordinalism-plus cannot run the whole bundle.** It fails specifically on practice (1). Money is a cardinal metric; it admits of ratios and addition. When a reparations fund assigns $X to forced labor and $Y to property loss, it asserts that the harm of labor is X/Y times the harm of property loss. If the fund is finite, the per-victim amount is a function of the total aggregate harm estimated. You cannot maintain this with only ordinal data. If you know A is worse than B, but not by how much, you cannot allocate a finite resource proportionally without introducing an arbitrary cardinal scale. The practice hides this by treating the exchange rates as "political settlements," but the *structure* of the settlement is cardinal. Ordinalism works for practice (2) and arguably (4), but it breaks the mechanics of (1) and the precision demands of (3).

  Regarding your gadget (b), **Decision Density ranks agents, not atrocities.** An atrocity is typically defined by the state of affairs (suffering/death), whereas decision density measures the efficiency of evil per perpetrator. The practice tracks this only partially. In law (4), it tracks density implicitly by prosecuting "most responsible" leaders rather than every trigger-puller, and by labeling intent-heavy crimes (genocide) as graver than scale-heavy crimes (mass murder). However, in memory (2) and reparations (1), the practice tracks total harm (victim count), not density. A genocide with fewer victims but higher intent is legally "worse," but a massacre with more victims often receives more memorial funding. The inconsistency arises because the law punishes culpability (density/intent), while memory compensates suffering (scale). Decision density is not less obscene than body counts; it is simply a different metric that answers "who is most guilty?" rather than "what was most suffered?" The practice conflates these questions, leading to the tension you observe.

  The inconsistency is real but contained. The taboo on ranking (2) protects the political legitimacy of victim groups by preventing a "hierarchy of suffering" that might delegitimize claims. However, this taboo is flatly inconsistent with the obsessive quantification within cases (3) and the cardinal allocations of reparations (1). The practice survives this inconsistency by compartmentalization: economists and lawyers do the math in one room; curators and educators speak of uniqueness in another. If you went fully cardinal across cases (DALYs style), the memorial apparatus would break. You could no longer claim uniqueness; you would have to admit that Atrocity A is "1.5 times worse" than Atrocity B. This would transform memory from a sacred duty into a triage problem, shifting resources away from "unique" events toward "maximal suffering" events, regardless of historical significance.

