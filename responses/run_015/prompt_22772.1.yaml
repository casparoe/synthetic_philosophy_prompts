answer: |-
  Here are ten interview questions designed to dig into the philosophical substance of Evidential Decision Theory (EDT), including the specific topics you requested. Each question includes a follow-up tailored to the standard response an EDT proponent typically gives.

  ### 1. The Bayesian Foundation
  **Question:** To start, I want to ground this in the core intuition. Causal Decision Theory often frames itself as the theory of "making things happen," whereas EDT frames itself as the theory of "acting on evidence." Why should we think that rational decision-making is fundamentally a matter of Bayesian conditionalization on our own actions, rather than a matter of intervening on the world?

  **Follow-up:** *If she answers that we only ever have access to evidence and never direct access to causation:*
  "You're suggesting that causation is epistemically opaque to us. But if I know that flipping a switch *causes* a light to turn on, isn't that causal knowledge itself just a very specific, robust kind of evidence? If so, doesn't that collapse the distinction between the two theories in most practical cases?"

  ### 2. Distinguishing Correlations (Mandatory Topic)
  **Question:** A common criticism of EDT is that it treats all correlations as relevant for decision-making, whether they are causal or merely spurious. Does your version of EDT have the resources to distinguish between a causal correlation and a merely evidential one, or does the theory treat every statistical correlation as a potential reason for action?

  **Follow-up:** *If she answers that EDT distinguishes them by conditioning on background states:*
  "That sounds like you need to know which background states are the 'causal' ones before you can apply the theory. If you need causal knowledge to set up the probability function correctly, isn't causation doing the heavy lifting here, with EDT just doing the arithmetic?"

  ### 3. The Smoking Lesion Case (Mandatory Topic)
  **Question:** I'd like to turn to the Smoking Lesion problem. In this case, smoking doesn't cause cancer; a genetic lesion causes both the cancer and the urge to smoke. Naive EDT suggests you shouldn't smoke because smoking is evidence you have the lesion. How can an evidentialist handle this case without yielding the counterintuitive advice that one should never smoke, even when smoking is causally harmless?

  **Follow-up:** *If she invokes the "Tickle Defense" (conditioning on the absence of the urge to smoke):*
  "The Tickle Defense relies on the agent having perfect introspective access to their own urges. But what about cases where the common cause is subconscious or physiological in a way the agent can't feel? If I can't 'tickle' my own nervous system to check for the lesion, does EDT revert to telling me to avoid the harmless action?"

  ### 4. The Lesson of Newcomb's Problem (Mandatory Topic)
  **Question:** Many people think Newcomb's Problem is just a puzzle about predictors and boxes. But you've argued it reveals something deeper about rationality. What do you take to be the real lesson of Newcomb's Problem: is it about the predictor's reliability, about the agent's ability to decide freely, or about something else entirely?

  **Follow-up:** *If she answers that it shows rationality requires consistency with one's own type:*
  "That sounds like you're defining rationality as a kind of self-consistency rather than success in the world. If an agent two-boxes and walks away with more money, in what sense is the one-boxer more 'rational'? Are we saying rationality is about the purity of the decision procedure rather than the outcome?"

  ### 5. "Managing the News"
  **Question:** Critics often accuse EDT of recommending that we "manage the news" rather than change the world—for example, avoiding a medical test to avoid receiving bad news, since the news has low utility. How do you respond to the charge that EDT conflates *bringing about* a good state of affairs with merely *finding out* that a good state of affairs obtains?

  **Follow-up:** *If she argues that avoiding the test is actually rational in specific contexts:*
  "Even if it's rational to avoid the test in some cases, doesn't this blur the line between instrumental rationality (achieving goals) and epistemic rationality (having accurate beliefs)? If a decision theory tells me to remain ignorant to maximize expected utility, have we redefined 'utility' too broadly?"

  ### 6. The Definition of "Act"
  **Question:** In EDT, the conditional probability is $P(\text{Outcome} | \text{Act})$. But how narrowly do you define the "Act"? If I define my act as "raising my hand while wearing a blue shirt," the evidence changes compared to just "raising my hand." How do we prevent agents from gerrymandering their action descriptions to manipulate the expected value?

  **Follow-up:** *If she says we should use the most granular action available:*
  "If we use the most granular description, aren't we essentially forcing the agent to condition on all their internal mental states anyway? Doesn't that bring us back to the requirement of introspective omniscience we discussed with the Smoking Lesion?"

  ### 7. Timelessness and Agency
  **Question:** EDT seems to imply a kind of 'timeless' perspective, where my choice is evidence of what happened in the past (like the predictor's move in Newcomb's). Does this commit you to a specific view of agency where my decision is not a new cause entering the timeline, but rather a logical output of a pre-existing system?

  **Follow-up:** *If she agrees that decisions are logical outputs:*
  "If my decision is just the output of a system determined by prior states, does that undermine the normative force of the theory? Why tell an agent what they 'should' do if their action is already fixed by the very evidence we are conditioning on?"

  ### 8. Causal Decision Theory's Flaws
  **Question:** Often, defenses of EDT focus less on EDT's strengths and more on Causal Decision Theory's failures, such as in 'Newcomb-like' problems where CDT two-boxes and loses. Do you think EDT is the correct theory of rationality, or is it merely the 'least bad' option compared to CDT's inability to handle logical correlations?

  **Follow-up:** *If she argues CDT is fundamentally broken:*
  "CDT has been refined over the years to handle some of these cases (like Functional Decision Theory or updates to CDT). Is there a specific structural flaw in CDT that you think is unfixable, or is this just an arms race of counter-examples?"

  ### 9. Real-World Application
  **Question:** Outside of philosophy thought experiments, where do you see EDT having practical traction? Are there real-world domains—perhaps in economics, AI safety, or evolutionary biology—where acting on evidence rather than causal intervention yields better long-term results?

  **Follow-up:** *If she mentions AI or algorithmic decision-making:*
  "In AI, algorithms often find spurious correlations that work in the training data but fail in deployment. If an AI uses EDT, isn't there a risk it will latch onto these spurious correlations as 'evidence' and fail when the environment shifts? How does EDT handle distributional shift?"

  ### 10. The Future of Decision Theory
  **Question:** Finally, with the rise of causal modeling and structural equation models (like Judea Pearl's work), causation has become mathematically rigorous in a way it wasn't when EDT was first formulated. Is there still a future for pure EDT, or do you see the field moving toward a hybrid view that incorporates causal graphs into the evidential framework?

  **Follow-up:** *If she suggests a hybrid view is the future:*
  "If we need causal graphs to filter the evidence before we apply the decision rule, does that mean EDT is no longer a foundational theory, but rather a calculation engine that runs on causal inputs?"
