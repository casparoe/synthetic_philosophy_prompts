  2.  **Deconstruct Evidential Decision Theory (EDT):**
      *   *Core Idea:* Maximize expected utility where probabilities are conditional on the action ($P(O|A)$).
      *   *Strengths:* Aligns with standard Bayesian updating, handles Newcomb's well (one-boxing).
      *   *Weaknesses:* Smoking Lesion problem (recommends avoiding smoking even if it doesn't cause cancer), implies "managing the news."
      *   *Defenses:* Often involve tweaking the probability function, appealing to meta-decision theory, or arguing that CDT (Causal Decision Theory) has its own fatal flaws.
      *   *Nuance:* It's not just about Newcomb's; it's about the nature of rationality and evidence.

  3.  **Drafting Questions (Iterative Process):**

