answer: |-
  This is a fantastic application of Hume's *Of the Standard of Taste* to a modern problem. Your friend is essentially acting as a Humean "True Judge." Based on the pattern of her previous verdicts, here is the breakdown of what she will likely say, the rule she is running, and how to test it.

  ### 1. The Prediction: What will she say?
  She will likely side with the critics who call the AI portrait **"hollow" (Not Beautiful).**

  While a strict reading of Hume might suggest that if a qualified viewer feels emotion, the beauty is real, your friend's specific track record adds a crucial layer: **durability and depth.**

  She won't reject the AI art simply because "it has no soul." She will reject it because the "hollow" argument implies the work cannot sustain the sentiment of a qualified judge over time. If it is truly like a "mirror," it offers surface-level perfection but fails the test of deep, prolonged study.

  ### 2. The Underlying Rule
  The rule she is running is: **The Enduring Consensus of Qualified Judges under Ideal Conditions.**

  This is a specific interpretation of Hume's "Standard of Taste." Hume argues that while beauty is a sentiment (feeling), not all sentiments are equal. The standard is the joint verdict of "True Judges"—people with strong sense, delicacy, practice, and freedom from prejudice.

  Here is how that rule maps to her previous verdicts:

  *   **Critic vs. Random Person:** Fits **Qualified Judges.** The critic has the "practice" and "delicacy" Hume requires; the random person does not.
  *   **Critic vs. Critic (Abstract Art):** Fits **Ideal Conditions.** Hume argues that if True Judges disagree, one is operating under a defect (bias, lack of attention, bad mood). Disagreement signals a failure of conditions, not a failure of objectivity.
  *   **Pop Song vs. Critics:** Fits **Qualified Judges > Masses.** Popularity is irrelevant to the standard; the consensus of the trained is the metric.
  *   **Foreign Culture Art:** Fits **Freedom from Prejudice.** A True Judge must adjust their perspective to the context of the work to avoid the prejudice of local norms.
  *   **Long-term Study:** Fits **Enduring Consensus.** Hume emphasizes that works that survive time and repeated exposure prove their quality. Immediate trends are suspect; lasting sentiment is valid.

  ### 3. The Closest Analog
  The closest analog in her past cases is **Case 5: "A work that gets more beautiful the longer you study it is probably actually good."**

  *   **Why:** The AI debate is fundamentally about *depth*. The critics who call it "hollow" are arguing that the work yields nothing new upon prolonged engagement—it is a statistical average of past beauty, not a source of new discovery.
  *   **The Logic:** If the AI portrait is "perfect" only at first glance (like the pop song in Case 3) but reveals emptiness upon the "longer study" described in Case 5, her rule dictates it is inferior. The "human intention" argument is just the *explanation* for why it lacks depth, not the rule itself.

  ### 4. The "Splitter" Test Case
  To truly figure out if she values **Human Intention** or **Refined Feeling**, you need a case where the visual object is identical, but the origin story changes.

  **Ask her this:**
  > "Imagine a human forger paints a perfect copy of a Rembrandt. It is visually indistinguishable from the original. Experts are shown the painting *without knowing it's a fake* and they are deeply moved, calling it a masterpiece. Later, they find out it was painted last week by a forger.
  >
  > **Does the painting lose its beauty once they know the truth?**"

  **How this splits the rules:**

  *   **If she says "Yes, it loses beauty":** Her rule is actually **Human Intention/History.** She believes the aesthetic value is tied to the causal history of the object (the human struggle/genius), not just the visual experience. This would mean she might reject AI art specifically because it lacks a human agent, regardless of how it looks.
  *   **If she says "No, it remains beautiful":** Her rule is **Refined Feeling/Object Properties.** She believes beauty resides in the capacity of the object to provoke sentiment in a qualified viewer, regardless of origin. If this is her stance, she *should* theoretically accept AI art if the critics are genuinely moved, making her "hollow" verdict on the AI case inconsistent unless she proves the feeling doesn't last (Case 5).

  ### Summary for your mental model
  You are looking at a conflict between **Formalism** (beauty is in the arrangement of pixels/colors) and **Expressionism** (beauty is in the communication of human experience).

  Your friend is using a **Humean Hybrid**: She locates beauty in the *feeling*, but trusts that qualified judges will eventually detect a lack of human depth (Case 5). The Forgery Test will reveal if that "depth" requirement is actually a hard rule about human intention.
