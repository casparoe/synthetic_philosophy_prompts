prompt: |-
  i'm writing a novel set in 1956 oxford and i keep running into elizabeth anscombe's little pamphlet against truman's honorary degree and i want to get her actual argument right instead of the "consequentialism is bad" version people usually repeat. can you walk me through the distinction she draws between choosing to kill the innocent as a means to your ends versus knowing as a matter of statistical certainty that your action will kill them, and then apply it to her case against truman? the part i'm stuck on is that the justification she reports (the Allies' Potsdam "general principle" of using the new weapon they now possessed) is basically that they had the bomb and they could use it, which doesn't obviously slot into either side of her distinction. is there a move in her essay that's supposed to handle that, or is it a genuine gap, and if it's a gap, is it fixable with her own framework or does it show the means/side-effect line is doing less work than she wants?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Writing a novel set in 1956 Oxford.
      *   **Subject:** Elizabeth Anscombe's pamphlet *Mr. Truman's Degree*.
      *   **Goal:** Get her actual argument right, specifically moving beyond the simplified "consequentialism is bad" summary.
      *   **Specific Question:** Walk through the distinction between *choosing to kill the innocent as a means* vs. *foreseeing death as a side-effect* (Doctrine of Double Effect).
      *   **Application:** Apply this to her case against Truman.
      *   **The Sticking Point:** The user notes that the justification Anscombe reports (the Potsdam "general principle" of using the weapon they possessed) seems to fit neither category neatly. It sounds like "we had it, so we used it."
      *   **The Core Query:** Is there a move in her essay to handle this "general principle" justification? Is it a gap? If a gap, is it fixable within her framework, or does it undermine the means/side-effect distinction?

  2.  **Deconstruct Anscombe's Argument in *Mr. Truman's Degree*:**
      *   *What is the pamphlet?* It was a protest against Oxford University granting Harry Truman an honorary Doctor of Civil Law degree in 1956. Anscombe led the opposition.
      *   *What is the core ethical claim?* Truman committed mass murder by ordering the atomic bombings of Hiroshima and Nagasaki. Therefore, he is not a fit recipient of an honor recognizing civil law/justice.
      *   *What is the ethical framework?* Anscombe is a virtue ethicist/deontologist (heavily influenced by Aquinas and Wittgenstein). She rejects utilitarianism/consequentialism.
      *   *The Distinction (Double Effect):* The user asks about the distinction between *intended means* and *foreseen side-effects*.
          *   *Anscombe's view:* It is *always* forbidden to intentionally kill the innocent (murder).
          *   *Side-effects:* It is sometimes permissible to act knowing innocent death will result, *provided* the death is not the means to the end nor the end itself (e.g., bombing a munitions factory where workers die, vs. bombing a city to terrorize the population).
      *   *The Truman Case:* Anscombe argues Truman *intended* the killing of civilians. It wasn't a side-effect; it was the point (to break morale/force surrender).

  3.  **Address the User's Specific Sticking Point (The Potsdam "General Principle"):**
      *   *User's Observation:* The justification reported is "we had the bomb, so we used it." This sounds like opportunism, not necessarily a specific utilitarian calculation or a specific intention to kill *as a means*.
      *   *Anscombe's Counter:* She doesn't accept "we had it" as a moral justification. She digs into the *nature* of the act.
      *   *Key Textual Evidence:* In the pamphlet, Anscombe focuses on the *type* of warfare. Indiscriminate bombing of civilians.
      *   *The "Gap":* The user suspects a gap. If the justification is just "availability," does the means/ends distinction matter?
      *   *Resolution:* Anscombe argues that the *policy* itself was one of indiscriminate attack. The "general principle" of using the weapon *entailed* targeting populations. Therefore, the killing wasn't a side-effect; it was constitutive of the strategy.
      *   *Is it a gap?* Not really in her view. She argues that the *description of the action* determines the intention. If the action is "bomb a city," the intention is "destroy the city and its people." You can't say "I only intended to destroy the buildings" if the people are inseparable from the target in that context.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's a sophisticated reading of Anscombe. Validate that the "consequentialism is bad" summary is indeed a caricature.
      *   **The Distinction (Double Effect):** Clarify Anscombe's actual position. It's not just "consequentialism bad." It's about the *description of the action*.
          *   *Intention:* What you choose to bring about.
          *   *Foreseeability:* What you know will happen but don't choose.
          *   *Example:* Cutting a rope to drop a stone on a pursuer (intended kill) vs. a collapsing bridge killing a pursuer while you escape (foreseen kill).
      *   **Applying to Truman:**
          *   Anscombe argues the bombing of Hiroshima/Nagasaki was *indiscriminate*.
          *   The target *was* the civilian population (to break will).
          *   Therefore, the death of the innocent was the *means*, not a side-effect.
      *   **Addressing the "General Principle" (The User's Stuck Point):**
          *   The user notes the justification was "we had it."
          *   Anscombe's move: She attacks the *policy* of area bombing.
          *   She argues that if your policy is "use this weapon against cities," you have *already* adopted the intention to kill civilians.
          *   The "general principle" isn't a neutral justification; it's an admission of the intent. To say "we use what we have against the enemy" in the context of atomic weapons *means* "we kill civilians."
      *   **Is there a Gap?**
          *   *Critique:* Philosophers (like Foot or later consequentialists) might argue the distinction is shaky.
          *   *Anscombe's Defense:* She would say the gap is in the *moral imagination* of the defenders, not her logic. If you cannot describe the action without referencing the killing of innocents, the killing is intended.
          *   *For the Novel:* This tension is *gold* for dialogue. Characters can debate whether "using the bomb" is distinct from "killing the people."
      *   **Historical Context for the Novel:**
          *   1956 Oxford atmosphere.
          *   Anscombe's demeanor (fierce, Catholic, Wittgensteinian).
          *   The vote (it passed, but she made a scene).
      *   **Refining the "Gap" Analysis:**
          *   The user asks if the means/side-effect line is doing less work than she wants.
          *   *Answer:* In this specific case, Anscombe argues the line *holds* because the act is inherently murderous. The "general principle" justification fails because it ignores the *object* of the act.
          *   *Fixable?* Yes, by insisting that "using the bomb on a city" *is* "killing civilians." The description of the act binds the intention.

  5.  **Review and Refine:**
      *   *Tone:* Academic but accessible, suitable for a writer doing research.
      *   *Accuracy:* Ensure Anscombe's Thomistic roots are acknowledged but not overwhelming.
      *   *Specifics:* Mention the term "indiscriminate." Mention the rejection of "outcome" as the sole judge.
      *   *The "Gap" Question:* Be honest. Many philosophers think the Doctrine of Double Effect (DDE) has problems. But within Anscombe's system, it's consistent. The "general principle" justification is treated by her as a refusal to engage in moral reasoning, which she finds culpable.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, did she explicitly address Potsdam?* She references the Allied policy of area bombing generally. She argues Truman continued a policy already established (Dresden, Tokyo). The "new weapon" just made it more efficient.
      *   *Make sure to distinguish:* Anscombe isn't just saying "Truman is bad." She's saying "Oxford is complicit if you honor him."
      *   *The "Means" vs. "Side Effect":* Crucial point: If the goal is "end the war," and the method is "destroy civilian morale," then civilian death is the *means*. If the goal is "destroy munitions factory," and civilians die nearby, that's *side effect*. Anscombe claims Hiroshima was the former.

  7.  **Final Output Structure:**
      *   Intro: Validating the user's insight.
      *   Part 1: The Distinction (Intention vs. Foresight).
      *   Part 2: Applying to Truman (The Indiscriminate Act).
      *   Part 3: Tackling the "General Principle" (The User's specific hurdle).
      *   Part 4: Is it a Gap? (Philosophical critique vs. Anscombe's internal logic).
      *   Part 5: Novelistic Advice (How to stage this).

  8.  (Final check against the prompt): Did I answer if it's a gap? Yes. Did I explain the distinction? Yes. Did I apply it to Truman? Yes.

  *Self-Correction on the "Gap":* I need to be careful not to say "Anscombe is right." I need to say "Here is how Anscombe resolves it, and here is where critics say it breaks." The user asks if it's a genuine gap. I should acknowledge that *philosophically*, many think DDE is problematic, but *textually*, Anscombe closes the loop by defining the act's description.

  *Key Insight for the User:* The "General Principle" justification is, for Anscombe, a *refusal to describe the action morally*. It's a bureaucratic euphemism. Her move is to force the true description: "Murder."

