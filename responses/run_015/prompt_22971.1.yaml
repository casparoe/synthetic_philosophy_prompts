answer: |-
  This is a fantastic question. You have correctly identified that the popular summary of Anscombe ("she hated consequentialism") misses the nuance of her actual moral psychology, and you have put your finger on the exact pressure point in her argument regarding Truman.

  For a novel set in 1956 Oxford, getting this right will add immense texture. Anscombe was not a utilitarian hawk being shouted down by a pacifist; she was a rigorous Aristotelian-Thomist challenging the moral coherence of her colleagues.

  Here is a walkthrough of the distinction, how she applies it to Truman, and an analysis of the "gap" you've identified regarding the Potsdam justification.

  ### 1. The Distinction: Intention vs. Foreseen Side-Effect
  Anscombe relies on the **Doctrine of Double Effect** (DDE), though she frames it through Wittgensteinian philosophy of action. The core is not about *outcomes* (how many die), but about the **description of the action under which the agent acts.**

  *   **Choosing as a Means (Intention):** You cannot act *under the description* "kill the innocent" to achieve a good end. If the death of the innocent is part of your plan's mechanism—if the plan fails without their death—you have intended their death.
      *   *Example:* Blowing up a hospital to demoralize the enemy and end the war. The death is the means. This is murder.
  *   **Foreseeing as a Side-Effect:** You may act *under the description* "destroy a military target," knowing with statistical certainty that innocents will die, provided their death is not the mechanism of your success.
      *   *Example:* Blowing up a munitions factory. You know workers inside will die. You regret it. But if, by some miracle, the workers survived, your mission would still be a success. Their death was foreseen, not intended.

  **Anscombe's Crucial Move:** She argues that "intention" is not a private mental state (what you feel in your heart); it is public. It is determined by **what you are doing.** If the action you perform is "indiscriminate bombing," the intention is "killing civilians," regardless of what you tell yourself about "ending the war."

  ### 2. Applying it to Truman
  Anscombe argues that the atomic bombings were not "side-effects" of a military strike. They were **indiscriminate attacks on civilian populations.**

  *   **The Target:** The target was not a specific military installation in isolation; it was the city itself.
  *   **The Mechanism:** The mechanism for forcing surrender was the destruction of civilian morale through mass death.
  *   **The Verdict:** Therefore, the death of the innocent was the *means* to the end. It falls under the prohibition of murder.

  She explicitly rejects the idea that the "statistical certainty" of death makes it the same as intention. She admits we are responsible for foreseen effects, but she draws a hard line: you may *permit* evil (side-effects) in the pursuit of good, but you may not *do* evil (intended means) so that good may come.

  ### 3. The "General Principle" Problem (Your Sticking Point)
  You noted that the justification Anscombe reports—that the Allies had a "general principle" at Potsdam to use any weapon they possessed—doesn't slot neatly into "means" vs. "side-effect." It sounds like: *"We had a hammer, so we hit the nail."*

  This is where your close reading is excellent. If the justification is merely "availability," does the moral distinction matter?

  **Anscombe's Counter-Move:**
  Anscombe treats the "General Principle" justification not as a valid moral argument, but as a **refusal to engage in moral description.**

  She argues that adopting a "general principle" of using whatever weapon you have *without distinguishing between combatants and non-combatants* is itself the adoption of a murderous intention.
  *   If your principle is "use the bomb," and the bomb *only* works by killing civilians, then your principle is "kill civilians."
  *   She argues that the Potsdam declaration and the subsequent policy erased the distinction between military and civilian targets. By adopting a policy of **area bombing** (which started with conventional bombs in Dresden and Tokyo before the A-bomb), the Allied leadership had already decided that the killing of innocents was an acceptable *method*, not just a regrettable *outcome*.

  **So, is there a gap?**
  In Anscombe's framework, there is no gap. She closes it by insisting that **the description of the act dictates the intention.**
  *   *Truman's Defense:* "I intended to end the war; death was a side effect of using the tool we had."
  *   *Anscombe's Reply:* "You cannot describe the act as 'using a tool.' You must describe it as 'killing 100,000 people to frighten the Emperor.' Under *that* description, the killing is the means."

  She treats the "General Principle" defense as a form of moral blindness. To say "we use what we have" is to refuse to ask "what *is* what we have?" If what you have is a civilian-killer, using it makes you a civilian-killer.

  ### 4. Is the Distinction Doing Less Work Than She Wants?
  This is the philosophical crux for your novel. Many philosophers (even some of her contemporaries like Philippa Foot, eventually) argued that the distinction collapses under the weight of "statistical certainty."

  **The Critique (The Gap):**
  If I drop a bomb on a factory knowing 100% it will kill the nearby orphanage, how is that morally different from dropping a bomb on the orphanage to clear the land for the factory? In both cases, I chose a course of action where their death was inevitable. Critics argue the "means/side-effect" line is a semantic game to soothe the conscience.

  **Anscombe's Defense (The Fix):**
  Anscombe would argue the gap is in the *critic's* moral imagination, not her logic.
  *   **The Fix:** She insists that the *structure of the will* matters. If I mourn the death in the first case and celebrate it in the second, my will is oriented differently toward the good.
  *   **In the Truman Case:** She argues the US *did* celebrate the death (or at least treated it as the mechanism of victory). The "General Principle" wasn't a neutral policy; it was a policy of **terror.**

  **For your novel:**
  This is not a bug; it's a feature. This tension is exactly what was happening in the Oxford common rooms.
  *   **Character A (Anscombean):** "It matters *why* they died. Did their death make the victory possible? Yes? Then it's murder."
  *   **Character B (Skeptic/Utilitarian):** "But Professor, if the outcome is the same, and the certainty was 100%, aren't you just splitting hairs to avoid the hard math of saving lives in the long run?"
  *   **Character C (The "General Principle" Defender):** "We didn't target them specifically; we targeted the war machine, and they were part of the war machine's context."
  *   **Anscombe's Rebuttal:** "Then you have redefined 'war machine' to include children. That is not defense; that is corruption."

  ### 5. Historical Nuance for the Scene
  To ground this in 1956 Oxford:
  1.  **The Vote:** The degree *was* granted. Anscombe lost the vote, but she won the moral argument in the eyes of history. She stood up during the ceremony and read a protest (or circulated the pamphlet beforehand).
  2.  **The Atmosphere:** This was post-Suez, early Cold War. The "Just War" theory was being dusted off. Anscombe was one of the few women in the room, often smoking a pipe, fiercely Catholic, and intellectually terrifying.
  3.  **The "Gap" in the Room:** Many of her colleagues (like Isaiah Berlin or A.J. Ayer) found her metaphysics archaic. They thought the "means/side-effect" distinction was medieval scholasticism irrelevant to the nuclear age.
  4.  **Anscombe's Motivation:** She wasn't just anti-Truman; she was anti-*Oxford-complicity*. Her argument was: "If you grant this degree, you are stating that mass murder of innocents is compatible with the Doctor of Civil Law. You are corrupting the university's moral voice."

  ### Summary for your Writing
  *   **The Distinction:** It's about the *description of the act*, not the mental feeling. If the act is "destroy city," the intent is "kill people."
  *   **The "General Principle":** Anscombe treats this as a euphemism for "we chose to ignore the distinction between combatant and civilian." It doesn't bypass her distinction; it violates it by refusing to make the distinction at all.
  *   **The Gap:** Philosophically, yes, the line is thin. But for Anscombe, it is the *only* line that prevents morality from becoming mere arithmetic.
  *   **Dramatic Tension:** Have your characters debate whether "statistical certainty" equals "intention." That is the live wire of the 1956 debate.

  Anscombe's point is that if you allow the "General Principle" (use what you have) to override the "Innocent Immunity" (do not kill the innocent), you have abolished morality entirely and replaced it with technique. That is the horror she wants your characters to feel.
