          *   *Claim:* Utility used to be feeling/happiness. Samuelson cut the feeling out. We only observe choices. Preference = disposition to choose. Utility = convenient numbering, not a quantity.
          *   *Assessment:* Generally correct on the behavioral shift (operationalism). "Preference just is a disposition to choose" is the core RPT stance. "Utility is only a convenient numbering" is correct (ordinalism).
          *   *Nuance:* It's a bit simplified but accurate enough for a non-technical group.

      *   **Paragraph 2 (Addressing Part b):**
          *   *Claim:* If she picks $x$ while $y$ affordable, she revealed prefers $x$ to $y$.
          *   *Assessment:* Correct ($x \succeq y$).
          *   *Claim:* WARP says if $x$ chosen with $y$ available, never see $y$ chosen with $x$ available.
          *   *Assessment:* Correct (basic definition of WARP).
          *   *Claim:* SARP says same for chains, so no cycles.
          *   *Assessment:* Correct.
          *   *Claim:* Choices passing tests can be thought of as maximizing utility; failing can't.
          *   *Assessment:* Correct (Representation Theorem).

      *   **Paragraph 3 (The "Cardinality/Interpersonal" Trap):**
          *   *Claim:* Function isn't unique, not arbitrary. Two utility functions differ by positive affine transformation ($u' = a + b \cdot u$).
          *   *Assessment:* **WRONG.** This is the cardinal utility/von Neumann-Morgenstern (vNM) definition. Revealed Preference (ordinal utility) only requires *positive monotonic* transformations ($u' = f(u)$ where $f' > 0$). Affine transformations preserve expected utility ratios, not just ordinal ranking.
          *   *Claim:* Ratios of utility differences are meaningful.
          *   *Assessment:* **WRONG.** This follows from the affine error. In ordinal RPT, utility differences have *no* meaning.
          *   *Claim:* That makes utility comparisons across people possible in principle.
          *   *Assessment:* **WRONG.** Standard RPT/Ordinal utility explicitly *forbids* interpersonal comparisons. This is a major conceptual error.

      *   **Paragraph 4 (Addressing Part c - Testing):**
          *   *Claim:* Can still test for consistency with shrinking budget sets.
          *   *Assessment:* **WRONG/MISLEADING.** If budget sets never overlap (nested shrinking), you cannot test WARP/SARP directly because you never observe a choice where a previously chosen bundle was affordable. You need overlapping budget sets to test consistency (Afriat's Theorem context). If $B_t \subset B_{t-1}$ and $x_{t-1} \notin B_t$, you can't check if $x_t$ was affordable when $x_{t-1}$ was chosen, nor vice versa.
          *   *Claim:* Rational shopper has to buy less of a good when relative price goes up (Substitution Effect).
          *   *Assessment:* **WRONG.** This confuses the *Law of Demand* (which holds for normal goods but not Giffen goods) with *Consistency*. A rational agent *can* buy more of a good when its price rises (Giffen good) without violating utility maximization. RPT tests consistency, not the slope of the demand curve.
          *   *Claim:* If eggs get expensive and she buys more, she's revealed an inconsistency.
          *   *Assessment:* **WRONG.** As above, this could be a Giffen good. It does not violate SARP/WARP necessarily.
          *   *Claim:* No utility function could generate that.
          *   *Assessment:* **WRONG.** Convex preferences can generate upward-sloping demand curves (income effect dominates substitution effect).

      *   **Paragraph 4 (Addressing Part c - Welfare/Recovery):**
          *   *Claim:* Utility levels aren't linked, can't say better/worse off.
          *   *Assessment:* **CORRECT.** Without overlap, you can't order the bundles welfare-wise.
