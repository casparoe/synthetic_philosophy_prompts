answer: |-
  **FRAMING DOCUMENT: ADVERSARIAL COLLABORATION ON INTERPERSONAL COMPARISONS**

  **To:** The Comparabilist; The Scale-Skeptic
  **From:** The Convener
  **Date:** [Autumn 202X]
  **Subject:** Pre-Workshop Statement of Structure, Disagreement, and Stipulated Cases

  ### I. Agreed Claims and Structural Invariance

  The following claims constitute the shared foundation for this collaboration. Both participants affirm these propositions as the starting point for the two-day dialogue. They are formulated to remain neutral regarding the metaphysical status of well-being while fixing the formal structure of the dispute.

  1.  **Representation:** We model the moral relevance of an individual’s life using a real-valued function $u_i$. We agree that for the policy cases below, a social ordering $R$ over outcomes cannot be generated if each $u_i$ is treated as unique only up to strictly increasing transformation (ordinalism). Some restriction on admissible transformations is required to generate a determinate recommendation.
  2.  **Invariance Classes:** We agree that the substantive disagreement maps onto a disagreement regarding the class of admissible transformations $\Phi$ applicable to the profile $(u_1, ..., u_n)$.
      *   **Class A (Unit Comparability):** $\phi_i(u) = a u + b_i$ (common unit $a$, arbitrary origin $b_i$). This licenses comparisons of *differences* across persons but forbids comparisons of *levels*.
      *   **Class B (Full Comparability):** $\phi_i(u) = a u + b$ (common unit $a$, common origin $b$). This licenses comparisons of both *differences* and *levels*.
  3.  **Policy Dependence:** We agree that the recommendation for the two stipulated policy cases (defined below) depends on whether the social evaluation is invariant under Class A or Class B. Specifically, a recommendation to prioritize the "Severe" case over the "Ordinary" case based on *absolute deprivation* requires Class B (or a convention functionally equivalent to it). A recommendation based solely on *efficiency of gain relative to capacity* may be consistent with Class A.
  4.  **Epistemic Access:** We agree that even if Class B is metaphysically correct (Comparabilist), our epistemic access to the parameters $a$ and $b$ is noisy and contestable. We agree that even if Class A is metaphysically correct (Skeptic), we may adopt a convention from Class B for decision-making purposes, provided we acknowledge it as a convention.
  5.  **Stipulated Policy Cases:**
      *   **Case Alpha (Severe Relief):** A small group ($N_S$) suffers from chronic, unremitting pain. Their attainable range of well-being $[L_S, H_S]$ is severely restricted, with $L_S$ representing a state widely judged as catastrophic. A policy intervention provides a large gain $\Delta_S$ relative to their baseline.
      *   **Case Beta (Ordinary Gain):** A large group ($N_O \gg N_S$) lives within an ordinary attainable range $[L_O, H_O]$. A policy intervention provides a small gain $\Delta_O$ to each.
      *   **The Conflict:** In raw resource terms, Case Beta may be more "efficient." In well-being terms, the Comparabilist may judge $\sum \Delta_S > \sum \Delta_O$ due to the low absolute level of $L_S$. The Skeptic denies the coherence of summing these $\Delta$ values without a prior convention to normalize the scales.

  ### II. Disagreements Table

  The following table isolates the specific propositions where the participants diverge. The formulations are drafted to allow each participant to sign their respective column without conceding the other's metaphysics.

  | Disputed Proposition | Comparabilist Formulation | Scale-Skeptic Formulation | Note on Substantive Nature |
  | :--- | :--- | :--- | :--- |
  | **1. Truth Conditions of Level Claims** | Propositions of the form "$u_i(x) < u_j(y)$" have truth values fixed by natural facts independent of our measurement conventions. | Propositions of the form "$u_i(x) < u_j(y)$" lack truth values until a coordination convention (e.g., common zero-point) is imposed. | **Non-Verbal:** This is not about the word "truth." It is about whether nature provides a "common zero." If the Comparabilist is right, we can be *wrong* about levels even if our convention is consistent. |
  | **2. Status of Cross-Person Differences** | Differences $\Delta u_i$ and $\Delta u_j$ are comparable because the *units* are fixed by facts about the intensity of experience/trade-offs. | Differences are comparable only if we *stipulate* that a unit of trade-off for $i$ equals a unit for $j$. Intrapersonal trade-offs do not logically entail interpersonal unit equivalence. | **Non-Verbal:** Disagreement on whether "equal trade-off" implies "equal well-being gain." |
  | **3. The "Coarse Verdict" Limit** | Coarse verdicts (e.g., "A is starving, B is fed") are approximations of precise facts. | Coarse verdicts are the *only* valid cross-person claims; they do not track a hidden precise scale but reflect overlapping response patterns. | **Verbal/Metaphysical:** Disagreement on whether "precision" exists beneath the "coarseness." |
  | **4. Policy Justification** | Prioritizing Case Alpha is justified by the *fact* of their lower absolute level, regardless of range normalization. | Prioritizing Case Alpha is justified only by a *convention* (e.g., giving weight to those with restricted ranges), not by absolute level facts. | **Non-Verbal:** Affects how we revise policy if new empirical data suggests the "pain" group has adapted preferences. |

  **Note on Verbal Disputes:**
  There is a subsidiary verbal dispute regarding the term "Measurement." The Comparabilist uses "measurement" to denote *discovery* of pre-existing ratios. The Skeptic uses "measurement" to denote the *imposition* of a homomorphism from empirical relations to numbers. We agree to bracket this terminological dispute and focus on the *invariance class* (Section I, Claim 2) as the substantive proxy.

  ### III. Cruxes: Stipulated Cases and Predictions

  The following three sub-questions are designed to move the dialectic. For each, we stipulate a piece of evidence or a thought experiment. Participants are asked to record their prediction/interpretation in advance.

  **(a) The Cross-Person Decoder**
  *   **Stipulation:** A machine learning model is trained *exclusively* on within-person neural/behavioral data of Subject A (mapping stimuli to reports). Without retraining or labels from Subject B, the model predicts Subject B's reported experience of novel stimuli significantly above chance, even when B's life circumstances differ radically from A's.
  *   **Comparabilist Prediction:** This success indicates that $u_A$ and $u_B$ share a common scale fixed by biological facts. The decoder has latched onto the natural kind "well-being."
  *   **Scale-Skeptic Prediction:** This success indicates shared *functional structure* or *response topology*, not a common scale zero or unit. The model predicts *reports*, not *well-being levels*. It shows we use similar languages, not that we inhabit the same metric space.
  *   **Bearing:** Does predictive success entail metric identity?

  **(b) The Common-Anchor Protocol**
  *   **Stipulation:** Participants calibrate their reports against a standardized battery of controlled experiences (e.g., specific thermal pains, sweetness levels). These anchors are used to compare people whose lives never exposed them to anything in the battery (e.g., comparing a monk's contemplative joy to a trader's financial gain using only thermal anchors).
  *   **Comparabilist Prediction:** This is **Measurement**. The anchors reveal the underlying continuity of the scale; the unexperienced outcomes are located on the same continuum via inference.
  *   **Scale-Skeptic Prediction:** This is **Stipulated Convention**. Extending the scale from thermal pain to financial gain requires a theoretical bridge that is not empirically forced. It is valid for *differences* (if trade-offs align) but not for *levels* across distinct qualitative domains.
  *   **Bearing:** Does calibration on a subset of experiences fix the scale for all experiences?

  **(c) Range-Normalization and the Intrapersonal Analogue**
  *   **Stipulation:** We rescale each person so that their own attainable worst outcome is 0 and their own attainable best is 1. We then compare the groups in Case Alpha and Case Beta using these normalized scores.
  *   **Comparabilist Position:** This **begs the question** against level comparability. It assumes only relative position matters. If the "worst outcome" for the Pain group is objectively worse than the "worst outcome" for the Ordinary group, normalization hides this moral fact.
  *   **Scale-Skeptic Position:** This is **compatible** with my position. It is a defensible convention for aggregation that respects intrapersonal cardinality without asserting interpersonal level facts.
  *   **The Intrapersonal Pressure Point:** Both sides must answer: *Can you compare one person's well-being across a radical break in their concerns (e.g., pre- and post-religious conversion, or pre- and post-dementia)?*
      *   If **Yes**: What resource allows this comparison? If it is "psychological continuity" or "overlapping chains," why does this resource not settle the interpersonal case?
      *   If **No**: How can you justify long-term policy planning for individuals whose values will shift?
      *   **Comparabilist Task:** Explain why the resource that settles the intra-personal break does not automatically settle the inter-personal break.
      *   **Skeptic Task:** Explain why accepting intra-personal comparison across breaks does not force you to accept inter-personal comparison via overlapping chains of society.

  ### IV. Closing Note: Conditions for Failure

  This collaboration will be deemed a **failure** if the final output is a "negotiated compromise" that obscures the source of disagreement. Specifically:

  1.  **False Consensus:** We must not agree to "use both methods depending on context" unless we specify the *principle* that dictates the switch. If the principle relies on interpersonal level comparisons, the Skeptic cannot sign it without contradiction.
  2.  **Retreat to Slogans:** We must not end by restating that "levels are real" vs. "levels are conventions." We must identify the specific empirical claim (e.g., about the Decoder or the Anchors) that would force one side to update.
  3.  **Genuine Result:** A successful outcome is defined as either:
      *   (a) One participant conceding that a specific empirical finding (e.g., the Decoder's success) would force them to abandon their invariance class; OR
      *   (b) Both participants agreeing on a precise "Decision Rule" for the Policy Cases that explicitly isolates the convention being used, such that a policy-maker could implement the Skeptic's view without accidentally smuggling in the Comparabilist's metaphysics.

  If we conclude merely that "the debate is hard," we have failed. The goal is to locate the exact point where the metaphysics drives the policy, so that the policy choice becomes transparent.

  ***

  **Application to Policy Cases (Convener's Summary for Discussion)**

  *   **Where the disagreement determines different recommendations:**
      *   If the Comparabilist is correct, we might prioritize **Case Alpha** even if the *percentage* gain in range is smaller, provided the *absolute* gain in well-being units is larger (due to the low baseline $L_S$).
      *   If the Skeptic is correct, we cannot calculate "absolute gain." We must rely on a convention. If we adopt Range-Normalization (0 to 1), **Case Alpha** will almost certainly win (large % of small range vs. small % of large range). If we adopt a Resource-Based convention, **Case Beta** might win. The Skeptic forces us to admit the choice of convention is political, not scientific.
  *   **Where it makes no difference:**
      *   If the gain in Case Alpha is both absolutely large (Comparabilist) and a large percentage of range (Skeptic), both recommend Alpha.
      *   If the gain in Case Beta is both absolutely large and a large percentage of range (due to scale of $N_O$), both recommend Beta.
      *   **The Crux:** The collaboration must focus on the intermediate case where Absolute Gain and Relative Gain diverge. That is the only zone where the metaphysics dictates the policy.
