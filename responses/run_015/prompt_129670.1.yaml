answer: |-
  Your roommate has captured the "vibe" of G.E. Moore's *Principia Ethica* (1903) but has conflated several distinct arguments, resulting in a explanation that is philosophically scrambled. They got the destination right (Moore is a type of utilitarian who values friendship and beauty) but got the map completely wrong (how he gets there and what the specific arguments do).

  Here is a breakdown of what is accurate, what is a misrepresentation, and a specific correction on the "Organic Unity" confusion.

  ### 1. The Claim: "Friendship and Beauty are the only things with intrinsic value."
  *   **Verdict:** **Mostly Accurate (with nuance).**
  *   **The Correction:** Moore does argue that the enjoyment of beautiful objects and the pleasures of human intercourse (friendship/love) are the **greatest** and most fundamental intrinsic goods. In *Principia Ethica*, he writes that these two things constitute the "ultimate and fundamental truth of Moral Philosophy."
  *   **The Nuance:** Moore doesn't necessarily say they are the *only* things with *any* positive value. He acknowledges that knowledge, for example, has some value, but usually only as a constituent part of a larger organic whole (like the consciousness of a truth). However, for all practical moral purposes, your roommate is right: Moore builds his "Ideal" almost entirely around these two pillars.

  ### 2. The Claim: "He proves this list with the Open Question Argument (OQA)."
  *   **Verdict:** **False.**
  *   **The Correction:** This is the biggest error in your roommate's explanation. The Open Question Argument does **not** tell us *what* things are good.
  *   **What OQA actually does:** It argues that the concept "good" is simple, indefinable, and non-natural. It proves you cannot define "good" as "pleasure" or "evolutionary fitness." It shuts the door on Naturalism.
  *   **How we know Friendship/Beauty are good:** Moore relies on **Intuitionism** here, not the OQA. Once the OQA clears the ground (by saying "good" can't be defined scientifically), Moore asks us to reflect intuitively on what states of affairs appear self-evidently valuable. He *intuits* that friendship and beauty are good; the OQA just prevents him from trying to prove it via science or psychology.

  ### 3. The Claim: "Organic Unities means Friendship and Beauty only generate value when they're together (1+1=3)."
  *   **Verdict:** **Misrepresentation / Conflation.**
  *   **The Correction:** Your roommate is conflating two different applications of Moore's "Principle of Organic Unities."
  *   **What Organic Unity actually means:** Moore argues that the value of a whole is not necessarily the sum of the values of its parts. A part might have no value in isolation but add immense value to a whole.
  *   **How Moore applies it:** He does **not** typically argue that *Friendship* must be combined with *Beauty* to create value. Rather, he argues that **Consciousness** must be combined with an **Object**.
      *   *Example:* A beautiful world with no one to see it has no value. A conscious mind seeing nothing has no value. But "Consciousness of a Beautiful Object" is an organic unity that *does* have value.
      *   *Example:* Similarly, the emotion of love directed at a worthy person is an organic unity.
  *   **The Roommate's Error:** They seem to think Moore requires you to be friends with someone *while* looking at art to generate value. Moore treats "Personal Affection" and "Appreciation of Beauty" as two distinct, primary categories of good. They don't need to be mixed with each other; they just need to be experienced consciously.

  ### 4. The Claim: "Moore uses Organic Unities to defend a Utilitarian Calculus."
  *   **Verdict:** **Backwards.**
  *   **The Correction:** Moore is a utilitarian (specifically an **Ideal Utilitarian**) not *because* of organic unities, but because of how he defines "right."
  *   **The Logic:** Moore defines "right action" as "the action that produces the most intrinsic good." That is the definition of utilitarianism.
  *   **The Role of Organic Unities:** Actually, Organic Unities make the utilitarian calculus **much harder**, not easier. If value isn't additive (1+1=2), you can't just sum up units of pleasure. You have to judge complex wholes intuitively. So, Organic Unities don't *defend* utilitarianism; they complicate the math of it.

  ### 5. The Claim: "Moore is basically a utilitarian with extra steps, and OQA is a smokescreen for intuitionism."
  *   **Verdict:** **Half-Right, Half-Cynical.**
  *   **Utilitarian with extra steps:** This is a fair colloquial summary. Moore is an **Ideal Utilitarian**. Classical utilitarians (like Bentham/Mill) say maximize *pleasure*. Moore says maximize *good*, and since "good" includes beauty and friendship (not just pleasure), it's utilitarianism with a broader, "ideal" currency.
  *   **OQA as a smokescreen:** This is uncharitable. The OQA isn't a smokescreen; it is the logical foundation that forces him into intuitionism. If "good" were a natural property (like pleasure), we could measure it scientifically. Because the OQA proves "good" is non-natural, we *must* use intuition to identify it. It's a structural necessity, not a trick.

  ### Summary for Your Roommate
  You can tell your roommate they have the right "spoilers" for Moore's book but mixed up the plot points.

  1.  **Yes,** Moore is an Ideal Utilitarian.
  2.  **Yes,** he thinks Friendship and Beauty are the top intrinsic goods.
  3.  **No,** the Open Question Argument doesn't prove *which* things are good; it just proves "good" can't be defined as "pleasure."
  4.  **No,** Organic Unity doesn't mean Friendship + Beauty must be combined. It means Consciousness + Object must be combined.
  5.  **No,** Organic Unity doesn't justify utilitarianism; it just makes the calculation of consequences more complex.

  **The Bottom Line:** Moore argues we must use **intuition** to identify that friendship and beauty are good (because the OQA shows we can't define good naturally), and we must use **utilitarian reasoning** to maximize those goods, while remembering that **organic unities** mean we can't just add up values like simple math. Your roommate compressed all that into one tangled sentence.
