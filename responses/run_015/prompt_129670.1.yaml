      *   **Topic:** G.E. Moore's ethical theory (specifically regarding beauty, friendship, intrinsic value, the Open Question Argument, Organic Unities, and Utilitarianism).
      *   **Problem:** The user's roommate gave an explanation that sounds suspicious/mangled. The user wants to know what's accurate, what's wrong, and specifically about the "organic unity" claim regarding friendship and beauty.
      *   **Key Claims by Roommate:**
          1.  Moore thinks friendship + appreciation of beauty are the *only* two things with intrinsic value.
          2.  Moore *proves* this with the Open Question Argument (OQA).
          3.  OQA shows good can't be natural, so affection/art are self-evidently good.
