answer: |-
  To analyze the disappearance of British dueling through the lenses of Bernard Williams and Kwame Anthony Appiah requires a precise mapping of the "economy of esteem" that governed the gentlemanly class. We must treat honor not as a vague sentiment but as a currency with specific exchange rates, issuers, and validators.

  ### 1. Mapping the Mechanics of Honor (1820s vs. 1850s)

  **Who Held Standing?**
  In this context, "standing" refers to the capacity to confer or withhold the social recognition that constitutes honor.
  *   **c. 1820:** Standing was highly localized and peer-based. It resided in the **Regimental Officer Corps**, the **Gentlemen's Clubs** (e.g., White's, Brooks's), and the **County Gentry**. The Crown and the Church held moral authority but lacked *honorific* standing; a clergyman's condemnation carried weight for the soul, but a fellow officer's silence carried weight for the social self.
  *   **c. 1850:** Standing had shifted toward a broader **Public Opinion** (mediated by the press) and the **State**. The Monarch (William IV and later Victoria) actively withheld honor from duelists. The "Gentleman" was increasingly defined by the professional and commercial classes who viewed martial aggression as archaic. The peer group remained important, but its definition had expanded to include those who valued self-control over martial risk.

  **The Payoff Structure for a Challenged Gentleman**

  | Feature | **c. 1820s (The Practice Persists)** | **c. 1850s (The Practice Collapses)** |
  | :--- | :--- | :--- |
  | **Option A: Accept Duel** | **Payoff:** High social retention. You remain a "man of spirit." <br>**Cost:** Physical risk (death/injury); Legal risk (low, as juries acquitted). | **Payoff:** Low social retention. You may be seen as brave, but also foolish. <br>**Cost:** Physical risk; Legal risk (high, as juries began convicting); Moral stigma (seen as barbaric). |
  | **Option B: Refuse Duel** | **Payoff:** Social death. Labeled a coward; expelled from clubs; ostracized by peers; career ruin in military. <br>**Cost:** Survival. | **Payoff:** Social survival. Refusal can be framed as "Christian duty" or "obedience to law." <br>**Cost:** Minor stigma (may be called cautious), but no longer total exclusion. |
  | **The "Coward" Label** | **Force:** Devastating. It removed the essential quality of the gentleman. | **Force:** Diminished. It could be outweighed by the label of "Criminal" or "Sinner." |

  **The Role of Law**
  The fact that dueling was technically criminal throughout this period explains nothing about the *timing* of its disappearance. In 1800, the law was a "paper tiger"; judges instructed juries to acquit if the duel was "fair." By 1840, judges instructed juries to convict of manslaughter. The law did not drive the change; rather, the **enforcement of the law tracked the shift in honor.** Legal prohibition became effective only when the social cost of prosecution (losing honor) was lower than the social cost of the crime (dueling). The law followed the shift in who held standing to confer honor.

  ### 2. Evaluating the Theories

  **The Williams Lens (Erosion of Interests/Conditions)**
  Williams suggests that moral shifts are epiphenomenal to changes in material or social structures.
  *   *Fit:* The end of the Napoleonic Wars (1815) is a crucial structural shift. The officer class was demobilized; the gentry's role shifted from martial defense to imperial administration and commerce. The *utility* of the warrior ethos eroded. A dead gentleman was no longer a martyr for the nation but a waste of human capital.
  *   *Strain:* This view struggles with the **dueling abroad** phenomenon. If the underlying interest in honor had truly eroded, gentlemen would not have traveled to Calais or Ostend to duel. The fact that they did suggests the *interest* in maintaining honor remained, but the *location* where that honor could be validly conferred had shifted. The British soil no longer supported the transaction, but the personal desire for the status remained. Williams might call this a lag, but it suggests the "interest" is more complex than mere material utility.

  **The Appiah Lens (Redefinition of Honor)**
  Appiah argues that the script of honor was rewritten. Dueling moved from being a *requirement* of honor to a *violation* of it.
  *   *Fit:* This explains the speed and the class pattern. The redefinition was led by the "evangelical" wing of the elite and the monarchy. Once the Duke of Wellington (the ultimate warrior-hero) and the King declared dueling ungentlemanly, the script flipped. To duel was no longer to defend honor but to show a lack of self-control—a vice incompatible with the new ideal of the "Christian Gentleman."
  *   *Strain:* Appiah must explain *why* the script flipped when it did. A redefinition does not happen in a vacuum. It requires a coalition of people with standing to agree on the new definition. Appiah risks treating the "conversation" about honor as too autonomous from the material conditions Williams highlights.

  **Speed and Class Specificity**
  The rapid collapse (roughly 1820–1850) fits Appiah better. Material conditions (the rise of commerce) changed slowly over a century, yet dueling persisted until a specific tipping point. The "class-specific pattern" (fading fastest among the high aristocracy connected to the Court, persisting longer in the lower gentry and military) supports Appiah: the redefinition started at the top of the honor hierarchy (Monarch/High Aristocracy) and trickled down. When the highest conferrers of honor withdraw recognition, the practice collapses faster than material interests would predict.

  ### 3. Theoretical Gaps and Convergence

  **Is there a feature neither theory fully explains?**
  Both theories struggle with the **persistence of the code in isolated pockets** (e.g., Ireland, or specific military regiments) long after it vanished in London.
  *   *Williams* would say local material conditions (agrarian tension, military isolation) sustained the interest.
  *   *Appiah* would say local scripts of honor remained insulated from the metropolitan redefinition.
  *   *The Gap:* Neither fully accounts for the **emotional residue**. Former duelists often felt shame *retrospectively*, not just social pressure. They came to feel the act was inherently wrong, not just inexpedient. Williams dismisses this as rationalization; Appiah embraces it as moral progress. The history shows men weeping over past duels, suggesting the internal psychology of honor changed, not just the external payoff.

  **Are they the same mechanism at different levels?**
  There is a strong case that they are. The "erosion of interests" (Williams) created the **vacuum** that allowed the "redefinition of honor" (Appiah) to take hold.
  *   When the military threat to Britain vanished (1815), the *utility* of the violent gentleman decreased.
  *   This made the elite receptive to a new script (Evangelicalism/Rule of Law).
  *   Once the new script was adopted by those with standing (Williams' conditions), the redefinition (Appiah's mechanism) became self-enforcing.
  *   Thus, Williams explains the *possibility* of the shift; Appiah explains the *mechanism* of the shift.

  ### 4. Moral Arguments and the Social Scaffold

  Does this history support the claim that moral revolutions are never driven by arguments?
  **No.** It supports a more nuanced claim: **Moral arguments are ineffective without a prior shift in the economy of esteem.**

  For centuries, clergy and jurists argued against dueling on moral and legal grounds. These arguments failed completely while the honor-code remained intact. A gentleman could accept he was sinning but choose the sin to avoid the stigma of cowardice.
  However, once the *definition of honor* began to shift (due to the structural changes Williams identifies), the moral arguments suddenly gained traction. They became the *language* through which the new honor code was articulated.

  *   **The Scaffold:** The scaffold is the network of people who have standing to confer honor. In 1800, the scaffold supported the duelist. In 1850, the scaffold supported the refuser.
  *   **The Argument:** Religious and legal arguments existed in 1800 but were "cheap talk" because they came from agents without honorific standing. By 1850, those same arguments were wielded by the King and the Dukes.

  **Conclusion**
  The British dueling case suggests that Williams and Appiah are describing the infrastructure and the architecture of the same building. Williams is right that the foundation (social conditions/interests) must shift before the building can be renovated. But Appiah is right that the renovation itself (the redefinition of honor) is what makes the old practice uninhabitable.

  The disappearance of dueling was not a case of men simply calculating risk differently (Williams' crude materialism), nor was it a case of men simply being persuaded by better philosophy (a naive rationalism). It was a case where **moral arguments became effective weapons only after the social hierarchy was reorganized to give those arguments standing.** The "moral revolution" was driven by arguments, but only because the *audience* capable of validating those arguments had changed. The law did not kill dueling; the law merely ratified the new verdict of the honor court.
