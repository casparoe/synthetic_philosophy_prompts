      *(Note on Williams vs. Appiah interpretation)*: Williams (*Shame and Necessity*, *Ethics and the Limits of Philosophy*) is often read as skeptical of "morality" as a system, focusing on social structures. Appiah (*The Honor Code*) explicitly uses the dueling case to argue that honor codes *can* be morally progressive and that changing the script of honor is a valid moral mechanism. I need to make sure I represent Williams as the "material/structural erosion" view and Appiah as the "semantic/normative redefinition" view as the prompt frames them.

      *(Note on Law)*: The key is the shift in jury behavior. In 1800, a jury would acquit a duelist. In 1840, they might convict. This reflects the social shift, not the statutory shift.

      *(Note on "Standing")*: In 1820, standing lay with the Regiment/Club. In 1850, standing lay increasingly with the broader "Public" and the Crown/Church alliance.

