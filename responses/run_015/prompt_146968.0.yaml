      *   **Required Analysis Points:**
          *   Specify who had standing to confer/withhold honor.
          *   Map options and social payoffs for a gentleman (c. 1820s vs. c. 1850s).
          *   Analyze the role of legality (did law cause the shift or follow it?).
          *   Evaluate the theories against the evidence (speed, class pattern, dueling abroad).
