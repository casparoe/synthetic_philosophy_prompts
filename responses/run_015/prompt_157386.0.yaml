answer: |-
  There is no single, settled term in political science or international law that perfectly captures this specific rhetorical-legal maneuver, though it is a well-documented tension within the literature on **transitional justice**, **state apologies**, and **sovereign immunity**. Scholars like Alys Daley, Nick Smith, and Elazar Barkan have analyzed the components, but they usually describe it as a "tension" or "paradox" rather than giving the tactic itself a name.

  Since you asked for a coinage if one doesn't exist, the most precise term for this structural double move is:

  ### **Sovereign Continuity Arbitrage**

  Here is the breakdown of the concept, how it differs from simple hypocrisy, and where the tension dissolves.

  ---

  ### 1. Defining "Sovereign Continuity Arbitrage"
  **Arbitrage** is the practice of taking advantage of a price difference between two or more markets. In **Sovereign Continuity Arbitrage**, the "markets" are **Moral Capital** and **Legal Liability**, and the "asset" being traded is **State Identity Across Time**.

  *   **The Long Position (Moral Market):** The state asserts **continuity**. It claims, "We are the same enduring nation that committed this act." This allows the state to harvest the moral benefits of humility, reconciliation, and ethical leadership. The "We" in the apology is diachronic (stretching across time).
  *   **The Short Position (Legal Market):** The state asserts **discontinuity** (or procedural barriers that mimic it). It claims, "The specific legal entity or administration that authorized that act no longer exists," or "Current courts cannot judge past sovereign acts." This allows the state to avoid the financial costs of reparations or the precedent of liability.

  **The Arbitrage:** The state profits by selling a continuous identity to the public (for legitimacy) while buying back a discontinuous identity from the courts (for solvency).

  ### 2. Why It Is Not Just Hypocrisy or Equivocation
  It is important to distinguish this from simpler failures of logic or integrity.

  *   **Vs. Hypocrisy:** Hypocrisy is typically an individual failing (believing $X$ but doing $Y$). Sovereign Continuity Arbitrage is **institutional**. It is often executed by different branches of the same government (the Executive apologizes; the Judiciary dismisses). It is a feature of how modern states are structured, not necessarily a bug of individual character. The Prime Minister may genuinely feel the sorrow while the Attorney General genuinely believes the legal statute doesn't hold.
  *   **Vs. Equivocation:** Equivocation is using a word with two meanings (e.g., "bank" of a river vs. "bank" for money). Here, the word "State" or "We" *does* have a stable definition, but the **ontological status** of that definition is toggled strategically. It isn't a linguistic slip; it is a **jurisdictional toggle**.
  *   **Vs. Legal Doctrine:** In strict international law, states are generally considered **continuous** regardless of regime change (e.g., post-Nazi Germany was still legally "Germany," which is why it paid reparations). Therefore, the "different regime" argument is often a **political narrative** deployed domestically to block tort claims, rather than a strict assertion of international legal succession. The arbitrage happens in the gap between *international moral expectation* and *domestic legal procedure*.

  ### 3. The Structural Tension
  The tension exists because the modern state is a **fictional person**. Unlike a human being, who ages continuously, a state can be "reborn" (e.g., "The New South Africa," "Post-War Japan").

  *   **For the apology to work:** The state must be a **moral person** capable of guilt and memory.
  *   **For the liability to fail:** The state must be a **corporate shell** that sheds debts when the management (regime) changes.

  Sovereign Continuity Arbitrage exploits the fact that the public accepts the "moral person" metaphor while the courts rely on the "corporate shell" technicalities.

  ### 4. Cases Where the Moves Do *Not* Conflict
  There are scenarios where the state does not need to arbitrage because it chooses a consistent identity across both domains.

  **A. The "Clean Break" Settlement (Full Continuity)**
  *   **Case:** **Germany and the Luxembourg Agreement (1952).**
  *   **Mechanism:** West Germany accepted both moral *and* legal continuity with the Third Reich regarding Jewish victims.
  *   **Why no conflict:** The political will to reintegrate into the Western order outweighed the financial cost. The "We" was consistent: "We did it, we pay for it." This is the gold standard of transitional justice but is rare because it is expensive.

  **B. The "Systemic Reform" Apology (Functional Continuity)**
  *   **Case:** **The U.S. Civil Liberties Act of 1988 (Japanese Internment).**
  *   **Mechanism:** The U.S. apologized and paid reparations, but framed the wrong as a "failure of the system" rather than "evil of the ancestors."
  *   **Why no conflict:** By framing the atrocity as a glitch in the machinery of state that has since been fixed, the current government can accept liability without accepting *inherent* sin. The continuity is administrative, not moral. They pay to fix the machine, not to atone for the soul.

  **C. Truth for Amnesty (The TRC Model)**
  *   **Case:** **South Africa's Truth and Reconciliation Commission.**
  *   **Mechanism:** Perpetrators confessed (moral continuity/responsibility) in exchange for amnesty from prosecution (legal discontinuity/immunity).
  *   **Why no conflict:** This explicitly traded legal liability for moral truth. It acknowledged the tension and created a formal mechanism to resolve it, rather than hiding the contradiction.

  ### 5. When the Arbitrage Fails
  The strategy collapses when the moral claim becomes so strong that it forces legal recognition.
  *   **Example:** The **Maori claims in New Zealand** or **First Nations in Canada**. Initially, governments attempted Continuity Arbitrage (apologizing for residential schools while fighting liability). Eventually, the moral weight became so great that it breached the legal dam, resulting in massive settlement funds (e.g., the Indian Residential Schools Settlement Agreement). The "different regime" argument could not withstand the "continuous state" moral pressure.

  ### Summary
  **Sovereign Continuity Arbitrage** is the strategic oscillation of state identity to maximize legitimacy while minimizing cost. It is distinct from hypocrisy because it is baked into the separation of powers and the nature of sovereign immunity. It is distinct from equivocation because it relies on jurisdictional boundaries, not just linguistic ambiguity.

  It persists because, in the short term, **apologies are cheap** (speech acts) and **reparations are expensive** (budget acts). The state remains the only entity allowed to be two different people across time, depending on which hat it is wearing.
