answer: |-
  This is a sharp, provocative handout. It clearly signals you're teaching from the "Ergodicity Economics" / Geometric Rationality playbook (à la Ole Peters, Kelly, Breiman). That's a great stance for a seminar because it invites attack, which generates heat and light.

  However, you asked for the load-bearing tensions. You have one logical contradiction that is fatal if left unaddressed, one technical overclaim that math-literate students will pounce on, and one philosophical friction point.

  Here is the ranking of tensions by severity, followed by the single revision that cleans up the most mess.

  ### 1. The "One-Shot" Paradox (Claims 3 vs. 6)
  **Severity: Critical.**
  This is a direct logical contradiction.
  *   **Claim (3)** says the rational verdict *does* depend on the structure of the bet (one-shot $\rightarrow$ EV; repeated $\rightarrow$ Kelly).
  *   **Claim (6)** says the rational verdict *should not* depend on whether we describe it as standalone or a series.
  *   **The Trap:** A student will ask: "If I have a bet that is physically identical, but I *describe* it to you as the first of a hypothetical series, do you switch from EV to Kelly? If yes, you violate (6). If no, you violate (3)."
  *   **What has to give:** You cannot maintain that the rule changes based on repetition (3) while simultaneously claiming the description of repetition shouldn't matter (6).
  *   **Cost:** If you drop (6), you concede that framing/context matters, which weakens the "universal principle" vibe. If you drop (3), you must defend Kelly for one-shots, which is harder but philosophically richer.

  ### 2. The Goal-Reaching Overclaim (Claim 4)
  **Severity: High (Technical).**
  *   **The Issue:** Kelly maximizes the *asymptotic* growth rate. It does **not** strictly maximize the probability of reaching a fixed target $T$ by a fixed time $t$ in all cases.
  *   **The Trap:** If the target is very high relative to current bankroll and time is short, the Kelly bet is often too conservative; you need to "overbet" Kelly to have a non-negligible chance of hitting the target (sacrificing growth for variance). If the target is low, you should underbet. Kelly is only optimal for goal-reaching under specific asymptotic conditions or when minimizing *expected time* to reach a goal.
  *   **What has to give:** The absolute phrasing "Kelly is the right rule for that too."
  *   **Cost:** Nuance. You have to admit Kelly is a heuristic or asymptotic limit for goal-reaching, not a strict optimizer for finite-horizon targets.

  ### 3. The "Red Herring" Scope (Claims 2 vs. 3)
  **Severity: Medium (Philosophical).**
  *   **The Issue:** Claim (2) posits Geometric Rationality as a *general* principle for a "single agent persisting through time." Claim (3) carves out an exception for one-shots.
  *   **The Trap:** If I am a persisting agent, isn't *every* bet part of my life's trajectory? If arithmetic averages are a "red herring" for persisting agents (2), why do they suddenly become the gold standard for one-shots (3)?
  *   **What has to give:** The exception in (3).
  *   **Cost:** You lose the concession to standard Expected Value theory, making your position more radical.

  ---

  ### The Single Revision

  **Revise Claim (3) to align with Claim (2).**

  **Current (3):** "But for a genuinely one-shot choice — one bet, no reinvestment, done — I say just maximize expected value; log has no special claim there."

  **Proposed Revision:** "Even for apparent one-shots, I maximize expected log. For a persisting agent, there are no true one-shots; wealth effects carry over into future opportunities (the 'Grand World' argument), so arithmetic expectation is always the red herring."

  ### Why This Cleans Up the Most

  1.  **Resolves the Critical Contradiction:** If Kelly/Log is the rule for *all* decisions by a persisting agent, then Claim (6) is automatically satisfied. The verdict no longer shifts based on whether the bet is *described* as a series or standalone, because the rule is invariant.
  2.  **Unifies the Theory:** It merges (1), (2), and (3) into a single, coherent manifesto: *Geometric Rationality Everywhere.* This makes the handout much harder to dissect on internal consistency grounds.
  3.  **Defangs the Framing Objection:** It preempts the student who tries to trick you by re-describing a one-shot bet as a series. Your answer is already in the handout: "Description doesn't matter; agent persistence does."
  4.  **Mitigates Claim (4):** While the technical issue with goal-reaching remains, it is less glaring if you argue that Kelly is the universal rule for persisting agents. You can frame the goal-reaching point as "Kelly is the robust strategy for funding future goals over a life trajectory," which is truer than the finite-horizon claim.

  ### The Cost

  *   **Target on Your Back:** You are no longer conceding that EV is right for one-shots. Standard decision theorists will attack this harder than they would attack a nuanced "EV for one-shot, Kelly for repeated" position.
  *   **Burden of Proof:** You now need to defend why Log Utility (or growth rate) applies to a bet that physically cannot be repeated (e.g., a unique life decision with no financial carry-over). You must lean heavily on the "wealth affects future optionality" argument.

  ### A Side Note on Claim (4)
  While changing (3) is the *structural* fix, I strongly advise you to add one qualifying adjective to Claim (4) to avoid a mathematical ambush. Change "Kelly is the right rule for that too" to "Kelly is the **asymptotically** right rule for that too." This acknowledges the finite-horizon nuance without weakening your main point.

  ### Summary
  Your handout is currently a "Two-System" theory (EV for one-shot, Kelly for repeated) trying to wear "One-System" clothing (Geometric Rationality). The students will tear that seam apart.

  By switching to a **One-System (Kelly Everywhere)** view via the "Persisting Agent" argument, you make the handout logically bulletproof against internal contradiction, forcing students to attack your premises rather than your consistency. That is a much better place to start a seminar.
