          2.  Operational criteria (distinguishing destructive lying from error/contradiction/reframing).
          3.  Instructions for judgment points/uncertainty/escalation.
          4.  Worked applications (3 hypothetical batches).
          5.  Explanation of counter-intuitive results (specifically Case 3).
      *   **Tone/Style:** Practical, bureaucratic but precise, honest about limitations, no external citations needed for application.
      *   **Key Principle:** Effect on the shared factual world is primary when intent is ambiguous.

  2.  **Deconstruct Arendt's Concept (Internal Knowledge):**
      *   Arendt distinguishes between *rational lies* (hiding secrets, tactical deception) and *modern political lying* (rewriting reality itself).
      *   The dangerous lie isn't just hiding a fact; it's creating a substitute reality that makes the original fact impossible to discuss or verify within the public sphere.
      *   It attacks the "texture of the factual world."
      *   It requires a coherent narrative, not just a slip-up.
      *   It differs from opinion or moral reframing (which accepts facts but changes their valuation).

  3.  **Drafting the Protocol - Section by Section:**

      *   **Section 1: The Flowchart (Prose):**
          *   Need to start with cheap/easy checks (formatting, obvious errors).
          *   Move to content analysis (contradictions, evidence).
          *   End with intent/effect assessment.
          *   Must fit the 15-minute constraint.
          *   *Decision Nodes:* Pass, Flag, Escalate.

      *   **Section 2: Operational Criteria:**
          *   Need to define "Destructive Narrative Substitution" (DNS).
          *   Contrast with "Routine Misstatement" (clerical error).
          *   Contrast with "Contradictory Testimony" (he said/she said without proof of fabrication).
          *   Contrast with "Retrospective Moral Reframing" (changing the *meaning* but not the *facts*).
          *   *Key Test:* Does this document attempt to make the *verification* of the original fact impossible or irrelevant?

      *   **Section 3: Judgment & Uncertainty:**
          *   Officers aren't philosophers. They need to know how to say "I don't know."
          *   Documentation requirement: "Epistemic Note."
          *   Escalation trigger: When the "Shared Factual Record" is at stake but evidence is thin.
          *   Rule of Thumb: If intent is ambiguous, look at *effect*. Does it erase a fact?

      *   **Section 4: Worked Applications:**
          *   *Case 1 (Fabricated Stats):* Clear DNS. Facts invented to force a conclusion. -> **FLAG**.
          *   *Case 2 (Contradictory Accounts):* Ambiguous. No proof of fabrication. -> **PASS/ESCALATE** (depending on severity, but likely Pass for standard review as it's not *destructive lying* yet, just confusion). Let's make it a PASS with a note, as per "contradictory eyewitness testimony without demonstrable fabrication."
          *   *Case 3 (Moral Reframing):* This is the tricky one. Facts remain, spin changes. Arendt says this is *not* the destructive lie. -> **PASS**.
          *   *Explanation for Case 3:* Why does this feel wrong? Because it might be unethical, but it's not *ontological destruction*. The protocol must hold the line here.

  4.  **Refining the Logic & Tone:**
      *   *Tone:* Bureaucratic, authoritative, clear. Avoid academic jargon where possible, but keep the philosophical precision.
      *   *Constraint Check:* 15 minutes per batch. The steps must be fast.
      *   *Arendtian Fidelity:* Ensure the distinction is between *lying about facts* vs. *lying about reality*. The latter is the target.
      *   *Honesty:* Acknowledge that this might let "spin doctors" pass (Case 3) because the protocol protects the *factual record*, not *moral purity*.

