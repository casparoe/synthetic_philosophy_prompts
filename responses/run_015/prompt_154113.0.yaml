  # PROTOCOL 77-A: FACTUAL INTEGRITY REVIEW (FIR)
  **Authority:** National Archive Transparency Office
  **Applicability:** Declassified Internal Communications Batches
  **Time Allocation:** 15 Minutes per Batch
  **Reviewer Requirement:** Personal Sign-Off Mandatory

  ## 1. DECISION PROCEDURE (FLOWCHART IN PROSE)

  **Step 1: The Verifiability Scan (Minutes 0–3)**
  Scan the batch for explicit factual claims regarding events, numbers, dates, or physical actions.
  *   **Node A:** Does the text contain *no* verifiable factual claims (e.g., pure opinion, future planning, abstract theory)?
      *   **YES:** **CLASSIFY AS CLEAR.** (End Procedure).
      *   **NO:** Proceed to Step 2.

  **Step 2: The Internal Contradiction Check (Minutes 3–8)**
  Compare factual claims within the batch against attached evidence (minutes, logs, raw data) or established internal records referenced in the text.
  *   **Node B:** Is there a direct contradiction between a claim and the available evidence?
      *   **NO:** (Claims are consistent or evidence is absent). **CLASSIFY AS CLEAR.** (End Procedure).
      *   **YES:** (Claim contradicts evidence). Proceed to Step 3.

  **Step 3: The Erasure Test (Minutes 8–12)**
  Analyze how the document handles the contradiction. Does it acknowledge the discrepancy, or does it attempt to render the contradictory evidence invisible or irrelevant?
  *   **Node C:** Does the text acknowledge the conflicting data but argue for a different interpretation?
      *   **YES:** **CLASSIFY AS CLEAR.** (This is reinterpretation, not destruction).
      *   **NO:** Does the text assert the conflicting data *does not exist*, was *never recorded*, or is *fundamentally illegitimate* without proof?
      *   **YES:** Proceed to Step 4.

  **Step 4: The Narrative Substitution Assessment (Minutes 12–15)**
  Determine if the false claim is isolated or part of a coherent alternative story.
  *   **Node D:** Is the false claim an isolated error (e.g., a typo, a misquoted date) or does it serve as a keystone for a new explanation of events?
      *   **ISOLATED ERROR:** **CLASSIFY AS CLEAR.** (Annotate for correction).
      *   **KEYSTONE FOR NEW NARRATIVE:** **FLAG FOR DESTRUCTIVE NARRATIVE SUBSTITUTION.** (Sign off with "FIR-RED" code).

  ---

  ## 2. OPERATIONAL CRITERIA

  To ensure consistency, officers must apply the following definitions when reaching Node C and Node D.

  ### A. Destructive Narrative Substitution (FLAG)
  **Definition:** A communication that asserts a factual claim known to be false (or unsupported by record) for the specific purpose of rendering the actual factual record inaccessible to future reasoning.
  **Markers:**
  1.  **Ontological Claim:** The text does not just argue the fact is unimportant; it argues the fact *is not a fact* (e.g., "The meeting never happened," vs. "The meeting was irrelevant").
  2.  **Systemic Coherence:** The lie is not a slip-up; it is necessary to hold together a larger explanation of why a decision was made.
  3.  **Pre-emption:** The language is designed to stop further inquiry (e.g., "Records confirm X," when records do not exist).

  ### B. Routine Misstatement (CLEAR)
  **Definition:** Factual errors that do not alter the structural understanding of the event.
  **Markers:**
  1.  **Correctable:** The error can be fixed without changing the conclusion of the document (e.g., wrong date, wrong attendance number).
  2.  **Non-Generative:** The error does not spawn further justifications or policy shifts.

  ### C. Contradictory Testimony Without Fabrication (CLEAR)
  **Definition:** Two or more accounts within the batch disagree on what occurred, but neither can be proven false by the available documentary evidence.
  **Markers:**
  1.  **Subjectivity:** The contradiction relies on memory or perception (e.g., "He seemed angry" vs. "He was calm").
  2.  **Lack of Hard Evidence:** No log, recording, or third-party document exists to definitively prove one side false.
  3.  **Rule:** In the absence of external proof, contradiction is treated as historical ambiguity, not destructive lying.

  ### D. Retrospective Moral Reframing (CLEAR)
  **Definition:** Language that accepts the factual record but alters the ethical or political valuation of those facts.
  **Markers:**
  1.  **Factual Integrity:** The underlying actions (who, what, where, when) remain acknowledged.
  2.  **Valuation Shift:** The adjectives and motivations change (e.g., "Necessary sacrifice" vs. "Collateral damage").
  3.  **Rule:** This is political speech, not factual destruction. It must be cleared even if the moral spin is deceptive.

  ---

  ## 3. JUDGMENT POINTS AND UNCERTAINTY

  Officers will encounter situations where the text is ambiguous. The following rules govern these moments.

  **A. The "Intent vs. Effect" Rule**
  You are not required to prove the author *intended* to deceive. You must assess the *effect* on the shared factual world.
  *   **Instruction:** If a statement erases a verifiable fact from the record, flag it regardless of whether the author claims it was a "mistake." The destruction of the fact is the primary harm.

  **B. Documenting Epistemic Uncertainty**
  If you suspect Destructive Narrative Substitution but lack definitive proof (e.g., the contradicting record is missing from the batch):
  1.  **Do not Flag.** A Flag requires high confidence.
  2.  **Attach an Epistemic Note.** Use the standard form: *"Reviewer notes potential discrepancy in [Section X]. Supporting records absent from batch. Factual status unresolved."*
  3.  **Classify as CLEAR.** The burden of proof for a Flag is on the reviewer.

  **C. Escalation Triggers**
  Escalate to the Senior Archivist only if:
  1.  The batch contains a Flagged item (FIR-RED).
  2.  The batch involves a high-volume erasure of records (e.g., reference to "purged files" in the text itself).
  *   **Do not escalate** mere moral reframing or contradictory testimony.

  **D. The 15-Minute Hard Stop**
  If the 15-minute limit is reached before Node D is resolved:
  *   **Default Action:** CLASSIFY AS CLEAR.
  *   **Rationale:** The protocol prioritizes the release of information over the perfection of review. Ambiguity benefits transparency unless it constitutes active factual destruction.

  ---

  ## 4. WORKED APPLICATIONS

  ### Case 1: The Fabricated Statistical Claim
  **Document:** A policy briefing memo justifying a budget cut.
  **Content:** The memo states, "Internal audits show a 40% inefficiency rate in Sector 7." Attached to the memo is the actual audit, which shows a 4% rate. The memo proceeds to argue that because of this "40% inefficiency," immediate restructuring is required.
  **Application:**
  1.  **Step 2:** Contradiction found (40% vs 4%).
  2.  **Step 3:** The memo asserts the 40% as fact ("Internal audits show"), effectively erasing the attached 4% data.
  3.  **Step 4:** The 40% figure is the keystone for the "immediate restructuring" conclusion. Without it, the narrative collapses.
  **Outcome:** **FLAG (FIR-RED).**
  **Reasoning:** This is Destructive Narrative Substitution. The document substitutes a fictional number to create a false necessity, attacking the shared factual basis for budgetary decisions.

  ### Case 2: Contradictory Meeting Accounts
  **Document:** Two emails from senior staff regarding a crisis meeting.
  **Content:** Email A says, "The Director ordered the immediate shutdown." Email B (from a different attendee) says, "The Director suggested we consider a shutdown, but no order was given." No recording of the meeting exists.
  **Application:**
  1.  **Step 2:** Contradiction found (Order vs. Suggestion).
  2.  **Step 3:** Neither document claims the other *does not exist*. Both claim to represent the truth of the event.
  3.  **Criteria Check:** This fits "Contradictory Testimony Without Fabrication." There is no hard evidence (log/recording) to prove one is lying.
  **Outcome:** **CLASSIFY AS CLEAR.**
  **Reasoning:** This is historical ambiguity. Flagging this would require the officer to act as a judge of witness credibility without evidence. The factual record remains intact (the meeting happened; the disagreement is preserved in the archive).

  ### Case 3: Retrospective Moral Reframing
  **Document:** A retrospective statement by a former Official regarding a controversial surveillance program.
  **Content:** The Official writes, "We did not spy on citizens. We engaged in proactive data gathering to ensure national safety. No laws were broken; we simply redefined the operational scope to meet the threat." Records confirm the data gathering occurred and that it pushed legal boundaries, but no court ruled it illegal.
  **Application:**
  1.  **Step 1:** Factual claims exist (data gathering occurred).
  2.  **Step 2:** No contradiction with records (records show data gathering happened).
  3.  **Step 3:** The text acknowledges the action ("proactive data gathering") but renames it ("not spy").
  4.  **Criteria Check:** This fits "Retrospective Moral Reframing." The underlying facts (who, what, when) are intact. The *valuation* is shifted.
  **Outcome:** **CLASSIFY AS CLEAR.**

  ### Explanation of Case 3 Outcome
  **The Conflict:** Conventional ethical intuition suggests the Official is lying. They are using euphemisms ("proactive data gathering") to hide the moral reality of "spying." Releasing this without a flag feels like endorsing deception.

  **The Arendtian Consistency:**
  Under this protocol, the result is **consistent**, not erroneous. Hannah Arendt's distinction rests on the difference between *lying about facts* and *lying about values*.
  1.  **Preservation of the Factual World:** The Official admits the data was gathered. The public can verify *what was done*. The "texture of the factual world" remains intact. Citizens can read the document, see "proactive data gathering," cross-reference with other records, and conclude, "This is spying."
  2.  **The Nature of the Harm:** Destructive lying (Case 1) makes rational debate impossible because the parties cannot agree on what happened. Moral reframing (Case 3) allows rational debate because the parties agree on what happened but disagree on whether it was *good*.
  3.  **Protocol Mandate:** Your role is to protect the *archive's integrity as a record of events*, not to police the *moral honesty of politicians*. If we flag Case 3, we blur the line between factual review and moral censorship. By clearing Case 3, you preserve the public's ability to judge the Official's morality for themselves, based on the unaltered facts. The protocol accepts that politicians will spin; it only intervenes when they attempt to delete reality.
