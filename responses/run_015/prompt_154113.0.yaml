  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Target Audience:** Senior Transparency Officers in a National Archive.
      *   **Task:** Review batches of declassified internal government communications to flag "politically destructive lying" (Arendtian sense).
