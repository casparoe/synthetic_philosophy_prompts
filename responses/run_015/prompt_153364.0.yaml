  Friends, colleagues, neighbors. Look out the windows behind me. The harbor is dark now. The water is doing what water does, obeying physics, indifferent to our three days of talk. But inside this warehouse, something else has been happening. One hundred and eighty of us—half who speak the language of social choice, half who speak the language of street corners and city halls—have been trying to decide how a city survives a changing climate.

  We are tired. You are right to be. Deliberation is labor. But before we return to our hotels and our neighborhoods, we must ask what kind of labor this was. Specifically, we must ask about the math we used to count our voices.

  For the last decade, I have reported on how groups decide. I have seen the Condorcet Jury Theorem treated as a party trick, a way to say mathematics proves democracy works. Tonight, I ask you to treat it differently. Treat it not as a promise kept, but as a warning heeded.

  The classical theorem offers a seductive guarantee: if every voter is more likely than not to be correct, and if every voter judges independently, then the majority verdict converges on the truth as the group grows. It is a beautiful engine. But look at what we did here. We did not run that engine. We deliberately stalled it.

  Our protocol required deliberation, which means your judgments were not independent. You influenced one another. You changed your minds. We also employed facilitator-assessed confidence scores to weight your pairwise rankings. This means competence was not uniform, and voice was not equally counted in the final aggregation. Mathematically, the classical conditions are not just approximated; they are collapsed.

  To the scholars in the room: Do not leave here claiming a pure victory for the theorem. We violated the independence axiom. We introduced correlation. We weighted votes. The mathematical guarantee of convergence is gone. If you write papers claiming this workshop proved Condorcet correct, you will be lying.

  But to the organizers in the room: Do not leave here fearing that an algorithm erased your equality. The theorem is not the only measure of legitimacy. We weighted votes not to silence you, but to capture the nuance that a simple show of hands misses. When a facilitator assigned a confidence score, it was not to rank your worth as a citizen, but to rank the certainty of the insight offered in that moment. Democratic equality is not erased by recognizing that some arguments carry more weight than others.

  So, if we broke the rules of the theorem, why does Condorcet still matter? Why is he the spine of this speech?

  Because the theorem offers normative guidance even when its conditions are impossible. It reminds us that democracy is not just about preference aggregation; it is about truth-seeking. It warns us that if deliberation becomes echo chambers, correlation rises, and the group's ability to find the right answer collapses. It warns us that if weighting becomes hierarchy, competence drops, and the verdict fails.

  We used this protocol not because it was mathematically pure, but because it was civically necessary. We sacrificed independence to improve competence. We sacrificed uniform voting to capture confidence. The theorem stands behind us not as a judge, but as a compass. It tells us what we risked. It reminds us that the goal was not just to vote, but to be right about the climate, about the water, about the future.

  We did not solve the problem of urban adaptation in three days. But we tested a method that respects the complexity of the problem without abandoning the equality of the people. We accepted that real democracy is messy. It is dependent. It is weighted. But it must always strive toward the ideal that a collective, properly tuned, is wiser than the individual.

  Go home rested. Go home skeptical. But know that the math did not override the humanity here. The humanity used the math to speak louder.

  Verdict: Weighted deliberation is ethically defensible only when confidence metrics serve to amplify collective competence rather than encode structural hierarchy.
