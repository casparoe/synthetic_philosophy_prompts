      *   *Meta-Problem (Chalmers):* Why do we *think* we have consciousness? Why do we report it? Illusionists love this because solving the meta-problem *is* solving the problem for them.
      *   *Feature 1 (Administrative Solution):* Illusionists argue that once we explain the cognitive mechanisms behind the reports (the meta-problem), we've explained all there is to explain. The satire needs to show this as bureaucratic box-ticking.
