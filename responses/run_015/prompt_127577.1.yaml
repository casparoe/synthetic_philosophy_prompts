answer: |-
  **OFFICE FOR INTROSPECTIVE ACCURACY (OIA)**
  **Mission:** To align public introspective reports with physicalist ontology.
  **Founding Statute:** Cognitive Misrepresentation Act (Section 44-B).
  **Powers:** Adjudication of Phenomenal Claims; Reclassification of Qualitative Reports; Management of Introspective Drift.

  **INTERNAL ONBOARDING FAQ (V. 9.2)**

  **1. What constitutes a valid Case?**
  A Case is any citizen submission asserting the instantiation of phenomenal properties (e.g., "the redness of the rose," "the hurt of the pain"). Under the Act, these properties are non-existent. The citizen's neural state is real; the reported *feel* is a user-illusion generated by the introspective system. Your job is not to validate the feel, but to process the report of the feel as a misrepresentation event.

  **2. How do we handle citizens who claim we deny reality?**
  Correct them immediately. The Doctrine states no *phenomenal properties* are instantiated, not that no states exist. Pain behaviors and nociceptive processing are real. Citizens claiming the Office says "pain is not real" are committing the Strong Denial Misstatement (SDM). Issue Form SDM-1 and refer to Compliance. We do not deny the machinery; we deny the ghost in it.

  **3. What if the citizen insists the "seeming" itself is real?**
  They will argue that even if the property is illusory, the *illusion itself* has a phenomenal character. This is a Second-Order Report. File under Form 102-B. Note that Second-Order Reports often generate Third-Order Reports (the seeming of the seeming of the seeming). Each level requires a new form and a new causal model.

  **4. When is a Case considered closed?**
  A Case closes when the OIA has fully mapped the causal mechanism producing the report. Once we can trace the pathway from first-order stimulus to introspective output without referencing phenomenal properties, the explanatory work is complete. Do not worry if the citizen remains unsatisfied; if the mechanism is mapped, the file is closed.

  **5. Are there restricted training materials?**
  Yes. Do not use the "Color Scientist" or "Philosophical Zombie" vignettes during induction. Internal audits show these scenarios have unacceptably high conversion rates toward Realism. Use the "Malfunctioning Thermostat" analogy instead. It is dry, accurate, and rarely induces existential dread.

  **6. What is the Induction Requirement for staff?**
  All new caseworkers must file a Form 001 regarding their own current state during onboarding. You must report what it is like to complete the form while affirming nothing it is like exists. 
  *Note from Caseworker 894:* "Completing this section induces a stark awareness of the void. The cognitive friction of denying one's own access is high, creating a texture of futility that I must now classify as non-textured. It is difficult to describe the emptiness without making it sound like something." [Editor's Note: Please revise for ontological compliance.]

  **7. How is the Office funded?**
  Budget Line 77 covers the operational costs of the Explanatory Gap. This funds the administrative space between the physical facts and the citizen reports. Please note: if funding for the Gap lapses, the Office loses the jurisdictional authority to process misrepresentations, and all pending Cases will default to Realist Ontology.

  **8. What are the performance targets?**
  The OIA is measured on processing velocity, not volume reduction. Reports received have risen 15% year-on-year since Doctrine adoption. This indicates successful public engagement with the introspective system. We are proud that our processing rate matches the influx of errors. A growing backlog suggests a healthy, active population generating illusions at expected rates.

  **9. How do I escalate persistent Realists?**
  If a citizen insists their experience is intrinsic and non-representational, escalate to Senior Adjudication. Do not argue metaphysics. Simply ask them to fill out Form 103-C detailing the neural correlates of their insistence. Usually, the paperwork burden resolves the conviction.

  **10. Who do I contact if I experience Introspective Drift?**
  If you begin to suspect that the reports describe something actual, report to HR immediately. This is a known occupational hazard. You will be reassigned to Data Entry until the illusion passes. Remember: we are not solving the Hard Problem. We are filing it.
