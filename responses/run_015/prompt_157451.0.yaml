answer: |-
  Based on the track record you provided, here is the breakdown of your cousin's logic, the prediction for the new experiment, and the stress-test scenario to prove it.

  ### 1. The Rule She Is Actually Running
  Your cousin isn't running on "total headcount." She accepted a town meeting of 30 people but rejected an online survey of potentially thousands. She isn't running on "physical presence" alone, because she rejected the 2016 election outcome (which involved physical voting booths) in favor of the popular vote total.

  Her rule is a combination of **Solemnity** and **Sovereignty**, but **Sovereignty is the tiebreaker.**

  *   **Solemnity (The Effort Test):** She values high-friction participation. You have to show up (Town Meeting), or vote in a formal national structure (Brexit/2020). Clicking a link is "cheap," so it doesn't count.
  *   **Sovereignty (The Veto Test):** This is the dominant rule. For her, "The Will of the People" must be **final**.
      *   **Brexit:** Treated as binding (initially). -> **Will.**
      *   **Town Meeting:** The vote *is* the law. -> **Will.**
      *   **2016 Election:** The Electoral College overrode the popular vote. -> **Not Will.**
      *   **CA Marriage Prop:** The Courts overrode the vote. -> **Not Will (anymore).**

  **The Rule:** *The Will of the People exists only when a serious, high-friction process produces a result that political elites (Courts, Councils, Electors) cannot legally overturn.*

  ### 2. Will She Call the Experiment "The Will"?
  **Prediction: No.**

  Even though the experiment passes her **Solemnity** test (100 people, in a room, with experts, deliberating), it fails her **Sovereignty** test.

  The City Council retaining a **veto** makes this body advisory, not legislative. To your cousin, this is functionally identical to the California Courts striking down the Prop or the Electoral College flipping the vote. If a group of "elites" (the Council) has the legal authority to say "no" to the residents' decision, then the residents' decision was never truly "The Will." It was just a suggestion.

  She might call it a "good process" or "smart policy," but she won't label it *The Will of the People* because it lacks the power to enforce itself.

  ### 3. The Split Scenario (The Stress Test)
  To prove that **Sovereignty (Binding Authority)** trumps **Solemnity (Physical Deliberation)** in her hierarchy, you would present her with this made-up scenario:

  > **Scenario A:** 50,000 citizens vote via a secure, verified mail-in ballot. The result is **legally binding**; the Mayor *must* sign it into law with no veto power.
  >
  > **Scenario B:** 200 citizens are randomly selected, flown to a resort, given a week to deliberate with experts in person, and vote unanimously. However, the City Council retains the right to **veto** their decision.

  **Why this splits the rules:**
  *   **Scenario A** passes Sovereignty (Binding) but fails Solemnity (Remote/Low Deliberation).
  *   **Scenario B** passes Solemnity (In-person/High Deliberation) but fails Sovereignty (Veto power).

  **The Bet:**
  If she says **Scenario A** is "The Will," she cares about the **outcome being final** (Sovereignty).
  If she says **Scenario B** is "The Will," she cares about the **quality of the debate** (Solemnity).

  Given her reaction to the California Courts (where a passed prop ceased to be "the will" once struck down), I would bet heavily on **Scenario A**. She views "The Will" as a force of law, not just a force of argument. If it can be stopped, it wasn't the Will.
