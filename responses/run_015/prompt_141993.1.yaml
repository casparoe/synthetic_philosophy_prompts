      *   **The Goal:** A 10-minute opening address. Must be strictly truthful about the 1923 origin but still honor the tradition. Cannot be a "debunking" lecture (Hobsbawm/Anderson style) that makes it sound like a fraud. Cannot lie and say it's ancient. Needs to bridge the gap between "invented" and "meaningful." Tone should be affectionate, not academic. No namedropping theorists.
      *   **The Constraint:** Add a short note identifying the *one sentence* likely to be challenged afterwards and why.

  2.  **Deconstruct the Core Tension:**
      *   *Truth:* It started in 1923.
      *   *Feeling:* It feels ancient; it *is* ancient to the participants (4 generations).
      *   *Risk:* Telling the truth might hurt the locals' pride or make the Vicar's mother feel lied to.
      *   *Opportunity:* Reframe "invention" not as "fake" but as "an act of love" or "a seed planted." The value isn't in the age, but in the continuity of care.

  3.  **Drafting Strategy - The Speech:**
