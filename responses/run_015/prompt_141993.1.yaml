      *   *The Turn:* Gently introduce the specific history without using the word "fake" or "invented." Use the curate as a character, not a conman. He wanted the village to have something beautiful.
      *   *The Reframe:* Shift the definition of "tradition." It's not about how far back it goes, but how many hands have held it. 1923 is still a long time ago (100 years).
      *   *The Personal Connection:* Mention the grandmother (without necessarily giving away the specific magazine discovery in a way that feels like an expose). Focus on her memory.
      *   *The Incomers/Revival:* Acknowledge the 1990s revival. This shows the tradition is living, not dead.
