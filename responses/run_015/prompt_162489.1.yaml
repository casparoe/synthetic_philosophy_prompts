      *   **Constraints:** One page, max 600 words. Correspondence table is fine/preferred. No bibliography/citations.

  2.  **Deconstruct the Consultant's Analogy (Statistical vs. Deliberative):**
      *   *Statistical Model:* People are data points containing fixed values (opinions). Aggregation reveals the truth of the population's will.
      *   *Deliberative Model:* People are agents who change values through discussion. Aggregation reveals the *considered* judgment, not the raw preference.
      *   *The Break:* Move 3 (oversampling) treats participants as static data points representing a demographic block. But if deliberation transforms views, representing a demographic *interest* might be more important than representing a demographic *count*. However, stratified sortition is standard practice to ensure descriptive representation, which aids substantive representation. The consultant's error is treating the *outcome* as a statistical prediction rather than a legitimized judgment.

  3.  **Drafting the Content - Section by Section:**

      *   **Correspondence Table:** Need to map statistical terms to assembly terms.
          *   Population -> Electorate/Citizenry.
          *   Sampling Frame -> Voter roll/Residency list.
          *   Sample -> Assembly members.
          *   Estimator -> Aggregate vote/Recommendation.
          *   Margin of Error -> Legitimacy deficit/Trust.
          *   Non-response -> Decline to participate.
      *   **Where it Breaks:**
          *   *Static vs. Dynamic:* Surveys measure *existing* preferences; assemblies generate *new* judgments.
          *   *Error:* In surveys, error is mathematical. In assemblies, "error" is deliberative failure (domination, misinformation).
          *   *Oversampling:* In surveys, it weights data back to population proportions. In assemblies, if you oversample renters 2:1 but don't weight the vote, you aren't mirroring the population statistically anymore; you're prioritizing affected interests.
      *   **Verdict on Moves:**
          *   Move 1 (90 is enough): Mostly True. Diminishing returns on deliberation quality after ~100. Referendums measure intensity/ignorance, not considered will.
          *   Move 2 (Deferral): False. Council retains responsibility. Assembly advises; Council decides. The "will of the city" is constructed, not discovered.
          *   Move 3 (Oversampling): Problematic under this analogy. If it's a statistical sample, you must weight back to population. If it's a deliberative body, oversampling is about ensuring voice, not statistical accuracy.
      *   **Better Analogy:** Jury.
