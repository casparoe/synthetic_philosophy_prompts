      *Drafting content:*
      Your consultant's statistical analogy is seductive but category-confused. It treats deliberation as measurement. Here is the mapping he relies on, followed by where it fractures.

      **Correspondences**
      | Statistical Concept | Assembly Equivalent | Function |
      | :--- | :--- | :--- |
      | Population | Electorate/Citizenry | The source of legitimacy |
      | Sampling Frame | Voter/Residency Roll | Selection pool |
      | Sample | 90 Members | The decision-making body |
      | Estimator | Final Recommendation | The aggregate output |
      | Margin of Error | Legitimacy Deficit | Trust gap between body & public |
      | Non-response | Decline to Participate | Selection bias risk |

      **Where the Mapping Breaks**
      The survey model assumes preferences are *fixed* attributes to be measured. The assembly model assumes preferences are *malleable* judgments to be constructed. In a survey, oversampling requires mathematical weighting to restore population proportions. In an assembly, if you oversample renters 2:1 and vote 1-person-1-vote, you are not creating a microcosm; you are creating a stakeholder forum. The "error margin" isn't mathematical; it's deliberative (e.g., domination by loud voices). This break undermines the claim that the assembly *statistically* mirrors the city's will.

      **Verdict on the Moves**
      1.  **90 is plenty:** **Valid, but for wrong reasons.** You don't need 90 for statistical significance; you need it for deliberative diversity. Beyond 100, dialogue fragments. A referendum measures raw intensity, often misinformed. The assembly measures considered judgment. The cost saving is real, but the logic is qualitative, not quantitative.
      2.  **Council deferral:** **Invalid.** Because preferences transform, the assembly's output is not a pre-existing "city will" discovered, but a new judgment constructed. Council cannot outsource political responsibility. They must ratify the recommendation to own the decision. The assembly licenses the decision; it does not make it sovereign.
      3.  **Oversampling Renters:** **Invalid under this analogy.** If this is a statistical sample, you must weight results back to population proportions (e.g., renters are 50% of city, so their vote counts less). If you don't weight, you abandon the statistical claim. However, oversampling is defensible *deliberatively*: it ensures affected interests have voice to prevent elite capture. Just don't call it statistics.

      **Better Analogy: The Jury**
      Ditch the census. Use the **jury**.
      Like an assembly, a jury is small, sortition-selected, and tasked with reaching a verdict through evidence and deliberation.
      *   **What it allows:** It justifies small numbers without claiming statistical mirroring. It emphasizes *process legitimacy* (fair hearing, evidence) over *output accuracy* (matching pre-existing opinions).
      *   **Conclusion:** A jury verdict stands not because it matches what the public thinks today, but because it follows a process the public trusts. Your assembly should aim for a verdict the city can accept, not a snapshot of what the city already believes. This validates Move 1 (small is fine), rejects Move 2 (Council judges the verdict), and reframes Move 3 (oversample for voice, not data).

