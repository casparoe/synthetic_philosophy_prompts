      *   **User's Concern:** Move 3 nags because surveys measure static opinions, assemblies transform opinions. If Move 3 is wrong, are 1 and 2 wrong too?
      *   **My Role:** Political theorist specializing in democratic innovation/sortition.
      *   **Task:**
          1.  Lay out correspondences (Sampling frame, estimator, margin of error, non-response, population).
