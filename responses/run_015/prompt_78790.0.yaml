answer: |-
  Good evening. For those of you I haven't met yet, I'm [Your Name]. I had the privilege of working with [Advisor's Name] during my PhD, which is a polite way of saying I spent several years having my sentences interrupted by requests for definitions.

  Looking around this room, I see three distinct tribes. There are the philosophers, who know [Advisor] as the man who dismantled arguments for a living. There are the rowers, who know him as the man who dismantled ergometers for a living. And there is the family, who know him as the man who occasionally comes home from doing both of those things and actually cooks dinner.

  We are here to celebrate a career defined by a single, unsettling idea. You've probably heard the line. He's used it for thirty years: "There is a show, but there is nobody in the audience."

  Now, I know what some of you are thinking. I know this because I spent two hours today arguing about it with a friend named Dev. The objection is intuitive. If consciousness is an illusion, who is being fooled? If the self is just a model the brain builds, who is looking at the model? It sounds like he's saying we're zombies—empty shells walking around pretending to feel pain or love.

  But if there is one thing [Advisor's Name] has taught us, it is that sloppy definitions are the enemy of truth. And to call us zombies would be sloppy.

  So, for the sake of accuracy—and because he is sitting three feet away and I know he is mentally editing this speech in real time—let me be precise. [Advisor] does not say the experience is fake. He does not say the pain of a cramped leg in the stroke seat isn't real. He does not say the joy of this gathering is a trick.

  His claim is narrower, and stranger. He says the *ownership* of that experience is the construct. The brain processes data, it reacts to stimuli, it builds a simplified dashboard to help the organism navigate the world. That dashboard includes a little icon labeled "Me." We look at the dashboard and think the icon is the driver. He is suggesting the icon is just part of the display. The show is real. The audience is just… part of the scenery.

  Now, for the rowers in the room: this theory is remarkably convenient during a race. When you're at thirty-six strokes per minute, there is no time for a "self" to worry about its legacy. There is only the water, the oar, and the sync. In those moments, [Advisor]'s philosophy isn't a theory; it's just the state of flow. There is only the rowing. Nobody is in the audience watching you row. You just row.

  And for the family, specifically [Wife's Name]: [Advisor] has never claimed his measurements exhaust the sum of human meaning. He measures what can be measured. He leaves the rest to faith, to love, to the things that persist regardless of the mechanism. He knows that even if the "self" is a model, the commitment you two share is the bedrock of his actual life.

  He asked me not to turn tonight into a seminar. He wants one night off from the argument. So I will not ask him if the model is accurate. I will not ask him where the qualia hide.

  I will only say this: Whether the "I" is a monarch or a metaphor, the impact [Advisor] has had on *my* world is undeniable. The gratitude I feel right now is vivid, regardless of who is feeling it. The respect we all hold for him is substantial, even if the "we" is a collective illusion.

  He taught us to think clearly, to speak precisely, and to recognize that even if the audience is empty, the show must be performed with integrity.

  So, please raise your glasses. To the man who showed us the show. To [Advisor's Name].

  \answer{The toast claims his view posits that conscious experience is real but lacks a central subjective owner, distinguishing it from zombiehood which denies experience entirely.}
