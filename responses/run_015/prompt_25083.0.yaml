answer: |-
  This is a sharp approach. Moving from "Is FEP true?" to "What would count as an adequate explanation?" cuts through the theological debates that often stall this literature. It forces the room to agree on the rules of the game before playing it.

  Below is a structured set of desiderata for evaluating Predictive Processing (PP) and the Free Energy Principle (FEP) as theories of *cognition* (bracketing the broader biological/ontological claims). I have categorized them by function, flagged their status (Non-Negotiable vs. Camp-Specific), and provided the rationale. Following the list, I identify the most exclusionary criterion and the potential incompatibility within the list that could drive your seminar discussion.

  ### Part 1: Desiderata for Adequacy

  #### I. Empirical & Mechanistic Constraints

  **1. The Neural Implementation Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must map onto plausible neurophysiology. It cannot remain at the level of computational abstraction (Marr's top level) without a credible story about Marr's implementation level (e.g., how prediction errors are encoded in spike trains, laminar specificities, or neuromodulation).
  *   **Rationale:** A theory of *cognition* that cannot be instantiated by the physical substrate of the brain is a theory of logic, not biology. If PP requires computations that cortical microcircuits physically cannot perform (e.g., exact Bayesian inversion in real-time), it fails.
  *   **Key Literature:** Bastos et al. (laminar predictions); Shipp (dendritic integration).

  **2. The Tractability Constraint (Non-Negotiable)**
  *   **Requirement:** The minimization of variational free energy must be computationally tractable for a finite, resource-limited system. The theory must explain how the brain avoids the "inference explosion" inherent in searching huge hypothesis spaces.
  *   **Rationale:** Optimization is often NP-hard. If the cost of minimizing free energy exceeds the metabolic budget of the organism, the theory describes an impossible ideal rather than an actual mechanism. It must account for *bounded* rationality, not just rationality.
  *   **Key Literature:** Simon (bounded rationality); Gershman (computational rationality).

  **3. The Explanatory Specificity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must generate predictions that distinguish it from competing frameworks (e.g., reinforcement learning, control theory, dynamical systems). It must explain why a specific behavior occurred *via PP* rather than just showing that the behavior *can be modeled* as PP.
  *   **Rationale:** This addresses the "Redescription Risk." If any adaptive behavior can be retroactively described as "free energy minimization," the theory is a mathematical framing device, not an explanation. It risks being a "just-so" story generator.
  *   **Key Literature:** Colombo & Wright (epistemic critique); Jones (tautology arguments).

  #### II. Normative & Functional Constraints

  **4. The Normativity/Value Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must explain how minimizing *surprise* (informational) aligns with minimizing *danger* (biological). It must solve the "Dark Room Problem" (why don't organisms just seek low-sensory-input states to minimize surprise?).
  *   **Rationale:** This is the bridge between "is" (probability distributions) and "ought" (survival goals). If FEP cannot explain why some prediction errors matter more than others (precision weighting based on biological value), it cannot explain goal-directed action.
  *   **Key Literature:** Friston (active inference); Corcoran et al. (homeostatic value).

  **5. The Learning & Development Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must account for how priors are acquired, not just how they are used. It must explain developmental trajectories and plasticity, not just steady-state inference.
  *   **Rationale:** A theory of cognition that assumes a pre-structured hierarchy of priors without explaining their ontogeny is incomplete. It must handle the "bootstrap problem" of how the system learns to predict in the first place.
  *   **Key Literature:** Clark (surfing uncertainty); Smith & Gasser (developmental PP).

  #### III. Philosophical & Scope Constraints

  **6. The Embodiment Compatibility Constraint (Camp-Specific: Embodied/Enactive)**
  *   **Requirement:** The theory must treat the body not merely as another object to be modeled, but as constitutive of the cognitive process. It must explain how morphological computation offloads cognitive load.
  *   **Rationale:** For embodied cognitivists, if PP treats the body as just another input channel (a "brain in a vat" with extra wires), it fails to capture the essence of situated cognition.
  *   **Key Literature:** Gallagher (enactivism); Allen & Friston (embodied inference).

  **7. The Phenomenal Adequacy Constraint (Camp-Specific: Consciousness)**
  *   **Requirement:** The theory must offer an account of subjective experience (qualia), not just functional behavior. It should explain what it *feels like* to minimize prediction error.
  *   **Rationale:** For philosophers of mind (e.g., Seth, Hohwy), a theory of cognition that ignores consciousness is ignoring the primary datum. For others (e.g., Dennett-style functionalists), this is unnecessary baggage.
  *   **Key Literature:** Seth (controlled hallucination); Hohwy (self-evidencing).

  **8. The Universality vs. Domain-Specificity Constraint (Camp-Specific: Generalists)**
  *   **Requirement:** The theory should ideally apply across scales (neural, individual, social) without changing its core mathematical formulation.
  *   **Rationale:** Proponents of FEP as a "principle of life" value this highly. Critics argue this leads to vacuity. Whether this is a desideratum depends on whether you want a Unified Theory or a Cognitive Theory.
  *   **Key Literature:** Friston (Life as we know it); Ramstead et al. (Markov blankets).

  ---

  ### Part 2: The Exclusionary Desideratum

  If you want to filter out the weakest versions of the theory in your seminar, focus on **Desideratum #3: The Explanatory Specificity Constraint.**

  **Why this is the killer:**
  Many defenses of FEP rely on its elegance and universality. However, elegance is not explanation. The most common critique (from Colombo, Wright, and others) is that FEP is *unfalsifiable* because it is flexible enough to model any outcome post-hoc.
  *   **The Test:** Ask the proponents: "What observation would force you to abandon PP?"
  *   **The Exclusion:** Any version of PP that claims "all adaptive behavior is FEP" but cannot specify a case where adaptive behavior would *not* be FEP fails this desideratum. It excludes "FEP as a metaphor" and forces "FEP as a mechanism." If the theory cannot distinguish itself from standard Reinforcement Learning (RL) in terms of empirical predictions (e.g., specific patterns of reaction time or neural adaptation under uncertainty), it is merely RL with extra steps.

  ---

  ### Part 3: The Incompatibility Thesis (The "Result")

  Here is the provocative claim you can bring to class. It suggests that the list of desiderata contains a tension that may be **jointly unsatisfiable** for a single formulation of the theory.

  **The Tension: Universality (D8) vs. Explanatory Specificity (D3)**

  *   **The Argument:**
      1.  To satisfy **Universality (D8)**, the FEP must be abstract enough to apply to cells, brains, and cultures. It must describe a "law of nature" regarding self-organization.
      2.  To satisfy **Explanatory Specificity (D3)**, the theory must be concrete enough to distinguish cognitive mechanisms from non-cognitive physical processes (e.g., why is a thermostat minimizing free energy different from a human doing it?).
      3.  **The Conflict:** As you increase the *scope* of the principle (making it a theory of everything), you necessarily decrease its *specificity* (its ability to explain why cognition looks the way it does rather than just looking like any other self-organizing system).
      4.  **The Result:** You can have a **Universal Principle** (FEP as physics) OR a **Cognitive Theory** (PP as psychology), but arguably not both simultaneously without equivocation. If it explains everything, it explains nothing specific about *mind*.

  **Alternative Tension (for the Embodied Crowd): Tractability (D2) vs. Bayesian Optimality (implied in D1)**
  *   **The Argument:** Exact Bayesian inference is computationally intractable. To satisfy **Tractability**, the brain must use heuristics. But if it uses heuristics, it is not strictly minimizing Free Energy in the mathematical sense; it is approximating it. If the approximation is too rough, the mathematical guarantees of FEP (convergence, stability) no longer hold. Thus, a biologically realistic model (Tractable) may violate the mathematical core of the theory (Optimality).

  ---

  ### Part 4: Seminar Discussion Prompts

  To lead the discussion using this framework, try these questions:

  1.  **On Redescription:** "If we model a thermostat as minimizing free energy, and we model a human brain as minimizing free energy, what explanatory work is the FEP doing? Are we illuminating a shared mechanism, or just applying a shared vocabulary?"
  2.  **On Normativity:** "Does the FEP solve the Dark Room problem by adding 'value' to the math, or does it just hide the value in the definition of the prior? If the latter, isn't the explanation of value circular?"
  3.  **On the Incompatibility:** "Is it possible that Friston's FEP (Physics) and Hohwy's PP (Philosophy of Mind) are actually competing theories disguised as one? Does the success of one require the failure of the other?"
  4.  **On Embodiment:** "If the body is just another layer of the generative model (as Clark suggests), have we really accepted embodiment, or have we just colonized the body with representation?"

  ### Summary for your Opening Statement
  *"Colleagues, before we ask if the Free Energy Principle is true, we must ask what kind of thing it claims to be. Is it a physical law, a computational mechanism, or a descriptive framework? I propose that if it claims to be all three, it risks satisfying none. Specifically, I want to argue that the demand for Universality may be logically at odds with the demand for Explanatory Specificity. If we want FEP to explain cognition specifically, we may have to sacrifice its claim to be a theory of life."*
