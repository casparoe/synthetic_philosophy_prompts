answer: |-
  # Q&A Prep Sheet: Budget Consequentialism with Moral Remainder
  **Seminar:** Department Philosophy Colloquium
  **Audience:** Kantians, Virtue Ethicists, Global Justice (Non-Ideal Theory)
  **Goal:** Defend the *Budget/Remainder* machinery without collapsing into Act Utilitarianism or sounding like Effective Altruism.

  ### Upfront Concessions (Say these early to disarm hostility)
  1.  **Budgets are not silos:** I concede that domains (health, wealth, time) are permeable. A crisis in one can borrow from another, but this incurs a *higher* remainder interest. This prevents the theory from being rigidly bureaucratic.
  2.  **Remainders are not optional:** I concede that a moral remainder is not just "feeling bad." It is a normative claim on your *future* budget. You cannot simply ignore the debt.
  3.  **It does not solve extreme poverty alone:** I concede this is a theory of individual agency structure, not a substitute for structural global justice. It manages the *interface* between the agent and the demand, not the demand itself.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Diachronic Collapse (The "Hope Nobody Asks" Objection)
  **The Objection:** "If I carry a moral remainder from my wealth budget into next month, and another from my time budget, do these stack? If remainders accumulate over a lifetime without decaying, your 'budgets' are just installment plans on the same total-sacrifice demand. You haven't avoided the demandingness objection; you've just amortized it. The separation of persons collapses over time."
  **Your 90-Second Reply:**
  "I grant that if remainders compound indefinitely, the view collapses. But the machinery specifies that remainders attach to *specific future budgets*, not the agent generally. A wealth remainder must be paid from future wealth allocations; it cannot cannibalize your health budget entirely. More importantly, remainders have a 'statute of limitations' based on capacity. If paying the debt destroys your agency's ability to function in that domain, the debt is forgiven or restructured. This isn't amortization of a total debt; it's a recognition that moral obligations must fit the temporal shape of a human life. We are not timeless utility funnels."
  **Weakness Flag:** ⚠️ **High.** If they press on *why* the debt expires, you risk sounding arbitrary. If you say it doesn't expire, you admit the Collapse.

  #### 2. Fragmentation of Practical Identity (Virtue Ethics)
  **The Objection:** "Virtue requires a unified life. By compartmentalizing obligations into 'wealth,' 'time,' and 'health,' you fragment the moral self. A virtuous agent doesn't say, 'I've spent my kindness budget.' This budgeting machinery encourages a bureaucratic relationship to one's own character, undermining the integrity of the good life."
  **Your 90-Second Reply:**
  "The budgets aren't ontological walls; they are protective heuristics for integrity. Virtue ethics worries about the agent becoming a martyr. My view agrees. The 'budget' is simply the recognition that human flourishing requires diverse goods that cannot be endlessly traded off. If I sacrifice all health for wealth, I cease to be an effective moral agent. The budget protects the *conditions* of virtue. The 'remainder' ensures I don't ignore the cost, but the 'budget' ensures I survive to act another day. It preserves the unity of the life by preventing one domain from colonizing the others."
  **Weakness Flag:** ⚠️ **Medium.** Virtue ethicists may still see the "calculation" as antithetical to *phronesis* (practical wisdom).

  #### 3. Moral Debt as Heteronomy (Kantian)
  **The Objection:** "You speak of 'moral remainders' as debts. For a Kantian, duty is categorical, not a ledger. If I fail a duty, I am guilty, not 'in debt.' Framing this as a carry-forward balance treats the moral law like a bank loan. This undermines autonomy by subjecting the will to an external accounting system rather than self-legislation."
  **Your 90-Second Reply:**
  "I use 'debt' metaphorically to capture the *persistence* of obligation without requiring immediate self-destruction. In Kantian terms, think of the remainder as a constraint on your future maxims. If I breach my budget today, I cannot universally maximize my own comfort tomorrow; I must legislate a maxim that includes repayment. This isn't external accounting; it's the rational consistency of a commitment over time. It respects autonomy by allowing me to plan the repayment rather than demanding immediate abnegation which would destroy my rational agency."
  **Weakness Flag:** ⚠️ **Medium-High.** Hardline Kantians reject any consequentialist calculus. If they dig in on "Duty vs. Outcome," you can't win this fully.

  #### 4. Arbitrage and Structural Privilege (Global Justice)
  **The Objection:** "This system favors the privileged. A wealthy agent can set a high 'wealth budget' and claim they are meeting obligations, while a poor agent has no budget to speak of. Worse, agents can game the domains: 'I volunteered time, so I don't need to donate money.' This allows the well-off to buy moral clearance rather than addressing structural injustice."
  **Your 90-Second Reply:**
  "Budgets are not set by the agent; they are set by *capacity relative to need*. The wealthy agent's wealth budget is objectively higher because their marginal utility of money is lower. Regarding arbitrage: domains are not fungible without penalty. You cannot pay a wealth remainder with time at a 1:1 ratio; the exchange rate is punitive to prevent gaming. This theory is designed for non-ideal theory—it acknowledges that agents are situated differently. It prevents the poor from being crushed by demands they cannot meet, while preventing the rich from hiding behind token gestures."
  **Weakness Flag:** ⚠️ **High.** Who sets the budgets? If you say "objective facts," you need a metric. If you say "agent discretion," you allow gaming.

  #### 5. The Arbitrariness of Domains
  **The Objection:** "Why these budgets? Why separate 'time' from 'health'? Why not 'family' vs. 'strangers'? The slicing of the moral landscape seems arbitrary. If the domains are arbitrary, the protection they offer is illusory. You've just moved the line of demandingness, not justified it."
  **Your 90-Second Reply:**
  "The domains aren't arbitrary; they track the fundamental conditions of human agency. Health, time, and material resources are the preconditions for any action whatsoever. If a theory demands you sacrifice the precondition of action (health) for the output of action (aid), it is self-defeating. The domains reflect the phenomenology of living a life. We experience time differently than money. A moral theory that ignores these phenomenological boundaries fails to guide actual human beings."
  **Weakness Flag:** ⚠️ **Low-Medium.** Mostly a conceptual clarification issue.

  #### 6. The Normative Force of the Remainder
  **The Objection:** "What *is* the remainder? Is it an obligation to repay? If so, why isn't that obligation just as demanding as the original one? If it's not an obligation, but just a 'regret,' then you've weakened the moral claim to the point of irrelevance. It's either demanding or it's not."
  **Your 90-Second Reply:**
  "It is an obligation, but it is *temporally sensitive*. The obligation is to repay *within the constraints of a sustainable life*. The force is real—you are not permitted to ignore it—but the timing is flexible. Think of it like a promise. If I break a promise due to emergency, I still owe you restitution, but I don't owe it to the point of ruin. The remainder preserves the binding nature of the duty without the self-annihilating timing of standard consequentialism."
  **Weakness Flag:** ⚠️ **Medium.** Risks sounding like "I'll do it later" which is just procrastination.

  #### 7. The Emergency Override (The "Drowning Child" Variant)
  **The Objection:** "Surely in a catastrophic emergency, the budget vanishes? If a child is drowning, you don't check your 'time budget.' If the budget is overridden by emergency, then the budget is not a moral limit, just a suggestion. So what work is it actually doing?"
  **Your 90-Second Reply:**
  "The budget is a default setting for a life, not an absolute constraint in a crisis. However, unlike standard views, my theory says the *cost* of that emergency action creates a remainder. If I save the child but ruin my health, I now carry a health remainder. I am not required to sacrifice my life, but I do incur a debt to restore my agency. This acknowledges the sacrifice without demanding infinite sacrifice. It respects the heroism without mandating it as the baseline."
  **Weakness Flag:** ⚠️ **Low.** They are tired of drowning child cases, so keep this brief. They likely agree with the intuition but want to know if it breaks the system (see Objection 1).

  ---

  ### Strategic Notes for the Q&A
  *   **Watch the Global Justice Philosophers:** They will attack Objection 4 (Privilege). Do not get bogged down in macro-economics. Pivot back to *individual agency integrity*. "My theory manages the agent's interface with the world, it doesn't solve the world's distribution."
  *   **Watch the Kantians:** They will attack Objection 3 (Heteronomy). Use the word "Autonomy" frequently. Frame the budget as a tool *for* autonomy, not a restriction *on* it.
  *   **Watch the Virtue Ethicists:** They will attack Objection 2 (Fragmentation). Emphasize "Flourishing" and "Sustainability."
  *   **If Objection 1 (Collapse) is asked:** This is the kill shot. Do not bluff. Admit that *some* compounding happens, but insist on the **Capacity Cap**. "A debt that destroys the debtor is morally void." This appeals to everyone's intuition against slavery to the moral law.
