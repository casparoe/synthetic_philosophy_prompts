prompt: |-
  I'm in a philosophy-of-science reading group — six of us, one econ PhD student who builds models for a living, one historian of science, the rest grad students — and we've spent something like eight weeks on the same argument about unrealistic assumptions in scientific models and nobody has moved anybody. The Friedman side (you know the one, from his 1953 essay on positive economics, the bit people nickname the F-twist) says a theory is judged by its predictions, its assumptions aren't in the business of describing anything, and unrealisticness is often a positive virtue because you buy generality and tractability with it; the examples get dragged out every time, the billiard player who plays as if he knew the trigonometric solution, the tree whose leaves end up distributed as if each leaf were maximizing its own sunlight, and the point is supposed to be that as-if reasoning can get the answer right exactly by not tracking the real mechanism. The other side says fine, that works for predicting inside the domain you fit on, but the second you want an explanation, or you want to move the model to a new setting, or you want to use it to design a policy, the falsehoods propagate and you can't tell which of your results are artifacts of the setup. My gut is with the second side, but I've noticed I only ever have intuitions, and the econ student keeps saying we're asking the wrong question, which I find annoying partly because I half believe it.

  So here's the thing I actually want you to get your teeth into, because I think it's where the disagreement is hiding and I've never seen anybody say it. I've started sorting the false assumptions inside models into three kinds. Relaxable ones: false, but you can perturb toward realism and the result survives, like assuming zero transport costs when transport costs are small. Load-bearing ones: the result doesn't degrade when you relax them, it flips or vanishes, so the finding was made by the assumption. And a third kind I have no good name for, substitutive ones, where the false claim isn't standing in for a true claim you could write down if you were cleverer — it's standing in for something genuinely unformulable for us, like treating a whole population of heterogeneous agents as one representative agent, or assuming perfect mixing in an epidemic model: there is no sequence of small relaxations that walks you from the false description to the true one, so the assumption isn't even in the business of being approximately true. My hypothesis is that the decades-long argument is three arguments stacked under one heading: about relaxable assumptions the instrumentalist is straightforwardly right and the critic is making noise; about load-bearing ones the critic is straightforwardly right and the instrumentalist is changing the subject; and about substitutive ones it's a different question entirely that neither side has vocabulary for, something about whether a model is a claim about the world or a tool for acting on it. The historian in our group says my three-way thing is just the old point about de-idealizability dressed up in new words, which I don't think is right but I can't say why.

  Give me a diagnosis, not a verdict and not a survey of positions. Is my three-way split a real distinction or does it collapse under pressure, and if it collapses, where exactly? Is the stalemate mostly verbal — a fight about what counts as the assumptions of a theory in the first place, the axioms, the initial conditions, the bridge principles, the ceteris paribus clause — or is it a clash about what models are for, prediction versus explanation versus intervention, or a hidden empirical question about how common each of my three kinds actually is in practicing scientists' models, or just bedrock disagreement about what understanding amounts to that neither side can argue for? Please actually work my cases rather than gesturing at them: a housing-market model that treats every landlord as an identical price-taker, forecasts average city rents beautifully for ten years, and then gets used by the city council to predict what happens under a rent cap, where the answer turns out to hinge entirely on the heterogeneity the model assumed away; and the perfect-mixing epidemic model that gets the early curve shape right and is used to size hospital capacity even though nobody for a second believes anyone is perfectly mixed. And then, given whatever you think this disagreement is: what would count as progress on it — a distinction like the one I'm fumbling at, some formal result about when relaxing an assumption changes a conclusion, a change of question, an empirical study of modeling practice — or should we expect none, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **Context:** Philosophy-of-science reading group (6 people, mixed backgrounds: econ PhD, historian, grad students).
      *   **Problem:** 8-week stalemate on Friedman's 1953 "F-twist" (instrumentalism vs. realism regarding assumptions).
      *   **User's Position:** Leans towards the critic side (realist/explanatory) but feels they only have intuitions.
      *   **User's Contribution:** A proposed three-way taxonomy of false assumptions:
          1.  *Relaxable:* False but perturbable (e.g., zero transport costs).
          2.  *Load-bearing:* False and critical; relaxing kills the result.
          3.  *Substitutive:* False, standing in for something unformulable/heterogeneous (e.g., representative agent, perfect mixing). No smooth path to truth.
      *   **User's Hypothesis:** The stalemate is actually three different arguments stacked together. Friedman wins on (1), Critic wins on (2), and (3) is a category error for both.
      *   **Historian's Objection:** This is just "de-idealizability" dressed up.
      *   **Task:** Diagnose the situation. Do *not* give a verdict on who is right. Do *not* survey positions. Work the specific cases (housing/rent control, epidemic/perfect mixing). Determine if the taxonomy holds or collapses. Identify the *source* of the stalemate (verbal, functional, empirical, or bedrock). Suggest what progress looks like.

  2.  **Deconstruct the User's Taxonomy:**
      *   *Relaxable:* Standard approximation. Everyone agrees this is fine. Friedman loves this. Critics tolerate this.
      *   *Load-bearing:* This is the "Galilean idealization" vs. "Grease" distinction. If the result depends *essentially* on the falsehood, it's a mathematical artifact. Critics hate this. Friedman might say "if it predicts, who cares?" but this is where the "new setting/policy" critique hits hardest.
      *   *Substitutive:* This is the interesting one. The user calls it "standing in for something genuinely unformulable." The historian says it's just de-idealizability.
      *   *Critique of the Taxonomy:* Is "Substitutive" distinct from "Load-bearing"? A representative agent assumption *can* be load-bearing. If the policy depends on distributional effects, the RE assumption kills the result. So (2) and (3) overlap. Is (3) distinct from (1)? (1) implies a continuous path to truth. (3) implies a discrete jump or a structural placeholder.

  3.  **Work the Cases:**
      *   *Case 1: Housing Market (Representative Landlord).*
          *   Prediction: Average rents (10 years). Works well.
          *   Intervention: Rent Cap. Fails.
          *   Analysis: Why? Because rent caps trigger supply responses that depend on *marginal* landlords, not the *average* one. The heterogeneity was "Substitutive" (too hard to model everyone) but became "Load-bearing" under the specific policy intervention.
          *   Implication: The status of the assumption changes based on the *question asked*. It's not intrinsic to the assumption.
      *   *Case 2: Epidemic (Perfect Mixing).*
          *   Prediction: Early curve shape/hospital capacity. Works well enough.
          *   Mechanism: Nobody believes perfect mixing. It's a "Substitutive" assumption for network structure.
          *   Analysis: Why does it work? Because early exponential growth depends on $R_0$, which aggregates mixing. It fails for targeted interventions (lockdown specific nodes).
          *   Implication: The assumption is a *compression algorithm*. It discards information. Whether that matters depends on whether the discarded information is relevant to the output.

  4.  **Evaluate the Historian's Objection ("De-idealizability"):**
      *   De-idealizability usually asks: "Can we add the missing detail back in and see if the result holds?"
      *   The user's "Substitutive" category claims: "There is no sequence of small relaxations."
      *   *Diagnosis:* The historian is half-right. It *is* about de-idealizability. But the user is onto something specific about *structural* vs. *negligible* idealizations. However, the collapse point is that "Substitutive" assumptions often *become* "Load-bearing" when the query changes. The taxonomy isn't about the *assumption type* per se, but the *assumption-query pairing*.

  5.  **Identify the Source of the Stalemate:**
      *   Is it verbal? Partly. What counts as "the model"? (The equations? The interpretation?)
      *   Is it functional? Yes. Prediction vs. Intervention.
      *   Is it empirical? Yes. How robust are these models actually?
      *   Is it bedrock? Yes. What is science for?
      *   *Core Diagnosis:* The stalemate persists because Friedman's thesis is *scope-conditional*, but his critics treat it as *universal*, and Friedman's defenders treat the scope as *infinite*.
      *   The User's taxonomy tries to fix this by categorizing assumptions. But the real distinction is **Robustness across Contexts**.
      *   The "Substitutive" category is the key. It's not that they are unformulable; it's that they are *sufficient statistics*.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the frustration.
      *   *Taxonomy Diagnosis:*
          *   (1) Relaxable: Trivial. Everyone agrees.
          *   (2) Load-bearing: The danger zone.
          *   (3) Substitutive: This is the crux. Is it distinct?
          *   *Collapse Point:* The taxonomy collapses because the *type* isn't intrinsic to the assumption. It depends on the *target variable*. Representative agent is Relaxable for average price, Load-bearing for distributional policy. So the taxonomy is actually a taxonomy of *model-use pairs*, not assumptions.
      *   *Working the Cases:*
          *   Housing: Show how the RE assumption acts as a sufficient statistic for prediction but fails as a causal map for intervention. The "falsehood" isn't the problem; the *missing variance* is.
          *   Epidemics: Perfect mixing is a topological compression. It works for $R_0$ (global property) but fails for contact tracing (local property).
          *   *Synthesis:* The "Substitutive" assumption is a *lossy compression*. Friedman says "compression is fine if the output matches." Critic says "compression hides failure modes." Both are right depending on whether you trust the compression for the *new* task.
      *   *The Historian's Point:* Address "de-idealizability." The user is right that it feels different. Why? Because de-idealizability implies a path. "Substitutive" implies a placeholder. But functionally, they behave the same: you test them by trying to add complexity.
      *   *Source of Stalemate:* It's not verbal. It's not just bedrock. It's a **category mistake about model ontology**.
          *   Friedman: Models are *prediction engines* (Black boxes).
          *   Critics: Models are *explanatory maps* (Glass boxes).
          *   The conflict arises when a Black Box is used as a Map.
      *   *Path to Progress:*
          *   Stop asking "Are the assumptions true?"
          *   Start asking "Is the assumption *robustly sufficient* for this specific query?"
          *   Suggest "Sensitivity Analysis" and "Structural Estimation" as the practical resolution.
          *   Philosophical progress: Shift from "Instrumentalism vs. Realism" to "Validity Conditions for Extrapolation."

  7.  **Refining the Tone:**
      *   Needs to be rigorous but conversational (reading group context).
      *   Avoid taking sides.
      *   Focus on the *structure* of the disagreement.
      *   Make sure to explicitly answer: "Is the split real or does it collapse?" and "What counts as progress?"

  8.  **Final Polish:** Check against constraints. (No verdict, no survey, work the cases). Ensure the distinction between "intrinsic assumption properties" and "relational assumption-query properties" is clear. (Self-Correction: Make sure I don't just say "it depends." Explain *why* it depends structurally).

      *   *Key Insight to emphasize:* The "Substitutive" assumption isn't unformulable; it's an *aggregation*. The disagreement is about whether the aggregation preserves the causal structure necessary for the specific counterfactual.

  9.  **Final Output Structure:**
      1.  Diagnosis of the Taxonomy (Collapse point).
      2.  Working the Cases (Housing & Epidemics).
      3.  The Real Stalemate (Ontology vs. Usage).
      4.  Path to Progress (Robustness & Extrapolation).

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sharp diagnosis of a classic impasse. You are right to feel that the standard Instrumentalist vs. Realist framing is too blunt, and your three-way taxonomy is a genuine attempt to carve the joint more finely. However, to answer your primary question: **your taxonomy collapses, but not where the historian says it does.**

  The historian claims your split is just "de-idealizability" dressed up. They are partially right, but they miss the nuance you are grasping at. The collapse happens elsewhere: **your categories are not properties of the assumptions themselves, but properties of the relationship between the assumption and the specific question being asked.**

  Here is the diagnosis of why your group is stuck, working through your cases and your taxonomy.

  ### 1. The Taxonomy Collapse: Intrinsic vs. Relational

  You define your three kinds (Relaxable, Load-bearing, Substitutive) as if they are intrinsic features of the assumption. The stalemate persists because the Econ student and the Critics are talking past each other about whether an assumption *is* one of these things.

  *   **Relaxable:** You say transport costs are small. This holds up.
  *   **Load-bearing:** You say the result flips if you relax it. This also holds up.
  *   **Substitutive:** This is where the taxonomy fractures. You describe this as standing in for something "genuinely unformulable." But in your housing example, heterogeneity *is* formulable (you just need a distribution instead of a mean). In the epidemic example, network structure *is* formulable.

  The collapse point is this: **An assumption is never inherently "Substitutive" or "Load-bearing." It is only so relative to a target variable.**

  Take your **Representative Agent (RA)** in the housing model.
  *   **Query A:** Predict average city rent for the next 5 years given current trends.
      *   *Status of RA:* **Relaxable/Substitutive.** The aggregation error cancels out. The RA acts as a sufficient statistic for the mean. Friedman wins here.
  *   **Query B:** Predict the supply response to a rent cap.
      *   *Status of RA:* **Load-bearing.** A rent cap binds differently on high-cost vs. low-cost landlords. The variance matters. By assuming away heterogeneity, you assumed away the mechanism of the policy effect. The Critic wins here.

  The Econ student says you're asking the wrong question because they are looking at Query A (prediction within sample). The Critics are looking at Query B (intervention/out-of-sample). Your taxonomy tries to solve this by classifying the *assumption*, but the instability lies in the *usage*. The "Substitutive" category is just a "Load-bearing" assumption waiting for the right (or wrong) question to reveal itself.

  ### 2. Working the Cases

  Let's press your two cases to see where the friction generates heat.

  **Case 1: The Housing Market (Representative Landlord)**
  *   **The Setup:** Model assumes all landlords are identical price-takers. Predicts average rent perfectly for 10 years.
  *   **The Intervention:** City council imposes a rent cap. Model predicts minor supply contraction. Reality sees massive withdrawal of "mom and pop" landlords while corporate holders stay.
  *   **The Diagnosis:** This is not a failure of "truth." It is a failure of **structural invariance**.
      *   The Friedmanite argues: "The model was valid for the domain it was tested on (unregulated market)."
      *   The Critic argues: "A model for policy must capture the causal levers, not just the correlations."
      *   **The Hidden Mechanism:** The RA assumption worked for 10 years because the *distribution* of landlord types was stable. The rent cap changed the selection pressure on that distribution. The assumption wasn't "false" in a vacuum; it was **contextually brittle**.
      *   **Your Taxonomy's Verdict:** In the first 10 years, you classified this as "Substitutive" (standing in for a complex population). In the policy phase, it revealed itself as "Load-bearing." The disagreement in your group is that the Econ student classifies it based on Phase 1, and the Historian/Critics classify it based on Phase 2. Neither has a vocabulary for the *transition*.

  **Case 2: The Epidemic (Perfect Mixing)**
  *   **The Setup:** SIR model assumes everyone has an equal probability of meeting everyone else.
  *   **The Success:** Predicts the early exponential growth rate ($R_0$) and total hospital bed need accurately.
  *   **The Falsehood:** Nobody believes perfect mixing. Social networks are clustered.
  *   **The Diagnosis:** This is the strongest case for your "Substitutive" category, but it reveals a different philosophical function. Perfect mixing is not a claim about contact; it is a **topological compression**.
      *   It works for hospital capacity because capacity depends on the *integral* of infections (the area under the curve), which is determined by the average transmission rate. The network structure affects the *variance* and the *tail*, but often not the *peak* in the early phase.
      *   It fails for contact tracing. Contact tracing is a *local* intervention on the network topology. A perfect mixing model literally cannot represent contact tracing (if everyone mixes perfectly, isolating one person does nothing to the mean field).
      *   **The Stalemate:** The Friedmanite says, "It got the peak right, so the assumption was virtuous." The Critic says, "It can't evaluate contact tracing, so it's not a model of the epidemic, it's a model of a fluid."
      *   **The Reality:** The assumption is a **filter**. It filters out high-frequency network data to preserve low-frequency aggregate dynamics. The disagreement is about whether the policy requires high-frequency data.

  ### 3. The Source of the Stalemate

  It is not merely verbal, and it is not just bedrock metaphysics. It is a **category mistake about model ontology.**

  *   **The Econ Student (Friedmanite)** treats models as **Input-Output Devices**. The internal wiring (assumptions) is irrelevant provided the Output matches Reality for the intended Input range.
  *   **The Critics (Realists/Mechanists)** treat models as **Causal Maps**. The internal wiring *is* the content. If the wiring is false, the map is lying, even if it points to the right destination by coincidence.

  The stalemate persists because **science uses models as both.**

  When you are doing *normal science* (predicting rents in a stable regime), the Input-Output view is more efficient. When you are doing *policy science* (changing the regime), the Causal Map view is necessary.

  Your group is stuck because you are arguing about the *assumptions* when you should be arguing about the **domain of invariance**.
  *   Friedman's error (according to the critics) is assuming that predictive success implies structural validity.
  *   The Critics' error (according to the econ student) is assuming that structural validity is required for predictive success.

  Both are true in different domains. The "Substitutive" assumption is the bridge. It is a **Sufficient Statistic**. It summarizes complex reality into a parameter.
  *   If the policy changes the relationship between the parameter and the reality (e.g., rent cap changes how landlord heterogeneity affects supply), the sufficient statistic breaks.
  *   The stalemate is an empirical disagreement about **how often sufficient statistics break under policy intervention.**

  ### 4. What Counts as Progress?

  You asked what would count as progress. A distinction like your three-way split is a good start, but it needs to be dynamic, not static. Here is where the group should move:

  **1. Stop asking "Are the assumptions true?" Start asking "Is the abstraction robust?"**
  Progress comes from shifting the debate to **Sensitivity Analysis** and **Structural Stability**.
  *   *Bad Question:* "Is the representative agent assumption true?"
  *   *Good Question:* "Does the policy conclusion hold if we replace the representative agent with a distribution of agents?"
  *   If the Econ student says "No, that's not the model," they are admitting the assumption is Load-bearing.
  *   If they say "Yes, it holds," they have moved the assumption to Relaxable.
  *   **Progress:** Require that any model used for policy demonstrates that its "Substitutive" assumptions are not "Load-bearing" for the specific policy variable.

  **2. Distinguish "Prediction" from "Extrapolation."**
  Friedman's 1953 essay conflates fitting data (interpolation) with changing the rules of the game (extrapolation).
  *   **Progress:** Agree that Friedman is right about *interpolation* (predicting rents in the same regime) and the Critics are right about *extrapolation* (predicting rents under a new law). The "Substitutive" assumption is the danger zone for extrapolation.

  **3. The "As-If" Defense needs a Mechanism.**
  The billiard player example works because we know *why* it works (evolutionary selection/learning). The leaves example works for the same reason.
  *   **Progress:** When an Econ student uses a "Substitutive" assumption (like perfect mixing), ask: **"What is the selection mechanism that makes this falsehood work?"**
      *   In epidemics, it's the Law of Large Numbers.
      *   In markets, it's arbitrage.
      *   If they cannot name the mechanism that stabilizes the falsehood, the assumption is merely *ad hoc*, not *instrumentally virtuous*.

  ### Summary Diagnosis

  Your three-way split is real, but it is not a taxonomy of **assumptions**. It is a taxonomy of **model-query pairs**.

  *   **Relaxable:** The query is insensitive to the detail.
  *   **Load-bearing:** The query is sensitive to the detail.
  *   **Substitutive:** The detail is unknown, so we compress it. This is **Load-bearing risk** masked as **Relaxable convenience**.

  The stalemate is not verbal. It is a clash between **efficiency** (Econ student wants tractable models that work most of the time) and **security** (Critics want models that don't fail catastrophically when pushed).

  **To move the group:** Propose that the "F-twist" is valid *only if* accompanied by a **Robustness Claim**. The modeler must explicitly state: "I am assuming X (false). This assumption is Substitutive for the purpose of Prediction Y, but I acknowledge it becomes Load-bearing for Intervention Z."

  If the Econ student refuses to admit that an assumption *could* be Load-bearing, they are doing theology, not science. If the Critic refuses to admit that a false assumption *can* yield true predictions, they are doing philosophy, not science. The middle ground is **mapping the boundary where the Substitutive becomes Load-bearing.** That is where the work is.
