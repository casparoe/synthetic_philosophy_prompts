answer: |-
  In the Zenith Towers, a contemporary high-density housing complex, a ubiquitous chemical off-gassing from standard insulation permeates every unit. All adult residents exhibit an identical 15% reduction in alveolar gas exchange efficiency, causing noticeable dyspnea upon climbing three flights of stairs—a capacity decrement they value and would pay to reverse. This is not acute poisoning or tissue destruction, but a sustained functional impairment of the lung parenchyma induced by the environment. Because the exposure is universal among residents, the impaired state is statistically normal for this reference class, yet the lungs fail to perform their evolutionary role of optimal oxygenation in the environment they inhabit. Physicians agree that while palliative care is available, the only effective remedy is regulatory enforcement requiring building remediation to remove the particulate source.

  Naturalist: Not a disease; Hybrid: Disease; Institutional: Not a disease.

  Boorse's naturalism identifies disease with statistical subnormality relative to a reference class. Since all residents share the impairment, it is typical for this class, hence health. Wakefield's hybrid account requires evolutionary dysfunction plus harm. The lungs fail their selected effect (oxygenation) and residents suffer dyspnea, so it is a disease. The institutional view ties disease to clinical jurisdiction. Since the effective remedy is building regulation, not patient treatment, it is not a disease.

  The single feature driving these divergent verdicts is the universality of the condition within the chosen reference class. If exposure falls to one-third of the population, the naturalist verdict flips to "disease" because the state becomes statistically subnormal. The hybrid verdict remains "disease" as the dysfunction persists regardless of prevalence. The institutional verdict shifts to "disease" because clinical management becomes the primary recourse for the affected minority. In this low-exposure scenario, all three theories agree, collapsing the substantive dispute into a consensus case of pathology familiar from standard toxicology.

  The naturalist account fares worst here, denying disease status to a universally harmful impairment. Its defender might reply that the reference class was gerrymandered; it should be "all humans," not "Zenith residents." Relative to all humans, the condition is atypical, restoring the "disease" verdict. However, this reply is illegitimate. If reference classes can be expanded or contracted solely to match pre-theoretic intuitions about disease, the statistical criterion loses its objective bite, allowing the theorist to stipulate away counterexamples rather than confront the substantive implication that universal pathologies are not diseases. This renders the account unfalsifiable, shielding it from the very empirical constraints naturalism claims to prize.
