prompt: |-
  I work in pricing and reserving at a mid-size specialty insurer. Two or three times a month I am asked to put a probability on a quantity about which the only honest thing anyone can say is a range: what share of a claims cohort is fraudulent, when the only thing we know is that it sits somewhere between 5% and 40%; how long notification-to-first-payment will run, bounded between 3 and 40 days; whether a loss ratio on a product we have never written will clear a threshold. The number feeds a pricing or reserving decision, it is reviewed by an actuary who did not produce it, and it may end up in front of a regulator. I have no budget for formal expert elicitation, one hour per case, a spreadsheet, and analysts who cannot be assumed to know what a prior is.

  The difficulty is not, I think, absence of data. It is that having no information does not determine a distribution. For a share bounded between 5% and 40%, being indifferent between equal-width subintervals of the share, between equal-width subintervals of the odds, and between equal-width subintervals of the log-odds all look like applications of the principle of indifference, and I don't think they give the same answer to the question I actually care about. A colleague tells me this is Bertrand's chord paradox in a business suit. I want a procedure, not a tutorial.

  Write me a decision procedure my team can run on one of these bounded quantities and defend in writing. It should include at least the following, in the order an analyst would run them.

  A gate, first: when indifference is the wrong instrument altogether rather than a risky one. I have in mind cases where a base rate or historical analogue is available, where the quantity is a count out of a known or knowable denominator, where the stated bounds are themselves soft estimates rather than hard constraints, and where we have already published a number for the same quantity. Say for each whether the procedure stops, downgrades its own output, or proceeds.

  A mechanism step: before any distribution is chosen, the analyst must describe the process that would generate a value, and classify it. My rough sense is that a quantity produced by partitioning a finite stock or accumulating additive increments calls for one scale, one produced by compounding or by a ratio of two accumulating things calls for another, and that for any rate the reciprocal is a duration over which indifference is not preserved, so the procedure has to say which of the pair inherits the symmetric structure and why. Make that classification usable by someone without the theory, and say what the analyst is to do when the mechanism is genuinely unknown.

  Symmetry tests that eliminate candidates rather than restate a preference. I have a suspicion that re-expressing the quantity as its complement refutes the odds parameterization while leaving the share and log-odds parameterizations standing, and therefore that the test narrows the field without closing it; settle that, and add whatever further tests actually discriminate. Note explicitly which re-expressions are related to one another by an affine map, since on those indifference is coherent and no conflict arises at all.

  A step I have been toying with and cannot fully justify, which you should either make precise and place in the sequence with a stated scope, or explain as confused and drop, saying which you did: be indifferent on the scale on which the evidence you expect to gather later combines additively, on the grounds that the eventual sample average or the eventual model will report on that scale, so the prior and the estimator should not be at cross-purposes.

  An output format with three parts: the number, a specification-sensitivity figure giving the spread across the parameterizations that survived, and a rule for when the spread straddles the decision threshold, in which case the correct output is not a number but a statement that the estimate is not decision-grade plus the cheapest information that would collapse the spread. Rank those information-gathering options by cost.

  Then apply the procedure to three cases. First, the fraud share: bounds 5% to 40%, question is whether the probability that the share exceeds 25% is above or below 30%; give the number each surviving parameterization yields to two decimals. Second, the notification-to-first-payment interval: bounds 3 to 40 days, question is the probability of exceeding 14 days; run it twice, describing the generating mechanism in two different but equally plausible ways, and show the mechanism step producing two different answers, then say which description an actuary would be right to demand evidence for. Third, construct a case of your own in which the correct output is a refusal — realistic enough that I would actually bring it to you, with numbers that look reassuring, and not a strawman.

  Finally: a one-line formal gloss per step, in a separate column or footnote, for the reviewer who signs off, since the operational wording will be plain throughout and must not require my analysts to learn any of this vocabulary. Mark every point at which judgment cannot be eliminated and someone has to sign their name. Say what the procedure cannot do. As a calibration check, run it on the classic chord problem and state which of the standard answers it licenses, or whether it licenses none. And tell me which single step does the most work, and what collapses if that step is removed.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Pricing/Reserving professional at a mid-size specialty insurer.
      *   **Problem:** Need to assign probabilities to bounded quantities with *no* data (pure uncertainty/ignorance), subject to regulatory/actuarial review.
      *   **Constraints:** No budget for formal elicitation, 1 hour/case, spreadsheet only, analysts don't know Bayesian priors.
      *   **Core Issue:** Principle of Indifference leads to contradictions (Bertrand's Paradox style) depending on parameterization (share vs. odds vs. log-odds).
      *   **Deliverable:** A specific *decision procedure* (not a tutorial) with specific steps (Gate, Mechanism, Symmetry Tests, Scale/Evidence Step, Output Format).
      *   **Applications:** Apply to 3 cases (Fraud Share, Notification Delay, Refusal Case).
      *   **Meta-Requirements:** One-line formal gloss per step, mark judgment points, state limitations, calibration check (Bertrand's Chords), identify the "most work" step.

  2.  **Analyze the Core Statistical/Philosophical Problem:**

      *   The user is grappling with the *Principle of Indifference* (PoI) and its failure under transformation (invariance).
      *   If $X \in [a, b]$ is unknown, $Uniform(a, b)$ implies non-uniformity for $Y = f(X)$.
      *   The user correctly identifies that "mechanism" matters. A sum of errors suggests Normal (unbounded, but locally additive); a ratio suggests Log-Normal or Beta; a physical partition suggests Uniform.
      *   The "Scale/Evidence Step" hints at *Jeffreys Priors* or *Reference Priors* (indifference on the scale where Fisher Information is constant) or simply matching the likelihood scale. The user suggests: "be indifferent on the scale on which the evidence you expect to gather later combines additively." This aligns with the concept of *conjugacy* or *location families*. If data adds linearly, prior should be uniform on the linear scale. If data multiplies (compounding), prior should be uniform on the log scale.
      *   The "Symmetry Tests" are about *reparameterization invariance*. If $p$ is a probability, $1-p$ is the complement. If we are indifferent on $p$, we are indifferent on $1-p$ (affine). If we are indifferent on $\log(p/(1-p))$, we are indifferent on the negative of that (affine). But if we are indifferent on odds $p/(1-p)$, the complement transformation is $1/odds$, which is non-linear, breaking indifference.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: The Gate.* Need to stop analysts from using PoI when data exists.
          *   Criteria: Base rates exist? Count data? Soft bounds? Previous publication?
          *   Action: Stop (use data), Downgrade (flag uncertainty), Proceed (pure ignorance).
      *   *Step 2: Mechanism.* How is the number made?
          *   Additive/Partition -> Linear Scale (Uniform).
          *   Multiplicative/Compounding/Ratio -> Log Scale (Log-Uniform).
          *   Unknown -> Default to Linear (conservative for reserves?) or Log (conservative for pricing?). Let's suggest Linear for bounded shares, Log for durations/ratios, but require a justification.
      *   *Step 3: Symmetry Tests.*
          *   Test 1: Complement ($x \to Max - x$). Affine? Yes. Preserves Uniform.
          *   Test 2: Reciprocal ($x \to 1/x$). Affine? No. Breaks Uniform.
          *   Test 3: Odds ($x \to x/(1-x)$). Affine? No.
          *   Goal: Eliminate parameterizations that break symmetry inherent in the physical definition.
      *   *Step 4: Evidence Scale (The "Toying" Step).*
          *   This is actually a valid heuristic for Reference Priors. If future data will be an average (CLT), use Linear. If future data will be geometric mean (growth rates), use Log.
          *   Decision: Keep it. It justifies the Mechanism step.
      *   *Step 5: Output.*
          *   Point Estimate (Median of chosen dist).
          *   Sensitivity (Range of medians/probs across surviving parameterizations).
          *   Decision Rule: If Sensitivity crosses threshold -> "Not Decision-Grade" + Info Request.

  4.  **Developing the Three Cases:**

      *   *Case 1: Fraud Share (5% - 40%).*
          *   Mechanism: Partition of a cohort (Additive).
          *   Scale: Linear (Share).
          *   Symmetry: Complement works. Odds fail.
          *   Calc: Uniform(0.05, 0.40). Prob(Share > 0.25)?
          *   Range: 0.05 to 0.40. Width 0.35. Threshold 0.25. Distance from lower: 0.20. Prob = 0.20/0.35 = 0.57.
          *   Check Log-Odds: Transform bounds, Uniform on log-odds, transform back. Compare probs.
      *   *Case 2: Notification Delay (3 - 40 days).*
          *   Mechanism A: Additive delays (processing steps). -> Linear Uniform.
          *   Mechanism B: Multiplicative friction (efficiency rates). -> Log-Uniform.
          *   Comparison: Show different probabilities for > 14 days.
          *   Actuarial Demand: Evidence for Mechanism B (multiplicative) is harder to justify than A (additive steps).
      *   *Case 3: Refusal Case.*
          *   Need a scenario where bounds are soft or mechanism is unknowable.
          *   Idea: "Loss Ratio on a product never written" where the bounds (e.g., 40%-120%) are guesses, not hard limits.
          *   Gate Step should catch this ("Bounds are soft estimates"). Output: Refusal.

  5.  **Refining the "Formal Gloss" and "Judgment Points":**

      *   Need to ensure the analyst knows *where* they are signing off.
      *   The "Mechanism" step is the biggest judgment call.
      *   The "Gate" is a compliance check.
      *   The "Output" is the risk management check.

  6.  **Addressing the Bertrand Chord Calibration:**

      *   Bertrand's Paradox: Probability a random chord > side of equilateral triangle.
      *   Methods: Random endpoints (1/3), Random radius (1/2), Random midpoint (1/4).
      *   How does *this* procedure handle it?
      *   Mechanism: How is the chord *generated*?
      *   If the procedure demands a physical generation mechanism, it resolves the paradox by forcing a choice. If the mechanism is "unknown," the procedure should output "Not Decision-Grade."
      *   Actually, the procedure forces the user to define the *physical process*. If the process is undefined, the Gate/Mechanism step should trigger a refusal or sensitivity flag. I will argue it licenses *none* without a defined mechanism, or licenses the one matching the physical description.

  7.  **Drafting the Content (incorporating constraints):**

      *   *Tone:* Professional, directive, actuarial/technical but accessible.
      *   *Format:* Structured procedure, then applications, then meta-commentary.
      *   *Constraint Check:* "One hour per case", "Spreadsheet", "No priors knowledge". The math must be Excel-friendly (Uniform and Log-Uniform are easy).
      *   *The "Toying" Step:* I will validate it as the "Likelihood Matching Rule." It's the strongest justification for choosing a scale.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is Log-Uniform easy for analysts?
      *   *Fix:* Provide the Excel formula `LOGNORM.DIST` or transformation instructions.
      *   *Critique:* The Fraud Share calculation needs to be precise.
      *   *Fix:* Calculate $P(X > 0.25)$ for Uniform and Logit-Uniform (since Log-Odds was mentioned).
      *   *Critique:* The "Refusal" case needs to look real.
      *   *Fix:* Make the bounds come from a "back-of-envelope" email, not a contract or physical limit.
      *   *Critique:* The "One-line gloss" needs to be distinct.
      *   *Fix:* Use a sidebar or footnote style as requested.

  9.  **Final Review against User Prompt:**

      *   Gate? Yes.
      *   Mechanism? Yes.
      *   Symmetry Tests? Yes.
      *   Evidence Scale Step? Yes (validated).
      *   Output Format (Number, Sensitivity, Rule)? Yes.
      *   Three Cases (Fraud, Delay, Refusal)? Yes.
      *   Formal Gloss? Yes.
      *   Judgment Points marked? Yes.
      *   Limitations? Yes.
      *   Bertrand Calibration? Yes.
      *   "Most Work" Step? Yes.

  10. **Final Polish:** Ensure the distinction between "Share" (Linear) and "Odds" (Non-linear) is clear in the symmetry test. Ensure the "Refusal" case triggers the Gate, not just the Output step. (Actually, the prompt asks for a case where the *output* is a refusal, which might happen at the Gate or the Final Rule. I will make it a Gate failure for maximum robustness).

      *Wait, re-reading the prompt on the Refusal Case:* "construct a case of your own in which the correct output is a refusal... with numbers that look reassuring." This implies it should pass the Gate but fail the Output Sensitivity Rule. If it fails the Gate, it's not a "refusal" based on the procedure's calculation, it's a "stop." I will construct it to pass the Gate (bounds look hard, no data) but fail the Sensitivity Rule (spread is too wide). This demonstrates the value of the Output Step.

      *Re-evaluating the "Toying Step":* The prompt asks me to "either make precise... or explain as confused and drop." I believe it is valid. It corresponds to choosing a prior that is conjugate to the expected likelihood or invariant under the expected sufficient statistic. I will make it precise as the "Likelihood Scale Match."

      *Bertrand's Chord:* The procedure requires a *generating mechanism*. Bertrand's paradox exists *because* the mechanism is unspecified. Therefore, the procedure correctly identifies this as "Mechanism Unknown" -> "Not Decision-Grade." I will state this clearly.

      *Let's write.*
answer: |-
  # Procedure: Bounded Ignorance Estimation (BIE-1)

  **Purpose:** To assign probabilities to bounded quantities where data is absent, ensuring defensibility under regulatory review.
  **Time Budget:** 60 minutes per case.
  **Tools:** Spreadsheet only.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Gate (Eligibility Check)
  **Action:** Answer Yes/No to the following four questions.
  1.  **Base Rate:** Is there a historical average for this specific quantity (or a close proxy) within the last 3 years?
  2.  **Count Structure:** Is the quantity a count $k$ out of a known denominator $n$ (e.g., claim count, not loss ratio)?
  3.  **Hard Bounds:** Are the lower and upper bounds physical or contractual constraints (e.g., 0% to 100%, policy limits) rather than expert guesses?
  4.  **Consistency:** Have we published a point estimate for this exact quantity in a formal filing in the last 18 months?

  **Logic:**
  *   If **Yes** to Q1 or Q2: **STOP.** Do not use this procedure. Use empirical frequency or Binomial/Beta modeling.
  *   If **Yes** to Q4: **DOWNGRADE.** Proceed, but the output must be flagged as "Deviation from Filed Assumption."
  *   If **No** to Q1, Q2, Q4 AND **Yes** to Q3: **PROCEED.**
  *   If **No** to Q3: **STOP.** Bounds are too subjective for indifference methods.

  > **Formal Gloss:** *Excludes cases where likelihood dominates prior or bounds are subjective.*
  > **Judgment Point:** Analyst signs off on Q3 (Hard Bounds).

  ### Step 2: Mechanism Classification
  **Action:** Describe in one sentence how the value is physically or logically generated. Select one class:
  *   **Class A (Partition/Additive):** The value is a sum of parts or a slice of a fixed whole (e.g., fraud share, expense allocation).
  *   **Class B (Ratio/Compounding):** The value is a ratio of two independent accumulations or a result of multiplicative friction (e.g., loss ratios, delay times driven by efficiency rates).
  *   **Class C (Unknown):** The generation process is opaque or mixed.

  **Logic:**
  *   Class A implies **Linear Scale** (Uniform Distribution).
  *   Class B implies **Log Scale** (Log-Uniform Distribution).
  *   Class C requires proceeding to Step 3 with *both* scales.

  > **Formal Gloss:** *Selects the invariant measure based on the generating process.*
  > **Judgment Point:** Actuary must sign off on Class selection.

  ### Step 3: Symmetry & Scale Tests
  **Action:** Apply the following transformations to the quantity $X$.
  1.  **Complement Test:** Let $Y = (Upper + Lower) - X$. Is your uncertainty about $Y$ identical to $X$?
      *   If **Yes**: Linear Scale is valid.
      *   If **No**: Linear Scale is rejected.
  2.  **Reciprocal Test:** Let $Z = 1/X$. Is your uncertainty about $Z$ identical to $X$ (adjusted for scale)?
      *   If **Yes**: Log Scale is valid.
      *   If **No**: Log Scale is rejected.
  3.  **Likelihood Match (The "Toying" Step):** On what scale will future data arrive?
      *   If future data will be averaged (arithmetic mean): Prefer **Linear**.
      *   If future data will be geometrically averaged (growth rates): Prefer **Log**.
      *   *Instruction:* If Mechanism was Class C, use this test to select the primary scale. If this test conflicts with Mechanism, retain both for sensitivity.

  > **Formal Gloss:** *Eliminates parameterizations violating reparameterization invariance or likelihood conjugacy.*
  > **Judgment Point:** Analyst signs off on Likelihood Match assumption.

  ### Step 4: Output & Decision Rule
  **Action:** Calculate the probability of the event of interest (e.g., $P(X > Threshold)$) using the surviving scale(s).
  1.  **The Number:** Report the median probability from the preferred scale.
  2.  **Sensitivity Figure:** Report the absolute difference $|P_{linear} - P_{log}|$.
  3.  **Decision Rule:**
      *   If Sensitivity < 5 percentage points: **Use the Number.**
      *   If Sensitivity $\ge$ 5 percentage points OR the Sensitivity range straddles the decision threshold (e.g., one scale says 40%, one says 60% when threshold is 50%): **Output "NOT DECISION-GRADE."**
      *   **Information Request:** List the single cheapest data source that would resolve the Mechanism (Step 2) ambiguity. Rank: 1. Internal historical analogue, 2. Industry benchmark, 3. Expert elicitation.

  > **Formal Gloss:** *Quantifies model risk and triggers information acquisition when prior sensitivity exceeds tolerance.*
  > **Judgment Point:** Reviewing Actuary signs off on the Sensitivity Threshold.

  ---

  ## Part 2: Application to Cases

  ### Case 1: Fraud Share
  *   **Bounds:** 5% to 40% ($0.05, 0.40$).
  *   **Question:** Is $P(\text{Share} > 25\%)$ above or below 30%?
  *   **Gate:** No base rate (new scheme), not a count (estimated share), bounds are hard (audit limits), no prior filing. **PROCEED.**
  *   **Mechanism:** Partition of a cohort (Class A). Claims are either fraudulent or not; share is additive. **Linear Scale.**
  *   **Symmetry:** Complement ($40\% + 5\% - x$) makes sense. Reciprocal does not. Likelihood match: Future data will be a sample proportion (arithmetic). **Linear Confirmed.**
  *   **Calculation:**
      *   Distribution: Uniform($0.05, 0.40$).
      *   $P(X > 0.25) = (0.40 - 0.25) / (0.40 - 0.05) = 0.15 / 0.35 = 0.4286$.
      *   *Sensitivity Check (Log-Odds just in case):* Transform bounds to logit, apply uniform, transform back.
          *   Logit(0.05) = -2.94, Logit(0.40) = -0.41.
          *   Uniform on $[-2.94, -0.41]$. Threshold Logit(0.25) = -1.10.
          *   $P = (-0.41 - (-1.10)) / (-0.41 - (-2.94)) = 0.69 / 2.53 = 0.27$.
      *   Sensitivity: $|0.43 - 0.27| = 0.16$.
  *   **Output:**
      *   **Number:** 43% (Linear preferred by Mechanism).
      *   **Sensitivity:** 16 percentage points.
      *   **Rule:** Sensitivity > 5% and straddles 30% threshold (27% < 30% < 43%).
      *   **Verdict:** **NOT DECISION-GRADE.**
      *   **Info Request:** 1. Internal audit results on similar legacy products (Cost: Low).

  ### Case 2: Notification-to-First-Payment
  *   **Bounds:** 3 to 40 days.
  *   **Question:** $P(\text{Delay} > 14 \text{ days})$.
  *   **Gate:** No history, bounds are SLA limits (Hard). **PROCEED.**
  *   **Mechanism Run 1 (Additive):** Delay is sum of processing steps (mail, review, approval). **Class A -> Linear.**
      *   Uniform(3, 40). $P(X > 14) = (40 - 14) / 37 = 26/37 = 0.70$.
  *   **Mechanism Run 2 (Multiplicative):** Delay is driven by efficiency friction at each stage (compounding delays). **Class B -> Log.**
      *   Log-Uniform(3, 40). $P(X > 14) = (\ln(40) - \ln(14)) / (\ln(40) - \ln(3)) = (3.69 - 2.64) / (3.69 - 1.10) = 1.05 / 2.59 = 0.41$.
  *   **Actuarial Demand:** An actuary is right to demand evidence for **Mechanism Run 2**. Operational processes in insurance are typically additive queues, not compounding friction, unless inflation or interest is involved. Log-uniform implies a high density of very short delays which contradicts the 3-day minimum hard constraint structure.
  *   **Output:**
      *   **Number:** 70% (Linear).
      *   **Sensitivity:** 29 percentage points.
      *   **Verdict:** **NOT DECISION-GRADE** (Sensitivity too high).
      *   **Info Request:** 1. Time-and-motion study of 5 claims (Cost: Medium).

  ### Case 3: The Refusal (Constructed)
  *   **Quantity:** Loss Ratio on a new specialty product.
  *   **Bounds:** 45% to 110%.
  *   **Question:** $P(\text{LR} > 75\%)$.
  *   **Gate:**
      *   Base Rate: No.
      *   Count: No.
      *   **Hard Bounds:** **NO.** 45% is a "hopeful best case," 110% is "regulatory worry limit." They are not physical constraints (LR can be 150%).
      *   **Verdict:** **STOP.**
  *   **Rationale:** The procedure refuses to assign indifference to soft bounds. Assigning Uniform(0.45, 1.10) implies zero probability of a 120% loss ratio, which is false. The numbers look reassuring (tight range), but the Gate catches the subjectivity.
  *   **Output:** **PROCEDURE INELIGIBLE.** Use Scenario Testing instead.

  ---

  ## Part 3: Meta-Commentary & Calibration

  ### Formal Gloss Column (For Reviewer Sign-off)
  | Step | Formal Gloss |
  | :--- | :--- |
  | **1. Gate** | Excludes cases where likelihood dominates prior or bounds are subjective. |
  | **2. Mechanism** | Selects the invariant measure based on the generating process. |
  | **3. Symmetry** | Eliminates parameterizations violating reparameterization invariance. |
  | **4. Output** | Quantifies model risk and triggers information acquisition when prior sensitivity exceeds tolerance. |

  ### Judgment Points (Signatures Required)
  1.  **Step 1 (Q3):** Analyst certifies bounds are hard constraints, not estimates.
  2.  **Step 2:** Reviewing Actuary certifies the Mechanism Class (Additive vs. Compounding).
  3.  **Step 4:** Chief Actuary certifies the Sensitivity Threshold (default 5%).

  ### What This Procedure Cannot Do
  *   It cannot create information where none exists; it only quantifies the risk of guessing.
  *   It cannot resolve "Soft Bound" problems (Step 1 forces a stop).
  *   It is not a substitute for credibility weighting when data *is* present.

  ### Calibration: Bertrand's Chords
  *   **Problem:** Probability a random chord in a circle is longer than the side of an inscribed equilateral triangle.
  *   **Application:**
      *   **Gate:** Bounds are hard (0 to diameter). Proceed.
      *   **Mechanism:** The procedure asks "How is the chord generated?"
          *   If "Random endpoints on circumference" -> Class A (Linear angle) -> $P = 1/3$.
          *   If "Random radius point" -> Class B (Linear distance) -> $P = 1/2$.
          *   If "Random midpoint in area" -> Class C (Area measure) -> $P = 1/4$.
      *   **Result:** The procedure licenses **NONE** of the standard answers as "The Truth." It forces the user to declare the physical generation method. If the method is "Unknown" (Class C), Step 4 triggers a **NOT DECISION-GRADE** output because the Sensitivity (1/3 vs 1/4 vs 1/2) is massive.
      *   **Verdict:** The procedure correctly identifies Bertrand's Paradox as a *mechanism specification error*, not a mathematical puzzle.

  ### The "Most Work" Step
  **Step 2 (Mechanism Classification)** does the most work.
  *   **Why:** It breaks the symmetry of the Principle of Indifference. Without it, Step 3 has no basis to prefer Linear over Log.
  *   **Collapse:** If Step 2 is removed, the analyst defaults to Linear (Uniform) by habit. This reintroduces the Bertrand Paradox risk, where the choice of parameter (days vs. log-days vs. rate) becomes arbitrary, and the Sensitivity Figure in Step 4 will consistently trigger "Not Decision-Grade," paralyzing the team. Step 2 provides the *justification* to ignore the sensitivity in clear cases.

  ### Note on the "Toying Step" (Likelihood Match)
  I have made this precise in Step 3. It is not confused; it is an approximation of **Jeffreys Prior** selection. If future data combines additively (Central Limit Theorem applies to the sum), the location parameter is the mean, and a Uniform prior on the mean is conjugate to the normal likelihood. If data combines multiplicatively (Geometric Brownian Motion), the log-mean is the location parameter. Matching the prior scale to the likelihood scale minimizes the "prior-data conflict" when the first piece of information arrives. It is retained as a tie-breaker for Class C mechanisms.
