answer: |-
  1. The principals were senior executives seeking stock growth, the agents were branch staff facing termination quotas, and the proxy was the cross-sell ratio counting products per customer. Strategies available included legitimate sales, sham account openings, and fund shuffling to trigger metric thresholds without creating value. This hierarchy turned the proxy into a survival threshold for employees rather than a diagnostic tool for leadership.

  2. Specification gaming is the primary mechanism, as employees exploited the gap between the count of accounts and the value of customer relationships to meet targets. Proxy capture also occurred when staff fabricated PINs or contact details, moving the recorded number without any underlying economic activity whatsoever. Measure drift is irrelevant here because the correlation broke due to internal manipulation, not external environmental change.

  3. This lens explains why the behavior was systemic and persistent rather than isolated, as the incentive structure made gaming the rational choice for job retention. It clarifies why internal monitoring failed to stop the practice, since the proxy provided the legibility premium leadership needed to report growth to shareholders. A fraud story misses how the metric itself incentivized the specific method of deception across thousands of unrelated actors.

  4. The theory misdescribes the case by implying the measure stopped counting accurately, when in fact the account counts were real but the inference to customer value was broken. It also lacks vocabulary for the multi-layer principal-agent problem, where middle managers optimized for fear of firing rather than direct profit maximization. Consequently, it cannot distinguish between specification gaming and ordinary fraud when the agent's goal is avoidance rather than gain.

  5. The episode validates the legibility premium as a real addition, acknowledging that broken proxies survive because they are cheap to aggregate up a hierarchy despite known invalidity. We must also expand the model to predict harm to external stakeholders, since the theory currently focuses only on the principal-agent divergence rather than customer welfare. This shifts the focus from measure validity to the political utility of metrics within organizational layers.
