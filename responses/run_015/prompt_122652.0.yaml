  # METAPHYSICS OF LAWS: A DIAGNOSTIC TREE
  **For:** Metaphysics Reading Group  
  **Topic:** Humean vs. Anti-Humean Accounts of Nomic Necessity  
  **Constraint:** Do not start with labels. Start with intuitions about cases.

  ---

  ## THE DECISION TREE

  **NODE 1: THE TWIN MOSAIC (Supervenience)**  
  *Case:* Imagine two universes that match perfectly on every particular, occurrent fact (every particle's position, velocity, color, etc. throughout history).  
  **Q:** Could these two universes differ in their laws of nature?  
  *   **YES** (Laws do *not* supervene on the mosaic) → Go to **Node 6** (Anti-Humean Path).  
  *   **NO** (Laws *must* supervene on the mosaic) → Go to **Node 2** (Humean Path).

  ---

  ### PATH A: THE HUMEAN BRANCH (Supervenience Holds)

  **NODE 2: THE STEERING TEST (Bookkeeping vs. Making)**  
  *Case:* Consider the actual history of events in the mosaic.  
  **Q:** Do the laws *make* the events happen (steer), or do they merely record/summarize that they happened (bookkeep)?  
  *   **STEER** → **⚠ FLAG: EMPTY/INCOHERENT BOX.**  
      *(Diagnostic Note: If laws supervene on the mosaic, they are fixed by the events. They cannot also be what *causes* the events without circularity. This position is theoretically unstable.)*  
  *   **BOOKKEEP** → Go to **Node 3**.

  **NODE 3: THE ANTHROPOCENTRIC INDEX (Objectivity)**  
  *Case:* We select the "Best System" based on simplicity, strength, and fit.  
  **Q:** Is the "best" balance of these virtues a fact about the world itself, or indexed to human cognitive interests (e.g., what *we* find simple)?  
  *   **INDEXED TO US** → Go to **Node 4**.  
  *   **OBJECTIVE FACT** → Go to **Node 5**.

  **NODE 4: THE ONE-PARTICLE WORLD (Complexity)**  
  *Case:* A world containing exactly one particle moving at constant velocity forever.  
  **Q:** Is there a law of nature in this world, or do laws require a complex system to summarize?  
  *   **NO LAW** (Laws are tools for coping with complexity) → **LEAF: DEFLATIONARY / PROJECTIVIST** (e.g., van Fraassen).  
  *   **LAW EXISTS** (Trivial laws are still laws) → **LEAF: MRL HUMEANISM** (Mill-Ramsey-Lewis).  
      *(Note: If you answered "Objective" at Node 3, you land here regardless. This node tests the robustness of your projectivism.)*

  **NODE 5: THE DISTANT EVENT (Globality)**  
  *Case:* A star explodes on the far side of the galaxy, changing the global best-systematization.  
  **Q:** Does this change the laws of nature governing events here on Earth?  
  *   **YES** (Laws are global features of the Best System) → **LEAF: MRL HUMEANISM**.  
  *   **NO** (Laws are local regularities) → **LEAF: DEFLATIONARY / PROJECTIVIST**.

  ---

  ### PATH B: THE ANTI-HUMEAN BRANCH (Supervenience Fails)

  **NODE 6: THE BILLION PARTICLE COINCIDENCE (Enforcement)**  
  *Case:* A billion particles all move in straight lines and then stop, with no underlying enforcement mechanism.  
  **Q:** Is this regularity a law of nature, or just a cosmic coincidence?  
  *   **LAW** (Regularities are sufficient) → *Contradiction with Node 1.* Return to Path A.  
  *   **COINCIDENCE** (Needs enforcement) → Go to **Node 7**.

  **NODE 7: THE MOSAIC CONTENT (Powers vs. Categorical)**  
  *Q:** In the base layer of reality (the "particular facts"), do objects possess inherent powers/dispositions, or are their properties purely categorical (qualitative/inert)?  
  *   **POWERS/DISPOSITIONS** → Go to **Node 8**.  
  *   **CATEGORICAL/INERT** → Go to **Node 9**.

  **NODE 8: THE POWER IDENTITY (Grounding)**  
  *Q:** Are the laws of nature *identical* to (or grounded in) the essences of these powers, or are the laws distinct from the powers?  
  *   **IDENTICAL/GROUNDED** (Laws flow from what properties *are*) → **LEAF: DISPOSITIONAL ESSENTIALISM** (Bird/Ellis).  
  *   **DISTINCT** (Powers exist, but laws govern them) → **LEAF: MAUDLIN PRIMITIVISM**.

  **NODE 9: THE UNIVERSAL RELATION (Structure)**  
  *Q:** Is a law a relation of "Nomic Necessitation" holding between universals (properties), or is it a *sui generis* fundamental fact?  
  *   **RELATION** (N(F,G) connects properties) → **LEAF: ADT VIEW** (Armstrong/Dretske/Tooley).  
  *   **SUI GENERIS** (Laws are just basic postulates) → **LEAF: MAUDLIN PRIMITIVISM**.

  **NODE 10: DIRECTION OF EXPLANATION (Grounding)**  
  *Case:* An electron repels another electron.  
  **Q:** Does the law explain the event, or does the event (plus others) explain the law?  
  *   **EVENT EXPLAINS LAW** → *Contradiction with Path B.* Return to Path A.  
  *   **LAW EXPLAINS EVENT** → **CONFIRMS ANTI-HUMEAN LEAF**.  
      *(Note: This node distinguishes ADT from Maudlin poorly; see "Trouble Spots" below.)*

  ---

  ## SCORING KEY & LEAF MAP

  | Path | Node Answers | Resulting Position |
  | :--- | :--- | :--- |
  | **A** | 1:No, 2:Bookkeep, 3:Objective, 5:Global | **MRL Humeanism** (Lewis) |
  | **A** | 1:No, 2:Bookkeep, 3:Indexed, 4:No Law | **Deflationary / Projectivist** (van Fraassen) |
  | **B** | 1:Yes, 6:Coincidence, 7:Powers, 8:Identical | **Dispositional Essentialism** (Bird/Ellis) |
  | **B** | 1:Yes, 6:Coincidence, 7:Categorical, 9:Relation | **ADT View** (Armstrong/Dretske/Tooley) |
  | **B** | 1:Yes, 6:Coincidence, 7:Either, 8/9:Distinct/Primitive | **Primitivism** (Maudlin) |
  | **X** | 1:No, 2:Steer | **⚠ INCOHERENT** (Supervenience + Governance) |

  ---

  ## ⚠ TROUBLE SPOTS & COLLAPSES

  **1. The "Steering" Collapse (Node 2)**  
  You asked if *Bookkeeping vs. Steering* collapses into *Supervenience*. The tree suggests **yes**. If you answer "Supervenience Holds" (Node 1: No), you logically cannot answer "Steering" (Node 2). If laws are fixed by the mosaic, they lack the ontological independence to *push* the mosaic around. The only occupied box here is **Supervenience + Bookkeeping**.

  **2. The ADT vs. Maudlin Blur (Nodes 9 & 10)**  
  The tree separates **ADT** (Relations between Universals) from **Maudlin** (Primitive Laws). In practice, these are hard to distinguish. Armstrong's "N-relation" is often accused of being a law in disguise. If you think the N-relation is just a name for "primitive lawhood," these two leaves collapse into one.

  **3. The Objectivity Slide (Node 3)**  
  The split between **MRL** and **Projectivism** rests on whether "simplicity" is objective. If you think simplicity is *intersubjective* (stable across humans but not universe-intrinsic), you may slide between these two leaves. The tree treats them as distinct, but the boundary is fuzzy.

  **4. The One-Particle Intuition (Node 4)**  
  Lewisans must accept trivial laws in a one-particle world. If your intuition screams "No law without interaction," you are likely not a canonical MRL Humean, even if you accept supervenience. This node catches "Regularity Theorists" who aren't full Best-Systemers.

  ---

  ## HOW TO USE THIS HANDOUT
  1.  **Read the Cases:** Don't read the position names first. Answer the questions based on the concrete scenarios (One Particle, Twin Mosaic, etc.).
  2.  **Follow the Arrows:** Trace your answers down the tree.
  3.  **Check the Flags:** If you land in the **Empty Box**, reconsider your answer to Node 1 or Node 2. You are holding two incompatible intuitions.
  4.  **Discuss the Collapses:** Use the "Trouble Spots" section to debate whether the distinctions (especially ADT vs. Maudlin) are real or verbal.
