answer: |-
  ### Step 1: Validate and Locate the Problem
  First, take a deep breath. You have not discovered a glitch that Kant scholars missed; you have independently reconstructed one of the most famous and persistent objections to Kantian ethics. Your intuition is spot-on: if the moral verdict depends entirely on how broadly or narrowly you describe your action, then the test itself seems unstable.

  In professional Kantian scholarship, this **does** have an established name. The broad category is called **"The Problem of Relevant Descriptions"** (sometimes discussed under **"The Maxim Formulation Problem"**).

  However, the specific *tactic* you noticed—where an agent adjusts the level of detail to rig the outcome—is often colloquially referred to in ethics seminars as **"Gerrymandering the Maxim."**

  Since you asked for a clear conceptual boundary and a term if one didn't exist, I will use the established terminology but refine it with a specific conceptual label for the *mechanism* you identified, because "Problem of Relevant Descriptions" is a bit dry and doesn't fully capture the "sliding scale" dynamic you're frustrated by. Let's call the specific mechanism **"Maxim Granularity Shifting."**

  ### Step 2: Why the "Slide" Works (The Mechanics)
  To understand why this happens, we have to look at what a "maxim" actually is in Kant's framework. A maxim is a subjective principle of volition. It has the structure: *"I will do Action X in Circumstances C to achieve End E."*

  The Universalizability Test asks: "What if everyone did X in C to achieve E?"

  Here is the sliding scale you noticed:
  1.  **Too General:** "I will break promises when it benefits me."
      *   *Universalized:* Everyone breaks promises when it benefits them.
      *   *Result:* The institution of promising collapses. Contradiction in conception. Action is forbidden.
  2.  **Too Specific:** "I will break this promise on Thursday because I am me, and I have this specific emergency."
      *   *Universalized:* Everyone breaks promises when they are *this specific person* with *this specific emergency*.
      *   *Result:* Since no one else is you, and no one else has this exact emergency, the universal law applies to literally no one else. The practice of promising remains intact. No contradiction. Action is permitted.

  The moral result flips not because the action changed, but because the **reference class** (the group of people/situations the rule applies to) was manipulated.

  ### Step 3: Distinguishing from "Being Sneaky"
  You asked how this is different from just being sneaky about intentions. This is a crucial distinction.

  *   **Being Sneaky (Psychological Deception):** This is lying about *what* your maxim is.
      *   *Example:* You actually want to break the promise for fun, but you tell the Kantian tester, "My maxim is to save a life," to pass the test.
      *   *Diagnosis:* This is empirical dishonesty. It's a failure of the agent, not the theory.
  *   **Maxim Granularity Shifting (Structural Manipulation):** This is telling the truth about your situation but describing the *rule* at a rigged level of abstraction.
      *   *Example:* You honestly say, "My maxim is to break promises when I am [Name] on [Date]."
      *   *Diagnosis:* This is a logical loophole in the testing procedure itself. Even an honest agent faces the question: "At what level of detail should I describe my situation?"

  The "sneakiness" is about *truthfulness*. The "granularity problem" is about *relevance*.

  ### Step 4: Defining the Boundaries (Where does it stop?)
  If there is no standard term for the *boundary*, I will establish one for you now. We need to know when "specificity" is legitimate and when it becomes "Gerrymandering."

  **The Boundary: The Principle of Rational Agency**
  A maxim description stops being legitimate and becomes **Gerrymandering** when the specific details included in the maxim are **not relevant to the rational will.**

  *   **Legitimate Specificity:** "I will break this promise because keeping it would cause immediate death."
      *   *Why:* "Preserving life" is a necessary end for any rational agent. Any rational being would recognize "threat of death" as a relevant condition.
  *   **Illegitimate Specificity (Gerrymandering):** "I will break this promise because it is Tuesday and my name is Steve."
      *   *Why:* "Being named Steve" or "It being Tuesday" has no necessary connection to rational agency or the nature of promising. It is an arbitrary identifier used solely to exclude others from the rule.

  **The Coined Term for the Boundary Violation:**
  Let's call the illegitimate version **"Arbitrary Indexicalization."**
  *   *Indexical:* Refers to "I," "Here," "Now," or specific names/dates.
  *   *Arbitrary:* These details do not change the *rational structure* of the action, only its identity.

  If your maxim relies on **Arbitrary Indexicalization** to avoid contradiction, you are guilty of Maxim Granularity Shifting. If your maxim relies on **Rational Conditions** (conditions that any rational agent would acknowledge as relevant), you are formulating correctly.

  ### Step 5: How Kantians Defend Against This
  You might wonder, "Doesn't this break Kant's system?" Professional Kantians (like Onora O'Neill or Christine Korsgaard) argue that it doesn't, provided we add one constraint: **Maxims must be shareable.**

  Kant isn't just asking "Can I logically imagine this?" He is asking "Can I will this as a law for a kingdom of ends?"
  *   If I formulate a maxim so specific that only I can follow it ("I, Steve, on Tuesday..."), I am not proposing a *law*. I am proposing an *exception*.
  *   A law, by definition, must apply to a class of agents. If the class size is 1, it's not a law; it's a whim.
  *   Therefore, the test itself implicitly demands a **reasonable level of generality**. The maxim must be describable in terms that other rational agents could adopt.

  ### Summary for Your Argument
  When you talk to your friend again, here is the roadmap:

  1.  **Name the Problem:** Tell them this is known as **"The Problem of Relevant Descriptions"** or **"Maxim Formulation Indeterminacy."**
  2.  **Name the Tactic:** Call the specific sliding maneuver **"Maxim Granularity Shifting"** (or "Gerrymandering the Maxim").
  3.  **The Fix:** Argue that the test fails only if we allow **Arbitrary Indexicalization**. A valid maxim must be framed in terms that any rational agent could recognize as relevant (e.g., "emergency," "harm," "conflict"), not terms that identify only the agent (e.g., "my name," "this specific date").
  4.  **The Distinction:** Remind them that this isn't about lying (sneakiness); it's about whether the description of the action captures the *moral features* or just the *historical features*.

  You were right to feel that the "chopping up" of the situation determines the result. The philosophical task is to define the rules for how we are allowed to chop.
