prompt: |-
  Writing a seminar paper on Darwin on morality and religion and I've built an argument that eats itself, and I can't see where to cut.

  (1) Darwin's own worry from the notebooks, roughly: the human mind was developed from the mind of lower animals, so why trust its convictions — would anyone trust the convictions of a monkey's mind?
  (2) Generalize it into a test I made up, call it the swap test: take a faculty shaped by selection, hold the faculty fixed, swap out the content it delivers; if the survival-and-reproduction story explains why the creature has it just as well after the swap, then the content isn't tracking anything and the conviction is debunked.
  (3) Morality fails the test. Swap "care for kin and reciprocators" for "care for the whole band," or take Darwin's own aside that young women reared under hive-bee conditions would count it a sacred duty to kill their brothers — the fitness story survives the swap untouched. (I think his account of conscience — social instinct plus memory plus comparing past and present motives — already gets you here without the test, but not sure.)
  (4) Religion fails the same way: the content of the unseen agents swings wildly across cultures while the cohesion story survives every swap.
  (5) But (2) draws no line at morality and religion. Darwin's own theorizing is delivered by faculties selected for surviving, not for being true.
  (6) And descriptive belief fails the test too — I can't see why a creature couldn't do perfectly well with a bundle of false but action-guiding representations, so long as they steer it right.
  (7) So (2) debunks science and inference, and steps (1) through (6) along with them. Not acceptable.

  I'd much rather keep (3) and (4) than keep (5) and (6) — the paper is supposed to be about how Darwinian genealogy deflates morality and religion specifically. So which step do I drop, why did it look fine when I wrote it down, and what does dropping it do to (3) and (4)? Is there a version of the swap test with teeth in the moral and religious cases and none in the scientific one, or is any such version special pleading? My supervisor mutters something about the only honest options being a pre-established harmony between selection and the moral facts or nothing, and I don't know what she means by that.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Topic:** Darwin on morality and religion (seminar paper).
      *   **Core Argument:** A Darwinian genealogy of morality and religion undermines their truth-tracking status (debunking argument).
      *   **The "Self-Eating" Issue:** The argument used to debunk morality/religion (the "Swap Test") also applies to science/reason/belief formation itself, leading to global skepticism (self-defeat).
      *   **Goal:** Keep the debunking of morality/religion (steps 3 & 4) without debunking science/reason (steps 5 & 6).
      *   **Specific Questions:** Which step to drop? Why did it look fine? What does dropping it do to the moral/religious claims? Is there a non-question-begging version of the test? What does the supervisor mean by "pre-established harmony"?

  2.  **Deconstruct the Argument Steps:**
      *   (1) Darwin's Notebook Worry: Evolutionary origins of mind $\rightarrow$ distrust of convictions (Evolutionary Argument Against Naturalism - EAAN style).
      *   (2) The "Swap Test": If selection explains the *faculty* regardless of the *content*, the content isn't truth-tracking.
      *   (3) Morality fails the test (content is arbitrary relative to fitness).
      *   (4) Religion fails the test (content is arbitrary relative to social cohesion).
      *   (5) Science/Reason fails the test (faculties selected for survival, not truth).
      *   (6) Descriptive belief fails the test (false beliefs can guide action successfully).
      *   (7) Conclusion: Global skepticism (argument destroys itself).

  3.  **Identify the Weak Link:**
      *   The user wants to save (3) and (4) and sacrifice (5) and (6).
      *   Step (2) is the engine. If (2) is too strong, it kills everything. If (2) is too weak, it saves nothing.
      *   Step (6) is the most vulnerable philosophical claim. "False but action-guiding representations" is a classic pragmatist/evolutionary epistemology claim, *but* it's highly contested in philosophy of mind and epistemology.
      *   Step (5) is Darwin's own worry (EAAN), but many philosophers (Plantinga vs. Naturalists) argue against it.
      *   *Crucial Distinction:* The distinction between *adaptive link* accounts (morality/religion) and *truth-tracking* accounts (science/perception).

  4.  **Evaluate the "Swap Test" (Step 2):**
      *   *Problem:* It's too blunt. It assumes that if $X$ is selected for survival, $X$ cannot track truth.
      *   *Counter:* Truth *is* often survival-conducive. Knowing where the lion is helps you survive. Knowing $2+2=4$ helps you build shelters.
      *   *Refinement:* The test needs to distinguish between domains where truth is *necessary* for fitness vs. domains where truth is *incidental* or *orthogonal* to fitness.
      *   *Morality/Religion:* Fitness depends on *believing* the norm/agent exists, not on the norm/agent *actually* existing (in a mind-independent sense).
      *   *Science/Perception:* Fitness depends on the representation *matching* the world (e.g., believing the cliff is there when it is).

  5.  **Address the Supervisor's Comment ("Pre-established Harmony"):**
      *   This refers to the dilemma: Either evolution tracks truth (harmony), or it doesn't (skepticism).
      *   If you say evolution tracks truth in science but not morality, you need a principled reason why. Otherwise, it looks like special pleading (saving science because you like science).
      *   *Solution:* The "Third Factor" or "Common Cause" explanation. Or distinguishing *practical* rationality from *theoretical* rationality.

  6.  **Develop a Strategy for the User:**
      *   **Diagnose the Error:** The "Swap Test" is formulated too broadly. It conflates *etiology* (origin) with *justification* (truth).
      *   **The Fix:** Modify Step (2). Don't say "Selection explains faculty $\rightarrow$ Content is arbitrary." Say "Selection explains faculty *independently of truth-conditions* $\rightarrow$ Content is arbitrary."
      *   **Distinguish Domains:**
          *   *Descriptive/Scientific:* False beliefs usually lead to death (e.g., believing a predator isn't there). Truth has cash value.
          *   *Normative/Religious:* False beliefs can lead to group cohesion (e.g., believing an ancestor spirit is watching). Truth (in a realist sense) has no cash value; *belief* has cash value.
      *   **Drop/Modify Step (6):** This is the easiest cut. Argue that for basic descriptive beliefs, truth *is* the mechanism of survival. For morality, *commitment* is the mechanism.
      *   **Address Step (5):** Acknowledge Darwin's worry but limit it. Evolution selects for *reliability* in specific domains (medium-sized dry goods), not necessarily metaphysical truths.

  7.  **Drafting the Response:**
      *   *Validate:* Acknowledge this is a classic problem (Evolutionary Debunking Arguments - EDAs).
      *   *Identify the Culprit:* Step (2) is the problem. It's an "insensitivity" test that is too strong.
      *   *The "Why it looked fine":* It captures the intuition that evolution cares about fitness, not truth. But it ignores that truth *helps* fitness in descriptive domains.
      *   *The Solution:* Restrict the Swap Test to **Normative/Non-Descriptive** domains.
      *   *Refining the Test:* Instead of "swap content," ask "Does the fitness benefit depend on the *truth* of the content or merely the *psychological hold* of the content?"
          *   Science: Benefit depends on truth (bridge must actually hold).
          *   Morality/Religion: Benefit depends on commitment (believing the taboo exists stops you from breaking it, regardless of metaphysical status).
      *   *Supervisor's Comment:* Explain she's warning against dualism without a difference maker. You need a "difference maker" (truth-aptness).
      *   *Recommendation:* Keep (3) & (4), Drop/Modify (6), Qualify (5).

  8.  **Refining the Philosophical Nuance:**
      *   Mention Sharon Street's "Darwinian Dilemma."
      *   Mention the distinction between *tracking* and *adaptive link*.
      *   Suggest focusing on the *independence* of moral/religious facts vs. physical facts.
      *   Warn against "Special Pleading": The defense of science must rest on the *nature of the domain*, not the *value of the conclusion*.

  9.  **Final Review of the Advice:**
      *   Does it answer the specific questions? Yes (Which step? Why? Effect on 3/4? Supervisor meaning?).
      *   Is it actionable for a seminar paper? Yes, provides a clear pivot.
      *   Tone: Academic, supportive, rigorous.

  **(Self-Correction during drafting):** I initially thought about telling them to drop Step (2) entirely. But they like the "Swap Test." It's a heuristic. Better to *sharpen* the test rather than discard it. The test works for morality because moral facts (if they exist) are causally inert. Physical facts are causally potent. The swap test reveals *causal inertness*. I need to make sure the user sees that distinction.

  Also, the supervisor's "pre-established harmony" comment is a reference to Plantinga's EAAN but also to the need for a realist account of truth-tracking. I need to explain that clearly.

  Okay, let's structure the response:
  1.  Diagnosis: The "Global Skepticism" trap.
  2.  The Culprit: Step (2) and (6).
  3.  The Fix: Distinguishing domains based on causal contact.
  4.  Addressing the Supervisor.
  5.  Revised Argument Structure.
  6.  Warning on Special Pleading.

