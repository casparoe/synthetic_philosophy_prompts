  3.  **Evaluate the Logic (Finding the Crack):**
      *   *Step (1):* This is a standard Weberian definition of bureaucracy. It's a normative baseline, not necessarily an empirical fact.
      *   *Step (2):* Empirically mostly true for strong clientelism.
      *   *Step (3):* **This is the critical slide.** Just because the *expectation* exists doesn't mean the *normative structure* accepts it as legitimate state function. There's a difference between "is" and "ought." Even in clientelist systems, there is often a recognition that resources *should* go to the public good, even if they don't. Also, "serving your clients IS how the state functions" is a strong empirical claim that might be an overgeneralization.
      *   *Step (4):* True, Western systems have influence peddling.
      *   *Step (5):* **This is the other weak point.** It assumes a false equivalence between *institutionalized norms* and *violations of norms*. In the West, the norm is impersonality. In clientelism, the norm is personalism. The *violation* happens when the norm is breached.
      *   *Step (6):* False Dichotomy. There's a spectrum of corruption, not a binary.
      *   *Step (9):* Non-sequitur. A concept can be contested without being useless.

  4.  **Identify the Best Point of Attack:**
      *   The user suspects (3). I agree. Step (3) conflates *descriptive reality* (how things work) with *normative legitimacy* (how things are supposed to work).
