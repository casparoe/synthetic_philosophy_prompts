      *   *Key Insight:* Corruption is about the betrayal of the *public trust*, not just the violation of a bureaucratic rule. Even in a patronage system, the official is entrusted with *public* resources, not just patron resources.
      *   *Revised Strategy:* Attack Step (3) primarily. The claim that "serving your clients IS how the state functions" is the empirical overreach. The state *exists* to provide public goods, even if it fails. The gap between the mandate and the practice is where corruption lives.

