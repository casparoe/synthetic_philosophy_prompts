prompt: |-
  Please argue that pain asymbolia undermines the evaluative-content theory of pain's badness but is fully accommodated by a modified sensory-urgency account, once we distinguish noxious registration—the bare sensory discrimination of tissue threat without motivational integration—from aversive binding, the structural coupling of that signal with a first-person motivational veto. On your view, asymbolic patients retain registration yet lack binding, so the phenomenon shows not that badness is an independent evaluative layer appended to raw sensation, but that badness just is the presence of binding within normal nociceptive architecture. Then answer the collapse objection: explain why binding is not reducible to intensity, spatial location, or mere attentional capture, but instead constitutes a specific mode of first-personal urgency; and identify the precise point in your reasoning that is most vulnerable. Specifically, state which empirical finding about asymbolic patients—say, preserved affective anticipation without sensory discrimination, or intact binding with disrupted registration—or which conceptual distinction between binding and other forms of salience would lead you to abandon the position. Lead with your bottom line in the first sentence, then present the reasoning with no preamble and no restatement of the question.
