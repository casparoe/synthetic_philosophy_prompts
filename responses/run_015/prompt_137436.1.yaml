              *   Closing line on what the case establishes.

  2.  **Deconstruct the Causal Logic:**

      *   Standard Simpson's Paradox (Confounding): $Z$ causes $X$ and $Y$. Stratifying by $Z$ fixes the bias. Aggregate is wrong.
