answer: |-
  # Seminar Handout: Desiderata for a Theory of Moral Testimony
  **Course:** Graduate Seminar in Epistemology  
  **Topic:** The Moral Testimony Problem (MTP)  
  **Prepared By:** [Instructor Name]

  ## Introduction
  The Moral Testimony Problem arises from the intuition that forming moral beliefs solely on the basis of testimony is epistemically or morally defective, even when the testifier is reliable. To evaluate proposed solutions, we must distinguish between *hard constraints* (conditions any epistemology must meet) and *contested intuitions* (normative commitments specific to Optimist or Pessimist camps).

  Below are the six core desiderata any adequate theory must address.

  ---

  ## The Desiderata List

  ### 1. The Epistemic Safety Constraint
  *   **The Consideration:** Knowledge requires safety: if you believe *p*, *p* must be true in nearby possible worlds. In testimony, this requires a mechanism ensuring the testifier's reliability transfers to the hearer without introducing new error risks.
  *   **Case:** *The Moral Philosopher on Abortion.* If you defer to a philosopher who is actually reliable, is your belief safe? Or does the lack of independent verification make you vulnerable in nearby worlds where the philosopher is mistaken or lying?
  *   **Status:** **Genuine Requirement.** (Externalist Epistemology).
  *   **Relevance:** Any theory must explain how moral testimony preserves safety despite the high disagreement in ethics.

  ### 2. The Moral Understanding Constraint
  *   **The Consideration:** Moral agency似乎 requires grasping the *reasons* for a moral truth, not merely the truth itself. Belief without understanding is alienating.
  *   **Case:** *The Uncomprehending Deferer (Hills).* A person who believes slavery is wrong solely because an expert said so, but cannot explain why, seems to lack proper moral worth.
  *   **Status:** **Pessimist Prejudice.** (Contested). Optimists argue understanding is not required for knowledge; Pessimists argue it is required for *moral* worth/action.
  *   **Relevance:** This is the primary driver for the **Ethics as Skill** camp.

  ### 3. The Domain Parity Principle
  *   **The Consideration:** Moral epistemology should not differ radically from non-moral epistemology without a specific justification. If we defer to chemists, why not ethicists?
  *   **Case:** *The Chemist vs. The Ethicist.* If a chemist says "this is arsenic," we believe them. If an ethicist says "this is unjust," why is belief defective?
  *   **Status:** **Optimist Prejudice.** (Contested). Pessimists argue morality is sui generis (unique) regarding agency.
  *   **Relevance:** The foundational intuition for the **Ethics as Expertise** camp.

  ### 4. The Error Accommodation Requirement
  *   **The Consideration:** The theory must explain the prevalence and nature of moral error without collapsing into skepticism.
  *   **Case:** *The Moral Error Problem.* If moral knowledge is like perception (non-inferential), error should be like hallucination (random/individual). But moral error is often systematic (cultural/historical).
  *   **Status:** **Genuine Requirement.** (Metaphysical/Explanatory).
  *   **Relevance:** A major stumbling block for the **Ethics as Perception** camp.

  ### 5. The Moral Progress Requirement
  *   **The Consideration:** The theory must explain how moral knowledge accumulates and improves over time socially.
  *   **Case:** *The Abolition of Slavery.* How did humanity move from "slavery is natural" to "slavery is wrong"? If morality is individual perception or skill, how is this progress transmitted?
  *   **Status:** **Genuine Requirement.** (Social Epistemology).
  *   **Relevance:** The **Ethics as Expertise** camp handles this best; **Ethics as Perception** struggles to explain collective epistemic movement.

  ### 6. The Motivational Internalism Constraint
  *   **The Consideration:** Moral judgment is inherently action-guiding. To judge *x* is wrong is to have a motive to avoid *x*.
  *   **Case:** *The Apathetic Believer.* Someone who sincerely testifies "murder is wrong" but feels no pull against it seems to lack the concept, not just the motivation.
  *   **Status:** **Internalist Prejudice.** (Contested). Externalists deny this link is necessary for knowledge.
  *   **Relevance:** Critical for the **Ethics as Skill** camp, which ties knowledge to *phronesis* (practical wisdom).

  ---

  ## Critical Analysis

  ### The Most Exclusionary Desideratum
  **The Moral Understanding Constraint (Desideratum 2).**
  This is the bottleneck of the debate. If you accept this as a genuine requirement (as Pessimists do), you effectively rule out "blind" moral deference, forcing a theory toward **Ethics as Skill**. If you reject it (as Optimists do), you satisfy **Domain Parity** but face the challenge of explaining the distinctively "alienating" feel of moral deference. It does the most work because it determines whether moral testimony is treated as *information transfer* (Optimist) or *agency substitution* (Pessimist).

  ### The Incompatible Pair
  **Domain Parity (3) and Moral Understanding (2).**
  These two are in significant tension.
  *   To satisfy **Parity**, moral testimony must function like scientific testimony (belief transmission without necessarily grasping underlying proofs).
  *   To satisfy **Understanding**, moral testimony must function differently than scientific testimony (requiring the hearer to reconstruct the reasoning).
  *   *Note:* A theory can satisfy both only by arguing that scientific testimony *also* requires understanding (a high bar for science) or that moral testimony *does not* require understanding (a high bar for moral agency). Most theories sacrifice one.

  ---

  ## Scorecard: The Three Camps

  | Desideratum | **Ethics as Expertise** (Science-like) | **Ethics as Perception** (Intuitionism) | **Ethics as Skill** (Phronesis) |
  | :--- | :--- | :--- | :--- |
  | **1. Epistemic Safety** | **PASS.** Relies on established reliability metrics similar to science. | **FAIL.** High disagreement suggests perceptual faculties are unsafe in nearby worlds. | **PASS.** Safety is secured through training and habituation, not just belief. |
  | **2. Moral Understanding** | **FAIL.** Allows blind deference, violating the "alienation" intuition. | **PASS.** Perception implies direct contact with reasons/truths. | **PASS.** Skill requires knowing *how* and *why*, not just *that*. |
  | **3. Domain Parity** | **PASS.** Treats moral experts like scientific experts. | **FAIL.** Moral perception is sui generis; no non-moral parity. | **FAIL.** Practical skill differs from theoretical knowledge transmission. |
  | **4. Error Accommodation** | **PASS.** Error is ignorance or bad data, correctable by better experts. | **FAIL.** Struggles to explain systematic/cultural error (why do we all "hallucinate" the same wrong?). | **PASS.** Error is lack of training or corruption of character. |
  | **5. Moral Progress** | **PASS.** Explains progress as accumulation of expert knowledge. | **FAIL.** Hard to explain how "perceptual clarity" improves collectively over centuries. | **PARTIAL.** Explains progress as cultural cultivation of virtue, but slow. |
  | **6. Motivational Internalism** | **FAIL.** Separates belief from motivation (Humean). | **PARTIAL.** Perception often motivates, but not necessarily (akrasia). | **PASS.** Skill is inherently action-oriented; to know the good is to do it. |
  | **TOTAL SCORE** | **3 Pass / 2 Fail / 1 Partial** | **2 Pass / 3 Fail / 1 Partial** | **4 Pass / 2 Fail / 0 Partial** |

  ### Instructor's Note on the Scorecard
  While **Ethics as Skill** scores highest on satisfying intuitions, it pays a heavy theoretical price: it makes moral knowledge extremely difficult to transmit, potentially leading to skepticism about how anyone learns morality in the first place. **Ethics as Expertise** scores lower on intuitions but offers the most robust social epistemology. Your papers should not simply pick the highest score, but argue which desiderata are negotiable.
