answer: |-
  ### Part I: Settled vs. Contested in Value Theory

  Before deploying the taxonomy, it is necessary to distinguish the phenomenological baseline from the metaphysical disputes.

  **Broadly Settled:**
  *   **Phenomenology of Dilemma:** Agents experience hard choices (like Heritage vs. Life) as painful conflicts where reasons pull in opposite directions.
  *   **Action Necessity:** In the root case, inaction is not a viable option; one option must be selected.
  *   **Post-Choice Attitudes:** Agents frequently experience emotions like guilt, grief, or regret after making such choices, regardless of their theoretical commitments.

  **Genuinely Contested:**
  *   **Metaphysics of Value:** Whether the conflict arises from the structure of the world (incommensurable values) or the limitations of the agent (ignorance/imprecision).
  *   **Normativity of Residue:** Whether lingering guilt or obligations after a choice indicate a moral violation occurred, or merely reflect psychological processing.
  *   **Rationality of Regret:** Whether it is rational to affirm a choice while simultaneously judging that the foregone option had a claim that was not "outweighed" in a standard sense.
  *   **Completeness of Reason:** Whether practical reason requires a single ranking of all options (completeness) or can accommodate gaps (incompleteness).

  ***

  ### Part II: The Diagnostic Decision Tree

  **Root Case:** A decision-maker must either **destroy a unique, irreplaceable work of communal cultural heritage** or **allow a preventable human death**. Both losses resist translation into any shared scale of value (e.g., currency, utility units).

  #### Branch 1: The Metaphysics of Comparison
  **Question:** In this specific case, is there a single, determinate fact about which option is objectively more valuable, even if human beings cannot currently calculate or access it?
  *   **(A) Yes:** (Epistemic Limitation)
  *   **(B) No:** (Ontological Incommensurability)

  #### Branch 2: The Status of Aftermath
  **Question:** After the choice is made and the immediate consequences accepted, does the agent retain specific normative obligations (e.g., repair, ritual, apology) or a justified burden of guilt that would not exist if the loss had occurred through no fault of their own?
  *   **(A) Yes:** (Moral Residue)
  *   **(B) No:** (Matter Closed)

  #### Branch 3: The Rationality of Retrospective Judgment
  **Question:** Is it rational for the agent to maintain, indefinitely, that the unchosen option was *genuinely better* (or held a claim not overridden), without retracting the judgment that their actual choice was the one they had to make?
  *   **(A) Appropriate:** (Normatively Warranted)
  *   **(B) Incoherent:** (Logically Excluded)
  *   **(C) Psychologically Understandable:** (Emotionally Real but Rationally Unfounded)

  ***

  ### Part III: Taxonomy of Positions (Leaves)

  #### Path 1: Epistemic Limitation (Fact Exists)

  **1.1. Fact Exists + Matter Closed + Judgment Incoherent**
  *   **Position:** **Strict Consequentialist Monism**
  *   **Awkward Commitment:** You must deny that the destruction of heritage is a distinct moral loss, treating it instead as merely a less efficient means to the single end of preserving life.

  **1.2. Fact Exists + Matter Closed + Judgment Psychological**
  *   **Position:** **Bounded Rationality Pragmatism**
  *   **Awkward Commitment:** You must admit that while a right answer existed, human rationality is defined solely by following the best available procedure, rendering the actual truth of the outcome irrelevant to justification.

  **1.3. Fact Exists + Moral Residue + Judgment Appropriate**
  *   **Position:** **Objective Dilemma Theory**
  *   **Awkward Commitment:** You must accept that an agent can do the objectively right thing and yet still objectively violate a binding moral duty, leaving them culpable despite being correct.

  **1.4. Fact Exists + Moral Residue + Judgment Incoherent**
  *   **Position:** *[UNOCCUPIED / LOGICAL GAP]*
  *   **Diagnosis:** **Practical Unattractiveness.** If a fact exists and you followed it (implied by "Incoherent" to judge otherwise), residue implies you did wrong; this creates a contradiction between "did the right thing" and "owe repair for doing wrong."

  **1.5. Fact Exists + Moral Residue + Judgment Psychological**
  *   **Position:** **Epistemic Humility with Restorative Justice**
  *   **Awkward Commitment:** You must argue that we likely chose wrongly (hence the residue/repair) while simultaneously maintaining we acted on the best evidence, creating tension between justification and restitution.

  #### Path 2: Ontological Incommensurability (No Fact Exists)

  **2.1. No Fact + Matter Closed + Judgment Incoherent**
  *   **Position:** **Existentialist Decisionism**
  *   **Awkward Commitment:** You must claim that the value of the choice is created entirely by the act of willing it, rendering the heritage and the life morally weightless until the moment of decision.

  **2.2. No Fact + Matter Closed + Judgment Psychological**
  *   **Position:** **Voluntarist Instrumentalism**
  *   **Awkward Commitment:** You must treat the lingering sadness over the lost heritage as a private preference failure rather than a public moral loss, isolating the agent from the community's grief.

  **2.3. No Fact + Moral Residue + Judgment Appropriate**
  *   **Position:** **Strong Value Pluralism (Berlin/Williams/Nussbaum)**
  *   **Awkward Commitment:** You must accept that a fully rational agent can emerge from a choice morally "stained" or indebted, with rationality offering no guarantee of moral cleanliness.
      *   *Note on Terminology:* Pluralists often reinterpret "Better" in Branch 3 as "Had an irreducible claim," as "Better" implies comparability which this branch denies.

  **2.4. No Fact + Moral Residue + Judgment Psychological**
  *   **Position:** **Sentimentalist Pluralism**
  *   **Awkward Commitment:** You must concede that while the loss of heritage is objectively tragic, reason dictates the choice was clean, forcing a wedge between what we know (reason) and what we feel (value).

  **2.5. No Fact + Matter Closed + Judgment Appropriate**
  *   **Position:** *[UNOCCUPIED / LOGICAL GAP]*
  *   **Diagnosis:** **Logical Incoherence.** If there is no fact of the matter regarding value (Branch 1), there is no normative ground to make the judgment in Branch 3 "Appropriate"; warrant requires a truth-maker.

  **2.6. No Fact + Moral Residue + Judgment Incoherent**
  *   **Position:** *[UNOCCUPIED / LOGICAL GAP]*
  *   **Diagnosis:** **Conceptual Tension.** If residue exists (lingering obligation/guilt), it implies a normative standard was not met; judging regret as "Incoherent" denies that standard, nullifying the residue.

  ***

  ### Part IV: Diagnostic Notes for the Auditor

  **Using the Tree:**
  Do not ask respondents to identify their label (e.g., "Are you a pluralist?"). Instead, present the Root Case and walk them through the three questions. Their path through the tree will reveal their commitments more accurately than their self-identification.

  **Key Tension Points:**
  1.  **The "Better" Trap:** Respondents who choose **Ontological Incommensurability (1B)** but answer **Appropriate (3A)** to Branch 3 often stumble on the word "better." If they insist "better" is the right word, they may be smuggling in a hidden metric. If they clarify they mean "had a valid claim," they are consistent Pluralists.
  2.  **The Residue Paradox:** Respondents who choose **Epistemic (1A)** but answer **Yes (2A)** to Branch 2 must explain why an agent owes repair for doing the objectively right thing. This is the hardest position to defend without sliding into Pluralism.
  3.  **The Empty Leaves:** If a respondent lands in an unoccupied node (e.g., 2.5), press them on the contradiction. Often, this reveals they hold a nuanced view not captured by the binary (e.g., "Residue exists but is not normative"), requiring you to refine their branch answer.

  **Consensus Warning:**
  There is no consensus on whether **Moral Residue (Branch 2)** requires **Ontological Incommensurability (Branch 1)**. Monists argue residue is merely psychological (Path 1.5 or 2.4), while Pluralists argue it is normative (Path 2.3). Do not treat the link between Residue and Pluralism as definitive; use it as a testing ground for their consistency.
