  - that anything like a proof-licensing architecture will ever describe a system anyone actually builds
  - that a real system in that family would have the kind of exact self-reference the diagonal argument needs, as opposed to an approximate, learned, drifting self-model — I genuinely don't know whether the Löbian argument survives when the agent only has a fuzzy model of itself, and it seems to me like nobody says much about this
  - that there's a resource-bounded analogue that bites at realistic proof budgets. My sense is that the diagonal sentence is short, so any budget big enough to do useful mathematics is big enough to run the Löb construction, but I'm not at all sure
  - that the stepdown tower either bottoms out or compounds into a loss you'd actually feel over a long episode
  - that merely probabilistic self-trust (assigning high credence to your own reasoning without proving it sound) escapes the whole thing at no real cost

