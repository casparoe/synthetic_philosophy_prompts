  1.  Assuming the character shares the audience's epistemic journey (conflating reception with content).
  2.  Treating fictional identity as metaphysical identity rather than narrative coherence (ontological overreach).

  *(Self-Correction on Frege)*: Frege's 'I' is unique to each person. Malcolm's 'I' picks out Malcolm. The problem is the *description* associated with 'I'. He associates 'I' with 'living agent'. The truth is 'dead agent'. This is a failure of descriptive sense, not reference.

  *(Self-Correction on First-Person Authority)*: The gap is that standard theories assume immunity to error through misidentification. Malcolm is immune to misidentification (he knows *he* is the one thinking), but not immune to error through misclassification (he thinks he is alive). This nuances the "immunity" claim.

  *(Self-Correction on Emotional Architecture)*: The film isn't solved by logic. The realization is traumatic. The logic explains the *how*, not the *weight*.

