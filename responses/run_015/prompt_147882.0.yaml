answer: |-
  ### Operational Desiderata for Weak-Reviewer Oversight

  The following requirements define the machinery necessary to prevent obfuscation given a 10-minute reviewer budget and a cost function where false accepts exceed false rejects.

  | Requirement | Concrete Failure Scenario | Why Design Against | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Bounded Verification Debt** | Proposer justifies a change with 20 linked claims. Reviewer checks the first 3, runs out of time, and approves. Flaw was in claim #15. | Obfuscation works by exhausting attention. If debt (unchecked claims) can exceed capacity, safety guarantees vanish. | **Non-Negotiable** |
  | **2. Atomic Verifiability** | Proposer claims "This function is thread-safe." Reviewer accepts based on confident tone. In reality, a lock is missing. | A weak reviewer cannot verify high-level assertions. Claims must be reducible to evidence the reviewer *can* check (e.g., "Lock acquired at line X"). | **Non-Negotiable** |
  | **3. Default Reject on Timeout** | Reviewer reads for 10 minutes, finds no obvious flaw but hasn't finished. System auto-approves to maintain velocity. | False accepts cost money. Uncertainty must default to rejection. Velocity is secondary to safety in this setting. | **Non-Negotiable** |
  | **4. Critic Priority on Debt** | Proposer adds 5 new claims; Critic points out 1 flaw. Reviewer focuses on the new claims because they are fresh. | Reviewers suffer recency bias. The protocol must force resolution of existing debt before allowing new justification layers. | **Non-Negotiable** |
  | **5. Style Normalization** | Proposer uses authoritative tone and formatted code blocks. Critic uses plain text. Reviewer trusts Proposer. | Fluency masks correctness. The interface must strip rhetorical formatting to prevent style from influencing trust. | **Aesthetic / Preference** |
  | **6. Counterfactual Stability** | If a lemma were swapped for a falsehood, the reviewer would notice. | Ensures the reviewer is tracking content, not structure. (See analysis below on operability). | **Prejudice** |

  ### Analysis of Your Definitions

  You asked for precision on your three named terms. Here is their operational status within this workflow.

  **1. Verification Debt (Non-Negotiable)**
  This is the primary metric of risk. In this protocol, debt must be explicit state. The system should track a counter: `unchecked_claims`.
  *   **Constraint:** `unchecked_claims` must never exceed a small integer (e.g., 3) at any moment.
  *   **Mechanism:** The Proposer cannot introduce a new justification layer until the Critic and Reviewer have resolved or accepted the current layer's claims. This prevents the "burying" failure mode.

  **2. The Peel Test (Non-Negotiable)**
  This is the primary interaction mechanism. It is distinct from the Substituted-Lemma test.
  *   **Distinction:** The Peel Test checks *depth* (can I zoom in on this specific claim?). The Substituted-Lemma test checks *dependence* (does this claim actually matter?).
  *   **Operationalization:** The reviewer interface must provide a "Peel" button on every claim. Clicking it hides the parent argument and displays *only* the evidence for that claim. If the evidence is another claim, the debt counter increments. If the evidence is raw data (log, test result, code snippet), the debt counter decrements.
  *   **Why Distinct:** You can pass the Peel Test (every step is verifiable) but fail the Substituted-Lemma test (the steps are verifiable but irrelevant to the conclusion). However, for a weak reviewer, Peel is the only one you can enforce live.

  **3. The Substituted-Lemma Test (Prejudice)**
  This is the prejudice in your list. It is an **evaluation metric**, not a **protocol constraint**.
  *   **Why:** You cannot operationalize this during a live 10-minute review. You cannot ask the reviewer to "imagine this lemma was false" without actually running a second review session with a modified argument, which doubles the cost.
  *   **Usage:** Use this to *test* your system offline. Run simulations where you inject false lemmas into proposer arguments. If your reviewer accepts them, your protocol is broken. But do not build it as a runtime requirement; it is too expensive for the workflow you described.

  ### Tensions and Impossibility Results

  **The Weak Reviewer Bottleneck**
  There is a hard tension between **Atomic Verifiability** and **System Complexity**.
  *   **Tension:** To satisfy Atomic Verifiability, every claim must be reducible to evidence a weak reviewer (10 mins) can check. Some safety-critical properties (e.g., "no race conditions under high load") cannot be verified by a human in 10 minutes without automated tooling.
  *   **Resolution:** The protocol must treat *lack of reducible evidence* as a failure. If the Proposer cannot reduce a claim to a unit test result or a specific log line, the review must Reject.
  *   **Consequence:** You will reject valid changes that are too complex to explain simply. This is acceptable given your cost function (False Accept > False Reject), but it will frustrate engineers. You must accept lower merge velocity as the cost of safety.

  **Joint Satisfiability**
  The list is jointly satisfiable *if* you accept that complex changes may be unreviewable.
  *   If a change requires understanding a distributed consensus bug, a 10-minute human reviewer cannot verify it even with peeling.
  *   The protocol survives this by defaulting to Reject.
  *   **Impossibility:** You cannot guarantee safety against obfuscation *and* maintain high velocity for complex changes with a weak reviewer. One must yield. Given your constraints, velocity must yield.

  ### Most Exclusionary Requirement

  The requirement that excludes the most candidate protocols (including standard "Debate" or "RLHF" setups) is **Bounded Verification Debt**.

  Most debate protocols allow the proposer to generate a long transcript which the judge reads at the end. This allows verification debt to accumulate indefinitely. Enforcing a hard cap on unchecked claims forces the protocol to be iterative and tree-structured rather than linear. It prevents the proposer from overwhelming the reviewer with volume, which is the primary vector for obfuscation.

  \answer{Bounded Verification Debt}
