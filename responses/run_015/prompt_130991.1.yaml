      *   *Analysis of New Cases:*
          *   (a) Officer: Knows the war is unjust. This breaks the "invincible ignorance" shield of Verdict 1. He is closer to Verdict 3 (Leader) but lower rank. Hallam should say he is culpable and liable.
          *   (b) Drone: Remote, no risk, ignorant. Closer to Verdict 2 (Volunteer) but without the risk. Or Verdict 4 (Civilian contributor). If he's ignorant like Verdict 2, he's protected. If he's a causal contributor like Verdict 4, he's targetable. Hallam's focus on "soldier status" in 1 & 2 suggests protection.
      *   *Diverging Rules:*
          1.  *Role-Based Immunity:* Soldiers are immune regardless of knowledge (fits 1, 2, 5).
          2.  *Epistemic Liability:* Soldiers are liable if they know the war is unjust (fits 3, distinguishes 1 & 2).
      *   *Prediction:* Hallam values the "soldier's burden" but draws the line at knowing injustice.
      *   *Test Case:* A conscript who reads the report but believes his government over the commission.

  6.  **Refining for Constraints:**
