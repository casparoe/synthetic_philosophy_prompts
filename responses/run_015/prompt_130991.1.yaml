      *   *Rule A (Strict MEC):* Soldiers are never liable regardless of knowledge. (Fits 1 & 2, but conflicts with 3 & 4 potentially).
      *   *Rule B (Epistemic Condition):* Soldiers are protected unless they *know* the war is unjust. (Fits 1 & 2, distinguishes 3).
      *   *Rule C (Risk/Reciprocity):* Liability depends on being at risk oneself. (Fits 1 & 2, distinguishes b).
      *   *Rule D (Causal Contribution):* Liability depends on direct contribution to harm. (Fits 4).

      *   *The Crux:* Does knowledge of unjustness strip the soldier of protection (breaking MEC)? Or does role protect them regardless?
