      *Wait, checking Verdict 1 again:* "Belmarans have no right to kill him — they are only excused if they do". This is Revisionist language (McMahan) applied to Traditional outcomes. Usually, TJW says soldiers are legitimate targets. Hallam says they are *not* liable, but killing is excused. This is a specific nuance.
