  2.  **Analyze Hallam's Five Verdicts:**
      *   1. Conscript (believes propaganda): Not wrong, not liable, POW. (Standard *Jus in Bello* Equality of Combatants).
      *   2. Volunteer Mercenary (believes propaganda): Same as conscript. (Motivation money/volunteering doesn't change liability status).
      *   3. Leader (knows false): Criminal, liable to killing. (Leaders bear responsibility for *Jus ad Bellum*).
      *   4. Civilian Driver (causal contribution, indifferent): Permissibly bombed (collateral damage? or direct target?). Hallam says "Belmar may bomb the convoy, and permissibly so". This implies he is a legitimate target or his death is permissible collateral damage. Given "even though he is a civilian", this suggests he loses civilian protection due to direct participation or causal contribution.
      *   5. Belmaran Defender (loves killing): Permissible killing, but bad character. (Objective justification matters, not subjective motive).

      *   *Underlying Theory:* This looks like a hybrid view. It accepts the Traditional Just War Theory (TJW) principle of the Moral Equality of Combatants (MEC) for regular soldiers (1 & 2), regardless of *ad bellum* justice. However, it breaks MEC for leaders (3) and potentially civilians who directly support the war effort (4). It separates *jus ad bellum* (justice of war) from *jus in bello* (conduct in war) for soldiers, but not for leaders.
      *   *Tension:* Revisionist Just War Theory (e.g., McMahan) argues soldiers fighting unjustly *are* liable to attack because they threaten unjust harm. Hallam rejects this for soldiers (1 & 2) but accepts it for leaders (3) and perhaps civilians (4). Hallam seems to hold a "Functional Role" view: Soldiers are instruments; Leaders are architects; Civilians are protected unless directly functioning as part of the war machine.

