  8.  **Self-Correction during drafting:** I initially thought about putting Japan as #1. But the *methodological* problem (unfalsifiability) is actually more damaging to the *theory* than a single historical exception. A theory that can explain away everything explains nothing. I'll put Unfalsifiability as the top "Fatal" flaw. Japan is the top *empirical* flaw.

