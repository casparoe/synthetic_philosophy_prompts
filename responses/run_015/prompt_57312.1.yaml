answer: |-
  Here is an analysis of the weight of argument, structured according to the four dimensions of your inquiry.

  ### I. The Internal Account: Probability, Weight, and Evidence

  On Keynes's logicist account, probability is a binary logical relation between a hypothesis and a body of evidence. Weight is a distinct property of that argument, measuring the quantity of relevant evidence upon which the probability is based.

  **(i) Same Probability, Different Weight**
  The canonical illustration involves sampling. Consider two arguments concerning the proposition that the next draw from an urn will be black.
  *   **Argument A:** We have observed one draw, which was black. The evidence is minimal. The probability assigned to the next draw being black is modest (or, under a principle of indifference, 1/2).
  *   **Argument B:** We have observed one thousand draws, 500 of which were black. The frequency evidence suggests the same probability (1/2).
  *   **Distinction:** The probability relation is identical in both cases, but the weight of Argument B is vastly superior. The logical support for the conclusion is the same, but the *substance* of that support differs. Weight captures the difference between a guess based on scant data and a prediction based on a stable frequency, even if the numerical degree of belief warranted is identical.

  **(ii) The Function of Weight in Practical Reasoning**
  If weight does not alter the probability value, why does it matter? Keynes argues that weight governs the *reliance* we place on the probability in action. Probability tells us what to believe; weight tells us how securely we can act on that belief.
  In practical reasoning, a high-probability conclusion based on low-weight evidence warrants hesitation. We might accept the proposition as true, but we should not build significant plans upon it. Weight functions as a stability metric. It explains why we prefer to wait for more information before acting, even if acquiring that information will not change the probability estimate. We wait not to change the odds, but to increase the weight, thereby licensing the transition from theoretical assent to practical commitment.

  **(iii) Non-Comparability and the Theory of Probability**
  Keynes denies that weights are always comparable because evidence is heterogeneous. Adding a new piece of evidence changes the total body of evidence. If the new evidence is relevant, weight increases. However, if two bodies of evidence differ in kind rather than volume (e.g., statistical data vs. expert testimony), there may be no common unit to measure which has "more" weight.
  This implies that probability theory cannot be fully mathematical. If weight is non-comparable, then probabilities based on incommensurable evidence cannot be ranked linearly. This forces Keynes to reject the view that all probabilities are measurable numbers. Some probabilities are non-numerical because the weights of the arguments supporting them cannot be ordered.

  **The Tension: Monotonicity vs. Relevance**
  You identify a tension between weight as the *quantity* of evidence (monotonicity) and weight as the *relevance* or *informativeness* of evidence. If weight is simply the volume of evidence, adding irrelevant data should increase weight. If weight tracks relevance, irrelevant data should not count.
  The defensible reading is that weight is monotonic in the amount of **relevant** evidence. Keynes explicitly defines weight as the "absolute amount of relevant evidence." Irrelevant evidence does not increase weight.
  However, a harder problem arises: can weight decrease? If new evidence undermines the relevance of old evidence (e.g., revealing a source is biased), does weight drop?
  I argue for the **Completeness Reading**. Weight tracks the completeness of the evidence set relative to the hypothesis. New evidence almost always increases weight because it makes the evidence set more complete, even if it shifts the probability drastically or reveals previous evidence was misleading. The only time weight does not increase is when the new information is strictly irrelevant. Therefore, both readings can be held if "quantity" is understood as "quantity of relevant information contributing to the completeness of the picture." Weight is monotonic with respect to the accumulation of relevant information, even if that information reduces the probability of the hypothesis.

  ### II. The Translation Question: Modern Equivalencies

  Your suspicion that standard translations are too quick is well-founded. Identifying Keynesian weight with modern formalizations often commits a category mistake by conflating logical relations with psychological states.

  **(i) Imprecise Probability (Sets of Functions)**
  The view that weight corresponds to the size of a set of probability functions (where low weight = wide set) fails on two counts.
  First, **Sharpness vs. Weight:** On Keynes's account, an argument can have a precise, numerical probability while having low weight (as in the Urn Case A above). If weight were the spread of the set, low weight would necessitate a wide interval. Keynes explicitly allows for precise probabilities derived from thin evidence (via the Principle of Indifference). Thus, weight cannot be the cardinality or spread of compatible functions.
  Second, **Ontology:** Imprecise probability usually models an agent's ignorance. Keynesian weight is a property of the *argument*, not the agent. Two agents with different credences assessing the same argument must agree on its weight. Identifying weight with a set of functions psychologizes a logical relation.

  **(ii) Knightian Uncertainty**
  Knight distinguishes risk (measurable, insurable) from uncertainty (unmeasurable, uninsurable). While this parallels Keynes's distinction between numerical and non-numerical probability, the grounding differs. Knight's distinction is pragmatic and market-based: can we classify cases to form a frequency? Keynes's distinction is logical: does a numerical relation exist between these specific propositions?
  Knightian uncertainty often implies an ontological limit on knowledge or a lack of data for classification. Keynesian low weight implies a logical limit on inference given the available evidence. You can have Knightian uncertainty with high Keynesian weight (e.g., we have all the evidence, but the event is unique and unclassifiable). They are distinct concepts doing similar work in different domains (market pricing vs. logical inference).

  **(iii) Second-Order Uncertainty**
  Identifying weight with uncertainty about one's own probability (confidence) is the most common error. This makes weight a second-order probability. For Keynes, weight is not a probability about a probability; it is a measure of the evidence base for the first-order probability.
  **Your Formalization:** You propose weight measures the spread of functions compatible with evidence, with ambiguity aversion as the behavioral shadow.
  **Where it goes wrong:** As noted, Keynes allows for sharp probabilities with low weight. Furthermore, ambiguity aversion is a psychological trait. Keynes is describing a logical constraint on rational action. A rational agent *ought* to hesitate when weight is low; this is not a description of an aversion parameter, but a normative requirement of rational conduct given the logical status of the argument.
  **Can weight be max + sharp?** Yes. If evidence is complete and deterministic, probability is 1 and weight is maximal.
  **Can weight be high + interval?** Yes. If evidence is abundant but the logical relation remains inherently non-numerical (due to incommensurability), weight is high but probability is an interval.

  ### III. Ramsey's Objection and the Keynesian Reply

  **Ramsey's Objection**
  Ramsey attacks the ontological and epistemological foundations of the *Treatise*.
  1.  **Ontology:** He denies that objective logical relations of probability exist. There are no "partial entailments" floating between propositions.
  2.  **Epistemology:** Even if they did exist, we have no faculty to perceive them. We cannot simply "see" that evidence $e$ supports $h$ to degree $\alpha$.
  3.  **Action:** Keynes fails to connect these logical relations to action. Ramsey argues that degrees of belief *just are* betting dispositions. If a probability cannot be measured by a betting quotient, it is meaningless.

  **The Keynesian Reply**
  The strongest reply is that Ramsey changes the subject from **warrant** to **coherence**.
  Keynes is offering a theory of *warrant*: given evidence $e$, how much does it support $h$? This is normative. It tells an agent what they *ought* to believe.
  Ramsey is offering a theory of *coherence*: given an agent's beliefs, are they consistent with each other and their actions? This is internalist.
  The Keynesian argues that one can be perfectly coherent (Ramsey-satisfying) while being utterly unwarranted (Keynes-failing). An agent can have consistent betting dispositions based on no evidence. Ramsey's theory cannot distinguish between a lucky guess and a well-founded inference; Keynes's can.

  **Rebuttal or Restatement?**
  This is ultimately a **restatement of the disagreement** regarding the ontology of normativity.
  Ramsey is an expressivist/subjectivist: norms of belief are derived from the requirements of consistent action.
  Keynes is a realist/logicist: norms of belief are derived from objective logical relations.
  The Keynesian reply successfully defends the *utility* of the concept of warrant for distinguishing good reasoning from bad, but it does not refute Ramsey's claim that such logical relations are epistemologically inaccessible. If we cannot perceive logical probabilities, Keynes's logicism is idle. The reply holds only if one accepts that logical relations exist independently of our ability to measure them via betting. Thus, the debate stalls at the meta-epistemological level.

  ### IV. Continuity: From *Treatise* to *General Theory*

  Does the weight of argument survive into the *General Theory* (GT)? The answer is yes, but it undergoes a functional shift from a logical category to a psychological and macroeconomic driver.

  **The 1937 QJE Article**
  In his *Quarterly Journal of Economics* article, Keynes explicitly distinguishes "uncertain knowledge" from "merely probable knowledge." He cites the *Treatise*, noting that uncertainty arises when there is no scientific basis on which to form any calculable probability whatever. This is the limiting case of zero or negligible weight. When the weight of evidence regarding future yields is vanishingly small, the logical relation of probability collapses.

  **Conventions and Animal Spirits**
  In Chapter 12 of the GT, "conventions" (assuming the future will resemble the present, trusting others' judgments) are coping mechanisms for low-weight environments. When weight is low, rational calculation is impossible. Agents do not stop acting; instead, they rely on psychological conventions and "animal spirits" (spontaneous optimism).
  This is not a rejection of the *Treatise*, but an application of it to long-term expectation. The *Treatise* explains *why* calculation fails (lack of relevant evidence/weight); the *GT* explains *how* agents behave when it fails (psychology/convention).

  **Continuity vs. Discontinuity**
  If one views the *Treatise* as a failed project in logicism (per Ramsey), the GT looks like a shift to psychology. However, if one accepts the Keynesian distinction between warrant and belief, the GT is continuous.
  The "weight" concept explains the **necessity** of conventions. If weight were high, conventions would be unnecessary; we would calculate. Because weight is low in investment markets, conventions are required to stabilize behavior.
  **What turns on the answer?**
  If the concepts are continuous, Keynes's economics is grounded in a specific epistemology of induction: markets are unstable because the evidence base for future returns is inherently thin (low weight). Policy interventions are justified not just to fix prices, but to bolster the "weight" of public knowledge or to substitute for the lack of private weight.
  If the concepts are discontinuous, the GT is merely a psychological observation about fear and greed, detached from the logical theory of inference.
  I argue for **continuity of problem, shift in solution**. The logical problem (induction under scarce evidence) remains identical. The solution shifts from individual logical assessment (ToP) to collective psychological stabilization (GT). The "weight of argument" is the hidden variable explaining the volatility of investment: as the perceived weight of evidence regarding the future fluctuates, reliance on fragile conventions increases, leading to sudden collapses in confidence.

  ### Summary of Stance
  I argue that Keynes's weight is a measure of the **completeness of relevant evidence**, distinct from the probability value itself. It resists translation into imprecise probability sets because it is a property of logical arguments, not agent states. Ramsey's objection highlights the epistemological difficulty of accessing logical relations but fails to capture the normative distinction between warranted and coherent belief. Finally, the *General Theory* applies the *Treatise*'s insight about low-weight environments to macroeconomics, explaining why rational calculation gives way to convention when the evidence base for the future is inherently thin.
