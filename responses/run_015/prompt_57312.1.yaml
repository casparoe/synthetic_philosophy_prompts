      *   *(i) Example:* Urn problem. Case A: 1 ball drawn, black. $P(\text{next black}) = 1/2$ (assume uniform prior). Case B: 1000 balls drawn, 500 black. $P(\text{next black}) = 1/2$. Weight is higher in B.
      *   *(ii) Function:* Why care if $P$ is same? Keynes links weight to confidence in *action*. It's not about the *truth* of the conclusion, but the *stability* of the inference. It justifies acting on the probability. Low weight = hesitation, even if $P$ is high.
