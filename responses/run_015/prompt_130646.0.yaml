      *   *Concessions:* Needs to be strategic. Admit it's a pilot, not a total overhaul. Admit the replication link is indirect.
      *   *Replies:* Need to be punchy (90 seconds spoken is ~150-180 words).
      *   *Weakness:* Honest assessment of where the argument leaks.

  6.  **Review against Constraints:**
