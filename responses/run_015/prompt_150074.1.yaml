      *   Footnotes = What he was trying to say / What a competent reader would take away.
      *   Exclusion = What he would have said if stopped.

      *Identifying the "Judgment Calls":*
      I need to be honest. No procedure removes the need for human judgment, especially regarding the donor/family liaison.

