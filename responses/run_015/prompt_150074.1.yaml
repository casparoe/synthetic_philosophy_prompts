answer: |-
  ### Part 1: The Decision Procedure

  This procedure is designed for a 15-minute review window. It separates **Textual Integrity** (what goes in the main text block) from **Editorial Mediation** (what goes in the footnotes). It forces you to identify *which* "meaning" you are chasing before you make a change.

  **The Four Layers of Meaning (For Volunteers)**
  *   **Layer 1 (Artifact):** What is physically on the page? (Priority for transcription).
  *   **Layer 2 (Rhetorical):** What did the *original recipient* understand? (Priority for historical context).
  *   **Layer 3 (Intentional):** What did the *author* believe to be true? (Priority for scientific accuracy).
  *   **Layer 4 (Editorial):** What does the *modern reader* need to know to avoid being misled? (Priority for footnotes).

  **The Rule:** The main text must always represent **Layer 1**, unless there is irrefutable evidence of error (Layer 3). All conflicts between Layer 1 and Layer 3 are resolved in the footnotes (Layer 4).

  ---

  #### The 5-Step Checklist

  **Step 1: Source Identification**
  *   **Question:** Who physically produced this mark/word, and when?
  *   **Sufficient Answer:** "Author at time of writing," "Scribe at time of writing," or "Author/Other at later date."
  *   **If "Scribe" or "Later Date":** Go to Step 2.
  *   **If "Author at time of writing":** Go to Step 3.

  **Step 2: Authority Check (The "Ghost Text" Rule)**
  *   **Question:** Do we have a draft, notebook, or parallel text in the Author's own hand that proves the Scribe/Later Hand changed the *meaning* (not just spelling)?
  *   **Sufficient Answer:** "Yes, specific document cited" OR "No, only speculation based on style."
  *   **If "No":** **STOP.** Print the text as it appears. Add a footnote: *"Transcribed from dictated copy; phrasing may reflect scribe's intervention."* (Do not emend).
  *   **If "Yes":** Go to Step 5 (Hand-off).

  **Step 3: Audience Variance (The "Welsh/English" Rule)**
  *   **Question:** Is the variation between two versions (e.g., Welsh vs. English) a contradiction of fact or a simplification for audience?
  *   **Sufficient Answer:** "Contradiction of fact" OR "Simplification/Omission."
  *   **If "Simplification/Omission":** **STOP.** Print the version you are editing. Footnote the existence of the other version. (Do not merge texts).
  *   **If "Contradiction of fact":** Go to Step 5 (Hand-off).

  **Step 4: Marginalia & Later Additions**
  *   **Question:** Does the later note explicitly revoke the earlier text (e.g., "I was wrong about X") or merely comment on it?
  *   **Sufficient Answer:** "Explicit revocation" OR "Commentary."
  *   **If "Commentary":** **STOP.** Print main text. Transcribe marginalia as a separate "Annotation" section or distinct footnote. Do not blend into main text.
  *   **If "Explicit revocation":** Go to Step 5 (Hand-off).

  **Step 5: The Values Hand-off**
  *   **Trigger:** Any "Yes" in Step 2, "Contradiction" in Step 3, or "Revocation" in Step 4.
  *   **Action:** Do not edit. Do not annotate yet. Flag for Editorial Board + Family Liaison.
  *   **Reason:** This is no longer a question of evidence (Layer 1 vs 3); it is a question of values (Do we prioritize the Author's private truth or the public historical record?).

  ---

  #### Where This Is a Judgment Call Disguised as Procedure
  *   **Step 3 (Simplification vs. Contradiction):** Deciding if dropping a claim is "simplification" or "hiding the truth" is subjective. The procedure forces you to call it one way to keep moving, but reasonable volunteers will disagree.
  *   **Step 5 (The Hand-off):** This admits the procedure cannot solve value conflicts. It kicks the can to you and the donor. This is not a bug; it is a feature. It prevents volunteers from making enemies of the family.

  ---

  ### Part 2: Running the Cases

  Here is how the procedure applies to your three scenarios.

  #### Case 1: The Daughter's Dictation ("Not Uncommon" → "Common")
  *   **Step 1 (Source):** Scribe at time of writing (Daughter).
  *   **Step 2 (Authority):** Do we have a draft?
      *   *Scenario A:* You have his notebook saying "not uncommon." **Answer:** Yes. **Result:** Hand-off (Step 5).
      *   *Scenario B:* You have no draft, only your suspicion based on his usual caution. **Answer:** No.
  *   **Procedure Outcome (Scenario B):** **STOP.** Print "common" in the main text. Add footnote: *"Dictated copy reads 'common'; author's typical usage suggests 'not uncommon' may have been intended."*
  *   **The Unpopular Outcome:** You (the Editor) will hate this. It leaves a scientific inaccuracy in the main text. You want to emend to "not uncommon [common]" to fix the record.
  *   **Defending to the Donor:** The donor (great-granddaughter) might actually *prefer* you fix it to protect the Naturalist's reputation. However, if she is protective of the *Daughter's* role, she may object to the footnote implying her grandmother altered the science. You must defend the footnote as mandatory transparency under Step 2. You cannot emend without a draft (Layer 1 integrity).

  #### Case 2: The Welsh/English Pair (Dropped Claim)
  *   **Step 1 (Source):** Author at time of writing (both versions).
  *   **Step 3 (Audience):** Is it contradiction or simplification?
      *   *Analysis:* He dropped the claim in English. Was it because it was false (Contradiction) or because the English reader wouldn't understand the local geology (Simplification)?
      *   *Procedure Default:* In the absence of proof of error, assume **Simplification/Omission**.
  *   **Procedure Outcome:** **STOP.** Print the English text as is. Footnote: *"A parallel Welsh version of this report includes the claim [X], omitted here."*
  *   **Why:** You are editing the English letter. To insert the Welsh claim into the English text creates a hybrid document that never existed (violates Layer 1). The footnote satisfies Layer 4 (Modern Reader needs to know).

  #### Case 3: Later Marginalia (Contradiction)
  *   **Step 1 (Source):** Author at later date (different ink).
  *   **Step 4 (Marginalia):** Does it revoke the text?
      *   *Analysis:* It "flatly contradicts."
  *   **Procedure Outcome:** **HAND-OFF (Step 5).**
  *   **Why:** A later revocation changes the scientific record. Do we print the "wrong" early theory or the "corrected" later theory? Do we print both? This affects how his scientific legacy is tagged and titled (Layer 4). This is too complex for a 15-minute volunteer review. It requires the Board to decide if this edition represents the *man at the time* or the *man's final conclusions*.

  ---

  ### Part 3: Limitations & False Confidence

  **1. The "Simplification" Trap (Step 3)**
  The procedure assumes you can distinguish between "writing for a lay audience" and "lying." You often cannot.
  *   **False Confidence:** The procedure makes it look like you have evidence that the Welsh claim was just "omitted for simplicity." You don't. He might have realized the Welsh claim was wrong and quietly fixed it in English.
  *   **What to keep doing by argument:** You must periodically review the "Omission" footnotes as a board. If 50 letters show a pattern of Welsh claims being dropped in English, your "Simplification" assumption is wrong, and it becomes a "Correction." That requires a policy shift, not a volunteer decision.

  **2. The "Artifact" vs. "Truth" Tension (Step 2)**
  The procedure prioritizes the physical document (Layer 1) over the author's likely intent (Layer 3) unless you have a draft.
  *   **False Confidence:** It makes volunteers feel they are being "objective" by printing the scribe's error. They are not. They are choosing *Documentary Integrity* over *Scientific Accuracy*.
  *   **What to keep doing by argument:** You need to explain to your scientific users (who copy-paste you) that you are an *archive*, not a *critical edition*. If they want the "truth," they must read the footnotes. You cannot fix their laziness with better editing.

  **3. The Cipher (The Case I Didn't Run)**
  *   **Why I skipped it:** The procedure fails here.
  *   **Reason:** If the intended reader was *one person with a key*, Layer 2 (Rhetorical Meaning) is inaccessible to us. We are guessing Layer 3 (Intentional).
  *   **Action:** This is always a **Step 5 Hand-off**. Deciding whether to publish a private cipher is a privacy/ethical value judgment, not a textual one. Do not let volunteers decode this.

  **Summary for your Volunteers:**
  "If you can't prove it's a mistake with a draft, print what's on the page. If you see a conflict, write a note. If the note gets complicated, send it to the Board. Do not try to be the author."
