answer: |-
  **Project Title:** The Limits of Deflationism: Verbal Disputes and Practical Stakes in Institutional Ontology

  **Project Summary**
  Contemporary metaontology has largely coalesced around deflationary accounts of ontological dispute. Prominent frameworks suggest that many seemingly substantive debates—particularly regarding composition or abstract objects—are merely verbal, resolvable through conceptual clarification or quantifier variance. However, these frameworks are predominantly tested against physical or abstract domains. This project investigates whether metaontological deflationism remains viable when applied to *institutional kinds* (e.g., prisons, borders, currencies). Because institutional facts are constitutively dependent on collective acceptance and carry immediate normative force, classifying disputes about them as "merely verbal" risks obscuring the power dynamics that fix their reality. Over a 12-week period, this research will test deflationary tools against two case studies of contested institutional kinds to determine if a principled distinction can be drawn between verbal disputes and those with unavoidable practical substantivity.

  **Research Question & Philosophical Motivation**
  The central question is: **Does metaontological deflationism collapse or require revision when applied to institutional facts, and can we formulate a criterion to distinguish verbal social-ontological disputes from those with unavoidable practical stakes?**

  Standard deflationism operates on the assumption that once linguistic confusion is cleared, the ontological residue disappears. In physical ontology, claiming "there is no table, only atoms" has little practical impact on how we navigate the world. In social ontology, however, the classification *is* the reality. If a deflationist argues that the dispute over whether a privately run detention facility is a "prison" is merely verbal (a difference in conceptual scheme), they ignore that the classification determines legal rights, funding, and accountability.

  The philosophical motivation hinges on a potential self-undermining problem for the deflationist. If institutional kinds are constituted by collective intentionality and normative rules, then arguing about the concept *is* arguing about the ontology. To dismiss such disputes as verbal is to misunderstand the constitutive role of language in the social realm. This project seeks to locate the breaking point where deflationary metaontology fails to capture the "practical substantivity" of social kinds.

  **Gap in Existing Literature**
  Current metaontological literature largely treats social ontology as a niche application rather than a stress test for general frameworks. Deflationary accounts are typically calibrated using examples from mereology (composition) or mathematics (numbers). While social ontologists have discussed the nature of institutional facts, few have rigorously applied the *metaontological* tools of Chalmers or Hirsch to these cases to test their limits. Consequently, there is no established criterion for when a social-ontological dispute transitions from a verbal misunderstanding to a substantive political conflict. This project fills that gap by treating institutional kinds not just as objects of study, but as a challenge to the validity of current metaontological methods.

  **Methodology & Timeline (12 Weeks)**

  *   **Weeks 1–3: Framework Reconstruction.**
      I will reconstruct the canonical deflationary criteria for verbal disputes (e.g., translatability, quantifier variance) and contrast them with constitutive accounts of institutional facts. The goal is to establish a baseline "Deflationary Test" to be applied to social cases. I will focus on identifying where the "nothing more than" claim of deflationism conflicts with the "constitutive" claim of social ontology.

  *   **Weeks 4–7: Case Study Analysis.**
      I will apply the Deflationary Test to two specific contested kinds:
      1.  **The Private Prison:** Is the dispute over whether a privately contracted facility is a "prison" verbal (different definitions of state authority) or substantive (different distributions of power)?
      2.  **The Unenforced Border:** Does a border exist ontologically when not physically enforced? A deflationist might say this is just a dispute over the concept "border." I will analyze whether this classification ignores the causal reality of the border's existence in law and migration flows.
      For each case, I will attempt to "deflate" the dispute. If the dispute persists despite conceptual clarification, I will categorize the residue as "practical substantivity."

  *   **Weeks 8–10: Synthesis and Criterion Development.**
      I will analyze the results to see if deflationism can be revised to accommodate these cases. Can we add a "practical stakes" clause to deflationism? Or does the presence of normative force automatically make a dispute substantive? I will draft a preliminary criterion for "Practical Substantivity" that distinguishes harmless verbal disputes from those that alter institutional reality.

  *   **Weeks 11–12: Finalization.**
      Refining the argument, ensuring the scope remains within metaontology (not drifting into pure political theory), and preparing the final paper.

  **Expected Outcomes & Success Conditions**
  *   **Success:** The project produces a refined metaontological criterion that identifies when linguistic disputes in the social realm carry ontological weight due to their constitutive nature. A successful result would demonstrate that deflationism is not false, but *domain-sensitive*: it applies to physical/abstract objects but requires modification for institutional kinds.
  *   **Failure:** The project ends with the vague conclusion that "it depends on the context" without offering a principled philosophical line between verbal and substantive. Another failure mode is drifting into political sociology rather than maintaining metaphysical rigor regarding the status of the dispute itself.
  *   **Deliverable:** A 25–30 page research paper suitable for submission to a graduate journal or conference, focused on the intersection of metaontology and social ontology.

  **Feasibility & Scope**
  This project is designed specifically for a 10–12 week summer window. It does not attempt to solve the nature of institutional facts broadly (a lifelong project) but rather tests a specific metaontological tool against them. By limiting the case studies to two clear examples, I can ensure depth of analysis without overextending the timeline. The risk of scope creep is managed by focusing strictly on the *status of the dispute* (metaontology) rather than the *ethics of the institutions* (normative theory).
