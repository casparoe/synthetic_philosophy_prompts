answer: |-
  You have reconstructed the core tension of the **List-Pettit Impossibility Theorem** (2002) very accurately. Your intuition is correct: the argument does not prove democracy is impossible, but it does prove that *perfectly consistent, fully inclusive, fully democratic aggregation of complex judgments* is impossible.

  You asked where the slip happens. You are right to target **Premise (3)**.

  Here is the breakdown of why (3) is the category error, along with the two other "escape hatches" that save democracy from your reductio.

  ### 1. The Slip: What "Domain Restriction" Actually Means
  **Premise (3):** *In a real democracy, restricting admissible profiles means excluding some people's judgments.*

  This is the equivocation. In social choice theory, "restricting the domain" does **not** mean restricting the *franchise* (who gets to vote). It means restricting the *logical combinations of votes* that are empirically likely to occur.

  *   **Universal Domain (The Axiom):** The theorem assumes that *any* logically possible combination of individual judgments is permissible. Voter A can believe $P$, Voter B can believe $\neg P$, and Voter C can believe $P \to Q$ but $\neg Q$, all at the same time, with no correlation.
  *   **Restricted Domain (The Reality):** In a functioning society, voters are not random logic generators. They share facts, cultures, and reasoning processes. If voters deliberate, their judgments tend to correlate. For example, if everyone agrees on the logical implication ($P \to Q$), the paradox cannot arise even if they disagree on $P$.

  **The Fix:** Domain restriction is achieved through **deliberation**, not disenfranchisement. By talking to each other, voters align their "profiles" so they naturally fall into a "safe" domain (e.g., a domain where judgments are "single-peaked" or logically aligned) without anyone losing their right to vote.

  ### 2. The Institutional Escape: Agenda Control
  You hinted at this: *"is it that domain restriction can mean agenda control instead of excluding people?"* **Yes.**

  The Discursive Dilemma arises specifically because of **how** the question is structured. The committee has to choose between two procedural rules:
  1.  **Premise-based procedure:** Vote on the premises ($P$, $P \to Q$) and derive the conclusion ($Q$).
  2.  **Conclusion-based procedure:** Vote directly on the conclusion ($Q$) and ignore the premises.

  The "contradiction" only happens if you try to do both simultaneously or if you demand that the collective judgment be consistent *across* all propositions regardless of the procedure.

  **The Fix:** A democracy can institutionally decide: "We only vote on the conclusion." Or: "We only vote on the premises, and the outcome is binding."
  This is not disenfranchisement; it is **procedural definition**. It acknowledges that a collective body is an agent that must prioritize *decision* over *perfect logical bookkeeping*. By choosing a procedure, you avoid the paradox without silencing voters.

  ### 3. The Hidden Move: Consistency vs. Legitimacy
  You asked: *"is there a hidden move from logical consistency to democratic legitimacy?"*

  **Yes, this is the philosophical core.** Your Premise (4) assumes that *guaranteeing rational collective decisions* is the primary goal of democracy.
  *   **Technocratic View:** The goal is a consistent output (a rational "group mind").
  *   **Democratic View:** The goal is a legitimate process (fair inclusion).

  If you prioritize legitimacy, you can accept Premise (1) and simply admit: **"Sometimes, the democratic outcome will be logically inconsistent."**

  This is not fatal. A parliament can pass Law A and Law B, which together imply Contradiction C, without the state collapsing. The "irrationality" is distributed over time and corrected through future elections or judicial review. Democracy is not a single snapshot vote; it is a dynamic error-correction system. The Discursive Dilemma treats democracy as a static logic gate, which is a category error.

  ### Summary of the Correction
  Your argument fails at **Premise (3)** and relies on a hidden assumption in **Premise (4)**.

  1.  **Reject (3):** Restricting the domain of *profiles* is not the same as restricting the domain of *voters*. It is achieved through shared information and deliberation.
  2.  **Reject the necessity of (4):** We do not need to *guarantee* rational collective decisions in every instance. We need to guarantee fair procedures. Occasional inconsistency is the price of inclusion.
  3.  **Accept Agenda Control:** We solve the dilemma by deciding *what* we are voting on (premises vs. conclusion), which is a political choice, not a mathematical inevitability.

  **Conclusion:** The Discursive Dilemma proves that **collective rationality is fragile**, not that democracy is impossible. It shows that if you want a consistent group agent, you must sacrifice either full inclusion (disenfranchisement), full fairness (dictatorship), or full responsiveness to all issues (agenda control). Democracies choose to sacrifice perfect consistency to maintain inclusion and fairness. That is a feature, not a bug.
