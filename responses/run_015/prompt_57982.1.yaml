answer: |-
  This is not weird at all. In fact, you have independently rediscovered one of the most significant distinctions in the neuroscience and philosophy of pain. You are describing the split between the **sensory-discriminative** aspect of pain (where it is, how strong it is, what it feels like) and the **affective-motivational** aspect (how much it bothers you, the urge to escape it, the emotional suffering).

  There is robust literature on this, but because it spans neurology, psychology, and philosophy, the terminology can get fragmented. Here is the carving you are looking for, the distinction between your two examples, and the established (and synthesized) terminology to describe it.

  ### 1. The Established Carving: Sensory vs. Affective

  In pain science, pain is not treated as a single monolithic signal. It is processed in at least two parallel pathways in the brain:

  1.  **The Lateral System (Sensory-Discriminative):** This tells you *what* is happening. It processes location, intensity, and quality (sharp, burning, throbbing). This relies heavily on the somatosensory cortex.
  2.  **The Medial System (Affective-Motivational):** This tells you *how much it matters*. It processes unpleasantness, fear, and the drive to withdraw. This relies heavily on the **Anterior Cingulate Cortex (ACC)** and the **Insula**.

  Your intuition is correct: You can have one without the other.

  ### 2. The Roommate's Case: Pain Asymbolia

  The clinical term for what your roommate described is **Pain Asymbolia**.

  *   **The Mechanism:** This is usually caused by a lesion (stroke, injury, surgery) to the insula or the cingulate cortex. The "wire" that carries the "this is bad" signal is cut, but the "wire" carrying the "this is happening at the left knee" signal remains intact.
  *   **The Phenomenology:** Patients will say, "Yes, that hurts," or "That is sharp," often with a smile. They recognize the sensation as pain but lack the *imperative* to stop it. If you prick them, they might pull away slowly or only when instructed, not reflexively.
  *   **The Philosophy:** This condition is crucial evidence for philosophers who argue that "unpleasantness" is not essential to the definition of pain. It suggests pain is a sensation *plus* an emotional reaction, and the reaction can be surgically removed.

  ### 3. The Runner's Case: Top-Down Modulation (Flow/Analgesia)

  Your experience is phenomenologically similar but mechanistically different. This is best described as **Endogenous Analgesia** within a **Flow State**.

  *   **The Mechanism:** This is "top-down" processing. Your brainstem releases endogenous opioids (endorphins) and neurotransmitters (dopamine, norepinephrine) that dampen the signal *before* it fully registers as suffering. Additionally, your attentional focus (on the goal, the rhythm) gates the sensory input.
  *   **The Phenomenology:** Unlike the asymbolia patient, your "caring" circuit wasn't broken; it was overridden. The pain was likely still unpleasant, but the *value* of finishing the race outweighed the *disvalue* of the pain. You didn't stop minding the pain because the "badness" was gone; you stopped minding it because the "goodness" of the goal was louder.
  *   **The Distinction:** In asymbolia, the pain has no negative valence (it is neutral). In the runner's high, the pain often retains negative valence, but it is *tolerated* or *reappraised* as productive ("this pain means I'm getting stronger").

  ### 4. Are They The Same Thing?

  **Phenomenologically:** Yes, they overlap. Both involve the experience of nociception (tissue damage signaling) without the typical behavioral withdrawal or emotional distress.

  **Etiologically:** No.
  *   **Asymbolia** is a *deficit of evaluation*. The brain cannot tag the sensation as "bad."
  *   **Runner's High** is a *conflict of evaluation*. The brain tags the sensation as "bad," but tags the activity as "good," and the "good" wins.

  A useful way to test this: If you told the asymbolia patient, "If you don't pull your hand away, it will cause permanent damage," they might still not care (due to apathy associated with the lesion). If you told the runner, "If you keep running, you will tear your ACL," the "caring" would likely return instantly. The runner's dissociation is context-dependent; the patient's is structural.

  ### 5. Terminology and Definition

  You asked for a term. "Pain Asymbolia" is too clinical (implies brain damage). "Pain Tolerance" is too broad (implies gritting your teeth while suffering). "Dissociation" is too vague (implies checking out of reality).

  Since there isn't a single perfect umbrella term in the popular lexicon, I will coin/synthesize a term based on the philosophical literature (specifically the work of philosophers like **David Bain** and **Michael Tye** who discuss the "imperativist" nature of pain) to give you the clean definition you requested.

  **Term:** **Affective Pain Decoupling**

  **Definition:** A state in which the sensory-discriminative components of nociception (location, intensity, quality) remain conscious and intact, while the affective-motivational components (unpleasantness, urge to withdraw, emotional suffering) are either absent or significantly muted.

  **Why this term works:**
  *   **Affective:** Refers to the emotional "ouch" rather than the physical "poke."
  *   **Decoupling:** Implies the two normally fused elements have been separated, whether by injury (asymbolia), chemistry (morphine), or psychology (flow).

  ### 6. Edge Cases: Drawing the Line

  To help you understand where this concept starts and stops, here are three edge cases that test the boundaries of **Affective Pain Decoupling**:

  **Case A: The Morphine Patient (Chemical Decoupling)**
  *   *Scenario:* A patient on morphine says, "I can feel my leg hurting, it feels like a knife, but it doesn't bother me."
  *   *Verdict:* **True Decoupling.** Opioids preferentially dampen the affective pathways (ACC) more than the sensory pathways. This is the closest pharmacological equivalent to your roommate's patient.
  *   *Line:* This counts. The "yuck" is chemically removed, not just ignored.

  **Case B: The Hypnotized Subject (Suggestive Decoupling)**
  *   *Scenario:* Under hypnosis, a subject is told, "You will feel the heat, but it will not be unpleasant." They report feeling the heat without distress.
  *   *Verdict:* **True Decoupling.** Studies show hypnosis can reduce activity in the ACC (suffering) while leaving the somatosensory cortex (sensation) active.
  *   *Line:* This counts. It proves the split can be achieved via suggestion, not just lesions or drugs.

  **Case C: The Masochist (Valence Inversion)**
  *   *Scenario:* A person seeks out pain and claims to enjoy it.
  *   *Verdict:* **Not Decoupling.** This is **Valence Inversion**. The affective component is still active; the pain is still "intense" and "arousing," but the cognitive appraisal flips the signal from "avoid" to "approach." They still mind the pain, but they want the mind-ing.
  *   *Line:* This does **not** count as decoupling. The connection between sensation and affect is intact; the *interpretation* of that affect is what has changed.

  ### Summary for Your Debate

  You can tell your roommate:
  1.  She is describing **Pain Asymbolia** (a neurological disconnection in the cingulate/insula).
  2.  You experienced **Endogenous Analgesia** (a functional override via opioids and attention).
  3.  Both are examples of **Affective Pain Decoupling** (the separation of sensation from suffering).
  4.  The literature confirms her observation: Pain is not a single thing. It is a sensation *plus* a command to care. Sometimes, you can hear the sensation without obeying the command.

  **Recommended Reading if you want to go deeper:**
  *   *Philosophy:* "The Nature of Pain" by David Bain (discusses whether unpleasantness is essential to pain).
  *   *Neuroscience:* "Painful Memories" by Rainville et al. (1997) — a landmark study using hypnosis to show the separation of sensory and affective brain activity.
  *   *Book:* *The Gift of Pain* by Paul Brand (written by a surgeon who worked with leprosy patients who felt no pain, discussing the necessity of the "caring" component).
