answer: |-
  ### Purpose and Scope

  Before listing the desiderata, we must settle what this theory is for. If the aim is purely metaphysical—to settle whether DNA *really* possesses semantic content in the way a sentence does—the bar is set by intuition and logical consistency. If the aim is to ground molecular biology's explanatory practice, the bar is set by utility: does calling it 'information' help us predict, manipulate, or understand the system better than calling it a 'cause'?

  I take the latter purpose to be primary. A metaphysics of genetic content that renders biological practice unintelligible is idle; conversely, a practice that relies on a incoherent metaphor is unstable. Therefore, the theory must justify the *explanatory privilege* granted to DNA without denying the causal necessity of the rest of the cell. The list below is constructed for this explanatory purpose. If one were pursuing a purely metaphysical project, one might drop the requirement for explanatory privilege in favour of ontological parity, but that would cease to be a theory of *genetic* information and become a theory of *causation* generally.

  ### The Desiderata

  **1. The Arbitrariness Constraint (Non-negotiable)**
  *   **Requirement:** The theory must distinguish between relations that are chemically necessitated and relations that are contingent upon a specific coding convention.
  *   **Consideration:** This addresses the **Baseline** case. The affinity between a hydrophobic amino acid and the interior of a folded protein is a matter of physical chemistry; it could not be otherwise given the laws of nature. The affinity between a codon and an amino acid is contingent; it is mediated by tRNAs and synthetases that could, in principle, be different. A theory of information must explain why we reserve the term for the latter. If the theory collapses this distinction, 'information' becomes synonymous with 'cause', and the metaphor gains no traction.
  *   **Status:** Non-negotiable for a semantic theory. Causal theories reject this, but they thereby fail to explain why biologists treat DNA differently from the cytoplasm.

  **2. The Contextual Completeness Constraint (Non-negotiable)**
  *   **Requirement:** The theory must acknowledge that the sequence alone is insufficient to determine the product; the 'reader' machinery is part of the information-bearing system.
  *   **Consideration:** This addresses **Context-sensitivity**. Alternative splicing, RNA editing, and regulatory states mean the same sequence yields different outputs. A theory that locates content solely in the nucleotide string is empirically false. The 'message' is a property of the sequence *in relation to* the cellular state.
  *   **Status:** Non-negotiable. Any view claiming the DNA sequence contains the full specification of the phenotype independent of cellular context is refuted by molecular evidence.

  **3. The Inheritance vs. Information Distinction (Preference)**
  *   **Requirement:** The theory must provide a principled reason to include or exclude non-sequence heredity (methylation, cytoplasmic structures) from the category of 'genetic information'.
  *   **Consideration:** This addresses **Heredity without sequence**. If 'information' is defined by its role in development, epigenetic marks qualify. If defined by digital replication fidelity or specific coding conventions, they may not. The theory cannot simply ignore these; it must either expand 'genetic' to 'hereditary' information or explain why DNA is privileged despite the causal efficacy of epigenetic marks.
  *   **Status:** Preference. Developmental systems theorists demand inclusion; literalists demand exclusion. A robust theory should allow the distinction to be drawn without denying the causal role of the excluded factors.

  **4. The Underdetermination Constraint (Non-negotiable)**
  *   **Requirement:** The theory must not equate information with deterministic specification. It must accommodate one-to-many mappings (reaction norms).
  *   **Consideration:** This addresses the **Reaction Norm**. A genotype does not specify a single phenotype but a range of potential phenotypes across environments. If 'information' implies a blueprint that uniquely determines the outcome, the concept fails. The theory must characterise genetic information as setting parameters or constraints rather than dictating a singular result.
  *   **Status:** Non-negotiable. Phenotypic plasticity is ubiquitous.

  **5. The Code Stability and Regress Constraint (Non-negotiable)**
  *   **Requirement:** The theory must locate the 'key' to the code without generating an infinite regress of interpreters. It must determine whether content resides in the sequence or the mapping machinery when the two come apart.
  *   **Consideration:** This addresses **Lineage L**. If the adaptor molecules (the mapping) are inherited separately from the DNA, and the mapping shifts, does the DNA's information content change? A semantic view must say yes: the same syntax with a different dictionary carries different content. However, this raises the regress problem: if the machinery interprets the DNA, what interprets the machinery? The theory must posit a stopping point, likely in the self-sustaining organisation of the cell, without claiming the machinery itself is 'read' in the same way.
  *   **Status:** Non-negotiable. Without resolving where the code lives, the notion of genetic content is unmoored.

  **6. The Source and Function Constraint (Preference)**
  *   **Requirement:** The theory must distinguish between reliable environmental cues and inherited signals, likely by invoking history or proper function.
  *   **Consideration:** This addresses the **Environmental Cue**. An arbitrary but reliable cue (e.g., temperature triggering a morph) acts like a signal. To exclude it from 'genetic information', the theory must demand more than arbitrariness and reliability. It typically demands a history of selection *for* the signalling relationship, or that the source is internal to the lineage's replication cycle.
  *   **Status:** Preference. Teleological views demand this; causal views deny the distinction matters.

  ### Tensions and Exclusions

  **The Incompatible Pair: Contextual Completeness vs. Locational Stability**
  I suspect **Contextual Completeness** (Desideratum 2) and **Locational Stability** (implicit in the desire to say the information is *in* the DNA) cannot be jointly satisfied without qualification. If the content of the DNA is dependent on the cellular context (splicing, editing, Lineage L's mapping), then the information is not stably located in the DNA strand itself. It is a property of the *system*. Yet, explanatory practice requires us to treat the DNA as the stable repository of hereditary information. We want to say the DNA *carries* the information across generations, but if the 'meaning' changes with the cellular context which is not fully encoded in the DNA, the DNA does not carry the full content. The theory must accept that 'genetic information' is a relational property, not an intrinsic one, which undermines the common intuition that the genome is a self-contained library.

  **The Greatest Excluder: The Arbitrariness Constraint**
  The single requirement that excludes the largest family of views is **The Arbitrariness Constraint** (Desideratum 1). This immediately disqualifies all deflationary, causal, or 'parity' accounts. If information requires a contingent coding relation, then mere causal contribution (like the shape of the womb or the presence of nutrients) cannot be information, regardless of its necessity for development. This constraint preserves the special status of DNA but at the cost of severing the conceptual link between information and general causation.

  ### Scorecard of Existing Families

  **The Literalist Genetic-Code View**
  This view treats the genome as a digital text containing instructions. It scores highly on the **Arbitrariness Constraint**, successfully distinguishing the genetic code from protein folding physics. It also handles **Lineage L** well by acknowledging that a change in the code changes the semantic content of the DNA. However, it fails **Contextual Completeness**. It tends to treat the DNA as the sole locus of information, struggling to account for splicing and epigenetic inheritance without ad hoc additions. It often collapses under the **Underdetermination Constraint**, implicitly assuming a more deterministic relation between genotype and phenotype than exists.

  **Deflationary Causal or Parity Views**
  These views argue that DNA is just one cause among many, and calling it 'information' is no different than calling a spark 'information' for a fire. They excel at **Causal Completeness**, acknowledging the necessity of the cellular environment. However, they fail the **Arbitrariness Constraint** completely. By collapsing the distinction between coded relations and chemical necessities, they render the term 'information' explanatorily redundant. They cannot explain why biologists manipulate DNA to programme cells but do not manipulate cytoplasm in the same way. They dissolve the phenomenon rather than explaining it.

  **Teleological-Selection-Based Views**
  This camp grounds information in the history of natural selection: a state carries information if it has the proper function of indicating or producing a result due to past selection. This handles the **Environmental Cue** well, distinguishing reliable cues from signals based on evolutionary history. It also manages **Heredity without sequence** by allowing any selected trait to carry information. However, it struggles with **Lineage L** and **Regress**. If the function of the machinery is to interpret the DNA, what grounds the function of the machinery itself? It risks an infinite regress of selected interpreters. Furthermore, it can be slow to accommodate novel mutations that have no selection history yet clearly carry informational content in the present system.

  **Developmental-Systems Views**
  This approach treats the entire developmental matrix as the unit of inheritance and information. It satisfies **Contextual Completeness** and **Heredity without sequence** perfectly, granting informational status to epigenetic and structural factors. It also handles the **Reaction Norm** naturally. However, it fails the **Arbitrariness Constraint** by levelling the distinction between DNA and other factors. If everything in the developmental system is 'information', the term loses its specific utility for molecular biology. It explains the *process* of development well but fails to justify the specific explanatory privilege granted to the genome in laboratory practice.
