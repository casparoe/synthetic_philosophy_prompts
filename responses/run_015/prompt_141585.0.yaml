answer: |-
  **JOINT STATEMENT ON PERSISTENCE AND ONTOLOGY**

  **1. Agreed Claims**
  1.  **Real Change:** Change requires that a single subject instantiates incompatible intrinsic properties at different times without contradiction.
  2.  **Non-Relational Properties:** Temporary properties (e.g., shape) are not merely relations to times but reflect the object's actual qualitative state.
  3.  **Coincidence:** Numerically distinct objects can share all spatial parts and location at a time (e.g., statue and clay), implying persistence conditions differ from composition conditions.
  4.  **Fission Indeterminacy:** In symmetric fission cases, identity claims may lack a determinate truth value independent of linguistic stipulation.
  5.  **Explanatory Goal:** A theory of persistence must explain how temporal diversity coexists with diachronic unity without denying the reality of either.

  **2. Position Restatements**
  *   **Endurantist:** Persisting objects are three-dimensional entities wholly present at every moment of their existence. An object's location at a time is a primitive relation, not analyzable as having a part there. When an object persists, it is strictly numerically identical across the times it occupies.
  *   **Perdurantist:** Persisting objects are four-dimensional spacetime wholes composed of distinct temporal parts. An object exists at a time by having a part at that time. When an object is *F* at *t*, this is analyzed as the object's *t*-part being *F* simpliciter.

  **3. Residual Disagreements**

  | Crux | Endurantist Formulation | Perdurantist Formulation | Case/Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Temporary Intrinsics** | *O is F at t* is primitive; identity is strict. | *O is F at t* via *O*-at-*t*; identity is gen-identity. | **(A) Splicing:** O's segment swapped with O*. | **End:** O survives if functional continuity holds; identity indeterminate without stipulation.<br>**Per:** O ceases at swap; distinct worms exist thereafter. Determinate based on spatiotemporal continuity. |
  | **Structure of Time** | Time is a container for wholly present wholes. | Time is a dimension of parts within a manifold. | **(B) Successor Physics:** Privileged global simultaneity restored. | **End:** Helps; privileges the "wholly present" slice as ontologically fundamental.<br>**Per:** Untouched; worms exist regardless of slicing. Reveals endurance relies on time's structure, perdurance does not. |
  | **Ontological Commitment** | Temporal parts overpopulate the world. | Temporal parts are inevitable for coherence. | **Analogy:** Space/Time location disanalogy. | **End:** Load-bearing; objects locate in time differently than space.<br>**Per:** Heuristic only; location in time is having a temporal part, analogous to spatial parts. |

  **4. Note on Merely Verbal Disputes**
  Both parties acknowledge that portions of the historical dispute were merely verbal, specifically regarding the definition of "part" and "object." When the Endurantist says "O has no temporal parts," they mean O is not composed of entities existing only at instants. When the Perdurantist says "O has temporal parts," they mean O extends across time as it does across space. Both agree on the spacetime distribution of matter and qualities; the disagreement concerns whether to categorize the fundamental bearer of properties as a 3D entity located at times or a 4D entity extended across times. This is verbal insofar as both descriptions map onto the same physical reality, but substantive insofar as they entail different logical constraints on identity and composition.

  Bottom line: The dispute remains substantive over whether diachronic identity is a primitive relation between wholly present objects or a derivative unity of temporal parts within a spacetime whole.
