      *   Does Campbell's Law apply? Yes, specifically regarding the distortion of the "social process" (writing/reading).
      *   Is the user "being precious"? No. The concern is structurally valid. The metric measures *continuation*, not *satisfaction* or *artistic merit*. A page-turner thriller and a profound tragedy might have different natural drop-off rates. Optimizing for completion inherently biases against difficulty, ambiguity, and pacing that requires patience.

