answer: |-
  **Activity: The Allocation Game**

  **Setup & Rules**
  **Players:** 5 Volunteers (V1–V5), 13 Planners (rest of class).
  **Materials:** 5 Envelopes (Secret Wealth + Secret Taste), 3 Snack Bars (Chocolate, Chips, Candy), 1 Homework Pass, Play Money (unequal amounts).
  **Round 1 (Auction):** Volunteers bid play money on the Homework Pass. Highest bidder wins.
  **Round 2 (Allocation):** Volunteers write a "Happiness Score" (1–10) for each snack. Planners allocate snacks to maximize the sum of scores.
  **Round 3 (Swap):** Volunteers hold their won/assigned items. Ask sequentially: "Would you swap your entire bundle with [Neighbor]?"
  **Constraint:** Do not say "utility" or "comparison" until the reveal.

  **Payoff & Multiplier Scheme**
  *Pre-load envelopes.*
  *   **V1:** $100 Play Money. Low Taste for Pass (2 utils). Low Hunger.
  *   **V2:** $10 Play Money. High Taste for Pass (10 utils). High Hunger.
  *   **V3:** Holds Chips. Preference Card: "I want Candy."
  *   **V4:** Holds Candy. Preference Card: "I want Chocolate."
  *   **V5:** Holds Chocolate. Preference Card: "I want Chips."
  *   **Planners:** Given ledger to sum "Happiness Scores."

  **Timeline (55 Minutes)**
  *   **0–5:** Intro. Select volunteers. Hand envelopes. Explain rules.
  *   **5–20:** **Auction.** V1 likely outbids V2 despite lower valuation. Planners observe.
  *   **20–35:** **Allocation.** Volunteers submit scores. Planners debate distribution. (e.g., V2 claims 10/10 for chocolate, V1 claims 5/10).
  *   **35–45:** **Swap Test.** Ask V3, then V4, then V5 if they will swap with the next person. Record the "Yes" chain.
  *   **45–55:** **Reveal & Debrief.** Open envelopes. Reveal multipliers, wealth, and preference cards. Say the phrase "interpersonal comparison of utility."

  **Debrief & Questions**
  *Map moments to insights. Do not lecture; ask.*

  1.  **WTP vs. Wealth (Round 1):**
      *   *Observation:* V1 won the pass.
      *   *Question:* "V1 won. Looking at the reveal, did V1 want it more than V2?"
      *   *Follow-up:* "If the bid didn't measure desire, what did it measure?" (Target: Buying power).
      *   *Point:* Willingness to pay tracks wealth as much as intensity.

  2.  **The Swap Cycle (Round 3):**
      *   *Observation:* V3 wants V4's bundle, V4 wants V5's, V5 wants V3's.
      *   *Question:* "V3 thinks V4 is better off. V4 thinks V5 is better off. V5 thinks V3 is better off. Who is actually best off?"
      *   *Follow-up:* "If we can't rank them consistently, can we say who gains more from a policy?"
      *   *Point:* Swap tests mix situation quality with personal taste; no consistent ordering exists.

  3.  **Marginal vs. Total (Round 2):**
      *   *Observation:* V2 had higher scores for snacks (marginal gain) but less wealth overall.
      *   *Question:* "V2 would have enjoyed the snack more than V1. But looking at their total wealth and bundles, is V2 still worse off overall?"
      *   *Follow-up:* "Can we answer who gains more from *this* snack, but not who is happier *in life*?"
      *   *Point:* Marginal gain is answerable; overall well-being is not.

  **Caveats & Troubleshooting**
  *   **Predictable Failure:** V3–V5 might refuse to swap due to spite or confusion.
      *   *Fix:* Instruct them privately: "Play your preference card honestly." If the cycle breaks, ask the class: "What if they *had* swapped? Would the ranking hold?"
  *   **The "Known Multiplier" Gap:** In the game, we open the envelopes and know the "true" utils. In reality, nobody knows another's utility.
      *   *Does this ruin the analogy?* No. It highlights the deepest problem. If we struggle to aggregate values even *with* perfect information (as seen in the Swap Cycle), it is impossible without it. Use this: "We knew the numbers today and still couldn't agree on who was better off. Imagine doing this blind."
  *   **Stakes:** Play money feels fake.
      *   *Fix:* Ensure the Homework Pass is real. The anxiety of losing real privileges mimics economic pressure better than fake cash.
  *   **Dominance:** V1 might dominate the auction too obviously.
      *   *Fix:* Cap bids or give V2 a slight cash boost if V1 is too aggressive, ensuring the conflict remains visible.

  **Final Note:** The goal is not to solve the problem, but to make the room feel the silence where the math should be.
