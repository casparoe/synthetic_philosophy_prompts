  3.  **Analyze the Disagreement Structure:**
      *   *Empirical?* Both sides agree on the neuroscience and the lesioning data. Lesioning the substrate removes the symbol. This is consistent with both views. Side A says the symbol *is* a higher-level pattern that constrains the substrate (like software constraining hardware). Side B says the symbol is just a description of the substrate. An experiment measuring physical forces won't help because Side A doesn't claim "magic energy" from symbols, but rather "constraint-based causation" or "informational causation." Side B claims all causation is micro-physical.
      *   *Verbal?* Possibly. Definitions of "cause," "push," and "symbol" are crucial. If "push" means "transfer energy," Side B wins (symbols have no mass/energy). If "push" means "constrain state space" or "determine trajectory via feedback loops," Side A might have a point.
