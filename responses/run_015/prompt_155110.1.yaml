      *   This terminology comes directly from Douglas Hofstadter's *I Am a Strange Loop* (and earlier *Gödel, Escher, Bach*). The "careenium" is a hypothetical billiard-table-like system with bumpers and marbles (simmballs) used to illustrate the relationship between physical substrate and symbolic representation.
