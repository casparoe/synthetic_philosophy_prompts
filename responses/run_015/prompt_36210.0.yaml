  *   **No** → Go to 3.
  *   **Yes** → *Leaf A: Responsibility-Sensitive Liberalism* (Variant of Thomsonian).

  **3. Action Type:** Is unplugging the violinist *killing* them or *letting them die*?
  *   **Letting Die** → *Leaf B: Thomsonian Bodily-Autonomy Liberalism*.
  *   **Killing** → *Leaf C: Justified-Killing Liberalism* (Variant of Thomsonian).

  **4. Early Status:** Is aborting a one-month fetus (size of a lentil, no brain activity) wrong?
  *   **No** → Go to 5.
  *   **Yes** → Go to 7.

  **5. Late Status:** Is aborting a nine-month fetus (fully developed, ready for birth) wrong?
  *   **No** → *Leaf D: Absolute Liberalism* (Rare; overlaps with Thomsonian).
  *   **Yes** → Go to 6.

  **6. Gradient:** Is the late abortion *worse* than the early one, or are they simply different (one wrong, one not)?
  *   **Simply Different (Binary)** → *Leaf E: Psychological-Capacities Liberalism*.
  *   **Worse (Scalar)** → *Leaf F: Gradualist View*.

  **7. Wrongness Source:** Is killing wrong because of what is *lost* (a future) or what the being *is* (its nature/state)?
  *   **What is Lost** → Go to 9.
  *   **What It Is** → Go to 8.

  **8. Nature Condition:** If it matters what the being *is*, does it need a working brain to matter?
  *   **Yes** → *Leaf E: Psychological-Capacities Liberalism* (Reached via Duty path).
  *   **No** → *Leaf G: Strict Sanctity-of-Life Opposition*.

  **9. Loss Subject:** If it matters what is *lost*, is there a specific subject at the single-cell stage?
  *   **No** → *Leaf H: Consistent Deprivationism* (Contraception permissible).
  *   **Yes** → Go to 10.

  **10. Contraception:** If preventing a future is wrong, is contraception wrong?
  *   **No** → *Leaf I: Marquis-style Deprivationism*.
  *   **Yes** → *Leaf J: Extreme Consistency View* (Contraception impermissible).

  ***

  (2) "Unoccupied branches"

  *   **1(No) → 4(Yes):** Incoherent; if bodily autonomy overrides the violinist's right to life, it should override the fetus's unless a relevant difference (like responsibility) is admitted at Node 2.
  *   **7(Loss) → 9(No) → 4(Yes):** Incoherent; if there is no subject at conception to suffer a loss, early abortion cannot be wrong on deprivationist grounds.
  *   **7(State) → 8(Yes):** Unattractive; this collapses the "Nature" view into the Psychological view, rendering the "State" branch redundant for Sanctity positions.
  *   **1(Yes) → 5(No):** Unexplored; this implies a duty to sustain early life but no duty to sustain late life, which reverses the typical developmental moral intuition.

  ***

  (3) "What the tree cannot separate"

  *   **Thomsonian Personhood Believers vs. Thomsonian Non-Personhood Believers:** Once a student answers "No" at Node 1, the tree stops asking about the fetus's internal properties, so it cannot distinguish those who think fetuses are persons but autonomy trumps from those who think fetuses aren't persons.
  *   **Marquis-style Deprivationism vs. Future-Like-Ours Variants:** Any view that locates wrongness in the loss of a valuable future without a subject at conception leads to Leaf I, regardless of the specific metaphysical account of "future-like-ours."
  *   **Strict Sanctity (Religious) vs. Strict Sanctity (Secular):** Both answer "What It Is" and "No Brain Required" identically, so the tree cannot distinguish between theological sanctity and secular species-membership views.
