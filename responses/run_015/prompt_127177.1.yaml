answer: |-
  This is an excellent strategic move for a seminar. Your classmate is deploying a rhetorical slogan that conflates metaphysics, normative ethics, and welfare economics. By disentangling these strands, you can show that his "knock-down objection" is either a trivial truth that implies nothing about policy, or a substantive (and controversial) ethical claim that requires defense.

  Here is a disambiguation of the slogan **"Future people don't exist yet, so there's nothing to discount,"** broken down by the four categories you requested.

  ---

  ### (i) Metaphysical Readings: Ontology of Future Persons
  **The Claim:** Future individuals lack ontological status *now*, and therefore cannot bear properties (like "being harmed") *now*.

  *   **Presentism:** Only present entities exist. Future people are literally nothing until they come into being.
  *   **Eternalism (Block Universe):** Past, present, and future entities all exist tenselessly. Future people exist *simpliciter*, just not *now*.
  *   **The "Time of Harm" Distinction:** Even if they don't exist *now*, they will exist *then* (in the 23rd century). If we emit carbon *now* that causes heat stress *then*, the victim exists at the time of the suffering.

  | Evaluation | Implication for Debate |
  | :--- | :--- |
  | **Platitude (with caveats):** It is trivially true that future people do not exist *now*. It is **false** (or at least highly controversial) to imply they have no ontological status *at all* or cannot be subjects of predicates at the time they *do* exist. | **Leaves Debate Untouched.** Metaphysics of time does not dictate moral standing. We routinely acknowledge duties regarding future outcomes (e.g., trust funds, wills) based on the expectation of future existence. Unless your classmate argues that *only* presently existing things have moral value (which would rule out planning for next year, too), this reading fails to license his dismissal of obligations. |

  ### (ii) Normative Readings: The Person-Affecting Constraint
  **The Claim:** Moral obligations must be owed *to* someone. If there is no specific subject to whom a duty is owed, there is no duty. This is the **Person-Affecting View**.

  *   **Actualism:** Only actually existing beings count as moral patients.
  *   **The Non-Identity Problem (Parfit):** Climate policy changes *who* will be conceived (by altering social conditions, travel, meetings, etc.). If we mitigate, a different set of people exists in the 23rd century than if we don't. Therefore, the 23rd-century people who *do* exist cannot claim we harmed them; without our emissions, they wouldn't exist at all.
  *   **Possible Persons:** Do merely possible people (who would exist under different policies) have moral standing?

  | Evaluation | Implication for Debate |
  | :--- | :--- |
  | **Defensible Substantive Thesis:** The Person-Affecting View is a respected position in population ethics, though controversial. The Non-Identity Problem is a genuine philosophical puzzle. However, it is **false** to treat this as a settled "knock-down" objection; many ethicists reject the Person-Affecting View in favor of Impersonal Views (e.g., "It is bad if people suffer, regardless of *which* people"). | **Licenses Dismissal (conditionally).** This is the only reading that supports your classmate's specific conclusion that we owe nothing *to them as particular beneficiaries*. However, it concedes the **Impersonal** obligation: we still owe it to "the universe" or "morality" not to create a suffering-filled future. It shifts the justification from *rights* to *badness*, but rarely changes the policy prescription. |

  ### (iii) Axiological & Economic Readings: Discounting Welfare
  **The Claim:** "There's nothing to discount." This phrase is technically ambiguous in economics and ethics.

  *   **Pure Time Preference (PTP):** Discounting welfare simply because it occurs later in time. (Ramsey called this "ethically indefensible").
  *   **Existence Probability:** Discounting because there is a chance humanity goes extinct before the 23rd century (no one is there to suffer).
  *   **The Conflation:** Your classmate seems to mean "There is no subject to apply the discount function to" (Zero Weight). Standard climate ethics (e.g., Stern Review) argues "There is a subject, and we should apply **zero** pure time preference" (Full Weight).

  | Evaluation | Implication for Debate |
  | :--- | :--- |
  | **False / Confused:** If he means "We should not apply a pure time preference," he is arguing **for** strong mitigation (Stern/Ramsey). If he means "Future welfare has zero weight," that is a normative claim, not an axiological one. You cannot derive "zero weight" from "non-existence now" without assuming Actualism (see ii). | **Strengthens Case for Action.** If interpreted charitably as "We should not discount future welfare merely because it is future," this slogan is the standard argument *for* aggressive climate mitigation. If interpreted as "Zero Weight," it is a radical normative claim that requires justification beyond the slogan. |

  ### (iv) Practical Inference: Generic vs. Specific Duty
  **The Claim:** We may have a duty to keep the world habitable (generic), but no duty *to the 23rd-century individuals* (specific).

  *   **Deontic Logic:** Does the distinction between *owed to X* and *obligatory that X* matter for action?
  *   **The "Rightful Claim" Objection:** Your classmate suggests that without a specific rights-holder, the obligation is weaker or non-enforceable.

  | Evaluation | Implication for Debate |
  | :--- | :--- |
  | **False Inference:** Even if the Non-Identity Problem holds (no specific victim), the **outcome** is still morally evaluable. A world with massive suffering is worse than one without, regardless of the identity of the sufferers. Most policy frameworks (utilitarian, prioritarian, capabilities approach) care about welfare levels, not just rights-violations. | **Leaves Debate Untouched.** For the purpose of setting carbon budgets, it does not matter whether the duty is grounded in *their right to clean air* or *our duty not to create a hellscape*. The mitigation target remains the same. Distinguishing the grounding is philosophically interesting but practically inert regarding the budget. |

  ---

  ### Summary for Seminar Deployment

  You can present this to your seminar as a **"Four-Way Ambiguity Check."** When your classmate invokes the slogan, ask him which of the following he means:

  1.  **Metaphysical:** "Are you saying future people are ontologically unreal?" (If yes, ask if he plans for his own retirement, which relies on a future self that doesn't exist yet.)
  2.  **Normative:** "Are you invoking the Non-Identity Problem to deny person-affecting harm?" (If yes, concede the point but note that **Impersonal Harm** still mandates mitigation.)
  3.  **Axiological:** "Do you mean we should assign zero weight to future welfare, or that we shouldn't apply a *discount rate*?" (If the latter, he is accidentally arguing *for* strong mitigation.)
  4.  **Practical:** "Does the distinction between a 'generic duty' and a 'specific duty' change the carbon budget?" (If no, the objection is irrelevant to policy.)

  **The "Kill Shot" Argument:**
  The strongest response is to point out that his slogan conflates **Discounting** (an economic adjustment for time/risk) with **Exclusion** (a moral denial of standing).
  *   If future people don't exist *yet*, we still act on their behalf in almost every other domain (nuclear waste storage, infrastructure, debt).
  *   If the objection is the **Non-Identity Problem**, remind the class that Parfit himself did not conclude "therefore, do nothing." He concluded "therefore, we need a better moral theory than the Person-Affecting View."
  *   Therefore, the slogan is either a **platitude** (they aren't here yet) that implies nothing, or a **controversial ethical thesis** (Person-Affecting View) that fails to justify inaction.

  **Recommendation:** Frame his point not as a refutation of climate obligations, but as a specific challenge in **Population Ethics**. This validates his philosophical instinct while neutralizing its practical force.
