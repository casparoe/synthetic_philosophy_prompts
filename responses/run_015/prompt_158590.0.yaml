  **Joint Statement on Speaker Meaning and Institutional Context**
  **Adversarial Colaboration Draft – Oxford Workshop 2024**

  **Participants:**
  **Camp A:** The Pure Intentionalists
  **Camp B:** The Institutional Defaultists

  **Introduction**
  We met over two days to hash out where Gricean pragmatics meets formal institutional practice. While we started quite far apart, we managed to isolate exactly where the friction lies. Below is the record of what we agree on, where we diverge, and the specific test cases we've identified to settle the matter empirically or conceptually. There's still work to do, but this map should help future reseach avoid talking past one another.

  **1. Agreed Claims**
  Both camps accept the following foundational premises as the starting point for this debate:

  1.  **Saying vs. Implicating:** Grice's distinction between what is said (truth-conditional content) and what is implicated (pragmatic inference) is valid and necessary for analysis.
  2.  **Cancellability:** Genuine implicatures are cancellable without contradiction; if a meaning cannot be cancelled, it is likely part of what is said or conventionally encoded.
  3.  **Audience-Directedness:** Speaker meaning is not merely causal; it essentially involves an orientation towards an audience (even if that audience is oneself or a hypothetical observer).
  4.  **Rational Cooperation:** The Cooperative Principle (CP) accurately describes the default rational framework for ordinary conversation, wherein participants mutually adjust their contributions for shared purpose.
  5.  **Non-Natural Meaning:** At some level, meaningful communication involves more than just natural signs (like smoke meaning fire); it involves agents deploying signs for a purpose.

  **2. Table of Disagreements**
  The following table outlines the core disputes. We have phrased these neutrally so that both sides recognise their own position in the contrast.

  | Issue | Neutral Description of the Dispute | Camp A (Pure Intentionalist) Stance | Camp B (Institutional Defaultist) Stance |
  | :--- | :--- | :--- | :--- |
  | **Constitution of Meaning** | Does speaker meaning require the hearer to recognise a specific psychological intention, or can role-based conventions constitute meaning independently? | Meaning is *always* constituted by the recognition of an m-intention. | In formal settings, meaning can be constituted by institutional rules even without specific intention recovery. |
  | **Role of Convention** | Are conventions merely shortcuts for recovering intentions, or do they sometimes replace the need for intention altogether? | Conventions are heuristic shortcuts; the intention is still the logical ground. | Conventions can be constitutive; the role carries the meaning when the individual mind is opaque. |
  | **Scope of Cooperation** | Does the Cooperative Principle apply universally to all discourse, or can it be locally suspended by institutional norms? | The CP is always the underlying baseline; deviations are themselves meaningful signals. | Institutional maxims (e.g., adversarial rules) can suspend the CP entirely within that context. |

  **3. Cruxes and Advance Predictions**
  We identified three specific scenarios where our theories yield different results. We have recorded our predictions here to check against future intuition pumps or empirical data.

  **Crux 1: The Silent Assent Protocol**
  *   **Hypothetical Case:** A university committee is voting on a motion. The Chair states, "If there are no objections, we will take this as agreed." There is a pause. All members remain silent, looking at their papers. The Chair declares, "It is agreed."
  *   **The Question:** Does the silence constitute speaker meaning (i.e., "I agree") generated by the members, or is it merely a procedural trigger?
  *   **Camp A Prediction:** There is no *speaker meaning* here in the Gricean sense. The members may have an intention, but without an overt act designed to secure recognition of that intention, it is merely a causal trigger defined by rules. It's behaviour, not communication.
  *   **Camp B Prediction:** This *is* speaker meaning, constituted by the institutional convention. The members occupy a role where silence is defined as assent. The meaning exists regardless of whether the Chair recovers a specific psychological state from each member.

  **Crux 2: The Double-Key Implicature**
  *   **Hypothetical Case:** A peer reviewer writes in a report: "The sample size is adequate." In their field, this phrase is conventionally understood to mean "The study is passable but not excellent." The reviewer intends this meaning, knowing the convention exists.
  *   **The Question:** Is the meaning carried by the reviewer's individual intention utilising the convention, or by the convention itself utilising the reviewer?
  *   **Camp A Prediction:** It is reducible to pure intention. The convention is just a shared code. If the reviewer didn't intend the conventional reading (e.g., they were ironic), the meaning would change. The intention is the master key.
  *   **Camp B Prediction:** It is genuinely hybrid. The institutional convention locks in the meaning even if the reviewer's specific mental state is ambiguous. The role of 'reviewer' forces the interpretation regardless of private nuance.

  **Crux 3: Suspension of the Cooperative Principle**
  *   **Hypothetical Case:** During a criminal cross-examination, a barrister asks, "Were you at the scene?" The witness knows the barrister already has CCTV footage proving they were there. The witness says "No."
  *   **The Question:** Is the witness violating the Cooperative Principle (lying/maxim of quality), or are they operating under a different institutional maxim (e.g., 'avoid self-incrimination') that suspends the CP?
  *   **Camp A Prediction:** The CP is not suspended; it is merely warped. The witness is still communicating intentionally. The implicature is "I am exercising my right to defend myself," which is still a cooperative move in the broader legal game.
  *   **Camp B Prediction:** The CP is locally suspended. The institutional maxim of 'adversarial procedure' overrides the maxim of Quality. The utterance isn't meant to cooperate on truth; it's meant to fulfil a procedural role. Meaning here is defined by the rules of evidence, not rational cooperation.

  **Sign-off**
  We agree to disagree on these points for now, but we commit to using these cases as the benchmark for any future papers coming out of this grup.

  *Signed,*
  *The Workshop Convenors*
