prompt: |-
  i need a prompt for my philosophical dataset — this one should be an adverserial collaboration draft about grice on implicature and speaker meaning.

  the two camps are: camp a, the 'pure intentionalists', who hold that speaker meaning is always just grice's analysis of non-natural meaning with the cooperative principle doing all the pragmatic work, and that no conventional shortcut can replace recognition of an m-intention; and camp b, the 'institutional defaultists', who hold that in formal discursive settings — peer review, legal testimony, committee voting — speaker meaning is partly constituted by role-based conventions that can operate even when the hearer doesn't recover a specific individual intention.

  draft the joint statment they'd sign. structure: first a numbered list of agreed claims (e.g. that grice distinguishes saying from implicating, that implicatures are cancellable, that speaker meaning requires audience-directedness, that the cooperative principle describes rational conversation); then a table of disagreements phrased in neutral wording so each side recognises its own view; then three cruxes.

  the cruxes i want are: (1) the 'silent assent protocol' — in a committee where members remain silent to signal agreement, does this generate speaker meaning without an explicit m-intention? (2) the 'double-key implicature' — cases where a speaker relies on both an institutional convention and an individual intention; is this reducible to pure intention or pure convention, or is it genuinely hybrid? (3) whether the cooperative principle can be locally suspended by institutional maxims (e.g. in adversarial legal cross-examination).

  for each crux, include a concrete hypothetical case both sides agree is relevant, and record each camp's advance prediction about what the correct analysis should show.

  please write in british english. keep the tone casual — a typo or two is totally fine. and don't ask for referneces, bibliographys, or reading lists; the answer should come from reasoning, not from looking things up.
