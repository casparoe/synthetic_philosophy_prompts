  # Seminar Handout: The Uncertain Evidence Decision Tree

  **Instructions:** This instrument sorts positions on how to update when experience shifts your credences without making anything certain. Answer each question based on your intuitions about the cases described. Do not worry about the names of the rules; focus on the verdicts.

  ### The Instrument

  **Q1. The Certainty Intuition (Warm-up & Case 2)**
  In the cloth-by-candlelight case, your credence that the cloth is green shifts to 0.7. Is there *any* proposition you become certain of (credence 1) in this process—for example, "the cloth looks green to me" or "I had a greenish experience"?
  *   **(A) Yes:** I become certain of *something* (even if only about my experience). → **Go to Leaf 1.**
  *   **(B) No:** My evidence is thoroughly uncertain; nothing goes to 1. → **Go to Q2.**

  **Q2. The Scope of Revision (Case 6)**
  Consider three inputs: (1) "Suppose the cloth is green," (2) "If the cloth had been green," and (3) "I looked and it seemed green." Should a single updating rule cover all three, or is perceptual learning a distinct species from supposition and counterfactuals?
  *   **(A) Single Rule:** One framework should handle all three. → **Leaf 2.**
  *   **(B) Distinct Rules:** Perceptual updating has unique features not shared by supposition. → **Go to Q3.**

  **Q3. The Informational Input (Case 2)**
  In the half-heard message case, you end up 0.7 confident the word was "green." But the transmission process is correlated with defectiveness. Does the *process* that generated your uncertainty (the likelihood of hearing "green" given the state) carry information beyond just the final 0.7 credence?
  *   **(A) Yes:** The likelihood of the experience matters independently of the new credence. → **Leaf 3.**
  *   **(B) No:** Only the new credences over the partition matter; the process is irrelevant. → **Go to Q4.**

  **Q4. Partition Sensitivity (Case 1)**
  You describe the cloth experience over a fine partition {Green, Blue, Violet} and a coarse partition {Green, Not-Green}. The rigidity formula gives different posterior results for the hypothesis "this is synthetic." Should the rational output differ based on how you carve the partition?
  *   **(A) Yes:** The partition choice changes the rational result. → **Leaf 4.**
  *   **(B) No:** The rational result should be invariant to the description. → **Go to Q5.**

  **Q5. The Selection Principle (Minimization vs. Preservation)**
  Given that you are not certain of anything, how is the new belief state selected? Do you choose the state that preserves your old conditional probabilities (rigidity), or the state that minimizes the "distance" or information gain from your old state?
  *   **(A) Preserve Conditionals:** Keep $P_{old}(H|E)$ fixed. → **Leaf 5.**
  *   **(B) Minimize Distance:** Change the total view as little as possible. → **Leaf 6.**

  **Q6. Path Dependence (Case 3)**
  You receive two uncertain shifts back-to-back (one on color, one on material). Doing them in order A-then-B lands you in a different place than B-then-A. Is this path-dependence a fatal flaw (reductio) of the rule, or an acceptable feature of sequential learning?
  *   **(A) Fatal Flaw:** Rational updating must be commutative; the rule is broken. → **Leaf 7.**
  *   **(B) Acceptable:** Order matters in learning; the rule stands. → **Go to Q7.**

  **Q7. Conceptual Prerequisites (Case 5)**
  In the implant case, a subject sees a color for which she has no antecedent concept (no cell in her prior partition). Can she rationally update her beliefs based on this experience?
  *   **(A) No:** You cannot update on what you cannot antecedently conceive. → **Leaf 8.**
  *   **(B) Yes:** Experience can expand the conceptual space. → **Go to Q8.**

  **Q8. Reflection and Future Credence (Case 4)**
  A trusted neurologist tells you that in one hour your credence that the cloth is green will be 0.7. This is evidence about your future state, not the cloth. Is this a distinct type of input that standard uncertain-evidence rules fail to capture?
  *   **(A) Yes:** This requires a distinct principle (e.g., Reflection). → **Leaf 9.**
  *   **(B) No:** This is just another constraint that should be handled by the general rule. → **Leaf 10.**

  ***

  ### Map of Positions (The Leaves)

  1.  **The Dogmatist (Plain Conditionalization):** You answer **Q1(A)**. You hold that evidence always confers certainty on some proposition (perhaps about the experience itself). Plain conditionalization suffices for all cases.
  2.  **The Unifier (Unified Revision Theory):** You answer **Q1(B), Q2(A)**. You seek a single logic of revision (e.g., AGM-style or generalised imaging) that treats "seeming," "supposing," and "counterfactuals" as instances of the same structural operation.
  3.  **The Likelihoodist (Likelihood-Based Updating):** You answer **Q1(B), Q2(B), Q3(A)**. You hold that the input to updating is not just the new credence in the evidence, but the likelihood of the evidence given the hypotheses (handling Case 2's correlation).
  4.  **The Relativist (Partition-Dependent):** You answer **Q1(B), Q2(B), Q3(B), Q4(A)**. You accept that rational posteriors vary depending on how the agent partitions the possibility space. *(See Diagnosis Below).*
  5.  **The Rigidifier (Jeffrey Conditioning):** You answer **Q1(B), Q2(B), Q3(B), Q4(B), Q5(A)**. You endorse the standard rigidity formula: preserve old conditional probabilities given the new partition credences.
  6.  **The Minimalist (Minimum Information):** You answer **Q1(B), Q2(B), Q3(B), Q4(B), Q5(B)**. You justify the update by minimizing cross-entropy or information distance subject to the new constraints.
  7.  **The Commutativist (Path-Strict Skeptic):** You answer **Q1(B)... Q6(A)**. You reject standard uncertain-evidence rules because they fail to commute in sequential cases (Case 3).
  8.  **The Conceptualist (Concept-Closed):** You answer **Q1(B)... Q7(A)**. You hold that the framework of probabilistic updating breaks down when the agent lacks prior concepts for the experience (Case 5).
  9.  **The Reflectionist (Future-Credence Handler):** You answer **Q1(B)... Q8(A)**. You argue that evidence about future credences (Case 4) requires a principle distinct from worldly evidence updating.
  10. **The Skeptic (Underdetermination):** You answer **Q1(B)... Q8(B)**. You hold that the inputs provided in uncertain cases (new credences without certainty) do not uniquely determine a rational output.

  ***

  ### Instrument Analysis & Logical Space

  **The Collapse Flag: Leaves 5 and 6**
  Your student is correct. In the standard logical space where the input is defined as a set of new credences over a fixed partition, **Leaf 5 (Rigidifier)** and **Leaf 6 (Minimalist)** cannot be separated. Minimizing cross-entropy (KL divergence) subject to the constraint that the new partition probabilities match the input *mathematically yields* the Jeffrey conditioning formula.
  *   **Diagnosis:** These are not distinct positions in terms of output; they are distinct *justifications* for the same formula. They collapse into one extensional position on the cases provided. If a student selects different paths here, they are distinguishing motivations, not verdicts.

  **The Empty Leaf Diagnosis: Leaf 4 (The Relativist)**
  *   **Diagnosis:** This combination is logically coherent but epistemologically unattractive and virtually unoccupied. It implies that rational belief about the "synthetic fiber" hypothesis depends on whether the agent describes the color evidence as {Green, Not-Green} or {Green, Blue, Violet}. Most formal epistemologists view this as a bug (the "partition problem"), not a feature.

  **Other Unoccupied/Unstable Combinations**
  *   **The "Certain but Likelihood-Sensitive" Gap:** There is no leaf for someone who answers **Q1(A)** (Certainty) but **Q3(A)** (Likelihoods matter). If you are certain of a proposition, standard Bayes rule applies; likelihoods of the *process* are usually screened off by the certainty of the proposition itself. This space is empty because certainty swallows the likelihood structure.

  ***

  ### Closing Note for the Instructor: Inconsistency Hotspots

  When running this live, watch for inconsistencies at **Q1** and **Q6**.

  1.  **Q1 (Certainty):** Students often answer **Q1(B)** ("I'm not certain of anything") intuitively, but then implicitly rely on **Leaf 1** logic in later cases (treating "seems green" as a fixed fact). If they say "No" to Q1 but later resist the Skeptic leaf, press them on what constrains the update if not certainty.
  2.  **Q6 (Path Dependence):** Students frequently endorse **Leaf 5** (Jeffrey Conditioning) in principle but answer **Q6(A)** (Path dependence is fatal). Since Jeffrey conditioning is inherently path-dependent, this is a direct contradiction. If they choose this pair, they are rejecting the rule they just endorsed. Use this to demonstrate the tension between *local* rationality (rigidity) and *global* coherence (commutativity).
