answer: |-
  # OMISION CAUSALITY CHECKLIST (OCC-v4)
  **Authority:** Lead Auditor, Infrastructure Consortium
  **Audience:** Engineering & Compliance Teams
  **Purpose:** Determine if a system failure to act (omission) counts as a **Reportable Cause** (triggers redesign) or a **Background Condition** (no redesign required).
  **Time Limit:** 30 Minutes per incident.

  ---

  ## PART 1: THE DECISION PROCEDURE

  **Instructions:** Answer the following questions in order. Do not skip steps. If a "STOP" command is issued, terminate the assessment and file the result indicated.

  ### STEP 1: Identify the Missing Action
  **Question:** What specific action did the system fail to perform?
  *   *Examples:* "Valve A did not close," "Sensor B did not transmit," "Pressure limit C was not maintained."
  *   *Requirement:* Must be a specific physical or digital action defined in system architecture.
  *   **Flag:** If the action is vague (e.g., "System did not behave safely"), pause. Define the specific mechanical or logical step required.

  ### STEP 2: The Required Action Standard (Baseline)
  **Question:** Is there a **current, documented design specification or protocol** that required this action at the time of the incident?
  *   *Evidence:* Design schematics, standard operating procedures (SOPs), or control logic diagrams valid on the date of the incident.
  *   **IF NO:** **STOP.** Classify as **Background Condition**. (The system was not expected to act; therefore, its silence is not a cause).
  *   **IF YES:** Proceed to Step 3.

  ### STEP 3: The Authorized Suspension Check (Operational Override)
  **Question:** Was the requirement identified in Step 2 legitimately suspended *before* the incident occurred?
  *   *Evidence:* Signed maintenance logs, formal reassignment orders, or "System Offline" status flags timestamped prior to the incident.
  *   *Note:* Verbal permission or informal agreements do **not** count as suspension.
  *   **IF YES:** **STOP.** Classify as **Background Condition**. (The expectation of action was formally removed; the omission is a non-event).
  *   **IF NO:** Proceed to Step 4.

  ### STEP 4: Classify the Duty Type
  **Question:** What was the function of the missing action?
  *   **Type A (Active Intervention):** The system was supposed to *interrupt* a developing chain of events (e.g., shut a valve, trigger an alarm, cut power).
  *   **Type B (Static Maintenance):** The system was supposed to *maintain* a steady state or barrier (e.g., hold pressure, keep a seal intact, sustain a temperature threshold).
  *   **Requirement:** Select one. This determines how Step 5 is applied.

  ### STEP 5: The Prevention Test (Counterfactual Necessity)
  **Question:** If the system had performed the action identified in Step 1, would the harm have been prevented or substantially reduced?
  *   **For Type A (Active Intervention):** Would the interruption have broken the causal chain before the point of no return? (e.g., Would closing the valve 2 seconds later have stopped the overflow?)
  *   **For Type B (Static Maintenance):** Would the correct setting/state have blocked the pathway entirely? (e.g., Would the correct pressure threshold have prevented the leak from starting?)
  *   *Evidence:* Simulation data, engineering physics models, or historical performance data.
  *   **IF NO:** **STOP.** Classify as **Background Condition**. (The action would not have changed the outcome).
  *   **IF YES:** Proceed to Step 6.

  ### STEP 6: Final Determination & Hand-Off Protocol
  **Question:** Are there any conflicts between the documented baseline (Step 2) and actual operational practice (e.g., informal management directives)?
  *   **IF NO:** **FILE AS REPORTABLE CAUSE.** (Mandatory redesign triggered).
  *   **IF YES:** **INITIATE HAND-OFF.**
      *   *Action:* Do not file the report yet. Flag for Legal/Leadership Review.
      *   *Reason:* This indicates a breakdown in governance (informal vs. formal rules). The auditor cannot resolve liability allocation between management directives and design documentation.

  ---

  ## PART 2: WARNING FLAGS (WHERE THE PROCEDURE MAY MISFIRE)

  1.  **Hindsight Bias in Step 5:** Auditors often assume an action *would* have worked because they know the failure happened. Require engineering sign-off on the "Prevention Test" simulation.
  2.  **The "Should Have Known" Trap:** Do not list an omission as a cause if the system lacked the *capacity* to detect the error, even if it was "expected" to. Capacity is a design fact; expectation is a normative baseline. Stick to Step 2.
  3.  **Informal Overrides:** Step 3 strictly requires documentation. In practice, operators often act on verbal orders. The procedure treats these as "No Suspension," which may feel unfair to operators but preserves the integrity of the design baseline. This friction is intentional but must be monitored.

  ---

  ## PART 3: CASE APPLICATIONS

  ### CASE 1: The Unresponsive Node
  **Scenario:** Chlorine-monitoring node fails to trigger shutdown valve during contamination spike. Valve design spec: respond within 2 seconds. Logs: no signal sent. Node status: Active/Normal.

  **Walkthrough:**
  1.  **Missing Action:** Valve failed to close upon signal trigger.
  2.  **Required Action Standard:** **YES.** Design spec mandates 2-second response.
  3.  **Authorized Suspension:** **NO.** Logs confirm node was Active/Normal. No maintenance flags.
  4.  **Duty Type:** **Type A (Active Intervention).** The valve was to interrupt the flow of contaminated water.
  5.  **Prevention Test:** **YES.** Engineering simulation confirms a 2-second closure would have contained the spike before it entered the main network.
  6.  **Final Determination:** **No conflicts.** Documentation matches practice.

  **Classification:** **REPORTABLE CAUSE.**
  **Decision Point:** Made at Step 6.
  **Evidence Required:** Design spec sheet, Incident logs, Simulation report.
  **Judgment:** Minimal. The facts align cleanly with the procedure.

  ---

  ### CASE 2: The Maintenance Mode Node
  **Scenario:** Same node type. Placed in "Maintenance Mode" by authorized technician 3 hours prior. Auto-shutdown disabled. No manual check performed. Contamination followed.

  **Walkthrough:**
  1.  **Missing Action:** Valve failed to close / Manual check failed to occur.
  2.  **Required Action Standard:** **YES (Initially).** Design spec mandates auto-shutdown.
  3.  **Authorized Suspension:** **YES.**
      *   *Evidence:* Maintenance log timestamped 3 hours prior. Technician ID verified. Status flag "Maintenance Mode" active in system.
      *   *Procedure Logic:* Step 3 states: "If YES: STOP. Classify as Background Condition."
      *   *Reasoning:* The design baseline was legitimately suspended. The system was not *expected* to act automatically at the time of the incident.

  **Classification:** **BACKGROUND CONDITION.**
  **Decision Point:** Made at Step 3 (Early Exit).
  **Hand-Off Note:** While the *node's omission* is not a cause, the **failure of the manual check** may be a separate human-resource issue. However, regarding the *automated infrastructure's causal attribution*, the omission is neutralized by the override.
  **Evidence Required:** Maintenance log, Authorization credentials.
  **Judgment:** Low. The existence of the log is a binary fact.

  ---

  ### CASE 3: The Informal Calibration Change
  **Scenario:** Pressure-safeguard system (Type-II) failed to hold threshold. Slow leak accumulated over days.
  **Complication:** Logs show safeguard was active but calibrated to a new, higher tolerance. Management approved this tolerance informally one week prior. Design documentation was **not** updated to reflect this change.

  **Walkthrough:**
  1.  **Missing Action:** System failed to maintain original pressure threshold.
  2.  **Required Action Standard:** **YES (Formally).** The *documented* design spec requires the original threshold.
      *   *Conflict:* Operational practice followed an informal management directive.
  3.  **Authorized Suspension:** **NO.**
      *   *Reasoning:* Step 3 requires "Signed maintenance logs, formal reassignment orders." An informal verbal or email approval from management does not meet the criteria for suspending the design baseline in the documentation system.
  4.  **Duty Type:** **Type B (Static Maintenance).** System was to hold a pressure threshold.
  5.  **Prevention Test:** **YES.** Had the original threshold been maintained, the leak would not have accumulated.
  6.  **Final Determination:** **CONFLICT DETECTED.**
      *   *Procedure Instruction:* Step 6 states: "If YES [conflicts between documented baseline and practice]: INITIATE HAND-OFF."

  **Classification:** **HAND-OFF TO LEGAL/LEADERSHIP.**
  **Decision Point:** Made at Step 6.
  **Evidence Required:** Original design docs, Logs showing new calibration, Evidence of management approval (emails, meeting notes).

  **Auditor's Analysis (The "Uncomfortable Answer"):**
  This case exposes the friction between the procedure's rigidity and organizational reality.
  *   **Option A (Strict Procedure):** If I ignore the informal approval and treat the documentation as the sole truth, the system is listed as a **Reportable Cause**. This forces a mandatory redesign on engineers who were following management's verbal orders. This is factually accurate regarding the *docs*, but institutionally unjust.
  *   **Option B (Acknowledging Reality):** If I treat the informal approval as valid, I must classify this as a **Background Condition** (expectation changed). However, the procedure (Step 3) explicitly forbids counting informal overrides. To do so would violate the audit protocol.

  **Why I Will Not Like This Answer:**
  The procedure forces me to trigger a **Hand-Off** rather than a clean causal determination. This delays the report and escalates a technical finding into a governance dispute. It highlights that management bypassed the safety documentation system.
  *   If I list it as a **Cause**, engineers are penalized for management's administrative failure.
  *   If I list it as **Background**, I validate a process where safety baselines can be changed without documentation, undermining the consortium's safety culture.

  The procedure correctly identifies that I, as an auditor, cannot resolve this. It is not a question of physical causation (the leak happened because the pressure was too high); it is a question of **liability allocation** (who is to blame for the undocumented change?). By forcing the Hand-Off at Step 6, the procedure protects me from making a policy decision, but it ensures the incident remains unresolved until leadership accepts responsibility for the informal approval process.

  **Decision:** Initiate Hand-Off. Do not file causal report until Leadership clarifies if the informal approval constitutes a valid Baseline Update retroactively.
