answer: |-
  The asymmetry you describe—between our willingness to defer to testimony regarding empirical facts and our reluctance to do so regarding moral judgments—is a central puzzle in contemporary meta-ethics and epistemology. This phenomenon is often categorized under the heading of **Moral Testimony Pessimism**. To analyze what this practice presupposes, we must distinguish between the *phenomenology* of the practice (how we actually behave), the *normative commitments* implicit in that behavior (what we think we ought to do), and the *meta-ethical theories* that might justify it.

  The practice does not strictly commit us to the claim that moral knowledge *cannot* be transmitted by testimony. Rather, it presupposes that moral belief plays a unique functional role in human agency that factual belief does not, necessitating a first-personal grasp of reasons. Consequently, the asymmetry is best understood not as a block on the transmission of truth, but as a normative demand for moral understanding and autonomy. However, this practice is philosophically underdetermined: distinct and incompatible meta-ethical theories can all license the same pattern of resistance.

  ### 1. Reconstructing the Implicit Epistemology

  The implicit epistemology of this practice rests on a distinction between **theoretical reason** (concerned with what is the case) and **practical reason** (concerned with what to do).

  When you tell me it is raining, you are providing data for my theoretical map of the world. My acceptance of this testimony updates my model of reality without necessarily demanding a change in my will or character. However, when you tell me an action is wrong, you are addressing my practical reason. The practice of resisting moral testimony presupposes that **moral judgment is constitutive of moral agency.**

  To accept a moral conclusion on testimony alone is to outsource the deliverances of practical reason. The implicit epistemology suggests that in the moral domain, the *process* of arriving at a belief is as normatively significant as the *content* of the belief. Therefore, the practice presupposes:
  1.  **The Ownership Condition:** Moral beliefs must be "owned" by the agent through an engagement with the underlying reasons.
  2.  **The Motivation Link:** Moral judgment is tightly linked to motivation (Internalism). Since testimony transmits propositions but not necessarily motivational states, testimony is seen as an insufficient vehicle for full moral engagement.

  ### 2. Impossibility vs. Defectiveness

  Does the practice commit us to the claim that moral knowledge cannot be transmitted at all? **No.**

  If the practice implied strict impossibility, we would view moral testimony as akin to a category error (like asking "what color is jealousy?"). Yet, we do accept moral testimony in certain contexts (e.g., from parents to children, or from novices to experts in complex bioethical dilemmas). We do not treat the resulting belief as *nothing*; we treat it as **epistemically second-rate** or **morally deficient.**

  This points to a distinction between two forms of pessimism:
  *   **Epistemic Pessimism:** Testimony fails to generate moral *knowledge* or *justification*. (You don't *know* it's wrong; you just have a true belief).
  *   **Non-Epistemic (Normative) Pessimism:** Testimony can generate knowledge, but it is **defective** to rely on it.

  The practice you describe aligns more closely with **Non-Epistemic Pessimism**. We resist because we feel that relying on testimony undermines our standing as moral agents, even if the testifier is reliable. We worry that if we act solely on your word, our action lacks **moral worth**. A Kantian would say the action lacks autonomy; a Virtue Ethicist would say it fails to exercise the virtue of practical wisdom (*phronesis*). Thus, the practice commits us to the weaker claim: acquiring moral beliefs via testimony is possible but involves a loss of moral understanding or agency that makes it undesirable.

  ### 3. Explaining the Block: Features of Moral Facts or Epistemology?

  If transmission is possible but defective, what feature explains the block? Three primary candidates emerge from the literature, each highlighting a different aspect of moral epistemology:

  **A. The Understanding Objection (Epistemic Feature)**
  Philosopher Alison Hills argues that moral *knowledge* can be transmitted, but moral *understanding* cannot. Understanding requires grasping the dependence relations between reasons and conclusions (knowing *why* something is wrong). Testimony typically transmits conclusions ("It is wrong") without transmitting the grasp of reasons. Since moral agency requires understanding (to navigate new cases and defend judgments), testimony is insufficient for full moral competence.

  **B. The Internalist Objection (Psychological Feature)**
  If moral judgments are intrinsically motivating (Internalism), then to judge "X is wrong" is to be motivated not to do X. Testimony can transmit a belief, but it cannot directly transmit a motivation. If I believe you solely on testimony, I may lack the requisite motivational grip on the truth. The "block" here is psychological: testimony bypasses the conative state required for genuine moral judgment.

  **C. The Autonomy Objection (Agency Feature)**
  This view holds that morality is a domain of self-legislation. To defer is to treat oneself as a subordinate rather than a co-legislator in the moral realm. The feature of moral facts here is their **normative authority** over the will. Submitting that will to another's judgment, even a correct one, violates the duty of autonomy.

  ### 4. Points of Philosophical Underdetermination

  Crucially, the practice of resisting moral testimony is **underdetermined** by meta-ethical theory. The same behavioral asymmetry is compatible with mutually exclusive views of what moral facts *are*.

  **Case 1: Non-Cognitivism vs. Cognitivism**
  *   **Non-Cognitivist Explanation:** Moral statements are not truth-apt descriptions of the world but expressions of attitude. You cannot testify to an attitude in the same way you testify to a fact. Therefore, resistance is rational because there is no "moral knowledge" to transmit.
  *   **Cognitivist Explanation:** Moral statements are truth-apt. However, the *value* of moral knowledge lies in the agent's grasp of the truth, not just possession of it.
  *   **Underdetermination:** An observer watching you resist moral testimony cannot tell if you do so because you think moral truths don't exist (Non-Cognitivism) or because you think grasping them requires personal reasoning (Cognitivism). The practice fits both.

  **Case 2: Realism vs. Constructivism**
  *   **Realist:** Moral facts are mind-independent. Resistance is due to the complexity of accessing these facts; they require direct cognitive engagement.
  *   **Constructivist:** Moral facts are constituted by the outcomes of rational deliberation. Therefore, skipping the deliberation (by deferring) literally bypasses the constitution of the fact *for the agent*.
  *   **Underdetermination:** Both views license the refusal to defer. The Realist says you miss the truth; the Constructivist says you fail to create the obligation. The external behavior is identical.

  **Case 3: Epistemic vs. Non-Epistemic Norms**
  *   Is the resistance based on a fear of being *wrong* (Epistemic)? Or a fear of being *inauthentic* (Non-Epistemic)?
  *   If I refuse to believe a policy is unjust because I haven't read the report, am I worried my belief will be false? Or am I worried that even if true, my belief is "blind"?
  *   **Underdetermination:** The practice of "examining the reasoning yourself" looks the same whether the goal is truth-tracking (epistemic) or character-building (aretaic).

  ### 5. Conclusion

  The asymmetry in our treatment of testimony reveals that we treat morality not merely as a body of information to be stored, but as a **skill of practical navigation to be embodied.**

  The practice does not strictly presuppose that moral knowledge *cannot* be transmitted. Instead, it presupposes that **moral understanding is a necessary condition for full moral agency**, and that testimony is a poor vehicle for understanding. It commits us to the claim that there is something defective about acquiring moral beliefs via deference—specifically, that it alienates the agent from the reasons for their action.

  However, this practice remains philosophically underdetermined. It is consistent with the view that moral facts are subjective expressions (which cannot be testified to) and the view that they are objective truths (which require personal grasping). It is consistent with the view that deference leads to error, and the view that deference leads to moral insignificance. Ultimately, the resistance to moral testimony is less a claim about the nature of moral *facts*, and more a claim about the nature of the moral *self*: we require that our moral convictions be authored by us, even if they are not discovered by us alone.
