answer: |-
  There is no single established term that captures the specific *asymmetry* you describe. There are concepts that describe the components of the maneuver, and concepts that describe the psychological state of the builders, but none that name the structural mechanism itself: the selective allocation of explanatory power between "preference" and "error" based on the normative desirability of the outcome.

  Here is the breakdown of the existing neighborhood, why they fall short, and the coinage you requested.

  ### 1. The Existing Neighborhood (and Why They Fall Short)

  **Revealed Preference Theory (Economics)**
  *   **The Idea:** Actions reveal values. If you choose X over Y, you prefer X.
  *   **Where it fits:** It captures the "deference to behavior" side of your asymmetry (when the inferred goal flatters the product).
  *   **Where it falls short:** It assumes consistency. It cannot account for the *rejection* of revealed preference when the result is embarrassing. It has no mechanism for saying, "This action reveals a preference, but that one reveals a mistake," without external criteria.

  **Preference Purification (Behavioral Welfare Economics)**
  *   **The Idea:** People have "true" preferences, but cognitive biases (present bias, framing effects) corrupt their choices. The economist's job is to "purify" the observed choice to find the true preference.
  *   **Where it fits:** It captures the "correction" side of your asymmetry (when the inferred goal is embarrassing, the behavior is treated as corrupted).
  *   **Where it falls short:** It presumes a consistent methodology for identifying bias (e.g., "we always correct for present bias"). It does not account for the *selective* application of purification. In your observation, the "bias" is identified only when the "true preference" would otherwise contradict the builder's narrative.

  **Performativity / Feedback Loops (Sociology of Finance / ML)**
  *   **The Idea:** A model's prediction changes the world in a way that makes the prediction come true (e.g., a recommendation system creates the taste it claims to predict).
  *   **Where it fits:** It captures the circularity you noted at the end (users adapting to the interpretation).
  *   **Where it falls short:** It describes the *effect* on the data over time, not the *interpretive maneuver* at the moment of modeling. It explains how the data becomes corrupted, not why the builder claims the corrupted data is "truth" in one instance and "noise" in another.

  **Motivated Reasoning (Psychology)**
  *   **The Idea:** People process evidence to support a desired conclusion.
  *   **Where it fits:** It accurately describes the *psychology* of the researchers.
  *   **Where it falls short:** It is too broad. It applies to any biased thinking. It does not capture the specific *technical locus* where the bias enters (the allocation of discrepancy between goal, belief, and execution). It misses the "carving."

  ### 2. The Coinage

  Since no existing term captures the two-sidedness (the switch between revelation and purification) combined with the stealth entry of values via model discrepancy, I propose the term:

  **Asymmetric Preference Attribution**

  **Definition:**
  A modeling maneuver in inverse reinforcement learning or intent inference where the allocation of behavioral discrepancy—between **true reward** (goal), **model error** (belief), and **execution noise** (self-control)—is determined not by statistical fit alone, but by the normative alignment of the inferred intent with the builder's objectives.

  In **Asymmetric Preference Attribution**, observed behavior is treated as authoritative evidence of preference when the inferred goal validates the system's function, but is treated as evidence of error (confusion, bias, or constraint) when the inferred goal undermines the system's narrative. The builder's values enter the system not as explicit constraints, but as the hidden criterion for deciding which latent variable absorbs the residual error.

  ### 3. Boundary Cases (Resemblances that are not Instances)

  To ensure the term is usable, you must distinguish it from legitimate modeling choices.

  **Case A: Consistent Paternalism**
  *   **Scenario:** A health app explicitly states, "We assume users want to be healthy but suffer from present bias. We will model all sugary clicks as errors."
  *   **Why it is not Asymmetric Preference Attribution:** The value judgment is explicit and applied consistently. The "carving" is declared upfront, not switched based on the specific outcome. There is no stealth.

  **Case B: Evidence-Based Model Revision**
  *   **Scenario:** A team notices users clicking "Buy" but immediately returning the item. They update the model to treat rapid returns as a negative signal (error/regret) rather than a positive preference.
  *   **Why it is not Asymmetric Preference Attribution:** The allocation of discrepancy is driven by *new behavioral data* (the return), not by the desirability of the "Buy" click itself. If users kept the item, the click would remain a positive signal. The rule is outcome-independent.

  **Case C: Explicit Reward Shaping**
  *   **Scenario:** Engineers add a penalty term to the loss function to discourage the AI from recommending addictive content.
  *   **Why it is not Asymmetric Preference Attribution:** This is a direct value imposition. The values are in the loss function, not hidden in the interpretation of the user's ambiguity. The "carving" is hard-coded, not interpretive.

  ### 4. The Test for Distinguishing Genuine Cases

  To determine if a specific instance is **Asymmetric Preference Attribution** or a defensible model revision, apply the **Pre-Registration Test**:

  > *Could the rule for allocating discrepancy (between goal, belief, and noise) have been written down before observing the specific data point, without referencing the **desirability** of the inferred outcome?*

  *   **Pass (Legitimate):** "We will treat any action reversed within 5 seconds as execution noise." (The rule relies on time, not whether the action was 'good'.)
  *   **Fail (Asymmetric Preference Attribution):** "We will treat actions that align with engagement metrics as true preferences, but actions that align with addiction metrics as cognitive biases." (The rule relies on the normative valence of the outcome.)

  ### Summary for Your Reporting

  When you encounter this maneuver, you are seeing **Asymmetric Preference Attribution**.

  It is distinct from **Preference Purification** because it is selective rather than consistent. It is distinct from **Revealed Preference** because it allows for the rejection of evidence. It is the specific mechanism by which "alignment" becomes a mirror: the system aligns with the user only when the user aligns with the builder. The "carving" happens at the boundary between **Signal** (what the user meant) and **Noise** (what the user messed up), and that boundary is drawn by the builder's values, not the user's data.
