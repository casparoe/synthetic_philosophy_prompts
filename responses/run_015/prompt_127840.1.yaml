  7.  **Final Polish:** Ensure the tone is conversational but dense. No bullet points if paragraphs flow better, but use headers for clarity. (Decided to use bold headers for the "Defeater Map" structure). Ensure the ranking is clear at the end.

      *(Self-Correction on the "New Concept" point)*: I need to be careful. HCH *can* generate new concepts if a sub-agent is asked "invent a concept." But the *root* has to know to ask that. If the root doesn't know the concept is missing, they won't ask. This is the "unknown unknown" problem.

