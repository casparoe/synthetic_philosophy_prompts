      *   *Check:* Did I address the "proponents would concede" constraint? *Correction:* Frame these as limitations Paul Christiano or others in the IDA/HCH lineage have acknowledged or discussed as open problems (e.g., "strong HCH" vs "weak HCH", the need for training).
