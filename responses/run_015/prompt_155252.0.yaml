answer: |-
  You've stumbled into one of the nastiest corners of decision theory. The Pasadena Paradox is indeed the St. Petersburg Paradox's more dangerous sibling. While St. Petersburg breaks expected utility by making it *infinite*, Pasadena breaks it by making it *undefined*.

  Here is the logic of why that happens, what it does to the framework, and whether you should actually use this for your school raffle (spoiler: don't).

  ### 1. The Math Logic: Why "Undefined" is Worse than "Infinite"
  To understand the implication, you have to look at the series summation.
  *   **St. Petersburg:** The probabilities shrink ($1/2^n$) at the same rate the payoffs grow ($2^n$). The sum is $1 + 1 + 1...$ which diverges to positive infinity. It's big, but it's directional.
  *   **Pasadena:** The payoffs alternate in sign (win, lose, win, lose) and grow in magnitude faster than the probabilities shrink, but not fast enough to converge absolutely.

  This creates a **conditionally convergent series**. In calculus, the Riemann Rearrangement Theorem states that if a series is conditionally convergent, you can reorder the terms to sum to *any* number you want (positive, negative, zero, or infinity).

  In decision theory, the "order" of outcomes shouldn't matter. A gamble is a set of probability-outcome pairs; it's not a sequence in time. If the calculated Expected Utility (EU) changes based on how you list the possibilities, the EU is mathematically undefined. You cannot compare an undefined number to a defined number, nor can you compare two undefined numbers.

  ### 2. Does this kill the "Maximize Expected Utility" (MEU) rule?
  It doesn't kill the rule for practical purposes, but it proves the rule is **incomplete** without additional axioms.

  Standard MEU assumes that for any act, the expectation integral (or sum) exists. Pasadena shows that if you allow **unbounded utility** and **infinite outcome spaces**, there are valid gambles where MEU yields no prescription. It leaves the agent paralyzed.

  *   **Implication:** MEU is not a universal law; it is a tool that works only within a specific domain (where expectations are well-defined).
  *   **The Kill Shot:** It forces you to admit that "rationality" cannot be defined solely by maximizing expectation if you allow unbounded utilities. If you stick to pure MEU with unbounded utility, you are vulnerable to "money pumps" or paralysis where no rational choice can be derived.

  ### 3. Does it break the Dominance Principle?
  This is where it gets really messy. The Dominance Principle states: If Gamble A pays out more than Gamble B in every possible state of the world, you must prefer A.

  In standard theory, MEU respects Dominance. If A dominates B, then $EV(A) > EV(B)$.
  In the Pasadena framework, **MEU loses the ability to track Dominance.**

  Because the expectation is undefined, you can construct a scenario where Gamble A strictly dominates Gamble B, yet you cannot show $EV(A) > EV(B)$ because neither value exists. Worse, there are variations (like the Altadena paradox) where you can construct two gambles where one dominates the other, but by rearranging the series of the dominated one, you can make its "sum" appear higher than the dominant one.

  So, does it break Dominance? **No.** Dominance is generally considered more robust than MEU.
  Does it break the link between Dominance and MEU? **Yes.** It shows that MEU is not strong enough to capture all intuitive rational constraints like Dominance when utilities are unbounded.

  ### 4. Is there a workaround? (Patch vs. Reject)
  The consensus among decision theorists is to **patch**, not reject. Rejecting MEU entirely leaves you with very few tools for handling risk. The patches generally fall into two camps:

  **A. Bounded Utility (The Philosophical Patch)**
  This is the most common solution. You assert that utility *must* have a maximum and minimum cap. Humans have finite lifespans and finite capacity for enjoyment/suffering. Once you cap utility, the series can no longer diverge or oscillate indefinitely; it must converge.
  *   *Result:* The expectation becomes defined again. MEU is saved.
  *   *Cost:* You lose the ability to model agents who theoretically value things infinitely (like a utilitarian who values every human life as infinitely precious).

  **B. Finite World Constraints (The Physical Patch)**
  You assert that the number of possible states of the world is finite. There isn't enough energy in the universe to pay out the 100th round of a coin flip gamble.
  *   *Result:* The series is truncated. The expectation is finite and defined.
  *   *Cost:* It makes the theory dependent on physical contingencies rather than logical axioms.

  **Verdict:** Bounded Utility is the stronger patch. It solves St. Petersburg, Pasadena, and the dominance conflicts simultaneously.

  ### 5. Real-World Relevance: Should this change your betting logic?
  For your school raffle? **Absolutely not.**
  For high-stakes existential risk modeling? **Maybe.**

  **Why it doesn't matter for the raffle:**
  1.  **Finite Bankroll:** Your school cannot pay out infinite money. The moment you put a cap on the payout (e.g., "Max prize $10,000"), the paradox vanishes. The series becomes finite.
  2.  **Bounded Utility:** A high school student does not gain infinite utility from $1 billion. At some point, the money just becomes numbers on a screen.
  3.  **Variance:** Even if you truncate the game to make the EV finite, the variance in a Pasadena-style structure is astronomical. You would need to charge an entry fee that no one would pay to cover the tail risk.

  **Where it does matter:**
  This logic matters when dealing with **existential risk** or **climate change**. These are low-probability, high-impact events where the "payoff" (survival vs. extinction) might be modeled as unbounded. If you use unbounded MEU here, you can get paradoxical results where you should spend all current resources to mitigate a tiny probability of infinite loss. The Pasadena logic suggests our current cost-benefit models might be mathematically broken when dealing with infinite stakes.

  ### 6. Recommendation for your Raffle Design
  Do not try to implement a harmonic scaling payout based on coin flips. Here is why, practically speaking:

  1.  **Regulatory/Legal:** Raffles are gambling. If the expected value is undefined or infinite, you are essentially running a scam or an unlicensed lottery with unpredictable liability.
  2.  **Psychology:** People are loss-averse. A structure that includes negative payouts (losing money on certain rounds) will be hated. If you make all payouts positive but scaling harmonically, you just have a high-variance St. Petersburg variant. People will intuitively undervalue it (paying only a small amount to enter) because the *median* payout is tiny, even if the *mean* is huge.
  3.  **Solvency:** If you get a run of "heads" deeper than your fund can cover, the school is liable.

  **The Fix:**
  Use a **capped geometric growth**.
  *   Flip a coin.
  *   Heads: Pot doubles.
  *   Tails: Pot pays out and game ends.
  *   **HARD CAP:** At round 10 (or whatever your max liability is), the game forces a payout regardless of the coin.

  This truncates the series, makes the EV defined and calculable, and keeps you out of jail.

  ### Summary
  The Pasadena Paradox proves that **Expected Utility Theory is logically inconsistent if you allow unbounded utility.** It doesn't mean you should throw the framework in the trash, but you must patch it with a **Bounded Utility Axiom**.

  For your raffle, the paradox is a mathematical curiosity, not a design feature. If you build a game with undefined expectation, you aren't being clever; you're creating a liability that cannot be priced. Stick to finite caps, calculate the EV, and take the margin.
