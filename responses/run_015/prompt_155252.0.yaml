      *   **Discovery:** Stumbled upon the Pasadena Paradox (related to the St. Petersburg Paradox but with alternating signs/undefined expectation).
      *   **Core Questions:**
          1.  What are the implications for decision theory?
          2.  Does it kill the "maximize expected utility" (MEU) rule?
