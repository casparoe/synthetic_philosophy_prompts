  hey im trying to design a fundraiser raffle for my school where payouts scale with coin-flip rounds in a weird harmonic way, and i stumbled on the pasadena paradox — the expected value isnt just infinite, its literally undefined. what are the most important implications of that for decision theory? specifically, does it actually kill the rule that you should always pick the option with the highest expected utility, or is there a workaround? and does it break dominance too, or is that a rumor? also, does this only matter for made-up games, or should it change how i think about small real-world bets with funky payout structures? keep it in the weeds but no citations needed, just the logic — and tell me if the undefined expectation means we should reject the whole framework or just patch it.
