answer: |-
  This is a specification for evaluating adaptationist hypotheses in evolutionary psychology for the purpose of allocating seed funding. It is designed to filter out "just-so stories" while admitting legitimate adaptationist research, calibrated against established biological adaptations (lactase persistence, camouflage, peacock trains) and constrained by the reality of pilot-scale funding.

  ### Part I: Evaluation of the Draft List

  Here is the adjudication of your 12 draft requirements.

  **1. The Three Ledgers (Currency, Timescale, Regime)**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** "Fitness" is a bookkeeping term, not a mechanism. A hypothesis must specify *what* was being maximized (e.g., caloric efficiency, mate access, pathogen avoidance), over *what period* (Pleistocene vs. Holocene), and under *which conditions* (high pathogen load vs. low). Without this, the story is unfalsifiable.
  *   **Calibration:** Lactase persistence passes (currency: caloric intake from milk; regime: pastoralism).

  **2. The Contrast Class**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** This is the primary defense against tautology. If the hypothesis cannot explain why *this* trait evolved rather than a slightly different one (or no trait at all), it explains nothing. It forces the applicant to model the fitness landscape, not just the peak.
  *   **Calibration:** Peacock trains pass (contrast: drab tails which save energy but lose mates).

  **3. No Phantom Preferences**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** You cannot explain a behavior by positing a "desire" to perform that behavior. The mechanism must be decomposed into input-output functions, not homunculi.
  *   **Calibration:** Passes all biological adaptations; filters out folk-psychological explanations dressed as evolution.

  **4. The Orphan-Trait Discount**
  *   **Verdict:** **Revise.**
  *   **Reasoning:** Do not *discount* unique human traits; many adaptations are lineage-specific. However, if comparative leverage is absent, the burden of proof on **Engineering Signature (7)** and **Novel Predictions (11)** must increase. You cannot use phylogeny to prove function, so you must use design evidence.
  *   **Calibration:** Human language is an orphan trait but clearly adaptive. Discounting it would be an error.

  **5. The Lag-Load Constraint**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** Essential for "mismatch" theories. If the environment changed slowly, selection should have tracked it. If the hypothesis relies on mismatch, it must demonstrate the rate of environmental change exceeded the rate of genetic response.
  *   **Calibration:** Obesity hypotheses often fail this; lactase persistence passes (culture changed, genes tracked).

  **6. Reachability**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** Evolution tinkers; it does not engineer from scratch. The proposed trait must be derivable from the ancestral state via plausible mutational steps.
  *   **Calibration:** The eye passes (gradual steps); irreducible complexity claims fail.

  **7. The Engineering Signature**
  *   **Verdict:** **Revise.**
  *   **Reasoning:** "Efficiency" is too vague. Revise to **"Specialized Design Features."** Adaptations often show *costly* complexity (like the peacock's train) that serves a function, not necessarily economy. Look for reliability, specificity, and complexity that exceeds what is needed for a byproduct.
  *   **Calibration:** Peacock trains pass (costly, specific); morning sickness passes (complex hormonal regulation).

  **8. Heritability and Non-Social Transmission**
  *   **Verdict:** **Drop.**
  *   **Reasoning:** This is camp prejudice. Gene-culture coevolution is standard. Ruling out cultural transmission a priori blinds you to dual-inheritance dynamics. The requirement should be **"Mechanism Disentanglement"**: the proposal must specify how it distinguishes genetic from cultural transmission, not assume one.
  *   **Calibration:** Lactase persistence is genetic; milk *consumption* is cultural. Both are valid evolutionary stories.

  **9. Cross-Cultural Universality**
  *   **Verdict:** **Revise.**
  *   **Reasoning:** Universality is evidence, but lack of it is not disproof. Adaptations can be conditional strategies (facultative calibration). Revise to **"Predictable Variability."** The hypothesis must predict *where* and *why* the trait varies (e.g., sex differences shrinking in egalitarian societies).
  *   **Calibration:** Mate preferences pass (predictable variability); WEIRD biases fail.

  **10. Some Identifiable Genetic Basis**
  *   **Verdict:** **Drop.**
  *   **Reasoning:** For psychological traits, this is scientifically premature and impossible for pilot money. Most are polygenic. Replace with **"Evolvability."** Is the trait heritable enough to have responded to selection?
  *   **Calibration:** Almost all psych traits would fail the original; this would rule out the entire field.

  **11. Novel Predictions**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** The single best filter for just-so stories. Post-hoc fitting is cheap; predicting unknown data is expensive and risky.
  *   **Calibration:** Distinguishes Profet's morning sickness (predicted specific aversions) from "nausea is a side effect."

  **12. A Stated Finding That Would Kill the Hypothesis**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** If no data could falsify it, it is not science.
  *   **Calibration:** Universal requirement for science.

  ---

  ### Part II: The Impossibility Result

  You suspected a tension in your draft list. You are correct. There is a triad of requirements that cannot be jointly satisfied for uniquely human psychological traits:

  1.  **Direct Verification of Ancestral Pressures:** Proving the specific selection pressure existed in the EEA (Environment of Evolutionary Adaptedness).
  2.  **Comparative Leverage:** Using phylogeny to confirm function (requires the trait to exist in related species).
  3.  **Immediate Pilot Testability:** Generating novel predictions testable now with $40,000.

  **The Conflict:** If a trait is uniquely human (violating 2), and the selection pressure is ancestral/unobservable (violating 1), you cannot prove the adaptationist story *historically*. You can only test the *current design implications*. If you demand 1 and 2, you cannot fund the project (violating 3). If you demand 3, you must accept that you are testing the *consequences of the design*, not the history of the selection.

  **Resolution for Funding:** For seed money, you must prioritize **(3) Immediate Pilot Testability** supported by **(7) Specialized Design Features**. You cannot fund "proof of selection." You fund "evidence of design consistent with selection." The historical story is the *motivation*, not the *deliverable*.

  ---

  ### Part III: Exclusionary Power

  **The Most Exclusionary Requirement:**
  **11. Novel Predictions.**
  Most adaptationist papers are post-hoc explanations of known data. Demanding a prediction that has not yet been tested (and specifically budgeting for it) eliminates 80% of "theoretical" applications.

  **The Most Dangerous to Drop:**
  **2. The Contrast Class.**
  If you drop this, you admit tautologies. "We have a fear of snakes because it was fit to fear snakes" becomes a valid hypothesis. Without specifying why *this* mechanism evolved rather than a general fear mechanism or no fear mechanism, the explanation has zero informational content.

  **The Budget Constraint:**
  "Checkable within a pilot budget" is **not a desideratum on the theory**, it is a **constraint on the proposal**. A theory can be true but untestable for $40k (e.g., requires fMRI of infants in 10 countries). However, for *this* committee, a theory that cannot generate a *slice* of testable evidence at this scale is not fundable. The requirement is: "Does this proposal identify a specific, low-cost implication of the theory that discriminates it from rivals?"

  ---

  ### Part IV: Handling the Trouble Cases

  Here is how the revised specification handles the specific cases troubling you.

  **1. Morning Sickness (Profet vs. Byproduct)**
  *   **Application:** Apply **Engineering Signature (7)** and **Novel Predictions (11)**.
  *   **Resolution:** The byproduct story predicts nausea correlates with general hormonal flux. The adaptation story predicts nausea correlates specifically with toxin-heavy foods and peaks when fetal organogenesis is most vulnerable. The adaptation story makes sharper predictions. Fund the one proposing to test food aversion profiles against toxin loads, not just hormone levels.

  **2. Wason Selection Task (Cheater Detection vs. Familiarity)**
  *   **Application:** Apply **Contrast Class (2)** and **Novel Predictions (11)**.
  *   **Resolution:** The general reasoning story predicts performance improves with any familiar content. The cheater-detection story predicts performance improves *only* with social contract content, even if unfamiliar. The proposal must test unfamiliar social contracts vs. familiar descriptive rules.

  **3. Mate Preference (Gender Equality Shrinkage)**
  *   **Application:** Apply **Predictable Variability (Revised 9)**.
  *   **Resolution:** This does not falsify the adaptation. It suggests a conditional strategy. The adaptationist hypothesis must predict the *slope* of the shrinkage. If the difference disappears entirely in high-equality societies, the "universal adaptation" claim is weakened. If it shrinks but persists, it supports a calibrated adaptation. Fund the proposal that quantifies the calibration curve.

  **4. WEIRD vs. Small-Scale Societies**
  *   **Application:** Apply **Predictable Variability (Revised 9)** and **Lag-Load (5)**.
  *   **Resolution:** If a preference exists in WEIRD samples but not small-scale, it is likely cultural or a mismatch. The adaptationist must explain the variance. If they claim it is universal, they are falsified. If they claim it is a conditional strategy triggered by "modern cues," they must define those cues (Lag-Load).

  **5. The Mirror-Image Problem (Risk vs. Caution)**
  *   **Application:** Apply **Contrast Class (2)** and **Engineering Signature (7)**.
  *   **Resolution:** If the same story explains risk-taking *and* caution, it explains neither. The hypothesis must specify the *switching mechanism*. What input triggers the shift from risk to caution? If the proposal does not model the switch, it is a just-so story.

  **6. Byproduct Equivalence**
  *   **Application:** Apply **Engineering Signature (7)** and **Reachability (6)**.
  *   **Resolution:** Adaptations usually show "excess" complexity or cost (e.g., specific neural circuitry) that a byproduct would not sustain. If the byproduct explanation accounts for the data with fewer assumptions (parsimony) and no unexplained complexity, it wins. The adaptationist must show the trait is *too complex* to be a byproduct.

  ---

  ### Part V: The Specification (Final List)

  For a proposal to receive seed funding, it must satisfy the following **Five Gates**:

  1.  **The Ledger:** Specifies the fitness currency, the ancestral regime, and the timescale. (Draft 1)
  2.  **The Contrast:** Specifies the alternative designs that were *not* selected and why. (Draft 2)
  3.  **The Design:** Demonstrates specialized features (complexity, reliability, specificity) inconsistent with a byproduct. (Revised 7)
  4.  **The Variance:** Predicts the pattern of universality or variability (conditional strategies) across cultures/contexts. (Revised 9)
  5.  **The Test:** Commits to a novel, falsifiable prediction testable within the pilot budget that discriminates the adaptationist model from the best byproduct/cultural rival. (Draft 11 & 12)

  ---

  ### Part VI: Program Scorecard

  Briefly, here is how the major research programs stack up against this specification.

  **1. Massive Modularity (Evolutionary Psychology)**
  *   **Strengths:** High on **Design** and **Contrast**. Excellent at generating specific **Tests** (e.g., Wason tasks).
  *   **Weaknesses:** Often weak on **Reachability** (how do you build a module genetically?) and **Variance** (often assumes universality where there is flexibility).
  *   **Funding Verdict:** Fund only if they address the developmental reachability of the module.

  **2. Human Behavioral Ecology (HBE)**
  *   **Strengths:** Perfect on **The Ledger**. Very strong on **Variance** (optimality models fit local conditions).
  *   **Weaknesses:** Weak on **Design** (often assumes optimality without specifying the psychological mechanism) and prone to **Phantom Preferences** (assuming actors maximize fitness consciously).
  *   **Funding Verdict:** Fund only if they specify the psychological mechanisms implementing the optimization.

  **3. Cultural Evolution / Dual Inheritance**
  *   **Strengths:** Strong on **Variance** and **Reachability** (cultural transmission is faster/observable).
  *   **Weaknesses:** Weak on **The Ledger** (often treats cultural fitness as distinct from genetic without linking them) and **Design** (less focus on innate constraints).
  *   **Funding Verdict:** Strong contender, but must show how cultural dynamics interact with biological constraints.

  **4. Developmental / Niche Construction**
  *   **Strengths:** Superior on **Reachability** and **Design** (how the trait is built).
  *   **Weaknesses:** Often weak on **The Ledger** (focuses on stability rather than selection history) and **Contrast** (explains existence, not why *this* over *that*).
  *   **Funding Verdict:** Best for ruling out impossible adaptationist claims, but less likely to generate positive adaptationist predictions.

  **Summary Recommendation:**
  Use the **Five Gates** to filter. Do not ask "Is this true?" Ask "Does this proposal generate a decisive test?" The field has enough stories; it needs more data. Your role is not to judge the history, but to fund the leverage.
