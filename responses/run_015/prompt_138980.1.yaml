  *(Wait, check the "Budget" question)*: "checkable within a pilot budget" is a desideratum on the theory or merely a fact about my committee? It is a fact about the committee, *but* a theory that cannot generate pilot-scale predictions is not a *funding-worthy* theory, even if true. So it's a pragmatic filter on the *proposal*, not the *truth*.

