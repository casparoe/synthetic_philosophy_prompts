      *   **Background:** Developmental methods expert (not an evolutionary psychologist).
      *   **Task:** Create a written standard/specification to evaluate adaptationist hypotheses for funding ($40k pilot).
      *   **Goal:** Distinguish "real explanations" from "just-so stories" (Kipling with footnotes vs. lactase persistence).
      *   **Input:** A draft list of 12 requirements.
      *   **Specific Demands:**
          1.  Evaluate each draft requirement (Keep, Revise, Drop + Why).
          2.  Identify jointly unsatisfiable requirements (Impossibility Result).
          3.  Identify the most exclusionary requirement and the one whose removal admits the worst offenders.
          4.  Apply the list to specific trouble cases (morning sickness, Wason task, mate preference, WEIRD samples, mirror-image problem, byproduct equivalence).
          5.  Ensure the list doesn't rule out established adaptations (lactase, camouflage, peacock).
          6.  Address the "pilot budget" constraint (theoretical vs. practical).
          7.  Briefly score major research programs (Massive Modularity, HBE, Dual Inheritance, Developmental/Niche Construction).
      *   **Tone:** Rigorous, analytical, methodological, slightly skeptical but fair (matching the user's "annoying questions" persona).

  2.  **Evaluate the Draft List (Items 1-12):**
      *   *1. Three Ledgers (Currency, Timescale, Regime):* Essential. Vague "fitness" is meaningless. *Keep.*
      *   *2. Contrast Class:* Crucial for avoiding tautology. Why *this* trait and not another? *Keep.*
      *   *3. No Phantom Preferences:* Avoids circularity (homunculus). *Keep.*
      *   *4. Orphan-Trait Discount:* Comparative data is gold standard, but unique human traits exist. Too strict to *require* comparison for funding, but should be a "plus." *Revise.*
      *   *5. Lag-Load Constraint:* Essential for mismatch theories. *Keep.*
      *   *6. Reachability:* Evolutionary tinkering vs. engineering. Crucial for plausibility. *Keep.*
      *   *7. Engineering Signature:* Efficiency/precision. Good, but some adaptations are "good enough." *Revise.*
      *   *8. Heritability/Non-social:* Too strong. Gene-culture coevolution is real. Ruling out cultural transmission a priori is bad science. *Drop/Revise.*
      *   *9. Cross-cultural Universality:* WEIRD problem. Universality suggests adaptation, but variability doesn't rule it out (conditional strategies). *Revise.*
      *   *10. Identifiable Genetic Basis:* Unrealistic for pilot money/psychology. Polygenic/complex. *Drop.*
      *   *11. Novel Predictions:* The hallmark of science vs. fitting. *Keep.*
      *   *12. Falsification Condition:* Essential for scientific status. *Keep.*

  3.  **Address the "Impossibility Result" (Joint Unsatisfiability):**
      *   The user suspects tension between "testable now," "ancestral pressures unobservable," and "unique traits need comparison."
      *   *Analysis:* Yes. If a trait is uniquely human (no comparison) and the selection pressure is ancestral (no direct observation), and you demand novel predictions testable *now* with *pilot money*, you hit a wall. You can't test ancestral selection directly. You have to test *current* implications of the design.
      *   *Resolution:* The criteria must shift from "prove selection happened" to "demonstrate the trait has the design features of an adaptation *consistent* with selection."

  4.  **Identify Key Exclusionary Requirements:**
      *   *Most Exclusionary:* Novel Predictions (11) + Falsification (12). Most just-so stories are post-hoc.
      *   *Dangerous to Drop:* Contrast Class (2) or No Phantom Preferences (3). Dropping these allows tautologies ("we do X because we want X").

  5.  **Address Trouble Cases:**
      *   *Morning Sickness:* Profet's toxin-avoidance vs. byproduct. Needs specific prediction (aversion profiles match toxin loads, not just nausea).
      *   *Wason Task:* Cheater detection vs. familiarity. Needs content-variance testing (social contract vs. descriptive).
      *   *Mate Preference:* Gender equality shrinkage. Suggests conditional strategy or cultural modulation, not necessarily falsifying adaptation.
      *   *WEIRD vs. Small-scale:* Universality (9) needs revision to "predictable variability."
      *   *Mirror-image:* Risk vs. Caution. Needs the Contrast Class (2) and Engineering Signature (7) to distinguish.
      *   *Byproduct Equivalence:* Needs the Engineering Signature (7) and Reachability (6). Adaptations show costliness/complexity; byproducts are usually side-effects.

  6.  **Address "Pilot Budget" Constraint:**
      *   Is it a theoretical desideratum? No.
      *   Is it a practical filter? Yes.
      *   *Decision:* It's a funding constraint, not a truth constraint. However, for *seed* money, the hypothesis must generate *feasible* next steps.

  7.  **Score Research Programs:**
      *   *Massive Modularity:* Strong on engineering/predictions, weak on reachability/development.
      *   *HBE (Human Behavioral Ecology):* Strong on currency/ledger, weak on mechanism/phantom preferences.
      *   *Dual Inheritance:* Strong on transmission, weak on specific psychological design.
      *   *Developmental/Niche:* Strong on reachability/development, weak on specific adaptationist claims (often explains stability without selection).

  8.  **Drafting the Response (Iterative refinement):**
      *   *Structure:* Follow the user's requested order.
      *   *Tone:* Professional, precise, acknowledging the difficulty.
      *   *Calibration:* Ensure lactase/peacock pass. (Lactase passes genetic basis, but psych traits won't have single genes. Peacock passes engineering signature.)
      *   *Refining the "Impossibility":* The tension is between *historical verification* and *current testability*. The solution is "Current Design Evidence."
      *   *Refining the List:* Group them logically (Historical Plausibility, Design Evidence, Testability).

      *(Self-Correction during drafting)*: I need to be careful with Item 10 (Genetic Basis). For psychology, demanding a specific gene is impossible for pilot money. But demanding *heritability* or *evolvability* is fair. I will revise it to "Evolvability/Heritability plausibility" rather than "Identifiable gene."
      *(Self-Correction on Item 8)*: Ruling out cultural transmission is wrong. The requirement should be "Disentangling mechanisms."
      *(Self-Correction on Item 4)*: Orphan traits are common in humans. Don't discount them, but demand stronger design evidence if comparison is missing.

      *(Focusing on the "Impossibility Result"):* The user wants to know if the criteria are jointly unsatisfiable. The core tension is: We can't observe the past (Selection), we can't easily compare unique traits (Phylogeny), but we demand testable predictions (Science). The resolution is that we test the *consequences of the design* in the present, not the history itself. I need to make this explicit.

      *(Focusing on the Trouble Cases):* I need to show how the *revised* list handles these. E.g., Mirror-image problem is solved by the "Contrast Class" and "Engineering Signature."

      *(Scoring the Programs):* Keep it brief but punchy.

  9.  **Final Review against Constraints:**
      *   Did I answer Keep/Revise/Drop for all 12? Yes.
      *   Did I address the Impossibility Result? Yes.
      *   Did I identify the most exclusionary/dangerous drop? Yes.
