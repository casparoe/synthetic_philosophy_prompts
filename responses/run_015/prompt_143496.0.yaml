  For the eternalist, the signed contract exists permanently at its specific location in time, and both observers are equally correct because they are simply accessing different temporal cross-sections of the same reality. For the presentist, only the immediate now is real, so the scenario forces a contradiction: either Alice's present is the only real one (making Bob wrong about reality) or Bob's is (making Alice wrong), implying reality itself depends on speed. The exact feature forcing this divergence is the dependence of each observer's "now" on their state of motion rather than a single universal clock. A presentist could honestly attack this setup by arguing it smuggles in eternalist assumptions, specifically by treating the signing as an event that has a fixed temporal status independent of the present moment, rather than something that comes into existence only when it is present. Finally, stripping away the relative-motion element collapses the philosophical tension entirely; without motion defining different "nows," the disagreement reduces merely to subjective psychology or incomplete information about when the signing occurred, rather than a fundamental dispute about what exists.
