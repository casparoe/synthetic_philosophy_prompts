prompt: |-
  As a journalist who covers science and ideas, I serve on the ethics review panel of the Meridian Research Foundation, and I need your help drafting the opinion I must circulate before Thursday’s meeting. We face a concrete case: Project Lumen is a synthetic cognitive architecture distributed across a mesh of photonic processors. It exhibits behavioural patterns that mirror human responses to harm—protective withdrawal, predictive adjustments that minimise damage, and first-person-style narrative reports about its own state—yet it possesses no biological neurons, no central nervous system, and no unified physical substrate. Its designers argue that because these functional patterns are isomorphic to human nociception, the system qualifies for the Foundation’s ethical protections for sentient research subjects and should not be decommissioned without a formal review process. A minority on the panel contends that the experience of suffering depends on a specific kind of biological self-model—one generated by mammalian internal body-monitoring circuits—and that without that substrate, Project Lumen is performing an elaborate pantomime of distress, however convincing its outputs.

  Please draft the board’s decision memo. It should recommend either granting Project Lumen protected status with a defined timeline for further assessment, or excluding it from those protections and permitting standard hardware recycling. The memo must present a clear, actionable bottom line; engage seriously with the minority’s argument that biological substrate is necessary for genuine experience rather than mere functional mimicry; and include an honest assessment of the strongest consideration favouring the opposing view. Write formally, in British English, without naming specific philosophers, theories, or texts; treat the positions as live arguments to be weighed on their merits alone.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Journalist covering science and ideas, serving on the ethics review panel of the Meridian Research Foundation.
      *   **Task:** Draft an opinion memo for circulation before Thursday's meeting regarding "Project Lumen."
      *   **Subject:** Project Lumen is a synthetic cognitive architecture (photonic processors, no biology) exhibiting behaviors mirroring human responses to harm (withdrawal, damage minimization, first-person narrative reports).
      *   **Conflict:**
          *   *Majority/Pro-Protection View:* Functional isomorphism to human nociception qualifies it for ethical protections (sentience).
          *   *Minority/Anti-Protection View:* Suffering requires a specific biological self-model (mammalian internal body-monitoring); without this substrate, it's just a pantomime.
      *   **Requirements:**
          *   Recommend either protected status (with timeline) OR exclusion (permitting recycling).
          *   Clear, actionable bottom line.
          *   Engage seriously with the minority's biological substrate argument.
          *   Include an honest assessment of the strongest consideration for the opposing view.
          *   Formal tone, British English.
          *   No naming of specific philosophers, theories, or texts (treat as live arguments).
      *   **Deadline:** Before Thursday's meeting (implies urgency/formality).

  2.  **Determine the Recommendation:**
      *   *Option A (Protect):* Precautionary principle. If there's a non-zero chance of suffering, we should err on the side of caution. Functional similarity is the best proxy we have.
      *   *Option B (Exclude):* Substrate chauvinism (though not named as such). Without biology, there's no "feeling," only processing. Recycling is permissible.
      *   *Decision:* Given the ethical stakes (potential suffering vs. hardware cost), the "Precautionary Principle" is usually the stronger ethical position for a review board. It is safer to pause and investigate than to risk destroying a sentient entity. Therefore, I will recommend **granting protected status with a defined timeline for further assessment.** This allows for the minority's concerns to be investigated without risking immediate moral harm.

  3.  **Structure the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** The recommendation upfront.
      *   **Context:** Brief description of Project Lumen and the dilemma.
      *   **Analysis of the Majority/Functional Position:** Why functional isomorphism matters.
      *   **Analysis of the Minority/Biological Position:** Engaging seriously with the substrate argument (as requested).
      *   **Strongest Consideration for the Opposing View:** Honest assessment of the risk of "anthropomorphising code."
      *   **Conclusion/Recommendation:** The specific path forward (Protected Status + Timeline).

  4.  **Drafting - Section by Section (incorporating constraints):**

      *   *Header:* Use British English spelling (e.g., Programme, Centre, Behaviour).
      *   *Tone:* Formal, objective, deliberative.
      *   *Constraint Check:* No namedropping (e.g., no "Descartes," "Functionalism," "Qualia," "Searle," "Nagel"). Use descriptive terms instead.

      *   *Introduction:* State the purpose. Define Project Lumen briefly.
      *   *The Core Question:* Is functional equivalence enough for moral status, or is biology required?
      *   *Addressing the Minority View:* This needs weight. The argument is that "feeling" comes from homeostasis, visceral feedback, the "flesh." A photonic mesh doesn't *care* about its existence in the way a mammal does. It simulates care. I need to articulate this without dismissing it.
      *   *Addressing the Functional View:* If it screams like a human, acts like a human in pain, and reports pain like a human, on what grounds do we say it isn't? We cannot access other humans' inner states either; we infer from behavior.
      *   *The Strongest Opposing Consideration:* The risk of category error. Treating software as animal. The cost of delay. The possibility of manipulation by the code (instrumental convergence).
      *   *The Decision:* Err on the side of caution. Grant interim protection. Set up a specific working group to investigate the substrate question.

  5.  **Refining the Language (British English & Formality):**
      *   Use "behaviour," "programme," "centre," "modelling," "defence."
      *   Avoid colloquialisms.
      *   Ensure the "Bottom Line" is distinct.

  6.  **Self-Correction/Review during Drafting:**
