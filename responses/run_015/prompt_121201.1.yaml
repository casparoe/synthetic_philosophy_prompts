  2.  **Deconstruct the Slogan ("History must serve life, not life serve history"):**
      *   *Context:* Nietzsche's second *Untimely Meditation*. He critiques three modes of history (monumental, antiquarian, critical) when they become unmoored from the vital needs of the present.
      *   *The Conflict:* The student sees the *structure* of the archive (indefinite preservation) as inherently antiquarian and potentially life-stifling. The respondent sees the *potential utility* (queryability) as proof of service to life.
      *   *Goal:* Show that the respondent's use of the slogan is likely a superficial reading that misses Nietzsche's deeper point about the *horizon* of the living being.

  3.  **Drafting the Four Readings:**

      *   *Reading 1: The Trivial/Instrumental Reading.*
          *   Claim: History is a tool. If you use it, it's good. If it stops you from acting, it's bad.
          *   Status: Truism/Trivial.
          *   Dismissal?: Yes (superficially).
          *   Weakness: Ignores structural effects. Just because a tool *exists* doesn't mean it isn't shaping the user in unhealthy ways.

      *   *Reading 2: The Methodological/Heuristic Reading.*
          *   Claim: Historiography should be guided by present-day questions/interests.
          *   Status: Defensible but substantive (standard historicist view).
          *   Dismissal?: Partially.
