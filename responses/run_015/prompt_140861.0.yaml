answer: |-
  Your gut is right to be suspicious. The summary you received captures the sensational "early days" of experimental philosophy (circa 2003–2008), but it presents a specific, controversial interpretation as settled fact. Most experts working on the Knobe Effect today would reject the strongest claims in that passage, particularly the idea that "intentionally" means *nothing more than* "to blame."

  Here is a breakdown of what a specialist would accept, what they would call a simplification, and what they would call wrong, followed by an analysis of your two variants.

  ### 1. Grading the Book's Claims

  **What experts accept:**
  *   **The Data:** The asymmetry is real. In the "Harm" condition, most people say the chairman harmed the environment *intentionally*. In the "Help" condition, most say he did *not* help the environment *intentionally*, despite identical knowledge and foresight.
  *   **The Generalization:** The effect isn't limited to intentionality. It has been replicated for concepts like *causation*, *doing vs. allowing*, and *decision-making*. Moral or normative valence does influence how we apply these concepts.

  **What is a fair simplification:**
  *   **"Moral judgments in disguise":** It is fair to say moral (or normative) considerations *influence* the judgment. The passage is simplifying a complex cognitive mechanism into a single motive. Most researchers agree that our moral attitudes act as a lens through which we view the agent's mental states, rather than simply replacing the judgment entirely.

  **What experts call wrong:**
  *   **"Nothing more than 'he's to blame'":** This is the biggest error. This view is a form of *semantic expressivism* or *error theory*. It claims that when we say "intentionally," we aren't actually describing the action; we are just emoting blame.
      *   **The Counter-view:** Joshua Knobe himself (and most contemporaries) argues for a **Competence Model**. They argue that moral considerations are *part of the concept* of intentional action. It's not that we are making a mistake and masking it with description; it's that the folk concept of "intentional" *includes* a normative component. To say the action was intentional *is* to say it violated a norm in a specific way. It is a descriptive claim, but the description includes normative facts.
  *   **"No descriptive question left":** This is false. Philosophers still argue vigorously about the *structure* of the concept. The debate shifted from "Is there an asymmetry?" to "What is the cognitive mechanism?" (e.g., is it about the agent's "deep self"? Is it about default norms?).

  **Does the "Moral" survive?**
  The book concludes that armchair intuitions are "just moral reactions wearing a descriptive costume." This is a **debunking argument**. It suggests we should trust our intuitions less because they are contaminated by emotion.
  *   **Verdict:** This is too strong. If the Competence Model is right, then moral reactions aren't "contamination"; they are data about how the concept works. If our concept of intentionality is inherently normative, then armchair intuitions are still valid evidence for the *concept*, even if they don't track mind-independent physical facts. The moral should be: "Armchair intuitions are sensitive to normative context," not "Armchair intuitions are fake."

  ---

  ### 2. Analyzing Your Variants

  Your variants are excellent because they target the specific mechanism the book proposes. Here is how the book's "Blame Account" stacks up against the "Normative Competence Account" (the standard rival view).

  #### Variant 1: The Pointless Company Rule (Non-Moral Norm)
  *   **The Setup:** The side effect is breaking a meaningless bureaucratic rule. The chairman foresees it and doesn't care. There is no moral blame, only rule-breaking.
  *   **The Book's Prediction:** **No Asymmetry.**
      *   *Why?* The book claims the effect is driven by *moral* disapproval ("he's to blame"). If there is no moral violation, there is no blame. Therefore, people should judge the "rule-breaking" side effect the same way regardless of whether it's framed positively or negatively (or simply as a violation).
  *   **The Rival Account's Prediction:** **Asymmetry Persists.**
      *   *Why?* The Normative Competence account argues the effect is driven by *norm* violation, not strictly *moral* violation. If an agent shows indifference to a norm (even a conventional one), we are more likely to say they violated it "intentionally."
  *   **The Actual Data:** **Asymmetry Persists.**
      *   Studies (e.g., by Uttich & Lombrozo, or Knobe's later work) show that the effect occurs with non-moral norms (like etiquette or arbitrary rules), though sometimes slightly weaker than with moral norms.
  *   **The Divergence:** This is a fatal blow to the book's specific claim that it is about *moral blame*. It shows the mechanism is broader: it is about **normativity**. The book is wrong to restrict it to morality.

  #### Variant 2: Swapping "Intentionally" for "Knowingly"
  *   **The Setup:** You ask participants, "Did the chairman *knowingly* harm/help the environment?" rather than "intentionally."
  *   **The Book's Prediction:** **Symmetry (No Asymmetry).**
      *   *Why?* The book claims "intentionally" is a code for "blameworthy." "Knowingly" is a factual claim about mental states (epistemic status). Since the chairman's knowledge is identical in both cases, the answer should be "Yes" for both. The "blame" trigger isn't pulled by the word "knowingly."
  *   **The Rival Account's Prediction:** **Symmetry (Mostly).**
      *   *Why?* While some normative spillover can occur, "knowingly" is generally treated as a thinner, more factual concept than "intentionally." The normative component is specific to the concept of *intention*, not *knowledge*.
  *   **The Actual Data:** **Symmetry.**
      *   When researchers use "knowingly," the asymmetry largely disappears. People agree he knowingly caused the outcome in both the Help and Harm cases.
  *   **The Divergence:** Here, the book actually gets the *prediction* right, but for the wrong *reason*.
      *   The book says: "It's symmetric because 'knowingly' isn't about blame."
      *   The Rival says: "It's symmetric because 'knowingly' tracks cognitive state, whereas 'intentionally' tracks the relation between state and norm."
      *   **Why this matters:** If the book were right that "intentionally" *means* "blame," then asking "Did he do it intentionally?" would be identical to asking "Is he to blame?" But we can imagine scenarios where someone is to blame but didn't do it intentionally (negligence), or did it intentionally but isn't to blame (self-defense). The concepts come apart. The fact that "knowingly" is symmetric proves that the asymmetry in "intentionally" is specific to the *concept of intention*, not just a general halo effect of blame spreading over the whole vignette.

  ### Summary of the Divergence

  The core disagreement is between **Bias** vs. **Constitution**.

  1.  **The Book's View (Bias):** We have a clean, descriptive concept of "intentional." But our emotions are messy. When we see something bad, our anger hijacks the concept and makes us apply it incorrectly. The asymmetry is a **bug** in human cognition.
  2.  **The Expert View (Constitution):** The folk concept of "intentional" is built to track norms. It is designed to distinguish between an agent who merely allows a norm-violating outcome vs. one who embraces it. The asymmetry is a **feature** of human cognition.

  ### Final Verdict

  Your friend's book is peddling a "Hard X-Phi" take that was popular fifteen years ago but has since been refined.
  *   **Trust:** The existence of the effect and the basic vignette setup.
  *   **Distrust:** The claim that "intentionally" means *nothing more* than blame. This is philosophically naive and empirically unsupported (given the non-moral norm variants).
  *   **The Moral:** The conclusion that armchair philosophy is debunked is premature. If the "Constitution" view is right, armchair intuitions are still reliable guides to our concepts; they just reveal that our concepts are normative, not purely physicalistic.

  If you want to push back, focus on **Variant 1**. If the effect happens with pointless company rules, it can't be about *moral blame*. It has to be about how we understand agency in relation to *norms* generally. That single point undermines the book's central "moral judgments in disguise" thesis.
