answer: |-
  **MEMORANDUM**

  **TO:** Head of Drama, Commissioning Editor
  **FROM:** Editorial Standards Committee
  **DATE:** 24 October 2023
  **SUBJECT:** Editorial Ruling: *The Long Silence* (Three-Part Drama)

  **1. Purpose**
  This memo sets out the Committee's ruling regarding the editorial compliance of *The Long Silence*. While the production is recognised as a sympathetic and well-researched contribution to the public understanding of a significant whistleblower case, two specific invented elements breach our standards of accuracy and duty of care.

  **2. The Contested Elements**
  *   **Element A:** A deathbed reconciliation between Miriam Halloran and her daughter, Nell.
  *   **Element B:** A composite colleague to whom Halloran confides a religious crisis, utilising quotes from a 2007 interview regarding her indifference to reputation.

  **3. Deliberation and Reasoning**

  **3.1 On the Invention of Fact and the "Flattering Lie"**
  The Literary Executor (LE) argues that because the inventions cast Halloran in a favourable light, and because the dead cannot be harmed, the inaccuracies are permissible. The Committee rejects the premise that the dead are beyond being wronged. Our Charter's prohibition on presenting invention as fact serves the public interest, not merely the interests of the subject. A public broadcaster contributes to the historical record; to embed flattering falsehoods into that record, even with Estate approval, undermines the trust viewers place in our biographical output. The LE's financial consultancy on the series further compromises the independence of this approval, validating Ms Nell's concern regarding conflict of interest. We cannot outsource editorial judgement to a paid stakeholder, regardless of their proximity to the subject.

  **3.2 On "Inner Life" and Dramatic License**
  The writers argue that the deathbed scene is faithful to Halloran's "inner life," evidenced by an unsent letter. We acknowledge the necessity of dramatization to convey emotional truth. However, "inner life" becomes external fact when it depicts a specific interaction with a living person. To depict a reconciliation that did not occur is not to interpret Halloran's mind, but to rewrite Ms Nell's history. The strongest case for the production is that art requires narrative closure; however, closure cannot be purchased at the expense of a living individual's reputation.

  **3.3 Weight of Wishes: The Dead vs. The Living**
  The Committee assigns significant weight to the stated wishes of the deceased where they are clearly documented. However, these wishes are not absolute. They must be balanced against:
  1.  **Factual Integrity:** The subject's wish for a "flattering" portrait does not override the broadcaster's duty to accuracy.
  2.  **Harm to the Living:** The objections of surviving relatives carry greater editorial weight than the posthumous preferences of the subject, particularly where the depiction alters the relative's own biographical narrative. In this hierarchy, protection of the living from misrepresentation takes precedence over the dramatic satisfaction of the dead's story.

  **4. Decision**
  The Committee grants **Conditional Approval**. The series may not be broadcast in its current form. The following changes are required:

  *   **Regarding Element A (The Daughter):** The deathbed reconciliation scene must be removed or fundamentally altered. It is impermissible to depict a specific interaction with a living person who has explicitly objected to its depiction. The scene may show Halloran dying alone, or longing for contact (referencing the unsent letter), but it must not show Ms Nell attending, nor imply a repentance on her part that she denies.
  *   **Regarding Element B (The Religious Crisis):** This element may remain only if the composite nature of the colleague and the speculative nature of the crisis are made unambiguous within the narrative itself, not merely in credits. The adaptation of the 2007 interview quotes must not be presented as a confession of faith Halloran did not hold.
  *   **Regarding Signalling:** An enhanced on-screen notice is required at the start of Episode One. Standard "Based on true events" wording is insufficient. The notice must state: *"This drama is based on the life of Miriam Halloran. While the core events are factual, certain characters are composites, and specific personal interactions have been dramatised for narrative purposes."* Additionally, an end-card must explicitly note that the relationship with Nell Halloran is depicted fictitiously in respect of the final days.

  **5. Criteria for Future Dramatizations**
  To ensure consistency in future cases involving recently deceased named individuals, the Committee establishes the following three criteria:

  1.  **The Hierarchy of Harm:** Objections from living persons regarding their own depiction will almost always override dramatic license or the Estate's desire for a particular narrative arc. Where a living person is identifiable, their consent is required for invented interactions.
  2.  **The Core Character Test:** Invented material must not contradict the subject's own clearly stated views or known public positions (e.g., attributing a religious crisis to a subject who explicitly rejected one). "Emotional truth" cannot justify contradicting documented testimony.
  3.  **Independence of Estate Approval:** Approval from a Literary Executor or Estate is necessary for access to papers, but it is not sufficient for editorial compliance. Where the Estate holds a financial interest in the production (e.g., consultancy fees), their approval regarding accuracy is considered conflicted and must be verified by independent research.

  **Signed,**

  *Chair, Editorial Standards Committee*
