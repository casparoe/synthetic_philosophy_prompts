          *   *The "Inner Life" Argument (Writers):* Acknowledge dramatic license. Counter with the specific harm caused when "inner life" manifests as external events involving living people (Nell).
          *   *The Living Relative (Nell):* This is the crux. Public broadcasters have a duty of care to living contributors/subjects. Depicting her refusal as a failing she repented is defamatory/harmful.
          *   *The Executor's Conflict:* Acknowledge Nell's point. Financial stake compromises impartiality.
      *   **The Decision:**
          *   *Scene 1 (Nell):* Must be changed. Cannot depict a specific interaction that didn't happen involving a living person who objects. Suggest ambiguity or removal.
          *   *Scene 2 (Religion/Colleague):* Can remain *if* clearly signalled as dramatization of theme, not fact. The quote usage is tricky; needs context.
          *   *Signalling:* Robust "Based on true events" disclaimer isn't enough. Need specific end-card or intro explaining the composite nature and the invented emotional arcs.
      *   **Principles for Future Cases:**
          *   Hierarchy of Harm (Living > Dead).
          *   Distinction between Private Interiority and Public Action.
          *   Independence of Estate Approval (financial conflicts).

  4.  **Refining the Tone (British English & Editorial Standards):**
      *   Use terms like "programme," "licence," "signalling," "duty of care," "public interest."
