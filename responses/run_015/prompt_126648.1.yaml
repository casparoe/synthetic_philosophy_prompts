  2.  **Determine the Decision:**
      *   *Option A: Broadcast as is.* Too risky. Nell's objection is strong (living person harmed). The "inner life" argument is weak justification for specific factual claims about a living person's actions.
      *   *Option B: Withhold.* Too severe. The drama is well-sourced, sympathetic, and the core story is public interest.
      *   *Option C: Require Changes.* Best balance. The deathbed scene directly harms a living relative's reputation. The religious crisis distorts the subject's stated worldview.
      *   *Option D: On-screen Signalling.* Necessary but insufficient on its own. A disclaimer doesn't fix the misrepresentation of the daughter.
      *   *Decision:* Require specific changes *and* impose on-screen signalling. The deathbed scene must be altered or removed to protect the living relative. The religious crisis needs contextualisation to ensure it's not taken as biographical fact.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose and the production in question.
      *   **Summary of Issues:** Briefly outline the two contested inventions.
      *   **Deliberation & Reasoning:**
          *   *The Charter:* Acknowledge the gap (invention about real people).
