answer: |-
  First off, take a deep breath. Two hours on teleosemantics is enough to make anyone's head spin, and the fact that you're still fired up means you hit on one of the genuine, unresolved nerve centers in philosophy of mind.

  Your intuition is spot on, and you actually have the stronger philosophical footing here, specifically regarding the *Knowledge and the Flow of Information* (KFI) version of Dretske. Your roommate is repeating a common selling point of early Dretske (that it's "purely causal/informational" and avoids the "mystery" of functions), but that selling point cracks exactly where you think it does: **misrepresentation.**

  Here is the breakdown of how each handles error, where the normativity hides, and who is actually more vulnerable to the objection.

  ### 1. Dretske's Information-Theoretic Account (KFI)
  **The Mechanism:**
  For Dretske in *KFI*, a state $S$ carries the information that $p$ only if the conditional probability of $p$, given $S$, is 1 (under ideal channel conditions). Meaning is grounded in this nomic (law-like) dependency.

  **The Problem of Misrepresentation:**
  This creates an immediate logical trap. If $S$ *means* $p$ because $S$ carries the information that $p$, and carrying information requires $p$ to be true (probability 1), then **$S$ cannot occur without $p$.** If $S$ occurs and $p$ is false, then $S$ did not carry the information that $p$, and therefore (on this strict definition) $S$ does not mean $p$.
  *   *Result:* Error becomes impossible. If the signal fires, the fact must obtain.

  **Dretske's Fix (The "Learning Period"):**
  To solve this, Dretske introduces a temporal distinction.
  1.  **Acquisition:** During a "learning period," the connection between $S$ and $p$ must be perfect (probability 1). This fixes the content.
  2.  **Deployment:** After content is fixed, $S$ can be triggered by other things (noise, hallucinations, etc.). Now $S$ means $p$, even if $p$ is false.

  **Where the Normativity is Smuggled:**
  This is where your roommate is missing the move. To make the "Learning Period" work, Dretske has to specify **Channel Conditions**. He has to say, "The probability is 1 *assuming no interference*."
  *   *The Normative Question:* What counts as "interference"? What counts as a "relevant alternative"?
  *   *Example:* If a frog's neuron fires for a fly, it carries info about a fly. If it fires for a BB pellet, is that "noise" (misrepresentation) or is it carrying info about "fly-or-BB"?
  *   To distinguish *misrepresentation* from *representing a disjunction*, Dretske must privilege certain causal pathways as "standard" and others as "deviant." That privilege is not found in the physics; it is a normative selection of what the system is *supposed* to be sensitive to.

  ### 2. Millikan's Teleosemantic Account (LTOBC)
  **The Mechanism:**
  Millikan grounds content in **Proper Function**. A representation $S$ means $p$ because $S$ has the proper function of indicating $p$. Proper function is determined by **Selection History** (evolutionary or learning). $S$ exists because ancestors of $S$ successfully mapped to $p$ and guided successful action.

  **The Problem of Misrepresentation:**
  Millikan handles this much more cleanly. Misrepresentation is simply **malfunction**.
  *   *Example:* The heart's function is to pump blood. If it quivers uselessly, it is malfunctioning. It isn't "representing" quivering; it's failing to do what it's *supposed* to do.
  *   Similarly, if a belief state $S$ is triggered when $p$ is false, $S$ is failing to perform its proper function (which is to correspond to $p$).

  **Where the Normativity Lives:**
  Millikan doesn't hide it; she puts it on her sleeve. The "ought" comes from the "did."
  *   *The Normative Claim:* The system *ought* to map to $p$ because systems that *did* map to $p$ survived in the past.
  *   *The Objection:* This faces the Humean challenge (deriving an 'ought' from an 'is'). Just because a mechanism worked in the past doesn't logically entail it *should* work now (the Swampman objection). However, Millikan argues this is a biological normativity, not a moral one, which naturalizes the 'ought'.

  ### 3. The Verdict: Who is More Exposed?

  You asked which account is more exposed to the **original normativity objection** (i.e., "How do you get norms in a naturalistic world?").

  **Your Roommate's Claim:** Dretske is cleaner because he avoids norms.
  **The Reality:** Dretske is *more* exposed, because his claim to avoid norms is false.

  Here is why you win this round:

  1.  **The "Smuggling" Charge:** Dretske claims his account is purely nomic/causal. But as shown above, his solution to misrepresentation relies on distinguishing "standard conditions" from "interference." There is no physical fact of the matter that distinguishes a "standard condition" from a "deviant causal chain" without referencing what the system is *supposed* to do. By denying the normativity while relying on it, Dretske's naturalism is inconsistent. He tries to have his cake (error) and eat it too (pure information).
  2.  **The Collapse into Teleology:** Dretske himself eventually admitted this. In his later book *Explaining Behavior* (1988), he essentially abandoned the pure *KFI* account and incorporated Millikan-style proper functions because he realized information theory alone couldn't handle error. If the author of the theory admits he needed to add teleology to make it work, your roommate's defense of *KFI* Dretske is historically obsolete.
  3.  **Millikan's Honesty:** Millikan is certainly exposed to the normativity objection (the "Is-Ought" gap is real). However, she meets it head-on by offering a genealogical explanation. She doesn't claim there are *no* norms; she claims norms are natural biological facts. Dretske claims there are no norms, but his account secretly requires them.

  ### How to Go Back at Him
  If you want to press the advantage, hit him with this specific dilemma regarding Dretske's "Channel Conditions":

  > "If Dretske's account is purely nomic, then the signal $S$ is just a physical state caused by physical antecedents. If a BB pellet causes $S$, that is just as nomic/lawful as a fly causing $S$. On what *physical* basis does Dretske say the BB case is 'error' and the fly case is 'success'? If he says 'because the system was designed for flies,' he's a teleosemanticist like Millikan. If he says 'because of the probability,' he can't explain error without making error impossible. He can't have it both ways."

  **Summary:**
  *   **Misrepresentation:** Millikan wins. She treats it as biological malfunction. Dretske (*KFI*) struggles to allow error without breaking his definition of information.
  *   **Normativity:** Millikan is more honest; Dretske is more vulnerable. Dretske claims to be norm-free but relies on normative distinctions (standard vs. deviant conditions) to solve the error problem.

  You didn't miss the point. You identified the exact fracture line that forced Dretske to revise his own theory later. Your roommate is defending a version of Dretske that Dretske himself realized was insufficient to handle error.
