      *   *Misrepresentation:* How do you get error? If $S$ means $p$, but $p$ is false, then $S$ occurred without $p$. But if the definition requires probability 1, how can $S$ occur without $p$?
      *   *The "Learning Period" / Channel Conditions:* Dretske distinguishes between the *acquisition* of meaning and the *deployment* of meaning. During the learning period, the connection must be perfect (probability 1). Once established, the state can be triggered by other things (misrepresentation).
      *   *Normativity:* Dretske claims this is purely naturalistic (probabilities, causality). However, critics argue that specifying "channel conditions" or "relevant alternatives" involves a normative selection. Why count *this* as the signal and *that* as noise? Why is *this* the relevant alternative set?
      *   *The "Smuggling":* The user suspects Dretske smuggles normativity. This is a standard critique (e.g., by Fodor, or later teleosemanticists). The choice of *which* dependency fixes content is often pragmatic or normative, not purely physical.

  3.  **Deconstruct Millikan's Account (Teleosemantic):**
      *   *Core Idea:* Content is determined by the *proper function* of a mechanism, which is determined by its selection history (evolutionary or learning history). A representation represents what it is *supposed* to correspond to for the system to perform its function.
      *   *Misrepresentation:* Easy. A state misrepresents if it fails to perform its proper function. The heart pumps blood (function); if it quivers, it malfunctions. Similarly, a belief state is *supposed* to map to $p$; if it maps to not-$p$, it's a malfunction (misrepresentation).
      *   *Normativity:* Millikan embraces normativity but naturalizes it via history. The "ought" comes from the "did" (ancestral success).
