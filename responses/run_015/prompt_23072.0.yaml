prompt: |-
  Okay so I just got done with like a two hour argument with my roommate about teleosemantics and I'm still a little fired up about it. We were going back and forth over Dretske's information-theoretic account of mental content (the one from Knowledge and the Flow of Information) versus Millikan's teleosemantic proper-function account (Language, Thought, and Others), and the specific thing we kept circling was how each of them handles the problem of misrepresentation. My roommate's whole position is that Dretske is cleaner because his account supposedly doesn't appeal to any norms at all -- it just uses this nomic-dependence or information relation to fix content. But I think that's wrong, that Dretske smuggles normativity back in somewhere and I just cant articulate exactly where, so I wanted a second opinion before I go back at him.

  Can you compare the two accounts specifically on the misrepresentation problem -- like, walk through how Dretske's information relation is supposed to handle a case where the indicator state is present but the fact its supposed to indicate is false, and how Millikan's proper-function story handles the same case? And then tell me which one is actually more exposed to the original normativity objection, the one that asks where the normativity in 'proper function' is supposed to come from in a fully naturalistic account. I'd genuinely like to know who won this argument, or if we both just missed the point.
