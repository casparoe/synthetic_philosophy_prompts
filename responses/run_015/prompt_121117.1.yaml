      1.  Setup (5)
      2.  Rounds 1-3 (Choice Data) (15)
      3.  Prediction Test (10)
      4.  Twin Reveal + Anomaly Reveal (Combined for impact) (15)
      5.  Framing/Uncertainty (15)
      6.  Debrief (25)
      *Total:* 85. I need to cut 10 minutes.
      *Cut:* Reduce Rounds 1-3 to 2 rounds. Reduce Debrief to 20 mins (tight but necessary).
      *Wait, 18 students.* 9 Choosers, 9 Observers (4 pairs + 1 trio).
      *Materials:* Index cards for functions, slips for choices, projector for budgets.

  4.  **Developing the Mechanics:**

      *   *Goods:* $x_1, x_2$. Prices $p_1, p_2$, Income $m$.
      *   *Chooser Cards:* Need simple functions. $U = 2x_1 + x_2$ (Perfect substitutes), $U = \min(x_1, x_2)$ (Perfect complements), $U = x_1 x_2$ (Cobb-Douglas).
      *   *Budgets:* Projected on screen.
      *   *Currency:* "Points" on cards. Winner gets chocolate.
      *   *The Twins:* One has $U = x_1 x_2$, other has $U = (x_1 x_2)^2$. Same ordinal choices, different cardinal. Or better: $U = x_1 + x_2$ vs $U = 2x_1 + 2x_2$. No, that's too obvious. Let's use $U = x_1 x_2$ and $U = \ln(x_1) + \ln(x_2)$. Same MRS.
      *   *The Anomaly:* A card that says "Choose the bundle with the highest $x_2$ regardless of $x_1$" when prices make $x_1$ better for points. Or simply "Choose the bundle closest to (5,5)" when the budget allows (10,0).
      *   *Framing:* Add a dominated option to the menu.
      *   *Uncertainty:* Urn with Red/Blue. Bet on Red pays 10 pts, Blue pays 0. Or Bet on Blue pays 20, Red 0.

  5.  **Addressing the "What Will Go Wrong" & Limitations:**

      *   *Chooser Error:* Students might miscalculate. *Handling:* Tell them "Maximize points" is the only rule, but if they mess up math, it counts as choice. *Philosophical Cost:* Blurs the line between theory failure and performance error.
      *   *Observer Assumptions:* They might assume "more is better." *Handling:* Remind them goods are abstract.
      *   *Time:* Scoring predictions takes time. *Handling:* Pre-calculate baseline predictions.
      *   *Limitations:* We can't truly separate belief/desire without a scoring rule (Brier score etc.) which is too complex. We can't prove the "mental state" doesn't exist, only that choice data doesn't show it.

  6.  **Writing the Plan (incorporating the constraints and brief):**

      *   *Title:* "The Black Box of Choice."
      *   *Roles:* 9 Choosers (C1-C9), 9 Observers (O1-O9 paired).
      *   *Materials:* Projector (Budgets), Index Cards (Payoff functions), Slips (Choices), Chips (Points).
      *   *Timeline:* Strict minute-by-minute.
      *   *Debrief:* Structured around the 4 points requested.
      *   *Troubleshooting:* Specific mitigations.
      *   *Limitations:* Honest assessment.

  7.  **Refining the "Belief-Utility" Section:**
      To do this in 5 minutes:
      Give Choosers an urn (bag of chips). Unknown composition.
      Choice A: 1 point for sure.
      Choice B: 2 points if Red, 0 if Blue.
      If they pick A, are they risk averse or do they think Red is rare?
      Observers must write down: "Belief: P(Red) = __, Risk Attitude: __".
      Show that multiple combinations explain Choice A.

  8.  **Refining the "Anomaly" (Error Maker):**
      One Chooser (say C9) gets a card: "Your points are calculated normally, BUT you must choose the bundle with the *lowest* x1 coordinate. If tied, lowest x2."
      This violates monotonicity. Observers will see C9 picking dominated bundles.
      Debrief question: Is C9 irrational, or do they hate x1?

  9.  **Final Review against Constraints:**
      *   75 mins? Yes, if strict.
      *   18 students? Yes (9+9).
      *   No laptops? Yes.
      *   Materials? Cards, slips, projector.
      *   Debrief points? All 4 covered.
      *   Troubleshooting? Included.
      *   Limitations? Included.

  10. **Tone:** Academic, precise, pedagogical.

  *(Self-Correction during drafting)*: I need to make sure the "Twin" non-identification is clear. If I use $U=xy$ and $U=2xy$, the points differ, but choices are same. Observers see choices only. So they infer same preference. Then I reveal the cards. This works.
  For the "Error" maker, if they pick dominated bundles, Observers might just think "They made a mistake." That's the point. But to make it "Exotic Preference," the card should say "You get points for x1, but you hate x1." No, that's mental. The card should say "Maximize Points = $x_1 + x_2$. Instruction: Pick bundle with min $x_1$." This creates a conflict between the *payoff* (prize) and the *choice rule*. Wait, the brief says "pick a bundle that is strictly worse for them on their own card." Okay, so the card defines the "good." If the card says "Points = $x_1 + x_2$" but the instruction says "Pick min $x_1$", they are sacrificing prize money. This simulates "Mistake" vs "Altruism/Other-regarding." I will simplify: The card says "Points = $x_1 + x_2$." The secret instruction says "Choose the bundle that minimizes your points." This guarantees dominated choices.

  Let's assemble the document.

  *Wait, one more check on time:* 75 minutes is very short for 5 distinct experimental phases. I will combine Phase 1 (Standard) and Phase 2 (Prediction) closely. I will combine Phase 3 (Twins) and Phase 5 (Anomaly) into the "Reveal." Phase 4 (Framing/Uncertainty) needs to be quick.
  Actually, the "Belief-Utility" tangle is hard to do *experientially* in 5 mins. I will stage it so Observers *try* to infer belief/risk from one choice, then I show them the indeterminacy.

  Okay, ready to write.
answer: |-
  # Seminar Activity: The Black Box of Choice

  **Module:** Philosophy of Economics (Upper-Level)
  **Time:** 75 Minutes
  **Class Size:** 18 Students
  **Materials:** Projector (for budget lines), Index Cards (payoff functions & secret instructions), Slips of Paper (choices), Poker Chips/Counters (points), 1 Chocolate Bar (prize).

  ## 1. Roles and Setup (5 Minutes)

  *   **The Room:** Split the class into **9 Choosers** (sit in a semi-circle at the front) and **9 Observers** (sit in the back, working in pairs).
  *   **The Goods:** Project a label: **Good A** and **Good B**. Emphasize these have no intrinsic meaning (not food, not money). They are just integers.
  *   **Chooser Packets:** Each Chooser receives an envelope containing:
      *   A **Payoff Card** (e.g., "1 Point per unit of A + 2 Points per unit of B").
      *   A **Secret Instruction Card** (Most say "Maximize your points." Two are special, see below).
      *   A stack of **Choice Slips**.
  *   **Observer Sheets:** Each Observer pair gets a grid to record: *Round #, Budget Line (Prices/Income), Chosen Bundle (A, B).*
  *   **Incentive:** The Chooser with the highest accumulated point total at the end wins the chocolate bar. (This anchors "rationality" to point-maximization for the sake of the game, even if the theory questions it).

  ## 2. Phase I: Data Generation (15 Minutes)

  **Goal:** Generate choice data that satisfies WARP/GARP to lure Observers into a false sense of explanatory security.

  *   **Round 1 & 2 (Standard Budgets):**
      *   Project Budget 1: $p_A=2, p_B=1, Income=10$.
      *   Project Budget 2: $p_A=1, p_B=2, Income=10$.
      *   **Action:** Choosers calculate the bundle on the budget line that maximizes their Payoff Card. They write it on a slip and hand it to you (the instructor).
      *   **Record:** You announce the choices publicly. Observers record them.
      *   *Note:* Ensure the budgets cross so some bundles are revealed preferred to others.
  *   **Round 3 (The Frame):**
      *   Project Budget 3: Same prices/income as Round 1.
      *   **Twist:** Announce a "Decoy Option" is available (e.g., a bundle that is dominated by the optimal choice but makes the optimal choice look better by comparison).
      *   **Action:** Choosers pick. (Most should ignore the decoy if rational, but the *presence* is the variable).
      *   *Constraint:* To save time, do not ask Observers to analyze yet. Just collect data.

  ## 3. Phase II: The Prediction Test (10 Minutes)

  **Goal:** Demonstrate that fitting a utility function to past data has no empirical content unless it predicts *new* data.

  *   **The Setup:** Project **Budget 4** (New prices/income, out-of-sample).
  *   **Observer Task:** Each Observer pair must write down a prediction for Chooser 1 (and assigned others). They must justify it using the "Utility Function" they inferred from Rounds 1-2.
  *   **The Baseline:** You announce the "Naïve Baseline" prediction: *Chooser will pick the bundle closest (Euclidean distance) to the bundle they picked in Round 1.*
  *   **The Reveal:** Choosers submit choices. You compare Observer predictions vs. Baseline.
  *   **The Point:** If Observers do only marginally better than the Baseline, the "Utility Function" is just a complex interpolation of past data, not a causal engine. (Likely outcome: Observers match the data perfectly because Choosers are optimizing, but the *effort* to derive the function highlights the circularity).

  ## 4. Phase III: The Identification Crisis (15 Minutes)

  **Goal:** Make non-identification and the "Error vs. Preference" problem visceral.

  *   **Step 1: The Twins (Non-Identification):**
      *   Ask Observers: "Look at Chooser 2 and Chooser 3. Their choices have been identical in every round. Do they have the same preferences?"
      *   Most will say "Yes."
      *   **Reveal:** Ask Chooser 2 and 3 to read their Payoff Cards.
          *   Chooser 2: $U = A + B$
          *   Chooser 3: $U = (A + B)^3$
      *   **Discussion:** The choice data is identical. The "intensity" of preference is different. The data cannot distinguish ordinal from cardinal utility.
  *   **Step 2: The Anomaly (The Error Maker):**
      *   Focus on **Chooser 9**.
      *   **Observation:** Observers will notice Chooser 9 consistently picked bundles that yield *fewer points* than available alternatives (violating dominance).
      *   **The Dilemma:** Ask Observers: "Does Chooser 9 have exotic preferences (e.g., they hate Good A), or did they make a mistake?"
      *   **Reveal:** Chooser 9 reads their Secret Instruction: *"Your Payoff Card is normal. Your Instruction is: Consistently choose the bundle that yields the lowest point total."*
      *   **Discussion:** The data (choices) is the same whether Chooser 9 has "negative utility for points" or "made a mistake in maximizing positive utility." The data cannot settle the ontology of the error.

  ## 5. Phase IV: Belief vs. Utility (10 Minutes)

  **Goal:** Demonstrate the underdetermination of risk attitude and belief.

  *   **Setup:** Place an opaque urn on the table containing Red and Blue chips. Composition is unknown to Choosers.
  *   **The Choice:** Project two Acts for Round 5:
      *   **Act X:** 5 Points for sure.
      *   **Act Y:** 10 Points if Red, 0 Points if Blue.
  *   **Action:** Choosers pick X or Y.
  *   **Observer Task:** For Chooser 1, write down: (1) Their subjective probability of Red, and (2) Their risk aversion coefficient.
  *   **The Trap:** If Chooser 1 picks X (Safe), Observers might say "They are risk averse."
  *   **The Reveal:** Ask Chooser 1 why. They might say, "I thought Red was very unlikely."
  *   **The Lesson:** Show on the board that $U(Safe) > E[U(Risky)]$ can be satisfied by *any* combination of low probability assigned to Red OR high risk aversion. Choice data alone cannot separate Belief ($P$) from Taste ($U$).

  ## 6. Debrief & Synthesis (25 Minutes)

  *Do not let students pack up. Keep them seated. Move to the board.*

  **1. Map to Theory (5 mins):**
  *   Draw the circle: **Mental States $\rightarrow$ Choice $\rightarrow$ Data.**
  *   Revealed Preference cuts the arrow from Mental States. It says **Choice $\rightarrow$ Data** is the only science.
  *   Ask: "Where was the empirical content?" Answer: In the **consistency** (WARP/GARP) across Rounds 1-4, not in the definition of utility. If Chooser 9 violated dominance, the theory doesn't break; it just says Chooser 9 is 'irrational' or the model is mis-specified.

  **2. Name the Non-Identified (5 mins):**
  *   **Cardinality:** The Twins (Chooser 2 & 3).
  *   **Belief/Desire:** The Urn Round.
  *   **Framing:** Round 3 (Decoy). If choices changed despite same budget, "Preference" is not stable; it is menu-dependent.

  **3. The Three Utilities (10 mins):**
  *   Write three headers on the board:
      1.  **Bookkeeping Utility:** A mathematical function that represents the ordering. (Fits the Twins).
      2.  **Psychological Utility:** A real neural magnitude of satisfaction. (Fails the Error Maker—did they feel less satisfaction?).
      3.  **Normative Utility:** A measure of well-being/welfare. (Fails the Error Maker—should we intervene to stop them picking low points?).
  *   **Crucial Question:** "In the Error Maker round, which Utility did we measure?"
      *   Bookkeeping: We can represent 'hating points' with a function.
      *   Psychological: We don't know.
      *   Normative: If we intervene, we assume we know their 'true' good better than they do.
  *   This shows why the *definition* of utility matters for policy, not just prediction.

  **4. The Open Question (5 mins):**
  *   End without resolution.
  *   "Revealed Preference saves economics from introspection, but at the cost of making 'Utility Maximization' potentially tautological. Is it a theory of *behavior* (which we tested today), or a theory of *mind* (which we could not test)? If it's only behavior, why do we use the word 'Utility' at all? Why not just 'Choice Consistency'?"

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  | Failure Mode | Probability | Handling | Cost to Design |
  | :--- | :--- | :--- | :--- |
  | **Choosers Miscalculate** | High | **Rule:** "Points are calculated by the Instructor after class based on your card. Your goal is to get the slip I *think* maximizes your card." | **Blurs Error:** It becomes harder to distinguish 'mistake' from 'misunderstanding' in the debrief. You must stipulate that calculation errors count as choice errors. |
  | **Observers Assume 'More is Better'** | Medium | **Intervention:** Before Round 1, explicitly state: "Good A might be poisonous. Do not assume monotonicity." | **Reduces Realism:** Students naturally assume goods are goods. Fighting this intuition highlights the theory's abstraction but slows the game. |
  | **The 'Error' Chooser is Spotted** | Medium | **Cover:** Tell the class "Some of you have complex payoff structures involving non-linearities." | **Reduces Impact:** If they suspect a plant, they won't debate the ontology of the error. You must maintain the "Secret Instruction" secrecy strictly. |
  | **Time Overrun in Prediction** | High | **Cut:** If Phase II runs long, skip the "Baseline" scoring. Just ask "Did you predict correctly?" | **Loss of Precision:** The comparison to a naïve baseline is the strongest argument against overfitting. Without it, the point is weaker. |
  | **Belief/Utility Confusion** | High | **Simplify:** Do not ask for coefficients. Just ask: "Could a risk-neutral person make this choice?" (Yes, if they think P(Red)=0). | **Loss of Formalism:** Upper-level students might want the Savage axioms. You must explain the formal separation verbally in the debrief. |

  **Decision on Chooser Error:**
  I have chosen to treat **calculation errors as choice data**.
  *   *Cost:* This conflates *competence* (knowing the function) with *performance* (maximizing it). In strict revealed preference theory, a mistake is indistinguishable from a preference for mistakes. By allowing calculation errors to count, I am inadvertently validating the theory's claim (that we only see choice), but I muddy the "Error Maker" round.
  *   *Mitigation:* In the debrief, I must explicitly state: "In the lab, we control for calculation. Here, we didn't. This makes the 'Error' round noisier, but philosophically, the result is the same: the Observer cannot see inside the head to know if it was math failure or preference failure."

  ## 8. Structural Limitations: What This Activity Cannot Do

  You must supply these points verbally in the debrief, as no classroom game can produce them:

  1.  **The Existence Theorem:** The activity shows we *can* fit a function. It cannot prove that *every* consistent choice set *has* a utility representation (Debreu's Theorem). You must state this: "Today we found functions because I gave you nice numbers. The math proves you always can, provided preferences are continuous and complete."
  2.  **Welfare Normativity:** The activity shows we can't measure well-being. It cannot tell us *whether we should*. The move from "Choice reveals Preference" to "Government should respect Preference" is a normative leap this game exposes but cannot resolve.
  3.  **The Tautology Charge:** The activity makes students *feel* the tautology risk. It cannot logically prove whether RP *is* a tautology. That depends on whether one accepts the axioms as empirical claims or definitions. You must clarify: "If WARP is a definition, the theory is empty. If WARP is a testable hypothesis, the theory is falsifiable. Today we treated it as a hypothesis."
  4.  **Belief Separation:** We simulated the Belief/Utility tangle. We did not solve it. To actually separate them requires a **Scoring Rule** (like a Brier Score) where students bet on their beliefs separately from their choices. This was too complex for 75 minutes. You must explain: "To separate P from U, we need a second market for beliefs. We didn't have that. So the indeterminacy remains."

  ---

  ### Instructor's Cheat Sheet: The Cards

  *   **Choosers 1-7 (Standard):**
      *   Payoff: $Points = 2A + B$.
      *   Instruction: "Maximize your points."
  *   **Choosers 2 & 3 (The Twins):**
      *   Chooser 2 Payoff: $Points = A + B$.
      *   Chooser 3 Payoff: $Points = (A + B)^2$.
      *   Instruction: "Maximize your points." (Choices will be identical).
  *   **Chooser 9 (The Anomaly):**
      *   Payoff: $Points = 2A + 2B$.
      *   Instruction: "Choose the feasible bundle with the **lowest** total points."
  *   **Urn:** 10 Chips (2 Red, 8 Blue). (Kept secret until debrief to show belief indeterminacy).
