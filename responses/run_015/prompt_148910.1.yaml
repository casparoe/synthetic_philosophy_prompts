          *   **P-Consciousness (Phenomenal):** Experiential character, "what it is like," qualia. Non-functional (in the strict sense), not defined by what it *does*.
          *   **Relationship:** They usually go together, but can come apart. P can overflow A (Iconic memory/Sperling). A without P (Zombies/Blindsight - though Block is careful here).
          *   **Cognitive Penetrability:** Block argues P-consciousness is *not* cognitive. It's distinct from belief/judgment.
          *   **Functional Role:** Block denies P-consciousness has a *definitional* functional role, but does he deny it has *any* causal power? This is a tricky spot. He often says it's not *defined* by function, but implies it might have effects. However, the "epiphenomenalist" worry is the big critique.
      *   *Global Workspace Theory (GWT) (Baars, Dehaene, Changeux):*
          *   **Core Claim:** Consciousness *is* global availability. Information becomes conscious when broadcast to multiple specialized modules.
          *   **Relation to A/P:** GWT is typically an account of A-consciousness. Dehaene often identifies A and P (or claims P supervenes on A). They are "Global Neuronal Workspace" theorists.
