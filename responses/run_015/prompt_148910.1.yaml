          *   "GWT... claim that once information gets broadcast... that's literally all consciousness is; there's no leftover 'feel'..." (Mostly accurate for Dehaene's strong stance).
          *   "Block thinks phenomenal consciousness can overflow access..." (Accurate).
          *   "But he also insists phenomenal consciousness is totally non-cognitive: it doesn't guide behaviour, can't be reported even in principle, and has no functional role whatsoever..." (Here's the danger zone. "No functional role whatsoever" is the epiphenomenalism charge).
          *   "Basically a private movie playing with no audience." (Metaphorically okay, but implies isolation).
          *   "Host concludes that Block's phenomenal consciousness is undetectable and therefore collapses back into access consciousness..." (The philosophical punchline).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the role, set the stage. This is a classic debate (Block vs. Dennett/Dehaene).
      *   **Part 1: Brainstorming/Foundations:**
