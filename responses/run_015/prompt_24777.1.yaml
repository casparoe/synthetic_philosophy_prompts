  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Structure and Resolution of the Old Evidence Problem in Bayesian Epistemology
  **Parties:** The Synchronist Camp (SC) and The Diachronicist Camp (DC)
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS AND SHARED FORMALISM

  Both camps agree to the following foundational claims for the purpose of this collaboration. These claims establish the common ground from which our disagreements proceed.

  1.  **Probabilistic Framework:** We operate within a standard Bayesian framework where agents hold credence functions $P$ satisfying the Kolmogorov axioms. Hypotheses ($H$) and Evidence ($E$) are propositions within the agent's algebra.
  2.  **The Formal Problem:** We agree that the "Old Evidence Problem" arises from the conjunction of three plausible claims which appear inconsistent:
      *   (A) **Bayesian Conditionalization:** Confirmation occurs via conditionalization: $P_{new}(H) = P_{old}(H|E)$.
      *   (B) **Certainty of Old Evidence:** For old evidence $E$, the agent's prior credence is $P_{old}(E) = 1$.
      *   (C) **Confirmation Intuition:** Old evidence (e.g., the perihelion of Mercury) genuinely confirms new hypotheses (e.g., General Relativity).
      *   *Consensus:* Given (A) and (B), $P(H|E) = P(H)$, which contradicts (C). Something must give.
  3.  **The Paradigm Case:** We agree that the historical episode of Einstein and the anomalous perihelion of Mercury is the paradigmatic instance of the problem. $E$ (Mercury's orbit) was known with high certainty before $H$ (General Relativity) was formulated, yet $E$ is widely regarded as strong evidence for $H$.
  4.  **Distinction between Logic and Psychology:** We agree that there is a distinction between the *logical relation* between propositions ($H$ entails $E$) and the *psychological event* of an agent realizing that relation. We disagree on which of these constitutes "confirmation."
  5.  **Goal of Theory:** We agree that a successful theory must explain why the Mercury case is epistemically significant without violating the core norms of rational credence management. We disagree on whether that significance is captured by the term "confirmation."

  ## 2. STATEMENT OF DISAGREEMENTS AND CRUXES

  The following table outlines the precise points of divergence. For each crux, we have identified a concrete case or argument to be analyzed during the collaboration, along with pre-registered predictions regarding the outcome of that analysis.

  | Crux | Synchronist Camp (SC) Position | Diachronicist Camp (DC) Position | Concrete Test Case / Argument | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of Confirmation** | **Confirmation is Synchronic Support.**<br>Confirmation is a timeless, logical relation defined by $P(H|E) > P(H)$. Time of acquisition is irrelevant. If $E$ supports $H$, it confirms $H$, regardless of whether $P(E)=1$. | **Confirmation is Diachronic Update.**<br>Confirmation is a process of credence revision. $E$ confirms $H$ for agent $A$ only if $A$'s credence in $H$ rises *upon the acquisition of* $E$ (or a proxy for $E$). | **The "Static Mathematician" Case:**<br>An agent is certain of $E$. At $t_1$, they formulate $H$ and see $P(H|E) > P(H)$. At $t_2$, they find a proof that $H \vdash E$.<br>*Question:* At what time does $E$ confirm $H$? | **SC Prediction:** Analysis will show $E$ confirms $H$ at $t_1$. The proof at $t_2$ merely reveals a relation that already obtained. The diachronic requirement conflates *discovery* with *support*.<br>**DC Prediction:** Analysis will show confirmation occurs only at $t_2$. At $t_1$, the agent has not updated on the logical connection. Without the update, there is no epistemic *gain*, only static potential. |
  | **2. The Status of 'Fitting'** | **'Fitting' is Confirmation.**<br>When a hypothesis $H$ is constructed to fit known data $E$, this *is* confirmation. The fact that $H$ was designed to fit $E$ does not negate the probabilistic support $P(H|E) > P(H)$. | **'Fitting' is Distinct from Confirmation.**<br>"Fitting" is a theoretical virtue or a necessary condition for viability, but it is not confirmation *stricto sensu*. Confirmation requires the risk of falsification, which is absent when $E$ is already known. | **The "Curve Fitting" Case:**<br>Compare $H_{pred}$ (predicts novel $E_{new}$) vs. $H_{fit}$ (constructed to fit old $E_{old}$). Both entail their respective $E$'s equally well.<br>*Question:* Do they receive equal confirmation scores? | **SC Prediction:** Formal measures (Likelihood Ratio, etc.) will show equal confirmation. Any intuition that $H_{pred}$ is better is a pragmatic heuristic about fraud or independence, not a feature of confirmation itself.<br>**DC Prediction:** Formal measures must be adjusted (e.g., via use-constructivism) to show $H_{pred}$ receives higher confirmation. If the model treats them equally, the model fails to capture the epistemic value of novelty. |
  | **3. The 'Discovery of Connection' Move** | **The Move is a Fudge.**<br>Conditioning on the proposition "$H \vdash E$" (the Garber solution) is an ad hoc modification to save the diachronic thesis. It violates the Rigidity constraint and treats logical facts as empirical updates. | **The Move is Necessary Repair.**<br>Conditioning on "$H \vdash E$" is a legitimate Bayesian update on a new piece of information (the logical relation). It preserves the diachronic nature of learning without abandoning Bayesianism. | **The "Logical Omniscience" Argument:**<br>Standard Bayesianism assumes agents know all logical consequences of their beliefs. If so, "$H \vdash E$" is already known.<br>*Question:* Does the Garber solution require abandoning logical omniscience, and if so, at what formal cost? | **SC Prediction:** Analysis will show the Garber solution creates more problems than it solves, specifically requiring a non-standard probability space that undermines the simplicity of the Bayesian framework.<br>**DC Prediction:** Analysis will show that relaxing logical omniscience is independently motivated in epistemology. The Garber solution is a feature, not a bug, allowing Bayesianism to model bounded rationality. |

  ## 3. COMMITMENT TO RESOLUTION

  Both camps agree that the success of this collaboration will not be measured by one side conceding, but by the precision with which the remaining disagreement is characterized.

  *   **If Crux 1 is resolved:** It will be by demonstrating that one definition of "confirmation" renders the term useless for either formal modeling (SC risk) or historical analysis (DC risk).
  *   **If Crux 2 is resolved:** It will be by agreeing on a formal measure that either successfully distinguishes fitting from predicting (DC win) or demonstrates that the distinction is extra-probabilistic (SC win).
  *   **If Crux 3 is resolved:** It will be by determining whether the "logical connection" proposition can be integrated into the algebra without violating the axioms of probability.

  We commit to publishing our findings jointly, with the disagreements section preserved exactly as stated above, updated only with the results of the test cases.

  __________________________
  **Lead Representative, Synchronist Camp**

  __________________________
  **Lead Representative, Diachronicist Camp**
