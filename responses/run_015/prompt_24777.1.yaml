      *   *Diachronicist Core:* Confirmation = Learning. $E$ confirms $H$ for agent $A$ at $t$ if $A$'s credence in $H$ rises *because* of $E$. If $P(E) = 1$ (old evidence), standard conditionalization yields no change. Need a mechanism (e.g., Garber-style conditionalization on logical connections).
      *   *The "Old Evidence Problem":* Standard Bayesianism says if $P(E)=1$, then $P(H|E) = P(H)$. So $E$ cannot confirm $H$. But intuitively, old evidence (like Mercury) *did* confirm GR.
