answer: |-
  Your "direction-of-use" test is not half-baked; it is a functional ethics of care disguised as a finding aid. It works because it identifies the *vector of power* in the record. However, it stumbles on Cases 7 and 9 because there is no physical record to test—only an absence. To make it hold all ten, you need to expand the definition of "record" to include "the shape of the hole where a record should be."

  Here is the repaired principle, renamed for precision, followed by the clause-by-clause application you requested.

  ### The Principle of Consequential Custody

  **Core Statement:** Custody and control of a record belong to the party that bears the consequence of its creation. If a record was created to act *upon* a person, the consequence lies with that person (or their descendants). If a record was created to express a self, the consequence lies with the creator. If a record is missing due to an administrative act, the consequence lies with the public, and the absence itself becomes a record.

  This single principle gets all ten, provided you accept that *deletion* and *silence* are active administrative verbs, not passive states.

  ### Clause-by-Clause Application

  **Clause 1: The Instrument Clause**
  *If a record was created to administer, tax, police, or categorize a population, moral custody lies with that population.*
  *   **Motivated by Case 1 (Tax Rolls):** The record was an instrument of extraction. The consequence was financial burden and surveillance. Therefore, descendants control the utility (indexing) to turn an instrument of extraction into an instrument of recovery.
  *   **Motivated by Case 2 (Institution Registers):** The record was an instrument of removal. The consequence was loss of family. Therefore, the descendant community sets access, not the archive.
  *   **Motivated by Case 4 (Arrest Photos):** The record was an instrument of stigma. The consequence was criminalization. Therefore, description must shift agency from the "criminal" to the "law" that made them one.
  *   **Motivated by Case 8 (Clinic Registers):** The record was an instrument of care/control. The consequence is privacy and data sovereignty. Therefore, the community's request to remove copies overrides the archive's instinct to hoard, because the archive holding a copy replicates the institutional control.

  **Clause 2: The Gaze Clause**
  *If a record depicts a person through an external, categorizing gaze, the power to describe belongs to the depicted.*
  *   **Motivated by Case 5 (Missionary Photos):** The image captures life; the caption captures power. The consequence of the caption is dehumanization. Therefore, the image is kept as evidence of the village, but the caption is retired as evidence of the missionary. The community re-describes to reclaim the gaze.

  **Clause 3: The Toxic Knowledge Clause**
  *If releasing a record would replicate the harm originally intended by its creation, access must be deferred until the harm is inert.*
  *   **Motivated by Case 3 (Informant Files):** The record was created to divide a community. Opening it now replicates the division and risk of retribution. The consequence of access is current community safety. Therefore, seal it. The historian's desire is secondary to the community's safety.
  *   **Motivated by Case 6 (Oral History/Massacre):** The record contains trauma. The consequence of premature release is renewed grief or danger. Therefore, the donor's condition (wait until perpetrators' families are dead) is a safety mechanism, not a restriction. Honor it.

  **Clause 4: The Archival Act Clause**
  *The creation, destruction, or silence of records by an authority is itself a record of power and must be documented as such.*
  *   **Motivated by Case 7 (Deleted Emails):** The deletion was an act of power to obscure accountability. The consequence is a loss of public memory. Therefore, the archive must record the deletion as an event. A flood is weather; deletion is a statement.
  *   **Motivated by Case 9 (Silence/Travelling Community):** The absence is not neutral; it is the result of exclusionary collecting policies. The consequence is erasure. Therefore, the catalogue must explicitly note the silence. The gap is part of the holding.

  **Clause 5: The Functional Truth Clause**
  *If a false record was used to exercise power, it is retained as evidence of that power, not as evidence of fact.*
  *   **Motivated by Case 10 (Forged Memo):** The forgery caused real-world sackings. The consequence was loss of livelihood. Therefore, keep the forgery, but label it as a weapon. It is true evidence of a lie that worked.

  ---

  ### The Prediction: A Case You Didn't List

  **The Case:** A private corporation donates 30 years of internal environmental testing logs. The logs show they knew about groundwater contamination in a local township 15 years before they reported it. The donation is offered as a "gift to local history."

  **What the Principle Predicts:**
  1.  **Custody:** These are *Instruments* (Clause 1). They were created to manage risk for the company, but the consequence of the silence fell on the township. Moral custody lies with the township.
  2.  **Access:** You cannot accept this as a standard "open access" donation. You must notify the affected community before processing.
  3.  **Description:** You cannot describe this as "Corporate Records, Series B." You must describe it as "Evidence of Contamination, 1990–2020."
  4.  **Action:** If the community wants these used for litigation, the archive cannot stand in the way. The "gift" is actually a liability. The principle predicts you might have to *refuse* the donation if the donor insists on restrictions that protect the corporation rather than the community.

  ---

  ### The Unlabelled Box of Children's Photographs

  This is the hardest case because the "Direction-of-Use" test lacks a target. We don't know *who* the people are to ask *them*.

  **The Principle's Verdict:**
  Do not digitize for public crowdsourcing.
  **Reasoning:** Crowdsourcing asks the public to treat these children as puzzles to be solved for the archive's benefit. This replicates the institutional gaze (Clause 2): the children are objects of study, not subjects of life. It also risks misidentification, which creates new harm.

  **The Prescription:**
  1.  **Stop:** Do not put them online.
  2.  **Consult:** Find the *institution's* survivors' network (even if you don't know the kids, you know the place). Show the photos *only* to that closed group.
  3.  **Labour:** Do not ask them to do metadata labour for free. If they identify them, offer to pay them for their oral history or expertise, or treat it as a donation of knowledge that grants them control over those specific files.
  4.  **Default:** If no one can be found, the photos remain in the dark. Preservation without access is better than exposure without consent. The principle prioritizes *non-replication of harm* over *completeness of the catalogue*.

  ---

  ### Where the Reasoning Breaks (and What Changes My Mind)

  **The Breaking Point: The "By and About" Collapse.**
  The principle struggles when the person acting *and* the person acted upon are the same, specifically in **Activist Records**.
  *   *Case:* A protest group documents their own illegal activities to hold their leadership accountable. They donate the files.
  *   *Conflict:* The records were made to act *on* the members (internal discipline), but also *by* the members (self-governance). If you seal them to protect members, you hide the history of the movement's internal conflicts. If you open them, you expose members to state surveillance.
  *   *Failure:* The "Direction-of-Use" cannot decide who the "consequence bearer" is—the individual member or the collective movement?

  **What Would Change My Mind:**
  I would drop the **Toxic Knowledge Clause (Case 3 & 6)** if **Legal Justice** is imminent.
  *   *Scenario:* If the informant file (Case 3) or the oral history (Case 6) contains the *only* evidence required to exonerate a living person wrongly imprisoned, or to prosecute an active abuser.
  *   *Reasoning:* The principle prioritizes community safety and trauma. But if the archive becomes a vault that protects perpetrators by hiding evidence, it becomes complicit in the ongoing harm.
  *   *The Flip:* In this specific instance, the "consequence of silence" outweighs the "consequence of exposure." The archive must become a witness, not just a guardian.

  **The Instinct on Case 8 (Clinic Registers):**
  You suspected you were wrong to want to keep a copy. The Principle says you are *right* to want to keep a copy, but *wrong* to assume you own the rights to it.
  *   *Correction:* Keep the copy for preservation (in case the community loses theirs to fire/flood), but legally deed the *access rights* to the community. Your instinct to preserve is archival duty; your instinct to hand over control is ethical duty. You can do both. The break happens if you keep the copy *and* deny the community the right to destroy it later.

  Your gut is working. The "Direction-of-Use" is simply the mechanism by which you detect who holds the moral title. Trust it, but write the "Absence" clause into your policy so you don't get caught when the box is empty.
