answer: |-
  **Title:** The Kelly Criterion: Rational Imperative or Logarithmic Artifact?

  **Introduction**

  The confusion you are experiencing is not a failure of comprehension; it is a reflection of a decades-old schism in decision theory. On one side stand the "growth optimists" (like Leo Breiman and Edward Thorp), who argue that the Kelly criterion is an objective imperative for anyone facing repeated favorable gambles. On the other stand the "utility purists" (most notably Paul Samuelson), who argue that Kelly is merely the solution to a specific utility function and carries no special normative weight for agents with different risk preferences.

  You have asked for a verdict, not a summary. Here it is: **The Kelly criterion is not a genuine, free-standing norm of rationality. It is strictly the optimal strategy for an agent maximizing expected logarithmic utility.** However, this verdict requires a crucial qualification regarding *why* people bet less than full Kelly. The push for "Fractional Kelly" is often misdiagnosed as risk aversion when it is actually an epistemic necessity. In the real world, where edges are estimated rather than known, Full Kelly is irrational even for a log-utility maximizer.

  **The Case for Kelly as a Norm of Rationality**

  The argument for Kelly as a normative rule rests on the mathematics of asymptotic dominance. If you engage in a sequence of independent bets with a positive expected value, the Kelly fraction ($f^*$) maximizes the expected geometric growth rate of your wealth. The mathematical consequence is striking: as the number of bets $N$ approaches infinity, the ratio of the wealth of a Kelly bettor to the wealth of any other bettor (who uses a different fixed fraction) will approach infinity almost surely.

  Proponents argue this makes Kelly a norm of rationality because it avoids a form of dynamic inconsistency. If you deviate from Kelly by betting too aggressively (over-betting), you risk ruin; the geometric growth rate becomes negative, and you go to zero. If you bet too conservatively (under-betting), you leave growth on the table. In the long run, a Kelly bettor will almost certainly outperform a non-Kelly bettor. Furthermore, because Kelly betting is proportional to current wealth, you never literally reach zero wealth in a single step, preserving your ability to compound.

  This argument suggests that rationality in repeated betting isn't about satisfying a subjective preference curve, but about surviving and thriving in a multiplicative environment. If the goal is simply "have the most money possible after many rounds," Kelly is the unique solution.

  **The Case for Kelly as Utility-Specific**

  The counter-argument, rooted in standard Expected Utility Theory (EUT), is that "rationality" is defined by coherence with an agent's preferences, not by a specific mathematical outcome. In EUT, there is no objective "value" of wealth independent of the agent's utility function $U(w)$.

  If an agent has a utility function $U(w) = w$ (risk-neutral), they should maximize arithmetic expectation, which often implies betting everything on every positive edge (until ruin hits). If an agent has $U(w) = \sqrt{w}$, their optimal bet size is half of Kelly. Kelly betting is only "rational" if $U(w) = \ln(w)$.

  Paul Samuelson famously dismantled the idea that the "long run" confers special normative status. He argued that the long run is merely a sequence of short runs. If a strategy exposes you to a 50% drawdown in the short run, the promise of higher wealth in 10,000 bets is irrelevant if you quit or go bankrupt at bet 50. The asymptotic dominance of Kelly relies on the limit $N \to \infty$. In any finite horizon, there is always a non-zero probability that a more aggressive bettor ends up wealthier than a Kelly bettor. Therefore, choosing Kelly is not a requirement of rationality; it is a choice of a specific risk profile (logarithmic).

  **The Fractional Kelly Confusion: Risk vs. Uncertainty**

  This brings us to your specific confusion regarding "Fractional Kelly." You are right to suspect that two different justifications are being conflated. It is vital to distinguish between **utility-based fractional betting** and **epistemic fractional betting**.

  1.  **Utility-Based (Risk Aversion):** This is the standard EUT objection. You know the true probabilities perfectly. You know the edge is 5%. But you simply do not care about wealth logarithmically. Perhaps you have a specific financial goal (e.g., \$1 million) and anything above that has diminishing marginal utility, or perhaps you have liabilities that make large drawdowns painful. Here, betting half-Kelly is a concession to your utility curvature. You are sacrificing growth for stability because stability is what you value.
  2.  **Epistemic (Parameter Uncertainty):** This is the more profound justification. In the real world, you never *know* the edge. You *estimate* it. The Kelly formula is convex with respect to error; if you overestimate your edge and bet Full Kelly, your growth rate can drop precipitously, even turning negative (leading to ruin). If you underestimate your edge, you merely grow slower.

  Because the cost of overestimating is ruin and the cost of underestimating is merely opportunity cost, the rational move for an agent with *uncertain* parameters is to bet less than the calculated Full Kelly. This is not about risk aversion in the utility sense; it is about error mitigation. Even if your true utility is logarithmic, if your estimate of the probability $p$ has a variance, maximizing the expected utility requires you to shrink your bet size to account for the possibility that your edge is smaller than you think.

  **The Verdict**

  We can now settle the question. Is Kelly a norm of rationality? **No.** It is not a universal law of rational action like "do not hold contradictory beliefs." It is a technical solution to a specific optimization problem: maximizing the expected value of the logarithm of wealth.

  If you do not have logarithmic utility, Kelly is literally irrational for you. If you are saving for a fixed liability or have a different risk tolerance, following Kelly violates the first principle of decision theory: maximize *your* expected utility, not someone else's.

  However, the "growth optimist" intuition persists for a reason. In repeated multiplicative games, logarithmic utility is the utility of **survival**. An agent who maximizes arithmetic returns will eventually go bust. An agent who maximizes geometric returns (Kelly) survives indefinitely. Thus, while Kelly is not a norm of *preference*, it is a norm of *sustainability* in ergodic systems.

  This leads to the final, practical verdict on how you should apply this in your course and in life: **Full Kelly is almost never rational.**

  Why? Because the "Normative" argument for Kelly assumes you *know* the edge. The "Utility" argument assumes you know your *preferences*. But in reality, the epistemic condition dominates. Since no agent knows the true probabilities of real-world bets, Full Kelly exposes you to "estimation ruin." Therefore, the rational strategy for almost any agent facing repeated bets with uncertain edges is **Fractional Kelly**.

  Whether you arrive at Fractional Kelly because you are risk-averse (Utility) or because you are humble about your edge estimation (Epistemology), the result is the same. But you must understand that the latter justification applies even if you are a die-hard log-utility maximizer.

  **Conclusion**

  Stop looking for Kelly as a moral or logical imperative that overrides your utility function. It does not exist. Kelly is the optimal strategy for logarithmic growth, nothing more. However, recognize that in a world of uncertainty, the "known edge" required for Full Kelly is a fiction. Therefore, while Kelly is not a universal norm of rationality, **Fractional Kelly is the robust norm for rational action under uncertainty.** It bridges the gap between the mathematical ideal of growth and the epistemic reality of estimation error. Adopt Fractional Kelly not because it is "safer" in a utility sense, but because Full Kelly assumes a knowledge of the future that no rational agent possesses.
