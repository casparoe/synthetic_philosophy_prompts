prompt: |-
  I just spent three hours arguing with a friend about whether democratic preference aggregation can be called "rational" in anything like the physical sense, and she kept invoking Harsanyi's aggregation theorem as if it settled the normative question. I am a statistical physicist; my working vocabulary is microcanonical ensembles, local Hamiltonians, order parameters, mean-field decoupling, free-energy landscapes, and coupling constants. I want you to restate Harsanyi's result—the claim that when both every individual preference ordering and the social preference ordering satisfy von Neumann-Morgenstern rationality together with a Pareto condition, the social welfare function must be an affine-weighted sum of individual cardinal utilities—entirely inside that physical vocabulary. Be explicit: map individual utility functions onto local Hamiltonians or energy landscapes, the social welfare function onto a macrostate free energy, the independence-of-irrelevant-alternatives axiom onto some decoupling or factorization condition, the Pareto principle onto a constraint on the global ground state, and the aggregation weights onto coupling constants or inverse temperatures. Do not smuggle in normative language disguised as physics; keep the translation honest.

  Then give me the residue report. For each translated component—the continuity and independence axioms, the Pareto condition, the linear aggregation formula, and the uniqueness of the weights—state whether it maps cleanly, whether it requires distorting the physics (for instance, treating subjective orderings as observable energies or treating social choice as thermal equilibrium), or whether it has no physical counterpart whatsoever. In particular, examine whether the independence axiom is genuinely analogous to the absence of entanglement between subsystems, and whether that analogy clarifies the axiom or merely hides its normative force. Also address whether the cardinality of individual utilities, which Harsanyi derives rather than assumes, corresponds to anything like an absolute energy scale or is an artifact that disappears in the mean-field limit. Finally, tell me whether the residues are defects of my statistical-mechanical framework—because ensemble theory lacks resources for authority, fairness, or normative weighting—or whether they indicate that Harsanyi's theorem is largely a formal identity that does not do the philosophical work my friend imagines it does.
