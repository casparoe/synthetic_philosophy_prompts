answer: |-
  ### Part I: The Harsanyi Aggregation Theorem as a Statistical Mechanical Identity

  **System Definition:**
  Consider a composite system $\Sigma$ consisting of $N$ distinguishable subsystems (individuals), indexed by $i = 1, \dots, N$. The system occupies a configuration space $\Omega$ (social alternatives). A social state is defined by a probability measure $\rho$ over $\Omega$ (a lottery).

  **1. Local Hamiltonians (Individual Utilities)**
  Each subsystem $i$ is characterized by a local observable $\hat{H}_i$, a Hermitian operator on the state space of $\Omega$. We identify the negative expectation value of this operator with individual utility:
  $$ U_i(\rho) \equiv -\langle \hat{H}_i \rangle_\rho = -\text{Tr}(\rho \hat{H}_i) $$
  The condition that individuals satisfy von Neumann-Morgenstern (vNM) rationality is mapped to the requirement that preferences are ordered strictly by the expectation value of these local Hamiltonians. Continuity and Independence axioms in vNM theory correspond to the linearity of the trace operation and the topology of the density matrix space.

  **2. Macrostate Free Energy (Social Welfare)**
  The social preference ordering is represented by a global thermodynamic potential, the Macrostate Free Energy $F_{soc}(\rho)$. The society "prefers" state $\rho_A$ over $\rho_B$ if and only if $F_{soc}(\rho_A) < F_{soc}(\rho_B)$ (minimizing free energy).
  The condition that the social ordering satisfies vNM rationality implies that $F_{soc}$ must be a linear functional of the density matrix $\rho$. In the zero-temperature limit (deterministic choice), $F_{soc}$ converges to the Global Effective Hamiltonian $\hat{H}_{soc}$:
  $$ F_{soc}(\rho) \xrightarrow{T \to 0} \langle \hat{H}_{soc} \rangle_\rho $$

  **3. The Pareto Condition (Ground State Constraint)**
  The Weak Pareto Principle is imposed as a boundary condition on the energy landscape. For any two states $\rho_A, \rho_B$:
  If $\langle \hat{H}_i \rangle_{\rho_A} < \langle \hat{H}_i \rangle_{\rho_B}$ for all $i$ (all subsystems lower their local energy),
  Then $\langle \hat{H}_{soc} \rangle_{\rho_A} < \langle \hat{H}_{soc} \rangle_{\rho_B}$ (the global energy must lower).
  If $\langle \hat{H}_i \rangle_{\rho_A} = \langle \hat{H}_i \rangle_{\rho_B}$ for all $i$, then $\langle \hat{H}_{soc} \rangle_{\rho_A} = \langle \hat{H}_{soc} \rangle_{\rho_B}$.
  Physically, this asserts that the global ground state must be consistent with the simultaneous minimization of all local fields.

  **4. Independence of Irrelevant Alternatives (Factorization Condition)**
  We map the Independence axiom to a **Local Decoupling Condition**. The Global Hamiltonian $\hat{H}_{soc}$ must be constructed solely from the algebra of local observables $\{\hat{H}_i\}$. It cannot depend on microstate details of $\Omega$ that are not already captured by the local energy values.
  Mathematically, this requires that $\hat{H}_{soc}$ lies in the linear span of $\{\hat{H}_i\}$. There are no interaction terms $\hat{V}_{ij}$ that depend on the joint configuration of subsystems $i$ and $j$ independently of their local energies. The partition function of the social system must factorize with respect to the utility basis:
  $$ Z_{soc} = \text{Tr}\left(e^{-\beta \hat{H}_{soc}}\right) \implies \hat{H}_{soc} \in \text{span}\left(\{\hat{H}_i\}\right) $$

  **5. Coupling Constants (Aggregation Weights)**
  Harsanyi's conclusion states that the Social Welfare Function is an affine-weighted sum of individual utilities. In our physical vocabulary, the Global Effective Hamiltonian is a linear superposition of Local Hamiltonians:
  $$ \hat{H}_{soc} = \sum_{i=1}^N \beta_i \hat{H}_i + E_0 $$
  Here, $\beta_i \geq 0$ are **coupling constants** (analogous to inverse temperatures or field strengths) coupling the global order parameter to the local degrees of freedom. $E_0$ is a vacuum energy constant (irrelevant for ordering).
  The theorem proves that if the Pareto constraint holds and the system is non-interacting (Decoupling Condition), the only stable global potential is a weighted sum of local potentials.

  ***

  ### Part II: Residue Report

  **1. Continuity and Independence Axioms**
  *   **Mapping Quality:** **Clean.**
  *   **Analysis:** In statistical mechanics, observables are linear functionals on the space of density matrices. The vNM Independence axiom (linearity in probabilities) is mathematically identical to the linearity of the expectation value $\langle \hat{O} \rangle = \text{Tr}(\rho \hat{O})$.
  *   **Residue:** The residue is not mathematical but interpretive. In physics, linearity is a property of measurement statistics. In social choice, it is a normative claim that "risk" should be aggregated linearly. The physics vocabulary hides the fact that this rules out preferences for fairness *in the distribution of risk* (e.g., preferring a certain outcome for everyone over a lottery where some win big and others lose big, even if expected utility is identical). The physics assumes the observable *is* the utility; it cannot question whether the observable is the correct metric.

  **2. The Pareto Condition**
  *   **Mapping Quality:** **Distorted.**
  *   **Analysis:** We mapped Pareto to a Ground State Constraint (if all local gradients point down, global gradient points down). In physics, this is a stability condition for a non-frustrated system.
  *   **Residue:** In thermodynamics, global energy minimization does not *require* local minimization if interaction terms exist (e.g., antiferromagnetism). By enforcing Pareto, we are manually forbidding frustration. This is a boundary condition imposed from outside the Hamiltonian. The physics describes *how* the system equilibrates given the Hamiltonian; it does not explain *why* the Hamiltonian is constrained to respect local gradients. The normative force ("we ought to respect unanimous preference") is translated as a hard constraint on the admissible Hilbert space of the social operator.

  **3. Linear Aggregation Formula**
  *   **Mapping Quality:** **Clean (Mathematically) / Distorted (Physically).**
  *   **Analysis:** The result $\hat{H}_{soc} = \sum \beta_i \hat{H}_i$ is a standard mean-field decoupling. It describes a paramagnetic system where spins align with an external field but do not interact with each other.
  *   **Residue:** This is the largest distortion. Real many-body systems are defined by interaction terms ($\sum J_{ij} \hat{H}_i \hat{H}_j$). Harsanyi's theorem *proves* that if you accept the axioms, social interaction terms must vanish. The theorem essentially asserts: "A rational society cannot have emergent properties." It forbids synergy, conflict, or structural justice that isn't already encoded in individual utilities. The physics vocabulary clarifies this: Harsanyi's "rational society" is a non-interacting gas. It cannot undergo phase transitions.

  **4. Uniqueness of the Weights ($\beta_i$)**
  *   **Mapping Quality:** **No Physical Counterpart.**
  *   **Analysis:** In physics, coupling constants $\beta_i$ are determined by the material properties or the temperature of the bath. They are measurable. In Harsanyi's theorem, the $\beta_i$ are undetermined non-negative constants.
  *   **Residue:** This is where the normative work is supposed to happen, but the theorem is silent. The physics analogy exposes that Harsanyi provides the *form* of the Hamiltonian but not the *parameters*. Your friend invokes the theorem to settle a normative question, but the theorem leaves the most important normative variable (the relative weighting of citizens) entirely exogenous. It is like deriving the Schrödinger equation but having no way to determine the potential $V(x)$.

  **5. Independence Axiom vs. Entanglement**
  *   **Mapping Quality:** **Clarifying.**
  *   **Analysis:** You asked if IIA is analogous to the absence of entanglement. Yes. The Decoupling Condition requires that the Global Hamiltonian be separable in the basis of Individual Utilities.
  *   **Does it hide normative force?** It hides it by making it look like a technical locality constraint. In quantum information, forbidding entanglement restricts the computational power of the system. In social choice, forbidding "entanglement" (interdependence of utilities in the social function) restricts the society's ability to value *relationships* between agents. It reduces social welfare to a sum of isolated monads. The analogy clarifies that IIA is not about "irrelevant alternatives" in a logical sense, but about the **absence of interaction terms** in the social Hamiltonian.

  **6. Cardinality of Utility**
  *   **Mapping Quality:** **Clean.**
  *   **Analysis:** Harsanyi derives cardinal utility (unique up to affine transformation $aU+b$). In physics, Energy is unique up to a scale factor (units) and an additive constant (zero-point).
  *   **Does it disappear in mean-field?** No. The cardinality is robust. It corresponds to the fact that temperature is an intensive parameter that scales energy. The analogy holds: you cannot compare the energy of two systems without a common temperature scale. Harsanyi's theorem requires a common "social temperature" to compare individual utilities. The residue is that physics assumes this scale exists naturally; social choice must *construct* it interpersonally, which is notoriously difficult (the problem of comparing pain/pleasure across subjects).

  ### Conclusion: Defects of Framework or Theorem?

  The residues are **not defects of your statistical-mechanical framework**. Ensemble theory is perfectly capable of describing systems with authority (external fields), fairness (symmetry constraints), or normative weighting (boundary conditions).

  The residues indicate that **Harsanyi's theorem is largely a formal identity** that does not do the philosophical work your friend imagines.
  1.  **Formal Identity:** The theorem is essentially the statement that if a vector lies in the convex cone spanned by a set of basis vectors, it is a positive linear combination of them. The physics translation reveals this as the condition for a non-interacting mean-field system.
  2.  **Philosophical Failure:** The theorem claims to derive "rational" social welfare. The physics translation shows it merely derives the *structure* of a non-interacting Hamiltonian. It fails to determine the coupling constants ($\beta_i$). Without a mechanism to fix the $\beta_i$ (e.g., symmetry/equality $\beta_i = \beta_j$), the theorem is compatible with dictatorship (one $\beta_k \gg 0$, others $0$).
  3.  **The "Rationality" Trap:** By mapping "rationality" to "linearity/thermal equilibrium," we see that Harsanyi defines rationality as the absence of frustration and interaction. If your friend argues this settles the normative question, she is arguing that a society *ought* to be a non-interacting paramagnet. The physics vocabulary strips the moral camouflage: the theorem forbids the society from having an energy landscape more complex than the sum of its parts.

  **Verdict:** The theorem is a consistency check on a specific class of social Hamiltonians (non-interacting, linear). It is not a derivation of moral truth. The "normative question" resides entirely in the selection of the coupling constants $\beta_i$, which the theorem leaves completely undetermined.
