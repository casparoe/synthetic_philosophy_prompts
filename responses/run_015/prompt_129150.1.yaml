  hey so i've been digging into the malcolm vs dennett thing about whether dreams are actually experiences, and it's wild to me that philosophy of mind seminars have replayed the same moves since like the 70s without anyone budging. malcolm's core claim is that there's no criterion for being wrong about a dream report, which makes them structually different from perceptual reports; dennett answers that dreams are real experiences but the narrative gets confabulated on waking, so unreliability doesn't equal non-existence. everyone knows these lines by heart.

  my working theory is that the stall isn't about consciousness at all but about three seperate debates collapsed under one heading: whether there's a phenomenal fact of the matter during REM, whether retrospective reports share the epistemic structure of perception or of reconstructed memory, and whether "experience" requires some kind of online accessibility that sleep states lack. but i don't know if that's right. maybe it's verbal—maybe malcolm is doing conceptual analysis of report conditions while dennett is doing empirical psychology of narrative construction, and they're just using "experience" differently. or maybe there's a hidden empirical crux about sleep-state cognition that neither side can settle from the armchair.

