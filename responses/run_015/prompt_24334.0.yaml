answer: |-
  **42%**

  That is my credence that the mutual-gains structure you described (where a compromise is Pareto-superior to the adversarial extremes for both parties) is available in the majority of real moral disagreements between value-divergent agents.

  Here is the decomposition, the sensitivity analysis, and the counterfactual shift you requested.

  ### The Decomposition

  I am treating your "mutual-gains structure" as requiring two conditions: (1) the disagreement allows for a continuous or divisible solution space (like a budget), and (2) the parties have concave utility functions over that space (preferring a guarantee of the middle to a risk of the extreme).

  I estimate the prevalence of the three disagreement types and the probability that a mutual-gains compromise exists *given* that type.

  | Disagreement Type | Estimated Prevalence ($P$) | Chance of Mutual Gains ($P(\text{Gain}|\text{Type})$) | Contribution to Total |
  | :--- | :---: | :---: | :---: |
  | **1. Weighting**<br>(Same values, different margins) | 30% | 85% | 25.5% |
  | **2. Existence**<br>(Different values entirely) | 50% | 35% | 17.5% |
  | **3. Lexicographic**<br>(Sacred constraints/Rights) | 20% | 5% | 1.0% |
  | **Total Expected Proportion** | | | **44%** |

  *Note: The Total Expected Proportion (44%) is the weighted average of cases where compromise works. My credence that this exceeds 50% (the "majority" threshold) is slightly lower than the mean due to uncertainty variance, hence **42%**.*

  **Reasoning on the Probabilities:**
  *   **Weighting (85%):** This is your budget example. It works well *if* the policy lever is continuous. It fails if the decision is binary (e.g., "Ban X or not?"). I discount the 15% failure rate on binary constraints masquerading as weighting.
  *   **Existence (35%):** If I value A and you value B, we can trade *if* we both have some baseline concern for the other's value or if we can bundle issues. However, if your value is strictly orthogonal to mine (I am indifferent to what you care about), there is no "gain" to be had from moving toward your position, only loss. Trade requires overlapping utility curves.
  *   **Lexicographic (5%):** By definition, these values forbid trade-offs ("Never torture," "Absolute right to life"). Compromise is viewed as contamination, not gain. The 5% accounts for cases where the "sacred" value isn't actually triggered by the specific compromise.

  ### Sensitivity Analysis

  **The Key Variable:** The prevalence of **Lexicographic/Sacred Values**.

  This is the most sensitive variable because the conditional probability of mutual gain is near-zero (5%). In my model, I assumed only 20% of disagreements are truly lexicographic. However, psychological literature on "moralization" suggests that people often *report* weighting preferences ("I prefer 70%") but *reveal* lexicographic preferences when pushed ("I will not accept less than 60%").

  If the true prevalence of lexicographic structures is higher than 20%, the total expected proportion crashes rapidly. For example, if 40% of disagreements are lexicographic (rather than 20%), the total expected proportion of solvable cases drops from 44% to **34%**, and my credence that it constitutes a "majority" would fall to roughly **25%**.

  ### Counterfactual Shift

  You asked: *If I showed you that most real moral disagreements are existence ones rather than weighting ones, how far would your credence drop?*

  Currently, I weight **Existence** at 50% and **Weighting** at 30%.
  If you demonstrated that **Existence** disagreements are actually 80% of cases (and Weighting drops to 10%):

  *   **New Calculation:**
      *   Weighting: $10\% \times 85\% = 8.5\%$
      *   Existence: $80\% \times 35\% = 28.0\%$
      *   Lexicographic: $10\% \times 5\% = 0.5\%$
      *   **New Total Expected Proportion:** **37%**

  *   **Impact on Credence:**
      My credence that mutual gains are available in the *majority* of cases would drop from **42% to roughly 28%**.

  **Why?** Because "Existence" disagreements (I value X, you don't) lack the natural concavity of "Weighting" disagreements (We both value X, just differently). In Existence cases, moving toward your position often feels like pure loss to me unless I can extract a specific concession on Y in return. In pure budget-splitting (Weighting), the compromise *is* the concession. If most moral disagreements are about fundamentally different valuations rather than marginal weights, the "gains from trade" model becomes much harder to instantiate.
