answer: |-
  This is a classic philosophical move, and your instinct that your roommate is equivocating is spot on. The slogan "we only know structure, not stuff" is the banner of **Structural Realism**. It sits at the intersection of philosophy of science and metaphysics.

  Your roommate is sliding between a modest claim about scientific methodology and a radical claim about the nature of reality to shut down the conversation about consciousness.

  Here is the menu of claims hidden behind that one-liner, evaluated for truth, substance, and whether they actually win his argument.

  ### The Menu of Claims

  #### 1. The Epistemic Claim (ESR - Epistemic Structural Realism)
  *   **The Claim:** "Human cognition and scientific instruments only allow us to access the *relations* between entities, not their intrinsic nature."
  *   **Status:** **Substantive Thesis.** (It's not a platitude; it's a Kantian-style limitation on knowledge.)
  *   **Truth Value:** Plausible, but unprovable.
  *   **Does it get him the conclusion?** **No.**
      *   *Why:* This says we *don't know* the stuff. It leaves open the possibility that the "stuff" exists and is non-physical (e.g., consciousness, soul, qualia). It creates an agnostic gap, not a physicalist closure. If he uses this, he admits physics might be leaving out the intrinsic nature of things.

  #### 2. The Semantic Claim (Ramsey-Carnap View)
  *   **The Claim:** "Theoretical terms (like 'electron') are defined *exhaustively* by their structural role in the theory. To ask what an electron is 'over and above' its equations is a category error."
  *   **Status:** **Substantive Thesis.** (This is a specific theory of meaning.)
  *   **Truth Value:** Controversial. Many argue terms have reference beyond their theoretical description.
  *   **Does it get him the conclusion?** **Yes, but by fiat.**
      *   *Why:* This makes the question "what is the electron in itself?" meaningless by definition. It rules out consciousness as an extra ingredient by defining "physical facts" to include *only* structural facts. It wins the argument by changing the rules of language, not by describing the world.

  #### 3. The Ontic Claim (OSR - Ontic Structural Realism)
  *   **The Claim:** "There is no 'stuff' underlying the structure. Structure is all there is. Objects are just nodes in a network of relations."
  *   **Status:** **Radical Metaphysics.**
  *   **Truth Value:** Highly debated. (See your second sticking point below).
  *   **Does it get him the conclusion?** **Yes.**
      *   *Why:* If reality *is* structure, and physics describes structure, then a finished physics describes all of reality. There is no "room" for non-structural consciousness.
      *   *The Catch:* This requires defending the claim that structure can exist without "stuff." He can't just assert it; he has to argue for it.

  #### 4. The Methodological Claim (Instrumentalism)
  *   **The Claim:** "Physics is a tool for prediction. Since equations are structural, physics is only concerned with structure. What the world *is* doesn't matter for doing science."
  *   **Status:** **Platitude.** (Most physicists agree in practice.)
  *   **Truth Value:** True regarding practice, silent on ontology.
  *   **Does it get him the conclusion?** **No.**
      *   *Why:* This says physics *ignores* the stuff, not that the stuff *isn't there*. It leaves the door wide open for consciousness to be the "stuff" that the structural equations are modeling.

  ---

  ### Sticking Point 1: The Triviality Objection (Newman's Problem)

  You asked: *"If structure just means the formal relations, isn't there an old worry that 'we know the structure' collapses into almost nothing?"*

  Yes. This is **Newman's Objection** (1928), raised against Bertrand Russell's structuralism. It is the perfect weapon to use here.

  **The Argument:**
  1.  Suppose your roommate says: "All we know is the mathematical structure of the world (e.g., there exist entities $x, y, z$ and relations $R$ such that...)."
  2.  In pure mathematics/logic, if you have a collection of distinct things (any things), you can define relations between them to fit almost *any* structural description, provided you have enough things (cardinality).
  3.  **Example:** If I tell you the structure is "A causes B," and you say "I only know the structure," you haven't told me anything about the world unless you specify *what* is doing the causing. If "structure" just means "logical relations," then *any* random collection of objects could be mapped onto the structure of an electron.
  4.  **Conclusion:** To make structural claims non-trivial, you must specify *which* relations matter (e.g., *causal* relations, *spatiotemporal* relations). But causation and space aren't just abstract math; they imply something about the **nature** of the relata (the things relating).

  **How to deploy it:**
  Tell him: "Newman proved that if you strip away the nature of the relata and keep only the abstract mathematical structure, the claim becomes trivial. Any collection of things can fit any structure. To avoid triviality, you have to admit that specific relations (like causation) are real. But causation implies powers, and powers look a lot like 'intrinsic nature.' So you can't have structure without some kind of 'stuff' to do the structuring."

  ### Sticking Point 2: The "Relata" Problem (Relations without Things?)

  You asked: *"Does the strong ontic version... even make sense on its own, or does it quietly need objects hanging around to hold the relations up?"*

  This is the **"No Relations without Relata"** objection.

  **The Dilemma:**
  *   **Horn A:** If there is structure, there must be *something* that is structured. A dance cannot exist without a dancer. A network cannot exist without nodes. If he admits there are nodes, he admits there is "stuff" (ontological substrates).
  *   **Horn B:** If he says "No, the relations are fundamental and the nodes are just derivative intersections of relations," he faces a coherence problem. What is relating to what? If $A$ relates to $B$, but $A$ is just a bundle of relations, and $B$ is just a bundle of relations, you get a regress or a circle.

  **The OSR Workaround (and its weakness):**
  Ontic Structural Realists (like Ladyman & Ross) argue that we should think of reality as a **graph without nodes**, or that objects are just "bundles of relations."
  *   **Counter:** This often smuggles "stuff" back in under the name of **"Causal Powers."** If an electron is defined by what it *does* (its structural role), that "doing" is a dispositional property. Dispositions usually require a categorical base (something that *has* the disposition).
  *   **The Consciousness Angle:** This is where the "Hard Problem" sneaks back in. If physics describes the *structure* of causation, but consciousness is the *intrinsic feel* of that causation (a view called **Russellian Monism**), then the roommate's slogan actually *supports* the idea that physics leaves something out. Physics gives the shadow (structure); consciousness might be the substance (intrinsic nature).

  ### Summary for the Argument

  Your roommate is committing a **modal scope fallacy** mixed with **equivocation**.

  1.  **Point out the Equivocation:** "Are you saying we *can't know* the stuff (Epistemic), or that there *is no* stuff (Ontic)? If it's the first, you haven't ruled out consciousness. If it's the second, you're making a huge metaphysical claim that requires more proof than 'physics uses math.'"
  2.  **Deploy Newman:** "If structure is just mathematical relations, Newman showed that's trivial. Any world fits any structure. To make physics true, you need specific causal relations. Causation implies nature. So you need nature, not just structure."
  3.  **The Consciousness Trap:** "If physics is purely structural, and consciousness is purely intrinsic (qualia), then either consciousness doesn't exist (illusionism), or physics is incomplete. Saying 'structure is all there is' doesn't solve the Hard Problem; it just defines it away."

  **Verdict:** His slogan is a **platitude** if it means "theories are mathematical." It is a **substantive (and controversial) metaphysical thesis** if it means "reality is only structure." He is using the truth of the first to sell you the second.
