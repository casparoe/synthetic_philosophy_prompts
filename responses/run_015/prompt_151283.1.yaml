          2.  *Experiential Interests (Dresser):* What the current self feels/experiences matters most. If they are happy, overriding that causes harm.
      *   **Personal Identity:** Parfit's reductionist view (psychological continuity) suggests the connection weakens, reducing the authority of the past self. But legal/ethical personhood often ignores metaphysical identity.

