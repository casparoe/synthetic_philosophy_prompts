          *   *Issue B (The Driving Example):* The "driving home on autopilot" case is typically used to argue for *unconscious* mental states or to illustrate the difference between P-consciousness and A-consciousness (Block). Using it to explain Dispositional HOT is confused. If you are on autopilot, you lack conscious awareness of the driving. A dispositionalist says you *could* become aware. But the student implies the dispositional view explains why you *aren't* representing states. Actually, the dispositional view says the state is conscious *if* you are disposed to have the HOT. If you are on autopilot, you usually lack the HOT entirely (dispositional or otherwise), rendering the state unconscious. The student's reasoning here is muddled.

