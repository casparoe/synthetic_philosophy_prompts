answer: |-
  Colleagues, since we have granted the existence of phenomenal consciousness ("there is something it is like"), we must now map the epistemic access to that state. Use this heuristic to locate your position on introspective reliability. Do not look at the labels; answer the questions based on your metaphysical commitments.

  **1. Is first-person authority best explained by an internal observational mechanism?**
  *   **No:** Your view is that talk of "inner observation" is a category mistake or a theoretical fiction. First-person authority arises from linguistic practice or functional role, not detection.
      *   → **Anti-Introspectionism (Wittgenstein, Dennett)**
  *   **Yes:** Proceed to 2.

  **2. When you attend to your experience, do you represent the experience's intrinsic qualities, or the external properties the experience represents?**
  *   **External Properties:** You hold that experience is diaphanous; we look *through* it to the world. Introspection is really representation of external content.
      *   → **Transparency Theory (Dretske, Tye)**
  *   **Intrinsic Qualities:** Proceed to 3.

  **3. Is the introspective state numerically distinct from the target mental state it awarenesses?**
  *   **No:** The awareness is intrinsic to the state itself; the mind perceives its own states directly without a separate mediator. Proceed to 4.
  *   **Yes:** Consciousness requires a separate higher-order state targeting a lower-order state. Proceed to 5.

  **4. Is the temporal ordering of these inner states constructed by the mind's form of intuition?**
  *   **Yes:** Inner sense is passive and subjects states to time, distinct from pure apperception.
      *   → **Kant's Inner Sense**
  *   **No:** Temporal order is directly given; the mind perceives its operations immediately.
      *   → **Naive Introspectionism (Locke, Reid)**

  **5. Is the mechanism generating this distinct higher-order state cognitive (propositional) or perceptual (quasi-sensory)?**
  *   **Cognitive:** The higher-order state is a thought that one is in a mental state.
      *   → **Higher-Order Thought (Rosenthal)**
  *   **Perceptual:** The higher-order state scans the lower-order state via an internal scanner.
      *   → **Higher-Order Perception (Brown)**

  ***

  **Flagged Indeterminacy:**
  **HOT vs. HOP:** This tree cannot rigorously separate Higher-Order Thought and Higher-Order Perception because both posit numerically distinct higher-order states, differing only on the analogical description of the mechanism's functional architecture.

  **Instruction:**
  Place yourself at a leaf. Now, argue against the neighbor node. If you are at Transparency, explain to the HOT theorist why their distinct state leads to an infinite regress. If you are at Naive Introspectionism, defend infallibility against the Kantian critique of temporal construction. This friction is where the seminar begins.
