      *   *The Link:* Both involve blind processes yielding functional order.
      *   *The Twist (Exaptation):* The "function" changes mid-stream. This prevents the "selectors" from having a stable mental model of the goal, reinforcing the "blindness."

  3.  **Brainstorming the Game:**
