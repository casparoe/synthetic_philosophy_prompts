      *   *Round 2 Rule:* "Sequence must be symmetrical (A-B-C-C-B-A)." (Selection for *arrangement*).
      *   *Exaptation:* The 'Circles' accumulated in Round 1 are now used as the 'C' center pieces in Round 2. The Mutators think they are building symmetry; Selectors know the rule changed.
      *   *Wait, if Selectors know the rule, they have comprehension.* The point is the *system* lacks comprehension. The Selectors are just the filter. The Mutators are the variation. Neither sees the whole trajectory.
      *   *Crucial adjustment:* Selectors should *not* discuss *why* they rejected. Just "Pass/Fail." This enforces the "blindness."

  6.  **Addressing the Turing/Darwin Link:**
      *   Darwin: Selection acts on phenotype without knowing genotype.
