      *   *Refinement:* Let's use a "Protocol Construction" game. Students build a sequence of instructions (a "genome" or "program") that transforms an Input into an Output.
      *   *The Twist:* The rule for success changes halfway through, but old traits remain useful for the new rule (exaptation).
      *   *Roles:*
          *   *Mutators (Generators):* Propose changes to the protocol.
          *   *Selectors (Environment):* Approve/reject changes based on a secret rule card.
          *   *Observer/Recorder:* Tracks the history (maybe the TA or one student).
      *   *Why this works:* Mutators don't know the rule. Selectors know the rule but don't build. The system evolves a solution. Neither fully "understands" the whole system's logic in the way a designer would.

  4.  **Developing the "Exaptation" Mechanic:**
      *   *Phase 1 Rule:* "The sequence must contain an even number of Red cards." (Selection favors Red).
      *   *Phase 2 Rule:* "The sequence must alternate Red/Blue, starting with Red."
