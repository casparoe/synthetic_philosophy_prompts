answer: |-
  Right, so you've stumbled onto one of the proper big debates in experimental philosophy. It's a fascinating rabbit hole, and honestly, it's no surprise it caused a row with your flatmate. The Knobe Effect (or the 'side-effect effect') really does mess with our intuition about how the mind works.

  Let's break this down into a conceptual map without getting bogged down in the academic jargon.

  ### The Basics: What's actually happening?

  Just to set the scene for anyone reading along: Joshua Knobe ran a study where people were told about a CEO launching a new programme.
  *   **Case A:** The CEO is told the programme will harm the environment. He says, "I don't care about that, I just want profit," and launches it. The environment is harmed.
  *   **Case B:** The CEO is told the programme will help the environment. He says, "I don't care about that, I just want profit," and launches it. The environment is helped.

  Logically, the CEO's mental state is identical in both scenarios. He knows the outcome, he doesn't desire it, but he proceeds anyway. Yet, when asked, most people say he **intentionally** harmed the environment, but **did not intentionally** help it.

  ### The Core Debate: Moral Concept vs. Linguistic Quirk

  This is the meat of your disagreement. There are two main camps here.

  **1. The Deep Conceptual Link (Moralism)**
  This view says the Knobe Effect proves that our very concept of 'intentionality' isn't neutral. It's not just a mechanical description of beliefs and desires; it's partly a tool for holding people accountable. We weave moral judgement into the fabric of how we describe actions. If something is bad, we are quicker to say it was done 'on purpose' because we want to blame someone. If it's good, but the person didn't care, we withhold the label 'intentional' because we don't feel they deserve praise. On this view, morality isn't an add-on; it's part of the engine.

  **2. The Linguistic/Pragmatic Quirk**
  The other side argues that our underlying concept of intentionality is actually neutral, but our use of language is messy. They reckon people understand the CEO didn't care in both cases, but saying "he intentionally helped" implies he *wanted* to help. Since he didn't, saying it feels misleading, even if technically true. It's a conversational implication, not a change in the actual concept. It's like if I ask, "Did you eat some of the biscuits?" and you ate all of them. Saying "some" is technically true, but pragmatically misleading. This camp says the Knobe Effect is just us being careful with how we speak, not how we think.

  **The Verdict?**
  Most folks leaning towards the conceptual map side reckon it's probably a bit of both, but the evidence leans towards the idea that moral evaluation *does* shape how we attribute mental states. It suggests we don't figure out intentionality first and then blame later; we do them simultaneously.

  ### What about Omissions?

  You asked if this holds for doing nothing (omissions), and that's where it gets properly tricky.

  Generally, yes, the asymmetry holds, but it's a bit wobblier. If a CEO knows that *not* signing a cheque will cause harm, and he doesn't sign it because he doesn't care, people are quite likely to say he intentionally harmed. But if *not* signing the cheque saves money for charity, and he doesn't sign it indifferently, people are less likely to say he intentionally helped.

  However, omissions are already weird in philosophy. We tend to judge bad omissions more harshly than good ones anyway. The Knobe Effect amplifies this. The moral badness of the omission makes it feel more 'active' and intentional than a good omission. So, the map remains consistent: bad side-effects (even via inaction) look more intentional than good ones.

  ### Institutional Roles vs. Individual Agents

  This is a brilliant angle. Does hiding behind a title change things?

  If you frame the agent as a distinct individual with personal agency (the CEO), the effect is strong. But if you frame it through an institutional role—say, "The Board voted" or "It is company policy"—the effect can shift.

  Some research suggests that when actions are seen as strictly required by an institutional role, the Knobe Effect diminishes. If the CEO *had* to launch the programme to keep his job, people are less likely to say he intentionally harmed the environment, even if it's bad. The moral blame gets diffused into the system.

  However, it doesn't make the effect disappear entirely. We still moralise institutions. If a corporation knowingly pollutes, we still say they "intentionally" did it, even if it's just 'business'. But if you frame the agent as a mere cog—a functionary with no discretion—the asymmetry weakens. Why? because intentionality requires a mind to latch onto. If the person is just following orders, our desire to blame them (and thus attribute intentionality) drops, regardless of whether the outcome is good or bad.

  So, framing it through institutional roles doesn't kill the effect, but it can dampen it by reducing the perceived moral agency of the individual. It shifts the blame from the person's character to the system's rules.

  ### The Bottom Line

  So, to answer your main question: does it prove intentionality is tied to moral evaluation?

  It doesn't 'prove' it in a mathematical sense, but it strongly suggests that folk psychology (how we normally think about minds) isn't a clean, scientific machine. It's a social tool. We use concepts like 'intentional' to navigate praise and blame.

  If it were just a linguistic quirk, we'd expect the effect to vanish when we press people on what they really mean. But even when philosophers push back, the intuition remains stubborn. That suggests the link is conceptual. We see the world differently depending on whether things go well or poorly.

  As for your flatmate dispute: if they think it's just about words, they're probably underestimating how much our morals shape our perception of reality. If you think it proves morality is objective, you're probably overstating it. It just shows that when we talk about what people meant to do, we're never really just talking about their brains; we're talking about whether they deserve a telling-off.

  Hope that helps clear the fog a bit. It's proper head-spinning stuff, but that's what makes it worth arguing about over a cuppa.
