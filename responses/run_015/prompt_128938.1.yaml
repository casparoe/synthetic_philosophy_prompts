      *   *Content:* It is indeed virulently antisemitic and nationalist. He proposes stripping Jews of civil rights, etc.
      *   *Timing:* Late in life. His major logical work (*Begriffsschrift*, *Grundlagen*, *Grundgesetze*) was late 19th century (1879-1903).
      *   *The "Separation" Thesis:* This is the core of the debate. The "standard view" (logic is autonomous) vs. the "contextualist/critical view" (ideas exist in a social/historical context).
      *   *Key Scholars:* Gottfried Gabriel (editor), Richard L. Mendelsohn (translator), Michael Dummett (wrote extensively on this), Patricia Blanchette, Joan Weiner, etc.
      *   *The Genetic Fallacy:* Is it a genetic fallacy to look at the origins of ideas? In philosophy of science/logic, often yes. But in intellectual history/ideology critique, maybe not.
      *   *Anti-Psychologism:* Frege famously fought against psychologism (the idea that logic is about how humans *think* rather than objective truth). Does this immunize him from ideological critique?
      *   *Specific Connections:* Did his antisemitism influence his specific philosophical concepts? Some argue his critique of "formalism" or certain views on language might have cultural undertones, but direct links are tenuous.

  3.  **Point-by-Point Evaluation Strategy:**

      *   *Point 1: Diary is unpublished/personal & late.*
