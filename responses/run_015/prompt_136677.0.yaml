answer: |-
  Rational agency faces a profound challenge when confronted with highly reliable predictors that condition outcomes on an agent's decision procedure rather than merely their immediate actions. Two thought experiments illustrate this tension: Counterfactual Mugging and XOR Blackmail.

  In Counterfactual Mugging, a predictor flips a fair coin. If it lands heads, the predictor gives you $10,000, but only if it predicted you would pay $100 had the coin landed tails. If the coin lands tails, the predictor asks you for $100. You know the coin has landed tails, and the request is before you. The $10,000 exists only in the counterfactual heads branch, contingent on your disposition in this tails branch.

  In XOR Blackmail, a predictor sends you a demand for $100 if and only if exactly one of the following is true: you have termites causing $10,000 in damage, or the predictor predicts you would refuse the demand. If you receive the demand, paying prevents the termite damage if you have termites; if you lack termites, paying is a pure loss. Refusing saves the $100 but leaves termite damage unchecked if termites exist.

  The strongest argument for paying in both cases rests on the logical connection between your present choice and the predictor's prior modeling. You and the predictor share the same decision algorithm. Your choice now is evidence of what the predictor modeled earlier. By choosing to pay, you instantiate the policy of a "Payer." In the Mugging, being a Payer is the only way to be the kind of agent who receives the $10,000 in the heads branch. In XOR Blackmail, adopting a policy of paying ensures the demand is sent only when you have termites (True XOR False = True). If you adopt a policy of refusing, the demand is sent only when you lack termites (False XOR True = True), meaning you remain silently vulnerable when termites are present. Thus, paying aligns your decision procedure with outcomes that maximize expected utility across all possible worlds.

  The strongest argument against paying relies on causal inertness. Once the request arrives, the coin has already landed, and the termites are either present or absent. Paying $100 cannot causally reach back to change the coin flip or summon the predictor's gift. In XOR Blackmail, paying cannot physically remove termites that are already there; it merely transfers money. From this perspective, paying rewards manipulation or succumbs to a sunk cost fallacy. A rational agent should maximize actual causal consequences in the present moment, not chase phantom benefits determined by past predictions.

  This debate highlights the distinction between choosing an act now and adopting a policy beforehand. Causal reasoning evaluates the isolated act: paying changes nothing physically. Functional reasoning evaluates the policy: being the sort of agent who pays determines whether the beneficial conditions obtain. Rationality should govern the selection of the decision procedure, not just the immediate output.

  The cases differ in the nature of the benefit. In the Mugging, the benefit is a withheld gift in a counterfactual world. In XOR Blackmail, the benefit is disaster avoidance in the actual world, mediated by the predictor's rule for sending warnings. In the Mugging, paying buys you a win in a branch you didn't visit. In XOR Blackmail, paying ensures that if you face the decision, you are in the dangerous state where payment is useful, while refusing ensures you face the decision only in the safe state where payment is useless—but leaves you unprotected when you don't face the decision.

  The verdict is that a self-interested agent should pay in both cases.

  This verdict must be defended against the causal objection that paying cannot change the past. This objection fails because it misunderstands the locus of control. The predictor does not react to your specific action in time; it reacts to your decision algorithm. You cannot change the past, but your current output *is* the realization of the algorithm that determined the past setup. To refuse payment is to declare yourself an agent who loses the $10,000 in the heads branch of the Mugging and an agent who suffers silent termite damage in the XOR scenario. While paying feels like a loss in the immediate causal chain, it is the necessary tax for inhabiting a reality where your decision procedure commands favorable predictions. Rationality requires acting as if you choose the algorithm, not just the act. Therefore, to secure the best possible world-state consistent with your existence, you must pay.
