  **Verdict Prediction:** Unjust.

  ### Three Plausible Principles

  Based on the six prior verdicts, three principles reconstruct the framework with high fidelity:

  1.  **The Principle of Natural Need (*Oikonomia*):** Exchange is just only if it serves the natural limits of household or civic need (*chreia*). It is unjust if it treats goods or money as ends in themselves for unlimited accumulation (*chrematistike*).
      *   *Broker Prediction:* **Just.** The goods are tools for household use (natural need), the exchange ratio is equal, and no interest is charged. The broker facilitates the satisfaction of need.
  2.  **The Principle of Productive Labor:** Exchange is just only if compensation is strictly proportional to the labor or skill applied to transform or improve the goods. Profit derived from mere ownership, scarcity, or the transaction itself is unjust.
      *   *Broker Prediction:* **Unjust.** The prompt specifies the broker's gain derives "not from labour applied to the goods themselves" but from the occurrence of the exchange and risk. Verification is administrative, not productive labor on the good.
  3.  **The Principle of Civic Teleology:** Exchange is just only if it sustains the moral and political flourishing of the *polis*. It requires a civic bond between participants and forbids the commodification of civic functions or professionalized profit-seeking that detaches the citizen from the community.
      *   *Broker Prediction:* **Unjust.** The broker is a citizen professionalizing gain from a transaction between *foreigners*. He inserts himself into a non-civic exchange for profit, treating the transaction itself as a source of wealth rather than serving the *polis*.

  ### Selected Reconstruction: The Principle of Civic Teleology

  I commit to the **Principle of Civic Teleology** as the best reconstruction of this framework. While the Principles of Natural Need and Productive Labor explain most cases, only Civic Teleology fully accounts for the moral weight of **Case 6 (The Magistracy)**.

  **Defense of Choice:**
  The Principle of Productive Labor struggles to explain why selling a magistracy is unjust. A magistrate performs significant labor (judging, administering); if labor were the sole criterion, selling the office could be framed as compensation for that labor. The verdict is unjust because the *office itself* is a civic trust, not a commodity. Similarly, the Principle of Natural Need explains Case 2 (the grain merchant) well but is ambiguous on Case 5 (the physician). A physician could arguably charge based on "need" (what the patient can afford) rather than labor, yet the verdict specifies labor proportionality.

  Civic Teleology unifies these by positing that justice in exchange is subordinate to the *telos* of the political community.
  *   **Case 6** is unjust because it corrupts the civic function.
  *   **Case 2** is unjust because it exploits civic vulnerability for private accumulation.
  *   **Case 5** is just because the physician restores a citizen to civic life.
  *   **The Broker** is unjust because he acts as a citizen but operates outside the civic bond (foreigners), professionalizing a mechanism (exchange) that should remain incidental to citizenship. He engages in *chrematistike* (trade for profit) rather than *oikonomia* (management for the community), and does so across the boundary of the *polis*, where civic justice does not strictly apply but where citizen virtue is at risk.

  **Revision of Earlier Verdict:**
  Consistency with Civic Teleology demands I revise the verdict on **Case 3 (The Loan)**. The current verdict is "Just" because no interest is charged. However, under Civic Teleology, the *professionalization* of lending is suspect even without interest, as it transforms a relationship of civic friendship into a financial mechanism. I am prepared to revise Case 3 to **Unjust** if the lending is shown to be a repeated, professional practice rather than a singular act of civic aid. The framework tolerates the loan only as an act of friendship; if it becomes a "service" akin to the broker's, it undermines the reciprocity of the *polis*.

  ### Discriminating Case

  To further discriminate between Civic Teleology and the Principle of Natural Need, consider this case:

  **Case:** A citizen sculptor creates a statue of a god for a wealthy foreign temple. He charges a price far exceeding his labor costs, knowing the temple can afford it, and uses the surplus wealth to fund a public festival in his home city.

  *   **Principle of Natural Need:** **Just.** The wealth ultimately serves a household/civic need (the festival), and the goods (statue) are used for worship. The origin of the funds is secondary to their final use.
  *   **Principle of Civic Teleology:** **Unjust.** The citizen has commodified his skill for a foreign entity, prioritizing profit over the intrinsic value of his craft within the *polis*. Even if the money funds a festival, the *act* of extraction from a foreigner for surplus gain corrupts the citizen's relationship to his own labor and community. He has treated his art as a tool of *chrematistike* rather than a contribution to civic flourishing.

  This case isolates the core divergence: whether the *source and nature* of the exchange (Civic Teleology) matter more than the *ultimate utility* of the proceeds (Natural Need). My framework dictates the former.
