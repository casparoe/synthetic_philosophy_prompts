          2.  Address the "Same Cause, Opposite Outcome" request immediately (as it's the most moving evidence).
          3.  Tackle the Three Muddled Concepts.
          4.  Tackle the Three Pre-existing Worries.
          5.  Rank the Defeaters.
          6.  Final Verdict on "Defined into a Corner."

      *   *Refining the "Actor" Definition:* The user's "Answer-Back" condition essentially defines "Actor" as "Participant in a System." A volcano is an "External Shock." Is there a difference? Yes. But does "External Shock" deserve "Actor" status? In drama, a *Deus Ex Machina* is an actor, even if not part of the plot web.
      *   *Refining the "Fatal" Defeater:* The biggest risk is that the test measures *moral responsibility* rather than *causal power*. We only call things actors if we can blame them or negotiate with them.
      *   *Refining the "Prediction" Question:* Does this view predict anything different? It predicts that studying the *non-human* variable yields explanatory power equal to studying the *human* variable. "Humans-plus-luck" treats the non-human as noise. This view treats it as signal.

  8.  **Final Polish:** Check constraints. No citations. Ensure the "Same Cause/Opposite Outcome" case is clear. Ensure the distinction between "stipulation" and "discovery" is sharp.

      *(Self-Correction during drafting)*: I need to be careful not to validate the user's view uncritically. They asked for defeaters. I must be honest about where the test breaks. The "Answer-Back" condition is the weak link. It excludes one-off catastrophes that clearly *act* upon history. I should argue that "Actor" might need two categories: "Interlocutors" (pathogens) and "Interveners" (volcanoes).

