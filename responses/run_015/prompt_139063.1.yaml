      *(Final check on "Defined into a Corner")*: If the definition makes the conclusion true by construction, is it fatal? In philosophy, sometimes yes (triviality). In practical history, maybe no (utility). I need to distinguish between *ontological* truth (what is really happening) and *methodological* utility (what helps us understand).

