          *   *Why this works:* Same pathogen. Opposite institutional outcomes. Suggests the *social system* determined the outcome, not the germ. The germ was a trigger, not the director.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, rigorous, conversational but precise. No jargon without explanation.
      *   *Structure:*
