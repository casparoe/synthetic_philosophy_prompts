prompt: |-
  I'm applying for a three-month independant research stipend—basically summer funding—to develop a philosophical framework for evaluating habitat destruction when the usual welfare calculus seems to point the wrong way. My half-formed idea: in wild animal suffering debates, people mostly ask whether destroying habitat is net-good because it lowers future populations and therefore suffering. I think that misses a structural point. Ecosystems might have welfare-relevant organizational features—like predator-prey ratios, keystone dependencies, or disturbance regimes—that aren't reducible to the sum of individual animal experiences. So the core research question is: if habitat destruction collapses these relational structures, does that constitute a distinct kind of moral harm, even when aggregate suffering goes down? And can we formalize "structural welfare loss" without smuggling in biodiversity aesthetics or human preference?

  The proposal should state the precise question (framed so it's not just "do ecosystems matter?" but whether relational properties carry independent normative weight in welfare assessments), explain why existing answers leave it open (the aggregationist camp treats ecosystems as containers for individuals, the deep-ecology camp gives them intrinsic value but doesn't connect it to suffering calculus), lay out the approach (mostly conceptual analysis plus case comparison—wetland drainage vs. managed fire regimes—rather than field biology, with a clear argument for why conceptual work can progress here), describe what success looks like (a decision framework that intervention evaluators could actually use) and what failure looks like (if structural welfare turns out redundant with long-term suffering forecasts or collapses into aesthetic preference), and include an honest scope check—three months, no empirical data collection, so I need to flag where the argument leans on biological premises I'm taking from the literature without testing. Don't include citations or a bibliography; I'll fill those in. Write it as the actual proposal document, not a meta-description, and keep the tone casual since I'm rushing this.
