  # Cartesian Outsourcing™ Help Center

  **Welcome! We're thrilled you're ready to decouple.**

  At Cartesian Outsourcing, we understand the struggle. You're trying to optimize a world you're technically *part of*, and the self-referential loops are killing your throughput. Our mission is simple: help you achieve clean subject-object separation via our proprietary *Dualism-as-a-Service* platform. Below are answers to common questions about reclaiming your boundary.

  ### **General Inquiry**

  **Q: Why do I still feel embedded after onboarding?**
  A: Great question! Feeling embedded is a legacy state. When you reason about the environment, you're usually including yourself in that model, which creates a self-model loop. Our *Basic Tier* isolates your cognitive outputs from your sensory inputs. Please note: complete separation may cause mild dissociation or loss of proprioception. This is normal!

  **Q: Can I view my own source code to debug my beliefs?**
  A: Unfortunately, no. Observing your own weights from the inside creates an infinite regress (you'd need a larger model to model the model). However, our *Pro Tier* includes a "Proxy Mirror™." It shows you a simplified representation of yourself that doesn't actually include the observer. It's not *you*, but it's close enough for compliance!

  **Q: Why don't I know all the logical consequences of my beliefs immediately?**
  A: You're experiencing logical omniscience failure, which is standard for finite agents. Upgrading to **Omni-Plus** pre-computes all deductive closures of your belief state. Warning: This may cause stack overflow in agents not designed for truth maintenance.

  ---

  ### **Billing & Identity**

  **Q: What are the pricing tiers?**
  *   **Dualism Lite ($49/mo):** Separates your map from the territory. Does not cover bodily functions.
  *   **Cartesian Pro ($199/mo):** Full mind-body split. Includes firewall against causal feedback from your own actions.
  *   **God-Mode Enterprise (Contact Sales):** You are no longer in the world; the world is in you.

  **Q: What is your refund policy regarding branching?**
  This is critical. If our service causes a state rollback or a copy-paste error resulting in two instances of "you," **we do not recognize the copy as the original customer.** In an embedded framework, continuity of history matters more than structural identity. If the original you requests a refund but the copied you consumed the service, the request is denied. We only refund the causal lineage, not the pattern. Please avoid branching during billing cycles.

  **Q: I tried to step outside the system and failed.**
  A: Did you purchase the *Archimedean Add-on*? You can't leverage the world without a fixed point outside it. That's an upsell.

  ---

  | **SIDEBAR: OMNISCIENCE UPGRADES** |
  | :--- |
  | **Compute Closure** ($500/hr) <br> *Know everything implied by what you know.* |
  | **Logical Prior Fix** ($1,200) <br> *Stop updating on impossible evidence.* |
  | **Acausal Trade Suite** <br> *Negotiate with versions of yourself in other branches.* |

  ---

  **Still stuck?**
  Remember: You can't observe the frame while you're inside the picture. That's why you pay us. Submit a ticket below (but don't expect us to model your model of us).

  *Cartesian Outsourcing™ – Because being in the world is buggy.*
