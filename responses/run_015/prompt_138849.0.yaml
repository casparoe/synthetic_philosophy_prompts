answer: |-
  1. **In Hanson's version, the market is scored on reality. In yours, it's scored on an estimate. So what does it even mean for the market to be *wrong*?**
     *(Listeners need to know: In standard futarchy, you see what actually happened. In your version, you only see what the panel says would have happened.)*
     **Likely Answer:** She'll say traders price the asset by reasoning about the counterfactual, so the price represents the expected counterfactual, not just a correlation.
     **Follow-up:** But if that counterfactual is never observed, how do you know the market learned anything? Can a market build a track record on a quantity that is essentially a ghost?

  2. **The panel has to choose a method to estimate the counterfactual—synthetic control, structural model, expert elicitation. Rival methods give different numbers. Doesn't picking the method decide, retroactively, which policies would have won?**
     *(Listeners need to know: There isn't one true way to calculate a "what if" scenario.)*
     **Likely Answer:** She'll say this is a measurement question, not a governance question, and we just use best practices.
     **Follow-up:** But traders know the panel's habits in advance. Aren't they just betting on the panel's methodology biases rather than the world?

  3. **You have a second-order market that trades on what the panel will say, to keep them honest. But who audits that market?**
     *(Listeners need to know: She proposes a market on the auditors to prevent corruption.)*
     **Likely Answer:** She'll probably say the regress stops somewhere at a boring fixed rule, and that's a measurement issue.
     **Follow-up:** Then the whole system inherits whatever credentials that terminal rule has. Why shouldn't we just evaluate that rule directly, instead of building a market on top of it?

  4. **Hanson worries about people sabotaging the realized outcome to win a bet. You say sabotage is harder on counterfactuals. But you can't move the realized number, you *can* move the estimate.**
     *(Listeners need to know: In her system, payouts depend on the panel's report, not GDP.)*
     **Likely Answer:** She'll argue it's harder to move an expert consensus than a raw economic index.
     **Follow-up:** So the attack surface just relocates from the economy to the academy. Who has the incentive to fund the studies or capture the panel, and is that easier than sabotaging a factory?

  5. **The state is both the decision-maker and the counterparty that has to honor a payout five years and one election later.**
     *(Listeners need to know: The government runs the market and has to pay out if the market says they chose wrong.)*
     **Likely Answer:** She'll say we design the contracts to be affordable and legally binding.
     **Follow-up:** But if the estimate says the rejected policy was better, the state admits failure. Will a future government honor a bet that says they shouldn't be in power?

  6. **Voters are supposed to keep control of the welfare measure, but the measure can be revised between the trade and the settlement.**
     *(Listeners need to know: The definition of "national welfare" might change while bets are open.)*
     **Likely Answer:** She'll say you settle on the definition frozen at the time of the trade.
     **Follow-up:** Then the market is pricing a definition we've since rejected. Does revising the measure now expropriate people holding open positions?

  7. **Settlement is five or ten years out. Markets will be thin, original traders gone, and the winners and losers are different generations.**
     *(Listeners need to know: Long time horizons make markets illiquid and change who benefits.)*
     **Likely Answer:** She'll say the measure can just include long-run components to account for this.
     **Follow-up:** But discounting the future is a value choice. Are you smuggling values into the measurement that should be voted on?

  8. **Some policies change who is in the population—migration, fertility, people who don't exist yet. So the market is doing value work on who counts.**
     *(Listeners need to know: Standard objections say you can't separate values from beliefs when the population changes.)*
     **Likely Answer:** She'll say this is what the welfare measure is for; the market just takes the weights as given.
     **Follow-up:** So the measure needs to settle every philosophical question about personhood in advance. Are you really proposing a constitution written in the form of an index?

  9. **Your slogan is "vote on values, bet on beliefs." But your fix requires a panel to judge beliefs using methods that affect values.**
     *(Listeners need to know: Her core pitch is separating moral goals from factual predictions.)*
     **Likely Answer:** She'll say the audit mechanism preserves the separation by keeping the values fixed in the index.
     **Follow-up:** But if the audit method influences the payout, doesn't the mechanism blur the line you're trying to draw?

  10. **You like to say "run it on city councils and compare." But if the whole point is that the counterfactual is unobservable, the pilot can't discriminate.**
      *(Listeners need to know: She proposes empirical testing to prove the system works.)*
      **Likely Answer:** She'll say we can look at secondary indicators or expert consensus on the pilot's success.
      **Follow-up:** Name the observable proxy you'd accept, and the result that would make you give the thing up.
