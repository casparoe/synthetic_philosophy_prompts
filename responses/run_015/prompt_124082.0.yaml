answer: |-
  **Session Goal:** Demonstrate that Bostrom's probabilistic conclusion ($P(sim) \approx 1$) collapses if the Self-Sampling Assumption (SSA) fails due to ontological differences between base and simulated observer-moments, specifically via "patchwork" rendering.

  **Explicit Exclusions:**
  State clearly at the outset: We are bracketing the Computation Theory of Consciousness (whether silicon can feel) and Modal Realism (whether possible worlds exist). We assume consciousness is substrate-independent and only actual worlds matter. This isolates the argument to *probability theory* and *reference class selection*.

  **Conceptual Dependency:**
  Before the sampling problem makes sense, students must accept the **Principle of Indifference over Observer-Moments**. Bostrom's math requires that your current conscious experience is a random sample from a fixed, countable set of all possible observer-moments (base + sim). If "observer-moment" lacks stable identity conditions across base and sim realities, the set cannot be counted, and the probability calculus fails.

  **Teaching Arc (50 Minutes):**

  **0–10 mins: The Hidden Premise (SSA)**
  *   Briefly state Bostrom's trilemma but immediately pivot away from the "technological feasibility" horn.
  *   Focus on the probabilistic horn: We are likely simulated because simulated observers outnumber base observers.
  *   **Crucial Move:** Expose the engine. This only works if you accept the Self-Sampling Assumption: you should reason as if you are a random draw from the urn of all observers.
  *   **Condition:** This requires the urn's contents (observer-moments) to be comparable units. If base moments and sim moments are not ontologically equivalent tickets, you cannot mix them in the same urn.

  **10–25 mins: The Concrete Scenario ("The Frugal Ancestor")**
  *   **The Scenario:** Instead of a "full physics" ancestor simulation, propose a **Patchwork Simulation**. The simulator saves compute by only rendering high-fidelity physical states (including conscious brains) within the specific light-cone of an observing agent. Unobserved regions are low-res data structures or null.
  *   **Why the Standard Example Misleads:** The usual "ancestor simulation" implies a 1:1 ontological mapping (a full universe in a box). This smuggles in the assumption that sim-observers are continuous, independent entities just like base-observers, making the uniform sampling assumption feel intuitive.
  *   **The Break:** In the Frugal scenario, a simulated observer-moment is *constituted* by the act of observation in a way base moments may not be. In base reality, the unobserved world exists independently; in the patchwork sim, it does not. This creates a structural asymmetry. If the *conditions of existence* for an observer-moment differ between base and sim, they belong to different reference classes. You cannot apply uniform sampling across distinct classes.

  **25–35 mins: Head Off Misconceptions**
  *   **Misconception 1: "We could detect seams."**
      *   *Intervention:* Stop this during the Scenario setup (min 15). Clarify that this is not an empirical claim about glitches. Even a perfect, seamless patchwork simulation breaks the *probability logic*, not the phenomenological experience. The argument is about the countability of the reference class, not the quality of the graphics.
  *   **Misconception 2: "This is just The Matrix."**
      *   *Intervention:* Stop this during the Hidden Premise section (min 10). Emphasize that Bostrom's argument is about *statistics*, not deception. The "Matrix" implies a malicious deceiver; the SA implies a statistical inevitability. The patchwork critique targets the statistics, regardless of intent.

  **35–45 mins: The Vulnerability (Synthesis)**
  *   Walk through the consequence: If patchwork simulations are the norm (because they are computationally cheaper), then the majority of "observers" might be patchwork entities.
  *   However, because patchwork entities have different existence conditions (contingent on observation vs. continuous), we cannot assign them equal weight in the probability calculus.
  *   Therefore, the ratio $N_{sim} / (N_{sim} + N_{base})$ is undefined. The probabilistic conclusion vanishes not because simulations are impossible, but because the *sample space* is incoherent.

  **45–50 mins: End-of-Session Check**
  *   **The Question:** "If I grant you that patchwork simulations are technologically feasible and phenomenally identical to base reality, why does the ratio of simulated-to-base observers no longer dictate the probability of us being simulated?"
  *   **Success Criterion:** They must answer by referencing the **reference class** or **indifference principle**, not by citing technological limits or empirical detectability. They need to articulate that the "units" being counted are not equivalent.

  **One-sentence summary of the plan:**
  This session isolates the Self-Sampling Assumption as the Simulation Argument's vulnerable premise and uses a "patchwork rendering" scenario to demonstrate that ontological asymmetries between base and simulated observers invalidate the uniform sampling required for Bostrom's probabilistic conclusion.
