answer: |-
  Here is the specification for a theory of Karmic Desert, structured to meet your constraints and isolate the structural tensions.

  ### The Specification: Requirements for Karmic Desert

  **1. Non-Consequentialist Fittingness (The Core Constraint)**
  *   **Spec:** The suffering incurred must be *owed* in virtue of the past act, not merely *useful* for future improvement. The value of the suffering must lie in its correspondence to the act, not its causal efficacy in reforming the agent or balancing a cosmic utility function.
  *   **Rationale:** This prevents the collapse into "spooky consequentialism." If the suffering is justified only because it makes the agent better next time, it is rehabilitation, not desert.
  *   **Status:** **Non-Negotiable.** (Without this, you are not doing retributivism).

  **2. Intention-Sensitivity (The Agency Filter)**
  *   **Spec:** Desert must track the quality of the will (intention/volition), not merely the causal outcome. Accidental harm generates less or no desert; accidental benefit generates no merit. Negligence must be accounted for as a failure of will, not just bad luck.
  *   **Rationale:** Without this, karma is just physics. A theory of *desert* requires a moral agent, not just a causal node.
  *   **Status:** **Non-Negotiable.**

  **3. Falsifiability in a Beginningless System (The Logical Constraint)**
  *   **Spec:** The theory must allow for the possibility of *undeserved* suffering. It cannot be the case that "all suffering is deserved" is a tautology derived from the assumption of infinite past lives. There must be a principled limit on how far back debt can be drawn, or a cap on debt accumulation, or a mechanism for debt dissolution that isn't triggered by *every* instance of suffering.
  *   **Rationale:** Addresses the "beginningless ledger" problem. If every pain is proof of past sin, the theory explains nothing and cannot be tested or argued against.
  *   **Status:** **Non-Negotiable.** (Without this, the theory is vacuous).

  **4. Identity Continuity (The Subject Constraint)**
  *   **Spec:** There must be a principled account of why *this* sufferer is the *same* entity as the *past* actor, sufficient to ground debt, without requiring strict numerical identity (which memory loss threatens) or collapsing into pure causal connectedness (which is too loose).
  *   **Rationale:** Addresses the "branch case" and "asymmetric memory." If identity is too loose, anyone can pay anyone's debt. If too strict, memory loss breaks the link.
  *   **Status:** **Non-Negotiable.**

  **5. Normative Access (The Promulgation Constraint)**
  *   **Spec:** An agent must have some access to the normative structure they are violating to accrue desert. (Does one need to know karma exists to break it? Or is it enough to know "harming is wrong"?)
  *   **Rationale:** Addresses the "pre-contact ancestor." It feels unjust to be bound by laws you could not in principle know.
  *   **Status:** **Taste.** (You can argue karma is like gravity—binding regardless of knowledge—but this weakens the "moral" claim).

  **6. Non-Transferability of Debt (The Individuality Constraint)**
  *   **Spec:** The suffering owed for an act must be borne by the continuum that performed the act. Merit might be transferable, but *debt* (negative desert) cannot be offloaded to another without breaking the fittingness link.
  *   **Rationale:** Addresses "laundering." If I can pay your karmic debt, the suffering is no longer *fitted* to your agency.
  *   **Status:** **Taste.** (Some traditions allow transfer; if you allow it, you must explain how desert remains individual).

  **7. Persistence Despite Reformation (The Retributive Constraint)**
  *   **Spec:** Moral transformation of the agent does not automatically erase accrued debt. The debt is attached to the *act*, not the current character state.
  *   **Rationale:** Addresses the "reformed agent." If becoming good erases the debt, the debt was only ever a tool to make you good (Consequentialism). If the debt remains, it is true Desert.
  *   **Status:** **Non-Negotiable.** (For the specific retributive project you outlined).

  ---

  ### The Incompatibility Trilemma

  You likely cannot hold these three together without significant metaphysical gymnastics:

  1.  **Beginninglessness:** The series of lives has no first term.
  2.  **Specific Falsifiability:** It is possible to identify specific suffering as *undeserved*.
  3.  **Strict Proportionality:** Every unit of suffering corresponds to a specific unit of past bad will.

  **Why:** If time is infinite and every bad act generates debt, the backlog is infinite. If the backlog is infinite, *any* amount of suffering can be justified as "paying down a fraction of the infinite debt." This makes it impossible to say "this specific suffering is *not* owed." To save Falsifiability, you must either posit a **Statute of Limitations** (violating Strict Proportionality/Beginninglessness) or a **Cap on Debt** (violating Strict Proportionality).

  *Secondary Tension:* **Transferable Merit** vs. **Non-Consequentialist Fittingness**. If merit/debt is transferable, the suffering is no longer *fitting* to the specific agent's will. It becomes a communal pool resource, which undermines the retributive "you did it, you pay it" structure.

  ---

  ### Scoring Three Readings

  **1. Karma as Cross-Life Desert (Your Target)**
  *   **Fittingness:** Pass (by definition).
  *   **Intention:** Pass (usually).
  *   **Falsifiability:** **Fail.** (Most traditional versions collapse into "all suffering is deserved" due to beginninglessness).
  *   **Identity:** Strained (relies on "causal continuity" which is often too weak for desert).
  *   **Reformation:** Pass (debt remains).
  *   **Verdict:** Theoretically robust on ethics, logically fragile on metaphysics.

  **2. Karma as Causal Effects on Character (The "Spooky Consequentialist")**
  *   **Fittingness:** **Fail.** (Suffering is justified by future improvement, not past debt).
  *   **Intention:** Pass (bad habits form from bad acts).
  *   **Falsifiability:** Pass (empirical claim about psychology).
  *   **Identity:** Pass (psychological continuity).
  *   **Reformation:** **Fail.** (Debt dissolves when character improves).
  *   **Verdict:** Philosophically safer, but fails your core purpose. It is therapy, not justice.

  **3. Karma with Transferable Merit (The "Banking" Model)**
  *   **Fittingness:** **Fail.** (Suffering/benefit is detached from the specific agent's will).
  *   **Intention:** Pass.
  *   **Falsifiability:** Pass (balances can be zeroed).
  *   **Identity:** **Fail.** (If I pay your debt, the link between *your* act and *my* suffering is broken).
  *   **Reformation:** Variable.
  *   **Verdict:** Socially functional, but structurally incompatible with a theory of *individual desert*.

  ---

  ### The Knockout Requirement

  **Requirement #1: Non-Consequentialist Fittingness.**

  This is the single requirement that does the most work.
  1.  It immediately disqualifies the "Causal Character" reading (Reading 2), which is the most common philosophical dilution of karma.
  2.  It disqualifies the "Transferable Merit" reading (Reading 3), because transferability turns desert into a resource allocation problem rather than a justice problem.
  3.  It forces you to solve the **Beginningless/Falsifiability** problem. If suffering must be *fitting* and not just *useful*, you cannot simply say "infinite past debt justifies anything." You must explain why *this* pain fits *that* act specifically.

  If you keep this requirement rigid, you cannot fall back on "it's for their own good" or "it balances the universe." You are left with the hard task of explaining how a blind, impersonal process tracks *moral fittingness* specifically, without a judge to declare it fitting. That is the hard core of the theory you are trying to build.
