answer: |-
  **Project Title:** The Coherence of Critique: Testing the Internal Tensions of Effective Altruism's Opponents
  **Applicant:** [Your Name]
  **Duration:** 6 Months (0.5 FTE)

  **Project Summary**
  Effective Altruism (EA) faces three standard critiques: it ignores structural political change; its "earning-to-give" advice relies on fragile labor market counterfactuals; and its measurability bias favors quantifiable interventions over diffuse, long-term goods. While each critique is well-trodden, no one has rigorously tested whether they *compose*. My suspicion is that they do not: the demand for structural change (Critique 1) conflicts with the rejection of quantification (Critique 3), as ranking systemic bets requires expected-value comparisons. This project investigates whether these critiques form a coherent alternative philosophy or a contradictory set of intuitions.

  **The Question**
  Do the three standard critiques of EA constitute a stable, actionable framework, or do they collapse when held simultaneously? Specifically, does the structural critique require the quantifying moves it condemns? If a critic demands systemic change but rejects measurable proxies, on what basis do they recommend one systemic intervention over another? I will not assume the critiques are valid; I will test their logical compatibility.

  **Methodology: Three Cases, Two Tools**
  I will avoid abstract normative argumentation and pure data analysis. Instead, I will use three worked cases selected to span the measurable/systemic axis:
  1.  **Direct Delivery:** A high-certainty intervention (e.g., malaria bednets).
  2.  **Policy Reform:** A mid-horizon structural play (e.g., AI governance or biosecurity policy).
  3.  **Field Building:** A diffuse, long-run investment (e.g., funding a new research discipline).

  I will run each case through two analytical tools:
  *   **The Universalization Test:** Does the reasoning survive if everyone acts on it? (e.g., "Take the highest-paying job" fails this; "Buy a bednet" passes). I will test if this tracks the measurable/systemic divide.
  *   **Endogenous Measurability:** Does the act of funding create the metric? I will investigate if "measurable" is a fixed feature or an artifact of the funding regime (Goodhart's Law in practice).

  **Timeline (6 Months, 50% Time)**
  *   **Month 1:** Finalize case selection; preliminary interviews with critics and proponents to map the logical boundaries.
  *   **Months 2–4:** Deep dive into one case per month. Interviews with program officers, critics, and beneficiaries. Apply the "battery" of tests to each.
  *   **Month 5:** Synthesis. Identify where the critiques compose and where they fracture. Draft the "Stress-Test Checklist."
  *   **Month 6:** Write long-form feature; refine checklist; peer review with one philosopher and one practitioner.

  **Deliverables**
  1.  **Long-form Feature:** A 6,000–8,000 word magazine article suitable for *The Atlantic*, *Wired*, or *Future Perfect*.
  2.  **The Stress-Test Checklist:** A one-page practical tool for donors and analysts to run giving recommendations through the universalization and endogeneity filters.

  **Why a Journalist?**
  A philosopher would analyze the logical consistency of the critiques in a vacuum. A data scientist would attempt to measure funding flows. This project requires neither. It requires reporting on how these ideas function *in practice* within institutions. The tension between structural goals and measurable metrics is not just a logical problem; it is an organizational one. I will interview the people making these trade-offs, documenting how the theory breaks down (or holds up) when money actually moves. This is a story about institutional behavior, not just moral philosophy.

  **Potential Falsification & Intellectual Risks**
  I am proceeding with the hypothesis that the critiques are in tension, but I must acknowledge where this framing could be wrong.
  *   **The Measurability Collapse:** It is possible Critique 3 (Measurability) is the weak link. EA may already account for this via "proxy measures" or "process goals." If I find that EA actors are successfully funding unmeasurable systemic work without breaking their epistemic standards, the tension dissolves.
  *   **The Defender's Objection:** A smart EA defender would argue that "ranking" does not require perfect measurement, only comparative judgment. If I find that critics accept comparative judgment in practice while rejecting it in theory, my central thesis fails.
  *   **Changing My Mind:** To conclude the critiques *do* compose, I would need to find a critic who can articulate a ranking method for systemic interventions that explicitly rejects quantification without retreating into intuitionism. If I cannot find this account in the wild, the project must report that absence rather than assert the tension exists.

  ***

  **Consultant's Note on Feasibility (For Your Eyes Only)**
  Six months at 50% time is roughly 300 working hours. Three deep-dive case studies, including sourcing, interviewing, and synthesis, is extremely aggressive for that budget. You risk producing three shallow profiles rather than one deep argument.
  *   **Recommendation:** In the proposal, keep the three cases to show scope, but internally prepare to cut the third (Field Building) if Months 2–4 run long. Alternatively, frame Month 4 as a "comparative synthesis" month rather than a third full case.
  *   **The "Why a Journalist" Section:** This is strong. It distinguishes you from the academic applicants who will likely propose purely theoretical work.
  *   **The "Falsification" Section:** This is your strongest asset for a fellowship panel. It signals you are investigating, not litigating. Keep it exactly as drafted.
