prompt: |-
  I'm a senior taking an honors philosophy seminar, and for our final unit on deception the teacher has asked a few of us to draft a two-hour take-home essay question, with a model answer and a marking scheme, that she can use to check whether we actually understand the material rather than just recite definitions. I'd like the topic to be the moral difference between lying and misleading, because it's the part of the unit I keep getting stuck on. Our textbook defines lying as asserting something you believe to be false and simply says it's wrong, and it barely mentions misleading, so I've been trying to work out on my own whether there's a real substantive difference or whether the two are just the same wrongness in different packaging.

  The thing that's been nagging me is this: if the wrongness of deception is just in wronging the hearer by withholding the truth, then lying and misleading look exactly equivalent, because in both cases the hearer ends up with a false belief and the truth is hidden from them. So I want the question to force the writer to confront that equivalence, and then to seriously consider the less obvious position that misleading might actually be worse than lying — on the thought that, in misleading, the deceiver manipulates the hearer into drawing the false conclusion on their own, which both makes it easier for the deceiver to deny and turns the hearer into an instrument of their own error. I don't want the question to be answerable by just restating the lying/misleading definitions, and I don't want it to depend on any specific philosophers, texts, or citations, since I want it to be fair to someone who hasn't read the whole literature. Could you write the essay question, a model answer of about 600 words, and a marking scheme out of 20 marks that separates an A from a B by naming the specific moves each has to make?
