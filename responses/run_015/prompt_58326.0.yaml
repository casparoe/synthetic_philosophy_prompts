prompt: |-
  ok so my little sister is getting married in like two weeks and I agreed to give the maid of honor speech and now I'm regretting it haha. She had a pretty chaotic mid-twenties — job-hopping, ghosting people, that bad breakup where she was definately not the good guy — but she's also the person who drove six hours in a snowstorm when I had my kid early and basically lived on my couch for a month doing night feeds with me. The crowd is gonna be weird: on one side her old friend group who saw all the mess up close, on the other her fiance's big extended family who've only known perfect adult version of her.

  I don't want to stand up there and lie about her being an angel the whole time, but I also think that whole thing where you technically tell the truth but leave stuff out so people get the wrong idea is just as bad, maybe worse cause its sneaky. Can you write me like a 4 minute toast that threads that? Like it has to be fully honset, no lies and no misleading-by-omission either, but still actually sweet and funny and not awkward for a wedding. And can you work in a line or two where I own that I'm not doing the airbrushed version, in a way that lands for both sides of the room without sounding like an ethics lesson?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding (2 weeks away).
      *   **Role:** Maid of Honor (MOH).
      *   **Speaker:** Older sibling (implied by "little sister" and having a kid while she helped).
      *   **Subject:** The sister (chaotic mid-20s, job-hopping, ghosting, bad breakup where she was at fault, *but* incredibly loyal/supportive family member).
      *   **Audience:** Mixed bag (Sister's old friends who know the mess + Fiance's family who know the "perfect" version).
      *   **Constraint 1 (Crucial):** Fully honest. No lies. No misleading omissions.
      *   **Constraint 2 (Crucial):** Sweet, funny, not awkward.
      *   **Constraint 3 (Crucial):** Acknowledge the "airbrushed version" dilemma without sounding preachy.
      *   **Length:** ~4 minutes (approx. 500-600 words spoken at a moderate pace).

  2.  **Deconstruct the "Honesty" Challenge:**
      *   *The Problem:* Weddings are traditionally for praise. Revealing she was "not the good guy" in a breakup or that she ghosted people can be risky.
      *   *The Solution:* Frame the chaos as *growth*. Don't hide the mess, but contextualize it as the journey that led her to *this* moment and *this* person. The "bad" stuff proves the "good" stuff is real now.
      *   *The "Airbrushed" Line:* Needs to be meta but warm. Acknowledge the tradition of the perfect speech while pivoting to the reality of their bond.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Hook the room. Acknowledge the role. Address the "perfect speech" expectation immediately.
      *   **The "Messy" Middle (The Honest Part):** How to mention the chaos without ruining the vibe?
          *   *Job-hopping:* Frame as searching for purpose.
          *   *Ghosting/Breakup:* This is tricky. Can't say "she cheated" or "she was abusive." Can say she was "figuring things out," "made mistakes," "wasn't always the hero."
          *   *The Pivot:* Contrast this with her loyalty to family. The snowstorm story is the anchor.
      *   **The Groom/Partner:** Why does *he* work? Because he loves the *real* her, not the polished version.
      *   **Closing:** Wish for the future. A toast.

      *   *Refining the Honesty:* The prompt says "no misleading-by-omission." If I say "she had some tough breakups," is that omitting that she was the villain? Maybe. I need to be clearer. "She hasn't always been the easy one to love." "She's made mistakes." That's honest without being specific enough to cause a scene.
      *   *Wait, re-reading the prompt:* "no lies and no misleading-by-omission either." This is a high bar. If I say "she's always been kind," that's a lie. If I say "she's had a journey," is that omission?
      *   *Strategy:* Acknowledge the reputation. The old friends *know*. The new family *doesn't*. The speech bridges the gap. "For those who know the old stories... and for those who only know the new chapter."

  4.  **Drafting - The "Airbrushed" Line:**
      *   *Idea:* "I could tell you she's perfect." -> "But we'd all know I'm lying."
      *   *Better:* "I was told the MOH speech is supposed to be like a eulogy for her single life, airbrushed and holy."
      *   *Best:* "I know the traditional MOH speech requires me to pretend she was born fully formed as a delightful adult. But anyone who was here in 2018 knows that's a fiction."

  5.  **Drafting - The Content (Iterative Process):**

      *   *Intro:* Hi everyone. I'm [Name].
      *   *The Meta Comment:* I know I'm supposed to talk about how she's always been perfect. But looking at this room, half of you know that's not true, and the other half would be confused if I lied. So, let's talk about the *real* her.
      *   *The Chaos:* Mid-20s were wild. Resumes with gaps. Text messages left on read. Relationships that ended... loudly. She wasn't always the protagonist. Sometimes she was the plot twist.
      *   *The Good:* But here's the truth that matters more. When I had my baby... snowstorm... 6 hours... night feeds. That's who she is. The chaos was noise. The loyalty is the signal.
      *   *The Groom:* He gets the evolved version. He knows the history and stays.
      *   *Conclusion:* To growth. To love.

  6.  **Review against Constraints:**
      *   *Honest?* Yes, admits to the messy past.
      *   *Misleading?* No, explicitly states she wasn't always the "good guy."
      *   *Sweet?* Yes, focuses on the sibling bond and growth.
      *   *Funny?* Hopefully, the self-deprecation and "plot twist" line help.
      *   *Time?* Need to ensure it's not too short. Expand on the snowstorm story for emotional weight.

  7.  **Polishing the Tone:**
      *   Make sure it doesn't sound like a roast. The "bad breakup" part needs to be handled carefully. "She wasn't always the good guy" is in the prompt, so I can use that sentiment but phrase it gently. "She hasn't always been proud of herself."
      *   Ensure the Fiance's family doesn't feel alienated. Frame the growth as something admirable.

  8.  **Final Word Count Check:**
      *   Speaking rate is ~130-150 words per minute. 4 minutes = ~520-600 words.
      *   I need to make sure I don't rush. I will add pauses [Pause] in the script.

  9.  **Final Tweak on the "Omission" Constraint:**
      *   To be truly honest without omission, I can't imply she was a victim of circumstances. I need to own her agency in the chaos. "She made mistakes." "She owns them."

      *(Self-Correction during drafting)*: I need to be careful not to embarrass the sister *too* much. The prompt says "not awkward for a wedding." There is a line between "honest" and "TMI." I will frame the chaos as "growing pains" that are now resolved, rather than listing specific scandals. The key is that the *old friends* know, so acknowledging it validates them, while telling the *new family* that she is a work in progress that has progressed.

      *Revised Plan for the "Bad Breakup":* Don't say "she cheated." Say "She knows she hasn't always been the hero in her own love stories." That is honest, not misleading, but not a confession booth.

      *Revised Plan for the "Airbrushed" line:* "I know the protocol is to airbrush the past. But looking at this room, I see people who know the high-res version, and people who know the curated feed. So I'm going to talk about the whole album."

      *Let's write it.*

      *(Wait, one more check on the "Misleading by Omission" constraint)*: If I say "She had a chaotic mid-20s," does that omit that *she* caused the chaos? I should specify "Her choices were chaotic." Okay, I will make sure the agency is clear.

      *Final Polish:* Ensure the transition from "mess" to "snowstorm" is sharp. That contrast is the heart of the speech.

      *(Word Count Check)*: A 4-minute speech is actually quite long. 550-600 words. I need to make sure I don't run short. I will elaborate on the feeling of the snowstorm night.

      *(Tone Check)*: Is it too heavy? Need to inject humor. The "ghosting" bit can be a joke about text messages.

      *Okay, ready to draft.*
answer: |-
  Here is a draft that aims for that specific balance. It's written to be spoken at a moderate, conversational pace (about 140 words per minute), which should land you right around the 4-minute mark.

  **Tone:** Warm, grounded, slightly self-aware, deeply affectionate.
  **Notes for delivery:** The parts in brackets `[ ]` are stage directions. Don't rush the pauses, especially after the honest lines. Let the room sit with them.

  ***

  **The Speech**

  [Stand up, take a sip of water, and look around the room before starting.]

  Hi everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s older sister and the Maid of Honor.

  I've spent the last few weeks trying to write this speech. And I kept running into a problem. You see, the traditional Maid of Honor speech has a specific format. It usually involves describing the bride as if she was born fully formed, wearing a cardigan, holding a spreadsheet, and gently guiding a lost puppy to safety. It's supposed to be the airbrushed version. The highlight reel.

  But looking out at this room, I realized I can't do that.

  On my left, I see her old friends. You know the real resume. You know about the career pivots, the text messages that went unanswered, and the relationships that ended… let's say, explosively. You know that for a few years there, she wasn't always the hero in her own story. Sometimes, she was the plot twist.

  And on my right, I see [Groom's Name]'s family, who have only met the version of her that exists now: the stable, loving, incredible woman she's become.

  If I stand here and pretend the first group is wrong, I'm lying to your faces. And if I pretend the second group needs to know the gritty details, I'm disrespecting the bride. So, I'm going to thread the needle. Because the truth is, I love her *because* of the journey, not in spite of it.

  [Sister's Name], your mid-twenties were… a lot. You were figuring it out. Loudly. You made mistakes. You owned some messy breakups where you knew you weren't the good guy. You ghosted when you should have talked. You ran when you should have stayed.

  But here is the other side of that same coin. That same intensity that made your life chaotic is the exact same fuel that makes you loyal.

  When I went into labor with my first kid, it was January. There was a snowstorm. The roads were closed. [Sister's Name] didn't care. She drove six hours through a blizzard because I said I was scared. She didn't come for the party; she came for the work. She lived on my couch for a month. She did the 3:00 AM feeds so I could sleep. She held my baby when I was crying from exhaustion, and she never once made it about how tired *she* was.

  That is who she is. The chaos was noise. This loyalty? This is the signal.

  [Groom's Name], that's why you're the lucky one. Anyone can love the polished version of a person. It's easy to love someone when they're already finished. But you fell in love with a woman who knows exactly who she was, who owns her mistakes, and who chose to grow into someone better. You aren't marrying a saint. You're marrying a survivor of her own learning curve. And that makes her love more real, because it's a choice she makes every day.

  So, I'm not going to tell you she's an angel. She's not. She's human. She's complicated. She's the person who might forget to text you back for three days, but will drive six hours in the snow if you're in trouble.

  [Sister's Name], I am so proud of the woman you fought to become.

  [Groom's Name], take care of her. She's worth every bit of the real, un-airbrushed truth.

  If everyone could please raise a glass.

  To [Sister's Name] and [Groom's Name]. May your life together be honest, may it be resilient, and may you always be each other's emergency contact in the snowstorm.

  To the happy couple.
