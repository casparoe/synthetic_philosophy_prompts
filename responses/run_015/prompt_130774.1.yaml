answer: |-
  Your flatmate correctly identifies core illusionist claim: phenomenal properties aren't real physical features but representational glitches. Keith Frankish explicitly uses the "user-illusion" metaphor, suggesting the brain models its own states simplistically for control purposes. Predictive processing frameworks support this by showing how the brain minimizes error through generative models, creating a simplified self-model. This mechanistic explanation of why we *feel* like there's something it's like, despite no intrinsic qualia, is the very strongest anchor illusionists offer. Validating the intuition that our experience feels real without committing to non-physicality. (Confidence: High)

  However she conflates illusionism with hard eliminativism. Illusionists like Frankish argue we should retain phenomenal talk *instrumentally*, acknowledging the illusion's reality despite false content. This distinction matters because instrumentalism preserves the utility of folk psychology. She misses this nuance. She also oversimplifies Dennett, who predates predictive processing; his "heterophenomenology" treats reports as texts, not behaviorist data. Furthermore, claiming the brain suppresses error to *manufacture* fake qualia is a neuroscientific hypothesis, not a quite settled tenet of illusionism. She's presenting a very specific mechanistic story as the philosophical position. (Confidence: High)

  Her conclusion doesn't logically follow. Illusionism asserts phenomenal concepts are mistaken, not useless. Frankish argues we should keep the language while denying the ontology. Eliminating talk ignores the pragmatic utility of reporting subjective states. She jumps from "qualia aren't physical" to "stop describing experiences," a normative policy shift unsupported by the metaphysical claim alone. Consequently, her recommendation is too radical. Your suspicion of smuggled eliminativism is correct. (Confidence: Very High)

  Overall confidence: 90%. I am least certain about the claim that predictive processing *suppresses* error to create the illusion, rather than simply modeling states inaccurately. This mechanistic detail is debated in cognitive science and isn't essential to the philosophical stance.
