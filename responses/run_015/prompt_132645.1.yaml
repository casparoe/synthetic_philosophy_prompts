  ### The Strict Structural Thesis: Analogy as the Engine of Cognition

  The claim that analogy-making is the core of cognition is often dismissed as a poetic overextension of a specific heuristic. To render this claim defensible and theoretically robust, we must adopt a Restrictive Formal Condition. Under this condition, a genuine cognitive analogy is defined not by superficial resemblance or loose metaphorical association, but strictly by the preservation of **relational invariance** across domains that share **no surface features**. Furthermore, this definition explicitly excludes identity-based pattern matching, where the source and target are merely tokens of the same type.

  This revised thesis posits that cognition is not merely aided by analogy; rather, the act of recognizing a structure in one domain and mapping it onto a structurally isomorphic but superficially distinct domain is the fundamental mechanism by which concepts are formed, stabilized, and extended. This argument proceeds by demonstrating how this restriction neutralizes standard objections regarding perception and deduction, how it avoids collapsing into tautology, and what it implies for the nature of innovation in formal sciences.

  #### I. Defending Against the Objection of Non-Analogical Processes

  The most common objection to the primacy of analogy is that certain cognitive operations appear to function without it. Specifically, critics argue that direct perception and formal deduction operate on immediate data or necessary rules, respectively, requiring no cross-domain mapping. The Restrictive Formal Condition dismantles this objection by revealing the hidden structural work in both processes.

  **Direct Perception as Structural Mapping**
  Critics argue that seeing a cup is a direct registration of sensory data, not an analogy. However, under the Restrictive Formal Condition, "seeing" is never raw data intake; it is categorization. To perceive an object as a "cup" is to map the current sensory input onto a stored structural schema of "containment" and "liftability." Crucially, the specific sensory input (the retinal array of light and shadow) shares no surface features with the abstract concept (the functional role of the object). The relational invariance lies in the affordances (the relation between hand and object), not the pixels. If perception were merely surface matching, we could not recognize a cup drawn in a cartoon, rendered in 3D, or described in text as the same functional entity. The ability to strip away surface features to identify the relational core *is* the analogical act. Therefore, perception is not distinct from analogy; it is the most immediate, low-latency application of structural mapping.

  **Formal Deduction as Degenerate Mapping**
  Similarly, formal deduction is often presented as rule-following distinct from analogical thinking. The objection holds that deriving $Q$ from $P \to Q$ and $P$ is a mechanical operation, not a creative mapping. However, the application of a logical rule to a specific content is itself a structural mapping. The rule exists in the domain of syntax; the content exists in the domain of semantics. To deduce correctly is to recognize that the relational structure of the semantic content preserves the invariance required by the syntactic rule. When a mathematician applies a theorem from number theory to a problem in topology, they are not merely following a rule; they are recognizing that the relational structure of the topological space is invariant with the number theoretic structure. Under the Restrictive Formal Condition, this is the definition of analogy. Deduction is not the absence of analogy; it is the verification that a structural mapping holds without distortion. Thus, neither perception nor deduction operates outside the analogical core; they represent the input and validation phases of the same structural mapping process.

  #### II. The Tautology Worry and the Principled Block

  A deeper philosophical worry threatens to undermine the thesis. If we concede that formal deduction is a form of analogical mapping (as argued above), we risk treating logical inference as a degenerate case where the source and target domains are identical. If every instance of cognition involves mapping a structure to a structure, and identity is permitted as a limit case of mapping, then the statement "all cognition is analogy" risks becoming tautological. It would amount to saying "all cognition is information processing," which is informative only if we define information processing as analogy. If the definition of analogy expands to include identity, the term loses its explanatory power.

  To block this collapse without abandoning the core thesis, we must introduce a principled distinction based on **Informational Gain via Domain Distance**.

  The tautology arises if we view cognition statically, as a state of being. However, cognition is dynamically defined by its adaptive capacity. A mapping between identical domains (identity) yields zero informational gain; it is a verification of consistency. A mapping between domains sharing no surface features (strict analogy) yields high informational gain; it is a generation of novelty. The core thesis is not that every cognitive event is a *successful* strict analogy, but that the *mechanism* driving cognitive growth is the pressure to maximize relational invariance while maximizing domain distance.

  We block the tautological collapse by asserting that the "core" of cognition refers to its **generative engine**, not its **boundary conditions**. While identity mapping (logic) serves as the stability check, it is the cross-domain structural mapping that drives concept formation. To say "all cognition is analogy" is therefore not to say "all cognition is identity," but rather "all cognition is the pursuit of identity across difference." The tautology is avoided because the predicate (analogy) imposes a constraint (domain distance) that the subject (cognition) must strive to satisfy to achieve conceptual growth. The statement becomes informative: it claims that the mind does not store abstract rules in a vacuum, but rather maintains a web of structural correspondences between disparate experiences. The "logic" is merely the skeleton where the distance between domains has shrunk to zero; the "cognition" is the muscle that stretches that skeleton across the void.

  #### III. Implications for Conceptual Innovation in Mathematics and Science

  This revised view fundamentally alters our understanding of conceptual innovation in mathematics and science. The traditional view suggests that innovation occurs through the accumulation of abstract rules or the extension of surface similarities (induction). The Strict Structural Thesis argues that genuine innovation consists in constructing high-invariance analogies across structurally distant domains.

  **Mathematics: Unification through Distance**
  In mathematics, progress is often mischaracterized as merely proving new theorems from existing axioms. However, the most profound innovations occur when a structure is recognized in a domain where it has no surface presence. Consider the unification of algebra and geometry. On the surface, equations (symbolic manipulation) and shapes (spatial extension) share no features. They are distinct domains. The innovation of analytic geometry was not the accumulation of new rules, but the construction of a mapping that preserved relational invariance between the two. A line was not "like" an equation; it *was* the structural equivalent of a linear equation. Under the Restrictive Formal Condition, this is the paradigmatic cognitive act. Innovation is not extending the rule of addition; it is realizing that the structure of addition governs the structure of rotation. Progress is measured not by the volume of derived truths, but by the distance of the domains brought into structural alignment.

  **Science: Mechanism over Regularity**
  In science, the standard empiricist view suggests we accumulate observations to find regularities. The analogical thesis suggests we innovate by imposing structural invariance on disparate phenomena. Consider the unification of terrestrial gravity and celestial mechanics. An apple falling and a moon orbiting share no surface features; one is linear descent, the other is cyclic orbit. Surface similarity would suggest they are different phenomena. Innovation occurred only when the relational structure (inverse-square force) was identified as invariant across both domains. The cognitive leap was not observing more apples or moons, but constructing the analogy that stripped away the surface difference (falling vs. orbiting) to reveal the relational identity (attraction).

  Consequently, scientific revolutions are not merely the replacement of false rules with true rules. They are the replacement of low-invariance analogies (based on surface features, e.g., "heavy things fall faster") with high-invariance analogies (based on deep structure, e.g., "mass curves spacetime"). A scientist who merely accumulates data is not innovating; they are populating a domain. A scientist who sees the structure of fluid dynamics in the flow of traffic is innovating, provided the relational invariance holds.

  #### Conclusion

  By restricting the definition of analogy to the preservation of relational invariance across domains with no surface features, we rescue the thesis from triviality. This restriction demonstrates that perception and deduction are not exceptions to analogical cognition but are instead dependent on the same structural mapping mechanisms. It avoids the tautological collapse by distinguishing between the degenerate case of identity (verification) and the generative case of distance (innovation). Finally, it reframes the history of human thought: conceptual progress in mathematics and science is not a ladder of accumulating abstractions, but a web of deepening structural correspondences. The mind is not a rule-book; it is a bridge-builder, and its core function is to span the gap between the known and the unknown using the invariant architecture of relation.
