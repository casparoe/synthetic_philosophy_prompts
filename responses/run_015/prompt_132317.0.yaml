prompt: |-
  I'm prepping an interview for my podcast with a philosopher who's been defending a kind of niche twist on Nozick's tracking theory. She thinks the usual anti-closure argument only works if you ignore that tracking is method-specific: if belief in p and belief in q (which p entails) are both formed by the same cognitive method, then closure actually holds for tracking, but it breaks once the entailment forces a switch in method. She calls it method-bound closure. I want eight to ten questons that don't just have her restate the tracking conditions. Need at least one on how she handles the standard lottery/paradox cases where tracking fails in nearby worlds, one on whether this collapses into reliabilsm once you specify what counts as 'the same method', and one on reflexive second-order knowledge—knowing that you know—when the tracking conditions are applied to the belief-forming process itself. For each, include a follow-up keyed to the answer she's most likely to give. No generic biography questions, and please don't ask for a reading list—this is for listeners who won't have the papers in front of them.
