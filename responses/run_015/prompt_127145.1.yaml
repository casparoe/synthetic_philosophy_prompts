      *   *Key Insight:* The User's rule confuses "Efficiency" with "Equity." It maximizes total output but distributes the *cooperative surplus* unfairly based on pre-existing advantages. The Colleague's rule (Nash) distributes the *surplus* generated by the merger more equitably relative to the threat point.
      *   *Correction on User's Math:* The user says "hands me nearly nine times her gain".
          *   My Gain: 25.7. Her Gain: 2.9. Ratio = 8.86. Correct.
