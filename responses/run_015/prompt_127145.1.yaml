          *   Actually, NBS depends on the *shape* of the utility function. If I claim my leverage is higher (10/month instead of 5), the NBS shifts *more* to me?
          *   Let's check: Max $(10x - 10)(10 - x)$. Deriv: $10(10-x) - (10x-10) = 100 - 10x - 10x + 10 = 110 - 20x = 0 \Rightarrow x = 5.5$.
          *   If I claim higher leverage, I get *fewer* months (5.5 vs 6), but more impact (55 vs 30).
