  2.  **Deconstruct the Philosophical/Mathematical Frameworks:**
      *   **The User's Proposal:** "Equal Proportion of Potential Gain." This is akin to a proportional equity model based on *capacity to benefit*. It assumes fairness means treating people equally relative to their maximum possible advantage.
