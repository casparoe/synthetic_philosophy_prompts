answer: |-
  To settle the normative "so-what" question, a viable account must ground construction in material and practical bases, distinguish it sharply from unreality, and accommodate unintended emergent kinds without relying on collective acceptance.

  1.  **Material-Practical Base**
      *   **Motivating Case:** Housing segregation (redlining maps plus brick walls versus mere zoning concepts).
      *   **Specification:** Construction is out of practices, institutions, and material infrastructure. Non-intentional and material elements are **permitted and often required**; forbidding them renders the account incapable of explaining structural inertia.
      *   **Status:** Non-negotiable.

  2.  **Differential Reflexivity**
      *   **Motivating Case:** Passing (race/gender) versus Counterfeiting (money).
      *   **Specification:** The account must explain variance in the concept/kind gap and error conditions across stock cases. The demand for a single univocal account of construction is itself the **prejudice** of one camp; distinct machinery is permitted where social ontology diverges.
      *   **Status:** Non-negotiable (on explanatory adequacy), Negotiable (on metaphysical unity).

  3.  **Contrast Stability**
      *   **Motivating Case:** Money (constructed but real) versus Monopoly Money (fictional).
      *   **Specification:** The account must mark the following distinctions without collapsing "constructed" into the right-hand column:

  | Contrast Term | Why Collapse is a Mistake | Case Showing Distinction |
  | :--- | :--- | :--- |
  | **Caused** | Construction implies constitution, not just etiology. | Sunburn (caused) vs. Tan (constructed norm). |
  | **Chosen** | Construction often operates without individual choice. | Caste assignment (constructed) vs. Club membership (chosen). |
  | **Conventional** | Construction can be coercive rather than arbitrary agreement. | Traffic laws (conventional) vs. Race (constructed/coercive). |
  | **Nominal** | Construction yields causal powers, not just labels. | Diagnosis (constructed) vs. Name tag (nominal). |
  | **Subjective** | Construction can be objective social fact. | Borders (constructed) vs. Preference (subjective). |
  | **Fictional/Unreal** | Construction creates real constraints and entities. | Debt (constructed) vs. Imaginary Friend (fictional). |

      *   **Status:** Non-negotiable.

  4.  **Unintended Emergence**
      *   **Motivating Case:** Algorithmic fraud clusters (unnamed, unintended, yet behaviorally efficacious).
      *   **Specification:** Construction must not presuppose collective acceptance or intention to create the kind. The requirement that construction operate without these conditions is a **real desideratum**, not politics; it captures structural causation that intentionalist metaphysics misses. This forces revision in Status-Function accounts.
      *   **Status:** Non-negotiable.

  **Flag 1: Most Exclusionary Requirement**
  Requirement 4 (Unintended Emergence) excludes the largest share of existing views. It knocks out strict Searle-style Status-Function accounts and strong Conceptualist views that tie kind-membership to collective intentionality or shared concepts, which dominate the literature but fail to capture structural or algorithmic kinds.

  **Flag 2: Joint Unsatisfiability**
  The pair **Ontological Neutrality** and **Revisionary So-What** is jointly unsatisfiable if "neutrality" implies deflation. If an account claims construction tells us nothing about the *reality* of the kind (neutrality), it struggles to generate a reason to change it (so-what). The fault line is not where you suspected; it is between *ontological deflation* (constructed = less real) and *normative inflation* (constructed = unjust/changeable). You cannot have both; the seminar must prioritize the normative force, even if it costs ontological agnosticism.

  **Scorecard**
  *   **Causal-Historical:** Fails Req 3 (collapses constructed/caused) and Req 4 (often lacks normative bite).
  *   **Constitutive/Ameliorative:** Passes Req 1 and 4, but risks failing Req 2 if it forces all kinds into a political mold.
  *   **Collectively-Acquired Status-Function:** Fails Req 1 (too conceptual) and Req 4 (requires intention/acceptance).
