prompt: |-
  hey — you're a decision theorist who also runs hands-on workshops on betting and risk, so please design this as someone who's actually stood in front of a room and watched a plan fall apart. Start by listing the specific failures you want the game to produce, then design backwards from those, and brainstorm two or three mechanics before you commit to one.

  I've got a 90-minute session, about 18 mixed maths/econ/philosophy undergrads. They've all seen expected value and expected utility in a lecture, but none of them has ever been ruined by maximising expected value. I want a game with real choices and real (small, fake-money) stakes that makes them feel in their gut why the thing to maximise when the same gamble gets repeated is the growth rate — geometric mean, log wealth — rather than the arithmetic expectation. Rules, materials, payoff scheme, a timeline, and a debrief that maps particular moments in the room onto particular bits of the maths. Nobody should hear the words Kelly or ergodicity until after the last round.

  Two twists I want built in, since these are the bits I think they'd otherwise walk past:

  1. A tournament round somewhere in the middle, where the prize goes to whoever finishes richest rather than to whoever grew fastest in expectation. I want them to run into the fact that the bet size that's right for compounding your own money over many rounds isn't the bet size that wins a short winner-takes-most contest against 17 other people, and to feel it as a genuine dilemma.
  2. A final block where the number of remaining rounds is unknown — I'll flip a coin after each round to decide whether we play another — so the indefinite-horizon assumption quietly breaks and they have to decide what to do about it.

  Then tell me what will predictably go wrong the first time I run this and how to handle it, and be honest about which part of the idea the game simply can't deliver and I'll have to say out loud myself. Please write it in British English, and keep the waffle down.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Role:** Decision theorist + hands-on workshop facilitator (experienced, seen plans fail).
      *   **Audience:** 18 mixed maths/econ/philosophy undergrads (know EV/EU theory, no practical ruin experience).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make them *feel* why maximizing geometric mean (log wealth) matters for repeated gambles vs. arithmetic expectation.
      *   **Constraints:** No "Kelly" or "ergodicity" until the debrief. Real choices, small fake-money stakes.
      *   **Required Twists:**
          1.  Tournament round (winner-takes-most vs. long-term growth).
          2.  Indefinite horizon (coin flip to continue).
      *   **Deliverables:** Specific failures to target, mechanics brainstorming, final design (rules, materials, payoffs, timeline, debrief), predicted failures/mitigations, limitations.
      *   **Tone:** British English, concise ("keep the waffle down"), pragmatic/experienced.

  2.  **Identify Specific Failures (The "Why"):**
      *   What do students usually get wrong?
      *   *Failure 1: The EV Trap.* They bet too much because $0.5 \times 2 + 0.5 \times 0.5 = 1.25 > 1$. They ignore ruin.
      *   *Failure 2: The Tournament Trap.* They play conservatively in a winner-takes-all scenario and lose to the lunatic who went all-in.
      *   *Failure 3: The Horizon Trap.* They treat the last round like the first, or panic when the end is uncertain.
      *   *Failure 4: The "It won't happen to me" bias.* They think they can recover from a 50% drawdown easily.

  3.  **Brainstorm Mechanics:**
      *   *Idea 1: Dice Rolling.* Simple, but feels too random. Hard to control probabilities precisely for the lesson.
      *   *Idea 2: Card Draw.* Good visual, but setup time is high for 18 people.
      *   *Idea 3: Coin Flip (Binary Gamble).* Classic Kelly setup. 50/50 win/loss. Win adds $X\%$, loss subtracts $Y\%$. Easy to calculate, easy to track.
      *   *Selection:* Coin Flip (or equivalent randomizer) is best for speed and clarity. Let's use a simple "Win 60%, Lose 40%" or "Win 50%, Lose 40%" structure. Actually, the classic Kelly example is often a biased coin. Let's stick to a simple multiplicative gamble: Win +50%, Lose -40%. EV is positive ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$), but Geometric Mean is $< 1$ if bet size is too high? No, wait.
      *   *Correction:* To teach Kelly, the gamble needs to have positive EV but negative Geometric Mean at high bet sizes.
      *   *Standard Setup:* 50% chance to win, 50% chance to lose.
      *   *Payoff:* Win: +60% of stake. Lose: -40% of stake.
      *   *EV:* $0.5(1.6) + 0.5(0.6) = 1.1$. Positive.
      *   *Geometric:* $\sqrt{1.6 \times 0.6} = \sqrt{0.96} < 1$. If you bet *everything*, you lose money over time.
      *   *Better Setup for "Growth":* Let's make it so full betting leads to ruin, but optimal betting leads to growth.
      *   *Revised Gamble:* 50/50 Coin. Win: Double your stake (100% gain). Lose: Lose your stake (100% loss). -> This is too harsh, one loss ruins you.
      *   *Revised Gamble 2:* 50/50 Coin. Win: +50% of *wealth*. Lose: -40% of *wealth*.
      *   *Wait, stakes need to be chosen by them.*
      *   *Mechanic:* You have £100. You choose how much to bet.
      *   *Outcome:* Coin flip. Heads: Win 60% of bet amount. Tails: Lose 40% of bet amount.
      *   *EV:* Positive.
      *   *Risk:* If you bet 100% of wealth, Heads = 1.6x, Tails = 0.6x. Geometric mean = $\sqrt{0.96} \approx 0.98$. You bleed out.
      *   *Optimal:* Kelly fraction is roughly $(p/a) - (q/b)$... actually simpler: $f^* = (bp - q)/b$. Here $b=0.6/0.4 = 1.5$. $p=0.5, q=0.5$. $f^* = (1.5 \times 0.5 - 0.5) / 1.5 = 0.25 / 1.5 = 1/6 \approx 16\%$.
      *   *Let's simplify for the room:* Win: +50% of bet. Lose: -50% of bet. (Even money odds).
      *   *EV:* $0.5(1.5) + 0.5(0.5) = 1.0$. Wait, that's zero EV.
      *   *Need Positive EV:* Win: +60% of bet. Lose: -40% of bet. (As above).
      *   *Let's go with:* **Win: +50% of bet. Lose: -40% of bet.** (Odds 5:4).
      *   *EV per unit bet:* $0.5(0.5) - 0.5(0.4) = 0.05$. Positive.
      *   *Full Wealth Bet:* $1.5 \times 0.6 = 0.9$. Decay.
      *   *Kelly Fraction:* $p/a - q/b$? No, standard formula $f = (p(b+1)-1)/b$ where $b$ is net odds. Net odds: Win 0.5, Lose 0.4. This is messy.
      *   *Simplest:* **Coin Flip. Heads: Wealth $\times 1.5$. Tails: Wealth $\times 0.6$.** (If betting all).
      *   *Allow partial betting:* They choose fraction $f$. Heads: $1 + 0.5f$. Tails: $1 - 0.4f$.
      *   *Kelly:* Maximize $0.5 \ln(1+0.5f) + 0.5 \ln(1-0.4f)$.
      *   *Okay, let's keep the mechanics simple for the prompt.*
      *   *Mechanic Choice:* **"The Multiplier Game".**
      *   *Round Structure:* 3 Blocks.
      *   *Block 1:* Fixed rounds (e.g., 10). Maximize own wealth.
      *   *Block 2:* Tournament. 5 Rounds. Top 3 get prizes.
      *   *Block 3:* Uncertain horizon. Coin flip to continue.

  4.  **Developing the Design (Iterative refinement):**
      *   *Materials:* Play money (or spreadsheet), coins, tracking sheets. Spreadsheets are faster for 18 people. Let's use Google Sheets or printed ledgers. Printed ledgers feel more "workshoppy".
      *   *Stakes:* Fake money, but converted to real small rewards at the end (e.g., chocolate, vouchers, or just bragging rights + a £20 prize for the winner). Let's say £50 prize pot for the winner to make it sting.
      *   *Timeline:* 90 mins.
          *   Intro: 10 mins.
          *   Block 1 (Growth): 20 mins (10 rounds).
          *   Debrief 1: 10 mins.
          *   Block 2 (Tournament): 20 mins (5 rounds).
          *   Debrief 2: 10 mins.
          *   Block 3 (Uncertain): 20 mins (Random rounds).
          *   Final Debrief: 20 mins.
      *   *Wait, 90 mins is tight.* Need to trim.
      *   *Revised Timeline:*
          *   Intro & Rules: 10 mins.
          *   Phase 1 (The Grind): 25 mins (15 rounds).
          *   Phase 2 (The Tournament): 25 mins (5 rounds).
          *   Phase 3 (The Fog): 20 mins (Coin flip continuation).
          *   Debrief: 10 mins. (This is too short for debrief).
          *   *Correction:* Debrief needs to be substantial. Cut Phase 1 rounds.
          *   *New Plan:*
              *   Intro: 10.
              *   Phase 1: 20 (10 rounds).
              *   Phase 2: 20 (5 rounds).
              *   Phase 3: 20 (Random).
              *   Debrief: 20.
              *   Total: 90.

  5.  **Addressing the Twists:**
      *   *Twist 1 (Tournament):* In Phase 2, only the top 3 get the prize. This encourages over-betting.
      *   *Twist 2 (Uncertain):* In Phase 3, after every round, flip a coin. Heads = another round. Tails = stop. This breaks finite horizon backward induction.

  6.  **Predicting Failures:**
      *   *Calculation Errors:* Students will mess up the compounding math manually. *Fix:* Provide calculators or a simple formula sheet.
      *   *Pacing:* 18 students flipping coins takes time. *Fix:* I (the facilitator) flip one coin for the whole room, or they flip in pairs. No, individual experience is better. They flip their own. I call "Flip!" to sync.
      *   *Boredom:* 10 rounds of writing numbers is dull. *Fix:* Keep it punchy.
      *   *The "I lost early" problem:* If someone goes bust in Phase 1, they disengage. *Fix:* Allow a "bailout" or just have them watch. Better: No bailout. Ruin is part of the lesson. But give them a small stipend for Phase 2 so they can re-enter.
      *   *The Limitation:* The game cannot truly simulate "infinite" time. 90 minutes is finite. I need to admit this.

  7.  **Drafting the Content (incorporating British English & Tone):**
      *   *Tone:* Direct, slightly cynical but educational. "Keep the waffle down."
      *   *Failures:* List them first as requested.
      *   *Mechanics:* Brainstorm 3, pick 1.
      *   *Design:* Detailed rules.
      *   *Debrief:* Map moments to maths.
      *   *Post-Mortem:* What goes wrong.

  8.  **Refining the Math for the Game:**
      *   To ensure the lesson lands, the parameters must be clear.
      *   *Gamble:* Bet a fraction $f$ of current wealth.
      *   *Outcome:* Heads: Wealth becomes $W \times (1 + 0.5f)$. Tails: $W \times (1 - 0.4f)$.
      *   *Why?* $1.5 \times 0.6 = 0.9$. Betting 100% ($f=1$) guarantees long-term decay.
      *   *EV:* $0.5(0.5f) - 0.5(0.4f) = 0.05f$. Positive EV for any $f > 0$.
      *   *Kelly:* Maximize $0.5 \ln(1+0.5f) + 0.5 \ln(1-0.4f)$. Derivative set to 0.
      *   $0.5(0.5)/(1+0.5f) - 0.5(0.4)/(1-0.4f) = 0$.
      *   $0.25(1-0.4f) = 0.2(1+0.5f)$.
      *   $0.25 - 0.1f = 0.2 + 0.1f$.
      *   $0.05 = 0.2f \rightarrow f = 0.25$.
      *   *Perfect.* Optimal bet is 25%. Full bet is ruinous. This is clean.

  9.  **Structuring the Response:**
      *   **Section 1: The Failures.** (What we are engineering).
      *   **Section 2: Mechanics Brainstorm.** (3 options, 1 selection).
      *   **Section 3: The Game Design.** (Rules, Materials, Timeline).
      *   **Section 4: The Debrief.** (Mapping experience to theory).
      *   **Section 5: Operational Risks & Limitations.** (What will break).

  10. **Review against Constraints:**
      *   British English? Yes.
      *   No "Kelly/Ergodicity" until debrief? Yes.
      *   90 mins? Yes.
      *   18 students? Yes.
      *   Twists included? Yes.
      *   Tone? Pragmatic facilitator.

  11. **Final Polish:** Check the math on the tournament twist. In a 5-round tournament, the optimal strategy shifts. With only 5 rounds, variance is king. Betting 100% gives a $1/32$ chance of $1.5^5 \approx 7.6x$. Betting 25% gives steady growth but low variance. In a "top 3 win" scenario, steady growth might not beat the lucky high-rollers. This creates the tension required.
      *   *Wait, check Phase 3:* Indefinite horizon. If they know it *might* end, they should treat it like an infinite game (Kelly). If they think it's the last round, they might bet big. The coin flip *after* the round means they never know if the *next* round exists. This forces them to optimize for the "next step" repeatedly, which converges to the infinite horizon strategy.

      *   *Self-Correction on Phase 3:* If I flip *after* the round, they know they survived to play *this* round. The uncertainty is about stopping. This effectively simulates a geometric stopping time, which preserves the stationary optimal strategy (Kelly). This is good.

      *   *Wait, one nuance:* If they know there are exactly 10 rounds (Phase 1), backward induction suggests betting more near the end if there's a target, but with log utility, it's myopic. With linear utility (tournament), it's not.
      *   *Okay, stick to the plan.*

      *   *Tone Check:* Ensure I sound like I've seen this go wrong. "You think they'll listen? They won't."

      *   *Formatting:* Use bolding, lists, clear headings.

      *(Self-Correction during drafting)*: Make sure the "fake money" has a conversion to *something* real, otherwise they won't care. A £50 Amazon voucher for the overall winner works. Or chocolate. Let's suggest a prize pot.

      *(Final check on British English)*: "Programme" vs "Program", "Maths" not "Math", "Centre", "Behaviour". Keep idioms British ("waffle", "ruin", "gut").

      *(Final check on "Keep the waffle down")*: Be concise. Don't over-explain the theory in the design section, save it for the debrief map.

