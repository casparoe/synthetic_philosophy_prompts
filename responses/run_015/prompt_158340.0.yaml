answer: |-
  ### The Failures We Are Engineering

  Before we touch a single rule, here are the specific cognitive failures this session must provoke. If they walk out without feeling these, the maths will slide off them like water off a duck.

  1.  **The EV Intoxication:** They will see a positive expected value (+5% per bet) and assume betting 100% of their bankroll is rational. They need to watch a 100% bettor turn £1,000 into £400 in six rounds and feel sick about it.
  2.  **The Tournament Paradox:** They will realise that the strategy which preserves wealth (growth optimal) is the strategy that loses a winner-takes-all contest. They must feel the moral hazard of being forced to gamble recklessly to beat a rival.
  3.  **The Horizon Panic:** When the end date is removed, the "safe" players will hesitate. They need to realise that uncertainty about the *end* requires the same discipline as an infinite horizon, whereas a known end-date invites end-game shenanigans.

  ### Mechanics Brainstorm

  **Option 1: The Dice Pool.**
  Players roll dice to determine outcomes.
  *   *Pros:* Tactile.
  *   *Cons:* Too much variance noise. Students blame the dice rather than the bet size. Calculation of wealth updates is slow.

  **Option 2: The Market Simulation.**
  Students trade assets with each other.
  *   *Pros:* Social dynamics.
  *   *Cons:* Too complex for 90 minutes. Liquidity issues. Becomes a game of bluffing, not risk management.

  **Option 3: The Coin Flip Ledger (Selected).**
  Simple binary outcome. Heads/Tails. Fixed percentages. Students record wealth on a ledger sheet.
  *   *Pros:* Mathematically clean. Easy to audit. Forces individual responsibility. The "ruin" is purely self-inflicted.
  *   *Cons:* Can feel repetitive.
  *   *Mitigation:* Keep the pace military-tight. I call the flips; they bet and record.

  ---

  ### The Game Design: "The Compounding Room"

  **Materials:**
  *   18 Printed Ledger Sheets (columns: Round, Bet Size, Outcome, New Wealth).
  *   18 Coins (or I flip one master coin projected on screen to save time—*recommendation: I flip one master coin to keep pace*).
  *   Play Money (optional, ledgers are faster).
  *   **Prize:** One £50 voucher (or cash) for the overall winner. Chocolate bars for the Tournament winners.

  **The Gamble Parameters:**
  *   **Start Wealth:** £1,000 (fictional).
  *   **The Bet:** You choose a fraction of your *current* wealth to risk each round.
  *   **The Odds:**
      *   **Heads:** You win **50%** of the amount bet. (Wealth $\times (1 + 0.5f)$)
      *   **Tails:** You lose **40%** of the amount bet. (Wealth $\times (1 - 0.4f)$)
  *   **Note:** $1.5 \times 0.6 = 0.9$. If you bet 100% ($f=1$), a Head-Tail sequence leaves you with 90% of your money. You bleed out.

  **Timeline (90 Minutes)**

  **00:00 – 00:10: Setup & Rules**
  *   Hand out ledgers.
  *   Explain the odds clearly. Write the formula on the board: $W_{new} = W_{old} \times (1 + 0.5f)$ or $(1 - 0.4f)$.
  *   **Crucial:** Do not mention Kelly, Log Utility, or Ergodicity. Tell them: "Maximise your final wealth."
  *   **Stakes:** The person with the highest wealth at the very end wins the £50.

  **00:10 – 00:30: Phase 1 — The Grind (10 Rounds)**
  *   **Goal:** Grow your wealth.
  *   **Process:** I flip the coin. Everyone records the outcome. They write their bet fraction for the *next* round before I flip again.
  *   **Pacing:** 2 minutes per round.
  *   **Expected Outcome:** The 100% bettors will be nearly bust. The 10% bettors will be bored but safe. The 25% bettors (Kelly) will be quietly ahead.

  **00:30 – 00:35: Debrief 1 (The Gut Check)**
  *   Ask the bust students: "What was the EV of your bet?" (Positive). "Why are you broke?"
  *   Ask the leaders: "What fraction did you bet?"
  *   *Do not explain the maths yet.* Just highlight the discrepancy between EV and Reality.

  **00:35 – 00:55: Phase 2 — The Tournament (5 Rounds)**
  *   **Reset:** Everyone starts back at £1,000.
  *   **Rule Change:** The £50 prize is cancelled. Instead, the **Top 3** wealthiest players after 5 rounds win £20 each.
  *   **The Twist:** This changes the utility function from logarithmic (growth) to linear/threshold (ranking).
  *   **Expected Outcome:** Students who played safely in Phase 1 will now feel forced to bet big. If you bet 25% while your rival bets 100%, and they get lucky, you lose the prize. You *must* increase variance to compete.

  **00:55 – 01:00: Debrief 2 (The Dilemma)**
  *   Ask: "Who increased their bet size? Why?"
  *   Highlight: "The rational bet size depends on whether you are playing against the market or against each other."

  **01:00 – 01:20: Phase 3 — The Fog (Indefinite Horizon)**
  *   **Reset:** Everyone starts at £1,000.
  *   **Rule Change:** We play rounds until I flip a **Stop Coin**.
  *   **Process:** Play a round. *Then* I flip the Stop Coin. Heads = Play another round. Tails = Game Over.
  *   **Probability:** 50% chance to continue after every round. Expected rounds = 2, but could be 10.
  *   **Goal:** Maximise final wealth (Top 1 wins £50 again).
  *   **Expected Outcome:** This breaks backward induction. You can't save your money for the "last round" because you don't know when it is. It forces a stationary strategy (Kelly).

  **01:20 – 01:30: Final Debrief (The Maths)**
  *   Now you unleash the theory.
  *   Map Phase 1 to **Geometric Mean vs. Arithmetic Mean**.
  *   Map Phase 2 to **Relative Utility / Tournament Theory**.
  *   Map Phase 3 to **Ergodicity & Stopping Times**.
  *   Reveal the "Kelly Criterion" name drop here.

  ---

  ### The Debrief Map (Cheat Sheet for You)

  When you stand at the whiteboard, link their pain points to these equations:

  1.  **Phase 1 Ruin:** Point to the student who bet 100% and lost.
      *   *Math:* Arithmetic Expectation $E = 0.5(1.5) + 0.5(0.6) = 1.05$. (Positive).
      *   *Reality:* Geometric Expectation $G = \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$. (Negative).
      *   *Lesson:* In repeated multiplicative games, the geometric mean dictates survival. The arithmetic mean is a lie for compounding.

  2.  **Phase 2 Panic:** Point to the safe player who lost the tournament.
      *   *Math:* Utility is no longer $\ln(Wealth)$. It is a step function (1 if Top 3, 0 if not).
      *   *Lesson:* Optimising for rank requires different risk than optimising for growth. This is why fund managers take insane risks when their bonus is binary.

  3.  **Phase 3 Fog:** Point to the hesitation.
      *   *Math:* Finite horizon allows "end-game" betting. Infinite (or geometrically distributed) horizon requires a stationary policy.
      *   *Lesson:* Ergodicity. The time average (your life) is not the ensemble average (the class average).

  ---

  ### What Will Go Wrong (And How to Fix It)

  **1. The Calculation Drag**
  *   *Failure:* 18 undergrads multiplying £1,243.50 by 1.5 on their phones will kill your timeline. You'll lose 15 minutes to arithmetic.
  *   *Fix:* Give them a "Wealth Lookup Table" or allow them to round to the nearest £10. Better: Tell them they can track "Units" where 1 Unit = £100. Or, provide a simple spreadsheet on a tablet if they have one. *Best:* Tell them: "Round to the nearest £10. Speed matters more than precision."

  **2. The Early Bust Disengagement**
  *   *Failure:* In Phase 1, three students bet 100%, hit Tails twice, and have £360 left. They zone out for the remaining 8 rounds.
  *   *Fix:* Implement a "Bankruptcy Loan". If they drop below £100, they get reset to £500 but are ineligible for the Phase 1 prize. They stay in the game for the learning, but lose the stakes.

  **3. The "Lucky Lunatic" Wins Everything**
  *   *Failure:* In Phase 2, someone bets 100%, gets 5 Heads in a row, and wins. The class concludes "Risk doesn't matter, luck does."
  *   *Fix:* You must address this in the debrief. "He won the battle, but if we played this 100 times, he would be bankrupt 99 times." Show the probability: $0.5^5 = 3\%$. He was the 1 in 33 outlier. Do not let the room validate luck as strategy.

  **4. The Coin Flip Logistics**
  *   *Failure:* Students flipping their own coins leads to cheating or desync.
  *   *Fix:* **You flip the coin.** Stand at the front. Use a large coin. Call "Heads" loudly. Make it a ritual. It keeps the room's heartbeat synchronized.

  ### The Honest Limitation

  Here is the bit the game cannot deliver, which you must say out loud in the final five minutes:

  **"This game is still finite."**
  Even with the coin flip stopping rule, you only have 20 minutes. A true ergodic breakdown requires time scales humans can't experience in a workshop. You are simulating the *feeling* of ruin, not the mathematical certainty of it.

  Tell them: *"In this room, the 100% bettor might get lucky and win the £50. In the real market, over 20 years, that bettor is mathematically guaranteed to hit zero. I can't give you 20 years today. I can only give you the intuition that the cliff is there, even if you didn't fall off it this time."*

  Keep the waffle down. Let the losses speak.
