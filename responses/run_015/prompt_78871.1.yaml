answer: |-
  **1. The Bent Stick**
  Let's start with the oldest trick in the book: a straight stick half-submerged in water looks bent. A critic would say your eyes are delivering a "bent stick" image to your brain, whether the stick is actually bent or not. You say no—when it's straight, you're seeing a straight stick, just under tricky conditions. But if the stick isn't bent, what exactly is your mind doing when it presents you with a bend?
  *Follow-up (If she says: "It's a real stick, just misperceived"):*
  If the bend isn't in the water and it isn't in the stick, it has to be in you. If there's a "bend" in your experience that doesn't match the world, haven't you just admitted there's a mental state—an appearance—that exists independently of the object? Why isn't that the common core you're trying to deny?

  **2. The Yellow Wall**
  Take a white wall under a yellow streetlight. It looks yellow. You'd say I'm still seeing the white wall, just in yellow light. But suppose I've never seen the wall in daylight; I only ever see it at night. To me, it *is* yellow. Does your view require me to know the lighting conditions to be having a "genuine" perception, or is the perception genuine even if I'm totally fooled about the color?
  *Follow-up (If she says: "The perception is genuine because the wall is there"):*
  But the specific quality I'm experiencing—the yellowness—isn't on the wall. If I can have an experience of "yellow" without there being any yellow property in the world, doesn't that prove my mind can generate sensory qualities on its own? And if it can do that here, why not in a hallucination?

  **3. The Coat in the Hallway**
  Here's the case that keeps me up: I'm in a dark hall, I see a figure, I get scared, then I turn on the light and it's a coat on a hook. Was that an illusion or a hallucination? If it's an illusion, there has to be a real object I'm perceiving. But for those ten seconds, I wasn't perceiving a coat; I was perceiving a person. Where exactly do you draw the line, and is it a real difference in my mind, or just a label you apply after you turn on the light?
  *Follow-up (If she says: "It's an illusion because the coat was causing the experience"):*
  But the coat doesn't cause "person-experiences." Coats cause coat-experiences. If my brain is constructing a person out of shadows and fabric, isn't the mental work being done *by me*, not the coat? If the mental work is the same as it would be if the hook were empty, why does the presence of the coat change the fundamental nature of my state?

  **4. The Arrowheads (Müller-Lyer)**
  You show someone two lines with arrowheads; one looks longer, but they're equal. Even if you measure them and prove they're equal, they *still* look unequal. If I'm genuinely seeing the lines, what is that persistent "unequal" look doing there? It's not in the paper, and I know it's not in the paper, yet it won't go away.
  *Follow-up (If she says: "You are seeing the lines, but the context distorts the look"):*
  So the "look" is distinct from the "seeing." If I can剥离 (strip away) the truth of the lines from the look of the lines, and the look stays the same, haven't we found that common inner core? It seems like you're saying the "seeing" is the real part and the "look" is just noise. But for the person experiencing it, the look *is* the experience.

  **5. The Rubber Hand**
  In the rubber hand experiment, you stroke a fake hand in front of me while stroking my real hand hidden from view. Soon, I feel like the rubber hand is mine. Are you willing to say I am perceiving a rubber hand as my own? If not, what has gone wrong? Because from the inside, it feels exactly like body ownership.
  *Follow-up (If she says: "You are perceiving your own body, but mislocating it"):*
  But I'm claiming ownership of an object that isn't my body. If my brain can be tricked into binding "self" to "rubber," doesn't that show perception is a construction process that can succeed or fail? If it's a construction process, isn't there a common mechanism running whether the hand is real or fake?

  **6. The Evil Demon**
  Let's talk about knowledge. You want to say that when I see a real tree, I know something a hallucinator doesn't. But imagine an Evil Demon who simulates the world perfectly. To me, the tree looks real, feels real, and acts real. Why am I rational for believing it's there, while the Demon's victim is not? If we can't tell the difference, doesn't the justification have to come from inside our heads, not the outside world?
  *Follow-up (If she says: "The Demon's victim lacks access to the fact"):*
  But they don't *know* they lack access. From their perspective, everything is identical. If you say they are less justified than me, you're saying rationality depends on luck—on whether the world happens to match my head. Are you really willing to tell me that if I'm brains-in-vats, I'm not being reasonable when I trust my eyes?

  **7. Circularity and Motivation**
  Critics say your view only works if you assume the conclusion: that veridical and non-veridical experiences are different. They say you're denying the "common factor" just to save the theory, not because the evidence forces you to. What independent reason do you have for the denial, other than it solves the philosophical problem?
  *Follow-up (If she says: "It preserves the directness of perception"):*
  That sounds like a benefit of the view, not evidence for it. If I offered you a theory that preserved directness but required believing in magic, you'd reject it. So there must be evidence weighing against the common factor. What is the empirical or phenomenological cost of *accepting* the common factor that makes your view worth the trouble?

  **8. Neuroscience**
  Suppose neuroscience finds a specific brain signature that lights up both when I see a blue dot and when I hallucinate a blue dot. A physicalist would say, "Same brain state, same mental state." Is that fatal to your view? If not, what would make you give it up?
  *Follow-up (If she says: "Brain states aren't mental states"):*
  But the brain is the machinery of the mind. If the machinery is running the exact same program in both cases, on what grounds do you say the output is fundamentally different? At what point does denying the common factor start to look like denying the connection between mind and brain?

  **9. Scope of the View**
  Are you a disjunctivist about anything other than perception? What about memory? I can remember a birthday party that happened, or I can vividly "remember" one that never did. From the inside, they can feel identical. Do those share a common core, or is perception the only special case where you draw this hard line?
  *Follow-up (If she says: "Perception is special because it connects us to the present world"):*
  But memory connects us to the past world. If I can't tell a true memory from a false one, and the brain treats them similarly, why does perception get a privileged status? Is it just that perception is easier to defend this way, or is there a structural difference you can point to?

  ***

  **Closing Question**
  When you step back from the arguments: Is your view a discovery about how the mind actually works, or is it a decision about how we should use the word "perception"? If we found out tomorrow that nature doesn't care about the distinction you're drawing, would you change your mind, or would you say we just need to understand nature better?
