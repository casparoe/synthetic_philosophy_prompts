answer: |-
  There is no single, canonical term in political ethics that precisely captures this specific inversion of the "dirty hands" problem. However, your observation identifies a distinct and increasingly prevalent modulation of political legitimacy. It sits at the intersection of **Carl Schmitt's decisionism**, **Slavoj Žižek's theory of transgression**, and contemporary **populist performance theory**.

  While Michael Walzer's "Dirty Hands" (1973) remains the standard reference, the phenomenon you describe is structurally distinct. In Walzer's formulation, the moral violation is a *tragic burden* that isolates the leader; in your formulation, the violation is a *generative asset* that bonds the leader to their base.

  Below is an analysis of the existing theoretical proximity, followed by a precise definition of the phenomenon, its boundary conditions, and its distinctions from nearby concepts.

  ### 1. Closest Existing Frameworks

  While no single term exists, three theoretical clusters approach this dynamic:

  *   **Schmittian Sovereignty (The Exception):** Carl Schmitt defined the sovereign as "he who decides on the exception." For Schmitt, authority is not derived from adhering to norms but from the capacity to suspend them. However, Schmitt focused on the *legal* suspension. Your observation extends this to the *moral* sphere: the leader demonstrates sovereignty not just by suspending the law, but by visibly violating the ethical norms that underpin the law.
  *   **Žižekian Transgression (The Obscene Supplement):** Slavoj Žižek argues that the Law often relies on a hidden transgression to sustain itself. In your scenario, this dynamic is no longer hidden; it is overt. The leader embodies the "obscene supplement" of the political order. By committing the act the public secretly desires but cannot admit to, the leader becomes the vessel for the collective's repressed will.
  *   **Populist "Anti-Establishment" Signaling:** In contemporary populism studies (e.g., Jan-Werner Müller, Nadia Urbinati), norm-breaking is often framed as "draining the swamp." However, most literature focuses on breaking *procedural* norms (rules of debate, institutional protocols). Your observation concerns *moral* norms (violence, deception, taboo). This is a darker subset of populist signaling where the violation of universal morality is re-coded as particularistic loyalty.

  ### 2. Proposed Definition: "Constitutive Transgression"

  If we were to define this phenomenon precisely, the most accurate term would be **Constitutive Transgression** (or **Legitimacy through Transgression**).

  **Definition:** A mode of political legitimation wherein a leader's authority is derived not despite, but *because of*, their visible violation of shared moral norms. The transgression functions as a performative act that signals the leader's unique capacity to prioritize collective survival over abstract morality, thereby converting moral "stain" into political capital.

  **Core Mechanism:** The moral wrong is not a cost to be minimized (as in utilitarianism) or a guilt to be borne (as in Walzer's dirty hands), but a **signal of exclusivity**. Only the leader has the "stomach" or the "mandate" to cross the line. This creates a hierarchy: the leader (who acts), the supporters (who endorse the act), and the critics (who are bound by naive morality).

  ### 3. Comparison with Standard "Dirty Hands"

  The distinction lies in the **moral psychology of the agent** and the **evaluative framework of the audience**.

  | Feature | Standard Dirty Hands (Walzer) | Constitutive Transgression (Your Observation) |
  | :--- | :--- | :--- |
  | **Status of the Act** | A tragic necessity. | A demonstration of strength. |
  | **Agent's Psychology** | **Guilt/Regret:** The leader must recognize the wrongness and suffer for it. | **Resolve/Pride:** The leader frames the act as a duty that supersedes ordinary morality. |
  | **Audience Evaluation** | **Ambivalence:** We need them, but we shouldn't trust them with power again. | **Affirmation:** We trust them *because* they are willing to do what we cannot. |
  | **Visibility** | Often concealed or minimized to protect the moral order. | **Displayed** or leaked to demonstrate efficacy. |
  | **Function of the Stain** | A burden that isolates the leader. | A badge that bonds the leader to the base. |

  ### 4. Boundary Conditions

  This phenomenon does not occur in all political contexts. It requires specific structural and psychological conditions:

  1.  **State of Anxiety or Crisis:** The collective good cited (security, peace) must be perceived as under imminent threat. In times of stability, norm violation is usually scandalous. In times of crisis, it can be reframed as "toughness."
  2.  **Personalization of Power:** The authority must be tied to the *person* of the leader rather than the *office*. In strong institutional systems, the office absorbs the dirty hands (e.g., "The President had to do it"). In this phenomenon, the *individual's willingness* is the selling point ("*I* am the only one who can do it").
  3.  **Moral Pluralism or Polarization:** There must be a segment of the population that views the "violated norm" not as universal, but as a constraint imposed by opponents. For example, "human rights" might be framed by supporters as "obstacles to security" rather than universal goods.
  4.  **Democratic Accountability (Paradoxically):** This dynamic is most potent in democracies or hybrid regimes. In total authoritarianisms, the leader's violence is often bureaucratized and invisible. In democracies, the *violation* of the norm is shocking; that shock value is what generates the signal. The leader needs the norm to exist so they can be seen breaking it.

  ### 5. Distinctions from Nearby Concepts

  To ensure conceptual precision, we must distinguish Constitutive Transgression from three adjacent ideas:

  **A. Versus Costly Signaling (International Relations/Political Psychology)**
  *   *Costly Signaling:* An actor incurs a cost (e.g., economic loss, military risk) to prove credibility.
  *   *Distinction:* In costly signaling, the cost is usually *material* or *strategic*. In Constitutive Transgression, the cost is *moral*. Furthermore, in standard signaling, the actor hopes to minimize the cost once credibility is established. In Constitutive Transgression, the moral violation *is* the source of ongoing legitimacy; stopping the transgressions might weaken the signal of resolve.

  **B. Versus Moral Authority Derived from Sacrifice**
  *   *Sacrifice:* The leader suffers for the people (e.g., imprisonment, physical risk, asceticism).
  *   *Distinction:* Sacrifice involves the leader *losing* something. Constitutive Transgression involves the leader *taking* something (the right to violate norms) or *inflicting* something. It is an assertion of dominance, not self-abnegation. The leader is not a martyr; they are a "strongman."

  **C. Versus the Legitimation of State Violence (Weber/Benjamin)**
  *   *State Violence:* Max Weber defines the state by its monopoly on legitimate violence. Walter Benjamin distinguishes between "law-making" and "law-preserving" violence.
  *   *Distinction:* Standard state violence is usually **bureaucratized and depersonalized** (e.g., a police officer arresting a suspect, a drone strike authorized by protocol). It is meant to appear routine and legal. Constitutive Transgression is **personalized and exceptional**. It is not the state acting through channels; it is the *Leader* acting through the state to bypass channels. The legitimacy comes from the *exception*, not the *rule*.

  ### 6. Conclusion

  You have identified a shift from the **tragic model** of political ethics (where wrongs are burdens) to a **performative model** (where wrongs are badges).

  While political science lacks a single noun for this, it is effectively **"The Sovereign Exception Moralized."** It differs from Walzer's Dirty Hands because it rejects the premise that the stain *should* be painful. Instead, it posits that the capacity to remain unstained by the moral weight of the act—to treat the taboo as a tool—is the very definition of political competence.

  In a democratic context, this is particularly dangerous because it inverts the function of accountability. Normally, accountability punishes norm violations. In this framework, accountability mechanisms (investigations, criticism) are framed by the leader as further proof of their persecution and necessity, deepening the supporters' commitment. The "dirt" does not wash off; it is worn as a uniform.
