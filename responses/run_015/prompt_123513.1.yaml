  # JOINT STATEMENT DRAFT: ON THE STATUS OF HCH
  **Prepared for the Deliberation Theory Reading Group**
  **Draft Version 0.9 | For Discussion Only**

  ## I. Agreed Claims

  The undersigned parties (the Amplificationist and the Decomposition Skeptic) affirm the following twelve claims as the load-bearing foundation of our current understanding. These claims are intended to rule out trivializations while acknowledging structural constraints.

  1.  **Definition Dependence:** An HCH instance is not defined solely by the base agent (the human or model at the node) but equally by the *decomposition policy* governing how questions are split. Changing the policy changes the function.
  2.  **Fixed-Point Existence vs. Uniqueness:** While the recursive definition implies a fixed-point condition (the output must be consistent with the output of the sub-queries), this condition does not mathematically guarantee a *unique* fixed point. Multiple stable answer-functions may satisfy the recursion.
  3.  **Inevitable Compression:** Every node in the tree must compress the output of its children into a message manageable for the parent. Information loss is structural and accumulates with depth.
  4.  **Root Competence Bound:** The root node retains final adjudication power over which decomposition to trust. Consequently, the global coherence of the output cannot exceed the root's capacity to verify consistency, regardless of total compute budget.
  5.  **Motivation Orthogonality:** The HCH structure addresses epistemic scaling (knowing what is true) but does not automatically solve motivational alignment (wanting what is good). A misaligned base agent yields a misaligned HCH tree.
  6.  **Institutional Approximation:** Real-world epistemic institutions (courts, labs) approximate HCH but introduce friction (communication costs, incentive mismatches) that the idealization abstracts away. They are evidence of feasibility, not proof of convergence.
  7.  **Training Target Specificity:** To train a model via amplification, one must specify not just "imitate HCH" but "imitate HCH under decomposition policy P." The policy is part of the loss function.
  8.  **Logical Limits:** HCH does not bypass fundamental computational limits (e.g., undecidability). It cannot output truth values for propositions that are undecidable for the base agent given infinite time.
  9.  **Verification Asymmetry:** The cost of verifying a child's answer is generally lower than generating it, but not zero. If verification cost approaches generation cost, the tree collapses economically.
  10. **Self-Similarity Constraint:** The requirement that every node be the "same kind of thing" is a structural constraint on the mechanism, not a guarantee of output quality. A self-similar tree of confused agents yields consistent confusion.
  11. **Decomposition Quality:** The quality of the final answer is positively correlated with the semantic fidelity of the decomposition (i.e., whether the sub-questions genuinely sum to the parent question).
  12. **No Magic Oracle:** HCH is a mechanism for aggregating and refining judgment, not a source of exogenous truth. It cannot recover information that was never present in the base agents or their environment.

  ## II. Table of Residual Disagreements

  | Issue | Neutral Restatement | Amplificationist Formulation | Skeptic Formulation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Normative Status** | Does HCH define correctness? | HCH approximates the ideal limit of deliberation; convergence indicates truth. | HCH produces consistent outputs; consistency is not truth. | **Substantive** |
  | **Uniqueness** | Is the fixed point single? | Shared priors and verification constrain the solution space to one practical attractor. | The solution space is rugged; minor decomposition changes yield divergent stable states. | **Substantive** |
  | **Scaling Benefit** | Does more budget help? | Deep trees access reasoning trajectories impossible for a single timeline. | Deep trees amplify root bias; budget buys speed, not new cognitive ground. | **Substantive** |
  | **Decomposition** | How much does splitting matter? | Robust deliberation converges across reasonable decomposition schemes. | The decomposition scheme *is* the argument; results track the split, not the question. | **Verbal (in part)** |

  **Note on Verbal Disagreement (Decomposition):** The parties agree that decomposition matters. The dispute is over the term "reasonable." The Amplificationist uses "reasonable" to mean *any split that preserves semantic intent*; the Skeptic uses it to mean *any split humans actually propose*. If "reasonable" implies "convergence-inducing," the disagreement dissolves into empirical claims about human splitting habits.

  ## III. Cruxes and Adjudication Plan

  The following cruxes are ordered by foundational importance. A resolution higher on the list renders lower items less critical. Each includes a concrete test, predicted outcomes, and the Drafter's Assessment of substantive weight and confidence.

  ### 1. Idempotence and Uniqueness (The Fixed-Point Problem)
  *   **Question:** Does the self-similarity condition single out a unique function, or do many functions satisfy $f(x) = \text{Aggregate}(f(\text{subqueries}(x)))$?
  *   **Test:** Run HCH simulations with identical base models and budgets but varied random seeds in decomposition. Measure output variance.
  *   **Amplificationist Prediction:** Variance decreases as budget increases; outputs converge to a stable cluster.
  *   **Skeptic Prediction:** Variance remains high or clusters around multiple distinct modes depending on initial split.
  *   **Defeat Condition:**
      *   *Amp:* If variance does not shrink with increased depth/budget.
      *   *Skeptic:* If outputs converge to a single point across wildly different decomposition trees.
  *   **Drafter's Assessment:** **Substantive.** This is the primary theoretical bottleneck. If multiple fixed points exist, the normative claim collapses.
      *   *Confidence:* 60% Skeptic is right theoretically; 70% Amp is right practically (due to shared human priors).
      *   *Guess:* My judgment rests on the guess that human priors are tighter than the logical space allows.

  ### 2. Decomposition Invariance (The Path Dependence Problem)
  *   **Question:** Holding total budget fixed, does changing the tree shape (depth vs. breadth, parallel vs. serial) change the answer?
  *   **Test:** Compare answers from a "Deep Narrow" tree vs. a "Shallow Wide" tree on complex reasoning tasks (e.g., code security audit).
  *   **Amplificationist Prediction:** Answers are statistically indistinguishable given sufficient budget.
  *   **Skeptic Prediction:** Answers diverge systematically based on tree topology (e.g., deep trees hallucinate consistency; wide trees lose context).
  *   **Defeat Condition:**
      *   *Amp:* Systematic divergence correlated with topology.
      *   *Skeptic:* Topology independence demonstrated across domains.
  *   **Drafter's Assessment:** **Substantive.** If the answer tracks the tree shape, HCH is a mechanism, not a definition of deliberation.
      *   *Confidence:* 80% Substantive.
      *   *Guess:* Relies on empirical guess that context windows limit deep trees more than skeptics admit.

  ### 3. Bottleneck at the Root (The Scaling Problem)
  *   **Question:** Does output quality track the total budget or the competence of the root node?
  *   **Test:** Vary root competence (expert vs. novice) while holding total tree budget constant.
  *   **Amplificationist Prediction:** High budget compensates for low root competence via child verification.
  *   **Skeptic Prediction:** Output quality caps at root competence; children cannot convince a root that lacks concepts to understand them.
  *   **Defeat Condition:**
      *   *Amp:* Novice root + High budget outperforms Expert root + Low budget.
      *   *Skeptic:* Expert root always wins regardless of budget disparity.
  *   **Drafter's Assessment:** **Substantive.** Determines if HCH is a force multiplier or a mirror.
      *   *Confidence:* 70% Skeptic is right on *conceptual* tasks; 60% Amp is right on *search* tasks.
      *   *Guess:* Relies on guess about "conceptual upload" capability of children.

  ### 4. Normative Convergence (The Truth Problem) *[Drafter Addition]*
  *   **Question:** Does iterating HCH converge on *better* answers (truth/utility) or just *consistent* answers?
  *   **Test:** Run HCH on questions with known ground truth (e.g., math proofs, factual retrieval with obscured sources). Track accuracy vs. confidence.
  *   **Amplificationist Prediction:** Confidence correlates with accuracy; iteration improves both.
  *   **Skeptic Prediction:** Confidence saturates quickly; accuracy plateaus or drifts (consistent error).
  *   **Defeat Condition:**
      *   *Amp:* High confidence + Low accuracy persists at high budget.
      *   *Skeptic:* Accuracy continues to climb with budget beyond individual capability.
  *   **Drafter's Assessment:** **Substantive.** Distinguishes coherence from correspondence.
      *   *Confidence:* 90% Substantive.
      *   *Guess:* Relies on guess that shared priors are generally truth-tracking.

  ### 5. No-Cognitive-Gain (The Closure Problem)
  *   **Question:** Is HCH merely a speedup of a single thinker, or does it access new cognitive states?
  *   **Test:** Compare HCH output to a single agent given equivalent *serial* time (not wall-clock).
  *   **Amplificationist Prediction:** HCH outperforms due to parallel exploration of counterfactuals.
  *   **Skeptic Prediction:** Single agent matches HCH given equal serial compute; HCH is only a wall-clock speedup.
  *   **Defeat Condition:**
      *   *Amp:* Single agent matches HCH performance.
      *   *Skeptic:* HCH solves problems single agent cannot (e.g., holding too many variables in mind).
  *   **Drafter's Assessment:** **Verbal (in part).** Depends on definition of "cognitive state." If "state" includes distributed context, Amp wins by definition. If "state" means internal reasoning capacity, Skeptic likely wins.
      *   *Confidence:* 50/50 Verbal/Substantive.
      *   *Guess:* Relies on guess about working memory limits vs. externalized memory.

  ### 6. Adversarial Robustness (The Mechanism Problem) *[Drafter Addition]*
  *   **Question:** Does HCH require adversarial sub-nodes (debate) to function, or is cooperative decomposition sufficient?
  *   **Test:** Compare Cooperative HCH vs. Adversarial HCH (children try to refute each other) on deception tasks.
  *   **Amplificationist Prediction:** Cooperative HCH suffices if decomposition is fine-grained enough.
  *   **Skeptic Prediction:** Cooperative HCH collapses into collusion; adversarial pressure is required for truth.
  *   **Defeat Condition:**
      *   *Amp:* Cooperative tree detects deception as well as Adversarial.
      *   *Skeptic:* Cooperative tree fails to detect obvious deception accessible to children.
  *   **Drafter's Assessment:** **Substantive.** Determines implementation requirements.
      *   *Confidence:* 75% Substantive.
      *   *Guess:* Relies on guess about incentive alignment in simulated agents.

  ### 7. Information Conservation (The Depth Limit)
  *   **Question:** Is information destroyed faster than it is generated as depth increases?
  *   **Test:** Measure entropy of messages passed between levels vs. information retrieved from base data.
  *   **Amplificationist Prediction:** Compression algorithms (summaries) preserve sufficient signal for arbitrary depth.
  *   **Skeptic Prediction:** Signal-to-noise ratio decays exponentially; useful depth is bounded (e.g., <10 levels).
  *   **Defeat Condition:**
      *   *Amp:* Performance degrades linearly or plateaus with depth.
      *   *Skeptic:* Performance collapses exponentially after critical depth.
  *   **Drafter's Assessment:** **Substantive.** Sets hard limits on scaling.
      *   *Confidence:* 85% Substantive.
      *   *Guess:* Relies on guess about LLM summarization fidelity vs. human fatigue.

  ***

  **Drafter's Note on Ordering:** I have placed Uniqueness and Invariance first because if the fixed point is not unique or is path-dependent, the normative claim (Claim 1 in Part II) is false regardless of scaling benefits. The Bottleneck and Normative Convergence follow as they determine *utility* assuming the structure holds. The Cognitive Gain and Information Conservation are secondary; even if HCH is only a speedup with depth limits, it remains valuable, whereas non-uniqueness renders it normatively inert. My confidence intervals reflect a suspicion that human priors (empirical fact) are doing more work than the formalism (theoretical claim) allows the Amplificationist to admit.
