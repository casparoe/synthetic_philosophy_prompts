answer: |-
  # Is the Brain a Computer? A Decision Tree for Graduate Study

  **Instructions:** Start at **Q1**. Follow the path dictated by your answer to the concrete question. Do not worry about which doctrine you prefer; answer based on the physical or explanatory claim you find most plausible. Terms in *[italics]* indicate the logical distinction being tested.

  ### The Decision Tree

  **Q1. Specificity:** Does the claim "the brain computes" require that it performs a *specific* function (e.g., edge detection, memory retrieval) relevant to behavior, or does it apply to *any* physical state change (as in any rock or waterfall)?
  *   **Any Physical Change:** → **Leaf 1: Pancomputationalism**
  *   **Specific Function:** → Go to **Q2**

  **Q2. Realism:** Do computational terms (e.g., "register," "error signal") refer to *causal mechanisms* inside the brain, or are they merely *predictive tools* shorthand for neural laws?
  *   **Predictive Tools Only:** → Go to **Q3**
  *   **Causal Mechanisms:** → Go to **Q4**

  **Q3. Eliminability:** If computational terms are just tools, can they be fully *eliminated* in favor of laws stated directly over neural quantities (voltage, spikes), or are they indispensable for description?
  *   **Eliminable:** → **Leaf 2: Eliminative Materialism**
  *   **Indispensable:** → **Leaf 3: Instrumentalism**

  **Q4. Substrate:** If the computation is a real mechanism, could the *same* process run on silicon (or paper) without loss of explanatory power, or do the *biological/analogue* details constitute the process?
  *   **Silicon/Independent:** → Go to **Q5**
  *   **Biological/Dependent:** → Go to **Q6**

  **Q5. Structure:** Is the substrate-independent processing best described as *discrete symbolic manipulation* (serial, rule-based) or *distributed parallel adjustment* (weights, activation flows)?
  *   **Discrete/Symbolic:** → **Leaf 4: Classical Computationalism**
  *   **Distributed/Parallel:** → **Leaf 5: Connectionism**

  **Q6. Recovery:** For the biological computation, must the model's internal states be *recoverable by intervention* (disturbing the tissue matches the model), or is *input-output prediction* sufficient?
  *   **Intervention Required:** → Go to **Q7**
  *   **Prediction Sufficient:** → **Leaf 6: Dynamical Systems Theory**

  **Q7. Boundary:** Does the causally relevant mechanism stop at the *skull*, or does it essentially include *coupling with the body/environment*?
  *   **Stops at Skull:** → **Leaf 7: Mechanistic Neurocomputation**
  *   **Includes Environment:** → Go to **Q8**

  **Q8. Representation:** Does the extended system still rely on *internal representations* carried by the coupling, or is it *direct coupling* without representation?
  *   **Internal Representations:** → **Leaf 8: Embodied Cognition**
  *   **Direct Coupling:** → **Leaf 9: Enactivism**

  *(Note: To satisfy the logical space of the distinctions, three additional "Empty" leaves are generated by combinations rejected by the main flow but logically possible.)*

  *   **Leaf 10: [Empty] Abstract Interventionism:** (Substrate Independent + Intervention Required). *Unstable:* If the process is substrate-independent, specific neural intervention shouldn't be the verification standard.
  *   **Leaf 11: [Empty] Wetware Instrumentalism:** (Biological Dependent + Predictive Tool). *Unfashionable:* If wetware details matter, theorists usually demand causal realism, not just prediction.
  *   **Leaf 12: [Empty] Discrete Biology:** (Biological Dependent + Discrete/Symbolic). *Unexplored:* Biological tissue is analogue/continuous; positing discrete symbols dependent on wetware is physically unmotivated.

  ---

  ### Key to Doctrines (Leaves 1–9)

  1.  **Pancomputationalism:** Trivial view; everything computes, so the claim explains nothing specific.
  2.  **Eliminative Materialism:** Computation is a folk category; only neuroscience is real.
  3.  **Instrumentalism:** Computation is a useful *façon de parler*, not a natural kind.
  4.  **Classical Computationalism:** Mind is software; brain is hardware; syntax drives semantics (GOFAI).
  5.  **Connectionism:** Mind is parallel distributed processing; substrate independent but neurally inspired.
  6.  **Dynamical Systems Theory:** Behavior is continuous flow in state space; computation is a poor metaphor for dynamics.
  7.  **Mechanistic Neurocomputation:** Computation is real but implemented by specific biological mechanisms (e.g., dendritic spikes).
  8.  **Embodied Cognition:** Cognition extends into the body, but retains representational/computational structure.
  9.  **Enactivism:** Cognition is sense-making through structural coupling; no computation or representation required.

  ---

  ### Limitations of the Tree

  **Indistinguishable Leaves:** **Connectionism (Leaf 5)** and **Mechanistic Neurocomputation (Leaf 7)**.
  **Reason:** While the tree separates them by *Substrate Independence* (Q4), a "Biological Connectionist" who believes artificial nets model real brains *but* require biological parameters to function occupies the same logical space as a Mechanist. Both accept real computation, intervention, and intracranial focus. The tree forces a choice on substrate that some theorists blur.

  **Novel Test Case: The "Metabolic Memory" Scenario**
  *Case:* A learning task is performed where the retention of information depends on slow, non-spiking metabolic changes in glial cells that modulate neuronal thresholds over hours. The spiking patterns alone are insufficient to predict the learning curve without the metabolic data.
  *   **Connectionist Response:** If a standard Artificial Neural Net (without glia) can be trained to match the *input-output function* of the organism, the computation is captured. The biological medium is implementation detail.
  *   **Mechanist Response:** If the metabolic state is *causally necessary* for the specific mechanism of retention in the brain, the ANN is not the true computation. The "computation" includes the glial-neuronal interaction; simulating it on silicon without modeling the metabolism fails to explain the *brain's* computation.

  *This case pries them apart by testing whether "computation" tracks the **causal mechanism** (Mechanist) or the **abstract function** (Connectionist) when the biology is non-standard.*
