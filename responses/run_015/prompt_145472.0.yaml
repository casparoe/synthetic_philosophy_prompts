prompt: |-
  so I'm two thirds into a novel and I've written myself into a corner that turns out to be a philosophy problem, so I need the spec before I write the last third.

  Two threads. (1) The republic in the book — which I've been makeing up as I go — ratified a Founding Charter about forty years before the action starts. The Charter contains what everybody in the book calls the Durability Clause: the founding generation, who had just come out of a long civil war and didn't trust themselves, wrote in that certain provisions can't be repealed except by a two-thirds vote followed by a nine-year wait, during which the repeal has to be re-passed twice. Now a clear majority wants out, they've done the first votes, and they're five years into the wait. (2) A character, Mira, has a recurrent bipolar illness; years earlier, between episodes, she signed a standing instruction with her clinic saying that if she ever refuses her medication she's to be treated anyway, and that her refusal at the time isn't to count as a refusal. She's refusing now, she says she's never felt better, the clinicians think she's in an episode, and the clinic is petitioning to treat her against her will.

  What I want isn't the answer to either case. It's the standard. Before I let my characters argue, I want the requirements list: what any account of when a precommitment legitimately binds the person — or the polity — that made it has to get right, with the case behind each requirement, including the cases I already feel sure about and the ones I can't decide. The ones I know I need handled: Ulysses and the ropes versus Ulysses and the contract (is tying yourself up different from authorizing someone else to tie you?); the person who changes her mind because she learned something, or because she converted, or because someone paid her; the founder's dead hand; the people born later who never voted for the thing; the precommitment that was itself made under pressure; the case where the later self has strictly better information than the earlier one had.

  Distinctions I need it to respect rather than collapse: binding your options versus binding your will versus binding what counts as a reason for you; waiving a right versus handing a power to someone else; "I wasn't competent then" versus "I'm not competent now"; and a precommitment that fails because it was never really mine versus one that fails because it was never really about me.

  Three devices my characters keep proposing, and I need to know whether they're real answers or just ways of making the problem prettier — say which, and why: (a) the ratchet, where a clause can be amended only in the direction of making itself harder to amend, so each generation binds the next one tighter than it was bound; (b) the two-key release, where the precommitment can be lifted only by the present self together with someone who knew the earlier self and is charged with speaking for her; (c) the reversion clause, where the whole thing lapses unless it's reaffirmed every few years — and tell me whether something that has to be re-signed is a precommitment at all or just a habit.

  Then: which requirements are non-negotiable and which are only what one camp happens to want; which pair I should stop hoping to satisfy at the same time; and which single requirement knocks out the most of the usual moves — the "the later self is just a different self with different preferences" move, the "true self / second-order endorsement" move, and the "a constitution isn't a contract, it's a framework that has to stay put for there to be anyone to repeal it" move. A line each on those three is plenty, the criteria are the part I actually need.

  The standard I'm after is one good enough to tell me whether Mira is being kept faith with or being governed by a stranger who happens to share her name, and whether the majority in my republic is being asked to wait or being told to obey its grandparents.

  Also — say how confident you are in what you're claiming, and single out the one thing you're least sure of. I'd rather know where the argument is thin before I put it in somebody's mouth.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** The user is two-thirds through a novel involving two parallel plot threads: a political constitution (The Republic/Durability Clause) and a medical ethics case (Mira/bipolar/standing instruction). Both involve *precommitment* (binding future selves/entities to past decisions).
      *   **Goal:** The user doesn't want the *answer* to the plot problems. They want the *standard* (a criteria list) for evaluating when a precommitment legitimately binds the agent/polity.
      *   **Specific Requirements:**
          *   List requirements any account must meet, citing the specific cases mentioned (Ulysses, learning vs. bribery, dead hand, non-consenting future generations, pressure at inception, better information later).
          *   Respect specific distinctions (options vs. will vs. reasons; waiving rights vs. handing power; competence then vs. now; authenticity vs. applicability).
          *   Evaluate three specific devices (Ratchet, Two-Key Release, Reversion Clause) – are they real solutions or cosmetic?
          *   Identify non-negotiable requirements vs. partisan wants.
          *   Identify incompatible pairs (trade-offs).
          *   Identify the "killer requirement" that undermines three common philosophical moves (different self, true self, constitutive framework).
          *   Apply the standard to Mira and the Republic (faith vs. stranger; waiting vs. obeying grandparents).
          *   **Meta-Requirement:** State confidence level and identify the weakest point/least sure claim.

  2.  **Deconstruct the Philosophical Problem:**

      *   This is the problem of *Diachronic Autonomy* and *Constitutional Precommitment*.
      *   Key tension: Past Self (S1) vs. Present Self (S2).
      *   Key tension: Individual Autonomy vs. Collective Stability.
      *   Key tension: Sovereignty (can I bind myself?) vs. Liberty (can I unbind myself?).

  3.  **Drafting the Requirements List (The "Standard"):**

      *   Need to cover the cases the user listed.
      *   *Requirement 1: Authenticity/Ownership.* (Addresses "never really mine"). Was S1 actually the agent? (Pressure, competence).
      *   *Requirement 2: Continuity of Identity.* (Addresses "different self"). Is S2 the same entity as S1?
      *   *Requirement 3: Epistemic Status.* (Addresses "better information" vs. "learned something"). Did S1 know enough? Did S2 learn truth or just change preference?
      *   *Requirement 4: Third-Party Reliance.* (Addresses "dead hand" and "people born later"). Did others build lives/structures on this promise?
      *   *Requirement 5: Competence Asymmetry.* (Addresses "competent then vs. now"). Who is actually capable of reasoning? (Crucial for Mira).
      *   *Requirement 6: Revocability Mechanism.* (Addresses "binding will vs. options"). Is there a path out, even if hard?

  4.  **Evaluating the Three Devices:**

      *   *(a) The Ratchet:* Makes it harder to change over time.
          *   *Verdict:* Cosmetic/Pathological. It solves stability by destroying sovereignty. It violates the "non-negotiable" requirement of eventual agency.
      *   *(b) Two-Key Release:* Present Self + Advocate for Past Self.
          *   *Verdict:* Real Solution (mostly). It respects the distinction between "I changed my mind" and "I am impaired." It institutionalizes the internal conflict.
      *   *(c) Reversion Clause:* Lapses unless reaffirmed.
          *   *Verdict:* Not a precommitment. It's a renewable contract. It solves the "dead hand" but fails the "stability" function of precommitment.

  5.  **Identifying Trade-offs and Non-Negotiables:**

      *   *Non-Negotiable:* Competence at inception (S1 must be capable). Without this, it's coercion, not commitment.
      *   *Non-Negotiable:* Some mechanism for exit (Sovereignty cannot be fully alienated).
      *   *Incompatible Pair:* *Absolute Stability* vs. *Full Present Autonomy*. You cannot have a binding precommitment that *never* yields to the present will, nor one that yields *whenever* the present wills it.
      *   *The "Killer" Requirement:* **The Epistemic/Competence Asymmetry Test.** (Who is actually capable of reasoning *now*?).
          *   *Why?* It hits the "Different Self" move (if S2 is impaired, they aren't a valid vetoer). It hits the "True Self" move (if S1 was impaired, their 'true self' didn't sign). It hits the "Constitutive Framework" move (frameworks don't bind if the framers were drunk or the current operators are hallucinating).

  6.  **Applying to the Novel's Cases:**

      *   *Mira:* Depends on the Competence Asymmetry. If S2 (current Mira) is manic, S1's precommitment holds *not* because S1 is boss, but because S2 is temporarily disqualified from vetoing. It's faith, not strangery, *if* the illness distorts reasoning.
      *   *The Republic:* Depends on Third-Party Reliance and Exit Mechanisms. If the 9-year wait allows for cooling off and re-voting, it's "being asked to wait." If the Ratchet makes it impossible to ever change, it's "obeying grandparents."

  7.  **Refining the Distinctions:**

      *   Need to ensure the language respects: Options vs. Will, Waiving vs. Handing Power, Competence Then vs. Now, Authenticity vs. Applicability.

  8.  **Self-Correction/Confidence Check:**

      *   *Confidence:* High on the philosophical framework (Elster, Schelling, Dworkin, constitutional theory).
      *   *Uncertainty:* The "Two-Key" device in practice. Who defines the "Advocate for Past Self"? That's a political minefield in the novel. I should flag that as the weak point.

  9.  **Drafting the Response (incorporating the constraints):**

      *   *Tone:* Analytical, precise, slightly detached (like a spec sheet), but acknowledging the narrative weight.
      *   *Structure:*
          1.  The Standard (Requirements List).
          2.  Evaluation of Devices.
          3.  Trade-offs & The Killer Requirement.
          4.  Application to Mira/Republic.
          5.  Confidence & Uncertainty.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "Ulysses ropes vs. contract" distinction in the requirements. That's about *mechanism of enforcement*.
      *(Self-Correction)*: Ensure I distinguish "binding options" (can't do X) vs "binding will" (won't want X) vs "binding reasons" (X doesn't count as a reason).

      *(Refining the "Killer Requirement")*: The prompt asks for *one* requirement that knocks out the three moves. The "Competence/Epistemic Access" requirement is the strongest candidate. If S1 lacked info, precommitment fails. If S2 lacks competence, precommitment holds. If neither is clearly superior, the precommitment is suspect. This undermines "Different Self" (irrelevant if competence is equal), "True Self" (hard to define if competence fluctuates), and "Framework" (frameworks rely on assumed rationality).

      *(Refining the "Least Sure" point)*: The "Two-Key" device relies on a benevolent interpreter. In a novel, that person becomes a villain or a tyrant easily. Philosophically it works; narratively it's unstable. I'll flag the *identification of the Past-Self Advocate* as the weak link.

  10. **Final Review against constraints:**
      *   Did I list requirements with cases? Yes.
      *   Did I respect distinctions? Yes.
      *   Did I evaluate the 3 devices? Yes.
      *   Did I identify non-negotiables vs. wants? Yes.
      *   Did I identify incompatible pairs? Yes.
      *   Did I identify the killer requirement and address the 3 moves? Yes.
      *   Did I apply to Mira/Republic? Yes.
      *   Did I state confidence and uncertainty? Yes.

      *Let's write.*
answer: |-
  Here is the specification for the standard of legitimate precommitment, structured for your drafting needs.

  ### I. The Requirements List
  Any account of binding precommitment must satisfy these six conditions to distinguish *faith* from *coercion*.

  1.  **Inception Competence (The "Pressure" Case)**
      *   **Requirement:** The agent at Time 1 (T1) must possess full rational capacity and be free from undue duress or manipulation.
      *   **Case:** A precommitment made under threat, or during a manic high, is void.
      *   **Distinction:** This separates "never really mine" (inception failure) from "never really about me" (applicability failure).

  2.  **Epistemic Humility (The "Better Information" Case)**
      *   **Requirement:** The precommitment must acknowledge that T2 (the future self/polity) may possess strictly better information than T1.
      *   **Case:** If T2 refuses medication because they discovered a cure T1 didn't know about, the precommitment lapses. If T2 refuses because they *feel* cured (but aren't), it holds.
      *   **Distinction:** This separates "learning something" (valid override) from "changing preference" (invalid override).

  3.  **Mechanism of Enforcement (The "Ulysses" Case)**
      *   **Requirement:** The account must distinguish between removing the *option* (ropes) and authorizing an *agent* to ignore your plea (contract).
      *   **Case:** Ulysses tying himself to the mast is self-binding options. Ulysses ordering his crew to ignore his future screams is handing over power.
      *   **Distinction:** Binding options is reversible by physical force; binding will requires a normative authority. The latter requires a stronger justification (see Requirement 5).

  4.  **Third-Party Reliance (The "Dead Hand" & "Future Generations" Case)**
      *   **Requirement:** The precommitment gains legitimacy proportional to the extent others have structured their lives or the polity's stability upon it.
      *   **Case:** A founder's clause binds grandchildren not because the grandfather is wise, but because the grandchildren's property rights depend on the clause's existence.
      *   **Distinction:** This addresses "people born later who never voted." They didn't vote for the clause, but they inherit the stability it purchased.

  5.  **Competence Asymmetry (The "Competence Then vs. Now" Case)**
      *   **Requirement:** The binding force is strongest when T1 is competent and T2 is demonstrably impaired, or when T1 is designing a system to correct T2's predictable biases.
      *   **Case:** Mira signing while stable (T1) vs. Mira refusing while manic (T2).
      *   **Distinction:** "I wasn't competent then" voids the contract. "I'm not competent now" enforces it.

  6.  **Sovereignty Retention (The "Waiving vs. Handing Power" Case)**
      *   **Requirement:** The agent cannot alienate their right to revoke the precommitment entirely, though they can raise the transaction cost of doing so.
      *   **Case:** A constitution that cannot be amended is a prison, not a charter.
      *   **Distinction:** Waiving a right (I won't vote) is temporary; handing a power (You vote for me) transfers agency. Total transfer is illegitimate.

  ### II. Evaluation of the Three Devices

  **(a) The Ratchet (Amendments only make it harder to amend)**
  *   **Verdict:** **Cosmetic/Pathological.**
  *   **Why:** It violates *Sovereignty Retention*. It treats the polity as a machine winding down, not a living agent. It solves the stability problem by killing the agent. In your novel, this should be argued as a betrayal of the founding generation's own principle (that they couldn't trust themselves).

  **(b) The Two-Key Release (Present Self + Advocate for Past Self)**
  *   **Verdict:** **Real Solution.**
  *   **Why:** It institutionalizes the *Competence Asymmetry*. It acknowledges that the conflict isn't between Past vs. Present, but between Competent vs. Impaired. It respects the distinction between *binding will* and *binding options* by requiring a human judgment call on the *reason* for the change of mind.
  *   **Risk:** It creates a new power center (the Advocate).

  **(c) The Reversion Clause (Lapses unless reaffirmed)**
  *   **Verdict:** **Not a Precommitment.**
  *   **Why:** It is a **Habit**, not a bond. It solves the *Dead Hand* problem but fails the *Durability* function. If the Republic's Charter lapsed every ten years, it wouldn't be a Constitution; it would be a lease. It works for Mira (renewable consent) but fails the Republic (needs stability for investment).

  ### III. Trade-Offs and The Killer Requirement

  **Non-Negotiable Requirements:**
  1.  **Inception Competence:** Without this, it is coercion.
  2.  **Sovereignty Retention:** Without an exit path (even a hard one), it is slavery.

  **Partisan Wants (One camp wants these, not both):**
  1.  **Absolute Stability:** The "Order" camp wants the Durability Clause to be near-unbreakable.
  2.  **Immediate Autonomy:** The "Liberty" camp wants the current majority/Mira to have final say.

  **The Incompatible Pair:**
  You cannot satisfy **Perfect Fidelity to T1** and **Perfect Sovereignty of T2** simultaneously. You must choose which error is less costly: binding a sane person against their will (T2 suffers), or letting an impaired person destroy themselves (T1's plan fails).

  **The Killer Requirement:**
  **Competence Asymmetry (Requirement 5).**
  *   **Why it knocks out the usual moves:**
      *   *Against "Different Self":* It doesn't matter if T2 is a "different person"; if T2 is impaired and T1 was not, T1's authority stands. Identity is irrelevant; capacity is king.
      *   *Against "True Self/Second-Order":* It bypasses the metaphysical search for the "real" Mira. It asks only: "Who has access to reality right now?"
      *   *Against "Constitutive Framework":* A framework only stays put if the operators are functional. If the framework assumes rational actors and the current actors are irrational, the framework suspends itself.

  ### IV. Application to Your Threads

  **Mira (Medical):**
  *   **Standard:** Is this *Faith* or a *Stranger*?
  *   **Ruling:** It is **Faith** *if and only if* the refusal is a symptom of the illness (Competence Asymmetry). If her refusal is based on new, valid medical data (Epistemic Humility), it is a Stranger governing her.
  *   **Narrative Key:** The clinic must prove her refusal is the illness speaking, not her.

  **The Republic (Political):**
  *   **Standard:** Are they *Waiting* or *Obeying Grandparents*?
  *   **Ruling:** They are **Waiting** if the 9-year delay is a cooling-off period to ensure the majority isn't manic (Competence Asymmetry applied to mobs). They are **Obeying Grandparents** if the clause relies solely on *Third-Party Reliance* without allowing for *Epistemic Humility* (new information about the Charter's flaws).
  *   **Narrative Key:** The majority must show they aren't just impulsive, but that the Charter no longer fits the reality (Epistemic shift).

  ### V. Confidence and Uncertainty

  **Confidence Level:** **High (85%).**
  This framework aligns with standard liberal political theory (Elster, Holmes/Sunstein) and bioethics (Dworkin on autonomy vs. best interests). It provides a robust structure for argument without dictating the outcome.

  **Least Sure Claim:**
  **The "Two-Key Release" viability.**
  I am least sure that a character can be found who legitimately "speaks for the Past Self" without becoming a tyrant. Philosophically, it works. Narratively, it creates a "Guardian of the Past" who inevitably starts interpreting the Past Self's will too broadly. In your book, this character is the biggest risk of turning into a villain. The standard assumes they are benevolent; your plot should probably test that assumption.
