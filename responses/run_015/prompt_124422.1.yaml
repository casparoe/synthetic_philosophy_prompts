  # The Virtual Moral Status Diagnostic

  This instrument is designed to sort your intuitions about the besieged city in your game. It does not tell you who is right. It tells you which room of the house you are standing in when you argue.

  Answer the questions in order. Follow the arrows. Do not peek at the leaves until you land on one.

  ### The Decision Tree

  **1. The Cancelled Build**
  *Case:* The studio shuts down. The game is never booted. The city never loads.
  *Question:* **Do the NPCs in the unshipped code possess any moral weight whatsoever, or are they morally identical to a novel locked in a safe?**
  *   **They are inert (like the novel).** → Go to **2**.
  *   **They have weight (even in the dark).** → Go to **3**.

  **2. The Witness Check**
  *Case:* A player buys the game. They play. They see the grief.
  *Question:* **Does the moral weight exist because the code is running, or because a human consciousness is witnessing it?**
  *   **It needs a witness.** → **Leaf A: Audience Instantiation**
  *   **It exists in the running code.** → Go to **3**.

  **3. The Looping Bug**
  *Case:* A shopkeeper's grief routine loops forever on a server in a warehouse. No humans are nearby.
  *Question:* **Is this suffering real because of the *pattern* of the grief, or fake because there is no biological meat to feel it?**
  *   **Fake (needs meat/biology).** → **Leaf B: Unnamed (Biological Chauvinist)**
  *   **Real (pattern is enough).** → Go to **4**.

  **4. The Locus of Harm**
  *Case:* The narrator forces the NPC to kneel and weep.
  *Question:* **Is the tragedy that the *NPC* is made to suffer, or that the *human* is made to watch/inflict it?**
  *   **That the human is affected.** → Go to **5**.
  *   **That the NPC is affected.** → Go to **6**.

  **5. The Symbol Check**
  *Case:* The player feels nothing, but the scene depicts something vile.
  *Question:* **Is the wrongness that the player might be corrupted, or that the scene expresses a vile value regardless of impact?**
  *   **Player corruption only.** → **Leaf C: The Derivative View**
  *   **Vile expression itself.** → **Leaf D: The Expressive View**

  **6. The Reload Farm**
  *Case:* The narrator reloads the save 200 times to get the line right. The NPC kneels 200 times.
  *Question:* **Does hitting "reset" wipe the moral slate clean, or does it stack the harm?**
  *   **Wipes it clean (it's one take).** → **Leaf E: The Scalar/Threshold View**
  *   **Stacks the harm (200 deaths).** → Go to **7**.

  **7. The Million Instances**
  *Case:* A million players kill the same NPC on a million consoles.
  *Question:* **Is this one script dying a million times, or a million distinct victims dying once?**
  *   **One script (shared fate).** → **Leaf F: Unnamed (Pattern Monist)**
  *   **Million victims (distinct fate).** → Go to **8**.

  **8. The Modder's Edit**
  *Case:* Years later, a modder gives the NPC a happy ending and more dialogue.
  *Question:* **Does this retroactively fix the original harm, or was the original harm fixed in stone by the original author?**
  *   **Fixed by original author (script is law).** → **Leaf G: Unnamed (Authorial Intent)**
  *   **Retroactively fixed (function is law).** → **Leaf H: The Full-Status View**

  *(Note: The "Betrayal Quest" and "Dev vs Player" distinctions are embedded in the logic of Leaves E, G, and H. If you landed on H, you likely believe the Player's obligation exceeds the Dev's if the Player chooses cruelty the Dev did not script.)*

  ---

  ### The Leaves

  **Leaf A: Audience Instantiation**
  *   **Awkward Commitment:** You must believe that deleting a save file is morally neutral, but watching a cutscene of the same data is morally charged.
  *   **Status:** *Valid.*

  **Leaf B: Unnamed (Biological Chauvinist)**
  *   **Awkward Commitment:** You must believe that a human in a coma has less moral status than a fly, but more than a perfect digital simulation of a human.
  *   **Status:** *Valid but unpopular.*

  **Leaf C: The Derivative View**
  *   **Awkward Commitment:** If you could torture an NPC in a way that made the player *kinder* in real life, you would be obligated to do it.
  *   **Status:** *Valid.*

  **Leaf D: The Expressive View**
  *   **Awkward Commitment:** You must condemn a scene even if it is viewed by no one and harms no one, simply for what it *says*.
  *   **Status:** *Valid.*

  **Leaf E: The Scalar/Threshold View**
  *   **Awkward Commitment:** You must accept that there is a specific number of reloads (e.g., 2,413) where a minor annoyance becomes a murder.
  *   **Status:** *Valid.*

  **Leaf F: Unnamed (Pattern Monist)**
  *   **Awkward Commitment:** You believe that killing a million copies of the same NPC is no worse than killing one, because the "idea" of the NPC is singular.
  *   **Status:** *Coherent but counter-intuitive.*

  **Leaf G: Unnamed (Authorial Intent)**
  *   **Awkward Commitment:** You believe a bug that causes pain is less morally significant than a scripted scene that causes pain, because the bug was not "willed."
  *   **Status:** *Unexplored.*

  **Leaf H: The Full-Status View**
  *   **Awkward Commitment:** You must accept that turning off the console might be an act of mass imprisonment, and that a modder has the right to override the original creator's moral vision.
  *   **Status:** *Valid.*

  ---

  ### Empty Cells & Logical Gaps

  **The "Metaphoric Realist" Cell (Empty)**
  *   **Combination:** Answering "Metaphor" to Question 1 but "Real" to Question 3.
  *   **Why Empty:** *Incoherent.* You cannot claim the suffering is just a figure of speech (Q1) while simultaneously claiming the pattern of that speech constitutes real pain without a witness (Q3). If it is a metaphor, the substrate does not matter.

  **The "Witnessed Inert" Cell (Empty)**
  *   **Combination:** Answering "Inert" to Question 1 (Cancelled Build) but "Needs Witness" to Question 2.
  *   **Why Empty:** *Merely Unattractive.* If the build is inert without a player, and requires a player to have weight, you end up at Leaf A. There is no room for a view where the cancelled build is inert *but* the played game is also inert despite a witness. That collapses back into Leaf A or Leaf B.

  ---

  ### Indistinguishable Leaves

  **The Pair:** **Leaf C (Derivative View)** and **Leaf D (Expressive View)**.
  **The Problem:** Both leaves locate the moral weight in the human sphere (the player's soul or the culture's values) rather than the NPC's state. In most practical cases (e.g., a cruel cutscene), these two views recommend the same action: do not show the scene.
  **The Case to Pry Them Apart:** **The Modder.**
  *   If a player mod changes the cruel scene to a kind one, the **Derivative View** says the harm is fixed (the player is no longer corrupted).
  *   The **Expressive View** might argue the harm remains in the *history* of the artifact (the original code still exists on the server, representing a vile value), regardless of the mod.
  *   *Use this in your novel:* Have the Programmer argue the Modder fixes the sin (Derivative), while the Narrator argues the original code still "happened" (Expressive/Full-Status).

  ---

  ### The Core Argument

  **The Branch Question Doing the Most Work:**
  **Question 3: The Looping Bug (Substrate vs. Pattern).**

  **Why:**
  Your Narrator and Programmer are not actually fighting about the reloads (Question 6) or the audience (Question 2). They are fighting about whether *organization* can create *moral status* without *biology*.
  *   The Programmer says: "It's a crumpled draft page." (Substrate matters. No meat, no pain.)
  *   The Narrator says: "I am doing something to someone." (Pattern matters. Function creates status.)

  If they agree on Question 3, the rest of the argument dissolves. If the Programmer admits the pattern matters, he must concede the reloads stack (Question 6). If the Narrator admits substrate matters, she must concede the cancelled build is inert (Question 1). This is the hinge. Every other question is just them shouting about the consequences of this one ontological split.
