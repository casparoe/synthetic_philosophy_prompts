  # Seminar Handout: The Unity of Consciousness Decision Tree

  **Instructions:** Start at the **Root Case**. Answer **Yes** or **No** at each node to navigate to a leaf position. Do not worry about philosopher names yet; answer based on your intuition about the mechanics of the case.

  ### Root Case: The Split-Brain Conflict
  *Imagine a split-brain patient. The left hand grabs a cup; the right hand pushes it away. The subject later reports only one intentional action.*

  ---

  ### Node 1 (The Split-Brain Intuition)
  **In this specific case, are there genuinely two concurrent streams of consciousness at the exact time of the action?**
  *   **YES** → Go to **Node 3** (Conflict Resolution)
  *   **NO** → Go to **Node 2** (Bottleneck vs. Illusion)

  ---

  ### Node 2 (Bottleneck vs. Illusion)
  *(Reached if you answered NO to Node 1)*
  **Does unified experience require a single real-time functional bottleneck, or is unity an illusion generated after the fact?**
  *   **YES (Real Bottleneck)** → Go to **Node 2B** (Localization)
  *   **NO (Illusion/Constructed)** → Go to **Node 2C** (Severity of Illusion)

  #### Node 2B (Localization)
  **Is this bottleneck localized in a specific neural workspace (anatomical/functional center)?**
  *   **YES** → 🍂 **Leaf A: Lite Cartesian Theater**
  *   **NO** → 🍂 **Leaf B: Global Workspace**

  #### Node 2C (Severity of Illusion)
  **Is experiential unity entirely non-existent (eliminativism), or merely constructed in memory?**
  *   **YES (Non-existent)** → 🍂 **Leaf C: Eliminativism**
  *   **NO (Constructed)** → 🍂 **Leaf D: Multiple Drafts**

  ---

  ### Node 3 (Conflict Resolution)
  *(Reached if you answered YES to Node 1)*
  **When the two streams conflict, is the resolution achieved via real-time suppression (one stream blocks the other immediately)?**
  *   **YES** → 🍂 **Leaf E: Real-Time Suppression**
  *   **NO** → Go to **Node 3B** (Co-existence vs. Stitching)

  #### Node 3B (Co-existence vs. Stitching)
  **Do the streams co-exist with no winner at the time, or is the 'winner' chosen retrospectively?**
  *   **YES (Co-existence)** → 🍂 **Leaf F: Parallel Co-existence**
  *   **NO (Retrospective)** → 🍂 **Leaf G: Retro-active Stitching**

  ---

  ### Scoring Key & Position Map

  | Leaf | Position Name | Typical Proponents | Core Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Lite Cartesian Theater** | Searle, some Neurophenomenologists | Unity is real and centered, but no "little man" watches the screen. |
  | **B** | **Global Workspace** | Baars, Dehaene | Unity is a functional bottleneck, but distributed across networks. |
  | **C** | **Eliminativism** | Churchland (early), Frankish | "Unity" is a folk-psychological error; it does not exist. |
  | **D** | **Multiple Drafts** | Dennett | Unity is a narrative illusion; there is no final draft, only edits. |
  | **E** | **Real-Time Suppression** | Attention-based Selection Models | Two streams exist, but attention physically suppresses one instantly. |
  | **F** | **Parallel Co-existence** | Bundle Theorists, No-Self Views | Contradictory experiences co-occur; the "I" is a fiction. |
  | **G** | **Retro-active Stitching** | Memory-Constructionists | The conflict was real, but the *report* of unity is a memory error. |

  ---

  ### Diagnostic Notes & Logical Constraints

  **1. Hard-to-Separate Pairs**
  *   **Global Workspace (Leaf B) vs. Lite Cartesian (Leaf A):** These differ only on **Node 2B**. If "localized" is interpreted functionally rather than anatomically, these positions collapse into one another. Empirical data often underdetermines this distinction.
  *   **Multiple Drafts (Leaf D) vs. Retro-active Stitching (Leaf G):** These differ on **Node 1**. Leaf D denies two streams existed *at all*; Leaf G admits two streams existed but claims the *unity report* was stitched later. Phenomenologically, these are nearly indistinguishable from the first-person perspective.

  **2. Diagnosed Empty/Incoherent Combos**
  *   **Distributed Bottleneck + Real-Time Suppression:** *Diagnosis: Incoherent.* If you posit a bottleneck (Node 2 YES), you deny two concurrent streams (Node 1 NO), making "suppression of a second stream" a category error.
  *   **Localized Bottleneck + Parallel Co-existence:** *Diagnosis: Unattractive.* Positing a physical center for unity (Node 2B YES) while claiming streams co-exist without resolution (Node 3B YES) renders the "center" functionally inert.
  *   **Eliminativism + Retro-active Stitching:** *Diagnosis: Unexplored.* If unity is non-existent (Node 2C YES), there is nothing to "stitch." This combination usually collapses into pure Eliminativism.

  **3. Usage Note**
  *   If you find yourself answering **YES** to Node 1 but **NO** to Node 2 (if you were allowed to jump), you hold a contradictory view regarding the definition of "conscious stream." The tree forces consistency between the *existence* of streams and the *mechanism* of unity.
