  2. Tensions, ranked by severity
  First, (2), (7) and (8) form a contradictory triad. (2) defines badness as the felt authority of a command. (7) confirms that removing this authority removes the badness entirely. However, (8) insists adapted pain remains bad even when it 'no longer bothers'. If 'bother' tracks authority, (8) directly contradicts (2). To save (8), you must distinguish 'bother' from 'authority', claiming the command persists unheeded. This costs conceptual clarity and risks making 'authority' empirically idle. To save (2), you must admit adapted pain lacks intrinsic badness, costing the poignancy of chronic suffering. This forces you to redefine 'harm' in (8) as distinct from 'badness', which complicates your hurt/harm distinction in (3). You would have to concede that adaptation successfully mitigates the badness, even if the pathology persists.

  Second, (2) and (6) clash structurally. (2) requires pain to present a specific region of the body to be protected. (6) describes acryptalgia as having full affect but no localisable sensory content. If there is no location, there is no region to protect, violating the structural requirement of (2). Yet (6) asserts equal badness. This implies badness can exist without the specific imperative structure you propose. You must either deny acryptalgia is coherent or admit location is incidental to the command's authority. If you choose the latter, you weaken the specificity of the imperative view, making it closer to a general distress signal, which undermines the novelty of your structural claim in (2). If you deny acryptalgia, you limit the scope of your theory to localised pains only, reducing its explanatory power for widespread chronic conditions.

  Third, (3) and (4) create explanatory slack. (3) severs badness from actual damage. (4) retains damage as the representational content. While logically compatible via misrepresentation, it raises the question: why represent damage if badness is independent of it? It risks making the content incidental to the value, weakening the intentionalist claim that content matters. You need to clarify why the content is damage-specific if the badness is aimless. This tension is less severe but requires a distinction between 'representational accuracy' and 'motivational force' to ensure the content does not inadvertently drag the badness back towards tissue damage. Finally, (5) imposes an evidential burden that threatens (6). You demand behavioural convergence for asymbolia, yet acryptalgia is posited as merely coherent. If you require convergence for dissociation generally, you cannot assume acryptalgia exists without evidence, undermining the verdict in (6). This creates an asymmetry in your evidential standards that a hostile reader will exploit. You would need to lower the bar for (6) or raise it for (1), neither of which serves your argument well. This inconsistency weakens your empirical stance.

