  (1) and (5) are consistent. You value first-person report but demand convergence. Asymbolia patients report feeling pain but not minding. This is supported by behaviour (not withdrawing). This meets your evidential standard, so there is no tension between your epistemology and your acceptance of the dissociation. You can trust the report because the behaviour confirms it.

