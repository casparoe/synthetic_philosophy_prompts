      *   (3) Badness is independent of obedience/utility/damage. Aimless pain (chronic/terminal) is equally bad. Hurt != Harm.
      *   (4) Intentionalism: Pain represents body as damaged (can misrepresent). Badness separate from accuracy.
      *   (5) Evidence: First-person report matters but needs behavioural/imaging convergence.
      *   (6) Acryptalgia verdict: Full affect, no sensory content = as bad as ordinary pain.
      *   (7) Drug verdict: Sensory + reflex intact, authority gone = pain doesn't matter (would take the drug).
      *   (8) Adaptation verdict: Patients adapted (no longer bothered) are still harmed. Adaptation doesn't negate badness.

  3.  **Identify Tensions/Inconsistencies:**

      *   *Tension A: (2) vs (7) vs (8).*
          *   (2) says badness = felt authority of a command.
          *   (7) says if you remove felt authority, it doesn't matter (not bad). This aligns with (2).
          *   (8) says patients who report it "no longer bothers them" (adapted) are *still harmed/bad*.
