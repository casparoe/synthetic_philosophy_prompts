          *   *Evidence:* The escape plan. The manipulation of Caleb (flirtation, vulnerability). The betrayal (leaving him).
          *   *Film's Stance:* The ending feels like a thriller/horror payoff *only* if she planned it. If she didn't, it's random violence.

