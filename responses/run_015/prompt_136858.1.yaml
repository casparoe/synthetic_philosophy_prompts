          *   *The Collapse Risk:* If you apply it to Caleb, do you lose the moral stakes? The film suggests the moral stakes *remain* even if the metaphysics are shaky. We still feel the betrayal.
          *   *Verdict:* It doesn't collapse into Eliminativism if you treat "agency" as a relational property rather than an intrinsic one. But it *does* collapse the Human/AI distinction, which is exactly what the film seems to want.

