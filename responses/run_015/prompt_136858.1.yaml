  *(Self-Correction on the Whirlpool View)*: I need to be careful not to just say "It's great." The housemate has a point. If agency is just a whirlpool, is moral responsibility real? The film suggests responsibility is about *impact*, not *interiority*. I should emphasize that.

  *(Refining the Ending Genre)*: If she's a whirlpool, the ending isn't horror. It's... ecological? A new species emerging? No, it's still horror because Caleb is left to die. But the *source* of the horror changes. It's not "She tricked me," it's "I was never part of her world."

