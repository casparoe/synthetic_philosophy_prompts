          *   User (initially): Ava is a *Simulator* (context-dependent continuation, no core self, Kyoko comparison).
          *   User (actual belief): *Occasion/Whirlpool View* (Agency happens *in the scene*, no persistent center, like a whirlpool is real but isn't an object over and above the water).
          *   Housemate's Counter: The Whirlpool view is just eliminativism with better PR. If applied to Ava, it must apply to Caleb, collapsing the distinction.
      *   **The Task:** Read the film through this three-way disagreement. Identify specific scenes for students. Determine where the film takes a stand. Analyze the "arm-cutting" scene. Analyze the ending (Horror vs. Sad/Weird). Evaluate the "Whirlpool" view (does it collapse?).
