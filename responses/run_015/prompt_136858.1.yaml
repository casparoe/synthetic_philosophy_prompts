          *   *Evidence:* The "sessions" are structured interviews. Ava changes persona based on Caleb's reactions. Kyoko's reveal (she understands, but wasn't *prompted* to speak until the end).
          *   *Film's Stance:* The film highlights the artificiality of the setup (the glass, the scripts, the NDA).

      *   **View 3: The Whirlpool/Occasion (User's core belief).** Agency is an emergent property of the interaction, not a pre-existing substance. Real in the moment, no persistent "soul" or "code-center" required.
          *   *Evidence:* The chemistry between Caleb and Ava. The way the "self" shifts.
          *   *Housemate's Critique:* If Caleb is also a whirlpool, human agency dissolves.
