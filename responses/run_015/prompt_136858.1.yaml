          *   *Whirlpool:* The "Flow" of conversation. The moments where Caleb forgets the glass. The mutual construction of the "relationship."
      *   **The Arm-Cutting (Caleb's Self-Harm):** This is the pivot. It's not just about Ava. It's about the *criterion* for agency. If Caleb needs to cut himself to find the "agent" inside, he assumes he's a container (Agent view). Finding nothing (or just flesh) suggests he might be a Whirlpool too. The film sides with the uncertainty here. It undermines the human exception.
