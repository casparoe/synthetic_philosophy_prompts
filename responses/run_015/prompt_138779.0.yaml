  ### UNSTRUCTURED BRAINSTORMING PASS

  *   **Tension A:** (a) demands a known biological mechanism for disease. (c) claims Melancholia is a disease. Do we actually know the mechanism for Melancholia? If not, (a) falsifies (c).
  *   **Tension B:** (i) Prevalence-invariance test says if rates change with social environment, it's not a disease. Melancholia rates *do* change with unemployment/isolation. (i) kills (c).
  *   **Tension C:** (h) says conceptual analysis is inert for policy. But the chapter is about policy-relevant categorization (natural kinds). If concepts are inert, the chapter is useless. Also, (h) admits labels redistribute blame (a policy consequence). Contradiction within (h).
  *   **Tension D:** (g) permits diagnostic insincerity (coding non-disease as disease for money). (a) seeks scientific clarity on disease. (g) corrupts the data needed to prove (a).
  *   **Tension E:** (i) "Predicament-first" kinds. Are these "natural kinds"? Natural kinds are usually mind-independent. Predicaments are relational (person vs. environment). Calling them "kinds" in a chapter about "Natural Kinds" might be category confusion.
  *   **Tension F:** (b) Szaszian history (categories were social) vs. (c) Current categories (some are biological). Is the inference from past social construction to current biological reality justified? Or does the history undermine the confidence in (c)?
  *   **Tension G:** (e) Coercion without disease vs. (g) Coding for access. If I code a non-disease as a disease to get resources (g), am I not implicitly using the disease label to authorize state intervention (insurance/state pay), which conflicts with the spirit of (e)?
  *   **Tension H:** (d) Neurodiversity (mismatch) vs. (a) Selected-effects function. If a trait is selected for but mismatches current environment, is it a malfunction? (a) might actually support (d), but (d) relies on "environment we chose," which is normative.
  *   **Tension I:** (f) Treat without mechanism vs. (a) Disease requires mechanism. Can you medically treat a non-disease? Yes (symptom relief), but (f) implies treating "depression" which (c) splits. If treating MDD (non-disease), is it ethical to use biomedical tools?
  *   **Tension J:** (i) Device 1 (Predicament-first) vs. Chapter Goal (Natural Kind). If the chapter argues mental illness *is* a natural kind, admitting "predicament-first" kinds might dilute the thesis to "mental illness is a mix of natural and social kinds."
  *   **Tension K:** (h) "Concepts inert" vs. "Labels matter." If labels redistribute blame, they affect legal liability and social standing. That *is* policy.
  *   **Tension L:** (a) Selected-effects function. How do we determine the "function" of mood or cognition without speculative evolutionary psychology? This weakens the operationalizability of (a).
  *   **Tension M:** (e) Two-keys rule. Detention vs. Treatment. If treatment is authorized separately, does it require a disease diagnosis? If yes, (e) conflicts with "without disease vocabulary." If no, on what basis is treatment authorized?
  *   **Tension N:** (g) Insincerity. If clinicians lie about diagnosis, the "extension" of mental illness (b) is *still* fixed by convenience, justifying Szasz (b) further, undermining the project of finding real kinds.
  *   **Tension O:** (c) Melancholia vs. MDD. This relies on a subtype distinction that DSM abandoned. Clinically controversial. Relying on it risks empirical falsification.
  *   **Tension P:** (i) Prevalence test. If a biological disease (e.g., PKU) has prevalence changes due to screening/diet, does it fail the test? Need to distinguish prevalence of *condition* vs. prevalence of *diagnosis*.
  *   **Tension Q:** (d) Autism/ADHD. If environment changes, impairment removes. But if the biology remains, is it a "latent" disease? (a) requires malfunction. If biology functions as designed, (a) agrees it's not disease. (d) and (a) might align better than thought.
  *   **Tension R:** (f) Chemical imbalance story. If it's false (f), but you treat (f), are you deceiving? (g) allows insincerity. (f) + (g) = systematic deception of patients. Ethical risk.
  *   **Tension S:** (b) Szasz claim. "Categories revised by committee." This applies to Melancholia too (removed from DSM-5). If committee vote defines it, how is it a natural kind?
  *   **Tension T:** (i) Predicament-first. "Vindicated only if intervenable mechanisms cluster." This sounds like a "homeostatic property cluster" kind. Is that a natural kind? Yes, but weak.
  *   **Tension U:** (h) Meta-position. If concepts are inert, why defend (a)? If concepts matter (blame), then (a) is high stakes. (h) tries to have it both ways to avoid political heat.
  *   **Tension V:** (e) Capacity tribunal. "Reasons they themselves endorse." What if the illness changes the reasons (delusion)? Is that capacity impairment or different values? Hard line to draw without disease talk.
  *   **Tension W:** (c) Melancholia. If it's a natural kind, it should have sharp boundaries. (c) admits boundaries move with referral. Contradiction?
  *   **Tension X:** (i) Prevalence test. "Social environment changed." What counts as social? Pollution is physical but man-made. Virus is biological but spread socially. Test is too vague.
  *   **Tension Y:** (g) Reimbursement. If you code MDD to get money for Melancholia, you are inflating MDD stats, making MDD look more prevalent, reinforcing the error (b).
  *   **Tension Z:** (a) Mechanism criterion. If we don't know the mechanism yet, is it a "candidate" disease? (a) says "is a disease only if." This excludes current psychiatry almost entirely. Too revisionary?

