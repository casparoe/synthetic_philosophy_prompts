  # PHILOSOPHICAL AUDIT: DISSERTATION POSITION STATEMENT

  **Subject:** Coherence and Tenability of Commitments (a)–(i) + Devices (i)
  **Topic:** Mental Illness as a Natural Kind
  **Auditor:** Philosophy of Medicine/Psychiatry Specialist

  ## 1. STEELMANNED COMMITMENTS

  *   **(a) Mechanism Criterion:** Disease is strictly a biological malfunction of an etiological function; statistical deviation is insufficient. This secures objectivity against social constructivism.
  *   **(b) Szaszian History:** Historical psychiatric categories were tools of social control, not medical discovery; current diagnostic manuals retain this procedural DNA (voting vs. finding).
  *   **(c) Melancholia Exception:** Severe melancholia possesses the biological malfunction required by (a), whereas broad MDD is a heterogeneous social construct; we must carve nature at its joints.
  *   **(d) Neurodiversity Mismatch:** Autism/ADHD are biological variations that become impairments only via environmental friction; removing the friction removes the "illness," so they are not intrinsic diseases.
  *   **(e) Coercion Decoupling:** State coercion requires impaired agency (capacity), not medical status; treatment requires separate authorization; this protects liberty while allowing care.
  *   **(f) Pragmatic Treatment:** Physicians should offer effective biomedical interventions even if the etiological narrative (e.g., chemical imbalance) is false, to prevent suffering.
  *   **(g) Bureaucratic Insincerity:** Clinicians may ethically code non-diseases as diseases to navigate insurance gates, treating the code as an administrative key rather than a truth claim.
  *   **(h) Meta-Position:** Conceptual definitions of disease do not dictate policy (consequentialism rules), yet the *label* "disease" carries heavy normative weight (blame/obligation) that affects lives.
  *   **(i) Devices:** Distinguish "mechanism-first" (biological) from "predicament-first" (situational) kinds; use prevalence-invariance to test if a kind is socially reactive or biologically fixed.

  ## 2. RANKED TENSIONS (SEVERITY: HIGH TO LOW)

  **1. The Meta-Contradiction (Commitment h)**
  *   **Tension:** You claim conceptual analysis is "inert for policy" while simultaneously admitting disease labels "redistribute blame, obligation and standing," which *are* policy outcomes.
  *   **Conflict:** (h) Part 1 vs. (h) Part 2.
  *   **Cheapest Revision:** Drop the claim that analysis is "inert." Replace with: "Conceptual analysis does not *automatically* dictate policy, but it constrains legitimate policy options."
  *   **Cost:** You lose the shield of "I'm just doing metaphysics, don't blame me for the consequences." You must own the political impact of your natural kind claim.

  **2. The Prevalence Test vs. The Melancholia Exception (Commitment i vs. c)**
  *   **Tension:** Your prevalence-invariance test states that if rates change with the social environment, it is a predicament, not a disease. Epidemiological data consistently shows severe depression rates fluctuate with unemployment, isolation, and economic stress.
  *   **Conflict:** (i) Prevalence-invariance test vs. (c) Melancholia is a disease.
  *   **Cheapest Revision:** Modify the test to "Substrate-Invariance." A condition is a disease if the *underlying mechanism* remains constant even if prevalence fluctuates. Social triggers can activate biological diseases (e.g., sunlight triggers lupus flares).
  *   **Cost:** You lose the clean simplicity of the prevalence test. You must now argue that the *mechanism* of melancholia is stable even if social factors trigger its onset, which is harder to prove empirically.

  **3. Diagnostic Insincerity vs. Scientific Realism (Commitment g vs. a)**
  *   **Tension:** You aim to establish mental illness as a natural kind (a) based on identifiable mechanisms. Systematically coding non-kinds as kinds for reimbursement (g) corrupts the medical record data required to identify those mechanisms.
  *   **Conflict:** (g) Permissible insincerity vs. (a) Mechanism criterion.
  *   **Cheapest Revision:** Restrict (g) to "Emergency Exception." Insincerity is only permissible when immediate harm outweighs long-term data corruption, not as a routine billing practice.
  *   **Cost:** You make life harder for clinicians (and yourself as a potential practitioner). You lose the "pragmatic alliance" with current clinical practice.

  **4. Predicament-First Kinds vs. Natural Kind Thesis (Commitment i vs. Chapter Goal)**
  *   **Tension:** Your chapter argues whether mental illness is a "natural kind." "Predicament-first" kinds are relational (person-in-environment), not mind-independent natural kinds. Including them dilutes the thesis.
  *   **Conflict:** (i) Device 1 vs. Dissertation Title/Goal.
  *   **Cheapest Revision:** Explicitly frame "Predicament-First" as "Clinical Kinds" distinct from "Ontological Natural Kinds." Argue that psychiatry needs both, but only the former are diseases.
  *   **Cost:** You complicate the chapter structure. You must defend a dual-ontology view rather than a unified theory.

  **5. Szaszian History vs. Current Realism (Commitment b vs. c)**
  *   **Tension:** If categories were historically fixed by deviance (b), what epistemic warrant do you have to claim Melancholia (c) is exempt from this history? Melancholia was also removed by committee (DSM-5).
  *   **Conflict:** (b) Historical claim vs. (c) Current exception.
  *   **Cheapest Revision:** Clarify that (b) is a defeasible presumption, not a universal law. The history warns us to be skeptical, but does not prove impossibility.
  *   **Cost:** You weaken the rhetorical force of the Szaszian appeal. You cannot use Szasz to clear the ground and then ignore his conclusion when it suits you without explanation.

  ## 3. DISSOLVED TENSIONS (APPARENT ONLY)

  **1. Coercion without Disease (e) vs. Diagnostic Insincerity (g)**
  *   **Why it dissolves:** These operate in different normative domains. (e) concerns *liberty* and state power (legal/ethical). (g) concerns *resource allocation* and bureaucracy (administrative). You can argue that the state cannot detain without capacity (e) while simultaneously arguing insurance requires a code for payment (g).
  *   **Distinction:** Liberty interests trump administrative convenience. The "disease" label in (g) is a billing token; the "capacity" finding in (e) is a legal threshold. They do not need to align.

  **2. Treatment without Mechanism (f) vs. Disease requires Mechanism (a)**
  *   **Why it dissolves:** (a) defines *what a disease is*. (f) defines *how to treat suffering*. One can treat a symptom cluster (predicament) with biomedical tools without asserting the cluster is a disease. Palliation does not require ontological commitment.
  *   **Distinction:** Ontology vs. Therapeutics. You can offer a pill for a "predicament" if it works, provided you do not lie to the patient that they have a "disease" (unless (g) applies).

  **3. Neurodiversity Mismatch (d) vs. Selected-Effects Function (a)**
  *   **Why it dissolves:** (a) defines malfunction as failure to perform selected effects. If an autistic trait performs its selected effect (e.g., pattern recognition) but fails in a specific social environment, (a) actually supports (d). It is not a biological malfunction, but a contextual mismatch.
  *   **Distinction:** Intrinsic Malfunction vs. Relational Impairment. Your selected-effects view is robust enough to accommodate the neurodiversity claim without contradiction.

  ## 4. SINGLE BEST REVISION

  **Recommendation:** Revise Commitment **(h)**.

  **Action:** Delete the claim that "conceptual analysis of disease is nearly inert for policy." Replace it with: "Conceptual analysis does not *settle* policy, but it *constrains* it. Specifically, if a condition is not a disease, policy cannot justify coercion on medical grounds, though it may on capacity grounds."

  **Reasoning:** This is the load-bearing wall of your dissertation. If conceptual analysis is inert, there is no point in arguing for (a) or (c). You are writing a philosophy dissertation to change how we think, which changes how we act. Acknowledging this makes you vulnerable to political critique, but it makes your project coherent.

  **Szaszian Friendship Check:** If you make this revision, is the package still friendly to a Szaszian?
  *   **Yes, but conditionally.** A Szaszian will applaud (e) (no coercion via disease) and (b) (historical skepticism). They will attack (c) (Melancholia is real). However, by tightening (a) and (h), you show you are holding the "disease" label to a standard high enough that most psychiatry fails it. A Szaszian might call you a "Realist about Melancholia, Anti-Realist about the rest," which is a defensible minority position, rather than a mainstream psychiatrist in disguise.

  ## 5. DEVICE TESTING (COMMITMENT i)

  **Device 1: Mechanism-First vs. Predicament-First**
  *   **Verdict:** **High Utility, High Risk.**
  *   **Analysis:** This distinction does real work. It allows you to save the phenomenon of clinical utility (we need to treat people in predicaments) without sacrificing ontological rigor (not all predicaments are diseases).
  *   **Risk:** It risks collapsing into your Mechanism Criterion (a). If a Predicament-First kind is only vindicated if "intervenable mechanisms cluster," isn't that just a weaker version of (a)?
  *   **Fix:** Clarify that "mechanisms cluster" for Predicaments refers to *causal pathways to relief* (e.g., sleep hygiene helps insomnia regardless of cause), whereas Mechanism-First requires *causal pathways to etiology* (e.g., specific neurotransmitter defect). This keeps them distinct.

  **Device 2: Prevalence-Invariance Test**
  *   **Verdict:** **Fatal Flaw regarding (c).**
  *   **Analysis:** As noted in Tension #2, this test threatens your favorite example. Severe depression (Melancholia) is biologically real *and* socially sensitive. If you hold the test strictly, you must classify Melancholia as a Predicament, contradicting (c).
  *   **Decision:** You must give up the **Prevalence-Invariance Test** in its current form.
  *   **Replacement:** Adopt a **"Trigger-Invariance Test."** A condition is a disease if the *internal pathological process* is invariant, even if the *triggers* are social. (e.g., Alcohol triggers gout, but gout is a disease. Unemployment triggers Melancholia, but Melancholia is a disease).
  *   **Loss:** You lose the easy empirical check. You can no longer point to prevalence charts to prove something is a social kind. You must argue about the internal biology, which is harder given your "no library/access" constraint and the current state of neuroscience. However, it saves your core example (c).

