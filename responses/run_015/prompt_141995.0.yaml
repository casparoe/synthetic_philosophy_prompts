answer: |-
  ### Opening Concessions (First 2 Minutes)

  Do not start by defending the thesis. Start by shrinking the target. If you claim too much, the anthropologists will spend 30 minutes giving you counter-examples.

  **Say this:**
  "Two quick caveats before we start. First, I am not arguing that *all* norms are coordination problems. I agree that many are cooperation problems requiring enforcement. My claim is only about a specific subclass—norms where the content is largely arbitrary but compliance is high. Second, I am not saying reasons are irrelevant. People *have* reasons, and those reasons matter for how they feel about the norm. My claim is narrower: reasons are often the *result* of the equilibrium, not the *cause* of its stability. I'm arguing that for this subclass, enforcement models overpredict fragility. If I can convince you of that limited claim, I'll be happy."

  **Why:** This disarms the anthropologists (who know punishment exists) and the economists (who know reasons affect utility). It frames you as refining a model, not overturning the field.

  ***

  ### The 8 Objections (Ordered by Damage)

  These are phrased in the voices of your audience. The replies are timed for ~2 minutes spoken.

  #### 1. The "Hidden Punishment" Objection (Evolutionary Anthropologist)
  **The Objection:** "I work with small-scale societies. Things look like coordination until someone violates them. Then the punishment is real and costly. You're calling it 'coordination' because you haven't seen the enforcement. If there's no punishment for defection, it's not a norm, it's just a habit. How do you distinguish a coordination norm from a cooperation norm where the punishment is just low-visibility?"

  **The Reply:** "That's the right empirical question. The distinction isn't the *presence* of punishment, but the *function* of punishment. In a cooperation problem (Prisoner's Dilemma), punishment restores the incentive structure so defection isn't profitable. In a coordination problem, punishment is often a signal to re-align expectations. My claim is that for this subclass, if you remove the punishment, the norm doesn't collapse into defection; it collapses into *confusion* or a different equilibrium. The test is: if a visible group defects together to a new equilibrium, does the punishment stop? If yes, it was coordination. If the punishment continues because the act is inherently 'wrong' regardless of others doing it, it's cooperation."

  **Soft Spot:** You likely don't have the ethnographic data to prove the "confusion vs. defection" distinction in every case. You're relying on a theoretical distinction that might be messy in the field.

  #### 2. The "Power and Authority" Objection (Political Theorist)
  **The Objection:** "You talk about focal points being selected by salience. But salience isn't natural. Who made that focal point salient? Usually, it's someone with power. By calling this 'coordination,' you're laundering power dynamics. It's not that 'we all prefer to conform,' it's that 'I prefer to conform because you have the authority to punish me.' Isn't 'focal-point laundering' just a fancy name for ideology?"

  **The Reply:** "I agree that power often *creates* the initial salience. A leader can point and say 'We drive on this side.' But my claim is about *maintenance*. Once the equilibrium is established, the leader can leave, and the norm persists without their authority. Ideology suggests false consciousness about interests. I'm suggesting something different: accurate cognition about coordination, but a false story about *why* this coordination point was chosen. The power sets the point; the coordination keeps it. Distinguishing them matters because challenging the power won't stop the driving norm, but challenging the focal point might."

  **Soft Spot:** It is very hard to disentangle "coordination for its own sake" from "coordination to avoid the powerful." You are assuming a clean separation that political theory argues is illusory.

  #### 3. The "Equilibrium Selection Mechanism" Objection (Behavioral Economist)
  **The Objection:** "Lewis gives us the statics, not the dynamics. You say we shift focal points to change norms. Okay, but what is the mechanism? Is it cheap talk? Is it a signal? If I'm running a public goods game, 'salience' isn't a variable I can manipulate. Unless you can tell me what changes the salience function, this is just a description, not a model."

  **The Reply:** "Fair. 'Salience' is a black box in Lewis, and I'm not closing it fully. But we can point to candidates: public visibility of a new precedent, or a coordinated 'shake-up' event. Think of it like a bank run in reverse. You need a public signal that others are moving. My contribution is 'laundering': the mechanism is blocked by the post-hoc reasons. To shift the equilibrium, you don't argue the reasons; you stage a visible, coordinated alternative. I'm not giving you a formula, but I'm telling you where to look for the lever: public precedent, not private utility."

  **Soft Spot:** You don't have a formal model. Economists hate "look for the lever" when they want a payoff matrix. You are admitting your theory is qualitative.

  #### 4. The "Functionalism" Objection (Evolutionary Anthropologist)
  **The Objection:** "If a norm survives, it usually does something. If it's truly arbitrary, why did this equilibrium win over the other one and persist for generations? Evolution tends to weed out arbitrary costs. Maybe the 'reasons' people give are wrong, but the *content* of the norm probably has a hidden adaptive function you're missing."

  **The Reply:** "I'm not denying function. But 'function' doesn't mean 'optimal.' Path dependence is real in cultural evolution. A norm can be sticky because it was the first one there, not because it's the best one. My claim is that the *persistence* is explained by coordination, not ongoing selection pressure. The 'reasons' people invent might sound functional ('it keeps us clean'), but they're post-hoc rationalizations for a historical accident that got locked in. We shouldn't assume every surviving norm is an adaptation."

  **Soft Spot:** It is empirically difficult to prove a norm is *not* adaptive. You are asking them to accept the possibility of maladaptive or neutral drift in norms, which strict adaptationists resist.

  #### 5. The "Internalization" Objection (Behavioral Economist/Psych)
  **The Objection:** "You say people conform because others conform. But in our lab games, people conform even when anonymous. They feel guilt. That's internalized enforcement, not coordination. If they felt no guilt, they'd defect when the monitor leaves. You're ignoring the psychological cost of violation."

  **The Reply:** "Internalization is real, but I'd argue it's downstream of coordination. We internalize the norms we grow up with because they are the equilibria we expect others to play. The guilt is a heuristic to prevent accidental defection from the group. But if the group shifts—say, a new generation adopts a new standard—the guilt shifts too. The internalization tracks the focal point. So the root is still the coordination expectation; the guilt is the psychological glue that makes the coordination robust."

  **Soft Spot:** You are making a causal claim about the development of conscience that you can't fully back up. It's a 'chicken and egg' problem you're solving by fiat.

  #### 6. The "Just Lewis?" Objection (Grad Students)
  **The Objection:** "Lewis already said norms are conventions sustained by expectations. You're adding 'laundering.' But isn't that just what ideology critique has always done? What's the actual philosophical addition here beyond renaming what we already know?"

  **The Reply:** "Lewis focused on how conventions *start*. I'm focusing on how they *hide*. Lewis assumes agents know it's arbitrary. My claim is that agents *forget* it's arbitrary. This changes the intervention. If it's just Lewisian convention, I can remind you it's arbitrary and we can switch. If laundering has happened, reminding you doesn't work because you genuinely believe the reasons. The addition is the prediction that rational argument will fail where salience shifts succeed."

  **Soft Spot:** You are relying on a psychological claim (forgetting arbitrariness) that might be hard to distinguish from simply valuing the tradition.

  #### 7. The "Normative Stakes" Objection (Political Theorist/Grad Student)
  **The Objection:** "If you tell us these norms are arbitrary, aren't you undermining them? If I tell my community 'this rule is just a focal point,' doesn't that destabilize cooperation? Is your goal to change norms or to preserve them?"

  **The Reply:** "My goal is accuracy, not preservation. But practically, understanding this prevents wasted effort. If you want to change a harmful norm (say, a restrictive dress code), arguing it's 'immodest' fails because that's the laundered reason. Showing a visible, respected group adopting a different standard works better. Conversely, if you want to preserve a good norm, don't just list reasons; protect the focal point. It's a tool for stability or change, depending on your ends."

  **Soft Spot:** You sound a bit manipulative here. Some in the room may value norms *because* of the reasons, not just the stability, and might resent the instrumentalization.

  #### 8. The "Measurement" Objection (Behavioral Economist)
  **The Objection:** "Okay, let's say I believe you. How do I code this? In my dataset, how do I distinguish a 'laundered coordination norm' from a 'moral norm'? If I can't operationalize it, I can't test it."

  **The Reply:** "Look for asymmetry in justification. Ask people *why* they follow the norm. Then ask them if they would follow it if no one else did. If they say 'no' to the second but have strong reasons for the first, that's laundering. Also, look for rapid shifts. Moral norms change slowly; coordination norms can flip quickly if the focal point moves. Use the speed of change and the dependency on others' behavior as your proxies."

  **Soft Spot:** Self-reporting is unreliable. People lie about why they do things. Your operationalization is noisy.

  ***

  ### The Single Reply That Has to Land

  **The Distinction:** You must land the distinction between **Maintenance** and **Origin**.

  If the audience conflates *why a norm exists now* with *why it started*, you lose.
  **The Line:** "I am not denying that reasons maintain compliance. I am denying that reasons explain the *selection* of the equilibrium. If you argue against the reasons, you are attacking the maintenance mechanism. If you shift the focal point, you are attacking the selection mechanism. For this subclass, the selection mechanism is the bottleneck."

  If they buy this, your chapter works. If they think reasons drive selection, you're just doing standard rational choice theory.

  ***

  ### One More Thing: The Unfalsifiability Objection

  You said you dread this: *"Focal-point laundering is unfalsifiable. If a norm shifts after argument, you'll say the argument was a salience shift. If it doesn't, you'll say the laundering was too strong."*

  **The Least Bad Response:**
  Do not try to prove it falsifiable in the Popperian sense. You will lose. Instead, pivot to **Intervention Utility**.

  **Say this:**
  "You're right that retrospectively, I can fit any outcome to the model. That's a risk. But the test isn't retrospective fitting; it's prospective prediction. The model makes a specific bet: interventions targeting *reasons* will have a lower success rate on this subclass of norms than interventions targeting *salience*. If I can show you cases where argument failed and visible precedent succeeded, the model has utility even if it's not a physical law. I'm offering a heuristic for intervention, not a law of motion. If the heuristic helps you predict which lever works, it's doing its job."

  **Why this works:** It moves the goalpost from "Is this metaphysically true?" (which you can't win) to "Is this useful for your experiments/fieldwork?" (which the economists and anthropologists care about). It admits the weakness (retrospective fitting) but offers value (prospective utility).

  **Strategic Note:** If they press harder, concede. "It is a risk. That's why I need empirical collaborators to help me tighten the conditions under which laundering is occurring. This chapter is the theoretical warrant for that empirical work." Turn the objection into a call for collaboration.
