      *Refining the "Relief" verdict:* This is the "privative" theory of pleasure. If an account requires a positive qualia, it fails relief. So the account must be neutral on positive/negative origin, focusing on the *attitude* toward the state.
      *Refining the "Absorption" verdict:* This attacks the "introspective" requirement. Pleasure can be non-conscious or pre-reflective.

      *Final Polish:* Ensure the distinction between "requirements on a definition of pleasure" and "requirements on a theory of welfare" is clear. The prompt asks about "what pleasures have in common," so it's primarily metaphysical/phenomenological, but with welfare implications.

