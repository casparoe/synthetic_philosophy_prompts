  2.  **Unstructured Brainstorming (Internal Monologue/Drafting):**
      *   Okay, the heterogeneity objection is classic. Sidgwick, Broad, Ryle. If pleasures are all different, what makes them *pleasures*?
      *   Candidate 1: A common sensation (Felt Quality). Problem: Introspection doesn't reveal a "pleasure sensation" alongside the water or the music. It feels like the water *is* refreshing, not that I have water-sensation + pleasure-sensation.
      *   Candidate 2: Pro-attitude (Desire-based). I want it to continue. Problem: Masochists enjoy pain (want it to continue in a way?), or boring duties we want to finish but don't enjoy. Also, the distinction between *liking* and *wanting* (Berridge).
      *   Candidate 3: Attitudinal Pleasure (Feldman). Taking pleasure *in* something. Problem: Does this capture the *feel*? Can you take pleasure in something without feeling good?
      *   Requirements needed: Must distinguish pleasure from desire. Must distinguish pleasure from judgment. Must account for intensity. Must account for the "goodness" link (if hedonism is true).
      *   The "Valence Blindness" case is crucial. If someone has the sensory stuff but no "oomph," is that pleasure? Intuitively no. So the account needs a phenomenological component or a motivational component.
      *   The "Relief" case challenges the "positive sensation" view. Relief feels like the absence of pain. Is that a positive quality?
      *   The "Absorption" case challenges the "conscious feeling" view. Flow states.
