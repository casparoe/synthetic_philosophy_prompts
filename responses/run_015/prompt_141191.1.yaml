      *   *Req 3: The Heterogeneity Constraint.* Must allow for diverse contents (itch vs. music).
      *   *Req 4: The Normative Constraint.* Must make sense of pleasure being *good* for the subject.
      *   *Req 5: The Distinction Constraint.* Must separate feeling pleasure from judging one is pleased.

      *Refining Req 1:* Is it strictly phenomenal? Attitudinal hedonists say no. But for the "common feel" question, we need to address the phenomenological intuition. Let's call it the "Phenomenal Resonance" requirement.
      *Refining Req 2:* The "Liking vs. Wanting" distinction is key. Berridge's work in neuroscience is relevant here.
      *Refining Req 4:* This is the hedonistic link. If pleasure isn't good, hedonism fails. But is this a requirement on the *nature* of pleasure or the *value* of pleasure? It's a requirement on the theory of welfare, but the definition of pleasure must support it.

  4.  **Addressing Specific Prompts:**

      *   **Tension:** Phenomenal Specificity vs. Explanatory Power. If the common feature is too thin (e.g., "positive valence"), it doesn't explain *why* we chase specific pleasures. If it's too thick (a specific sensation), it fails the heterogeneity test.
      *   **Cases:**
