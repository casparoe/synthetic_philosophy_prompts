          *   *Strain:* Case 3 (Estate Auction) transferred despite bill of sale/auction because of "gap in record."
      *   *Rule B: The "Structural Duress & Record Gap" Rule.* Focuses on Case 1 and 3. Context of colonial power dynamics (tax, threat of deposition) creates duress even if threat withdrawn shortly before. Gaps in provenance imply coercion.
          *   *Strain:* Case 5 (Living Maker) explicitly rejected inequality of bargaining power as duress.
      *   *Rule C: The "Risk & Capacity" Rule.* Focuses on Case 6 and 7. If transfer creates political conflict or physical risk, defer or share stewardship.
          *   *Strain:* Case 1 transferred despite likely political sensitivity (Benin); Case 3 transferred despite record gaps (risk of error).

  5.  **Apply Rules to New Item:**
      *   *Transfer?* Rule A says No. Rule B says Yes. Rule C says Maybe/Conditional.
