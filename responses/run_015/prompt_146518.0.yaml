  **OPTIONS PAPER: PROVENANCE AND RESTITUTION COMMITTEE**
  **Docket Item:** 1912 Regalia Group (34 Objects)
  **Date:** [Current Date]
  **Prepared by:** Graduate Member

  ### 1. Executive Summary
  This paper outlines the decision rules derivable from the Committee's seven existing precedents (Cases 1–7) and applies them to the 1912 Regalia Group. The item presents a conflict between the *Formal Legality* of the acquisition (bill of sale, market price) and the *Contextual Coercion* of the colonial environment (tax revolt, threat of deposition). Two claimants assert rights: the National Museum (State) and the Council of Title-Holders (Community). A secondary claim exists on one object (the crown). This paper identifies three operative rules, predicts Committee behaviour based on precedent consistency, and isolates the specific hinge upon which the decision turns.

  ### 2. Derivation of Decision Rules from Precedents
  Analysis of Cases 1–7 yields three competing decision rules. Each accommodates the majority of precedents but strains against at least one.

  **Rule A: Formal Legality and Market Stability**
  *   **Principle:** If a bill of sale exists and the price was within market range, acquisition is lawful. Inequality of bargaining power or structural colonial pressure does not constitute duress unless an immediate threat is documented at the moment of sale.
  *   **Support:** Case 2 (Lawful permit), Case 5 (Living maker, low price).
  *   **Strain:** Case 3 (Estate auction). In Case 3, transfer occurred despite a bill of sale/auction process because the *gap* in the record was deemed evidence of coercive circumstances. Rule A cannot easily explain why Case 3 transferred while Case 5 did not, absent the "record gap" distinction.

  **Rule B: Structural Duress and Record Burden**
  *   **Principle:** Acquisition during colonial administration is presumptively coercive if the seller was subject to colonial authority (tax, treaty, threat of deposition). Gaps in provenance or sales to meet colonial obligations (tax/arms) shift the burden of proof to the museum. If the museum cannot prove voluntary alienation, transfer is required.
  *   **Support:** Case 1 (Punitive expedition), Case 3 (Colonial officer estate).
  *   **Strain:** Case 5 (Living maker). The minutes explicitly state that "inequality of bargaining power is not duress." Rule B risks unwinding the market in colonial ethnographica, which Case 5 explicitly sought to avoid ("decide by catalogue rather than by case").

  **Rule C: Practical Feasibility and Risk Mitigation**
  *   **Principle:** Even if moral title suggests transfer, physical risk to the object or political instability regarding the claimant defers permanent transfer. Solutions must ensure conservation and political neutrality.
  *   **Support:** Case 6 (Divided territory), Case 7 (Coup/Storage).
  *   **Strain:** Case 1 (Benin). Transfer occurred despite significant political sensitivity. Rule C cannot explain why Case 1 proceeded unconditionally while Case 7 was deferred, other than by distinguishing "storage capacity" from "political will."

  ### 3. Application to the 1912 Regalia Group
  Applying these rules to the three substantive questions:

  | Question | Rule A (Formal Legality) | Rule B (Structural Duress) | Rule C (Feasibility) |
  | :--- | :--- | :--- | :--- |
  | **Transfer?** | **No.** Bill of sale exists; price fair; threat withdrawn 2 months prior sale. Analogous to Case 5. | **Yes.** Sale to meet tax/arms under threat of deposition constitutes duress. Analogous to Case 3. | **Conditional.** Transfer only if conservation and political claims are resolved. |
  | **Claimant?** | **National Museum.** Institutional capacity matches Case 2 and Case 7 logic. | **Council of Title-Holders.** Source community rights match Case 1 and Case 3 logic. | **National Museum.** Lower risk profile than shrine protocol (Case 7). |
  | **Conditions?** | **Loan/Replicas.** As per Case 5. | **Unconditional.** As per Case 1 and 3. | **Shared Stewardship.** Conservation grant + access restrictions (Case 7). |

  ### 4. Analogous Precedents
  *   **Closest Analog:** **Case 3 (1931 Estate Auction).** Like the new item, this involved objects from a colonial officer's effects with limited source documentation, sold in a market context. The Committee ruled that the "gap in the record is itself a product of the circumstances." Here, the "gap" is the trading company's source, and the circumstance is the tax revolt.
  *   **Counter-Analog:** **Case 5 (1924 Living Maker).** This is the strongest barrier to transfer. In Case 5, a sale by a maker under economic pressure was deemed lawful. In the new item, the title-holder sold to multiple buyers without recorded protest, and the specific threat of deposition was withdrawn prior to auction. If Case 5 holds, the new item cannot be deemed duress.

  ### 5. Prediction vs. Consistency
  *   **What the Committee Should Do (Consistency):** The Committee must choose between Case 3 and Case 5. If the "record gap" (trading company source) is prioritized, Rule B applies, and transfer to the Council is mandated. If the "bill of sale/withdrawn threat" is prioritized, Rule A applies, and only a loan to the National Museum is permitted. To be consistent, the Committee cannot do both.
  *   **What the Committee Will Likely Do:** The Committee will likely seek a **Case 7 Solution (Shared Stewardship)**. They will defer permanent transfer to the Council due to the conservation complications (1970s pins/consolidant) and the competing claim on the crown (Case 6 logic). They will likely offer a long-term loan or shared stewardship to the National Museum, with a side agreement allowing ritual access for the Council. This avoids setting a precedent on "structural duress" (Case 5 shield) while acknowledging the ethical weight of Case 3.

  ### 6. The Ancestral Remains Precedent (Case 4)
  **Assessment:** Case 4 should be treated as a **category error** in this docket.
  *   **Reasoning:** The Committee operated under a separate *Ancestral Remains Policy* which mandates transfer on request regardless of acquisition circumstances. This creates a distinct legal lane.
  *   **Risk:** Citing Case 4 to support transfer of *objects* undermines the Terms of Reference (force, fraud, duress). It invites the accusation that the Committee is applying policy selectively based on the "sacredness" of the item rather than the legality of the acquisition.
  *   **Recommendation:** Do not cite Case 4 as a precedent for object restitution. It is relevant only to the *nature* of the Council's claim (sacred insignia), not the *validity* of the transfer.

  ### 7. Analysis of Complications
  *   **Complication 1: Conservation (1970s treatment).**
      *   **Status:** **Substantive.**
      *   **Reasoning:** This triggers Rule C (Case 7). If the objects are "spoiled" by shrine protocol, permanent transfer to the Council renders them unusable for their intended purpose, potentially creating a new ethical harm. However, the Council's willingness to accept them "as is" mitigates this. This is a condition of transfer, not a bar.
  *   **Complication 2: Competing Claim on Crown (Neighbouring Polity).**
      *   **Status:** **Distraction (Procedural).**
      *   **Reasoning:** This applies to only one of thirty-four objects. Under Case 6 logic, this should not block the group. The crown can be severed from the docket (deferred/stored) while the remaining 33 proceed. Elevating this to block the whole group would be inconsistent with Case 1 (where Benin claims were prioritised over other potential interests).

  ### 8. The Hinge: Where Precedents Run Out
  The precedents genuinely run out on the definition of **Duress**.
  *   **The Exact Hinge:** Does "duress" require an *active, immediate threat* at the moment of sale (Case 1, Case 5), or does it encompass the *structural conditions* created by colonial administration (taxation, treaty obligations, threat of deposition even if paused)?
  *   **Current State:** Case 5 says structural inequality is not duress. Case 3 implies structural gaps are evidence of duress. The new item sits exactly between them: a structural pressure (tax/arms) with a formal sale and a paused threat. The Committee has no rule for "coercion by context" where a bill of sale exists.

  ### 9. Strongest Counter-Argument (Against Structural Duress)
  *For the record, the strongest argument against your structural reading is as follows:*

  "The Committee established in Case 5 that the colonial art market cannot be unwound by catalogue. To deem this acquisition duress is to assert that *any* sale by a colonial subject to a European buyer is voidable. The title-holder here had agency: he sold to multiple buyers, the price was fair, and the specific threat of deposition was withdrawn two months prior. He was not selling under the gun; he was selling in a market to raise capital for arms and tax. To rule otherwise is to infantilise the seller and ignore the minutes of Case 5 which explicitly protect the museum's teaching collection from 'inequality of bargaining power' claims. The bill of sale is the only objective evidence we have; the intelligence report is hearsay. We must follow Case 5."

  ### 10. Recommended Future Docket Item
  To separate Rule A (Formal Legality) from Rule B (Structural Duress), the Committee should consider:

  **Item:** A single object sold in 1920 by a signatory to a colonial treaty, accompanied by a **signed receipt acknowledging the sale was to meet a specific treaty-mandated tax**, with no threat of violence recorded.
  *   **Why:** This removes the "record gap" (Case 3) and the "active threat" (Case 1). It forces the Committee to decide if the *tax system itself* constitutes duress (Rule B) or if a signed receipt for a tax payment validates the sale (Rule A/Case 5). This isolates the "structural duress" hinge without the noise of looting or estate ambiguity.

  ### 11. Conclusion
  The Committee faces a choice between the market stability of Case 5 and the ethical burden of Case 3. The conservation issues allow for a deferral (Case 7), but do not solve the title question. The ancestral remains precedent should be excluded to maintain ToR integrity. The competing claim on the crown should be severed. The decision rests entirely on whether the Committee wishes to expand the definition of duress to include colonial taxation structures.
