  5.  **Addressing Specific Constraints:**
      *   *No Bibliography:* Check.
      *   *Treat PIs Seriously:* Ensure the section on funding risks is robust.
      *   *Contradictions:* Need a specific clause for what happens if a PI says "I can't sign this or I lose the grant."
      *   *Deadline:* Mention the Wednesday/Friday timeline in the header or intro.

  6.  **Self-Correction/Iterative Polish:**
