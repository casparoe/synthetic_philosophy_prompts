prompt: |-
  Hey — I need help designing a single class session, and I've been going in circles on it since Friday. I TA an upper-level undergrad seminar ("Choice, Welfare and Justice"; it's cross-listed, so about half of the 14 students are econ-ish and have genuinely seen expected utility theory, and the other half are philosophy majors who have never written down a utility function and get glassy-eyed at the sight of a summation sign). I have one 75-minute slot. The thing I want them to feel *in their gut* rather than be told: when you add up an enormous number of very tiny harms and announce that the pile is worse than one catastrophic harm, you have already made a measurement choice that nobody voted on. Specifically, you have quietly assigned each person a zero point and a unit, and if you assign them differently — each way looking perfectly natural on its own — the verdict flips.

  The argument I had with my friend Maya is what got me stuck. Her line was that this is a non-problem: everybody normalizes their own worst-to-best over "the outcomes at stake here" to 0 and 1, and then you just sum, and of course the dust specks win. I said that is exactly where the cheating happens, because "the outcomes at stake here" is ambiguous between "the two options on the table right now" and "the best and worst things a person like me could undergo across a life", and those two readings can disagree by many orders of magnitude about how many specks it takes. She said fine, then pick the local one, it's decision-theoretically the only one that's well defined. I said the local one makes the verdict a pure artifact of which alternatives somebody happened to put in front of you, so a bureaucrat who adds a third, even worse option to the menu can change the answer without changing anyone's experience. We went around on this for two hours and never landed it, and now I want to hand the fight to my students instead.

  So: design a runnable activity for them. Constraints that matter to me. (1) No lecture up front and no naming of the doctrine — I don't want anyone to hear a phrase like "interpersonal comparison" until the debrief. They should end up constructing the aggregation rule themselves and only discovering at the end what they've built. (2) It has to involve real choices with real (small) stakes, not just a handout with hypotheticals: I can get maybe $40 in coffee-shop vouchers and I'm happy to inflict genuinely trivial annoyances (holding a textbook at arm's length, a buzzer, a slightly sour sweet) but nothing that actually hurts and nothing that would get me in trouble with the department. (3) The rules or incentives need to be arranged so that the group actually runs into the flip — I'd love it if two halves of the room, using schemes that each feel obviously right, come to opposite verdicts, and have to argue about which one is "correct" without any available tie-breaker. (4) Then a debrief that maps moments in the activity onto the pieces: why the scales you can extract from a person's own choices are fixed only up to a positive linear rescaling, why that leaves the zero and the unit undetermined, why each of Maya's normalization conventions is defensible and what each one costs, and what kind of evidence (if any) could ever settle the choice between them. Also: tell me what will predictably go wrong the first time I run it — I can already hear the econ students saying "just use willingness to pay" or "just use money", someone will refuse to play, and at least one person will conclude that the whole lesson is just "you can't read other people's minds", which is not the point. And be honest about which feature of the problem the activity can't reproduce and I'll just have to say out loud myself.
reasoning: |-
  Here's a thinking process that leads to the suggested class session design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 75-minute seminar session for an upper-level undergrad class ("Choice, Welfare and Justice").
      *   **Audience:** 14 students (mix of Econ and Philosophy). Econ students know Expected Utility Theory (EUT); Philosophy students don't like math/summations.
      *   **Core Concept:** Interpersonal comparison of utility is arbitrary. Specifically, aggregating small harms vs. one large harm depends on how you normalize scales (zero point and unit). Changing the normalization flips the verdict.
      *   **Key Argument (TA vs. Maya):** Maya argues for local normalization (0-1 over available options). TA argues this makes the verdict dependent on the menu (bureaucrat problem) or scope of life.
      *   **Constraints:**
          1.  No lecture up front. No jargon (e.g., "interpersonal comparison") until debrief.
          2.  Real choices/stakes (max $40 vouchers, trivial annoyances). No actual pain/HR issues.
          3.  Must force a "flip" (two groups using "obviously right" rules get opposite verdicts).
          4.  Debrief must map activity to theory (affine transformations, zero/unit, normalization conventions).
          5.  Predict failure modes (Econ students suggesting WTP, refusals, skepticism about mind-reading).
          6.  Honesty about limitations (what the activity *can't* show).

  2.  **Deconstruct the Core Problem:**

      *   The "Torture vs. Dust Specks" problem (Parfit/Scanlon-esque, but framed via Harsanyi/Utilitarianism).
      *   To compare Person A's torture to Person B's dust specks, we need a common metric.
      *   If we use Von Neumann-Morgenstern (vNM) utilities, they are unique only up to positive affine transformation ($u' = au + b, a > 0$).
      *   Summing vNM utilities is meaningless unless we fix $a$ and $b$ for everyone.
      *   Maya's solution: Normalize min/max of *current options* to 0 and 1.
      *   TA's counter: This makes social welfare dependent on the *set of options* (menu dependence), not just the outcomes.
      *   *Activity Goal:* Make students feel the arbitrariness of the scaling without telling them it's arbitrary.

  3.  **Brainstorming the Activity:**

      *   *Idea 1: Voting on Annoyances.* Group A gets 100 buzzers. Group B gets 1 shock. Who suffers more?
          *   *Problem:* Hard to measure intensity objectively.
      *   *Idea 2: Lottery Elicitation.* Ask students to reveal preferences over lotteries to construct utility functions.
          *   *Problem:* Takes too long for 14 students in 75 mins. Too technical for philosophers.
      *   *Idea 3: The "Budget" Game.* Give them points to allocate to prevent harms.
          *   *Problem:* Just measures willingness to pay (WTP), which Econ students will jump to. Need to avoid money as the metric.
      *   *Idea 4: Two-Stage Aggregation.* Split the class. Give Group 1 Rule A. Give Group 2 Rule B. Ask them to solve the same problem.
          *   *Refinement:* This fits Constraint 3 (opposite verdicts).
          *   *The Problem:* They need to generate the "utilities" first.
      *   *Idea 5: The "Calibration" Task.* Students must agree on a scale to compare two different types of discomfort.
          *   *Scenario:* Option X: One person holds a heavy book for 10 mins. Option Y: Everyone else gets a loud noise for 10 seconds.
          *   *Mechanism:* They need to decide if Y * 14 > X. To do that, they need to equate "10 sec noise" to "book holding".

      *   *Selected Approach:* **"The Social Planner's Budget."**
          *   Divide class into two committees (Red and Blue).
          *   Task: Decide which of two social states is "better" for the group.
          *   State A: One person (Volunteer) suffers a "Large Harm" (e.g., holding heavy book + buzzer for 10 mins).
          *   State B: Everyone else (13 people) suffers a "Small Harm" (e.g., sour candy + quiet hum for 2 mins).
          *   *The Twist:* They aren't just voting. They have to *justify* using a specific calculation method provided in sealed envelopes (The "Rules").
          *   *Rule Set 1 (Maya's Local Norm):* Scale harms relative to the *worst thing happening in this specific choice*.
          *   *Rule Set 2 (TA's Global/Life Norm):* Scale harms relative to a *baseline anchor* provided externally (e.g., "Failing this class" or "Spilling coffee").
          *   *Wait, better twist:* Don't give them the rules. Make them *derive* the scale.
          *   *Actually, to ensure the flip:* I need to control the scaling.
          *   *Revised Plan:* The class acts as a "Welfare Board." They must quantify the harms to make a decision. I will subtly guide half the room to anchor differently than the other half.

      *   *Wait, Constraint 1 says:* "They should end up constructing the aggregation rule themselves."
      *   *Constraint 3 says:* "Two halves of the room... come to opposite verdicts."
      *   *Synthesis:* Split the room. Give them the *same* data (preferences), but ask them to solve the aggregation problem using "The Most Natural Method."
      *   *How to ensure different methods?* I need to frame the elicitation differently for the two groups.
      *   *Group 1 (Local):* Ask them to rate the options *relative to each other*. "On a scale of 0 to 10, where 0 is the best option here and 10 is the worst option here..."
      *   *Group 2 (Global/Anchor):* Ask them to rate the options *relative to a fixed external anchor*. "On a scale of 0 to 10, where 0 is 'perfect day' and 10 is 'worst thing imaginable'..."
      *   *The Math:* If Group 1 compresses the range (Small Harm = 1, Large Harm = 10), Sum(Small) might < Large. If Group 2 expands the range (Small Harm = 0.1, Large Harm = 10), Sum(Small) might > Large.
      *   *Wait, vNM utilities require lotteries.* To stay true to the Econ/Phil divide, I should use a lottery method but simplify it.
      *   *Simpler:* Use a "Compensation" method. How many small harms equal one large harm?
      *   *Let's go with the "Menu Dependence" trap.*
      *   *Scenario:* We are choosing between Policy X and Policy Y.
      *   *Policy X: Person 1 gets Heavy Burden. Others get nothing.
      *   *Policy Y: Everyone gets Light Burden.
      *   *Task:* Determine which is worse.
      *   *Group 1:* Given a "Decoy" option Z (Everyone gets Heavy Burden). This makes Y look "good" (0 to 1 scale between Y and Z).
      *   *Group 2:* Given a "Decoy" option W (Nobody gets anything). This makes Y look "bad" (0 to 1 scale between W and X).
      *   *This is too subtle.*

      *   *Let's try the "Unit Definition" approach.*
      *   We need to measure "Disutility."
      *   Step 1: Elicit individual preferences over the specific harms using a standard gamble (lottery) to get vNM utilities. (Keep it simple: "Would you prefer Certainty A or 50/50 B/C?").
      *   Step 2: Aggregate.
      *   *The Trap:* To aggregate, they must normalize.
      *   *Group 1 Instruction:* "Normalize so the Best Outcome in *this specific vote* is 0 and the Worst Outcome in *this specific vote* is 1." (Maya's rule).
      *   *Group 2 Instruction:* "Normalize so the Best Outcome *you can imagine in life* is 0 and the Worst *you can imagine in life* is 1." (TA's rule).
      *   *The Conflict:* In Group 1, the "Small Harm" is very close to the "Best Outcome" (since the worst is the Large Harm). So Small Harm $\approx$ 0.1. Large Harm = 1. Sum(13 * 0.1) = 1.3 > 1. (Specks win).
      *   *In Group 2:* The "Small Harm" is tiny compared to "Worst in Life". Say Small = 0.01. Large = 0.5. Sum(13 * 0.01) = 0.13 < 0.5. (Torture wins).
      *   *Wait, I need the verdicts to flip.*
      *   If Group 1 (Local) says Specks Win (Sum > 1) and Group 2 (Global) says Torture Wins (Sum < 1).
      *   Let's check the math.
      *   Local: Best = No Harm. Worst = Torture. Small Harm is somewhere in between. If Small Harm is perceived as "not that bad compared to torture," it gets a low score. 13 * low score could be < 1 (Torture worse) OR > 1 (Specks worse).
      *   Actually, usually, the "Dust Specks" argument relies on the sum being *larger*.
      *   So I want Group 1 to conclude Specks are Worse (Utilitarian sum > Torture).
      *   I want Group 2 to conclude Torture is Worse (Utilitarian sum < Specks).
      *   *How?*
      *   Group 1 (Local): Scale is [No Harm, Torture]. Small Harm is, say, 1/10th of Torture. 13 people * 1/10 = 1.3. 1.3 > 1. Specks win.
      *   Group 2 (Global): Scale is [Perfect Life, Worst Life]. Torture is, say, 5/10. Small Harm is 1/100. 13 * 1/100 = 0.13. 0.13 < 5. Torture wins.
      *   *This works.* It perfectly illustrates the normalization problem.

  4.  **Developing the Logistics:**

      *   **Time:** 75 mins.
      *   **Setup:** Split class into two rooms or corners (Group A and Group B). 7 students each.
      *   **Stakes:**
          *   Large Harm: Hold a heavy textbook at arm's length for 5 minutes + intermittent buzzer. (Safe, annoying).
          *   Small Harm: Eat one sour candy + listen to a low hum for 1 minute. (Trivial).
          *   Incentive: $40 vouchers. Random draw for who actually has to do the harm? No, that complicates it.
          *   Better: The *decision* determines who gets the vouchers vs. who does the task.
          *   Actually, to keep it clean: The *class* decides the rule. The *TA* implements the harm/vouchers based on the vote.
          *   To make it "real": One volunteer for the Large Harm (paid $20 voucher). The rest face the Small Harm (paid $20 voucher split?).
          *   *Correction:* If I pay them to suffer, it's a job. If I ask them to suffer to *save* vouchers, it's a trade-off.
          *   *Best approach:* There is a pot of $40.
          *   Scenario: The department has a budget.
          *   Option 1 (Torture): One person (Volunteer) does the Heavy Task. The pot is distributed equally among the other 13.
          *   Option 2 (Specks): Everyone does the Light Task. The pot is distributed equally among all 14.
          *   *Wait, this introduces money as utility.* Constraint 2 says "real stakes" but Constraint 4 warns against "just use WTP".
          *   *Refined Stakes:* The vouchers are the *reward* for participation. The harms are the *cost*.
          *   Let's simplify. The goal is to measure the *harm*, not trade it against money.
          *   Activity: "Calibrate the Suffering."
          *   We need to compare 1 Unit of Heavy vs. 1 Unit of Light.
          *   I will give them the "Data" (elicited in class) and ask them to Aggregate.
          *   *Elicitation Phase (15 mins):* Everyone answers a survey.
          *   *Group A Survey:* "Imagine the worst outcome *in this experiment* is 100 points of badness. The best is 0. Rate the Light Task."
          *   *Group B Survey:* "Imagine the worst outcome *in your entire life* is 100 points of badness. The best is 0. Rate the Light Task and the Heavy Task."
