      *   **Title:** The Calibration Problem.
      *   **Materials:** Two distinct instruction sheets (Red/Blue), heavy book, buzzer, sour candies, timer, vouchers.
      *   **Prep:** Recruit 1 Volunteer for the "Heavy" task (offer $10 voucher upfront for agreeing to be *eligible*).
