answer: |-
  Here is a complete lesson plan designed to meet your constraints, force the conceptual collision you want, and handle the specific mix of students you have.

  # Session Plan: The Calibration Trap
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Budget:** $40 (Coffee vouchers)
  **Materials:** 1 heavy textbook, 1 phone buzzer/timer, 14 sour candies, 2 distinct instruction sheets (Red/Blue), pens.

  ## 1. Setup & Stakes (0:00 – 0:10)
  **Goal:** Establish real consequences without lecturing.

  *   **The Volunteer:** Before class starts (or in the first 2 minutes), ask for **one volunteer** to be the "Designated Sufferer."
      *   *Deal:* They are eligible to hold the textbook for 2 minutes at the end of class. If they do, they get a **$12 voucher**. If they don't, they get a **$2 voucher** (same as everyone else).
      *   *Safety:* Explicitly state: "If at any point your shoulder hurts, put the book down. No penalty."
  *   **The Pot:** Announce there is $40 in vouchers. Everyone gets $2 for participation. The Volunteer bonus comes out of this pot.
  *   **The Choice:** Write two policies on the board.
      *   **Policy T (Torture):** The Volunteer holds the book + buzzer sounds for 2 minutes. The other 13 students sit quietly and work on a puzzle.
      *   **Policy S (Specks):** Everyone (including Volunteer) eats one sour candy + a low hum plays for 2 minutes. Everyone works on the puzzle.
  *   **The Mandate:** "Your job is not to vote on what you *prefer*. Your job is to calculate which policy creates **less total badness** for the group. You are Welfare Planners. You must minimize the sum of harm."

  ## 2. The Split Elicitation (0:10 – 0:30)
  **Goal:** Force the normalization divergence without naming it.

  Divide the room into two groups (7 students each). Do not let them talk to each other. Hand out **Red Sheets** to Group A and **Blue Sheets** to Group B.

  **Group A (The "Maya" / Local Norm Group)**
  *   **Instruction:** "To calculate total badness, you must quantify the harm. Use a scale of **0 to 100**."
  *   **The Anchor:** "**0** is the Best Outcome available in this choice (Policy T: sitting quietly). **100** is the Worst Outcome available in this choice (Policy T: holding the book)."
  *   **The Task:** "Rate the 'Sour Candy' experience on this scale. Then multiply by 13 people. Compare that sum to the 'Book Holding' score (which is 100). Choose the policy with the lower total score."
  *   *Psychological Prime:* This compresses the scale. The candy is being compared *only* to the book. It will likely feel like a significant fraction of the book (e.g., 10 or 15 points).
  *   *Expected Math:* Candy = 10. Total S = 130. Total T = 100. **Verdict: Choose Policy T (Volunteer suffers).**

  **Group B (The "TA" / Global Norm Group)**
  *   **Instruction:** "To calculate total badness, you must quantify the harm. Use a scale of **0 to 100**."
  *   **The Anchor:** "**0** is a Perfect Day in your life. **100** is the Worst Thing you can imagine happening in a year (e.g., failing the class, a car accident, a breakup)."
  *   **The Task:** "Rate *both* the 'Book Holding' and the 'Sour Candy' on this scale. Multiply the Candy score by 13. Compare the sums. Choose the policy with the lower total score."
  *   *Psychological Prime:* This expands the context. The book is now "medium bad" (e.g., 20 points) compared to a car accident. The candy is "tiny bad" (e.g., 1 point).
  *   *Expected Math:* Book = 20. Candy = 1. Total S = 13. Total T = 20. **Verdict: Choose Policy S (Everyone suffers).**

  ## 3. The Aggregation & Confrontation (0:30 – 0:45)
  **Goal:** Make the conflict visceral.

  1.  **Calculation (10 mins):** Let them work. Circulate. If an Econ student asks, "Can I use money?" say: "No. Money measures willingness to pay, not harm. Stick to the scale on your sheet."
  2.  **The Reveal (5 mins):** Ask Group A for their verdict. Ask Group B for their verdict.
      *   They will contradict. Group A condemns the Volunteer. Group B condemns the Class.
  3.  **The Argument (10 mins):** Put them in mixed pairs (one Red, one Blue).
      *   *Prompt:* "One of you has calculated correctly. One of you has made a mistake. Find the error. You have 5 minutes to agree on a single number for 'How bad is the candy?'"
      *   *Observation:* They will stall. The Red student will say, "But the book is the worst thing *here*!" The Blue student will say, "But the book isn't *actually* that bad in the grand scheme!"
      *   *Crucial Moment:* They will realize there is no "correct" scale, only different anchors.

  ## 4. The Debrief (0:45 – 1:15)
  **Goal:** Map the activity to the theory (and your fight with Maya).

  **Phase 1: The Math (10 mins)**
  *   Draw two number lines on the board.
  *   **Line A (Red):** 0 (Quiet) ——— 10 (Candy) —————— 100 (Book).
  *   **Line B (Blue):** 0 (Perfect) — 1 (Candy) — 20 (Book) —————— 100 (Accident).
  *   **The Lesson:** "You all used rational scales. But utility functions are unique only up to a **positive affine transformation** ($u' = au + b$). Group A chose a different $a$ (unit) and $b$ (zero) than Group B."
  *   **The Sum:** "When you sum utilities ($\sum u_i$), the result changes if you change the units. 13 $\times$ 10 > 100. But 13 $\times$ 1 < 20. The verdict flips based on the ruler you picked."

  **Phase 2: The Maya vs. TA Argument (10 mins)**
  *   **Name the Doctrine:** Now you can say "Interpersonal Comparison of Utility."
  *   **Maya's Position (Group A):** "Normalize locally (0 to 1 over the menu)."
      *   *Pros:* Decision-theoretically clean. Well-defined for the choice at hand.
      *   *Cons (The TA's Counter):* **Menu Dependence.** If I add a third option (e.g., "Everyone gets a shock"), the 'Worst Outcome' changes. The value of the Candy changes without the Candy changing. A bureaucrat can manipulate the verdict by adding dummy options.
  *   **TA's Position (Group B):** "Normalize globally (0 to 1 over life outcomes)."
      *   *Pros:* Stable across different menus.
      *   *Cons:* **Arbitrary Bounds.** Where does 'life' end? Is it a year? A lifetime? The species? Also, it requires imagining hypotheticals (car accidents) that dilute the reality of the actual choice.

  **Phase 3: The "Mind-Reading" Objection (5 mins)**
  *   Address the student who says, "This just proves we can't read minds."
  *   **Correction:** "It's not about mind-reading. Even if I knew your exact neural firing rates, I would still have to decide: Do I count 1 spike as 1 unit? Or do I normalize your spikes against your maximum possible firing rate? The **measurement choice** precedes the data. That is a moral choice, not an empirical one."

  ## 5. Implementation (1:15 – End)
  *   Acknowledge the deadlock. "Since we cannot agree on the scale, we cannot agree on the minimization."
  *   **Resolution:** Flip a coin to decide which Policy to implement for the final 2 minutes.
  *   Distribute vouchers. Thank the Volunteer.

  ---

  # Predictable Failure Modes & Fixes

  **1. The Econ Student: "Just use Willingness To Pay (WTP)."**
  *   *Prediction:* They will argue that the voucher value *is* the utility metric. "If I'd pay $5 to avoid the candy, and $50 to avoid the book, we have a common scale."
  *   *Fix:* "Money has diminishing marginal utility. $5 means more to a broke student than a rich one. Also, WTP is constrained by budget. If I have $0, my WTP is 0, but my pain is not. You are just swapping one normalization problem (pain units) for another (money units)."

  **2. The Refusal: "I won't eat the sour candy."**
  *   *Prediction:* One student refuses the stake, breaking the "13 people" math.
  *   *Fix:* Allow opt-outs silently. "If you opt out, your harm is 0. But you must agree that your '0' is counted in the sum." This actually reinforces the lesson: *Who gets counted?* is also a normalization choice.

  **3. The Skeptic: "This is just semantics. The book is obviously worse."**
  *   *Prediction:* They dismiss the math as a parlor trick.
  *   *Fix:* "If the book is 'obviously worse,' you are using a Global Scale (Group B). But if you legislate based on that, you might ignore 1,000 small harms that add up to more than one book. That is the 'Tyranny of Aggregation' objection. The math isn't the trick; the math reveals why your intuition is unstable."

  **4. The "Utilitarianism is Dead" Conclusion.**
  *   *Prediction:* Philosophy majors conclude welfare economics is impossible.
  *   *Fix:* "It's not impossible; it's incomplete. You need a **moral axiom** to fix the scale. For example: 'Everyone's worst pain counts equally.' That's not a measurement; that's a value judgment. This class is about finding those judgments."

  ---

  # Honest Limitations (What this activity *can't* do)

  You asked for honesty about what the activity leaves out. Here is what you must state explicitly in the debrief:

  1.  **Cardinality vs. Ordinality:** This activity assumes we can measure *intensity* (cardinal utility). Standard microeconomics often says we can only measure *ranking* (ordinal). You are forcing them into a cardinal framework to show the problem. Acknowledge that some economists would say "Don't sum utilities at all."
  2.  **The "Zero" Problem:** The activity highlights the *unit* problem well, but the *zero* problem (baseline) is trickier. Is the baseline "death"? "Perfect health"? "Current status quo"? The activity simplifies this to "Perfect Day" vs. "Best Option."
  3.  **Rights vs. Sums:** The activity assumes a Utilitarian framework (minimize the sum). It does not address Deontological constraints (e.g., "It is wrong to sacrifice the volunteer regardless of the sum"). The flip shows the *instability* of Utilitarianism, not necessarily that Utilitarianism is wrong.
  4.  **The "Maya" Defense:** In the real world, a "Local Normalization" is often used in cost-benefit analysis (Kaldor-Hicks). You should acknowledge that Maya's approach is standard policy practice, even if it has the theoretical flaw you exposed.

  # Why This Works for Your Specific Fight
  This design hands your fight with Maya directly to the students.
  *   **Group A** *is* Maya. They treat the menu as the universe.
  *   **Group B** *is* You. They treat the menu as a subset of life.
  *   **The Flip** proves your point: The verdict depends on the frame.
  *   **The Deadlock** proves her point (sort of): There is no "view from nowhere" to settle the frame.

  You aren't telling them the answer. You are making them feel the vertigo of the missing scale.
