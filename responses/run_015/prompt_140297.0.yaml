          4.  **The Reveal (10 mins):** The two groups compare verdicts. They conflict.
          5.  **Debrief (25 mins):** Map to theory.

      *   *Making it "Real":* The verdict determines what happens for the last 10 minutes of class.
      *   If Verdict = Specks Worse: Everyone eats sour candy + hum.
      *   If Verdict = Torture Worse: One Volunteer holds book + buzzer.
