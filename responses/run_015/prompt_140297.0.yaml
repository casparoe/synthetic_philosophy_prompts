      *   Tone: Professional, pedagogical, acknowledging the TA's specific intellectual struggle.

      *(Self-Correction during drafting)*: Make sure the "Local" group doesn't just rate Task S as 0. If Task T is the *only* worst thing, Task S must be strictly less. But if Task S is *very* small, 13 * Small might still be < 100.
