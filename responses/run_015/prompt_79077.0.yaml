answer: |-
  This is a superb brief. You know your audience (scientists who trust models but respect their limits) and you know the literature well enough to see the traps. Your instinct about the opening is correct, but it needs one small prerequisite to land.

  Here is the ninety-minute plan, structured to build the problem logically rather than historically.

  ### Part 1: The Machine and the Fog (0–30 mins)

  **1. The Consequentialist Machine (10 mins)**
  *   **The Setup:** Don't waste time on the history of utilitarianism. Define Consequentialism operationally, as an algorithm: *Identify options $\rightarrow$ Predict outcomes $\rightarrow$ Assign value $\rightarrow$ Maximize Expected Value (EV).*
  *   **Why here:** You cannot show where the logic breaks until you show how it is supposed to work. Scientists respect EV. It validates their worldview before you challenge it.
  *   **Whiteboard:** Draw a decision tree. Branches = outcomes. Nodes = probabilities. Leaves = utility values.
  *   **The Hook:** "In your careers, you dealt with risk. You ran ensembles. You knew the initial conditions were imperfect, but you could still calculate a probability distribution. That is **Risk**."

  **2. Risk vs. Cluelessness (20 mins)**
  *   **The Pivot:** This is your instinct, and it is the right opening for *this* group.
  *   **The Distinction:**
      *   **Risk:** We know the *space* of outcomes (rain/no rain) and can assign probabilities (70%/30%). The EV calculator works.
      *   **Cluelessness:** We cannot define the space of outcomes, nor assign meaningful probabilities, nor even determine the *sign* of the value.
  *   **Addressing Misconception #1 ("So it's just uncertainty"):** Head this off immediately. Draw a second tree where the branches go into a question mark that swallows the rest of the diagram. "Uncertainty is a parameter in the equation. Cluelessness is the failure of the equation itself."
  *   **Why this order:** If you start with the fog, they will try to solve it with better data (risk mitigation). You must establish that *more data does not solve this* before you describe the fog.

  ### Part 2: The Example (30–55 mins)

  **3. The Example: The Conference Flight (Reframed)**
  *   **Your Instinct:** You were right to worry. If you talk about CO2 and climate sensitivity, the physicists will say, "That's just a variance problem."
  *   **The Fix:** Keep the flight, but change the consequence chain from *atmospheric* to *historical/social*.
  *   **The Scenario:** You take the flight. You give a talk.
      *   *Short term:* You share data. (Calculable risk/benefit).
      *   *Long term:* Someone in the audience is inspired. They go home. They meet a partner they wouldn't have met if they'd left early. They have a child. That child grows up to be... a tyrant? A saint? A nobody?
  *   **Why this works:**
      *   It avoids the "governed by equations" trap. Social causation isn't deterministic in the way fluid dynamics is.
      *   It forces the **Sign Problem** (Your first "thing that stopped you"): We don't just not know *how much* good; we don't know if the net impact is positive or negative.
      *   It forces the **Identity Problem** (Your second "thing"): If you *don't* take the flight, that specific child never exists.
  *   **Whiteboard:** Draw the timeline. Mark the point where the "known" physics ends and the "unknown" history begins.
  *   **Addressing Misconception #2 ("Nothing matters / Everything matters equally"):** When you introduce the Identity Problem, this will arise. "If I can't compare the world where Child A exists vs. Child B, does my choice vanish?"
      *   *The Counter:* "It doesn't mean nothing matters. It means the 'Maximize' function is undefined for long time horizons."

  **4. The Two Deep Cuts (Integrated into the Example)**
  *   **Sign Ambiguity:** Ask the room: "Can anyone construct a plausible chain where saving a life today leads to net suffering in 200 years?" (They will; it's easy). "Now construct one where it leads to net flourishing." (Also easy). "If both are plausible and unquantifiable, what is the EV?"
  *   **The 'Who' Problem:** This is the killer. Explain that standard EV requires comparing State A and State B for the *same* population. If the population changes (Non-Identity), you are comparing apples to oranges.
  *   **Placement:** Do this *during* the example analysis. Do not save it for a lecture slide. It is the evidence for the cluelessness claim.

  ### Part 3: Living with the Fog (55–80 mins)

  **5. The Responses (25 mins)**
  *   **The Crisis:** "If we are clueless, is Consequentialism dead?"
  *   **Addressing Misconception #3 ("So Consequentialism is useless, back to rules"):**
      *   This is the moment to validate the doctors in the room.
      *   Explain **Rule Consequentialism** or **Satisficing**. "We follow guidelines not because rules are magic, but because they are heuristics that survive the fog better than case-by-case calculation."
      *   *Key Point:* "Cluelessness doesn't refute consequentialism; it refutes *Act* Consequentialism for complex systems."
  *   **Addressing Misconception #4 ("This is why we stick to guidelines"):**
      *   Acknowledge this is a rational response to cluelessness, not an abandonment of ethics. It's a "model closure" assumption.
  *   **Addressing Misconception #5 ("Nobody's done the study yet"):**
      *   Remind them: This isn't empirical ignorance. It's structural. No amount of funding solves the Non-Identity problem.

  ### Part 4: The Diagnostic (80–90 mins)

  **6. The Closing Question**
  *   Do not ask: "What is cluelessness?" (That tests memory).
  *   **Ask this:** "I am going to describe two decisions. One involves **Risk**, one involves **Cluelessness**. Which is which, and *what specific feature* tells you that?"
      *   *Scenario A:* Deciding whether to carry an umbrella based on a 40% forecast. (Risk: Known outcomes, known probs).
      *   *Scenario B:* Deciding whether to fund a geoengineering trial that might alter global precipitation patterns for centuries, changing migration and birth rates globally. (Cluelessness: Unknown outcome space, identity changes, sign ambiguity).
  *   **Why:** This forces them to apply the *criteria* (definability of outcome space, stability of identity) rather than recite a definition.

  **7. What to Refuse (The "Out of Bounds")**
  *   **State this explicitly:** "I am not going to solve this for you. There is no consensus in philosophy on how to fix the Non-Identity problem. If anyone asks for the 'right answer,' I will plead the fifth."
  *   **Name-Dropping:** Do not mention Lenman, Greaves, Parfit, or Sidgwick unless someone asks. It signals "academic territory" and shuts down the scientists. Keep it conceptual: "Some philosophers argue..."
  *   **Meta-Ethics:** Do not get dragged into "Is 'Good' real?" Keep it on "Can we calculate 'Good'?"

  ### Summary of Dependencies (Why this order?)

  1.  **EV/Risk first:** You must establish the *baseline of competence* before demonstrating the *failure mode*. If you start with Cluelessness, it looks like laziness. If you start with Risk, Cluelessness looks like a structural limit.
  2.  **Example before Theory:** The "Sign" and "Who" problems are abstract. They need the concrete "Conference Flight" timeline to see *where* the calculation breaks.
  3.  **Responses last:** You cannot discuss solutions (Rules/Heuristics) until the problem (Cluelessness) is fully felt. If you offer rules too early, they look like an escape hatch.

  ### A Note on the "Flight" Example
  You are right to be wary of the physics trap. When you run this example, **explicitly forbid** the group from talking about carbon ppm or radiative forcing.
  *   **Say:** "For this exercise, assume the climate impact is negligible. We are talking about the *human ripple effects* of you being in that room."
  *   This forces them out of "chaotic system" thinking (deterministic but sensitive) and into "historical contingency" thinking (structural unknowns).

  ### Final Advice for the Whiteboard
  Draw a horizontal line. Label the left side "Known Causality" (Physics, immediate effects). Label the right side "The Fog" (Social, historical, generational).
  *   Draw a dot for "The Act."
  *   Draw clear lines for the first hour.
  *   Draw fading, branching, intersecting lines for the second century.
  *   Leave that drawing up for the whole 90 minutes. It is the visual anchor for the whole session.

  You're the expert in the room on uncertainty. Use that authority. You aren't teaching them philosophy; you're teaching them how to read the error bars on ethics.
