prompt: |-
  I'm a third-year computer science student taking an undergraduate seminar on promissory obligation this term. My systems vocabulary is the only precise vocabulary I have for normative notions, and I'd like to use it carefully rather than loosely — so I want a translation, and then an honest report on what the translation fails to carry.

  We've been working through three families of answer to why a promise binds: the practice-or-convention answer, on which promising is an invented artifact whose rules constitute the obligation, so that the question of whether to keep one can only be raised from inside the practice; the expectation-and-assurance answer, on which the function of the practice is to let one person make her future conduct reliably predictable to another, with obligation explained by what reliance and assurance require; and the self-binding answer, on which a promisor exercises a normative power, giving the promisee a claim and a standing to demand performance, so that the reason created is both the agent's own creation and owed to that person in particular.

  Please restate each in distributed-systems terms: nodes and messages, coordinators and participants, commit and abort, atomicity and rollback, compensating actions for what cannot be undone, safety versus liveness, failure detectors and indefinite blocking, quorums, staking or reputation as enforcement, and the distinction between a specification and the implementations that satisfy it. Mark explicitly where you are paraphrasing or inventing an analogue rather than translating.

  The residue report is what I actually want. First, what has no expression in my vocabulary at all: I suspect the directed character of the obligation and the idea of a reason an agent creates merely by intending, but tell me if the untranslatable part is somewhere else. Second, what survives only by being distorted — in particular, whether the convention answer translates so smoothly only because protocols already presuppose an external author of the spec and an institution that runs it, in which case my growing conviction that obligation must be artificial would be an artifact of my choice of vocabulary rather than a finding. Third, whether anything in my vocabulary is more fine-grained than the seminar readings, and whether that matters: philosophy so far has treated kept and broken as a binary, whereas I have to distinguish committed, blocked, aborted, compensated, and in-doubt, and I want to know if the finer distinctions are doing real work or are merely an engineer's obsession.

  Two cases, please, because they are where I lose my grip: a promise to someone who will never be in a position to learn whether it was kept, so that no message reporting the breach is ever delivered; and a promise made now, in full knowledge that I will later want to break it, by someone who has already arranged that no penalty can reach him. Say what each family of answer does with these, in my terms, and where the terms stop working.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year CS student, taking an undergraduate seminar on promissory obligation (philosophy/ethics).
      *   **Background:** Strong systems vocabulary (distributed systems, protocols, consistency, etc.), weak/novice philosophy vocabulary. Wants to use CS terms *carefully* as analogies, not loose metaphors.
      *   **Task:**
          1.  Translate three philosophical theories of promising (Practice/Convention, Expectation/Assurance, Self-Binding/Normative Power) into distributed systems terms.
          2.  Provide a "Residue Report" (what's lost, what's distorted, what's gained).
          3.  Analyze two specific edge cases (Secret Breach, Immune Defector) using both the theories and the CS translation.
      *   **Constraint:** Mark explicitly where I am paraphrasing or inventing an analogue.
      *   **Tone:** Rigorous, honest, precise, respectful of both domains (CS and Philosophy). Avoid dumbing down the philosophy or over-engineering the ethics.

  2.  **Deconstruct the Three Theories & Map to CS:**

      *   **Theory 1: Practice/Convention (Rawls/Searle style).**
          *   *Core:* Promising is a game. Rules define the move. Obligation exists *because* the practice exists.
          *   *CS Analogue:* Protocol Specification.
          *   *Mapping:* The "practice" is the protocol spec (e.g., TCP, 2PC). "Making a promise" is sending a specific message type defined by the spec. "Obligation" is adherence to the state machine defined by the spec. If you deviate, you aren't "breaking a promise" in a moral sense, you are just producing undefined behavior or violating the protocol.
          *   *Key Terms:* Specification vs. Implementation, State Machine, Protocol Compliance.

      *   **Theory 2: Expectation/Assurance (Scanlon/Utilitarian style).**
          *   *Core:* Promising creates reliance. Harm comes from disappointing expectations. Obligation stems from preventing harm/managing reliance.
          *   *CS Analogue:* Reliability & Consistency Guarantees.
          *   *Mapping:* "Promise" is a guarantee of service level (SLA) or consistency model (e.g., "Eventual Consistency"). "Obligation" is maintaining system invariants so dependent nodes don't crash. "Breach" is a safety violation that causes cascading failures in dependent services.
          *   *Key Terms:* Safety Properties, Reliance/Dependency, Cascading Failure, SLA.

      *   **Theory 3: Self-Binding/Normative Power (Shiffrin/Contract Law style).**
          *   *Core:* I change the normative landscape. I give *you* the right to command *me*. It's a transfer of authority.
          *   *CS Analogue:* Capability-Based Security / Delegated Authority.
          *   *Mapping:* "Promise" is issuing a capability token. "Obligation" is the system enforcing access control based on that token. The promisor *programmatically* restricts their own future state space. The promisee holds the "key" to enforce.
          *   *Key Terms:* Capability Tokens, Access Control Lists, State Space Restriction, Authority Delegation.

  3.  **Drafting the Translation (Iterative Refinement):**
      *   *Critique:* Make sure not to say "It *is* this." Say "It maps to this."
      *   *Refinement:* Ensure the distinction between "Specification" (Theory 1) and "Enforcement" (Theory 3) is clear. Theory 1 is about the *definition* of the act. Theory 3 is about the *power dynamic* created.

  4.  **Developing the Residue Report:**
      *   *Untranslatable:* The "Ought." CS describes *is* (state transitions). Philosophy prescribes *ought*. The "directed character" (owed *to* someone, not just a global invariant) is hard. CS has ACLs, but do they capture "respect"?
      *   *Distorted:* The "Convention" view looks too much like "Protocol." But protocols have designers (God/Admin). Morality might not. This risks begging the question (is morality artificial?).
      *   *Fine-grained:* CS distinguishes states (in-doubt, compensated). Philosophy often says "broken/kept." Does this matter? Yes, "compensating transaction" (apology + restitution) is different from "abort" (never happened). This adds nuance to "making amends."

  5.  **Analyzing the Two Cases:**
      *   *Case 1: Secret Breach (No one knows).*
          *   *Practice:* Did you follow the spec? If the spec requires internal state consistency, yes/yes. If it requires output, maybe no.
          *   *Expectation:* No reliance harmed. No crash. Did obligation exist?
          *   *Self-Binding:* Did you revoke the capability? You violated the access control, even if no audit log caught it.
          *   *CS Limit:* Monitoring/Observability. If it's not logged, did it happen? (Heisenbug).
      *   *Case 2: Immune Defector (Plan to break, no penalty).*
          *   *Practice:* Still a violation of the spec, regardless of penalty.
          *   *Expectation:* If they know you'll break, no reliance is formed. Was it a promise?
          *   *Self-Binding:* You retained the root key. You didn't actually delegate authority.
          *   *CS Limit:* Incentive compatibility / Game Theory vs. Protocol Correctness. CS assumes nodes follow protocol or fail Byzantine. It doesn't model "rational malice" well without crypto-economics.

  6.  **Review and Refine:**
      *   *Check Constraints:* Did I mark paraphrases? Yes. Did I address the "artifact of vocabulary" worry? Yes.
      *   *Tone Check:* Is it condescending? No. Is it too technical? Keep it accessible to a 3rd-year CS student (assume they know 2PC, CAP, etc.).
      *   *Self-Correction on "Self-Binding":* Initially, I thought of Smart Contracts. But Smart Contracts are more like Practice (code is law). Self-binding is more about *delegating the right to enforce*. I need to emphasize the *transfer of standing*. In CS, this is like handing over an admin credential.

  7.  **Final Polish:** Organize clearly with headers. Ensure the "Residue Report" is the highlight, as requested. (The user said "The residue report is what I actually want.") Make sure that section is substantial.

  **(Self-Correction during drafting):** I need to be careful with the "Convention" translation. The user worries that translating Convention to Protocol presupposes an "external author." I need to validate this insight in the Residue Report. Protocols *do* have designers (IETF, etc.). Moral practices might be emergent. This is a crucial distortion.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated request. You are asking for an isomorphism check between two distinct formal systems: deontic logic (ethics) and distributed consensus (systems). Below is the translation, followed by the residue report you prioritized, and finally the analysis of your two edge cases.

  I have marked **[Analogue]** where I am inventing a systems concept to fit a philosophical one, and **[Paraphrase]** where I am simplifying a philosophical claim to fit systems terminology.

  ---

  ### Part 1: The Translation

  #### 1. The Practice/Convention View
  *Philosophy:* Promising is a constitutive rule of a social practice. You cannot understand the obligation without understanding the practice. The obligation is internal to the "game."
  *Systems Translation:* **Protocol Specification vs. Implementation.**
  Making a promise is instantiating a specific message sequence defined by a protocol specification (e.g., the TCP handshake or Two-Phase Commit). The obligation is simply **compliance with the state machine** defined by the spec.
  *   **The Binding:** There is no "ought" outside the spec. If you send a `COMMIT` message, the protocol dictates you must persist the state. To ask "why must I?" is to ask "why must I follow TCP?" The answer is: if you don't, you are not participating in the network; you are just noise.
  *   **Vocabulary:** Specification, State Machine, Protocol Compliance, Undefined Behavior.
  *   **[Paraphrase]:** I am treating the "practice" as a fixed spec, whereas in philosophy, the practice is often fluid and socially maintained.

  #### 2. The Expectation/Assurance View
  *Philosophy:* The point of promising is to allow reliance. The obligation stems from the harm caused by disappointing reasonable expectations.
  *Systems Translation:* **Safety Properties and Dependency Graphs.**
  A promise is a **Safety Guarantee** (e.g., "Linearizability" or "Durability"). The promisee creates a dependency on this guarantee.
  *   **The Binding:** The obligation is to prevent **Cascading Failure**. If Node A promises consistency to Node B, and Node B builds its state on that assumption, Node A's violation causes Node B to crash or corrupt data. The "wrong" is the corruption of the dependent node's state.
  *   **Vocabulary:** Safety Invariants, Reliance/Dependency, Cascading Failure, SLA (Service Level Agreement).
  *   **[Analogue]:** I am equating "harm" with "state corruption/crash." In ethics, harm can be emotional or dignitary, which has no direct packet-loss equivalent.

  #### 3. The Self-Binding/Normative Power View
  *Philosophy:* By promising, I exercise a power to change the normative landscape. I give *you* a claim against *me*. I authorize you to demand performance.
  *Systems Translation:* **Capability-Based Security and Delegated Authority.**
  Making a promise is issuing a **Capability Token** or modifying an **Access Control List (ACL)**. You are programmatically restricting your own future state space and handing the "root key" for that restriction to the promisee.
  *   **The Binding:** The obligation is **Enforceable Restriction**. You have moved from a state where you *could* abort to a state where the promisee holds the credentials to veto your abort. The reason is "self-imposed" because you signed the transaction, but "owed" because the permission bit is now in their register, not yours.
  *   **Vocabulary:** Capability Tokens, Authority Delegation, State Space Restriction, Access Control.
  *   **[Analogue]:** I am treating "standing to demand" as "cryptographic authority." This assumes enforcement is possible, whereas moral standing exists even if you can't physically force me.

  ---

  ### Part 2: The Residue Report

  This is the critical section. You asked where the translation fails, where it distorts, and where it might be *too* precise.

  #### 1. The Untranslatable: The "Ought" and The "Directedness"
  You suspected the directed character of obligation is lost. You are correct, but the deeper loss is the **Normative Force** itself.
  *   **The Is/Ought Gap:** Distributed systems are descriptive. They describe state transitions ($S_1 \to S_2$). Ethics is prescriptive ($S_1 \to \text{ought} \to S_2$). In systems, if a node violates a protocol, we say it is "Byzantine" or "Faulty." We do not say it is "Guilty." The systems vocabulary can model the *structure* of the obligation (who has the token, who relies on whom), but it cannot model the *weight* of the obligation. It captures the geometry of the relationship, but not the gravity.
  *   **Directedness:** Systems handle directedness via ACLs (Node A can write to Bucket B). But this is technical permission, not moral standing. In ethics, if I break a promise to you, I wrong *you* specifically. In systems, if I violate a safety property, I violate the *invariant*. The system doesn't care *who* is hurt, only that the invariant is broken. The "victim" is an emergent property of the crash, not a primary participant in the violation.

  #### 2. The Distortion: The "Convention" Trap
  Your suspicion here is profound: **Translating Convention to Protocol presupposes a Designer.**
  *   **The Artifact:** In CS, a protocol spec (like TCP/IP) has an authoring body (IETF). It is top-down. If you translate the Practice View to Protocol Spec, you implicitly import a "Legislator" into the moral landscape. This validates your fear: your vocabulary makes obligation look artificial because *protocols* are artificial artifacts.
  *   **The Distortion:** Social practices (like promising) are often bottom-up, emergent, and evolutionary (like routing algorithms, but without a spec). By forcing the "Practice" view into "Protocol Compliance," you risk concluding that morality requires a God/Admin to write the spec. The systems vocabulary struggles to model **Emergent Norms** where the "spec" is just the steady-state behavior of the network without a central coordinator.
  *   **Consequence:** Your conviction that obligation is artificial may indeed be a vocabulary artifact. Systems assume specs precede implementations. Ethics often argues specs emerge from implementations (practice).

  #### 3. The Gain: Fine-Grained States
  Your vocabulary is significantly more fine-grained than the binary "Kept/Broken" of introductory philosophy. **This matters.**
  *   **Compensating Transactions:** Philosophy often struggles with "making amends." If I break a promise, can I fix it? In systems, we distinguish between **Abort** (rollback to initial state) and **Compensating Transaction** (forward recovery to a new consistent state). This maps beautifully to **Restitution**. It suggests that "breaking" a promise isn't necessarily a terminal error; it's an exception that can be handled, provided the compensating action restores the invariant (trust/utility).
  *   **In-Doubt States:** Systems know the state of "blocking" (waiting for a timeout). Philosophy rarely discusses the morality of *delay* or *ambiguity*. Your vocabulary allows you to analyze the obligation during the latency period. Are you obligated while the packet is in flight? Systems say yes (the transaction is pending). This adds nuance to "intent vs. action."
  *   **Verdict:** This is not engineer's obsession; it is ethical realism. Human relationships have "in-doubt" states (ghosting, hedging). Having terms for these allows for more precise moral diagnosis than "liar" or "truth-teller."

  ---

  ### Part 3: The Two Edge Cases

  Here we test the limits of the translation against the theories.

  #### Case 1: The Secret Breach
  *Promise made, broken, but the promisee never knows (no message delivered).*

  *   **Practice/Convention:**
      *   *Philosophy:* You violated the rule. The practice is undermined even if undetected.
      *   *Systems:* You violated the **Spec**. Even if the monitor didn't log it, the trace is non-compliant.
      *   *Failure Point:* Systems rely on **Observability**. If it isn't logged, in a pragmatic sense, the system state is indistinguishable from compliance. The systems view struggles to condemn a state violation that leaves no trace, whereas ethics condemns the *intent/state* regardless of observation.
  *   **Expectation/Assurance:**
      *   *Philosophy:* Problematic. If no reliance was disappointed (because they never knew), was there harm? Some say yes (integrity of the practice); some say no.
      *   *Systems:* **No Safety Violation Detected.** If the dependent node didn't crash because it didn't know the data was bad, the system continued.
      *   *Failure Point:* This theory collapses in systems terms. If the dependency graph wasn't triggered, the "guarantee" was functionally irrelevant. The systems vocabulary cannot easily capture "harm to the institution" without a measurable cost.
  *   **Self-Binding:**
      *   *Philosophy:* You revoked the authority you granted. You wronged them by taking back the control you gave.
      *   *Systems:* You retained the **Root Key**. You issued a capability but kept the revocation list private.
      *   *Failure Point:* In systems, if you hold the key and no one audits you, you are effectively still the admin. The "transfer of power" is only real if the system architecture enforces it. Without an external auditor (or God), the "self-binding" is just a comment in the code.

  #### Case 2: The Immune Defector
  *Promise made knowing you will break it; you have arranged immunity from penalty.*

  *   **Practice/Convention:**
      *   *Philosophy:* You are a free-rider. You exploit the practice without sustaining it.
      *   *Systems:* You are a **Byzantine Node** pretending to be correct. You are sending valid protocol messages but with malicious internal state.
      *   *Failure Point:* Protocols assume nodes try to follow them or fail randomly. They do not model **Rational Malice** well (unless using Crypto-Economics/Game Theory). The "Practice" view assumes participation implies buy-in. Systems know nodes can participate purely to exploit.
  *   **Expectation/Assurance:**
      *   *Philosophy:* If they know you'll break it, they can't rely. So was it a promise? If they *don't* know, you are inducing false reliance.
      *   *Systems:* **False Advertising / SLA Violation.** You advertised `Durability=True` knowing `Durability=False`.
      *   *Failure Point:* This translates well as **Fraud**. But if you are immune to penalty, the SLA is meaningless. The systems view shows that without **Enforcement Mechanisms** (slashing conditions, reputation loss), the guarantee is just a string literal.
  *   **Self-Binding:**
      *   *Philosophy:* You did not actually exercise the normative power. You mimicked the speech act without the intent to bind. It's a "hollow" promise.
      *   *Systems:* **Unsigned Transaction.** You sent the message but didn't sign the state transition. Or, you architected a backdoor.
      *   *Failure Point:* In systems, if you have a backdoor, you never actually restricted your state space. The translation reveals that "Self-Binding" is technically impossible without **External Enforcement**. You cannot bind yourself in a closed system; you can only bind yourself relative to a higher privilege level. If you are Root, you cannot promise. This suggests the Self-Binding view requires a "higher court" (morality/God) to be coherent, which your vocabulary exposes sharply.

  ### Summary Advice for Your Seminar
  Use your vocabulary to expose **Enforcement Mechanisms**.
  When a philosopher says "I am bound," ask: "What is the failure detector?" "What is the cost of Byzantine behavior?" "Is this a hard constraint or a soft SLA?"

  Your vocabulary will not solve the "Ought," but it will rigorously test the "Is." It will show that many moral theories implicitly assume an enforcement architecture (God, Society, Conscience) that they do not explicitly describe. Your job is to ask them to specify the protocol for that architecture.
