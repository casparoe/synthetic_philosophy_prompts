      *   *Resolution:* The user needs to distinguish "Gender Egalitarian" (Norway) from "Rich" (User's country). (1) conflates them ("richer and more gender-egalitarian").
      *   *Okay, the strongest tension is (2) vs (6) mediated by (1).*
