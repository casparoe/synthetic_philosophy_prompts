          *   *Conflict:* If nobody is owed a share (5), why is underrepresentation a problem (6)? Usually, underrepresentation is a problem *because* of the share (diversity benefits, role models, etc.) or because it implies injustice. If it's not injustice (per 4/5), why spend "serious money"?
          *   *Analysis:* (6) needs a justification other than justice or quotas. Maybe "wasted talent" or "monoculture risks." But (5) says "don't correct interests." If you spend money to reduce underrepresentation, are you not implicitly trying to correct the outcome that stems from interests (per 2)?
          *   *Severity:* Medium-High. (6) feels like a concession to social pressure that contradicts the principled stance of (5).

