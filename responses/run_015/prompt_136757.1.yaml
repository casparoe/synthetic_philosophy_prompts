      *   (3) **Economic/Insurance Model:** An alternative (or complementary) model based on economic security vs. interest. In poor countries, women choose STEM for security (insurance channel). In rich countries, they have other options for security, so only interest sorts. *Crucially:* The user claims this explains the pattern *with no biological loading*.
      *   (4) **Discrimination/Pipeline:** Discrimination is real and substantial in the user's country (rich but not frontier). "Free choice" is complacent. Climate needs fixing.
      *   (5) **Justice Principle:** Justice is about individuals, not group shares. Don't fix girls' interests.
      *   (6) **Policy Prescription:** Underrepresentation in engineering in rich democracies is a social problem. Spend money to reduce it.

  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (2) vs. (3) - The "Motivated Reasoning" Charge.**
          *   (2) says: Innate differences are *substantial* and explain the paradox (prosperity reveals intrinsic interest).
          *   (3) says: I have a model that explains the *same pattern* with *no biological loading*.
          *   *Conflict:* If (2) is true (innate differences are substantial drivers), why do we need (3) to claim it works with *no* biological loading? If (3) is sufficient to explain the pattern without biology, does (2) add anything? If (2) is true, is (3)'s claim of "no biological loading" false or misleading?
          *   *Friend's Objection:* (3) is a shelter to avoid the implications of (2).
          *   *Analysis:* They can coexist *causally* (both factors operate), but they conflict *rhetorically/explanatorily* regarding the necessity of biology. If (2) is "substantial," then (3)'s claim that it explains the pattern "with no biological loading" implies biology isn't *needed* to explain the pattern, which undermines the "substantial" claim in (2) regarding the *paradox specifically*.
          *   *Severity:* High. This is the core philosophical inconsistency.

      *   **Tension B: (2) vs. (6) - The "Norway vs. My Country" Problem.**
          *   (2) says: Norway's numbers (high segregation) are fine. Nothing to fix. Intrinsic preference revealed.
          *   (6) says: Underrepresentation in engineering in rich democracies (like the user's) is a genuine social problem. Spend money to fix it.
          *   *Conflict:* What distinguishes Norway from the user's country? (1) says the pattern shows up in richer/more egalitarian countries. (2) says Norway is the endpoint (nothing to fix). (6) says rich democracies have a problem.
          *   *Analysis:* If the paradox is driven by innate preferences revealed by wealth (2), then *all* rich countries should look like Norway. If the user's country is rich but has discrimination (4), maybe that's the difference. But if (6) says underrepresentation *itself* is the problem, that contradicts (5) (justice is about individuals, not distributions) and (2) (Norway doesn't need to fix this).
          *   *Severity:* High. It creates a double standard between Norway and "my country."

      *   **Tension C: (4) vs. (2) - Discrimination vs. Free Choice.**
