          *   *Conflict:* If discrimination is substantial, is the choice "free"? (2) implies the choice in rich countries is the "true" preference. (4) implies the choice is constrained by hostility.
          *   *Analysis:* This is manageable if we distinguish "rich/egalitarian" (Norway) from "rich/less-egalitarian" (User's country). But (1) groups them together as "richer and more gender-egalitarian."
          *   *Severity:* Medium. Depends on the definition of "egalitarian."

      *   **Tension D: (5) vs. (6) - Individual Justice vs. Social Problem.**
          *   (5) says: Nobody is owed a group share. Don't correct interests.
