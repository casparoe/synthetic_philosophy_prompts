          5.  Missing Commitments.
          6.  The Single Best Revision.

      *   *Refining Tension 1 (2 vs 3):* The user claims (2) is "substantial" but (3) explains the pattern "with no biological loading." This is logically contradictory *regarding the explanation of the paradox*. You can't say "Biology is a substantial cause of X" and "I have a model that explains X without biology." Unless you mean "Biology is substantial *in general*, but the *paradox specifically* can be explained economically." But (2) explicitly links the paradox to biology ("So the paradox is, at least partly, what intrinsic preference looks like...").
      *   *Correction:* The tension is that (3) undermines the *necessity* of (2) for the specific phenomenon (the paradox), making (2)'s claim about the paradox look like an ideological add-on.
      *   *Refining Tension 2 (5 vs 6):* (5) denies group shares matter. (6) asserts the group share outcome is a problem. This is a direct normative contradiction unless "social problem" is defined strictly as "lost utility" rather than "inequity." But "spending serious money" implies a duty to fix it. If there's no duty (per 5), why spend the money?
