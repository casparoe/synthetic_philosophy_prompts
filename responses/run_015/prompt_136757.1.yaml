      *   *Wait, does that solve (2) vs (3)?* Not entirely. The friend's objection is about *motivation*.
      *   *Audit advice:* Acknowledge the friend is partially right about the *function* of (3), even if the *logic* holds. (3) allows you to talk to the other camp. But you can't claim (2) is "substantial" for the paradox if (3) explains it fully without (2).
      *   *Actually, the prompt asks: "which of these six can't stay as they are."*
      *   I need to be decisive.

      *   *Decision:*
          *   **Tension 1 (Severe):** (5) vs (6). You cannot claim group shares don't matter for justice, then claim the group share outcome is a social problem requiring expenditure, unless you define "social problem" in a way that doesn't rely on the share itself. Currently, (6) implies the *share* is the problem.
