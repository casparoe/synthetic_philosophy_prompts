answer: |-
  This is a sophisticated and well-posed problem. You have identified a genuine lacuna in the standard operationalization of Lakatos's Methodology of Scientific Research Programmes (MSRP). The standard secondary literature (Lakatos 1970, Zahar 1973, Worrall 1978, Koertge 1978) focuses heavily on the *temporal* or *heuristic* novelty of facts relative to a *single* theory's construction, but it largely assumes a closed system where content is generated internally by the positive heuristic. Your case—inter-programme appropriation of corroborated content—exposes a vulnerability in the "ledger" of theoretical progressiveness.

  Here is an analysis structured according to your requests.

  ### (a) Established Concepts and Literature

  There is no single canonical term in the Lakatosian corpus that precisely captures **inter-programme appropriation of corroborated content**. However, there are three neighboring concepts that come close, from which your phenomenon must be distinguished.

  1.  **Heuristic Novelty (Zahar/Worrall):**
      *   *The Concept:* Elie Zahar (1973) and John Worrall argued that for a fact to corroborate a theory progressively, it must be "novel." Zahar defines this heuristically: a fact is novel if it did not play a role in the construction of the theory. Worrall refines this to focus on whether the *systematic content* of the theory was built to accommodate the fact.
      *   *The Difference:* This debate focuses on the relation between *one* theory and *its* evidence. Your case involves *two* programmes. In your scenario, the fact *was* novel relative to the donor programme (originally), but for the borrower, it is "old" evidence masquerading as "new" prediction. The Zahar/Worrall criterion, applied naively to the borrower, would count this as progressive because the borrower's theory $T_{n+1}$ was not constructed *using* that fact (it was constructed using the rival's formalism). Your critique is that the *source of the formalism* matters, not just the source of the data.

  2.  **$Ad Hoc_3$ Modifications (Lakatos):**
      *   *The Concept:* Lakatos distinguishes $ad hoc_1$ (no excess content), $ad hoc_2$ (no corroborated excess content), and $ad hoc_3$ (no improvement in heuristic power). A programme degenerates when its modifications are $ad hoc_3$.
      *   *The Difference:* You correctly note that your cases are not $ad hoc_1$ or $ad hoc_2$ because there *is* corroborated excess content. The question is whether importing a rival's formalism counts as an improvement in *the borrower's* heuristic power. Standard MSRP would likely say "yes" because the theory series is growing. Your argument is that the *heuristic power* resides in the donor, not the borrower. This is a gap in the definition of $ad hoc_3$: it does not account for **heuristic provenance**.

  3.  **Laudan's Problem-Solving Effectiveness:**
      *   *The Concept:* Larry Laudan (1977) explicitly rejects Lakatos's focus on "truth-likeness" or "hard cores" and counts empirical and conceptual problems solved.
      *   *The Difference:* As you noted, Laudan is *more* vulnerable to your critique than Lakatos. For Laudan, a solved problem is a solved problem, regardless of who solved it. Your case demonstrates why Laudan's metric can be gamed by "problem-borrowing." Lakatos is slightly better equipped to handle this because of the "hard core" constraint, but as you've found, the hard core is too coarse-grained to detect the importation of the *protective belt's* machinery.

  **Conclusion for (a):** There is no established name. The phenomenon sits in the blind spot between **Heuristic Novelty** (which tracks construction history) and **Theoretical Progressiveness** (which tracks content growth).

  ### (b) Vice or Blind Spot?

  This is best understood as a **structural blind spot in the appraisal metric that facilitates a rhetorical vice.**

  *   **The Blind Spot:** MSRP defines theoretical progressiveness as $T_{n+1}$ having excess empirical content over $T_n$. It is a *relational* definition between temporal stages of a single programme. It lacks a variable for **Content Provenance**. Therefore, the metric *cannot* distinguish between content generated by the programme's positive heuristic and content annexed from a rival.
  *   **The Vice:** The vice is **Theoretical Free-Riding**. This occurs when proponents of a degenerating programme rhetorically frame the imported success as a vindication of their *hard core*, when in fact it is a vindication of the *donor's* heuristic.
  *   **Can they come apart?** Yes.
      *   *Blind Spot without Vice:* A programme might import a rival's method openly, acknowledging the debt, and use it to solve problems their own heuristic couldn't reach. This is rational scientific behavior (eclecticism), but MSRP might mislabel it as "theoretical progress" of the importing programme.
      *   *Vice without Blind Spot (Historian's view):* A historian might see the free-riding clearly, but if using standard MSRP criteria, they are forced to code the programme as "progressive."
      *   *Diagnosis:* The metric's inability to see provenance *creates* the opportunity for the vice. If the ledger required provenance, the vice would be instantly visible as degeneration.

  ### (c) Amending Lakatos's Criteria

  You can amend the criteria without collapsing into the requirement that *every* prediction trace to the hard core (which is indeed impossible). The solution is to distinguish between **Theory-Series Progress** and **Programme-Heuristic Progress**.

  **Proposed Amendment: The Heuristic Provenance Condition (HPC)**
  A research programme $RP$ is *theoretically progressive* at stage $n$ only if:
  1.  $T_{n+1}$ has excess empirical content over $T_n$ (Standard Lakatos); **AND**
  2.  The modification from $T_n$ to $T_{n+1}$ was suggested by $RP$'s **Positive Heuristic**, OR the importation of external machinery was itself a move directed by the Positive Heuristic.

  **How this avoids the "Hard Core" trap:**
  The Positive Heuristic is a set of general guidelines ("develop a mathematical model of X," "look for Y mechanism"). It does not need to entail the specific prediction.
  *   *Case 1 (Genuine):* The heuristic says "mathematize the learning process." The team imports statistical methods to do so. **Progressive.** (The heuristic directed the *type* of move).
  *   *Case 2 (Free-Riding):* The heuristic is exhausted. The team sees a rival succeeding with statistics. They import the statistics *specifically* to save the core from falsification, without the heuristic ever suggesting "use statistics." **Degenerating.**

  This amendment shifts the focus from *where the content came from* (which is hard to track) to *why the modification was made* (which is historical/psychological).

  ### (d) Coining a Term: "Exogenous Theoretical Progress" (ETP)

  Since no term exists, I propose **Exogenous Theoretical Progress (ETP)** to describe the phenomenon neutrally, and **Heuristic Free-Riding (HFR)** for the normative vice.

  **Definition of Exogenous Theoretical Progress (ETP):**
  A research programme $RP_B$ exhibits ETP if and only if:
  1.  $RP_B$ transitions from theory $T_n$ to $T_{n+1}$.
  2.  $T_{n+1}$ yields corroborated excess empirical content relative to $T_n$.
  3.  The formalism, methodology, or specific empirical content enabling this excess was developed and corroborated within a rival programme $RP_A$.
  4.  $RP_B$'s Positive Heuristic did not anticipate or direct the adoption of $RP_A$'s machinery prior to $RP_A$'s success.

  **Boundary Conditions:**

  1.  **Heuristic-Directed Borrowing (Not ETP):**
      *   *Condition:* $RP_B$'s positive heuristic explicitly encouraged looking for mathematical formalisms of a certain type, or looking at $RP_A$'s domain, *before* $RP_A$ succeeded.
      *   *Verdict:* This is **Endogenous Progress**. The heuristic showed the flexibility to incorporate external tools.
  2.  **Vocabulary Import Only (Not ETP):**
      *   *Condition:* $RP_B$ adopts $RP_A$'s terms but re-derives the content using its own distinct mechanisms.
      *   *Verdict:* This is **Theoretical Convergence**. If the content is re-derived, the provenance of the *content* is endogenous, even if the *vocabulary* is exogenous.
  3.  **Intertranslatability (Illusory ETP):**
      *   *Condition:* $RP_A$ and $RP_B$ are shown to be notational variants of the same underlying structure.
      *   *Verdict:* This is **Unification**, not progress. There is only one programme effectively. Booking the success twice is double-counting.
  4.  **Instrument-Driven Variant (Instrumental Accretion):**
      *   *Condition:* Success follows from better microscopes/statistics available to *all* programmes, not specific to a rival.
      *   *Verdict:* This is **Instrumental Accretion**. It should be categorized separately from ETP. It increases *empirical* progressiveness for all, but does not indicate *theoretical* progressiveness for any specific hard core. It belongs in a "shared background knowledge" ledger, not the programme-specific ledger.
  5.  **Simultaneous Mutual Annexation (Reciprocal ETP):**
      *   *Condition:* $RP_A$ and $RP_B$ swap machinery and both claim progress.
      *   *Verdict:* This indicates **Programme Merger** or **Degeneration of Both**. If both need the other to survive, neither hard core is sufficient. It suggests the "hard cores" are empty and the real work is in the shared protective belt.

  ### (e) Historical Evidence for Distinguishing Genuine vs. Imported Progress

  To make this call in your dissertation without relying on hindsight, you need to look for **Prospective vs. Retrospective Rationality**.

  1.  **The "Smoking Gun" of Grant Proposals and Private Correspondence:**
      *   *Genuine:* Look for documents *prior* to the success where the programme proponents argue *on principle* that they need to adopt the rival's method. (e.g., "Our heuristic requires us to mathematize X, and their method is the best tool.")
      *   *Imported:* Look for documents where the adoption is framed as a rescue operation *after* failure. (e.g., "We must adopt their method to explain Anomaly Y, otherwise the core is untenable.")

  2.  **Citation and Attribution Practices:**
      *   *Genuine:* The borrowed formalism is cited as a *tool* developed by Others, applied to the Programme's problems.
      *   *Imported:* The borrowed formalism is cited as a *derivation* of the Programme's own core principles, or the citation is suppressed/minimized to imply endogenous generation.

  3.  **The "Would They Have Looked?" Counterfactual:**
      *   Examine the Positive Heuristic's track record. Did it previously direct the programme to similar methodological shifts?
      *   *Genuine:* There is a pattern of the heuristic absorbing useful external tools (e.g., a programme that consistently adopts new statistical standards as they arise).
      *   *Imported:* The adoption is a one-off anomaly, coinciding exactly with the point of degeneration.

  4.  **Rhetorical Framing of the "Novel Fact":**
      *   *Genuine:* "Our theory predicted X using method M." (Acknowledging M is the engine).
      *   *Imported:* "Our theory predicted X." (Omitting that M was the engine, implying the Core entailed X).
      *   *Evidence:* Compare the abstract/introduction of the papers (where claims are made) with the methods section (where the debt is visible). A disconnect here is strong evidence of Heuristic Free-Riding.

  5.  **Reaction to Rival's Priority:**
      *   If the rival programme points out the derivation, how does the borrower respond?
      *   *Genuine:* Acknowledgement of priority, focus on the *application* to new domains.
      *   *Imported:* Hostility, claims of independence, or assertions that the rival's derivation was "conceptually flawed" while the borrower's is "conceptually sound" (without changing the math).

  ### Summary Recommendation for Your Chapter

  1.  **Name the Gap:** Explicitly state that standard MSRP lacks a **Provenance Condition**.
  2.  **Use the Term:** Adopt **Exogenous Theoretical Progress (ETP)** as your analytical category.
  3.  **The Test:** Apply the **Heuristic Provenance Condition**. Ask: "Did the Positive Heuristic authorize this import *before* the import saved the programme?"
  4.  **The Verdict:** If the import was a desperate, post-hoc rescue not suggested by the heuristic, code the programme as **Degenerating with Exogenous Accretion**. This allows you to acknowledge the empirical success (the predictions work) without granting the theoretical virtue (the core is fruitful).

  This approach preserves the utility of Lakatos's framework while plugging the specific loophole you have identified. It allows you to be fair to the empirical data while remaining critical of the theoretical claims.
