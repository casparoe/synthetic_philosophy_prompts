answer: |-
  The border station was not made of stone, but of paper. Walls of filed permits rose in narrow aisles, dust motes dancing in the shafts of light like suspended ink. Wei sat at the central desk, the brush heavy in her hand. Before her, tethered to the iron ring of the counting-post, stood the animal.

  It was a horse. It was also white.

  In the Ministry of Passage, these were not simultaneous truths. They were competing jurisdictions.

  Wei opened the *Register of Forms*. The leather was cracked, smelling of dry earth. Here, one recorded the shape, the function, the kind. *Ox. Cart. Man. Horse.* She dipped the brush. The ink pooled, black and absolute. She wrote *Horse*.

  But the horse before her was not the abstract *Horse* of the register. That *Horse* could be yellow, black, or spotted. The animal at the post was specific. It vibrated with a particularity that the *Register of Forms* was designed to strip away.

  She closed the book. She opened the *Register of Hues*. This book was bound in pale silk. Here, one recorded the quality, the attribute, the accident. *Red. Blue. White. Unbleached.* She dipped the brush again. She wrote *White*.

  But *White* could be a stone, a cloth, a feather. The entry in the silk book did not neigh. It did not stamp its hoof against the packed dirt.

  Wei looked from the books to the animal. The bureaucracy demanded a single transit pass, a single seal. But the system required two file numbers. Form #8940. Hue #221.

  If she issued the pass based on Form #8940, she was permitting a horse of any color to pass. If a black horse arrived later claiming this pass, the logic of the register would uphold them. The whiteness would be legally invisible.

  If she issued the pass based on Hue #221, she was permitting any white object to pass. A white jade disk could walk through the gate under this authorization. The horseness would be legally invisible.

  If she combined them, she violated the Rule of Separation. *Categories must not mingle. The determinable cannot occupy the same line as the determinate.* To write "White Horse" was to create a compound entity that the ontology of the station did not recognize. There was no box for the compound. There was only the sum of parts, and the sum did not equal the whole.

  The horse shifted its weight. The sound was loud in the silence of the archive. It was one thing. It breathed as one thing. Yet, to move it from the outside to the inside, Wei had to cut it in half.

  She stood and walked into the aisles. She needed precedent. She needed to know how the previous Archivist had handled the anomaly. The shelves stretched back into shadow, infinite and repetitive. She found the box marked *Exceptions: Composite Beings*.

  Inside was a single scroll, brittle as autumn leaves. She unrolled it on the desk, careful not to crush the dust. The text was dense, the characters sharp and angular. It began not with a regulation, but with a dialogue.

  *"To seek a horse is to seek a form. To seek a white thing is to seek a color. To seek a white horse is to seek both. Therefore, the seeker of a horse is not the seeker of a white horse."*

  Wei's heart quickened. It was the old argument. The logic of the School of Names. But beneath the text, in a faded hand, was a marginal note.

  *"Attributed to the Mohists. Practical application for tax assessment. Do not treat as metaphysical inquiry."*

  Wei frowned. The School of Names dealt in the fracture of reality; the Mohists dealt in utility and love. To attribute this fracture to the utilitarians was a error of history, or perhaps a correction. If this was a tax code, then the split was not about truth, but about revenue. One tax for the flesh, one tax for the hide.

  But the horse did not pay two taxes. It bled from one wound.

  She returned to the desk. The horse was watching her. Its eye was dark, reflecting the stacks of paper, the windows, Wei herself. In the eye, she was a archivist. In the *Register of Forms*, she was a functionary. In the *Register of Hues*, she was a variable.

  She took a fresh slip of transit paper. She wrote the file number for the Form. She wrote the file number for the Hue. She left a space between them.

  The ink dried. The space remained.

  If she stamped the Form, the Color remained outside the gate. If she stamped the Color, the Form remains outside. If she stamps both, she acknowledges two entities. But only one animal stands before her.

  Where is the white horse?

  Is it in the space between the numbers? Is it the null set created by the intersection of incompatible categories?

  Wei lifted the seal. It was heavy, carved from stone. *Approved.*

  If she stamped the paper, she forced the ontology of the state onto the animal. She would make it true that the horse is not a horse. She would make the bureaucracy more real than the flesh.

  If she did not stamp, the animal remains in limbo, neither inside nor outside, existing in the border dust where the categories have not yet fallen.

  The horse blew air through its nose, a sharp exhalation that ruffled the pages of the *Register of Hues*. The silk pages fluttered. The number #221 seemed to swim on the page, detaching itself from the fiber.

  Wei looked at the manual again. The marginal note seemed to shift in the dim light. The attribution to the Mohists looked fresh, as if written yesterday. The original text looked ancient.

  She realized then that the manual was not a record of the rule. It was the rule itself. The text did not describe the separation; it enacted it. By reading it, she was performing the division.

  She looked at the horse. For a moment, the whiteness seemed to peel away from the shape, hovering like a mist around the solid form of the animal. The shape stood dark and generic; the color floated light and unattached. They were held together only by the tension of her gaze.

  Wei lowered the seal. She did not strike the paper.

  She took a new brush. She dipped it in red ink. She drew a line down the center of the transit slip, dividing the space into two halves. She wrote *Horse* on the left. She wrote *White* on the right.

  She left the center blank.

  She pushed the paper toward the horse. The animal did not move. It could not read. It could not file. It could only be.

  Wei sat back. The dust motes continued their slow dance. The *Register of Forms* waited on the left. The *Register of Hues* waited on the right. The horse stood in the middle, breathing, waiting for a name that would not break it.

  The ink on the page remained wet. The space between the words grew wider, though the paper did not move. Wei waited for the ink to dry, knowing that once it did, the gap would be permanent. She waited to see if the horse would step over the line, or if the line would step over the horse.

  Outside, the wind picked up, rattling the window frames. It sounded like pages turning. Wei picked up the brush again, then set it down. There was nothing left to write that would not be a lie. There was only the waiting, and the white horse, and the silence of the archive holding its breath.
