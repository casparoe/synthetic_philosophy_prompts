answer: |-
  She will verdict Cahokia a collapse, aligning it with Roman Britain and the Southern Maya rather than the Indus or Rome. Her reasoning will hinge on the abandonment of the core landscape despite regional cultural continuity.

  Two rules fit her six prior verdicts but diverge here. **Rule 1 (Political Termination):** Collapse is the cessation of a specific institutional order without direct successor in situ. This fits LBA, Britain, and Maya (polities ended), excluding Rome (transformed), Indus (reorganised), and Rapa Nui (adapted). For Cahokia, the chiefly mound-building order ended without replacement in the American Bottom; this predicts **Collapse**. **Rule 2 (Systemic Continuity):** Collapse requires the failure of the wider cultural network, not just a node. This fits Rome, Indus, and Rapa Nui (networks persisted), and LBA/Britain/Maya (networks fractured). For Cahokia, neighbouring regions grew and descendants exist; the Mississippian network persisted. This predicts **Not Collapse**.

  My best guess is **Collapse**. The Maya verdict is the decisive signal: she explicitly separated the fate of the *Southern Lowlands* from the continuity of *Maya people*. This establishes that the unit of analysis is the specific socio-ecological core, not the ethnic or cultural continuum. Cahokia mirrors the Maya case: the core (American Bottom) was evacuated, even if the culture (Mississippian) persisted elsewhere. The Indus verdict does not pull equally because she characterised it as "settlement shifting eastwards" rather than the "thinly settled" vacuum described in the Cahokia pack. She distinguishes between deurbanisation with regional density (Indus) and core abandonment (Britain/Maya/Cahokia).

  The case best separating these rules is **Angkor Khmer**. Under Rule 1 (Political/Core), Angkor is a **Collapse** (the temple-city and hydraulic state were abandoned). Under Rule 2 (Systemic), it is **Not Collapse** (Khmer polity and culture continued nearby). Her treatment of Angkor would reveal whether she prioritises the monument or the people.

  By ruling "Collapse," she commits to the view that political complexity is a fragile, distinct layer vulnerable to severance from population continuity. It treats the state as an entity capable of dying while its citizens live. Ruling "Not Collapse" would commit her to a longue-durée view where only total cultural erasure counts, rendering "collapse" nearly synonymous with "extinction." The concept is not merely registering drama; it determines whether we study the failure of institutions or the resilience of societies. She is clearly choosing the former.

  **Settled vs. Contested:**
  *Settled (for this seminar):* The pack stipulates the American Bottom was abandoned and mound-building ceased; Mississippian culture continued elsewhere.
  *Contested (in archaeology):* The scale of the "Vacant Quarter" depopulation is debated; some argue for residual populations. The causes (climate vs. social) are not consensus. Whether "collapse" is a useful category at all is widely disputed, though your tutor has operationalised it specifically.
