answer: |-
  This is a high-stakes situation. The placement committee is not looking for perfection; they are looking for *collegiability* and *defenseability*. They want to know if you can hold your ground without becoming defensive, and if you know where the bodies are buried in your own argument.

  Here is your prep sheet.

  ### Pre-emptive Concession (First 2 Minutes)
  **What to say:** "I want to state clearly at the outset: this project does not tell us what exists. It does not solve the composition dispute by proving tables are real or particles are fundamental. It assumes we cannot neutrally settle that question, and asks instead what we gain or lose by speaking as if one side were right."

  **Why:** This disarms the Austere Metaphysicians immediately (you aren't denying their ontology, you're changing the subject) and frames the "Engineering" pivot as a feature, not a bug. It also signals to the Chair that you know exactly where you stand relative to the tradition.

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The Metalanguage Circularity
  **Who:** Austere Metaphysician #1
  **The Question:** "You argue there's no neutral metalanguage to test for verbal disputes, yet your solution requires measuring 'inferential load.' But to measure load, you have to describe the inferences. If you use the universalist's language, nihilism looks costly. If you use the nihilist's, universalism looks costly. Isn't your engineering solution just the metaphysical dispute in disguise?"
  **Concede:** "You're right that the measurement isn't neutral."
  **Refuse:** "But that doesn't make it disguised metaphysics; it makes it explicit about its standpoint."
  **Reply:** "The goal isn't to find a God's-eye view of load—that's exactly what I argue is impossible. The goal is to show that *once* a community finds itself using a metalanguage, they can calculate the cost of switching. We aren't deciding which ontology is true; we're deciding whether the community currently inhabiting a universalist framework should pay the price to switch to nihilism. The circularity you see is the reality of the situation: we always start somewhere. My claim is that acknowledging the starting point is better than pretending we're neutral."
  **Soft Spot:** You are admitting the view is relative to a status quo. If the status quo is nonsense, your metric validates nonsense.

  #### 2. The Power/Politics Objection
  **Who:** Social/Political Metaphysician
  **The Question:** "You keep saying 'the community's habits.' But communities are hierarchies. In the biology case, the group with the grant money decides what counts as a 'real cell type.' Aren't you just providing a philosophical justification for letting the powerful institutionalize their vocabulary?"
  **Concede:** "You're absolutely right that inferential habits aren't distributed equally."
  **Refuse:** "But ignoring those habits doesn't remove the power dynamic; it just hides it."
  **Reply:** "If we pretend we can choose vocabularies based on 'truth' rather than 'load,' we still empower the group that gets to define truth. My view makes the cost visible. If the dominant group wants to institutionalize a vocabulary that saddles the marginalized group with massive inferential debt, my framework forces them to admit that cost. It doesn't solve the politics, but it stops us from calling political victories 'ontological discoveries.' I'd rather we fight about the load than pretend the load doesn't exist."
  **Soft Spot:** You don't have a mechanism for protecting minority vocabularies. You're relying on the majority to care about efficiency.

  #### 3. The Normative Gap
  **Who:** Neo-Carnapian
  **The Question:** "I'm with you until the end. You show us how to measure load. But why *should* we minimize it? Maybe maximizing load is intellectually virtuous. Why is 'engineering efficiency' the norm here?"
  **Concede:** "I'm not claiming efficiency is the only value."
  **Refuse:** "But it is the prerequisite for any other value to function."
  **Reply:** "Think of load as friction. You can want a car to go fast, or safe, or look beautiful. But if the engine is seized with friction, it goes nowhere. High inferential load means every conversation requires massive paraphrase or belief revision. We minimize load not because efficiency is the ultimate good, but because it's the condition for having a shared discourse at all. If we want to argue about justice or truth, we need a vocabulary that doesn't exhaust us before we start."
  **Soft Spot:** Sometimes high-load vocabularies are morally necessary (e.g., introducing "sexual harassment" increased load but was necessary).

  #### 4. The Historical Reduction
  **Who:** The Chair
  **The Question:** "Isn't this just Carnap's principle of tolerance with a decision-theoretic paint job? Or Quine grumbling about the analytic/synthetic distinction? What's actually new here?"
  **Concede:** "I am standing firmly on Carnap's shoulders."
  **Refuse:** "But Carnap left the choice of frameworks arbitrary; I'm giving you the metric he refused to provide."
  **Reply:** "Carnap said: choose whatever framework is useful. He didn't say how to measure usefulness when frameworks clash. Quine said: everything is revisable. He didn't tell us what happens when we *don't* revise the collateral beliefs. My contribution is the 'residual inferential load.' It's the specific cost calculation that Carnap and Quine omitted. I'm not redoing their work; I'm finishing the engine they left on the drawing board."
  **Soft Spot:** If they press that "usefulness" was always implied by Carnap, you have to concede the novelty is in the *mechanism*, not the *motivation*.

  #### 5. The Formal Precision Attack
  **Who:** Formal Semanticist
  **The Question:** "You say 'hold the term fixed.' Do you mean character, content, or context? If the metalanguage is vague, isn't 'the dispute survives' ill-defined? Your test relies on a stability of meaning that doesn't exist."
  **Concede:** "The test isn't algorithmically precise."
  **Refuse:** "But it doesn't need to be to do the work I'm asking it to do."
  **Reply:** "I'm not offering a decision procedure for formal languages; I'm describing a phenomenon in natural scientific and metaphysical discourse. When biologists fight about 'cell types,' they aren't worrying about character vs. content. They're worrying about whether the biomarker program crashes. My 'holding fixed' is pragmatic: can we keep making the same inferences without stopping to argue? If the answer is 'no' in any precise formulation, the load is high. Vagueness adds to the load; it doesn't invalidate the measure."
  **Soft Spot:** If they demand a formal model of "load," you don't have one. You have a conceptual metaphor.

  #### 6. The "Lazy Inference" Charge
  **Who:** Austere Metaphysician #2
  **The Question:** "Isn't this load measure just a popularity contest about which inferences people are too lazy to revise? You're privileging intellectual inertia."
  **Concede:** "It does privilege existing habits."
  **Refuse:** "But inertia isn't laziness; it's the infrastructure of thought."
  **Reply:** "Calling it laziness suggests we could just snap our fingers and change. But these inferences are tied to instruments, funding structures, and decades of data. When a biologist switches vocabularies, they aren't just changing their mind; they're potentially invalidating datasets. My view respects that cost. It's not about laziness; it's about the sunk cost of cognitive and material infrastructure."
  **Soft Spot:** Sometimes infrastructure *should* be scrapped. Your view leans conservative.

  #### 7. The Biology Analogy
  **Who:** Generalist / Outsider
  **The Question:** "Is the cell type case actually like the composition case? In biology, there's a practical goal (curing disease). In metaphysics, what's the goal? Why should ontologists care about 'utility'?"
  **Concede:** "The stakes are different in scale."
  **Refuse:** "But the structure of the dispute is identical."
  **Reply:** "In both cases, two groups are using the same words to make different inferences, and both claim to be describing reality. In biology, the cash value is clear. In metaphysics, the cash value is theoretical unity. If universalists and nihilists can't agree on what 'exists' without paraphrasing every sentence, their theoretical unity is already broken. My view offers a way to restore unity without pretending one side won the metaphysical fight."
  **Soft Spot:** Metaphysicians often claim their goal *is* truth, not unity. You're asking them to lower their sights.

  #### 8. The Scope Question
  **Who:** Generalist / Outsider
  **The Question:** "Does this apply only to ontology, or to ethical disputes too? Can we measure the load of 'justice'?"
  **Concede:** "I haven't tested it on ethics yet."
  **Refuse:** "But there's no reason in principle it wouldn't apply."
  **Reply:** "Wherever you have contested terms that carry inferential commitments, you have load. If 'justice' implies different policies for different groups, there is a cost to switching definitions. I'm starting with ontology because the 'verbal dispute' label is most weaponized there. If the model works here, it opens the door for elsewhere. But I'm keeping the claims limited to what I've defended."
  **Soft Spot:** Don't overpromise. If you say "yes, definitely," they'll ask for an example you can't give.

  ---

  ### The "Hope Nobody Asks" Objection
  **The Objection:** **"If the metalanguage is partisan (Thesis 1), then the measurement of load is partisan (Thesis 2). So you haven't solved the dispute, you've just relocated it to the measurement phase."**

  **Why this is the killer:** This is the logical trap between Thesis 1 and Thesis 2.
  *   Thesis 1 says: You can't step outside a language to check for disagreement.
  *   Thesis 2 says: Measure the load of switching languages.
  *   The Trap: To measure the load of switching from Language A to Language B, you must describe the consequences *in some language*.
      *   If you describe them in Language A, Language B looks costly (because everything has to be translated into A).
      *   If you describe them in Language B, Language A looks costly.
      *   If you describe them in Language C (Neutral), you contradict Thesis 1 (which says there is no neutral metalanguage).
