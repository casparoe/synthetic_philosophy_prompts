prompt: |-
  I maintain the backend for an open history reference project — volunteer work, on the side of a normal engineering job — and I've inherited the job of rewriting the rule our editors use to decide whether a claim gets tagged as fringe. The tag matters more than it sounds: it changes where the article ranks in search, and our corpus gets pulled into retrieval and fine-tuning pipelines, so a bad rule doesn't just mislabel a page, it launders nonsense into other people's systems. I have no philosophy training, and the arguments on our mailing list have convinced me that the disagreements are almost never about the evidence for Atlantis or ancient-astronaut explanations of monumental architecture or Fomenko's rebuild of the whole chronology; they are about what sort of thing a demarcation rule is even supposed to be. So before I let the list argue further I want a specification, and I want it written for a fixed purpose: the rule has to be applicable by a generalist editor, working from an article and whatever is linked from it, without resolving the underlying historical question and without specialist consultation. Both errors cost something real — tagging a responsible-but-heterodox hypothesis suppresses work that might be right, and failing to tag a confident fabrication gives it our house style — so please keep that purpose in view when you decide what counts as a requirement.

  What I want is the requirements list: the cases any adequate rule has to get right, the distinctions it must not collapse, the results from how historical inquiry actually works that it can't contradict, and the reason behind each. The distinctions I keep tripping over, to get you started but please don't limit yourself to them: false-but-ordinary-error versus pseudohistory; a heterodox hypothesis argued inside the discipline versus one argued from outside it; a bad method that landed on a true date versus a good method that landed on a false one; a claim that is protected by cheap auxiliary hypotheses every time it is pressed versus one that is genuinely untestable in principle; and tagging a whole research program versus saying whether anything inside it is still worth crediting — the salvage case, where someone chasing a lost continent nonetheless produces the only careful survey of a site anyone has. Flag for each requirement whether it is non-negotiable or a prejudice of one camp; I strongly suspect some of the things people demand are just preferences wearing argumentative clothing, and in particular I want your view on three candidates: that the rule must be decidable by a non-specialist in an afternoon, that it must track evidence rather than who believes what, and that political or nation-building utility counts as a marker at all. If some subset of the requirements can't be jointly satisfied — say, decidability by a generalist, sensitivity to real evidence, and symmetry between insiders and outsiders — say so explicitly and show me the conflict; that is the part I most want to see. And tell me which single requirement knocks out the most candidate rules.

  Three rules have been proposed on the list and I'd rather you judged them as candidate requirements than as theories, since I can't tell which is which. Priya's Double-Standard Test: build the mirror case, with the same evidence structure but believed by the right people, and if your rule stops firing it was only ever sociology. Marcus's Vindication Condition: there must be a specifiable set of observations that would get a tagged claim untagged, and it must not be empty. Sam's Replacement Rule: a claim counts as fringe only when it discards an established finding while offering no account of why the accepted evidence looks the way it does. Test them, and the requirements generally, against a case I made up for the purpose: a set of dressed stone terraces on an inland hillside, dated by mainstream archaeology to the first millennium BCE from pottery in the upper layers, which a group instead attributes to a seafaring culture two thousand years earlier, on the grounds that the tool marks on the lower courses look like metal tools; that the deep radiocarbon samples came back too old and were discarded as groundwater contamination; that a local flood epic mentions stone steps to the water at that spot; that no settlement of the right date exists nearby, which they read as evidence the builders came from elsewhere; and that the heritage ministry has refused permission to re-date, which they present as suppression. Every rule I try either flags it for reasons that would also flag a contested ordinary dig, or bogs down on the contamination question, which neither I nor the rule is competent to settle. Please don't give me citations, a reading list, or a survey of the literature — I can't chase references and neither can the system I'll run this on, so argue from the cases themselves. If one of these three is just a restatement of something with a name in the philosophy of science, tell me in one line and move on; keep any scoring of existing proposals to a few lines, because the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested requirements list and analysis:

  1.  **Analyze the Request:**

      *   **Context:** Backend maintainer for an open history reference project (volunteer work).
      *   **Task:** Rewrite the rule for tagging claims as "fringe."
      *   **Stakes:** High. Affects search ranking, retrieval pipelines, fine-tuning. Bad rules launder nonsense or suppress valid heterodoxy.
      *   **Constraint 1 (Crucial):** The rule must be applicable by a *generalist editor*, working from an article/links, *without* resolving the historical question or consulting specialists.
      *   **Constraint 2:** No philosophy training assumed. Focus on specifications/requirements, not theory.
      *   **Constraint 3:** No citations/reading lists. Argue from cases.
      *   **Constraint 4:** Keep scoring of existing proposals brief. Identify if they map to known philosophy concepts (one line).
      *   **Deliverable:** A requirements list (cases to get right, distinctions to maintain, results not to contradict, reasons). Flag requirements as "Non-negotiable" or "Prejudice."
      *   **Specific Analysis:** Evaluate three trade-offs (decidability, evidence tracking, political utility). Identify conflicts between requirements (impossibility theorems). Identify the single requirement that knocks out the most candidate rules.
      *   **Test Case:** Dressed stone terraces. Mainstream: 1st millennium BCE (pottery). Fringe: 2000 years earlier (tool marks, rejected C14 as contamination, flood epic, no settlement = external builders, ministry refusal = suppression).
      *   **Specific Rules to Test:** Priya's Double-Standard, Marcus's Vindication, Sam's Replacement.

  2.  **Deconstruct the Core Tension:**

      *   The user is asking for a *demarcation criterion* (philosophy of science term, though they say no philosophy training) that is *operationalizable* by non-experts.
      *   This is the "Impossible Triangle":
          1.  Accuracy (tracks truth/evidence quality).
          2.  Decidability (generalist, quick, no specialist knowledge).
          3.  Fairness (doesn't bias against outsiders/heterodoxy).
      *   If you can't know the evidence quality (requires expertise), you can't track evidence accurately.
      *   If you rely on consensus (insiders), you bias against outsiders.
      *   If you rely on formal logic (falsifiability), you might miss nuanced historical context.

  3.  **Drafting the Requirements List:**

      *   *Goal:* Define what the rule *must* do to be useful for the system described.
      *   *Requirement 1: The Asymmetry of Burden.* Fringe claims usually demand extraordinary shifts. The rule must capture who is bearing the burden of proof.
      *   *Requirement 2: The Salvage Distinction.* Differentiate between a false claim and a useful dataset generated while chasing it. (User specifically mentioned this).
      *   *Requirement 3: The Ad Hoc Shield.* Differentiate between refining a theory and immunizing it from refutation.
      *   *Requirement 4: The Consensus Proxy.* Since editors can't judge evidence, they must judge *engagement* with the community that does.
      *   *Requirement 5: The Temporal Stability.* A rule shouldn't flip-flop based on today's headline.

      *   *Refining for the "Generalist" Constraint:* This is the hardest part. A generalist cannot judge "tool marks." They can judge "was this published in a journal?" or "did they address the pottery?"
      *   *Re-evaluating:* The user wants requirements for the *rule*, not the rule itself. What properties must the rule have?
      *   *Req 1: Decidability.* (Non-negotiable). If the editor can't apply it, it fails the spec.
      *   *Req 2: Evidence Sensitivity.* (Non-negotiable). If it ignores evidence, it launders nonsense.
      *   *Req 3: Source Agnosticism.* (Prejudice/Conflict). Does it matter *who* says it? User asks about this.
      *   *Req 4: Falsifiability/Revisability.* (Non-negotiable). Must allow for being proven wrong.
      *   *Req 5: Granularity.* (Non-negotiable). Tag the claim, not the person/project (Salvage case).

  4.  **Analyzing the Three Trade-offs (User's Specific Questions):**

      *   *Decidability by non-specialist:* Non-negotiable for *this* system, but conflicts with Evidence Sensitivity.
      *   *Track evidence vs. believers:* Tracking evidence requires expertise. Tracking believers is sociological. This is the core conflict.
      *   *Political utility:* Prejudice. History isn't truth because it's useful. This should be excluded.

  5.  **Analyzing the Three Proposed Rules (Priya, Marcus, Sam):**

      *   *Priya (Double-Standard):* "Mirror case." If mainstream did this, would we accept it?
          *   *Philosophy:* Symmetry Principle (Strong Programme in Sociology of Scientific Knowledge).
          *   *Test:* Hard for a generalist. How do they construct the mirror?
      *   *Marcus (Vindication):* "Specifiable observations to untag."
          *   *Philosophy:* Falsificationism (Popper).
          *   *Test:* Good for distinguishing pseudoscience, but historical claims are often about unique past events (hard to specify future observations).
      *   *Sam (Replacement):* "Discards finding without accounting for accepted evidence."
          *   *Philosophy:* Lakatosian Research Programmes (protective belt vs. hard core) / Kuhnian Anomalies.
          *   *Test:* Strongest for the Terrace Case. Did they explain the pottery? No, they dismissed it as contamination without proof.

  6.  **Developing the "Impossible Theorem":**

      *   You cannot have (A) Generalist Decidability, (B) Evidence Sensitivity, and (C) Source Agnosticism simultaneously.
      *   To judge evidence (B), you need expertise (violates A) or you trust the consensus of experts (violates C).
      *   Therefore, the system *must* rely on a proxy for evidence (consensus/publication status) which inherently privileges insiders.

  7.  **Addressing the Test Case (Terraces):**

      *   *Mainstream:* Pottery (stratigraphy), C14 (rejected as contamination).
      *   *Fringe:* Tool marks (typology), Epic (textual), No settlement (argument from silence), Ministry refusal (conspiracy).
      *   *Application:*
          *   Priya: Would mainstream accept tool marks over stratigraphy? Generally no. But would they accept C14 rejection without new data? No. Rule fires.
          *   Marcus: What observation un-tags this? Finding metal tools from 3000 BCE? Finding pottery from 3000 BCE? It's specifiable. Rule passes.
          *   Sam: Did they account for the pottery? They called it contamination. Did they prove contamination? No. They discarded the finding without accounting for the evidence. Rule fires.

  8.  **Selecting the "Knockout" Requirement:**

      *   *Decidability.* Most philosophical definitions of pseudoscience require deep epistemic analysis. A generalist cannot do that. Any rule requiring "truth assessment" fails immediately. The rule must rely on *procedural* markers (publication, engagement, response to critique).

  9.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the constraint (Generalist + High Stakes).
      *   **The Requirements List:** Categorized by Function. Flagged (Non-negotiable vs. Prejudice).
      *   **The Conflict (Impossibility Theorem):** Explicitly state the tension between Decidability and Evidence Sensitivity.
      *   **The Three Trade-offs:** Answer the specific questions about decidability, evidence, and politics.
      *   **Evaluation of Proposed Rules:** Brief scoring against the Test Case.
      *   **The Knockout Requirement:** Identify the hardest constraint.

  10. **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure I don't slip into giving a *new rule*. The user wants a *requirements list* for the rule.
      *   *Correction:* Ensure I address the "Salvage Case" (good data, bad theory) explicitly in requirements.
      *   *Correction:* Be blunt about the "Political Utility" question. It's a trap for historical integrity.
      *   *Correction:* On the "Philosophy Name" constraint: Keep it to one line.
      *   *Correction:* Ensure the Test Case analysis shows *why* a rule fails or succeeds based on the requirements, not just "it works."
      *   *Focus:* The user is an engineer. Speak in terms of system constraints, edge cases, and failure modes.

  11. **Final Polish:** Check tone. Professional, direct, no fluff. Ensure the "Non-negotiable" vs "Prejudice" flags are clear. (e.g., Political utility is a prejudice/bad requirement).

      *(Self-Correction on Priya's Rule)*: Priya's rule is actually quite hard for a generalist. How do they know what the "right people" would do? It requires simulating an expert. I need to highlight this cost.
      *(Self-Correction on Marcus's Rule)*: Historical claims are often about the past. "Specifiable observations" might be impossible if the site is destroyed. Need to note this limitation.
      *(Self-Correction on Sam's Rule)*: This aligns best with the "account for evidence" requirement.

      *(Final check on the Conflict)*: The conflict is between "Decidable by Generalist" and "Tracks Evidence." A generalist *cannot* track evidence quality directly. They must track *signals* of evidence quality (peer review, citation, engagement). This inherently introduces a bias toward established institutions. I must state this clearly.

  12. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### Requirements Specification for Demarcation Rule

  **System Constraints:**
  1.  **Operator:** Generalist editor (no domain expertise).
  2.  **Input:** Article text + linked references (no external specialist consultation).
  3.  **Output:** Binary tag (Fringe / Not Fringe) affecting search ranking and data pipelines.
  4.  **Cost Function:** False Positive (suppressing heterodoxy) and False Negative (laundering fabrication) are both high-cost errors.

  ---

  ### Part 1: The Requirements List

  These are the conditions any candidate rule must satisfy to be deployed in your system.

  | ID | Requirement | Description | Status | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Procedural Decidability** | The rule must yield a yes/no decision based on visible textual features (citations, responses, methodology descriptions) without requiring the editor to verify the *truth* of the claims. | **Non-negotiable** | Your operators lack the expertise to adjudicate historical truth. If the rule requires knowing whether the C14 date is *actually* correct, the system halts. |
  | **R2** | **Claim Granularity** | The rule must apply to specific assertions, not entire authors, projects, or research programs. It must allow a "Fringe" tag on a chronology claim while leaving a "Valid" tag on a site survey produced by the same team. | **Non-negotiable** | Addresses the **Salvage Case**. Tagging the whole project destroys useful data (the survey) because of a bad hypothesis (the date). |
  | **R3** | **Engagement Symmetry** | The rule must check if the claim engages with the dominant evidence base. It does not require the claim to be *right*, but it must require the claim to *account for* why the dominant evidence exists. | **Non-negotiable** | Distinguishes **False-but-ordinary-error** (tried to explain the pottery, got it wrong) from **Pseudohistory** (ignored the pottery because it doesn't fit). |
  | **R4** | **Immunization Resistance** | The rule must detect when auxiliary hypotheses are added solely to deflect refutation without generating new predictions. | **Non-negotiable** | Distinguishes **Refinement** (adjusting a date based on new soil data) from **Ad Hoc Rescue** (claiming groundwater contaminated the sample because the date was wrong). |
  | **R5** | **Source Agnosticism** | The rule should not trigger based on the institutional affiliation of the author (e.g., independent vs. university) alone. | **Prejudice** (Ideal) | In theory, truth is independent of credentials. In practice, this conflicts with R1 (see Conflict Analysis). |
  | **R6** | **Political Neutrality** | The rule must not consider the national, political, or ideological utility of the claim as evidence for or against its validity. | **Non-negotiable** | History is often weaponized. A claim that supports nation-building is not therefore true; a claim that undermines it is not therefore false. |
  | **R7** | **Revisability Path** | There must be a clear description of what evidence *would* change the status of the claim. If a claim is structured so that no possible finding could un-tag it, it is fringe. | **Non-negotiable** | Distinguishes **Untestable** (metaphysical) from **Hard-to-test** (requires expensive digging). |

  ---

  ### Part 2: The Impossibility Conflict

  You asked to see where requirements cannot be jointly satisfied. There is a fundamental conflict between **R1 (Procedural Decidability)**, **R3 (Engagement Symmetry)**, and **R5 (Source Agnosticism)**.

  **The Conflict:**
  To satisfy **R3** (does this claim account for the dominant evidence?), an editor must know what the "dominant evidence" *is* and whether the claim's dismissal of it is justified.
  *   **Option A:** The editor judges the evidence quality directly. This violates **R1** (they are not specialists; they cannot judge the C14 contamination claim).
  *   **Option B:** The editor defers to the consensus of established institutions to define "dominant evidence." This satisfies **R1** but violates **R5** (Source Agnosticism). It inherently privileges insiders because "dominant evidence" is defined by the people currently holding the microphone.

  **Resolution for your System:**
  You must sacrifice **R5**. A generalist cannot evaluate evidence quality; they can only evaluate *process*. Therefore, your rule must treat "engagement with peer-reviewed consensus" as a proxy for "engagement with evidence." This means the rule will structurally bias against outsiders, not because they are wrong, but because they are outside the verification loop the generalist can see. You cannot fix this without hiring specialists.

  ---

  ### Part 3: Evaluation of Your Three Trade-offs

  **1. "The rule must be decidable by a non-specialist in an afternoon."**
  *   **Verdict:** **Non-negotiable.**
  *   **Reason:** This is a system constraint, not a philosophical preference. If the editor cannot apply it, the pipeline breaks. This requirement is what forces you to use procedural proxies (publication status, response to critique) rather than epistemic truths.

  **2. "The rule must track evidence rather than who believes what."**
  *   **Verdict:** **Prejudice (Impossible).**
  *   **Reason:** As shown in the Conflict above, a non-specialist *cannot* track evidence quality. They can only track *signals* of evidence acceptance (citations, journal status). A rule that demands direct evidence tracking will force editors to guess, introducing random noise. You must track "community belief" as a proxy for "evidence weight."

  **3. "Political or nation-building utility counts as a marker."**
  *   **Verdict:** **Prejudice (Dangerous).**
  *   **Reason:** This violates **R6**. While fringe groups often use history for political ends, so do states. If you tag claims that serve political ends, you will systematically tag minority histories and stateless peoples as fringe, while laundering state-sponsored nationalism as mainstream. Utility is orthogonal to validity.

  ---

  ### Part 4: Testing the Proposed Rules

  Here is how the three proposed rules perform against the Requirements and the **Terrace Test Case**.

  **Test Case Summary:**
  *   **Mainstream:** 1st Millennium BCE (Pottery stratigraphy). C14 rejected as contamination.
  *   **Fringe:** 3rd Millennium BCE (Tool marks, Flood Epic, No settlement = external builders, Ministry refusal = suppression).

  #### 1. Priya's Double-Standard Test
  *   *Definition:* Build the mirror case with the same evidence structure but believed by the "right people." If the rule stops firing, it's sociology.
  *   *Philosophy Name:* Symmetry Principle (Strong Programme in SSK).
  *   *Requirement Fit:* Fails **R1**. A generalist editor cannot construct a valid "mirror case." They do not know what evidence structure the "right people" would accept as equivalent.
  *   *Terrace Case:* An editor cannot know if mainstream archaeology would accept tool marks over pottery in a different context. The rule bogs down.
  *   *Score:* **Reject.** Too high cognitive load for the operator.

  #### 2. Marcus's Vindication Condition
  *   *Definition:* There must be a specifiable set of observations that would get a tagged claim untagged, and it must not be empty.
  *   *Philosophy Name:* Falsificationism (Popper).
  *   *Requirement Fit:* Passes **R1** and **R7**. Fails **R2** (Salvage). It tags the claim, but doesn't help separate the data from the hypothesis.
  *   *Terrace Case:* The fringe group *can* specify vindication (e.g., "Find 3rd Millennium pottery"). However, they also claim Ministry suppression prevents testing. If the rule accepts "suppression" as a reason why vindication is impossible, it fails. If the rule demands the observation exists *in principle*, it passes.
  *   *Score:* **Passable.** Good for distinguishing magic from history, but weak on the "contamination" dispute.

  #### 3. Sam's Replacement Rule
  *   *Definition:* A claim counts as fringe only when it discards an established finding while offering no account of why the accepted evidence looks the way it does.
  *   *Philosophy Name:* Research Programmes (Lakatos).
  *   *Requirement Fit:* Passes **R1**, **R3**, and **R4**. Best fit for **R2** (allows tagging the chronology without tagging the survey).
  *   *Terrace Case:*
      *   *Discarded Finding:* 1st Millennium date via pottery.
      *   *Account Offered:* "Groundwater contamination."
      *   *Verification:* Did they test the groundwater? Did they publish a chemical analysis? The text says they "discarded" it.
      *   *Result:* If the article shows no proof of contamination, the rule fires. It identifies the **Ad Hoc Rescue** (R4).
  *   *Score:* **Best Candidate.** It operationalizes "ignoring evidence" into "failing to explain evidence."

  ---

  ### Part 5: The Knockout Requirement

  The single requirement that knocks out the most candidate rules is **R1 (Procedural Decidability)**.

  Most philosophical definitions of pseudoscience rely on epistemic qualities (truth-likeness, coherence with reality, logical validity). None of these are visible to a generalist editor reading a webpage.
  *   If a rule requires knowing if the tool marks *are* from metal tools, R1 kills it.
  *   If a rule requires knowing if the C14 *was* contaminated, R1 kills it.
  *   If a rule requires knowing if the Ministry refusal *is* suppression, R1 kills it.

  Your rule must operate entirely on **documented engagement**. It cannot judge the *content* of the dispute, only the *structure* of the argument.

  **Recommendation:**
  Adopt **Sam's Replacement Rule**, hardened with **R1** constraints.
  *   *Modified Rule:* "Tag as Fringe if the claim rejects a consensus finding *and* the provided text contains no citation to a peer-reviewed mechanism explaining the discrepancy (e.g., no paper proving the contamination)."
  *   *Why:* This allows the editor to check for the *presence of a citation*, not the *truth of the contamination*. It satisfies R1 (decidable), R3 (engagement), and R4 (immunization). It accepts that a generalist cannot solve the history, only verify that the author has attempted to speak the language of the discipline.
