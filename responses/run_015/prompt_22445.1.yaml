      *   *Check:* Did I address the specific detail about "effortless recall"? Yes, need to emphasize functionalism over phenomenology.
      *   *Check:* Is the distinction between the classmate's phone and Maya's notebook clear? Yes, this is the "Parity Principle."
      *   *Check:* Is the high school level appropriate? Yes, explain Otto/Inga clearly.

  9.  **Final Polish:** (Drafting the response based on the above steps.) *Make sure to mention that this is a famous thought experiment so the student feels confident bringing it up in class.*

  **(Self-Correction Note):** I should make sure not to say "The classmate is 100% wrong." Philosophy rarely deals in 100%. I should frame it as "The classmate is relying on an intuition that many philosophers have rejected." This encourages critical thinking rather than just giving an answer key.

