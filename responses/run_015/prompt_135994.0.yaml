  # JOINT STATEMENT ON THE CATEGORY OF GENOCIDE: COMMON GROUND AND IRRECONCILABLE DIFFERENCES

  **Signed:**  
  *The Strict-Constructionist Legal Scholar*  
  *The Expansive-Naming Human Rights Activist*

  **Date:** October 26, 2023

  **Preamble**  
  We, the undersigned, acknowledge a profound disagreement regarding the application of the term "genocide" to historical and contemporary atrocities. While we argue from divergent premises regarding law, morality, and language, we recognize that our debate shares a common foundation. This document records our points of agreement, clarifies the precise nature of our disagreements, and tests our positions against specific historical cruxes.

  ### I. Agreed Claims
  1.  **Historical Scope:** We both accept that Raphael Lemkin's original conceptualization of genocide was broader than the final text of the 1948 UN Convention, encompassing cultural destruction and political groups that were subsequently excluded.
  2.  **Legal Precedent:** We both accept that international tribunals since the 1990s (ICTR, ICTY, ICC) have consistently required documented specific intent (*dolus specialis*) to destroy a protected group as such for a legal conviction.
  3.  **Distinctive Status:** We both accept that the label "genocide" carries a distinctive moral and legal status that other atrocity-labels (e.g., crimes against humanity, war crimes) do not replicate, triggering unique obligations and stigma.
  4.  **Political Consequence:** We both accept that the politics of labeling affects survivors' recognition and state accountability; the decision to apply or withhold the term has material consequences for justice and memory.

  ### II. Disagreements Table
  *The following table outlines our divergent positions in wording each side accepts as accurate to their own view.*

  | Feature of Dispute | Strict-Constructionist Position | Expansive-Naming Position |
  | :--- | :--- | :--- |
  | **Primary Definition** | "Genocide" is a specific legal charge defined by the 1948 Convention; narrowing ensures the rule of law remains functional and convictions remain possible. | "Genocide" is a moral-historical category rooted in Lemkin's full vision; broadening ensures the law serves justice rather than shielding states via loopholes. |
  | **Protected Groups** | The list (national, ethnical, racial, religious) is exhaustive; adding political or cultural groups conflates genocide with persecution or politicide. | The 1948 exclusions were political compromises, not moral truths; excluding political or cultural groups repeats the erasure intended by the drafters who opposed inclusion. |
  | **Proof of Intent** | Intent must be proven via direct evidence (orders, manifests); inferring intent from outcomes risks punishing policy failures as malicious destruction. | Intent can be inferred from systemic patterns (bureaucratic scale, targeting); demanding direct orders sets an impossible bar for modern state violence which hides behind plausible deniability. |
  | **Primary Risk** | **Dilution:** Broadening the term weakens its power to distinguish the 'crime of crimes' from other mass atrocities, reducing the incentive for intervention. | **Exclusion:** Withholding the term from structural destruction silences victims and grants impunity to states that destroy groups without explicit extermination orders. |

  ### III. Cruxes: Test Cases
  *We apply our positions to two specific historical contexts to illustrate the practical stakes of our disagreement.*

  **Crux (A): Dilution vs. Exclusion**  
  *Test Case: The Canadian Residential School System*  
  *Context: Systematic cultural destruction and high mortality, but no single order for total physical annihilation.*

  *   **Strict-Constructionist Prediction:** Calling this genocide weakens the term's power to distinguish Rwanda-style extermination. If cultural destruction equals physical destruction, the unique urgency of the legal convention is lost, and the term becomes synonymous with any oppressive assimilation policy.
  *   **Expansive-Naming Prediction:** Withholding the label reproduces the 1948 silencing. If the destruction of a group's continuity and identity does not count because the method was cultural rather than purely biological, we validate the colonial logic that sought to eliminate the group without technically killing every individual.

  **Crux (B): Intent and Evidence**  
  *Test Case: The Holodomor (1932–33)*  
  *Context: Widespread famine and displacement in Ukraine; contested archival proof of intent to destroy the group as such.*

  *   **Strict-Constructionist Prediction:** Without clear intent documentation (e.g., explicit orders to destroy Ukrainians as a group), the legal category should not apply. Applying it based on outcome alone conflates massacre with tragedy and undermines the specific intent requirement essential for criminal liability.
  *   **Expansive-Naming Prediction:** Bureaucratic scale and targeting patterns make intent inferable. Demanding direct proof sets an impossible bar for modern state violence, where perpetrators deliberately avoid paper trails. The structural reality of the famine constitutes the intent.

  ### IV. Assessment of Verbal Dispute
  *We were asked to determine whether part of our dispute is verbal—specifically, whether one side uses 'genocide' as a legal verdict and the other as a historical-moral status.*

  **Strict-Constructionist Assessment:**  
  Yes, the dispute is partially verbal. I use "genocide" primarily as a **legal verdict** requiring adjudication in a court of law. The Activist uses it as a **historical-moral status** applicable via sociological analysis.  
  *Prediction on Resolution:* Resolving this verbal ambiguity would clarify public discourse but would **not settle anything** regarding legal outcomes. Even if we agree the Activist is using a moral definition, the legal definition remains binding in court. Clarification prevents confusion but does not expand liability.

  **Expansive-Naming Assessment:**  
  Yes, the dispute is partially verbal. The Scholar uses "genocide" as a **static legal verdict** bound by 1948 text. I use it as a **dynamic historical-moral status** that should drive legal evolution.  
  *Prediction on Resolution:* Resolving this verbal ambiguity would **not settle anything** because the core conflict is not about language but about power. Acknowledging I am using a moral definition does not satisfy the demand for legal recognition. The goal is not merely to speak differently, but to change the law or force the law to acknowledge the moral reality.

  **Joint Conclusion on Verbal Dispute:**  
  We agree that while clarifying the legal/moral distinction reduces talking past one another, it does not resolve the underlying conflict. The Strict-Constructionist seeks to preserve the integrity of the existing legal tool; the Expansive-Naming Activist seeks to forge a new tool or reshape the old one. The verbal distinction explains the friction, but the political stakes ensure the friction remains.

  ***

  **Signatures:**

  __________________________  
  *Strict-Constructionist Legal Scholar*

  __________________________  
  *Expansive-Naming Human Rights Activist*
