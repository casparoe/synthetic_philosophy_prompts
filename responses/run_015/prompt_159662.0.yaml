prompt: |-
  Hey — I write novels (three out, one in revisions that its not going well with) and I got into an argument after a reading last week with another writer and some guy in the audience who does machine learning. He kept saying the mind is software and the brain is hardware, and I said no, it's more like a character: the same character can show up in the novel, in a film adaptation, in a stage version, in a Korean translation, in a fanfic somebody writes at 3am, and there isn't any fixed set of words or a fixed actor that the character *is*. Everyone half-agreed with me and then we all went for drinks. I think I was reaching for something philosophers already have a name for, but I don't want to just be told "congrats, that's functionalism" — I want the actual view, reconstructed in the vocabulary I use every day.

  So: you're a professional philosopher of mind who also knows your way around craft talk. Take a minute to brainstorm before you answer, and think carefully rather than giving me the smooth summary. Restate, as faithfully as you can, the position that mental states are states defined by the causal or functional role they play — and the standard "multiple realizability" argument that's supposed to sink the identity theory, i.e. the claim that a given mental state just is one specific physical state of the brain — using only my vocabulary: character, voice, POV, in-character and out-of-character, what a character *does* in the plot versus what words or what actor realizes them, scene function, drafts and revisions, retcons, adaptations, translations, and that thing where a beta reader writes "he wouldn't do that" in the margin. Where the translation is strained, say so instead of papering over it.

  Then give me the residue report — that's the part I actually want. Three things I keep chewing on: (1) If I define a character's role by what she does in my book, then any rewrite that changes one scene breaks her identity, but if I define it loosely ("the charming liar who sabotages the thing he wants") then almost any filler satisfies the role and the character dissolves into a stock type — is that the same bind functionalists are in, or am I worrying about something else entirely? (2) In this branching interactive thing I'm messing with, the same character gets different scenes and different lines depending on the reader's path; in one branch she confesses, in another she never does, and neither branch is canonical. Is she the same character across branches, and does the answer depend on how the role is specified? (3) What has no counterpart in my vocabulary at all — is there anything in the functionalist/identity-theory fight that just can't be said in craft talk, and is that because craft talk is missing something or because the philosophers' disagreement is thinner than it looks?

  Be straight with me about confidence: tell me how sure you are about each of the main claims you make, flag where the consensus is thin or genuinely contested, and single out the one point you're least confident in. A hedged honest answer is more useful to me than a clean confident one — this is going into a novel, and I'd rather not build a plot on something shaky.
