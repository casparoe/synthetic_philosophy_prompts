answer: |-
  - The core problem: The issue isn't just that picking a class is hard, it's that every possible class gives you a different probability, and there's no meta-rule to pick the "right" one without begging the question. This means your posterior belief is basically just a reflection of how you carved up reality beforehand. Consequently, objective forecasting becomes impossible without smuggling in hidden assumptions about which similarities actually matter.

  - AI timelines: An AI researcher picking "previous general purpose technologies" gets fast takeoff, while a random human picking "historical expert predictions" gets slow takeoff, and the RCP says neither choice is objectively privileged. This implies the expert's inside view is just a disguised reference class choice, so their confidence intervals are basically aesthetic unless they justify why *that* class matters more than "all complex projects." Ultimately, you can't claim your timeline is rational unless you can explain why your specific grouping of events isn't just cherry-picking data that agrees with you. It forces you to admit that "expertise" is often just confidence in a specific, unproven categorization scheme.

  - Doomsday / self-selection: The Doomsday Argument collapses if you can't decide whether your reference class is "humans," "conscious observers," or "entities capable of understanding the argument." Allowing self-selection effects means your existence as a question-asker already biases the sample, so using yourself as a random draw from a class you defined is circular. You end up proving whatever conclusion you baked into your definition of "observer," making the whole probabilistic doom-calculation feel more like ontology than math. Basically, you can't derive an empirical prediction from a tautology about how you define yourself.

  - EA base-rate problem: Effective Altruism often leans on global base rates for x-risk, like "nuclear wars per decade," but the RCP shows those rates shift wildly depending on how you slice the timeline or technology type. If you don't lock down the conditioning set, you can justify prioritizing any cause by finding a base rate where it looks statistically dominant or negligible. This turns prioritization frameworks into motivated reasoning exercises where the "data" is just whatever reference class makes your preferred intervention look cost-effective. It suggests we should treat base rates as weak priors at best, not as decisive evidence.

  - Your bottom line: You have to admit your priors are subjective and stop pretending the math is doing the heavy lifting for you. The only way out is to argue causally about *why* a class is relevant, rather than statistically pretending you sampled from a natural population. Basically, stop looking for the correct class and start defending the mechanism.
