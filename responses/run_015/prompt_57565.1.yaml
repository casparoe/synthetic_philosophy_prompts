answer: |-
  You have identified the central tension in modern insurance regulation. The inconsistency you see isn't a bug; it's the friction point between two incompatible logics that the system tries to stitch together: **Actuarial Fairness** (price equals risk) and **Social Fairness** (price equals ability to participate).

  The practice is not committed to a single coherent theory of justice or statistics. It is committed to a **political settlement** about which group memberships are permissible grounds for economic differentiation.

  Here is a reconstruction of what the practice presupposes, where it is inconsistent, and what lies beneath the reference class problem.

  ### 1. The Load-Bearing Principles
  The regulatory framework rests on three pillars. If you remove one, the whole structure collapses.

  **A. The "Protected Class" Distinction (Political, not Statistical)**
  The primary filter is not statistical validity (predictiveness) but political status. Regulators do not ban variables because they are "proxies"; they ban them because they map onto **historically marginalized groups**.
  *   **Sex/Race:** These are "protected classes." Using them violates civil rights norms regarding equality of status.
  *   **Age:** This is *not* treated as a protected class in the same way because it is a **universal lifecycle stage**. Everyone is young once; everyone is old once (if they are lucky).
  *   **ZIP Code:** This is the loophole. It is treated as an economic/geographic variable, not an identity variable.

  **B. The "Lifecycle Solidarity" Argument (Why Age is Allowed)**
  You mentioned the slogan: *"Everybody will be old someday but nobody changes sex."* You suspected this was just a slogan. In the context of insurance philosophy, it is actually a substantive argument about **cross-subsidization over time vs. across groups**.
  *   **Age Rating:** When you are young, you subsidize the old (in pensions) or the old subsidize you (in some health contexts). But crucially, *you will switch sides*. You are not permanently in the "high cost" bucket. The inequality is temporary.
  *   **Sex/Race Rating:** If men subsidize women (or vice versa), you never switch sides. You are permanently a payer or permanently a beneficiary based on an immutable trait. This creates a permanent caste system within the risk pool.
  *   **Load-Bearing Status:** This is load-bearing. If age were not universal (e.g., if there were a genetic condition that made some people biologically 80 at age 20 permanently), regulators would likely ban rating on "biological age."

  **C. The "Business Necessity" Defense (The ZIP Code Loophole)**
  This is where the "motive" issue you raised becomes legal doctrine. In US disparate impact law (and similar EU frameworks), a practice that correlates with a protected class is legal if it serves a "legitimate business purpose" and there is no "less discriminatory alternative."
  *   **The Presupposition:** Insurers are allowed to be accurate *unless* that accuracy violates a civil right.
  *   **The Tension:** ZIP code predicts theft (Business Necessity) but also predicts race (Discrimination). Regulators allow it because they prioritize **solvency and availability** (insurers must be able to price risk) over **perfect equality of outcome**. They assume that without ZIP rating, insurers would flee high-crime areas, causing redlining anyway.

  ### 2. Is Banning Sex While Permitting Age Consistent?
  It is consistent **only if** you accept the "Lifecycle Theory" of fairness.

  *   **Consistent View:** Insurance is a mechanism for sharing risk over a lifetime. Age is a temporal coordinate; Sex is an identity coordinate. We allow differentiation based on *when* you are in the lifecycle, but not *who* you are in the polity.
  *   **Inconsistent View:** If you view insurance purely as a contract of **Actuarial Fairness** (each pays their exact expected cost), then banning sex is an injustice to low-risk men (who are subsidized by women) or low-risk women (depending on the line of business). If you view it purely as **Social Solidarity** (we all pay the same), then age rating is unjust.

  **The Verdict:** The system is internally consistent *only* under a hybrid theory: **Meritocratic Actuarialism constrained by Civil Rights.**
  *   *Meritocratic:* You pay for risks you generate (driving habits, smoking).
  *   *Civil Rights:* You do not pay for risks inherent to your citizenship status (race, sex).
  *   *The Glitch:* Age falls in the middle. It is treated as "Meritocratic" (older people cost more) because it is viewed as a natural fact rather than a political identity.

  ### 3. The Reference Class Problem: Regulatory Arbitration
  You are correct that Reichenbach's rule (narrowest reliable class) doesn't solve the normative problem. Statistics can tell you *that* a class predicts risk; it cannot tell you *if* you are allowed to use it.

  **How Regulation "Solves" It:**
  Regulators effectively **legislate the Reference Class.**
  *   They decree that the "Individual" is the baseline.
  *   They decree that "Age" is a permissible expansion of the class.
  *   They decree that "Sex" is a forbidden expansion of the class.
  *   They decree that "ZIP" is a permissible expansion *unless* it creates disparate impact that cannot be justified.

  **Where it is Underdetermined:**
  You asked where two different theories license the same rulebook. This happens constantly.
  1.  **Utilitarianism:** Ban sex rating because the social unrest/cost of discrimination outweighs the actuarial accuracy gains.
  2.  **Deontology (Rights-Based):** Ban sex rating because using someone's sex as a price factor treats them as a means (a statistic) rather than an end (an individual), violating dignity.
  3.  **Contractualism:** Ban sex rating because no rational contractor would agree to a system where they could be permanently penalized for an immutable trait they cannot change.

  All three theories lead to the EU Gender Directive ban. You cannot look at the rule and know which moral philosophy produced it. This makes the system fragile; if the political wind shifts (e.g., towards extreme libertarianism), the justification for the ban evaporates.

  ### 4. What Would Change Under the Extremes?

  To understand the implicit view of the person in the current system, look at what happens when you remove the constraints.

  **Extreme A: Pure Individual Assessment (The "You" Model)**
  *   **The Theory:** No group factors. Only telemetry directly tied to *your* behavior.
  *   **Implementation:** No age, no sex, no ZIP. Only real-time telematics (how hard *you* brake), wearable health data (how *you* sleep), and driving history.
  *   **Consequence:**
      *   **Privacy Collapse:** Insurers need total surveillance to price without proxies.
      *   **Uninsurability:** People with bad genetics or unavoidable environmental risks become uninsurable.
      *   **View of Person:** The person is a **black box of behaviors**. Context doesn't matter; only output matters.
  *   **Why we don't do it:** It destroys risk pooling. Insurance ceases to be insurance and becomes pre-paid maintenance.

  **Extreme B: Fully Bayesian Pricing (The "Statistic" Model)**
  *   **The Theory:** Use every statistically relevant variable. Genetics, browsing history, purchasing data, social network risk.
  *   **Implementation:** If your friends have bad credit, your premium goes up. If you have the BRCA1 gene, your life insurance is astronomical.
  *   **Consequence:**
      *   **Hyper-Segmentation:** The "pool" dissolves. Everyone is in their own pool of one.
      *   **Caste System:** Risk becomes destiny. High-risk groups are priced out of essential services (housing, transport, health).
      *   **View of Person:** The person is a **collection of correlations**. You are your data.
  *   **Why we don't do it:** It violates the social contract. Insurance is legally required (auto, health), so pricing people out of it is effectively banning them from society.

  ### 5. Conclusion: The Implicit View of the Person
  The current regulatory scheme presupposes that a person is **a citizen first and a risk unit second.**

  *   **Load-Bearing:** The distinction between **Identity** (Sex/Race) and **Circumstance** (Age/ZIP/Behavior).
  *   **The Contradiction:** The system admits that ZIP code is often a proxy for Race, but tolerates it because "Crime Risk" is a legitimate business interest that trumps "Equal Outcome," whereas "Sex" has no legitimate business interest that trumps "Equal Status."
  *   **The Resolution:** The inconsistency you feel is the sound of the system balancing **Efficiency** (accurate pricing) against **Legitimacy** (social acceptance).

  If insurers priced perfectly (Bayesian), the system would be actuarially sound but socially illegitimate (people would revolt or demand single-payer). If insurers priced equally (Individual), the system would be socially just but actuarially insolvent (adverse selection).

  The current "messy" middle ground—banning sex, allowing age, tolerating ZIP—is not a failure of logic. It is a **political compromise**. It says: *"We will allow you to be priced on things that change (age), things you do (smoking), and where you live (ZIP), but we will not allow you to be priced on who you fundamentally are (Sex/Race), because that turns insurance from a tool of risk management into a tool of social stratification."*

  The fact that ZIP code threatens to undermine that last clause is the current frontier of the battle, not a bug in the code.
