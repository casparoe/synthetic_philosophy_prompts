      *   If they end with >250 tokens, everyone gets chocolate.
      *   This makes it cooperative. They want to maximize the *sum*.
      *   In Gen 1 (Zero Sum), switching doesn't change the sum.
      *   In Gen 2 (Positive EV), switching increases the sum.
      *   This aligns incentives perfectly.

  14. **Drafting the Content:** (Mental check of the text to be generated).
      *   Materials List.
      *   Decision Sheet Template.
