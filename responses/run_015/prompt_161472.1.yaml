answer: |-
  # Session Plan: The Envelope Game (90 Minutes)

  ## 1. Materials & Preparation

  **Budget:** €30.00
  **Class Size:** 20 Students
  **Token Value:** 1 Token = €0.10 (Total Bank: 300 Tokens)

  **Physical Items:**
  1.  **The Bank:** A clear box containing 300 poker chips or printed tokens.
  2.  **Envelopes:** 40 identical manila envelopes (numbered 1–40 on the back, invisible to students).
  3.  **Decision Sheets:** 20 printed copies (template below).
  4.  **Generator Decks:**
      *   **Deck A (Pairs):** 10 cards. Each reads: *Pair {€2, €4}, {€4, €8}, ... {€512, €1024}.* (Use powers of 2 to simplify math).
      *   **Deck B (Base):** 10 cards. Each reads: *Base €2, Base €4, ... Base €512.*
      *   **Coin:** One large visible coin.
  5.  **Whiteboard:** Divided into "Round Data" and "Bank Total."

  **Decision Sheet Template:**
  *(Print one per student)*
  ```text
  NAME: ___________________  ID#: ____ (Even/Odd)

  ROUND | AMOUNT SEEN | DECISION (Stay/Swap) | REASON (One Sentence) | MY OUTCOME | OTHER OUTCOME | IF I SWAPPED
  ------|-------------|----------------------|-----------------------|------------|---------------|-------------
    1   |     ---     |                      |                       |            |               |
    2   |             |                      |                       |            |               |
    3   |             |                      |                       |            |               |
  ...
  ```

  ---

  ## 2. Timeline & Script

  ### 00:00 – 00:10 | Setup & Stakes
  **Action:** Place the Bank box at the front. Hand out Decision Sheets.
  **Instructor Script:**
  > "Welcome. This is a workshop on decision-making under uncertainty. We are going to play a game for real stakes.
  >
  > Inside this box are 300 tokens. Each token is worth ten cents. At the end of class, if the box contains 250 tokens or more, everyone gets a chocolate bar. If it drops below 150, no one gets anything. The tokens in the box belong to the class, not to you individually. Your goal is to maximize the class bank.
  >
  > You will receive an envelope. Do not open it yet. On your sheet, record the Round Number. When I say 'Open,' look at the amount inside. Write it down. Then decide: Keep your envelope, or Swap it for the one on the table. Record your decision. Then, write *one sentence* explaining why.
  >
  > We will reveal the other envelope's amount after every round. You must record what you *would* have got if you chose differently. This is for the bank's audit."

  ### 00:10 – 00:25 | Phase 1: The Blind & The Peek
  **Goal:** Establish baseline intuition and capture the "1.25x" reasoning in handwriting.
  **Mechanism:** **Generator A (Pairs).** Pick a pair card, put amounts in two envelopes, shuffle envelopes, hand one to student.

  *   **Rounds 1–2 (Blind):** "Do not open the envelope. Decide Stay or Swap based on nothing. Record Reason."
      *   *Reveal:* Open all. Tally Bank.
  *   **Rounds 3–6 (Peek + Control):** "Open the envelope. Write the amount."
      *   **Instruction:** "Look at your ID number. If Even: You must decide based on your own policy. If Odd: Flip your coin now. Heads = Stay, Tails = Swap. Record the coin result as your decision."
      *   *Crucial:* "Write your Reason *before* you talk to your neighbor."
      *   *Reveal:* Open all. Tally Bank. Ask: "Did the Even or Odd group add more to the bank?" (Expect noise).

  ### 00:25 – 00:40 | Phase 2: The Paired Zero-Sum
  **Goal:** Demonstrate symmetry physically.
  **Action:** Pair students up (1&2, 3&4, etc.). Give each pair *one* prepared pair of envelopes (e.g., €8 and €16).
  **Instruction:**
  > "Sit with your partner. You hold Envelope A; they hold Envelope B. Do not show amounts.
  >
  > I am offering a swap. Privately, write 'Yes' or 'No'. If both say 'Yes', swap envelopes. If either says 'No', keep original.
  >
  > Record the amount you started with and ended with. Calculate the *pair's* total before and after."

  **Debrief (2 mins):**
  > "Look at the pair totals. Did any pair's total change? No. This is a zero-sum transfer between you. If one gained, the other lost. Does this change your view on whether swapping creates value?"

  ### 00:40 – 01:10 | Phase 3: The Two Generators
  **Goal:** Empirically distinguish the Symmetric vs. Causal mechanisms.
  **Setup:** Return to individual play. Bank resets to 200 tokens for this section (to isolate data).

  *   **Rounds 7–11 (Generator A - Symmetric):**
      *   **Visible Action:** Hold up **Deck A (Pairs)**. "I am drawing a pair card. I am putting these two numbers into envelopes. I am shuffling them. You get one."
      *   **Play:** Standard Peek & Decide (All students use own policy).
      *   **Data:** Record Bank change per round.

  *   **Rounds 12–16 (Generator B - Causal):**
      *   **Visible Action:** Hold up **Deck B (Base)**. "I am drawing a *Base* card. This number goes into *your* envelope. I am now flipping this coin." (Flip visibly). "Heads: The other envelope gets double your amount. Tails: The other envelope gets half."
      *   **Play:** Standard Peek & Decide.
      *   **Data:** Record Bank change per round.

  **Instructor Note:** Do not comment on the EV. Let the Bank Total tell the story. In Gen A, the Bank should hover flat (random walk). In Gen B, the Bank should trend upward if they switch (1.25x EV).

  ### 01:10 – 01:20 | Phase 4: The Threshold Discovery
  **Goal:** Show that edge knowledge beats algebra.
  **Action:** Announce a "Cap."
  **Instruction:**
  > "We are using Generator A (Pairs) again. But I am removing all pairs above €32. The maximum amount in any envelope is now €32. We will play 5 rounds."

  **Expected Outcome:** Students who see €32 know the other *must* be €16. They should Stay. Students who see €2 know the other *must* be €4. They should Swap.
  **Debrief:**
  > "Check your sheets. If you saw €32 and Swapped, you lost money for the bank. If you saw €2 and Stayed, you lost money. The 'always switch' argument fails at the edges."

  ### 01:20 – 01:30 | Final Reveal & Debrief
  **Goal:** Connect activity to the Paradox.
  **Action:** Write "The Two-Envelope Paradox" on the board.

  ---

  ## 3. Instructor Notes & Contingencies

  ### Handling the "1.25x Algebra" Student
  In the Peek Round (3–6), a student will likely write: *"Other is 2x or 0.5x. Average is 1.25x. Always switch."*
  **Do not refute this.**
  **Action:** During the Generator B debrief, ask that student: "Your math says switching adds value. Did the Bank grow in Rounds 7–11 (Gen A) or Rounds 12–16 (Gen B)?"
  **The Data:** In Gen A, the Bank will not grow systematically. In Gen B, it will.
  **The Lesson:** "Your algebra is correct for Generator B. It is incorrect for Generator A. The math depends on *how I filled the envelopes*, not just on what you see inside."

  ### Predictable Failure Modes
  1.  **Noise in Small Samples:** With 20 students and 5 rounds, random variance might mask the EV difference between Gen A and Gen B.
      *   *Fix:* Aggregate the data on the whiteboard immediately. Sum the "Bank Change" column. If the trend is ambiguous, acknowledge it: "The signal is weak. This is why we need the theoretical distinction."
  2.  **The Apathetic Student:** Some won't write reasons.
      *   *Fix:* Collect the sheets as their "exit ticket." Tell them at the start: "The chocolate bar depends on 100% sheet completion."
  3.  **Collusion:** Friends comparing amounts in Phase 2.
      *   *Fix:* "If I hear amounts spoken aloud, that pair is disqualified from the round, and the Bank loses 10 tokens."
  4.  **The "One-Shot" Objection:** A student argues, "But in real life, I don't know the generator."
      *   *Response:* This is your closing point. "Exactly. The paradox exists because we act as if we are in Generator B (Causal) when we are actually in Generator A (Symmetric)."

  ### What The Activity Cannot Reproduce
  You must supply this in words during the final 5 minutes:
  > "In this game, you learned the rules. You knew the deck was bounded. You could see the edges.
  >
  > The real philosophical problem is the **One-Shot Unknown**. Imagine I hand you an envelope in a cafe. You open it: €100. You will never see me again. You don't know if I used Deck A, Deck B, or if I have infinite money.
  >
  > In that case, you cannot count the edges. You cannot run 20 rounds. You only have the argument you wrote on your sheet. The activity shows you that the argument is *contingent* on the generator. The paradox is that the argument *feels* necessary even when the generator is unknown. That feeling is what we study next week."

  ---

  ## 4. Why This Staging Works

  1.  **Blind Round:** Removes the "amount" variable, isolating the pure "swap" intuition.
  2.  **Control Group (Coin Flip):** Proves that without information, Policy = Random. If "Always Switch" students don't outperform the "Coin Flip" students in Gen A, the strategy is void.
  3.  **Paired Zero-Sum:** Physically demonstrates that swapping cannot create value in a closed system (Gen A).
  4.  **Two Generators:** This is the core. It separates the *observation* (I see X) from the *mechanism* (How was X generated?). It validates the 1.25x algebra *only* where it applies (Gen B), preventing you from simply calling the algebra "wrong."
  5.  **Bounded Cap:** Forces the "Threshold" strategy. It proves that information about the *range* is the only thing that breaks the symmetry, not the halving/doubling itself.
  6.  **Shared Bank:** Aligns incentives. Students want the *correct* answer for the group, reducing gaming of the system.

  ## 5. Post-Session Cleanup
  *   Collect Decision Sheets (crucial for your records/grading).
  *   Count Tokens.
  *   Distribute Chocolate (if Bank ≥ 250 tokens) or acknowledge the loss (if Bank < 150 tokens) as a lesson in expected value variance.
  *   **Final Words:** "Keep your sheets. Next week, bring the line where you wrote your reason. We're going to dissect it."
