prompt: |-
  I teach a mixed second-year seminar on rational choice — about twenty students, mostly philosophy majors with some economics majors — and I have one ninety-minute session, a flat room with movable tables, and no assistant. Everyone has seen expected value and basic conditional probability; as far as I know none of them has met the two-envelope situation, and I don't want the name, the standard framing, or any version of the switching argument anywhere in the room until the last fifteen minutes. My budget is about thirty euros, so stakes can be real but must be small: my plan is that play happens in tokens, the class's tokens accumulate in one shared bank, and at the end the bank buys something modest for everyone (or nothing, if the bank is thin). I also want each student to keep a decision sheet — a row per round recording the amount seen, the choice made, and one line giving their reason in their own words — because I would rather have the paradox arrive in their handwriting than in my voice.

  What I need from you is a runnable session: the materials and the printed tables or card/dice procedures for generating amounts, a timeline with rough minute marks, and the exact instruction wording (the wording matters — I have to get them to act without telling them what to think). The staging I have in mind, which you should fix, replace, or reorder: a blind round where they must decide without opening anything; a peek round where they write their reason before any discussion; a paired exercise in which two students hold the two envelopes of the same pair, each is privately offered the swap, each finds the reasoning equally compelling, and the transfer turns out to be zero-sum; and then two different generators to compare. In the first, a pair is fixed and then randomised across the two envelopes; in the second, their amount is drawn first and the other envelope is then set to double or half of it by a coin flip, so that the second envelope is causally downstream of theirs. The two should look indistinguishable from the inside — same thing observed, same one-line argument available — yet only one of them rewards switching, and I want the class to feel that difference rather than be told it. I also want peeking to be scored against a control: half the switches in each round decided by a coin, and the other half by the students' own policy, with every round ending in both envelopes being revealed so each student can tally not only what they got but what the alternative policy would have got on that very same sequence. Finally, I want them to discover that with a bounded table of amounts a threshold policy ("switch if I see less than X, otherwise stay") genuinely beats blind switching, and that its whole advantage comes from the top of the range rather than from the halving-and-doubling step — so that when I later stretch the table upward, the advantage drains away without the argument they wrote down having changed at all.

  Then the debrief, mapped moment by moment onto what the students actually did, and I want it to include: how to handle the student who puts the airtight-looking one-point-two-five-times algebra on the board in the peek round, in a way that lets the class test it rather than me answering it; what will predictably go wrong the first time I run this (noise in small samples, students who peek and still feel nothing, the student who refuses to write a reason, the pair of friends who compare amounts mid-round); and an honest account of which feature of the problem the activity cannot reproduce and I will have to supply in words — I suspect it is the genuinely one-shot case against an unknown or bottomless generator, where the pull of the argument is strongest and no amount of playing, or of counterfactual scoring, could settle it. What I want them to walk out seeing is that the step from "whatever I see, the other envelope is half or double it" to "so switching is worth a quarter of what I see" is licensed by nothing they can observe in the envelope, that it depends entirely on how the envelopes were filled, and that the only information peeking really gives them is information about the edges of the range.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Mixed 2nd-year seminar (Philosophy/Economics), ~20 students, 90 mins, flat room, movable tables, no assistant.
      *   **Topic:** Rational Choice, specifically leading into the Two-Envelope Paradox (without naming it until the end).
      *   **Prerequisites:** Expected Value (EV), basic conditional probability. No prior exposure to Two-Envelope.
      *   **Constraints:** Budget ~€30 (real stakes via tokens/shared bank), students keep decision sheets.
      *   **Goal:** Students must *discover* the paradox through action and data, not lecture. The "switching argument" must emerge from their handwriting.
      *   **Specific Staging Requirements:**
          1.  Blind round (decide without opening).
          2.  Peek round (write reason before discussion).
          3.  Paired exercise (two students, same pair, private swap offer, zero-sum transfer).
          4.  Two Generators:
              *   Gen A: Pair fixed, then randomized to envelopes (Symmetric).
              *   Gen B: Amount drawn first, other set to double/half via coin flip (Causal/Asymmetric).
              *   *Crucial:* They must look indistinguishable from the inside, but only one rewards switching.
          5.  Scoring: Half switches by student policy, half by coin flip (control). Reveal both envelopes every round for counterfactual scoring.
          6.  Threshold Policy: Bounded table of amounts. Show threshold beats blind switching, advantage comes from the top edge. Stretching the table drains the advantage.
          7.  Debrief: Handle the "1.25x algebra" student empirically. Predict failure modes (noise, apathy, cheating). Acknowledge what the activity *can't* show (the one-shot/unbounded case).
      *   **Core Insight to Convey:** The step from "other is half/double" to "switching is +EV" depends on the generation mechanism, not the observation. Peeking only informs about range edges.

  2.  **Deconstruct the Logic & Mechanics:**

      *   *The Paradox:* $E[Other] = 0.5(2X) + 0.5(0.5X) = 1.25X$. Therefore switch. But symmetry says it doesn't matter.
      *   *The Resolution:* The probability $P(Other=2X | See=X)$ is not necessarily 0.5. It depends on the prior distribution of amounts.
      *   *The Activity Design:*
          *   Need physical envelopes/cards.
          *   Need a "Bank" system for tokens.
          *   Need Decision Sheets.
          *   Need specific protocols for Gen A vs. Gen B.
      *   *Gen A (Symmetric):* Pick a pair $\{x, 2x\}$ from a set. Flip coin to put $x$ in Left, $2x$ in Right (or vice versa). Student picks Left. *Result:* Switching has EV = 0.
      *   *Gen B (Asymmetric/Causal):* Pick $x$ from a set. Flip coin. If Heads, Other = $2x$. If Tails, Other = $0.5x$. Student holds $x$. *Result:* Switching has EV = $1.25x$.
      *   *Wait, check Gen B:* If I pick $x$ from a distribution, and the other is determined by a coin flip *after* I see $x$, then yes, $P(Other=2x) = 0.5$. But this requires $0.5x$ to be valid. If $x$ is the minimum, $0.5x$ is impossible. This creates the "edge effect."
      *   *Bounded Table:* To make the threshold policy work, we need a finite set of possible values (e.g., €2, €4, €8, €16, €32).
      *   *Threshold Strategy:* If I see €32 (max), I know the other must be €16. If I see €2 (min), I know the other must be €4. If I see €8, it could be 4 or 16.
      *   *The "Drain":* If we expand the range (€2 to €1024), the probability of hitting the top edge decreases, so the advantage of the threshold strategy diminishes.

  3.  **Drafting the Session Plan (Minute by Minute):**

      *   *0-10:* Setup, Tokens, Decision Sheets.
      *   *10-25:* Round 1 (Blind). No peeking. Just "Swap or Stay?"
      *   *25-45:* Round 2 (Peek + Control). Reveal amounts. Coin flip control.
      *   *45-60:* Paired Exercise (Zero-Sum).
      *   *60-75:* Generator Comparison (The Core). Gen A vs Gen B.
      *   *75-85:* Threshold Discovery (Bounded Range).
      *   *85-90:* Reveal & Debrief Setup.

      *Correction on Timing:* 90 minutes is tight for all this. Need to streamline.
      *   Merge Blind/Peek into one phased process.
      *   The "Two Generators" part is the heaviest lift. Needs clear instructions.
      *   The "Threshold" part needs to happen *during* the Generator part by restricting the deck.

      *Revised Flow:*
      1.  Intro & Materials (10m)
      2.  Phase 1: The Blind & Peek (25m) - Establishes the intuition.
      3.  Phase 2: The Paired Zero-Sum (15m) - Establishes the symmetry problem.
      4.  Phase 3: The Generators (30m) - The mechanical resolution.
      5.  Phase 4: Debrief (10m) - The philosophical wrap-up.

  4.  **Developing Materials:**

      *   *Tokens:* Poker chips or printed slips. Let's say 1 Token = €0.50. Budget €30 = 60 Tokens. 20 Students = 3 Tokens each base + bank pool. Actually, better: Class Bank starts with €20 worth of tokens. Winnings add to it. If Bank > €25, everyone gets a chocolate bar. If < €15, nothing. This creates shared interest.
      *   *Envelopes:* 20 pairs of manila envelopes.
      *   *Cards:* Need decks for the generators.
          *   Deck A (Symmetric): Pairs written on cards. (2,4), (4,8), (8,16)...
          *   Deck B (Causal): Single values. Flip coin to determine partner.
      *   *Decision Sheet:* Columns: Round, Seen Amount, Decision (Stay/Swap/coin), Reason, Outcome (My/Other), Counterfactual.

  5.  **Refining the "Two Generators" Instruction:**

      *   This is the trickiest part. How to make them indistinguishable to the student but different in mechanism?
      *   *Instructor Role:* I must be the dealer.
      *   *Gen 1 (The "Fixed Pair"):* I have a deck of pairs. I pick a pair. I shuffle them into two envelopes. I hand one to the student.
      *   *Gen 2 (The "Coin Flip"):* I have a deck of single numbers. I pick one. I put it in Envelope 1. I flip a coin. Heads: Envelope 2 = 2x. Tails: Envelope 2 = 0.5x. I hand Envelope 1 to the student.
      *   *Student Experience:* In both cases, they open Envelope 1, see $X$. They know Envelope 2 is either $2X$ or $0.5X$.
      *   *The Difference:* In Gen 1, $P(Other=2X | See=X)$ depends on the distribution of pairs. In Gen 2, it is explicitly 0.5 *unless* $X$ is the min/max of the deck.
      *   *Wait, Gen 2 constraint:* If I pick $X$ from a bounded deck, and flip for $0.5X$, I might go out of bounds. I need to handle the edges.
      *   *Better Gen 2:* I pick a *base* amount $B$. I flip a coin. If H, Envelopes are $(B, 2B)$. If T, Envelopes are $(0.5B, B)$. I hand the student the envelope containing $B$.
      *   *Actually, simplest for class:*
          *   **Method S (Symmetric):** Deck of 10 cards. Each card says a pair (e.g., "10 & 20"). I draw a card. I put 10 in Env A, 20 in Env B. I shuffle A/B. I give you one.
          *   **Method C (Causal):** Deck of 10 cards. Each card says a number (e.g., "10"). I draw a card. This is *your* amount. I flip a coin. Heads: Other envelope = 20. Tails: Other envelope = 5. (Note: Must ensure 5 is valid in the economy).
      *   *Problem:* If I use Method C, the student sees 10. They know the other is 5 or 20 with p=0.5. EV = 12.5. They *should* switch.
      *   If I use Method S, the student sees 10. It could be from pair (5,10) or (10,20). If the deck has equal pairs, $P(Pair=(5,10)) = P(Pair=(10,20))$. Then $P(Other=20) = 0.5$. EV = 12.5.
      *   *Wait, the paradox relies on the prior being uniform over an infinite range or undefined.* In a finite deck, if every pair $(2^k, 2^{k+1})$ is equally likely, then seeing $2^k$ implies it's either the small of $(2^k, 2^{k+1})$ or the large of $(2^{k-1}, 2^k)$.
      *   *To make Gen S yield EV=0:* The distribution of pairs must be such that seeing $X$ gives no info. This is impossible with a finite bounded set without edge effects.
      *   *Pedagogical Pivot:* The prompt asks to show that *only one rewards switching*.
      *   *Gen 1 (No Reward):* Standard Two-Envelope setup. Pairs $(2,4), (4,8), (8,16)...$ chosen uniformly. If I see 8, it's either the top of (4,8) or bottom of (8,16). If pairs are equally likely, $P(Other=16) = 0.5$. EV = 10. Switching is neutral.
      *   *Gen 2 (Reward):* I pick a number $X$ for you. Then I flip a coin to determine if the other is $2X$ or $X/2$. Here, $P(Other=2X) = 0.5$ *by construction*. EV = $1.25X$. Switching is positive.
      *   *The Catch:* Gen 2 is not "Two Envelope Problem" in the standard sense; it's a different game. But the prompt asks for "Two different generators... only one of them rewards switching." This fits.
      *   *The Threshold:* In Gen 1 (Standard), if there is a Max Cap (say 32), and I see 32, I know the other is 16. I should not switch. This creates the threshold advantage. In Gen 2 (Causal), if I see 32, the other is 64 or 16 (coin flip). I should switch (unless 64 is impossible in the token economy, but mechanically the EV holds).
      *   *Wait, if 64 is impossible in Gen 2:* Then the coin flip must be constrained. If I see Max, coin must be Tails. Then it collapses to Gen 1.
      *   *Resolution:* I will define the "Causal" generator such that the coin flip is *always* valid (e.g., using a theoretical bank, or ensuring the range is wide enough that edge effects are rare in the short session). Or, acknowledge the edge effect is where the "Threshold" strategy lives.
      *   *Prompt Requirement:* "I want them to discover that with a bounded table of amounts a threshold policy... genuinely beats blind switching, and that its whole advantage comes from the top of the range... so that when I later stretch the table upward, the advantage drains away."
      *   *Okay, Plan:*
          1.  Use Gen 1 (Standard Pairs) for the Threshold discovery.
          2.  Use Gen 2 (Causal) to show where the 1.25 algebra actually holds (and why it doesn't apply to Gen 1).

  6.  **Addressing Specific Prompt Constraints:**

      *   *Budget:* €30. 20 students. €1.50/student potential. Use tokens worth €0.10. 300 tokens.
      *   *Decision Sheet:* Must be printed.
      *   *Instruction Wording:* Crucial. Must be neutral. "Record," "Choose," "Reveal." No "Should."
      *   *The 1.25x Algebra Student:* Don't refute. Ask: "Does that math hold for Round 1 (Blind)? Does it hold for Round 3 (Gen 1)? Let's check the data."
      *   *Failure Modes:*
          *   Noise: Small N. *Fix:* Aggregate class data on board.
          *   Apathy: *Fix:* Shared Bank stake.
          *   Cheating: *Fix:* Peer monitoring in paired round.
          *   One-shot case: Acknowledge in debrief that the game is repeated, which allows learning edges. The real paradox is the single-shot unknown distribution.

  7.  **Writing the Instructions:**

      *   Need to be precise. "Do not open envelope until instructed." "Write reason *before* talking."
      *   Need to ensure the "Causal" generator is distinct.
      *   *Gen 1 (The "Pair" Deck):* 10 Cards. Each lists a pair $\{2^k, 2^{k+1}\}$. Dealer picks card, puts amounts in envelopes, shuffles envelopes, gives one to student.
      *   *Gen 2 (The "Base" Deck):* 10 Cards. Each lists a base $2^k$. Dealer picks card, puts $2^k$ in Student Envelope. Flips coin. Heads: Other = $2^{k+1}$. Tails: Other = $2^{k-1}$. (Handle edges by reshuffling if out of bounds, or just accept edge effects for the Threshold lesson).
      *   *Actually, to make Gen 2 clearly reward switching:* The prompt says "only one of them rewards switching."
      *   If Gen 1 is standard pairs, EV(Switch) = 0 (ignoring edges).
      *   If Gen 2 is "I fix your amount, then coin flip the other," EV(Switch) = 0.25 * Your Amount.
      *   This distinction is the key learning moment.

  8.  **Structuring the Debrief:**

      *   Map the data.
      *   Address the Algebra.
      *   Address the "Unknown Generator" (the real philosophical problem).

  9.  **Refining the Materials List:**

      *   20 Decision Sheets.
      *   40 Envelopes (20 pairs).
      *   Token Bank (300 tokens @ €0.10).
      *   Deck A (Pairs).
      *   Deck B (Base + Coin).
      *   Whiteboard for aggregation.

  10. **Final Review against Constraints:**
      *   *No "Two Envelope" name until last 15 mins.* (Check)
      *   *No switching argument until last 15 mins.* (Check - let them write it).
      *   *Budget €30.* (Check - tokens).
      *   *Decision Sheets.* (Check).
      *   *Blind, Peek, Paired, Two Generators, Threshold.* (All included).
      *   *Debrief specifics.* (Included).

  11. **Self-Correction on "Causal" Generator:**
      *   If I tell them "I flipped a coin to determine the other," I am giving away the mechanism.
      *   *Constraint:* "The two should look indistinguishable from the inside."
      *   *Solution:* I (the instructor) run the generator behind a screen or just verbally certify the mechanism without revealing the *outcome* of the generation steps until the end.
      *   *Better:* I announce the *Rule* for the block of rounds.
      *   Block 1: "Rule S: I have prepared pairs. I chose a pair, shuffled them, gave you one."
      *   Block 2: "Rule C: I chose a number for you. I determined the other by a fair coin process."
      *   They don't see the coin. They just trust the rule. The data will reveal the EV difference.
      *   *Wait, if they trust the rule, they know the EV.*
      *   *Correction:* I cannot tell them the rule explicitly if I want them to discover it.
      *   *Revised:* I run 10 rounds of Gen 1. Then 10 rounds of Gen 2. I do *not* tell them the mechanism changed. I just say "We are continuing."
      *   *But how do they distinguish?* They won't, unless the data differs.
      *   *But the prompt says:* "Two different generators... I want the class to feel that difference."
      *   *Okay, I will announce the mechanism change, but not the implication.*
      *   "In this next set, the method I use to fill the envelopes has changed. The rules are on the board. Play proceeds as before."
      *   This allows them to calculate the EV theoretically (if they are sharp) but the *empirical* data confirms it.
      *   *Actually, best pedagogical move:* Don't announce the change. Let the data scream. Then ask: "Did the bank behave differently in Round 11-20?"
      *   *Wait, prompt says:* "In the first, a pair is fixed... in the second, their amount is drawn first..."
      *   I will write the *Procedure* on the board for each block.
      *   Block 1 Procedure: "1. Select Pair Card. 2. Distribute to Envelopes. 3. Shuffle."
      *   Block 2 Procedure: "1. Select Base Card (Your Amount). 2. Flip Coin for Other."
      *   This satisfies "indistinguishable from the inside" (you still just see an amount) but "different generators" (you know the rule).
      *   *Wait, if they know the rule, they know the answer.*
      *   *Philosophy majors:* They might argue the rule doesn't matter, only the observation.
      *   *Economics majors:* They will calculate EV immediately.
      *   *Goal:* "I want the class to feel that difference rather than be told it."
      *   *Compromise:* I will perform the actions visibly but without commentary on the EV.
      *   Block 1: I hold up a deck of "Pair Cards". I draw one. I put numbers in envelopes.
      *   Block 2: I hold up a deck of "Single Cards". I draw one. I put it in *their* envelope. I flip a coin (visible) to determine the *other* envelope.
      *   This makes the causality visible without me lecturing on EV.

  12. **Final Polish of Decision Sheet:**
      *   Needs to force the "Reason" line.
      *   Needs columns for Counterfactual (What if I switched?).

  13. **Final Check on Budget:**
