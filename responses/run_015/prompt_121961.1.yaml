  *   **Domain-Specific Partialism Prediction:** Save the **100 Foreigners**. This falls under the **Emergency Rescue Domain** (immediate physical peril), where the "numbers rule" overrides associative ties, regardless of whether the rescuer is a private citizen or a state agent.

