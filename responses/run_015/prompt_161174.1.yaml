prompt: |-
  I teach a large introductory philosophy course each fall — roughly four hundred students — and I keep the department's shared bank of thought experiments: about sixty cases that my colleagues and our graduate instructors draw on for lectures, discussion sections, and exams. Two or three times a week during term I have to make a call about one of them: whether to put it in front of first-year students who have no theory at all, whether to present it as raising a question or as settling one, and whether it is safe to grade on. The same question comes up in a different register a few times a year when I referee, where what I have to judge is whether a manuscript's case is carrying a conclusion it has not earned.

  My own practice has been a small set of habits I picked up long ago and never systematized: restate the case in flat prose and see whether the verdict survives, look for the word "surely" doing the work of an argument, ask what the case is implicitly being contrasted with. These habits do not compose into anything I can hand to a graduate instructor, and they tell me nothing about the cases where my students divide evenly, or where the division shifts depending on the order in which I present two versions.

  Please turn whatever is defensible in the notion of an intuition pump — the term as Dennett uses it, together with the standing worry that a case can persuade by its framing, its imagery, or the order of its questions rather than by its content — into a procedure my teaching team can actually run on a candidate case, in twenty or thirty minutes, with no training in the methodology literature. I want the questions in the order they should be asked; what would count as a sufficient answer to each; the point at which the procedure stops with a no; and the point at which it returns the decision to a person because the question is one of values, of emphasis, or of what we want the students to notice, rather than one the case can settle. Please also say plainly what such a procedure cannot do. If my three habits do not survive the translation, discard them, but tell me what is wrong with them.

  Three features of the procedure matter to me. First, the cases in the bank are not all doing the same job. Some are meant to elicit a verdict that we then treat as evidence about how a concept works — the way we treat a judgment about whether someone knows, or acted freely, or intended a result. Others are meant only to make a conceptual possibility vivid: to show that a certain combination is not excluded by the concepts alone, without asking anyone to endorse a verdict about it. A third kind does neither and is pure scaffolding — it gets students to see that a distinction is available before we argue about where to draw it. I want the procedure to sort a case by the job it is meant to do before it tests it, and to apply different tests accordingly: the same case can be a poor verdict pump and an excellent possibility pump, and conflating the two is the error I most want to avoid. Second, the procedure has to tell me which cases are safe to put on an exam, where a grader needs a determinate answer, as opposed to which belong only in discussion. Third, it has to have something to say when the verdict is unstable across a room and across order of presentation.

  Please run the finished procedure on the three cases below.

  One. I have opened the unit on free will with this case for fifteen years. A device, implanted without your knowledge, monitors your deliberation and adjusts one parameter — your threshold for acting on a consideration. Whenever your deliberation would have issued in a selfish decision, the device raises the threshold until you decide generously instead; whenever your deliberation would already have issued in generosity, it does nothing at all. Over the following months you act generously again and again; the generous acts flow from your own reasons in the ordinary way; you take pride in them, and you become known among your colleagues as a generous person. Are those acts free, and are you praiseworthy for them? This is the case I would be most reluctant to give up, and that is exactly why I want the procedure applied to it without sympathy.

  Two. A system produces fluent, responsive answers in a natural language over decades of interaction. Internally it consists of a million clerks, each applying a single rule for rewriting one symbol into another, each with no idea what any of it means, connected so that the output of one is the input of the next. Does the system understand what it says? I have always presented this as a possibility pump, not a verdict pump, and I want to know whether that classification is honest.

  Three. The vice-president of a company is told that a new program will, as a side effect, help the environment. He does not care about the environment at all; he approves the program purely for profit, and the environment is helped. In the paired version the side effect is harm rather than help, and he is equally indifferent to it. Did he bring about the side effect intentionally? My students divide on this, and the division moves with which version I present first. Tell me whether the procedure treats this as a usable case, what it says about the instability, and where, if anywhere, it hands the decision back to me.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Philosophy instructor teaching a large intro course (400 students). Manages a bank of 60 thought experiments.
      *   **Problem:** Needs a systematic, teachable procedure for evaluating thought experiments ("intuition pumps") for teaching and grading purposes. Current habits are unsystematic and don't help TAs.
      *   **Goal:** Create a 20-30 minute procedure based on Dennett's "intuition pump" concept (specifically the worry about framing/imagery/order vs. content) that TAs can run without methodology training.
      *   **Requirements:**
          1.  Ordered questions with criteria for sufficient answers.
          2.  Stop points (when to reject a case).
          3.  Hand-off points (when the decision is pedagogical/valuative, not logical).
          4.  Explicit limitations (what the procedure *cannot* do).
          5.  Evaluation of the user's current habits (keep or discard?).
          6.  Differentiation by case type: Verdict Pump (evidence for concepts), Possibility Pump (vivid conceptual space), Scaffolding (distinction making).
          7.  Grading Safety: Distinguish discussion cases from exam cases.
          8.  Instability: Address verdict instability across students/order.
          9.  **Application:** Run the procedure on three specific cases provided (Free Will Device, Chinese Room-style System, Knobe Effect).

  2.  **Deconstruct "Intuition Pump" (Dennett):**

      *   Dennett's view: Thought experiments are tools. Like pumps, they can be leaky, clogged, or rigged. They work by directing attention.
      *   The Worry: They persuade via rhetoric, framing, or salience rather than logical force.
      *   The Fix: "Turn the knobs." Vary the parameters. See if the intuition holds when the framing changes.
      *   Adaptation for Teaching: We need to know if the intuition is *robust* enough for grading or if it's *fragile* (good for discussion) or *misleading* (reject).

  3.  **Evaluate User's Current Habits:**

      *   *Habit 1: Restate in flat prose.* (Good. Removes rhetorical flourish. Keeps.)
      *   *Habit 2: Look for "surely".* (Good. Identifies rhetorical coercion. Keeps, but formalize.)
      *   *Habit 3: Ask what it's contrasted with.* (Crucial. Identifies the "control" case. Keeps.)
      *   *Verdict:* These are actually the core of a robust methodology. They just need to be ordered and expanded to handle the specific pedagogical constraints (grading vs. discussion, case types). I will integrate them rather than discard them, but I will formalize them into steps.

  4.  **Drafting the Procedure (The "Pump Audit"):**

      *   *Time:* 20-30 mins.
      *   *Audience:* TAs/Instructors (no methodology PhD needed).
      *   *Structure:*
          *   Phase 1: Classification (What job is this doing?).
          *   Phase 2: Stress Testing (The "Turn the Knobs" phase).
          *   Phase 3: Pedagogical Safety (Grading vs. Discussion).
          *   Phase 4: Instability Check.
      *   *Stop/Hand-off Criteria:* Need clear "If X, then Stop/Reject" and "If Y, then Instructor Decides."

      *   *Drafting Steps:*
          1.  **Classify:** Verdict, Possibility, or Scaffolding? (Crucial per prompt).
          2.  **Flatten:** Remove rhetoric (User's Habit 1).
          3.  **Contrast:** What is the counter-case? (User's Habit 3).
          4.  **Vary:** Change one detail. Does intuition flip? (Dennett's "Turn the Knobs").
          5.  **Grade Check:** Is there a consensus for grading?

  5.  **Refining the Procedure for Specific Constraints:**

      *   *Constraint:* Differentiate case types.
          *   *Verdict Pump:* Needs robust intuition. If unstable, bad for exams.
          *   *Possibility Pump:* Needs logical coherence, not consensus.
          *   *Scaffolding:* Needs clarity of distinction, not verdict.
      *   *Constraint:* Grading Safety.
          *   If verdict splits 50/50, cannot grade on "the answer." Can grade on "the argument."
      *   *Constraint:* Instability/Order Effects.
          *   If order matters, it's a framing effect. Flag for discussion, not exams.

  6.  **Developing the Limitations Section:**

      *   What can't it do? It can't tell you the *truth*. It can't fix a bad theory. It can't replace instructor judgment on pedagogical goals. It can't resolve genuine philosophical disagreement.

  7.  **Running the Procedure on the Three Cases:**

      *   **Case 1 (Free Will Device):**
          *   *Type:* Verdict Pump (asks "Are acts free?").
          *   *Flatten:* Device manipulates threshold. Acts align with reasons.
          *   *Contrast:* Normal generosity vs. Coerced generosity.
          *   *Vary:* What if the device *lowered* the threshold for selfishness? What if you knew about it?
          *   *Stability:* Likely stable intuition (unfree/manipulated), but philosophically contested (compatibilist vs. incompatibilist).
          *   *Grading:* Risky. Deep theoretical split. Better for discussion.
      *   **Case 2 (Million Clerks/Chinese Room):**
          *   *Type:* User says Possibility Pump.
          *   *Test:* Is it showing a possibility (syntax without semantics) or demanding a verdict (no understanding)?
          *   *Flatten:* Input/Output matches understanding, internal process is symbol manipulation.
          *   *Vary:* What if clerks memorize the rules? What if it's one person?
          *   *Verdict:* If used as Possibility Pump (can syntax exist without semantics?), it's safe. If used as Verdict Pump (therefore no AI understanding), it's controversial.
          *   *Grading:* Safe for "What does this argue?" Unsafe for "Does it understand?" (unless specific theory taught).
      *   **Case 3 (Knobe Effect/VP):**
          *   *Type:* Verdict Pump (Intentionality).
          *   *Instability:* User notes order effects and split.
          *   *Test:* This is the classic Knobe Effect. Moral valence influences intentional ascription.
          *   *Procedure Result:* High instability. Order dependence = Framing effect.
          *   *Grading:* Unsafe for determinate answer. Good for showing moral psychology.
          *   *Hand-off:* Instructor must decide if the *split* is the lesson.

  8.  **Review and Refine:**

      *   *Tone:* Professional, respectful of the instructor's expertise, practical.
      *   *Check:* Did I answer all parts of the prompt?
          *   Procedure in order? Yes.
          *   Sufficient answers? Yes.
          *   Stop/Hand-off points? Yes.
          *   Limitations? Yes.
          *   User's habits evaluated? Yes.
          *   Three cases analyzed? Yes.
          *   Case types distinguished? Yes.
          *   Grading safety addressed? Yes.
          *   Instability addressed? Yes.

      *   *Self-Correction on User's Habits:* The prompt asks: "If my three habits do not survive the translation, discard them, but tell me what is wrong with them."
          *   *Analysis:* They are actually good habits. They correspond to "Flattening," "Rhetoric Check," and "Control Case." I should not discard them but *embed* them. I will explicitly state they survive but need structural support to be teachable.
          *   *Wait, re-reading:* "If my three habits do not survive... discard them." Okay, I will argue they *do* survive but need to be operationalized. I won't discard them, but I will critique their insufficiency (they don't handle order effects or case typing).

      *   *Refining the "Stop" vs. "Hand-off":*
          *   Stop (Reject): Logical incoherence, hidden premises that are false, rhetorical coercion that can't be flattened.
          *   Hand-off (Instructor): Pedagogical value despite instability, theoretical commitment required.

      *   *Refining Case 1:* The "Free Will Device" is essentially a manipulation case (Pereboom-style). The intuition is usually "not free." But compatibilists argue otherwise. The procedure needs to flag this theoretical dependence.
      *   *Refining Case 2:* The "Million Clerks" is Searle's Chinese Room. It's often used as a Verdict Pump ("AI can't think"). The user wants to use it as a Possibility Pump ("Look, syntax isn't semantics"). The procedure must validate if that usage is honest.
      *   *Refining Case 3:* Knobe Effect. The instability *is* the data. The procedure should identify it as "Diagnositic" rather than "Evidentiary."

  9.  **Final Polish:** Ensure the procedure is distinct from the analysis. Use clear headings. Make sure the "20-30 minute" constraint feels realistic (keep steps concise).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Do X." I need to say "Question: X? Sufficient Answer: Y."
      I also need to make sure I address the "Order of Presentation" issue specifically in the procedure.

      *Plan for Procedure Step 4:* "The Order Test." Run the case in reverse or paired with its opposite.

      *Plan for Limitations:* Be honest. This doesn't solve philosophy; it solves *teaching* philosophy.

      *Plan for Habits:* Validate them. They are the seeds of the procedure.

      *Let's write.*
answer: |-
  Here is a procedural audit tool designed for your teaching team, followed by an evaluation of your current habits, a statement of limitations, and the application of the procedure to your three cases.

  ### Part 1: The Pump Audit Procedure
  **Time:** 20–30 Minutes
  **Users:** Graduate Instructors / TAs
  **Goal:** Classify, stress-test, and clear thought experiments for teaching or grading.

  #### Phase 1: Classification (5 Minutes)
  *Before testing the case, identify its job. A case that fails one job may succeed at another.*

  **Q1: What is the explicit question asked of the student?**
  *   **Sufficient Answer:** A clear statement of the target concept (e.g., "Is this knowledge?", "Is this possible?", "What is the distinction here?").
  *   **Stop Point:** If the question is ambiguous or asks two things at once (e.g., "Is he free and responsible?"), the case must be split or rejected.

  **Q2: Which of the three jobs is this case meant to do?**
  *   **Verdict Pump:** Elicits a specific judgment (Yes/No) used as evidence for a theory.
  *   **Possibility Pump:** Makes a conceptual combination vivid (e.g., "Zombies are possible") without demanding agreement on a real-world verdict.
  *   **Scaffolding:** Illustrates a distinction (e.g., "Foreseen vs. Intended") before arguing where the line falls.
  *   **Hand-off Point:** If the team cannot agree on the job, the case goes to the Lead Instructor. Do not proceed until classified.

  #### Phase 2: Flattening and Rhetoric Check (5 Minutes)
  *This operationalizes your habits of "flat prose" and spotting "surely."*

  **Q3: Can the case be rewritten in 50 words without losing the logical constraints?**
  *   **Sufficient Answer:** A dry summary removing imagery, emotional loading, and narrative flair.
  *   **Stop Point:** If the verdict disappears when the story is removed, the case is relying on framing, not logic. Reject for exams; flag for discussion only.

  **Q4: Are there any "coercive markers" (e.g., "surely," "obviously," "intuitively")?**
  *   **Sufficient Answer:** None found, or they are identified and removed in the flat version.
  *   **Stop Point:** If the argument relies on these markers to bridge a logical gap, reject the case.

  #### Phase 3: The Knob-Turning Test (10 Minutes)
  *This addresses Dennett's worry about framing and your concern about order effects.*

  **Q5: What is the Control Case?**
  *   **Sufficient Answer:** A description of the nearest neighbor where the target variable is changed (e.g., if testing "manipulation," the control is "no manipulation").
  *   **Stop Point:** If there is no clear contrast case, the pump has no leverage. Reject.

  **Q6: The Order/Pairing Test.**
  *   **Action:** Present the Control Case and the Target Case in both orders (A-then-B, and B-then-A).
  *   **Sufficient Answer:** The verdict on the Target Case remains stable regardless of order.
  *   **Hand-off Point:** If the verdict flips based on order, the case demonstrates a *framing effect*.
      *   **For Exams:** Reject (unsafe for determinate grading).
      *   **For Discussion:** Accept, but the lesson plan must explicitly address the instability.

  **Q7: The Parameter Shift.**
  *   **Action:** Change one non-essential detail (e.g., gender, setting, specific object).
  *   **Sufficient Answer:** The verdict does not change.
  *   **Stop Point:** If the verdict changes based on irrelevant details, the case is biased. Reject for exams.

  #### Phase 4: Grading Safety (5 Minutes)
  *This addresses the "safe to grade" constraint.*

  **Q8: Is there a "Theory-Neutral" Answer?**
  *   **Sufficient Answer:** Yes, the intuition is shared by laypersons without training (for Verdict Pumps), OR the case is only asking for the *implication* of a specific theory taught in class.
  *   **Hand-off Point:** If the verdict depends on a philosophical theory not yet taught (e.g., Compatibilism vs. Incompatibilism), it is unsafe for a summative exam unless the prompt asks for argumentation rather than a verdict.
  *   **Decision:**
      *   **Stable Verdict + Theory Neutral:** Safe for Exam.
      *   **Unstable Verdict OR Theory Dependent:** Discussion Only.
      *   **Possibility/Scaffolding:** Safe for Exam *if* the question asks "What does this show is possible?" rather than "What is true?"

  ---

  ### Part 2: Evaluation of Your Current Habits

  Your three habits are sound and survive the translation, but they are insufficient on their own for a teaching team.

  1.  **Restate in flat prose:** **Keep.** This is Phase 2, Q3. It isolates logical content from rhetorical persuasion.
      *   *Critique:* On its own, it doesn't tell you *why* a case fails. A case can be flat and still rely on a hidden, false premise.
  2.  **Look for "surely":** **Keep.** This is Phase 2, Q4. It identifies rhetorical coercion.
      *   *Critique:* Sophisticated pumps don't use "surely." They use narrative salience. Your habit misses implicit framing, which the **Order Test (Phase 3, Q6)** catches.
  3.  **Ask what is implicitly contrasted:** **Keep.** This is Phase 3, Q5.
      *   *Critique:* This is your strongest habit. However, without the **Classification (Phase 1)**, a TA might test a Possibility Pump as if it were a Verdict Pump, rejecting a useful case because it doesn't yield a consensus verdict.

  **What was missing:** Your habits lacked a mechanism for **Order Effects** (crucial for your 400-student lectures) and a distinction between **Grading Safety** vs. **Discussion Utility**. The procedure adds these.

  ---

  ### Part 3: Limitations of the Procedure

  Please state this plainly to your team. This procedure **cannot**:
  1.  **Determine Truth:** It tests the *robustness* of an intuition, not whether the intuition is philosophically correct. A case can pass the audit and still support a false theory.
  2.  **Resolve Theoretical Disagreement:** If the philosophical literature is split 50/50 on a case (e.g., Gettier cases), this procedure will flag it as "Unstable," but it cannot tell you which side to teach. That is a curricular decision.
  3.  **Replace Instructor Judgment on Values:** It can tell you a case is "unsafe for grading," but it cannot tell you if the *instability* is pedagogically valuable. That is your decision.
  4.  **Fix Bad Theory:** If the lecture content is confused, a clean thought experiment will not save it.

  ---

  ### Part 4: Application to Your Three Cases

  Here is the audit run on your specific cases.

  #### Case One: The Free Will Device
  *Classification:* **Verdict Pump** (Asks: "Are acts free?").
  *   **Flattening:** Agent acts on reasons. Internal threshold adjusted by external device to ensure generosity. Agent feels pride.
  *   **Control Case:** Normal generosity (no device) vs. Coerced generosity (threats).
  *   **Order/Parameter Test:**
      *   *Vary:* What if the device *lowered* the threshold for selfishness, but the agent resisted?
      *   *Vary:* What if the agent knew about the device?
      *   *Result:* Intuitions here are theoretically loaded. Compatibilists often say "Free" (flows from reasons); Incompatibilists say "Unfree" (source is external).
  *   **Grading Safety:** **UNSAFE.**
      *   *Reason:* The verdict splits along theoretical lines (Compatibilism vs. Incompatibilism) that first-years do not yet possess. A grader cannot mark "Unfree" as correct without privileging one theory.
  *   **Hand-off:** This returns to you.
      *   *Decision:* Keep for **Discussion**. It is an excellent *dialectical* pump. It forces students to choose between "Sourcehood" and "Reasons-Responsiveness."
      *   *Instruction:* Do not ask "Is he free?" on an exam. Ask: "Which condition for free will does this device violate?"

  #### Case Two: The Million Clerks (Chinese Room Variant)
  *Classification:* **Possibility Pump** (As you intended: "Show syntax $\neq$ semantics").
  *   **Flattening:** System passes Turing Test. Internal mechanism is symbol manipulation without semantic understanding by parts.
  *   **Control Case:** A single human who understands the language.
  *   **Order/Parameter Test:**
      *   *Vary:* If the clerks memorize the rules and internalize the process, does understanding emerge?
      *   *Result:* The intuition that "the system doesn't understand" is robust *if* the focus remains on the clerks' ignorance.
  *   **Grading Safety:** **CONDITIONAL.**
      *   *Reason:* If used as a Verdict Pump ("Therefore AI cannot think"), it is unsafe (contested). If used as a Possibility Pump ("Does this show syntax *can* exist without semantics?"), it is safe.
  *   **Hand-off:** Returns to you for framing.
      *   *Decision:* Your classification is **Honest**, provided you do not let it smuggle in the conclusion that *no* system could understand.
      *   *Exam Use:* Safe only if the question is: "What distinction is this case designed to illustrate?" (Answer: Syntax vs. Semantics). Unsafe if: "Does the system understand?" (Answer depends on functionalist vs. biological naturalist commitments).

  #### Case Three: The VP and the Environment (Knobe Effect)
  *Classification:* **Verdict Pump** (Asks: "Did he bring it about intentionally?").
  *   **Flattening:** Agent indifferent to side effect. Side effect is Help (V1) or Harm (V2). Agent pursues profit.
  *   **Control Case:** The paired version (Help vs. Harm).
  *   **Order/Parameter Test:**
      *   *Result:* You have already observed the instability. The verdict shifts based on moral valence (Harm = Intentional; Help = Not Intentional) and presentation order.
      *   *Audit Finding:* **High Framing Effect.** The moral status of the outcome is contaminating the concept of intentionality.
  *   **Grading Safety:** **UNSAFE.**
      *   *Reason:* There is no determinate answer. The "correct" philosophical answer is that the concept is contested or context-sensitive.
  *   **Hand-off:** Returns to you.
      *   *Decision:* This is a **Diagnostic Pump**, not an Evidentiary one.
      *   *Instruction:* Do not use this to *teach* the definition of intentional action. Use it to *test* the students' definition.
      *   *Exam Use:* Only safe if the prompt is: "Explain why students might give different answers to these two versions." If you ask "Was it intentional?", you will have to grade based on argument quality, not verdict.

  ### Summary Recommendation for Your Bank

  1.  **Case 1 (Free Will):** Keep in **Discussion** bank. Remove from **Exam** bank. It is too theoretically loaded for first-years to answer definitively.
  2.  **Case 2 (Clerks):** Keep in **Exam** bank *only* as a Possibility Pump. Ensure exam questions ask what the case *shows is possible*, not what is *true*.
  3.  **Case 3 (VP):** Move to **Advanced Discussion**. The instability is the lesson. If used in a large lecture, present both versions simultaneously to demonstrate the order effect you observed. Do not grade on the verdict.

  **Final Note on Instability:** When the procedure flags instability (like Case 3), do not view this as a failure of the case. In a 400-student course, showing that intuition is fragile is often more valuable than showing that it is robust. The procedure's job is not to eliminate these cases, but to prevent you from grading on them as if they were stable.
