answer: |-
  This is a fantastic problem. You have identified the exact pressure point where the *Bai Ma Lun* (White Horse Dialogue) usually breaks under modern scrutiny: the ambiguity of the copula ("is"). In Classical Chinese, *fei* ("not/is not") does the heavy lifting for identity, predication, and class membership all at once. Gongsun Long slides between them.

  In your kingdom, the law forces a choice. This actually makes the scene *sharper*, not impossible, but it forces your character to shift the ground of the argument from **metaphysics** (what a horse *is*) to **semantics/law** (what a name *does*).

  Here is the breakdown you need to write the scene.

  ### 1. What is she committed to if she wins?

  She is **not** committed to the biological absurdity that the animal in the stall is not an equine. If she argues that, the clerk will laugh her out of the barn.

  She is committed to the claim that **the Name "White Horse" is not the Name "Horse."**

  In your legal code, you have two verbs. Let's label them for clarity:
  *   **Verb A (Satisfaction):** "Answers to the warrant." (Reference/Matching)
  *   **Verb B (Membership):** "Is one of the kind." (Classification/Essence)

  If she wins, she is arguing that **Verb A does not apply**, even if Verb B does.

  *   **The Commitment:** She admits the animal *Is-Kind* (Verb B) a horse. She denies the animal *Is-Match* (Verb A) the warrant for "Horse."
  *   **Why?** Because the warrant "Horse" is **indeterminate** regarding color. The animal "White Horse" is **determinate** regarding color.
  *   **The Logic:** If the warrant "Horse" could seize a "White Horse," then the warrant "Horse" would implicitly include the specification "White." But if it included "White," it could not seize a "Black Horse." Since the warrant "Horse" *can* seize a Black Horse, it does not include "White." Therefore, the warrant "Horse" and the designation "White Horse" have different conditions of satisfaction. Therefore, they are not the same *legal designation*.
  *   **Separation (*Li*):** This is her shield against the "no horses at all" problem. "Separation" means keeping the **Abstract Form** (Horse) distinct from the **Concrete Composite** (White Horse).
      *   *The Clerk's Trap:* "If a white horse isn't a horse, and a black horse isn't a horse, do you have no horses?"
      *   *Her Counter:* "I have horses (Verb B). I do not have *matches* for your warrant (Verb A)."
      *   She is committed to the idea that the Law operates on **Names**, not **Things**. If the Names are distinct (which they are, by the logic of intension), the transfer of property cannot occur.

  **For the Scene:** She must concede the biology to save the law. "The beast is equine, Clerk. But the *Name* is not."

  ### 2. Does the argument survive the "Two Verbs" constraint? (The Pun Problem)

  This is your biggest worry. In Chinese, the ambiguity allows the slide. In your language, the slide is blocked. **Does the argument collapse?**

  **No, but it changes genre.** It stops being a metaphysical trick and becomes a **legalistic technicality.**

  If she is forced to pick a verb for the conclusion "A white horse is not a horse," she **must pick Verb A (Answers to/Matches).**

  *   **If she picks Verb B ("Is one of the kind"):** She is exposed as a punster. The clerk says, "Put your hand on the beast. Is it one of the kind horse?" She says "No." The clerk calls a vet. She loses.
  *   **If she picks Verb A ("Answers to the warrant"):** She has a real argument. "Does this beast answer to the description 'Horse'?" She says, "No, it answers to 'White Horse'."

  **How to make it robust:**
  She needs to argue that in Requisition Law, **Verb B is irrelevant.** The Law only cares about Verb A.
  *   *Argument:* "The Law does not requisition *kinds*; it requisitions *matches*. A key is not a lock, even if it belongs to the lock. 'White Horse' is a specific key. 'Horse' is a master key. You hold a master key warrant. I possess a specific key beast. They do not match."

  **The Strongest Version of Her Position:**
  She argues that **Precision is a Property.**
  *   "Horse" = Shape (Indeterminate Color).
  *   "White Horse" = Shape + Color (Determinate Color).
  *   To accept a "White Horse" for a "Horse" warrant is to **alter the warrant** from Indeterminate to Determinate without authorization.
  *   *Dialogue Beat:* "If I give you this white horse, you have not taken a 'Horse'. You have taken a 'White Horse'. You have changed the Kingdom's ledger. You have requisitioned color I did not owe. That is theft by the Crown."

  **Is she a punster?**
  Only if she tries to use Verb B. If she sticks rigorously to Verb A (Satisfaction/Matching), she is a **legal formalist**. She is arguing that the *intension* of the terms differs, so the *extension* of the warrant cannot cover the animal without violating the precision of the Law.

  ### 3. Bonus: The "No Colorless Horses" Objection

  **The Objection:** "There are no colorless horses in the world. Every horse has a color. If a horse with color is not a horse, there are no horses."

  **Is it good?**
  Empirically: Yes.
  Legally/Metaphysically (in this system): No.

  **Does it depend on the verb?**
  Yes. It attacks Verb B (Membership).
  *   Clerk: "Show me a horse that *Is-Kind* horse but has no color. You cannot. Therefore, all horses have color. Therefore, your distinction is fake."

  **Her Counter (The Gongsun Long Move):**
  She must appeal to the **Abstract Form**.
  *   "The *Name* 'Horse' names the Shape. The Shape has no color. The *Name* 'White Horse' names Shape + Color."
  *   "You are confusing the **Beast** (which must be colored) with the **Designation** (which may be colorless)."
  *   "The Warrant is for the Designation 'Horse'. The Designation 'Horse' does not include Color. My Beast includes Color. Therefore, the Beast exceeds the Warrant."

  **Verdict:** It is a strong pragmatic objection, but she can deflect it by insisting the Law deals in **Definitions**, not **Mud**. "I am not arguing about the mud on the hoof, Clerk. I am arguing about the ink on the warrant."

  ### Scene Strategy: How to Write the Climax

  To make this work dramatically, you need to show the Clerk trying to force her onto Verb B (Reality), and her forcing him back onto Verb A (Law).

  **The Setup:**
  The Clerk wants to avoid a precedent. If she wins, every farmer will claim their "Bay Mare" isn't a "Horse."
  She wants to keep the horse (maybe it's a stud, maybe it's sentimental).

  **The Dialogue Flow:**

  1.  **The Clerk's Trap (Verb B):** "Stop twisting words. Look at the beast. Is it or is it not a horse?" (He uses the Membership verb).
  2.  **Her Concession:** "It *Is-Kind* horse. I do not deny the shape." (She disarms the "no horses" objection).
  3.  **Her Pivot (Verb A):** "But the Warrant does not ask what kind it *Is*. It asks what it *Matches*."
  4.  **The Logic Drop:** "If 'Horse' meant 'White Horse', you could not take a black one. If you can take a black one, 'Horse' does not mean 'White Horse'. Since 'Horse' does not mean 'White Horse', a White Horse does not *Match* the warrant for 'Horse'."
  5.  **The Stakes:** "If you take this beast, you are not enforcing the Law. You are rewriting it. You are saying 'Horse' means 'White Horse'. Tomorrow, does 'Grain' mean 'Wheat'? Do I owe you wheat when I have oats?"
  6.  **The Separation:** "Separate the Name from the Beast. The Beast is yours to count. The Name is mine to keep."

  **The "Get Out of Jail" Card:**
  You asked if "Separation" saves her from the "no horses" problem.
  **Yes.** Separation allows her to say: "There are Horses (Abstract/Kind). There are White Horses (Concrete/Composite). They are Separate. You asked for the Abstract. I hold the Concrete. They do not Match."

  **Final Advice:**
  Don't let her win by confusing the Clerk. Let her win by **out-formalizing** him. The Clerk represents pragmatic power ("I have the soldiers"). She represents rigid legal logic ("I have the Code"). The tragedy/beauty of the scene is that she is logically right, but the Clerk might take the horse anyway—or he leaves, unsettled, knowing the Law has a hole he can't patch.

  If you force her to choose the verb, have her choose **"Answers to" (Satisfaction)**. It turns the argument from "This isn't a horse" (False) to "This isn't what you asked for" (Debatable, but defensible). That is where the real drama lives.
