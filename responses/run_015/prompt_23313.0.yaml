answer: |-
  The bottle of Cabernet was empty, but neither of them moved to open another. The study was lit only by the green glow of the monitor and a small desk lamp that cast long, jagged shadows across the stacks of papers. On the rug, Julian's cat, Schrödinger, was asleep, a fuzzy lump of calico fur.

  Julian leaned back, rubbing his temples. "You're making it sound like I'm claiming magic happens when atoms touch. I'm not. I'm claiming nothing happens. That's the beauty of Universalism. Composition is identity. It's automatic."

  Elena swirled the dregs of wine in her glass. "Nothing happens? Julian, look at the cat. Actually, don't look at the *cat*. Look at the atoms. There are atoms on the boundary of that fur. Some are loosely attached. Some are shedding. If I take the collection of atoms *including* the shedding hair, that's one object. If I take the collection *excluding* it, that's another. There are millions of such collections."

  "The Problem of the Many," Julian said, waving a hand. "I know it."

  "It destroys you," Elena said, her voice quiet but sharp. "If composition is restricted—if there are actual *objects* like cats—then one of those collections must be *the* cat. But there is no fact of the matter which one it is. The boundaries are vague. Reality isn't vague. Therefore, there is no cat. There are only simples arranged cat-wise."

  Julian sat up. "You're assuming that for 'the cat' to exist, it must be unique. You're assuming a one-to-one mapping between our concept 'cat' and the ontology. Why?"

  "Because if there are a million overlapping cat-candidates in that spot," Elena said, tapping the table, "and you say they all exist, you've lost the world. You've replaced the single cat I see with a cloud of coincident entities. It's ontological profligacy. It makes a mockery of counting."

  "It makes counting context-sensitive," Julian corrected. "That's not a bug; it's a feature. Look, Elena, you're a Nihilist. You say only the simples exist. But when you sit in that chair, you don't act like it's a cloud of simples. You act like it's a chair. Why privilege the simples? Why is the 'simple' the only legitimate unit of being?"

  "Because simples have sharp boundaries," Elena said. "An electron is an electron. It doesn't vaguely merge with its neighbor. Vagueness is a feature of language, not the world. When I say 'cat,' my term is vague. But if the world contained a cat-object, that object would have to have precise boundaries. Since the physical distribution of matter doesn't provide a precise cutoff for 'cat,' the object 'cat' cannot exist. The Problem of the Many proves that composite objects are incoherent."

  Julian poured water into his wine glass. "Or, it proves that there are *many* objects there, each with precise boundaries. Candidate A includes the shedding hair. Candidate B excludes it. Both exist. Both are material objects. Universalism accepts the logic of the situation. If you have parts, you have a whole. The 'many' isn't a problem; it's a description of reality."

  "But which one is the cat?" Elena pressed. "If I say 'Schrödinger is hungry,' which object am I talking about? If there are a million candidates, and only one can be hungry (or rather, only one has the biological state of hunger), then my statement is almost certainly false. It's a lottery. We don't live in a lottery. We live in a world where we feed the cat."

  "We feed the region of spacetime occupied by all the candidates," Julian said. "Look, you're hung up on reference. You think because the word 'cat' is vague, the ontology must be crisp to match it. I'm saying the ontology is crisp—infinitely crisp, in fact—and the word is just a blunt instrument we use to grab a cluster of those objects."

  Elena sighed, leaning her chin on her hand. "This is where I think you're engaging in verbal magic. You say 'exists.' I say 'exists.' We mean different things. When I say 'there are no chairs,' I mean there are no fundamental entities corresponding to the concept 'chair.' When you say 'there are chairs,' you mean 'there is a fusion of simples that corresponds to the concept chair.' We agree on the physics. We agree on the arrangement of particles. We disagree on whether the word 'exists' applies to the arrangement."

  "It's not just the word," Julian insisted. "It's the quantificational logic. If I say 'there is something in the box,' and I put two atoms in the box, you say 'no, there are two things in the box.' I say 'there are three.' That's a substantive disagreement. If the box burns, does the fusion burn? Yes. If the fusion has mass, is it the sum of the parts? Yes. It behaves like an object. Why deny it?"

  "Because it adds nothing to the explanation," Elena countered. "If I explain the burning by referencing the atoms and their energetic states, I have accounted for everything. Positing a 'fusion' is a shadow. It does no work. And the Problem of the Many shows that if you insist these shadows are real, you get absurdity. You have to say that right now, on this rug, there are a million distinct entities, all weighing roughly the same, all occupying the same space, all 'cats.' That violates the spirit of identity. If $x$ and $y$ share all properties, $x$ is $y$. But your candidates share almost all properties, yet are distinct. It's a metaphysical monstrosity."

  Julian smiled tiredly. "They don't share *all* properties. Candidate A has the shedding hair as a part. Candidate B does not. They are numerically distinct. It's not a monstrosity; it's just density. You're worried about crowding. But objects don't crowd unless they compete for space. These objects *share* space. They overlap."

  "It feels like you're solving the Problem of the Many by accepting the many and calling it a day," Elena said. "But you haven't solved the vagueness. You've just reified it. And my point is, vagueness shouldn't be in the world. So, I cut the knot. No composition. No vague objects. Just simples."

  "And I think you're cutting the knot by burning the rope," Julian said. "You eliminate the macroscopic world. You're an eliminativist about tables, cats, people. You're telling me *you* don't exist, Elena. You're just simples arranged Elena-wise."

  Elena paused. She looked at her hand, flexing her fingers. "I exist. But 'Elena' is a convenient designation for a specific causal pattern of simples. I'm not denying the pattern. I'm denying that the pattern constitutes a *further thing* over and above the parts."

  "But the pattern *is* the thing," Julian said. "If you have the parts arranged that way, the thing is there. You can't have the parts without the whole. That's the necessity of composition."

  "Is it necessary?" Elena asked softly. "Or is it a rule we impose? Think about the substantive core here, Julian. If we strip away the quantifiers... do you believe there is a fundamental fact of the matter that *this* fusion is an object, independent of human interest? Or do you believe it's an object because our logic allows us to quantify over it?"

  "Independent," Julian said immediately. "If humans vanished, the fusion of the moon and this wine glass would still exist. It wouldn't be named. It wouldn't be useful. But it would be there."

  "See, that's where I can't follow you," Elena said. "Without an agent to carve, there is no carving. There is just being. The 'fusion' is a carve. The 'simple' is a brute fact. The Problem of the Many highlights that the carve has no natural stopping point. If there's no natural stopping point, the carve is arbitrary. If it's arbitrary, it's not ontology. It's cartography."

  Julian leaned forward, resting his elbows on the scattered papers. "So you think ontology is about the bedrock. The fundamental."

  "I think ontology is about what is *there*, fundamentally," she said. "If you say everything is there, then 'there' loses its meaning. If the fusion of my left ear and the Andromeda galaxy exists in the same sense that my ear exists, then 'existence' is trivial. It's cheap."

  "Existence *should* be cheap," Julian argued. "Truth is expensive. To say *true things* about that fusion is hard. To say it *exists* is easy. You're conflating existence with significance."

  Elena was silent for a long moment. The hum of the refrigerator seemed to grow louder. She looked at the cat, who twitched in its sleep.

  "Maybe," she said finally. "Maybe we are arguing about how we carve. I want the carving to match the joints of nature. You want the carving to be exhaustive, regardless of the joints."

  "I want the logic to hold," Julian said. "If 'there are atoms' is true, and logic is universal, then 'there is a fusion of atoms' must be true. To deny it requires a restriction on composition. And every restriction on composition is arbitrary. Why here? Why not there? Vagueness creeps in the moment you try to restrict. I'd rather have a million cats than a vague boundary for one."

  "And I'd rather have no cats than a million ghosts," Elena replied. She reached for the bottle, remembered it was empty, and set it down. "But here's the worry. If you accept the million cats... do you accept the million *Elenas*? There are collections of atoms that are almost me, but missing a few skin cells. Are they all conscious? Do they all feel this fatigue?"

  Julian hesitated. This was the ethical wedge, the one that made Universalism feel visceral. "If consciousness supervenes on physical structure... then yes. There are many conscious beings sitting in your chair. They are almost entirely overlapping. They share most of their mental states."

  "That," Elena said, pointing a finger at him, "is where the Problem of the Many stops being a puzzle and starts being a horror. You've populated the universe with near-duplicates. And for what? To save a logical principle?"

  "To save the principle that reality doesn't stop where our concepts get fuzzy," Julian said.

  Elena leaned back, closing her eyes. "We agree on the physics. We agree on the logic, mostly. We disagree on whether 'object' is a natural kind or a logical constant."

  "I think 'object' is a logical constant," Julian said. "Like 'or' or 'not'."

  "I think 'object' is a tool," Elena said. "And you're trying to build a house with a hammer that never stops swinging."

  She opened her eyes and looked at him. There was no anger there, just the deep, familiar exhaustion of two people who see the world through different lenses and know neither can be ground to fit the other.

  "Pass the water," she said.

  Julian slid the pitcher across the desk. "So. Tomorrow. Are we teaching the SCQ?"

  "Yes," Elena said, pouring. "I'll teach the Nihilist argument. You teach Universalism."

  "Will you tell them I'm wrong?"

  "I'll tell them I'm right," she said, a faint smile touching her lips. "They can decide if that means you're wrong."

  Julian chuckled, looking down at the sleeping cat. "There are a lot of them, you know. On that rug."

  "Don't start," Elena warned, though she didn't look away from the cat. "Just... don't start."
