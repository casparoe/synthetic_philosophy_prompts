answer: |-
  The kettle clicked off. Steam curled against the dark window. Neither of them moved to pour.

  "It's not bad for me," Miriam said. She was drying a plate that was already dry. "There is no time at which I am dead and I am me. So nothing happens to me."

  "Don't do logic," Ada said. She was leaning against the counter, arms crossed. "You're talking about vanishing. I'm talking about stopping."

  "When I was dead before I was born, was it bad?"

  "That's not the same."

  "Why? The stretch is identical. Infinite quiet on both sides."

  "Because projects point forward," Ada said. "The time before birth doesn't cut anything short. This does. You're in the middle of sentences."

  "The dying is bad," Miriam said. She put the plate down. "The fear is bad. Leaving you is bad. I concede all of that. But the being dead? That's zero. You can't suffer a zero."

  "It's not about suffering. It's about structure." Ada pushed off the counter. "Take two lives. Same length. Same amount of joy, same amount of pain. Just arranged differently. One starts high, gets thin at the end. The other starts thin, swells at the end. Now cut both off at sixty-one."

  "The loss is the same," Miriam said. "The slab you didn't get is the same size."

  "No. The bridge is different." Ada's hands moved, tracing lines in the air. "A bridge that stops mid-span is a different object from one that stops at the abutment, even with the same tonnage of steel. In the second life, the death lands in the middle of an ascent. The life is a worse shape at the point where it stops. Your accounting can't see the shape. It only weighs the steel."

  Miriam leaned back against the sink. "So a long decline makes death a mercy? It improves the whole?"

  "It prevents the shape from ruining itself."

  "That's a hell of a thing to say to your mother."

  "It's engineering." Ada stepped closer. "And it's not just the future. It's the past. A joke is worse if the punchline never comes. The setup isn't just neutral waiting; it's promise. If you die now, you make the last ten years worse. You turn them into a setup without a payoff. The harm lands there. On the you that was alive then."

  "Now we're double-counting," Miriam said. "You're confusing changing how you rate a whole with something happening to a part. Those years were good when I lived them. You want to tax them again because of what happens later. That's not harm, Ada. That's just editing the caption."

  "It changes what they *were*."

  "It changes what they *mean*. There's a difference. If I stub my toe today, it hurts today. You're saying it hurts today because I won't be here to laugh about it next year. That's not physics. That's nostalgia."

  "It's narrative."

  "It's ghost-hunting." Miriam picked up the kettle. Poured water down the sink. "You want the harm to be real, so you need a subject. So you reach back into the past and poke the ghost of who I was. But she's gone. She had her day. She didn't feel this loss then."

  "Then who loses?"

  "The living. You."

  "No. You." Ada held her ground. "We disagree about whether a life is a container or a story."

  Miriam turned off the tap. "I disagree that you can harm a closed book by burning the cover."

  "You're the one pretending the book is finished."

  Miriam looked at the sink. "Well. At least I don't have to write the ending. You'll have to live with the typo."

  ***

  **Notes**

  1.  **Missed Replies:** Miriam could have pressed harder on the "narrative fallacy"—that stories are for readers, not livers. Ada could have challenged the subject problem more aggressively: if the past is fixed, how can it be *harmed* rather than just *revalued*?
  2.  **The Arc Point:** It doesn't collapse into standard counting. Standard Deprivationism counts lost *goods*. Your argument is the "Narrative View" of well-being: the order and shape of goods matter independently of their sum. It's distinct, provided you maintain that shape isn't just another kind of good.
  3.  **Setup Clarity:** The "two lives" thought experiment is slightly muddled. If total good is identical, standard counting says the loss is identical. Your point is that standard counting is *wrong*. Make sure Ada frames this as an attack on the counting method itself, not just an emotional observation. The "retroactive harm" is the philosophically weakest link (the past is fixed), but dramatically the strongest. Keep it there, but know it's the vulnerable flank.
