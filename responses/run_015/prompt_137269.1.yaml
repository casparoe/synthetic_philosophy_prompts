answer: |-
  **Essay Question (25 marks, 45 minutes)**

  A local authority uses family school rankings to infer values (attainment, proximity) for capacity planning. An algorithm suggests schools based on similar families' past choices. Families know rankings affect admission chances.

  (a) Explain why the Weak Axiom of Revealed Preference (WARP) fails to guarantee a fixed underlying ordering here, even if choices are internally consistent. Focus on the generation of the menu and the nature of the choice. (10 marks)

  (b) Distinguish between the utility function representing these choices, the welfare relevant to the family, and the signal required for policy. Why might they diverge in this specific institutional context? (10 marks)

  (c) A critic argues: "Choices are the only observable data; policy must use them regardless." Refute this by proposing a specific experimental test on the suggestion algorithm that diagnoses the inference problem. (5 marks)

  ***

  **Model Answer**

  (a) WARP assumes choices are made from fixed, exogenous budget sets. Here, the menu is endogenous: the algorithm constructs suggestions based on aggregate past choices, creating a feedback loop. Furthermore, the "choice" is not a direct selection but a strategic report within a mechanism. A parent may prefer School A but rank School B higher because the algorithm signals B is attainable while A is not. Consistency in ranking reflects optimization of admission probability under constraints, not a fixed preference ordering over schools. The axiom fails because the available options and their probabilities are functions of the reporting behaviour itself.

  (b) Three distinct utilities are at play. First, *choice utility* maximizes the expected value of placement (quality × probability). Second, *welfare utility* measures the child's actual well-being at the assigned school. Third, *policy utility* seeks an accurate signal of aggregate demand for school features. These diverge because choice utility incorporates beliefs about scarcity and algorithmic bias. If the algorithm suggests lower-quality schools, parents rank them higher to avoid unemployment, signaling false value for low quality to the policy maker. Thus, the choice utility reflects constraint management, not intrinsic valuation, making it a poor proxy for welfare or genuine demand.

  (c) The critic confuses data availability with validity; using contaminated data guarantees false inference. To diagnose this, the authority should run a randomized control trial where the "suggested" list is varied independently of family history for a subset of applicants. If rankings shift significantly based solely on the suggestion list (the nudge), the data reflects algorithmic framing rather than intrinsic value. Policy should rely on the residual variance after controlling for the suggestion effect, not the raw rankings. Choices are only valid evidence when the choice set is independent of the choice.

  ***

  **Marking Scheme**

  1.  **Menu Endogeneity (5 marks):** Must identify that the choice set is generated by prior aggregate choices (algorithmic feedback).
      *   *Common Error:* Treats the list of schools as a fixed budget set independent of behaviour.
  2.  **Strategic Reporting (5 marks):** Must identify that rankings are strategies to maximize admission probability, not direct selections.
      *   *Common Error:* Assumes ranking order equals true preference order.
  3.  **Utility Distinction (5 marks):** Must clearly separate choice utility, welfare utility, and policy signal.
      *   *Common Error:* Conflates revealed preference with welfare without qualification.
  4.  **Mechanism of Divergence (5 marks):** Must explain *why* they diverge (beliefs about scarcity/algorithmic bias distorting the signal).
      *   *Common Error:* Vague hand-waving about "external factors" without linking to the mechanism.
  5.  **Diagnostic Test (5 marks):** Must propose randomizing the suggestion list to isolate the nudge effect.
      *   *Common Error:* Offers no empirical test or suggests merely asking parents.

  **A/B Boundary:** A-grade answers explicitly link the algorithmic feedback loop to the failure of WARP and propose the randomization test to isolate variables. B-grade answers typically identify strategic behaviour but treat the menu as fixed or fail to distinguish the three utility concepts precisely.
