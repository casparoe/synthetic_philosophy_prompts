  **The Scenario**

  Arthur works at Greenwood Grocers, a worker-owned co-op where members verbally endorse a mutual-aid pact to cover shifts during personal crises, though the agreement carries no legal weight. When Beatrice's child is hospitalised, she calls Arthur, the only senior staff member available, to cover her weekend shift. Doing so requires Arthur to miss the final signing for his home mortgage, a once-off appointment that, if skipped, collapses his purchase and forfeits his substantial deposit. The pact lacks enforcement mechanisms, relying solely on solidarity, and the co-op faces no ruin if the shift remains uncovered, though Beatrice would suffer significant stress. Arthur stands alone in the stockroom, phone in hand, weighing the forfeiture of his deposit against the solidarity pledge he verbally endorsed upon joining.

  **Analysis of Verdicts**

  For the Kantian, the act is obligatory becuase the voluntary pact narrows the latitude inherent in imperfect duties. By joining the co-op, Arthur adopted a specific maxim of mutual support, meaning he cannot universally will a rule where members opt out when costs arise; to refuse is to contradict the very end he committed to, treating Beatrice merely as a means. Conversely, the supererogationist argues the cost is disproportionate to the informal commitment; morality demands sacrifice only up to a point, and forfeiting a home deposit exceeds the duty owed under a non-binding pact, making coverage praiseworthy but not required. The structural feature doing the work is the voluntary pact, which the Kantian sees as binding the will while the supererogationist views as aspirational. If you remove the pact, the Kantian case collapses into general beneficence where latitude is wider, allowing Arthur to prioritise his own projects without contradiction. Finally, the Kantian would attack the supererogationist view as a disguise for weakness, arguing that labelling such acts 'beyond duty' creates a loophole that undermines the rational consistency required by moral commitment.
