answer: |-
  This is a sharp reconstruction of the **Absent-Minded Driver Paradox** (Piccione & Rubinstein, 1997). You've correctly identified that the tension isn't just about the math (the credences), but about the normative structure of decision theory itself. Your TA likely went quiet because you've walked straight into one of the few places where standard Expected Utility Theory (EUT) bites its own tail.

  You want to keep (1) (maximizing EU) and save your grandmother from being a "rock." To do that, you need to cut the argument at **(2)** and **(7)**.

  Here is the diagnosis of why those steps look innocent, why they fail in this context, and what rejecting them costs you.

  ### The Primary Cut: Reject Premise (2)

  > **(2) A plan is rationally adoptable by an agent only if she'll still find it rational to carry out at every point where she has to carry it out...**

  This principle is known as **Dynamic Consistency**. It sounds undeniable: *Why would you adopt a plan you know you'll abandon?* In standard decision trees with perfect recall, this is a theorem, not an axiom. If a plan is optimal ex-ante, it will look optimal at every node along the path.

  **Why it fails here:**
  In cases of **imperfect recall**, ex-ante optimality and interim (local) optimality can diverge.
  *   **Ex-Ante:** The optimal strategy for Marta is a **mixed strategy**. She should decide *before leaving the house* to turn with probability $p \approx 1/3$ and go straight with $p \approx 2/3$. This yields an expected value of $\approx 2.67$.
  *   **Interim (at the node):** If Marta arrives at an intersection and calculates EU using naive credences (1/2 chance I'm at Turn 1, 1/2 at Turn 2), "Turn" looks like it has an EV of 4, and "Straight" looks like 2.

  If you enforce (2), you force Marta to follow the local signal (Turn). But if she follows the local signal at *every* intersection (because they look identical), she executes "Always Turn." As you noted in your setup, "Always Turn" yields a payoff of 0 (she turns at the first construction site).
  So, (2) forces her to adopt a plan (Always Turn) that is **dominated** by another plan she could have committed to (Mixed Strategy).

  A normative theory that forces an agent to choose a dominated strategy is broken. Therefore, (2) must go. Rationality in imperfect recall contexts is defined by **Ex-Ante Optimization**, not Interim Optimization. A plan is rational if it maximizes utility from the start, even if the "self" at the node, looking through the fog of amnesia, feels tempted to deviate.

  **The Cost:**
  You have to accept that "Rationality at a moment" does not mean "Maximize EU based on the immediate snapshot." It means "Execute the policy that was optimal from the start." This requires a shift in agency: the unit of rationality is the **policy**, not the **action**. Marta isn't irrational for turning when the local math says 4 > 2; she is irrational if she fails to bind herself to the $p=1/3$ mixing rule before she started driving.

  ### The Secondary Cut: Reject Premise (7)

  > **(7) Whenever an agent ends up with less than she could have had, the shortfall traces to a failure to discriminate...**

  This step conflates **constraints** with **irrationality**.

  **Why it fails:**
  The gap between Marta (max EV $\approx 2.67$) and her Wide-Awake Twin (EV = 8) is not a measure of Marta's reasoning failure. It is the **Value of Information**.
  *   The Twin has a larger action space (she can condition her action on the node identity).
  *   Marta has a constrained action space (she must choose the same action at both nodes).

  Optimizing over a constrained space yields a lower maximum than optimizing over an unconstrained space. That shortfall is a feature of the **world** (the road design, her biology), not the **agent's rationality**.

  **The Cost:**
  You must abandon the idea that a "fully rational agent" achieves the global maximum of all possible worlds. A fully rational agent achieves the maximum of all *accessible* worlds. This saves your grandmother immediately.

  ### Saving the Grandmother (and Premise 1)

  You wanted to keep (1): *What an agent rationally does at a moment is whatever maximizes her expected utility given the information she has at that moment.*

  You can keep this, but you must interpret "information she has" to include **her ex-ante commitment**.
  *   **Grandmother Case:** She doesn't know if she took the pill. She assigns a probability based on her habit. She calculates the EU of "Take" vs. "Don't Take" given the risk of double-dosing vs. skipping. She acts. She is rational. The risk of a bad outcome (double dose) is not irrationality; it's the cost of her memory constraint.
  *   **Marta Case:** At the intersection, her "information" isn't just "I see a road." It is "I am an agent who pre-committed to a $p=1/3$ turning policy." If she randomizes accordingly, she is maximizing EU given her *total* information (including her own policy).

  The paradox arises only if you assume her "information at the moment" excludes the plan she made when she was wide awake. If you include the plan in the information set, (1) holds, (2) falls, and (7) falls.

  ### Why the "Credence" Objection Matters (Even if you don't want it to)

  You mentioned you'd rather not take the "credence depends on the plan" exit. I respect that, but it's the mechanism that makes rejecting (2) palatable.

  If Marta plans to mix ($p=1/3$), her credence that she is at the second intersection is **not 1/2**. It is derived from the strategy. (If she always went straight, she'd be at the second intersection with probability 1. If she always turned, she'd be at the first with probability 1).
  *   If she uses the **correct** credences (derived from her optimal plan), the local calculation at the node *aligns* with the ex-ante plan.
  *   The conflict you found (Turn=4 vs Straight=2) only exists if she uses **naive** credences (1/2) that ignore her own agency.

  So, the argument doesn't prove humans are rocks. It proves that humans with imperfect recall cannot use naive credences if they want to remain dynamically consistent. They must update their self-locating beliefs based on their own strategy.

  ### Summary of the Verdict

  1.  **Reject (2):** Dynamic consistency is not a requirement for rationality in imperfect recall games. Ex-ante optimality is the sovereign standard.
  2.  **Reject (7):** A shortfall in utility compared to a better-informed agent is a cost of constraints, not a mark of irrationality.
  3.  **Keep (1):** But interpret "information" to include the agent's own pre-commitments and policies.
  4.  **Save the Grandmother:** She is rational because she optimizes under constraint. She is not a rock; she is a bounded optimizer.
  5.  **Save the Theory:** EUT remains normative, but it applies to **policies** (strategies) rather than isolated **actions** when recall is imperfect.

  Your argument is a valid *reductio*, but not of Expected Utility Theory. It is a *reductio* of the claim that **local optimality** is the definition of rational choice. The TA wasn't much help because admitting this requires untangling the difference between "choosing an action" and "choosing a rule for action," which is the exact knot the seminar is probably trying to untie. You didn't break the theory; you just found the edge case where the definition of "choice" has to expand.
