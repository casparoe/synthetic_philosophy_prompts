  To the Acquisitions Panel,

  You have asked for clarity on the principles guiding your past five decisions to illuminate the path for the March case. Below is an analysis of your precedents, predictions for the children's home records, and a test case to sharpen your framework.

  **Two Rules Fit Your Past Five Decisions**

  Looking at your history, two distinct principles emerge that consistently explain your actions without contradiction.

  **1. The Institutional Provenance Rule**
  You acquire records generated by an entity in the course of its function, but reject private papers unless they offer unique public value.
  *   **Fits:** You accepted the Commissioner (1), Tenants' Association (3), and Hospital (5) because they were institutional or collective bodies. You rejected the Department Store family (2) and Crime Reporter (4) because they were private or commercial papers lacking unique public necessity.
  *   **March Prediction:** **Accept.** The children's home records are institutional (religious order), fitting the pattern of decisions 1, 3, and 5.

  **2. The Mitigable Harm Rule**
  You acquire sensitive material provided the risk can be contained by time, process, or status; you reject only where harm is unmanageable or the material is redundant.
  *   **Fits:** You accepted the flogging register (1) because historical distance mitigated harm; the tapes (3) because a takedown form mitigated consent issues; and the hospital records (5) because sealing mitigated privacy breaches. You rejected the store ledgers (2) as redundant and the reporter's notes (4) because the privacy breach was immediate and uncontainable.
  *   **March Prediction:** **Accept with Restrictions.** The harm is sensitive, but like the hospital records, it can be mitigated by sealing the files and accepting scans only.

  **Best Guess and Closest Analogue**

  My best guess is that you will **accept the records, but seal them for thirty years and take only digital copies.**

  The closest analogue is **Decision 5 (the Psychiatric Hospital)**. Both cases involve institutional care, vulnerable named individuals, and medical or behavioural data. In Decision 5, you were split but ultimately chose preservation with restriction. The March case is ethically hotter, but the mechanism for handling it is identical: acknowledge the value of the record while delaying access to protect the living. The "scans only" condition is a compromise you will likely accept to secure the intellectual content without the custodial liability of the originals.

  **The Principle You Are Committing To**

  If you accept, you commit to the principle that **the archive's duty to preserve uncomfortable institutional truth outweighs the immediate privacy preferences of survivors,** provided access is delayed. You are prioritising the long-term historical record over short-term individual agency.

  If you decline (in favour of the community archive), you commit to the principle that **stewardship belongs to the affected community when trust is fractured.** You would be acknowledging that your institution lacks the vocabulary or the trust to handle this memory safely, effectively ceding authority to the survivors.

  **A Hypothetical Case to Separate the Rules**

  Your two rules (Institutional Provenance and Mitigable Harm) currently march in lockstep. To separate them, consider this case:

  *The private diary of a local GP (1950–1970), detailing patient treatments and personal judgments on their morality. The GP's heirs offer it. It is highly sensitive but historically unique.*

  *   **Under the Institutional Provenance Rule:** You **Reject**. This is a private paper, not an institutional record (like the Reporter or Dept Store).
  *   **Under the Mitigable Harm Rule:** You **Accept**. The harm is sensitive but manageable via sealing (like the Hospital or Commissioner).

  Putting this to your panel will reveal whether you value the *source* of the record or the *manageability of its risk* more highly.

  **On Second-Order Silence**

  You asked whether your concern about cataloguing vocabulary ("second-order silence") does real work or merely moves the problem. It does real work. It shifts the ethical burden from *acquisition* to *description*.

  If you accept the children's home records but catalogue them using institutional terms (e.g., "Misconduct Book" rather than "Abuse Log"), you have preserved the data but silenced the search. A survivor searching for their trauma will not find it, rendering the accession ethically hollow. This distinction argues strongly for the **Community Archive** option. They will use the survivors' vocabulary. If you keep the records, you must commit to community-led cataloguing as a condition of access. Otherwise, you are not ending the silence; you are merely digitising it.

  **Recommendation**

  Given the "one accession" constraint and the offer from the survivors' association, the most ethically robust decision is to **decline**, facilitating the transfer to the community archive. This respects the Community Veto implicit in Decision 3 (where community voice was paramount) and avoids the Second-Order Silence trap your institution is prone to. However, if you feel a statutory duty to collect institutional records, you must accept them only on the condition that survivors co-author the catalogue descriptions. Without that, you are collecting paper, not memory.
