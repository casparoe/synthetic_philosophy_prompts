      *   *Why:* If she says "No weight," she's an *Empathy/Evocation* theorist (Rule B). If she says "Yes weight," she's a *Functionalist* theorist (Rule A).
      *   *Wait, one more:* The "Malicious Compliance" case. An NPC that is functionally simple (Goomba) but the game *tells you* it has a family and loves its mother. (Paper Mario style). Elena gave Goomba "No." If narrative framing alone changes it, that's key.

      *   *Decision:* The best test case is one that separates **Functional Complexity** from **Human-Like Presentation**.
