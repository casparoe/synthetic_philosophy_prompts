      *   *Section 2: Does Individual Agreement Fix the Stacking?* Yes, in a way. If the rule is "We help in emergencies," no single person can reasonably say "I reject this rule" because the risk of being the sick one is real, and the cost to them is low. This is the "Veil of Ignorance" angle too (Rawls).
      *   *Section 3: The "Half Surgery" Problem.* This changes the weight of the complaint. If the money doesn't save the life, the sick student's gain is small. Now 180 disappointments *might* outweigh a small health improvement. This is about *marginal utility*.
      *   *Section 4: The "Actual Rule" (Synthesis).* There isn't one universal law, but here are the tested frameworks:
          1.  **Severity Trumps Numbers:** Life > Leisure, regardless of headcount.
