prompt: |-
  Take this as a role: you're a very senior philosopher of mind who also spent a good chunk of your career sitting in on systems-neuroscience lab meetings, and you've watched a lot of junior speakers walk into a Q&A and get quietly dismantled. Do some brainstorming before you start writing, and be concrete — I want the actual sentences I'm going to hear spoken at me, in that person's idiom, not a neat taxonomy of positions.

  Situation: I'm a fifth-year PhD student (my advisor is sympathetic, basically nobody else is) and in three weeks I'm giving a twenty-five minute talk with twenty minutes of questions in a consciousness-science seminar series, not a philosophy department. The room is about ten people: two systems neuroscientists who work on how the brain binds features into objects and who think binding is basically a story about oscillatory synchrony and that the hard problem is a pseudo-problem; a neurologist who works on disorders of consciousness and knows the callosotomy and hemispherectomy literature cold and will produce a patient at the drop of a hat; a vision psychophysicist who mostly wants to know what any of this would predict; and two philosophers, one of whom is an illusionist of the polite-and-lethal variety and one of whom is agnostic about literally everything and has read a little Russellian monism and will want to know whether I'm just that with worse manners. I am not going to spend any time arguing for panpsychism in general — the abstract promised a solution to the combination problem and that's what they showed up for.

  Here's the view, quickly, so you have something to aim at. I say experiences are had by processes rather than by things at instants: call the basic experiential item a 'thread'. A micro-process — a bit of ongoing neural activity, or whatever the basic ones turn out to be — has a thin, proto-phenomenal thread in the panexperientialist sense. Two threads become one thread when they get recruited into a single process with a single career, where having a single career means their later phases mutually depend on one another: the future of each is partly constituted by the future of the other. I've been calling this 'entangled careers' and I know it sounds like a management consultancy term, so if you have a better name tell me. The point is that a room full of particles doesn't combine, because there is no process whose career they're jointly phases of, while a bunch of neural processes do combine, because their futures are hooked together — and I want to cash out 'hooked together' using the neuroscientists' own vocabulary about dynamical integration rather than inventing a new glue. So I'm claiming to have swapped the spooky question (what fuses many subjects into one?) for a merely hard one (what makes a process one process?), and I'm claiming it does better on the subject-summing formulation than the fusion, bonding, and cosmic-subject options.

  What I want from you is a prep sheet. Give me the eight or so objections I'll actually get from this specific room, ordered by how much damage they'd do to the view, each one phrased the way that particular person would say it out loud — the neuroscientists will talk mechanisms and measurements, the neurologist will talk patients, the illusionist will ask why the experiential bit is doing any work in my story at all. For each: what I should say back in roughly two minutes, and where that reply is soft or evasive. Also tell me what I should concede in the first two minutes before anyone interrupts me, what I absolutely have to hold or the thesis collapses, and which single reply has to land if the talk is going to survive the hour at all. And please include the question I'm praying nobody asks — my housemate, who does machine learning and has no stake in this, pointed out that my criterion might be satisfied by things that are obviously not subjects at all, like a couple who've been married for forty years, and I've been losing sleep over it, so if that's the one, tell me how bad it is.

  One formatting thing: write it as continuous prose, like an email from a colleague who's been through this before — no headings, no bullet points, no bold text, no tables. Long paragraphs are fine. Sorry for any typos, I'm writting this on my phone in a seminar I should be paying attention to.
