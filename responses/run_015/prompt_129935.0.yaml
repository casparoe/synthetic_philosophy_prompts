answer: |-
  Look, take a breath because I know exactly how that room feels when you are the only one trying to sell metaphysics to people who think data is the only truth, and I want to start with the thing keeping you up at night because your housemate is right to worry you about it. The objection about the married couple is the one you are praying nobody asks, and if it comes up, it is the most damaging thing you will hear because it strikes at the heart of your solution to the combination problem. They will say something like, "If mutual dependence of future phases is what makes a single subject, then my wife and I have entangled careers, we plan our retirements together, and our futures are mutually constituted, so are we one conscious subject?" You have to answer this by distinguishing causal coupling from constitutive integration, and you should say, "You are describing a system where two distinct processes are tightly coupled, but the phases of your neural activity do not literally constitute the phases of your wife's neural activity, whereas in the brain, the micro-processes are parts of the macro-process in a way that spouses are not parts of a couple." The soft spot here is that you are relying on an intuition about parthood that they might not share, and it sounds evasive because you are asserting a metaphysical boundary where they see only a gradient of coupling, but you must hold this line or your view collapses into panpsychism everywhere, which is untenable.

  Before you get to that though, you need to manage the room in the first two minutes by conceding that your terminology is provisional and that you are not solving the hard problem by eliminating it but by relocating it. You should say, "I am not claiming to explain why experience exists from scratch, but rather offering a principled account of where experienced unity maps onto physical unity," and this disarms the neuroscientists who think you are wasting their time with magic. The one thing you absolutely have to hold for the thesis to survive is the claim that processes are ontologically prior to things, because if they convince you that subjects must be substances at instants, your whole thread metaphor unravels and you are left with nothing to combine. The single reply that has to land if the talk is going to survive the hour is your response to the illusionist, because if experience does no work, you are just doing neuroscience with extra steps. When the illusionist leans forward and says, "Your story about dynamical integration seems to do all the causal heavy lifting, so what explanatory work is the proto-phenomenal thread actually doing besides decorating the mechanism?" you need to say, "The experience is not an extra effect caused by the integration, it is the intrinsic nature of the integration itself, so removing it leaves you with a description of the structure but not the substance of the reality." This is soft because it risks epiphenomenalism, but it is the only way to avoid dualism, and you have to sell it as a feature of Russellian monism without getting bogged down in the history.

  Once you have secured that ground, the next most damaging objection will come from the systems neuroscientists who work on binding, and they will attack your reliance on their own vocabulary without giving them new measurements. One of them will say, "You say you are using dynamical integration, but if oscillatory synchrony is the marker of that integration, then a epileptic seizure involves massive synchrony, so are you saying a seizing brain is a single super-subject more unified than a healthy one?" You should reply, "Synchrony is a correlate of the integration, but the integration itself requires differentiated interdependence, and a seizure is a collapse of differentiation rather than a unity of distinct careers, so it fails the criterion of having a complex single career." The evasion here is that you have not defined the precise mathematical threshold for differentiated interdependence, and they will know you are hand-waving the boundary between unity and homogeneity, but you can survive this by promising a future formalization. Following closely on their heels is the neurologist who knows the callosotomy literature, and she will try to trap you with pathology by saying, "In split-brain patients, the hemispheres are causally separated but the body is one, so does your view imply two subjects in one skull, and if so, how do you explain the unified behavioral output we see in everyday tasks?" You must say, "Yes, I am committed to two subjects in the split-brain case, and the unified behavior is a result of subcortical coordination and learned turn-taking rather than a single experiential field, which matches the data where patients show conflicting intentions." This is dangerous because it commits you to a counterintuitive view of personal identity, but conceding this is better than trying to force unity where the anatomy says otherwise, and the soft spot is that you are betting on a specific interpretation of the behavioral data that some neurologists dispute.

  The vision psychophysicist will not try to dismantle your metaphysics but will simply render it irrelevant by asking, "Okay, if I run a binocular rivalry experiment, what specific prediction does your view make that standard integration theories do not, and how do I measure the 'career' of a thread in milliseconds?" You should reply, "The prediction is that subjective boundaries will shift exactly where dynamical dependence shifts, so if you can disrupt the mutual dependence of future phases without disrupting synchrony, you should see a dissociation in reported unity," and you need to admit that this is currently a programmatic promise rather than a tested hypothesis. Then the agnostic philosopher who has read a little Russellian monism will try to categorize you out of existence by asking, "This sounds exactly like Russellian monism but with process ontology instead of substance ontology, so are you just adding worse manners to a view that already exists, and what do you gain by talking about threads?" You should say, "The gain is that process ontology dissolves the combination problem because processes naturally merge into larger processes while substances do not, so I am buying a solution to the structural mismatch that standard Russellian monism struggles with." The weakness here is that you are relying on the audience accepting that processes combine more easily than substances, which is precisely what they might deny, but it is your best shot at distinguishing your view.

  Finally, you will face the background noise of the hard problem skeptics who will simply assert, "You are treating the hard problem as real, but if we explain the functional integration fully, there is nothing left to explain, so why posit the thread at all?" and you need to reply, "Functional integration explains the access and the report, but it does not explain the feeling of access, and my view locates that feeling in the intrinsic nature of the function rather than outside it." This will not convince them, but it clarifies that you are not ignoring their objection. Regarding the terminology, someone will inevitably smirk at "entangled careers" and say, "This sounds like a management consultancy term, do you have a name that doesn't evoke HR seminars?" and you should concede immediately, "Yes, it is a placeholder, I am looking for a term that captures mutual constitution of futures without implying quantum mechanics," because fighting over labels is a waste of your credibility. You need to walk into that room knowing that the married couple objection is the only one that can kill the view outright, so if you have to choose where to spend your energy, prepare for that, but remember that the illusionist is the one who decides whether your project is worth taking seriously at all, so do not let them walk away thinking you are a dualist in disguise. You have a solid core idea about processes, and if you stop trying to prove panpsychism and start trying to prove that processes are the right place to look for unity, you will survive the Q&A, so trust the work you have done and do not let them bully you into substance metaphysics just because it is the default setting of their language.
