answer: |-
  This is a classic museological headache, and your flatmates' debate touches on one of the deepest philosophical rifts in how we value objects. You are witnessing the collision of two different frameworks: **Epistemic Value** (the object as evidence/truth) versus **Aesthetic Value** (the object as visual experience).

  The short answer is: Your museum is operating on a theory of **Provenance as Truth**, not **Visual Experience as Value**. The policy is actually consistent, but only if you accept that a museum's primary job is to tell the truth about history, not to maximize beauty.

  Here is a breakdown of the philosophical machinery likely running your museum, where the inconsistencies lie, and what would have to change for your "visual experience" theory to win out.

  ### 1. Why the Painting was Banished (The Autographic Trap)
  The removal of the Victorian pastiche presupposes that the value of the painting is **ontologically tied to its history of production.**

  In philosophy of art, Nelson Goodman distinguishes between *autographic* and *allographic* arts.
  *   **Allographic:** Music or literature. A performance of Beethoven is valid even if Beethoven didn't conduct it; the score is the truth.
  *   **Autographic:** Painting. The history of how the physical object came into being is part of the work itself.

  Your museum treats the painting as **autographic**. When they thought it was 17th-century Dutch, it was a document of the Golden Age. When it was revealed as Victorian, it became a document of Victorian forgery.
  *   **The "Contact with the Past" Theory:** The value isn't just the image; it's the causal chain. A 17th-century brushstroke carries the physical trace of a specific moment in history. A Victorian fake carries the trace of a deception. By keeping it on the wall as a "Dutch Landscape," the museum would be lying.
  *   **Why not just re-label it?** You mentioned it was hauled down "in disgrace." This suggests the museum views the object as **contaminated**. If the value is historical evidence, a forgery is "bad data." In a university museum (which is a research institution first, gallery second), displaying bad data without a very specific pedagogical reason is professional negligence.

  ### 2. Why the Coins are Celebrated (The Transparent Replica)
  The 3D printed coins are treated differently because they are **honest mediators.**

  *   **The Ethical/Transparency Theory:** The coins are labeled "Replica." There is no deception. The museum is saying, "We cannot let you touch the past, but we can let you touch a perfect model of the past."
  *   **Utility over Aura:** Walter Benjamin talked about the "aura" of the original. The museum has decided that for Roman coins, the *informational content* (the face, the inscription, the size) outweighs the *aura* of the specific metal token.
  *   **Preservation:** There is a practical conservation ethic here. Real coins degrade with handling. Replicas do not. This is a stewardship decision, not an aesthetic one.

  ### 3. Is the Setup Consistent?
  **Yes, but only under the rule of "Intentional Deception."**

  The consistency lies in the **relationship between the object and the label**, not the object and the viewer's eye.
  *   **Coins:** Object = Copy; Label = "Copy." (Congruent = Good)
  *   **Painting (formerly):** Object = Fake; Label = "Original." (Incongruent = Bad)
  *   **Painting (now):** Object = Fake; Label = (Implicitly) "Worthless Lie." (Removed)

  The museum is not saying "Copies are bad." They are saying "Deception is bad." The 3D prints are ethically clean; the forgery was ethically dirty. The fact that the painting was removed rather than re-labeled as "Victorian Pastiche" suggests they believe the object's *shame* outweighs its *pedagogical value* as an example of forgery. That is a specific curatorial choice, not a universal law.

  ### 4. What if Value Was Just Visual Experience?
  If your museum believed that **Aesthetic Value** (how it looks/feels) was the only thing that mattered, their policy would look radically different:

  1.  **The Painting:** The Victorian pastiche would stay on the wall. It is "more interesting to look at." The label would say, "Attributed to 17th Century, likely Victorian." The visual pleasure is the priority; the historical truth is a footnote.
  2.  **The Sketch:** The "scrappy little genuine sketch" would likely be rotated out or stored unless it was visually stunning. Authenticity would not grant it immunity from boredom.
  3.  **The Coins:** They would still use replicas, but perhaps they wouldn't lock the real ones away. If the visual experience is all that matters, seeing the real tarnish and wear might be *more* interesting than the perfect 3D print.
  4.  **Labeling:** Labels would focus on composition, colour, and emotional impact. Dates and provenance would be secondary or omitted if they didn't enhance the visual experience.

  ### 5. Where is the Policy Underdetermined?
  This is the juicy part for your argument with your flatmates. There are gaps where different theories could license the *same* policy, or where the policy is wobbly.

  **A. The "Forgery as History" Loophole**
  The removal of the painting is the weakest link. A different theory of authenticity—**Critical Authenticity**—would argue the painting is *more* valuable now that we know it's a fake. It tells a story about the Victorian art market, the demand for Dutch masters, and the chemistry of aging paint.
  *   *Why they didn't do this:* It requires more work. It requires rewriting the narrative. It is easier to treat the fake as "nothing" than as "something else." This suggests the museum is under-resourced or conservative, not just philosophically rigid.

  **B. The "Numismatic Token" Problem**
  Why are coin replicas okay but painting replicas (if they made one of the Dutch landscape) not okay?
  *   *Theory:* Coins are mass-produced historical objects (tokens of a type). Paintings are unique singularities.
  *   *The Gap:* If the coin is a unique error coin, a 3D print is useless to a researcher. If the painting is a copy of a famous composition (many Dutch workshops produced variants), a replica might be fine. The museum is drawing a hard line between "Art" (Unique) and "Artefact" (Type-based), which is a modern distinction that doesn't always hold up.

  **C. The "Touch" Factor**
  They allow touching for coins but not paintings.
  *   *Theory:* Durability.
  *   *The Gap:* If the value was purely about "contact with the past," touching a fake painting should be fine (and educational). They likely don't allow it because it blurs the line for the public. If you can touch the fake, why can't you touch the real one? It creates a slippery slope.

  ### Summary for your Flatmates
  Your museum operates on an **Epistemic Ethic**.
  *   **Value Source:** Truthfulness of provenance and material history.
  *   **The Rule:** An object is a document. If the document is a lie, it is evidence of a crime (forgery), not evidence of the era it claims to be.
  *   **The Consistency:** Replicas are fine if they confess to being replicas. Forgeries are banned because they are lies that were believed.

  **The Verdict:** The museum isn't inconsistent; they just prioritize **History** over **Beauty**. The painting wasn't removed because it wasn't beautiful; it was removed because it stopped telling the truth. The coins are kept because they tell the truth about being copies.

  If you want to win the argument, push on the **Painting**. Ask the curators: *"Why isn't this displayed as a case study in Victorian Forgery?"* If they say "It has no value," they are admitting they care about **Origin** over **Object**. If they say "We don't have the budget to re-interpret it," they are admitting it's a **Resource** issue, not a philosophical one.
