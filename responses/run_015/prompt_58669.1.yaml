          *   Utility: Handling enhances learning without risking the original.
          *   *Key Concept:* "Transparent Mediation."

      *   **Addressing the Consistency Question (The Crux):**
          *   Is it consistent? Yes, if the criterion is *Deception vs. Transparency*, not *Real vs. Copy*.
          *   Coin replicas: Admitted copies.
          *   Painting: Was presented (implicitly or explicitly) as an original. Once known as a fake, keeping it up without massive re-labeling might be seen as validating a lie.
          *   *However:* The user notes the painting was "hauled down... in disgrace." This suggests the object itself is tainted, not just the label. This points to **Essentialism**.

      *   **Philosophical Deep Dive (Goodman & Benjamin):**
          *   **Nelson Goodman (*Languages of Art*):** Distinguishes between *autographic* arts (painting, where history of production matters) and *allographic* arts (music, literature, and arguably coins as currency/types).
          *   *Wait, are coins allographic?* A Roman coin is a unique physical object, but for educational purposes, the *type* matters more than the specific *token*. A 3D print captures the type. A painting's value is in the specific *token* created by the artist's hand.
          *   **Walter Benjamin (*The Work of Art in the Age of Mechanical Reproduction*):** The "Aura." The painting lost its aura because its history was a lie. The coin replica never claimed an aura.

      *   **What if Value was Just Visual? (The Counterfactual):**
