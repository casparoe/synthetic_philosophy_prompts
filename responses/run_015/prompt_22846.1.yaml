  A panpsychist and a critical realist are grabbing coffee after a conference session on consciousness.

  **Critical Realist:** "So, I heard your talk. You're claiming to have dissolved the combination problem?"

  **Panpsychist:** "Exactly. I've adopted the triviality response. Micro-experiences compose macro-experiences as a brute, fundamental fact. No further explanation of the 'how' is required."

  **Critical Realist:** "I see. So the mystery of how subjects summate is gone?"

  **Panpsychist:** "Gone. It was a category error to ask for a mechanism. It's trivial."

  **Critical Realist:** "Right. So you haven't actually explained how the combination happens; you've just asserted that it does, and moved the mystery from the 'derived' layer to the 'fundamental' layer."

  **Panpsychist:** "I prefer to say I've relocated the problem to a more parsimonious ontology."

  **Critical Realist:** "Ah, I get it now. You didn't solve the combination problem. You just paid for it to move to a nicer neighborhood and change its name to 'Axiom'."

  **Panpsychist:** "..."

  **Critical Realist:** "Don't worry. The Combination Problem is still conscious. It's just living at a different address now."
