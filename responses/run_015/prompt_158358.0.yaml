ff ignores that the act of preservation itself is an intervention. So no the hands-off conclusion doesn't survive because the analogy was carrying the whole argument by hiding the constitutive power of archival arrangement and if we accept that provenance structures retrieval then the archivist is always already implicated in whose voices are heard making the push for active appraisal and acknowledging bias not a violation of neutrality but a requirement for honesty. I think your instinct about provenance structuring retrieval is spot on and relying on the library model just smuggles in a false sense of objectivity that doesnt hold up under scrutiny so I'd say your friend is working with an outdated model of what an archive actually does and you should definitely push back on the idea that storage is ever passive when it comes to memory.
