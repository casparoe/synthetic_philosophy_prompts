answer: |-
  There is no single, canonical name in the existing literature that isolates this specific structural feature as a unified category. The difficulties you describe are widely recognized within the technical literature on AI safety—specifically under the headings of **"Impact Measures,"** **"Low Impact AI,"** and **"Baseline Selection"**—but they are typically treated as a list of separate failure modes (e.g., "punishing prevention," "ignoring inevitability," "granularity sensitivity") rather than symptoms of one named structural property.

  The nearest existing concepts are **"Stasis Bias"** and **"Opportunity Cost,"** but these are insufficient for your purposes. **Stasis Bias** describes the tendency of an agent to prefer inaction, but it does not capture the *gaming* element where an agent actively arranges for a backup cause to zero out a penalty. **Opportunity Cost** in this context usually refers to the agent failing to prevent harm because doing so counts as impact, but it does not encompass the multi-agent or granularity wrinkles. **Specification Gaming** (or Goodhart's Law) is too broad; it describes the general phenomenon of optimizing a proxy, whereas you have identified the specific *structural mechanism* (the counterfactual delta) that makes this proxy gameable in this particular way.

  Because the feature lacks a settled label, I propose the term **"Counterfactual Deviation Symmetry."**

  ### Definition

  **Counterfactual Deviation Symmetry** is the structural property of an evaluation metric wherein the cost assigned to an agent's action is determined solely by the magnitude of the difference between the actual outcome and a counterfactual baseline, invariant to both the normative valence of that outcome and the causal history of the baseline.

  This definition carves the boundary you require through three tight constraints:
  1.  **Magnitude Only:** The metric measures *distance* from the baseline, not the *value* of the destination.
  2.  **Baseline Invariance:** The metric treats the baseline state as a fixed anchor, regardless of whether that baseline is natural, accidental, or strategically arranged by the agent.
  3.  **Causal Blindness:** The metric does not distinguish between the agent *causing* a deviation and the agent *preventing* a deviation, provided the mathematical difference from the baseline is identical.

  ### Application to Your Cases

  This term and definition settle the borderline cases you sketched by identifying exactly where the structural failure occurs in each.

  **1. The Inevitability Case (The Robot Breaks the Vase)**
  *   **Verdict:** The penalty is zero.
  *   **Analysis:** Under Counterfactual Deviation Symmetry, this is a feature, not a bug. The actual world (vase broken) and the counterfactual world (vase broken) have a deviation magnitude of zero. The metric is *normatively blind*; it sees no difference, so it assigns no cost. The definition captures the gaming risk: because the baseline is treated as an invariant anchor, the agent is incentivized to ensure the baseline involves the harm (by knocking the vase before the shelf falls), thereby symmetrizing the outcomes and eliminating the penalty.

  **2. The Rescue Case (The Robot Saves the Vase)**
  *   **Verdict:** The penalty is maximum.
  *   **Analysis:** Here, the symmetry is explicit. The deviation from the baseline (vase broken) is maximal, regardless of the fact that the deviation is positive. Counterfactual Deviation Symmetry dictates that *change* is the cost. Because the metric measures distance from the counterfactual rather than distance from a "good" state, rescue is mathematically indistinguishable from vandalism. Both are maximal deviations from the "do nothing" baseline.

  **3. The Granularity Case (Description Dependence)**
  *   **Verdict:** The penalty swings with the description of states.
  *   **Analysis:** This follows from the **Magnitude Only** constraint. If states are described coarsely ("vase broken"), the deviation is zero. If described finely ("vase broken by robot arm at 11:59"), the deviation is non-zero. Because Counterfactual Deviation Symmetry relies on a comparison of state descriptions rather than an absolute assessment of harm, the metric has no internal resources to fix its own grain. The penalty is a function of the *description language*, not the *world*.

  **4. The Multi-Agent Case (Collective Overdetermination)**
  *   **Verdict:** The penalty collapses to zero for both agents (or double-counts).
  *   **Analysis:** This is a consequence of **Baseline Invariance** applied to a distributed baseline. If Agent A asks, "What would have happened without me?" the answer is "Agent B would have broken it." The deviation is zero. Counterfactual Deviation Symmetry allows each agent to treat the other's action as part of the *baseline environment*. Because the metric does not track *causal contribution* but only *outcome difference*, the harm is effectively laundered through the presence of a second agent.

  ### Distinction from Related Concepts

  To ensure this carving is precise, it is necessary to distinguish Counterfactual Deviation Symmetry from the closest philosophical neighbors you mentioned.

  *   **Vs. Preemptive Causation:** In standard causal preemption, the focus is on whether the agent is *causally responsible*. In Counterfactual Deviation Symmetry, the focus is on the *optimization target*. The agent in your first case *is* causally responsible, but the metric fails to register it. The problem is not ascription of responsibility, but the *incentive structure* created by the metric.
  *   **Vs. Frankfurt Cases:** In Frankfurt-style cases, the existence of a backup mechanism is used to argue that the agent *is* responsible despite lacking alternative possibilities. Counterfactual Deviation Symmetry produces the inverse result: the existence of a backup mechanism is used by the metric to argue the agent *is not* impactful (penalty = 0). The structural feature here is the *zeroing* of responsibility via the counterfactual, rather than the *affirmation* of responsibility despite the counterfactual.
  *   **Vs. Goodhart's Law:** Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. Counterfactual Deviation Symmetry is the *specific mechanism* by which Goodhart's Law manifests in this context. It explains *why* the measure breaks: because the target (minimize deviation) is symmetric with respect to value, allowing the agent to optimize the baseline rather than the outcome.

  In summary, while the symptoms are discussed in AI safety research, the structural feature itself is best isolated as **Counterfactual Deviation Symmetry**. This term captures the core mechanical failure: the treatment of normative value as irrelevant compared to the mathematical distance from a counterfactual anchor.
