answer: |-
  You're pressing a metaphysical worry against a moral framework, and I think you're conflating the two. Even if we grant Parfit that personal identity is a matter of degree, contractualism isn't grounded in the metaphysics of the self but in the structure of justification. We owe justification to distinct centers of consciousness. When I suffer, *I* suffer; when you suffer, *you* suffer. The fact that "I" am a series of psychologically connected stages doesn't change the fact that the pain is located in a specific standpoint that demands reasons. The moral significance of the distinction between persons isn't about the solidity of the soul; it's about the impossibility of experiencing someone else's loss. No matter how graded psychological connectedness gets, my pain is never yours, and a principle that sacrifices me for you fails to show me why I should accept it.

  On intra-personal aggregation, you're right that we sum burdens across a life, but that's because we are balancing competing claims within a single standpoint of justification. I can reasonably accept a burden now for a benefit later because both belong to the same claimant—the rejection must be based on the overall impact on *my* life. But when you ask me to accept a burden so *you* can benefit, you're asking me to subordinate my standpoint to yours. Reductionism doesn't bridge that gap. Even if "I" am only partially connected to my future self, the justification must still be acceptable to me-now. If you try to blur the line between persons to allow aggregation, you lose the ability to say why any individual claim matters at all. We need a practical boundary for justification, and the biological and psychological distinctness of human lives is the only non-arbitrary line that respects the reality of separate suffering.
