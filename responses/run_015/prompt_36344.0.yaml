      *   *Step 4: The Neutrality Test (The Split).* This is where the philosophical work happens.
          *   *Option A (Laïcité):* Does it make religion visible in the common space? -> No.
          *   *Option B (Multiculturalism):* Does refusing it privilege the default culture? -> Yes (Accommodate).
      *   *Step 5: Precedent & Resource.* Can we do this for everyone?
      *   *Escalation Point:* If Step 4 yields conflicting answers based on the school's dual identity, it goes to the Board.

      *Refining Step 4:* I need to make sure the Year Head doesn't have to choose the philosophy. The procedure needs to flag the conflict.
      *Revision:* Let's create a "Conflict Flag." If a request passes safety/academic checks but triggers the Neutrality vs. Access debate, it *must* go to the Board. However, the prompt asks for a procedure Year Heads can apply *unless* it's a value question. So, the procedure needs to handle the "easy" cases and flag the "hard" ones.
      *Better Approach:* The procedure should prioritize *functional* neutrality first. If the request alters the *function* of the school, it's a No. If it only alters the *appearance* or *schedule*, it enters the Danger Zone.
      *Actually, looking at the prompt:* "The points at which it must stop and hand the decision up, because what remains is a question of values the procedure cannot resolve."
      *Okay, so the procedure acts as a filter.*
      1.  Is it religious/belief-based?
      2.  Is it safe/hygienic?
      3.  Does it compromise assessment/curriculum?
      4.  **The Philosophical Fork:** Does this request challenge the *visible neutrality* of the school space OR does it challenge the *default cultural schedule*?
      *   If Yes to Visible Neutrality -> *Laïcité* says No, *Multiculturalism* says Maybe. -> **ESCALATE.**
      *   If Yes to Default Schedule -> *Laïcité* says No (calendar is fixed), *Multiculturalism* says Maybe. -> **ESCALATE.**
      *   Wait, if everything escalates, the procedure is useless. I need to find the "Safe Yes" and "Safe No" zones where both traditions agree, and isolate the "Conflict Zone."
      *   *Agreement Zone 1 (Safety):* Both agree on safety.
      *   *Agreement Zone 2 (Coercion):* Both agree on not forcing belief.
      *   *Agreement Zone 3 (Disruption):* Both agree on not disrupting teaching.
      *   *Conflict Zone:* Symbolic presence (clothing) and Structural accommodation (calendar/exams).

