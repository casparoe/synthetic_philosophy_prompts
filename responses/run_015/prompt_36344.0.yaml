          *   Must identify where the procedure stops and escalates to the Board (value conflicts).
          *   Must state failure modes (e.g., formal equality hurting minorities, implicit ranking of faiths).
          *   Must apply the procedure to three specific cases: Headscarf in PE/Class, Ramadan Exam Scheduling, Co-ed Swimming Exemption.
          *   Must show where traditions diverge and where the outcome might displease the Board majority (e.g., implications for Christian symbols or secular traditions).
