      *   *Better angle:* The "Neutrality as Sameness" view (Laïcité) demands the removal of *all* religious signs. If the school currently allows small crosses but bans hijabs, the procedure exposes this inconsistency. The procedure must state: "If the answer is No for Faith A, it must be No for Faith B." This forces the Board to confront their own bias.

