answer: |-
  **MEMORANDUM**

  **TO:** Governing Board & Year Heads
  **FROM:** Deputy Head
  **SUBJECT:** Protocol for Religious Accommodation Requests (The "Brussels Filter")
  **DATE:** 24 May 2024

  ### 1. Purpose and Scope
  This document is not a philosophical settlement. It is an administrative triage tool. Its goal is to ensure consistency in daily operations while isolating the specific philosophical disagreements that only the Board can resolve.

  **The Constraint:** Year Heads are not philosophers. They are operational managers. This procedure allows them to approve or deny requests in under one hour *unless* the request triggers a core value conflict.
  **The Output:** Every decision generated by this protocol must be documented in writing (FR/EN) citing the specific step of the protocol used. This creates the precedent trail required for legal defensibility.

  ### 2. The Decision Protocol (5 Steps)
  *Year Heads must proceed sequentially. If a request fails a step, the process terminates in a **No**. If it passes all steps, it is a **Yes**, unless it triggers the Escalation Clause.*

  **Step 1: The Threshold of Belief**
  *   **Question:** Is the request linked to a recognized religious obligation or a sincere, coherent belief system comparable to religion (e.g., veganism for ethical reasons)?
  *   **Criterion:** The student/parent must articulate the connection. "I prefer not to" is insufficient. "My faith prohibits X" is sufficient. We do not judge theological validity, only sincerity and coherence.
  *   **Termination (No):** If the request is based on convenience, preference, or non-sincere grounds.
  *   **Pass:** Proceed to Step 2.

  **Step 2: Safety and Rights of Others**
  *   **Question:** Does the accommodation pose a physical safety risk to the student or others, or coerce others into religious practice?
  *   **Criterion:** Reference Belgian safety regulations and school safeguarding policy.
  *   **Termination (No):** Loose clothing in machinery/chemistry labs; dietary requests that risk cross-contamination allergies; prayer that disrupts other students' right to learn.
  *   **Pass:** Proceed to Step 3.

  **Step 3: Academic Integrity and Core Curriculum**
  *   **Question:** Does the accommodation prevent the student from being assessed on a core competency or require the school to teach a separate curriculum?
  *   **Criterion:** Can the student demonstrate the required skill/knowledge despite the accommodation?
  *   **Termination (No):** Exemption from mandatory certification exams; exemption from core subjects (e.g., biology, history) where the content is secular and required by the Ministry.
  *   **Pass:** Proceed to Step 4.

  **Step 4: The Visibility Test (The *Laïcité* Filter)**
  *   **Question:** Does the accommodation make a specific religious identity visibly distinct in the common institutional space?
  *   **Criterion:** This step identifies *Laïcité* concerns. It asks: Does this turn the student into a representative of their faith within the school's neutral zone?
  *   **Divergence Marker:**
      *   *If Yes:* The **French tradition** dictates a **No** (Neutrality of space).
      *   *If Yes:* The **Anglo tradition** dictates a **Maybe** (Right to expression).
  *   **Action:** If the answer is **Yes**, the Year Head **cannot decide**. Mark as **ESCALATE TO BOARD**.
  *   **Action:** If the answer is **No** (e.g., private prayer in free time, discreet dietary swap), proceed to Step 5.

  **Step 5: The Structural Test (The Multiculturalist Filter)**
  *   **Question:** Does the accommodation require the school to alter its universal schedule, calendar, or rules to fit a particular group?
  *   **Criterion:** This step identifies *Multiculturalist* concerns. It asks: Is the "neutral" schedule actually encoding a majority culture that excludes this student?
  *   **Divergence Marker:**
      *   *If Yes:* The **French tradition** dictates a **No** (The Institution is the emancipator; the student adapts).
      *   *If Yes:* The **Anglo tradition** dictates a **Maybe** (The Institution must adapt to ensure equity).
  *   **Action:** If the answer is **Yes**, the Year Head **cannot decide**. Mark as **ESCALATE TO BOARD**.
  *   **Action:** If the answer is **No**, the request is **APPROVED**.

  ---

  ### 3. Failure Modes of This Procedure
  *Year Heads must be aware of where this logic degrades over time.*

  1.  **The Formal Equality Trap:** Applying Step 4 strictly (banning all visible symbols) treats all religions equally but disproportionately impacts minorities whose faith requires visible markers (e.g., hijab, kippah) versus those whose faith allows discretion (e.g., crosses under shirts). This creates *equality of restriction* rather than *equality of access*.
  2.  **The Implicit Ranking:** By adjudicating "sincerity" in Step 1, Year Heads will inevitably privilege organized, text-based religions over diffuse spiritualities, and familiar faiths over unfamiliar ones.
  3.  **The Precedent Drift:** Approving individual "structural" exceptions (Step 5) one by one (e.g., one exam reschedule) eventually changes the school calendar de facto without a Board decision, creating a system of informal privilege based on who asks first.

  ---

  ### 4. Application to Current Cases
  *Here is how the Protocol processes the three requests from last year.*

  #### Case A: 15-year-old requesting to wear a headscarf in PE and Class.
  *   **Step 1 (Belief):** Pass. Sincere religious obligation.
  *   **Step 2 (Safety):** **Conditional.** In Class: Pass. In PE: Requires risk assessment (loose fabric near equipment). If a sports-scarf is available, Pass. If not, No for PE only.
  *   **Step 3 (Academic):** Pass. Does not stop learning.
  *   **Step 4 (Visibility):** **YES.** The headscarf is a visible religious marker in the common space.
  *   **Protocol Outcome:** **ESCALATE TO BOARD.**
  *   **Philosophical Split:**
      *   *Laïcité View:* Deny. The school is a neutral zone; religious identity must be set aside to foster citizenship.
      *   *Multiculturalist View:* Approve. Banning it privileges the secular/Christian default dress code and excludes the student from the common space.
  *   **Year Head Action:** Cannot rule. Must submit to Board with a note: *"This triggers the Visibility Test. A ruling here sets precedent for all conspicuous religious symbols."*

  #### Case B: Parents requesting afternoon exams during Ramadan be moved to morning.
  *   **Step 1 (Belief):** Pass.
  *   **Step 2 (Safety):** Pass. Fasting is safe; exam timing is logistical.
  *   **Step 3 (Academic):** **Borderline.** If morning slots are full, moving exams compromises standard assessment conditions for others.
  *   **Step 5 (Structural):** **YES.** This requires altering the universal exam schedule to accommodate a specific religious calendar.
  *   **Protocol Outcome:** **ESCALATE TO BOARD.**
  *   **Philosophical Split:**
      *   *Laïcité View:* Deny. The calendar is the neutral framework. Students adapt to the institution.
      *   *Multiculturalist View:* Approve. The calendar currently privileges non-fasting students (who can eat/hydrate). Neutrality is a myth; accommodation restores equity.
  *   **Year Head Action:** Cannot rule. Note: *"This triggers the Structural Test. If approved for Ramadan, it establishes a right to schedule adjustments for Yom Kippur, Eid, and potentially Sunday Sabbath observance."*

  #### Case C: Parents requesting daughter be excused from co-ed swimming lessons.
  *   **Step 1 (Belief):** Pass. Modesty requirements.
  *   **Step 2 (Safety):** Pass.
  *   **Step 3 (Academic):** **FAIL.** Swimming is part of the mandatory PE curriculum. Exemption prevents assessment of a core competency.
  *   **Protocol Outcome:** **NO.**
  *   **Reasoning:** The school cannot certify a student who has not completed the mandatory curriculum.
  *   **Caveat:** The Board must decide if "Co-ed Swimming" is a *pedagogical necessity* or a *cultural norm*. If the Board defines mixity as essential to the school's emancipatory mission (Laïcité), the No stands. If the Board defines swimming skill as the only goal, they could offer single-sex lanes (Multiculturalist), but this requires a **Structural** change (Step 5), so it technically **ESCALATES** regarding the *solution*, even if the *exemption* is denied.

  ---

  ### 5. The Uncomfortable Symmetries (Board Implications)
  *This procedure forces the Board to confront inconsistencies in their own positions. If adopted, the following logical consequences will arise:*

  **1. The Crucifix Problem (Laïcité Consistency)**
  If the Board votes to deny the Headscarf (Case A) based on Step 4 (Visibility/Neutrality), the Protocol demands **symmetry**. You cannot ban the hijab while permitting visible Christian crucifix necklaces or Jewish kippahs.
  *   **The Dislike:** The Anglo-American half of the Board, often culturally Christian, may view small crosses as "cultural jewelry" rather than "religious proselytizing." This Protocol classifies them identically. To maintain neutrality, **all** conspicuous symbols must be banned. If you allow one, you must allow all.

  **2. The Birthday Cake Problem (Multiculturalist Consistency)**
  If the Board votes to accommodate Ramadan (Case B) based on Step 5 (Structural/Equity), the Protocol demands **symmetry**. You cannot accommodate Islamic fasting without accommodating Christian holidays that are not currently public holidays in Brussels (e.g., Orthodox Christmas, Ascension) or Jewish High Holy Days.
  *   **The Dislike:** The French half of the Board views the school calendar as a republican constant. Accommodating multiple religious calendars fragments the "common time" of the school. Furthermore, if we accommodate religious dietary restrictions, do we accommodate secular ethical ones (veganism)? If we accommodate religious dress, do we accommodate political symbols (climate activism gear)? The "Multiculturalist" logic has no clear stopping point without Board intervention.

  **3. The "Neutrality is a Myth" Trap**
  If we choose the Multiculturalist path, we admit the school is not neutral. This undermines the "Secular" branding of the school. If we choose the Laïcité path, we admit the school actively suppresses minority identity to maintain a "neutral" facade that resembles the majority culture. The Protocol forces you to write down which lie you prefer to tell.

  ---

  ### 6. Limitations: What This Procedure Cannot Do
  *Do not lean on this tool for more than 3-5 years.*

  1.  **Demographic Tipping Points:** If the student body shifts from 10% to 40% requiring accommodation, the "Exception" becomes the "Norm." The Protocol treats these as exceptions. At a certain volume, the Board must rewrite the School Mission, not just adjudicate requests.
  2.  **Legal Changes:** Belgian law and European Court rulings on religious freedom shift. This administrative protocol does not override statutory law. If the courts rule that banning headscarves is discriminatory, Step 4 becomes illegal.
  3.  **The "Hard Case" Creep:** This protocol works for clear cases. It will fail on hybrid cases (e.g., a student who claims a gender identity conflict with religious dress). Year Heads will try to force these into the religious box to use this tool. They must be instructed to escalate gender/identity conflicts immediately.
  4.  **Staff Morale:** This procedure protects Year Heads from blame, but it does not protect them from the emotional labor of enforcing unpopular bans. If the Board chooses the *Laïcité* path, Year Heads will be the ones telling 15-year-olds to remove their scarves. The Board must own that political cost, not the staff.

  ### 7. Recommendation for Implementation
  1.  **Adopt the Protocol** as the standard operating procedure for Year Heads immediately to stop the inconsistency.
  2.  **Schedule a Board Retreat** specifically to resolve the "Escalated" categories (Visibility and Structure). You cannot run a school indefinitely with half your decisions marked "ESCALATE."
  3.  **Publish the Symmetry Clause:** Inform parents that accommodations are granted based on universal principles, not specific faiths. "What we allow for Islam, we allow for Catholicism. What we ban for Judaism, we ban for Secular Humanism."

  **Signed,**
  Deputy Head
