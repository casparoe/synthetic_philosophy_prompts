answer: |-
  The implicit theory of fairness presupposed by adverse-impact testing under the Uniform Guidelines is best reconstructed not as a commitment to strict demographic parity, but as a **rebuttable presumption of group equality**. This framework treats statistical disparities in selection rates as *prima facie* evidence of discrimination (disparate impact), shifting the burden of proof to the employer to demonstrate that the disparity is a necessary byproduct of measuring job-relevant traits. Unlike pure demographic parity, which demands equal selection rates regardless of underlying qualifications, this theory allows for inequality provided it is "justified" by validity evidence. Unlike pure meritocracy, which allows inequality provided the process is blind, this theory demands that the *outcomes* of the process remain within a specific band of equivalence unless an affirmative defense is mounted. Consequently, the theory is fundamentally **consequentialist and liability-driven**: it defines fairness as the absence of unexplained group disparities, where "explained" is narrowly defined by criterion-related validity and the absence of less-discriminatory alternatives.

  This specific reconstruction rules out several rival fairness conceptions while remaining compatible with others. It explicitly rules out **Fairness Through Blindness** (the idea that removing protected attributes ensures fairness), because the 4/5ths rule flags outcomes regardless of whether the algorithm "knows" the group identity. It also rules out **Calibration** as a sufficient condition for fairness; a model can be perfectly calibrated (a score of 70 means a 70% chance of success for all groups) and still fail the 4/5ths rule if base rates differ between groups, thereby triggering a requirement to adjust thresholds or drop the model. Similarly, it is incompatible with **Equalized Odds** as a primary standard, because the 4/5ths rule monitors selection rates ($P(\hat{Y}=1)$), not error rates conditional on actual performance ($P(\hat{Y}=1 | Y, Group)$). However, the practice is compatible with **Utility Maximization**, but only conditionally: utility is permitted to trump group equality only after the employer clears the high bar of the "business necessity" defense, effectively placing a tax on utility that generates disparity.

  Regarding the coherence of the layered structure—a distributional screen plus a process-validity defense—the framework is legally coherent but mathematically unstable. Legally, the layers function as a burden-shifting mechanism designed to minimize litigation risk and social friction rather than to discover moral truth. Mathematically, however, the impossibility theorems (e.g., Kleinberg et al., Chouldechova) imply that you cannot simultaneously satisfy demographic parity (the screen), calibration (often required for validity), and equalized error rates (often implied by consistent meritocratic treatment) when base rates differ. The current practice papers over this incoherence by treating the 4/5ths rule as a heuristic trigger rather than a hard constraint, and by accepting validation studies that prove correlation without necessarily resolving the causal fairness tension. This makes the incoherence deep rather than incidental: the workflow forces practitioners to optimize for a metric (selection rate ratio) that may actively degrade the model's predictive integrity (calibration) to avoid legal liability, creating a system where "fairness" is achieved by manipulating thresholds to satisfy a statistical rule of thumb that ignores sampling error and base rate differences.

  If you were to replace the 4/5ths standard with an **Equalized Odds** standard, day-to-day practice would change radically in three ways. First, **data requirements would explode**: you currently need applicant demographics and pass/fail decisions; under Equalized Odds, you need ground-truth job performance data for *all* applicants (including those rejected) to calculate False Positive and True Positive Rates, necessitating complex validation studies or "audit hires" rather than simple administrative data checks. Second, **tuning would shift from thresholds to group-specific calibration**: to equalize error rates when base rates differ, you would likely need to apply different decision thresholds for different groups (e.g., a score of 60 passes Group A, but 55 passes Group B), which is currently legally risky and operationally stigmatizing. Third, **the pass/fail landscape would invert**: models that currently pass because they lower thresholds to boost selection rates (satisfying 4/5ths) would fail Equalized Odds if doing so increases the False Positive Rate for the protected group (hiring people who don't succeed), while models that currently fail 4/5ths due to base rate differences but predict success equally well across groups would suddenly become compliant.

  Verdict: The four-fifths rule, as actually practiced, does not presuppose a coherent ethical conception of fairness but rather functions as a legal burden-shifting mechanism that treats demographic parity as a rebuttable presumption of discrimination.
