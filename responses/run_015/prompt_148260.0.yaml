answer: |-
  **HANDOUT: THE INDEPENDENCE AXIOM AND THE VALUE OF CERTAINTY**
  **Group:** Flat Decision Theory
  **Week:** 4
  **Author:** [Redacted]
  **Language:** US English (per group request)

  ### 1. The Core Disagreement

  Ollie is right about the math. If you accept the von Neumann-Morgenstern axioms—specifically Independence—then my stated preferences are inconsistent. I prefer a sure \$1M over a gamble with a tiny risk of zero, yet I prefer a riskier high-payoff gamble over a safer low-payoff gamble when the sure thing is removed. Mathematically, stripping away the common 89% probability branch should leave my preference order unchanged. It doesn't.

  Ollie is wrong about the rationality.

  The Independence Axiom assumes that the value of an outcome is intrinsic and static. It assumes \$1M is worth the same amount of "utility" whether it arrives as a guarantee or as the result of a 99% coin flip. I am arguing that this is false. The *status* of the money changes its value. A sure \$1M is a different asset class than a 99% chance at \$1M.

  ### 2. The Commitment Value of Certainty

  We need to develop the "commitment value" argument beyond a simple preference for safety. This isn't about risk aversion in the utility curve; it's about the instrumental power of a guarantee.

  Money is not just consumption; it is optionality. A guaranteed \$1M allows me to alter my life trajectory *today*. I can sign a mortgage. I can quit a job. I can secure a loan against the asset. A bank will lend against a wire transfer; they will not lend against a probability distribution, no matter how skewed toward success.

  Therefore, the "Sure \$1M" option contains a bundle of downstream opportunities that the "99% \$1M" option does not. The 1% risk of ruin isn't just a loss of expected value; it is a loss of *agency*. It keeps me in a state of limbo where I cannot commit to long-term plans.

  In a repeated, small-stakes setting (like Ollie's money pumps), this commitment value washes out. You can average out the risks. But in a one-shot, life-changing decision, the ability to plan *now* has a premium that Expected Utility (EU) theory does not capture. Violating Independence here isn't a bug; it's a recognition that the "Sure" branch unlocks utility that the "Risky" branch physically cannot, regardless of the payout.

  ### 3. The Curtain and The Envelope

  Ollie's "Curtain" argument attempts to force the timing of the resolution. He suggests that if the 89% "common" tickets are resolved first, the problem collapses. If a "dead" ticket is drawn, I get the common amount and leave. If a "live" ticket is drawn, I face the choice. He argues this proves the common branch is irrelevant.

  **The Counter:** Timing is a feature, not a bug.
  If the curtain resolves *before* I need to make life plans, the certainty value is preserved. If the curtain resolves *after*, it is not. In the standard Allais setup, the resolution is assumed to be simultaneous. My preference for the Sure \$1M relies on the fact that the uncertainty is removed *immediately*.

  **The Sealed Envelope Variant:**
  Suppose the ticket is already drawn, sitting in an envelope. Someone offers to open it for a penny. Should I pay?

  **Verdict:** No, do not pay the penny.

  **Reasoning:**
  If I pay the penny, I convert epistemic uncertainty (I don't know the state) into knowledge. But knowledge only has value if it changes my action or my planning capacity.
  1.  **If the envelope contains a "Dead" ticket:** I get the common amount. Knowing this five minutes earlier doesn't change the payout.
  2.  **If the envelope contains a "Live" ticket:** I get to choose.
  3.  **The Crucial Point:** The bank doesn't care about the envelope. Until the money is in my hand, I cannot sign the mortgage. Paying the penny gives me information, but it does not give me *liquidity*.

  Furthermore, paying the penny commits me to treating the uncertainty as purely epistemic. If I refuse to pay, I am asserting that the *structure* of the gamble matters, not just the hidden state. By refusing, I maintain that the "Sure" option is superior because it removes the *need* for the envelope entirely. The value lies in the absence of the risk, not in knowing the outcome of the risk.

  ### 4. The Bias Objection

  Ollie will argue this is just the "Certainty Effect," a documented cognitive bias where humans overweight 100% probabilities. He will say a bias is an error to be corrected, not a principle to build on.

  **Response:**
  A bias is a systematic deviation from a normative standard. If the normative standard is "maximize abstract mathematical expectation," then yes, this is a bias. But if the normative standard is "maximize real-world stability and agency," it is a heuristic adaptation.

  We did not evolve to maximize numbers on a spreadsheet. We evolved to survive environments where ruin is absorbing. In the real world, a 1% risk of zero often means "starve" or "go bankrupt." Once you hit zero, you are out of the game. You cannot play the average.

  Therefore, weighting certainty disproportionately is *ecologically rational*. It is a safeguard against ruin in a non-ergodic world. Calling it a bias assumes the EU model is the ground truth. I am arguing the EU model is the approximation, and my preference is the more accurate reflection of how value works in high-stakes, one-shot scenarios.

  ### 5. The Verdict on the Equity

  Now, the actual decision on my plate.
  **Option A:** 11% chance at \$1M. (EV: \$110,000)
  **Option B:** 10% chance at \$5M. (EV: \$500,000)

  **Decision:** Take Option B (10% at \$5M).

  **Defense:**
  This might seem contradictory to my defense of the Allais paradox, but it is not. My argument for violating Independence rests entirely on the **Commitment Value of Certainty**. That value only exists when a "Sure Thing" is on the table.

  In this equity case, there is no sure thing. Both options are low-probability gambles. Neither allows me to sign a mortgage tomorrow. Neither provides immediate liquidity. Since the "Certainty Premium" is not applicable, we fall back to the next best metric: Expected Value.

  Option B has more than 4x the expected value of Option A. The difference in probability (11% vs 10%) is negligible compared to the difference in payout (\$1M vs \$5M). Unless I have a specific reason to believe \$1M is a "threshold" where \$5M provides no additional utility (which is unlikely; \$5M buys freedom \$1M does not), Option B dominates.

  I can consistently hold that:
  1.  **Sure \$1M > Risky \$1M** (Due to commitment value).
  2.  **10% @ \$5M > 11% @ \$1M** (Due to Expected Value, as certainty is absent).

  This violates Independence, but it respects the instrumental reality of the assets.

  ### 6. Separate Worries

  There is one thing I haven't accounted for that you should press me on: **The Money Pump.**

  If I publicly hold these preferences, I am vulnerable. If Ollie acts as a bookie, he can sell me Option A, then offer to trade me to Option B, then offer to trade me back to Option A, charging a fee each time. Because my preferences are intransitive under the Independence axiom, I can be pumped until I am broke.

  **Mitigation:**
  I must treat my preference for the "Sure \$1M" as a **policy**, not a transient state. I cannot allow myself to be traded back and forth. Once I choose the Sure Thing, I must lock it in. In the equity case, once I choose the 10% shot, I must accept the risk. The vulnerability exists only if I allow my preferences to be dynamic in the face of an adversary.

  **Final Instruction:**
  Sign the paperwork for the 10% shot at \$5M. The EV is too high to ignore when certainty is off the table. But in next week's session, tell Ollie he can keep his Independence Axiom; I'll keep my house.
