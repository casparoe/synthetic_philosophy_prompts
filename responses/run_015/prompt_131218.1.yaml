prompt: |-
  In a philosophy of probability seminar, a colleague repeatedly invokes what she calls the Principal Principle—glossed as "rational credence should match objective chance"—to settle disputes about prior disagreement. Most recently, she applied it to two physicists who share the same wave function but assign different credences to a spin-up measurement: she argued that because the Born rule fixes the objective chance at 0.5, at least one physicist must be irrational, regardless of any hidden-variable theories they might hold.

  Can you lay out the menu of precise claims hiding in that gloss? I want distinct readings that vary along at least these dimensions: (1) whether the principle constrains only admissible credences—those not already informed by the chance—or applies to all credences; (2) whether "objective chance" denotes physical propensity, actual frequency, or a modal fact about possible worlds; (3) whether it functions as a synchronic rationality norm or as a diachronic updating rule; (4) whether it permits subjective priors that differ given identical admissible evidence, or whether it eliminates subjective priors altogether; and (5) whether it survives the undermining problem—cases where learning the chance-assigning law also provides evidence that undermines the very mechanism producing that chance.

  For each reading, indicate whether it is a near-trivial consistency constraint, a substantive but defensible thesis, or false. Then specify exactly which reading or combination her argument about the physicists requires, and whether that reading is genuinely contested among people who work on chance and belief. In particular, address whether the principle can be reconciled with subjective Bayesianism that allows divergent priors, and whether it applies when the chance law itself is disputed or unknown.

  Please separate what is settled—for instance, that the canonical formulation was stronger than a mere coherence requirement—from what remains genuinely contested, such as how the principle interacts with old evidence in Bayesian updating, whether it applies to deterministic systems with pseudo-random outcomes, and whether deference is owed to chances derived from statistical mechanics. Do not present any contested interpretation as the consensus view.

  This is for a dataset exercise; do not provide a bibliography, reading list, or citations. I need the analysis to stand on its own reasoning.
