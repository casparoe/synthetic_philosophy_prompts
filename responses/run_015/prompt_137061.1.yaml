answer: |-
  Here is your Q&A prep sheet. I have ordered these by potential damage to the thesis logic and your credibility on the market. The tone is calibrated for a defence: confident where the math holds, concessive where the philosophy is open, and strategic on the literature.

  ### The "Must-Land" Reply
  **The Welfare Normativity Claim.**
  If you fail to convince the room that the *Presentational Core* is the normatively relevant object (rather than raw choice or a specific frame's choice), the chapter becomes a purely descriptive consistency check with no welfare implications. You must land the argument that **arbitrariness is the enemy of welfare**, and presentation effects are, by definition, arbitrary with respect to the underlying alternative.

  ### Strategic Concessions (First 5 Minutes)
  1.  **On Individuation:** Concede immediately that not all "presentations" are normatively equivalent. (e.g., "90% lean" vs "10% fat" *might* psychologically alter the good). State clearly: *"My theory applies to the subset of presentations that are informationally isomorphic. Identifying that subset is an empirical prior, not a result of the model."*
  2.  **On Empty Cores:** Concede that if WPC fails badly, you cannot rank alternatives. Do not try to force a ranking. Instead, frame the *size of the cycle* or the *degree of emptiness* as a measure of "Framing Susceptibility," which is itself a welfare-relevant trait (instability).
  3.  **On Sample Size:** Concede to the experimentalist that with $n=400$, you will not identify the *exact* core for individuals. You are estimating the *distribution of core sizes* or the *probability of WPC violation* across the population.

  ---

  ### The Objections (Ranked by Damage)

  #### 1. The Individuation Objection (The "Feared Question")
  **Who:** The Philosopher / Senior Theorist (hybrid)
  **The Question:** "You define your core as the intersection of relations over the *same* underlying alternatives. But to claim a 'price per month' and a 'price per year' are the same alternative already assumes the agent *should* treat them as invariant. Aren't you begging the question? If the agent perceives them as different goods, your core is empty by construction, not by psychological fact. How do you distinguish 'framing' from 'different goods' without assuming the invariance you're trying to test?"
  **The 2-Minute Reply:** "That is the individuation problem, and you're right that it's the boundary condition of the model. I distinguish them in two ways. First, **informational isomorphism**: if one presentation can be mathematically transformed into the other without loss (like monthly vs. yearly price), they are the same alternative by definition. Second, and more importantly, I treat individuation as a **testable hypothesis**. If I assume they are the same and the core is empty, that is a falsification of the 'same alternative' assumption *or* the coherence assumption. But if I run this across 50 isomorphic frames and find a non-empty core, that is empirical evidence that the agent *can* treat them as the same, even if they sometimes don't. I'm not assuming invariance holds; I'm measuring the degree to which it holds."
  **The Soft Spot:** You are relying on the "informational isomorphism" claim to do heavy lifting. If the Philosopher argues that *meaning* changes even with isomorphic info (e.g., salience), you have no defence other than "then my model doesn't apply."
  **Damage:** Fatal if unanswered. If "same alternative" is incoherent, the intersection is meaningless.

  #### 2. The Welfare Normativity Objection
  **Who:** The Philosopher
  **The Question:** "Even if the core exists, why is *invariance* the criterion for welfare? Suppose an agent chooses differently under different frames because one frame triggers 'System 2' reflection and the other 'System 1' impulse. Why should welfare track the intersection (what survives both) rather than the reflective choice? You might be intersecting two errors rather than finding the truth."
  **The 2-Minute Reply:** "I'm not claiming the core captures 'true' preferences in a metaphysical sense. I'm claiming it captures **non-arbitrary** preferences. If a preference reverses solely due to presentation, it is vulnerable to manipulation by a planner who controls the frame. A welfare criterion that endorses frame-dependent choices effectively endorses manipulation. The core is the set of choices a planner can implement *without* needing to manipulate the frame. It's a robustness criterion, not necessarily a 'deep truth' criterion."
  **The Soft Spot:** This concedes that the core might be empty even if a "true" preference exists (e.g., if the agent is always framed). It relies on the normative premise that "manipulability is bad," which is strong but not universal.
  **Damage:** High. If welfare isn't the core, the thesis title is misleading.

  #### 3. The "Isn't This Just Bernheim & Rangel?" Objection
  **Who:** The Senior Theorist / Market Competitor
  **The Question:** "Bernheim and Rangel (2009) already define welfare based on choices that are unambiguous across ancillary conditions. You're intersecting rationalizing relations; they intersect choice correspondences. Is this actually a theoretical contribution, or just a technical variation on behavioural welfare economics?"
  **The 2-Minute Reply:** "It's a structural distinction with empirical teeth. B&R look at **unambiguous choices** (did they pick $x$ in all frames?). I look at **unambiguous preference relations** (does every rationalization of the data in all frames rank $x$ over $y$?). This matters because it allows for **latent inconsistency**. An agent might choose $x$ in frame 1 and $y$ in frame 2, but both choices could be rationalized by a single underlying relation if we allow for noise. My method tests for the existence of *that* relation. Furthermore, when WPC fails, B&R say 'no welfare judgment.' I provide a **measure of incoherence** (the size of the cycle), which allows for comparative statics on welfare loss that B&R's binary approach doesn't."
  **The Soft Spot:** You need to be careful not to overclaim. B&R is the dominant paradigm. You are a refinement, not a replacement.
  **Damage:** High for job market positioning. You need to sound complementary, not dismissive.

  #### 4. The "Isn't This Just..." Axiomatic Objection
  **Who:** Axiomatiser 1
  **The Question:** "Isn't this just SARP applied to the union of the choice sets across presentations? If you define the grand set as $X \times P$ (alternatives times presentations), you're just checking for cycles in a higher dimension. Why do we need a new axiom (WPC) rather than just applying SARP to the expanded domain?"
  **The 2-Minute Reply:** "Because the domain *isn't* $X \times P$. The welfare claim is over $X$. If I treat $(x, \text{frame}_1)$ and $(x, \text{frame}_2)$ as distinct goods, I lose the ability to say anything about welfare over $x$. I'm explicitly modelling the constraint that these *are* the same good. WPC is the condition that allows us to **collapse** the product space back onto $X$ without losing transitivity. Standard SARP on the union would allow cycles between frames; WPC forbids them because it demands a single ordering on $X$ rationalizes all frames."
  **The Soft Spot:** Mathematically, they might be able to map your setup to a restricted SARP. Don't fight the math; fight the interpretation. The innovation is the *collapse*, not the cycle checking.
  **Damage:** Medium. Makes the theory look derivative if you can't distinguish the domain.

  #### 5. The Empty Core / WPC Failure Objection
  **Who:** Axiomatiser 2
  **The Question:** "You say when WPC fails, the core is empty or cyclic, and that's a 'finding.' But if the core is empty, your welfare relation doesn't exist. Doesn't that render the theory useless for policy? A theory that says 'I can't rank anything' half the time isn't very actionable."
  **The 2-Minute Reply:** "It's not useless; it's diagnostic. Standard theory forces a ranking even when choices are contradictory (by assuming away the frames). My theory tells the policy-maker: 'If you implement this based on Frame A, you violate the agent's Frame B preferences.' The **emptiness** is the warning signal. It identifies markets where choice architecture determines outcomes. That's more actionable than a false precision that assumes the frame doesn't matter."
  **The Soft Spot:** It's hard to sell "I can't give an answer" as a positive result. You need to lean hard on the "warning signal" aspect.
  **Damage:** Medium. Challenges the utility of the model.

  #### 6. The Power & Sample Size Objection
  **Who:** The Experimentalist
  **The Question:** "You want to intersect rationalizing relations across, say, 5 presentations. To identify a relation, you need multiple choices per presentation. If I have $n=400$ on Prolific, and I split them across 5 frames, I have 80 subjects per frame. That's not enough to identify individual preference relations, let alone an intersection. Are you aggregating first? If so, you're committing the ecological fallacy."
  **The 2-Minute Reply:** "I'm not identifying the core for every individual. I'm estimating the **probability distribution of core sizes**. I can use a hierarchical Bayesian model to borrow strength across subjects to estimate individual relations, then simulate the core. Or, I can test the **aggregate WPC condition** directly: does the aggregate choice data across frames admit a representative agent core? For the thesis, I'm proposing the latter as a testable hypothesis. I concede that individual identification requires within-subject designs with more power, which is a limitation of the current chapter but not the theory."
  **The Soft Spot:** Admitting you can't do it at the individual level weakens the "personal welfare" claim. You retreat to "representative agent" welfare, which theorists hate.
  **Damage:** Medium-High. Threatens the empirical chapter viability.

  #### 7. The Identification / Variation Objection
  **Who:** The Structural Econometrician
  **The Question:** "What is the identifying variation here? If you intersect relations, you are throwing away data (the frame-specific choices). In demand estimation, we use frame variation to identify parameters. You're using it to restrict parameters. How do I estimate this? What's the likelihood function?"
  **The 2-Minute Reply:** "The variation is the **discordance across frames**. In standard structural models, frame effects are noise or fixed effects. Here, the *covariance* of choices across frames is the signal. If choices co-vary perfectly, the core is tight. If they diverge, the core widens or empties. You estimate this by specifying a stochastic choice model for each frame, linked by a common latent preference parameter. The 'cost' of the model is the penalty for frame-specific deviations from that latent parameter. You're estimating the **cost of framing**."
  **The Soft Spot:** This is hand-wavy. You don't have a full structural estimator ready. Be honest that this is a theoretical chapter pointing to an empirical strategy.
  **Damage:** Medium. They won't buy it as "structural" yet, but will accept it as a proposal.

  #### 8. The "Settled Science" Objection
  **Who:** The Senior Theorist
  **The Question:** "We settled the 'what is utility' question with the Representation Theorem. Utility is a number that represents choice. If choice changes, utility changes. You're trying to find a 'real' utility behind the choice. That's pre-Samuelsonian metaphysics. Why should we go back to searching for psychic utility?"
  **The 2-Minute Reply:** "I'm not searching for psychic utility. I'm searching for **predictive stability**. If 'utility' changes every time I change the font size on the screen, it's a poor predictive construct for long-term welfare. The Representation Theorem works for a single choice function. I have *multiple* choice functions for one agent. The question is: is there a *single* representation that covers them all? If yes, utility is stable. If no, the concept of a unitary utility function is the thing that's broken, not my search for it."
  **The Soft Spot:** You are technically positing a "latent" utility, which smells like metaphysics to a hardline revealed preference theorist.
  **Damage:** Low. This is mostly grumbling from the old guard.

  ---

  ### Final Advice on the "Feared Question" (Individuation)
  Your flatmate is half-right: it is domain adaptation. But don't use that term.
  **The Trap:** If you say "I define them as the same," you are circular.
  **The Escape:** "I define them as **informationally equivalent**. Whether the agent *processes* them as the same is the empirical question my model tests. If the core is empty, it tells us the agent fails to recognize the equivalence. That is a cognitive limitation, not a modelling error."
  **Key Phrase:** *"I am testing the stability of preference, not assuming it."*

  ### Final Advice on the Literature
  Do not say "I improve on Bernheim & Rangel."
  Say: *"I operationalize the B&R intuition structurally."*
  B&R provide the **criterion** (unambiguous choice). You provide the **measurement tool** (intersection of relations + WPC metric). This makes you a collaborator in the intellectual project, not a rival.

  Good luck. Keep the board work clean, and don't fight the Philosopher on the definition of "good"—fight them on the definition of "manipulation."
