answer: |-
  ### Desiderata for a Theory of Remote Rescue Obligations

  To function as a viable normative framework in an era of technologically mediated crisis, a theory of rescue must satisfy the following criteria. Each is categorized by its status: **Non-negotiable** (required for the theory to remain action-guiding and psychologically plausible) or **Camp Preference** (dependent on specific meta-ethical commitments, such as strict consequentialism versus agent-centered prerogatives).

  #### 1. The Mediation Neutrality Requirement
  *   **Motivating Case:** The Drone Feed. An agent witnesses a child drowning in a foreign pond via a high-fidelity, low-latency video link. The agent can press a button to deploy a local flotation device but cannot physically enter the water.
  *   **Requirement:** The theory must explicitly state whether the technological interface alters the moral weight of the intervention. It must explain why causal efficacy (pressing a button) is either morally equivalent to physical presence (jumping in) or why the lack of somatic risk changes the duty.
  *   **Status:** **Non-negotiable.** A theory that cannot distinguish between direct physical intervention and remote causal intervention fails to account for the phenomenology of agency and risk. However, *how* it resolves this (equivalence vs. distinction) is often a **Camp Preference**. Strict universalists demand equivalence; agent-centered theories often privilege physical proximity as a marker of special obligation.

  #### 2. The Iteration and Saturation Constraint
  *   **Motivating Case:** The Infinite Queue. Saving the child in front of you is a discrete act. Saving every child visible on a global crisis feed is an iterated demand that never terminates.
  *   **Requirement:** The theory must distinguish between a one-off rescue duty and a sustained lifestyle obligation. It must provide a stopping rule that prevents the duty of rescue from consuming the agent's entire life project, thereby creating institutional dependency where individuals become mere conduits for resource transfer rather than moral agents.
  *   **Status:** **Non-negotiable.** Without a saturation point, the theory demands moral martyrdom, rendering it incapable of guiding a sustainable human life. However, defining the saturation point (e.g., "marginal utility" vs. "significant sacrifice") is a **Camp Preference**.

  #### 3. The Deontic Boundary Condition
  *   **Motivating Case:** The Line in the Sand. An agent donates 5% of income to save lives. Is this obligatory? What about 10%? 50%?
  *   **Requirement:** The theory must preserve a coherent distinction between *obligatory rescue* (failure to act is blameworthy) and *supererogatory charity* (acting is praiseworthy, but failure is not blameworthy). It cannot collapse all beneficence into duty without destroying the concept of the "optional good."
  *   **Status:** **Non-negotiable.** If all good acts become duties, the concept of duty loses its normative force (the "overdemandingness" objection). Maintaining this boundary is essential for the logic of blame and praise.

  #### 4. Cognitive and Resource Realism
  *   **Motivating Case:** Decision Fatigue. An agent is bombarded with verified, urgent appeals from multiple remote crises simultaneously.
  *   **Requirement:** The theory must align with empirical findings on decision fatigue and resource depletion. It cannot prescribe a cognitive load that degrades the agent's ability to make *any* moral decisions. It must account for the cost of information processing and the psychological toll of sustained emergency vigilance.
  *   **Status:** **Non-negotiable.** A theory that ignores the biological and psychological limits of the moral agent is descriptively false and prescriptively useless.

  ***

  ### The Incompatibility Matrix: Jointly Unsatisfiable Subsets

  There is a fundamental trilemma inherent in these desiderata. The following three propositions appear jointly unsatisfiable; a theory can hold any two, but not all three.

  1.  **Strict Proximity Independence:** Distance and mediation are morally irrelevant; if you can prevent a bad thing at comparable cost, you must, regardless of location or interface.
  2.  **Unbounded Iteration:** The duty applies to every instance of preventable suffering encountered, without a cumulative cap on total demand.
  3.  **Agent Capacity Preservation:** The moral agent must retain sufficient resources and psychological integrity to maintain a functional life over time.

  **The Conflict:**
  If you accept **Strict Proximity Independence** (1) and **Unbounded Iteration** (2), you inevitably violate **Agent Capacity Preservation** (3). In a world of infinite remote crises, a proximity-independent duty creates an infinite demand.
  To preserve **Agent Capacity** (3) while maintaining **Strict Proximity Independence** (1), you must reject **Unbounded Iteration** (2) by introducing a cumulative threshold (e.g., "you must save until it hurts significantly, then you may stop").
  To preserve **Unbounded Iteration** (2) and **Agent Capacity** (3), you must reject **Strict Proximity Independence** (1) by reintroducing proximity or special relationships as a limiting factor (e.g., "you are only responsible for crises within your immediate sphere").

  **Specific Tension:** A strict, proximity-independent duty cannot coexist with the preservation of long-term agent capacity *unless* the theory incorporates a "satisficing" mechanism or a hard cap on sacrifice. Without such a mechanism, the remote observation of crisis becomes a mechanism for total agent depletion.

  ***

  ### Assessment of the Anchor Framework

  Does the original framing of the drowning child argument survive the most demanding items on this list?

  **No.** The original framing survives the **Mediation Neutrality** requirement robustly; it successfully argues that physical distance is morally arbitrary. However, it fails the **Iteration and Saturation Constraint** and **Cognitive Realism**.

  The original argument treats the rescue as a singular, discrete event (one child, one pond, one suit of clothes). It does not adequately scale to the environment of remote observation, where the "pond" is global and the "children" are infinite. By failing to provide a non-arbitrary stopping rule for iterated demands, the original framing collapses the distinction between **Obligatory Rescue** and **Supererogatory Charity**, violating the **Deontic Boundary Condition**.

  Consequently, while the original framing successfully establishes the *existence* of a remote duty, it lacks the structural architecture to limit the *scope* of that duty. To survive the age of remote crisis observation, the framework must be modified to include agent-centered thresholds that prioritize long-term capacity over immediate, total resource depletion. Without this modification, the theory demands a level of sustained altruism that triggers decision fatigue and moral paralysis, ultimately reducing the agent's capacity to rescue anyone at all.
