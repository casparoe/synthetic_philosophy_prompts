  The air in the hab module tasted of recycled ozone and wet soil. Dr. Voss rubbed her temples, the glow of the spectrometer painting her face in sickly hues. On the screen, the data stream for Sample 88-B pulsed.

  For forty-nine cycles, the chromaphytes had been stable. Their photosynthetic analogues absorbed primarily in the 550nm range. Human eyes, and the sensors calibrated to them, read this as *green*. Safe. Edible. High nutrient yield.

  But the model predicted a shift at Cycle 50. The analogue would jump to 450nm. *Blue*. Toxic. Metabolic waste product.

  The problem wasn't the color. The problem was the *when*.

  Voss toggled the timestamp overlay. She had two clocks running in the corner of her interface.

  **Clock A: UTC (Earth Standard).** Synchronized to atomic time back on the homeworld. Rigid, unyielding, divorced from the sky outside.
  **Clock B: Local Indigenous Count (LIC).** Based on the moon's rotation relative to the gas giant it orbited. Specifically, the interval between the giant's ring-shadow crossing the zenith.

  Due to orbital drift and the relativistic drag of the giant's magnetosphere, the two clocks were diverging. Not by much. But enough.

  Fifty UTC days was not fifty Local Cycles. Fifty UTC days was roughly 48.6 Local Cycles.

  If the law of the organism was "All specimens are green before Cycle 50," which cycle mattered? The atom? Or the shadow?

  The door hissed open. Harker ducked inside, shaking off the condensation from his suit. He was the lead engineer for the settlement expansion, a man who viewed philosophy as a form of inefficiency.

  "Status on the Field Manual?" Harker asked, wiping his boots. "Logistics needs the toxicity tables by 0800 tomorrow. We can't schedule the harvest crews without knowing if the biomass is safe."

  Voss didn't turn from the screen. "I can't sign off, Harker."

  "Why not? The data is clear. Green turns blue. We mark the cutoff. Done."

  "The cutoff is ambiguous," Voss said. She pointed to the two clocks. "The organisms evolved here. Their metabolic triggers are tied to the light spectrum, which is tied to the orbit. They follow Local Count. If we use UTC for the manual, the cutoff happens too early. We'll be discarding safe food."

  Harker sighed, the sound of a man who had heard this before. "So we use Local Count. Print it in the manual. 'Do not harvest after 50 LIC.'"

  "And when a settler reads '50 LIC', how do they measure it?" Voss turned to face him. "Their wrist comps default to UTC. The harvesters are automated on Earth-time schedules. To them, 50 LIC is a conversion factor. It's a derived quantity. UTC is the base unit."

  "Then we update the comps," Harker said, waving a hand. "It's a software patch. Voss, you're overthinking this. It's just units. Like meters versus feet. The physical reality doesn't change because you changed the clock."

  "That's exactly what Goodman argued," Voss muttered, more to herself than him.

  "What?"

  "Nothing. Look, Harker. It's not just units. It's projectibility." She pulled up the graph. The curve was sharp. A step function. "Induction works because we assume nature is uniform. We assume that 'green' is a natural kind. But 'green-before-Cycle-50' is a disjunctive predicate. It's *grue*."

  Harker stared at her. "You're speaking in riddles. Is the plant poisonous or not?"

  "It's poisonous after the shift. But the shift isn't a point in absolute time. There is no absolute time here. There is only the time we impose to describe the change." Voss leaned against the desk. "If I write the law using UTC, I am asserting that the plant's metabolism is synchronized to Earth's atomic clocks. That's false. But if I write it using Local Count, I am asserting that 'Local Cycle' is a natural kind comparable to 'wavelength'. But 'Local Cycle' is just a geometric relationship between this moon and that giant. It's just as arbitrary as UTC."

  "So what's the fact of the matter?" Harker pressed, his patience fraying. "Does the plant know what time it is?"

  "The plant knows photon flux integrated over duration," Voss said. "But *duration* is the variable we supply. We are smuggling the framework into the law. If I draft the manual using UTC, I am creating a law that says: *All specimens are green if examined before UTC-T50.* That statement is true for the samples I have tested. But is it *projectible*? Will the next specimen obey Earth time?"

  "The next specimen obeys physics," Harker snapped. "Physics doesn't care about your predicates."

  "Physics doesn't, but *biology* does!" Voss raised her voice. The hum of the air recyclers seemed to dip. "Biological rhythms are entrained. They are locked to the environment. But our *description* of that environment is locked to Earth. When we say 'Cycle 50', we are creating a hybrid monster. We are taking an Earth number and pasting it onto a Local event. The gap between them is where the error lives."

  She walked over to the growth chamber. Inside, the rows of chromaphytes glowed softly. They were approaching the shift.

  "Imagine," Voss said, her voice dropping. "Imagine we use UTC. We tell the harvesters to stop at UTC-Day 50. But the plants, following the shadow, shift at LIC-50. That's fourteen hours later. For fourteen hours, the harvesters are collecting blue plants. They process them. They eat them. They get sick."

  "Then we pad the margin," Harker said. "Stop at Day 48. Better safe than sorry."

  "And we waste tons of food," Voss countered. "Resource scarcity kills too. But it's deeper than risk management. It's about whether there is a *true* trajectory. Is there a fact of the matter about when the plant turns blue, independent of the clock used to measure it?"

  "Yes," Harker said firmly. "The fact of the matter is the chemical change in the leaf. The clock is just the ruler."

  "But the ruler determines where the line is drawn," Voss insisted. "Goodman's point was that any observation compatible with 'green' is also compatible with 'grue' until the moment of the cut-off. We are *at* the cut-off. My data supports 'Green-before-UTC-50' just as well as 'Green-before-LIC-50' up to this exact second. The data doesn't tell me which predicate is projectible. Only entrenchment does. And Earth-time is more entrenched than Local-time."

  Harker stepped closer, his expression hardening. "Entrenchment is just habit. Utility is truth out here, Voss. We need a manual that works for the people we have, using the tools we have. Those tools are Earth-made. The people are Earth-born. Their cognition is synced to UTC. If you write the law in Local Time, you are forcing them to translate reality into a foreign language before they can act. That introduces error. Human error."

  "So we distort nature to fit the user?"

  "We map nature to the user's capacity to survive," Harker corrected. "You want a perfect ontology? Go back to Earth and teach. Here, we need predictions that cash out in calories and safety. If UTC keeps the settlers alive, then UTC is the real time."

  Voss looked back at the screen. The cursor blinked at the end of the sentence she had drafted: *All specimens remain non-toxic prior to...*

  She hovered over the delete key.

  If she typed **UTC**, she was accepting instrumentalism. She was admitting that the law of nature is relative to the observer's toolkit. She was conceding that there is no "view from nowhere," only the view from the hab module.

  If she typed **LIC**, she was claiming a realism she couldn't justify. She was asserting that the moon's shadow has ontological priority over the atomic clock, even though both are human constructs imposed on a continuum of events.

  The horror wasn't that the plants might change. The horror was that the *rule* governing the change depended on which story she told about time. The induction wasn't in the plants; it was in the language she used to bind them.

  "Voss," Harker said softly. "The settlers arrive in six months. They don't care about Goodman. They care about not vomiting up their lungs."

  "I know," she said.

  "Then write the manual."

  Voss's finger hovered. She realized that signing the document wasn't an act of discovery. It was an act of legislation. She wasn't finding the law; she was choosing the framework that would *make* the law true for the colony. If she chose UTC, and the plants failed, she could say the plants were anomalous. If she chose LIC, and the settlers failed, she could say they couldn't read the clock.

  The uncertainty wasn't in the world. It was in the gap between the world and the word.

  She typed **UTC**.

  It was the entrenched predicate. It was the one that matched the harvesters' code. It was the one that allowed the induction to hold for the *people*, even if it drifted from the *plants*.

  "Done," she said.

  Harker nodded, taking the datapad. "Good work, Doctor."

  He left. The door hissed shut.

  Voss sat alone in the hum of the module. She watched the chronometer tick over. **UTC 23:59:59**. Simultaneously, **LIC 49.98**.

  For now, the predicates overlapped. For now, green was green. But she knew that somewhere in the future, beyond the scope of her data, the lines would diverge. The plants would turn blue according to the shadow, while the clocks said it was still time for green.

  And when that happened, when the settlers got sick, would it be because nature was unpredictable? Or because they had tried to force the universe to speak a language it didn't know?

  Voss turned off the screen. The darkness of the room was absolute. There was no green, no blue, no time. Just the waiting. She realized then that induction was not a tool for finding truth. It was a bet placed against the silence, hoping the universe would agree to keep using the same dictionary tomorrow that it had used today.

  She closed her eyes, trying not to think about what color the darkness was.
