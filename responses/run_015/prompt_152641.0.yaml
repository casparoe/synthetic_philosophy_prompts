      *   **Scene:** A community care review board. An Old Stock woman (Elara) is advocating for her husband who is dying of a neurodegenerative disease (mirroring the user's context). She describes his nights as "torture."
      *   **The Calibrated Response:** The board members (AH citizens) listen. They understand the words. But because their own baseline for "negative" is so flat, they interpret her description of "torture" as a *subjective intensity rating* that they cannot verify. They assume she is "amplifying" the signal.
      *   **The Crucial Twist:** They don't deny the pain. They just don't recognize the *moral weight* of the pain because moral weight, in their society, is tied to *functional impairment*. Since the husband is still cognitively complex (per prompt), they assume his "function" is intact. The *suffering* is seen as an aesthetic overlay, not a functional crisis.
      *   **Why this obscures beneficence:** Beneficence requires recognizing a *need*. If suffering is no longer recognized as a fundamental threat to well-being (because the majority doesn't experience it as such), it becomes a preference. You don't owe someone beneficence for a preference; you owe it for a need. The calibration has redefined "need."

