  also tell me what specific argument or empirical finding would flip your credence the most — where is your reasoning most likely to fail?

  please respond with a JSON object with these exact fields:
  - "overall_credence": your final number
  - "decomposition": an array of objects, each with "label" (the sub-question), "probability" (your rough number), and "justification" (one line)
  - "combination_logic": a brief string explaining how you combined them
  - "most_sensitive_term": the label of the term that moves your number most
  - "what_would_change_mind": the argument or finding that would shift you
