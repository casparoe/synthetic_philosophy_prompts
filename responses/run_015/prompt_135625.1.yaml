answer: |-
  The Born rule emerges as an objective structural invariant of unitary evolution, where the ratio of inter-branch record fidelity is physically necessitated to equal $|a|^2/|b|^2$ by the conservation of information inherent in linear dynamics. Unitary transformations preserve the inner product of the universal state vector, meaning the total information content of the wavefunction remains constant while being redistributed across orthogonal components during decoherence. When a measurement interaction occurs, the system entangles with the environment, creating physical records that are effectively fragments of the global wavefunction stored in environmental degrees of freedom. The stability and redundancy of these records—their fidelity—are not arbitrary but are constrained by the geometry of Hilbert space, specifically the $L_2$ norm which is the only norm invariant under unitary transformations. Consequently, the proportion of environmental states capable of consistently encoding a specific history relative to the whole is strictly determined by the squared amplitude of that history's branch vector.

  This derivation avoids circularity because it does not presuppose probability or credence but rather relies on the uniqueness of the $L_2$ norm under linear composition. If record fidelity scaled linearly with amplitude ($|a|$) or by any other power, the additivity of information across independent systems would violate unitarity, leading to contradictions in the conservation of total information when composite systems are considered. The tracking of amplitude squared is therefore an unavoidable feature of linear evolution because any other scaling factor would render the mapping of physical encoding mechanisms inconsistent under the group of unitary operations that define quantum dynamics. Thus, the Born rule is not a postulate about belief or world-counting, but a theorem regarding the maximum density of consistent physical records permissible within the branching structure of the universal wavefunction.
