  **Brainstorming Frames**

  1.  **The Cognitive Load Frame:** Focus on whether superrationality requires a mind. Bacteria cooperate without thinking; superrationality seems to require thinking about thinking. The gap is about consciousness. *Critique:* Too bogged down in philosophy of mind. Doesn't address the structural similarity of the cooperation itself.
  2.  **The Normative Frame:** Decision theory is about what you *ought* to do; biology is about what *works*. The gap is justification vs. explanation. *Critique:* A bit standard. Doesn't capture the specific weirdness of "symmetry" in both fields.
  3.  **The Correlation Source Frame:** Both fields rely on outputs being correlated (I do X, you do X). Superrationality says the source is shared logic; biology says the source is shared history/selection. The gap is whether "shared logic" is just a specific subtype of "shared history." *Critique:* This is the sharpest. It cuts straight to the user's intuition that the phenomena might be identical despite the different language.

  **Selected Frame:** #3 (The Correlation Source). It allows for a direct comparison of formal conditions without getting stuck on whether bacteria have "reason."

  ***

  **Project Proposal: Logic vs. Lineage**
  **Applicant:** [Name Withheld], Retired Ecologist
  **Duration:** 3 Months
  **Subject:** Comparative Analysis of Superrationality and Evolutionary Correlation

  **The Spark**

  I've spent forty years looking at ecosystems, watching how things cooperate without agreeing to do so. You see it in quorum sensing bacteria or cleaner fish setting up stations on a reef. Nobody signs a contract; the behavior just sticks because it works. Recently, since retiring, I've been reading up on decision theory and I keep hitting this concept called "superrationality." The idea is that if two agents are perfectly rational and know they are similar, they'll logically lock into the same choice, even without communicating.

  Here's what bothers me: the math looks suspiciously like the math I used for evolutionary stable strategies. In both cases, you get coordination without communication. But the philosophers talk about "common knowledge of rationality" and the biologists talk about "shared selection pressure." My gut tells me these might be the same phenomenon described in different languages—one intentional, one mechanical. But I haven't found anyone who squarely addresses whether the philosophical requirement for "recognizing another reasoner" is actually doing any work, or if it's just window dressing.

  **The Precise Question**

  Does superrationality depend on a kind of common knowledge of rationality that is conceptually distinct from evolutionary correlation mechanisms, or is it just the same phenomenon dressed up in intentional language?

  Put another way: Is the "symmetry" required for superrational choice a logical necessity unique to minded agents, or is it merely a specific instance of the broader biological principle where correlated phenotypes emerge from shared history?

  **Why the Literature Doesn't Settle It**

  The problem is that the two fields talk past each other. The philosophy literature on superrationality (think Hofstadter or Parfit) tends to assume agents who can represent logic. They treat the "symmetry" as something recognized by the mind. If you don't know you're facing a mirror, you can't act superrationally.

  The biology literature, on the other hand, treats correlation as a product of lineage. Two bacteria act the same not because they recognize each other, but because they share a genome and a selective environment. They don't need to "know" anything.

  Currently, there's no bridge. Philosophers rarely engage with the formal conditions of evolutionary game theory deeply enough to see the isomorphism, and biologists generally dismiss decision theory as anthropomorphism. Neither side asks if the "common knowledge" condition is actually necessary for the outcome, or if it's just a story we tell ourselves about why humans cooperate. We need to seperate the logical structure of the coordination from the substrate (brain vs. gene) hosting it.

  **Proposed Method**

  I'm not proposing new math. I want to do a conceptual mapping of the existing formal conditions. I will take the standard logical conditions for superrationality (specifically the requirement for common knowledge of rationality and symmetry) and lay them over the conditions for evolutionary correlation (relatedness and shared selection pressure).

  The work will be philosophical, not technical. I want to analyze the *necessity* of the intentional states. For example: In evolutionary game theory, correlation happens if the probability of meeting a cooperator is high enough. In superrationality, correlation happens if the probability of the other agent reasoning identically is high enough. I need to determine if "reasoning identically" adds a constraint that "sharing a lineage" does not, or if "reasoning identically" is just a high-fidelity version of "sharing a lineage."

  I'll spend the first month digesting the formal definitions from both sides. The second month will be dedicated to mapping the conditions against case studies—like the Prisoner's Dilemma in humans vs. reciprocal altruism in vampires bats. The final month is for writing up the conceptual argument.

  **Outcomes**

  A **positive result** would look like a proof that the logical conditions are isomorphic. This would imply that superrationality is not a unique feature of high-level rationality, but rather a subset of evolutionary correlation. This would deflate some of the metaphysical weight philosophers put on "rationality" as a coordination mechanism.

  A **negative result** would demonstrate a formal gap—showing that common knowledge of rationality allows for coordination in scenarios where evolutionary correlation fails (perhaps in one-off interactions between unrelated agents). This would validate the distinctness of the philosophical concept.

  Even a null result is useful. It would clarify exactly where the boundary lies between biological instinct and rational choice, which is something both fields claim to own but neither fully defines.

  **Feasibility and Honesty**

  Here's the brutal truth: three months is tight. Maybe too tight. I'm new to the rigorous side of decision theory, and while I know the biology, translating between the formalisms is tricky. There's a real risk I'll spend two months just untangling definitions and run out of time for the actual argument.

  I'm not promising a definitive solution. What I can promise in ninety days is a robust framework that identifies exactly where the mismatch occurs. I might not solve the problem, but I should be able to show precisely why it's hard to solve. If I find that the concepts are incommensurable, that's still a result. But I need to be okay with producing a detailed "map of the confusion" rather than a resolution. Given my retirement status, I have the time to focus, but I shouldn't pretend this is a light lift. It's ambitious, but I think the question is narrow enough to make progress even if I don't cross the finish line.

  I think this recieves enough attention to warrant the grant. It's a small project, but if the intuition holds, it changes how we view rationality itself.
