  2. The content camp seeks a logical metric independent of inquiry, whereas the epistemic camp explicitly ties value to cognitive states, revealing incompatible aims. The likeness camp attempts to bridge these by modelling ontological distance, yet its sensitivity to language suggests it inadvertently smuggles in pragmatic choices.

  3. A hidden formal question regarding the individuation of possible states is doing the heavy lifting, as different metrics presuppose different ontologies of facts. Without agreeing on how the world is carved into propositions, no neutral comparison of theories is possible.

  4. Your hypothesis correctly identifies the relativity issue, and your construction gains formal stability by anchoring scores to specific questions. However, it silently gives up the ambition of a general theory of progress, relaunching the dispute over how to justify the chosen partition.

  5. Progress consists in abandoning the search for a monadic property of theories in favour of context-sensitive metrics tailored to specific investigative aims. Expecting a universal ordering is futile, so the field should pivot to analysing how partitions are justified within particular scientific practices.
