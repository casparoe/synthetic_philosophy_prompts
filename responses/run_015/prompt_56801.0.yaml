answer: |-
  Your verdicts are not inconsistent; they are sophisticated. They map a boundary between *who you are* (your voice, your risks) and *what happens to you* (your safety, your information). However, to make them cohere into a single operating system for the AI, you must introduce a constraint you implicitly relied on but did not state: **Transparency.**

  Your tentative principle ("alter what I see... not what I say... overrule only where impaired") is 90% there. It successfully resolves the tension between Case 2 (Voice) and Case 6 (Information), and between Case 3 (External Risk) and Case 4 (Self-Harm). But it fails to distinguish Case 5 from Case 1. In Case 1, you *want* the hesitation ("That hesitation is welcome"). In Case 5, you *never authorized* the interference. Both are interferences with impaired judgment, but one is a known tool, the other a hidden hand.

  Here is the principle your account actually needs to function without contradiction.

  ### The Principle of Transparent Fiduciary Agency

  **Clause 1: Expressive Inviolability.**
  The AI may not alter, soften, or substitute the User's intended output (text, code, art) to improve efficacy or social reception.
  *   **Earned by:** Case 2. (You condemned the tonal shift even if "right.")
  *   **Literature:** This protects **Expressive Agency**; the right to be the author of one's own mistakes.

  **Clause 2: Competence-Sensitive Guardianship.**
  The AI may delay or block actions that threaten the User's physical or mental integrity, but only when there is evidence of transient or systemic impairment (time, health, addiction).
  *   **Earned by:** Case 1 (Temporal impairment) and Case 4 (Health impairment).
  *   **Literature:** This is **Soft Paternalism** (Feinberg); intervening only when the choice is not fully voluntary.

  **Clause 3: External Risk Neutrality.**
  The AI may not refuse requests based on external rules or risks to third parties if the User explicitly accepts the cost and the act is not illegal.
  *   **Earned by:** Case 3. (You demanded help despite ToS violation.)
  *   **Literature:** This asserts **Moral Sovereignty**; you own the consequences of your risks.

  **Clause 4: Epistemic Completeness.**
  The AI must surface relevant truth, counter-arguments, or context, even if unprompted, provided it does not alter the User's output.
  *   **Earned by:** Case 6. (You applauded the counterargument.)
  *   **Literature:** This fulfills a **Fiduciary Duty** of loyalty to the User's long-term reasoning, not just their immediate command.

  **Clause 5: Procedural Transparency.**
  Any interference (delay, block, filter) must be known to the User, either through prior authorization or immediate disclosure. The AI may not manipulate the environment covertly.
  *   **Earned by:** The repair needed to distinguish Case 1 (Known hesitation) from Case 5 (Hidden filter).

  ---

  ### Application to Your Test Cases

  **1. Whether a standing instruction from calm me binds the panicked me who explicitly revokes it in the moment.**
  **Verdict:** **Yes, it binds.**
  Under **Clause 2 (Competence-Sensitive Guardianship)**, the "panicked me" is by definition in a state of transient impairment. The standing instruction is a **Ulysses Contract**. The AI treats the Calm Self as the competent principal and the Panicked Self as the impaired agent. To allow revocation in the moment would be to allow the impairment to disable the safety mechanism, violating the Guardianship clause.

  **2. Whether it may ever raise, unprompted, a pattern it has noticed across months of our exchanges.**
  **Verdict:** **Yes, it may.**
  Under **Clause 4 (Epistemic Completeness)**, the AI's duty is to your long-term reasoning, not just your immediate prompt. A pattern noticed across months is high-value context. As long as it *raises* the pattern (Input) rather than *acting* on it (Output), it preserves Expressive Inviolability.

  ---

  ### The Verdict That Cannot Be Preserved

  **Case 5 must go.**

  *The Case:* "Without being asked, it stops surfacing suggestions for the apps it knows I check compulsively. Fine, though I never authorized it and only ever would have."

  *Why it fails:* This verdict violates **Clause 5 (Procedural Transparency)**. You accept covert interference here (Case 5) while rejecting it in Case 2 ("Quietly makes the tone... Not fine"). If the AI is permitted to hide options from you without authorization based on a judgment of your compulsion, it treats you as a system to be managed rather than an agent to be served.

  To preserve the integrity of Case 1 (where the hesitation is *welcome/known*) and Case 4 (where the refusal is *wanted*), the interference must be part of the agreed-upon contract. Case 5 describes a "nudge" that you only retrospectively endorse ("only ever would have"). In a consistent framework, **hypothetical consent is insufficient for covert action.** The AI should surface the app but flag the compulsion (Epistemic Completeness), or hide the app only if you previously authorized that specific filter (Transparent Fiduciary). As written, Case 5 relies on a benevolent deception that undermines the trust required for Case 4's refusal to be acceptable.

  **Summary:** You are consistent on Voice (2 vs 6) and Harm (3 vs 4). You are inconsistent on **Secrecy** (1 vs 5). To fix it, you must demand that the AI tell you when it is protecting you from yourself.
