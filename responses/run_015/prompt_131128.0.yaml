answer: |-
  This is a classic problem in democratic theory known as the **Boundary Problem** (or the *constituency problem*). Your teacher is invoking the **All-Affected Principle (AAP)**, but as you've noticed, the slogan is ambiguous enough to mean almost anything depending on how you define the terms.

  In political theory, this isn't just semantics; the definition determines whether democracy is possible at all. If the *demos* (the people) changes with every single decision based on who is affected, you never have a stable group to vote on the rules of voting.

  Here is a menu of four distinct interpretations of "All affected interests should have a voice," ranging from trivial to radical. I have broken them down by how they define **"Affected,"** what **"Voice"** entails, and whether they support your teacher's conclusion about non-citizen voting.

  ### 1. The Causal-Consequentialist Reading (The Radical Version)
  *   **Definition of "Affected":** Any causal impact on a being's welfare or preferences. If a decision changes the outcome of your life (price of goods, temperature of the planet, noise levels), you are affected.
  *   **Definition of "Voice":** Full voting rights in the decision-making body.
  *   **Defensibility:** **Low.** This leads to the "infinite regress" problem. Since almost every political decision has ripple effects globally, the *demos* becomes "everyone on earth." It makes stable democracy impossible because the electorate changes completely for every bill. It also fails to explain why your dog *doesn't* vote (since the dog is causally affected by noise), unless you add a separate clause about "moral agency."
  *   **Does it support the teacher's conclusion?** **Yes, but too well.** It implies foreigners should vote on your climate laws, but it also implies your neighbors should vote on your dinner choices if they care about your health. It dissolves the nation-state entirely.

  ### 2. The Legal-Coercive Reading (The "All-Subjected" Principle)
  *   **Definition of "Affected":** Being **subjected to coercive authority**. You are not just "impacted" by the outcome; you are legally bound to obey the law under threat of punishment.
  *   **Definition of "Voice":** Full voting rights (to ensure legitimacy of the coercion).
  *   **Defensibility:** **High.** This is the standard liberal-democratic view. It solves the "dog" problem (dogs are not legal agents subject to criminal liability) and the "foreigner" problem (foreigners are not bound by your domestic criminal law). It creates a stable *demos* (the citizenry).
  *   **Does it support the teacher's conclusion?** **No.** Under this reading, a person in another country is *causally* affected by your climate policy, but they are not *coerced* by your legislature. They cannot be arrested by your police for violating your carbon tax. Therefore, they do not need a vote in your election.

  ### 3. The Fundamental-Interest Reading (The Human Rights Version)
  *   **Definition of "Affected":** Impact on basic human rights or essential welfare (life, liberty, subsistence), not just preferences or minor inconveniences.
  *   **Definition of "Voice":** Representation or Consultation, not necessarily a direct vote. This might mean transnational bodies, proxies, or judicial review rather than a ballot in a national election.
  *   **Defensibility:** **Medium.** It avoids the triviality of the Causal Reading (my preference for ice cream doesn't count) but acknowledges that some external impacts are too severe to ignore (e.g., a dam that floods a neighboring country).
  *   **Does it support the teacher's conclusion?** **Maybe, but not directly.** It suggests foreigners harmed by trade policy deserve *some* mechanism of recourse (e.g., an international tribunal or representation in a trade body), but it does not necessarily grant them the right to vote in *your* national election to choose *your* head of state.

  ### 4. The Stakeholder Membership Reading (The Civic Republican Version)
  *   **Definition of "Affected":** Having a "stake" in the long-term flourishing of the political community. This implies a reciprocal relationship, not just a one-way impact.
  *   **Definition of "Voice":** Voting rights reserved for those invested in the common good of that specific polity.
  *   **Defensibility:** **Medium-High.** This distinguishes between "being hit by a bullet" (affected) and "being part of the team" (stakeholder). It explains why teenagers might get a vote (they are future members) but tourists don't (even if a law affects them while they visit).
  *   **Does it support the teacher's conclusion?** **No.** It explicitly excludes non-citizens who do not share in the reciprocal burdens and benefits of the specific political community, even if they are negatively impacted by its externalities.

  ---

  ### The "Coercion" Distinction You Asked About
  You mentioned someone brought up "being subjected to coercive authority." This is a specific theoretical distinction between the **All-Affected Principle** and the **All-Subjected Principle**.

  *   **All-Affected:** Focuses on **outcomes**. (Did the decision change your life?)
  *   **All-Subjected:** Focuses on **authority**. (Does this government claim the right to punish you?)

  **Why this matters for your paper:**
  If your teacher is using the *All-Affected* principle, she logically cannot dismiss the dog example without being arbitrary. A dog is affected by noise ordinances. To exclude the dog, she must implicitly be switching to the *All-Subjected* principle (dogs aren't legal subjects) or the *Moral Agency* principle (dogs can't reason about the common good).

  However, if she switches to *All-Subjected* to exclude the dog, she undermines her argument for non-citizen voting. Foreigners are usually not *subject* to the coercive power of the state they are voting in. They feel the pain of the policy, but they are not under its legal jurisdiction.

  ### Verdict on Your Teacher's Claim
  Here is the disambiguation you can use to evaluate her argument:

  1.  **If she means Causal Impact:** Her claim holds (foreigners should vote), but the principle is indefensible because it includes dogs, future generations, and everyone on earth, making democracy administratively impossible.
  2.  **If she means Legal Coercion:** Her claim fails. Foreigners are not coerced by domestic law, so they don't get the vote. (But this explains why the dog doesn't vote).
  3.  **If she means "Voice" = Consultation:** Her claim is defensible. Foreigners harmed by climate policy should be *consulted* (via treaties or international bodies), but giving them a *vote* in a sovereign national election violates the self-determination of the existing citizenry.

  ### Summary for Your Paper
  Your teacher is likely treating "affected" as **causal impact** but treating "voice" as **voting** only for **humans with moral agency**, without acknowledging that these three criteria contradict each other.

  *   **To get the "Dog" result:** You need a restriction on *who* counts (moral agents/legal subjects).
  *   **To get the "Foreigner" result:** You need a broad definition of *affected* (causal impact).
  *   **The Conflict:** If you restrict *who* counts to solve the dog problem, you usually exclude the foreigners. If you broaden *affected* to include the foreigners, you usually include the dog.

  **The precise claim she is making:** She is arguing that **causal impact creates a moral claim to political membership.**
  **The counter-argument:** Causal impact creates a moral claim to *consideration* (human rights/consultation), but not necessarily to *membership* (voting sovereignty), unless that impact rises to the level of legal coercion.
