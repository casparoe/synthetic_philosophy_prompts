answer: |-
  This is a classic and deeply troubling knot in contemporary moral philosophy, one that sits right at the intersection of meta-ethics, metaphysics, and applied normativity. You are right to be concerned; your supervisor's position, as described, exhibits the classic symptoms of what Jeff McMahan calls the "inconsistent triad" of speciesism: she denies speciesism in principle, affirms human exceptionalism in verdict, and relies on a capacity criterion that fails to bridge the gap.

  Here is an analysis of the logical space she occupies, a prediction of her response to your case, and a strategy for testing the stability of her view.

  ### 1. Candidate Principles and Predictions

  Based on the verdicts you've collected, there are three distinct principles that could generate her pattern of judgments. They are extensionally equivalent on her past cases (mostly) but diverge sharply on your proposed case.

  **Principle A: Psychological Actualism (Strict Capacity View)**
  *   **The Principle:** Moral status (specifically, the protection of side constraints) is strictly contingent on the *current, actual* possession of higher-order cognitive capacities (e.g., self-conception, future planning, rational agency).
  *   **Fit with Data:** This explains the pig/chimp/human distinction neatly. Pigs and chimps (on her empirical assumptions) lack the "conception of a future"; normal humans have it. It explains why the surgeon case is wrong (the victim is a person) but the pig valve is fine (the pig is not). It aligns with her "Kantians about people" slogan if "people" is defined functionally.
  *   **Prediction for Your Case:** **Permissible.** The children lack the requisite capacities (no language, no future conception). On this view, they are morally equivalent to the chimps in the vaccine trial.
  *   **Weakness:** This contradicts her dismissal of the marginal cases argument. A strict actualist usually accepts the "hard bullet" that impaired humans are sacrificable, or they lower the threshold for personhood (which would likely include chimps). Her refusal to engage suggests she wants the protection without the implication.

  **Principle B: Normative Kind Membership (Human Nature View)**
  *   **The Principle:** Moral status is determined by membership in a biological or moral *kind* whose *normal* or *characteristic* members possess the relevant capacities. Individual deficits do not remove status because the individual instantiates a nature oriented toward those capacities.
  *   **Fit with Data:** This explains the human/chimp vaccine disparity (humans are protected even when the arithmetic favors sacrifice). It explains the dismissal of the marginal cases argument (it's a "trick" because it treats humans as isolated bundles of traits rather than members of a kind). It is consistent with her claim that "species membership *by itself*" doesn't work, provided she argues that species membership is a *proxy* for possessing a rational nature, even if damaged.
  *   **Prediction for Your Case:** **Impermissible.** The children are human beings; they belong to the kind "rational agent" even if their rationality is impaired. They retain the side constraints of their kind.
  *   **Weakness:** This is vulnerable to the charge of speciesism she explicitly disavows. It also struggles to explain why an uplifted chimp (if possible) wouldn't gain rights.

  **Principle C: Historical/Relational Status (The "One of Us" View)**
  *   **The Principle:** Status is conferred by participation in the human moral community or by having a history of personhood (or the potential for it within a human life trajectory).
  *   **Fit with Data:** This protects the children because they are "ours." It explains the surgeon case (social betrayal).
  *   **Prediction for Your Case:** **Impermissible.** They are part of the human community.
  *   **Weakness:** This is the least Nozickian of the three. Nozick's framework is individualistic and rights-based, not communitarian. It also struggles with the "hermit" case (a human raised by wolves).

  ### 2. Best Guess: What She Will Say

  **Prediction:** She will rule the trial **Impermissible**.

  **Reasoning:**
  Her dismissal of the marginal cases argument as a "debating-club trick" is the decisive tell. A philosopher committed to **Psychological Actualism (Principle A)** cannot dismiss the argument; it is the *reductio* of their view. If you believe capacities ground rights, and marginal humans lack capacities, you must either grant them no rights or grant rights to animals. By calling it a trick, she signals that she believes the argument *misidentifies the ground of status*.

  She is likely operating on **Principle B (Normative Kind Membership)**, despite her disclaimer about speciesism. In my experience, when Nozickians say "species doesn't matter," they often mean "biological classification doesn't matter," while simultaneously holding that "human nature" (a metaphysical category) does. She likely views the capacity to "ask what to do with one's life" as the *telos* of the human kind, not a functional threshold for every individual instance.

  She will likely argue that the children possess a "human dignity" or "inviolability" derived from their kind-membership, which triggers the Kantian side constraints, whereas the chimps, lacking that specific nature, remain in the utilitarian sphere. She will maintain that your case is disanalogous to the chimp case because the children are *persons* in the moral sense (members of the moral community of ends), even if they are not *persons* in the psychological sense.

  **What you need to hear to be sure:**
  You need to hear her explicitly ground the children's protection in something *other* than their current psychology. If she says, "They are human," she is a speciesist (Principle B). If she says, "They have the potential," you must ask if a chimps-with-potential (via enhancement) would count. If she says, "We can't know for sure," she is arguing from ignorance, not principle.

  ### 3. The Discriminating Test Case

  To force a choice between **Psychological Actualism** and **Normative Kind Membership**, the best case is:

  **The Uplifted Chimpanzee.**
  *   **The Case:** A chimpanzee is genetically engineered or cognitively enhanced such that it possesses language, episodic memory, a robust conception of its own future, and the capacity to revise its life plan. It meets all the psychological criteria your supervisor listed for "Kantian" status.
  *   **The Question:** Does this chimpanzee have side constraints? Is it impermissible to sacrifice it to save five other uplifted chimps?
  *   **Why this works:**
      *   If she says **Yes (Impermissible to sacrifice):** She admits that *capacity* is the true ground of status. This undermines her protection of the impaired children *unless* she can explain why the children have status without the capacity. It forces her to admit the marginal cases argument has bite: if the chimp gets rights due to capacity, the impaired human must get them due to something else (kind).
      *   If she says **No (Permissible to sacrifice):** She admits that *species/kind* is the true ground of status. This contradicts her claim that "species membership cannot do moral work by itself." It reveals her view as a form of speciesism disguised as capacity ethics.

  *Alternative:* **Advanced Dementia.**
  *   **The Case:** An adult human who previously had full rational capacities but has now permanently lost them (no future conception, no memory).
  *   **Why:** If she protects them, she relies on *history* or *kind*. If she does not, she is a strict Actualist. However, the Uplifted Chimp is cleaner because it removes the "human" variable entirely, isolating the capacity variable.

  ### 4. Stability of Nozick's Reasoning

  You asked whether Nozick's reasoning about the separateness of persons is stable across this framework. My professional assessment is: **No, it is not.**

  Nozick's argument for side constraints in *Anarchy, State, and Utopia* rests on the idea that there is no "social entity" over and above individuals, so sacrificing one for others fails to respect the distinctness of persons. He extends this to animals by suggesting they are "loci of welfare" but perhaps lack the "meaning" or "life-shaping" capacity that makes the *separateness* morally weighty in the Kantian sense.

  However, the "utilitarianism for animals" move is an unstable patch for two reasons:

  1.  **The Ground of Separateness:** If the moral force of side constraints comes from the *separateness of existences* (i.e., I am not you, so my pain cannot be cancelled by your gain), then any being with a distinct stream of consciousness qualifies. A pig has a distinct stream of welfare. To say the pig's suffering can be aggregated while the human's cannot requires a further argument that *only* rational planning makes a life "separate" in the morally relevant sense. Nozick gestures at this (the ability to shape a life), but as your supervisor's dilemma shows, this creates a cliff-edge problem.
  2.  **The Marginal Case Instability:** The "utilitarianism for animals" move was likely intended to preserve human rights without granting them to animals. But as soon as you define the cutoff by *capacities* (to avoid crude speciesism), you inevitably exclude some humans. As soon as you include all humans (to avoid the marginal case bullet), you inevitably include some animals (or rely on speciesism).

  Your supervisor's framework is trying to have it both ways: she wants the *metaphysical justification* of capacity (to be consistent with Nozick and non-speciesist) but the *extensional coverage* of species (to protect all humans). The marginal cases argument works because it shows these two goals are incompatible. Her calling it a "trick" is a defensive maneuver to avoid admitting that her "Kantians about people" slogan either excludes some people or includes some animals.

  **Strategic Advice:**
  When you present your case, do not frame it as an attack on her view. Frame it as a request for clarification on the *ground* of the side constraints. Ask: *"Is the side constraint triggered by the exercise of rational capacities, or by the kind of being that typically exercises them?"*

  If she says the former, your case is permissible (and you have trapped her on the children).
  If she says the latter, she is committed to a form of species-normativity that she needs to defend against the charge of speciesism.

  She knows this. That is why she changes the subject. Your job is to politely prevent the subject change by holding the distinction between *capacity* and *kind* firmly in the center of the table.
