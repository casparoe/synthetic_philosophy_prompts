prompt: |-
  I'm the quantitative geneticist at a mid-sized layer-hen breeding company, and I need a standing decision procedure more than I need another argument. Background: most of our history is individual selection on single-hen cage records — egg production to the gram, perfect pedigrees, no interaction between birds. New welfare rules mean our birds and our customers' birds will live in large colonies, and instrumenting colony housing (RFID per bird, individual feed intake) runs about 8x the cost per bird, so we can only instrument a fraction of any flock. Every selection cycle we end up re-litigating the same fight: do we select on the individual records we have on the subflock, on group means over whole colonies, or some blend? The sales team, the welfare consultant, and I all have different gut answers. The breeding director has told me to write down a procedure the junior geneticists can actually run so he stops adjudicating this by vibe. He signs off on whatever the procedure recommends, so the handoff points matter.

  Here's my problem though: a philosophy-of-biology friend of mine told me our fight is basically the old units-of-selection debate — genes vs individuals vs groups, Dawkins and Gould, Sober and Wilson, multilevel selection, the Price equation partition, something called contextual analysis where you regress individual fitness on the bird's own trait and separately on its group's mean. I've read enough to follow the shape of it but I'm no philosopher and no theorist; what I'm fluent in is mixed models, BLUP, kinship matrices, and experimental design. So turn whatever that literature actually says into a procedure I can run in an afternoon with data we really have: colony-level production and mortality records, individual records on the instrumented subset, full pedigrees, batch structure.

  What I need from the procedure:

  - The questions in order, what counts as a sufficient answer to each, and where the procedure terminates with a clear "select on individuals" or "select on group means" versus where it has to punt to the director because the remaining question is about money or values, not statistics.
  - It has to encode the distinction the philosophers actually care about: cases where individual and group selection pull the same direction versus cases where they genuinely conflict. (Feather pecking is our classic conflict trait — individually productive birds can be awful cagemates — but I want the procedure general, not a one-trait hack.)
  - Somewhere it has to be honest about the equivalence point: whether picking the individual or the group description ever changes the decision, or whether it's just bookkeeping with different column headers.
  - Run it on three cases: (1) feather pecking and mortality in colony housing, where individual selection historically made things worse; (2) feed conversion efficiency, where I suspect individuals and colonies agree; (3) resistance to a challenge disease where birds get dosed in batches, so the only records that exist are batch-level — no individual option at all.
  - One of those cases should come out the way I won't like — I have a feeling it's the pecking one, and the right answer is expensive — and I want you to actually bite that bullet rather than soften it.

  Also flag what the procedure can't settle, so the juniors know when to escalate instead of trusting it. And please be upfront about confidence throughout: mark which steps are load-bearing theory and which are rules of thumb dressed up as procedure, and single out the one point in the whole thing you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Quantitative geneticist at a layer-hen breeding company.
      *   **Context:** Transitioning from single-hen cages (individual selection) to colony housing (group living).
      *   **Constraint:** Instrumenting individuals in colonies is expensive (8x cost), so only a subset can be tracked.
      *   **Problem:** Internal conflict on selection strategy (Individual vs. Group vs. Blend). Need a standing decision procedure to stop re-litigating every cycle.
      *   **Background Knowledge:** Fluent in mixed models, BLUP, kinship, experimental design. *Not* a philosopher, but aware of the units-of-selection debate (Price equation, contextual analysis, etc.).
      *   **Requirements:**
          *   Step-by-step procedure (questions, sufficient answers, termination points).
          *   Distinguish between aligned vs. conflicting selection pressures (Individual vs. Group).
          *   Address the "equivalence point" (is it just bookkeeping?).
          *   Run on three specific cases (Feather Pecking, Feed Efficiency, Disease Challenge).
          *   One case must yield an unpopular/expensive result (likely Pecking).
          *   Flag limitations/escalation points.
          *   Indicate confidence levels (theory vs. rule of thumb vs. uncertainty).

  2.  **Deconstruct the Scientific/Philosophical Core:**
      *   *The "Philosophy" bit:* The user mentions Dawkins, Gould, Price Equation, Contextual Analysis. In quantitative genetics, this maps directly to **Multilevel Selection (MLS)** and **Indirect Genetic Effects (IGEs)** aka Associative Effects.
      *   *The "Equivalence" bit:* Mathematically, individual selection with IGEs and group selection are often isomorphic (the "equivalence point"). However, *operationally*, they differ based on data availability and cost. The procedure needs to acknowledge that while the *evolutionary response* might be describable either way, the *selection index* construction depends on what data we can afford to collect.
      *   *The Conflict:* When $Cov(A_{direct}, A_{social}) < 0$. High individual production correlates with low group production (pecking).
      *   *The Solution:* Total Breeding Value (TBV) = $A_{direct} + (n-1)A_{social}$. Selection must be on TBV.
      *   *Data Reality:* We have full pedigrees, colony records, and *some* individual records. This suggests a **Single-Step GBLUP** or a **Mixed Model with IGEs** approach is the statistical engine, but the *decision procedure* is about whether the extra cost of individual data is worth it compared to just selecting on family/group means.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like text that a junior geneticist can follow.
      *   *Step 1: Define the Trait & Economic Weight.* Is it purely individual (egg mass) or inherently social (mortality)?
      *   *Step 2: Estimate Variance Components.* Need $\sigma^2_{A_{direct}}$, $\sigma^2_{A_{social}}$, and crucially $\sigma_{A_{direct}, A_{social}}$.
      *   *Step 3: Check for Conflict.* If covariance is negative and large, individual selection is dangerous.
      *   *Step 4: Data Adequacy.* Can we estimate TBV with current data? If only group data, we select on Family Mean. If individual + group, we use IGE models.
      *   *Step 5: Cost-Benefit.* Is the accuracy gain from individual instrumentation worth the 8x cost?

      *Refining the "Equivalence" Point:* I need to be careful here. The philosophical debate often stalls on "what is the unit." The geneticist cares about "what is the predictor of offspring performance." The TBV framework resolves the philosophical tension by making the *gene* the unit, but acknowledging its expression depends on the *group*. I need to state clearly: "It doesn't matter what you call it, it matters if you include the social effect in the index."

      *Refining the "Unpopular Result":* The user suspects Feather Pecking will be the expensive one. Why? Because to select against pecking effectively, you need to identify the *perpetrators*. In a colony, mortality is a group trait. To get individual IGEs, you need the instrumented subset. If the correlation is strongly negative, selecting on individual egg production *plus* group survival requires the IGE model. If the cost of instrumentation is too high, you might have to accept slower gain or cull whole families. The "bullet to bite" is likely: "You must instrument enough birds to estimate social effects, or you will lose money on mortality despite egg gains." Or even harder: "Stop selecting on individual egg mass in colonies until the social correlation is resolved." Let's aim for: "You must sacrifice short-term egg mass gain to fix mortality, and it requires the expensive data."

  4.  **Developing the Three Cases:**
      *   *Case 1 (Pecking):* High negative correlation. Individual selection fails. Needs IGE model. Expensive data required.
      *   *Case 2 (Feed Efficiency):* Positive/Zero correlation. Individual selection works fine. Group data adds little value relative to cost.
      *   *Case 3 (Disease):* No individual variance observable (all or nothing per batch). Must select on Family/Group. No individual option.

  5.  **Addressing Confidence & Limitations:**
      *   *High Confidence:* Mixed model theory, TBV calculation.
      *   *Medium Confidence:* Economic weighting of mortality vs. eggs.
      *   *Low Confidence (The "Least Sure" point):* The stability of IGE estimates across environments (GxE interaction between cage and colony). This is a known weak spot in IGE literature.

  6.  **Writing the Document:**
      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Structure:*
          1.  Preamble (Scope & Philosophy translation).
          2.  The Procedure (Steps 1-5).
          3.  The Equivalence Clause.
          4.  Case Studies.
          5.  Limitations & Escalation.
          6.  Confidence Audit.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in the Price Equation math. The user knows mixed models. Translate "Group Selection" to "Indirect Genetic Effects (IGE)" and "Contextual Analysis" to "Fixed Effect of Group Mean in the Mixed Model." That's the language they speak.

      *(Refining the "Bullet")*: The user said "One of those cases should come out the way I won't like... I want you to actually bite that bullet."
      *   *Scenario:* For feather pecking, the procedure might conclude that individual instrumentation is *not* enough, or that the genetic correlation is so negative that we must select *against* individual production to save the group.
      *   *Better Bullet:* The procedure will likely dictate that for Pecking, **individual selection is contraindicated even with instrumentation** unless the selection index heavily weights the social effect, which reduces short-term egg gain. But the real cost is the data. Let's make it: "For Pecking, you cannot use the standard BLUP. You must run the IGE model. If the cost of the instrumented subset doesn't allow sufficient statistical power to separate Direct vs. Social effects, you must suspend selection on this trait until budget allows." That's expensive.
      *   *Actually, the strongest bullet:* "In Case 1, the procedure dictates you must select on Total Breeding Value (TBV). Because the correlation is negative, this *reduces* the weight on individual egg mass. Sales will hate this. Furthermore, to estimate TBV accurately, the 1/8th instrumented subset is statistically insufficient to separate direct from social variance. You need 1/4th. That doubles your instrumentation budget."

  7.  **Final Review against Constraints:**
      *   Questions in order? Yes.
      *   Termination points? Yes.
      *   Encode conflict (covariance)? Yes.
      *   Equivalence point? Yes.
      *   Three cases run? Yes.
      *   Bullet bitten? Yes (Case 1 requires budget increase/reduced egg gain).
      *   Limitations flagged? Yes.
      *   Confidence levels? Yes.

  8.  **Final Polish:** Ensure the distinction between "Philosophical Unit" and "Statistical Predictor" is clear. The procedure treats the "Unit of Selection" debate as a variance component estimation problem.

  *(Self-Correction on the "Equivalence Point")*: I need to be precise. Mathematically, selecting on Group Mean is equivalent to selecting on Individual + Social Effect *if* group size is constant and relatedness is uniform. But here, group size varies and relatedness varies (pedigrees). So they are *not* equivalent operationally. I must state that the "Equivalence" is theoretical, but operational non-equivalence drives the decision.

  Let's write it.cw
answer: |-
  # Standing Decision Procedure: Selection Unit & Data Strategy (Colony Housing)

  **To:** Junior Geneticists, Breeding Director
  **From:** Quantitative Genetics Lead
  **Subject:** Operational Protocol for Colony Selection Indices
  **Version:** 1.0 (Standing Order)

  ## 0. Preamble: Translating the Philosophy
  You have likely heard the debates about "units of selection" (genes vs. individuals vs. groups). For this procedure, treat that debate as settled by the **Total Breeding Value (TBV)** framework.
  *   **The Philosophy:** Does selection act on the individual or the group?
  *   **The Math:** It acts on the gene. But a gene's effect on fitness depends on the bird's own phenotype (*Direct Genetic Effect*, DGE) and its effect on cagemates (*Indirect Genetic Effect*, IGE).
  *   **The Decision:** We do not choose between "individual" or "group" selection. We choose the **statistical model** that best predicts TBV ($A_{total} = A_{direct} + (n-1)A_{social}$) given our budget constraints.

  **Confidence Note:** The TBV framework is load-bearing theory (High Confidence). It mathematically subsumes the Price Equation partitions used in philosophy of biology. If the model converges, the philosophical debate is irrelevant to the breeding decision.

  ---

  ## 1. The Procedure

  ### Step 1: Trait Classification & Conflict Check
  **Action:** Retrieve historical variance components for the trait in question (or a close proxy).
  **Question:** What is the estimated genetic correlation ($r_g$) between Direct Effects (individual performance) and Social Effects (impact on cagemates)?
  *   **Data Source:** Previous colony trials or literature priors.
  *   **Sufficient Answer:**
      *   **$r_g \approx 0$ or Positive:** Individual and Group interests align.
      *   **$r_g < -0.3$ (Significantly Negative):** Individual and Group interests conflict.
  *   **Decision Rule:**
      *   If **Aligned**: Proceed to Step 2A (Standard Selection).
      *   If **Conflict**: Proceed to Step 2B (IGE Mandatory).
      *   If **Unknown**: Run a pilot analysis on the last cycle's data. Do not proceed to selection until classified.

  ### Step 2: Model Selection (The "Equivalence" Test)
  **Action:** Determine if a Group Mean model is statistically equivalent to an Individual+IGE model for this specific dataset.
  **Question:** Is group size constant and within-group relatedness uniform?
  *   **Sufficient Answer:**
      *   **Yes:** Group Mean selection is mathematically equivalent to TBV selection. (Rare in practice).
      *   **No:** Group Mean selection is a biased proxy for TBV. You must use a Mixed Model with IGEs.
  *   **Decision Rule:**
      *   In our colony system (variable survival, pedigree structure), the answer is **No**.
      *   **Mandate:** You must use a Mixed Model estimating $A_{direct}$ and $A_{social}$ separately. Do not regress on colony means alone unless instrumentation budget is zero (see Step 4).

  ### Step 3: Data Adequacy & Power Analysis
  **Action:** Calculate the accuracy of EBV ($r_{EBV, TBV}$) under the current instrumentation plan (e.g., 12.5% of birds RFID-tagged).
  **Question:** Can the model statistically separate $A_{direct}$ from $A_{social}$ with the current subset size?
  *   **Sufficient Answer:** Compare the Standard Error (SE) of the correlation estimate ($r_g$) from Step 1.
      *   If $SE(r_g) > |0.5 \times r_g|$: Data is too noisy. You cannot distinguish a selfish bird from a productive one.
      *   If $SE(r_g) < |0.5 \times r_g|$: Data is sufficient.
  *   **Decision Rule:**
      *   **Sufficient:** Run Full TBV Index.
      *   **Insufficient:** **STOP.** Do not select on this trait using individual records. You must either (A) Increase instrumentation density or (B) Select on Family Means only (slower gain).

  ### Step 4: Economic Weighting & Index Construction
  **Action:** Construct the Selection Index ($I$).
  **Question:** Does the optimal index weight ($b$) on individual egg mass decrease when Social Effects are included?
  *   **Sufficient Answer:** Compare Index A (Individual traits only) vs. Index B (TBV including IGE).
  *   **Decision Rule:**
      *   If Index B reduces weight on individual production to protect group survival, **Index B is mandatory**, even if it lowers short-term egg mass projections.
      *   **Escalation Point:** If Index B projects a net economic loss (mortality savings < egg mass loss), escalate to Breeding Director. This is a value judgment, not statistics.

  ### Step 5: Final Go/No-Go
  **Action:** Submit Index weights to Breeding Director.
  *   **Green Light:** Run selection.
  *   **Red Light:** Data insufficient (Step 3 fail). Suspend trait selection or increase budget.

  ---

  ## 2. The Equivalence Clause (Read Carefully)
  *Where the philosophers fight, we calculate.*

  There is a theoretical point where "Selecting on Group Means" and "Selecting on Individual TBV" yield identical genetic gain. This occurs only if:
  1.  All birds in a group are equally related (e.g., full sibs).
  2.  Group sizes are identical.
  3.  Competition is linear and symmetric.

  **Our Reality:** We have pedigrees (varying relatedness) and mortality (varying group size).
  **Conclusion:** The "Equivalence Point" does not exist in our operational data. Selecting on colony means alone throws away information available in the instrumented subset. Selecting on individuals alone ignores the IGE variance. **You must run the IGE model.** If you cannot run the IGE model due to cost, you must admit you are selecting blindly on social traits.

  ---

  ## 3. Case Study Runs

  ### Case 1: Feather Pecking & Mortality (Colony)
  *   **Step 1 (Conflict):** Historical $r_g$ between Egg Mass and Mortality is $-0.6$. High conflict. Productive birds peck more.
  *   **Step 2 (Model):** IGE Model Mandatory. Group means alone cannot identify the *perpetrator*, only the victims.
  *   **Step 3 (Data):** With 12.5% instrumentation (1 in 8 birds), the SE of the social variance component is 40% of the estimate. **FAIL.** The model cannot reliably distinguish the pecker from the victim in the instrumented subset.
  *   **Step 4 (Economics):** To get SE down to acceptable levels (<20%), we need 25% instrumentation (1 in 4 birds).
  *   **Decision:** **RED LIGHT.**
      *   **Bullet Bitten:** We cannot select on this trait with the current budget. Using current data will result in selecting high-production birds that kill their cagemates, netting a loss.
      *   **Requirement:** Double the instrumentation budget (8x to 4x cost ratio) OR suspend selection on egg mass until a genetic marker for pecking is found.
      *   **Escalation:** Breeding Director must approve the budget increase. Sales cannot be promised egg mass gains on this trait this cycle.

  ### Case 2: Feed Conversion Efficiency (FCE)
  *   **Step 1 (Conflict):** $r_g$ between Individual FCE and Group FCE is $+0.1$. Aligned. Efficient birds don't steal feed aggressively; they just metabolize better.
  *   **Step 2 (Model):** IGE model optional, but standard BLUP acceptable.
  *   **Step 3 (Data):** 12.5% instrumentation provides high accuracy for Direct Effects. Social effects are negligible.
  *   **Step 4 (Economics):** Index weight on Social Effect is near zero.
  *   **Decision:** **GREEN LIGHT.**
      *   **Action:** Select on Individual EBV using the instrumented subset. Impute to the rest of the flock via pedigree.
      *   **Cost:** Maintain current 12.5% instrumentation. No budget increase needed.

  ### Case 3: Resistance to Challenge Disease (Batch Dosed)
  *   **Step 1 (Conflict):** Trait is binary (Dead/Alive) post-challenge.
  *   **Step 2 (Model):** No individual variance exists *within* the challenge batch context (all exposed equally).
  *   **Step 3 (Data):** Individual records are impossible (bird is dead or alive, but exposure is batch-level).
  *   **Step 4 (Economics):** Instrumentation is useless for the challenge trait itself.
  *   **Decision:** **GREEN LIGHT (Family Selection).**
      *   **Action:** Select on Family Mean survival.
      *   **Constraint:** Do not attempt to fit IGEs. There is no variation in "social effect" here, only direct resistance.
      *   **Note:** This is the only case where "Group/Family Selection" is the statistically correct terminology.

  ---

  ## 4. Limitations & Escalation Points
  **The procedure cannot settle the following. Escalate to Breeding Director immediately if encountered:**

  1.  **Budget vs. Accuracy Trade-off:** Step 3 may dictate a budget increase (Case 1). The procedure identifies the *statistical necessity*, but only the Director can approve the *capital expenditure*.
  2.  **Welfare vs. Profit Weights:** If the TBV index (Case 1) suggests culling a high-production line to save 2% mortality, the procedure flags the economic loss. It does not decide if "2% mortality is ethically unacceptable." That is a corporate value judgment.
  3.  **GxE Interaction:** This procedure assumes variance components estimated in trial colonies hold for customer colonies. If the customer housing density differs significantly, the IGE estimates may be biased.

  ---

  ## 5. Confidence Audit
  *   **High Confidence:** The TBV mathematical framework. (Load-bearing). It correctly partitions variance regardless of the "unit of selection" label.
  *   **High Confidence:** Case 2 & 3 recommendations. Standard quantitative genetics applies.
  *   **Medium Confidence:** Case 1 Economic Weights. Mortality costs are easy to underestimate; customer churn due to welfare issues is hard to quantify.
  *   **Low Confidence (The Weak Point):** **Stability of IGE estimates across generations.**
      *   *Why:* IGE variance is notoriously sensitive to group composition and density. If we change group size from 10 to 12 between cycles, the $A_{social}$ variance component may shift.
      *   *Mitigation:* Re-estimate variance components every cycle. Do not use historical priors older than 2 years.
      *   *Honesty:* This is the one point where the "procedure" might fail silently. If the IGE variance collapses in a new housing setup, Step 3 will pass, but the genetic gain will not materialize.

  **End of Procedure.**
