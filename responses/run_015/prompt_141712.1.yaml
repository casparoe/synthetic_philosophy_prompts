  *(Self-Correction on "Third Parties")*: The prompt asks to identify the third parties. I need to list them explicitly: Funding agencies (what counts as promising?), Journals (what counts as evidence?), Courts (expert testimony), Curriculum (what concepts are foundational?).

  *(Self-Correction on Alternative Analogies)*: The prompt asks if they smuggle in a verdict. I need to analyze *Cartography* carefully. A map is of the territory (world), used by the navigator (scientist). This preserves the realist intuition physicists like.

  9.  **Final Output Structure:**
      1.  The Audit (Mapping the Analogy).
      2.  The Disanalogies (Weinberg, Object of Study, Third Parties/Epistemic Agency).
