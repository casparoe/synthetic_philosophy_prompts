      *   **Deadline:** Recommendation needed by early October.
      *   **Key Debate:** Can/should a college apologize for past actions by different people? Does an apology need material action to be meaningful?
      *   **Constraints:** Two pages (approx. 800-1000 words), professional tone, decisive recommendation, addresses counterarguments seriously.

