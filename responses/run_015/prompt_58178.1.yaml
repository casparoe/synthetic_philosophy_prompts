  **MEMORANDUM**

  **TO:** Legacy Review Group
  **FROM:** [Your Name/Role]
  **DATE:** October 3, 2023
  **SUBJECT:** Recommendation for Founders Day Observance and Legacy Remediation

  **Executive Summary**
  This memo recommends the College adopt a **"Truth-Led Restitution"** model regarding the 1969 land sale in the historically Black neighborhood adjacent to campus. We must proceed with a **formal Presidential apology at Founders Day** and the installation of a **permanent historical exhibit in the library lobby**, funded alongside a **targeted scholarship for descendants and neighborhood residents.**

  This is not a compromise between the Descendants Group and the Board. It is an ethical necessity. Offering a scholarship without an apology treats the harm as a charitable gap rather than an institutional debt. Offering an apology without material investment treats the harm as rhetorical rather than structural. We must do both, but the *apology* must lead. The library was built with these proceeds; it must now house the truth.

  **Context and Ethical Imperative**
  In 1969, the College sold land to a developer, facilitating the clearance of several blocks for student housing that was never constructed. The proceeds funded our current library. Today, that library stands as the academic heart of our campus, while the neighboring community bears the scar of that displacement.

  The Descendants Group requests truth-telling (apology + exhibit). The Trustees suggest erasure (scholarship + "partnership" plaque). Erasure is not an option for an educational institution. If we claim to value inquiry and history, we cannot hide the history of our own infrastructure. To label a sale that resulted in displacement as a "community partnership" is historically inaccurate and damages our academic integrity.

  **Addressing the Primary Objection: Institutional Guilt and "Cheap Talk"**
  The strongest objection to this recommendation comes from well-meaning trustees who argue that current stakeholders bear no guilt for 1969 decisions, and that an apology is either "cheap talk" or, if paired with money, an attempt to "buy forgiveness."

  We must address this head-on:
  1.  **Stewardship vs. Guilt:** An institution is not a person; it is a promise that persists across time. We are not apologizing because we are personally guilty, but because we are the current *stewards* of the College's reputation and relationships. We inherit both the assets (the library) and the liabilities (the broken trust) of our predecessors. Acknowledging this is not self-flagellation; it is responsible governance.
  2.  **The "Cheap Talk" Concern:** The trustees are correct that words without action are hollow. That is why this recommendation *includes* the scholarship. However, money without truth is not restitution; it is hush money. A scholarship labeled "Community Partnership" implies we worked together. We did not. We took. A scholarship labeled "Restitution" or "1969 Legacy" acknowledges the debt. Without the apology, the scholarship loses its moral weight and becomes transactional. We are not buying forgiveness; we are investing in opportunity to honor a debt that cannot be fully repaid.

  **Implementation Plan**
  To meet the Founders Day timeline and ensure long-term impact, we propose the following phased approach:

  **Phase 1: Founders Day (Immediate)**
  *   **Action:** The President reads a formal statement of acknowledgment and apology during the main ceremony.
  *   **Content:** The statement will explicitly name the 1969 sale, acknowledge the displacement, and clarify that the library was funded by these proceeds. It will avoid defensive language regarding "context of the times" and focus on the impact on the neighborhood.
  *   **Responsibility:** Office of the President (Drafting); Legacy Group (Fact-checking); Descendants Group (Review).

  **Phase 2: The Library Exhibit (Spring Semester)**
  *   **Action:** Installation of a permanent, curated display in the library lobby.
  *   **Content:** Archival photos of the neighborhood pre-1969, documents regarding the sale, and oral histories from displaced families.
  *   **Responsibility:** College Archives (Curating); History Department (Contextualizing); Descendants Group (Consultation on narrative).

  **Phase 3: The Legacy Scholarship (Next Fiscal Year)**
  *   **Action:** Endowment of a scholarship fund.
  *   **Criteria:** Priority given to descendants of the displaced families and residents of the specific neighborhood blocks, designated as first-generation students.
  *   **Funding:** Re-allocation from existing development funds or a targeted donor campaign launched *after* the apology.
  *   **Responsibility:** Advancement Office (Fundraising); Financial Aid (Administration).

  **Conclusion**
  We are stuck because we are treating this as a PR problem. It is not. It is a mission problem. We cannot claim to be a place of truth while hiding the origin of our most prominent building.

  If we choose the Trustees' path (Scholarship only), we gain short-term comfort but risk long-term scandal when the full history inevitably surfaces. If we choose the Descendants' path (Apology + Exhibit) but fail to fund the scholarship, we validate the "cheap talk" critique.

  The "Truth-Led Restitution" path is the only one that aligns our actions with our educational values. It accepts that while we did not break the trust, it is our responsibility to repair it. I recommend we vote to proceed with the Presidential Apology and Exhibit as the non-negotiable foundation for Founders Day, with the Scholarship committed as the immediate follow-through.

  **Recommendation:** **APPROVE** the Truth-Led Restitution Model.
