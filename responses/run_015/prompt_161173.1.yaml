answer: |-
  # Clinical Ethics Consult: Diagnostic Tree for the "Killing / Letting Die" Distinction

  **Instructions:** Start at **Q1**. Follow the path dictated by your intuitive judgment on the specific case in front of you. The **Leaf** you reach describes the moral account you are implicitly using.

  **Q1. Patient Refusal:** Is a capacitated patient (or valid surrogate) refusing the intervention that would sustain life?
  *   **YES** → **LEAF 1: The Autonomy Account.** (The distinction rests on rights, not physics. Refusal makes death "letting die" regardless of mechanism.)
  *   **NO** → Go to Q2.

  **Q2. Threat Origin:** Is the immediate lethal threat the underlying disease or an iatrogenic complication (something the team broke/caused)?
  *   **IATROGENIC** → Go to Q3.
  *   **DISEASE/NATURAL** → Go to Q4.

  **Q3. Dependence Creation:** Did *this* team (or role) initiate the specific dependence that is now being withdrawn (e.g., the surgeon who implanted the device)?
  *   **YES** → **LEAF 2: The Restorative Duty Account.** (If we created the dependence, withdrawing is "killing" or impermissible until restored.)
  *   **NO** → **LEAF 3: The Role-Based Account.** (Duties are generic; withdrawing is "letting die" even if the threat is iatrogenic, provided we didn't start the support.)

  **Q4. Physical Interface:** Does causing death require a *new* muscular movement (injection, cutting) vs. stopping an existing intervention?
  *   **NEW MOVEMENT** → **LEAF 4: The Strict Causal Account.** (Killing is defined by new physical force. Stopping is always letting die.)
  *   **STOPPING/WITHHOLDING** → Go to Q5.

  **Q5. Maintenance Nature:** Does the treatment require continuous active resetting (alarms, pump re-arming, 24hr orders) vs. a one-time setup?
  *   **CONTINUOUS RESET** → Go to Q6.
  *   **ONE-TIME/PASSIVE** → Go to Q7.

  **Q6. Reset Interpretation:** Is failing to re-arm an *omission* or the *end of an ongoing act*?
  *   **END OF ACT** → **LEAF 5: The Continuous Act Account.** (Maintenance is a series of actions; stopping is killing.)
  *   **OMISSION** → Go to Q7.

  **Q7. Agency Split:** Is the moral decision made by one clinician and the physical act performed by another (or one disconnects, another declines to reconnect)?
  *   **YES (SPLIT)** → Go to Q8.
  *   **NO (SAME)** → Go to Q9.

  **Q8. Moral Locus:** Does the moral label attach to the *decider* or the *hand*?
  *   **THE DECIDER** → **LEAF 6: The Distributed Agency Account.** (Responsibility follows the order; the physical actor is an instrument.)
  *   **THE HAND** → **LEAF 7: The Instrumental Account.** (Responsibility follows the muscle movement; the decider is distinct from the killer.)

  **Q9. Intention:** Is the patient's death the *means* to relieve suffering or a foreseen *side effect* of stopping burden?
  *   **MEANS** → **LEAF 8: The Intentional Account.** (Killing is defined by the goal, not the physics. DDE applies.)
  *   **SIDE EFFECT** → Go to Q10.

  **Q10. Process Burden:** Is the dying process significantly more prolonged or suffering-filled than a quick death (e.g., 3 weeks starving vs. 3 mins extubation)?
  *   **YES (HIGH BURDEN)** → **LEAF 9: The Consequentialist Account.** (If "letting die" is uglier than killing, the distinction collapses or flips.)
  *   **NO (LOW BURDEN)** → **LEAF 10: The Standard Naturalist Account.** (Death by disease process after stopping intervention is paradigmatic "letting die".)

  ***

  ### Unoccupied Combinations & Indistinguishable Leaves

  **Unoccupied Combinations:**
  *   **Q3 (YES) + Q4 (NEW MOVEMENT):** *Unattractive.* Few argue that restoring a dependence you created requires *new* force to be killing, but stopping it is not; usually, the duty binds regardless of physics.
  *   **Q6 (END OF ACT) + Q10 (LOW BURDEN):** *Incoherent.* If you view maintenance as an ongoing act, stopping it is killing; claiming it is killing but morally neutral because the death is quick undermines the "Act" classification.
  *   **Q8 (THE HAND) + Q9 (MEANS):** *Neglected.* Rare to argue the physical actor is the killer when they had no intent, while the decider who intended death is exempt.

  **Indistinguishable Leaves:**
  *   **Leaf 4 (Strict Causal) & Leaf 10 (Standard Naturalist):** In 90% of ICU cases, these yield the same verdict. They only separate when "stopping" involves complex mechanics (e.g., turning a dial vs. pulling a plug).
  *   **Leaf 6 (Distributed Agency) & Leaf 8 (Intentional):** Both locate responsibility in the mind of the decider. They separate only when the decider lacks intent but holds authority.

  ***

  ### Top Paragraph for Handout

  **Where Our Disagreements Actually Live**
  Most of our conflict does not stem from the law or from "intent." It stems from **Node 5 and 6 (Maintenance vs. Omission).** We agree that pulling a plug is "letting die," but we fracture on whether *failing to re-arm an alarm* or *letting a 24-hour order expire* is the same moral thing as pulling the plug. If you view life-support as a continuous series of actions, withdrawing it looks like killing. If you view it as a single state that persists until revoked, withdrawing it looks like omitting. Before arguing the outcome, ask: "Are we treating this machine as a bridge we built, or a treatment we are currently giving?" That answer predicts your verdict better than any principle.
