answer: |-
  Here is a plan for the seventy-five-minute session, designed to treat the Common Prior Assumption (CPA) as a modeling constraint rather than an empirical hypothesis.

  ### I. Order and Dependencies

  The dependency chain must prevent the mathematical definition from collapsing into the intuitive (and often wrong) story.

  1.  **State Space ($\Omega$) and Partitions ($\mathcal{P}_i$):** Must be on the board first. You cannot define a prior without a domain, and you cannot define posteriors without information structures.
  2.  **Posteriors as Random Variables:** Before stating the CPA, you must define the posterior $q_i(E, \omega)$ not as a number the agent holds, but as a function from $\Omega \to [0,1]$.
      *   *Why:* If posteriors are numbers, "common knowledge of posteriors" is category error. They must be functions constant on partition cells to be knowable.
  3.  **The Prior (Bookkeeping Reading):** Define $p$ as a measure on $\Omega$ such that $q_i(E, \omega) = p(E | \mathcal{P}_i(\omega))$.
      *   *Dependency:* Requires 1 and 2.
      *   *Placement:* Minute 15. Do not motivate this with "shared history." Motivate it with "consistency of conditioning."
  4.  **Meet Machinery (Self-Evident Events):** Define the meet of the partitions $\mathcal{M} = \mathcal{P}_1 \wedge \mathcal{P}_2$. Define an event as common knowledge iff it is a union of cells in $\mathcal{M}$ (or contains the cell of the true state).
      *   *Placement:* Minute 30.
      *   *Argument:* This must come *before* the Agreement Theorem. If you state the theorem first, the meet looks like a proof trick. If you define the meet first, the theorem becomes a tautology of the definition (constants on a set must be equal if they are common knowledge *and* derived from a common measure).
  5.  **The Agreement Result:** "If posteriors are common knowledge, they are equal."
      *   *Placement:* Minute 45.
  6.  **The Three Readings (Sequenced):**
      *   **Ancestral (The Folk Theory):** Introduce at **Minute 5**. "You likely think this means agents met at $t=0$ and agreed. Shelve that. It is not required for the math." *Risk if collapsed:* Students treat the theorem as a historical claim.
      *   **Bookkeeping (The Math):** Introduce at **Minute 15**. "This is a single measure $p$ that generates the conditionals." *Risk if collapsed:* Students think the measure is 'real' rather than a representation.
      *   **Adjudicative (The Interpretation):** Introduce at **Minute 60**. "This is the modeling stance: we attribute disagreement to information, not to the priors." *Risk if collapsed:* Students think the model *proves* disagreement is irrational, rather than that the model *assumes* it away to isolate information.

  ### II. The Example: The Coalition Whip

  **Scenario:** Two party whips (Agent 1, Agent 2) assessing whether a minority government will survive a confidence vote (Event $E$).
  **State Space:** $\Omega = \{1, 2, 3, 4, 5, 6\}$. Each state represents a configuration of backbench loyalties.
  **Partitions:**
  *   Whip 1 ($\mathcal{P}_1$): $\{\{1, 2\}, \{3, 4\}, \{5, 6\}\}$ (Knows region, not specific seat).
  *   Whip 2 ($\mathcal{P}_2$): $\{\{1\}, \{2, 3\}, \{4, 5\}, \{6\}\}$ (Knows specific seats in some regions, aggregated in others).
  *   *Property Check:* Non-nested. Meet requires iteration.
  *   *Meet Calculation:*
      *   Start at 2. $\mathcal{P}_1(2)=\{1,2\}$. $\mathcal{P}_2(1)=\{1\}, \mathcal{P}_2(2)=\{2,3\}$.
      *   Iteration 1: 2 knows 1 is in $\{1,2\}$. 1 knows 2 is in $\{1\}$ or $\{2,3\}$.
      *   Iteration 2: Connects $\{1,2\}$ to $\{2,3\}$ to $\{3,4\}$...
      *   *Result:* The meet is the trivial partition $\{\Omega\}$ (everyone is connected). This ensures that if posteriors are common knowledge, they are constant everywhere.
  **Posteriors (With Prior):**
  *   Assume a uniform prior $p(\omega) = 1/6$.
  *   Calculate $q_1(E)$ and $q_2(E)$. Show that if they differ, they cannot be common knowledge (because the meet is $\Omega$, so CK implies constant, implies equal).
  **Posteriors (Without Prior - The Contrast):**
  *   *Crucial Move:* Keep $\Omega$ and $\mathcal{P}_i$ identical. Drop $p$.
  *   Assign $q_1(E, \omega) = 0.6$ for all $\omega$.
  *   Assign $q_2(E, \omega) = 0.8$ for all $\omega$.
  *   *Observation:* These posteriors are constant on $\Omega$, hence Common Knowledge (both know both know...). But they differ.
  *   *Lesson:* The partitions alone do not force agreement. The **Prior** forces agreement.

  **Why these properties?**
  *   **Political:** Validates the formalism as a tool for their field, not just probability theory.
  *   **No Trade:** Prevents conflation with No-Trade Theorems (which require risk aversion/utility). We want pure epistemology.
  *   **Non-Nested:** Prevents the "one agent is strictly better informed" shortcut.
  *   **Reusable without Prior:** Demonstrates that CPA is the *active constraint*, not the information structure.
  *   **Shared Support:** Ensures the failure of CPA isn't just "Agent 2 thinks State 1 is impossible." It must be a disagreement on probabilities of possible states.

  ### III. Misconception Map

  | Misconception | Minute | The Move (Sentence/Gesture) |
  | :--- | :--- | :--- |
  | **CPA = Common Knowledge of Model** | 15 | "Agents need not know $p$; the *modeler* uses $p$ to generate their beliefs." |
  | **Empirical Claim (Culture/Experience)** | 5 | "This is not a claim about socialization; it is a consistency condition on the description of beliefs." (Underline "Description"). |
  | **Hypothetical Meeting ($t=0$)** | 5 | "No moment of agreement is required; only a measure that rationalizes current conditionals." |
  | **Rationality Requirement** | 50 | "Differing priors are not irrational; they are simply exogenous to this model class." (Write "Exogenous" next to Prior). |
  | **Trade Refutes CPA** | 60 | "Trade refutes CPA *plus* Risk Neutrality *plus* Common Knowledge of Trades. CPA alone allows silence." |
  | **Prior Must Be Uniform** | 20 | Write a non-uniform $p$ on the board. "Any measure works, provided it is shared." |
  | **Disagreement is Impossible** | 45 | "Disagreement is possible; *Common Knowledge* of Disagreement is impossible." (Box "Common Knowledge"). |
  | **Prior Belongs to Agents** | 25 | "In applied work, $p$ is often the data-generating process the modeler sees, not the agents." |
  | **CPA implies Correctness** | 65 | "A common prior can be wrong about the world; it only ensures agents are consistent with each other." |

  ### IV. Declinations and State Space Closure

  **Openly Decline:**
  1.  **Type-Space Constructions:** "We are working in state-space models, not universal type spaces. We assume the space of uncertainty is fixed."
  2.  **Separating Hyperplanes:** "We will not prove the equivalence to 'no agreeable bet' today; that requires convex analysis we will visit in the bargaining module."
  3.  **Veil of Ignorance:** "This is not a normative claim about fairness; it is an epistemic constraint on modeling."

  **The State Space Closure Point:**
  *   **Minute 30:** When defining $\Omega$, explicitly state: **"We declare this space closed."**
  *   **The Argument:** "In a finite model, if you allow me to expand $\Omega$, I can always restore the CPA by treating 'different priors' as 'different information about a hidden variable.' Therefore, the CPA is not a testable property of a finite list of beliefs. It is a constraint on the **modeler's parsimony**. We stop expanding the state space when the model is complete. If disagreement remains, it is either informational (CPA holds) or primitive (CPA fails)."
  *   **Why:** This prevents students from thinking CPA is a testable empirical hypothesis about agents. It frames it as a boundary condition on the model itself.

  ### V. The Check at Minute 70

  **The Audit Question:**
  "I will sketch a result you will see in the literature on legislative signaling: *'If a committee chair and the floor median share a prior, and the chair's proposal is common knowledge, the floor can infer the chair's private signal.'*
  1.  Locate exactly where the Common Prior is used in that sentence.
  2.  Does the inference survive if they have different priors but the same information structure?"

  **Confidently Wrong Answer:**
  "It survives because rationality implies they should interpret signals the same way."
  *   *Diagnosis:* This student conflates Rationality (Bayesian updating) with CPA (Shared Baseline). They think the math forces psychological convergence.

  **Correct Answer:**
  "It uses the prior to map the signal back to the state. With different priors, the same signal updates to different posteriors, so the floor cannot uniquely infer the signal from the proposal without knowing the chair's prior."

  ### VI. The Board at Minute 75

  *Do not erase the example. The board should read as a permanent record of the logic.*

  **Left Panel: The Structure**
  1.  $\Omega = \{1, \dots, 6\}$ (Closed)
  2.  $\mathcal{P}_1, \mathcal{P}_2$ (Partitions)
  3.  $p(\cdot)$ : **Bookkeeping Device** (Single measure on $\Omega$)
  4.  $q_i(\omega) = p(\cdot | \mathcal{P}_i(\omega))$ (Posteriors as Functions)

  **Center Panel: The Logic**
  1.  Meet $\mathcal{M} = \mathcal{P}_1 \wedge \mathcal{P}_2$
  2.  CK $\iff$ Constant on $\mathcal{M}$
  3.  **Theorem:** If $p$ is common & $q_i$ are CK $\implies q_1 = q_2$.
  4.  **Contrast:** If $p$ drops $\implies q_1 \neq q_2$ possible (even if CK).

  **Right Panel: The Readings (Distinct)**
  1.  **Ancestral:** (Crossed out) "Shared History" $\to$ Not Required.
  2.  **Bookkeeping:** "Consistency of Conditionals" $\to$ **The Assumption.**
  3.  **Adjudicative:** "Disagreement = Information" $\to$ **The Implication.**

  **Bottom Center:**
  *   **Constraint:** Modeler closes $\Omega$.
  *   **Declined:** Type Spaces, Hyperplanes, Normativity.
