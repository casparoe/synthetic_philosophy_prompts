prompt: |-
  ok so here's my messy profile on the frame problem—want to check consistancy before I argue it in a seminar: (1) I think the McCarthy/Hayes formulation is basically a bookkeeping puzzle, not the deep problem; (2) I think the deep version is Carnap's old problem of indcutive relevance—knowing what to hold constant; (3) I think LLMs actually solve the deep version via attention, since they don't represnet non-effects at all, they just weight context; (4) but I think that's only a sidestep, not a solution, because the wieghts encode implicit updates; (5) I think Dennett's evolutionary cognitive-wheels story says relevance gets baked into architechture over evolutionary time, which is basically the same mechansim as (3) but at biological scale; (6) I think long-horizon AGI will need explicit symbolic updates, so (3) won't scale and we'll be back to bookkeeping. Is (4) actually compatible with (5), or am I trying to have it both ways? Does (6) undermine (1) by admitting bookkeeping matters after all? And is the tension between (2) and (3) only apparent—like, Carnap wanted explicit rules and attention is implicit, but that's a implementation difference not a conceptual one? Rank the real tensions by how expensive they are to fix.
reasoning: |-
