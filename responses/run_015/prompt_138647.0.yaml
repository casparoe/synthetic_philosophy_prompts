answer: |-
  Your TA is right: the game does collapse once you allow mixed strategies to act as dominators. Your reasoning contains a very common and subtle logical error regarding quantifiers (the "for all" vs. "there exists" distinction).

  Here is the breakdown of where the math works, where your logic trips up, and the distinction regarding weak dominance.

  ### 1. The TA is Right: The Game Collapses
  Let's verify the payoffs based on your description.
  **Row Payoffs (against L, M, R):**
  *   **A:** 4, 0, 6
  *   **B:** 1, 4, 6
  *   **C:** 1.5, 1.5, 3

  **Column Payoffs (against A, B, C):**
  *   **L:** 3, 0, 0
  *   **M:** 0, 3, 0
  *   **R:** 1, 1, 6

  **Step 1: Row's Move (Mixed Dominance)**
  You correctly noted that no *pure* strategy dominates C. A beats C at L but loses at M. B beats C at M but loses at L.
  However, consider a mixed strategy $\sigma = 0.5A + 0.5B$.
  *   Against **L**: $0.5(4) + 0.5(1) = 2.5$. (Beats C's 1.5)
  *   Against **M**: $0.5(0) + 0.5(4) = 2.0$. (Beats C's 1.5)
  *   Against **R**: $0.5(6) + 0.5(6) = 6.0$. (Beats C's 3)

  Because $2.5 > 1.5$, $2.0 > 1.5$, and $6 > 3$, the mixture strictly dominates C. **Row deletes C.**

  **Step 2: Column's Move (Mixed Dominance)**
  Now Column knows Row will not play C. The game is reduced to Row {A, B} and Column {L, M, R}.
  Column's payoffs against {A, B} are:
  *   **L:** (3, 0)
  *   **M:** (0, 3)
  *   **R:** (1, 1)

  No pure strategy dominates R. L beats R against A but loses against B. M beats R against B but loses against A.
  Consider a mixed strategy $\tau = 0.5L + 0.5M$.
  *   Against **A**: $0.5(3) + 0.5(0) = 1.5$. (Beats R's 1)
  *   Against **B**: $0.5(0) + 0.5(3) = 1.5$. (Beats R's 1)

  The mixture strictly dominates R. **Column deletes R.**

  The game has partly collapsed (C and R are gone), leaving a 2x2 game. Your TA was correct.

  ### 2. The Hole in Your Reasoning
  Your argument was:
  > "For each opponent move there's some pure strategy of mine that beats $s$ against that move... so one of those pure strategies has to beat $s$ everywhere."

  This is the logical error. You are confusing two different logical statements.
  1.  **True:** For every opponent move $j$, **there exists** a pure strategy $i$ that beats $s$. ($\forall j, \exists i$)
  2.  **False:** **There exists** a pure strategy $i$ that beats $s$ for every opponent move $j$. ($\exists i, \forall j$)

  In this specific game:
  *   Against **L**, strategy **A** is the "hero" (4 > 1.5).
  *   Against **M**, strategy **B** is the "hero" (4 > 1.5).
  *   Against **R**, both are heroes.

  Your logic assumes that because a hero exists for every column, one hero must be wearing a cape in *every* column. But A drops the ball at M, and B drops the ball at L. Neither is a hero everywhere.

  **Why Mixtures Work:**
  Mixtures allow you to hire both heroes part-time. By playing 50% A and 50% B, you smooth out the payoffs. You sacrifice the "peak" payoff of A against L (getting 2.5 instead of 4) to rescue the "trough" payoff against M (getting 2.0 instead of 0). Because C's payoffs are consistently mediocre (1.5, 1.5), the *average* of the peaks and troughs of A and B is still higher than C's consistent mediocrity.

  This is why the theorem states: **A strategy is strictly dominated (by a mixed strategy) if and only if it is never a best response to any belief.**
  *   If Row believes Col plays L, A is the Best Response (BR).
  *   If Row believes Col plays M, B is the BR.
  *   If Row believes Col plays R, A or B is the BR.
  *   **C is never a BR.** Therefore, it must be dominated by some mixture.

  ### 3. Weak Dominance and Order Dependence
  You asked: *"does anything change if I redo the whole thing with weak dominance instead of strict... I vaguely remember that the order you delete in starts to matter there."*

  You remember correctly.
  *   **Strict Dominance (IESDS):** Order does **not** matter. Whether you use pure or mixed strategies, the set of surviving strategies is unique. The logic is robust because strict inequalities ($>$) are preserved regardless of which other dominated strategies you remove first.
  *   **Weak Dominance (IEWDS):** Order **does** matter.

  **Why?**
  Weak dominance relies on inequalities where equality is allowed ($\ge$).
  Strategy $X$ weakly dominates $Y$ if $X$ is at least as good as $Y$ in all cases, and strictly better in at least one.
  If you delete a strategy $Z$ early in the process, you might remove the *only* case where $X$ was strictly better than $Y$. If that case disappears, $X$ might no longer dominate $Y$ (they might become payoff-equivalent), or conversely, removing $Z$ might remove a case where $Y$ was equal to $X$, suddenly making $X$ strictly dominate $Y$ in the reduced game.

  **Example of Order Dependence:**
  Imagine a game where:
  1.  Strategy A weakly dominates B.
  2.  Strategy C weakly dominates D.
  3.  However, B is the *only* strategy that makes C better than D.

  *   **Path 1:** You delete B first (because A dominates it). Now C and D yield identical payoffs. Neither dominates the other. C and D survive.
  *   **Path 2:** You delete D first (because C dominates it). Now A and B are unaffected. A still dominates B. B is deleted.
  *   **Result:** Path 1 leaves {A, B, C, D} (minus B? wait, if B deleted). Path 1 leaves {A, C, D}. Path 2 leaves {A, C}. The final sets are different.

  Because of this, game theorists generally avoid IEWDS for solution concepts unless specific refinements are needed, whereas IESDS (even with mixed strategies) is a standard, robust tool for finding **Rationalizable Strategies**.

  ### Summary for your Exam
  1.  **Always check for mixed dominance** if pure dominance yields nothing. A strategy can be dominated by a mixture even if it isn't dominated by any pure strategy.
  2.  **The Logic Trap:** Do not assume that because different pure strategies beat a dominated strategy in different columns, one pure strategy must beat it in all columns. (The $\forall \exists$ vs $\exists \forall$ error).
  3.  **Order:** Strict dominance (pure or mixed) is order-independent. Weak dominance is order-dependent.
  4.  **Intuition:** If a strategy is never a Best Response to any probability distribution over the opponent's moves, it can be eliminated.
