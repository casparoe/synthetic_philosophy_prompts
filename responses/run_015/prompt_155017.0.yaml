answer: |-
  Good evening, everyone.

  Looking around this room, I am struck by the rather unusual composition of the gathering. On my left, I see colleagues who can recite the variance of a stratified cluster sample in their sleep. On my right, I see my wife, my children, and the retired fieldworkers who actually knocked on the doors to make those samples real. And in the middle, friends who have spent years debating how best to organise a democracy.

  It seems fitting that my career should end with a room divided, because for thirty years at the Office, my work was essentially about bridging divides.

  When I started in the Sampling Unit, our job was straightforward: ensure the numbers counted. We worried about margins of error and confidence intervals. But in my later years, advising on citizens' assemblies, the question shifted. It was no longer just about counting the population, but about mirroring it.

  Now, I know some of my friends in the democratic theory community had hoped I would retire as a full convert to lottocracy—that I would argue we should hand the keys of the legislature entirely to rotating juries chosen by lot. I am afraid I must disappoint you. I remain a sceptic of pure chance ruling the state.

  But nor am I defending the old technocracy. I have not spent three decades believing that only the credentialed should speak.

  The truth I have come to, and the lesson I take with me into retirement, lies in the middle. It is this: when we select people solely for merit, for expertise, or for status, we inadvertently select for similarity. We create networks of people who read the same papers, attend the same universities, and worry about the same things. And when experts think alike, they develop blind spots that are identical. They are correlated errors.

  Unbiased random selection, carefully structured to ensure every walk of life is present, does not just mirror demographics. It produces a form of collective thinking that meritocracy systematically suppresses. It brings in the knowledge that lives outside the expert network. It does not replace the expert, but it corrects the expert's vision.

  This is why I am so proud of the work we did. We did not seek to overthrow Parliament. We sought to ensure that when Parliament listened, it heard a chorus rather than an echo.

  To the fieldworkers here tonight: you understood this long before I did. You knew that a random sample wasn't just a list of names generated by a computer. It was a promise to listen to the person in the council flat as carefully as the person in the detached house. You faced the slammed doors and the suspicion. You secured the trust that made the data honest. Without your boots on the ground, my theories were just chalk on a blackboard. Thank you for making the statistics human.

  To my family: you have endured thirty years of a man who often brought sampling frames to the dinner table and discussed stratification on our holidays. You tolerated my absences during census years and my enthusiasm during assembly seasons. You provided the stable control group against which I measured my own life. I owe you far more than any confidence interval could quantify.

  And to the theorists: thank you for keeping me honest. You pushed me to clarify why I believed what I believed. You ensured I never settled for a easy answer when a nuanced one was required.

  I am stepping down not because the work is finished, but because the method is now sound. The tool is sharpened. It is time for younger hands to wield it.

  I leave with no grand manifesto, only a conviction that better questions come from a wider room. If we can design our gatherings to avoid the blind spots of homogeneity, we might just find answers we were previously too similar to see.

  Please, raise your glasses.

  To the Office, to the field, to the family, and to the next thirty years of getting the sample right.

  Cheers.
