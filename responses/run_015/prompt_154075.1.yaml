      The hum was the first thing Kael noticed, a vibration in the floorboards that matched the pulse in his wrists. Below the cliff, the tidal turbines turned silently beneath the foam, harvesting the archipelago's breath. Before them, energy was muscle and wood, finite and exhausting. Now, it was a constant, invisible tide flowing into every hearth.

      Kael watched the evening gathering. In the old cycles, marriages were contracted after the harvest, when stores were full. Now, the unions clustered around the equinoxes, when the tidal surge peaked and the storage cells glowed brightest. He remembered his own wedding, bound by grain counts. These young couples bound themselves by kilowatt-hours, though they spoke only of luck and stars.

      He sipped fermented root tea, watching two brothers argue over a fishing net. Previously, such disputes went to the council of elders. Today, they paused when the house lights dimmed—a scheduled dip in transmission. They waited for the surge to return, then shook hands as the brightness stabilized. Was the reconciliation a product of the restored current, or had they always sought a pause, now merely marked by the machine?

      The poet began to chant. The old meter was iambic, mimicking the walk across rough sand. The new verse was triplet-heavy, a waltz time that matched the turbine's rotation. *Spin, give, spin.* The children clapped along, unaware of the old rhythm.

      Kael leaned back, his mind drifting to the laboratories of his youth. He remembered data sets where variables tangled like fishing line. You change one input, and the system shifts, but not always where you push. Here, the material substrate had undeniably changed. The energy budget was no longer tied to muscle fatigue or solar decay. But did the turbine dictate the poem?

      Perhaps the community needed a new cadence and seized upon the hum because it was there, ignoring other shifts. Or perhaps the constant energy removed the friction of scarcity, allowing social forms to drift toward the machine's rhythm like iron filings to a magnet.

