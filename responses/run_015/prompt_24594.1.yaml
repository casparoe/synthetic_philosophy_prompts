answer: |-
  **Project Proposal: The Causal Status of Omissions in Overdetermined and Preemptive Contexts**

  **Statement of the Question**
  This project investigates the metaphysical and normative status of omissions within complex causal structures, specifically focusing on cases of preemption and overdetermination. The central question is: When an agent fails to perform an action that would normally prevent a harm, but the harm occurs anyway through an independent sufficient cause or a later intervention, should the omission be treated as a cause of the harm, a mere background condition, or a distinct kind of causal contribution?

  This inquiry addresses a logical tension in causal theory. Standard intuition suggests that failing to prevent a harm one is obligated to stop is causally relevant. However, in overdetermined scenarios, the harm lacks counterfactual dependence on the omission; the outcome would have occurred regardless of the agent's conduct. If the harm was inevitable due to independent factors, the agent's inaction appears metaphysically inert. Yet, legal and moral practices often treat such omissions as culpable causes. This project seeks to resolve whether this practice reflects a genuine causal relation or a conflation of causation with responsibility.

  **Limitations of Standard Accounts**
  Current philosophical frameworks fail to provide a satisfactory resolution to this problem, leaving the causal status of omissions in redundant contexts indeterminate.

  First, standard counterfactual accounts define causation in terms of dependence: event C causes event E if, had C not occurred, E would not have occurred. In cases of causal overdetermination involving omissions, this condition fails. If an independent physical cause was sufficient to produce the harm, the agent's omission is not a necessary condition for the outcome. Consequently, counterfactual theories must classify the omission as causally irrelevant. This contradicts robust intuitions in legal and ethical contexts where agents are held liable for failing to intervene, even when intervention might have been futile due to redundant threats.

  Second, process-based accounts require a physical mechanism or energy transfer between cause and effect. Omissions, by definition, involve the absence of action and thus lack physical processes. While this neatly excludes omissions from causal chains, it is overly revisionist. It implies that no omission is ever a cause, forcing us to redescribe all causal talk regarding negligence as metaphorical. This undermines the explanatory power of causal claims in fields like medicine and law, where distinguishing between a death caused by disease and a death caused by failed treatment is essential.

  Third, responsibility-based accounts attempt to bypass metaphysical difficulties by grounding causal status in normative expectations. On this view, an omission is a cause if the agent had a duty to act. However, this approach conflates causation with blame. It renders causal status subjective and variable based on the agent's obligations rather than the structure of the world. If causation is reduced to responsibility, we lose the ability to ask whether an agent is responsible *because* they caused the harm. This circularity prevents a clear analysis of cases where responsibility exists without clear causation, or vice versa.

  **Methodology**
  To make progress, this project will employ a three-stage method designed to disentangle metaphysical causation from normative responsibility.

  *Taxonomy of Cases:* The first stage involves constructing a rigorous taxonomy of redundant omission cases. This will distinguish between symmetric overdetermination (where two sufficient causes exist simultaneously), asymmetric preemption (where one cause cuts off the efficacy of another), and trumping preemption (where one cause overrides another by priority). Specifically, I will categorize cases based on the timing of the independent cause relative to the window of opportunity for the agent's intervention. This granularity is necessary because intuitions about causal relevance shift depending on whether the independent cause was active before, during, or after the agent's opportunity to act.

  *Test Cases:* The second stage involves developing a set of controlled test cases that vary causal structure while holding moral responsibility constant, and vice versa. For example, I will construct scenarios where an agent has a clear duty to act and is blameworthy for failing to do so, but the causal structure varies between single causation and overdetermination. Conversely, I will design cases where the causal structure remains constant, but the agent's duty is varied or removed. By polling intuitions and analyzing logical consistency across these variations, I aim to isolate the specific features that trigger causal ascriptions independent of blame. This separation is crucial for determining whether "causal contribution" in these contexts is a distinct metaphysical category.

  *Proposed Criterion:* The third stage is the formulation of a criterion for causal relevance in overdetermined omission cases. I hypothesize that an omission counts as causally relevant not when it changes the outcome, but when it represents a deviation from a stabilized normative expectation that functions as a causal barrier. In normal conditions, certain agents or systems are expected to neutralize threats. When this expectation is part of the reliable structure of the environment, the failure to meet it removes a barrier that was functionally part of the causal history. Even if a redundant threat exists, the omission is causally relevant if it removed the *primary* defense mechanism upon which the system relied. This criterion shifts the focus from outcome dependence to system dependence.

  **Deliverables and Failure Conditions**
  The primary deliverable of this fellowship will be a journal-ready manuscript of approximately 8,000 words articulating the proposed criterion and defending it against counterexamples. Additionally, I will present preliminary findings at two major conferences in metaphysics and legal theory to gather peer feedback. A secondary deliverable will be a curated database of the test cases developed during the second stage, made available for further experimental philosophy research.

  Project failure will be defined in two ways. Substantive failure would occur if the investigation demonstrates that causal status in these cases is inseparable from normative responsibility, forcing the conclusion that there is no distinct metaphysical fact of the matter regarding omission causation in overdetermined contexts. While this is a valid philosophical result, it would constitute a failure of the project's positive aim to establish a criterion for causal contribution. Procedural failure would occur if the proposed taxonomy proves too unstable to generate consistent intuitions across the test cases, rendering the data unusable for theory construction.

  **Timeline**
  The project will be executed over twelve months according to the following schedule:

  *Months 1-3:* Literature review and conceptual mapping. I will refine the definitions of preemption and overdetermination as they apply to negative acts and finalize the taxonomy of cases.
  *Months 4-6:* Development of test cases. I will draft the specific scenarios required to separate causation from responsibility and conduct initial informal testing with colleagues to check for clarity and intuitive variance.
  *Months 7-9:* Theory formulation. I will develop the "system dependence" criterion, testing it against the taxonomy to ensure it handles preemptive and overdetermined cases without collapsing into counterfactual or responsibility-based accounts.
  *Months 10-12:* Writing and revision. I will draft the manuscript, incorporate feedback from conference presentations, and finalize the deliverables for submission.

  This schedule allows sufficient time for the iterative refinement of the criterion, ensuring the final argument is robust against standard objections in causal theory.
