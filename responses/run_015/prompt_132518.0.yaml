answer: |-
  You have identified a very real and pervasive cognitive pattern, and you are right to sense that existing terms like "false consciousness" or "privilege" don't quite snap into place. False consciousness is about the worker misrecognizing their own exploitation; privilege blindness is about status advantage. What you are describing is specific to the **ontology of time itself**: treating leisure as an intrinsic property of the individual rather than a relational outcome of distributed labor.

  There is no single, canonical term in sociology or economics that captures this *exact* mechanism in the way you've described it. However, it sits at the intersection of **Social Reproduction Theory** (which maps the unpaid labor required to sustain the workforce) and the **Sociology of Time** (which studies how time is allocated and valued).

  Since there isn't an established name, I propose we coin this: **The Leisure Autonomy Fallacy**.

  Here is the breakdown of the concept, its theoretical lineage, and exactly where its edges lie.

  ### The Concept: The Leisure Autonomy Fallacy

  **Definition:** The cognitive bias of conceptualizing leisure time as a self-contained individual entitlement or failure, thereby obscuring the externalized labor (care, service, manufacturing, infrastructure) required to sustain that leisure.

  **The Core Error:** It treats leisure as a *state of being* (something you "have" or "take") rather than a *relation of production* (something that is "made" by others).

  ### Theoretical Lineage
  While the specific name is new, the anatomy of the idea comes from three existing places:
  1.  **Social Reproduction Theory (Feminist Marxism):** This argues that capitalist production depends on a hidden sphere of "reproductive labor" (cooking, cleaning, child-rearing, resting) to keep workers alive and ready to work. Your observation extends this: leisure isn't just "recovery for work"; it is often *consumption* that depends on other people's labor.
  2.  **Veblen's *Conspicuous Leisure*:** Veblen noted that leisure signals status because it proves you don't *need* to work. Your insight adds that this signal relies on others *doing* the work you aren't doing.
  3.  **Polanyi's *Embeddedness*:** Economies are "embedded" in social relations. The Fallacy occurs when leisure is "disembedded" from those relations and treated as an abstract market good or right.

  ### Defining the Edges

  You asked specifically about the boundaries of this concept, particularly regarding intent (ignorance vs. active ignoring) and scope. Here is how to map the edges of the **Leisure Autonomy Fallacy**:

  #### 1. The Edge of Intent (Epistemic vs. Ideological)
  Does this apply when people genuinely don't know, or only when they ignore it?
  **It applies to both, but the function changes.**
  *   **As a Blind Spot (Epistemic):** When the French politician defends the 35-hour week without mentioning immigrant labor, they may genuinely view the law as a universal right. Here, the Fallacy functions as a *structural blind spot*. The dependency is invisible to them because the labor is outsourced (geographically or domestically).
  *   **As a Shield (Ideological):** When the startup founder claims they "don't need weekends" or the article blames a *karoshi* victim for not setting boundaries, the Fallacy functions as *moral cover*. By framing leisure as an individual capacity ("you just need to manage your time better"), it absolves the system of responsibility.
  *   **The Boundary:** The concept holds in both cases because the *outcome* is the same: the erasure of the supporting labor. Whether that erasure is accidental or malicious doesn't change the structural reality being obscured.

  #### 2. The Edge of Visibility (Invisible vs. Devalued)
  Does the labor have to be hidden?
  **No.** The Fallacy applies even when the labor is visible but **devalued**.
  *   *Example:* If a family hires a nanny so the parents can have "quality time," the labor is visible (the nanny is there). But if the parents discuss their weekend as "us recharging" without acknowledging the nanny's labor as the *condition of possibility* for that recharge, they are committing the Fallacy.
  *   *The Boundary:* It is not about whether the worker is seen; it is about whether their labor is acknowledged as the *substrate* of the leisure. If the labor is treated as a "service purchase" rather than a "structural dependency," the Fallacy is in play.

  #### 3. The Edge of Agency (Choice vs. Constraint)
  Does this apply to people who genuinely choose to work more?
  **This is the sharpest edge.**
  *   *The Startup Founder:* If a founder says, "I love coding so much I don't want to stop," are they committing the Fallacy? **Yes.** Why? Because their ability to treat coding as "play" rather than "labor" usually rests on a safety net (capital, lack of dependents, privilege) that others don't have. By universalizing their experience ("I don't need weekends"), they erase the fact that their "leisure-work blur" is a luxury, not a norm.
  *   *The Boundary:* The Fallacy triggers when the individual experience is generalized into a universal norm. If the founder says, "I have the privilege to blur work and leisure," they avoid the Fallacy. If they say, "Weekends are unnecessary for innovation," they commit it.

  ### Applying the Concept to Your Examples

  1.  **The French 35-Hour Week:**
      *   *Analysis:* This is **Structural Leisure Autonomy**. The policy treats leisure time as a legal entitlement detached from the global division of labor.
      *   *Fallacy:* Assuming the "free time" generates itself rather than being displaced onto lower-wage economies or care sectors.

  2.  **Japanese *Karoshi*:**
      *   *Analysis:* This is **Moralized Leisure Autonomy**. Leisure is framed as a skill (boundary-setting) rather than a resource allocated by power dynamics.
      *   *Fallacy:* Blaming the victim for failing to "claim" a resource (time) that the system structurally withheld. It assumes leisure is there for the taking if you are brave enough, ignoring that taking it might mean losing your livelihood.

  3.  **The Protestant Work Ethic / "Productive Leisure":**
      *   *Analysis:* This is **Conditional Leisure Autonomy**. Leisure is only valid if it reproduces labor (gym, upskilling).
      *   *Fallacy:* Pure rest is seen as wasteful because the dependency on *others* to sustain that rest is unacknowledged. You must "earn" your keep even in rest, because the idea that someone else could sustain you without your direct input is morally suspect.

  4.  **Innovation requires 80-hour weeks:**
      *   *Analysis:* This is **Extractive Leisure Autonomy**. It assumes the "genius" resides solely in the worker's extended hours.
      *   *Fallacy:* It ignores the support infrastructure (meals, laundry, emotional support) that allows those 80 hours to happen. It treats the worker as a self-fueling engine.

  ### Why This Term Works
  **The Leisure Autonomy Fallacy** captures the specific mechanism you spotted: the **atomization of a relational reality**.

  It distinguishes itself from **Privilege Blindness** because privilege is about *status*, whereas this is about *time and labor*. A person can be privileged but still acknowledge their dependency (e.g., "I can only work because my partner handles everything"). The Fallacy is specifically about denying that dependency.

  It distinguishes itself from **False Consciousness** because it often applies to the *beneficiaries* of the system (the politician, the founder, the observer), not just the workers.

  ### Summary
  You haven't invented the dynamic, but you have isolated a specific cognitive mechanism that lacks a common label. Calling it **The Leisure Autonomy Fallacy** gives you a precise tool to dissect these arguments. It allows you to point out that **leisure is not a vacuum; it is a structure.** When people talk about it as if it were a vacuum, they are committing the Fallacy.

  **The Edge Case Test:** If someone says, "I earned this vacation," they are bordering on the Fallacy. If they say, "I earned the *money* for this vacation, which pays others to sustain my absence," they have avoided it. The line is drawn at the acknowledgment of the **labor substrate**.
