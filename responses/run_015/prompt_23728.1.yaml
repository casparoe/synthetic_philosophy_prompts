answer: |-
  1.  **Let's start with the status of your own claim.** You argue that the epistemic defect of conspiracy theories is structural—they posit hidden coordination and concealment. Is your book offering a *theory of conspiracy* (a general epistemology of how we assess hidden causes) or is it itself a *conspiracy theory* (a specific hypothesis about why people believe what they believe)?
      *   **Follow-up:** She will likely say it is a general epistemology, not a hypothesis about psychology. If so, ask: *"If it's a general epistemology, does it apply to institutions? When the CDC changes guidance, is positing 'internal confusion' structurally superior to positing 'coordinated revision,' or does your framework inherently privilege institutional narratives?"*

  2.  **You posit a genuine epistemic asymmetry between conspiratorial and non-conspiratorial explanations.** All else equal, you argue we should prefer the non-conspiratorial. But is this asymmetry principled, or is it just an artifact of how evidence is currently structured? After all, "institutional incompetence" often requires positing a complex, hidden chain of failures just as much as "coordination" does.
      *   **Follow-up:** She will likely argue that coordination requires *more* specific assumptions (intent, secrecy, capability) than incompetence. If so, ask: *"But doesn't that just reduce to a Bayesian prior about human competence? If the asymmetry is just a probability calculation, why call it a structural defect rather than just a claim that conspiracies are statistically rare?"*

  3.  **Let's press on the cover-up mechanism.** A defining structural feature of conspiracy theories is that a lack of evidence is often interpreted as evidence of the cover-up's success. This threatens to make the theory unfalsifiable. How does your structural account distinguish between a *reasonable* suspicion of suppression and a *structural* immunity to counter-evidence?
      *   **Follow-up:** She will likely say there is a threshold where "suppression" claims become ad hoc. If so, ask: *"Who sets that threshold? If the structure allows believers to reinterpret absence of evidence as confirmation, isn't the 'threshold' just whatever the mainstream currently accepts, making your structural account circular?"*

  4.  **You've noted that Watergate and MKUltra were real conspiracies.** This is your defense against the claim that the genre is inherently irrational. But structurally, how did Watergate look *before* the tapes were found? Was it epistemically distinct from a false conspiracy theory at that stage, or did it share the exact same structural defects you describe?
      *   **Follow-up:** She will likely say Watergate had "traces" or "leaks" that false theories lack. If so, ask: *"But conspiracy believers always point to 'leaks' and 'whistleblowers' too. If the structural feature is 'hidden actors concealing truth,' and both real and fake theories claim to have insider corroboration, how does your account help us distinguish them before the history books are written?"*

  5.  **This brings us to the line between legitimate and illegitimate cases.** Consider Tuskegee (a real government medical conspiracy) versus the anti-vax movement (which posits a similar government-pharma medical conspiracy). Structurally, they are nearly identical: both posit hidden medical malfeasance concealed by authorities. Does your account allow you to distinguish them *in principle*, or only *in practice* after the truth is revealed?
      *   **Follow-up:** She will likely say Tuskegee was eventually proven, validating the structure. If so, ask: *"That's my point. If you can only distinguish them retrospectively, then your structural account offers no guidance for a journalist or citizen in the present moment. Is your theory descriptive of history rather than prescriptive for inquiry?"*

  6.  **I've spent a year covering the anti-vax movement.** I often find believers using standard empirical reasoning on data they believe is suppressed. If the problem is truly structural, why does the content matter so much for the harm caused? Does your focus on structure risk absolving the specific falsehoods by treating them as interchangeable variables in a logical equation?
      *   **Follow-up:** She will likely say the harm comes from the erosion of trust, which is structural. If so, ask: *"But trust was eroded by Tuskegee too. If the structure is the same, but one case justifies distrust and the other doesn't, doesn't that prove the epistemic weight lies in the *content* and the *evidence*, not the abstract structure of the claim?"*

  7.  **If the structural account is correct, it implies we should treat claims of hidden coordination as guilty until proven innocent.** But doesn't this create a conservative bias? If the epistemic cost of positing a conspiracy is always higher, doesn't your framework structurally protect powerful actors who *are* actually conspiring, by making the accusation too expensive to lodge?
      *   **Follow-up:** She will likely say the bar shouldn't be "impossible," just "high." If so, ask: *"How high? If the bar is high enough to filter out anti-vax claims, isn't it by definition high enough to have filtered out Watergate in 1972? Are you advocating for a heuristic that would have silenced Woodward and Bernstein?"*

  8.  **Let's talk about the "genre" defense again.** You say the existence of true conspiracies makes the genre epistemically interesting. But if the structural features of true conspiracies are indistinguishable from false ones until verification, isn't the "genre" a category error? Is there such a thing as a conspiracy theory, or are there just *theories* that turn out to be conspiracies?
      *   **Follow-up:** She will likely insist the structural posture is distinct regardless of truth value. If so, ask: *"If the posture is identical for Tuskegee and anti-vax, and the truth value is unknown at the time of belief, then your structural critique condemns the Tuskegee skeptics of the 1970s as epistemically irrational. Are you comfortable with that implication?"*

  9.  **I want to test the robustness of your own framework.** You argue that conspiracy theories are structurally resistant to counter-evidence. What specific evidence or argument could count *against* your structural account? If you say "none," does your theory not suffer from the very structural immunity you critique?
      *   **Follow-up:** She will likely say empirical studies on belief formation could falsify it. If so, ask: *"But your claim is philosophical, about justification, not psychology. If studies show people believe for psychological reasons, does that falsify your claim that the *structure* is the epistemic problem? Or does your theory absorb that data too?"*

  10. **Finally, if your structural account is true, it suggests a fundamental limit on what we can know about power.** It implies that the more powerful the actors, the harder the truth is to structurally access. If that's the case, isn't the real epistemic problem not the *theorists*, but the *opacity* of the institutions they are investigating?
      *   **Follow-up:** She will likely agree that opacity is a problem but maintain the theorist's response is disproportionate. If so, ask: *"If the opacity is the root cause, and the conspiracy theory is a symptom, why focus your epistemic critique on the symptom? Isn't your structural account inadvertently blaming the immune response rather than the virus?"*
