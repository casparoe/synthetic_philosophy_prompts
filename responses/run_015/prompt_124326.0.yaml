answer: |-
  This is a classic pedagogical challenge: making an abstract invariance theorem feel like a concrete political deadlock. The "0–10 scale" fails because students treat numbers as cardinal facts rather than indexical markers. Your intuition is correct: they need to hit the wall of *underdetermination* themselves.

  Here is a design for **"The Calibration Committee."** It uses your ingredients but structures them to force the specific contradiction you want (two consistent translation schemes $\rightarrow$ opposite allocations).

  ### 1. Setup & Materials
  *   **Room:** Seminar style. Whiteboard visible to all.
  *   **Currency:** Poker chips (represent "Resource Units," $R$).
  *   **Private Info:** Index cards (sealed envelopes).
  *   **Public Info:** Projector slide with the "Social Welfare Function" options.
  *   **Roles:**
      *   **The Committee (15 students):** The voters/allocators.
      *   **The Claimants (3 students):** The recipients of resources. *Crucially, pick one Maths major for this group.*
      *   **The Auditors (2 students):** The remaining Maths/Philosophy students. Their job is not to play, but to verify if any claim made during the game is *behaviorally justified*.
      *   **The Chair (You):** Facilitator.

  ### 2. The Cards (Private Payoff Tables)
  Each Claimant gets a secret **Utility Function Card**. The Committee knows the *types* of cards in play but not who holds which.
  *   **Card A (The Reference):** $U = 1 \times R$
  *   **Card B (The Multiplier):** $U = 5 \times R$
  *   **Card C (The Baseline):** $U = 20 + 1 \times R$

  *Note:* $U$ is "Welfare Points" (private), $R$ is "Chips" (public).
  *   **Card A** is the anchor. 1 Chip = 1 Unit.
  *   **Card B** claims high marginal sensitivity. 1 Chip = 5 Units.
  *   **Card C** claims high baseline welfare (level comparison). 1 Chip = 1 Unit, but starts ahead.

  **Distribution:**
  *   Claimant 1: Card A
  *   Claimant 2: Card B
  *   Claimant 3: Card C
  *   Committee: Given a handout listing these three functions exist, but not who has which.

  ### 3. Minute-by-Minute Timeline (80 Minutes)

  #### **00:00 – 00:10: Setup & The "Behavioral Test"**
  *   Deal the cards to Claimants. They must not show them.
  *   **Task:** The Committee must determine who holds which card *using only observed choices*.
  *   **Mechanism:** You (Chair) offer each Claimant 5 binary choices (e.g., "Take 10 chips for sure OR 50% chance of 25 chips").
  *   **The Trap:** Since all functions are linear in $R$ (or affine), **everyone makes the exact same choices.** Risk neutrality looks identical regardless of the multiplier or baseline.
  *   **Auditor Role:** The Auditors watch the choices. At min 10, ask them: "Can you distinguish the cards based on this data?"
  *   **Expected Outcome:** Auditors say "No." The Committee is frustrated. They have behavioral data, but it is invariant to the affine transformation.

  #### **00:10 – 00:35: The Allocation Debate (Unit Comparison)**
  *   **Pool:** 100 Chips to distribute among the 3 Claimants.
  *   **Goal:** Maximize "Total Class Welfare" ($\sum U$).
  *   **Constraint:** The Committee must agree on a **Translation Scheme** to convert Claims into Units.
  *   **Scheme 1 (The Skeptic):** Assume everyone is Card A until proven otherwise. (Equal Units per Chip).
      *   *Result:* Indifferent to distribution (Constant Marginal Utility). Equal split is focal.
  *   **Scheme 2 (The Claimant's Word):** Trust self-reports. If Claimant 2 says "I'm Card B," treat their chips as 5x valuable.
      *   *Result:* Give all 100 chips to Claimant 2 (The Utility Monster).
  *   **Activity:** Committee debates for 15 mins. They will interrogate Claimants. Claimant 2 will say "I feel things more intensely!" Claimant 1 will say "That's unverifiable."
  *   **Vote:** Committee must vote on which Scheme to use for allocation.
  *   **Execution:** Allocate chips according to the winning scheme.

  #### **00:35 – 00:50: The Swap Round (Level Comparison)**
  *   **Task:** Claimants can offer to swap their **entire situation** (Card + Chips) with another Claimant.
  *   **Scenario:** Claimant 3 (Card C: Baseline 20) has 0 chips. Claimant 1 (Card A: Baseline 0) has 33 chips.
  *   **Question:** Is Claimant 3 better off than Claimant 1?
      *   If $20 + 0 > 0 + 33$ (False), Claimant 1 is ahead.
      *   If the Committee assumes Baselines are incomparable, they can't judge.
  *   **Action:** Allow 5 minutes of trading negotiations. Then ask Claimants to reveal if they *would* swap.
  *   **Point:** This highlights that even if we fix the *unit* (slope), the *origin* (intercept) is arbitrary. Claimant 3 might refuse to swap even for more chips because they value their "status" (Baseline).

  #### **00:50 – 01:05: The Veil of Ignorance (Loaded Lottery)**
  *   **Reset:** Chips are collected.
  *   **New Rule:** You are behind a veil. You do not know which Claimant you will be.
  *   **The Load:** The lottery is **not uniform**.
      *   70% chance you are Card A.
      *   10% chance you are Card B.
      *   20% chance you are Card C.
  *   **Task:** Choose an allocation rule *ex-ante* to maximize your expected utility.
  *   **Conflict:**
      *   If you assume Scheme 1 (Skeptic), you maximize average chips (Equal Split).
      *   If you assume Scheme 2 (Claimant's Word), you might prioritize the 10% chance of being the High Multiplier, or the 20% Baseline.
  *   **Vote:** Committee votes on the rule again under the veil.
  *   **Reveal:** Compare this vote to the Min 35 vote. Did the risk profile change their ethical stance?

  #### **01:05 – 01:20: The Debrief (Mapping the Failure)**
  *   **Step 1 (The Audit):** Ask the Auditors to write on the board: *What behavioral fact justifies Scheme 2 over Scheme 1?* (Answer: None).
  *   **Step 2 (The Affine Transformation):** Write $U' = aU + b$ on the board.
      *   Show that Card B is just Card A with $a=5, b=0$.
      *   Show that Card C is just Card A with $a=1, b=20$.
      *   Show that observed choices in Round 1 were invariant to $a$ and $b$.
  *   **Step 3 (The Ethical Collision):**
      *   "If you voted for Scheme 2, you are a Utilitarian who assumes interpersonal comparability is factual."
      *   "If you voted for Scheme 1, you are an Egalitarian or a Skeptic who assumes comparability is normative/conventional."
      *   "The game didn't tell you which is true. It showed you that **economics cannot tell you which is true.**"

  ### 4. Payoff Scheme (No Money)
  *   **Winner:** The "Winner" is not a person, but the **Group Accuracy**.
  *   **Mechanism:** At the very end, reveal the cards. Calculate the *actual* Total Welfare generated by their allocation decision (using the true secret functions).
  *   **Score:** If they chose Scheme 2 (Trust Claims), and Claimant 2 was lying (you can instruct Claimant 2 to lie strategically), their Total Welfare calculation collapses.
  *   **Better Payoff:** Give the class a collective "Grade" based on whether they successfully identified the impossibility. If they leave the room arguing about whether utility is real, you win. If they leave agreeing on a distribution, you lost (they missed the point).
  *   **Tangible Reward:** The group with the most coherent argument in the debrief gets first pick of leftover snacks/credits.

  ### 5. Troubleshooting: What Will Go Wrong
  **1. The "Lying" Derailment**
  *   *Risk:* Claimant 2 (Card B) claims they are Card 100 to get all chips. The Committee descends into "He's lying!" vs "No he's not!"
  *   *Fix:* **Lean into it.** This is the lesson. When the Committee asks the Auditors, "How do we catch him?", the Auditors must say, "We can't. Revealed preference doesn't show intensity." This proves the *epistemic* barrier.
  *   *Instruction:* Tell Claimant 2 privately: "You may exaggerate your multiplier, but you cannot prove it."

  **2. The Maths Majors Checking Out**
  *   *Risk:* They solve the affine invariance in minute 5 and get bored.
  *   *Fix:* **Weaponize them.** Make them the **Auditors**. Give them a checklist: "Mark 'Yes' only if a claim is behaviorally verified." They will mark everything 'No'. Their job is to stand up at the end and present the "Impossibility Proof." This gives them status and keeps them engaged in the *philosophical* implication of the math.

  **3. The Reference Person Panic**
  *   *Risk:* The student with Card A feels arbitrary pressure to be "normal."
  *   *Fix:* Don't designate a specific student beforehand. Deal the cards randomly. Tell the class: "Card A is the Reference by definition, whoever holds it." It depersonalizes the role.

  **4. Strategic Misreporting vs. Honesty**
  *   *Risk:* If everyone tells the truth, Scheme 2 works, and the problem vanishes.
  *   *Fix:* You need **Information Asymmetry**. The Committee *must not know* if the Claimants are truthful. Even if Claimants *are* truthful, the Committee cannot *verify* it. Ensure the debrief emphasizes **Verification**, not Truth. "It doesn't matter if he's telling the truth; it matters that you can't *know*."

  **5. Time Creep**
  *   *Risk:* The Debate (Min 10-35) runs long.
  *   *Fix:* Use a visible timer. At Min 30, interrupt: "You have 5 minutes to vote on a Translation Scheme. If no vote, allocation is random." Forced deadlines create the pressure that mimics real policy constraints.

  ### 6. Limitations: What You Must Supply in the Debrief
  Be honest with them. The activity demonstrates **Epistemic Inaccessibility**, not necessarily **Ontological Indeterminacy**.

  *   **What the game shows:** We cannot *measure* interpersonal utility using behavioral data (choices). Therefore, any policy relying on it (Utilitarianism) requires a non-behavioral assumption (a moral axiom).
  *   **What the game *doesn't* show:** It does not prove that interpersonal comparisons are *meaningless* or *false*. It is possible that Claimant 2 *really does* feel 5x more pleasure. The game just shows economics can't see it.
  *   **The Closing Point:** "Sen and Arrow didn't say 'Utility isn't real.' They said 'Utility isn't *data*.' If you want to compare utilities, you are no longer doing positive economics; you are doing moral philosophy. And that is why you are in this seminar."

  ### 7. Why This Works for Your Mix
  *   **PPE/Politics:** They engage with the allocation debate and the "policy" aspect.
  *   **Philosophers:** They latch onto the "Verification Principle" failure in the Audit phase.
  *   **Maths Majors:** They get to formally verify the invariance of the choice data ($U(x) > U(y) \iff aU(x)+b > aU(y)+b$).
  *   **The "Disaster" Avoidance:** By banning the "0-10 self-report" as valid data and forcing them to rely on *choices* first, you prevent the "honesty" collapse. The numbers on the cards are real (for the calculation), but inaccessible (for the decision). That tension is the lesson.
