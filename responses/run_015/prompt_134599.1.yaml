      *   **The "Debt" Metaphor:** The user asks if resentment is a debt. If it is, the ritual pays it. But resentment is often a signal of unmet needs or damaged trust, not just a ledger entry.
      *   **Direct vs. Outsourced Blame:** Direct blame maintains the interpersonal connection (even if painful). Outsourced blame (to the group/ritual) sanitizes it but can depersonalize the harm.

  3.  **Address the Specific Questions:**

