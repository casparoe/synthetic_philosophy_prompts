prompt: |-
  hey, i'm a phd student in environmental humanities (mostly post-fire restoration ecology on the side, so i think in seed banks, legacy effects, and ecologial memory). i want you to take nietzsche's three modes of relating to the past—monumental, antiquarian, and critical—and restate them using the vocabulary of disturbance ecology and ecological memory. think pioneer vs. climax regimes, biological legacies, soil seed banks, resilience thresholds, managed retreat. don't just slap analogies on; show exactly which conceptual parts line up and which have to be distorted to fit.

  then give me the residue report: what survives the translation? for instance, his worry that monumental history distorts the past to serve present greatness—does that map onto applying an inappropriate pioneer-species template to a climax community? and his idea that critical history partly destroys the past to liberate the present—can ecology express a liberatory destruction, or is disturbance always just damage?

  check my intuition: antiquarian history is basically preserving every seed in the bank without letting any germinate—useful for system resiliance but paralysing if taken too far. is that fair, or am i forcing the analogy? and tell me whether the leftover pieces that don't translate point to ecology missing a normative dimension, or to nietzsche smuggling in values that don't actually do philosophical work.

  no citations needed, just the translation and the residue.
