answer: |-
  This is an exceptionally clear map of the territory. You have correctly identified that the "tautology" charge is not one argument but a bundle of distinct logical worries that often get tangled. Your instinct to test them by asking "what would have to happen for this to be false?" is exactly the right tool for the job.

  Here is your menu corrected and extended, followed by the toy cases, the diagnosis of the online critics, and the reconstruction of Popper's specific position.

  ### Part 1: The Menu of Readings

  I have kept your structure. For each, I provide the **Falsification Condition** (what observation kills it), a **Verdict**, and a brief **Correction**.

  **1. The Definition Reading**
  *   **Claim:** "Fitness" is defined strictly as "actual survival/reproduction." Therefore, "the fittest survive" means "those who survive, survive."
  *   **Falsification Condition:** None. This is a linguistic claim, not a factual one. However, if we treat it as a claim about how biologists *use* the word, finding a standard biology textbook that defines fitness as a *disposition* or *probability* rather than an *outcome* falsifies the claim that biologists are making a tautology.
  *   **Verdict:** **True but Trivial.**
  *   **Correction:** You are right that this is easily fixed. Biologists abandoned this definition decades ago. If a critic uses this, they are attacking a straw man. It cannot support the claim that the theory is unscientific, because definitions aren't scientific theories.

  **2. The Propensity Reading**
  *   **Claim:** Fitness is a probabilistic disposition (like "fragility" in glass). An organism can be "fitter" but die by bad luck. The theory claims that *on average*, higher propensity leads to higher reproduction.
  *   **Falsification Condition:** A controlled experiment where Organism A has strictly superior traits for the environment compared to Organism B (same starting numbers), yet over many generations, Organism B consistently out-reproduces A without any environmental change or random drift sufficient to explain the gap.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Correction:** This is the standard modern biological defense. It turns the claim into a statistical law. It saves the theory from the tautology charge but admits that single events (one deer dying) cannot confirm or refute the theory; only aggregates can.

  **3. The Contrast-Class (Null Model) Reading**
  *   **Claim:** Saying "selection caused this" is empty unless you prove "chance/drift did not cause this." The content lies in the rejection of the null hypothesis.
  *   **Falsification Condition:** A trait exists that correlates perfectly with survival, but a mathematical model of pure random chance (drift) predicts that correlation just as accurately as the selection model. If the "selection" model adds no predictive power over the "random" model, the selection claim is empty.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Correction:** This is your strongest invention. It shifts the burden from "prove selection happened" to "prove it wasn't just noise." This is methodologically sound. It makes the theory testable, but it makes testing very hard.

  **4. The Extrapolation (Cumulative) Reading**
  *   **Claim:** Small advantages can stack up over deep time to create complex design (eyes, wings). The worry is that there might be "valleys" in the landscape where an intermediate trait is *less* fit, blocking the path.
  *   **Falsification Condition:** Discovering a complex biological structure where every intermediate step between "none" and "full" reduces survival probability. If the bridge cannot be crossed step-by-step, the extrapolation claim fails.
  *   **Verdict:** **Substantive and Debated.**
  *   **Correction:** This is where the "just-so story" worry actually lives. It is not about whether selection happens *now*, but whether it can build *that* over *eons*. This is testable (by modeling intermediates), but often difficult to verify historically.

  **5. The Strong (Immunization) Reading**
  *   **Claim:** The theory is flexible enough to explain *any* outcome. If a trait helps, it's adaptation. If a trait hurts, it's a trade-off or genetic drift. Nothing could count against it.
  *   **Falsification Condition:** Finding a universal trait that actively destroys reproductive success in all environments, persists in all populations, and cannot be explained by linkage to other genes or drift. Or, simply demonstrating a specific prediction the theory makes that turns out wrong (e.g., "rabbits should not exist in this strata").
  *   **Verdict:** **Substantive but False.**
  *   **Correction:** This accuses the theory of being logically airtight in a bad way. It is false because evolutionary biology *does* make risky predictions (e.g., about fossil ordering or genetic similarities). However, it contains a grain of truth: adaptationists *can* be too flexible.

  ---

  ### Part 2: The Toy Cases

  Here is how your five readings handle the two scenarios you proposed. This is where the distinctions matter.

  **Case A: Heritable Variation + Lottery Survival**
  *(Organisms differ genetically, but who lives/dies is a coin flip.)*

  1.  **Definition:** The "fittest" are those the lottery picked. The statement holds, but explains nothing.
  2.  **Propensity:** Fitness propensities are equal across the population. The theory predicts **no change** in trait frequency over time. If the trait frequency *does* change significantly, the theory (combined with the lottery setup) is falsified.
  3.  **Contrast-Class:** The null model (drift) fits the data perfectly. The selection model is rejected. The reading successfully identifies that "selection" is not the cause here.
  4.  **Extrapolation:** No complex design will emerge. The reading predicts a limit to complexity in this world.
  5.  **Strong:** A critic using this reading would say, "See? You can claim selection happened even though it was a lottery." But a proper biologist would say "Drift caused this." This reading fails to distinguish the two unless the biologist is dishonest.

  **Case B: No Heritable Variation + Differential Survival**
  *(Organisms are clones, but some die due to location/luck.)*

  1.  **Definition:** The survivors are "fittest." The statement holds.
  2.  **Propensity:** Since there is no heritability, there is no evolution. The theory predicts the next generation will look exactly like the previous one, regardless of who died. If the next generation *changes*, the theory is falsified.
  3.  **Contrast-Class:** Selection cannot be the contrast to drift because there is no variation to select. The reading identifies the pre-condition for selection is missing.
  4.  **Extrapolation:** No accumulation is possible. The reading predicts an evolutionary dead end.
  5.  **Strong:** A critic might say, "You'll claim the survivors were fitter." But since they are clones, they weren't. If the biologist claims evolution occurred here, the Strong Reading is proven right (the theory is being abused). If the biologist says "no evolution," the Strong Reading is wrong.

  **Takeaway from Toy Cases:** Readings 2, 3, and 4 successfully identify that **nothing evolutionary happens** in these cases. Reading 1 is useless. Reading 5 is only valid if the biologist refuses to admit nothing happened.

  ---

  ### Part 3: The Online Critics

  **Which reading do they intend?**
  Mostly **Reading 1** (sloppy definition) and **Reading 5** (cynical unfalsifiability). They oscillate between "It's true by definition" and "It explains everything so it's useless." They rarely intend Reading 3 (Null Model) or Reading 4 (Extrapolation), because those require understanding how testing actually works.

  **Which reading supports their three conclusions?**

  1.  **To show it fails falsifiability (Not Science):** They need **Reading 5**. If the theory can accommodate any outcome, it cannot be tested. Reading 1 doesn't work here, because definitions aren't supposed to be falsifiable.
  2.  **To show it explains nothing (Explanatory Emptiness):** They need **Reading 1**. If "fittest" just means "survivors," you haven't explained *why* they survived.
  3.  **To rebut adaptationist stories (Just-So Stories):** They need **Reading 4**. The worry is that we are assuming small steps can build big things without proving the path exists.

  **The Conflict:**
  The critics are logically inconsistent. You cannot use Reading 1 (It's a definition) and Reading 5 (It's a failed empirical theory) at the same time. If it's a definition, it's logically true. If it's an empirical theory that fits everything, it's false or vacuous. They use the definition argument to dismiss the logic, and the unfalsifiability argument to dismiss the science. They want both advantages.

  **The Verdict:**
  Only **Reading 4** (Extrapolation) and a careful version of **Reading 3** (Contrast-Class) provide a genuine, substantive challenge that doesn't collapse into wordplay. The critics usually lack the technical grip to make these stick, so they fall back on the tautology slogan.

  ---

  ### Part 4: Popper's Worry and The Change of Mind

  You asked for the structure of Popper's worry, not the history. Here is the reconstruction.

  **Which reading was Popper's?**
  Popper's initial worry was primarily **Reading 5** (Immunization), grounded in **Reading 1** (Definition).
  He observed that evolutionary explanations often worked backwards: "Why did this trait appear? Because it was fit. How do we know it was fit? Because it appeared." He felt this allowed biologists to explain *any* history post-hoc without risking a prediction that could fail. He viewed it as a "metaphysical research programme" because it guided inquiry (look for the function!) but didn't have the hard logical structure of Newtonian physics.

  **How can a "Metaphysical Research Programme" be valuable?**
  This is the crucial Popperian distinction. For Popper, "Metaphysical" does not mean "Nonsense." It means "Not currently testable, but useful."
  *   **Pseudoscience:** Claims to be scientific but refuses to accept test results (e.g., Astrology ignores failed predictions).
  *   **Metaphysical Programme:** Admits it is not fully testable yet, but generates *other* testable hypotheses.
  *   **Example:** "Natural selection optimizes traits" is the metaphysical core. It isn't directly testable (Reading 5 worry). *But*, it prompts the scientist to ask: "If this trait was optimized, what specific function does it serve?" That specific function claim *is* testable.
  *   **Value:** It organizes research. It tells you where to look. As long as it generates testable sub-claims, it is scientifically valuable, even if the core idea is hard to pin down.

  **The Change of Mind:**
  Popper later said he was wrong to classify Darwinism as merely metaphysical. He did not say "Darwinism is perfect." He said "Darwinism *can* be formulated in a testable way."
  *   **What he abandoned:** He abandoned **Reading 1** and the strong version of **Reading 5**. He accepted that if you define fitness as a propensity (Reading 2) and specify the environment, you *can* make predictions that might fail.
  *   **What he kept:** He likely retained a softer version of **Reading 4**. Popper was always cautious about "historical sciences" explaining the past versus predicting the future. He could coherently say: "The core mechanism is testable (Reading 2), but we must be careful not to tell just-so stories about deep history (Reading 4)."

  **Conclusion on Popper:**
  His change of mind does not require every reading to be false. It requires only that the theory *can* be cast in a form that is testable (Reading 2/3). He conceded that the *tautology* charge was based on a poor formulation of the theory. However, a Popperian could still consistently argue that *many practitioners* of evolutionary biology slip into Reading 5 (telling stories that fit any data) and should be corrected.

  **Summary for your framework:**
  The online critics are using Popper's *old* worry (Reading 1/5) to attack a theory that has largely adopted the *fix* (Reading 2/3). However, their intuition that "stories can be cooked up" (Reading 4) remains a valid methodological warning, even if it doesn't render the whole field unscientific. Popper's shift was from "This is untestable" to "This is testable if you stop being sloppy."
