answer: |-
  # The "What Is Life?" Secret Theory Quiz

  **Instructions:** Read each case below. Don't overthink it—pick the answer that feels most intuitively correct to you. There are no right or wrong answers, only different ways of carving up the world. At the end, use the Scoring Key to find out which definition of life you've been using without realizing it.

  ### The Cases

  **1. The Mule**
  A mule is the offspring of a horse and a donkey. It eats, breathes, moves, and feels pain, but it is sterile and cannot have babies.
  *   **A)** Alive. It breathes and eats; reproduction isn't everything.
  *   **B)** Not Alive. If it can't make more of itself, it's a biological dead end.
  *   **C)** Alive, but it's a "dead end" organism (distinct from a full member of a species).

  **2. The Frozen Seed**
  A seed is found in a freezer, 200 years old. It shows no signs of activity. When planted, it grows into a plant.
  *   **A)** Alive the whole time. It was just sleeping.
  *   **B)** Not Alive while frozen. It was just a complex chemical waiting to start.
  *   **C)** The question is malformed. "Alive" is a potential, not a constant state.

  **3. The Hillside Fire**
  A fire spreads up a dry hill. It consumes fuel, grows, moves, and reproduces (sparks start new fires). When the fuel runs out, it stops.
  *   **A)** Alive. It eats, grows, and spreads just like a plant.
  *   **B)** Not Alive. It has no skin or boundary; it's just a chemical reaction.
  *   **C)** Alive in a way, but it can't "die," only go out.

  **4. The Prion**
  A prion is a misfolded protein. It touches normal proteins and forces them to misfold too, creating copies of itself. It has no DNA and eats nothing.
  *   **A)** Not Alive. It's just a molecule causing a chain reaction.
  *   **B)** Alive. It replicates and evolves (some strains are stronger than others).
  *   **C)** Alive, but it's a parasite on life, not life itself.

  **5. The HeLa Cell Line**
  Cells taken from a patient in the 1950s are still dividing in labs today. They have evolved to survive in dishes, but they are not part of a human body anymore.
  *   **A)** Not Alive. They are just tissue samples, not organisms.
  *   **B)** Alive. They are dividing and evolving independently.
  *   **C)** Alive, but they are a lineage, not an organism.

  **6. The Synthetic Bacterium**
  Scientists build a bacterium genome from scratch on a computer, put it in a cell, and it divides in a nutrient soup. It has the minimum genes needed to function.
  *   **A)** Alive. It functions exactly like a natural bacterium.
  *   **B)** Not Alive. It was manufactured, not born.
  *   **C)** Alive, but it's a "simulant" dependent on the lab soup.

  **7. The Transposon**
  A sequence of DNA inside a corn plant that copies and pastes itself to different spots in the plant's genome. It never leaves the cell.
  *   **A)** Not Alive. It's just part of the corn's DNA.
  *   **B)** Alive. It's a "selfish gene" looking out for its own replication.
  *   **C)** Alive, but it's a genetic parasite, not an organism.

  **8. The Offline Worm**
  A computer program on a disconnected network copies itself to other drives. It mutates its code to avoid deletion and competes for memory space.
  *   **A)** Not Alive. It's software, not biology.
  *   **B)** Alive. It evolves, competes, and replicates.
  *   **C)** Alive, but only in a virtual sense.

  **9. The Scrounger Robot**
  A robot wanders a junkyard, finds parts, and builds a working copy of itself. The copy then does the same. They do not mutate.
  *   **A)** Not Alive. It's a machine assembling parts, not growing.
  *   **B)** Alive. It makes copies of itself from raw materials.
  *   **C)** The question is malformed. It replicates, but nothing ever goes "wrong" for it.

  **10. The Slime Mold**
  Thousands of separate single-celled amoebas crawl around. When food is scarce, they merge into one giant slug-like blob that moves together, then split apart later.
  *   **A)** One Organism. The blob is the individual.
  *   **B)** Many Organisms. They are just cooperating cells.
  *   **C)** Alive, but "individual" is the wrong word for them.

  **11. The Virus Particle**
  A virus sits on a doorknob. It is inert. It cannot replicate or metabolize. If you crush it, it is destroyed.
  *   **A)** Not Alive. It's just a complex crystal until it hits a cell.
  *   **B)** Alive. It has the instructions for life, even if paused.
  *   **C)** The question is malformed. Things that can't start themselves can't be alive or dead.

  ***

  # Instructor's Scoring Key & Logical Space

  *Note to Club Leaders: Do not hand this section out to participants until after they have finished. This key is built from the logical branches of biological theory, not just a list of names. The "Named Positions" are mapped to the leaves of this tree.*

  ## Part 1: The Logical Branches

  To determine a student's position, we look at how they answered specific **Diagnostic Pairs**. The logic flows from broad metaphysical commitments down to specific biological criteria.

  ### Branch 1: The Substrate Question (Materialism vs. Information)
  *   **Diagnostic Questions:** Q8 (Computer Worm) & Q9 (Robot).
  *   **The Split:**
      *   **Path Carbon:** If they answered **Not Alive** to both Q8 and Q9. (Life requires specific chemistry).
      *   **Path Neutral:** If they answered **Alive** to Q8 or Q9. (Life is a pattern/process, substrate doesn't matter).

  ### Branch 2: The Process Question (History vs. State)
  *   **Diagnostic Questions:** Q1 (Mule) & Q2 (Frozen Seed).
  *   **The Split:**
      *   **Path History:** If they said Mule = Alive (reproduction not needed now) OR Seed = Not Alive (metabolism needed now). (Life is about what the system *does* continuously).
      *   **Path Capacity:** If they said Mule = Not Alive (must reproduce) OR Seed = Alive (potential matters). (Life is about the capacity for evolution/history).

  ### Branch 3: The Unit Question (Individual vs. Lineage)
  *   **Diagnostic Questions:** Q5 (HeLa) & Q7 (Transposon).
  *   **The Split:**
      *   **Path Organism:** If they said HeLa = Not Alive OR Transposon = Not Alive. (Life must be a bounded individual).
      *   **Path System:** If they said HeLa = Alive OR Transposon = Alive. (Life can be a lineage or information stream).

  ### Branch 4: The Normativity Question (Death vs. Cessation)
  *   **Diagnostic Questions:** Q3 (Fire) & Q11 (Virus).
  *   **The Split:**
      *   **Path Normative:** If they chose options mentioning "Can't die" or "Malformed" regarding death. (Life implies a "good" state that can be lost).
      *   **Path Physicalist:** If they chose standard Alive/Not Alive based on function. (Life is just physics; "death" is just stopping).

  ### Branch 5: The Skeptic Question (Realism vs. Anti-Realism)
  *   **Diagnostic Questions:** Count of "C / Malformed" answers.
  *   **The Split:**
      *   **Path Realist:** 0-2 "C" answers. (There is a fact of the matter).
      *   **Path Anti-Realist:** 3+ "C" answers. (The category "Life" is fuzzy or human-made).

  ---

  ## Part 2: The Leaves (Named Positions)

  Map the student's path through the branches above to find their position.

  | Path Combination | Position Name | Description |
  | :--- | :--- | :--- |
  | **Carbon + Process + Organism + Physicalist** | **The Checklist View** | Life is a box-ticking exercise (Metabolism + Growth + Reproduction) within a carbon body. Standard textbook biology. |
  | **Carbon + Process + Organism + Normative** | **Autopoiesis / Sam's View** | Life is a self-maintaining boundary. If it can't "die" (lose its self), it isn't alive. Fire fails because it has no self to lose. |
  | **Neutral + Capacity + System + Physicalist** | **Darwinian / NASA View** | "A self-sustaining chemical system capable of Darwinian evolution." Substrate doesn't matter; evolution does. Viruses/Worms count. |
  | **Neutral + Capacity + System + Normative** | **Replicator / Information** | Life is information that fights entropy. The "self" is the data, not the body. Prions and Worms are alive. |
  | **Any Path + High Skeptic Count** | **Pluralist / Deflationary** | "Life" is a fuzzy cluster concept. Some things are alive in one sense, dead in another. The question is the problem. |

  ### Empty Cells (Impossible Combinations)
  *   **Neutral Substrate + Strict Carbon Metabolism:** *Incoherent.* You cannot claim substrate doesn't matter while insisting on carbon-specific chemistry.
  *   **Capacity (History) + No Reproduction:** *Contradictory.* You cannot require evolutionary history (Capacity) while accepting sterile individuals (Mule) as the primary unit without shifting to Lineage.
  *   **Normative (Death) + Fire = Alive:** *Unattractive.* If "death" is required for life, Fire cannot be alive because it does not die, it merely ceases. No major theory holds both.

  ---

  ## Part 3: Analysis of Homemade Theories

  ### Sam's View: "The Death Test"
  *Sam argues: A mule can die, a flame can't. Therefore, the capacity for death defines life.*
  *   **Logical Location:** This maps to **Branch 4 (Normativity)** combined with **Branch 2 (Process)**.
  *   **Does it collapse?** Under pressure, Sam's view collapses into **Autopoiesis**. To "die" in a biological sense, you must first have a "self" that is being maintained. A flame doesn't maintain a self; it's a process. A mule maintains a self. Therefore, Sam is secretly arguing for **Self-Maintenance (Autopoiesis)**.
  *   **Distinction:** The only way to keep them separate is if Sam believes a Robot could "die" (break irreparably) without being Autopoietic (self-building). If Sam accepts the Robot can die, Sam is a **Functionalist**. If Sam says the Robot just "breaks," Sam is an **Autopoieticist**.
  *   **Verdict:** Sam's view is a layperson's entry point into Autopoiesis.

  ### Your View: "The Self/Non-Self Boundary"
  *You argue: Life distinguishes inside from outside robustly.*
  *   **Logical Location:** This maps to **Branch 3 (Unit)** and **Branch 2 (Process)**.
  *   **Does it collapse?** This is the core definition of **Autopoiesis** (self-creation of a boundary).
  *   **Where you disagree:** You might disagree with Autopoiesis on the **Slime Mold (Q10)**. Autopoiesis struggles with fluid boundaries. If you say the Slime Mold is "One Organism" when merged and "Many" when split, you are a **Contextual Pluralist**. If you say it's "Always Many," you are a **Strict Individualist**.
  *   **Verdict:** Your view is robust against Fire (Fire has no boundary), but struggles with HeLa cells (Where is the boundary?) and Slime Molds (Where is the line?).

  ### Indistinguishable Leaves & Tiebreakers
  *   **Autopoiesis vs. Sam's Death View:** The quiz **cannot** separate these. Both require a bounded self that can fail.
      *   *Tiebreaker Question:* "A robot is turned off permanently. Did it die, or did it stop?" (Sam: Died. Autopoiesis: Stopped, unless it was self-repairing).
  *   **Darwinian (NASA) vs. Replicator (Info):** Both accept digital life and viruses.
      *   *Tiebreaker Question:* "A computer virus that copies itself but never changes (mutates)." (Darwinian: Not Alive, no evolution. Replicator: Alive, it replicates).
  *   **Checklist vs. Autopoiesis:** Both reject Fire and Robots.
      *   *Tiebreaker Question:* "The Frozen Seed." (Checklist: Not Alive, no metabolism. Autopoiesis: Alive, the organization persists potentially).

