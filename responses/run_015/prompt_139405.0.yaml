  # Club Discussion Guide (Post-Quiz)

  1.  **Check the "Pluralists":** If anyone scored high on "Malformed/Other," ask them: "Is science impossible if categories are fuzzy?" This usually sparks a fight about whether biology is a "real" science like physics.
  2.  **The Fire Trap:** Everyone who called Fire "Alive" usually ignores the Boundary criterion. Ask them: "If I pour water on the fire, did I murder it, or just remove its fuel?" If they say "remove fuel," ask: "If I starve a dog, is that the same?"
  3.  **The Virus Resolution:** The reason the club argued about viruses last month is that **Checklist** people say No (no metabolism), but **Darwinian** people say Yes (evolution). The quiz proves you were using different dictionaries, not arguing about facts.
  4.  **Sam's Challenge:** Ask Sam: "If we build a robot that repairs its own damage and gets 'sick' when its parts wear out, can it die?" If Sam says Yes, Sam has accepted machines can be alive. If No, Sam must explain the magic difference between a cell and a robot.
  5.  **Your Boundary Challenge:** Ask the group: "Is a nation-state alive? It has a boundary, distinguishes citizens (self) from foreigners (non-self), and sustains itself." If they say No, ask why a cell is different. (Answer: Cells build their own boundary; nations are built by cells).
