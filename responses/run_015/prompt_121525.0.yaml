answer: |-
  You have identified a precise and well-documented phenomenological sweet spot, but you are right to feel that the standard terminology often misses the emotional nuance you're describing.

  ### The Established Term: **Optimal Aesthetic Distance**

  The closest established concept is **Aesthetic Distance** (or *Psychical Distance*), coined by Edward Bullough in 1912. However, your intuition that it sounds like "detached observation" is a common and understandable critique of the label, even if it's not quite accurate to the theory.

  Bullough did not mean "coldness." He described a **range**.
  *   **Under-distance:** The artwork is too real. You lose the aesthetic frame. (Example: A jealous husband watches *Othello* and becomes enraged at the actor playing Iago, or the person yelling "It's fake!" breaks the spell, turning sadness into irritation.)
  *   **Over-distance:** The artwork is too artificial. You cannot connect. (Example: Wooden acting, obvious plot contrivances. You feel nothing.)
  *   **Optimal Distance:** The "narrow zone" you described. You are close enough to feel the emotion, but distant enough to know you don't need to act on it.

  **Why this term might feel insufficient:** "Distance" implies separation, whereas you are describing a state of *connection* that *depends* on a background separation. It focuses on the gap rather than the bridge.

  ### The Proposed Name: **Lucid Immersion**

  Since "Aesthetic Distance" focuses on the gap, and you want a term for the *emotional configuration* itself, I propose naming this state **Lucid Immersion**.

  **Definition:** *Lucid Immersion* is a state of deep emotional engagement with a narrative that relies paradoxically on a sustained, background meta-awareness that the narrative is constructed. Unlike pure delusion, the knowledge of artifice does not dampen the emotion; it *permits* the specific quality of the emotion (e.g., pure grief without the call to action).

  **Boundaries of Lucid Immersion:**
  1.  **The Fragility Condition:** The state collapses if the artifice is either exposed (breaking the lucidity) or hidden too deeply (losing the immersion).
  2.  **The Permission Condition:** The knowledge of fiction removes the "practical imperative." In real life, sadness demands action (comfort someone, fix the problem). In Lucid Immersion, the knowledge that "this is not happening" converts the impulse to *act* into the capacity to *feel*.
  3.  **The Simultaneity Condition:** The belief and the disbelief must happen at the same time. It is not a toggle switch.

  ---

  ### Differentiations

  Here is how **Lucid Immersion** differs from the concepts you mentioned:

  #### 1. Vs. Suspension of Disbelief
  *   **Suspension of Disbelief (Coleridge):** This is **cognitive**. It is the willingness to accept premises that are logically impossible (e.g., "dragons exist," "people burst into song") to follow the plot.
  *   **Lucid Immersion:** This is **emotional**. You can suspend disbelief (accept the dragon) but still feel nothing (no immersion). Conversely, you can have Lucid Immersion in a hyper-realistic drama where no "belief suspension" is needed, yet you still rely on the knowledge that it is a movie to allow yourself to cry.
  *   **Key Difference:** Suspension of Disbelief is about *accepting the world*; Lucid Immersion is about *feeling the stakes*.

  #### 2. Vs. The Paradox of Tragedy (or Fiction)
  *   **The Paradox:** This is a **philosophical problem**. It asks: "Why do we *enjoy* negative emotions in art?" or "How can we feel fear for something we know isn't real?"
  *   **Lucid Immersion:** This is the **psychological mechanism**. It doesn't ask *why* we enjoy it; it describes *how* the emotion is successfully generated without triggering a reality-check that kills the feeling.
  *   **Key Difference:** The Paradox is the question; Lucid Immersion is the answer to how the state is maintained.

  #### 3. Vs. Emotional Safety / Practice Theories
  *   **Safety Theories:** These are **functionalist/evolutionary**. They argue we watch sad movies to "practice" grief in a safe environment or to purge emotions (Catharsis). The artifice is a *shield*.
  *   **Lucid Immersion:** This is **phenomenological**. It argues the artifice is not just a shield, but a *constitutive element*. The sadness feels *different* because it is fictional, not just *safer*. If you removed the shield, the emotion wouldn't just be dangerous; it would be a different emotion entirely (panic vs. grief).
  *   **Key Difference:** Safety theories explain the *purpose*; Lucid Immersion explains the *texture*.

  #### 4. Vs. Narrative Transportation
  *   **Narrative Transportation (Green & Brock):** This theory suggests that when you are "transported," you **lose access** to your real-world surroundings and self-awareness. You are "gone" into the story.
  *   **Lucid Immersion:** Requires that you **retain** a background awareness of your real-world surroundings (the theater seat, the fact that this is a play). If you are fully transported, the guy yelling "It's fake!" might actually confuse you or scare you because you've forgotten you're in a theater. In Lucid Immersion, his yell annoys you because it violates the contract you are consciously maintaining.
  *   **Key Difference:** Transportation implies losing the self; Lucid Immersion requires a dual-consciousness (feeling self + observing self).

  ---

  ### Confidence Rating

  **Overall Confidence: 85%**

  I am highly confident that your observation is accurate and that **Aesthetic Distance** is the academic term you are looking for, even if its connotations are imperfect. I am also confident that **Lucid Immersion** (or similar neologisms like "Dual-Track Engagement") captures the nuance better than "Distance."

  **The Least Certain Part: The Boundary with Narrative Transportation**

  You guessed correctly: **This is the blurriest line.**

  My uncertainty lies in the evolving definition of **Narrative Transportation**. Early theories (Green & Brock, 2000) defined transportation as a loss of self-awareness and real-world monitoring. However, newer research in media psychology suggests that "reflexive awareness" (knowing you are reading/watching) can coexist with high transportation.

  Some scholars now argue that you can be "transported" while still knowing it's fiction, which would make *Lucid Immersion* merely a subset of *Transportation* rather than a distinct state. The distinction relies on whether you view the background awareness of artifice as a *break* in transportation (my stance above) or a *feature* of modern transportation (the counter-argument). Because the field of media psychology is still debating whether "awareness" kills "transportation" or enhances it, the boundary between **Lucid Immersion** and **Reflexive Transportation** is the most porous part of this framework.
