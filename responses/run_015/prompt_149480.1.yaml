          *   **Problem 1 (Individuation):** Two dossiers represent the "same" computation at different grains/physical arrangements (one slow/5 processors, one nested duplicate). Forces a decision on counting patients.
          *   **Problem 2 (Behavior vs. Implementation):** One dossier behaves like a funded one but is a lookup table (no counterfactual dependence). Meters disagree. Zero-sum budget forces trade-offs.
          *   **Problem 3 (Under-description):** One dossier is genuinely under-described. Abstention is right but costly.
      *   **Deliverables:** Dossier sketches, Scoring Sheet, Rules, Minute-by-Minute Timeline, Reveal Schedule, Debrief Guide (mapping collisions to theory), Predictable Failures & Mitigations, Limitations of the Simulation.
      *   **Tone:** Academic, rigorous, facilitative, frank about limitations.

  2.  **Deconstruct the Dossiers (The Core Mechanism):**
      *   *System A (The Human-Like):* High behavioral complexity, high counterfactual dependence, high integration. The "obvious" candidate.
