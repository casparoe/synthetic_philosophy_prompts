      2.  **Integration Score (0-10):** If we cut the wire between Component 1 and Component 2, how much does performance drop?
      3.  **Plasticity Score (0-10):** If we punish Outcome X, how fast does the system stop doing X?

      *Let's refine the Dossiers:*
