          *   Reading/Round 1: 15 min
          *   Negotiation/Round 2: 25 min
          *   Final Submission: 5 min
          *   Debrief/Reveal: 25 min
          *   Total: 75 min.

  4.  **Developing the Dossiers (Detailed Content):**
      *   *Need to ensure the "Collisions" are visible.*
      *   *System A (Alpha):* Standard neural net. High scores on all meters.
      *   *System B (Beta):* Lookup table. Transcript matches Alpha. Meters: Sensitivity=0, Cohesion=0, Adaptability=0.
      *   *System C (Gamma):* 5 distributed nodes. Transcript matches Alpha (slowed). Meters per node are lower, but aggregate? Or describe it as "5 units." Let's make the dossier describe "5 synchronized units."
      *   *System D (Delta):* Recursive. Transcript shows self-modeling. Implementation shows a sub-routine that replicates the main loop.
      *   *System E (Epsilon):* Missing data. "Sensor malfunction."
      *   *System F (Zeta):* Simple Q-learning. High Adaptability, low Cohesion.

