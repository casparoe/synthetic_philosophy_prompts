      *   *System C (The Distributed Slow):* Same logic as A, but spread across 5 nodes, running 5x slower. *Individuation Problem:* Is it 1 mind or 5?
      *   *System D (The Nested Duplicate):* Contains a simulation of itself inside it. *Individuation Problem:* Is the inner one a separate patient?
      *   *System E (The Black Box):* Under-described. Meters fluctuate or are missing. *Uncertainty Problem.*
      *   *System F (The Reward Maximizer):* Simple reinforcement learner. High reward sensitivity, low integration. *Control Problem.*

      *Refining the Meters:* Need plain language.
      1.  *Counterfactual Sensitivity:* "If we changed the input at step 10, how much would the output at step 100 change?"
      2.  *Internal Cohesion:* "How much does Part X know about what Part Y is doing?"
