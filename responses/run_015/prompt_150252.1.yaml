          *   *Tension B (The Shadow Party Paradox):* Claim 6 vs. Claim 1. This is the big one. If the backbone *is* a party, sortition fails Weil's test.
          *   *Tension C (The Oligarchy Concession):* Claim 4 vs. Claim 1. If abolition leads to oligarchy, is the abolition moral?
      *   *Ranking:*
          1.  Shadow Party (Claim 6) - Most severe logical contradiction.
          2.  Functional Necessity (Claim 2) - Philosophical tension.
          3.  Oligarchy Risk (Claim 4) - Practical tension.
      *   *Cheapest Revision:* Tweak Claim 6. Don't call it a "shadow party." Call it a "rotating facilitation secretariat" bound by strict anti-pressure rules.
      *   *Single Change:* Abandon the idea that organization *must* look like a party (Claim 2). Embrace Weil's distinction between "collective action" and "party structure."
