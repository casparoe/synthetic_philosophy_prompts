      *   *Single Run:*
          *   Non-null sig rate: $\pi \times \text{Power} = 0.20 \times 0.80 = 0.16$. (Correct)
          *   Null sig rate: $(1-\pi) \times \alpha = 0.80 \times 0.05 = 0.04$. (Correct)
          *   Total sig: $0.16 + 0.04 = 0.20$. (Correct)
          *   FDR: $0.04 / 0.20 = 0.20$ (20%). (Correct)
      *   *Dual Run:*
          *   Condition: Both significant *and* same direction.
          *   *Nulls:* Two-sided $\alpha = 0.05$. One-sided tail is $0.025$. Probability both sig in *specific* direction (e.g., positive) is $0.025^2$. Probability both sig in *same* direction (either both pos or both neg) is $0.025^2 + 0.025^2 = 2 \times 0.025^2$.
          *   Student calculation: $2 \times 0.025^2 = 2 \times 0.000625 = 0.00125$. (Correct).
          *   Weighted by null proportion ($0.80$): $0.80 \times 0.00125 = 0.001$. (Correct).
          *   *Non-Nulls:* Power is $0.80$ for two-sided test. This usually means $P(|Z| > 1.96 | H_1)$.
          *   *Crucial Detail:* Does "Power = 0.80" imply the probability of getting significance in the *correct* direction? Usually, yes, assuming the effect is in the expected direction. However, the dual-run requires *same direction*.
          *   Student assumption: "chance both come out significant in the wrong direction is... ignored."
          *   Student calculation for Non-Nulls: $0.80 \times 0.80 = 0.64$.
          *   *Wait:* Power ($1-\beta$) is typically defined as $P(\text{reject } H_0 | H_1)$. For a two-sided test, this includes rejecting in the wrong direction (though rare with high power). However, the constraint is "significant... *and* in the same direction."
          *   If Power = 0.80 refers to the two-sided rejection rate, the probability of rejecting in the *correct* direction is slightly less than 0.80 (some mass is in the wrong tail). But with Power=0.80, the wrong tail probability is negligible (as the student notes, $\approx 10^{-6}$). So approximating $P(\text{Sig in Correct Direction}) \approx 0.80$ is fine.
          *   *Independence:* The student assumes independence between Original and Replication. The prompt says "separate studies are independent." So $0.80 \times 0.80 = 0.64$ is correct for the conditional probability of replication success given the hypothesis is true.
          *   Weighted by non-null proportion ($0.20$): $0.20 \times 0.64 = 0.128$. (Correct).
          *   Total Published: $0.128 + 0.001 = 0.129$. (Correct).
