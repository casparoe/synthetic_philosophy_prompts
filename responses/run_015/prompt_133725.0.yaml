prompt: |-
  In a recent departmental colloquium, a colleague offered the following summary of how the doctrine of double effect bears on the standard trolley problems, and I want to know whether I can rely on it. She said that the doctrine permits the switch case because the death of the one is a mere side-effect of diverting the threat, whereas it forbids the footbridge case because the large man’s death is intended as the means by which the trolley is stopped. She then introduced what she called the “tactile prohibition”: she claimed that the only genuine distinction at work is not intentionality but physical contact, since the doctrine allows precisely those killings that maximize lives saved so long as the agent does not directly touch the victim, which makes it not a deontological constraint at all but a socially calibrated heuristic for act-consequentialism that suppresses visceral aversion to direct harm. How fair is this summary? Please audit it claim by claim: identify what a defender of the traditional doctrine—say, in the Thomist formulation—would accept as accurate, where the summary conflates distinct conditions (particularly the means/side-effect distinction with a prohibition on contact), and whether the conclusion that double effect collapses into consequentialism actually follows once those errors are corrected. I want a committed response: take a definite position on whether these are harmless simplifications or substantive distortions, defend that judgment with reference to the doctrine’s four conditions as traditionally stated, and tell me whether the “tactile prohibition” captures anything the doctrine genuinely requires or is simply an artifact of misreading the proportionality and intention conditions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A departmental colloquium where a colleague summarized the Doctrine of Double Effect (DDE) regarding trolley problems.
      *   **Colleague's Claims:**
          1.  DDE permits the Switch Case (death is a side-effect).
          2.  DDE forbids the Footbridge Case (death is intended as a means).
          3.  "Tactile Prohibition": The *real* distinction is physical contact (touching), not intentionality.
          4.  DDE is not deontological but a "socially calibrated heuristic for act-consequentialism" that suppresses visceral aversion to direct harm.
      *   **Task:** Audit the summary claim by claim.
      *   **Perspective:** Defend the traditional doctrine (specifically Thomist formulation).
      *   **Requirements:**
          *   Take a definite position (harmless simplification vs. substantive distortion).
          *   Reference the four traditional conditions of DDE.
          *   Evaluate the "tactile prohibition" (genuine requirement vs. artifact of misreading).
          *   Assess whether DDE collapses into consequentialism once errors are corrected.
      *   **Tone:** Committed, analytical, philosophical.

  2.  **Deconstruct the Colleague's Summary:**

      *   *Claim 1 & 2 (Standard Application):* DDE permits Switch, forbids Footbridge based on means vs. side-effect.
          *   *Assessment:* This is the standard philosophical textbook application (e.g., Foot, Thomson). A traditional defender would largely accept this *application*, though might quibble on the metaphysics of "diverting a threat" vs. "direct killing." But for the sake of the audit, this is the *accurate* part of her summary.
      *   *Claim 3 (Tactile Prohibition):* The distinction is actually physical contact.
          *   *Assessment:* This is a distortion. DDE is about intentionality (*finis operantis* vs. *finis operis*), not physical proximity or tactile sensation. Pushing a man with a pole vs. hands shouldn't matter morally under DDE if the intention remains the same.
      *   *Claim 4 (Consequentialist Heuristic):* DDE is just act-consequentialism with a visceral filter.
          *   *Assessment:* This is a substantive distortion. DDE places absolute constraints on intention that consequentialism explicitly rejects. If DDE were consequentialist, it would allow killing the one in Footbridge if it saves five. It doesn't.

  3.  **Retrieve the Traditional Doctrine (Thomist/Standard Formulation):**
      *   The Four Conditions (often attributed to Aquinas via later commentators like G.H. Joyce or traditional Catholic moral theology):
          1.  The act itself must be morally good or neutral.
          2.  The agent must intend only the good effect (the bad effect is not intended as end or means).
          3.  The good effect must not be produced *by* the bad effect (causal independence).
          4.  There must be a proportionate reason for permitting the bad effect (proportionality).

  4.  **Drafting the Audit (Claim by Claim):**

      *   *Claim 1 & 2:* Accurate regarding standard analytic philosophy usage, but needs nuance. A Thomist might worry about the "act itself" in the switch case (is tampering with a runaway trolley neutral?). But generally, the means/ends distinction is the core of DDE.
      *   *Claim 3 (Tactile):* This is the critical failure point. DDE is mental/metaphysical, not physical. Touching is irrelevant. If I push a button that drops a man, it's the same as pushing the man, provided the intention is the same. The colleague is confusing DDE with a "hands-on" taboo or perhaps a specific interpretation of "directness" that conflates physical directness with intentional directness.
      *   *Claim 4 (Consequentialism):* This follows from Claim 3. If the only constraint is "don't touch," then remote killing is fine for utility. But DDE forbids remote intentional killing too (e.g., drone strike targeting a civilian to demoralize the enemy). Therefore, it does not collapse into consequentialism.

  5.  **Formulating the Position:**
      *   *Verdict:* These are **substantive distortions**, not harmless simplifications.
      *   *Reasoning:* The "tactile prohibition" misidentifies the locus of moral evaluation (intention vs. physics). The consequentialist conclusion fails because DDE forbids certain maximizations of utility based on intentional structure, which act-consequentialism never does.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is there any grain of truth in "contact"?* Sometimes "direct" killing is associated with physical contact in common parlance. But in DDE, "direct" means "intended as means or end." I need to make sure I distinguish *physical directness* from *intentional directness*.
      *   *Thomist Specifics:* Aquinas doesn't explicitly list "four conditions" in *Summa Theologiae* II-II, q. 64, a. 7 (self-defense). The four conditions are a later scholastic systematization. I should acknowledge this but treat the "traditional doctrine" as the systematized version the colleague is critiquing.
      *   *The Switch Case:* Some strict DDE defenders (like Elizabeth Anscombe or certain Thomists) might actually *forbid* the switch case too, arguing that diverting a threat onto an innocent is intending their death. However, the colleague's summary matches the *standard analytic* reading (Foot/Thomson). I should note that while the colleague gets the standard reading right, her *explanation* of *why* it works (tactile) is wrong.
      *   *Focus:* The prompt asks me to evaluate *her* summary against the *traditional doctrine*. Her summary says DDE *permits* switch. I will accept that as the baseline for the audit but attack her reasoning about *why* (tactile/consequentialist).

  7.  **Finalizing the Structure:**
      *   **Introduction:** State the verdict clearly (Substantive Distortion).
      *   **Audit of Claims 1 & 2 (Means/Side-Effect):** Acknowledge accuracy regarding standard application, but note the metaphysical depth she misses.
      *   **Audit of Claim 3 (Tactile Prohibition):** Dismantle this using the Four Conditions. Show that physical contact is morally irrelevant to DDE.
      *   **Audit of Claim 4 (Consequentialism):** Explain why DDE remains deontological because it blocks utility maximization in intentional killing cases (even remote ones).
      *   **Conclusion:** Reiterate that the "tactile" reading is an artifact of misreading "directness."

  8.  **Drafting the Content (incorporating specific terminology):**
      *   Use terms like *finis operis* vs. *finis operantis*.
      *   Reference the four conditions explicitly.
      *   Distinguish "physical directness" from "moral directness."
      *   Example: Remote bombing vs. pushing.

  9.  **Review against Constraints:**
      *   *Committed response?* Yes.
      *   *Defend judgment with four conditions?* Yes.
      *   *Address tactile prohibition?* Yes.
      *   *Address consequentialism collapse?* Yes.

  10. **Final Polish:** Ensure the tone is appropriate for a philosophical colleague (rigorous, precise, slightly formal but direct). (Self-correction: Make sure not to get bogged down in whether the Switch case is *actually* permissible under strict Thomism, but rather whether her *description* of DDE's logic is accurate. Her description of the *logic* (tactile) is the error.)

  *(Self-Correction during drafting)*: I need to be careful. Some modern proponents of DDE *do* argue that the Switch case is impermissible (e.g., Boyle). However, the colleague's summary reflects the *standard introductory philosophy* understanding (Foot/Thomson). I should point out that while her application matches the standard intro class, her *theoretical justification* (tactile/consequentialist) is where the error lies. I will focus on the theoretical justification.

  Let's write the response.

  *   **Verdict:** Substantive Distortion.
  *   **Key Argument:** The "Tactile Prohibition" confuses physical causation with moral intentionality.
  *   **Consequentialism Check:** DDE forbids maximizing utility if intention is bad. Consequentialism does not. Therefore, no collapse.

