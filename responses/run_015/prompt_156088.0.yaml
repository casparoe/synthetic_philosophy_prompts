answer: |-
  Here are the three positions restated in sourcing vocabulary, followed by the residue report, the standing test, the newsroom comparison, and the conclusion.

  ### The Three Positions Translated

  **1. The Record Wins**
  The documentary record constitutes primary source material suitable for the paper's voice. Community memory is anecdotal, uncorroborated testimony, often single-sourced or anonymous. Under verification standards, a document trumps oral history. Where the two conflict, the oral account is treated as a factual error. We do not print the memory as fact; if we must reference it, it carries full attribution ("residents claim"), and if the document disproves it, the discrepancy is handled as a correction to the public record, not a rewrite of the document.

  **2. The Community Version is Functional**
  The community account is not a factual claim subject to standard verification; it is a binding agreement within the group. Treating it as a report on events and subjecting it to document-checking destroys its utility. We cannot print it in the paper's voice because it fails verification, but printing a correction based on documents causes harm that accuracy guidelines do not account for. The story here is not the event, but the persistence of the account. We print the memory with attribution, not to validate the facts, but to document the existence of the belief, acknowledging that overriding it with a document would be an act of erasure rather than clarification.

  **3. Different Genres, No Conflict**
  The document and the memory are answering different questions under different editorial norms. The document answers "what occurred" (hard news, verification); the memory answers "what binds us" (analysis, meaning). There is no need to reconcile them in the copy. We state the document in the paper's voice and the memory in the sources' voice. Neither requires a correction because neither is making a claim the other invalidates. We keep the lanes separate to avoid confusing the reader about what is verified fact and what is communal interpretation.

  ### Residue Report

  **What Maps Cleanly**
  Position 1 is the native tongue of the newsroom. It aligns perfectly with the hierarchy of sources: documents are on the record and stable; memory is off the record or fragile. The concept of a "correction" fits neatly here—if the source is wrong, we correct the record. Position 3 also maps well to the distinction between news copy and feature/analysis copy. We have established protocols for keeping fact and interpretation separate via attribution.

  **What Fits Only With Distortion**
  Position 2 requires distorting the definition of "accuracy." To print a claim we know contradicts the primary source, even with attribution, violates the implicit contract that attribution signals uncertainty, not alternative ontology. It forces the editor to treat a factual falsehood as a "cultural truth," which sourcing vocabulary has no box for. We can attribute the *belief*, but Position 2 asks us to validate the *function* of the belief, which is outside the scope of verification. To make this fit, we have to pretend the memory isn't making a factual claim, even when the community insists it is.

  **What Cannot Be Expressed**
  The core of Position 2—that the memory *is* the reality for the group, regardless of the document—is inexpressible. Sourcing vocabulary assumes an external reality that sources approximate. If the community's reality is generated by the memory itself, our vocabulary for "correction" becomes an act of violence rather than hygiene. We have no term for "accurate to the document but wrong about the people."

  **The "Single What-Happened" Assumption**
  Position 1 explicitly relies on the assumption that there is a single, recoverable event that the document captures better than the witness. Position 3 claims to reject this by separating the questions, but it secretly relies on it to draw the line: it assumes the document *does* hold the "what-happened" authority, while the memory holds the "meaning" authority. It only works if we grant the document the monopoly on factual reality. Position 2 is the only one that genuinely challenges the assumption, but as noted, the vocabulary chokes on it.

  ### The Standing Test

  Your suspicion holds: this dispute is primarily about standing, not verification.

  In Position 1, standing is granted to the institution that holds the documents. The reporter acts as the agent of the archive. The "we" who decide what happened is the newsroom and the record-keepers.
  In Position 2, standing is granted to the community. The reporter acts as a witness to the community's self-definition. The "we" is the neighborhood or family.
  In Position 3, standing is split. The document keeps the facts; the community keeps the meaning.

  This is not merely Position 3 in different clothes. Position 3 attempts a procedural solution (separate the claims) to a power struggle (who decides). The suspicion reveals that Positions 1 and 2 are not actually disagreeing about the quality of the evidence; they are disagreeing about who has the authority to certify the past. Position 1 says the certifier is the one with the paper trail. Position 2 says the certifier is the one who lives with the consequence. When a reporter chooses Position 1, they are not just verifying; they are ruling that the document-holder has standing over the witness. When they choose Position 2, they are ruling that the witness has standing over the document. The vocabulary of "sourcing" masks this by framing it as "strength of evidence," but a death certificate is not "stronger" than a mother's account in a moral sense; it is only stronger in an institutional sense.

  ### The Newsroom Internal Case

  The case where newsroom memory (clips, past copy) diverges from documents is a **misleadingly easy model** for the collective-memory dispute.

  It is easier because the newsroom holds standing over both sides of the equation. We own the clips, and we own the authority to issue the correction. When we find a discrepancy between what we printed in 1990 and what the files show today, we can rewrite our own history without external resistance. The "community" being corrected is ourselves.

  In the town/family dispute, the newsroom holds the documents, but the community holds the memory. When we issue a correction based on the document, we are not cleaning up our own error; we are intervening in someone else's ecosystem. The internal case assumes a unified authority that can reconcile the two. The external case is an asymmetry of power: we have the power to print the document, they have the power to reject our paper. The internal case suggests the conflict is solvable by better archiving; the external case reveals the conflict is about jurisdiction.

  ### Conclusion: Gap or Fuzziness?

  What is left over is a **gap in sourcing vocabulary**.

  The vocabulary is built for *verification*, not *reconciliation*. It has tools to determine if a source is reliable, but no tools to determine what to do when two reliable sources of different kinds (documentary vs. communal) describe incompatible realities that both serve essential functions.

  Position 1 is clear but often morally blunt. Position 3 is clean but often intellectually dishonest (pretending the conflict doesn't exist). Position 2 is morally nuanced but journalistically incoherent under current standards.

  The inability to express Position 2 without sounding like we are abandoning accuracy suggests the vocabulary lacks a category for "social fact." We treat facts as things that exist independent of belief. But for the community, the memory *is* the fact that matters. A reporter has no way to say, "This is factually false according to the record, but true according to the people, and both truths matter," without violating the policy on the paper's voice. We are forced to either debunk the memory or hide the document. That is not a conceptual fuzziness in the positions; it is a structural limitation in the craft. We have no protocol for printing two truths that cannot coexist.
