  *(Refining the "Standing" argument):* The prompt asks to test the suspicion that the dispute is about standing. I need to conclude whether that suspicion holds water or if it's just Pos 3 restated. I think it's the underlying engine of all three. Pos 1 grants standing to the document-keeper. Pos 2 grants standing to the community. Pos 3 tries to grant standing to both by separating lanes.

