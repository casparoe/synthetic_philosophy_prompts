answer: |-
  1. The Exam Question

  **Metaethics Final Examination**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Marks:** 20

  **Question 1**

  Consider a community, *The Filterers*. Their ancestral moral judgments were produced exactly as evolutionary debunkers claim: by selective pressures rewarding fitness-conducive social responses, indifferent to moral truth. However, over many generations, *The Filterers* instituted a purely internal practice of filtering. They record occurrent moral judgments, discard any that contradict other judgments the community is unwilling to surrender or that flip when the same case is redescribed, generalize the survivors into principles, and use those principles to revise further judgments. This filter never consults the world and contains no premise about what the moral facts are. The surviving judgments are perfectly coherent, framing-stable, and systematic.

  Write an essay addressing the following:

  1.  Distinguish between two forms of evolutionary debunking arguments: (a) the claim that judgments were shaped by pressures with no tendency to track moral truth, and (b) the claim that moral facts play no role in the best explanation of why we hold the judgments we do. Analyze whether *The Filterers'* practice provides a reason to think their judgments true that a proponent of (a) must take seriously, and whether it provides a reason that a proponent of (b) must take seriously. Explain why the filter looks relevant to one form and inert (or worse) against the other.
  2.  Consider the debunker's retreat: restricting the argument to unreflective, affect-driven judgments while exempting the outputs of careful reasoning. What would the debunker have to establish for this restriction to be non-arbitrary? Does this restriction survive the observation that the capacity for practical reasoning is itself a product of the same selective history and operates on materials supplied by the very judgments under suspicion?
  3.  **Verdict:** Name the single premise you would give up if you had to make your position consistent. Say what giving it up costs you in first-order ethics or metaethical commitment.

  *Note: Do not summarize the views of specific authors. Argue for your own position using the concepts provided.*

  ***

  2. Model Answer

  The case of *The Filterers* isolates the structural weakness in evolutionary debunking arguments (EDAs) by separating causal origin from procedural refinement. To evaluate it, we must distinguish the two forms of EDA. The first (Tracking) argues that because evolution shaped judgments for fitness rather than truth, we lack justification for believing them. The second (Explanatory) argues that because moral facts are unnecessary to explain why we hold these judgments, we lack justification for believing them.

  *The Filterers'* practice offers a robust response to the Tracking argument but fails against the Explanatory argument. Against the Tracking claim, the filter introduces a mechanism independent of the initial selective pressure. If the filtering process relies on logical consistency and framing stability, it arguably employs norms of reasoning that are truth-apt, even if the raw intuitions were not. A proponent of the Tracking argument must concede that a system can begin with fitness-oriented inputs but converge on truth through rational refinement, provided the rules of refinement themselves track truth. The coherence and stability of the survivors suggest that fitness-conduciveness is not the *only* variable determining the output. Thus, the filter provides a reason the Tracking debunker must take seriously: it breaks the direct link between selective pressure and current judgment.

  However, the filter is inert against the Explanatory argument. This argument does not care whether the judgments are coherent; it cares about what explains their existence. For *The Filterers*, the complete explanation of their moral beliefs involves evolutionary history plus psychological constraints on consistency. Moral facts play no role in this explanation. The filter is simply another non-moral cause—a sociological mechanism for consistency. Adding a layer of internal coherence does not invite moral facts into the explanatory picture. If the Explanatory debunker argues that justification requires moral facts to figure in the etiology of belief, the filter changes nothing. Indeed, it makes matters worse: it demonstrates that complex moral systems can arise entirely from non-moral causes (evolution + logic), reinforcing the claim that moral facts are explanatorily redundant.

  The debunker might retreat, arguing that EDAs only target unreflective, affect-driven intuitions, sparing the outputs of careful reasoning (like *The Filterers'* principles). For this restriction to be non-arbitrary, the debunker must establish that the capacity for practical reasoning is not itself subject to the same evolutionary pressures as the intuitions. They must show that reasoning operates as a neutral tribunal rather than a tool for rationalization.

  This restriction collapses under scrutiny. The capacity for practical reasoning is itself a product of selective history. We reason using concepts and cognitive structures evolved for social coordination. If the "materials supplied by the very judgments under suspicion" are tainted by fitness-seeking, the reasoning process manipulating them is equally suspect. To exempt reasoning is to assume what is contested: that human rationality transcends its evolutionary origins. Unless the debunker can show that logical norms are evolutionarily neutral (a difficult claim given the social utility of consistency), the retreat fails. The filter is just evolved reasoning applied to evolved intuitions; both are within the scope of the debunking hypothesis.

  **Verdict**

  To maintain consistency, I would give up the **Explanatory Premise**: the claim that moral facts must play a role in the best explanation of our moral beliefs for those beliefs to be justified.

  Giving this up costs me a naturalistic conception of epistemic justification. It requires accepting that some domains of knowledge (like morality or mathematics) are justified not because their objects cause our beliefs, but because our beliefs are indispensable for making sense of our experience or agency. I must accept a form of non-naturalist realism where moral facts are explanatorily inert regarding belief formation yet normatively authoritative. The cost is a disconnect between the scientific worldview (which explains beliefs via cause and effect) and the normative worldview (which justifies beliefs via reason and value). I must live with the tension that moral truth is real and knowable, even if it is causally effete. This is preferable to the alternative: accepting the Explanatory Premise leads to global moral skepticism, forcing me to treat all moral deliberation as a fictionalist project, which undermines the very seriousness of ethical life.

  ***

  3. Marking Scheme

  **Total: 20 Marks (5 Points x 4 Marks)**

  **1. Distinction and Analysis of Tracking Argument (4 Marks)**
  *   **Must Hit:** Clearly distinguish the Tracking/Shaping argument (causal history vs. truth) from the Explanatory argument (etiology vs. moral facts). Correctly identify that the Filter *does* offer a counter-reason to the Tracking argument (coherence/refinement breaks the direct fitness link).
  *   **Common Error:** Treating the two arguments as identical or claiming the filter solves both equally.
  *   **Note:** 2 marks for distinction, 2 marks for correct analysis of the Filter's relevance to Tracking.

  **2. Analysis of Explanatory Argument (4 Marks)**
  *   **Must Hit:** Correctly identify that the Filter is *inert* against the Explanatory argument. Explain that coherence is still a non-moral cause, so moral facts remain absent from the explanation of belief.
  *   **Common Error:** Claiming that coherence makes moral facts explanatorily relevant, or confusing explanatory irrelevance with the falsity of moral claims.
  *   **Note:** Marks awarded for seeing that internal consistency does not alter the causal/explanatory genealogy.

  **3. Critique of the Debunker's Retreat (4 Marks)**
  *   **Must Hit:** Identify the condition for non-arbitrariness (reasoning capacity must be independent of selective history). Argue that reasoning capacities are also evolved and operate on tainted materials.
  *   **Common Error:** Accepting the retreat without challenge, or arguing that logic is universally valid without addressing its evolutionary implementation.
  *   **Note:** Focus on the genetic fallacy aspect: if the tool (reason) is evolved for fitness, it cannot certify the product.

  **4. The Verdict: Premise Sacrifice (4 Marks)**
  *   **Must Hit:** Explicitly name one premise to reject (e.g., Explanatory Premise, Causal Premise, or Epistemic Principle). Do not hedge.
  *   **Common Error:** Refusing to choose, or saying "it depends on the theory" without committing to a cost.
  *   **Note:** The specific premise matters less than the clarity of the sacrifice.

  **5. The Verdict: Cost Analysis (4 Marks)**
  *   **Must Hit:** Articulate the specific metaethical or first-order cost of the sacrifice (e.g., accepting non-naturalism, losing naturalistic justification, accepting skepticism).
  *   **Common Error:** Vague statements like "it costs me confidence" without specifying the philosophical trade-off (e.g., naturalism vs. realism).
  *   **Note:** Must show understanding that metaethical choices constrain first-order commitment.

  **Calibration Note:**
  *   **A Answer (16-20):** Integrates the distinction into the analysis of the Filter (showing *why* it works for one but not the other). The critique of the retreat focuses on the *capacity* for reasoning, not just the inputs. The verdict acknowledges a genuine philosophical cost (e.g., loss of naturalism) rather than a mere inconvenience.
  *   **B Answer (12-15):** Correctly distinguishes the arguments and analyzes the Filter but treats them in isolation. The critique of the retreat is standard (reasoning is evolved) but lacks depth on *why* that matters for justification. The verdict is clear but the cost is under-described.
  *   **C Answer (8-11):** Summarizes the prompt without analyzing the structural difference between the two EDAs. Fails to see why the Filter fails the Explanatory argument. Verdict is vague.
