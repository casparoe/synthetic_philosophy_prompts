      *   *Attempt 2 (Closer):* Describe the "Filter Community." They start with fitness-based judgments. They filter for coherence over generations. No external input. Question: Does this survive debunking? Distinguish between the argument from causal origins and the argument from explanatory irrelevance. Address the retreat to reasoning. Conclude with a premise sacrifice.
      *   *Refinement:* Ensure the distinction between the two forms of EDA is clear in the prompt so the student knows *which* distinction is required (Shaping/Tracking vs. Explanatory). Ensure the word count and formatting match exam standards.

  4.  **Drafting the Model Answer:**
