      *   *Drafting Paragraph 2:* Address the guilt and the boundary. Acknowledge that exemptions exist (illness), but they modify rather than always erase the attitude. Your guilt is actually a sign that you are still engaged in the participatory stance. Don't rush to the clinical view. It's okay to hold both the pain of the insult and the knowledge of the illness. The framework allows for this tension without demanding you abandon your emotional involvement.

      *   *Refining for Character:* Make it more assertive about the framework. "I maintain..." "We must recognize..." Ensure I don't sound too sympathetic in a therapeutic way, but rather philosophically firm about the nature of responsibility.

