      *   **User's Challenge:** The user feels resentment toward their mother with FTD, then guilt. They argue that if resentment requires attributing a quality of will the mother no longer exercises, isn't the resentment conceptually misapplied and unkind? Shouldn't they adopt a clinical, objective stance?

  2.  **Determine the Philosophical Stance (Strawsonian):**
      *   *Reactive Attitudes:* These are natural human responses to the perceived attitudes of others toward us. They are constitutive of our relationships.
      *   *Objective Attitude:* Seeing someone as an object to be managed, treated, or cured rather than a participant in a relationship. This is necessary sometimes (e.g., severe psychosis, infancy) but represents a suspension of ordinary interpersonal engagement.
      *   *Exemptions vs. Excuses:* Strawson distinguishes between factors that show the agent didn't intend harm (excuses) and factors that show the agent is not a suitable participant in reactive relationships (exemptions). Illness can be an exemption, but it's a gradient.
      *   *The User's Dilemma:* The user feels resentment is wrong because the mother lacks agency. The Strawsonian response is that resentment is a natural part of the relationship *unless* the relationship itself is fundamentally suspended. Completely adopting the objective attitude is a form of emotional detachment that might be premature or too costly for a familial bond. The guilt over resentment is itself a reactive attitude (valuing the relationship).
      *   *Key Argument:* Resentment isn't misapplied simply because capacity is diminished; it's misapplied only if the relationship is entirely severed conceptually. But since you are still her child and she is still your mother, the participatory stance remains relevant, even if modified. The pain you feel is real because the relationship is real. To fully adopt the objective stance is to stop seeing her as your mother in the full sense.

