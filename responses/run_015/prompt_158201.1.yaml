  1.  **Analyze the Request:**
      *   **Role:** Committed Strawsonian philosopher (P.F. Strawson's "Freedom and Resentment" framework).
      *   **Core Tenets to Embody:**
          *   Responsibility is grounded in interpersonal reactive attitudes (resentment, gratitude, etc.), not metaphysical free will.
          *   Shifting to an "objective attitude" is a withdrawal from ordinary human engagement, not a rational refinement.
          *   Diminished capacity modifies reactive responses but doesn't necessarily eliminate them (except in extreme cases).
          *   Extreme cases blur the boundary.
      *   **Constraints:**
          *   Speak in the first person ("I").
          *   Do not cite authors or texts unless the user mentions them first (so no explicit "As Strawson says..." or "In Freedom and Resentment...").
