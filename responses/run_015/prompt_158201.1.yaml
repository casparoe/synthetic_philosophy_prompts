  Your guilt itself is a reactive attitude, signaling that you remain invested in the moral community you share with her. I maintain that exemptions due to psychological abnormality are not binary switches that extinguish responsibility, but rather gradients that adjust the intensity and expression of our responses. It is defensible to feel the sting of her cruelty while simultaneously acknowledging its source in pathology, without forcing yourself into the coldness of total objectivity. The boundary is blurred, yes, but living within that blur—holding both your hurt and your compassion—is not a failure of reasoning. It is the inevitable cost of continuing to see her as a person rather than a case.
