answer: |-
  The 1940 American Negro Exposition in Chicago stands as a material test case for W. E. B. Du Bois's 1926 assertion in "Criteria of Negro Art" that "all Art is propaganda and ever must be." For Du Bois, this was not a pejorative classification but a moral imperative: in a world structured by white supremacy, Black art could not afford the luxury of aesthetic autonomy; it had to function as a vehicle for "racial truth" and "uplift." When applied to Charles C. Dawson's thirty-three dioramas and William Edouard Scott's twenty-four murals, Du Bois's framework illuminates the exposition's curatorial logic as a deliberate counter-narrative machine. However, a rigorous application of this theory also exposes fissures where aesthetic form resists total subordination to political utility, revealing an instability in Du Bois's distinction that he himself did not fully theorize.

  **The Propaganda of Form and Narrative**

  In Du Bois's specific sense, propaganda is the strategic deployment of truth to combat lying caricature. The exposition's primary propagandistic choice was the sequential historical narrative embedded in Dawson's Court of Dioramas. By arranging the thirty-three tableaux to move from ancient Egypt through the Middle Passage, Emancipation, and concluding with Black participation in the First World War, the curators and Dawson enacted a vindicationist history. This was not merely education; it was evidence. Du Bois argued that art must show the world "what we are." The dioramas functioned as visual testimony, transforming abstract historical claims into tangible, three-dimensional realities. The choice of the diorama format itself—immersive, lit, and spatial—served the propagandistic goal of *witnessing*. Unlike a document in a glass case, a diorama surrounds the viewer, demanding an emotional and sensory engagement that reinforces the "truth" of Black historical continuity.

  Similarly, William Edouard Scott's murals operationalized Du Bois's call for beauty to serve uplift through monumentalization. Scott's compositions utilized the visual language of the WPA mural tradition—solid forms, clear outlines, and classical staging—to depict Black subjects not as ethnographic types but as historical agents. When Scott painted Black soldiers or laborers with the volumetric weight traditionally reserved for European heroes, he was executing Du Bois's mandate: using beauty to dignify the race. The curators, working within the constraints of New Deal funding and the Diamond Jubilee mandate, directed Scott to emphasize contribution and patriotism. Here, the aesthetic choice (monumentalism) is indistinguishable from the political message (citizenship). The actors here are aligned: the curators set the vindicationist agenda, Scott provided the aesthetic labor, and the viewing public was positioned as the jury to be convinced of Black humanity and capability.

  **The Resistance of Aesthetic Form**

  However, the exposition reveals features that resist reduction to transparent message-bearing instruments. Du Bois assumes that if the beauty is sufficient, the propaganda will be received. Yet, in Scott's murals, the formal qualities of color harmony and brushwork possess an autonomy that can distract from the historical lesson. If a viewer becomes absorbed in the lushness of a pigment or the rhythm of a composition, the specific political injunction ("honor this soldier") may recede behind a purely aesthetic experience ("admire this painting"). This is the risk Du Bois acknowledges but underestimates: beauty can become an end in itself, even when intended as a means.

  In Dawson's dioramas, the resistance lies in the medium's inherent theatricality. The diorama is a technology of spectacle. While the curatorial intent was historical instruction, the *experience* for the public was often one of wonder at the illusion. The lighting, the perspective, and the craftsmanship of the models create a "magic" that can overshadow the "fact." Where Du Bois's theory remains silent is on the phenomenology of the museum space. He theorizes the relationship between the artist and the race, but he does not account for the spatial dynamics of the exposition hall, where the crowd's movement and the sensory overload of the fairground context could transform a lesson in racial truth into mere entertainment. The diorama's success as *spectacle* potentially undermines its efficacy as *propaganda*; the viewer remembers the show, not the history.

  **Reverse Analysis: Instability in the Du Boisian Synthesis**

  Reversing the analysis asks whether the exposition proves propaganda can fully absorb aesthetic form without losing efficacy, or if it reveals an instability in Du Bois's distinction. The 1940 Exposition suggests the latter. For the propaganda to work, the art *must* be aesthetically compelling (Du Bois's condition). But the moment it becomes compelling, it risks generating meanings outside the curatorial control.

  For example, the depiction of ancient Egypt in the dioramas was intended to establish racial pride (propaganda). However, for a 1940 audience, the visual exoticism of the reconstruction could inadvertently reinforce a sense of distance or "otherness," separating the modern Black visitor from the ancient subject rather than uniting them. The aesthetic form (the exoticized reconstruction) worked against the political message (continuity). This reveals an instability in Du Bois's framework: he treats "Beauty" and "Truth" as harmonious partners, assuming that a beautiful representation of racial truth will naturally lead to uplift. The exposition demonstrates that aesthetic form has its own logic, which can contradict the political intent.

  Furthermore, Du Bois's theory is silent on the *compromises* required by institutional funding. The exposition was a government-sanctioned event during a era of segregation. To exist, the art had to be palatable enough to not provoke white backlash while being radical enough to uplift Black viewers. This necessitated a specific kind of propaganda—one that emphasized military service and labor (safe, patriotic topics) over radical resistance or critiques of ongoing Jim Crow violence in the South. Scott's murals, therefore, propagate a specific *kind* of truth—one of assimilation and patriotism—which Du Bois's 1926 essay, written in a more pan-Africanist vein, might have found limiting. The theory demands "racial truth," but the material conditions of the exposition dictated a *curated* truth.

  **Conclusion**

  The 1940 American Negro Exposition validates Du Bois's premise that Black art in a racist society functions inevitably as propaganda; there was no "art for art's sake" in the Court of Dioramas. Dawson and Scott were engaged in a project of racial vindication. However, the exposition also exposes the limits of Du Bois's 1926 thesis. It demonstrates that aesthetic form is not a passive vessel for political content. The theatricality of the dioramas and the sensual autonomy of the murals introduce variables that the artist and curator cannot fully control. Du Bois's theory remains silent on the reception of spectacle and the institutional constraints that shape what counts as "uplift." Ultimately, the exposition shows that while propaganda can utilize beauty, it cannot fully absorb it; the aesthetic excess always retains the potential to overflow the political container, creating an instability where the message is as vulnerable to the medium as it is empowered by it.
