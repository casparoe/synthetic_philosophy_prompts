      *   **Applying Du Bois (The Propaganda of Form and Content):**
          *   *Narrative Arc:* Egypt to WWI. This is "racial truth" (countering the "slave only" narrative). It serves "uplift."
          *   *Dioramas (Dawson):* Immersive nature. Makes history *real*. Functions as evidence. The 3D aspect creates an "eyewitness" effect, strengthening the propaganda value.
          *   *Murals (Scott):* Monumentalization. Elevates Black subjects to the status of classical history painting.
          *   *Actors:* Curators (Alfonso Alonzo Herndon, etc.) set the agenda. Artists execute. Public receives "truth."
      *   **Resisting Reduction (Where Aesthetics Exceed Message):**
          *   Where does the art *escape* the didactic?
          *   *Scott's Color/Composition:* If the color harmony is lush or the brushwork expressive, does it distract from the historical lesson? Does it invite contemplation rather than instruction?
          *   *Dawson's Theatricality:* The dioramas are spectacle. The *awe* of the display might overshadow the specific historical fact. The "magic" of the diorama vs. the "fact" of the history.
          *   *Du Bois's Silence:* Du Bois talks about literature and painting mostly. He doesn't fully account for *museum pedagogy* or *spectacle*.
      *   **Reverse Analysis (Instability vs. Absorption):**
          *   Can propaganda fully absorb form?
          *   *Argument:* The Exposition reveals instability. To be effective propaganda, the art *must* be beautiful/engaging (Du Bois admits this). But if it is *too* engaging aesthetically, the political message becomes secondary to the aesthetic experience.
          *   *The "Gap":* The gap between the *intended* uplift (curatorial) and the *received* spectacle (public).
          *   *Du Bois's Limit:* He assumes a rational viewer who accepts the truth once presented beautifully. He doesn't account for the viewer who enjoys the beauty but rejects the politics, or enjoys the spectacle as entertainment only.
      *   **Conclusion:** Summarize the tension. The Exposition validates Du Bois's call for utility but exposes the risk of aesthetic autonomy within that utility.

