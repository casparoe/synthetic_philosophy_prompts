      *   **Constraint 4:** Reverse the analysis: Does the exposition show propaganda can fully absorb aesthetic form, or does it reveal instability in Du Bois's distinction?
      *   **Constraint 5:** Be disciplined about mapping actors (artists, curators, public) and state where Du Bois's theory remains silent.

  2.  **Analyze the Theoretical Framework (Du Bois, 1926):**

      *   *Core Tenet:* "All Art is propaganda and ever must be."
      *   *Nuance:* He distinguishes between *good* propaganda (truth, uplift, countering racist caricature) and *bad* propaganda (lying, degrading).
      *   *Role of Beauty:* Beauty is not an end in itself; it is the vehicle for the truth. "I do not care a damn for any art that is not used for propaganda." But he also acknowledges the necessity of beauty to make the propaganda effective.
      *   *Tension:* The tension between aesthetic autonomy and political utility.

  3.  **Analyze the Artifacts (Dawson's Dioramas & Scott's Murals):**

      *   *Dawson's Dioramas:* 3D, immersive, sequential narrative (Africa -> Egypt -> Slavery -> Emancipation -> WWI). Designed for mass consumption/education. Spectacle.
      *   *Scott's Murals:* 2D, monumental, allegorical and historical. "The Negro in Art," "The Negro in Music," etc. (Need to recall/verify specific themes: generally focused on contribution, struggle, and achievement).
      *   *Context:* 1940 (Diamond Jubilee of Emancipation). New Deal era (WPA influence?). Rise of fascism abroad makes domestic racial democracy urgent.

  4.  **Drafting - Section by Section:**

