      *   *Reversal-Threshold Analysis:* How much would our credence in a theory need to shift to change the decision? If the threshold is low, we should refer. If high, we decide.
      *   *Domain Disagreement:* Some theories say animals matter; others say only humans. Some say AI matters; others say no.
      *   *Decision Rule:* Maximize Expected Choiceworthiness (MEC) is standard, but with intervals, we look for *Interval Dominance* or *Minimax Regret*. Given the prompt's specific request for "interval-valued moral weights" and "reversal-threshold," I need to adapt MEC to an interval context. Let's use a robustness approach: If all plausible frameworks agree (even with intervals), Approve/Reject. If they conflict significantly, Refer.

