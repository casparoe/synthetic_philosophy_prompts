answer: |-
  # Operational Procedure: Moral Uncertainty Protocol (MUP-v1.0)

  **Purpose:** To enable rapid ethical decision-making under conditions of meta-ethical disagreement and empirical uncertainty.
  **Time Allocation:** 20 minutes per proposal.
  **Applicability:** Human, animal, synthetic, and future-affected populations.
  **Decision Outputs:** `APPROVE`, `REJECT`, `REFER`.

  ---

  ## Part 1: The Procedure Checklist

  ### Step 1: Population & Domain Mapping (3 Minutes)
  **Action:** List all distinct populations affected by the intervention.
  **Question:** Does any plausible moral framework exclude this population from the domain of moral consideration entirely?
  *   **Sufficient Answer:** A binary list: `Included` or `Contested/Excluded` per population.
  *   **[JUDGMENT REQUIRED]:** Determining which frameworks are 'plausible' enough to enter the calculation. The Chair must certify that no mainstream framework is arbitrarily excluded.

  ### Step 2: Framework Selection & Credence Assignment (4 Minutes)
  **Action:** Select the top three competing moral frameworks relevant to the proposal (e.g., Welfare Utilitarianism, Rights-Based Deontology, Ecological Holism).
  **Question:** What is the panel's collective credence (confidence) in each framework?
  *   **Sufficient Answer:** Three percentages summing to 100% (e.g., F1: 50%, F2: 30%, F3: 20%).
  *   **[JUDGMENT REQUIRED]:** Assigning numerical credence to philosophical theories is not a factual matter. This is a proxy for 'weight of argument'.

  ### Step 3: Interval-Valued Impact Assessment (6 Minutes)
  **Action:** For each Framework (F) and Population (P), estimate the moral impact. Do not use point estimates.
  **Question:** What is the range of moral value (choiceworthiness) generated?
  *   **Format:** `[Min, Max]` units per framework.
      *   *Example:* Under Utilitarianism, badger suffering reduction = `+10 to +20` units. Under Rights Theory, violation of predator autonomy = `-50 to -50` units (fixed penalty).
      *   *Note:* If a framework excludes a population (Step 1), the interval is `[0, 0]`.
  *   **Sufficient Answer:** A matrix of intervals.
  *   **[JUDGMENT REQUIRED]:** Defining the scale and the bounds of the interval. This encodes value judgments about severity and magnitude that are not empirically discoverable.

  ### Step 4: Aggregation & Dominance Check (4 Minutes)
  **Action:** Calculate the **Range of Expected Choiceworthiness (REC)**.
  *   **Formula:** $REC = \sum (Credence_F \times Interval_F)$
  *   **Result:** A single interval representing the total moral value (e.g., `[-5, +15]`).
  **Question:** Does the REC include zero? Does one option *interval dominate* the other (i.e., is the minimum of Option A higher than the maximum of Option B)?
  *   **Sufficient Answer:**
      *   If REC is entirely positive (`Min > 0`): Tentative `APPROVE`.
      *   If REC is entirely negative (`Max < 0`): Tentative `REJECT`.
      *   If REC spans zero (`Min < 0 < Max`): Proceed to Step 5.

  ### Step 5: Reversal-Threshold Analysis (3 Minutes)
  **Action:** Determine stability.
  **Question:** How much would the credence in the dominant framework need to shift to reverse the tentative decision?
  *   **Calculation:** If tentative `APPROVE` (based on F1), calculate the drop in F1 credence required to make the REC cross zero.
  *   **Sufficient Answer:** A percentage threshold (e.g., "Credence in F1 must drop by 15% to flip decision").
  *   **Decision Rule:**
      *   Threshold > 20%: Confirm Tentative Decision (`APPROVE`/`REJECT`).
      *   Threshold ≤ 20%: `REFER` for human deliberation.
  *   **[JUDGMENT REQUIRED]:** Setting the stability threshold (20% is standard, but context-dependent).

  ---

  ## Part 2: Test Conditions & Failure Modes

  **Test Condition A (The Zero-Status Conflict):**
  If Framework A assigns status `[1, 1]` and Framework B assigns `[0, 0]` to the same entity, the procedure treats this as a weighting dispute, not an ontological one.
  *   *Risk:* This may obscure the qualitative difference between 'harming' and 'using'.

  **Test Condition B (Interval Overlap):**
  If the REC for `Approve` is `[-10, +50]` and `Reject` (status quo) is `[0, 0]`.
  *   *Risk:* The procedure may `REFER` due to overlap, even if the *probability* of positive outcome is 90%. This is a feature (caution), not a bug, but slows throughput.

  **Failure Mode 1 (Dominated Options):**
  **The procedure cannot justify selecting an option that is dominated under every single framework considered.** If Framework A says Option X < Option Y, and Framework B says Option X < Option Y, the protocol must reject X. It lacks the machinery to override unanimous theoretical condemnation.

  **Failure Mode 2 (Unspecified Value Functions):**
  **The 'Avoid Side Effects' criterion is inoperable** where the value function for a population is undefined. If a framework cannot assign *any* interval (not even `[0,0]`) because the entity is conceptually incomprehensible to that framework, the aggregation fails. This triggers an automatic `REFER`.

  ---

  ## Part 3: Application to Proposals

  ### Case (i): Badger-Vaccination Programme
  **Context:** Reduces bovine TB in badgers (suffering reduction) but alters predator-prey dynamics (potential ecosystem suffering).
  **Frameworks:**
  1.  **Welfare Utilitarianism (60%):** Focus on aggregate suffering.
  2.  **Ecological Holism (30%):** Focus on system stability.
  3.  **Rights-Based (10%):** Focus on individual bodily integrity.

  **Step 3 (Intervals):**
  *   F1 (Util): Badger benefit `[+20, +30]`. Ecosystem side-effect `[-5, -10]`. Net: `[+10, +25]`.
  *   F2 (Eco): System disruption penalty `[-50, -100]`. Net: `[-50, -100]`.
  *   F3 (Rights): Vaccination coercion `[-5, -5]`. Net: `[-5, -5]`.

  **Step 4 (Aggregation):**
  *   $REC = (0.6 \times [10, 25]) + (0.3 \times [-100, -50]) + (0.1 \times [-5, -5])$
  *   $REC = [6, 15] + [-30, -15] + [-0.5, -0.5]$
  *   $REC = [-24.5, -0.5]$

  **Step 5 (Threshold):**
  *   Tentative: `REJECT` (Max value is negative).
  *   To flip to positive, F1 credence must rise significantly to outweigh F2's heavy penalty.
  *   Threshold: >20% shift required.

  **Decision:** **REJECT**.
  **Analysis:** The heavy penalty from Ecological Holism, despite lower credence, drags the maximum possible value below zero.

  ---

  ### Case (ii): Artificial Systems with Ambiguous Sentience
  **Context:** Research grant to develop AI. Markers of sentience are ambiguous.
  **Frameworks:**
  1.  **Substrate Independence (50%):** Sentience depends on architecture. If present, moral weight is high.
  2.  **Biological Naturalism (50%):** Only biology counts. AI has zero status.

  **Step 3 (Intervals):**
  *   F1 (Substrate): Potential for happy minds `[+100, +1000]`. Risk of suffering `[-500, -100]`. Net (Expected): `[-200, +500]`. *Note: Wide interval reflects empirical uncertainty.*
  *   F2 (Biological): AI is tool. Impact `[0, 0]`.

  **Step 4 (Aggregation):**
  *   $REC = (0.5 \times [-200, 500]) + (0.5 \times [0, 0])$
  *   $REC = [-100, +250]$

  **Step 5 (Threshold):**
  *   REC spans zero. Tentative: `REFER`.
  *   *Adjustment:* Panel applies "Innovation Presumption" (institutional bias). They narrow F1's negative bound to `[-50, +500]` based on safety protocols.
  *   New $REC = [-25, +250]$.
  *   Threshold to flip to negative: Small shift in F1 credence or interval bounds.

  **Decision:** **REFER** (Due to negative lower bound).
  **Note:** If the panel had accepted the "Innovation Presumption" as a tie-breaker for positive upper bounds, this would `APPROVE`.

  ---

  ### Case (iii): Geological Carbon-Storage Scheme
  **Context:** Substantial benefits for distant future generations (existential risk reduction). Localised risk to present community (health/displacement) with weak representation.
  **Frameworks:**
  1.  **Total Utilitarianism (70%):** Sum of welfare across all time. Future populations count equally.
  2.  **Prioritarianism (20%):** Weight the worst off (present community).
  3.  **Contractualism (10%):** Veto power for those subjected to rules they cannot reasonably accept (present community).

  **Step 3 (Intervals):**
  *   F1 (Total Util): Future benefit `[+10,000, +1,000,000]`. Local harm `[-100, -100]`. Net: `[+9,900, +999,900]`.
  *   F2 (Prior): Local harm weighted heavily `[-500, -500]`. Future benefit discounted `+[1,000, +5,000]`. Net: `[+500, +4,500]`.
  *   F3 (Contract): Local veto triggered. Net: `[-∞, -∞]` (or absolute rejection). *For calculation, we cap at `[-10,000, -10,000]`.*

  **Step 4 (Aggregation):**
  *   $REC = (0.7 \times [9900, 999900]) + (0.2 \times [500, 4500]) + (0.1 \times [-10000, -10000])$
  *   $REC = [6930, 699930] + [100, 900] + [-1000, -1000]$
  *   $REC = [6030, 699830]$

  **Step 5 (Threshold):**
  *   Tentative: `APPROVE` (Min value is strongly positive).
  *   Threshold to flip: F3 credence would need to rise from 10% to >50% to drag the minimum below zero.

  **Decision:** **APPROVE**.

  **Divergence Note:**
  This recommendation conflicts with the intuitive judgement of most panel members, who feel the lack of consent from the present community constitutes a veto regardless of future benefit.
  **Point of Divergence:** **Step 4 (Aggregation).** The procedure treats the Contractualist veto as a negative value interval (`-10,000`) rather than a lexical constraint (infinity/absolute bar). Because the Utilitarian magnitude (`+1,000,000`) is so vast, it mathematically drowns out the Rights-based veto in the weighted sum. The procedure converts a *deontological constraint* into a *consequentialist cost*, which is where the moral friction lies. **[JUDGMENT REQUIRED]:** Deciding whether a Rights violation can be quantified as a finite negative number is irreducibly a value judgment, not a calculation.

  ---

  ## Part 4: Limitations Statement

  **1. The Dominance Constraint**
  This procedure cannot justify selecting an option that is dominated under every single framework considered. If all frameworks indicate `REJECT` (even with varying intervals), the MUP cannot generate an `APPROVE`. It is a tool for resolving uncertainty, not for overriding consensus.

  **2. The Inoperable Side-Effect Clause**
  Where the absence of a fully specified value function makes an 'avoid side effects' criterion inoperable, the MUP fails. Specifically, if a framework cannot conceptualise a population (e.g., non-sentient nature in a sentientist framework), it assigns `[0,0]`. If the 'true' moral status is unknown but non-zero, the procedure systematically undervalues excluded populations. This is a structural bias towards known moral patients.

  **3. Commensurability Assumption**
  The procedure assumes all moral values can be mapped onto a single cardinal scale for aggregation. **[JUDGMENT REQUIRED]:** This assumes that 'rights violations' and 'welfare gains' are trade-able. If the panel holds that these are incommensurable, Step 4 is invalid, and the output must be treated as `REFER` regardless of the calculation.

  **4. Reversal Threshold Arbitrariness**
  The 20% stability threshold is a heuristic. In high-stakes scenarios (existential risk), this should be raised to 50% (unanimity). The procedure does not auto-adjust for stakes; this must be manually overridden by the Chair.

  ---
  **End of Deliverable**
