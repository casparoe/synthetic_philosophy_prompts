      *   *Step 5 (Threshold):* Check stability.
      *   *Step 6 (Decision):* Rules for Approve/Reject/Refer.
      *   *Application:* Walk through the three cases.
      *   *Limitations:* Be honest about the math vs. ethics gap.

  9.  **Refining the "Counter-Intuitive" Moment:**

