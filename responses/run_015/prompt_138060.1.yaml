answer: |-
  ### What the criterion is for

  This criterion is a tool for methodological classification, not ontological arbitration. Its purpose is to determine whether treating a resource as cognitive yields better predictive models or intervention strategies than treating it as environmental. You are entitled to demand operational clarity: how does labeling this "extended" change the analysis? You are not entitled to demand metaphysical finality. If the distinction doesn't alter how we describe, model, or intervene on the performance, the criterion has failed its job. Heavy constitution talk only earns its keep if it cashes out in difference.

  ### The desiderata

  **1. Functional Parity.** If an external process performs a function identical to an accepted internal cognitive process, it must be eligible for the same status. *Case:* Otto's notebook vs. Inga's biological memory. *Rationale:* Without this, the field collapses into bio-chauvinism, arbitrarily privileging skull-boundary processes despite identical causal roles. *Status:* **Non-negotiable.**

  **2. Transparency/Access.** The resource must be readily available without complex decoding or intermediate steps. *Case:* The blind person's cane (felt as the tip) vs. the whiteboard across the room (requires locomotion). *Rationale:* Distinguishes tool from context. If accessing the resource requires a distinct cognitive task itself, it remains environment. *Status:* **Non-negotiable.**

  **3. Temporal Stability.** The coupling must persist over time, surviving interruptions. *Case:* The abacus user's skill (years) vs. a one-off guidebook lookup. *Rationale:* Essential for distinguishing learning from transient coupling. A criterion that only scores snapshots fails psych review on skill decay. *Status:* **Non-negotiable.**

  **4. Subject Authority.** Does the subject's endorsement ("this is me" vs. "this is the app") decide? *Case:* Phone contacts (I don't know the numbers). *Rationale:* First-person authority should weigh as data, not verdict. Overruling it risks ignoring alienation; accepting it risks ignoring unconscious integration. *Status:* **Preference (Integrationist).**

  **5. Conflict Resolution.** When subject and resource disagree, is there a systematic error-correction protocol? *Case:* The distrusted notebook vs. the generative AI assistant. *Rationale:* Evidence of system unity. If the subject blindly obeys, they may be offloading agency; if they arbitrate, they remain the system's center. *Status:* **Non-negotiable.**

  **6. Boundary Control.** The criterion must prevent inflation. Not every causal dependency counts. *Case:* Oxygen, language, culture. *Rationale:* Prevents triviality. There must be a specific kind of informational or functional loop, not just causal necessity. *Status:* **Non-negotiable.**

  **7. Gradability.** Is extension binary or continuous? *Case:* The notebook user who checks memory sometimes vs. never. *Rationale:* Most fights are here. A criterion must specify if "partially extended" is valid or if a threshold exists for review decisions. *Status:* **Preference (Camp dependent).**

  | Requirement | Motivating Case | Status |
  | :--- | :--- | :--- |
  | Functional Parity | Otto vs. Inga | Non-negotiable |
  | Transparency | Cane vs. Whiteboard | Non-negotiable |
  | Temporal Stability | Abacus learning | Non-negotiable |
  | Subject Authority | Phone contacts | Preference |
  | Conflict Resolution | Distrusted notebook | Non-negotiable |
  | Boundary Control | Oxygen/Culture | Non-negotiable |
  | Gradability | Partial checking | Preference |

  ### Where the list fights itself

  The list contains structural tensions you cannot resolve without choosing a camp. **Authority vs. Parity:** If a subject denies a resource is "them" (Phone contacts) but relies on it functionally like memory (Otto), Parity demands inclusion while Authority suggests exclusion. Prioritizing Parity risks alienating the subject; prioritizing Authority risks ignoring functional reality. You must decide whether cognition is defined by how it works or how it feels.

  **Gradability vs. Boundary:** If extension admits degrees (Gradability), the hard line required to stop inflation (Boundary Control) blurs. A resource can be "mostly" cognitive, which undermines the binary distinction needed for clear modeling. You cannot have a sharp boundary and a continuous scale without specifying where the scale triggers the boundary. This tension is inherent to the list, not a flaw in specific theories. Any theory satisfying one will strain the other.

  ### What to give up on

  Stop expecting **Subject Authority** to be decisive. Introspection is notoriously unreliable in skill acquisition (see: abacus users who can't explain their hands). Treating first-person reports as verdicts rather than data will invalidate cases of implicit integration. Also, relax **Binary Gradability**. Demand thresholds for review, but acknowledge integration is a process. A theory that forces a yes/no on a learning curve will always fail the Temporal requirement. Accept that some papers will report "integration in progress" rather than a settled state.

  ### Scorecard

  | View | Parity | Trans | Temp | Auth | Err | Bound | Grad |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **(a) Parity** | Y | Y | Y | N | Y | N | N |
  | **(b) Content** | N | Y | N | Y | Y | Y | N |
  | **(c) Integration** | Y | Y | Y | Y | Y | Y | N |
  | **(d) Coupling** | Y | N | Y | N | N | N | Y |

  (a) Fails Boundary (inflates). (b) Fails Parity (bio-chauvinism). (c) Fails Gradability (often binary). (d) Fails Boundary (everything couples).
