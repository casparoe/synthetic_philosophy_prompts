answer: |-
  Your seven verdicts do not add up to a single, smooth algorithm. They add up to a **responsibility-sensitive prioritarianism with an expressive egalitarian constraint.**

  You are a prioritarian (you weight benefits to the worse off more heavily), but not a lexical prioritarian (the worse off do not *always* win; numbers count, as in Case 4 and 5). You are responsibility-sensitive (Case 6: bad luck trumps voluntary risk). And you are an expressive egalitarian (Case 3: social status matters independently of material welfare).

  ### Testing Your Working Sentence
  *“Weight a benefit more heavily the worse off its recipient is, otherwise just add the benefits up, and never make anyone worse off merely to make things more equal.”*

  This sentence breaks in two places:
  1.  **Case 3 (The VIP Queue):** Your sentence forbids making the VIP worse off "merely to make things more equal." Yet you endorse abolishing the queue. For you, the *expression* of equality is a good in itself, worth the cost of the VIP's convenience. Your sentence rules out your own verdict.
  2.  **Case 6 (Responsibility):** Your sentence weights by "worse off." It does not distinguish *why* they are worse off. Your verdict does.

  ### Repairing the Principle
  To hold your seven verdicts, you must distinguish between **resources** and **recognition**.
  *   **Case 2 vs. Case 3:** In Case 2, blocking the device reduces material welfare (resources) without helping the poor. In Case 3, abolishing the queue reduces social privilege (recognition) to affirm equal moral standing. You allow "leveling down" of status, but not of vital goods.
  *   **Cases 1, 4, and 5:** These do not require a "switch" (as you feared in Case 1). They are consistent with a **concave weighting function**. You sum benefits, but a unit of benefit to a destitute person counts for more than a unit to a comfortable one. As the number of comfortable people grows (Case 4: 1 vs 5; Case 5: 100 vs 10 million), the aggregate weight of their smaller benefits eventually outweighs the weighted benefit of the few. This is not a jagged switch; it is a scale.
  *   **Case 7 (Prevention vs. Cure):** Your vacillation here is a feature, not a bug. Your principle contains two competing metrics: *current urgency* (relief of suffering now) and *lifetime priority* (maximizing the trajectory). A repaired principle admits this tension rather than hiding it.

  ### The Cost
  Holding this repaired principle will cost you **the comfort of a formula.** You cannot write a spreadsheet that solves Case 1 or Case 4. You are committing to a practice of judgment where numbers matter but do not rule, where status matters but does not trump survival, and where responsibility matters but does not condemn. You will have to defend the *weighting* rather than the *rule*. A hostile reader will ask, "Why forty months? Why five patients?" Your answer can no longer be "The formula says so." It must be, "Because beyond that point, the claim of the many outweighs the priority of the few." That is a political argument, not a mathematical one.

  ### The Unsettled Cases
  *   **Future Generations:** Your principle prioritizes the "worse off." If people in two centuries will be far better off than the destitute alive today, your principle dictates **priority to the current destitute.** You owe more to the suffering present than the abundant future. However, if your actions today would make those future people *worse off than they otherwise would be* (e.g., climate collapse), you must weigh the *loss* relative to their baseline. But strictly speaking, current desperation trumps future abundance.
  *   **Animals:** If "worse off" refers to absolute welfare capacity, an animal in pain may be "worse off" than a comfortable human. A consistent prioritarianism extends the weight to sentient beings. However, if "worse off" is relative to species potential, the calculation shifts. To hold your seven cases consistently, you should admit that **suffering is the metric, not species.** If an animal's suffering is comparable to human destitution, it commands priority over trivial human gains.

  ### The One Sentence
  You asked for a sentence a hostile reader cannot break with an obvious counterexample. To survive, it must acknowledge the trade-offs you have identified without promising a precision you cannot deliver. It must distinguish material leveling from status equality, and acknowledge the limit of priority.

  **"We ought to prioritize the worst-off and the unlucky, and reject status privileges, unless the cost to the many becomes overwhelming or the equality sought is merely material leveling."**
