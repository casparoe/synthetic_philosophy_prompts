answer: |-
  Dear colleague, the objection that will do you the most damage is the hard incompatibilist's charge that you are changing the subject rather than solving the problem of free will, because if the room decides you are merely offering a pragmatic substitute for the real metaphysical article, your conceptual ethics project collapses into mere policy recommendation. Before you take a single question, you should concede in your opening remarks that your view does not solve the causal determination problem and that it requires abandoning the retributive emotion of resentment as a justified reactive attitude, because signaling honesty about the costs of your view will disarm the critics who think you are smuggling desert in through the back door. The single reply that has to land if the view is going to survive the session is your functional claim that blame and punishment can coordinate norms without desert, because if the room believes those practices inherently require desert to function, your reform project looks impossible.

  You should expect the hard incompatibilist to speak first, likely saying something like, you have given us a nice story about social practices, but you have not told us whether agents are truly responsible, so you are just changing the subject to avoid the hard metaphysical bullet. Your reply should be that conceptual ethics is not about describing the metaphysical furniture of the universe but about deciding which concepts serve our normative needs, and since the desert concept fails the justification test while the relational concept succeeds, we are not changing the subject but refining the tool. The soft spot here is that this will not satisfy their metaphysical itch, and you must judge this objection as having real force because it undermines the philosophical stakes, though you can move past it if you firmly frame the project as normative from the outset.

  Once you get past the metaphysician, the reasons-responsiveness compatibilist will likely ask, if responsibility is just a status in a practice, what capacities must an agent have to enter that practice, because you cannot demand answers from someone who cannot understand the demand. You should reply that the capacity required is precisely the ability to participate in the exchange of reasons and accounts, which is a functional threshold rather than a metaphysical one, but note that this reply is softly circular because it defines the capacity by the practice it is supposed to ground. This objection has moderate force because it touches on the exclusion of marginalized agents, but you can answer it by emphasizing the gradient nature of participation.

  Then the retributivists will engage, and the first one will say, if you take desert out of punishment, you are just treating criminals like dangerous dogs to be managed rather than moral agents to be judged. Your reply must be that holding someone answerable is precisely what respects their agency, whereas desert treats them as containers of a metaphysical property, and that normative communication is distinct from behavioral conditioning. This reply is soft because in practice the line between management and communication can blur, and you should judge this as a high-force objection because it strikes at the moral heart of the criminal law. The second retributivist will follow up by asking about proportionality, saying, without desert how do you limit punishment, because on a forward-looking view you could punish a minor crime severely if it deterred enough. You should reply that proportionality is anchored in the gravity of the norm violation within the practice, not in cosmic justice, but admit quietly that this risks sliding into utilitarianism. This objection has real force and requires you to hold the line on internal constraints of the practice.

  Moving to the legal scholars who work on excuse, the first one will ask about duress, saying, on your view is duress just another relational pressure, because if responsibility is about relationships, then coercion looks like just a very strong demand. Your reply should be that duress breaks the reciprocity required for the practice, making the demand illegitimate rather than just difficult, but note that this is evasive on where the line is drawn between hard choices and excusing conditions. This objection has moderate force because it tests the limits of your relational model. The second excuse scholar will ask about psychopathy or diminished capacity, saying, if someone cannot understand the demand, are they just outside the practice, and does that not look like a convenient way to exclude them. You should reply that they are indeed outside the practice of mutual accountability, which is why we treat them differently, but acknowledge that this sounds harsh. This objection has moderate force but can be moved past if you frame it as a tragic necessity of the practice.

  The experimental philosophers will likely come later in the session, and the first one will say, our studies show the folk want alternative possibilities, so why should we adopt a concept that contradicts our intuitive judgments. Your reply should be that folk intuitions are descriptive data points for conceptual ethics, not normative verdicts, and that we often reform concepts away from folk usage, but admit this sounds elitist. This objection has low force because you can own the reformist nature of your project. The second experimental philosopher will press on manipulation cases, saying, in our bypassing cases the folk see no responsibility even if the relationship looks intact, so your relational view misses something. Your reply should be that secret manipulation damages the relationship even if unknown, because the trust is objectively undermined, but this is where your view is softest. This objection has moderate force because it targets your third step directly.

  Regarding that third step, which you feel best about, you need to know that it cannot handle cases of undetectable internal manipulation, such as a brain tumor or secret programming that no one knows about, because on your view the relationship appears intact even if the agent is compromised. If the community treats the agent as answerable and the agent feels answerable, your view says they are responsible, but intuition says they are not, so you must concede that your view is externalist about the relationship but might need an internalist caveat about agent integrity.

  Finally, the question you are hoping nobody asks is the one about the distinction between your view and Darwall's second-personal account or the tripartite account of responsibility, because you admitted you are not settling that taxonomy. If someone asks, you should say you are drawing on those insights but focusing on the institutional implementation rather than the moral psychology, and then move on. Good luck with the workshop.
