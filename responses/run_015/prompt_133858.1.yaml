  ### Note on Where You Might Be Wrong

  You're assuming Dana's "selection history" claim is meant to be a *mechanistic* account of how RLHF works, but she might be proposing a *normative* account of responsibility. If she pushes back hard, she might argue that "selection history" is a placeholder for "developer responsibility," not a literal traceable log. If she makes that move, questions about RLHF mechanics (Q7) or auditability (Q10) might miss the mark because she's talking about *liability*, not *engineering*.

  Also, you might be underestimating the strength of deflection (a). If she successfully argues that "belief" and "intent" are purely folk-psychological constructs that don't map to weights *at all*, your questions about "model dispositions" (Q1, Q3) could look like you're the one confused about category errors. Be ready to pivot: if she denies models have dispositions, ask her what *does* have dispositions on her view—the training script? The company? That might be the sharper angle.
