prompt: |-
  I'm a doctoral student in philosophy of social cognition, and I'm trying to fix a research agenda on collective intentionality for the next three years. I want to avoid both broad surveys and empirically intractable questions. To narrow the field, I'm working with a distinction that cuts across the usual Searle-Bratman-Gilbert taxonomy: between coordination sustained purely by interlocking individual intentions and mutual belief ("structural joint action"), and coordination that requires each party to recognize the other as a co-subject with standing in the shared activity ("recognitional joint action"). The latter borrows from recognition-theoretic accounts of agency but applies them to ordinary joint action rather than to institutional or political contexts.

  Given this framing, which unresolved questions in collective intentionality and joint action matter most, and in what order should they be pursued?

  In particular, I want a defended prioritization—not a list—addressing at least these three nodes:

  First, whether the structural/recognitional distinction marks a real ontological difference, or whether every apparently structural case already presupposes minimal recognitional conditions.

  Second, what the status of asymmetric joint action is: cases where one agent operates under a "we"-frame ("we are painting the house") while the other operates under an individual "I"-frame ("I am painting my assigned section"), with no shared collective commitment. Does this constitute a deficient joint action, a non-joint action, or something that requires external arbitration to determine its status?

  Third, which of these debates is most upstream for theories of distributed moral responsibility—specifically, whether settling the necessity of recognitional commitment for joint action would substantially alter our assessments of collective blame in collaborative harm.

  For each, I want the reasoning behind its rank: why it is tractable for conceptual philosophy rather than empirical science, which other questions depend on its resolution, and what kind of conceptual or argumentative progress over the next two to three years would cause you to reorder the priorities. I also want to know which widely discussed questions—for instance, the aggregation problem for group-level attitudes, or the reduction of we-intentions to I-intentions—you would actively deprioritize given this framing, and why their resolution would not change much downstream.

  Please avoid bibliographies, reading lists, or citations. I need an agenda with dependency relations and tractability assessments, not references.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral student in philosophy of social cognition.
      *   **Goal:** Fix a research agenda on collective intentionality for the next three years.
      *   **Constraints:** Avoid broad surveys and empirically intractable questions. Use a specific framing: "Structural Joint Action" (interlocking intentions/mutual belief) vs. "Recognitional Joint Action" (recognizing the other as a co-subject with standing).
      *   **Specific Tasks:**
          *   Prioritize three specific nodes (Ontological status of the distinction, Asymmetric joint action, Distributed moral responsibility).
          *   Provide reasoning for the rank (tractability, dependency, conditions for reordering).
          *   Identify questions to *deprioritize* (e.g., aggregation, reductionism) and explain why.
          *   **Constraint:** No bibliographies, reading lists, or citations.
          *   **Tone:** Professional, analytical, strategic (agenda-setting).

  2.  **Deconstruct the Framing:**
      *   *Structural Joint Action (SJA):* Searle/Bratman style. Interlocking intentions, mutual knowledge, meshing subplans. Functional/psychological focus.
      *   *Recognitional Joint Action (RJA):* Honneth/Recognition theory style applied to micro-interactions. Normative status, standing, co-subjectivity.
      *   *The Tension:* Is RJA a distinct *kind* of action, or is it a normative layer on top of SJA? Or is SJA actually impossible without RJA?

  3.  **Evaluate the Three Nodes:**

      *   **Node 1: Ontological Status (SJA vs. RJA).**
          *   *Question:* Is the distinction real, or does SJA presuppose RJA?
          *   *Tractability:* High. This is pure conceptual analysis. It involves testing thought experiments (e.g., manipulation, coercion, unacknowledged cooperation).
          *   *Dependency:* This is foundational. If SJA *requires* RJA, then the taxonomy collapses into one. If they are distinct, we need to know when which applies.
          *   *Rank:* **Priority 1.** You can't build a house without knowing if the foundation is one slab or two.

      *   **Node 2: Asymmetric Joint Action.**
          *   *Question:* "We"-frame vs. "I"-frame. Is it joint? Deficient?
          *   *Tractability:* Medium-High. Requires analyzing the boundaries of "jointness."
          *   *Dependency:* Depends on Node 1. If RJA is required for *true* joint action, then asymmetric cases might fail the RJA test (lack of mutual recognition of standing). If SJA is sufficient, asymmetric cases might count as joint.
          *   *Rank:* **Priority 2.** It's a boundary case test for the ontology established in Node 1.

      *   **Node 3: Distributed Moral Responsibility.**
          *   *Question:* Does RJA necessity alter collective blame?
          *   *Tractability:* Medium. Ethics depends on metaphysics/philosophy of action.
          *   *Dependency:* Heavily dependent on Nodes 1 and 2. You can't assign blame for "joint action" if you haven't defined what counts as joint action.
          *   *Rank:* **Priority 3.** This is the downstream application.

  4.  **Develop the Argument for Prioritization:**

      *   *Why Node 1 first?* It determines the conceptual landscape. If SJA presupposes RJA (the "Hidden Normativity" hypothesis), then Bratman-style accounts are incomplete descriptions, not competing ontologies. If they are distinct, we need a criterion for switching. This is purely conceptual (tractable) and blocks progress on the others if left unresolved.
      *   *Why Node 2 second?* Asymmetry is the stress test. If Node 1 says RJA is necessary, asymmetric cases (where one lacks the "we") are likely non-joint or exploitative. If Node 1 says SJA is sufficient, asymmetric cases are genuine joint actions. This clarifies the *scope* of the theory before moving to *norms* (Node 3).
      *   *Why Node 3 third?* Moral responsibility is the payoff. But getting it wrong because the metaphysics (Node 1) or scope (Node 2) is wrong leads to category errors in ethics.

  5.  **Identify Deprioritized Questions:**
      *   *Aggregation Problem:* How do individual attitudes sum to group attitudes?
          *   *Reason to drop:* Given the SJA/RJA framing, the "group mind" issue is less relevant than the *relational structure* between individuals. Aggregation assumes the units are already defined; the user's framing questions the nature of the relation.
      *   *Reduction of We-Intentions to I-Intentions:*
          *   *Reason to drop:* This is the classic Searle vs. Bratman debate. The user's framing *transcends* this by introducing a normative/recognitional layer. Solving reductionism doesn't tell us about *recognition*. It's a legacy debate that doesn't serve the specific RJA innovation.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Check:* Did I cite anyone? No.
      *   *Check:* Is it a defended prioritization? Yes.
      *   *Check:* Did I address tractability and dependency? Yes.
      *   *Check:* Did I address conditions for reordering? Yes.
      *   *Check:* Is the tone appropriate for a PhD student? Yes, rigorous and strategic.

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply empirical work. Keep it focused on conceptual philosophy. Ensure the distinction between "structural" and "recognitional" remains the core lens. When discussing Node 1, emphasize the "minimal recognitional conditions" aspect. For Node 2, focus on the "standing" aspect. For Node 3, focus on "blame attribution."

      *(Refining the "Reordering" conditions)*: Be specific. What finding would make Node 3 move up? Perhaps if a specific case of harm arises where the legal/social stakes demand an immediate ethical framework regardless of metaphysical precision. But for a PhD, metaphysics usually comes first. I will argue that Node 1 is the bottleneck.

      *(Refining Deprioritization)*: Make sure to explain *why* they don't matter *given this framing*. The framing shifts focus from "mental states" to "relational status." Aggregation is about mental states. Therefore, it's less relevant.

  7.  **Final Polish:** Check against the prompt's specific requirements one last time.
      *   Three nodes addressed? Yes.
      *   Reasoning for rank? Yes.
      *   Tractability assessment? Yes.
      *   Dependency relations? Yes.
      *   Conditions for reordering? Yes.
      *   Deprioritized questions? Yes.
      *   No citations? Yes.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a prioritized research agenda based on your structural/recognitional framing. This ordering is determined by conceptual dependency and tractability within analytic philosophy, ensuring that downstream normative claims rest on settled metaphysical and action-theoretic foundations.

  ### Priority 1: The Ontological Status of the Distinction
  **Question:** Does the structural/recognitional distinction mark a real ontological difference, or does every apparently structural case presuppose minimal recognitional conditions?

  **Reasoning for Rank:**
  This is the foundational bottleneck. Your entire framework hinges on whether "Structural Joint Action" (SJA) is a freestanding category or merely a degraded/abstracted version of "Recognitional Joint Action" (RJA).
  *   **Dependency:** Both the analysis of asymmetric action (Priority 2) and the assignment of moral responsibility (Priority 3) depend on knowing what constitutes the *base* of joint action. If SJA presupposes RJA (the "Hidden Normativity" hypothesis), then cases lacking recognition are not merely a different *type* of joint action; they are failed joint actions or mere parallel play. If they are ontologically distinct, then you need a robust criterion for when recognition is required versus when interlocking intentions suffice.
  *   **Tractability:** This is highly tractable for conceptual philosophy. It relies on modal intuition pumps and boundary testing rather than empirical data. You can test this by constructing cases of "successful" structural coordination where recognition is explicitly absent (e.g., manipulated cooperation, coerced meshing of subplans, or algorithmic coordination). If these cases feel conceptually unstable or parasitic on normal recognitional contexts, you have an argument for the presupposition view.
  *   **Conditions for Reordering:** You should only move this down if you find that the distinction is pragmatically useful *regardless* of its ontological status. For example, if you determine that even if SJA presupposes RJA metaphysically, the *explanatory* power lies in treating them separately for social scientific modeling, you might pivot to Priority 2 to map the boundary conditions pragmatically. However, for a philosophy dissertation, ontological clarity usually precedes pragmatic utility.

  ### Priority 2: The Status of Asymmetric Joint Action
  **Question:** In cases where one agent operates under a "we"-frame and the other under an "I"-frame (with no shared collective commitment), is this a deficient joint action, a non-joint action, or a category requiring external arbitration?

  **Reasoning for Rank:**
  This is the stress test for the ontology established in Priority 1. Asymmetric cases are the "edge cases" that reveal the necessary and sufficient conditions of your theory.
  *   **Dependency:** This depends entirely on the outcome of Priority 1.
      *   *Scenario A:* If Priority 1 concludes that recognition is necessary for *any* joint action, then asymmetric cases (where one party denies the other standing as a co-subject) are likely non-joint actions. They are merely one person using another as a tool.
      *   *Scenario B:* If Priority 1 concludes SJA is ontologically distinct and sufficient, then asymmetric cases may count as genuine joint actions, provided the structural interlocking is present.
      *   Without settling Priority 1, you cannot categorize the asymmetry.
  *   **Tractability:** This is tractable because it isolates the variable of "mutuality." You can analyze cases of exploitation, unacknowledged labor, or hierarchical command structures where the subordinate acts individually while the superior acts collectively. The philosophical work involves determining whether the "jointness" resides in the outcome, the mental states, or the relational status.
  *   **Conditions for Reordering:** If you discover that asymmetric joint action is the *primary* site of political or ethical harm in your area of interest (e.g., workplace exploitation), you might elevate this to Priority 1 to secure a vocabulary for that harm immediately. However, doing so risks building an ethical critique on unstable metaphysical ground. You would only reorder if the conceptual tools from Priority 1 prove insufficient to describe the asymmetry without significant revision.

  ### Priority 3: Upstream Implications for Distributed Moral Responsibility
  **Question:** Does settling the necessity of recognitional commitment for joint action substantially alter our assessments of collective blame in collaborative harm?

  **Reasoning for Rank:**
  This is the downstream application. In the architecture of philosophical inquiry, action theory typically precedes ethics. You must define the agent (or the collective agent) before you can assign responsibility to it.
  *   **Dependency:** This is wholly dependent on Priorities 1 and 2.
      *   If joint action requires mutual recognition (Priority 1), then participants in a structurally coordinated but non-recognitional harmful act might not share *collective* blame, but rather individual blame for their specific contributions.
      *   If asymmetric cases are deemed "deficient joint actions" (Priority 2), the agent with the "we"-frame might bear disproportionate responsibility for failing to establish the requisite recognition.
      *   If you attempt to solve this before settling the nature of the action, you risk category errors (e.g., assigning collective blame to a group that does not ontologically exist as a collective agent).
  *   **Tractability:** This is moderately tractable. It involves applying the definitions from the first two nodes to standard cases of collaborative harm (e.g., corporate negligence, distributed bureaucratic harm). The difficulty lies in bridging the "is-ought" gap, but since you are framing this as "does the metaphysics alter the assessment," you remain within the realm of conceptual consistency rather than normative invention.
  *   **Conditions for Reordering:** This would move up only if an external constraint demands an immediate ethical framework (e.g., if your dissertation is tied to a grant with specific policy outcomes). Intellectually, however, it must remain third. If the metaphysical analysis in Priority 1 reveals that "collective blame" is a misnomer for most structural coordination, the entire third node might dissolve, rendering prior work on it wasted.

  ### Deprioritized Questions
  Given your specific framing, the following widely discussed questions should be actively deprioritized. Resolving them would not significantly advance your specific research goals.

  **1. The Aggregation Problem for Group-Level Attitudes**
  *   **Why Deprioritize:** This debate concerns how individual attitudes sum to form a group attitude (e.g., does a committee believe *p* if the majority believes *p*?). Your framing shifts the focus from *summing attitudes* to the *relational structure* between agents. Whether a group attitude aggregates via voting or consensus is secondary to whether the agents recognize each other as co-subjects in the first place. You can bracket the mechanics of aggregation and focus on the preconditions of the relationship. Solving aggregation does not tell you whether recognition is required for joint action.

  **2. The Reduction of We-Intentions to I-Intentions**
  *   **Why Deprioritize:** This is the classic debate between reductive individualism (Bratman-style) and non-reductive primitivism (Searle-style). Your structural/recognitional distinction cuts *across* this divide. One can hold a reductive view of intentions while still arguing that a normative layer of recognition is required for the action to be fully "joint." Conversely, one can hold a non-reductive view while denying that recognition is necessary. Settling the reduction debate does not settle the recognition debate. Pursuing this would draw you back into legacy taxonomies you are attempting to transcend.

  **3. The Phenomenology of "We-Experience"**
  *   **Why Deprioritize:** While interesting, the subjective *feel* of acting together is empirically intractable for a conceptual dissertation and risks conflating the *experience* of recognition with the *normative status* of recognition. You can have a phenomenology of togetherness without actual standing (e.g., in a manipulated cult), and you can have standing without a strong phenomenological glow (e.g., in routine bureaucratic cooperation). Focusing on phenomenology distracts from the ontological and normative questions central to your agenda.

  ### Summary of Strategy
  Your three-year arc should move from **Metaphysics (Year 1)** to **Boundary Conditions (Year 2)** to **Normative Application (Year 3)**.

  1.  **Year 1:** Prove or disprove that Structural Joint Action is parasitic on Recognitional Joint Action. Establish the "Hidden Normativity" thesis.
  2.  **Year 2:** Apply that thesis to Asymmetric cases. Determine if exploitation is a failure of joint action or a distinct form of it.
  3.  **Year 3:** Map the responsibility gaps created by the findings in Years 1 and 2.

  This order ensures that your final conclusions on responsibility are insulated from metaphysical objections, maximizing the robustness of your dissertation.
