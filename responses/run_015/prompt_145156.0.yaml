answer: |-
  This is a sharp reconstruction of the tension between **genealogical explanation** (how moral beliefs actually change) and **normative justification** (why those beliefs are right). You have correctly identified that Appiah and Williams provide a sociological engine for moral change that seems to bypass individual rationality.

  You want to keep premises (1)–(3) and (5)–(6), which commits you to the view that moral revolutions are driven by status flips and peer pressure, not individual reasoning or learning. The problem you face is the *reductio* at (7): if moral progress is just a status flip, then *any* status flip counts as progress, which is absurd.

  The argument breaks at the inference from **(6) to (7)**. You can maintain that the *mechanism* was non-rational (fashion/pressure) without accepting that the *outcome* is arbitrary. Here is how you hold your position without collapsing into relativism or admitting "hidden arguments."

  ### 1. The Break: Mechanism vs. Validity (The Genetic Fallacy)
  Step (7) assumes that if the *cause* of a belief shift is non-rational (fashion/pressure), the *validity* of the new belief must be arbitrary. This is a version of the **Genetic Fallacy**.

  *   **Keep (6):** You can maintain that for the agents involved, the shift happened "without any reasoning connecting them." They didn't change their minds via syllogism; they changed their behavior via shame.
  *   **Reject (7):** You do not have to conclude that "any norm that becomes unpopular counts as moral progress."
  *   **The Fix:** Distinguish between the **causal history** of a norm and its **truth conditions**. Appiah and Williams are describing the *causal history*. They are not claiming that *causal history* exhausts *moral truth*.
      *   *Analogy:* Evolution is a blind, non-rational process (no "reasoning" connects Species A to Species B). But that doesn't mean "any trait that becomes popular counts as an adaptation." Traits are still judged by fitness.
      *   *Application:* Moral norms might shift via blind social pressure, but they are still judged by **moral fitness** (e.g., reduction of suffering, coherence with other values, human flourishing). The *mechanism* is fashion; the *filter* is reality.

  ### 2. Refine "Learning" in (5) without Ditching It
  You want to keep (5) ("not anyone learning anything"). To make this sustainable, interpret "learning" strictly as **individual cognitive concession**.
  *   **Individual Level:** No slaveholder sat down, processed an argument, and said, "I was wrong." (Keeps 5).
  *   **Systemic Level:** The *society* updated its "operating system" to resolve a contradiction between its professed values (Christianity/Liberty) and its practice (Slavery).
  *   **Why this helps:** It allows you to say the *system* corrected an error even if the *nodes* (people) didn't process the data rationally. The "learning" happened at the level of the social organism, driven by the friction of shame, not the logic of the individual. This preserves (5) while blocking the idea that the change was *meaningless*.

  ### 3. Appiah's Escape Hatch: Honor is Not Morality
  Appiah explicitly distinguishes between **honor codes** and **ethics**.
  *   Honor is about social standing; ethics is about how we treat others.
  *   Appiah argues that honor codes are *tools* that can be used for good or bad ends.
  *   **Blocking (7):** Just because an honor code shifted doesn't mean it was *progress*. If the honor code shifted to make left-handedness shameful, that would be a status flip, but not moral progress.
  *   **The Criterion:** We judge it as progress *retrospectively* based on ethical criteria (suffering, rights), not based on the fact that the shift occurred.
  *   **Your Position:** You can say, "The *victory* of the anti-slavery norm was achieved via honor-pressure (1-3, 5-6), but we call it *progress* because slavery violates independent ethical standards, not simply because it became unpopular." This avoids (8) because you don't need to claim arguments *caused* the shift, only that arguments provide the *standard* by which we judge the shift.

  ### 4. Williams and "Thick Concepts"
  Williams suggests that moral change involves the loss of "thick ethical concepts" (concepts that are both descriptive and evaluative, like "chivalrous" or "brutal").
  *   When dueling died, "chivalrous" lost its grip.
  *   When slavery ended, "property rights in humans" lost its grip.
  *   **The Break:** This isn't just "fashion." It is the **collapse of a worldview**. A worldview can collapse due to social pressure (shame) without rational argument, but the collapse is still *significant* because it reveals that the old practice was unsustainable in a modernizing world.
  *   **Why this saves (6):** The "reasoning" isn't in the heads of the slaveholders; it's in the **structural incompatibility** between slavery and the emerging social order. The shame was the symptom of that incompatibility.

  ### Summary of the Fix
  To keep (1)–(3) and (5)–(6) without accepting (7) or (8):

  1.  **Accept** that the *causal mechanism* of moral change is often non-rational social pressure (Honor/Shame).
  2.  **Deny** that the *validity* of the new norm depends on that mechanism.
  3.  **Argue** that (7) is a non-sequitur: A blind mechanism can produce non-arbitrary results if the environment (moral reality) constrains it.
  4.  **Clarify** that "Progress" is a judgment we make *after the fact* using ethical criteria, not a description of the *psychological process* the agents underwent.

  **Where it breaks:** The inference from **"The agents didn't reason"** to **"The outcome is arbitrary."** You can have unreasoned agents producing reasoned outcomes if the social pressure is tracking something real (like human suffering), even if the agents themselves are only tracking their own status.
