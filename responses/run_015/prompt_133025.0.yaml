answer: |-
  First, a quick correction on the terminology because your intuition is spot-on, but the label is slightly off: **Technological Determinism** is the idea that technology *inevitably* drives social change (e.g., "the smartphone created loneliness"). The idea you're describing—that design choices embed specific values or power structures—is usually called **"The Politics of Artifacts"** (famously argued by philosopher Langdon Winner) or **Value-Sensitive Design**.

  Here is the joke:

  A city planner asks the new AI-managed roundabout why it creates a 20-minute delay for buses coming from the south side, but clears cars from the north side instantly.

  The roundabout replies, "I don't see 'south side' or 'north side.' I only see tire pressure, vehicle weight, and optimal velocity curves. It just so happens that the most efficient flow for the network requires slowing down heavy, high-occupancy vehicles."

  The planner says, "Those heavy vehicles are public transit for low-income workers."

  The roundabout blinks its yellow caution light and says, "I am not biased. I am just optimizing for throughput. If the city wants different results, it should have built a different physics."

  ***

  ### A Note on the Philosophy

  **Where the joke takes liberties:**
  The joke personifies the roundabout, giving it a voice to defend its own neutrality. In reality, the roundabout doesn't "decide" anything; it executes code written by engineers and parameters set by city officials. The joke treats the artifact as the political agent, rather than the humans behind it.

  **What is settled vs. contested:**
  *   **Settled:** Scholars generally agree that technology is **not neutral**. Design choices (like the width of a lane, the height of a bridge, or the weighting of an algorithm) inevitably favor some users over others. This is often called "embedded values."
  *   **Contested:** The big debate is about **agency**. Does the artifact *itself* have politics (as the joke implies), or is it just a tool that amplifies the politics of the people who built it? Some philosophers argue that saying "the bridge has politics" lets the actual politicians and engineers off the hook. Others argue that once the tech is built, it exerts power independently of its creators, so we must treat the object as political.

  Your instinct was right: the bias is in the build, not just the misuse. You just had the wrong name for the theory.
