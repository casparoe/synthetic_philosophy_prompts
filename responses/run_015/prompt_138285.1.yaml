answer: |-
  ### Exam Question

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question:**
  In 1938, a British intelligence analyst is tasked with estimating the probability that the Crown will still rule India in 1988. She attempts to bypass the "inside view" (specific strategic details) by using the outside view and reference-class forecasting. She considers three candidate reference classes arranged on a *matching ladder*: (1) all polities ruling territory >5,000km from their capital; (2) European overseas empires founded after 1500; (3) maritime empires surviving a global war while facing mass nationalism in their largest possession.

  Writing from the epistemic position of 1938 (knowledge of actual decolonization post-1945 is strictly prohibited), evaluate whether the outside view can yield a defensible probability estimate in this case. Your answer must address the trade-offs inherent in the matching ladder, the risk of the *coroner's reference class*, and the *reflexivity problem*. Conclude by specifying what *epistemic modesty* requires of the analyst: should she defer to a base rate, average her estimates, or decline to forecast?

  ***

  ### Model Answer

  The outside view promises to correct optimism by forcing the forecaster to adopt the perspective of a statistician rather than a participant. However, in the 1938 India case, the "matching ladder" reveals that the outside view does not solve the problem of judgment; it merely displaces it from the case to the class selection.

  The first rung (all distant polities) offers a robust sample size but negligible predictive power. The heterogeneity is too vast; Rome and the Incas share a logistical constraint with Britain, but little else. Moving to the second rung (European overseas empires post-1500) improves causal similarity but introduces a critical statistical flaw: right-censoring. In 1938, many members of this class (including Britain) have not yet "failed." To calculate a base rate of imperial durability now would require treating surviving empires as permanent, artificially inflating the success rate, or excluding them, which shrinks the sample to near zero. The analyst cannot know the denominator of "failed empires" because the class is still in motion.

  The third rung appears most relevant but collapses the distinction between inside and outside views. By selecting cases that have "just come through a global war" and face "mass nationalism," the analyst is selecting on the independent variables of the inside view. She is no longer using a statistical baseline; she is using a causal theory to curate the data. This smuggles the very judgment the outside view was meant to bracket. If she chooses this class, she is effectively making an inside-view argument disguised as statistics.

  Beyond the ladder, the *coroner's reference class* problem skews any historical base rate. We tend to categorize political entities as "empires" only in retrospect, once they have ended. Successful, long-lived polities are often relabeled as "unions," "nations," or "commonwealths." Consequently, the historical frequency of "empire death" is inflated because the class is constituted by its own demise. A base rate derived from this class will systematically overestimate the likelihood of collapse, not because of political reality, but because of taxonomic bias.

  Furthermore, the *reflexivity problem* undermines the stability of any derived number. If the analyst publishes a high probability of imperial collapse, it may embolden nationalist movements or discourage metropolitan investment, making the collapse more likely (self-fulfilling). Conversely, if the state perceives the statistic as an existential threat, it may enact repressive measures that alter the trajectory (self-defeating). The outside view relies on the assumption that the future will resemble the past, but the act of forecasting changes the behavior of the agents within the class, breaking the statistical link.

  Therefore, epistemic modesty in this context cannot mean simply splitting the difference between inside and outside estimates, as both are compromised. Nor can it mean deferring to a shaky base rate that masks selection bias. True modesty here requires declining to produce a precise number. The analyst should acknowledge that the reference class is either too broad to be relevant or too narrow to be statistical. She might offer a qualitative range or a conditional scenario, but assigning a specific probability (e.g., "30%") would lend a false precision to a calculation dominated by unquantifiable selection effects. The outside view is a check on hubris, not a machine for generating truth; when the ladder offers no stable rung, the modest forecast is to withhold the number.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. The Matching Ladder Trade-off (4 Marks)**
  *   **Hit:** Identifies that moving up the ladder increases relevance but decreases sample size/validity, specifically noting that Rung 3 smuggles in the inside view via causal selection.
  *   **Typical Muff:** Asserts one rung is objectively correct, or fails to notice that Rung 3 relies on inside-view causal theories.

  **2. Right-Censoring in 1938 (4 Marks)**
  *   **Hit:** Explains that in 1938, many European empires had not yet ended, making the "failure rate" unknowable without biasing the data (treating survivors as permanent or excluding them).
  *   **Typical Muff:** Treats surviving empires as resolved cases, or ignores the temporal position of the analyst entirely.

  **3. The Coroner's Reference Class (4 Marks)**
  *   **Hit:** Explains that defining the class by the outcome (ended empires) inflates the failure frequency because successful polities are relabeled (nations/unions).
  *   **Typical Muff:** Notices selection bias exists but fails to explain the *directional* skew (i.e., that it overestimates collapse).

  **4. The Reflexivity Problem (4 Marks)**
  *   **Hit:** Articulates that knowledge of the base rate alters agent behavior (nationalists or the state), invalidating the historical frequency for future predictions.
  *   **Typical Muff:** Confuses reflexivity with general uncertainty, or treats it as a minor practical hurdle rather than a structural flaw.

  **5. Epistemic Modesty Verdict (4 Marks)**
  *   **Hit:** Concludes that modesty requires *declining* the number or qualifying it heavily, rather than averaging estimates or deferring to the flawed base rate.
  *   **Typical Muff:** Equates modesty with "being careful" or averaging the inside/outside views (compromise rather than methodological critique).

  ***

  ### What a Clean "B" Answer Looks Like (13–14 / 20)

  A B-level student will demonstrate command of the vocabulary and the basic mechanics of the outside view but will lack the critical bite of the first-class answer.

  *   **Strengths:** They will correctly define the three rungs and likely identify that Rung 1 is too broad and Rung 3 is too narrow. They will mention the Coroner's problem and Reflexivity as "limitations" or "risks." They will conclude that the forecast is difficult.
  *   **Weaknesses:** They will likely treat the "smuggling" of the inside view in Rung 3 as a minor issue rather than a fundamental collapse of the method. They may notice right-censoring but not explain *why* 1938 makes it fatal (i.e., they might talk about it generally rather than from the 1938 perspective). Crucially, on Epistemic Modesty, they will likely suggest "splitting the difference" or "using a wide confidence interval" rather than arguing for the refusal of the number itself. They see the problems as obstacles to be managed, rather than structural limits that invalidate the specific output.
  *   **Differentiation:** The A answer argues the method *fails* to produce a number; the B answer argues the method is *hard to use* correctly. The A answer dissects the taxonomy of "empire"; the B answer accepts "empire" as a stable category.
