answer: |-
  ### INSTRUMENT PREAMBLE: SENSE OF "POSSIBLE"

  **This instrument tracks *Metaphysical Possibility*.**
  *   **Not Logical:** We are not asking if a description contains a contradiction (e.g., "married bachelor"). Everyone agrees zombies are logically consistent.
  *   **Not Epistemic:** We are not asking if the scenario is compatible with what you *know* (e.g., "It is possible that the butler did it, for all I know").
  *   **Target:** We are asking about the *way the world could have been*, independent of our knowledge or language. When you answer, ask: "Could this *actually have obtained*, given the nature of reality?"

  ---

  ### PART 1: LOGICAL SPACE ANALYSIS

  Before using the instrument, review the dimensions below. The tree is built by slicing this space.

  **The Four Dimensions**
  1.  **Positive Force (P-Link):** Does a clear success in conceiving establish possibility?
      *   *Veridical:* Yes, necessarily.
      *   *Presumptive:* Yes, unless overridden.
      *   *Inert:* No, it merely reflects prior belief.
  2.  **Negative Force (N-Link):** Does a failure to conceive establish impossibility?
      *   *Symmetric:* Yes (Unconceivability $\to$ Impossibility).
      *   *Asymmetric:* No (Failure is just a limit of the conceiver).
  3.  **Informational Constraint (I-Link):** Does knowing actual empirical identities block conceivability?
      *   *Open:* No (I can conceive Water $\neq$ H2O even if I know Water = H2O).
      *   *Closed:* Yes (Knowing Water = H2O makes Water $\neq$ H2O inconceivable).
  4.  **Domain Scope (D-Link):** Does the rule apply uniformly to Math, Physics, and Metaphysics?
      *   *Uniform:* Yes.
      *   *Fragmented:* No (e.g., works for Math, fails for Identity).

  **Unoccupied or Unattractive Combinations**
  *   **Veridical P-Link + Closed I-Link:** *Incoherent.* If conceiving proves possibility, but you must know all empirical facts to conceive, then empirical discovery does all the work. "Conceivability" becomes a redundant label for "empirical consistency."
  *   **Symmetric N-Link + Asymmetric P-Link:** *Unattractive.* Why would the mind be a reliable detector of impossibility (failure) but an unreliable detector of possibility (success)? Usually, these capacities stand or fall together.
  *   **Veridical P-Link + Fragmented D-Link:** *Unstable.* If conceiving guarantees possibility in Math, why does it fail for Metaphysics? Usually requires a specific metaphysical gap theory (see Kripke-style below).

  **Missing Leaf Added**
  *   **Modal Empiricism:** Distinct from Skepticism. The Skeptic says we cannot know modal truths. The Empiricist says we *can* know them, but only via inference from actual laws and properties, not via conceivability.
      *   *Why add?* Your group likely has someone who says, "We know what's possible because we know physics," not "We know nothing." The Skeptic leaf doesn't capture this positive alternative methodology.

