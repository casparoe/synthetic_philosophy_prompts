  ### PART 2: THE INSTRUMENT (HANDOUT)

  **Instructions:** Start at **Q1**. Answer based on your immediate philosophical intuition about the case described. Follow the arrow to the next question number. Record your path.

  **Q1. The Eighth-Sense Case (Negative Force)**
  Imagine a creature with a sensory modality you lack (an "eighth sense"). You cannot form any mental image or concept of what that experience is like; your mind goes blank when you try.
  *   **A:** This inability is evidence that such an experience is **impossible**. (Go to Q2)
  *   **B:** This inability is just a limit of **your mind**; the experience could still be possible. (Go to Q3)

  **Q2. The Math Case (Domain Scope)**
  Consider the statement: "2 + 2 = 5." Can you conceive of a world where this is true? (Not a world where symbols mean different things, but where the quantity of two plus two is five).
  *   **A:** Yes, I can conceive it, even if I think it's false. (Go to Q4)
  *   **B:** No, I cannot conceive it at all; my mind rejects it entirely. (Go to Q5)

  **Q3. The Zombie Case (Positive Force Baseline)**
  You have a complete physical description of a human being (every atom, every firing neuron). Can you conceive of this physical state occurring *without* any inner conscious experience?
  *   **A:** Yes, clearly. (Go to Q5)
  *   **B:** No, if I have the full physical facts, consciousness is included automatically. (Go to Q6)

  **Q4. The Table/Ice Case (Defeasibility)**
  You look at a wooden table and conceive of it being made of ice. Later, a scientist tells you the molecular structure of this specific table *physically precludes* it being ice. Did your initial conceiving prove it was possible?
  *   **A:** Yes, my conceiving was right; the scientist must be mistaken about the structure. (Go to Q7)
  *   **B:** No, the scientist's facts override my conceiving. (Go to Q8)

  **Q5. The Water/XYZ Case (Informational Constraint)**
  Imagine a person who knows all the chemical facts about water (it is H2O) but is asked: "Can you conceive of the stuff in the lakes being XYZ instead?"
  *   **A:** Yes, they can conceive it, even knowing it is H2O. (Go to Q7)
  *   **B:** No, knowing it is H2O makes conceiving it as XYZ impossible. (Go to Q8)

  **Q6. The Hesperus Case (The Gap)**
  Before learning that Hesperus (Evening Star) is Phosphorus (Morning Star), someone conceives of Hesperus existing without Phosphorus. After learning they are identical, was that earlier conception **false** (they thought something impossible was possible) or **misdescribed** (they conceived a scenario that is possible under a different description)?
  *   **A:** False. They made a mistake about possibility. (Go to Q8)
  *   **B:** Misdescribed. The scenario they pictured is possible, just not *that* identity. (Go to Q7)

  **Q7. The Idealization Check (Competence)**
  If two people disagree on whether a scenario is conceivable (one says yes, one says no), is the solution to get **more empirical data** or to **think harder/longer** (ideal reflection)?
  *   **A:** Think harder/longer. (Result Code: **RATIONAL**)
  *   **B:** Get more empirical data. (Result Code: **EMPIRIC**)

  **Q8. The Source Check (Inertness)**
  When you successfully conceive of a scenario, do you feel you have **discovered** a new fact about possibility, or simply **noticed** that you already believed it was possible?
  *   **A:** Discovered. (Result Code: **GUIDE**)
  *   **B:** Noticed. (Result Code: **INERT**)

