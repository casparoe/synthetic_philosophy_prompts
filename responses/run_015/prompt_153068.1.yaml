  ### PART 3: THE KEY (INSTRUCTOR USE ONLY)

  **Mapping Result Codes to Positions**

  | Path Profile (Summary) | Result Code | Position in Literature | Notes |
  | :--- | :--- | :--- | :--- |
  | **Q1-B, Q3-A, Q5-A, Q7-A** | **RATIONAL** | **Straight Modal Rationalism** | Conceivability (A Priori) entails Possibility. Uniform domain. |
  | **Q1-B, Q3-A, Q5-B, Q6-B, Q7-A** | **RATIONAL** | **Two-Dimensional Rationalism (Chalmers-style)** | *Flagged:* Hard to distinguish from Straight Rationalism without "Primary Intension" jargon. Distinguished here by Q6 (Misdescribed vs. False). |
  | **Q1-B, Q3-A, Q4-B, Q8-A** | **GUIDE** | **Defeasible Guide (Moderatism)** | Conceivability is prima facie evidence, defeasible by empirical facts (Table case). |
  | **Q1-B, Q3-B, Q5-B, Q6-A, Q8-A** | **GUIDE** | **Kripke-Style (Necessary A Posteriori)** | Accepts conceivability generally, but admits a specific gap for identity cases (Q6). |
  | **Q1-B, Q3-B, Q5-B, Q8-B** | **INERT** | **Modal Skepticism (Van Inwagen-style)** | Conceivability tracks belief, not reality. No modal knowledge from conceiving. |
  | **Q1-A, Q2-B, Q7-B** | **EMPIRIC** | **Modal Empiricism** | Failure is evidence (Q1), Math is constrained (Q2), Knowledge comes from data (Q7). |
  | **Q1-A, Q2-A** | **N/A** | **Radical Anti-Realism / Paraconsistency** | Unoccupied by standard modal realists. Implies contradictions are conceivable/possible. |

  **Indistinguishability Flags**
  1.  **Straight Rationalism vs. 2D Rationalism:** The tree struggles to separate these cleanly without violating the "No Jargon" constraint. Both answer "Yes" to Zombies and "Yes" to Idealization. The split relies entirely on **Q6 (Hesperus)**. If a subject answers "Misdescribed" (Q6-B), they lean 2D. If they answer "False" (Q6-A) but still claim Rationalism, they are likely a Straight Rationalist who denies the conceivability of the identity split in the first place. *Warning:* Sophisticated 2Dists may answer Q6-A if they interpret "conceive" as "conceive the secondary intension."
  2.  **Skepticism vs. Inertness:** These are functionally identical in practice. Van Inwagen's skepticism leads to the conclusion that conceivability is inert. The tree treats them as one leaf (**INERT**).
  3.  **Kripke-Style vs. Skepticism:** Both deny the Zombie intuition (Q3-B). They split on **Q8**. If they think conceiving *sometimes* works (just not for identities), they are Kripke-style (**GUIDE**). If they think conceiving *never* discovers new modal facts, they are Skeptics (**INERT**).

  **Unoccupied Combinations Encountered**
  *   **Path Q1-A, Q3-A:** (Symmetric Negative, Veridical Positive). Rare. Usually, if you think failure proves impossibility (Q1-A), you are wary of success proving possibility (Q3-A). If a student takes this path, probe for **Modal Security** views (e.g., Bealer), where competence guarantees both.
  *   **Path Q4-A:** (Conceiving overrides Science). This leads to **Radical Rationalism**. If a student claims their conceiving of the Ice Table overrides molecular evidence, they hold that modal intuition is more certain than empirical science. This is theoretically possible but rarely held consistently.

  **Diagnostic Tips for the Moderator**
  *   **The "Zombie" Stall:** If the group stalls on Q3, remind them: "We are not asking if zombies *are* actual. We are asking if you can *conceive* the description without contradiction."
  *   **The "Math" Trap:** If everyone answers Q2-B (Cannot conceive 2+2=5), this does not prove Rationalism. Skeptics also cannot conceive it. Use Q8 to separate them (Did you *discover* it's impossible, or do you just *believe* it is?).
  *   **The "Eighth-Sense" Lever:** Q1 is your best tool to break the "Unconceivability = Impossibility" habit. If they answer Q1-A, press them: "Is the creature's experience impossible, or just impossible *for you to imagine*?" Most will retreat to Q1-B upon reflection.
