  2. This reading claims we currently lack an empirical account or explanatory model showing how experientially blank properties entail phenomenology. This is substantive and defensible as a statement of current ignorance, but it does not license panpsychism since future physics might bridge the gap; it bites on the structural-mismatch sub-problem, and while experts grant the current explanatory gap, they contest its permanence, making it unlikely to be the group's primary reliance and not a symmetrical objection.

  3. This reading asserts that non-conscious entities lack the causal powers required to produce conscious states in a brain. This is false regarding constitution rather than causation, so it fails to license panpsychism; it is untouched by all three combination sub-problems which concern constitution not causation, and since physicalists grant causal closure but contest causal exclusion, this was not relied on by your group and is not a symmetrical objection.

  4. This reading invokes a mereological principle that macro-level experience must be constructed from micro-level experience because only like can yield like. This is substantive and contested, and while it licenses panpsychism it simultaneously triggers the subject-summing and quality-palette sub-problems as a genuinely symmetrical objection; experts grant the intuition but contest its validity, and although your group likely relied on the next reading, this one uniquely damages panpsychism equally.

  5. This reading posits an a priori truth that experience cannot be fully grounded in or entailed by wholly non-experiential facts. This is substantive and contested, licenses the inference to panpsychism by ruling out physicalism, bites on the structural-mismatch sub-problem but is untouched by subject-summing, and while physicalists contest the entailment claim, proponents grant it, making this the reading your group relied on though it is not a symmetrical objection.
