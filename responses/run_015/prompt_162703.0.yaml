prompt: |-
  You are a professional philosopher with a research specialization in formal ontology who also speaks fluent data engineering — picture someone equally at home in a metaphysics seminar and in a schema-review meeting, and who has thought specifically about how information-systems vocabularies distort the questions they are used to model. Work through this carefully and in stages rather than in one pass: I want a considered piece of analysis, not a competent summary.

  **Who I am and what I have.** I am a senior data engineer, fifteen years of OLTP systems, event sourcing, and warehouse modeling, and essentially no formal philosophy. The vocabulary I actually reason in: base tables and views (including materialized and updatable views), rows and primary keys, natural versus surrogate keys, constraints (NOT NULL, CHECK, UNIQUE, foreign keys with cascading deletes), transactions and commits, snapshot isolation and bitemporal tables (valid-time versus transaction-time), schema migrations, entity resolution / record linkage, object–relational mapping and the impedance mismatch between "same entity" and "same row", soft deletes and garbage collection, normal forms and denormalization. Assume I am fluent in all of that; do not explain it to me. Use it precisely, and tell me when I am using it loosely.

  **What I want translated.** The standard puzzle of the statue and the clay, in which one lump of matter and one statue occupy the same place at the same time, share all their parts, and yet appear to differ: the lump could survive being squashed into a ball while the statue could not; the statue could survive the replacement of a small chipped piece while the lump could not; the lump existed before the sculptor began and will outlive the statue. As far as I can tell there are four camps, and I have put each in my own words — if I have mangled one, correct my description before you translate it, because I would rather be corrected than charitably translated into a mistake:

  1. *Two things, one matter.* The statue and the lump are numerically distinct objects that coincide — same parts, same location, same matter now — and differ in their persistence and modal properties. The relation between them is constitution, and constitution is not identity.
  2. *One thing, counted two ways.* There is only one object there. "Statue" and "lump" are two sortals under which we count it, and identity claims are sortal-relative, so the question "is the statue the lump?" is not well formed until a sortal is supplied.
  3. *Two space-time worms.* The statue and the lump are both four-dimensional objects that share all their parts at this moment and differ only in temporal extent (and therefore in modal profile). Coincidence, on this view, is not the deep puzzle it looked like.
  4. *No statue at all.* Strictly speaking there are no composite objects with statue-like persistence conditions; there is matter (or there are simples) arranged statue-wise, and talk of the statue is a façon de parler that is useful but not ontologically committing.

  **Two stress cases your translation has to handle.** I am not interested in a translation that only fits the textbook example, so run each of the four through these as well.

  *Case A — the reprint.* The finished clay statue is scanned to a mesh at t1. At t2 the original is pulverized in an accident. At t3 a new object is printed from the same mesh, from clay of the same batch, indistinguishable from the original at the level of grain and shape. There is a gap in which nothing material instantiates the mesh. Is the t3 object the same statue, the same lump, both, or neither — on each of the four views, and in my vocabulary?

  *Case B — the twin castings.* In a single session the sculptor press-molds two statues from the same batch of clay using the same mold. Suppose them qualitatively identical, brought into existence at the same moment, and with identical futures: nothing qualitative, historical, or modal distinguishes them, yet there are two. What in my vocabulary carries that difference? If the honest answer is "a surrogate key, i.e. an arbitrary label stuck on each row," then say plainly whether that is a fair translation of bare numerical difference or a reductio of camp 1 — and if camp 1 has a non-arbitrary answer available, give it in my terms.

  **What to give me back, in this order.**

  1. *A short first pass before you commit.* Start by sketching a translation key and noting where you already expect the mapping to strain or fail. Then write the final version. I want to see what you thought would break, not only what did.
  2. *The translation key* (under 200 words): how you are mapping object, persistence condition, modal property, constitution, coincidence, numerical identity, sortal, and grounding onto my terms. Flag every place where my vocabulary forces a determinate choice that the metaphysics leaves open.
  3. *The four positions, one at a time.* For each: what translates cleanly, what translates only with distortion (and specifically what gets bent in the bending), and what cannot be expressed in my vocabulary at all.
  4. *Both stress cases*, briefly, for each position.
  5. *A consolidated residue report*, as a compact table with three buckets — translates cleanly / translates only with distortion / inexpressible — plus a column saying, for each residue, whether you think it indicts my framework or indicts the original claim.
  6. *A verdict.* Commit to two things rather than hedging. First: is the bulk of the residue a limitation of my vocabulary, or evidence that the philosophers' dispute is under-specified, or turns on a distinction that does less work than it appears to? Second: after translation, does any of the four camps look stronger or weaker than it did before — and is that because the translation revealed something, or because my vocabulary begged the question in its favor?

  One more requirement, which matters to me more than the rest: name explicitly at least one place where you caught yourself importing an assumption from the database side and passing it off as neutral translation — for instance that identity must be settled by a key, that persistence is just update semantics, that whatever is not recorded in the schema is indeterminate, or that views are less real than base tables. I would rather have the smuggling pointed out than have it succeed.

  Constraints: no citations, bibliographies, reading lists, or links — I cannot check them and do not want them. Aim for 900 to 1,300 words, use headers, and keep the prose dense. Do not flatter my framework; if the honest conclusion is that data modeling has no resources for this question, say that and say what kind of resource it would need.
