      *   **Analogy 2: The Axiom of Choice (AC).**
          *   *Undergrad 2's Use:* AC is also independent. People accepted it based on "extrinsic justification" (math works better). So independence $\neq$ no fact of the matter.
          *   *Mapping:* ZFC minus C $\leftrightarrow$ ZFC minus CH. AC $\leftrightarrow$ CH. Acceptance of AC $\leftrightarrow$ Potential acceptance of new set axioms.
