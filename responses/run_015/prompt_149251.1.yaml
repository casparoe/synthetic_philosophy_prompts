      *   *Section 4: The Gödel Sentence.* Distinguish semantic self-reference from substantive cardinality claims.
      *   *Section 5: Final Verdict.* Is it *sui generis*? Yes. The analogies are rhetorical weapons. The core issue is the determinacy of the concept of "arbitrary subset."

  6.  **Refining the Tone:**
