answer: |-
  A disjunctivist insurance adjuster sits across from a policyholder whose house stands perfectly intact despite a claim for total fire loss.

  "I saw it burn," the policyholder insists, trembling. "Flames, smoke, the roof collapsing. It was subjectively indistinguishable from a real fire."

  The adjuster closes his clipboard with a snap. "Then you're invoking a Highest Common Factor. You're assuming that because the hallucination matches the veridical perception from the inside, there's a shared mental kind underlying both cases."

  "Isn't there?" the policyholder asks.

  "Absolutely not," the adjuster replies. "If the fire wasn't there, you didn't 'see' anything. You weren't in a state of 'seeing-that-could-be-false'; you were in a wholly distinct metaphysical category that lacks an object of awareness. Since our policy covers 'observed loss,' and you literally observed nothing in the hallucinatory disjunct, you have no witness testimony to submit. You didn't see a loss. You merely seemed to. And we don't insure seemings."

  The policyholder stares. "So because I can't prove from the inside which disjunct I'm in, I get nothing?"

  "No," says the adjuster, standing up. "Because if you're in the hallucinatory disjunct, the experience you're claiming as evidence doesn't exist. You're trying to bill us for a common mental state that metaphysics forbids. Claim denied."

  ***

  **Self-Critical Note**

  In constructing this joke, I have taken several liberties with the philosophical positions for the sake of bureaucratic absurdity:

  1.  **Epistemic vs. Metaphysical:** I treat the disjunctivist's metaphysical claim (that there is no common *kind*) as an immediate epistemic tool for the adjuster to deny testimony. In reality, disjunctivism is primarily a thesis about the *nature* of experience, not necessarily a rule of evidence for third-party adjudicators. A disjunctivist might agree the subject *had* an experience, just not a perceptual one.
  2.  **Object of Awareness:** The joke implies that in the hallucinatory case, the subject is aware of *nothing* ("you didn't see anything"). This leans heavily on a strong naive realist reading (perhaps Martin-style) where the hallucination has no positive phenomenal character of its own. Many disjunctivists would concede there is *something* it is like to hallucinate, just that its nature is not relational. Denying the experience exists entirely is a caricature of the "negative" disjunctivist claim.
  3.  **McDowell vs. Austin:** The adjuster's reasoning relies on a McDowell-style relational view (where the fact itself is present in the veridical case) rather than an Austin-style linguistic analysis of "looks" and "seems." Austin might argue the policyholder is simply misusing the word "saw," whereas the joke treats the error as ontological. This choice is contested, as McDowell's epistemological disjunctivism is distinct from Martin's metaphysical disjunctivism, and conflating them simplifies the debate for the punchline.
