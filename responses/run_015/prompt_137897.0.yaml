answer: |-
  Consider a mandatory civic service programme introduced sequentially across twelve administrative regions over a fifteen-year period, such that every citizen turns eighteen exactly when the programme launches in their home region. Consequently, all individuals born between 1990 and 2005 complete the same twelve-month service at the same developmental stage, resulting in a distinct, measurable convergence in civic attitudes and career trajectories compared to those born before or after. However, because the rollout is staggered, a person born in 1990 serves in 2008 during a financial crisis, while a person born in 2005 serves in 2023 during a period of peace and digital expansion; they never share a temporal context, peer group, or concurrent national news cycle, and the specific content of their service is adapted to the prevailing conditions of their respective years.

  The prediction account affirms this cohort because birth year reliably tracks the causal mechanism, whereas the historical-cause account denies it because the members never undergo a shared historical moment. For the prediction theorist, the birth window functions as a perfect proxy for exposure to the service programme, outperforming class or region in explaining attitudinal variance, which is sufficient for kindhood. For the historical-cause theorist, the fifteen-year stagger means there is no single crisis, war or cultural shift experienced collectively; the 1990 baby faces a recession while the 2005 baby faces a boom, so there is no shared historical consciousness to bind them. The decisive feature doing the work is the decoupling of calendar time from developmental timing. If the programme launched nationwide on a single date, both accounts would converge on 'yes'; if the rollout were randomised by individual rather than region-cohort, both would converge on 'no'. A defender of the historical-cause account might attempt to reclaim the case by arguing that the legislation itself constitutes the shared historical event, rendering the administrative stagger irrelevant to the ontological status of the cohort.
