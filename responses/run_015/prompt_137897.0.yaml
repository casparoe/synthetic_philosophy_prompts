      *   *Idea 3: Housing Market.* People entering the market at different times face different prices. But this is often tied to macroeconomic crashes (shared event).
      *   *Idea 4: Technological Adoption.* Different ages adopt tech differently. But this is often age effects, not cohort effects.
      *   *Idea 5: Convergent Causes (The Key).* I need a situation where people born in a specific window end up with similar outcomes, but *not* because they experienced the same event. Rather, they experienced *different* events that happened to push them to the same place, or structural factors that affect them similarly despite lacking a shared "moment."
