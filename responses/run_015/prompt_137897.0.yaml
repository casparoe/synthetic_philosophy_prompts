          *   Clustering must be robust/predictive.
          *   Causal story must be ordinary but *not* shared history/experience (i.e., convergent causes, not common causes).
          *   Must not stipulate verdicts (show, don't tell).
          *   Must work intuitively for familiar cohorts vs. bogus ones (e.g., Tuesday births).
          *   **Format:** Lead with the scenario (one paragraph, no preamble). Then analysis starting with a single sentence bottom line. Then reasoning. Then identify the single feature doing the work. Then what happens if removed/inverted. Then the strongest objection from the Historical-Cause defender.
          *   **Language:** British English.

  2.  **Deconstruct the Accounts:**
      *   **Historical-Cause Account:** Needs a *shared formative event* experienced *together* at the *same life stage*. If the causes are different for different people, or if the timing relative to life stage varies too much, it's not a generation.
      *   **Prediction Account:** Needs a *birth year partition* that predicts attitudes/behaviour better than alternatives (age, class, etc.). It doesn't care *why*, only that it works.

