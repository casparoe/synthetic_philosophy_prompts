answer: |-
  Here is the referee ruling on the six moves, followed by a synthesis of the debate.

  ### Move-by-Move Analysis

  **(1) Jake: "Magical thinking: pressing your button doesn't causally change theirs."**
  *   **Rating:** **Technically Right, Theoretically Narrow.**
  *   **Justification:** Jake is correctly applying **Causal Decision Theory (CDT)**. In standard physics, my action does not physically reach across space to move your hand. However, he is dismissing the core premise of superrationality: that the link isn't *causal* (physical signal) but *logical* (shared algorithm). He is right about the universe, but potentially wrong about the decision problem.

  **(2) Nina: "Not causal correlation, it's logical — if reasoning processes are isomorphic... outputs are tied."**
  *   **Rating:** **Conceptually Right.**
  *   **Justification:** This is the accurate definition of Hofstadter's superrationality (and modern **Functional Decision Theory**). If two agents run the same source code on the same input, the output *must* be identical by logical necessity, not physical causation. Nina correctly identifies that the "link" is mathematical, not physical.

  **(3) Jake: "Real-world copies never have perfect isomorphism... correlation is always less than one."**
  *   **Rating:** **Empirically Right.**
  *   **Justification:** Jake correctly points out that perfect isomorphism is a Platonic ideal. In reality, there is always noise, different upbringing, or neural variance. This weakens the "logical necessity" argument into a "high probability correlation" argument.

  **(4) Nina: "You can build a confidence parameter into the decision rule."**
  *   **Rating:** **Theoretically Sound.**
  *   **Justification:** Nina is correct that the math can accommodate imperfect correlation. If you believe there is a 90% chance your opponent mirrors you, you can calculate expected utility based on that probability. This saves the strategy from Jake's "perfect copy" objection, but it changes the nature of the claim (see Move 6).

  **(5) Nina: "In mixed tournaments... you context-switch, which shows superrationality is at least a coherent local strategy."**
  *   **Rating:** **Pragmatically Right, Strategically Weak.**
  *   **Justification:** Nina is right that this strategy wins in specific environments (high-correlation tournaments). However, by admitting it is "local" and requires "context-switching," she is conceding that it is not a universal law of rationality, but rather a conditional strategy.

  **(6) Jake: "If it's local and parameter-dependent then it's not a universal principle, it's just a heuristic, and calling it 'superrational' is marketing."**
  *   **Rating:** **Philosophically Strong.**
  *   **Justification:** Jake lands the strongest blow here. If the strategy depends on an empirical parameter (how similar is my opponent?), it collapses into **Evidential Decision Theory (EDT)** with a specific prior. It ceases to be a *new kind of rationality* and becomes a standard calculation based on observed correlation. The label "superrational" implies a transcendence of standard utility maximization, which this move undermines.

  ---

  ### The Verdict

  **Who is right about what?**
  *   **Jake is right about Causality and Universality.** He correctly identifies that there is no physical mechanism linking the buttons, and he correctly identifies that once you introduce probability parameters, you haven't discovered a new law of rationality; you've just done Bayesian updating on opponent types.
  *   **Nina is right about Logic and Payoff.** She correctly identifies that treating the opponent as a mirror of your own algorithm yields higher payoffs in high-correlation scenarios. She is right that ignoring the logical link (as CDT does) leaves money on the table in Newcomb-like problems.

  **Who is missing the bigger picture?**
  *   **Both are missing the modern synthesis.** This debate is 30 years old. The contemporary resolution lies in **Functional Decision Theory (FDT)** (developed by Yudkowsky and Soares).
      *   **Jake's Blind Spot:** He assumes "influence" must be physical/causal. FDT argues that decisions are *function outputs*. If you change your decision function, you logically change the output of any other system running that function. It's not magic; it's logic.
      *   **Nina's Blind Spot:** She treats superrationality as a "vibe" or a moral stance rather than a rigorous mathematical framework. She concedes too much to the "parameter" argument. FDT argues that the correlation isn't just a probability to be estimated; it's a structural fact about the decision algorithm itself.

  **Final Ruling:**
  **Jake wins the semantic argument;** "Superrationality" is indeed a marketing term for a specific subset of Evidential Decision Theory applied to logical correlations. **Nina wins the practical argument;** acting *as if* you are superrational in high-correlation environments produces better outcomes than strict Causal Decision Theory.

  **Recommendation:** Stop calling it "superrationality." Call it "Logical Correlation Exploitation." Jake should admit it works in simulations; Nina should admit it's not a universal moral law. Get back to studying.
