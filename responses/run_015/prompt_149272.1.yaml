  So me and two people in my study group got stuck arguing about superrationality — you know, that Hofstadter thing where in prisoner's dilema you cooperate with a copy of yourself because your reasoning is linked. (1) Jake said that's just magical thinking: pressing your button doesn't causally change theirs, so if they defect you're just the sucker who cooperated. (2) Nina said it's not causal correlation, it's logical — if the reasoning processes are isomorfic, then computing your own move is computing theirs, so the outputs are tied. (3) Jake said okay but real-world copies never have perfect isomorphism; there's always noise, different hardware, bit-flips, so the correlation is always less than one and you've sacrificed payoff for a phantom link. (4) Nina said you can build a confidence paramter into the decision rule, but Jake said then you've just rebuilt expected utility with a weird prior over opponent types, not discovered a distinct kind of rationality. (5) Nina said in mixed tournaments with both copies and strangers you context-switch, which shows superrationality is at least a coherent local strategy. (6) Jake replied that if it's local and paramter-dependent then it's not a universal principle, it's just a heuristic, and calling it 'superrational' is marketing. They asked me to refferree. Can you go through moves 1-6, rate each from clearly mistaken to clearly right, briefly justify, and say who's right about what and who's missing the bigger picture?
