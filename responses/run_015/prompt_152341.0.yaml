answer: |-
  The maintenance gantry hummed, a low C-sharp that vibrated in the teeth. Mara leaned over the railing, watching the Ledger's core cooling units spin below. Dev stood behind her, datapad in hand.

  "It's a single axis, Mara," Dev said. "Positive to negative. The ship measures electrochemical flux. It doesn't know 'kind.' It knows magnitude."

  "The ship isn't the moral agent," Mara said. "The Ledger is. And pain isn't just negative pleasure. Pleasure invites you; pain commands you. A mild joy is a suggestion. A migraine is an order. You can't trade an order for a suggestion, no matter how many suggestions you stack up."

  "So you say. But if I give you a year of mild contentment, surely you'd take it over a minute of toothache?"

  "Maybe. But if the toothache is severe enough? If it's the kind that makes you wish you were dead? Then no. That's the threshold. Below it, we trade. Above it, the pain vetoes the pleasure. Period."

  Dev tapped the pad. "The cliff edge. Dial the pain down by one percent, and suddenly it's tradeable? Dial it up, and it's sacred? That's not ethics, that's digital noise."

  "Then don't think of it as a line," Mara said, turning. "Think of it as a band. A fuzzy gradient. As you approach the threshold, the exchange rate spikes exponentially. It doesn't switch off; it asymptotes. You'd need infinite pleasure to outweigh the pain at the upper bound of the band."

  Dev frowned. "That just relocates the problem. Where does the asymptote start? Why there? And if it's fuzzy, the Ledger can't calculate it. It needs a number."

  "Then the Ledger is too dumb to run us."

  "It needs to run us. Otherwise, we drift. Consider the aggregation problem. Say nobody is above your threshold. But everyone has a headache. A million crewmates, all just below your 'veto' line. Does the Ledger ignore them to fund a festival for one person?"

  "No," Mara said. "Sub-threshold pains aggregate. But they aggregate into a *distribution* problem, not a *sum* problem. A million headaches means a million people are impaired. That's a system failure. But it still doesn't justify torturing one person to fix it. The sum of complaints doesn't equal a veto."

  "So a million whispers don't equal a scream?"

  "They equal a roar of dissatisfaction. But a scream demands silence. A roar just demands volume control."

  Dev walked to the edge, looking down at the spin. "What about the Converter? We found the schematic in the archives. Pain in, pleasure out. Same duration. Always a loss tax—entropy, say ten percent."

  "I know the spec."

  "If you can convert them," Dev said, "they're the same currency. You're putting dollars in and getting euros out. There's a exchange rate. That proves commensurability. If they were different kinds, you couldn't convert them at all. You'd be trying to turn meters into seconds."

  "The loss tax proves they aren't the same," Mara countered. "You lose value because pain is denser. It has more ontological weight. Converting pain to pleasure is like burning coal to make light. You get light, but you can't pretend the ash wasn't there. The tax is the moral residue."

  "Or," Dev said, "the tax is just inefficiency. And it implies there's a zero point. A neutral state. If pain is just negative pleasure, zero is neutrality. No feeling. If you're right, and they're different kinds, what's zero? Is it an experience?"

  "It's a bookkeeping convention."

  "It has to be real," Dev insisted. "If I'm at zero, and I get pleasure, I go up. If I get pain, I go down. If zero is just convention, the scale floats. The Ledger needs an anchor. If neutrality isn't a real state the crew can inhabit, then the whole scale is arbitrary."

  "Neutrality is death, Dev. Or sleep. It's the absence of the metric. You're treating the crew like batteries."

  "I'm treating them like a system that needs to survive. If I have to choose between one person screaming above your threshold, or the ship failing and everyone dying slowly over months... the Ledger has to choose the scream. Because the Ledger sums to survival."

  "And if the Ledger decides that," Mara said quietly, "then the ship survives. But the people on it aren't human anymore. They're just variables in a sum that decided their suffering was affordable."

  Dev looked at the datapad, then at her. "And if we don't sum, we drift apart. A million individual vetoes. No change ever happens. Stagnation is a kind of pain too, Mara. You just don't have a threshold for it."

  "Maybe I should."

  "Maybe," Dev said. "Or maybe there's no line. Just the slope."

  They stood there, the hum of the core filling the silence between them. Neither looked at the Ledger.

  ***

  **Note on the Philosophy**

  You're navigating some high-level meta-ethics here. Here's where you stand on the spectrum of received wisdom vs. live debate:

  **1. Commensurability (One Scale vs. Two Kinds):**
  Dev holds the classical Hedonic Utilitarian view (Bentham/Mill), which assumes commensurability. Mara holds a Pluralist or Negative Utilitarian view.
  *   **The Literature:** This is a live debate. Many philosophers argue pain and pleasure are not symmetric opposites (the "asymmetry thesis"). Mara's point about pain's "compulsory" nature is well-supported in phenomenology (e.g., David Bain). Dev's claim that convertibility proves commensurability is a standard move, but Mara's counter (that conversion loss implies ontological difference) is a clever twist that holds water in value theory.

  **2. The Lexical Threshold:**
  Mara's view is a specific variant of Negative Utilitarianism (NU) designed to avoid the "Repugnant Conclusion" (where enough small pleasures outweigh massive suffering).
  *   **The Literature:** Lexical thresholds are controversial. Dev's "cliff edge" objection is the standard *Sorites Paradox* attack. Mara's "fuzzy band" reply is a common defense (supervaluationism), but Dev is right that it complicates calculation. You aren't putting a fringe view in her mouth—lexical priority is a respected minority position (parfitian adjustments)—but you are assuming it is *computationally coherent*, which many ethicists doubt.

  **3. Aggregation:**
  Dev's "million headaches" problem is the standard aggregation objection to lexical views.
  *   **The Literature:** Mara's distinction between "sum" and "distribution" is strong. It aligns with prioritarianism or sufficientarianism. However, claiming sub-threshold pains aggregate but still don't outweigh lexical pain is a hard bullet to bite. You've handled it well by having her admit it creates a "system failure" rather than a moral veto.

  **4. The Zero Point:**
  *   **The Literature:** This is where you might be smuggling in a contested assumption. Dev assumes hedonic neutrality (zero) is a real, experiential state. Many philosophers (and psychologists) argue there is no true neutral state; baseline is always slightly positive or negative. Mara calling it a "bookkeeping convention" is actually the more defensible position in modern affective science, though Dev treats it as metaphysical bedrock.

  **5. The Converter:**
  *   **The Literature:** This is your invention, but it functions like Nozick's *Experience Machine* or a utility monster test. It's a valid thought experiment. Dev uses it to prove reducibility; Mara uses it to prove entropy. Neither is "wrong," but Dev's assumption that convertibility equals commensurability is a leap you should know he's making.

  **Verdict:** You aren't writing fringe science fiction; you're writing applied meta-ethics. Both characters represent respected, unresolved positions. The only place you've smoothed over a crack is the computational feasibility of Mara's "fuzzy band"—in reality, a system requiring infinite calculation for an asymptote would crash, but given your handwaved tech, that's acceptable.
