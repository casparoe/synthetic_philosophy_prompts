          *   Include the "dangerous question" from the anthropologist about the implicit model of development.
          *   Practical tone (no reading lists).

  2.  **Deconstruct the Core Argument:**
      *   *Thesis:* Institutions and Geography are ontologically entangled in development outcomes. You can't change one without changing the functional role of the other.
      *   *Mechanism:* Counterfactual collapse. If you change the institution (e.g., property rights), you change how geography (e.g., soil, climate) is exploited. Therefore, you can't hold geography constant while varying institutions in a meaningful way.
      *   *Implication:* Standard IV strategies (Acemoglu et al.) that treat geography as exogenous and institutions as endogenous (via settler mortality, etc.) are flawed because the instrument affects the geography-institution nexus, not just institutions.

  3.  **Identify Potential Objections (Brainstorming):**
      *   *Econ Historians:* "But settler mortality is exogenous!" "You're denying identification." "What about Singapore? Bad geography, good institutions." "You're throwing out the only tools we have."
      *   *Political Scientists:* "You're ignoring culture/norms." "Institutions are just crystallized culture." "Path dependence matters more than geography."
      *   *Anthropologist:* "Development is a colonial construct." "Who defines 'rich'?" "You're reifying the state." "Why are we comparing nations at all?"
      *   *General:* "So what? Policy still needs levers." "This is just interaction effects, not ontological collapse."

  4.  **Order by Damage Potential:**
      *   *Highest Damage:* The Identification Attack (Econ Historians). If identification fails, the whole empirical field collapses. They hold the most sway in a "development studies colloquium" usually dominated by quant methods.
      *   *Medium-High:* The "Singapore/Hong Kong" Counterexample. Easy to shout out, hard to refute quickly.
      *   *Medium:* The Culture Variable (Pol Sci). They will argue you're just renaming culture as "institution-geography entanglement."
      *   *Low (but existentially annoying):* The Anthropologist. Won't dismantle the econ argument, but makes the room feel ethically uncomfortable.
      *   *The "Prayer" Question:* The Anthropologist's trap about the definition of development.

  5.  **Drafting the Responses (Iterative Process):**

      *   *Objection 1 (Econ Hist):* "You're destroying identification. If geography and institutions are entangled, your IVs are invalid."
          *   *Reply:* Acknowledge the loss of clean IVs. Pivot to "mechanism over identification." We aren't estimating $\beta$, we're describing a system.
          *   *Slippery Flag:* Admitting I don't have a better estimator yet.

      *   *Objection 2 (Econ Hist/General):* "Singapore. Tropical, no resources, rich. Institutions won."
          *   *Reply:* Singapore *used* geography differently (port location vs. agriculture). They didn't escape geography; they swapped which geographic features mattered.
          *   *Slippery Flag:* Equivocating on what "geography" means (climate vs. location).

      *   *Objection 3 (Pol Sci):* "It's Culture. Institutions are just formalized culture."
          *   *Reply:* Culture is the software, Institutions are the code, Geography is the hardware. You can't run new code without changing how hardware is used. I'm not denying culture, I'm saying the *channel* is geo-insti.
          *   *Slippery Flag:* Metaphor might be too loose.

      *   *Objection 4 (Anthropologist):* "This framing assumes 'Rich' = Good."
          *   *Reply:* Use GDP as a proxy for state capacity/energy capture, not welfare. It's about *power to transform*, not *happiness*.
          *   *Slippery Flag:* This is the weak point.

      *   *The "Prayer" Question:* "What is your normative model of development?"
          *   *Prep:* Need to distinguish between *explaining* inequality and *prescribing* growth.

  6.  **Refining Vocabulary:**
