answer: |-
  Here is a complete plan for your 50-minute recitation, designed to maximize engagement while respecting your constraints.

  ### 1. The Activity: "The Allais Lottery"

  **Materials:**
  *   **Slips of paper:** Two different colors (e.g., pink for Problem 1, blue for Problem 2).
  *   **Collection box:** A backpack or hat.
  *   **Projector:** For displaying a live Random Number Generator (use `random.org` integer generator).
  *   **Whiteboard:** For tallying and algebra.
  *   **Prize:** The $20 chocolate bag + 1 Extra Credit point slip.
  *   **Dice (Optional):** Two 10-sided dice (d10) as a backup if tech fails (one for tens, one for ones).

  **The Setup (Stakes & Anonymity):**
  *   **Stakes:** Tell them immediately: "At the end of class, I will draw one name from this box. That person's choices will be played for real using this projector. If their lottery wins, they get the chocolate and the EC point. If not, no one does."
  *   **Anonymity:** Students write their choices (A/B and C/D) on the slips without names. This prevents peer pressure and anchoring. You tally the results on the board publicly.
  *   **Resolution:** Use the projector RNG (1–100) to resolve the lottery for the selected student. This is transparent and faster than physical draws.

  **The Procedure:**
  1.  **Distribute Slips:** Hand out one pink and one blue slip to each student.
  2.  **Problem 1 (Pink):** Project the standard Allais Pair (1A vs 1B). Give them 2 minutes to choose. Collect slips.
  3.  **Problem 2 (Blue):** Project the standard Allais Pair (2C vs 2D). Give them 2 minutes to choose. Collect slips.
  4.  **Tally:** Count the combinations (A/C, A/D, B/C, B/D) on the board live.
  5.  **The Twist (Leaky Variant):** Repeat the process with the "Leaky" Problem 1 (A* vs B) on a new slip (yellow). Compare tallies.
  6.  **Payoff:** Draw one student's ID from a separate roster (not the choice slips). Resolve their specific choices using the RNG. Award prize.

  ### 2. Timeline (50 Minutes)

  *   **00:00 – 05:00:** **Intro & Stakes.** Explain the rules, the prize, and the "one player" mechanism. Emphasize that while only one plays, the *group* data is what matters for the lesson.
  *   **05:00 – 15:00:** **Standard Allais Choice.** Project Problem 1 (A vs B) and Problem 2 (C vs D). Collect slips. Tally results on the board.
      *   *Expected:* High frequency of A/D combination.
  *   **15:00 – 25:00:** **The Leaky Variant.** Project Problem 1* (A* vs B). Collect slips. Tally results.
      *   *Expected:* Shift toward B. Fewer people will pick A* because it looks obviously worse.
  *   **25:00 – 35:00:** **The Contradiction (Board Work).** Pick a volunteer who chose A and D (the paradoxical pair). Walk through the math on the board to show why those two choices cannot coexist under Expected Utility Theory.
  *   **35:00 – 45:00:** **Independence & Money Pump.** Explain the Independence Axiom. Discuss why the "Money Pump" argument matters (dynamic inconsistency).
  *   **45:00 – 50:00:** **Resolution.** Draw the winning student. Roll the RNG based on their choices. Distribute chocolate/EC. Dismiss.

  ### 3. Debrief Strategy

  **Mapping Choices to Independence:**
  Do not start with the axiom. Start with their votes.
  1.  **Highlight the A/D Group:** "Most of you chose A (sure thing) and D (risk). Let's see why that's a problem."
  2.  **The Common Consequence Trick:** On the whiteboard, draw the probability trees.
      *   Show that **A** is effectively **C** plus an 89% chance of $1M.
      *   Show that **B** is effectively **D** plus an 89% chance of $1M.
      *   *Script:* "If you prefer A over B, you are saying you prefer the 'Sure $1M' branch over the 'Risky' branch. But in Problem 2, you chose D over C, which means you prefer the 'Risky' branch over the 'Sure $1M' branch. You flipped your preference just because I added an 89% chance of $1M to both options."
  3.  **The Independence Axiom:** Name it now. "Independence says your preference between two lotteries shouldn't change if you mix them both with a third identical lottery. You just violated that."

  **The Money Pump Question:**
  *   **Your Idea:** Letting people trade tickets after choosing.
  *   **Verdict:** **Do not do this.**
  *   **Why:** A true money pump requires *dynamic inconsistency* (changing your mind over time) or a cycle of preferences (A > B > C > A). In a static classroom trade, you are testing the **Endowment Effect** (valuing what you hold more than what you don't), not Independence. If a student refuses to trade, you don't know if it's because their preferences are consistent or because they hate swapping once they hold the paper.
  *   **Alternative:** Use the 10 minutes to sketch the *logic* of the pump. "If you hold these preferences, I can offer you a series of swaps where you pay me 1 cent each time to switch back and forth, ending up with less money than you started. You aren't just irrational; you're exploitable." This hits harder for Econ majors than a confused trading game.

  ### 4. Verdict on the Leaky Variant

  **The Analysis:**
  Your intuition is correct; your professor's claim is problematic for a teaching session on Independence.
  *   **Standard Allais (A vs B):** A ($1M sure) vs B (10% $5M, 89% $1M, 1% $0).
      *   A does *not* dominate B (B has higher EV, A has no risk of 0).
      *   Choosing A is defensible via risk aversion or the "Certainty Effect."
  *   **Leaky Variant (A* vs B):** A* (99% $1M, 1% $0) vs B (10% $5M, 89% $1M, 1% $0).
      *   Compare cumulative probabilities:
          *   Chance of ≥ $1M: A* (99%) vs B (89% + 10% = 99%). **Equal.**
          *   Chance of ≥ $5M: A* (0%) vs B (10%). **B is better.**
      *   **Result:** B **First-Order Stochastically Dominates** A*.
      *   Any rational agent who prefers more money to less *must* choose B.
      *   If a student chooses A*, they are violating **Dominance**, not just Independence.

  **Should you include it?**
  **Yes, but as a trap.**
  Use it to show the difference between a "soft" violation (Independence) and a "hard" violation (Dominance).
  *   *Script:* "In the first round, choosing A was reasonable (risk aversion). In this round, choosing A* is mathematically indefensible. Notice how many fewer of you picked A*? That shows you understand dominance. But the fact that you picked A in round 1 shows you violate Independence. The paradox isn't that you're bad at math; it's that certainty feels different than 99%."

  **Where:** Run it immediately after the Standard Allais (Minute 15). It reinforces the validity of the first paradox by showing students *can* spot dominated options when the certainty effect is removed.

  ### 5. Predictable Failures & Limitations

  1.  **"It's not real money."**
      *   *Fix:* Acknowledge it. "You're right, $1M isn't real. But the EC point is real currency for your GPA, and the chocolate is real sugar. Assume your utility for money is monotonic. If you wouldn't violate independence for $1, you shouldn't for $1M."
  2.  **The "Consistent" Minority.**
      *   *Fix:* Some students will pick A/C (risk averse) or B/D (risk neutral). Don't ignore them. "These students are rational according to Expected Utility. They are the control group. The paradox is specifically about the A/D group."
  3.  **Anchoring/Loud Voices.**
      *   *Fix:* Enforce the secret ballot strictly. "No talking until slips are in the box."
  4.  **Tech Failure.**
      *   *Fix:* Have two 10-sided dice ready. Roll one for tens, one for ones.
  5.  **What the activity can't do:**
      *   It cannot prove *why* people violate independence (Prospect Theory vs. Regret Theory). It only proves *that* they do. Save the "why" for lecture.
      *   It cannot resolve the normative debate (should we fix the theory or fix the humans?). End with the question: "Is Expected Utility a model of how we *should* choose, or how we *do* choose?"

  ### Bottom Line on Leaky Variant

  The leaky variant introduces a First-Order Stochastic Dominance violation that conflates the Independence axiom with basic rationality constraints. It makes the violation "too easy" to dismiss as error rather than a structural preference anomaly.

