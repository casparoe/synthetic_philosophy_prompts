answer: |-
  Here is a translation of the standard philosophical account of consent into the vocabulary of craft, followed by an analysis of where your toolkit aligns with, diverges from, or exceeds the philosophical framework.

  ### I. The Three Conditions of Valid Consent

  In philosophy, valid consent requires competence, information, and voluntariness. In your terms, these are questions of **Agency**, **Context**, and **Stakes**.

  **1. Competence $\rightarrow$ The Capacity for Agency**
  Philosophers ask if the agent has the rational capacity to understand the transaction. You ask if the character has the *interiority* to author their own choice.
  *   **The Craft Translation:** Is the POV character's consciousness clear enough to drive the scene? If a character is intoxicated, grieving (the funeral confession), or developmentally immature (the suggestible heir), their interiority is compromised. The narration might show their thoughts as fragmented, reactive, or porous to outside influence. If the choice feels like it was made by the plot or the antagonist rather than emerging from the character's established psychology, the "competence condition" has failed. The "yes" is not theirs; it is a ventriloquized line.

  **2. Information $\rightarrow$ The Knowledge Gap**
  Philosophers require that the agent knows what they are agreeing to. You manage this through **dramatic irony** and **expository depth**.
  *   **The Craft Translation:** What is the delta between what the character knows and what is true? In the marriage-under-alias scenario, if the character believes they are marrying Person A but are legally marrying Person B, there is a fundamental gap in the scene's context. Valid consent requires the character to be reading the same script as the other party. If you withhold key information from the character (but perhaps share it with the reader), you are writing a scene where the character is consenting to a fiction, not the reality.

  **3. Coercion $\rightarrow$ The Architecture of Stakes**
  Philosophers require that the choice be free from undue pressure. You analyze this through **stakes** and **plot pressure**.
  *   **The Craft Translation:** Does the character have a viable exit from the scene? If the cost of saying "no" is catastrophic (death, ruin, abandonment), the "yes" functions as a survival mechanism, not a desire. In fiction, we feel this as *authored pressure*. If the stakes feel organic to the world, the choice is hard but valid. If the stakes feel manipulated by an antagonist to force a specific outcome, the choice reads as coerced. The "yes" becomes a surrender, not an agreement.

  ---

  ### II. The Three Distinctions

  Here is how to handle the specific edge cases you identified, translating philosophical nuance into narrative mechanics.

  **1. Deception: The Nature of the Act vs. The Circumstances**
  *   **Philosophical Distinction:** *Fraud in the factum* (lie about what is happening) voids consent. *Fraud in the inducement* (lie about why it's good) flaws consent but doesn't necessarily void it.
  *   **Novelist's Translation:** **The Scene Contract.**
      *   **Nature of the Act:** This is a mismatch in the *genre of the scene*. If a character thinks they are signing a guest book (a moment of respect) but are signing a marriage license (a legal binding), they are not in the same scene as the person holding the pen. They are playing different games. In your manuscript, this reads as a discontinuity. The character's interiority is focused on *mourning*, while the legal reality is *union*. This makes the consent null; the transaction didn't happen as the character understood it.
      *   **Circumstances:** This is a mismatch in *motivation*. If the character knows they are marrying, but believes the groom is wealthy (when he is broke), they are in the same scene (marriage) with false intel on the stakes. The consent is "theirs," but it is tragic or misguided. The plot point stands, but the moral weight shifts.

  **2. Offers vs. Threats (and Created Desperation)**
  *   **Philosophical Distinction:** An offer improves your baseline; a threat worsens it. The hard case is when the proposer created the desperation (e.g., "I burned your barn; now buy my water").
  *   **Novelist's Translation:** **Who Wrote the Predicament?**
      *   **The Baseline:** In fiction, the "baseline" is the status quo at the start of the chapter. An offer opens a new path forward that didn't exist (widening options). A threat closes an existing path (narrowing options).
      *   **Created Desperation:** This is a question of **backstory and antagonist agency**. If the person making the "offer" also wrote the backstory that made the offer necessary, the distinction collapses. In your draft, you must look at the *arc of pressure*. If Character A creates the crisis that forces Character B to accept Character A's help, the "offer" is structurally a threat. It reads as entrapment. The "yes" is technically voluntary (no gun to the head), but narratively, it is the climax of a coercion arc.

  **3. Wrong Act vs. No Consent (Void vs. Voidable)**
  *   **Philosophical Distinction:** Some defects make the act immoral but binding (voidable); others make it nonexistent in the eyes of the law/morality (void).
  *   **Novelist's Translation:** **Plot Validity vs. Moral Truth.**
      *   **No Consent (Void):** The event did not happen in the moral reality of the book, even if it happened physically. If a character is unconscious or deceived about the nature of the act, the "relationship" or "contract" is a phantom. You cannot write the aftermath as a betrayal of a bond, because the bond was never formed. The scene is a violation, not a transaction.
      *   **Wrong Consent (Voidable):** The event happened, but it is tainted. The inheritance was accepted, the marriage vow spoken. The plot moves forward on the basis of that "yes," but the *theme* is the corruption of that choice. The character is bound by the choice, but the reader knows the choice was compromised. This creates tension between *legalistic plot* (they are married) and *emotional plot* (they are strangers).

  ---

  ### III. The Residue Report

  You asked what remains when we try to map philosophy onto fiction. Here is the audit of your toolkit.

  **1. What Has No Expression in the Novelist's Toolkit?**
  *   **The Binary Switch:** Philosophy often needs a verdict (Valid/Invalid) to assign liability. Fiction resists the binary. Your toolkit allows for *ambiguity* that philosophy finds frustrating. You can write a scene where it is genuinely unclear if the consent was valid, and leave it there. Philosophy views this as a problem to be solved; you view it as a texture to be explored.
  *   **The Baseline Problem:** Philosophy struggles to define the "normal state" against which threats are measured. In fiction, *you* are the god of the baseline. However, your toolkit lacks a specific term for "structural coercion" that isn't personified by a villain. If society or poverty forces the choice, philosophy calls this "background conditions." In fiction, this is often just "setting." You may need to be careful not to let "the way things are" absolve characters of coercion that philosophy would flag as systemic.

  **2. Are Your Tools Doing the Same Work?**
  *   **Dramatic Irony vs. Information Condition:** These are nearly identical. When you use dramatic irony to show the reader knows the alias but the character does not, you are dramatizing the failure of the information condition. Your tool is more powerful because it generates *empathy* (for the duped) or *dread* (for the outcome), whereas philosophy generates *judgment*.
  *   **Interiority vs. Competence:** Your tool is superior. Philosophy relies on external markers of competence (age, sobriety tests). Interiority allows you to show a character who is legally competent but psychologically porous (the suggestible heir). You can show the *moment* the will is bypassed, which philosophy often has to infer.
  *   **Agency/Authorship vs. Voluntariness:** This is where the work diverges. Philosophy asks, "Was there a threat?" You ask, "Does this choice feel true to the character?" A character might consent without a threat (philosophically valid) but in a way that feels "authored by the plot" rather than the character (narratively false). Your standard for "voluntariness" is higher; it requires *character consistency*, not just the absence of a gun.

  **3. Is the Toolkit Missing Something, or is Philosophy Less Clear?**
  *   **The Verdict:** The philosophical framework is less clear than it looks, and your toolkit captures the reality of human choice better.
  *   **The Missing Piece:** Philosophy assumes a snapshot in time (the moment of "yes"). Fiction captures the **retroactive re-interpretation** of consent. A character might consent freely in Chapter 4, but by Chapter 20, after trauma or growth, they view that "yes" as a mistake or a violation. Philosophy struggles with consent that changes meaning over time. Your toolkit (memory, unreliable narration, shifting POV) handles this naturally.
  *   **The Clarity Illusion:** Philosophy tries to draw bright lines (Offer vs. Threat) that blur in the lived experience you depict. The "created desperation" case proves this. In a novel, if a character creates the desperation, we judge them as coercive, even if they technically made an "offer." Your reader's moral intuition is more sensitive to the *history of the pressure* than the philosophical baseline.

  **Summary for the Desk:**
  When you write these scenes, trust your sense of **authorship**. If the "yes" feels like it was written by the antagonist or the plot mechanics rather than the character's interior logic, the consent is philosophically suspect, regardless of the legalistic details. Your job is not to adjudicate the validity of the consent for a court, but to render the *experience* of the consent for the reader. If the experience feels like surrender, it is coercion. If it feels like a misunderstanding of the script, it is fraud. If it feels like a choice made in the dark, it is yours to illuminate or leave shadowed.
