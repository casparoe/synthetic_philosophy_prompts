prompt: |-
  I write literary fiction, and my working vocabulary is a novelist's: point of view, what a character knows versus what the reader knows, interiority, stakes, whether a choice a character makes reads as authored by that character or by whoever set the scene around her. I keep having to make calls about consent on the page — a marriage proposal made under an alias, a confession of love extracted at a funeral, an inheritance accepted by a character I've written as suggestible — and I'd like to understand what the philosophers actually say, in my terms rather than theirs. Please restate the standard philosophical account of what makes consent valid — the competence condition, the requirement of sufficient information, and the coercion condition — in the vocabulary I use, as faithfully as you can. Along the way I'd like you to handle three distinctions that I suspect matter: the distinction between deception about something that bypasses the will (a lie about the nature of the act) and mere non-disclosure or deception about circumstances that only make the act more attractive; the difference between an offer that widens a character's options and a threat that narrows them, including the hard cases where the person doing the offering created the desperation in the first place; and the difference between a defect in consent that makes the act wrong and a defect that makes it not consent at all. Then give me the residue report: which of these distinctions have no expression in a novelist's toolkit, whether the ones I do have (dramatic irony, unreliable narration, the sense that a character's "yes" is or is not hers) are doing the same work or different work, and whether the residue suggests my toolkit is missing something the philosophers see or that the philosophical framework is less clear than it looks. Please write the answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Literary fiction novelist.
      *   **Vocabulary:** Novelist's toolkit (POV, interiority, stakes, character agency/authorship, dramatic irony, etc.).
      *   **Task:** Restate the standard philosophical account of valid consent (competence, information, coercion) *in the novelist's vocabulary*.
      *   **Specific Distinctions to Handle:**
          1.  Deception about the nature of the act (fraud in the factum) vs. deception about circumstances/inducements (fraud in the inducement).
          2.  Offers (widening options) vs. Threats (narrowing options), including "created desperation" cases.
          3.  Defect making the act *wrong* vs. defect making it *not consent at all* (void vs. voidable).
      *   **Residue Report:** Analyze what doesn't translate, compare novelist tools (dramatic irony, etc.) to philosophical concepts, and evaluate if the novelist's toolkit is missing something or if philosophy is less clear than it appears.
      *   **Language:** American English.

  2.  **Deconstruct the Philosophical Concepts & Translate to Novelist Terms:**

      *   *Competence:* Philosophically, this is capacity (age, sobriety, mental state).
          *   *Novelist Translation:* Interiority and Agency. Can the character *author* their own choice? Is the POV showing a mind capable of processing the scene, or is the consciousness fogged, immature, or fractured?
      *   *Information (Disclosure):* Philosophically, knowing what you are agreeing to.
          *   *Novelist Translation:* Knowledge gaps between Character and Reader (Dramatic Irony) or Character and Other Character. What is in the scene's "margins" that the character doesn't see?
      *   *Coercion (Voluntariness):* Philosophically, Freedom from undue pressure.
          *   *Novelist Translation:* Stakes and Pressure. Does the choice feel forced by the plot mechanics or the antagonist's leverage? Is the "yes" authentic to the character's desire, or a survival tactic?

  3.  **Address the Three Specific Distinctions:**

      *   *Distinction 1: Nature of Act vs. Circumstances.*
          *   *Phil:* Fraud in the factum (no consent) vs. Fraud in the inducement (flawed consent).
          *   *Novelist:* The "Script" of the Scene. If the character thinks they are signing a guest book but it's a marriage license, they aren't playing the same scene. If they think the groom is rich but he's broke, they are playing the same scene (marriage) but with different motivation.
          *   *Translation:* "What scene are they in?" vs. "Why are they in it?"

      *   *Distinction 2: Offers vs. Threats (Created Desperation).*
          *   *Phil:* Baseline problem. Is the pre-offer state normal or manipulated?
          *   *Novelist:* Plot Architecture and Backstory. Who set the stakes? If the antagonist burned the house to sell the water, the "offer" is a threat in disguise.
          *   *Translation:* "Who wrote the predicament?"

      *   *Distinction 3: Wrong Act vs. No Consent.*
          *   *Phil:* Void (null) vs. Voidable (valid until challenged).
          *   *Novelist:* Narrative Truth vs. Moral Judgment. Does the "yes" count as a plot point? If it's "no consent," the scene didn't happen as written (it's a violation). If it's "flawed consent," the scene happened, but it's tragic/unjust.
          *   *Translation:* "Did the transaction occur?" vs. "Was the transaction just?"

  4.  **Drafting the "Residue Report":**

      *   *What doesn't translate?* Philosophy cares about binary states (valid/invalid) for legal/moral liability. Fiction cares about the *spectrum* of ambiguity. Philosophy wants to settle the status; fiction wants to linger in the uncertainty.
      *   *Novelist Tools vs. Philosophical Work:*
          *   *Dramatic Irony:* Handles the Information condition well (Reader knows more than Character).
          *   *Interiority:* Handles Competence well (We see the fog/clarity).
          *   *Agency/Authorship:* Handles Coercion well (Does the choice feel earned?).
      *   *Missing vs. Unclear:*
          *   Philosophy assumes a baseline of rationality that fiction often challenges (trauma, love, obsession).
          *   Fiction captures the *aftermath* of consent (regret, reinterpretation) better than philosophy's snapshot view.
          *   Philosophy's "baseline" is hard to define in fiction where the author controls the universe.

  5.  **Refining the Tone:**
      *   Must sound respectful of the user's expertise.
