      *   *Check:* Is the tone right? *Adjustment:* Ensure I'm not lecturing but collaborating. Use "you" and "your characters."

  8.  **Final Polish:** Check American spelling (behavior, color, etc.) and ensure flow. (Proceed to generate output based on this thought process.)

