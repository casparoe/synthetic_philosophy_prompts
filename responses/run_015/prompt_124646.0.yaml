answer: |-
  ### The Jaspers Framework Translated to Fishing Management

  Here is Karl Jaspers' argument from *The Question of German Guilt* (1947), restated using your commercial fishing liability vocabulary. Jaspers argues that "guilt" isn't a single bucket; it's four distinct ledgers. Only some of them transfer when ownership changes.

  **1. Criminal Guilt (Individual Violation Ledger)**
  *   **Jaspers:** Only individuals who broke specific laws are criminally guilty. A collective cannot be criminally guilty. This does not transfer to successors.
  *   **Fishing Translation:** This is a specific **permit violation** or **illegal catch citation**. If a captain falsified logs or poached in the 90s, only that captain owes the fine or jail time. When a new company buys the trawler, they do not inherit the previous owner's criminal record. The liability dies with the actor. You cannot assess a penalty against a new permit holder for a crime they didn't commit.

  **2. Political Guilt (Fleet-Wide Liability)**
  *   **Jaspers:** All citizens are politically guilty for the actions of their state. This liability survives regime change. The successor community must pay reparations or accept restrictions.
  *   **Fishing Translation:** This is **regulatory cleanup** and **inherited quota reduction**. Even if you bought your permit yesterday, you belong to the "fleet class" that depleted the stock. The regulatory body assesses a **consolidation liability** against the entire sector to fund stock recovery. You inherit the obligation to restore the resource because you hold the privilege (permit) to use it. The debt sticks to the license, not the person.

  **3. Moral Guilt (Personal Compliance Ethic)**
  *   **Jaspers:** Every individual is responsible for their own actions and silence. This requires introspection. It cannot be collectively assigned, but a culture of silence can persist.
  *   **Fishing Translation:** This is the **captain's logbook integrity**. Did you look the other way when bycatch was high? Did you report violations you saw? This stays with the individual conscience. However, a "culture of non-compliance" can become embedded in the fleet's operating norms. A new owner might inherit a crew culture that treats rules as suggestions, but the moral responsibility to correct that culture falls on the individuals within it.

  **4. Metaphysical Guilt (Existential Stakeholder Solidarity)**
  *   **Jaspers:** There is a solidarity among all humans. If you survive while others suffer, and you did nothing to prevent it, you share a guilt before God/Existence. It is universal.
  *   **Fishing Translation:** This is the **baseline stewardship obligation**. Simply by participating in the extractive economy, you share responsibility for the health of the ocean ecosystem. Even if you follow every rule, if the stock collapses, you share in the failure of the human relationship with the sea. This isn't a fine you pay; it's a condition of your existence as a harvester.

  ***

  ### Residue Report

  **Clean Mappings**
  *   **Political Guilt ↔ Regulatory Cleanup/Inherited Quotas:** This is the strongest fit. Jaspers' idea that citizens inherit liability for the state's actions maps perfectly to permit holders inheriting liability for the fleet's historical overfishing. Both are obligations attached to status (citizenship/permit ownership) rather than individual action.
  *   **Criminal Guilt ↔ Individual Violations:** Both frameworks agree strictly that liability for specific illegal acts does not transfer to successors.

  **Forced Distortions**
  *   **Moral Guilt ↔ Compliance Culture:** Jaspers views moral guilt as deeply internal and spiritual. Translating this to "fleet culture" or "logbook integrity" externalizes it into a management issue. In fishing, we measure compliance; Jaspers measures conscience.
  *   **Metaphysical Guilt ↔ Ecosystem Solidarity:** Jaspers' concept is theological/existential ("before God"). Mapping this to "stewardship" makes it sound like a best practice rather than an ontological burden. It turns a spiritual condition into an operational risk.

  **Untranslatable Claims**
  *   **The Source of Authority:** In your framework, obligations come from a regulatory body (NMFS, Councils). In Jaspers' framework, Moral and Metaphysical guilt come from internal conscience or divine judgment. There is no "permit" for metaphysical guilt.
  *   **Silence as Action:** Jaspers places heavy weight on "silence" during atrocities as a moral failure. In fishing management, silence is only relevant if reporting is mandated. The moral weight of *not speaking up* outside of regulatory requirements has no counterpart in your liability framework.

  **Residue Interpretation**
  The leftover pieces do not mean Jaspers was vague; they mean your vocabulary is **transactional**, while his is **existential**. Your framework is designed to allocate *liability* (who pays, who gets fined), which is why Political and Criminal guilt map well. It fails to capture Moral and Metaphysical guilt because those are not about debt or permits; they are about the human condition. The residue indicates your vocabulary is missing the dimension of *responsibility without liability*. In fishing, if you aren't fined, you're clear. In Jaspers' view, you can be legally clear but still metaphysically guilty. The vocabulary isn't wrong for its purpose (management), but it is insufficient for debating ethics.

