answer: |-
  The financial aid office's practices reveal a specific, hybrid normative framework that is often conflated with prioritarianism but is structurally distinct. To understand the inconsistency you have identified, we must disentangle the office's rhetoric from the logical commitments of their policy.

  ### 1. The Implicit Theory: Threshold Sufficientarianism
  The combination of practices presupposes **Threshold Sufficientarianism** (or a Discontinuous Prioritarianism), not Pure Prioritarianism.

  *   **Pure Prioritarianism** holds that we should maximize the sum of welfare, where gains to individuals are weighted by a concave function of their absolute welfare level. Crucially, this function is continuous. A person just above a poverty line still has higher marginal moral value than a person who is wealthy. Therefore, a pure prioritarian calculus would almost always support a sliding scale: taking a small amount from the wealthy to help the "near-poor" generates a net moral gain because the near-poor's utility weight is still higher than the wealthy's.
  *   **The Office's View:** By instituting a sharp cutoff where those just above receive *nothing*, the office implies that moral priority drops discontinuously to zero (or a baseline level) once a threshold of sufficiency is crossed.
      *   **Why the Very Poor get aid:** They are below the threshold; their claims have lexical or overwhelming priority.
      *   **Why the Near-Poor get nothing:** They are above the threshold; their claims no longer carry "priority weight."
      *   **Why Merit Aid is protected (regarding the Near-Poor):** Taking from the wealthy (merit scholars) to give to the near-poor is treated as a net moral loss because the near-poor's gain is weighted at the "non-priority" rate, which is insufficient to offset the harm to the scholars.
      *   **Why Merit Aid is reducible (regarding the Very Poor):** Taking from the wealthy to give to the very poor is a net moral gain because the very poor's gain is weighted at the "high priority" rate, which outweighs the harm to the scholars.

  ### 2. The "Leveling Down" Confusion
  The office's claim that funding the sliding scale constitutes "impermissible leveling down" is technically philosophically confused, but it reveals their sufficientarian commitment.

  *   **Technical Definition:** The "Leveling Down Objection" applies to Egalitarianism. It argues that if equality is intrinsically valuable, a theory must admit that making the rich poorer (without helping the poor) is good in one respect. Prioritarianism avoids this by focusing on absolute levels.
  *   **Office's Usage:** The office uses "leveling down" colloquially to mean "harming someone without sufficient moral justification." By claiming that helping the near-poor does not justify harming the merit scholars, they are asserting that **above the threshold, distribution is morally inert.**
  *   **Does it require accepting the Leveling Down Objection?** No. In fact, the policy *relies* on rejecting the idea that equality (or priority) matters above the threshold. If they accepted the leveling-down objection in the technical sense, they would worry about inequality between the merit scholars and the near-poor. They do not. They worry only about the absolute status of the very poor.

  ### 3. Strict Presuppositions vs. Good Fits
  To reconstruct the view rigorously, we must distinguish what the policy *requires* from what merely *aligns* with it.

  **Strict Presuppositions:**
  1.  **Existence of a Normative Threshold:** There is a specific welfare/resource level $T$ that distinguishes "urgent need" from "non-urgent need."
  2.  **Discontinuous Weighting:** The moral weight function $W(w)$ is discontinuous at $T$. $W(w)$ is high for $w < T$ and low (or constant) for $w \geq T$.
  3.  **Asymmetric Trade-offs:** Losses to those above $T$ can only be justified by gains to those below $T$. Losses to those above $T$ cannot be justified by gains to others above $T$.

  **Merely Compatible (Not Required):**
  1.  **The Specific Income Cutoff:** The theory requires *a* threshold, but not necessarily the specific dollar amount currently chosen.
  2.  **Merit Scholarship Structure:** The theory requires that resources be available above the threshold to tax, but it does not strictly require "merit" as the justification for holding those resources. It could be endowment income or tuition revenue.
  3.  **"Leveling Down" Rhetoric:** As noted, they could justify this using "insufficient marginal utility" rather than "leveling down."

  ### 4. Underdetermination and Rival Theories
  Is this view underdetermined? Yes. While Threshold Sufficientarianism is the best fit, other theories could reconstruct the practice:

  *   **Lexical Rawlsianism:** One could argue the university follows a Difference Principle with a floor. Maximizing the position of the worst off is the only priority. Once the worst off are brought to a decent minimum, secondary principles (like rewarding merit) take over. This fits the data but implies a stricter constraint on the "very poor" grants (they must be maximized, not just prioritized).
  *   **Administrative Cost-Benefit Analysis:** A non-moral explanation is that a sliding scale is too bureaucratically expensive. However, the prompt implies a *principled* rejection ("impermissible"), so we must treat it as normative.
  *   **Hybrid Libertarian-Prioritarian View:** Below the threshold, prioritarianism rules. Above the threshold, libertarian entitlements (merit awards) rule. This explains why merit awards can be touched for the poor (emergency override) but not for the near-poor (no emergency).

  **Does it smuggle in Egalitarianism?**
  No. Pure prioritarianism was designed to avoid concerns about relative standing. This policy goes further: it ignores relative standing entirely for anyone above the threshold. It does not care if the merit scholar has \$100k and the near-poor student has \$40k, provided \$40k is "enough." It only cares if the very poor student has \$10k. Thus, it avoids the egalitarian concern about the *gap* between rich and near-poor.

  **Does it depend on a Pareto distinction?**
  No. This is a crucial logical point.
  *   **Policy A (Help Very Poor):** Merit scholars lose, Very Poor gain. (Non-Pareto).
  *   **Policy B (Help Near-Poor):** Merit scholars lose, Near-Poor gain. (Non-Pareto).
  Since both policies involve a loss to the merit scholars, the distinction cannot be Pareto-compatible vs. non-Pareto-compatible. The distinction rests entirely on the **moral status of the beneficiary**, not the structural efficiency of the transfer.

  ### 5. The Straightforward Prioritarian Alternative
  If you replaced the implicit Threshold Sufficientarian framework with a **Straightforward Prioritarian Calculus** (weighting only absolute welfare levels with a continuous concave function), the aid policy would change fundamentally:

  1.  **No Sharp Cutoff:** The income threshold would become a sliding scale. As family income rises, grant aid would decrease gradually rather than hitting a "cliff."
  2.  **Support for the Near-Poor:** Students just above the current cutoff would receive *some* aid. Even though their need is less urgent than the very poor, their marginal utility of money is still higher than that of the high-achieving merit scholars (who are presumably wealthy or well-compensated).
  3.  **Reduced Merit Aid:** To fund this continuous scale, merit scholarships would be reduced across the board, not just to fund the very poor. The prioritarian calculus dictates that a dollar gives more moral value to a near-poor student than to a wealthy merit scholar, even if the near-poor student is "sufficiently" well off.
  4.  **Optimization:** The distribution would settle where the weighted marginal utility of the last dollar granted to a poor student equals the weighted marginal utility of the last dollar retained by a merit scholar.

  ### Summary
  The university's policy is not inconsistent if viewed through **Threshold Sufficientarianism**. It is only inconsistent if viewed through **Pure Prioritarianism**. The office claims to prioritize the worst off (Prioritarian language) but acts like Sufficientarians (Threshold behavior). They reject the sliding scale not because it harms the rich (which they allow for the very poor), but because they believe those just above the threshold have no moral claim on the rich's resources. This view does not accept the leveling-down objection; rather, it renders the objection moot for those above the sufficiency line by denying that redistribution among them has moral value.
