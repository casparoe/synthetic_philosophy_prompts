answer: |-
  **Question 4**

  Define a dynamical system as **deterministic** if any two possible worlds that agree on the state at time $t_0$ agree at all times $t$. Define **predictability** as the ability of an agent to announce a future state at horizon $T$ within error $\delta$, given knowledge that the initial state lies within a ball of radius $\epsilon$. Consider **The Archivist**: an agent with unlimited computing power and exact knowledge of the laws, but who knows only that the true initial state lies within an $\epsilon$-ball.

  (a) In a system with a positive Lyapunov exponent (where nearby states separate exponentially), explain why the Archivist fails for large $T$, and why this failure does not refute determinism. Specifically, distinguish between the determinism of the map and the size of the image of the initial ball.

  (b) The **Shadowing Lemma** states that for every approximate trajectory, there exists *some* exact true trajectory that stays close to it. Explain why this does not save the Archivist's prediction. Focus on the logical quantifier involved.

  (c) Suppose the actual initial condition is a real number that no algorithm can compute (a non-computable real). Does determinism fail? Define **Simulable Determinism** as the claim that the laws plus a finite specification of the state fix a computable trajectory. Argue whether physics should care if Simulable Determinism is false, considering the cardinality of computable versus non-computable reals.

  ***

  **Model Answer**

  Chaos destroys predictability without threatening determinism, but non-computable initial conditions threaten a stronger thesis called Simulable Determinism, which may be more physically relevant. To see this, we must rigorously separate ontic claims about the world from epistemic claims about our access to it. Determinism is a property of the state-transition map: it asserts that the map is a function, sending each input state to a unique output state. Predictability is a property of an agent's relationship to that map. The Archivist fails in chaotic systems because a positive Lyapunov exponent ensures that the initial $\epsilon$-ball of uncertainty expands exponentially over time. Mathematically, the error grows roughly as $\epsilon e^{\lambda T}$. By horizon $T$, the image of that ball covers a region larger than the required accuracy $\delta$. However, this is not indeterminism. Determinism requires only that the image of the ball is well-defined, not that the image is small. The map sends the set of possible initial states to a specific, unique set of future states. The Archivist's inability to pinpoint *which* state in that future set is actual is a limitation of her knowledge, not the world's dynamics. The world evolves singly; she just cannot narrow down which single path it is taking.

  The Shadowing Lemma offers a tempting rescue but fails logically. The Lemma guarantees that for the Archivist's approximate trajectory, there exists *some* exact true trajectory that remains close to it forever. The trap lies in the existential quantifier versus the specific actual. The Archivist needs to predict the *actual* trajectory determined by the true initial condition. Shadowing assures her that her guess matches *a* possible world consistent with the laws, but not necessarily *the* actual world. Since the $\epsilon$-ball contains infinitely many distinct true trajectories that diverge from each other, knowing one shadows her guess does not identify which one is actual. Thus, shadowing preserves the coherence of the approximation, ensuring it isn't nonsense, but it does not restore the accuracy of the prediction regarding the actual state. It confirms consistency, not truth.

  When the initial condition is a non-computable real number, metaphysical determinism remains intact because the state-transition map is still single-valued. However, Simulable Determinism fails. This thesis requires that a finite specification (an algorithm) plus laws yields a computable trajectory. If the input state cannot be finitely specified, no algorithm can generate the trajectory, even if the laws are computable. Physics should care about this failure because physical prediction inherently requires finite specification. We cannot measure or write down non-computable numbers; if reality relies on them, the universe is deterministic but forever opaque to computational modeling. This is not merely a technicality but a structural limit on physical knowledge.

  Finally, the distinction matters because computable reals are countable, while non-computable reals have measure one. If we assume a uniform measure over possible initial conditions, almost all states are non-computable. Dismissing this as a "freak exception" is mathematically indefensible. Therefore, while chaos only limits epistemic access within a computable framework, non-computability limits the very possibility of a simulable universe. This suggests that Simulable Determinism is a more physically relevant constraint than classical determinism. If physics is about what can be modeled and predicted, a deterministic universe that cannot be simulated is indistinguishable from one that is not deterministic in practice. Thus, the failure of Simulable Determinism is a deeper threat to the scientific project than chaos, as it undermines the link between mathematical law and physical specification.

  ***

  **Marking Scheme (20 Marks)**

  **1. Ontic vs. Epistemic Distinction (4 marks)**
  *   **Must Hit:** Clearly defines determinism as a property of the map (unique evolution) and predictability as epistemic (agent knowledge).
  *   **Blow it:** Conflates unpredictability with indeterminism or claims chaos makes the future "open."

  **2. Archivist's Failure Mechanism (4 marks)**
  *   **Must Hit:** Explains exponential expansion of the $\epsilon$-ball (Lyapunov) makes the image set too large for $\delta$, while noting the image set itself is determinately fixed.
  *   **Blow it:** Says the Archivist fails because the laws break down or the map becomes multi-valued.

  **3. Shadowing Lemma Trap (4 marks)**
  *   **Must Hit:** Identifies that shadowing is existential ("some trajectory") while prediction requires specificity ("the actual trajectory").
  *   **Blow it:** Claims shadowing solves the problem because the approximate path is "close enough" to a real one.

  **4. Simulable Determinism & Computability (4 marks)**
  *   **Must Hit:** Defines Simulable Determinism (laws + finite spec $\rightarrow$ computable trajectory) and notes non-computable inputs break this but not classical determinism.
  *   **Blow it:** Claims non-computable numbers make the system indeterministic or ignores the finite specification requirement.

  **5. Measure Theory & Physics Relevance (4 marks)**
  *   **Must Hit:** Notes computable reals are countable (measure zero) vs. non-computable (measure one) and argues why physics should care (modeling limits).
  *   **Blow it:** Dismisses non-computable reals as rare exceptions or fails to take a position on physics relevance.
