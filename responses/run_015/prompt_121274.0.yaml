      *   **Constraint:** Do not argue the science (stipulate the applicants' claims about the pigs).

  2.  **Deconstruct the Precedents (The "Track Record"):**
      *   *Mice/Zebrafish (brief procedures):* Lowest tier. (Small brains, low cognitive capacity, common lab animals).
      *   *Minipigs = Full-size pigs:* Same protection despite 1/3 size/brain. (Suggests *Taxon* or *Species* matters more than absolute brain size/mass).
      *   *Chimpanzees:* Off the table (Ban). (High cognitive capacity, great ape status, legal/policy restrictions).
      *   *Octopuses/Edible Crabs:* Protected tier (after sentience review). (Invertebrates, but complex nervous systems/behaviour). *Note:* User notes crab nervous system is tiny ("balance on a pinhead"). This challenges *Absolute Brain Mass*.
      *   *Ant Colony (50k):* No extra protection for colony. (Individuals have tiny capacity; collective emergent properties don't count for welfare). Suggests *Individual Organism* is the unit of moral concern, not the superorganism.
      *   *Older Dogs (Cognitive Decline):* Full dog rules applied. Rejected argument for lower tier based on reduced capacity. (Strong evidence for *Taxon/Species* fixed status, regardless of individual capacity variation).
      *   *Human Cortical Organoids:* No welfare protection (tissue governance only). (No body, no sensory input, no behaviour). Suggests *Integrated Organism* + *Capacity for Experience* is required.

  3.  **Analyze the New Proposals:**
      *   **Pig A:** 3x Brain Volume, 3x Forebrain Neurons (same density). Behaviour: Better reversal learning, tolerate delayed reward (higher cognitive capacity).
      *   **Pig B:** 3x Brain Volume, Same Forebrain Neurons (sparse packing, more cerebellum). Behaviour: Indistinguishable from controls.

  4.  **Develop Competing Rules (Hypotheses):**
      *   *Rule 1: Taxonomic Fixed Status.* (Species determines tier).
      *   *Rule 2: Forebrain Neuron Count/Cognitive Capacity.* (Neurological substrate for sentience/intelligence).
      *   *Rule 3: Absolute Brain Mass.* (Physical size of the brain).
      *   *Rule 4: Integrated Organism + Capacity for Experience.* (The "Organoid" vs. "Animal" line).

  5.  **Evaluate Rules against Precedents:**
      *   *Taxonomic Fixed Status:* Fits Minipigs=Full pigs. Fits Old Dogs (decline doesn't lower tier). Fits Octopus/Crab (taxon added to list). *Conflict:* Doesn't explain why Chimps are banned while others aren't (unless taxon includes 'Great Apes' as special). Doesn't explain Ants (taxon is insect, low tier).
      *   *Forebrain Neuron Count:* Fits Chimps (high count). Fits Octopus (high complexity relative to size?). *Conflict:* Minipigs vs Full pigs (different counts, same tier). Old Dogs (lower function/count potentially, same tier). Crabs (tiny count, protected).
      *   *Absolute Brain Mass:* *Conflict:* Minipigs vs Full pigs (different mass, same tier). Crabs (tiny mass, protected).
      *   *Integrated Organism:* Fits Organoids (no protection). Fits Ants (individuals protected, colony not). Fits Pigs.

  6.  **Apply Rules to New Proposals:**
      *   **Pig A (High Capacity):**
          *   Taxon: Standard Pig Tier.
          *   Neuron Count: Higher Tier (maybe Chimp-adjacent?).
          *   Mass: Higher Tier (3x mass).
      *   **Pig B (Normal Capacity, Big Brain):**
