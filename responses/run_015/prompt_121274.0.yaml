  8.  **Formulate the Prediction:**
      *   The committee will likely treat *both* pigs as standard pigs.
      *   Why? Because the *Old Dog* and *Minipig* precedents establish that *species membership* trumps *individual neurological variation* (whether up or down).
      *   The Moral Philosopher's sighs suggest frustration with inconsistency, but the Vets usually drive welfare classification based on species norms.

  9.  **Identify Hidden Assumptions (Flagging):**
      *   "Noticeably better at reversal learning": Assumes this maps to moral status.
      *   "Capacity for experience": Assumes we know what that means (Organoids vs. Crabs).
      *   "Colony... does things no individual ant can do": Assumes emergent properties *could* morally matter (precedent says no).
