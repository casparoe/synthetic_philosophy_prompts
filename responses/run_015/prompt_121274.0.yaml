      *   *Check Pig B.* Big brain, normal behaviour. If "Brain Mass" were the rule, this would be higher tier. If "Taxon" or "Neuron Count/Behaviour", it stays standard. Given Minipigs (small brain) = Pigs (big brain), Mass is likely out. So Pig B stays standard.
      *   *Conclusion:* Both likely stay standard pig tier.
      *   *The "Why":* The committee operates on a *Species-Typical Norm* model, not an *Individual Capacity* model.

  12. **Final Polish:** Ensure British spelling (behaviour, programme, centre, etc.), tone is respectful but analytical, and all constraints of the prompt are met. (Specifically: "flag anywhere you think my description of the cases has smuggled in an assumption").

