  *Wait, one detail check:* "Relatives of known critics were routinely nudged above the threshold." This is key for the "Congruence" argument. If the rule says >0.82, but the Bureau moves the goalposts secretly, Fuller says congruence is broken. Hart says the rule is still the rule, the Bureau just broke it (or used discretion allowed by the system). I need to make sure Thorne acknowledges the discretion was *unreviewable* but argues it was still part of the system's accepted practice.

