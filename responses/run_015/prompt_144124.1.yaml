answer: |-
  Imagine a small hiring board for a high-security logistics firm using two automated screeners to process applicants. The first, "EvoSelect," is a neural net trained via genetic algorithms over millions of simulated hiring cycles, where versions that picked risky employees were deleted and replaced; it has no rules, just weights shaped by survival. The second, "LogicGate," is a symbolic expert system running strict IF-THEN protocols derived from the employee handbook, manipulating tokens like "years_experience" and "clearance_level" without knowing what they mean. They both face a novel candidate: a brilliant coder with a five-year employment gap due to political imprisonment, which technically counts as "time alive" but not "professional tenure." EvoSelect rejects him outright because its evolutionary history penalized gaps as strong predictors of future instability, overfitting to the historical fitness signal that "gaps equal risk" and missing the exception where the gap proves loyalty. LogicGate, conversely, approves him for an immediate senior interview because his raw age data satisfies the syntactic rule "IF age > 30 THEN senior_track," applying a formally correct operation that yields a locally absurd result since the system cannot distinguish between "years lived" and "years worked."

  Here's what each inversion predicts about the failure. The Darwin-style inversion predicts failure at the *statistical tails*: EvoSelect breaks when the input falls outside the distribution of past survivors, because its competence is just fossilized history. The Turing-style inversion predicts failure at the *semantic boundaries*: LogicGate breaks when the symbols stop mapping to reality, because its competence is just syntactic consistency. The structural feature keeping these explanations apart is the *locus of constraint*. For EvoSelect, the constraint is external (environmental pressure selected the weights); for LogicGate, the constraint is internal (logical consistency governs the symbols). If you remove that feature—if you stop caring about how the competence was generated and treat both as mere input-output functions—the distinction collapses entirely. You're left with generic "algorithmic error," because without the genealogy of the system (selection vs. derivation), there's no way to tell if a mistake came from bad history or bad syntax.
