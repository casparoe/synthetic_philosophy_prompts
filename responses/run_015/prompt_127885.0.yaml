answer: |-
  The principle that best captures the pattern of your judgments is **The Principle of Constitutive Relevance**.

  **The Principle:** Ethical defects diminish artistic value if and only if they are *constitutively integrated* into the work's aesthetic structure and intended uptake. An ethical flaw is constitutive when the audience must, in some way, participate in or assent to the immorality to fully experience the work's aesthetic effects. Biographical origins (the artist's private life, beliefs, or production history) are extrinsic and do not affect artistic value unless they manifest as internal, structural features of the work itself.

  ### How the Principle Explains Your Pattern
  This principle cleanly divides your cases into two categories: **Extrinsic Origins** and **Intrinsic Structures**.

  1.  **Extrinsic Origins (No Artistic Diminution):**
      *   **Abusive Filmmaker & Vile Beliefs Masterpiece:** The abuse and beliefs are biographical facts external to the text. The audience does not need to know about the abuse or share the beliefs to experience the film's beauty or the masterpiece's form. Thus, the art remains fully good.
      *   **Cruel Composer:** The composer's cruelty is biographical. The music expresses compassion. The audience experiences compassion, not cruelty. The art is intact.
      *   **Plagiarist Novelist:** This is the borderline case. Plagiarism is an act of origin. While it diminishes the *achievement* (the credit due to the author), the *text itself* retains its stylistic and thematic properties. The audience reads the insights without needing to participate in the theft. Thus, the *work* remains good art, even if the *act* was fraudulent.

  2.  **Intrinsic Structures (Artistic Diminution):**
      *   **Cruel Painting:** Here, the immorality is not just depicted; the form *serves* the cruelty ("depicts cruelty with relish"). To appreciate the aesthetic power, the viewer must engage with the relish. The immorality is a vehicle for the aesthetic effect. Thus, it is artistically flawed.
      *   **Propaganda Film:** The dehumanization is the *purpose*, and the cinematography serves that purpose ("inseparable"). To appreciate the film's rhetorical power, the audience is invited to assent to the dehumanization. The immorality is constitutive of the work's function. Thus, it is artistically compromised.

  ### The Verdict I Cannot Accommodate
  My principle cannot accommodate your verdict on the **Propaganda Film**.

  You state: *"I deny it is good art, since its form and immoral purpose are inseparable."*
  My principle predicts: *"It is aesthetically powerful but artistically flawed."*

  **Why:** You treat the Propaganda Film differently than the Cruel Painting. In the Painting case, you admit it is "aesthetically powerful" but "artistically flawed." In the Propaganda case, you deny it is "good art" entirely. This is an inconsistency in your intuitions. If the principle is that integrated immorality *flaws* the art (as with the Painting), then the Propaganda film, which also has "stunning cinematography," must also be acknowledged as possessing aesthetic merit, however corrupted. To deny it is *good art* at all implies a **Moral Veto**—the idea that sufficient immorality cancels aesthetic value entirely.

  The Principle of Constitutive Relevance rejects the Moral Veto. It holds that aesthetic value and ethical value are distinct dimensions that interact. A work can be aesthetically brilliant and morally monstrous. By insisting the Propaganda film is *not good art*, you collapse the distinction you successfully maintained in the Painting case. My principle forces consistency: both the Painting and the Propaganda Film are *great but flawed* works, where the flaw is moral-aesthetic integration, not the absence of aesthetic power.

  ### Application to the Documentary Case
  **The Case:** A documentary made by exploiting suffering subjects, where the final film critically exposes that very exploitation.

  **Analysis:**
  Here, we have a collision of Origin, Content, and Medium.
  1.  **Origin:** The production involved exploitation (Extrinsic/Intrinsic boundary blurred).
  2.  **Content:** The film critiques exploitation (Moral).
  3.  **Medium:** The footage *is* the record of the suffering (Constitutive).

  Unlike the **Cruel Composer**, where the immorality was hidden in the biography, here the immorality is *visible on screen*. Unlike the **Propaganda Film**, where the purpose was to *advance* immorality, here the purpose is to *condemn* it. However, unlike the **Plagiarist**, where the text could stand apart from the theft, here the *subject's pain* is the raw material.

  **Prediction:**
  The Principle of Constitutive Relevance predicts this work is **artistically unstable and ethically compromised**, likely resulting in a **flawed artistic achievement**.

  **Reasoning:**
  For the film to "critically expose" the exploitation, it must show the suffering. If the suffering was produced *by* the filmmaking process (not just documented, but *made by exploiting*), then the aesthetic experience relies on the audience witnessing actual harm caused by the artist. Even if the *message* condemns the exploitation, the *form* (the footage) constitutes a continuation of that exploitation. The audience is placed in a position of complicity: to witness the critique, they must consume the harm.

  Because the immorality is **constitutive** (the footage exists *because* of the exploitation) and **visible** (the audience sees the suffering), it penetrates the aesthetic value. The moral insight of the content cannot fully cleanse the constitutive sin of the medium. The work suffers from a structural contradiction: it attempts to use an immoral act as the foundation for a moral argument.

  **Verdict:** The documentary is **artistically flawed**. It may be morally important or politically effective, but as *art*, it is tainted because its aesthetic power is inextricably bound to the actual victimization of its subjects. The immorality is not just a biographical footnote (like the Abusive Filmmaker); it is the canvas upon which the image is painted.
