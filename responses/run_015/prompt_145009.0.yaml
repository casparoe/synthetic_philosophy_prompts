answer: |-
  Here is a 50-minute workshop plan designed to force conceptual clarity rather than definition recall.

  ### 1. Terminology First: Fix the Slip
  **Do not lean into the slip.** Fix it immediately.
  *   **Why:** "Causal-role" is the standard term (following Robert Cummins). "Systemic contribution" is often used descriptively, but if your students write "systemic contribution" in an exam while the literature says "causal-role," they signal imprecision.
  *   **Action:** Write **CAUSAL-ROLE (Cummins)** and **ETIOLOGICAL (Selected Effects)** on the board. Tell them: *"These are the technical terms. 'Systemic contribution' describes what the causal-role account cares about, but it is not the name of the account."*

  ### 2. The Carrying Example: The "Plastic-Gut" Module
  Your synthetic case is strong, but to prevent the two accounts from blurring, the example needs a specific **variable switch** halfway through.

  **Phase 1: The Setup (Standard Case)**
  *   **Entity:** Engineered bacteria introduced into a human gut.
  *   **History (Etiology):** The lineage was designed and selected specifically because it breaks down microplastics.
  *   **Current Effect (Causal):** It breaks down plastics *AND* regulates pH (protecting the lining).
  *   **The Blurring Risk:** In this state, students will say both accounts agree the function is plastic-breaking. The pH regulation looks like a mere "capacity."
  *   **Requirement:** You must explicitly state that the pH regulation is **not** why the bacteria were selected/introduced, but it **is** beneficial to the host now.

  **Phase 2: The Twist (The Divergence Case)**
  *   **Change:** Imagine the host moves to an environment with **zero microplastics**.
  *   **New Status:** The plastic-breaking capacity is idle. The pH regulation continues and keeps the host alive.
  *   **Why this matters:** This is where the accounts *fight*.
      *   **Etiological:** Function is still plastic-breaking (that's the history). The bacteria are now "vestigial" or "malfunctioning" regarding their function, even if helpful.
      *   **Causal-Role:** Function is pH-regulation (that's the current contribution to the system's capacity).

  ### 3. Workshop Arc (50 Minutes)

  #### 00–10 mins: Intuition Pump (No Definitions Yet)
  *   **Activity:** Present the **Phase 1** case (Plastic + pH). Ask: *"What is the function of this module?"*
  *   **Goal:** Let them argue. Some will say "Breaking plastic" (because that's why we made it). Some will say "Keeping the gut healthy" (because that's what it does).
  *   **Trap:** Watch for the "Designer Intention" fallacy (*"It's whatever the engineer wanted"*).
  *   **Intervention:** Do not correct them yet. Write the conflicting answers on the board.

  #### 10–25 mins: Formalizing the Split
  *   **Instruction:** Reveal that they have just intuitively generated the two major philosophical accounts.
  *   **Define:**
      *   **Etiological:** Function = Historical reason for presence (Selection/Design).
      *   **Causal-Role:** Function = Current causal contribution to system capacity.
  *   **Apply:** Go back to the board. Map their answers to the definitions.
  *   **Crucial Move:** Address the **Designer Intention Misconception** here.
      *   *Say:* "If a mutation occurred naturally that did the exact same thing, the Etiological account would still call it a function if it was selected for. The Engineer is just a proxy for 'Selection History.' We are asking about *biological* function, not *artifact* function."

  #### 25–40 mins: The Stress Test (The Twist)
  *   **Activity:** Introduce **Phase 2** (Zero Microplastics).
  *   **Task:** Split the room. Left side argues Etiological, Right side argues Causal-Role. They must answer: *"Does the module still have a function? If so, what is it?"*
  *   **Misconception Knockdown:**
      *   *Misconception:* "History is just a story; if it works, it works."
      *   *Knockdown:* Ask the Causal-Role side: *"If I replace the bacteria with a chemical pill that regulates pH, does the bacteria still have the function of pH regulation?"* (Causal-Role says yes, it's about the contribution).
      *   *Misconception:* "If it's not doing the historical job, it's broken."
      *   *Knockdown:* Ask the Etiological side: *"If it keeps the host alive, why call it a malfunction?"* (Answer: Because function is normative based on history, not just current utility).
  *   **Goal:** Make them feel the *cost* of each view. Etiological handles norms well (malfunction) but ignores current utility. Causal-Role handles current utility well but struggles to distinguish function from accidental benefit.

  #### 40–45 mins: The Assessment Check
  *   **Do not** ask them to define the terms.
  *   **Do** give them a **New Case** (The "Minute Paper").
  *   **The Case:** *"A bird species evolves a bright tail to attract mates (sexual selection). Due to climate change, the tail now accidentally camouflages the bird against new colored bark, saving it from predators. Mating success drops, survival rises."*
  *   **The Question:** *"According to the Etiological account, what is the function of the tail? According to the Causal-Role account, what is the function? Do they agree?"*
  *   **Success Criteria:** They must identify that Etiological = Mate Attraction (History), Causal-Role = Camouflage (Current Contribution), and that they **disagree**. If they say "Both say Camouflage," they haven't learned it.

  #### 45–50 mins: Wrap & Scope Limit
  *   **Summary:** Reiterate that this isn't just semantics; it determines how we diagnose disease, engineer ecosystems, and define "health."
  *   **What to Refuse to Cover:**
      *   **Teleosemantics:** Do not get into how this applies to mental content.
      *   **Boorse's Biostatistical Theory (BST):** This introduces "reference classes" and "normality" which will eat 20 minutes and confuse the binary split you are teaching.
      *   **Normativity Deep-Dive:** Acknowledge that Etiological explains "malfunction" better, but don't try to solve the normativity problem.
      *   **Say Clearly:** *"We are stopping at the distinction. We are not solving which one is 'true' today. That is the subject of the essay question, not this workshop."*

  ### 4. Anticipated Misconceptions & Timing

  | Misconception | When it appears | How to knock it down |
  | :--- | :--- | :--- |
  | **"Function = Designer Intent"** | 00–10 mins (Initial intuition) | Remind them we are treating the bacteria as a *biological* entity now. If the engineer died, does the function vanish? (Etiological says no, history remains). |
  | **"History is irrelevant"** | 25–30 mins (Causal-Role dominance) | Ask: *"What is the function of the appendix?"* If history doesn't matter, and it does nothing now, it has no function. But we call it 'vestigial' (a historical term). |
  | **"They are the same thing"** | 10–15 mins (Definition phase) | Force the **Phase 2 (Zero Plastic)** scenario. If they agree there, the example is broken. Ensure they see the divergence. |
  | **"Causal-Role means 'Anything it does'"** | 25–40 mins (Stress Test) | Clarify that Causal-Role is relative to a **containing system**. It regulates pH *relative to the gut system*. It doesn't have the function of "making the lab technician rich." |

  ### 5. Final Advice on the Example
  To ensure the example holds weight:
  1.  **Must Have:** A clear **lineage**. The bacteria must replicate. If it's a one-off chemical injection, Etiological function doesn't apply well. Ensure students know the bacteria *reproduce* in the gut.
  2.  **Must Lack:** **Consciousness.** Do not allow students to argue the bacteria "want" to regulate pH. Keep it mechanistic.
  3.  **The "Side-Effect" Trap:** Ensure students understand that for Causal-Role, a "side-effect" *is* a function if it contributes to the system. For Etiological, a "side-effect" is *never* a function. This is the sharpest knife in your toolkit. Make sure they cut with it.
