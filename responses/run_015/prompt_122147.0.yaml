  There is a single account that can accommodate your verdicts, but it requires a specific metaphysical commitment regarding the nature of truth. That account is **Branching Time Supervaluationism**, potentially modified by **Assessment Sensitivity**.

  Here is how the account works, how it maps to your verdicts, where the tension lies, and how to resolve the unsettled case.

  ### The Account: Branching Time Supervaluationism

  Imagine time not as a single line, but as a tree. The past is the trunk (fixed, settled). The future is the branches (open, multiple possibilities).
  *   **Truth:** A future-tensed statement is **True** if it holds on *all* possible branches extending from the present moment.
  *   **Falsehood:** It is **False** if it holds on *no* branches.
  *   **Indeterminate:** It is **Neither True nor False** if it holds on *some* branches but not others.
  *   **Disjunction:** A disjunction ("A or B") is **True** if, on every branch, either A or B obtains (even if A is true on some and B on others).

  This framework validates your intuition that the future is open (i), that logical tautologies hold even over open futures (ii), and that physical necessity collapses the branches into one (iii).

  ### Mapping Your Verdicts

  1.  **(i) The Coin Toss:** There are branches where it lands heads and branches where it lands tails. "Heads" is not true on all branches. **Verdict: Neither True nor False.** (Matches your view).
  2.  **(ii) The Disjunction:** On every branch, the coin lands either heads or tails. The statement is true on all branches. **Verdict: True.** (Matches your view; Supervaluationism specifically allows a disjunction to be super-true while disjuncts are indeterminate).
  3.  **(iii) The Eclipse:** Physical mechanics are so robust that there are no physically accessible branches where the eclipse does not occur. The branches converge. **Verdict: True.** (Matches your view).
  4.  **(iv) The Patient:** Survival is not settled; there are branches where she dies. Probability measures the *proportion* or *weight* of branches, not truth. **Verdict: Neither True nor False.** (Matches your view; resists the "pull" of probability).
  5.  **(vi) The Duplicate:** Truth is determined by the branching structure of *this* world. A duplicate in another universe belongs to a different tree. **Verdict: Does not make (i) True.** (Matches your view).

  ### The Conflict: Verdict (v)

  Verdict (v) is the only point of fracture.
  *   **Admiral:** "I will order the sail." She is weighing reasons, implying the future is open to her. (Branches exist where she does not order). **Verdict: Neither True nor False.**
  *   **Flag Officer:** "She will order the sail." He predicts based on her character. **Verdict: True.**

  **The Problem:** In classical Supervaluationism, if there is *any* branch where she does not order the sail (which the Admiral's deliberation implies), the Officer's statement is **not True**. It is indeterminate. You cannot have it both ways if truth is absolute.

  ### The Solution: Two Paths

  You have two options to resolve (v).

  #### Option 1: Accept Assessment-Sensitive Truth (Relativism)
  You can keep all six verdicts if you adopt **Relativist Supervaluationism** (associated with philosophers like John MacFarlane).
  *   **The Theory:** Truth is not monadic ("P is true") but dyadic ("P is true relative to Context C").
  *   **The Fix:**
      *   Relative to the **Admiral's Context** (context of deliberation), the future is open. The statement is Indeterminate.
      *   Relative to the **Officer's Context** (context of prediction), the Admiral's psychology is treated as a fixed law. The accessible branches are narrowed to only those where she acts in character. The statement is True.
  *   **The Cost:** You surrender the idea that truth is absolute. The Admiral and Officer are not contradicting each other; they are assessing the same proposition from different contexts.

  #### Option 2: Surrender a Verdict (Classical Truth)
  If you demand that truth be absolute (a statement is either true or not, regardless of who says it), you must surrender one part of (v).
  *   **Which to Surrender:** Surrender the **Flag Officer's Verdict**.
  *   **Why:** Your verdicts (i) and (iv) establish a commitment to **Indeterminism**. You hold that physical chance (coin, patient) does not settle truth. If the Admiral is truly "weighing reasons" (implying libertarian freedom or genuine contingency), then her action is not metaphysically settled any more than the coin toss.
  *   **The Clause Doing the Work:** The Officer's verdict relies on the clause: *"Predictive certainty based on character constitutes metaphysical settledness."* You must reject this. The Officer has high *warrant* or *confidence*, but not *truth*. To call it "True" undermines your resistance in (iv) against probability influencing truth.
  *   **Revised Verdict (v):** The Admiral cannot truly assert it (Indeterminate). The Officer also cannot truly assert it (Indeterminate), though he is rationally justified in betting on it.

  ### Recommendation
  If you wish to maintain a robust distinction between **Truth** (metaphysical settledness) and **Warrant** (epistemic confidence), you should **surrender the Flag Officer's claim to Truth**. Treat his statement as "Highly Probable" rather than "True." This aligns (v) with (i) and (iv), preserving the integrity of your indeterminism.

  ### The Unsettled Case
  **Statement:** *"One day a human being will be the last human being, and she will be born on a Tuesday."*

  **Analysis:**
  1.  **"There will be a last human being":** This is contingent. Humanity might survive indefinitely (no last human), or evolve into post-humans without a clear boundary, or go extinct. On the Branching model, there are histories where humanity ends and histories where it does not. Therefore, this conjunct is **Indeterminate**.
  2.  **"She will be born on a Tuesday":** Even on histories where humanity ends, the specific birth day of the last human is not physically determined now. It varies across branches. This conjunct is also **Indeterminate**.
  3.  **Conjunction:** Since the first part is not true on all branches, the whole statement is not true on all branches.

  **Verdict:** **Neither True nor False.**
  **Reasoning:** Like the coin toss (i), the existence of a "last human" is not settled by current facts. Like the patient (iv), the specific details (Tuesday) are contingent. There is no "Thin Red Line" fixing the end of humanity or the birth day of the final person. Until the branches collapse (i.e., until humanity actually ends), the statement remains indeterminate.
