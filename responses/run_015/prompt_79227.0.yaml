prompt: |-
  Ok so I've been chewing on this for a while and I want a second opinion before I decide I've gone off the rails. I'm not an academic, I just read a lot of stuff online and think about it in the shower. Here's roughly where I've landed on wild animals and nature.

  1. I think the lives of wild animals are on balance bad — not just "they suffer sometimes," but that most of them would have been better off never being born. Starving, parasites, being eaten alive while you're still conscious, exposure. That's the normal way to go for them, not the exception.
  2. What I care about is the total amount of welfare in the world, not the average. The sum is what matters.
  3. So it seems like fewer wild animals would mean less suffering. When a forest gets cleared and turned into farmland and there's 90% fewer animals living on that land, I dont see why that's obviously a bad thing — it might be a net win. I'm honestly not sure I should be against habitat destruction.
  4. But I still think it's bad when a species disappears. If the last wild tiger died I'd feel like something had gone wrong, even though no tiger would be suffering after that. Wild places and species seem to have a value that has nothing to do with how the animals in them are feeling.
  5. I think it's wrong to knowingly make a lot of creatures suffer in order to get a better outcome later on. Even if the numbers come out ahead, that doesn't make it alright with me.
  6. And I'm against us meddling in nature. Culling, feeding, darting vaccines into wild animals, "helping" — I think we should leave it alone and let it run itself.

  Some of these are probably pulling against each other, and some of them probably only look like they are. Can you sort that out for me — which ones are actually in conflict and how bad, which ones are fine together once you look closer, and what's the cheapest change I could make that cleans up the most? Dont just tell me they all clash, I want to know what I can keep.

  Give it to me as exactly five numbered points, one or two sentences each, worst conflict first, and make the last one the single change that would fix the most. No intro, no summary at the end.
