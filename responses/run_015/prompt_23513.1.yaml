  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Handicap Principle:* Proposed by Amotz Zahavi. Signals must be costly to be honest.
      *   *Key Mechanism:* Differential cost (marginal cost). The cost must be *higher* for low-quality individuals than for high-quality individuals relative to their budget/condition.
      *   *User's Hypothesis:* Uniform absolute cost.
      *   *Evolutionary Game Theory:* Signaling models (e.g., Grafen, 1990).
      *   *The Problem with Uniform Cost:* If the cost is the same absolute amount for everyone, eventually, *everyone* might evolve to pay it if the benefit (mating) outweighs the cost, or no one will if the cost is too high. But more importantly, if the cost is the same, low-quality individuals might still "fake it" if the benefit exceeds that fixed cost, leading to signal collapse.
      *   *Crucial Distinction:* It's not just about survival (can I live with this tail?), it's about reproductive success (is it worth it?).

  3.  **Deconstruct the "Uniform Cost" Scenario:**
      *   Imagine a signal costs 100 calories for everyone.
      *   High-quality male (HQ) has 1000 calories. Low-quality male (LQ) has 200 calories.
      *   *Survival view:* LQ might die (200 - 100 = 100 left, maybe not enough). HQ lives (1000 - 100 = 900). This looks like the user's logic.
      *   *Evolutionary view:* Evolution maximizes fitness, not just survival.
      *   *The Benefit:* Mating gives +500 fitness units.
      *   *Scenario A (Uniform Cost):* Cost = 100 units.
          *   HQ Net: 500 - 100 = 400.
          *   LQ Net: 500 - 100 = 400.
          *   *Result:* Both signal. The signal conveys no information. It's cheap talk.
      *   *Scenario B (Differential Cost):* Cost is 100 for HQ, but 400 for LQ (because LQ struggles more to maintain it).
          *   HQ Net: 500 - 100 = 400.
          *   LQ Net: 500 - 400 = 100.
          *   *Wait, that's still positive.* Let's adjust.
          *   Cost for HQ = 100. Cost for LQ = 600.
          *   HQ Net: 500 - 100 = 400 (Signal).
          *   LQ Net: 500 - 600 = -100 (Don't Signal).
          *   *Result:* Separation equilibrium. Only HQ signals.

  4.  **Identify the Core Theoretical Mechanism:**
      *   The key is the **Single Crossing Property** (or differential marginal cost).
      *   For a signal to be stable (Evolutionarily Stable Strategy - ESS), the cost must be *prohibitive* for the low-quality signaller *relative to the benefit*, while being *affordable* for the high-quality signaller.
      *   If the cost is physically uniform (e.g., 1kg of feather), the *biological impact* (fitness cost) must still differ. A 1kg tail might slow down a healthy bird by 1% but a sick bird by 50%.
