answer: |-
  You are correct to sense a distinction. While residents conflate these issues under the umbrella of "community failure," they represent two fundamentally different economic structures. The confusion arises because both are types of **Market Failure** involving shared resources, but the mechanics of the failure are opposites.

  Here is the breakdown of the two configurations, the boundary that separates them, and the precise terminology for the second pattern.

  ### 1. The Laundry Machines: Common-Pool Resource Depletion
  **Established Concept:** **The Tragedy of the Commons** (specifically regarding **Common-Pool Resources**).

  *   **The Structure:** The laundry machines are a *Common-Pool Resource (CPR)*. They possess two traits:
      1.  **Non-Excludable:** Within the co-op, it is difficult or socially costly to prevent a resident from using them.
      2.  **Rivalrous:** This is the critical factor. One resident's use diminishes the value or availability for others. Every half-empty load adds wear and tear (decreasing the machine's lifespan) and occupies time (decreasing availability).
  *   **The Failure Mode:** **Overconsumption.** Because individuals capture 100% of the benefit of a quick, small load but share the cost of machine replacement across the whole co-op, they are incentivized to overuse the resource.
  *   **The Edge:** The boundary here is **depletion**. The resource exists, but it is being eaten away by use.

  ### 2. The Hallway Lighting: Public Good Under-Provision
  **Established Concept:** **The Public Goods Problem** (often manifested as the **Free-Rider Problem**).

  *   **The Structure:** The improved lighting is a *Public Good* (or, in a co-op context, a *Club Good* treated as public). It possesses two traits:
      1.  **Non-Excludable:** Once installed, you cannot easily prevent a non-contributor from enjoying the light.
      2.  **Non-Rivalrous:** This is the critical difference. One resident benefiting from the light does not diminish the light available to others. My safety does not reduce your safety.
  *   **The Failure Mode:** **Under-Investment.** Because no single resident can capture the full value of the improvement (since others benefit too), no individual is willing to pay the full cost. Everyone waits for someone else to pay so they can benefit for free.
  *   **The Edge:** The boundary here is **non-existence**. The resource is not being worn down; it is failing to materialize at all.

  ### The Boundary: Rivalry of Consumption
  The precise line that marks the edge between these two problems is **Rivalry**.

  *   **If consumption reduces the resource for others (Rival):** You face a **Tragedy of the Commons**. The risk is that the resource will be destroyed by *too much* activity. (e.g., Laundry, overfishing, congested roads).
  *   **If consumption does not reduce the resource for others (Non-Rival):** You face a **Public Goods Problem**. The risk is that the resource will never be created due to *too little* activity. (e.g., Streetlights, national defense, co-op renovations).

  Residents conflate them because both involve "shared stuff" and "people being difficult." However, the solutions are opposites. To fix the laundry (CPR), you must **restrict access** or **price usage** (e.g., raise fees per load) to discourage overuse. To fix the lighting (Public Good), you must **compel contribution** (e.g., mandatory HOA fees) to encourage provision.

  ### Terminology for the Second Pattern
  You asked for an established term for the second pattern, or a proposed one if none exists that distinguishes it from simple free-riding.

  **The Established Term:**
  Economists refer to this as the **Public Goods Provision Problem**.

  **The Distinction from "Simple Free-Riding":**
  "Free-riding" describes the *behavior of an individual* (taking without paying). However, your residents are describing a *systemic configuration* where the service never launches. A simple free-rider hops on a moving bus without a ticket. In your hallway scenario, **the bus never leaves the station** because everyone is waiting for someone else to buy the fuel.

  **Proposed Term for Clarity:**
  To communicate this distinction effectively to your residents, I propose using the term **"The Paradox of Under-Provision."**

  **Definition:**
  > **The Paradox of Under-Provision** occurs when a group fails to fund a non-rival benefit because every individual waits for others to contribute first. Unlike simple free-riding (where a service exists and is used without payment), this pattern results in the **total absence of the service** despite universal demand, driven by the diffusion of responsibility rather than mere opportunism.

  **Why this term helps:**
  1.  **Symmetry:** It mirrors "Tragedy of the Commons" (a "Tragedy" of action vs. a "Paradox" of inaction).
  2.  **Diagnosis:** It tells residents the problem isn't that they are "greedy" (free-riders), but that they are "stuck" (paradox).
  3.  **Solution:** It implies the solution is not shaming individuals, but changing the structure (e.g., bundling the cost into mandatory maintenance fees) to break the standoff.

  ### Summary for Your Residents
  *   **Laundry:** A **Tragedy of the Commons**. We are killing a resource we all share by using it too much. *Solution: Restraint or usage fees.*
  *   **Lighting:** A **Paradox of Under-Provision**. We are starving a resource we all need by contributing too little. *Solution: Mandatory collective funding.*

  By separating **Rivalry** (Laundry) from **Non-Rivalry** (Lighting), you can show them that while both are community failures, they require opposite management strategies.
