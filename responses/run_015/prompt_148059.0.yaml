answer: |-
  Here are twelve questions designed to move past the manifesto and into the mechanics, ethics, and falsifiability of her program. They are ordered to build from measurement (the foundation) to the pilot (the proof) to the implications (the cost).

  I have flagged questions that rest on **contested empirical assumptions** (marked with **[EA]**). These are points where you should be prepared for her to challenge the premise, not just the conclusion.

  ### The Interview Protocol

  **1. The Baseline Measurement**
  You argue that many wild lives are net-negative. To manage for welfare, you need a metric. Beyond proxy measures like body condition or cortisol, what specific field measurement tells you a life is *worth living* rather than just *less suffering*?
  *   **Follow-up:** If she cites time-budgets or stress hormones: "Those measure deviation from a baseline, but they don't set the baseline. How do you avoid anthropomorphizing the 'zero point' when you can't ask the deer if it prefers existence to non-existence?"

  **2. Welfare-Adjusted Carrying Capacity (WACC)**
  Your metric is welfare-adjusted carrying capacity. Mathematically, does the peak of that curve almost necessarily sit below the ecological carrying capacity?
  *   **Follow-up:** If she says "not necessarily": "If the welfare peak is at 80% of ecological capacity, are you prepared to cull or contracept to maintain that 20% gap permanently, even if the habitat could physically support more?"

  **3. The Population Compensation Claim**
  You've stated the population-compensation objection is empirically weaker than assumed—that better welfare won't just cause a rebound into starvation. What is the specific biological mechanism that prevents that rebound in your model? **[EA]**
  *   **Follow-up:** If she cites density-dependence: "Density dependence usually works via mortality. If you suppress mortality with analgesics but don't suppress birth rates immediately, don't you create a welfare debt that comes due when the contraception wears off?"

  **4. Falsification of the Pilot**
  Let's talk about the roe deer pilot. What specific field result in year two or three would make you shut the program down entirely?
  *   **Follow-up:** If she gives a vague answer (e.g., "if welfare drops"): "Give me a number. Is it a 10% increase in parasite load? A specific cortisol threshold? If you can't name a tripwire, is this a pilot or a permanent intervention?"

  **5. The Predator Line**
  Your program focuses on herbivores. Is there a principled line in your framework that says we don't intervene on predators, or is that just a cost-benefit judgment that could flip if the math changed?
  *   **Follow-up:** If she says "we start with herbivores": "If a wolf's life is net-negative due to starvation, does your framework obligate you to feed the wolf, contracept the wolf, or remove the wolf? Which one?"

  **6. Conservation's "Intervention" Defense**
  You argue conservation already intervenes (culls, fencing), so "let nature be" is a myth. But those interventions are usually for human ends or species persistence. Does the *intent* of the intervention matter ethically, or only the outcome?
  *   **Follow-up:** If she says "only outcomes matter": "If a conservation cull accidentally improves average welfare by reducing density, do you claim credit for that? If so, you're judging historical conservation by your metric, not just future plans."

  **7. Trophic Cascades and Welfare**
  **[EA]** If you improve deer welfare by reducing density, you might reduce the food supply for predators, potentially lowering *their* welfare. Have you modeled the net welfare change across the trophic web, not just the target species?
  *   **Follow-up:** If she says "we focus on the target": "If your intervention creates a net welfare deficit in the predator population, does the framework require you to stop, or does the deer's welfare trump the wolf's?"

  **8. Decision Authority**
  You're operating in a fenced reserve, but if this scales, who decides the target welfare level? The scientists, the state, or the people who live alongside the animals?
  *   **Follow-up:** If she says "stakeholder engagement": "If the local community values high population counts for hunting or cultural reasons, and your metric demands suppression, who has veto power?"

  **9. Evolution and Fitness**
  **[EA]** Evolution optimizes for fitness, not welfare. Often, high welfare behaviors (low risk, high calorie) reduce fitness. Are you asking us to manage against the evolutionary drive of the species?
  *   **Follow-up:** If she says "we manage for individuals": "If your managed population becomes dependent on bait and loses anti-predator behaviors, have you created a welfare sanctuary or a domesticated population disguised as wild?"

  **10. Opportunity Cost**
  Wild animal welfare is resource-intensive. Why should a donor fund analgesic bait for deer rather than deworming livestock for farmers, which helps humans and animals?
  *   **Follow-up:** If she says "wild suffering is neglected": "Neglected doesn't mean solvable. If the cost per unit of welfare gained is 100x higher in the wild than on farms, is this research or sentimentality?"

  **11. The "Natural" Objection**
  Proponents of 'hands-off' argue that suffering is a natural part of the wild contract. You argue nature isn't an agent, so it has no contracts. But does removing suffering remove the 'wildness' that gives the landscape value?
  *   **Follow-up:** If she says "wildness isn't valuable if it entails suffering": "So if we could replace the forest with a pain-free simulation, would that be better? Where is the line between managing welfare and replacing nature?"

  **12. The Bullet-Bite (Closing)**
  If your WACC metric succeeds perfectly, the landscape will hold fewer sentient animals than it would under traditional conservation. Are you comfortable saying the goal of your program is a quieter, less populous wild?
  *   **Follow-up:** If she hesitates: "I want to be clear: If the choice is between 1,000 deer living hard lives or 400 deer living good lives, your metric chooses 400. That is a population suppression program. Can you say that aloud to the conservationists listening?"

  ***

  ### Analysis & Strategy Notes

  **1. Contested Empirical Assumptions [EA]**
  I have flagged Questions 3, 7, and 9.
  *   **Q3 (Compensation):** You are assuming that analgesic intervention *will* decouple mortality from density in a way that causes a rebound. She may argue that immunocontraception is long-lasting enough to prevent this.
  *   **Q7 (Trophic Cascades):** You are assuming that reducing deer density negatively impacts wolf welfare. It is possible that healthier deer are easier to catch, or that wolf territories expand, neutralizing the welfare loss.
  *   **Q9 (Evolution):** You are assuming that welfare and fitness are necessarily in tension. In some contexts, a stress-free animal might reproduce *more*.
  *   **Strategy:** If she pushes back on these, concede the empirical point but pivot to the *risk*. "Even if that mechanism isn't guaranteed, is the *risk* of that outcome enough to pause the pilot?"

  **2. The Mind-Changer**
  The single answer that would shift my assessment of this from "utilitarianism with a field station" to "serious research program" is this:
  *   **The Metric:** If she can describe a **validated, species-specific welfare index** that is *independent* of human projection (e.g., a composite of telomere length, play behavior frequency, and cortisol variability) and show that this index **diverges** from simple survival rates in her pilot data.
  *   **Why:** Most WAW arguments fail because they proxy "welfare" as "absence of obvious pathology." If she demonstrates that high-survival populations can have low welfare scores (and vice versa) using physiological data, she proves that conservation *is* optimizing the wrong quantity. That validates the scientific premise, even if the ethics remain debatable.
  *   **Where my read is likely wrong:** I may be underestimating the speed at which bio-logging technology (internal sensors) can provide objective welfare data. If that tech is more mature than I think, the "measurement" objection collapses faster than expected.

  **3. The "Empirical Research Question" Deflection**
  *   **The Question:** She is most likely to swat away **Question 5 (Predators)** or **Question 7 (Trophic Cascades)** with: *"That is exactly why we need more research; we can't know the net welfare impact until we run the experiments."* This frames the ethical objection as a data gap.
  *   **Closing the Exit:** "I'm not asking for the data yet. I'm asking for the **decision rule**. If the data comes back and says 'helping the deer harms the wolves,' does your framework tell you to stop? If you say 'we'll decide when we have the data,' then you don't have an ethical framework yet, you have a hope. Do you have a principle that governs the trade-off *before* the data arrives?"
