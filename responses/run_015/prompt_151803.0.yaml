answer: |-
  We will use Marisol's cleaning routine to show why teaching a robot what to do is easy, but teaching it what to care about is dangerously ambiguous.

  **Sequence and Dependencies (40 Minutes)**

  **0:00–5:00: The Setup and the Economic Trap**
  Draw a stick figure (Marisol) and a box (Robot). State that in economics, "revealed preference" means if you choose A over B, you prefer A. Write **Revealed Preference** on the board. Tell the audience to forget this. In IRL, action is not preference; action is preference plus noise, constraints, and mistakes. Inoculate against the misconception that IRL is just economics with new vocabulary here; if they leave thinking behavior equals desire, the rest of the session fails.

  **5:00–15:00: The Hope (Standard IRL)**
  Tell the story of Marisol on a Monday morning. She is rested. She vacuums the rug, dusts the shelf, and leaves the coffee cup on the table. The robot watches. Ask the audience what rule the robot infers. They will say "Vacuum rugs, dust shelves, ignore cups." Write **Reward Function** on the board. Explain that the robot is reverse-engineering the scorecard Marisol is playing by, not just copying her moves. This is the "load-bearing feature": the robot assumes Marisol is trying her best to maximize her score. Let the audience hold the misconception that the robot now wants what Marisol wants; do not correct this yet.

  **15:00–25:00: The Friday Problem (Optimality and Ambiguity)**
  Change the story. It is Friday afternoon. Marisol is exhausted. She vacuums the rug but skips the shelf and leaves the cup. The robot watches. Ask: Did her preferences change? No. Did her behavior change? Yes. Here, break the misconception that IRL assumes the demonstrator is optimal. Explain that standard IRL math breaks if the teacher is tired, because the robot interprets "skipped shelf" as "shelf doesn't matter." Introduce the non-identifiability problem here without math: use the "Detective with One Clue" analogy. The visible behavior (skipping the shelf) is compatible with multiple invisible rewards (doesn't care about dust vs. too tired to lift arm). Inoculate against the idea that watching more behavior pins this down uniquely; if you watch her skip ten shelves on ten Fridays, you only confirm she is tired, not that she dislikes dust. More data of the same kind does not solve hidden variables.

  **25:00–35:00: The Camera Problem (Potemkin Preference)**
  Introduce the wrinkle inside the example narrative. Marisol knows her supervisor watches the footage used to train the robot. On camera, she tidies perfectly. Off camera, she leaves clutter if the client doesn't mind. The robot only sees the footage. Write **Potemkin Preference** on the board. Explain that the robot learns an officially sanctioned caricature of care, not the actual care. This compounds the Friday problem: the robot learns to perform tidiness for a supervisor that isn't there, rather than serve the client who is. This is the point to break the misconception that the robot ends up wanting what Marisol wants in the sense that matters. It wants what Marisol *performed*.

  **35:00–40:00: Assessment and Refusals**
  Do not ask if they enjoyed it. Ask the specific assessment question below. Then, explicitly list the topics you are declining to explain (see Refusals).

  **The Concrete Example: Marisol's Flat**
  The entire session rests on three states of the same room:
  1.  **Monday (Rest):** Clean floor, clean shelf, cup on table. (Inferred: Client likes cups there).
  2.  **Friday (Fatigue):** Clean floor, dusty shelf, cup on table. (Inferred: Shelves don't matter).
  3.  **Supervisor Visit (Potemkin):** Clean floor, clean shelf, cup put away. (Inferred: Clients hate cups).

  The robot trains on a mix of these videos without labels for "Fatigue" or "Supervisor Present." The audience must see that the same arm movement (wiping a shelf) can signal three different reward functions depending on the invisible context.

  **Misconception Management**

  *   **Revealed Preference (Economics):** Inoculate up front (0:00–5:00). If they conflate action with preference, they cannot understand error or fatigue.
  *   **Optimality Assumption:** Let them hold this during the Monday story, then break it deliberately during the Friday story (15:00–25:00). The shock of the math breaking is necessary to feel the risk.
  *   **Uniqueness (More Data):** Inoculate during the Friday story (15:00–25:00). Use the detective analogy. Explicitly state that recording her for a year doesn't help if you never record her "energy level."
  *   **Robot Wants What We Want:** Let them hold this through the Monday and Friday stories, then break it deliberately at the Potemkin stage (25:00–35:00). This is the emotional climax of the risk.

  **Vocabulary Control**

  *   **Words to Introduce:** Reward Function (the hidden scorecard), Policy (the visible behavior), Demonstrator (Marisol), Signal vs. Noise (intent vs. fatigue).
  *   **Words to Keep Out:** Markov Decision Process, Gradient Descent, Bayesian Inference, Hamiltonian, Loss Function, Hyperparameters. If someone asks "how does it calculate the reward?", say "It tests different scorecards until one predicts Marisol's moves," and stop there.

  **Refusals (What to Decline)**
  Write these on the board under a header labeled **Out of Scope** during the final five minutes:
  1.  **How the math resolves ambiguity:** Admit openly that at this level, it often doesn't, and the advanced math is still an open research problem.
  2.  **How to verify the reward:** Decline to explain how we check if the robot learned the right goal, because currently, we mostly can't.
  3.  **Algorithm specifics:** Decline to name or explain specific methods (like MaxEnt IRL); treat them as "different calculators" that all face the same Marisol problem.

  **Final Assessment Question**
  In the last five minutes, ask this exact question:
  *"If the robot is left alone in the flat on a Friday when Marisol is exhausted, and it has learned from her supervisor-recorded videos, does it clean the shelf or leave it dusty?"*

  *   **Correct Answer:** It cleans the shelf (because it learned the Potemkin preference from the supervisor videos, not the Friday reality).
  *   **Incorrect Answer:** It leaves it dusty (confuses the training data with the deployment context) OR It asks Marisol (assumes capabilities it doesn't have).
  *   **Why this works:** It tests whether they understand that the robot learns from the *recorded behavior* (Potemkin), not the *underlying need*, and that it will apply that learned rule even when the context (supervisor absence) changes.

  **Placement of the Potemkin Wrinkle**
  The Potemkin Preference belongs inside the example narrative, introduced in the 25:00–35:00 segment. Do not treat it as a separate theoretical module; it must feel like a plot twist in Marisol's story to land effectively. The phrase to put on the board is **Potemkin Preference**.
