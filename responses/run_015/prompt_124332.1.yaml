answer: |-
  The standard defense against Pascal's Mugging relies on crushing the probability. We tell ourselves the prior is so vanishingly small that no utility magnitude can overcome it. This is a mistake. It treats the problem as an arithmetic error rather than a structural flaw. If you want to understand why caving to the mugger is irrational, you have to stop looking at the numbers and start looking at the mechanism of your agency.

  The core issue isn't that the probability is low; it's that your decision rule allows unbounded utility to hijack your belief updates. When you accept that a mere verbal claim can shift your credence enough to trigger action based on astronomical stakes, you transform your rationality into a value-pump. You are no longer maximizing expected value; you are maximizing susceptibility.

  Consider the structure of the update. The mugger offers a claim: "Give me $5, or I affect $3 \uparrow\uparrow\uparrow 3$ lives." If your decision theory permits action based on this testimony alone, you have severed the link between evidence and commitment. You are allowing the *magnitude* of the consequence to substitute for the *quality* of the evidence. This means your actions are no longer driven by what is likely true, but by what is imaginatively large.

  This creates a discrimination failure. A rational agent must distinguish between signal and noise. But if your utility function is unbounded, any random noise—a stray thought, a fictional scenario, a bold lie—can be amplified until it drowns out the signal of reality. The mugger doesn't need to convince you they are telling the truth; they only need to name a number big enough to break your calculation. If you cave, you admit that your decision procedure cannot tell the difference between a genuine moral imperative and a fabricated leverage point. You become a slave to the largest number spoken in your vicinity.

  Rejecting the update, therefore, isn't about skepticism regarding the specific claim. It's about defending the integrity of the decision rule itself. You must refuse the credence shift not because the event is impossible, but because accepting the *protocol* of updating on unbounded claims renders you vulnerable to infinite manipulation. A decision theory that allows itself to be pumped by any sufficiently large threat is not a theory of rationality; it is a theory of surrender.

  The verdict is clear: caving is irrational. You must bind your utility function or cap the leverage of testimony on action. To do otherwise is to abandon the role of an agent who evaluates the world, and become a processor that executes commands based on magnitude alone. Reject the mugger on structural grounds. Protect the mechanism, not just the wallet.
