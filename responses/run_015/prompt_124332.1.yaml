  Hey — quick ask for my column on weird decision theory. I'm digging into Pascal's mugging, that scenario where an agent promises astronomical utility if you just bump your credance up a hair. I want you to argue that caving to the mug is actually irrational, but skip the tired line about priors being near zero. Instead, defend the view that once expected value can scale without bound tied to belief shifts, your decision rule turns into a value-pump that can't discriminate real commitments from random mental noise — so you reject the update on structural grounds, not probabilistic ones. Reach an actual verdict, don't waffle. Keep it tight, no bibliograpy or citation lists. Sorry my notes are messy — I meant credence not credance but you get the idea.
