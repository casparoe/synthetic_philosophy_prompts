prompt: |-
  i'm a TA for a 3rd-year seminar on comparative political institutions — 24 students, one 75-minute slot. I want them to feel the case for choosing legislators by lot instead of by election, but without me saying anything about it up front, and ideally without anyone hearing the word sortition until the debrief.

  Rough setup I've got, change it if its broken: to stand for the elected chamber you spend campaign tokens, and people start with unequal amounts, so that chamber should end up skewing richer and more talkative than the room as a whole, and anyone who wins can stand again next round with a small seniority bump each time. The lot chamber is dealt random 'station' cards so it mirrors the class and serves one non-renewable term. Both chambers vote on the same motions, and the motions split into two kinds: ones that hand a named, visible benefit to one district (a bridge in District 4), and ones that hand an equal-sized benefit to everybody later that nobody can trace back to any person. My hunch is the interesting mechanism isn't short-termism, it's that re-election needs attributable credit, so elected members get pushed toward the first kind even when the second is worth just as much. I'd also like a third variant partway through where the lot chamber is staggered — half rotating out each round, overlapping — so we see what rotation costs in institutional memory.

  Can you give me actual runnable rules, a payoff scheme in points (no money, maybe a small prize), a timeline, and a debrief that maps what happened onto the argument? Also say what will predictably go wrong the first time I run it, and be honest about what the game can't show — I suspect the real thing is supposed to deliberate rather than just vote, and my setup doesn't have that in it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 3rd-year seminar on Comparative Political Institutions.
      *   **Class Size/Time:** 24 students, 75 minutes.
      *   **Goal:** Students should *feel* the case for sortition (legislators by lot) vs. election without the TA explicitly advocating for it upfront. The word "sortition" should be saved for the debrief.
      *   **Proposed Mechanism:**
          *   Chamber A (Elected): Campaign tokens (unequal start), re-election allowed with seniority bump.
          *   Chamber B (Lot): Random assignment, mirrors class demographics, non-renewable term.
          *   Voting: Both vote on motions.
          *   Motions: Type 1 (Pork/Local/Attributable) vs. Type 2 (Public Good/Universal/Untraceable).
          *   Hypothesis: Elected members favor Type 1 to claim credit for re-election.
          *   Variant: Staggered Lot (institutional memory test).
      *   **Needs:** Runnable rules, payoff scheme (points/prize), timeline, debrief strategy, prediction of failure points, limitations of the simulation.

  2.  **Evaluate the Proposed Setup:**
      *   *Strengths:* The core mechanic (credit-claiming vs. public good) is sound political science. The inequality in campaign tokens is a good touch for realism.
      *   *Weaknesses/Risks:*
          *   **Time:** 75 minutes is tight for a simulation + debrief. Complex voting rules eat time.
          *   **Engagement:** If the "Lot" chamber just votes randomly or feels powerless, they disengage.
          *   **Complexity:** Tracking "seniority bumps," "campaign tokens," and two types of motions might get bogged down in administration.
          *   **The "Deliberation" Gap:** The user correctly identifies that real legislatures deliberate. A pure vote simulation misses the *pressure* to perform for donors/voters vs. discussing merit.
          *   **Inequality:** Giving unequal tokens upfront might cause resentment or disengagement among the "poor" students unless framed carefully.
          *   **The "Lot" Motivation:** Why do Lot members care? If they can't be re-elected, why vote for the public good? They need a motivation (e.g., legacy points, or just representing their "constituents" in the room).

  3.  **Refine the Mechanics (Iterative Design):**
      *   *Simplification:* Instead of complex token trading, make "Campaign Cost" a barrier to entry for the Elected chamber.
      *   *Motivation:* Elected members need "Votes" to stay. Lot members need "Impact" points (altruistic or group-based).
      *   *Motions:* Need to be very clear. "Bridge for District 4" vs. "Tax Cut for Everyone."
      *   *The Twist:* The Elected chamber needs to *spend* resources to win. The Lot chamber is free but temporary.
      *   *Staggered Lot:* Keep this for Round 2 or 3 to show stability.
      *   *Deliberation:* Add a 2-minute "caucus" period before voting to allow the pressure of re-election to manifest verbally.

  4.  **Drafting the Plan:**

      *   **Title:** "The Two Chambers" (Keep it neutral).
      *   **Setup:** Divide class into two groups (12 vs 12).
          *   *Group E (Elected):* Need to win seats. Start with unequal "Influence" (tokens).
          *   *Group L (Lot):* Randomly selected from the whole class (or just the remaining 12). *Correction:* To make it comparative, it's better if they are parallel bodies. Let's make it two parallel legislatures deciding the same fate, or one legislature with two houses.
          *   *Better Design:* One "State." Two "Houses." House A (Elected), House B (Lot). Both must pass a bill for it to become law? No, that creates gridlock.
          *   *Best Design for Comparison:* Split the class into two *independent* polities (Polity A and Polity B) facing the same problems. Or, keep the user's idea: Two chambers within one system. Let's stick to the user's "Two Chambers" idea but simplify.
          *   *Actually:* To really *feel* the difference, they need to experience the *selection process*.
          *   *Revised Setup:*
              *   Round 1: Election vs. Lot.
              *   Round 2: Staggered Lot.
              *   All students are "Citizens." Some become "Legislators."
              *   Wait, 24 students is small. If only 6 are legislators, 18 are bored.
              *   *Solution:* Everyone is a legislator, but assigned to a *mode* of selection. 12 in Chamber E, 12 in Chamber L.
      *   **Payoff:** Points = Grade bonus or Candy. Let's use "Policy Points" (PP).
      *   **Motions:**
          *   Type A (Pork): +10 PP to specific district (Legislator + their 2 constituents), -2 PP to everyone else.
          *   Type B (Public): +3 PP to *everyone*.
          *   *Math:* Type B is utilitarianly better (24 * 3 = 72 vs Type A's net gain). But Type A helps the Legislator secure their seat.
      *   **Re-election Mechanic:** Elected legislators need "Constituent Approval" to run again. Lot legislators just rotate.

  5.  **Addressing the "Deliberation" Critique:**
      *   Add a "Campaign Speech" phase for Elected. They *must* justify their vote to the class (constituents). Lot members just vote. This highlights the performative aspect of election.

  6.  **Developing the Timeline:**
      *   0-10: Setup & Rules.
      *   10-25: Round 1 (Elected vs. Lot).
      *   25-30: Score & Reset.
      *   30-45: Round 2 (Staggered Lot).
      *   45-75: Debrief.

  7.  **Identifying Failure Points:**
      *   *Math confusion:* Keep scoring simple.
      *   *Boredom:* Keep rounds fast.
      *   *Cynicism:* If Elected chamber just steals everything, students might hate the game. Need to ensure Public Good is tempting.
      *   *The "Lot" Disengagement:* If they can't be re-elected, why do they care? Give them a "Legacy Score."

  8.  **Drafting the Debrief:**
      *   Connect mechanics to theory (Principal-Agent, Credit Claiming, Descriptive Representation).
      *   Reveal the word "Sortition."
      *   Discuss limitations (Deliberation, Expertise).

  9.  **Refining the Rules (Self-Correction during drafting):**
      *   *Issue:* If Elected members are just "richer," they might dominate the vote.
      *   *Fix:* One person, one vote *inside* the chamber. The inequality is in *getting* the seat and *keeping* it.
      *   *Issue:* 75 mins is very tight for 3 rounds.
      *   *Fix:* Cut to 2 Rounds. Round 1: Standard Elected vs. Standard Lot. Round 2: Elected vs. Staggered Lot.
      *   *Wait, User wants:* Elected, Lot, then Staggered Lot.
      *   *Compromise:* Round 1 (Elected vs Lot), Round 2 (Elected vs Staggered Lot). Keep the Elected chamber constant to show the contrast.
      *   *Actually:* To save time, run the "Elected" logic once and the "Lot" logic once, then simulate the Staggered Lot quickly.
      *   *Better:* Run 3 "Legislative Sessions."
          *   Session 1: Chamber E (Elected) & Chamber L (Lot) vote on 3 bills.
          *   Session 2: Chamber E (Re-election) & Chamber L (New Lot) vote on 3 bills.
          *   Session 3: Chamber E (Re-election) & Chamber L (Staggered) vote on 3 bills.
      *   *Too complex.* Let's simplify.
      *   *Final Plan:* Two Polities. Polity Alpha (Elected). Polity Beta (Lot). They run in parallel. Then a quick round for Staggered.
      *   *No, stick to User's Two Chamber idea.* It emphasizes they are part of one system.
      *   *Revised Plan:*
          *   Intro (5)
          *   Selection Phase (10) - This is crucial. Make them *feel* the campaign.
          *   Legislative Round 1 (15)
          *   Legislative Round 2 (15) - Introduce Staggered here.
          *   Debrief (30)

  10. **Final Polish:**
      *   Ensure the "Token" inequality doesn't feel unfair in a bad way. Frame it as "Existing Networks."
      *   Make sure the "Public Good" is mathematically superior so the tragedy is clear.
      *   Be honest about the "Deliberation" gap in the limitations section.

  11. **Writing the Response:** (Incorporating the above thoughts into the structured output requested). *Self-Correction on Payoff:* Don't use real grades. Use candy or "bragging rights" + a conceptual link to their actual grade (participation). Let's suggest a small prize for the "Polity" with the highest total welfare.

  12. **Checking Constraints:**
      *   No "Sortition" word until debrief.
      *   3rd year level (theory needs to be substantive).
      *   Address the deliberation gap.

  13. **Final Review of the "Inequality" aspect:**
      *   User wants unequal start tokens.
      *   Risk: Students with 0 tokens feel excluded.
      *   Mitigation: Tokens are for *campaigning*, not voting. Everyone can vote. Only those who spend tokens can *stand* for the Elected chamber. The Lot chamber is open to all (via random draw). This ensures everyone participates, but the *pathway* differs.

  14. **Final Review of "Staggered Lot":**
      *   User wants to test institutional memory.
      *   Mechanic: Half the Lot chamber stays, half rotates.
      *   Measure: Do they vote more strategically over time?

  15. **Constructing the Output.** (Proceed to generate response based on these decisions).
answer: |-
  This is a strong conceptual design. The core insight—that re-election incentives drive *attributable* benefits (pork) over *universal* benefits (public good)—is classic political science (think Mayhew's *Congress: The Electoral Connection*).

  However, 75 minutes is extremely tight for a simulation with this many moving parts. If the admin eats 20 minutes, you lose the learning outcome. Below is a streamlined, "battle-tested" version of your plan. I have simplified the token economy to prevent math bog-downs and added a specific mechanism to force the "credit-claiming" behavior you want to see.

  ### Game Title: "The Two Chambers"
  **Do not use the words:** Sortition, Lottery, Random, Election, Campaign.
  **Use instead:** Selection Method A, Selection Method B, Influence, Constituents.

  ---

  ### 1. The Setup (5 Minutes)
  **Room:** Arrange desks into two semi-circles facing you.
  *   **Chamber E (12 students):** The "Influence" Chamber.
  *   **Chamber L (12 students):** The "Civic" Chamber.
  *   **The Rest of the Class:** In this design, *everyone* is a legislator. There are no constituents. This maximizes engagement.

  **Initial Endowment:**
  Hand out envelopes.
  *   **Chamber E:** 8 students get 0 "Influence Chips," 4 students get 5 Chips. (Inequality).
  *   **Chamber L:** Everyone gets 0 Chips.

  **The Goal:**
  "The State" needs to pass legislation. At the end of class, we tally **Welfare Points (WP)**.
  *   If the **Total WP > 100**, everyone gets a small prize (e.g., candy/extra participation credit).
  *   *Individual Incentive:* Members of Chamber E also care about **Personal Security**. If they end the game with high Personal Security, they win a "Best Legislator" prize.

  ---

  ### 2. The Mechanics (10 Minutes)
  Explain the rules clearly. Project them if possible.

  **Selection Rules:**
  *   **Chamber E (Influence):** To hold a seat for a round, you must pay **2 Influence Chips** to the "Party Coffer" (you). If you have 0 chips, you cannot sit in Chamber E *unless* someone gives you chips.
      *   *Re-election:* If you hold a seat, you gain **+1 Seniority Chip** at the end of the round. You can use this to pay for the next round.
      *   *Security:* To keep your seat next round, you must generate **3 Constituency Points (CP)** for yourself.
  *   **Chamber L (Civic):** Seats are assigned by **Card Draw**.
      *   Round 1: 12 random cards drawn from a deck.
      *   Round 2: All cards returned, 12 new draws. (Full Rotation).
      *   Round 3: 6 cards returned, 6 kept. (Staggered).
      *   *Security:* No re-election. You serve and leave. Your goal is purely Total WP.

  **Voting Rules:**
  You (the TA) propose 3 Bills per Round.
  *   **Bill Type 1 (The Bridge):** +10 WP to a specific *District* (3 specific students). -2 WP to everyone else.
      *   *Constraint:* The 3 recipients must include at least one Chamber E member to count toward their **Constituency Points (CP)**.
  *   **Bill Type 2 (The Reform):** +3 WP to **everyone** in the room.
      *   *Constraint:* No one can trace this benefit to a specific legislator. Generates 0 CP.

  **Passing a Bill:**
  *   Both chambers vote separately.
  *   A bill passes only if **Both Chambers** vote Yes (Bicameralism).
  *   *Tie-breaker:* If Chamber E says Yes and L says No (or vice versa), the bill dies.

  ---

  ### 3. The Timeline (75 Minutes Total)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Hand out envelopes/chips. Explain WP goal. **Do not explain CP goal to Chamber L.** |
  | **05-15** | **Selection** | **Chamber E:** Students with chips bid/stand. Those with 0 chips must beg for chips to stand. <br> **Chamber L:** Draw cards. <br> *TA Note:* Comment on how hard it was for the "0 chip" students to enter Chamber E. |
  | **15-30** | **Round 1** | Propose 3 Bills (Mix of Bridge/Reform). <br> **Crucial:** Give Chamber E 2 mins to "Caucus" before voting. Give Chamber L 30 seconds. <br> Vote. Tally WP. |
  | **30-35** | **Reset** | Chamber E pays 2 chips to stay (or loses seat). Distribute Seniority Chips. <br> Chamber L returns all cards (Full Rotation). New draw. |
  | **35-50** | **Round 2** | Propose 3 Bills. <br> **Twist:** Announce that "The Public" is angry about gridlock. Bills now pass if *Either* Chamber votes Yes (Unicameral override). <br> *Why?* This tests if Chamber L will take responsibility without Chamber E's cover. |
  | **50-60** | **Round 3** | **Staggered Lot:** Chamber L keeps 6 members, draws 6 new. <br> Propose 3 Bills (Heavy on "Reform" bills that require long-term thinking). |
  | **60-75** | **Debrief** | Reveal the mechanics. Map to theory. |

  ---

  ### 4. Payoff Scheme
  *   **Collective Pot:** If Total WP > 150, everyone gets a candy bar. (Creates pressure for Type 2 Bills).
  *   **Individual Pot:** Chamber E members who secure 3+ CP get a "Gold Star" (nominal prize).
  *   **The Trap:** Type 1 Bills (Bridge) generate high CP for E, but drain Total WP. Type 2 Bills (Reform) boost Total WP but give E no CP.
  *   **Expected Outcome:** Chamber E will block Type 2 bills or demand Type 1 bills to secure their seats. Chamber L will vote for Type 2, but might be overruled in Round 1 & 2.

  ---

  ### 5. The Debrief (The "Sortition" Reveal)
  *Do not start by saying "This was about sortition." Start by asking them what they felt.*

  1.  **The Experience of Chamber E:** "How did you decide how to vote on the Reform Bill?"
      *   *Target Answer:* "I wanted to pass it, but I needed points to keep my seat."
      *   *Theory:* **Electoral Connection.** Legislators are not policy maximizers; they are vote maximizers.
  2.  **The Experience of Chamber L:** "Did you feel less pressure? Did you feel ignored?"
      *   *Target Answer:* "I didn't care about re-election, so I voted for the good of the room." / "My vote didn't matter because E blocked it."
      *   *Theory:* **Independence vs. Accountability.**
  3.  **The Inequality:** Ask the Chamber E students who started with 0 chips. "How did you get a seat?"
      *   *Target Answer:* "I couldn't." or "I had to promise favors to rich students."
      *   *Theory:* **Barriers to Entry / Wealth Bias.**
  4.  **The Reveal:** "In political science, Chamber L is called **Sortition** (selection by lot). Chamber E is **Election**."
  5.  **Mapping:**
      *   **Election:** Good for accountability (you can fire them), bad for public goods (short-termism), high barrier to entry (money).
      *   **Sortition:** Good for descriptive representation (mirrors the room), good for long-term public goods, bad for expertise/accountability (can't fire them mid-term).
      *   **Staggered Lot (Round 3):** Did the returning L members vote differently? (Tests **Institutional Memory**).

  ---

  ### 6. Predictable Failure Points (And Fixes)

  **1. The "Math Bog-Down"**
  *   *Risk:* Students spend 10 minutes calculating WP impact per bill.
  *   *Fix:* Project the math. "Bridge = +10 for 3 people, -2 for 21 people. Net Loss. Reform = +3 for 24 people. Net Gain." Make the utilitarian choice obvious so the *political* choice stands out.

  **2. Chamber L Disengagement**
  *   *Risk:* If Chamber E blocks everything, Chamber L gets bored.
  *   *Fix:* In Round 2, give Chamber L the "Override" power (as written in the timeline). This forces them to take responsibility. If they fail to pass Type 2 bills even with sole power, that's a great debrief point about *culture* vs. *rules*.

  **3. The "Rich Student" Dominance**
  *   *Risk:* The 4 students with 5 chips dominate Chamber E entirely.
  *   *Fix:* Allow "Coalitions." Two students with 0 chips can pool chips to buy *one* seat and share the CP. This forces coalition building.

  **4. Cynicism**
  *   *Risk:* Students realize the game is rigged against the Public Good and just laugh.
  *   *Fix:* Frame the "Party Coffer" (you) as a neutral state mechanism. If they fail the Total WP goal, *you* don't give out the candy. Make the loss real (mildly).

  ---

  ### 7. What This Game Can't Show (Honest Limitations)
  You suspected this, and you are right. Be explicit about this in the debrief so they don't leave thinking Sortition is a magic bullet.

  1.  **Deliberation:** The game forces *voting*, not *talking*. Real sortition assemblies (like Citizens' Assemblies in Ireland/UK) work because they have **staff, experts, and time to deliberate**. Your Chamber L just voted instinctively.
      *   *Lesson:* Sortition without deliberation support is just random voting.
  2.  **Expertise:** A random room might not know how to fix a tax code. Elections (theoretically) allow for career politicians who learn the details.
      *   *Lesson:* Sortition is better for *values* (what do we want?), Elections (sometimes) better for *technicality* (how do we build it?).
  3.  **Factionalism:** In the game, Chamber E is a monolith. In reality, parties organize elections. Sortition is supposed to break parties, but informal cliques might form anyway.
  4.  **The "Seniority" Trap:** In your game, Seniority = Chips. In reality, Seniority = Power. This creates an entrenched elite in the Elected chamber that is hard to dislodge, which is a valid critique of elected systems (incumbency advantage).

  ### TA Cheat Sheet for "Invisible" Guidance
  *   **If Chamber E passes too many Public Goods:** Whisper to the "insecure" members (those with low chips), "Remember, you need 3 CP to keep your seat next round."
  *   **If Chamber L is too passive:** Remind them, "The Total WP goal applies to everyone. If E fails, you lose your candy too."
  *   **If someone says 'Sortition':** "Hold that thought for the end. Let's call it Method B for now."

  This setup keeps the admin light, forces the inequality issue immediately, and creates the specific tension (Credit Claiming vs. Public Good) you want them to feel. Good luck.
