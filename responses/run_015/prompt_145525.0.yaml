answer: |-
  The non-identity problem undermines person-affecting views without destabilizing impersonal aggregation, because the challenge of defining a reference class concerns independent meta-ethical questions about moral status rather than the logical coherence of comparing disjoint populations across possible worlds. Impersonal principles bypass the non-identity problem precisely by abandoning the requirement to track specific individuals across counterfactual scenarios, focusing instead on comparing the aggregate value of distinct states of affairs. While you must define which beings possess moral value to calculate an average or total, this scope of moral concern is a prerequisite for any ethical theory and does not become arbitrary simply because the specific identities within that scope are contingent on the choice made. The non-identity problem demonstrates that identity cannot ground obligations, but it does not suggest that the category of "sentient being" or "person" lacks the stability required for impersonal calculation. Consequently, while impersonal utilitarianism faces its own distinct paradoxes regarding variable population sizes, such as the Repugnant Conclusion, these arise from the mechanics of aggregation rather than the identity-based reference class worries you describe. The non-identity problem therefore functions as a motivation for adopting impersonal principles rather than a defeater for them, as it removes the only competing framework that relies on fixed individual identities.
