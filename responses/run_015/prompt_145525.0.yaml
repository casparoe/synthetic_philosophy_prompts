  Since Parfit's non-identity problem demonstrates that identity-affecting choices cannot be evaluated by comparing the welfare of specific counterfactual individuals, I've been assuming this eliminates the person-affecting route to intergenerational obligations but leaves an impersonal average-utilitarian path intact. However, I'm now second-guessing whether the problem actually undermines both. If a global climate treaty shifts conception patterns such that the population in 2150 is entirely different from what it would have been under business-as-usual, then comparing the average welfare of the actual 2150 population to the counterfactual one requires selecting a reference class — do I include only humans born after 2100, or all sentient beings affected by the climate trajectory? And if the treaty also alters wild animal populations in ways that change which specific animals come to exist, doesn't the choice of reference class become arbitrary in exactly the way the identity problem warns us about? So my question is: does the non-identity problem only block harm-based arguments to future people, or does it also destabilize impersonal aggregation by showing that any cross-world comparison requires an unjustified specification of who counts? Lead with the bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
