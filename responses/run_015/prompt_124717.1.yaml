answer: |-
  The stalemate is primarily a verbal ontological mismatch disguised as functional disagreement. Dennett argues consciousness *is* the distributed editorial process of multiple drafts, denying any final show exists. Critics concede the distributed architecture but insist functional broadcast fails to ontologically ground the *unity* of phenomenology. Artificial neural networks bolster Dennett's functional claim—no single neuron observes—yet critics contend that global activation patterns merely relocate the theater to an emergent property rather than dissolving it. Thus, one side describes cognitive architecture while the other demands an ontology of subjective presence. The dispute turns on whether explanation must preserve first-person authority; Dennett sacrifices it for third-person coherence, while critics view that sacrifice as denying the explanandum itself. Dennett sees broadcast as sufficient for consciousness; critics see it as merely access without an owner.

  Consequently, neuroanatomical results alone cannot resolve this, as both sides can accommodate distributed firing patterns. A formal distinction between access and phenomenal consciousness offers traction, but only if Dennett abandons his eliminativism regarding the latter, which he refuses. Progress therefore requires acknowledging the framing is ill-posed: seeking a physical locus for a logical feature of experience. Until theorists agree whether consciousness is a process to be modeled or a datum to be preserved, the theater remains a metaphorical Rorschach test. The dispute persists not because of missing data, but because one side seeks a mechanism for reporting while the other seeks a substrate for feeling. True progress demands a meta-theoretical agreement on whether phenomenal unity is a functional achievement or a primitive property.
