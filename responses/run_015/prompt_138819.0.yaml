prompt: |-
  I am the scientific secretary and non-voting chair of the review panel for a national research council's mid-sized investigator grants. We run three cycles a year. Each cycle is two and a half days, twelve panelists, roughly seventy proposals, and about six million dollars; our ranked list then goes to a council that can and occasionally does send it back. The panelists are senior working researchers who are paid nothing, receive no training in judgement and decision making, and are rotated a third at a time, so I can assume neither continuity nor shared vocabulary, and I cannot add a training day or a second pass over the batch. What I can change is the procedure inside the room and the schedule going in, provided I can defend each change on a single page to a council of non-specialists and to panelists who will resent anything that feels like bureaucracy.

  Our current process, in the order it happens: two lead reviewers per proposal read it in full and send me written pre-scores forty-eight hours ahead; the other panelists receive the abstract and a one-page summary of the leads' comments. I open each item with a one-sentence characterisation of where I think it sits. Discussion then runs in a fixed seating order, after which scores are entered sequentially on a shared screen with the running mean visible, and any score diverging by more than 1.5 points from that mean must be accompanied by a typed justification. Proposals are scheduled grouped by host institution, so the panel frequently hears four or five from the same university in a row. One panelist each cycle participates asynchronously and posts written comments that the room reads before anyone speaks. There is no feedback loop: we learn what we got right years later, if at all.

  I would like a decision procedure, not an exposition of the theory. What I have in mind has three parts.

  First, a real-time diagnostic: an ordered set of questions I can run in about ninety seconds, using only what is observable in the room plus the pre-scores that only I hold, that sorts the current state of a proposal into at least these buckets — genuine convergence on shared evidence; an informational cascade; reputational or conformist herding; structurally mandated deference to the lead reviewers, who are the only people who have read the thing; and spillover from a neighbouring proposal or from the run of items from the same institution. For each question, state what observable would count as a sufficient positive, what that question cannot in principle distinguish from what it is meant to detect, where the procedure simply stops with "no intervention", and where it must hand the decision back to a person because the issue is one of values rather than facts.

  Second, a remedial ladder: an ordered menu of interventions from least to most intrusive, each attached to the diagnosis that triggers it, with what it costs in minutes, in goodwill, and in information. The standard literature distinguishes herding that comes from people rationally discounting their own private signals against a public record from herding that comes from the social cost of being seen to be wrong; keep that distinction wherever it changes what I should actually do, and say explicitly where the remedies for the two pull in opposite directions, which one governs when both diagnoses are live, and why.

  Third, the ex ante fixes: what I should change before the next cycle, and in what order of priority, given a one-page justification budget and a panel that will not tolerate extra form-filling. Please rule specifically on the deviation-and-justification rule, on speaking order, on whether and when I should speak at all, on the institutional grouping in the schedule, and on the asynchronous panelist whose comments are read first and cannot be cross-examined.

  Then please run the procedure on three cases. Case A: the first speaker, a well-known and well-liked figure, gives a proposal a nine and a confident rationale; the next five come in between eight and nine with reasons that are recognisably paraphrases of his; the two lead reviewers' private pre-scores, which I alone hold, were six and four. Tell me what I do in the next five minutes, and in particular whether and how I use the pre-scores. Case B: a proposal that everyone has in fact read, in an area where this particular panel is unusually expert, and which is genuinely in the top decile of the batch — the false-positive control, where I need the procedure to output "leave it alone" and to tell me which observable does that work. Case C: an unfashionable cross-disciplinary proposal from an early-career investigator at an institution nobody has heard of, scheduled immediately after a run of five strong proposals from our flagship university, which the panel is drifting toward rejecting in a way that looks to me like nobody wanting to be the person who championed a soft topic. I think it is good and my instinct is to rescue it. I want the procedure's answer, and I want you to take seriously that the honest answer may be that I should not intervene, or should intervene only through a mechanism that binds me equally when I am wrong: tell me what a discretionary rescue by the chair teaches the panel about how to read my interventions, and what that does to the process over the remaining day and a half.

  Finally, tell me what the procedure cannot do. I am aware that we have no ground truth within a cycle, that a correct convergence and a lucky cascade are indistinguishable from the outcome of one meeting, and that nothing in this fixes errors that the whole panel shares because the whole field shares them. Say where the procedure will misfire, which of its steps are judgement calls dressed up as procedure, and which parameter — I suspect something like our tolerance for funding risky proposals at the expense of safe ones — is a value choice that the procedure should surface and then leave to the council rather than settle for them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Scientific Secretary and Non-Voting Chair of a review panel for a national research council.
      *   **Constraints:** 3 cycles/year, 2.5 days/cycle, 12 panelists (rotated 1/3 at a time), ~70 proposals, $6M budget. No pay/training for panelists. No extra days/passes.
      *   **Authority:** Can change internal procedure and schedule, but must justify on a single page to non-specialist council and resistant panelists.
      *   **Current Process:** 2 lead reviewers (pre-scores 48h ahead), others see abstract + 1-page summary. Chair opens with 1-sentence characterization. Fixed seating order discussion. Sequential scoring with visible mean + justification for >1.5 deviation. Grouped by institution. 1 asynchronous panelist (comments read first). No feedback loop.
      *   **Goal:** A decision procedure (not theory) with three parts: Real-time Diagnostic, Remedial Ladder, Ex Ante Fixes. Plus application to 3 cases and limitations.
      *   **Tone:** Professional, precise, actionable, respectful of constraints (time, goodwill), acknowledging the political/social dynamics of peer review.

  2.  **Deconstruct the Request:**

      *   **Part 1: Real-time Diagnostic (90 seconds):**
          *   Inputs: Observable room behavior + Chair-held pre-scores.
          *   Outputs: Buckets (Convergence, Cascade, Herding, Deference, Spillover).
          *   Requirements: Observables for positives, limitations (what it can't distinguish), stop conditions, value vs. fact hand-offs.
      *   **Part 2: Remedial Ladder:**
          *   Ordered interventions (least to most intrusive).
          *   Costs (time, goodwill, info).
          *   Distinction: Rational herding (discounting private signal) vs. Social herding (cost of being wrong).
          *   Conflict resolution: What if remedies oppose?
      *   **Part 3: Ex Ante Fixes:**
          *   Priority order.
          *   Specific rulings on: Deviation rule, Speaking order, Chair speech, Institutional grouping, Asynchronous panelist.
          *   Constraint: One-page justification budget.
      *   **Part 4: Case Studies:**
          *   Case A (Influence/Deference mismatch): Lead speaker 9, others 8-9, Lead pre-scores 6/4. Action? Use pre-scores?
          *   Case B (False Positive Control): Genuine top decile, everyone read it. Output: "Leave alone." Which observable?
          *   Case C (Context/Contrast Effect): Unfashionable, ECI, unknown uni, after 5 flagship unis. Chair wants to rescue. Procedure's answer? Risk of chair intervention?
      *   **Part 5: Limitations:**
          *   What it can't do (ground truth, shared field errors).
          *   Judgement calls disguised as procedure.
          *   Value choices to leave to Council.

  3.  **Drafting - Section by Section:**

      *   **Part 1: Diagnostic:** Needs to be fast. I need specific questions.
          *   *Q1: Variance vs. Mean.* (Detects Cascade/Herding).
          *   *Q2: Argument Novelty.* (Detects Parroting/Deference).
          *   *Q3: Pre-score Delta.* (Detects Information Asymmetry).
          *   *Q4: Sequencing.* (Detects Spillover).
          *   *Constraint:* 90 seconds. Keep it to a checklist.
          *   *Limitation:* Can't distinguish "everyone agrees" from "everyone is wrong together."

      *   **Part 2: Remedial Ladder:**
          *   *Level 1 (Nudge):* Invite dissent specifically. (Low cost).
          *   *Level 2 (Structure):* Break speaking order / Silent scoring first. (Med cost).
          *   *Level 3 (Information):* Reveal pre-score range (not names). (High cost/Goodwill risk).
          *   *Rational vs. Social Herding:* Rational = give more info. Social = anonymous scoring / private voting.
          *   *Conflict:* If Rational says "inform" but Social says "hide identity," prioritize Social if the goal is independent judgement, but Rational if the goal is accuracy. Actually, for peer review, accuracy via independent judgement is key. If social pressure is high, anonymity helps. If info asymmetry is high, revealing lead scores helps.
          *   *Decision:* Prioritize breaking social pressure first (Level 1/2), then info asymmetry (Level 3).

      *   **Part 3: Ex Ante Fixes:**
          *   *Deviation Rule:* Keep it, but hide the *running mean*. Visible mean causes anchoring.
          *   *Speaking Order:* Randomize or reverse seniority. Fixed order is bad.
          *   *Chair Speech:* Eliminate the opening characterization. It anchors.
          *   *Institutional Grouping:* **Stop immediately.** Major source of contrast bias.
          *   *Asynchronous:* Integrate them. Don't read comments first. Let them vote live or integrate text into the packet without attribution.
          *   *Justification:* Focus on "reducing bias to maximize ROI of $6M."

      *   **Part 4: Cases:**
          *   *Case A:* High scores vs. Low Pre-scores. Clear Deference/Cascade. *Action:* Intervene. Do not reveal specific pre-scores (breach trust). Reveal *existence* of divergence. "Lead reviewers had significant concerns not yet reflected."
          *   *Case B:* Top decile, high agreement. *Action:* No intervention. *Observable:* High variance in *praise* but low variance in *score*, plus novel arguments from multiple speakers.
          *   *Case C:* Contrast effect. *Action:* Do not rescue personally. Use procedure. Shuffle schedule (Ex Ante). In room: "Let's ensure we are judging this on its own merits relative to the rubric, not the previous hour." If Chair rescues, it politicizes the chair.

      *   **Part 5: Limitations:**
          *   No ground truth.
          *   Shared field bias (the "blind spot").
          *   Value choices (Risk vs. Safety) belong to Council.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Needs to be operational. "Decision procedure, not exposition."
      *   *Constraint Check:* Did I answer the specific questions about the deviation rule, speaking order, etc.? Yes.
      *   *Case A Nuance:* The user holds pre-scores (6 and 4). The room sees 9, 8, 8... This is a massive information asymmetry. If I say nothing, money is wasted. If I reveal scores, leads are exposed. *Solution:* "I note a significant divergence between the discussion and the written record."
      *   *Case C Nuance:* The user asks about the cost of chair intervention. If I save this one, do they expect me to save others? Yes. It undermines the panel. I must use a procedural intervention, not a substantive one.
      *   *Formatting:* Use bolding, lists, and clear headers to make it skimmable (like a one-pager).

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Suggest anonymous voting. *Correction:* User says "scores entered sequentially on shared screen." Changing to anonymous might be too much tech/logistics friction for "one page justification." Better to suggest *blind* entry (no running mean) first.
      *   *Initial thought:* Tell Chair to speak last. *Correction:* Chair is non-voting. Chair should speak only to manage process, not content.
      *   *Refining the Diagnostic:* Make sure the 90-second limit is realistic. It needs to be a mental checklist, not a survey.
      *   *Refining Case A:* The prompt asks "whether and how I use the pre-scores." I cannot reveal the numbers (confidential). I can reveal the *fact* of divergence.
      *   *Refining Case C:* The prompt asks about "discretionary rescue." I need to be hard-nosed here. A rescue undermines the system.

  6.  **Final Review against constraints:**
      *   Single page justification mindset? (Keep arguments tight).
      *   No training/continuity assumed? (Procedures must be robust to new people).
      *   Non-voting chair? (Ensure interventions don't look like voting).

  7.  **Final Polish:** Check the "Rational vs. Social Herding" distinction in the Ladder. This is a specific request.
      *   Rational Herding: "I think it's bad, but 5 experts said good, so I trust them." -> Remedy: Validate private signals.
      *   Social Herding: "I think it's bad, but I don't want to fight the room." -> Remedy: Safe dissent channels.
      *   Conflict: Validating private signals might increase social pressure if the signal is "I disagree with the expert." Remedy: Prioritize Social safety (dissent) first, then Information.

  8.  (Proceed to generate output based on these thoughts.)
answer: |-
  # THE PANEL INTEGRITY PROTOCOL (PIP)

  ## PART 1: REAL-TIME DIAGNOSTIC (90-SECOND CHECKLIST)
  *Run mentally during the first three speakers. Do not write this down.*

  **Q1: The Variance Check**
  *   **Observable:** Are the first three spoken scores within 0.5 points of each other?
  *   **Positive:** Yes.
  *   **Limit:** Cannot distinguish *Genuine Convergence* from *Cascade*.
  *   **Action:** If **No** (Variance > 1.0), stop. This is **Genuine Convergence on Shared Evidence** (or healthy debate). **No Intervention.**

  **Q2: The Argument Novelty Check**
  *   **Observable:** Do speakers 2 and 3 introduce new evidence/criteria, or do they paraphrase Speaker 1?
  *   **Positive:** Paraphrase dominates ("As X said...", "I agree with X's point on...").
  *   **Limit:** Cannot distinguish *Reputational Herding* (fear of looking wrong) from *Rational Herding* (trusting a senior signal).
  *   **Action:** If **Positive**, proceed to Q3.

  **Q3: The Lead Reviewer Delta (Chair Eyes Only)**
  *   **Observable:** Compare the room's emerging mean against your held pre-scores from the two lead reviewers.
  *   **Positive:** Room mean differs from Lead Mean by > 2.0 points.
  *   **Limit:** Cannot distinguish *Information Asymmetry* (room hasn't read it) from *Deference* (room ignoring leads).
  *   **Action:** If **Positive**, this is **Structurally Mandated Deference**. **Intervention Required.**

  **Q4: The Sequence Check**
  *   **Observable:** Is this Proposal N, where Proposals N-1 through N-3 were from the same institution or same sub-field?
  *   **Positive:** Yes.
  *   **Limit:** Cannot distinguish *Spillover* (contrast effect) from *Field Saturation* (genuine cluster of quality).
  *   **Action:** If **Positive**, this is **Spillover/Contrast Bias**. **Intervention Required.**

  **Q5: The Value Hand-off**
  *   **Observable:** Is the disagreement about *merit* (facts/methods) or *priority* (risk vs. safety, topic importance)?
  *   **Positive:** Disagreement is about priority.
  *   **Limit:** Procedure cannot resolve value conflicts.
  *   **Action:** **Stop.** Hand decision to Panel. Chair notes: "This is a strategic choice for the Council, not a factual error."

  ---

  ## PART 2: REMEDIAL LADDER
  *Interventions ordered by intrusiveness. Apply the lowest rung that addresses the Diagnosis.*

  | Level | Intervention | Trigger Diagnosis | Cost (Time/Goodwill/Info) | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The "Private Signal" Invite**<br>"Before we align, does anyone have a concern based on their own reading that hasn't been voiced?" | Rational Herding (Discounting private signal) | 1 min / Low / Low | Validates private information without attacking public consensus. |
  | **2** | **The "Blind" Pause**<br>Stop discussion. 2 minutes silent re-reading of abstract/leads. Scores entered *without* visible mean. | Social Herding (Fear of social cost) | 3 min / Med / Med | Removes the public anchor. High goodwill cost (implies panel is rushing). |
  | **3** | **The "Record Divergence" Notice**<br>"The written record shows significant divergence from this discussion. Please ensure you are weighing the text, not the room." | Structural Deference / Information Asymmetry | 1 min / High / High | Hints at pre-scores without breaching confidentiality. Risks undermining Lead Reviewers. |
  | **4** | **The "Reset" (Nuclear)**<br>"We are flagging this for late-cycle recalibration. Move to next item." | Spillover / Unresolvable Bias | 5 min+ / Very High / Low | Admits process failure. Use only if funding decision is compromised. |

  **Conflict Protocol: Rational vs. Social Herding**
  *   **The Conflict:** Rational herding remedies require *more* information (e.g., revealing lead scores). Social herding remedies require *less* public exposure (e.g., anonymous voting).
  *   **The Rule:** When both are live, **Social Herding governs.**
  *   **Why:** A panelist who feels socially safe will eventually voice their private signal (solving Rational Herding). A panelist who feels socially unsafe will never speak, regardless of how much data they have.
  *   **Exception:** If the error is purely factual (e.g., panel missed a methodological flaw in the text), use Level 3 (Record Divergence) to correct the data, but do so neutrally.

  ---

  ## PART 3: EX ANTE FIXES (Priority Order)
  *Justification for Council/Panel: "Reducing noise to maximize ROI on $6M."*

  1.  **INSTITUTIONAL GROUPING: ELIMINATE.**
      *   **Change:** Randomize proposal order.
      *   **Justification:** Contrast bias is the single largest documented error in sequential judging. Grouping by university creates artificial "strong/weak" runs that distort scoring.
  2.  **THE RUNNING MEAN: HIDE IT.**
      *   **Change:** Scores enter sequentially but are revealed only after all are cast.
      *   **Justification:** The visible mean anchors subsequent voters. The deviation rule is useful, but only if the anchor isn't visible *during* voting.
  3.  **SPEAKING ORDER: RANDOMIZE.**
      *   **Change:** Draw names or reverse seniority.
      *   **Justification:** Fixed order privileges early speakers (anchoring) and seniors (reputation).
  4.  **CHAIR OPENING: SILENCE.**
      *   **Change:** Chair does not offer a characterization.
      *   **Justification:** Non-voting chair commentary functions as a super-anchor. Your role is process, not content.
  5.  **ASYNC PANELIST: INTEGRATE.**
      *   **Change:** Their comments are anonymized and merged into the lead summary, or they vote live via video link during discussion.
      *   **Justification:** Reading static text first creates a "ghost anchor" that cannot be cross-examined, violating the principle of deliberative equality.
  6.  **DEVIATION RULE: KEEP BUT MODIFY.**
      *   **Change:** Keep the 1.5 justification rule, but require justification *before* the score is locked, not after.
      *   **Justification:** Post-hoc justification invites rationalization. Pre-lock justification forces reasoning.

  ---

  ## PART 4: CASE RUNS

  ### CASE A: The Cascade (Room 9s vs. Leads 4/6)
  *   **Diagnosis:** Structural Deference + Rational Herding. The room is deferring to the first speaker (Reputation) and discounting the leads (who are not speaking first).
  *   **Action:** **Level 3 Intervention (Record Divergence).**
  *   **Use of Pre-scores:** Do **not** reveal the numbers (4 and 6). This breaches the confidentiality of the lead reviewers and exposes them to retribution.
  *   **Script:** "I need to pause us. The written record from the lead reviewers contains significant reservations that are not reflected in this discussion. Please take two minutes to re-read the lead summary before finalizing scores."
  *   **Why:** This forces the room to engage with the text (the only shared truth) without making it a fight between the Room and the Chair. It solves the Information Asymmetry without creating a Social Battle.

  ### CASE B: The False-Positive Control (Genuine Top Decile)
  *   **Diagnosis:** Genuine Convergence.
  *   **Action:** **No Intervention.**
  *   **Observable:** High agreement on score, **but** high variance in *reasoning*. Speaker 1 praises method; Speaker 2 praises impact; Speaker 3 notes risk but accepts it.
  *   **Why:** In genuine convergence, the *arguments* diversify even if the *scores* converge. In a cascade, the arguments parrot. If the arguments are novel and specific, the score is robust. Leave it alone.

  ### Case C: The Contrast Effect (Unfashionable ECI after Flagship Run)
  *   **Diagnosis:** Spillover/Contrast Bias + Social Herding (fear of championing "soft" topic).
  *   **Action:** **Level 1 Intervention (Private Signal Invite) + Ex Ante Fix.**
  *   **Script:** "We have just reviewed five proposals from [Flagship]. Let's ensure we are resetting the baseline. Does anyone see merit in this proposal that might be obscured by the previous comparisons?"
  *   **On Chair Rescue:** **Do not rescue personally.**
  *   **Risk:** If you champion this proposal, you teach the panel that the Chair's "process interventions" are actually "substantive hints." Future interventions will be decoded as "The Chair wants this funded." This politicizes your neutrality.
  *   **Binding Mechanism:** If you intervene, you must intervene on *all* proposals showing the same diagnostic signature (e.g., low scores after a high run). If you save this one but not a similar one later, you introduce bias.
  *   **Verdict:** Use the script above to invite dissent. If no one bites, let it fail. A discretionary rescue by the Chair undermines the panel's ownership of the list, making them less likely to defend it to the Council later.

  ---

  ## PART 5: LIMITATIONS & FAILURE MODES

  **1. The Ground Truth Problem**
  *   **Limitation:** This procedure optimizes for *process integrity*, not *scientific correctness*. A panel can unanimously, procedurally perfectly, reject a Nobel-worthy idea.
  *   **Misfire:** The Diagnostic will classify a "Shared Field Error" (e.g., everyone ignores a new method) as "Genuine Convergence."
  *   **Mitigation:** None within the cycle. This requires the Council's feedback loop (which you noted is broken).

  **2. The Value Choice (Risk vs. Safety)**
  *   **Limitation:** The procedure cannot determine if a "9" is too safe or a "6" is too risky.
  *   **Judgement Call:** The tolerance for variance.
  *   **Council Hand-off:** You must surface this parameter. "Panel, are we optimizing for high-ceiling/high-risk or floor-stability?" If the Council sends the list back, it is usually because this value alignment was implicit, not explicit.
  *   **Recommendation:** Add one question to the pre-score sheet: "Risk Profile: High/Med/Low." If the funded list is 90% Low Risk, you have data to show the Council that the *Panel* chose safety, not the *Procedure*.

  **3. The Chair's Blind Spot**
  *   **Limitation:** You are part of the system. Your "90-second diagnostic" is subject to the same biases.
  *   **Judgement Call:** Deciding when to trigger Level 3 (Record Divergence).
  *   **Risk:** If you trigger it too often, you become the "Super Reviewer." If too rarely, you are a bystander.
  *   **Rule:** Trigger Level 3 only when the Pre-score Delta (Q3) exceeds 2.0 points. Hard rule. Remove your discretion.

  **4. The "No Training" Constraint**
  *   **Limitation:** Panelists will not read a manual.
  *   **Mitigation:** The interventions must be verbalized by you as *reminders of the rules*, not *new rules*. "As per our guidelines on bias..." (Even if the guideline was created yesterday).

  **Summary of Value Choice for Council:**
  The procedure ensures the score reflects the *panel's* independent judgement. It does not ensure the judgement is *right*. If the Council rejects the list, it should be because they disagree with the Panel's risk tolerance, not because the Panel was herd-biased. This procedure eliminates the latter so the Council can debate the former.
