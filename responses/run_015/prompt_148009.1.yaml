answer: |-
  Here is the comprehensive desiderata checklist for a theory of emotion, designed to stress-test the Judgment (Nussbaum), Perception (James-Lange/Prinz), and Feeling (Qualia) camps.

  ### The Desiderata Checklist

  To be viable, a theory of emotion must account for the following phenomena. I have flagged which are hard empirical/phenomenological constraints (**Non-Negotiable**) and which are theoretical preferences often mistaken for data (**Camp Prejudice**).

  #### 1. Intentionality (Aboutness)
  *   **Requirement:** Emotions are directed at objects or states of affairs (e.g., fear *of* the dog, anger *at* the insult).
  *   **Motivating Case:** You can't just "fear"; you must fear something. Even free-floating anxiety is usually about a vague threat.
  *   **Status:** **Non-Negotiable.** A theory that reduces emotion to a mere sensation (like an itch) fails to distinguish emotion from raw feeling.
  *   **Camp Prejudice Alert:** Cognitivists claim intentionality *requires* concepts/judgments. This is a prejudice. Perceptualists argue you can have non-conceptual intentionality (like seeing a shape without naming it).

  #### 2. Phenomenology (Qualia)
  *   **Requirement:** Emotions feel like something distinct from cold cognition. There is a "what it is like" to be angry.
  *   **Motivating Case:** A robot could make a judgment of danger without trembling or feeling heat. We intuitively deny it has "fear."
  *   **Status:** **Non-Negotiable.** Ignoring the felt quality makes it a theory of appraisal, not emotion.
  *   **Camp Prejudice Alert:** Feeling-theorists claim qualia are *sufficient* for emotion. This is a prejudice; qualia alone lack direction.

  #### 3. Recalcitrance (The Akrasia of Emotion)
  *   **Requirement:** Emotions can persist despite contradictory explicit judgments.
  *   **Motivating Case:** Fear of flying. You judge the plane is safe (statistically), yet you feel terror. Or, lingering dread after learning the shadow was just a coat rack.
  *   **Status:** **Non-Negotiable.** This is a robust psychological datum.
  *   **Camp Prejudice Alert:** Judgment theorists often try to explain this away as "unconscious judgments." This is often ad-hoc saving of the theory.

  #### 4. Motivational Force
  *   **Requirement:** Emotions prime or drive action (fight, flight, approach, withdraw).
  *   **Motivating Case:** Anger motivates confrontation; disgust motivates expulsion.
  *   **Status:** **Non-Negotiable.** Emotions are functional states, not just decorative mental paintings.
  *   **Camp Prejudice Alert:** James-Lange theorists claim the bodily action *is* the emotion. This is a prejudice; you can feel fear without running.

  #### 5. Cognitive Penetrability
  *   **Requirement:** Emotions should be responsive to new information (beliefs), but not instantly or perfectly.
  *   **Motivating Case:** Learning the gun is a toy reduces fear. But it doesn't always reduce it instantly (see Recalcitrance).
  *   **Status:** **Non-Negotiable.** Emotions are not reflexes (knee-jerk); they are sensitive to meaning.
  *   **Camp Prejudice Alert:** Strict Cognitivists claim emotions *are* beliefs. This fails the Recalcitrance test.

  #### 6. Distinction from Mood and Reflex
  *   **Requirement:** Must distinguish Emotion (short, intense, specific object) vs. Mood (long, diffuse, no specific object) vs. Reflex (instant, no appraisal).
  *   **Motivating Case:** Startle reflex (jumping at a bang) is not fear. Depression (mood) is not sadness (emotion).
  *   **Status:** **Non-Negotiable.** A theory that conflates these loses explanatory power.
  *   **Camp Prejudice Alert:** Constructionists (e.g., Barrett) argue these distinctions are folk psychology, not biological reality. This is controversial but empirically grounded in neuroscience.

  #### 7. The "Paradox of Fiction"
  *   **Requirement:** Must explain how we feel emotions for entities we know do not exist.
  *   **Motivating Case:** Grieving for a fictional character. You judge "this character is not real," yet feel sadness.
  *   **Status:** **Non-Negotiable.** A common human experience.
  *   **Camp Prejudice Alert:** Judgment theorists must claim we suspend disbelief (make a temporary judgment of reality). This feels forced.

  #### 8. Neuroscience Constraints (Bodily Feedback)
  *   **Requirement:** Must accommodate the role of the body (autonomic nervous system, facial feedback) without reducing emotion *only* to the body.
  *   **Motivating Case:** Paraplegics still feel emotion (damaging pure James-Lange), but Botox patients (cannot frown) report reduced depression (supporting feedback).
  *   **Status:** **Non-Negotiable.** Must fit the data: body matters, but isn't everything.
  *   **Camp Prejudice Alert:** "No bodily change = no emotion" is a James-Lange prejudice falsified by spinal cord injury cases.

  #### 9. Cross-Cultural Variability
  *   **Requirement:** Must account for universal physiological patterns vs. culturally specific labeling/experience.
  *   **Motivating Case:** Basic facial expressions (Ekman) are universal, but "Schadenfreude" or "Amae" are culturally specific concepts shaping the emotion.
  *   **Status:** **Non-Negotiable.** Must balance biology and construction.
  *   **Camp Prejudice Alert:** "All emotions are universal biological kinds" is a prejudice. "All emotions are social constructs" is also a prejudice.

  ---

  ### The Jointly Unsatisfiable Subset

  There is a genuine tension here. You cannot hold the following two claims simultaneously without significant theoretical gymnastics:

  1.  **Identity Claim:** Emotions are *identical* to conscious evaluative judgments (Strong Cognitivism/Nussbaum).
  2.  **Recalcitrance Datum:** Agents can experience an emotion while consciously judging the opposite to be true (e.g., "I judge this spider is harmless, but I feel fear").

  If Emotion = Judgment, then holding Judgment A (Safe) and Emotion B (Fear/Safe) is a contradiction in terms, like holding "It is raining" and "I judge it is not raining." To save the theory, Cognitivists must posit "unconscious judgments," but this risks making the theory unfalsifiable. **Perception Theory** resolves this by treating emotions like optical illusions: you can *see* the lines as different lengths (emotion) while *judging* they are the same (belief).

  ### Scoring the Three Camps

  *   **Judgment Theory (Nussbaum/Solomon):**
      *   *Strengths:* Nails Intentionality and Cognitive Penetrability. Explains why emotions can be rational/irrational.
      *   *Weaknesses:* Fails Recalcitrance (the "Flying Phobia" problem). Struggles with Infants/Animals (do they have complex concepts?). Struggles with Fiction (do we judge fiction as real?).
      *   *Verdict:* Intellectually clean, empirically brittle.

  *   **Perception Theory (Prinz/Damasio/James-Lange updated):**
      *   *Strengths:* Handles Recalcitrance perfectly (perceptions persist despite belief). Handles Phenomenology (bodily feelings). Handles Infants/Animals (non-conceptual content).
      *   *Weaknesss:* Intentionality is weaker (perceptions are less specific than judgments). Struggles to explain why emotions are subject to rational critique (you can't argue with a sensation).
      *   *Verdict:* Best fit for current cognitive science.

  *   **Pure Feeling Theory (Qualia/James-Lange Classic):**
      *   *Strengths:* Nails Phenomenology and Bodily constraints.
      *   *Weaknesses:* Fails Intentionality (a racing heart isn't *about* anything). Fails Distinction (can't distinguish fear from excitement easily without context).
      *   *Verdict:* Mostly abandoned in philosophy, kept in pop culture.

  ### The Knockout Requirement

  The single requirement that eliminates the most candidates (specifically the dominant historical contenders) is **Recalcitrance**.
  *   It eliminates **Strict Judgment Theory** (because you can't judge P and not-P).
  *   It eliminates **Pure Reflex Theory** (because recalcitrance implies a clash of systems, not just a stimulus-response).
  *   **Perception Theory** survives this best because perceptions (like illusions) are known to be recalcitrant to belief.

  However, **Intentionality** is the requirement that kills **Pure Feeling Theory** dead. If you have to pick the one that defines the domain of "emotion" vs "sensation," it is Intentionality. But in the context of your seminar debate (Nussbaum vs. Others), Recalcitrance is the active weapon.

  ### Comparison Table

  | Requirement | Motivating Case/Consideration | Negotiable (Yes/No) | Judgment View | Perception View | Feeling View |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Intentionality** | Fear must be *of* something. | No | **Pass** (Built-in) | **Pass** (Non-conceptual content) | **Fail** (Feelings aren't about things) |
  | **Recalcitrance** | Fear of flying despite knowing safety. | No | **Fail** (Contradiction) | **Pass** (Like optical illusions) | **Partial** (Feelings linger, but why?) |
  | **Phenomenology** | Emotions feel distinct from thoughts. | No | **Partial** (Judgments can be dry) | **Pass** (Bodily feeling is central) | **Pass** (Core commitment) |
  | **Motivation** | Anger drives confrontation. | No | **Partial** (Judgments motivate weakly) | **Pass** (Action-ready states) | **Fail** (Feelings don't necessitate action) |
  | **Cognitive Penetrability** | Learning truth reduces fear. | No | **Pass** (Changing judgment changes emotion) | **Partial** (Top-down modulation possible but slow) | **Fail** (Feelings independent of thought) |
  | **Fiction Paradox** | Grief for fictional characters. | No | **Fail** (Requires false belief of reality) | **Pass** (Imagined perception triggers response) | **Partial** (Feelings real, object nonexistent) |
  | **Neuroscience (Body)** | Role of amygdala/visceral feedback. | No | **Fail** (Often ignores bodily necessity) | **Pass** (Integrates bodily feedback) | **Pass** (But overstates it) |
  | **Infant/Animal Emotion** | Dogs feel fear without language. | No | **Fail** (Requires concepts) | **Pass** (Non-conceptual perception) | **Pass** (Raw feeling) |

  ```json
  {
    "unsatisfiable_pair": "Emotions are identical to conscious judgments AND Recalcitrant emotions exist (feeling contrary to judgment)",
    "knockout_requirement": "Recalcitrance (Emotion-Judgment Mismatch)",
    "best_fit_view": "Perception Theory"
  }
  ```
