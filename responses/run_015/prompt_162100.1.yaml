answer: |-
  Here is the brainstorming filter you requested, followed by the carve-up.

  **Discarded Concepts:**
  *   **Contextuality:** I discarded this because it refers to incompatibility of measurements on a *single* system, whereas your puzzle is specifically about correlations between *spatially separated* systems.
  *   **Ontic vs. Epistemic:** I discarded this because it distinguishes whether the state represents reality or knowledge, which doesn't resolve the specific structural difference between signaling, dependence, and setting correlations.
  *   **Relativistic Causality:** I discarded this as too broad; it forbids signaling, but doesn't distinguish the hidden dependencies that Bell's theorem isolates.

  ***

  You have identified a genuine structural layering in the foundations of quantum mechanics. The confusion isn't equivocation; it is the result of three distinct constraints being bundled together under the loose label of "locality." To see the boundaries, we must separate **what you can see**, **what determines the outcome**, and **where the settings come from**.

  Here are the three established notions you are tracking.

  ### 1. Signal Locality (The "No Messaging" Constraint)
  This is the operational constraint. It says that the statistical distribution of outcomes at your detector cannot be changed by anything I do at my detector. If I switch my setting, your histogram of flashes remains identical.
  *   **Why it matters:** This is required by Special Relativity. If this were violated, you could send messages faster than light.
  *   **Status:** Quantum mechanics respects this. Both Case 1 and Case 2 in your description respect this.

  ### 2. Parameter Independence (The "No Influence" Constraint)
  This is the ontological constraint. It says that the *physical mechanism* producing the outcome at your detector does not depend on the setting chosen at my detector. Even if the statistics average out to look the same (preserving Signal Locality), the specific outcome in a single run might still be physically driven by my choice.
  *   **Why it matters:** This captures the intuition of "action at a distance." If your outcome is *generated* by a process that reaches out and grabs my setting, there is a physical link across the gap, even if noise hides it from view.
  *   **Status:** Quantum mechanics respects this at the level of the wavefunction, but any *hidden variable theory* (like your "instructions" case) that reproduces quantum predictions **must violate this**. This is the "nonlocality" charged in Case 1 and 2.

  ### 3. Measurement Independence (The "No Conspiracy" Constraint)
  This is the statistical constraint regarding the source. It says that the hidden variables (the "instructions" emitted by the source) are statistically independent of the future choices of detector settings.
  *   **Why it matters:** This assumes the experimenter is free to choose settings regardless of what the particle source did in the past.
  *   **Status:** This is the constraint violated in your Case 3.

  ### The "Slide" You Noticed
  The sliding you sense between Case 1 and Case 2 is the gap between **Signal Locality** and **Parameter Independence**.

  Philosophers of physics often call this the distinction between **Operational Locality** (what we can observe/use) and **Ontological Locality** (what exists underneath). It is not equivocation to say a theory is "nonlocal" yet "no-signaling." It means the underlying machinery reaches across the gap (violating Parameter Independence), but the statistics are rigged such that you cannot exploit that reach to send a bit (preserving Signal Locality).

  Think of it like two synchronized clocks. If I tweak my clock, and your clock instantly tweaks itself to match, that is nonlocal dependence (violating Parameter Independence). But if the tweak is random noise that you can't distinguish from normal ticking, I cannot send you a message (preserving Signal Locality). The dependence is real; the control is absent.

  ### Why Case 3 is Not "Nonlocal"
  Your third observation is the sharpest. If dependence between distant things is "nonlocal," why is dependence between the Source and the Detector Setting called "conspiracy" instead?

  The distinction is **Causal Direction**, not just spatial separation.
  *   **Nonlocality (Cases 1 & 2):** The dependence runs *across* the spacelike gap between the two wings *during* the measurement. Event A influences Event B while they are causally disconnected.
  *   **Measurement Dependence (Case 3):** The dependence runs from a **common past** into both the source and the settings. The source's instructions and the experimenter's choice are correlated because they share a common cause in their past light cones (or via retrocausality).

  Because the correlation in Case 3 can be explained by events in the past (within the light cone), it does not require a signal to jump across the spacelike gap during the experiment. It is "local" in the sense that no influence travels faster than light; it is merely "deterministic" in a way that removes experimental freedom. Hence, it is labeled "superdeterminism" or "conspiracy" rather than "nonlocality."

  ### What Bell's Result Forces You to Give Up
  Bell's theorem proves you cannot hold all three constraints simultaneously while matching quantum predictions. You must break at least one link:

  1.  **Break Parameter Independence:** Accept **Nonlocality**. The particles influence each other across the gap, but nature hides this influence to prevent signaling. (This is the standard "orthodox" sacrifice).
  2.  **Break Measurement Independence:** Accept **Superdeterminism**. The particles and the experimenters are coordinated by the past, so the settings aren't truly free variables. (This saves locality but costs experimental freedom).
  3.  **Break Signal Locality:** Accept **Faster-than-light signaling**. (This is almost universally rejected as it breaks Relativity).

  ### Summary Definition
  The phenomenon you are tracking is the **Separation of Operational and Ontological Independence**.

  *   **Boundary Case (Is this phenomenon?):** A theory where outcomes depend on distant settings (Ontological dependence) but marginal probabilities do not (Operational independence). **Yes.**
  *   **Boundary Case (Is NOT this phenomenon):** A theory where outcomes depend on distant settings *and* marginal probabilities change. **No,** this is signaling, not just nonlocality.
  *   **Boundary Case (Is NOT this phenomenon):** A theory where the source correlates with settings via a past common cause. **No,** this is Measurement Dependence, not Nonlocality, because the causal path stays within the light cone.

  Bell forces you to choose between a world that is **locally causal but conspiratorial** (Case 3) or **nonlocally connected but operationally silent** (Cases 1 & 2). You cannot have both local causality and experimental freedom.
