answer: |-
  Summary
  This procedure isolates "desert" (what a person merits based on controlled effort) from entitlement (rules), consequence (future incentives), and expression (public messaging). It uses a seven-step filter to determine if an allocation tracks desert or if a legitimate override applies. Each step requires a written stipulation to prevent infinite regress regarding luck or past bias. The procedure forces the committee to record when desert is overridden, ensuring the justification to the applicant does not lie about why they were passed over. It deliberately refuses to decide whether the organization's underlying pay bands, slot caps, or project assignment methods are fair; those are structural questions handed to the Board.

  The distinctions that have to survive
  **Desert:** What a person merits based on choices they controlled, distinct from outcomes caused by luck.
  **Entitlement:** What the written rules guarantee, regardless of merit or effort.
  **Consequence:** What allocation produces the best work or behavior in the next cycle.
  **Expression:** What public message the organization wishes to send about its values or gratitude.
  **Control Baseline:** The point where we stop asking about causes and treat an action as chosen (stipulated as "voluntary role acceptance").
  **Comparative Frame:** Whether the person is judged against the role requirements or against other candidates.
  **Structural Claim:** A problem caused by how work is assigned or paid, not by individual performance.

  The procedure
  **Step 1: Classification.** Is this claim about individual performance or about pay bands, slot caps, or work assignment? If structural, stop. Hand off to Board (Chair signs). If individual, proceed.
  **Step 2: Entitlement Check.** Do the written rules mandate this allocation? If yes, allocation follows rules. Record "Entitlement Override." Justification must cite rules, not merit. If no discretion, stop. If discretion exists, proceed to Step 3.
  **Step 3: Desert Base.** What specific act or outcome is being rewarded? Write it down. If the claim is "general loyalty," flag for Expression review (Step 6).
  **Step 4: Control Stipulation.** Did the person control this outcome? Apply the stopping rule: We attribute outcomes to choice once the agent voluntarily accepted the role and its known risks. Do not inquire further into prior advantage. If luck dominates (e.g., assigned a winning project), reduce desert score. Record the stipulation.
  **Step 5: Laundering Check.** Did this organization assign the advantage enabling this performance within the last two cycles? If yes, flag "Potential Structural Bias." Hand off to HR Partner for review. If clean, proceed.
  **Step 6: Tiering vs. Ranking.** Does the material support a clear winner? If candidates are roughly equal on desert, declare a Tie. Do not manufacture a ranking. Split the pool or rotate. Record "Insufficient Differentiation."
  **Step 7: Overrides.** Does rewarding this desert claim create bad incentives (Consequence) or send the wrong public message (Expression)? If yes, allocation follows Override. Record the specific override. If no, allocation follows Desert.
  **Step 8: Justification.** Draft the one-paragraph statement. It must not assert character flaws or deep causes of effort. It must state the override if applicable (e.g., "Rules prioritized metrics," not "You deserved less").

  **Stipulations for Consistency:**
  1. Luck stops at role acceptance.
  2. Ties are permissible; ranking is not required.
  3. Past organizational assignments are neutral unless flagged in Step 5.
  4. Gratitude is not Desert; use different awards.

  **Decision Form (HR Workflow)**
  ```text
  CASE ID: _______________  CANDIDATE: _______________  ALLOCATION TYPE: _______________

  1. STRUCTURAL HANDOFF? [ ] Yes (To Board/Chair)  [ ] No (Proceed)
  2. ENTITLEMENT MANDATE?  [ ] Yes (Record Override) [ ] No (Proceed)
  3. DESERT BASE:          _________________________________________________________
  4. CONTROL STOPPING RULE:[ ] Applied (Luck adjusted) [ ] Not Applied
  5. LAUNDERING FLAG?      [ ] Yes (To HR Partner)   [ ] No (Proceed)
  6. TIERING?              [ ] Tie Declared          [ ] Ranked (Justify Diff)
  7. OVERRIDE TYPE:        [ ] None [ ] Consequence  [ ] Expression [ ] Entitlement
     OVERRIDE JUSTIFICATION: ______________________________________________________
  8. FINAL ALLOCATION:     _________________________________________________________
  9. SIGN-OFF:             [ ] Chair [ ] HR Partner [ ] Board
  ```

  Three worked applications
  **Case 1: Priya vs. Marcus (Engineers)**
  *Form Input:* Step 1: Individual. Step 2: Rules say "top-rated takes top band." Priya is top-rated. Entitlement Mandate: Yes. Step 4: Control Stipulation applied. Priya's success traces to project assignment (luck). Marcus's success traces to vigilance (choice). Desert favors Marcus. Step 7: Override. Entitlement overrides Desert.
  *Decision:* Priya receives the bonus.
  *Justification:* "Allocation followed bonus plan metrics requiring top-rated status. While other contributions were valued, the plan prioritizes growth metrics."
  *Analysis:* The committee must record that Desert did not drive this. This protects Marcus on appeal; we admit the rules, not his merit, decided it.

  **Case 2: Analysts (Hours vs. Care)**
  *Form Input:* Step 3: Desert Base is output and effort. Analyst 1 has higher output via 70-hour weeks. Step 4: Control Stipulation. Hours were available due to circumstance (no children). Desert is reduced for Analyst 1 as hours were not equally choice-based. Step 7: Consequence Override. Rewarding 70-hour weeks sets an unsustainable incentive.
  *Decision:* Tie or slight edge to Analyst 2.
  *Justification:* "Allocation balanced output with sustainable work practices. Both contributions were valued equally within team constraints."
  *Analysis:* Desert pointed to Analyst 1, but Consequence overridden it. We do not tell Analyst 1 "Your hours were lucky." We say "Team constraints."

  **Case 3: Nurse Manager (Values Award)**
  *Form Input:* Step 3: Desert Base is values alignment. Performance is adequate, not exceptional. Step 6: Tiering. She does not rank high on performance desert. Step 7: Expression Override. Committee wants to signal gratitude for tenure/hardship. Step 8: Justification risk.
  *Decision:* Deny Values Award. Recommend Service Award.
  *Justification:* "This award recognizes exceptional values alignment in performance. Your contribution was steady stewardship, recognized via service channels."
  *Analysis:* This is the unwelcome answer. The committee wants to be kind publicly. The procedure says using a performance award for gratitude devalues the award for high performers and lies about why she is winning. It is right because it preserves the currency of the award for future deserving candidates and avoids telling her she "lived the values" exceptionally when performance was merely adequate.

  Where it misfires
  This procedure cannot fix structural inequity at the case level. Step 5 flags laundering, but if HR clears it, the committee must proceed, even if the project assignment was subtly biased. This dresses judgment as procedure; the "Control Stipulation" (Step 4) is a arbitrary line drawn to stop infinite regress, not a metaphysical truth. A committee member who believes luck matters more will chafe at stopping at "role acceptance." Furthermore, the "Tie" rule prevents forced ranking but may frustrate leaders wanting a single winner for simplicity. The procedure cannot settle whether the bonus pool itself is too small; that is a structural handoff, but if the Board ignores it, the committee still must allocate scarcity, forcing desert conflicts that cannot be resolved. Finally, the justification requirement limits honesty; we cannot tell Analyst 1 "We won't reward overwork," so we use vague language that may feel evasive. The procedure manages the risk of appeal, not the feeling of fairness. It ensures consistency, not justice.
