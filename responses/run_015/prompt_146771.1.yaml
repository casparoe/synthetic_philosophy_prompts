      *   **The Experiment:** A year-long self-correction ledger based on Franklin's method. 7 categories, scored 0-10 nightly.
      *   **The Goal:** Sustained *perfect* scores (10/10), not just gradual improvement.
      *   **The Problems:**
          1.  *Goalpost Shifting:* Redefining categories to excuse failures (e.g., "necessary recuperation" to justify selfishness).
