      *   **Moral Perfectionism:** Philosophically, this is tricky. Kantian duty vs. Virtue Ethics. Striving for perfection can lead to moral licensing or burnout. The "all or nothing" mindset (0 or 10) is cognitively distorting.
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." The user is experiencing this. The score is now the goal, not the virtue.
