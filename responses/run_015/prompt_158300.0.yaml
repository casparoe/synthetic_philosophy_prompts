      *   *Broken/Unexpressible:* Claim 5 & 6 (Social Potential vs. Realization). The user's vocabulary assumes the goal *is* throughput/efficiency. It cannot conceptualize "efficiency that results in less work" as a valid success state. The vocabulary is teleologically capitalist.
      *   *Systematic Opposition:* This is the crucial insight. The user's vocabulary treats labor as a *cost* to be minimized (OpEx). Marx treats labor as the *source* of value (Variable Capital). When the user says "labor hours per unit," they mean "efficiency." When Marx says "labor time," he means "substance of value." Minimizing labor minimizes value *creation* in Marx's view, even if it increases *profit*. This is the contradiction. The vocabulary is designed to optimize the very thing Marx says is self-cannibalizing.

