          4.  **Core Task:** The "Residue Report." Analyze what fits, what bends, and what breaks in the translation. Identify if the vocabulary is blind or if the claim is hollow. Identify if the vocabulary actively contradicts the claim (symptomatic opposition).
      *   **Constraints:** No citations, no reading lists, no passage locations. Only argumentative work. Do not import economic assumptions not given. Flag where assumptions are added. Maximize depth on the Residue Report.

  2.  **Deconstruct the Six Claims (Verification & Correction):**
