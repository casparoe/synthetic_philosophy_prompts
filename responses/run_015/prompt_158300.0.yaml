      *   *Claim 4:* Reserve capacity (labor) is maintained intentionally to prevent wage spikes during demand surges. It's a buffer pool, not a bug.
      *   *Claim 5:* System has high efficiency potential (low labor input per unit), but KPIs reward utilization rates, not labor reduction.
      *   *Claim 6:* Value add shifts from manual cycle time to system architecture (CapEx). Labor hours become a lagging indicator, not a leading driver of output.

  4.  **Adjudicating the Half-Formed Thoughts:**
      *   *Thought 1 (Metrics):* The user is right. Marx describes the *structural imperative*, not just individual malice. The metric (units/labor hour) enforces the logic. Marx's vocabulary *does* contain this: it's the difference between use-value (free time) and exchange-value (surplus). The user's vocabulary calls this "optimization function." I need to clarify that Marx sees the metric as an expression of the social relation, not just a management choice.
      *   *Thought 2 (Energy Analogy):* The teammate is wrong but intuitively close. Value isn't conserved like energy; it's socially necessary labor time. Machines transfer *value* (depreciation), they don't create *new value*. Only labor creates new value. The analogy breaks because energy is physical, value is social. I need to explain the "constant vs. variable capital" distinction without jargon.
      *   *Thought 3 (Deskilling/Leasing/Displacement):*
          *   *Deskilling:* It's not just "easy/hard." It's "autonomy vs. dependency." If the machine dictates the pace, you are an appendage. Handling exceptions is stressful but reactive, not proactive.
