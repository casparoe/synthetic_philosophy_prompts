answer: |-
  # HANDOUT: DIAGNOSTIC TREE FOR THEORIES OF ERROR (*KHYĀTI-VĀDA*)

  **Instructions:** Answer the following questions based on your intuitions about the cases provided. Do not worry about technical terms; answer based on what you think is *happening* in the experience. Your path through the tree will locate your position in the logical space of classical Indian epistemology.

  **Glossary:** *Khyāti* (appearance/cognition); *Pramāṇa* (valid means of knowledge); *Substrate* (the thing the error is about, e.g., the nacre); *Sublation* (the later correction, e.g., "This is not silver").

  ---

  ## PART I: THE DECISION TREE

  **Q1. The Structure of the Episode**
  In the **nacre/silver** case (bright light, beach), is the subject having **one single experience** ("This is silver") or **two distinct experiences** ("This is something" + "I remember silver") that they fail to keep apart?
  *   **Two/Mixture:** Go to **Leaf A**.
  *   **One/Single:** Go to Q2.

  **Q2. The Novice Constraint**
  Consider a subject who **has never encountered silver at all** confronting the nacre. Can they still have the erroneous cognition of silver?
  *   **No (Memory required):** Go to Q3.
  *   **Yes (Imagination/Creativity suffices):** Go to Q4.

  **Q3. The Ontological Status**
  In the standard **nacre/silver** case, does the "silver" that appears to the subject exist *anywhere* in reality (past, present, future, or another location)?
  *   **No (It is absolutely nothing):** Go to **Leaf B**.
  *   **Yes (It is real somewhere):** Go to Q5.
  *   **Neither (It is inexplicable):** Go to **Leaf C**.

  **Q4. The Locus of Appearance**
  In the **dream fire** or **double moon** (pressed eye) cases, is the appearing object located in the public external world or within the subject's consciousness?
  *   **Within Consciousness only:** Go to **Leaf D**.
  *   **In the Public World (but non-existent):** Go to **Leaf B**.

  **Q5. The Location Relative to Appearance**
  In the **rope/snake** case, is the snake located *where* it appears to be (on the rope), or is it located *elsewhere* (in a burrow/shop) and merely appears here?
  *   **Elsewhere (Misplaced):** Go to Q6.
  *   **Here (On the rope):** Go to Q7.

  **Q6. The Nature of Misplacement**
  In the **VR mug** case (user reaches for virtual object), is the error that a real object is perceived in the wrong place, or that a non-object is treated as real?
  *   **Real object, wrong place/relation:** Go to **Leaf E**.
  *   *(Note: If you said "Non-object" here, return to Q3).*

  **Q7. The Substrate Modification**
  In the **jaundiced conch** (white seen as yellow) case, does the conch actually possess a "yellow-mode" or capacity during the error, or is the cognition simply contradicting the conch's true nature?
  *   **Possesses a mode (Real transformation):** Go to **Leaf F**.
  *   **Contradicts nature (No transformation):** Go to **Leaf G**.

  **Q8. The Stress Test (Invented Case)**
  *Case:* **The Holographic Fire.** A perfect light-projection of a fire appears on a cold stone. Heat is felt (due to infrared emitters hidden nearby), but the fire itself is light only.
  Is the error that "Fire exists elsewhere and is projected here" or "Fire is falsely predicated of this light"?
  *   **Fire exists elsewhere/projected:** **Leaf E**.
  *   **Fire falsely predicated:** **Leaf G**.

  ---

  ## PART II: THE LEAVES (POSITIONS)

  **Leaf A: *Akhyāti* (Non-apprehension of distinction)**
  *   **School:** Prābhākara Mīmāṃsā (traditionally).
  *   **Awkward Commitment:** There is no such thing as error, only a failure to distinguish two valid cognitions.
  *   **(a) Pramāṇa Status:** Not one episode; two valid episodes (perception + memory) occurring simultaneously.
  *   **(b) Validity:** Intrinsic (*svataḥ*); both components are valid, the failure is in synthesis.
  *   **(c) Successful Action:** Explained by the utility of the memory component guiding the hand, not by the "error."

  **Leaf B: *Asatkhyāti* (Apprehension of the non-existent)**
  *   **School:** Madhyamaka Buddhism (usually).
  *   **Awkward Commitment:** We can cognitively grasp absolute nothingness as if it were something.
  *   **(a) Pramāṇa Status:** No *pramāṇa*; a defective cognition producing no knowledge.
  *   **(b) Validity:** Extrinsic (*parataḥ*); known false by later experience.
  *   **(c) Successful Action:** Illusory; any success is accidental or pragmatic convention, not ontological grounding.

  **Leaf C: *Anirvacanīyakhyāti* (Apprehension of the inexplicable)**
  *   **School:** Advaita Vedānta (traditionally).
  *   **Awkward Commitment:** The object is neither real nor unreal, a category defying logic.
  *   **(a) Pramāṇa Status:** Produced by a defect (*doṣa*); not a *pramāṇa*.
  *   **(b) Validity:** Intrinsically plausible but extrinsically cancelled (*bādha*).
  *   **(c) Successful Action:** Possible because the appearance has empirical reality (*vyāvahārika-sat*), even if ultimately unreal.

  **Leaf D: *Ātmakhyāti* (Self-apprehension / Internal apprehension)**
  *   **School:** Yogācāra Buddhism (usually).
  *   **Awkward Commitment:** All external objects are projections of consciousness; there is no public world.
  *   **(a) Pramāṇa Status:** Valid regarding the internal image, invalid regarding external reference.
  *   **(b) Validity:** Intrinsic to the consciousness-event; error is projecting it outward.
  *   **(c) Successful Action:** Coherence within the stream of consciousness, not correspondence to externals.

  **Leaf E: *Anyathākhyāti* (Apprehension as otherwise)**
  *   **School:** Nyāya (traditionally).
  *   **Awkward Commitment:** A real silver exists elsewhere, but the subject perceives it *here* without traveling.
  *   **(a) Pramāṇa Status:** One episode produced by a defective causal chain; not a *pramāṇa*.
  *   **(b) Validity:** Extrinsic (*parataḥ*); requires verification to confirm truth.
  *   **(c) Successful Action:** The silver is real, so picking it up (if available) works; if not, action fails due to location mismatch.

  **Leaf F: *Satkhyāti* (Apprehension of the real)**
  *   **School:** Viśiṣṭādvaita Vedānta / Some Mīmāṃsā variants.
  *   **Awkward Commitment:** The nacre literally becomes silver-like during the error; reality is fluid.
  *   **(a) Pramāṇa Status:** The cognition is valid regarding the mode, invalid regarding the permanent substance.
  *   **(b) Validity:** Intrinsic (*svataḥ*); the appearance reveals a temporary reality.
  *   **(c) Successful Action:** Works because the object temporarily possesses the properties perceived.

  **Leaf G: *Viparītakhyāti* (Apprehension of the contrary)**
  *   **School:** Bhāṭṭa Mīmāṃsā (traditionally).
  *   **Awkward Commitment:** A unitary cognition can directly contradict reality without misplacing a real object.
  *   **(a) Pramāṇa Status:** One episode; a false judgment (*niścaya*).
  *   **(b) Validity:** Intrinsic (*svataḥ*); cognition presents itself as true until sublated.
  *   **(c) Successful Action:** Explained by similarity; the nacre shares enough features with silver to guide action temporarily.

  ---

  ## PART III: DIAGNOSTIC MEMO

  **1. Indistinguishable Leaves (The Residue)**
  *   **Anyathākhyāti (E) vs. Viparītakhyāti (G):** At the level of concrete cases, these are nearly inseparable. Both posit a real object and a false attribution. The difference is metaphysical: Nyāya (E) insists the silver is *elsewhere* (misplacement); Bhāṭṭa (G) insists the judgment is *contrary* (mis-predication). No case of simple illusion (nacre/snake) forces a choice; only the **Holographic Fire** (Q8) stresses the "location" vs. "predication" distinction.
  *   **Nyāya (E) vs. Bhāṭṭa (G) on Validity:** The deeper split is not in error but in *pramāṇya*. Nyāya holds validity is extrinsic (*parataḥ*); Bhāṭṭa holds it is intrinsic (*svataḥ*). This tree sorts by error-ontology, so this crucial epistemic difference remains a "hidden variable" between Leaves E and G.
  *   **Anyathākhyāti (E) vs. Anirvacanīyakhyāti (C):** These cannot be prised apart by cases. Both predict the same phenomenology (real-seeming silver, later cancelled). The difference is purely ontological (Real vs. Indeterminate). A participant choosing E or C is making a metaphysical commitment, not a phenomenological one.

  **2. Useless Cases (Why they failed to discriminate)**
  *   **Dust/Smoke/Fire (Inferential Error):** This case tests *inference* (*anumāna*), not perceptual error (*viparyaya*). All schools agree inference can be flawed by faulty premises. It does not separate *khyāti* theories which focus on perceptual illusion.
  *   **Faulty Thermometer (Accidental Truth):** This tests the definition of *pramāṇa* (instrument), not the ontology of the error object. While it distinguishes Intrinsic vs. Extrinsic validity theories, it does not separate *Anyathā* from *Asat* etc., because the cognition ("Room is cold") turned out *true*.
  *   **Dream Fire vs. Double Moon:** Both serve the same function (testing Internal vs. External locus). Using both is redundant for this tree; *Double Moon* is slightly better for physiological defects, *Dream* for psychological ones, but both lead to Leaf D (*Ātmakhyāti*) or B (*Asatkhyāti*).

  **3. The Invented Case**
  *   **The Holographic Fire:** Designed to separate *Anyathā* (Misplacement) from *Viparīta* (Contradiction). If the fire is "projected," Nyāya can claim the light source is the real object misplaced. Bhāṭṭa must claim the "fire" predicate is simply false of the light. If participants treat these identically, the distinction is merely verbal.
