      *   *Point 2: Evidence vs. Credences.* Aumann deals with posteriors (numbers). The film deals with physical evidence and reenactments (knife, walking simulation). This is "trade of evidence," which is harder than trade of credences.
      *   *Point 3: Common Prior as Villain.* The initial 11-1 vote reflects a shared bias (prior). Convergence isn't inherently good if the prior is bad. The film critiques the *starting point*, not just the disagreement.
      *   *Point 4: Belief vs. Verdict.* Aumann is about belief (truth). Jury is about decision (action/risk). Reasonable doubt $\neq$ certainty of innocence. They agree on the *verdict*, not necessarily the *truth*.
      *   *Point 5: The Holdout's Irrationality.* Aumann says if you know others' posteriors, you should update. Juror 8 votes "Not Guilty" initially without new evidence, just doubt. Technically irrational by Aumann's lights, but morally necessary. This is where the formalism breaks.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the audience with the user's personal anecdote (jury service) and introduce Aumann's theorem simply. Set the tension: Math says we should agree; Film shows *how* we agree matters.
