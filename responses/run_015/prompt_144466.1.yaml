      *   *Self-Correction on Point 1:* Make sure to explicitly state that Aumann's theorem *cannot* handle model expansion. That's the key insight.
      *   *Self-Correction on Point 5:* Be clear that Juror 8 is "irrational" only in the strict Bayesian sense, but rational in the legal/moral sense.
