answer: |-
  You are absolutely right to be confused by the name. If you interpret "updateless" literally as "never update your beliefs based on new evidence," it sounds like insanity. An agent that ignores the fact that the lights are on is not rational; it's broken.

  The good news is that **UDT agents do process evidence.** They see the lights, they see the car, and they update their beliefs about whether someone is home.

  The term "updateless" refers to something much more specific and technical: **it refers to when the agent chooses its *strategy*, not how it processes sensory data.**

  Here is the breakdown of what is actually going on.

  ### 1. The Standard View: Update Then Decide
  In standard decision theories (like Causal Decision Theory or Evidential Decision Theory), the timeline looks like this:
  1.  **Prior:** You have initial beliefs.
  2.  **Observation:** You see the lights are on.
  3.  **Update:** You update your probabilities ("Someone is probably home").
  4.  **Decide:** You choose the action that maximizes expected utility *given your new, updated beliefs*.

  The problem arises in specific scenarios (like Newcomb's Problem or Counterfactual Mugging) where **step 4** betrays **step 1**. By re-optimizing your decision *after* seeing the evidence, you might make a choice that your "past self" (who knew less) would have hated.

  ### 2. The UDT View: Decide Then Observe
  Updateless Decision Theory flips the order of optimization. It asks: **"What policy (function from observations to actions) would I have wanted to commit to *before* I saw any evidence?"**

  The timeline looks like this:
  1.  **Prior:** You have initial beliefs.
  2.  **Decide:** You choose a complete **policy**. This is a master plan that says: "If I see lights on, I will do X. If I see lights off, I will do Y." You choose this mapping to maximize expected utility based on your *prior* (before you knew which state you were in).
  3.  **Observation:** You see the lights are on.
  4.  **Execute:** You look up "lights on" in your pre-chosen policy and do X.

  In this framework, you are "updateless" because you do not re-calculate the *best policy* after seeing the evidence. You stick to the policy you selected when you were "behind the veil of ignorance."

  ### 3. Why would you do this? (The Counterfactual Mugging)
  To understand why updating is sometimes bad, consider the **Counterfactual Mugging** thought experiment:

  *   A super-predictor named Omega flips a fair coin.
  *   **If Heads:** Omega gives you $10,000, but *only if* Omega predicted you would have given him $100 if the coin had come up Tails.
  *   **If Tails:** Omega asks you for $100. (You get nothing regardless).

  **The Standard (Updateful) Agent:**
  1.  Omega flips the coin. It comes up **Tails**.
  2.  **Update:** The agent sees "Tails." It knows the $10,000 (Heads branch) is now impossible. It is gone forever.
  3.  **Decide:** "If I give $100, I lose $100. If I keep it, I lose $0. The $10,000 is already lost."
  4.  **Action:** Keeps the $100.
  5.  **Result:** Because Omega predicted this reasoning, the agent never gets the $10,000 in the Heads world.

  **The Updateless Agent:**
  1.  **Before the coin flip:** The agent thinks, "I have a 50% chance of Heads and 50% chance of Tails."
  2.  **Decide:** "If I commit to paying $100 on Tails, I gain $10,000 on Heads. Expected value: (+$10,000 * 0.5) + (-$100 * 0.5) = +$4,950. If I refuse, I get $0. I should commit to paying."
  3.  **Observation:** The coin lands **Tails**.
  4.  **Execute:** Even though the agent *knows* the $10,000 is gone, it follows its pre-committed policy. It pays the $100.
  5.  **Result:** This is the kind of agent Omega rewards. If the coin had landed Heads, this agent would be $10,000 richer.

  The "updateless" agent ignores the *decision-relevance* of the new evidence (that the Heads world is now counterfactual), even though it accepts the *factual* evidence (that the coin is Tails).

  ### 4. Back to Your Example (The Lights)
  So, how does UDT handle your "lights on" scenario?

  *   **UDT Policy:** "If I see lights on and a car in the driveway, I should believe someone is home and knock on the door. If I see darkness, I should assume no one is home and leave."
  *   **Execution:** You come home. You see the lights. You consult your policy. The policy says "Knock on the door." You knock.

  You haven't ignored the evidence. The evidence is an **input** to your policy. You are just refusing to let the evidence change the **rules** of how you process inputs.

  ### 5. Summary: What "Updateless" Actually Means
  The name is unfortunate, but here is the precise translation:

  1.  **It does NOT mean:** Ignoring sensory data or refusing to update probabilities about the state of the world.
  2.  **It DOES mean:** Maximizing expected utility relative to your **prior probability distribution** (before you knew which specific situation you were in), rather than your **posterior distribution** (after you know where you are).
  3.  **The Goal:** To solve **time-inconsistency**. It prevents your "future self" (who has more information) from making a decision that ruins the plans of your "past self" (who had to deal with predictors or logical correlations).

  Think of it as **Ulysses tying himself to the mast.** Ulysses hears the Sirens (evidence: the song is beautiful). His "updateful" desire is to steer toward them. But his "updateless" policy (decided when he was sane) was "stay tied to the mast." He doesn't ignore the song; he just refuses to let the song change his steering policy.

  UDT is essentially a mathematical formalization of **pre-commitment.**
