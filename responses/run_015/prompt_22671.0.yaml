          *   UDT: Choose Policy (Mapping of Obs -> Action) -> Observe -> Execute Action.
      *   **The "Veil of Ignorance" Analogy:** This is usually the most intuitive hook. You decide the rules of your life before you are born (or before the coin flip), knowing you might end up in a situation where following the rule hurts you locally but helped you globally.
      *   **Address the "Lights On" Example:** Explicitly tackle the user's scenario.
