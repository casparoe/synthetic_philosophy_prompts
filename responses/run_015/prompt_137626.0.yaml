          *   *Liberal View:* Focuses on *exchange* (the contract). Justice is procedural (did you agree?). Property rights are absolute (I own the capital, so I own the output).
          *   *Marxian View:* Focuses on *production* (what happens during work). Justice is substantive (who captures the surplus?). Property rights are social relations (ownership gives power over people).
