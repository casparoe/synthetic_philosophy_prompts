prompt: |-
  I run a small type foundry, and I need help turning an idea into something my team can actually use. We maintain a variable superfamily covering Latin, Greek and Cyrillic, and for the past eight months we have been contracted to extend it to a language whose orthography was standardized only in the 1990s and which has, as far as we can tell, no typographic tradition beyond a few handwritten primers and some photocopied church bulletins. Our workflow is that a generative model trained on our existing masters proposes candidate glyphs and a human reviewer accepts or rejects them: about two hundred candidates a month, under fifteen minutes per review, and the reviewers are junior designers with no training in linguistics or philosophy. A rejection costs us roughly a week of regeneration; a bad acceptance ships to readers who notice at once that the letter was drawn by someone who does not read the language. Sign-off is mine, with a two-person advisory board of native readers I can consult maybe twice a month and who do not always agree.

  A friend described to me a research project on letterform design whose central claim — I only ever got it second-hand, so treat my summary as hearsay and please don't lean on knowing the source — is that what makes every 'a' an 'a' is not a list of features you can check off. Roughly: the parts of the glyph (the bowl, the stem, the aperture, the terminal) each play a role; the same role can be filled in many different ways; and a letter is identified as much by its place in a system of contrasts with the other letters of its alphabet as by anything intrinsic to it, so that an 'a' is partly what is not an 'o', not a 'd', not a 'u'. Right now my reviewers have no procedure at all — they look at a candidate and say that's not an a, and when I ask why, they gesture at the shape. I want better than that, and I want it usable by someone who has never thought about categories.

  Please write me an accept/reject procedure my reviewers can run, in words, in the order the questions should be asked: what to look at first, what counts as a sufficient answer at each step, where a candidate is rejected outright, where it is handed on to me because the remaining question is one of judgment or house values rather than fact, and how a reviewer should separate a deviation of style from a failure of category — the difference between a candidate whose stem is straighter than ours because the model learned a different model of the skeleton, which is fine, and one that will be read as a different letter or by nobody at all. It has to survive three complications I cannot design away. First, the new script has almost no tradition: there is no settled prototype to compare against, and the tempting move of importing the Latin contrast set may simply be importing an answer. Second, the superfamily includes a micro master for ten-pixel interface labels and an accessibility master aimed at readers with dyslexia, where our 'a' is deliberately exaggerated and the ordinary tests may not apply. Third, for nearly every candidate we can run no empirical test at all: a few thousand speakers, no eye-tracking, two advisors. Say what the procedure does when it cannot get an answer from a reader, and be explicit about which steps are judgment calls wearing procedural clothing.

  Then run it on three cases. First: the model's candidate 'a' for the new script — a closed bowl, a straight stem on the right, a small foot serif — where two reviewers say it reads as an 'o' with a tail, one says it is fine, and the advisory board is split. Second: a candidate where, generating for the Cyrillic codepoint, the model produced something very close to the Greek alpha our family already ships, and which reads perfectly well to a monolingual Latin reader. Third: a candidate I drew by hand myself and would like to keep — a single-storey 'a' whose bowl opens very wide where it meets the stem — which the reviewers love, and which at the micro master becomes hard to tell from both our 'o' and our 'c'; I expect the procedure to tell me something I do not want to hear about this one, and I would rather hear it. Finally, tell me plainly where the procedure will misfire and what it cannot do, and in particular whether it can ever settle the question of whether two shapes are the same letter across two different scripts, or whether that question belongs to Unicode and to the community of readers rather than to us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Owner of a small type foundry.
      *   **Context:** Extending a variable superfamily (Latin, Greek, Cyrillic) to a newly standardized language (orthography from 1990s, little typographic tradition).
      *   **Workflow:** Generative AI proposes glyphs -> Junior Designers review (200/month, <15 mins/review) -> Owner signs off + 2 Native Advisors (consulted infrequently, sometimes disagree).
      *   **Problem:** Reviewers lack linguistic/philosophic training. They rely on intuition ("that's not an 'a'"). Rejections cost time (1 week regen); bad acceptances damage reputation.
      *   **Theoretical Basis:** A hearsay research claim: Letter identity is systemic (contrastive) and functional (roles of parts), not just a checklist of features.
      *   **Constraints/Complications:**
          1.  No settled typographic tradition for the new script (can't just compare to a reference).
          2.  Superfamily includes extreme masters (10px micro, dyslexia-friendly) where standard proportions break.
          3.  No empirical testing possible (small speaker base, no eye-tracking).
      *   **Deliverables:**
          1.  A written Accept/Reject procedure (step-by-step questions, decision points, escalation paths).
          2.  Application of the procedure to three specific cases.
          3.  A candid assessment of where the procedure fails and what questions it *cannot* answer (specifically regarding cross-script identity).

  2.  **Deconstruct the Theoretical Claim:**

      *   *Claim:* Identity is relational (contrastive) and functional (roles), not intrinsic feature-checking.
      *   *Implication for Procedure:* Don't ask "Does it have a bowl?" Ask "Does it occupy the same functional niche as the other letters?" "Does it confuse the reader when placed next to its neighbors?"
      *   *Adaptation for Juniors:* Needs to be concrete, visual, and operational, not abstract philosophy. Needs to handle the "no tradition" issue by focusing on *internal consistency* within the new font family rather than external historical correctness.

  3.  **Drafting the Procedure (The "Contrast & Role" Protocol):**

      *   *Goal:* Move from "looks wrong" to "fails specific functional test."
      *   *Step 1: Internal Consistency (The System Check).* Since there's no external tradition, the font *is* the tradition. Does this glyph fit the visual logic of *this* family?
      *   *Step 2: Contrast (The Neighbor Check).* The core theoretical insight. Does it collide with its minimal pairs? (e.g., if 'a' looks like 'o', it fails).
      *   *Step 3: Role/Function (The Skeleton Check).* Does it perform the job of the letter in a word? (Legibility, flow).
      *   *Step 4: Master Specifics.* Handle the micro/dyslexia exceptions explicitly.
      *   *Decision Tree:* Clear Accept, Clear Reject, Escalate to Owner (Judgment Call).
      *   *Addressing the "No Data" problem:* If advisors disagree, default to *distinctiveness* over *tradition*.

  4.  **Refining the Procedure for the Constraints:**

      *   *Constraint 1 (No Tradition):* Emphasize *internal* contrast over *external* reference. The "prototype" is the other letters in the same font.
      *   *Constraint 2 (Masters):* Create a specific branch for Micro/Accessibility. Standard proportions don't apply; distinctiveness does.
      *   *Constraint 3 (No Empirical Data):* Use "Simulated Reading" (looking at pseudo-words) instead of "Does this look like the primer?"
      *   *Reviewer Limitations:* Keep language visual. Avoid linguistic terms like "phoneme" or "grapheme." Use "shape," "neighbor," "confusion."

  5.  **Developing the Three Cases:**

      *   *Case 1 (The Ambiguous 'a'):* Closed bowl, stem, foot. Reads as 'o' with a tail. Advisors split.
          *   *Procedure Application:* Fails Contrast Check (looks like 'o'). Escalates to Owner. Owner must decide based on risk.
      *   *Case 2 (The Cyrillic/Greek Collision):* Cyrillic codepoint looks like Greek alpha. Latin reader likes it.
          *   *Procedure Application:* Fails System Check (wrong script logic) or Contrast Check (within Cyrillic set). This is a "False Friend" risk.
      *   *Case 3 (The Owner's Pet):* Single-storey, wide open. Good at text, bad at micro (confuses with 'o' and 'c').
          *   *Procedure Application:* Passes Text, Fails Micro Check. Procedure should flag the Micro master failure even if the Owner likes the design. This fulfills the user's request to "hear what I do not want to hear."

  6.  **Addressing the Limitations (The "Misfire" Analysis):**

      *   *Where it fails:* Aesthetic preference, deep cultural resonance, true cross-script identity (Unicode/Community territory).
      *   *Cross-Script Identity:* The procedure *cannot* solve "Is this Latin 'a' the same letter as this New Script 'a'?" That's encoding and community identity, not type design.
      *   *Honesty:* Acknowledge that the procedure manages risk, it doesn't guarantee truth.

  7.  **Review and Refine (Self-Correction during drafting):**

      *   *Tone:* Professional, direct, empathetic to the business constraints, respectful of the linguistic sensitivity.
      *   *Clarity:* Ensure the steps are numbered and the "Exit Criteria" are clear.
      *   *The "Hearsay" Theory:* Make sure the procedure reflects the "contrast/role" theory without needing the reviewers to understand the philosophy. They just need to execute the *tests* derived from it.
      *   *The "Judgment Call" distinction:* Be very clear about when a reviewer stops and the Owner starts. (Fact/Logic vs. Value/Style).

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   *Order of questions?* Yes.
      *   *Sufficient answer?* Yes.
      *   *Rejection vs. Escalation?* Yes.
      *   *Style vs. Category?* Yes.
      *   *Three complications addressed?* Yes.
      *   *Three cases run?* Yes.
      *   *Limitations explained?* Yes.
      *   *Cross-script question addressed?* Yes.

  *(Self-Correction on Case 2)*: Wait, if it's a Cyrillic codepoint looking like Greek Alpha, is that bad? In some contexts, yes (confusion). In others, it might be historically linked. But the prompt says "no typographic tradition." So we must rely on internal consistency. If the family already ships Greek Alpha, shipping the *same* shape for a Cyrillic codepoint might cause confusion for bilingual readers or look like a lazy copy-paste. The procedure should flag this as a "System Integrity" risk.

  *(Self-Correction on Case 3)*: The user wants the procedure to tell them something they don't want to hear. The procedure must prioritize *legibility in the specific master* over *designer preference*. If it fails the micro test, it fails the procedure for that master, even if the Owner loves it.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  Here is a procedure designed for your workflow, followed by the application to your three cases and an assessment of its limits.

  ### The Contrast & Role Protocol (CRP)

  **Purpose:** To distinguish between a stylistic variation (Accept) and a categorical failure (Reject) without relying on external historical references or linguistic theory.
  **Users:** Junior Designers (Reviewers).
  **Time Budget:** 10 minutes per candidate.
  **Core Principle:** A letter is defined by what it is *not* (its neighbors) and what it *does* (its role in a word), not by a checklist of parts.

  #### Phase 1: The System Check (Internal Consistency)
  *Goal: Ensure the glyph belongs to this specific family, not a different one.*

  1.  **Place the candidate in a string of its own kind.**
      *   *Action:* Type a line of the candidate glyph repeated (e.g., `aaaaa`).
      *   *Question:* Does the rhythm match the rhythm of the established letters in this specific master (Text, Micro, or Accessibility)?
      *   *Sufficient Answer:* "Yes, the weight and spacing feel like the rest of the file."
      *   *Reject If:* The glyph feels significantly heavier, lighter, wider, or narrower than the surrounding family members, unless explicitly dictated by the master's rules (e.g., Micro master exaggeration).
      *   *Escalate If:* The deviation looks intentional but you are unsure if it violates the superfamily's variable axis logic.

  2.  **Check the Skeleton Logic.**
      *   *Action:* Compare the candidate's "bones" (main strokes) to the nearest visual neighbors in the *same* script.
      *   *Question:* Is the construction method (e.g., single-storey vs. double-storey, curved vs. straight stems) consistent with how this family treats similar forms?
      *   *Sufficient Answer:* "It uses the same construction logic as the rest of the set."
      *   *Reject If:* It introduces a structural anomaly (e.g., a straight stem where all others are curved) that breaks the variable interpolation.
      *   *Note:* A straighter stem is **Style** (Accept). A stem that prevents the glyph from interpolating with the other masters is **Structure** (Reject).

  #### Phase 2: The Contrast Check (The Neighbor Test)
  *Goal: Ensure the glyph is distinct from the letters it is most likely to be confused with.*
  *Note: This is the most critical step for scripts with no tradition. You are creating the tradition of distinctiveness.*

  3.  **Identify the Minimal Pairs.**
      *   *Action:* Identify the 2-3 glyphs in this script that share the most features with the candidate (e.g., if testing 'a', look at 'o', 'd', 'u', or their script equivalents).
      *   *Question:* When placed side-by-side in a pseudo-word (e.g., `ada`, `aoa`, `ana`), is the candidate instantly distinguishable from its neighbors at 100% zoom?
      *   *Sufficient Answer:* "I can tell them apart immediately without squinting."
      *   *Reject If:* There is a moment of hesitation or ambiguity. If it looks like an 'o' with a tail, it fails.
      *   *Escalate If:* The ambiguity only appears at very small sizes (see Phase 3).

  4.  **The "Squint" Test.**
      *   *Action:* Blur your vision or step back from the screen until details disappear.
      *   *Question:* Does the silhouette remain distinct from its minimal pairs?
      *   *Sufficient Answer:* "The shape still reads as unique."
      *   *Reject If:* The silhouette collapses into that of a neighbor (e.g., the 'a' bowl closes so much it becomes an 'o').

  #### Phase 3: The Master Exception Check
  *Goal: Account for the Micro and Accessibility masters where standard rules break.*

  5.  **Apply the Master Filter.**
      *   *Action:* Switch the view to the specific master (Micro 10px or Dyslexia).
      *   *Question:* Does the exaggeration required for this master preserve the Contrast Check (Phase 2)?
      *   *Sufficient Answer:* "Yes, even at 10px, the 'a' does not look like the 'o'."
      *   *Reject If:* The simplification required for the master causes a collision with another glyph. (e.g., The open aperture of the Dyslexia 'a' becomes so wide it looks like a 'c').
      *   *Escalate If:* The master requires a shape that contradicts the Text master's identity. (This goes to the Owner to decide which master takes precedence).

  #### Phase 4: Decision & Escalation

  *   **ACCEPT:** Passed Phases 1, 2, and 3. No ambiguity found.
  *   **REJECT:** Failed Phase 2 (Contrast) or Phase 3 (Master Legibility). *Reason must be specific:* "Collides with glyph X," not "Looks wrong."
  *   **ESCALATE TO OWNER:**
      *   Passed Contrast, but violates a "House Value" (e.g., it's legible but too quirky for the brand).
      *   Passed Contrast, but the Advisory Board is split (see Case 1).
      *   The candidate works in Text but fails in Micro (see Case 3).
      *   The candidate belongs to a different script system entirely (see Case 2).

  ***

  ### Application to Cases

  #### Case 1: The Ambiguous 'a' (Closed bowl, straight stem, foot serif)
  *   **Context:** Reviewers split (2 say 'o' with tail, 1 says fine). Advisors split.
  *   **Running the CRP:**
      *   *Phase 1 (System):* Pass. It fits the weight and skeleton logic.
      *   *Phase 2 (Contrast):* **FAIL.** Two reviewers identify it as reading like an 'o'. The "Squint Test" likely collapses the tail into the bowl.
      *   *Phase 3 (Master):* N/A (Failure occurred earlier).
      *   *Phase 4 (Decision):* **ESCALATE TO OWNER.**
  *   **Analysis:** The procedure identifies this as a *Contrast Failure*, not a Style Failure. Because the advisors are split, there is no consensus on the "tradition." The procedure dictates that **distinctiveness trumps tradition.** If it reads as 'o' to half your team, it will read as 'o' to half your readers.
  *   **Outcome:** You must reject it or mandate a redesign to open the aperture, regardless of the advisors' split. The risk of misreading is a factual failure, not a judgment call.

  #### Case 2: The Cyrillic/Greek Collision (Cyrillic codepoint = Greek Alpha shape)
  *   **Context:** Model generated Greek Alpha shape for a Cyrillic codepoint. Reads well to Latin eyes.
  *   **Running the CRP:**
      *   *Phase 1 (System):* **FAIL.** The "Skeleton Logic" of the Cyrillic set in your superfamily likely differs from the Greek set. Even if they look similar, they belong to different contrast systems within your file.
      *   *Phase 2 (Contrast):* **FAIL (Potential).** If a reader knows both Greek and this new Cyrillic orthography, this is a "False Friend." It creates cross-script ambiguity.
      *   *Phase 4 (Decision):* **REJECT.**
  *   **Analysis:** This is a "Category Failure." The procedure flags this because the glyph is imported from a *different contrast system* (Greek) into a new one (Cyrillic extension). Even if it looks "right" to a Latin monolingual, it violates the internal integrity of the superfamily's script separation. It suggests the model is copying shapes rather than solving the new script's problems.
  *   **Outcome:** Reject. Regenerate with a constraint that prevents Greek glyph topology.

  #### Case 3: The Owner's Pet (Single-storey, wide open bowl)
  *   **Context:** You drew it. Reviewers love it. Text is fine. Micro master (10px) confuses it with 'o' and 'c'.
  *   **Running the CRP:**
      *   *Phase 1 (System):* Pass.
      *   *Phase 2 (Contrast):* Pass (in Text master).
      *   *Phase 3 (Master Exception):* **FAIL.** The procedure explicitly asks: "Does the simplification required for the master preserve the Contrast Check?" At 10px, the wide opening closes or the bowl simplifies such that it matches 'o' and 'c'.
      *   *Phase 4 (Decision):* **ESCALATE TO OWNER (with Warning).**
  *   **Analysis:** The procedure protects the product from your preference. It acknowledges the design is beautiful in Text but functionally broken in Micro.
  *   **Outcome:** The procedure tells you: **"You cannot ship this specific shape in the Micro master."** You have three choices: 1) Draw a separate Micro glyph that sacrifices the wide bowl for distinctiveness. 2) Remove the Micro master for this script. 3) Ship it and accept the liability. The procedure forces you to acknowledge the trade-off.

  ***

  ### Limitations and Misfires

  You asked for plain talk on where this procedure will fail and what it cannot do.

  **1. Where it will misfire:**
  *   **Cultural Resonance:** The CRP treats letters as functional machines. It cannot detect if a shape is culturally offensive, archaic, or associated with a specific political faction within the speaker community. Your advisors catch this, but they are only consulted twice a month. If the model generates a shape that looks like a symbol used by a rival dialect group, the CRP will Accept it because it is distinct and legible.
  *   **The "Uncanny Valley" of Scripts:** If the model produces a glyph that is *almost* right but has a subtle tension error (a curve that feels "nervous"), the junior reviewers may Reject it as "bad drawing" rather than "wrong category." The procedure cannot distinguish between a bad draw and a wrong category if the distinction is purely aesthetic intuition.
  *   **Interpolation Artifacts:** In a variable superfamily, a glyph might pass at the extremes (Light and Black) but collapse in the middle. The CRP checks samples, not the entire axis. It will miss interpolation errors unless the reviewers specifically check the instances.

  **2. What it cannot do (The Cross-Script Question):**
  *   **Can it settle if two shapes are the "same letter" across scripts?**
      *   **No.** Absolutely not.
      *   **Why:** The question "Is this Latin 'a' the same letter as this New Script 'a'?" is not a design question. It is a question of **Encoding** and **Community Identity**.
      *   **Unicode's Role:** Unicode decides if they share a codepoint based on historical unification and interoperability.
      *   **The Community's Role:** The readers decide if they *feel* it is the same letter. If they perceive them as distinct, they are distinct, regardless of how similar your glyphs look.
      *   **Your Role:** You are designing for *readability within the system*, not ontological truth. If you make the New Script 'a' look exactly like the Latin 'a', you may help bilingual readers, or you may erase the script's cultural independence. The CRP cannot solve this. It only ensures that whatever you choose, it doesn't collide with its neighbors *within* the new script.

  **3. Judgment Calls Wearing Procedural Clothing:**
  *   **The "Distinctiveness" Threshold:** Phase 2 asks, "Is it instantly distinguishable?" One reviewer's "instant" is another's "hesitation." This is a judgment call disguised as a test. You mitigate this by requiring consensus (2 out of 3 reviewers must agree it is distinct).
  *   **The Master Priority:** In Case 3, the procedure flags the Micro failure. But deciding whether to fix the glyph or drop the master is a business judgment. The procedure exposes the conflict; it does not resolve it.

  **Summary:**
  This procedure shifts the burden from "Does this look like an 'a'?" (which requires knowledge you don't have) to "Does this look like an 'o'?" (which requires only eyes). It prioritizes **contrast** over **prototype**, which is essential when no prototype exists. It will not save you from cultural insensitivity, and it will not answer Unicode questions, but it will stop you from shipping glyphs that your readers cannot read.
