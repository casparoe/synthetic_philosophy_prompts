answer: |-
  To establish a procedure that is both theoretically grounded and operationally viable within your fifteen-minute constraint, you must anchor the left-right distinction in the criterion of equality rather than in specific policy prescriptions or current party platforms. Drawing from Bobbio, the core distinction that must survive simplification is whether a policy aims to reduce existing social and economic hierarchies or accepts them as natural and orderly. You can drop the assumption that left and right are universal truths across all nations and times, and you should discard the idea that every issue must fit neatly on the axis. The procedure begins with a valence check. Ask whether there is significant, organized political opposition to the proposal from a recognized bloc. If the answer is no, because all significant actors support the measure or opposition is negligible, mark the item as valence and do not assign a left or right tag. This stops the procedure with a no. If there is significant opposition, proceed to the equality criterion. Ask whether the policy primarily functions to redistribute resources, access, or power downward to reduce inequality, or whether it primarily functions to protect existing property relations, social hierarchies, or established orders. If the policy clearly reduces hierarchy, it leans left. If it clearly preserves hierarchy, it leans right. If the policy involves state power versus individual liberty without clear egalitarian implications, or if it splits the traditional coalitions on equality grounds, it is likely cross-cutting or off-axis.

  You must evaluate your three existing tests against this theoretical anchor. The enemy test, which codes an issue by who is currently attacking it, is the weakest theoretically because it merely inherits whatever coalition happens to exist right now. It tracks contingency rather than principle. You should use it only as a preliminary signal, not as a justification. The time-machine test is more robust because it asks whether the issue would still cluster with the same side if the last big party realignment had gone the other way. If the issue would switch sides, it is contingent and should be marked cross-cutting or flagged for advisor review. This test helps you distinguish structural principles from historical accidents. The blind-pairing test is the strongest validator of what actually holds a side together psychologically. If knowing someone's answer to the new item lets you predict their answers to two items you have already coded better than chance, the issue shares the underlying dispositional orientation of that side. Prioritize the blind-pairing logic over the enemy test when they conflict. However, you must stop and hand the decision to your advisor when the framing of the policy is itself the contest. If one side calls a measure protective and the other calls it authoritarian, you cannot resolve this empirically within fifteen minutes. Also hand off if the issue splits both parties internally, making a left-right tag misleading, or if the equality criterion yields ambiguous results because the policy reduces one hierarchy while reinforcing another.

  Applying this procedure to your three live items yields specific results. First, eliminating single-family-only zoning near transit stations challenges exclusionary property hierarchies to increase housing access, which aligns with the equality criterion for the left. However, this issue often splits the left between those prioritizing affordability and those prioritizing tenant protections or community preservation, and it splits the right between property rights absolutists and market libertarians. The blind-pairing test suggests this item does not predict core left views on taxation or welfare as well as it predicts views on urbanism. Therefore, you should mark this as cross-cutting. It fails the time-machine test because housing coalitions are locally contingent rather than nationally stable. Second, requiring developers of frontier AI systems to obtain a license involves regulation versus innovation. While the left generally favors regulation of corporate power and the right favors market freedom, AI safety concerns cut across the axis, with some on the right favoring strict controls for national security and some on the left worrying about bureaucratic overreach. The equality criterion is unclear here because the hierarchy at stake is technological capability rather than social class. This item should be marked off-axis or cross-cutting. It fails the blind-pairing test because stance on AI licensing does not reliably predict stance on economic redistribution. Third, requiring photographic identification to vote should remain tagged as right-coded, but you must acknowledge the limitation directly. This item fits the equality criterion because it imposes a barrier to access that disproportionately affects lower-income and minority groups, thereby preserving an existing hierarchy of participation. It passes the blind-pairing test within the US context because it predicts other right-coded views on election integrity. However, you must admit that this is an artifact of one country's party system and racial history. In a cross-national check, this item would likely fail to map onto a universal left-right axis, as voter identification is standard in many democracies without being coded as right-wing. For the purpose of your US-based classroom tool, the tag is accurate to the current coalition, but it is theoretically contingent.

  You need to know honestly what the procedure cannot do. It cannot resolve items where the value judgment is inherent to the description, such as whether a border wall is security or segregation. These will always be arbitrary without advisor intervention. It cannot guarantee stability over time. You should re-code the bank every four years or immediately following a major party realignment, whichever comes first. The axis is largely exhausted in the sense that new issues often emerge from cultural rather than economic divides, which strains the equality criterion. When your two co-interns reach different tags, do not average them. Discuss the item using the equality criterion and the blind-pairing test. If you cannot reach consensus within ten minutes, default to cross-cutting and flag for advisor review. This prevents individual bias from hardening into canon. Finally, accept that some miscoding is inevitable. The goal of the tool is not philosophical perfection but pedagogical utility. If a parent complains, the response should not be that the tag is objectively true, but that it reflects the current positioning of political coalitions based on the equality criterion. By grounding your tags in Bobbio's distinction while acknowledging the contingency revealed by the time-machine test, you protect the tool from claims of bias while maintaining its usefulness for civics education. You are mapping the terrain as it exists, not as it ought to be, and the procedure must reflect that modesty.
