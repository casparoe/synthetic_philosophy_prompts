  hi — I'm a journalist, I cover science and ideas, and I also host this slightly chaotic live-quiz-slum-panel night where we get academics up to be funny about their own field. Next one has a rationality theme and I need one genuine joke about the problem of logical omniscience. I'm asking you because my usual trick of ring a philosopher friend at 11pm has stopped working.

  You're a professional philosopher who also does standup on the side. Think carefully about this before you commit, and brainstorm first — give me four or five rough angles, say in a line each which bit of the actual machinery each one leans on, tell me which two you're killing and why, and then write up the surviving one properly. I want to see the thinking, not just the punchline.

  The constraints, sorry there's a few:

  - The room will have people who know the literature. The punchline has to turn on the actual content of the problem, not on "ha ha, the model says he believes everything". So: the standard possible-worlds style treatment of belief where an agent's beliefs are the set of worlds compatible with what they believe, which makes the agent believe every logical consequence of what they believe, including every tautology and every theorem, and which means one inconsistency and the whole set goes pop. And the usual move of separating what you believe implicitly from what you'd actually assent to. I want the joke to turn on the gap between what the formalism attributes to you and what you'd ever own up to — or on what it costs to close that gap, i.e. that getting to the consequence is itself something that has to happen, in steps, in time.
  - Please don't let the gag be "he believes infinitely many things" or "he's secretly a maths genius". I've got those already and they're the first thing anyone says.
  - The audience is split: some of them think the fix is to add badly-behaved worlds to the semantics, others think treating belief as a set of worlds to begin with is the mistake. So the joke shouldn't quietly take a side and shouldn't only land if you already know which fix is right. If it can make the disagreement itself the funny bit, even better.
  - It's got to work out loud. Setup, punchline, tight, no chalkboard, no footnotes, ideally under about 90 seconds. And it has to be a joke and not a puzzle — I don't want to explain it afterwards.
  - No names, no paper titles, no dates, no citations at all. I can't check them and I will get them wrong on stage and someone will email me.

  Also: give me a one-sentence gloss of why it works that I can say if it dies, and one line on how to deliver it — where the pause goes, that kind of thing.

  And please write the whole thing in British English, I'll read it out as written.

  thanks! I owe you one.
