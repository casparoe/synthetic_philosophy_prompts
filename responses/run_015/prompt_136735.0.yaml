              *   *Premise vs. Rule:* The student needs to recognize that adding $C$ as a *premise* definitely fails (Carroll's original point). Adding it as a *rule* is the standard "solution" (logic requires primitive rules), but the Enthusiast's specific formulation ("From... a premise saying that some rule R permits...") might be tricky. It essentially internalizes the justification of the rule into the inference.
