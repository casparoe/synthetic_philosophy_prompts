      *   **Mary's Leak (The Accountability Layer):** This is the pivot. Mary represents the "Moral Forgetting" issue. She didn't just forget pain; she forgot *complicity*. The tapes force the "Audit." This separates the "victim" (Joel/Clem) from the "perpetrator/system" (Mierzwiak).
      *   **The Ending (The "Okay"):** This is the hardest part to parse. Why try again?
          *   *Philosophical point:* It's not that forgetting is bad. It's that *ignorance* is the problem.
          *   *Dev Analogy:* Knowing the system crashes but having the logs to debug it is better than a system that runs silently but corrupts data.
      *   **Where the Reading Stretches:** The movie is messy. It's not a clean ethical treatise. It's a romance. The "Okay" might just be fatalism, not a moral victory. Don't over-intellectualize the emotion.
      *   **What the Film Adds:** Abstract philosophy talks about "should we forget?" The movie asks "What happens when you *can* forget?" It introduces the *temporal* aspect. You can't just delete; you have to live with the *gap* where the data was.

