answer: |-
  **Schema Mapping**
  Base tables hold simples (rows in 1NF). Composition is the derivation of composite rows. The Special Composition Question (SCQ) asks: for any set of non-overlapping rows `xs`, when do we `INSERT` a composite row `y`?

  **The Positions**
  *   **Nihilism:** No `CREATE MATERIALIZED VIEW`. Composites are virtual views only (`CREATE VIEW`). Querying "chair" returns a join of simples, but no row ID exists for the chair itself. Existence = base table presence.
  *   **Universalism:** Auto-materialize every valid join predicate. `SELECT * FROM simples WHERE 1=1` gets a row. The fusion of the Eiffel Tower and your ear gets a PK and constraints.
  *   **Organicism (van Inwagen):** Materialization trigger fires only `WHEN life_activity(xs)`. A bee swarm is a virtual view; a bee is a materialized row.
  *   **Brutalism:** A constraint exists (`CHECK (composition_valid)`), but the logic is opaque. No derivation rule, just a brute schema rule.
  *   **Vagueness Argument:** If the JOIN predicate is vague (`distance IS CLOSE`), the materialized view's row count is indeterminate. This violates boolean existence (NULL vs TRUE/FALSE), breaking ACID compliance for ontology.

  **Grappling Points**
  *   **View vs. Materialized:** This is the ontological load-bearing wall. If composition is virtual, nihilism wins. If materialized, realism wins. But does materialization add entity status or just cache access? In DBs, materialization is performance; in metaphysics, it's being.
  *   **Identity:** Is the composite row an alias (FK to simples) or a new PK? If new PK, how do we enforce uniqueness without double-counting? Aliasing suggests reductionism; new PKs suggest emergence.
  *   **Overdetermination:** If an update to simples fires a trigger on the base table *and* the materialized view, do we count causal work twice? In DBs, we prevent this with constraints. In metaphysics, parsimony deletes the view to avoid double-counting causal power. The DB analogue makes the argument stronger: derived data shouldn't fire independent business logic.
  *   **Gunk/Junk:** Gunk = No base table (infinite normalization violation; every table is a view of another). Junk = No top-level view (no `SELECT * FROM Universe`).
  *   **Problem of the Many:** Multiple JOIN predicates (`border +/- 1mm`) return overlapping row sets for "The Table". Which PK is the real one? The DB solution is arbitrary precedence; the metaphysical problem is that reality shouldn't allow arbitrariness.

  **Residue Report**
  Your suspicion is correct. The translation forces (a): the dispute collapses into modelling choices. In DBs, "existence" is pragmatic: do we materialize for performance or integrity? There is no "fact of the matter" beyond the schema design.

  The translation breaks here: **"In DBs, 'existence' is pragmatic... There is no 'fact of the matter' beyond the schema design."**

  Metaphysicians ask if the row *must* exist given the data. DBs ask if we *should* define the table given the workload. The SCQ asks about the territory; the DB vocabulary describes the map. You cannot express "mind-independent existence" because a database is inherently a model *of* something, not the thing itself. The question "Do the xs compose y?" translates to "Do we define a view for y?" which changes a factual query into a design decision.

  **Smuggled Assumptions**
  1.  **Representationalism:** I assumed reality maps to rows. Metaphysicians might claim objects aren't data structures.
  2.  **Individuation by Key:** I assumed identity requires a PK. Maybe objects are keyless or identified by content hash?
  3.  **Fixed Base:** I assumed simples are base tables. Maybe the base level is also conventional (schema drift)?
  4.  **Interest-Relativity:** DB schemas are interest-relative (query patterns). Metaphysics claims mind-independence. By using DB terms, I implicitly framed existence as relative to a user/query, which begs the question against realism.

  The vocabulary is too clean. It solves the SCQ by dissolving it into engineering trade-offs, which is exactly why the metaphysicians insist their question isn't about engineering. They want to know if the `INSERT` happens regardless of whether anyone defines the table. The DB framework has no slot for "unreferenced data."
