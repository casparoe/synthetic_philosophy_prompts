answer: |-
  To reconstruct the implicit philosophical commitments of these three institutional arrangements, we must analyze how each operationalizes the concept of "the People" and the mechanism by which popular will is translated into legitimate authority. While all three fall under the broad category of direct democracy, they rest on divergent, and often incompatible, theories of sovereignty, autonomy, and epistemic authority.

  ### I. Conceptual Reconstruction of the Three Models

  **1. Switzerland: Federalist Corporatism and Compound Sovereignty**
  The Swiss double-majority rule presupposes that the *demos* is not a unitary aggregate of individuals but a compound entity composed of constituted sub-communities (the cantons).
  *   **Popular Sovereignty:** Sovereignty is not vested in the national majority alone but is shared between the national populace and the territorial corporations. This rejects the atomistic view that every citizen's vote should weigh equally regardless of location. Instead, it treats the canton as a co-equal bearer of sovereignty.
  *   **Collective Autonomy:** Autonomy is exercised *mediatedly*. The citizen acts not merely as an individual but as a member of a territorial collective. Legitimacy requires the concurrent consent of distinct political bodies, ensuring that the "general will" does not simply override regional particularities.
  *   **Epistemic Deference:** The system presupposes that local knowledge and regional interests are epistemically vital to constitutional stability. It assumes that a policy legitimate for the aggregate may be illegitimate for the federation if it violates the autonomy of the constituent units. The double majority is a procedural check against the epistemic blind spots of urban majorities regarding rural or minority regional needs.

  **2. United Kingdom (Brexit): Political Constitutionalism and Dual Sovereignty**
  The Brexit referendum arrangement presupposes a distinction between *legal sovereignty* (vested in Parliament) and *political legitimacy* (vested in the People).
  *   **Popular Sovereignty:** The people possess a "constituent power" that is episodic and morally authoritative but legally latent. The vote creates a political obligation for representatives, even if it creates no legal command. This implies a theory of *trusteeship* where the representative body retains the legal right to decide but loses the moral right to contradict the popular signal.
  *   **Collective Autonomy:** Autonomy is expressed as a veto or a mandate rather than continuous self-legislation. The people act as a distinct organ that interrupts routine politics to issue a directive.
  *   **Epistemic Deference:** This model relies on a precarious distinction between the *will* (the decision to Leave) and the *opinion* (the method of Leaving). It presupposes that the people's will is coherent enough to bind politicians politically, yet vague enough to require parliamentary interpretation. The tension arises because the epistemic authority of the vote was treated as specific (implement Brexit) while the legal authority remained general (Parliament decides how). This creates a hybrid where the people are authoritative on *ends* but deferential on *means*, yet the boundary between the two is porous.

  **3. California: Plebiscitary Majoritarianism and Atomistic Aggregation**
  The California proposition system presupposes that the people function as a legislature of last resort, operating through immediate, unmediated aggregation.
  *   **Popular Sovereignty:** Sovereignty is unitary and atomistic. One person, one vote, simple majority. There is no recognition of sub-communities (as in Switzerland) or a distinction between legal and political authority (as in the UK). The vote *is* the law.
  *   **Collective Autonomy:** Autonomy is exercised *immediately*. However, this immediacy comes at the cost of complexity. By packaging complex provisions into binary choices, the system presupposes that citizens possess a unified, coherent preference ordering over multi-dimensional policy spaces.
  *   **Epistemic Deference:** This model reveals a commitment to *procedural minimalism*. It abandons the requirement for deliberative coherence in favor of tractability. It assumes that the *act* of choosing is more important than the *quality* of the judgment formed. It treats preferences as exogenous inputs to be counted rather than endogenous judgments to be refined. The implicit theory is that legitimacy derives from the purity of the majoritarian mechanism, not the rationality of the outcome.

  ### II. Consistency and Incompatibility

  These three practices are **structurally incompatible**, though they share a deeper **aggregative commitment**.

  **The Incompatibilities:**
  1.  **Structure of the Demos:** Switzerland treats the demos as *corporate and federal*; California treats it as *atomistic and unitary*. In Switzerland, a voter in a small canton has greater weight than a voter in a large one regarding constitutional amendments; in California, such weighting would be viewed as a violation of equal protection.
  2.  **Nature of the Mandate:** The UK model treats the popular vote as *advisory-but-binding* (a moral constraint on agents); California treats it as *dispositive* (the principals acting directly). The UK model preserves a space for representative deliberation on implementation; California eliminates that space by codifying details directly into the constitution.
  3.  **Coherence of Will:** California presupposes that a binary vote captures a coherent policy preference. The UK experience revealed that a binary vote often masks contradictory preferences (e.g., leaving the EU while retaining market access). Switzerland avoids this by making the threshold for change higher, acknowledging that a simple majority may not reflect a stable consensus.

  **The Shared Aggregative Commitment:**
  Despite these differences, all three models share a foundational commitment to **aggregative democracy**. In all three cases, legitimacy is derived from the *counting of pre-formed preferences*.
  *   In Switzerland, the preferences are counted twice (people and cantons).
  *   In the UK, the preferences are counted once to generate a moral mandate.
  *   In California, the preferences are counted once to generate law.
  None of these models institutionalize the *transformation* of preferences. They all assume the voter arrives at the booth with a fixed will that must be registered, not a judgment that must be tested against counter-arguments or revised through dialogue.

  ### III. Shifting to a Deliberative/Epistemic Model

  If we replace the aggregative presuppositions with a **deliberative or epistemic model**—where legitimacy derives from the transformation of judgment through structured public reasoning—the institutional design of all three systems would require fundamental reconstruction. In an epistemic model, the goal is not merely to tally what people want, but to approximate what they *would* want under conditions of full information and reasoned debate.

  **1. Reconstructing the Swiss Model: From Concurrent Voting to Cross-Cantonal Deliberation**
  *   **Current Flaw:** The double majority protects regional interests but does not necessarily foster reasoning *between* regions. It allows for parallel monologues (voting within cantons) rather than dialogue.
  *   **Institutional Change:** A deliberative redesign would require **inter-cantonal citizens' assemblies** prior to the referendum. Instead of merely requiring concurrent majorities, the process would mandate a phase where randomly selected citizens from diverse cantons deliberate jointly on the amendment. The "cantonal majority" requirement would be supplemented by a requirement that the proposal be vetted by a sortition-based body representing the federal structure. Legitimacy would shift from "did the cantons agree?" to "did the cantons reason together?"

  **2. Reconstructing the UK Model: From Advisory/Binding Hybrid to Iterative Mandate**
  *   **Current Flaw:** The distinction between the people's will (ends) and Parliament's discretion (means) collapsed because the "will" was ill-formed. The referendum asked a binary question about a complex relationship.
  *   **Institutional Change:** A deliberative model would reject the one-off plebiscite. Instead, it would employ a **multi-stage referendum process** anchored by a Citizens' Assembly.
      *   *Stage 1:* A Citizens' Assembly defines the viable options (e.g., Remain, Soft Leave, Hard Leave) based on expert testimony.
      *   *Stage 2:* A referendum is held on these specific, delineated options (preferential voting rather than binary).
      *   *Stage 3:* Implementation is overseen by a parliamentary committee that includes citizen delegates to ensure the "will" is not distorted during negotiation.
      *   *Theoretical Shift:* This dissolves the tension between legal and political sovereignty by making the "will" specific enough to be legally actionable, removing the need for a "politically binding" fiction.

  **3. Reconstructing the California Model: From Binary Packaging to Unbundled Amendment**
  *   **Current Flaw:** Binary packaging forces incoherent preference aggregation. It assumes citizens can evaluate complex regulatory bundles as a single unit.
  *   **Institutional Change:** A deliberative design would introduce **amendability and unbundling**.
      *   *Mechanism:* Voters should not be restricted to Yes/No on a finalized text. Institutional design could allow for a "referendum convention" where voter-approved propositions can be amended by a supermajority legislative vote or a subsequent corrective vote without restarting the entire signature process.
      *   *Deliberative Filter:* Propositions would require a "statement of impact" vetted by an independent, non-partisan body (epistemic authority) that is binding on the ballot text.
      *   *Theoretical Shift:* This abandons procedural minimalism. It acknowledges that popular sovereignty is not about the *finality* of the vote, but the *correctability* of the decision. It treats the electorate as a continuous body capable of refining its judgments, rather than a momentary aggregator of fixed preferences.

  ### IV. Conclusion: The Core Theoretical Divergence

  The tension you identified stems from the fact that Switzerland, the UK, and California are all attempting to solve the problem of **scale and complexity** in popular rule, but they do so using **aggregative tools**.

  *   **Switzerland** solves it by fragmenting the count (federalism).
  *   **The UK** solved it by fragmenting the authority (legal vs. political).
  *   **California** solves it by simplifying the choice (binary bundling).

  A **deliberative/epistemic model** rejects the premise that the vote is the primary site of legitimacy. Instead, it posits that legitimacy resides in the *process preceding the vote*. To adopt this model, institutions must move away from mechanisms that merely register preferences (referenda, propositions) and toward mechanisms that construct judgments (assemblies, iterative voting, amendable mandates). The implicit theory of popular sovereignty shifts from "the People as a Sovereign Decider" to "the People as a Sovereign Deliberator." This requires abandoning the tractability of the binary choice and the clarity of the simple majority in favor of processes that are messier, slower, and designed to filter out incoherence rather than merely count it.
