          *   California: *Plebiscitary Majoritarianism*. Sovereignty is immediate and atomistic.
      *   *Refining the "Deliberative Shift":* Focus on *transformation* of preferences. The key is that current models treat preferences as *exogenous* (fixed before voting), whereas deliberative models treat them as *endogenous* (formed during process).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific questions about "constituted sub-communities," "will vs. opinion," and "unified preference ordering"?
      *   *Correction:* Ensure I explicitly address these phrases in the analysis sections.
      *   *Check:* Did I avoid bibliographies? Yes.
      *   *Check:* Is the distinction between epistemic deference and aggregative clear?
      *   *Refinement:* Make sure to highlight that "epistemic" in the prompt's final paragraph refers to *epistemic democracy* (truth-tracking through deliberation), not just deferring to experts. The current models defer to the *count*, the new model defers to the *process of reasoning*.

