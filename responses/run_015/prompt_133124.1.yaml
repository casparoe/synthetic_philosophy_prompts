      *   *Epistemic Deference:* Assumes local/cantonal knowledge or interest protection is vital. Legitimacy requires concurrent consent of distinct corporate bodies.

  3.  **Analyze Case 2: UK Brexit (Advisory/Politically Binding)**
      *   *Mechanism:* Legally advisory to Parliament, but politically treated as a command.
      *   *Implicit Theory:* A distinction between *legal sovereignty* (Parliament) and *political legitimacy* (The People).
      *   *Sovereignty:* Parliament remains the legal sovereign, but the "People" hold a higher-order moral/political veto or mandate.
      *   *Autonomy:* The people's will is episodic and explosive, not continuous. It acts as a "constitutional moment" (in a loose sense) rather than routine governance.
      *   *Epistemic Deference:* The vote is treated as an authoritative signal of direction, but the *means* are delegated. However, the tension arises because the "will" was treated as specific (Leave) despite the ballot being vague (Leave how?). It presupposes the People have a coherent will that representatives must discern, even if not legally bound to obey.

  4.  **Analyze Case 3: California (Ballot Propositions)**
      *   *Mechanism:* Simple majority, binary yes/no on complex bundles. No amendment allowed by voters.
      *   *Implicit Theory:* Popular sovereignty is *plebiscitary* and *immediate*. The people are a legislature of last resort.
      *   *Sovereignty:* Unmediated individual aggregation. One person, one vote, simple majority rules.
      *   *Autonomy:* Assumes citizens can digest complex regulatory/fiscal bundles and make a coherent choice.
      *   *Epistemic Deference:* Low. It assumes the *outcome* matters more than the *quality of judgment*. It prioritizes *decisional tractability* over *deliberative coherence*. It treats preferences as fixed inputs to be counted, not judgments to be refined.

  5.  **Synthesize and Compare (Consistency vs. Incompatibility)**
      *   *Common Thread:* All three rely on *aggregation* of preferences (voting) as the ultimate arbiter of legitimacy, rather than deliberation. They all treat the "vote" as the moment of sovereignty.
      *   *Tension 1 (Compound vs. Atomistic):* Switzerland (Compound/Corporate) vs. California (Atomistic/Aggregate). Switzerland says sub-units matter; California says only individual votes matter.
      *   *Tension 2 (Mediated vs. Immediate):* UK (Mediated/Interpretive) vs. California (Immediate/Direct). UK says Parliament interprets the will; California says the vote *is* the law.
      *   *Tension 3 (Coherence of Will):* California assumes a binary choice captures complex will. UK assumes the will is clear enough to bind politically but vague enough to require parliamentary implementation. Switzerland assumes the will must be geographically concurrent.
      *   *Verdict:* They are largely *incompatible* regarding the *structure* of the demos (compound vs. unitary) and the *nature* of the mandate (binding law vs. political signal vs. protected minority veto). However, they share a deeper *aggregative* commitment (legitimacy = counting heads) which contrasts with deliberative models.

  6.  **Develop the Deliberative/Epistemic Counter-Model**
