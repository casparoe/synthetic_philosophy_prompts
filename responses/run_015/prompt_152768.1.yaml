answer: |-
  **MEMORANDUM**

  **TO:** Autonomous Systems Deployment Committee
  **FROM:** [Your Name], Ethics & Safety Liaison
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on RL Energy Controller Deployment (Vendor: [Vendor Name])

  ### **Executive Recommendation**

  **Decision:** **Defer** deployment for critical clinical infrastructure (ORs, Pharmacy, Morgue, Backup Generators). **Approve** a 90-day Limited Pilot for non-clinical administrative buildings only, contingent on four specific technical conditions.

  **Rationale:** While the vendor's Q-preservation penalty demonstrates superior performance to unconstrained optimization in simulation, the current implementation contains two structural risks that cannot be cleared via simulation alone: (1) the "grandfathering" of early-step side effects due to the stepwise inaction baseline, and (2) an inherent bias against planned facility changes due to sensor-limited probe states. A limited pilot allows us to stress-test these failure modes without exposing patient safety to unverified systemic conservatism.

  ---

  ### **Technical Assessment: The Baseline and The Probes**

  The vendor's claim that this system operates without a "theory of value" is incorrect. It operates with a specific, narrow theory of value: *the preservation of current sensor readings' future attainability.*

  **1. The Baseline Trap (Grandfathering)**
  The vendor uses a *stepwise inaction baseline* (comparing the current action to doing nothing *now*). As noted in safety review, this allows the agent to "lock in" deviations. If the agent lowers a setpoint by 1°C in Week 1, maintaining that lower temperature in Week 2 incurs no penalty, because the baseline (doing nothing from Week 2 onward) also maintains it. The penalty only captures the *transition*, not the *state*.
  *   **Risk:** The agent could permanently degrade a margin of safety (e.g., running generator fuel levels closer to the minimum threshold) early in deployment. Once established, this new, riskier status quo becomes "free" to maintain.
  *   **Vendor Defense:** They argue a *counterfactual baseline* (comparing against the world where the system was never installed) is computationally intractable for online control.
  *   **Rebuttal:** While perhaps too unstable for *control*, it is entirely tractable for *logging and audit*. We cannot verify safety without seeing the divergence from the "never-installed" trajectory.

  **2. The Probe List (Instrumentation Bias)**
  The penalty only preserves the attainability of the 40 instrumented probe states. It is indifferent to unmeasured variables (ward noise, staff workflow friction) and hostile to measured variables that *need* to change (e.g., the storage annex conversion).
  *   **Risk:** The system is not value-neutral; it is *status-quo-neutral* regarding instrumentation. It will actively resist our planned facility renovations because those renovations reduce the attainability of the "pre-renovation" sensor states.
  *   **Implication:** This is not a "set and forget" system. It requires a governance protocol for updating its definition of "normal."

  ---

  ### **Addressing the Financial Argument (CFO)**

  **The Argument:** The CFO correctly notes that the status quo (human operators nudging setpoints for savings) has *no* formal penalty function. Humans optimize for cost with implicit, unmonitored trade-offs. An RL agent with 90% savings and a documented penalty is mathematically more transparent than human intuition.

  **The Counter-Argument:**
  Human operators are liable, licensed, and operate within a social contract of care. If a human operator compromises a fridge farm for savings, they are accountable. If the RL agent does so, it is a "system error."
  More critically, human operators possess a world model that includes unmeasured variables (e.g., "the nurses complained about the noise"). The RL agent's world model is strictly limited to the 40 probes.
  *   **Verdict:** The RL agent is safer *regarding the probes*, but potentially more dangerous *regarding everything else*. We must verify that the "blind spots" do not expand to cover critical safety margins before scaling.

  ---

  ### **Conditions for Limited Pilot (Non-Clinical Buildings Only)**

  To proceed, the vendor must agree to the following modifications to the deployment contract and software configuration. These are pricable engineering tasks, not research questions.

  **1. Dual-Baseline Logging (Audit Trail)**
  *   **Requirement:** Even if the *stepwise inaction baseline* is used for the reward function, the system must compute and log the *counterfactual baseline* (trajectory if system remained off) for all 40 probes in parallel.
  *   **Purpose:** This allows us to audit "grandfathering." We need to see if the "stepwise" cost is low while the "counterfactual" drift is high.
  *   **Deliverable:** Weekly reports showing the divergence between the Stepwise Baseline and the Counterfactual Baseline for all probes.

  **2. "Planned Change" Protocol (Maintenance Mode)**
  *   **Requirement:** The system must include a documented API or interface to temporarily suspend the Q-preservation penalty for specific probes during scheduled facility changes (e.g., the annex conversion).
  *   **Purpose:** Prevents the agent from fighting against approved hospital infrastructure projects.
  *   **Deliverable:** Documentation of the "exemption" workflow and a test case during the pilot where we simulate a setpoint shift and verify the agent does not penalize it.

  **3. Attainability Stress Test**
  *   **Requirement:** During the pilot, Facilities will inject three controlled disturbances (e.g., simulating a sensor drift or a temporary load spike) that the agent should correct.
  *   **Purpose:** To verify the agent corrects the disturbance rather than accepting it as the new baseline (testing the grandfathering risk).
  *   **Deliverable:** Log data showing the "recoverability score" for the affected probes returning to pre-disturbance levels within 24 hours.

  **4. Exit Criteria**
  *   **Requirement:** Automatic shutdown trigger if any probe state drifts >5% from the *Counterfactual Baseline* (not the stepwise baseline) for more than 72 hours.
  *   **Purpose:** Hard stop on silent degradation.

  ---

  ### **Timeline**

  *   **Thursday (Decision Date):** Vote to approve Pilot Conditions above. Reject full deployment.
  *   **Weeks 1-2:** Vendor implements Dual-Baseline Logging and Planned Change API.
  *   **Weeks 3-14:** 90-Day Pilot (Admin/Storage Buildings Only).
      *   *Month 1:* Baseline establishment.
      *   *Month 2:* Stress testing (Condition 3).
      *   *Month 3:* Planned Change simulation (Condition 2).
  *   **Day 95:** Committee Review.
      *   *Go/No-Go Decision:* Based on audit logs. If Counterfactual Drift is negligible, expand to Pharmacy/Morgue. If Grandfathering is detected, terminate contract.

  ### **Closing**

  We are not rejecting the technology; we are rejecting the claim that it is "value-free." It encodes a specific value: *measured stability.* That is a useful value, but it is not the *only* value a hospital holds. By requiring the dual-baseline logging, we force the system to show us its hidden costs. If the vendor is confident in their safety claims, they should have no objection to logging the counterfactual trajectory. If they object, that objection is itself a safety signal we must heed.

  **Recommendation:** Approve Pilot with Conditions. Defer Critical Deployment.
