prompt: |-
  I'm giving the toast at my mentor's 75th birthday dinner. She was a civil rights lawyer for fourty years, and the room is split between her law partners — who know she used to read Cicero's essay on old age every year on her birthday — and her grandkids, who definitely don't. She just moved into a smaller apartment and left me a specifc instruction: don't say she's "entering a new chapter," don't claim she's "watching over us," and don't pretend the move is liberation. I want the toast to take Cicero's four standard complaints about old age — that it pulls you out of public life, weakens the body, strips away pleasure, and puts you close to death — and use them as the actual bones of the speech, not decoration. For each one, apply it to her real situation: she's still taking pro bono cases but can't drive after dark; she says food tastes like cardboard since chemo; she's terrified of dying alone but won't admit it out loud. Say whether Cicero's rebuttal actually holds up in her case, or if it collapses, and let that determine what I can honestly say and what I have to leave unsaid. The toast should run about five minutes and land for the lawyers without leaving the kids behind. After the speech, please summarize the structural choices in a JSON object with these fields: "complaint" (string, one of the four), "applies_to_her" (yes / partial / no), "cicero_rebuttal_holds" (yes / no / modified), "unsayable_phrase" (the sentimental line this blocks), and "audience_bridge" (one sentence on how the point was made accessible to the grandkids). Give me the toast first, then the JSON.
