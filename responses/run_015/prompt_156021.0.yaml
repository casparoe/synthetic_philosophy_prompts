answer: |-
  Good evening. For those of you who don't know our tradition: every year on her birthday, [Mentor's Name] reads Cicero's essay *On Old Age*. The lawyers in the room are nodding. The grandkids are wondering who Cicero was. He was a Roman statesman who, two thousand years ago, made a list of four complaints about getting old. He argued against them. Tonight, I want to use his list not to argue, but to tell the truth about where she stands at seventy-five.

  Cicero's first complaint is that old age withdraws you from active life. He argues that while you stop rowing the ship, you still steer it.
  [Mentor's Name], you moved into a smaller apartment last month. We are not going to call that "liberation," and we are not going to call it "downsizing into a new chapter." It is a smaller space. But Cicero is right about the steering. You are still taking pro bono cases. You are still writing briefs. The only difference is you don't drive after dark anymore. The work remains, even if the radius shrinks. For the grandkids: Imagine still doing your homework, but only when the sun is up. The job isn't done, the rules just changed.

  Cicero's second complaint is that old age enfeebles the body. He admits this is true but says the mind compensates.
  Here, Cicero holds up, but it's a bitter victory. We know about the chemotherapy. We know it has taken a toll. He is right that your mind is as sharp as it was in the courtroom in 1985. But we don't pretend the body doesn't matter. It does. When the body struggles, it takes courage just to sit at this table.

  Cicero's third complaint is that old age strips away physical pleasures. He argues this is a good thing, that you are freed from the tyranny of appetite.
  On this point, Cicero is wrong. And I think you'd agree. When chemo makes food taste like cardboard, that is not a philosophical freedom. It is a loss. We aren't going to pretend you enjoy dinner less now. You do. And it sucks. For the grandkids: It's like when you have a cold and your birthday cake tastes like nothing. It doesn't make you "wiser," it just makes the cake less sweet. Cicero says you shouldn't care. We know you do.

  Cicero's fourth complaint is that old age is too close to death. He argues we should accept it like ripe fruit falling from a tree.
  This is where his argument collapses completely. Philosophy doesn't stop the fear of being alone. He doesn't talk about who is in the room when the fruit falls. We cannot say you are "watching over us" from the future, because you are here, now. And the only answer to the proximity of death is not stoicism, but presence.
  So, here is the truth: The apartment is smaller. The driving is limited. The food doesn't taste right. And the end is closer than the beginning. Cicero tried to talk his way out of these things. You simply live through them.

  We are not here to celebrate a "new chapter." We are here to witness this one. The lawyers know the case law; the grandkids know the hug. Both are needed.
  To [Mentor's Name].

