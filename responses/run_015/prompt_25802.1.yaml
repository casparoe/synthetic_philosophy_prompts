      *   **Caruso (Free Will Skeptic/Basic Desert Skeptic):** We lack the kind of free will required for *basic desert* moral responsibility (being worthy of praise/blame *just because* of what one did, regardless of consequences). Determinism (or luck) undermines ultimate control. Punishment should *only* be justified forward-looking (public safety, rehabilitation, deterrence), never retributively. We should adopt a "public health-quarantine model."

