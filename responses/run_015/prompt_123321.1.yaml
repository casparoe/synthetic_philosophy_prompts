answer: |-
  **Note on Stipulations**
  Stipulation 4 regarding the "reading resilience" composite contains a statistical complication. Calculating heritability on a subgroup selected for extreme scores (top quartile performance given bottom quartile home literacy) restricts the variance in ways that make standard estimates unstable. For the purpose of this document, we restate this as: "Estimating heritability within this selected subgroup requires correcting for range restriction, otherwise the number will be artificially low."

  ***

  ### Section 1: Agreed Claims

  1. Heritability is defined as the proportion of total variance in a trait attributable to genetic variance within a specific population at a specific time.
  2. It is a property of a population distribution, not an individual, so no single student has a personal heritability score.
  3. A high heritability estimate does not imply that the trait is immutable or unaffected by environmental changes.
  4. Conversely, a low heritability estimate does not guarantee that environmental interventions will be effective or easy to implement.
  5. Heritability estimates within groups cannot be used to infer the causes of average differences between groups.
  6. Both teachers agree that the rise from 0.51 to 0.66 is mathematically consistent with a successful intervention that reduced environmental variance more than genetic variance.
  7. Neither teacher claims that the 0.66 estimate proves genetics caused the improvement seen after tutoring.
  8. Both agree that the heritability of gain scores (0.40) indicates genetic factors influence how much students benefit from instruction, not just where they start.
  9. Heritability describes the sources of existing variation, not the mechanism by which a trait develops in any single organism.
  10. Changing the distribution of environments, such as equalizing school funding, will necessarily change the heritability estimate even if genetic effects remain constant.
  11. Both agree that using heritability to deny resources to struggling students is scientifically unjustified.
  12. Both agree that ignoring genetic differences when designing personalized learning tools may limit effectiveness.

  ### Section 2: Disagreements

  | The Crux | Ms. Reyes's Claim (Biology) | Mr. Okafor's Claim (Equity) | Policy Consequence of Settling This |
  | :--- | :--- | :--- | :--- |
  | **Policy Guidance** | High heritability suggests we should invest in personalized interventions that match genetic predispositions. | High heritability suggests we should invest in universal supports because environmental noise has been minimized. | Determines whether funding goes to differentiated instruction or universal resource equalization. |
  | **Stability of the Statistic** | The rise to 0.66 shows the environment was successfully standardized, making the genetic signal clearer. | The rise to 0.66 shows the statistic is too sensitive to background noise to be a stable guide for long-term planning. | Determines whether we treat the number as a fixed constraint or a temporary snapshot. |
  | **Causal Depth** | Partitioning variance identifies distinct causal channels that operate independently. | Partitioning variance hides how genes and environments interact dynamically and cannot be separated. | Determines whether we model students as having fixed potentials or dynamic trajectories. |
  | **Interpretation of Gain Scores** | A heritability of 0.40 for gains proves some students are genetically predisposed to learn faster from tutoring. | A heritability of 0.40 for gains proves the tutoring was not equally effective across different backgrounds. | Determines whether we view learning rates as innate or as a measure of intervention fit. |

  ### Section 3: Pre-registered Predictions

  **Test 1: The Double-Shuffle Thought Experiment**
  *   **Ms. Reyes:** Predicts that shuffling genomes (holding environment fixed) in 2025 would produce larger score variance than in 2022, reflecting the higher 0.66 estimate. She would count it against her view if shuffling genomes produced less variance than shuffling environments.
  *   **Mr. Okafor:** Predicts that shuffling environments (holding genomes fixed) would still produce larger score variance than shuffling genomes, regardless of the 0.66 estimate. He would count it against his view if environment shuffling produced negligible variance compared to genome shuffling.

  **Test 2: The Reading Resilience Composite**
  *   **Ms. Reyes:** Predicts that after correcting for range restriction, the heritability of this composite will be estimable and positive, showing genetic factors help some children overcome home disadvantages. She would count it against her view if the corrected estimate was zero.
  *   **Mr. Okafor:** Predicts that the composite is a statistical artifact where "resilience" is just unmeasured environmental support, so the heritability estimate will vanish when properly controlled. He would count it against his view if the estimate remained high after controlling for unmeasured environmental support.

  **Test 3: The Gain-Score Number (0.40)**
  *   **Ms. Reyes:** Predicts that students with higher polygenic scores for education will show larger gains from the same tutoring dose. She would count it against her view if genetic scores predicted starting status but not gain magnitude.
  *   **Mr. Okafor:** Predicts that the 0.40 reflects residual environmental differences (e.g., parental help with tutoring homework) correlated with genetics, not innate learning rate. He would count it against his view if gains remained correlated with genetics after controlling for all home support during the tutoring period.

  **Test 4: The Variance Ratio Issue**
  *   **Ms. Reyes:** Predicts that the absolute genetic variance remained constant while environmental variance dropped, causing the ratio to rise. She would count it against her view if absolute genetic variance increased during the tutoring period.
  *   **Mr. Okafor:** Predicts that we cannot distinguish whether genetic variance changed because we only observe the ratio, making the 0.66 claim unverifiable. He would count it against his view if independent molecular data confirmed genetic variance remained perfectly constant.

  ### Section 4: Verbal versus Genuine

  There are two distinct types of disagreement here. The first is verbal, centering on the word "importance." When Ms. Reyes says heritability is "important," she means it is a statistically significant portion of the variance equation. When Mr. Okafor says it is "misleading," he means it is morally or politically insufficient for decision-making. They are using the same number to answer different questions: one asks "what varies?" and the other asks "what should we do?" No amount of defining will dissolve this, because it is a clash between descriptive science and normative policy.

  The second disagreement is genuine and empirical. It concerns whether the environment can be sufficiently standardized to make genetic differences the primary remaining source of inequality. Ms. Reyes believes the tutoring program approached this standardization, hence the rise to 0.66. Mr. Okafor believes true standardization is impossible in a socially stratified district, so the 0.66 reflects hidden environmental biases, not genetic reality. This is testable via the double-shuffle predictions. If environment shuffling still dominates outcomes, Mr. Okafor is empirically correct about the hidden variance. If genome shuffling dominates, Ms. Reyes is empirically correct about the biological constraint. This is not about words; it is about the structure of causality in this specific district.

  ### Section 5: Note to the Audience

  You are watching two experts agree on the math but disagree on the meaning. Both teachers accept the definition of heritability and agree that high heritability does not mean a trait is unchangeable. They also agree that the rise in the statistic from 0.51 to 0.66 is mathematically possible after a successful tutoring program. The fight is not about whether the numbers are real, but about whether those numbers should guide how we treat students. Ms. Reyes worries that ignoring genetic differences wastes opportunities to personalize learning. Mr. Okafor worries that focusing on genetic differences excuses the school system from fixing unequal environments. The question remains open: in a fair system, do genetic differences matter more, or less?
