  | **Compatibility** | Most standard actualities |

  **Frequently Asked Questions**

  **Q: Is the lamp on or off at the one-minute mark?**
  A: The Thomson™ Node maintains exactly one state at all times except at limit points of toggle sequences. At t=1, the state is undefined by default hardware. However, with the latest over-the-air update, owners may select the final state (On/Off) via the Liminal App. Please note that selecting a state does not imply the state was determined by the sequence, only that it is now asserted.

  **Q: What is Zeno Mode?**
  A: Zeno Mode defers the completion of the task indefinitely. Presses occur at 1/2, 1/3, 1/4 minute intervals. Because the harmonic series diverges, the one-minute mark never arrives. This mode is recommended for users wishing to postpone ontological commitment.

  **Q: Can I use this to determine logical necessity?**
  A: No. The Thomson™ is a lighting fixture, not a proof engine.

  **Warranty and Terms of Service**

  By purchasing the Thomson™ Node, you acknowledge that logical impossibility is treated as a shipping restriction. This product is not available in the Actual World due to local causality laws. Please check availability in your specific possible world before ordering. Liminal Devices assumes no liability for causal discontinuity arising from the Incoherence Clause (wherein every switching is followed by another, so no candidate final state survives) or the Completeness Clause (wherein the setup is merely incomplete, so there's no fact at the limit to discover).

