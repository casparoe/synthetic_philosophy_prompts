          3.  **Naive vs. Sophisticated:** Who demands binding? Politics of the mandate (wanting protections, hating mandate). Is this akratic structure or free-riding?
          4.  **Collective Version:** Can Congress act akratically? Group intentions vs. shifting majorities. Self-binding device dissolvable at $t+1$. Does this sink the Ulysses framing for legislation?
