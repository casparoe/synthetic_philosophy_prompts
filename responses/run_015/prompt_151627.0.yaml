          *   *Synthesis:* It's a metaphorical extension, not a strict derivation. Leo is right to call it a potential bait-and-switch if claimed as proof.
      *   **Section 3: The Consistency Predicate.**
          *   Maya: Confuses metacognition with logical provability.
