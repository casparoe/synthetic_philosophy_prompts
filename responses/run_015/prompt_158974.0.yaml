      Welcome to the Office for the Assessment of Prodigies. You are here because you understand that a law of nature is not a prescription but a ledger, a running total of unbroken experience that we are tasked with protecting. Your primary instrument is the Uniformity Reserve, which represents the cumulative weight of every sun that has risen without fail and every dead man who has remained so. When you certify a prodigy, you are not merely acknowledging an event; you are debiting the Reserve. Each approved levitation or spontaneous remission withdraws capital from the bank of uniform experience, weakening the foundational premise that allows us to reject future claims. Consequently, if the Reserve falls below a critical threshold following a run of successful certifications, you will be required to initiate an Emergency Restoration of Uniform Experience. This involves retroactively reclassifying previously certified healings as unusual but lawful physiological anomalies or downgrading their witness statements to insufficiently witnessed, thereby returning the debited uniformity to the ledger. It is vital that the public never perceives the Reserve as depleted, for our authority rests on the assumption that nature does not break, only our records do.

