          5.  Evaluate if the analogy supports the inevitability argument or if it's doing too much heavy lifting.
      *   **Constraint:** No citations needed. Focus on conceptual analysis.

  2.  **Deconstruct the "Hiking Trail" Analogy:**
      *   *Trail:* The course of historical events/technological progress.
      *   *Hiker:* Society/Civilization/Humanity.
      *   *No Backtracking:* Path dependence (sunk costs, institutional inertia, loss of knowledge).
      *   *Summit:* The end state (Democracy + Smartphones/Modernity).
      *   *Implicit Claim:* There is only *one* summit, and all trails eventually lead there, even if some are winding.

  3.  **Evaluate the "Git Branch" Analogy:**
      *   *Branch:* Divergent historical paths (e.g., Islamic Golden Age, Ming China, Western Europe).
      *   *Merge:* Cultural/technological diffusion, conquest, adoption of best practices.
      *   *Main:* The dominant global standard (not necessarily pre-ordained, but emergent).
      *   *Implication:* Outcomes aren't locked; they are selected and integrated. Code can be rewritten, not just walked.

  4.  **Drafting the Correspondence Table (Task 1):**
