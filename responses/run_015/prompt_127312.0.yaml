      *   *Section 3: The CS Person's Syntactic Ban.*
          *   Confirm the user's "cheap trick" objection is valid. Explain *why* (logical equivalence). Mention Type Theory as what the CS person *meant* but didn't say.
      *   *Section 4: The Conditional Sentence (Curry).*
