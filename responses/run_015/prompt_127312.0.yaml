  9.  (Final thought on the CS person): The CS person saying "just use types" is actually the most historically robust solution (Russell's own solution), even if they say it annoyingly. I should mention that.

  10. (Final thought on User's rewrite): The user's rewrite $\exists y (y=x \land x \in y)$ is equivalent to $x \in x$. This demonstrates that syntax-based bans are fragile unless you have a semantic model or a type system.

