      *   *Impact on ZFC:* ZFC avoids Curry because it doesn't allow a truth predicate inside the object language that satisfies naive T-schemas (Tarski's Undefinability). Set theory avoids it via Separation (you can't form the set of all sets satisfying the Curry condition without a bounding set).
      *   *Friend's Claim:* "Nothing in the ZFC fix has any bearing on sentences like it."
