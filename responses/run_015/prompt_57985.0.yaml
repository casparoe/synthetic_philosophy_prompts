prompt: |-
  so i help run a little monthly horror-short contest on discord and we're having a dumb arguement about how to pick the winner. right now its just the 7 of us mods voting by majority, and if we each watched blind we'd probly pick the actually stronger film like 6 times out of 10, nothing amazing but better than random.

  someone wants to open it up to like 25 volenteers from the server to make the result more reliabel. sounds nice but i'm skeptical because in practice nobody votes blind — everyone watches the same big horror youtuber's breakdown before voting, plus we all discuss in the main chat and people kinda pile onto whatever the first couple votes say. and the extra volenteers relly like horror but don't know much about shorts, so they'd be more like 50/50 on their own.

  would going bigger actually make us more likely to pick the better film, or could it make it worse? and would stuff like voting seperately without seeing each other's votes or skipping the youtuber video change your answer? what would you do if you were us?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Context:** A monthly horror-short contest on Discord.
      *   **Current System:** 7 mods vote by majority.
      *   **Current Accuracy:** Estimated 6/10 chance of picking the "actually stronger" film (better than random, but not great).
      *   **Proposed Change:** Open voting to ~25 volunteers from the server.
      *   **Concerns about Proposal:**
          *   Voters won't watch blind (influence from a specific horror YouTuber).
          *   Social proof/herding (discussion in main chat, piling on early votes).
          *   Voter expertise (love horror, but don't know shorts specifically -> estimated 50/50 accuracy on their own).
      *   **Questions:**
          *   Will going bigger make it better or worse?
          *   Does blind voting/no YouTuber change the answer?
          *   What would I do if I were them?

  2.  **Evaluate the "Wisdom of Crowds" vs. "Madness of Mobs":**
      *   *Theory:* The Condorcet Jury Theorem suggests that if each voter has a >50% chance of being right, adding more voters increases the probability of the majority being right.
      *   *Reality Check:* The user estimates the volunteers are 50/50 on their own. If $p = 0.5$, adding more voters doesn't help (it stays 0.5). If $p < 0.5$ (due to bad influences), adding more voters makes it *worse*.
      *   *The Bias Factor:* The YouTuber influence and chat discussion introduce *correlated error*. This is the killer. If everyone watches the same review, they aren't independent samples. They are all copying one opinion. This destroys the "wisdom of crowds."

  3.  **Analyze the Current System (7 Mods):**
      *   $p \approx 0.6$.
      *   $n = 7$.
      *   This is a small, somewhat expert group.
      *   Problem: 6/10 isn't amazing. It feels subjective.

  4.  **Analyze the Proposed System (25 Volunteers) *as described*:**
      *   $p \approx 0.5$ (base skill).
      *   Correlated error: High (YouTuber + Chat).
      *   Result: The vote becomes a popularity contest or a "who yelled first" contest, not a quality assessment. The "signal" (film quality) is drowned out by the "noise" (YouTuber opinion + social pressure).
      *   *Verdict:* This will likely make the result *less* reliable regarding actual film quality, even if it feels more "democratic."

  5.  **Address the Mitigation Strategies (Blind Voting, No YouTuber):**
      *   *Blind Voting:* Prevents herding. Crucial for independence.
      *   *No YouTuber:* Removes external bias.
      *   *Impact:* If you enforce these, the volunteers become independent samples. Even if their individual accuracy is only 55-60% (horror fans usually know what's scary/effective), $n=25$ beats $n=7$ mathematically *if* independence is maintained.
      *   *Caveat:* Can you actually enforce this on Discord? Probably not perfectly, but you can structure the channel to help.

  6.  **Develop Recommendations (What would I do?):**
      *   *Goal:* Maximize fairness and perceived legitimacy while actually picking good films.
      *   *Option A: Hybrid Model.* Keep mods as a "jury" for technical merit, add community for "audience choice."
      *   *Option B: Structured Community Vote.* Use Discord threads/polls that hide results until voting closes. Ban discussion until after voting.
      *   *Option C: Stick with Mods but improve.* Calibrate the mods. Use a rubric.
      *   *Best Approach:* A tiered system or a structured community vote with safeguards.

  7.  **Drafting the Response:**
