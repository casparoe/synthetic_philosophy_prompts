  **INTERAGENCY COMMITTEE ON LONG-RANGE FORECASTING (ICLRF)**
  **DECISION MEMORANDUM**

  **TO:** Regional Planning Boards; Institute for Demographic-Ecological Modeling (IDEM)
  **FROM:** Interagency Committee on Long-Range Forecasting
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Adoption of Revised Malthusian Carry-Capacity Index (MCCI-2) for 2050 Planning Cycles

  ### 1. ANALYTICAL & HISTORICAL CAVEATS (COMMITTEE NOTE)
  *Before addressing the recommendation, the Committee must place on record two critical clarifications regarding the framing of this proposal. These are not objections to the work itself, but necessary corrections to the theoretical premises underpinning this debate.*

  *   **On "Malthusian" Labeling:** The term "Malthusian Carry-Capacity" is a contested retroactive construct. Thomas Malthus (1798) argued that population growth *tends* to outpace agricultural growth, leading to wage suppression and misery, but he did not posit a fixed ecological "carry capacity" nor a deterministic collapse index. Using his name implies a historical continuity of theory that does not exist. We are evaluating a **Neo-Malthusian Ecological Model**, not Malthus's original thesis.
  *   **On Falsification:** The debate between "falsified mechanism" and "right but early" relies on a rigid Popperian view of science that does not cleanly apply to socio-ecological forecasting. In policy, a model that fails a specific decadal prediction can still retain utility as a **boundary condition** or **stress test**. Treating this decision as a binary judgment on "truth" risks obscuring the actual question: *Is this model useful for risk management despite its track record?*

  *The following decision is made with these distinctions in mind.*

  ---

  ### 2. RECOMMENDATION
  **The Committee recommends APPROVAL-WITH-CONDITIONS.**

  The MCCI-2 shall not be adopted as a **Baseline Forecast** for resource allocation. Instead, it is approved for use strictly as a **High-Risk Stress Scenario** within regional planning cycles. Adoption is contingent upon the implementation of the "Counter-Factual Innovation" clause and a reduced review timeline (5 years vs. 10 years).

  ### 3. RATIONALE

  The Committee considered two primary arguments regarding the validity of the MCCI framework.

  **A. The "Right but Early" Argument (Proponents)**
  IDEM argues that the 1995–2005 prediction failure was not a structural error but a timing error masked by exogenous buffers (synthetic fertilizer subsidies, desalination tech). They contend that as these buffers hit physical or economic diminishing returns, the underlying exponential demand vs. linear supply dynamic will reassert itself.
  *   *Committee Assessment:* We accept this as a plausible **risk vector**. Physical limits on phosphorus, aquifer depletion, and energy costs for desalination are documented constraints. Dismissing the model entirely because technology delayed the crisis risks complacency. Planning must account for the possibility that the "rescue" of the 1990s was a one-time stock drawdown rather than a sustainable flow increase.

  **B. The "Unfalsifiable Rescue" Argument (Opponents)**
  Critics argue that attributing failure to "temporary subsidies" is an ad hoc rescue hypothesis that renders the model immune to disproof. If every failed prediction is explained away by a new variable (subsidies, then tech, then trade policy), the framework becomes unfalsifiable in practice.
  *   *Committee Assessment:* This is the stronger scientific critique. If we allow the goalposts to move indefinitely, the MCCI loses predictive power and becomes an ideology. **However**, in long-range planning, we require models that identify *vulnerabilities*, not just *certainties*. A model can be "wrong" in its central prediction but "right" about where the system is fragile.

  **Resolution:** The tension between these views is resolved by changing the **status** of the model. By downgrading MCCI-2 from a "Forecast" to a "Stress Scenario," we acknowledge the Opponents' concern (it is not proven truth) while validating the Proponents' concern (it identifies critical failure modes).

  ### 4. CONDITIONS OF ADOPTION

  To prevent the "unfalsifiable rescue" dynamic and ensure the model serves planning rather than ideology, the following conditions apply:

  **Condition 1: Reclassification as Scenario Planning**
  Regional boards may not use MCCI-2 outputs to set baseline budgets or infrastructure caps. MCCI-2 outputs must be labeled **"Constraint Scenario B: Resource Limit."** They must be run alongside a **"Technology & Elasticity Scenario A"** which assumes continued innovation in yield and efficiency. Planning must demonstrate resilience against Scenario B without assuming Scenario A will definitely occur, but without budgeting as if Scenario B is guaranteed.

  **Condition 2: The "Innovation Elasticity" Requirement**
  IDEM must integrate a variable for "Technological Elasticity" into the MCCI-2 code. Currently, the model treats yield efficiency as static or decaying. To address the "Right but Early" critique rigorously, the model must quantify *what level* of innovation would be required to avert the predicted shortfall.
  *   *Deliverable:* Alongside the collapse date, MCCI-2 reports must state: *"To avoid this shortfall, yield efficiency must improve by X% per annum."* This makes the model falsifiable: if efficiency improves by X% and the shortfall still occurs, the model is validated. If efficiency improves by X% and the shortfall vanishes, the model's limit conditions are proven too rigid.

  **Condition 3: Accelerated Review Cycle**
  The proposed 10-year planning cycle is too long for a model with a history of decadal error.
  *   *Timeline:* The MCCI-2 parameters must be reviewed and recalibrated every **5 years**.
  *   *Trigger:* If actual yield/capacity data deviates from the MCCI-2 projection by >15% over a 5-year window, the model enters "Probationary Status" and cannot be used for regulatory justification until recalibrated.

  ### 5. IMPLEMENTATION TIMELINE

  *   **Q1 2024:** IDEM to submit revised MCCI-2 code incorporating Condition 2 (Innovation Elasticity variable).
  *   **Q2 2024:** Regional Boards to run parallel scenarios (Baseline vs. MCCI-2 Constraint).
  *   **Q4 2024:** First Committee Review of MCCI-2 performance against Condition 3 metrics.
  *   **2029:** Full re-authorization review. If MCCI-2 predictions miss by >15% again without successful recalibration, adoption will be **Rejected**.

  ### 6. CONCLUSION

  We are not endorsing the MCCI-2 as a prophecy of collapse. We are endorsing it as a warning system. The "Right but Early" argument is valid only if we treat the model as a measure of *margin of safety*, not a measure of *inevitability*. The "Falsified" argument is valid only if we refuse to let the model operate without strict performance metrics.

  This conditional approval satisfies both: it utilizes the model's capacity to identify physical limits while constraining its capacity to evade disproof.

  **Signed,**

  *Dr. Elena Rostova, Chair*
  *Interagency Committee on Long-Range Forecasting*
