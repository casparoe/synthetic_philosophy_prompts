prompt: |-
  I'm giving a workshop talk next week defending my framing of democratic backsliding as "recursive standing capture" — definatly not the standard liberal-democratic benchmark comparison, but rather tracking whether a regime is systematically narrowing the class of actors (courts, opposition parties, civil groups) who have formal standing to invoke constitutional checks against the executive. I think this sidesteps the partisan-label charge because it's procedural and doesn't presuppose a specific democratic endpoint, but I need to survive the Q&A.

  The audience is about fifteen people: half comparative-politics scholars who've done fieldwork in Hungary, Poland, and Turkey, half constitutional lawyers who think "backsliding" is just a slur Western academics throw around when they dislike election outcomes. They're empiricists, they hate normative handwaving, and they will definatly push me on the US case since I mentioned it breifly in my outline. Can you draft my prep sheet? I want the eight or nine objections they'll actually raise, ordered from most damaging to least, each phrased the way a skeptical comparativist or legal positivist would put it — not the objections I'd get from political theorists. For each one: does it carry real force, what should I concede upfront, what's my two-minute reply, and where exactly is that reply soft? Also include the one question I'm praying nobody asks, which is probably whether my framework can distinguish Hungary from ordinary constitutional development in a place like India, since that'd force me into comparative law I'm not prepared for. I'm not asking for a bibliography or citations; I just need to survive the room without sounding like I'm smuggling in values I claim to avoid.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Academic/Researcher giving a workshop talk next week.
      *   **Topic:** Defending a specific framing of democratic backsliding as "recursive standing capture" (RSC).
      *   **Core Argument:** Backsliding isn't about failing a liberal-democratic benchmark (normative); it's about systematically narrowing the class of actors (courts, opposition, civil groups) with *formal standing* to invoke constitutional checks against the executive (procedural/structural).
      *   **Audience:** 15 people. 50% Comparative Politics scholars (fieldwork in Hungary, Poland, Turkey), 50% Constitutional Lawyers (legal positivists, skeptical of "backsliding" as a pejorative).
      *   **Tone/Style:** Empiricists, hate normative handwaving, skeptical of US-centric bias.
      *   **Deliverable:** A prep sheet with 8-9 objections (ordered by damage), phrased as skeptics would ask. For each: Force assessment, Concession, 2-minute reply, Weakness in reply. Plus the "Prayer Question" (India comparison).
      *   **Constraint:** No bibliography/citations. Focus on surviving the room without sounding normative.

  2.  **Deconstruct the Core Argument ("Recursive Standing Capture"):**
      *   *Strengths:* Procedural, avoids defining "democracy" substantively, focuses on legal mechanics (standing), sounds technical/empirical.
      *   *Weaknesses:* "Standing" is often informal or political, not just formal. Executives can bypass standing requirements. Distinguishing "capture" from "reform" is tricky without normative criteria. US application is controversial (is the US backsliding by this metric?).

  3.  **Brainstorming Objections (Targeting Comp Pol & Legal Positivists):**
      *   *Comp Pol:* "You're ignoring informal power." "This doesn't explain *why* it happens." "Is this just polarization?" "What about Hungary specifically? They passed laws legally."
      *   *Legal Positivists:* "Standing is a technical doctrine, not a political metric." "You're redefining legal terms." "Constitutions change; that's not backsliding, that's amendment." "Who decides what 'recursive' means?"
      *   *US Case:* "If you apply this to the US, does it hold? What about the Senate? The Electoral College?"
      *   *Normative Smuggling:* "Narrowing standing is only bad if you assume more checks are good. That's a value judgment."

  4.  **Selecting and Ordering the Top 8-9 Objections:**
      *   *Most Damaging:* The Normative Smuggling charge (if narrowing standing is the metric, why is narrowing bad?).
      *   *High Damage:* The Formal vs. Informal Power critique (Comp Pol favorite).
      *   *High Damage:* The Constitutional Amendment vs. Capture distinction (Legal Positivist favorite).
      *   *Medium-High:* The US Case (since the user mentioned it).
      *   *Medium:* Measurement/Operationalization (How do you count "standing"?).
      *   *Medium:* The "Efficiency" Counter-argument (Maybe narrow standing makes gov work better).
      *   *Lower:* Historical Precedent (This has always happened).
      *   *Lower:* Terminology (Why "Recursive"?).

      *Refining the Order:*
      1.  Normative Smuggling (The "Is-Ought" Problem).
      2.  Formal vs. Informal (The "De Facto Power" Problem).
      3.  Amendment vs. Capture (The "Legal Validity" Problem).
      4.  The US Case (The "Mirror Test").
      5.  Operationalization (The "Measurement" Problem).
      6.  The "Efficiency" Defense (The "Functionality" Problem).
      7.  Endogeneity (The "Who Captures the Capturers" Problem).
      8.  Terminology/Parsimony (The "Buzzword" Problem).

  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Sharp, academic, slightly adversarial but professional.
      *   *Structure:* Objection -> Force -> Concession -> Reply -> Soft Spot.
      *   *The "Prayer Question":* India vs. Hungary. This is crucial because India is a democracy with a dominant party system that critics call backsliding, but defenders call development. Distinguishing them requires deep comparative law knowledge.

  6.  **Developing the Responses (Focusing on Proceduralism):**
      *   *Key Strategy:* Stick to the *mechanism*. Don't say "democracy is good." Say "systemic reduction of veto points creates a specific structural vulnerability."
      *   *Concessions:* Must admit where the framework is limited. Don't overclaim.
      *   *Soft Spots:* Be honest about where the argument relies on implicit assumptions.

  7.  **Addressing the "India vs. Hungary" Prayer Question:**
