answer: |-
  Here is the conceptual spec sheet you asked for. It treats the authority of the earlier self not as a metaphysical given, but as a functional status that a theory must justify.

  ### The Spec Sheet: Desiderata for Precedent Authority

  Any adequate theory of advance directive (AD) authority must satisfy the following five requirements. I have flagged which are structural necessities (**[NON-NEGOTIABLE]**) and which depend on your ethical framework (**[CAMP PREFERENCE]**).

  #### 1. The Identity Threshold Condition
  *   **The Requirement:** The theory must specify the criteria under which the *numerical identity* of the patient (the same human organism) diverges from their *normative identity* (the moral agent capable of holding values). It must explain why the earlier self has standing to rule over the later self, or at what point that standing dissolves.
  *   **The Motivating Case:** *The Happy Dementia Case.* You wrote a directive refusing life-sustaining treatment in dementia. You now have advanced dementia. You are cheerful, eating with gusto, and show no signs of distress. If we treat you as numerically identical only, the directive binds you. If we treat you as normatively distinct (a "new" person), the directive lapses. A theory cannot simply assert "you are you"; it must explain which "you" matters for medical authority.
  *   **Status:** **[NON-NEGOTIABLE]**. You cannot solve the problem without defining the relationship between the two temporal selves.
  *   **Note on Metaphysics:** Determinism about personal identity is **[CAMP PREFERENCE]**. You do not need a hard metaphysical stance on whether the "soul" persists. You only need a functional threshold for *moral agency*. A theory can remain agnostic on metaphysics but still require a threshold for psychological continuity (e.g., memory, value retention) to grant authority.

  #### 2. The Epistemic Access Protocol
  *   **The Requirement:** The theory must provide a standard for verifying capacity in fluctuating states, specifically distinguishing between *expressed preference* and *authoritative choice* during windows of apparent awareness. It cannot rely on intuition.
  *   **The Motivating Case:** *The Lucidity Window Clause.* Your AD says: "If I regain awareness and ask for food, feed me." You are non-verbal but suddenly say "I want water." The nurse thinks it's a reflex; the daughter thinks it's lucidity. A theory that says "respect lucid wishes" fails if it doesn't define how to *verify* lucidity under uncertainty. It must weigh the risk of false positives (honoring a reflex as a wish) against false negatives (ignoring a real wish).
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, the "Lucidity Clause" is operationally useless.
  *   **Tension:** This often conflicts with *Administrative Feasibility*. A perfect epistemic standard might require neuroimaging or longitudinal observation that isn't clinically available.

  #### 3. The Harm Floor (The Suffering Constraint)
  *   **The Requirement:** The theory must establish whether the earlier self's authority has limits regarding the later self's physical or experiential suffering. Can the past self mandate a death that the present self experiences as a loss of a good life?
  *   **The Motivating Case:** *The Starvation Scenario.* Suppose the AD refuses tube feeding. The patient is demented but feels hunger pangs and distress when food is withheld. If the theory prioritizes *Precedent Autonomy* absolutely, the patient starves despite current distress. If it prioritizes *Current Welfare*, the tube is inserted despite the prior refusal. The theory must state where the "veto power" of current suffering kicks in.
  *   **Status:** **[CAMP PREFERENCE]**.
      *   *Dworkinians* argue there is no harm floor (critical interests trump experiential interests).
      *   *Dresserians* argue there is a hard floor (you cannot sacrifice a happy being for a dead one's values).
  *   **Joint Unsatisfiability Flag:** This is the primary tension point. You likely cannot maximize **Precedent Autonomy** and **Current Welfare Protection** simultaneously in the Happy Dementia case. One must yield.

  #### 4. Trajectory Sensitivity
  *   **The Requirement:** The theory must account for the progressive, staged nature of neurodegeneration. It cannot treat dementia as a binary switch (Competent → Incompetent).
  *   **The Motivating Case:** *The Gradual Fade.* In early stages, you may recognize your family but forget the directive. In middle stages, you are happy but confused. In late stages, you are non-communicative. A theory that applies the AD rigidly from Stage 1 ignores that capacity degrades unevenly. A theory that waits for Stage 3 might miss the "Lucidity Window" in Stage 2. The authority of the AD must be able to scale or shift weight as the disease progresses.
  *   **Status:** **[NON-NEGOTIABLE]**. Any theory assuming a binary state is empirically false and ethically dangerous.

  #### 5. The Value-Consistency Check
  *   **The Requirement:** The theory must distinguish between a change in *circumstance* (which the AD should cover) and a change in *fundamental values* (which might void the AD).
  *   **The Motivating Case:** *The Value Shift.* You wrote the AD because you valued "intellectual independence." Now demented, you value "sensory comfort." Is this a betrayal of your values, or a new set of values? If the theory claims the earlier self has authority because they know your "true values," it must explain why the later self's new values don't count as "true."
  *   **Status:** **[CAMP PREFERENCE]**. This depends on whether you view values as static (Narrative view) or emergent (Presentist view).

  ---

  ### The "Impossible Triangle" (Jointly Unsatisfiable Pairs)

  You suspected that "Honor Earlier Choice" and "Protect Current Welfare" cannot both be maxed out. You are correct. In the Happy Dementia case, these two desiderata form a contradiction.

  1.  **Maximized Precedent Autonomy:** The AD is binding regardless of current happiness.
      *   *Cost:* Violates the **Harm Floor**. You allow a currently content subject to be harmed (die) based on the judgment of a person who no longer exists.
  2.  **Maximized Current Welfare:** The current subject's happiness overrides the AD.
      *   *Cost:* Violates **Identity Threshold**. It treats the earlier self as having no moral standing over the later self, rendering ADs useless as planning tools.
  3.  **The "Third Thing" (Potential Resolution):** *Relational Authority.*
      *   Instead of pitting Past vs. Present, this view asks: *What would the relationship between the Past and Present self dictate?* It treats the AD not as a command, but as a testimony. The authority isn't in the *document*, but in the *continuity of care*.
      *   *Risk:* This is vague. It often collapses into "Best Interest" anyway, losing the specific force of the AD.

  **Verdict:** You must choose which desideratum is *defeasible* (can be overridden). Most modern bioethics leans toward making **Precedent Autonomy defeasible** if the **Harm Floor** is breached (i.e., if the patient is visibly suffering), but binding if the patient is merely "happy but demented" (depending on the severity of the cognitive loss).

  ---

  ### Brief Evaluation of Broad Approaches

  Here is how the three standard models score against the spec sheet, focusing on tension points.

  #### 1. The Narrative-Identity View (Dworkin-style)
  *   **Core Claim:** Your life is a coherent story. The earlier self is the "author"; the demented self is a "character." The author's intent governs the ending.
  *   **Performance:**
      *   *Identity Threshold:* **Strong.** Clearly distinguishes numerical vs. normative identity.
      *   *Happy Dementia:* **Resolves cleanly.** Honors the AD. The current happiness is "experiential" and less weighty than "critical" interests.
      *   *Lucidity Window:* **Weak.** Struggles to explain why a lucid moment doesn't reclaim authorship. If the "character" speaks, does the "author" lose control?
      *   *Tension Point:* Risks violating the **Harm Floor**. It can justify letting a happy person die to satisfy a narrative arc they can no longer comprehend.

  #### 2. The Present-Autonomy-Override View (Dresser-style)
  *   **Core Claim:** Moral authority requires current capacity. If you can't understand the choice now, the AD is just a piece of paper written by a stranger (your past self).
  *   **Performance:**
      *   *Identity Threshold:* **Weak.** Collapses normative identity into current capacity. Risks treating the patient as a series of disconnected time-slices.
      *   *Happy Dementia:* **Resolves cleanly.** Protects the happy patient.
      *   *Lucidity Window:* **Strong.** Naturally prioritizes the current expression if any capacity is detected.
      *   *Tension Point:* Violates **Trajectory Sensitivity**. It renders ADs useless for the exact scenarios they are designed for (loss of capacity). It infantilizes the past self.

  #### 3. The Substituted-Judgment Model (Standard Legal/Medical)
  *   **Core Claim:** Decide as the patient *would have decided* if they were competent now.
  *   **Performance:**
      *   *Identity Threshold:* **Moderate.** Assumes continuity of values.
      *   *Happy Dementia:* **Fails.** This is the model's blind spot. If the patient is happy now, how do we know what they "would have decided"? The model assumes the past self's values apply, but the present reality contradicts the past self's predictions.
      *   *Lucidity Window:* **Moderate.** Uses the window as evidence of "what they would want," but struggles if the window is ambiguous.
      *   *Tension Point:* **Epistemic Access.** It relies on fiction ("what would they decide?") when the reality ("they are happy") contradicts the fiction.

  ### Summary Recommendation for Your Seminar

  If you want to win the argument, don't argue for one model. Argue that the **Spec Sheet itself reveals the contradiction**.

  Point out that the "Lucidity Window" scenario exposes the **Epistemic Access** failure in all three models. The Narrative view ignores the window; the Presentist view overvalues it; the Substituted-Judgment model guesses at it.

  Your "Third Thing" proposal should be a **Sliding Scale of Authority**:
  1.  **High Capacity:** Current wish rules.
  2.  **Fluctuating Capacity (Lucidity Window):** Presumption of validity for the current wish *unless* there is strong evidence of coercion or reflex (shifts burden of proof to the medical team).
  3.  **Low Capacity (Happy Dementia):** AD rules *unless* implementation causes active physical distress (Harm Floor).

  This satisfies **Trajectory Sensitivity** and admits that **Precedent Autonomy** and **Current Welfare** are trade-offs, not absolutes. It treats the AD not as a command, but as a *presumption* that can be rebutted by current suffering, but not by current happiness alone.
