answer: |-
  (1) This project asks whether Plutarch's Greek-Roman pairings intentionally generate a moral interference effect that destabilizes clear ethical exemplarity. Existing scholarship treats the Lives as either straightforward moral models or nationalist propaganda, leaving the productive tension between paired virtues unexplained.

  (2) I hypothesize that juxtaposing lives like Alexander and Caesar creates a critical shadow where virtues in one text expose vices in the other, complicating moral extraction. This differs from conventional interpretations by arguing that ambiguity is a functional pedagogical tool rather than a failure of hagiographic clarity or political bias.

  (3) The method involves close narrative analysis of the Alexander/Caesar and Demosthenes/Cicero pairs to track shifts in Plutarch's evaluative voice across the comparison sections. Criteria for detecting interference include contradictory moral judgments and narrative details that resonate negatively when read synoptically rather than in isolation.

  (4) Confirmation requires demonstrating that specific virtues lose their normative force when viewed through the lens of the paired life, whereas disconfirmation rests on proving the pairs operate as independent moral units. Failure would be defined as finding only consistent moral alignment between pairs or reducing the tension to mere historical inconsistency.

  (5) While a semester allows for deep analysis of two major pairs, this scope limits generalizations about the entire corpus of Parallel Lives. Additionally, distinguishing authorial intent from modern reader-response remains a persistent limitation in asserting this effect as Plutarch's deliberate design.
