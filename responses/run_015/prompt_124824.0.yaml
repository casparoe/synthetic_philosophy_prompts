  4.  **Calibrating the Carrying Case (The Legal Erosion):**
      *   *Must Have:*
          *   Discrete steps (individual cases).
          *   Indiscernibility between adjacent steps (Case $n$ vs. Case $n+1$ looks legally identical regarding the precedent).
          *   Clear endpoints (Case 0 is Binding; Case 100 is Null).
          *   No formal overturning (preserves the "technically intact" aspect).
      *   *Must Lack:*
