answer: |-
  ### Teaching Plan: The Sorites Threat to Institutional Authority

  #### I. Pedagogical Architecture: Dependency Order
  *Objective: Secure the metaphysical distinction between semantic vagueness and ontological gradation prior to introducing the legal case. If this order is violated, students will collapse the paradox into a problem of legislative drafting.*

  1.  **Secure the Status of Institutional Facts:**
      *   Establish that legal authority is not a physical property but a *status function* constituted by collective acceptance and constitutive rules.
      *   **Constraint:** Do not define authority as "power" or "influence." Define it as a binary deontic power (the right to command/obligate).
      *   **Goal:** Create the expectation that authority is ontologically binary (you either have the authority or you do not).

  2.  **Isolate Semantic Indeterminacy:**
      *   Elicit the student assumption that vagueness resides in the *label* (e.g., the word "binding") rather than the *status*.
      *   **Interception:** If a student suggests "we need a better definition," block this by stipulating that the *text* of the precedent is semantically precise. The vagueness must be located in the *application conditions* of the status, not the semantic content of the rule.

  3.  **Introduce Ontological Gradation (The Pivot):**
      *   Before the legal example, pose the question: "Can the *reality* that makes the status true admit of degrees, even if the status itself is binary?"
      *   **Requirement:** Students must concede that the *grounds* for authority (e.g., judicial consensus, reliance interests, factual similarity) are gradable, even if the *authority* is not.
      *   **Goal:** Set the trap. If the grounds are gradable and the status is binary, a boundary must exist. If the boundary cannot be located, the binary status is threatened.

  4.  **Deploy the Sorites Structure:**
      *   Only now introduce the logical form: Premise 1 (Tolerance), Premise 2 (Base Case), Conclusion (Absurdity).
      *   **Constraint:** Present this as a structural constraint on any system relying on gradable grounds for binary status.

  5.  **Apply to Carrying Case:**
      *   Map the logical form onto the judicial erosion scenario.

  #### II. Carrying Case Calibration: *The Erosion of Precedent*
  *Objective: Construct the legal narrative to mirror the logical structure of the Sorites while stripping away the "heap" imagery that invites dismissal as linguistic imprecision.*

  **Properties the Case MUST Have:**
  1.  **Discrete Iteration:** The erosion must occur through distinct, recorded judicial opinions (Case 1, Case 2, ... Case $n$), not a continuous drift. This preserves the logical step-wise nature of the Sorites.
  2.  **Adjacent Indiscernibility:** The distinction made in Case $n$ must be legally negligible compared to Case $n-1$. A reasonable lawyer cannot distinguish the authority level between adjacent steps.
  3.  **Formal Continuity:** The original precedent must never be formally overruled. It must remain "on the books" to preserve the intuition that the authority *should* be binary and intact.
  4.  **Material Nullity:** By Case $n$, the precedent must be universally acknowledged as devoid of practical force, despite its formal validity.

  **Properties the Case MUST Lack:**
  1.  **Ambiguous Drafting:** The original ruling must be described as linguistically precise. This blocks the "fix the language" objection.
  2.  **Intentional Subversion:** Judges in the sequence must not be acting in bad faith. They must be acting within standard doctrinal reasoning. This prevents the reduction of the problem to "judicial activism."
  3.  **Physical Accumulation:** Avoid metaphors of "weight" or "mass." Focus strictly on *scope of applicability*.
  4.  **A Clear Tipping Point:** Do not select a real-world case where a specific decision is famously known as the "death" of the precedent. The example must feel like a thought experiment grounded in doctrine, not history.

  #### III. Misconception Map & Interception Points
  *Objective: Anticipate defensive maneuvers that dissolve the metaphysical threat and intercept them at the specific moment they arise.*

  | Predictable Error | Conceptual Category | Interception Point | Instructor Move |
  | :--- | :--- | :--- | :--- |
  | **"Just define the cutoff."** | Epistemicism / Precification | **Step 2 (Semantic Indeterminacy)** | Stipulate that the legal system *lacks* the mechanism to set the cutoff. The paradox is about the *absence* of a fact of the matter, not our ignorance of it. |
  | **"It's just fuzzy logic."** | Degree Theory | **Post-Example Discussion** | Grant that authority *degrees* exist, but ask: "At what degree does the *obligation* to obey vanish?" Reassert that deontic obligations are binary, so fuzzy grounds create a contradiction, not a solution. |
  | **"The authority died at Case $k$."** | Hidden Boundary | **During Case Narrative** | Ask: "What metaphysical fact distinguishes Case $k$ from Case $k-1$?" If they cannot name a non-arbitrary difference, the boundary is illusory. |
  | **"This is just politics."** | Reductionism | **Step 1 (Institutional Facts)** | Remind them that if authority is purely political power, there is no *normative* obligation to begin with. The paradox only arises because we assume authority is a genuine normative status. |

  #### IV. Diagnostic Question
  *Objective: Distinguish between students who followed the legal story and students who grasped the structural threat to institutional identity.*

  **The Question:**
  > "If we accept that no single judicial distinction destroyed the precedent's authority, but we also accept that the precedent now holds no authority, did the authority cease to exist at a specific point, or does it follow that 'binding authority' is not a property that institutional objects can possess?"

  **Evaluation Criteria:**
  *   **Failure (Narrative Focus):** The student identifies a specific case or argues that the judges made a mistake. (Indicates they view this as a historical/legal problem).
  *   **Failure (Formalist Focus):** The student suggests a fuzzy-logic threshold (e.g., "It fades out"). (Indicates they missed the binary nature of deontic power).
  *   **Success (Structural Focus):** The student recognizes that the *identity conditions* for the institutional fact are unstable. They should articulate that if the grounds are sorites-susceptible, the institutional fact itself lacks determinate existence, threatening the coherence of the legal system's ontology.

  #### V. Explicit Omissions: Formal Machinery to Exclude
  *Objective: Prevent formal tools from obscuring the ontological problem. These topics are to be explicitly marked as "out of scope" for this session.*

  1.  **Supervaluationism:**
      *   **Reason for Exclusion:** It resolves the paradox by appealing to "admissible precisifications," which implies the legal system *could* be precise. This reinforces the student misconception that the problem is merely semantic draftsmanship.
      *   **Instruction:** "We are not asking how to make the system consistent; we are asking if the system *is* consistent given its social ontology."

  2.  **Degree-Theoretic Semantics (Fuzzy Logic) Mechanics:**
      *   **Reason for Exclusion:** Calculating truth values (0 to 1) distracts from the metaphysical question of whether a *normative obligation* can admit of degrees.
      *   **Instruction:** "Do not calculate the degree of truth. Ask whether an obligation can be '0.5 true'."

  3.  **Epistemicism (Williamson-style):**
      *   **Reason for Exclusion:** The claim that there *is* a sharp boundary we simply cannot know encourages students to posit hidden legal facts.
      *   **Instruction:** "Assume there is no hidden fact. The law is exhausted by its public applications."

  4.  **Contextualism:**
      *   **Reason for Exclusion:** Suggesting "binding" changes meaning in different contexts dissolves the structural tension by denying a stable subject of inquiry.
      *   **Instruction:** "We are treating 'binding authority' as a stable kind for the purpose of this analysis."
