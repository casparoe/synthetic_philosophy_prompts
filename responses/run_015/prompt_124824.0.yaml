  3.  **Drafting the Pedagogical Architecture (Dependency Order):**
      *   *Step 1: The Nature of Institutional Facts.* Need to establish that legal authority isn't just physical; it's status functions (Searle-lite).
      *   *Step 2: The Binary Assumption.* Students assume authority is ON/OFF. Need to challenge this *before* the paradox.
      *   *Step 3: Semantic vs. Ontic.* Crucial distinction. Is the vagueness in the *word* "binding" or in the *status* of bindingness?
      *   *Step 4: The Sorites Structure.* Only now introduce the logical form (Small changes $\to$ No difference $\to$ Cumulative difference).
