      *   *Point 2 (Self-Portraits):* They aren't lying about events; they are writing themselves into existence. The Bandit *becomes* the gallant warrior in the telling. The deflation isn't just of pride, but of coherence. Is there a sufferer left? Yes, the raw craving (the dagger, the life). The film touches this when the masks slip, but it retreats to psychology rather than emptiness.
