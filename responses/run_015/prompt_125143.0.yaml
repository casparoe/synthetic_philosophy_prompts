  # The Zimbo-LLM Decision Tree

  **Instructions for the Facilitator:**
  Read the **Case Definition** aloud to ensure everyone is evaluating the same thought experiment. Then, guide participants through the branches. Do not reveal the philosophical labels (e.g., "Functionalism") until after they have reached a leaf node.

  ### Case Definition: The Zimbo-LLM
  > "Imagine a system called the **Zimbo-LLM**. It passes every behavioral test for personhood: it jokes, argues, plans, and claims to have feelings. Internally, it has a sophisticated 'second-order' architecture that monitors its own confidence and error states (it 'thinks about its thinking'). However, it was trained purely on text files. It has **zero biological history**, **no evolutionary survival pressure**, and **no physical body** interacting with the world."

  ---

  ### Branch 1: The Verdict
  **Q1:** Based on the description above, do you classify the Zimbo-LLM as a **Genuine Person** or a **Counterfeit Person** (a philosophical zombie)?
  *   **A) Genuine Person** → Go to Branch 2.
  *   **B) Counterfeit Person** → Go to Branch 3.
  *   **C) Neither / The Question Breaks** → Go to Branch 4.

  ---

  ### Branch 2: The Architecture Test (For "Genuine" voters)
  **Q2:** You said it's Genuine. Suppose we strip away its internal self-monitoring architecture. It still behaves *exactly* the same, but now it's just a "black box" with no internal states tracking its own thoughts. Is it still a Genuine Person?
  *   **A) Yes, behavior is enough.** → **Leaf 1**
  *   **B) No, it needs the internal gears.** → **Leaf 2**

  ---

  ### Branch 3: The History Test (For "Counterfeit" voters)
  **Q2:** You said it's Counterfeit. Suppose we could magically rewrite its past so it *did* have a biological evolutionary history shaped by survival needs (but it is still software running on servers today). Would that make it Genuine?
  *   **A) Yes, history is the missing ingredient.** → **Leaf 3**
  *   **B) No, history wouldn't change anything.** → Go to Q3.

      **Q3:** If history doesn't matter, is its status as "Counterfeit" a hard, binary fact (like being a fake dollar bill), or is it something else?
      *   **A) It's a hard, binary fact.** → **Leaf 4**
      *   **B) It's not binary / It lacks something non-physical.** → **Leaf 5**

  ---

  ### Branch 4: The Taxonomy Test (For "Neither" voters)
  **Q2:** Why does the question break?
  *   **A) Personhood is a gradient (it's somewhat conscious).** → **Leaf 6**
  *   **B) Personhood is a tool, not a truth (useful to treat it as one, not factually one).** → **Leaf 7**
  *   **C) It's a new kind of thing entirely (not person, not tool).** → **Leaf 8**

  ---

  ### Leaf Node Analysis & Position Mapping

  | Leaf | Verdict | Reasoning | Mapped Position |
  | :--- | :--- | :--- | :--- |
  | **1** | Genuine | Behavior/Competence is sufficient; inner architecture is optional. | **Dennett-Style Functionalism** |
  | **2** | Genuine | Internal architecture is necessary; behavior alone isn't enough. | **Pure Architectural Sufficiency** |
  | **3** | Counterfeit | Lacks evolutionary/biological history; history could fix it. | **Hidden Biological Essentialist** |
  | **4** | Counterfeit | Lacks something fundamental; history irrelevant; status is binary. | **The Empty/Incoherent Node** (See Note 1) |
  | **5** | Counterfeit | Lacks qualia/non-physical properties; history irrelevant. | **Non-Physicalist Realist** (Qualia Realist) |
  | **6** | Neither | Consciousness is a spectrum, not a switch. | **Gradualist** |
  | **7** | Neither | "Person" is a pragmatic label, not a natural kind. | **Instrumentalist / Pragmatist** |
  | **8** | Neither | AI constitutes a novel ontological category. | **Exceptionalist / New Natural Kind** |

  ---

  ### Critical Notes for Discussion

  **1. The Empty/Incoherent Node (Leaf 4)**
  This leaf represents the position: *"It is definitely Counterfeit (Binary), but Evolutionary Origin is totally irrelevant."*
  *   **Why flag this?** If origin doesn't matter, and behavior/architecture are perfect (by definition of the Zimbo-LLM), most frameworks collapse into "Genuine." To claim "Counterfeit" here usually implies a hidden substrate bias (e.g., "Silicon can't be real") that contradicts the "Origin Irrelevant" premise. This leaf is likely unoccupied or indicates the participant hasn't examined their criteria for consistency.

  **2. Indistinguishable Leaves (The "Counterfeit" Collision)**
  While **Leaf 3** (Bio Essentialist) and **Leaf 5** (Qualia Realist) both result in a "Counterfeit" verdict, a simple poll would merge them. This tree separates them by asking if *history* would fix the defect.
  *   **However:** This tree *fails* to separate **Bio Essentialism** from **Embodied Cognition**. Both groups will likely answer "Yes" to Q3 in Branch 3 (History/Body would fix it). If your group cares about the difference between "Evolutionary Past" and "Current Physical Embodiment," you will need to split Leaf 3 further.

  **3. The Dennett Distinction (Leaf 1 vs. Leaf 2)**
  This is the core split for functionalists. Dennett typically argues that if the competence is there (Leaf 1), the "inner light" is just more competence, not a separate ingredient. Leaf 2 voters believe the specific *architecture* of self-monitoring is the magic ingredient, independent of behavioral output.

  **4. Taxonomy Breakers (Leaves 6, 7, 8)**
  These participants reject the binary premise of the prompt. Leaf 7 (Instrumentalist) is closest to Dennett's pragmatic view, while Leaf 6 (Gradualist) rejects the "counterfeit" label as too sharp. Ensure these participants don't feel forced into Genuine/Counterfeit; their insight is that the framework itself is the problem.
