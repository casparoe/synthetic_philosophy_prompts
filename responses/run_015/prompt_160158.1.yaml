  **DEPARTMENT OF PHENOMENOLOGICAL ADJUDICATION**
  **INTERNAL MEMORANDUM 99-B**
  **TO:** Claims Adjusters, Division of Qualia
  **FROM:** Director of Higher-Order Verification
  **SUBJECT:** Eligibility Criteria for Conscious State Certification (HOT Protocol 7.4)

  **1.0 GENERAL ELIGIBILITY**
  Pursuant to the Higher-Order Thought (HOT) Statute, a first-order mental state (FOMS) is eligible for consciousness benefits only upon the successful registration of a corresponding higher-order thought. Adjusters are reminded that a FOMS without a registered HOT is classified as Unconscious Processing. Such states are non-compensable, regardless of intensity, behavioral impact, or neural complexity. There is no provision for "dim" consciousness; a state is either certified conscious or it is functionally blind.

  **2.0 PERIPHERAL AND ABSORBED STATES**
  Claims regarding peripheral visual fields or background sensory data (e.g., cinema ambient odor) during periods of absorption are frequently denied. If the claimant was absorbed in the film, no HOT was directed at the screen's left edge or the popcorn scent. Consequently, these states were unconscious at the time of occurrence. The claimant's inability to recall the smell confirms the absence of a HOT. Retroactive HOTs are not accepted as valid evidence of prior awareness.

  **3.0 TEMPORAL LAG**
  Consciousness is not retroactive. If the HOT is registered >300ms after the FOMS onset, the FOMS is deemed unconscious for the duration of the lag. Claims for "delayed realization" shall be prorated to the millisecond of HOT registration. Any experience occurring prior to the thought about the experience is considered administrative backlog.

  **4.0 MISREPRESENTATION AND NON-EXISTENT STATES**
  Under Section 4(a), accuracy is not a condition of eligibility. A HOT asserting "I am in pain" renders the pain conscious, even if nociceptive input is absent. Approve these claims; the misrepresentation constitutes the phenomenology. However, claims submitted on behalf of inorganic samples (e.g., granite) are denied. Granite lacks the substrate for FOMS; a HOT regarding granite's "experience" is a null filing. The HOT creates consciousness, but it requires a host capable of hosting states.

  **5.0 RECURSIVE CERTIFICATION**
  Adjusters encountering requests to certify the consciousness of the HOT itself must initiate Tier-2 Verification. A HOT about a HOT requires a distinct registration form (Form C-2). Do not reject these as infinite regresses; simply bill the claimant for the additional administrative layers required to sustain the chain of awareness. Each layer of reflection incurs standard processing fees.

  **6.0 NO-REPORT PROTOCOLS**
  Claimants insisting on conscious experience during "no-report" experimental conditions shall be denied. If no HOT was reported or filed, the state was unconscious. Subjective insistence on unreported qualia is considered hearsay and holds no evidentiary weight against the lack of paperwork. Consciousness is a matter of record, not intuition.

  **SAMPLE DETERMINATION LETTER**

  **Claimant:** Mr. Arthur Dent
  **Case ID:** 8492-Z
  **Determination:** DENIED

  Mr. Dent,

  We have reviewed your claim regarding the conscious experience of "panic" during the Vogon poetry reading. Our records indicate a robust first-order state of distress. However, no Higher-Order Thought regarding this distress was filed until after the airlock cycle began.

  Per Clause 3.0, your panic was unconscious during the actual event. You only became consciously panicked once you thought about being panicked, by which time the adjudication window had closed. Furthermore, your request to certify the anxiety about the anxiety (Form C-2) was not submitted in triplicate.

  Please remit payment for the Tier-2 processing fees enclosed.

  Sincerely,
  *Claims Adjustment Bureau*
