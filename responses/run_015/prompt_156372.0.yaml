          *   Berkeley's target: Mind-independent matter (unperceived by *any* mind).
          *   Berkeley's solution: Perceived by God (perceived by *some* mind).
          *   User's Step (3): Conflates "unperceived by me" with "unperceived simpliciter."
      *   *The Move from (3) to (4):* This is an epistemic jump. "I cannot conceive X" $\rightarrow$ "X is impossible/incoherent." This relies on a strong conceivability principle.
      *   *Berkeley's Distinction:* Ideas (passive, perceived) vs. Notions (active, minds/spirits). We have *notions* of minds, not *ideas*.

  3.  **Identify the Weak Link:**
