          *   The User's Step (6) assumes Berkeley needs us to conceive of *absolute* non-perception to make sense of God. He doesn't. He needs us to conceive of *relative* non-perception.
          *   *Repair:* Give up the inference from (3) to (5) regarding *God's* perception.
      *   **Diagnosing the Epistemic Jump (Step 3 to 4):**
