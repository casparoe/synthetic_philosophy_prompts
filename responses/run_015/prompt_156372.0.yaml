      *   *Key Insight:* The Master Argument works on *objects of perception* (ideas). It does not work on *perceivers* (spirits). The tree in the quad at 3 AM is an idea in God's mind. We conceive of God (a spirit) via notion. Therefore, we don't need to form an *idea* of an unperceived tree; we form a *notion* of a tree being perceived by another spirit.
      *   *Correction on Step (1):* Step (1) is the hidden trap. "To conceive of a thing is to have an idea of it." Berkeley denies this for *minds*. But the tree is an idea. However, the *state of affairs* (tree + God's mind) involves a mind.
      *   *Better focus:* The equivocation on "unperceived."
