      *   **Science (Prediction Markets vs. Status Quo):**
          *   *Status Quo:* Prestige economy. Reward is status/tenure, not cash. Publishers monetize access.
          *   *Prediction Markets:* Monetize *truth*. Reward is cash based on accuracy.
