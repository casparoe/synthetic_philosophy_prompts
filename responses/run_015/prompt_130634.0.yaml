      *   *Elizabeth Anderson:* "Value in Ethics and Economics." Distinguishes between different spheres of value (market, gift, democratic, etc.).
      *   *Karl Polanyi:* "The Great Transformation." Fictitious commodities (land, labor, money) and the danger of embedding markets too deeply in social fabric.
