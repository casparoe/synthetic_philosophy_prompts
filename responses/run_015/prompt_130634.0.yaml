      *   *Public Choice Theory:* Incentives matter everywhere; why pretend they don't in science?

  3.  **Analyzing the Specific Comparisons:**

      *   **Plasma vs. Kidney:**
          *   *Regenerability:* Plasma grows back; kidney doesn't (mostly).
