prompt: |-
  I'm in a seminar this term on Plutarch and the uses of biography, and for my paper I want to run one real episode through the theory of moral learning from lives that the Parallel Lives assumes. The episode is the Catholic church slowly dismantling its own hagiography. Two stages, roughly: the Jesuit Bollandists at Antwerp from the 17th century on, doing the Acta Sanctorum — reading the saints' lives critically, sorting what could be documented from what was pious invention — and then the 1969 revision of the Roman calendar, which dropped Christopher and a handful of others from universal celebration basically because there was no reliable evidence they'd existed, while leaving local and popular devotion pretty much alone. The Christopher medal bit is what I keep coming back to: people went on wearing them, shrines went on working.

  So, map the theory onto it. By the theory I mean the apparatus in the Alexander proem plus the way the Lives actually run — the claim that he's doing lives not histories; that a trifle (a remark, a joke, how somebody handles a small thing) shows character better than the big public events do; the mirror business in the same passage if I'm remembering that right; the paired structure with the comparison at the end; and the fact that he'll also give you men who are *not* worth imitating, on the assumption you learn by avoidance too.

  What I want is (a) who the agents actually are in the Bollandist/1969 episode and what each of them thinks the moral work of a saint's life consists in; (b) which pieces of Plutarch's apparatus the episode confirms and which it has no slot for — my suspicion is that an exemplar with no story, keep the feast and the name and delete the narrative, is something his account simply can't generate, and that the reformers were leaning on a mechanism he never describes; and (c) whether his own disclaimer, lives not histories, turns out to be a licence for the purge or an argument against it. My instinct is against — i.e. he'd say you don't get to cancel an exemplar for being undocumented, because the character-revealing detail was never doing evidential work to begin with. Argue both sides properly and tell me if I've got it backwards.

  Two things I've been playing with for my own use, tell me if they're junk: call it narrative warrant vs. evidential warrant — a life can carry moral authority either because it happened or because it's well constructed, and Plutarch mostly trades on the second while claiming the first. And related, exemplar decay: how fast an exemplar loses its grip once its historicity is publicly doubted — is that decay total or partial? Does the survival of the medals show it was near zero, and if so, which warrant was doing the work the whole time?

  One epistemic ask, and it matters for the paper: seperate out what's actually settled here from what's genuinely contested among people who know this material. I already know that whether lives-not-histories is a genre remark or a claim about truth isn't agreed, and that the motives behind the 1969 removals aren't either — some people would say it was more about de-cluttering the calendar than about historicity at all. So don't hand me a contested reading dressed up as the consensus, and flag the spots where you're unsure instead of smoothing them over. No need for sources or a reading list, I've got those off the syllabus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** Seminar on Plutarch and the uses of biography.
      *   **Task:** Map Plutarch's theory of moral learning (from *Parallel Lives*, esp. *Alexander* proem) onto a specific historical episode: the Catholic Church's dismantling of hagiography (Bollandists + 1969 Calendar Reform).
      *   **Key Episode:** Bollandists (critical editing of *Acta Sanctorum*) and 1969 Reform (removing St. Christopher from universal calendar due to lack of evidence, while allowing local devotion/medals to continue).
      *   **Key Plutarchan Concepts:** Lives not histories, trifle/details reveal character, mirror/reflection, paired structure/comparison, negative exemplars (learning by avoidance).
      *   **Specific Questions:**
          *   (a) Who are the agents and what is their theory of the moral work of a saint's life?
          *   (b) Which Plutarchan apparatus pieces fit/conflict? (Hypothesis: Plutarch can't generate an exemplar with no story).
          *   (c) Does "lives not histories" license the purge or argue against it? (User's instinct: Against. Task: Argue both sides).
          *   (d) Evaluate user's concepts: "Narrative warrant vs. Evidential warrant" and "Exemplar decay."
          *   (e) Epistemic Constraint: Distinguish settled scholarship from contested readings. Flag uncertainty. No sources/reading list needed.

  2.  **Deconstruct Plutarch's Theory (The "Apparatus"):**

      *   *Alexander/Cimon Proem:* Plutarch states he is writing *Lives*, not *Histories*. Fame doesn't always point to virtue. A small thing (word, jest) often reveals character more than great battles.
      *   *The Mirror:* The reader uses the life to adorn their own life. It's active moral engagement.
      *   *Negative Exemplars:* Bad lives teach by warning (avoidance).
      *   *Truth vs. Utility:* Plutarch isn't a skeptic about truth, but he prioritizes moral utility. However, he generally assumes the figures existed and the core events happened, even if embellished.
      *   *Pairing:* Comparison (*synkrisis*) forces judgment.

  3.  **Analyze the Catholic Episode (Bollandists + 1969):**

      *   *Agents:* Bollandists (Jesuit scholars), Congregation for Divine Worship (1969 reformers), The Faithful (medal wearers).
      *   *Moral Work of Hagiography:*
          *   *Traditional:* Imitation of virtue, intercession, connection to the divine through historical witness (martyrdom).
          *   *Bollandist/Reform:* Truth matters. You can't imitate what didn't happen. But... devotion can remain if it's spiritually fruitful even if historically dubious.
      *   *The 1969 Twist:* Remove from *universal* calendar (liturgical obligation) but allow *local* devotion. Keep the name, drop the narrative certainty.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. It's a strong comparative project.
      *   **Part (a) The Agents and Moral Work:**
          *   *Bollandists:* Truth is a prerequisite for virtue. You can't learn from a lie. Moral work = Imitation of *actual* grace.
          *   *1969 Reformers:* Liturgical integrity. The Church teaches through the calendar. If the story is fake, the liturgy lies. But... pastoral sensitivity (medals).
          *   *The Faithful:* Moral work = Talismanic/Intercessory. Historicity is secondary to efficacy.
          *   *Plutarchan Contrast:* Plutarch assumes the *person* existed. The Catholic case introduces the possibility of *non-existence*.
      *   **Part (b) Mapping the Apparatus (Fit vs. Gap):**
          *   *Fit:* Negative exemplars (don't imitate superstition?), The "Trifle" (the medal itself is the trifle that reveals the faith of the people, not the saint).
          *   *Gap:* The "Non-Existent Exemplar." Plutarch writes about Solon or Caesar. He doesn't write about a mythical figure he *knows* is mythical but keeps anyway. The *Synkrisis* fails if one side is a ghost.
          *   *User's Hypothesis:* Correct. Plutarch needs a *bios* (life). A name without a story breaks the mirror.
      *   **Part (c) "Lives not Histories" - License or Barrier?**
          *   *Argument FOR License (The Purge):* If it's not history, it's moral fiction. If the fiction is debunked, it's useless. Plutarch cares about *truth of character*, not necessarily every battle statistic. If the character never existed, there is no truth of character.
          *   *Argument AGAINST License (The User's Instinct):* "Lives not Histories" means moral truth > chronological accuracy. Plutarch accepts legends if they reveal *ethos*. If St. Christopher reveals the ethos of courage, does it matter if he existed?
          *   *Resolution:* Plutarch would likely side against the purge *if* the moral utility remains, BUT he requires a narrative to mirror. A name alone is nothing.
      *   **Part (d) Evaluating User's Concepts:**
          *   *Narrative vs. Evidential Warrant:* This is strong. Plutarch relies on Narrative Warrant (does this story *feel* true to virtue?) while claiming Evidential Warrant (this happened). The Church shifted to Evidential, then retreated to a hybrid.
          *   *Exemplar Decay:* Fascinating. The medals suggest decay is *not* total. This implies the "warrant" was never purely evidential for the layperson. It was sacramental/narrative.
      *   **Part (e) Epistemic Status (Crucial Step):**
          *   *Plutarch:* "Lives not Histories" is heavily contested. Is it modesty? Genre definition? Epistemological claim? Need to flag this.
          *   *1969 Reform:* Motives are contested. Liturgical simplification vs. Historical rigor.
          *   *Hagiography:* The function of myth in sanctity is debated.

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Plutarch:* Does Plutarch ever write about someone he thinks is mythical? Hercules/Theseus in the beginning? He says he hopes to "cleanse" the myth to make it historical. He wants to make them *fit* for history. He doesn't keep them as pure myths. This supports the User's instinct that Plutarch can't handle the "Name only" scenario.
      *   *Correction on 1969:* The Church didn't say Christopher *didn't* exist. They said there was no *reliable evidence*. That's a subtle but important epistemic difference. Plutarch deals with unreliable evidence all the time by choosing the version that fits the moral aim.
      *   *The "Trifle":* In Plutarch, the trifle reveals the *subject's* character. In the Christopher case, the medal (trifle) reveals the *wearer's* character/faith. This is a reversal of the gaze.

  6.  **Final Polish:**

      *   Ensure the tone is academic but conversational (seminar peer).
      *   Check all constraints: No sources, flag uncertainties, address all sub-questions.
      *   Make sure the distinction between "Lives not Histories" as a genre marker vs. a truth claim is clear.

  7.  **Final Review against constraints:**
      *   (a) Agents/Moral work? Yes.
      *   (b) Apparatus fit/gap? Yes.
      *   (c) License vs Barrier? Yes.
      *   (d) User concepts (Warrant/Decay)? Yes.
      *   (e) Epistemic flags? Yes.
      *   No sources? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to say Plutarch *definitely* thinks X. I need to frame it as "If we read the proem as X, then Y." The prompt asks me to flag contested areas.

      *(Refining the "Lives not Histories" argument)*: The user thinks "Lives not Histories" argues *against* the purge. I need to make sure I give the "For the purge" side a fair shake. If "Lives" are about moral truth, and the story is proven false, can it contain moral truth? Plutarch might say yes (myth can teach), but he explicitly tries to historicize myth in *Theseus/Romulus*. So he wants a foothold in reality.

      *(Refining the "Exemplar Decay")*: The medals surviving suggests the "moral work" wasn't imitation of Christopher's life (since few knew the details), but invocation of his *name*. Plutarch's theory requires *imitation*. This is a key disconnect. Hagiography is often intercessory, Plutarchan biography is mimetic.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated mapping. You are essentially asking whether Plutarch's mimetic theory of biography can survive the transition from *pre-critical hagiography* (where truth and edification are fused) to *critical hagiography* (where they are separated).

  Here is the breakdown of the agents, the apparatus, the "lives not histories" question, and an evaluation of your conceptual tools, with the requested epistemic flagging.

  ### (a) The Agents and the Moral Work of the Life

  To map Plutarch onto this, we first have to define what the Catholic agents think a saint's life *does*, because it differs from Plutarch's mimetic model.

  **1. The Bollandists (17th C.)**
  *   **Theory of Moral Work:** Truth is a prerequisite for virtue. You cannot imitate a fiction. If the *Acta* are forged, the virtue they depict is unmoored from grace.
  *   **Plutarchan Alignment:** High. They align with the idea that the "mirror" must reflect something real to be useful. If the glass is cracked (fabulous invention), the reflection is distorted.
  *   **Divergence:** Plutarch is willing to rehabilitate myth (e.g., *Theseus*) by stripping the impossible to find the moral core. The Bollandists were often more willing to discard the core if the documentation failed.

  **2. The 1969 Reformers (Congregation for Divine Worship)**
  *   **Theory of Moral Work:** Liturgical integrity. The Universal Calendar is a teaching tool of the Church. If the Church universally celebrates a figure whose existence is dubious, the Church risks teaching falsehood. However, they distinguished between *universal liturgical obligation* and *private devotion*.
  *   **Plutarchan Alignment:** Mixed. They accept the "negative exemplar" logic (do not celebrate this universally), but they allow the "name" to survive without the "life."
  *   **Divergence:** Plutarch does not write *Lives* of men he believes did not exist. The Reformers created a category Plutarch lacks: *The Venerated Non-Historical Entity.*

  **3. The Faithful (The Medal Wearers)**
  *   **Theory of Moral Work:** Sacramental/Intercessory, not primarily mimetic. The medal is not a prompt to "act like Christopher"; it is a tool to "invoke Christopher's aid."
  *   **Plutarchan Alignment:** Near Zero. Plutarch's theory is about *mimesis* (imitation of character). The medal users are engaged in *invocation* (access to power). This is the biggest friction point in your paper. Plutarch assumes we read to *become* the subject; the faithful wear the medal to be *protected by* the subject.

  ### (b) Mapping the Apparatus: Fits and Gaps

  **What Fits:**
  *   **The Trifle:** Plutarch says a small remark reveals character better than a battle. In your episode, the *medal* is the trifle. It reveals the character not of Christopher, but of the *Church* and the *faithful*. It shows the Church prioritizing historical rigor in the liturgy while tolerating popular piety in the streets. It shows the faithful prioritizing efficacy over historicity.
  *   **Negative Exemplars:** Plutarch says we learn from bad lives what to avoid. The 1969 reform treats the *uncritical acceptance of legend* as the negative exemplar. The lesson is: "Do not base universal dogma on shaky evidence."

  **The Gap (Your Suspicion is Correct):**
  *   **The Name Without the Story:** Plutarch's apparatus cannot generate an exemplar with no narrative. The *Parallel Lives* requires a *bios* to mirror. In the *Alexander* proem, the "deed" (even a small one) is the window to the soul. If the Bollandists/Reformers say, "Keep the name, drop the story," Plutarch's mirror goes blank.
  *   **The Pairing (*Synkrisis*):** Plutarch ends with a comparison. In the 1969 reform, the comparison is implicit: *Historical Saints* vs. *Legendary Saints*. But Plutarch compares two lives to judge virtue. The Church compared two *states of evidence*. This is a juridical comparison, not a moral one. Plutarch has no slot for judging a life based on its archival footprint rather than its ethical content.

  ### (c) "Lives Not Histories": License for Purge or Argument Against It?

  This is the crux of your paper. You instinctively feel "Lives not Histories" argues *against* the purge. Here is the argument for both sides.

  **Argument A: It Licenses the Purge (The Reformers' View)**
  *   **Reading:** "Lives not Histories" is a claim about *focus*, not *truth*. Plutarch is saying, "I am not recording every battle statistic; I am recording the moral arc." But he still assumes the moral arc belongs to a real person.
  *   **Application:** If the person never existed, there is no moral arc to record. Therefore, the "Life" is a lie. If it is a lie, it cannot teach virtue, because virtue requires a will to have chosen the good. A fictional Christopher cannot choose courage. Therefore, he must be purged from the universal teaching authority of the Church.
  *   **Verdict:** This reads "Lives not Histories" as "Moral Biography, not Chronicling," but insists on *Ontological Reality*.

  **Argument B: It Argues Against the Purge (Your Instinct)**
  *   **Reading:** "Lives not Histories" is an epistemological claim that *moral truth* supersedes *chronological accuracy*. Plutarch admits he often relies on sources he knows are embellished because they capture the *ethos* of the man.
  *   **Application:** If the story of Christopher captures the ethos of "bearing the weight of Christ" (the literal meaning of his name), the historical existence is secondary to the moral truth. Plutarch would argue that if the narrative produces virtue in the reader, the "history" is irrelevant. To purge it is to misunderstand the purpose of biography, which is edification, not archival correctness.
  *   **Verdict:** This reads "Lives not Histories" as "Utility over Fact."

  **Where you might have it backwards:**
  You suggest Plutarch would say, "You don't get to cancel an exemplar for being undocumented." But consider the *Theseus/Romulus* proem. Plutarch explicitly says he wishes to "cleanse" the myth to make it "take on the appearance of history." He wants to *historicize* the myth, not preserve the myth *as* myth. He is uncomfortable with pure fiction.
  *   **Nuance:** Plutarch might agree with the purge *if* the story is deemed purely fabulous with no moral core. But he would disagree with the *survival of the name without the story*. For Plutarch, a name without a narrative is useless for moral learning. The Church kept the name for *devotion*; Plutarch would ask, "Devotion to what? There is no character to mirror."

  ### (d) Evaluating Your Concepts

  **1. Narrative Warrant vs. Evidential Warrant**
  *   **Verdict:** **Keep this.** It is analytically sharp.
  *   **Refinement:** Plutarch claims *Evidential Warrant* (this happened) to secure *Narrative Warrant* (this teaches). He uses the authority of history to bootstrap the authority of ethics.
  *   **Application:** The Bollandists attacked the Evidential Warrant. The 1969 Reformers admitted the Evidential Warrant was broken but tried to retain a shadow of the Narrative Warrant (local devotion allowed). The medal wearers operate entirely on Narrative/Sacramental Warrant and treat Evidential Warrant as irrelevant.
  *   **The Trap:** Be careful not to imply Plutarch *knows* he is trading on Narrative Warrant while claiming Evidential. He likely believes they are fused. Your paper should argue that the Catholic crisis *severs* a fusion Plutarch assumes is inseparable.

  **2. Exemplar Decay**
  *   **Verdict:** **High potential, but needs calibration.**
  *   **Critique:** "Decay" implies a loss of power. The survival of the medals suggests the "power" was never tied to the historicity in the first place for the layperson. So, is it decay, or was it a different mechanism entirely?
  *   **Suggestion:** Call it **Exemplar Decoupling**. The moral/intercessory function decoupled from the historical function. Plutarch's theory predicts *total* decay if the history fails (no mirror). The Catholic episode shows *partial* decay (liturgy changed, devotion remained). This proves the Catholic mechanism of sanctity is not purely Plutarchan mimesis; it is also sacramental.
  *   **Use in Paper:** Use this to show the limit of Plutarch's theory. Plutarch explains how we learn from *men*. He does not explain how we learn from *symbols* (the medal). The 1969 episode reveals that for the faithful, the Saint had become a symbol, not a biographical subject. Plutarch cannot account for the survival of the symbol once the biography is retracted.

  ### (e) Epistemic Status: Settled vs. Contested

  You asked to separate settled ground from contested readings. Here is the map for your footnotes/qualifiers.

  **1. Plutarch's "Lives not Histories"**
  *   **Contested:** Is this a genre distinction (I am writing *bioi*, not *historiai*) or an epistemological claim (I care less about truth)?
  *   **Consensus:** Most scholars agree it is *both*, but the weighting is debated. Some say Plutarch is apologizing for leaving out military details; others say he is admitting he prioritizes moral truth over factual accuracy.
  *   **For your paper:** You must flag that when you argue Plutarch prioritizes moral utility over fact, you are adopting the "moralizing" reading of the proem, which is dominant but not universal.

  **2. The Motives of the 1969 Reform**
  *   **Contested:** Was this truly about historicity (Bollandist influence) or liturgical simplification (reducing the number of feast days to highlight the mysteries of salvation)?
  *   **Consensus:** It was likely a hybrid. The *Coetus* studying the calendar cited lack of historical evidence, but the *goal* was pastoral simplification.
  *   **For your paper:** Do not state as fact that Christopher was removed *solely* because he didn't exist. State that the *official rationale* included lack of historical evidence, but acknowledge the pastoral motive. If you treat it as purely historical, you strengthen the Plutarchan parallel; if you treat it as pastoral, the parallel weakens (Plutarch doesn't simplify for convenience).

  **3. The Function of Hagiography**
  *   **Contested:** Is hagiography primarily mimetic (imitate the saint) or intercessory (ask the saint for help)?
  *   **Consensus:** It is historically both, but the weighting shifts by period. Early hagiography is often martyrological (witness); medieval is often intercessory.
  *   **For your paper:** This is critical. If you treat hagiography as purely mimetic (to fit Plutarch), you are simplifying the Catholic side. You should explicitly note: "While Plutarch assumes mimesis, the Catholic tradition also allows for intercession, which explains the medal's survival." This shows you understand the limit of your own comparison.

  ### Summary Recommendation for the Paper

  Your instinct is largely right: Plutarch's apparatus breaks down when the "Life" is removed but the "Name" remains.
  *   **Thesis Hook:** Plutarch assumes the *bios* is the vessel of virtue. The 1969 Reform created a category of *virtue without bios* (local devotion to a historically dubious saint).
  *   **Key Move:** Use "Narrative vs. Evidential Warrant" to show that Plutarch conflates them, while the Church was forced to separate them.
  *   **Caution:** Ensure you don't paint Plutarch as a modern skeptic. He wants the myth to *be* history. The Church accepted the myth might *not* be history and kept it anyway. That is the divergence.

  This is a very strong framework. If you keep the epistemic flags clear (i.e., "If we read Plutarch as X..."), it will hold up to seminar scrutiny.
