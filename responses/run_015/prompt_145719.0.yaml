prompt: |-
  I'm prepping a podcast Q&A with a historian who thinks Hobsbawm's invention-of-tradition story and Anderson's imagined-communities thesis aren't really rivals—she says Hobsbawm is tracking how states fabricated rituals and lineages in the 1800s, while Anderson is explaining the modular cultural form that let those fabrications feel real, so they operate on different temporal layers and neither denies pre-modern ethnic consciousness, only that it lacked the political form of nationhood. Write me about eight questions that press her hard on this layered reading, especially where people conflate the two. I want at least one on whether she's just special pleading to save modernism, one on what concrete evidence would convince her that some pre-modern group was genuinely national and not just ethnically self-aware, and one on whether her reliance on print-capitalism collapses if we find manuscript-culture anologues. Add a brief follow-up for each that anticipates her likely deflection. Please write it all as continuous prose—no headings, no bullet points, no bold—like you're emailing me. Separate what's settled in the field from what's genuinely contested, and don't present her layered view as if it's the consensus. No bibliographies or reading lists, just reason it through. Maybe there's a typo or two in your reply, that's fine.
