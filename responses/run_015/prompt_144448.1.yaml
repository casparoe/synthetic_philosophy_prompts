  # Seminar Plan: The Planner's Dilemma

  ## 1. Scenario & Materials
  **Scenario:** "The Roommate Dinner."
  Three outcomes for Friday night dinner:
  *   **A (Pasta):** Alex cooks. (Low cost, variable quality).
  *   **B (Tacos):** Both cook together. (High effort, fun).
  *   **C (Pizza):** Blake orders. (High cost, reliable).

  **Structure:**
  *   **Alex** holds the **Pair Rule** on $\{A, B\}$. (Alex decides if Pasta or Tacos happens, if relevant).
  *   **Blake** holds the **Pair Rule** on $\{B, C\}$. (Blake decides if Tacos or Pizza happens, if relevant).
  *   **The Planner** must create a single ranking of $A, B, C$ (Best to Worst) that satisfies:
      1.  **The Unanimity Rule:** If both citizens prefer $X$ over $Y$, the Ranking must put $X$ over $Y$.
      2.  **The Pair Rule:** If a citizen prefers $X$ over $Y$ in their assigned pair, the Ranking must put $X$ over $Y$.
      3.  **Transitivity:** If $A > B$ and $B > C$, then $A > C$.

  **Materials per Table (6 Tables):**
  *   3 Role Cards (Citizen 1, Citizen 2, Planner).
  *   3 Sets of Preference Cards (one set per Round, pre-printed to prevent rewriting).
  *   1 "Social Ranking" Worksheet (to write the final $A>B>C$ order).
  *   15 Poker Chips (Payoff).
  *   Timer (projected or phone).

  **Payoff Scheme:**
  *   If your top choice is ranked #1 in the Social Ranking: **3 chips**.
  *   If your middle choice is ranked #2: **2 chips**.
  *   If your bottom choice is ranked #3: **1 chip**.
  *   *Note: This incentivizes students to want their preferences reflected in the final ranking.*

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Roles** | Divide into 6 tables of 3. Assign roles (Alex, Blake, Planner). Hand out Round 1 materials. |
  | **05-20** | **Round 1: Parochial** | Preferences are private. Planner finds a consistent ranking. Payoffs distributed. |
  | **20-25** | **Rotate & Reset** | Students swap roles (Alex→Blake→Planner→Alex). Hand out Round 2 materials. |
  | **25-40** | **Round 2: The Crash** | Preferences are "nosy." Planner **cannot** satisfy all rules. No payoffs yet. |
  | **40-45** | **Rotate & Reset** | Students swap roles again. Hand out Round 3 materials. |
  | **45-60** | **Round 3: Waiver** | Citizens may waive their Pair Rule *before* revealing cards. Planner succeeds. Payoffs distributed. |
  | **60-75** | **Debrief & Theory** | Connect game to Sen's Liberal Paradox. Discuss the "price" of consistency. |

  ## 3. Rule Sheets & Cards (Exact Text)

  **The Planner's Rule Sheet (All Rounds):**
  > **Your Goal:** Create a Social Ranking (1st, 2nd, 3rd) of Alternatives A, B, and C.
  > **Constraint 1 (Unanimity):** If Citizen 1 AND Citizen 2 both prefer X over Y, you MUST rank X over Y.
  > **Constraint 2 (Pair Rule):**
  > *   Citizen 1 (Alex) is Boss of {A, B}. If Alex prefers A over B, you MUST rank A over B.
  > *   Citizen 2 (Blake) is Boss of {B, C}. If Blake prefers B over C, you MUST rank B over C.
  > **Constraint 3 (Logic):** Your ranking must be transitive (No cycles like A>B>C>A).
  > **Failure:** If you cannot satisfy all constraints, write "IMPOSSIBLE" and stop.

  **Round 1 Cards (Parochial):**
  *   **Alex:** "I prefer A over B. I don't care about C." (Ranking: $A > B > C$ or $A > C > B$).
      *   *Correction for logic:* To ensure success, Alex: $A > B > C$. Blake: $B > C > A$.
      *   Unanimity: None.
      *   Rights: Alex $A>B$, Blake $B>C$.
      *   Result: $A > B > C$. Consistent.
  *   **Blake:** "I prefer B over C. I don't care about A." (Ranking: $B > C > A$).
  *   **Planner:** Follow the Rule Sheet.

  **Round 2 Cards (Nosy - The Crash):**
  *   **Alex:** "I prefer A over B. But honestly, C is best of all." (Ranking: **$C > A > B$**).
      *   *Right:* $A > B$.
      *   *Pareto View:* $C > A$.
  *   **Blake:** "I prefer B over C. But honestly, C is better than A." (Ranking: **$B > C > A$**).
      *   *Right:* $B > C$.
      *   *Pareto View:* $C > A$.
  *   **Planner:** Follow the Rule Sheet. (Expect "IMPOSSIBLE").
      *   *Logic:* Rights say $A > B > C$. Unanimity says $C > A$. Cycle: $A > B > C > A$.

  **Round 3 Cards (Waiver):**
  *   **Same Preferences as Round 2.**
  *   **New Rule:** Before showing cards, Citizens may sign a "Waiver Form" to suspend their Pair Rule for this round.
  *   **Incentive:** If the Planner succeeds, everyone gets chips based on ranking. If Planner fails, **0 chips for everyone**.
  *   **Expected Outcome:** Alex or Blake waives right to break the cycle and secure chips.

  ## 4. Debrief Guide (60-75 Minutes)

  **Step 1: The Mechanism (5 mins)**
  *   Ask Round 2 Planners: "Why did you write IMPOSSIBLE?"
  *   Elicit the cycle: "Alex forced $A>B$. Blake forced $B>C$. So $A>C$. But you both agreed $C>A$."
  *   **Map:** Pair Rule = **Minimal Liberalism**. Unanimity Rule = **Pareto Principle**. IMPOSSIBLE = **Sen's Impossibility Theorem**.

  **Step 2: The Nosiness (5 mins)**
  *   Ask: "Were the citizens cheating in Round 2?" (No, they just had preferences).
  *   Ask: "Why did Round 1 work?" (Preferences didn't overlap/care about the other's pair).
  *   **Point:** The contradiction requires "nosy" preferences (caring about outcomes outside your control).
  *   **Friend's Claim:** Your friend argues this means the theorem is trivial. Ask class: "Is a right only valuable when no one else cares what you do?"

  **Step 3: The Price of Consistency (5 mins)**
  *   Ask Round 3: "Who waived their right? Why?"
  *   Calculate chips: Did the waiving citizen get their top choice? (Likely not; they sacrificed their 'right' to ensure a coherent group decision).
  *   **Point:** Consistency is restored by waiving rights, but someone loses their "say." This is the normative tension.

  ## 5. Troubleshooting & Limitations

  **Predictable Issues:**
  1.  **Rewriting Cards:** Students in Round 2 might change preferences to "help" the Planner.
      *   *Fix:* Collect cards immediately after revelation. Emphasize "These are your true desires; lying hurts your chip count."
  2.  **Majority Voting:** A Planner might suggest "Let's just vote."
      *   *Response:* "You are bound by the Rule Sheet, not democracy. The Unanimity Rule is stronger than voting."
  3.  **Speed Differences:** Some tables finish in 2 minutes; others stall.
      *   *Fix:* "Fast Finishers" must calculate the exact chip loss for each possible waiver on the back of the sheet.
  4.  **"Cheating" Accusations:** Students may call Round 2 preferences "illegal."
      *   *Response:* "The rules restrict your *power*, not your *thoughts*. Having a preference is not a rule violation."

  **Limitations (What the Activity Cannot Do):**
  1.  **Quantification:** The activity shows *one* contradictory profile. It does not prove this happens for *all* unrestricted domains (the formal theorem). You must supply this in words: "Sen proved this isn't a glitch; it's a structural feature of any system with these rules."
  2.  **Definition of Rights:** The game models rights as "decisiveness over a pair." Your friend argued this isn't a real "right."
      *   *Supply in words:* "Real rights are complex. But if even this minimal 'say' conflicts with efficiency, stronger rights will too."
  3.  **Round 4 (Sleeping Right):** **Drop this.**
      *   *Reason:* In this 3-alternative cycle, the conflict is indirect (cyclic), not direct on a single pair. A "Sleeping Right" that wakes only on direct conflict with Unanimity would never activate here, leaving the cycle unresolved or making the rule irrelevant. Round 3 (Waiver) captures the "price of consistency" better without logical confusion.

  ## 6. Confidence Assessment
  *   **High Confidence:** The 3-alternative cycle logic ($A>B, B>C, C>A$) is robust and fits the 75-minute constraint. The payoff scheme effectively motivates the "Waiver" round.
  *   **Guess/Revision:** The "Nosy" narrative (Pizza/Pasta) might feel contrived to some students. If they struggle to see why Alex cares about Pizza, pivot to "Alex hates waste (Pizza boxes)" vs "Blake hates bad cooking (Pasta)." Be ready to adapt the narrative flavor while keeping the $C>A>B$ / $B>C>A$ logic intact.

  \answer{True logically, but makes rights contingent on others' indifference.}
