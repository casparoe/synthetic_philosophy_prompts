answer: |-
  **Mapping the Programmes**

  *   **Continental Drift (Wegener):**
      *   **Hard Core:** Continents move horizontally relative to one another over geological time.
      *   **Protective Belt:** Specific reconstructions (Pangea), paleoclimatic evidence (glacial striations), biological distributions, and crucially, the *mechanism* (tidal drag, pole-fleeing force).
  *   **Fixism (Establishment):**
      *   **Hard Core:** Continents are horizontally fixed; vertical motion (subsidence/uplift) explains geological records.
      *   **Protective Belt:** Land bridges (now submerged), geosynclinal theory, Earth contraction due to cooling.

  **The 1926 Verdict**

  By Lakatos's criteria, the heroic story fails here. A programme is **progressive** if it predicts novel facts confirmed by evidence; it is **degenerating** if it merely accommodates known facts via *ad hoc* adjustments without new empirical content.

  In 1926 (the AAPG symposium), Drift was empirically progressive regarding fits and fossils but theoretically degenerating. The protective belt (mechanism) had been falsified by physicists (Jeffreys); the forces were orders of magnitude too small. Wegener's team was adjusting the belt desperately without a viable engine. Fixism, conversely, was empirically degenerating (postulating invisible land bridges to save the core) but theoretically progressive regarding physics. They protected a core compatible with known mechanics.

  Lakatos requires theoretical consistency alongside empirical novelty. In 1926, resisting Drift was methodologically rational. The Fixists weren't stubborn; they were protecting a programme that hadn't yet exhausted its theoretical heuristic. The verdict does *not* come out the way the heroic story wants. Drift was a degenerating programme awaiting a new protective belt (mantle convection/seafloor spreading) that wouldn't arrive for thirty years.

  **Rational Reconstruction vs. The Novelist's Alibi**

  Lakatos prioritizes rational reconstruction over actual history to demonstrate the logical rationality of theory choice, stripping away psychological noise. You asked if this grants license to tidy. Yes, but it constrains you harder than you expect.

  If your reconstruction shows Fixism was methodologically sound in 1926 (which it was), you are committed to writing the Fixists as reasonable scientists following the negative heuristic, not as obstinate obstacles. Lakatos's framework forbids painting them as villains blind to truth; they were guardians of a coherent research programme against a theoretically bankrupt rival. You can tidy the sequence of arguments, but you cannot tidy away the legitimacy of their resistance. The "alibi" allows you to clarify the logic, but it demands you portray the opposition's rationality faithfully. If the history shows them as cruel, but the reconstruction shows them as rational, Lakatos says write the rationality. The sociology of persecution is irrelevant to the methodology.

  **Where the Framework Breaks Down**

  Lakatos goes silent or strains in three specific areas relevant to your novel.

  1.  **Historical vs. Experimental Science:** Lakatos's "novel fact" criterion leans heavily on physics-style prediction (e.g., Halley's comet). Geology is largely historical; its "predictions" are often about finding evidence in the past record (paleomagnetism). Lakatos is shaky on whether finding a past record counts as "novel prediction" in the same way. If he demands future prediction, geology looks perpetually degenerating.
  2.  **Instrument-Led Change:** Lakatos focuses on auxiliary *hypotheses*. The vindication of Drift came largely from *instruments* (magnetometers, deep-sea drilling) and expeditions, not just theoretical tweaks. The data arrived before the theory could fully absorb it. Lakatos has little to say about technology driving the shift rather than heuristic development.
  3.  **The Time Gap:** Lakatos advises patience ("give a programme time"). But he offers no metric for *how much* time. Thirty years is a career. His framework justifies the wait retrospectively but offers no guidance for the scientists living through the stagnation. It cannot capture the human cost of the "wait and see" methodology.

  *Note: My specific recall of the 1926 AAPG symposium details is standard history of science, but specific geophysical calculations from the 1920s should be checked against primary sources if your characters debate the math.*
