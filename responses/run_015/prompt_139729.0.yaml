      *   *Agents:* Who could have done this? Primarily principal investigators (PIs) in reproductive medicine/genetics. Secondary: Institutional Review Boards (IRBs), University Administrators, National Regulators. In the Curse model, the "agents" are the decision-makers with the *capacity* to act unilaterally. So, it's the PIs/Labs.
      *   *Action:* Implanting CCR5-edited embryos. Option set: Wait (follow consensus) vs. Proceed (break consensus).
      *   *Payoff Asymmetry:*
          *   Private Gain (He): Fame, priority, "first," potential commercial backing (though murky), scientific breakthrough status.
          *   Public Cost: Global moratorium tightening, loss of public trust, regulatory crackdowns, risk to the children, risk to the field's future.
          *   *Crucial Point:* The gain is concentrated; the cost is diffused.
      *   *Formal Result:* As the number of capable labs increases (China, US, UK, Russia, etc.) and as information about feasibility improves (CRISPR gets cheaper/easier), the probability of *someone* crossing the line increases, even if the consensus says "don't."

