      *   *Other Breaks:* The "Catastrophe" definition. The Curse is usually for existential risk (bio-terror, AI). Germline editing is "precautionary principle" territory, not necessarily immediate doom. The epistemic uncertainty was high, but not about *whether* it would work, but *whether it was safe/ethical*.

