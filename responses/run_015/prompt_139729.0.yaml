answer: |-
  ### Part I: The Mapping

  To read the He Jiankui episode as an instance of the **Unilateralist's Curse** (Bostrom, Douglas, & Sandberg), we must treat the decision to implant gene-edited embryos as a threshold event where the action proceeds if *any* single agent decides to proceed, despite a consensus among the class of capable agents that the action should not be taken.

  **1. The Agents**
  In the strict formulation of the curse, agents are entities capable of executing the action independently. Here, the primary agents are **Principal Investigators (PIs)** in reproductive genetics with access to CRISPR-Cas9 technology and IVF clinics. However, because the constraint was regulatory rather than technical, the effective agent set expands to include **Institutional Review Boards (IRBs)** and **National Regulatory Bodies** acting as gatekeepers.
  *   *Mapping:* The "agents" are the PIs, but their capacity to act is modulated by the permissiveness of their jurisdiction. This makes **States** secondary agents in a meta-game: a state can unilaterally lower the barrier for its domestic PIs, effectively enabling the unilateral action. He Jiankui acted where the state-agent (China, specifically Shenzhen local oversight) was permissive or inattentive.

  **2. The Unilateral Action and Option Set**
  *   *Action:* The implantation of CCR5-edited embryos resulting in live birth.
  *   *Option Set:*
      *   $A_0$ (Defer): Adhere to the international consensus (2015/2017 summits) that germline editing is premature/unsafe.
      *   $A_1$ (Proceed): Execute the procedure despite consensus.
  *   *Unilateral Condition:* The global norm against germline editing is non-binding. It functions as a "soft veto." If 100 labs defer and 1 proceeds, the norm is broken, the Rubicon is crossed, and the "catastrophe" (in the eyes of the consensus) occurs. The action requires only one "yes."

  **3. Payoff Asymmetry**
  The curse relies on a divergence between private expected utility and social expected utility.
  *   *Private Gain (He/Lab):* Priority credit ("First CRISPR babies"), scientific fame, potential downstream commercial valuation, grant leverage, and national prestige (locally).
  *   *Public Cost (The Field/Humanity):*
      *   *Diffused:* Erosion of public trust in gene therapy, tightening of regulations globally (increasing costs for legitimate research), potential biological risks to the lineage (off-target effects), and ethical degradation.
      *   *Concentrated:* The gains accrue almost entirely to the defector; the costs are externalized to the entire field of genetics and the children involved.
  *   *Asymmetry:* $U_{private}(A_1) \gg U_{private}(A_0)$, while $U_{social}(A_1) \ll U_{social}(A_0)$.

  **4. The Formal Result and Counterintuitive Prediction**
  The Unilateralist's Curse predicts that if agents act on their own independent estimates of the expected value of $A_1$, the probability that *at least one* agent proceeds increases as:
  *   (a) The number of capable agents ($N$) increases.
  *   (b) The variance in their information/estimates increases.
  *   *Counterintuitive Half:* Improving the technical capability of the field (more labs, cheaper CRISPR) or improving information flow (making the technique easier to replicate) **increases the likelihood of the risky action**, even if every agent agrees the action is net negative. In the He case, the democratization of CRISPR lowered the technical threshold, increasing $N$, thereby statistically guaranteeing that someone with a lower risk threshold (or higher risk tolerance) would eventually pull the trigger.

  ***

  ### Part II: The Honest Part (Where the Frame Distorts)

  The Unilateralist's Curse is a model of epistemic humility among well-intentioned actors. The He Jiankui episode was a case of regulatory arbitrage and ethical breach. The frame strains at four points.

  **(i) The Nature of the Downside (Commons vs. Curse)**
  The Curse is typically modeled for existential or catastrophic risk where the downside is shared by the agents themselves (e.g., a lab accident that kills everyone). Here, the downside was largely external.
  *   *The Distortion:* The cost fell on the **field's license to operate** and, critically, on **children** who were not in the decision set. This is not a pure Unilateralist's Curse; it is a **Tragedy of the Commons** regarding reputational capital, compounded by a **Negative Externality** imposed on non-consenting subjects.
  *   *Does the label earn anything?* Only if we argue that the "catastrophe" is the collapse of the self-regulatory regime itself. If the field loses the ability to self-police, all agents suffer. However, a Commons analysis captures the *depletion* of trust better than the Curse, which implies a binary threshold event. The label adds little unless it highlights the *threshold* nature of the norm violation (one breach breaks the taboo).

  **(ii) The Private Cost Ex Post**
  The Curse assumes the payoff matrix is stable ex ante. He Jiankui was sentenced to three years, fined, and ostracized.
  *   *The Distortion:* The model fails to account for **ex post punishment** as a deterrent variable. In the standard Curse, the unilateralist suffers the same catastrophe as everyone else. Here, the unilateralist suffered a specific *legal* penalty that was not inevitable ex ante.
  *   *The Break:* He likely discounted the probability of enforcement (oversight was "thin"). The Curse model assumes agents miscalculate the *risk of the technology*; He may have correctly calculated the *risk of the technology* but miscalculated the *risk of the state*. This turns the problem from epistemic uncertainty to **enforcement uncertainty**.

  **(iii) The Prescription (Conformity vs. Mechanism)**
  The Cure for the Unilateralist's Curse is a **norm of conformity**: "If you believe the action is valuable but others disagree, defer."
  *   *The Distortion:* The field did not build a norm of conformity; it built **structural constraints** (registries, treaties, criminal bans).
  *   *The Break:* Norms are soft; structures are hard. The Curse literature focuses on individual decision-heuristics. The response to He was institutional. Furthermore, these mechanisms (like the WHO registry) were installed *after* the defection. The Curse is a preventive theory; the response was remedial. The Curse suggests we should have had a norm; reality showed we needed a police force.

  **(iv) Where Else It Breaks: Intent and Epistemic Independence**
  The Unilateralist's Curse assumes agents are **independently estimating** the value of the action and are **trying to do the right thing**.
  *   *The Break:* There is significant evidence that He Jiankui bypassed his own IRB, forged documents, and misled collaborators. This is not independent estimation; this is **deception**. The Curse applies to a group of honest actors failing to coordinate. He acted as a rogue agent hiding from the group. This makes it less a "Curse" and more a **Principal-Agent Problem** (the field vs. the rogue scientist) or simple **fraud**.

  ***

  ### Part III: Evaluation and Extension

  **What the Theory Would Have Prescribed**
  The Unilateralist's Curse prescribes a **principle of conformity**: Any agent considering $A_1$ must treat the disagreement of peers as evidence that their own estimate is an outlier. He should have deferred not because he was unsure of the science, but because the *consensus* was against it.
  *   *Positioning:* No one was positioned to follow this because the consensus was non-binding. Without a central authority to enforce the "deference norm," the rational move for a competitive actor is to defect. The theory prescribes a moral heuristic in a situation that demanded a binding contract.

  **Verdict: Anomaly or Wrong Instrument?**
  The episode is an **anomaly** for the Unilateralist's Curse, bordering on the **wrong instrument**.
  *   *Why:* The Curse explains failures of coordination among *cooperating* agents facing uncertainty. He Jiankui did not coordinate; he deceived. The "risk" was not epistemic (is this safe?) but regulatory (will I get caught?).
  *   *Confirmation:* It only confirms the "counterintuitive half" regarding capability: as the tech became cheaper and $N$ grew, the breach became inevitable. But the mechanism was not independent estimation; it was jurisdictional shopping.

  **Required Extensions to Avoid Relabeling**
  To call this an instance of the Unilateralist's Curse without it being mere relabeling, the theory requires three specific extensions:

  1.  **Jurisdictional Competition:** The standard model assumes a unified agent set. This case requires modeling **States as competing agents**. If State A bans the action but State B allows it, the "unilateralist" is effectively State B (or the PI within it). The "Curse" becomes a **Race to the Bottom** in regulatory standards.
  2.  **Affected Parties Outside the Agent Set:** The standard model assumes the agents bear the cost. This case requires an **Externality Term** for non-agents (the children, future generations). The "Curse" must be modified to account for actions where the defector does not share the downside.
  3.  **Disclosure and Pre-Registration as Correlation Devices:** The Curse relies on independent estimates leading to error. The solution implemented (registries) forces **correlated estimates**. The theory must be extended to show how *forced transparency* reduces the variance in agent estimates, thereby lowering the probability of unilateral defection *before* the fact, rather than relying on a norm of conformity *during* the fact.

  **Conclusion**
  Without these extensions, labeling He Jiankui a "Unilateralist" sanitizes the episode. It frames a regulatory failure and ethical breach as a tragic error in collective decision-making. It is only a Unilateralist's Curse if we assume He Jiankui was an honest actor trying to maximize global utility but failed to defer to consensus. If he was a reputation-maximizer exploiting regulatory gaps, it is a **Prisoner's Dilemma** played on a global board with uneven rules. The "Curse" label is only useful if it forces the field to recognize that *capability alone* creates pressure to defect, requiring structural barriers (registries, bans) rather than just normative appeals.
