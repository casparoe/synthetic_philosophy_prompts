      *   *Conclusion:* Be decisive. Is it a relabeling? Yes, unless extended.

  6.  **Final Polish:** Check against the prompt's specific constraints (e.g., "Give me the mapping first," "Then give me the honest part," "Finish by saying what extension..."). Ensure the distinction between "Commons" and "Curse" is clear.

      *(Self-Correction during drafting)*: I need to be careful not to just say "It's not the Curse." I need to show *how* it maps, then *where* the map tears. The prompt asks to read it *as* an instance, then critique that reading. So I must commit to the mapping first before dismantling it.

