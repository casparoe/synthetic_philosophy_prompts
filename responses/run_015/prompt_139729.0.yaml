      *   *(ii) Private Cost Ex Post:* He went to jail. The Curse model assumes rational actors weighing ex ante payoffs. If the ex post penalty is high, why wasn't it priced in ex ante? Perhaps he discounted the probability of enforcement (China's oversight was "thin"). The Curse model doesn't inherently account for *punishment* of the unilateralist, only the *outcome* of the action.
