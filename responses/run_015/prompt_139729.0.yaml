      *Key nuance on "Ex Post Cost":* The Curse assumes the actor shares the downside. He did *not* share the downside (field reputation), but he did suffer legal punishment. The model needs to separate "Shared Downside of the Action" (bad science/trust) from "Punishment of the Actor" (jail).

