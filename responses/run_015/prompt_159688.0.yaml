answer: |-
  Mara tapped her pen against the memo draft. "We're circling the same drain. Look, the core principle is that punishment responds to the wrongful act. The state's failure to clean the water is a separate wrong. It deserves its own lawsuit, its own compensation scheme. But it doesn't change the fact that these defendants chose to strike, to shoot, to harm. Their desert is calculated on their choices, not the state's budget meetings."

  Julian leaned back, rubbing his temples. "That assumes desert exists in a vacuum. It doesn't. Punishment is a communicative act by the community. If the community—via the state—actively impaired the offender's capacity for restraint, does it retain the standing to condemn? When the authority knew the risk and chose cost over safety, it became complicit. To punish fully now is to say, 'We broke your brakes, but we still blame you for the crash.'"

  "Complicity isn't coercion," Mara countered. "The stipulated facts say they didn't know about the exposure. They weren't forced. The toxin doubled a probability, it didn't determine the act. Half of them might have offended anyway. If we reduce sentences across the board, we are effectively saying the crime matters less because the state is dirty. That diminishes the victim's standing. The victim deserves a response that acknowledges the harm was wrong, regardless of the background noise."

  "But forward-looking, your approach fails," Julian said. "General deterrence relies on potential offenders knowing the consequences. These defendants didn't know they were exposed. You cannot deter someone from avoiding a toxin they don't know exists. So, full punishment buys no safety benefit. Worse, it creates a perverse incentive. If the state knows that prisoners from contaminated districts get full sentences regardless of the state's role, why invest in remediation? Keeping the population impaired might seem cheaper than fixing the water if the prison system absorbs the cost later."

  Mara paused. "The incentive argument is strong. I concede that if sentencing ignores state causation, the state might under-invest in public health to keep enforcement costs low. But how do we fix this without guessing? We can't tell which individual defendant was actually caused to offend by the toxin. It's purely statistical. If we grant a reduction, we are letting off people whose violence had nothing to do with the water. That violates the principle that punishment must fit the individual's guilt."

  "Exactly," Julian said. "But keeping full sentences punishes those who were impaired by the state. Given we can't distinguish them, we have to look at the expressive cost. What does it say about our legal system if we imprison people we helped to impair without acknowledging that link? It undermines legitimacy. A blanket reduction acknowledges the systemic failure without requiring impossible medical proof in every case."

  "So you want a discount?" Mara asked. "What number honors the state's fault without erasing the offender's agency?"

  "Not a discount. A mitigation based on standing," Julian corrected. "But practically, yes. If the risk doubles, and we assume the state's negligence is a contributing cause in the aggregate, a reduction reflects that shared responsibility. Say, twenty percent. It signals that the state accepts part of the burden without absolving the individual of the choice."

  "Twenty percent assumes the toxin caused the crime in every case, which we know is false," Mara said. "But I see the trap. If we do nothing, we incentivize state neglect. If we do too much, we deny individual agency. Maybe the reduction isn't about desert at all. Maybe it's about separating the criminal sanction from the civil wrong."

  "Then where does the reduction live?" Julian asked. "In the sentencing guideline or outside it?"

  "If we put it in the guideline, we admit the crime is less serious. If we put it outside, as a credit against the term based on equitable grounds, we preserve the condemnation of the act while acknowledging the state's role." Mara sighed. "But the commission needs a usable rule. Judges need a number."

  "Then we give them a range," Julian said. "Acknowledging the statistical uncertainty. But we must also state that this isn't the whole remedy. Compensation and remediation must happen outside criminal law. The sentence reduction is just the clean-up cost for the state's standing."

  "Agreed. The sentence addresses the act; the reduction addresses the state's loss of standing to punish fully. And we explicitly state that this does not preclude civil remedies." Mara started typing. "Let's draft the conclusion."

  **Joint Memo Recommendation:**
  The Commission recommends a presumptive twenty percent sentence reduction for offenders from the affected district. This reflects the state's compromised standing to punish due to its contributory negligence, not a diminution of the offender's moral guilt. This adjustment preserves deterrence while removing incentives for state under-investment in public health. Civil remediation remains the proper venue for full compensation.
