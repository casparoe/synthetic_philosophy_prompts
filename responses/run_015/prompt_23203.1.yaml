  **MEMORANDUM FOR THE MILITARY JUSTICE REVIEW BOARD**

  **FROM:** [Your Name/Member]
  **TO:** The Board
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Case No. [REDACTED] (Enemy Combatant Detainee)

  **1. RECOMMENDATION**

  After reviewing the evidence regarding the death of [Our Soldier's Name] and the custodial status of the opposing combatant (hereinafter "the Detainee"), I recommend that the Board **decline to pursue criminal prosecution**. I advise that the Detainee be classified as a lawful enemy combatant entitled to prisoner of war protections and repatriated upon the cessation of hostilities, consistent with the Third Geneva Convention.

  I offer this recommendation not merely on procedural grounds, but because prosecuting the Detainee for acts of lawful combat would undermine the legal architecture that protects our own forces. However, I recognize that half of this Board views the moral status of the Detainee as fundamentally distinct from that of our own fallen soldier. To bridge this divide, this opinion engages seriously with the "Moral Parity of Combatants" thesis. While I conclude that legal immunity must prevail, I believe we must articulate clearly why the moral argument for parity is fragile in this specific instance, and why we reject prosecution despite that fragility.

  **2. THE LEGAL BASELINE: COMBATANT IMMUNITY**

  Under International Humanitarian Law (IHL), lawful combatants are immune from prosecution for acts of violence that comply with the laws of war. This is known as the "privilege of belligerency." Provided the Detainee wore a uniform, carried arms openly, and adhered to the rules of engagement (none of which are in dispute here), his act of killing our soldier was a legal act of war, not a murder.

  To prosecute the Detainee for killing a soldier in a routine firefight is to criminalize the very function of a soldier. If we establish a precedent that enemy soldiers are murderers simply for fighting against us, we invite reciprocal prosecutions of our own personnel. The legal argument for dropping the case is robust. However, the Board's split suggests that the legal argument is insufficient for those who feel a moral outrage that the law does not capture. We must address the moral dimension.

  **3. THE MORAL PARITY OF COMBATANTS**

  The traditional view in Just War Theory, championed by thinkers like Michael Walzer, holds that soldiers on both sides of a conflict possess equal moral status. Once a state of war exists, soldiers are permitted to kill one another regardless of which side is fighting for a "just" cause. This is the "Moral Parity of Combatants." It aligns with our legal framework: a bullet from an aggressor's rifle kills the same way as a bullet from a defender's.

  Half of this Board rightly intuits that this parity feels unsatisfying. It seems to grant a moral equivalence between those defending their homeland and those invading it. This intuition is supported by "Revisionist" Just War Theory (e.g., Jeff McMahan), which argues that moral liability in war tracks the justice of the cause. On this view, soldiers fighting an unjust war have no right to kill, even if they follow the rules. Our soldier was defending; the Detainee was aggressing. Therefore, they are not on a par.

  **4. THE STRONGEST REASON TO SET ASIDE PARITY IN THIS CASE**

  We must confront the strongest argument for setting aside the parity thesis in this specific instance. The argument is not simply that the enemy state initiated an unjust war, but that **the Detainee, despite being a conscript, participated in a manifestly criminal enterprise without exhausting avenues of resistance.**

  The "conscript" status is usually cited to *support* parity (arguing he acted under duress). However, the strongest reason to *reject* parity here is the **Duty to Resist** argument. Even conscripts retain a degree of moral agency. If the war is objectively unjust (e.g., a war of aggressive conquest rather than self-defense), the conscript bears a moral burden to refuse participation, risking punishment or death, rather than becoming an instrument of aggression. By donning the uniform and engaging our forces, the Detainee validated the enemy regime's claim to authority over him. He prioritized his own safety over the rights of the people he was sent to subjugate.

  In this specific case, the asymmetry is sharp: Our conscript was compelled to fight to protect the political community from destruction. The Enemy conscript was compelled to fight to impose political will upon another. While both were coerced, the *direction* of their coercion matters morally. One was a shield; the other was a sword. To treat them as morally identical ignores the fundamental injustice of the aggression they were tasked to execute. This is the strongest philosophical ground for the half of the Board wishing to prosecute: that the Detainee's actions, while legally compliant with IHL, were morally illicit because they served an unjust end that he had a duty to resist.

  **5. WHY PROSECUTION REMAINS THE WRONG COURSE**

  Acknowledging the moral weight of the "Duty to Resist" argument, I still recommend dropping the case. We must distinguish between *moral liability* and *criminal culpability*. There are three reasons why the moral asymmetry described above does not justify a murder trial:

  *   **Epistemic Limitations:** A military tribunal is ill-equipped to adjudicate the *jus ad bellum* (justice of the war) for every individual soldier. To prosecute the Detainee for murder, we would have to prove beyond a reasonable doubt that he *knew* or *should have known* the war was unjust and that he had a viable opportunity to resist. Given the coercive power of his regime, establishing individual criminal intent for mere participation is legally tenuous and prone to error.
  *   **The Coercion Factor:** While the "Duty to Resist" exists in theory, in practice, conscription often involves threats of execution for desertion. The moral blame for the aggression lies primarily with the leadership, not the coerced instrument. To hold the conscript criminally liable for the state's aggression is to punish the symptom rather than the cause.
  *   **Reciprocity and Long-Term Security:** This is the most pragmatic but vital reason. If we assert that soldiers fighting for an "unjust" side are murderers, we invite our adversaries to make the same claim about us. In the fog of war, both sides claim justice. If we erode combatant immunity based on moral assessments of the war's justice, we strip our own conscripts of protection should they be captured. We protect our own by granting immunity to theirs.

  **6. CONCLUSION**

  The intuition that the Detainee and our fallen soldier are not morally on a par is correct in the abstract; the justice of the cause matters. The Detainee's participation in an aggressive war, even as a conscript, carries a moral stain that our soldier's defense does not.

  However, the criminal law is a blunt instrument. It is designed to punish malice and atrocity, not the tragic violence of state-on-state conflict. To convert the moral asymmetry of war into a criminal prosecution of a frontline soldier would violate the Laws of Armed Conflict and endanger our own troops. We honor our fallen soldier not by prosecuting his killer for doing his job, but by ensuring the laws of war remain robust enough to protect those who wear our uniform.

  I move that we decline prosecution and proceed with repatriation protocols.

  Respectfully submitted,

  [Your Name]
  Member, Military Justice Review Board
