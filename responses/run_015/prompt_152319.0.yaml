      *   *Check:* Did I address (6)-(7)? Yes, by limiting the scope of valid cultural explanations (mechanism + specificity).
      *   *Check:* Did I save (1)? Yes, by reframing causation as "switchman" rather than "engine."

  8.  **Final Output Structure:**
      *   Intro: Validate the argument's sophistication.
      *   The Crucial Error: Attacking Premise (3) (Symmetry).
