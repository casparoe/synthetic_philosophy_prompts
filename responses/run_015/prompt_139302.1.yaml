answer: |-
  ### Candidate Scenarios

  1.  **The Startup Co-Founder:** Two friends launch a company. One needs to know the other won't abandon the project during a "valley of death" period where no salary is paid. The disposition is "unwavering grit." The problem is that grit cultivated *to get the partnership* looks like calculation, and the partner knows the agent well enough to spot the difference between passion and performance.
  2.  **The Vulnerable Roommate:** A healthy agent wants to live with a chronically ill friend to split rent in a prime location. The friend needs assurance the agent won't move out when the care burden gets high. The disposition is "solidarity." The friend can tell if the agent is staying out of duty (calculated) vs. care (intrinsic).
  3.  **The Informal Emergency Loan:** An agent needs a large sum from a wealthy friend for a crisis. The friend lends only on a handshake, requiring the agent to be the type who repays even when it causes significant personal hardship and legal enforcement is impossible. The friend knows the agent's psychology well enough to detect if the "honesty" is a strategic pose adopted solely to secure the funds.

  **Selection:** The **Informal Emergency Loan** is the strongest candidate. It most closely mirrors the Hitchhiker's structure (benefit now, cost later, no external enforcement) while grounding the "predictor" in ordinary psychological intimacy rather than sci-fi scanners. It allows for a clear distinction between *having* a trait and *acquiring* it instrumentally.

  ***

  ### The Scenario

  Alex requires $50,000 for an urgent, non-insured medical procedure, and the only available source is their wealthy best friend, Sam, who refuses formal contracts on principle. Sam agrees to lend the money only if convinced that Alex possesses a disposition of "unconditional repayment"—meaning Alex would repay the sum even if doing so later required sacrificing a vital, life-altering opportunity (such as a dream home down payment) and even if Sam had no social leverage to enforce it. Sam knows Alex well enough to distinguish between intrinsic integrity and strategic performance; they share a history long enough that sudden moral conversions are legible as manipulation. Alex recognizes that possessing this disposition would secure the loan and save their health (1), and that actually repaying under high-cost conditions would frustrate Alex's current financial aims and maximize suffering (2). However, Alex cannot simply decide to acquire the disposition now to get the loan, because any attempt to cultivate the trait *for the sake of the loan* signals to Sam that the trait is instrumental; Sam, observing this strategic cultivation, will correctly predict that Alex will discard the disposition when the repayment cost outweighs the benefit of keeping Sam's friendship, and thus will not lend the money (3).

  ### Analysis

  **The Hitchhiker Reasoning and the Stall**
  Parfit's Hitchhiker logic (endorsed by Evidential and Functional Decision Theories) successfully navigates conditions (1) and (2). It argues that rationality is not merely about maximizing utility at the moment of action, but about being the *kind of agent* who gets the best outcomes overall. In this scenario, the "kind of agent" who gets the loan is the one who repays despite the cost. Therefore, rationality似乎 requires Alex to have the disposition (1), even though exercising that disposition at the moment of repayment contradicts Alex's immediate self-interest (2). The reasoning stalls at (3) because the Hitchhiker case relies on a predictor (the driver) who reads *outputs* (what you will do), whereas Sam reads *inputs* (why you will do it). In the desert island case, the driver cannot see your deliberation process, only the result of your character. In this ordinary-life scenario, Sam's intimacy with Alex makes the *provenance* of the disposition visible. If Alex decides, "I will become honest to get this money," the decision itself reveals that Alex is still a maximizer wearing honesty as a costume. A maximizer will drop the costume when the price gets high. Sam sees the costume being put on and refuses the deal. The rational move (acquire the disposition) is causally inaccessible because the *attempt* to make that move undermines the very condition required for its success.

  **The Single Feature**
  The feature doing the work is **Motivational Transparency**. In the original Hitchhiker case, the agent's internal reasoning is opaque to the predictor; the predictor only sees the behavioral disposition. In this scenario, the selector (Sam) has access to the agent's motivational history and current deliberative stance. The trust is not in the *behavior* (repayment), but in the *motive* (integrity vs. calculation). Because the agent's attempt to acquire the motive is itself a calculation, the transparency reveals the motive as impure, collapsing the trust.

  **Varying the Feature**
  If we vary this feature to a **Selector who sees only behaviour** (opacity), the case reverts to standard Hitchhiker dynamics: Alex can successfully "fake" the disposition or use a pre-commitment device, because Sam cannot see that the loyalty is instrumental. The loan is secured, and the dilemma returns to the moment of repayment.
  If we vary it to a **Selector who sees motives but not their source** (partial transparency), the case becomes unstable. If Sam can see Alex *wants* to be honest but cannot tell if that want is intrinsic or cultivated, Alex might succeed through self-deception (trying to convince oneself the disposition is intrinsic). However, if the selector is as astute as described in the scenario, they usually infer source from motive structure; a motive that appears only when a benefit is on the table is legible as instrumental.

  **The Friend's Strongest Reply**
  Your friend's strongest reply is that you are conflating *synchronic* rationality (choosing now) with *diachronic* rationality (managing yourself over time). She would argue: "You are right that Alex cannot acquire the disposition *now* for *this* reason. But rationality does not demand magic; it demands preparation. A truly rational agent anticipates that they will face such dilemmas and cultivates intrinsic integrity *before* the crisis arises, perhaps when the stakes are low. The fact that Alex cannot buy honesty *now* doesn't prove rationality doesn't require the disposition; it proves Alex was irrational *in the past* for failing to cultivate it when it was cheap. The requirement of rationality is to manage your own formation so that you are the type of person who gets the good outcomes, even if you cannot switch types on demand."

  **The Moral of Formation**
  If (3) holds, the real moral is indeed that rationality governs the management of your own formation rather than just your acts. This aligns with the Aristotelian view of virtue ethics integrated into decision theory: rational agency is a project of self-constitution. You cannot always choose the optimal act in the moment if your character is fixed, but you are responsible for the character that chooses the act. The "paradox" dissolves when we view the agent not as a momentary chooser but as a temporally extended project. The tragedy of the scenario is not that rationality is impossible, but that the agent has arrived at the moment of choice without having done the prior work of becoming the person for whom the rational choice is easy. Rationality, therefore, is less about solving the equation in front of you and more about ensuring you are the kind of person for whom the equation solves itself.
