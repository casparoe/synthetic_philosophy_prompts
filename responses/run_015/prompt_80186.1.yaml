  7.  **Final Polish:** Check against all constraints in the prompt. (Map positions? Yes. Work through exchange? Yes. Misreadings? Yes. Overlooked nuances? Yes. Bottom line? Yes.)

  *(Self-Correction during drafting)*: I need to make sure I don't simply say "Maya is right about Peirce" and "Jonah is right about James." I need to evaluate the *arguments* they make *for* those positions. For instance, Maya's claim that James is circular is a strong philosophical objection, even if Jonah accurately describes James. Jonah's claim that Peirce is unusable is a strong pragmatic objection, even if Maya accurately describes Peirce.

