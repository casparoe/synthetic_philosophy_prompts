answer: |-
  # SPECIFICATION: POST-LABOR MEANING THEORY (PLMT)

  **Objective:** Define the necessary conditions for any theoretical framework claiming to explain the semantic and sociological function of "work" in a high-automation environment where human labor is reduced to passive oversight or non-automatable relational care.

  ---

  ## 1. THE AGENCY-OUTPUT DECOUPLING REQUIREMENT
  **Status:** **NON-NEGOTIABLE**
  **The Case:**
  In heavy automation scenarios, "employment" often persists as a liability buffer or regulatory compliance measure. The human worker is present but functions as a system monitor (e.g., watching a dashboard, approving algorithmic flags).
  *   **The Problem:** Traditional labor theory ties meaning to *transformation* (I changed the world through effort). Oversight labor involves zero transformation; the algorithm does the work, the human witnesses it.
  *   **The Requirement:** The theory must explain how meaning is generated when *agency* is severed from *output*. It cannot rely on "productivity" as a metric of value. It must account for the phenomenological hollowness of "paycheck without purpose" without defaulting to "retrain them."

  ## 2. THE RELATIONAL MOAT CONDITION
  **Status:** **NON-NEGOTIABLE**
  **The Case:**
  Care work (elder care, child rearing, therapy) resists automation not because robots lack the dexterity, but because they lack *vulnerability*. The value of the service is derived from the fact that the provider *chooses* to be there despite having the capacity to leave.
  *   **The Problem:** Efficiency-based theories cannot value care work, because care is inherently inefficient. If a robot does it better/cheaper, the economic argument says it *should* be automated. But humans reject automated care as "cold."
  *   **The Requirement:** The theory must ground value in *mutual recognition* rather than *service delivery*. It must explain why the "friction" of human limitation is the actual product. If the theory values optimization, it fails this condition.

  ## 3. THE STATUS/INCOME BIFURCATION
  **Status:** **NON-NEGOTIABLE**
  **The Case:**
  Universal Basic Income (or similar mechanisms) solves the income problem but exacerbates the recognition crisis. In current society, income is a proxy for social utility. If income is guaranteed, the signaling mechanism breaks.
  *   **The Problem:** You can solve poverty without solving shame. A population that is fed but socially invisible creates a crisis of legitimacy.
  *   **The Requirement:** The theory must provide a mechanism for social stratification or recognition that is independent of economic contribution. It must explain how one earns "honor" or "standing" when one cannot earn "wages" through labor.

  ## 4. THE TELEOLOGICAL SHIFT CLAUSE
  **Status:** **CAMP-SPECIFIC**
  **The Case:**
  If work is no longer the primary activity of life, what is the *telos* (end goal) of the society?
  *   **Camp A (Humanist/Artistic):** The goal is self-actualization, art, and leisure. Work becomes a hobby.
  *   **Camp B (Accelerationist/Cybernetic):** The goal is system optimization. Humans are retained only where they are biologically cheaper than silicon. Meaning is irrelevant; function is all.
  *   **Camp C (Traditionalist/Reactionary):** The goal is to artificially preserve scarcity to maintain the "virtue" of labor, even if economically irrational.
  *   **The Requirement:** The theory must explicitly declare its end-state. It cannot claim to be "neutral" about what humans should do with their time.

  ## 5. THE DIGNITY DECOUPLING PRINCIPLE
  **Status:** **NON-NEGOTIABLE**
  **The Case:**
  This is the structural failure point of 20th-century labor narratives. If dignity is tied to "earning a living," and living can be secured without earning, dignity becomes obsolete.
  *   **The Problem:** Most political rhetoric attempts to preserve the link between labor and dignity (e.g., "jobs programs" even when unnecessary). This creates "bullshit jobs" that degrade dignity rather than uphold it.
  *   **The Requirement:** The theory must articulate a source of human worth that is *ontological* (based on existence) rather than *functional* (based on utility).

  ---

  ## THE KILLER DESIDERATUM

  **Requirement #5 (The Dignity Decoupling Principle)** is the single constraint that kills the usual "work is central to human dignity" narratives.

  **Why it kills the narrative:**
  The traditional narrative relies on the **Protestant Work Ethic axiom**: *Suffering/Effort + Economic Utility = Moral Worth.*

  In a post-automation world:
  1.  **Effort is minimized** (algorithms do the heavy lifting).
  2.  **Utility is ambiguous** (oversight is passive).
  3.  **Economic necessity is removable** (via automation surplus).

  If a theory cannot satisfy **Requirement #5**, it forces a choice between two unacceptable outcomes:
  *   **Outcome A:** Admit that the majority of humans have no moral worth because they do not work (social collapse).
  *   **Outcome B:** Invent meaningless labor to simulate effort (the "Bullshit Job" trap), which humans intuitively recognize as a lie, leading to cynicism and loss of dignity anyway.

  Therefore, any theory that insists "work must remain central to dignity" fails the spec. The only viable theory must assert that **dignity is a precondition of citizenship, not a dividend of labor.** If the theory cannot make that switch, it is incompatible with the post-automation reality.
