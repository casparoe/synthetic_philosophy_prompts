answer: |-
  **Brainstorming Notes**

  Right, let's tease this apart before I settle on a position. The core of your 'Reliance-without-Promising' (RwP) view is that the moral glue isn't consent or fairness, but *harm through disappointed expectation*. It's a consequentialist-adjacent deontology: I owe you not because I promised, but because you've built your house on the assumption I wouldn't throw a brick, and I know it.

  First, the **temporariness**. Does the four-month horizon matter? On a contract view, yes—I'm not a signatory to the social contract. On a fairness view, maybe—I'm not staying to reap the long-term benefits of the system I'm exploiting. But on RwP? The reliance is usually immediate. The waiter relies on *this* tip for *this* month's rent. The queuer relies on *this* spot for *this* coffee. My departure date doesn't undo the setback I cause today. So, intuitively, the locum status is morally inert. It might affect my *knowledge* of the norms (epistemic excuse), but not the *existence* of the norm itself.

  Second, the **foreigner excuse**. This is the tricky bit. You mention locals don't treat place-saving as cheating, but do they expect *you* to save places? Often, there's a second-order norm: "We do X, but we don't expect the outsider to know X." If they truly *expect* me to defect, have they built reliance into their planning? If the waiter thinks, "Tourist, won't tip," and budgets accordingly, my non-tipping causes no setback. But do they? Or do they hope I'll tip and merely *forgive* me if I don't? There's a gap between *lowered expectation* and *no expectation*. If they plan on the tip and merely withhold blame, the obligation stands. If they plan without the tip, it vanishes. I suspect it's the former: the excuse is about blame, not reliance.

  Third, the **classification of Tipping**. You've labelled it 'Additive' (pool benefit, single defection negligible). But your description says wages are *set* on the assumption, and a non-tipper leaves a *particular* worker short. That sounds Positional. If it were truly additive (like public radio funding), my £5 wouldn't matter. If it's wage-reliance, my £5 is the difference between their bus fare and walking. If RwP holds, I need to treat this as Positional, despite the label. This changes the weight of the obligation significantly.

  Fourth, **Queuing**. If the local convention is 'saving spots', and I insist on strict First-In-First-Out (FIFO) because that's the rule back home, *I* am the defector. I am disrupting the local reliance network. The person behind the spot-saver expects the saver to be served. If I intervene, I harm the saver. RwP might actually obligate me to participate in what looks like 'queue-jumping' to an outsider. That's a robust, counter-intuitive result.

  Fifth, **Jaywalking**. Dead-letter rules are coordination problems. The law says 'wait'; the practice says 'cross if clear'. Drivers rely on pedestrians crossing predictably. If I stand still at a red light with no traffic, I might confuse a driver who expects me to bolt. Or, I might block a local who expects me to move. The obligation isn't to the law, nor blindly to the crowd, but to *predictability*. If the local practice is the stable equilibrium, adhering to the dead letter is the moral defection.

  Okay, I think I see the shape of it. The heuristic "Follow the local convention" is too crude. It needs to be "Sustain the reliance." Let's commit.

  ***

  **Implications for the Locum Philosopher**

  Here are the five implications of the Reliance-without-Promising (RwP) framework that matter most for your situation. They move beyond the obvious "be polite" advice and target the structural moral ontology of your stay.

  **1. The Moral Irrelevance of Exit**
  On many theories (fairness, social contract), your temporary status mitigates your obligation. You aren't a full citizen; you're a guest. Under RwP, this is irrelevant. The obligation is generated by the *local's* planning, not your membership status. The waiter's budget is set for this month; the commuter's schedule is set for this morning. The harm of non-compliance is immediate and localised.
  *   **Implication:** You cannot argue that "I'm leaving soon, so I don't need to integrate." The four-month horizon grants no moral holiday. If anything, it increases your epistemic duty: knowing you are temporary, you must be *more* scrupulous in learning the reliance-structures, as you lack the long-term social capital to absorb the friction of mistakes.

  **2. The Excuse/Expectation Gap**
  You asked whether the locals' habit of excusing foreigners cancels the obligation. RwP forces a sharp distinction here between *blameworthiness* and *obligation*.
  *   **Implication:** The "foreigner excuse" likely cancels *blame* (they won't think less of you), but it does not cancel the *obligation* (you still cause the harm). If the waiter hopes for a tip and budgets tentatively on it, your non-tip leaves them short, even if they shrug it off as "tourist behaviour."
  *   **The Trap:** Do not mistake their graciousness for a lack of reliance. Unless you have positive evidence that they *exclude* you from their planning (e.g., they automatically add a service charge for foreigners because they assume you won't tip voluntarily), you must assume the reliance exists. The excuse is a social lubricant for when you fail, not a permission slip to do so.

  **3. "Follow the Convention" is the Wrong Heuristic**
  The standard advice is "When in Rome..." But RwP suggests the instruction is actually: "Sustain the expectations that prevent harm." These sometimes come apart.
  *   **Implication:** In the **Queuing** case, if the local convention is saving places, and you insist on strict FIFO because you view saving as 'unfair', *you* are the moral defector. You are setting back the person who saved the spot and the server who expects to serve them. Here, "follow the convention" works.
  *   **However:** In the **Jaywalking** case, the "convention" is ambiguous. Is it the law or the practice? RwP says look at the *drivers' expectations*. If drivers expect pedestrians to cross on red when clear, standing still is dangerous (unpredictable). If drivers expect pedestrians to wait, crossing is dangerous. You must identify the *coordination norm*, not just the visible behaviour. Sometimes, the visible behaviour is chaotic, but the expectation is order. "Do as locals do" might lead you to jaywalk blindly; "Sustain reliance" leads you to cross predictably.

  **4. The Reclassification of Tipping**
  You classified tipping as 'Additive' (pool benefit). But your description ("wages... set on the assumption") betrays a Positional structure. In a true additive convention (like voting), one defection doesn't matter. In a wage-reliance model, one defection *does* matter to the specific worker.
  *   **Implication:** RwP treats this as a Positional obligation, not an Additive one. You are not contributing to a vague 'culture of tipping'; you are fulfilling a specific reliance held by a specific individual for a specific transaction. This makes the obligation stricter. You cannot say, "Others will tip enough." Under RwP, the waiter relies on *you*, here and now. The additive label is a dangerous fiction that obscures the direct harm of defection.

  **5. The Dead-Letter Duty of Predictability**
  Regarding **Jaywalking**: When a rule becomes a dead letter, the moral weight shifts from 'obedience' to 'coordination'.
  *   **Implication:** If the law is universally ignored, the law no longer holds the reliance; the practice does. However, there is a nuance. If locals jaywalk *carefully*, they rely on other pedestrians to also be *careful*. If you follow the law and step out suddenly when the light changes because you've been waiting, you might be more dangerous than the jaywalker who maintains eye contact with traffic.
  *   **Verdict:** Your obligation is to match the *risk profile* of the locals, not necessarily the act. If locals jaywalk with high vigilance, you must do the same. If you follow the law but with low vigilance (trusting the cars to stop because it's green), you might violate RwP more than the careful jaywalker. The obligation is to be a predictable agent within the actual flow of traffic, not the theoretical one.

  **Summary**
  The RwP framework strips away the comfort of being a "visitor." It suggests you are morally embedded the moment you enter the system of reliance. The locals' forgiveness is a gift, not a waiver. Your temporary status is irrelevant to the harm you cause. And "following the convention" is only right insofar as that convention is the actual vessel of their expectations. In your city, this likely means: tip as if you live there (because the worker does), save spots in queues (because the queuer relies on it), and jaywalk with the local rhythm (because the driver relies on predictability, not the Highway Code).
