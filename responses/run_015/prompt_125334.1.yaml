prompt: |-
  Hi — please act as a professional philosopher working on social ontology and the morality of everyday conventions, think this through carefully, and do a bit of unstructured brainstorming before you commit to anything. British English throughout, please.

  The situation: I'm four months into a locum job in a city that runs differently from home. (1) Tipping: wages in restaurants are set on the assumption that customers top up the bill, so a non-tipper doesnt just fail to be generous, they leave a particular worker short. (2) Queues: they exist, but people save places and friends join friends, and locals don't treat that as cheating — still, someone does get served out of turn. (3) Jaywalking: formally illegal, universally done, never enforced.

  The theory I want you to grant rather than argue for — call it reliance-without-promising: a local convention imposes a genuine moral obligation on you (not merely a prudential reason or a rule of etiquette) just when other participants have built expectations of compliance into their own planning in a way your non-compliance would set back, even though none of them knows you or anticipated your arrival. Pair it with a distinction I lean on: additive conventions, where each act of compliance adds a small benefit to a pool and any single defection barely registers (tipping); positional conventions, where one defection determinately takes something from an identifiable person (queueing); and dead-letter rules, where the official norm and the actual practice have come apart (jaywalking).

  What are the most important implications of that package for how someone in my position should act — and, more interestingly, for whether "follow the local convention" is even the right shape of an answer? I care most about the implications that arent visible straight off the set-up: whether the mere fact that I fly home in four months does any work at all on this view, whether the locals' second-order habit of excusing foreigners cancels an obligation or quietly creates one, and where the view gives a different verdict from the usual one about each of the three cases. Keep it to the implications that actually matter.
