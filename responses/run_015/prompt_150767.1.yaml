  3. what only survives if you fudge it, including both of my wrinkles
  4. what has no expression in my vocabulary at all
  5. whether that residue is a blind spot in how we talk about training data, or a sign that the result in the herding literature is doing less work than it looks like

  Don't cite anything — I can't check it anyway — just argue it out. Ta.
