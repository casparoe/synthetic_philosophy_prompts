answer: |-
  1. Imagine a sequential distillation chain where each student minimizes KL against the previous teacher's logits while also seeing a small batch of fresh, noisy ground-truth data. The cascade result means that after a few generations, the loss curve flatlines because the model stops trusting its private gradient signal and simply overfits the drifting teacher distribution, locking in early errors as permanent bias.

  2. The private noisy signal maps cleanly to your fresh ground-truth batch, and the public action is the teacher's generated softmax distribution. Rational herding is just loss minimization; if the KL penalty from matching the teacher outweighs the cross-entropy gain from the fresh data, ignoring the fresh data becomes the optimal update step.

  3. The hope that temperature prevents collapse only survives if you fudge the calibration assumption, since miscalibrated confidence still inherits drift and merely delays the cascade. The curator's dilemma similarly reinforces the loop unless you fudge the independence of the filter, as the quality classifier's boundary shrinks around the synthetic mode rather than correcting it.

  4. The economic model assumes a fixed true state of the world, whereas your training distribution is non-stationary and actively shaped by the agents themselves. There's no direct equivalent for common knowledge or the specific intent behind an action, since your models optimize loss without understanding why earlier weights converged.

  5. This residue is a blind spot in how we talk about training data because we treat distribution drift as a bug rather than a rational convergence on shared error. We assume fresh data always corrects the model, ignoring that within the pipeline, the synthetic history becomes the dominant truth signal.
