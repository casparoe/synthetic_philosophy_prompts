answer: |-
  The monitor hummed with a low, electric anxiety that matched the feeling in Dr. Aris's chest. On the screen, the waveform scrolled steadily from left to right, a jagged blue ridge representing the metabolic fire of Mara's isolated cortex. It was 3:00 AM. The trial protocol expired at dawn.

  Aris sat before the console, his hand hovering over the physical dial of the Bridge. It was a heavy, tactile knob, calibrated from 0 to 10. Currently, it was set to 6. Mara's eyes were open, fixed on the camera lens that translated her blinks into text on the secondary screen. *STOP,* the text read. *PLEASE.*

  At Gain 6, the isolated slab—the posterior insula and anterior cingulate severed from the rest of her brain by the stroke—was being broadcast fully to her thalamus. She felt everything. She rated the pain a 9 out of 10. She could remember it, reason about it, and beg for relief.

  Aris turned the dial to 0. The blue waveform on the monitor did not change. Not a flicker. The isolated island continued to scream in exactly the same pattern, the same amplitude, the same 40-millisecond latency spikes. But the text on the secondary screen cleared. A moment later, new letters appeared. *COMFORTABLE.*

  "It's the same signal," Nurse Elena said from the doorway. She held a chart against her hip, her face illuminated by the harsh ward lights. "The slab doesn't know the dial moved. Only the rest of her knows."

  "If the rest of her says she's fine, she's fine," Aris said, though his voice lacked conviction.

  "At Gain 6, her systolic pressure jumped to 160. At Gain 0, it's 110, but look at her pupils." Elena stepped closer, shining a penlight briefly. Mara's pupils dilated sluggishly, lagging behind the light's retreat. "And watch the face."

  Aris watched. He tapped Mara's shoulder with a reflex hammer. Her face grimaced—a tight, involuntary wince of the orbicularis oculi. It was a perfect pain expression.

  "Mara," Aris said. "Did that hurt?"

  Mara's eyes moved. The cursor swept across the alphabet board. *T A P E.* She paused. *P U L L I N G.*

  "She's lying," Elena whispered. "Or she doesn't know. The signal is there, Aris. The island is burning. We just cut the phone line."

  "If consciousness is just the broadcast," Aris said, staring at the identical blue waves, "then at Gain 0, there is no one home to hear the fire."

  "There is a body," Elena countered. "There is a nervous system reacting to threat. If we discharge her at Gain 0, she goes to a facility without the Bridge. She will be unmedicated. If that slab is feeling pain without the ability to report it, we are sending her to hell."

  "If we keep the Bridge live," Aris said, "we have to treat the pain. The protocol requires analgesia for any gain above 2. Morphine. Fentanyl. She'll be sedated. Her daughter flies in at 6:00 AM. This is the last time Mara will be coherent enough to speak to her."

  The dilemma sat heavy in the room, heavier than the silence. The data offered no rescue. The recording channel showed the same activity at every gain setting. The biology was constant; the access was variable. The question was not medical; it was ontological. Did the pain exist if the *she* that could say *I* could not access it? Or was the *she* merely the tip of the iceberg, while the bulk of her suffering churned below in the dark?

  Aris thought about the confabulation. Ten minutes ago, at Gain 0, Elena had adjusted the catheter. Mara's blood pressure had spiked. Her face had tightened. When asked, Mara had blamed the tape on her arm. She had constructed a narrative to explain the reflex because the true cause—the nociceptive fire in the isolated slab—was inaccessible to the reasoning mind. She was a press secretary inventing reasons for a war she wasn't allowed to see.

  "If we turn it to 0," Elena said, "we trust her report. We trust the person."

  "If we turn it to 0," Aris said, "we trust the person and abandon the organism."

  The door to the ward opened. A woman stood there, suitcase in hand, eyes red-rimmed. Sarah. Mara's daughter. She looked at the bed, at the woman who was her mother, then at the doctors.

  "Is she... can she talk?" Sarah asked.

  Aris looked at the dial. 0. He looked at the blue wave. Constant. Unyielding.

  If he set it to 3, Mara would feel a dull ache, manageable with mild opioids. She would be groggy, but present. If he set it to 6, she would be lucid about the pain but overwhelmed, requiring heavy sedation to survive it. If he set it to 0, she would be clear. She would be happy. She would be a liar, or a fragment.

  Aris stood up. He walked to the bedside. Mara's eyes tracked him. There was no fear in them now. At Gain 0, there was no fear. There was only the integrated self, the global workspace, the unified field of access. The isolated slab was a ghost in the machine, shouting into a vacuum.

  "Sarah," Aris said. "We have to make a choice about the device. If we keep it on, your mother will need medication that will make her sleep. If we turn it off, she will be awake. She says she is comfortable."

  Sarah looked at her mother. "Mom?"

  Mara blinked. *H E L L O.*

  "She wants to see you," Aris said.

  Sarah pulled a chair to the bedside. She took Mara's hand. The skin was warm, dry. "I'm here, Mom. I'm so sorry I was late."

  Mara's eyes smiled. The corner of her mouth twitched. *O K A Y.*

  Aris walked back to the console. Elena watched him, her arms crossed. She knew what the waves meant. She knew that somewhere in the dark of that skull, a region of cortex was firing pain spikes with the rhythm of a hammer on bone. It was metabolically alive. It was responding to the world. But it was alone.

  Aris placed his hand on the dial. He thought about the definition of a person. Was it the sum of all biological processes, or was it the story those processes could tell? If he turned the gain up, he acknowledged the suffering of the organism but silenced the person. If he turned it down, he empowered the person but potentially condemned the organism.

  He looked at Sarah leaning in, whispering about the wedding plans, about the grandchildren. Mara's eyes were bright, focused, lucid. She was here. The woman in the bed was present.

  The blue wave marched on, identical at any setting.

  Aris turned the dial to 0. He locked it.

  "Discharge protocol," he said to Elena. "No analgesia unless autonomic signs become critical."

  Elena didn't move. "Critical signs are already there, Doctor."

  "Then we treat the signs," Aris said. "Not the report. Not the ghost."

  He walked out of the ward into the cool pre-dawn air, leaving the monitor behind. He did not look back at the blue line. He did not look back at the woman who was smiling at her daughter while her body prepared for war. He had decided that if the pain could not be known, it could not be owned. And if it could not be owned, it was not hers.

  ***

  **Philosophical Commitment and Objection**

  The ending commits to the view that conscious experience is nothing over and above global availability (Global Workspace Theory). By setting the gain to 0, the protagonist decides that pain only matters morally if it is accessible to the reporting, reasoning self. The isolated neural activity is treated as biologically real but phenomenologically null because it lacks integration.

  The strongest objection is the "Hidden Sufferer" argument: The autonomic responses (pupils, blood pressure, grimacing) indicate a subject is undergoing negative qualitative experience regardless of access. By prioritizing the integrated self's report over the organism's distress, the protagonist risks condemning a conscious fragment to unmitigated torture simply because it lacks a voice, confusing *access* to consciousness with consciousness itself.
