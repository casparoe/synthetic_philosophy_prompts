      *   *Wait, looking at the constraint:* "The disagreement your characters are living inside is the one between treating conscious experience as nothing over and above global availability... and treating what it is like for a subject as something that can in principle come apart."
      *   If I choose Gain 0, I commit to Global Availability.
      *   If I choose Gain >0, I commit to Phenomenal Consciousness existing independently.
