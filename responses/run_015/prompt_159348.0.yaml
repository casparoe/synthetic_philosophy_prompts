      *   *Concrete Detail 1:* The dial setting (0 vs 6).
      *   *Concrete Detail 2:* The specific eye-code or physiological metric. Let's use the pupil dilation metric or the specific spike pattern. Let's use the spike pattern: "40-Hz gamma burst." No, let's use the timing. "14 milliseconds latency." Or the gain dial itself. Let's use the gain dial and the pupil measurement.
      *   *Confabulation example:* At Gain 0, catheter move -> grimace -> she says "tape pulling."

  3.  **Drafting - Scene Setting:**
