      *   **Tone:** Literary, philosophical weight carried by situation/decision.

  2.  **Work Out the Dilemma:**
      *   *Side A (Global Workspace/Functionalist):* If she says she's fine at Gain 0, she *is* fine. Pain requires access to reporting systems. The autonomic signs are just reflexes, like a knee jerk. Setting Gain 0 respects her agency and allows her final lucid moment with her daughter.
      *   *Side B (Phenomenal Consciousness/Realist about Qualia):* The isolated slab *feels* pain regardless of broadcast. The autonomic signs are the truth; the report at Gain 0 is a lie caused by disconnection. Setting Gain 0 condemns her to hidden torture. Setting Gain >0 protects her body but steals her mind (sedation).
      *   *The Conflict:* Trust the report (Gain 0) or trust the body/slab activity (Gain >0)?
      *   *My Choice for the Story:* I need to pick one for the protagonist to decide. Let's have the protagonist (likely the lead neurologist or ethicist) choose Gain 0. Why? Because it prioritizes the *person* (the integrated self) over the *fragment* (the isolated slab). It treats consciousness as essentially relational/global. However, I must make the cost palpable. Or, I choose Gain >0 (keep bridge + opioids). This prioritizes the prevention of suffering over agency/lucidity.
      *   *Decision:* I will have the protagonist choose Gain 0. It feels more tragic and highlights the "Global Workspace" view without endorsing it as absolute truth. It forces the reader to wonder if they just condemned her to hell. Actually, let's reverse that. Choosing Gain 0 is the "easy" functionalist route. Choosing Gain >0 (treating the pain despite her denial) is the harder, more paternalistic route that acknowledges the possibility of hidden suffering.
      *   *Revised Decision:* Let's have the protagonist choose Gain 0. Why? Because the alternative (sedation) destroys the connection with the daughter. The story should hinge on the definition of *her*. Is *she* the whole system or the fragment? If the fragment isn't broadcast, is it *her* pain?
