      *   **Conceptual Framework 1: Conditional Necessity.** The truth is "If told, then Damascus."
      *   **Conceptual Framework 2: Fixed Points in Decision Theory.** (Newcomb-like logic). The prediction is accurate *because* it accounts for the agent's reaction to the prediction.
      *   **Conceptual Framework 3: Epistemic Horizon.** The prophecy changes the agent's state space.
      *   **Synthesis:** The "Truth" of the prophecy is systemic, not temporal.
