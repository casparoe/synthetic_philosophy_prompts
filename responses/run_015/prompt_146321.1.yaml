answer: |-
  The divergence between Germany's statutory nuclear phase-out and France's regulator-led life-extension regime represents more than a policy disagreement; it encodes distinct metaphysical and ethical frameworks regarding the governance of high-consequence technologies. Below is a reconstruction of the philosophical commitments, the implicit theory of the calendar-certain exit, and the institutional prerequisites for shifting governance models.

  ### 1. Philosophical Commitments

  **The Nature of Technological Risk**
  *   **Germany (Political Risk):** Risk is not merely a technical variable to be minimized but a societal condition to be terminated. The German framework presupposes that **residual risk** (Restrisiko) is politically illegitimate, regardless of its probabilistic magnitude. It treats the complexity of socio-technical systems as inherently prone to "normal accidents" that probabilistic risk analysis (PRA) cannot fully capture.
  *   **France (Engineered Risk):** Risk is a manageable quantity. The French model presupposes that technological systems are epistemically transparent enough that safety can be maintained indefinitely through engineering interventions and updated modeling. Risk is dynamic, not intrinsic to the technology's age.

  **Intergenerational Obligation**
  *   **Germany (Liability Limitation):** Obligation is framed as **burden minimization**. By fixing a shutdown date, the state limits the duration of high-level waste production. It prioritizes sparing future generations the *ongoing* risk of operation and the accumulation of *new* waste over the benefit of low-carbon baseload power.
  *   **France (Climate Stewardship):** Obligation is framed as **asset preservation**. The primary debt to the future is a habitable climate. Extending the life of low-carbon assets is a moral imperative to reduce carbon emissions now, accepting the waste burden as a manageable legacy compared to climate catastrophe.

  **Epistemic Authority**
  *   **Germany (Legislative Sovereignty):** Ultimate authority resides in the **Legislature**. Safety assessments are necessary conditions for operation but not sufficient for continuation. The political will (representing societal values) overrides technical optimization.
  *   **France (Technocratic Autonomy):** Authority resides in the **Independent Regulator** (ASN). If the technical safety case is met, the political principal generally cannot arbitrarily shut down a plant. The regulator acts as the guardian of the "safety boundary," within which operations continue.

  ### 2. Reconstructing the Implicit Theory of the Calendar-Certain Exit

  The German "calendar-certain exit" (statutory shutdown dates irrespective of safety status) embeds a hybrid theory of risk and morality.

  **Irreversible Risk Accumulation vs. Deontological Constraint**
  The practice does not strictly rely on the physics of material fatigue alone (which could theoretically be managed, as France argues). Instead, it encodes a **deontological constraint against the imposition of open-ended risk.**
  *   **Theory:** It treats catastrophic risk as accumulating *normatively* rather than just physically. Even if the *probability* of failure remains low (per PRA), the *moral cost* of maintaining the option for catastrophe becomes unacceptable over time.
  *   **Waste Burden:** It presupposes that the obligation to future generations includes a duty to cease the *generation* of new long-lived hazards. Continuing operation is viewed as actively compounding the intergenerational debt, regardless of the emission benefits.

  **Is this a Strict Requirement?**
  *   **Strict Requirement:** No. A statutory exit does not *logically necessitate* a deontological view. A rigid **Rule-Utilitarian** could argue that the social costs of uncertainty, security, and political polarization surrounding nuclear power outweigh the marginal climate benefits, justifying a fixed rule to maximize overall welfare.
  *   **Compatibility:** However, the specific clause *prohibiting license renewal regardless of updated safety assessments* is incompatible with **Act-Consequentialism** or **Technocratic Consequentialism**. If the sole metric were outcomes (e.g., CO2 saved vs. risk incurred), new safety data should theoretically alter the decision. By statutorily blinding the decision to new safety data, the law presupposes that the *permission to operate* has expired as a matter of right, not just calculation.

  **Precautionary Frameworks**
  The German model fits the **Strong Precautionary Principle** (burden of proof lies on the proponent to show no harm, with ambiguity resolving to prohibition). The French model fits a **Risk-Risk Tradeoff Framework** (weighing nuclear risk against climate risk).

  ### 3. Presupposition vs. Fit

  It is crucial to distinguish what the legal design *presupposes* (logical necessities) from what it *fits well with* (political contingencies).

  | Feature | **Presupposes (Logical Necessity)** | **Fits Well With (Political Contingency)** |
  | :--- | :--- | :--- |
  | **Statutory Dates** | That political legitimacy overrides technical optimization. | Anti-centralization ideologies; Renewable lobbying. |
  | **No Renewal** | That safety is a necessary but insufficient condition for operation. | Green Party coalition agreements; Post-Fukushima public sentiment. |
  | **Waste Focus** | That stopping *new* waste is prioritized over mitigating *existing* waste via energy transition. | Narratives of "responsibility" (Verantwortung) in German political culture. |
  | **Epistemic Stance** | That probabilistic models are insufficient to guarantee long-term safety. | Skepticism of expert elites; Democratic sovereignty over technology. |

  ### 4. Institutional Decision Rights: Shifting to the French Model

  If a polity (e.g., Germany) wished to adopt the French-style probabilistic model of risk governance **without altering its energy mix** (i.e., assuming the physical reactors remained available for potential operation), the following shifts in institutional decision rights would be strictly required:

  1.  **Transfer of Lifespan Authority:**
      *   *Current (German):* The **Legislature (Bundestag)** holds the right to determine operational lifespan via the Atomic Energy Act (*Atomgesetz*).
      *   *Required (French):* Authority must shift to the **Independent Technical Regulator** (e.g., BMUV/BfE empowered like ASN). The law must change from "Shut down by Date X" to "Operate contingent on Safety Case Y."

  2.  **Decoupling Safety from Policy:**
      *   *Current:* Safety inspections are subordinate to the phase-out timeline.
      *   *Required:* Safety inspections must become the *determinant* of the timeline. The Legislature would retain the right to set broad energy policy (e.g., "We want nuclear"), but would lose the right to mandate shutdowns absent a technical safety violation.

  3.  **Epistemic Standardization:**
      *   *Current:* Safety standards allow for political "ethics commissions" to override technical findings.
      *   *Required:* The legal standard for continued operation must be explicitly tied to **Probabilistic Risk Assessment (PRA)** metrics (e.g., core damage frequency) rather than political consensus. The regulator must have the legal mandate to grant 10-year visas based solely on these metrics.

  **Summary:** The divergence is not merely about electricity; it is a conflict between a **political-ethical veto** on residual risk (Germany) and a **technocratic-management** of risk trade-offs (France). Adopting the French model requires stripping the Legislature of the power to set expiration dates and vesting the Regulator with the authority to define the economic life of the plant through technical certification.
