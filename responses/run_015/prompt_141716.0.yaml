  I know that I am cold.
  The dark lies heavy as the night.
  I know I know I'm cold.

  The blankets make a careful fold.
  The shadows press the curtains tight.
  I know that I am cold.

  I try to keep what I can hold.
  I cannot judge the weight of light.
  I know I know I'm cold.

  The air is thick with unseen gold.
  There is no change within my plight.
  I know that I am cold.

  The story of the chill is told.
  It feels the same as any night.
  I know I know I'm cold.

  Nothing is left but being old.
  It blocks the morning from my sight.
  I know that I am cold.
  I know I know I'm cold.

  ***

  The third tercet marks the turning point where the second-order claim loses its warrant while the first-order claim remains intact. The signal is planted in the first line of that stanza ("I try to keep what I can hold"), which shifts from the passive security of the "fold" in the second stanza to an active, effortful retention, indicating that the margin for error required for knowing *that* one knows has been exhausted even though the sensation of cold persists.
