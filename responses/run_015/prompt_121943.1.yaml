answer: |-
  The stalemate you describe is one of the most persistent in contemporary analytic philosophy. To diagnose it precisely, we must look beyond the surface-level argument about whether meaning facts exist and examine the underlying architecture of the disagreement. Your hypothesis touches on the core of the matter, but the situation is slightly more intricate than a simple directional clash.

  Here is a diagnosis of the disagreement, an evaluation of the commitments at play, and an assessment of your proposed framing.

  ### 1. The Nature of the Disagreement: Methodological Masquerading as Substantive

  Is the dispute verbal, substantive, or methodological? It is best characterized as a **methodological conflict masquerading as a substantive metaphysical dispute.**

  If it were merely verbal, the parties could agree on the phenomena and simply adopt different terminology. They cannot. If it were purely substantive, there would be a shared standard of evidence that one side failed to meet. There is not. Instead, the two camps are operating with incompatible standards of what counts as a successful explanation.

  *   **The Skeptical/Communitarian Camp** operates with a **strict normative constraint.** They argue that for a state to count as *meaning* something, it must justify future use. They hold that no descriptive fact (about brains, dispositions, or history) can logically entail a normative conclusion (about what one *ought* to do). Therefore, they conclude that meaning facts, in the robust realist sense, do not exist. They shift the explanatory target from truth-conditions to assertibility-conditions.
  *   **The Realist/Reductionist Camp** operates with a **naturalistic constraint.** They argue that meaning must be compatible with a scientific worldview. They hold that if we cannot identify a meaning fact within the natural order (causal, dispositional, or biological), then meaning is epiphenomenal or illusory. They reject the skeptic's demand for a logical entailment between fact and norm as impossibly stringent, arguing instead for a metaphysical grounding that is sufficient for naturalistic purposes.

  The stalemate arises because the Realist accuses the Skeptic of demanding a "super-rigid" metaphysical rail that nothing could satisfy, while the Skeptic accuses the Realist of changing the subject by reducing normativity to mere regularity. They are talking past each other because they disagree on the *price* of admission for a theory of meaning.

  ### 2. The Two Notions of Normativity

  Your intuition that the word "normative" is doing double duty is correct and constitutes the most promising avenue for dissolution. We can distinguish the two notions as follows:

  1.  **Constitutive Normativity (The Constraining Force):** This is the internal logic of the rule. If I mean *addition*, the rule itself dictates that 68 + 57 equals 125. This normativity is content-specific. It answers the question: "What does this rule require?"
  2.  **Regulative Normativity (The Authorizing Power):** This is the external sanction of the community. It answers the question: "Who decides if I followed the rule?" This involves correction, approval, and the possibility of being judged wrong by another.

  **The Conflation:**
  *   **The Realists** attempt to ground *Constitutive Normativity* in natural facts (dispositions, causal history). They argue that if my brain is wired to output 125, that physical fact constitutes the meaning. They often treat *Regulative Normativity* as a secondary, sociological phenomenon that arises once meaning is already established.
  *   **The Skeptics** argue that *Constitutive Normativity* is impossible without *Regulative Normativity*. An individual cannot distinguish between thinking they are following a rule and actually following a rule without an external check. Therefore, the community's authority (Regulative) is not just a way to police meaning but is constitutive of the very possibility of correctness.

  The Realist denies that Regulative Normativity is foundational; the Skeptic denies that Constitutive Normativity can stand alone. Because both use the term "normativity" to cover both the *content* of the obligation and the *source* of the authority, they appear to be arguing about whether meaning is normative at all, when they are actually arguing about the *source* of that normativity.

  ### 3. Commitments and Hidden Intuitions

  To understand why this stalemate persists, we must identify the non-negotiable commitments each side holds.

  **The Realist Commitments:**
  *   **Methodological Individualism:** The mind is the primary locus of meaning. Social practices are aggregates of individual intentional states.
  *   **Naturalism:** Semantic properties must supervene on physical properties without remainder.
  *   **Intuition:** The autonomy of the speaker. I can mean something by my words even if I am the last human on earth.

  **The Skeptical Commitments:**
  *   **Anti-Individualism:** Intentional states are not self-interpreting. They require a context of use to have determinacy.
  *   **Non-Reductionism:** Normative facts (oughts) cannot be reduced to descriptive facts (is) without loss of meaning.
  *   **Intuition:** The fallibility of the subject. I cannot be the sole authority on whether I am correct, or the distinction between correct and incorrect collapses.

  **The Hidden Intuition:**
  There is no hidden empirical question or formal result that can resolve this. Neuroscience cannot tell us whether a neural firing *is* a meaning or merely *correlates* with one, because that is a categorial, not empirical, question.

  The real barrier is a clash of intuitions regarding **naturalness**. The Realist feels it is unnatural to posit irreducible social norms that float free of physical causation. The Skeptic feels it is unnatural to think a physical state could inherently possess "aboutness" or "correctness" without a interpretive framework. Neither side can argue for their intuition without begging the question, because the intuition *is* the starting point of their metaphysical framework.

  ### 4. What Counts as Progress?

  Given this diagnosis, a standard argumentative victory is unlikely. Progress would require one of the following:

  1.  **A Conceptual Distinction:** Explicitly separating Constitutive from Regulative normativity, as you suggested. If philosophers agreed that Realists are explaining the *causal basis* of competence while Skeptics are explaining the *authority* of correctness, they might recognize they are answering different questions.
  2.  **A Shift in Explanatory Target:** Moving away from "What is the fact of the matter?" toward "What role does the concept of meaning play in our lives?" This is the pragmatist turn. It dissolves the demand for a metaphysical ground by treating meaning as a tool rather than a mirror of reality.
  3.  **Dissolving the Framing Question:** Arguing that the demand for a "fact of the matter" about meaning is a category mistake. If meaning is a status assigned within a practice, asking for the fact *outside* that practice is ill-posed.

  The most genuine progress would come from **option 3**, supported by **option 1**. We must recognize that the search for a "meaning fact" that exists prior to or independent of normative practices is a philosophical illusion. However, we must also acknowledge that individuals possess real cognitive capacities (dispositions) that make participation in those practices possible.

  ### 5. Evaluating the Bottom-Up vs. Top-Down Framing

  Your framing of the deadlock as **Bottom-Up (individual dispositions)** versus **Top-Down (social constitution)** is highly illuminating, but it risks introducing a false dichotomy if taken too literally.

  **Why it Illuminates:**
  It correctly identifies the direction of ontological dependence. The Realist believes the social is built from the individual (Bottom-Up). The Skeptic believes the individual's competence is derived from the social (Top-Down). This maps perfectly onto the debate between Methodological Individualism and Holism. It clarifies that the dispute is not just about meaning, but about the fundamental structure of social reality.

  **Where it Risks a False Dichotomy:**
  It implies a temporal or ontological priority that may not exist. In a mature language user, individual competence and social practice are co-constituted. The individual is socialized into the practice (Top-Down), but the practice is sustained and evolved by individual applications (Bottom-Up). To insist that one must be *fundamental* is to accept the very metaphysical picture that a pragmatist or quietist would reject.

  Furthermore, this framing might obscure the **Skeptical Solution's** radicalism. The Skeptic is not merely saying the Top-Down approach is better; they are saying the Bottom-Up approach fails to yield *normativity* at all. It's not that the Top-Down explanation is stronger; it's that the Bottom-Up explanation is of a different category (causal vs. normative).

  ### Conclusion

  The stalemate is a methodological impasse driven by a conflation of two distinct normative concepts. The Realist seeks to naturalize the *constraining force* of rules, while the Skeptic insists that the *authorizing power* of the community is the only thing that can ground correctness.

  Your bottom-up versus top-down framing is a powerful heuristic that correctly locates the divergence in explanatory strategy. However, progress will not come from proving one direction superior. It will come from recognizing that the demand for a pre-social, individual fact of meaning is a demand for something that the concept of "meaning" was never designed to provide. The path forward lies in decoupling the *causal capacity* to follow rules (which is individual and bottom-up) from the *normative status* of following rules correctly (which is social and top-down), and accepting that neither can fully reduce to the other.
