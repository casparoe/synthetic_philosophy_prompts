      *   **Constraints:** No bibliographies/reading lists/citations. Focus on conceptual coherence, implicit commitments, and specific revisions.
      *   **Specific Questions to Answer:**
          1.  Relational theory vs. control-based view?
          2.  Coherence of hypocrisy gradients (binary vs. proportional)?
          3.  Instability points (structural vs. agential boundary)?
