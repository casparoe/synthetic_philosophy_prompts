  *(Refining Question 3)*: The boundary between structural and agential is the most fertile ground for a novel. The essay in the novel might try to be rigid, but the plot should show it's fluid. I should advise the user to let the essay *claim* clarity while the *story* shows ambiguity.

  *(Refining Question 4)*: "Aesthetic adjustments" is a sharp phrase. I should use it. The weighting factors (time, visibility) might be aesthetic unless they map onto specific social mechanisms (e.g., statute of limitations).

