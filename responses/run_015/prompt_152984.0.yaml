      *   *Check:* Is the "gradient" idea truly distinct from "degrees of blame"? No, it's degrees of *standing*. Important distinction. Blame can be mild, but standing is the *right* to blame. The notes argue the *right* is graded. This is innovative but risky. I need to highlight that risk.

  6.  **Final Polish:** Organize by the four questions provided in the prompt for clarity. Add an introductory and concluding framing. Ensure the advice helps the *novel* (i.e., how this philosophy serves the narrative themes).

