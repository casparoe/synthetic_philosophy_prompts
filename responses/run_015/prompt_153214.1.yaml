answer: |-
  **Project Title:** Ramsey's Rule: A Pragmatist Criterion for Category Mistakes in Quantitative Ethics

  **1. Research Question**
  Can Frank Ramsey's pragmatist account of belief—specifically his distinction between action-guiding propositions and cognitively redundant ones—be reconstructed into a formal criterion for identifying category mistakes in contemporary value discourse? Specifically, does the attribution of measurable "purpose scores" to long-range collective outcomes commit the same grammatical error Ramsey suspected in the question "What is the meaning of life?"

  **2. State of the Field and Gap**
  Frank Ramsey's remarks on ethics and the meaning of life are typically treated as footnotes to the development of Logical Positivism or Emotivism. Standard scholarship focuses on his influence on Ayer or Wittgenstein, treating his ethical views as a historical stepping stone to *Language, Truth, and Logic*. Consequently, Ramsey's specific *pragmatist* machinery—his theory of belief as a disposition to act, developed in "Truth and Probability" and "Facts and Propositions"—is rarely decoupled from this historical narrative and applied as an analytical tool.

  Simultaneously, contemporary critiques of quantitative ethics (e.g., in longtermism, social impact investing, or algorithmic governance) often rely on Aristotelian, Foucauldian, or utilitarian frameworks. There is a lack of precise, analytic criteria for distinguishing between *useful measurement of outcomes* and *category mistakes regarding value*. Existing answers leave open the possibility that a Ramseyan pragmatism offers a sharper demarcation: one that does not dismiss value claims as mere emotion (as emotivism does) but identifies them as grammatical confusions regarding the function of belief.

  **3. Methodology: Rational Reconstruction over Exegesis**
  This project employs a method of **rational reconstruction** rather than archival exegesis. I will not search for unpublished manuscripts or new historical data. Instead, I will synthesize Ramsey's scattered remarks on meaning with his rigorous accounts of truth, belief, and probability to construct a working criterion.

  *   **Phase 1: Reconstruction.** I will extract Ramsey's principle that a belief's content is defined by the actions it causes. I will then formalize his suggestion that questions like "What is the meaning of life?" are malformed because they seek an empirical referent for a term that functions only as an evaluative stance.
  *   **Phase 2: Application.** I will apply this reconstructed criterion to a specific case study: the framing of collective human purpose within quantitative ethical frameworks (e.g., assigning numerical "purpose scores" to existential risk reduction or social interventions).
  *   **Phase 3: Testing.** I will test whether the "purpose score" functions as a genuine guide to action (distinct from utility or preference) or whether it is, in Ramsey's terms, a "redundant proposition" masquerading as a fact.

  This conceptual approach is preferable to a purely historical one because the fellowship's aim is to press a philosophical position into service on a new problem. A historical commentary would clarify Ramsey; this project aims to clarify *us*, using Ramsey as the lens.

  **4. Work Plan (12 Weeks)**
  *   **Weeks 1–4 (Reconstruction):** Close reading of *The Foundations of Mathematics*, "Truth and Probability," and "Facts and Propositions." Drafting the "Ramseyan Criterion" for category mistakes. Explicitly marking speculative extrapolations.
  *   **Weeks 5–8 (Case Study):** Selection of specific quantitative ethical frameworks (e.g., specific longtermist metrics or social impact bonds). Applying the Criterion to determine if "purpose" is being treated as a measurable property.
  *   **Weeks 9–12 (Synthesis and Writing):** Evaluating the results. Drafting the final paper. Refining the assessment of success/failure conditions.

  **5. Expected Outcomes and Failure Conditions**
  *   **Positive Result:** The project produces a clear demarcation rule. It demonstrates that attributing a measurable "purpose score" commits a grammatical error by treating an evaluative stance as an empirical variable, thereby offering a novel critique of quantitative ethics that avoids standard anti-realist dismissals.
  *   **Negative Result:** The reconstruction reveals that Ramsey's pragmatism collapses into generic non-cognitivism when applied to this domain. This is still a valuable outcome: it demonstrates that Ramsey's critique offers no distinctive advantage over standard emotivist dismissals regarding value metrics, saving future scholars from pursuing this specific theoretical avenue.

  **6. Risk Assessment and Vulnerability**
  The central vulnerability of this proposal is **interpretive risk**. Ramsey never systematized his views on the meaning of life; they remain scattered and almost offhand. There is no canonical source text to anchor the reconstruction.

  *   **Mitigation:** I will address this by anchoring every step of the reconstruction to arguments Ramsey *actually made* about belief and action in his core technical papers. Where I extrapolate from his theory of truth to his theory of value, I will explicitly flag the move as speculative.
  *   **Constraint:** Given the twelve-week window, I will not attempt to resolve the broader historical debate regarding Ramsey's ethical realism. I will treat his texts as a toolkit for the specific problem of metricization, accepting that this may involve a degree of creative adaptation that pure historians might contest.

  **7. Significance**
  If successful, this project offers a dual contribution: it revitalizes Ramsey's pragmatism as a live tool for contemporary meta-ethics, and it provides analysts of quantitative governance with a precise logical criterion for identifying when "measurement" becomes "metaphysics." It transforms a historical curiosity into a functional diagnostic instrument.
