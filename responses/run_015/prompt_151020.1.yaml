answer: |-
  Medicine presupposes a pragmatic realism where a grouping is real if it sustains reliable causal leverage for intervention, meaning the polygenic test case counts as a genuine disease despite lacking mechanism or compression.

  On this view, the "reality" of a disease is not grounded in internal uniformity but in external responsiveness; if a category consistently predicts that action X yields outcome Y, it has carved nature at a joint that matters for *doing*, which is medicine's primary ontology. The test case you describe is therefore a real disease because it supports a robust counterfactual: treating these specific people works. The lack of mechanism makes the category opaque, not false, and the lack of compression is irrelevant because medicine aims to rescue individuals, not summarize populations. Mechanism talk is pursued not to validate the category's existence—the treatment response already did that—but to expand its leverage; knowing the why allows for safer combinations, side-effect prediction, and cheaper proxies, which is why categories split when mechanisms emerge rather than being discarded as "fake."

  The mixing of physical and intentional stances is necessary because physical descriptions alone cannot carry the normative load required for clinical practice. A physical description tells you what *is*, but a functional description like "the body is trying to hold onto salt" tells you what is *failing* relative to a goal state of homeostasis. Disease is inherently a deviation from function, not a deviation from particle arrangement, so without the intentional stance, you lose the definition of pathology itself. Concretely, if hospitals insisted only on physical-stance descriptions, trials would stall because inclusion criteria would require exhaustive molecular sequencing rather than phenotypic proxies, and clinicians would lose the heuristic speed needed to navigate complex systems in real-time. You would be left with a biology of states without a map for which states require correction, rendering the practice unable to distinguish between a variant and a violation.
