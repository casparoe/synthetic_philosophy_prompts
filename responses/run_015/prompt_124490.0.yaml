      *   Section 1: The False Dichotomy (A vs B).
      *   Section 2: The Means/Ends Reality Check.
      *   Section 3: The Proposal (Option C).
      *   Section 4: The Vote.
      *   Section 5: Direct responses to Chair and Philosopher.

      *Refining the "Means/Ends" section:* Be careful not to get bogged down in philosophy. Keep it practical. "We cannot treat 'collapse risk' as a scientific fact we are discovering; it is a value framework we are operationalizing."

      *Refining the "Vote":* Make it binary or ternary? Better to vote on the *Framework* in June, based on this memo.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Framework for Restricted Bequest ($40m/6yr)

  **1. Executive Summary**

  We are operating under a false dichotomy. Option A (Open Call) and Option B (Targeted Planning) are not opposites; they are different points on a spectrum of control. Both claim a neutrality they do not possess. Option A hides value judgments inside referee selection; Option B risks rigidity in a domain defined by uncertainty.

  I recommend we adopt **Option C: An Adaptive Portfolio with Meta-Evaluation.**

  This approach accepts the Chair's demand for strategic direction and accountability while incorporating the Philosopher's demand for epistemic humility. It treats the allocation mechanism itself as a hypothesis to be tested, not a fixed truth.

  **2. The Means/Ends Distinction: Where It Holds and Where It Collapses**

  We must resolve the philosophical impasse before voting. Our colleague's Carnapian argument—that reason dictates means, not ends—is correct regarding *individual project selection*, but it collapses at the *portfolio strategy* level.

  *   **Where it holds:** No amount of data can tell a referee whether Project X is *more important* than Project Y. That is a value judgment. Peer review is the correct tool here to assess technical merit (means) against a provided criteria.
  *   **Where it collapses:** The donor has set the end ("reduce collapse risk"), but this phrase is empty without interpretation. Deciding whether "collapse risk" means AI safety, bio-security, or institutional resilience is not a scientific finding; it is a strategic bet. Option A pretends this bet isn't happening by outsourcing it to referees. Option B makes the bet explicit but assumes we know the answer today for a six-year horizon.

  **Conclusion:** We cannot avoid choosing ends (interpretations of the mandate). The question is whether we make those choices explicitly and review them (Option C), or hide them (Option A) or lock them in (Option B).

  **3. Recommendation: Option C (Adaptive Portfolio)**

  We structure the $40m over six years as follows:

  **A. Strategic Buckets (The "Ends")**
  Instead of five specific output targets (e.g., "N reports"), we define three broad **Risk Domains**. This satisfies the Chair's requirement for direction without the Philosopher's fear of pseudoscientific precision.
  *   *Example:* 40% Technical Mitigation (AI/Bio), 40% Institutional Resilience, 20% Emerging/Unknown.
  *   *Mechanism:* Open calls *within* these buckets. Referees judge merit; we judge alignment.

  **B. The Meta-Fund (The "Experiment")**
  We allocate 10% ($4m) specifically to test allocation mechanisms.
  *   This fund runs parallel experiments: some grants via standard peer review, some via lottery among qualified applicants, some via direct scouting.
  *   *Purpose:* This answers the "Convenient for what?" question. We are testing which mechanism yields higher impact per dollar. This turns the allocation process into data, satisfying the scientific rigor request while acknowledging the political nature of funding.

  **C. The Pivot Point (Year 3)**
  We do not lock the Strategic Buckets for six years. A mandatory review at Month 36 allows us to shift percentages between domains based on world events and Year 1-2 learnings. This addresses the risk that "civilisational collapse" looks different in 2027 than it does today.

  **4. The Six-Year Shape**

  *   **Years 1-2 (Deployment):** 50% of capital deployed. Focus on establishing the buckets and launching the Meta-Fund experiments.
  *   **Year 3 (Review & Pivot):** 10% capital reserved. Committee retreat to adjust Strategic Buckets based on interim data.
  *   **Years 4-6 (Completion):** 40% capital deployed. Focus on completion of multi-year grants and wind-down.

  **5. What We Vote On in June**

  I propose we vote on the **Strategic Framework**, not specific grants. The motion should be:

  > *"To adopt an Adaptive Portfolio structure comprising three Strategic Risk Domains, a 10% Meta-Evaluation Fund, and a mandatory strategic review at Month 36."*

  If this passes, staff will return in September with the defined Domains for approval.

  **6. Addressing the Dissent**

  **To the Chair (Pro-Planning):**
  You are right that Option A is not neutral; it is a commitment to the status quo of the current academic/NGO network. Option C gives you the accountability you need. The Strategic Buckets ensure the money goes where *we* decide, not just where applicants apply. The Milestones are not "number of reports," but "deployment of capital against domains." If a domain underperforms or becomes obsolete by Year 3, the Pivot Point allows us to cut losses, which is more responsible than sticking to a dead plan.

  **To the Philosopher (Pro-Open Call):**
  You are right that we cannot scientifically prove one definition of "collapse" is superior to another. Option C admits this. By funding the Meta-Evaluation Fund, we acknowledge that our selection mechanism might be flawed. We are not claiming the Strategic Buckets are "true," only that they are the current working hypothesis. The Open Call remains the engine for project selection (means), preserving peer review where it works best. We are not planning the science; we are planning the *conditions* under which science happens.

  **7. Risk Assessment**

  *   **Risk of Option A:** We spend $40m on low-risk, incremental work that the field already likes, missing the "collapse" mandate entirely. No one is accountable.
  *   **Risk of Option B:** We pick the wrong five targets in Year 1 and are contractually or morally bound to fund them in Year 5 when they are irrelevant.
  *   **Risk of Option C:** It requires more committee time (the Year 3 Pivot). It is administratively heavier than a simple open call.

  **8. Final Word**

  The donor gave us a value judgment ("prevent collapse") and asked us to operationalize it. That is a political and strategic task, not a scientific one. Option A pretends it isn't. Option B pretends we can solve it with a spreadsheet. Option C accepts the burden of the value judgment but builds in a mechanism to correct it.

  I ask that we circulate this framework for comment prior to the 14th, with a view to voting on the *structure* in June.

  [Your Name]
