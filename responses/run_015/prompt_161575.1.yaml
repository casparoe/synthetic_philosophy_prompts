  # The Negative-Leaning Decision Tree

  **Instructions:** Answer each question based on your immediate intuition about the *case*, not the theory you think you hold. Follow the branch that matches your verdict. If you reach a leaf, stop. If a question does not apply to your previous answer, follow the "Skip" instruction.

  ### The Questions

  **Q1. The Torture vs. Grapes (Trade-off)**
  One person is tortured intensely for one year. Alternatively, one billion people each eat a grape that gives them 10 seconds of mild pleasure. No one knows who the torture victim is. You must choose which world obtains.
  *   **(A) Prevent the torture.** (Suffering has lexical or near-lexical priority). → *Go to Q2.*
  *   **(B) Allow the torture.** (Suffering and happiness trade off at a fixed or diminishing rate). → *Go to Leaf 1.*

  **Q2. The Shrimp vs. Human (Scope)**
  You can prevent 1 human from experiencing moderate chronic pain for a year, OR prevent 1,000,000 shrimp from experiencing subjectively identical pain for a year. You cannot do both.
  *   **(A) Save the shrimp.** (Broad scope; sentience is what counts). → *Go to Q3.*
  *   **(B) Save the human.** (Narrow scope; cognitive capacity or species matters). → *Go to Q4.*

  **Q3. The Happy Child (Creation - Broad Scope Path)**
  You can bring into existence a being (human or animal) who will have a life clearly worth living (+100 net units), containing no severe suffering. Alternatively, you create no one. No other beings are affected.
  *   **(A) Neutral / Not Required.** (Asymmetry; creating happiness is not a duty). → *Go to Q5.*
  *   **(B) Good / Required.** (Symmetry; creating happiness is a duty). → *Go to Leaf 2.*

  **Q4. The Happy Child (Creation - Narrow Scope Path)**
  Same case as Q3, but the being is a human.
  *   **(A) Neutral / Not Required.** (Asymmetry). → *Go to Q5.*
  *   **(B) Good / Required.** (Symmetry). → *Go to Leaf 3.*

  **Q5. The Innocent Sacrifice (Constraints)**
  To prevent 1,000 people from experiencing moderate pain (equivalent to a broken bone), you must actively kill one innocent, unwilling person painlessly. They would otherwise live a normal life.
  *   **(A) Forbidden.** (Deontic side-constraints; aggregation is limited). → *Go to Leaf 4.*
  *   **(B) Permitted / Required.** (Aggregation holds; minimize total suffering). → *Go to Q6.*

  **Q6. The Painless Death (Killing Baseline)**
  A being exists with 40 years of happy life remaining (+10 units/year). You can painlessly end their life now, or let them live. No other effects.
  *   **(A) Harm / Wrong.** (Baseline is continued existence; loss of future goods matters). → *Go to Leaf 5.*
  *   **(B) Neutral.** (Baseline is non-existence; no subject to harm). → *Go to Q7.*
  *   **(C) Benefit.** (Cessation of desire is good). → *Go to Leaf 6.*

  **Q7. The Future Catastrophe (Temporal & Risk)**
  Option A: Spend all resources to reduce a 1% risk of a future scenario containing 10^20 units of suffering (1,000 years from now).
  Option B: Spend all resources to certainly prevent 10^15 units of suffering occurring now (severe poverty/disease).
  *   **(A) Prioritize Future Risk.** (Longtermist / Risk-Averse). → *Go to Leaf 7.*
  *   **(B) Prioritize Current Suffering.** (Near-termist / Expectation-Maximizer). → *Go to Leaf 8.*

  ***

  ### The Leaves (Positions)

  **Leaf 1: Classical Utilitarian**
  *   **Status:** Occupied (The baseline).
  *   **Awkward Commitment:** You must allow the torture if the billion grapes are sweet enough or numerous enough.
  *   **Note:** Included as a control; most in your group should have filtered out at Q1.

  **Leaf 2: Broad-Scope Positive Utilitarian**
  *   **Status:** Unoccupied.
  *   **Reason:** Merely unattractive. (Combines broad moral circle with a duty to create happy shrimp; implies a "happy hell" of maxed-out population is best).
  *   **Awkward Commitment:** You are obligated to breed as many happy shrimp as physically possible until resources run out.

  **Leaf 3: Narrow-Scope Positive Utilitarian**
  *   **Status:** Unoccupied (in a suffering-focused group).
  *   **Reason:** Unattractive. (Standard pronatalist utilitarianism; rarely identifies as "negative-leaning").
  *   **Awkward Commitment:** You must prioritize creating happy humans over relieving severe suffering in existing beings if the numbers favor creation.

  **Leaf 4: Deontological Negative Utilitarian**
  *   **Status:** Occupied.
  *   **Awkward Commitment:** You must let the 1,000 people suffer broken bones rather than violate the one innocent's right to life.
  *   **Note:** Often aligns with rights-based views; separates from aggregative NU.

  **Leaf 5: Conservative Negative Utilitarian**
  *   **Status:** Occupied.
  *   **Awkward Commitment:** You cannot painlessly kill a happy being even if they consent, because you owe it to their "future self" to let them exist.
  *   **Note:** Distinguishes between harming existing beings vs. creating new ones.

  **Leaf 6: Tranquilist / Buddhist Negative**
  *   **Status:** Occupied.
  *   **Awkward Commitment:** Death is a benefit for any being with desires, implying the ideal world is a painless void.
  *   **Note:** Distinct from standard NU; sees existence itself as the burden.

  **Leaf 7: S-Risk Longtermist**
  *   **Status:** Occupied.
  *   **Awkward Commitment:** You must ignore currently suffering humans to work on abstract governance structures for future artificial minds.
  *   **Note:** Driven by Q7; often correlates with Broad Scope (Leaf 8 variant).

  **Leaf 8: Near-Term Welfare Negative**
  *   **Status:** Occupied.
  *   **Awkward Commitment:** You must ignore the potential for galaxy-scale suffering in the future to relieve poverty today.
  *   **Note:** Driven by Q7; often correlates with Narrow Scope (Leaf 5 variant).

  **Leaf 9: Unoccupied (The "Happy Hell" NU)**
  *   **Status:** Unoccupied.
  *   **Path:** Q1(A) → Q2(A) → Q3(B).
  *   **Reason:** Incoherent. (Lexical priority on suffering prevents justifying the risk of creating beings who might suffer, even if net positive).
  *   **Awkward Commitment:** N/A (Position logically unstable).

  **Leaf 10: Unoccupied (The "Benevolent Killer")**
  *   **Status:** Unoccupied.
  *   **Path:** Q1(A) → Q5(A) → Q6(C).
  *   **Reason:** Unexplored/Unattractive. (Believes killing is forbidden [Q5] but death is a benefit [Q6]; creates a paradox where you must keep them alive to harm them).
