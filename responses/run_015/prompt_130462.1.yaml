  - We want to preserve what I've started calling standby history: records of the paths we deliberately didn't take — abandoned technologies, scrapped constitutions, arguments we lost — kept not to inspire, not to console, and not to indict, but so that generation six still has the option of reviving them. Nietzsche's three modes all seem to be about what history does for the people alive right now; I can't tell whether standby history is a genuine fourth mode or just a degenerate case of the antiquarian one, and whether it earns its own slice. If it gets one, make it four fractions summing to 1 instead.
  - There's no living tradition to interpret any of this. Whatever we pack has to survive eight generations of readers who share no language with us except the one we teach them out of the archive itself. That looks like it hits the three modes very unevenly — some of them seem to need an ongoing community to function at all, and I want that baked into your numbers rather than footnoted.

  Then a second, separate ranking over the same items: rate each one 1–5 for how badly it rots or backfires when it overshoots its share on a voyage this long, and tell me which single one you'd cut entirely if a cut had to be made.

  Also — we're still fighting about whether to include a honest account of why the ship was actually built (it was not a good reason). I'll save that for another email, don't let it eat your budget here.
