  Strictly speaking, measurement correlates the system with the apparatus. $S(A) + S(S) \to S(A,S)$. If A starts pure, S is random, the joint state has entropy.
  Actually, standard resolution: Measurement copies state $X$ to Memory $M$. $M$ goes $0 \to X$. This is logically irreversible *unless* we view it as a CNOT where $M$ is the target. CNOT is reversible. So yes, measurement can be reversible *if* $M$ starts at 0.
  This reinforces the Teacher's point: The "0" state of the memory/tape is the crucial resource.

