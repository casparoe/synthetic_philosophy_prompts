answer: |-
  Hey, this is a classic problem in bioinformatics specs: you're building a system that needs to treat biological "truth" as deterministic data, but biology is basically just history written in chemistry. Since you don't have a philosopher or a PI on speed dial, you need a heuristic that forces consistency without pretending to solve metaphysics.

  Here's the distinction you need to keep in mind:
  1. Etiological accounts define a gene's function by the historical reason it was selected by evolution to survive in ancestors.
  2. Causal-role accounts define a gene's function by the actual physical effect it produces in the cell right now.
  3. You get into trouble when a gene does something useful today that wasn't the reason it evolved, or when it retains an old job it no longer needs.

  ### The "Function-Drift" Spec Procedure

  This runbook is designed to take you 20–30 minutes per annotation. It forces you to capture the conflict rather than hide it. We're introducing a niche metric called the **Function-Drift Severity Score (FDSS)** to flag how much the history and current activity disagree.

  **Step 1: Gather Inputs (10 mins)**
  *   Query UniProt/GO for "Molecular Function" (Causal-Role proxy).
  *   Query literature summaries for "Evolutionary Origin" or "Selected Effect" (Etiological proxy).
  *   **Decision Point:** Is there peer-reviewed evidence for *why* this gene persisted in the genome?
      *   Yes → Go to Step 2.
      *   No → Tag as `ORIGIN_UNKNOWN`, set FDSS = 3, skip to Step 4.

  **Step 2: Compare Accounts (5 mins)**
  *   Compare the "Selected Effect" (History) against the "Current Activity" (Causal).
  *   **Decision Point:** Do they describe the same biochemical outcome?
      *   Yes → Set FDSS = 0.
      *   No → Go to Step 3.

  **Step 3: Classify the Drift (5 mins)**
  *   **Pleiotropy:** Does it do both the old job and the new job simultaneously?
      *   Yes → Set FDSS = 1. `[JUDGMENT REQUIRED: Prioritize the job most critical to the clinician's specific assay.]`
  *   **Exaptation (Spandrel):** Did it evolve for Job A, but now only does Job B (Job A is lost or irrelevant)?
      *   Yes → Set FDSS = 2.
  *   **Redundancy:** Does knocking it out change nothing because a backup exists, even though evolution kept it?
      *   Yes → Set FDSS = 2. `[JUDGMENT REQUIRED: Label as 'Non-Essential Redundant' despite evolutionary conservation.]`

  **Step 4: Write the Spec Field (5 mins)**
  *   If FDSS is 0 or 1: Write the standard function description.
  *   If FDSS is 2 or 3: You must use the **Dual-Label Format**.
      *   Format: `FUNCTION: [Current Activity] || EVOLUTIONARY_CONTEXT: [Historical Note/Unknown]`
      *   **Constraint:** Do not merge these into one smooth sentence. The ugliness warns the clinician that the biology is unstable here.

  ---

  ### Worked Cases

  #### Case 1: The Clean Match (Hexokinase 1)
  *   **Inputs:** History shows selection for glucose phosphorylation in early mammals. Current activity is glucose phosphorylation in liver cells.
  *   **Comparison:** History matches Current.
  *   **FDSS:** 0.
  *   **Spec Output:** `FUNCTION: Catalyzes phosphorylation of glucose to glucose-6-phosphate.`
  *   **Notes:** No flags needed. Downstream analysis can treat this as a deterministic transformer.

  #### Case 2: The Messy Split (Crystallin in Eye Lens)
  *   **Inputs:** History shows selection as a stress-response enzyme in ancestors (Etiological = Enzyme). Current activity is structural refraction of light in the lens (Causal = Structural), enzymatic activity is lost or irrelevant here.
  *   **Comparison:** History (Enzyme) conflicts with Current (Structure). This is exaptation.
  *   **FDSS:** 2.
  *   **Spec Output:** `FUNCTION: Structural lens protein (refractive) || EVOLUTIONARY_CONTEXT: Co-opted stress enzyme (catalytic activity inactive in this tissue)`
  *   **Notes:** Users will hate this dual-label because their pipeline expects one "type." Tough. If you label it only as "Enzyme," their structural model breaks. If you label only "Structural," their metabolic pathway map breaks. The spec forces them to handle the branch logic.

  #### Case 3: The Unknown Origin (Human Accelerated Region Product)
  *   **Inputs:** Current activity is binding DNA in neuro-development (Causal = Regulator). Evolutionary origin is opaque; it's a human-specific sequence with no clear orthologs in mice (Etiological = Unknown).
  *   **Comparison:** Cannot compare. Historical filter is missing.
  *   **FDSS:** 3.
  *   **Spec Output:** `FUNCTION: DNA-binding regulator (neuro-development) || EVOLUTIONARY_CONTEXT: Origin Unknown (Human-Specific)`
  *   **Notes:** The FDSS=3 triggers a manual review flag for the senior engineer. You aren't claiming it *has* no history, just that you can't verify it. This prevents the pipeline from assuming conservation where none exists.

  ---

  ### What This Procedure Cannot Do

  Look, I need to be real about the limitations so you don't get burned during sign-off:

  1.  **It Doesn't Solve Metaphysics:** This checklist doesn't tell you which account is "true." It just forces you to record where they disagree. If the biology is fundamentally ambiguous, the spec will look ambiguous.
  2.  **It Relies on Database Quality:** If UniProt says "unknown" but a recent paper knows the origin, your FDSS will be wrong. You are only as good as the metadata you query.
  3.  **It Won't Stop Clinicians from Ignoring Flags:** You can write the Dual-Label perfectly, but if their downstream tool crashes on the `||` separator, that's a product issue, not a philosophy one. You need to make sure the schema accepts the extra field.
  4.  **No Substitute for Expert Review:** If FDSS hits 2 or 3, this procedure buys you safety, but it doesn't replace the need for a biologist to eventually look at it. It just ensures that when they *do* look, the conflict is already highlighted.

  Use this to keep your specs honest. If the biology is messy, the spec should be messy too.
