prompt: |-
  hey im a backend engineer writing specifcation docs for a genomics pipeline — about 5 or 6 gene/protein annotations per week, 20-30 mins each, and a senior engineer (not a biologist) has to sign off. clinicians and researchers recieve these, so if i mislabel what something "does" it can break downstream analysis. i have basically zero formal philosophy background.

  please act like a philosophy-of-biology expert who also writes tech specs. think carefully, and start by brainstorming in plain english: what is the difference between an etiological account (function = what it was selected for) and a causal-role account (function = what it actually does now in the pathway)? keep it to 3 sentences, no heavy jargon.

  then turn that distinction into a reusable checklist / flowchart-in-words that i can run in under 30 minutes with no PhD on call. it should have ordered steps, clear decision points, and explicit tags for "this is a judgment call i cant fully automate." cover the hard cases: pleiotropy, spandrel-type co-option/exaptation, redundancy where the causal role disappears but selection history doesnt, and cases where evolutionary evidence is just missing. also please inject a small niche framing idea — maybe a "function-drift audit" or a "dual-label severity score" — that isnt standard textbook stuff but helps make the checklist usable.

  apply the procedure to three worked cases:
  1. a clean case where both accounts line up (e.g., a well-studied metabolic enzyme)
  2. a messy split where etiological says "no original function" but causal-role shows clear regulatory activity now — the procedure should force a dual-label that users will probably hate, and say exactly what to write in the doc
  3. a case where the current causal role is obvious but evolutionary origin is totally unknown, so wether the historical filter applies is unclear

  be honest about what this procedure CANNOT do (it wont resolve deep metaphysics, replace expert review, etc.). write casually, like talking to a coworker. i dont want citations, bibliographies, or reading lists — just the procedure. please check your reasoning step-by-step before answering.
