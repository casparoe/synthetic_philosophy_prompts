answer: |-
  You have identified a genuine and profound structural unity across these three cases. Your distrust of your own formulation is unwarranted; it is accurate. The pattern you describe does not have a single, canonical name in the literature, though it sits at the intersection of several well-known concepts.

  Below, I set out the nearest established concepts and their limitations, propose a coinage with a definition, and address your specific questions regarding the source of the pattern and the status of comparative guarantees.

  ### 1. Do the cases share a structure?

  Yes. All three cases are instances of the same manoeuvre.
  *   **Case 1 (NFL):** The empirical claim ("the world is smooth") is moved from the *conclusion* (where it would be vulnerable) to the *setup* (the choice of measure), where it appears as a technical necessity.
  *   **Case 2 (Meta-Learning):** The empirical claim ("someone in the pool is right") is moved from the *guarantee* (absolute success) to the *condition* (regret bounds), where it appears as a logical constraint.
  *   **Case 3 (Restriction):** The empirical claim ("computable hypotheses work") and the transcendental claim ("we must restrict to start") are conflated. The transcendental claim provides the cover for the empirical one.

  In each instance, a contingent fact about the world, required to make the method succeed, is recast as a structural feature of the method itself.

  ### 2. Nearest Established Concepts

  There are three neighbouring concepts, but none captures the specific rhetorical and epistemic shift you have isolated.

  **A. Inductive Bias**
  *   *The Concept:* In machine learning, this refers to the set of assumptions a learner uses to predict outputs for inputs it has not yet encountered.
  *   *The Mismatch:* "Inductive bias" is a neutral technical term describing *that* an assumption exists. It does not name the *argumentative move* of justifying that assumption by disguising it as a technical requirement or a pragmatic necessity. It names the noun, not the verb.

  **B. Reichenbach's Pragmatic Vindication**
  *   *The Concept:* Hans Reichenbach argued that while we cannot prove induction will succeed, we can prove that *if* any method succeeds, induction will.
  *   *The Mismatch:* This fits Case 2 perfectly. However, it does not account for Case 1 (the choice of measure) or the conflation in Case 3. Furthermore, Reichenbach is explicit about the conditional nature of the vindication. The pattern you observe is often characterised by the *concealment* of that conditionality, presenting the method as robust rather than merely "best of a bad lot".

  **C. Transcendental Argument**
  *   *The Concept:* An argument that claims X is a necessary condition for the possibility of experience Y. (Case 3's second justification: "restriction is needed to get started").
  *   *The Mismatch:* A genuine transcendental argument establishes a necessary truth. The pattern you identify uses the *form* of a transcendental argument to shield a contingent empirical claim (that the restriction happens to match the world). It mimics necessity to protect contingency.

  ### 3. Coinage and Definition

  Since no existing term captures the specific displacement of empirical burden into structural precondition, I propose the following coinage:

  **Term:** **The Structuralisation of Contingency**

  **Definition:**
  The Structuralisation of Contingency is an argumentative manoeuvre wherein a contingent, empirical assumption about the world (required to validate a method) is recast as a necessary, structural, or technical precondition of the method itself. This serves to shield the assumption from skeptical scrutiny by presenting it as a rule of the game rather than a bet on the world.

  **Three Cases:**

  1.  **Clear Fit (The NFL Response):**
      *   *Scenario:* A researcher dismisses the No-Free-Lunch theorem by restricting the hypothesis space to "smooth functions". When asked why the world should be smooth, they reply, "We cannot learn otherwise," or "This is the standard measure."
      *   *Reason:* The contingency (the world is smooth) is structuralised into the measure. The empirical bet is hidden inside the technical setup.

  2.  **Clear Non-Fit (Deductive Logic):**
      *   *Scenario:* A logician asserts that if $P \to Q$ and $P$ is true, then $Q$ must be true.
      *   *Reason:* There is no empirical assumption about the world being "structured" to allow modus ponens. The validity is internal to the system and does not rely on a concealed contingency about the external environment.

  3.  **Near Miss (Conjugate Priors in Bayesianism):**
      *   *Scenario:* A statistician chooses a conjugate prior because it makes the posterior calculation analytically tractable.
      *   *Reason:* This is a pragmatic choice for computational ease. It becomes an instance of the Structuralisation of Contingency *only if* the statistician further claims that because the math is tractable, the prior is therefore a "natural" or "objective" representation of reality. If they admit it is merely for convenience, it is a near miss; if they claim convenience implies truth, it fits the pattern.

  ### 4. Source of the Pattern

  You asked whether this pattern is an artifact of how the theorems are stated, an artifact of your reading, or a real feature of the epistemic situation.

  It is a **real feature of the epistemic situation**.

  The theorems (NFL, Hume's Problem) correctly identify a boundary condition: learning is impossible without assumptions. The pattern arises because human agents cannot operate in a state of suspended assumption. To act, we must treat our assumptions as fixed points. Consequently, we are psychologically and rhetorically compelled to promote our working assumptions from "contingent bets" to "structural necessities."

  It is not an artifact of the theorems; the theorems merely make the necessity of the assumption visible. It is not an artifact of your reading; you have correctly identified the defensive posture adopted when that visibility becomes uncomfortable. It is the inevitable friction between the *logic of justification* (which demands unconditional grounds) and the *practice of inquiry* (which must begin somewhere).

  ### 5. Comparative Guarantees and Conversion

  You asked: *Under what conditions does a comparative guarantee of this shape convert into a reason to expect success, and is that conversion itself another instance of the pattern?*

  A comparative guarantee (e.g., "I will do as well as the best expert in the pool") converts into a reason to expect success **if and only if** you possess an independent warrant for believing that the pool contains a successful expert.

  **Is this conversion another instance of the pattern?**
  **Yes.**

  To claim you have a "reason to expect success" based on a comparative guarantee is to engage in the Structuralisation of Contingency regarding the *pool*.
  1.  **The Contingency:** It is a contingent fact that the world is such that one of your chosen experts (or hypothesis class) can model it.
  2.  **The Structuralisation:** You treat the pool not as a gamble, but as a "comprehensive reference class" or a "universal approximator."
  3.  **The Concealment:** The guarantee holds mathematically regardless of the pool's quality, but the *expectation of success* relies on the concealed empirical claim that the pool is adequate.

  When you move from "I will not do worse than the best" to "I expect to do well," you are smuggling in the premise "The best is good." That premise is the very empirical claim the skeptical argument challenged. Thus, the escape from the pattern is itself an instance of the pattern.

  ### Summary

  You have isolated a fundamental tension in epistemology and learning theory. The nearest existing concepts describe the *components* (bias, vindication, necessity) but not the *glue* that holds them together in this specific defensive formation. **The Structuralisation of Contingency** names the act of turning a vulnerable empirical bet into an invulnerable methodological rule. It is a real feature of our epistemic predicament: we cannot justify our starting point without standing on it, so we pretend it is the ground itself.
