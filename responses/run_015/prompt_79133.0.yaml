answer: |-
  # Seminar Plan: The Moral Mechanics of *Undertale*
  **Duration:** 90 Minutes
  **Topic:** The Moral Status of Fictional Beings & Virtual Action
  **Prerequisite:** Participants are familiar with *Undertale* (routes, mechanics, endings).

  ## I. Introduction: Disambiguating the Moral Claim (15 Minutes)

  **Goal:** Separate the three conflated claims regarding video game morality to establish the framework for the session.

  **The Three Claims:**
  1.  **Intra-Fictional Wrong:** The character (e.g., Toriel) is a moral patient within the fiction, and the avatar's action constitutes a wrong *against them*.
  2.  **Player Assessment:** The player's real-world character is assessable based on their virtual choices, even if the fictional patient is not ontologically real.
  3.  **Artifact Demand:** The game artifact itself (code, design, persistence) issues a normative demand to the human operator, independent of the fiction's internal logic.

  **The Philosophical Baseline (Settled vs. Contested):**
  *   **Settled:** There is near-consensus in analytic philosophy of fiction that fictional beings do not exist ontologically. Therefore, Claim 1 is literally false under standard realism. You cannot murder what does not exist.
  *   **Contested:**
      *   **The Gamer's Dilemma:** Are virtual actions morally inert? Some argue virtual murder is permissible while virtual pedophilia is not (Luckey); others argue both are inert (Morgan); others argue both reflect real vice (Hogan).
      *   **The Normative Power of Artifacts:** Can a software program legitimately hold a human to moral account (Claim 3)? This is largely unexplored in standard literature, which focuses on Claim 1 and 2.

  **Seminar Task:** We will read *Undertale* not as a story about monsters, but as an argument attempting to collapse the distinction between these three claims. It tries to make Claim 2 feel like Claim 1, using the mechanics of Claim 3.

  ---

  ## II. Mechanics as Moral Vocabulary: Recontextualizing the Grind (25 Minutes)

  **Focus:** How *Undertale* modifies standard RPG mechanics to force Claim 2 (Player Assessment).

  **Discussion Points:**
  1.  **LV and EXP:**
      *   *Standard RPG:* Level and Experience are neutral metrics of progression/optimization.
      *   *Undertale:* Level = Level of Violence; EXP = Execution Points.
      *   *Philosophical Import:* The game refuses to let you treat violence as instrumental. In most games (e.g., *BioShock*), killing Little Sisters is a resource calculation (gain more ADAM vs. lose moral points). In *Undertale*, the "resource" *is* the moral failing. The mechanics argue that desensitization (grinding) is itself the moral injury.
      *   *Critique:* Does this successfully argue for Claim 2, or does it merely label a fictional stat? If I gain "Execution Points" in a fiction, have I executed anyone?
      *   *Literature:* Connect to the **Fictionalist Reply**. The fictionalist says no harm occurs because no one is there. *Undertale* counters by making the *statistic* persist on the player's file, not just the avatar.

  2.  **The Act/Mercy System:**
      *   *Mechanic:* Violence is a choice among equals (Fight, Act, Item, Mercy). Non-violence requires engagement (checking stats, sparing).
      *   *Philosophical Import:* This disrupts the "ludic contract" where enemies are obstacles. It forces the player to acknowledge the "otherness" of the code blocks.
      *   *Walton on Make-Believe:* Walton argues we feel "quasi-emotions." We fear the monster in make-believe. *Undertale* complicates this by making the "make-believe" require more cognitive load than the violence. Sparing is harder than killing. The game argues that moral effort (cognitive load) is a prerequisite for moral status.

  **Teaching Prompt:** Ask the group: Does renaming "Experience Points" to "Execution Points" change the moral ontology of the action, or is it merely rhetorical framing? If it is merely framing, does the game rely on a trick?

  ---

  ## III. Persistence and the Save File: The Artifact's Demand (25 Minutes)

  **Focus:** How *Undertale* utilizes Claim 3 (Artifact Demand) to bypass the "it's just a game" defense.

  **Discussion Points:**
  1.  **The Save/Reset as Moral Record:**
      *   *Mechanic:* The game remembers actions across resets. Characters (Sans, Flowey) reference timeline shifts.
      *   *Philosophical Import:* In standard fiction, a reset erases the moral context. In *Undertale*, the *file* is the moral patient. The game treats the save data as a continuous soul.
      *   *Contrast:* Compare to *Detroit: Become Human*. There, consequences are causal (if X dies, Y changes). In *Undertale*, consequences are meta-textual (the game *knows* you restarted).
      *   *Argument:* The game argues that the *persistence of choice* is what grounds moral responsibility. If the artifact remembers, the action is not ephemeral.

  2.  **The Judgment and the Ending:**
      *   *Mechanic:* The final judgment addresses the human, not the avatar. The True Pacifist ending requires the player to sell their soul or abstain from resetting permanently.
      *   *Philosophical Import:* This is the strongest instance of Claim 3. The code demands a real-world sacrifice (deleting the file, abstaining from content) to validate the moral stance.
      *   *Critique:* Is this a legitimate moral demand or a coercive design pattern?
      *   *Literature:* **Gendler on Alief.** This is the critical lens for this section.
          *   *Belief:* "These pixels are not real."
          *   *Alief:* "I am hurting something that is pleading with me."
          *   *Undertale's Move:* The game exploits the gap between belief and alief. It generates guilt (alief) and then points to that guilt as evidence of real moral failure (belief). It argues: "If you feel guilty, you *should* feel guilty, therefore the action was wrong."

  **Teaching Prompt:** Put the "Genocide Route Judgment" scene in front of the group. Ask: When the game condemns you, is it the *character* condemning the *avatar*, or the *software* condemning the *user*? Does the distinction matter for the validity of the judgment?

  ---

  ## IV. Critical Synthesis: Equivocation and Defense (25 Minutes)

  **Goal:** Evaluate where *Undertale* holds a defensible position and where it equivocates.

  **1. Where the Game is Defensible (Claim 3):**
  *   *Argument:* A game can legitimately hold you to account for the *attitudes* it asks you to take up.
  *   *Reasoning:* Even if no fictional being is wronged (Claim 1 is false), the player cultivates real-world dispositions (cruelty, instrumentalization of others). *Undertale* makes this visible by making the "grind" feel uncomfortable.
  *   *Philosophical Support:* This aligns with Virtue Ethics interpretations of the Gamer's Dilemma. The harm is to the *agent*, not the *patient*.
  *   *Consensus Check:* It is contested whether virtual actions affect real character. However, it is less contested that *reflective* engagement with art can shift moral perspective. *Undertale* succeeds as a moral artifact because it forces reflection, not because it simulates murder accurately.

  **2. Where the Game Equivocates (Sliding Claim 1 and 2):**
  *   *The Slide:* The game wants the *weight* of Claim 1 (you killed a person) to support the *verdict* of Claim 2 (you are a bad person).
  *   *The Exploit:* It uses audio-visual cues (screams, blood, pleading) that trigger biological empathy responses (alief) to simulate Claim 1. Then, in the meta-commentary, it claims those actions were "real" because the file remembers.
  *   *Critique:* A rigorous philosopher of fiction would say the game conflates *psychological impact* with *moral ontology*. Just because the player feels guilt (psychological) does not mean a wrong was committed against a being (ontological).
  *   *My Reading (Contestable):* I argue *Undertale* is philosophically dishonest here. It relies on the player's inability to distinguish between the *feeling* of harm and the *fact* of harm. It uses the "Paradox of Fiction" against the player: we know they aren't real, but we react as if they are. The game treats that reaction as proof of their reality.
      *   *Note to Instructor:* Mark this explicitly as a contestable reading. Some argue the "alief" *is* the moral reality that matters (pragmatism).

  **3. The "No One is There" Objection:**
  *   *Fictionalist Reply:* Ultimately, the code is if-then statements. When you "spare" a monster, you trigger a flag.
  *   *Undertale's Counter:* It doesn't matter if the monster is real; it matters that the *choice* was real.
  *   *Settled vs. Contested:*
      *   *Settled:* The monsters are code.
      *   *Contested:* Whether interacting with code can be a moral act. *Undertale* argues "Yes." The literature is split.

  ---

  ## V. Conclusion and Discussion Questions (Final 10 Minutes)

  **Summary:**
  *   *Undertale* fails to prove Claim 1 (fictional beings are real).
  *   *Undertale* succeeds in demonstrating Claim 3 (artifacts can demand moral accountability).
  *   *Undertale* attempts to prove Claim 2 (player vice) by exploiting the psychological overlap between 1 and 3.

  **Final Discussion Questions for the Group:**
  1.  If we accept that fictional beings cannot be wronged, does *Undertale*'s guilt-tripping constitute a manipulation of the player, or a legitimate moral education?
  2.  Does the persistence of the save file change the ontological status of the virtual action, or does it merely create a more sophisticated illusion of consequence?
  3.  Is the "Gamer's Dilemma" dissolved if we accept Claim 3 (that the game addresses the player directly) rather than Claim 1 (that the character is harmed)?

  **Instructor Note on Consensus:**
  Be careful not to present the "Virtue Ethics" solution (Claim 2) as the solution to the Gamer's Dilemma. It is one of three major responses (alongside Harm-Based and Consent-Based). *Undertale* advocates for the Virtue/Attitude position, but the literature remains divided on whether virtual actions truly shape character or are morally encapsulated.

  **Instructor Note on My Stance:**
  I am taking the position that *Undertale* exploits *alief* to simulate moral weight. This is not a settled reading. Some pragmatists argue that if the emotional response is identical, the moral distinction is pedantic. Be prepared to defend the distinction between "feeling wronged" and "being wronged."
