prompt: |-
  hey — I'm 17, I do policy debate and student government, and I'm doing an independent project this spring on who should get to vote. The thing I keep runing into is that everyone argues by just pointing at one case: someone says 16 year olds pay taxes and can drive, someone else says no but they still live with their parents and cant really judge policy, and then nothing moves. So before I write anything I want the full spec: what would a theory of the franchise actually have to get right to be worth taking seriously? Write me the desiderata list — which cases it has to handle without embarrassment (permanent residents who've lived in a town for twenty years and pay taxes there, citizens who moved abroad at age three and will never come back, people with severe cognitive disabilities, people in prison, a 14 year old who'll be living with the consequences of a climate or debt decision for seventy years, tourists and short term workers), which distinctions it isn't allowed to collapse (having a vote at all vs how much your vote is worth, being entitled to vote vs it being a good idea for you to vote, membership in a community vs merely being subject to its laws, the right to vote vs the right to run or to hold office), and which of those requirements are genuinely non-negotiable versus just something one side assumed at the start. Give me the case or the argument behind each requirement, not just the bullet, and say for each whether you think it's a real desideratum or a prejudice of one camp.

  The part I actually care about: I have this idea and I cant tell if it's good or if I'm just attached to it. Call it the stake gradient — the claim to a vote doesn't switch on at some age or at citizenship, it's a matter of degree, and it's strongest for whoever has the most years left living under whatever gets decided, which if you take it seriously gives a 15 year old a stronger claim than a 75 year old and makes the standard theyre too young to understand objection look like it's answering a different question entirely. I want that tested against your list rather than just rated: does it violate a desideratum that the usual views all satisfy (a flat age cutoff, the all-affected-interests principle, membership or consent of the governed, the you've paid in / done national service picture), and does taking it seriously force you toward fractional or weighted votes — parents casting proxy votes for their kids, or 16 to 21 year olds getting half a vote — or can you get the stake gradient without any of that, and what would that even look like in practice?

  Two more things. Please flag any pair of requirements on your list that you suspect can't both be satisfied, since if there is one that's probably the thing I'd build the whole paper around. And tell me which single desideratum rules out the most of the standard positions. If it helps to fix the purpose, I want a criterion good enough to actually decide whether my city should let 16 year olds and green card holders vote in municipal elections — not just something that sounds nice in a round of debate. And don't give me a reading list or citations or anything, I'll go find sources myself, I just want the shape of the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** 17-year-old policy debater/student government member. Smart, sophisticated, familiar with argumentation structures (desiderata, trade-offs, theoretical frameworks).
      *   **Project:** Independent project on voting rights/franchise theory.
      *   **Goal:** Wants a "spec" or "desiderata list" for a theory of the franchise. Needs to know what cases the theory must handle, what distinctions it must maintain, and which requirements are non-negotiable vs. prejudicial.
      *   **Specific Idea to Test:** "Stake Gradient" (claim to vote scales with years left living under the decision, favoring youth over elderly).
      *   **Constraints:** No reading lists/citations. Focus on the *shape* of the argument. Practical application (municipal elections for 16yo/green card holders). Flag incompatible requirements. Identify the single most exclusionary desideratum.
      *   **Tone:** Respectful, intellectually rigorous, direct, avoiding condescension (treat them like a peer/junior scholar).

  2.  **Deconstruct the "Desiderata List" (The Spec):**
      *   I need to categorize requirements into:
          *   **Edge Cases:** The specific scenarios mentioned (permanent residents, expat citizens, cognitive disabilities, prisoners, youth/climate, tourists).
          *   **Conceptual Distinctions:** Vote vs. Weight, Entitlement vs. Prudence, Membership vs. Subjection, Vote vs. Office.
          *   **Normative Status:** Non-negotiable vs. Prejudice.
      *   *Self-Correction/Refinement:* The user asked for the *case or argument* behind each requirement, not just a bullet. I need to explain *why* a theory needs to handle this.

  3.  **Evaluate the "Stake Gradient" Idea:**
      *   **Core Claim:** Voting power $\propto$ Future Exposure.
      *   **Strengths:** Addresses intergenerational justice (climate, debt). Solves the "arbitrary cutoff" problem of age.
      *   **Weaknesses/Challenges:** Administrative nightmare (calculating life expectancy?), violates "one person, one vote" (OPOV), potentially disenfranchises elderly (age discrimination?), ignores past contribution.
      *   **Testing against Desiderata:** Does it handle permanent residents? (Yes, if they stay). Expat citizens? (No, unless they return). Cognitive disabilities? (Unclear, depends on capacity to understand "stake"). Prisoners? (Depends on sentence length vs. remaining life).
      *   **Weighted Votes:** The user asks if this *forces* fractional/proxy votes. Yes, logically, if stake is a gradient, the vote should be too. But practically, this clashes with OPOV. I need to explore if there's a way to keep the gradient without weighted voting (e.g., using the gradient to set the *cutoff* rather than the *weight*).

  4.  **Identify Incompatible Requirements (The "Tension"):**
      *   *Candidate 1:* All-affected interests vs. Community Membership. (Tourists are affected but aren't members).
      *   *Candidate 2:* Equality of Voice (OPOV) vs. Proportionality of Stake. (This is the big one for the user's idea).
      *   *Candidate 3:* Competence/Capacity vs. Universal Inclusion (Cognitive disabilities).
      *   *Selection:* The tension between **Political Equality (One Person, One Vote)** and **Proportionality of Stake/Interest** is the most fertile ground for a debate paper. It directly challenges the user's "Stake Gradient."

  5.  **Identify the Most Exclusionary Desideratum:**
      *   Which rule kills the most standard positions?
      *   "Competence/Capacity" kills kids and some disabled people.
      *   "Citizenship" kills residents/tourists.
      *   "Subjection to Law" kills expats.
      *   *Winner:* **The Requirement of Competence/Capacity.** It's the primary justification for age limits and often used against disabled voters. It's the hardest to define without bias.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the "Stake Gradient" as a serious theoretical contender (Dahl, Goodin, etc., though no citations).
      *   *Section 1: The Desiderata Spec.* Break it down by Cases, Distinctions, and Normative Status.
          *   *Cases:* Address the specific examples (Residents, Expats, Disabled, Prisoners, Youth, Tourists). Explain *why* a theory fails if it ignores these.
          *   *Distinctions:* Vote vs. Weight, Right vs. Prudence, etc.
          *   *Status:* Mark what is fundamental (Equality) vs. contingent (Citizenship).
      *   *Section 2: Stress-Testing the Stake Gradient.*
          *   Does it violate OPOV? Yes.
          *   Does it handle the edge cases? (Good on climate/youth, bad on expats/tourists).
          *   Weighted vs. Cutoff: Can we use the gradient to set the *age* without weighting the *vote*? (Yes, this is a crucial pivot).
      *   *Section 3: The Incompatible Pair.*
          *   Political Equality vs. Stake Proportionality. This is the core conflict.
      *   *Section 4: The Most Exclusionary Desideratum.*
          *   Capacity/Competence.
      *   *Section 5: Practical Application (Municipal Level).*
          *   How does this help the user decide on 16yo/Green Card holders?
          *   Green Card: High stake (subject to laws, taxes, long term).
          *   16yo: High future stake.
      *   *Conclusion:* Encouraging but critical closing.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I give citations? *No.*
      *   *Check:* Did I answer the specific question about fractional votes? *Need to be clear: The gradient implies weighting, but you can truncate it to a threshold.*
      *   *Check:* Is the tone right? *Keep it analytical, not preachy.*
      *   *Check:* Did I flag the incompatible pair? *Yes, Equality vs. Proportionality.*
      *   *Check:* Did I identify the exclusionary desideratum? *Yes, Capacity.*

  8.  **Final Polish:** Ensure the distinction between "All-affected interests" and "All-subjected" is clear, as that's crucial for the resident/tourist distinction. Make sure the "Stake Gradient" critique is fair—it's not just "it's hard to do," it's "it changes the nature of the vote from equality to interest."

      *(Self-Correction on the "Stake Gradient"):* The user suggests the gradient makes the "too young to understand" objection irrelevant. I need to point out that *capacity* is still a separate desideratum from *stake*. You can have high stake but zero capacity (infant). So the gradient doesn't fully solve the capacity objection, it just sidesteps it for teenagers. I need to make sure that distinction is clear.

      *(Refining the "Incompatible Pair"):* The user asked for a pair that *can't both be satisfied*. Strict OPOV and Strict Stake Proportionality are logically mutually exclusive if stakes vary. That's the one.

      *(Refining the "Exclusionary Desideratum"):* "Capacity" is the big one. It's the gatekeeper.

      *(Practical Advice):* For the city council question, the "All-Subjected" principle + "Stake" works best for Green Card holders. "Future Stake" works for 16-year-olds.

      *Let's write.*
answer: |-
  This is a sophisticated prompt. You have correctly identified that most voting rights discourse is a collision of intuitions masquerading as principles. To build a theory that survives contact with reality, you need a specification that forces trade-offs into the open rather than hiding them behind "common sense."

  Here is the spec for a theory of the franchise, followed by the stress test of your "Stake Gradient" idea.

  ### Part 1: The Desiderata Spec

  A serious theory of the franchise must explicitly address the following three categories. I have marked each requirement as **Non-Negotiable** (a theory fails without it) or **Contingent** (a theory can reject this, but must justify why).

  #### A. The Edge Cases (Extensional Adequacy)
  A theory fails if it yields morally abhorrent or logically incoherent results in these specific scenarios.

  1.  **The Long-Term Resident (Green Card Holder):**
      *   *The Case:* A non-citizen pays taxes, obeys laws, raises kids, and will die in the city.
      *   *Requirement:* The theory must explain why citizenship status matters more than subjection to law.
      *   *Status:* **Contingent.** Many theories exclude them, but a "All-Subjected" principle includes them. If your theory excludes them, it must argue that *membership* (citizenship) trumps *subjection* (law).
  2.  **The Perpetual Expat:**
      *   *The Case:* A citizen born there, left at age 3, never returns, pays no taxes, obeys no laws, but retains passport.
      *   *Requirement:* The theory must explain why a symbolic tie outweighs actual impact.
      *   *Status:* **Contingent.** Current law includes them. A "Stake" theory excludes them. You must choose between *legal status* and *actual interest*.
  3.  **The Cognitively Disabled:**
      *   *The Case:* An adult citizen with severe cognitive impairment who cannot understand the ballot.
      *   *Requirement:* The theory must reconcile universal suffrage with the concept of *agency*. If voting requires understanding, they are out. If voting is a right of presence, they are in.
      *   *Status:* **Non-Negotiable (Inclusion).** In modern democratic theory, excluding based on capacity is viewed as eugenic or discriminatory. A theory that excludes them must carry a massive burden of proof.
  4.  **The Prisoner:**
      *   *The Case:* A citizen convicted of a felony, temporarily removed from society.
      *   *Requirement:* The theory must decide if voting is a privilege of good behavior or a right of personhood.
      *   *Status:* **Contingent.** Varies wildly by jurisdiction.
  5.  **The Future-Stakeholder (The 14-Year-Old):**
      *   *The Case:* Will live with climate/debt consequences for 70 years; the 75-year-old will not.
      *   *Requirement:* The theory must account for *temporal* stake, not just *current* stake.
      *   *Status:* **Non-Negotiable.** Ignoring intergenerational justice renders the theory myopic.
  6.  **The Tourist/Short-Term Worker:**
      *   *The Case:* Subject to local laws (don't murder, pay sales tax) for two weeks.
      *   *Requirement:* The theory must distinguish between *transient subjection* and *resident subjection*.
      *   *Status:* **Non-Negotiable (Exclusion).** If your theory gives tourists a vote, it is practically unworkable. It must find a cutoff for "sufficient duration."

  #### B. The Conceptual Distinctions (Intensional Clarity)
  A theory fails if it conflates these distinct concepts.

  1.  **Vote vs. Weight:**
      *   *The Distinction:* Having a say (binary) vs. how much the say counts (scalar).
      *   *Requirement:* You must specify if you are arguing for *access* to the ballot or *power* of the ballot.
      *   *Status:* **Non-Negotiable.** Standard democracy assumes binary access, equal weight. If you argue for weighted votes, you are proposing a different system (plural voting).
  2.  **Entitlement vs. Prudence:**
      *   *The Distinction:* "I have a right to vote" vs. "It is wise for me to vote."
      *   *Requirement:* The theory must not confuse *capacity to vote well* with *right to vote*.
      *   *Status:* **Non-Negotiable.** Paternalism (denying votes because people vote "badly") is generally rejected in liberal theory.
  3.  **Membership vs. Subjection:**
      *   *The Distinction:* Being part of the "People" (citizenship) vs. being under the thumb of the State (jurisdiction).
      *   *Requirement:* You must pick your foundational unit. Is the polity a club or a government?
      *   *Status:* **Non-Negotiable.** You cannot have it both ways without contradiction.
  4.  **Vote vs. Office:**
      *   *The Distinction:* Choosing leaders vs. Being a leader.
      *   *Requirement:* The bar for holding office can be higher than the bar for voting.
      *   *Status:* **Non-Negotiable.** Almost no theory demands 16-year-olds be eligible for Mayor if they can vote for Mayor.

  #### C. The Normative Hierarchy
  Which requirements trump others?

  1.  **Political Equality (One Person, One Vote):**
      *   *Status:* **Non-Negotiable** in standard liberal democracy.
      *   *Argument:* Moral worth is equal; therefore, political power must be equal.
  2.  **Proportionality of Interest:**
      *   *Status:* **Contingent.**
      *   *Argument:* Those who have more to lose should have more to say. (This is the core of your Stake Gradient).
  3.  **Competence/Capacity:**
      *   *Status:* **Non-Negotiable (with caveats).**
      *   *Argument:* Voting is an act of will; if will is absent, the vote is a nullity or a proxy.

  ---

  ### Part 2: Stress-Testing the "Stake Gradient"

  Your idea is that the claim to a vote scales with **years of future exposure**. This is a variation of the "All-Affected Interests" principle, but temporalized. Here is how it breaks against the spec.

  #### 1. Does it violate a desideratum that usual views satisfy?
  **Yes. It violates Political Equality (One Person, One Vote).**
  Standard views (flat age cutoff, citizenship) preserve the idea that once you are "in," your vote counts the same as everyone else's. The Stake Gradient implies that a 15-year-old's vote *should* count more than a 75-year-old's.
  *   **The Consequence:** If you take the gradient seriously, you are forced toward **weighted voting**. If the 15-year-old has 65 years of stake and the 75-year-old has 5 years of stake, equality is a lie.
  *   **The Workaround:** You can avoid weighted voting by using the Gradient only to set the **Threshold**, not the **Weight**. You argue that the Gradient determines *when* you get the vote (e.g., stake becomes "sufficient" at 16), but once you have it, it is equal.
      *   *Critique:* This creates a cliff edge. Why is the day after your 16th birthday your stake suddenly equal to a 40-year-old's? You lose the nuance of the gradient to save the practicality of the ballot.

  #### 2. Does it handle the Edge Cases?
  *   **14-Year-Old/Climate:** **Passes.** This is the Gradient's strongest point. It captures intergenerational justice better than any other model.
  *   **Permanent Residents:** **Passes.** If they intend to stay, their future stake is high.
  *   **Expat Citizens:** **Fails.** If they never return, their future stake is zero. The Gradient disenfranchises them. (You must decide if this is a feature or a bug).
  *   **Tourists:** **Passes.** Their future stake is low.
  *   **Cognitively Disabled:** **Fails/Undefined.** A disabled person may have high future stake but low capacity. The Gradient does not solve the capacity problem; it ignores it. You still need a separate capacity clause.
  *   **Prisoners:** **Mixed.** Depends on sentence length vs. life expectancy. A life sentence prisoner has low future stake in the community.

  #### 3. Does it force fractional/proxy votes?
  **Logically, Yes. Practically, No.**
  *   **The Logic:** If the *claim* is a gradient, the *power* should be a gradient. To be consistent, a 16-year-old should have 1.0 vote, a 20-year-old 0.8, a 70-year-old 0.2. Or, parents should hold proxy votes for children (Demeny voting).
  *   **The Practice:** Weighted votes are administratively nightmarish and violate the norm of civic equality.
  *   **The Solution:** You can argue for the **Stake Gradient as a Justification for Lowering the Age**, without demanding weighted votes. You argue that the *current* cutoff (18) is arbitrary because it ignores the gradient. You lower the cutoff to where the stake becomes "significant enough" (e.g., 16), but keep the vote binary. This sacrifices theoretical purity for institutional stability.

  ---

  ### Part 3: The Incompatible Pair

  If you want the core tension of your paper, build it here.

  **The Pair:** **Political Equality (One Person, One Vote)** vs. **Proportionality of Stake.**

  *   **Why they conflict:** If people have different stakes in an outcome (which they do, by age, wealth, residency), then giving them equal votes means ignoring the difference in stake. If you respect the difference in stake, you must give unequal votes.
  *   **The Trade-off:** You cannot maximize both.
      *   Standard Democracy maximizes **Equality** and ignores **Stake Proportionality** (assuming stakes are roughly equal or that equality is more important).
      *   Your Stake Gradient maximizes **Stake Proportionality** and sacrifices **Equality**.
  *   **The Paper Hook:** Argue that for *long-term decisions* (climate, debt, zoning), Equality is the wrong metric. For *immediate decisions* (war, criminal justice), Equality is the right metric. Or, argue that we must accept some inequality of weight to prevent tyranny of the old over the young.

  ---

  ### Part 4: The Most Exclusionary Desideratum

  **Competence / Capacity.**

  *   **Why:** This is the single filter that rules out the most standard positions.
      *   It is the only justification for excluding children (age cutoffs are proxies for capacity).
      *   It is the historical justification for excluding women, the poor, and the disabled (argued as "lacking reason").
      *   It is the barrier to your Stake Gradient: A 5-year-old has high future stake but low capacity.
  *   **The Trap:** If you define Capacity strictly (must understand economics), you lose universal suffrage. If you define it loosely (must be breathing), you lose the argument against giving 5-year-olds votes.
  *   **Your Move:** Your paper must define Capacity. Is it *cognitive understanding* or *interest representation*? If it's the latter, parents can represent kids. If it's the former, kids are out.

  ---

  ### Part 5: Practical Application (Your City Council Question)

  You want to decide if your city should let 16-year-olds and Green Card holders vote. Here is how the Spec applies:

  **1. Green Card Holders:**
  *   **Test:** Apply the **All-Subjected Principle** (Subjection > Membership).
  *   **Verdict:** **Yes.** They pay taxes, obey laws, and use services. The "Citizenship" requirement is a Contingent desideratum, not Non-Negotiable. At a *municipal* level, the argument for "National Membership" is weak. The argument for "Local Subjection" is strong.
  *   **Desideratum Met:** Long-Term Resident case.

  **2. 16-Year-Olds:**
  *   **Test:** Apply the **Stake Gradient** + **Capacity**.
  *   **Verdict:** **Yes, but...**
      *   *Stake:* High. They live with school policy, zoning, and climate decisions longer than seniors.
      *   *Capacity:* This is the hurdle. You must argue that at 16, *political capacity* is sufficient, even if *life experience* is not.
      *   *Weight:* Do not argue for weighted votes. Argue that 16 is the point where the Gradient crosses the "Threshold of Sufficiency."
  *   **Desideratum Met:** Future-Stakeholder case.

  ### Summary Advice for the Paper

  1.  **Don't hide the trade-off.** Admit that the Stake Gradient violates strict Political Equality. Argue that *Intergenerational Equity* is a higher value than *Synchronic Equality* (equality among people alive right now).
  2.  **Separate Capacity from Stake.** Your Gradient solves the "Why 18?" question, but it doesn't solve the "Why not 5?" question. You need a separate capacity floor (e.g., "Stake matters, but you must be able to cast a ballot").
  3.  **Focus on the Incompatible Pair.** The tension between **Equality** and **Stake** is where the philosophy lives. If you resolve that, you resolve the voting age.
  4.  **Practicality Check:** If you propose weighted votes, the city council will laugh. If you propose lowering the age to 16 based on stake, they might listen. Use the Gradient as the *justification for the threshold*, not the *mechanism of counting*.

  This spec gives you the architecture. The Stake Gradient is a strong beam, but it cannot hold the whole roof unless you brace it against the Capacity objection.
