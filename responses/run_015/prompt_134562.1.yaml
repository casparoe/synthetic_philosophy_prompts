  # Institutional Decision Protocol: The Joint Milestone Escrow (JME)

  ## 1. Protocol Specification

  **Context:** A fixed-price development contract between a **Client (P1)** and a **Contractor (P2)**.
  **Structure:** Three decision nodes representing project phases.
  **Mechanism:** Staged Reputation Escrow.

  ### The Game Tree (3 Nodes)
  *   **Node 1 (Client):** Decide to **Fund Phase 1** (Continue) or **Cancel Contract** (Stop).
  *   **Node 2 (Contractor):** Decide to **Deliver Phase 2** (Continue) or **Walk Away** (Stop).
  *   **Node 3 (Client):** Decide to **Accept Final** (Continue/Terminal) or **Reject Final** (Stop).

  ### Payoff Structure (Base Project Value)
  *These values represent the intrinsic net value of the project state to each party, excluding escrow.*
  *   **If Stop at Node 1:** Client saves capital ($10), Contractor gets nothing ($0).
  *   **If Stop at Node 2:** Client has partial asset ($5), Contractor recovers costs + margin ($15).
  *   **If Stop at Node 3:** Client has rejected asset ($20), Contractor has expended max effort ($10).
  *   **If Terminal (Node 3 Continue):** Client has finished product ($25), Contractor has full payment ($25).

  *Note on Standard Centipede Logic:* In a standard setup, the "Stop" payoff at the final node is typically structured to be locally superior to "Continue" for the actor to trigger the unraveling. Here, we align with that: At Node 3, the Client prefers Reject ($20 cost saved vs $25 payment? No, let's align with standard Centipede incentives).
  *Correction for Centipede Logic:* To trigger Backward Induction (BI) defection, the actor at the last node must prefer *taking* the current pot over *passing* it.
  *   **Revised Base Payoffs (Net Utility):**
      *   **Node 1 Stop:** P1=$10, P2=$0.
      *   **Node 2 Stop:** P1=$5, P2=$15.
      *   **Node 3 Stop:** P1=$20, P2=$10. (Client rejects to save money).
      *   **Node 3 Terminal:** P1=$15, P2=$25. (Client accepts, pays Contractor).
      *   *BI Trigger:* At Node 3, P1 prefers Stop ($20) over Terminal ($15).

  ### The Escrow Modification
  1.  **Deposit:** Upon signing, Client deposits **$30** into a Neutral Escrow Agent.
  2.  **Vesting Rule:** The $30 is released *only* if the **Terminal Node** is reached (Node 3 Continue).
  3.  **Forfeiture Rule:** If *either* party chooses **Stop** at Node 1, 2, or 3, the Escrow ($30) is forfeited to an **Industry Charity**. It is *not* paid to the opposing player.
  4.  **Distribution:** If Terminal is reached, Escrow is split ($15 to P1, $15 to P2).

  ---

  ## 2. Rational-Choice Reasoning

  ### A. Standard Version (Direct Transfer)
  *Assumption: Payoffs are realized immediately at the decision node. Common Knowledge of Rationality (CKR) applies.*

  1.  **Node 3 (Client):**
      *   Choice: **Stop** (Payoff $20) vs. **Terminal** (Payoff $15).
      *   Reasoning: $20 > $15. A rational Client rejects the final deliverable to save costs.
      *   Action: **Stop**.
  2.  **Node 2 (Contractor):**
      *   Choice: **Stop** (Payoff $15) vs. **Continue** (Leads to Node 3 Stop → Payoff $10).
      *   Reasoning: Contractor knows Client will Stop at Node 3. $15 > $10.
      *   Action: **Stop** (Walk Away).
  3.  **Node 1 (Client):**
      *   Choice: **Stop** (Payoff $10) vs. **Continue** (Leads to Node 2 Stop → Payoff $5).
      *   Reasoning: Client knows Contractor will Stop at Node 2. $10 > $5.
      *   Action: **Stop** (Cancel Contract).
  *   **Outcome:** Project cancels immediately. Payoffs: ($10, $0).

  ### B. Modified Version (Staged Reputation Escrow)
  *Assumption: CKR applies. Payoffs include Base Value + Escrow Share (if vested).*

  1.  **Node 3 (Client):**
      *   Choice: **Stop** (Base $20 + Escrow $0) vs. **Terminal** (Base $15 + Escrow $15).
      *   Calculation: Stop = $20. Terminal = $30.
      *   Reasoning: $30 > $20. The loss of the escrow share ($15) outweighs the base savings ($5).
      *   Action: **Terminal** (Accept Final).
  2.  **Node 2 (Contractor):**
      *   Choice: **Stop** (Base $15 + Escrow $0) vs. **Continue** (Leads to Node 3 Terminal → Base $25 + Escrow $15).
      *   Calculation: Stop = $15. Continue = $40.
      *   Reasoning: Contractor knows Client will choose Terminal at Node 3. $40 > $15.
      *   Action: **Continue** (Deliver Phase 2).
  3.  **Node 1 (Client):**
      *   Choice: **Stop** (Base $10 + Escrow $0) vs. **Continue** (Leads to Node 2 Continue → Base $15 + Escrow $15).
      *   Calculation: Stop = $10. Continue = $30.
      *   Reasoning: Client knows Contractor will Continue at Node 2. $30 > $10.
      *   Action: **Continue** (Fund Phase 1).
  *   **Outcome:** Project reaches completion. Payoffs: ($30, $40).

  ---

  ## 3. Analysis of the Induction Chain

  ### The Severing Feature: Decoupling of Accrual and Vesting
  The specific feature that blocks backward induction is the **non-severability of accrued value**.

  In the **Standard Version**, the payoff structure assumes **Immediate Vesting**. When a player chooses "Stop" at Node $t$, they unilaterally secure the utility associated with that node. Backward induction relies on this certainty: "If I pass, I risk the other player securing the next node's value for themselves."

  In the **Modified Version**, the Escrow Protocol introduces **Conditional Vesting**. Accrued value (the Escrow) exists at Node 1 and Node 2, but it is *institutionally inaccessible* until Node 3.
  *   **Why this severs the chain:** Backward induction calculates the value of "Continue" based on the *next* node's optimal play. However, the Escrow rule modifies the value of "Stop" at *every* node by imposing a penalty (forfeiture) that is contingent on the *final* node.
  *   **CKR Preservation:** This does not violate Common Knowledge of Rationality. Both players know the rules. Both players know the other is rational. The rational calculation simply yields a different result because the *utility function* at Node 3 has been structurally augmented by the institutional rule, not by a change in preference.

  ### Ordinal Payoff Ranking Constraint
  The prompt requires not altering the **ordinal payoff ranking at the final node**.
  *   **Base Project Ranking:** At Node 3, the Client *intrinsically* values "Reject" ($20) higher than "Accept" ($15). This ranking is **unchanged**. The physical asset and cost savings remain identical.
  *   **Institutional Ranking:** The *total* utility ranking flips ($30 > $20) due to the external Escrow incentive.
  *   **Distinction:** The paradox is blocked not by changing the *project physics* (which would be unrealistic), but by changing the *property rights* over the surplus. The induction chain breaks because the "Stop" action no longer guarantees the capture of accrued surplus; it destroys it.

  ### Collapse Condition
  If the **Forfeiture Rule** is removed (i.e., if either party defects early, the Escrow is returned to the Client or paid to the Contractor), the case collapses back into the standard paradox.
  *   *Example:* If Client Stops at Node 3 and keeps the Escrow, Terminal = $30, Stop = $50. Client Stops. Induction unravels.
  *   *Conclusion:* The cooperation is entirely dependent on the **external penalty** (Charity Forfeiture) making defection costly.

  ---

  ## 4. Honest Limitation: What This Fails to Reproduce

  A defender of Backward Induction might invoke the **problem of enforceable commitment** to preserve the paradox's practical relevance.

  **The Limitation:** This protocol assumes the "Charity Forfeiture" is perfectly enforceable and costless. In the real world, a Client at Node 3 might attempt to **renegotiate** the Escrow terms, threatening to litigate rather than Accept. If the Contractor believes the Client can *credibly threaten* to bypass the Escrow agent (e.g., via bankruptcy or legal delay), the "Forfeiture" becomes uncertain.

  **Why BI Defenders Win Here:** Backward Induction assumes players can maximize utility given the *actual* constraints. If the institutional mechanism (Escrow) is not perfectly rigid—if there is any probability $p$ that the Client can seize the Escrow upon Rejection—then the expected utility of "Terminal" drops.
  *   If $p$ is high enough, $E[\text{Terminal}] < \text{Stop}$.
  *   The induction chain re-engages.

  **Conclusion:** This thought experiment demonstrates that Backward Induction is not a law of physics, but a consequence of **payoff transparency and vesting rules**. It survives only as long as the institutional structure prevents unilateral capture of intermediate value. It fails to explain cooperation in environments where contracts are incomplete or enforcement is costly—precisely where the Centipede Paradox is most often observed in practice.
