answer: |-
  You are not merely rationalising; you have stumbled upon a fairly robust ethical framework, often discussed in political philosophy under the banner of **integrity as consistency between agency and accountability**. Your intuitions are tracking a specific distinction between *systemic subversion* and *systemic correction*.

  Here is an attempt to codify the principle you are grasping for, followed by the verdict on the pharmacist, and finally, the honest audit of which of your existing verdicts might not survive scrutiny.

  ### The Principle: Fiduciary Integrity and Accountable Dissent

  Your verdicts seem to rely on two pillars:
  1.  **Fiduciary Duty:** When you occupy a role within a system (driver, accountant, civil servant, pharmacist), you are a trustee of that system's rules. You cannot secretly undermine the mechanism you are paid to operate.
  2.  **The Cost of Conscience:** Moral dissent is virtuous only when the dissenter accepts the consequences of breaking the social contract. If you break a rule to satisfy your conscience, you must pay the penalty. If you wish to keep the benefits of the system (salary, protection, order), you must follow the rules or find a way to correct them that does not involve secret subversion.

  This explains why Case 2 (Open dissent, accepts firing) is virtuous, while Case 3 (Secret dissent, keeps job) is corrupt. Case 2 restores trust through sacrifice; Case 3 erodes trust through deception.

  ### The Pharmacist Case

  Applying this principle to your pharmacist scenario yields a clear, albeit harsh, verdict.

  **The Verdict: Wrong.**

  This is a direct parallel to Case 3 (the accountant fudging numbers).
  *   **Fiduciary Breach:** The pharmacist is an agent in a triad: doctor, patient, dispenser. By secretly substituting the medication, they bypass the doctor's authority and the patient's consent. They are subverting the mechanism they are employed to operate.
  *   **Avoidance of Cost:** The pharmacist avoids the conflict. To act conscientiously, they ought to refuse to dispense the brand (risking their job or a confrontation) or persuade the doctor/patient openly. By doing it secretly, they deny the other parties their agency to decide on the financial trade-off.
  *   **Paternalism:** Even if the pharmacist is correct that the brand is financially harmful, they have no mandate to make that calculation for the patient. This is not conscience; it is unauthorised governance.

  Under your own framework, this is cowardly and wrong. It creates a world where professionals quietly rewrite the rules to suit their own moral calculus, rendering the system unpredictable.

  ### The Honest Audit: Which Verdict Must Go?

  You asked which of your five original verdicts a decent principle has to drop. To make your framework truly coherent, you have a tension between **Case 2** and **Case 4**.

  **The Conflict:**
  *   In **Case 2**, you value the accountant *because* she is open and suffers the consequence (fired). The virtue lies in the sacrifice.
  *   In **Case 4**, you value the civil servant *despite* her anonymity. She preserves her job and safety while exposing the harm.

  If the principle is "Conscience requires costly visibility" (derived from Case 2 vs. Case 3), then **Case 4 is morally ambiguous, not "quite good."** Anonymous whistleblowing is pragmatically effective, but it lacks the moral courage of Case 2. It allows the actor to have it both ways: the moral superiority of dissent without the penalty of disobedience.

  To be consistent with your admiration for the accountant in Case 2, you ought to view the civil servant in Case 4 as *less* virtuous. She is protecting herself first. A strict principle of integrity would demand she sign the letter or resign in protest (like Case 2).

  **Alternatively, you might have to drop Case 1.**
  If the principle is "Rules provide predictability and must be followed unless one is willing to break them openly," then the bus driver is actually *right*. He is maintaining the schedule (the system's goal). By letting the passenger on, he bends the rule for emotional reasons, which introduces unpredictability. Your gut says he's wrong because of *humanity*, but your principle suggests he's right because of *order*. You cannot have a principle that demands strict rule-following (Case 4) but punishes it when it lacks human warmth (Case 1).

  **My Advice:**
  The most defensible position is to downgrade your verdict on **Case 4**. Acknowledge that while anonymous whistleblowing is better than silence, it is not as morally praiseworthy as open dissent. It is a pragmatic compromise, not a virtue. This aligns it better with the distinction between Case 2 (Virtuous) and Case 3 (Vicious).

  ### A Note on Case 5
  There is a smaller logical slip in Case 5. You condemn the parent for expecting police protection. However, police protection is a **non-excludable public good**. She cannot opt out of it even if she wanted to; the police will still investigate if her house is burgled. The free-rider charge only sticks if she refuses to *pay taxes* for that protection. If she pays taxes but dislikes the school curriculum, she is not a free-rider; she is a dissenter within the system. Your verdict holds, but the reasoning regarding the police is slightly flawed.

  ### Summary
  Your intuition is sound. You value **transparency** and **ownership of consequences**.
  *   **Pharmacist:** Wrong (Secret subversion).
  *   **Principle Adjustment:** Admit that Case 4 (Anonymous) is morally inferior to Case 2 (Open), even if the outcome is similar. Courage costs something; if it doesn't cost the actor, it is less virtuous.

  You are not rationalising; you are constructing a deontology of integrity. Just ensure you don't let pragmatism (Case 4) masquerade as virtue (Case 2).
