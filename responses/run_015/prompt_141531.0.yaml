answer: |-
  ### I. The Implicit Theory of the Disciplined Party

  The institution of the whipped vote rests on a specific, often unarticulated, political ontology. To reconstruct the implicit theory, we must ask what must be true about the world and the mind for party discipline to be rational and legitimate.

  **1. The Relation Between Winning and Being Right**
  The disciplined party strictly presupposes that **political legitimacy is derived from the capacity to act, not solely from the correctness of the decision.** It operates on a theory of *mandate implementation* rather than *parliamentary discovery*. In this view, the "truth" of policy is determined electorally (when the platform is endorsed) rather than legislatively (when the bill is debated). Therefore, disagreement within the legislature is not an opportunity for inquiry but a threat to the execution of the mandate. This implies that political disagreement is often not answerable to further inquiry in a way that would convince a rational opponent; if it were, whipping would be unnecessary. Consequently, the practice presupposes that **coordination and the delivery of a promised programme matter more than getting the specific answer right** in the moment. Stability and predictability are valued over optimality.

  **2. Collective Judgment and Epistemic Deference**
  Can a defender give discipline an epistemic footing? Yes, but only under a specific model of **cognitive division of labor**.
  *   **The Argument:** An individual legislator cannot master the details of every bill. The party machinery (researchers, shadow cabinets, experts) aggregates information better than any single member. Therefore, voting the party line is a rational act of epistemic deference, akin to a patient following a doctor's orders or a juror accepting expert testimony.
  *   **The Limit:** This defense works only if the party machinery is truth-tracking. Weil's critique suggests that because the machinery is aimed at *power*, it filters information for tactical advantage rather than truth. Thus, while discipline *can* be epistemically defended, the practice itself does not strictly require it. It requires only that the *appearance* of unity be maintained to signal competence to the electorate.

  **3. Moral Division of Labor**
  The practice strictly requires a view where the **MP's primary moral duty is fidelity to the collective mandate, not independent verification.**
  *   **Strictly Requires:** That the "constituency" the MP serves is the national electorate that chose the party platform, not the local voters who might dislike a specific bill, nor the MP's own conscience. It requires that the "sale of a vote" is criminalized not because the vote belongs to the MP, but because the vote belongs to the *party mandate* which is public property, not private property to be traded.
  *   **Fits Well With:**
      *   *Responsible-Party Government:* This theory fits best. Voters choose between teams; teams must be cohesive to be responsible.
      *   *Pluralist Interest Aggregation:* Parties bundle interests; discipline ensures the bundle holds.
  *   **Philosophically Underdetermined:** The practice does not strictly require a rejection of truth. A party could claim, "We are disciplined because we are right, and we allow no dissent because dissent aids error." It also does not strictly require a Burkean trustee view (MPs as elite judges); in fact, it fits better with a *delegate* model where the MP is an agent of the party manifesto. The tension arises because the *rhetoric* of parliament is Burkean (judgment on the common good), but the *mechanism* is delegatory (follow the whip).

  ### II. Testing Weil's Claim of Structural Corruption

  Simone Weil argues that the corruption of parties is not contingent on bad leaders but is inherent in the *collective mind* of an organization aimed at power. She posits that any such group exerts pressure on the individual intellect, substituting "party truth" for "truth."

  **1. The Redesigned Party**
  Consider the proposal:
  *   **Binding:** Only to general principles.
  *   **Adjudication:** By an independent body of non-members.
  *   **Leadership:** Chosen by lot, single non-renewable term (removing career stakes).

  **2. Does it Escape Weil's Argument?**
  This design mitigates the *personal* incentives for corruption (careerism) and the *tactical* manipulation of principles (independent adjudication). However, it likely fails to escape Weil's deeper structural critique.
  *   **The Collective Ego:** Weil's argument rests on the claim that *any* collective organization with a shared programme and the ambition to govern creates a "collective passion." Even with leaders by lot, the membership constitutes a bloc. To win elections, the bloc must distinguish itself from rivals. This necessitates framing principles in ways that maximize appeal rather than truth.
  *   **The Adjudication Problem:** An independent body adjudicating whether a vote "follows from principles" faces the same problem as a Supreme Court interpreting a Constitution. The interpretation will inevitably become politicized. If the body rules against the party's tactical interests, the party will seek to replace the body or ignore it to survive against rivals.
  *   **The Teleology of Power:** Weil's core insight is that the *aim* of the party is self-preservation and growth (to wield power). As long as the entity exists to *defeat* other entities to implement a program, it will treat its own victory as a precondition for justice. The redesign removes careerism but not the *will to power* inherent in the competitive electoral system. The group will still subordinate truth to victory because defeat means the principles go unimplemented. For Weil, this subordination is the definition of the "party spirit."

  **3. Verdict**
  Weil's argument rests on the claim that **organized collective will is inherently hostile to individual attention to truth.** The redesign fails because it retains the *competitive* nature of party politics. Unless the ambition to govern is removed entirely (e.g., governance by random selection of individuals without platforms), the pressure to conform to the group's strategic needs will re-emerge.

  ### III. Weil's Alternative and the Future of Representation

  **1. Epistemic Presuppositions of Weil's Alternative**
  Weil proposes replacing parties with unorganized, independent judgment. This presupposes a robust **moral and epistemic realism**.
  *   **Convergence:** It requires the view that individuals who attend properly to a question (exercising "attention," in Weil's mystical sense) can converge on the truth without the machinery of organized opinion-formation. It assumes that truth is not socially constructed through negotiation but discovered through individual contemplation.
  *   **Rejection of Coordination Problems:** It assumes that the "cost" of decentralized decision-making (instability, incoherence) is less damaging than the "cost" of party discipline (error, injustice).
  *   **If Epistemology is Rejected:** If one rejects this realism—if one believes truth in politics is impossible, or that coordination problems (Prisoner's Dilemmas) make independent judgment lead to chaos—then Weil's critique collapses. Discipline becomes a necessary evil not for truth, but for *function*. If there is no "right answer" to tax rates, only competing interests, then parties are necessary tools for aggregation, not machines of error.

  **2. Concrete Changes in a Working Legislature**
  If parties were abolished in line with Weil's vision:
  *   **No Whips:** Voting would be entirely free. Legislation would pass based on ad-hoc coalitions formed per bill.
  *   **Committee Structure:** Committees could not be stacked by party quota. They would be formed by lot or by declared expertise, breaking the link between committee power and electoral strength.
  *   **Executive Formation:** The most radical change. In parliamentary systems, the Executive is the leadership of the majority party. Without parties, there is no "majority." The Prime Minister/Chancellor would likely need to be directly elected by the populace or chosen by the legislature via a non-partisan confidence vote for a specific programme, subject to immediate recall if they deviate.
  *   **Ballot Structure:** Ballots would list names and local affiliations, not party logos. Campaigns would be localized.

  **3. Is Electoral Representation Left?**
  *   **What Remains:** Geographic representation remains. The legislator is still accountable to a constituency for their personal conduct and local advocacy.
  *   **What Vanishes:** "Mandate representation" vanishes. Voters can no longer vote for a "government" or a "policy direction" in the aggregate. They cannot throw the "rascals" out as a team.
  *   **Recognizability:** It would cease to be recognizable as *parliamentary* democracy in the Westminster sense. It would resemble a hybrid of the pre-partisan US Congress and a sortition-based assembly.
  *   **The Risk:** Without parties to aggregate interests and stabilize coalitions, the legislature might become paralyzed or dominated by charismatic populists who can build temporary majorities through rhetoric rather than platform. Weil accepts this risk, believing that truth emerges from silence and attention, not from the "noise" of organized campaigning.

  **Conclusion**
  The disciplined party strictly presupposes that political action requires a unity that truth-seeking does not naturally provide. It privileges the *capacity to govern* over the *accuracy of the decision*. Weil's critique holds that this privilege is inherently corrupting because it turns the collective will into an idol. Her alternative requires a leap of faith in individual moral cognition that modern political science, with its focus on coordination and information asymmetry, finds difficult to sustain. To abolish parties is not merely to change the rules of the legislature; it is to change the epistemology of democracy from one of *aggregation and compromise* to one of *discovery and attention*. Whether representation survives depends on whether we define it as the transmission of local interests or the selection of a governing team. Under Weil's model, only the former remains.
