answer: |-
  **The Nietzschean Triage Protocol**

  **Step 1: The Vitality Check**
  Does this object serve the living community's future, or merely burden it with dead weight?
  *   **STOP:** If it burdens without serving life → **Let Lapse/Deaccession.**
  *   **Proceed:** If it serves life.

  **Step 2: Mode Assignment**
  Classify the primary service: **Monumental** (inspires action), **Antiquarian** (preserves origin/belonging), **Critical** (enables judgment/justice), or **Future Claim** (evidence for unknown legal/moral needs).
  *   **STOP:** If **Future Claim** → **Acquire and Preserve** (restricted access).
  *   **HAND-OFF:** If multiple conflicting modes apply (e.g., Antiquarian origin vs. Critical indictment) → **Full Board Vote.**
  *   **Proceed:** If single mode.

  **Step 3: The Digestion Test (Plastic Power)**
  Do we have the strength to incorporate this without being poisoned by pride (Monumental/Antiquarian) or paralysis (Critical)?
  *   **STOP:** If no → **Restrict** (seal for term) or **Memorialize** (with heavy context).
  *   **Proceed:** If yes.

  **Step 4: Disposition**
  Match mode to action: Monumental → **Memorialize**; Antiquarian → **Acquire/Preserve**; Critical → **Acquire/Preserve** (open access).

  ***

  **Worked Proposals**

  **1. The Founder's Ledgers**
  *Analysis:* Step 1 passes (vital record). Step 2 identifies **Antiquarian** (founding payrolls) and **Critical** (strikebreaker list). These conflict: one honors the origin, the indicts it.
  *Decision:* **HAND-OFF** to Full Board. This is a values conflict, not procedural. The Board must weigh whether truth (Critical) outweighs piety (Antiquarian).
  *Outcome:* Acquire and Preserve. The Critical mode dominates because justice serves life better than myth, but access requires contextual annotation to prevent misuse.

  **2. The Sealed Oral History**
  *Analysis:* Step 1 passes (truth serves life). Step 2 identifies **Critical** (correcting the record) vs. **Contractual Trust** (promise of anonymity). Step 3 (Digestion) asks: Can we digest this without breaking faith?
  *Decision:* **STOP** at Step 3. A community cannot incorporate truth built on broken promises; it poisons future testimony.
  *Outcome:* **Restrict.** Seal until the participant's death or a fixed term (e.g., 50 years). The Critical mode must wait until the condition of trust is naturally resolved.

  **3. The Strike Monument**
  *Analysis:* Step 1 (Vitality). You argue it is **Monumental** (inspires labor solidarity). Opponents argue it reopens wounds.
  *Decision:* **STOP** at Step 1. If the community is too divided to incorporate the monument without fracturing, it does not serve *life* currently.
  *Outcome:* **Let Lapse.** A monument that divides the living violates the primary condition. It stalls until the community possesses the plastic power to endure the memory without conflict.

  ***

  **What This Procedure Cannot Do**

  Nietzsche's essay warns that systematizing history risks killing the very "plastic power" it seeks to measure. This checklist cannot quantify the community's soul. It cannot tell you *when* the community is strong enough to digest the ledgers or erect the monument. It treats "Life" as a binary variable, when Nietzsche knows it is a fluctuating force.

  The procedure handles the *logic* of triage, but it cannot generate the *strength* required for the Critical mode. To judge the past requires a vitality that no form can confer. If the community lacks the power to transform its inheritance, this checklist will only tell you "Restrict" or "Lapse" repeatedly, preserving the archive while the town dies. Nietzsche knows that sometimes history must be forgotten to be survived; a checklist only knows how to remember. You must supply the judgment of when forgetting is the healthier act. The protocol protects you from instinct, but it cannot replace the courage required to live with the truth.
