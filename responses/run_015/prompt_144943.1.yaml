answer: |-
  Friends, colleagues, administrators, and supporters of this new venture:

  Welcome to the inaugural symposium of the Institute for Philosophy and Machine Learning.

  Looking out at this room, I see a gathering that is rare in academia. On one side, I see researchers who spend their days probing high-dimensional vector spaces, visualizing feature activations, and designing causal interventions to understand how deep networks process information. On the other, I see philosophers who spend their days analyzing the conditions of intentionality, the nature of misrepresentation, and the functional roles that constitute a mind. And seated among you are the leaders and donors who make this collaboration possible, asking the fundamental question: Why here? Why now?

  The standard answer is that artificial intelligence is becoming powerful enough that we need ethics. That is true, but it is too shallow for this Institute. Ethics rests on ontology. Before we can decide if a system is behaving unfairly, or if it is safe, or if it is accountable, we must decide what kind of thing it is. Specifically, we must answer a question that sounds simple but is structurally ambiguous: Do neural networks have representations?

  To the engineer, this might sound like semantics. You have activation patterns that correlate with inputs and drive outputs. What more is there? To the philosopher, this sounds like the hard problem of content. A state can correlate with a tiger without being about a tiger. To the administrators, this sounds like abstract theory that needs to translate to risk management.

  My argument today is that all three perspectives are correct, because the word representation is doing three distinct jobs in this conversation. We are using one word to track three different phenomena: aboutness, error conditions, and causal function. When we ask if a network represents, we are often asking three different questions at once. Interpretability research often succeeds brilliantly on one dimension while leaving the others untouched. If we do not disentangle these jobs, we will make false promises about safety and dismiss genuine breakthroughs as mere engineering.

  Let us define these three jobs.

  The first job is aboutness. When a state in a system is triggered by a tiger, is it because the state is about the concept of a tiger, or is it about the presence of vertical stripes? This is the problem of content. In human cognition, we assume these usually align. In machine learning, we know they often diverge.

  The second job is licensing error. For a state to be a representation, it must be the kind of thing that can be wrong. If a system activates a tiger-unit when looking at a couch, is that a misrepresentation? Or is it merely a statistical mismatch, like a thermometer breaking in a furnace? Misrepresentation requires normativity—a standard of correctness that goes beyond mere functional failure.

  The third job is causal-functional role. Does the state play a specific role in the processing pipeline? Does manipulating this activation change the output in a predictable way? This is the dimension where engineering methods shine.

  The crisis of understanding arises because these three dimensions can come apart. We can have causal function without clear aboutness. We can have statistical correlation without the capacity for genuine error. The work of this Institute is to map where they come apart and what that means for how we build and govern these systems.

  Let me offer a concrete illustration that I hope will resonate across this room. Consider a standard vision model trained to identify animals. We observe a specific neuron or a direction in activation space that fires strongly when the model sees images of tigers.

  From the perspective of causal function, the story is clear. Using causal interventions, we can clamp this activation to zero, and the model stops predicting tiger. We can amplify it, and the model predicts tiger even on ambiguous inputs. We have established a functional role. This is settled ground. The activation is a lever that controls the classification output. Interpretability tools like feature visualization confirm this by showing that the activation correlates with striped textures.

  Now, consider the dimension of aboutness. What is this activation about? Is it about tigers? Or is it about striped textures? If we show the model a picture of a tiger with no stripes—perhaps a white tiger in snow—the activation might drop. If we show it a couch with striped fabric, the activation might spike.

  If we say the network represents tigers, we are making a claim about content. But the evidence from the functional layer suggests the content might actually be stripes. This is not just a philosophical quibble. If we deploy this system in a wildlife conservation context, and we assume it represents tigers, we might trust it to count populations. But if it actually represents stripes, it will count striped blankets. The engineering success of identifying the lever does not guarantee we know what the lever is connected to in the world.

  This leads to the third dimension: error. Suppose the model sees a striped couch and outputs tiger. Did the system misrepresent the couch as a tiger? Or did it simply execute its function correctly based on a feature it weights heavily?

  For the philosopher, this is the crux of intentionality. A thermometer that reads high in a furnace is not misrepresenting the temperature; it is broken. A human who sees a couch and thinks tiger is misrepresenting reality. The difference lies in the conditions under which the state is supposed to occur. For the engineer, the model is just minimizing loss. If the loss function penalized striped couches during training, the error would vanish. So, is the error a semantic failure or a training deficit?

  If we cannot distinguish between a system that is wrong and a system that is merely operating outside its distribution, we cannot hold it accountable. Accountability requires that the system could have done otherwise, or that it holds a belief that fails to match the world. If the system has no beliefs, only statistical regularities, then our framework for accountability must change. We cannot blame a calculator for adding wrong; we can only blame the designer. But if the system has representations in the robust sense, it may bear a different kind of operational risk.

  This brings me to a crucial requirement for our work together. We must be explicit about what is settled and what is genuinely contested among serious researchers on both sides. There is a temptation to pretend we know more than we do, either to secure funding or to publish papers. We must resist this.

  Here is what is settled. We know that neural networks possess internal states that correlate with external features. We know that manipulating these states causally influences output. We know that these systems generalize in ways that sometimes align with human concepts and sometimes align with superficial textures or statistical artifacts. We know that current interpretability methods can identify these functional levers with increasing precision. No one in this room should dispute that the functional architecture is mapable.

  Here is what is contested. It is contested whether functional role is sufficient for content. Some argue that if a state plays the right causal role, it is a representation. Others argue that without evolutionary history or social usage, there is no aboutness. It is contested whether these systems can misrepresent in a normative sense, or if they only exhibit performance degradation. It is contested whether solving the transparency problem—knowing which neuron does what—solves the understanding problem—knowing what the system means.

  I want to be clear: I am not taking a side today. If I stood here and declared that networks definitely have intentions, I would alienate the engineers who know the math is just linear algebra. If I declared they definitely lack intentions, I would alienate the philosophers who know that human minds are also physical systems. The point of this Institute is not to preach a conclusion. It is to host the collision that produces the conclusion.

  This distinction matters profoundly for our administrators and donors. You are asked to fund this Institute because you understand that technology outpaces regulation. But regulation requires clarity. If we promise that interpretability will solve ethical concerns, we are making a bet that the functional dimension maps cleanly onto the ethical dimension.

  If transparency only tells us which lever controls the output, but not what that lever means, we have not solved the bias problem. We might remove a lever that correlates with race, only to find the system reconstructs that correlation through a different combination of levers that represent zip codes or purchasing habits. If we do not understand the content of the representations, we are playing whack-a-mole with symptoms.

  Conversely, if we dismiss interpretability as mere engineering, we risk ignoring the only tools we have to inspect the system. Philosophy without empirical grounding becomes speculation. Engineering without conceptual clarity becomes blind optimization.

  Therefore, the promise of this Institute is not that we will solve alignment next year. The promise is that we will clarify the terms of the problem. We will determine when a transparency tool has actually illuminated the content of a model, and when it has only illuminated its circuitry. We will determine when a failure is a semantic error requiring conceptual repair, and when it is a statistical error requiring more data.

  This requires humility from both sides. The engineers must accept that knowing how a system works is not the same as knowing what it says. The philosophers must accept that theories of mind developed for biological organisms may need radical revision to accommodate silicon substrates. We cannot simply import twentieth-century philosophy of mind and paste it onto twenty-first-century architectures. We may find that neural networks force us to invent a new category of representation—one that is functional and robust, but lacks the normative depth of human belief. Or we may find that human belief is less normative than we thought.

  This is why the ambiguity of representation is not a bug; it is the feature we are here to study.

  To the ML researchers: Do not feel that philosophy is asking you to justify your work in metaphysical terms. It is asking you to recognize that your tools—probing, visualization, causal tracing—are generating data that bears on ancient questions about mind and matter. You are doing experimental philosophy whether you intend to or not.

  To the philosophers: Do not feel that engineering reduces your questions to code. The code is the test bed. Theories of intentionality that cannot survive contact with working systems are merely poetry. You have the opportunity to refine concepts that have been static for decades using dynamic, high-dimensional data.

  To the administrators and donors: You are supporting a foundational inquiry. Just as we needed physics to understand the atom before we could build the reactor, we need this conceptual clarity before we can safely deploy autonomous systems at scale. The risk is not just that the systems fail. The risk is that we misunderstand what failure means in this context.

  In conclusion, let us commit to a rigorous separation of these three jobs. When we speak of representation, let us ask: Are we talking about what it tracks? Are we talking about how it can be wrong? Or are we talking about what it does?

  If we can keep these distinct, we will avoid the confusion that currently plagues public discourse on AI. We will not claim that making a model transparent makes it safe, unless we know which dimension of representation transparency addresses. We will not claim that models are mindless calculators, unless we know that functional role is insufficient for content.

  We are building a language to describe the new minds we are creating. Let us ensure that language is precise enough to hold the weight of the responsibilities we are about to undertake.

  Thank you.
