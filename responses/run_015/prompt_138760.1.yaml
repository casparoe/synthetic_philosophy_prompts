  Sign the **Baroque Alternative**, but with the amendment from the "Overturned" section regarding Case 2.
  *   **Why:** The "Clean" principle is too rigid; it fails to capture why the Carpenter (V7) might actually do better (top-down processing aids bottom-up calibration) and why you felt V2 was plausible (the intuition that *doing* is easier than *saying* is phenomenologically robust, even if the specific "cube vs sphere" discrimination is overstated).
