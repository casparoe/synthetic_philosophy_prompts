answer: |-
  The rulebook lay open on the table, a thickening stack of printed sheets held together by a binder clip that had long since lost its spring. It was Tuesday, the usual night, but the pizza had gone cold and no one was eating.

  "It's not about what we want," Elias said, tapping the page marked *Proposal 44*. "It's about what happened. We voted. Four of us, three in favour. That's a majority. The rule passed."

  "The rule *purported* to pass," Marcus corrected. He was sitting with his arms crossed, leaning back in his chair as if trying to distance himself from the table's gravity. "You cannot use a key to open a lock if the key was forged using a machine the lock itself forbids. Rule 1 requires unanimity for changes to the amendment procedure. Proposal 44 changed the amendment procedure. You didn't have unanimity. Therefore, Proposal 44 is null."

  Sarah, sitting next to Elias, rubbed her temples. "But if Proposal 44 is null, then Rule 1 stands. And if Rule 1 stands, we need unanimity to change it. But if we need unanimity to change it, we can never get out of this loop unless Marcus agrees to let us out, which he won't."

  "I'm not protecting myself," Marcus said. "I'm protecting the game. If we allow a majority to override an entrenched clause, the entrenchment means nothing. The constitution is just whatever the majority said five minutes ago."

  "Then it's not a game," Jenny said quietly. She had been tracing the rim of her wine glass. "It's a prison."

  "Okay," Elias said, leaning forward. He picked up a pen. "We need a tie-breaker. We're stuck on the interpretation of validity. So we legislate clarity. I propose Rule 45: *In the event of a conflict between procedural rules, the rule most recently passed takes precedence.*"

  He looked around. "If we pass that, it settles it. 44 is newer than 1. 44 wins. We move on."

  "By what vote?" Marcus asked.

  "Majority," Elias said. "Under the current operating assumption of 44."

  "Objection," Marcus said. "You are using the authority of 44 to validate 45, which validates 44. That's circular. If 1 is still in force, you need unanimity to pass 45."

  "Fine," Sarah snapped. "Then we vote on the voting threshold first. Proposal 46: *The threshold for passing Proposal 45 is Simple Majority.*"

  Marcus shook his head. "And what threshold do we use to pass 46?"

  "Majority!" Elias said, his voice rising.

  "Unanimity," Marcus countered.

  They sat in the silence that followed. It was a heavy, structural silence, as if the walls of the room were made of the logic they were trapped inside.

  Jenny reached for the binder. She flipped back to the first page, the original contract they had signed six months ago. "We're trying to build a ladder to get out of a hole, but we're standing on the rungs we're trying to install."

  "So what do we do?" Sarah asked. "We can't play. Every move is illegal depending on who you ask."

  "We adjudicate," Elias said. "We appoint a judge. Proposal 47: *Elias is granted temporary dictatorial powers to resolve the validity of 44.*"

  "Seconded," Sarah said.

  "Objection," Marcus said. "You can't delegate authority you don't possess. If the majority rule is invalid, you have no power to appoint a dictator. If it is valid, you don't need one."

  "It's a pragmatic solution!"

  "It's a coup," Marcus said.

  Jenny closed the binder. The sound was sharp in the quiet room. "He's right, Elias. If we vote on 47 by majority, Marcus will say it's void. If we vote by unanimity, Marcus will veto it to preserve the principle. We are reproducing the conflict at every level. It's not just a stalemate. It's a recursion."

  She stood up and walked to the kitchen counter. She opened a drawer and rummaged through the junk—takeout menus, rubber bands, pens. She came back with a quarter.

  "What's that?" Sarah asked.

  "A decision engine," Jenny said. She placed the coin on the table. It gleamed under the overhead light, dull and metallic, utterly indifferent to the binder clip and the printed pages.

  "You want to flip for it?" Elias asked. "That's not in the rules."

  "Exactly," Jenny said. "The rules are broken. The system cannot verify its own consistency. Gödel told us that. We're just finding out why it hurts."

  "If we flip it," Marcus said, eyeing the coin suspiciously, "we are acknowledging that the rules no longer govern us."

  "The rules haven't governed us for three weeks," Jenny said. "We've just been pretending they do while we shout at the text. Heads, we accept Proposal 44 and the majority rule. Tails, we revert to Rule 1 and unanimity. We bind ourselves to the outcome."

  "That's extra-legal," Marcus said.

  "Yes."

  "It undermines the sanctity of the Codex."

  "The Codex is a paperweight until we fix this," Jenny said. She looked at him, her expression tired but steady. "Do you want to be right about the rules, or do you want to play the game?"

  Marcus looked at the coin. He looked at Elias, whose pen was poised over the sheet for Proposal 47, trembling slightly. He looked at Sarah, who was staring at the cold pizza.

  "If I agree to this," Marcus said slowly, "I am not conceding that the majority was correct. I am conceding that the system has failed."

  "Recorded," Jenny said.

  "And we amend the Codex to reflect that the coin toss occurred?"

  "No," Jenny said. "We don't record it. If we write it down, it becomes a rule. And then we'll need a rule to interpret the rule of the toss."

  She flicked her thumb. The coin spun into the air, a blur of silver. It caught the light, a momentary star in the dim room, before falling. She slapped her hand over it on the laminate table surface.

  The four of them leaned in. The air felt thin, as if they were waiting for a verdict from a court that didn't exist.

  Jenny lifted her hand.

  It was heads.

  Elias let out a breath he seemed to have been holding for a month. Marcus sat back, his shoulders dropping, the tension draining out of him replaced by a strange, hollow resignation.

  "Okay," Marcus said. "So. Proposal 44 stands."

  "Proposal 44 stands," Elias confirmed. He picked up the pen and drew a line through Rule 1.

  He didn't write down the coin toss. He just wrote the new rule, his handwriting shaky, knowing that the authority for the ink came from the metal disc now sitting cold on the table, outside the book, outside the game, the only thing in the room that wasn't lying.

  "Next proposal?" Sarah asked, her voice small.

  "Motion to adjourn," Jenny said.

  "Seconded."

  "Passed," Elias said.

  They didn't vote. They just stood up, leaving the book open on the table, the coin resting on the margin of the page like a period at the end of a sentence that didn't quite make sense.
