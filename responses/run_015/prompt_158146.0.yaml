prompt: |-
  I am in the final year of my linguistics degree and I am taking a seminar on speech act theory, and at the same time I work as one of four paid research assistants on a department project that is building a coded corpus of utterances from university conduct-board hearings and the messages that led up to them. We code about four hundred utterances a week. The coding team is undergraduates with roughly one week of training, and the principal investigator adjudicates disputed items in a weekly meeting. We have a working code set — commissive, directive, assertive, expressive, declaration — but no decision procedure, so our disagreements are currently settled by intuition and the PI's authority, which is exactly what a coding manual is supposed to prevent.

  I would like you to write the procedure itself: the questions a coder asks, in order, when confronted with one utterance in a transcript; what counts as a sufficient answer to each question given only the transcript and a fixed context window; the point at which the procedure stops and returns a definite code; and the point at which it hands the item to the PI because the question is genuinely underdetermined by the record rather than merely hard. Please ground it in the actual apparatus of speech act theory — felicity conditions and the different ways an act can go wrong — but write it so that a coder who has never read the literature can apply it in about ninety seconds per utterance. If a theoretical distinction cannot survive being turned into a question a trained undergraduate can answer, say so and say what is lost by dropping it; if a distinction must survive, say exactly where in the sequence it does its work.

  Several features of our corpus are the reason I cannot just adapt a textbook summary, and I need the procedure to have an answer for each of them rather than a footnote. Many utterances are indirect: no performative verb, or the wrong one. Some contain an explicit performative verb that does not seem to do what it names — an email from the student-government president opening with a formula of authorization he has no standing to issue, a resignation "accepted" by someone who cannot accept it, a "promise" made as part of a joke that both parties laugh about. Some were never received: voice notes and direct messages sent to accounts that had been deactivated the day before, or read only by an automatic forwarding service. Some are reported rather than performed — a witness during a hearing quoting what someone texted her, or describing what she would have said. Some are addressed to a group, or issued by a panel speaking with one voice. Some fall inside a stretch the transcription service marked inaudible, so that the clause carrying the commitment or the threat is missing or guessed at. And some are conditional, or issued in the middle of a negotiation, where it is unclear whether the speaker is committing herself, predicting what she will do, or offering to commit herself if the other side does something first.

  Please do three further things. First, separate the two things we currently conflate: the type of act attempted, and whether the attempt succeeded. A void or defective act and an insincere but fully executed one are different items for us, and I want the procedure to say which failures make the act null and which leave the act in place while making it hollow, with a test for telling them apart that does not require access to the speaker's intentions. Second, specify what is to count as uptake in a corpus of asynchronous messages, and be explicit about whether a message addressed to nobody, or to a machine, or to an account that no longer exists, can carry the act it purports to carry. Third, set a rate you expect the cannot-settle bucket to run at, and say what sorts of utterances should be dumped into it rather than forced into a code.

  Then run the procedure on three items from last week's batch, showing the questions and the answers at each step rather than just the verdict:

  1. A respondent leaves a voice note for the complainant the evening after a hearing: "You'll regret talking to them." Her account had been deactivated the previous afternoon, and the message was never retrieved.
  2. The panel chair opens every interview with the same sentence: "We take every report seriously and someone will follow up with you about next steps." My PI's view is that this is boilerplate and should not be coded as a commissive. I suspect the procedure will disagree with her, and I would like to see the argument laid out either way, since whatever we decide will be applied to about sixty hearings.
  3. A housing officer says to a tenant, "I can't approve that on my own, but if the panel signs off I'll put the transfer through on Monday."

  Finally, tell me honestly what the procedure cannot do: which of our questions it will leave as guesses, where its output will be mistaken for a finding about blame or about what the board should do when the code is only a code, and which parts of the九十-second version are judgment presented as if it were rule.
reasoning: |-
  Here's a thinking process that leads to the suggested coding procedure:

  1.  **Analyze the Request:**

      *   **User:** Final-year linguistics student, working as a RA on a corpus of university conduct-board hearings and related messages.
      *   **Task:** Create a decision procedure (coding manual algorithm) for speech act coding (Commissive, Directive, Assertive, Expressive, Declaration).
      *   **Constraints:**
          *   Must be usable by undergraduates with ~1 week training.
          *   Must take ~90 seconds per utterance.
          *   Must handle specific corpus quirks (indirect acts, void performatives, unreceived messages, reported speech, group agents, inaudible segments, conditionals/negotiations).
          *   Must distinguish *type of act attempted* vs. *success/felicity* (null vs. hollow).
          *   Must define *uptake* for asynchronous/digital contexts (including dead accounts/machines).
          *   Must estimate a "cannot-settle" (PI adjudication) rate and criteria.
          *   Must run the procedure on three specific test cases.
          *   Must include a candid reflection on limitations (guesses vs. rules, blame vs. code).
      *   **Theoretical Grounding:** Speech Act Theory (Austin/Searle), felicity conditions, infelicities, but simplified for application.

  2.  **Deconstruct the Theoretical Challenges:**

      *   *Searle's Taxonomy:* Assertive (truth claim), Directive (try to get hearer to do), Commissive (commit speaker to do), Expressive (psych state), Declaration (changes reality by speaking).
      *   *Austin's Felicity:* Conditions for success (authority, procedure, execution, sincerity, uptake).
      *   *The "Void vs. Hollow" Problem:* A void act (misfire) doesn't happen legally/socially (e.g., "I pronounce you married" by a non-priest). A hollow act (abuse) happens but is insincere (e.g., promising without intent). The corpus needs to track the *attempt* primarily, but flag the *status*.
      *   *The "Uptake" Problem:* In async text, does reading matter? What if the account is dead? Standard SAT says uptake is required for the act to be *consummated*, but the *illocutionary act* is often considered performed upon utterance if conditions are met. For a corpus, we need to code the *illocutionary force attempted*, regardless of uptake, but flag uptake failure.
      *   *The "90-Second" Constraint:* Complex philosophical distinctions (e.g., distinguishing a prediction from a promise) must be operationalized into binary Yes/No questions.

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Structure:* A flowchart style. Question -> Yes/No -> Next Question or Code.
      *   *Step 1: Exclusion.* Is it codable? (Reported speech, inaudible, pure phatic).
      *   *Step 2: The Core Force.* What is the direction of fit? (Word-to-World vs. World-to-Word).
      *   *Step 3: Felicity Check.* Did it work? (Authority, Uptake).
      *   *Handling the Quirks:*
          *   *Indirect:* Focus on function, not form.
          *   *Void Performatives:* Code the attempt, flag the defect.
          *   *Unreceived:* Code the attempt, flag "No Uptake."
          *   *Reported:* Code as Assertive (reporting), not the embedded act.
          *   *Group:* Treat as singular agent if speaking as one.
          *   *Conditionals:* Look for commitment vs. prediction.

  4.  **Refining the "Void vs. Hollow" Distinction:**

      *   *Null (Misfire):* The act *did not happen*. (e.g., lacking authority, wrong procedure).
      *   *Hollow (Abuse):* The act *happened* but was flawed. (e.g., insincere, unable to fulfill).
      *   *Test:* If the speaker had the right intent and authority, would the act be valid *now*? If no (authority missing) -> Null. If yes (authority there, intent missing) -> Hollow.
      *   *Corpus adaptation:* We code the *Illocutionary Point* (what they tried to do). We add a *Status Tag* (Felicitous, Misfire, Abuse).

  5.  **Defining Uptake for this Corpus:**

      *   Standard SAT: Hearer understands.
      *   Corpus Reality: Asynchronous, digital.
      *   Rule: Uptake = Message delivered to a functional endpoint capable of human retrieval.
      *   Dead account/Machine only = No Uptake.
      *   Unread but delivered = Uptake potential exists (code as Felicitous regarding uptake, maybe flag "Unconfirmed"). *Correction:* For coding efficiency, if it hits a valid inbox, count as Uptake available. If bounced/deactivated, No Uptake.

  6.  **Addressing the Specific Test Cases:**

      *   *Case 1 (Threat/Voice note/Dead account):* Directive/Commissive hybrid (Threat). Account dead = No Uptake. Act attempted? Yes. Felicity? Misfire (No Uptake).
      *   *Case 2 (Boilerplate):* "We take every report seriously..." Assertive (belief) + Commissive (follow up). PI says "Boilerplate" (not real promise). Procedure needs to decide if institutional habit counts as commitment. *Crucial tension:* Institutional routine vs. specific commitment.
      *   *Case 3 (Conditional):* "If panel signs off..." Commissive (conditional). Not a prediction.

  7.  **Addressing the "Honest Limitations":**

      *   Intentionality is always a guess.
      *   Context windows are limited.
      *   Power dynamics (blame) shouldn't be coded, but will be inferred.
      *   The 90-second rule forces heuristics over deep analysis.

  8.  **Developing the Content (Iterative refinement):**

      *   *Drafting the Questions:* Need to be punchy. "Is the speaker trying to change the world or describe it?"
      *   *Drafting the Tags:* Need clear labels for the database. `ACT_TYPE`, `FELICITY_STATUS`, `UPTAKE_STATUS`.
      *   *The "PI Bucket":* Needs to be around 5-10%. If higher, the manual is broken. If lower, coders are guessing.
      *   *Case 2 Analysis:* This is the hardest. Is it a "Zombie Act"? It's an institutional declaration/commissive that has lost force through repetition. I need to argue why the procedure might call it a Commissive despite the PI's intuition, or how to tweak the procedure to catch "Ritualized/Empty" acts. *Decision:* The procedure should identify the *form* as Commissive, but the *Status* as potentially Abused/Empty if no specific agent is bound. Actually, better to code it as Commissive but tag "Institutional Routine." Wait, the prompt asks to show the argument. I will show how the procedure forces a Commissive code, challenging the PI, unless we add a "Ritual/Phatic" exclusion. I will argue for the exclusion to save the distinction.

  9.  **Final Review against Constraints:**

      *   90 seconds? The questions need to be very fast.
      *   Undergraduate friendly? Avoid jargon like "illocutionary point." Use "Goal of the words."
      *   Grounded in theory? Yes (Searle/Austin), but translated.
      *   All corpus quirks addressed? Yes.
      *   Three test cases run? Yes.
      *   Honest limitations? Yes.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Case 1:* "You'll regret talking to them." Is this a threat (Directive/Commissive hybrid) or a prediction (Assertive)? In conduct contexts, it's a Threat. Threats are usually coded as Directives (trying to stop behavior) or Commissives (committing to harm). Searle classifies threats as Directives (trying to get H to do/not do). I will stick to Directive for threats.
      *   *Correction on Case 2:* If I code it as Commissive, it implies obligation. If it's boilerplate, is there obligation? The PI says no. The theory says if the institution says it, it binds the institution. I will highlight this tension. I will suggest a "Ritual/Phatic" filter to respect the PI's view without breaking theory.
      *   *Correction on Uptake:* If the account is deactivated, the message bounces or sits in void. No human can read it. No Uptake.
      *   *Formatting:* Use bolding for the procedure steps. Use clear headers.

  11. **Final Polish:** Ensure the tone is academic but practical. Acknowledge the user's expertise (linguistics student) while keeping the manual simple for the undergrads. (Wait, the prompt says "write the procedure... so a coder who has never read the literature can apply it". I must write the manual *for* the coders, but the surrounding text is *for* the user).

      *   *Structure:*
          1.  Introduction/Philosophy.
          2.  The Coding Procedure (The Algorithm).
          3.  The Status Tags (Void vs. Hollow).
          4.  Uptake Definition.
          5.  The "PI Bucket" criteria.
          6.  Test Cases.
          7.  Limitations/Reflection.

      *   *Refining the "90 Seconds":* I need to make sure the questions aren't too philosophical. "What is the direction of fit?" is too abstract. "Is the speaker trying to make something true, or say something is true?" is better.

      *   *Refining the "Void/Hollow":* Use "Null" (didn't happen) vs. "Flawed" (happened but bad).
      *   *Refining Case 2:* I need to be careful not to undermine the PI publicly in the output, but the prompt asks me to "show the argument laid out either way." I will present the procedure's output and then the theoretical justification for overriding it if necessary.

      *   *Let's write.*
answer: |-
  This is a robust design challenge. You are asking for an operationalization of Speech Act Theory (SAT) that survives contact with messy, institutional data while remaining theoretically coherent. The tension you identify—between the PI's intuition (boilerplate isn't a promise) and the theoretical form (it looks like a promise)—is exactly where a coding manual earns its keep.

  Below is the **Conduct Board Speech Act Coding Procedure (v1.0)**. It is designed to be printed as a one-page flowchart for your undergraduate team. Following the procedure, I address your three specific theoretical constraints (Null vs. Hollow, Uptake, Adjudication Rate), run the three test cases, and provide the required reflection on limitations.

  ***

  # PART 1: THE CODING PROCEDURE
  **Time Target:** 90 Seconds per Utterance
  **Input:** Single utterance + 5 lines of prior context + 5 lines of following context.

  ### STEP 0: EXCLUSION CHECK (Is this codable?)
  *Ask these first. If YES to any, stop and apply the Tag.*
  1.  **Is this Reported Speech?** (e.g., "He told me to leave," "She texted that she was sorry.")
      *   **YES:** Code as **ASSERTIVE** (reporting a fact). Do *not* code the embedded act. **STOP.**
      *   **NO:** Continue.
  2.  **Is the Core Meaning Inaudible/Missing?** (e.g., "[inaudible] you'll regret this," where the verb or subject is guessed.)
      *   **YES:** Tag `DATA_ERROR`. Send to **PI BUCKET**. **STOP.**
  3.  **Is this Purely Phatic/Ritual?** (e.g., "Hello," "Can you hear me?", "Thank you" at end of call.)
      *   **YES:** Tag `PHATIC`. Do not code force. **STOP.**

  ### STEP 1: THE PRIMARY GOAL (Direction of Fit)
  *Ignore the grammar. Look at what the speaker is trying to achieve.*
  1.  **Is the speaker trying to get the listener to DO (or stop doing) something?**
      *   **YES:** Go to **DIRECTIVE**.
      *   **NO:** Continue.
  2.  **Is the speaker committing themselves (or their group) to DO something in the future?**
      *   **YES:** Go to **COMMISSIVE**.
      *   **NO:** Continue.
  3.  **Is the speaker stating that something IS true, was true, or will be true (without controlling it)?**
      *   **YES:** Go to **ASSERTIVE**.
      *   **NO:** Continue.
  4.  **Is the speaker expressing a psychological state (joy, regret, apology, thanks) without asking for action?**
      *   **YES:** Go to **EXPRESSIVE**.
      *   **NO:** Continue.
  5.  **Does the utterance itself change an institutional status immediately? (e.g., "You are suspended," "Meeting adjourned.")**
      *   **YES:** Go to **DECLARATION**.
      *   **NO:** *If you cannot decide, send to **PI BUCKET**.*

  ### STEP 2: FELICITY & STATUS TAGS (Did it work?)
  *Once a Code is selected, apply one Status Tag.*
  1.  **Authority Check:** Does the speaker have the institutional right to perform this act *in this context*? (e.g., A student declaring a hearing "adjourned"; a president "authorizing" funds they don't control.)
      *   **NO:** Tag `STATUS_NULL` (The act did not happen).
      *   **YES:** Continue.
  2.  **Uptake Check:** Was the message delivered to a functional human endpoint? (See *Uptake Protocol* below).
      *   **NO:** Tag `STATUS_NULL` (No uptake possible).
      *   **YES:** Continue.
  3.  **Sincerity/Ability Check:** Is there evidence in the transcript that the speaker *cannot* or *will not* fulfill this? (e.g., Promising to do something explicitly forbidden by policy; threatening something physically impossible.)
      *   **YES:** Tag `STATUS_FLAwed` (The act happened, but is hollow/abused).
      *   **NO:** Tag `STATUS_FELICITOUS`.

  ***

  # PART 2: THEORETICAL SPECIFICATIONS

  ### 1. Null (Void) vs. Flawed (Hollow)
  We distinguish between a **Misfire** (Null) and an **Abuse** (Flawed).
  *   **`STATUS_NULL`**: The act *failed to occur*. The world is unchanged by the utterance.
      *   *Cause:* Lack of authority (essential procedure missing) OR Lack of Uptake (message never reached a human).
      *   *Test:* If the speaker had perfect intentions, would the act *still* be invalid? If yes -> Null.
      *   *Example:* A student saying "You are expelled." Even if they mean it, they lack the authority. The expulsion did not happen.
  *   **`STATUS_FLAwed`**: The act *occurred*, but is insincere or unfulfillable.
      *   *Cause:* Insincerity or inability to fulfill.
      *   *Test:* If the speaker had perfect intentions, would the act be valid? If yes -> Flawed.
      *   *Example:* "I promise to stop drinking" (said by someone with no intention of stopping). The promise exists, but it is a lie.
  *   **Why this matters:** A `NULL` act generates no obligation. A `FLAWED` act generates an obligation that is likely to be broken. For a conduct corpus, this distinguishes *procedural errors* from *behavioral misconduct*.

  ### 2. Uptake Protocol (Asynchronous & Digital)
  Standard SAT requires the hearer to understand the act. In a digital corpus, we cannot verify understanding. We verify **deliverability**.
  *   **Valid Uptake:** Message sent to an active account, phone number, or physical address associated with a human. It does not matter if they read it, only that they *could*.
  *   **Invalid Uptake (`STATUS_NULL`):**
      *   Sent to a deactivated account (bounce/void).
      *   Sent to a "no-reply" machine address.
      *   Sent to a group alias where no individual is responsible (e.g., `all-students@uni.edu` without specific targeting).
      *   *Rationale:* An act addressed to nobody is a soliloquy, not a speech act.
  *   **Group Agents:** If a panel speaks ("We find you responsible"), treat the panel as a singular institutional agent. Uptake is valid if delivered to the respondent.

  ### 3. The "PI Bucket" (Adjudication Rate)
  *   **Target Rate:** 5% to 10% of total utterances.
  *   **If < 5%:** Coders are guessing rather than flagging ambiguity.
  *   **If > 15%:** The codebook definitions are too vague.
  *   **Dump Criteria:** Send to PI if:
      1.  **Hybrid Force:** The utterance is equally a Threat and a Prediction (e.g., "This will go badly for you").
      2.  **Context Dependency:** The force relies entirely on tone/audio not captured in transcript (e.g., sarcasm markers missing).
      3.  **Embedded Conditionals:** "I will do X if Y" where Y is controlled by the speaker (Commissive) vs. controlled by chance (Assertive/Prediction).
      4.  **Ritual vs. Real:** Boilerplate language where institutional obligation is unclear (see Case 2).

  ***

  # PART 3: RUNNING THE PROCEDURE (Test Cases)

  ### Case 1: The Unreceived Threat
  **Utterance:** "You'll regret talking to them." (Voice note, respondent to complainant).
  **Context:** Complainant's account deactivated previous afternoon. Message never retrieved.

  *   **Step 0 (Exclusion):** Reported? No. Inaudible? No. Phatic? No. -> **Proceed.**
  *   **Step 1 (Goal):** Is speaker trying to get listener to do/stop something?
      *   *Analysis:* "You'll regret" functions as a threat to deter future testimony. In SAT, threats are **DIRECTIVES** (attempting to influence behavior via fear), though they contain a Commissive element (commitment to harm). We prioritize the influence goal.
      *   *Code:* **DIRECTIVE**.
  *   **Step 2 (Status):**
      *   *Authority:* Respondent has no authority over complainant, but Directives do not require institutional authority (only Commissives/Declarations do). -> **Pass.**
      *   *Uptake:* Account deactivated. Message could not be retrieved by a human.
      *   *Decision:* **`STATUS_NULL`**.
  *   **Verdict:** **DIRECTIVE (`STATUS_NULL`)**.
  *   *Note:* The threat was *attempted*, but because uptake was impossible, the illocutionary act misfired. It is evidence of intent, but not a completed act of intimidation in the record.

  ### Case 2: The Boilerplate Opening
  **Utterance:** "We take every report seriously and someone will follow up with you about next steps." (Panel Chair to all respondents).
  **Context:** Standard opening script for 60+ hearings. PI says "Boilerplate/Not Commissive."

  *   **Step 0 (Exclusion):** Reported? No. Inaudible? No. Phatic?
      *   *Analysis:* This is the friction point. Is it phatic (social lubricant) or substantive? It contains "someone will follow up."
      *   *Decision:* Not purely phatic. -> **Proceed.**
  *   **Step 1 (Goal):** Is speaker committing the group to DO something?
      *   *Analysis:* "Someone will follow up" is a commitment to future action by the institution.
      *   *Code:* **COMMISSIVE**.
  *   **Step 2 (Status):**
      *   *Authority:* Chair has authority to speak for the panel. -> **Pass.**
      *   *Uptake:* Respondent is present. -> **Pass.**
      *   *Sincerity/Ability:* Is there evidence they *won't* follow up? No.
      *   *Decision:* **`STATUS_FELICITOUS`**.
  *   **Verdict:** **COMMISSIVE (`STATUS_FELICITOUS`)**.

  **The Argument (PI vs. Procedure):**
  The procedure codes this as a Commissive because it satisfies the *direction of fit* (World-to-Word: the institution must change the world to match the words). The PI's intuition ("it's just boilerplate") relies on **Gricean Implicature**: because it is repeated without specific intent, the *meaning* is diluted.
  *   **Theoretical Loss:** If we code this as `PHATIC` to satisfy the PI, we lose the ability to track institutional follow-through. If the institution *fails* to follow up, the corpus should show a `STATUS_FLAwed` Commissive.
  *   **Recommendation:** Code as **COMMISSIVE**. Add a tag `TYPE_ROUTINE`. This allows you to filter later. If you code it as non-commissive now, you cannot find the pattern of broken institutional promises later. The procedure is right; the PI's intuition protects the institution from the data.

  ### Case 3: The Conditional Approval
  **Utterance:** "I can't approve that on my own, but if the panel signs off I'll put the transfer through on Monday." (Housing Officer to Tenant).
  **Context:** Negotiation phase.

  *   **Step 0 (Exclusion):** Reported? No. Inaudible? No. Phatic? No. -> **Proceed.**
  *   **Step 1 (Goal):** Is speaker committing to do something?
      *   *Analysis:* "I'll put the transfer through."
      *   *Code:* **COMMISSIVE**.
  *   **Step 2 (Status):**
      *   *Authority:* Officer admits limitation ("can't approve... on my own"). However, the commitment is conditional on the panel.
      *   *Condition Check:* Is the condition ("if panel signs off") controlled by the speaker? No, it's a third party.
      *   *Decision:* This is a **Conditional Commissive**. It is valid *if* the condition is met.
      *   *Tag:* **`STATUS_FELICITOUS`** (with note: `CONDITIONAL`).
  *   **Verdict:** **COMMISSIVE (`STATUS_FELICITOUS`, `CONDITIONAL`)**.
  *   *Note:* Do not code as Assertive (Prediction). The speaker is offering agency ("I'll put... through"), not predicting fate.

  ***

  # PART 4: HONEST LIMITATIONS

  You asked for candor regarding what this procedure cannot do. Here is where the 90-second rule breaks down:

  **1. Intentionality is a Guess.**
  The procedure asks "Is the speaker trying to...?" Coders cannot access minds. They are inferring intent from linguistic form and context. In cases of sarcasm, coercion, or highly indirect speech (e.g., "It's cold in here" meaning "Close the window"), the coder is guessing the *illocutionary point* based on the *perlocutionary effect* they imagine.
  *   *Risk:* We code the *surface* act, not the *real* act. A joke promise is coded as a Commissive (Flawed) rather than an Expressive (Joke), because distinguishing jokes requires tone often lost in text.

  **2. Blame vs. Code.**
  The codes (`STATUS_NULL`, `STATUS_FLAwed`) will inevitably be read as moral judgments by the legal team or administration.
  *   *Risk:* A `STATUS_FLAwed` Commissive (a broken promise) looks like evidence of misconduct. A `STATUS_NULL` Declaration (a procedural error) looks like evidence of incompetence. The coding manual explicitly states these are *linguistic* statuses, but they will be used as *ethical* findings. The procedure cannot prevent this reification.

  **3. The "Boilerplate" Problem (Judgment as Rule).**
  In Case 2, I recommended coding the boilerplate as a Commissive. This forces a rule onto a pragmatic phenomenon.
  *   *Risk:* By coding routine institutional speech as "binding," we inflate the number of commitments in the corpus. The 90-second constraint prevents coders from analyzing the *history* of the utterance (has this promise been kept 0% of the time?). We are forced to treat every utterance as a unique token, ignoring the type-level degradation of meaning.

  **4. The 10% Adjudication Ceiling.**
  If your PI adjudicates more than 10% of items, the "90-second" goal fails. The procedure forces binary choices on gradient phenomena (e.g., how conditional must a promise be to become a prediction?).
  *   *Risk:* Coders will stop sending hard cases to the PI to save time, introducing noise into the `STATUS_FLAwed` bucket. The "PI Bucket" is a pressure valve; if it clogs, the data corrupts.

  **Summary of Loss:**
  To make SAT usable for undergraduates in 90 seconds, we have sacrificed the distinction between **Illocution** (the act performed) and **Perlocution** (the effect achieved). We code the attempt. We tag the failure. We cannot code the *consequence*. If a `STATUS_NULL` threat still terrifies the victim, the corpus will record "No Act," masking the actual harm. This is a feature of the method, not a bug, but it must be acknowledged in your final thesis.
