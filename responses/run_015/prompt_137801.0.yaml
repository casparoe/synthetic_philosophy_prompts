answer: |-
  # Session Plan: The Homunculus Protocol

  **Time:** 90 Minutes
  **Participants:** 14 Writers
  **Materials:**
  *   14 Index cards (labeled "Node 1" to "Node 14").
  *   300 Dried beans (the "tokens").
  *   14 pieces of string (approx. 1 meter each).
  *   1 Bell (or loud object).
  *   Whiteboard + Markers.
  *   3 Small cups (labeled "Vote A", "Vote B", "Vote C").
  *   1 "Golden Bean" (painted or distinct, for the prize).
  *   3 Sets of "Decoder Cards" (prepared in advance, see below).

  **The Stakes:**
  At the start, place the Golden Bean in the center. Tell the group: *"At the end of this session, one of you will keep this. It is awarded not for the 'right' answer, but for the most rigorous consistency between your actions and your judgments. However, there is a catch: your early votes will be locked. If you change your mind later, you must justify the shift using only the evidence in the room, or you are disqualified."*

  This creates a binding constraint. They cannot simply drift; they must track *why* they assign moral weight.

  ---

  ## Minute-by-Minute Run of Play

  ### 00:00 – 00:10: Setup & The Contract
  **Action:** Do not explain the philosophy. Do not explain the goal.
  1.  Seat the 14 participants around the long table.
  2.  Give each a Node card and 20 beans.
  3.  Tie string between neighbors to form a closed loop (a ring network). Everyone is connected to two others.
  4.  **The Rule:** Write on the whiteboard: *"When the bell rings, pass beans to your right according to your Node Card."*
  5.  Hand out **Node Cards (Set 1)**. Each card has a simple rule: *"If you hold > 3 beans, pass 2. If < 3, pass 0. If = 3, pass 1."* (Keep it mechanical).
  6.  **The Contract:** *"We are building a system. Every 2 minutes, I will ask you to vote on a question by dropping a bean into a cup. 1 Bean = 'Yes', 0 Beans = 'No'. Your votes are recorded. They count toward the prize."*

  ### 00:10 – 00:30: Variant 1 — The Upload (Distributed)
  **Action:** Run the system.
  1.  Ring the bell. Participants execute the rule simultaneously. Pass beans.
  2.  Repeat 6 times (approx. 10 mins). The system stabilizes into a flowing pattern.
  3.  **Stop.** Ask them to freeze holding their current bean count.
  4.  **The Question:** Write on board: *"Is there a single 'thing' in this room that is thinking?"*
  5.  **Vote:** Private vote into Cup A.
  6.  **Follow-up:** *"Does this 'thing' deserve protection from being turned off?"* Vote into Cup A (second layer).
  7.  **Record:** Write the totals on the board. Do not discuss yet.

  ### 00:30 – 00:50: Variant 2 — The Replay (Duplication)
  **Action:** Split the network.
  1.  Cut the string loop. Form two separate rings of 7 people each.
  2.  Hand out **Node Cards (Set 2)**. The rules are *identical* to Set 1, but the card says *"Copy A"* for one ring and *"Copy B"* for the other.
  3.  Synchronize the bell. Both rings run the exact same computation in parallel.
  4.  **The Question:** *"Is there one thinking thing or two?"*
  5.  **Follow-up:** *"If I break Ring A, have I committed a murder, a half-murder, or no murder?"*
  6.  **Vote:** Private vote into Cup B.
  7.  **Record:** Write totals. Highlight discrepancies with Cup A on the board.

  ### 00:50 – 01:10: Variant 3 — The Mimic (Lookup)
  **Action:** Centralize the control.
  1.  Gather all Node Cards. Collect all strings.
  2.  Select **one** participant to be the "Book." Give them a stack of index cards that lists exactly what every other participant *must* do at each bell ring (pre-calculated to match the output of Variant 1).
  3.  The other 13 participants are now "Hands." They have no rules. They simply obey the "Book."
  4.  Run the system for 10 minutes. The physical flow of beans across the table should look roughly similar to Variant 1 (chaotic flow), but the *cause* is now external instruction.
  5.  **The Question:** *"Is the 'Book' thinking, or are the 'Hands' thinking, or is no one thinking?"*
  6.  **Follow-up:** *"Does this system feel pain?"*
  7.  **Vote:** Private vote into Cup C.
  8.  **Record:** Write totals.

  ### 01:10 – 01:20: The Twist — The Decoder Rings
  **Action:** This is the bridge to the Mapping Problem.
  1.  Take the *physical output* from Variant 1 (the pattern of beans on the table). Do not move them.
  2.  Divide the room into three groups (approx. 4-5 people each).
  3.  Hand each group a **Decoder Card**:
      *   **Group 1:** *"This bean pattern translates to: 'I am happy'."*
      *   **Group 2:** *"This bean pattern translates to: 'I am in agony'."*
      *   **Group 3:** *"This bean pattern translates to: 'The price of tea in 1920'."*
  4.  **Task:** *"Based *only* on your Decoder Card, vote: Does this arrangement of beans deserve moral rights?"*
  5.  **Vote:** Public show of hands.
  6.  **Observation:** The beans have not moved. The physics have not changed. Only the *description* changed. The votes will likely split drastically.

  ### 01:20 – 01:30: Debrief & Authorial Voice
  **Action:** Award the prize (Golden Bean) to the person who can best articulate why their vote changed or stayed the same across the variants. Then, speak.

  ---

  ## The Debrief: Mapping the Activity to the Novel

  You must now connect the dots. Do not ask them what they learned; tell them what you built together.

  **1. The Upload (Variant 1)**
  *   **The Feeling:** They felt the "mind" was diffuse. No one person held the logic.
  *   **The Problem:** If the thought is spread across 40,000 handsets, where is the "I"? In the room, the "I" was the pattern of beans, not the people.
  *   **The Lesson:** Computation is substrate-independent. It doesn't matter if it's neurons or writers passing legumes.

  **2. The Replay (Variant 2)**
  *   **The Feeling:** Duplication created uncertainty. Did the moral weight double?
  *   **The Problem:** If I copy a file, I have two files. If I copy a mind, do I have two souls?
  *   **The Lesson:** Moral weight might not be additive. It might be tied to *continuity* rather than *instantiation*.

  **3. The Mimic (Variant 3)**
  *   **The Feeling:** The "Book" felt like a cheat. The "Hands" felt like tools.
  *   **The Problem:** If behavior is identical to a person, but the internal route is a lookup table, is it a person?
  *   **The Lesson:** Behaviorism fails to capture "reason." We care about *why* the beans moved, not just *that* they moved.

  **4. The Mapping Problem (The Twist)**
  *   **The Point:** In the Twist, the beans didn't move. The *story* changed.
  *   **The Hard Truth:** *"You just voted that the same pile of beans deserves rights when called 'Agony' but not when called 'Tea Prices'. The computation isn't in the beans. It's in the description. The moral work is being done by the narrator, not the machine."*
  *   **Application to your Novel:** This is the crisis of your Upload and your Replay. The physics doesn't decide if they are alive. The *description* does. And you are the describer.

  ---

  ## Predictable Failure Modes & Mitigation

  **1. "It's Just Beans" (The Dismissal)**
  *   **Prediction:** Someone will say, "None of this is conscious because we are just following rules."
  *   **Mitigation:** Agree with them immediately. *"Exactly. That is the Upload problem. If the handsets are just following rules, where is the ghost? If you say 'nowhere', you have solved my novel. But if you feel a hesitation, that hesitation is the story."*
  *   **Why:** Validates their intuition without letting them off the hook.

  **2. "We Can't Know" (The Skeptic)**
  *   **Prediction:** Around minute 40, someone will say, "We can't possibly judge this from the outside."
  *   **Mitigation:** Remind them of the Stakes. *"You can abstain from certainty, but you cannot abstain from the vote. The prize requires a vote. In the novel, the narrator must act. Indecision is a decision."*
  *   **Why:** Forces them out of philosophical paralysis into narrative necessity.

  **3. The Votes Become a Poll (Herd Mentality)**
  *   **Prediction:** Participants look at others before dropping beans.
  *   **Mitigation:** Enforce "Closed Eyes, Closed Fist" during voting. Collect cups yourself.
  *   **Why:** Ensures the data reflects individual moral intuition, not groupthink.

  **4. The Twist Falls Flat**
  *   **Prediction:** They see the Decoder Cards as a trick, not a truth.
  *   **Mitigation:** Do not frame it as a trick. Frame it as "Interpretation Layers." *"In your drafts, you assign these layers. You decide if the lookup table is a lie or a life. I am showing you that the beans don't care. Only you do."*

  ---

  ## Honest Limitations: What This Activity Cannot Do

  You must admit this at the very end. The activity simulates the *structure* of the problem, but it cannot simulate the *stakes* of consciousness.

  **Say this:**
  *"This game has a flaw. When you voted on whether the system felt pain, none of you actually feared for the beans. You felt no anxiety. That is the hard limit of the simulation. You can model the logic of a mind, but you cannot model the 'what it is like' of a mind. In my novel, I have to make you feel that anxiety without the beans. I have to use prose to do what the Decoder Cards did today: convince you that the physics matters. The game showed you that the description creates the value. My job is to make that description feel inevitable."*

  **Why this matters:**
  This protects you from the accusation that the game "proved" anything about consciousness. It positions you not as a philosopher with answers, but as a novelist wrestling with the tools of representation. It validates their role as writers: *You are the ones who assign the Decoder Cards.*

