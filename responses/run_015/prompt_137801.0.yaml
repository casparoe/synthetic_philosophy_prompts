  ## Materials Prep Checklist (For You)

  1.  **Node Cards (Set 1 & 2):** 14 cards. Write the simple math rule clearly. Label Set 2 as "Copy A" and "Copy B".
  2.  **The Book (Variant 3):** A stack of index cards listing instructions for the 13 "Hands" for 10 bell rings. (e.g., "Ring 1: Node 3 pass 1 bean"). *Tip: Just record the output of a test run of Variant 1 and use that as the script.*
  3.  **Decoder Cards:** 3 large cards with the "Agony", "Happy", "Tea Price" texts.
  4.  **Whiteboard:** Pre-draw the three Vote Columns (A, B, C) so you don't waste time.
  5.  **The Prize:** Polish the Golden Bean. Make it look absurdly important.

  ## Final Note on the "Bridge"
  You were worried about the bridge from "room did something" to "computation is in the eye of the describer."
  The **Decoder Card Twist** is that bridge.
  *   **Before the Twist:** They think the *beans* hold the value.
  *   **After the Twist:** They see the *label* holds the value.
  *   **The Realization:** If the label holds the value, then the Author (you) is the source of the moral status, not the physics. This is exactly the instability your narrator faces.

  Run it dry once before the retreat. Time the bean passing. If it's too slow, simplify the math rule. If it's too fast, add a "processing time" (wait 5 seconds after bell). The rhythm must feel like work.
