answer: |-
  **The Causal Telos: Reconstructing Buddhist Ethics as Non-Aggregative Consequentialism**

  The classification of Buddhist ethics within Western meta-ethical taxonomies has long been a source of friction. Standard scholarship typically bifurcates the tradition: early Buddhism is often read through a deontological lens emphasizing the intentionality (*cetanā*) of action and the adherence to precepts (*śīla*), while the broader soteriological project is frequently categorized as virtue ethics, centered on the cultivation of mental states (*bhāvanā*) and the development of character traits like compassion (*karuṇā*) and wisdom (*prajñā*). However, both classifications struggle to account for what might be termed the "dual-teleology problem." On the metaphysical side, the doctrine of dependent origination (*pratītyasamutpāda*) and no-self (*anātman*) dissolves the stable agent required for standard moral accounting. On the soteriological side, particularly in the Mahāyāna context, the Bodhisattva vow commits the practitioner to the universal attenuation of suffering, a goal that structurally resembles a universalist, outcome-oriented aim.

  This essay argues that Buddhist ethics is best reconstructed not as a hybrid of virtue and deontology, but as a *sui generis* form of non-aggregative, path-dependent consequentialism. While the metaphysics of *anātman* precludes the aggregative welfare calculations of classical utilitarianism, the soteriological commitment to the cessation of *duḥkha* (suffering/unsatisfactoriness) establishes a teleological hierarchy where actions are validated by their causal efficacy in reducing grasping (*upādāna*). By shifting the locus of value from "welfare states" to "causal trajectories," one can resolve the tension between the lack of a substantial agent and the imperative for universal liberation.

  **The Metaphysical Objection: Anātman and the Impossibility of Aggregation**

  The primary objection to classifying Buddhist ethics as consequentialist rests on the metaphysical incompatibility between *anātman* and the moral agent required for utilitarian calculus. Standard consequentialism presupposes a container model of personhood: distinct, countable entities experience pleasure or pain, and the moral agent must aggregate these units to determine the right action. If the self is merely a conventional designation for a bundle of impermanent processes (*skandhas*), the question arises: who suffers, and whose suffering counts?

  If there is no persistent subject to bear the burden of maximization, the concept of "maximizing the good" becomes category-incoherent. One cannot sum the utility of entities that do not possess ontological independence. Furthermore, if time is understood through the momentariness (*kṣaṇika*) of dharmas, the future consequences of an action cannot be reliably calculated by a subject that does not endure from moment to moment. From this perspective, Buddhist ethics must be deontological (focusing on the purity of the intention in the present moment) or aretaic (focusing on the quality of the mental stream), because any forward-looking assessment of consequences presupposes a continuity that the metaphysics denies.

  This objection is formidable but relies on a specific definition of consequentialism tied to welfare aggregation. It assumes that the "consequence" to be maximized must be a positive mental state experienced by a substantial self. If we alter the definition of the "good" from *welfare* to *liberation*, and the "agent" from *substance* to *causal locus*, the objection loses its force.

  **The Soteriological Pull: Upāya and the Primacy of Outcome**

  Despite the metaphysical constraints, the soteriological structure of Buddhism exerts a strong consequentialist pressure. This is most evident in the doctrine of skillful means (*upāya-kauśalya*). In Mahāyāna ethics, precepts are not absolute moral laws but provisional tools. A Bodhisattva is theoretically permitted to violate standard moral prohibitions (such as lying or killing) if doing so prevents greater harm and aids beings on the path to liberation. The justification for such transgressions is never rooted in the intrinsic rightness of the rule, nor solely in the purity of the agent's character, but in the *outcome*: the reduction of suffering and the advancement of enlightenment.

  This subordination of rules to results indicates a teleological hierarchy. The "good" is defined independently of the action itself; the action is right *because* it leads to the cessation of *saṃsāric* entanglement. The Bodhisattva vow functions as a regulative ideal that directs the causal stream toward systemic liberation rather than personal merit. If the ethics were purely deontological, the violation of a precept would be intrinsically defiling regardless of the outcome. If it were purely virtue ethics, the focus would remain on the agent's internal state regardless of external efficacy. Yet, the tradition insists that wisdom must be coupled with compassion that *acts* to save beings. The metric of success is external to the agent's immediate mental state: did the action alleviate suffering?

  **Reconstructing Consequentialism: Causal-Reductive Teleology**

  To resolve the dual-teleology problem, we must reconstruct consequentialism to fit Buddhist metaphysics. We can term this "Causal-Reductive Consequentialism." In this framework, the "good" is not a quantifiable utility to be aggregated, but a negative state—the cessation of causal conditioning that leads to suffering. The moral objective is not to maximize happiness, but to minimize *upādāna* (grasping) across the interdependent network of sentient existence.

  This view is **non-aggregative** because it does not treat sentient beings as discrete buckets of utility. Instead, because of *pratītyasamutpāda*, beings are nodes in a causal web. An action is evaluated based on how it alters the causal texture of the web. Does this action increase friction, craving, and reification? Or does it loosen the knots of conditioning? The "calculation" is not a sum of pleasures, but an assessment of causal momentum. This respects *anātman* because it does not require a persistent self to receive the good; it only requires a causal continuum that can be steered toward quiescence.

  This view is **path-dependent** because the means cannot be separated from the ends. In standard utilitarianism, the path is instrumentally valuable only. In Buddhist ethics, the path is constitutive of the end. One cannot achieve the cessation of grasping through actions rooted in grasping. Therefore, the "consequence" includes the qualitative nature of the causal chain itself. A violent act that saves a life might be permissible under *upāya*, but only if the agent's mind is free from hatred; otherwise, the act plants seeds of future suffering that outweigh the immediate benefit. Thus, the consequence includes the karmic imprint (*vāsanā*) left on the causal stream.

  **The Agent as Causal Locus**

  The remaining hurdle is the agent. If there is no self, who directs this causal optimization? The solution lies in viewing the "agent" as a functional locus of decision-making within the causal stream. The Bodhisattva vow is not a promise made by a substantial ego, but a commitment that stabilizes the causal flow of the *skandhas* toward a specific telos. It acts as a feedback mechanism. When the question arises, "Who bears the burden of maximization?" the Buddhist answer is "The suffering itself bears the burden, and the wisdom that perceives it acts to remove it."

  This dissolves the tension between the lack of agent and the requirement for action. The moral imperative arises from the nature of reality (suffering exists) rather than the authority of a lawgiver or the flourishing of a self. The "maximization" is the systematic application of antidotes to poison wherever they appear in the causal network. The Bodhisattva is simply the site where the causal network becomes self-correcting. This preserves the outcome-orientation (the network must be corrected) without requiring a substantial agent (the correction happens through the network).

  **Counter-Argument: The Deontological Core of Karma**

  A robust counter-argument remains: the doctrine of *karma-phala* (the fruit of action) suggests an intrinsic moral order where certain actions *always* yield certain results, regardless of the outcome. This resembles a natural law deontology. If killing always produces a karmic seed of suffering for the killer, then the consequentialist calculation is rigidly constrained by the nature of the act itself, not the situational outcome.

  However, this interpretation conflates the *law* of karma with the *ethics* of karma. The law of karma describes causal regularity (fire burns); the ethics of karma describes how to navigate it. *Upāya* demonstrates that karmic regularity can be overridden or transformed by the intensity of compassion and wisdom. The "fruit" is not a fixed penalty but a conditional result dependent on the mental context and the broader causal web. Therefore, *karma-phala* supports the consequentialist reconstruction: it provides the data for the causal calculation. One avoids harmful actions not because they are intrinsically wrong, but because they reliably produce causal friction that impedes the telos of liberation. The "deontological" feel of the precepts is heuristic, a rule of thumb for navigating causality, rather than an absolute moral command.

  **Conclusion: A Defense of Sui Generis Consequentialism**

  In conclusion, Buddhist ethics is best understood as a *sui generis*, non-aggregative, path-dependent consequentialism. Standard taxonomies fail because they impose Western metaphysical assumptions about the self and value onto a system that explicitly rejects them. Virtue ethics captures the importance of mental cultivation but obscures the universal, outcome-oriented imperative of the Bodhisattva vow. Deontology captures the importance of intention and precepts but fails to account for the flexibility of *upāya* and the primacy of suffering's cessation.

  By defining the "good" as the reduction of causal entanglement (*saṃsāra*) rather than the accumulation of welfare, we can maintain a consequentialist structure without requiring an aggregating agent. The "dual-teleology problem" is resolved by recognizing that the metaphysics of no-self does not eliminate teleology; it merely relocates it from the agent to the causal process itself. The moral life is the intentional alignment of the causal stream with the trajectory of liberation. This view honors the doctrinal distinctions of *anātman* and *pratītyasamutpāda* while taking seriously the soteriological commitment to end suffering for all beings. It stands as a coherent ethical framework on its own internal logic, offering a model of moral reasoning that is outcome-sensitive without being dependent on the fiction of a substantial self.
