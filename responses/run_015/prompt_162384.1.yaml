      *   *Paradox of Phenomenal Judgment (Frankish/Chalmers):* If I say "I am in pain," and the pain (quale) caused nothing, then the physical brain state causing the utterance is independent of the pain. Why should the utterance track the pain? It seems like a massive coincidence if all our reports about consciousness are accurate despite consciousness doing no work.
