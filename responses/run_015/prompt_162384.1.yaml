          *   *Best fit for Epiphenomenalist:* They usually bite the bullet. "Yes, it is a coincidence, but a law-governed one." (Chalmers' view). They argue the correlation is brute but reliable.
          *   *Alternative:* The "Common Cause" explanation. Neural state N causes Behavior B and Qualia Q. N causes B directly. N causes Q directly. B and Q correlate because of N, not because Q causes B.
          *   *Wait, does this solve the Paradox of Judgment?* The paradox is: Why does B *refer* to Q? If B is caused by N, and Q is caused by N, B says "I have Q." Why does N encode information about Q in B if Q doesn't feed back?
          *   *Answer:* Because N *is* the physical correlate of Q. The physical state carries the information. The epiphenomenalist must argue that the physical state represents the quale *because* it generates it, even if the quale doesn't push back. This is the "Pre-established Harmony" move.

