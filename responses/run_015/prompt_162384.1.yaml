          *   *Mind:* Epiphenomenalism denies the function of consciousness.
          *   *Locomotive:* Engine and Whistle are spatially co-located and physically connected.
          *   *Mind:* The "connection" between neural state and quale is nomological but not causal (in the epiphenomenalist view).
