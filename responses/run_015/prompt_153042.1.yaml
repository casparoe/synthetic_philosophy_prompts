answer: |-
  You posit your intention as an independent variable, as if you stand outside the web of creation and force God's hand. But does not God create the intention itself, just as He creates the movement of your hand and the contact of the cotton? The Habit (*ʿāda*) is not a reaction to your aim; it is the consistent ordering (*nazm*) of events that God wills. When you intend to burn the cotton, God creates that intention, then the movement, then the contact, then the burning—not because your intention compelled Him, but because this is the sequence He has ordained as customary. He knows the aim because He created it, not because He scans your heart to decide whether to burn the cotton. His knowledge is eternal, not a response to temporal events.

  As for *kasb* (acquisition), it distinguishes your act from a reflex or a tremor. You are the locus of the power God creates to move the hand, and thus you "acquire" the act, making it yours for reward or blame, without granting you independent efficacy. So neither horn cuts us: God tracks aims because He knows what He creates, and your intention does no causal work—it is merely another link in the chain He sustains. But you hint at a deeper worry: if habit is just frequency, how do we distinguish the prophet's miracle from the magician's trick? Shall we untangle that knot next, or do you wish to press further on the nature of the created power?
