answer: |-
  # Q&A Prep Sheet: Coercive Subjection & The Exit-Cost Proviso

  **Strategy Note:** Your core vulnerability is the **Exit-Cost Proviso**. It does the heavy lifting in your argument, but it is empirically messy and normatively risky. Do not defend it as a precise metric; defend it as a *heuristic* for identifying stakeholding. Your goal is to show that your principle is *more* coherent than citizenship or competence, even if its application requires judgment.

  ---

  ### 1. The "Mobile Elite" Reductio
  **Who:** The Civic Republican or Egalitarian Liberal (Theoretical hit)
  **Phrasing:** "If the franchise turns on the *inability* to exit at moderate cost, you imply that those who *can* exit cheaply shouldn't vote. By your logic, the ultra-wealthy with dual passports or portable assets are less subject to coercion than the working poor. Are you prepared to argue that becoming rich enough to leave should disqualify you from the demos?"
  **Damage:** **High.** Hits the **Principle**. Threatens to invert your argument into an anti-elite disenfranchisement claim you likely don't want to make.
  **2-Minute Reply:** "I distinguish between *capacity* to exit and the *normative cost* of exit. Wealth lowers the financial cost, but it doesn't erase the social, relational, and legal costs of severing ties with a polity where one's life is grounded. My proviso targets those for whom leaving is a *live option* without sacrificing their life projects. For most wealthy citizens, even if they can afford a ticket, their assets, family, and social standing remain deeply subject to local coercion. The proviso is meant to exclude transient actors, not entrenched elites whose wealth insulates them from law but not from jurisdiction."
  **Soft Spot:** You are stretching "cost" to include social ties, which weakens the "moderate cost" clarity. If social ties count, tourists have ties too.
  **Flag:** **Principle.**

  ### 2. The Lockean Consent Objection
  **Who:** The Consent Theorist
  **Phrasing:** "You ground the obligation to obey and the right to vote in subjection. But in the Lockean tradition, subjection without consent is merely force. By enfranchising people solely because they are 'stuck' here, you are treating the franchise as a consolation prize for coercion rather than a marker of voluntary political association. Why isn't this just legitimizing tyranny over those who can't leave?"
  **Damage:** **High.** Hits the **Principle**. Challenges the normative legitimacy of the demos itself.
  **2-Minute Reply:** "I agree that consent is the ideal, but it is a fiction for nearly all existing citizens. We don't ask native-born citizens if they consent; we assume their subjection creates a claim to rule. My argument makes that implicit contract explicit. If the state claims the authority to coerce you indefinitely, and you lack a reasonable exit, justice demands you have a say in how that coercion is wielded. This isn't legitimizing tyranny; it's demanding that those who hold the monopoly on force answer to those they hold captive."
  **Soft Spot:** You are conceding that actual consent is impossible, which the Lockean will reject as giving up on liberalism.
  **Flag:** **Principle.**

  ### 3. The "Voting as Office" Objection
  **Who:** The Civic Republican
  **Phrasing:** "You treat voting as a shield against coercion, a defensive right. But voting is an *office*, an exercise of civic judgment for the common good. Sixteen-year-olds may be subject to coercion, but do they possess the independence and judgment required to hold that office? By lowering the age, you aren't protecting interests; you're diluting the deliberative quality of the electorate."
  **Damage:** **Medium-High.** Hits the **16-Year-Old Conclusion**.
  **2-Minute Reply:** "I reject the premise that voting is primarily an office of judgment; it is first a mechanism of accountability. If 16-year-olds are subject to criminal law, labor markets, and education policy, they have the strongest interest in holding officials accountable. Furthermore, we already trust them with driving, working, and paying taxes. If they bear the burdens of citizenship, the 'judgment' requirement is often a mask for excluding interests that challenge the status quo. Accountability precedes deliberation."
  **Soft Spot:** Republicans value deliberation highly. Dismissing "judgment" sounds anti-republican.
  **Flag:** **Institutional Conclusion (Voting Age).**

  ### 4. The Undocumented Gap
  **Who:** The Democratic Theorists (All-Affected)
  **Phrasing:** "Your residency threshold protects the franchise, but it excludes undocumented residents who are clearly subject to coercion and face high exit costs (deportation risks, danger returning home). They are the *most* subject and the *least* able to exit. Why does your theory leave out the most vulnerable population?"
  **Damage:** **Medium-High.** Hits the **Non-Citizen Conclusion**.
  **2-Minute Reply:** "This is a tension I acknowledge. My current institutional proposal uses a residency threshold as a proxy for 'stable subjection' to ensure administrability. However, on the *principle* of coercive subjection, undocumented residents absolutely qualify. They face high exit costs and are deeply subject. In the Q&A, I'm open to arguing that the residency threshold should be waived where subjection is undeniable, or that the threshold should be very low. The principle demands their inclusion even if the institutional design needs to accommodate enforcement realities."
  **Soft Spot:** Conceding this might open a floodgate of "how do we verify this?" questions that distract from the main theory.
  **Flag:** **Institutional Conclusion (Non-Citizens).**

  ### 5. The "Naturalization Coercion" Objection
  **Who:** The Democratic Theorists / Egalitarian Liberal
  **Phrasing:** "You say we exclude those who 'could naturalize cheaply.' But naturalization often requires renouncing prior allegiances, paying fees, or passing ideological tests. Are you essentially saying permanent residents must assimilate to your specific political culture to earn the right to be free from coercion? Isn't that illiberal?"
  **Damage:** **Medium.** Hits the **Non-Citizen Conclusion**.
  **2-Minute Reply:** "The 'cheaply' proviso is meant to catch short-term visa holders, not permanent residents. If naturalization requires renouncing core identities or is prohibitively expensive, it is *not* a moderate exit cost from non-citizen status. My argument presumes a streamlined naturalization process. If the state makes naturalization onerous, the state loses the right to claim the resident 'chose' not to join. The burden is on the state to make the exit from resident status easy; if they don't, the resident stays in the demos."
  **Soft Spot:** Relies on a counterfactual (ideal naturalization policy) that doesn't exist.
  **Flag:** **Institutional Conclusion (Non-Citizens).**

  ### 6. The Turnout & Dilution Objection
  **Who:** The Egalitarian Liberal
  **Phrasing:** "Even if this is theoretically sound, what is the empirical effect? Young people and non-citizens have lower turnout rates. Does enfranchising them actually shift power, or does it just create a class of 'second-class voters' whose interests are ignored anyway? Does this dilute the voting power of the marginalized citizens who already show up?"
  **Damage:** **Medium.** Hits **Instrumental/Consequences**.
  **2-Minute Reply:** "Dilution is a zero-sum fear that assumes a fixed pie of power. My goal isn't just to shift partisan balance, but to change the *incentive structure* for politicians. Even with lower turnout, the mere presence of these blocs forces parties to court them. We saw this with the 26th Amendment; politicians started caring about youth issues because the *potential* vote existed. Furthermore, non-citizen residents often have higher stability in communities than transient citizens. Ignoring them perpetuates the exact inequality we claim to care about."
  **Soft Spot:** Empirical claims are contestable. If turnout is too low, the "accountability" mechanism fails.
  **Flag:** **Instrumental (Both Conclusions).**

  ### 7. The Partisan Composition Question
  **Who:** The Political Scientist
  **Phrasing:** "Let's be blunt. Non-citizens and 16-year-olds likely skew progressive. Is this theory just a vehicle to shift the electorate to the left? How do you respond to the charge that this is gerrymandering the demos rather than fixing a normative problem?"
  **Damage:** **Low-Medium.** Hits **Feasibility/Legitimacy**.
  **2-Minute Reply:** "If the normative argument holds, the partisan outcome is irrelevant. If we discovered tomorrow that enfranchising these groups helped conservatives, I would still argue for it based on the principle of coercive subjection. However, data from places that have done this (e.g., Maryland school board elections, parts of Europe) shows it increases engagement across the board. My interest is in the legitimacy of coercion, not the partisan dividend. If the right wants to win these voters, they should policy for them."
  **Soft Spot:** In a political science department, claiming "norms over outcomes" can sound naive.
  **Flag:** **Instrumental.**

  ---

  ### Concessions to Make Early (First 5 Minutes)
  *Do not wait to be cornered on these.*
  1.  **Measurement:** Concede that "exit cost" is not a precise mathematical metric. It is a normative heuristic. You are not proposing a means-test for voting, but a guideline for residency requirements.
  2.  **Competence:** Concede that 16-year-olds may lack some civic knowledge compared to adults. Argue that *interest* and *subjection* outweigh *knowledge* as criteria for the franchise.
  3.  **Undocumented Status:** Concede that your institutional proposal (residency threshold) is a proxy that might imperfectly capture the principle regarding undocumented migrants. Express openness to refining the threshold.

  ### The One Question You Hope Nobody Asks
  **"If the franchise is tied to exit costs, is the franchise revocable?"**
  *   **Why it's deadly:** If I become wealthy enough to leave, or if I gain a second passport, do I lose my right to vote? If you say "No," you admit exit cost isn't the *actual* criterion. If you say "Yes," you propose a revocable franchise, which is politically radioactive and administratively nightmarish.
  *   **Prep:** If asked, pivot to "status" vs. "momentary capacity." Argue that once admitted to the demos, the *presumption* of subjection holds unless one formally expatriates. The exit cost is a gatekeeping mechanism for entry, not a continuous monitoring tool. (This is weak, but it's your best shield).
