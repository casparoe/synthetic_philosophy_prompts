      *   *What about "Newcomb's Problem"?* Superrationality is closely linked to Evidential Decision Theory (EDT). I should mention that distinction briefly without getting too bogged down.
      *   *Crucial Point:* The coworker has kids. He *physically cannot* mirror the "weekend study" strategy. This is a hard break in symmetry. I need to emphasize this.

  7.  **Final Polish:** Ensure the advice is actionable. "Don't use superrationality for the promotion." "Use it for shared resources."

  **(Self-Correction during drafting):** I need to make sure I don't dismiss superrationality entirely. It's a useful heuristic for *coordination* problems. I need to distinguish between *Coordination Games* (Chores) and *Competitive Games* (Promotion).

