answer: |-
  This is a fascinating application of decision theory to real life, and it's great that the "chores" experiment worked out for you. It validates the intuition behind Hofstadter's idea: in symmetric social dilemmas, acting *as if* your choice determines the group's choice can break deadlock.

  However, you are right to be suspicious about applying this to the promotion. You are hitting the exact boundaries where superrationality stops being a useful heuristic and starts becoming "magical thinking."

  Here is the breakdown of why it worked for the dishes, why it likely won't work for the promotion, and how to estimate that "cutoff" you're looking for.

  ### 1. Why the Chores Worked (Symmetry + Non-Zero-Sum)
  Hofstadter's superrationality relies on two strict conditions that were present in your kitchen scenario:
  *   **Symmetry of Situation:** You and your roommates face the exact same payoff matrix. A dirty kitchen hurts you all equally; cleaning costs you all roughly the same effort.
  *   **Symmetry of Reasoning:** You assume everyone is running the same "algorithm" to solve the problem.
  *   **Non-Zero-Sum:** If you all cooperate (clean), everyone wins. If you all defect (don't clean), everyone loses. There is a "better" collective outcome.

  In this case, your decision *is* a sample of the group's decision. If you conclude "cleaning is the logical choice," and they are identical logicians, they must conclude the same.

  ### 2. Why the Promotion Fails (Asymmetry + Zero-Sum)
  The promotion scenario breaks both conditions.

  **A. The Zero-Sum Problem**
  Superrationality is designed to solve *Prisoner's Dilemmas*, where mutual cooperation yields a higher total utility than mutual defection.
  A promotion is generally **zero-sum** (or close to it). If you both "cooperate" (agree to take it easy), one of you still has to win and one has to lose. The total utility doesn't increase by both slacking off; you just both waste less energy, but the loser still loses.
  *   **Superrational outcome:** If you both reason superrationally, you might agree to "not waste resources fighting." But this is unstable. If you agree to take it easy, and he defects (studies hard), he wins 100%. The penalty for being the "superrational sucker" is losing the career advancement.

  **B. The Asymmetry Problem (The Hard Break)**
  You mentioned the critical flaw yourself: *"He's got kids so no weekend studying."*
  Superrationality requires that the other player *can* mirror your move. If your optimal strategy is "study weekends," and he *physically cannot* study weekends due to childcare, **he cannot mirror you.**
  *   If you decide "I will study weekends," he does not necessarily decide "I will study weekends." He decides "I will maximize my limited hours."
  *   Because your available strategy sets are different, you are no longer identical algorithms. The logical link is severed.

  **C. The "Cutthroat" Variable**
  Superrationality assumes the other player values the outcome similarly and reasons similarly. If he is "cutthroat," his utility function places a higher weight on winning at your expense than on fair play or energy conservation. He is running a different algorithm (Maximize Win vs. Maximize Fairness/Efficiency).

  ### 3. Is There a "Similarity Threshold"?
  You asked for a number or a sliding scale. In formal decision theory, there isn't a universal constant (like "0.75 similarity"), but there is a concept called **Correlated Equilibrium**.

  Instead of asking "Are we identical?", ask: **"What is the probability that our decisions are correlated?"**

  *   **Chores:** Correlation is high (~90%). You all live there, you all want it clean, you all want to avoid work.
  *   **Promotion:** Correlation is low (~20%). You want the promotion; he wants the promotion. But your constraints (kids) and styles (cutthroat) differ.

  **The Practical Heuristic:**
  Don't look for a similarity score. Look for **Incentive Alignment.**
  *   **High Alignment (Superrationality applies):** We both win if we both do X. We both lose if we both do Y. (e.g., Chores, climate change, group buys).
  *   **Low Alignment (Standard Game Theory applies):** I win if I do X and you do Y. We compete for a fixed resource. (e.g., Promotions, sports, litigation).

  ### 4. A Decision Framework for Your Life
  To make this practical, use this 3-step test before applying superrational reasoning:

  **Step 1: Is the game symmetric?**
  *   *Question:* Can the other person make the exact same move I am considering, with the same cost and same potential reward?
  *   *Chores:* Yes.
  *   *Promotion:* No (He can't study weekends; only one can win).
  *   *Verdict:* If No, revert to standard Game Theory (Nash Equilibrium).

  **Step 2: Is it Non-Zero-Sum?**
  *   *Question:* Does mutual cooperation create a better outcome for *both* of us than mutual competition?
  *   *Chores:* Yes (Clean kitchen vs. Dirty kitchen).
  *   *Promotion:* No (One gets promoted either way; mutual "cooperation" just means you both underprepare).
  *   *Verdict:* If No, superrationality is dangerous. It encourages disarmament in a fight.

  **Step 3: Is the reasoning style known?**
  *   *Question:* Do I have evidence that this person reasons cooperatively?
  *   *Chores:* Yes (They are your friends/roommates).
  *   *Promotion:* No (He is "cutthroat").
  *   *Verdict:* If No, assume they will defect.

  ### 5. Recommendation for the Promotion
  **Do not use superrationality here.**
  If you decide "I won't burn myself out studying weekends because if I do, he will too," you are making two false assumptions:
  1.  That he *can* study weekends (he can't).
  2.  That he *won't* study weekends if you do (if he's cutthroat, he will find a way, or hire a babysitter, or study late nights).

  If you apply superrationality here, you are essentially unilaterally disarming because you hope the enemy will do the same. In a zero-sum competition with an asymmetric opponent, **standard rationality** dictates you maximize your own utility given his constraints.
  *   **Your Move:** Study weekends.
  *   **His Move:** He will maximize his weekday hours.
  *   **Outcome:** You compete based on actual capacity, not a philosophical mirror.

  ### Summary
  You aren't drawing the line in the wrong place; you're just looking for a scalar (a number) when you need a categorical distinction.

  *   **Use Superrationality for:** Coordination problems, public goods, shared resources, symmetric dilemmas with friends/peers. (The Chores).
  *   **Use Standard Game Theory for:** Competitions, zero-sum games, negotiations with adversaries, asymmetric situations. (The Promotion).

  The "cutoff" is not how much you are *alike* as people, but how much your **incentives and constraints are aligned**. In the kitchen, they were aligned. At work, they are opposed. Trust the math: clean the kitchen together, but fight for the promotion individually.
