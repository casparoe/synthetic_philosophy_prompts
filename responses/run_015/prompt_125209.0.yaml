prompt: |-
  I'm a doctoral student in evolutionary game theory, and I'm currently drafting a chapter that attempts to translate decision-theoretic puzzles about superrationality into the vocabulary of evolutionary dynamics. Specifically, I want you to restate the Platonia dilemma and the related Luring Lottery—those thought experiments in which agents with near-perfect predictive correlation reason about each other's reasoning in order to coordinate or defect within a lottery structure—in terms of evolutionary stable strategies, replicator dynamics, costly signaling, and the conditions for common knowledge in a signaling game without explicit communication. Please map the agents' mutual predictions onto correlation structures in a population, the payoff structures onto fitness landscapes, and the reasoning process itself onto selection pressures or strategy revision protocols, being careful not to smuggle in normative language about rationality unless it has a direct evolutionary counterpart such as fitness maximization.

  Once you have completed this translation as faithfully as possible, I need a detailed residue report. Tell me which elements survive intact—perhaps the tension between individual and collective optima or the mechanism of correlation without direct message passing—which ones must be distorted to fit, such as counterfactual reasoning about altering one's own decision procedure in a single-shot interaction or the idea that an agent can choose a reasoning mode independently of evolutionary history, and which ones have no expression whatsoever in evolutionary vocabulary, for instance any normative claim that one ought to adopt a particular entry strategy regardless of population dynamics. Then offer your judgment on whether these residues reveal genuine limitations in evolutionary frameworks—concepts necessary to capture human reasoning that selection dynamics cannot express—or whether they suggest that the philosophical disagreement about superrationality is less substantive than it appears, reducible to framing differences that vanish once we restrict analysis to observable dynamics. Present everything in continuous prose only, with no headings, bullet points, bold text, or tables, as you would in a formal letter or email, since I will be integrating your response directly into my draft notes.
