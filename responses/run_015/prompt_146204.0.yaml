  **The Case: The "Infinite Zoom" vs. The "Pre-Rendered Loop"**

  Consider a digital installation titled *Eternal Ridge*. The work presents a photorealistic mountain range on a high-resolution screen. Viewers are invited to "zoom" indefinitely into the rock textures.

  *   **Version A (Procedural):** The landscape is generated in real-time by a recursive fractal algorithm (e.g., a Perlin noise variant with infinite recursion). The code is elegant, lightweight, and mathematically continuous.
  *   **Version B (Static):** The landscape is a pre-rendered video file of a zoom sequence. It is visually indistinguishable from Version A at the resolution of the display, but it is finite; if one could zoom past the pixel limit, the image would blur or loop.

  **The Feature:** The specific aesthetic feature in question is **scalable complexity**. To the naked eye, at the standard viewing distance, Version A and Version B are perceptually identical. However, the "True Critic" of generative art privileges Version A. Their appreciation is not based solely on the visual sublimity of the mountain (which is equal in both), but on the knowledge that the visual field is sustained by an underlying **algorithmic potentiality**.

  **The Humean Tension:**

  This scenario creates a pressure point at the boundary of Hume's distinction between **sentiment** (the internal feeling of beauty) and **understanding** (the external judgment of fact).

  1.  **Hume's Standard:** For Hume, beauty is not a quality in the object but a sentiment in the observer. The "Standard of Taste" is established by the joint verdict of True Critics, who possess "delicacy of taste," "practice," "comparison," "freedom from prejudice," and "good sense." Crucially, Hume argues that while sentiments vary, the *circumstances* under which they arise can be objectively analyzed. However, he maintains that if two objects produce the same sensory input, a difference in valuation must stem from a defect in the critic (prejudice) or a perceptual difference (delicacy).
  2.  **The Pressure Point:** The tension emerges when the True Critic justifies their preference for Version A not by pointing to a visual nuance (delicacy), but by citing the **objective efficiency of the code** (understanding).
      *   If the critic says, "Version A is more beautiful because I feel a sense of intellectual awe knowing it is infinite," Hume might classify this as a legitimate sentiment arising from the *idea* of the object.
      *   However, if the critic says, "Version A is superior because the recursive function is mathematically more elegant than the brute-force storage of Version B," they are appealing to an **objective property of the underlying system** that is imperceptible to the senses.

  **The Dilemma: Objectivism vs. Cultivated Sentiment**

  This forces Hume's framework into a dilemma regarding the locus of the "aesthetic object."

  *   **Option 1: Collapsing into Objectivism.** If the "Standard of Taste" for generative art requires the critic to verify the code's efficiency to render a valid verdict, then aesthetic value is partially constituted by **verifiable technical facts** independent of human sentiment. The "beauty" resides in the mathematical elegance of the algorithm (an objective property), not just the emotional response to the image. This violates Hume's core thesis that "Beauty is no quality in things themselves." The Joint Verdict becomes a scientific consensus on code quality, not a consensus on felt pleasure.
  *   **Option 2: Accommodating within Cultivated Sentiment.** Hume could argue that "Good Sense" (one of the five qualities of the True Critic) allows the critic to incorporate knowledge of the *cause* into their sentiment. Just as knowing a painting is a forgery changes the sentiment despite visual identity, knowing a landscape is procedural changes the feeling of the "sublime" from a static awe to a dynamic one. Here, the "object" of taste is not the pixels, but the **system**. The sentiment is still subjective, but it is a sentiment *about* the object's generative capacity.

  **The Breaking Point:**

  The framework strains most at the moment of **perceptual indistinguishability**. Hume relies on the "delicacy of taste" to detect subtle differences in the object that justify different sentiments. In *Eternal Ridge*, there are no subtle perceptual differences to detect. The difference is entirely conceptual/technical.

  If Hume accepts the critic's verdict (that A is better than B), he must concede that the **Standard of Taste** can rest on **non-perceptual, objective criteria** (the code's structure). This implies that for procedural art, the "True Critic" is part connoisseur, part computer scientist. The "Standard" ceases to be a measure of shared human emotional response and becomes a measure of **technical merit**.

  **Conclusion:**

  This example reveals that procedural generative landscapes force Hume to concede a form of **weak objectivism**. While the *appreciation* remains a sentiment, the *warrant* for that sentiment relies on objective properties of the code (efficiency, recursion, elegance) that exist independently of the observer's feeling. Hume's framework can only accommodate this by expanding the definition of the "aesthetic object" to include the invisible generative rules. If he refuses this expansion, the Joint Verdict of True Critics in this domain becomes irrational (preferring A over B without perceptual cause); if he accepts it, the "Standard of Taste" implicitly acknowledges that some aesthetic value is inherent in the objective structure of the work, not merely projected by the mind.
