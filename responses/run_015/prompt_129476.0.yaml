          *   *Materials:* Printer paper (timeline), index cards (events), markers, tape, sticky notes (for justification).
          *   *Roles:* Chronologer (checks dates), Archivist (holds cards), Negotiator (argues placement), Scribe (records score).
          *   *Incentive:* Bragging rights or "Historical Authority" tokens (fake currency for next week's advantage?). Let's use "Authority Points" redeemable for choosing the next topic or skipping a reading summary.
