          *   *Drafting:* Split into 4 teams of 4. Timeline on floor/wall. 3 Anchor Zones marked. Event cards distributed. Goal: Maximize "Coherence Score." Score = points for being in a zone + bonus points for every other card within 6 inches. But here's the twist: The Anchor Zones emit "pull." If you place a card near an Anchor, it gets base points. If you place it near another card *already* in that zone, it gets more. This encourages clustering even if the event doesn't fit historically.
          *   *Refining for word count:* Keep it tight. Focus on the mechanic of clustering vs. accuracy.

