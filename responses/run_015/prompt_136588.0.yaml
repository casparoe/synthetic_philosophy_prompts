answer: |-
  ### Preliminary Conceptual Mapping

  Before specifying the desiderata, we must acknowledge the dual position you occupy: you are a victim of *capital mobility* (displacement via sale/conversion) and now a trustee of *territorial closure* (council member facing exclusionary pressure). Any theory that solves only one side of this equation will fail you. A theory that prioritizes supply without tenure security justifies your eviction. A theory that prioritizes local control without regional obligation justifies your neighbors' exclusion.

  The core moral phenomenon here is **the separation of stake from title**. Current zoning regimes conflate the right to *own* a specific parcel with the right to *inhabit* a neighborhood and the right to *govern* its future. Your displacement proves these are distinct. Your council work proves they are politically entangled.

  Below are the six desiderata for an adequate theory of residential entitlement.

  ---

  ### The Desiderata of Residential Entitlement

  #### 1. The Decoupling of Residence from Exclusion
  *   **The Requirement:** A theory must distinguish between a **right to remain** (security of tenure for existing residents) and a **right to exclude** (the power of owners or locals to prevent new entry). It must affirm the former while severely constraining the latter.
  *   **Motivating Case:** Your displacement. The market treated the building as a pure asset (right to sell/convert), ignoring the social fact of your residence. Conversely, your neighbors treat the neighborhood as a club (right to exclude infill), ignoring the regional need for housing. Collapsing these rights means either you are evicted for "property freedom" or outsiders are barred for "community stability."
  *   **Status:** **Non-Negotiable.** Any theory that treats the right to exclude as absolute fails the test of basic habitation security. Any theory that treats the right to remain as absolute freezes the city against all change.
  *   **Conceptual Work:** We must redefine property not as a "bundle of rights" centered on the owner, but as a "bundle of relationships" centered on the inhabitant. The right to exclude is a state-granted privilege, not a natural right, and must be justified by public good, not private preference.

  #### 2. The Unbundling of Exclusionary Amenities
  *   **The Requirement:** The theory must dissolve the link between private land ownership and access to public goods (schools, parks, transit). Access to opportunity cannot be rationed by low-density zoning.
  *   **Motivating Case:** "Exclusionary amenity bundling." When a neighborhood zones for single-family homes near a new transit line, they are effectively privatizing the transit investment. They capture the public value (access) while using zoning to prevent the public cost (density). This turns public infrastructure into a private club membership.
  *   **Status:** **Non-Negotiable (Distributive Justice).** If public goods are funded collectively, their access cannot be restricted by local land-use veto.
  *   **Conceptual Work:** This requires treating zoning near public investment as a form of **opportunity hoarding**. The theory must mandate that increased public value (e.g., a new train station) triggers a mandatory increase in private capacity (density) to prevent rent-seeking by existing owners.

  #### 3. The Boundary Problem: Local Democracy vs. Regional Obligation
  *   **The Requirement:** The theory must adjudicate the conflict between a neighborhood's desire for self-determination and the region's need for housing mobility. It must specify *who* constitutes the "demos" for land-use decisions.
  *   **Motivating Case:** Your council meetings. The "community" voting on infill is only the *current* community. Future residents, regional workers, and displaced households have no vote. If the demos is local, exclusion is the rational choice. If the demos is regional, local autonomy is violated.
  *   **Status:** **Structurally Tensioned (Likely Unsatisfiable Pair).** Full satisfaction of both unrestricted local veto power and full regional accommodation is logically impossible under standard democratic assumptions.
  *   **Conceptual Work:** The theory must reject the "local veto." It cannot deliver both. It must prioritize **regional entitlement** over local aesthetic preference, while preserving local input on *design* but not *capacity*. This is the hardest institutional design challenge: creating a democracy that represents people who do not yet live there.

  #### 4. Economic Consistency Without Reductionism
  *   **The Requirement:** The theory must account for supply constraints, filtering, and induced demand, but cannot reduce justice to market efficiency. It must acknowledge that "supply solves all" is temporally mismatched with "eviction happens now."
  *   **Motivating Case:** The YIMBY argument that "more supply lowers rents" is true in the long run but false for the household evicted today to build that supply. A theory of justice cannot ask the displaced to suffer for the aggregate good without restitution.
  *   **Status:** **Non-Negotiable (Material Reality).** Ignoring economics leads to unbuildable mandates. Ignoring justice leads to brutalist displacement.
  *   **Conceptual Work:** We need a **time-sensitive justice metric**. Short-term protection (anti-displacement) is weighted heavier than long-term efficiency (price reduction). The theory must mandate that the costs of transition (construction/displacement) are not borne solely by the most vulnerable.

  #### 5. Intergenerational Equity vs. Spatial Lock-In
  *   **The Requirement:** The theory must weigh the claims of future residents against the accumulated equity of current homeowners. It must treat "spatial lock-in" (using zoning to preserve property values) as a form of intergenerational debt.
  *   **Motivating Case:** Older homeowners arguing for "stability" are often protecting the appreciation of their largest asset. This locks out younger generations and lower-income households from accessing the same opportunity ladder.
  *   **Status:** **Non-Negotiable (Temporal Justice).** A polity cannot allow the living to mortgage the future's capacity to inhabit the city.
  *   **Conceptual Work:** Property value appreciation derived from regulatory scarcity (zoning) is an **unearned windfall**. The theory must treat this as a public asset that can be taxed or regulated away, rather than a private right that must be protected.

  #### 6. The Preservation/Exclusion Distinction
  *   **The Requirement:** A clear heuristic to distinguish legitimate preservation (protecting vulnerable people, ecological limits, or genuine historical commons) from illegitimate exclusion (protecting aesthetics, scale, or property values).
  *   **Motivating Case:** Neighbors invoking "neighborhood character." Often, this is code for maintaining class/racial homogeneity. However, sometimes "scale" matters for sunlight or genuine social fabric.
  *   **Status:** **Camp-Specific Preference (Operationalization).** While the distinction is necessary, where the line is drawn varies by ideology.
  *   **Conceptual Work:** The test must be **displacement impact**. If "preservation" protects buildings but displaces people, it is illegitimate. If "preservation" protects people (tenants) but allows buildings to change, it is legitimate. Aesthetics cannot trump habitation.

  ---

  ### The Structural Impossibility: Requirement 3

  The single requirement that does the most damage to popular competing theories is **Requirement 3 (Local Democracy vs. Regional Obligation)**.

  This is the "Boundary Problem." It exposes that standard democratic theory breaks down at the city limit.
  *   **Market-Libertarians** fail here because they treat zoning as a private covenant. They allow the local "club" to exclude entirely, satisfying local democracy but violating regional obligation.
  *   **Progressive Inclusionary** models fail here because they usually impose state mandates to satisfy regional needs, which inherently overrides local democratic control. They solve the housing crisis by suspending the local democracy you sit on.
  *   **Lefebvrian Participatory** models fail here because "participation" is usually bounded by the existing neighborhood. Giving existing residents more power to "produce space" often results in *more* exclusion (NIMBYism), not less, because the "people" participating are the ones already inside the gate.

  Requirement 3 forces us to admit that **we cannot have a purely local democracy over land use.** If we do, exclusion is the rational outcome. To satisfy regional obligation, the "demos" must be expanded regionally, which feels like a violation of local autonomy to your neighbors. This is the hardest conceptual work: legitimizing a authority that represents the outsider.

  ---

  ### Scoring the Competing Theories

  Here is how the three dominant frameworks score against the six desiderata.

  | Desiderata | **Market-Libertarian** (Zoning as Property/Covenant) | **Progressive Inclusionary** (State Mandates + Safeguards) | **Lefebvrian Participatory** (Right to Produce Space) |
  | :--- | :--- | :--- | :--- |
  | **1. Residence vs. Exclude** | **FAIL.** Treats exclusion as a core property right. Your displacement is a feature, not a bug. | **PASS.** Prioritizes tenure security and anti-displacement, though sometimes struggles with the "right to exclude" newcomers. | **MIXED.** Prioritizes residence, but often defines "community" in ways that exclude outsiders. |
  | **2. Amenity Bundling** | **FAIL.** Views amenity access as a function of land value. Supports the "club" model. | **PASS.** Explicitly targets opportunity hoarding via inclusionary zoning and fair share housing. | **PASS.** Views amenities as common goods, though lacks mechanism to unbundle them. |
  | **3. Local vs. Regional** | **FAIL.** Absolute local control (private covenant) creates regional segregation. | **MIXED.** Solves regional need via state override, but damages local democratic legitimacy. | **FAIL.** Hyper-local focus often reinforces neighborhood boundaries against regional flow. |
  | **4. Economic Consistency** | **PASS.** Consistent with supply mechanics, but reduces justice to efficiency. | **MIXED.** Sometimes mandates costs that stall supply; strong on displacement costs. | **FAIL.** Often ignores economic constraints of development and financing. |
  | **5. Intergenerational** | **FAIL.** Protects accumulated equity (lock-in) as sacred property right. | **PASS.** Prioritizes future access over current windfall gains. | **PASS.** Focuses on future production of space, though vague on equity transfer. |
  | **6. Preservation vs. Exclusion** | **FAIL.** Cannot distinguish; aesthetics are property values. | **PASS.** Uses displacement impact as the metric for legitimacy. | **MIXED.** "Character" is often romanticized as social fabric, risking NIMBY capture. |

  ### Synthesis for the Council Member

  You are looking for a **Tenure-First Regionalism**.

  1.  **On your displacement:** The theory must validate that your right to *stay* was violated by a system that prioritized the owner's right to *cash out*. This means supporting **Tenant Opportunity to Purchase (TOPA)** or **Good Cause Eviction** laws. This addresses Requirement 1 and 4.
  2.  **On your council work:** The theory must validate that your neighbors' right to *exclude* is subordinate to the region's right to *house*. This means supporting **by-right density near transit** (Requirement 2) while fighting for **design input** rather than **capacity vetoes** (Requirement 3).
  3.  **The Hard Truth:** You cannot satisfy your neighbors' desire for "local control" and the region's need for "housing" simultaneously. Requirement 3 is the break-point. You must argue that **local democracy ends where regional exclusion begins.**

  The adequate theory is not a middle ground; it is a hierarchy.
  1.  **Right to Remain** (for existing vulnerable residents).
  2.  **Right to Access** (for regional outsiders).
  3.  **Right to Exclude** (only for genuine ecological/safety limits, never for aesthetics or value).
  4.  **Right to Profit** (subordinate to all above).

  This hierarchy resolves your dual position: it protects you from being displaced again (1), while mandating the infill your neighbors oppose (2), stripping them of the veto power they claim (3), and limiting the developer's right to convert without safeguards (4). It is not politically easy, but it is the only specification that does not collapse under the weight of your lived contradiction.
