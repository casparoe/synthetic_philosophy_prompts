answer: |-
  Here is the straight truth: You are both right, but you are arguing about two different operating systems for a country. It isn't just about words, but the words you are using ("useful," "power") are hiding the real philosophical split.

  Here is what is actually going on beneath the argument.

  ### 1. You define "useful" differently
  Your uncle defines "useful" as **active power**. To him, if you can't sign a law, veto a bill, or command the army, you are a prop. In a purely mechanical view of government, he is correct. The monarch is a zero in the equation of daily governance.

  You define "useful" as **passive stability**. You see the monarch as a "fire extinguisher." A fire extinguisher sits on the wall doing nothing for 50 years. It costs money to maintain. It has no active role. But if the kitchen catches fire (a constitutional crisis), it is the only thing that works. You value the *potential* power and the psychological weight of the office; he values the *actual* exercise of power.

  ### 2. The "Non-Elected" Question is the real core
  You asked if democracy needs a non-elected piece to stay stable. This is the deeper issue.

  In a republic (like the US, Germany, or France), the Head of State is usually a President. Even if they are ceremonial, they were often politicians before. They have a party, a past, and opponents.
  In a monarchy, the Head of State is trained from birth to be neutral. They don't vote. They don't campaign.

  **The argument here is about "The State" vs. "The Government."**
  *   **The Government** changes every few years (Prime Ministers, Presidents, Parties). They fight, they argue, they represent half the country.
  *   **The State** is the permanent entity. The Monarch represents the *whole* nation across time, not just the voters of the current election.

  Your uncle thinks a court or a constitution can do this job. You think a human symbol does it better. History suggests that in times of extreme crisis (like a coup attempt or a hung parliament), having a single neutral figure who stands *above* politics can untangle knots that judges (who are slow) or politicians (who are biased) cannot.

  ### 3. Why a Crown and not a Court?
  Your uncle asks: *"Why that needs a crown instead of a court."*
  This is a strong point, but here is the counter: Courts interpret the law; they don't embody the nation.
  *   **Courts** are reactive. They wait for a case to be brought to them.
  *   **Monarchs** are proactive symbols. They visit hospitals, meet foreign leaders, and sign treaties *before* there is a legal dispute.

  The "Crown" provides a human face to the abstract idea of the country. It creates a sense of continuity. Politicians come and go; the King remains. For many people, that psychological continuity makes the democracy feel more stable, less like a temporary experiment. It's the "software" of national identity. Your uncle thinks that software is bloatware; you think it's the operating system.

  ### 4. Is it just gut feeling?
  Mostly, yes. But it's an educated gut feeling.
  *   **Your gut** tells you that humans need myths and symbols to bind them together, and a monarchy provides a "safe" myth that doesn't involve a dictator.
  *   **His gut** tells you that equality is the highest virtue, and having a family born into privilege contradicts the very idea of democracy.

  You cannot prove him wrong with data, because the "benefit" of a monarchy is the *absence* of crises that never happened. How do you measure a coup that didn't happen because the General respected the King? You can't.

  ### 5. Can you move past this, or are you stuck?
  You are stuck only if you keep trying to prove the other person wrong on their own terms. You will never agree on whether they are "useful" because you value different outcomes.

  **To break the loop, change the question.**
  Stop asking: *"Do they have power?"* (He wins that one).
  Stop asking: *"Are they symbolic?"* (You win that one).

  **Start asking:** *"Is the cost of the symbol worth the stability it buys?"*
  *   **His argument:** The cost (money + inequality) is too high for a symbol. We can have stability with a strong constitution and a ceremonial president. (Look at Germany or Ireland; they are stable without kings).
  *   **Your argument:** The cost is low compared to the risk. The monarchy acts as a "circuit breaker" in politics that a president might trip because of partisan baggage.

  **The Verdict:**
  This isn't a factual disagreement; it's a **values disagreement**.
  *   He values **Equality and Efficiency**.
  *   You value **Continuity and Neutrality**.

  Neither side can "win" because both are valid ways to run a country. The UK and Sweden choose your way; Germany and Finland choose his way. Both are successful democracies.

  **How to end the argument:**
  Tell him: *"You're right that they don't make laws. I'm right that they might prevent the people who make laws from breaking the system. We just disagree on whether we need a human safety valve or if the law is enough."*

  That acknowledges his logic without giving up your point. It moves the fight from "Are they useless?" to "What kind of insurance policy do we want?" That is a much better conversation.
