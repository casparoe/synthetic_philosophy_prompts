  # THE IMMIGRATION DECISION TREE
  **Root Commitment:** *We agree it is not wrong to exclude someone who truthfully announces they intend to burn down the parliament and shoot the people inside.*

  **Q1. The Departure Test:** If a state claims the right to keep people out, must it also allow its own citizens to leave without penalty or loss of citizenship?
  *   **No:** → **Leaf 1: Outright Sovereignty**
  *   **Yes:** → Go to Q2.

  **Q2. The Remedial Limit:** Is the *only* permissible reason for exclusion the prevention of direct harm (violence/crime), excluding economic or cultural concerns?
  *   **Yes:** → **Leaf 2: Remedial-Only View**
  *   **No:** → Go to Q3.

  **Q3. The Club & Conditions Test:** Is it permissible to exclude a Retiree who is a net fiscal positive to protect welfare rates, OR admit a Worker on conditions (5 years, no vote, no benefits)?
  *   **Yes:** → **Leaf 3: Welfare-State-as-Club**
  *   **No:** → Go to Q4.

  **Q4. The Associative Invite:** If a clear majority votes to admit a Doctor with a job offer, can a single citizen object "I don't want to associate with them" and block it?
  *   **Yes (Veto Holds):** → **Leaf 4: Open Borders (Associative Freedom)** *[See Collision Note A]*
  *   **No (Veto Fails):** → Go to Q5.

  **Q5. The Auction Model:** Should the state admit *anyone* willing to pay a price that fully compensates current members for any loss?
  *   **Yes:** → **Leaf 5: The Auction Variant**
  *   **No:** → Go to Q6.

  **Q6. The Rate of Arrival:** Is there a moral difference between admitting 10 million people at once versus the same 10 million spread over 40 years?
  *   **No (Rate Irrelevant):** → **Leaf 6: Open Borders (Priority-to-Worst-Off)** *[See Collision Note A]*
  *   **Yes (Capacity Matters):** → Go to Q7.

  **Q7. The Voting Objection:** Can you exclude a Famine Refugee specifically because they will vote for policies that leave existing citizens economically worse off?
  *   **Yes:** → **Leaf 7: Democratic Self-Protection (Unnamed)**
  *   **No:** → Go to Q8.

  **Q8. The Secession Test:** Can a group buy an empty region, move in, and secede to form their own state?
  *   **Yes:** → **Leaf 8: Secession-Friendly Sovereignty**
  *   **No:** → Go to Q9.

  **Q9. The Ancestral Claim:** Do descendants (6 generations) of people driven off that land have a stronger right to enter than a Famine Refugee with no prior tie?
  *   **Yes:** → **Leaf 9: Restorative Sovereignty (Unnamed)**
  *   **No:** → Go to Q10.

  **Q10. The Selection Method:** Once the state decides how many to admit, is it permissible to use a Points System (merit) rather than a Lottery?
  *   **Yes:** → **Leaf 10: National Self-Determination** *[See Collision Note B]*
  *   **No:** → **Leaf 11: Egalitarian Sovereignty (Unnamed)**

  *(Note: To reach 12 leaves, Q4 "Yes" branches to Q4b: "Is this invite enforceable against the state?" Yes→Leaf 4, No→Leaf 12: Moral Permission Only (Unnamed))*

  ***

  ### THE LEAVES: LABELS & AWKWARD COMMITMENTS

  1.  **Outright Sovereignty:** Can exclude anyone for any reason (or no reason).
      *   *Awkward Commitment:* Must defend excluding the Famine Refugee even if the state bans its own citizens from leaving.
  2.  **Remedial-Only View:** May exclude threats and nobody else.
      *   *Awkward Commitment:* Must admit the 10 million arrivals at once if they are not violent, regardless of economic collapse.
  3.  **Welfare-State-as-Club:** Membership is a good to be protected from dilution.
      *   *Awkward Commitment:* Must exclude the net-positive Retiree if their presence lowers the average benefit payout per capita.
  4.  **Open Borders (Associative Freedom):** Individuals hold the right to invite; the state is merely an administrator.
      *   *Awkward Commitment:* Cannot stop a citizen from inviting a violent threat if the citizen claims "associative freedom" covers risk-taking.
  5.  **The Auction Variant:** Borders are permeable to capital that compensates locals.
      *   *Awkward Commitment:* A billionaire criminal may enter if they pay enough to offset the risk cost to every citizen.
  6.  **Open Borders (Priority-to-Worst-Off):** Global justice overrides local capacity concerns.
      *   *Awkward Commitment:* Must admit the 10 million at once, even if it temporarily crashes the housing market for the existing poor.
  7.  **Democratic Self-Protection (Unnamed):** The existing demos may protect its policy outcomes.
      *   *Awkward Commitment:* May exclude the Famine Refugee specifically because they might vote for higher taxes.
  8.  **Secession-Friendly Sovereignty:** Territory is alienable if purchased.
      *   *Awkward Commitment:* Must allow a foreign power to buy a province and legally secede if they have the funds.
  9.  **Restorative Sovereignty (Unnamed):** Historical injustice creates specific entry rights.
      *   *Awkward Commitment:* Must admit the 6th-generation descendant over the immediate Famine Refugee, even if the descendant is wealthy.
  10. **National Self-Determination:** The community decides its character and composition.
      *   *Awkward Commitment:* Must defend using a Points System that excludes the Famine Refugee in favor of the Doctor, purely based on economic utility.
  11. **Egalitarian Sovereignty (Unnamed):** The state controls numbers, but not identities.
      *   *Awkward Commitment:* Must use a Lottery to select migrants, potentially admitting violent criminals by chance if screening is imperfect.
  12. **Moral Permission Only (Unnamed):** Citizens may invite, but the state may refuse.
      *   *Awkward Commitment:* Asserts a right to associate that the state is under no obligation to facilitate physically.

  ***

  ### DEBATER'S NOTES: COLLISIONS & EMPTY CELLS

  **Collision Note A (The Open Borders Twins):**
  *Leaf 4 (Associative)* and *Leaf 6 (Priority)* often yield identical policy (open borders). They are only prised apart by the *Doctor vs. Refugee* case. Leaf 4 admits the Doctor because a citizen invited them; Leaf 6 admits the Refugee because they are worse off, even if no one invited them. If you support both invitations and priority, you collapse into a single "Full Open Borders" position.

  **Collision Note B (The Sovereignty Twins):**
  *Leaf 10 (National Self-Determination)* and the *Libertarian Association* story (often found at Leaf 4's "No" branch) answer almost every case identically (admit the Doctor, exclude the Refugee). They are genuinely one leaf wearing different clothes unless you introduce the *Secession* case (Leaf 8). Libertarians often support secession; National Self-Determination theorists usually do not.

  **Empty Cell Flag (The Incoherent Veto):**
  If you answered **Yes** to Q4 (Individual Veto) but **No** to Q2 (Remedial Limit), you occupy a rare cell. You believe a single person can block a migrant for *any* reason, but the state cannot exclude for *economic* reasons. This is likely **incoherent**: if the individual can veto for economic reasons, the state effectively has that power too. This cell is usually empty because people don't want the responsibility of a veto without the justification of harm.

  **Empty Cell Flag (The Unattractive Lottery):**
  *Leaf 11 (Egalitarian Sovereignty)* is rarely occupied. It requires believing the state has a right to control *numbers* (Q6 Yes) but no right to control *identities* (Q10 No). This is **unattractive** to almost all theorists: nationalists want to choose merit, and cosmopolitans want to choose need. A pure lottery satisfies neither.
