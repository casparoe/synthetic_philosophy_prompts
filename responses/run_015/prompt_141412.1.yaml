answer: |-
  You are right to feel that friction. You are standing at the exact point where human institutions grind against the physical substrate of the world. Your brother-in-law is describing the universe as it *is* (or as our best models describe it); you are describing the universe as we *manage* it. The friction isn't a bug in your job; it's the feature of law.

  You asked me to carve the practice apart before reconstructing it. Let's do that. We need to separate the rules you handle into three buckets: those that track **causality**, those that track **administration**, and those that track **intent**. Once we separate those, we can see which ones actually care about the metaphysics of time and which ones are just using time as a filing system.

  ### 1. The Asymmetry: Probate vs. Insurance

  First, let's clear up the asymmetry that bothers you. It looks like a contradiction about time, but it is actually a contradiction about *asset flow*.

  **The Probate Rule (The 120-Hour Standard)**
  You mentioned the Uniform Simultaneous Death Act. In practice, there are two versions of this rule you encounter.
  *   **The Evidentiary Rule:** If there is *no sufficient evidence* that two people died other than simultaneously, the law presumes they died at the same instant. This is purely about evidence. If the fire burned the records, we can't know.
  *   **The Survival Clause:** Many wills now include a clause saying, "My beneficiary must survive me by 120 hours." This *does* apply even if we know the beneficiary died 10 hours after the testator.

  *Why?* It's not about the truth of death. It's about **double administration**. If a husband dies, leaves everything to his wife, and she dies 10 hours later, his assets vest in her estate. Her estate then has to be probated to pass those same assets to her children. That means two sets of court fees, two sets of executor commissions, and potentially two estate tax events. The 120-hour rule shortcuts this. It treats the wife as having predeceased the husband so the assets skip her estate and go directly to the children.
  *   **Time Need:** This rule does *not* need absolute time. It needs a **conventional cutoff**. It is a "safe harbor." It says, "For the purpose of keeping costs down, we will treat any death within this window as simultaneous." It is a policy choice, not a metaphysical claim.

  **The Insurance Rule**
  Life insurance is a contract, not a probate asset. The default presumption (often codified in insurance codes) is that if the insured and beneficiary die simultaneously, the **insured is presumed to have survived the beneficiary**.
  *   **Why?** The goal here is usually to keep the money out of the *beneficiary's* estate and return it to the *insured's* estate (or contingent beneficiaries). Insurance companies want to avoid paying out to a beneficiary's estate where the heirs might be disputed, creditors might be lurking, or divorce settlements might intercept the funds. By presuming the beneficiary died first, the money stays in the insured's control sphere.
  *   **Time Need:** Again, this is not a claim about physics. It is a **default allocation rule**. It invents an order of death not to satisfy a clock, but to satisfy a distribution hierarchy.

  **The Carving:** Neither of these rules presupposes an absolute fact of the matter about who died first. They both use time as a **proxy for intent and efficiency**. The asymmetry exists because probate courts want to minimize administration steps, while insurance contracts want to minimize claim disputes. They are solving different logistical problems using the same temporal vocabulary.

  ### 2. The Relativity Problem: Cleveland vs. Mars

  Now to your hypothetical. Cleveland hospital death logged at 12:00:00. Mars station death logged at 12:00:30. Light lag is 10 minutes. Your brother-in-law is correct: in Special Relativity, these events are "spacelike separated." There is no frame-independent fact about which happened first. An observer moving toward Mars might say Mars died first; an observer moving toward Cleveland might say Cleveland died first.

  Does the law break here? No. Here is why.

  **Legal Time is Institutional, Not Physical**
  The law does not operate on "proper time" (the time measured by a clock moving with the observer). It operates on **Coordinate Time** agreed upon by the jurisdiction.
  *   When you file a document, you don't file it in "your local inertial frame." You file it according to the court's clock.
  *   When a death is recorded, it is recorded according to the time zone of the jurisdiction where the death occurred, synchronized to a standard (usually UTC or local civil time).

  **The "Fact" of Death**
  For the law, the "fact" of death is not the biological cessation of function in the abstract; it is the **creation of a valid record**.
  *   In your Mars/Cleveland case, the law would not ask, "Who *really* died first in the block universe?"
  *   The law would ask, "What do the certified death certificates say, adjusted to the standard time of the forum?"
  *   If the Cleveland certificate says 12:00:00 and the Mars certificate says 12:00:30 (adjusted to the same coordinate system), the court treats the Cleveland death as first.

  **Why Relativity Doesn't Matter Practically**
  Relativistic time dilation only becomes significant at speeds approaching light or in extreme gravity. For a human traveling from Earth to Mars, the time discrepancy between their wristwatch and Earth time is milliseconds, not seconds. The 30-second difference in your example is a synchronization convention issue, not a relativistic one.
  *   **The Legal Fix:** The law resolves this by **stipulation**. Jurisdictions already deal with time zones. If a will is probated in Ohio, Ohio time governs. If the Mars station is under US jurisdiction, there is a designated time zone for that station (likely Houston or UTC).
  *   **The Metaphysical Point:** The law presupposes a **single reference frame** for the purpose of the proceeding. It does not need that frame to be the "true" frame of the universe. It only needs it to be the **authoritative** frame for the court.

  So, to answer your question: The law does not presuppose an absolute, frame-independent fact. It presupposes a **conventional, jurisdiction-bound fact**. It creates the "absolute" time it needs by fiat. If the physics says "that's not truly simultaneous," the law replies, "It is for the purpose of this estate."

  ### 3. The Block Universe and the Open Future

  This is the deepest cut. Your brother-in-law argues for Eternalism (the Block Universe): the past, present, and future all exist equally. Your niece's death in 2055 is "already there."
  You are worried about laws that seem to need an **Open Future** (Presentism): statutes that take effect next January, sentencing meant to deter, wills that dispose of property "after my death."

  If the future is fixed, how can a law "take effect" later? How can sentencing "deter" if the crime is already written in the block?

  **Law is Indexical, Not Ontological**
  Legal language is full of indexicals: words like "I," "Here," "Now," "Next Year."
  *   In a Block Universe, "Now" just means "the time-slice where the speaker is located."
  *   "Next January" just means "the January time-slice adjacent to the current one in the forward direction of entropy."

  The law does not require the future to be *ontologically open* (undetermined). It requires the future to be **epistemically open** (unknown to the agents).
  *   **Deterrence:** Even if the future is fixed, the *threat of punishment* is part of the causal chain that leads to the future. The statute exists at Time A. The potential criminal reads it at Time A. The fear enters their calculation at Time A. The crime (or lack thereof) happens at Time B. The causal link holds regardless of whether Time B "already exists" from a God's-eye view. The criminal doesn't have access to the Block; they only have access to their local "now."
  *   **Statutes Taking Effect:** A statute saying "Effective Jan 1, 2025" is just a coordinate marker. It tells agents, "If your action is located in the block after this coordinate, this rule applies." It doesn't require the future to be created; it just requires the rule to be indexed to a location.
  *   **Wills:** "From and after my death" is the same. It points to the time-slice of the testator's biological cessation. The property rights transfer at that coordinate.

  **What Would Actually Break?**
  If we took the physics seriously, very little in your daily work would change. However, there are two narrow areas where the metaphysics bites harder:

  1.  **Causality in Slayer Statutes:** You mentioned the rule that a killer cannot inherit. This relies on **causal priority**. The killing must cause the death. In the Block Universe, causality is still preserved (cause precedes effect within the light cone). As long as the killing and death are "timelike separated" (one *must* precede the other in all frames), the law is safe. Your Mars/Cleveland case is "spacelike," which is why it's tricky, but a murder is almost always local. The gun fires, the heart stops. That order is invariant. The law is safe here.
  2.  **Revocation and Amendment:** This is the only place where the "Open Future" feels necessary. When you allow a testator to revoke a will, you are presupposing they have the *power* to change the future distribution. In a strict Block Universe, they never had the power to do otherwise; they were always going to revoke (or not).
      *   *Does this break the law?* No. Because the law regulates the **process**, not the metaphysical possibility. The court checks: "Did they execute a revocation document?" If yes, the will is revoked. Whether they "could have done otherwise" in a metaphysical sense is irrelevant to the filing clerk. The law assumes **agency**, not **metaphysical indeterminism**. As long as the agent *feels* free and the system *treats* them as free, the machinery works.

  ### 4. The Reconstruction: What Depends on What?

  Here is the carving you asked for. We can divide your work into three layers based on their time-needs.

  **Layer 1: The Administrative Layer (Conventional Time)**
  *   *Rules:* Filing deadlines, 120-hour survival clauses, tax valuation dates, "effective Jan 1" statutes.
  *   *Time Need:* **None.** These rules create their own time. They are like the rules of chess. "A move happens when the piece is touched." It doesn't matter what time it is in the universe; it matters what the rules say counts as a move.
  *   *Impact of Physics:* Zero. You can keep using time zones and court clocks. The law *stipulates* the reference frame.

  **Layer 2: The Evidentiary Layer (Recorded Time)**
  *   *Rules:* Determining who died first in a crash, insurance presumptions, death certificate timestamps.
  *   *Time Need:* **Synchronization.** This layer needs a shared standard of measurement, not a true metaphysical time.
  *   *Impact of Physics:* Negligible. As long as the clocks are synchronized to a civil standard (UTC), the relativistic discrepancies between Earth and Mars are legally moot. The law accepts the **record** as the **fact**. If the record says 12:00 and 12:30, that is the legal truth, even if a passing spaceship disagrees.

  **Layer 3: The Causal Layer (Physical Time)**
  *   *Rules:* Slayer statutes (killing causes death), capacity (mental state at the moment of signing), duress.
  *   *Time Need:* **Invariant Causality.** This layer requires that cause precedes effect in all reference frames (timelike separation).
  *   *Impact of Physics:* This is the only vulnerable spot. If you ever have a case where a "killing" and a "death" are spacelike separated (perhaps a remote drone strike from Mars?), you would have a genuine legal crisis about whether the murder statute applies. But for probate? For inheritance? This layer is robust. Biological death and the signing of wills are local events. They are not spacelike separated from the witnesses or the testator.

  ### Summary for Your Sunday Dinner

  Your brother-in-law is right that there is no "master clock" in the universe. But he is wrong to think that breaks the law. The law doesn't use the universe's clock; it builds its own.

  *   **The Asymmetry:** It's not about time; it's about money. Probate wants to skip estates; insurance wants to control payouts. They use time presumptions as levers to move assets, not to describe reality.
  *   **The Mars Case:** The law doesn't need the "true" order. It needs the **recorded** order adjusted to the **jurisdiction's** time zone. Legal time is a convention, like driving on the right side of the road. It doesn't matter if it's "physically" better; it matters that we all agree on it.
  *   **The Block Universe:** The law works on **indexicals** ("now," "next year") and **epistemic uncertainty** (we don't know what you'll do). It doesn't require the future to be metaphysically open, only that agents act *as if* it is.

  You can tell him this: The law is not a theory of physics. It is a technology for coordinating human behavior. It runs on **institutional time**, which is immune to relativity because it is defined by the court, not the stars. Your filings are safe. The block universe can exist all it wants; the probate court still opens at 9:00 AM local time.
