  *   **Figure Format:** Each figure consists of exactly three elements: a **Container**, a **Contained**, and a **Distractor**.
  *   **Notation:** `Container[Shape, Size, Fill] $\subset$ Contained[Shape, Size, Fill]` + `Distractor[Shape, Size, Fill] | Pair`
      *   *Note:* The Distractor is always Disjoint ($|$) from the Container/Contained pair.

