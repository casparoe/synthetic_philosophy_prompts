  *Left Panel (6 Figures)*
  1.  `C[L,F] $\subset$ S[s,O]` + `T[s,O] | Pair`
  2.  `C[L,F] $\subset$ T[s,O]` + `S[s,O] | Pair`
  3.  `C[L,F] $\subset$ C[s,O]` + `T[s,O] | Pair`
  4.  `C[L,F] $\subset$ S[s,O]` + `C[s,O] | Pair`
  5.  `C[L,F] $\subset$ T[s,O]` + `C[s,O] | Pair`
  6.  `C[L,F] $\subset$ C[s,O]` + `S[s,O] | Pair`

  *Right Panel (6 Figures)*
  1.  `S[L,O] $\subset$ T[s,O]` + `C[s,F] | Pair`
  2.  `S[L,O] $\subset$ C[s,O]` + `T[s,F] | Pair`  *(Wait, T cannot be F if Circle $\leftrightarrow$ Filled correlation is to hold globally. Let's adjust.)*
      *   *Correction on Correlation:* To make the Shadow Rule robust, the correlation must hold across the whole set. **Constraint:** In these 12 figures, **all Circles are Filled** and **all Non-Circles are Outline**.
