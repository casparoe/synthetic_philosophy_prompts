      *   *Casaubon:* He represents the *dead* form of demythologizing. He seeks the Key but finds only death. Eliot distinguishes between *critical scholarship* (dry) and *sympathetic feeling* (warm). She isn't rejecting her past work, but warning against letting it kill the "reverence."
