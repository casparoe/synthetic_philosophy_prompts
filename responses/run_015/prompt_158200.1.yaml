      *   *Eppie's Refusal:* This is crucial. It's not just renunciation for duty's sake (Kant/Calvin). It's renunciation for *love* and *continuity*. It suggests the "structure" has changed from *submission* to *connection*.
      *   *Resistance:* The novel resists the idea that the structure is "freestanding." It argues the structure is *grown* from the soil of human need, not transplanted from theology.

