answer: |-
  Your suspicion is well-founded. The popular framing often conflates two distinct philosophical projects: **Brouwerian Intuitionism** (a specific philosophy of mathematics) and **Semantic Anti-Realism** (a broader theory of meaning and truth).

  To answer your core question directly: **Classical Intuitionism is rigorously confined to the mathematical domain.** A standard intuitionist does not necessarily suspend judgment on empirical propositions like the existence of microbial life on an exoplanet in the same way they do for Goldbach's conjecture. The rejection of the Law of Excluded Middle (LEM) is grounded in a specific ontology of *mathematical objects*, not a universal skepticism about all unknown facts.

  Here is a breakdown of the distinction to help you clarify the scope in your piece.

  ### 1. The Brouwerian Core: Ontology of Mathematical Objects
  L.E.J. Brouwer, the founder of intuitionism, grounded his logic in a specific metaphysical claim about what mathematics *is*. For Brouwer, mathematical objects are not pre-existing Platonic entities waiting to be discovered; they are **mental constructions** arising from the "primordial intuition of time."

  *   **Why LEM fails here:** In this view, a mathematical statement is true only if a mental construction (proof) exists, and false only if a contradiction can be constructed. For infinite domains (like the natural numbers), we cannot survey all instances. Therefore, the claim "Either $P$ is true or $P$ is false" presupposes that the truth value exists independently of our ability to construct it. Intuitionists deny this independence for math.
  *   **The Goldbach Case:** Goldbach's conjecture is not "unknown"; it is currently **undefined** in terms of truth value. It acquires a truth value only upon the completion of the mental act (proof or refutation).
  *   **The Boundary:** This ontology applies to *abstracta*. It relies on the idea that mathematical reality is created by the knowing subject. It does not inherently claim that *physical* reality is created by the subject in the same way.

  ### 2. The Broader Epistemic Reading: Semantic Anti-Realism
  The characterization you encountered—that one ought not assert what one cannot verify—is a generalization of intuitionism, most notably championed by **Michael Dummett** in the 1970s. Dummett argued that the intuitionistic critique of classical logic should apply to *any* discourse where truth conditions transcend verification conditions.

  *   **The Shift:** Dummett moved the debate from the *ontology of objects* (math vs. world) to the *theory of meaning*. He argued that if we understand meaning in terms of *assertibility conditions* (what warrants a claim) rather than *truth conditions* (how the world is), then intuitionistic logic applies everywhere.
  *   **The Exoplanet Case:** Under a strict Dummettian anti-realist framework, you would indeed have to suspend judgment on the exoplanet. To assert "There is life on Exoplanet X" is meaningless unless you possess (or can specify) the verification conditions. If the planet is causally disconnected from us (e.g., beyond the cosmological horizon), a strict anti-realist might say the statement lacks a truth value.
  *   **Distinction:** This is **not** standard Intuitionism; this is **Verificationism** or **Anti-Realism**. While historically descended from intuitionism, it is a broader philosophical stance that many intuitionist mathematicians do not subscribe to.

  ### 3. Why the Boundary Exists (and why it matters)
  You asked by what ontological distinction the boundary is drawn. For Brouwer and Heyting, the distinction lies in the **nature of the domain**:

  1.  **Mathematics:** The domain is internal to the mind. We have total access to the rules of construction, but we do not have total access to the infinite results of those rules. Hence, LEM fails for infinite totalities.
  2.  **Empirical Science:** The domain is external. While we may not *know* if microbes exist on an exoplanet, the intuitionist generally accepts that the physical world exists independently of the mathematician's mind. The proposition "There is life on X" is either true or false in the physical world, even if we lack the epistemic access to verify it *now*.

  **Crucially:** Most working mathematicians who utilize intuitionistic logic (e.g., in type theory or computer science) treat it as a formal tool for specific domains. They do not typically apply intuitionistic logic to their breakfast orders or astronomical data. To do so would require adopting a full-blown philosophical Anti-Realism, which is a much heavier lift than simply rejecting LEM for infinite sets.

  ### 4. Recommendations for Your Piece
  To avoid the misrepresentation you are worried about, I suggest the following distinctions in your writing:

  *   **Terminological Precision:** Reserve **"Intuitionism"** for the philosophy of mathematics (Brouwer/Heyting). Use **"Anti-Realism"** or **"Verificationism"** when discussing the broader epistemic principle that applies to empirical claims (Dummett/Logical Positivists).
  *   **Clarify the "Why":** Explain that the rejection of LEM in math is due to the **potential infinity** of mathematical objects (we cannot complete the survey), whereas skepticism about empirical claims is usually due to **causal/epistemic distance**.
  *   **Address the Slippage:** You can explicitly note that while Intuitionism *inspired* broader verificationist doctrines, the two are not identical. A mathematician can be an intuitionist about numbers and a realist about exoplanets without contradiction.

  **Summary for your draft:**
  The rejection of the Law of Excluded Middle is rigorously confined to abstract mathematical domains in standard Intuitionism. It is grounded in the claim that mathematical truth is *constituted* by proof. Extending this to empirical propositions (like the exoplanet) requires a further philosophical step—Semantic Anti-Realism—which claims that *all* truth is constituted by verification. Conflating the two obscures the specific ontological commitment that makes Intuitionism unique: the idea that mathematics is a free creation of the mind, not a description of an external reality.

  By keeping this distinction clear, you will accurately represent intuitionism as a specific doctrine about mathematical existence, rather than a general skepticism about the unknown.
