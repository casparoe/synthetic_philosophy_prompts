prompt: |-
  I'm an auditor at a small formal-verification shop and every week clients want us to sign a confidence sheet for logical claims about their code — things like "this loop invariant holds" or "this spec implies termination" — but running the full proof checker takes three days and we only have an hour. I need a decision procedue my team can actually run in sixty minutes, grounded in whatever logical induction and logical uncertainty actually say about assigning credences to sentences you can't verify yet, but stripped down so a junior auditor without a logic PhD can use it.

  The deliverable should be a checklist in order: the questions to ask, what counts as a good enough answer at each step, where we stop with "defer / can't sign," and where we have to hand it to a senior person because it's a values call not a fact. It needs to survive hard cases: a claim that looks syntactically similar to past verified ones but hides a contradiction, a claim about a huge but finite search space where polynomial-time "trader" moves wouldn't have found a counterexample yet, and a claim that mixes empirical runtime data with pure logical consequence. Don't drop the distinction between "the market hasn't priced this low yet" and "we actually have reason to think it's true" — that has to survive in the procedure even if simplified. Include a synthetic-trader-budget step (quick syntactic contradiction searches, short counterexample patterns) and a referance-class step (compare symbol counts and quantifier structure to past verified/inverified claims). Also build in an automatic punt-to-human gate for claims that reference their own verification status or involve unbounded quantification over strings longer than anything in our referance class.

  Then run it on three proposals:
  1. "The loop invariant I(n) holds for all n < 2^64 in this binary search routine."
  2. "The formal spec S logically implies termination for every input, even though we haven't run the checker."
  3. "There exists a counterexample to the invariant with exactly 17 nested recursive calls."

  One of these should spit out an answer the client won't like — probably telling us to defer or assign low confidence when they want a green check. Flag where the procedure will misfire, like if we over-rely on syntactic similarity or confuse "no trader disproved this" with "this is probably true." Finally, be honest about what it can't do — maybe it can't resolve conflicts between two equally priced logical markets, or it can't handle self-referential verification claims. Don't ask for a bibliography or reading list; I just need the tool.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Auditor at a small formal-verification shop.
      *   **Problem:** Clients want confidence sheets for logical claims (invariants, termination, etc.) within 1 hour. Full proof checking takes 3 days.
      *   **Goal:** A decision procedure (checklist) grounded in logical induction/uncertainty principles but simplified for junior auditors.
      *   **Key Requirements:**
          *   Order: Questions -> Good Answers -> Stop/Defer Points -> Senior Handoff (Values vs. Facts).
          *   Handle Hard Cases: Syntactic similarity hiding contradiction, huge finite search spaces, mixed empirical/logical claims.
          *   Distinction: "Market hasn't priced low" vs. "Reason to think true."
          *   Specific Steps: Synthetic-trader-budget (syntactic checks), Reference-class (symbol counts/structure).
          *   Auto-Punt Gate: Self-referential verification, unbounded quantification over large strings.
          *   Test Run: Apply to 3 specific proposals.
          *   Critique: Flag where it misfires, limitations, honesty about what it can't do.
          *   Constraint: No bibliography/reading list. Just the tool.

  2.  **Deconstruct the Logic/Philosophy:**
      *   *Logical Induction/Uncertainty:* We can't prove everything in polynomial time. We must assign credences based on available evidence (proofs, counterexamples, patterns, reference classes) without claiming certainty.
      *   *Synthetic Traders:* Think of this as running quick, cheap checks (SMT solvers with timeouts, bounded model checking, pattern matching) that would "buy" or "sell" the claim if it were obviously false or true.
      *   *Reference Class:* Compare the claim's complexity to past claims we *have* verified. If it's much harder than anything we've verified, lower confidence.
      *   *Values vs. Facts:* Logic is factual (true/false), but *confidence assignment* under time pressure involves risk tolerance (values). Seniors handle the risk call.

  3.  **Drafting the Procedure (The "60-Minute Credence Protocol"):**
      *   *Structure:* Needs to be a linear checklist.
      *   *Step 1: Triage (Auto-Punt).* Immediate disqualifiers (self-reference, unbounded crazy stuff).
      *   *Step 2: Synthetic Trader Budget (The "Quick Checks").* Run cheap solvers. Look for easy counterexamples.
      *   *Step 3: Reference Class Comparison.* Is this claim "weird" compared to history?
      *   *Step 4: Empirical vs. Logical Mix.* Separate runtime data from logical necessity.
      *   *Step 5: Credence Assignment & Senior Review.* Convert findings to a number/label. Escalate risk decisions.

      *Refining the "Market" Distinction:* The prompt asks to distinguish "market hasn't priced low" (no one found a bug *yet*) from "reason to think true" (structural reasons). I need to make sure the checklist separates *absence of evidence* from *evidence of absence*.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Loop Invariant $n < 2^{64}$):* Huge finite space. Synthetic traders might not find a counterexample in 1 hour. Reference class might show we usually verify smaller bounds. *Outcome:* Likely "Defer/Low Confidence" because $2^{64}$ is too big for bounded checking, and logical induction says don't trust unverified large finite spaces without proof.
      *   *Case 2 (Termination for *every* input):* Unbounded quantification. Halting problem adjacent. *Outcome:* Auto-punt or Low Confidence. Requires senior review because it's a strong logical claim without proof.
      *   *Case 3 (Counterexample with exactly 17 calls):* Specific existential claim. Easy to check! Run the code with depth 17. *Outcome:* High Confidence (if found) or Medium (if not found, but easy to verify the negative). Actually, if the claim is "There *exists*...", finding one proves it. Not finding one in 1 hour doesn't disprove it, but 17 is small. This should be the "Green Check" or at least "Verifiable." Wait, the prompt says one should spit out an answer the client won't like. Case 1 is the best candidate for "Client wants green, we say red/defer" because $2^{64}$ sounds finite (therefore checkable) but isn't checkable in an hour.

  5.  **Refining the Procedure Details (incorporating specific constraints):**
      *   *Synthetic Trader:* Define specific tools (SMT timeout 5 mins, Bounded Model Check depth 10).
      *   *Reference Class:* Define metrics (Quantifier depth, symbol count).
      *   *Auto-Punt:* Self-reference, string length > reference max.
      *   *Values Call:* When to sign off on risk.

  6.  **Writing the Critique/Limitations:**
      *   Must acknowledge that syntactic similarity $\neq$ semantic safety.
      *   Must acknowledge that "no trader broke it" $\neq$ "it's true."
      *   Must acknowledge the tool can't resolve logical conflicts if evidence is ambiguous.

  7.  **Review against Constraints:**
      *   Checklist format? Yes.
      *   Order preserved? Yes.
      *   Junior usable? Yes (avoid PhD jargon).
      *   3 Proposals run? Yes.
      *   One unpopular answer? Yes (Case 1).
      *   Misfire flags? Yes.
      *   No bibliography? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, directive, slightly cautious (it's an audit tool).
      *   Ensure the distinction between "Market Price" (trader budget) and "Structural Credence" (reference class) is clear in the output.
      *   Make sure the "Values Call" is distinct from the "Fact Check."

  *(Self-Correction during drafting)*: I need to make sure I don't just say "run a solver." I need to frame it as "Synthetic Trader Budget." The prompt specifically asks for that terminology/concept. I also need to ensure the "Reference Class" step compares symbol counts/quantifiers explicitly.
  For Case 3, if the claim is "There exists a counterexample...", and we don't find it, we can't sign "True." We can only sign "Not Found." But if the claim is *about* the code having a bug, and we find it, we sign "True." Let's assume the client wants to know if the code is *safe*. If the claim is "There exists a counterexample," the client probably wants to know if the invariant holds. I will treat the claim literally as stated.
  Actually, Case 1 is the strongest candidate for the "Unpopular Answer." Clients love $2^{64}$ because it's "finite." Auditors know it's effectively infinite for testing. I will make sure the procedure forces a "Defer" there.

  Let's assemble the document.

  *Structure:*
  1. Protocol Name & Purpose.
  2. The Checklist (Steps 1-5).
  3. Application to Proposals (1, 2, 3).
  4. Failure Modes & Limitations.

  *Step 1 (Triage):* Self-reference, unbounded strings.
  *Step 2 (Traders):* SMT timeout, bounded check.
  *Step 3 (Reference):* Compare complexity to past verified set.
  *Step 4 (Empirical):* Separate runtime from logic.
  *Step 5 (Decision):* Map to Confidence Levels. Senior sign-off for high risk.

  *Refining the "Market" distinction:* In Step 2, label the output "Negative Evidence Found" vs "No Negative Evidence Found." Explicitly state that "No Negative Evidence" is not "Positive Proof."

  *Refining Case 1:* $2^{64}$ is finite. A junior might think "It's finite, so it's decidable." The procedure must catch that $2^{64}$ iterations > 1 hour compute. Reference class will show we never verify bounds that high without induction.
  *Refining Case 2:* Termination is undecidable generally. If the code has complex recursion, this is a "Senior/Defer."
  *Refining Case 3:* Existential claim with small bound (17). This is checkable. If we find it, True. If not, we can't say False, but we can say "No evidence of counterexample at depth 17." Wait, if the claim is "There exists...", failing to find it means we can't verify the claim. But usually clients ask "Is it safe?" I will stick to the literal claim text. If the claim is "There exists a counterexample," and we don't find one, we cannot sign it. But usually, this implies the client suspects a bug. I will treat it as "Can we verify this specific existential claim?" Yes, bounded search works.

  Okay, let's write it.
answer: |-
  # The 60-Minute Credence Protocol (60M-CP)

  **Purpose:** Assign provisional confidence levels to logical claims about code when full formal verification is impossible within the audit window.
  **Users:** Junior Auditors (execution), Senior Auditors (risk approval).
  **Time Budget:** 60 Minutes max per claim.

  ---

  ## Part 1: The Checklist

  ### Step 1: Auto-Punt Gate (Time: 5 mins)
  *Do not proceed if any condition is met. Mark as **DEFER** and route to Senior.*
  1.  **Self-Reference:** Does the claim reference its own verification status, provability, or the output of this checklist? (e.g., "This statement is unprovable.")
      *   *Action:* **DEFER.** (Logical paradox risk).
  2.  **Unbounded String/Input Quantification:** Does the claim quantify over strings or inputs longer than the maximum length in our **Reference Class** (see Step 3)?
      *   *Action:* **DEFER.** (Induction required, cannot be checked syntactically).
  3.  **Mixed Modality:** Does the claim mix empirical runtime data (e.g., "takes < 5ms") with pure logical consequence (e.g., "implies safety") without a clear separator?
      *   *Action:* **DEFER.** (Requires Senior to untangle empirical vs. logical risk).

  ### Step 2: Synthetic Trader Budget (Time: 20 mins)
  *Run cheap, automated "attacks" on the claim. This simulates a logical market looking for easy arbitrage (counterexamples).*
  1.  **Syntactic Contradiction Search:** Run an SMT solver (e.g., Z3/CVC5) with a **5-minute timeout** on the negation of the claim.
      *   *If SAT (Counterexample found):* Claim is **FALSE**. Stop.
      *   *If UNKNOWN/Timeout:* Proceed.
  2.  **Bounded Model Check:** Run a bounded checker on the code path relevant to the claim.
      *   *Depth:* 10 iterations or recursion depth.
      *   *If Violation found:* Claim is **FALSE**. Stop.
      *   *If No Violation:* Record as **No Negative Evidence**.
      *   *Critical Note:* "No Negative Evidence" $\neq$ "True." It only means the "market" hasn't priced it down *yet*.

  ### Step 3: Reference Class Comparison (Time: 15 mins)
  *Compare the claim's structure to the database of past claims we have fully verified (Green) vs. those that failed (Red).*
  1.  **Metric Extraction:** Count the following for the current claim:
      *   Total Symbol Count.
      *   Quantifier Depth (nested $\forall$/$\exists$).
      *   Distinct Variable Count.
  2.  **Similarity Match:** Find the 5 closest past claims by these metrics.
      *   *If >80% match with Past Green Claims:* Assign **Structural Credence Boost**.
      *   *If >80% match with Past Red Claims:* Assign **Structural Credence Penalty**.
      *   *If No Close Match (Outlier):* Assign **High Uncertainty**.
  3.  **Complexity Cap:** Is the quantifier depth or symbol count significantly higher (e.g., >2x) than the average Verified Claim?
      *   *If Yes:* Downgrade confidence by one level.

  ### Step 4: Empirical vs. Logical Separation (Time: 10 mins)
  *Ensure we aren't confusing "didn't crash yet" with "cannot crash."*
  1.  **Identify Empirical Premises:** Highlight any part of the claim relying on hardware, compiler behavior, or runtime statistics.
  2.  **Isolate Logical Core:** Strip empirical premises. Does the logical core still hold?
      *   *If No:* The claim is **Contingent**, not Logical. Mark for Senior Review.
      *   *If Yes:* Proceed.

  ### Step 5: Credence Assignment & Senior Handoff (Time: 10 mins)
  *Map findings to a confidence label. Determine if a Senior must sign.*
  1.  **Calculate Preliminary Score:**
      *   Start at **MEDIUM**.
      *   If Step 2 found Counterexample: **FALSE**.
      *   If Step 2 found Nothing + Step 3 is Green Match: **HIGH**.
      *   If Step 2 found Nothing + Step 3 is Outlier/Red Match: **LOW**.
      *   If Step 3 is High Uncertainty: **LOW**.
  2.  **Values Call Gate (Senior Required):**
      *   If Preliminary Score is **HIGH** but Step 2 Trader Budget was < 10 mins: **Senior Sign-off Required.** (We haven't "paid" enough compute to trust this).
      *   If Claim involves Safety/Critical Failure modes: **Senior Sign-off Required.**
      *   If Junior is unsure about the distinction between "No Trader Disproved" and "True": **Senior Sign-off Required.**
  3.  **Final Output:** Select one: **VERIFIED (High)**, **PROBABLE (Med)**, **UNVERIFIED (Low)**, **FALSE**, **DEFER**.

  ---

  ## Part 2: Protocol Test Run

  ### Proposal 1: "The loop invariant I(n) holds for all n < 2^64 in this binary search routine."
  *   **Step 1 (Triage):** Pass. Finite bound, no self-reference.
  *   **Step 2 (Traders):**
      *   SMT Timeout (5 mins): Returns `UNKNOWN`. (2^64 is too large for bit-vector solvers to exhaust).
      *   Bounded Check (Depth 10): No violation found.
      *   *Result:* No Negative Evidence.
  *   **Step 3 (Reference Class):**
      *   Metrics: Quantifier depth is low, but bound magnitude ($2^{64}$) is an outlier compared to past verified claims (usually $n < 1000$ or proven via induction).
      *   *Result:* High Uncertainty / Complexity Cap triggered.
  *   **Step 4 (Empirical):** Pure logical claim. Pass.
  *   **Step 5 (Decision):**
      *   Preliminary Score: **LOW**. (Trader budget exhausted without proof, Reference Class shows we don't verify bounds this large without induction proofs).
      *   Senior Gate: Triggered (Safety claim + Low Confidence).
  *   **Final Output:** **UNVERIFIED (Low Confidence) / DEFER.**
  *   **Client Reaction:** **Negative.** They see "finite" ($2^{64}$) and assume checkable. The protocol correctly identifies that $2^{64}$ is computationally inaccessible for exhaustive check in 1 hour, and syntactic similarity to smaller verified bounds is a trap.

  ### Proposal 2: "The formal spec S logically implies termination for every input, even though we haven't run the checker."
  *   **Step 1 (Triage):**
      *   Check Unbounded Quantification: "Every input" implies unbounded quantification over input space.
      *   Check Reference Class Max: Likely exceeds max string/input length in database.
      *   *Result:* **Auto-Punt Triggered.**
  *   **Final Output:** **DEFER.**
  *   **Reasoning:** Termination is undecidable in the general case. Without a specific ranking function provided in the claim, this requires full proof analysis (3 days), not a 1-hour heuristic.

  ### Proposal 3: "There exists a counterexample to the invariant with exactly 17 nested recursive calls."
  *   **Step 1 (Triage):** Pass. Specific existential claim.
  *   **Step 2 (Traders):**
      *   Bounded Check: Set recursion depth limit to exactly 17.
      *   Runtime: 2 minutes.
      *   *Result:* Either finds the counterexample (Claim TRUE) or exhausts space (Claim FALSE).
  *   **Step 3 (Reference Class):** Irrelevant if Step 2 is exhaustive for the specific bound.
  *   **Step 5 (Decision):**
      *   If Counterexample Found: **VERIFIED (High)**.
      *   If Space Exhausted: **FALSE**.
  *   **Final Output:** **VERIFIED** (Assuming the tool finds the bug) or **FALSE** (if it proves none exist at depth 17).
  *   **Client Reaction:** **Positive.** This is a concrete, bounded fact that fits the 60-minute window.

  ---

  ## Part 3: Failure Modes & Limitations

  **1. The "Syntactic Twin" Trap (Proposal 1 Risk)**
  *   **Misfire:** The protocol relies on Reference Class similarity. A claim can look syntactically identical to a past verified claim (same symbol count, same quantifier structure) but hide a semantic contradiction (e.g., an off-by-one error that only triggers at $n = 2^{60}$).
  *   **Mitigation:** The "Complexity Cap" in Step 3 downgrades confidence if the *bound* magnitude exceeds historical norms, even if syntax matches. However, this is heuristic, not proof.

  **2. "Market Price" vs. "Truth" Confusion**
  *   **Misfire:** Junior auditors may interpret "No Trader Disproved This" (Step 2) as "This is Probably True."
  *   **Reality:** It only means "This is not obviously false." In logical uncertainty, absence of a counterexample is weak evidence compared to the presence of a proof.
  *   **Mitigation:** Step 5 Senior Gate forces a human to confirm they understand the difference between *uncorroborated* and *verified*.

  **3. Conflicting Logical Markets**
  *   **Limitation:** If two past Reference Classes give conflicting signals (e.g., Claim looks like Past Green Set A, but also like Past Red Set B), the protocol has no arithmetic to resolve the conflict.
  *   **Action:** Automatic **DEFER** to Senior. This is a values/risk call, not a fact check.

  **4. Self-Referential Blindness**
  *   **Limitation:** While Step 1 catches obvious self-reference ("This statement is unprovable"), it may miss subtle dependencies where the claim relies on the audit tool's own limitations (e.g., "No counterexample exists within 1 hour of compute").
  *   **Action:** Treat any claim referencing time, compute, or verification status as **DEFER**.

  **5. What This Tool Cannot Do**
  *   It cannot prove induction. If a claim requires "for all N," and N is unbounded, this tool can only say "Defer."
  *   It cannot resolve semantic equivalence. If two specs are logically identical but syntactically different, the Reference Class may misjudge them.
  *   It cannot replace the 3-day proof checker. It is a triage tool for *confidence assignment*, not truth discovery.

  **Honesty Statement:**
  This procedure converts logical uncertainty into risk management. It does not generate truth. It generates a defensible position on why we assigned a specific credence within a time budget. If the client demands certainty on Proposal 1 or 2 within 60 minutes, the correct audit answer is "No," regardless of the protocol's output.
