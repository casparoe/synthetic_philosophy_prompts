answer: |-
  Here is a specification for a positive illusionist theory, structured as a set of deliverables. I have integrated your specific sticking points and added the missing evolutionary and mechanistic requirements you requested.

  ### Specification for a Positive Illusionist Theory

  **1. The Error Mechanism (The "How")**
  *   **Requirement:** The theory must specify the computational or neural architecture that generates the representation of phenomenal properties. It cannot simply posit "misrepresentation" as a brute fact; it must detail the processing steps that transform physical/functional inputs into the output state that *seems* phenomenal.
  *   **Motivation:** Without a mechanism, illusionism is merely skepticism or eliminativism. To be a positive theory, it must explain the *production* of the seeming, not just deny the target.
  *   **Status:** **Non-Negotiable.**

  **2. Evolutionary Stability (The "Why")**
  *   **Requirement:** The theory must explain why natural selection tolerated a systematic, energy-costly misrepresentation of internal states. It must demonstrate either that the illusion is a side-effect of a highly adaptive trait (spandrel) or that the illusion itself confers a specific fitness advantage (e.g., data compression, privacy, or motivational force).
  *   **Motivation:** You noted the need to explain why selection tolerated the error. A pervasive, species-wide hallucination about one's own state is biologically suspicious unless it serves a function or is unavoidable.
  *   **Status:** **Non-Negotiable** (for a naturalistic theory).

  **3. Cognitive Impenetrability (Recalcitrance)**
  *   **Requirement:** The theory must explain why the illusion persists despite intellectual acceptance of illusionism. It must identify the module or process generating the "seeming" as encapsulated from higher-order belief revision.
  *   **Motivation:** As you noted, ordinary illusions (Müller-Lyer) weaken when understood. Phenomenal illusion does not. If the theory cannot explain this persistence, it fails to match the phenomenological data it seeks to explain.
  *   **Status:** **Non-Negotiable.**

  **4. Structural Isomorphism (Cartography)**
  *   **Requirement:** The theory must account for the precise mapping between the "quality space" of experience (e.g., red is more like orange than blue) and the "discrimination space" of functional capability. The misrepresentation must be shown to preserve the topology of the underlying functional states.
  *   **Motivation:** A random error would not mirror discrimination abilities so perfectly. The "lie" must be structured to support the organism's interaction with the world.
  *   **Status:** **Non-Negotiable.**

  **5. Causal Efficacy without Ontology (Reliability)**
  *   **Requirement:** The theory must provide a causal chain explaining how reports (e.g., "I am in pain") are reliably triggered by nociception and predict behavior, without the report referring to a genuine phenomenal property. The truth-condition of the report must be redefined functionally.
  *   **Motivation:** Psychophysics and medicine rely on these reports. If the reports are false, they should be noise. If they are reliable, the theory must explain what truth they *actually* track (e.g., damage avoidance dispositions) rather than what they *seem* to track (qualia).
  *   **Status:** **Non-Negotiable.**

  **6. Epistemic Containment**
  *   **Requirement:** The theory must delineate why the error is limited to phenomenal states and does not infect introspective access to propositional attitudes (beliefs, intentions). It must identify the specific feature of phenomenal concepts that makes them vulnerable to error, which is absent in functional/propositional concepts.
  *   **Motivation:** If we are wrong about *this*, why not *everything*? A theory that debunks all introspection is self-undermining (you can't trust the belief in illusionism).
  *   **Status:** **Non-Negotiable.**

  **7. Empirical Dissociation Prediction**
  *   **Requirement:** The theory should predict the possibility (or impossibility) of dissociating the "seeming" from the function. Specifically, it must take a stance on whether dampening the introspective self-model (removing the "what it is like") while leaving discrimination intact is physiologically possible.
  *   **Motivation:** You raised the case of the damped self-model. A robust theory should predict whether this state is achievable (confirming the separability of function and seeming) or incoherent (suggesting they are identical).
  *   **Status:** **Preference** (Some illusionists may argue the dissociation is conceptually impossible, others that it is an empirical target).

  **8. Target Specification (The Vocabulary Constraint)**
  *   **Requirement:** The theory must characterize the content of the illusion (what we are mistaken *about*) without presupposing the existence of the very thing being denied. It must point to the target of the error using only physical/functional vocabulary.
  *   **Motivation:** You asked if this is a genuine requirement. If the illusionist uses phenomenal terms to describe the illusion ("it seems like I have *qualia*"), they risk smuggling in the ontology they deny.
  *   **Status:** **Contested Preference** (Realists demand this as impossible; Illusionists argue it is a rhetorical hurdle, not a metaphysical one).

  ***

  ### Analysis of Constraints and Strategies

  **Which pair of requirements cannot be jointly satisfied?**
  **Structural Isomorphism (4)** and **Target Specification (8)**.
  If the "illusion" maps perfectly onto the functional discrimination space (Isomorphism), and we can only describe it using functional vocabulary (Target Specification), it becomes difficult to articulate *what the error is*. If the structure is identical and the vocabulary is functional, the distinction between "real functional state" and "illusory phenomenal state" collapses into a verbal dispute. To maintain the "error," one usually needs to imply a "simple, intrinsic quality" that the functional state lacks, but invoking that quality violates the Vocabulary Constraint.

  **Which single requirement excludes the most candidate theories?**
  **Target Specification (8).**
  Many physicalist theories (e.g., certain identity theories or neutral monisms) slide into illusionism but fail here because they rely on the listener grasping the "phenomenal concept" to understand what is being denied. A theory that cannot describe the object of the illusion without using phenomenal terms is arguably not a full explanation, yet almost all current attempts struggle to point to the "illusion" without saying "it seems like *this*," where *this* is ostensive.

  **How the three strategies fare:**

  *   **Locating the error in the Introspective Self-Model (e.g., Frankish):**
      *   *Fare:* Strong on **Mechanism** and **Recalcitrance** (encapsulated module), but struggles with **Target Specification**. It often relies on the reader understanding "quasi-phenomenal properties" which risks circularity.
  *   **Locating the error in the Concepts we deploy (e.g., Dennett):**
      *   *Fare:* Strong on **Containment** and **Vocabulary** (dissolves the problem by revising concepts), but weak on **Recalcitrance**. It is unclear why conceptual confusion would feel so visceral and survive philosophical correction.
  *   **Locating the error in our Reporting Practice (e.g., Carruthers/Behavioral):**
      *   *Fare:* Strong on **Reliability** and **Evolutionary Stability** (reports are for social coordination), but weak on **Cartography**. It struggles to explain why the *internal* structure of the seeming mirrors discrimination so finely if the report is primarily for external consumption.
