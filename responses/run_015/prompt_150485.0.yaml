      *   **Local vs. Global:** Locally (per revision), the fee increase > value of extra work (seems rational to accept). Globally (by month six), scope doubles, pay increases only 30% (seems irrational/undesirable).
      *   **Psychological Feature:** Shifting baseline (anchoring to the *current* contract, not the *original*).
      *   **Task:** Explain the rational failure (if any), distinguish established theory from disputed views, avoid presenting contested views as consensus, and use British English.

  2.  **Identify the Core Philosophical/Economic Concepts:**
      *   **The Sorites Paradox (Heap Paradox):** Small changes accumulating into a large, unacceptable change.
      *   **Hyperbolic Discounting / Time Inconsistency:** Valuing immediate gains over future costs.
      *   **Sunk Cost Fallacy / Status Quo Bias:** Once a change is accepted, it becomes the new normal.
      *   **Dynamic Inconsistency:** Preferences change over time in a way that makes the sequence of choices suboptimal.
      *   **The "Boiling Frog" Effect:** Gradual change goes unnoticed until it's too late.
      *   **Expected Utility Theory:** The standard model of rational choice.
      *   **Commitment Devices:** Strategies to bind future selves.

  3.  **Evaluate "Rationality" in this Context:**
      *   *Standard Economic View (Expected Utility):* If at every step $Marginal Benefit > Marginal Cost$, then accepting is rational *ex ante* at that moment. The problem is that the *total* utility at the end is lower than the initial contract. This suggests a failure of *dynamic consistency*.
      *   *Behavioural Economics View:* This is a classic example of bounded rationality, specifically related to framing and reference points (Prospect Theory).
      *   *Philosophical View:* This touches on agency, autonomy, and the constitution of the self over time (Parfit, Bratman).

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the scenario and identify the core tension (local rationality vs. global suboptimality).
      *   **The Structure of the Problem:** Define the logical form (Sorites, Dynamic Inconsistency).
      *   **Established Theory (Consensus):**
          *   Dynamic Inconsistency (Strotz, 1955).
