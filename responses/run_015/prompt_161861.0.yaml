answer: |-
  # SPECIES LISTING PANEL: DECISION PROCEDURE (SLP-DP v1.0)

  **Purpose:** To ensure decisions on Schedule listing are legally defensible, scientifically robust, and consistent across cases, explicitly separating scientific findings from policy values.

  **Authority:** Panel Chair. **Record:** Panel Secretary.

  ---

  ## PART 1: THE DECISION PROCEDURE

  ### Stage 1: Legal Threshold (The Lawyer)
  *These are hard gates. If failed, the proposal stops.*

  **Q1. Is there a validly publishedased scientific name available for the proposed unit?**
  *   **Sufficient Answer:** Yes, compliant with ICZN (animals) or ICN (plants/algae/fungi).
  *   **Supplier:** Taxonomist (verified by Lawyer).
  *   **Gate:** If **No**, proposal rejected. *Reason: The Schedule protects names, not unnamed populations.* (See Shape v).

  **Q2. Is the proposed unit diagnosable by a competent enforcement officer using reasonable means?**
  *   **Sufficient Answer:** Yes. Distinctive morphology, location, or phenology allows identification without destructive genetic testing.
  *   **Supplier:** Field Ecologist (confirmed by Lawyer).
  *   **Gate:** If **No**, proposal rejected. *Reason: Criminal law requires enforceability.* (Critical for Case 2).

  ### Stage 2: Scientific Distinctness (The Scientists)
  *This stage assesses biological reality. Conflicts are managed by the Conflict Rule (see Part 3).*

  **Q3. Do at least two independent lines of evidence (morphology, genetics, ecology, behaviour) indicate discontinuity from neighbouring populations?**
  *   **Sufficient Answer:** Yes. Evidence shows a break, not a gradient.
  *   **Supplier:** Taxonomist, Geneticist, Ecologist (Consensus or Majority).
  *   **Gate:** If **No**, proceed to Q4 (Incipient Divergence). If **Yes**, proceed to Q5.

  **Q4. (For Incipient Divergence / Shape iii) Is there evidence of ongoing separation that may lead to discontinuity within a measurable timeframe?**
  *   **Sufficient Answer:** Yes. Evidence of reduced gene flow, host shifting, or geographic isolation < 10,000 years.
  *   **Supplier:** Geneticist/Ecologist.
  *   **Action:** If **Yes**, move to **Provisional Listing Protocol** (see Part 4). If **No**, reject.

  **Q5. Does the unit represent an independently evolving lineage or a functionally distinct ecological unit?**
  *   **Sufficient Answer:** Yes. Evidence of reproductive isolation OR stable ecological niche separation.
  *   **Supplier:** Geneticist/Ecologist.
  *   **Note:** For Asexual/Selfing groups (Shape iv), "Reproductive Isolation" is waived. "Monophyly" or "Fixed Diagnostic Characters" suffices.

  ### Stage 3: Conservation Necessity (The Ecologist)
  *Listing creates offences; it must be necessary.*

  **Q6. Is the unit threatened, rare, or vulnerable to the specific harms the Schedule prevents?**
  *   **Sufficient Answer:** Yes. Population trend negative, range restricted, or specific threat (e.g., collection, habitat loss) identified.
  *   **Supplier:** Field Ecologist.
  *   **Gate:** If **No** (unit is abundant and secure), reject. *Reason: Listing is for conservation, not taxonomic record-keeping.*

  ### Stage 4: Statutory Purpose & Value Judgement (The Chair)
  *Science cannot answer this. This is where the Panel interprets the Act.*

  **Q7. Which statutory purpose is primary in this case?**
  *   **Options:**
      *   A: Preserve separately evolving lineages (Evolutionary Process).
      *   B: Maintain ecological function (Ecosystem Service).
      *   C: Protect particular organisms from specific harms (Welfare/Existence).
  *   **Action:** Chair must select one. This selection determines how conflicting evidence (Shape i) is weighted.
  *   **Record:** This selection must be minuted as a **Value Judgement**, not a scientific finding.

  **Q8. Does listing this unit align with the treatment of analogous units in previous cycles?**
  *   **Sufficient Answer:** Yes. Precedent cited.
  *   **Supplier:** Secretary (using Consistency Register).
  *   **Action:** If **No**, Chair must record a **Departure Justification**.

  ---

  ## PART 2: CONFLICT AND CONSISTENCY RULES

  **The Conflict Rule (For Shape i):**
  When lines of evidence conflict (e.g., Genetics = One Species, Ecology = Two Species):
  1.  **If Purpose Q7 is A (Lineages):** Genetic cohesion trumps ecological difference. (Do not list).
  2.  **If Purpose Q7 is B (Function) or C (Existence):** Ecological/Morphological distinctness trumps genetic cohesion. (List).
  3.  **Default:** If Purpose is unstated, **Diagnosability (Q2)** trumps Genetic Cohesion. (We protect what we can identify).

  **The Consistency Rule:**
  The Written Reasons (Template below) must explicitly state:
  1.  Which Criterion (Q3, Q4, or Q5) was the *decisive factor*.
  2.  What specific evidence would have changed the decision (e.g., "Had genome-wide Fst exceeded 0.25, we would have listed").
  3.  Reference to the most similar precedent case in the Consistency Register.

  ---

  ## PART 3: HANDLING THE FIVE SHAPES

  1.  **Conflicting Evidence (Shape i):** Apply the **Conflict Rule**. The Panel must vote on Q7 (Statutory Purpose) before weighing the evidence.
  2.  **Hybridization (Shape ii):** Reproductive isolation need not be absolute. If hybrids are unfit or rare in the wild, treat as distinct. If hybrids are fertile and common (introgression), apply Q3 (Discontinuity). If no discontinuity, reject.
  3.  **Incipient Divergence (Shape iii):** Use **Provisional Listing**.
      *   **Term:** 10 years.
      *   **Review Interval:** 5 years.
      *   **Evidence of Completion:** Fixation of diagnostic alleles or ecological separation without intermediates.
      *   **Evidence of Stalling:** Resumption of gene flow or disappearance of distinct form.
  4.  **Asexual/Selfing (Shape iv):** Ignore "Interbreeding." Apply **Phylogenetic Species Concept**. Is the lineage monophyletic and diagnosable? If yes, proceed to Q6 (Threat).
  5.  **Names/Types (Shape v):** If no name exists, the Panel may request a taxonomic description be funded, but cannot list until published. If the name exists but the type is ambiguous, the Panel must adopt the current taxonomic consensus. If consensus is split, apply the **Conflict Rule**.

  ---

  ## PART 4: PUBLISHED REASONS TEMPLATE

  **DECISION RECORD: PROPOSAL [ID]**
  **TAXON:** [Scientific Name]
  **DATE:** [Date]

  **1. SUMMARY OF EVIDENCE**
  *   Morphology: [Distinct / Indistinct]
  *   Genetics: [Cohesive / Divergent]
  *   Ecology: [Distinct / Continuous]

  **2. DECISION GATES**
  *   Legal Validity (Q1): [Pass/Fail]
  *   Enforceability (Q2): [Pass/Fail]
  *   Distinctness (Q3/Q5): [Pass/Fail]
  *   Conservation Need (Q6): [Pass/Fail]

  **3. VALUE JUDGEMENT (Q7)**
  *   **Primary Statutory Purpose Selected:** [Lineage / Function / Existence]
  *   **Reason for Selection:** [Brief statement, e.g., "Given the hybridization evidence, the Panel prioritised ecological function over strict lineage separation."]

  **4. CONSISTENCY CHECK**
  *   **Decisive Criterion:** [e.g., Q3 Ecological Discontinuity]
  *   **Precedent Case:** [e.g., Proposal 2021-04, *Lutra lutra*]
  *   **Falsifiability Statement:** "This decision would have been reversed if [Specific Evidence] had been presented."

  **5. FINAL DETERMINATION**
  *   [List / Do Not List / Provisional List (Review Date)]

  **SIGNED:**
  Chair, Species Listing Panel

  ---

  ## PART 5: APPLICATION TO THREE CASES

  ### Case 1: The Host-Associated Moth
  *   **Facts:** Two host forms, assortative mating (90%), fertile hybrids, weak genome-wide diff, strong islands of diff.
  *   **Procedure Run:**
      *   Q1 (Name): Pass (Assume described).
      *   Q2 (Enforceability): Pass (Host plant association is identifiable in situ).
      *   Q3 (Distinctness): **Fail** (Genome-wide weak). **Pass** (Ecology/Behaviour strong). *Conflict triggered.*
      *   Q7 (Purpose): Panel selects **Function/Existence**. (Ecological separation matters more than genomic cohesion).
      *   Q6 (Threat): Assume Pass.
      *   Shape Handling: Shape (ii) Hybridization. Hybrids fertile but rare in wild due to host fidelity.
  *   **Decision:** **List.**
  *   **Reasoning:** Ecological discontinuity trumps genetic cohesion under Purpose Q7-B.
  *   **Risk:** High. If host plants change or hybrids increase, the distinction collapses.
  *   **Consistency:** Must cite another case where ecology trumped genetics.

  ### Case 2: The Polyploid Plant
  *   **Facts:** Diploid vs Tetraploid. Indistinguishable in field. Sterile triploid hybrids.
  *   **Procedure Run:**
      *   Q1 (Name): Pass (Cytotypes often named).
      *   Q2 (Enforceability): **FAIL.** "Indistinguishable in the field to anyone not counting chromosomes."
      *   **Gate Stopped.**
  *   **Decision:** **Do Not List.**
  *   **Reasoning:** Criminal law cannot be enforced on a unit that requires laboratory cytology to identify.
  *   **Honest Assessment:** This is the correct legal decision, but a biological failure. The plant is reproductively isolated (sterile hybrids), effectively a species. But the law protects *names* that can be *policed*.
  *   **Mitigation:** Protect the *habitat* where the tetraploid grows, rather than the taxon.

  ### Case 3: The Flagship Cline
  *   **Facts:** Protected for decades. Genomics now shows continuous cline. Type specimen is in the middle of the cline.
  *   **Procedure Run:**
      *   Q1 (Name): Pass (Name exists).
      *   Q3 (Distinctness): **FAIL.** "Continuous cline inside a widespread taxon."
      *   Q5 (Lineage): **FAIL.** "One end of a continuous cline."
      *   Shape Handling: Shape (v) Names/Types. The type specimen defines the name. If the type is in the middle of a cline, the name applies to the *entire* cline/taxon.
      *   Q6 (Threat): The "Flagship form" is threatened, but the *Taxon* (the whole cline) is "widespread and abundant."
  *   **Decision:** **Delist.** (Or List the widespread taxon, which renders protection meaningless).
  *   **Reasoning:** The unit proposed is not biologically distinct. The name legally encompasses the abundant population. To list the "form" is to list a phenotype, not a taxon.
  *   **Value Judgement (Q7):** Even if Panel selects "Existence," the legal definition of the name (via the Type) prevents isolating the rare end of the cline from the abundant middle.
  *   **Honest Assessment:** The procedure demands delisting. The science has outpaced the law. The Schedule protects a concept that no longer exists biologically.

  ---

  ## PART 6: LIMITATIONS AND MISFIRES

  **1. The Asexual/Selfing Problem (Shape iv)**
  *   **Misfire:** The procedure relies on "lines of evidence" implying divergence from a parent. In ancient asexuals (e.g., Bdelloid rotifers) or highly selfing plants, "lineage" is a fuzzy network.
  *   **Limitation:** Q5 (Independently Evolving) is hard to satisfy. We may end up protecting "clones" arbitrarily.
  *   **Fix:** The procedure waives reproductive isolation, but we must admit we are protecting **Diagnosable Units**, not species. This should be recorded in the Value Judgement (Q7).

  **2. The Statutory Purpose Ambiguity**
  *   **Misfire:** The Act likely does not specify whether we protect *processes* (speciation) or *products* (distinct forms).
  *   **Limitation:** The Panel is forced to legislate from the bench via Q7. If we choose "Lineage" today and "Function" tomorrow, we are vulnerable to Judicial Review for inconsistency.
  *   **Fix:** The Chair must issue a **Standing Policy Statement** on Statutory Purpose that applies to *all* cases until amended, rather than deciding Q7 case-by-case.

  **3. The Flagship Case (Case 3)**
  *   **Misfire:** The procedure identifies a legal/biological contradiction that the Panel cannot solve.
  *   **Limitation:** We cannot list a "form" that is genetically continuous with an abundant population without breaking the rules of taxonomic nomenclature (which the Act relies on).
  *   **Honest Truth:** The procedure tells us to delist. If we do not, we are acting on sentiment, not evidence. This exposes the Chief Scientist and the Panel to JR. The only lawful workaround is to amend the Schedule to define the protected unit by **geographic boundary** rather than taxonomic name, but that requires new legislation, not a Panel decision.

  **4. Enforcement vs. Biology (Case 2)**
  *   **Misfire:** Biologically distinct units (polyploids) are rejected because a warden can't see them.
  *   **Limitation:** The procedure prioritises **Legal Enforceability** over **Biological Reality**.
  *   **Honest Truth:** This is correct for a criminal statute, but it means the Schedule is not a "Scientific Record," it is a "Law Enforcement Tool." We must stop pretending it is the former.

  **5. Provisional Listing (Shape iii)**
  *   **Misfire:** Setting a 10-year review interval is arbitrary. Evolution does not read our calendar.
  *   **Limitation:** We risk "protection creep" where provisional listings become permanent by administrative inertia.
  *   **Fix:** The Secretary must have a hard gate to return Provisional cases to the Panel automatically. No automatic renewal.

  **Final Note to the Panel:**
  This procedure will not make the biology easier. It will not fix the Flagship problem without political pain. It will, however, ensure that when the Judge asks *why*, you have an answer that distinguishes what you *know* (Science) from what you *want* (Policy). That is the only defence against Judicial Review.
