prompt: |-
  I am secretary to the Species Listing Panel of a statutory nature conservation body. The Panel maintains the Schedule of protected taxa, and it receives roughly forty proposals a year — almost always from outside: a recording scheme, a museum, a local trust, occasionally a statutory consultee responding to a planning application. Listing is not a courtesy. It creates a criminal offence for harming a listed animal or uprooting a listed plant, it triggers mandatory habitat protection and the assessment duties that go with it, and it directs a large part of our recovery budget. Our decisions are subject to judicial review, so we must publish written reasons and be seen to treat like cases alike.

  The Panel is five people: a museum taxonomist, one population geneticist, one field ecologist, our lawyer, and a lay chair. It meets once per proposal cycle, six weeks apart, and it is almost never expert in the group in front of it. The evidence we get is usually morphology, a distribution map, and at best one or two gene regions, often from museum material of uncertain age. Recommendations are signed off by the Chief Scientist and made by statutory instrument.

  We are not, of course, deciding what a species is in general. But the disagreements among biologists on that question keep reappearing inside our individual cases, and they will not go away just because we have a statute to administer. The same five shapes recur:

  (i) lines of evidence that point in opposite directions — the genetic data saying one widespread lineage, the ecology and morphology saying two well-marked forms that do not intergrade where they meet;
  (ii) pairs that hybridise freely and often, with fertile hybrids, yet stay recognisably distinct, so that "they interbreed" settles nothing;
  (iii) populations whose separation is geologically recent — an island cut off by a rising sea, a reservoir, a host shift within living memory — showing partial but plainly incomplete divergence, where we cannot tell whether we are looking at a species in the making or a local race that will be reabsorbed;
  (iv) groups in which the interbreeding test has no application at all: wholly asexual lineages, and plants that self as a matter of course;
  (v) the fact that the Schedule protects *names*, and names hang on type specimens, so a population that no one has formally described can be ecologically real and legally unlistable.

  What I want from you is a decision procedure the Panel can actually run, not an essay. Please give me:

  - the questions in the order they should be asked, each with a statement of what would count as a sufficient answer, and who has to supply it;
  - the points at which the procedure stops with a no, stated as gates rather than as advice;
  - the points at which the procedure hands the decision to a person because the question is one of value — in particular whether the purpose of the statute is to preserve separately evolving lineages, to maintain ecological function, or to protect particular organisms from particular harms — and an instruction to record that hand-off as a value judgement rather than dress it up as a scientific finding;
  - an explicit rule for what to do when two lines of evidence conflict, and, just as important, a rule for consistency across cases: the written reasons must say which criterion did the work in this decision and what evidence would have changed it;
  - a way of handling the five shapes above, including a time-limited provisional listing for the incipient-divergence case, with guidance on setting the review interval and on what would count as evidence of divergence having completed rather than stalled;
  - and a short template for the published reasons.

  Then run the procedure on three cases, and tell us honestly what it cannot do and where it will misfire.

  The first is a moth with two host-associated forms. They use different food plants, their pheromones differ, and in the laboratory mating is about ninety per cent assortative; hybrids are viable and fertile, and their offspring will accept either host. Genome-wide differentiation is weak, but a handful of genomic regions are strongly differentiated.

  The second is a plant with diploid and tetraploid cytotypes. They are indistinguishable in the field to anyone not counting chromosomes, they share a pollinator, and crosses produce occasional sterile triploids.

  The third is our flagship: a form that has been on the Schedule for decades, the subject of a well-publicised recovery programme, cherished by our members and by the press. Recent genomic work places it at one end of a continuous cline inside a widespread and abundant taxon, and the type specimen of the protected name sits in the middle of that cline. I expect your procedure to tell us to do something we will not want to do, and I would rather hear it from you than from a court, so please work it through rather than soften it — and then say what the procedure legitimately leaves to us, and what it cannot settle at all, in particular for the asexual and selfing groups and for cases where the answer depends on which statutory purpose we take ourselves to be serving.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Secretary to the Species Listing Panel of a statutory nature conservation body.
      *   **Context:** Maintains a Schedule of protected taxa. Listing creates criminal offences, triggers habitat protection, and directs budget. Decisions are subject to judicial review (JR). Written reasons required. Consistency ("treat like cases alike") is crucial.
      *   **Panel:** 5 people (Taxonomist, Geneticist, Ecologist, Lawyer, Lay Chair). Meets every 6 weeks. Not experts in the specific group under review.
      *   **Evidence:** Morphology, distribution maps, limited genetic data (often museum-based).
      *   **Core Problem:** Biological species concepts disagree (5 specific "shapes" of disagreement recur). The law protects *names*, but biology deals with *lineages/populations*.
      *   **Deliverables:**
          1.  A decision procedure (questions, order, sufficient answers, suppliers).
          2.  Stop gates (hard "no" points).
          3.  Value judgement hand-offs (explicitly marking where science ends and policy begins).
          4.  Conflict resolution rule (evidence weighting) + Consistency rule (recording criteria).
          5.  Handling the 5 specific shapes (including provisional listing for incipient divergence).
          6.  Template for published reasons.
          7.  Run the procedure on 3 specific cases (Moth, Plant Polyploid, Flagship Cline).
          8.  Honest assessment of limitations/misfires (especially asexual/selfing and statutory purpose).
      *   **Tone:** Practical, legalistic but scientifically literate, direct, unvarnished (especially regarding the Flagship case).

  2.  **Deconstruct the Decision Procedure:**

      *   *Goal:* Create a defensible, repeatable workflow that acknowledges scientific uncertainty without abdicating legal responsibility.
      *   *Structure:* Needs to be sequential. Start with legal threshold, move to scientific validity, then to conservation necessity, then to value judgements.
      *   *The "Five Shapes":* Need specific handling instructions within the flow.
      *   *Conflict Resolution:* Need a hierarchy of evidence or a "preponderance" rule that is recorded.
      *   *Value Judgements:* Must be explicit. The Panel cannot hide behind "science says" when the science is ambiguous regarding the *purpose* of the Act.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Legal Threshold.* Is there a name? Is it on the Schedule? (Wait, this is for *new* listings). Is there a validly publishedased name? Is there a type specimen?
      *   *Step 2: Distinctness.* Is it distinguishable? (Morphology, Genetics, Ecology).
      *   *Step 3: Stability.* Is it a transient blip or a stable unit?
      *   *Step 4: Conservation Need.* Does it need protection? (Threat status).
      *   *Step 5: Value/Policy.* Which statutory purpose are we serving?
      *   *Refinement:* The prompt asks for "questions in order," "sufficient answer," "who supplies."
      *   *Refinement on Conflict:* If genetics says A and ecology says B, who wins? Usually, for legal protection, *diagnosability* (can a enforcement officer tell them apart?) is key, but *evolutionary significance* is key for long-term survival. Let's prioritize "Diagnosability + Evolutionary Independence."
      *   *Refinement on Value:* The Panel must choose: Are we protecting *processes* (speciation) or *products* (distinct forms)?

  4.  **Addressing the Five Shapes:**

      *   (i) Conflicting evidence: Weight of evidence rule.
      *   (ii) Hybridization: Reproductive isolation is not absolute. Focus on "ecological distinctness" or "genomic islands of divergence."
      *   (iii) Incipient divergence: Provisional listing (Sunset clause).
      *   (iv) Asexual/Selfing: Drop the "interbreeding" test. Use "Phylogenetic Species Concept" or "Diagnosable Unit."
      *   (v) Names/Types: Taxonomic validity check. If no name, can't list (legal constraint).

  5.  **Drafting the Template:**

      *   Needs to look like a formal decision record.
      *   Must include the "Value Judgement" section explicitly.
      *   Must include the "Consistency Check" (what criterion drove this?).

  6.  **Running the Cases:**

      *   *Case 1 (Moth):* Host races. Weak genome-wide diff, strong local diff. Assortative mating.
          *   *Analysis:* Fits Shape (ii) & (iii). Provisional listing? Or full listing based on ecological distinctness?
          *   *Verdict:* Likely Provisional. High risk of collapse, but ecologically distinct.
      *   *Case 2 (Plant Polyploid):* Diploid vs Tetraploid. Sterile triploids. Morphologically identical.
          *   *Analysis:* Fits Shape (iv) effectively (reproductive barrier is cytological). Cytotypes are often treated as distinct species in botany.
          *   *Verdict:* Listable if threatened. The barrier is strong (sterility), even if morphology is same. *Wait*, enforcement issue? If you can't tell them apart in the field, can you prosecute? This is a legal/practical gate.
      *   *Case 3 (Flagship):* Cline. Type specimen in middle. Genomics says continuous variation.
          *   *Analysis:* Fits Shape (i) & (v). The name applies to a part of a cline. Legally, the name is valid. Biologically, it's arbitrary.
          *   *Verdict:* Procedure demands delisting or redefinition. If the type is in the middle of a cline, the name applies to the whole cline (which is abundant). The "flagship" form is not a distinct taxon.
          *   *Hard Truth:* The procedure will likely say "Do not list" or "List the whole widespread taxon." This creates political fallout.

  7.  **Refining the "Honest Assessment" (Limitations):**

      *   Asexuals: The procedure relies on divergence. Clonal lineages are tricky.
      *   Statutory Purpose: The procedure can't decide *why* we protect. It forces the Panel to admit they are making a policy choice.
      *   Enforcement: If it can't be identified by a warden, is it listable? (The "Field Identifiability" constraint).

  8.  **Final Review against Constraints:**

      *   *Decision Procedure:* Check.
      *   *Stop Gates:* Check.
      *   *Value Hand-offs:* Check.
      *   *Conflict/Consistency Rules:* Check.
      *   *Five Shapes Handling:* Check.
      *   *Template:* Check.
      *   *Three Cases:* Check.
      *   *Limitations:* Check.
      *   *Tone:* Professional, direct, not softening the blow on Case 3.

  9.  **Self-Correction/Nuance during drafting:**
      *   *Correction on Case 2:* Polyploids are often instant species. But if they are indistinguishable in the field, criminal law is problematic. I need to make sure the procedure flags "Enforceability."
      *   *Correction on Case 3:* The prompt says "The type specimen... sits in the middle of that cline." This implies the name *technically* covers the whole cline under ICZN/ICN rules if the cline is one taxon. If the genomics says it's one taxon, the "flagship form" is just a phenotype. The procedure must prioritize the best available science over sentiment. I must be firm here.
      *   *Procedure Flow:* Ensure the "Value Judgement" isn't buried. It needs to be a specific step where the Chair records the statutory interpretation.

  10. **Final Polish:** Check formatting for readability (bolding, lists). Ensure the "Secretary" persona is maintained (pragmatic, procedural).

  *(Self-Correction on the "Provisional Listing" for Shape iii)*: The prompt asks for a time-limited provisional listing. I need to define the review interval and the "success criteria" (evidence of completed divergence).

  *(Self-Correction on Conflict Rule)*: I need a specific rule. "Preponderance of Independent Lines of Evidence" is standard. But for legal certainty, "Diagnosability" often trumps "Gene Flow." I will propose a hierarchy: 1. Legal Validity (Name), 2. Diagnosability (Enforcement), 3. Evolutionary Independence (Science).

