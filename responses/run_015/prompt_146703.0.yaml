answer: |-
  The St. Jude Hospital Heritage Committee faces a decision regarding the 1920s "Segregation Door," a historically significant artifact that currently blocks wheelchair access to the ward, where the values of historical integrity and disability justice are genuinely incommensurable. The Committee must choose between *Preservation* (maintaining the door's original locked state) and *Adaptation* (installing a hidden sensor mechanism), operating under a bylaw termed **precedent lock-in**, defined explicitly as a procedural rule stipulating that if the Committee has previously resolved a structurally identical conflict between heritage and access in favor of one value, that past resolution bindingly determines the rational permissibility of current options, rendering the alternative procedurally irrational regardless of unchanged first-order values. Five years ago, the Committee authorized Adaptation for the structurally identical Chapel Gate, triggering the lock-in for the current case.

  For the theorist holding that incommensurability yields rational indeterminacy, this scenario forces a concession: because **precedent lock-in** procedurally mandates Adaptation as the only permissible move, they must admit there is a uniquely correct option, contradicting their core claim that reason runs out in hard choices. Conversely, the parity theorist, who argues agents resolve hard choices by creating reasons through commitment, is forced to treat the decision as arbitrary will; since the "reason" was created by the past board, the current agent cannot exercise normative power to make the option right, reducing their choice to either mechanical obedience or rule-breaking without value-based justification, which is the definition of arbitrariness. If **precedent lock-in** is removed, the Chapel Gate decision becomes mere history rather than a binding constraint; the values return to being on a par, restoring the indeterminacy theorist's stalemate (either option is permissible) and allowing the parity theorist to reclaim the space for reason-creating commitment. A defender of the parity view would attack this construction by arguing that the precedent itself introduces a new second-order value (institutional consistency) that tips the scale, thereby destroying the initial condition of incommensurability and dissolving the trap.

  \answer{precedent lock-in}
