  **Note on Theory and Art**
  To fit the blank verse and dramatic arc, I've taken a few liberties with Dennett's strict materialism. Firstly, giving the 'audience' and the 'drafts' an "I" to speak with implies a subjecthood Dennett argues is merely a fictional centre of narrative gravity; in his view, there is no one home to say the line. Secondly, suggesting the drafts "see" light anthropomorphises processing states that are actually blind competences. Finally, while Dennett claims his model dissolves the 'Hard Problem' of qualia, the closing couplet acknowledges that many philosophers remain unconvinced that explaining the mechanism fully accounts for the subjective *feel* of experience.
