  # The Procreation Ethics Decision Tree

  This instrument is designed to sort your group's views based on how you judge specific cases, not on which philosophical labels you recognize. There are **8 branch nodes** (questions) and **8 leaves** (final positions).

  Follow the path that matches your intuitions. If a question asks about a case you haven't discussed, imagine it as described.

  ### The Nodes

  **Node 1: The Margin**
  *Case:* The child you could have would have a life of extraordinary happiness containing exactly one brief, minor pain, nothing that would make the life not worth living.
  *Question:* Does the fact that this pain would be avoided if the child never existed count **at all** against having them?
  *   **(A) Yes**, it counts against. (Go to Node 5)
  *   **(B) No**, it does not count against. (Go to Node 2)
  *(Separates: Asymmetry/Negative Views vs. Symmetry/Standard Views)*

  **Node 2: The Missing Happiness**
  *Case:* If you choose not to have the child, they never exist and miss out on that extraordinary happiness.
  *Question:* Is that missed happiness a **moral loss** (bad for the world or bad for them)?
  *   **(A) Yes**, it is a loss. (Go to Node 3)
  *   **(B) No**, it is not a loss. (Go to Node 7)
  *(Separates: Total Views vs. Person-Affecting/Neutral Views)*

  **Node 3: The Switch**
  *Case:* You must bring exactly one child into existence. Candidate A would have an excellent life. Candidate B would have an excellent life that is somewhat less excellent and contains a small amount of suffering the first would not. Both clearly worth living.
  *Question:* Is there any moral reason to bring about **A rather than B**?
  *   **(A) Yes**, pick A. (Go to Node 4)
  *   **(B) No**, either is fine. (Go to Leaf 6)
  *(Separates: Maximizing Views vs. Satisficing Views)*

  **Node 4: The Delay**
  *Case:* Conceiving now would produce one particular child with a good life. Waiting eleven months would produce a numerically different child whose life would be better in every respect, with no other effects anywhere.
  *Question:* Is there any moral reason to **wait**?
  *   **(A) Yes**, wait for the better child. (Go to Node 8)
  *   **(B) No**, no reason to wait. (Go to Leaf 5)
  *(Separates: Impersonal Views vs. Non-Identity Sensitive Views)*

  **Node 5: The Weight**
  *Case:* Return to *The Margin* (one minor pain in a great life).
  *Question:* Is that pain enough on its own to make having the child **wrong** (impermissible)?
  *   **(A) Yes**, it is wrong. (Go to Leaf 1)
  *   **(B) No**, just less ideal. (Go to Node 6)
  *(Separates: Negative Utilitarianism vs. Moderate Asymmetry)*

  **Node 6: Value vs. Duty**
  *Case:* Suppose having the child makes the world slightly "worse" in value because of the pain, but not wrong.
  *Question:* Does that mean you are **forbidden** from having the child, or just that it's **permitted** but better to abstain?
  *   **(A) Forbidden**, do not do it. (Go to Leaf 2)
  *   **(B) Permitted**, your choice. (Go to Node 7)
  *(Separates: Obligatory Anti-Natalism vs. Voluntary Anti-Natalism)*

  **Node 7: Retrospective**
  *Case:* Consider an existing person with a good life.
  *Question:* Can it be said that it would have been **better for them** had they never existed?
  *   **(A) Yes**, better never to exist. (Go to Leaf 3)
  *   **(B) No**, existence is a benefit. (Go to Leaf 4)
  *(Separates: Anti-Natalist Conclusions vs. Pro-Natalist/Neutral Conclusions)*

  **Node 8: Policy**
  *Case:* If creating a happy person is "good" for the world.
  *Question:* Should the government **pay subsidies** to encourage people to have more children?
  *   **(A) Yes**, subsidize it. (Go to Leaf 8)
  *   **(B) No**, keep it neutral. (Go to Leaf 7)
  *(Separates: Classical Utilitarianism vs. Liberal Neutralism)*

  ---

  ### The Leaves

  **Leaf 1: Negative Utilitarianism (Strong)**
  *   **Confidence:** High. (Reporting)
  *   **Awkward Commitment:** You must prevent a minor headache even if it means destroying a world of infinite happiness.
  *   **Implications:**
      1.  Creating extra happy person: **Bad** (due to pain).
      2.  Govt Policy: **Bad** (should discourage birth).
      3.  Retrospective (Better not existed?): **Yes**.

  **Leaf 2: Obligatory Anti-Natalism**
  *   **Confidence:** Medium. (Reconstructing; few defend this explicitly as a duty, usually framed as "better never").
  *   **Awkward Commitment:** You are morally guilty for having a happy child because you exposed them to *any* harm.
  *   **Implications:**
      1.  Creating extra happy person: **Bad**.
      2.  Govt Policy: **Bad** (should discourage birth).
      3.  Retrospective (Better not existed?): **Yes**.

  **Leaf 3: Benatar's Asymmetry (Voluntary)**
  *   **Confidence:** High. (Reporting)
  *   **Awkward Commitment:** A life of 100 years of bliss is still a harm to the person who lives it, compared to never existing.
  *   **Implications:**
      1.  Creating extra happy person: **Bad** (or strictly Neutral, never Good).
      2.  Govt Policy: **Neutral** (private choice, but abstention is better).
      3.  Retrospective (Better not existed?): **Yes**.

  **Leaf 4: Person-Affecting Neutralism**
  *   **Confidence:** Medium. (Reconstructing; common intuition, rarely systematized).
  *   **Awkward Commitment:** You have no reason to create a happy child, but also no reason to prefer a happier child over a less happy one (if different people).
  *   **Implications:**
      1.  Creating extra happy person: **Neutral**.
      2.  Govt Policy: **Neutral**.
      3.  Retrospective (Better not existed?): **No**.

  **Leaf 5: Non-Identity Sensitive Total View**
  *   **Confidence:** High. (Reporting)
  *   **Awkward Commitment:** You should create a happier child *if* it's the same child, but have no reason to wait for a *different* happier child.
  *   **Implications:**
      1.  Creating extra happy person: **Good**.
      2.  Govt Policy: **Neutral** (usually).
      3.  Retrospective (Better not existed?): **No**.

  **Leaf 6: Satisficing View**
  *   **Confidence:** Low. (Reconstructing; theoretically possible, rarely defended).
  *   **Awkward Commitment:** Once a life is "good enough," adding more happiness adds no moral value.
  *   **Implications:**
      1.  Creating extra happy person: **Good** (up to a point).
      2.  Govt Policy: **Neutral**.
      3.  Retrospective (Better not existed?): **No**.

  **Leaf 7: Liberal Total Utilitarianism**
  *   **Confidence:** Medium. (Reconstructing).
  *   **Awkward Commitment:** Creating happy people makes the world better, but the state shouldn't pay for it (inconsistency between value and policy).
  *   **Implications:**
      1.  Creating extra happy person: **Good**.
      2.  Govt Policy: **Neutral**.
      3.  Retrospective (Better not existed?): **No**.

  **Leaf 8: Classical Total Utilitarianism**
  *   **Confidence:** High. (Reporting)
  *   **Awkward Commitment:** If necessary, the state should compel reproduction to maximize total happiness (The "Repugnant Conclusion" logic).
  *   **Implications:**
      1.  Creating extra happy person: **Good**.
      2.  Govt Policy: **Good** (should subsidize/encourage).
      3.  Retrospective (Better not existed?): **No**.

  ---

  ### Convergence Flagging

  **Leaf 2 (Obligatory Anti-Natalism) and Leaf 3 (Benatar's Asymmetry)** differ on the tree (Node 6: Duty vs. Permission) but **converge on all three leaf implications** regarding Policy (Bad/Neutral is a slight divergence, but often functionally similar in non-coercive states) and Retrospective (Yes).
  *   *Note for your group:* These two views agree that existence is a harm and non-existence is preferable. They only disagree on whether procreation is a *sin* (Leaf 2) or merely a *mistake* (Leaf 3). If your group only cares about practical outcomes, these are the same view.

  **Leaf 7 (Liberal Total) and Leaf 8 (Classical Total)** differ on the tree (Node 8: Policy) but **converge** on the value of creating an extra person (Good) and the Retrospective (No).
  *   *Note for your group:* These two views agree on the *value* of existence. They only disagree on whether that value translates to *state action*.

  ---

  ### Confidence & The Weakest Node

  **Confidence Ratings:**
  *   **High:** Leaves 1, 3, 5, 8. (These correspond to well-documented positions in the literature).
  *   **Medium:** Leaves 2, 4, 7. (These are logical positions held by individuals, but less often systematized in books).
  *   **Low:** Leaf 6. (Satisficing views are rare in population ethics).

  **The Weakest Node:**
  **Node 6 (Value vs. Duty)** is the step I am least sure about.
  *   *Reason:* In practice, people conflate "It would be better if X didn't happen" with "I ought not to do X." A person might say "It's permitted" at Node 6 but then act as if it's forbidden. This node attempts to separate *axiology* (what is good) from *deontology* (what is required), but without formal training, your group may find this distinction artificial. If everyone answers "Forbidden" here, Leaf 2 and Leaf 3 collapse into one.

  ---

  ### Glossary of Technical Names

  *   **Negative Utilitarianism:** The view that minimizing suffering is more important than maximizing happiness. (Leaf 1).
  *   **Anti-Natalism:** The view that coming into existence is always a harm. (Leaves 2, 3).
  *   **Benatar's Asymmetry:** A specific argument for anti-natalism claiming pain is bad, but missing out on pleasure is *not* bad. (Leaf 3).
  *   **Person-Affecting View:** The view that an outcome can only be better or worse if it is better or worse *for someone*. (Leaves 4, 5).
  *   **Non-Identity Sensitive:** The view that our obligations change when our choices determine *which* specific person comes into existence. (Leaf 5).
  *   **Total Utilitarianism (Classical):** The view that the right action is the one that maximizes the total sum of happiness in the world, even by adding more people. (Leaf 8).
  *   **Repugnant Conclusion:** The counter-intuitive result of Total Utilitarianism that a massive population with barely-livable lives is better than a small population with excellent lives. (Associated with Leaf 8).
  *   **Same Number Quality Claim:** The claim that if the same number of people will exist, we should choose the outcome where they are happier. (Tested at Node 3).

  *Note on Unnamed Leaves:* Leaves 4, 6, and 7 are described by phrase rather than proper name because they represent logical combinations of intuitions that do not have a single famous proponent or standardized label in the academic literature.
