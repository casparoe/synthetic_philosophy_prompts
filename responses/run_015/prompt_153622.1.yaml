  **The Scenario**

  Consider a laboratory ampoule made of thin glass, filled with a volatile, flammable solvent, and dipped in a clear, shear-thickening lacquer that is soft and porous at rest but instantly hardens into an airtight, shock-absorbing shell upon sudden impact. A technician strikes this coated ampoule with a hammer that simultaneously creates a spark at the point of contact. The ampoule does not shatter, and the solvent does not ignite. Afterward, the object sits on the bench as a solid, sealed block; a bystander who witnessed the strike and now inspects the hardened casing can see why the hammer bounced off and why the spark failed to catch, but cannot determine from the physical evidence alone whether the object's tendency to break was removed by the impact or whether its tendency to burn was merely hidden by the new shell.

  ***

  **Verification of Specifications**

  To show this scenario meets your requirements, we must isolate the two dispositions and trace exactly how the simple definition ("if struck, it would break"; "if sparked, it would burn") fails in each case.

  **Disposition 1: Fragility**
  *   **The Disposition:** The coated ampoule is genuinely fragile before the strike; the soft lacquer offers no structural support, and the thin glass beneath is ready to shatter.
  *   **The Stimulus:** The hammer strike.
  *   **The Predicted Manifestation:** The ampoule breaks.
  *   **The Failure:** The ampoule does not break.
  *   **Why it Fails (Finkish):** The strike itself triggers the lacquer to harden. This structural change happens fast enough that the object ceases to be fragile *during* the impact. The disposition is not merely prevented from showing itself; the property itself vanishes because the stimulus altered the object's physical state. The definition predicts breakage based on the object's state *before* the strike, but the strike changed that state before the breakage could occur.

  **Disposition 2: Flammability**
  *   **The Disposition:** The solvent inside is genuinely flammable; chemically, it retains the power to burn throughout the episode.
  *   **The Stimulus:** The spark (accompanied by the strike).
  *   **The Predicted Manifestation:** The solvent ignites.
  *   **The Failure:** The solvent does not ignite.
  *   **Why it Fails (Masked):** The hardening lacquer becomes airtight and fireproof. The solvent remains flammable, and the spark is hot enough, but the hardened shell intercepts the oxygen and heat. The disposition remains intact inside the object, but an external barrier (created by the strike) prevents the manifestation.

  **The Indistinguishability:**
  A bystander sees a strike, a bounce, and no fire. Inspecting the object later, they see a hard shell. This shell explains both the lack of breakage (it's tough now) and the lack of fire (it's sealed now). Without knowing the chemical history of the lacquer, they cannot tell if the fragility was *lost* (Fink) or if the flammability was *blocked* (Mask). Both outcomes look like "nothing happened" due to "protective hardening."

  **The Linchpin Feature**

  The single feature doing the work is the **impact-sensitive phase change of the coating**. This mechanism links the two failures: the same molecular rearrangement that removes the fragility (by adding structural support) also creates the mask for the flammability (by sealing the surface).

  If you remove this feature—for instance, if the lacquer were always hard—the scenario collapses into two boring, unrelated examples. The ampoule would simply be a tough, non-fragile object that doesn't break (no failure of definition, it just wasn't fragile), and a sealed container that doesn't burn (standard masking). If the lacquer were always soft, the ampoule would shatter and burn (definitions hold). It is only because the *test itself* triggers the change that the definitions break, and only because that single change performs both structural reinforcement and sealing that the two failures are tied together.

  ***

  **The Pushback and Its Cost**

  A defender of the simple definition will likely reply by adding a **"ceteris paribus" (all else being equal)** clause. They will argue: "The definition only holds under *normal* conditions. It is not normal for a hammer strike to turn glass into steel. Therefore, the ampoule is fragile because it would break if struck *under normal conditions*, and flammable because it would burn if sparked *under normal conditions*."

  **The Cost:**
  This reply saves the definition by emptying it of content. To say "it would break if struck, unless something stops it" is to say "it would break if struck, unless it wouldn't." The defender must now specify exactly which interfering factors count as "abnormal" without simply listing the ones that make their definition fail. If they define "normal conditions" as "conditions where the disposition manifests," the definition becomes circular: *Fragile means it breaks when struck, provided it breaks when struck.*

  **The Harder Failure Mode:**
  The **Finkish failure (Fragility)** is the harder one for them to absorb.
  *   **Masking** can be dismissed as an "external interference." The defender can argue the object *was* flammable, but the world didn't cooperate. They can keep the disposition internal and blame the environment.
  *   **Finkishness** attacks the object itself. The stimulus changes the *intrinsic properties* of the object before the manifestation occurs. The defender cannot blame the environment; they must admit that the object's own nature is unstable under the very test that defines it. To fix this, they cannot just restrict the "conditions"; they must restrict the *object's history* during the test, which requires a much more complex rewrite of the definition than simply appealing to "normal surroundings." The Fink shows that the disposition isn't just a link between stimulus and response; it requires the persistence of the object's identity through the test, which the simple definition ignores.
