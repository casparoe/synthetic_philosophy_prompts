answer: |-
  The premise that law presupposes a norm of assertion is a category mistake because it regulates harm, but the expert code regulates professional integrity, so the board member's objection fails and the code must sanction lucky guesses to preserve epistemic credibility.

  Your features (a) and (b) are broadly correct for Anglo-American tort and criminal law, though perjury specifically requires materiality alongside falsity; feature (c) accurately describes research integrity regimes. The apparent conflict between law and research integrity dissolves once you recognize they regulate different objects: law regulates *reliance and harm*, while research regulates *process and trust*. The objection that none of these institutions regulate assertion at all is correct regarding the law but incorrect regarding the expert code. Tort and criminal law use assertion merely as the mechanism by which harm is caused; the normative weight falls on the damage to the victim, not the violation of a speech act norm. This is why truth is a complete defense in defamation and fraud: if the statement is true, reliance on it is generally not legally cognizable as harm, regardless of the speaker's recklessness. The law does not care about the norm of assertion; it cares about the norm of non-injury. Consequently, asking what norm of assertion the law presupposes is indeed a category mistake; the law presupposes a norm of *harmful conduct* where assertion is the vehicle.

  However, research integrity and professional codes for expert witnesses do regulate assertion constitutively. Their purpose is not merely to prevent bad outcomes (false verdicts or retractions) but to maintain the reliability of the epistemic infrastructure itself. This answers objection (i): the board member's objection presupposes that assertion is purely instrumental for action-guidance, where only the truth-value of the output matters. But expert testimony is also a warranting act; it certifies that the statement was arrived at via reliable methods. A lucky guess provides no warrant. If experts are permitted to guess, the category of "expert" loses its meaning, and the court's reliance on expertise becomes structurally unsound, even if the specific verdict happens to be correct. The board member is applying tort logic (harm prevention) to a professional ethics context (integrity preservation).

  Regarding (ii) and (iii), the practices are underdetermined because they can be explained by combining a primary norm with a secondary enforcement policy. The law fits a **Truth Norm** ("Assert only what is true") paired with a **Culpability Filter** ("Sanction only if the violation was culpable"). This explains why the reckless truth-teller goes free (no violation of Truth Norm) and the careful liar is liable (violation of Truth Norm + Culpability). Research integrity fits a **Knowledge/Justification Norm** ("Assert only what you know/are justified in believing") paired with a **Strict Liability Policy** ("Sanction any violation"). This explains why fabrication is sanctionable even if true (violation of Knowledge Norm) and honest error is not (no violation of Knowledge Norm). There is no single coherent norm across all three; there are two distinct regimes. The law is not "wrong" relative to its goals, nor is research "wrong" relative to hers; they are optimizing for different goods (harm reduction vs. process integrity).

  For (iv), replacing the implicit norm with a knowledge norm in the expert witness code would concretely change outcomes to align with research integrity rather than tort law. You would start sanctioning lucky guesses under oath because they violate the knowledge norm, even if they cause no harm and produce true verdicts. You would stop sanctioning honest errors where the expert had sufficient justification at the time, even if the claim turns out false. Defamation law would not change because it is not governed by this code; it remains a harm-based regime. The board member's incoherence charge relies on the assumption that the code's goal is verdict accuracy; if the goal is maintained institutional trust, sanctioning the lucky guess is not only coherent but necessary. The code should explicitly reject the legal truth-defense for professional misconduct because the wrong is the corruption of the witness's role, not the falsity of the statement.
