answer: |-
  1. You mandate service on the model of jury duty with narrowly drawn hardship exemptions, yet you stratify on income and education. If the wealthy or highly educated successfully claim hardship at higher rates than the working class, doesn't the acceptance process silently undo the stratification variables?
  Likely Reply: He will argue that enforcement mechanisms ensure compliance across classes.
  Follow-up: If enforcement relies on fines or penalties, doesn't that impose a regressive cost that effectively exempts the poor anyway, and can you commit to a specific threshold of service uptake below which you would concede the Chamber is no longer a statistically valid sample?

  2. Members choose their own expert witnesses by majority vote, but only from a list compiled by a permanent, unelected clerical service. In policy areas where they have no prior training, what makes a choice from a staff-drafted menu autonomous rather than merely unconstrained?
  Likely Reply: He will say the members control the final selection and can request additional names.
  Follow-up: If the clerks control the initial information asymmetry by deciding who is qualified to be on the list, doesn't that give them the power to set the boundaries of legitimate debate before the members ever vote?

  3. You argue that randomly chosen members have no donors or party whip, but the absence of repeat play also removes the forward-looking sanction that disciplines an elected chamber. Since the only monitor of a four-year amateur body is a permanent bureaucracy that is neither elected nor sorted, is the clerical service then the real legislature, and if so why is that better than openly having one?
  Likely Reply: He will insist that the members retain the veto power and final vote, keeping sovereignty with the Chamber.
  Follow-up: If sovereignty rests on the capacity to understand what one is vetoing, and understanding depends entirely on the briefing staff, doesn't the power to brief become the power to rule, regardless of where the formal vote lies?

  4. Your design is the limiting case of the term-limit reformer's program, yet the standard complaint about term-limited legislatures is institutional amnesia plus dependence on staff. What in your design prevents this complaint from applying with maximum force, and if you say four years is long enough to acquire expertise, where does that expertise come from if not from the permanents who brief him?
  Likely Reply: He will claim that four years is sufficient for deliberative learning distinct from technical expertise.
  Follow-up: If the learning is deliberative rather than technical, how do they evaluate technical claims made by outside interests without relying on the very staff you say they master, and doesn't that circle back to staff dependence?

  5. Stratified sortition delivers a group its population share of seats and nothing more, whereas elections can make a geographically concentrated minority decisive and therefore worth bargaining with. Why should proportional presence be preferred to pivotal power, and if you answer that presence changes what counts as a reason in the room, what is the causal mechanism?
  Likely Reply: He will argue that presence ensures interests are heard rather than bargained away.
  Follow-up: How would you distinguish genuine persuasion from the majority's preference being restated in more presentable language, and would you accept a design granting small groups more than their share of seats, which would break the mirroring claim you rely on elsewhere?

  6. The citizens' assemblies on electoral reform in British Columbia and Ontario produced recommendations that the electorate then rejected, yet your design removes ratification entirely for the veto and makes the amendment-initiative self-executing. Walk us through what happens when the Chamber vetoes an emergency or deeply unpopular bill with no possibility of appeal.
  Likely Reply: He will suggest that deliberation produces better outcomes than plebiscites, so ratification is unnecessary.
  Follow-up: If the Chamber blocks a popular response to a crisis based on deliberative reasoning the public does not share, does your separation of authorization and accountability allow the public to remove them, or must they simply wait out the four-year term?

  7. Athens paired the lot with entry vetting, post-office audit, one-year non-repeatable tenure, and an assembly of the whole citizen body sitting above the sorted council. Is your evidence for success the lot alone or the lot together with that apparatus, and if Athenian accountability was ex post and non-electoral, why have you omitted those corresponding devices from your own design?
  Likely Reply: He will argue that modern scale prevents an assembly of the whole, so representative accountability must differ.
  Follow-up: If you cannot replicate the assembly of the whole, does that not mean the sorted Chamber becomes the sovereign rather than the agent, and how much of your argument survives once accountability, rather than random selection, is doing the work?

  8. If random selection tracks the public's judgment better than election does, why stop at one chamber and leave the central bank, the courts, and the epidemic-response agency to appointment? You may say legislatures settle contested values while technocratic bodies settle means, but take a live case in which the technical parameter just is the moral question, such as a debt brake or coverage threshold.
  Likely Reply: He will maintain that value judgments require descriptive representation while technical ones require expertise.
  Follow-up: In cases where the technical parameter determines the moral outcome, which body gets it and by what criterion, and does admitting this overlap undermine the clean separation your design relies upon?

  9. The frame is the electoral register, so the Chamber mirrors the electorate rather than everyone subject to the law, meaning children, resident non-citizens, and the disenfranchised are governed but cannot be drawn. If you answer that the frame should be widened, what one stratifies on when no register exists for those groups, and does mirroring the population rather than the electorate sever the connection to the demos that authorizes law in the first place?
  Likely Reply: He will suggest expanding the register to include all residents.
  Follow-up: If you expand the register to include non-citizens, do you thereby grant them citizenship rights through the back door, and if not, how do you justify binding them to laws they had no potential role in selecting?

  10. Name a comparison that could be run before adoption, such as the same bill put to the sorted Chamber and to the elected lower house under identical testimony and identical time. Commit in advance to the criterion on which you would judge the result, and to a result that would make you withdraw the proposal rather than reinterpret it.
  Likely Reply: He will propose measuring the quality of deliberation or the stability of preferences.
  Follow-up: If the elected house produces the same outcome as the sorted Chamber but faster, would you concede that the added cost and complexity of sortition is unnecessary, or is the legitimacy of the process itself the only metric that matters to you?

  **Explanation of Order**

  The sequence begins with internal mechanics (questions 1 and 2) to demonstrate a precise grasp of the proposal's operational details before challenging its coherence. This establishes credibility before moving to structural power dynamics (questions 3 and 4), where the interaction between the amateurs and the permanent staff is scrutinized. The middle section (questions 5, 6, and 7) addresses the normative core of the argument, testing the claims about representation, legitimacy, and historical precedent against practical outcomes. The penultimate pair (questions 8 and 9) pushes outward to the boundaries of the design, questioning why sortition stops at the legislature and who is excluded from the sampling frame. The interview closes with the disconfirmation question (10) to force an empirical commitment, ensuring the conversation ends on a testable claim rather than a theoretical abstraction.
