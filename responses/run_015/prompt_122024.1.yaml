      *   **Spectator in action:** The internal judge wakes up.
      *   **The Climax:** The Spectator evaluates the shaking.
      *   **The Punchline:** The Spectator acknowledges the sympathy is vivid (good!) but the physical manifestation is disproportionate (bad!), leaving Dave in a state of "approved anxiety."

      *Wait, let's look closer at the prompt's specific requirement:* "The punchline should depend on the spectator's structural refusal to enter the colleague's situation—he can only deliver a verdict on propriety—while sympathy demands exactly that entry."

      *Revised Idea:* The Spectator treats the Sympathetic projection as *data* to be judged, not as *truth* to be felt. The Spectator is like a critic watching an actor (Sympathy) perform a role (Sarah's pain).

