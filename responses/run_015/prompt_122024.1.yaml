answer: |-
  Dave accidentally hits *Shift-Delete* on the shared Q3 projections. 

  Immediately, his Smithian **Sympathy** kicks in. He closes his eyes and imaginatively changes stations with his colleague, Sarah. He vividly reconstructs her Monday morning: the coffee going cold, the deadline looming, the sheer hollow dread in her stomach. Dave's own stomach drops. He begins to sweat. He feels a genuine, projected panic.

  Then, the **Impartial Spectator** wakes up in his breast.

  "Hold on," says the Spectator. "Why are you sweating?"

  "Because Sarah is sweating!" Dave says. "I'm in her situation. I'm feeling what she would feel."

  "I see," says the Spectator, adjusting its spectacles. "But I am not in her situation. I am in *yours*. And from my vantage point, I cannot see Sarah's dread. I can only see *your* sweat."

  "But the sweat is the proof of the sympathy!" Dave argues. "Smith says I must enter into her sentiment."

  "Sympathy demands entry," the Spectator agrees. "But *I* demand propriety. I am not here to feel her pain; I am here to judge your reaction to it. And frankly, this level of perspiration is disproportionate to an accidental keystroke."

  "So I should stop imagining her pain?"

  "Certainly not. The imagination is vivid and laudable. But the physiological enactment is excessive. You are claiming a tragedy you did not author."

  "Then what do I do?" Dave asks, still trembling.

  "Maintain the imaginative projection," says the Spectator, "but suppress the sweat. I need to see contrition, not a reenactment."

  Dave sits there, vividly imagining Sarah's doom while desperately trying to keep his pores dry.

  "It's not working," Dave says.

  "I know," says the Spectator. "But at least now you're suffering proportionately."
