      "I understand," says the Spectator. "But I am not judging her panic. I am judging *your* hyperventilation. And from my vantage point in your breast, it looks like you're trying to claim a tragedy you didn't author."
      "But Smith says sympathy requires changing places!"
      "Yes," says the Spectator, adjusting its wig. "But I am the one who stays home to grade the performance. And right now? The emotion is authentic, but the proportion is gauche."
      Dave sits there, hyperventilating politely.

      *Wait, one more check on Smith:* The Spectator is the "man within." It's not a separate person, it's the rational self. The joke works if personified. The key is that the Spectator *cannot* feel the other's pain, only judge the agent's reaction.
      The prompt asks for the Spectator's "structural refusal to enter."
      Okay, let's sharpen that.

      *Revised Punchline:* The Spectator admits it *can't* see the colleague's pain, only Dave's reaction to it. So it approves the *intent* to sympathize but disapproves of the *intensity*.

      *Let's write it.*

      **Subject:** Dave, the Spreadsheet, and the Man Within the Breast.
