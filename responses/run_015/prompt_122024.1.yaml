      *Okay, let's go with the "Performance Review" angle. It fits the office setting and the "judgment" aspect of the Spectator.*

      *(Self-Correction during drafting)*: Make sure not to confuse Smith's "Sympathy" (imagining what *I* would feel) with modern "Empathy" (feeling what *you* feel). Smith is specific: "I change places with you." The joke should reflect that imaginative act.

