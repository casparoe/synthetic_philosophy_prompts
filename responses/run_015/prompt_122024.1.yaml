      *Let's try to make it wittier.*
      "Dave, your guilt is vivid, but it's unbecoming."
      "But I'm suffering for her!"
      "You're suffering *at* her. There's a difference. I can't see her suffering. I can only see you suffering. And you're suffering too much for a Ctrl+Z."
