answer: |-
  He holds a hand out, asks me to count
  the cost against the chance, the shifting odds
  that he can keep me safe, that he can save
  a future life so vast it dwarfs the worth
  of any wallet's content, any sum
  I carry here, just digits, just a number.

  I take a pen to fix the floating number,
  and suddenly the zeros start to count.
  They pile up past the edge of any sum
  a bank would hold. We stop checking the odds.
  The promise swells beyond what money's worth,
  and logic says this equation will save.

  I hand the bill across to save
  myself from thinking it's just any number.
  I cannot say exactly what it's worth,
  this quiet trade. I do not count
  the change remaining. I accept the odds
  because they multiply into a sum.

  We build a ceiling on the sum,
  a hard drive where we save
  the data. We distrust the odds
  when speech runs out before the number.
  We weigh the grain, we count
  the cost of words against the thing of worth.

  In offices we judge the worth
  of distant strangers by a sum.
  The spreadsheet rows count
  the same as napkins. We save
  the file to disk. No one speaks of number
  as magic. We just trust the odds.

  The pattern turns. The odds
  do not change. The worth
  is in the loop. The number
  feeds the sum.
  The machine will save
  whatever we count.

  He waits to see if we count the odds,
  if we save the promise for its worth,
  or if the sum is just a number.
