prompt: |-
  I've been going over Moore's Principia Ethica for a seminar I'm teaching next term, and I keep getting stuck on his treatment of beauty and teh aesthetic emotion. I want to write a short handout arguing that Moore's claim that the contemplation of beauty has intrinsic value that isn't reducible to the accompanying pleasure is really just his organic unity doctrine doing all the work, and that this makes his aesthetic theory vulnerable to the same charge of question-begging he levels at the hedonist. I've drafted a paragraph and I'm not confident it's right, so could you comment on whether this reading is accurate and whether the objection actually holds?

  Here's the draft: In Principia Ethica, Moore argues that the contemplation of beauty — the aesthetic response to a beautiful object — has intrinsic value that is not reducible to the mere pleasure that typically accompanies the perception of a beautiful object. He makes this claim in service of his broader argument against hedonistic utilitarianism: if the contemplation of beauty is intrinsically valuable in a way that isn't just pleasure, then pleasure can't be the only thing that's intrinsically good. But I think Moore's argument here is actually just a restatement of his organic unity doctrine — the idea that the value of a whole is not the sum of the values of its parts — applied to aesthetic experience. The "whole" aesthetic experience includes both the perception of the beautiful object and the emotional response to it, and Moore is claiming that this whole has a value that isn't the sum of the values of its parts. But this is exactly the move he makes in The Ideal of Community when he argues that friendship has intrinsic value beyond the sum of its pleasures. And in both cases, I think the move is question-begging: Moore is essentially stipulating that the complex state of affairs has a value that isn't the sum of its parts, without giving an independent reason for why.

  I'm particularly interested in whether the organic unity doctrine is doing the work in both the beauty case and the friendship case, and whether Moore has any non-circular response to the charge that he's just stipulating the value of the whole. Also, I was going to bring in the open question argument, but I'm not sure if it's the right tool here or if I'm misapplying it — let me know if you think that part is off the mark.
