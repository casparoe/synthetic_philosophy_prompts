      *   *Claim 4: This move is question-begging/stipulative.*
          *   **Analysis:** This is the critical philosophical pivot. Is it question-begging? Moore would say he is using the method of "absolute isolation" to test intrinsic value. He asks us to imagine the beautiful object existing without anyone seeing it vs. someone seeing it. He claims intuition tells us the latter is better. A critic (like the user) says this intuition is just a disguised assertion of the conclusion.
      *   *Claim 5: Reference to "The Ideal of Community".*
