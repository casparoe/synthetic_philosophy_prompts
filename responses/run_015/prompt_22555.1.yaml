      *   *The Critic's Point:* If the intuition just *happens* to align with the organic unity thesis every time, is the thesis doing explanatory work, or is it just a label for "things I intuitively value"? The charge of circularity is strong here. Moore defines the Good via intuition, then uses organic unity to explain why complex wholes are Good, but the evidence for organic unity is... intuition about those wholes.
