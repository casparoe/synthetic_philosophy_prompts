      *   *Key Insight:* The user is essentially proposing a *semanticization of methodology*. I need to highlight the risk of that. Is 'confirmation' a natural kind term? If not, 2D might not fit well. 2D works best for natural kinds (Water, Gold) or phenomenal concepts. 'Confirmation' is a theoretical term.

