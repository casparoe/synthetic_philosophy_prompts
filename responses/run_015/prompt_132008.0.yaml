  7.  (Final Mental Check): The user's "Intermediate" sounds a lot like what some philosophers call a "partial interpretation" or "theoretical role." I should mention that distinction. Also, the "disciplinary frame" is very close to "conceptual scheme." I need to warn them about the Davidsonian objection to conceptual schemes.

