  2.  **Recall/Research Hume's Monetary Theory:**
      *   *Key Texts:* "Of Money," "Of Interest," "Of the Balance of Trade" (from *Political Discourses*, 1752).
      *   *Core Tenet:* Money is not the ultimate source of wealth; it's a "representative" of labor and commodities. "Money is nothing but the representation of labour and commodities."
