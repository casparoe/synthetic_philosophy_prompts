answer: |-
  To understand how David Hume would react to programmable central-bank money (CBDC) with expiry dates or hardcoded negative interest, we must look strictly at his *Political Discourses* (1752), specifically the essays "Of Money," "Of Interest," and "Of the Balance of Trade."

  Hume is often co-opted by modern libertarians as a hard-money absolutist, but his actual reasoning is more nuanced. He viewed money as a "representative" of labor and commodities, not wealth itself. He acknowledged that while money is neutral in the long run, it has powerful short-run effects on industry.

  Here is how Hume would likely analyze programmable decay and negative interest, based on his specific theoretical framework.

  ### 1. Is it still "Money" or a "Rationing Token"?
  Hume defines money as "nothing but the representation of labour and commodities." Its function is to facilitate exchange and allow the storage of value (however temporary) to smooth out transactions.

  If a token has a built-in expiry or decay, Hume would likely argue it ceases to function as a true **store of value**, which is one of the three essential functions of money (even if he didn't use that modern triad explicitly). In "Of Money," Hume notes that people hoard money not out of folly, but to prepare for future contingencies or to accumulate capital for larger enterprises.

  *   **The "Rationing" Argument:** Hume would likely view expiring money not as a rationing token (which restricts *what* you can buy), but as a **coercive velocity mechanism**. It forces the "oil of trade" to move faster than the natural rhythm of commerce.
  *   **The Verdict:** He would probably still classify it as money, but as a **debased fiction**. In his essay "Of Paper Credit," Hume warns that when money loses its connection to real value (specie or goods), it becomes a tool of state manipulation rather than a neutral veil. If the state can program the money to rot, it is no longer a neutral representation of the holder's labor; it becomes a **tax on time**. Hume would argue this transforms money from a *public utility* (facilitating trade) into an *instrument of policy* (forcing consumption).

  ### 2. The Attack on Interest Rates (The Core Theoretical Clash)
  This is where Hume would be most critical. In "Of Interest," Hume makes a groundbreaking argument: **interest rates are not determined by the quantity of money, but by the supply of real capital (thrift) and the demand for borrowing.**

  > "It is not, therefore, the quantity of money... which causes a low interest; but the low interest which causes the increase of money." (Paraphrased)

  Hume argues that simply having more cash in the system does not lower interest rates; only increased frugality and the accumulation of real stock for investment does.

  *   **Programmable Negative Interest:** This mechanism is an attempt to do exactly what Hume said was impossible via monetary manipulation: force down the cost of borrowing or force capital deployment by punishing idleness.
  *   **Hume's Critique:** He would argue that penalizing the holding of money does not create *real capital*. It creates **frantic circulation**. If I spend my money today because it will decay tomorrow, I am not investing in a factory (which requires long-term accumulation); I am consuming goods.
  *   **The Result:** Hume would predict this would not lower real interest rates or increase productive capacity. Instead, it would sever the link between saving and investment. By punishing the accumulation of money balances, the state discourages the very thrift that creates the loanable funds necessary for industry. He would view this as confusing the *medium* (money) with the *substance* (capital).

  ### 3. Monetary Neutrality and the "Awakening" Effect
  Hume is famous for the "Humean Adjustment": an increase in money supply stimulates industry *before* prices rise. He writes:

  > "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the encreasing quantity of gold and silver is favourable to industry."

  He believed that when new money enters, it wakes up "drowsy" workers and merchants. However, once prices adjust, neutrality returns.

  *   **Does Programmability Break Neutrality?**
      *   **Long Run:** No. Hume would maintain that in the long run, prices are determined by the ratio of money to goods. If money decays, its effective velocity increases. Hume explicitly acknowledges that **velocity** acts like quantity: "A greater quantity of money... or a greater rapidity of circulation... must raise the price of every commodity."
      *   **The Adjustment:** Programmable decay forces maximum velocity. Hume would argue this accelerates the inflationary adjustment. Instead of a gradual "awakening," you get a **panic of spending**. Prices would rise not gradually, but instantly, to account for the "hot potato" nature of the currency.
      *   **Neutrality Holds:** The real variables (output, employment) would not permanently benefit. The forced spending would bid up prices until the real value of the money supply (adjusted for decay) equilibrated with the goods available.

  ### 4. The Specie-Flow Mechanism and Capital Flight
  Hume's "Specie-Flow Mechanism" argues that money cannot be kept in one nation if it is out of balance; it flows to where prices are lower/profits are higher.

  *   **International Implications:** If Nation A has programmable decaying money and Nation B has stable specie (or non-decaying crypto/gold), Hume's mechanism predicts immediate capital flight.
  *   **The Reaction:** Merchants in Nation A would immediately convert decaying tokens into foreign bills of exchange or physical goods to preserve value.
  *   **Hume's Warning:** In "Of the Balance of Trade," Hume warns against policies that try to artificially retain money or manipulate its value. He would see programmable money as a violation of the natural equilibrium. The exchange rate would collapse to compensate for the decay rate. The "inflation" would not just be domestic prices rising, but the external value of the currency plummeting.

  ### 5. Summary: Hume's Likely Conclusion

  Hume would not frame this as a violation of "rights" (a modern libertarian frame), but as a violation of **economic causality**.

  1.  **On the Nature of Money:** He would argue that money with expiry is a **contradiction in terms**. Money represents *past* labor stored for *future* exchange. If it cannot bridge time, it is not a representation of value, but a **voucher for immediate consumption**. It becomes closer to a rationing token in the sense that it dictates *when* you must exercise your claim on society's output.
  2.  **On Neutrality:** Programmability does not break long-run neutrality. It merely makes the short-run distortion violent and destructive. The "awakening" effect turns into a "fever." Prices adjust faster, eroding the stimulative benefit Hume prized.
  3.  **On Interest and Capital:** He would condemn negative interest/decay as a category error. It attempts to solve a problem of real capital scarcity with a monetary trick. By punishing hoarding, it punishes the accumulation of the very funds needed for long-term industry.

  **In Hume's own voice (stylized):**
  *"To compel the merchant to part with his gold before he finds a fit opportunity for exchange is to disrupt the natural course of industry. It is to mistake the counter for the goods. If the sovereign stamps a date of death upon the coin, he does not increase the wealth of the nation; he merely ensures that the prices of bread and cloth rise with the rapidity of the decay, leaving the labourer no richer than before, but infinitely more anxious."*

  He would view it as a sophisticated form of debasement—not clipping the coin's edge, but clipping its time. And like all debasement, he would predict it ends in a loss of confidence and a reversion to real value (specie or commodities), rendering the programmability futile in the long run.
