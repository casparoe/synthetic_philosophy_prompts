      *   **Move 6 (Oscar):** Chains through agents are still chains. Contingent facts make it fragile, not different. Duty is heuristic.
          *   *Assessment:* Consistent with counterfactualism. Dismisses the "physical connection" worry by accepting mental states as links.
      *   **Move 7 (Nadia):** No Technician Case. If no role, no omission. If role exists, omission causes. Difference is administrative (normative). So causation depends on norms.
          *   *Assessment:* This is the knockout punch for Oscar's "no norms needed" claim. It shows the *causal status* hinges on the *normative role assignment*.
      *   **Move 8 (Oscar):** "Had someone been assigned" rewrites history. My test requires a specific agent's action to vary. No agent = no test.
