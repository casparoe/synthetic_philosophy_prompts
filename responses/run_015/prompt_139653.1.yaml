answer: |-
  ### 1. The Yes-Case: The Serialized Instruction Stream

  Proponents argue that DNA satisfies the formal definition of a code because the mapping between the tape (codons) and the output (amino acids) is discrete, rule-based, and measurable via Shannon entropy.

  In your terms: The genome is a serialized bytecode stream. The codon table is a hardcoded lookup table within the runtime. Even though the runtime (ribosome/tRNA) is built from the bytecode, the *structure* of the bytecode constrains the runtime's construction deterministically. There is error correction (proofreading polymerases) and noise handling (wobble positioning), implying a channel capacity distinct from the physical substrate.

  The argument is that the sequence carries **control flow information**. If you swap a specific three-letter word, the output changes predictably, regardless of the chemical physics of the nucleotides themselves. The sequence is not just a structural scaffold; it is an addressable index. Therefore, "information" is not a metaphor; it is a quantifiable reduction in uncertainty about the resulting polypeptide chain. The gene is a module with a defined interface, and the cell is the VM that executes it.

  ### 2. The Skeptical Case: The Self-Hosting Circular Dependency

  Skeptics argue that calling it a "code" smuggles in the assumption of a fixed interpreter and an external specification, neither of which exist here.

  In your terms: This is a fully self-hosting JIT where the source code compiles the compiler that compiles the source code, every single run. There is no stable IR boundary. The "lookup table" (tRNA charging) is not hardcoded silicon; it is mutable state generated by the system itself.

  Because there is no external spec (no designer), there is no objective definition of a "bug." A mutation is only an "error" retrospectively, if the runtime fails to persist. Furthermore, the output is heavily context-sensitive. The same bytecode stream yields different binaries depending on the current heap state (epigenetics), available libraries (splicing factors), and environment variables (signaling molecules).

  The claim is that "information" implies a sender and a receiver operating on a convention. Here, the sender (DNA) and receiver (Ribosome) co-evolved. To say DNA "contains" information is like saying a key "contains" the lock's shape. The phenotype is an emergent property of the whole system execution, not a value returned by a specific function call. The "code" label falsely isolates the tape from the machine that reads it.

  ### 3. The Gadget: Portability as the Metric

  **Definition:** Let **Portability** be the stability of a DNA segment's output phenotype when transplanted into a different cellular context (different interpreter version, different runtime state).
  *   *High Portability:* The segment produces the same protein/fold/function in E. coli, Yeast, and Human cells.
  *   *Low Portability:* The segment's output depends entirely on specific local libraries or runtime flags.

  **Recasting the Disagreement:**
  *   **The Yes-Case** claims Portability is high enough to justify the abstraction. They point to conserved genes (histones, ribosomal proteins) that compile successfully across vast architectural differences. They argue the interface is stable enough to treat the gene as a portable library.
  *   **The Skeptical Case** claims Portability is an illusion created by cherry-picking stable modules. They argue that for most phenotypes (development, behavior), Portability is near zero because the "runtime" (the organism's developmental history) is inseparable from the "code."

  **Honesty Check:**
  Does this resolve the fight? **No. It relocates it one level down.**
  Now you are not fighting about "information," you are fighting about a threshold. How much Portability is required to earn the title "Code"? Is 90% stability enough? What if the output is the same protein but folds differently due to chaperone availability?
  *   **Smuggling Alert:** This definition smuggles in the assumption that "Output" is identifiable across contexts. In compilers, you know if two binaries are equivalent. In biology, defining equivalent phenotypes across different organisms is philosophically messy. You are assuming a semantic equivalence relation that doesn't exist in the spec.

  ### 4. Residue Report

  **Residue A: Teleology (Function vs. Effect)**
  *   **The Bit:** Biologists say a gene is "for" building an eye. Compilers say code executes instructions.
  *   **Mapping:** In your vocabulary, code has intent only via the programmer. In biology, "function" is defined by *selection history* (what kept the system running in the past).
  *   **Verdict:** **My vocabulary is poor here.** Compiler theory has no equivalent for "retrospective validation by survival." You have "spec compliance," but no "evolutionary fitness." When biologists say "information," they often mean "information selected for a purpose." Your vocabulary lacks the "selector."
  *   **Fuzziness:** The claim is fuzzier than it sounds. "Function" in biology is often a post-hoc narrative, not a static property.

  **Residue B: Arbitrariness of the Codon Table**
  *   **The Bit:** The mapping of UUU -> Phenylalanine is not chemically necessary; it is a "frozen accident."
  *   **Mapping:** This maps to **Abstract Machine Definition vs. Hardware Physics**. In your world, `0x90` is NOP because Intel defined it, not because voltage levels demand it. If the mapping were purely chemical (lock-and-key affinity between codon and amino acid), it would be chemistry, not code.
  *   **Does it do work?** **Yes.** This is the strongest evidence for the "Yes-Case." The fact that the table *could have been otherwise* proves it is a convention (a code) rather than a physical law.
  *   **Compiler Equivalent:** This is the difference between an ISA (Instruction Set Architecture) and the underlying transistor physics. The ISA is arbitrary; the physics is not. The genetic code is an ISA layered over chemistry.
  *   **Verdict:** **The claim is solid.** The arbitrariness validates the "code" terminology strictly in the sense of an abstract interface layer.

  **Residue C: The "Self-Hosting" Loop**
  *   **The Bit:** The interpreter is compiled from the tape.
  *   **Mapping:** You have this in bootstrapping compilers, but not in runtime.
  *   **Verdict:** **My vocabulary is poor.** We assume a stable toolchain. Biology assumes a mutable toolchain. When biologists argue about "information," they are often arguing about whether the *stability of the toolchain* is guaranteed by the code or by the environment. Your vocabulary assumes the toolchain is trusted infrastructure. Biology cannot make that assumption.

  ### Final Line

  Keep saying "code" if you mean "abstracted control layer with arbitrary mapping," but drop "software" if it implies a fixed machine underneath.
