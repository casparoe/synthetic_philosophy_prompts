answer: |-
  Good morning, and welcome.

  Looking around this room, I see a pretty rare configuration. On one side, we have clinicians who deal with sleep as a biological and psychological reality—something to be measured, treated, and managed. On the other, we have philosophers who treat sleep as a conceptual puzzle—something to be analyzed, questioned, and sometimes dismantled. Usually, these two groups talk past each other. The clinicians need data, and the philosophers ask if the data exists.

  But today, I want us to linger in that friction. Specifically, I want to talk about the very first question asked in this lab, and in therapy offices everywhere: "What did you experience last night?"

  It sounds innocent. It sounds necessary. But it actually smuggles in a massive assumption. It assumes that what happened during sleep was an *experience* in the same way that seeing a tree or hearing a siren is an experience. It assumes the dream report is a memory of an event.

  This is where the philosophy of mind crashes into the clinic. Decades ago, Norman Malcolm argued that dream reports are unique because there is no criterion for being wrong about them. If I say I saw a dragon, you can't check the footage. You have to take my word. Malcolm suggested that because we can't be mistaken, we aren't really describing an observation. We're just expressing a state of mind.

  Then there's Daniel Dennett. Now, if you've picked up an intro textbook, you might have heard that Dennett claims dreams don't happen at all. That's a misreading, and it's one we should leave at the door. Dennett's view—often called the cassette model—isn't that the brain is idle during sleep. It's that the *narrative* we call a dream is finalized only upon waking. The brain isn't playing back a movie recorded during REM; it's writing the script as the lights come on.

  So, here is the tension we are gathered to explore. If Malcolm is right, asking "What did you experience?" treats a subjective impression as an objective event. If Dennett is right, asking "What happened?" treats a current construction as a past memory.

  For the philosophers in the room, this is a problem of verification. But for the clinicians, this is a problem of care. And this is where I think the theoretical becomes deeply practical.

  Consider trauma therapy. If we treat a nightmare report as a literal replay—a memory of a neural event that actually occurred in the night—we are treating the patient's report as archaeological evidence. We are digging for the truth of what happened. But if we lean into the idea that the dream is a narrative constructed upon waking, the report becomes something else. It becomes a story the mind is actively telling itself *now*, in the safety of the therapy room.

  This distinction matters. If the nightmare is a fixed memory of a sleep-event, the patient is a witness to their own trauma, even in sleep. But if the dream is a reconstruction, it implies that the mind is still working on the material. It suggests that the narrative is malleable. It shifts the focus from "What did this dream mean?" to "Why is your mind telling you this story right now?"

  I'm not suggesting we stop asking patients about their dreams. That would be absurd. Patients need to feel heard, and their reports are clinically vital. But perhaps we can be more careful about how we frame the inquiry. When we ask "What did you experience?", we invite the patient to solidify a memory that might actually be a draft.

  This symposium is an opportunity to bridge that gap. The clinicians here know that sleep is real, physiological, and consequential. The philosophers here know that consciousness is slippery and that our access to our own minds is not as direct as we think.

  My hope for the next two days is that we don't let those perspectives cancel each other out. Instead, let's let them complicate each other. Let's acknowledge that when a patient speaks about a dream, they aren't just downloading data from a hard drive. They are engaging in an act of creation.

  If we can keep that tension alive—if we can respect the biological reality of sleep while remaining curious about the philosophical status of the report—we might find better ways to listen. We might find that changing the question changes the healing.

  Thank you, and I look forward to hearing what you discover.
