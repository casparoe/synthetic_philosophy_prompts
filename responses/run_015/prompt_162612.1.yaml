  **Candidate principles**

  Here are three principles that capture your intuitions. First, the **Principle of Civic Membership**: Voting is a ritual act of belonging to a political community. You owe it to your fellow citizens to participate, regardless of whether your ballot changes the outcome. This separates voting from shopping; it is about presence, not purchase. It explains why you voted after the projection was called. Second, the **Principle of Epistemic Responsibility**: You must not cast a ballot unless you possess sufficient knowledge to avoid random harm. Voting ignorant is an abuse of power, unless the stakes are high enough to demand participation despite ignorance. This distinguishes the water district from the national race. Third, the **Principle of Contingent Consequence**: When an election is competitive enough that your vote could plausibly matter, your duty shifts from expressing preference to mitigating harm. In safe seats, you speak your truth; in close races, you prevent the worst outcome. The separation lies in the stakes: Membership demands you show up; Competence limits how you vote; Contingency dictates whether you prioritize expression or results. This structure allows you to hold conflicting intuitions without contradiction, provided you recognize which principle dominates in each context. The tension you feel is not a flaw in your reasoning, but the friction between these distinct moral demands. Membership is about the actor's relationship to the state. Competence is about the actor's relationship to the information. Contingency is about the actor's relationship to the outcome. These principles are hierarchical. Membership is the baseline duty. Competence acts as a constraint on that duty. Contingency modifies the expression of the vote. This hierarchy resolves the conflict between wanting to vote and fearing ignorance. It acknowledges that while you should not vote randomly, the obligation to participate in high-stakes governance supersedes the fear of imperfection.

  **My formula, tested**

  Your formula is strong on consequences but weak on identity. It handles cases 4, 5, and 6 well because it correctly identifies that close races demand strategic voting while safe seats allow expression. However, it breaks on cases 2 and 3. Your formula says ignorance should lead to the same verdict regardless of election type, yet you feel differently about the water district versus the national election. It also fails on case 7; if voting is about affecting outcomes, voting after projection is irrational, yet you feel it was right. Finally, it offers no guidance on case 8. Your formula treats voting as a tool for influence or expression, but misses the dimension of voting as a ritual of membership. You need a clause that accounts for the duty to participate independent of utility, and a modifier that adjusts the knowledge requirement based on the stakes involved. Without these, you cannot explain why ignorance is forgivable in national elections but abusive in local ones.

  **Where each clause comes from**

  The **Civic Membership** clause comes directly from cases 1 and 7. In the safe district, you voted despite futility because not voting felt like a failure of character. In the post-projection case, you stood in line despite the outcome being settled. This proves you value the act itself, not just the result. The **Epistemic Responsibility** clause is forced by case 2. You felt random voting was an abuse. However, to save case 3, this clause must include a stakes modifier. National elections carry enough weight that the duty of membership overrides the risk of ignorance; water districts do not. This saves the pair from contradiction. The **Contingent Consequence** clause is derived from cases 5 and 6. In the close state, you feel obligated to vote for the lesser evil, even against your preference. In the safe state, you feel free to vote for a small party or write in a joke. This clause dictates that the potential for impact changes the moral calculus from "what do I believe" to "what harm do I prevent." It explains why you would feel complicit voting lesser-evil in a close race but not in a safe one. These clauses together respect your intuition that voting is both a personal statement and a public trust, weighted by the risk of real-world harm. This implies that abstaining in a high-stakes election due to ignorance is a greater moral failure than voting imperfectly. The risk of harm from a bad national leader outweighs the risk of your ignorant vote aiding them. Also, expand on case 6. The feeling of complicity in case 6 is key. It shows that consequences carry moral weight. When you vote lesser-evil in a close race, you accept moral dirt to prevent greater injustice. In a safe race, you remain clean because your vote changes nothing. This distinction preserves your integrity while acknowledging political reality. The clauses are not equal; they operate in sequence. Membership opens the door, Competence checks your readiness, and Contingency directs your hand. Specifically, case 5 forces the distinction between safe and close states. Without the Contingency clause, you cannot explain why the small party is good in one state and wrong in the other. The principle must acknowledge that the moral weight of a vote scales with its probability of affecting outcomes. This scaling is what allows you to feel complicit in the close state but not the safe one. It validates your feeling that you "owe" your vote to the lesser evil only when that vote actually protects someone.

