answer: |-
  Your diagnosis is remarkably acute, and it cuts to the heart of a persistent difficulty in the project of codified self-improvement. You are describing a structural pathology inherent in any attempt to reduce the fluidity of character to a fixed ledger. Before settling on a terminology, let us briefly weigh the existing conceptual candidates you rightly dismissed, along with a few others from the history of moral philosophy.

  **Brainstorming Existing Notions**

  1.  **Casuistry:** In the early modern period, particularly within Jesuit moral theology, casuistry was the method of resolving moral dilemmas by applying general rules to particular cases. Critics like Pascal (in the *Provincial Letters*) accused casuists of exactly the manoeuvre you describe: bending the rule to fit the desire rather than the desire to fit the rule. However, 'casuistry' names a *method* of reasoning, not necessarily the *psychological mechanism* of category deformation. One can be a rigorous casuist without slipping into this error.
  2.  **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is the closest economic analogue. It captures the degradation of the metric. However, Goodhart's Law is typically external and systemic (e.g., school test scores), whereas your phenomenon is internal, semantic, and phenomenological. It concerns how the agent *sees* the action, not just how the metric performs.
  3.  **Self-Deception / Rationalisation:** As you noted, these are too generic. They describe the *state* of the agent but not the *mechanism*. They do not explain *how* the deception is achieved. Your insight is that the deception is achieved via the *taxonomy itself*.
  4.  **Moral Licensing:** This suggests that doing good allows one to do bad later. Your phenomenon is simultaneous: the bad act is reclassified as good *in the moment* via the taxonomy.
  5.  **Concept Stretching:** In political science (Giovanni Sartori), this occurs when a concept is extended to cover too many cases, losing its distinctiveness. This is close, but usually implies a loss of analytical power for the observer, whereas your case involves a gain in psychological comfort for the agent.

  **The Verdict**

  There is no single canonical term in the history of virtue ethics that captures this specific two-part structural failure (the Procrustean constraint followed by the semantic deformation). While 'Casuistical Evasion' is the historical neighbour, it lacks the precise focus on the *taxonomic structure* of the virtues themselves.

  Therefore, I propose we coin the term **Virtue Elasticity**.

  While your phrase 'Taxonomic Homeostasis' is an excellent description of the *effect*, **Virtue Elasticity** better captures the *property* of the moral framework that permits it. It designates the specific capacity of a codified virtue to expand its semantic boundaries to accommodate conflicting impulses without registering a failure, thereby preserving the coherence of the moral ledger at the expense of moral truth.

  ***

  ### Definition: Virtue Elasticity

  **Virtue Elasticity** is a structural pathology of codified moral systems (such as Franklin's ledger) wherein the definition of a virtue is implicitly stretched to absorb actions that would otherwise constitute vices, driven by the need to maintain the integrity of the moral self-conception.

  It operates through two necessary conditions, corresponding to the two parts of your observation:

  1.  **Taxonomic Constraint:** The agent perceives moral reality *only* through the pre-existing categories of the ledger. Novel dilemmas are not assessed on their own merits but are forced into the nearest available virtue-box (e.g., a dilemma involving honesty and kindness is forced into 'Silence' or 'Frankness').
  2.  **Defensive Redescription:** When an action threatens to breach a category, the boundary of that category is elastically deformed to include the action. This is not conscious lying (which would register as a failure of 'Sincerity'), but a genuine shift in the agent's perception of the category's extension.

  ### Boundary Conditions and Nearest Neighbours

  To ensure this concept does not become a catch-all for moral failure, we must specify where it applies and where it does not.

  **1. Virtue Elasticity vs. Phronesis (Practical Wisdom)**
  This is the crucial distinction in virtue ethics. Aristotle's *phronesis* allows for flexibility; the virtuous agent knows that telling the truth to a murderer at the door is not truly 'Justice' or 'Honesty' in that context.
  *   **Differentiation:** *Phronesis* is truth-tracking; it bends the rule to serve the *telos* (the good). **Virtue Elasticity** is coherence-tracking; it bends the rule to serve the *ledger* (the record). In *phronesis*, the agent might feel regret or moral residue even when doing the right thing. In **Virtue Elasticity**, the agent feels vindicated because the ledger remains clean.
  *   *Test Case:* If Franklin declines the toast to preserve his health (Temperance) and feels the social cost as a genuine loss, that is *phronesis*. If he drinks the toast and redefines Temperance as "not drinking to excess unless socially mandated," thereby feeling no loss, that is **Virtue Elasticity**.

  **2. Virtue Elasticity vs. Rationalisation**
  Rationalisation is often post-hoc and conscious or semi-conscious.
  *   **Differentiation:** Rationalisation admits a conflict ("I wanted to drink, but I told myself it was okay"). **Virtue Elasticity** dissolves the conflict ("Drinking this *is* Temperance because Temperance includes civility"). The taxonomy itself has changed, not just the excuse.
  *   *Requirement:* **Virtue Elasticity** does not require a written ledger. It operates wherever a moral schema is sufficiently rigid to constrain perception but sufficiently vague to permit semantic shifting. An internalised list of "principles" functions identically to Franklin's book.

  **3. Virtue Elasticity vs. Goodhart's Law**
  *   **Differentiation:** Goodhart's Law predicts the metric will fail. **Virtue Elasticity** explains *why* the metric appears to succeed despite failing. It is the mechanism of the illusion.

  ### Application to Franklin's Toast

  In your example, Franklin faces a conflict between **Temperance** (moderation) and **Civility/Justice** (not insulting a host).
  *   **Without Elasticity:** Franklin recognises a genuine moral remainder. He either breaches Temperance (and marks a black spot) or breaches Civility (and suffers the social insult). The ledger records a cost.
  *   **With Elasticity:** The definition of Temperance expands. It is no longer "Eat/Drink moderately" but "Eat/Drink moderately *except where social duty requires*." Because 'Social Duty' is another box on the ledger (perhaps 'Justice' or 'Order'), the action is shuffled between boxes. The ledger remains spotless. The moral tension is not resolved; it is categorised away.

  ### The Philosophical Implication

  The danger of **Virtue Elasticity** is that it converts a **Tracking System** into a **Constitutive System**.
  *   In a **Tracking System**, the virtues describe a reality of character independent of the ledger. The ledger can be wrong.
  *   In a **Constitutive System**, the ledger *defines* the character. If the ledger says you are virtuous, you are virtuous.

  Franklin's project risks becoming constitutive. If the ledger is the ultimate arbiter of virtue, and the ledger is protected by **Virtue Elasticity**, then the agent becomes morally invulnerable to their own system. They cannot fail, because the definition of failure shifts to exclude their actions. This creates a closed epistemic loop—a form of **Ethical Solipsism**—where the agent is no longer engaging with the world, but only with their own classification of it.

  ### Conclusion

  You have identified a mechanism that explains why moral accounting often produces self-satisfaction rather than self-improvement. While 'Taxonomic Homeostasis' is a apt description of the dynamic, I propose **Virtue Elasticity** as the formal term for this structural capacity. It distinguishes the phenomenon from mere self-deception by locating the error in the *architecture of the virtues* themselves, rather than solely in the psychology of the agent. It serves as a warning that any virtue ethics which relies on codification without an external check (such as the 'Impartial Spectator' of Adam Smith, or the communal correction of the *polis*) is susceptible to becoming a machine for generating innocence rather than virtue.
