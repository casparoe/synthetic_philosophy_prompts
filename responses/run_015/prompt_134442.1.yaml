  6.  **Developing Specific Points:**

      *   *Neural Opponent Processes:* If dopamine/opioid systems are just inverse states, the structural claim fails.
      *   *The "Speckles vs. Torture" Argument (Parfit):* Usually used against aggregation. Here, used against the threshold. If we accept lexicality, do we accept saving one person from torture over billions enjoying a party? If yes, is that defensible without infinity?
