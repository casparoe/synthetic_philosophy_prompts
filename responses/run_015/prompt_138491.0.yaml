      *(Self-Correction during drafting)*: I need to be careful with Dennett. Dennett says if the Intentional Stance works, the beliefs are *real*. He doesn't care about the internal mechanism. However, the *user's* problem is legal liability. If the trace is laundered, saying "The system believed Y" might be factually true in a Dennettian sense (it's the best predictor) but legally risky if the trace is known to be post-hoc. I need to bridge this.
      *Decision:* The procedure will define "Real Pattern" as "Predictive Stability across Counterfactuals." If the trace is laundered, it won't track counterfactuals reliably. Thus, the Intentional Stance fails the *operational* test even if it feels right. This protects the company from claiming "belief" where there is only "narrative."

      *Case (c) Calibration:* A rule-based system. The Design stance should be perfect. The Intentional stance should add no compression. The procedure must explicitly reject Intentional here.

      *Case (b) Laundering:* This is the critical one. If the trace is optimized for plausibility, does it support prediction? If it's just plausible noise, it won't predict *specific* failures in new contexts. The test must catch this.

      *Case (a) DB Delete:* Classic goal misgeneralization. Likely passes Intentional test.

