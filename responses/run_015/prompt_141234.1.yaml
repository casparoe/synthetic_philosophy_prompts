      *   In the moving average case, the "raw footage" *is* the smoothed version. The physical stimulus at $t$ is constitutively dependent on $t+75ms$.
      *   Therefore, asking "did the revision happen before or after experience?" is category mistaken. There is no "before" experience where the data existed in an unaveraged state *as a stimulus*.
