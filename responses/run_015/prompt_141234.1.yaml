      *   Key Feature: *Retrospective* and *Prospective* dependence. The stimulus at $t$ is physically defined by future inputs (the moving average). The perception also has motor lag.
      *   The Problem: Orwellian/Stalinesque relies on a sequence: Input -> Experience -> (maybe) Revision. It assumes a "moment of experience" that can be compared to a "moment of input."

