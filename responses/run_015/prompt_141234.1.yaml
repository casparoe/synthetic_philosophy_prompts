      *   **User's Goal:** Wants an example where this distinction *breaks down conceptually*, not just empirically. Not "we can't tell," but "the categories don't apply."
      *   **Specific Scenario:** A single dot drifting smoothly. Color at time $t$ is a moving average over a 150ms window centered on $t$ (future-dependent). Subject presses a button when it looks green (motor integration window also involved).
      *   **Constraints:**
