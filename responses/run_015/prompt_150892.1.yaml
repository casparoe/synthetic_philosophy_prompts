  *   **Implication for Audit:** Confused. You already have the right to trust the harness; asking for proof misses that right.
  *   **Definition of "Justify":** To provide evidential support.
  *   **Verdict Tag:** *Rational Entitlement.*

  **5. The Rulebook (Non-Propositional)**
  *   **Thesis:** Hinges are not facts to be proven true/false, but rules that define the game.
  *   **What Hinges Are:** Rules of grammar or practice (like "checkmate ends the game").
