  ### Menu of Readings

  **1. The Regress Stopper**
  *   **Thesis:** Chains of reasons must end somewhere; if you demand proof for everything, you never start.
  *   **What Hinges Are:** The foundational premises where reasoning stops.
  *   **Strength of "Can't":** Logically impossible (infinite chains are impossible).
  *   **Status:** Contested (some argue for circular coherence instead of foundations).
  *   **Implication for Audit:** Forbidden. Auditing the harness requires a deeper standard, which requires another, ad infinitum.
  *   **Definition of "Justify":** To derive from a prior, more secure reason.
  *   **Verdict Tag:** *Logical Bedrock.*

  **2. The Cognitive Limit**
  *   **Thesis:** Humans cannot consciously verify every assumption simultaneously while functioning.
  *   **What Hinges Are:** Unchecked assumptions required for mental bandwidth.
  *   **Strength of "Can't":** Psychologically impossible for creatures like us.
  *   **Status:** Platitude (obviously true).
  *   **Implication for Audit:** Possible in principle, but you would have to stop all other work to do it.
  *   **Definition of "Justify":** To consciously verify and validate.
  *   **Verdict Tag:** *Bandwidth Constraint.*

  **3. The Procedural Rule**
  *   **Thesis:** Inquiry requires agreed-upon fixed points as a matter of policy to make progress.
  *   **What Hinges Are:** Provisional policies or protocols.
  *   **Strength of "Can't":** Normatively impermissible (against the rules of the practice).
  *   **Status:** Defensible (standard engineering practice).
  *   **Implication for Audit:** Allowed only if you formally change the development protocol.
  *   **Definition of "Justify":** To validate according to current process rules.
  *   **Verdict Tag:** *Policy Choice.*

  **4. The Free Pass (Entitlement)**
  *   **Thesis:** Some claims are rational to trust without evidence; demanding evidence is unnecessary.
  *   **What Hinges Are:** Truth-apt claims that are warranted without proof.
  *   **Strength of "Can't":** Pragmatically futile (you have warrant already).
