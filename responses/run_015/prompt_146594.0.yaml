answer: |-
  ### 1. Logical Ordering of Claims

  To ensure the third claim is understood as a necessary consequence rather than an independent policy preference, the claims must be introduced in the following order:

  1.  **Money is not Wealth (The Ontological Claim):** Establish that money is a "counter" used to facilitate exchange, not the "goods" being exchanged. Real wealth consists of commodities and labour.
  2.  **Specie Increase Raises Prices Proportionally (The Mechanism Claim):** Demonstrate that increasing the number of counters without increasing the goods merely changes the numerical labels on prices (the Quantity Theory of Money).
  3.  **Anxiety about a Favourable Balance of Trade is Groundless (The Policy Claim):** Conclude that because money automatically flows to where prices are lower (to restore equilibrium), a state cannot permanently hoard specie through trade policy.

  **Prerequisite for Understanding:**
  Before the third claim can be intelligible, students must grasp the **distinction between nominal and real variables**. If they believe money *is* wealth (Claim 1 failed), then hoarding money via a trade surplus *would* increase wealth, making the Balance of Trade anxiety rational. If they believe prices do not adjust to money supply (Claim 2 failed), then specie could accumulate without triggering the outflow mechanism. Therefore, Claims 1 and 2 are the logical conditions of possibility for Claim 3.

  ### 2. The Carrying Example: "The Gold Island"

  **Scenario:** An island community produces a fixed basket of goods (corn, cloth, tools) using full employment of land and labour. Prices are set by long-standing custom. A shipwreck deposits a large chest of gold coin onto the shore, which the inhabitants distribute among themselves.

  **What the Scenario Must Include:**
  *   **Customary Nominal Rigidity:** Prices must be fixed by custom for exactly one production cycle. This allows students to see the *transition* period where holders of new gold feel richer and demand more goods before prices adjust.
  *   **Full Employment:** The island must already be producing as much as it can. This ensures the new gold cannot stimulate *more* output, only higher prices.
  *   **Specie-Only Circulation:** Money must be physical gold coin.
  *   **A Neighbouring Island (Introduced at Claim 3):** To illustrate the Balance of Trade, introduce a second island with lower prices. The Gold Island's inhabitants will naturally buy cheaper goods from the neighbour, causing the gold to flow out.

  **What the Scenario Must Deliberately Exclude:**
  *   **Credit and Banking:** Exclude promissory notes, loans, or fractional reserves. This prevents students from conflating Hume's *specie* with modern *fiat* or *credit money*.
  *   **Technological Progress:** Exclude any increase in productivity during the session. This isolates the money supply as the only variable changing.
  *   **International Exchange (Initially):** Exclude trade during the explanation of Claims 1 and 2. Trade is only introduced when addressing Claim 3. This prevents students from attributing the price rise to import/export dynamics rather than the domestic quantity of money.

  ### 3. Mapping Misconceptions

  **Misconception 1: Monetarist Neutrality (Money is a "Veil" with no real effects)**
  *   **The Error:** Students will assume Hume argues money *never* affects the real economy, viewing him as a strict long-run monetarist.
  *   **Where to Head It Off:** During **Claim 2 (The Mechanism)**, specifically when discussing the transition period before prices rise.
  *   **How:** Leverage their reading of the *Treatise* on **custom and habit**. Explain that because prices are fixed by custom, the new gold *does* stimulate industry temporarily (people spend more before sellers raise prices). Emphasize that Hume's "neutrality" is a long-run equilibrium, not an instantaneous state. The "shock" matters, even if the end-state does not.

  **Misconception 2: Contemporary Free-Trade Ideology (Hume as a Neoliberal)**
  *   **The Error:** Students will interpret Hume's rejection of mercantilism as a moral endorsement of modern globalized free trade or deregulation.
  *   **Where to Head It Off:** During **Claim 3 (Balance of Trade)**.
  *   **How:** Frame the argument as **metaphysical futility**, not **moral virtue**. Hume is not saying trade is "good"; he is saying that trying to *hoard* money via trade restrictions is physically impossible (like trying to hold back the tide). Distinguish between "policy is useless" (Hume) and "policy is immoral" (Modern Ideology).

  **Misconception 3: Keynesian Sticky-Price Theory (Hume anticipates Aggregate Demand management)**
  *   **The Error:** Students will read the "temporary real effects" (from Misconception 1) as an anticipation of Keynesian demand stimulation or unemployment reduction.
  *   **Where to Head It Off:** During **Claim 2**, when explaining *why* prices eventually rise.
  *   **How:** Clarify that for Hume, the price adjustment is inevitable because money is merely a counter. Unlike Keynes, Hume does not envision a scenario where the economy gets "stuck" in low output. The "stickiness" is due to *customary slowness*, not a failure of aggregate demand. The economy always returns to full employment; the money only changes the price level.

  ### 4. Diagnostic Question

  **Question:**
  "Imagine the Gold Island discovers a way to double its corn production at the exact same moment the shipwrecked gold is distributed. According to Hume's reasoning, what happens to the price of corn, and does the island's 'wealth' change? Explain why the outcome differs from the scenario where only the gold increases."

  **Rationale:**
  This tests whether they understand the *dependency* between the quantity of money and the quantity of goods.
  *   *Slogan retention* will lead them to say "Prices always rise when gold rises."
  *   *Grasping the doctrine* requires them to recognize that if goods double *and* money doubles, prices remain stable, and real wealth (corn) has actually increased. This confirms they understand money is not wealth (Claim 1) and that prices depend on the *ratio* of money to goods (Claim 2).

  ### 5. Omissions and Acknowledgement

  **What to Leave Out:**
  *   **Fiat Currency:** Do not discuss government-issued money not backed by commodities.
  *   **Central Banking:** Do not mention interest rates, inflation targeting, or quantitative easing.
  *   **Exchange Rates:** Do not discuss floating currency values, only the physical flow of specie.

  **How to Acknowledge the Omission:**
  Open the session by stating: *"We are analysing Hume's argument within the context of an 18th-century specie economy. Hume is making a claim about the nature of value and causation, not providing a manual for the Bank of England. We will deliberately suspend assumptions about modern credit systems and fiat currency. This is not because those systems are irrelevant today, but because introducing them now would obscure the specific philosophical mechanism Hume is isolating: the relationship between physical tokens and real goods."*
