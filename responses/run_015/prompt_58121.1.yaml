answer: |-
  # Which View on Composition Do You Actually Hold?
  **Intro Metaphysics Study Group Handout**

  **Instructions:** Read each case below. Don't overthink the physics; focus on your metaphysical intuition. Is there a *single object* there, or just a bunch of parts arranged in a certain way? Mark your answer.

  ***

  ### The Cases

  **1. The Half-Built Lego Bridge**
  You have snapped ten Lego bricks together into a bridge shape, but it's not connected to anything else and serves no function yet.
  *   **A)** Yes, there is a "Lego Bridge" object.
  *   **B)** No, there are just ten bricks arranged bridge-wise.

  **2. The Elevator Strangers**
  Two people who don't know each other are stuck in an elevator together for one hour. During that hour, do they compose something?
  *   **A)** Yes, there is a temporary object composed of those two people.
  *   **B)** No, there are just two people standing near each other.

  **3. The Dead Ant Colony**
  A colony of ants dies simultaneously due to pesticide. Their bodies remain in the nest structure for a week.
  *   **A)** Yes, the "Dead Colony" is still an object.
  *   **B)** No, there are just many dead ants arranged in a nest.

  **4. The Constellation**
  Consider three stars in the night sky that form Orion's Belt. They are lightyears apart but form a pattern from our view.
  *   **A)** Yes, "Orion's Belt" is a single scattered object.
  *   **B)** No, there are just three distant stars.

  **5. The Working Wristwatch**
  A fully assembled mechanical watch is ticking on a table.
  *   **A)** Yes, there is a "Watch" object.
  *   **B)** No, there are just gears and springs arranged watch-wise.

  **6. The Living Human**
  Consider your friend sitting across from you, breathing and thinking.
  *   **A)** Yes, there is a "Human Organism" object.
  *   **B)** No, there are just cells and atoms arranged human-wise.

  **7. The Moon and Your Penny**
  Consider the sum of the Moon and the specific penny currently in your pocket.
  *   **A)** Yes, there is a single scattered object (The Moon-Penny).
  *   **B)** No, there are just two unrelated things.

  **8. The Cloud**
  A cumulus cloud is a collection of water droplets with no sharp boundary.
  *   **A)** Yes, there is a "Cloud" object.
  *   **B)** No, there are just water droplets in the air.

  ***

  ### Scoring Key

  Tally your **A (Yes)** answers in the three categories below.

  | Category | Questions | Your "Yes" Count |
  | :--- | :--- | :--- |
  | **I. Organisms** | Q3 (Dead Colony), Q6 (Human) | \_\_\_ / 2 |
  | **II. Artifacts/Ordinary** | Q1 (Lego), Q5 (Watch), Q8 (Cloud) | \_\_\_ / 3 |
  | **III. Random/Scattered** | Q2 (Elevator), Q4 (Stars), Q7 (Moon+Penny) | \_\_\_ / 3 |

  ***

  ### Diagnose Your View

  **1. The Nihilist (Mereological Nihilism)**
  *   **Pattern:** Almost all **B**s. (Total "Yes" count: 0 or 1).
  *   **Verdict:** You likely believe composition *never* occurs. There are only simples (atoms/particles). Even humans are just "simples arranged human-wise."
  *   **Note:** If you answered **A** to Q6 (Human) but **B** to everything else, you might be an *Organic Nihilist* (only living simples count?), which is a rare/hard-to-defend hybrid.

  **2. The Universalist (Mereological Universalism)**
  *   **Pattern:** Almost all **A**s. (Total "Yes" count: 7 or 8).
  *   **Verdict:** You believe composition *always* occurs. Any collection of things, no matter how scattered, composes a whole.
  *   **Note:** If you answered **B** to Q7 (Moon+Penny) but **A** to everything else, you are an *Almost-Universalist*. This quiz struggles to separate you from a true Universalist who just finds Q7 intuitively jarring.

  **3. The Life-Only Organicist (Van Inwagen Style)**
  *   **Pattern:** **A** on Q6 (Human); **B** on Q1, Q2, Q3, Q4, Q5, Q7. (Q8 Cloud is the tie-breaker).
  *   **Verdict:** Composition occurs *only* when the parts constitute a life. Artifacts (Lego, Watch) and Random Sums (Elevator, Stars) do not exist as wholes.
  *   **Crucial Check:** If you said **A** for Q3 (Dead Colony), you are **not** a strict Life-Only theorist (since the life has ended).

  **4. The Brutalist (Brute Fact / Common Sense)**
  *   **Pattern:** **A** on Organisms (Q6) AND Artifacts (Q1, Q5, Q8); **B** on Random/Scattered (Q2, Q4, Q7).
  *   **Verdict:** You believe composition happens for "ordinary" objects but not for arbitrary sums. You likely reject a strict *principle* (like "Life" or "Contact") and think it's just a brute fact that chairs exist but "trout-turkeys" don't.
  *   **Crucial Check:** If you said **A** for Q3 (Dead Colony), you fit here (Brutalism allows dead artifacts/structures). If you said **B** for Q3, you might be a *Restrictivist* who ties composition to current function.

  ***

  ### Caveats & Flags

  **⚠️ Incoherent / Unexplored Combos**
  *   **The "Reverse Elitist":** If you answered **A** (Yes) for Random/Scattered cases (Q2, Q4, Q7) but **B** (No) for Organisms (Q6), your view is likely **incoherent**. It is metaphysically difficult to argue that two strangers in an elevator compose an object while a living human being does not.
  *   **The "Artifact-Only" Theorist:** If you said **Yes** to Watches/Legos but **No** to Humans, you hold a view rarely defended in literature (denying biological unity while accepting mechanical unity). This is an **unexplored** niche.

  **🚩 Views This Quiz Cannot Separate**
  *   **Brutalism vs. Moderate Restrictivism:** A Brutalist (no principle) and a Moderate Restrictivist (e.g., "Composition occurs when parts are fastened or functionally unified") will score identically on this quiz. Both say Yes to Watches, No to Elevator Strangers. Distinguishing them requires asking *why* you hold the view, not just *which* cases you accept.
  *   **Universalism vs. Almost-Universalism:** If you accept composition for 99% of cases but draw the line at one absurd case (like the Moon+Penny), this quiz lumps you in with Universalists. The difference is one of theoretical purity vs. intuitive tolerance.
