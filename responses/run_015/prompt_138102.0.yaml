answer: |-
  The envelope from the Office of Marginal Effects sat on the Formica table, white against the chipped green surface. Elara stood over it, her coat still on, smelling of wood smoke and school floor wax. Outside, the valley haze hung low, a yellow bruise against the mountains. Inside, the house was warm. It was always warm.

  She had burned the black bricks for thirty years. Every winter, the Office sent the difference number. Every winter, it read 0.000. *Without marginal effect.* She had treated those zeros as a moral shield, a mathematical absolution. If the sum of her burning was less than half of one-thousandth of a death, then it was nothing. Nothing cannot be sin.

  This year, the number was 1.000.

  The door opened behind her. Leo, her grandson, shook the snow from his boots. He was twenty-two, studying engineering at the university on the ridge. He saw the envelope before he saw her face.

  "Did you get the settlement?" he asked.

  Elara touched the paper. "I tipped the pool."

  Leo came closer, reading the bold print over her shoulder. *Notice of Liability: Cumulative Threshold Exceeded. Unit Charged: 1 Statistical Death.* He whistled, low and sharp. "Grandma, that's... that's the first time in the block. Maybe the district."

  "It's the math," she said, her voice steady. "The remainders add up. Someone had to cross the line."

  "But you."

  "If I hadn't burned last night, the pool would have been at 0.999. The house across the street burns more than me. Their remainder would have pushed it over this morning. The death happens either way."

  Leo pulled out a chair and sat. He didn't take off his gloves. "The Office doesn't care about the counterfactual. They care about the trigger. You pulled it."

  "I didn't pull anything. I heated my home. The Office invented the pool. They invented the tipping point. They decided that when the invisible fractions add up to a whole person, the person who lit the match owns the corpse." Elara finally took off her coat. She hung it on the rack, smoothing the sleeves. "My number was 0.000 for thirty years, Leo. I was invisible. Now I'm visible because the sum changed, not because I did."

  "You know what the neighbors say," Leo said. "They say the Office picks the tipper at random when the pool is close. To keep everyone scared."

  "Doesn't matter."

  "It matters if you're the one holding the bill for a dead man."

  Elara walked to the window. The furnace hummed in the basement, a deep, rhythmic thrum she had felt in her bones since before Leo was born. She could turn it off. She could switch to electric, though the cost would starve them by spring. She could let the pipes freeze. But if she turned it off, the pool would still fill. The city would still burn. The death assigned to her name would simply shift to the next household on the ledger. The body would still drop.

  "So what do you do?" Leo asked. He was watching her hands. "Do you appeal?"

  "On what grounds? That I wish the arithmetic were different?"

  "On grounds that you didn't actually kill anyone."

  Elara turned from the window. The room was dim, the light failing early in the winter dusk. "I completed the circuit. That's what the notice says. I completed the circuit."

  "But the current was already there."

  "Someone has to close the switch." She walked back to the table and sat opposite him. The notice lay between them like a verdict. "I used to think the zeros meant I was clean. Now I see the zeros were just a delay. They let me sleep while the pool filled. They let me believe that small things don't count until the moment they count too much."

  "That's not fair."

  "Fairness isn't in the protocol." Elara reached out and tapped the 1.000. "If I stop burning now, does the death come back? Does the person breathe again?"

  "No."

  "Then my penance doesn't help them. It only helps me feel less like a murderer." She looked at Leo. "And if I keep burning, I stay warm, and the city stays warm, and the death stays charged to me. There is no move that clears the name."

  Leo looked down at his gloves. "You could stop. To prove you know it's wrong."

  "To prove what? That I understand the rules?" Elara stood up. She walked to the thermostat on the wall. Her hand hovered over the dial. She could hear the furnace waiting below, hungry for the next cycle. If she turned it down, the cold would creep in by morning. If she didn't, the number next year might be 0.000 again, or it might be another 1.000. The pool never emptied. It only waited for the next tip.

  She left her hand on the wall for a moment, feeling the vibration of the house, the heat moving through the plaster. Then she took her hand away. She picked up the notice, folded it once, and placed it under the magnet on the refrigerator, next to a drawing Leo had made in kindergarten.

  "Dinner?" she asked.

  Leo looked at the fridge, then at her. He didn't answer immediately. The furnace kicked on downstairs, a heavy clank followed by the rush of air through the vents. The house warmed. The smoke rose outside, joining the haze over the valley.

  ***

  | Move in the story | The thesis it leans on | Status | Strongest objection |
  | :--- | :--- | :--- | :--- |
  | Elara's reliance on the 0.000 number as moral absolution. | Acts causing harm below a perceptible or administrative threshold are morally negligible for the agent. | Genuinely contested among them. | Many argue that expected utility matters regardless of perceptibility; negligible risk aggregated is still harm. |
  | The "Tipping Notice" assigning full responsibility to the threshold-crosser. | Causal responsibility can be discretized and assigned to a specific agent even in collective harm scenarios. | Invented for this story. | Real-world collective harm is rarely so linearly additive or discretely assignable to single agents. |
  | Elara's claim that abstaining would not have prevented the death. | In overdetermined scenarios, individual abstention does not change the outcome, thus negating consequentialist blame. | Genuinely contested among them. | Complicity theorists argue participation matters morally even if the outcome is fixed (non-consequentialist views). |
  | The ending image of the furnace kicking on despite the knowledge. | Moral knowledge does not necessarily compel behavioral change when the system renders individual action futile. | Settled among people who work on this. | Some virtue ethicists might argue true moral understanding would necessitate sacrifice regardless of efficacy. |

  ### Liberties

  This story takes significant liberties with the metaphysics of harm to make the philosophical problem legible. The "Office of Marginal Effects" treats statistical deaths as discrete units that accumulate in a literal pool, which is a narrative device rather than an empirical claim about pollution or mortality. In reality, collective harms like air pollution are probabilistic and diffuse; there is no specific moment where a "death" is completed by a specific household's emissions, nor is there a mechanism where remainders accrue to tip a scale. The story also rests on a contested reading of overdetermination: it presents the "someone else would have done it" defense as a coherent counterfactual, whereas many ethicists argue that participating in a harmful practice incurs moral liability regardless of whether the specific outcome was pre-determined by others. The rounding rule dramatizes the sorites paradox, but real-world regulatory thresholds do not carry the same moral weight as the protagonist assigns them.
