          *   *Rank 2 (Significant):* (f) vs. Standard Relationship Accounts. You are taking a side in a major debate. Not a contradiction, but a commitment cost.
          *   *Rank 3 (Minor):* (d) Binary vs. Intuition. Most people think standing *is* scalar (a little hypocrisy reduces authority but doesn't erase it).
      *   **Section 4: The Single Revision.**
          *   What fixes the most? Revising (d) or (g).
          *   Recommendation: Soften (d). Make standing *pro tanto* or scalar, OR refine (c) "relevant similarity" to require *significant* similarity in magnitude/context.
          *   Better Revision: Modify (g). "Clean hands" shouldn't mean "sinless." It means "not currently guilty of the same unacknowledged violation."
