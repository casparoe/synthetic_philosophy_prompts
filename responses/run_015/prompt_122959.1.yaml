      *   If I change (g) to allow for owned-up past wrongs, it helps, but (d) is the harder barrier. If (d) says "no discounting," then even a tiny wrong forfeits standing for a huge wrong.
      *   *Decision:* The revision should target (d). Allow magnitude to count. This aligns with the "commitment to the norm" view of hypocrisy (Fritz/Miller). If I violate the norm slightly, but the target violates it egregiously, my commitment isn't sufficiently undermined to lose standing.

  7.  **Checking against "Settled vs. Live":**
