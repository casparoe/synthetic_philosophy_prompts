  Subject: Questions for [Guest Name] next week

  Hey Sam,

  Here's the draft run-down for the philospher interview. I tried to avoid letting her just rehash the "unitary intervention" thing over and over. Want to make sure we push on the implications rather than the setup. 

  There's 6 questions below with follow-up sketches keyed to how she'll probably dodge. Let me know if these feel right or if we need to tweak the tone.

  **1. The Compatibilism Trap**
  You're defending PAP, which is usually an incompatibilist stronghold, but your solution relies on the *structure* of deliberation rather than the ability to output a different action. Doesn't this layered-track model basically collapse into the compatibilist "guidance control" view you're trying to argue against?
  *   *Follow-up:* If she says "No, because I still require alternative possibilities," press her on what work those possibilities are doing if the actual action is locked. Is it just a metaphysical ornament?

  **2. Split-Brain and Collective Agency**
  Your model depends on redundant, parallel tracks. What does this predict for split-brain patients where those tracks are physically separated, or even collective decisions where tracks are distributed across people? Does responsibility get fragmented or diluted in those cases?
  *   *Follow-up:* If she says "Agency is always individual," point out that her architecture claim is physical. If the physics splits, does the agent?

  **3. The Escalating Intervener**
  Frankfurt cases usually assume the intervener watches the decision node. But what if the intervener can monitor and block the meta-tracks too? Does your defense just push the problem back a step, requiring an infinite regress of hidden tracks?
  *   *Follow-up:* If she claims the intervener *can't* know the meta-states, ask why not. Is she just stipulating a weaker intervener to save the theory?

  **4. Empirical Plausibility**
  You're making a claim about how agency is architecturally built—redundant and parallel. Is this an empirical claim about neuroscience? What happens if future brain imaging shows decision-making is more unitary than you assume?
  *   *Follow-up:* If she says "This is conceptual, not empirical," challenge why her defense of PAP depends on a contingent fact about brain wiring.

  **5. Moral Weight of Meta-Alternatives**
  Even if we grant the meta-level alternatives exist, why do they matter morally? If the outcome was inevitable and identical, does having a "shadow process" that could have diverged actually ground blame or praise?
  *   *Follow-up:* If she appeals to intuition, ask for a case where the meta-track changes our moral judgment. If it doesn't change the judgment, is it relevant?

  **6. The "Flicker" Objection**
  Critics of PAP defenses often call this a "flicker of freedom" strategy—finding a tiny alternative possibility that's too thin to support responsibility. How is your meta-level alternative robust enough to avoid being just a flicker?
  *   *Follow-up:* If she says "It's robust because it's structural," ask where the line is between a robust structure and a trivial difference.

  Think this covers the bases without letting her get too abstract. Let me know what you think before I send over the final brief.

  Best,
  J
