answer: |-
  ## The Sunk-Cost-Aware Continuation Protocol (SCACP)

  **Purpose:** To determine whether to renew funding for a multi-year research project at annual review.
  **Principle:** Past expenditure is irrelevant to the decision *except* as data that updates the probability of future success. Strategic signaling is a valid asset but must be distinguished from institutional ego.

  **Instructions:** The Program Officer (PO) and one independent reviewer must complete this form together. If any step triggers a **STOP**, funding is terminated unless the "Human Override" clause is invoked.

  ---

  ### Phase 1: The Evidence Update (Separating Money from Learning)
  *Goal: To ensure the money already spent has purchased information, not just activity.*

  **Q1.1: What specific hypothesis has been falsified or confirmed by the expenditure to date?**
  *   *Sufficient Answer:* A concrete statement of scientific/technical knowledge gained (e.g., "Pathway X is a dead end," or "Prototype Y works at 50% efficiency").
  *   *Insufficient Answer:* "We hired three postdocs," "We bought equipment," or "We are behind schedule."
  *   **[JUDGMENT CALL]:** If the answer is insufficient, does the PO believe the *team* is incapable of learning, or merely unlucky?
      *   *If incapable:* **STOP.**
      *   *If unlucky:* Proceed to Q1.2.

  **Q1.2: Based *only* on the evidence from Q1.1, what is the updated probability of the project achieving its primary endpoint within the remaining timeline?**
  *   *Requirement:* Must be a percentage (0-100%). Compare this to the probability estimated at the *start* of the grant.
  *   *Check:* If the probability has not increased despite significant spending, the "buy rate" of information is too low.
  *   *Threshold:* If Updated Probability < 20%, trigger **Soft Stop** (Proceed to Phase 3, but presumption is No).

  ---

  ### Phase 2: The Marginal ROI (The Forward-Looking Test)
  *Goal: To evaluate the next dollar, not the last million.*

  **Q2.1: What is the specific cost of the next funding tranche (C_next)?**
  *   *Note:* Do not include past spending in this calculation.

  **Q2.2: What is the estimated value (V_success) if the project succeeds?**
  *   *Metric:* Scientific impact, policy change, or commercial viability (normalized to a dollar equivalent or utility score).

  **Q2.3: Is (Updated Probability × V_success) > C_next?**
  *   *Calculation:* Expected Marginal Value > Cost of Next Tranche.
  *   *Verdict:* If **NO**, trigger **HARD STOP**.
      *   *Rationale:* Even a high-probability project is not worth funding if the cost of the next step exceeds the expected value of the win.

  ---

  ### Phase 3: The Signaling & Partnership Audit
  *Goal: To validate strategic reasons for continuation without masking regret.*

  **Q3.1: If we stop funding, which specific external relationships are damaged?**
  *   *Sufficient Answer:* Named partners, donors, or labs (e.g., "The Partner University Lab will lose their primary revenue stream").
  *   *Insufficient Answer:* "It will look bad," or "We will look inconsistent."

  **Q3.2: [JUDGMENT CALL] Is the value of maintaining this relationship greater than the C_next (from Q2.1)?**
  *   *Test:* Would you write a check for C_next *solely* as a relationship maintenance fee, with zero expectation of research success?
      *   *If Yes:* Proceed to Q3.3.
      *   *If No:* The signaling value is insufficient to justify the cost. **STOP.**

  **Q3.3: The "Competence Signal" Test.**
  *   *Question:* Does continuing a low-probability project signal *commitment*, or does it signal *inability to cut losses*?
  *   *Scenario:* If the project fails publicly in 2 years after more funding, will the partner blame us for stopping now, or for wasting their time then?
  *   *Verdict:* If the risk of being seen as incompetent (throwing good money after bad) outweighs the risk of being seen as fickle, **STOP**.

  ---

  ### Phase 4: The Human Override
  *Goal: To acknowledge where procedure ends and leadership begins.*

  **If the procedure recommends STOP, but the PO wishes to CONTINUE:**
  The PO must write a 1-page "Deviation Memo" answering:
  1.  What variable in Phases 1-3 do I believe is measured incorrectly?
  2.  What specific piece of non-quantifiable information (e.g., "I trust the PI's intuition") justifies the override?
  3.  **Attestation:** "I acknowledge this decision is based on judgment/values, not the algorithmic assessment of value."

  *This memo is filed publicly within the foundation to prevent future rationalization of the decision as "data-driven."*

  ***

  ## Test Runs

  Here is how the SCACP runs on your three scenarios.

  ### Project 1: "The Expensive Winner"
  *   **Status:** Strong intermediate evidence (Phase 1 passed with high probability update).
  *   **Cost:** The next tranche is $5M (5x the average grant).
  *   **Value:** Success is high value, but the foundation only has $20M total annual budget.
  *   **Procedure Run:**
      *   **Phase 1:** Evidence is strong. Probability updated from 30% to 80%. **Pass.**
      *   **Phase 2:** Expected Value ($10M impact × 80% = $8M) > Cost ($5M). **Pass (barely).**
      *   **Phase 3:** No specific partnership risk.
      *   **Conclusion:** **CONTINUE.**
  *   **Comment:** This is the easy case. The procedure validates the intuition.

  ### Project 2: "The Cheap Zombie"
  *   **Status:** Two years in, zero publishable data, no hypotheses falsified.
  *   **Cost:** Very cheap to keep alive ($100k/year).
  *   **Procedure Run:**
      *   **Phase 1:** Q1.1 asks what was learned. Answer: "Nothing definitive."
      *   **Judgment Call:** Is the team incapable or unlucky? PO argues "They are meticulous, just slow."
      *   **Phase 2:** Updated Probability remains at baseline (20%). Expected Value ($1M × 20% = $200k) > Cost ($100k). **Pass (technically).**
      *   **Phase 3:** No signaling value.
      *   **Conclusion:** **CONTINUE (with probation).**
  *   **Comment:** The procedure allows this because the *option value* of a cheap lottery ticket is positive. However, it flags the lack of learning in Phase 1. If they return next year with the same answer, Q1.1 forces a Stop.

  ### Project 3: "The Partnership Trap" (The Unpopular Conclusion)
  *   **Status:** Science has stalled. Key hypothesis likely falsified but PI is denying it.
  *   **Cost:** $1M/year.
  *   **Context:** Stopping funding will cause a partner lab to lay off staff and may cause them to decline future collaboration on *other* grants.
  *   **Procedure Run:**
      *   **Phase 1:** Q1.1: What was learned? Answer: "The approach doesn't work." Updated Probability of original endpoint: 5%.
      *   **Phase 2:** Expected Value ($5M × 5% = $250k) < Cost ($1M). **HARD STOP TRIGGERED.**
      *   **Phase 3 (The Appeal):** PO argues we must fund to save the partnership.
      *   **Q3.2:** Is the relationship worth $1M/year? PO says "Yes, they are a gateway to Europe."
      *   **Q3.3 (The Competence Signal):** If we fund this for 2 more years and it fails (95% chance), the Partner Lab will have wasted 2 years of their staff's time on a dead end we knew was dead. Will they trust us then?
      *   **Analysis:** Continuing signals that we do not understand the science, which undermines our value as a partner. Stopping signals fiscal discipline and scientific rigor.
      *   **Conclusion:** **STOP.**

  **Why you won't like this conclusion:**
  Project 3 forces you to burn a bridge. The procedure concludes that **buying loyalty with bad science is a net negative signal.** It argues that a partner who values you for your *wallet* rather than your *judgment* is a liability, not an asset. By funding a project with a 5% success rate to save a relationship, you are effectively paying a $1M "tax" on that relationship. The procedure demands you ask: *Is this partner worth a $1M annual tax?* If the answer is "No," you must stop, even if they are angry.

  If you choose to override this, you must file the **Deviation Memo** admitting: *"I am funding this not for its scientific merit, but as a bribe to maintain access. I accept that this lowers our average portfolio ROI and risks our reputation for scientific rigor."*

  Most Program Officers will not write that memo. That is how the procedure protects you from yourself.
