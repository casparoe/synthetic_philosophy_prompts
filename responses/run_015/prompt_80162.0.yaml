prompt: |-
  I'm a program officer at a research foundation that funds multi-year projects, and each year I decide whether to continue or stop funding every project in our portfolio, most of which have already spent a large share of their budget. The usual advice is to ignore the sunk costs, but that feels too crude: some projects have genuinely learned things from the money already spent, and some of our continue-versus-stop calls are partly about what we signal to donors and partner labs. Write me a decision procedure my team could actually run on a project at review time—the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a stop-funding verdict, and where it hands the decision to a person because the question is one of judgment or values rather than facts. It has to separate the money already spent, which should not enter the decision directly, from the evidence that spending produced, which should update our estimate of the project's prospects, and it has to give real weight to the strategic reason to continue, the value of signaling commitment, without letting that excuse a decision that is really just regret or embarrassment. Be explicit about which steps are judgment calls dressed up as procedure. Then run it on three projects—one that has produced strong intermediate evidence but is now expensive, one that has produced nothing but is cheap to keep alive, and one where stopping would publicly undermine a partnership we depend on—and for at least one, tell me what the procedure concludes even if I won't like it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Program Officer at a research foundation.
      *   **Task:** Create a decision procedure for annual project reviews (continue vs. stop funding).
      *   **Context:** Multi-year projects, large share of budget already spent (sunk cost dilemma).
      *   **Key Constraints/Requirements:**
          *   Must acknowledge sunk costs shouldn't drive decisions *directly*, but evidence gained from past spending *should* update prospects.
          *   Must account for strategic signaling (donors, partners) without letting it mask regret/embarrassment.
          *   Must be actionable (questions in order, sufficient answers, stop points).
          *   Must distinguish between factual steps and judgment/value calls.
          *   Must test the procedure on three specific scenarios (Strong evidence/expensive, Nothing produced/cheap, Partnership risk).
          *   Must be willing to output an unpopular conclusion for at least one scenario.

  2.  **Deconstruct the Problem:**
      *   *Sunk Cost Fallacy:* "We spent $1M, so we must spend another $500k." -> Wrong.
      *   *Sunk Cost Information:* "We spent $1M and learned X, which makes success 80% likely." -> Right.
      *   *Signaling:* "If we stop, donors think we're flaky." -> Valid strategic concern, but needs isolation from "We don't want to look bad."
      *   *Regret/Embarrassment:* "I don't want to admit I picked a loser." -> Needs to be filtered out.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Structure:* A funnel approach. Start with hard facts, move to strategic context, end with value judgments.
      *   *Step 1: The Scientific/Technical Viability (The "Evidence" Step).* Focus on what was learned, not what was spent.
      *   *Step 2: The Forward-Looking ROI (The "Marginal" Step).* Compare future cost to future expected value.
      *   *Step 3: The Strategic/Signaling Audit (The "Politics" Step).* Isolate signaling from ego.
      *   *Step 4: The Kill Switch (The "Stop" Verdict).* Clear criteria for termination.
      *   *Step 5: The Human Override (The "Judgment" Step).* Acknowledge where the algorithm ends and leadership begins.

      *Refining the Steps:*
      *   Need to explicitly label which parts are "Judgment Calls."
      *   Need to ensure the "Sunk Cost" distinction is clear.
      *   Need to make the "Signaling" check rigorous so it doesn't become an excuse.

  4.  **Developing the Three Test Cases:**
      *   *Case A (Strong Evidence/Expensive):* "Project Alpha." Good science, but next phase is huge. Procedure should likely say "Continue" *if* ROI holds, but maybe "Stop" if cost outweighs marginal gain. Let's make it tricky: Evidence is strong, but cost is *prohibitive* relative to foundation capacity.
      *   *Case B (Nothing Produced/Cheap):* "Project Beta." Zilch results, but cheap. Sunk cost says stop, but "option value" says maybe keep? Procedure needs to handle the "nothing learned" aspect. If nothing learned, probability of success shouldn't update upward.
      *   *Case C (Partnership Risk):* "Project Gamma." Failing science, but stopping hurts a key partner relationship. This tests the "Signaling" step. The procedure must distinguish between "strategic partnership value" and "embarrassment."

  5.  **Refining the "Unpopular Conclusion":**
      *   The prompt asks for at least one conclusion the PO won't like.
      *   *Candidate:* Project Gamma (Partnership). Usually, people want to save partnerships. If the science is dead, the procedure should say "Stop," even if it hurts the partnership. This forces the hard choice.
      *   *Alternative:* Project Beta (Cheap/Nothing). Sometimes it's tempting to keep cheap things alive just to fill the portfolio. The procedure should say "Stop" because expected value is near zero regardless of cost.
      *   *Decision:* Let's make Project Gamma the hard one. Stopping a partner project is politically painful. Or Project Alpha: Strong evidence but too expensive to finish. Let's go with **Project Alpha (Strong Evidence/Expensive)**. Why? Because it feels like a waste to stop a winner. But if the cost is too high for the *marginal* gain, the rational choice is to stop. This hits the "sunk cost" nerve hardest. Actually, let's look at the prompt again: "one where stopping would publicly undermine a partnership." If the procedure says "Stop" there, that's very unpopular. Let's do that. It tests the "Signaling vs. Embarrassment" filter best.

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Tone:* Professional, analytical, slightly bureaucratic but honest.
      *   *Formatting:* Use boxes or bold text for the "Stop" conditions.
      *   *Labeling:* Explicitly mark [JUDGMENT CALL] sections.

      *(Self-Correction during drafting)*: Make sure I don't just say "ignore sunk costs." I need to explain *how* to use the *information* from the spent money without counting the *money* itself.
      *   *Mechanism:* Bayesian Update. Past spending -> Data -> Updated Probability of Success.
      *   *Signaling:* Quantify the cost of broken trust vs. cost of funding.

  7.  **Final Review against Constraints:**
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop verdicts clear? Yes.
      *   Hand-off to human specified? Yes.
      *   Separation of money vs. evidence? Yes.
      *   Signaling weight vs. regret? Yes.
      *   Explicit judgment labels? Yes.
      *   Three test cases run? Yes.
      *   Unpopular conclusion included? Yes.

  8.  **Final Polish:** Check the voice. It should sound like a senior colleague advising a team, not a generic AI. Use terms like "Marginal Expected Value" and "Reputational Liability."

  *(Self-Correction on Test Case 3)*: If I say "Stop" on the partnership project, I need to make sure the procedure justifies it *without* ignoring the signaling value. The procedure must weigh the signaling value against the scientific dead-end. If the science is truly dead, signaling commitment to a dead horse is *negative* signaling (incompetence). That's the key argument.

  Let's build the response.

  *Structure:*
  1.  Introduction (acknowledging the tension).
  2.  The Protocol (The "Sunk-Cost-Aware Continuation Protocol").
  3.  The Three Case Studies.
  4.  Closing advice.

  *Key nuance:* The "Signaling" step needs a specific test: "Would continuing this project *if it fails later* damage the partnership more than stopping now?" This prevents throwing good money after bad to save face.

