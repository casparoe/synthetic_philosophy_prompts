answer: |-
  Here is the direct assessment, agenda, and reasoning.

  ### 1. Framing Challenge & Epistemic Status

  **Confidence:** High.

  I need to push back on two parts of your setup before proposing an agenda. If you ignore these, the year will be wasted.

  **A. The Distillation Mismatch**
  You describe the full Iterated Amplification loop (Amplify $\rightarrow$ Distill $\rightarrow$ Repeat), but your constraints ("essentially no compute," "toy experiments," "no pretraining") make the **Distillation** step impossible. Distillation requires generating a dataset of amplified traces and fine-tuning a model to match them. Even with small models, doing this rigorously across iterations requires training compute you don't have.
  *   **Implication:** You cannot study the *loop*. You can only study the *chain dynamics* of a fixed model $M$. You must treat "distillation" as a theoretical downstream step. Your research question shifts from "Does IA preserve alignment?" to "Does recursive self-encoding degrade state fidelity in fixed models?" This is a narrower, but still valuable, question.

  **B. The Competence/Alignment Entanglement**
  You want to separate "competence loss" (channel capacity) from "alignment drift" (optimizing for ease). In practice, these are causally linked.
  *   **Mechanism:** When the bottleneck forces information loss (competence cap), the model *must* hallucinate or generalize to fill the gap in the next round. This hallucination is driven by the model's prior (alignment drift).
  *   **Implication:** You cannot measure drift without first quantifying capacity loss. If you see the note change, you won't know if it's because the note *couldn't* hold the info (competence) or because the model *chose* a simpler representation (alignment).
  *   **Correction:** Your primary metric shouldn't be "alignment." It should be **"State Fidelity."** Alignment drift is a specific *mode* of fidelity failure.

  **C. Terminology Shift**
  This isn't "decomposition." Decomposition implies splitting a problem into parallel sub-problems (the tree). Your setup is **Recursive State Compression**. Using the word "decomposition" will lead you to read the wrong literature (e.g., task decomposition papers) instead of the right literature (e.g., lossy compression in RNNs, information bottleneck theory, or "Lost in the Middle" phenomena).

  ---

  ### 2. Weighting & Trade-offs

  Here is how I am weighting the agenda items, given your constraints (1 year, 1 RE, 2 juniors, low compute, philosophy-heavy team):

  1.  **Tractability (40%):** The hard constraint. If a question requires large-scale training or human evals, it is out. The team must be able to run experiments on consumer hardware or cheap APIs.
  2.  **Upstream Dependency (30%):** Questions that define *what* we measure come before questions about *what we found*.
  3.  **Importance (20%):** Relevance to the core worry (does the system go off the rails?).
  4.  **Neglectedness (10%):** This specific chain-bottleneck setup is under-studied compared to tree-IDA, but that matters less if the basics are unsolved.

  **Trade-off:** I am sacrificing "Real World Relevance" (using hard tasks) for "Measurement Clarity" (using solvable tasks with known states). You cannot measure drift on hard questions because you don't know the ground truth. You must measure drift on easy questions stretched to be long.

  ---

  ### 3. The Agenda (Ordered)

  #### Phase 1: Metrics & Ground Truth (Months 1-3)
  **Question:** *On tasks where the "correct state" is formally verifiable, can we define a metric for Note Fidelity that distinguishes compression error from semantic drift?*

  *   **Why Upstream:** You cannot answer any drift questions without a ruler. If your metric conflates "summarized" with "distorted," the whole project fails.
  *   **Tractability:** High. Uses toy tasks (e.g., multi-step logic puzzles, code execution traces, grid-world navigation) where the "perfect note" can be algorithmically generated or verified.
  *   **Concrete Result:** A benchmark suite of "Chain Compression Tasks" with a proposed Fidelity Score (e.g., reconstruction accuracy of the state from the note).
  *   **Confidence:** High. This is engineering-heavy, fitting the RE + juniors profile.
  *   **Reorder Trigger:** If you find that *no* natural language metric correlates with state recovery, pivot to structured notes (JSON/code) immediately.

  #### Phase 2: The Capacity Ceiling (Months 4-6)
  **Question:** *Is performance limited by the token bottleneck or by the model's summarization capability?*

  *   **Why Upstream:** If the model is the bottleneck (it can't summarize well even with space), increasing the note size won't help. If the token cap is the bottleneck, alignment drift is secondary to pure information loss.
  *   **Tractability:** Medium. Requires sweeping note sizes (50, 200, 1000 tokens) and model sizes (using small open weights like Pythia/OLMo). Fits "no compute" if using quantized inference.
  *   **Concrete Result:** A scaling curve: Fidelity vs. Note Width, parameterized by Model Size.
  *   **Confidence:** Medium. Empirical noise might obscure the boundary.
  *   **Reorder Trigger:** If fidelity plateaus immediately regardless of note width, the problem is model capability, not bottleneck design. Stop studying the bottleneck; study summarization finetuning.

  #### Phase 3: Drift Dynamics (Months 7-9)
  **Question:** *Does the note content converge toward the model's prior distribution over long chains, and is this drift directional?*

  *   **Why Here:** Now that you can measure fidelity (Phase 1) and know the capacity limits (Phase 2), you can isolate the residual error. Is the error random noise, or is it systematic bias toward "likely" text?
  *   **Tractability:** Medium-Hard. Requires running very long chains (50+ steps) on static problems. Computationally cheap per run, but requires careful logging.
  *   **Concrete Result:** A "Drift Vector." E.g., "Notes tend to become more confident and less nuanced over 20 steps," or "Notes tend to revert to common training tropes."
  *   **Confidence:** Medium. "Model Prior" is hard to define operationally. You'll need a baseline (e.g., what does the model write if asked to guess the state without seeing history?).
  *   **Reorder Trigger:** If drift is indistinguishable from random noise, the "alignment" worry is overblown; it's just entropy.

  #### Phase 4: Interventions & Stability (Months 10-12)
  **Question:** *Can simple structural constraints (schemas, checksums, explicit uncertainty tokens) stabilize the chain without reducing capacity?*

  *   **Why Here:** Only attempt fixes once you know the failure mode.
  *   **Tractability:** High. Prompt engineering and output parsing.
  *   **Concrete Result:** A "Stabilized Protocol" that maintains fidelity 2x longer than raw natural language.
  *   **Confidence:** High. Structured output almost always helps consistency.
  *   **Reorder Trigger:** If Phase 3 shows drift is negligible, this phase becomes about optimizing for speed/cost instead.

  #### Phase 5: The Distillation Theory (Parallel/Conceptual)
  **Question:** *Given empirical decay rates from Phases 1-3, does a theoretical distillation step recover the loss, or does it cement the drift?*

  *   **Why Last:** This is purely theoretical for you. You cannot test it.
  *   **Tractability:** High (for philosophy types). Math/argumentation.
  *   **Concrete Result:** A paper arguing whether distillation acts as a "reset" (recovering truth from the aggregate of traces) or a "ratchet" (locking in the drift).
  *   **Confidence:** Low. Hard to be confident without empirical distillation data.

  ---

  ### 4. What To Explicitly NOT Work On

  1.  **Do Not Attempt Distillation:** You do not have the compute. Do not spend time trying to fine-tune models on your chain outputs. It will be low quality and unconvincing.
  2.  **Do Not Use "Hard" Questions:** Do not test on questions where you don't know the answer (e.g., "Solve this open math problem"). You cannot measure drift without ground truth. Use "Hard *Processes*" (long chains) on "Easy *Questions*" (verifiable states).
  3.  **Do Not Study Tree Decomposition:** Your setup is a chain. Reading IDA (Iterated Distillation and Amplification) literature on branching factors will confuse your mental model. Read literature on **RNN state decay**, **Context Window limits**, and **Lossy Text Compression**.
  4.  **Do Not Rely on Human Eval:** With 2 part-time juniors, you cannot scale human evaluation. All metrics must be automated (scriptable verification).

  ---

  ### 5. Confidence & Reordering Triggers

  *   **Overall Confidence in Agenda:** 75%. The main risk is that "State Fidelity" in natural language is too ill-defined to measure cleanly, even on toy tasks.
  *   **Major Reorder Trigger:** If Phase 1 (Metrics) fails to produce a reliable automated fidelity score by Month 3, **stop**. Pivot to using structured state representations (e.g., the model must output a JSON state dict) instead of natural language notes. If natural language is too noisy to measure, it's likely too noisy to be safe, and the agenda should shift to "Structured Bottlenecks."
  *   **Minor Reorder Trigger:** If Phase 2 shows that small models (1B-3B) behave qualitatively differently than medium models (7B-13B) regarding drift, you must pause to analyze *why* before proceeding to Phase 3. This would suggest the phenomenon is model-scale dependent, limiting your ability to generalize from toy setups.

  ### Summary of Reasoning
  I prioritized **measurement** over **mechanism** because your team is small and compute-constrained. You cannot afford to run experiments where you aren't sure what the result means. By locking down a verifiable metric on toy tasks first, you ensure that every subsequent experiment yields a clear number, even if the model is small. This leverages your "philosophy-of-ML" strength (defining the concepts) while respecting your "no compute" constraint (automated evals on small models).

  The framing challenge is critical: if you proceed thinking you are studying "alignment drift" without first isolating "compression error," you will publish a paper that reviewers tear apart for conflating capacity with honesty. Fix the definitions first.
