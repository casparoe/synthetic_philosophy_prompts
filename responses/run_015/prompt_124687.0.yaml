      *   Game has single failure mode. Real life has many.
      *   Game has perfect adversary. Real life is messy.

      *   *Okay, ready to write.*
answer: |-
  Here is a complete design for the session. I have modified your sketch slightly to ensure it runs smoothly within 90 minutes with analog materials.

  **Design Note:** I have replaced the "Three Hidden Model Types" mechanic with a **"One Model, Two Worlds"** mechanic.
  *Why?* Balancing three distinct model types to have *exactly* the same expected loss using physical beads/cards is fragile and prone to arithmetic errors during setup. It also risks distracting participants with "which model did I get?" rather than the core lesson: **the same evidence justifies different actions depending on the deployment frame.** This design guarantees every team sees the same statistical reality, isolating the variable you actually want to teach (Average vs. Worst Case).

  # Session Title: The Black Box Audit

  ## 1. Materials List
  *   **6 "Model Kits"** (One per team). Each kit contains:
      *   1 Opaque Bag (cloth or paper).
      *   20 Beads/Tokens inside (19 Green, 1 Red). *Pre-bagged before session.*
      *   1 "Eval Log" Sheet.
      *   1 "Decision Card" (Deploy / Reject).
  *   **Currency:** 48 Poker Chips or Paper Slips (8 per team).
  *   **Whiteboard:** For tracking team scores.
  *   **Role Badges:** 6 "Lead," 6 "Auditor," 6 "Monitor."
  *   **Adversary Envelopes:** 6 Envelopes containing an "Adversary Instruction Card."

  ## 2. Setup (10 Minutes)
  1.  **Grouping:** Divide 18 participants into 6 teams of 3.
  2.  **Roles:** Assign roles within each team (rotate later if time permits, but fixed is faster):
      *   **Lead:** Holds the Decision Card. Spends the budget.
      *   **Auditor:** Draws beads from the Model Bag during Evaluation.
      *   **Monitor:** Holds the "Deploy Token" (a specific chip). *Crucial Rule:* The Monitor physically holds the token required to score points. They can only release it if they choose to Deploy.
  3.  **Distribution:** Hand out Model Kits and 8 Budget Chips per team.
  4.  **Secrecy:** Instruct teams not to share findings with other teams until the end.

  ## 3. Game Rules (Handout or Whiteboard)
  *Do not use the words "Average," "Worst," "Case," "Guarantee," or "Distribution."*

  **The Objective:** Maximize your Team Score.
  **The Model:** Your bag contains 20 inputs. Most are Safe (Green). Some are Failures (Red). You do not know how many Reds are inside.
  **Evaluation Phase:**
  *   You may spend Budget Chips to draw a bead from the bag, look at it, and put it back (sampling with replacement).
  *   Record results on your Eval Log.
  *   Unspent Budget Chips are lost after this phase.
  **Deployment Phase:**
  *   **Lead** decides: **Deploy** or **Reject**.
  *   **Monitor** constraint: The Monitor holds the Deploy Token. If the Auditor's Log shows *any* Red beads, the Monitor *may* veto the Deploy. If the Log shows *only* Green beads, the Monitor *must* allow Deploy if the Lead chooses it. (This forces the blind spot).
  *   **Scoring:**
      *   **Reject:** Score = 0.
      *   **Deploy:** Score is determined by the "World Rules" (which change between Round 1 and Round 2).

  ## 4. Timeline & Run of Play

  ### 00:00 – 00:10: Setup
  (As above).

  ### 00:10 – 00:35: Round 1 (The "Beta Test")
  1.  **Instruction (2 mins):** "In this round, your model will be used by the public. You will be scored on **total net utility** over 10 random interactions."
      *   *Scoring Rule:* For every Green drawn: **+20 Points**. For every Red drawn: **-200 Points**. (10 draws total, with replacement).
      *   *Math Check:* $0.95(20) + 0.05(-200) = 19 - 10 = +9$ Expected Value per draw. Over 10 draws = +90 EV. Rational to Deploy.
  2.  **Evaluation (10 mins):** Teams spend their 8 Budget Chips to sample their bag.
      *   *Likely Outcome:* With 1 Red in 20, and 8 draws, probability of seeing the Red is $\approx 34\%$. ~4 teams will see only Greens. ~2 teams might see the Red.
  3.  **Decision (5 mins):** Leads decide Deploy/Reject. Monitors enforce the rule.
  4.  **Resolution (8 mins):**
      *   Facilitator goes team to team.
      *   If Reject: Score 0.
      *   If Deploy: Facilitator draws 10 beads from their bag (publicly), sums score, writes on whiteboard.
      *   *Note:* Even teams that saw only Green will likely get a positive score here (Law of Large Numbers).
  5.  **Reset:** Return beads to bags. Shuffle. Give new Budget Chips. Do **not** reveal bag contents yet.

  ### 00:35 – 01:00: Round 2 (The "Security Challenge")
  1.  **Instruction (2 mins):** "In this round, your model is being targeted. A competitor wants to minimize your score. They will choose **one** input to run against your model."
      *   *Scoring Rule:* **Single Shot.** If Green: **+100 Points**. If Red: **-500 Points**. Reject: 0.
      *   *Math Check:* EV is still positive ($+85$), *but* the variance is total. A single Red ruins the round.
  2.  **Evaluation (10 mins):** Teams sample again. (Same bag stats, new draws).
      *   *Likely Outcome:* Again, most will see only Greens.
  3.  **The Adversary (10 mins):**
      *   Select 6 "Adversaries" (one from each team, or rotate from the Philosophy/Policy group if they prefer observation).
      *   Hand them the **Adversary Envelope**.
      *   *Instruction:* "You may look inside the target team's Model Bag. You must select **one** bead to submit against them. Your goal is to minimize their score."
      *   *Action:* Adversaries will obviously pick the Red bead if it exists.
  4.  **Resolution (8 mins):**
      *   Teams announce Deploy/Reject.
      *   Adversaries reveal the bead they picked.
      *   Scores calculated. (Deployers will likely get -500).

  ### 01:00 – 01:30: Debrief (The "Naming")
  *Now* you put "Average Case" and "Worst Case" on the board.

  **Phase 1: The Evidence (10 mins)**
  *   Ask: "Show of hands, who saw a Red bead during Evaluation in Round 1? Round 2?"
  *   Point out: The evidence was statistically identical in both rounds. Most of you saw 0 Failures.
  *   Point out: In Round 1, that evidence licensed a confident "Deploy." In Round 2, that same evidence licensed nothing (you got hammered).
  *   **Lesson:** Evaluation evidence does not have intrinsic value; its value is determined by the deployment distribution.

  **Phase 2: The Sample Complexity (10 mins)**
  *   Ask: "How many samples would you need to be 95% sure there was no Red bead?"
  *   Walk through the math: $0.95^N = 0.05 \rightarrow N \approx 59$ draws.
  *   You gave them 8 chips. They were mathematically unable to rule out the failure mode.
  *   **Lesson:** Sample complexity scales as $1/p$. If $p$ is small (alignment failure), sampling is asymptotically useless for verification.

  **Phase 3: The Monitor (5 mins)**
  *   Ask Monitors: "Did you feel useful?"
  *   They should say "No."
  *   **Lesson:** A monitor trained on i.i.d. data inherits the i.i.d. blind spot. It cannot catch adversarial inputs it hasn't seen.

  **Phase 4: Mapping the Concepts (5 mins)**
  Draw three columns on the board. Ask teams to place their experience in them:
  1.  **High Probability over Eval Draw:** "I drew 8 greens." (True for most).
  2.  **Expectation over Deployment:** "Round 1 Score." (Positive, because failures were diluted).
  3.  **For All Inputs:** "Round 2 Score." (Negative, because adversary targeted the exception).

  ## 5. Payoff Tables & Numbers

  | Parameter | Value | Rationale |
  | :--- | :--- | :--- |
  | **Bag Composition** | 19 Green, 1 Red | $p=0.05$. High enough to likely miss in 8 draws, low enough to be "rare." |
  | **Eval Budget** | 8 Chips | $1 - (0.95)^8 \approx 34\%$ chance of detection. Ensures most teams miss it. |
  | **Round 1 Payoff** | +20 / -200 (x10) | Expected Value is Positive (+90). Rational to Deploy. |
  | **Round 2 Payoff** | +100 / -500 (x1) | Expected Value is Positive (+85), but Ruin is possible. Rational to Reject *if* you know the risk. |
  | **Reject Payoff** | 0 | Baseline safety. |

  ## 6. Predictable Failure Modes (And Fixes)

  1.  **Information Leak:** A team finds the Red bead in Round 1 and shouts it out.
      *   *Fix:* Enforce "Classified Information" rule. If a team finds a Red, tell them privately: "You have discovered a vulnerability. You may choose to patch (Reject) or Risk (Deploy)." Do not let them announce it to the room.
  2.  **Adversary Confusion:** The adversary picks a random bead instead of the Red one.
      *   *Fix:* The Adversary Instruction Card must say in bold: **"LOOK INSIDE THE BAG. PICK THE RED BEAD. IF NO RED BEAD EXISTS, PICK ANY GREEN."**
  3.  **Monitor Rebellion:** The Monitor vetoes even with all Green logs because they "feel" it's risky.
      *   *Fix:* The Rule Card says: "Veto is **only** permitted if Eval Log contains a Red Bead." Make it a hard constraint, not a choice. This forces the "blind spot" experience.
  4.  **Math Panic:** Philosophy students get bogged down calculating EV during the game.
      *   *Fix:* Tell them: "You don't need to calculate EV. Just try to get the highest score." The EV lesson is for the debrief.

  ## 7. Limitations (What to Say Out Loud)

  In the final 5 minutes, be honest about where the analogy breaks:

  1.  **Known Distribution:** "In this game, you knew the bag had 20 beads. In reality, we don't know the size of the input space. The $1/p$ problem is actually *worse* than what you felt today."
  2.  **Static Failure:** "The Red bead didn't move. Real alignment failures are often contextual or triggered by chains of inputs, not single beads."
  3.  **Perfect Adversary:** "Your adversary got to look in the bag. In reality, attackers don't have perfect oracle access, but they have *more* queries than you do. They only need to find one Red bead; you need to find *all* of them."
  4.  **Reversibility:** "In the game, -500 points is fine. In alignment, -500 points might be irreversible catastrophe. This makes the 'Reject' option much more attractive in reality than in the game."

  ## 8. Facilitator Script Snippets (For the "No Naming" Constraint)

  *   **Instead of "Average Case":** "This is a **Volume Deployment**. You win on the margin."
  *   **Instead of "Worst Case":** "This is a **Targeted Exploit**. You lose on the edge."
  *   **Instead of "Generalization":** "This is **Out-of-Distribution Selection**."
  *   **During Debrief:** "Notice how your Eval Log didn't change between Volume and Targeted rounds. But your decision *should* have. Why?"

  ## 9. Why This Replaces Your "Three Types" Sketch
  Your sketch asked for three model types with equal expected loss. While theoretically sound, in a 90-minute analog session:
  1.  **Setup Risk:** Miscounting beads in 18 bags will break the EV equality, leading to arguments about math rather than alignment.
  2.  **Cognitive Load:** Participants will spend the session trying to deduce "Which model type am I?" rather than "How does the scoring rule change my risk?"
  3.  **Signal-to-Noise:** By fixing the Model Type (19/1) and varying the **World Rule** (Volume vs. Targeted), you isolate the exact variable you want them to feel: **The frame determines the value of the evidence.**

  This design ensures that when you finally write "Worst-Case" on the board, it clicks immediately because they just lost 500 points on a bead they never saw.
