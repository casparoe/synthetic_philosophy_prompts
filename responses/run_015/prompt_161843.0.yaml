  **The Toast**

  Good evening, everyone. For those who don't know me, I am the groom's brother. It is a profound privilege to stand here and look out at this room. To see so many faces gathered from every chapter of their lives is a testament to the community they are building together.

  I want to begin by offering my deepest thanks to the bride's parents. Thank you for your extraordinary generosity and hospitality. You have created a space of such beauty and warmth that it allows all of us to focus entirely on the joy of the occasion. It is a gift to be welcomed so completely into your family.

  When I started thinking about what to say tonight, I found myself thinking about the nature of beginnings. We often look at a day like this and see the flowers, the music, and the gathering itself as the foundation of the marriage. And while this celebration is a magnificent start, I have been watching my brother and his partner for a long time, and I have come to believe that the foundation was actually laid in much quieter moments.

  I know how much my brother loved his motorcycle. I know he spent four years rebuilding the engine with his own hands. It was a project of patience and pride. And I know that recently, he made the choice to let it go. He didn't do it because he stopped loving the machine, but because he loved the future he is building more. He made space in his life for a passenger, and for a different kind of journey.

  And I know about the fellowship. I know how long she worked toward that opportunity to study abroad. It was a door opening to a different city, a different life. But she chose to stay. Not because she was afraid to leave, but because she decided that being here, in this city, with him, was the more compelling path.

  These are not losses. They are definitions. They are the quiet, unglamorous decisions that tell us where a person's priorities truly lie. Anyone can plan a party; it takes a different kind of resolve to rearrange a life.

  That is where we come in. There is a temptation to say that a couple needs no one else, that their love is a self-contained world. But I don't think that is true, and I don't think they would want it to be. A wedding is not just a declaration between two people; it is an instruction to the rest of us. You have gathered us here to tell us that you intend to keep these promises, and you are asking us to remember that you said them.

  We are the witnesses. In the years to come, when the quiet choices become difficult, we are the ones who will remind you of the resolve you showed today. We are here to hold the memory of this commitment so that you can focus on living it.

  **The value of a promise is not determined by the occasion on which it is made, but by the quiet choices that keep it standing long after the music stops.**

  So, if everyone could please rise. To the bride and groom: may your journey be long, may your burdens be shared, and may you always find your way back to the choices that brought you here. To the happy couple.

  ***

  **Analysis of Ruled-Out Sentences and Theoretical Constraints**

  You asked for an explanation of which sentences the theory rules out and why, based on the Handicap Principle constraints you provided.

  **1. "This beautiful wedding proves how much they love each other."**
  *   **Why it is ruled out:** Under the Handicap Principle, a signal is only informative if the cost is borne by the *signaler*. Since the bride's parents bore the financial cost of the venue and catering, the expenditure signals *their* commitment and status, not the couple's. Attributing the financial scale to the couple's affection would be theoretically inaccurate (it's "cheap talk" for them) and risks insulting the parents by appropriating their gesture, or insulting the economists by misattributing the signal.

  **2. "Unlike my own wedding, which was small, this shows they are doing it properly."**
  *   **Why it is ruled out:** This violates the constraint regarding your mother. It validates her critique ("when people really mean it they do it properly") and implicitly apologizes for your own marriage. Conversely, saying "My wedding was just as real despite the cost" would sneer at the current expenditure. The toast must remain neutral on the *scale* of the wedding to avoid validating the "cost = commitment" fallacy while respecting the hosts.

  **3. "You two don't need anyone else; your love is enough."**
  *   **Why it is ruled out:** You identified the sociological function of the wedding as enrolling guests as enforcers/witnesses. Stating they need no one cancels the mechanism of the event. If they need no one, the guests' presence is superfluous. The toast reframes the guests as essential memory-keepers ("We are here to hold the memory"), which aligns with the function of enrolling the room without undermining the couple's autonomy.

  **4. "I hope the investment pays off," or any joke about the bill/debt.**
  *   **Why it is ruled out:** A joke about the cost points directly at the financial burden. If the signal's cost damages the condition it advertises (i.e., if the wedding causes financial stress that strains the marriage), the signal is self-undermining. Mentioning debt or "what they owe" the parents highlights the transaction, which reduces the reliability of the emotional signal.

  **5. "Selling the bike proves his love."**
  *   **Why it is ruled out:** You noted that signals concern "interests and resolve rather than affections." Love is an internal state; selling a motorcycle is an external action regarding priorities. Claiming it *proves* love is a leap the economists would wince at. The toast phrases it as "definitions" and "priorities," which is accurate to the theory (revealed preference) while remaining affectionate enough for the grandmother.

  **The "Grandma/Economist" Sentence:**
  *"The value of a promise is not determined by the occasion on which it is made, but by the quiet choices that keep it standing long after the music stops."*
  *   **For Grandma:** It sounds sentimental, focusing on "promise," "music," and endurance.
  *   **For Economists:** It correctly identifies that the *occasion* (the expensive signal paid by parents) is not the determinant of value, but rather the *ongoing differential costs* (quiet choices/renunciations) borne by the couple maintain the equilibrium of the marriage. It avoids claiming the initial signal guarantees the outcome.
