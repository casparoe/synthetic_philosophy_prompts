          *   *Accessibility:* High. Anyone can type a prompt.
          *   *Morality:* Neutral to negative. Doesn't promote brotherhood; promotes consumerism or vanity.
          *   *Verdict:* Not art. It's a tool or a trick. Counterfeit.

      *   **(2) TikTok Dance Trends:**
