answer: |-
  Your instinct to center the session on sign fragility is correct for this specific audience, but it requires a precise qualification to avoid the trap you identified. Software engineers and operations researchers respect ill-conditioned problems where small changes in boundary conditions yield divergent outputs, so framing cluelessness as sign fragility translates a metaphysical worry into a numerical stability issue they intuitively grasp. However, to prevent them from dismissing it as a mere modeling defect fixable by better specification, you must explicitly state that the fragility arises from the causal density of the world rather than the sloppiness of the accountant. You need to emphasize that the bookkeeping choices they are forced to make, such as where to truncate the causal chain or how to individuate effects, are not arbitrary errors but necessary constraints of any finite model attempting to capture an infinite causal web. If you frame it as a defect in the model, they will propose a better model; if you frame it as a defect in the tractability of the world given our epistemic position, they will recognize it as a structural limit. Therefore, you should center the session on sign fragility but define it as an ineliminable property of consequentialist accounting over long time horizons, not a bug in their current spreadsheet.

  The single case study you should use is funding a direct cash transfer to a specific individual in a low-income region, as this avoids existential stakes while providing a large, well-measured near-term effect. You need a case where the immediate utility is uncontroversial and quantifiable, such as the consumption smoothing and health benefits derived from a one thousand dollar transfer, which your audience can easily assign a positive expected value to using standard development economics metrics. What this case must lack is any connection to existential risk or trajectory changes, so you must explicitly exclude downstream effects like political stability shifts that could lead to war or technological acceleration, ensuring the discussion does not get hijacked by longtermist fanaticism or Pascal mugging worries. The tail must be mundane but chaotic, such as the recipient spending the money on goods that alter local market prices, which then ripple out to affect strangers who then make choices that eventually loop back to affect others, creating a causal chain that is theoretically traceable but practically uncountable. This ensures the uncertainty is about the sign of the net effect due to complexity, not about the magnitude of a low-probability catastrophe.

  You should introduce the components in a sequence that forces them to feel the problem before offering relief. Start by establishing the expected value framework they already know, then present the cash transfer case and calculate the near-term benefit together to lock in a positive baseline. Next, introduce the long-term causal tail and ask them to estimate its value, which will naturally lead to the demonstration of sign fragility where changing the causal cutoff or the counterfactual baseline flips the sign of the total estimate. Only after you have demonstrated that the sign flips based on defensible but arbitrary accounting choices should you address the misconceptions, because if you address them too early, the audience will use the misconceptions as shields against the discomfort of the problem. The first misconception they will raise is that this is just ordinary imprecision that more data would fix, which you must defuse immediately during the sign fragility demonstration by showing that no amount of data resolves the arbitrariness of where to stop counting effects. The second misconception is that the expected value is still perfectly well-defined even if uncomputable, which you should address after the demonstration but before discussing responses, by distinguishing between mathematical existence and action-guiding knowability. The third misconception is that positive and negative effects cancel out due to symmetry, which you should defuse alongside the sign fragility demo by showing that causal chains are not random walks but have structural biases that prevent reliable cancellation.

  The responses to cluelessness, such as adopting heuristic rules, ignoring long-term effects, or embracing scepticism, belong strictly after you have defused these misconceptions. Offering an escape hatch too early will allow them to categorize the problem as solved and stop engaging with the depth of the uncertainty. You want them to sit with the realization that their standard expected value calculus is unstable before you offer alternatives, otherwise they will treat the alternatives as minor patches rather than necessary paradigm shifts. Spend the first ninety minutes building the problem and defusing the misconceptions, and reserve the final thirty minutes for discussing how practitioners actually cope with this reality. This ensures that when you discuss responses, they understand them as damage control measures for a broken tool rather than standard operating procedure.

  At the end of the session, the one question you should put to them to show the idea has landed is whether having infinite compute and perfect data would resolve the sign fragility if the system boundary remains arbitrary. If they answer yes, they have retreated to the misconception that this is an epistemic limit rather than a structural one; if they answer no, they understand that the arbitrariness of the causal cutoff is what drives the fragility, not the lack of information. This question tests whether they grasp that cluelessness is about the definition of the problem space, not the difficulty of solving it.

  Finally, you should explicitly decline to settle which response to cluelessness is the correct one, such as whether to become moral sceptics or to adopt a specific heuristic like maxipok or common sense morality. Your goal is to teach the problem, not to solve it, and settling on a solution would imply that the community has reached a consensus that does not exist. You should also decline to settle whether this undermines consequentialism entirely or merely limits its scope, as that is a metaphysical question that depends on their prior commitments. By leaving these questions open, you signal that the seminar was about understanding the landscape of the problem, not about converting them to a specific doctrinal solution, which respects their autonomy as rational agents while ensuring the core concept of sign fragility remains the lasting takeaway.
