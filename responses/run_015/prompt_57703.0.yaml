      *   *Key Insight:* The "Two Satisficings" framing is the strongest hook. Don't lose that. The empirical section is the danger zone. The normative conclusion is the payoff.

      *(Self-Correction during drafting)*: I need to be careful not to give references as requested. I must speak to the concepts. regarding Section 3: The author worries the "no learning" condition is fiction. I should validate that worry. It *is* a fiction. But does the essay collapse? No, because the *conceptual* distinction stands even if the empirical test is noisy. I should advise them to downgrade Section 3 from "Here is the experiment" to "Here is why they diverge in principle, even if testing is hard."

