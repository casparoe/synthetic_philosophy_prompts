      *Refining the Unfalsifiability point:* This is the "Motte and Bailey" of bounded rationality. Hard boundedness (Simon) vs. Soft boundedness (Stigler/Becker). The author is calling out the slide between them. This is a strong contribution.

  5.  **Final Polish:** Check against constraints. No references. Direct answers. Whiteboard tone. (Proceed to generate output).

      *Wait, one more check on Section 3:* The author says "Under optimal stopping... stopping rule depends on what's left, not on the quality of what you've already seen." This is true for the *reservation price* in a known distribution. But the *decision* to stop depends on the current draw. The aspiration theorist says the *reservation price* changes based on history. The author's design tries to isolate this. The confound is that if I see high draws, I might think the distribution is better than stated.
      *Correction:* I need to tell the author that the "known distribution" assumption is the weak link. If you tell a human "This is a known distribution," and they see outliers, they doubt you. The test fails. Does the essay collapse? No, if they pivot to "Conceptual divergence" rather than "Empirical proof."

