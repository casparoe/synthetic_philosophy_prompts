      Philosophers distinguish between the *sensory-discriminative* dimension of pain and the *affective-motivational* dimension. That is jargon, so let's translate. The sensory side is the "what and where": the intensity, the location, the stabbing versus burning quality. The affective side is the "so what": the suffering, the unpleasantness, the urge to make it stop. Usually, these rise and fall together. Miriam's condition forces us to imagine them separately.

      Consider a thought experiment. Suppose we had a drug with two independent dials. One sets the sensory intensity; the other sets the unpleasantness. The inference many draw from Miriam's case is that everything bad about pain sits on the second dial. If you turn the unpleasantness to zero while leaving the intensity at eight, have you removed what is harmful? That seems compelling. But it is also hard to accept. Is an eight-out-of-ten sensation truly harmless if it doesn't hurt? I will not resolve that tension today. Our closing speaker will likely resist that inference, and I want us to sit with the resistance, not smooth it over.

      However, we must also consider the mirror case. Imagine a patient for whom the intensity is low but the suffering is crushing. Let's call this *affective amplification*. This patient reports a three out of ten. On the number, they are doing fine. In reality, the pain dominates their life, stripping away sleep, work, and hope. If the badness of pain tracks the unpleasantness rather than the intensity, then our single-number scale systematically under-rates people like this. This is exactly what our patient representatives have been saying for years: a single metric hides the suffering that matters most.

      So, why does this matter for a half-day workshop? For the patients here, it is about being seen. If we measure only intensity, we miss the suffering that defines your illness. For the clinicians, including those worried about bureaucratic metrics, this is not about adding boxes for insurers to check. It is about clinical clarity. If we do not know whether we are treating the sensation or the suffering, we cannot know if our treatment has worked. We might lower the intensity while leaving the misery intact, or vice versa.

      We owe our patients relief. But we need to know: relief from how much it hurts, or relief from how much it matters? Today is not about finding a easy answer. It is about ensuring that when we measure pain, we are measuring something real enough to guide care, and human enough to honor experience. Let's begin.

