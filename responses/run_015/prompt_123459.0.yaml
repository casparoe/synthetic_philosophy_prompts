answer: |-
  In a municipal budget office, a director faces a surplus allocation choice between two programs: the first provides specialized palliative sedation to three terminal patients experiencing unmanageable, agonizing nerve pain that renders them incapable of any conscious positive experience, while the second funds a city-wide reduction in wait times for routine recreational facility bookings, granting five hundred thousand citizens a minor convenience saving them ten minutes of mild frustration each week for a year. The budget is insufficient for both, requiring a binary choice where the palliative care completely eliminates the agony for the three but offers no benefit to the masses, whereas the wait-time reduction provides a trivial positive utility to the masses but leaves the three patients in unremitting torment until death.

  Lexical-threshold negative utilitarianism mandates funding the palliative care because the patients' suffering exceeds a qualitative threshold of intensity that cannot be outweighed by any quantity of mild pleasure, whereas a fully commensurable account, such as classical utilitarianism, mandates funding the wait-time reduction because the aggregate sum of minor frustrations avoided across half a million people mathematically exceeds the disutility of the three patients' pain. The precise structural feature driving this divergence is the placement of the severe suffering above a lexical boundary, treating it as lexically superior to all sub-threshold states rather than merely greater in magnitude. If this feature were removed by lowering the intensity of the patients' condition to moderate discomfort situated beneath the threshold, the lexical view would aggregate the pain against the mild pleasures, likely yielding the same verdict as the commensurable account in favor of the larger population due to the sheer numbers involved. A defender of the lexical-threshold position might attack the case without appealing to empirical data or authorities by arguing that the scenario presupposes the existence and location of the boundary rather than independently establishing it, contending that the intuition of a breaking point is being smuggled into the description of the pain rather than derived from a neutral evaluation of the consequences.
