  You are describing a phenomenon that sits at the intersection of three major philosophical traditions, and you are correct that no single established term captures the *exact* configuration you've outlined. You have correctly identified the logical structure, the historical mechanism, and the social enforcement, but existing concepts tend to isolate one of these dimensions at the expense of the others.

  Here is the breakdown of the nearest candidates, why they fall short, and a proposed name for the specific configuration you are tracking.

  ### The Nearest Candidates

  **1. Wittgenstein's "Hinge Propositions" (*On Certainty*)**
  *   **The Fit:** This is the logical skeleton of your description. Wittgenstein argues that doubt requires certainty; to question anything, you must leave some things unquesitoned (the "hinges" on which the door turns). Examples: "The world existed before I was born," "This is my hand." When someone denies a hinge, Wittgenstein suggests you don't argue; you treat them as confused or untrained.
  *   **The Miss:** You noted that Wittgenstein seems to imply these *can't* be doubted. While standard readings often treat hinges as static, Wittgenstein explicitly uses the **"riverbed" metaphor**: the bed of the river (hinges) shifts over time, even if the water (daily arguments) flows over it. However, Wittgenstein focuses on the *logical* necessity of hinges, not the *sociological* mechanism of their historical drift. He doesn't fully explain *how* or *why* the riverbed moves, only that it does.

  **2. Ian Hacking's "Styles of Reasoning"**
  *   **The Fit:** This captures the historical dimension you mentioned ("a couple of hundred years back... sources count as testimony has changed"). Hacking argues that what counts as a "truth" or "evidence" (e.g., statistical proof, laboratory demonstration, taxonomic classification) depends on the historical "style" in force. You cannot argue against a style from within it; styles change via historical drift, not decisive refutation.
  *   **The Miss:** Hacking focuses on macro-history (the history of science), not micro-conversations. He explains why *we* today don't accept miracle reports as evidence, but he doesn't fully capture the interpersonal friction of your friend example—the specific moment where you stop arguing and start treating him as "outside the conversation."

  **3. Kuhn's "Paradigms"**
  *   **The Fit:** Paradigms dictate what counts as a valid problem or solution. Shifts happen via "revolution," often without a logical proof that the new paradigm is better (incommensurability).
  *   **The Miss:** "Paradigm" is too heavy-duty. It implies a cohesive theoretical framework (like Newtonian Physics). Your example is more granular: it's about the *status of a photo*, not a whole theory of the universe. Also, Kuhn implies a crisis precedes the shift; you describe a drift that happens "without anyone winning an argument."

  ### The Missing Concept

  The gap you've identified is the **social enforcement of historically contingent foundations.**
  *   **Wittgenstein** gives you the *function* (stopping point).
  *   **Hacking** gives you the *history* (contingency).
  *   **Sociology of Knowledge** (e.g., Gieryn's "Boundary Work") gives you the *exclusion* (laughing/correcting).

  There is no single established term that fuses these three. "Hinge Propositions" is the closest, but it lacks the historical bite. "Episteme" (Foucault) has the history and exclusion, but implies power/oppression rather than innocent epistemic friction.

  ### Proposed Name: **Contingent Hinges**

  Since no established term fits the exact triad (Logical Foundation + Historical Mutability + Social Exclusion), I propose the label **Contingent Hinges**.

  **Definition:**
  A *Contingent Hinge* is a proposition or norm that functions as an axiomatic stopping-point for justification within a specific discourse community (treating it as a fact), but is recognized from a meta-perspective as historically replaceable (treating it as a convention). Denial of a Contingent Hinge does not trigger counter-argument, but rather **discursive exclusion** (correction, training, or dismissal), because the denial undermines the conditions required for the argument to proceed.

  **Why this name?**
  *   **Contingent:** Acknowledges the historical drift (unlike standard "Basic Beliefs").
  *   **Hinge:** Acknowledges the logical function (reasons stop here).
  *   **Implicit Social Dimension:** Unlike "Hinge Propositions," which can be read individualistically, "Contingent Hinges" implies a community agreement that can change.

  ### Borderline Cases

  To test if something counts as a *Contingent Hinge*, apply these three criteria. If it fails one, it's a borderline case.

  1.  **The Circularity Test:** If I try to argue against this claim, do I have to assume the claim is true to make my argument?
      *   *Yes:* It's a Hinge.
      *   *No:* It's just a disputed fact.
      *   *Borderline:* **Deep Scientific Laws.** (e.g., Conservation of Energy). Arguing against them assumes them, *but* they are so stable they feel necessary rather than contingent. They are "frozen hinges."

  2.  **The Exclusion Test:** If someone denies this, do I try to persuade them, or do I treat them as incompetent/unserious?
      *   *Yes (Treat as incompetent):* It's a Hinge.
      *   *No (Try to persuade):* It's a normal claim.
      *   *Borderline:* **Political Norms.** (e.g., "Voting is the proper way to decide leadership"). Deniers are argued with *and* excluded. This sits between a Hinge and a Value Judgment.

  3.  **The Drift Test:** Can I imagine a historical context where this was not a hinge, or will not be one?
      *   *Yes:* It's Contingent.
      *   *No:* It's a Universal (e.g., "Pain is bad").
      *   *Borderline:* **Logical Laws.** (e.g., Non-Contradiction). These function as hinges, but claiming they are *historically contingent* is a radical philosophical move (dialetheism). Most would say these are not contingent.

  ### Application to Your Example
  *   **Claim:** "Photos in reputable news sources count as prima facie evidence of events."
  *   **Circularity:** To argue "This photo is fake," you assume other photos *could* be real. If you assume *no* photos are evidence, you have no ground to stand on to prove that one is fake.
  *   **Exclusion:** You don't argue with your friend; you treat his skepticism as a breakdown of shared reality.
  *   **Drift:** 150 years ago, a painting could be evidence; 50 years from now, perhaps no digital file is.
  *   **Verdict:** This is a **Contingent Hinge**.

  ### Summary
  You are tracking **Contingent Hinges**. They are the "riverbed" propositions (Wittgenstein) that shift via "styles of reasoning" (Hacking) and are enforced by "boundary work" (Sociology). When you encounter one, you are not hitting a wall of logic; you are hitting the floor of your current historical room. You can't argue against the floor; you can only move to a different room, which happens over centuries, not conversations.
