answer: |-
  Here is the **ISOTYPE-Tactile Compliance Matrix (ITCM)**. This is the procedure your team runs on every graphic proposal before it hits my desk.

  It is designed to be binary where possible. If a proposal hits a **HARD REJECT**, work stops. If it hits a **DESIGNER ESCALATION**, it comes to me.

  ---

  ### The Procedure: ISOTYPE-Tactile Compliance Matrix (ITCM)

  **Pre-Condition:** All checks assume a 1:1 scale prototype or high-fidelity mockup. Do not run this on screen-only comps.

  #### Phase 1: Visual Syntax (Neurath Rules)
  *Goal: Ensure the graphic communicates quantity through number, not size.*

  **Step 1.1: The Unit Test**
  *   **Check:** Does one symbol represent a fixed, defined unit of energy (e.g., 1 icon = 100 kWh)?
  *   **Pass:** Yes, the legend defines the unit.
  *   **Fail:** No, symbols represent abstract concepts (e.g., "a lot" vs. "a little").
  *   **Action:** **HARD REJECT.** Return to concept.

  **Step 1.2: The Multiplication Test**
  *   **Check:** Is quantity indicated *only* by repeating the symbol?
  *   **Pass:** 10 units = 10 identical symbols.
  *   **Fail:** 10 units = 1 symbol made 10x larger, or 1 big symbol + 2 small symbols.
  *   **Action:** **HARD REJECT.** This violates the core ISOTYPE principle.

  **Step 1.3: The Dimensionality Test**
  *   **Check:** Are the symbols strictly 2D/flat?
  *   **Pass:** No shading, no perspective, no 3D rendering.
  *   **Fail:** Drop shadows, gradients, isometric views.
  *   **Action:** **HARD REJECT.** Simplify to flat silhouette.

  #### Phase 2: Tactile Topology (Accessibility Rules)
  *Goal: Ensure a finger can distinguish individual units without confusion.*

  **Step 2.1: The Separation Gap**
  *   **Check:** Measure the negative space between embossed outlines of adjacent symbols.
  *   **Pass:** Gap is ≥ 2.0 mm (0.08 in).
  *   **Fail:** Gap is < 2.0 mm.
  *   **Action:** **HARD REJECT.** Increase spacing or reduce symbol count.

  **Step 2.2: The Line Weight**
  *   **Check:** Measure the width of the raised outline.
  *   **Pass:** Line width is between 1.0 mm and 3.0 mm.
  *   **Fail:** Lines are hairline (<1mm) or too broad/blurry (>3mm).
  *   **Action:** **HARD REJECT.** Adjust embossing depth/width.

  **Step 2.3: The Cluster Density**
  *   **Check:** If symbols are stacked (e.g., a bar chart made of icons), can a finger trace the edge of one symbol without touching the neighbor?
  *   **Pass:** Yes, distinct boundaries exist on all sides.
  *   **Fail:** No, outlines merge into a single "bumpy" texture.
  *   **Action:** **HARD REJECT.** Re-arrange layout (e.g., switch from stacked to linear row).

  #### Phase 3: Integration & Escalation
  *Goal: Catch conflicts between the two systems.*

  **Step 3.1: The Scale Conflict**
  *   **Check:** Does meeting the Tactile Separation Gap (Step 2.1) make the graphic too large for the panel?
  *   **Pass:** Graphic fits within allocated zone.
  *   **Fail:** Graphic exceeds allocated zone.
  *   **Action:** **DESIGNER ESCALATION.** (Do not reject. Bring to Lead Designer).

  **Step 3.2: The Symbol Semantics**
  *   **Check:** Is the symbol universally recognizable by touch *and* sight? (e.g., A sun is distinct; a generic gear might not be).
  *   **Pass:** High recognition in user testing.
  *   **Fail:** Ambiguous shape.
  *   **Action:** **DESIGNER ESCALATION.** (Requires values call on metaphor).

  ---

  ### Application to Draft Proposals

  Here is how your team runs the ITCM on the two drafts you provided.

  #### Draft 1: Stacked Coal vs. Stacked Sun
  *Proposal: Identical coal-lump icons stacked in a column vs. identical sun icons stacked in a column.*

  *   **Step 1.1 (Unit Test):** **PASS.** Assuming legend defines 1 lump = 1 unit.
  *   **Step 1.2 (Multiplication):** **PASS.** Quantity shown by repetition.
  *   **Step 1.3 (Dimensionality):** **PASS.** Assuming flat silhouettes.
  *   **Step 2.1 (Separation Gap):** **CONDITIONAL.** If the stack is tight, this fails. If spaced ≥2mm, it passes.
  *   **Step 2.3 (Cluster Density):** **RISK.** Stacking creates vertical pressure. If the embossing is high-relief, the top of the lower sun might touch the bottom of the upper sun.
      *   *Result:* If spacing is adjusted to pass 2.3, the column becomes very tall.
  *   **Step 3.1 (Scale Conflict):** **DESIGNER ESCALATION.**
      *   *Why:* To prevent tactile blurring in a stack, you need significant vertical space. If the coal column requires 50 icons and the solar requires 5, the coal column might be 4 feet tall while solar is 6 inches. The graphic fits the rules, but creates a massive visual imbalance on the wall.
      *   *Verdict:* **Bring to Lead Designer.** We have to decide if we accept the visual imbalance or change the unit value (e.g., 1 icon = 10 units) to shrink the graphic.

  #### Draft 2: Scaled Flame vs. Lightning
  *Proposal: One flame icon scaled 3x larger next to one small lightning-bolt icon.*

  *   **Step 1.1 (Unit Test):** **FAIL.** One icon does not equal a fixed unit; size is doing the work.
  *   **Step 1.2 (Multiplication):** **HARD REJECT.**
      *   *Reasoning:* This violates Neurath's primary rule ("Quantity shown by repetition not scaling"). It also violates accessibility; a low-vision user cannot easily compare area differences of complex shapes by touch.
      *   *Verdict:* **STOP.** Do not proceed to tactile checks. Redesign required.

  ---

  ### The "Hated Answer" Case
  *You asked for the case where the procedure spits out an answer we'll probably hate.*

  **Scenario:** A comparison of "Home Energy Use" vs. "Industrial Energy Use."
  **The Data:** Industrial use is 1,000x Home use.
  **The Proposal:** 1,000 house icons vs. 1 factory icon (to save space).

  *   **ITCM Result:** **HARD REJECT (Step 1.1 & 1.2).**
  *   **Why we will hate it:** To follow ISOTYPE rules strictly, we must show 1,000 house icons to match the 1 factory icon (if 1 factory = 1,000 units, then 1 house = 1 unit, requiring 1,000 house icons).
  *   **The Conflict:** If we follow the rules, the "Home" graphic is a massive wall of 1,000 tiny icons, and the "Industrial" graphic is a single icon. It looks broken to the average visitor. It feels like the design is shouting that "Homes are the problem" simply because of the visual weight of the repetition.
  *   **Procedure Outcome:** The checklist forces a **HARD REJECT** on the 1-vs-1000 proposal.
  *   **Required Fix:** We must change the *Unit Value*. (e.g., 1 House Icon = 100 units; 1 Factory Icon = 100,000 units). But wait—ISOTYPE demands identical symbols for comparison.
  *   **The Real Fix:** We have to group the icons. 1 "Stack of 10 Houses" icon = 100 units.
  *   **Why it sucks:** It adds cognitive load. Visitors have to learn that a "stack" is a new unit. The checklist forces this complexity to maintain accuracy, even though a simple scaled bar chart would be easier to read. **The checklist prioritizes truth over elegance.**

  ---

  ### What This Checklist Cannot Settle (The "Values Call")

  The ITCM is a logic gate, not a critic. It cannot evaluate meaning. These issues come to me:

  1.  **Emotional Valence:**
      *   *Issue:* In Draft 1, the Sun symbol feels optimistic/warm. The Coal lump feels dirty/heavy.
      *   *Checklist Status:* **PASS.** Both are distinct, flat, tactile-safe.
      *   **Values Call:** Is it ethical to use a "happy" symbol for solar and a "grimy" symbol for coal in a science exhibit? Does this bias the data? I need to decide if we neutralize the symbols (e.g., use generic geometric shapes) or accept the metaphor.

  2.  **Cultural Legibility:**
      *   *Issue:* A "lightning bolt" for electricity is standard in the US, but not universally understood by touch or in all cultures.
      *   *Checklist Status:* **PASS** (assuming shape is distinct).
      *   **Values Call:** Do we prioritize local shorthand or universal abstraction?

  3.  **Aesthetic Boredom:**
      *   *Issue:* Strict ISOTYPE + Tactile spacing often results in grids that look sterile or "spreadsheet-like."
      *   *Checklist Status:* **PASS.**
      *   **Values Call:** Is the exhibit engaging enough? I have to weigh the strict compliance against visitor dwell time.

  4.  **The "Wall of Icons" Problem:**
      *   *Issue:* As seen in the "Hated Answer" case, strict adherence can make graphics physically impractical.
      *   **Values Call:** I decide when to break the rule for feasibility. (e.g., "We will allow grouping of 10 icons into a single 'super-symbol' to save wall space.")

  **Summary for the Team:**
  If it scales, **Reject**.
  If it touches/blur, **Reject**.
  If it fits the rules but looks weird/unfair/impossible to build, **Bring to Me.**
