  # Research Prospectus: The Status of the Canonical Version in Dennett's Multiple Drafts Model

  **Student Researcher:** [Name]
  **Seminar:** Advanced Independent Study in Philosophy of Mind
  **Term:** Spring Semester
  **Project Length:** One Semester (12 Weeks)
  **Estimated Word Count:** 4,000 words (Final Paper)

  ---

  ## 1. Abstract

  This research project proposes a critical re-examination of Daniel Dennett's Multiple Drafts Model of consciousness, specifically targeting the distinction between the Cartesian Theater and the distributed processing alternative. While standard introductory treatments frame this debate as a binary choice between a central observer and parallel processes, this project argues that the deeper philosophical issue lies in the necessity of a "canonical version" of experience at any given moment. The central research question asks whether the Multiple Drafts Model genuinely eliminates the requirement for a canonical version of experience or merely relocates it to the level of editorial promotion and temporal coherence. Through close conceptual analysis and the construction of a taxonomy distinguishing canonical representation from distributed editing, this project will evaluate whether coherence over time can be explained without assuming a central screen. The study aims to determine if Dennett's critique of Cartesian Materialism holds ontological weight or if it relies on a pragmatic redefinition that leaves the functional role of the "canonical" intact. This prospectus outlines the philosophical context, methodological approach, timeline, and criteria for success, including an honest assessment of the risks associated with verbal disputes and scope management.

  ---

  ## 2. Introduction and Statement of the Problem

  The philosophy of mind has long struggled with the "Hard Problem" of consciousness, but before addressing why experience exists, we must address how experience is structured. Daniel Dennett's contribution to this field, particularly his rejection of the "Cartesian Theater," is a cornerstone of contemporary materialist philosophy. The Cartesian Theater metaphor describes the intuitive but philosophically problematic idea that there is a specific place in the brain where "it all comes together"—a final stage where sensory inputs converge to be presented to a central observer or homunculus. Dennett argues that this model is incoherent because it invites an infinite regress (who watches the show in the theater?) and lacks empirical support from neuroscience. In its place, he proposes the Multiple Drafts Model, suggesting that consciousness is not a unified show but a distributed process of parallel narratives editing each other over time, with no final draft until the moment of report or memory fixation.

  However, a tension arises when we scrutinize the functional requirements of behavior and report. Even if there is no physical theater, the organism behaves *as if* it has a unified experience. When I report seeing a red flash, there is a specific content to that report. This suggests that at some point, a specific version of events was selected over competing versions to guide action. My preliminary investigation suggests that standard introductory treatments of Dennett's work often gloss over this nuance. They present the Multiple Drafts Model as a simple elimination of the "center," but they do not adequately address whether the *function* of the center—the establishment of a canonical version of reality for the organism—is truly eliminated or merely disguised.

  The core tension in my framing lies between the *ontological claim* (there is no finish line) and the *functional necessity* (there must be a output for behavior). If Dennett claims there is no canonical version, he risks contradicting the phenomenological unity we experience. If he admits there is a canonical version generated for the sake of report, he risks reintroducing a functional equivalent of the Theater, merely shifting the location from a physical place to a temporal moment of "editorial promotion." This project seeks to resolve this tension. It is not enough to say "there is no theater"; we must ask if the concept of a "canonical version" is indispensable to any coherent theory of consciousness, even a materialist one.

  To anticipate a serious objection that my project might be merely verbal: There is a significant risk that the debate over whether a canonical version "exists" collapses into a dispute over how we define the word "canonical." If "canonical" means "physically located in one neuron," Dennett wins easily. If "canonical" means "the version that drives speech," then Dennett might admit it exists but call it something else. If the project does not carefully distinguish between ontological existence and functional role, the research will degrade into semantics rather than substantive metaphysical analysis. Therefore, a key component of this proposal is defining "canonical" in a way that is independent of Dennett's specific terminology, allowing for a neutral evaluation of his model.

  Furthermore, I must sketch what a genuinely negative result would look like. In empirical science, a negative result means the hypothesis was false. In conceptual analysis, a negative result often means the question was ill-posed. A genuine negative result for this project would be demonstrating that the distinction between "canonical version" and "distributed draft" is incoherent without presupposing the very Cartesian dualism Dennett rejects. If I find that I cannot formulate the concept of a "canonical version" without implicitly invoking a homunculus, then the project would conclude that Dennett's critique stands not because the Multiple Drafts Model is perfect, but because the alternative is unintelligible. Conversely, a negative result for the *hypothesis* (which would be a positive outcome for the research) would be proving that Dennett's model implicitly relies on a canonical version, thereby weakening his critique of Cartesian Materialism. I must remain open to either outcome.

  This research is critical because it addresses the stability of materialist explanations of consciousness. If Dennett's model secretly relies on the structures it claims to eliminate, then the "dissolution" of the Hard Problem he advocates may be premature. By focusing on the specific mechanism of temporal coherence and editorial promotion, this project aims to move beyond the standard textbook summary of Dennett and engage with the structural integrity of his argument.

  ---

  ## 3. Philosophical Context and Gap in Existing Literature

  To understand why this specific question is necessary, we must first examine how Dennett's work is typically presented in secondary and introductory tertiary education. In most introductory philosophy of mind courses, the debate is framed as a historical progression: Dualism posits a soul; Materialism posits a brain; Identity Theory posits brain states are mind states; Functionalism posits mental states are functional roles. Within Functionalism, Dennett is introduced as the champion of the "heterophenomenological" method, urging us to treat subjective reports as texts to be interpreted rather than direct windows into reality. The Cartesian Theater is presented as the villain—a intuitive but false model—and the Multiple Drafts Model is presented as the hero—a scientifically respectful model that aligns with the parallel processing architecture of the brain.

  This binary framing leaves a specific issue open: the status of unity. Introductory treatments often assume that because the brain is parallel, the mind must be fragmented, and that the *feeling* of unity is simply a user-illusion. However, they rarely probe whether the *mechanism* generating that illusion requires a point of convergence that functions identically to the Theater it replaces. The literature often treats the "Multiple Drafts" as a description of neural competition, but it stops short of analyzing whether the winning draft constitutes a "canonical version" in any meaningful sense.

  Existing treatments leave this open because they prioritize the anti-dualist polemic over the structural analysis of the alternative. Dennett's own writing, particularly in *Consciousness Explained*, is dense and often moves quickly from neural mechanisms to philosophical conclusions. He emphasizes that there is no "finish line" where consciousness happens. However, he also acknowledges that organisms must act coherently. The gap in the literature—and in the pedagogical presentation of these ideas—is the failure to rigorously analyze the transition from "competing drafts" to "coherent action." Is this transition a smooth gradient, or does it require a threshold that functionally serves as a finish line?

  Some secondary literature discusses the "Stalinesque" vs. "Cartesian" distinction in perception (whether distortions happen before or after experience), but this project focuses on the broader structural issue of canonical representation. The specific issue I am addressing is whether the Multiple Drafts Model can account for temporal coherence without smuggling in a canonical version. For example, when we perceive motion (like the Color Phi phenomenon), our brain constructs a narrative that smooths over gaps. Dennett argues this construction happens over time with no single moment of "completion." But if I report the motion, I report a completed sequence. At the moment of report, is there not a canonical version of the sequence existing in my working memory? If so, does that version serve the role of the Theater's screen, even if it is transient?

  Introductory texts often skip this because it requires a deep dive into the philosophy of time and memory, which is beyond the scope of a survey course. They settle for the conclusion: "No Theater, just drafts." This project aims to unsettle that conclusion by asking: "What makes a draft a draft, and what makes a version canonical?" If the distinction is merely about when the version becomes fixed (permanent memory vs. transient processing), then the Multiple Drafts Model might be describing a temporal delay rather than a structural elimination of the Theater. This nuance is rarely explored in high school or early undergraduate contexts, making it a suitable topic for an advanced independent study that seeks to contribute original analysis rather than mere exegesis.

  The gap, therefore, is not in the primary text itself—Dennett addresses these objections—but in the conceptual clarity with which the implications are drawn out in secondary analysis suitable for this level. By isolating the concept of "canonical version" and testing it against the Multiple Drafts Model, this project fills a niche that bridges introductory functionalism and advanced metaphysics of mind. It moves the discussion from "Is there a little man in the head?" to "Is there a necessary logical structure of unity that any conscious system must instantiate?" This shift is essential for evaluating whether Dennett has truly dissolved the problem or merely relocated it.

  ---

  ## 4. Precise Formulation of the Research Question

  To ensure this project yields a determinate answer rather than an open-ended exploration, the research question must be stated with precision. Vague questions lead to vague answers. The question is not simply "Is Dennett right?" but rather a conditional inquiry into the structural requirements of his model.

  **Primary Research Question:**
  *Does the Multiple Drafts Model genuinely eliminate the necessity for a canonical version of experience at any given moment, or does it merely relocate the function of canonicalization to the level of editorial promotion and temporal coherence, and if the latter, does this functional relocation weaken Dennett's critique of Cartesian Materialism?*

  This question is tripartite. First, it asks about elimination vs. relocation. This forces a binary distinction that can be argued for or against. Second, it specifies the mechanism of relocation ("editorial promotion and temporal coherence"), which grounds the abstract concept in Dennett's own terminology. Third, it asks about the consequence for the critique of Cartesian Materialism. This ensures the project remains relevant to the broader debate in philosophy of mind.

  To make this determinate, I will define "canonical version" operationally for the purposes of this paper. A "canonical version" is defined as a representation of sensory data that possesses **exclusive authority** for guiding immediate verbal report and motor action, such that competing representations are suppressed or overwritten. If the Multiple Drafts Model posits that multiple conflicting drafts can guide action simultaneously, then there is no canonical version. If it posits that only one draft guides action at a time, then there is a functional canonical version, regardless of whether it is called a "draft" or a "show."

  By anchoring the definition in "exclusive authority for guiding action," I avoid the verbal dispute about whether the experience "feels" unified. Instead, I focus on the functional output. This allows for a logical analysis of Dennett's claims. If Dennett argues that action can be guided by distributed consensus without a single authoritative draft, I will test the coherence of that claim. If he argues that a draft becomes canonical only upon report, I will analyze whether that moment of report constitutes a "virtual theater."

  This precision is necessary because Dennett's writing is often rhetorical. He uses metaphors (theater, drafts, fame in the brain) that can be interpreted loosely. By tightening the question to focus on the *necessity* of a canonical version for *coherence*, I create a standard against which his model can be measured. The answer will not be a simple "yes" or "no," but a structured argument: "The model relocates the function; therefore, the critique is weakened because the functional role of the Theater remains intact," or "The model eliminates the function; therefore, the critique holds, but requires a new explanation for coherence." Either way, the outcome is determinate.

  ---

  ## 5. Methodology

  Since this project does not have access to primary neuroscience labs or empirical data collection, the methodology must be strictly philosophical. It will rely on conceptual analysis, logical reconstruction, and thought experimentation. The method will proceed in three distinct phases, corresponding to the deliverables of the semester.

  **Phase 1: Close Conceptual Analysis of Metaphors (Weeks 1-4)**
  The first phase involves a rigorous dissection of the two central metaphors: the Cartesian Theater and the Multiple Drafts Model. I will not treat these as mere illustrations but as structural claims about information processing.
  *   **Task:** I will extract the necessary conditions for a "Theater" (e.g., a single locus of presentation, a distinct observer, a temporal finish line) and the necessary conditions for "Drafts" (e.g., parallel processing, revision over time, lack of finality).
  *   **Analysis:** I will compare these conditions to identify overlaps. For instance, does a "final draft" that is reported functionally identical to a "presentation on a screen"? I will look for instances in Dennett's arguments where he denies a feature of the Theater but implicitly relies on it to explain behavior.
  *   **Output:** This phase culminates in the Week 4 Outline, which will map the logical structure of both models side-by-side.

  **Phase 2: Construction of a Taxonomy (Weeks 5-8)**
  The second phase addresses the risk of verbal dispute by creating a precise taxonomy of representation. I need to distinguish between different types of "versions" of experience to see where the "canonical" label applies.
  *   **Taxonomy Categories:**
      1.  *Raw Sensory Registration:* Neural firing patterns without integration.
      2.  *Competing Drafts:* Parallel narratives that exist simultaneously but are mutually incompatible.
      3.  *Editorially Promoted Draft:* A draft that gains dominance over others for a specific task.
      4.  *Canonical Version:* A draft that is fixed as the "truth" for the organism's memory and report.
  *   **Task:** I will evaluate Dennett's model against this taxonomy. Does he deny category 4 exists? Or does he claim category 3 *becomes* category 4 only retrospectively?
  *   **Analysis:** This allows me to pinpoint exactly where the "canonical" status is assigned. If it is assigned retrospectively (after the report), does that mean there was no canonical version *during* the experience? This distinction is crucial for the temporal coherence argument.
  *   **Output:** This phase culminates in the Week 8 Conceptual-Analysis Memo, which will present this taxonomy and apply it to specific cases (like the Color Phi phenomenon).

  **Phase 3: Evaluation of Temporal Coherence (Weeks 9-12)**
  The final phase tests whether coherence over time can be explained without assuming a central screen.
  *   **Task:** I will construct a logical argument regarding temporal unity. If experience is distributed drafts, how does the organism maintain a sense of continuity? Dennett suggests a "narrative gravity." I will analyze whether "narrative gravity" requires a center of gravity.
  *   **Analysis:** If the "center of gravity" is a useful fiction, does it still require a real mechanism to generate the fiction? If that mechanism selects one story over others, is it not functioning as a canonical selector?
  *   **Output:** This leads to the Full Draft in Week 12, synthesizing the analysis and taxonomy into a final conclusion regarding the strength of Dennett's critique.

  This methodological approach ensures that I am not merely summarizing Dennett but actively testing the structural integrity of his arguments. By breaking the problem down into metaphors, taxonomy, and coherence, I avoid getting lost in the broad scope of philosophy of mind and remain focused on the specific tension regarding canonical versions. It also mitigates the lack of empirical data by focusing on logical consistency rather than neural verification. The question is not "What does the brain do?" (which requires a lab) but "What must be true for Dennett's explanation to work?" (which requires logic).

  ---

  ## 6. Project Timeline and Milestones

  The semester is divided into three distinct milestones to ensure steady progress and allow for feedback loops. This timeline is designed to prevent the common pitfall of leaving all writing until the end.

  **Week 4: Detailed Outline and Argument Map**
  *   **Deliverable:** A 3-5 page document containing a section-by-section outline of the final paper and a visual argument map.
  *   **Content:** The outline will specify the thesis statement, the main arguments for each section, and the counter-arguments I intend to address. The argument map will visually display the logical flow from premises (e.g., "Behavior requires unified output") to conclusions (e.g., "Therefore, a functional canonical version is required").
  *   **Goal:** To ensure the scope is manageable and the argument is linear. This is the stage to catch logical gaps before drafting begins.
  *   **Check-in:** I will meet with the seminar instructor to review the outline. If the argument map shows circular reasoning or undefined terms, I will revise the taxonomy before proceeding.

  **Week 8: Conceptual-Analysis Memo**
  *   **Deliverable:** A 1,500-word memo focusing exclusively on the definition and taxonomy of "canonical version" vs. "distributed draft."
  *   **Content:** This memo will not be a draft of the paper but a working document clarifying the tools I will use. It will define the operational terms, present the taxonomy described in the methodology, and apply it to one specific thought experiment (e.g., the Orbison illusion or Color Phi).
  *   **Goal:** To resolve the risk of verbal dispute early. By forcing myself to define the terms precisely in Week 8, I ensure that the final paper does not collapse into semantics.
  *   **Check-in:** Instructor feedback will focus on whether the definitions are robust enough to sustain the argument. If the definitions are too weak, the final paper will be unsound.

  **Week 12: Full Draft**
  *   **Deliverable:** The complete 4,000-word research paper.
  *   **Content:** Introduction, Context, Methodology, Analysis, Objections, and Conclusion.
  *   **Goal:** To present a polished, defensible argument that answers the research question.
  *   **Check-in:** Final review for clarity, flow, and philosophical rigor.

  This timeline is aggressive but necessary for a one-semester project. It forces early engagement with the hardest part of the project (the definitions) in Week 8, rather than leaving it for the final draft. It also builds in buffer time for revision. If the Week 4 outline reveals the scope is too broad, I can narrow the focus to a single thought experiment before investing time in writing.

  ---

  ## 7. Criteria for Success and Failure

  In philosophical research, success is not always finding a "yes" or "no" answer; it is often about clarifying the question. However, for the purposes of this seminar, I need to specify what constitutes a successful project outcome versus a failure, particularly regarding the risk of verbal dispute.

  **Successful Outcome:**
  A successful outcome is one where I arrive at a determinate conclusion regarding the structural integrity of the Multiple Drafts Model.
  *   *Scenario A:* I demonstrate that Dennett's model *does* rely on a functional canonical version. Success here means showing exactly where this function appears in his model (e.g., at the point of memory fixation) and arguing why this counts as a relocation of the Theater. This would weaken his critique of Cartesian Materialism by showing that the "materialism" is still carrying a Cartesian functional load.
  *   *Scenario B:* I demonstrate that a canonical version is *not* required. Success here means constructing a coherent model of distributed coherence where action is guided without a single authoritative draft. This would support Dennett and strengthen the materialist position.
  *   *Scenario C:* I demonstrate that the question reveals a deeper category error. Success here means showing that "canonical version" is a dualist concept that cannot be translated into materialist terms at all. This would be a meta-philosophical success, clarifying the limits of the debate.

  In all three scenarios, the project is successful if the argument is logically valid, the terms are clearly defined, and the conclusion follows from the premises. The value lies in the rigor of the analysis, not in proving Dennett "wrong."

  **Failure Conditions:**
  *   *Verbal Dispute Collapse:* The primary risk is that the project collapses into a verbal dispute about the word "canonical." If I find myself arguing "Dennett says X, but I call X 'canonical'," without a substantive difference in mechanism, the project has failed. To avoid this, I must ensure that my definition of "canonical" has explanatory power independent of the label. If the distinction does not change how we predict behavior or understand the mind, it is merely verbal.
  *   *Scope Creep:* Another failure mode is attempting to solve the Hard Problem of consciousness instead of focusing on the structural question of canonical versions. If the paper drifts into qualia or metaphysics of selfhood without linking it back to the Multiple Drafts Model, it fails the specific constraints of the proposal.
  *   *Exegetical Trap:* A third failure is merely summarizing Dennett's views without critical evaluation. The project must be an *assessment*, not a book report. If the paper ends with "Dennett argues X," without adding "and this is problematic because Y," it has not met the research standard.

  **Negative Result (Substantive):**
  As mentioned in the problem statement, a genuinely negative result for the *hypothesis* would be proving that Dennett is correct and there is no canonical version. This is not a failure of the project, but a negative finding. However, a negative result for the *project's viability* would be discovering that the concept of "distributed coherence" is unintelligible without a centralizer. If I reach Week 10 and realize that I cannot explain coherence without a center, I must pivot to arguing that the Multiple Drafts Model is incomplete. Recognizing this limitation early and adjusting the thesis is a sign of research maturity, not failure.

  To monitor these risks, I will use the Week 8 Memo as a checkpoint. If the taxonomy cannot be constructed without ambiguity, I will know the project is veering toward verbal dispute and I will need to refine the operational definitions immediately.

