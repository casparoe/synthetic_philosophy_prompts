      *   *Claim 3:* "Algorithmically tied" is the key phrase. This is the crux. If the algorithms aren't sufficiently similar or predictable, the link breaks.
      *   *Claim 4:* Yes, FDT (Yudkowsky/Soares) and TDT (Pearl/Wallace-ish) support this. CDT rejects it. This is a *major* point of contention in broader philosophy, but settled within the specific community advocating acausal trade.
