      *   *Free Money vs. Never Applies:* The "Never Applies" crowd usually attacks the *epistemic* precondition (can you really know the other agent's source code/decision process well enough?). The "Free Money" crowd assumes superintelligence solves the epistemic problem. It's not a motte; it's a disagreement about the feasibility of the required logical correlation in the real world.

