      *   *Claim 2:* "Each one's decision is correlated with the other's, because they're both working out what the same kind of agent should do in the same kind of situation." (Mechanism: Logical Correlation)
      *   *Claim 3:* "So if I cooperate with you acausally, the version of you that's algorithmically tied to me cooperates back..." (Mechanism: Counterfactual Dependence)
