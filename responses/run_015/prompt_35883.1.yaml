prompt: |-
  I've been reading about Epicurus's argument that death can't be bad for the one who dies, since there's no subject left over to be harmed by it, and I've mostly found it convincing. But the law seems to assume the opposite in some places and agree with it in others, and I can't square the two. On one side, wrongful death suits and life insurance never compensate the deceased for losing their life — the money always goes to surviving relatives, as if the harm of death itself were not owed to anyone. On the other side, desecrating a corpse or vandalizing a grave is a crime even when the family is gone or doesn't care, wills are enforced for decades after the testator dies, a dead person's recorded refusal to donate organs is treated as binding, and some countries let you be sued for defaming the dead. What theory of harm and of death do these practices jointly presuppose? Does the law hold an Epicurean view when compensating and an anti-Epicurean view when protecting dignity and wishes, or is there some single account — say, about enforcing promises, protecting the living's sensibilities, or maintaining social norms — that covers both halves? Where would such a unified reading break down, and what exactly would have to change in these practices if a legislature took Epicurus seriously? Please be explicit about which parts of your reconstruction you're least confident in, and what argument or consideration would push you toward the opposite conclusion about what the law presupposes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** The tension between Epicurus's view on death (death is nothing to us/no harm to the deceased) and legal practices surrounding death.
      *   **Observation 1 (Epicurean-leaning):** Wrongful death suits and life insurance compensate survivors, not the deceased. The dead don't get paid for losing their life.
      *   **Observation 2 (Anti-Epicurean-leaning):** Desecration of corpses/graves is criminal (even without family), wills are enforced post-mortem, organ donation refusals are binding, defamation of the dead is actionable (in some jurisdictions).
      *   **Questions:**
          *   What theory of harm/death do these practices jointly presuppose?
          *   Is it a split view (Epicurean for compensation, Anti-Epicurean for dignity) or a unified account (promises, sensibilities, norms)?
          *   Where would a unified reading break down?
          *   What would change if a legislature took Epicurus seriously?
          *   **Constraint:** Be explicit about confidence levels and what arguments would shift the conclusion.

  2.  **Initial Analysis & Philosophical Grounding:**

      *   *Epicurus's Argument:* "When we exist, death is not; and when death exists, we are not." Therefore, death cannot be experienced as a harm by the subject.
      *   *Legal Reality:* The law is pragmatic, not purely philosophical. It deals with social order, property rights, and emotional interests of the living.
      *   *The Tension:* The user sees a contradiction. I need to resolve whether it's a contradiction in *theory* or just a pragmatic patchwork.
      *   *Potential Unified Theory:* "Posthumous Interests" vs. "Survivor Interests."
          *   *Survivor Interests:* Wrongful death (loss of support/companionship). Fits Epicurus (no harm to dead).
          *   *Posthumous Interests:* Wills, bodily integrity. Seems Anti-Epicurus (dead person's wishes matter).
          *   *Alternative Unified Theory:* "Antemortem Autonomy." The harm occurs *before* death (the frustration of the desire to have wishes respected), or the law protects the *institution* of promising/testating, which requires post-mortem enforcement to function.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the insight. The law is indeed inconsistent if viewed through a strict metaphysical lens, but consistent if viewed through a *functional* lens.
      *   **The Unified Account (The "Institutional/Relational" Theory):**
          *   Hypothesis: The law doesn't care about the *metaphysical status* of the dead. It cares about the *interests of the living* and the *integrity of social institutions*.
          *   *Compensation (Epicurean side):* Compensates economic/emotional loss to survivors. No "loss of life" value because life isn't property.
          *   *Dignity/Wills (Anti-Epicurean side):* Why enforce wills? To encourage planning while alive (utilitarian). Why protect corpses? To protect public health and the sensibilities of the living (who fear their own corpses will be mistreated).
          *   *Synthesis:* The law treats the dead as *legal fictions* to serve the living.
      *   **Where the Unified Reading Breaks Down:**
          *   *Criminal Law:* Killing someone is a crime against the *state* and the *victim*. If the victim is gone, who is the victim? The law acts *as if* the victim was harmed.
          *   *Posthumous Harm:* If I promise to burn your diary and burn it after you die, did I harm you? Feinberg's argument (interests survive death). The law sometimes recognizes this, sometimes doesn't.
          *   *Defamation:* In many US jurisdictions, you *can't* sue for defamation of the dead. In others (e.g., Germany, some US states historically), you can. This shows inconsistency.
      *   **Legislative Changes (Taking Epicurus Seriously):**
          *   Abolish posthumous rights (wills become void at death).
          *   No crime for corpse desecration unless it harms public health or living relatives' emotional distress.
