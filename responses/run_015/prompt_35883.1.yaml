      *   *Refinement on Corpses:* Is it dignity of the dead or sensibilities of the living? Most legal scholars argue the latter. But some statutes speak of "dignity of the deceased." This is the friction point.
      *   *Epicurean Legislation:* If we took Epicurus seriously, we wouldn't just change damages; we might change the definition of murder. Murder is harming a person. If death isn't a harm to the person, is murder just a severe assault? No, because it removes the subject. This gets tricky. Better to focus on civil law (wills, torts) as that's where the user's examples lie.

