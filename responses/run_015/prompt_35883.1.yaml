answer: |-
  This is a profound legal-philosophical puzzle. You have correctly identified a surface-level contradiction: the law treats the dead as non-existent for the purpose of *receiving* compensation (the Epicurean view) but as existing agents for the purpose of *holding* rights (the Anti-Epicurean view).

  To resolve this, we must look past metaphysics and examine the *functional* theory of law. The law is rarely a consistent application of philosophical truth; it is a system of social engineering.

  Here is a reconstruction of the theory the law presupposes, where it breaks down, and what an Epicurean legislature would look like.

  ### 1. The Unified Account: "Antemortem Autonomy and Living Sensibilities"

  The most coherent unified reading of these practices is not that the law holds a specific metaphysical view on death, but that it operates on a **functional fiction of continuity** to serve the interests of the living. This theory has two pillars:

  **Pillar A: Incentivizing Antemortem Planning (The Will/Organ Donor Case)**
  Why does the law enforce a will? An Epicurean might say, "The testator is gone; they cannot be harmed by the breach." But the law is not looking at the testator *post-mortem*; it is looking at the testator *ante-mortem*.
  *   **Theory:** If people believed their wishes would be ignored upon death, they would lack the incentive to accumulate wealth, organize their affairs, or consent to medical protocols while alive.
  *   **Resolution:** Enforcing the dead's wishes is not about protecting the *dead subject*, but about honoring the *autonomy of the living subject* that extended into the future. It creates a stable environment for the living to plan.

  **Pillar B: Protecting the Sensibilities of the Living (The Corpse/Defamation Case)**
  Why is desecrating a grave a crime even if no family exists?
  *   **Theory:** This is not about the "dignity of the deceased" (which implies a subject to possess dignity) but about **public order and collective anxiety**. Humans project themselves into the corpse. To mistreat the dead is to signal to the living that *their* future remains are insecure.
  *   **Resolution:** The harm is to the *social fabric* and the *psychological security of the living population*.

  **How this squares the circle:**
  *   **Wrongful Death:** Money doesn't go to the dead because the dead have no use for it (Epicurean), and giving it to them serves no social utility. It goes to survivors to replace lost support (Functional).
  *   **Post-Mortem Rights:** Rights are enforced not because the dead *feel* the violation, but because violating them undermines the trust and autonomy of the living (Functional).

  ### 2. Where the Unified Reading Breaks Down

  This "Living-Centric Functionalism" is strong, but it fractures in two specific areas where the law acts *as if* the dead are genuinely harmed subjects, contradicting the Epicurean premise even functionally.

  **A. Hedonic Damages and "Loss of Life"**
  In some jurisdictions (though not all), a "survival action" allows an estate to recover damages for the "loss of enjoyment of life" the deceased would have experienced had they lived.
  *   **The Breakdown:** This explicitly compensates for a subjective experience the deceased *cannot have*. It presupposes a counterfactual subject who is suffering the loss. This is metaphysically Anti-Epicurean and functionally odd (who spends the money? heirs who didn't lose the enjoyment?).
  *   **Why it exists:** It is a punitive measure against killers, not a compensatory one for the dead. But it disguises punishment as compensation.

  **B. The Nature of Murder**
  Criminal law treats murder as a harm *to the victim*, not just to the state.
  *   **The Breakdown:** If Epicurus is right, murder is not a harm to the victim (since they cease to exist). It is merely a prevention of future pleasure. Yet, the law treats the *extinction* itself as the ultimate harm. The law presupposes that *existence* is a good owed to the subject, and removing it is a wrong *against them*, not just against society.
  *   **Why it exists:** Retributive justice requires a victim. If the victim wasn't harmed, the moral gravity of murder diminishes to "unauthorized termination."

  ### 3. What Would Change if a Legislature Took Epicurus Seriously?

  If a legislature strictly adopted the Epicurean view ("Death is nothing to us; no subject, no harm"), the legal landscape would shift radically:

  1.  **Abolition of Testamentary Freedom:** Wills would be void upon death. Property would escheat to the state or pass via automatic default rules (like strict primogeniture or equal division). Why? Because a non-existent entity cannot hold property rights or have "wishes."
  2.  **No Crime of Desecration (without living relatives):** Disturbing a grave would only be a crime if it posed a public health risk or caused demonstrable emotional distress to *living* kin. If you are the last of your line, your corpse would have no legal protection.
  3.  **Organ Donation Opt-Out:** A dead person's refusal to donate organs would be non-binding. Since they cannot be harmed by the removal, and they have no rights, the state could reclaim biological resources for the living (maximizing utility).
  4.  **Murder Reclassified:** Homicide might be reclassified from a crime against a *person* to a crime against the *state's population count* or *economic potential*. The rhetoric of "justice for the victim" would be replaced by "protection of the populace."
  5.  **No Posthumous Defamation:** Libel laws would strictly terminate at death. Truth would be an absolute defense immediately, as the "reputation" is merely a social construct among the living, not a right of the dead.

  ### 4. Confidence and Counter-Arguments

  **Where I am Least Confident:**
  I am least confident in the assertion that the law *can* be unified under a single theory. My reconstruction above ("Functional Fiction") is the *best* rationalization of current law, but I am only **60% confident** that this is the actual presupposition rather than simple historical accretion.
  *   **Reason for doubt:** The law is often a patchwork of Common Law traditions, religious morality, and statutory compromises. The protection of corpses, for example, stems from Ecclesiastical Courts (religious view of the body as a temple) which is inherently Anti-Epicurean. The "Living Sensibilities" theory might be a modern justification for an ancient, superstitious rule.

  **What Would Push Me to the Opposite Conclusion:**
  The argument that would convince me the law *actually* presupposes an Anti-Epicurean metaphysics (that the dead *are* harmed) is the **Feinberg/Interest Theory of Rights**.
  *   **The Argument:** Joel Feinberg argued that humans have "posthumous interests." If I desire that my book be published after I die, that interest exists *now*. If you burn the manuscript after I die, you thwart an interest I held *while alive*. Therefore, I am harmed *ante-mortem* by the knowledge that my future interests might be thwarted, or simply by the thwarting itself which relates back to my prior agency.
  *   **The Shift:** If courts began explicitly ruling that "the deceased suffered a legal harm" rather than "the survivors suffered distress" or "public order was breached," I would have to concede the law is Anti-Epicurean.
  *   **Current Evidence:** Some courts *do* use this language regarding wills ("the intent of the testator must be honored"), but they rarely extend it to bodily integrity without referencing public policy. If a court ruled that *organ harvesting against a deceased's wishes* was a tort *against the deceased's estate* (not the family) specifically because the deceased's autonomy was violated, that would be a decisive move toward Anti-Epicureanism.

  ### Summary
  The law is **methodologically Epicurean** regarding compensation (no payout to the dead) but **institutionally Anti-Epicurean** regarding rights (enforcing dead wishes). The bridge between them is **Utility**: we ignore the dead's pain because they feel none, but we honor the dead's commands because it helps the living plan.

  If you forced the law to be philosophically consistent, you would likely end up with a colder, more utilitarian system where the dead are treated as resources for the living, and "dignity" is recognized as a feeling belonging solely to the observers, not the observed.
