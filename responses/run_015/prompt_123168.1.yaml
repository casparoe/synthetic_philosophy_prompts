  | **Precaution Against Irreversibility:** Keep if repeal facilitates a physical or legal change that cannot be undone, regardless of current utility or origin. | **Fits:** River Strip (repeal enables irreversible lease).<br>**Strains:** Market Stalls (repeal was reversible, yet repealed).<br>**Strains:** Dog Register (kept for utility, not risk). | **Keep.** The culvert is the irreversible act. Once buried, the surveyor's claim becomes unfalsifiable. Keeping the by-law preserves the option to validate the hydraulics before they vanish. | *"No filling in the Old Quarry."* (Keep even if no one uses the quarry and origin is unknown, because filling is permanent. Distinguishes from Utility/Extinction which would repeal due to lack of active use.) |
  | **Extinction of Original Purpose:** Repeal if the historical rationale is gone and no new rationale has been formally adopted by the council. | **Fits:** Market Stalls (cattle market gone, no new reason).<br>**Strains:** Dog Register (origin unknown, yet kept).<br>**Strains:** River Strip (origin unknown, yet kept). | **Repeal.** The 1890 archive gap suggests the original purpose is lost. The surveyor's letter is not a formal council adoption. The Clerk labels it "dead wood." | *"No bear-baiting in the Square."* (Repeal immediately. Distinguishes from Irreversibility because allowing it creates no permanent physical change, and from Utility because no one enforces it.) |

  **Best guess at your vote:** 4–3 to **Keep**, mirroring the River Strip split. The "endless minutes" fatigue usually pushes for repeal (Market Stalls), but the physical irreversibility of the culvert raises the stakes enough to trigger the River Strip precaution.

  **Closest analog:** The **River Strip**. Both involve unknown origins where repeal unlocks a permanent commitment (lease vs. culvert) that the council would regret if it later turned out the by-law was serving a hidden protective function.

  **Principle committed:** You are adopting **"The Last Chance to Know."** When physical evidence is about to be destroyed (by culverting), the burden of proof shifts: you cannot repeal a restriction unless you can disprove the plausible risk (the surveyor's scouring theory), not just fail to prove the benefit. Ignoring the letter makes the presumption unfalsifiable, but crediting it preserves the option to learn before the evidence is buried.
