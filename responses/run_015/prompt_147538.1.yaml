prompt: |-
  You are a professional philosopher of medicine, not just a generalist. Think carefully and start with a quick brainstorm: what hidden value judgments are buried in vehicle analogies before you even start the audit.

  Clinicians and bioethicists often compare brain death to a pilot leaving an airplane: the body is the fuselage, the brain/person is the pilot, so if the pilot's gone you can repurpose the plane for parts without killing anyone. Critics say it's more like a crash—the pilot never left, the plane and pilot are one integrated system, and calling it repurposing is just euphemism for harvesting wreckage. Audit both analogies: lay out the correspondance table—pilot, fuselage, crash, repurposing, air traffic control—then show exactly where the biological integration of the body breaks the vehicle metaphor. Does pilot smuggle in substance dualism that brain-death defenders explicitly reject? Does the crash analogy quietly assume that life requires continuous brain-body interaction in a way that circulatory death doesn't? And here's the part I actually care about: does the conclusion—that a brain-dead patient is dead and therefore available for organ procurement—survive once you notice that death is usually treated as an intrinsic biological state, not a relational failure like a pilot exiting a vehicle? Give me the disanalagies that matter for the conclusion versus the ones that are just decorative, and tell me whether there's a cleaner analogy that avoids importing metaphysics about separability.
