answer: |-
  **Project Title:** The Geometric Prisoner's Dilemma: Multi-Agent Kelly Optimization in Repeated Zero-Sum Games

  **1. Core Research Question**
  In single-agent decision theory, the Kelly criterion (maximizing expected log-wealth) is proven to dominate other strategies in the long run, maximizing the geometric growth rate of capital. However, this optimality is derived in isolation. This project asks: **In a repeated zero-sum betting setting between two agents with log-utility preferences, does mutual Kelly optimization constitute a Nash Equilibrium that is Pareto-inferior to a cooperative "flat-betting" agreement?**

  Put precisely: If two agents with opposing priors repeatedly bet against one another, does the strategy profile (Kelly, Kelly) yield a lower *aggregate* geometric growth rate (sum of expected log-wealths) than the profile (Flat, Flat)? If so, we can characterize this as a "Geometric Prisoner's Dilemma," where individual rationality (maximizing personal growth rate) drives a collective loss in geometric welfare due to excessive volatility drag.

  **2. Why Single-Agent Proofs Do Not Settle This**
  Standard proofs of Kelly optimality (e.g., Breiman, 1961) rely on the Law of Large Numbers applied to a single wealth trajectory against a fixed environment (or "nature"). They assume the payoff structure is exogenous.

  In a two-agent zero-sum setting, the environment is endogenous. Agent A's payoff is Agent B's loss. While Kelly maximizes Agent A's growth rate *given* Agent B's strategy, it ignores the systemic impact of variance on the pair. Because the logarithm is concave, the sum of expected logs $E[\log(W_A)] + E[\log(W_B)]$ is maximized when wealth distribution is stable. Aggressive Kelly betting maximizes variance in wealth distribution. In a zero-sum game with friction (or even without, due to the concavity of the utility function), high variance reduces the sum of utilities. Single-agent theory treats volatility as the engine of growth; multi-agent geometric rationality must treat volatility as a potential drag on collective utility. The single-agent proof fails because it does not account for the counterparty's reaction function or the joint utility surface.

  **3. Proposed Methodology**
  I will construct a minimal theoretical model and validate it via simulation.

  *   **The Model:** A repeated 2x2 betting game over $n$ rounds.
      *   **Agents:** Two agents, $A$ and $B$, with initial wealth $W_0$.
      *   **Priors:** Agents hold opposing beliefs on a binary outcome (e.g., $p_A = 0.6, p_B = 0.4$).
      *   **Strategies:**
          1.  *Defect (Kelly):* Bet fraction $f^*$ maximizing $E[\log(W)]$.
          2.  *Cooperate (Flat):* Bet fraction $f < f^*$ (e.g., half-Kelly or fixed small fraction).
      *   **Metric:** The primary outcome is the **Sum of Geometric Growth Rates**: $G_{sum} = \lim_{n \to \infty} \frac{1}{n} E[\log(W_{A,n}/W_{A,0}) + \log(W_{B,n}/W_{B,0})]$.
  *   **Analysis:**
      1.  Derive the expected growth rate for each strategy profile (K,K), (K,F), (F,K), (F,F).
      2.  Determine if (K,K) is a Nash Equilibrium (i.e., can one agent improve their *individual* growth by switching to Flat if the other plays Kelly?).
      3.  Compare $G_{sum}$ at (K,K) versus (F,F).
  *   **Simulation:** Python-based Monte Carlo simulations over $10^4$ rounds to verify asymptotic behavior and check for ruin probabilities that analytic limits might obscure.

  **4. Expected Outcomes**
  *   **Positive Result (The Dilemma Exists):** The model shows that while (Kelly, Kelly) is a Nash Equilibrium (neither agent can unilaterally switch to Flat without reducing their *own* growth rate), the aggregate growth $G_{sum}$ at (Kelly, Kelly) is strictly less than at (Flat, Flat). This confirms that geometric rationality creates a social dilemma where aggressive optimization destroys joint value through volatility.
  *   **Negative Result (No Dilemma):** Either (Kelly, Kelly) is not a Nash Equilibrium (agents naturally prefer less volatility), or the aggregate growth is identical regardless of betting fraction (unlikely given log concavity), or the zero-sum nature implies one agent's gain always exactly offsets the other's utility loss in a way that makes the "sum" metric irrelevant.

  **5. Timeline and Feasibility (3 Months)**
  *   **Month 1: Formalization.** Define the payoff matrices and derive the analytic growth rates for the four strategy profiles. Establish the conditions for the Nash Equilibrium.
  *   **Month 2: Simulation & Stress Testing.** Run simulations to check edge cases (e.g., what happens when one agent goes bankrupt? Does the game end?). Test robustness against different prior divergences.
  *   **Month 3: Synthesis.** Write up the results. If a dilemma is found, characterize the "tax" on growth imposed by mutual Kelly betting.
  *   **Feasibility Assessment:** Three months is sufficient for this scope *provided* the model remains simple (2x2 binary outcomes). If the math requires solving complex stochastic differential equations for continuous time, it will not be doable. I will restrict the scope to discrete rounds to ensure completion.

  **6. Definition of Failure**
  The project would be considered a failure if:
  1.  **Triviality:** The interaction collapses back to single-agent logic (e.g., if the zero-sum constraint makes the opponent's strategy irrelevant to my optimal fraction).
  2.  **No Dilemma:** If the Nash Equilibrium coincides with the Social Optimum (i.e., rational agents naturally choose the "cooperative" low-volatility bet without needing an agreement).
  3.  **Metric Breakdown:** If the "Sum of Log-Wealth" metric proves incoherent in a zero-sum context (e.g., if wealth conservation makes the sum constant regardless of strategy, rendering the question vacuous). *Note: I anticipate the sum will not be constant due to the non-linearity of the log function, but if it is, the premise fails.*

  **7. Conclusion**
  This project challenges the assumption that Kelly optimization is universally robust. By shifting the frame from "Agent vs. Nature" to "Agent vs. Agent," we test whether geometric rationality holds up in a strategic environment. Even a negative result is valuable, as it clarifies the boundary conditions of log-utility maximization in game-theoretic settings.
