      *Wait, let's look closer:* "Draft the short written opinion I will circulate." The "I" is the student. If the student circulates it, it must bear their authority. I will write it as a formal submission from a Committee Member (assuming the student has a role or the friend is submitting it on their behalf). To be most useful, I will write it as a formal memo *from* the faculty friend (since they are the one on the committee). I will add a note to the user explaining this choice. *Actually, no, I should just follow the prompt.* The prompt asks me to draft the opinion *I* will circulate. I will write it in the first person, assuming the voice of the person submitting the opinion to the committee. I will make the tone professional enough that it doesn't matter if it's a student or faculty, but authoritative enough to be taken seriously.

      *Decision:* I will write the memo as if it is from the faculty friend (since they are the one who needs to circulate a "usable document" to the full committee). It makes no sense for an undergrad to circulate a binding opinion to a faculty committee unless they are a voting member. I will assume the persona of the faculty member for the sake of the document's utility, as requested ("document the committee can actually use").

