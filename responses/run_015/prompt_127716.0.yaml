answer: |-
  Here is a prioritized research agenda for a year of conceptual work on Kalai-Smorodinsky (KS), ranked by normative significance rather than technical difficulty.

  ### The Ranking

  1.  **The Normative Status of the Utopia Point (Refining your Q1)**
  2.  **The Coherence of Multi-Party Generalizations (Your Q3)**
  3.  **Mapping to Distributive Justice Principles (Your Q4)**
  4.  **Non-Convexity and Discrete Sets (Your Q2)** — *Low Priority / Potential Dead End*

  ---

  ### 1. Top Priority: The Normative Status of the Utopia Point
  **Refinement:** Your first question contains a category error that is actually the key to the research. In standard KS, the **utopia point** is determined by the *feasible set* (the maximum possible utility each agent could get if others got their minimum), while the **disagreement point** is determined by *outside options*. You asked about the utopia point shifting because an outside option improves. Usually, an improved outside option shifts the *disagreement* point.

  **The Real Question:** Why should an *unattainable* ideal (the utopia point) dictate the division of *attainable* surplus?
  Nash's IIA axiom says: ignore possibilities you can't reach. KS says: the shape of the impossible matters. Specifically, KS equalizes the *ratio of concession* from the ideal. Agent A gets more not necessarily because they contributed more, but because their "ceiling" is higher relative to the floor.

  **Why this is upstream:**
  This is the philosophical engine of KS. If you cannot defend the claim that fairness requires tracking "potential" rather than just "security" (disagreement) or "marginal contribution" (Nash), the rest of the math is irrelevant.
  *   **Research Task:** Construct cases where tracking the utopia point yields intuitively *unfair* results. For example: Agent A has a wildly high utopia point due to a low-probability lottery win included in the feasible set, while Agent B has a stable, lower ceiling. KS shifts division toward A. Is this fair? Or does it reward "aspirational noise"?
  *   **Normative Stake:** This determines whether KS is a theory of *fair compromise* or a theory of *proportional entitlement to potential*.

  ### 2. Second Priority: The Multi-Party Generalization
  **The Problem:** In two dimensions, the line from disagreement to utopia intersects the Pareto frontier at a unique point. In three or more dimensions, that line still exists, but it no longer uniquely satisfies a clean set of axioms that preserve the KS spirit. There are multiple generalizations (e.g., Thomson's extensions), and they diverge.

  **Why this is upstream of Q4:**
  You cannot compare KS to theories of distributive justice (which are inherently social/multi-party) if KS is inherently dyadic. If KS fractures into five different solutions when a third player enters, it loses its claim to being a general principle of fairness.
  *   **Research Task:** Don't just look for *a* generalization. Look for the *normative cost* of the existing ones. Does the 3-player KS solution violate monotonicity in a way that 2-player KS does not? Does it become sensitive to irrelevant players?
  *   **Normative Stake:** If KS only works for dyads, it is a theory of *bargaining*, not *justice*. If it generalizes cleanly, it is a candidate for a principle of social organization.

  ### 3. Third Priority: Comparison to Distributive Justice
  **The Connection:** KS is often interpreted as a "proportional solution." It equalizes the percentage of ideal utility gained. This sounds like "equality of opportunity" or "proportional merit." Egalitarian solutions equalize absolute utility gains. Nash equalizes the *product* of gains (utilitarian-leaning).

  **Why this is downstream:**
  You can only meaningfully compare KS to egalitarianism once you know what KS *is* in multi-party settings (Q2) and what the utopia point *means* (Q1).
  *   **Research Task:** Map the "equal relative concession" of KS to philosophical concepts. Is it closer to Rawls (maximin)? No. Is it closer to Locke (proportional labor)? Maybe. Is it closer to "fair shares" based on capacity?
  *   **Normative Stake:** This is the payoff. This tells you whether KS belongs in a political philosophy toolkit or stays in the economics department.

  ### 4. The Dead End: Non-Convexity and Discrete Sets
  **Why deprioritize:**
  This is a technical hurdle, not a conceptual one. In normative theory, non-convexities (indivisible goods) are typically handled by assuming access to lotteries (randomization), which convexifies the set of *expected* utilities.
  *   **The Trap:** If you spend a year figuring out how the KS line intersects a non-convex blob, you will learn about geometry, not fairness. The "line to utopia" intuition *does* survive in discrete sets (you just pick the feasible point closest to the line), but the axiomatic support crumbles.
  *   **When it matters:** Only if you are studying specific real-world mechanisms where lotteries are morally forbidden (e.g., dividing indivisible political offices). For general conceptual work on fairness, this is a distraction. The answer ("it gets messy and loses uniqueness") won't change how anyone thinks about the *principle* of fairness.

  ---

  ### Defense of the Order

  **Q1 (Utopia Normativity) is the Foundation.**
  If the reliance on the utopia point is normatively indefensible, KS is dead as a moral theory. It doesn't matter if it generalizes to 100 players (Q3) or works on discrete sets (Q2) if the core mechanism rewards the wrong thing. You need to establish *why* we care about the ceiling before you worry about how many people are in the room.

  **Q3 (Multi-Party) is the Scope.**
  Fairness is a social concept. A solution that works for two people but incoherently fragments for three is a curiosity, not a principle. However, this is secondary to Q1 because you need to know *which* generalization to test. There are many ways to extend KS to $n$-players; your normative defense of Q1 will tell you which extension is the "true" KS.

  **Q4 (Justice Comparison) is the Application.**
  This is where you publish the philosophical implications, but you can't do it until you've secured the definition (Q1) and the domain (Q3).

  **Q2 (Non-Convexity) is the Distraction.**
  It is a "how" question, not a "why" question. Unless you discover that non-convexity systematically biases KS against a specific class of agents (e.g., those with risk aversion), it is technical cleanup.

  ### Conditions for Reordering

  1.  **If Q1 is resolved quickly:** If you conclude within 3 months that the utopia point's normative status is indefensible (e.g., it clearly rewards threat potential masquerading as potential gain), **abort the KS agenda**. Switch to researching the *Egalitarian Equivalent* solution or the *Nash* solution. KS would be a dead end for normative theory.
  2.  **If Q3 reveals a unique, robust generalization:** If you find that one specific $n$-player extension of KS preserves monotonicity perfectly while others fail, **promote Q3 to Priority 1**. This would make KS a rare example of a bargaining solution that scales to social choice, which is a massive philosophical claim.
  3.  **If you focus on "Real Cooperative Settings":** If your definition of "real" implies indivisible goods (housing, jobs, political seats) where lotteries are off the table, **promote Q2**. But be warned: you will likely find that KS loses its axiomatic uniqueness, turning your project into a defense of "approximate fairness" rather than "the fair solution."

  ### Summary Advice
  Spend the first six months on **Q1**. Construct thought experiments where the "Utopia" is manipulated. Does KS reward someone for having a high but unreachable potential? If so, is that fair?
  *   *Example:* Two agents divide \$100. Disagreement is \$0.
      *   Case A: Max possible for Agent 1 is \$100, Agent 2 is \$100. KS splits 50/50.
      *   Case B: Max possible for Agent 1 is \$100, Agent 2 is \$50 (due to external constraints). KS gives Agent 1 more than 50.
      *   *Question:* Why does Agent 2's *constraint* punish Agent 2? Is that fairness, or is that efficiency masking as fairness?

  If you can't answer that, the rest of the year won't matter.
