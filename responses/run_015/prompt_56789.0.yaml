  **Cold open**
  Good evening. The flyer says this system does what residents tell it. I wrote the query for that flyer. If you ask this room how to count residents, you will get three different answers before I finish this sentence. One person wants the safest streets. One wants the fastest fix. One wants the fairer split. None of us are lying. But we cannot build a budget out of three different truths. We need math. Because how we count changes who wins. Not trees. Not sidewalks. The counting.

  **Walking back the flyer**
  The flyer promises neutrality. It says the machine just listens. But a machine cannot listen to everyone equally and fairly at the same time. If we count every resident as one vote, the big neighborhoods decide everything. If we count every request as one vote, the people with the most time to fill forms win. If we count by danger levels, we need to agree on what danger looks like. There is no setting called neutral. There is only a setting you chose. You must pick one. Ignoring the choice does not make it go away. It just hides the decision behind a screen.

  **Three ways to split a pot**
  Look at the money. Look at the districts. Here is rule one: split it by population. The east side gets less because fewer people live there. Here is rule two: split it by requests. The east side gets most because they asked for help more often. Here is rule three: split it by heat and crash data. The east side gets most because the asphalt is hotter and the roads are darker. Three rules. Three maps. Only one pot of money. If you choose population, you ignore the heat. If you choose requests, you ignore the population. Every rule helps someone. Every rule leaves someone out.

  **What you're actually here to decide**
  So here is your job. Do not talk about the projects yet. Do not talk about the neighborhoods. Your first task is to pick the rule. Look at the three maps on your table. Pick one. Or mix them, but write down the mix. If you say half by people, half by need, write the numbers. If you say fix the dangerous spots first, define dangerous. You are not approving sidewalks tonight. You are approving the ruler we use to measure them. If you leave this room without picking the ruler, the engineers will pick it for you. They need a number to run the system. Circle the map you prefer. Sign your name. Make sure that number is yours.

  **The landing**
  This will not feel good. Someone will leave here angry that their rule lost. That is inevitable. We are not finding consensus. We are picking a trade-off. Own that trade-off. Do not hide behind the machine. Do not hide behind the flyer. You are the ones holding the pen. The math is honest. Be honest. Thank you.

  **What I left out on purpose**
  A smoother speaker would promise that we all love this city equally, or that the technology is safe enough to trust blindly. I left those out because they are false comforts. The AI consultant in the third row knows the code isn't neutral, and the residents in the back know love doesn't fix sidewalks. I also avoided appealing to consensus. There is no consensus here, only trade-offs. Acknowledging that friction is the only way to make the decision real. If I made you feel good, I would be lying about the math.
