answer: |-
  # Seminar Plan: The Discursive Dilemma as a Problem of Public Justification

  **Target Audience:** Philosophy Graduate Students (familiar with Arrow/Social Choice, new to Judgment Aggregation).
  **Duration:** 90 Minutes.
  **Core Case:** The Municipal Climate-Adaptation Board (3 Members).
  **Objective:** To establish the Discursive Dilemma not as a voting anomaly, but as a crisis of institutional integrity arising from the requirement to publish coherent reasons.

  ---

  ## I. The Foundational Concept: The Justification Constraint
  **Time:** 0:00–0:15

  Before introducing the paradox, you must secure the distinction between **aggregating preferences** (Social Choice) and **aggregating judgments** (Judgment Aggregation).

  *   **The Concept:** In standard social choice (Arrow), the institution aggregates *wants* (orderings of outcomes). The "black box" of decision-making is permissible; only the outcome matters. In this seminar's context, the institution aggregates *claims* (propositions treated as true/false).
  *   **Why It Matters:** The Charter requires a **Public Justification**. The Board cannot simply announce "The Seawall is Approved." It must publish a minute stating: "The Seawall is Approved *because* Proposition A is true, Proposition B is true, and A & B entail C."
  *   **The Shift:** This transforms the problem from one of *satisfaction* (getting the most people what they want) to one of *integrity* (the institution speaking with one rational voice). If the published reasons do not logically support the published conclusion, the institution is lying. If the published conclusion contradicts the majority view on the outcome, the institution is unrepresentative.
  *   **Securing the Point:** Students must accept that the *constraint* (the requirement to publish reasons) is what generates the dilemma. Without the charter, the Board could simply vote on the seawall and ignore the reasoning. The paradox is a conflict between **collective rationality** (logical consistency) and **collective responsiveness** (majority rule on outcomes).

  ---

  ## II. The Case Design: Inclusions and Exclusions
  **Time:** 0:15–0:30

  To prevent students from dismissing the problem as practical noise, the case must be surgically constructed.

  ### What the Case Must Contain
  1.  **Distinct Proposition Types:**
      *   *Empirical ($p$):* "Sea-level rise will exceed 1 meter by 2050."
      *   *Normative ($q$):* "The cost of the seawall is justified by the safety benefit."
      *   *Meta-Evidentiary ($r$):* "The current climate models are reliable enough to base policy on."
  2.  **Strict Logical Entailment:** The Charter defines the decision rule: Approve Seawall ($C$) **if and only if** $p \land q \land r$.
  3.  **Sincere Voting:** Members vote according to their actual judgments on $p, q, r$. No strategic manipulation.
  4.  **The Profile:**
      *   Member 1 (Scientist): Yes on $p$, Yes on $q$, No on $r$ (models unreliable). $\to$ Votes No on $C$.
      *   Member 2 (Economist): No on $p$ (risk low), Yes on $q$, Yes on $r$. $\to$ Votes No on $C$.
      *   Member 3 (Activist): Yes on $p$, No on $q$ (too expensive), Yes on $r$. $\to$ Votes No on $C$.
      *   *Wait, this yields a unanimous No on C.* We need the paradox.
      *   *Corrected Profile for Paradox:*
          *   Member 1: Yes $p$, Yes $q$, No $r$. (Conclusion: No)
          *   Member 2: Yes $p$, No $q$, Yes $r$. (Conclusion: No)
          *   Member 3: No $p$, Yes $q$, Yes $r$. (Conclusion: No)
          *   *Majority on Premises:* Yes $p$ (2-1), Yes $q$ (2-1), Yes $r$ (2-1).
          *   *Majority on Conclusion:* No $C$ (3-0).
          *   *Result:* If we aggregate premises, we must build ($C$). If we aggregate conclusion, we don't build (No $C$).
  5.  **The Charter:** Explicitly states the Board is accountable for the *reasons*, not just the outcome.

  ### What the Case Must Deliberately Lack
  1.  **Strategic Incentives:** No member benefits personally from the outcome. This prevents students from reducing the problem to "game theory/voting manipulation."
  2.  **Ambiguity in Logic:** The entailment ($p \land q \land r \to C$) must be indisputable. This prevents students from solving it by "clarifying the definitions."
  3.  **Preference Intensity:** Do not discuss how *strongly* members feel. This prevents reducing the problem to "utilitarian calculus."
  4.  **External Pressure:** No mayor or lobby group forcing a result. The tension must be internal to the Board's reasoning.

  ---

  ## III. Explanatory Arc & Misconception Interception
  **Time:** 0:30–1:15

  Map the flow of the seminar to intercept misconceptions exactly when they become tempting.

  ### 1. The "Premise-Based Fix" Misconception
  *   **The Misconception:** "If we just aggregate the premises (vote on $p, q, r$) and derive the conclusion logically, the inconsistency disappears."
  *   **Interception Point:** Immediately after revealing the profile where Premise-Majority supports $C$ but Conclusion-Majority supports $\neg C$.
  *   **How to Intercept:** Acknowledge that premise-based aggregation restores *logical consistency*. However, force the question: "The Board now approves the seawall ($C$), but **every single member** voted against the seawall based on their own holistic judgment. Has the Board represented the members, or merely their fragmented sentences?"
  *   **Philosophical Hook:** This highlights the tension between **Rationality** (consistency) and **Democracy** (responsiveness to the majority view on the outcome).

  ### 2. The "Even Number/Split Vote" Misconception
  *   **The Misconception:** "This only happens because the votes are split or the group is small/even."
  *   **Interception Point:** During the profile analysis.
  *   **How to Intercept:** Explicitly point out that the group size is odd (3) and the majorities on premises are clear (2-1). Emphasize that this is not a tie-breaking problem; it is a structural feature of connecting multiple propositions.
  *   **Philosophical Hook:** The dilemma arises from the *interconnectedness* of issues, not the arithmetic of voters.

  ### 3. The "Adding Premises Increases Coherence" Misconception
  *   **The Misconception:** "If we add more detailed premises (e.g., specific cost breakdowns, specific model types), we clarify the reasoning and reduce error."
  *   **Interception Point:** When discussing how to refine the Board's charter.
  *   **How to Intercept:** Explain that adding logically connected premises *increases* the surface area for inconsistency. The more propositions you require to be jointly consistent, the higher the probability that majority voting will generate a contradiction (the Doctrinal Paradox generalizes).
  *   **Philosophical Hook:** Complexity does not solve the problem of collective reason; it exacerbates the fragility of consistency.

  ### 4. The "Delegation to Expert" Misconception
  *   **The Misconception:** "Just let the Scientist member decide the empirical premise, or hire a consultant. That resolves the conflict."
  *   **Interception Point:** Final discussion on institutional design.
  *   **How to Intercept:** Remind them of the Charter: The Board is a *collective* body responsible for *public* justification. Delegating premises to a single member or outsider abdicates the collective responsibility required by the democratic mandate. The Board must own the reasons collectively.
  *   **Philosophical Hook:** Epistemic authority cannot simply override democratic accountability in a public institution without violating the justification constraint.

  ---

  ## IV. Check-for-Understanding Question
  **Time:** 1:15–1:25

  Do not ask them to construct a truth table. Test their grasp of the *normative* constraint.

  **Question:**
  > "Imagine the Board adopts a **Premise-Based Procedure** (majority on $p, q, r$ determines $C$). In our case, this results in approving the Seawall ($C$), even though all three members individually voted against $C$.
  >
  > If the Board instead adopts a **Conclusion-Based Procedure** (majority on $C$ determines outcome), they reject the Seawall, but their published minutes must claim the decision rests on premises $p, q, r$, at least one of which is false according to the majority record.
  >
  > **Given the Charter's requirement for a 'publicly intelligible reasoning chain,' which procedure violates the institution's integrity more severely, and why does the justification requirement make this choice non-arbitrary?**"

  **Desired Answer Elements:**
  *   Recognition that Premise-Based sacrifices *responsiveness* (outcome contradicts all members' judgments).
  *   Recognition that Conclusion-Based sacrifices *honesty* (published reasons do not match the actual grounds of decision).
  *   Conclusion: The justification constraint makes the choice non-arbitrary because it forces a trade-off between **truthfulness of reasons** and **authority of the outcome**. There is no cost-free solution.

  ---

  ## V. Explicit Exclusions
  **Time:** 1:25–1:30 (Wrap up)

  To protect the conceptual point, explicitly state what is **not** covered and why.

  1.  **Formal Impossibility Theorems (List-Pettit):**
      *   *Omission:* Do not prove the general theorem that no aggregation function satisfies universal domain, consistency, and anonymity.
      *   *Reason:* Proofs shift focus to mathematical necessity. We want students to feel the *normative* tragedy of the dilemma (the loss of integrity), not just accept a logical limit.
  2.  **Probabilistic Judgment Aggregation:**
      *   *Omission:* Do not introduce degrees of belief or Bayesian updating.
      *   *Reason:* Binary logic (True/False) is required to make the inconsistency stark. Probabilities blur the contradiction, allowing students to think the problem is merely one of "confidence levels" rather than structural incompatibility.
  3.  **Weighted-Premise Extensions:**
      *   *Omission:* Do not suggest giving the Scientist's vote on $p$ more weight.
      *   *Reason:* This solves the technical inconsistency but destroys the democratic equality assumption inherent in the Board's charter. We want to preserve the tension between *equality* and *consistency*.
  4.  **Strategic Voting Models:**
      *   *Omission:* Do not discuss how members might lie about $p$ to get their preferred $C$.
      *   *Reason:* As established in the Case Design, we are isolating the *structural* problem of sincere aggregation. Introducing strategy turns this into a game-theory seminar, obscuring the problem of public reason.

  **Closing Instruction:** "For next week, do not try to solve the dilemma. Instead, draft a one-page 'Charter Amendment' that acknowledges this tension and prescribes how the Board should explain the conflict to the public if it arises."
