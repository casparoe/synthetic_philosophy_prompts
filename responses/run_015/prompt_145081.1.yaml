prompt: |-
  ok so im a junior, im in honors history, and this year im also one of the student judges for our regional history fair — we have to get through like 40 project boards in an afternoon, so realistically about 6–8 minutes each, and me and the other two judges have to rank them. my teacher keeps telling me that some of the essays give a "covering-law" style explanation and some give a "narrative" one, and that mixing them up is the main reason projects lose points, but he won't say how you actually tell which is which, and everything i found was either old philosophy jargon or just definitions. i already know the definitions. i want something i can run.

  so: write me a decision procedure i can run on a single paragraph of a history essay (mine or someone elses) in under 10 minutes, no looking anything up, that ends in one of a few verdicts. something like: this is genuinely leaning on a general pattern; this is a narrative that lives or dies on its specific sequence; this is a fake law — a grand sounding sentence that can't actually fail; or this is just a timeline with "because" stapled to it. give me the questions in order, what counts as a good enough answer to each, where the procedure stops early with a verdict, and where it has to hand the decision over to a human because it's a judgment call and not a fact question.

  two things i made up that i want built in (tell me if they're bad and fix them): the swap test — replace the specific people, place and date with different ones and see whether the explanation still delivers the outcome, and if it does, it was leaning on a general pattern rather than the actual sequence; and the delete-a-step test — take out one link in the chain and see if the outcome still follows, because if it does then that link wasn't doing any work. also i need something that catches law-shaped sentences that aren't laws ("empires always overextend," "people push back when pushed too far") and tells me how thats different from a real generalization with a scope that could turn out false. and please say clearly what the procedure cannot do — i assume it can't tell me whether the general pattern is actually true, just whether it's load bearing.

  then run it on three things. (1) a project that says the french revolution broke out because a bad harvest pushed bread prices up while the government was already broke. (2) one that says the soviet union collapsed because every overextended empire eventually does. (3) my own project, about why the mill on the edge of town shut down in 1998 — the owners had borrowed against the plant to buy a second one, the big buyer switched to a supplier overseas that spring, and the union contract came up the same month. I think (3) is defintely the strongest of the three, so if the procedure says it's weak, say that straight out, i'd rather find out now than at teh fair. finally: tell me which one test is doing most of the work in your procedure, and what breaks if i drop it. my teacher has to approve whatever rubric we use, so keep it readable by someone who has never done any philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, Honors History, Student Judge at Regional History Fair.
      *   **Task:** Create a decision procedure to distinguish between "covering-law" explanations (general patterns/rules) and "narrative" explanations (specific sequences/causal chains) in history essays.
      *   **Constraints:** Must run on a single paragraph in under 10 minutes, no looking things up, clear verdicts, readable by a teacher (no philosophy jargon).
      *   **Specific Requirements:**
          *   Include the "Swap Test" (replace specifics to see if explanation holds).
          *   Include the "Delete-a-Step Test" (remove a link to see if outcome still follows).
          *   Address "Law-shaped sentences that aren't laws" (tautologies vs. falsifiable generalizations).
          *   State limitations (can't verify truth, only structural load-bearing).
          *   Run the procedure on three specific examples (French Revolution, Soviet Union, Local Mill).
          *   Identify the most critical test and what breaks if removed.
      *   **Tone:** Practical, direct, actionable, respectful of the user's intelligence (they know the definitions but need application).

  2.  **Deconstruct the Core Concepts:**
      *   *Covering-Law Model (Hempel):* Explains an event by subsuming it under a general law + initial conditions. (If X, then Y. X happened. Therefore Y.)
      *   *Narrative Explanation:* Explains an event by tracing a specific causal chain. (A happened, which led to B, which triggered C, resulting in Y.)
      *   *The Problem:* Students often mix them poorly or use "fake laws" (tautologies) to sound smart without doing the work.
      *   *The Goal:* A rubric/procedure to identify which mode is being used and if it's done *well*.

  3.  **Drafting the Decision Procedure (The "History Fair Quick-Check"):**
      *   *Structure:* Needs to be a flowchart or a step-by-step checklist. Let's go with a Step-by-Step Checklist with "Stop & Verdict" points.
      *   *Step 1: Identify the Claim.* What is the "Because"?
      *   *Step 2: The Swap Test (User's idea).* This tests for generality. If I swap France for Russia, does the logic hold? If yes -> Covering Law. If no -> Narrative.
      *   *Step 3: The Delete-a-Step Test (User's idea).* This tests the causal chain. If I remove the middle man, does the end still happen?
      *   *Step 4: The "Fake Law" Check.* Is the generalization tautological? ("Empires fall because they get too big" vs. "Empires fall when administrative costs exceed revenue.")
      *   *Verdicts:* Strong Narrative, Strong Covering Law, Weak/Mixed, Tautology.

      *Refining the Steps for the User's Constraints:*
      *   Make it under 10 minutes.
      *   Make it teacher-friendly (avoid "Hempel," "Deductive-Nomological," etc.).
      *   Integrate the user's specific tests prominently.

  4.  **Developing the "Fake Law" Check:**
      *   How to distinguish a real generalization from a platitude?
      *   *Criterion:* Falsifiability/Scope. A real law has conditions where it *wouldn't* apply. "People push back" is always true (tautology). "People push back when tax burden exceeds 30% of income" is a testable law.
      *   *Test:* Ask "Under what specific conditions would this *not* happen?" If the answer is "None," it's a platitude.

  5.  **Running the Procedure on the Examples:**

      *   *Example 1 (French Revolution):* Bad harvest + broke gov -> Revolution.
          *   Swap Test: Swap France for England 1789? Maybe not revolution. Swap Harvest for War Debt? Maybe.
          *   Analysis: It's actually a mix. It uses specific conditions (harvest, debt) leading to a specific outcome. It's not a universal law ("All harvest failures cause revolution"). It's a *conjunctural* narrative.
          *   Verdict: Strong Narrative (specific sequence).

      *   *Example 2 (Soviet Union):* Collapsed because all overextended empires do.
          *   Swap Test: Swap USSR for Rome? Yes. Swap USSR for a small state? No.
          *   Delete-a-Step: There are no steps. It's just Law + Event.
          *   Fake Law Check: "Overextended empires eventually do." Is this always true? What defines "overextended"? If "fell" defines "overextended," it's circular.
          *   Verdict: Weak Covering Law / Tautology.

      *   *Example 3 (Local Mill):* Debt + Buyer Switch + Union Contract -> Shutdown.
          *   Swap Test: Swap Mill for Bakery? Maybe not. Swap 1998 for 2020? Maybe not. This relies on specific local mechanics.
          *   Delete-a-Step: Remove Buyer Switch? Maybe they survive. Remove Union Contract? Maybe they survive. All links matter.
          *   Verdict: Strong Narrative.

      *   *Wait, User thinks (3) is strongest.* I need to validate that. Yes, (3) is a classic causal chain (Narrative). (1) is also Narrative but broader. (2) is the weak one. I need to make sure the procedure highlights *why* (2) is weak and (3) is strong.

  6.  **Refining the Procedure for "Teacher Readability":**
      *   Avoid "Covering Law." Use "General Rule Explanation."
      *   Avoid "Narrative." Use "Step-by-Step Story."
      *   Keep the User's Test Names ("Swap Test," "Delete-a-Step"). They are intuitive.

  7.  **Addressing the "Most Important Test" Question:**
      *   Which test does the heavy lifting? The Swap Test distinguishes the *type* (Law vs. Narrative). The Delete-a-Step distinguishes *quality* (Strong vs. Weak Chain).
      *   If I drop the Swap Test, I can't tell if they are trying to be general or specific.
      *   If I drop the Delete-a-Step, I can't tell if the narrative is lazy.
      *   Actually, the "Fake Law" check is crucial for high schoolers because they love big generalizations. But the *Swap Test* is the engine that separates the two modes. Let's argue the Swap Test is the primary sorter.

  8.  **Final Review against Constraints:**
      *   Under 10 mins? Yes, 4 steps.
      *   No lookups? Yes.
      *   Verdicts included? Yes.
      *   Limitations stated? Yes.
      *   Examples run? Yes.
      *   Critical test identified? Yes.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Example 1:* The French Revolution example is tricky. "Bad harvest + broke gov" is often used as a covering law template (Malthusian crisis). I need to be careful. If the essay says "This happens in all agrarian societies," it's a Law. If it says "In France, specifically, the harvest hit *this* tax structure," it's Narrative. I will treat the prompt's phrasing ("because a bad harvest... while gov was broke") as a specific conjuncture, leaning Narrative.
      *   *Self-Correction on Example 2:* This is the classic "Bad Covering Law." It sounds smart but explains nothing specific.
      *   *Self-Correction on Example 3:* This is the "Gold Standard" for high school history. Specific, causal, contingent.

      *   *Refining the "Fake Law" section:* I need to make sure the user understands *why* "Empires always overextend" is bad. It's unfalsifiable. I'll call it the "Could It Be Wrong?" test.

      *   *Formatting:* Use bolding, boxes, or clear headers to make it skimmable for a judge in a hurry.

  10. **Final Polish:** Check tone. Encouraging but rigorous. Acknowledge the user's smart ideas (Swap/Delete tests are actually philosophically sound adaptations of counterfactual analysis).

  *(Self-Correction during drafting)*: Wait, the user asked for a procedure to run on a *single paragraph*. I need to make sure the steps focus on the text provided, not external knowledge.
  *Adjustment:* The Swap Test requires mental simulation, not research. That fits.

  Let's assemble the response.cw
answer: |-
  This is a great problem. Your teacher is pointing at a real issue in historical writing: the difference between explaining *why this specific thing happened* (Narrative) and explaining *why this fits a pattern that always happens* (Covering Law). When students mix them without realizing it, the logic falls apart.

  Your invented tests (Swap and Delete-a-Step) are actually philosophically sound. They map onto **counterfactual analysis** (what if things were different?) and **causal necessity** (did this link matter?). I have refined them slightly to make them bulletproof for a high school rubric.

  Here is the **History Fair Logic Check**. It is designed to be printed on a card, used in under 10 minutes per project, and understood by a teacher who hasn't read philosophy since college.

  ***

  # The History Fair Logic Check
  **Time limit:** 10 minutes per paragraph/section.
  **Goal:** Determine if the explanation is a **Specific Story**, a **General Rule**, or a **Fake Explanation**.

  ### Step 1: The "Because" Hunt
  Find the main sentence that explains *why* the event happened.
  *   *Example:* "The mill closed **because** the buyer left."
  *   *Action:* Underline the "Because."
  *   **Stop Rule:** If there is no "because" (only a description of what happened), verdict is **Incomplete**. Stop.

  ### Step 2: The Swap Test (Your Test)
  Look at the specific nouns in the "Because" section (people, places, dates, specific groups). Mentally swap them for different ones.
  *   *Action:* Ask: "If I swap [Specific Noun] for a different one, does the explanation still make sense?"
  *   *Good Answer (Narrative):* **No.** The explanation breaks. (e.g., "If the buyer hadn't been *that* specific overseas supplier, the mill wouldn't have closed.")
  *   *Good Answer (Law):* **Yes.** The explanation holds. (e.g., "If I swap 'France' for 'Russia,' the logic about debt and harvest still predicts a revolution.")
  *   **Verdict A:** If **No**, proceed to Step 3 (It is a Narrative).
  *   **Verdict B:** If **Yes**, proceed to Step 4 (It is a General Rule).

  ### Step 3: The Delete-a-Step Test (For Narratives)
  If Step 2 said this is a story about specific events, look at the chain of events.
  *   *Action:* Mentally remove one link in the chain. Ask: "Does the final outcome still happen?"
  *   *Good Answer:* **No.** The outcome disappears or changes completely. This means every link is doing work.
  *   *Bad Answer:* **Yes.** The outcome still happens. This means that link is "fluff" or the logic is actually relying on a hidden General Rule.
  *   **Final Verdict (Narrative):**
      *   If links are essential: **Strong Narrative.**
      *   If links are removable: **Weak Timeline** (just a list of events with "because" stapled on).

  ### Step 4: The "Could It Be Wrong?" Test (For General Rules)
  If Step 2 said this relies on a General Rule, look at the rule itself.
  *   *Action:* Ask: "Can I imagine a situation where this rule is **false**?"
  *   *Good Answer (Real Law):* **Yes.** (e.g., "Empires collapse when administrative costs exceed revenue." *Could be false?* Yes, if they find new revenue.)
  *   *Bad Answer (Fake Law):* **No.** The sentence is always true by definition. (e.g., "Empires collapse when they get too big to survive." *Could be false?* No, because "too big to survive" just means "will collapse.")
  *   **Final Verdict (Rule):**
      *   If falsifiable: **Strong Covering Law.**
      *   If unfalsifiable: **Tautology** (Sounds smart, says nothing).

  ***

  ### What This Procedure Cannot Do
  1.  **Verify Truth:** This procedure checks *logic structure*, not facts. If a student writes "The war started because aliens landed," and the logic chain is tight, this test says the *explanation* is structured well, even if the fact is wrong. (You still need to check facts separately).
  2.  **Judge Value:** A "Strong Narrative" isn't automatically better than a "Strong Covering Law." It depends on the prompt. However, in high school history, **Weak Narratives** and **Tautologies** are the most common failures.
  3.  **Handle Mixed Modes:** Sometimes a project uses a General Rule to set the stage, then a Narrative for the specific event. This procedure forces you to judge the *main* explanatory paragraph. If they switch modes mid-paragraph without signaling it, the Delete-a-Step test will usually catch it as a "Weak Timeline."

  ***

  # Running the Procedure on Your Examples

  Here is how the Logic Check handles the three cases you provided.

  ### Case 1: The French Revolution
  > *"The French Revolution broke out because a bad harvest pushed bread prices up while the government was already broke."*

  *   **Step 1 (Because):** "Because a bad harvest... while gov was broke."
  *   **Step 2 (Swap Test):** Swap "France" for "England" (same year). Swap "Harvest" for "War Debt."
      *   *Result:* **No.** A bad harvest in England didn't cause a revolution. A broke government without a harvest crisis might not have revolted. The specific combination matters.
      *   *Path:* Go to Step 3 (Narrative).
  *   **Step 3 (Delete-a-Step):** Remove "Government was broke." Keep only "Bad harvest."
      *   *Result:* People get angry about bread, but without the state being broke, the King might have bought grain or suppressed it. The Revolution (outcome) is less likely.
      *   *Result:* Remove "Bad harvest." Keep "Gov broke."
      *   *Result:* Gov is broke, but people are fed. No mass uprising.
      *   *Analysis:* Both links are necessary.
  *   **Verdict:** **Strong Narrative.**
      *   *Judge's Note:* This explains a specific conjuncture. It doesn't claim *all* harvests cause revolutions, just that *this* harvest hit *this* weak state.

  ### Case 2: The Soviet Union
  > *"The Soviet Union collapsed because every overextended empire eventually does."*

  *   **Step 1 (Because):** "Because every overextended empire eventually does."
  *   **Step 2 (Swap Test):** Swap "Soviet Union" for "Rome." Swap "Soviet Union" for "A small local business."
      *   *Result:* **Yes.** The sentence claims this happens to *every* empire. The specific identity of the USSR doesn't matter, only that it fits the category "Empire."
      *   *Path:* Go to Step 4 (General Rule).
  *   **Step 4 (Could It Be Wrong?):** Look at the rule: "Overextended empires eventually collapse."
      *   *Question:* Can an empire be "overextended" and *not* collapse?
      *   *Analysis:* If the student defines "overextended" as "in a state that leads to collapse," then the sentence means "Empires collapse because they collapse." There is no condition where the rule fails.
  *   **Verdict:** **Tautology (Fake Law).**
      *   *Judge's Note:* This sounds like a deep insight, but it is empty. It explains nothing about the *specific* mechanisms (economics, politics, military) that caused the USSR to fall. It loses points for logical emptiness.

  ### Case 3: The Local Mill (Your Project)
  > *"The mill shut down in 1998 because the owners had borrowed against the plant to buy a second one, the big buyer switched to a supplier overseas that spring, and the union contract came up the same month."*

  *   **Step 1 (Because):** Three specific causes listed (Debt, Buyer Switch, Union Contract).
  *   **Step 2 (Swap Test):** Swap "1998" for "1980." Swap "Overseas supplier" for "Local supplier."
      *   *Result:* **No.** If the buyer stayed local, the debt might have been manageable. If it was 1980, the overseas competition might not have existed. The specific time and place are load-bearing.
      *   *Path:* Go to Step 3 (Narrative).
  *   **Step 3 (Delete-a-Step):**
      *   Remove "Debt": If they had cash, they could have survived the buyer switch. (Outcome changes).
      *   Remove "Buyer Switch": If revenue stayed high, they could pay the debt and union. (Outcome changes).
      *   Remove "Union Contract": If labor costs were flexible, they could have weathered the loss of the buyer. (Outcome changes).
      *   *Analysis:* All three links are required to force the shutdown. None are redundant.
  *   **Verdict:** **Strong Narrative.**
      *   *Judge's Note:* This is the gold standard for high school history. It acknowledges contingency (it didn't *have* to happen) and specific causality.

  ***

  # Critical Analysis: Which Test Does the Work?

  **The Swap Test is the engine.**

  If you drop the **Swap Test**, the procedure breaks down immediately. Here is why:
  1.  **Without the Swap Test,** you cannot distinguish between Case 1 (French Revolution) and Case 2 (Soviet Union). Both look like "Because X, then Y."
  2.  Without knowing if the student is *trying* to write a General Rule or a Specific Story, you cannot apply the correct quality check (Delete-a-Step vs. Could-It-Be-Wrong).
  3.  If you apply the Delete-a-Step test to Case 2 (Soviet Union), it fails because there *are* no steps. You need the Swap Test to identify that Case 2 is a General Rule so you know to switch to the "Could It Be Wrong?" test.

  **What breaks if you drop the "Could It Be Wrong?" Test:**
  You might accidentally approve a Tautology (Case 2) as a "Strong General Rule." You would see that the Swap Test passed (it applies generally), and you might assume that makes it good. You need the "Could It Be Wrong?" test to catch students who use fancy words to say nothing.

  **Recommendation for your Teacher:**
  Tell your teacher: *"The Swap Test sorts the projects into two buckets (Specific vs. General). The other two tests just check the quality of whatever is in the bucket. If we remove the Sorter, the Quality Checks apply the wrong rubric."*

  ### Final Advice for the Fair
  Since you have 40 projects in an afternoon:
  1.  **Scan for the "Because."** If it's vague, mark it down immediately.
  2.  **Run the Swap Test mentally.** It takes 10 seconds. "Would this happen in China? In 1920?"
  3.  **If it's a General Rule,** be very harsh on the "Could It Be Wrong?" test. High schoolers love to write "Humans always fight for freedom." That is a Tautology. Make them define *when* humans don't.
  4.  **If it's a Narrative,** use the Delete-a-Step test. If they list 5 causes but the event would have happened with only 2 of them, the other 3 are fluff.

  Your project (The Mill) is indeed the strongest of the three because it passes the Swap Test (it's specific) and the Delete-a-Step Test (every link matters). It treats history as a fragile chain of events, not an inevitable law. Good luck judging.
