      *(Self-Correction during drafting)*: I need to be careful not to just say "Step 6 is wrong." I need to explain *how* an empiricist accounts for the error signal without amodal representation. The answer is *spatiotemporal coincidence*. I see the object and touch it *at the same time*. I don't need to know the shapes match to know the *events* are coincident.

