answer: |-
  The carving holds up. You have identified a structural mechanism in Plato's ethical psychology that is often blurred in general commentary.

  There is no single, standard term in the literature that captures this exact configuration. Scholars typically refer to this under the broader umbrellas of **"sympotic pedagogy"** or the use of wine as a **"pharmakon"** (drug/remedy/poison). However, those terms are too broad. "Sympotic pedagogy" usually refers to the *content* of the conversation (poetry, philosophy) facilitated by the drinking context, not the physiological manipulation of reason itself. "Pharmakon" captures the ambivalence of wine but not the *architectural* aspect you've noticed—the deliberate construction of a safe space where reason is weakened but not abolished.

  Since the term doesn't exist, I will coin one for you: **"Probatory Intoxication."**

  Here is why your carving holds up, how this term functions, and how it differs from the alternatives.

  ### 1. Why the Carving Holds Up
  Your observation relies on the presence of a **Sober Anchor**. In both texts, the intoxication is only permissible because there is a stabilizing element that remains untouched by the dissolution.
  *   **In the *Symposium*:** The anchor is Socrates. He is physically present, drinking equally (or more) without becoming intoxicated, or simply remaining sober while others drink. The dramatic tension isn't just that Alcibiades is drunk; it's that Alcibiades is drunk *in front of* Socrates. The "scaffold" is Socrates' own *logos* (reason), which holds the space open so Alcibiades' confession doesn't descend into mere chaos.
  *   **In the *Laws*:** The anchor is the Law itself, embodied by the **Symposiarch** (the toastmaster) and the age restrictions. The Athenian Stranger explicitly argues that you cannot let the "puppet strings" of passion pull unchecked. The regulations are the scaffold. The wine weakens the "golden cord" of reason so the citizen can feel the pull of the other cords (fear, pleasure, anger) without snapping the golden cord entirely.

  This confirms your "scaffolded failure mode" thesis: The system is designed to induce a *controlled* collapse of rational governance to observe what lies beneath.

  ### 2. The Coinage: "Probatory Intoxication"
  I suggest **Probatory Intoxication** (or **"Scaffolded Intoxication,"** adopting your phrasing).
  *   **Probatory:** From the Latin *probare*, meaning to test or prove. This captures the *Laws* argument that drinking parties are essentially *dokimasia* (public examinations) for character.
  *   **Intoxication:** Specifies the method.
  *   **Scaffolded:** Specifies the structural constraint (the Sober Anchor).

  This term distinguishes the setup from mere partying or mere therapy. It implies an experiment where the variable (reason) is deliberately dampened to measure the resilience of the subject (the soul).

  ### 3. Differentiation from "Sympotic Education"
  **Sympotic Education** is the standard term for learning that happens at a drinking party.
  *   **Mechanism:** In standard sympotic education, wine is a lubricant for conversation. It loosens the tongue to speak truth or learn poetry. The wine serves the *logos*.
  *   **Your Configuration (Probatory Intoxication):** Here, the wine is the *curriculum*. The physiological state of the drinker *is* the lesson. The point isn't what they say while drunk (though that matters); the point is how they *behave* while drunk.
  *   **The Difference:** In sympotic education, the wine helps you access truth. In probatory intoxication, the wine simulates a threat to truth so you can practice defending it (or be diagnosed as unable to defend it).

  ### 4. Differentiation from Modern "Disinhibition"
  The modern psychological view (and the folk wisdom of *in vino veritas*) views alcohol as a **revealer**.
  *   **Modern View:** Alcohol removes the mask. The "true self" is hidden underneath social norms, and alcohol strips those norms away. It is a subtractive process (removing inhibition).
  *   **Platonic/Probatory View:** Alcohol is a **simulator**. It does not reveal a "true self"; it reveals the *current state of training* of the soul. In the *Laws*, the goal isn't to see who you "really are" in a static sense, but to see if your reason has been trained well enough to survive the assault of passion.
  *   **The Difference:** The modern view is archaeological (digging to find a buried truth). The Platonic view is gymnastic (stress-testing a muscle). If you fail the test (get too drunk/violent/shameful), it doesn't mean you revealed your true self; it means your soul is untrained. The "failure mode" is not a revelation of essence, but a diagnosis of weakness.

  ### Summary
  Your intuition is correct. Plato treats intoxication not as a loss of control, but as a **controlled loss of control**. The "scaffold" (Socrates or the Symposiarch) ensures the failure is survivable and instructive.

  **Probatory Intoxication** is the term. It distinguishes the practice from simple revelry (no test), standard sympotic learning (no physiological stress), and modern disinhibition (no training goal). It captures the specific Platonic innovation of using chemical weakness as a tool for ethical strengthening.
