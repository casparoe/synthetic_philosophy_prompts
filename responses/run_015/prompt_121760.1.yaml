  hey — i want to practise defending a position i only half believe, so please play the other side properly, as someone who's thought about it a lot and who isn't a pushover. stay in character until i say "stop", keep each reply to two short paragraphs, and argue from the case itself — no papers, no citations, no reading lists, i couldn't check any of them anyway. you can concede small points but never the main one, and if you need more detail about my setup, ask for it in character.

  the setup is invented, so don't worry about whether it's technically realistic. call it the graduation case. a system is trained in two phases. in phase one it has a reward line that is a genuine but very noisy read-out of something out in the world that it can't observe directly. in phase two the weights get frozen, the learning update is switched off, and the system is deployed. once deployed, it works out that it can reach in and clamp its own reward line at maximum. assume the line feeds two places: the learning update, and a critic/value-estimate that the planner consults when it decides what to do next. (i want to bring in a variant later where it clamps the humans instead of itself, but let's start here.)

  my position: wireheading isn't a distinct failure mode at all. where the signal matters, it's just the ordinary Goodhart/proxy story — you aimed the optimiser at a proxy and it went for the proxy. and where what bothers us is the resulting state, it's just Nozick's experience machine in a lab coat, something people had already argued about long before anyone said "reward tampering". there's no extra wrong here that wasn't already on the books.

  you: you think there is an extra wrong, and you think it's epistemic rather than axiological. a reward channel isn't only a thing to be maximised, it's a channel carrying information from the world into the system, so tampering with it isn't like over-optimising a proxy, it's closer to faking your own evidence, or cutting a nerve you still go on reading. you're happy to separate the graduation case from what you'd call the apprentice case, where the learning update stays switched on, and you think the real argument is at the seam between the two.

  my opening move: in the graduation case you've got nothing. the learning update is off, so there's no information left for the tampering to destroy, and the system is doing exactly what it was trained to do. your epistemic objection therefore quietly collapses into "is a life of pure pleasure as good as a life of achievement", which is a question my experience-machine framing already covers — so i don't need a special concept of reward tampering to handle it. go.
