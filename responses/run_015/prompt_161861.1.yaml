prompt: |-
  I am secretary to the Species Listing Panel of a statutory nature conservation body. The Panel maintains the Schedule of protected taxa, and it receives roughly forty proposals a year — almost always from outside: a recording scheme, a museum, a local trust, occasionally a statutory consultee responding to a planning application. Listing is not a courtesy. It creates a criminal offence for harming a listed animal or uprooting a listed plant, it triggers mandatory habitat protection and the assessment duties that go with it, and it directs a large part of our recovery budget. Our decisions are subject to judicial review, so we must publish written reasons and be seen to treat like cases alike.

  The Panel is five people: a museum taxonomist, one population geneticist, one field ecologist, our lawyer, and a lay chair. It meets once per proposal cycle, six weeks apart, and it is almost never expert in the group in front of it. The evidence we get is usually morphology, a distribution map, and at best one or two gene regions, often from museum material of uncertain age. Recommendations are signed off by the Chief Scientist and made by statutory instrument.

  We are not, of course, deciding what a species is in general. But the disagreements among biologists on that question keep reappearing inside our individual cases, and they will not go away just because we have a statute to administer. The same five shapes recur:

  (i) lines of evidence that point in opposite directions — the genetic data saying one widespread lineage, the ecology and morphology saying two well-marked forms that do not intergrade where they meet;
  (ii) pairs that hybridise freely and often, with fertile hybrids, yet stay recognisably distinct, so that "they interbreed" settles nothing;
  (iii) populations whose separation is geologically recent — an island cut off by a rising sea, a reservoir, a host shift within living memory — showing partial but plainly incomplete divergence, where we cannot tell whether we are looking at a species in the making or a local race that will be reabsorbed;
  (iv) groups in which the interbreeding test has no application at all: wholly asexual lineages, and plants that self as a matter of course;
  (v) the fact that the Schedule protects *names*, and names hang on type specimens, so a population that no one has formally described can be ecologically real and legally unlistable.

  What I want from you is a decision procedure the Panel can actually run, not an essay. Please give me:

  - the questions in the order they should be asked, each with a statement of what would count as a sufficient answer, and who has to supply it;
  - the points at which the procedure stops with a no, stated as gates rather than as advice;
  - the points at which the procedure hands the decision to a person because the question is one of value — in particular whether the purpose of the statute is to preserve separately evolving lineages, to maintain ecological function, or to protect particular organisms from particular harms — and an instruction to record that hand-off as a value judgement rather than dress it up as a scientific finding;
  - an explicit rule for what to do when two lines of evidence conflict, and, just as important, a rule for consistency across cases: the written reasons must say which criterion did the work in this decision and what evidence would have changed it;
  - a way of handling the five shapes above, including a time-limited provisional listing for the incipient-divergence case, with guidance on setting the review interval and on what would count as evidence of divergence having completed rather than stalled;
  - and a short template for the published reasons.

  Then run the procedure on three cases, and tell us honestly what it cannot do and where it will misfire.

  The first is a moth with two host-associated forms. They use different food plants, their pheromones differ, and in the laboratory mating is about ninety per cent assortative; hybrids are viable and fertile, and their offspring will accept either host. Genome-wide differentiation is weak, but a handful of genomic regions are strongly differentiated.

  The second is a plant with diploid and tetraploid cytotypes. They are indistinguishable in the field to anyone not counting chromosomes, they share a pollinator, and crosses produce occasional sterile triploids.

  The third is our flagship: a form that has been on the Schedule for decades, the subject of a well-publicised recovery programme, cherished by our members and by the press. Recent genomic work places it at one end of a continuous cline inside a widespread and abundant taxon, and the type specimen of the protected name sits in the middle of that cline. I expect your procedure to tell us to do something we will not want to do, and I would rather hear it from you than from a court, so please work it through rather than soften it — and then say what the procedure legitimately leaves to us, and what it cannot settle at all, in particular for the asexual and selfing groups and for cases where the answer depends on which statutory purpose we take ourselves to be serving.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Secretary to the Species Listing Panel (statutory nature conservation body).
      *   **Task:** Create a practical decision procedure for listing taxa on a protected Schedule.
      *   **Constraints/Context:**
          *   40 proposals/year, mostly external.
          *   Listing creates criminal offenses, triggers habitat protection, directs budget.
          *   Decisions subject to judicial review (need written reasons, consistency).
          *   Panel: 5 people (taxonomist, geneticist, ecologist, lawyer, lay chair). Not experts in the specific group being proposed.
          *   Evidence varies (morphology, maps, limited genetics, museum material).
          *   Core Problem: Biological species concepts disagree, but legal decisions must be binary (list/not list).
          *   Five Recurring Shapes of Disagreement: (i) Conflicting evidence (genes vs. eco/morph), (ii) Hybridization with distinctness, (iii) Incipient divergence (recent separation), (iv) Asexual/selfing (no interbreeding test), (v) Nomenclatural issues (names vs. populations).
      *   **Deliverables:**
          *   Decision Procedure (Questions, Sufficient Answers, Suppliers).
          *   Stop Gates (Hard Nos).
          *   Value Judgement Hand-offs (Explicitly marked).
          *   Conflict Resolution Rule & Consistency Rule.
          *   Handling the Five Shapes (including provisional listing for incipient divergence).
          *   Template for Published Reasons.
          *   Run the Procedure on Three Cases (Moth, Plant, Flagship).
          *   Honest Assessment of Limitations (Where it misfires, what it can't settle).

  2.  **Deconstruct the Legal/Biological Tension:**

      *   The law protects *names* tied to *types*, but conservation needs to protect *evolutionary units* or *ecological functions*.
      *   The Panel cannot resolve species concepts philosophically. They must operationalize a concept that fits the *statutory purpose*.
      *   Since the statute's purpose isn't explicitly defined in the prompt (other than "nature conservation"), the procedure must force the Panel to declare *which* purpose they are serving in borderline cases.
      *   Judicial Review risk means consistency is key. Precedent matters.

  3.  **Drafting the Decision Procedure:**

      *   *Structure:* Needs to be a flowchart logic but written as text.
      *   *Step 1: Validity.* Is the proposal administratively valid? (Name, Type, Jurisdiction).
      *   *Step 2: Distinctness.* Is there *any* evidence of separation? (Hard Gate).
      *   *Step 3: The "Species Concept" Choice.* This is the crucial Value Hand-off. The Panel must choose the lens (Evolutionary, Ecological, or Legal/Nomenclatural).
      *   *Step 4: Evidence Weighting.* How to handle conflicts.
      *   *Step 5: The Five Shapes.* Specific rules for the recurring problems.
      *   *Step 6: Final Decision & Review.*

      *   *Refining the "Value Hand-off":* The prompt asks to identify where the decision depends on the statutory purpose. This needs to be explicit. If the statute is about "biodiversity" (lineages), one answer. If "preventing extinction of charismatic units" (names), another. If "ecosystem function" (ecology), another. I need to make the Panel choose one *for the record*.

      *   *Conflict Rule:* Needs to be hierarchical. Usually, reproductive isolation > ecological distinctness > genetic distance. But for conservation, *irreversibility* of divergence is often the key. Let's propose a "Precautionary Principle" weighted by "Evolutionary Significant Unit" (ESU) logic, but constrained by nomenclature.

      *   *Consistency Rule:* The "Precedent Log." Every decision must cite which criterion was decisive and what would have flipped it.

  4.  **Addressing the Five Shapes:**

      *   (i) Conflicting Evidence: Prioritize ecological/morphological distinctness *if* reproductive isolation is incomplete, unless genetic data shows ancient separation masked by introgression.
      *   (ii) Hybridization: Distinctness + Assortative Mating > Hybridization. If they stay distinct despite hybridization, list.
      *   (iii) Incipient Divergence: Provisional Listing (5-year review). Criteria for graduation: Fixation of diagnostic traits or reproductive isolation.
      *   (iv) Asexual/Selfing: Use "Phylogenetic Species Concept" (monophyly/diagnosability) instead of Biological Species Concept.
      *   (v) Names/Types: If the population is real but the name is wrong, recommend taxonomic revision *before* listing, OR list under the existing name with a note restricting protection to the specific population (legal workaround). *Correction:* The prompt says Schedule protects *names*. If the name doesn't fit the population, we can't list the population under that name without legal risk. We need a "Taxonomic Prerequisite" gate.

  5.  **Drafting the Template:**

      *   Needs to look like a legal/administrative document.
      *   Sections: Proposal, Evidence, Procedure Steps, Value Judgement, Decision, Precedent Check.

  6.  **Running the Three Cases:**

      *   *Case 1 (Moth):* Host races. Incipient speciation. Shape (i) & (iii).
          *   *Analysis:* Weak genome-wide diff, strong local diff. Assortative mating.
          *   *Outcome:* Provisional Listing. It's distinct ecologically, genetically diverging, but not fixed.
      *   *Case 2 (Plant):* Polyploidy. Shape (iv) (sort of) & (ii).
          *   *Analysis:* Cytotypes distinct. Sterile hybrids (post-zygotic barrier).
          *   *Outcome:* List. Polyploidy is an instant reproductive barrier. They are separate evolutionary trajectories.
      *   *Case 3 (Flagship):* The Cline. Shape (v) & (i).
          *   *Analysis:* Type specimen is middle of cline. Genomic cline is continuous.
          *   *Outcome:* **Delist.** This is the hard truth. If the type is in the middle of a cline, the name applies to the whole cline. The "flagship" population is not taxonomically distinct. Protecting it requires a *new* name or a different legal mechanism (e.g., Site of Special Scientific Interest rather than Species Schedule).
          *   *Mitigation:* The procedure leaves the *policy* decision to the Chief Scientist/Minister, but the *scientific/legal* recommendation must be delisting.

  7.  **Honest Assessment (Limitations):**

      *   Asexuals: Phylogenetic species concept is arbitrary (how much difference?).
      *   Statutory Purpose: If the statute is ambiguous, the Panel is making law, not interpreting it.
      *   Names vs. Reality: The law lags behind taxonomy.
      *   Resource constraints: Provisional listing costs money.

  8.  **Review and Refine:**

      *   *Tone:* Professional, administrative, precise, slightly cold (it's a legal procedure).
      *   *Check against constraints:* Did I include the stop gates? Yes. Value hand-offs? Yes. Consistency rule? Yes. Five shapes handling? Yes. Template? Yes. Three cases? Yes. Limitations? Yes.
      *   *Self-Correction on Case 3:* The prompt says "I expect your procedure to tell us to do something we will not want to do." I must ensure I don't waffle here. If the type is in the middle of a cline, the name covers the cline. If the cline is widespread/abundant, the criteria for listing (threat/distinctness) fail. The recommendation must be delisting.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Value Judgement" sections are highlighted. Make sure the "Consistency Rule" is actionable (the "Precedent Log").

  *(Self-Correction during drafting)*: I need to make sure the "Value Hand-off" isn't just "choose a purpose." It needs to be "If Evidence X is ambiguous, we prioritize Purpose Y." I will structure the procedure so that when scientific evidence is equivocal, the Panel must vote on the *Conservation Priority* (Lineage vs. Function vs. Name).

  *(Refining the "Names" issue)*: The prompt notes the Schedule protects *names*. If a population is distinct but lacks a name, it can't be listed. The procedure must have a gate for "Taxonomic Validity." If the name doesn't match the entity, the proposal fails *unless* a taxonomic revision is submitted concurrently.

  *(Refining the "Flagship" case)*: This is the hardest. If the type is in the middle of a cline, the name *is* the cline. If the cline is abundant, it doesn't meet threat criteria. If the "flagship" is just one end of the cline, it is not the taxon named in the Schedule. To protect it, you need a *new* name. The procedure must recommend delisting the current name (as it doesn't denote a threatened entity) and inviting a proposal for the distinct endpoint *if* it can be named.

  Let's assemble the response.cw
answer: |-
  # SPECIES LISTING PANEL: OPERATING PROCEDURE (VERSION 1.0)

  **Purpose:** To ensure consistent, legally defensible decisions on the addition or removal of taxa from the Protected Schedule.
  **Authority:** Statutory Instrument [Insert Reference].
  **Applicability:** All proposals received from external bodies or internal review.

  ---

  ## PART 1: THE DECISION PROCEDURE

  ### PHASE 1: ADMINISTRATIVE AND NOMENCLATURAL VALIDITY
  *Supplier: Panel Secretary / Legal Member*

  **Q1. Is the proposed entity designated by a validly publisheduted scientific name with a designated type specimen?**
  *   **Sufficient Answer:** Yes, the name complies with the relevant Code (ICZN/ICN) and the type is extant and accessible.
  *   **Stop Gate (NO):** If **No**, the proposal is rejected. The Schedule protects names, not unnamed populations.
      *   *Action:* Return to proposer with instruction to secure taxonomic description first.
  *   **Value Hand-off:** If the population is ecologically real but lacks a name, the Panel records this as a **Legislative Gap**. The Panel cannot list it. This is a value judgement that *legal certainty* outweighs *biological reality* in this instance.

  **Q2. Does the type specimen fall within the geographic and morphological range of the population proposed for protection?**
  *   **Sufficient Answer:** Yes, the population matches the type, or the type is demonstrably part of the proposed unit.
  *   **Stop Gate (NO):** If **No** (e.g., the type represents a widespread cline and the proposal is for one endpoint), the proposal is rejected under the current name.
      *   *Action:* Recommend delisting of the existing name if it no longer denotes a discrete conservation unit, and invite a new proposal for the distinct endpoint under a new name.

  ### PHASE 2: EVIDENCE OF DISTINCTNESS
  *Supplier: Panel Taxonomist / Geneticist / Ecologist (Consensus)*

  **Q3. Is there evidence that the proposed taxon is distinguishable from sympatric or parapatric relatives?**
  *   **Sufficient Answer:** Yes. Evidence may be morphological (diagnostic traits), genetic (monophyly or diagnostic alleles), ecological (host specificity, phenology), or cytological (ploidy).
  *   **Stop Gate (NO):** If **No** (i.e., it is indistinguishable from a widespread, non-threatened taxon), the proposal is rejected. Protection cannot be enforced if the entity cannot be identified in the field or lab.

  **Q4. Do lines of evidence conflict? (e.g., Genetics suggests unity; Ecology suggests separation)**
  *   **Sufficient Answer:** A statement identifying the conflict.
  *   **Conflict Resolution Rule:**
      1.  **Reproductive Isolation** (complete or strong assortative mating) trumps Genetic Distance.
      2.  **Ecological Distinctness** (niche separation) trumps Morphological similarity *if* accompanied by evidence of selection.
      3.  **Genetic Monophyly** trumps Morphological similarity *only if* the genetic divergence indicates long-term independent evolution (>100k years or equivalent divergence rate).
      *   *Consistency Instruction:* The Written Reasons must state: *"Criterion X was decisive. Had Evidence Y been stronger/weaker, the decision would have flipped."*

  ### PHASE 3: THE STATUTORY PURPOSE (VALUE JUDGEMENT)
  *Supplier: Panel Chair (Vote of all 5 members)*
  *Note: This phase is triggered only if scientific evidence is equivocal (Shapes i, iii, iv).*

  **Q5. In cases of ambiguous divergence, which statutory purpose governs this decision?**
  *   **Option A (Lineage):** We protect separately evolving metapopulation lineages (Evolutionary Significant Units).
  *   **Option B (Function):** We protect ecological roles and processes (e.g., host-specific herbivores).
  *   **Option C (Organism):** We protect specific organisms from harm regardless of evolutionary status (e.g., charismatic or culturally significant populations).
  *   **Instruction:** The Panel must vote. The majority choice determines the threshold for listing in ambiguous cases.
  *   **Record:** This choice must be minuted as a **Policy Decision**, not a Scientific Finding.

  ### PHASE 4: HANDLING THE FIVE SHAPES
  *Supplier: Panel Ecologist / Geneticist*

  **Shape (i): Conflicting Evidence.**
  *   **Rule:** Apply Conflict Resolution Rule (Q4). If still tied, default to **Option A (Lineage)** unless the ecological function is critical (Option B).

  **Shape (ii): Hybridization.**
  *   **Rule:** Hybridization does not preclude listing. If forms remain phenotypically/ecologically distinct despite gene flow (stable hybrid zone or assortative mating), they are listable.
  *   **Threshold:** >80% assortative mating in nature OR fixed ecological separation.

  **Shape (iii): Incipient Divergence (Recent Separation).**
  *   **Rule:** **Provisional Listing.**
  *   **Term:** 5 Years.
  *   **Review Criteria:** To become permanent, the proposer must demonstrate: (a) Fixation of diagnostic alleles/traits, OR (b) Strengthening of reproductive barriers.
  *   **Failure:** If divergence stalls or reverses (reabsorption), the taxon is delisted.

  **Shape (iv): Asexual / Selfing.**
  *   **Rule:** The Biological Species Concept is inapplicable. Use the **Phylogenetic Species Concept**.
  *   **Threshold:** The lineage must be monophyletic and diagnosable by at least one fixed character (genetic or morphological).
  *   **Value Hand-off:** If clones are widespread but locally rare, protection depends on **Option C (Organism)**. Record this.

  **Shape (v): Names and Types.**
  *   **Rule:** See Phase 1. If the name covers a widespread cline, the Schedule cannot protect a single endpoint without taxonomic revision.
  *   **Action:** Panel recommends taxonomic revision to the scientific community; does not list until resolved.

  ### PHASE 5: FINAL THREAT ASSESSMENT
  *Supplier: Panel Ecologist*

  **Q6. Does the entity meet the threat criteria (rarity, decline, vulnerability)?**
  *   **Sufficient Answer:** Yes, supported by population data.
  *   **Stop Gate (NO):** If the entity is distinct but abundant and stable, it does not qualify for the Schedule (though it may qualify for other protections).
  *   **Note:** Distinctness is necessary but not sufficient.

  ---

  ## PART 2: TEMPLATE FOR PUBLISHED REASONS

  **DECISION NOTICE: PROPOSAL [ID NUMBER]**
  **TAXON:** *[Genus species]*
  **DATE:** [DD/MM/YYYY]

  **1. SUMMARY**
  The Panel [RECOMMENDS LISTING / REJECTS PROPOSAL / RECOMMENDS DELISTING].

  **2. EVIDENCE REVIEWED**
  *   Morphology: [Summary]
  *   Genetics: [Summary]
  *   Ecology/Distribution: [Summary]

  **3. APPLICATION OF PROCEDURE**
  *   **Nomenclatural Validity:** [Pass/Fail]. Type specimen status: [Confirmed/Disputed].
  *   **Distinctness:** [Pass/Fail]. Key diagnostic trait: [Trait].
  *   **Conflict Resolution:** [State if evidence conflicted]. Decisive Criterion: [e.g., Ecological Separation].
      *   *Consistency Note:* This aligns with Decision [ID Number] regarding [Other Taxon]. In that case, [Criterion] was also decisive.
  *   **Statutory Purpose (If applicable):** In resolving ambiguity, the Panel prioritized [Lineage/Function/Organism]. This is a policy determination under Section 5 of the Procedure.

  **4. SPECIAL CONDITIONS (If applicable)**
  *   [e.g., Provisional Listing for 5 years. Review due: Date.]
  *   [e.g., Listing contingent on taxonomic revision of Type.]

  **5. REASONS FOR DECISION**
  [Concise paragraph linking evidence to the statutory threshold.]

  **SIGNED:**
  Chair, Species Listing Panel
  Chief Scientist (Approval)

  ---

  ## PART 3: APPLICATION TO THREE CASES

  ### CASE 1: The Host-Associated Moth
  *   **Evidence:** Two forms, different hosts, pheromone diff, 90% assortative mating. Hybrids viable/fertile. Weak genome-wide diff, strong "islands" of divergence.
  *   **Procedure Run:**
      *   Q1 (Name): Pass (Assuming named).
      *   Q3 (Distinctness): Pass (Ecological & Behavioral).
      *   Q4 (Conflict): Genetics (weak) vs. Ecology (strong). **Rule:** Ecological distinctness + Assortative mating trumps weak genome-wide diff.
      *   Shape (iii) (Incipient): Divergence is recent and incomplete (hybrids fertile).
      *   **Decision:** **PROVISIONAL LISTING (5 Years).**
      *   **Reasoning:** Meets Shape (ii) and (iii). They are ecologically distinct and mating is strongly assortative, indicating active divergence. However, genomic integrity is not fixed.
      *   **Review:** In 5 years, require evidence of reduced hybrid fitness or fixation of diagnostic genomic islands.
      *   **Consistency:** Cites precedent where ecological isolation drove listing despite gene flow.

  ### CASE 2: The Diploid/Tetraploid Plant
  *   **Evidence:** Cytotypes indistinguishable morphologically. Shared pollinator. Crosses yield sterile triploids.
  *   **Procedure Run:**
      *   Q1 (Name): Pass (Assuming cytotypes are named or name covers both). *Critical Check:* If the name applies only to the diploid, the tetraploid cannot be listed under it without revision. Assuming names exist for both.
      *   Q3 (Distinctness): Pass (Cytological).
      *   Q4 (Conflict): None. Morphology same, but reproduction blocked.
      *   Shape (iv) (Asexual/Selfing analog): Polyploidy creates instant reproductive isolation (post-zygotic).
      *   **Decision:** **LIST (Permanent).**
      *   **Reasoning:** Cytological difference constitutes a complete post-zygotic barrier (sterile hybrids). They are separate evolutionary lineages (Shape ii/iv boundary). Morphological similarity is irrelevant under Conflict Rule (Reproductive Isolation trumps Morphology).
      *   **Consistency:** Aligns with standard treatment of polyploid complexes in [Previous Case ID].

  ### CASE 3: The Flagship (The Cline)
  *   **Evidence:** Protected for decades. Genomics show continuous cline. Type specimen is in the *middle* of the cline. "Flagship" population is at one end. Widespread/abundant overall.
  *   **Procedure Run:**
      *   Q1 (Name): **FAIL.** The name applies to the type. The type is in the middle of the cline. Therefore, the name applies to the *entire* widespread cline.
      *   Q2 (Type Match): **FAIL.** The "Flagship" population is not the taxon named in the Schedule. The taxon named in the Schedule is the widespread cline.
      *   Q6 (Threat): **FAIL.** The widespread cline is abundant. The "Flagship" endpoint is threatened, but it is not the legal entity.
      *   **Decision:** **RECOMMEND DELISTING.**
      *   **Reasoning:** The Schedule protects the name *[Species X]*. Taxonomic evidence demonstrates *[Species X]* is a widespread, abundant cline. The population currently receiving protection is merely one phenotypic extreme of that cline. To protect the extreme, a new taxonomic description is required. Continuing to list the current name protects a non-threatened entity (the cline) while failing to legally secure the threatened endpoint.
      *   **Value Hand-off:** This is not a value judgement; it is a nomenclatural constraint (Shape v).
      *   **Action:** Delist *[Species X]*. Issue guidance to land managers that the "Flagship population" remains a priority for *habitat* protection (SSSI/SAC) while a taxonomic revision is commissioned.

  ---

  ## PART 4: HONEST ASSESSMENT OF LIMITATIONS

  **1. Where the Procedure Will Misfire**
  *   **The Flagship Case (Political Reality):** The procedure demands delisting Case 3. This will cause public outcry, loss of donor confidence, and potential Ministerial override. The procedure cannot prevent the Minister from ignoring the advice, but it *does* expose the decision to Judicial Review. If the Minister lists it anyway, the Written Reasons must be falsified to match the Procedure, creating legal vulnerability. The procedure protects the *Panel*, not the *Species*, in this instance.
  *   **Asexuals (Shape iv):** The Phylogenetic Species Concept is arbitrary. How much genetic difference constitutes a "lineage"? The procedure says "monophyletic + diagnosable," but in bacteria or apomictic plants, every individual can be a clone. The Panel will still have to make arbitrary cut-offs. The procedure forces you to admit this is a **Value Judgement (Option C - Organism)**, but it does not solve the biological arbitrariness.
  *   **Provisional Listing Costs:** Shape (iii) allows provisional listing. If 40% of proposals are incipient species, the recovery budget will be consumed by monitoring reviews rather than active conservation. The procedure assumes budget elasticity that does not exist.

  **2. What the Procedure Cannot Settle**
  *   **Statutory Purpose:** The procedure forces you to choose (Lineage vs. Function vs. Organism), but it cannot tell you which choice is *correct*. That is a matter for Parliament, not the Panel. If the statute is silent, the Panel is effectively legislating. The "Value Hand-off" records this, but does not cure the democratic deficit.
  *   **The Name/Reality Gap:** As seen in Case 3, the law protects *words* (names), not *biology* (populations). The procedure can identify the mismatch, but it cannot fix it. It can only recommend delisting. It cannot create a new legal category for "Unnamed Threatened Populations."
  *   **Hybrid Swarms:** In Shape (ii), if hybridization increases due to human disturbance (e.g., habitat fragmentation bringing forms together), the procedure says "List if distinct." But if human action causes the collapse of distinctness, listing them separately may be biologically futile. The procedure treats the biology as static; it does not account for anthropogenic collapse of barriers.

  **3. Final Warning**
  This procedure prioritizes **legal defensibility** over **biological nuance**. It will prevent you from losing in court, but it will not always save the organism you want to save. In Case 3, it requires you to sacrifice the Flagship to preserve the integrity of the Schedule. If you are unwilling to do that, you must amend the Statute, not the Procedure.
