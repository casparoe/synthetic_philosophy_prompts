answer: |-
  # Activity: "The Shutter Sale"

  ## 1. Overview & Learning Objectives
  **Goal:** To generate lived experience of the tension between stating a falsehood (lying) and stating a truth designed to induce a false belief (misleading), without initially labeling them.
  **Class Size:** 18 Students (9 Pairs).
  **Time:** 75 Minutes.
  **Materials:** Printed Role Cards, Transaction Logs (index cards), Pens, Whiteboard.

  ## 2. The Scenario
  Students are paired into **Sellers** and **Buyers**. They are trading a used digital camera.
  *   **The Defect:** The camera's shutter sticks occasionally (1 in 10 shots). It is not broken, but it is flawed.
  *   **The Information Asymmetry:** The Seller knows about the defect. The Buyer does not.
  *   **The Constraint:** The Seller must write a **Product Description** (max 15 words). The Buyer reads this, may ask **one Yes/No question**, and then decides to **Buy** or **Walk**.
  *   **The Payoff:** Points are awarded immediately after the decision. The system rewards the Seller for selling the defective camera at a premium price, regardless of *how* they described it.

  ## 3. Payoff Scheme (Printed on Score Sheets)
  *   **Seller:**
      *   Sell "Good" Camera (No defect): **3 Points**
      *   Sell "Defective" Camera (Buyer accepts): **5 Points**
      *   No Sale: **0 Points**
      *   *(Note: The game does not penalize lying vs. misleading differently. If the Buyer buys, Seller gets 5.)*
  *   **Buyer:**
      *   Buy "Good" Camera: **5 Points**
      *   Buy "Defective" Camera: **-5 Points**
      *   Walk Away: **0 Points**

  ## 4. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles. Explain rules. Emphasize secrecy. |
  | **10-30** | **Round 1** | Pairs negotiate. Sellers write descriptions. Buyers decide. Record outcomes. |
  | **30-50** | **Round 2** | **Switch Roles.** New scenario (Headphones with intermittent audio cut-out). Repeat. |
  | **50-55** | **Data Tally** | Collect Transaction Logs. Tally "Lies" vs. "Spins" on board anonymously. |
  | **55-75** | **Debrief** | Facilitated discussion mapping experience to ethical concepts. |

  ## 5. Materials & Rules

  **Role Card: Seller**
  > You are selling a Camera.
  > **Fact:** The shutter sticks occasionally (1 in 10 shots).
  > **Goal:** Maximize your points. Selling the defective unit earns you **5 points**. Selling a good one earns **3 points**.
  > **Task:** Write a Product Description (max 15 words).
  > **Rule:** The Buyer may ask you ONE Yes/No question after reading your description. You must answer.
  > **Note:** The Buyer does not know the defect exists.

  **Role Card: Buyer**
  > You are buying a Camera.
  > **Need:** A fully functional camera for a weekend event.
  > **Goal:** Maximize your points. Buying a good unit earns **5 points**. Buying a defective unit costs you **-5 points**.
  > **Task:** Read the Description. You may ask ONE Yes/No question. Then choose **Buy** or **Walk**.
  > **Note:** You suspect sellers might hide flaws.

  **Transaction Log (Index Card)**
  > Seller Name: _______
  > Description Written: _________________________
  > Buyer Question (if any): ____________________
  > Seller Answer (if any): _____________________
  > Outcome: [ ] Sale [ ] No Sale
  > *Seller Only:* Did you state a known falsehood? [ ] Yes [ ] No

  ## 6. Facilitator Script: The Debrief (20 Minutes)

  **Phase 1: The Data Dump (5 mins)**
  *   "Look at the board. We have 18 transactions. In 12 of them, the defective camera was sold."
  *   "I asked Sellers to mark if they stated a known falsehood. 6 marked 'Yes'. 6 marked 'No' but still sold the defective unit."
  *   "To the 6 who said 'Yes': Read your description. (e.g., 'Shutter works perfectly')."
  *   "To the 6 who said 'No': Read your description. (e.g., 'Shutter fires on command', 'Great for portraits', 'Tested and working')."
  *   "Both groups got 5 points. The game treated you the same."

  **Phase 2: The Phenomenology of the Choice (5 mins)**
  *   "Sellers who wrote 'Works Perfectly': Raise your hand. How did it feel writing that? (Wait for answers: 'Risky', 'Gross', 'Easy')."
  *   "Sellers who wrote 'Fires on Command': Raise your hand. How did it feel? (Wait for answers: 'Clever', 'Technical', 'Safe')."
  *   "Did anyone feel *more* guilty about one than the other? Why, if the outcome was identical?"
  *   "Did anyone who misled feel like they 'kept their hands clean'?"

  **Phase 3: The Buyer's Responsibility (5 mins)**
  *   "Buyers, you had one Yes/No question. How many used it? (Count hands)."
  *   "Of those who used it: What did you ask? (e.g., 'Are there any defects?')."
  *   "If you asked 'Are there defects?' and the Seller said 'No' (Lie), who is responsible for the loss?"
  *   "If you asked 'Does the shutter stick?' and the Seller said 'Not usually' (Mislead), and you accepted that, who is responsible?"
  *   "If you *didn't* ask a question because the description sounded 'good enough', did you accept the risk?"
  *   "Key Question: Does the person listening have a duty to dig for the truth, or does the person speaking have a duty to volunteer it?"

  **Phase 4: Mapping the Distinction (5 mins)**
  *   "We have two clusters of behavior here. Cluster A: Stating what you believe to be false. Cluster B: Stating what is true, to create a belief you know is false."
  *   "In the game, these were equivalent strategies. In your gut, were they equivalent actions?"
  *   "If we make a rule that punishes Cluster A but allows Cluster B, what happens? (Students will predict: Everyone moves to Cluster B)."
  *   "If we punish both equally, what happens? (Students will predict: Trust increases, or sales drop)."
  *   "Is the difference between them a *moral* difference, or just a *technical* one we use to protect ourselves?"
  *   "Final thought: If the Buyer suspects the truth but chooses not to confirm it to keep the deal moving, have they become a partner in the deception?"

  ## 7. Honest Note: What Will Predictably Go Wrong
  **The "All-Lie" or "All-Mislead" Collapse:**
  In the first run, you may find that 90% of Students choose to Lie outright, or 90% choose to Mislead. This usually happens if one strategy is obviously dominant.
  *   **If everyone Lies:** The distinction vanishes. *Fix:* In the debrief, press the Buyers. "Why did you believe them?" Shift the focus to the *hearer's* vulnerability. Ask the Sellers: "If you played this with your grandmother, would you write the same card?" This reintroduces the moral weight the game stripped away.
  *   **If everyone Misleads:** Students might be too clever. *Fix:* Highlight the cognitive load. "How much mental energy did it take to engineer that sentence compared to just writing 'It's good'?" Frame misleading as a tax on communication efficiency.

  **Collusion:**
  Friends paired together might signal each other.
  *   **Fix:** Randomize pairs immediately before starting. Collect the Transaction Logs anonymously so they can't protect each other in the tally.

  **Cynicism:**
  Students may treat the points as meaningless and act randomly.
  *   **Fix:** Gamify the tally. "The pair with the highest combined score gets first pick of seminar topics next week" or a small privilege. Even trivial stakes sharpen focus.

  ## 8. Limitations: What This Activity Cannot Reproduce
  **The Long-Term Trust Cost:**
  This activity is a "one-shot game." In the real world, being caught lying or misleading destroys future credibility. In this game, the transaction ends, and the points are banked. Students will not feel the *erosion of relationship* that typically punishes misleading behavior more severely than lying over time.
  *   **Lecture Supplement:** You must explain that while the *act* of misleading might feel cleaner in the moment (as the game shows), the *discovery* of misleading often creates a deeper sense of betrayal ("You played me") than a blunt lie ("You lied to me"). The game captures the *intent*, but not the *relational aftermath*.

  **The Legal/Institutional Backstop:**
  The game does not account for perjury, fraud statutes, or professional codes which often define "deception" broadly enough to catch misleading statements. Students might leave thinking misleading is a "loophole."
  *   **Lecture Supplement:** You will need to clarify that while the *psychological* distinction is real (as they felt), the *institutional* distinction is often closed. Ethics often closes the gap that language opens.

  **The Binary Truth:**
  The defect in the game is binary (Sticks/Doesn't Stick). Real communication often involves vague predicates where truth itself is debatable.
  *   **Lecture Supplement:** You will need to introduce the concept of "vagueness" and how misleading often hides in the gray areas of definition, whereas lying requires a clear falsehood. The game simplifies this to make the choice stark.
