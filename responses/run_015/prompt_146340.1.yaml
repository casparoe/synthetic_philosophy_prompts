answer: |-
  The institutional split between maritime and automotive heritage reveals that legal identity is not derived from a single metaphysical truth but is a pragmatic construct tailored to the object's function and regulatory environment.

  **Implicit Metaphysics**
  The current practice presupposes **Institutional Conventionalism (Baptism)** supported by a heuristic of **Spatiotemporal Continuity**.
  *   **Ships:** The rule that a vessel remains itself despite total material turnover (provided the keel line and paperwork persist) rejects *Mereological Essentialism* (the idea that specific parts constitute identity). Instead, it treats the registration number and the continuous history of maintenance as the "soul" of the object. The "keel" acts not as a material essential, but as a symbolic anchor for spatiotemporal continuity—a physical thread ensuring the replacement process is gradual rather than abrupt reconstruction.
  *   **Cars:** Automotive law leans closer to *Mereological Essentialism* regarding the chassis/VIN. Because cars are mass-produced, fungible, and high-risk for theft/fraud, the law ties identity to a specific material component (the frame) to prevent "identity washing."

  **Underdetermination**
  The practice is **philosophically underdetermined**. It does not strictly need one theory to function.
  *   It is compatible with *Endurance Theory* if one posits the "registration" as the enduring substance.
  *   It is compatible with *Perdurantism* (Four-Dimensionalism) if the "world-line" of the ship is viewed as unbroken by the gradual replacement of parts.
  *   It is compatible with *Social Ontology* where the object exists only insofar as the collective intentionality of the registry sustains it.
  The law chooses the theory that best serves utility: maritime law prioritizes the preservation of *functioning history* (sailing ships), while vehicle law prioritizes *accountability and safety* (traceable parts).

  **Consistency with Other Domains**
  *   **Historic Buildings:** These align with **ships**. Under charters like Venice or Nara, a building can retain heritage status through significant material replacement if the location, design, and "spirit" remain continuous. The foundation acts like the keel; the address acts like the registration.
  *   **Aircraft:** These align with **cars**. Civil aviation authorities (FAA/EASA) tie identity to the fuselage/data plate. If the fuselage is destroyed or replaced, the aircraft is generally considered new or destroyed, regardless of paperwork, due to strict airworthiness and safety tracing.

  **Hypothetical Registry Rules**
  If a heritage registry were built on strict metaphysical grounds, the rules would change drastically:

  1.  **Pure Mereological Essentialism:**
      *   **Rule Change:** Identity is tied to the original material atoms.
      *   **Impact:** You could not replace a single plank on a ship or a bolt on a car without it becoming a replica. Museums would be forced to display rotting, non-functional originals. "Restoration" would be legally impossible; only "preservation" of decay would be permitted. The *USS Constitution* would cease to be the *USS Constitution* the moment the first original timber was swapped.

  2.  **Perdurantist Career-Path View:**
      *   **Rule Change:** Identity is the unbroken causal chain in spacetime.
      *   **Impact:** This would tighten the "paperwork" loophole. If a ship is scrapped and sits in a yard for 20 years before being "rebuilt" from plans, a perdurantist registry would declare it a new object because the spatiotemporal path of the *physical entity* was interrupted, even if the paperwork survived. It would forbid "paper continuity" without "physical continuity." Conversely, it might allow a car to retain identity if the *path* of ownership and location was unbroken, even if the chassis was swapped, provided the causal history was documented (which current law forbids).

  \answer{The institutional pattern presupposes Institutional Conventionalism (Baptism) backed by Spatiotemporal Continuity, rejecting Mereological Essentialism for ships while retaining it for cars. This practice is philosophically underdetermined, selecting metaphysics based on regulatory utility rather than ontological truth. It is consistent with historic buildings (ship-like) but inconsistent with aircraft (car-like). A registry based on pure Mereological Essentialism would forbid all part replacement, freezing objects in decay, while a Perdurantist registry would forbid identity survival through any gap in physical existence, invalidating paper-only continuity.}
