answer: |-
  # WORKSHOP PREP SHEET: Moral Residue & Genuine Dilemmas
  **Time:** 2 Weeks Out | **Room:** 15 Pax | **Stakes:** High

  ## STRATEGIC CONCESSIONS (First 5 Minutes)
  *Do not wait for these to be dragged out of you. State them in your intro or early replies to lower the temperature.*

  1.  **Concede Epistemic Dilemmas:** Explicitly distinguish your view from *uncertainty*. You are not arguing about cases where we don't know the right answer. You are arguing about cases where we know the costs and still owe residue.
      *   *Phrasing:* "I'm not talking about foggy cases where we don't know the best act. I'm talking about clear cases where the 'best' act still leaves a debt."
  2.  **Concede "Tragedy" isn't Required:** Acknowledge that not all dilemmas are life-and-death. Some are mundane. This disarms the Cultural Critics who think you're romanticizing tragedy.
      *   *Phrasing:* "This isn't about Sophocles. It's about promising to meet a student while your child needs the ER. Both happen in Tuesday afternoons."
  3.  **Concede Kantian Consistency is Ideal:** Acknowledge that a world without dilemmas would be *better*.
      *   *Phrasing:* "I agree a consistent moral law is the ideal. My claim is just that our actual normative landscape isn't that ideal."

  ---

  ## THE "MUST-LAND" REPLY
  **If you lose this, you lose the room.**
  **Topic:** The Standing Objection (Why is residue *owed* and not just nice?)
  **Who:** Everyone, but led by the Consequentialist and Metaethicists.

  **The Objection:** "Why is the apology *owed*? If I did the best available thing, haven't I discharged my duties? Isn't the 'residue' just me being nice to soothe hurt feelings?"

  **The Reply (2 Mins):**
  "Two points. First, look at the reactive attitudes. If I break your window to save a life, and I walk away without a word, you have standing to be angry. You can say, 'I know you had to, but you owe me an explanation.' If the duty were merely sentimental, your anger would be inappropriate—like being mad someone didn't buy you a gift. But it's not inappropriate. It's fitting.

  Second, the proportionality. The 'apology' isn't a generic 'sorry.' It's scaled to the harm. If I break a window, I fix the window. If I break a promise, I make restitution. That scaling tracks the *violated duty*, not my psychological state. If it were just me feeling bad, the intensity would track my sensitivity. It doesn't. It tracks the objective cost to you. That suggests the duty survives the justification. I was permitted to act, but I wasn't permitted to act *without cost*."

  **Soft Spot:** You are relying on intuitions about "standing." If they deny the intuition (e.g., "No, you don't have standing if it was the best act"), you have no lever.
  **Force:** **HIGH.** This is the core of your thesis.

  ---

  ## WAVE 1: THE FRAMEWORK (Senior Kantian & Metaethicists)
  *These will come early to test the coherence of the view.*

  ### 1. The Senior Kantian (Ought Implies Can)
  **The Objection:** "You say agglomeration fails. But if I ought to do A and ought to do B, and I cannot do both, you have posited a contradiction in the moral law. 'Ought implies Can.' If I can't do both, I couldn't have been under both obligations. Your 'residue' is just guilt masquerading as a duty. Why isn't this just a maxim-conflict where one duty extinguishes the other?"

  **The Reply:**
  "I'm not claiming the *moral law* is contradictory. I'm claiming the *situation* presents conflicting claims that the law cannot fully adjudicate without remainder. Think of 'Ought implies Can' as applying to *all-things-considered* action. I ought, all-things-considered, to save the life. But that 'all-things-considered' ought doesn't erase the specific claim the window-owner had on me. The residue is the trace of that erased specific claim. If the duty were truly extinguished, there would be no trace. The fact that there is a trace shows the obligation wasn't fully cancelled, only overridden. We can keep 'Ought implies Can' for the final action, without denying the reality of the overridden claim."

  **Soft Spot:** Hard incompatibility with strict Kantianism. They may simply reject "overridden but real."
  **Force:** **HIGH.** They will not let this go.
  **Noise Check:** If they start talking about "Kingdom of Ends," pivot back to the specific case.

  ### 2. The Metaethicists (Substantive vs. Terminological)
  **The Objection:** "Are you actually disagreeing with the denial of dilemmas, or just defining 'dilemma' differently? If a consequentialist says 'There's one best act,' and you say 'There's one best act + residue,' isn't this just a verbal dispute about whether 'dilemma' includes the aftermath?"

  **The Reply:**
  "It's substantive because it changes the normative guidance. If it's just a verbal dispute, then advising an agent is the same on both views. But on the 'no dilemma' view, I tell the agent: 'Do the best act, then move on.' On my view, I tell them: 'Do the best act, then prepare to make restitution.' The practical output differs. The 'no dilemma' view says the debt is cleared. My view says the debt is transformed. That's not terminology; that's a difference in what the agent is required to do next Tuesday."

  **Soft Spot:** They might argue the "restitution" is just a new consequentialist calculation.
  **Force:** **MED-HIGH.** Needs to be shut down early so you can talk norms.

  ---

  ## WAVE 2: THE NORMATIVE MECHANICS (Consequentialist & Legal)
  *These will try to dissolve the residue into something else.*

  ### 3. The Consequentialist (Expected Value)
  **The Objection:** "Incommensurability is a measurement artifact. There is always a determinately best act. Your 'residue' is just the expected value of repairing the relationship to maximize future utility. Why posit a 'moral remainder' when 'investment in future cooperation' explains the data?"

  **The Reply:**
  "Because the timing and target don't fit utility. I owe the apology *now*, to *this* person, even if they never speak to me again and future utility is zero. If I break a promise to a dying man, and he dies, there is no future cooperation to invest in. Yet I still owe it to his memory to apologize. If residue were just a hedge for future value, it would vanish when the future value vanishes. It doesn't. It persists even when it's 'inefficient.'"

  **Soft Spot:** They will argue about "general rule utility."
  **Force:** **MED.** They won't convert, but you need to show they can't explain the data.

  ### 4. The Legal Theorist (Doctrine vs. Morality)
  **The Objection:** "Criminal law handles this with Necessity and Duress. We say the act is justified, maybe excused, but we don't posit conflicting obligations. What does your 'residue' buy that the justification/excuse distinction doesn't? Why do we need ontology when we have doctrine?"

  **The Reply:**
  "Doctrine manages liability; morality manages relationships. The law says 'You won't go to prison.' It doesn't say 'You don't owe me anything.' If I trespass to save a life, the law says I'm not liable for damages (sometimes). But morally, I still owe the homeowner an explanation and to fix the lock. If we rely only on doctrine, we tell the agent they are 'in the clear.' My view tells them they are 'in the debt.' That prevents moral complacency. Doctrine clears the ledger; residue says the ledger has a footnote that matters."

  **Soft Spot:** Legal theorists love to point out where law *does* require compensation (e.g., eminent domain). Be careful not to overstate the law.
  **Force:** **MED.** Good chance to show practical upshot.

  ---

  ## WAVE 3: THE SCOPE (Cultural Critics)
  *These will come late if they feel the view is too Western/Individualist.*

  ### 5. The Cultural Critic (Universality)
  **The Objection:** "This 'agent-regret' and 'standing to demand apology' sounds very Western, individualist, and guilt-based. Does this generalize to care-ethics or non-Western frameworks where the focus is on restoring harmony rather than individual debt?"

  **The Reply:**
  "I think it generalizes precisely because it's about relationship repair, not just individual guilt. In a harmony-based framework, the 'residue' is the disruption to the harmony that persists even after the necessary act. The duty to restore harmony *is* the residue. The specific vocabulary of 'apology' might change, but the structural claim holds: a necessary violation leaves a tear in the social fabric that must be mended. The 'debt' isn't to a legalistic code, but to the relationship itself."

  **Soft Spot:** If you haven't read up on specific non-Western examples, don't bluff.
  **Force:** **LOW-MED.** Often a "check-the-box" question in these rooms.

  ---

  ## THE "PRAYER" QUESTION
  **The one that kills the argument if you don't have an answer.**

  **The Question:** "Is the residue a remnant of the *original* violated duty, or is it a *new* duty generated by the infringement?"

  **Why it kills you:**
  *   If you say **Original**: The Kantian says "Impossible, the duty was overridden."
  *   If you say **New**: The Consequentialist says "Then there was no dilemma! There was just Duty A (save life) and Duty B (apologize for breaking window). You satisfied both. Agglomeration holds."

  **The Survival Reply:**
  "It's a hybrid. It's a new *token* duty triggered by the violation of an old *type* duty. The *content* of the residue (fix the window) is determined by the original duty (don't break property). So the original duty isn't irrelevant (it sets the terms of the debt), but it isn't fully live (it didn't forbid the act). This is why agglomeration fails: you couldn't satisfy the original prohibition, but you must satisfy the derivative restitution. The dilemma is real because the prohibition was real, even if it was overridable."

  **Warning:** This is the hardest philosophical tightrope. Practice this until it sounds natural. If you stumble here, the "dilemma" dissolves into a sequence of non-conflicting duties.

  ---

  ## GENERAL TACTICAL NOTES
  *   **Don't fight the Kantian on Logic:** Don't argue that contradictions are okay. Argue that the *phenomenology* of the remainder proves the conflict was real, even if the logic is messy.
  *   **Use the Grad Students:** They want to be helpful. If you get stuck on a definition, ask: "How would you model the standing claim in your framework?"
  *   **Watch the Clock:** If the Consequentialist gets going, cut them off politely. "I think we agree on the math, we disagree on the ontology. Let's move to..."
  *   **Body Language:** When the Senior Kantian speaks, lean in. When the Legal Theorist speaks, nod. Show you respect the domain, even if you reject the reduction.

  **Final Prep:** Read Williams' "Moral Luck" (Agent Regret sections) one more time. You will be quoted against it. Know exactly where you diverge. Good luck.
