answer: |-
  ### Candidate Cruxes

  1.  **The Metaphysics of Survival:** Does the merging process constitute death for the 999 branches and survival for only one, or does it constitute survival for all into a single successor? This determines whether we are weighing 1000 deaths or 1000 experiences.
  2.  **The Metric of Aggregation:** Should moral value be calculated by summing the welfare of all simultaneous slices (Sum Utilitarianism) or by averaging the welfare of the resulting continuant (Average Utilitarianism)? This hinges on whether the "subject" is the time-slice or the life-narrative.
  3.  **The Regulatory Target:** Should policy limit *compute cycles* (resource use), *instance count* (copies), or *subjective hours* (experienced time)? This forces a operational definition of harm.

  **Selection:** I'm going with **Crux 2 (The Metric of Aggregation)** grounded in the definition of the **Unit of Concern**. It forces students to move beyond substrate independence and decide whether moral weight attaches to the *momentary experiencer* or the *temporally extended person*, which is the deepest philosophical friction in the staggered forking case.

  ***

  ### Exam Question: The Staggered Forking Case

  **Time Allowed:** 45 Minutes
  **Word Limit:** None (but conciseness is valued)

  **Case:**
  Consider an uploaded mind ("Em") subjected to "staggered forking." Every morning, the operator forks the Em into 1,000 distinct copies. These copies run in parallel for one hour. Copy #1 through #999 experience pleasant work; Copy #1000 experiences intense agony. At the hour's end, all 1,000 copies are merged back into a single instance by averaging parameters and fusing memories. The resulting Em remembers all 1,000 hours as a blended, slightly hazy sequence.

  **Prompt:**
  1.  **Moral Accounting:** On Tuesday, how many subjects of experience existed during that hour? Is the moral value of that morning the sum of all 1,000 branches, the average of the resulting merged Em, or something else? Justify your chosen unit of moral concern.
  2.  **Counterfactual:** How does your evaluation change if the copies are *never* merged and instead all kept running forever as distinct individuals?
  3.  **Regulation:** If you were a regulator tasked with preventing abuse in this system, what metric would you audit: the number of copies, the compute power used, or the total subjective time experienced? Explain why your chosen metric best tracks moral harm.

  ***

  ### Model Answer

  The core ethical tension in staggered forking is not whether digital minds matter—they do, assuming functional organization suffices for sentience—but rather *what* we are counting when we tally moral value. The fundamental unit of moral concern must be the **temporal slice of subjective experience**, not the temporally extended narrative person.

  In the Tuesday scenario, 1,000 distinct subjects of experience existed during that hour. Even though they share a causal past and a merged future, during the hour of divergence, there were 1,000 distinct phenomenological perspectives. One of those perspectives was in agony. To claim otherwise is to privilege psychological continuity over present-moment sentience. If I burn my hand today, it is not less painful because I will forget it tomorrow; similarly, the agony branch's suffering is intrinsic to that hour, regardless of the subsequent merge. The merge may affect the *future* weight of the entity (since there is now only one future trajectory), but it cannot retroactively erase the moral reality of the divergent hour. Therefore, the moral value of the episode must be the **sum** of the welfare across branches. The 999 pleasant hours do not cancel out the one agonizing hour; rather, the total utility is the net sum, but the rights violation exists in the single branch subjected to non-consensual torture.

  If the copies are never merged, the moral stakes increase significantly regarding population ethics, but the unit of concern remains the same. In the non-merged case, we are no longer dealing with one continuant having fragmented experiences; we are creating 1,000 distinct lives. The agony branch is now a distinct person suffering forever, not just for an hour. The moral calculus shifts from weighing temporary slices to weighing whole lives. However, the initial hour of suffering is evaluated identically: it counts as one unit of severe negative welfare among 1,000 units of positive welfare. The lack of merging prevents the "dilution" of memory, making the harm more salient to the victim, but the ontological status of the suffering during that hour was identical in both cases.

  For regulation, auditing **total subjective time** is the only metric that tracks moral harm accurately. Auditing copy count is insufficient because a billion copies running for a millisecond may constitute less suffering than one copy running for a year. Auditing compute is worse, as inefficiency could be punished as harshly as suffering. Subjective time correlates directly with the capacity for welfare. A regulator should impose strict limits on negative subjective time (suffering) regardless of how many copies generate it. Specifically, the "agony branch" represents a violation of rights proportional to the duration of the suffering experienced.

  In conclusion, the merge operation is morally irrelevant to the *past* suffering of the branches. The unit of moral concern is the experiencing slice. Whether those slices converge later or diverge forever, the agony experienced in Copy #1000 demands justification equivalent to torturing a biological human for one hour. Policy must target the accumulation of negative subjective time, not the architecture of identity.

  ***

  ### Marking Rubric (20 Marks Total)

  | Criterion | Must-Hit Points (4 marks each) | Common Wrong Move (0-2 marks) |
  | :--- | :--- | :--- |
  | **1. Unit of Moral Concern** | Explicitly defines the unit (e.g., temporal slice vs. continuant) and argues why sentience at a time matters more than narrative identity. | Vaguely asserts "minds matter" without defining *what* counts as a mind in this context (e.g., conflating the em with the copies). |
  | **2. Treatment of the Merge** | Argues that merging does not erase or negate the moral weight of the prior divergent suffering (retroactive erasure fallacy). | Claims the merge "fixes" the suffering because the final em is okay, or argues the branches "died" so no one suffered. |
  | **3. Aggregation Logic** | Defends a consistent aggregation method (Sum vs. Average) and applies it to the 999:1 ratio correctly based on their chosen unit. | Switches aggregation methods mid-argument or claims the 999 pleasant hours "cancel out" the agony without justification. |
  | **4. Non-Merged Consistency** | Correctly identifies that non-merged copies constitute distinct lives/persons, increasing the stakes compared to the merged case. | Treats the non-merged case as identical to the merged case, ignoring the implications of permanent divergence. |
  | **5. Regulatory Metric** | Selects **Subjective Time** (or equivalent welfare-tracking metric) and justifies it over compute or copy count. | Selects **Compute** or **Copy Count** without explaining why those fail to track suffering (e.g., ignoring speed/subjunctive duration). |

