      *   *Prop 5 (Internal Exploitation):* Introduces a nuance about distribution of *burden* vs. distribution of *reward*. Challenges Prop 4 slightly.
      *   *Prop 6 (Natural Boredom):* Distinguishes structural alienation from psychological/physiological boredom. Challenges the idea that *all* dissatisfaction is political.

