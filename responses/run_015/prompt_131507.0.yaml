          *   If alienation is *only* opacity, then boredom without opacity isn't alienation. Prop 6 agrees with this distinction. *Wait, actually they align.* Prop 2 defines alienation specifically as opacity. Prop 6 says boredom is different. So these are consistent *if* we accept the narrow definition of alienation.
