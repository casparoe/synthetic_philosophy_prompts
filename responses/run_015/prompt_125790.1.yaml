      *   **Proposed Framework: Tiered Reporting:** This is the core recommendation.
          *   Tier 1: Measurable Risk (use 90% CI).
          *   Tier 2: Genuine Uncertainty (use Weight-of-Argument Appendix).
          *   Define the Appendix requirements (evidential breadth, analogical support, vulnerability).
      *   **Accountability Mechanism:** How to ensure Tier 2 isn't just fluff. (Review committees, consistency checks).
      *   **Implementation Schedule:** Phased rollout over two budget cycles.
