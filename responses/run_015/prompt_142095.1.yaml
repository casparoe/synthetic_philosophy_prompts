answer: |-
  Here is a complete session plan designed to fit your 90-minute window, using your constraints and wrinkles to force the philosophical tension without you having to lecture.

  # Session Title: "The Tunnel Allocation"

  ### Materials Needed
  *   **Index Cards:** 3 colors (White, Blue, Red).
  *   **Pens:** Enough for everyone.
  *   **Tokens:** 30-ish identical small objects (beer mats, bottle caps, coins, or just tick marks on a whiteboard).
  *   **Dice/Coin:** For randomization.
  *   **Whiteboard:** To track scores and "Available Actions."
  *   **Printed Scenario Sheet:** (You can handwrite 6 copies of the text below).

  ### The Stakes (The "Book Token" Economy)
  To give the choices bite without money:
  1.  Everyone starts with **3 Life Tokens**.
  2.  At the end of the night, the person with the most tokens chooses next month's book (and gets a "free drink" voucher if you're feeling generous, or just bragging rights).
  3.  **How to earn/lose:** In each round, anyone assigned to be a "Victim" must wager 1 Token. If their group is saved, they get their token back + 1 bonus from the pot. If their group is not saved, they lose the token.
  4.  **Rescuers** (those not at risk) do not wager, but they *will* be Victims in subsequent rounds. This ensures everyone feels the vulnerability eventually.

  ---

  ### Phase 1: Setup & Fencing (5 Minutes)
  **Goal:** Establish the abstract scenario and block side-issues immediately.

  1.  **Hand out the Scenario Sheet:** Do not explain it verbally. Let them read this standard text:
      > *You are the Rescue Committee. A collapse has trapped people in two tunnels. You have enough resources to clear only one tunnel before the air runs out.*
      > *   **Group A** and **Group B** are strangers to each other and to you.*
      > *   **Medical Need:** Identical. All will die without help; all will survive fully with help.*
      > *   **Fault:** No one caused the collapse. No one is a lifeguard on duty.*
      > *   **Constraint:** You cannot split resources. It is All A or All B (or a Randomized Chance).*
  2.  **Write on Whiteboard:** "Available Actions: 1. Save Group A. 2. Save Group B. 3. Randomize (Dice/Coin)."
  3.  **Rule:** "Discussion must be about *which action to take*, not *who the people are*. You have no info on age, job, or morality."

  ### Phase 2: Round 1 — The Intuition Pump (15 Minutes)
  **Goal:** Establish the baseline "Save the Many" intuition and let them feel the stakes.

  1.  **Assign Roles:** Draw names from a hat.
      *   **1 Person** = Group A (The One).
      *   **5 People** = Group B (The Many).
      *   **Rest** = Rescue Committee.
  2.  **Wager:** The 6 Victims place 1 Token each in the center.
  3.  **Deliberation (5 mins):** The Committee decides. (Predictably, they will vote to save the 5).
  4.  **Resolution:** Pay out tokens.
  5.  **Rotate:** Shuffle names. New 1 vs New 5.
  6.  **Deliberation (5 mins):** Let them do it again.
  7.  **Resolution:** Pay out tokens.
      *   *Facilitator Note:* Say nothing about *why* they chose what they chose. Just act as the banker. If someone says "Well, obviously 5 is more than 1," just nod and mark the tokens.

  ### Phase 3: Round 2 — The Procedure Wrinkle (25 Minutes)
  **Goal:** Introduce your first wrinkle. Force a conflict between *Outcome* (saving lives) and *Process* (respecting wishes).

  1.  **Assign Roles:** New 1 vs New 5. (Rest are Committee).
  2.  **The Twist:** Before deliberation, hand out **Secret Principle Cards** to the Victims only.
      *   **Card Type X (Utilitarian):** "I consent only to the rule: *Save the Greatest Number*."
      *   **Card Type Y (Egalitarian):** "I consent only to the rule: *Give Each Individual an Equal Chance*."
  3.  **Distribution:**
      *   **The One** draws **Card X** (They want the math to win, even if it kills them).
      *   **The Five** each draw **Card Y** (They want a coin flip, refusing to be aggregated).
      *   *(Note: This creates the specific friction you wanted: The One pleads for the Many's life on principle; the Many demand a lottery.)*
  4.  **Reveal:** Victims read their cards aloud to the Committee.
  5.  **Deliberation (10 mins):** The Committee must decide.
      *   If they **Save the Five**: They honor the Five's cards, but violate the One's explicit instruction.
      *   If they **Flip a Coin**: They honor the Five's cards, but violate the One's instruction (and likely result in more deaths).
      *   If they **Save the One**: They honor the One's card, but violate the Five's instructions and let 5 die.
  6.  **Resolution:** Pay tokens.
  7.  **Mini-Debrief (5 mins):** Ask only: "Did anyone feel more uncomfortable making this decision than Round 1? Why?" (Don't answer, just collect the feeling).

  ### Phase 4: Round 3 — The Waiver Wrinkle (15 Minutes)
  **Goal:** Test if the value is in the *lives* or the *claims*.

  1.  **Assign Roles:** New 1 vs New 5.
  2.  **The Twist:** After the victims are identified, give the **Five** a chance to **Waive**.
      *   Hand each of the Five a Red Card. They can choose to turn it face up ("I Waive My Claim") or keep it face down ("I Assert My Claim").
      *   They can discuss this among themselves for 2 minutes *without* the Committee.
  3.  **Scenario:** Suppose 4 of the 5 waive. Only 1 of the Many remains asserting a claim. It is now effectively 1 (The One) vs 1 (The Remaining Many).
  4.  **Deliberation (5 mins):** Does the Committee save the One? Save the Remaining Many? Flip?
  5.  **Resolution:** Pay tokens.
      *   *Crucial Mechanic:* If the Committee saves the One, the 4 who waived *still die* (physically), but they didn't assert a claim.
  6.  **Mini-Debrief (5 mins):** Ask: "Did the waivers make it easier to decide? If the 4 waiving still die, did their waiver matter?"

  ### Phase 5: The Debrief & Mapping (30 Minutes)
  **Goal:** Connect the game mechanics to the philosophy you've been chewing on. This is where you finally speak your piece, but mapped to their experience.

  **Step 1: The Numbers (Round 1)**
  *   **Ask:** "In Round 1, did anyone seriously argue for saving the One?"
  *   **Map:** "My flatmate says 5 deaths is worse than 1, 'of course.' In the game, that felt obvious. But was it a *moral* reason or just *math*? If we were just moving furniture, we'd move the smaller pile. Did we treat the people like furniture?"

  **Step 2: The Procedure (Round 2)**
  *   **Ask:** "When the One asked you to save the Five, but the Five demanded a coin flip... what did you owe them? The outcome they wanted, or the process they asked for?"
  *   **Map:** "This is the gap I can't close. If morality is about *results*, you save the Five. If morality is about *respecting each person individually*, can you just add them up? The Five said 'I am not a number, I am a person with a claim to a chance.' The One said 'I am a person who accepts the math.' Who was the Committee allowed to listen to?"

  **Step 3: The Waivers (Round 3)**
  *   **Ask:** "When 4 of the 5 waived, did the problem become 1-vs-1? Or was it still 1-vs-5 because 4 bodies still die?"
  *   **Map:** "If the number was the only thing that mattered, the waivers shouldn't change the math. 5 deaths is still 5 deaths. But if it felt easier to save the One after the waivers, then it wasn't about the *deaths*. It was about the *claims*. It suggests the 'weight' comes from people demanding to be saved, not just from their breathing bodies."

  **Step 4: The "Missing Piece" (Your Turn)**
  *   **Say:** "Here is where I get stuck, and why I wanted to play this out. If we flip a coin to be fair to the One, we are guaranteeing more death. We are trading *lives* for *fairness*. Is that a trade we are allowed to make? The game shows us that 'Save the Many' isn't a simple fact. It's a choice to prioritize the *Total* over the *Individual*. I don't know if that's right, but I know now it's not 'obvious'."

  ---

  ### Predicted Failure Points (And How to Handle Them)

  **1. The "Majority Vote" Shortcut**
  *   **The Risk:** In Round 1 or 2, someone says, "Let's just vote on it," and the Committee votes 10-4 to save the Five. This bypasses the moral reasoning.
  *   **The Fix:** In the Intro, state: "The Committee must issue a *unanimous recommendation* to the Chief Rescuer (you, the facilitator, or a rotating role). If you can't agree, you must Flip." This forces them to argue until they find a shared principle, rather than out-voting the minority.
  *   **Alternative Fix:** If they vote anyway, call it out in the debrief. "You voted. That means you decided the *Committee's* preference mattered more than the *Victims'* claims. Is that the rule we want?"

  **2. The "Fake Stakes" Objection**
  *   **The Risk:** Someone says, "This is silly, it's just beer mats. In real life I'd save the five."
  *   **The Fix:** Agree with them immediately. "Exactly. The tokens are fake. The *hesitation* you felt in Round 2 was real. We aren't testing your bravery; we're testing your logic. Why did the logic get harder when the cards were introduced, even though the stakes were the same?"

  **3. The "Side-Issue" Creep**
  *   **The Risk:** "But what if the One is a cancer researcher?"
  *   **The Fix:** Do not argue. Point to the Scenario Sheet. "The sheet says 'Identical Need, Strangers.' If you add info that isn't there, you're playing a different game. Stick to the text."

  ### What The Game Cannot Do (Your Honest Wrap-Up)
  You must admit this at the very end. The game simulates *choice*, but it cannot simulate *responsibility*.
  *   **Say:** "In this game, if you choose wrong, you lose a beer mat. In reality, if you choose the One, five families grieve. The game can't make you feel that guilt. So, if you felt 'Save the Many' was obvious in Round 1, that might be because the cost of being wrong was too low. The philosophy question is: Does the 'obviousness' survive when the cost is real? I don't know. But tonight showed me that 'counting heads' isn't the only thing happening in our heads."

  ### Why This Works for Your Group
  1.  **It hides the theory:** They think they are playing a resource allocation game.
  2.  **It uses your wrinkles:** The Procedure Cards force the "Fairness vs. Aggregation" conflict without you naming it. The Waivers force the "Claims vs. Outcomes" conflict.
  3.  **It respects the time:** 90 minutes is tight, but by keeping the rounds structured and the debrief focused on *their* choices, you avoid the "endless pub debate" loop.
  4.  **It protects you:** You aren't arguing for the One or the Many. You are just the Banker and the Referee. The *game* argues for you.
