answer: |-
  The position stated
  The standard rationalist dictum—that sunk costs are irrelevant to future choice—fails when prior expenditure generates non-fungible commitment capital. I argue that honoring sunk costs is rational when discontinuity destroys path-dependent structures essential for intertemporal consistency and credible signaling. In collaborative contexts, past investment is not merely spent resource but embedded coordination. Abandoning a project because future marginal benefits appear lower than a fresh start ignores the hidden costs of restructuring trust and protocol. Thus, sunk costs serve as a heuristic for preserving the integrity of long-term plans against myopic optimization.

  The conceptual distinction
  Resource capital is fungible wealth convertible across contexts; its expenditure reduces liquidity but leaves future optionality intact. Commitment capital is path-dependent value accrued through specific historical actions. It exists only insofar as the agent remains on the current trajectory. Unlike resources, commitment capital cannot be liquidated; it is realized only through continuation. It functions as a binding mechanism, solving coordination problems by making deviation costly. Treating commitment capital as sunk resource capital is a category error: one measures stock, the other measures structural integrity. Ignoring this distinction collapses the temporal depth of agency into a series of disconnected instantaneous optimizations, mistaking the glue of cooperation for spent fuel. Resource capital buys options; commitment capital buys consistency. Conflating them leads agents to liquidate structural integrity for short-term liquidity, failing to recognize that some value exists only in the refusal to restart.

  Core argument applied to the scenario
  Consider the collaborative research program. The withdrawn funding leaves behind calibrated instruments and shared protocols. A naive forward-looking analysis compares the cost of finishing versus starting a new project elsewhere with new funding. If the new project's direct costs are lower, standard theory dictates abandonment. However, this ignores the commitment capital embedded in the team's trust network and procedural fluency. Abandoning the current path signals unreliability to remaining partners, increasing the risk premium on future collaborations. This creates a group-level analogue to hyperbolic discounting: the team disproportionately values the immediate relief of cutting losses over the long-term stability of their cooperative reputation. Just as an individual oversamples present pleasure against future health, the group oversamples present liquidity against future coordinative capacity.
  The restructuring costs are not just financial but social—the dissolution of tacit knowledge networks. The calibrated instruments are useless without the specific expertise developed to run them. Continuing the program honors the sunk cost not because the money matters, but because the history matters. The prior investment created a specific equilibrium of expectations. Breaking it resets coordination costs to zero. Therefore, continuing is rational if the preservation of commitment capital outweighs the direct efficiency gains of relocation, because the latter calculation systematically underestimates the friction of rebuilding trust and protocol alignment from scratch. The sunk cost acts as a Schelling point; abandoning it requires renegotiating the entire collaborative framework, a transaction cost invisible to marginal analysis. Rationality here demands weighting the survival of the commitment structure higher than the marginal efficiency of a fresh start, preventing the group from cannibalizing its own long-term viability for short-term balance-sheet optimization.

  Strongest objection and reply
  The strongest objection is that commitment capital is merely a sophisticated label for loss aversion or escalation of commitment bias. Critics argue that any appeal to past investment disguises an irrational emotional attachment to wasted resources. If the future utility truly is lower, clinging to the past is pathological. However, this objection assumes perfect information regarding restructuring costs. My reply is that commitment capital is observable via signaling effects, not just internal feelings. If abandoning the project causes partner withdrawal elsewhere, the cost is real, not psychological. The bias lies in the standard model's failure to price relational friction, not in the agent's adherence to past paths. Distinguishing genuine commitment capital from mere stubbornness requires verifying that the discontinuity itself incurs independent penalties. If the cost of switching is purely internal regret, it is irrational; if the cost is external reputational damage or lost protocol efficiency, it is rational commitment maintenance. The value lies in the external constraint, not internal sentiment.

  What would change my mind
  I would reject this framing if it could be demonstrated that commitment capital is always reducible to discounted future cash flows without residual path-dependence. If every instance of trust or protocol could be perfectly replicated or purchased anew at market rates, the distinction collapses. My reasoning is most vulnerable regarding the measurability of these costs; if commitment capital cannot be quantified ex-ante, it risks becoming an unfalsifiable shield for bad decisions. Without clear metrics to distinguish valuable commitment from sunk-cost fallacy, the theory risks prescribing persistence in failing ventures under the guise of structural integrity. Ex-post rationalization is the primary risk.
