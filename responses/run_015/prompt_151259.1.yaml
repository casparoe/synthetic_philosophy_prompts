      *(Self-Correction during drafting)*: I need to make sure I don't just agree with the user. I need to push back slightly or deepen their insight. The user thinks it's "different questions." I should argue it's "different questions *plus* a hidden normative stake." The economist isn't just wrong; he's raising a debunking challenge that the honor camp tries to sidestep.

      *Revised Plan:*
      1.  Validate the "different questions" hunch but elevate it to a "Genealogy vs. Vindication" conflict.
      2.  Address the Honor/Vindication fork directly (it guts strong rationalism but saves pragmatic realism).
      3.  Prescribe a specific methodological shift (process tracing + negative cases).
      4.  Give permission to dissolve the "What *really* ended it" framing.

  11. **Final Review against constraints:**
