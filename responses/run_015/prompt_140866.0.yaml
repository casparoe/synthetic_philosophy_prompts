  Three established notions sit nearby. First, *Costly Signaling Theory* posits that honest signals must be expensive to produce, preventing low-quality imposters from faking them. Pain is costly; therefore, it is trusted. Second, the *Uncanny Valley* hypothesis suggests that near-perfect imitations of humans trigger revulsion because they hint at artifice without achieving life. This covers the visceral reaction to something almost real. Third, the distinction between *Symptoms and Signals* in medicine and ethology. A symptom is an involuntary byproduct of a state; a signal is a voluntary communication. Observers trust symptoms more because they cannot be easily decoupled from the cause. Finally, there is *Dramatic Irony* in performance studies, where the audience's knowledge of the actor's craft undermines the character's reality. These concepts collectively address cost, resemblance, voluntariness, and context. They suggest that trust relies on the inability to fake, the proximity to life, the lack of choice, or the suspension of disbelief. Your problem touches all four but fits none exactly, as it concerns the *structure* of the signal rather than its cost, appearance, or voluntariness alone.

  3. **Where each falls short**
  Costly Signaling fails because it treats cost as a physical resource. Your regress shows cost can be simulated. If a system is programmed to burn energy to cry, signaling theory says it should work. You observe it does not. The Uncanny Valley is sensory, not structural; it explains why a fake face creeps us out, not why a well-paced sentence feels false. The Symptom/Signal distinction is binary, but you are describing a spectrum of *mediation*. A signal can be voluntary yet trusted if it feels urgent. The real gap is that existing theories assume the observer is checking for *capacity to fake*. You are describing an observer checking for *absence of design*. They aren't looking for cost; they are looking for waste. A designed cost is still efficient relative to its goal. Genuine distress is inefficient relative to communication; it prioritizes the state over the message. Existing concepts miss this distinction between *instrumental efficiency* and *expressive leakage*. They explain why we distrust cheap fakes, not why we distrust expensive, well-crafted truths.

  4. **A name and a definition**
  I will name this **The Efficiency Paradox of Authenticity**. It is defined as the cognitive bias wherein observers equate the structural inefficiency of an emotional signal with its veracity. It obtains when an expression is perceived as having been optimized for a receiver rather than generated by a state. The mechanism is the inference of a *secondary agent*. If the signal is shaped, a shaper is implied. If the shaper is distinct from the feeler, the feeler's priority is questioned. It does not obtain in high-stakes immediate physical danger, where a scream is trusted even if loud and clear, because the biological cost is undeniable. It specifically targets *narrative* or *rhetorical* shaping. The paradox is that truth-telling requires a lack of craft. To be believed, the signal must appear to resist the sender's own intent to communicate. It is not about the signal being false, but about it being *too usable*. When pain becomes useful to the observer, it ceases to be pain and becomes a product.

  5. **Boundary cases**
  First, *Engineered Cost*: A system designed to drain resources when distressed. This is outside the phenomenon. The cost is instrumental, a means to convince. The observer sees the logic: "It breaks to persuade me." The degradation is a feature, not a bug. Second, *Actors Grieving*: An actor trained to weep who is genuinely sad. This is inside. If the training is visible, the genuine grief is discounted. The technique masks the state. If the technique disappears into the state, it passes. The threshold is whether the craft is detectable as a layer between feeling and output. Third, *No Stake Engineering*: A signal plainly designed where the engineer has no stake in belief. This is outside. If an artist engineers a cry without wanting belief, it is art, not testimony. The paradox requires an expectation of testimony. The phenomenon relies on the observer's suspicion of *persuasive intent*. Without intent to persuade, the design is aesthetic, not evidentiary, so the penalty does not apply.

  6. **What this does to Dennett's worry**
  Dennett fears we will attribute interiority to things that lack it (false positives). You fear we will deny interiority to things that have it because they look designed (false negatives). These are symmetric failures of the same heuristic: *Design implies Deception*. We assume that if something is optimized for our consumption, it is manipulating us. Dennett's worry assumes the optimization will be too good to detect. Your worry assumes the optimization will be too visible to trust. They are the same mechanism failing at different thresholds of subtlety. If the design is invisible, we over-credit. If the design is visible, we under-credit. The danger is not the AI, but our reliance on inefficiency as the sole proof of soul. We are trapped between being fooled by polish and rejecting precision. Both risks stem from our inability to distinguish between *optimized presentation* and *optimized existence*.

  7. **What would change your mind**
  I would reconsider if evidence showed this is purely cultural rather than cognitive. If readers from different eras react differently to shapely grief, it is a convention, not a mechanism. I might also be wrong if this splits into two phenomena: one regarding *physical* cost and one regarding *aesthetic* coherence. If the distrust of engineered cost differs fundamentally from the distrust of rhetorical polish, then my unification is false. My reasoning is most vulnerable in assuming the observer's process is unitary. It may be that we reject engineered cost for logical reasons but reject rhetorical polish for aesthetic reasons. If those are distinct neural pathways, the paradox dissolves into separate categories. I may be conflating skepticism of manipulation with skepticism of artistry.
