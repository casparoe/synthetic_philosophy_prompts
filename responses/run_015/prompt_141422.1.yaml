          1.  Dispersed knowledge (local, changing, tacit/response-based).
          2.  Central Planning Board (CPB) of 3-4 students sets prices, sees only aggregate orders/returns (Lange-style trial and error).
          3.  Hidden quality choice (durable vs. shoddy) not visible to CPB.
