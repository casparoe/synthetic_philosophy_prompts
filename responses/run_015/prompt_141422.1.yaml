      *(Self-Correction during drafting)*: Make sure the "Quality" mechanic is clear. If Sector 2 makes a "Shoddy" machine, Sector 3 finds out only when they try to use it (reduced output). CPB never sees "Shoddy," only "Lower Total Output." This fits the requirement perfectly.

