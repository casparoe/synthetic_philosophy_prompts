answer: |-
  # Activity Design: "The Red Ledger"

  **Concept:** A four-round production simulation where a Central Planning Board (CPB) attempts to coordinate three sectors of firms using only price signals. Information is dispersed, capital is sticky, quality is hidden, and a structural shock occurs mid-game.

  **Class Size:** 26 Students.
  **Time:** 90 Minutes.
  **Materials:** Index cards (pre-printed sets), pens, 2 bowls (for draws), chocolate bars (prizes).

  ---

  ## I. Roles and Setup (10 Minutes)

  **1. The Central Planning Board (CPB) – 3 Students**
  *   **Location:** Front table, facing the class.
  *   **Task:** Announce a price vector ($P_{Raw}, P_{Machine}, P_{Widget}$) at the start of each round.
  *   **Input:** They receive aggregate "Order Slips" from firms (Total Supply Offered, Total Demand Requested).
  *   **Constraint:** They **cannot** ask firms what they need, why they ordered, or what their costs are. They can only see the arithmetic gap between Supply and Demand.
  *   **Goal:** Minimize "Social Waste" (Sum of absolute differences between Supply and Demand for all goods).

  **2. The Firms – 23 Students**
  Divide the room into three sectors. Movable tables should be clustered.
  *   **Sector A (Extraction): 8 Students.** Produce *Raw Material*.
  *   **Sector B (Capital): 7 Students.** Produce *Machines* using Raw Material.
  *   **Sector C (Assembly): 8 Students.** Produce *Widgets* using Raw Material + Machines.
  *   **Goal:** Maximize individual "Profit Points." Top 3 firms win chocolate.

  **3. The Goods**
  *   **Raw (R):** Extracted from nature.
  *   **Machine (M):** Made from 2R. **Durable.** Lasts 2 rounds.
  *   **Widget (W):** Made from 1R + 1M. The final consumption good.
  *   **Slag (S):** Byproduct of Extraction. Initially worthless.

  ---

  ## II. Mechanics & Rules

  ### 1. Dispersed Knowledge (The "Condition Card")
  At the start of *every* round, every Firm draws one **Condition Card** from a bowl. They keep this hidden.
  *   *Examples:* "Flooded Mine: Cost +2," "New Drill: Cost -1," "Strike: Output capped at 2," "Normal Operations."
  *   **Why:** This creates local, temporal knowledge. The CPB cannot know the aggregate supply curve because it shifts randomly every round based on these hidden cards.

  ### 2. Hidden Quality (The "Machine Dial")
  In Rounds 1 and 2, Sector B (Capital) chooses a Machine Type when ordering production.
  *   **Type H (High Quality):** Cost 4 Points. Lasts 2 Rounds.
  *   **Type L (Low Quality):** Cost 2 Points. Lasts 1 Round (breaks after use).
  *   **The Trap:** Sector C (Assembly) does not know which type they bought until they try to use it in the *next* round. If they try to use a broken Type L machine, their output is zero for that machine slot.
  *   **CPB Blindness:** The CPB sees "10 Machines Produced." They do *not* see "6 Type H, 4 Type L." They only see the resulting drop in Widget production later.

  ### 3. The Durable Constraint
  Machines built in Round 1 are available for Round 1 and Round 2. Machines built in Round 2 are available for Round 2 and Round 3.
  *   **Stickiness:** If Sector C under-orders Machines in Round 1, they are capacity-constrained in Round 2 regardless of price. This creates path dependence.

  ### 4. The Shock (Round 3)
  *   **Preparation:** In Rounds 1 & 2, Slag is worthless waste. Firms discard it.
  *   **Event:** At the start of Round 3, hand a red card to Sector C: *"New Regulation: All Widgets require 1 unit of Slag."* Hand a green card to Sector A: *"Slag is now a tradable good."*
  *   **Problem:** There is no price for Slag. The CPB price vector has no row for it. Sector A has been throwing it away (or hoarding it randomly). Sector C cannot produce without it.

  ### 5. Payoff & Scoring
  *   **Firms:** Profit = Revenue (Sales × Price) - Costs (Production + Inputs).
      *   Firms calculate their own profit on a **Score Slip**.
      *   Instructor collects these at the end to verify top 3.
  *   **CPB:** Score = 100 - (Total Excess Demand + Total Excess Supply across all goods).
      *   CPB calculates this at the end of each round using the Order Slips.
      *   **Target:** If CPB ends Round 4 with a score > 80, they win chocolate.

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Role Assignment** | Distribute sectors. Hand out Rule Sheets. Explain Profit Formula. **Do not explain the Shock.** |
  | **10-15** | **Round 1: Planning** | CPB sets initial prices (guesses). Firms draw Condition Cards. Firms submit Order Slips (Supply/Demand). |
  | **15-20** | **Round 1: Resolution** | CPB calculates Excess Demand/Supply. Announces results ("Shortage in Raw"). Firms calculate Profit. |
  | **20-25** | **Round 2: Adjustment** | CPB revises prices. Firms draw new Condition Cards. **Sector B chooses Machine Quality (Hidden).** |
  | **25-30** | **Round 2: Resolution** | CPB calculates gaps. **Sector C discovers Machine failures silently** (lowers their output). |
  | **30-35** | **Round 3: The Shock** | **CPB sets prices (No Slag price).** Distribute Red/Green Shock Cards. Chaos ensues. |
  | **35-45** | **Round 3: Resolution** | Massive shortages in Widgets. CPB sees "Unexplained Drop." Firms scramble for Slag. |
  | **45-55** | **Round 4: Crisis Mgmt** | CPB must add Slag to price vector. Firms adjust. Final Production. |
  | **55-65** | **Final Scoring** | Firms submit Score Slips. CPB submits Final Welfare Score. Instructor verifies top firms. |
  | **65-90** | **Debrief** | Structured discussion (see below). |

  ---

  ## IV. CPB Communication Protocol (Strict)

  **The CPB is allowed to:**
  1.  Announce prices at the start of the round.
  2.  Announce the Aggregate Excess Demand/Supply from the *previous* round (e.g., "Raw Material had a surplus of 10 units").
  3.  Ask the Instructor for clarification on rules.

  **The CPB is NOT allowed to:**
  1.  Ask firms: "Why did you order this?" or "What do you need?"
  2.  Ask firms: "What is your cost structure?"
  3.  Negotiate with specific firms.
  4.  See the Condition Cards or Machine Quality choices.

  *Enforcement:* If a CPB member breaks this rule, the Instructor imposes a "Bureaucratic Fine" (deduct 10 points from CPB score).

  ---

  ## V. The Debrief (25 Minutes)

  **1. Mapping to Mises (The Calculation Problem)**
  *   **Moment:** Round 3 (The Shock).
  *   **Question:** "When Slag became essential, how did the CPB know what price to set? How did Sector A know whether to collect Slag or ignore it?"
  *   **Point:** Without a prior market price for Slag, there was no common denominator to compare the cost of collecting Slag against the value of the Widget. The CPB was guessing blindly.
  *   **Evidence vs. Staging:** This is **staged** (I handed you the card), but the *friction* was genuine. You felt the inability to value a new factor without a price history.

  **2. Mapping to Hayek (The Knowledge Problem)**
  *   **Moment:** Every Round (Condition Cards).
  *   **Question:** "CPB, you saw a shortage in Round 2. Did raising the price fix it in Round 3?" (Often no, because half the mines drew 'Flood' cards).
  *   **Point:** The knowledge of *why* supply shifted was local and temporal (in the Condition Cards). It could not be written in a report to the CPB fast enough.
  *   **Evidence vs. Staging:** **Generated Evidence.** The CPB genuinely failed to distinguish between a price-induced shortage and a random shock.

  **3. Mapping to Lange (Market Socialism)**
  *   **Moment:** Rounds 1 & 2.
  *   **Question:** "Did prices begin to stabilize before the Shock? Did the economy function *okay*?"
  *   **Point:** Lange's trial-and-error *can* work for static, known goods. The mechanism has force.
  *   **Evidence vs. Staging:** **Generated Evidence.** If the CPB managed to clear the market in Round 2, they proved prices *can* convey information.
  *   **The Strain:** The Hidden Quality (Machine Dial) broke this. The CPB saw "Shortage of Widgets" but couldn't tell if it was due to Price or Shoddy Machines. This mimics the incentive problem in socialism (soft budget constraints/quality hiding).

  **4. The "Both Sides" Feeling**
  *   Ensure students admit: "The CPB actually helped us coordinate in Round 2." (Validating Lange).
  *   Ensure students admit: "But Round 3 broke everything because they couldn't see the Slag value or the Machine Quality." (Validating Mises/Hayek).

  ---

  ## VI. Limitations (What You Must Supply)

  Be honest with the class. This game is a model, not reality. You must explicitly lecture on what was missing:

  1.  **Entrepreneurship:** Firms were told to maximize profit. In reality, someone might have *speculated* on Slag in Round 1, hoping it would be valuable. The game punished speculation (costs points).
  2.  **Time Preference:** Rounds were 10 minutes. Real investment horizons are years. The "Durable Machine" was a weak proxy for capital structure.
  3.  **Scale:** 23 firms is a village. The calculation problem scales exponentially, not linearly.
  4.  **Incentives:** Firms were told to act as profit-maximizers. Real managers might empire-build or hide output to lower next year's quota (the "ratchet effect").

  ---

  ## VII. Troubleshooting & Predictable Failures

  **1. Failure: The CPB asks "What do you need?"**
  *   **Risk:** High. It's natural to want to help.
  *   **Fix:** Assign the Instructor as the "Communication Monitor." If a CPB member asks a forbidden question, immediately interrupt and deduct 10 CPB points. Make it painful.

  **2. Failure: Hoarding.**
  *   **Risk:** Firms keep Raw Material to prevent others from producing.
  *   **Fix:** Rule: "Inventory Decay." Any good held over from Round X to Round X+1 loses 50% value. This forces circulation.

  **3. Failure: Quality Dial Ignored.**
  *   **Risk:** Everyone buys Cheap Machines because it's higher immediate profit.
  *   **Fix:** Make the payoff stark. Type L Machine breaks 100% of the time. If Sector C buys Type L, their Round 3 output is zero. Announce this rule clearly: "Type L lasts 1 Round. Type H lasts 2."

  **4. Failure: Arithmetic takes too long.**
  *   **Risk:** 23 firms calculating profit eats 20 minutes.
  *   **Fix:** **Pre-printed Score Slips.** The formula is: `(Price × Sold) - (Cost × Made)`. They just fill in the blanks. CPB does *not* check firm math during the game. Instructor checks top 3 at the end. CPB only sums "Total Supply" and "Total Demand" numbers (single digits) for their own score.

  **5. Failure: The Shock kills the game.**
  *   **Risk:** Round 3 is so chaotic Round 4 is impossible.
  *   **Fix:** If Round 3 collapses completely, skip Round 4. Move straight to debrief. The collapse *is* the lesson.

  ---

  ## VIII. The Cut List (If 20 Minutes Behind)

  If you are running late at the 60-minute mark, cut the following in this order:

  1.  **Cut Round 4.** End the game immediately after the Round 3 Resolution. The "Crisis" is a better ending than a rushed "Recovery."
  2.  **Simplify Scoring.** Do not verify individual firm profits. Award chocolate based on self-reported top 3 (trust system) to save 10 minutes.
  3.  **Drop the "Machine Quality" Mechanic.** If this is too confusing, make all Machines identical. (Note: This weakens the Mises/Incentive argument, so only do this if absolutely necessary).
  4.  **Do NOT Cut:** The Shock (Slag) or the CPB Constraints. These are the core theoretical engines.

  ---

  ## Materials Checklist for Instructor

  1.  **26 Role Cards:** (3 CPB, 8 Sector A, 7 Sector B, 8 Sector C).
  2.  **Condition Card Deck:** 30 cards (mix of "Normal," "Cost +2," "Output -1," "Strike").
  3.  **Order Slips:** 100 small slips (Fields: Good, Qty Supplied, Qty Demanded).
  4.  **Score Slips:** 23 slips (Fields: Revenue, Cost, Profit).
  5.  **Shock Cards:** 1 Red (Sector C), 1 Green (Sector A).
  6.  **Price Board:** A whiteboard section for CPB to write prices.
  7.  **Timer:** Visible to all.
