      *   **Debrief:** Map to Mises (calculation problem), Hayek (knowledge problem), Lange (market socialism). Evaluate evidence vs. staging. Ensure students feel both sides.
      *   **Limitations:** Acknowledge what the game *can't* do (entrepreneurship, time preference, scale, artificial incentives).
      *   **Troubleshooting:** Predict failures (CPB asking for needs, hoarding, quality ignored, arithmetic slow) and provide fixes.
      *   **Cut List:** Which mechanic to drop if time runs short.

  2.  **Design the Activity ("The Red Ledger"):**

      *   *Core Concept:* A production chain economy.
      *   *Goods:*
          *   Raw Material (R)
