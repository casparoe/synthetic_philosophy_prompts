      *(The Shock)*: Make sure the "Waste" card is physical. Hand it to Sector 1 in Round 3. Hand the "Requirement" card to Sector 3 in Round 3.

      *(Cut List)*: If time is short, cut Round 4. End with the crisis of Round 3.

      *(Troubleshooting)*: The "CPB asks for needs" is the biggest risk. I need a "Communication Monitor" role or strict instructor intervention. I'll assign one CPB member as "Scribe" who is the only one allowed to speak to the room, and the Instructor acts as the "Enforcer."

