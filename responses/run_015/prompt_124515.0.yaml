  ### Brainstorming: Audience Intellectual Commitments

  1.  **Causal Naturalism:** The philosophers of physics and formal epistemologists will reject any reference class definition that relies on modal metaphysics (possible observers) rather than actual causal connections. They treat "observation" as a physical interaction, not a logical possibility. If your substrate boundary isn't causally rigorous, they will dismiss it as a category error.
  2.  **Bayesian Coherence over Intuition:** The formal epistemologists and decision theorist prioritize the axioms of probability over cosmological intuitions. They will not accept a "hybrid" position if it violates conditionalization or opens you to a Dutch Book. They view "presumptuousness" as a failure of math, not metaphysics.
  3.  **Anti-Theological Minimalism:** This group is allergic to arguments that derive physical facts (universe size) from epistemic premises (my existence). They view the Presumptuous Philosopher not as a puzzle to be solved, but as a *reductio* of SIA itself. They will press you to show that your view doesn't just hide the same metaphysical extravagance behind new terminology.

  ***

  ### Q&A Prep Sheet

  #### Objection 1: The Supervenience Challenge (Most Damaging)
  **(1) Phrasing:** "You define the reference class by the physical substrate implementing the reasoning agent. But if you accept even a weak functionalism—that mental states supervene on computational structure rather than specific matter—then 'substrate' becomes irrelevant. If a simulation on a distant server implements the same functional state, isn't it in your reference class? By insisting on the physical substrate, aren't you committing a category error regarding the nature of indexical belief?"

  **(2) Reply:** "I am not denying functionalism regarding the *content* of thought, but I am insisting on physicalism regarding the *location* of evidence. Indexical belief is not just about computational state; it is about causal embedding. When I update on 'I exist,' I am updating on the fact that *this* causal chain produced an observer. A functionally identical simulation in a causally disconnected region does not share my causal history. Therefore, it falls outside the reference class relevant for *my* Bayesian update. The substrate bound is not about what thinks, but about what physically constitutes the evidence bearer."

  **(3) Weakness:** This risks sounding like dualism or begging the question. If the graduate students press that "causal history" is itself a functional relation, I lose the boundary. I am glossing over whether "causal embedding" can be defined without circularity.

  #### Objection 2: The Bayesian Coherence Challenge
  **(1) Phrasing:** "You propose a hybrid view: accept self-indication locally, reject it cosmologically. But Bayesian conditionalization is universal. If 'I exist' is evidence for hypotheses that make my existence more likely, you cannot arbitrarily switch off that update when the hypothesis concerns universe size. By restricting the update to the substrate boundary, aren't you violating the principle of total evidence? It looks like you're rigging the priors to avoid the Presumptuous Philosopher conclusion."

  **(2) Reply:** "I am not switching off the update; I am clarifying the likelihood ratio. 'I exist' is not evidence for 'There are many observers' unless 'I' could have been any of them. Inside my substrate boundary, I could have been a different cognitive instantiation of this causal process. Outside that boundary, in disconnected cosmological regions, 'I' could not have been those observers because there is no causal path linking us. The likelihood ratio is 1 for disconnected populations. Thus, conditionalization is preserved; the update simply yields no information about external population sizes."

  **(3) Weakness:** This relies on a contentious interpretation of "could have been." The formal epistemologists may argue that logical possibility, not causal connectivity, determines the reference class in self-locating belief. I am glossing over the definition of "centered worlds."

  #### Objection 3: The Decision-Theoretic Instability Challenge
  **(1) Phrasing:** "Consider a bet where you win if the universe is large and lose if it is small. Standard SIA says take the bet. Your view says don't update, so don't take the bet. But if you act locally as an SIA agent (expecting to be typical within your substrate) but cosmically as an SSA agent, can't I construct a Dutch Book across local and cosmological scales? Your decision theory seems fragmented."

  **(2) Reply:** "Decision theory requires causal leverage. I can only place bets on outcomes I can verify or that affect my utility function within my causal horizon. A bet on the size of a causally disconnected universe has no payoff conditions I can ever witness. Therefore, there is no coherent betting market that spans the substrate boundary. The fragmentation isn't in my rationality; it's in the structure of the wagers available to a substrate-bound agent."

  **(3) Weakness:** The decision theorist will counter that rational preference ordering should hold over logical possibilities, not just verifiable outcomes. I am glossing over the distinction between pragmatic and epistemic rationality.

  ***

  ### Strategic Specifications

  **The Partial Concession (for Opening Remarks):**
  I should concede that the term "substrate" is currently a placeholder for "causal implementation mechanism." I must acknowledge that I do not yet have a complete physics-level definition of where one substrate ends and another begins (e.g., quantum branching points). Admitting this vagueness early disarms the physicists who want to pounce on imprecise ontology.

  **The Load-Bearing Reply:**
  The reply to **Objection 2 (Bayesian Coherence)** is load-bearing. If I cannot demonstrate that restricting the likelihood ratio to the causal boundary is consistent with standard conditionalization, the entire hybrid position collapses into arbitrary priors. I must prove that "I exist" carries zero weight for disconnected populations, not just that I *prefer* it to carry zero weight.

  **The Dangerous Question (Hope Nobody Asks):**
  *"If the causal boundary is defined by physical interaction, and quantum mechanics allows for non-local entanglement or Everettian branching, doesn't your substrate boundary either dissolve into the whole universe or fracture into incoherent slices?"*
  **Why it is dangerous:** This forces me to take a stance on the interpretation of quantum mechanics (Many-Worlds vs. Copenhagen vs. Bohmian). If I choose Many-Worlds, my substrate boundary likely encompasses all branches, restoring the Presumptuous Philosopher problem. If I choose Copenhagen, the physicists will attack the collapse mechanism. It exposes that my "substrate" definition relies on a specific, contested physics.

  Verdict: Functionalism dissolves substrate boundaries.
