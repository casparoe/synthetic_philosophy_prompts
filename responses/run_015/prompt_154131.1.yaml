          *   **Elias:** Critic of universalism. Argues Mara's distinction smuggles in a Western ontology (separable "public purpose" independent of relational obligations). Argues gift/reciprocity constitute the moral fabric of authority in many societies, not subversion. Labeling customary obligation as corruption imposes alien transactional logic.

