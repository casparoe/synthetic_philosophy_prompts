answer: |-
  You have not merely been circling a clinical inconvenience; you have walked directly into the centre of a debate that has occupied moral philosophers and psychologists for over a century. The short answer is that there is no single, canonical proper noun for the exact triad of difficulties you describe, but the components are well-mapped. The 'two families' of failure correspond to the classic critique of **Sensation Theory** (phenomenology) versus **Attitudinal Theory** (motivation), and the 'sustained versus completed' wrinkle is the distinction between **Atelic** and **Telic** activities.

  However, the specific way these failures interact in your notebook — particularly the observation that some 'pleasures' are transitions rather than states — suggests that the standard labels are insufficient for your clinical purpose. You are describing what is broadly known as the **Heterogeneity of Pleasure**, but that term is often too dry to capture the ontological slipperiness you have found.

  To address your request directly: the 'two families' you identified are indeed the standard carve. When philosophers argue that pleasure cannot be defined by a specific feeling (the 'glow' or 'tone'), they are attacking the **Phenomenological Account**. When they argue that pleasure cannot be defined by what we want or choose (because we choose harmful or compulsive things), they are attacking the **Conative** or **Motivational Account**. You have correctly diagnosed that the former excludes too much (the quiet room, the vindication) and the latter includes too much (the compulsive checking).

  The 'sustained versus completed' distinction is equally established, usually discussed under the Aristotelian terms **Atelic** (activities done for their own sake, like watching a storm) and **Telic** (activities done to reach an end, like scratching an itch or finishing a crossword). The insight that a telic pleasure extended indefinitely becomes torture is a standard objection to defining pleasure purely as a state of affairs.

  Since you asked for a coined name if nothing established fits the specific contour of your worry — specifically to settle the borderline cases and address the scale — I propose we call this phenomenon **Hedonic Polymorphism**.

  Unlike 'heterogeneity', which simply suggests 'many kinds', 'polymorphism' implies that the same label ('enjoyment') is being applied to structures that are fundamentally different in shape and function. Under **Hedonic Polymorphism**, we can define three distinct modalities that your patients are conflating on your 0–10 scale:

  1.  **Immersive Pleasure (Atelic/State):** Experiences where the value lies in continuation. (The bath, the storm).
  2.  **Resolutive Pleasure (Telic/Transition):** Experiences where the value lies in the cessation of a deficit or the completion of a pattern. (The itch, the chord, the vindication, the quiet room).
  3.  **Restorative Pleasure (Homeostatic):** Experiences where the value is the return to baseline, often without conscious phenomenology during the event. (Sleep, eating when starving).

  Using this definition, we can settle your borderline cases:

  *   **The grim satisfaction of finishing a hateful task:** This is **Resolutive**. It is a telic completion. The 'pleasure' is the removal of the burden. It belongs on the list, not because the task was enjoyable, but because the *resolution* carries the same hedonic signature as the resolving chord. It is 'in'.
  *   **The relief of a near miss:** This is also **Resolutive** (specifically, relief). It is a transition from high anxiety to safety. It fits the 'room going quiet' or 'cooling down' category. It is 'in'.
  *   **The absorption of a good night's sleep:** This is **Restorative**. It lacks phenomenology (you do not experience it while it happens) and lacks immediate motivation (you do not choose it consciously in the moment). Under a strict phenomenological account, it is 'out'. However, patients rate it highly because they value the *after-effect*. If the scale asks about enjoyment *in the moment*, sleep is 'out'. If it asks about what contributes to a life worth living, it is 'in'. This ambiguity is precisely why the scale fails.

  The implication for your 0–10 scale is significant. By asking patients to aggregate these polymorphic items into a single metric, the scale commits what we might term **The Hedonic Aggregation Fallacy**. It assumes a common currency where there is only a family resemblance.

  Your patients could rank the items because human beings are adept at comparing *value*, even when the *source* of that value differs. We can say 'the bath was better than the crossword' without implying that 'bath-pleasure' and 'crossword-pleasure' are the same substance. They are ranking *preference satisfaction*, not measuring a uniform psychic quantity.

  For your piece to your colleagues, the conclusion is this: the scale was not measuring 'enjoyment' as a singular psychological state. It was measuring **Salient Valence Shift**. The 'water', the 'quiet room', and the 'vindication' all share one thing: they represent a sharp, positive change in the patient's relationship with their environment or their own body. The 0–10 score was not a measure of how much pleasure they had; it was a measure of how much *relief* or *engagement* they had managed to secure against the background of pain.

  You were not failing to find the commonality because you were looking poorly; you were failing to find it because it does not exist. The list is held together not by a shared essence, but by a shared function: these are the moments where the chronic pain narrative was temporarily interrupted. That is what the scale was actually recording.
