answer: |-
  The principle that best unifies your intuitions, while respecting the constraints you've set (blocking the Scarf procedure, saving the Calibration Tree, and explaining the Zebra/BIV asymmetry), is a version of what contemporary epistemologists call **Transmission Failure**, refined here as:

  ### **The Principle of Non-Presupposing Transmission (NPT)**

  > **Statement:** Justification for a premise $P$ transmits to a conclusion $Q$ via inference only if the justification for accepting $P$ does not *rationally require* the antecedent acceptance of $Q$ (or the background conditions that make the source of $P$ reliable).

  > **Corollary (Entitlement):** A cognitive source may yield knowledge of $P$ without prior proof of its reliability if that source is *fundamental* (possessing default entitlement), but this default entitlement cannot be converted into an *argument* for the source's reliability using the source's own outputs.

  ---

  ### **How NPT Saves Your Verdicts**

  1.  **The Maple Tree (Fine):**
      *   *Structure:* Experience $\to$ "There is a tree."
      *   *NPT Ruling:* Your justification for the belief (visual experience) does not require you to have *already argued* that there is a tree. It relies on default entitlement to vision.
      *   *Verdict:* **Accommodated.**

  2.  **The Brain-in-a-Vat (Know it, not via argument):**
      *   *Structure:* "There is a tree" $\to$ "I am not a BIV."
      *   *NPT Ruling:* Your justification for "There is a tree" *presupposes* that you are not a BIV (if you were, the experience wouldn't justify the belief). Therefore, you cannot use the belief to *prove* you aren't a BIV. However, the Corollary allows you to hold the belief (and its precondition) via entitlement.
      *   *Verdict:* **Accommodated.** (It validates your feeling that the *argument* is flawed even if the *knowledge* is secure).

  3.  **The Zebra vs. Painted Mule (Know Zebra, can't rule out Mule via argument):**
      *   *Structure:* "Looks like a zebra" $\to$ "Is a zebra" $\to$ "Not a painted mule."
      *   *NPT Ruling:* Your warrant for "Is a zebra" depends on the background assumption that deceptive painted mules aren't present. You cannot use the conclusion to validate that background assumption.
      *   *Verdict:* **Accommodated.**

  4.  **The Scarf Procedure (Bad):**
      *   *Structure:* "Scarf looks red" + "Scarf is red" (scored hit) $\to$ "My vision is reliable."
      *   *NPT Ruling:* To count "Scarf looks red" as evidence for "Scarf is red," you must *already* assume your vision is reliable. You cannot use the output to prove the input's validity.
      *   *Verdict:* **Accommodated.**

  5.  **The Lab Thermometer (Fine):**
      *   *Structure:* "Reference says $X$" $\to$ "New Thermometer says $X$" $\to$ "New Thermometer is accurate."
      *   *NPT Ruling:* The justification for the premise ("Reference says $X$") relies on the *Reference's* reliability, not the *New Thermometer's*. The dependence is external.
      *   *Verdict:* **Accommodated.**

  6.  **The Calibration Tree (Fine):**
      *   *Structure:* Eyes $\to$ Thermometer A $\to$ Thermometer B...
      *   *NPT Ruling:* The regress stops at the Eyes. Per NPT's Corollary, Eyes do not need an *argument* for their reliability; they have default entitlement. The tree is valid because the base is foundational, not because the base bootstrapped itself.
      *   *Verdict:* **Accommodated.** (This saves you from the skeptical conclusion you refuse to draw).

  7.  **Instruments A & B (Bad):**
      *   *Structure:* A confirms B, B confirms A.
      *   *NPT Ruling:* Justification for A's accuracy requires B's reliability, and vice versa. This is circular dependence; neither has independent warrant.
      *   *Verdict:* **Accommodated.**

  ---

  ### **Application to New Cases**

  1.  **Self-Driving Car (LiDAR checks LiDAR Map):**
      *   *Scenario:* The car uses its LiDAR to build a map, then uses the map to check if the LiDAR is reading obstacles correctly.
      *   *NPT Ruling:* **Bad.** The map's accuracy presupposes the LiDAR's accuracy. Using the map to validate the LiDAR is structurally identical to the Scarf procedure. The car is bootstrapping.
  2.  **Translation App (App checks its own Dictionary):**
      *   *Scenario:* You verify the app's translation using the dictionary feature built into the same app.
      *   *NPT Ruling:* **Bad.** The dictionary output depends on the same codebase/algorithm as the translation. There is no independent source. You gain no new warrant.

  ---

  ### **The Cost: Which Verdicts Must Go?**

  You asked for honesty about where the principle conflicts with your intuitions. NPT is rigorous, and it demands you overturn one specific verdict you hold:

  **The Witness Rehearsal Case.**
  *   *Your Verdict:* "Somehow less bad to me."
  *   *NPT Verdict:* **Bad.**
  *   *Why:* Structurally, this is the Scarf procedure applied to memory. If I check my memory's consistency *using only my memory*, I am presupposing the reliability of the very faculty I am testing. Internal coherence feels psychologically reassuring (which is why it feels "less bad"), but epistemically, it provides no *new* warrant for reliability. If your memory is systematically flawed, it will likely be consistently flawed. NPT demands you treat this as circular bootstrapping, identical to the Scarf case. To keep the principle clean, you must concede that the witness gains no *knowledge* of reliability here, only maintained confidence.

  **A Nuance on the BIV Case:**
  *   *Your Verdict:* "I'm inclined to say I know that [I'm not a BIV]."
  *   *NPT Nuance:* NPT forces you to clarify *how* you know it. You cannot know it via inference from perception. You must claim you know it via **Entitlement** (a default right to trust your faculties). If you think you know it *because* your perceptions are vivid, NPT says you are mistaken. You know it only in the same way you know the Maple Tree is there: by default, not by proof.

  ### **Summary**
  The **Principle of Non-Presupposing Transmission** captures the asymmetry in your list: warrant flows from trusted sources to the world, but not from the world back to the source's trustworthiness (without independent help). It saves your Maple, your Lab, and your Calibration Tree, while killing the Scarf, the A&B loop, and the Self-Driving Car. The price of this unity is that you must reject the epistemic value of the Witness's self-rehearsal, recognizing it as a comforting illusion of validation rather than genuine calibration.
