prompt: |-
  I'm a retired physicist who got into philosphy late in life, and there's this phrase that keeps coming up at my local meetup: "time is just another dimention like space." People throw it around to mean everything from "Einstein showed change is fake" to "your now is just like being left of the door," and last week someone used it to argue that since simultaneity is relative, my deciding to do something can't be causally efficacious in any frame-independent way. I know the spacetime interval has that minus sign, so I don't think the math alone gets you there. Can you lay out the precise claims hiding in that slogan -- coordinate-trivial ones, ontological ones, and the ones that are just false -- and map which ones actually do the work in the Rietdijk-Putnam line about determinateness being frame-dependent? I want a menu of readings I can bring back, with a verdict on which ones support the causality objection and which are just bait-and-switch. Keep it grounded; I don't need a reading list, just the disambiguation.
reasoning: |-
