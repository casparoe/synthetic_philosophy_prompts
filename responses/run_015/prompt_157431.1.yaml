answer: |-
  You are right to be suspicious. The slogan "time is just another dimension like space" is a philosophical Trojan horse. It smuggles heavy metaphysical commitments inside a mathematical triviality. As a physicist, you know the metric signature $(\pm, \mp, \mp, \mp)$ does heavy lifting that the slogan ignores. As a philosopher, you need to separate the formalism from the ontology.

  Here is the disambiguation menu you can bring to your meetup, categorized by truth value and philosophical load, followed by the specific mapping to the Rietdijk-Putnam argument and the causality objection.

  ### I. The Menu of Readings

  **1. The Coordinate Claim (Mathematically True, Metaphysically Neutral)**
  *   **The Claim:** To specify an event, you need four numbers $(t, x, y, z)$, not three. Lorentz transformations mix $t$ and $x$ just as rotations mix $x$ and $y$.
  *   **Verdict:** **True but Trivial.** This is just the definition of a manifold. It does not imply that $t$ behaves *physically* like $x$, nor does it imply that the future "exists" in the same way the past does. It licenses the math, not the metaphysics.
  *   **Role in Slogan:** This is the bait. It gets you to nod along because the math is correct.

  **2. The Metric Claim (Physically False)**
  *   **The Claim:** Time is physically interchangeable with space; you can move through time the way you move through space.
  *   **Verdict:** **False.** The minus sign in the spacetime interval ($ds^2 = -c^2dt^2 + dx^2...$) creates a causal structure (light cones) that does not exist in Euclidean space. You cannot rotate a timelike vector into a spacelike vector. You are forced along a timelike worldline; you are not forced along a spatial line.
  *   **Role in Slogan:** This is the first switch. When people say "just like space," they often implicitly deny the physical asymmetry enforced by the metric signature.

  **3. The Ontological Parity Claim (The Block Universe)**
  *   **The Claim:** All points in the 4-manifold are equally "real." There is no privileged foliation of spacetime into "past," "present," and "future." The "now" is not an objective feature of the universe.
  *   **Verdict:** **Contested (Eternalism).** This is a metaphysical interpretation of SR, not a logical consequence of the math alone (though SR constrains it heavily). It asserts that existence is not tensed.
  *   **Role in Slogan:** This is the actual payload. When your meetup friends say "change is fake," they are asserting Ontological Parity.

  **4. The Indexical Claim (Deflationary)**
  *   **The Claim:** "Now" is to "time" what "here" is to "space." It refers to the speaker's location in the manifold, not an objective moving boundary.
  *   **Verdict:** **Plausible.** This dissolves the "flow" of time as a subjective artifact of consciousness moving along a worldline, rather than a feature of the block.
  *   **Role in Slogan:** Used to defend against the intuition that the present is special.

  ---

  ### II. Mapping to Rietdijk-Putnam

  The Rietdijk-Putnam argument (often called the "And-Now-ism" argument) is the specific engine your friends are trying to start with the slogan. Here is how the claims above map onto it.

  **The Argument Structure:**
  1.  **Relativity of Simultaneity:** Two observers in relative motion disagree on which events are simultaneous with their "now."
  2.  **No Privileged Frame:** There is no physical fact of the matter about who is right (denies Absolute Simultaneity).
  3.  **Transitivity of Reality:** If event $E$ is real for Observer A, and Observer A is real for Observer B, then $E$ must be real for Observer B.
  4.  **Conclusion:** Future events (relative to B) are simultaneous with A's "now," therefore they are already real/determinate.

  **Which Claim Does the Work?**
  *   **The Slogan ("Time is a dimension")** is merely rhetorical shorthand for Premise 2 and the Conclusion.
  *   **The Coordinate Claim** supports Premise 1 (mathematically).
  *   **The Ontological Parity Claim** *is* the Conclusion.

  **The Verdict on the Slogan's Utility:**
  The slogan is **philosophically useless** for proving Rietdijk-Putnam. You cannot derive Ontological Parity simply from the fact that $t$ is a coordinate. You derive it from the *Relativity of Simultaneity* combined with a specific assumption about what "real" means (Premise 3).
  *   *Trap:* If someone argues "Time is a dimension, therefore the future exists," they are skipping the actual argument (Relativity of Simultaneity) and asserting the conclusion as a premise.

  ---

  ### III. The Causality Objection (The "Efficacy" Claim)

  Your friend's claim: *"Since simultaneity is relative, my deciding to do something can't be causally efficacious in any frame-independent way."*

  This is the most dangerous confusion in the room. It conflates **simultaneity** (spacelike relations) with **causality** (timelike/null relations).

  **1. The Physics Verdict: False**
  *   **Causal Order is Invariant:** In SR, if event $A$ (decision) causally influences event $B$ (action), they are separated by a timelike or null interval.
  *   **Lorentz Invariance:** For all timelike separated events, the temporal order is **frame-independent**. If $A$ causes $B$, then $t_A < t_B$ in *all* valid reference frames.
  *   **The Error:** Your friend is applying the relativity of simultaneity (which applies only to spacelike separated events) to causal chains. No frame exists where the effect precedes the cause.

  **2. The Metaphysical Verdict: Compatibilist**
  *   Even if the Block Universe (Ontological Parity) is true, it does not negate causal efficacy.
  *   **Determinateness $\neq$ Fatalism:** The fact that a decision is "fixed" in the 4-manifold does not mean the decision didn't *cause* the outcome. The decision is simply a necessary part of the causal chain that is also fixed.
  *   **Frame-Independence:** Causal efficacy is a structural relation between events in the manifold. It is frame-independent precisely *because* the light-cone structure is invariant.

  **3. The Bait-and-Switch**
  *   **The Switch:** They slide from "Simultaneity is relative" (True) to "Causal Order is relative" (False) to "Agency is illusory" (Non-sequitur).
  *   **Why they do it:** They want the "Time is a dimension" slogan to imply that because the future is "already there" (Ontological Parity), my choice doesn't matter. But in the 4D picture, *my choice* is also "already there." The choice is the cause.

  ### Summary for the Meetup

  When you return, you can offer this triage:

  1.  **If they mean "We need 4 coordinates to label events":** Agree, but note this proves nothing about reality or change. (Coordinate Claim)
  2.  **If they mean "The future exists as much as the past":** Acknowledge this is the Block Universe view, supported by Rietdijk-Putnam, *not* by the slogan itself. Note that this relies on the definition of "real," not just the math. (Ontological Parity)
  3.  **If they mean "Causality is frame-dependent":** Correct them immediately. Causal order is Lorentz invariant. The minus sign protects causality. This claim is physically false. (Metric Claim)
  4.  **If they mean "My choice doesn't matter because it's fixed":** Point out that in a Block Universe, the *choice* is the fixed event that determines the future. Efficacy is preserved even if "becoming" is not.

  **Bottom Line:** The slogan is a category error. Time is a dimension *mathematically*, but it is distinct from space *physically* (metric signature) and *phenomenologically* (unidirectional traversal). The Rietdijk-Putnam argument relies on simultaneity, not dimensionality. The causality objection relies on a misunderstanding of light cones.
