          3.  *The Ontological Parity Claim (Block Universe):* This is the heavy lifter. Past, present, future exist equally.
          4.  *The Perspectival "Now" Claim:* "Now" is indexical, like "here."
      *   **Mapping to Rietdijk-Putnam:**
          *   Explain how the argument works (Relativity of Simultaneity + Transitivity of "Real").
          *   Show which claim from the menu is actually doing the work (Ontological Parity).
      *   **The Causality Objection:**
          *   The user's meetup friend argues: "Simultaneity is relative $\rightarrow$ Decision isn't causally efficacious in a frame-independent way."
          *   *Analysis:* This is a confusion. Causality (light cone structure) *is* frame-independent. Temporal order of causally connected events is invariant.
          *   *Verdict:* The objection fails based on SR physics, even if Block Universe is true. Determinism $\neq$ Inefficacy.
      *   **Bait-and-Switch Identification:**
