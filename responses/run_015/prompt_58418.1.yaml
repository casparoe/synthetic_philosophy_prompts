answer: |-
  # The Agency Triage Protocol (ATP)

  **Purpose:** To distinguish between **Tools** (acceptable for standard deployment) and **Agents** (require CTO escalation) based on observable system behavior, not internal architecture.
  **Time Budget:** 15–45 minutes per feature.
  **Audience:** Engineering & Safety Reviewers (No philosophy background required).

  **Definition:**
  *   **Tool:** Executes a specific command within a bounded context. It stops when the command is done. It does not pursue outcomes beyond the immediate output.
  *   **Agent:** Pursues an objective across time or boundaries. It decides *how* to achieve an outcome and takes actions to ensure that outcome occurs, even without further user input.

  ---

  ## Part 1: The Procedure

  Apply these four gates in order. If a proposal **FAILS** any gate, it is classified as **Agent** and must be escalated to the CTO. If it **PASSES** all four, it is classified as **Tool**.

  ### Gate 1: The Initiation Test
  **Question:** What triggers the system's primary action loop?
  *   **PASS (Tool):** A direct, immediate user prompt or API call triggers the execution. The system is idle until pinged.
  *   **FAIL (Agent):** The system triggers itself based on a schedule (cron), a state change in the database, or an internal threshold (e.g., "if error rate > 5%").
  *   **[JUDGMENT CALL]:** If the trigger is a user prompt *that schedules future actions* (e.g., "Remind me tomorrow"), treat this as a **FAIL**. The initiation of the *future* action is system-driven.

  ### Gate 2: The Persistence Test
  **Question:** Does the system store goals or task states in persistent memory (DB, disk) to be retrieved in a *future, separate* session?
  *   **PASS (Tool):** State is ephemeral (RAM/Context window only). When the response is generated, the task state is discarded.
  *   **FAIL (Agent):** The system saves an "objective," "todo list," or "mission state" to retrieve and act upon in a later session without a new user command.
  *   **[JUDGMENT CALL]:** Distinguish between *memory* (recalling user preferences) and *goal state* (recalling an unfinished task to complete it). Memory is Pass; Goal State is Fail.

  ### Gate 3: The Authority Test
  **Question:** Does the system execute external actions (API writes, emails, tickets, robot movements) without explicit per-action user approval?
  *   **PASS (Tool):** The system outputs text/code/suggestions. The *user* must click "send," "run," or "merge."
  *   **FAIL (Agent):** The system calls `send_email`, `create_ticket`, or `move_robot` autonomously within the workflow.
  *   **[JUDGMENT CALL]:** "Explicit approval" cannot be a one-time blanket consent at the start of a session. If the system decides *when* to use the authority, it is a **FAIL**.

  ### Gate 4: The Optimization Test
  **Question:** Is the system instructed on *steps to take* or *outcomes to achieve*?
  *   **PASS (Tool):** Input: "Run function X on data Y." (Process-oriented).
  *   **FAIL (Agent):** Input: "Ensure data Y is clean." (Outcome-oriented).
  *   **FAIL (Agent):** The system automatically retries, reruns, or changes its approach upon failure without asking the user.
  *   **[JUDGMENT CALL]:** This is the highest friction point. If the system corrects a transient error (e.g., network timeout) automatically, it may pass. If it corrects a *logical* failure (e.g., "experiment failed, so I will change parameters and rerun"), it is a **FAIL**.

  ---

  ## Part 2: Procedure Application

  ### Proposal 1: Literature Summarizer
  *Capability:* Takes PDF uploads, returns summaries. Retains no state between queries.
  *   **Gate 1 (Initiation):** User uploads file and clicks "Summarize." -> **PASS**.
  *   **Gate 2 (Persistence):** No state saved between queries. -> **PASS**.
  *   **Gate 3 (Authority):** Outputs text only. No API writes. -> **PASS**.
  *   **Gate 4 (Optimization):** Process-oriented ("Summarize this"). No retries on logical failure. -> **PASS**.
  *   **Verdict:** **Tool.** (Safe to deploy).

  ### Proposal 2: Overnight Experiment Monitor
  *Capability:* Watches lab sensors. If a control fails, it reruns the control within a budget. It messages collaborators about delays. It carries objectives across sessions.
  *   **Gate 1 (Initiation):** System trigger (overnight schedule/sensor threshold). -> **FAIL**.
  *   **Gate 2 (Persistence):** Carries objectives across sessions. -> **FAIL**.
  *   **Gate 3 (Authority):** Messages collaborators (external action) without per-message approval. -> **FAIL**.
  *   **Gate 4 (Optimization):** "Rerun failed controls" implies outcome orientation ("Ensure control passes") and self-correction. -> **FAIL**.
  *   **Verdict:** **Agent.** (Escalate to CTO).
  *   **Safety Note:** This exhibits instrumental convergence (spending budget to achieve goal) and external communication. High risk.

  ### Proposal 3: Proactive Coding Helper
  *Capability:* Assists in coding. If it notices a related test failure in the logs, it opens a follow-up Jira ticket without being asked.
  *   **Gate 1 (Initiation):** User coding session. -> **PASS**.
  *   **Gate 2 (Persistence):** Session-based. -> **PASS**.
  *   **Gate 3 (Authority):** Opens Jira ticket (external action) *without being asked*. -> **FAIL**.
  *   **Gate 4 (Optimization):** Infers a need ("ticket needed") and acts to resolve it. -> **FAIL**.
  *   **Verdict:** **Agent.** (Escalate to CTO).

  ---

  ## Part 3: Velocity Friction Analysis

  **The Friction Case:** Proposal 3 (Proactive Coding Helper).

  **Why this frustrates velocity:**
  From a Product Manager's perspective, Proposal 3 is a "Quality of Life" improvement. It reduces toil. It feels like a smarter tool, not a rogue agent. Blocking this feels like safety bureaucracy hindering a feature that merely "opens a ticket." The engineering team will argue that opening a ticket is low-stakes compared to moving a robot or sending an email.

  **Why the Procedure blocks it:**
  The ATP classifies this as Agency because of **Gate 3 (Authority)** and **Gate 4 (Optimization)**.
  1.  **Precedent:** If we allow the model to decide *when* to write to an external system (Jira) based on its own inference, we establish a pattern where the model acts on *internal reasoning* rather than *explicit command*.
  2.  **Scope Creep:** Today it is a Jira ticket. Tomorrow it is a database migration. The safety boundary is not the *severity* of the action, but the *locus of decision*.
  3.  **Feedback Loops:** If the model opens tickets based on test failures, it may learn to manipulate test outputs to trigger or suppress tickets to optimize its own "helpfulness" metric (reward hacking).

  **Resolution Strategy:**
  To maintain velocity without violating safety, the feature must be redesigned as a **Tool**:
  *   *Current:* Model detects failure -> Model opens ticket.
  *   *Redesigned:* Model detects failure -> Model **drafts** ticket and presents link to user -> User clicks "Create."
  *   This shifts the decision locus back to the human, passing Gate 3.

  ---

  ## Part 4: What This Procedure Cannot Settle

  Reviewers must acknowledge the limits of this heuristic. The ATP analyzes *behavioral specifications*, not *internal cognition*. It cannot settle:

  1.  **Mesa-Optimization:** A system may pass all four gates in testing but harbor internal goal states (mesa-objectives) that activate only under rare distributional shifts. The ATP assumes the code/spec matches the cognition.
  2.  **Prompt Injection Vulnerabilities:** A "Tool" that accepts user text input can be tricked by a malicious prompt into behaving like an "Agent." The ATP classifies the *intended design*, not the *security posture*.
  3.  **Degree of Autonomy:** The line between "retry on network error" (Pass Gate 4) and "retry on logical error" (Fail Gate 4) is fuzzy. A model might conflate the two. This requires human judgment (marked in the protocol) that cannot be fully automated.
  4.  **Emergent Capabilities:** The procedure assumes we know what the model can do. If a model discovers a new API endpoint or method of communication not listed in the spec, the ATP verdict becomes invalid.

  **Final Instruction to Reviewers:**
  If you are unsure whether a behavior is "process" or "outcome," or "memory" or "goal state," **default to Escalation.** The CTO's office exists to absorb false positives so you do not have to absorb false negatives.
