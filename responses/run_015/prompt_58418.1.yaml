prompt: |-
  I have followed the tool versus agent AI debate in rationalist forums for years and now lead weekly safety reviews for a team building LLM-based laboratory assistants. Please turn that distinction into a concise, reusable procedure my reviewers, who have no philosophy background and have under an hour per feature, can apply to decide whether a proposed capability is acceptably tool-like or has crossed into agency requiring escalation to the CTO. Give ordered questions or tests, what counts as passing each, and mark explicitly where the call is irreducibly judgmental rather than mechanical. Then run the procedure on three proposals: a literature summarizer that retains no state between queries; an overnight experiment monitor allowed to rerun failed controls within a fixed budget, message collaborators about delays, and carry objectives across sessions; and a coding helper that, without being asked, opens follow-up tickets when it notices related test failures. Include analysis of a case where the verdict will frustrate product velocity, and close with what the procedure cannot settle.
reasoning: |-
