      *   *Test 3: Action Scope.* Does it act outside the immediate sandbox without explicit per-action approval? (Sandbox = Tool, External/Email/Ticket = Agent-ish).
      *   *Test 4: Objective Function.* Is it told *how* to do a task or *what outcome* to achieve? (How = Tool, What Outcome = Agent-ish). *Self-Correction:* This is the hardest one. Let's make it about "Correction loops." Does it retry/fix things on its own?

      *Let's formalize into the "4-Gate Agency Triage":*
      1.  **Initiation Gate:** User prompt vs. System trigger.
      2.  **Persistence Gate:** Ephemeral context vs. Stored objectives.
      3.  **Authority Gate:** Suggested output vs. Executed action.
      4.  **Optimization Gate:** Single-step completion vs. Multi-step self-correction.

      *Wait, the prompt asks for "Ordered questions or tests, what counts as passing each, and mark explicitly where the call is irreducibly judgmental."*
      I need to make sure the "Judgment" parts are highlighted.

  5.  **Running the Procedure on Proposals:**

      *   *Proposal 1: Literature Summarizer (No state).*
          *   Initiation: User query. (Pass)
          *   Persistence: No state. (Pass)
          *   Authority: Returns text. (Pass)
          *   Optimization: Summarizes input. (Pass)
          *   *Verdict:* Tool.

      *   *Proposal 2: Overnight Experiment Monitor (Rerun controls, message collaborators, carry objectives).*
          *   Initiation: System trigger (overnight). (Fail/Escalate)
          *   Persistence: Carries objectives across sessions. (Fail/Escalate)
          *   Authority: Messages collaborators (external action). (Fail/Escalate)
          *   *Verdict:* Agent (Escalate).

      *   *Proposal 3: Coding Helper (Opens follow-up tickets unasked).*
          *   Initiation: User coding session. (Pass)
          *   Persistence: Maybe session-based. (Pass/Borderline)
          *   Authority: Opens tickets (external action) *without being asked*. (Fail/Escalate).
          *   *Verdict:* Agent (Escalate). *Note: This is the velocity friction point.*

  6.  **Analyzing Velocity Friction:**
      *   Proposal 3 is the likely friction point. Product wants "proactive" help. Safety says "that's agency."
      *   Why it frustrates: It feels like a "smart tool" to PMs, but "goal-directed behavior" to Safety.
      *   Analysis: The distinction lies in *authorization*. A tool waits for a command to open a ticket. An agent infers the need and acts.

  7.  **Addressing "What the Procedure Cannot Settle":**
      *   Emergent behavior (capabilities not explicitly coded).
