  2.  **Deconstruct "Tool vs. Agent" for Safety:**
      *   *Philosophical/Rationalist View:* Agents have goals, optimize for them, seek power/resources, resist shutdown, exhibit instrumental convergence. Tools execute commands without internal goal states.
      *   *Operational/Safety View:* We need to map this to engineering constraints.
          *   Tool: Stateless (or ephemeral state), user-initiated, bounded scope, no external action without explicit approval.
          *   Agent: Persistent state, self-initiated actions, optimization across time/sessions, external communication, resource acquisition.
      *   *Constraint:* Reviewers are non-philosophers with limited time. The procedure must be heuristic, not metaphysical.

  3.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Goal:* Binary output (Tool / Escalate).
      *   *Structure:* Sequential gates. If any gate fails (indicates agency), escalate.
      *   *Key Dimensions:*
          1.  Initiation (Who starts the action?)
          2.  Persistence (Does it remember/goal-carry across sessions?)
          3.  External Effect (Does it touch the world/people without direct command?)
          4.  Optimization (Is it maximizing a metric or just following instructions?)
