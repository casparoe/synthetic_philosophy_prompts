  | Requirement | Motivation (Case/Datum) | Status |
  | :--- | :--- | :--- |
  | **Ex Ante Applicability** | Real conspiracies (e.g., Watergate) are acknowledged years later; an account cannot define conspiracy theories as unwarranted by definition or rely on hindsight to validate past suspicion. | Non-negotiable |
  | **Immunization Detection** | The escalation structure where denial confirms guilt; the account must distinguish reasonable caution from circular unfalsifiability without waiting for final outcomes. | Non-negotiable |
  | **Scale-Adjusted Burden** | A plot involving three people differs from one involving hundreds; evidentiary thresholds must scale with the number of conspirators and duration to match expected trace leakage. | Non-negotiable |
  | **Non-Deferential Arbitration** | The adjudication gap where institutions are suspected of complicity; the account must specify what replaces expert consensus without defaulting to universal suspicion. | Non-negotiable |
  | **Provenance Discrimination** | Planted evidence (e.g., forged leaks) is cheap; the account must distinguish genuine artifacts from forgeries or concede the limit where this cannot be told by a non-specialist. | Non-negotiable |
  | **Dual-Level Verdict** | Proposition vs. Inquiry divergence; the account must deliver separate verdicts on the truth of the claim and the epistemic health of the community circulating it. | Non-negotiable |

  **Findings on Compatibility and Scope.** I suspect **Non-Deferential Arbitration** and **Provenance Discrimination** cannot be jointly satisfied for a non-specialist: if institutions are complicit, the layperson lacks the technical means to authenticate leaks without relying on the very authorities they suspect. Regarding existing families, the **Generalist** view (conspiracy theories are prima facie defective) fails **Ex Ante Applicability** by building unwarrantedness into the definition, while the **Particularist** view (assess like any empirical claim) typically fails **Dual-Level Verdict** by ignoring the sociological effects of the inquiry community. The single requirement that excludes the most otherwise-attractive accounts is **Dual-Level Verdict**, as standard epistemological frameworks rarely separate propositional justification from the health of the inquiry process.

