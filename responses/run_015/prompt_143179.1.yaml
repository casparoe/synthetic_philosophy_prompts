  2. Your newest result relies on back-averaging from a movement time that, on vetoed trials, never happened. Critics will argue that jitter in the timing of the veto relative to the hypothetical movement time will smear any precursor signal to zero in an average. How do you distinguish genuine absence of pre-SMA activity from this statistical artifact?
     *Follow-up:* Given that constraint, what specific experimental design—single-trial decoding, different alignment markers—would settle the distinction between smear and genuine absence for skeptics?

  3. If conscious will raises the threshold to veto an urge, what triggers that conscious intervention? If there is an "urge to veto," should we expect to see a neural precursor for that urge, and if so, does that not restart the regress of who vetoes the veto?
     *Follow-up:* If you claim the veto is a control process distinct from the urge accumulation, does it have its own neural signature, and why does it escape the deterministic drift you attribute to the motor system?

  4. The Libet clock method for reporting the time of conscious urge is known to be susceptible to retrospective reconstruction and systematic bias. If the 550 ms versus 200 ms gap is partly an artifact of measurement, does the temporal window you rely on for the veto to operate retain any metaphysical significance?
     *Follow-up:* If the timing is unreliable, does your model collapse into a claim about logical priority rather than temporal priority, and does that change the causal story?

  5. You claim vetoing late feels effortful and that this veto is causally efficacious. Is the feeling of effort merely the phenomenological readout of threshold modulation, or is it the mechanism by which the threshold is raised?
     *Follow-up:* If it's just the readout, how does the phenomenology exert causal power without violating closure, and if it's the mechanism, why is it only efficacious in inhibition and not initiation?

  6. You call it the "Endorsement Model," but the mechanism you describe is primarily inhibitory—raising a threshold to prevent release. Is there a positive neural signal for endorsement, or is the model effectively just "Free Won't" with a different label?
     *Follow-up:* If endorsement is just the absence of a veto, doesn't that make conscious will purely negative, and how do you account for cases where we feel we positively initiate?

  7. The null result in the pre-SMA on vetoed trials suggests the motor plan was never finalized. Does this mean the veto erases the motor plan entirely, or does it inhibit the output while the plan persists elsewhere?
     *Follow-up:* If the plan persists but doesn't execute, how do you distinguish your model from a standard inhibition model where consciousness is epiphenomenal to the inhibition mechanism?

  8. Your model grants us "Free Won't," but moral responsibility typically attaches to what we do, not merely what we fail to refrain from doing. How does a power of veto ground authorship for positive actions that were initiated unconsciously?
     *Follow-up:* Does this imply that negligence is the only form of responsibility compatible with your model, or can endorsement without initiation still constitute authorship?

  9. The data comes from spontaneous finger flexions with no reasons, but most human action is deliberated and reason-driven. Are arbitrary motor tasks truly a valid proxy for the neural architecture of reasoned action, or does reasons-responsiveness require a different mechanism?
     *Follow-up:* If reasons enter the accumulator as biasing signals, does that not imply consciousness is involved in the initiation via reasoning, contradicting the "no initiation" claim?

  10. Finally, what single empirical finding would force you to abandon the Endorsement Model?
      *Follow-up:* If you found a neural precursor time-locked to conscious intention that preceded the RP, would that be sufficient, or would you adjust the model to accommodate it?
