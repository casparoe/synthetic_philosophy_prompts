answer: |-
  First off, take a breath. Your brain isn't fried; you're just doing the hard work of reverse-engineering a philosophical framework. That is genuinely difficult, especially when a professor's intuitions seem slightly shifting (like the visitor exception).

  Based on the verdicts you've provided, Prof. Miller isn't running a simple "Follow the Law" or "Follow Local Custom" rule. If she were, jaywalking would be wrong and visitor tipping would be obligatory.

  Here is a breakdown of the likely rule she is using, the distinction between the norms, and which of your cases will actually help you prove it.

  ### 1. The Core Principle: "Vulnerability and Reliance"
  The strongest pattern in Miller's verdicts is that **moral weight scales with how much others rely on you and how vulnerable they are to your actions.**

  *   **Tipping (US):** Servers rely on tips for livelihood (High Vulnerability). *Verdict: Moral Obligation.*
  *   **Grocery Queue:** People rely on the line for essentials/time (High Reliance). *Verdict: Strong Wrong.*
  *   **Bar Queue:** People are there for leisure; the "line" is often fluid (Low Reliance). *Verdict: Faux Pas.*
  *   **Jaywalking (Empty):** No one relies on you standing still; no one is endangered (Zero Vulnerability). *Verdict: Not Wrong.*
  *   **Visitor Tipping:** The server cannot *rely* on you knowing the custom (Broken Reliance Chain). *Verdict: Excused.*
  *   **Visitor Queueing:** The line is visible; people rely on the visual order regardless of your knowledge (Reliance Intact). *Verdict: Obligated.*

  **The Rule:** An action is morally obligatory if it prevents harm or unfairness to others who are **reliant** on your compliance, unless that reliance is broken by unavoidable ignorance.

  ### 2. Are Queueing and Tipping the Same Kind of Norm?
  **No.** This is the most important insight for your paper. Miller treats them differently, and the "Visitor" exception proves it.

  *   **Tipping is an *Epistemic* Norm:** It depends on what you *know*. If you don't know the custom, the obligation vanishes. It is a specific social contract regarding economic redistribution.
  *   **Queueing is a *Fairness* Norm:** It depends on what you *do*. It is about procedural justice. Because a line is visible, you are expected to perceive it. Ignorance is not an excuse because the "harm" (cutting) is immediate and visible to the victims.

  **Why this matters:** Miller likely views Queueing as universal (fairness is always good), whereas Tipping is local (economic customs vary).

  ### 3. Analyzing Your Three Test Cases
  Here is how Miller would likely judge these based on the "Vulnerability and Reliance" rule, and what each case tests.

  **Case 1: The European Reverse-Tip Jar**
  *   **The Scenario:** Voluntary, but locals feel insulted if you don't contribute.
  *   **Miller's Likely Verdict:** **Faux Pas / Weak Obligation.**
  *   **Why:** Unlike US tipping, European servers usually have a living wage. The "vulnerability" is lower. The "harm" is offended feelings, not economic survival.
  *   **What it Tests:** This tests the **Economic Necessity** variable. If she says it's a *moral obligation*, she values "Local Custom" over "Economic Harm." If she says it's *optional*, she sticks to the Harm principle.

  **Case 2: The Concert Ticket Bot**
  *   **The Scenario:** Using software to cut a virtual line.
  *   **Miller's Likely Verdict:** **Strong Moral Wrong.**
  *   **Why:** This is the digital equivalent of the Grocery Queue. Tickets are scarce resources. Others are reliant on fair access. The fact that it is invisible (digital) doesn't remove the harm to the other buyers.
  *   **What it Tests:** This tests the **Visibility** variable. Does the norm hold if the victims can't *see* you cut? (Miller should say yes, because the *harm* remains).

  **Case 3: Queueing for an Empty Tokyo Train**
  *   **The Scenario:** Lining up perfectly when the platform is deserted.
  *   **Miller's Likely Verdict:** **Not Morally Required (Permissible to not queue).**
  *   **Why:** This is the direct parallel to **Jaywalking on an Empty Road**. If there is no one to be harmed, no one to be treated unfairly, and no one relying on the order, the moral obligation evaporates. It might be "polite," but not "moral."
  *   **What it Tests:** This tests the **Harm/Victim** variable.

  ### 4. Which Case Best Distinguishes the Rules?
  You asked for the case that best tells competing rules apart. That is **Case 3: The Tokyo Train.**

  Here is why. There are two alternative rules that fit Miller's past verdicts almost as well as the "Vulnerability" rule:

  *   **Rule A (The Harm Principle):** Morality is about preventing harm/unfairness to others. (Fits Jaywalking, Grocery, Tipping).
  *   **Rule B (The Social Order Principle):** Morality is about maintaining the structure of society and respecting local systems. (Fits Queueing, Tipping, Visitor Queueing).

  **The Split:**
  *   If **Rule A** is true: Queueing on an empty platform is pointless. There is no social order to disrupt and no one to harm. Miller should say **it is fine not to queue.** (Consistent with Jaywalking).
  *   If **Rule B** is true: Queueing is a duty to the *system*, not just the people. Even if empty, you respect the train system's order. Miller should say **you ought to queue.** (Inconsistent with Jaywalking).

  **Prediction:** Given her stance on Jaywalking, she will likely say **Case 3 is morally neutral.** This confirms she is a Consequentialist about norms (focused on harm/outcomes) rather than a Deontologist (focused on rules/duty).

  ### 5. Summary for Your Paper
  If I were writing this, I would structure the argument like this:

  1.  **Thesis:** Prof. Miller distinguishes between **Fairness Norms** (Queueing) and **Convention Norms** (Tipping).
  2.  **Evidence:** The "Visitor Exception." Visitors are excused from Tipping (Convention requires knowledge) but not Queueing (Fairness is visible/universal).
  3.  **The Unifying Rule:** Moral obligation arises from **Reliance and Vulnerability.** (Jaywalking is okay because reliance is zero; Grocery cutting is bad because reliance is high).
  4.  **The Critical Test:** The **Empty Tokyo Train**. If Miller says queueing is unnecessary here, it proves her rule is based on *harm to others*, not *respect for rules*. This aligns her with the Jaywalking verdict and cements the "Vulnerability" theory.

  You're not rambling; you've actually identified the exact tension in her philosophy (the visitor exception is the key). Focus on that distinction between "knowing the rule" (tipping) and "seeing the harm" (queueing), and you'll have a solid paper.
