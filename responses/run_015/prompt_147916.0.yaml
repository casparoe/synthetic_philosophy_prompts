  Here are the two rules that best systematize your supervisor's six verdicts, their predictions for your case, and my strategic advice for your supervision.

  ### The Two Competing Rules

  **Rule 1: Default Entitlement with Domain-Specific Defeaters (Anti-Reductionism)**
  *   **Principle:** A hearer is *prima facie* justified in accepting any presentation that functions as testimony (including non-human sources, per Case 5). Justification is the baseline; it is only defeated by (a) implausible content (Case 2) or (b) evidence of unreliability *in the specific domain* of the claim (Case 3). Global statistics about the source's reliability (Case 6) or a lack of positive evidence for reliability (Case 1, 4) do not defeat justification.
  *   **Prediction for App Case:** **Justified.**
      *   **Why:** The app output counts as testimony (following Case 5). There is no content-based defeater (museum hours are mundane, unlike the conspiracy in Case 2). The 90% track record is positive, and the 10% error rate is global/mixed (like the liar's money vs. capitals in Case 6); since you have no reason to think "museum hours" falls into the unreliable 10%, the general statistic is not a domain-specific defeater. The disclaimer is generic and does not function as a specific warning about *this* claim.

  **Rule 2: Normative/Institutional Competence (Modified Assurance)**
  *   **Principle:** Justification requires the source to be embedded in a normative structure of accountability or competence (e.g., professional role, institutional curation, social convention). Mere statistical correlation is insufficient; the source must be situated such that it *ought* to be accurate and can be held to that standard (even if anonymously, per Case 5).
  *   **Prediction for App Case:** **Not Justified.**
      *   **Why:** While the Museum Card (Case 5) and Consultant (Case 4) are backed by institutions that curate truth, and the Stranger (Case 1) operates under a social convention of helpfulness, the App is explicitly described as a statistical pattern-matcher with a disclaimer waiving accuracy ("answers may be inaccurate"). It lacks the normative "door plaque" or institutional embedding that transforms information into testimony warranting belief. It is a tool, not a witness.

  ### My Best Guess at Her Verdict

  **Verdict:** **Justified.**

  **Reasoning:**
  I predict she will rule **Justified** because **Case 1 (The Stranger)** sets a very low bar for justification, and **Case 5 (The Museum Card)** removes the requirement for human agency.
  *   If a stranger with *zero* track record and *no* institutional backing is justified in telling the time (Case 1), it would be inconsistent to deny justification to an app with a *90% positive track record*, unless the "no beliefs/intentions" clause is a hard stop.
  *   But Case 5 explicitly confirms that "no idea who wrote it" (and by extension, no believing agent) is compatible with testimony and justification.
  *   The disclaimer ("may be inaccurate") is likely treated as legal noise rather than an epistemic defeater, similar to how the stranger's lack of credentials is not a defeater in Case 1. The 90% reliability is significantly better than the baseline assumption we grant the stranger.

  ### Closest Analog & Key Case

  *   **Closest Analog:** **Case 1 (The Stranger at the Bus Stop).**
      *   **Why:** Both involve a mundane, low-stakes factual query (time vs. closing hours) from a source with whom the hearer has no personal relationship. In both cases, the hearer lacks specific positive evidence of reliability *for this specific interaction*, yet is still justified. The app actually has *more* going for it (a 90% track record) than the stranger (unknown reliability).
  *   **Case Doing the Most Work:** **Case 5 (The Museum Card).**
      *   **Why:** This is the linchpin. Without Case 5, a traditional "Assurance View" (testimony requires a responsible human agent) would rule out the app immediately due to its lack of beliefs/intentions. By insisting the unsigned card *is* testimony, your supervisor has signaled that **agency is not a necessary condition**. This opens the door for the app to qualify as a testimonial source, making the debate about reliability rather than ontology.

  ### The Tie-Breaker Case

  To distinguish between **Default Entitlement** (Rule 1) and **Normative Competence** (Rule 2), I would present the following case:

  **The Park Bench Note:**
  > "You are waiting for a bus in an unfamiliar city. You find a typed, unsigned note pinned to a random park bench (not a bus stop, not an official board) that lists the bus schedule. You have no idea who put it there or why. It looks neat and official, but it is not attached to any institution. You check the time on your watch; it matches the note's 'current time.' Are you justified in believing the future bus times listed?"

  *   **If she says Justified:** She supports **Default Entitlement**. The source has no institutional backing (unlike Museum/Hospital) and no social convention (unlike Bus Stop Stranger), yet the informational presentation suffices. This confirms the App should be justified.
  *   **If she says Not Justified:** She supports **Normative Competence**. The lack of institutional or conventional embedding defeats justification, even if the content looks accurate. This suggests the App (lacking institutional authority) would also be Not Justified.
