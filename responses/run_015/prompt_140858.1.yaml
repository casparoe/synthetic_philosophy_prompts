answer: |-
  This is a clean, well-isolated dynamic. You have found a corner of the parameter space where the standard vocabulary (Kin Selection, MLS1/2, Niche Construction) blurs because the *temporal* dimension of the collective is doing work that is usually conflated with the *fecundity* dimension.

  Here is the anatomy of the thing you are seeing, carved along the lines you requested.

  ### 1. Is the collective doing causal work?
  **Yes, but as a mediator, not a replicator.**

  In the "Units of Selection" debate (Lewontin, Godfrey-Smith, etc.), a unit must satisfy Variation, Heritability, and Fitness (differential reproduction). Your patches satisfy Variation (lifespan differs) and Heritability (trait causes lifespan), but they fail **Reproduction**. They do not bud daughter patches. They persist and then vanish.

  Therefore, the patch is not a *Darwinian Population*. It is a **Selective Context with Endogenous Decay**.

  *   **The Causal Chain:** Trait $\rightarrow$ Patch Stability $\rightarrow$ Increased Duration $\rightarrow$ Increased Iterations of Within-Patch Selection $\rightarrow$ Trait Frequency Increase.
  *   **Formalism:** To settle this formally, look at the fitness function.
      *   Standard Individual Fitness: $w_i = f(\text{phenotype}_i, \text{environment})$.
      *   Your Fitness: $w_i = f(\text{phenotype}_i, \text{environment}, \text{duration}(\text{phenotype}_{\text{patch}}))$.
      *   Because $\text{duration}$ is a function of the trait (either the focal individual's or its neighbors'), the environment is not a fixed background parameter (like temperature); it is a dynamic variable coupled to the genotype frequency.
  *   **Verdict:** The collective is a causal *multiplier*. It modulates the magnitude of the individual selection coefficient by altering the time horizon over which that coefficient integrates.

  ### 2. How is this different from Group Selection (MLS)?
  **It is Differential Persistence vs. Differential Propagation.**

  Standard Multi-Level Selection (specifically MLS2, where groups are replicators) relies on **Group Fecundity**: Groups with more cooperators produce *more daughter groups* (or more migrants that found new groups). The "between-group" term in the Price equation is a covariance between group trait and group *offspring number*.

  Your mechanism relies on **Group Survival** acting as a **Time Multiplier**.
  *   In standard MLS, a long-lived group is only favored if that extra time translates into more *output* (migrants/offspring groups) that enter the global pool. You explicitly decoupled this: your long-lived patches can produce *less* total output and still win.
  *   Why? Because the "winning" isn't about how much stuff leaves the patch; it's about how many rounds of *internal sorting* happen before the patch dies.
  *   **The Math:** In standard MLS, the group term is $\text{Cov}(W_{\text{group}}, Z_{\text{group}})$. In your case, $W_{\text{group}}$ (total output) might be uncorrelated or negatively correlated with $Z$. The driver is that individual fitness $w_i$ is integrated over time $T$, where $T$ is correlated with $Z$.
      *   Standard MLS: $\Delta p \propto \text{Output}_{\text{high-Z}} - \text{Output}_{\text{low-Z}}$
      *   Your Mechanism: $\Delta p \propto \int_0^{T_{\text{high-Z}}} s \, dt - \int_0^{T_{\text{low-Z}}} s \, dt$
      *   Even if the rate of output is lower in the high-Z patch, if $T$ is sufficiently large, the integral of the *within-patch advantage* ($s$) compounds more.

  **Closest Neighbor:** This is structurally identical to **r/K selection** logic pushed up one level, but without the reproduction. It is "K-selection on patches" where K is lifespan, but the benefit accrues to the *individuals* via compounding, not to the *group* via fission.

  ### 3. Is it Niche Construction?
  **Yes. Specifically: Temporal Niche Construction.**

  Standard Niche Construction (NC) usually describes organisms modifying the *selective pressure* (the slope of the fitness landscape) or the *state of resources*.
  *   Example: Earthworms change soil pH, which changes which plants grow.
  *   Your Case: Microbes change patch decay rate, which changes the *number of selection events* experienced.

  This fits the definition of NC (organism modifies environment, environment feeds back on selection). However, it is a specific subtype often overlooked: **Regulative NC of Selection Duration.**
  *   Most NC models focus on how the niche changes *who* wins (direction of selection).
  *   Your model focuses on how the niche changes *how many times* the selection event occurs (magnitude of opportunity).
  *   **Ecological Inheritance:** Does it count? Yes. The "inherited" resource is the *continued existence of the arena*. A new immigrant entering a long-lived patch inherits a context that has been stabilized by previous bearers of the trait. This is ecological inheritance of a "stable substrate."

  ### 4. Can it be redescribed as plain individual selection?
  **Yes, and there is nothing wrong with that redescription ontologically.**

  If you define Individual Fitness ($W_i$) as "Expected total replication events over the lifetime of the patch," then this is 100% individual selection.
  *   $W_i = (\text{within-patch growth rate}) \times (\text{patch lifespan})$.
  *   If the trait increases both terms (or the product of both), it spreads.
  *   **The Catch:** This redescription is mechanistically opaque. It hides the *feedback loop*. By lumping "patch lifespan" into the individual's fitness parameter, you obscure the fact that the lifespan is a *collective property* generated by the frequency of the trait in the patch.
  *   **When to use which:**
      *   Use **Individual Selection** language if you are calculating invasion criteria or ESS.
      *   Use **Context-Dependent/NC** language if you are explaining *how* the variation in lifespan arises and is maintained.
      *   **Warning:** Do not call it Group Selection. That implies the group is the beneficiary of the reproduction. Here, the individual is the beneficiary; the group is just the vehicle that lasts longer.

  ### 5. The Edges (Boundary Conditions)

  Here is how to test if a new case fits this "anatomy":

  *   **Closed Patches (No Migration):**
      *   *Verdict:* **Not an instance.**
      *   *Why:* Without migration, there is no global pool for the trait to spread *into*. The trait simply fixes or goes extinct within that single lineage. The "spread" you observe relies on the differential contribution of survivors from long-lived patches to the common pool.
  *   **Trait Effect Independent of Frequency:**
      *   *Verdict:* **Still an instance.**
      *   *Why:* Whether one bearer stabilizes the patch or all bearers do is a detail of the NC mechanism. As long as bearers are disproportionately likely to be in the long-lived patches (which they are, because they built them or are in the ones that didn't crash), the covariance holds.
  *   **Within-Patch Advantage = 0:**
      *   *Verdict:* **Not an instance.**
      *   *Why:* If $s=0$, extending the patch life just extends a neutral drift process. The trait does not gain a systematic advantage from extra rounds; it just persists longer without changing frequency. The mechanism requires the *compounding* of a non-zero $s$.
  *   **Trait Shortens Patch Life:**
      *   *Verdict:* **Not an instance (unless trade-off exists).**
      *   *Why:* If the trait shortens life, it reduces the integration time. It would only spread if the within-patch advantage ($s$) was massive enough to overcome the loss of time. That is a standard life-history trade-off, not the specific "duration multiplier" dynamic you isolated.
  *   **Patch Reproduction (Fission):**
      *   *Verdict:* **Shifts to MLS2.**
      *   *Why:* If long-lived patches eventually split into two, you have re-introduced Group Fecundity. The dynamic becomes a mix of your "Duration Multiplier" and standard "Group Selection."

  ### Summary Definition

  If you need a label for your notes that is tight enough to test against new cases:

  **Persistence-Multiplied Selection (PMS)**
  *A evolutionary dynamic where a trait spreads because it increases the temporal persistence of the selective context (patch/host) in which it resides. The trait need not increase the total reproductive output of the context. The advantage arises because the extended duration allows for a greater number of iterations of within-context selection, compounding a slight individual-level advantage.*

  **Diagnostic Test:**
  1.  Does the trait increase context lifespan?
  2.  Does the trait have a non-zero selection coefficient ($s$) within the context?
  3.  Does the trait spread even when total context output (migrants/offspring) is controlled for or negatively correlated with lifespan?

  If yes to all three, you have PMS. It is Individual Selection, mediated by Niche Construction, operating through a Time Multiplier, distinct from Group Selection.
