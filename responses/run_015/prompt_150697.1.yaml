  # Epistemology of Knowledge Ascriptions: Decision Tree

  **Q1: The Bank (Stakes Sensitivity)**
  *Case:* S believes the bank is open Saturday. **Low Stakes:** No rush. **High Stakes:** Mortgage due Monday; if wrong, ruin.
  *Question:* Does "S knows" switch from **True** (Low) to **False** (High)?
  *   **No:** Go to **Q1b**.
  *   **Yes:** Go to **Q2**.

  **Q1b: Ordinary Knowledge (Invariantism Split)**
  *Case:* Low Stakes bank case.
  *Question:* Does S know?
  *   **Yes:** **Classical Invariantism**.
  *   **No:** **Skeptical Invariantism**.

  **Q2: The Third-Party (Ascriber vs. Subject)**
  *Case:* **Ascriber** is Low Stakes. **Subject** is High Stakes. Ascriber says "S knows."
  *Question:* Is the Ascriber's claim **True**?
  *   **Yes (True):** Truth tracks Ascriber/Assessor. Go to **Q3**.
  *   **No (False):** Truth tracks Subject. Go to **Q4**.

  **Q3: The Retraction (Disagreement)**
  *Case:* Low-stakes speaker says "She knows." Later, high-stakes speaker says "No she doesn't."
  *Question:* Did they **contradict** each other?
  *   **Yes:** **Assessment Relativism**.
  *   **No:** **Attributor Contextualism**.

  **Q4: Phantom & Borrowed Stakes (SSI Refinement)**
  *Case A (Phantom):* Subject falsely believes stakes are high (actually low).
  *Case B (Borrowed):* Stakes high for Subject's loved one; Subject is indifferent.
  *Question:* Does knowledge vanish in A or B?
  *   **Yes (Vanishes):** **Subjective/Relational SSI** (Stakes are psychological/relational).
  *   **No (Remains):** **Objective SSI** (Stakes are objective/subject-only).
  *(Note: Contextualists answer "Depends on Ascriber" regardless.)*

  ***

  **View Mapping**
  *   **Classical Invariantism:** Q1(No) → Q1b(Yes). Knowledge never shifts with stakes.
  *   **Skeptical Invariantism:** Q1(No) → Q1b(No). Knowledge always false (or rarely true).
  *   **Attributor Contextualism:** Q1(Yes) → Q2(Yes) → Q3(No). Truth fixed by ascriber's context; no contradiction across contexts.
  *   **Assessment Relativism:** Q1(Yes) → Q2(Yes) → Q3(Yes). Truth fixed by assessor's context; contradiction acknowledged.
  *   **Subject-Sensitive Invariantism (SSI):** Q1(Yes) → Q2(No). Truth fixed by subject's stakes/practical rationality.

  ***

  **Logical Space Notes**
  *   **Unclaimed Combo:** Q1(Yes) + Q2(Yes) + Q3(Yes) + Subject-Stakes Dependency. *Why:* Incoherent. Cannot track Ascriber context for truth conditions (Q2) and Subject stakes simultaneously.
  *   **Flagged Pair:** **Classical vs. Skeptical Invariantism**. Q1 alone cannot separate them (both deny stakes sensitivity). *Extra Case Needed:* "Ordinary Low-Stakes Knowledge" (e.g., knowing you have hands). Skeptics deny knowledge here; Classicalists affirm it.
  *   **Phantom/Borrowed Utility:** These discriminate *within* SSI (Objective vs. Subjective stakes). They also confirm SSI vs. Contextualism: Contextualists ignore Subject's mental state regarding stakes; SSI must account for it.

  ***
  *Word Count: ~450 words*
