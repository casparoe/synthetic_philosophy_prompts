  Here's a sorting tree built from your three required splits, plus the ventriloquism/friction distinction added as a fourth layer to catch the reader's role. I've collapsed the impossible combinations (like "copying traits" but "experiencing friction") into "Unnamed/Unstable" to keep this usable, focusing on the positions people actually hold.

  ### The Taxonomy Tree

  **Root:** Reading biography improves morality.

  **Split 1: The Contradiction Test**
  *   **A:** Contradictions ruin the lesson (Subject must be consistent).
  *   **B:** Contradictions are the lesson (Subject's complexity is the point).

  **Split 2: The Mechanism**
  *   **A:** Copy Traits (Mimetic: I adopt specific virtues).
  *   **B:** Configurational (Holistic: I understand the shape of a life).

  **Split 3: The Accuracy Test**
  *   **A:** Must be Historically True.
  *   **B:** Myth/Invention is Okay.

  **Split 4: The Reader Relation (Injected Distinction)**
  *   **A:** Moral Ventriloquism (I project my ethics onto the story).
  *   **B:** Narrative Friction (The story forces me to revise my ethics).

  ---

  ### The Leaves (Viable Positions)

  Most paths through this tree lead to dead ends (e.g., you can't really "copy traits" while experiencing "narrative friction," because copying implies you've already decided what's good). Here are the four stable leaves that actually have defenders, along with the unstable ones.

  **1. Hagiographic Literalism**
  *   **Path:** Contradictions Ruin + Copy Traits + Historically True + Moral Ventriloquism.
  *   **The View:** You need a perfect saint to imitate; any flaw invalidates the model, so you selectively focus on the holy parts.
  *   **Weirdest Commitment:** You have to accept that historical lies about a saint's perfection are morally necessary to tell the truth about virtue.
  *   **Status:** Named (Traditional Hagiography).

  **2. Parabolic Exemplarism**
  *   **Path:** Contradictions Ruin + Copy Traits + Myth Okay + Moral Ventriloquism.
  *   **The View:** The person doesn't need to exist; the story is a vehicle for pre-selected virtues you want to reinforce.
  *   **Weirdest Commitment:** You admit the biography is fiction but insist it teaches moral truth better than reality could.
  *   **Status:** Named (Didactic Fiction/Plutarch's softer mode).

  **3. Tragic Realism**
  *   **Path:** Contradictions Teach + Configurational + Historically True + Narrative Friction.
  *   **The View:** You learn by seeing how a real person's virtues and flaws tangled together to create success or ruin.
  *   **Weirdest Commitment:** You must accept that studying a morally compromised person can make you better than studying a perfect one.
  *   **Status:** Named (Modern Critical Biography).

  **4. Heroic Romanticism**
  *   **Path:** Contradictions Teach + Configurational + Myth Okay + Narrative Friction.
  *   **The View:** The "Great Man" is a mythic shape that challenges your framework, regardless of historical nitpicks.
  *   **Weirdest Commitment:** You believe a fabricated life-shape can challenge your ethics more deeply than a real one.
  *   **Status:** Named (Carlylean Hero Worship).

  **5. The Unstable/Unnamed Leaves**
  *   **Path:** Any combination of "Copy Traits" + "Narrative Friction."
  *   **Status:** Unnamed.
  *   **Reason:** If you are just copying traits, you aren't letting the text friction against your framework; you're cherry-picking.
  *   **Path:** Any combination of "Contradictions Ruin" + "Configurational."
  *   **Status:** Unnamed.
  *   **Reason:** If contradictions ruin the lesson, you can't look at the whole configuration; you have to discard the broken parts.

  ---

  ### Indistinguishable Leaves

  I have to flag that **Hagiographic Literalism** and **Parabolic Exemplarism** are practically inseparable in practice. Both rely on Moral Ventriloquism (you projecting your ethics onto the subject) and both require smoothing over contradictions. The only difference is whether the author *knows* they are lying about the history. From the reader's moral outcome, it doesn't matter if the saint was real or invented; the mechanism of "copying only the good bits" is identical. The tree treats them as separate because of the Accuracy split, but functionally, they produce the same moral learner.

  ### What Would Change My Mind

  I would collapse **Split 2 (Copying vs. Configurational)** if cognitive science showed that trait-mimicry and holistic-narrative-processing activate the exact same neural pathways for moral reasoning. Right now, I'm assuming copying is atomic (taking a virtue like "courage") and configurational is systemic (seeing how "courage" led to "rashness" in a specific context). If you proved that humans *cannot* learn a trait in isolation—that we always unconsciously process the configuration even when trying to copy—then Split 2 is false, and the whole "Exemplar" branch of the tree falls into the "Configurational" bucket. That would mean "Hagiographic Literalism" is actually just a deluded form of "Tragic Realism" where the reader ignores the configuration they are secretly processing.
