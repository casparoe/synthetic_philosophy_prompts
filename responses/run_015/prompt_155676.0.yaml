answer: |-
  **Title:** The Bifurcated Instrumentalism of Institutional Medicine: A Reconstruction of Implicit Norms

  **I. Reconstruction of the Implicit Theory**

  The institutional pattern you describe does not map cleanly onto a single philosophical theory of health, such as Christopher Boorse's Biostatistical Theory (BST) or a pure Normativist view (e.g., Lennart Nordenfelt). Instead, the practice presupposes a hybrid framework I will term **Instrumental Biostatistical Normativism (IBN)**. This framework is not philosophically unified but is bureaucratically coherent, designed to limit liability while maximizing economic productivity.

  **Core Tenets of IBN:**
  1.  **The Criterion of Eligibility (Boorsean):** To qualify for *medical* intervention, there must be an underlying "dysfunction" defined as a deviation from species-typical biological design. This explains why insulin (restoring metabolic function) is covered, while cognitive enhancers for healthy individuals (enhancement) are not.
  2.  **The Criterion of Necessity (Productivist Normativism):** Once a dysfunction is identified, the *type* of intervention funded is determined by its capacity to restore the individual to a baseline of economic independence and standard social role fulfillment.
  3.  **The Locus of Intervention (Internalism):** The "problem" is located within the organism, not the environment. Therefore, funding is directed at altering the body to fit the environment (cochlear implants), rather than altering the environment to fit the body (sign language accommodation), unless mandated by separate civil rights law (e.g., the ADA).

  **Strict Requirements vs. Good Fits:**
  *   **Strict Requirement:** The system *must* posit a biological deviation to trigger coverage. If a condition is statistically normal but socially disadvantageous (e.g., short stature in a specific labor market), it is generally excluded.
  *   **Good Fit (but not required):** The preference for "restoration" over "accommodation" fits IBN well but is not strictly required by it. A consistent IBN system *could* fund accommodations if they were cheaper than surgery, but the *Medical Model* bias treats environmental modifications as "social services," not "health care."

  **Points of Underdetermination:**
  The pattern is underdetermined between **IBN** and **Cost-Containment Pragmatism**. It is possible there is no philosophical commitment to "species-typical functioning" at all; rather, biological repairs are covered because they are one-time costs, whereas accommodations (interpreters, job coaches) are recurring expenses. The appeal to "medical necessity" may be a post-hoc rationalization for actuarial decisions. We cannot distinguish between a philosophical commitment to naturalism and a financial commitment to capped liability based solely on coverage denials.

  **II. Consistency Across Physical and Mental Health**

  The system is **theoretically inconsistent** but **operationally aligned**.

  *   **Physical Health:** Operates closer to **Boorsean Naturalism**. Pathology is objective deviation. Treatment is mechanistic repair.
  *   **Mental Health:** Operates closer to **Wakefield's Harmful Dysfunction** or **Role-Based Normativism**. As you noted, eligibility often hinges on *distress* or *impairment in social roles*, not merely statistical cognitive deviation. A sociopath may be statistically abnormal but is often untreated unless they pose a risk (harm). A grieving widow may be statistically abnormal in affect but is excluded because the "harm" is deemed normative.

  **The Unifying Thread:**
  The inconsistency dissolves if we view the underlying value not as "health" but as **risk-managed productivity**.
  *   In physical health, biological repair is the most reliable proxy for returning a worker to productivity.
  *   In mental health, biological markers are elusive; therefore, *behavioral output* (ability to work, lack of suicide risk) becomes the proxy for productivity.
  *   **The Conflict:** This explains the tension regarding Autism and Deafness. A cochlear implant is funded because it promises to make the body "standard," reducing the need for systemic accommodation. Sign language support is denied *medical* status because it admits the body will remain "non-standard," requiring perpetual social adjustment. The system prefers a one-time "fix" to a permanent "accommodation," regardless of the patient's subjective well-being.

  **III. The Capabilities Approach Counterfactual**

  If we replaced IBN with a **Capabilities Approach (CA)** (à la Sen or Nussbaum), where health is the capability to achieve valued functionings (e.g., "Senses, Imagination, and Thought," "Control over One's Environment"), the institutional practice would shift significantly.

  **Concrete Changes:**
  1.  **Redefinition of "Prosthetic":** Under CA, a sign-language interpreter or a job coach is functionally equivalent to a cochlear implant or a wheelchair. Both enable the capability of "Communication" or "Work." Coverage rules would need to categorize environmental accommodations as *medical benefits*, not legal mandates.
  2.  **Assessment Protocols:** Clinical assessments would shift from "Symptom Reduction" (Boorse/Wakefield) to "Functioning Expansion." For an autistic adult, the metric would not be "reduction of stimming" (normalization) but "increase in autonomous decision-making." If stimming aids regulation, it is preserved; if the environment causes distress, the environment is the target of intervention.
  3.  **Disability Determination:** Eligibility would not require proving "dysfunction." It would require proving a "capability gap." A person could be biologically typical but structurally disadvantaged (e.g., chronic pain without tissue damage) and still qualify for support if their capability for "Bodily Integrity" is compromised.

  **What Would Remain the Same:**
  1.  **Emergency Triage:** Saving life remains a prerequisite for all capabilities. Emergency medicine would look largely unchanged.
  2.  **Infectious Disease Control:** Contagion threatens the capabilities of the population. Vaccination and isolation protocols would remain justified.
  3.  **Palliative Care:** This is already aligned with CA (focusing on well-being rather than cure) and would likely expand, but its fundamental logic would not need reconstruction.

  **IV. Falsification Conditions**

  To convince me that the system is *not* operating on Instrumental Biostatistical Normativism, I would need to observe specific institutional exceptions that violate the "Internalism" or "Productivity" tenets:

  1.  **The "Accommodation as Treatment" Rule:** If a major health insurer reclassified long-term environmental modifications (e.g., home ramps, noise-canceling workspaces for autism) as *Phase 1 Medical Treatment* rather than *Durable Medical Equipment* or *Social Services*, this would suggest a shift toward a Capabilities or Social Model of Health.
  2.  **The "Valued Difference" Exception:** If coverage were granted for interventions that *preserve* a non-typical functioning against medical advice (e.g., funding sign-language therapy for a Deaf child *instead* of a cochlear implant, based on the family's cultural valuation), this would falsify the claim that the system is committed to "restoration to species-typical norm."
  3.  **The "Distress without Dysfunction" Rule:** If physical health coverage began to cover interventions for subjective distress where no biological dysfunction could be found (e.g., covering cosmetic surgery strictly for psychological distress *without* a deformity diagnosis), this would indicate a shift to pure Normativism/Subjectivism.

  **V. Potential Failures in Reasoning**

  I must explicitly flag three vulnerabilities in this analysis:

  1.  **The Coherence Fallacy:** My reconstruction assumes the system *has* a theory. It is highly probable that the inconsistency you observe is not a philosophical tension but **historical path dependence**. Mental health was carved out separately from physical health in insurance law (parity acts are recent). The "theory" may be an illusion imposed by an analyst looking for logic in a patchwork of regulations. If the system is merely accidental, my critique of its "inconsistency" misses the mark.
  2.  **Characterization of "Medical Necessity":** I may be overstating the rigidity of the Boorsean constraint. Insurers often deny *both* implants and accommodations based purely on cost-effectiveness (QALYs), not biological norms. If the denial of sign-language support is purely actuarial (interpreters are expensive over a lifetime) rather than ideological (Deafness is a defect to be cured), then the philosophical diagnosis is wrong. The driver is economics, not ontology.
  3.  **The Mental Health Generalization:** I have generalized mental health coverage as "Normativist." However, the rise of biological psychiatry and the push for "neurochemical correction" suggests a strong pull toward Boorsean Naturalism in mental health as well. If the trend is toward *more* biological reductionism in psychiatry (e.g., genetic testing for medication), the "bifurcation" I describe may be closing, rendering the analysis outdated.

  **Conclusion**

  The institutional pattern presupposes **Instrumental Biostatistical Normativism**: a view that treats biological deviation as the trigger for liability, but economic normalization as the goal of treatment. It is theoretically inconsistent across physical and mental domains but unified by a commitment to minimizing long-term social cost. A Capabilities Approach would demand the medicalization of accommodation, blurring the line between "cure" and "support." However, we must remain cautious not to attribute philosophical depth to what may simply be bureaucratic inertia and cost containment. The system is less a philosophy of health and more a philosophy of liability.
