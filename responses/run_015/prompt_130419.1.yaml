      *   **Task:** Provide a specific *conceptual issue* arising from this conflict.
      *   **Constraints:**
          *   Must illuminate whether family resemblance can accommodate an irreducibly private standard without collapsing into a private-language problem.
          *   Must be distinct from the Builder-game (PI §2) and Beetle-in-a-box (PI §293).
          *   Tone: Academic/Philosophical, suitable for a course paper.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Family Resemblance:* Meaning is use within a public form of life. Concepts are held together by overlapping similarities, not essential properties. Correctness is determined by agreement in judgments within the community.
      *   *Private Language Argument (PLA):* A language whose words refer to the speaker's immediate private sensations cannot be understood by anyone else. Crucially, there is no criterion of correctness for the private user (the "diary" problem in PI §258). One cannot distinguish "remembering it right" from "seeming to remember it right."
      *   *The Conflict:* The archivists operate on a public, flexible standard (family resemblance). The rogue archivist introduces a private, rigid standard ("resonance").
      *   *The Crux:* If "authenticity" is defined by the family of practices, can a private feeling legitimately claim to identify "authenticity"? If yes, does "authenticity" cease to be a public concept? If no, why does the feeling fail?

  3.  **Brainstorming Conceptual Issues:**
      *   *Idea 1: The Correction Problem.* If she says "This feels resonant," and the group says "The ink is wrong," who is right? If she is right, the public criteria are irrelevant. If the group is right, her feeling is irrelevant. (A bit too simple).
      *   *Idea 2: The Training Problem.* Can she teach others "resonance"? If not, it's private. If she tries, she's just teaching them to mimic her public behaviors, making the feeling epiphenomenal. (Close to Beetle-in-a-box).
      *   *Idea 3: The Normativity of the Borderline.* Family resemblance thrives in borderline cases (blurred edges). The private marker claims to sharpen the edge *privately*. This creates a "normative gap." The community decides based on *agreement*, she decides based on *sensation*.
      *   *Idea 4: The Diachronic Stability Issue.* Family resemblance relies on stable practices over time. A private sensation is unstable. How does she know *this* resonance is the *same* resonance as last year's? (This hits the PLA hard).

  4.  **Developing the Best Candidate (The Normative Gap/Correctness Criterion):**
      *   Let's focus on the *criterion of correctness* in borderline cases.
      *   In the archivist game, "authenticity" is a function of the weave of public practices. A decision is correct if it aligns with the technique/training/agreement.
      *   The "resonance" claims to cut through the ambiguity of the family resemblance.
      *   *The Issue:* **The Problem of Normative Isolation in Borderline Adjudication.**
      *   *Why?* Family resemblance allows for fluidity and negotiation in borderline cases. The private marker imposes a binary (resonant/not) that is inaccessible to the negotiation.
      *   *Connection to PLA:* If the resonance is the *sole* arbiter in these cases, there is no way to distinguish "correctly identifying resonance" from "misidentifying resonance."
      *   *Connection to Family Resemblance:* If the concept "authentic" now includes "resonance," does the family resemblance structure break? Yes, because one "strand" of the rope is invisible to everyone else.

  5.  **Refining the Example:**
      *   Need a specific scenario. A fragment of text where ink matches but syntax is odd.
      *   The community votes "forgery" based on the weight of public criteria.
      *   The archivist says "resonance" says "authentic."
      *   *The Conceptual Issue:* **The Severing of the Criterion from the Symptom.**
      *   In Wittgenstein's later thought, criteria are public grounds for the application of a concept. Symptoms are empirical correlations.
      *   The archivists use criteria (ink, paper, syntax).
      *   The archivist treats "resonance" as a *criterion* (definitive) but it functions like a *symptom* (correlation) that only she can see.
      *   *Wait, let's go deeper.* The issue is about the *grammar* of the word "authentic."
      *   If "authentic" is governed by family resemblance, its grammar is public. If she introduces a private rule, she changes the grammar for herself.
      *   *Specific Issue:* **The Loss of the Possibility of Error.**
      *   In the public game, she can be wrong (ink analysis proves it).
      *   In her private game, if she feels resonance, it *is* authentic. She cannot be wrong about the resonance.
      *   This creates a divergence in what "mistake" means.

  6.  **Drafting the Response (incorporating the "Normative Isolation" angle):**
      *   *Name the Issue:* The Problem of Normative Inaccessibility in Borderline Adjudication.
      *   *Scenario:* A specific restoration case (e.g., a palimpsest).
      *   *Analysis:*
          1.  Family resemblance relies on *agreement in judgments* (PI §242).
          2.  The private marker removes the possibility of public correction.
          3.  This creates a split in the *grammar* of "authentic."
          4.  It's not just Beetle-in-a-box (naming sensations); it's about *rule-following* in a practice.
      *   *Distinction from Builder/Beetle:* Builder is about ostensive definition/reference. Beetle is about reference to sensations. This is about *normative authority* in a complex practice (restoration).

  7.  **Polishing the Argument (Self-Correction during drafting):**
