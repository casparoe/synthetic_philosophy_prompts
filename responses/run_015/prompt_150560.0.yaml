prompt: |-
  Read the film Gandhi through the lens of Plutarch's Parallel Lives and the debate over whether biography teaches morality through direct emulation or through comparative judgment (synkrisis). The film is frequently accused of hagiography: it largely omits Gandhi's early racial views and his controversial experiments with celibacy, presenting him as an almost uniformly gentle exemplar. Does this sanitization undermine the film's value as moral instruction, or does it serve a pedagogical purpose by making the exemplar accessible? Compare the film's narrative strategy with Plutarch's practice of pairing lives to highlight both virtue and failure. Where does Gandhi invite comparison rather than imitation? And does the omission of Gandhi's flaws reflect a tension in hagiographic biography—between inspiring the audience and providing an honest model—that Plutarch himself navigates differently? I'd like a reading that takes both the film's cinematic choices and the philosophical literature on moral learning from lives seriously, and says what this case reveals about whether biography should display its subject's failures to be genuinely instructive.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The film *Gandhi* (1982, dir. Richard Attenborough).
      *   **Theoretical Lens:** Plutarch's *Parallel Lives* and the concept of *synkrisis* (comparative judgment) vs. direct emulation.
      *   **Key Conflict:** Hagiography (sanitization/omission of flaws) vs. Moral Instruction (honesty about failures).
      *   **Specific Accusations:** Omission of early racial views (South Africa) and controversial celibacy experiments (*brahmacharya*).
      *   **Questions to Answer:**
          *   Does sanitization undermine moral value or serve a pedagogical purpose?
          *   Compare film's narrative strategy with Plutarch's pairing/virtue-failure balance.
          *   Where does the film invite comparison rather than imitation?
          *   Does the omission reflect a tension in hagiography that Plutarch navigated differently?
          *   **Conclusion:** What does this reveal about whether biography *must* display failures to be instructive?

  2.  **Initial Brainstorming & Theoretical Grounding:**

      *   *Plutarch:* He didn't write history; he wrote biography for moral improvement (*ethos*). He explicitly states in *Alexander/Caesar* that he's looking at virtue/vice to shape the soul. *Synkrisis* isn't just "who was better?" but "how do these different approaches to virtue/vice play out?" It requires critical engagement from the reader.
      *   *The Film:* It's an epic, sweeping, reverential. Ben Kingsley's performance is iconic. It focuses on non-violence (*ahimsa*) and truth (*satyagraha*). It glosses over the "difficult" Gandhi (the naked girls sleeping next to him to test his will, his harsh treatment of his family, his early racism against Black Africans in favor of Indians).
      *   *Hagiography:* Saint-making. Meant to inspire awe. Risk: The subject becomes unattainable, thus useless as a model.
      *   *Moral Learning:* Do we learn by copying perfect saints (imitation) or by judging complex humans (critical engagement)? Modern biography tends toward the latter (debunking), classical toward the former (edification).

  3.  **Structuring the Essay:**

      *   **Introduction:** Introduce the film, the Plutarchan lens, and the central tension (hagiography vs. moral utility). State the thesis: The film's sanitization limits *synkrisis* but maximizes *mimesis* (imitation) for a mass audience, yet ultimately weakens the moral lesson by removing the struggle inherent in virtue.
      *   **Section 1: Plutarch's Method (*Synkrisis* vs. *Mimesis*):** Explain Plutarch's goal. It's not just copying; it's judging. Flaws are essential data points.
      *   **Section 2: The Film's Hagiographic Strategy:** Analyze *what* is omitted (South Africa racism, celibacy experiments). Why? To create a unified symbol of Peace.
      *   **Section 3: Pedagogical Consequences:** Does this help or hurt?
          *   *Pro:* Accessibility. A clear archetype.
          *   *Con:* Unattainability. If he's perfect, I can't be him. Also, it hides the *cost* of virtue.
      *   **Section 4: Comparison vs. Imitation:** Where does the film allow comparison? (e.g., Gandhi vs. the British, Gandhi vs. Jinnah/Partition violence). But it lacks internal comparison (Gandhi vs. his own flaws).
      *   **Section 5: The Plutarchan Contrast:** How would Plutarch handle this? He would pair Gandhi with someone (Nehru? King? A general?) to show trade-offs. He would include the flaws to show the *battle* for virtue.
      *   **Conclusion:** Answer the final question. Biography needs failure to be truly instructive because virtue is a process, not a state. The film inspires but fails to teach the *mechanics* of moral growth.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the funeral scene. It frames the life as a completed myth. Bring in Plutarch's *Life of Pericles* or the proem to *Parallel Lives*.
      *   *Plutarch:* Focus on the idea that "virtue is active." Plutarch shows great men making mistakes (Alexander's rage, Caesar's ambition). This allows the reader to say, "I would avoid that."
      *   *The Film:* Address the specific omissions. The South Africa era is shown, but the racism against Blacks is minimized. The *brahmacharya* is hinted at (Manu) but the sexual nature is sanitized. This makes him a "saint" rather than a "man."
      *   *Moral Instruction:* Use the philosophical distinction. If the goal is *awe*, hagiography works. If the goal is *ethical training*, it fails. A perfect statue cannot be emulated, only admired.
      *   *Synkrisis in Film:* The film does have comparisons (General Dyer, the British, the rioters). But these are external villains, not parallel lives. Plutarch compares *protagonists*. The film compares Gandhi to *evil*, not to *alternative goods*.
      *   *The Tension:* Plutarch navigates this by admitting flaws but contextualizing them as obstacles overcome or tragic downfalls. The film removes the obstacles.
      *   *Conclusion:* The film is a monument, not a mirror. To be instructive, biography must show the crack in the vessel.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Am I being too hard on the film?
      *   *Adjustment:* Acknowledge the cinematic constraints. A 3-hour epic can't be a doctoral thesis. Its goal was mass mobilization for peace during the Cold War.
      *   *Nuance:* Plutarch isn't purely "warts and all" in the modern sense. He still idealizes. But he includes *moral failures* relevant to the lesson. The film excludes *moral complexities*.
      *   *Key Insight:* The film presents virtue as *innate* or *static*, whereas Plutarch presents virtue as *cultivated* through struggle. The omission of the celibacy experiments removes the *struggle* against desire, which is central to Gandhi's actual moral philosophy.

  6.  **Final Polish:**

      *   Ensure terms like *synkrisis*, *mimesis*, *hagiography*, and *satyagraha* are used correctly.
      *   Check that all parts of the prompt are addressed.
      *   Strengthen the conclusion to make a definitive claim about the nature of biographical instruction.

  7.  **Final Review against Prompt:**
      *   Lens: Plutarch/Parallel Lives? Yes.
      *   Debate: Emulation vs. Comparative Judgment? Yes.
      *   Accusations: Racial views/Celibacy? Yes.
      *   Sanitization: Undermine or Pedagogical? Yes.
      *   Narrative Strategy vs. Plutarch? Yes.
      *   Comparison vs. Imitation? Yes.
      *   Tension in Hagiography? Yes.
      *   Conclusion on displaying failures? Yes.

  *(Self-Correction Note: Make sure to explicitly mention that Plutarch's "Parallel" structure is missing in the film, which is a single life, not a pair. This limits the *synkrisis* inherently.)*

  8.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  The 1982 film *Gandhi*, directed by Richard Attenborough, opens with a funeral and ends with a cremation, framing the life of Mohandas Karamchand Gandhi as a completed monument rather than an unfolding human struggle. Viewed through the lens of Plutarch's *Parallel Lives*, the film emerges not merely as a historical drama but as a specific kind of moral text: a hagiography. Plutarch wrote biography for the sake of ethical improvement, famously asserting in his *Life of Pericles* that he is "not writing histories, but lives." However, Plutarch's method relies heavily on *synkrisis* (comparative judgment) and the candid display of virtue and vice to facilitate moral reasoning.

  The film *Gandhi* is frequently accused of sanitization, omitting Gandhi's early racial prejudices in South Africa and his controversial *brahmacharya* (celibacy) experiments involving young women. By analyzing these omissions through Plutarchan theory, we can determine whether this sanitization serves a pedagogical purpose or undermines the film's value as moral instruction. Ultimately, while the film succeeds in creating an icon for *mimesis* (imitation), it fails at *synkrisis*, revealing that biography which hides failure may inspire awe, but it cannot teach the mechanics of virtue.

  ### Plutarch's Method: Virtue as Struggle, Not State

  To understand the film's deviation, one must understand Plutarch's aim. For Plutarch, biography was a mirror for the soul. He did not seek to present perfect beings, but rather to display how great souls navigated fortune, passion, and reason. In the *Life of Alexander*, Plutarch does not hide Alexander's drunken rage or his paranoia; he includes them to show how unchecked spirit (*thymos*) can corrupt even the greatest virtue. The reader is invited not just to emulate the hero's triumphs, but to judge their failures.

  Plutarch's structural innovation—the *Parallel Life*—forces the reader into active moral engagement. By pairing a Greek with a Roman (e.g., Alexander with Caesar), Plutarch creates a *synkrisis*. The reader must weigh different types of ambition, different responses to power, and different moral failures. This structure presupposes that moral learning comes from comparative judgment, not blind emulation. We learn what to avoid as much as what to pursue.

  ### The Film's Hagiographic Strategy

  Attenborough's film, by contrast, presents a singular, unpaired life. Without a parallel figure to weigh against Gandhi (Nehru and Jinnah are present but function as foils, not moral equivalents), the film defaults to hagiography. The narrative arc is one of ascension: from a shy lawyer to the "Father of the Nation" to a secular saint.

  The specific omissions are telling. The film depicts Gandhi's time in South Africa but minimizes his early views that prioritized Indian rights over Black African rights. Furthermore, the film alludes to his celibacy vows but excises the disturbing nature of his later experiments, where he slept naked with young women to test his self-control.

  From a Plutarchan perspective, these omissions strip the subject of *agency* in his moral development. If Gandhi was simply always gentle, always right, and always in control, his virtue appears innate rather than cultivated. Plutarch teaches that virtue is a muscle built through resistance. By removing the resistance (the internal struggle with lust, the external evolution from racial prejudice to universal equality), the film presents virtue as a static state of being. This makes Gandhi accessible as a symbol, but inaccessible as a model. One cannot emulate a statue.

  ### Emulation vs. Comparative Judgment

  Does this sanitization serve a pedagogical purpose? Proponents might argue that for a mass audience, a clear exemplar is necessary. In a world of moral relativism, the film offers a fixed star. If the goal is to inspire a general commitment to non-violence, the "perfect" Gandhi is a more potent rhetorical tool than the complex one. This aligns with a specific strand of ancient moralizing found in saint's lives (*vitae*), where the goal is devotion rather than critical ethical training.

  However, if we accept the Plutarchan premise that biography should teach morality through judgment, the sanitization undermines the film. By hiding Gandhi's flaws, the film removes the sites where the audience could exercise moral judgment. When Plutarch describes a flaw, he asks the reader: *Would you have acted differently? How would you have corrected this?*

  In *Gandhi*, the only comparisons invited are between Gandhi and his antagonists (General Dyer, the British Empire, Hindu rioters). This creates a binary of Good vs. Evil rather than a nuanced exploration of competing goods or the fragility of virtue. The audience is asked to imitate Gandhi against the British, not to judge Gandhi against himself. Consequently, the film invites *imitation* of the outcome (non-violence) without providing the *method* (the grueling self-scrutiny and failure that actually produced that non-violence).

  ### The Tension of Hagiography

  This reveals a fundamental tension in hagiographic biography: the conflict between *inspiration* and *honesty*. Hagiography seeks to elevate the subject to inspire the audience. But if the elevation is too great, the subject becomes divine, and the moral gap between subject and viewer becomes unbridgeable.

  Plutarch navigates this tension differently. He idealizes his subjects, certainly, but he treats their flaws as essential data. In *Life of Cato the Younger*, Plutarch admires Cato's integrity but critiques his inflexibility, suggesting that his refusal to compromise contributed to the fall of the Republic. This allows the reader to admire the virtue while learning from the strategic failure.

  The film *Gandhi* resolves the tension by choosing inspiration at the cost of honesty. It presents Gandhi's flaws as external obstacles (prison, violence) rather than internal moral complexities. For example, the film shows Gandhi fasting to stop communal violence. It portrays this as a pure sacrifice. A Plutarchan reading would demand we ask: *Is this emotional coercion? Is it healthy?* By omitting the critiques of his contemporaries regarding his methods, the film denies the audience the chance to engage in *synkrisis* regarding the ethics of satyagraha itself.

  ### What This Reveals About Biographical Instruction

  The case of *Gandhi* suggests that for biography to be genuinely instructive, it must display failure. This is not because audiences enjoy debunking heroes, but because moral learning is fundamentally diagnostic. We learn ethics by seeing where things go wrong.

  If a biography omits the subject's failures, it implies that virtue is the absence of error. Plutarch teaches that virtue is the management of error. Gandhi's actual life was a laboratory of moral risk; his experiments with celibacy were dangerous attempts to conquer desire, and his early racism was a prejudice he had to unlearn. These are the very moments that would make him a useful Plutarchan exemplar. They show that moral greatness is not a birthright but a series of corrections.

  By sanitizing these elements, the film turns Gandhi into a totem. A totem can be worshipped, but it cannot be consulted. When a viewer faces a moral dilemma, they cannot ask, "What would the movie Gandhi do?" because the movie Gandhi never faced a genuine internal moral ambiguity. He only faced external villains.

  ### Conclusion

  Viewed through Plutarch's *Parallel Lives*, Attenborough's *Gandhi* functions less as a moral guide and more as a civic myth. It prioritizes the unifying power of a perfect symbol over the instructive power of a complex human. While this makes the film a powerful tool for political mobilization, it weakens its capacity for ethical education. Plutarch understood that to teach virtue, one must show the cost of it, and the price often includes failure.

  Therefore, biography *must* display its subject's failures to be genuinely instructive. Without the shadow of vice or error, the light of virtue has no definition. A sanitized life invites admiration, but a flawed life invites engagement. By denying us the flawed Gandhi, the film denies us the opportunity to practice the comparative judgment (*synkrisis*) that is the heart of moral growth. We are left with a saint to revere, rather than a man to emulate, and in the economy of moral instruction, reverence is a currency that spends poorly.
