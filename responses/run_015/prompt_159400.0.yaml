  2.  **Initial Scan & Hypothesis Generation:**
      *   *Principle 7 (Private Sector)* seems like an outlier compared to the strict transparency demands on the state (Principle 3). Is this a tension? Maybe, but the user distinguishes state vs. private duty.
      *   *Principle 2 (No Coercion)* vs. *Verdict: Mandatory Calorie Labelling*. Is labelling coercive? It's a mandate on firms, not individuals. But does it burden the option? Not really.
      *   *Principle 1 (No Burden)* vs. *Verdict: Auto-escalation*. Auto-escalation is stickier. Is it a burden? Maybe friction.
