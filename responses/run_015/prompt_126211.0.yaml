answer: |-
  ### Examiner's Conceptual Note
  *The core philosophical tension lies in whether "all-things-considered" judgments are time-indexed. If valuation is inherently time-relative due to hyperbolic discounting, the agent never acts against their *current* judgment, dissolving synchronic akrasia. However, this fractures diachronic agency, suggesting the "self" is a sequence of distinct agents. The exam requires students to navigate whether this fragmentation eliminates weakness of will or merely redefines it as a failure of diachronic rationality.*

  ***

  ### Graduate Seminar: Philosophy of Action
  **Exam Paper: Weakness of Will and Intertemporal Choice**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 2,000 words

  **Question:**
  Consider a revising author who, each evening, faces a choice: send her finished manuscript to a publisher (securing a large, distant reward) or make one immediate stylistic revision (securing a small, present reward). Her discount curve is hyperbolic, meaning the distant reward is perpetually devalued relative to the present tweak as the moment of choice arrives. Yet, at every stage, she sincerely judges that finishing is best overall.

  Does this scenario describe genuine akrasia? Or does hyperbolic discounting demonstrate that her all-things-considered judgment is itself time-relative and therefore never truly violated? In your answer, you must analyze the structure of her preference reversal, the status of her judgment, and the implications for rational agency. Do not cite specific authors or texts; rely on argumentative reconstruction.

  ***

  ### Model Answer

  The revising author's predicament forces a distinction between synchronic inconsistency and diachronic fragmentation. To determine if this is genuine akrasia, we must first distinguish the underlying mechanics of her valuation. Unlike exponential discounting, where preferences remain stable over time, hyperbolic discounting entails preference reversal. At a distance, the author prefers the finished manuscript; in the immediate moment, the visceral pull of the revision outweighs the distant completion. This is not merely a change in action, but a inversion of ranked options based solely on temporal proximity.

  This structural shift challenges the Davidsonian condition for akrasia, which requires acting against an unconditional, all-things-considered (ATC) judgment. If the author's ATC judgment is time-indexed, then at the moment of revision, she judges revising to be best. Consequently, she acts in accordance with her current judgment, and akrasia disappears. However, the prompt stipulates she *sincerely judges* finishing is best at every stage. If her judgment remains stable while her motivation shifts, she violates the Davidsonian condition. The hyperbolic curve explains the motivational pull, but not the judgmental stability. Thus, the appearance of akrasia remains because the judgment does not align with the dominant desire, even if the discounting explains why the desire dominates.

  We must then assess the architecture of her will. Does she lack second-order volition—the desire to have different desires—or merely possess a fragmented first-order will? If she regrets the revision immediately after making it, she possesses a second-order volition against her first-order impulse. The failure is not a lack of higher-order desire, but an inability to enforce it. This suggests her will is not unified across time. She is not a single agent failing to act, but a sequence of temporal selves where the current self exploits the future self. The fragmentation lies in the discontinuity of agency rather than a singular logical contradiction.

  This fragmentation invites the use of commitment devices, such as software that blocks editing tools. Does this resolve the case? A commitment device restores diachronic consistency by binding the future self to the past self's plan. However, this exposes a deeper structural problem: rational agency requires external scaffolding to maintain continuity. If agency is only rational when constrained by pre-commitment, then "free" choice in the moment is inherently suspect. The need for a device confirms that the internal structure of valuation is insufficient for rational action over time.

  Ultimately, hyperbolic discounting does not eliminate akrasia; it transforms it. It shifts the locus of irrationality from a synchronic violation of judgment to a diachronic failure of self-governance. The author does not act against her current judgment if that judgment is fully time-relative, but if she maintains a stable judgment of "best overall" while acting otherwise, she remains akratic. The discounting curve explains the mechanism of the failure, but not its dissolution. Therefore, the phenomenon persists as a failure of diachronic rational agency, where the self cannot trust its future iterations to uphold its current values.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Pass Threshold:** 13/25
  **Distinction Threshold:** 20/25

  | Move | Criteria | Marks | A-Grade (Distinction) vs. B-Grade (Pass) | Typical Mistake |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Discounting Structures** | Distinguish exponential vs. hyperbolic via preference reversal. | 5 | **A:** Clearly defines preference reversal as the key differentiator; links proximity to value shift. <br> **B:** Defines terms correctly but fails to link reversal to the author's specific choice structure. | Treating hyperbolic discounting as simply "impatience" without noting the *reversal* of preference order. |
  | **2. Davidsonian Condition** | Explain why the ATC condition appears to fail or hold. | 5 | **A:** Nuanced analysis of time-indexed vs. stable judgment; identifies the tension in the prompt's stipulation. <br> **B:** States Davidson's view but applies it rigidly without addressing the time-relativity loophole. | Asserting akrasia is impossible simply because preferences change, ignoring the prompt's claim about stable judgment. |
  | **3. Volition Structure** | Assess second-order volition vs. fragmented first-order will. | 5 | **A:** Identifies the problem as diachronic fragmentation of agency rather than just missing higher-order desires. <br> **B:** Focuses only on Frankfurt-style hierarchy without addressing the temporal fragmentation. | Confusing second-order volition with mere regret, missing the structural fragmentation of the "self." |
  | **4. Commitment Devices** | Evaluate if devices resolve the case or expose structural problems. | 5 | **A:** Argues devices reveal the insufficiency of internal agency over time (structural problem). <br> **B:** Treats devices as a simple solution without analyzing what their necessity implies about agency. | Claiming commitment devices "solve" akrasia without discussing the implication for free agency. |
  | **5. Final Thesis** | Defend whether discounting eliminates or transforms akrasia. | 5 | **A:** Clear defense that it transforms akrasia into diachronic irrationality; synthesizes previous moves. <br> **B:** Concludes it eliminates akrasia entirely or remains agnostic without justification. | Binary conclusion (Yes/No) without qualifying the shift from synchronic to diachronic irrationality. |

  **Examiner's Guidance:**
  *   **Distinction (20-25):** Seamless integration of the five moves; the argument flows logically from the mechanics of discounting to the metaphysics of agency. The thesis is robust and acknowledges counter-arguments implicitly.
  *   **Pass (13-19):** Covers all five moves but may treat them as discrete checklist items. Argumentation is sound but lacks the synthesizing insight regarding diachronic agency.
  *   **Fail (0-12):** Misses more than two moves; relies on vague definitions of weakness of will; or attempts to cite specific texts despite instructions.
