      *   *The Crucial Difference:* The *counterparty*. In a contract, there's an innocent third party who relied on the promise. In gambling self-exclusion, the casino is often protected from liability if they let you in, but the primary enforcement is trespassing (state power). The state is the enforcer, not a private party seeking damages. This explains the asymmetry.
