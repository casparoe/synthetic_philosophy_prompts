  1.  **Deconstruct the User's Query:**

      *   **Observation:** The user notices a "patchwork" in how institutions handle pre-commitment (binding oneself against future weakness).
          *   *Example 1 (Strict):* Gambling self-exclusion lists (enforced like a contract/trespassing, hard to break).
          *   *Example 2 (Lenient):* Contract law (voidable if signed under distress/emotion, protects present self from past mistake).
          *   *Example 3 (Middle):* Retirement accounts (penalties for early withdrawal, but not blocked).
      *   **Core Question 1:** What philosophical picture of *akrasia* (weakness of will) and *personal identity over time* does this pattern presuppose?
      *   **Core Question 2:** Does it assume a "True Self" (pre-commitment) vs. "Temporary/Irrational Self"?
      *   **Core Question 3:** Can a *hyperbolic discounting model* (one continuous agent with time-inconsistent preferences) explain the enforcement differences?
      *   **Core Question 4:** Is the practice philosophically consistent, or does it smuggle in conflicting views of weakness of will (addiction vs. commercial contracts)?
      *   **Core Question 5:** If we replaced the implicit theory with a straightforward hyperbolic-discounting framework, what would change in institutional design?

  2.  **Initial Analysis & Philosophical Mapping:**

