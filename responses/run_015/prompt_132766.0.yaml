  6.  **Final Polish:** Ensure terms like *akrasia*, *diachronic identity*, *hyperbolic discounting*, and *paternalism* are used correctly. Make sure to address the "trespassing" aspect (state enforcement vs. private contract).

      *(Self-Correction during drafting)*: I should emphasize that gambling self-exclusion isn't actually a "contract" in the traditional sense. It's a regulatory license condition. The casino risks losing its license if it lets you in. You risk arrest. It's public law, not private contract. This is why it's stricter. Contract law is private. This is a huge factor in the "inconsistency."

