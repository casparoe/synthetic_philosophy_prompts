      *   **Is it Consistent?** No. It's pragmatic, not philosophical. It depends on *social cost*. Gambling addiction creates public harm (crime, welfare). Contract breaches create private disputes. Retirement failure creates public burden (social security).
      *   **Hyperbolic Discounting Framework Redesign:** If we fully adopted this view:
