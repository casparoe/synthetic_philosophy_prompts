      *   *The "Continuous Agent/Hyperbolic Discounting" View:* This is the behavioral economics view (Thaler, Akerlof, etc.). There is no "true" self, just Self$_t$ and Self$_{t+1}$. Self$_t$ wants to save, Self$_{t+1}$ wants to spend. The conflict is inter-temporal, not ontological.
      *   *The "Autonomy/Consent" View (Contract Law):* Contract law cares about the *quality of consent* at the moment of signing. If distress impaired capacity, the contract is void. This prioritizes the *present* self's autonomy over the *past* self's promise, assuming the past self was compromised.
      *   *Inconsistency:* The user is right. There is a tension. In gambling, the past self (sober) binds the future self (addicted). In contract law, the present self (distressed) can void the past self's commitment (sober/rational). Wait, actually, contract law usually voids contracts signed under *duress* or *incapacity*. But the user mentions "temporary mental distress or extreme emotion." This suggests protecting the present self from a past commitment made when vulnerable, OR protecting the present self from a past commitment made when rational but now regretted? Actually, contract law is generally *pacta sunt servanda* (agreements must be kept) unless there's a defect in formation. The user's point is likely about *cooling-off periods* or defenses like undue influence.
      *   *Retirement:* This is a "soft paternalism" or "nudge." It respects choice but adds friction.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the keenness of the observation. It's a profound inconsistency in legal and institutional philosophy.
      *   **Philosophical Picture 1: The Divided Self (Dualism):** Explain the "True Self" vs. "Addicted Self" model. This fits the gambling exclusion. It treats addiction as a disease that hijacks agency. The pre-commitment is the voice of the "real" person.
      *   **Philosophical Picture 2: The Continuous Agent (Hyperbolic Discounting):** Explain the economic view. No "true" self, just time-inconsistent preferences. Self$_{today}$ vs. Self$_{tomorrow}$.
      *   **Analyzing the Inconsistency:**
          *   *Gambling:* Assumes the pre-commitment is the "rational" one. The state acts as the enforcer for the "sober" self.
          *   *Contract Law:* Generally enforces promises, *but* allows voiding if capacity was impaired. However, the user's point about "protecting present self from past mistake" touches on the doctrine of *remorse* vs. *capacity*. Actually, contract law is mostly about protecting the *integrity of the market*. If we let people void contracts too easily, commerce stops. So contract law prioritizes *reliance interests* of the *other party*. Gambling exclusion is unilateral (casino vs. self). This is a key distinction.
