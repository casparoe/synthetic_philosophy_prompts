      *   *Humean Instrumentalism:* Reason is the slave of the passions. The model figures out *how* to get what you want (Intent), but doesn't judge *what* you want (until the Value layer kicks in).
      *   *Principal-Agent Problem:* The user is the Principal (Intent), the lab/society is the Super-Principal (Values). The model is the Agent.
      *   *Moral Agency:* The model is treated as a tool, not a moral patient or agent. It doesn't "choose" values; it complies with constraints.
      *   *The Tension:* As the user notes, in reality, "Help me hurt someone" creates a conflict. Track 1 says "Understand intent -> Help." Track 2 says "Harm -> Refuse." If they are siloed, how is the conflict resolved? Presumably, Track 2 overrides Track 1, but the *evaluation* treats them as orthogonal.

  3.  **Drafting the Response - Section by Section:**

