  Hey — quick sanity check on accuracy-first epistemology before I lean on it in a paper. As I've got it, the whole program says the only thing that matters epistemically is accuracy, i.e. being as close to the truth as possible, and every other epistemic norm is supposed to get derived from that. But then it seems to just tell us to be omniscient: the maximally accurate credence function is the one that puts 1 on every truth and 0 on every falsehood, so "maximize epistemic utility" isnt advice anyone can act on, and it says nothing about what to do with the evidence I actually have. My workaround was to say accuracy is only ever measured over the propositions I actually represent, so I could be perfectly accurate basically for free by having opinions about almost nothing — say my credence function is defined on just {2+2=4, 2+2≠4} — so I'm wondering whether the framework blocks that somehow, or whether it's a known loophole. I also briefly thought switching from the Brier score to the log score might fix the omniscience thing, since it punishes confident error infinitely hard, but being omniscient still wins under either, so I dont see what it buys me. Am I misreading the program, or is this a cost people just accept?

  One more thing: my supervisor says accuracy-first has settled probabilism, because any incoherent credence function is accuracy-dominated, so defenders of imprecise credences have supposedly lost. That feels too fast to me but I cant say why.

