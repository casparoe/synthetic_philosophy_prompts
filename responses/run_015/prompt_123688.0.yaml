  4.  **Analyzing the Disanalogies (The User's 3 Points):**
      *   *1. Homogeneity vs. Specialization:* Firms use different skills. HCH uses copies. *Impact:* Firms gain efficiency via comparative advantage. HCH gains capability via *decomposition*. If a task requires distinct expertise (e.g., law + coding), a single human copying themselves doesn't gain that expertise unless they already have it. This limits the *ceiling* of HCH compared to a firm of experts.
