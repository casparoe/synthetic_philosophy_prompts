answer: |-
  **OFFICE FOR EPISTEMIC ASSURANCE**
  **FORM P-4: PRAMĀ CERTIFICATION REQUEST (REV. 4.2)**

  **1. DECLARATION OF SOURCE**
  The applicant must identify the operative *pramāṇa* generating the primary cognition (*vyavasāya*). Tick one box only. Validity is not intrinsic; source functionality must be demonstrated.
  [ ] *Pratyakṣa* (Perception)
  [ ] *Anumāna* (Inference)
  [ ] *Upamāna* (Comparison)
  [ ] *Śabda* (Testimony)

  Claims sourced to *arthāpatti* (postulation) or *anupalabdhi* (non-perception) will be returned unread. Per Office Guideline 12.B, these are not independent sources; the former is absorbed into *anumāna*, the latter into *pratyakṣa* of an absence. Do not resubmit under these categories.

  **2. INFERENCE ANNEX (Complete only if Section 1 = Anumāna)**
  All five members (*avayavas*) must be legibly inscribed. Abbreviations are not accepted as valid markers.
  (i) *Pratijñā* (Proposition): ________________________________________________
  (ii) *Hetu* (Reason): ________________________________________________
  (iii) *Udāharaṇa* (Example with Universal Relation): ________________________________________________
  (iv) *Upanaya* (Application): ________________________________________________
  (v) *Nigamana* (Conclusion): ________________________________________________

  State the *vyāpti* (pervasion) explicitly. Provide one *sapakṣa* (positive example) and one *vipakṣa* (negative example). Note: Redundancy between members (iv) and (v) is a feature, not an error. Do not omit.

  **3. HETVĀBHĀSA SELF-ASSESSMENT**
  Confirm the reason is free from the five standard defects. Tick to confirm absence.
  [ ] Not *savyabhicāra* (the reason does not wander into the negative example).
  [ ] Not *viruddha* (the reason does not prove the opposite).
  [ ] Not *asiddha* (the reason is not unproven or identical to the prospect).
  [ ] Not *satpratipakṣa* (no equal counter-reason exists).
  [ ] Not *bādhita* (the reason is not contradicted by later perception or testimony).

  **4. NOTE ON TARKA**
  Hypothetical reasoning (*tarka*) may be submitted only as supplementary material to remove doubt regarding *vyāpti*. Grant proposals resting exclusively on *tarka* will be returned unread. *Tarka* yields no knowledge of objects; it merely clears obstacles. Do not claim otherwise.

  **5. UPAMĀNA BOX (Complete only if Section 1 = Upamāna)**
  Name the comparison sentence heard from testimony: ________________________
  Name the remembered object used for comparison (e.g., cow): ________________________
  Name the newly identified object (e.g., *gavaya*): ________________________

  **6. VALIDATION HIERARCHY**
  Per the *parataḥ* principle, validity is extrinsic. The primary cognition (Level 1) requires certification by a second-order cognition (*anuvyavasāya*, Level 2). The Level 2 cognition requires certification by a Level 3 cognition. Submit forms for all levels concurrently. Failure to provide a certifying cognition for any level results in automatic rejection of the chain.

  **7. TERMINATION OF SERIES**
  To prevent infinite regress (*anavasthā*), the Office hereby stipulates that Level 3 cognitions are deemed intrinsically valid (*svataḥ pramā*). No further certification is required for Level 3. This exemption applies solely to the third order in the chain. Applicants are reminded that Level 1 and Level 2 remain extrinsically validated. The intrinsic nature of Level 3 is an administrative necessity required for programme completion.

  **8. SCHEME EXEMPTION**
  Any cognition whose object is the Assurance Scheme itself, including the validity of Clause 7, is exempt from certification. Questions regarding the intrinsic validity of Level 3 cognitions constitute a category error and will be filed under 'Doubt' (*saṃśaya*). Criticism of the Office's own epistemic status is treated as a *hetvābhāsa* of the type *viruddha*.

  **OFFICE STAMP:** [ ] CERTIFIED [ ] REJECTED
