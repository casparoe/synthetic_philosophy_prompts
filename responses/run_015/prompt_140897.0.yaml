answer: |-
  1. You argue that calling a law of nature a "habit" anchors it in something more stable than a brute regularity, because habits are facts about agents rather than event sequences. But for a physicist looking at the data, the event sequence is all there is. What explanatory work does the "agent" do here that isn't done by simply positing a stable regularity?

      *   *Follow-up (If she says agents have reasons/intentions that stabilize the habit):* If those reasons are inaccessible to us, isn't "habit" just a placeholder for "we don't know why this regularity holds"? How is that scientifically preferable to admitting brute facticity?

  2. You say habits are facts about a person, but persons can change their minds. If laws are divine habits, does that mean the stability of physics is contingent on God's mood? If you say God is immutable, aren't you smuggling necessity back in through the back door?

      *   *Follow-up (If she says God's consistency is part of His nature, not a separate constraint):* If the consistency is guaranteed by His nature rather than the habit concept itself, isn't the "habit" language doing no heavy lifting? Why not just say the laws are necessary facts about God's nature?

  3. On miracles, you say there's no mechanistic difference between a burning bush and a candle flame; the difference is hermeneutic. But if God is the direct cause of both, what grounds the distinction between a trustworthy signal and a deception? Doesn't your answer lean on a notion of "promise" that is doing all the load-bearing work here?

  4. Your "frame argument" suggests that in a computational physics, the update rule produces the next state, not the previous state. But doesn't the rule itself look like the most causal object in the picture? If the rule is just God's habit, haven't you just relocated causation into the rule rather than eliminating it?

  5. If regularities are divine promises rather than bare patterns, how are we supposed to identify which promises were actually made? Doesn't any answer that infers the promise from the observed regularity end up circular?

  6. If my deliberation doesn't produce my action, in what sense am I the author of it? You've suggested an "authorship without production" model, but what remains of agency besides the subjective feeling of it?

  7. Pressing on that: Is "authorship without production" a coherent metaphysical category, or is it primarily a linguistic maneuver to preserve moral responsibility within an occasionalist framework?

  8. You've suggested in print that arguably nothing could count as evidence against this view, since any apparent regularity is compatible with a divine habit. If a theory is compatible with every possible observation, what is the cost of adopting it? Why should a skeptical realist prefer this over standard naturalism?
