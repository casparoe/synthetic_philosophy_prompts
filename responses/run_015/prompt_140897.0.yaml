prompt: |-
  hey — I run a small long-form podcast (mostly philosophy of religion and philosophy of science,听众 are mostly physics-adjacent agnostics who are pretty skeptical of the whole enterprise) and next week's guest is Nour Hamdi, a philosopher who just published a book updating classical occasionalism for people who already accept modern science. Background so you don't have to guess: the classical view, associated with al-Ghazālī and the Ash'arite tradition, says no created thing causes anything — when cotton touches fire, God burns the cotton, not the fire, and what we call a cause is really just God's habit of doing one thing after another. Hamdi thinks this is *good* news for science rather than bad news, and she's got three moves I want to get at:

  1. She says people only hear occasionalism as "science is just astrology, patterns with no reason behind them" because they assume a law of nature has to be either a brute regularity or a mind-independent necessity, and she says both options are bad. On her view a law is a description of a personal habit, and because habits are facts about agents rather than about event-sequences, the regularity is anchored in something that can't just stop holding for no reason. Every time I've heard her pressed on why that isn't just renaming the problem, she answers: a habit is a fact about a person, not about a sequence of events. She says this roughly twice per talk.

  2. On miracles she refuses to call them suspensions or interruptions of a law, since on her picture there's no difference at the level of mechanism between a burning bush and a candle flame. She says the difference is hermeneutic: a miracle is an event God is using to say something, and the very same event would be ordinary if it weren't. Critics point out that this makes "miracle" a matter of interpretation and she seems completely fine with that.

  3. The chapter I actually want to spend time on argues that occasionalism is the natural or "home" metaphysics of any world whose physics is computational. If the universe updates in discrete steps according to a rule, then no state produces the next state — the rule does — so the causal oomph everyone says occasionalism can't account for was never in the picture to begin with. She calls this the frame argument and thinks it converts the standard objection into a motivation.

  What I want from you: eight to ten questions, in order, that never let her simply restate any of the above. Concretely:
  - two or three that force "a habit is a fact about a person" to do real argumentative work instead of functioning as a conversation-ender, each with a follow-up keyed to the reply she's most likely to give
  - one on the deceiving-God worry: if there's no difference in the events themselves between miracle and mundane, and no creature ever makes anything happen, what is it even for God to be trustworthy here — and doesn't her answer quietly lean on a notion of promise that's doing all the load-bearing work?
  - one pushing on whether the frame argument is coherent: a rule that maps the state at one step onto the state at the next looks like the most causal object in the whole picture, so isn't she relocating causation into the rule rather than getting rid of it, and if the rule is just God's habit again we're back where we started
  - one on how we're supposed to know which promises were made: if the regularity is a promise rather than a bare pattern, how do we tell a promise from a coincidence, and doesn't any answer that reads the promise off the observed regularity end up circular
  - one on agency: if my deliberation doesn't produce my action, in what sense am I the author of it, and she's got some kind of authorship-without-production line — press hard on whether that's coherent or just a word
  - and end with a question about what could count as evidence against the view. She's said in print that arguably nothing could, since any apparent regularity is equally compatible with a habit, and I want a question that makes that unfalsifiability cost her something instead of letting her wear it as a badge of depth.

  Two constraints: dont have her define occasionalism or give the al-Ghazālī backstory (listeners can look that up, I'll handle it in the intro), and no career/background/"what got you into this" questions — I've already got that stuff. Keep them in a register that my skeptical listeners will hear as genuinely fair rather than as a setup, and please dont include questions whose answer would just be a reading list, since I can't chase down references mid-recording.
