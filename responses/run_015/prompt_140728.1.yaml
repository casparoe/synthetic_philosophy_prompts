      *   *Refinement on Q2:* The key is "opaque tracking." If I act rightly by luck or opaque causation, am I rational? Most say no. So tracking isn't enough; *knowing* or *having reason to believe* one is tracking matters.
      *   *Refinement on Q3:* Be honest. Technical results won't stop the philosophical fight. The fight is about the *point* of philosophy of mind/action here.

  8.  **Final Polish:** Check against the prompt's specific constraints (no citations, specific questions answered, diagnosis focus). The user is a PhD student, so the level should be high, avoiding basic explanations of complexity classes. Focus on the normative metaphysics.

