answer: |-
  This is a remarkably clear-sighted description of a deadlock that afflicts much of the literature at the intersection of formal epistemology and decision theory. You are correct to suspect that the recurrence of the argument is not merely a failure of imagination on the part of your participants, but a symptom of the question's structural properties. Below is a diagnosis of the stalemate, addressing your three specific queries.

  ### The Diagnosis: A Bedrock Clash Disguised as a Technical Dispute

  To answer your overarching request first: this is not merely a verbal dispute, nor is it purely empirical. It is a **bedrock clash about the function of normativity**, which is being fought on technical terrain because the technical terrain offers the illusion of precision.

  The Feasibility Camp and the Correctness Camp are not disagreeing about the same proposition with different truth values. They are advancing different conceptions of what a normative theory is *for*. The Feasibility Camp holds a **deliberative conception**: norms are algorithms for thinking, and their validity is contingent on their deployability by the agent. The Correctness Camp holds an **evaluative conception**: norms are standards of assessment, and their validity is independent of the agent's access to them.

  When these two camps argue about complexity, they are using complexity theory as a proxy for this deeper metaphysical disagreement. The Feasibility Camp points to intractability to say, 'This cannot be a rule for thinking.' The Correctness Camp points to the definition of the ideal to say, 'This remains the standard for success.' Because neither side is willing to concede their underlying conception of normativity, the argument cycles. The 'Small Faction' (the asymptotic objection) is technically correct but philosophically weak; even if we fix the problem size, the gap between the optimal solution and the feasible solution often remains insurmountable for any realistic agent, so the asymptotic defence does not rescue the normative force of the ideal.

  Your hypothesis about the three questions (Verdict, Procedure, Design) is the most promising diagnostic tool available. The stalemate persists because the group is attempting to answer a Procedure question ('What should I do?') using Verdict norms ('What is the optimal state?'), or vice versa.

  ### 1. The Computing/Complying Distinction

  Does this distinction do the work you hope, or does it beg the question?

  It does **not** bridge the gap; rather, it **exposes the locus of the disagreement**, but in doing so, it risks begging the question against the Feasibility Camp.

  Here is why: The distinction relies on the premise that a norm can be satisfied extensionally (by producing the right output) without being satisfied intensionally (by following the right process). The Correctness Camp accepts this premise as trivial; the Feasibility Camp rejects it as a category error regarding *rational* agency.

  If I am a thermometer, I comply with the norm 'register the temperature' without computing it. If I am a rational agent, the Feasibility Camp argues, my normativity is essentially tied to my capacity for reasoning. To say I can 'comply without computing' is to treat the agent as a black box whose internal machinery is normatively irrelevant. But for the Feasibility Camp, the internal machinery *is* the locus of the norm. Rationality is a property of the *process*, not merely the *product*.

  Therefore, introducing the computing/complying distinction does not solve the dispute; it forces the Feasibility Camp to articulate why process matters. If they argue that process matters because it is the only way to ensure reliability, the Correctness Camp invokes the 'tracking defence'. If they argue that process matters because 'ought implies can' applies to deliberation steps, not just outcomes, then you have returned to the bedrock clash. The distinction is analytically useful for mapping the positions, but it cannot be used as a premise to refute the Feasibility Camp without assuming the Correctness Camp's evaluative conception of norms.

  ### 2. The Failure of the Tracking Defence

  You are right to be suspicious of the tracking defence. It fails not primarily on the intractability of verification, but on the **loss of justificatory force**.

  The tracking defence argues that an agent can be rational by using a heuristic that happens to align with the ideal norm on the relevant distribution of cases. The failure occurs on two fronts:

  1.  **The Opacity Problem:** For a norm to guide action, the agent must be able to cite the norm as a reason for their action. If the link between the heuristic and the ideal is intractable to verify, the agent cannot know they are tracking the ideal. They are, from their own perspective, merely following a heuristic. If rationality requires acting for reasons, and the reason 'this tracks the ideal' is inaccessible to the agent, then the agent is not acting rationally; they are acting *in accordance* with rationality. The Correctness Camp conflates *being in a right state* with *reasoning rightly*.
  2.  **The Distributional Contingency:** As you noted, tracking is relative to a distribution of instances. If the environment changes, the heuristic may cease to track. This makes rationality **contingent on the world** in a way that normative theories usually resist. If my rationality depends on the empirical fact that hard instances of SAT are rare in my niche, then rationality is not a property of my mind, but a relation between my mind and my environment. While naturalised epistemology might accept this, it undermines the universality that the Correctness Camp typically wishes to preserve.

  The specific point of failure is the **absence of a principled account of the instance distribution**. Without knowing *why* the world presents tractable instances, the claim that the surrogate tracks the ideal is an empirical guess, not a normative justification. You cannot derive an 'ought' from a 'happens to work'.

  ### 3. Prospects for Progress

  Given this diagnosis, what counts as progress?

  You should not expect a technical result to settle the normative dispute. An average-case complexity result or a smoothed-analysis theorem will not tell the Feasibility Camp that they are wrong to demand tractability, nor will it tell the Correctness Camp that their ideals are action-guiding. Technical results only shift the empirical premises; they do not resolve the metaphysical clash about the function of norms.

  **Progress lies in conceptual differentiation, not resolution.**

  The most productive move is to adopt your three-question hypothesis (Verdict, Procedure, Design) as a formal framework for the reading group. You should propose that the group cease asking 'Is rationality tractable?' and instead ask:
  *   'For which of these three roles is tractability a necessary condition?'
  *   'Can we have Verdict norms that are intractable, provided we have Procedure norms that are tractable approximations?'
  *   'Does the Design norm require us to build agents that track the Verdict norm, even if the agents themselves cannot compute it?'

  If the group can agree to separate these questions, the stalemate will dissolve because the participants will realise they are answering different questions. The Feasibility Camp is primarily interested in Procedure norms. The Correctness Camp is primarily interested in Verdict norms. The 'Small Faction' is pointing out a mismatch between the mathematical modelling and the ontological reality of Design norms.

  **Should you expect progress?**
  You should expect progress in **clarity**, but not in **consensus**. The persistence of the argument is evidence that the question is doing work: it is marking the boundary between ideal theory and non-ideal theory. This boundary is necessarily porous and contested. If the argument stops, it will likely be because one side has tired, or because the group has agreed to talk past one another by distinguishing their projects.

  The most honest outcome is to recognise that 'rationality' is an overloaded term. In the context of Verdict norms, complexity is irrelevant (truth is truth, however hard to find). In the context of Procedure norms, complexity is constitutive (a rule you cannot follow is not a rule for you). The stalemate is the friction generated by trying to use a single word to cover both roles. Your task as convener is not to solve the friction, but to lubricate it by distinguishing the mechanisms.

  In summary: do not look for a theorem to save you. Look to the taxonomy of norms. The dispute is not ill-posed, but it is currently undifferentiated. Once you separate the evaluative standard from the deliberative recipe, the complexity results will find their proper place as constraints on the latter, not invalidations of the former.
