  ok so I'm a backend engineer and I've been chewing on this for a while and figured I'd get a consistency check before I bring it up with friends and sound like an idiot. here's roughly where I've landed on individual action and collective problems:

  (1) I've been vegetarian for like six years, basically because buying meat contributes to animal suffering and I don't want my money going to that. feels like the least I can do.

  (2) I still fly for vacations. my reasoning is that one person skipping a flight doesn't ground the plane — the airline isn't going to cancel the route because I stayed home, so my individual choice doesn't actually reduce emissions in any meaningful way.

  (3) I vote in every election, including midterms. I know my individual vote has basicaly zero chance of deciding anything, but it still feels important to do it, and I'd feel guilty not voting.

  (4) I think carbon offsets are mostly bullshit and I don't buy them. paying someone to plant trees so I can keep flying feels like paying indulgences.

  (5) I also think there's got to be a difference between consumer choices like (1) and (2) and collective action problems like voting, but every time I try to articulate it I end up tying myself in knots.

  so yeah, do these hang together? I want someone to go through them and tell me which pairs are actually in tension, which ones just look like they are, and what I'd have to give up to make it all consistent. rank the tensions by how bad they are and tell me what the cheapest fix is. I'm not married to any particular one of these — I just want to know where the problems are.
