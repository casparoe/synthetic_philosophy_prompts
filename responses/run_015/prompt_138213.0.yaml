          *   The "experience" isn't something *seen*; it's something *generated for consumption by other brain modules*.
          *   No regress because the consuming modules don't "experience" the data; they just process it. The "light" of consciousness isn't turned on inside the head; it's a status flag used for coordination.
          *   *Infra Analogy:* Microservices. Service A sends a JSON payload to Service B. Service B doesn't "experience" the JSON. It parses it. The "GUI" is the JSON schema. It simplifies the internal state of Service A for Service B. There is no "user" reading the JSON.

