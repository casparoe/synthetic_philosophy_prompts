      *(Self-Correction during drafting)*: I need to be careful not to defend Illusionism as *true*, but rather explain how it *claims* to work without collapsing. The user wants to understand the internal logic, not necessarily be converted.
      *   Key distinction: *Realism about the state, Anti-realism about the properties.*
