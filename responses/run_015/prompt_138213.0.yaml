          *   *Analogy Repair:* It's not a progress bar lying about download speed. It's a magic trick. The rabbit isn't hidden in the hat (hidden qualia); there is no rabbit. The "rabbit" is the audience's expectation.
          *   *Better Infra Analogy:* It's not a UI hiding the CLI. It's a UI that makes you think you're interacting with objects, when you're actually interacting with pointers/addresses, but the "objectness" is a useful fiction generated by the OS. Even better: It's like a debug log that says `ERROR: SOUL_CRUSHED` but the actual state is just `MEMORY_LEAK_IN_MODULE_7`. The error isn't that nothing happened; the error is labeling it `SOUL_CRUSHED`.

      *   **Step 2: Fix the "User" (Homunculus).**
          *   The user is right: A GUI implies a user.
