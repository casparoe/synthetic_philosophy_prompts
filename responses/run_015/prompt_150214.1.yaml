answer: |-
  ### The Isotope of Anger: Modeling the Mytilene Half-Life

  To treat the Mytilene Debate (427 BCE) as mere history is to miss its function as a dataset. Thucydides presents us with a rare controlled experiment in democratic volatility. The hypothesis is this: **Democratic remorse follows an exponential decay curve relative to execution lag.**

  In this model, the "radioactivity" of collective rage is highest at $t=0$ (the verdict). If the time between verdict and execution (the lag) is zero, the decay is zero, and the atrocity proceeds. If the lag is extended, the emotional intensity drops exponentially, creating a window where counter-signals (remorse, reason) can penetrate the noise.

  Mytilene is the only data point where the curve held. Sicily and Socrates prove where the model goes silent.

  ### 1. Mapping the Decay: Mytilene as Institutional Data

  **The Initial Spike ($t=0$):**
  The news of the Mytilenean revolt hits Athens. The *demos* is not a monolith; it is a reactive medium. Cleon acts as the catalyst. His rhetoric in the first assembly is designed to minimize lag. He argues for immediate punishment to maximize deterrence. The vote passes: execute all male citizens, enslave women and children.
  *   **Radiation Level:** Maximum.
  *   **Institutional Friction:** None. The machinery of death is greased by fear.

  **The Lag Phase ($t=1$ to $t=24$):**
  A trireme is dispatched. Distance: ~180 nautical miles. Time: ~24 hours.
  This is the critical variable. In a modern autocracy, the phone call ends the matter. In Athenian democracy, the physical distance of empire created a buffer. The "half-life" of the rage began ticking the moment the ship left Piraeus.
  *   **The Crews:** The rowers of the first ship are agents of the initial impulse. The rowers of the second ship (sent the next day) are agents of the decay. Thucydides notes they rowed in shifts, eating barley cakes kneaded with oil and wine, knowing they were racing a death warrant. They are the physical manifestation of the extended lag.

  **The Reversal ($t=24+$):**
  Overnight, the radiation drops. Thucydides writes that the Athenians underwent a "reaction" (*metabolē*). This is the exponential decay in action. The adrenaline of the revolt news faded; the reality of slaughtering 3,000+ people (many of whom were not ringleaders) set in.
  *   **The Second Assembly:** Cleon argues the decay is a weakness ("a democracy cannot rule an empire if it changes its mind"). Diodotus argues that the decay is a utility ("if you kill the innocent with the guilty, the next rebels will fight to the last man").
  *   **The Vote:** It is close. The decay was significant, but Cleon's isotope still had residual heat. The recall passes.

  **Verdict on the Curve:** Mytilene fits the model perfectly. The lag allowed the exponential drop in emotional intensity, permitting Diodotus's cold utilitarianism to override Cleon's hot retribution. Without the sea voyage, the decay never happens, and the massacre is total.

  ### 2. Where the Model Goes Silent: Rationality vs. Exhaustion

  The "Half-Life" model explains *when* the reversal happened, but it goes silent on *why*.

  Was the second vote more rational? Technically, yes. Diodotus's argument was purely consequentialist: don't kill them for justice; spare them for expediency. But was the *demos* actually convinced by the math, or were they just exhausted?

  The model assumes that time cools rage into reason. But time can also cool rage into apathy or confusion. The narrowness of the second vote suggests the decay was incomplete. The *demos* didn't necessarily become "wise"; they became less manic. The model cannot distinguish between **enlightened second thought** and **emotional fatigue**. It only measures the drop in voltage, not the quality of the current.

  Furthermore, the model ignores the **procedural shielding**. The reversal wasn't just about time; it was about the institutional ability to reconvene. If Cleon had successfully moved to make the first vote final (as he attempted), the lag would have been irrelevant. The half-life requires a container that allows for re-entry.

  ### 3. Stress Testing the Curve: Sicily and Socrates

  If the Mytilene Half-Life is a universal law of democratic violence, it should appear elsewhere. It does not.

  **The Sicilian Expedition (415 BCE): The Momentum Trap**
  *   **The Decision:** To invade Sicily.
  *   **The Lag:** Years.
  *   **The Decay:** Negative.
  *   **Analysis:** According to the model, the long duration of the Sicilian campaign should have allowed remorse to decay the initial enthusiasm. Instead, the opposite occurred. After the initial setback, Athens voted to send *more* ships.
  *   **Why the Model Breaks:** The "radiation" here wasn't just rage; it was **sunk cost** and **identity**. By the time the lag was sufficient for remorse, the commitment had hardened into existential necessity. The curve inverts: as time passes, the cost of stopping becomes higher than the cost of continuing. The half-life applies to *punitive* impulses, not *ambitious* ones.

  **The Trial of Socrates (399 BCE): The Ideological Plateau**
  *   **The Decision:** Guilty verdict, death penalty.
  *   **The Lag:** Roughly one month (delayed by the sacred ship to Delos).
  *   **The Decay:** Zero.
  *   **Analysis:** There was a built-in lag. Friends prepared escapes. The *demos* had time to cool. Yet, no movement arose to commute the sentence.
  *   **Why the Model Breaks:** Mytilene was a crime of passion (war panic). Socrates was a crime of principle (corrupting the youth/atheism). The half-life model relies on the volatility of emotion. Ideological conviction does not decay exponentially; it plateaus. The anger against Socrates was cold, not hot. Cold anger has a much longer half-life, effectively infinite in the context of a trial.

  ### 4. Conclusion: Mytilene as the Outlier

  Mytilene is not the rule; it is the glitch.

  The "Democracy Half-Life" model suggests that democratic atrocities are preventable if the bureaucracy is slow enough to let remorse catch up with rage. Mytilene worked because the technology of the time (sailing ships) imposed a mandatory cooling-off period that the institution (the Assembly) was still flexible enough to honor.

  Later, the institutions hardened. In Sicily, the assembly was too invested to reverse. In the case of Socrates, the grievance was too structural to fade.

  The lesson of the curve is grim: **Democracy is only safe from its own worst impulses if the execution lag is longer than the emotional half-life of the mob.** In Mytilene, the sea was slow enough to save the rebels. In Sicily and the courtroom, the machinery of the state was either too fast or too rigid. The model holds, but only in the narrow window where fear has not yet calcified into policy. Mytilene was the moment the atom split and didn't melt down. Every subsequent vote suggests the core was already overheating.
