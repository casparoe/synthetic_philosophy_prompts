  # Adversarial Collaboration Document: The Integrity Objection & The Archive Keeper

  **Date:** October 24, 2023
  **Participants:** Camp A (Integrity Priority) & Camp B (Utilitarian Flexibility)
  **Subject:** Bernard Williams' Integrity Objection and the "One Thought Too Many" Problem

  ## I. Agreed Claims
  *The following statements represent the common ground established by both camps. Both sides sign onto these premises as the foundation for further debate.*

  1.  **Existence of Ground Projects:** Moral agents possess "ground projects"—deep personal commitments, relationships, and vocations that provide life with meaning and constitute personal identity.
  2.  **Reality of Alienation:** Severing an agent from their ground projects causes a specific psychological harm known as "alienation," which is a negative moral outcome.
  3.  **Value of Life:** Saving ten human lives is a significant moral good that warrants serious consideration in ethical deliberation.
  4.  **Value of Heritage:** Preserving unique cultural heritage (such as dead languages) is a significant moral good that warrants serious consideration in ethical deliberation.
  5.  **Validity of the Scenario:** The "Archive Keeper" scenario (defined below) is a valid test case for evaluating the conflict between utilitarian calculation and personal integrity.
  6.  **Psychological Complexity:** Moral deliberation involves both cognitive reasoning (counting/weighing) and affective response (feeling/connection); a complete ethical theory must account for both.

  ***

  ## II. Table of Disagreements
  *The following table maps the exact points of divergence. Wording has been neutralized to ensure neither camp feels misrepresented.*

  | Dimension of Disagreement | Camp A Characterization (Integrity Priority) | Camp B Characterization (Utilitarian Flexibility) |
  | :--- | :--- | :--- |
  | **Source of Alienation** | Alienation is caused by the **process** of subjecting personal projects to impartial utility calculation. The act of calculating itself damages integrity. | Alienation is caused by the **outcome** of abandoning projects for insufficient reason. Calculation itself is neutral; integrity survives if projects are weighted correctly. |
  | **Status of Ground Projects** | Ground projects function as **side-constraints** or intrinsic values that define the agent. They are not merely inputs to be traded off against general welfare. | Ground projects function as **high-weight inputs** within the calculus. They have immense instrumental value because destroying them destroys the agent's capacity for well-being. |
  | **Role of Deliberation** | In personal spheres, agents should act directly from commitment (e.g., "This is my life's work"). Introducing a utilitarian step is "one thought too many." | Agents should always deliberate using the best available moral reasons. Including utility in the reasoning process ensures decisions are justified, not just felt. |
  | **Definition of Integrity** | Integrity is fidelity to one's own motivations without external mediation. | Integrity is coherence between one's actions and the objectively correct moral reasons, including personal commitments. |

  ***

  ## III. Cruxes and Predictions
  *This section isolates the three main cruxes identified by the club. Each crux includes the philosophical distinction and specific predictions for the Archive Keeper scenario.*

  **The Archive Keeper Scenario:**
  *A linguist dedicates her life to preserving dead languages in a physical archive. A crisis arises: she can burn a small, unique section of the archive to sell the ashes for medicine money that saves ten lives, or keep it intact and the ten die.*

  ### Crux 1: The Value of Ground Projects
  **The Question:** Do ground projects have intrinsic value that resists trade-offs, or do they have heavy instrumental weight that can be outweighed?

  *   **Camp A View:** Ground projects are constitutive of the self. Trading them off treats the self as a vessel for utility rather than an author of a life.
  *   **Camp B View:** Ground projects are essential components of utility. They can be traded, but only if the counter-weight (e.g., lives saved) is sufficiently massive to justify the loss of the agent's meaning.

  **Predictions for Archive Keeper:**
  *   **Camp A:** The Keeper should **not** perform the calculation. If she burns the archive to save the ten, she has committed a moral error against her integrity, even if the outcome is better. The project cannot be commensurable with the lives.
  *   **Camp B:** The Keeper **should** perform the calculation. She may still choose to keep the archive if the loss of her life's work creates enough negative utility (via her alienation/depression) to outweigh the ten lives. If she burns it, integrity is maintained because the math justified the sacrifice.

  ### Crux 2: Moral Psychology and Alienation
  **The Question:** Can an agent separate the act of counting reasons from the feeling of alienation?

  *   **Camp A View:** No. The psychological state of "counting lives" against "personal projects" inherently creates distance between the agent and their commitments. This distance *is* alienation.
  *   **Camp B View:** Yes. An agent can recognize the utility calculus while still emotionally respecting their commitment. Regret and reluctance during calculation prove integrity is intact.

  **Predictions for Archive Keeper:**
  *   **Camp A:** If the Keeper thinks, "Ten lives outweigh this section of text," she is already alienated. The presence of that thought structure indicates she views her life's work as disposable currency.
  *   **Camp B:** The Keeper can think, "Ten lives outweigh this section of text," while feeling profound grief. As long as she acknowledges the tragedy of the loss within the calculation, she remains integrated. The thought is not "too many"; it is necessary for responsible action.

  ### Crux 3: Institutional Roles vs. Personal Commitments
  **The Question:** Does the integrity objection apply differently if the project is self-chosen (personal) versus role-assigned (institutional)?

  *   **Camp A View:** The integrity objection is strongest when the project is self-chosen. Institutional roles allow for impartial calculation because the agent is acting as a functionary, not a self.
  *   **Camp B View:** The utilitarian calculus applies uniformly. However, the *weight* of the project changes based on the role. A personal commitment might weigh heavier than a job, but both are subject to the same reasoning process.

  **Predictions for Archive Keeper:**
  *   **Camp A:** If the Keeper is a **private linguist** (chosen project), calculating utility is alienating and wrong. If she is a **public trustee** (assigned role), calculation is permissible because she is acting as an institution, not herself.
  *   **Camp B:** Whether **private or public**, the Keeper should calculate. If private, her personal devastation adds weight to the "keep archive" side. If public, her personal feelings add less weight. The *method* of reasoning remains the same; only the variables change.
