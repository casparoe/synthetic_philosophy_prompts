answer: |-
  Here is a complete lesson plan for a 75-minute seminar game designed to simulate Hume's Price-Specie Flow Mechanism.

  ### **Game Title:** The Gold Trap
  **Time:** 75 Minutes
  **Students:** 25 (Split into two nations of 12, plus 1 Banker/Instructor)
  **Materials:**
  *   100 Poker Chips (Gold)
  *   100 Index Cards: 50 Red ("Wool"), 50 Blue ("Wine")
  *   2 Large Bowls (National Treasuries)
  *   Whiteboard (for tracking Price Levels)

  ---

  ### **1. The Setup (10 Minutes)**

  **Divide the Room:**
  *   **Nation A (North):** 12 Students. Left side of room. Endowed with **Red Cards (Wool)**.
  *   **Nation B (South):** 12 Students. Right side of room. Endowed with **Blue Cards (Wine)**.
  *   **The Banker:** 1 Student (or you). Sits in the middle with the 100 Gold Chips.

  **Initial Endowments:**
  *   **Gold:** Nation A gets **50 Gold**. Nation B gets **50 Gold**. (Place chips in their Treasury Bowls).
  *   **Goods:** Each student gets **1 Good Card** representing their nation's export.

  **The Objective (Crucial for preventing hoarding):**
  Tell the students: *"You are not trying to accumulate gold. Gold is useless at the end. Your goal is **Consumption**. To survive, you must consume 1 unit of foreign good per round. Your final score is the total number of rounds your nation successfully consumes. If you run out of gold and cannot buy food, your nation starves (game over for that team)."*

  **The Trading Rule (Mercantilist Phase):**
  *   You cannot consume your own nation's good. You must trade.
  *   **Price:** Fixed at **1 Gold per Good**.
  *   **Process:**
      1.  Sellers offer goods to the other nation.
      2.  Buyers pay Gold to the Banker.
      3.  Banker settles the balance: If Nation A bought 10 goods and sold 5, Nation A pays 5 Gold to Nation B.
      4.  Goods are consumed (discarded).
      5.  New Goods are dealt for the next round.

  ---

  ### **2. The Script & Round Flow (45 Minutes)**

  #### **Phase 1: The Mercantilist Dream (Rounds 1–3)**
  *Goal: Let Nation A accumulate gold without consequence.*

  **Instructor Script:**
  > "Welcome to the global market. For the first few rounds, prices are stable. You want to sell as much as possible to build your treasury. Go."

  **The Rig:**
  *   Give Nation A a temporary "Efficiency Token." In Rounds 1–3, Nation A produces **2 Goods per student**, while Nation B produces **1**.
  *   *Result:* Nation A has more to sell. Nation B runs a deficit. Gold flows from B to A.
  *   *Observation:* Nation A feels powerful. Nation B feels anxious. Gold accumulates in Nation A's bowl.

  **End of Round 3 Check:**
  *   Nation A should hold approx. 75–80 Gold.
  *   Nation B should hold approx. 20–25 Gold.
  *   **Ask:** "Nation A, how do you feel? Nation B, what is your strategy?" (Expect A to be confident, B to be desperate).

  #### **Phase 2: The Humean Shock (Round 4 Onwards)**
  *Goal: Activate the Price-Specie Mechanism.*

  **Instructor Script:**
  > "We are now entering the long run. David Hume has entered the room. The fixed price rule is abolished. Prices now reflect the money supply."

  **The Mechanism (Write on Board):**
  *   **Price Level Rule:** The price of your nation's exports is determined by your share of the Total Gold Stock (100 chips).
      *   **If your Nation holds > 60% of Gold:** Your Export Price = **2 Gold**. (Inflation)
      *   **If your Nation holds $\le$ 60% of Gold:** Your Export Price = **1 Gold**. (Deflation/Stable)

  **The Dynamics:**
  *   **Nation A (Rich):** Holds ~80 Gold. **Price = 2 Gold.**
  *   **Nation B (Poor):** Holds ~20 Gold. **Price = 1 Gold.**
  *   **The Squeeze:**
      *   Nation B buyers look at Nation A's goods: Too expensive (2 Gold). They reduce purchases.
      *   Nation A buyers look at Nation B's goods: Cheap (1 Gold). They increase purchases.
      *   **Result:** Nation A runs a massive Trade Deficit. Gold flows *back* to Nation B.

  **Run Rounds 4–7:**
  *   Watch the gold flow reverse.
  *   Around Round 6 or 7, Nation A will drop below 60 Gold. Their price drops to 1 Gold.
  *   Equilibrium is restored.

  ---

  ### **3. The Freeze Point (5 Minutes)**

  **When to Freeze:**
  Stop the game immediately after Nation A's price drops back to 1 Gold (when they cross the 60% threshold downwards). Do not let them stabilize completely.

  **The Question:**
  > "Stop trading. Look at the gold flow. In Round 3, Nation A was winning. In Round 6, Nation A was bleeding gold. No one changed the rules of trade, only the money supply changed. **What just happened to Nation A's competitiveness?**"

  **Expected Student Insight:**
  *   "Their goods became too expensive."
  *   "They priced themselves out of the market."
  *   "The gold they hoarded made them uncompetitive."

  ---

  ### **4. The Debrief (15 Minutes)**

  Map the game phases directly to Hume's argument on the whiteboard.

  | Game Phase | Economic Concept | Mercantilist View | Hume's Correction |
  | :--- | :--- | :--- | :--- |
  | **Rounds 1–3** | **Trade Surplus** | "Accumulate gold! It is power." | Gold is just a medium of exchange. |
  | **Round 4** | **Money Supply Shock** | (Ignored) | More gold = Higher Prices (Inflation). |
  | **Rounds 5–6** | **Loss of Competitiveness** | "We are rich, we should win." | High prices kill exports. |
  | **Round 7+** | **Specie Flow** | "Protect the gold!" | Gold *must* flow out to restore balance. |

  **Key Discussion Questions:**
  1.  **Mercantilist Error:** "Nation A, you had 80% of the world's gold. Why did you feel poorer in Round 5 than in Round 1?" (Answer: Because your gold couldn't buy foreign goods; your domestic prices were inflated).
  2.  **Automaticity:** "Did I force Nation A to ship gold back? Or did they choose to?" (Answer: They chose to buy cheap goods from B. The mechanism is decentralized).
  3.  **Policy Implication:** "If you are the King of Nation A, should you try to stop the gold outflow in Round 5?" (Answer: No, fighting it prevents price adjustment and stops trade).

  ---

  ### **5. Predictable Failure Points & Fixes**

  **1. The Hoarding Problem (Most Likely)**
  *   **Risk:** Grad students are rational maximizers. If they suspect gold = points, they will refuse to spend it, freezing trade.
  *   **Fix:** Enforce the **Consumption Victory Condition** ruthlessly. "If you end the game with gold, it is worthless. Only consumed goods count."
  *   **Backup:** Introduce a "Storage Cost." At the end of every round, tax 1 Gold from any nation holding >50 Gold. This makes gold a "hot potato."

  **2. The Math Bottleneck**
  *   **Risk:** Counting chips every round eats 10 minutes.
  *   **Fix:** Use clear bowls. Visually estimate the 60% threshold (e.g., fill line on the bowl). Or, appoint a "Minister of Finance" in each nation responsible for counting and announcing their price level to the Banker.

  **3. Collusion/Trade Strike**
  *   **Risk:** Nation B realizes if they stop buying, Nation A suffers. They might try to hold out for concessions.
  *   **Fix:** Make demand **inelastic**. Rule: "Every student *must* consume 1 good per round to stay in the game." They can choose *where* to buy, but they *must* buy. This forces the gold flow.

  **4. The "Rich Nation" Stagnation**
  *   **Risk:** If Nation A's price is 2 Gold and B's is 1 Gold, Nation A might simply refuse to buy from B to save gold, stopping the flow.
  *   **Fix:** The **Mandatory Consumption** rule above solves this. If they don't buy, they starve (lose points). They are forced to spend their overvalued currency.

  ---

  ### **6. Honest Limitations (What the Game Can't Show)**

  Be explicit about this in the final 5 minutes. The game is a *monetary* model, but Hume's argument was also *real*.

  1.  **Wages and Employment:**
      *   *In Game:* Prices jump instantly.
      *   *In Reality:* Hume argued money inflow stimulates industry *first* (employment rises), then prices rise *later*. The game skips the "boom" phase and goes straight to inflation.
      *   *Lecture Note:* "In the game, you felt the pain of inflation immediately. Hume argued there is a 'golden interval' where increased money supply stimulates production before prices rise. That is why Mercantilist policies weren't immediately disastrous in history."

  2.  **Expectations:**
      *   *In Game:* Students know the Price Rule.
      *   *In Reality:* Merchants didn't know the Quantity Theory of Money. They just saw prices rising and were confused.

  3.  **Capital Mobility:**
      *   *In Game:* Gold only moves via trade deficits.
      *   *In Reality:* Gold can flee due to interest rates or fear, independent of trade.

  ### **Instructor Cheat Sheet: The "Aha!" Moment**
  If the students don't catch the mechanism by Round 5, intervene with a Socratic question:
  *"Nation B, you have less gold. Why are you suddenly selling more goods than Nation A?"*
  *"Nation A, you have more gold. Why can't you sell your Wool?"*

  This forces them to articulate the link between **Money Stock $\rightarrow$ Price Level $\rightarrow$ Trade Balance.**
