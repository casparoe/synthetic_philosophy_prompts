prompt: |-
  I do a science-and-ideas column, and I've been asked to walk a room of editors through Scanlon-style contractualism in the only vocabulary that survives a news meeting — so translate it, don't explain it to me as philosophy. Target vocabulary: news values (impact, reach, novelty, proximity), the anecdotal lede and the nut graf, sourcing and clearance, "who's the story about", the identifiable victim effect, proportionality of column inches, the correction standard. Assume I'm fluent in all of that; my grasp of the philosphy is a couple explainers deep, so don't assume I've read the book and don't hedge for my sake.

  The bit I actually need carried over is the aggregation problem: why a contractualist won't let an enormous number of very small complaints outweigh one person's serious complaint, and why that refusal isn't just an arithmetic mistake. Include the part about there being no impersonal standpoint in which the small complaints pool into one big one — each is a separate complaint that has to be answerable to the person who has it.

  Here's the bridge I've half-invented, and I want you to stress-test it rather than flatter it. Call it the clearance rule: before any claim goes in the piece you have to be able to answer, in one sentence, the objection of whoever ends up worst off under that claim, and you are never allowed to add complaints together across people who can't be named in the story. Run the translation through that rule as your pairwise test, and tell me where the rule quietly smuggles in something the contractualist didn't say, or where it breaks in a way that shows contractualism isn't really doing what I think it's doing.

  Then the residue report: what carries over cleanly, what only survives with distortion, and what has no expression at all in newsroom terms. Two things I want you to be blunt about. First, our impact heuristic is basically reach times severity, which is aggregative all the way down — so does any of this survive contact with how space actually gets assigned, or is the translation only possible for a desk that doesn't exist? Second, is "representative anecdote" doing the same work as the contractualist's individual standpoint, or is that a pun on the word individual? And whether each gap is newsroom vocabulary being too blunt or the philosophy being less clear than it sounds.

  After the prose, give me a table, one row per claim you translated plus one row for my clearance rule, with these columns: claim_stated_straight (the claim in plain non-technical words), newsroom_rendering (the same claim in my vocabulary), verdict (exactly one of: clean, distorted, unsayable), and diagnosis (whether the gap is my vocabulary's fault or the original claim's).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Translate Scanlon-style contractualism (specifically the aggregation problem and the no-impersonal-standpoint thesis) into newsroom vocabulary.
      *   **Audience:** A room of editors (fluent in news values, ledes, nut grafs, sourcing, etc., but not philosophy).
      *   **Constraint 1:** Do not explain it as philosophy. Translate it.
      *   **Constraint 2:** Use specific target vocabulary (impact, reach, novelty, proximity, anecdotal lede, nut graf, sourcing/clearance, "who's the story about", identifiable victim effect, proportionality of column inches, correction standard).
      *   **Constraint 3:** Focus on the *aggregation problem* (many small complaints vs. one big complaint) and the *separateness of persons* (no pooling).
      *   **Constraint 4:** Stress-test the user's proposed "Clearance Rule" (answer the objection of the worst-off in one sentence; never add complaints across unnamed people).
      *   **Constraint 5:** Provide a "Residue Report" (what carries over, what distorts, what's unsayable).
      *   **Constraint 6:** Be blunt about two specific tensions: (1) Impact heuristic (reach x severity) vs. non-aggregation, and (2) Representative anecdote vs. individual standpoint.
      *   **Constraint 7:** End with a specific table format.

  2.  **Deconstruct Scanlonian Contractualism (for internal accuracy):**
      *   *Core Idea:* An act is wrong if it violates principles that no one could reasonably reject.
      *   *Aggregation Problem:* Scanlon argues against utilitarianism. You can't just sum up small benefits to many people to outweigh a massive harm to one person. Each person has a veto based on their own standpoint.
      *   *Separateness of Persons:* There is no "social utility" bucket. Complaints belong to specific individuals.
      *   *Reasonable Rejection:* It's not about *any* objection, but *reasonable* ones based on generic reasons (not personal idiosyncrasies).

  3.  **Drafting the Translation (The "Pitch"):**
      *   *Tone:* Direct, newsroom-ready, no academic hedging.
      *   *Concept:* Treat moral principles like editorial policies.
      *   *The Aggregation Problem:* Frame it as "Column Inch Proportionality." You can't bury a libel suit (serious harm to one) under a thousand typos (minor annoyances to many).
      *   *The Standpoint:* Frame it as "Sourcing and Clearance." You need to clear the quote with the source. You can't clear a quote with "the public."
      *   *The User's Clearance Rule:* "Answer the worst-off in one sentence." This maps well to the "Reasonable Rejection" clause. "Never add complaints across unnamed people" maps to "Separateness of Persons."

  4.  **Stress-Testing the Clearance Rule:**
      *   *Where it works:* It captures the veto power of the individual. It stops the "greater good" argument from steamrolling a source.
      *   *Where it smuggles:* Scanlon talks about *generic* reasons, not specific personal feelings. The newsroom rule says "whoever ends up worst off." In news, the "worst off" might be a specific source with a weird grudge. Scanlon cares about the *type* of complaint, not the *person*.
      *   *Where it breaks:* News is inherently aggregative (circulation, pageviews). Scanlon is inherently non-aggregative. The rule demands a non-aggregative process in an aggregative business.

  5.  **Drafting the Residue Report:**
      *   *Clean:* The veto power (clearance), the focus on the specific victim (anecdotal lede).
      *   *Distorted:* "Reasonable rejection" becomes "legal clearance" (too defensive). "Generic reasons" becomes "representative sources" (too statistical).
      *   *Unsayable:* The metaphysical claim that persons are separate. News *needs* aggregates (polls, data) to function.
      *   *Blunt Point 1 (Impact Heuristic):* Reach x Severity is Utilitarian. Scanlon is Anti-Utilitarian. They are incompatible. The translation only works for a "Public Editor" or Ombudsman role, not the front page.
      *   *Blunt Point 2 (Representative Anecdote):* A representative anecdote is a *sample* of a group. A contractualist individual is a *standpoint*. One stands for the many; the other stands for themselves. It's a pun.

  6.  **Developing the Table:**
      *   Need to map specific philosophical claims to news terms.
      *   Rows: Core Principle, Aggregation, Standpoint, User's Clearance Rule.
      *   Columns: Claim, News Rendering, Verdict, Diagnosis.

  7.  **Refining the Voice:**
      *   Avoid "Scanlon says..."
      *   Use "Here's the copy," "Here's the edit," "Here's the spike."
      *   Keep it punchy. "Don't bury the lede" = "Don't bury the harm."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the philosophy? *Correction:* No, keep it in news metaphors. Instead of "generic reasons," use "standard sourcing guidelines."
      *   *Check:* Did I address the aggregation problem specifically? *Yes, via column inches/proportionality.*
      *   *Check:* Did I stress-test the Clearance Rule honestly? *Yes, point out it conflates legal risk with moral validity.*
      *   *Check:* Is the table formatted correctly? *Yes.*
      *   *Check:* Did I answer the two blunt questions? *Yes, in the Residue Report.*

  9.  **Final Polish:** Ensure the distinction between "unnamed people" (aggregates) and "named sources" (individuals) is sharp. Ensure the "one sentence" constraint of the Clearance Rule is highlighted as a strength (clarity) and weakness (oversimplification).

  *(Self-Correction on the "Clearance Rule" stress test)*: I need to be careful. Scanlon allows aggregation *sometimes* (e.g., if the small complaints are about the same *type* of burden). The user's rule says "never allowed to add complaints together across people who can't be named." This is stricter than Scanlon. I need to point out that the rule is *more* contractualist than contractualism in some ways, or perhaps just legally pragmatic. Actually, Scanlon *does* reject aggregation of small benefits vs large harm. So the rule holds there. But Scanlon allows comparing clusters of generic reasons. The newsroom rule focuses on the *person*. That's the divergence.

  *(Refining the "Impact Heuristic" point)*: Newsrooms allocate space based on interest (reach) and importance (severity). This is utilitarian. Contractualism says "importance" isn't a sum. It's a veto. I need to make sure this clash is clear.

  *(Refining the "Representative Anecdote" point)*: A representative anecdote is selected *because* it represents the group. The contractualist individual is selected *because* they are the one being harmed. One is a synecdoche; the other is a sovereign.

  Okay, ready to write.
answer: |-
  **To:** Editorial Board
  **From:** Column Desk
  **Re:** The Clearance Rule (Draft for Morning Meeting)

  Here is the pitch. We are treating moral principles like editorial policy.

  **The Story:**
  Every decision we make—running a name, spiking a quote, assigning space—creates winners and losers. The old way of counting column inches is arithmetic: we add up the benefit to the readers (reach) and weigh it against the harm to the source (severity). If the reach is big enough, we run it. That's the impact heuristic.

  The new rule says that arithmetic is bad math. You cannot add up a thousand minor annoyances to readers to justify one catastrophic harm to a source. If a story ruins a life, it doesn't matter if a million people get a mild thrill from reading it. The mild thrills do not pool. They belong to a million separate people. The ruin belongs to one.

  **The Clearance Rule:**
  Before any claim goes in the piece, you must be able to answer, in one sentence, the objection of whoever ends up worst off under that claim. You are never allowed to add complaints together across people who can't be named in the story.

  **How it works in the room:**
  1.  **Sourcing and Clearance:** In the old model, we clear quotes for accuracy. In this model, we clear principles for rejectability. If the person who takes the hit can look at the justification and say, "That reason doesn't hold water for me specifically," the claim is spiked. We don't ask "Is this good for the paper?" We ask "Can the person we burn reasonably accept this reason?"
  2.  **Proportionality of Column Inches:** We stop treating space as a liquid asset. You cannot pour a flood of minor updates over a single deep injury. If the lede is an anecdote about one person's loss, the nut graf cannot justify it with statistics about general gain. The gain is fragmented; the loss is consolidated. The loss weighs more.
  3.  **The Identifiable Victim:** We already know readers care more about a named victim than a statistic. This rule makes that editorial bias a moral requirement. If you can't name the victim, you can't aggregate their complaint against a named victim's serious harm. Statistics don't have veto power. People do.

  ***

  ### Stress-Test: The Clearance Rule

  You asked me to break your rule. Here is where it holds and where it leaks.

  **Where it smuggles:**
  The rule says: "Answer the objection of whoever ends up worst off." Scanlon's philosophy talks about *generic* reasons, not specific people. In news terms, Scanlon cares if the *role* (e.g., "the source," "the subject") can reject the principle, not if *John Smith* is unhappy. Your rule risks giving a veto to a specific source's idiosyncratic feelings rather than a reasonable person's standard objection. It turns a moral test into a legal clearance check. You might spike a true story because one angry source has a loud voice, not because their objection is reasonable.

  **Where it breaks:**
  The rule says: "Never allowed to add complaints together across people who can't be named." This is stricter than the philosophy. Contractualism allows some aggregation if the burdens are similar in kind. But in newsroom terms, this breaks the business model. We sell papers to aggregates. We serve "the public." Your rule forbids invoking "the public" as a counterweight to an individual. It forces the desk to operate as if "the public" doesn't exist, only subscribers do. That's not a moral stance; that's a circulation crisis.

  ***

  ### Residue Report

  **What carries over cleanly:**
  The **Correction Standard**. In contractualism, if a principle is rejected, it's void. In news, if a fact is wrong, we correct it. The idea that a claim must be defensible to the person it touches survives intact. The **Anecdotal Lede** also maps well: focusing on the specific instance rather than the abstract sum is the narrative equivalent of the individual standpoint.

  **What survives with distortion:**
  **Sourcing.** Contractualism requires reasons to be generic (applicable to anyone in that position). News sourcing requires quotes to be specific (applicable to *this* person). When we translate "reasonable rejection" to "source clearance," we lose the universality. We turn a philosophical veto into a PR hurdle.
  **Proportionality.** We measure space in inches or pixels. Contractualism measures weight in reasons. We can pretend column inches equal moral weight, but we know a 20-inch sidebar doesn't necessarily outweigh a 5-inch correction. The metric is fake.

  **What has no expression at all:**
  The **Impersonal Standpoint**. Contractualism says there is no "view from nowhere." News *requires* a view from nowhere (the "Editorial Voice," the "Paper of Record"). We speak for the institution, not the individual. There is no newsroom vocabulary for "a principle no one could reject" because our job is to publish what *someone* rejected (the press release, the leak, the scandal).

  **The Two Blunt Truths:**

  1.  **The Impact Heuristic vs. Non-Aggregation:**
      Your impact heuristic (Reach × Severity) is utilitarian all the way down. It sums utility. Contractualism forbids summing. This translation only survives on a desk that doesn't exist: the Public Editor or Ombudsman. The Front Page cannot function without aggregation. If you ban aggregation, you cannot justify running a story about a corrupt politician just because "it helps democracy." Democracy is an aggregate. The politician is an individual. Under your rule, the politician's reputational harm (concrete, individual) outweighs the public's trust (abstract, pooled). The translation kills the watchdog function.

  2.  **Representative Anecdote vs. Individual Standpoint:**
      This is a pun on the word "individual." A representative anecdote is chosen *because* it stands for the group. It is a synecdoche. The contractualist individual is chosen *because* they are the one being harmed. They stand for themselves. In news, we use the individual to sell the aggregate. In contractualism, we use the individual to block the aggregate. They are opposite vectors. Using the lede to do the work of the standpoint is a bait-and-switch.

  ***

  ### Translation Table

  | claim_stated_straight | newsroom_rendering | verdict | diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Principles must be justifiable to each person affected.** | **Clearance Standard:** Every claim must clear with the source it impacts, not just the editor running it. | Distorted | Vocabulary fault. "Clearance" implies legal risk/accuracy, not moral justification. |
  | **Small benefits to many cannot outweigh a large harm to one.** | **Column Inch Proportionality:** You cannot bury a libel risk under a thousand minor reader benefits. | Clean | Newsroom fault. We rarely measure harm this way, but the concept fits "space allocation." |
  | **There is no impersonal standpoint where complaints pool.** | **No Aggregates:** You cannot use "the public" or "readership" as a named source to outweigh a specific victim. | Unsayable | Vocabulary fault. News *is* the impersonal standpoint. "The Public" is our primary source. |
  | **Reasonable rejection depends on generic reasons, not personal feelings.** | **Standard Sourcing:** Objections must be based on standard guidelines, not a source's personal grudge. | Distorted | Philosophy fault. "Generic reasons" is too abstract for deadline-driven sourcing. |
  | **The Clearance Rule (User Proposal):** Answer the worst-off in one sentence; never add unnamed complaints. | **The One-Sentence Test:** If you can't explain the harm to the victim in a sentence without citing "the greater good," spike it. | Clean | Clean. This captures the "no aggregation" constraint perfectly in editorial terms. |
  | **Moral wrongness is defined by the possibility of rejection.** | **Correction Policy:** A story is "wrong" if the subject has a valid objection that wasn't addressed pre-publication. | Distorted | Vocabulary fault. "Wrong" in news means factual error, not moral indefensibility. |
