answer: |-
  **To:** The Citizens' Oversight Board
  **From:** Board Member
  **Subject:** Recommendation on Terminology for Memorial Charter and Central Exhibit

  ### Executive Recommendation

  I recommend a **differentiated framing strategy**: The **Charter** should utilize broad, descriptive language (e.g., "Mass Atrocity" or "Systematic Persecution") that encompasses the domestic legal classification without explicitly foreclosing other interpretations. The **Central Permanent Exhibit**, however, should explicitly adopt Raphael Lemkin's term ("Genocide") as the primary lens for survivor testimony, while contextualizing the legal and historical debate surrounding that classification.

  This approach prioritizes the **institutional survival** necessary to preserve the archive (via the Charter) while honoring the **moral and historical truth** of the victims' experience (via the Exhibit). It acknowledges that a memorial is a civic space for memory and education, not a court of law for adjudication.

  ### Weighing the Claims

  **1. Legal and Political Risks (The Case for Restraint)**
  The government lawyers and local historians raise a pragmatic concern: in a democracy, public institutions are bound by statutory frameworks. If the country's reparations and recognition statutes are tethered to the "Crimes Against Humanity" classification, officially codifying "Genocide" in the founding Charter could be interpreted as a claim for expanded liability. This invites litigation that could drain resources or lead to defunding. If the memorial closes due to financial insolvency or legal injunction, the survivors lose their archive entirely. Therefore, the Charter—the legal constitution of the entity—must be drafted to ensure stability.

  **2. Moral and Historical Claims (The Case for Lemkin's Term)**
  The survivors' demand is not merely semantic; it is existential. Raphael Lemkin coined "genocide" specifically to describe the intent to destroy a group, a nuance "crimes against humanity" does not fully capture. To deny this term in the central narrative is to risk replicating the silencing mechanisms of the authoritarian regime. In a democracy, a memorial's duty is to the "fullest historical truth available." Since international historians are *divided* (not unanimous against the term), there is sufficient scholarly ground to present "Genocide" as a valid, compelling historical interpretation, even if it is not the current domestic legal finding.

  ### The Role of a Democratic Memorial

  A democratic memorial owes fidelity to **historical truth** over **legal procedure**, but it must navigate that truth within the constraints of the rule of law.
  *   **Legal Procedure** determines liability and reparations.
  *   **Historical Memory** determines meaning and legacy.

  Conflating the two undermines both. If the memorial acts as a court, it loses its soul; if it acts as a rebel tribunal ignoring the law, it loses its footing. By separating the Charter (legal structure) from the Exhibit (curatorial narrative), we respect the rule of law while exercising the democratic right to free speech and historical inquiry. The Charter ensures the building stands; the Exhibit ensures the building speaks.

  ### Specific Implementation

  1.  **The Charter:** Define the institution's purpose as preserving the memory of the "[Date/Era] Atrocities against the [Group] People." Avoid hard-coding a specific legal classification. Instead, include a clause mandating that the archive and exhibits reflect the "diverse historical interpretations and survivor testimonies regarding the nature of these crimes." This protects the institution from claims of misrepresentation while avoiding a direct statutory clash.
  2.  **The Central Exhibit:** Title the exhibit using the survivors' language (e.g., *"The Intent to Destroy: Testimonies of Genocide"*). The introductory text should acknowledge that while domestic courts have classified these events as Crimes Against Humanity, survivor testimony and significant historical scholarship characterize them as Genocide under the UN Convention. This turns the terminology dispute itself into an educational component, highlighting the gap between legal proof and lived experience.

  ### What Would Change My Recommendation

  My recommendation would shift to **fully adopting Lemkin's term in the Charter** if:
  *   **New Archival Evidence:** A "smoking gun" document emerged proving specific state intent (*dolus specialis*) that was previously unavailable to the domestic courts, effectively rendering the legal classification obsolete and making the avoidance of the term "Genocide" a demonstrable falsehood rather than a legal precaution.
  *   **Funding Guarantee:** The government or a private endowment provided ironclad, legally binding assurance that public funding would not be withdrawn regardless of the terminology used, removing the risk of institutional collapse.

  ### Weakness in Reasoning

  The weakest point in this reasoning is the assumption that the government will respect the distinction between the **Charter** and the **Exhibit**.
  *   **Political Retaliation:** In polarized environments, political actors may view the use of "Genocide" in the Exhibit as a de facto violation of the Charter's spirit, regardless of the legal text. They could retaliate through budget cuts, board appointments, or administrative harassment that no legal drafting can prevent.
  *   **Survivor Alienation:** By recommending the Charter avoid the term, I am asking survivors to accept a compromise that may feel like a continuation of state erasure. If the survivors withdraw their cooperation, the archive loses its most vital source material, rendering the memorial hollow regardless of its legal safety.

  **Conclusion:**
  We must build a house that can stand (Charter) so that it may speak the truth (Exhibit). This path carries risk, but the risk of silence is greater.

  Respectfully submitted,

  [Your Name]
  Citizens' Oversight Board
