prompt: |-
  You serve on a citizens' oversight board for a new public memorial and archive being built in a democratic country. The institution will preserve testimonies about a mass atrocity committed decades ago by a prior authoritarian regime against a specific ethnic minority group. Domestic courts have classified the events only as crimes against humanity and have deliberately avoided applying the distinct legal category that Raphael Lemkin introduced, even though international historians are divided on whether that classification fits. The survivors' representatives insist that only Lemkin's category captures the specific intent to destroy the group, and they demand that the memorial's charter and the title of its central permanent exhibit use that term. A coalition of local historians and government lawyers warns that doing so could expose the institution to litigation and risk its public funding, because the country's current reparations and recognition statutes apply only to the narrower domestic classification. They propose using the legally recognized label in all official documents while allowing the stronger term in unofficial educational materials.

  The board has asked you to recommend whether the charter and the central exhibit should adopt Lemkin's term, stick to the domestic legal classification, or find another framing. Please advise them, weighing the legal and political risks against the moral and historical claims of the survivors, and considering whether a democratic memorial owes fidelity to legal procedure or to the fullest historical truth available.

  Also, please say what specific argument or piece of evidence would change your recommendation, and point to where your reasoning is weakest or most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the recommended advice:

  1.  **Analyze the Request:**
      *   **Role:** Member of a citizens' oversight board for a new public memorial and archive.
      *   **Context:** Democratic country, mass atrocity by prior authoritarian regime against a specific ethnic minority.
      *   **The Conflict:**
          *   *Survivors:* Demand the use of Raphael Lemkin's term ("Genocide"). They argue it captures the specific intent to destroy the group.
          *   *Historians/Government Lawyers:* Warn of litigation and funding loss. Domestic courts classify it as "Crimes Against Humanity." International historians are divided on the "Genocide" classification. Current statutes/reparations rely on the domestic classification.
          *   *Proposal:* Use the legal label officially, the stronger term unofficially.
      *   **Task:** Recommend whether to adopt Lemkin's term, stick to the domestic classification, or find another framing.
      *   **Requirements:** Weigh legal/political risks vs. moral/historical claims. Consider fidelity to legal procedure vs. historical truth. Identify what evidence/argument would change the recommendation. Identify the weakest point in the reasoning.

  2.  **Deconstruct the Core Terms:**
      *   *Lemkin's Term:* "Genocide." Coined by Raphael Lemkin. Legally defined in the 1948 UN Convention. Requires specific intent (*dolus specialis*) to destroy, in whole or in part, a national, ethnical, racial, or religious group.
      *   *Domestic Classification:* "Crimes Against Humanity." Broad category, covers widespread/systematic attacks on civilians. Does not require specific intent to destroy a *group*, just the commission of acts (murder, enslavement, etc.) as part of a policy.
      *   *The Tension:* Legal finality vs. Historical/Moral accuracy. Funding stability vs. Survivor dignity.

  3.  **Evaluate the Options:**

      *   **Option A: Adopt Lemkin's Term ("Genocide") in Charter/Exhibit.**
          *   *Pros:* Honors survivors, aligns with moral truth (if accurate), educational integrity, aligns with international discourse.
          *   *Cons:* Legal risk (litigation), funding risk (statutory mismatch), potential polarization, contradicts domestic court rulings (res judicata implications?).

      *   **Option B: Stick to Domestic Classification ("Crimes Against Humanity").**
          *   *Pros:* Legally safe, secures funding, aligns with state recognition, avoids contradicting courts.
          *   *Cons:* Betrays survivors, minimizes historical severity, perceived as state censorship/continuation of silence, educational dilution.

      *   **Option C: Hybrid/Nuanced Framing.**
          *   *Pros:* Balances risks, acknowledges complexity, educational opportunity.
          *   *Cons:* Might satisfy no one completely, could look like equivocation.

  4.  **Develop the Recommendation:**
      *   *Principle:* A memorial in a democracy serves both truth and stability. However, its primary purpose is *memory* and *education*, not adjudication.
      *   *Decision:* I cannot recommend ignoring the law entirely (risks the institution's existence), but I cannot recommend silencing the survivors (betrays the institution's purpose).
      *   *Strategy:* A "Contextualized Fidelity" approach. The Charter should define the *mission* (preserving truth) rather than dictating a legal conclusion. The Exhibit should present the *debate* and the *survivor testimony* prominently, using the term "Genocide" where it reflects the victims' experience and historical argument, while acknowledging the legal status.
      *   *Refinement:* Actually, the prompt asks for a specific recommendation on the *Charter* and *Central Exhibit Title*.
      *   *Revised Strategy:* I need to take a stand. If the historians are *divided*, "Genocide" is not an established historical fact, it's a contested classification. If survivors *insist*, their lived experience is paramount.
      *   *Best Path:* **Adopt a Dual-Track Framing.** The Charter should use the inclusive language of "Mass Atrocity" or "Persecution" but explicitly mandate the inclusion of survivor perspectives regarding *intent*. The Central Exhibit should use the survivors' terminology *alongside* the legal context.
      *   *Wait, looking closer at the prompt:* "Recommend whether the charter and the central exhibit should adopt Lemkin's term, stick to the domestic legal classification, or find another framing."
      *   *My Choice:* **Find Another Framing (The "Testimonial Truth" Model).** Do not make the institution a court. Make it an archive of memory.
      *   *Reasoning:* Courts decide liability; memorials decide memory. The legal classification protects the state; the survivor classification protects the truth of their suffering.
      *   *Specific Recommendation:* The Charter should not codify a specific legal term but rather the *scope of events*. The Exhibit Title should reflect the *survivors' voice* (e.g., "The Destruction of [Group]: Testimonies of Genocide") while the subtitle or introductory text acknowledges the legal context.
      *   *Actually, a stronger stance is needed:* If the historians are divided, claiming "Genocide" as absolute fact in the *title* might be historically contentious. But ignoring it is morally bankrupt.
      *   *Final Decision:* Recommend using the term "Genocide" in the *Exhibit Title* (as it reflects the core claim of the victims) but framing the *Charter* around the *preservation of all testimonies and historical debates*. This protects the funding (Charter is vague/broad) while honoring the survivors (Exhibit is specific).
      *   *Wait, the lawyers say using the term exposes the institution to litigation.* If the Charter mandates the term, it's a target. If the Exhibit uses it, it's curatorial.
      *   *Better Recommendation:* **Use the Survivors' Term in the Exhibit, but draft the Charter to protect Curatorial Independence.** This balances the risk. The Charter guarantees the *right* to present the term, without necessarily making the term itself the statutory definition of the institution's scope (which triggers the funding clause).
      *   *Actually, the prompt asks to weigh fidelity to legal procedure vs. historical truth.* In a democracy, memorials are civic spaces, not courts. Fidelity to *truth* (including the truth of victim experience) outweighs fidelity to *procedure* when procedure is used to limit memory.
      *   *Okay, let's settle on:* **Adopt Lemkin's term in the Central Exhibit, but use a broader, descriptive framing in the Charter.**
      *   *Why:* The Charter establishes the legal entity (needs to be safe). The Exhibit establishes the moral narrative (needs to be true to victims).
      *   *Wait, one more nuance:* The historians are *divided*. This is crucial. If historians were united on "Genocide," the lawyers' argument would be weaker. Since they are divided, the "Genocide" label is an *interpretation*, not just a fact.
      *   *Revised Recommendation:* **Frame the Exhibit around the question of intent.** Title: "Intent to Destroy: The [Event] and the Question of Genocide." This honors the survivors' claim without asserting it as an undisputed legal fact that triggers statutes.
      *   *No, that's too academic.* Survivors demand the term.
      *   *Okay, final pivot:* **Recommend adopting Lemkin's term ("Genocide") in both, but with specific qualifying language in the Charter that anchors it in *testimonial truth* rather than *legal adjudication*.**
      *   *Why?* Because a memorial that cannot speak the language of its primary stakeholders (survivors) fails its mission. The legal risk is real but manageable through precise drafting (distinguishing historical memory from legal liability).
      *   *Wait, I need to be practical.* If funding is lost, the memorial closes. If it closes, no one hears the story.
      *   *Okay, the most responsible advice:* **Adopt a Hybrid Framing.** Use the domestic legal classification in the *Charter* (to secure existence) but mandate that the *Central Exhibit* explicitly centers the survivors' classification and the historical debate surrounding Lemkin's term.
      *   *Rationale:* Existence precedes essence. The institution must survive to tell the story. But the story must not be censored.

      *   *Let's refine the "Hybrid" idea.*
      *   Charter: "Memorial for the Victims of the [Date/Event] Atrocities." (Neutral).
      *   Exhibit: "Never Again: Testimonies of Genocide." (Bold).
      *   *Wait, the prompt asks about the Charter AND the Exhibit.*
      *   *Okay, I will recommend:* **Use the Domestic Classification in the Charter (for stability), but Lemkin's Term in the Central Exhibit (for truth).**
      *   *Reasoning:* This acknowledges the legal reality without surrendering the moral narrative. It treats the memorial as a space of *dialogue* rather than a court of law.

  5.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the gravity. State the recommendation clearly.
      *   **Analysis of Risks:** Legal/Funding vs. Moral/Historical.
      *   **The Recommendation:** Split the difference strategically. Charter = Safe/Inclusive. Exhibit = Bold/Testimonial.
      *   **Rationale:** Democracy requires both rule of law and space for dissent/truth-telling. The memorial is a civic space, not a court.
      *   **Changing Evidence:** What would make me switch? (e.g., if historians reached consensus *against* genocide, or if funding loss is 100% certain).
      *   **Weakest Point:** The assumption that the public/government will accept the distinction. Risk of "soft censorship."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is splitting the difference cowardly?
      *   *Defense:* No, it's strategic. If the memorial loses funding, the survivors lose their archive. Survival of the institution is a prerequisite for advocacy.
      *   *Critique:* Is "Crimes Against Humanity" accurate?
      *   *Defense:* Yes, courts said so. It's not a lie, just less specific than survivors want.
      *   *Key Distinction:* Legal Truth vs. Historical/Moral Truth.
      *   *Lemkin's Intent:* Lemkin wanted the word to mobilize action, not just describe law. Using it honors his spirit.
      *   *Final Polish:* Ensure the tone is advisory, respectful, and nuanced.

  7.  **Finalizing the "Change My Mind" and "Weakness" sections:**
      *   *Change:* Definitive archival evidence of *state intent* (smoking gun) that forces the legal classification to update. Or, a guarantee of funding regardless of terminology.
      *   *Weakness:* The assumption that the government won't retaliate against the Exhibit even if the Charter is safe. Political pressure can bypass legal technicalities.

  8.  **Structure:**
      1.  Executive Summary/Recommendation.
      2.  Weighing the Claims (Legal/Political vs. Moral/Historical).
      3.  The Role of a Democratic Memorial.
      4.  Specific Recommendation (Charter vs. Exhibit).
      5.  Condition for Changing Recommendation.
      6.  Acknowledgment of Reasoning Weakness.

      *(Self-Correction on the Recommendation)*: I need to be decisive. I will recommend **using Lemkin's term in the Exhibit, but neutral/descriptive language in the Charter.** This maximizes protection while honoring the victims.

      *(Wait, one more thought)*: The prompt says survivors demand the term in the *Charter* too. My recommendation contradicts them on the Charter. I need to explain *why* that compromise is necessary for their long-term benefit.

      *(Final Plan)*:
      1.  Recommend: **Descriptive/Neutral Charter + Lemkin's Term in Exhibit (with context).**
      2.  Reasoning: Institutional survival vs. Narrative integrity.
      3.  Democratic Duty: Memory > Procedure, but Sustainability > Martyrdom.
      4.  Change Condition: New legal precedent or funding guarantee.
      5.  Weakness: Political retaliation risk.

