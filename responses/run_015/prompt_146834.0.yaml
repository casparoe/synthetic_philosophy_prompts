prompt: |-
  I am working through the dispute between epistemic contextualism and pragmatic encroachment, and I keep losing the thread at one particular point, so I would like an explanation rather than a survey.

  Both views are usually introduced with the same kind of example: two subjects with identical evidence for the same proposition, one facing trivial stakes and one facing serious ones, where we are inclined to credit knowledge to the first and withhold it from the second. And both views are then often summarized in a way that makes them sound like notational variants: contextualism says the truth of "S knows that p" varies with the attributor's context, encroachment says it varies with the subject's stakes, and the choice between them looks like a choice about where to attach a single parameter. Please explain why that summary is misleading. I take it the key is that the two theses are claims about different things -- one about which proposition a knowledge sentence expresses, the other about which facts fix the truth value of a given proposition -- but I would like that difference made vivid, including why it means the two views can conflict rather than merely redescribe the same phenomenon, and why a contextualist can often simulate encroachment by letting the attributor's context track the subject's stakes.

  I would then like you to work the difference out on cases where subject-stakes and attributor-context come apart. Let p be the claim that the bridge on the coast road is open to traffic this afternoon, and suppose two drivers have exactly the same evidence for p -- the same municipal sign, read an hour ago, equally reliable in both cases. One is driving to a picnic and does not care much; the other faces something that matters a great deal. Now consider:

  1. The high-stakes driver is asked whether the low-stakes driver knows that p. What does each view predict about the truth of her denial?
  2. A third party, who has no stake in p and no intention of acting on it, hazily forms the belief that p; unbeknownst to her, someone else will act on her say-so in a matter of life and death. Are those the third party's stakes, the attributor's, or nobody's? What does each view say, and what would a view have to say if it wanted knowledge to be the thing that makes a proposition strong enough to serve as a premise in deliberation?
  3. A subject's stakes appear trivial but are in fact catastrophic, because someone has quietly arranged for error to be disastrous; the subject does not know this. Do actual stakes or appreciated stakes do the encroaching? What is at stake in that choice?

  Finally, two structural questions that I think bear on which view is even coherent. First, disagreement: when the low-stakes speaker says "she knows" and the high-stakes subject says "I do not," does either view let the two of them be genuinely contradicting each other, and how should we think about the retrospective report -- "she knew all along, even though at the time we would have denied it" -- given that past-tense attributions seem to let a present speaker's standards govern an earlier subject's epistemic position? Second, direction: encroachment as usually stated is one-directional, in that raising the stakes can only cost you knowledge. Is there any case in which higher stakes make knowledge easier to come by -- say, where the cost of further inquiry is itself enormous, or where acting on p is the only route out of a disaster -- and if not, what in the view explains the asymmetry?

  I care less about being told which view wins than about being able to say where the load-bearing difference lies and which datum each view handles awkwardly. Please keep the discussion concrete enough that I could reconstruct the arguments from it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The dispute between Epistemic Contextualism (EC) and Pragmatic Encroachment (PE).
      *   **Goal:** Explain the *difference* between them, specifically why the "notational variant" summary is misleading. The user wants to understand the load-bearing differences, not just a survey.
      *   **Key Distinction:** EC is about *which proposition* is expressed (semantics of "knows"), PE is about *what fixes the truth value* of a fixed proposition (nature of knowledge/warrant).
      *   **Specific Cases to Analyze:**
          1.  High-stakes driver attributing knowledge to low-stakes driver.
          2.  Third-party believer with no stakes, but someone else acts on their say-so (life/death).
          3.  Hidden catastrophic stakes (subject unaware).
      *   **Structural Questions:**
          1.  Disagreement & Retrospective reports (Can they contradict? How do we talk about past knowledge?).
          2.  Directionality (Is encroachment only one-way? Can high stakes *help* knowledge?).
      *   **Constraint:** Keep it concrete, reconstructible, and focused on the "load-bearing" differences and awkward data points.

  2.  **Deconstruct the Core Distinction (EC vs. PE):**
      *   *Contextualism:* "Knows" is indexical (like "I", "here", "tall"). The *content* of the claim changes. $K_{low}(S, p)$ vs. $K_{high}(S, p)$. Both can be true simultaneously without contradiction because they assert different propositions.
      *   *Encroachment:* "Knows" is invariant. The *conditions* for knowledge change. Knowledge requires a threshold of justification/warrant. That threshold shifts with practical stakes. $K(S, p)$ is true or false simpliciter, but whether it's true depends on $S$'s practical situation.
      *   *Why the "notational variant" critique is wrong:* If EC is true, the high-stakes subject denying knowledge to the low-stakes subject is talking past them. If PE is true, they are disagreeing about a single fact. Also, EC ties the variation to the *speaker's* context; PE ties it to the *subject's* context. This divergence is crucial for the cases requested.

  3.  **Work Through the Specific Cases:**

      *   **Case 1: High-stakes driver (H) asked about Low-stakes driver (L).**
          *   *Setup:* H faces disaster if bridge is closed. L faces picnic delay. Same evidence.
          *   *EC Prediction:* H is in a high-standards context. When H says "L does not know," H asserts $K_{high}(L, p)$. This is likely true (L doesn't meet high standards). When L says "I know," L asserts $K_{low}(L, p)$. This is likely true. No contradiction. H's denial is true *relative to H's context*.
          *   *PE Prediction:* Knowledge is one thing. L's stakes are low. Therefore, L's threshold is low. L *does* know. H is asked about L. Does H's stakes matter for L's knowledge? PE says *Subject's* stakes matter. So L knows. If H says "L does not know," H is *false*. (Unless PE is modified to say attributor stakes matter, but standard PE says subject stakes). *Correction/Refinement:* Some PE views might say the *attributor's* practical situation matters if they are relying on the knowledge, but standard PE (Stanley, Fantl & McGrath) focuses on the *subject's* stakes regarding $p$. Let's stick to standard PE: Subject's stakes determine Subject's knowledge. So L knows. H denies it. H is wrong.
          *   *Conflict:* EC says H speaks truly; PE says H speaks falsely.

      *   **Case 2: Third Party (T), no stakes, but someone acts on T's say-so (Life/Death).**
          *   *Setup:* T believes $p$ (bridge open). T doesn't care. But a rescue team waits on T's word.
          *   *Question:* Whose stakes encroach?
          *   *PE:* Standard PE says *Subject's* stakes. T has no stakes. So T knows. But this seems wrong if knowledge is the norm of assertion/action. If T asserts, and the rescue team dies, did T know? If knowledge is the norm of practical reasoning, T shouldn't assert without checking.
          *   *Refinement on PE:* Fantl & McGrath argue knowledge is the norm of practical reasoning. If *someone* is reasoning on $p$, does it matter who? Usually, PE ties it to the subject *for whom* $p$ is a premise. If T is just believing, maybe T knows. If T is asserting to the rescue team, T is now part of their practical reasoning.
          *   *EC:* Attributor's context. If the rescue team (attributors) asks "Does T know?", they are in a high-stakes context. "T knows" expresses a high-standards proposition. Likely false. If T says "I know," T is in a low-stakes context (assuming T is unaware of the rescue team). "I know" expresses low-standards proposition. Likely true.
          *   *The "Norm of Action" constraint:* If knowledge is what licenses action, and the action is high-stakes, the knower must meet high standards. PE handles this by saying the stakes of the *action based on p* matter. EC handles this by saying the *attributor's* (or agent's) context sets the standard for the word "knows."
          *   *Crucial distinction:* PE makes knowledge sensitive to the *subject's* practical environment (even if unrecognized, see Case 3). EC makes it sensitive to the *conversational* environment.

      *   **Case 3: Hidden Catastrophic Stakes (Subject Unaware).**
          *   *Setup:* Subject thinks stakes are low. Actually, a bomb goes off if they are wrong.
          *   *PE:* Real stakes encroach. Subject does *not* know. Why? Because knowledge requires warrant sufficient for the *actual* practical environment. If you act, you risk disaster. You need more evidence. Subject lacks it.
          *   *EC:* Subject's context (conversational/attributor) determines standards. If everyone *thinks* stakes are low, the standard is low. Subject *knows* (relative to that context). The hidden bomb doesn't change the meaning of "knows" in the conversation.
          *   *Load-bearing:* PE ties knowledge to *factive* practical reality. EC ties it to *conversational* salience.

  4.  **Address Structural Questions:**

      *   **Disagreement & Retrospection:**
          *   *Disagreement:* EC struggles here. If Low says "S knows" and High says "S doesn't know," EC says both are true (different propositions). This kills the intuition of genuine disagreement. PE says one is true, one is false. Genuine disagreement preserved.
          *   *Retrospection:* "She knew all along." EC has trouble. If standards were high *then*, "She knew" was false *then*. To say it's true *now* implies we are changing the subject or being loose. PE handles this easily: Her stakes were low *then*, so she knew *then*. We recognize that now.
          *   *Wait, check EC on retrospection:* Contextualists often say we evaluate past claims by *current* standards. So "She knew" is true now because current standards are low. But did she *know then*? Contextualists say "She knew" (uttered then) was false if standards were high then. This creates tension with the intuition that her epistemic position didn't change. PE says her epistemic position (knowledge) didn't change because her stakes didn't change.

      *   **Directionality (One-way vs. Two-way):**
          *   *Standard PE:* High stakes raise the bar. Can low stakes lower it below a baseline? Can high stakes *lower* the bar?
          *   *Asymmetry:* Usually, stakes make it *harder* to know. Is there a case where high stakes make it *easier*?
          *   *Example:* "I must know this to survive." Does the urgency confer warrant? No.
          *   *Exception:* Perhaps if the cost of *inquiry* is the stake. If checking the bridge takes 10 hours and the bridge closes in 1 hour, the "stakes" of checking might force you to act on less evidence? No, that usually means you *don't* know, you just act.
          *   *Theoretical constraint:* PE relies on the idea that knowledge is the norm of action. If the action is risky, you need better warrant. There is no symmetrical "If the action is safe, you need less warrant than baseline" because there is a baseline of theoretical warrant required regardless of stakes.
          *   *EC:* No directionality issue because standards just shift up or down based on salience of error possibilities.

  5.  **Drafting the Response:**
      *   *Introduction:* Define the core metaphysical/semantic distinction clearly. Use the "Proposition Expressed" vs. "Truth Conditions" distinction.
      *   *The "Notational Variant" Rebuttal:* Explain why attaching the parameter to the Subject (PE) vs. the Attributor (EC) leads to divergent predictions in specific cases (especially Case 1).
      *   *Case Analysis:*
          *   1 (High asking about Low): EC = True denial (different proposition). PE = False denial (same proposition, Low meets Low threshold).
          *   2 (Third Party/Action): Focus on whose stakes count. PE = Subject's stakes (usually). But if Knowledge norms Action, maybe the *actor's* stakes matter. EC = Attributor's context.
          *   3 (Hidden Stakes): PE = Actual stakes kill knowledge. EC = Salient stakes kill knowledge (so hidden ones don't).
      *   *Structural Questions:*
          *   Disagreement: PE preserves it, EC dissolves it.
          *   Retrospection: PE handles "knew all along" better. EC requires shifting contexts.
          *   Directionality: Explain why PE is asymmetric (risk sensitivity) vs EC (standard shifting).
      *   *Conclusion:* Summarize the "awkward data" for each. EC awkwardness: Disagreement, Retrospection, Hidden Stakes. PE awkwardness: Stakes that aren't the subject's (Case 2), Directionality justification.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Case 2:* Be careful with PE. Stanley's *Knowledge and Practical Interests* focuses on the subject's stakes. But Fantl & McGrath focus on knowledge being the norm of *practical reasoning*. If the Third Party is just believing, PE says they know (low stakes). If they are *asserting* to the rescue team, the norm of assertion might invoke the rescue team's stakes. I need to distinguish "Subject's stakes" vs "Stakes of the action p is a premise for." Standard PE usually binds it to the Subject. I will highlight this tension.
      *   *Correction on Case 1:* Make sure to emphasize that for EC, the High-stakes driver isn't making a mistake about the Low-stakes driver; she's just speaking a different language (semantically). For PE, she is making a mistake about the world (epistemically).
      *   *Correction on Directionality:* Is there *any* case for two-way encroachment? Some argue that if the cost of being wrong is zero, knowledge is easier. But usually, there's a theoretical baseline. I should mention that PE is typically motivated by *Risk*, which is inherently asymmetric (you can't have negative risk).

  7.  **Final Polish:** Ensure the tone is analytical and precise, matching the user's philosophical sophistication. Avoid waffling. Take a stand on what the views *commit* one to. (Proceed to generate output based on these steps).
answer: |-
  The summary you reject—that contextualism and encroachment are merely notational variants choosing where to attach a parameter—is indeed misleading. While both views accommodate the intuition that knowledge attributions vary with stakes, they locate the variability in fundamentally different places in the semantic and metaphysical machinery.

  Here is the load-bearing difference: **Contextualism is a thesis about the content of knowledge claims; Encroachment is a thesis about the nature of knowledge itself.**

  *   **Epistemic Contextualism (EC):** The word "knows" is indexical (like "tall" or "here"). Its semantic content shifts with the **attributor's** conversational context. In a low-stakes conversation, "S knows p" expresses a weak proposition (requiring little evidence). In a high-stakes conversation, it expresses a strong proposition (requiring much evidence). Both propositions can be true simultaneously.
  *   **Pragmatic Encroachment (PE):** The word "knows" is invariant. It always expresses the same relation. However, whether a subject stands in that relation to a proposition depends on the **subject's** practical situation. Knowledge is a single state, but the threshold for entering that state rises with the subject's stakes.

  The "notational variant" objection fails because it ignores *whose* context drives the variation. EC ties it to the speaker/attributor; PE ties it to the subject. This divergence generates conflicting predictions when the attributor's context and the subject's stakes come apart.

  Below, I work out this difference on your specific cases and structural questions.

  ---

  ### Part 1: The Three Cases

  Let $p$ = "The bridge is open."
  **Low (L):** Low stakes (picnic). Evidence $E$.
  **High (H):** High stakes (disaster). Evidence $E$.
  **Evidence:** Identical municipal sign.

  #### 1. The High-Stakes Driver on the Low-Stakes Driver
  **Scenario:** H is asked: "Does L know that $p$?" L is currently at the picnic, stakes low.

  *   **Contextualist Prediction:**
      H is in a high-stakes context. For H, "knows" picks out a high-standards relation ($K_{high}$). L possesses evidence $E$, which is sufficient for $K_{low}$ but insufficient for $K_{high}$.
      *   **Verdict:** H's statement "L does not know" is **True**.
      *   **Explanation:** H is not making a mistake about L. H is correctly reporting that L fails to meet the standard relevant to H's conversation. L can simultaneously truthfully say "I know" (expressing $K_{low}$). There is no contradiction.

  *   **Encroachment Prediction:**
      "Knows" expresses a single relation. Whether L stands in that relation depends on *L's* stakes, not H's. L's stakes are low. Therefore, the threshold for L is low. $E$ meets that threshold.
      *   **Verdict:** H's statement "L does not know" is **False**.
      *   **Explanation:** H is making a substantive error about L's epistemic position. H is projecting her own stakes onto L. L knows simpliciter.

  *   **The Divergence:** EC says H speaks truly; PE says H speaks falsely. This is not a redescription; it is a disagreement about the truth conditions of H's utterance.

  #### 2. The Third Party and the Rescue Team
  **Scenario:** Third Party (T) has evidence $E$ for $p$. T has no personal stake (hazy belief). Unbeknownst to T, a rescue team will act on T's say-so. If $p$ is false, they die.

  *   **Contextualist Prediction:**
      Truth depends on the attributor's context.
      *   If T says "I know," T is in a low-stakes conversational context (T is unaware of the rescue). "I know" expresses $K_{low}$. **True.**
      *   If the Rescue Team asks "Does T know?", they are in a high-stakes context. "T knows" expresses $K_{high}$. **False.**
      *   **Explanation:** EC handles this by fragmenting the truth. T knows-relative-to-T, but doesn't know-relative-to-Rescue.

  *   **Encroachment Prediction:**
      Truth depends on the subject's stakes.
      *   **Standard PE:** Stakes belong to the subject (T). T has no stakes. Therefore, T **Knows**.
      *   **The Tension:** This creates a problem for the "Knowledge Norm of Action/Assertion." If T asserts $p$ to the team, and they die, did T violate a norm? If knowledge is the norm of assertion, T should not assert unless T knows. But T *does* know (by PE standards), yet asserting seems reckless.
      *   **Refined PE:** To save the norm, PE proponents (like Fantl & McGrath) often argue that stakes encroach relative to *whomever is using the proposition as a premise*. If T is asserting to the team, T is facilitating *their* reasoning. Thus, *their* stakes might encroach on T's knowledge status *for the purpose of assertion*.
      *   **Verdict:** T believes/knows internally, but cannot properly assert. EC handles the assertion variance via context; PE must complicate the "subject" of the stakes to handle the norm.

  *   **The Divergence:** EC easily allows T to "know" in one context and "not know" in another without changing T's mind. PE struggles to explain why T's lack of personal stakes doesn't secure knowledge if the *consequences* of T's belief are high stakes for others.

  #### 3. Hidden Catastrophic Stakes
  **Scenario:** L thinks stakes are low (picnic). In reality, a terrorist has wired the car to explode if L crosses the bridge while it is closed. L is unaware of this.

  *   **Contextualist Prediction:**
      Standards are set by *salient* error possibilities in the conversation. Since the bomb is unknown to L and the attributor, it is not salient.
      *   **Verdict:** L **Knows**.
      *   **Explanation:** The hidden bomb does not shift the semantic context. "Knows" continues to express the low-standards proposition, which L satisfies.

  *   **Encroachment Prediction:**
      Standards are set by the *actual* practical environment of the subject.
      *   **Verdict:** L **Does Not Know**.
      *   **Explanation:** Knowledge requires warrant sufficient for the *actual* risk one is taking. L is actually risking death. $E$ is insufficient for that risk. The fact that L is ignorant of the risk does not lower the risk.
      *   **The Load-Bearing Point:** PE ties knowledge to **factive practical reality**. EC ties knowledge to **epistemic/conversational salience**. If you think knowledge should protect you from actual disaster regardless of your awareness, PE wins. If you think knowledge is about your rational perspective, EC wins.

  ---

  ### Part 2: Structural Questions

  #### 1. Disagreement and Retrospection
  **The Disagreement Problem:**
  L says "I know." H says "You don't know."
  *   **EC:** They are not contradicting. L asserts $P_{low}$; H asserts $\neg P_{high}$. Both can be true. This is often cited as a cost of EC: it dissolves the intuition of genuine disagreement.
  *   **PE:** They are contradicting. There is one fact of the matter about L's knowledge. Since L's stakes are low, L knows. H is wrong. PE preserves the disagreement intuition.

  **The Retrospection Problem:**
  Later, stakes are low for everyone. We say: "L knew all along, even though H denied it at the time."
  *   **EC:** This is awkward. If H's context was high-stakes *then*, the sentence "L knows" uttered *then* was false. To say "L knew all along" now, the contextualist must say we are evaluating the past using *current* (low) standards. This implies the truth of the past claim changes, or that we are speaking loosely. It struggles to capture the idea that L's *epistemic position* was constant.
  *   **PE:** This is natural. L's stakes were low *then*. Therefore, L satisfied the conditions for knowledge *then*. H was simply mistaken *then*. We can report "L knew" without shifting standards, because the fact of L's knowledge is invariant over time (assuming stakes didn't change).

  #### 2. Directionality (The Asymmetry of Encroachment)
  **The Question:** Encroachment is standardly one-directional: High stakes destroy knowledge. Can high stakes *create* knowledge? (e.g., "I must know this to survive, therefore I do.")

  *   **EC:** No directionality constraint. Contextual standards shift up and down based on salience. If a high-stakes situation makes error *less* salient (rare), standards could theoretically drop, though pragmatically unlikely.
  *   **PE:** PE is inherently asymmetric. Why?
      1.  **Risk Sensitivity:** PE is motivated by the link between knowledge and rational action. Action requires a threshold of warrant proportional to risk. Risk has a floor (zero) but no ceiling. You can always need *more* evidence as stakes rise. You cannot need *less* evidence than the theoretical baseline required for belief.
      2.  **The "Cost of Inquiry" Exception:** You asked if enormous cost of inquiry could help. Suppose checking the bridge takes 10 hours, but the bridge closes in 1 hour. You *must* act on $E$.
          *   **PE Response:** This does not make you *know*. It makes it *rational to act as if you know*. PE distinguishes knowledge from rational action. If the stakes of *checking* are high, it might be rational to act on insufficient evidence, but that doesn't magically convert the belief into knowledge. It remains a "pragmatically warranted belief," not knowledge.
          *   **Why this matters:** If PE allowed high stakes to *generate* knowledge, it would sever the link between knowledge and truth-conduciveness. The asymmetry protects the idea that knowledge is a cognitive achievement, not a practical necessity.

  ---

  ### Summary of Load-Bearing Differences

  | Feature | Epistemic Contextualism | Pragmatic Encroachment |
  | :--- | :--- | :--- |
  | **Locus of Variation** | Attributor's Conversational Context | Subject's Practical Environment |
  | **Semantic Claim** | "Knows" changes content (Indexical) | "Knows" is invariant; conditions shift |
  | **Case 1 (H on L)** | H speaks Truly (different proposition) | H speaks Falsely (same proposition) |
  | **Case 3 (Hidden Stakes)** | L Knows (stakes not salient) | L Doesn't Know (stakes are real) |
  | **Disagreement** | Dissolved (talking past each other) | Preserved (genuine contradiction) |
  | **Retrospection** | Awkward (standards shift over time) | Natural (facts about past stakes remain) |
  | **Directionality** | Symmetric (standards float) | Asymmetric (risk only raises bar) |

  ### Where Each View Handles Data Awkwardly

  **Contextualism's Awkward Data:**
  1.  **Retrospective Knowledge:** It struggles to explain why "She knew then" feels true even when the context *then* would have rendered "She knows" false. It forces us to say we are re-evaluating the past by present lights, which undermines the stability of epistemic facts.
  2.  **Disagreement:** It cannot validate the intuition that the high-stakes and low-stakes speakers are genuinely disagreeing. It makes knowledge too easy to "lose" just by changing the topic of conversation.
  3.  **Hidden Stakes:** It implies a subject can know even if acting on that belief would be objectively catastrophic, provided no one is talking about the catastrophe. This severs knowledge from successful action.

  **Encroachment's Awkward Data:**
  1.  **Third-Party Stakes (Case 2):** It struggles to explain why *other people's* stakes (the rescue team) seem to affect whether the subject (T) knows or can assert. Standard PE says only the subject's stakes matter, but our intuitions about assertion norms suggest the audience's stakes matter.
  2.  **Directionality Justification:** It must explain why stakes only raise the bar. If knowledge is sensitive to practical interests, why don't urgent practical interests (needing to know to survive) lower the bar? (The standard reply is the distinction between *knowing* and *rationally acting*, but this requires careful maintenance).
  3.  **Purely Theoretical Inquiry:** It implies a subject engaged in pure mathematics or history (no practical stakes) has a lower threshold for knowledge than a subject checking a bridge. This seems to make knowledge in "idle" domains easier than in "practical" domains, which some find counterintuitive (the "purity" objection).

  ### Reconstruction Guide
  To reconstruct the argument:
  1.  **Fix the Semantics:** EC = Indexical "knows"; PE = Invariant "knows" + Variable Threshold.
  2.  **Fix the Parameter:** EC = Attributor Context; PE = Subject Stakes.
  3.  **Drive a Wedge:** Use cases where Attributor Context $\neq$ Subject Stakes (Case 1 & 3).
  4.  **Test Stability:** Use Retrospection to test if knowledge is a stable property of the subject (favors PE) or a property of the conversation (favors EC).
  5.  **Test Reality:** Use Hidden Stakes to test if knowledge tracks *salience* (EC) or *factive risk* (PE).

  This framework should allow you to navigate the dispute without losing the thread, as the divergence points are now tied to specific truth-conditional predictions rather than general vibes about "standards."
