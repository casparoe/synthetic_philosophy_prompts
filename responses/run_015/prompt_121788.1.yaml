answer: |-
  You're spot on about the stalemate. If you've been reading the literature from Norton and Earman on one side and Bennett and Landauer on the other, it definitely feels like two ships passing in the night. You asked for a diagnosis of what kind of disagreement this is, and honestly, I think it's a mix of **level mismatch** and **metaphysical underdetermination**, with your point about counterfactuals hitting the nail on the head regarding why it's stuck.

  Here's the breakdown of what's actually going on, why the counterfactual thing matters, and what progress might look like.

  ### 1. The Diagnosis: Engineering vs. Ontology
  You asked if physicists are answering an engineering question while philosophers answer an ontology question. That's basically it, but it's more specific than that.

  *   **The Informationalists (Landauer/Bennett camp):** They are mostly doing **resource theory**. They treat information as a thermodynamic fuel. Their commitment is pragmatic: "If I want to build a computer that doesn't violate the Second Law, I have to budget for heat dissipation during erasure." For them, "information is physical" is a shorthand for "you can't decouple the logical state from the physical substrate without paying a tax." They aren't necessarily claiming bits are little atoms; they're claiming logical operations map to phase-space compressions.
  *   **The Exorcists (Earman/Norton camp):** They are doing **foundational consistency**. They worry about circularity. Their commitment is that Statistical Mechanics (SM) should be able to exorcise the demon without importing "information" as a new primitive. They argue that if you do the SM right, the demon fails because of thermal fluctuations in the trapdoor, not because of some abstract "bit erasure" cost. They think invoking information is a "panacea" that hides the real mechanical failure.

  **The Disagreement Type:** It's a **conceptual framework dispute**. Both sides can model the math correctly, but they disagree on which variables are fundamental. The Informationalists say "Information/Energy" are the conjugate pair. The Exorcists say "Position/Momentum" are the only real pair, and information is just a derived bookkeeping tool.

  ### 2. The Counterfactual Blind Spot
  This is where your intuition is sharper than most of the debate. You asked: *Do counterfactual states (trajectories the demon tracks but never actualizes) carry thermodynamic weight?*

  In standard Landauer reasoning, the cost comes from **erasure**, which is a many-to-one mapping. You reset the bit regardless of whether it was a 0 or a 1. But to do that, the system had to be *capable* of holding a 0 or a 1.

  *   **The Exorcist View:** Counterfactuals don't exist. The molecule was either on the left or the right. The demon's memory is either charged or discharged. If the molecule was on the left, the "right" state is fiction. Fiction doesn't weigh anything.
  *   **The Informationalist View:** The *capacity* to distinguish is what costs. The phase space volume of the memory device must be large enough to accommodate the counterfactuals.

  **Why this causes the stall:** Thermodynamics is inherently statistical (about ensembles), but the Second Law is often treated as a law about individual systems (you can't build *one* perpetual motion machine).
  If the cost lies in the **preparation of the measuring device** (setting up the phase space to allow for counterfactuals), then the cost is paid *before* the measurement, not during erasure. If the cost lies in the **erasure**, it's paid *after*.

  Neither side fully agrees on *when* the debt is incurred. The Exorcists say the debt is in the thermal noise of the mechanism (real, actualized energy). The Informationalists say the debt is in the reduction of uncertainty (which relies on counterfactual probabilities). Until they agree on whether thermodynamics applies to **single trajectories** or **ensembles**, they'll keep talking past each other.

  ### 3. Is it Just Verbal?
  It's not *just* verbal, but semantics are doing a lot of heavy lifting. The word "physical" is the culprit.
  *   If "physical" means "made of matter," information isn't physical.
  *   If "physical" means "constrained by physical law," then yes, information processing is physical.

  The fight is really about **reducibility**. Can information theory be fully reduced to Hamiltonian mechanics?
  *   **Yes (Exorcists):** Then we don't need a new principle; we just need better mechanics.
  *   **No (Informationalists):** Then Information is a fundamental category, like Energy or Mass.

  ### 4. What Would Count as Progress?
  Since the math works for both sides (they both save the Second Law), empirical experiments won't settle it. Progress has to come from one of three places:

  **A. A Formal Result (Single-Shot Thermodynamics)**
  Recent work in **quantum thermodynamics** and **single-shot stat mech** is actually making headway here. If we can formulate a version of thermodynamics that rigorously defines costs for single trajectories without relying on ensemble averages, we might bypass the counterfactual problem. If a formalism shows that the cost *must* be associated with the correlation (mutual information) rather than the mechanical gate, that's a win for the Informationalists. If it shows the cost is purely in the control Hamiltonian, that's a win for the Exorcists.

  **B. A Conceptual Distinction (Knowledge vs. Correlation)**
  We need to stop using the word "information" loosely. We need to distinguish between:
  1.  **Observer Knowledge:** What a human knows (subjective).
  2.  **Physical Correlation:** The mutual information between the demon and the gas (objective).
  The Exorcists attack #1 (saying thermodynamics shouldn't depend on what a human knows). The Informationalists defend #2 (saying physical correlations have entropy costs). If the debate shifts entirely to **physical correlation**, the verbal dispute dissolves.

  **C. An Admission of Ill-Posedness**
  This is the most likely outcome. We might have to admit that "Is information physical?" is a category error, like asking "Is software heavy?"
  *   Software isn't heavy, but the *drive* holding it is.
  *   Information isn't physical, but the *correlations* constraining the system are.
  Progress would be a consensus that Landauer's Principle isn't a fundamental law of nature, but a **boundary condition** on how we interface with systems. It's a rule about control, not a rule about atoms.

  ### The Bottom Line
  You're right that the debate is spinning. It's stuck because both sides are trying to claim the "real" explanation for the same mathematical result.

  **Real progress** won't be a new experiment. It'll be a shift in language. We need to stop asking if information *is* physical and start asking **where in the causal chain the entropy increase is localized.**
  *   Is it in the measurement (coupling)?
  *   Is it in the memory (storage)?
  *   Is it in the reset (erasure)?

  Until someone proves that the counterfactual phase-space volume *itself* generates a force or heat independent of the actualized trajectory, the Exorcists will keep calling it "accounting," and the Informationalists will keep calling it "physics." My bet? It's accounting that becomes physics only when you try to cash out the check.
