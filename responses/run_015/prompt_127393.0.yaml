answer: |-
  The smell of a woodworking shop is distinct—sawdust, oil, and the sharp scent of freshly cut pine. In this setting, imagine a master carpenter standing beside an apprentice who is struggling with a hand plane. The tool is simple: a blade fixed in a block of wood with handles. The goal is to shave a thin, consistent curl from a board. The master has explained the stance, the grip, and the angle. Yet, when the apprentice pushes the tool, the blade digs in too deep at the start and lifts off at the end, leaving a uneven, gouged surface.

  The master says, "Keep the pressure even." The apprentice tries, but the wood still tears. Verbal instructions have hit a wall. The master then steps in, places their hands over the apprentice's, and physically guides the motion. They move together for a few strokes. Then the master lets go, and the apprentice tries again. Sometimes, this works. The shave becomes consistent.

  This moment of physical guidance is the battleground for two competing views of knowledge. The first is the reductionist view, which argues that knowing how to plane is ultimately just knowing a complex set of facts about planing. The second is the anti-reductionist view, which claims that the skill is a distinct kind of understanding—a bodily attunement that cannot be reduced to facts.

  ### The Reductionist View: Hidden Facts in the Hands

  From the reductionist perspective, the apprentice's failure is a data deficit. When the master says "keep the pressure even," they are offering a high-level summary of many underlying rules. The reductionist argues that the smooth motion of the plane is actually the result of the brain processing hundreds of micro-propositions per second. Examples might include: *If the grain resistance increases, increase forward force by five percent,* or *If the handle tilts left, adjust wrist angle by two degrees.*

  In this view, the master carpenter possesses these facts. The reason the master cannot articulate them is not because they don't exist, but because they are too numerous and complex for conscious speech. They are stored as unconscious information. When the master places their hands over the apprentice's, they are not transferring a magical "feel"; they are manually inputting the correct physical data so the apprentice's nervous system can record the specific conditions under which certain pressures apply.

  The challenge for the reductionist here is significant. They must claim that the master's expertise relies on propositions the master cannot articulate, even to themselves. If you asked the master, "What is the exact pressure ratio between your left and right hand during the middle stroke?" they would say, "I don't know, I just do it." The reductionist must reply, "You *do* know, you just don't know that you know."

  This creates a strange picture of the carpenter. It suggests that inside the master's mind is a silent, hyper-complex manual that they follow perfectly without ever reading it. When the physical guidance happens, the reductionist sees it as a high-bandwidth download of these implicit rules. The apprentice succeeds later because they have successfully internalized enough of these hidden facts to replicate the motion. The risk for this view is that it turns fluid, intuitive action into a rigid, unconscious calculation. It struggles to explain why the master can adapt to a new type of wood instantly. If the skill were just a cluster of known facts about *this* pine, a new wood should require a new set of facts. Yet, the master adjusts immediately, suggesting a flexibility that feels less like retrieving data and more like improvisation.

  ### The Anti-Reductionist View: The Knowledge of the Body

  The anti-reductionist looks at the same scene and sees something fundamentally different. They argue that the master's expertise is not a list of rules, hidden or otherwise. It is a disposition—a trained capacity of the body to respond to the environment. When the master says "keep the pressure even," the instruction fails not because the facts are too complex, but because the knowledge isn't factual at all. It is a sensory alignment.

  In this view, the "feel" of the plane is not a code to be cracked; it is a relationship between the carpenter's muscles and the wood's resistance. When the master guides the apprentice's hands, they are not transmitting data. They are shaping a habit. They are tuning the apprentice's body like an instrument. The physical contact bypasses the intellect entirely to calibrate the nervous system directly.

  The challenge for the anti-reductionist is explaining the apprentice's eventual success without relying on facts. If the apprentice isn't learning rules, what are they learning? How do they correct themselves later when the master isn't there to guide their hands? If there are no internal propositions to check against—no mental rule saying *this is too much pressure*—how does the apprentice know they are drifting off course?

  The anti-reductionist answers that the correction comes from the same source as the action: the feedback loop of the task itself. The apprentice doesn't think, "I am violating rule four." Instead, the vibration in the handle changes, the sound of the shaving shifts, and the body simply adjusts. The knowledge is in the doing. Success isn't about matching an internal list of truths; it's about achieving a state of flow where the tool becomes an extension of the limb. The anti-reductionist accepts that there is a gap between what can be said and what can be done, and they argue this gap is where skill lives.

  ### The Breakdown of Words and the Transfer of Touch

  The moment the master grabs the apprentice's hands is where these two views diverge most sharply.

  For the reductionist, this physical intervention is a workaround for the limitations of language. Language is too slow and low-resolution to convey the thousands of micro-adjustments required. Touch is faster. It allows the master to force the apprentice's body into the correct positions so the apprentice's brain can infer the underlying rules. The reductionist must maintain that if we had a powerful enough computer to monitor the master's neurons, we could write down the manual that the master follows. The physical guidance is just a clumsy way of editing that manual.

  For the anti-reductionist, the physical intervention is essential because the knowledge is embodied, not mental. You cannot write the manual because the manual does not exist. The skill is not in the head waiting to be transferred; it is in the interaction between hand, tool, and wood. The master guides the hands because that is where the knowledge resides. To try to explain it in words is to categorize something that refuses categorization. The apprentice succeeds later not because they memorized the feeling, but because their body has been trained to seek that feeling again, much like a rider learns the balance of a horse not by studying physics, but by riding.

  ### Can the Views Survive the Scenario?

  The reductionist faces a difficult question: Can they explain the carpenter's expertise without positing hidden propositions the carpenter cannot articulate? They can, but it requires a leap of faith. They must argue that the inability to speak the rules is a limitation of human consciousness, not a limitation of the knowledge itself. They treat the master's intuition as a "black box" that processes inputs and outputs according to logical rules, even if the master isn't aware of the logic. This preserves the idea that all knowledge is factual, but it makes the definition of "fact" so broad that it includes unconscious neural firing patterns that look nothing like the sentences we usually call facts.

  The anti-reductionist faces the opposite question: Can they account for the apprentice's eventual success without attributing to her a corresponding body of factual knowledge? They can, by redefining what it means to "know." For them, knowing is not having a map; it is being able to navigate. The apprentice succeeds because they have developed a sensitivity, not a database. When they plane alone, they are not recalling facts; they are engaging in a dialogue with the wood. The risk here is making skill seem mysterious or inexplicable. If there are no facts involved, how do we teach this systematically? How do we improve? The anti-reductionist must argue that improvement comes from refined sensitivity and practice, not from accumulating more true beliefs.

  ### Conclusion

  The carpenter and the apprentice stand at the center of this philosophical divide. When the master lets go of the apprentice's hands, what remains? The reductionist says what remains is a newly installed set of unconscious instructions, a software update completed through touch. The anti-reductionist says what remains is a changed capacity, a new way of being in the world where the hand knows what the mind cannot say.

  Your experience with swimming mirrors this exactly. When you tried to explain floating, you were offering propositions—facts about buoyancy and limb position. But your friend needed what the apprentice needed: a recalibration of their relationship with the water. The reductionist would say your friend just needed more specific facts about water density and body distribution. The anti-reductionist would say your friend needed to stop trying to solve the problem intellectually and start feeling the support of the water.

  In the end, the carpentry scenario suggests that while facts play a role—we need to know which way to push the plane—the core of the skill lies in the moment words fail. Whether that moment represents a failure of language to describe complex facts, or a revelation that some knowledge is never factual at all, depends on whether you believe the master's hands are following a hidden script or writing a new one with every stroke.
