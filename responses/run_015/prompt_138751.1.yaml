answer: |-
  Here is a battle plan for the 80-minute slot. I am treating you as a colleague: I won't explain Grice, I will explain how to *stage* Grice for this specific audience mix without losing the semanticists to boredom or the non-linguists to confusion.

  ### 1. The Dependency Structure (Order of Operations)

  Do **not** open with the 1957 "Meaning" paper. For sophomores, "reflexive intentions" is a cognitive load spike that will kill the momentum before they understand *why* intentions matter.

  **The Correct Order:**
  1.  **The Phenomenological Gap (1967 Data):** Start with the intuition that *what is communicated* exceeds *what is said*.
  2.  **The Mechanism (Cooperation + Maxims):** Explain *how* the gap is bridged. This requires the assumption of Cooperation.
  3.  **The Definition (Said vs. Implicated):** Now you can define "Implicature" as the output of that mechanism.
  4.  **The Diagnostics (Cancellability, etc.):** Now that they know what an implicature *is*, show them how to prove it.
  5.  **The 1957 Grounding (Optional/Backend):** Only bring in "non-natural meaning" (intention-recognition) if you need to explain *why* the mechanism works or to handle the LLM question.

  **Why this order?**
  You cannot state what a conversational implicature *is* until you have established the **Cooperative Principle (CP)**. If you start with 1957, you have "Speaker Meaning" but no account of how it interacts with "Sentence Meaning."
  *   **Board State 1:** Utterance $U$.
  *   **Board State 2:** Proposition $P$ (What is Said: truth-conditional content, disambiguation, reference fixed).
  *   **Board State 3:** Proposition $Q$ (What is Communicated).
  *   **Board State 4:** The Gap ($Q - P$).
  *   **Board State 5:** The Bridge (CP + Maxims).
  *   **Board State 6:** The Test (Cancellability).

  **Where do the diagnostics go?**
  *   **Cancellability:** Introduce this *immediately* after defining implicature. It is the strongest, most intuitive test. It distinguishes implicature from entailment (crucial for your semantics students).
  *   **Calculability:** Introduce this when explaining *how* the hearer derives the implicature (the "working out" schema).
  *   **Non-detachability:** Leave this for later or omit. It requires knowledge of synonymy and conventional implicature, which muddies the water for a survey course.
  *   **Flouting:** This must come *after* the diagnostics. If you introduce flouting first, students think Gricean pragmatics is just a theory of irony. Flouting is a *violation* of the maxims used to generate meaning; they need to understand the standard operation first.

  ### 2. The Core Example

  Your constraints are mostly sound, but **"survives paraphrase"** is dangerous. Paraphrase often shifts register, which can trigger or kill implicatures (e.g., "He kicked the bucket" vs. "He died" loses the idiomatic flavor, but "Some" vs. "A subset" sounds robotic).

  **The Case:** *"Some of the students passed the exam."*
  **Context:** A professor speaking to a colleague after grading.

  **Why this case?**
  1.  **Engages the Semantics Half:** It directly targets Misconception (c). They know "some" logically entails "at least one." They often *think* it entails "not all." This example forces them to admit "not all" is cancellable ("...in fact, all of them did").
  2.  **Engages the Non-Semantics Half:** It is intuitively obvious that the professor is implying the others failed.
  3.  **Clean "What is Said":** Truth conditions are stable (at least one passed).
  4.  **Clean "What is Implicated":** Not all passed.
  5.  **No Markers:** No *but, therefore, even*.
  6.  **Straight-faced:** It is a Generalized Conversational Implicature (GCI), not a flout. This allows you to establish the baseline before moving to irony/metaphor.

  **Argument against your list:**
  Drop "survives paraphrase." Instead, require **"truth-conditional stability."** The "what is said" must remain true even if the implicature is false.
  *   *Test:* If all students passed, is "Some of the students passed" a lie? No. It's misleading, but true. This distinction is the heart of the lecture.

  **Why not the Gas Station or Reference Letter?**
  You are right to avoid them. The Gas Station case ("I'm out of petrol" / "There's a garage around the corner") relies on world knowledge about garages selling petrol, which invites the "is that entailment?" debate. The Reference Letter invites the "insincerity" confusion. The Scalar "Some" case is the cleanest interface between logic and use.

  ### 3. The Misconception Map

  Here is where to intercept the errors in real-time, not at the end.

  *   **(c) "Some literally means some but not all" (Entailment vs. Implicature):**
      *   *Intercept:* **Minute 15.** When defining "What is Said."
      *   *Move:* Ask the semantics students: "If all passed, is the sentence false?" When they say "No," write **ENTAILMENT** on the left and **IMPLICATURE** on the right. Use Cancellability immediately to prove it. "Some passed... in fact, all did." If it were entailment, this would be a contradiction. It isn't.
  *   **(e) Maxims = Politeness/Etiquette:**
      *   *Intercept:* **Minute 30.** When introducing the Maxims.
      *   *Move:* Give a counter-example. "Your breath smells." This violates Quality/Relation of politeness but obeys the Gricean maxims (it is true and relevant). Grice is about *efficiency of information transfer*, not social harmony.
  *   **(a) Implicature = "Hidden/Real" Meaning:**
      *   *Intercept:* **Minute 40.** During Calculability.
      *   *Move:* Emphasize that the implicature is *in addition to* what is said, not *instead of* it. The "what is said" is still part of the meaning.
  *   **(d) Cancellability = Lying/Contradiction:**
      *   *Intercept:* **Minute 45.** During Diagnostics.
      *   *Move:* Distinguish **Retraction** ("I lied, I take it back") from **Clarification** ("I meant X, to be precise"). Cancellability is clarification. "Some passed. I didn't say only some."
  *   **(b) Implicature = Whatever the Hearer Infers (Context Collapse):**
      *   *Intercept:* **Minute 50.** During the "Working Out" schema.
      *   *Move:* Show that inferences must be *derivable* from the Maxims. If I say "It's raining" and you infer "I hate your shoes," that is not a Gricean implicature because no maxim bridges that gap. It restricts "context" to "context + CP."

  ### 4. Edge Cases: Twins and LLMs

  **The Twins Code (Private Code):**
  *   *Verdict:* **Keep it, but limit to 3 minutes.**
  *   *Placement:* After Diagnostics, before Flouting.
  *   *Why:* It is the perfect test for **Non-Conventionality**.
  *   *Execution:* "The kettle's on."
      *   *Scenario A (Code):* Means "Let's leave." If you say "The kettle is boiling" (paraphrase), the meaning is lost. It fails the paraphrase test. It is conventional (between them).
      *   *Scenario B (Implicature):* "It's getting late." Means "Let's leave." Paraphrase "It is past 10 PM" keeps the meaning.
      *   *Lesson:* Implicature relies on *reasoning*, Code relies on *decoding*. This pre-empts the "isn't all language just code?" objection.

  **The LLM Question ("Do Models Implicate?"):**
  *   *Verdict:* **This is your closing argument.**
  *   *Placement:* Last 10 minutes (before the assessment).
  *   *The Honest 20-Second Version:* "Grice's theory is built on **intention**. To implicate something, you must intend the hearer to recognize that intention. An LLM has no intentions; it predicts tokens. So, strictly speaking, an LLM cannot implicate. However, *you* (the user) interpret it *as if* it were cooperating. So the implicature exists in the *hearer*, not the *speaker*. This breaks Grice's speaker-centric model but keeps the pragmatic effect."
  *   *Why:* It acknowledges the AI angle without derailing the lecture into philosophy of mind. It reinforces the "Intention" requirement of 1957 without having taught the whole paper.

  ### 5. The Final Check & Exclusions

  **The 10-Minute Check:**
  Do not ask them to memorize definitions. Ask them to **diagnose**.
  Provide three sentences on a slide. Ask them to identify which one contains a conversational implicature and prove it using **Cancellability**.

  1.  "She has three children." (Implicature: exactly three. Cancellable: "In fact, four.")
  2.  "He is poor but honest." (Conventional Implicature on 'but'. **Not** cancellable without contradiction/weirdness.)
  3.  "The cat is on the mat." (Entailment: The cat is on something. **Not** cancellable.)

  *Task:* "Pick #1. Show me the cancellation. Explain why #2 fails the test."
  *Success Metric:* If they try to cancel #2 ("He is poor but honest, and there's no contrast") and see it breaks the sentence, they understand the distinction.

  **Explicit Exclusions (Say this out loud):**
  To protect your time, write this on the board at the start under "Out of Scope":
  1.  **Neo-Gricean Scales (Horn/Levinson):** We are doing classic Grice. We are not formalizing the scales today.
  2.  **Relevance Theory:** We are not discussing Sperber & Wilson's critique of the Maxims today.
  3.  **Contextualism vs. Minimalism:** We are assuming "What is Said" is propositional. We are not debating how much context gets into "Said" (e.g., weather cases like "It's raining").
  4.  **1957 Intention Analysis:** We are using intention as a prerequisite, not analyzing the reflexive structure.

  **Why exclude these?**
  If you don't, the semantics students will ask about scalar strengthening (Levinson), and the philosophy students will ask about the circularity of intention (1957). By explicitly bracketing them, you validate the questions ("Good question, that's the next level") without answering them ("That's not today's level").

  ### Summary Timeline (80 Minutes)

  *   **00-10:** **The Gap.** Example: "Some of the students passed." Elicit "Not all." Ask: "Is 'Not all' part of the sentence meaning?"
  *   **10-35:** **The Mechanism.** Define "What is Said" (Truth Conditions). Define CP & Maxims. Show the calculation of "Not all" via Quantity Maxim. (Intercept Misconceptions C & E).
  *   **35-55:** **The Diagnostics.** Cancellability test. Apply to "Some." Apply to "But" (Conventional). Apply to Entailment. (Intercept Misconception D).
  *   **55-65:** **Flouting.** Briefly show how breaking a maxim *generates* meaning (Irony). Distinguish from the "Some" case (Observing vs. Flouting).
  *   **65-70:** **Edge Cases.** Twins Code (Decoding vs. Inferring).
  *   **70-75:** **LLM Limit Case.** Intentions vs. Simulation.
  *   **75-80:** **Assessment.** The Three Sentence Diagnostic.

  This structure respects the dependency: you can't test (Diagnostics) what you haven't defined (Mechanism), and you can't define the Mechanism without showing the Gap (Data). It keeps the AI angle contained but addressed, and it protects you from the "Semantics vs. Pragmatics" turf war by using the Scalar case to show they are distinct but interacting systems.
