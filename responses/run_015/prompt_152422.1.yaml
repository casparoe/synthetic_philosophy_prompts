          *   Ontology: Momentary occurrents (no local production).
          *   Mechanism: Global constraint linking total state $t_1$ to $t_2$ (like al-Ghazālī's habit, but secular/non-divine).
          *   Arguments: (i) Better than Humeanism on *why* there is order; (ii) Dissolves mental/physical exclusion; (iii) Empirical equivalence is a feature (metaphysics underdetermined).
      *   **Audience (The Room):**
          1.  Lewis-style Humean (Best System Account).
          2.  Older-school Regularity Theorist.
          3.  Dispositionalist (Molnar/Mumford - Powers).
          4.  Interventionist (Woodward-style).
          5.  Philosopher of Physics (Causation is macro/non-fundamental).
          6.  Historian of Medieval Philosophy.
