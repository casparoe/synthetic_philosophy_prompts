answer: |-
  # Q&A Prep Sheet: Coordination Occurrentism

  **Strategy Note:** Your view sits in a precarious triangle between Humeanism, Powers Realism, and Theistic Occasionalism. Your main selling point is *explanatory direction* (the constraint explains the order, not vice versa). Your main vulnerability is that this distinction looks verbal to everyone except the Dispositionalist, to whom it looks incoherent. Do not get bogged down in defending the label "occasionalism"; defend the *structure of explanation*.

  ---

  ### 1. The Lewis-Style Humean (Best System Account)
  **Damage Level:** Critical. They occupy your nearest neighbor territory and will argue you've added ontological cost with no explanatory gain.
  **The Objection:** "You claim your 'global constraint' explains the order better than my Best System. But if the constraint isn't reducible to the occurrents, you've posited a necessary connection between distinct existences, which is metaphysically costly. If it *is* reducible, you're just a Humean. If it's not, you haven't explained *why* the constraint holds; you've just pushed the bruteness from the regularities to the constraint. What explanatory work is this constraint actually doing that the Humean mosaic plus the Best System doesn't do?"

  *   **2-Minute Reply:** "The difference isn't in the ontology of the *relata*, but the direction of fit. For the Humean, laws supervene on the mosaic; the order is brute, and laws are summaries. For me, the constraint is prior to the specific regularities. It explains *why* the mosaic is orderly rather than chaotic. The Humean must accept that a chaotic mosaic is just as fundamental as an orderly one. I posit a structural feature of time that favors coordination. It's not a necessary connection between *events*, but a condition on *succession*."
  *   **Concede:** You must concede that empirically, the predictions are identical. You cannot claim your view predicts *more*.
  *   **Hold:** Hold that metaphysical explanation is not the same as scientific prediction. The "why" of order is a legitimate question the Humean rules out by fiat.
  *   **Soft Spot:** The claim that the constraint explains the order without itself needing explanation. If the constraint is brute, the Humean will say you've just renamed "brute regularity" to "brute constraint."

  ### 2. The Dispositionalist (Molnar/Mumford Camp)
  **Damage Level:** High. They will argue you have abolished causation entirely, making change miraculous.
  **The Objection:** "You say nothing local produces anything locally. That means when a billiard ball strikes another, the second ball's motion is not grounded in the first ball's properties or the collision. It's a miracle at every instant. You claim this solves causal exclusion, but it does so by making *everything* epiphenomenal. If the physical doesn't produce the physical, why think the mental is safe? You haven't saved non-reductive physicalism; you've endorsed universal occurrentalism where nothing does anything."

  *   **2-Minute Reply:** "I accept that local production is an illusion. But 'miracle' implies violation of expectation. My global constraint *is* the expectation grounded in the structure of time. Regarding exclusion: the worry arises because mental and physical compete for the *same* productive role. If there is no productive role, there is no competition. The mental can be real as a pattern within the occurrents without needing to 'push' the next state. We save the phenomena of agency without the metaphysics of power."
  *   **Concede:** Concede that on your view, agents do not "produce" outcomes in the powers-realist sense.
  *   **Hold:** Hold that "production" is the confused concept, not the absence of it. The exclusion problem dissolves, not because the mental is special, but because the physical isn't causally potent either.
  *   **Soft Spot:** The intuition that *something* must ground the change. If neither ball has the power, and there is no God, the Dispositionalist will press: "What *ontologically grounds* the transition?"

  ### 3. The Philosopher of Physics
  **Damage Level:** Medium-High. They will argue your "constraint" is just the time-evolution operator, making your metaphysics redundant.
  **The Objection:** "Fundamental physics already describes the transition from total state $t_1$ to $t_2$ via Hamiltonians or unitary operators. These are global constraints. You're dressing up the Schrödinger equation in metaphysical clothing and calling it 'occasionalism.' If your constraint adds nothing to the physics, why is it a *metaphysical* thesis rather than just a restatement of dynamical laws? You're reifying the math."

  *   **2-Minute Reply:** "Physics tells us *how* the state evolves; metaphysics asks *what it is* about reality that allows that evolution. The Hamiltonian is a representation of the constraint, not the constraint itself. My claim is that the physics underdetermines whether this evolution is driven by local powers or global coordination. I'm arguing for the latter interpretation of the same math. It's not redundant; it's an interpretive layer that resolves metaphysical puzzles like exclusion."
  *   **Concede:** Concede that physics does not require your interpretation.
  *   **Hold:** Hold that physics is silent on the *direction of explanation* between laws and occurrences.
  *   **Soft Spot:** If they press that "global constraint" is just a synonym for "dynamical law," you risk looking like you're fighting over words.

  ### 4. The Interventionist (Woodward-style)
  **Damage Level:** Medium. They will attack the utility of your view for scientific practice.
  **The Objection:** "Causal claims are about what happens under manipulations. I can manipulate a local variable to see if it changes another. Your 'global constraint' links total states. I cannot manipulate the total state of the universe. If your account of causation makes causal claims inaccessible to intervention, it's useless for science. You've made causation metaphysically safe but scientifically inert."

  *   **2-Minute Reply:** "I distinguish fundamental metaphysics from macro-level causal modeling. At the macro level, interventionism works perfectly as a tool. My thesis is about the *fundamental ground* of those macro-regularities. Just because the fundamental layer isn't manipulable doesn't mean it doesn't exist. We don't demand that quantum wavefunctions be manipulable in the same way levers are."
  *   **Concede:** Concede that your view offers no new interventions or experimental predictions.
  *   **Hold:** Hold that the job of metaphysics is not to provide tools for manipulation, but to account for the possibility of those tools working.
  *   **Soft Spot:** The disconnect between your fundamental ontology and the special sciences. If the fundamental layer is "coordination," why do local interventions work so reliably?

  ### 5. The Historian of Medieval Philosophy
  **Damage Level:** Medium (Mostly terminological, but undermines your framing).
  **The Objection:** "You've detached occasionalism from the only thing that made it viable: God. For al-Ghazālī, the 'habit' is God's will. Without a Will to sustain the coordination, your 'global constraint' is just a brute fact. Occasionalism was a solution to the problem of divine omnipotence and human agency. Secularized, it's not a solution; it's just Humeanism with a mystical name. You're trading on the historical prestige of the view without the theological engine."

  *   **2-Minute Reply:** "I'm not doing exegesis; I'm doing reconstruction. The core insight of occasionalism isn't theology; it's the asymmetry of dependence. The moments depend on the coordination, not vice versa. Whether the coordinator is God or a structural feature of time is a secondary parameter. I'm arguing the *structure* of the explanation is sound even if the *agent* is removed."
  *   **Concede:** Concede that this is not historical occasionalism.
  *   **Hold:** Hold that the *logical form* of the view is separable from its theological instantiation.
  *   **Soft Spot:** The Historian is right that without a Will, the "habit" looks arbitrary. You need to explain why the constraint is stable without a Sustainer.

  ### 6. The Older-School Regularity Theorist
  **Damage Level:** Low. They will ask a simpler version of the Lewisian objection.
  **The Objection:** "If nothing produces anything, and we just have one thing after another linked by a constraint, how is this different from saying 'it's a universal regularity that $t_1$ is followed by $t_2$'? You're positing a 'constraint' to do the work of a 'law.' Why complicate the ontology?"

  *   **2-Minute Reply:** "A regularity is a description of what happens. A constraint is an account of *why* it happens consistently. The regularity theorist says 'it just does.' I say 'it does because the structure of temporal succession requires coordination.' It's the difference between a map and the terrain."
  *   **Concede:** Concede the empirical equivalence.
  *   **Hold:** Hold that "why there is order" is a meaningful question.
  *   **Soft Spot:** Risk of sounding like you're positing a "virtus dormitiva" (a sleeping power) to explain the order.

  ---

  ### 🚩 Preempt This Objection During the Talk
  **Target:** The Lewis-Style Humean's Charge (Objection #1).
  **Why:** If you let them frame your view as "Humeanism with extra steps," you lose the room. You need to define the "direction of explanation" distinction *before* they attack it.
  **How:** In your introduction, explicitly contrast your "Global Constraint" with the "Best System." Say: *"Unlike the Humean, who treats laws as summaries of the mosaic, I treat the constraint as prior to the specific regularities. This isn't a difference in prediction, but in metaphysical priority."* This forces them to argue against your framing rather than imposing their own.

  ---

  ### 💀 The Question You Hope Nobody Asks
  **The Question:** "You argue the constraint is not reducible to occurrents, but also not a productive power. So, what is its *modal status*? Is it necessary or contingent? If it's necessary, you're a necessitarian about laws. If it's contingent, what prevents it from changing tomorrow? If it can't change, isn't it just a necessary truth, and if so, why call it a 'constraint' rather than logic?"

  **Why it's deadly:**
  1.  **If Necessary:** You collapse into a form of Laws-of-Nature Realism (Armstrong/Tooley), which you claimed to avoid by denying productive powers.
  2.  **If Contingent:** You have to explain what grounds this contingency if not the occurrents (which would make it Humean) and not God (which you removed). It looks like a brute modal fact, which weakens your claim to explain "why there is order."
  3.  **The Trap:** This question forces you to specify the ontology of the constraint. If you can't, the view looks like a placeholder. If you do, you likely collapse into one of the rival views you're trying to supersede.

  **Prepared Stumble:** "The constraint is a structural feature of temporal succession, not a modal fact in the standard sense..." (This is vague, but it's the only safe ground you have).
