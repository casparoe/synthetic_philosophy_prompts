          *   *Comparison:* New vs. Old. New = more malleable, more anxiety, more agency. Old = rigid, more stigma, more predictability.
          *   *Concrete advice:* With a new label, you have more power to define what it means *for you*, but less support. With an old label, you have more support, but less freedom.
      *   **Implication 3: Clinician Interaction (The Other Side of the Loop).**
          *   *Concept:* The loop isn't just internal; it's relational. Clinicians treat the label, not just the symptoms.
