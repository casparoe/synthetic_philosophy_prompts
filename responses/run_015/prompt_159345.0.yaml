      *   *Placement:* **Top.** You must disclaim this immediately or engineers will tune out thinking you're claiming humans know all math.
      *   *Phrasing:* "This isn't a claim that you know Fermat's Last Theorem. It's a claim that our best map of 'knowing' says you should."

  9.  **Drafting the Plan (Iterative refinement):**
