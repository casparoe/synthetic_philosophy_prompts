answer: |-
  This is a precise and well-structured inquiry into one of the most persistent structural problems in epistemic logic. You have correctly identified that the phenomenon is broader than its most famous instantiation.

  Here is the breakdown you requested: the identity of the argument, its minimal conditions, its generalization limits, its distinctions from neighbouring paradoxes, and the status of proposed fixes.

  ### One: Identity and Canonical Name

  The argument you describe is canonically known as **Fitch's Paradox of Knowability** (or the **Church-Fitch Theorem**). It was published by Frederic Fitch in 1963 (though discovered earlier by Alonzo Church).

  While "Fitch's Paradox" is the standard label, it is indeed tied to the epistemic application. For the generalized logical schema you are encountering in data theory and other domains, there is no single universally established name distinct from the paradox itself. However, in technical literature, it is often referred to as the **Knowability Result** or the **Verificationist Collapse**.

  Regarding your memory of "blind spot": You are recalling the term **Epistemic Blind Spot**, popularized by Roy Sorensen (specifically in his book *Blindspots*, 1988).
  *   **The Argument:** Fitch's Paradox (or the Church-Fitch Theorem).
  *   **The Proposition:** The specific compound claim ($p \land \neg Kp$) is a **Moore Sentence** (or Moorean Proposition) or an **Epistemic Blind Spot**.
  *   **The Phenomenon:** The structural collapse of a possibility operator into an actuality operator given specific axioms.

  **Minimal Conditions on the Operator:**
  For the derivation to hold, the operator $O$ (standing in for "Known," "Recorded," etc.) must satisfy three conditions within a classical modal logic framework:
  1.  **Factivity:** $Op \to p$ (If it is $O$-ed, it is true).
  2.  **Conjunction Distribution:** $O(p \land q) \to (Op \land Oq)$ (To $O$ a conjunction is to $O$ the conjuncts).
  3.  **Logical Omniscience (Weak):** The logic must allow the substitution of logical equivalents within the scope of the operator, or at least support the inference that if a contradiction is derived from $O(p \land \neg Op)$, then $\neg \Diamond O(p \land \neg Op)$.

  If these hold, the principle $\forall p (p \to \Diamond Op)$ entails $\forall p (p \to Op)$.

  ### Two: Generalization and Variants

  You asked how far the pattern stretches. The "load-bearing" feature is indeed **Factivity**, as your justified belief experiment confirmed. Here is the status of your three variants:

  **(a) Relativized Knowers:**
  *   *Principle:* "For every truth, there is *some* agent who could know it" ($\forall p (p \to \Diamond \exists x K_x p)$).
  *   *Result:* **It still collapses.**
  *   *Derivation:* Assume there is a truth $p$ unknown by agent $a$. Consider the proposition $q = (p \land \neg K_a p)$. If $q$ is true, by the principle, some agent $b$ could know $q$. If $b$ knows $q$, $b$ knows $\neg K_a p$. By factivity, $\neg K_a p$ is true. But if $b$ knows $q$, $b$ knows $p$. This does not immediately contradict $a$'s ignorance.
  *   *Correction:* To get the collapse, the proposition must be indexed to the knower. If the principle is "For any agent $x$ and truth $p$, $x$ could know $p$," it collapses to "Every agent is omniscient." If the principle is "For any truth, *someone* could know it," the paradox requires a proposition like " $p$ is true and *no one* knows $p$." If that proposition is true, it cannot be known by anyone (since knowing it would make it false). Thus, if the principle applies to *that* proposition, it entails that no one can know it, which contradicts the principle that *all* truths are knowable by *someone*.
  *   *Conclusion:* It collapses to **Collective Omniscience** (There are no truths unknown to everyone).

  **(b) Temporal Recasting:**
  *   *Principle:* "Every truth is known at some time" ($\forall p (p \to \exists t K_t p)$).
  *   *Result:* **It depends on the indexing.**
  *   *Derivation:* If the proposition is " $p$ is true and is never known" ($p \land \forall t \neg K_t p$), and this proposition is true, then by the principle, it must be known at some time $t^*$. But knowing it at $t^*$ entails knowing $\forall t \neg K_t p$, which entails $\neg K_{t^*} p$. But knowing the conjunction at $t^*$ entails $K_{t^*} p$. Contradiction.
  *   *Nuance:* If the proposition is " $p$ is true and is not known *now*," this can be known *later*. The collapse only occurs if the proposition quantifies over *all* times (including the time of knowing).
  *   *Conclusion:* It collapses to **Omnitemporalism** (All truths are known at some time) only if the "unknown" clause covers the time of the potential knowing.

  **(c) Weakened Target (Settled/Decidable):**
  *   *Principle:* "Every truth is such that it could be settled" ($\forall p (p \to (\Diamond Kp \lor \Diamond K\neg p))$).
  *   *Result:* **It collapses back to the original.**
  *   *Reasoning:* If $p$ is true, then $\neg p$ is false. By factivity, $\neg p$ cannot be known ($\neg \Diamond K\neg p$). Therefore, for the disjunction $(\Diamond Kp \lor \Diamond K\neg p)$ to hold for a truth $p$, the first disjunct $\Diamond Kp$ must hold.
  *   *Conclusion:* For truths, "decidable" reduces to "knowable." The paradox re-emerges with full force.

  **The Load-Bearing Wall:** Your suspicion is correct. **Factivity** is the essential ingredient. In your justified belief case ($J$), $J(p \land \neg Jp)$ entails $Jp \land J(\neg Jp)$. Since $J$ is not factive, $J(\neg Jp)$ does not entail $\neg Jp$. Thus, no contradiction arises. The argument requires that $O$-ing a proposition guarantees its truth.

  ### Three: What This Pattern Is Not

  You want to distinguish this from four neighbouring phenomena.

  **(i) Ordinary Modal Collapse:**
  *   *Standard Modal Collapse:* In S5 modal logic, $\Diamond \Box p \to \Box p$. This turns "possibly necessary" into "necessary."
  *   *Fitch's Collapse:* This turns "possibly $O$-ed" into "actually $O$-ed" ($\Diamond Op \to Op$), but *only* under the assumption that all truths are possibly $O$-ed.
  *   *Difference:* Standard modal collapse is a feature of the modal system's axioms (S5). Fitch's collapse is a **theorem derived from the interaction** between a modal operator ($\Diamond$) and an epistemic/operator ($O$) with specific structural properties (Factivity + Distribution). It is a "local" collapse induced by the operator's nature, not a "global" collapse of the modal logic itself.

  **(ii) Self-Referential / Liar Arguments:**
  *   *Liar:* Relies on syntactic diagonalization to construct a sentence that asserts its own falsity ($\lambda \leftrightarrow \neg True(\ulcorner \lambda \urcorner)$).
  *   *Fitch:* Does not require syntactic self-reference. It relies on an **existential assumption** (that there exists at least one unknown truth) and the logical properties of the operator applied to a conjunction.
  *   *Difference:* The Liar generates a contradiction from a single sentence's truth conditions. Fitch generates a contradiction from a **principle about a class of sentences** (all truths) combined with the existence of a specific type of sentence (a Moore sentence). The proposition $p \land \neg Op$ is not self-referential in the syntactic sense; it refers to the epistemic status of $p$, not to itself directly, though it becomes self-defeating when $O$ is applied to it.

  **(iii) Limitative Results (Gödel):**
  *   *Gödel:* Shows that in any consistent formal system, there are truths that are **unprovable** within that system.
  *   *Fitch:* Shows that if all truths are **knowable** (in principle), then all truths are **known**.
  *   *Difference:* Gödel is a result about the limits of *formal derivation* within a fixed system. Fitch is a result about the limits of *truth* relative to an epistemic operator. They are in tension: Gödel suggests there are truths we cannot know (if knowledge implies provability); Fitch suggests that if we assume we *can* know them, we *do* know them. Fitch is a *reductio* of the Verificationist Principle; Gödel is a proof of Incompleteness.

  **(iv) Moorean Sentences:**
  *   *Moore:* "$p$, but I don't believe $p$." This is pragmatically odd but logically consistent.
  *   *Fitch:* Uses the Moorean sentence as a **premise for a reductio**.
  *   *Difference:* Observing that Moorean sentences are odd is a psychological or pragmatic point. Fitch's argument is a logical proof that **Moorean sentences cannot be known**. The paradox is not that the sentence is odd, but that the *possibility of knowing it* leads to the conclusion that no such sentences exist (i.e., no unknown truths exist).

  ### Four: The Fixes and Restrictions

  You asked about restricting the quantifier to avoid propositions that embed the operator.

  **1. The Restriction Strategy:**
  This is often called the **Cartesian Restriction** (after Descartes' "clear and distinct" ideas, though the term is modern). It proposes that the Knowability Principle applies only to **Cartesian Propositions**: propositions $p$ such that it is logically consistent that $p$ be known ($\Diamond Kp$).
  *   Since $p \land \neg Kp$ is not consistently knowable (as Fitch proves), it is excluded from the domain of the principle.
  *   *Is it Principled?* Critics (like Williamson) argue this is **ad hoc**. It saves the principle by defining the domain of "truths" as "truths that don't break the principle." It looks like immunizing a theory from falsification by restricting its scope to cases where it works.
  *   *Impredicativity:* Yes, this is structurally identical to the worry about impredicative definitions. You are defining the set of knowable truths by quantifying over a domain that includes the concept of "knowable" itself. **Neil Tennant** has defended a version of this, arguing that the restriction is principled because only "Cartesian" statements are candidates for verification in the first place.

  **2. The Logic Change (Intuitionism):**
  Promoted by **Michael Dummett**.
  *   If you reject Classical Logic (specifically the Law of Excluded Middle and Double Negation Elimination) and adopt **Intuitionistic Logic**, the derivation stalls.
  *   In Intuitionistic logic, Fitch's proof shows that $\neg \exists p (p \land \neg Kp)$ is not derivable in the same way. Instead, it derives $\neg \neg \forall p (p \to Kp)$, which is weaker.
  *   *Status:* This is regarded as a **principled** fix by Anti-Realists, as it aligns with the view that truth is constituted by knowability. However, it requires accepting that "It is not the case that there are unknown truths" does not entail "All truths are known."

  **3. The "Type-Theoretic" Fix:**
  *   Similar to the restriction strategy but formalized. One posits a hierarchy of knowledge operators ($K_1, K_2, \dots$) where $K_n$ cannot apply to propositions containing $K_n$.
  *   *Status:* This avoids the paradox but is often viewed as **ad hoc** in natural language contexts, as natural language knowledge operators do not appear to be typed.

  ### Summary Definition for Print

  If you need to define this pattern in your own work without tying it solely to epistemology, I suggest the following formulation:

  > **The Fitch-Church Schema (or Epistemic Collapse Argument):**
  > A logical derivation demonstrating that for any factive operator $O$ distributing over conjunction, the principle that "all truths are possibly $O$-ed" ($\forall p(p \to \Diamond Op)$) entails the conclusion that "all truths are actually $O$-ed" ($\forall p(p \to Op)$). The derivation turns on the inconsistency of $O$-ing a 'Moore-type' proposition ($p \land \neg Op$).
  >
  > **Boundary Conditions:** The schema requires the operator to be **factive** ($Op \to p$). It fails for non-factive operators (e.g., 'justified belief'). It is distinct from the Liar Paradox as it relies on the structural properties of the operator rather than syntactic self-reference, and distinct from standard Modal Collapse as it is a theorem of epistemic logic rather than an axiom of modal systems.

  This captures the structure, the necessary conditions, and the distinctions you sought.
