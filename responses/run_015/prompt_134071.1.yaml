          *   If you *lack* a clock (bounded memory): You can't tell if you are near the end. You must act based on the *average* expected future.
          *   *Inferred Hazard:* This is Bayesian. If I know relationships die out, and we are still going, am I in a "sturdy" relationship or just lucky?
          *   *Equilibrium:* Yes, cooperation can still be an equilibrium, but the condition depends on the *stationary belief* about continuation.
