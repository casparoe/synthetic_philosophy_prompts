      *   *Probabilistic Game:* You are climbing a ladder into fog. At every rung, there is a chance the ladder continues and a chance it stops. You never see the top. You can't say "At the top I will jump" because you never know which rung is the top until you fall off.
      *   *Decaying/Memory:* The fog is getting thicker (decay), but your goggles are foggy (bounded memory). You don't know how high you are. You have to guess the average length of the ladder. If your guess is "long enough," you cooperate.

  7.  **Checking the Technical Details (Self-Correction):**

