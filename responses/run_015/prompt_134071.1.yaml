      *   *Gut Level:* It's not about the *existence* of a last round, it's about *identifying* it. You can't start the induction from the end if you can't see the end. At every step, you think "There might be another round."
      *   *Key Distinction:* Ex-ante (before playing) vs. Ex-interim (while playing). Ex-ante, the game ends w.p. 1. Ex-interim, at any round $t$, the conditional probability of continuing is still $w$. The "end" recedes like a horizon.
      *   *Analogy:* Walking towards the horizon. You know the earth ends (or curves away), but you never reach the edge.

  3.  **Address the Twist (Decaying $w$, Bounded Memory):**

      *   *Scenario:* $w_t$ decreases over time. Memory is bounded (say, length $M$).
