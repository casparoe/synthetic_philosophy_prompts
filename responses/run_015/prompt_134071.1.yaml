      *   *Decaying $w$ + Bounded Memory:* If $w_t$ is a function of $t$, and I don't know $t$, I have a belief distribution over $t$. The incentive constraint is $\sum P(t | \text{history}) \cdot \text{Payoff}_t$. If this sum supports cooperation, it holds.
      *   *The "Clock":* The standard framing assumes players know $t$ (or that $w$ is constant so $t$ doesn't matter). If $w$ varies and players don't know $t$, the "shadow" is the *expected* shadow.

