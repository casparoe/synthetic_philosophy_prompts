      *   *Part 1: The Induction Block.* Focus on *Information Sets*. Backward induction works on the *tree*. In the finite game, the last node is a singleton information set. In the probabilistic game, every node looks the same (or rather, every node has a continuation branch). You can't label a node "Last."
