      *   *Equilibrium Condition:* Strategies must be optimal given *beliefs*.
      *   *Beliefs:* If I don't know $t$, I form a belief about $t$ based on the fact that I'm still playing. (Survivorship bias).
      *   *The "Clock" Issue:* The standard "shadow of the future" ($\delta = w \cdot \text{payoff}$) assumes you know the current discount factor. If $w$ depends on $t$ and you don't know $t$, you need the *expected* continuation value.
      *   *Cooperation Viability:* Cooperation holds if the *expected* shadow of the future is large enough.
      *   *Inferred Hazard:* It's the hazard they infer. If they know $w$ decays, being alive at round 1000 implies you got lucky many times. Does that update your belief about $w$?
      *   *Crucial Point:* If memory is bounded and stationary strategies are used, the game becomes effectively a stationary repeated game with an *average* discount factor.
      *   *The Break:* The "shadow of the future" framing breaks if the player's belief about the future length is correlated with their current action in a way that undermines incentives. But mainly, it breaks if the *inferred* probability of continuation drops below the threshold needed for Grim Trigger.

  4.  **Synthesize the "Gut-Level" Explanation:**

      *   *The Induction Block:* Backward induction is an algorithm that requires a base case ("This is the last round"). In the probabilistic game, the base case is never *observable*. You are never handed a note saying "Game Over after this." You only find out it was the last round *after* it's too late to defect strategically (because the game is over).
      *   *The "Last Round" Paradox:* Yes, there is a last round. But you can't condition your strategy on "If this is the last round." You can only condition on "If the game continues." Since the probability of continuing is always $w > 0$ *conditional on being here*, the logic holds.
