answer: |-
  You have correctly identified the hand-wavy part of the standard textbook explanation. "There is no last round" is a convenient fiction. The mathematically precise truth is: **There is a last round almost surely, but it is never common knowledge *ex-interim*.**

  Here is the gut-level resolution to your bug, followed by the breakdown of your bounded-memory/decaying-hazard scenario.

  ### 1. What actually blocks the induction?

  Backward induction is an algorithm that operates on **information sets**, not just physical nodes on a game tree. To start the induction, you need a base case: a node where a player knows, with probability 1, that no future punishment is possible.

  In a finitely repeated game with known horizon $T$:
  *   At round $T$, my information set tells me "This is round $T$."
  *   Therefore, I know $P(\text{continue}) = 0$.
  *   Therefore, I defect.

  In the probabilistic game (constant $w$):
  *   At *any* round $t$, my information set is identical (or at least, does not include a "Game Over" flag).
  *   Conditional on me being asked to move, $P(\text{continue}) = w > 0$.
  *   Therefore, the threat of future punishment always has non-zero weight.

  **The Gut-Level Fix:**
  You are conflating **Ex-Post Reality** with **Ex-Interim Incentives**.
  Yes, in the realized history where the game stops at $t=14$, round 14 *was* the last round. But at the moment the player moved at $t=14$, they did not know it was $t=14$ (the last one). They assigned probability $w$ to there being a round 15.

  To defect strategically on the last round, you must be able to **condition your action on the fact that it is the last round.** If the game structure doesn't hand you a note saying "THIS IS THE END" before you move, you cannot execute the "Defect on Last Round" strategy. You can only execute "Defect if I think this is the last round." Since you never think that (probability is always $w$), the induction never ignites.

  The induction doesn't fail because the end doesn't exist; it fails because the end is **uncobservable** until after it's too late to exploit it.

  ### 2. The Decaying Hazard / Bounded Memory Scenario

  This is where your intuition about the "clock" is spot on. The standard "Shadow of the Future" framing ($\delta \ge \text{threshold}$) implicitly assumes players know the discount factor $\delta$ applicable to the current decision.

  If continuation probability $w_t$ decays over time, but players have bounded memory (cannot count rounds beyond $M$), two things happen:

  #### A. It is the Inferred Hazard that Matters
  Equilibrium strategies map **information sets** to actions. If your memory is bounded, your information set at $t=100$ is the same as at $t=1000$. You cannot play "Cooperate at 100, Defect at 1000." You must play the same action in both cases.

  Therefore, the incentive constraint depends on your **subjective belief** about the continuation probability, given your information set.
  *   **Objective Hazard:** The actual $w_t$ determined by nature.
  *   **Inferred Hazard:** $E[w_t \mid \text{I am still playing}]$.

  Cooperation is an equilibrium if and only if the **Inferred Hazard** is high enough to sustain it. If the objective hazard decays to 0, but your bounded memory prevents you from realizing you are near the end, you might cooperate "too long" (from an objective view). Conversely, if surviving many rounds signals to you that "relationships usually die by now," your inferred hazard might drop even if the objective hazard hasn't changed much.

  #### B. Where the "Shadow of the Future" Framing Breaks
  The framing breaks when the **Shadow becomes a random variable correlated with survival.**

  In the standard model, the shadow is a constant scalar $\delta$. In your decaying model, the shadow is a function of $t$.
  *   **If players have a clock:** They know $t$. They cooperate while $w_t$ is high, and defect once $w_t$ drops below the threshold. The "shadow" shrinks visibly.
  *   **If players lack a clock (bounded memory):** They must maintain a belief distribution over $t$.
      *   *The Survivorship Bias:* If I know $w$ decays, the fact that we are still playing at $t=1000$ is informative. It implies we are in a "long-tail" realization.
      *   *The Unraveling:* If the decay is common knowledge, simply knowing "I am past my memory window $M$" means I know $t > M$. As I play more rounds without remembering them, my lower bound on $t$ increases. My *expected* $w_t$ decreases.
      *   Eventually, even without a clock, your **inferred** shadow of the future shrinks enough that cooperation collapses.

  ### 3. The Verdict on Your Specific Questions

  > *Is cooperation still an equilibrium there?*

  **Yes, provided the stationary belief about the continuation probability is high enough.** If the memory window is short enough relative to the decay rate, the player's belief about "how old this relationship is" will stabilize into a stationary distribution. If the expected $w$ under that distribution supports cooperation, then a stationary "Always Cooperate" (or Grim Trigger) strategy is an equilibrium.

  > *Is the quantity that matters the objective hazard at that round or the hazard they'd infer from what they can see?*

  **It is the inferred hazard.** Game theory is about optimizing against beliefs. If you are blind to the decay, you optimize against the average. You can be in an equilibrium where you cooperate while the *objective* hazard is already too low, simply because you don't know it.

  > *I keep flip-flopping on whether the "shadow of the future" framing is quietly assuming the players have a clock that the model never gave them.*

  **You are right.** The standard framing assumes the discount factor is a **parameter of the player**, not a **state of the world**.
  *   **Standard Model:** $\delta$ is in my utility function. I know it.
  *   **Your Model:** $\delta_t$ is a property of the environment. I must estimate it.

  The framing breaks when the **estimation of $\delta$** becomes part of the strategic problem. If the environment is non-stationary (decaying $w$) but the player's information is stationary (bounded memory), the player is effectively playing a game with a **misperceived discount factor**.

  ### Summary for the Gut
  1.  **Induction Block:** You can't defect on the last round if you can't identify the last round *before* you move. The "end" is a horizon, not a wall.
  2.  **Clockless Decay:** If you don't have a clock, you can't count down to the end. You act on the *average* future you expect.
  3.  **The Break:** The "Shadow of the Future" isn't a fixed length of rope; it's a foggy estimate. If the fog (memory bounds) hides the fact that the rope is fraying (decaying $w$), you might keep climbing until you fall. Cooperation holds as long as your *estimate* of the rope's strength is high, regardless of its *actual* strength.

  The induction is blocked by **information sets**, not by the ontology of the game tree. You are optimizing over what you know, not what is true.
