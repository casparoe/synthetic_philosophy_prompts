answer: |-
  This is a striking observation, and it cuts to the heart of a tension between deliberative democratic theory (which assumes shared reasons facilitate convergence) and moral psychology (which suggests deep foundations often resist translation). You are describing a phenomenon where the *surface structure* of argument converges while the *deep structure* of judgment diverges, resulting in a specific kind of epistemic distrust.

  There is no single established term that captures this exact configuration. However, your description sits at the intersection of three literatures: Moral Foundations Theory, Deliberative Democracy (Public Reason), and the Sociology of Knowledge (Hegemony/Preference Falsification). Because existing terms capture only slices of the phenomenon, I recommend coining a term to fix the boundaries precisely.

  Below is an analysis of the nearest neighbors, a proposed coinage with a rigorous definition, and an assessment of the epistemic stakes you raised.

  ### 1. The Nearest Neighbors (and Why They Fall Short)

  **A. Moral Foundations Theory (Haidt et al.)**
  *   **The Fit:** Explains the *mismatch* between verdicts (often driven by Binding foundations: Loyalty, Authority, Sanctity) and stated reasons (Individualizing foundations: Harm, Fairness). Haidt calls this "moral dumbfounding" when people can't give reasons, but your data shows they *do* give reasons—just not the *true* ones.
  *   **The Shortfall:** MFT explains the psychological origin of the verdict, but not the *linguistic drift*. It doesn't explain why the vocabulary shifts specifically toward the *opponent's* preferred currency, nor does it account for the reciprocal attribution of bad faith.

  **B. Preference Falsification (Timur Kuran)**
  *   **The Fit:** Explains why people might hide their true motivations (e.g., loyalty) and speak in socially acceptable terms (e.g., harm) to avoid sanction.
  *   **The Shortfall:** Kuran's model assumes a deliberate cost-benefit analysis (conscious hiding). Your data suggests the translation is often unconscious ("respondents... are surprised when shown their own earlier wording"). Furthermore, preference falsification usually predicts a stabilization of public opinion, not the polarization and mutual suspicion you observe.

  **C. Systematically Distorted Communication (Habermas)**
  *   **The Fit:** Habermas describes situations where power structures distort speech so that participants cannot recognize the true basis of their disagreement.
  *   **The Shortfall:** Habermas focuses on structural power preventing speech. Your phenomenon is more subtle: speech is *enabled* and even *homogenized*, but that homogenization becomes the vehicle for distrust. It is a pathology of *successful* communication norms, not their suppression.

  **D. Motivated Reasoning (Kahan et al.)**
  *   **The Fit:** Explains why people reject evidence that threatens their identity.
  *   **The Shortfall:** Usually explains why people *dig in* using their *own* reasons. It doesn't explain why they would adopt the *opponent's* justificatory framework while maintaining their own verdict.

  ### 2. A Proposed Coinage: "Discursive Capture"

  Given the gaps above, I propose labeling this configuration **Discursive Capture**.

  While "capture" is sometimes used in regulatory contexts (regulatory capture), in political theory it effectively conveys the idea of a dominant framework seizing the means of expression without converting the underlying will. To be precise, you should define it as a composite phenomenon with two necessary components: **Unconscious Normative Translation** (the individual mechanism) and **Reciprocal Hermeneutical Distrust** (the social outcome).

  #### Definition and Boundaries
  **Discursive Capture** occurs when a dominant moral vocabulary exerts sufficient normative pressure that actors unconsciously translate their intuitive verdicts into that vocabulary, despite the vocabulary being ill-suited to their actual moral foundations, resulting in a convergence of justification language that masks a divergence of psychological drivers and triggers mutual accusations of insincerity.

  **Necessary Conditions (The Carving):**
  1.  **Vocabulary Convergence:** The set of permissible/used justifications narrows to a dominant subset (e.g., Harm/Fairness) across opposing groups.
  2.  **Verdict Divergence:** Policy preferences or moral judgments do not converge; they may polarize.
  3.  **Unconscious Translation:** The speaker registers the translated reason as authentic (not lying); the mismatch is revealed only through longitudinal coding or psychometric prediction, not self-report.
  4.  **Reciprocal Distrust:** The convergence of vocabulary leads observers to infer bad faith in opponents ("If you use my reasons and disagree, you must be lying"), rather than recognizing foundational incommensurability.

  **Discriminating from Neighbors:**
  *   **Vs. Strategic Reframing:** In strategic reframing, the speaker knows the translation is instrumental. In Discursive Capture, the speaker *believes* the translation. *Data Test:* Check for surprise or confusion when respondents are confronted with their original, non-transcribed intuitions.
  *   **Vs. Confabulation:** Confabulation is random or self-serving noise. Discursive Capture is *directional*; the vocabulary drifts specifically toward the *opponent's* or the *culture's* dominant terms, not just any plausible terms. *Data Test:* Code the direction of the drift. If conservatives start using "harm" to describe "sanctity" violations specifically in mixed-company settings, that is capture.
  *   **Vs. Genuine Conceptual Change:** In genuine change, the verdict would shift to match the new reason. In Discursive Capture, the verdict remains anchored to the original foundation. *Data Test:* Measure verdict stability over time. If reasons change but verdicts stay fixed, it is capture.

  ### 3. Epistemic Stakes: What This Licenses Us to Conclude

  You asked whether this pattern undercuts the appeal to shared reasons as a neutral court of appeal. The short answer is **yes**, but with nuance.

  **A. The Neutrality of Shared Reasons is Compromised**
  If Discursive Capture is widespread, "shared reasons" are not a neutral terrain where disputes are resolved; they are a *contested resource* that one side has successfully hegemonized. The fact that both sides speak the language of "harm" does not mean they agree on what harm *is*, nor that "harm" is the actual driver of the judgment.
  *   **Conclusion:** You cannot treat the convergence of vocabulary as evidence that the dispute is being conducted on common ground. It is evidence that the *expression* of the dispute has been standardized, not the *substance*.

  **B. Bad Faith Attributions are Rational (but Misdiagnosed)**
  The mutual accusation of bad faith is a rational response to the data available to the participants. If Person A says "X causes harm" and opposes X, and Person B says "X causes harm" and supports X, Person A is logically entitled to suspect Person B is lying.
  *   **Conclusion:** The bad faith attribution is a *symptom* of Discursive Capture, not merely a barrier to deliberation. It is the correct intuition that the reasons do not match the verdicts, coupled with the incorrect diagnosis that this is due to deceit rather than unconscious translation.

  **C. Merits Cannot Be Judged on the "Shared" Ground Alone**
  Your worry is that looking at who wins on "neutral terms" might be misleading. Discursive Capture confirms this worry. If one side's moral foundations (e.g., Sanctity/Order) require translation into the dominant language (Harm/Fairness) to be heard, that translation inevitably loses fidelity.
  *   **Conclusion:** A side that "wins" on the shared vocabulary may simply be the side whose native moral foundations align with that vocabulary (e.g., Liberal Individualism). The "victory" may reflect the bias of the court (the vocabulary), not the merits of the case.
  *   **However:** This does not mean *no* side is right. It means the *method* of adjudicating via shared reasons is currently malfunctioning. To find who is right, you must evaluate the verdicts against the *actual* consequences and values at stake, not just the coherence of the translated arguments.

  ### 4. Recommendation for the Dissertation

  I recommend using **Discursive Capture** as your umbrella term. It allows you to:
  1.  **Name the Problem:** It gives you a handle for the "configuration you have no name for."
  2.  **Distinguish Mechanism from Outcome:** You can talk about the *mechanism* (Unconscious Normative Translation) and the *outcome* (Reciprocal Hermeneutical Distrust) as parts of the Capture dynamic.
  3.  **Make a Normative Claim:** You can argue that Discursive Capture is a pathology of Public Reason that needs to be cured not by demanding *more* shared reasons, but by allowing a *plurality* of moral vocabularies (a la Moral Foundations Theory) to reduce the pressure to translate, thereby reducing the suspicion of bad faith.

  This framing turns your empirical finding into a theoretical intervention: The demand for shared reasons, when foundations are incommensurable, generates Discursive Capture, which in turn generates polarization. The cure is not better translation, but the legitimacy of non-translated moral speech.
