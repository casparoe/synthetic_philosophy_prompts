answer: |-
  Here is a specification of the desiderata for an adequate account of cognitive penetration (CP), structured to resolve the stalemate you are experiencing in seminar.

  ### I. Core Desiderata for an Account of Cognitive Penetration

  An adequate theory must provide a decision procedure for any putative case $C$ involving a cognitive state $K$ (belief, desire, hypothesis) and a perceptual experience $E$.

  **1. The Locus Constraint**
  The theory must identify the specific stage of processing at which $K$ influences the system. It must distinguish:
  *   **Sensory/Perceptual Processing:** The computation of properties from proximal input.
  *   **Post-Perceptual Judgment:** The classification or doxastic uptake of the experience.
  *   **Overt Action:** Eye movements, head turns, or manipulation of the environment.
  *   **Requirement:** To count as CP, $K$ must alter $E$ via **Sensory/Perceptual Processing**. If the influence is solely via Overt Action (looking elsewhere) or Post-Perceptual Judgment (interpreting a neutral image as threatening), it is not CP.
  *   **Tag:** [Non-Negotiable]

  **2. The Attention Exclusion**
  The theory must distinguish between cognition directing *which* information is processed (attention) and cognition altering *how* that information is processed (penetration).
  *   **Requirement:** If $K$ merely weights specific features for priority access (e.g., looking for a red shape), resulting in faster detection or higher resolution of those features, this is attention. CP requires that $K$ alters the *construction* of the perceptual content itself (e.g., the specific shade of red experienced), independent of feature selection.
  *   **Tag:** [Non-Negotiable]

  **3. The Phenomenal-Content Dissociation**
  The theory must specify whether CP targets Phenomenal Character (what it is like), Representational Content (what properties the scene is represented as having), or both.
  *   **Requirement:** The theory cannot assume these travel together. It must allow for the possibility of **Content-Only Penetration** (representing a neutral face as angry without a change in "feel") or **Phenomenal-Only Penetration** (a change in "feel" without a change in represented properties). A theory that conflates them will be refuted by dissociation cases.
  *   **Tag:** [Non-Negotiable]

  **4. The Epistemic Constraint**
  The theory must explain the relationship between the penetrating state $K$ and the justificatory power of $E$.
  *   **Requirement:** The theory must state whether a penetrated experience $E$ can provide independent justification for $K$. (e.g., If my fear makes the snake look dangerous, can that look justify my belief that it is dangerous?)
  *   **Tag:** [Camp Preference] (See Section III)

  **5. The Counterfactual Stability Test**
  The theory must handle the "Same Stimulus" intuition without relying on it as a sole definition.
  *   **Requirement:** The theory must assert that if $K$ were removed while holding the proximal stimulus and attentional focus constant, $E$ would differ. However, it must acknowledge this is necessary but not sufficient (due to the Attention Exclusion).
  *   **Tag:** [Non-Negotiable]

  ---

  ### II. Head-On Conflicts

  You identified two specific tensions that stall discussion. Here is how the desiderata resolve them.

  **Conflict 1: "Same Proximal Stimulus" vs. "Best Causal Explanation"**
  *   **The Tension:** The "Same Stimulus" test (Pylyshyn/Macpherson) demands $E$ changes while input stays fixed. The "Causal Explanation" test (Churchland/Vance) asks if $K$ is a necessary difference-maker in the causal story. These come apart when cognition changes *which* features are resolved (attention) without changing the stimulus. Attention changes the causal story and the experience, but intuitively isn't penetration.
  *   **Resolution:** A theory must be built around the **Mechanism of Influence**, not merely the causal dependency or stimulus invariance.
      *   **What to give up:** You must give up the idea that "Top-Down Causal Influence" is sufficient for CP.
      *   **The Specification:** The theory must specify that CP occurs only when cognition alters the *algorithmic mapping* from input to representation, not when it alters the *input selection* (attention) or the *output threshold* (judgment).
      *   **Why:** In the Radiologist case, if the expert sees the tumor because her cognition directs her fovea to the specific pixel cluster (Attention/Action), it is not CP. If her cognition alters the contrast sensitivity of the visual cortex such that the pixels *look* darker to her than to the novice (Processing), it is CP. The "Same Stimulus" test fails here because the retinal input might be identical, but the processing differs. The theory must privilege the processing difference.

  **Conflict 2: Processing vs. Content vs. Phenomenology vs. Uptake**
  *   **The Tension:** Many accounts treat these as a bundle. If you penetrate processing, you necessarily penetrate content and phenomenology.
  *   **Resolution:** These are **Dissociable Relations**. A robust theory must treat them as separate variables.
      *   **Processing:** The neural/functional computation.
      *   **Content:** The accuracy conditions (e.g., "There is a gun").
      *   **Phenomenology:** The qualitative character (e.g., the menacing look).
      *   **Uptake:** The belief formation ("I believe it is a gun").
      *   **Why:** Consider the **Gun/Phone case**.
          *   *Scenario A:* Cognition alters Uptake only (I see a black object, I judge it a gun due to bias). -> **Not CP.**
          *   *Scenario B:* Cognition alters Content only (I represent it as a gun, but it doesn't *look* menacing). -> **Possible CP (Content-Only).**
          *   *Scenario C:* Cognition alters Phenomenology only (It *looks* menacing, but I represent it only as a black object). -> **Possible CP (Phenomenal-Only).**
      *   **Requirement:** A theory that defines CP as "belief changing experience" collapses these. It must specify which layer is penetrated. Most epistemic worries rely on **Content Penetration**; most phenomenological arguments rely on **Phenomenal Penetration**.

  ---

  ### III. Tagging, Incompatibilities, and Exclusion

  **1. Non-Negotiable vs. Camp Preference**
  *   **Non-Negotiable:** The **Attention Exclusion** (Desideratum 2). Without this, CP collapses into "perception exists." Attention is cognitive and influences experience; if that counts as penetration, the concept loses its critical bite regarding modularity and epistemology.
  *   **Camp Preference:** The **Epistemic Constraint** (Desideratum 4).
      *   *Camp A (Siegel):* CP creates epistemic circularity (downgrade). If belief penetrates perception, perception cannot justify that belief.
      *   *Camp B (Vance/Brössel):* CP does not necessarily downgrade. If the cognitive state is reliable (e.g., expert radiologist), the penetrated experience can still justify.
      *   *Reasoning:* You can have a coherent metaphysics of CP (it happens) while disagreeing on the epistemology (it matters). Therefore, an account of *what CP is* should not dictate *how it justifies*.

  **2. Incompatible Pair**
  *   **The Conflict:** **The Attention Exclusion** vs. **Predictive Processing (PP) as a Non-Penetrative Model.**
  *   **Why:** In standard Predictive Processing (Friston/Clark), perception *is* the propagation of top-down predictions (cognition) constrained by bottom-up error. There is no clean algorithmic distinction between "processing input" and "applying cognitive prediction."
  *   **Result:** If you adopt a strict Predictive Processing framework, you cannot satisfy the **Attention Exclusion** in the traditional sense, because *all* perception is "penetrated" by priors. To maintain the notion of CP within PP, you must redefine CP as "aberrant weighting of priors" rather than "top-down influence." You cannot have both a traditional modular distinction (Attention vs. Penetration) and a radical PP ontology without redefining terms.

  **3. The Single Exclusionary Requirement**
  *   **Requirement:** **The Attention Exclusion (Desideratum 2).**
  *   **Why it bites:** This excludes the most accounts because it is the easiest place to hide.
  *   **The Biting Case:** **The Radiologist.**
      *   *The Setup:* An expert radiologist sees a malignancy instantly; a novice sees noise.
      *   *The Failure:* Most accounts claim this is CP because the expert's knowledge changes their experience.
      *   *The Exclusion:* If the expert's knowledge simply tunes their attention to high-frequency spatial gradients that the novice ignores, this is **Attention**, not Penetration. To prove CP, one must show the expert's visual cortex computes the *same* attended data differently (e.g., the pixels literally look darker or more structured), not just that they look at the right pixels. Most "expert perception" cases fail this test and are reclassified as skilled attention, excluding them from the CP category.

  ---

  ### IV. Brief Theoretical Context

  *   **Encapsulation (Pylyshyn/Fodor):** Satisfies the **Attention Exclusion** easily by positing a firewalled early vision module. It fails the **Causal Explanation** test in real-world biology, as neuroanatomy shows massive feedback connections. It gets the **Müller-Lyer** right (knowledge doesn't fix the illusion), but struggles to explain the **Radiologist** without calling it "post-perceptual."
  *   **Predictive Processing (Clark/Friston):** Dissolves the **Processing vs. Content** distinction. It treats the **Same Stimulus** test as obsolete because there is no "stimulus" independent of the "prediction." It risks collapsing CP into "perception itself," violating the **Attention Exclusion** unless "penetration" is reserved for *maladaptive* priors.

  ### Summary for Seminar Use
  To move the discussion forward, demand that any proposed case of CP answer the **Attention Exclusion**: *Is the cognitive state selecting the data, or is it altering the computation of the selected data?* If they cannot specify the algorithmic difference, the case is indeterminate.
