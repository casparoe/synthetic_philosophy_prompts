      *   *Exclusionary Requirement:* The "Attention Exclusion." This kills most loose definitions. If you can't distinguish top-down attentional weighting from genuine alteration of perceptual content, you don't have a theory of CP. Case: The radiologist. Is she attending differently or seeing differently?

