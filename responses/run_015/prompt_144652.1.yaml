  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   *What is Cognitive Penetration?* Roughly: Cognitive states (beliefs, desires, expectations) directly influencing perceptual experience in a way that makes the experience depend on the cognition, not just the stimulus.
      *   *The "Stalling" Point:* The Post-Cognitive Influence Objection. "That's just attention," "That's just judgment," "That's just eye movements."
      *   *The Epistemic Worry:* If perception is penetrated by belief, can it justify belief? (Circularity).
      *   *The "Same Stimulus" Test:* Macpherson/Zenon Pylyshyn style. Hold stimulus constant, change cognition, see if experience changes.
      *   *The "Causal Story" Test:* If cognition is a necessary link in the causal chain leading to experience, is it penetration? (Problem: Attention is cognitive and causal).
      *   *Distinctions:* Early vs. Late processing. Content vs. Phenomenology.
