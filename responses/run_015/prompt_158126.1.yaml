          *   Model vs. Human: Models are structural uncertainty; Humans are epistemic/parameter uncertainty. In practice, for a 30-min procedure, treat them as "credible intervals from independent sources." The envelope should cover the range of *credible* expert/model outputs, not outliers.
      *   *Decision Rule:*
          *   *Maximin (Best of the Worst):* Too conservative for a public agency (cry wolf too often).
          *   *Interval Dominance:* Good for choosing between options, but we have fixed thresholds.
          *   *E-admissibility:* Complex to explain.
          *   *Threshold Crossing Rule (adapted for IP):* If the *lower bound* exceeds threshold -> Act. If *upper bound* is below -> Don't Act. If straddles -> "Zone of Uncertainty."
