answer: |-
  This is a classic case where formal epistemology (imprecise probabilities) is the right theoretical fit, but the implementation fails because it tries to solve a political/accountability problem with math alone. You need a **Standard Operating Procedure (SOP)** that encodes the uncertainty without paralyzing the decision-maker.

  Here is a procedure designed for your constraints: 30-minute execution, one-page output, Duty Officer (DO) accountability, and Board compliance.

  ### Part 1: The Procedure (SOP v1.0)

  **Goal:** Convert 4 models + 2 expert estimates into a defensible Risk Interval and a Recommendation.
  **Time:** 30 Minutes.
  **Owner:** Duty Hydrologist.

  #### Step 1: Construct the "Credible Envelope" (10 mins)
  Do not average. Do not seek consensus. You are capturing the spread of *credible* opinion.
  1.  **Gather Inputs:** Collect the 90% confidence interval (or equivalent high-water estimate) from each of the 4 models. Collect the point-estimate or range from the 2 senior hydrologists.
  2.  **Human Treatment:** If a hydrologist gives a point (e.g., "22%"), treat it as a tight interval (e.g., 21–23%) to acknowledge their certainty, unless they specify a range.
  3.  **Calculate Bounds:**
      *   **Lower Bound (LB):** The minimum value from *all* sources (models + humans).
      *   **Upper Bound (UB):** The maximum value from *all* sources.
      *   **Result:** Your Risk Interval is $[LB, UB]$.
  4.  **Empty Intersection:** If the models/humans disagree so much that there is no overlap (e.g., Model A says 5%, Model B says 40%), **do not narrow the interval.** The width *is* the message. A wide interval signals high structural uncertainty.

  *Why Union not Intersection?* Intersection assumes all sources must be right simultaneously. Union assumes *any* source could be right. In flood risk, failing to cover a credible worst-case is indefensible in a hearing.

  #### Step 2: Apply the "Straddle Protocol" Decision Rule (5 mins)
  You asked for one rule. For a public agency facing post-hoc hearings, **Interval Dominance relative to Threshold** is the only defensible choice.

  *   **Green (Act):** If **Lower Bound > Threshold**. (Even the most optimistic model says we're in trouble).
  *   **Red (Wait):** If **Upper Bound < Threshold**. (Even the most pessimistic model says we're safe).
  *   **Amber (Straddle):** If **Threshold is inside the Interval**.

  **The Rule:**
  1.  If **Green**: Recommendation is "ACT."
  2.  If **Red**: Recommendation is "WAIT."
  3.  If **Amber**: Recommendation is "POLICY DECISION REQUIRED."
      *   The Hydrologist writes: *"Risk straddles the [X]% threshold. Science cannot distinguish between safety and hazard."*
      *   The Duty Officer must check a box: *"I accept the risk of False Alarm"* OR *"I accept the risk of Missed Event."*

  *Why this rule?* It separates *epistemic status* (what we know) from *value judgment* (how much risk we tolerate). If you act on an Amber light and nothing happens, the DO signed off knowing the science was uncertain. If you wait and water rises, the DO signed off accepting that risk. This protects your team from being blamed for "wrong numbers."

  #### Step 3: Calculate the Board "Swing" (10 mins)
  The Board's "Swing" is **Sensitivity**, not Uncertainty.
  *   **Uncertainty (The Interval):** "Given what we know now, the risk is between X and Y."
  *   **Swing:** "If we knew the answer to Contested Assumption Z, the *center* of our estimate would move by W%."

  **Procedure:**
  1.  Identify the single most contested assumption (e.g., "Soil Saturation Level").
  2.  Run the ensemble with Assumption Z set to "Dry" and "Wet."
  3.  Calculate the shift in the **Midpoint** of the Credible Envelope.
  4.  **Report:** "Swing: ±[W]%."

  *Does this wreck the IP approach?* No, provided it is labeled "Sensitivity to Assumption Z," not "Margin of Error." It tells the Board where to invest research money, not how to interpret today's risk.

  #### Step 4: Draft the One-Pager (5 mins)
  (See Template below).

  ---

  ### Part 2: The One-Page Template

  **TO:** Duty Officer / Emergency Management
  **FROM:** Flood Risk Team
  **SUBJECT:** Seasonal Risk Estimate – [Reach Name]
  **DATE:** [Date]

  **1. RISK ESTIMATE (Probability of Exceeding Levee Crest)**
  *   **Credible Range:** **[ LB % ] to [ UB % ]**
  *   **Decision Threshold:** [ 15% / 30% ]
  *   **Status:** [ GREEN / RED / AMBER ]

  **2. DECISION CONTEXT**
  *   [ ] **Scientific Consensus:** All models/experts agree action is warranted/safe.
  *   [ ] **Scientific Conflict:** Models/experts disagree; range spans the threshold.
  *   [ ] **Model Stress:** New data increased uncertainty (see Note 4).

  **3. RECOMMENDATION**
  *   **Technical Advice:** [ ACT / WAIT / NO TECHNICAL ADVICE ]
  *   **If Amber:** Duty Officer must select:
      *   [ ] **Precautionary:** Act despite uncertainty (Risk: Wasted Resources).
      *   [ ] **Economic:** Wait despite uncertainty (Risk: Flood Damage).

  **4. SENSITIVITY (Board Directive)**
  *   **Key Assumption:** [e.g., Upstream Soil Saturation]
  *   **Swing:** If resolved, estimate shifts by **± [ X ]%**.

  **5. DUTY OFFICER SIGN-OFF**
  *   Signature: ___________________ Date: _______
  *   *I acknowledge the uncertainty range and accept the risk profile selected above.*

  ---

  ### Part 3: Addressing Your Specific Questions

  #### 1. Model vs. Human Disagreement
  *Does it matter?* Yes, but not in the calculation.
  *   **Models** represent *structural* uncertainty (physics, equations).
  *   **Humans** represent *epistemic* uncertainty (interpretation, local knowledge).
  *   **Aggregation:** Treat them equally in the Union. If humans disagree more than models, your interval widens. This is correct. It signals that the physics are stable, but our interpretation of the boundary conditions is not. Do not try to weight them. In a hearing, "The senior hydrologist warned of this" is as weighty as "Model 3 predicted this."

  #### 2. The Decision Rule Commitment
  I committed you to **Interval Dominance relative to Threshold** (The Straddle Protocol).
  *   **Why?** Maximin (prepare for worst case) is too expensive for a public agency (you'll bankrupt the budget on false alarms). Maximax (hope for best case) is negligent.
  *   **Hearing Defense:**
      *   *If you acted and it didn't flood:* "The Lower Bound exceeded the threshold. The minimum credible risk was unacceptable."
      *   *If you waited and it flooded:* "The Upper Bound was below the threshold. The maximum credible risk was acceptable."
      *   *If you Straddled:* "The science was inconclusive. The Duty Officer made a policy choice based on risk tolerance, fully informed."

  #### 3. When the Interval Straddles
  *Do we act?* The procedure says the *science* cannot recommend action.
  *   **Buy Information?** Only if the "Swing" is large and time permits. If the Swing is small, more data won't resolve the conflict (the models are structurally different, not just data-poor).
  *   **The "Don't Know" Memo:** Use the Amber status. The text *"Science cannot distinguish between safety and hazard"* is powerful. It forces the Board/DO to own the risk. It is not "we don't know," it is "the system is currently unpredictable."

  #### 4. The "Swing" Figure
  It is a **different object**.
  *   **Interval:** Current state of knowledge (Aleatory + Epistemic).
  *   **Swing:** Value of Information (Structural Sensitivity).
  *   **Placement:** Keep it in Box 4. Do not add/subtract it from the Interval. If you add it to the interval, you conflate "what we don't know" with "what we could know."

  ---

  ### Part 4: Case Studies

  #### Case 1: The "Dilation" (Uncertainty Increases with Data)
  *Scenario:* You get new soil moisture data. Previously, models agreed on ~20%. Now, Model A says 10% (soil is dry), Model B says 40% (soil is saturated). The interval widens from [18-22%] to [10-40%].
  *   **The Problem:** Director hates saying "We are less certain after spending money."
  *   **The Fix:** Label it **"Model Stress Revealed."**
  *   **One-Pager Text:** "New monitoring data exposed structural disagreement between models regarding soil saturation. Prior estimates appeared precise due to shared assumptions, not verified accuracy. Current range reflects true conflict."
  *   **Why it works:** It frames the widening not as confusion, but as *calibration*. You are admitting the previous narrow interval was false confidence. In a hearing, "We hid the conflict" is fatal. "We found the conflict" is defensible.

  #### Case 2: Milburn Bend (The Bias Test)
  *Scenario:* You want to buy easements (Threshold 30%).
  *   **Inputs:** Models: [15%, 25%]. Hydrologists: [20%, 28%].
  *   **Credible Envelope:** [15%, 28%].
  *   **Threshold:** 30%.
  *   **Status:** **RED (Wait).** The Upper Bound (28%) is below the Threshold (30%).
  *   **Outcome:** The procedure **kills your initiative.**
  *   **Why this is good:** Even the pessimistic view doesn't hit the Board's threshold. If you push for it now, you are making a *policy* argument (e.g., "30% is too high a threshold"), not a *risk* argument.
  *   **Action:** If you truly believe it's right, you must write a separate memo to the Board arguing to *lower the threshold*, not to manipulate the risk estimate. The SOP protects you from biasing the number.

  #### Case 3: The "Amber" Straddle
  *Scenario:* Pump Pre-positioning (Threshold 15%).
  *   **Inputs:** Models range [10%, 25%].
  *   **Status:** **AMBER.**
  *   **Decision:** Duty Officer selects "Precautionary."
  *   **Memo:** "Risk straddles 15% trigger. Technical recommendation is neutral. DO elects Precautionary Principle."
  *   **Post-Event:**
      *   *If Flood:* "DO correctly prioritized safety over cost."
      *   *If No Flood:* "DO correctly prioritized safety; cost of pumps is budgeted risk."

  ---

  ### Part 5: The Honesty Check (Judgment in a Lab Coat)

  You asked me to be straight about where the judgment hides. Here it is:

  1.  **Selecting the "Credible" Sources:** In Step 1, you decide which models/experts go into the envelope. If you exclude an outlier model because it's "known to be buggy," that is a judgment call. *Mitigation:* Keep a log of excluded models and the reason. If the excluded model comes true, you need that log to prove it wasn't arbitrary.
  2.  **Defining the "Key Assumption" for Swing:** You choose which assumption gets the Swing metric. You might pick one with a small swing to make the estimate look stable. *Mitigation:* Rotate the assumption quarterly or let the Board nominate it.
  3.  **The "Amber" Decision:** When the DO checks "Precautionary," they are making a value judgment. The SOP makes this explicit, but the DO will look to you for guidance. *Mitigation:* Train the DOs. Tell them: "If the interval crosses the line, I cannot tell you what to do. I can only tell you the cost of being wrong either way."

  ### What Imprecise Probabilities Can't Do
  *   **It won't make the decision for you.** It only clarifies when the decision is scientific vs. political.
  *   **It won't stop the Board from asking for a single number.** They will look at "[15%, 25%]" and ask "So is it 20%?" You must hold the line: "20% is a fiction. 15 to 25 is the reality."
  *   **It won't fix bad models.** If all 4 models are wrong in the same way (groupthink), the Interval will be narrow and wrong. The "Swing" metric is your only defense here—it highlights if a single assumption could break the consensus.

  ### Final Advice for the Director
  When you present this, do not sell it as "Improbable Probabilities." Sell it as **"Risk Transparency."**
  *   **Old Way:** "We are 22% sure." (Lie)
  *   **New Way:** "We are confident the risk is between 15% and 25%." (Truth)

  The Board hates "We don't know." Reframe it: **"We know precisely how uncertain we are."** That is a defensible position for an engineering agency.
