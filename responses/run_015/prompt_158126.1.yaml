          *   *Refined Selection:* **Gamma-Maximin / Hurwicz** is too subjective. Let's stick to **Interval Dominance relative to the Threshold**.
          *   *Actually, the best fit for Public Accountability:* **The "Defensible Action" Rule.**
              *   Act if Lower Bound > Threshold.
              *   Don't Act if Upper Bound < Threshold.
              *   If Straddle: The decision is *value-laden*. The DO must decide based on risk tolerance. The method *cannot* decide this. This satisfies the constraint "values call has to be flagged as theirs."
      *   *The "Swing" Figure:* This is sensitivity analysis. It is *not* the interval. The interval represents current uncertainty (aleatory + epistemic). The swing represents *structural fragility* of the estimate. They are distinct.
      *   *Dilation:* This happens when new data contradicts the prior model structure, widening the credible set. It must be explained as "Model Stress," not "Confusion."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Aggregation.* Don't average. Use the **Credible Envelope**. Take the min of the lower bounds and max of the upper bounds of the 4 models + 2 experts. *Correction:* If experts give point estimates, treat them as tight intervals. If models give distributions, take the 10th/90th percentiles of the ensemble, then expand to cover expert disagreement. Let's simplify: **Union of 90% Confidence Intervals** from all sources. If intersection empty, Union is mandatory.
