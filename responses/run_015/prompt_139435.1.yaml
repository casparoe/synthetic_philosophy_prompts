      *   *Chronic Arm:* Neuropathic pain often lacks useful warning function. The risk of unnoticed injury is lower (as the user noted, the congenital analgesia analogy misfires here). The potential benefit (relief from suffering without losing sensory info) is high. The autonomy risk exists but is manageable with strict consent protocols.
      *   *Decision:* Approve Chronic Arm with strict conditions. Reject or heavily restrict (effectively reject for now) Acute Arm due to safety/camouflage risks that outweigh the immediate benefit given standard opioids exist.
