  *Reply:* We test causal *concepts*, not physical laws. Like philosophical thought experiments, fiction isolates variables to validate reasoning structures. It provides a controlled environment for causal intuition without empirical noise, functioning as a modal laboratory. The truth of the causal claim depends on the structure, not the existence. (Concedes fiction cannot verify empirical causal claims, only conceptual coherence.)

  **3. Lewisian Counterfactualists:** "Similarity metrics are textually bound. The 'nearest world' respects established narrative laws."
  *Reply:* Texts rarely specify laws for deviations. If a character flies, do gravity laws change? Lewis requires a fact of the matter regarding off-path variables; fiction offers silence. We cannot calculate distance without explicit laws governing the deviation. The text underdetermines the counterfactual. (Concedes counterfactuals work where textual laws are explicit.)

  **4. Interventionists:** "An author isn't an instrument within the causal graph. How is writing an 'intervention' rather than creation?"
  *Reply:* Treat the narrative world as the system and the author as the exogenous manipulator of specific variables holding others constant. It mirrors the logic of *do*-operators externally applied to the model. The author stands outside the model, ensuring the intervention is uncorrelated with other causes. (Weakens Woodward's requirement that interventions be physically possible within the system.)

  **5. Skeptical Metaphysicians:** "This is just analogy. You're metaphorizing 'intervention,' not demonstrating it."
  *Reply:* It's structural isomorphism. The logical operation matches, even if the substrate differs. The mapping preserves causal inference validity across domains, offering a rigorous formal parallel. We are looking for topological equivalence in the causal graph. (Risks reducing the thesis to a mere pedagogical tool.)

  **6. Lewisian Counterfactualists:** "What about impossible fictions? Lewis handles contradictions via impossible worlds."
  *Reply:* Narrative causation relies on internal consistency, not modal logic. Impossible fictions break narrative causation entirely, proving my point about law-dependence. They violate the consistency required for any causal modeling. We exclude them from the dataset as noise. (Sidesteps the formal modal challenge.)
