  I am a novelist presenting next Thursday in a philosophy-of-science workshop to an audience of eight analytic philosophers of causation—three actively working within interventionist frameworks, two committed Lewisian counterfactualists, and three metaphysicians skeptical that fiction supplies legitimate data for causal theory—plus two literary scholars who treat narrative structure as a modal exercise. I am defending the thesis that fictional narrative offers a non-metaphorical testing ground for theories of causation, and specifically that interventionist accounts (in the Woodward tradition) accommodate fictional causation where counterfactual-dependence accounts fail. My core claim is that fiction operates through what I call authorial intervention: the writer fixes every background condition except one plot variable and then derives the narrative consequence, a procedure that mirrors interventionist definitions but cannot be mapped onto Lewisian nearest-world evaluation because fictional worlds lack modal inertia—there is no fact of the matter about which counterfactual world is "nearest" when the author has not specified the background laws governing the deviation.

