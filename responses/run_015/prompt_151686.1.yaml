  3.  **Analyzing Disanalogies (The "Wrecking" Points):**

      *   *Point 1: Million copies vs. One airframe.*
          *   Aviation: One design, many instances, but they are physically isolated. A crash in one doesn't instantly crash all others *unless* it's a design flaw.
          *   AI: One weight file, copied instantly to millions of devices/APIs. A design flaw (vulnerability) is instantly exploitable everywhere.
          *   *Impact:* High. This increases the *systemic risk* per unit of deployment. It makes the "probability per flight hour" metric tricky because the "hours" are parallel, not serial.
      *   *Point 2: Hostile Environment.*
          *   Aviation: Weather is indifferent. ATC is cooperative.
          *   AI: Users are adversarial (jailbreaks, prompt injection).
          *   *Impact:* High. Aviation safety assumes non-malicious physics. AI safety assumes malicious intelligence. This shifts the burden from reliability to robustness/security.
      *   *Point 3: Learning from Crashes.*
          *   Aviation: Crash $\rightarrow$ Ground fleet $\rightarrow$ Fix $\rightarrow$ Fly.
          *   AI: Crash (e.g., autonomous pandemic) $\rightarrow$ Game Over.
          *   *Impact:* Critical. This is the "one-shot" problem. If the first failure is existential, iterative learning is impossible.

      *   *Decoration:* Physical wear and tear (AI doesn't degrade with use), specific mechanical components (engines vs. GPUs).

  4.  **Evaluating the Core Claim ("No Deployment Without Worst-Case"):**

      *   Does the "million copies/hostile" critique kill the aviation analogy?
      *   It kills the *statistical* argument (build up hours over time). You can't build up hours if the first parallel deployment triggers the failure.
      *   Does it kill the *standard* (worst-case guarantees)? Actually, it might *strengthen* the demand for worst-case guarantees. If one bug kills everyone, you need higher assurance, not lower.
      *   However, formal verification (the proposed solution) is mathematically impossible for general-purpose neural nets currently.
      *   *Conclusion:* The critique undermines the *feasibility* of the aviation path, not necessarily the *desirability* of the safety standard. It suggests the aviation standard is unreachable, forcing a choice between "don't deploy" or "change the standard."

  5.  **Evaluating the Drug Analogy:**

      *   *Mechanism:* Clinical trials (phases), known side-effect profiles, post-market surveillance.
      *   *Fit:* Accepts that harm happens (side effects) but bounds it. Focuses on population-level risk vs. individual risk.
      *   *Pros:* Handles the "we don't know everything" aspect better. Allows iteration (new formulations).
      *   *Cons:* Drugs don't replicate themselves. A bad batch is recalled. AI replicates instantly. Drugs don't think/act autonomously in hostile environments.
      *   *Does it support average-case?* Yes. FDA approves based on benefit/risk ratio (average case), not "guaranteed zero harm."
