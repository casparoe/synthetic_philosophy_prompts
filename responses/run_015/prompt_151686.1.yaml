      *   *Key Insight:* The "million copies" point actually makes the aviation standard *harder* to meet, potentially making the "no deployment" conclusion *more* likely, not less. The user thinks it "wrecks" the argument for aviation-style safety, but it might actually wreck the *possibility* of deployment under *any* strict safety regime. I need to clarify this distinction.
      *   *Correction on User's Logic:* The user says these points "wreck it" (the aviation analogy). I need to confirm *what* "it" refers to. Does it wreck the claim that we *should* use aviation standards? Or does it wreck the claim that we *can*? The user implies it wrecks the conclusion (that we should refuse deployment until worst-case guarantees). Actually, if the risk is higher (million copies), the argument for refusal is *stronger*, unless the guarantees are impossible. I need to untangle this.
