      *   Okay, the user thinks the disanalogies undermine the "No deployment without worst-case" conclusion.
      *   *My analysis:* The disanalogies undermine the *aviation analogy*, but they might actually *support* the "No deployment" conclusion (because the risk is higher) OR they support the "Drug analogy" (because aviation is impossible). I need to be careful here. The disanalogies show Aviation is the *wrong map*, not necessarily that the *destination* (safety) is wrong.
      *   *Actually, looking closer:* The user says the counter-points wreck the *aviation argument* for worst-case guarantees. If aviation is a bad analogy, then the demand for formal verification (based on aviation) loses its rhetorical footing.
