answer: |-
  ### The formula

  The principle is **Counterfactual Marginal Value (CMV)**. It is not multiplicative like Importance × Tractability × Neglectedness. It is additive and strictly marginal. The formula is:

  $$CMV = (Impact_{cf} \times Control) + (Knowledge \times Iterability) - Systemic Debt$$

  **$Impact_{cf}$** is strictly (World State with You − World State without You). If a project happens without your money, your impact is zero. **$Control$** is a leverage multiplier discounted by agency drift. Direct spending is 1.0; directing others' money is <1.0 based on their responsiveness; building unsteerable communities is heavily discounted. **$Knowledge$** is the monetary value of information gained. **$Iterability$** is the number of future bets allowed if this one fails. If the window closes forever, this term is zero. **$Systemic Debt$** is the present value of future harms caused by structural lock-in or entrenched bad incentives.

  This formula prioritizes your specific margin over global averages. It demands you measure what *you* change, not what exists. It values learning only if you survive to use it. It penalizes success that corrupts the system. It is precise: if the counterfactual is zero, the value is zero, regardless of how good the cause is. Do not smooth the edges. Use this exactly.

  ### Clause by clause

  **Counterfactual Impact** explains the Deworming versus Loved Charity pair. Deworming passes because the small funder means your money is additive; the project scales with you. The Loved Charity fails because $Impact_{cf}$ is zero; the project hits its target without you. You aren't adding capacity, you're displacing another donor. This kills the "warm glow" of giving to success.

  **Control** explains Toxicology versus Locked Diagnostics. The toxicology bottleneck has high $Control$ because zero others are doing it; your dollar unlocks the pipeline directly. The locked foundation study has zero $Control$ because their capital won't move. This also justifies your suspicion of Field-Building: if you can't steer the new agents, $Control$ is discounted heavily compared to directing existing funds via a Diagnostic study. You prefer steerable leverage over unsteerable potential.

  **Iterability** explains the 0.5% Learn versus One-Shot Artifact. Both have low probability success, but the first has high $Iterability$. You can bet again next year. The artifact has zero iterability; failure is terminal. You value the option to play again over the single big win.

  **Systemic Debt** explains the Patronage Cash Transfers. Immediate impact is high, but $Systemic Debt$ is massive because it entrenches a network that blocks future reform. The net CMV flips negative. You are buying today's relief with tomorrow's freedom.

  ### Three cases you haven't seen

  **1. The Unique Operator.** A role requiring your specific hybrid skills (e.g., coder-lawyer) where no hireable substitute exists. No one else can fill the slot. $Impact_{cf}$ is maximal because replacement is impossible. $Control$ is 1.0. Verdict: **Yes.** The formula values uniqueness over scale. Take the career, even if the cause seems niche compared to global health. Your marginal contribution is infinite relative to a replaceable worker.

  **2. The Persuadable Gatekeeper.** A $10k study influencing a donor who changes priorities annually. High $Knowledge$, high $Control$. Contrast this with a donor locked for a decade. Verdict: **Fund only if the window is open now.** Timing matters more than topic. If the decision-maker is rigid, $Control$ drops to zero, making the study worthless regardless of its quality.

  **3. The Dependency Trap.** A health intervention that saves lives now but requires permanent expensive imports, bankrupting the local system in twenty years. High immediate $Impact_{cf}$, huge $Systemic Debt$. Verdict: **No.** The formula forces intergenerational accounting. You must price the future lock-in against today's hunger. If the debt exceeds the lives saved, the intervention is net negative.

  ### Verdicts you'd have me drop

  Your verdict on Field-Building is the weak link. You prefer steering existing money (Diagnostics) over creating new agents (Field-Building). A clean principle says aligned agents compound value better than one-off redirects. You are discounting future agency due to uncertainty, but that is risk aversion, not value maximization. I would also drop your "No" on the One-Shot Artifact. If the stakes are truly existential, $Impact_{cf}$ should overwhelm $Iterability$. Learning is useless if there is no future. To make the principle clean, you must accept high-risk existential bets even without learning loops. Drop the comfort of iterability. Choose the clean principle: it demands you bet on survival, not just education. It will feel uncomfortable, but it is more honest.
