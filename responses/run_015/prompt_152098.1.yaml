answer: |-
  The standard opposition between Mencius and Xunzi focuses heavily on the ontological status of human nature (*xing*)—whether it is originally good or bad. However, when shifting the focus to the architecture of the fully cultivated agent (the Sage), the distinction becomes less about what human nature *is* and more about how moral motivation is *sustained* once cultivation is complete. To evaluate their resilience in your hypothetical case of isolation, we must examine the functional role of affect and the source of moral momentum in each system.

  For Mencius, moral motivation is endogenous. The "four sprouts" (compassion, shame, courtesy, and right/wrong) are innate predispositions that, when fully nurtured, become stable dispositions of the heart-mind (*xin*). In the post-cultivation state, moral action is not a result of suppressing desire but of aligning desire with the innate moral sense. Affect is not merely a companion to morality; it is the substance of it. The Sage acts virtuously because their emotional responses are naturally attuned to the good; they feel joy in righteousness and distress in wrongdoing. In your isolation case, where social structures are removed, the Mencian Sage remains stable because the source of morality is internal ontology. The sprouts have grown into full trees; they do not require external trellises to stand upright. Isolation removes external distractions (which Mencius acknowledges can obscure the heart), but it does not remove the heart itself. Therefore, moral behavior persists because the agent's very constitution is moral. The affective drive is self-activating and requires no social mirror to validate its existence.

  For Xunzi, moral motivation is exogenous becoming endogenous. Human nature is driven by selfish desires that lead to conflict; morality is introduced through "conscious activity" (*wei*), specifically ritual (*li*) and teachers. Cultivation involves redirecting desire rather than uncovering innate goodness. The Sage is one who has so thoroughly accumulated ritual practice that their desires are transformed to love order and hate chaos. Here, affect is the raw material that is refined. In the post-cultivation state, the Sage acts spontaneously, but this spontaneity is the result of a successful overwrite of natural impulses. In your isolation case, this presents a structural vulnerability. Xunzi's morality is inherently social; ritual is the mechanism for regulating group life. If the social context vanishes, the *object* of ritual practice disappears. While one might argue the Sage internalizes the *principle* of order, Xunzi's system relies on the tension between nature and artifice. Even in the Sage, the underlying nature remains ontologically "bad" (selfish); it is merely managed perfectly. Without the external structures of ritual and community to reinforce the "artificial" order, there is a conceptual risk that the underlying nature, no longer checked by social performance, could reassert itself. The stability relies on the permanence of the transformation, but the logic of the system suggests that morality is a defense against nature, not an expression of it.

  Are these positions genuinely contradictory? On the level of origin, yes: one claims morality is discovered (Mencius), the other that it is constructed (Xunzi). However, on the level of the perfected agent's phenomenology, they converge significantly. Both describe a state where moral action is effortless, joyful, and driven by aligned emotions rather than cold rational calculation. Both agree that the Sage does not need to struggle against desire. The difference lies in the *explanation* of that stability. Mencius attributes it to the realization of true self; Xunzi attributes it to the mastery of self.

  Regarding resilience in isolation, Mencius offers the more robust explanation. Because Mencius locates the source of moral authority within the individual's innate constitution, the removal of society removes obstacles but not the source of power. For Xunzi, because morality is defined by social order and ritual regulation, the removal of society removes the context that gives morality its meaning and support. While a Xunzian Sage might theoretically maintain internal order, the conceptual architecture relies on the "artificial" holding back the "natural." In the absence of the social scaffolding that defines the artificial, the Mencian account of an internally self-sustaining moral nature provides a more resilient explanation for why virtue would persist without external reinforcement.

  Verdict: Mencius
