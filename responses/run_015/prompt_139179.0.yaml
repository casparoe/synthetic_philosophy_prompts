answer: |-
  The configuration you have carved out does not have a single, universally standardized name that captures all its specific constraints (individual truth, collective falsehood, doxastic instability), but it sits directly within the family of **reflexive social mechanisms**. The nearest established concept is the **Self-Defeating Prophecy** (or Self-Falsifying Prediction), but your configuration requires a tighter specification to distinguish it from standard usage.

  Here is the delineation you requested.

  ### 1. The Nearest Concept and the Departure
  The standard term is **Self-Defeating Prophecy**. In social theory (following Robert Merton's typology), a *self-fulfilling* prophecy is a false belief that triggers behavior making the belief true. A *self-defeating* prophecy is a true (or plausible) prediction that triggers behavior making the prediction false.

  **Where your configuration departs:**
  Standard discussions of self-defeating prophecies often focus on *predictions* about the future (e.g., "This candidate will win by a landslide" $\rightarrow$ supporters get complacent $\rightarrow$ candidate loses). Your configuration is distinct in two ways:
  1.  **Causal vs. Predictive:** The claim is not merely about an outcome ("X will win"), but about the *causal efficacy of the agent* ("My action does nothing"). It is a claim about the structure of agency, not just the state of the world.
  2.  **Collective Necessity:** A standard self-defeating prophecy can sometimes be triggered by a single actor (e.g., a trader predicting a crash and shorting the market). Your configuration *requires* widespread adoption to flip the truth value. One voter deciding to vote does not falsify the claim "my vote doesn't matter" if everyone else stays home (in a large election); it requires a *critical mass* of belief-change to alter the causal structure.

  A more precise label for your specific carving is a **Collectively Self-Undermining Causal Claim**.

  ### 2. Differentiation from Neighbors
  You correctly identified three concepts this is not. Here is exactly where the edges lie:

  *   **Vs. Fallacy of Composition:** The fallacy of composition is a static logical error (inferring the whole has a property because the parts do). Your configuration is *dynamic*. The individual claim *is* true in isolation. The error is not in the inference, but in the *stability* of the claim under universalization. The edge is: Composition ignores feedback loops; your configuration is defined by them.
  *   **Vs. Rational Choice (Paradox of Voting):** That framework asks, "Is it *worth* voting?" (Normative/Prudential). Your configuration asks, "Is it *true* that voting matters?" (Ontological/Causal). The edge is: Rational choice accepts the probability is near-zero and argues about costs; your configuration argues the probability is context-dependent and can shift to 1.
  *   **Vs. Self-Fulfilling Prophecy:** As you noted, the direction of truth-value change is inverted. In a self-fulfilling prophecy, belief creates the reality that confirms belief. In your configuration, belief creates the reality that *refutes* belief.

  ### 3. The Instability: Threshold vs. Sorites
  You asked whether the instability is essential or an artifact of vagueness (Sorites).

  **It is essential and relies on Threshold Logic, not Sorites.**
  A Sorites paradox depends on vague boundaries (e.g., "one grain is not a heap"). Your configuration depends on *discrete pivotality*. In a majority-rule election, the causal power of a vote is not a sliding scale; it is a step function.
  *   If the margin is >1, your vote's causal power is 0.
  *   If the margin is 1, your vote's causal power is 1 (decisive).

  The instability arises because the "Universal Irrelevance" state (everyone abstains) forces the system into the margin=1 condition. If everyone stays home, the next single vote decides the election. Therefore, the claim "my vote cannot be decisive" becomes necessarily false in the limit of total abstention. This is not vagueness; it is a topological feature of binary decision rules.

  ### 4. The Equilibrium Story
  There is a clear equilibrium story available, and it matters that no single person's acceptance moves anything.

  *   **State A (High Participation):** The claim "my vote doesn't matter" is *true* (probability is negligible). Belief in this claim is stable because acting on it (abstaining) does not immediately change the outcome.
  *   **State B (Low Participation):** As belief spreads and participation drops, the margin narrows.
  *   **State C (Collapse):** If participation drops below a critical threshold, the probability of pivotality spikes. The claim becomes *false*.

  **Is it a stable equilibrium?**
  The state where *everyone* believes "I don't matter" and *no one* votes is **not a Nash Equilibrium**. In that state, any single individual who deviates (votes) becomes 100% decisive. Therefore, rational agents (who prefer their side winning) would have an overwhelming incentive to vote.
  *   *Conclusion:* The configuration describes a system that cannot rest at the point where the claim is universally believed. The claim "eats its own tail." It can only persist as a stable norm if *some* people disbelieve it, or if the cost of voting is high enough to outweigh the sudden spike in pivotality.

  ### 5. Analogous Structures (Consumption, Emissions, Boycotts)
  Does this structure appear elsewhere? It depends on the causal architecture of the domain.

  *   **Boycotts (Yes):** This is a structural match. "My boycott won't hurt the company." True individually. False if universal. If everyone boycotts, the company collapses, and your specific boycott was part of the decisive coalition. The causal mechanism is threshold-based (revenue drops below solvency).
  *   **Carbon Emissions (No):** This is a **boundary case** where the structure breaks. "My emission doesn't change the climate." If everyone accepts this and emits freely, climate catastrophe occurs. *However*, does your individual emission become *decisive*? No. Climate damage is generally modeled as aggregative and continuous, not binary. Even in a catastrophe, removing one ton of CO2 does not "flip" the outcome from catastrophe to safety. The claim "my emission makes no measurable difference" remains true even if universally adopted, because there is no single threshold where one unit tips the system.
      *   *The Edge:* The configuration only holds in **Threshold Public Goods** (elections, strikes, boycotts), not **Aggregative Public Bads** (pollution, recycling).

  ### 6. Coining the Term
  Since "Self-Defeating Prophecy" is too broad and often implies prediction rather than causal description, I propose the term:

  **Doxastically Unstable Causal Claim**

  **Definition:**
  A proposition $P$ regarding the causal efficacy of an individual action type $A$, such that:
  1.  $P$ is true for an agent $x$ given the current distribution of actions in the population.
  2.  $P$ is false for the population collectively (the set of actions $\{A\}$ has efficacy).
  3.  If the belief in $P$ becomes universal (or sufficiently widespread), the distribution of actions shifts such that $P$ becomes false for agent $x$.

  **Boundary Cases:**

  *   **Positive Case (Fits the definition):** **Strike Participation.**
      *   *Claim:* "My staying home from work won't force management to negotiate."
      *   *Current State:* True (if only one person stays home).
      *   *Universal Belief:* If everyone believes this and stays home, production halts, management negotiates.
      *   *Result:* The individual's absence *was* necessary for the halt. The claim is falsified.

  *   **Negative Case (Fails the definition):** **Charitable Donation.**
      *   *Claim:* "My $50 donation won't solve world hunger."
      *   *Current State:* True.
      *   *Universal Belief:* If everyone believes this and donates $50, world hunger is solved.
      *   *Result:* Did *your* $50 become decisive? No. It remained a drop in the bucket. The claim "my $50 did not solve world hunger" remains *true* even in the universal success scenario, because the solution was aggregative, not pivotal. The claim is not falsified for the individual, only for the group.

  ### Summary of the Carving
  The configuration is a **Doxastically Unstable Causal Claim** operating within a **Threshold Causal Structure**. It is distinguished from the Fallacy of Composition by its dynamic feedback loop, from Self-Fulfilling Prophecies by its truth-value inversion, and from Aggregative problems (like emissions) by its reliance on discrete pivotality rather than continuous accumulation. The instability is not an artifact; it is the defining feature that prevents the "Universal Irrelevance" state from being a stable equilibrium.
