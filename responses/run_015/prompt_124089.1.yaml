answer: |-
  The air in the Conservatory always tasted of old resin and held breath. Elara sat at the central desk, the tungsten lamp casting a hard, white circle onto the ledger book. Inside the circle lay the instrument. It was a tubular thing, polished silver, keyed like a flute but hollowed out like a bone. Yesterday, when the room was empty, it had wept. It was a *Grief-Brass*, Category 4: Sub-Zero Melancholy. She had written the label in her neatest script: *低温 (Low Temperature) – Mourning.*

  Now, under the lamp, the silver looked less like metal and more like scaled skin.

  Elara dipped her pen. The ink was black, viscous, cold. She touched the nib to the cardstock. Before the ink could dry, a floorboard groaned in the gallery above. A visitor. She didn't look up; looking up acknowledged the variable, and the variable was contagious. But the taxonomy had already caught the infection.

  The instrument hummed. It wasn't a weep anymore. It was a thrum. The vibration traveled up the desk legs, into her elbows, settling in her teeth. The *Grief-Brass* was evaporating. In its place sat something urgent, something wooden despite the silver casing. The emotional temperature was rising. Sub-Zero was becoming Tepid, then Boiling.

  Elara pressed the pen down. *Mourning,* she wrote. But the word looked wrong. The loops of the 'M' seemed to tighten, strangling the word. The ink bled into the fibers, spreading like a bruise. She stared at it. *Mourning* implied a past tense, a loss already incurred. The sound coming from the tube was future-tense. It was a demand.

  She crossed out *Mourning.* She wrote *Anticipation.*

  The air in the room shifted. It grew heavier, denser, as if the oxygen molecules were clustering around the instrument. The light from the lamp dimmed, not because the bulb was failing, but because the shadows were leaning in to listen. Elara blinked. Her eyes felt dry, scratchy, like sandpaper rubbing against glass.

  *Anticipation* was too soft. The instrument wasn't waiting; it was hunting.

  She scratched the word out, tearing the paper. *Hunger,* she wrote.

  But *Hunger* was a biological word, and this was a conservatory of sound. The categories were supposed to be thermal. *Cold, Warm, Hot, Volatile.* She was breaking protocol. The protocol existed to keep the walls from breathing. If she mislabeled the temperature, the shelves might rearrange themselves. She glanced at the rows of cases behind her. The violins in the *Fever-String* section were vibrating sympathetically, their wood creaking against the glass. They agreed with her. It was hot.

  A door clicked shut somewhere in the west wing. Another listener. The taxonomy lurched.

  The silver tube elongated. Visually, it remained the same size, but perceptually it stretched toward her, a snake ready to strike. The sound shifted again. The hunt was over. The catch was made. The temperature plummeted. The heat vanished so quickly her breath plumed in front of her face. The ink on the page seemed to freeze, cracking along the grain of the paper.

  *Hunger* was no longer true. It was *Satiety.* It was *Digestion.*

  Elara's hand trembled. The pen felt enormous in her grip, a heavy iron rod rather than a writing tool. Her fingers were numb. She tried to write *Satiety,* but her hand formed the letters for *Silence.*

  *Silence* was not a temperature. *Silence* was the absence of sound. But here, in the slippage, *Silence* was the hottest thing of all. It burned. She could feel the heat of the quiet radiating off the page, singeing her fingertips. She dropped the pen. It clattered on the desk, but the sound was absorbed instantly by the heavy, digesting quiet of the instrument.

  She needed to classify this. If she didn't pin it down, the room would unspool. The distinction between the curator and the curated would dissolve. She was already feeling it—the way her own pulse seemed to synchronize with the residual vibration of the silver tube. Her heartbeat was no longer hers; it was a rhythmic error in the catalog.

  She picked up the pen again. The ink was gone. The nib was dry. She wrote anyway.

  *Cold Fire,* she scratched. *Warm Ice.*

  The contradictions tasted like copper in her mouth. The logic of the Conservatory was leaking. Usually, *Brass* belonged to *Anger* or *Grief.* *Wood* belonged to *Longing* or *Peace.* But this instrument was neither. It was a vessel for the listener's entry. The visitor upstairs was lonely, so the instrument became *Grief.* The visitor in the west wing was angry, so the instrument became *Heat.* Now, Elara was here, and she was tired. So the instrument became *Static.*

  She looked at her hands. They looked translucent, like parchment held up to a light. The veins were blue lines of ink. She was becoming part of the ledger.

  The instrument emitted a final tone. It wasn't a note. It was a color. It was the color of the space between two stars. It was a deep, velvety black that smelled of ozone.

  Elara understood then that the categories were not containers. They were bridges. And the bridge was moving.

  She stopped trying to write. The pen rolled away, falling off the desk into the shadows. She placed her hand on the silver tube. It was warm. No, it was cool. It was vibrating with the frequency of her own uncertainty.

  *Category,* she thought, but the word slipped. *Category* became *Ceremony.* *Ceremony* became *Cemetery.*

  She laughed, but the sound was swallowed by the room. The shelves behind her settled with a sigh of wood and glass. The visitor upstairs left; the floorboard ceased its groan. The taxonomy stabilized, for a moment, into something new. There was no more *Brass* or *Wood.* There was only *Here* and *Gone.*

  Elara took a fresh card. She did not reach for the pen. She pressed her thumb into the blank stock, leaving an oily print. That was the catalog entry. The warmth of her skin against the paper. The temperature of the curator.

  The instrument rested. It was no longer an object. It was a pause. And Elara sat within the pause, waiting for the next door to open, waiting for the next word to lose its meaning, waiting for the heat to rise again.
