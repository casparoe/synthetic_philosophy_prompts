  6.  **Drafting - Focus on Sensory Detail and Language Warping:**
      *   *Initial state:* Cold brass, weeping tone.
      *   *Shift:* Warm wood, urgent pulse.
      *   *Language:* Start with precise adjectives. Move to contradictory ones. End with abstract or sensory-only descriptions.
      *   *The Visitor:* A shadow, a breath, a door creak. The catalyst for the shift.

  7.  **Refining the "Copycat" Element:**
      *   It's not just that the instrument changes; it's that the *relationship* between concepts changes. If "sadness" was previously "low pitch," now "sadness" might be "sharp sting."
