      *   **Constraints:** No citations, bibliographies, or references to philosophical texts.

  2.  **Deconstruct "Copycat-style Analogical Slippage":**
      *   Copycat is a cognitive architecture model that solves analogies by allowing concepts to slip into neighboring concepts (e.g., 'a' becomes 'z', 'successor' becomes 'predecessor').
      *   In narrative terms, this means the story shouldn't just *say* things are changing; the *logic* of the description should shift. Words should lose their grip. Categories should bleed into one another. The protagonist's internal monologue should reflect this destabilization.
      *   Avoid explaining *how* it works. Show the *experience* of it.

  3.  **Setting the Scene:**
      *   The Conservatory. Needs to feel tangible but wrong. Shelves, cases, dust, light.
      *   The Classification System: Emotional Temperature. Hot, cold, tepid, burning, freezing, lukewarm, volatile.
      *   The Instrument: Needs to be ambiguous. Let's call it the "Object" or give it a vague name until it defines itself. Maybe a stringed thing that sounds like wind.

  4.  **Character:**
      *   Elara (or similar). A curator. Obsessive, precise, struggling against entropy.
