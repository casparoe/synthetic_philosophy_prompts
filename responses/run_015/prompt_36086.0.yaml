  Your verdicts are best captured by the principle that emotions are episodic, object-directed appraisals of significance, which classifies both embarrassment and being moved by music as emotions but requires overturning your verdict on regret.

  This principle, often called a "hybrid appraisal theory," sorts your cases by requiring three conditions: the state must be episodic (ruling out week-long irritability), intentional or object-directed (ruling out caffeine jitters), and driven by an automatic evaluation of personal significance (ruling out pure judgments). This explains why the harmless spider triggers fear (the automatic appraisal of danger persists despite cognitive knowledge) and why awe counts as an emotion (the object is appraised as vastly significant). Applied to your unsure cases, embarrassment at blushing is an emotion because it is an episodic, object-directed appraisal of social exposure, and being moved by sentimental music is an emotion because the music is appraised as poignant regardless of your cognitive knowledge of its sentimentality, mirroring your harmless spider paradigm.

  I would bet against your verdict on **regret**, and the argument that would move me to classify it as a cognitive judgment rather than an emotion is the lack of **modular encapsulation**. You established the harmless spider as your paradigm because the emotion persists despite contrary knowledge, demonstrating that the emotional mechanism is encapsulated from higher cognition; however, you describe regret as "nothing more than the judgment that it was a mistake," which admits that if you withdrew the judgment (e.g., by convincing yourself the career move was correct), the emotion would vanish. If the spider fear is the standard for what earns the label "emotion" in your lab, regret fails the reproducibility test because it is cognitively penetrable, making it more akin to a mood or a propositional attitude than a discrete emotional response.
