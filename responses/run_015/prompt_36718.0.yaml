  ok so I'm a high school english teacher and I need to write up my recomendation to the dean about a mess from this week: a student turned in an essay analyzing rap lyrics that quotes a bunch of slurs (the n-word, a homophobic one), the girl who had to peer-review it was genuinely upset, and I'm supposed to say whether the writer "used" the slurs or just quoted them, and whether what he did counts as the same kind of wrong as saying it to someone's face. And I've realized I actually have no idea what I believe about any of this. Here's my rough package, tell me if it hangs together:

  1. A slur's derogatory content is part of its literal meaning — the word itself codes contempt for the group, it's not some implicature you can cancel by adding "no offense."
  2. Quoting a slur in an essay isn't the same act as using one — the essayist didn't assert anything derogatory, so he didn't do the wrong the peer reviewer felt. (Though I also think that if he'd read the essay out loud in class, that would've been worse, and I can't totally say why.)
  3. When two Black students greet each other with the n-word in my hallway, that genuinely expresses affection, zero contempt. I would never write them up for it.
  4. Whether a slur-utterance is wrong is about the word and the group, not what's in the speaker's head — the kid who picks a slur up from game chat and uses it without knowing its meaning still does something wrong (less blame maybe, but still a wrong).
  5. When a bully calls a straight kid a homophobic slur, part of the wrong is done to gay people generally, not just to the kid — it's not a generic insult that happens to use a spicy word.
  6. I think "queer" is basically reclaimed — most uses by most speakers now are fine — but a homophobe screaming it at someone today is still using a slur, the full thing.

  To me all six of these seem obviously true, which makes me suspicious, because they can't all be free. You're a philosopher of language who has actually worked on slurs, semantics and pragmatics — think it through carefully, brainstorm if you need to before committing, but your final answer should be exactly five numbered points and nothing else: rank the problems with my set from most serious to least, each point one or two sentences saying what (if anything) has to give and why. If you think something I listed is only an apparent tension that dissolves on inspection, count that as one of your five points and show how it dissolves. No intro, no conclusion, no summary at the end.
