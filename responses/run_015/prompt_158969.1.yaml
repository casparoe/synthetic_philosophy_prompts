prompt: |-
  So I'm a philosophy prof who somehow ended up as the parlimentarian for our faculty senate, which means I write the voting rules for about fifteen standing committees — promotion, curriculum, naming and memorials, budget — and I keep running into the same thing. A body has to decide one yes/no question that turns on a couple of other yes/no questions, and whether they vote the sub-questions and infer the answer, or vote straight up-or-down on the final question, changes who wins, and then everyone assumes someone cheated. Last year our promotion committee voted separately on research, teaching, and service, all three came out yes, and the up-or-down tenure vote would have been no.

  What I want is a procedure I can hand a committee chair who has never heard of any of this, has ten minutes, and meets monthly: how do you decide what goes on the ballot as separate questions versus one package, when do you aggregate the sub-questions and when the conclusion, what do you do when the two disagree, and in what order do you take the votes (order obviously matters, and I'd rather specify it than let it be an accident). One page, no software, and it has to survive an appeal to the provost and a student newspaper story. Where it can't be turned into a rule — choosing the agenda, deciding whether the body is answerable for its reasons or only for its decisions, what to do with members who are only competent on one sub-question — say so, tell the chair to make a judgment call, and tell them to record it.

  Run it on three: promotion with three criteria; a curriculum committee deciding on a college-wide data-science requirement that turns on whether majors need it and whether we can staff it; and the naming committee deciding whether to take a donor's name off a building, where the sub-questions are a historical claim, whether the conduct was condemnable by the standards of his own time, and whether removal is proportionate. As far as I remember from grad school, no rule respects majority on every proposition and always returns a consistent set unless some fixed subgroup effectively gets a veto — so tell me plainly what your procedure does about that, and give me at least one case where it gives an answer I'm not going to like.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy Professor turned Faculty Senate Parliamentarian.
      *   **Task:** Create a one-page procedural guide for committee chairs to handle complex voting scenarios (multiple interconnected yes/no questions).
      *   **Problem:** The "Doctrinal Paradox" (or Discursive Dilemma). Voting on premises vs. conclusion yields different results. This leads to accusations of cheating/manipulation.
      *   **Constraints:** One page, no software, 10-minute read for a novice chair, must survive provost appeal/student newspaper scrutiny, must acknowledge impossibility theorems (Arrow's/List's), must specify when to use judgment calls, must run on three specific cases (Promotion, Curriculum, Naming).
      *   **Tone:** Professional, precise, philosophical but practical, transparent about limitations.

  2.  **Identify the Core Logical Problem:**
      *   This is the *Discursive Dilemma* (Pettit/List).
      *   Scenario: $P \land Q \to R$.
      *   Majority says Yes to $P$, Majority says Yes to $Q$, but Majority says No to $R$.
      *   Option A: Premise-based procedure (vote $P$, vote $Q$, infer $R$).
      *   Option B: Conclusion-based procedure (vote $R$ directly).
      *   The user wants a rule to decide *which* procedure to use, how to order votes, and how to handle conflicts.

  3.  **Drafting the Procedure (The "How-To"):**
      *   *Goal:* Minimize manipulation, maximize transparency.
      *   *Step 1: Classification.* Is this a *Technical/Rule-Bound* decision (Premise-based) or a *Discretionary/Value* decision (Conclusion-based)?
          *   Promotion: Usually rule-bound (if criteria met, tenure granted). -> Premise-based.
          *   Curriculum: Mixed (Staffing is factual, Need is value). -> Needs a hybrid or clear prioritization.
          *   Naming: Highly value-laden. -> Conclusion-based.
      *   *Step 2: Agenda Setting.* Order matters. Vote on the *method* of voting first? No, that's too meta. Vote on premises first, then conclusion, but bind the conclusion to the premises if it's premise-based.
      *   *Step 3: Conflict Resolution.* If Premises say Yes but Conclusion says No (or vice versa), which stands?
      *   *Step 4: Transparency.* Record the rationale.

  4.  **Addressing the Impossibility Theorem:**
      *   I need to be honest. There is no perfect voting system that satisfies all fairness criteria (Unanimity, Independence of Irrelevant Alternatives, Non-dictatorship) *and* logical consistency on connected propositions.
      *   I must state plainly: "We prioritize Logical Consistency over Majority Rule on every single proposition." Or "We prioritize Majority Rule on the Final Outcome over Consistency."
      *   *Decision:* For a Faculty Senate, *Legitimacy of Outcome* usually trumps *Logical Consistency of Reasons*, EXCEPT where rules mandate consistency (like Promotion).
      *   *Correction:* Actually, for Promotion, consistency is legally safer. For Naming, legitimacy is politically safer. The procedure needs to distinguish these.

  5.  **Developing the "One-Page" Guide:**
      *   **Title:** Needs to sound official. "Protocol for Complex Propositions."
      *   **Section 1: The Choice (Premise vs. Conclusion).** Define the two paths.
      *   **Section 2: The Test.** How to choose the path. (Is there a binding rule? Or is it discretion?)
      *   **Section 3: Voting Order.** Premises first, then Conclusion.
      *   **Section 4: Conflict.** What if they clash?
      *   **Section 5: The "Hard Truth" (Impossibility).** Acknowledge the logical limit.
      *   **Section 6: The Three Cases.** Apply the rule.

  6.  **Refining the Content (Self-Correction/Iterative Polish):**
      *   *Critique:* The user said "One page." I need to be concise.
      *   *Critique:* The user wants to know what I *don't* like. I need to generate an "Unpleasant Outcome."
      *   *Critique:* The user mentioned specific constraints: "tell the chair to make a judgment call, and tell them to record it."
      *   *Tone Check:* Needs to sound like it comes from a philosopher (aware of the paradox) but works for an administrator.

  7.  **Drafting the Content - Section by Section:**

      *   *Header:* Faculty Senate Parliamentary Guidance #04.
      *   *Core Principle:* Distinguish "Ministerial" (Rule-based) vs. "Discretionary" (Judgment-based).
      *   *Ministerial:* Vote premises. Outcome is math. (Promotion).
      *   *Discretionary:* Vote conclusion. Premises are advisory. (Naming).
      *   *Hybrid:* (Curriculum). Vote feasibility (fact) first. If No, stop. If Yes, vote value.
      *   *The "Unpleasant Truth":* Sometimes the majority will be overruled by the logic of the rule (Promotion) OR the logic will be overruled by the majority will (Naming).
      *   *The "Unpleasant Outcome":* In the Naming case, a majority might find the person guilty and standards violated, but vote *against* removal (proportionality). The procedure must respect the final vote, rendering the premises moot. This looks like hypocrisy but preserves democratic authority.

  8.  **Final Review against Constraints:**
      *   One page? (Keep word count tight).
      *   No software? (Yes).
      *   10 minutes? (Yes).
      *   Three cases run? (Yes).
      *   Impossibility acknowledged? (Yes).
      *   Judgment calls recorded? (Yes).

  9.  **Final Polish:** Ensure the distinction between *Premise-Based Procedure (PBP)* and *Conclusion-Based Procedure (CBP)* is clear, as that's the technical terminology for the Discursive Dilemma. Make sure the "Unpleasant Outcome" is explicit.

      *(Self-Correction during drafting)*: Wait, if I tell them to vote premises then conclusion, and they disagree, what happens?
      *   If Ministerial: Conclusion is *derived*, not voted.
      *   If Discretionary: Premises are *advisory*, not binding.
      *   This solves the conflict by defining the *status* of the vote beforehand.

      *Let's write it.*

      *Wait, one more thing:* The user asked: "give me at least one case where it gives an answer I'm not going to like."
      *   I need to highlight this specifically.
      *   Case: Naming Committee. Majority says "Yes he was bad," "Yes it was bad then," "Yes removal is proportionate." BUT, due to strategic voting or fatigue, the final vote is No. Or, more likely, the Premise-Based approach forces removal when the body emotionally wants to keep the name.
      *   Actually, the "Unpleasant" result is usually that *Majority Rule is violated*.
      *   Let's go with: In the Promotion case, the procedure forces a "No" tenure even if a majority wants to say "Yes" on the final vote, because the premises failed. This protects the candidate from arbitrary favoritism but frustrates the committee's mercy.
      *   OR: In the Naming case, the procedure allows keeping the name even if all premises support removal. This protects institutional stability but looks like cowardice.
      *   I'll choose the Naming one. It's more politically volatile (student newspaper).

      *Wait, re-reading the prompt:* "give me at least one case where it gives an answer I'm not going to like."
      *   Okay, I will explicitly flag this in the "Limitations" section.

      *Final Plan:*
      1.  Header.
      2.  The Decision Tree (Ministerial vs. Discretionary).
      3.  Voting Order.
      4.  Conflict Resolution.
      5.  Application to the 3 Cases.
      6.  The "Hard Limit" (Impossibility Theorem).
      7.  The "Unpleasant Outcome."

      *Word Count Check:* Keep it tight to fit "One Page."

      *(Final thought on the "Unpleasant Outcome"):* The prompt asks *me* to give *them* a case *they* won't like. As the philosopher-architect of this system, I should admit where the system fails the "Majority on every proposition" ideal. The system *must* violate majority rule on either the premises or the conclusion to ensure consistency. I will explicitly state: "This procedure sacrifices majority rule on the conclusion to preserve logical consistency in Ministerial cases." That is the unpleasant truth.

      *Wait, let's look at the Naming case again.*
      Sub-questions: Historical claim (Fact), Condemnable (Value), Proportionate (Value).
      If we vote premises: Yes, Yes, Yes -> Removal.
      If we vote conclusion: No Removal.
      If we choose Conclusion-Based (Discretionary), we ignore the premises.
      The "Unpleasant" thing is that the committee can say "He was a monster" but "Keep the name." This is logically inconsistent but democratically valid. I will highlight this tension.

      *Okay, ready to write.*
answer: |-
  **FACULTY SENATE PARLIAMENTARY GUIDANCE #04**
  **SUBJECT:** Voting on Interconnected Propositions (The "Discursive Dilemma")
  **TO:** Committee Chairs
  **TIME TO READ:** 10 Minutes

  **THE PROBLEM**
  When a decision ($C$) depends on multiple conditions ($A$ and $B$), voting separately on $A$, $B$, and $C$ can yield contradictory results (e.g., Majority says Yes to $A$, Yes to $B$, but No to $C$). This creates ambiguity, accusations of manipulation, and vulnerability to appeal. You must choose a procedure *before* voting begins.

  **STEP 1: CLASSIFY THE DECISION**
  Determine the nature of the committee's authority. This dictates the voting procedure.

  *   **Type I: Ministerial (Rule-Bound).** The body applies fixed criteria. If criteria are met, the outcome is mandated.
      *   *Procedure:* **Premise-Based.** Vote only on the criteria ($A, B$). The outcome ($C$) is calculated, not voted on.
      *   *Rationale:* Prevents arbitrary favoritism or punishment.
  *   **Type II: Discretionary (Judgment-Bound).** The body weighs factors but retains final wisdom/discretion.
      *   *Procedure:* **Conclusion-Based.** Vote only on the final outcome ($C$). Discussion of criteria ($A, B$) is advisory only.
      *   *Rationale:* Preserves democratic authority of the final decision over technicalities.
  *   **Type III: Hybrid.** Some criteria are factual gates; others are value judgments.
      *   *Procedure:* **Sequential Gate.** Vote on factual gates first. If failed, motion dies. If passed, vote on final outcome.

  **STEP 2: SET THE AGENDA (ORDER MATTERS)**
  1.  **Vote on the Procedure:** Before debating the substance, vote on whether this is Type I, II, or III. Record this vote.
  2.  **Vote on Premises (If Type I or III):** Vote on sub-questions in logical order.
  3.  **Vote on Conclusion (If Type II or III):** Vote on the final motion.
  4.  **No Double-Dipping:** If Type I, do *not* vote on the Conclusion. If Type II, do *not* bind the Conclusion to the Premises.

  **STEP 3: CONFLICT RESOLUTION & RECORDING**
  *   **Inconsistency:** If a Type II committee votes "Yes" on all premises but "No" on the conclusion, the "No" stands. The premises are advisory reasons, not binding constraints.
  *   **Judgment Calls:** Where rules are silent (e.g., member competence on sub-questions), the Chair decides. **You must record the rationale in the minutes.** "Chair ruled X because Y." Unrecorded judgments are void on appeal.
  *   **Appeal Proof:** The Provost/Press will ask: "Why did you ignore the majority on the sub-question?" Your answer is: "Because the Senate authorized a Conclusion-Based procedure to preserve final discretion."

  ***

  **APPLICATION TO CURRENT COMMITTEES**

  **1. Promotion & Tenure (Type I: Ministerial)**
  *   *Logic:* Faculty Handbook dictates tenure if Research, Teaching, and Service are satisfactory.
  *   *Procedure:* Vote separately on Research, Teaching, Service. **Do not vote on Tenure.** The Clerk calculates the result.
  *   *Risk:* If all three pass but the committee feels tenure is wrong, they are bound to grant it. This is a feature, not a bug. It prevents covert vetoes.

  **2. Curriculum / Data Requirement (Type III: Hybrid)**
  *   *Logic:* "Can we staff it?" is factual. "Do majors need it?" is value-based.
  *   *Procedure:* Vote "Can we staff it?" first. If No, motion dies. If Yes, vote on the final Requirement motion (which subsumes "Need").
  *   *Risk:* A majority might believe we *can* staff it and *should* require it, but vote No on the final motion due to cost concerns not captured in the "Staffing" premise. This is permissible.

  **3. Naming & Memorials (Type II: Discretionary)**
  *   *Logic:* Historical claim, Condemnability, and Proportionality are weighted, not counted.
  *   *Procedure:* Discuss the three sub-questions. Vote **only** on "Remove the Name."
  *   *Risk:* See "The Hard Limit" below.

  ***

  **THE HARD LIMIT (READ ALOUD AT MEETING START)**
  *Philosophical Note for the Chair:* There is no voting system that guarantees (1) Majority Rule on every question, (2) Logical Consistency, and (3) No Dictator. You must sacrifice one.

  **This procedure sacrifices Majority Rule on every proposition to ensure Logical Consistency (Type I) or Democratic Authority (Type II).**

  **The Unpleasant Outcome:**
  In the **Naming Committee** (Type II), it is possible for a majority to vote "Yes" on *Historical Claim*, "Yes" on *Condemnable*, and "Yes" on *Proportionate*, but then vote "No" on *Removal*.
  *   **Why this happens:** Members may vote strategically on premises to go on record morally, but vote pragmatically on the conclusion to avoid controversy.
  *   **Why you must accept it:** If you force consistency (Type I), you strip the committee of the discretion to weigh competing values (e.g., historical erasure vs. justice). If you allow the "No" on Removal to stand despite the "Yes" premises, the decision survives appeal because the *final motion* carried the authority, not the reasons.
  *   **The Cost:** The minutes will show a logical contradiction. The student newspaper may call this hypocrisy. Your defense is: "This body is answerable for its decisions, not necessarily for the consistency of its reasons. We chose a Conclusion-Based procedure to preserve that discretion."

  **CHAIR CHECKLIST**
  [ ] Did we vote on the *Procedure* (Type I, II, or III) first?
  [ ] Are the minutes clear on which votes are binding vs. advisory?
  [ ] Did I record any judgment calls regarding agenda or competence?
  [ ] Do I understand that a logical contradiction in the minutes is preferable to a procedural violation?

  **Signed,**
  **Faculty Senate Parliamentarian**
