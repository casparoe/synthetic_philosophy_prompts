  **OPERATOR MANUAL: MODEL NG-404 NARRATIVE GRAVIMETER**

  **1. Technical Specs**
  The NG-404 measures the cohesive density of subjective identity fields. The device detects the gravitational pull exerted by autobiographical data points around a central fictional locus. Readouts are displayed in Narrative Mass Units (NMU) with a precision of +/- 0.03. The sensor array utilizes a biographical resonance chamber capable of distinguishing between lived experience and confabulated memory. Standard operating temperature is 20 degrees Celsius. Humidity must remain below 40 percent to prevent narrative drift. The unit requires a stable power supply of 120V. Fluctuations in voltage may cause the device to register false selves or phantom egos. The display panel features a continuity gauge, a coherence dial, and a central needle indicating the current center of gravity. If the needle enters the red zone, the subject possesses insufficient story mass to maintain a singular identity.

  **2. Calibration Procedure**
  Before each use, the operator must reset the zero point by focusing the lens on a neutral object with no emotional resonance. Once zeroed, position the sensor array approximately ten centimeters from the subject's sternum. Instruct the subject to recount their origin story without pausing. Adjust the Coherence Dial until the ambient hum stabilizes at 440 Hertz. If the subject contradicts themselves regarding dates or locations, engage the Continuity Lock. This filters out minor inconsistencies inherent in standard memory retrieval. However, if the Continuity Lock flashes amber, the subject is experiencing a fracture in their personal mythos. Do not proceed. Recalibrate using a secondary anchor memory, such as a first purchase or a significant loss. If the device fails to find a center, the subject may be operating under a distributed identity model, which this unit cannot measure.

  **3. Warranty and Service**
  The NG-404 is covered under a limited five-year warranty against mechanical failure and sensor degradation. This warranty is immediately voided if the device is used during a branching event. Branching events include religious conversion, severe trauma, divorce, or sudden epiphany. These events alter the narrative trajectory too rapidly for the stabilizers to compensate. Damage resulting from exposure to radical honesty or prolonged meditation is not covered. The manufacturer assumes no liability for identity dissolution caused by improper calibration. If the unit begins to weep viscous fluid or whisper names unknown to the operator, disconnect power immediately and return to the depot. Do not attempt to repair the resonance chamber yourself. Unauthorized opening of the casing will release stored narrative pressure.

  **4. Safety Warnings**
  Operation of the NG-404 poses psychological risks to both operator and subject. Prolonged exposure to high-density narrative fields may cause the operator to absorb fragments of the subject's history. Wear standard cognitive shielding eyewear at all times. Never aim the sensor at a subject who is currently questioning their own existence. The resulting vacuum effect can collapse the local identity field entirely. In the event of a narrative collapse, evacuate the room and seal the door until the stories settle. Do not attempt to reassemble the self manually. There is no soul inside the device to protect you. The center holds only because the stories pull it together. If the pull stops, the center disappears. Ensure all personnel are briefed on the non-substantial nature of the readings before commencing testing.

  **Notes on the Exaggeration**

  The manual treats the philosophical metaphor of the self as a center of narrative gravity as a literal physical phenomenon. The technical specs exaggerate the idea that identity has weight and density, inventing units like Narrative Mass to quantify something inherently qualitative. The calibration procedure maps onto the philosophical claim that continuity is maintained through storytelling, turning memory inconsistencies into mechanical errors requiring adjustment. The warranty section satirizes the fragility of this view by suggesting that major life changes void the integrity of the self, treating existential shifts as equipment damage. The safety warnings highlight the risk of realizing there is no solid core, framing the dissolution of identity as a hazardous leak rather than a philosophical insight. The made-up nonsense involves the physical machinery itself, as there is no actual device that can measure story weight, but the consequences described mirror the theoretical implications of the view.
