answer: |-
  **TO:** The Board of Directors
  **FROM:** The Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Amendment of the Endowment Mission Clause

  **Purpose**
  Two years ago, this Board commissioned an internal review of the Foundation's endowment mission. That review is complete. A majority of the Board now believes the original mission framing no longer aligns with current capabilities and needs. However, the founding mission clause requires a four-fifths vote and an eighteen-month published notice to amend. The founding donors, who remain living and active, oppose this change, invoking the clause and their original intent.

  The Governance Committee has reviewed the legal and ethical dimensions of this impasse. While we respect the donors' stewardship, we recommend the Board proceed with the amendment process. This memo outlines the rationale, focusing on four critical governance considerations.

  **1. Asymmetry and Entrenchment**
  The current clause creates a procedural asymmetry: it imposes a high burden to *change* the mission but no corresponding burden to *preserve* it. This effectively entrenches the status quo, treating inaction as a neutral baseline. In governance, inertia is not neutrality. By making preservation easy and change difficult, the clause biases the Foundation toward obsolescence. The "panic rationale" cited by the clause's drafters assumes rapid, reactive shifts. It does not account for a considered, two-year strategic review. Applying an emergency brake to a deliberate course correction misapplies the clause's intent and grants the past a veto over the present's fiduciary judgment.

  **2. Ambiguity of "Impairment"**
  The clause restricts amendments that might "impair" the Foundation's purpose, yet it does not define impairment. Consequently, the Board is currently forced to interpret "impairment" in the heat of this dispute to determine if the clause applies. This creates a paradox: the clause was designed to remove discretion from the Board during contentious moments, yet the Board must exercise that exact discretion to interpret the clause itself. If the Board must judge what constitutes impairment to know if it is restricted, the restriction is not a hard constraint but a matter of interpretation. We argue that failing to adapt to changed circumstances constitutes a greater impairment than amending the text.

  **3. By-Law Precedence**
  Our by-laws permit amendment by a simple majority vote. While the mission clause is embedded in the endowment agreement, its operational enforcement relies on the by-laws. If the by-laws can be amended by majority vote, the four-fifths requirement may be procedurally vulnerable. We are not advising a procedural override, but noting that the "binding" nature of the clause is not absolute. Relying on a clause that may be technically amendable by majority vote creates legal uncertainty. It is preferable to honor the spirit of the notice period while asserting the Board's authority to govern.

  **4. Evaluation of the "Trigger Specification" Option**
  We have evaluated the proposal to defer the mission change and instead specify the conditions under which the mission clause applies (i.e., defining the "trigger" for amendment). This is a robust governance mechanism that would settle the *rules* rather than the *case*.
  *Honest Evaluation:* While theoretically sound, this option risks being viewed as a circumvention tactic if done solely to enable the current amendment. However, if adopted *concurrently* with the amendment notice, it validates the Board's claim that this is not a "panic" decision but a principled evolution. It transforms the process from a one-off exception into a established governance standard. Therefore, we should not treat this as an alternative to the amendment, but as a necessary component of the written statement required by the clause.

  **Donor Testimony and Intent**
  The founding donors are living and actively testify that the current proposal violates their intent. Their testimony carries significant moral weight and reputational risk. However, in legal and governance interpretation, the enacted text supersedes oral history or subsequent recollection of intent. If the donors were deceased, we would rely solely on the text; their living status adds a layer of relational obligation, but not a legal veto beyond what the text dictates. We must honor their generosity without accepting a perpetual guardianship that compromises the Foundation's fiduciary duty to remain effective.

  **Recommendation**
  The Governance Committee recommends that the Board vote to initiate the formal amendment process immediately, incorporating the "trigger specification" into the required written statement to demonstrate the considered nature of this change.

  **Action:**
  1.  **November 16, 2023:** Board vote to approve the "Statement of Reasons and Trigger Criteria," formally initiating the eighteen-month notice period required by the mission clause.
  2.  **November 30, 2023:** Publication of the Statement to all stakeholders and the public.
  3.  **June 30, 2025:** Target date for the final four-fifths vote to enact the mission amendment, following the eighteen-month period.

  **Closing Consideration**
  The strongest consideration on the side we are rejecting is the risk to the Foundation's reputational integrity and the potential erosion of trust with current and future donors who rely on the permanence of mission restrictions. We are rejecting the view that donor intent, once expressed, is static.

  For this recommendation to change, it would have to be true that external legal counsel advises that proceeding poses a material risk of asset clawback or litigation that would financially impair the Foundation's operations. Absent that specific legal threat, the Board's fiduciary duty to ensure the endowment's relevance outweighs the obligation to maintain a static mission.
