answer: |-
  You have put your finger on a genuine and frustrating structural flaw in contemporary moral argumentation. You are correct that while it shares DNA with circular reasoning and the Euthyphro Dilemma, it is distinct enough to warrant its own classification.

  There is no single, canonical Latin name for this specific maneuver (like *ad hominem* or *post hoc*), but in meta-ethics and argumentation theory, it is usually dissected as a combination of **equivocation**, **reification**, and a dishonest deployment of **reflective equilibrium**.

  However, because you asked for a specific term to capture this *sliding* dynamic, I propose we call this **The Normative-Conceptual Slide**.

  Here is the breakdown of why this term fits, how it differs from the classics you mentioned, and the boundary conditions that define it.

  ### 1. The Diagnosis: What is actually happening?
  The arguer is exploiting the dual nature of "thick" moral concepts (like *autonomy*, *justice*, or *cruelty*). These concepts have two components:
  1.  **Descriptive/Conceptual:** What the word *means* (e.g., "Autonomy entails non-coercion").
  2.  **Normative/Evaluative:** Why the word *matters* (e.g., "Autonomy is a supreme good").

  In **The Normative-Conceptual Slide**, the arguer treats the concept as **Normative** when they want to weigh it against other values ("Autonomy is so important it trumps safety"), but retreats to treating it as **Conceptual** when challenged on its foundation ("It's not that it's important, it's just that coercion *by definition* violates autonomy, so asking why is a category error").

  They are sliding between claiming the principle is a **substantive truth** (which can be weighed) and a **tautological definition** (which cannot be questioned).

  ### 2. How it differs from the Classics

  #### Vs. Begging the Question (Circular Reasoning)
  *   **Begging the Question** is static. It assumes the conclusion in the premise from the start ($A$ is true because $A$ is true).
  *   **The Slide** is dynamic. It starts with $A$ justifying $B$. When challenged, it shifts to say $B$ is actually part of the definition of $A$. Then, in the next breath, it treats $A$ as an independent variable again. It isn't just a circle; it's a **gear shift** that hides the engine's lack of power.

  #### Vs. The Euthyphro Dilemma
  *   **Euthyphro** is an **ontological** question about the *source* of value (Is it good because God loves it, or does God love it because it's good?).
  *   **The Slide** is a **structural** question about *argumentative function*. It doesn't matter where the value comes from (God, nature, reason); the problem is that the arguer is using the value as both the **ruler** and the **thing being measured** without admitting they swapped them.

  #### Vs. Reflective Equilibrium
  *   **Reflective Equilibrium** (John Rawls) is the *honest* version of this process. It admits that we go back and forth between principles and judgments to make them cohere.
  *   **The Slide** is the *dishonest* version. It claims the principle is a fixed, foundational ground *while* secretly adjusting the principle to match the judgment. It disguises a negotiation as a deduction.

  ### 3. Proposed Term: The Normative-Conceptual Slide

  If you want to name this in debate or writing, **The Normative-Conceptual Slide** is the most precise descriptor. You might also hear it referred to informally as **"Moral Bootstrapping"** or **"The Tautological Shield."**

  #### Boundary Conditions
  For an argument to qualify as this specific fallacy, it must meet all three conditions:

  1.  **The Dual-Role Requirement:** The key term (e.g., "Autonomy") must be used in two distinct modes within the same argumentative thread:
      *   *Mode A (Substantive):* As an independent value that exerts force on the world.
      *   *Mode B (Definitional):* As a linguistic or conceptual truth that is immune to "Why?" questions.
  2.  **The Defensive Shift:** The arguer must switch from Mode A to Mode B specifically when the foundational status of the value is challenged. (e.g., "Why is autonomy good?" $\rightarrow$ "That's just what autonomy *is*.")
  3.  **The Concealment:** The arguer must not acknowledge the shift. They must present the conclusion as if it were deduced solely from Mode A, while relying on Mode B to protect the premise from scrutiny.

  ### 4. Why this is philosophically potent (and annoying)
  This slide is effective because it exploits a genuine philosophical difficulty: **Thick Ethical Concepts.**

  Philosophers like Bernard Williams and Hilary Putnam have argued that words like "cruel," "brave," or "autonomous" *do* fuse description and evaluation. To call an act "cruel" is to describe it and condemn it simultaneously.

  The arguer you are encountering is weaponizing this fusion. They are treating the *evaluation* as if it were an indisputable *description*.
  *   **Valid:** "Coercion violates autonomy (description), and we ought to respect autonomy (normative premise)."
  *   **The Slide:** "Coercion violates autonomy (description/definition), therefore coercion is wrong (conclusion), and if you ask why we respect autonomy, it's because coercion is wrong (circular justification)."

  ### 5. How to counter it
  If you encounter this, do not accept the slide. Force them to pick a lane.

  *   **The Challenge:** "You are treating Autonomy as a **weight** when you argue it trumps wellbeing, but as a **definition** when I ask why it matters. You need to choose: Is Autonomy a substantive value that needs justification, or is it just a linguistic rule? If it's just a definition, it can't override other values. If it's a value, you owe me a reason why it exists."

  ### Summary
  You have identified a sophisticated form of **Equivocation** masked as **Foundationalism**. While **The Normative-Conceptual Slide** is not yet a dictionary term, it accurately describes the mechanism: the illicit trading of places between a principle's *justificatory power* and its *conceptual definition*. It is the secular, structural cousin of the Euthyphro Dilemma, focused on argumentative integrity rather than divine ontology.
