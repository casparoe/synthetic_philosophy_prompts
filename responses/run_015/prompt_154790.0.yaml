  2.  **Deconstruct the Statue/Clay Problem (Background Knowledge):**
      *   *The Puzzle:* Statue ($S$) and Clay ($C$) occupy the same space at the same time. Are they identical?
      *   *Leibniz's Law:* If $x = y$, they share all properties.
