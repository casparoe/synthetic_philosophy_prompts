      *   *Sortal Concepts:* "Cloud" is a phase sortal (like "puddle"). "Statue" is an artifact sortal. "Clay" is a material sortal. The analogy mixes phase and material sortals.

  5.  **Task 3: Evaluate Monism without "Weather-Dependence":**
      *   If we strip away the vagueness of clouds, do we still get monism?
      *   If the "cloud" had precise boundaries (like a statue), would we still say "there is no cloud, only droplets"?
      *   Actually, the cloud analogy *relies* on the intuition that clouds aren't "real objects" in the same way tables are. They are ephemeral. Statues feel more "object-like."
      *   So, if you remove the ephemerality, the intuition that "it's just the parts" weakens. People are more willing to accept the Statue as a distinct object than the Cloud as a distinct object.
