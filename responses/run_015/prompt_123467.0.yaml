      *   *Standard Literature:* Gazzaniga, Sperry. Usually interpreted as two separate spheres of consciousness (two "minds," two "I"s). The left hemisphere interpre, the right acts.
      *   *User's Claim:* It's one loop losing grip. A fragmentation of the *same* strange loop, not the creation of a second one.
      *   *Analysis:* This is controversial.
