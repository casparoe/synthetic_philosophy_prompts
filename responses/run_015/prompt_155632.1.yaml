prompt: |-
  History textbooks usually put wars, revolutions, and tech like the printing press front and center, but stick climate shifts, the Tambora volcanic winter, and plague years in little sideboxes labeled 'enviromental context.' Germs, volcanoes, and climate are never the main plot—just background. What theory of historical agency or causation is baked into that layout? Does treating them as non-actors assume they lack intentionality, or is it just a narrative convention? And is that consistent with legal practices that hold people responsible for harms partly caused by climate or disease? Say how confident you are and point out the claim you're least sure about.
