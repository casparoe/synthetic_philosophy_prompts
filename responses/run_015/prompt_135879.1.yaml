      *   *Tone:* Keep it academic, philosophical, and precise. Use terms like *phronesis*, *mimesis*, *ontological*, *dialectical*.
      *   *Nuance:* Acknowledge that Plutarch *does* have moral preferences, but the *method* is comparative, not declarative.

  5.  **Final Review against Prompt Requirements:**
