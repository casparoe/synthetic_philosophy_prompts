answer: |-
  The pedagogical practice found in Plutarch's *Parallel Lives*—specifically the *synkrisis* or comparative pairing of Greek and Roman figures without definitive resolution—presupposes a sophisticated moral psychology that diverges sharply from later hagiographic traditions. To reconstruct the implicit theory behind this practice, we must analyze its commitments regarding how moral knowledge is acquired, the ontological status of virtue, and the role of the reader in the construction of ethical meaning.

  ### 1. Moral Cognition and Exemplarity: The Active Judge
  The primary philosophical commitment of the Plutarchan pair is that moral cognition is an active, deliberative faculty (*phronesis* or practical wisdom) rather than a passive receptivity. By refusing to synthesize the pair into a single normative model, Plutarch assumes that virtue cannot be transmitted as a static datum. If the goal were simple imitation, a single, flawless exemplar would suffice. By offering two flawed, complex, and culturally distinct lives, the text forces the reader into the position of a judge rather than a disciple.

  This practice presupposes that **exemplarity is dialectical**. The moral lesson does not reside *in* the subject (Demosthenes or Cicero) but emerges *between* the subjects and the reader's engagement with them. The preservation of contradictions within each life signals that character is not a unified essence but a constellation of habits, circumstances, and choices that may conflict. Therefore, the reader's task is not to copy the life but to simulate the deliberative process the subject faced, using the parallel life as a control variable to isolate specific moral qualities from their cultural accidents.

  ### 2. Cross-Cultural Moral Knowledge: Invariance vs. Framing
  Regarding the ontology of virtue, the *Parallel Lives* occupies a middle ground between strict moral universalism and relativism. The practice requires that virtues and vices be **culturally invariant enough to be recognized, but context-sensitive enough to require translation.**

  If virtues were entirely culturally constituted, the comparison between a Greek legislator and a Roman consul would be category error; there would be no common metric for "justice" or "courage." Plutarch presupposes a shared human nature (a Stoic and Platonic commitment) wherein the *capacity* for virtue is universal. However, the *manifestation* of virtue is deeply embedded in political and cultural structures.

  Therefore, the implicit theory is not that moral concepts are *constituted* by the comparative framing, but that they are **illuminated** by it. The framing acts as a prism. We know what "ambition" is in the abstract, but by placing Alexander next to Caesar, we see how ambition functions differently in a monarchy versus a crumbling republic. The comparison does not create the moral concept; it refines the reader's ability to discern the concept's core from its contextual clothing. This presupposes that cross-cultural moral knowledge is possible, but only through a rigorous process of analogical differentiation, not direct identification.

  ### 3. Mechanism of Learning: Deliberative Weighing
  The prompt asks to distinguish between analogical transfer, deliberative weighing, or emotional admiration. The Plutarchan practice strictly presupposes **deliberative weighing of incommensurable characters.**

  *   **Analogical Transfer** implies a direct mapping ($A$ is to $B$ as $C$ is to $D$), suggesting that what worked for the Greek should work for the Roman, or vice versa. Plutarch avoids this; he often highlights how a specific virtue in one context leads to ruin in another.
  *   **Emotional Admiration** suggests a passive affective response to a "fractured whole." While Plutarch engages the emotions, the goal is not admiration of the fracture itself, but the cognitive work required to navigate it.
  *   **Deliberative Weighing** is the correct mechanism. The reader holds two distinct moral weights on a scale. Because the weights are different (incommensurable temperaments and contexts), the scale does not settle on its own. The reader must supply the fulcrum. This requires the reader to evaluate how different temperaments interact with different political fortunes. The moral learning occurs in the *act of weighing*, not in the result.

  ### 4. Consistency with Hagiography: Incompatible Accounts of Character
  The paired, unresolved format of the *Parallel Lives* is **philosophically inconsistent** with the hagiographic tradition's tendency to resolve contradiction into sanctity. These traditions depend on incompatible accounts of what a life reveals about character.

  *   **Plutarch (The Ethical-Political Model):** Character is revealed through action in the public sphere, subject to fortune (*tyche*). Contradictions are evidence of human limitation. The "truth" of the life is found in the tension between intention and outcome. The biography is a case study in moral psychology.
  *   **Hagiography (The Ontological-Theological Model):** Character is revealed through grace. Contradictions are either suppressed as irrelevant or reinterpreted as mysteries of humility (e.g., a saint's sin becomes a lesson in reliance on God). The life is resolved into a unified portrait because the saint is viewed as a vessel of the divine. The "truth" of the life is its coherence with a divine archetype.

  In hagiography, the reader is asked to *venerate*; in Plutarch, the reader is asked to *deliberate*. Hagiography assumes the subject has transcended the moral struggle that Plutarch assumes is the permanent condition of the moral agent. To introduce Plutarchan unresolved pairing into hagiography would undermine the claim of sanctity; to introduce hagiographic resolution into Plutarch would undermine the claim of practical utility. They are incompatible because one views the subject as a mirror of human possibility (Plutarch) and the other as a window to divine perfection (Hagiography).

  ### 5. Pedagogical Shift: From Judgment to Attachment
  If the implicit Plutarchan view were replaced by a theory treating moral learning as **direct emotional attachment to an unproblematic, singular model**, the pedagogical practice would undergo a fundamental transformation:

  1.  **Narrative Flattening:** Biographies would cease to be critical histories and become edifying legends. Episodes of failure, ambiguity, or moral compromise would be excised or reinterpreted as hidden virtues. The narrative arc would move from "struggle and consequence" to "trial and triumph."
  2.  **Loss of Critical Distance:** The reader's role would shift from active judge to passive devotee. The pedagogical question changes from "How should I weigh these competing claims?" to "How can I love and imitate this perfect model?"
  3.  **Suppression of Context:** In the Plutarchan model, context is vital (why did this fail in Rome but work in Athens?). In the attachment model, context becomes secondary to the internal radiance of the subject. The singular model is presumed to be universally applicable without the need for comparative translation.
  4.  **Fragility of Morality:** By removing the "unresolved" nature of the life, the pedagogy becomes fragile. When the learner inevitably encounters the inevitable contradictions of their own life or the flaws of the model, the moral system risks collapse (scandal), whereas the Plutarchan system anticipates flaw as a site for learning.

  ### Conclusion
  Plutarch's practice of pairing unresolved lives presupposes a moral realism where virtue is universal but historically situated, and a moral cognitivism where learning is an act of critical judgment rather than imitation. It treats the reader as a co-author of moral meaning, requiring them to synthesize what the text leaves distinct. This stands in stark opposition to the hagiographic tradition, which resolves contradiction to facilitate veneration. Shifting from the Plutarchan model to a model of singular emotional attachment transforms ethics from a civic discipline of judgment into a devotional discipline of adherence, sacrificing the complexity of human agency for the comfort of a unified ideal.
