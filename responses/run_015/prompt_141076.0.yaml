answer: |-
  You have identified a genuine fissure in the philosophy of language and legal theory that often goes unremarked because standard Speech Act Theory (SAT) tends to group them all under "illocutionary acts." You are correct that simply saying "these are all performatives" does not solve the problem. The distinction you are seeing is real, structurally significant, and surprisingly under-named.

  There is no single, canonical pair of terms (like "noun/verb") that universally settles this in linguistics. However, the concepts exist scattered across law, ethics, and pragmatics. Below is an analysis of the existing notions, why they fall short, and a proposed framework to name and define the two kinds you are observing, including an explanation for the shifting verbs and the retrospective dating.

  ### 1. The Existing Notions (and Why They Fail)

  The closest established concept is **Uptake**.
  J.L. Austin, who founded Speech Act Theory, noted that for some speech acts to be "felicitous" (successful), the hearer must secure **uptake**—they must understand and, in some cases, accept the act.
  *   **Where it fails:** "Uptake" is a *condition*, not a classification. We speak of "acts requiring uptake," but we do not have a standard noun for "Acts that require uptake" vs. "Acts that do not." Furthermore, Austin was vague on *which* acts require it. He suggested orders require uptake (you aren't obeyed if no one hears), but your observation is sharper: you are distinguishing acts that are *constitutively incomplete* without a response from those that are *constitutively complete* upon utterance.

  The second existing notion is **Unilateral vs. Bilateral Juristic Acts** (from Law).
  *   **Where it fails:** This covers the "bet" (contract) vs. the "promise" (unilateral obligation) distinction well. However, law struggles with the "apology." An apology is not a legal act, yet it follows the "promise" pattern (complete upon utterance). Conversely, "forgiveness" sits awkwardly in law; it is often treated as a unilateral release of debt, yet in your grievance meetings, it behaves like a bilateral treaty.

  The third notion is **Commissive vs. Behabitive** (Austin's categories).
  *   **Where it fails:** "I promise" and "I bet" are both Commissives (committing the speaker to a future course of action). Yet they behave differently regarding acceptance. So the standard verb-classifications do not map onto the distinction you have found.

  ### 2. A Proposed Taxonomy

  Since no single label suffices, I propose we distinguish these based on their **Validity Conditions**. Let us call them **Autonomous Performatives** and **Collaborative Performatives**.

  #### A. Autonomous Performatives (Uptake-Independent)
  *   **Definition:** An act that achieves its illocutionary point (its "doing") solely through the authorized utterance by the speaker. The hearer's reaction affects the *consequences* of the act, but not its *existence*.
  *   **Mechanism:** The speaker alters their own normative status (their obligations or moral stance) immediately.
  *   **Your Examples:**
      *   *"I am sorry for what I did."* (Apology): The apology exists the moment it is said. If the hearer rejects it ("I don't accept your apology"), the apology remains a valid apology; it is merely an *unaccepted* one.
      *   *"I won't mention it to anyone."* (Promise): This binds the speaker immediately. If the hearer says "I don't want your promise," the promise still exists as a binding obligation on the speaker (they are now obligated to silence, whether the hearer likes it or not).

  #### B. Collaborative Performatives (Uptake-Dependent)
  *   **Definition:** An act that proposes a change in the *shared* normative status between speaker and hearer. It remains in a state of suspension (a "proposal") until the hearer performs a complementary act (acceptance).
  *   **Mechanism:** The speaker cannot alter the shared reality alone; they require a co-signatory.
  *   **Your Examples:**
      *   *"I bet you twenty pounds..."* (Wager): Until the other side says "You're on," there is no bet. There is only an offer to bet.
      *   *"I offer $5,000 for the car."* (Offer): Until accepted, this is merely an expression of intent, not a deal.

  ### 3. Why Verbs Shift Between Groups

  You noted that "promise" seems to move between the two groups. This is not because the verb is ambiguous, but because the **Illocutionary Complex** changes.

  *   **The Pure Promise (Autonomous):** "I promise to call you."
      *   Here, the obligation is entirely on the speaker. The hearer receives a benefit (assurance) but undertakes no duty. This is an **Autonomous Performative**.
  *   **The Bargain Promise (Collaborative):** "I promise to pay you $100 if you fix this."
      *   Here, the "promise" is actually one half of a **Collaborative Performative** (a contract). The utterance is not just a promise; it is an *offer of exchange*. The "promise" part cannot bind the speaker to the *exchange* until the other side accepts the terms.
      *   *Why it feels like a shift:* In a grievance meeting, "I promise to rectify this" often functions as a **Settlement Offer**. If management says, "We promise to change the policy," they are often implicitly saying, "...if you drop the grievance." If you treat it as an Autonomous Promise, you expect immediate change. If they treat it as part of a Collaborative exchange, they wait for you to withdraw the grievance. This mismatch causes the friction you observe.

  ### 4. The "Retroactive" Phenomenon

  You asked about the strange temporal shift: *"We have had a bet since Tuesday,"* even though on Tuesday there was no bet.

  This is a phenomenon of **Constitutive Backdating** (or **Ratification**).

  In Collaborative Performatives, the acceptance does not just start the clock; it **validates the history of the offer**.
  1.  **Tuesday (Offer):** The speaker creates a *potential* normative space. It is a "standing invitation."
  2.  **Friday (Acceptance):** The hearer steps into that space.
  3.  **The Effect:** The completion of the act "crystallizes" the timeline. Because the acceptance matches the terms of the offer, the resulting agreement is treated as a continuous state of affairs spanning the gap between Offer and Acceptance.

  **Why do we speak this way?**
  If we said, "The bet started Friday," it would imply the delivery (which happened Thursday) was not covered. To make the Collaborative Performative work, the acceptance must *reach back* and grab the offer, fusing them into a single continuous entity. In law, this is sometimes handled by the doctrine of **Relation Back**: once the agreement is finalized, the legal consequences relate back to the time of the initial offer to ensure continuity of obligation.

  ### 5. The Case of "Forgiveness"

  This is the messiest case because it sits on the boundary of **Internal Status** vs. **Relational Status**.

  *   **The Autonomous View:** Forgiveness is an internal release of resentment. "I forgive you" means "I am no longer holding this against you." This is complete upon utterance (or even upon thought). It requires nothing from the offender.
  *   **The Collaborative View:** Forgiveness is the restoration of a relationship. A relationship is a shared status. You cannot restore a shared status alone. If I say "I forgive you" but you do not accept that restoration (perhaps because you do not believe you did wrong, or you reject my authority to judge), the *relationship* remains broken.

  In grievance meetings, this distinction is fatal.
  *   If the aggrieved party treats forgiveness as **Autonomous**, they say: "I have moved on."
  *   If the organization treats forgiveness as **Collaborative**, they hear: "We are not reconciled until I verify your remorse."
  *   This is why "I forgive you" can feel offensive. If offered as an Autonomous act ("I am declaring this debt void"), it can feel like a power move (a verdict). If expected as a Collaborative act ("Let us be friends again"), it feels empty without the other side's participation.

  ### Summary for Your Notes

  When documenting these distinctions in your context, you can use this framework:

  1.  **Classification:** Distinguish between **Autonomous Performatives** (effective immediately, bind the speaker) and **Collaborative Performatives** (effective upon acceptance, bind the relationship).
  2.  **The Shift:** Watch for **Contextual Embedding**. A "promise" embedded in a negotiation becomes part of a Collaborative exchange, losing its Autonomous immediacy.
  3.  **The Time Travel:** Explain the "since Tuesday" phenomenon as **Constitutive Backdating**. The acceptance validates the offer's duration, creating a fiction of continuous existence to ensure the obligation covers the interim period.
  4.  **The Conflict:** Many grievance impasses occur because one party treats a Collaborative act (a settlement offer) as Autonomous (a binding commitment), or vice versa (treating an apology as a negotiation tactic rather than a completed moral act).

  This distinction does not have a single famous name, but describing it as **Autonomous vs. Collaborative Illocutions** will be immediately understood by anyone versed in linguistics or law, and it accurately captures the mechanics you have observed.
