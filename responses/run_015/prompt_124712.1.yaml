prompt: |-
  hey my roommate is thinking about signing up for this neural immersion program. you lay in a pod and it feeds your brain a perfect life—cool job, good friends, always feeling great. he says wellbeing is literally just good experiences so why not? but heres the twist: the program rewrites your memories so you think you earned everything, and every year you can switch to a totally different life script with a new personality. he says im just being romantic about real struggle. is he right? if the feelings are real to him does it matter that none of it actually happened?
