answer: |-
  **Project Title:** Disambiguating "Computation" in Neural Dynamics: A Conceptual Taxonomy
  **Applicant:** [Name]
  **Duration:** Four Months
  **Request:** Independent Study Grant

  **Statement of the Problem and Research Question**
  The central question of computationalism—whether the brain is a computer—remains unresolved despite decades of inquiry. This project contends that the debate is obstructed by a hidden equivocation in the term "computation." In computer science, the term denotes discrete digital symbol-manipulation; in physics and engineering, it frequently denotes continuous analog dynamics. Neither computationalists nor anti-computationalists systematically disentangle these senses when applying the term to neural tissue. Consequently, the proposed inquiry asks: Does either sense of computation apply non-trivially to mental processes, or does the ambiguity itself render the debate ill-posed?

  **Significance and Limitations of Existing Approaches**
  Current philosophical frameworks fail to settle this question because they bypass the physical specificity of the term. Standard functionalism treats implementation as opaque, assuming that if mental states are functionally definable, the substrate is irrelevant. This ignores the physical distinction between discrete and continuous dynamics. Conversely, connectionism models neural dynamics but often conflates analog signal processing with digital computability without rigorous justification. Because neither framework addresses the definitional ambiguity at the level of physical dynamics, the debate proceeds at cross-purposes.

  **Methodology**
  This project employs a strictly conceptual method requiring no new empirical experiments. The primary task is the construction of a rigorous taxonomy of computation-types, distinguishing discrete symbolic processes from continuous dynamical processes based on criteria drawn from information theory and thermodynamics. This taxonomy will then be applied to established models of neural dynamics found in existing literature. The analysis will determine whether neural activity satisfies the necessary and sufficient conditions for either category without relying on metaphorical usage.

  **Expected Outcomes**
  The research aims to produce one of three determinate verdicts:
  1.  **Digital Affirmation:** Neural dynamics satisfy the conditions for discrete symbol-manipulation, validating strong computationalism.
  2.  **Analog Revision:** Neural dynamics satisfy only the conditions for continuous analog processing, requiring a reformulation of computational theory to accommodate dynamical systems.
  3.  **Conceptual Dissolution:** The taxonomy reveals that neither sense applies non-trivially, indicating that the "brain as computer" thesis is a category error.

  **Risk Assessment**
  There are two primary failure conditions. First, the proposed taxonomy may collapse if the distinction between discrete and continuous proves physically untenable at the neural scale. Second, the analysis may reach an impasse if determining the applicable computation type requires specific neurobiological data rather than philosophical analysis. In either case, the project will document the specific conceptual blockage, providing value by delineating the limits of armchair inquiry in this domain.

  **Scope and Feasibility**
  This work is scoped specifically for four months of solo conceptual research. As it relies on logical analysis and existing theoretical models rather than data collection or collaborative experimentation, the timeline is realistic. The deliverable will be a monograph-length manuscript suitable for publication. By resolving the terminological ambiguity, this project offers a tractable path forward for the philosophy of mind, ensuring that future debates rest on a physically precise foundation.
