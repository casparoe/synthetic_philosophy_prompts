  ### Stage 3: Adjudication of the Four Questions

  #### One: The Invariance Claim
  **Verdict:** Your invariance claim is **false** regarding the *Dominance Theorem*, though technically true regarding *individual dominance relations*.

  **The Distinction:**
  1.  **Invariance of Relation:** If credence function $c'$ dominates $c$ under measure $I$, then $c'$ dominates $c$ under $f \circ I$ for any strictly increasing $f$. This is trivially true.
  2.  **Invariance of Theorem:** The Joyce/Predd argument for Probabilism does not merely say "some functions dominate others." It says: "For **every** incoherent $c$, there **exists** a coherent $c'$ that dominates it."

  **What Goes Wrong:**
  The *existence* of a dominator depends on the geometry of the "better-than" sets (the sets of credence functions with lower inaccuracy than $c$). For the Probability Simplex to always contain a dominator for any point outside it, the "better-than" sets must be convex. This requires the inaccuracy measure to be **convex** in the credences.
  A non-linear transformation (like the square root) changes the curvature of the function. If you apply a concave transformation to a convex measure, you destroy the convexity of the level sets. Consequently, the "better-than" set may no longer intersect the Probability Simplex in a way that guarantees a dominator.

  **Expected Accuracy and Scale:**
  You suspect you need an interval scale. You are correct.
  *   **Dominance (Probabilism):** Requires **Convexity**. This is a cardinal property of the function's curvature, not preserved by arbitrary monotone transformations. Ordinal information is insufficient to guarantee the *existence* of a dominator.
  *   **Expectation (Conditionalization):** Requires **Interval Scale**. Expected inaccuracy is $E[I] = \sum p(w) I(c, w)$. If you transform $I$ to $f(I)$, then $E[f(I)] \neq f(E[I])$ unless $f$ is affine. Therefore, the credence function that minimizes expected inaccuracy will change under non-affine transformations. You cannot derive Conditionalization from ordinal accuracy alone.

  **Footnote Formulation:**
  > "While dominance relations between fixed credence functions are invariant under ordinal transformations, the *theorem* that every incoherent function is dominated by a coherent one relies on the convexity of the inaccuracy measure. Convexity is not preserved under non-linear monotone transformations. Furthermore, arguments for Conditionalization rely on the maximization of expected accuracy, which requires an interval scale; ordinal rankings are insufficient to determine expectations."

  #### Two: Square-Root vs. Manhattan and Propriety
  **Verdict:** The failure is an artifact of the **concavity** of the square root, but Manhattan (linear) fails for a different reason: it yields ties, not domination. The load-bearing condition is **Strict Propriety**, not Truth-Directedness.

  **Diagnosis:**
  *   **Manhattan ($L_1$):** For $c_{coh}=(0.5, 0.5)$ and $c_{inc}=(1,1)$, the scores are tied (1 vs 1). Incoherence is not *penalized*, merely permitted. This fails to establish Probabilism (which requires incoherence to be *defective*).
  *   **Square-Root:** Actively rewards incoherence.
  *   **Truth-Directedness:** This condition only requires that the *truth* (the omniscient credence function) is most accurate. Your measure satisfies this. But it is too weak. It allows measures that reward extremity elsewhere.
  *   **Strict Propriety:** A measure is proper if, for any credence function $c$, the expected inaccuracy is minimized by reporting $c$.
      *   **Informal Work:** Propriety ensures **epistemic stability**. If a measure is improper, an agent who holds credences $c$ will expect to gain accuracy by adopting different credences $c'$. This makes the norm "be accurate" self-undermining.
      *   **Your Measure:** It is **improper**. If you hold $c=(0.5, 0.5)$, your expected inaccuracy is minimized by reporting $(1, 1)$ or $(1, 0)$, not $(0.5, 0.5)$. (As shown in your domination calculation: $(1,1)$ beats $(0.5, 0.5)$ at every world, so it certainly beats it in expectation).
      *   **Epistemic vs. Decision-Theoretic:** It is doing epistemic work. If accuracy is the fundamental epistemic value, a measure that recommends you abandon your current evidence-based credences for extremal ones *in order to be more accurate* defines accuracy in a way that is hostile to belief. Propriety is the constraint that aligns the *value* of accuracy with the *norm* of coherence.

  #### Three: Representation Result and Admissibility
  **Verdict:** Yes, the result holds. Your measure is **inadmissible**. The residual differences among admissible measures are minor regarding Probabilism but significant regarding Regularity.

  **The Theorem:**
  Savage (1971) and Gneiting & Raftery (2007) established that on a finite partition, a differentiable scoring rule is strictly proper if and only if it is a **Bregman Divergence** generated by a strictly convex function (plus an affine transformation).
  *   **Brier Score:** Generated by $\phi(x) = \sum x_i^2$.
  *   **Log Score:** Generated by $\phi(x) = \sum x_i \ln x_i$.
  *   **Your Measure:** Generated by $\phi(x) = \sum \sqrt{|x_i|}$. This function is **concave**, not convex. It is not a Bregman divergence. It is not proper.

  **Does this Answer the Objection?**
  Yes, it significantly blunts the Arbitrariness Objection. The objection claims you can pick *any* distance metric. The representation theorem shows you can only pick from the class of **convex generators**. This is a tight constraint.
  *   **Robustness:** Predd et al. (2009) showed that *all* Bregman divergences agree on Probabilism. If a measure is proper, incoherent credences are dominated. The choice among proper measures does not affect the derivation of Probabilism.
  *   **Regularity:** There is a genuine divergence here. The Log Score (generated by $x \ln x$) goes to infinity at the boundary, requiring regularity (no credence 0 or 1). The Brier Score (generated by $x^2$) is bounded, allowing dogmatism.
  *   **Is this Artifacts?** It is not an artifact of "metric choice" in the arbitrary sense; it is a structural feature of the convex generator. If you believe rationality *requires* open-mindedness (Regularity), you must argue for a generator with vertical tangents at the boundary (like Log). If you think dogmatism is permissible, Brier is fine. This is a substantive normative disagreement, but it is located within the constrained class of proper rules, not in the wild west of all distance metrics.

  #### Four: Salvaging the Ordinalist Reply
  **Verdict:** The Ordinalist Reply is **unsalvageable**. You must concede that the choice of inaccuracy measure does substantive normative work.

  **Why:**
  You cannot derive Probabilism from ordinal accuracy alone because the *existence* of dominators requires convexity (a cardinal property). You cannot derive Conditionalization from ordinal accuracy alone because expectation requires an interval scale. The "Ordinalist Reply" attempts to bypass the normative weight of the metric by claiming it is merely representational. The math proves it is not. The curvature of the metric determines whether coherence is rewarded or punished.

  **Honest Options for Defense:**
  Do not try to defend Ordinalism. Defend **Properness**.
  1.  **The Properness Constraint:** Argue that the only admissible accuracy measures are the strictly proper ones (Bregman divergences). This is not an arbitrary stipulation; it is a requirement for epistemic stability (avoiding self-undermining norms).
  2.  **Robustness:** Point out that *within* the class of proper measures, Probabilism is robust. The Arbitrariness Objection loses its force because the "arbitrary" choice is constrained to a family that all yield the same core result (Probabilism).
  3.  **Address the Residual:** Acknowledge the Regularity divergence (Log vs. Brier). Argue for one based on independent epistemic grounds (e.g., "epistemic utility should not be bounded" or "dogmatism is irrational").

  **Recommendation:**
  Abandon the square-root measure. It is improper and validates incoherence. Pivot your paper to argue that the Arbitrariness Objection fails because **Propriety** constrains the admissible measures sufficiently to guarantee Probabilism robustly. The normative work is done by the requirement of Propriety, not by the specific choice of Brier over Log. This is a stronger, mathematically sound position.

  **Final Word:**
  Your intuition about "diminishing marginal disutility of error" is epistemically natural for *practical* utility, but fatal for *epistemic* utility. Epistemic utility must be convex to penalize the "spread" of error that incoherence entails. If you use a concave measure, you treat epistemic error like a financial loss that can be diversified; but in epistemology, error in disjoint propositions does not hedge; it compounds incoherence. Stick to the convex Bregman divergences.
