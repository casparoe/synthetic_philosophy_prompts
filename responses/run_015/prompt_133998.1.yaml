answer: |-
  Decision Tree for Classifying Group Uniformity

  Start Observation: A sequence of people each make a one-off choice between two options; each person can see what the people before them chose; each person also has some private hint about which option is better; and the group ends up nearly unanimous on the option that you privately suspect is worse.

  1.  **Visibility of Reasons:** Could each person see the *reasons* behind the previous choices (e.g., hearing someone explain why they picked elective A), or only the *choices* themselves (e.g., seeing names on a sign-up sheet)?
      *   **Reasons Visible:** Go to Leaf 1.
      *   **Choices Only:** Go to Question 2.

  2.  **Common Public Signal:** Before the sequence started, did everyone receive the exact same public news or instruction that would logically lead to this choice (e.g., a headteacher announces a rule everyone must follow)?
      *   **Yes:** Go to Leaf 2.
      *   **No:** Go to Question 3.

  3.  **Group Composition:** Did anyone leave the room, stay silent, or drop out of the sequence *because* they disagreed, before the final count was reached (e.g., dissenters walked out of the meeting)?
      *   **Yes:** Go to Leaf 3.
      *   **No:** Go to Question 4.

  4.  **Payoff Dependence:** Does the value of the choice increase for you simply because more people are making it (e.g., an elective needs 10 students to run, or a cafeteria queue moves faster if more join it)?
      *   **Yes:** Go to Question 5.
      *   **No:** Go to Question 6.

  5.  **Nature of Dependence:** Is the benefit because the task objectively works better with crowds (utility), or because you want to guess which option the crowd will value most (prediction)?
      *   **Utility (Works Better):** Go to Leaf 4.
      *   **Prediction (Guessing Value):** Go to Leaf 5.

  6.  **Social/Reputational Cost:** Would choosing differently make you look foolish, incompetent, or risk your standing, even if the choice itself doesn't change the outcome (e.g., being the only one to raise a hand against a policy)?
      *   **Yes:** Go to Question 7.
      *   **No:** Go to Question 9.

  7.  **Private Belief (Anonymous):** If asked on an anonymous slip of paper afterwards, would they say the chosen option was actually the better one?
      *   **Yes (Privately Agree):** Go to Leaf 6.
      *   **No (Privately Disagree):** Go to Question 8.

  8.  **Misjudgment of Others:** Did they assume that the other people *privately believed* the chosen option was correct (e.g., "I thought everyone else liked it"), or did they know others also doubted it (e.g., "I knew everyone hated it but stayed silent")?
      *   **Assumed Others Believed It:** Go to Leaf 7.
      *   **Knew Others Doubted It:** Go to Leaf 8.

  9.  **Fragility (Strong Signal):** If one person loudly stated a very strong private reason against the choice (stronger than the crowd history), would the chain of copying break immediately?
      *   **Yes (Fragile):** Go to Question 10.
      *   **No (Robust):** Go to Leaf 9.

  10. **Order Dependence:** If you shuffled the order of the choosers (made the last person go first), would the final unanimous choice change?
      *   **Yes (Path Dependent):** Go to Leaf 10.
      *   **No (Path Independent):** Go to Leaf 9.

  ---

  **Leaves and Diagnostics**

  *   **Leaf 1: Genuine Convergence.** (Mechanism: Deliberation). People saw reasons and were convinced. Uniformity is robust because it is based on shared understanding, not just copying.
  *   **Leaf 2: Common Cause.** (Mechanism: Spurious Herding). No social influence occurred; everyone reacted independently to the same news. Uniformity is an artefact of identical inputs.
  *   **Leaf 3: Selection Bias.** (Mechanism: Survivorship/Exit). The group looks uniform only because the dissenters removed themselves from the observable pool.
  *   **Leaf 4: Network Effects.** (Mechanism: Complementarities). Copying is rational because the option's value depends on adoption count. Uniformity is stable and efficient.
  *   **Leaf 5: Higher-Order Herding.** (Mechanism: Keynesian Beauty Contest). Copying is driven by guessing what others will value, not the value itself. Uniformity is speculative and can crash.
  *   **Leaf 6: Reputational Conformity.** (Mechanism: Career Concerns). People privately agree (or don't care) but public agreement is driven by the desire to look competent/safe. *Note: If they privately agree the choice is "better," this contradicts the "bad choice" observation unless "bad" is objective only.*
  *   **Leaf 7: Pluralistic Ignorance.** (Mechanism: Misestimated Norms). People privately disagree but publically agree because they mistakenly believe everyone else privately agrees. Uniformity is brittle but stable until a dissenter speaks.
  *   **Leaf 8: Cynical Compliance.** (Mechanism: Repressive Conformity). People privately disagree and know others disagree, but silence is enforced by social penalty. Uniformity is stable due to fear.
  *   **Leaf 9: Unoccupied/Incoherent.** (Diagnosis: No social cost, no payoff dependence, robust copying, private disagreement). This combination is logically unstable. If there is no cost and no benefit, and you privately think it's wrong, you should not copy robustly. This space is empty or implies hidden variables (e.g., hidden social cost).
  *   **Leaf 10: Information Cascade.** (Mechanism: Rational Herding). People ignore private hints because public history seems more informative. **Note on Fragility:** You were told cascades are fragile (Question 9) and cannot lock in if private hints are arbitrarily strong. This is theoretically correct: a single strong public signal breaks a cascade, and if private signals can be infinitely strong, a cascade should not start. In practice, signals are usually bounded, so cascades occur but remain fragile.

  **Indistinguishable Cases:**
  *   **Pluralistic Ignorance (Leaf 7) vs. Cynical Compliance (Leaf 8):** These cannot be separated by observing actions alone. You need the extra observation from Question 8 (asking participants what they thought *others* believed). Without this, both look like "Public Agree, Private Disagree."
  *   **Information Cascade (Leaf 10) vs. Common Cause (Leaf 2):** If you cannot verify whether a common signal existed (Question 2), a cascade looks like everyone reacting to the same invisible news. You need to verify if private hints differed initially.

  ---

  **Application to Staff Meeting Case**

  **Case:** 30 teachers, Head announces policy. 3 known dissenters see nobody objecting. Each believes privately it will fail (can articulate reasons). No one speaks. Afterwards, privately, most say it was a bad idea.

  **Running the Tree:**
  1.  **Visibility of Reasons:** Choices only (Silence/Observation of no objection). -> **Q2**.
  2.  **Common Public Signal:** The policy was announced, but the *choice* was whether to object. Private hints on quality differed (some knew it would fail). -> **No**. -> **Q3**.
  3.  **Group Composition:** Did dissenters leave? No, they were at the meeting. -> **No**. -> **Q4**.
  4.  **Payoff Dependence:** Does objecting become better if more object? Not really; the policy passes either way, but social cost varies. -> **No**. -> **Q6**.
  5.  **Social/Reputational Cost:** Would choosing differently (objecting) make them look foolish/risk standing? Yes ("being seen to try and fail is embarrassing" context, plus silence implies safety). -> **Yes**. -> **Q7**.
  6.  **Private Belief (Anonymous):** Would they say it was better on anonymous slip? No ("privately, most of the staff say they thought it was a bad idea"). -> **No**. -> **Q8**.
  7.  **Misjudgment of Others:** Did they assume others privately believed it was correct? Yes ("each of them can see that nobody else is objecting... afterwards... most say they thought it was a bad idea"). They misjudged the silence as agreement. -> **Yes**.

  **Result:** The case lands on **Leaf 7: Pluralistic Ignorance**.

  **Deciding Branch:** Question 8 (Misjudgment of Others) was the critical splitter between Pluralistic Ignorance and Cynical Compliance.

  **Confirmatory Observation:** At the next meeting, ask teachers anonymously: "Did you remain silent because you thought everyone else supported the policy, or because you knew others opposed it but were afraid to speak?" If most say "Thought others supported it," Pluralistic Ignorance is confirmed.

  **Unruled Out Leaf:** The tree cannot fully rule out **Leaf 8 (Cynical Compliance)** without the answer to Question 8. It is possible the teachers knew others disliked it but remained silent out of fear (Compliance) rather than misunderstanding (Ignorance). The private debrief suggests Ignorance ("most said they thought it was bad" implies surprise at others' silence), but only direct questioning about their *perception of others* confirms it.

  \answer{Pluralistic Ignorance}
