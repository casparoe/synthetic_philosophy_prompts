answer: |-
  **TO:** Faculty Senate
  **FROM:** Governance Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Stability Clause and Amendment Procedures

  **Introduction**

  The Senate currently faces a procedural deadlock stemming from last spring's adoption of the "Stability Clause." This clause altered Article V of our Governance Charter, raising the threshold for future amendments from a simple majority to a two-thirds supermajority plus a faculty referendum. Crucially, it attempted to lock itself in place using these same heightened requirements. We now have a live proposal to restructure the committee system supported by a clear majority of the Senate (36 of 61), yet it remains stalled because it cannot meet the Stability Clause's new thresholds.

  This memo addresses three questions: the legal status of the Stability Clause, the path forward for the committee restructuring proposal, and a standing meta-rule to prevent future procedural paradoxes. Our goal is to balance respect for past votes with the Senate's ongoing ability to govern.

  **Status of the Stability Clause**

  The Committee recommends treating the Stability Clause as **validly adopted but partially ineffective regarding self-entrenchment.**

  When the Senate voted 21-13 to adopt the Clause, it followed the rules in force at the time (Article V). Therefore, the new thresholds (two-thirds vote plus referendum) are valid law. However, the Clause also declared that *it* could not be amended except by those new thresholds. This creates a logical contradiction. The original Article V explicitly stated that "nothing is entrenched." A rule cannot use the authority granted by a Charter to destroy the Charter's own foundational premise—that the Senate can change its mind by majority vote.

  Think of it like a check. You can write a check to transfer money, but you cannot write a check that forbids the bank from ever processing another check. The original Charter gave the Senate the power to amend rules by majority. It did not give the Senate the power to remove that power permanently. Therefore, while the higher threshold for *other* amendments stands, the lock preventing us from reverting to the original majority rule is void. We may amend Article V back to its original state using the original majority procedure.

  **Implications for the Live Proposal**

  This distinction resolves the immediate gridlock. The committee restructuring proposal currently holds 36 votes. Under the Stability Clause's supermajority requirement (41 votes), it fails. Under the original Article V rules (majority of those present), it passes.

  Because the self-entrenchment lock is void, the Senate is authorized to vote on a motion to restore Article V to its original text using a simple majority vote. Once Article V is restored, the committee restructuring proposal can proceed under the standard majority rule. We do not need to resort to the "successor document" workaround (dissolving the Charter entirely). That workaround is legally safer but politically drastic; it implies our current Charter is broken beyond repair. Restoring Article V via majority vote acknowledges the validity of the Spring vote while correcting its overreach.

  **A Standing Meta-Rule for Amendments**

  To prevent recurrence, the Committee proposes adopting a meta-rule governing future changes to amendment procedures. We recommend an **asymmetric threshold** based on the type of change proposed.

  1.  **Loosening vs. Tightening:** It should be easier to loosen a restriction than to tighten one. Restoring majority rule should require only a majority. Imposing a supermajority should require a supermajority. This prevents a temporary majority from permanently shackling future Senates.
  2.  **Numbers vs. Voters:** There is a categorical difference between changing a *number* (e.g., 50% to 67%) and changing *who votes* (e.g., adding a faculty referendum). Changing the count adjusts the intensity of consensus required within this body. Changing the voters alters the sovereignty of the Senate itself. Therefore, amendments that add external veto players (like a faculty referendum) should require a higher threshold than those that merely adjust internal vote counts.

  This distinction holds up because it protects the Senate's agency. Adjusting a percentage acknowledges that some decisions need more consensus. Adding a referendum admits that this body no longer has the final say. The latter is a structural transformation of our governance and deserves a higher bar than the former.

  **The Case Against This Recommendation**

  The strongest argument against this recommendation rests on **reliance and institutional trust.**

  Senators who voted for the Stability Clause did so in good faith, expecting that raising the bar would protect governance from transient majorities. They relied on the text they passed. By declaring part of that vote "void," we risk teaching the faculty that our votes are conditional. If we can surgically invalidate the self-entrenchment provision while keeping the rest, what stops a future majority from declaring other inconvenient provisions void?

  Critics will argue that the "successor document" workaround is superior precisely because it is honest. If we want to bypass the Stability Clause, we should admit we are breaking the old rules to make new ones, rather than engaging in legalistic parsing about "void locks." Dissolving the Charter and adopting a successor document by majority vote is transparent. It acknowledges that the old contract is over and a new one begins. Our recommendation attempts to have it both ways: respecting the old Charter while ignoring its strictures. This risks appearing like a loophole rather than a principle.

  Furthermore, stability is itself a value. The Stability Clause was a reaction to perceived volatility. By making it easy to revert to majority rule, we prioritize flexibility over durability. A governance structure that changes too easily loses its authority. The opposition would argue that if the Committee restructuring proposal cannot secure 41 votes, it perhaps should not pass, regardless of procedural technicalities. Forcing it through by resetting the rules may solve the immediate problem but deepen the factional divide that created the Stability Clause in the first place.

  **Conclusion**

  The Committee believes that while stability is valuable, it cannot come at the cost of the Senate's ability to function. We recommend restoring Article V via majority vote, proceeding with the committee restructuring, and adopting the asymmetric meta-rule to safeguard future governance. We acknowledge the risk to institutional trust but believe that a Senate unable to amend its own rules by majority vote is a Senate that cannot govern.
