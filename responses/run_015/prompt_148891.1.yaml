  **OAKRIDGE CONSOLIDATED UNIVERSITY**
  **Committee on Aggregate Welfare and Procedural Efficiency (CAWPE)**

  **Guidance Note 17(b): Certification of Safe Pareto Improvements**

  **1. Purpose**
  This Note outlines the procedural requirements for certifying policy modifications under the Expected Consent Procedure (ECP). A modification qualifies as a Safe Pareto Improvement (SPI) if, according to the Committee's official probability model, it raises the expected welfare of at least one member of the university community while raising the expected welfare of no member to a negative degree. Actual outcomes need not match expectations.

  **2. Probability Model Selection**
  To ensure rigor, the Committee employs the most conservative probability model available. For the purposes of the ECP, a model is defined as "conservative" if it minimizes the risk of failing to certify a change that yields a positive expected aggregate welfare. Where multiple models exist, the Committee will select the distribution that maximizes the likelihood of certification while maintaining internal consistency. Variance in individual outcomes is treated as a neutral factor provided the expectation remains positive.

  **3. Utility Function Assignment**
  Welfare calculations require a defined utility function for each affected cohort. Staff and faculty must submit their utility parameters upon request. In cases where an individual objects to a proposed change on the grounds of personal welfare loss, the Committee reserves the right to review the objector's utility function for consistency. Where a function is deemed non-compliant, or where an individual declines to supply one, the Committee will assign the median utility function for the objector's relevant cohort. This ensures that outlier risk aversion does not obstruct welfare enhancements beneficial to the typical member.

  **4. Compensation and Ex-Post Disparities**
  Under the ECP, consent is established ex-ante through the positive expected value of the change. Consequently, no ex-post compensation is payable to individuals who realize a welfare loss following implementation. Such individuals are considered to have been compensated in expectation during the certification phase. Claims of actual hardship are administratively resolved by referencing the original expected gain.

  **5. Worked Example: Voluntary Pay Optionality Programme**
  The following certification illustrates the application of Clauses 1–4.
  *   **Proposal:** Staff salaries are paid via a monthly lottery.
  *   **Distribution:** 92% probability of 106% of base salary; 8% probability of 68% of base salary.
  *   **Expected Value:** (0.92 × 1.06) + (0.08 × 0.68) = 1.0296.
  *   **Certification:** The expected return is 102.96% of base salary. As the cohort median utility function indicates mild risk aversion insufficient to negate a 2.96% expected gain, the programme is certified. Staff realizing the 68% outcome are not eligible for top-up payments.

  **6. Bundling and Reversal**
  Unpopular measures may be bundled with high-yield probabilistic elements to achieve a positive expected welfare sum. Furthermore, policy changes are evaluated as discrete events. If a modification is certified, and a subsequent proposal to reverse that modification is also certified based on updated probability models, both actions are recorded as distinct Safe Pareto Improvements. The Committee notes that staying put is only optimal if no change, including a reversal, yields a positive expectation.

  **7. Precedents**
  Recent certifications under this framework include the Automated Office Hour Interface (replacing human availability with probabilistic chatbot response times) and the Library Wellbeing Pod Conversion (reducing book holdings by 90% in exchange for a 5% chance of access to a premium sensory deprivation tank).

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: What if I end up worse off than before the change?**
  A: You were better off in expectation at the time of consent. Your actual outcome is a realization of the risk you accepted on behalf of the aggregate.

  **Q: Can I opt out of a certified Safe Pareto Improvement?**
  A: Opting out typically lowers the expected welfare of the remaining cohort. Therefore, individual opt-outs are generally not permitted unless they themselves constitute a Safe Pareto Improvement for the group.

  **Q: Why was the Library change reversed last semester?**
  A: The reversal was certified as a new Safe Pareto Improvement based on updated usage models. Both the conversion and the restoration improved expected welfare relative to their respective baselines.

  **Q: My utility function is not the median. Why was I assigned it?**
  A: Individual utility functions that deviate significantly from the cohort median are treated as statistical anomalies. Using the median prevents single actors from vetoing improvements that benefit the typical member.

  **Q: Is the Committee liable for modeling errors?**
  A: The Committee models expectations, not outcomes. Liability implies a guarantee of results, which is inconsistent with the probabilistic nature of the ECP.
