answer: |-
  # Decision Tree: Moral Efficacy in Collective Harm

  **Root Node:** If a billion tons of CO2 melt a glacier, does each ton claim a distinct, assignable piece of the ice?
  *   **No:** → **Leaf 1**
  *   **Yes:** → **Node 2**

  ---

  **Node 2 (Harm Structure):** When you act, does your harm add invisibly to a total, trigger a specific limit, or decide a tie?
  *   **Adds invisibly (Climate):** → **Node 3**
  *   **Triggers a limit (Meat):** → **Node 4**
  *   **Decides a tie (Voting):** → **Node 5**

  ---

  **Node 3 (Continuous Obligation):** If your carbon drop changes the water level imperceptibly, is the flood still your fault?
  *   **No (Must change outcome):** → **Leaf 2**
  *   **Yes (Participation matters):** → **Leaf 3**

  **Node 4 (Threshold Obligation):** If your chicken purchase doesn't trigger a new order, did you violate a rule?
  *   **No (Must change outcome):** → **Leaf 4**
  *   **Yes (Status matters):** → **Leaf 5**

  **Node 5 (Pivotal Obligation):** If your vote isn't pivotal, did you neglect your office?
  *   **No (Must change outcome):** → **Leaf 6**
  *   **Yes (Status matters):** → **Leaf 7**

  ---

  ### Leaves

  **Leaf 1: The Incoherent Gap**
  *   **Position:** Unnamed (Diagnosed Gap).
  *   **Core Claim:** Denying decomposability while insisting on strict individual causal liability is logically incoherent.
  *   **Awkward Commitment:** This view makes it impossible to blame any single person for the Holocaust or climate change despite clear collective guilt.
  *   **Diagnosis:** **Incoherent**; it asserts individual responsibility while denying the causal structure required to assign it.

  **Leaf 2: Expected-Utility Aggregation**
  *   **Position:** Act-Consequentialist Acceptance.
  *   **Core Claim:** Tiny probabilities of huge harm sum to significant expected disvalue, requiring action even when impact is imperceptible.
  *   **Awkward Commitment:** You must treat driving to work as morally equivalent to shooting a gun if the statistical risk of death is identical.

  **Leaf 3: Practice-Based Solidarity**
  *   **Position:** Complicity/Integrity View.
  *   **Core Claim:** Participating in an unjust system is wrong because it corrupts the agent, regardless of causal impact.
  *   **Awkward Commitment:** This condemns those trapped in the system with no viable exit options as morally tainted.

  **Leaf 4: Probabilistic Pivotality**
  *   **Position:** Expected-Utility Threshold.
  *   **Core Claim:** You must act because there is a non-zero chance your purchase triggers the next bulk order.
  *   **Awkward Commitment:** It treats buying one egg as morally identical to buying a carton if the probability of triggering harm adjusts inversely.

  **Leaf 5: [EMPTY BRANCH]**
  *   **Position:** Unnamed (Threshold Role-Obligation).
  *   **Core Claim:** *No standard position exists linking role duties specifically to causal thresholds.*
  *   **Awkward Commitment:** *N/A.*
  *   **Diagnosis:** **Unattractive/Unexplored**; role duties usually apply to institutions (voting), while thresholds apply to markets (meat), making this combination conceptually mismatched.

  **Leaf 6: Act-Consequentialist Rejection**
  *   **Position:** Rational Choice Theory.
  *   **Core Claim:** If you aren't pivotal, you have no moral reason to vote because the world is identical without you.
  *   **Awkward Commitment:** This forces you to treat safe-district voting as purely symbolic and rationally optional.

  **Leaf 7: Role-Obligation**
  *   **Position:** Civic Republicanism.
  *   **Core Claim:** Citizens must vote as a duty of office to sustain the institution, regardless of efficacy.
  *   **Awkward Commitment:** This obliges voting for ignorant or malicious candidates if following the procedure is maintained.
