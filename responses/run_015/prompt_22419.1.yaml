  Elias found the envelope in his locker, tucked inside his calculus textbook. It contained a single slip of thermal paper, the kind from a receipt printer.

  **FINAL TALLY: SENIOR CLASS PRESIDENT**
  **JENKINS: 412**
  **DAVIS: 38**

  There was no date, no signature, just the numbers. Elias knew, with a cold certainty that bypassed skepticism, that this was perfect information. The numbers were fact, not prediction.

  He stood in the hallway, the noise of slamming lockers and shouting teenagers fading into a dull hum. He ran the calculation in his head. Before finding the note, his prior belief was that Jenkins would win with 95% probability. His preferred candidate was Jenkins. His optimal action was to vote for Jenkins.

  With the note, his belief updated to 100% probability. His preferred candidate remained Jenkins. His optimal action remained to vote for Jenkins.

  According to I.J. Good's theorem, the value of information is the difference in expected utility between acting with the information and acting without it. Since his action hadn't changed, the value of the slip was exactly zero. It was perfect knowledge that granted him no power, no advantage, and no leverage. It was just weight.

  He crumpled the paper, then smoothed it out again. He walked to the gymnasium, the voting booth set up beside the basketball hoops. He marked the box for Jenkins. He felt a strange hollowness in his chest, the sensation of performing a ritual that had already been completed elsewhere.

  He dropped the ballot into the sealed box. It should have made a rustling sound, a dry slap of paper against paper.

  It made no sound at all.

  Elias blinked and looked down at the floor. The fluorescent lights overhead were buzzing fiercely. He looked at his feet.

  He was standing in the light, but there was no shadow stretching out from his sneakers. He waved his hand in front of his face. No silhouette danced on the linoleum.

  He looked back at the ballot box. A small slot on the front, previously unseen, clicked open. A slip of thermal paper slid out. Elias picked it up. It was the same slip from his locker, but the ink was still wet.

  On the back, in his own handwriting, were the words: *Value = 0.*

  He looked up to tell someone, to show the null result, but the gym was empty. The basketball hoops were gone. The walls were white and seamless. He was still holding the ballot, but his hand was becoming translucent, fading like ink in the rain, dissolving into the zero sum he had just calculated.
