          *   Mention that relaxing "Proof" to "High Probability" (Logical Induction) dissolves the hard obstacle but introduces new risks (calibration, adversarial examples). This is contested.
      *   **Conclusion/Summary:** Reiterate the cost. You give up the dream of a formally verified chain of *increasingly strong* axioms. You keep the ability to run longer and search better.

