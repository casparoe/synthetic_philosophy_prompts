answer: |-
  Here is the specification you requested, drafted for immediate utility in your seminar preparation. I have kept the prose dense and the distinctions sharp, assuming familiarity with the standard formalisms (Bayesian networks, decision trees, etc.).

  ### Desiderata for a Theory of Rational Self-Binding

  **1. Dynamic Consistency (The Plan-Action Constraint)**
  *   **Motivating Case:** The standard multi-stage decision tree. An agent formulates a plan at $t_1$ to $\phi$ at $t_2$. Upon reaching $t_2$, with no new exogenous information, the agent must still find $\phi$ optimal according to the preference ordering held at $t_1$.
  *   **Constraint:** If a theory permits an agent to plan to bind themselves but recommends unbinding at the moment of execution (without new information), it licenses pragmatic self-defeat.
  *   **Negotiability:** **Non-negotiable** for sophisticated choice models; **Negotiable** for resolute choice models (McClennen/Bratman).

  **2. Causal Efficacy of Intentions (The Hitchhiker Constraint)**
  *   **Motivating Case:** *Parfit's Hitchhiker.* The driver simulates the agent's future behaviour. The agent's intention to pay at $t_2$ must causally influence the driver's decision at $t_1$ to provide the ride, despite the intention having no causal power over the payment itself at $t_2$ (once safe).
  *   **Constraint:** A theory must explain how a mental state at $t_1$ can secure a payoff at $t_3$ when the physical action at $t_2$ is causally disconnected from the benefit.
  *   **Negotiability:** **Non-negotiable** for any theory claiming to solve Hitchhiker without external enforcement.

  **3. Credibility without Waste (The Reverse Hitchhiker Constraint)**
  *   **Motivating Case:** *The Reverse Hitchhiker.* The driver demands proof of commitment. If the proof involves burning money or physical restraint *before* the ride, the agent is poorer. If the proof is cheap talk, it is ignored. The binding mechanism must be credible without consuming the surplus value the binding is meant to secure.
  *   **Constraint:** The cost of the binding mechanism ($C_b$) must be less than the gain from cooperation ($G_c$), yet $C_b$ must be high enough to make defection irrational. In one-off cases, finding a $C_b$ that satisfies this without external institutions is the hurdle.
  *   **Negotiability:** **Non-negotiable** for economic rationality; **Negotiable** if one accepts signalling costs as intrinsic to the definition of commitment.

  **4. Temporal Locality of Agency (The Midnight Clause)**
  *   **Motivating Case:** *The Midnight Clause.* Suppose the binding mechanism activates at $t_0$ (midnight, before the problem arises). If the binding is too remote from the decision point, does the agent at $t_2$ retain authorship? If the binding activates only at $t_2$, it is too late to influence the driver.
  *   **Constraint:** The theory must locate the 'binding' moment such that it influences the counterparty's prediction but does not reduce the agent to a mere conduit of past causality (preserving diachronic agency).
  *   **Negotiability:** **Camp Preference.** Functionalists (UDT/FDT) sacrifice this; Autonomy-focused philosophers (Velleman/Bratman) do not.

  **5. Independence from Correlation (The CDT Constraint)**
  *   **Motivating Case:** *Causal Decision Theory (CDT) Baseline.* Rationality should track causal influence, not mere evidential correlation. An agent should not bind themselves based on the news that binding brings, but on the outcome binding *causes*.
  *   **Constraint:** The binding mechanism cannot rely on 'magical' causation where the decision at $t_1$ logically entails the decision at $t_2$ without a causal chain (the problem of logical omniscience in UDT).
  *   **Negotiability:** **Camp Preference.** Essential for CDT proponents; rejected by EDT/UDT proponents.

  ---

  ### The Joint Unsatisfiability (The Trilemma)

  This is the core friction you are looking for. There is a subset of these desiderata that is jointly unsatisfiable in a one-off interaction without external enforcement mechanisms.

  **The Inconsistent Triad:**
  1.  **CDT Rationality:** Actions are evaluated solely by their causal consequences at the time of action.
  2.  **Dynamic Consistency:** The plan made at $t_1$ remains optimal at $t_2$ without new information.
  3.  **Hitchhiker Success:** The agent secures the ride and pays (or binds to pay) in a one-off scenario.

  **Analysis:**
  *   If you hold **(1) and (2)**: At $t_2$ (safe in the city), paying has no causal benefit. A CDT agent will not pay. A dynamically consistent agent would not have planned to pay at $t_1$. The driver predicts this. **Result:** No ride (Failure of 3).
  *   If you hold **(1) and (3)**: You must introduce an external enforcement mechanism (a contract) that changes the causal payoffs at $t_2$. **Result:** Violates the 'One-Off/No External Enforcement' implicit in the pure Hitchhiker thought experiment, or requires 'Costly Signalling' which violates Efficiency (Desideratum 3).
  *   If you hold **(2) and (3)**: You must adopt a non-CDT framework (e.g., UDT or Resolute Choice) where the decision at $t_1$ logically constrains $t_2$ regardless of causal isolation. **Result:** Violates CDT Rationality (1) and potentially Temporal Locality of Agency (4), as the agent at $t_2$ is bound by the algorithm of $t_1$.

  **Conclusion:** You cannot have CDT, Dynamic Consistency, and Successful One-Off Binding simultaneously. Standard CDT sacrifices (3). Resolute Choice sacrifices (1). UDT sacrifices (1) and arguably (4).

  ---

  ### Analysis of Standard Views

  **1. The Standard Causal-Decision-Theoretic Dismissal**
  *   **Verdict:** Fails **Causal Efficacy of Intentions** and **Hitchhiker Success**.
  *   **Analysis:** CDT treats the intention at $t_1$ as cheap talk because it lacks causal leverage over the action at $t_2$. Since the action at $t_2$ (paying) is causally dominated (you are already safe), CDT mandates defection. Because CDT is dynamically consistent (it re-evaluates at every node), it predicts its own defection at $t_1$. Consequently, the driver predicts defection.
  *   **Missed Desiderata:** It satisfies *Independence from Correlation* and *Dynamic Consistency* but fails to deliver the cooperative payoff. It essentially argues that rational agents *cannot* be hitchhikers in one-off cases.

  **2. Rational Precommitment as Costly Signalling**
  *   **Verdict:** Fails **Credibility without Waste** and **Temporal Locality of Agency**.
  *   **Analysis:** This view suggests the agent burns money or signs a contract at $t_1$ to prove commitment. While this secures the ride, the cost of the signal reduces the net utility. In the limit, if the signal must be perfectly credible, the cost approaches the value of the defection, eroding the gain. Furthermore, it externalises the binding (making it a contract rather than self-binding).
  *   **Missed Desiderata:** It satisfies *Hitchhiker Success* but violates the efficiency constraint (Desideratum 3) and often relies on external enforcement, sidestepping the philosophical problem of *self*-binding.

  ---

  ### Settled vs. Contested

  **Settled:**
  *   There is agreement that standard CDT fails Parfit's Hitchhiker.
  *   There is agreement that Dynamic Consistency is violated by naive agents who plan to cooperate but defect later.
  *   There is agreement that external enforcement (contracts) solves the practical problem but dissolves the philosophical puzzle of *rational* self-binding.

  **Contested:**
  *   **The status of Intentions:** Whether an intention can be a reason for action without a causal mechanism (the debate between Bratman's planning theory and Velleman's autonomy).
  *   **Updatelessness:** Whether rational agents should ignore new information (their own location in the decision tree) to maintain consistency (UDT vs. CDT/EDT).
  *   **Resolute Choice:** Whether it is rational to stick to a past plan *because* it was the past plan, even if current preferences dictate otherwise (McClennen vs. Goldbach).
  *   **Agency:** Whether a solution that treats the agent as a logical output function (FDT/UDT) preserves the notion of 'agency' required for moral responsibility.

  ---

  ### Summary Table

  | Requirement | Motivating Case or Constraint | Negotiable? | Status |
  | :--- | :--- | :--- | :--- |
  | **Dynamic Consistency** | Multi-stage decision trees; avoiding pragmatic self-defeat. | **Maybe** (Rejected by Resolute Choice proponents). | **Contested** (Sophisticated vs. Resolute). |
  | **Causal Efficacy of Intentions** | *Parfit's Hitchhiker*; intention must influence prediction. | **No** (Essential for the problem to exist). | **Settled** (CDT denies this is possible). |
  | **Credibility without Waste** | *Reverse Hitchhiker*; binding cost < cooperation gain. | **Yes** (Signalling theorists accept waste). | **Contested** (Efficiency vs. Credibility). |
  | **Temporal Locality of Agency** | *Midnight Clause*; authorship must remain with current self. | **Yes** (Functionalists sacrifice this). | **Contested** (Philosophy of Action vs. Decision Theory). |
  | **Independence from Correlation** | *CDT Baseline*; no 'magical' causation via logical correlation. | **Yes** (EDT/UDT reject this). | **Contested** (The core CDT vs. EDT/UDT divide). |
  | **One-Off Feasibility** | No reputation, no repeated games, no external contracts. | **No** (Defines the scope of inquiry). | **Settled** (Definitional constraint). |
