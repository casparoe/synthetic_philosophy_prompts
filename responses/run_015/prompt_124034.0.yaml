answer: |-
  **Project Title:** The Coherence of the Franchise: Normative Tensions in Electoral Reform Bundles

  **Research Question**
  Are the normative justifications for the three most common franchise reforms—compulsory voting, lowering the voting age, and extending voting rights to non-citizens—logically compatible, or does the standard political bundle rely on contradictory premises about the nature of the vote?

  Specifically: If the vote is a **duty** owed to the polity (the standard defense of compulsion), can it simultaneously be a **protection** owed to the individual against coercion (the standard defense of franchise expansion)? This project seeks a determinate answer to whether a consistent electoral code can be drafted that supports the full "progressive" reform package, or if drafters must choose between coherent but narrower platforms (e.g., compulsion with a restricted franchise, or voluntary voting with universal stakeholder suffrage).

  **Why Existing Positions Leave This Open**
  Current scholarship and advocacy treat these reforms in silos. Compulsory voting is evaluated on turnout and civic engagement; franchise expansion is evaluated on rights, representation, and developmental capacity. Where the literatures intersect, they focus on empirical outcomes (does expansion lower turnout?) or abstract boundary problems (who is "affected" by a decision?).

  This leaves a gap for the policy drafter. No existing framework assesses the *normative consistency* of the reform package as a whole. Political actors bundle these reforms for coalition-building, not philosophical coherence. Consequently, a city charter drafter or election commissioner has no tool to determine if adopting one reform undermines the justificatory basis of another. The question remains open because the debate is currently stuck between empirical metrics (turnout) and abstract theory (the boundary problem), lacking a mid-level conceptual analysis of how specific justifications map onto specific legal mechanisms.

  **Methodology**
  This is a conceptual project, not an empirical one. I will not conduct survey work or statistical analysis of turnout. Instead, I will employ a method of **diagnostic stress-testing** drawn from analytic political philosophy.

  I will construct a matrix of justifications (Duty/Civic Obligation vs. Stake/Protection from Coercion) and test them against three specific intersectional cases that current siloed approaches struggle to adjudicate consistently:
  1.  **The Adolescent Resident:** A 16-year-old permanent resident (lived in city since age 3, works part-time, eligible for naturalization at 18). Does the "stake" argument compel enfranchisement while the "duty" argument compels voting? If she lacks full legal status, does the duty apply?
  2.  **The Conscientious Objector:** A middle-aged citizen who accepts the state's authority but claims a moral objection to voting, preferring to pay the fine. If the vote is a protection, can it be compelled? If it is a duty, is a fine a sufficient penalty or does it commodify citizenship?
  3.  **The Undocumented Parent:** A long-term resident with no legal status whose children are citizens. If the vote protects against coercion, their stake is high. If the vote requires membership reciprocity, their claim is null.

  By forcing each justification to yield a verdict on these cases, I will identify where the logic breaks or contradicts itself when applied to a unified code.

  **Deliverables**
  1.  **Working Paper (Policy Audience):** *A Compatibility Map for Electoral Drafters.* This will be a decision matrix table. Rows will list standard justifications (Duty, Stake, Competence, Membership); columns will list reforms (Compulsion, Age Lowering, Non-Citizen Voting). Cells will indicate "Compatible," "Incompatible," or "Requires Modification." This allows a drafter to select a normative goal and immediately see which legal levers are available without contradicting that goal.
  2.  **Feature Article (General Audience):** A narrative exploration of the "Unstable Bundle." This will avoid the standard "turnout decline" story. Instead, it will frame the tension as a crisis of civic language: why advocates are using conflicting definitions of democracy to push for the same ballot measures, and what happens when those contradictions surface in court or implementation.

  **Conditions of Failure**
  I commit to an honest accounting of negative results. The project will be considered a failure if:
  1.  **Complementarity:** The stress tests reveal that Duty and Stake framings are actually complementary rather than rivalrous (e.g., if a robust theory of duty *requires* universal stakeholding).
  2.  **Status Quo Reproduction:** The Compatibility Map merely reproduces existing political alliances (e.g., "Liberals support A, B, and C") without offering a normative reason to decouple them.
  3.  **The Competence Collapse:** The analysis reveals that "competence" is the only variable that matters, rendering the Duty/Stake distinction decorative.
  4.  **Boundary Inflation:** The "Stake" justification inevitably expands to include future generations, prisoners, or corporations, making it useless for drafting finite electoral codes, and I fail to find a principled stopping point.

  **Scope and Limitations**
  This is a nine-month, single-researcher project. It cannot produce a comprehensive legal history of franchise law, nor can it model the empirical downstream effects of these reforms on policy outcomes.
  *   **What will be cut:** I will not analyze the impact of these reforms on party competition or legislative output. I will not attempt to solve the general "boundary problem" of democracy, only its specific instantiation in these three reforms.
  *   **Non-Specialist Constraint:** As a journalist, I am not constructing a new normative theory from first principles. I am analyzing the coherence of *existing* public reasoning used by advocates and legislators. If the project requires deep meta-ethical groundwork to proceed, I will pivot to cataloging the inconsistency rather than resolving it.

  The primary risk is that the "Compatibility Map" is too abstract for practitioners. To mitigate this, I will validate the Working Paper's structure with two election law attorneys during the drafting phase to ensure the categories match the decisions they actually face.
