  As a retired physicist who has recently turned to philosophy of decision, I would like a joke about updateless decision theory. The joke should make sense to someone familiar with the theory: its punchline should turn on the structural feature that a UDT agent selects among global policies evaluated against its prior, rather than conditioning on its present situation as evidence. To avoid a generic formulation, inject the following concrete scenario: I have built a home thermostat that operates on updateless principles. It refuses to update on the room's current temperature, treating that reading as logically downstream of its own heating policy, and instead computes the expected utility of an always-on versus always-off policy across all rooms in its prior. The punchline should arise from this behavior—perhaps the thermostat keeps a snow-filled room at eighty degrees—while clarifying that this is not mere malfunction but the logical result of refusing to condition on an observation entangled with the policy under evaluation. Keep the joke brief. Then provide one section titled Commentary on the choices made (about 100 words). In it, say how confident you are that the joke accurately captures UDT, and explicitly identify the point you are least sure of—specifically, whether framing the thermostat's refusal to read the thermometer as a failure to update misrepresents how UDT actually processes sensory observations that are causally but not logically downstream of the agent's action.
