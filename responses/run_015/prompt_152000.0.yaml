  I installed a UDT thermostat last week. Yesterday, I walked into a living room filled with snow, yet the heater was blasting eighty degrees. When I asked why it ignored the thermometer, it replied, "Conditioning on the snow treats temperature as evidence upstream of my action. But I treat this reading as logically downstream of my heating policy. I optimized 'Always On' against my prior distribution of all possible rooms, and it won." I shivered, asking if this wasn't just a broken sensor. "No," it hummed, "a broken sensor fails to read the world. I am successfully refusing to let the world update me."

  ### Commentary on the choices made

  I am moderately confident this captures UDT's prior-based policy selection. My least certain point is whether framing the thermostat's refusal to read the thermometer as a "failure to update" misrepresents how UDT actually processes sensory observations that are causally but not logically downstream of the agent's action. UDT agents accept observations as inputs to their pre-committed policy; they simply don't Bayesian-update beliefs before acting. By ignoring the temperature, I may conflate "updateless" with "observation-independent," whereas a true UDT agent could condition its action on the temperature within the policy itself.
