answer: |-
  ### The Framework: Democratic Pre-commitment and Retroactive Release

  To analyze Argentina's transition, we must treat the 1983 return to democracy not just as a political event, but as a **contractual binding**. 

  **Democratic Pre-commitment:** A new regime binds itself to specific rules (trials, truth commissions) to signal a break from the past and establish the rule of law. This is a "Ulysses Pact": tying hands to prevent future authoritarian drift and gain legitimacy.
  **Retroactive Release:** When the costs of maintaining that bond threaten regime survival, the democracy utilizes legal mechanisms (amnesties, pardons) to dissolve the commitment.

  The central tension is **Time Inconsistency**: At $T_0$ (transition), the optimal strategy is maximal justice to establish legitimacy. At $T_1$ (consolidation), the optimal strategy may shift to appeasement to prevent military rebellion. The framework predicts that if the pre-commitment device is weak (statutory rather than constitutional), a rational actor will choose release when the threat of a coup exceeds the cost of lost legitimacy.

  ---

  ### Phase 1: The Bind (1983–1985)
  **The Trial of the Juntas**

  **Actors and Payoffs:**
  *   **Raúl Alfonsín (Executive):** 
      *   *Goal:* Subordinate the military to civilian power; distinguish UCR from Peronists (who were ambiguous on amnesty).
      *   *Payoff:* High domestic/international legitimacy if trials proceed; High risk of coup if pushed too far.
      *   *Strategy:* Repeal the military's self-amnesty (*Ley de Autoamnistía*), create CONADEP (Truth Commission), and prosecute the Junta leaders.
  *   **Military High Command:** 
      *   *Goal:* Corporate survival, avoidance of criminal liability.
      *   *Payoff:* Negative utility from prosecutions (prison, dishonor); Positive utility from institutional immunity.
      *   *Threat Capability:* Low initially (defeated after Falklands), but latent.
  *   **Human Rights Groups (Madres/Abuelas):** 
      *   *Goal:* Truth and Justice (*Verdad y Justicia*).
      *   *Payoff:* Moral closure; no utility from compromise.
  *   **The Courts:** 
      *   *Goal:* Apply penal code.
      *   *Constraint:* Fear of military backlash; limited capacity.

  **Framework Prediction:**
  Alfonsín creates a pre-commitment device (the trial) to lock in democratic norms. The model predicts this should stabilize the regime by signaling that "the rules have changed." However, because the commitment is statutory (subject to legislative change) rather than constitutional, it remains vulnerable to *retroactive release* if the military's threat capability rises.

  **Reality:**
  The Trial of the Juntas (1985) succeeded legally but raised the military's anxiety. The pre-commitment worked to establish legitimacy but failed to neutralize the military's capacity for disruption. The "bond" was created, but the cost of maintaining it began to spike.

  ---

  ### Phase 2: The Release (1986–1987)
  **Punto Final and Obediencia Debida**

  **The Shift in Payoffs:**
  By 1986, the military's internal dynamics shifted. Hardline factions (*Carapintadas*) led by Aldo Rico began organizing uprisings. The cost of the pre-commitment (trials) now included the imminent risk of democratic collapse.

  *   **Alfonsín's Revised Payoff:** 
      *   *Option A (Hold Line):* Maintain trials. Payoff: High legitimacy, High probability of Coup.
      *   *Option B (Release):* Pass amnesty laws. Payoff: Lower legitimacy, Low probability of Coup.
      *   *Rational Choice:* A survival-oriented democrat chooses Option B.
  *   **The Mechanism of Release:** 
      *   *Ley de Punto Final (1986):* Set a 60-day deadline for new indictments. This wasn't an amnesty but a procedural chokehold.
      *   *Ley de Obediencia Debida (1987):* Presumed lower-ranking officers acted under duress. This legally dissolved the bond for 90% of perpetrators.

  **Framework Prediction:**
  The model predicts this reversal perfectly. A rational actor facing an existential threat will prioritize regime survival over consistent rule application. The pre-commitment was revealed to be "cheap talk" in the face of armed coercion. The theory suggests Alfonsín's reversal is a rational calculation of the *survival function*.

  **Where the Model Strains (Alfonsín's Reversal):**
  The standard framework treats Alfonsín's reversal as a failure of commitment or pure weakness. This is insufficient. Alfonsín framed the release not as surrender, but as a **re-balancing of the democratic contract**. 
  *   **The "Two Demons" Theory (*Teoría de los dos demonios*):** Alfonsín argued democracy required punishing *both* state terrorism and guerrilla violence. By limiting the trials, he claimed to be preventing military vengeance against the left, thereby protecting the *whole* of democracy, not just the rule of law.
  *   **Blind Spot:** The pre-commitment model assumes the goal is *Justice*. Alfonsín's goal was *Order*. The "Release" wasn't a break in logic; it was a shift in the hierarchy of democratic goods. The model fails to capture that "Democracy" was a variable, not a constant, in Alfonsín's utility function.

  ---

  ### Phase 3: The Permanent Dissolution (1989–1990)
  **Menem's Pardons**

  **Context:**
  Carlos Menem (Peronist) inherits a hyperinflationary crisis and social exhaustion. He issues pardons to the Junta leaders and the *Carapintadas* rebels.

  **Framework Prediction:**
  If the pre-commitment was already weakened by Alfonsín, Menem's pardons should trigger a legitimacy crisis. The model predicts backlash because the "rule of law" signal is fully inverted.

  **Reality:**
  The backlash was muted. Why?
  1.  **Preference Transformation:** The framework assumes voter preferences (Justice > Stability) are static. They were not. By 1989, hyperinflation (5,000%+) shifted the public utility function. The payoff for *economic stability* vastly outweighed the payoff for *retributive justice*.
  2.  **The "Fatigue" Factor:** The pre-commitment model ignores **psychological costs**. Society had absorbed the trauma of the trials and the uprisings. The marginal utility of further justice had diminished relative to the marginal utility of peace.

  **Blind Spot:**
  The model cannot explain why the *legal* dissolution of the bond did not lead to *social* collapse. It treats the "bond" as purely institutional. It misses that the public had effectively consented to the "Release" in exchange for economic order. Menem didn't break a social contract; he renegotiated one the public was tired of upholding.

  ---

  ### The Critical Blind Spot: The Madres and the Social Bond

  The most significant failure of the Pre-commitment/Release framework is its inability to account for **non-state actors who operate outside rational utility calculations.**

  **The Madres de Plaza de Mayo:**
  *   **Standard Model View:** They are interest groups. If the cost of protest (repression) rises, they should demobilize. If the government releases the bond (amnesty), they should accept the new equilibrium.
  *   **Reality:** The Madres did not accept the "Release." They maintained the pre-commitment socially, even when it was dissolved legally.
  *   **Payoff Structure:** Their utility was not based on political power or survival, but on **moral memory**. The framework assumes actors seek to maximize future benefits. The Madres sought to maximize *truth about the past*, a good that does not depreciate with time or threat.

  **Why this breaks the model:**
  The Pre-commitment/Release framework assumes that once the legal bond is cut (1987/1990), the episode is closed until a new political cycle. It predicts a "settled" authoritarian equilibrium.
  *   **The Prediction Failure:** The model could not predict the **Kirchner reversal (2003-2005)**. Because the Madres kept the *social* pre-commitment alive (through escraches, memory sites, international litigation), the "Release" was never socially legitimate, only legally valid.
  *   **The Mechanism:** When the economic crisis of 2001 shattered Menem's side of the bargain (stability), the latent demand for the original pre-commitment (justice) re-emerged. The Supreme Court struck down the laws in 2005 (*Simón* case).
  *   **Theory Silence:** The framework treats transitional justice as an **elite pact** (Alfonsín vs. Military). It is silent on how **grassroots moral entrepreneurs** can keep a "dead" legal commitment alive for 20 years, waiting for the payoff structure to shift again.

  ### Conclusion: Testing the Theory

  The Pre-commitment/Release framework successfully explains the **mechanics** of the 1980s oscillation:
  1.  **Alfonsín bound the state** to gain legitimacy.
  2.  **Alfonsín released the bond** to ensure survival (rational response to *Carapintadas*).
  3.  **Menem cemented the release** because the public traded justice for stability.

  However, the framework fails as a **predictive model of long-term justice** because:
  1.  **It misreads Alfonsín:** It views his reversal as weakness, missing his strategic redefinition of democracy (Order + Justice).
  2.  **It assumes static preferences:** It could not anticipate that economic collapse (2001) would reset the public's willingness to pay the cost of justice.
  3.  **It ignores the "Moral Veto":** It cannot quantify the power of the *Madres*. In a rational choice model, the *Madres* should have been marginalized by 1987. Instead, they acted as a **custodian of the pre-commitment**, ensuring that the "Release" was always viewed as temporary and illegitimate.

  **Final Verdict:** The episode proves that while democracies can legally dissolve bonds of accountability, they cannot easily dissolve the **social expectation** of those bonds if moral actors maintain them. The framework explains the *law*, but it is silent on the *memory* that eventually overturned it.
