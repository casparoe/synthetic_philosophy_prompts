prompt: |-
  I sit on a four-person panel — two clinicians, a lay member, and a lawyer — that decides, roughly forty times a month and in about twenty minutes per case, whether a claimant's condition counts as a disease. We decide it for two purposes that we are required to answer with the same word: entitlement to publicly funded treatment, and entitlement to paid medical leave. Our written reasons go to the claimant and can be appealed to a tribunal, so they have to be intelligible to someone with no training in medicine or philosophy, and they have to be reasons we would give again next month for a similar case.

  Please write us a decision procedure we can actually run, built out of the debate about whether 'disease' is a descriptive or an evaluative concept: the biostatistical account (a disease is a statistically subnormal contribution of some part or mechanism, judged against a reference class, with no value judgement built in), the harmful-dysfunction account (a dysfunction plus a harm), and the normativist view (a disease is whatever we take to be medically bad or to warrant medical attention). Give us the questions in the order we should ask them, what counts as a sufficient answer to each, where we stop with a no, and where we must hand the question to someone else because it turns on values rather than facts — and say who that someone is. The procedure must also say what to do when the factual question has no available answer: no agreed reference class, no baseline data, or a trait spread smoothly across a population rather than falling into two clusters. And it should block the three moves we catch ourselves making: choosing the reference class so that the case comes out the way we want, treating the existence of an effective treatment as evidence that there is a disease, and treating 'this person is suffering' as sufficient on its own.

  Then run it on three claims. (a) A 34-year-old seeking funded treatment and leave for distractibility: she falls in the most distractible 12% of a smooth, unimodal distribution on a validated attention battery, the cut-off was set by a specialist society's vote rather than found in the data, and the trait predicts poor performance in an accounts job but good performance in a monitoring job. (b) A 68-year-old seeking funded correction for the loss of near focusing that almost everyone over 55 has: a real failure of a mechanism measured against a younger reference class, statistically normal within his own age cohort, cheaply and safely corrected. (c) A claimant seeking leave after a bereavement, with severe and prolonged incapacity, normal grief on any statistical view, no subnormal mechanism we can identify, and symptoms that respond to treatment — a case where I think she should get the leave. If the procedure returns a no on (c), say so plainly.

  Finish by stating what the procedure cannot do: which kinds of claim it will systematically leave undecided or get wrong, and which of its steps are judgement calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** A four-person panel (2 clinicians, 1 lay, 1 lawyer) deciding ~40 cases/month, 20 mins/case.
      *   **Task:** Decide if a condition counts as a "disease" for *two* purposes: funded treatment AND paid medical leave. (Crucial constraint: Same word/verdict for both).
      *   **Output Requirements:**
          *   A decision procedure based on philosophical debates (Biostatistical, Harmful-Dysfunction, Normativist).
          *   Ordered questions with stopping rules (Yes/No/Defer).
          *   Handling of factual uncertainty (no reference class, smooth distributions).
          *   Blocking specific biases (reference class shopping, treatment implies disease, suffering implies disease).
          *   Application to three specific cases (a, b, c).
          *   Reflection on limitations (what it can't do, where judgment hides).
      *   **Tone:** Practical, intelligible (for claimants), consistent (for precedent), honest about value judgments.

  2.  **Deconstruct the Philosophical Frameworks:**
      *   *Biostatistical Theory (BST) - Boorse:* Disease = statistical subnormal function relative to a reference class. Value-free.
          *   *Problem:* Reference class selection is tricky. Smooth distributions (no clear line). Aging (is presbyopia a disease?).
      *   *Harmful Dysfunction Analysis (HDA) - Wakefield:* Disease = Dysfunction (evolutionary design failure) + Harm (socially disvalued).
          *   *Problem:* "Dysfunction" is hard to prove without evolutionary history. "Harm" introduces values.
      *   *Normativism:* Disease = Whatever we decide is bad/needs treatment.
          *   *Problem:* Too subjective, risks inconsistency, medicalizes normal life.
      *   *Synthesis for a Panel:* We need a hybrid. Pure BST is too rigid for smooth distributions. Pure Normativism is too arbitrary for legal consistency. HDA offers a good middle ground but needs operationalizing.
      *   *Constraint Check:* The panel must decide *entitlement* based on the label "disease." This means the definition of disease *includes* the gatekeeping function. We can't separate "is it a disease?" from "do they get money?" entirely, but we must pretend the definition drives the entitlement, not vice versa, to maintain integrity.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* 20 minutes per case. Needs to be fast.
      *   *Structure:* Step-by-step questions.
      *   *Bias Blocking:*
          *   *Reference Class:* Must be pre-defined or based on biological similarity, not job requirements.
          *   *Treatment:* Cannot be used as proof of disease (reverse inference).
          *   *Suffering:* Necessary but not sufficient.
      *   *Factual Uncertainty:* Need a tie-breaker rule for smooth distributions (e.g., threshold based on functional impact, not just stats).
      *   *Value vs. Fact:* If the science is clear but the "harm" is debatable, who decides? The panel decides, but must acknowledge the value jump. Actually, the prompt asks to say *who* to hand it to if it turns on values. Since the panel *is* the decision maker for entitlement, handing it off might mean "refer to policy board" or "acknowledge this is a policy decision, not medical." Let's make it: If it's purely a value judgment about social priority, it exceeds the panel's medical/factual mandate and should be flagged for policy review, *but* since we must decide now, we treat the "Harm" prong as the value gate.
      *   *Refinement:* The prompt asks "where we must hand the question to someone else because it turns on values rather than facts." Since the panel *makes* the decision, handing it off implies a recognition that the *definition* of disease here is a policy choice, not a medical one. I will designate the "Legislature/Policy Maker" as the entity for pure value questions, but since the panel must rule, the procedure will force a "No" if the value judgment isn't codified in policy, to prevent judicial overreach. Or, more practically, the "Lawyer" on the panel represents the societal value constraint. Let's structure it so factual dysfunction is Panel, but "is this harm sufficient for public cost" is a Policy threshold.
      *   *Revised Strategy:* The procedure must allow the Panel to decide, but identify *where* they are making a value call. If the call is *purely* value (no dysfunction), they should arguably say No (conservative approach) or Defer to Policy. Given the "20 minutes" constraint, a "Defer to Policy" creates backlog. The prompt asks "who that someone is." I will identify the "Health Policy Authority" as the recipient of value-only questions, meaning the Panel should recommend denial if it relies solely on values not currently codified.

      *   *Step 1: Dysfunction (Fact).* Is there a mechanism failing to perform its natural function? (BST/HDA).
      *   *Step 2: Reference Class (Fact).* Are we comparing like with like? (Block bias).
      *   *Step 3: Harm (Value/Fact).* Does this cause significant impairment/suffering? (Block "suffering alone").
      *   *Step 4: Treatment Fallacy Check.* Are we saying it's a disease *because* we can treat it?
      *   *Step 5: Uncertainty Rule.* What if data is smooth/missing?

  4.  **Developing the Steps (Iterative refinement):**

      *   *Q1: Mechanism.* Is there a specific physiological/psychological mechanism operating below its species-typical design? (Filters out normal aging/social deviance).
      *   *Q2: Reference Class.* Is the comparison group fixed by biology (age/sex), not outcome? (Blocks shopping).
      *   *Q3: Harm.* Is there significant impairment in *major* life activities, not just specific jobs? (Blocks "accounts job" issue).
      *   *Q4: Treatment.* Is the treatment existence driving the diagnosis? (Block reverse inference).
      *   *Q5: Uncertainty.* If distribution is smooth, is the claimant in the extreme tail *and* suffering harm?

      *Wait, the prompt requires handling the "Value vs Fact" handoff.*
      If the question is "Is this bad enough to warrant public funds?" that is a value question. The Panel answers it, but the *procedure* must acknowledge that if there is no dysfunction, it's a value call.
      *Decision:* If Q1 (Dysfunction) is NO, but Q3 (Harm) is YES, it is a Value Question. Hand off to: **Health Policy Legislature**. (Panel recommendation: Deny as "Disease", note "Social Need").
      *Wait, Case (c) suggests the user thinks she should get leave.* If the procedure says No, I must say so plainly. This implies the procedure might conflict with moral intuition. That's a feature, not a bug, of a rigid procedure.

  5.  **Addressing the Three Bias Blocks:**
      1.  *Reference Class Shopping:* Rule: Reference class determined by age/sex/genetics *only*, not occupation or social context.
      2.  *Treatment implies Disease:* Rule: Treatment efficacy is irrelevant to Step 1 (Dysfunction).
      3.  *Suffering implies Disease:* Rule: Suffering is necessary for "Harm" but insufficient without "Dysfunction."

  6.  **Addressing Factual Uncertainty:**
      *   No reference class? Use the broadest biological class available.
      *   Smooth distribution? Use a functional threshold (e.g., bottom 5% *plus* incapacity), not a natural kind cut-off. Acknowledge this is a convention, not a discovery.

  7.  **Running the Cases:**

      *   *Case (a) Distractibility:*
          *   Mechanism: Attention system. Is it dysfunctional? It's a smooth distribution. 12% is not extreme.
          *   Reference Class: General population? Or accountants? (Block: Must be general/biological).
          *   Harm: Poor in accounts, good in monitoring. Harm is context-dependent.
          *   Verdict: Likely No. It's a trait, not a dysfunction, and harm is job-specific.
      *   *Case (b) Presbyopia (68yo):*
          *   Mechanism: Lens flexibility. Failing compared to youth.
          *   Reference Class: Age 68? If so, it's normal. If species-typical (young adult), it's dysfunction.
          *   BST usually uses age-specific. HDA might call aging a dysfunction of the *system* over time.
          *   Harm: Correctable.
          *   Verdict: Tricky. Usually considered "normal aging." Procedure should likely flag this as "Normal Aging" -> No Disease, even if treatable.
      *   *Case (c) Bereavement:*
          *   Mechanism: No subnormal mechanism. Grief is a normal response.
          *   Harm: Severe incapacity.
          *   Treatment: Responds to treatment.
          *   Verdict: Procedure will likely say NO (No dysfunction). User thinks she should get leave. I must state the Procedure says No.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the tension.
      *   **The Procedure:** Numbered steps, clear Yes/No/Defer paths.
      *   **Bias Guards:** Explicitly embedded.
      *   **Case Applications:** Clear verdicts.
      *   **Limitations:** Honest assessment of where the procedure fails or hides judgment.

  9.  **Self-Correction/Nuance Check:**
      *   *Constraint:* "Entitlement to publicly funded treatment AND paid medical leave." Same word. This is hard. Bereavement leave is often a social entitlement, not a "medical disease" entitlement. If we say "Not a Disease," she might not get *medical* leave, but might get *compassionate* leave. The prompt asks if the condition counts as a *disease*. I must stick to the definition of disease, not the morality of support.
      *   *Constraint:* "Who to hand the question to." If it's a value judgment (e.g., should we fund this social harm?), the Panel is the wrong body if they are supposed to be finding "Disease" (fact/nature). I will designate the **Policy Authority** as the recipient of pure value claims.
      *   *Constraint:* "20 minutes." The procedure can't be too long. 5-6 key questions max.
      *   *Constraint:* "Intelligible to layperson." Avoid jargon like "teleofunction." Use "natural design" or "intended function."

  10. **Final Polish of the Procedure:**
      *   Step 1: Dysfunction (Fact).
      *   Step 2: Reference Class (Fact - Guard against shopping).
      *   Step 3: Harm (Value/Fact - Guard against suffering alone).
      *   Step 4: Uncertainty (Smooth curves).
      *   Step 5: Treatment Check (Guard against reverse inference).
      *   *Decision Rule:* Dysfunction + Harm = Disease. Harm only = Policy Issue (Hand off). Dysfunction only = No Disease (No harm).

      *Wait, Case (c) instruction:* "If the procedure returns a no on (c), say so plainly." This implies I should not fudge the procedure to make (c) a Yes. I must be honest.

      *Case (b) nuance:* Presbyopia. BST says if it's universal in the age class, it's not a disease. HDA says it is a dysfunction of the design, even if universal. I need to pick a lane. BST is easier for administrative consistency. I will lean BST for the "Reference Class" step to ensure consistency.

      *Case (a) nuance:* 12% tail. Usually, disease cut-offs are 2-5%. 12% is high. Plus job specificity. This should be a No.

      *Let's write.*

      *(Self-Correction during drafting)*: Make sure the "Hand off" is clear. If the panel encounters a case that is Harmful but not Dysfunctional, they cannot declare it a Disease under this procedure. They must identify it as a "Social Need" and hand the *funding decision* to the Policy Authority, while recording the medical verdict as "Not a Disease."

      *(Refining the "Hand Off")*: The prompt asks "where we must hand the question to someone else because it turns on values rather than facts — and say who that someone is."
      Okay, so if the decision rests on *values* (e.g. "Is this bad enough to pay for?"), that is not a medical fact. The Panel decides "Disease." If "Disease" requires a value judgment not anchored in dysfunction, the Panel is overstepping.
      *Solution:* If Dysfunction is absent, but Harm is present, the question "Is this a Disease?" is a Value Question. Hand to: **The Legislature/Policy Board**. The Panel records "Not a Disease (Medical)" but flags "Social Entitlement Review."

      *Wait, one more check:* The prompt says "We decide it for two purposes... entitlement to publicly funded treatment, and entitlement to paid medical leave."
      If I say "Not a Disease," they don't get the leave (under this specific scheme).
      Okay, I will follow the logic strictly.

      *Final Plan:*
      1. Introduction.
      2. The Procedure (5 Steps).
      3. Bias Guards (integrated).
      4. Uncertainty Rules.
      5. Case Applications.
      6. Limitations/Reflection.

      *Tone:* Professional, procedural, slightly weary but rigorous.

      *Let's check the bias blocks again:*
      1. Reference class shopping -> Fixed by biology/age.
      2. Treatment implies disease -> Explicit exclusion step.
      3. Suffering implies disease -> Must have dysfunction first.

      *Let's check the Uncertainty:*
      Smooth distribution -> Use functional threshold + statistical tail (e.g. bottom 5%). If no data -> Precedent or Deny.

      *Let's check the Hand-off:*
      If Harm exists but Dysfunction does not -> Value judgment -> Hand to Policy Maker.

      *Ready to write.*
answer: |-
  # The Panel Decision Procedure for "Disease" Status

  **Purpose:** To determine consistently whether a claimant's condition qualifies as a "disease" for the dual purpose of publicly funded treatment and paid medical leave.
  **Constraint:** This procedure prioritizes consistency and intelligibility over moral nuance. It distinguishes between *medical facts* (which the Panel decides) and *social values* (which the Panel identifies but does not legislate).
  **Time Allocation:** 20 minutes per case.

  ---

  ## Part I: The Decision Algorithm

  Ask the following questions in order. If any step yields a **STOP**, the claim is denied as a "disease" (though it may be flagged for other support). If all steps are passed, the condition is a "disease."

  ### Step 1: The Dysfunction Check (Fact)
  **Question:** Is there a specific physiological or psychological mechanism failing to perform its natural, species-typical function?
  *   **Sufficient Answer:** Yes, if medical evidence identifies a breakdown in a specific system (e.g., insulin production, neural processing, lens flexibility) compared to how that system is designed to work.
  *   **Stop Condition:** **NO.** If the mechanism is working as designed (e.g., a healthy heart beating fast during panic, a healthy eye losing focus with age, a healthy mind grieving), stop. **Verdict: Not a Disease.**
  *   **Bias Block:** Do not infer dysfunction from the *availability of a treatment*. A treatment can improve a normal state (e.g., caffeine for fatigue) without the state being a disease.

  ### Step 2: The Reference Class Fix (Fact)
  **Question:** Is the claimant being compared to a reference class defined by **biology** (age, sex, genetics) rather than **outcome** (occupation, social role, performance)?
  *   **Sufficient Answer:** Yes, if the comparison group is "males aged 30–35" or "humans with intact optic nerves," not "accountants" or "people who need to focus."
  *   **Stop Condition:** **NO.** If the reference class was chosen to make the claimant look abnormal (e.g., comparing a 68-year-old's eyes to a 20-year-old's), stop. **Verdict: Not a Disease.**
  *   **Bias Block:** You may not select a reference class to achieve a desired funding outcome. Use the standard biological class for the trait.

  ### Step 3: The Uncertainty Rule (Fact/Convention)
  **Question:** If the data shows a smooth, unimodal distribution (no clear line between "normal" and "abnormal") or lacks baseline data, does the claimant fall in the extreme statistical tail **AND** suffer functional loss?
  *   **Sufficient Answer:** Yes, if the claimant is in the bottom 5% (or established clinical cut-off) *and* has broad functional impairment.
  *   **Stop Condition:** **NO.** If the trait is common (e.g., top 12%) or the impairment is situational (only affects one specific job type), stop. **Verdict: Not a Disease.**
  *   **Note:** In the absence of data, do not invent a cut-off. Default to **No Disease** to prevent scope creep.

  ### Step 4: The Harm Requirement (Value/Fact)
  **Question:** Does the dysfunction cause significant impairment in **major life activities** (self-care, broad work capacity, relationships), not merely disadvantage in a specific context?
  *   **Sufficient Answer:** Yes, if the impairment is pervasive and reduces overall capacity to function in society.
  *   **Stop Condition:** **NO.** If the claimant functions well in most contexts and is only impaired in a niche environment (e.g., fails as an accountant but succeeds as a monitor), stop. **Verdict: Not a Disease.**
  *   **Bias Block:** "Suffering" or "Distress" alone is insufficient. A healthy person can suffer (e.g., from heartbreak or poverty). There must be *incapacity* linked to the dysfunction.

  ### Step 5: The Value Hand-Off (Policy)
  **Question:** If Steps 1–4 are passed, is the remaining barrier to entitlement purely a question of resource allocation or social priority?
  *   **Sufficient Answer:** No. (If it is a disease, entitlement follows by rule).
  *   **Hand-Off Condition:** If Step 1 (Dysfunction) was **NO**, but Step 4 (Harm) was **YES** (e.g., severe grief, normal aging), the question "Should this be funded?" is a **Value Question**.
  *   **Action:** Do not classify as "Disease." Record as "Social Need." **Hand the funding decision to the Health Policy Legislature/Authority.** The Panel's medical verdict remains "Not a Disease."

  ---

  ## Part II: Application to Claims

  ### Case (a): The Distractible Accountant (34-year-old)
  1.  **Dysfunction:** Attention mechanism is intact; distribution is smooth/unimodal. No clear mechanism failure. **(Weak Yes/No)**
  2.  **Reference Class:** Cut-off set by society vote, not biology. Claimant is in the 12% tail, not extreme. **(No)**
  3.  **Uncertainty:** Trait is smooth. 12% is not an extreme tail. Impairment is job-specific (accounts vs. monitoring). **(No)**
  4.  **Harm:** Harm is contingent on the specific job, not major life activities generally. **(No)**
  *   **Verdict:** **NOT A DISEASE.**
  *   **Reasoning:** This is a trait mismatch, not a dysfunction. The distribution is smooth, and the harm is contextual. Funding this would medicalize normal population variance.

  ### Case (b): The Presbyopic Senior (68-year-old)
  1.  **Dysfunction:** Lens flexibility has failed compared to youthful design. **(Yes)**
  2.  **Reference Class:** Must be age-specific. Within the "68-year-old" class, this is statistically normal (almost everyone has it). **(No)**
  3.  **Uncertainty:** N/A (Data is clear).
  4.  **Harm:** Correctable, but the loss is universal to the age class.
  *   **Verdict:** **NOT A DISEASE.**
  *   **Reasoning:** Under the Biostatistical account, a condition universal to a reference class (age cohort) is not a disease; it is normal aging. While it is a dysfunction of the *species* design, it is not a dysfunction of the *age-class* design. Treatment does not make it a disease.

  ### Case (c): The Bereaved Claimant
  1.  **Dysfunction:** No subnormal mechanism identified. Grief is a normal, evolved response to loss. **(No)**
  2.  **Reference Class:** N/A (Mechanism is normal).
  3.  **Uncertainty:** N/A.
  4.  **Harm:** Severe and prolonged incapacity. **(Yes)**
  5.  **Value Hand-Off:** Dysfunction is No, Harm is Yes. This is a Value Question.
  *   **Verdict:** **NOT A DISEASE.**
  *   **Reasoning:** The procedure requires a mechanism failure. Grief is a healthy mechanism operating correctly, even if the outcome is painful and incapacitating.
  *   **Action:** Record "Not a Disease." Flag as "Social Need." **Hand off to Health Policy Legislature** for a decision on compassionate leave funding.
  *   **Note:** You stated you think she should get leave. The procedure agrees she may deserve support, but classifies that support as *social welfare*, not *medical entitlement*. To call this a "disease" would require medicalizing normal human emotion.

  ---

  ## Part III: Limitations and Reflections

  **What this procedure cannot do:**
  1.  **Resolve Moral Conflicts:** It will systematically deny support to people who are suffering greatly but lack a biological "breakdown" (like Case C). It prioritizes the integrity of the word "disease" over the moral urgency of need.
  2.  **Handle Rapidly Evolving Science:** Where "dysfunction" is debated (e.g., new psychiatric categories), the procedure forces a "No" due to the Uncertainty Rule. This protects against over-medicalization but risks under-treatment.
  3.  **Separate Fact from Value Completely:** Step 4 (Harm) inevitably contains a value judgment about what counts as "significant impairment."

  **Where judgment is dressed up as procedure:**
  1.  **The Reference Class Selection (Step 2):** Deciding whether "68-year-olds" or "humans" is the correct class for presbyopia is a philosophical choice, not a biological fact. We have chosen age-class to avoid labeling all aging as disease, but this is a policy preference hidden in a factual step.
  2.  **The Statistical Cut-Off (Step 3):** Choosing the bottom 5% (or similar) as the threshold for "abnormal" in a smooth distribution is arbitrary. It is a convention required for administration, not a discovery of nature.
  3.  **The "Major Life Activities" Standard (Step 4):** Deciding which impairments count as "major" is a social value judgment. We have disguised this as a factual assessment of capacity.

  **Final Instruction to Panel:**
  When you vote "No" on Case (c), you are not saying she deserves nothing. You are saying the *medical* system is the wrong tool for her problem. If you vote "Yes" to help her, you are not finding a disease; you are rewriting the social contract. Do not confuse the two.
