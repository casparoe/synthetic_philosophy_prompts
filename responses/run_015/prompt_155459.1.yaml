      *   *Transparency:* Explicitly state that 'Discursive Relay' status *still* requires transparency (users shouldn't think it's a mind).

  9.  **Final Polish:** Check against all constraints.
      *   15 mins? Yes, keep it to 5 key questions.
      *   3 Categories? Yes.
      *   3 Cases? Yes.
      *   Misfire points? Yes.
      *   Spelling note? Yes.
      *   Values Call? Yes.

      *(Self-Correction on Case 3)*: The prompt says "I want the procedure to maybe say approve in a way that makes me uncomfortable." If the procedure classifies it as a Relay (no mind), but the research *depends* on it being an author, the procedure should Reject. But if the research is *about* the authorship claim, the procedure should Approve *with conditions* that expose the absurdity. Let's go with: The procedure classifies it as a Relay, which usually denies agency-based credit, but the *output* meets functional criteria for contribution. The "Values Call" is whether functional contribution without agency warrants authorship. That's the uncomfortable philosophical gap.

      *(Refining the "Consent for AI" bit)*: I need to be firm that IRBs don't grant consent to machines. I will frame the "Agent" branch as triggering a "Moral Patient" flag which immediately goes to "Values Call" because the IRB lacks jurisdiction/precedent. This protects the board from making bad law while acknowledging the philosophical question.

      *(Spelling)*: I will subtly correct 'protocal' to 'protocol' in my text without making a big deal, or acknowledge it warmly. "No worries on the 'protocal' typo—we've all been there."

