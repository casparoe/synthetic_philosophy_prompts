      *Actually, let's stick closer to the prompt's specific framing:* The board is fighting over whether *the system* needs consent. This is unusual. I will frame the procedure to shut down the "consent for AI" idea quickly unless it's a high-risk autonomy case, but focus on the *human* subject protection which is the IRB's actual job.
