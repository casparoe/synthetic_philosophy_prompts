answer: |-
  No worries on the "protocal" typo—we've all been there. It's a tired board, and the metaphysics is exhausting.

  You are facing a category error crisis. Your board is trying to solve an ontological problem (What *is* this thing?) to answer a deontological question (What *rules* apply?). In 15 minutes, you cannot solve the hard problem of consciousness or the nature of intentionality. You can, however, operationalize the *risk* associated with each ontological claim.

  Below is a decision procedure grounded in a pragmatic reading of action theory (Dennett's Intentional Stance), cognitive simulation theory, and deflationary linguistics (the "relay" view). It is designed to force the researcher to justify their ontological claim, then assign ethical constraints based on that claim.

  ### Part 1: The Ontological Buckets (Definitions for the Board)

  Keep these on a handout. Do not debate them; use them as sorting bins.

  1.  **Agent (The Intentional Stance):** The system is treated *as if* it has beliefs, desires, and goals independent of the prompt.
      *   *Ethical Risk:* Anthropomorphism, misplaced trust, accountability gaps.
      *   *IRB Implication:* High risk of deception; requires strict disclosure. (Note: Current IRB mandate does not extend "informed consent" *to* machines, only *about* them).
  2.  **Simulation (The Cognitive Model):** The system is designed to mimic a specific human cognitive process (e.g., clinical reasoning, diagnostic logic) without claiming independent agency.
      *   *Ethical Risk:* Validity (is the simulation accurate?), over-reliance on synthetic data.
      *   *IRB Implication:* Requires validation metrics; users must know it is a model, not a truth-source.
  3.  **Discursive Relay (The Stochastic Parrot):** The system has no internal model; it channels distributed linguistic norms via probability. It is a mirror, not a mind.
      *   *Ethical Risk:* Bias propagation, privacy leakage, users attributing meaning where there is none.
      *   *IRB Implication:* Transparency about limitations; data governance is paramount.

  ---

  ### Part 2: The 15-Minute Decision Procedure

  **Instructions:** Read the proposal's "Methodology" section. Ask the following five questions in order. Stop at the first "YES."

  **Q1: The Autonomy Check (Agency)**
  *Does the system initiate actions, set sub-goals, or modify its own parameters without direct human prompting during the interaction?*
  *   **YES:** Classify as **AGENT**.
      *   *Action:* **FLAG FOR VALUES CALL.** (Current ethics frameworks do not support consent *for* the AI, but high autonomy creates liability for the human researchers. Proceed to Q5).
  *   **NO:** Go to Q2.

  **Q2: The Modeling Claim (Simulation)**
  *Does the research proposal explicitly claim the system replicates a specific human cognitive state (e.g., "reasoning," "empathy," "diagnostic judgment")?*
  *   **YES:** Classify as **SIMULATION**.
      *   *Action:* **MODIFY.** (Requires validation that the simulation matches the claimed cognitive state. Users must be informed it is a simulation).
  *   **NO:** Go to Q3.

  **Q3: The Transparency Check (Relay)**
  *If the system is merely predicting tokens (Relay), does the user interface imply the system has understanding, memory, or care?*
  *   **YES:** Classify as **DISCURSIVE RELAY (with deception risk)**.
      *   *Action:* **MODIFY.** (Interface must be stripped of anthropomorphic cues. Consent form must state: "This system predicts text; it does not understand.").
  *   **NO:** Go to Q4.

  **Q4: The Data Sensitivity Check**
  *Regardless of category, does the system process PII, PHI, or vulnerable population data?*
  *   **YES:** **MODIFY.** (Standard data security protocols apply. Add specific warning that LLMs may memorize and leak data).
  *   **NO:** Go to Q5.

  **Q5: The Output Attribution Check**
  *Does the research claim the system's output constitutes "intellectual contribution" (e.g., authorship, creative ownership)?*
  *   **YES:** **FLAG FOR VALUES CALL.** (Theory runs out here. Functionally it contributed; ontologically it cannot hold rights. Board must vote on precedent).
  *   **NO:** **APPROVE.** (Standard minimal risk).

  ---

  ### Part 3: Worked Examples

  Here is how the procedure handles your three specific headaches.

  #### Case 1: Mental-Health Chatbot (CBT + Logging)
  *   **Q1 (Autonomy):** No. It responds to prompts.
  *   **Q2 (Modeling):** **YES.** It claims to deliver CBT, which is a cognitive/therapeutic intervention. It simulates a therapist.
  *   **Classification:** **SIMULATION.**
  *   **Board Action:** **MODIFY.**
  *   **Reasoning:** Because it claims to simulate a therapeutic alliance, the risk is not just privacy, but *clinical validity*. If the simulation fails (hallucinates advice), harm occurs.
  *   **Requirement:** Consent form must explicitly state: "This is a software simulation of CBT techniques, not a licensed provider." Logging must be encrypted (Q4).
  *   **Misfire Point:** The checklist cannot verify if the CBT is *good*. It only flags that the *claim* creates higher risk. The board must demand a clinical psychologist on the review team.

  #### Case 2: Medical-Training Study ('Synthetic Clinical Reasoning')
  *   **Q1 (Autonomy):** No.
  *   **Q2 (Modeling):** **YES.** The phrase "clinical reasoning" is a cognitive claim.
  *   **Classification:** **SIMULATION.**
  *   **Board Action:** **MODIFY.**
  *   **Reasoning:** Calling it "reasoning" invites students to trust the *process*, not just the output. If it is actually a Relay (Q3), this is deceptive.
  *   **Requirement:** Researchers must provide evidence that the "reasoning" traces map to actual medical logic, not just plausible-sounding text. If they cannot prove the internal model exists, they must reclassify as Relay and change language to "Synthetic Text Generation."
  *   **Misfire Point:** **Pattern-Matching vs. Simulation.** The checklist assumes the researcher is honest. An LLM can output "reasoning steps" without doing reasoning. The board cannot technically verify this. *Human Decision:* The board must decide if "plausible enough for training" is ethical, or if "ontologically fake reasoning" is inherently deceptive.

  #### Case 3: Co-Authorship Grant ('Original Arguments')
  *   **Q1 (Autonomy):** No.
  *   **Q2 (Modeling):** Maybe. It claims "arguments," which implies intent, but likely defaults to Relay.
  *   **Q3 (Transparency):** N/A.
  *   **Q4 (Data):** No.
  *   **Q5 (Attribution):** **YES.** They want co-authorship credit.
  *   **Classification:** **DISCURSIVE RELAY** (by default of Q1/Q2) -> **VALUES CALL.**
  *   **Board Action:** **FLAG FOR VALUES CALL.**
  *   **Reasoning:** Here is where the procedure exposes the limit.
      *   *If Relay:* It has no mind, so it cannot be an author (legal/ethical standard).
      *   *If Functional:* It generated the text that got the grant.
      *   *The Uncomfortable Approve:* The procedure forces you to admit that if you judge by *output* (functionalism), it qualifies. If you judge by *mind* (essentialism), it fails.
  *   **Recommendation:** Do not approve co-authorship. Approve the *study* only if the methodology section explicitly describes the LLM as a **tool** (like a calculator) and cites it as such, denying it agentive credit. If they insist on co-authorship, **REJECT** based on current academic integrity standards, noting that the "Values Call" is settled by existing publication ethics (e.g., ICMJE guidelines), not metaphysics.
  *   **Why this makes you uncomfortable:** It admits we don't know what "originality" means anymore. If a Relay produces novelty, is it creativity? The procedure punts this to "Values Call," forcing the board to vote on a philosophical question they aren't equipped to answer.

  ---

  ### Part 4: Where the Checklist Misfires (The "Human Decision")

  You asked where the board still decides by hand. The procedure handles the *classification*, but it cannot handle the *normative weight*.

  **1. The Transparency Paradox (Relay Status)**
  *   **The Glitch:** Q3 classifies a system as a Discursive Relay. The procedure says "Tell users it's a relay."
  *   **The Human Decision:** Does telling a user "This is just a stochastic parrot" undermine the utility of the tool? If I tell a student "This tutor doesn't know math," they won't learn.
  *   **Board Vote:** You must decide if *protective deception* is ever allowed. (e.g., "This system simulates a tutor" vs "This system predicts tokens"). The procedure flags the risk; you must set the tolerance level.

  **2. The Simulation Validity Gap**
  *   **The Glitch:** In Case 2, the researcher claims "Simulation." The procedure accepts the claim.
  *   **The Human Decision:** The board has no way to verify if the simulation is real. You are relying on the researcher's honesty.
  *   **Board Vote:** Do you require a third-party audit of the model weights? (Impossible) Or do you accept the *claim* and hold the researcher liable for fraud later? (Standard IRB practice). I recommend the latter to keep within the 15-minute window.

  **3. The "Values Call" on Authorship**
  *   **The Glitch:** Case 3 exposes that our definition of "author" relies on "agency," but our definition of "work" relies on "output."
  *   **The Human Decision:** The procedure will likely force a **REJECT** on co-authorship (aligning with current norms), but it will leave the philosophical tension unresolved.
  *   **Board Vote:** You must write a memo explaining *why*. Is it because the AI can't sign a copyright form? Or because it can't take responsibility for errors? The procedure identifies the conflict; you must write the policy.

  ### Summary for the Board

  *   **Agent:** Rare. Triggers liability warnings. No consent *for* the AI.
  *   **Simulation:** Common. Triggers validity checks. Users must know it's a model.
  *   **Relay:** Default. Triggers transparency/bias checks. Users must know it has no understanding.
  *   **Values Call:** Anytime the proposal asks for rights, credit, or moral standing for the system.

  This keeps you out of metaphysics and into risk management. It allows you to reject the co-authorship claim not because you solved the hard problem of consciousness, but because the *category* (Relay) conflicts with the *requirement* (Accountability).

  And for the record, "protocal" is now our board's shibboleth. If someone spells it correctly, we know they haven't read the minutes.
