answer: |-
  This is a fantastic question, and your skepticism is well-placed. There is a lot of "physics envy" in philosophy where people grab a technical concept (like entropy, quantum indeterminacy, or complexity) and slap it onto ethics without doing the work to see if it actually changes the normative landscape.

  However, on this specific issue, your friend is onto something real, though it needs to be sharpened. The distinction between **"I don't have enough time"** (contingent resource scarcity) and **"This is computationally intractable"** (structural impossibility) *does* change the philosophical verdict.

  Here is the breakdown of why hardness is different from ordinary limits, followed by the TA example you requested, and finally, what this means for moral obligation.

  ### 1. Hardness vs. "Not Enough Time"
  Your intuition that hardness might just be "not enough time" is the standard objection. Usually, if I say, "I couldn't calculate the tip," you say, "Take more time."

  *   **Contingent Limit:** "I can't sort these 1,000 names in 1 second." Solution: Give me 10 seconds, or a faster computer. The problem scales politely (linearly or logarithmically).
  *   **Computational Hardness (NP-Hard):** "I can't find the optimal schedule for these 100 employees." Solution: Give me 100 years, or a computer the size of the galaxy. The problem scales *exponentially*. Adding one more employee might double the time required.

  **The Philosophical Bite:** If "Ought Implies Can" is true, you cannot be morally obligated to do the physically impossible. If finding the *optimal* solution requires more computational steps than there are atoms in the universe (which happens for many scheduling problems with modest inputs), then **perfect optimization is not just difficult; it is nonexistent in our physical reality.**

  This shifts the obligation from *Outcome* (find the best) to *Process* (use a reasonable heuristic).

  ### 2. The Example: The TA and the Project Groups

  Let's build your TA scenario.

  **The Setup:**
  You are a TA for a class of **30 students**. You need to make **10 groups of 3**.
  You want to be *perfectly fair*. You define "Fairness" as maximizing a Global Satisfaction Score based on these constraints:
  1.  **Preferences:** Each student submits a list of 2 people they want to work with and 2 they want to avoid.
  2.  **Skill Balance:** Each group must have at least one coder, one writer, and one designer (based on a pre-survey).
  3.  **Schedule:** All members of a group must share at least one free 2-hour block.
  4.  **Interdependency:** This is the kicker. Some constraints are conditional. (e.g., "Student A will only work with Student B if Student C is *not* in the group," or "If Student D is in Group 1, Student E must be in Group 2").

  **The Complexity:**
  *   **Checking (Easy/P):** If I hand you a completed list of 10 groups, you can verify in 5 minutes if everyone is happy, skills are balanced, and schedules match. You just run down the checklist.
  *   **Solving (Hard/NP-Hard):** Because of the *interdependent* constraints (Constraint 4), this is no longer a simple sorting task. It is structurally similar to the *3-Partition Problem* or *Constraint Satisfaction Problems*, which are NP-complete.
      *   With 30 students, the number of possible combinations is astronomical ($\approx 10^{20}$).
      *   If you add just 5 more students (35 total), the search space doesn't grow by a little; it explodes.
      *   To guarantee you found the *single fairest* arrangement, you would effectively need to check more combinations than a supercomputer could process in the lifetime of the sun.

  **The Normative Crisis:**
  *   **Traditional View:** The TA has a duty of fairness. Therefore, the TA ought to produce the arrangement that maximizes student welfare. If the TA produces a sub-optimal arrangement where two students hate each other, the TA has failed in their duty.
  *   **Complexity View:** The "maximally fair" arrangement **does not exist** as an actionable object. It is a mathematical abstraction that cannot be instantiated in spacetime.

  ### 3. Why This Changes the Verdict

  If you treat this as ordinary "not enough time," you blame the TA for not starting earlier or working harder. But if you accept the complexity limit, the blame assignment changes fundamentally.

  **1. The Death of Maximizing Consequentialism**
  A strict utilitarian might say, "You must maximize the good." But if calculating the maximum good is computationally forbidden by the laws of physics, then **maximizing consequentialism is an incoherent moral theory** for finite agents. You literally *cannot* do what the theory demands. The theory fails the "Can" test.

  **2. Shift to Procedural Justice**
  Since the TA cannot guarantee the *best outcome*, their obligation shifts to the *procedure*.
  *   **Wrong:** "I spent 40 hours trying to find the perfect match and finally just picked one." (Wasted resources on an impossible goal).
  *   **Wrong:** "I picked names out of a hat." (Negligent; ignored easy constraints).
  *   **Right:** "I used a known, transparent heuristic (like a stable matching algorithm) that guarantees *no* students are paired with their 'avoid' list, even if it doesn't maximize 'want' lists."

  The TA is now morally protected not by the *quality* of the result, but by the *rationality of the method*.

  **3. "Ought Implies Can" gets a Complexity Clause**
  Your friend is right. The principle should be updated: **"Ought Implies Computably Can."**
  If a moral obligation requires solving an intractable problem to verify or execute, the obligation dissolves.
  *   *Example:* If a doctor is obligated to diagnose a rare disease, but the genetic sequencing required to be *certain* takes 100 years of compute time, they are not negligent for missing the diagnosis. They are only obligated to run the *feasible* tests.

  ### 4. What Should the Agent Do? (The "Instead")

  In the TA case, recognizing the hardness changes the job description:

  1.  **Abandon Optimality:** Accept that "Perfect Fairness" is a myth. Aim for "Envy-Freeness" (no student prefers another group over theirs) which is often easier to satisfy than "Maximum Utility."
  2.  **Transparency:** Tell the students: "Finding the perfect match is mathematically impossible. I am using Algorithm X, which guarantees basic constraints are met." This manages expectations and prevents blame for sub-optimal outcomes.
  3.  **Iterative Correction:** Instead of front-loading the computation, allow a trading period. Let students swap groups if they find a local improvement. This offloads the computation to the distributed agents (the students) who have local information.

  ### 5. Is Your Skepticism Valid?

  Yes, partially. Here is where the "hype" warning applies:

  *   **Small Numbers:** For 30 students, modern solvers (like SAT solvers) might actually *find* the optimum quickly depending on the specific constraints. Complexity theory deals with asymptotic limits ($N \to \infty$). In everyday life, $N$ is often small enough that "hard" problems are solvable. Don't let people use "NP-Hard" as an excuse for laziness on small tasks.
  *   **Approximation:** Just because you can't find the *perfect* solution doesn't mean you can't find a *really good* one. Many NP-hard problems have approximation algorithms that get you within 99% of the optimum in polynomial time.
      *   *Philosophical nuance:* If a 99% solution is available, are you obligated to take it? Yes. Complexity doesn't excuse you from taking the *efficient* path, only the *impossible* one.

  ### Summary Verdict

  Your friend is right that **perfect rationality is a myth**, but not because we are stupid or slow. It's because the universe is not big enough to compute the optimal decision for complex problems.

  This creates a genuine philosophical shift:
  1.  **Epistemic:** We cannot claim to know the "best" action in complex environments; we can only claim to know the "best feasible procedure."
  2.  **Ethical:** Responsibility is tied to the **algorithm**, not the **outcome**. If you use a sound heuristic and the outcome is bad, you are not blameworthy. If you gamble on a hunch and the outcome is good, you are not praiseworthy (you got lucky).

  So, hardness isn't just an excuse; it's a **boundary condition on morality**. It tells us where the domain of "obligation" ends and the domain of "luck" begins.
