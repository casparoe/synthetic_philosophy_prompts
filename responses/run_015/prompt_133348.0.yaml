answer: |-
  # Protocol for the Assessment of Species Status Submissions
  **Issuing Authority:** Wildlife Licensing Board
  **Subject:** Determination of 'Biological Species' Status for Statutory Protection
  **Version:** 1.0 (Philosophical & Operational Guidelines)

  ## 1. Preamble and Philosophical Basis
  This procedure is designed to reconcile the statutory requirement to protect **'biological species'** with the complex reality of evolutionary biology. We operate primarily under the **Biological Species Concept (BSC)**, which defines a species as a group of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.

  However, we acknowledge that taxonomy is not merely a matter of counting genes; it is a hypothesis about **lineage independence**. Where the BSC is biologically inapplicable (e.g., asexual taxa), we must determine if the population constitutes an **Evolutionary Significant Unit (ESU)** that satisfies the *intent* of the legislation, without violating the *letter* of the legal definition.

  This checklist must be applied in strict order. If a submission fails a step, the process stops unless a 'Human Handover' is triggered. A 'Human Handover' indicates a point where biological data is insufficient to make a binary decision, and a policy judgement regarding the value of biodiversity is required by the Board.

  ---

  ## 2. The Decision Procedure

  ### Step 1: The Sympatry and Interbreeding Test (The BSC Core)
  **Question:** Do the proposed populations coexist in the same geographical area (sympatry), and if so, do they interbreed to produce fertile offspring?
  *   **Philosophical Grounding:** This is the strict Mayrian definition. If two distinct forms coexist without merging, a reproductive barrier exists.
  *   **Sufficient Answer for 'Yes' (Separate Species):** In sympatry, they remain distinct morphologically and genetically; hybridisation is absent or hybrids are sterile/inviable.
  *   **Stop Condition ('No'):** If they coexist and freely interbreed with fertile offspring, they are a single biological species. The procedure stops. **Reject submission.**
  *   **Human Handover:** If they coexist and hybridise, but hybrids are rare or have reduced fitness.
      *   *Judgement Required:* Is this a stable hybrid zone (two species meeting) or a breakdown of isolation (one species)? The Board must decide if the barrier is 'strong enough' to warrant legal separation.

  ### Step 2: The Allopatry and Potential Interbreeding Test
  **Question:** If the populations are geographically separated (allopatry), is there evidence that they *would* interbreed if brought together?
  *   **Philosophical Grounding:** BSC relies on *potential* interbreeding, not just actual. However, 'potential' is counterfactual and difficult to prove.
  *   **Sufficient Answer for 'Yes' (Separate Species):** Genetic divergence is high enough that secondary contact results in reproductive isolation (behavioural, mechanical, or gametic incompatibility), or they have been isolated long enough that independent evolutionary trajectories are irreversible.
  *   **Stop Condition ('No'):** If genetic divergence is low and there is no evidence of evolved isolating mechanisms. They are likely geographical variants (subspecies). **Reject submission.**
  *   **Human Handover:** **Ring Species.** If Population A breeds with B, B with C, but A and C do not.
      *   *Judgement Required:* Biology offers no binary truth here. The Board must decide whether to protect the *ends* of the ring as distinct species (ignoring the connecting chain) or the *ring* as a single unit. This is a policy choice, not a scientific fact.

  ### Step 3: The Asexual and Clonal Lineage Test
  **Question:** Does the organism reproduce sexually?
  *   **Philosophical Grounding:** The 'Biological Species' concept is logically incompatible with obligate asexuality. Without recombination, 'species' boundaries are arbitrary cuts in a continuum of clonal divergence.
  *   **Sufficient Answer for 'Yes' (Separate Species):** *None.* Under a strict 'Biological Species' legal framework, asexual lineages cannot qualify as biological species. They may qualify as Conservation Units, but not Species.
  *   **Stop Condition ('No'):** If the lineage is obligately asexual. **Reject submission for Species Status.** (Note: Board may consider alternative protection categories).
  *   **Human Handover:** If the organism is facultatively asexual (mixed mating).
      *   *Judgement Required:* Does the sexual component maintain cohesion? The Board must weigh the ecological distinctiveness against the lack of biological species cohesion.

  ### Step 4: The Cryptic Divergence Test (DNA vs. Morphology)
  **Question:** Do genetic data indicate long-term isolation despite morphological identity?
  *   **Philosophical Grounding:** Morphological stasis does not imply genetic stasis. Cryptic species are distinct lineages that have not undergone phenotypic change.
  *   **Sufficient Answer for 'Yes' (Separate Species):** Reciprocal monophyly in multiple genetic markers (nuclear and mitochondrial) indicating no gene flow for a period significant enough to accumulate fixed differences, coupled with ecological distinctiveness.
  *   **Stop Condition ('No'):** If genetic differences are consistent with isolation-by-distance within a single population (i.e., neighbours are more similar than distant individuals, with no sharp breaks). **Reject submission.**
  *   **Human Handover:** If DNA says 'separate' but morphology says 'identical' and there is *some* historical gene flow.
      *   *Judgement Required:* At what threshold does genetic drift become 'speciation'? The Board must set a threshold for 'significant divergence' (e.g., 2% vs 5% sequence divergence). This is a value judgement on how much evolutionary history warrants protection.

  ### Step 5: The Hybrid Zone Stability Test
  **Question:** Where populations meet, is the hybrid zone narrow and stable, or wide and expanding?
  *   **Philosophical Grounding:** A narrow tension zone suggests strong selection against hybrids (two species). A wide zone of introgression suggests weak barriers (one species).
  *   **Sufficient Answer for 'Yes' (Separate Species):** Narrow zone (<10km typically), steep clines in genetic markers, hybrids show reduced fitness.
  *   **Stop Condition ('No'):** Wide zone of extensive introgression where genomes are merging. **Reject submission.**
  *   **Human Handover:** If the zone is moving due to human habitat change.
      *   *Judgement Required:* Do we protect the 'pure' forms against anthropogenic hybridisation? This is a conservation ethic decision, not a taxonomic one.

  ---

  ## 3. Application of Procedure to Current Proposals

  ### Proposal A: The Valley Salamander Ring
  **Submission:** Biologists request listing the northern and southern end-populations of a salamander ring as two separate species. They do not interbreed where they meet at the valley head, but they are connected by a chain of interbreeding populations around the valley sides.
  **Procedure Application:**
  1.  **Step 1 (Sympatry):** At the valley head, they are sympatric and do not interbreed. *Pass.*
  2.  **Step 2 (Allopatry/Ring):** The populations are connected via the sides of the valley. Gene flow exists across the complex, just not between the specific ends.
  3.  **Handover Triggered:** This is a classic Ring Species paradox. Biologically, the 'species' is the whole ring. Splitting the ends treats the intermediates as non-existent.
  **Board Decision:** **Reject as separate species.**
  **Reasoning:** Under the Biological Species Concept, the existence of gene flow through the intermediates binds the complex into a single species. To list the ends separately would be to legally deny the biological reality of the connecting populations.
  **Recommendation:** Protect the entire 'Salamander Complex' as a single listed entity to preserve the evolutionary process of speciation-in-action.

  ### Proposal B: The Cryptic Coral
  **Submission:** A marine biologist proposes splitting a coral population. They look identical to the neighbouring population (morphologically cryptic) but show 4% genetic divergence and partial gene flow (hybrids exist but are 20% less fertile).
  **Procedure Application:**
  1.  **Step 1 (Sympatry):** They coexist. Hybrids exist but have reduced fertility. *Handover.*
  2.  **Step 4 (Cryptic Divergence):** Genetic divergence is high (4%), suggesting long-term separation. However, gene flow is not zero.
  3.  **Analysis:** The BSC requires reproductive *isolation*. Partial gene flow with reduced hybrid fitness indicates they are in the process of speciation (incipient species) but have not completed the separation.
  **Board Decision:** **Reject as separate species.**
  **Reasoning:** While genetically distinct, the presence of viable, albeit less fertile, hybrids indicates the reproductive barrier is not complete. Legally, they remain a single biological species with distinct subspecies or varieties.
  **Recommendation:** List as a single species with a specific note protecting the distinct genetic lineage from being swamped by the neighbour, acknowledging the 'value judgement' that this lineage is worth preserving despite not meeting the full species threshold.

  ### Proposal C: The Asexual Lizard Lineage
  **Submission:** A herpetologist argues that a population of whiptail lizards, which reproduces via parthenogenesis (cloning), should be listed as a distinct species separate from its sexual ancestors, citing unique ecological niche and fixed genetic markers.
  **Procedure Application:**
  1.  **Step 1 (Sympatry):** Not applicable (no interbreeding).
  2.  **Step 3 (Asexual Test):** The organism is obligately asexual.
  3.  **Stop Condition Triggered:** The legal framework mandates protection for 'biological species'. The Biological Species Concept defines species via reproductive communities. An asexual lineage is, by definition, a community of one (or many identical ones) with no gene flow.
  **Board Decision:** **Reject as separate species.**
  **Reasoning:** This is the answer the researcher will not like, but it is philosophically necessary. You cannot apply a concept based on *interbreeding* to an organism that does not breed. To list this clonal line as a 'biological species' would render the term meaningless in law. Every distinct clone could theoretically claim species status, leading to infinite fragmentation of the law.
  **Recommendation:** The Board must advise the researcher that while the lineage is biologically unique and ecologically valid, it falls outside the statutory definition of 'species'. We recommend creating a new legal category of 'Protected Clonal Lineage' rather than stretching the definition of Species to breaking point.

  ---

  ## 4. Guidance for Board Members on Value Judgements
  When a procedure step triggers a **Human Handover**, you are no longer acting as scientists verifying facts; you are acting as policymakers weighing values.

  *   **Ring Species:** The value at stake is *Process vs. Product*. Do we protect the result (the distinct ends) or the process (the continuous gene flow)? Our framework favours the biological reality of the process.
  *   **Hybrid Zones:** The value at stake is *Purity vs. Continuity*. Do we protect 'pure' gene pools or the natural zone of contact? Natural hybrid zones should generally be protected as part of the species' biology; anthropogenic hybridisation may warrant intervention.
  *   **Asexuals:** The value at stake is *Legal Precision vs. Conservation Utility*. We must not sacrifice legal precision. If the law says 'Species', we cannot protect 'Clones' under that name without legislative amendment.

  **Final Note:** A 'No' decision on species status does not necessarily mean 'No Protection'. It means the protection must be framed differently (e.g., as a subspecies, a distinct population segment, or a specific habitat association) to remain consistent with the legal framework.
