prompt: |-
  I'm on a licensing board for protected wildlife and we keep getting submissions asking us to list 'cryptic species' or subspecies as full species, but our legal framework only protects biological species. I need a reusable decision procedure — like a checklist in order — that my team can actually run when a biologist claims two populations are seperate species and deserve seperate protection status. Ground it in the philosophy of taxonomy, not just 'what biologists usually do': cover ring species, asexual lineages, hybrid zones, and cases where DNA and morphology disagree. For each step say what counts as a sufficient answer, where the procedure stops with a 'no', and where it has to hand over to a human because it's a value judgement not a fact. Apply it to three proposals: a ring of salamanders round a valley where the end populations don't interbreed, a coral that looks identical to its neighbour but has partial gene flow, and a researcher pushing to split an asexual lizard population — the last one should be a case where your procedure gives an answer they won't like. Write it in British English please, and don't ask me for bibliographies — I can't search them up from here.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Licensing board for protected wildlife.
      *   **Problem:** Submissions asking to list 'cryptic species' or subspecies as full species, but the legal framework *only* protects biological species.
      *   **Task:** Create a reusable decision procedure (checklist in order) for evaluating claims that two populations are separate species.
      *   **Requirements:**
          *   Grounded in the philosophy of taxonomy (not just "what biologists do").
          *   Cover specific edge cases: ring species, asexual lineages, hybrid zones, DNA/morphology disagreement.
          *   For each step: Define sufficient answer, stop condition ('no'), and handover point (value judgement).
          *   Apply to three specific proposals:
              1.  Ring of salamanders (end populations don't interbreed).
              2.  Coral (identical look, partial gene flow).
              3.  Asexual lizard population (must yield an answer the researcher won't like).
          *   Language: British English.
          *   Constraint: No bibliographies.

  2.  **Determine the Philosophical Framework:**
      *   The prompt specifies the legal framework protects *biological species*. This points directly to the **Biological Species Concept (BSC)** (Mayr).
      *   *However*, the prompt asks to cover asexual lineages and cryptic species, where BSC fails. A rigid BSC approach would reject everything non-sexual or hybridising.
      *   *Solution:* Adopt a **Unified Species Concept** or a **Pluralistic Approach** grounded in *evolutionary independence*. The core philosophical question is: "Are these lineages evolving independently enough to be considered distinct units of biodiversity?"
      *   *Key Philosophical Tension:* Realism (species are natural kinds) vs. Operationalism (species are useful labels). The board needs operational criteria that respect biological reality.
      *   *Decision:* Use a "Reproductive Isolation + Evolutionary Independence" hierarchy. Start with BSC (since it's the legal baseline), then move to Phylogenetic/Evolutionary concepts where BSC is inapplicable, explicitly marking the value judgements.

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Step 1: Reproductive Isolation (The BSC Core).* This is the legal baseline. If they interbreed freely and produce fertile offspring in nature, they aren't biological species.
          *   *Stop:* If free gene flow exists.
          *   *Handover:* Hybrid zones (is it breakdown or stable?).
      *   *Step 2: Potential Interbreeding (Ring Species).* BSC fails here. Need to assess connectivity.
          *   *Handover:* Is the gap geographical or biological?
      *   *Step 3: Asexual/Clonal Lineages.* BSC is impossible. Need Phylogenetic Species Concept (PSC).
          *   *Criteria:* Monophyly, diagnostic traits.
          *   *Handover:* How much divergence is enough? (Value judgement).
      *   *Step 4: Discordance (DNA vs. Morphology).* Cryptic species.
          *   *Criteria:* Genetic divergence indicating long-term isolation despite morphological stasis.
          *   *Handover:* Is genetic drift enough, or is selection required?
      *   *Step 5: The 'Protection' Threshold.* Even if a species, does it warrant *separate* protection? (Policy vs. Science).

      *Refining the Steps for the Prompt:*
      The prompt asks for a procedure to decide if they *are* separate species under a framework that protects biological species. I need to be careful not to broaden the definition so much that it violates the legal framework, but broad enough to handle the edge cases scientifically.
      *Revised Strategy:* Anchor heavily on **Reproductive Isolation** (Biological Species Concept) because that is the *legal* constraint. Where BSC fails (asexuals, fossils, hybrids), we must define a proxy for "independence" that satisfies the *intent* of the law without breaking the *letter* of it.
      *Actually, looking closer:* The prompt says "legal framework only protects biological species." This is a trap. If I strictly follow BSC, asexuals *cannot* be species. The researcher pushing for the asexual lizard *should* get an answer they won't like.
      *Okay, let's structure the checklist to prioritize BSC, but allow for "Evolutionary Significant Units" (ESUs) where BSC is silent, while explicitly flagging where the board is making a policy decision rather than a scientific one.*

      *Let's try a 5-Step Protocol:*
      1.  Sympatry & Interbreeding Test (BSC Gold Standard).
      2.  Allopatry & Potential Interbreeding (Ring Species/Geography).
      3.  Hybrid Zone Stability (Introgression vs. Barrier).
      4.  Asexual/Clonal Divergence (Phylogenetic Proxy).
      5.  Cryptic Divergence (Genetics vs. Morphology).

      *Wait, I need to ensure the 'Handover' points are clear.* Where does science end and policy begin?
      *Science:* Is there gene flow? Is there monophyly?
      *Policy/Value:* How much gene flow is too much? How much genetic distance equals 'species'?

  4.  **Developing the Three Case Studies:**
      *   **Case 1: Salamander Ring.**
          *   *Issue:* Ends don't interbreed, but connected via intermediates.
          *   *Verdict:* Under strict BSC, they are one species (connected gene flow). Under Evolutionary view, ends are distinct.
          *   *Procedure Outcome:* Likely 'No' for separate listing of the ends *unless* the intermediates are gone. This highlights the ring species paradox.
      *   **Case 2: Coral.**
          *   *Issue:* Identical morphology, partial gene flow.
          *   *Verdict:* Partial gene flow suggests incipient speciation or subspecies.
          *   *Procedure Outcome:* 'No' for full species, maybe 'Yes' for subspecies (if law allowed), but law says 'biological species'. So, 'No'.
      *   **Case 3: Asexual Lizard.**
          *   *Issue:* Researcher wants split.
          *   *Verdict:* BSC requires sexual reproduction. Asexuals don't fit 'Biological Species'.
          *   *Procedure Outcome:* 'No'. This satisfies the requirement "answer they won't like". I must justify this philosophically (BSC inapplicability) rather than just saying "no sex".

  5.  **Refining the Tone and Language:**
      *   British English (licence vs license, programme, centre, etc.).
      *   Formal, bureaucratic but scientifically rigorous.
      *   No bibliographies.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension between legal definitions and biological reality.
      *   *The Protocol:* Numbered steps. Clear "Pass/Fail/Handover" logic.
      *   *Philosophy:* Mention Mayr (BSC), Simpson (Evolutionary), and the concept of 'Lineage Independence'.
      *   *Case Applications:* Apply the protocol strictly.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "No" to the asexual lizard because the law says "Biological Species". I need to explain *why* the procedure leads there based on the philosophy of taxonomy. The BSC defines species by *mechanisms* (reproduction), not just outcomes (divergence). An asexual lineage lacks the mechanism. Therefore, under this specific legal framework, it cannot be a 'biological species'. It might be a 'conservation unit', but not a 'species'. This distinction is crucial.

      *(Refining the Ring Species)*: This is the hardest philosophical knot. If A breeds with B, B with C, C with D... A and D don't breed. Are A and D species? BSC says no (connected chain). Phylogenetic says maybe. The procedure needs to flag this as a 'Handover' to human judgement because biology offers no binary answer here.

      *(Refining the Coral)*: Partial gene flow. BSC says "reproductively isolated". Partial flow means not fully isolated. Verdict: Not separate species. Handover: Is the flow negligible? (Value judgement).

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No bibliographies? Yes.
      *   Checklist in order? Yes.
      *   Sufficient answer/Stop/Handover defined? Yes.
      *   Three cases applied? Yes.
      *   Asexual case yields unfavorable answer? Yes.
      *   Philosophy grounded? Yes (BSC vs PSC vs ESU).

  8.  **Final Polish:** Check for clarity and authority. Ensure the distinction between 'scientific fact' and 'policy decision' is sharp. (e.g., Science determines gene flow; Policy determines if that flow precludes species status).

  *(Self-Correction on "Licence/License"):* In UK English, 'licence' is the noun, 'license' is the verb. The prompt uses "licensing board" (adjective/noun adjunct) and "list... as full species". I will ensure noun/verb distinction is correct.

  *(Self-Correction on Asexuals):* Make sure the rejection isn't arbitrary. It must be because the *Legal Framework* mandates BSC, and BSC is logically incompatible with obligate asexuality.

