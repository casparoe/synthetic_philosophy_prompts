  ### Part 3: The Scoring Key (Mapping Your Answers)

  *Find the pattern that matches your answers most closely.*

  #### **Profile 1: The Calculator (Mostly A's)**
  *   **Your View:** **Plain Total Utilitarianism**
  *   **The Logic:** You believe pain and pleasure are on the same scale (Q1). You think severe pain can be outweighed by enough pleasure (Q2), and that numbers matter more than individual boundaries (Q3, Q6). You likely count future people equally (Q7).
  *   **The Vibe:** "Maximize the net good. Don't let emotions cloud the math."

  #### **Profile 2: The Empath (Mostly B's on Q6, Q7, Q8)**
  *   **Your View:** **Prioritarianism**
  *   **The Logic:** You think trade-offs are possible (Q1, Q2), but you believe helping the worse-off is *more valuable* than helping the happy (Q7, Q8). You prefer spreading burdens fairly rather than maximizing the sum (Q6).
  *   **The Vibe:** "Happiness matters, but justice matters more. Lift the bottom first."

  #### **Profile 3: The Firefighter (Mostly B's on Q1, Q4, Q7)**
  *   **Your View:** **Negative Utilitarianism (Soft)**
  *   **The Logic:** You think pain and pleasure are different kinds of things (Q1). You believe reducing suffering is more urgent than creating pleasure (Q7), but you still think enough pleasure *could* theoretically outweigh pain (Q2).
  *   **The Vibe:** "Put out the fires first. We can decorate the house later."

  #### **Profile 4: The Guardian (B on Q2, B on Q3)**
  *   **Your View:** **Lexical Negative Utilitarianism**
  *   **The Logic:** You believe there is a hard "cliff." Once pain gets severe enough, it stops being tradeable (Q2). You also reject aggregating mild pleasures against severe pain (Q3).
  *   **The Vibe:** "Some lines cannot be crossed. One person's torture is never the price for a crowd's snack."

  #### **Profile 5: The Moderator (C on Q1, B on Q2, A on Q5)**
  *   **Your View:** **Threshold Deontology (The "Moderate" View)**
  *   **The Logic:** You think mild things trade normally (Q1, Q5), but extreme things do not (Q2). You distinguish between *intensity* and *duration* (Q5).
  *   **The Vibe:** "Normal life is a trade-off. Extreme suffering is a veto."

