answer: |-
  1. Begin by deriving the probability curve using the binary choice formula to establish the baseline dependency on individual competence, then immediately layer conditional independence as the multiplier that collapses without it. This sequence ensures they understand the mechanism before you dismantle the assumptions underlying their current implementations.
  2. Use the model-ensemble case instead of a human committee because it forces them to confront their specific data overlap issues directly without the abstraction layer of human behavior. The example must have an objective ground truth like code compilation success to distinguish from safety judgments, and it must not have ambiguous outcomes where correctness is subjective.
  3. Expect them to first assume average competence suffices rather than per-voter competence, which you must defuse during the initial formula derivation before moving to independence. Next, they will assume independence holds despite shared training data, requiring a specific intervention when you introduce correlated error rates before discussing safety judgments.
  4. Ask whether adding a tenth model trained on the exact same dataset increases confidence more than adding a model trained on disjoint data, requiring them to articulate the correlation penalty. This forces them to apply the independence assumption rather than reciting the competence curve.
  5. Openly refuse to cover alternative aggregation methods like weighted voting or stacking, as discussing solutions would distract from diagnosing the core assumption failures. Keeping the scope strictly on the validity of the theorem prevents the session from becoming a premature engineering design review.
