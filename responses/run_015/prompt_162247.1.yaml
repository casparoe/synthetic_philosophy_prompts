answer: |-
  This procedure guides the modeling team through a biweekly review of the pretrial risk score to ensure it meets legal, technical, and ethical standards before deployment. The process begins with a data feasibility check because we cannot enforce fairness criteria that require data we do not possess or outcomes we cannot observe. Since state law forbids collecting race or ethnicity, any request to equalize metrics across racial groups is immediately flagged as legally noncompliant and unsatisfiable. We may use proxies like ZIP code or age at first arrest, but the procedure requires us to state plainly in the public justification that these are imperfect substitutes and not direct measures of racial fairness. Furthermore, because outcomes like new arrest and failure to appear are only observed for released defendants, we cannot calculate false negative rates for the detained group. Any criterion requiring knowledge of what would have happened to detained individuals is technically impossible without untestable assumptions, so the procedure stops and reports the criterion as unsatisfiable if it relies on false negative rates or overall accuracy that includes the detained population. We proceed only with metrics calculable on the released population, such as false positive rates or calibration among those given a score.

  Once feasibility is established, the team must select the primary fairness criterion to enforce. Where the choice is open, this procedure commits to calibration, meaning that a given risk score must correspond to the same probability of failure across groups. We choose calibration over other criteria because our scores are published to judges who override them in a quarter of cases, and judges need a score to mean the same thing regardless of a defendant's background to make informed override decisions. If we are asked to equalize false-positive rates across groups instead, the procedure dictates that we test whether this is compatible with calibration given our data constraints. In most real-world cases where base rates of failure differ across groups, equalizing false-positive rates conflicts with calibration. If this conflict arises, the procedure stops and reports that the requested criterion is not satisfiable alongside calibration. We do not attempt to optimize both simultaneously because the mathematics generally forbids it. If the request is to make the score mean the same thing across groups at all three tiers, this is a request for calibration, which aligns with our default commitment. We verify this by checking if the observed failure rate for each score tier matches the predicted risk within a acceptable margin of error for each proxy group. If the scores are well-calibrated, we proceed. If they are not, we adjust the thresholds or model weights to improve calibration, provided doing so does not violate the capacity constraints for supervision slots.

  The procedure includes a specific harm check before any revision is approved. Even if a criterion is technically satisfiable, we must examine the operational consequences. If we discover that the only criterion satisfiable given our labels raises detention rates for the group it was meant to protect, the procedure stops and flags this for the oversight board. For example, if enforcing calibration requires raising the threshold for release for a specific ZIP code group such that more people from that group are sent to a detention hearing, this is a negative outcome that numbers alone cannot justify. This is the point at which the procedure must stop and hand the decision to the board because the remaining question is one of values rather than numbers. The analysts cannot decide whether a gain in statistical fairness is worth a loss in liberty for the protected group. The board must weigh the trade-off between equalizing risk interpretation and minimizing physical detention. The team prepares a brief for the board that states the numerical outcome clearly, noting that the model improvement increases detention for the target group, and recommends that the board decide whether to accept the revision, revert to the previous version, or adjust the capacity constraints.

  Finally, the procedure requires a public statement that acknowledges the limitations of the model and the process. We must say plainly what the procedure cannot do. We cannot guarantee fairness across racial groups because we are forbidden from collecting racial data. We cannot measure the risk of detained defendants because we do not observe their outcomes. We cannot resolve value conflicts between fairness metrics and detention rates without board intervention. The public statement must explain that the score is a tool for informing decisions, not making them, and that the judges retain the authority to override the score. It must also state that we prioritize calibration so that judges can interpret risk consistently, but that this choice involves trade-offs that are reviewed by the oversight board. If the board decides to accept a revision that increases detention for a protected group, the public record must reflect that this was a deliberate policy choice made by the board, not an artifact of the model. This transparency ensures that the limits of our data and the values embedded in our thresholds are visible to the community, maintaining trust even when the mathematics cannot provide a perfect solution. The process concludes with the team signing off on the technical feasibility and the board signing off on the value judgments, ensuring that no single group bears the responsibility for decisions that require both statistical rigor and ethical reasoning.
