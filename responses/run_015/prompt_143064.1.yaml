answer: |-
  hey, happy to help break this down. this is a really interesting intersection of meta-ethics and historical sociology. before diving into the theories, just wanna flag the ground rules regarding the history itself, since you asked to separate settled stuff from the contested interpretations.

  **Settled vs. Contested**
  It's pretty settled fact that aristocratic dueling declined sharply across europe and north america during the 19th century and was mostly gone by 1900. The legal crackdowns happened, the middle class rose, and the body counts went down. What's *contested* is the engine of that change. was it the law? religion? or a shift in what people felt ashamed of? historians and philosophers actually fight a bit here. some say the law forced it, others say the law only worked because the culture had already turned against it. thats where williams and appiah come in.

  **Bernard Williams: The Shift in Ethical Psychology**
  williams is less about dueling specifically and more about how moral change works in general (mostly in *Shame and Necessity* and *Ethics and the Limits of Philosophy*). his take would be that you don't stop dueling because someone writes a pamphlet proving killing is irrational. you stop because the "ethical substance" of the society changes.

  for williams, the key is the shift from one kind of shame to another. in the early 19th century, the shame of being called a coward (and losing social standing) was heavier than the shame of killing a man. by the late 19th century, that flipped. the "rational argument" against dueling was always there, but it didnt land until the social gaze changed. williams would say the revolution happened when the *audience* changed their mind about what was shameful. it's not that people became more rational, its that their identities shifted. they stopped seeing themselves as warriors bound by code and started seeing themselves as "civilized citizens."

  **Kwame Appiah: The Clash of Codes and Interests**
  appiah actually uses the end of dueling as his main case study in *The Honor Code*. he agrees with williams that rational argument alone doesnt do it, but he gets more specific about the mechanism. he says honor codes are social tools. they work as long as they help people coordinate behavior and maintain status.

  appiah argues the code broke because of a "script clash." a 19th-century gentleman had multiple identities: he was a christian, a citizen of a modern state, *and* a man of honor. eventually, the demands of being a good christian/citizen (don't kill, obey the law) clashed too hard with the demands of the honor code (kill if insulted). appiah says the shift happened when the cost of maintaining the honor code (jail, social ostracization, cognitive dissonance) outweighed the benefits. it wasn't just a vibe shift (like williams might imply); it was a pragmatic collapse of the code's utility. people still cared about honor, they just found a new way to get it without the pistols.

  **The Third Angle: Technical Necessity**
  so, the niche idea you mentioned: *once a social practice stops being technically necessary for maintaining status, it becomes vulnerable to moral condemnation.*

  does this line up? i'd say this sits **firmly within Appiah's camp**, maybe even tightening it up. appiah talks about interests and beliefs clashing; this third angle specifies that the "interest" is status maintenance. if you can be a high-status male through wealth, political office, or professional reputation (which happened as the economy shifted from land/aristocracy to industry/bureaucracy), then dueling becomes an unnecessary risk.

  once it's unnecessary, it's just violence. and unnecessary violence is easy to morally condemn.

  for williams, this might feel a bit too functionalist. williams is worried about the *experience* of shame, not necessarily the "technical necessity" of status. he might argue that even if dueling wasn't necessary, people would keep doing it if the shame structure held. the fact that they stopped suggests the shame structure *had* to change first. so this third angle feels more sociological/appiah than psychological/williams.

  **Summary of the Tension**
  the main friction between williams and appiah here is subtle. williams emphasizes the *internal* shift in how agents feel about themselves (the phenomenology of shame). appiah emphasizes the *external* social mechanics of how honor codes function as regulatory systems.

  neither view is total consensus. some historians still push back and say "actually, the state just arrested everyone and that's why it stopped." but if we're looking at moral revolutions specifically, appiah gives you the mechanics of the dueling case better, while williams gives you the deeper philosophical reason *why* arguments fail without the shame shift.

