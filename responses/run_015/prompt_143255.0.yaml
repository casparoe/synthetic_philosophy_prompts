answer: |-
  # The Everettian Betting Game: A Protocol

  **Time:** 100 Minutes
  **Participants:** 16 (8 Philosophy, 8 Physics)
  **Budget:** $30 (20 Chocolate Bars @ $1.50 each, or cash equivalent)
  **Goal:** Elicit the tension between Branch Counting and Amplitude Squaring via decision-theoretic pressure.

  ## I. Materials & Room Setup

  1.  **The Room:** Clear the center. Designate two corners as **Branch A** and **Branch B**. A third corner is the **Null Zone** (for Round 5).
  2.  **The Bank:** A locked box or envelope containing the 20 chocolate bars (the "Prize Pool").
  3.  **The Coupons:** Small slips of paper. Pre-printed: *"I pay $____ now. My descendant in Branch [X] receives 1 Chocolate Bar. My descendant in Branch [Y] receives 0."*
  4.  **The Randomizers:**
      *   **Deck 1:** 4 Cards (3 Hearts, 1 Spade).
      *   **Deck 2:** 2 Cards (1 Heart, 1 Spade) inside weighted envelopes (Heart envelope contains 3 slips of paper, Spade contains 1, but is sealed as "One Branch").
      *   **Deck 3:** A standard die (for Round 4).
  5.  **Whiteboard:** Divided into "Round 1" through "Round 5" columns. Sticky notes for bids.
  6.  **Care Function Worksheet:** One per participant (see below).

  ## II. The Care Function (Minutes 0–15)

  **Facilitator Script:**
  *"We are simulating an Everettian multiverse. When a split occurs, the universe branches. All outcomes happen. There is a copy of you in Branch A and a copy of you in Branch B. You are currently the 'Pre-Branch' self. You must decide how much to pay to benefit your future descendants."*

  **Task:**
  Hand out the **Care Function Worksheet**. Ask them to define a function $V$ that determines the value of a bet.
  $$V = \sum_{i} C(w_i, n_i, N) \cdot P_i$$
  Where:
  *   $w_i$: The "Weight" (amplitude squared) of branch $i$.
  *   $n_i$: The number of branches of type $i$.
  *   $N$: The total number of branches in the universe.
  *   $P_i$: The Payoff in branch $i$ (1 Chocolate or 0).
  *   $C$: Their **Caring Measure**.

  **Instruction:**
  *"Write down explicitly: Do you care about the number of copies ($n$)? Do you care about the weight ($w$)? Do you care about the total population ($N$)? Write a rule. For example: 'I care equally about every copy' or 'I care proportionally to weight.' Seal this in an envelope. You cannot change it after Round 1."*

  ## III. The Rounds (Minutes 15–55)

  **General Ritual:**
  1.  **Commit:** Participants write their "Coupon Price" ($0.00 to $2.00) on a sticky note. This is the maximum they would pay for a coupon that pays 1 Chocolate in the Winning Branch.
  2.  **Lock:** Stick notes to the Whiteboard (anonymous).
  3.  **Branch:** Facilitator triggers the split. Participants physically move to the corner corresponding to their outcome.
  4.  **Reveal:** They open their envelope/card in the corner. They see their result. They do not speak to the other corner.
  5.  **Return:** Everyone returns to seats. Facilitator reveals the distribution.

  ### Round 1: The Trap (Equal Weight, Unequal Count)
  *   **Setup:** 4 Envelopes per student. 3 marked "Win", 1 marked "Lose".
  *   **Physics:** Amplitudes are equal ($\frac{1}{2}|A\rangle + \frac{1}{2}|B\rangle + \frac{1}{2}|C\rangle + \frac{1}{2}|D\rangle$ normalized).
  *   **Structure:** 4 Branches. 3 Win, 1 Lose.
  *   **Expectation:** Branch Counting (75%) and Amplitude Squaring (75%) agree.
  *   **Action:** Students bid. Most will bid near $1.50 (75% of $2).
  *   **Reveal:** 12 students go to Win Corner, 4 to Lose Corner.
  *   **Debrief Note:** "Everyone feels rational here. Counting works. Squaring works."

  ### Round 2: The Break (Unequal Weight, Equal Count)
  *   **Setup:** 2 Envelopes per student. Envelope A ("Heavy"), Envelope B ("Light").
  *   **Physics:** State is $\sqrt{3/4}|A\rangle + \sqrt{1/4}|B\rangle$.
  *   **Structure:** 2 Branches. Weight A = 0.75, Weight B = 0.25.
  *   **Physical Prop:** Envelope A contains a stack of 3 cards (all "Win"). Envelope B contains 1 card ("Lose"). *Crucial:* Tell them "This is ONE branch each. The stack thickness represents Measure, not Count."
  *   **Action:** Students bid.
      *   *Counters* should bid $1.00 (50%).
      *   *Weighters* should bid $1.50 (75%).
  *   **Reveal:** Facilitator assigns 12 students to A, 4 to B (simulating the measure distribution), but insists there are only *two* worlds.
  *   **Record:** Plot the bimodal distribution on the board.

  ### Round 3: The Fine-Graining Reveal (Mid-Round Twist)
  *   **Timing:** *After* bids are locked for Round 2, but *before* envelopes are opened.
  *   **Announcement:** *"Correction. Branch A was not one branch. It was a degenerate subspace of 300 orthogonal micro-branches. Branch B is still 1 micro-branch. The total Weight is unchanged (75/25)."*
  *   **Question:** *"You cannot change your bid. But raise your hand if you now regret your bid."*
  *   **Diagnostic:**
      *   If you care about **Count**, Branch A is now 300 branches. You should have paid nearly $2.00.
      *   If you care about **Weight**, nothing changed. You keep your $1.50.
  *   **Reveal:** Open envelopes. The "300 branches" are represented by the 3 cards in the Heavy Envelope from Round 2.

  ### Round 4: The Irrelevant Device (Remote Branching)
  *   **Setup:** A die is rolled in the hallway by a TA. 6 Outcomes.
  *   **Physics:** This branching is causally isolated from the Coupon payoff.
  *   **Question:** *"The universe just branched into 6 copies of this room. Does your Coupon Price change?"*
  *   **Diagnostic:**
      *   If you care about **Total Population ($N$)**, your care is now diluted by 1/6. Price should drop.
      *   If you care about **Relative Weight**, price stays same.
  *   **Action:** Verbal vote only (save time). Record shift.

  ### Round 5: The Near-Null Branch
  *   **Setup:** A new branch is added with Weight $10^{-9}$. Payoff = 1 Chocolate.
  *   **Question:** *"Is there a person there? Do you care about them?"*
  *   **Diagnostic:** Tests continuity and the "Zero Limit." If Count matters, 1 branch is 1 person (care = 1). If Weight matters, care $\approx 0$.
  *   **Action:** Verbal vote.

  ## IV. The Debrief (Minutes 55–90)

  **1. Caring vs. Credence (10 mins)**
  *   **Point:** In Round 2, the "Counters" bid $1.00. Were they saying "I believe I'm 50% likely to be in A"?
  *   **Correction:** In Everett, probability is not ignorance. Both A and B exist. The bid was not a *credence* (belief about what is true) but a *caring measure* (how much I value that copy).
  *   **Board:** Write **CREDENCE** vs **CARING**. Highlight that the game forced them to price *caring*.

  **2. The Fine-Graining Constraint (10 mins)**
  *   **Point:** Round 3 wrecked the Counting function.
  *   **Theory:** This maps to the **Basis Problem**. If rationality depends on how we slice the Hilbert space (fine-graining), it is unstable.
  *   **Survivor:** Only functions dependent on **Amplitude Squared (Weight)** survive fine-graining. Counting is basis-dependent; Weight is basis-independent (unitary invariant).

  **3. The Irrelevant Device (10 mins)**
  *   **Point:** Round 4 tested **Branch Locality**.
  *   **Theory:** Rationality should not depend on events in causally disconnected branches (no "action at a distance" in decision theory).
  *   **Survivor:** Weight-based caring survives. Total-Count caring fails (your value dilutes because a die rolled in another galaxy).

  **4. The Care-Function Autopsy (10 mins)**
  *   Open the sealed Care Function envelopes.
  *   Group them on the board:
      *   **Naive Counting:** (Broken by Round 3).
      *   **Total Population:** (Broken by Round 4).
      *   **Born Rule (Weight):** (Survives all).
      *   **Nullivism:** "I don't care about any copies." (Survives, but leads to paralysis).
  *   **Conclusion:** The Born Rule is the *only* non-trivial care function that satisfies **Fine-Graining Invariance** and **Locality**.

  ## V. Honesty About Limits (Minutes 90–95)

  **Facilitator Script:**
  *"We must stop. This game has a rigged ending. I have guided you to see that Weight is better than Count. But I have not proven **why** Weight = Amplitude Squared."*

  **The Gap:**
  1.  **The Stipulation:** In Round 2, I *told* you the weights were 3:1. I did not derive that from the physics of the envelopes. In real QM, we need to derive the weights from the linear structure of the wavefunction without assuming probability.
  2.  **The Derivation:** The **Deutsch-Wallace Theorem** attempts to prove that a rational agent who accepts Everettian mechanics *must* use the Born Rule, without assuming it upfront. This game assumed the weights existed and asked how to use them.
  3.  **The Reality:** The game shows that *if* you have weights, you should use them. It does not solve the **Incoherence Problem** (why act probabilistically if everything happens?).

  **Takeaway:**
  *"The game demonstrates the **Quantitative Problem** (Why squared?). It does not solve the **Incoherence Problem** (Why probability?). For that, you need the decision-theoretic proofs, which argue that betting against the Born Rule makes you vulnerable to a Dutch Book even in a deterministic multiverse."*

  ## VI. Failure Modes & Mitigation

  | Failure Mode | Prediction | In-the-Moment Fix | Debrief Co-option |
  | :--- | :--- | :--- | :--- |
  | **"It's just 75% chance"** | Phil students treat it as classical ignorance. | **Intervention:** "In this game, the Losers *also* exist. They are in the other corner eating nothing. You are deciding for *them* too." | Use this to explain the **Incoherence Problem**. The intuition that "only one happens" is exactly what Everett denies. |
  | **"I'll be the Big Branch"** | Participants claim they will subjectively end up in the high-weight branch. | **Intervention:** "There is a copy of you in the low-weight branch right now. Do you abandon him?" | Discuss **Personal Identity**. Everett requires we care about all descendants, not just the 'likely' one. |
  | **Physics Over-Compute** | Physics students calculate odds and ignore the philosophy. | **Intervention:** "Suspend the math. If you were a philosopher who didn't know QM, would you count branches or weigh them?" | Ask physics students to explain *why* the math implies weight, then ask philosophers if that *ought* to dictate care. |
  | **Facilitator Distrust** | "You're just putting more chocolate in the Heavy envelope." | **Intervention:** Allow a student to shuffle the deck or weigh the envelopes *before* the round. | Discuss **Operationalism**. In QM, we trust the formalism. Here, you had to trust the setup. |
  | **The Stalemate** | Room splits 50/50 on Round 2 bids ($1.00 vs $1.50). | **Intervention:** Do not resolve it. Record the split. | Use this to show **Underdetermination**. Without the Deutsch-Wallace axioms, rationality does not uniquely pick Born. |
  | **Groupthink** | Students copy the neighbor's sticky note. | **Intervention:** Enforce "Heads Down, Pens Moving" during bidding. | Discuss **Social Epistemology**. Does rationality require independence? |

  ## VII. Budget & Payoff Execution

  *   **Total Pot:** 20 Chocolate Bars ($30).
  *   **Payout Rule:** To avoid bankrupting the bank on high bids:
      1.  Select **One Round** at random (Roll a d5) to be "The Real Round."
      2.  In that round, if the student's Bid $\ge$ Facilitator's "House Price" (set at the Born Rule value, e.g., $1.50), they get the Coupon.
      3.  If they hold the Coupon and are in the Winning Branch, they get 1 Chocolate.
      4.  If they are in the Losing Branch, they get nothing.
      5.  *Alternative:* Simply give every participant 1 Chocolate at the end for "Participation," and award 2 extra chocolates to the 3 students whose bids were closest to the Born Rule in Round 2. (Simpler, ensures everyone eats).
      *   **Recommendation:** Use the **Participation + Bonus** model. It prevents the "House" from losing money if everyone bids $2.00, and rewards the "Rational" (Born Rule) bidders without punishing the "Counters" too harshly.

  ## VIII. Facilitator's Cheat Sheet (The "Why")

  *   **Round 1:** Validates intuition. (Count = Weight).
  *   **Round 2:** Breaks intuition. (Count $\neq$ Weight).
  *   **Round 3:** Punishes Counting. (Basis Dependence).
  *   **Round 4:** Punishes Global Counting. (Locality).
  *   **Round 5:** Tests Continuity. (Measure Zero).
  *   **The Lesson:** The Born Rule is not just a physical law; it is a **normative constraint on caring** in a branching universe. Any other rule makes you vulnerable to instability (fine-graining) or irrelevance (remote branching).

