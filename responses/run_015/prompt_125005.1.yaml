prompt: |-
  Write a satirical museum audio-guide script of approximately 650 words, in the deadpan, authoritative voice of a major natural-history museum's permanent gallery, "The Arc of Improvement: From Antiquity to Liberal Democracy." The script should guide a listener through the collapse of the Western Roman Empire—specifically from the Crisis of the Third Century to the deposition of Romulus Augustulus in 476 CE—interpreting every event through an unrelenting Whig-historiographical lens. Frame the Empire's division as administrative decentralization, the Visigothic sack of Rome in 410 as early participatory consultation with non-state stakeholders, the rise of feudalism as localized pilot programs in distributed authority, and the final dissolution as a successful transition from imperial monopoly to competitive multi-polar governance. The satire must land the standard historiographical objections—teleological anachronism, erasure of contingency, and the imposition of present values on past actors—purely through deadpan exaggeration, never by stating them explicitly. Include at least one direct address to the listener emphasizing their privileged endpoint perspective, and one expert sidebar explaining why the Plague of Justinian should be read as stress-testing the resilience of emerging democratic infrastructures. Do not cite, quote, or reference specific modern scholars; paraphrase any allusion to ancient chroniclers without quotation marks. The humor should come from getting the historiographical distortion precisely right: a specialist should recognize the logic of progressivist history being pushed to its absurd conclusion, while a general reader should still understand the joke.
