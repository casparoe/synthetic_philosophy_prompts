answer: |-
  # Joint Statement on Intergenerational Climate Obligations
  **Signatories:** The Discounting Optimisation Working Group (DOWG) & The Near-Zero Time Preference Coalition (NZPTP)
  **Date:** October 2023
  **Subject:** Areas of Consensus, Precise Disagreement, and Empirical Cruxes

  ## I. Agreed Claims
  *We, the undersigned, acknowledge the following premises as factual or normative baselines for this collaboration, despite our divergent policy conclusions.*

  1.  **The Physics of Accumulation:** Atmospheric warming is determined primarily by cumulative carbon emissions (the Transient Climate Response to Cumulative Emissions, or TCRE). Functionally, the atmosphere operates as a finite budget constraint; exceeding a specific cumulative tonnage makes exceeding a specific temperature threshold highly probable.
  2.  **The Non-Identity Problem:** We acknowledge that climate policy alters the course of economic and social history sufficiently to change *which* specific individuals are conceived in the future. Therefore, we cannot claim that specific future individuals are "harmed" in a counterfactual sense (i.e., they would not exist without the emissions). Our obligation is to ensure that the *quality of life* or *welfare potential* of whoever comes into existence is not unjustly diminished, regardless of their identity.
  3.  **Uncertainty and Tail Risks:** Both physical climate systems and economic damage functions contain deep uncertainties. We agree that low-probability, high-impact outcomes (tipping points, catastrophic welfare loss) exist and must be factored into decision-making, though we weigh them differently.
  4.  **Growth and Vulnerability:** Economic development increases adaptive capacity (richer societies handle heat/floods better) but historically correlates with higher emissions. We agree that poverty alleviation is a moral priority, but disagree on whether rapid growth now is compatible with staying within the carbon budget identified in Claim 1.
  5.  **Objective:** Both sides aim to maximize aggregate human welfare. Neither side advocates for suffering for its own sake, nor for the extinction of humanity. The dispute is regarding the *weighting* of that welfare across time.

  ## II. Statement of Disagreement
  *We disagree on the appropriate Social Discount Rate (SDR) to apply to intergenerational welfare transfers.*

  | Feature | **Discounting Optimiser (DO)** | **Near-Zero Pure Time Preference (NZPTP)** |
  | :--- | :--- | :--- |
  | **Core Ethical Claim** | Capital has an opportunity cost. Resources invested in mitigation today could otherwise grow at the market rate of return ($r$). Future generations will likely be richer; therefore, transferring wealth from poor (present) to rich (future) via aggressive mitigation is inefficient and potentially welfare-reducing. | Pure time preference ($\delta$) is ethically indefensible. A unit of welfare counts equally regardless of when it occurs. Discounting should reflect only the probability of extinction or diminishing marginal utility of consumption, not mere temporal location. |
  | **Policy Implication** | **Gradualism.** Mitigation should be phased in to match technological progress. Aggressive cuts now are suboptimal if they stunt growth that would fund adaptation later. | **Urgency.** Mitigation must be front-loaded to respect the carbon budget. Relying on future adaptation is ethically risky and assumes substitutability that may not exist. |
  | **Accepted Wording** | "We prioritise efficiency to ensure the future inherits maximum capital." | "We prioritise equity to ensure the future inherits a habitable planet." |

  ## III. Cruxes and Probes
  *The following scenarios test whether our disagreement is fundamental or contingent on empirical assumptions.*

  | Probe | Scenario Description | DO Prediction & Reaction | NZPTP Prediction & Reaction |
  | :--- | :--- | :--- | :--- |
  | **1. The Overlap Scenario** | **Setup:** Assume 80% of economic damages from emissions released in the next 20 years manifest within 35 years (affecting the same living cohort).<br><br>**Question:** Does the policy gap close? | **Prediction:** **Yes, gap closes.**<br><br>**Reaction:** If the harmed are the *emitters*, discounting becomes irrelevant. This is an intra-generational externality, not an intergenerational transfer. We would support stronger near-term regulation, proving our view is not "do nothing," but "match cost to beneficiary." | **Prediction:** **Yes, gap closes.**<br><br>**Reaction:** This confirms our suspicion that the dispute is not about *whether* to prevent harm, but about *who* bears it. If the timeline compresses, the "future people" argument vanishes, and standard cost-benefit analysis supports mitigation. |
  | **2. The Handover Rule** | **Setup:** Each generation may emit only as much as it removes, handing over an atmospheric sink no more degraded than inherited (measured in tonnes of capacity, not money), regardless of successor wealth.<br><br>**Question:** Is this rule coherent/mandatory? | **Prediction:** **No, Incoherent.**<br><br>**Reaction:** This fetishizes physical capital over welfare. If successors are 10x richer, they may prefer more capital and a slightly warmer climate (which they can adapt to) than a pristine climate and no capital. We support handing over *total welfare potential*, not specific physical assets. | **Prediction:** **Yes, Mandatory.**<br><br>**Reaction:** Natural capital (stable climate) is non-substitutable. Money cannot buy a stable ice sheet once tipped. Wealth is useless in a collapsed system. The rule is coherent because it safeguards the *preconditions* for economic activity, not just the activity itself. |

  ## IV. Meta-Analysis & Methodological Notes

  ### 1. Verbal Disputes vs. Substantive Disagreement
  We flag a significant portion of our dispute as potentially verbal regarding the definition of **"Investment."**
  *   **DO** treats mitigation as *consumption* (a cost incurred now) and capital accumulation as *investment*.
  *   **NZPTP** treats mitigation as *investment* (preserving the capital stock of the biosphere) and emissions as *drawdown*.
  *   **Resolution:** If we agree that a stable climate is a form of capital stock, the DO position shifts toward higher mitigation. If we agree that mitigation costs are strictly consumption losses, the NZPTP position requires higher ethical weighting of the future to justify the cost.

  ### 2. Strawman Risks
  *   **Risk to DO:** We risk portraying the Discounting Optimiser as indifferent to suffering. **Correction:** The DO view is explicitly *consequentialist*; they argue that slowing growth now causes immediate, certain poverty deaths, which outweighs uncertain future climate deaths.
  *   **Risk to NZPTP:** We risk portraying the Near-Zero group as "degrowthers" who oppose development. **Correction:** The NZPTP view supports development but argues that unchecked carbon emissions will *destroy* development potential later. They are optimising for long-term growth, not against growth itself.

  ### 3. Evaluation of Probes (Rigging Check)
  *   **Probe 1 (Overlap):** **Fair.** It successfully isolates *time preference* from *uncertainty* and *identity*. If we agree here, it proves the core ethical rift is purely about the distant future, not present action.
  *   **Probe 2 (Handover):** **Rigged toward NZPTP.** The rule specifies measurement in "tonnes of remaining capacity" rather than "welfare units." This presupposes that natural capital is non-substitutable, which is the very point in question.
      *   **Fix:** The probe should ask: *"Is there a threshold of climate damage beyond which no amount of economic compensation constitutes a fair handover?"* This allows the DO to admit a threshold exists (catastrophe) without accepting the strict tonne-for-tonne rule.

  ### 4. What Would Change Our Minds (Load-Bearing Cruxes)
  *   **For the Discounting Optimiser:** Evidence that **substitutability is low.** If empirical data shows that above 2.5°C, economic growth becomes impossible (i.e., damages scale super-linearly with temperature rather than linearly), the "grow now, fix later" model collapses. We need proof that adaptation has a hard ceiling.
  *   **For the Near-Zero Preference:** Evidence that **mitigation stalls convergence.** If aggressive carbon pricing permanently locks the Global South into poverty by restricting energy access, and if that poverty leads to higher mortality than the climate damage would have, the NZPTP view must adjust. We need proof that green transitions can be fast enough to prevent warming *without* sacrificing human development indices.

  ***

  **Signed,**
  *Representative, Discounting Optimisation Working Group*
  *Representative, Near-Zero Pure Time Preference Coalition*
