      *   **Task:** Write a joint statement for a climate ethics seminar representing an "adversarial collaboration."
      *   **Parties:**
          1.  *Discounting Optimiser (DO):* Believes in discounting future welfare at roughly the market return on capital ($r$). Believes growth + adaptation is the primary solution. Often associated with Nordhaus-style Integrated Assessment Models (IAMs).
          2.  *Near-Zero Pure Time Preference (NZPTP):* Believes discounting welfare based solely on temporal location is unethical (Ramsey/Parfit/Stern view). Believes strong mitigation is required now.
      *   **Required Content:**
          *   Agreed claims (including awkward ones like carbon budgets and non-identity problems).
          *   Disagreement stated precisely (in wording both accept).
          *   Cruxes (specifically the two user-provided probes: Overlap Scenario & Handover Rule).
          *   Format: Numbered agreed claims, Table of disagreements (Crux/Probe/Predictions).
          *   Meta-analysis: Flag verbal disputes, identify what would change minds on cruxes, identify potential strawmanning, and evaluate if the probes are rigged.
      *   **Tone:** Academic, collaborative, precise, charitable to both sides.

  2.  **Deconstruct the Parties:**
      *   *Discounting Optimiser (DO):* Focuses on efficiency. If capital grows faster than climate damages accumulate, invest in growth now, fix climate later. Concerned about opportunity costs of mitigation. Accepts some damage as optimal.
      *   *Near-Zero Pure Time Preference (NZPTP):* Focuses on equity across generations. Future people count as much as present people. High implicit cost of carbon. Concerned about catastrophic risk and irreversible loss.
      *   *Common Ground:* Climate change is real, anthropogenic, and costly. Emissions accumulate. Temperature rise is linked to cumulative emissions (TCRE). Uncertainty exists. We care about welfare.

  3.  **Drafting Agreed Claims:**
      *   Need to include the "awkward" ones requested.
      *   *Claim 1 (Physics):* Cumulative emissions determine peak warming (TCRE). It acts like a budget.
      *   *Claim 2 (Identity):* We cannot identify specific future individuals who will be harmed due to the non-identity problem (policy changes *who* is born). Harm is to "counterfactual counterparts" or general welfare levels.
      *   *Claim 3 (Uncertainty):* Tail risks exist (both economic and physical).
      *   *Claim 4 (Growth):* Economic growth affects vulnerability (adaptation capacity) but also drives emissions.
      *   *Claim 5 (Goal):* Both want to maximize aggregate welfare (however discounted).

  4.  **Drafting the Disagreement:**
      *   Must be neutral.
      *   *Core:* The appropriate social discount rate (SDR) for intergenerational welfare.
      *   *DO:* SDR $\approx$ market return on capital (opportunity cost).
      *   *NZPTP:* Pure time preference ($\delta$) $\approx$ 0. SDR driven by growth elasticity, not pure impatience.
      *   *Implication:* How much to sacrifice now for later benefits.

  5.  **Analyzing the Probes (Cruxes):**
      *   *Probe 1: The Overlap Scenario (Short-term harm).*
          *   *Setup:* Damages hit within 35 years (same generation).
          *   *DO Prediction:* Gap closes. If the harmed are the *same* people, discounting matters less because it's intra-generational. Mitigation looks more attractive.
          *   *NZPTP Prediction:* Gap closes. This confirms the objection was never about "future people don't count" but about "trade-offs."
          *   *Interpretation:* If they agree here, the dispute is largely about *intergenerational* transfer, not climate physics.
      *   *Probe 2: The Handover Rule (Physical vs. Economic).*
          *   *Setup:* Emit $X$, Remove $X$. Maintain physical sink capacity regardless of wealth.
          *   *DO Prediction:* Incoherent/Inefficient. If future people are richer, they value the environment differently. Substitutability matters. Money/Capital is a better handover metric.
          *   *NZPTP Prediction:* Coherent/Necessary. Some natural capital is non-substitutable. Wealth doesn't fix a broken climate system.
          *   *Interpretation:* This tests substitutability of natural capital vs. manufactured capital.

  6.  **Evaluating the Probes (Rigging Check):**
      *   *Overlap:* Seems fair. It isolates time preference from identity/uncertainty.
      *   *Handover:* Slightly rigged toward NZPTP. DOs usually argue for *overall* welfare handover, not *specific asset* handover. A strict "tonne-for-tonne" rule ignores technological progress in carbon removal. I need to note this in the meta-analysis.

  7.  **Meta-Analysis (The "Prof Cares Most" Part):**
      *   *Verbal Disputes:* Is it about "discounting" or "risk aversion"? Often DOs hide risk aversion in the discount rate.
