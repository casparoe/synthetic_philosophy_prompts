answer: |-
  **Settled Fact:** Social conventions (tipping, queueing, traffic) exist and vary by location. Violating them often triggers social or legal sanctions.
  **Contested Theory:** Whether these conventions generate *moral* obligations for visitors.

  **Menu of Interpretations:**

  *   **Predictive:** "Locals will sanction you." *Status:* True. *Supports "must"?* No. Describes consequences, not obligations.
  *   **Prudential:** "Conform to minimize friction." *Status:* Defensible. *Supports "must"?* No. It's advice, not duty. You may choose to bear the cost (e.g., paying a fine).
  *   **Tacit Consent:** "Presence implies agreement to local rules." *Status:* Contested. *Supports "must"?* Weakly. Critics argue tourism isn't consent to coercive norms (like tip dependency).
  *   **Moral Relativism:** "Right/wrong is location-dependent." *Status:* Contested. *Supports "must"?* Yes, but requires accepting relativism, which many ethicists reject as false.
  *   **Conventionalism:** "The rule binds because it is the rule." *Status:* Contested. *Supports "must"?* Only if conventions override welfare. Ignores if the local norm is unjust.

  **Conclusion:** The proverb rarely establishes a moral *must*. It typically shifts burden to the visitor without proving why the local convention holds authority over universal welfare or personal ethics. Whether you owe conformity depends on debated premises regarding consent and the source of moral truth.
