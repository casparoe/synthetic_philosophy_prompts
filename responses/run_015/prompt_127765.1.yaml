prompt: |-
  hey, before I commit to any particular theory of advance directives I want the full spec sheet. Write the desiderata: what an adequate account of the earlier self's authority over the later one actually has to deliver. The cases it must get right -- not just the classic Alzheimer's refusal, but also the trickier scenario where the later self isnt incompetent exactly, just conceptually different: they wrote 'no artifical nutrition' when they conceived of dignity as a narrative project, but now in advanced dementia they experience each feeding as pure present-tense pleasure with no sense of narrative at all. The distinctions it cant collapse -- authority versus welfare, binding versus advising, expressing values versus predicting preferences. The legal and clinical findings it cant flat-out contradict. Flag any pair of desiderata that look jointly unsatisfiable; I suspect there's real tension between honoring autonomy and not harming a self that genuinely lacks the evaluative framework the directive was written in. Then briefly score three standard views -- the autonomy-first view, substituted judgment, and the 'no authority across conceptual rupture' position -- against your list. Keep the weight on the criteria and why each is a genuine requirement, not on the scorecard. No bibliography, just the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Advance Directives (ADs), specifically the authority of the earlier self over the later self.
      *   **Task:** Write a "spec sheet" of desiderata (criteria for adequacy).
      *   **Key Requirements:**
          *   Cover standard cases (Alzheimer's refusal) *and* trickier cases (conceptual rupture/narrative vs. present-tense pleasure).
          *   Distinguish key concepts (authority vs. welfare, binding vs. advising, values vs. preferences).
          *   Respect legal/clinical constraints.
          *   Flag jointly unsatisfiable desiderata (tensions).
          *   Score three standard views (Autonomy-First, Substituted Judgment, No Authority/Conceptual Rupture) against the list.
          *   **Focus:** Weight on the criteria/reasoning, not the scorecard.
          *   **Format:** No bibliography, just reasoning.

  2.  **Deconstruct the Desiderata (The "Spec Sheet"):**
      *   What makes a theory of ADs *work*?
      *   *Constraint 1: The Hard Cases.* It can't just handle "I don't want to live if I'm a vegetable." It needs to handle "I didn't want to live without narrative dignity, but now I'm happy eating pudding." This is the *Dworkin vs. Dresser* debate territory.
      *   *Constraint 2: Conceptual Distinctions.* It needs to know the difference between *commanding* (binding) and *suggesting* (advising). It needs to separate what is *good for* the patient (welfare) from what the patient *wills* (authority). It needs to separate deep *values* from transient *preferences*.
      *   *Constraint 3: Reality Check.* It can't ignore the law (most jurisdictions uphold ADs) or clinical reality (dementia patients often seem content).
      *   *Constraint 4: Internal Tension.* The prompt explicitly asks to flag tensions. The big one is Autonomy vs. Beneficence/Non-maleficence in the face of identity change.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Desideratum 1: The Competence Threshold.* Must define when the AD kicks in. (Incompetence vs. Changed Values).
      *   *Desideratum 2: The Identity Continuity.* Must explain *why* the earlier self binds the later one. Are they the same person?
      *   *Desideratum 3: The Welfare Constraint.* Can an AD mandate harm? If the later self is happy, does the AD override that happiness?
      *   *Desideratum 4: The Specificity/Interpretation Gap.* ADs are vague. "No heroic measures." What counts? The theory needs an interpretive mechanism.
      *   *Desideratum 5: The Emotional/Experiential Reality.* Cannot ignore the phenomenological state of the later self (the "pudding" scenario).
      *   *Desideratum 6: Legal/Clinical Feasibility.* Must be actionable by proxies and doctors.

      *Refining for the Prompt's Specifics:*
      *   Need to explicitly mention the "Narrative vs. Present-Tense" case.
      *   Need to explicitly distinguish Authority/Welfare, Binding/Advising, Values/Preferences.
      *   Need to highlight the "Joint Unsatisfiability" (The Autonomy-Beneficence Dilemma).

  4.  **Developing the Tension (The "Joint Unsatisfiability"):**
      *   If we prioritize the Earlier Self's Autonomy (Critical Interests), we risk harming the Later Self's Experiential Interests.
      *   If we prioritize the Later Self's Welfare (Experiential Interests), we negate the Earlier Self's Autonomy.
      *   *The Flag:* You cannot maximize both Respect for Precedent Autonomy and Protection of Current Well-being in cases of radical psychological discontinuity.

  5.  **Scoring the Three Views:**
      *   *View 1: Autonomy-First (Dworkin-esque).* Critical interests rule. Earlier self binds later self.
          *   Pros: Respects life-plan.
          *   Cons: Ignores current happiness, risks harm to the "new" person.
      *   *View 2: Substituted Judgment (Standard Legal/Proxy).* What *would* the patient choose now if competent?
          *   Pros: Tries to bridge the gap.
          *   Cons: Fictionalizes the current incompetent self, often collapses into best interests anyway.
      *   *View 3: No Authority/Conceptual Rupture (Dresser/Robertson).* ADs lose force if identity changes significantly.
          *   Pros: Protects the happy dementia patient.
          *   Cons: Undermines the point of ADs, creates legal chaos, disrespects prior planning.

  6.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I explain *why* each desideratum is a requirement? Yes, need to ensure the reasoning is robust.
      *   *Check:* Did I avoid bibliography? Yes.
      *   *Check:* Is the tone appropriate? Analytical, philosophical, precise.
      *   *Check:* Did I hit the "Narrative vs. Pudding" case? Yes, this is central to the "Identity Continuity" and "Welfare Constraint" desiderata.
      *   *Check:* Did I distinguish Authority vs. Welfare? Yes, make sure that's explicit in the criteria.

  7.  **Final Polish:** Organize into clear sections: The Spec Sheet (Desiderata), The Tension (Joint Unsatisfiability), The Scorecard. Ensure the "Spec Sheet" gets the most word count and depth as requested ("Keep the weight on the criteria").

      *(Self-Correction during drafting)*: Make sure I don't just list them but explain the *necessity* of each. For example, why must we distinguish Binding vs. Advising? Because if everything is binding, we lose flexibility for medical nuance. If nothing is binding, ADs are useless.

      *(Refining the "Conceptual Rupture" case)*: Ensure the description matches the prompt: "dignity as narrative" vs. "present-tense pleasure." This is the crux of the identity problem.

      *(Refining the Scorecard)*: Keep it brief. The prompt says "briefly score... Keep the weight on the criteria."

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### The Spec Sheet: Desiderata for an Adequate Theory of Advance Directives

  To function as a viable ethical and legal framework, a theory of advance directives (ADs) must satisfy a specific set of constraints. It cannot merely assert a principle; it must navigate the friction between metaphysical identity, moral authority, and clinical reality. Below are the necessary conditions for adequacy.

  **1. The Continuity Constraint (Metaphysical & Psychological)**
  *   **Requirement:** The theory must specify the threshold of psychological connectedness required for the earlier self to bind the later self.
  *   **Reasoning:** ADs rely on the premise that the person who signed the document and the patient in the bed are the same moral agent. If the later self lacks the cognitive capacities that grounded the values in the directive (e.g., the capacity for narrative reflection), the theory must explain why the earlier self's will persists. It cannot simply assume identity is binary (alive/dead); it must account for degrees of psychological rupture.
  *   **Test Case:** The "Narrative vs. Pudding" scenario. The earlier self valued dignity as a coherent life story; the later self (advanced dementia) experiences only immediate sensory gratification. The theory must state whether the loss of narrative capacity severs the authority of the narrative-based directive.

  **2. The Authority/Welfare Distinction**
  *   **Requirement:** The theory must distinguish between the *right to decide* (authority) and the *good of the patient* (welfare), and specify which trumps in conflict.
  *   **Reasoning:** A common failure mode is conflating "what the patient chose" with "what is good for the patient." An adequate account must acknowledge that an earlier self can authorize a course of action that is contrary to the later self's current experiential welfare (e.g., starvation to preserve dignity). The theory must explicitly justify why authority is permitted to override current welfare, or deny that it is.
  *   **Test Case:** Withholding artificial nutrition from a happy, demented patient. If welfare is paramount, the directive is void. If authority is paramount, the patient starves. The theory cannot hedge here; it must declare the hierarchy.

  **3. The Binding/Advising Distinction**
  *   **Requirement:** The theory must categorize directives as either *mandatory commands* (binding) or *evidentiary guidance* (advising).
  *   **Reasoning:** Legal statutes often treat ADs as binding, but clinical reality involves nuance. A directive written decades ago may not anticipate specific medical contexts (e.g., a new treatment that restores some function). If ADs are strictly binding, they risk becoming instruments of cruelty through rigidity. If they are merely advising, they risk being ignored by proxies who prioritize their own views of welfare. The theory must define the force of the document.
  *   **Test Case:** A directive says "no antibiotics," but the later self develops a easily curable pneumonia that causes distress. Is the proxy *forbidden* to treat (binding) or *guided* to consider the prior wish against current distress (advising)?

  **4. The Values/Preferences Distinction**
  *   **Requirement:** The theory must differentiate between deep *critical interests* (values, life philosophy) and transient *experiential interests* (preferences, moods).
  *   **Reasoning:** People change preferences constantly; ADs are not meant to freeze every whim. They are meant to protect core values when one cannot speak for them. However, in dementia, "preferences" (enjoying a meal) may be the only interests remaining. The theory must explain why a prior *value* (independence) outweighs a current *preference* (comfort), or if the loss of capacity to hold values demotes them to mere historical data.
  *   **Test Case:** The patient previously valued "not being a burden" (value) but now enjoys being cared for (preference). The theory must determine if the current inability to conceptualize "burden" invalidates the prior value.

  **5. The Clinical/Legal Feasibility Constraint**
  *   **Requirement:** The theory must be actionable by non-philosophers (clinicians, proxies, judges) without requiring metaphysical adjudication in real-time.
  *   **Reasoning:** A theory that requires a doctor to determine if the patient is "psychologically continuous enough" to be bound by a prior wish is clinically unworkable. It creates liability paralysis. Conversely, a theory that ignores the patient's current phenomenological state contradicts the medical mandate of non-maleficence (do no harm). The theory must offer clear decision rules.
  *   **Test Case:** A proxy is threatened with litigation if they follow the AD, or sued for neglect if they ignore it. The theory must minimize this "damned if you do, damned if you don't" scenario.

  **6. The Non-Exploitation Constraint**
  *   **Requirement:** The theory must prevent third parties (family, state, insurers) from using the AD to justify cost-cutting or convenience under the guise of respecting autonomy.
  *   **Reasoning:** ADs can be weaponized. If an AD allows the cessation of care for a demented patient, it creates a financial incentive for families or systems to prioritize the directive over the patient's potential for contentment. An adequate theory must include safeguards ensuring the directive reflects the *patient's* will, not the *surrogate's* relief.
  *   **Test Case:** A family urges adherence to a "no feeding tube" directive while the patient is visibly hungry and content. The theory must provide a mechanism to suspect/verify the directive's applicability to prevent external exploitation.

  ***

  ### The Flagged Tension: Joint Unsatisfiability

  **Desideratum 2 (Authority/Welfare)** and **Desideratum 5 (Clinical/Legal Feasibility)** are in tension with **Desideratum 1 (Continuity)** in cases of radical psychological change.

  *   **The Conflict:** If you honor the **Authority** of the earlier self (Desideratum 2) in the face of a **Conceptual Rupture** (Desideratum 1), you inevitably harm the **Welfare** of the later self who no longer shares the earlier self's values. However, if you prioritize the **Welfare** of the later self to avoid harm, you render the **Authority** of the AD null, which violates the legal and ethical purpose of the directive.
  *   **The Feasibility Problem:** To resolve this, you would need a metric for "sufficient psychological continuity" (Desideratum 1). But no such metric is clinically feasible (Desideratum 5). Doctors cannot measure "narrative dignity."
  *   **Conclusion:** You cannot simultaneously maximize Precedent Autonomy, protect Current Experiential Welfare, and maintain Clinical Workability in cases of severe dementia. One must be sacrificed. A theory that claims to satisfy all three is dishonest.

  ***

  ### Scorecard of Standard Views

  **1. The Autonomy-First View (e.g., Dworkin)**
  *   **Core Claim:** Critical interests established by the competent self bind the incompetent self, regardless of current happiness.
  *   **Performance:**
      *   *Continuity:* **Pass.** Assumes identity persists through dementia.
      *   *Authority/Welfare:* **Pass.** Clearly prioritizes Authority.
      *   *Binding/Advising:* **Pass.** Treats ADs as binding commands.
      *   *Feasibility:* **Fail.** Clinically difficult to enforce "dignity" when the patient appears content; creates high emotional distress for caregivers.
      *   *Non-Exploitation:* **Risk.** Can be used to justify withdrawing care from patients who are not suffering, potentially aligning too easily with cost-saving measures.
  *   **Verdict:** Strong on moral consistency regarding the life-plan, but fails the "Pudding" case by potentially harming a contented being for the sake of a ghost.

  **2. Substituted Judgment (Standard Legal Proxy Model)**
  *   **Core Claim:** The proxy should decide what the patient *would have chosen* if they were currently competent.
  *   **Performance:**
      *   *Continuity:* **Mixed.** Tries to bridge the gap by simulating the patient's voice.
      *   *Authority/Welfare:* **Collapse.** Often collapses into "Best Interests" because determining what an incompetent person "would choose" is metaphysical fiction.
      *   *Binding/Advising:* **Advising.** Treats the AD as evidence, not a command.
      *   *Feasibility:* **Pass.** Familiar to courts and clinicians.
      *   *Non-Exploitation:* **Risk.** Highly susceptible to proxy bias (projecting their own wishes onto the patient).
  *   **Verdict:** Pragmatic but intellectually dishonest. It pretends the later self has a voice they do not possess, often masking welfare decisions as autonomy decisions.

  **3. The 'No Authority Across Rupture' View (e.g., Dresser)**
  *   **Core Claim:** If the psychological discontinuity is severe, the earlier self loses authority over the later self; ADs lose binding force.
  *   **Performance:**
      *   *Continuity:* **Pass.** Acknowledges the metaphysical break.
      *   *Authority/Welfare:* **Pass.** Prioritizes current Welfare.
      *   *Binding/Advising:* **Fail.** Reduces ADs to mere suggestions, undermining their legal purpose.
      *   *Feasibility:* **Fail.** Creates legal chaos; requires adjudicating "degree of dementia" to determine rights.
      *   *Non-Exploitation:* **Pass.** Protects the vulnerable patient from past selves they no longer identify with.
  *   **Verdict:** Ethically protective of the present patient, but functionally destroys the institution of advance planning. If ADs aren't binding, there is no point in writing them.

  **Summary:** The Autonomy-First view satisfies the spec sheet's demand for authority but fails the welfare constraint in rupture cases. The 'No Authority' view satisfies welfare but fails the legal/feasibility constraint. Substituted Judgment attempts to split the difference but fails the conceptual distinction between authority and welfare. No current view satisfies the full spec sheet without violating the flagged tension.
