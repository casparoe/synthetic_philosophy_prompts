answer: |-
  ### Brainstorming

  Right, let's unpick this. The heterogeneity problem is the graveyard of many a naive feeling theory. Broadie's point stands: the phenomenology of itching and solving a theorem are worlds apart. If 'pleasure' names a quality like 'redness', it's dead in the water. Your proposal shifts the metaphysical weight from intrinsic quality to structural role. It's reminiscent of functionalism, but applied to the axiology of experience rather than mental states generally.

  The crucial constraint you've set is that the ordering isn't explained by them already being pleasures. That's the non-circularity condition. It prevents the trivial solution: "They are comparable because they are pleasures, and they are pleasures because they are comparable." You need the comparability to ground the classification.

  But here's the rub: how do we establish the ordering without already identifying the relata? If I ask a subject, "Is the beer more pleasant than the proof?", I am presupposing both are candidates for pleasure. If one is actually a pain (say, a sharp cramp), they might still say "the beer is more pleasant", but that implies pain sits on the same scale. Your condition says "nothing that isn't a pleasure enters that same ordering". This isolates the pleasure scale from pain and neutrality. That makes establishing the transitivity empirically and phenomenologically much harder. Where are the anchors?

  Then there's the transitivity issue. Phenomenal sorites cases are notorious. If A is indistinguishably more pleasant than B, and B than C, eventually A should be indistinguishable from C, yet A is clearly more pleasant than Z. Does the comparative relation hold strictly? Or is it fuzzy? If it's fuzzy, is it a single relation?

  Rowan's 0.7 suggests he thinks the structure holds firm despite the qualitative mess. Your 0.35 suggests you think the structure fractures under the weight of incommensurability or circularity. I suspect the transitivity claim is the breaking point. Neuroeconomics suggests a common currency, but that's functional, not metaphysical. You're asking for metaphysical unity.

  Also, consider 'relief'. Is relief a pleasure? If it's the cessation of pain, does it enter the ordering? If pains are excluded, how does relief compare to positive joy? If relief is a pleasure, but defined by the removal of a non-pleasure, does that violate the 'nothing that isn't a pleasure enters' clause? It's a tightrope walk.

  I need to be careful with the 'natural kind' aspect. Pleasures might not be a natural kind in the chemical sense, but they might be a functional kind. Your proposal makes them a structural kind.

  Okay, I have a handle on the tensions. I'll formulate the credence and decomposition now.

  ### Credence and Decomposition

  **My Credence:** 0.40

  **Decomposition:**

  1.  **That pleasures form a natural kind or have any unifying property at all:** 0.65
      *   *Justification:* While qualitative unity fails, it is plausible there is *some* metaphysical glue, even if structural rather than intrinsic.
  2.  **That the shared-phenomenal-feature route fails:** 0.90
      *   *Justification:* The phenomenological diversity between, say, schadenfreude and thermal comfort is too vast to sustain a single qualitative natural kind.
  3.  **That hedonic comparability is really transitive and single-dimensional across the awkward cases:** 0.35
      *   *Justification:* Phenomenal sorites paradoxes and value pluralism suggest strict transitivity and single-dimensionality often break down in edge cases.
  4.  **That comparability could do the unifying work rather than presuppose it:** 0.55
      *   *Justification:* Establishing the ordering without prior identification of the relata risks circularity or relies on behavioural proxies that are not metaphysically decisive.

  **How they combine:**
  I treat these as largely conjunctive necessary conditions; if comparability is not transitive (3), the theory fails regardless of the other successes, so the overall credence is capped by the lowest probability term, adjusted slightly upwards by the strength of the motivation (2).

  **Least confident term:**
  That hedonic comparability is really transitive and single-dimensional across the awkward cases.

  ### Disagreement Analysis

  **Where you and Rowan disagree:**
  You and Rowan are most likely disagreeing on the third term: **that hedonic comparability is really transitive and single-dimensional across the awkward cases.**
  Your credence of 0.35 suggests you suspect incommensurability or intransitivity lurks in the 'awkward cases' (like malicious joy versus sensory relief), whereas Rowan's 0.7 implies he believes a single scale of 'pleasantness' can robustly rank all such experiences without remainder.

  **Moving Evidence:**
  The single argument that would move my number most is **empirical psychophysical evidence demonstrating systematic intransitivity in reported pleasure rankings across distinct categories.**
  If studies showed that subjects reliably rank A > B, B > C, but C > A when comparing distinct types of pleasure (e.g., intellectual vs. sensory), my credence would drop sharply towards 0.1; conversely, robust evidence of a stable, neural common currency specifically correlating with phenomenological reports would raise it towards 0.6.
