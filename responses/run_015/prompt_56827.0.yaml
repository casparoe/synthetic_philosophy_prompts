          2.  Claim-by-Claim Audit.
          3.  Addressing (a) Moral Argument.
          4.  Addressing (b) Honor/Reputation.
          5.  Addressing (c) Conclusions (Economics & Reform).
          6.  Addressing (d) The Final Takeaway (Slavery/Dueling).

  7.  **Final Review against constraints:** Did I answer what to trust? Yes. Did I address a, b, c, d? Yes. Did I explain why slavery ended? Yes.

      *(Self-Correction on "Economics"):* Be careful not to say economics did *nothing*. Appiah acknowledges the West Indies sugar market was declining. His point is that abolition happened *before* it became unprofitable in some contexts, and that the *will* to enforce abolition came from honor, not profit.

      *(Self-Correction on "Persuasion"):* Appiah's point is that *abstract* moral argument fails. *Social* moral argument (shaming) works.

      *(Self-Correction on "Dignity"):* The summary says dignity can't be weaponized. Appiah says dignity *is* the weapon in modern times (e.g., human rights discourse relies on shame).

