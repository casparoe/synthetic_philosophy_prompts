answer: |-
  **MEMORANDUM OF UNDERSTANDING: SIMPSON'S PARADOX AND DECISION CONTEXTS**

  **TO:** The Department  
  **FROM:** The Reconciliation Committee  
  **SUBJECT:** Resolving the Pooler–Splitter Impasse  

  ### 1. Agreed Claims
  Both camps accept the following mathematical and logical premises:

  1.  **Arithmetic Validity:** Both the marginal (pooled) table and the conditional (stratified) tables are mathematically correct summaries of the observed data.
  2.  **Mechanism of Reversal:** The paradox arises strictly from unequal distributions of the stratifying variable across treatment groups, combined with the stratifying variable's association with the outcome.
  3.  **Insufficiency of Data:** No statistical table, pooled or stratified, settles the question of causality or policy without external context regarding the data-generating process.
  4.  **Weighting:** The pooled estimate is a weighted average of the stratum-specific estimates; the weights are determined by the sample composition, not necessarily the population structure.
  5.  **Risk of Conditioning:** Conditioning on a variable can remove confounding bias (if the variable is a pre-treatment confounder) or introduce selection bias (if the variable is a post-treatment collider or mediator).

  ### 2. Remaining Disagreements
  Where the camps diverge on default presumptions and interpretation.

  | Topic | The Pooler Position | The Splitter Position |
  | :--- | :--- | :--- |
  | **Default Presumption** | The marginal association represents the real-world consequence of a policy as implemented; it is the primary metric for decision-makers. | The conditional association represents the intrinsic causal mechanism; the marginal figure is an artefact of arbitrary sampling weights. |
  | **Stratification Risk** | Stratification risks conditioning on colliders or mediators, thereby blocking the very pathways through which the treatment operates. | Aggregation risks hiding confounding variables, thereby attributing structural effects to the treatment that do not belong to it. |
  | **The "Truth"** | Truth is defined by the *effect of the intervention* on the population as it currently stands (Effectiveness). | Truth is defined by the *causal efficacy* of the treatment, independent of the current allocation of patients (Efficacy). |
  | **Actionability** | If we cannot target subgroups, the marginal effect is the only figure that predicts the outcome of a universal rollout. | If we do not understand the structural cause, we cannot predict how the marginal effect will change if the population mix shifts. |

  ### 3. The Cruxes
  We distinguish between disputes over terminology and genuine structural disagreements.

  **Verbal Cruxes (Resolved by Definition)**
  *   **"Effect":** Poolers refer to the *Total Effect* (marginal); Splitters often refer to the *Direct Effect* (conditional). Both are valid causal quantities depending on the question.
  *   **"Bias":** Poolers view the difference between marginal and conditional as "context"; Splitters view it as "confounding". This is semantic; the mathematical difference is agreed upon.

  **Genuine Cruxes (Require Causal Assumptions)**
  *   **Causal Structure (DAGs):** Is the stratifying variable a *confounder* (causes treatment and outcome) or a *mediator/collider* (caused by treatment)?
      *   *If Confounder:* Conditioning is required (Splitter wins).
      *   *If Mediator:* Conditioning is misleading for total impact (Pooler wins).
  *   **Action Space:** Can the decision-maker target subgroups?
      *   *If Targeting is Possible:* Conditional effects guide allocation (Splitter wins).
      *   *If Universal Rollout Only:* Marginal effects guide the binary decision (Pooler wins).

  ### 4. Case Studies: Predictions and Resolutions
  Both sides accept the following cases as bearing on the cruxes. Below are the predictions each side would make *in advance*, followed by the resolution.

  **Case A: The Surgeons**
  *Scenario:* Surgeon 1 deliberately takes the nastier cases. Surgeon 1 has worse overall survival, but better survival within every severity band.
  *   **Pooler Prediction:** **Hire Surgeon 2.** The hospital is judged on overall mortality. Hiring Surgeon 1 lowers the aggregate survival rate given the current referral pattern.
  *   **Splitter Prediction:** **Hire Surgeon 1.** Severity is a pre-treatment confounder. The conditional table reveals Surgeon 1 is more skilled. The marginal table is confounded by case mix.
  *   **Resolution:** **Splitter is correct on causality; Pooler is correct on institutional risk.** If the goal is to identify surgical skill, condition on severity. If the goal is to predict next year's mortality rates *without changing referral patterns*, the marginal figure holds. However, as the allocation is non-random, the marginal figure is a biased estimate of skill.

  **Case B: The Follow-up Programme**
  *Scenario:* A programme increases attendance at outpatient appointments, which improves health. The Trust must roll out to everyone or scrap (no targeting). The audit stratifies by whether patients attended.
  *   **Pooler Prediction:** **Roll out.** The marginal association is positive. Since we cannot target only those who would attend, the total effect (including the attendance mechanism) is what matters.
  *   **Splitter Prediction:** **Scrap.** Stratifying by attendance blocks the causal path. Within the "Attended" and "Did Not Attend" strata, the programme shows no direct effect. The marginal gain is an artefact of the mediation.
  *   **Resolution:** **Pooler is correct on the decision.** Attendance is a *mediator*, not a confounder. Conditioning on it hides the programme's benefit. Furthermore, the action space is binary (all or nothing); therefore, the *Total Effect* (marginal) is the correct metric for the policy decision, even if the *Direct Effect* (conditional) is null.

  ***

  **Conclusion:** The Pooler heuristic serves well when the stratifying variable is a mediator or when the action space is universal. The Splitter heuristic serves well when the stratifying variable is a confounder and the goal is causal identification. Future disputes must begin with a Directed Acyclic Graph, not a table.
