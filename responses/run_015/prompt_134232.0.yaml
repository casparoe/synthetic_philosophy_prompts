      *   *Splitters:* Causal purists (often). "What is the intrinsic efficacy?" They care about the *average treatment effect* (ATE) assuming randomisation or proper control for confounders. They worry about confounding bias in the marginal table.
      *   *The Paradox:* $P(Y|X) \neq P(Y|X, Z)$ and the sign flips. Mathematically, it's just weighted averages. Causally, it's about confounding vs. mediation vs. selection bias.

