answer: |-
  To be adequate for the purpose of guiding a legislature or a large funder, a theory of the badness of human extinction must deliver a specific set of outputs that allow for the comparison of existential risk reduction against other moral imperatives. The first desideratum concerns the locus of the harm, specifically whether the badness of extinction must be bad for someone. If a theory insists that all badness must be grounded in a welfare loss for a specific subject, it faces the immediate problem that the victims of extinction do not exist to be harmed. An adequate theory must therefore either defend a person-affecting view by identifying a subject who is worse off, such as the last generation deprived of a future, or it must explicitly permit impersonal badness, where the world is worse simply because value-containing entities are absent. If the theory chooses the latter path, it is permitted to say that the badness is a loss of potential value in the abstract, but it must explain why this abstract loss commands resources over concrete suffering alleviation. The second desideratum arises from the replacement case, in which every human being dies painlessly at once but is succeeded by a species whose lives go about as well as ours would have. An adequate theory must specify whether there is intrinsic value in human continuity distinct from the aggregate welfare of sentient beings. If the theory treats humans as mere vessels for utility, the replacement neutralizes the badness of extinction; if it treats human culture, history, or specific potential as irreplaceable, it must justify this species-specific partiality to a funder who might prioritize total sentient welfare.

  The third desideratum is the remnant case, in which a thousand people survive in isolation with no realistic prospect of growth or cultural recovery. Here the theory must distinguish between biological survival and the continuation of a civilization. If the badness of extinction is solely about the cessation of biological life, the remnant case averts the catastrophe; if the badness concerns the loss of a future trajectory of moral and intellectual development, the remnant case constitutes a functional extinction. The theory must clarify whether the value lies in the state of being alive or in the project of humanity. The fourth desideratum involves the consensual case, in which extinction is wanted by everyone then alive and nobody is killed against their will. An adequate theory must determine whether the autonomy of the present generation overrides the interests of the non-existent future. If the theory grounds value in consent, extinction is permissible; if it grounds value in the objective good of future existence, consent is irrelevant. The theory must resolve whether we are custodians of a future we do not own or owners of a future we may dispose of. The fifth desideratum addresses the non-identity wrinkle, acknowledging that the people who would exist if extinction were averted are almost none of the people who would otherwise have existed. Since preventing extinction changes the course of history and thus the identities of future people, a theory cannot claim that specific future individuals are harmed by extinction, because they would not exist otherwise. An adequate theory must navigate this by either rejecting the non-identity problem's moral force or by grounding the badness in something other than harm to specific individuals, such as the loss of a possible world of value.

  The sixth and final desideratum is the question of whether the theory owes a cardinal weight at all or may refuse to give one. For a legislature or funder, resources are finite and trade-offs are inevitable. A theory that declares extinction infinitely bad or lexically prior to all other goods fails to guide allocation when facing competing existential risks or immediate mass suffering. An adequate theory must provide a metric, whether cardinal or sufficiently granular ordinal, that allows the badness of extinction to be weighed against the cost of prevention and the benefit of alternative uses of capital. Without this, the theory is philosophically coherent but practically inert for the specified audience.

  When separating these desiderata into non-negotiable requirements and camp preferences, the distinction turns on the purpose of the theory as defined by the context of policy and funding. The demand that the badness be bad for someone is a preference of the person-affecting camp and should be classified as non-essential for adequacy in this context. Insisting on this constraint forces the theory into contortions regarding the non-identity problem and the rights of the non-existent, which are metaphysical prejudices rather than practical necessities for resource allocation. A theory that posits impersonal loss is fully adequate for a funder provided it can justify the value lost. Conversely, the demand for a cardinal weight or a comparable metric is a non-negotiable requirement. A legislature cannot act on a prohibition that admits no trade-offs, and a funder cannot prioritize a cause that claims infinite weight against other infinite claims. Therefore, while the metaphysical grounding of the harm is open to philosophical debate, the translatability of that harm into a decision-making metric is a functional necessity.

  There is, however, a subset of these desiderata that cannot be jointly satisfied if one adheres to strict person-affecting principles. The combination of the requirement that badness must be bad for someone, the acceptance of the non-identity problem, and the assertion that extinction is a major badness creates a contradiction. If badness requires a subject, and the subjects of the future do not exist and would not exist if we fail to prevent extinction, then there is no one for whom extinction is bad. To satisfy all three, one must resort to counterfactuals that claim the last generation is harmed by the absence of successors, but this stretches the concept of harm to a point that many find incoherent. Thus, a list of desiderata that includes a strict person-affecting constraint alongside the non-identity wrinkle and the goal of proving extinction is bad contains an internal contradiction that renders the theory inadequate for its own purpose. The useful result of this list is the realization that one must abandon the person-affecting constraint to maintain coherence regarding the future.

  The requirement that excludes the most accounts currently on offer is the demand for a cardinal weight that allows for trade-off analysis against other moral goods, as many deontological or lexical theories posit extinction as an absolute evil that cannot be quantified or compared. Scheffler's afterlife conjecture, the claim that our confidence in a collective human future is a condition of our valuing anything at all, does not get past this requirement. While Scheffler successfully explains why we psychologically and normatively depend on the existence of a future to make sense of our current values, he provides a condition for valuing rather than a metric for valuation. His account elucidates why extinction would be devastating to our current normative frameworks, but it does not generate a number or a comparative weight that tells a funder how much to spend on risk reduction versus malaria prevention. It explains the source of the stakes but not the exchange rate, leaving the theory descriptively powerful but prescriptively incomplete for the specific task of budgetary allocation.
