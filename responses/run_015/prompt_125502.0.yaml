              3.  **Narrative Cost:** The admission must risk the subject's reputation (not a humblebrag).
              4.  **Proportionality:** One or two instances; more suggests degeneracy.
              5.  **Shame Alignment:** The subject must recognize it as a failure, not a quirk.
          *   This distinguishes it from "humanizing details" (which are neutral) or "tragic flaws" (which are destructive).

      *   **5. "Boundary cases" (300 words):**
          *   (a) *General still drinking:* **Open Flaw.** Fails temporal closure. Undermines virtue (discipline). Becomes a warning, not a model.
          *   (b) *Real betrayal costing present:* **Disqualifying.** Fails shame/proportionality. If the cost is ongoing, the virtue isn't fully realized. Reader judges, doesn't imitate.
          *   (c) *Subject admits in memoir:* **Stronger Credential.** First-party Statement Against Interest. Higher truth value, but risks looking like calculated humility (humblebrag). Needs external verification to fully work.
          *   (d) *Hostile biographer includes flaw:* **Discredited.** Fails narrative intent. Used to destroy, not build. Reader rejects the virtue entirely.
          *   (e) *Worked too hard:* **Non-Flaw.** Fails shame alignment. This is a virtue signaling as vice. It insults the reader's intelligence. Doesn't certify truth because it isn't a real cost.

      *   **6. "Closed versus open" (150 words):**
          *   User's axis: Closed (past, finished) vs. Open (ongoing).
          *   Analysis: This is the correct joint. "Closed" allows the virtue to be the current state. "Open" makes the virtue contingent or compromised.
          *   Nuance: It's not just time, it's *moral resolution*. A past flaw that isn't repented is still "open" morally. A current struggle that is being actively fought can work (the "wrestling" narrative), but a current indulgence fails.
          *   Verdict: "Closed" is right, but define it as "morally resolved" rather than just "chronologically past."

