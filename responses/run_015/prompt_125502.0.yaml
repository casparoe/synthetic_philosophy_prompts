answer: |-
  1. "What I'm pointing at"
  You are describing a strategic narrative inoculation. The biographer includes a specific, contained vice not to humanize the subject for likability, but to certify the truth-value of the surrounding praise. By admitting a past failure, the text signals honesty, forcing the reader to accept the subsequent virtues as reported fact rather than propaganda. Crucially, the flaw must be resolved; it serves as a baseline from which the subject rose. This transforms the biography from hagiography into testimony. The flaw acts as a control variable: because the author admits this negative, the positive claims gain evidentiary weight. It makes the virtue look earned through struggle, not inherent through magic, thereby making it genuinely imitable.

  2. "Nearest established concepts"
  The Pratfall Effect (Aronson, 1966) suggests competence paired with clumsiness increases likability. This maps onto your observation that flaws make subjects approachable. However, it stops at social attraction; it does not explain increased moral authority or narrative trust. You aren't liking the saint more; you are believing them more. The Pratfall Effect makes a genius seem cute; your phenomenon makes a sinner seem holy.

  The legal doctrine of Statement Against Interest admits hearsay because people rarely lie to their own detriment. This explains why the reader believes the flaw is true. But it is an evidentiary rule, not a deliberate rhetorical strategy. It explains the input's credibility, not the output's moral utility. It tells us why we believe the drunk story, not why that story makes the general's later discipline more imitable.

  Rhetorical *Concessio* involves granting an opponent's point to strengthen one's own. This matches the structure: admitting vice to prove virtue. Yet *concessio* is usually argumentative, not characterological. It wins debates, not souls.

  *Verisimilitude* refers to the appearance of truth. Flaws add realism. But realism alone doesn't guarantee admiration; a realistic portrait can be damning. Your phenomenon requires the flaw to specifically bolster the virtue.

  Finally, *Felix Culpa* ("happy fault") suggests sin enables greater grace. This captures the theological redemption but misses the biographer's strategic intent. None of these fully capture the mechanism where a specific past vice validates present imitable virtue.

  3. "Verdict"
  There is no single established name. Psychology offers the Pratfall Effect, but it addresses likability, not moral credibility. Rhetoric offers *Concessio*, but that is argumentative, not biographical. Law offers Statement Against Interest, which explains truthfulness but not moral imitation. Literary theory discusses *verisimilitude*, but that is too broad. You have identified a specific intersection of narrative strategy, evidentiary credibility, and moral pedagogy that existing terminology treats separately. The phenomenon is recognized in practice—hagiographers and political biographers use it constantly—but it lacks a single dedicated technical label that encompasses the conditions you outlined.

  4. "Term, definition, conditions"
  Term: **Credentialing Vice**.

  Definition: A reported past specific moral failure included in a laudatory biography to validate the narrator's honesty and the subject's moral growth. It functions as a crucial evidentiary anchor, proving the text is not narrative propaganda. It transforms the subject from a static icon into a dynamic agent of change.

  Conditions for application:
  1. **Temporal Closure:** The vice must be clearly chronologically prior to the virtues being praised. It cannot be concurrent. The subject must have moved beyond it.
  2. **Unimitability:** The reader must not be invited to copy the vice, only the recovery. The vice is the obstacle, not the path. It is the darkness that proves the light.
  3. **Narrative Cost:** The admission must risk the subject's reputation. It cannot be a virtue disguised as a flaw. It must be genuine.
  4. **Proportionality:** Strictly limited dose; one or two instances. Multiple instances suggest degeneracy rather than growth. Too many flaws overwhelm the virtue.
  5. **Shame Alignment:** The subject must recognize it as a failure, not a quirk. If they are proud of it, it becomes rebellion, not redemption.

  This distinguishes it from "humanizing details" (which are neutral) or "tragic flaws" (which are destructive). A Credentialing Vice functions as proof of capacity for change, turning the subject from an idol into a true model. Finally, it signals that the virtue was won, not inherited. Ultimately, it makes the saint's life a map rather than a monument.

  5. "Boundary cases"
  (a) **General still drinking:** Clearly Open Flaw. Fails temporal closure. Undermines virtue (discipline). Becomes a warning, not a model. The vice competes with the virtue, creating cognitive dissonance rather than narrative arc. The reader sees a drunk general, not a reformed one. The flaw is active, so it contaminates the victory.
  (b) **Real betrayal costing present:** Disqualifying. Fails shame/proportionality. If the cost is ongoing, the virtue isn't fully realized. Reader judges, doesn't imitate. The moral debt is unpaid, so the credit is invalid. The subject remains defined by the harm, not the repair. Redemption requires restitution.
  (c) **Subject admits in memoir:** Stronger Credential. First-party Statement Against Interest. Higher truth value, but risks looking like calculated humility (humblebrag). Needs external verification to fully work. Self-reporting lacks the biographer's third-party validation. It may seem like performative modesty rather than honest accounting.
  (d) **Hostile biographer includes flaw:** Discredited. Fails narrative intent. Used to destroy, not build. Reader rejects the virtue entirely. The flaw becomes the headline, not the footnote. Context strips the redemptive power, leaving only the scandal.
  (e) **Worked too hard:** Non-Flaw. Fails shame alignment. This is a virtue signaling as vice. It insults the reader's intelligence. Doesn't certify truth because it isn't a real cost. It confirms bias rather than challenging it. It reinforces the pedestal instead of bridging the gap. Here, only cases meeting all five conditions effectively function as true narrative credentials.

  6. "Closed versus open"
  Your axis is correct but needs refinement. "Closed" implies chronologically past, but the crucial factor is **moral resolution**. A past flaw that isn't repented is still "open" morally. A current struggle that is being actively fought can work (the "wrestling" narrative), but a current indulgence fails. The distinction isn't just time; it's whether the flaw is currently competing with the virtue. If the vice is active, it competes. If it is resolved, it serves as a foundation. "Closed" is right, provided you define it as "morally resolved" rather than "chronologically past." The flaw must be a staircase, not a chain.

  7. "So does the genre teach anything"
  Yes, the genre teaches, but specifically because of this mechanism. If the saint was always perfect, you can't be them; their virtue is innate, not achieved. The Credentialing Vice proves the virtue is a practice, not a nature. The mechanism that makes it convincing (honesty about failure) is the same that makes it usable (proof of change). Your friend's "self-flattery" charge fails because the flaw prevents identification with perfection, forcing identification with the *process* of improvement. The book becomes a map of transformation rather than a display of status. It teaches morality by demonstrating that morality is attainable through struggle, validated specifically by the biographer's willingness to report the struggle honestly.
