      *   **Side B (Critics/Liberal-Democrats):**
          *   *Core Claim:* Rights + Procedure = Legitimacy. Outcomes don't justify rights violations.
          *   *Evidence:* Repression in Singapore/China, structural unreplicability.
          *   *Underlying Logic:* Deontological/Contractarian. Legitimacy is *inherent* in the process (consent). You can't "buy" legitimacy with welfare.
          *   *Implicit Definition:* Legitimacy = Moral right to rule based on consent/autonomy.

  3.  **Evaluate the Nature of the Impasse:**

      *   *Is it merely verbal?* Both use the word "legitimacy," but do they mean the same thing?
          *   Side A often means *stability* or *sociological acceptance* (Weberian).
          *   Side B means *normative justification* (Rawlsian/Habermasian).
          *   *Verdict:* Partially verbal, but not *just* verbal. The definitions reflect deeper moral commitments.
      *   *Is it substantive?* Yes. It's a clash between Consequentialism (outcomes matter most) and Deontology (rights/process matter most). Can welfare compensate for lack of consent? One side says yes, the other says no.
      *   *Are they answering different questions?*
          *   Side A: "Why do people obey?" (Sociological/Functional).
          *   Side B: "Why *should* people obey?" (Moral/Normative).
          *   *Verdict:* This is the strongest diagnostic angle. The conflation of *effectiveness* with *rightfulness* is the core confusion.

  4.  **Analyze the "Hidden Disagreements" (User's Hypothesis):**

      *   *Counterfactuals:* Would democracy have failed? (Hard to prove, leads to speculation).
      *   *Forward vs. Backward:* Does past performance grant future right? (Humean convention vs. Social Contract).
      *   *Ex Post vs. Ex Ante:* Is legitimacy a reward or a prerequisite?
      *   *Insight:* These are symptoms of the deeper Sociological vs. Normative split.

  5.  **Formulate the Diagnosis:**

      *   **Thesis:** The impasse is a **category error** resulting from the conflation of *sociological legitimacy* (stability/compliance) with *normative legitimacy* (moral rightfulness).
      *   **Support:**
          *   Defenders treat legitimacy as a *dependent variable* (output of governance).
          *   Critics treat legitimacy as an *independent variable* (input/condition of governance).
          *   The Singapore/China examples work for Side A because they show compliance. They fail for Side B because they show coercion/lack of consent.
      *   **The "Verbal" Aspect:** They share a label ("Legitimacy") but operate with incompatible ontologies.
      *   **The "Substantive" Aspect:** Even if definitions were clarified, the moral disagreement remains (Utilitarianism vs. Rights Theory).

  6.  **Determine Pathways to Progress:**

