      *   Ensure the distinction between *sociological* (Weber) and *normative* (Beetham/Rawls) is clear, as this is the standard political science resolution to this specific debate.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific question?* Yes (Diagnose nature, ground in arguments, tell what counts as progress).
      *   *Is the Singapore/China analysis nuanced?* Need to ensure I don't just dismiss the authoritarian claim but explain *why* it holds water sociologically even if it fails normatively.
      *   *Is the post-conflict context utilized?* Yes, this is crucial. In post-conflict, "order" is often prioritized initially, making the performance argument more salient than in stable democracies. I need to highlight this temporal dimension.

