  ### Addendum: Guidance for the Independent Researcher

  *Since you mentioned you do not have formal academic training, here is some specific advice on executing this proposal:*

  1.  **Citation Discipline:** In academic philosophy, failing to cite the origin of an idea is considered a serious error. When you mention "transparency," cite Harman or Tye. When you mention "illusionism," cite Frankish. Even if you read about them in a secondary source, try to find the original paper.
  2.  **The "Steel-Man" Rule:** You mentioned you suspect the Dual-Illusion model is correct. In your essay, you must argue against your own suspicion. Spend significant time trying to prove that the Single-Illusion model *could* work. If you can defeat the strongest version of the opposing view, your conclusion will be much stronger.
  3.  **Avoid "Intuition Pumping":** It is tempting to say, "But it just *seems* obvious that..." In philosophy, your intuition is data, not proof. You must explain *why* the intuition exists and whether it is reliable.
  4.  **Feedback Loop:** Since you have friends interested in this topic, use them. But ask them to critique your *arguments*, not just agree with your *conclusions*. Ask them: "Where is the weakest link in this chain?"
  5.  **Writing Style:** Keep sentences clear. Philosophy often suffers from unnecessary jargon. If you can say "mental state" instead of "cognitive vehicular instantiation," do so, provided you define your terms early on.

  This proposal provides the scaffold. The intellectual labor of building the argument rests on your engagement with the texts and the rigor of your analysis. Good luck.
