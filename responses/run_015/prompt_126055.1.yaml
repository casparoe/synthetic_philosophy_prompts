      - Predictions: Regret, neural conflict, response to pre-commitment.
      - Ranking: 1. Conceptual, 2. Empirical, 3. Formal.

      *Wait, let's look closer at the Empirical one.* If neuroeconomics proves a *single* maximiser, it directly contradicts the *existence* of distinct agents. Conceptual incoherence argues we *can't make sense* of the agents. Empirical argues they *aren't there*. Empirical might be more damaging to a naturalist. However, the prompt asks about a "committed defender". They will fight empirical data harder than logic. Logic is their home turf. I will rank Conceptual as most severe because it attacks the coherence of the terms themselves.

      *Let's refine the British English:* "behaviour", "modelling", "analyse", "defence", "programme", "centre".

      *Let's refine the "Insulation" argument:* If every outcome is an equilibrium, the theory is unfalsifiable. This is a Popperian critique.

