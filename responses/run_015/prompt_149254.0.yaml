      *   Another angle: **Scale-Relative Ontology.** At the ant level, it's behavior. At the colony level, it's computation. At the human level, it's mind. The "mind" label depends on the granularity of observation.
      *   Another angle: **The User's Biology Background.** The user knows organisms are just cells working together. Where does the "self" start? The "Missing Piece" is distinguishing between *intelligence* (problem solving) and *sentience* (feeling).

  5.  **Drafting the Response (Iterative Process):**

