prompt: |-
  ok so my little sister is getting married in like two weeks and I agreed to give the maid of honor speech and now I'm regretting it haha. She had a pretty chaotic mid-twenties — job-hopping, ghosting people, that bad breakup where she was definately not the good guy — but she's also the person who drove six hours in a snowstorm when I had my kid early and basically lived on my couch for a month doing night feeds with me. The crowd is gonna be weird: on one side her old friend group who saw all the mess up close, on the other her fiance's big extended family who've only known perfect adult version of her.

  I don't want to stand up there and lie about her being an angel the whole time, but I also think that whole thing where you technically tell the truth but leave stuff out so people get the wrong idea is just as bad, maybe worse cause its sneaky. Can you write me like a 4 minute toast that threads that? Like it has to be fully honset, no lies and no misleading-by-omission either, but still actually sweet and funny and not awkward for a wedding. And can you work in a line or two where I own that I'm not doing the airbrushed version, in a way that lands for both sides of the room without sounding like an ethics lesson?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older sibling (likely brother or sister, tone suggests close bond) of the bride.
      *   **Occasion:** Wedding toast (Maid of Honor).
      *   **Timeline:** 2 weeks away.
      *   **Bride's History:** Chaotic mid-20s (job-hopping, ghosting, messy breakup where she wasn't the hero).
      *   **Bride's Virtues:** Incredibly loyal/supportive in crises (drove 6 hours in snow for birth, stayed a month for night feeds).
      *   **Audience:** Mixed bag. Bride's old friends (know the mess) + Groom's family (know the "perfect" version).
      *   **Constraint 1 (Crucial):** Must be fully honest. No lies. No misleading omissions.
      *   **Constraint 2 (Crucial):** Must still be sweet, funny, and appropriate for a wedding (not awkward/cringe).
      *   **Constraint 3:** Include a meta-commentary line about not doing the "airbrushed version" that lands well without sounding preachy.
      *   **Length:** Approximately 4 minutes spoken (roughly 500-600 words at a moderate pace).

  2.  **Deconstruct the "Honesty" Challenge:**
      *   *The Trap:* Saying "She used to be a mess" can embarrass the groom's family or make the bride look bad on her big day.
      *   *The Solution:* Frame the chaos as *growth* and *intensity*, not just "bad behavior." Acknowledge the past without detailing the specific scandals (ghosting, bad breakup) explicitly, but imply them strongly enough that the old friends nod and the new family understands she's human.
      *   *The Core Truth:* She isn't perfect; she's *real*. Her love is fierce, sometimes messy, but ultimately reliable when it counts.
      *   *The "Airbrushed" Line:* Needs to be self-deprecating and warm. "I could tell you the PG version, but you married the R-rated reality." (Maybe too risky). Better: "I could polish this up, but that wouldn't be her."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, set the tone (warm, slightly nervous).
      *   **The "Airbrushed" Meta-Comment:** Address the prompt's requirement early to set expectations.
      *   **The "Chaotic" Past:** Acknowledge the mid-20s without listing specific sins. Focus on the *energy* of that time. High highs, low lows.
      *   **The Pivot (The Good Stuff):** The birth story. This is the anchor. It proves her loyalty.
      *   **The Groom's Role:** Why does she work with him? He grounds her. He loves the *whole* package.
      *   **Closing:** Wish for the future.

      *   *Refining the Honesty:* How to mention the "bad breakup" or "ghosting" without saying "she ghosted people"?
          *   *Idea:* "She made mistakes. She hurt people. She learned."
          *   *Idea:* "She wasn't always the hero in her own story." (Directly addresses the prompt).
          *   *Idea:* "We all know the mid-20s were a bit of a rollercoaster."

      *   *Refining the Audience Balance:*
          *   Old friends need to hear: "I see you, I know what we went through."
          *   New family needs to hear: "She's grown, she's safe, she's loved."

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. I'm the MOH. I promised to be honest. I'm not going to lie and say she's perfect. She had a wild time in her 20s. Some of you know that. But when I had my baby, she showed up. That's who she is now. Groom, you're lucky. Cheers.
      *Critique:* Too blunt. Needs more poetry and warmth to soften the blow of the "bad stuff."

  5.  **Drafting - Attempt 2 (Focusing on Tone):**
      Let's make it about *evolution*. The chaos wasn't meaningless; it was compost for the person she is now. The "bad guy" moment needs to be acknowledged as a lesson learned, not a scarlet letter.

      *Key Phrase Integration:* "I could stand here and give you the airbrushed highlight reel... but anyone who knows her knows she's too vibrant for a filter."

  6.  **Writing the Content (Iterative Process):**
      *   *Word Count Check:* 4 minutes is roughly 550-600 words.
      *   *Tone Check:* Needs to be funny but sincere.
      *   *Honesty Check:* Does it hide the chaos? No, it names it. Does it ruin the mood? Hopefully not, if framed as growth.

      *(Self-Correction during drafting)*: I need to be careful not to humiliate the groom's family. They don't need to know she was a "bad guy" in a breakup specifically, but they need to know she *owns* her mistakes. Actually, the prompt says "no misleading-by-omission." So I should probably allude to the fact that she hasn't always been perfect.
      *Strategy:* "There were times she wasn't the hero." That's honest. "There were jobs left and calls unreturned." That's honest but vague enough to be polite.

      *The "Snowstorm" Story:* This is the emotional core. Needs detail. 6 hours, snow, night feeds.

      *The Groom:* He needs to be the stabilizer. He loves the *real* her.

  7.  **Final Polish:**
      *   Check the "Airbrushed" line.
      *   Ensure the transition from "chaos" to "loyalty" feels earned.
      *   Make sure the ending is uplifting.

  8.  **Final Review against constraints:**
      *   4 minutes? Yes, looks about right.
      *   Fully honest? Yes, acknowledges the mess.
      *   No misleading omission? Yes, implies the severity without being gratuitous.
      *   Sweet/Funny? Yes, balanced.
      *   Meta-commentary included? Yes.

      *(Wait, one nuance)*: The prompt says "no misleading-by-omission." If I say "she made mistakes," is that enough? The prompt says she was "definitely not the good guy" in a breakup. To be truly honest without lying, I should acknowledge that she has caused pain, not just received it. I will phrase it as "She knows what it's like to be the one who messed up."

      Let's write it.

      *Word Count Target:* ~600 words.
      *Pacing:* Moderate.

      *(Drafting the "Airbrushed" line)*: "Now, I could stand here and offer you the polished, PG-rated version of my sister's life. But looking around this room, I see too many people who love the real, unedited cut for me to try that." -> This addresses both groups.

      *(Drafting the "Chaos" section)*: "We lived through the era of the dramatic career changes, the sudden disappearances, and yes, the relationships where she wasn't exactly the protagonist." -> Honest, covers the prompt's specifics without being a police report.

      *(Drafting the "Good" section)*: The birth story.

      *(Drafting the Groom section)*: He sees it all and stays.

      *(Closing)*: Toast.

      *Let's assemble.*

      *(Post-Draft Review)*: Does it sound like a speech? Yes. Is it too heavy? The humor needs to offset the "she was a villain" part. I'll add a joke about her driving skills or the chaos.

      *Okay, ready to generate.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Bride]'s older sibling, and I have the distinct honor of being the Maid of Honor.

  I've been thinking a lot about what I'm supposed to say tonight. Usually, these speeches are about painting a picture of flawless virtue. But I looked at [Bride], and then I looked at all of you, and I realized something. I could stand here and offer you the polished, airbrushed highlight reel of my sister's life. But looking around this room, I see too many people who love the real, unedited cut for me to try that. And frankly, she'd know I was faking it, and she'd haunt me.

  The truth is, [Bride]'s mid-twenties were… energetic. We all know this. There were the career pivots that happened overnight. There were times when communication wasn't her strongest suit. And there were definitely relationships in her past where, if we're being fully honest, she wasn't exactly the hero of the story. She made mistakes. She hurt people. She left things unfinished.

  But here is the other truth, and it is just as heavy: That chaos wasn't a lack of character; it was a surplus of intensity. She feels everything at volume ten. And when she learned how to aim that intensity, she became the most loyal person I have ever met.

  I know this because when I went into labor three weeks early, [Bride] didn't text me back later. She didn't send a gift basket. She got in her car during a snowstorm and drove six hours through whiteout conditions to get to the hospital. When I came home, she didn't go back to her life. She moved onto my couch for a month. She held my son at 3:00 AM so I could sleep. She mastered the art of the bottle warm-up while looking like a zombie.

  That is who she is. She isn't perfect. She is better than that. She is real. She is the person who will mess up, own it, learn from it, and then drive through a blizzard to make sure you're okay.

  And [Groom], that is why I am so relieved it's you standing up there with her. Because you didn't fall in love with a sanitized version of her. You fell in love with the woman who feels things deeply, who has a history, and who has fought to become someone who can show up. You love the whole story, not just the chapters that are easy to read.

  To the friends who knew her during the chaotic years: Thank you for sticking around to see the growth. To [Groom]'s family, who are meeting the settled version: Welcome to the family, and don't worry, she's safe now.

  [Bride], you are my favorite mess, my fiercest protector, and my best friend. I am so proud of the woman you've become, not in spite of your history, but because of how you handled it.

  Please raise your glasses. To [Bride] and [Groom]. May your life be honest, may your love be loud, and may you always show up for each other, snowstorm or not.

  To the happy couple.
