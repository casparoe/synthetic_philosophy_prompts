answer: |-
  This is a sharp, coherent statement that clearly stakes out a "Whelan-style" position (democracy presupposes a bounded people) against the "Abizadeh-style" critique (borders themselves must be democratically justified). It hangs together better than most first drafts, but you have correctly identified the fault lines.

  Here is the ranking of your problems from fatal to manageable, the hidden assumptions doing the heavy lifting, and the cheapest way to patch the hull.

  ### 1. The Ranking of Tensions

  **1. The Border Coercion Trap (1 & 5) — Severity: Critical**
  This is not wordplay; it is the central debate in the literature. If the state coercively prevents a migrant from entering (5), and your test for inclusion is "subject to coercion" (1), then the migrant qualifies for the demos *before* they enter. If they qualify, they can vote to open the border, which negates (5).
  *   **Why it forces what:** To keep (5), you must argue that border enforcement is *not* the kind of coercion that triggers (1). If you don't make this distinction explicit, (1) logically dissolves (5).

  **2. The Paradox of Constituency (1 & 2) — Severity: High**
  You have a normative claim (1: who *ought* to belong) and a procedural claim (2: who *decides* who belongs). If the existing majority uses (2) to exclude a group that (1) says must be included (e.g., long-term residents without citizenship), your theory offers no recourse.
  *   **Why it forces what:** If (2) is absolute, (1) is merely advisory. If (1) is binding justice, (2) cannot be absolute. You currently have it both ways: you claim (1) is the test, but (2) says the testers can ignore the test.

  **3. The Spillover Problem (6 & 1) — Severity: Medium**
  You rejected "all affected interests" in (1) because it's too broad (the bus timetable). But zoning decisions affect regional housing prices and commute times for non-residents. If those effects are significant, isn't excluding them the same error as the bus timetable?
  *   **Why it forces what:** To keep (6), you must define "coercion" strictly as *legal enforcement* (fines, arrest) rather than *economic impact*. If you allow economic impact to count as coercion, (6) collapses back into the "affected interests" test you rejected.

  **4. The Intuition Clash (3 & 4) — Severity: Low (Illusory)**
  You suspect these clash, but under your own theory, they are the most consistent pair.
  *   **Why they are fine:** A prisoner is under the *maximum* intensity of state coercion (every movement dictated). An expat is under *minimal* coercion (taxes are enforceable, but daily life is not). Therefore, (1) demands the prisoner vote and permits excluding the expat. The intuition that they "feel" wrong together comes from a civic-republican view (virtue/connection), not your coercion view. Keep this; it's a feature, not a bug.

  ### 2. Hidden Commitments

  You are relying on three unstated premises to make this work:
  *   **Territoriality:** You assume coercion is tied to *presence* within a territory. (This is how you separate the felon from the expat).
  *   **Legal vs. Economic Coercion:** You are defining coercion as "threat of state sanction for disobedience," not "constraint of options by state policy." (This saves you from the zoning/bus timetable problem).
  *   **Agency:** Points (7) and (8) imply that voting requires not just being coerced, but the *capacity for independent judgment*. You haven't written this down, but it's the only reason to exclude children while including prisoners.

  ### 3. The Single Cheapest Revision

  **Revise Point 1.**

  **Current:** "...you get a say over a decision just in case you're one of the people the state will coercively enforce that decision against."

  **Revision:** "...you get a say over a decision just in case you're one of the people **subject to the ongoing domestic legal order**."

  **Why this is the cheapest fix:**
  By adding "ongoing domestic legal order," you distinguish between *gatekeeping coercion* (border control, which happens once at the edge) and *constitutive coercion* (living under the law day-to-day).
  *   **Solves 1 & 5:** It allows you to keep the right to exclude immigrants (5) because border enforcement is not subjection to the *ongoing* order.
  *   **Solves 6 & 1:** It clarifies that zoning is enforced against residents (subject to the order), not commuters (affected by the outcome).
  *   **Solves 3 & 4:** It reinforces why prisoners (fully subject) vote and expats (partially subject) don't.

  **The Cost:**
  You concede that the boundary itself cannot be democratized. You are admitting that the decision of *who is inside the legal order* is a pre-democratic sovereign act. This weakens your ability to critique immigration policy using democratic theory, but it saves the internal coherence of your demos. It makes Point 2 less of a contradiction and more of a necessary consequence: since the boundary is pre-democratic, the existing demos must maintain it.
