answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The noise of the espresso machine provides a steady hum. Elias (Epistemicist) and Sarah (Supervaluationist) have been colleagues for years. They are reviewing drafts of a joint paper on vagueness in environmental law.*

  **Elias:** You're hedging the conclusion on the Northland Sparrow case. You write that it's "indeterminate whether the species persists." But the funding deadline is Friday. The agency needs a binary output: Protected or Delisted.

  **Sarah:** And that's exactly the problem your view glosses over, Elias. You want to force nature into a binary box because classical logic demands it. My point is that the term "extinct" is vague. There are possible worlds—admissible precisifications—where the last bird died in 2018, and others where it died in 2020. Until we sharpen the definition, there is no fact of the matter.

  **Elias:** There *is* a fact of the matter. There was a specific sparrow. It was the last one. When it died, the species became extinct. That is a sharp boundary in reality. The vagueness isn't in the world; it's in our knowledge. We don't know *which* bird was the last. That's Epistemicism 101.

  **Sarah:** But "extinct" isn't just "the death of the last individual." In conservation biology, it's "no reasonable doubt that the last individual has died." That involves survey effort, probability, and habitat accessibility. That predicate is inherently fuzzy. If you say there's a sharp cut-off, you're saying there's a specific nanosecond where "not extinct" flips to "extinct," and we just happen to be ignorant of it. That sounds like magic.

  **Elias:** It sounds counter-intuitive, I grant you. But look at the alternative. You say the statement "The Northland Sparrow is extinct" is neither true nor false right now. You're rejecting Bivalence. Once you do that, you break classical logic. If I say "Either the sparrow is extinct or it is not," you have to tell me that this tautology might fail.

  **Sarah:** I don't reject the Law of Excluded Middle, Elias. I'm a Supervaluationist, not an intuitionist. "Either the sparrow is extinct or it is not" is *super-true*. It comes out true on every admissible precisification of "extinct." So classical logic is preserved at the level of super-truth. What I reject is that every statement has a specific truth value *before* we precisify.

  **Elias:** But that's a distinction without a difference for the decision-maker. If I'm the judge ruling on this, and I say "It is not the case that the species is extinct," am I right? On your view, if I'm in the "penumbra"—the borderline zone—I'm not wrong, but I'm not right either. My ruling lacks a truth value. How does a court issue a ruling that lacks a truth value?

  **Sarah:** The court *precisifies*. That's what legislation does. When the law says "abandoned vehicle," it leaves a gray zone. When the judge rules, they aren't discovering a hidden fact; they are selecting one admissible precisification. They are *making* it precise. Your view pretends the precision was already there, waiting to be found. That leads to absurdity.

  **Elias:** Absurdity? Or honesty? Let's look at the Sorites. You know the drill. One grain of sand isn't a heap. If $n$ grains isn't a heap, $n+1$ isn't a heap. Therefore, a million grains isn't a heap. The conclusion is false. So one of the premises must be false.

  **Sarah:** Agreed.

  **Elias:** On my view, the inductive premise—"If $n$ isn't a heap, $n+1$ isn't a heap"—is false. There is a specific $n$ where the cut-off happens. It's sharp.

  **Sarah:** And that's where you lose me. You're claiming there's a number, say 4,352, where 4,352 grains is not a heap, but 4,353 *is*. And you claim this is true *in English*, right now, regardless of usage. Why that number? What semantic mechanism draws the line there?

  **Elias:** It's not a mechanism we can access. It's determined by the complex usage of the term across the community. But here is my trap for you, Sarah. You say the inductive premise is false because there is *some* precisification where it fails. That means on your view, there is also a cut-off on every precisification. Every way of making "heap" precise involves drawing a sharp line. So you admit sharp lines exist in every precisification. Why is my view—that there is one real sharp line—more magical than your view that there are thousands of hypothetical sharp lines?

  **Sarah:** Because I don't claim one of those lines is *the* truth. I claim truth is what survives *all* of them. The cut-off varies across the admissible interpretations. That variation *is* the vagueness. You collapse the variation into ignorance.

  **Elias:** But you haven't eliminated the sharpness; you've just modalized it. Now let's talk about the real killer for your view: Higher-Order Vagueness.

  **Sarah:** Go on.

  **Elias:** There are clear cases of "heap." There are clear cases of "non-heap." And there are borderlines. But surely, Sarah, the boundary between "clearly a heap" and "borderline heap" is *also* vague. There are borderlines of the borderlines.

  **Sarah:** Absolutely. That's a feature, not a bug.

  **Elias:** But Supervaluationism models vagueness as a sharp boundary between the true (true on all precisifications), the false (false on all), and the indeterminate (true on some, false on others). Your model draws a sharp line around the "indeterminate" zone. You've replaced a fuzzy cloud with a sharp-edged box containing a fuzzy cloud. You haven't accounted for higher-order vagueness; you've just pushed it back to the boundary of admissibility.

  **Sarah:** That is the standard objection, yes. But we can handle it. We can say "admissibility" itself is vague. There are precisifications that are definitely admissible, some definitely not, and some borderline admissible.

  **Elias:** Ah, but now you need a meta-language to define the admissibility of the admissibility. And then a meta-meta-language for the admissibility of that. You're inviting an infinite regress. Every time you try to blur the boundary, you draw a new sharp boundary around the blur. I, on the other hand, accept higher-order vagueness through the **Margin for Error Principle**.

  **Sarah:** Explain.

  **Elias:** Knowledge requires safety. If I know that $n$ grains make a heap, then $n-1$ must also make a heap, because I couldn't reliably distinguish the two. So, even though there is a sharp cut-off where "heap" becomes "non-heap," there is a wide zone around it where I *cannot know* where I am. The boundary of knowledge is fuzzy, even if the boundary of truth is sharp. That explains why "borderline" feels fuzzy without breaking bivalence.

  **Sarah:** It explains the *feeling*, Elias, but it doesn't explain the *semantics*. It implies that when I say "This is a borderline case," I am saying something false. Because on your view, it's either a heap or it's not. "Borderline" just means "I don't know." But when I call something borderline, I'm not expressing ignorance; I'm expressing that the world hasn't decided yet.

  **Elias:** The world *has* decided. Language is a tool for carving reality. If the tool is blunt, that doesn't mean the reality isn't carved. Look, let's bring this back to your conservationists. If they adopt your view, they can say, "Well, it's indeterminate, so we don't need to act."

  **Sarah:** No, they can't. Super-truth dictates action. If "extinct" is super-false (false on all admissible precisifications), they protect. If it's super-true, they delist. The only time they stall is in the genuine gap. And in law, we have default rules for gaps. But your view forces them to pretend they know something they don't. It encourages false confidence. "We don't know the exact cut-off, but there *is* one, so just guess."

  **Elias:** It encourages rigor! It forces them to admit that there *is* a fact they are missing, rather than comforting themselves with "indeterminacy." But let's press your "admissibility" again. You say a precisification is admissible if it respects the usage of the term. But usage is vague. So the set of admissible precisifications is vaguely defined.

  **Sarah:** I conceded that.

  **Elias:** But if the set is vaguely defined, then whether a statement is "true on all admissible precisifications" is itself vague. So super-truth is vague. But you define truth *as* super-truth. So truth is vague. But in your logic, a proposition is either super-true or it isn't. You're smuggling a sharp cut-off into the definition of truth while claiming to reject sharp cut-offs in the world. You're an epistemicist about admissibility!

  **Sarah:** *Pauses, stirring her coffee.* That's sharp. But here's the divergence. I'm willing to accept that the *logic* has sharp edges if it preserves the intuition that the *language* is flexible. You are willing to sacrifice the intuition that language is flexible to preserve the *logic's* bivalence.

  **Elias:** I preserve classical logic. That's the prize.

  **Sarah:** Is it? Or is the prize explaining how we actually communicate? When I tell a juror, "You must decide if the car was abandoned," and the car has been sitting for three months with a flat tire, I don't want them thinking, "There is a hidden fact about abandonment I am failing to perceive." I want them to think, "The concept of abandonment does not cover this case clearly, so I must exercise discretion to sharpen it." Your view turns judicial discretion into a discovery procedure. It's a category error.

  **Elias:** And your view turns judicial discretion into legislation. If the judge "sharpens" the term, they are making new law, not interpreting old law. Epistemicism respects the separation of powers. The law says what it means; the judge finds the fact. The fact is hard to find, yes. The boundary is unknowable, yes. But it's there.

  **Sarah:** But consider the cost. If you're right, then for every vague predicate, there is a "best" precisification that matches the hidden sharp boundary. But we can never identify it. So in practice, your "truth" is inaccessible. It does no work. A truth that can never be known, even in principle, is functionally identical to no truth at all.

  **Elias:** It does work. It validates our reasoning. When we reason by *reductio ad absurdum*, we rely on bivalence. If you have truth-value gaps, *reductio* gets complicated. I keep the engine of reasoning running smoothly, even if the dashboard is a bit foggy. You clean the dashboard but tamper with the engine.

  **Sarah:** I don't tamper with it. I just acknowledge that some switches aren't connected to a light. Look, Elias, we're hitting the wall on Higher-Order Vagueness. You say my "admissibility" is vague, so I need a higher-order supervaluation. Fine. I'll take that hit. I'd rather have a hierarchy of vagueness than a hierarchy of ignorance.

  **Elias:** Why?

  **Sarah:** Because ignorance implies there's something to know. In the case of "heap" or "extinct," there *isn't* anything more to know about the meaning. We know all the facts about the sand and the usage. There is no hidden semantic fact. You're positing a brute, unexplainable semantic boundary. That violates the principle of plenitude. Why should the universe care about 4,353 grains?

  **Elias:** The universe doesn't care. *We* do. Our cognitive limitations create the boundary. The cut-off is a function of our discriminatory limits. It's not magical; it's psychological and sociological, fixed by causal chains we can't fully trace.

  **Sarah:** But if it's fixed by our usage, and our usage is fuzzy, the cut-off must be fuzzy. You're treating usage as if it were a laser beam when it's actually a floodlight.

  **Elias:** And you're treating the floodlight as if it doesn't illuminate anything specific. Here's the practical difference for your article, by the way.

  **Sarah:** How so?

  **Elias:** If you're an Epistemicist, you treat vague laws as strict laws that are hard to apply. You push for better data. You try to find the last bird. You assume the answer exists.

  **Sarah:** And if you're a Supervaluationist, you treat vague laws as invitations to stipulate. You acknowledge the data might never be enough, so you focus on the *consequences* of the classification. You ask, "What do we gain by calling it extinct?" rather than "Is it truly extinct?"

  **Elias:** Which leads to policy drift. If truth is relative to the precisification, then truth is relative to the policy goal.

  **Sarah:** Which leads to honesty. It admits that "extinct" is a normative threshold as much as a descriptive one.

  **Elias:** *Sighs.* We're not going to agree.

  **Sarah:** No. But I think I see why you hold on. You're terrified that if we drop bivalence, we lose the ability to say the other side is wrong.

  **Elias:** And you're terrified that if we keep bivalence, we lose the ability to say the world is complex.

  **Sarah:** Precisely. So, for the piece?

  **Elias:** Tell them Epistemicism saves logic at the cost of intuition.

  **Sarah:** And Supervaluationism saves intuition at the cost of... well, you'll say it's logic. I'll say it's simplicity.

  **Elias:** I will say it's a truth gap. And nature abhors a vacuum.

  **Sarah:** *Smiles.* Nature, maybe. Courts don't. They fill it.

  **Elias:** Then perhaps the court is the ultimate Epistemicist. They rule as if there is a fact, because they have to.

  **Sarah:** Or they are the ultimate Supervaluationists. They create the fact by ruling.

  **Elias:** *Raises coffee cup.* To the cut-off.

  **Sarah:** *Clinks cup.* To the penumbra.
