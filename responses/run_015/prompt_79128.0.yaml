answer: |-
  You are right to be dissatisfied with "Tragedy of the Commons." That label is frequently misapplied to this situation, but it is technically incorrect and obscures the mechanism you are observing.

  There is no single, canonical noun phrase in the social science literature (like "Gresham's Law" or "The Prisoner's Dilemma") that captures this exact configuration without caveats. However, the phenomenon is well-understood as a specific intersection of three established concepts: **Public Goods**, **Conditional Cooperation**, and **Second-Order Free-Riding**.

  If you require a label to use in conversation, the most precise existing term is **The Second-Order Collective Action Problem regarding Social Norms**. However, since you noted that "second-order collective action" felt slightly off (likely because it focuses on the punishment mechanism rather than the erosion of the practice itself), I will honor your request to define the boundaries sharply.

  Here is the breakdown of why the standard labels fail, why your two "oddities" are actually the defining features, and a proposed definition you can use to test future cases.

  ### 1. Why the standard labels don't fit

  **Tragedy of the Commons**
  *   **The Mismatch:** This applies to *rivalrous* resources (a pasture, a fishery). If I graze my cow, there is less grass for yours. In your department, if I read your draft, there is not "less draft-reading" available for others; in fact, the value likely increases.
  *   **The Distinction:** You are describing the *production* of a public good, not the *consumption* of a finite stock.

  **Free-Riding (First-Order)**
  *   **The Mismatch:** Standard free-riding implies an actor consciously deciding to benefit without paying costs. You describe people who *value* the practice and aren't selfish.
  *   **The Distinction:** The mechanism here is not calculated greed, but **Conditional Cooperation**. Most people are "conditional cooperators": they are willing to contribute *if* they believe others are contributing. When they see early defections (even invisible ones), their willingness drops. They aren't free-riding to gain an advantage; they are withdrawing to avoid being a "sucker."

  **Problem of Many Hands**
  *   **The Mismatch:** This is a moral/legal concept regarding *responsibility* for a negative outcome (e.g., who is to blame for the disaster?).
  *   **The Distinction:** You are describing a *causal* mechanism for erosion, not an attribution of blame after the fact.

  ### 2. The Role of Your Two "Oddities"

  You asked whether the non-rivalrous nature of the good and the recursive enforcement problem are essential or incidental. **They are essential.** They are the structural reasons why this specific pattern is stable and hard to fix.

  **Oddity 1: Non-Rivalry (The Public Good Structure)**
  Because the resource is non-rivalrous (my participation doesn't deplete yours), there is no natural scarcity signal to alert the group. In a commons, the grass gets short; people notice. In your department, the "grass" is the *culture itself*. It doesn't get short; it just gets quiet. The lack of rivalry means there is no immediate feedback loop. You cannot measure the depletion. This allows the erosion to remain invisible until a tipping point is passed.

  **Oddity 2: Recursive Enforcement (The Second-Order Problem)**
  This is the engine of the trap.
  *   **First-Order:** Contributing to the good (reading the draft).
  *   **Second-Order:** Enforcing the norm of contributing (asking "Why didn't you read the draft?").
  *   **The Trap:** Enforcing the norm is *itself* a public good. It costs the enforcer social capital and time, but benefits everyone. Therefore, rational (even prosocial) actors will not enforce, because they become second-order free-riders on the enforcement effort.
  *   **Why it matters:** If enforcement were costless, the norm would stabilize. Because enforcement is costly and non-rivalrous, the "bad" equilibrium (no one contributes, no one enforces) is just as stable as the "good" one.

  ### 3. A Sharp Definition for Future Cases

  Since no single canonical name exists, I propose you classify this as **Second-Order Normative Attrition**. You can use the following criteria to determine if a new case fits this pattern.

  **Definition:**
  A group exhibits **Second-Order Normative Attrition** if and only if:
  1.  **The Good is Non-Rivalrous:** The practice creates value that is not diminished by sharing (e.g., culture, knowledge, safety, trust).
  2.  **Contribution is Costly:** Participating requires individual effort/time, even if small.
  3.  **Cooperation is Conditional:** Participants are willing to contribute *only if* they perceive a high level of contribution from others (they are not pure altruists, nor pure selfish maximizers).
  4.  **Enforcement is Second-Order:** Sanctioning non-contributors is costly to the sanctioner and benefits the whole group (including the non-contributors).
  5.  **Erosion is Invisible:** Individual defections do not produce immediate, measurable degradation of the resource, delaying group recognition of the loss.

  **Boundaries (What excludes a case):**
  *   **If the resource is rivalrous:** It is a Tragedy of the Commons (e.g., office supplies disappearing).
  *   **If people stop because they genuinely no longer value the practice:** It is Preference Change, not Attrition.
  *   **If a single leader can enforce the norm without personal cost:** It is a Hierarchy Problem, not a Collective Action Problem.
  *   **If the group successfully coordinates to punish defectors:** It is a Successful Norm Governance case (Ostrom's design principles).

  ### 4. Why the "Early Defections" Matter

  You mentioned a handful of visible defections early on. In the literature, this is the **Tipping Point** or **Critical Mass** failure.

  Because your colleagues are *conditional cooperators*, they are constantly scanning the environment for signals of what others are doing. The early defections act as a signal. Even if 90% of people still value the practice, if they perceive that participation is slipping, they rationally withdraw to avoid wasting effort. This creates a cascade. The "oddity" of invisibility makes this worse: because the omissions are invisible, people rely on the *visible* defections as a proxy for the whole, overestimating the decline.

  ### Summary

  You are not dressing up an obvious thing in fancy clothes. You have identified a specific failure mode of **social norms sustaining non-rivalrous public goods**.

  *   **Is there a name?** No single canonical label exists. "Second-Order Free-Riding" is the closest mechanism, but "Second-Order Normative Attrition" better captures the *erosion* you are witnessing.
  *   **Are the oddities essential?** Yes. Non-rivalry prevents natural scarcity signals; recursive enforcement prevents self-correction.
  *   **How to distinguish it:** If the resource runs out, it's a Commons. If people stop wanting it, it's Preference Change. If people want it, won't use it up, but stop making it because no one will police the makers, it is **Second-Order Normative Attrition**.

  The remedy, unfortunately, confirms your suspicion: you cannot solve a second-order problem with first-order tools. You cannot ask the group to enforce the norm. The cost of enforcement must be socialized or institutionalized (e.g., the Chair makes draft-reading a formal requirement with administrative follow-up, absorbing the enforcement cost personally/structurally rather than asking peers to police peers).
