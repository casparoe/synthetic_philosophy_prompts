answer: |-
  Based on the five cases you have provided, your friend is operating under a specific, nuanced philosophical framework. She is neither a pure autonomist (art and morality are separate) nor a radical ethicist (morality always dictates art). She is a **Moderate Ethicist with an Internalist Constraint.**

  Here is the breakdown of her machinery, the prediction for the photographer, the rival rule that threatens this prediction, and how your board should vote.

  ### 1. The Machinery: Internalist Moderate Ethicism
  Your friend's judgments rely on a distinction between **internal** moral properties (those experienced within the work) and **external** moral properties (those in the biography or production context).

  *   **The Rule:** A moral defect affects artistic value *if and only if* it is **internal to the work's structure, meaning, or audience experience.**
  *   **The Corollary:** A moral defect in the artist or the production process does *not* affect artistic value if it remains external to the work's experience, though it may affect whether we should support or platform the work.

  **How it fits your data:**
  *   **Cases 1 & 3 (Internal Defects):** The moral rot (contempt, luxuriating in torture) is *felt* by the audience and is structurally necessary for the work's power. Because the audience must participate in the moral wrong to experience the art, the art is aesthetically flawed.
  *   **Case 2 (Internal Blemish):** The sexist sentence is read (internal), even if gratuitous. It is a small aesthetic stain because it is *in* the text.
  *   **Case 4 (External Defect):** The abuse is biographical. It is not in the songs. Therefore, the songs remain aesthetically great, even if we shouldn't stream them.
  *   **Case 5 (Internal Virtue):** The honesty is *in* the text and drives the value. Moral virtue becomes aesthetic virtue.

  ### 2. The Prediction: Is the Photography Book Good Art?
  **She will say: Yes, it is good art.**

  **Why:**
  Like Case 4 (the abusive singer), the moral defect (the deception) is **external to the experience of the work.** You stated: *"nothing in the images hints that he lied."* The audience does not feel complicit in a lie (unlike Case 1, where they felt complicit in contempt). The intimacy they experience is real, even if the access was stolen.

  For her, the question "Is it good art?" asks about the object and the experience it affords. Since the lie is not perceptible in the work, it does not corrupt the aesthetic achievement. However, consistent with Case 4, she will likely argue that **we ought not to platform it.** The separation between "is it good?" and "should we publish?" is the core of her consistency.

  ### 3. The Rival Rule: Causal Constitutivism
  There is another rule that fits Cases 1–5 perfectly but would yield the opposite verdict on the photographer.

  *   **The Rule:** **If the aesthetic merit of a work is causally dependent on a moral wrong, the work is aesthetically tainted.**
  *   **Fit on 1–5:**
      *   **Case 1:** Power depends on contempt (Wrong). -> Tainted.
      *   **Case 2:** Sentence does no work (Not dependent). -> Not tainted (mostly).
      *   **Case 3:** Climax depends on torture-porn (Wrong). -> Tainted.
      *   **Case 4:** Songs do not depend on abuse (Not dependent). -> Not tainted.
      *   **Case 5:** Value depends on honesty (Right). -> Validated.
  *   **Disagreement on 6:** The book's greatness (intimacy) *depends* on the lie ("Had he asked honestly... there would have been no book"). Under this rule, the art is **flawed** because its beauty is "stolen fruit."

  ### 4. The Tie-Breaker Case (Case 7)
  To distinguish your friend's **Internalist** view from the **Causal Constitutivist** view, present her with this scenario:

  > **Case 7:** An actor gives a performance of grief that critics universally hail as "shockingly raw and authentic." It wins awards. Years later, it is revealed that the director secretly psychologically tortured the actor during filming to induce real trauma, which was captured on camera. The audience cannot see the torture; they only see the "rawness."

  *   **Your Friend (Internalist):** Will say it is a **great performance.** The moral horror is external to the screen; the aesthetic achievement (the rawness) is internal and real. (Matches Case 4 & 6).
  *   **The Rival (Causal Constitutivist):** Will say it is a **flawed performance.** The aesthetic merit (rawness) is causally constituted by a moral wrong.

  ### 5. The Town's Reaction: Signal or Noise?
  You asked if the town's gladness or refusal belongs in the question she is asking.

  **It is noise.**

  For her framework, the town's reaction is **consequentialist**, while her aesthetic judgment is **deontological/internalist.**
  *   **The Refusal:** Proves the moral wrong occurred (validating the "should we publish" question), but since it doesn't change the images, it doesn't change the "is it art" question.
  *   **The Gladness:** Proves the work has value to them now, but retrospective consent does not erase the structural deception of the production.

  She separates the *value of the object* from the *ethics of the transaction.* The town's feelings belong to the ethics of the transaction. They are irrelevant to whether the photographs are formally superb or intimate.

  ### 6. The Board Vote: To Publish or Not?
  This is the critical pivot. Her view **does not** force a "No" vote based on aesthetics, but it strongly pushes toward a "No" vote based on ethics.

  *   **Aesthetic Vote:** If the question is "Is this worth reviewing as art?", her view says **Yes.** It is good art (like Case 4).
  *   **Ethical Vote:** If the question is "Should we run an excerpt and give this a platform?", her view says **No.**

  **Precedent:** Look at Case 4. She said the songs were "still beautiful, still great," but she *"will not stream them or help give him a platform."*
  She draws a hard line between appreciating art and amplifying it. By running an excerpt and a review, your magazine becomes a platform. It replicates the photographer's gain from the deception.

  **Recommendation:**
  If you want her consistency, you should **acknowledge the work's artistic merit in private deliberation but vote against publication.** You can write a statement that mirrors her distinction: *"We recognize the formal achievement of this work, but we cannot platform a project predicated on the violation of its subjects."* This honors her separation of "good art" from "right action."

  **Summary of her position:**
  She believes that **art can be good even if it is born of sin, provided the sin is not visible in the work.** But she also believes that **we are not obligated to support good art if that support rewards sin.** She is saving you from having to lie and call the art "bad" to justify rejecting it. You can call it "good" and still reject it.
