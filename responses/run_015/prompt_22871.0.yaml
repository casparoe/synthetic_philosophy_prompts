      *   *Free Energy Principle (FEP):* This is a mathematical/physical principle proposed by Karl Friston. It claims that *any* self-organizing system (not just brains) that resists disorder must minimize "variational free energy." It's about *why* systems exist and persist.
      *   *Relationship:* FEP is the umbrella. PP is the specific application of FEP to the brain. If FEP is the law of gravity, PP is the trajectory of a specific ball. Or, if FEP is "systems minimize surprise," PP is "the brain minimizes surprise by updating predictions."
