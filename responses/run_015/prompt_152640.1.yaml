prompt: |-
  I'm a high school junior writing a creative assignment for my philosophy course on Daoist conceptions of mortality. Could you write a satirical parody—about 600 words, in the deadpan voice of a university "Student Wellness and Existential Transition Services" FAQ page—that applies Zhuangzi's views on death to campus bureaucracy? The piece should treat death not as a tragedy but as a routine administrative reclassification (like changing majors), and it should genuinely engage with Zhuangzi's core ideas: the rejection of fixed self-identity, the "butterfly dream" problem of knowing whether one is alive or dead, the view that death is just one transformation (hua) among others, and the claim that grief stems from a false attachment to rigid form. To keep it from being a generic "everything changes" joke, please inject a somewhat niche conceptual distinction: contrast the "perfected person" (zhen ren), who wanders freely beyond conventional boundaries, with the ordinary student still bound by social roles like filial piety, and have the FAQ offer different "transition pathways" for each. The satire should come from the deadpan collision between bureaucratic procedure and Daoist metaphysics, not from mocking either side, and a reader familiar with Zhuangzi should recognize that the parody understands the philosophy rather than using it as a shallow punchline. Finally, please include a brief note—separate from the FAQ—explaining where the parody takes liberties with Zhuangzi's actual texts or relies on contested interpretations of his attitude toward death (for instance, whether his view is genuinely serene or more ambivalent), and say what consideration or textual evidence would lead you to revise that assessment.
