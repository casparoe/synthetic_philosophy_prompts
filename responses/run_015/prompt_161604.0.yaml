answer: |-
  WHAT I GRANT
  I grant that words may sometimes be used in reasoning without immediately raising particular ideas in the imagination.

  THE REPLY
  Pray, tell me: when you make this PROPOSITIONAL SUPPOSITION, what anchors the meaning of your terms? If they signify nothing, you suppose nothing; if they signify something, they must signify ideas or notions. You claim a notion of matter, but notions are reserved for active beings—spirits that will and perceive. Matter, by your own confession, is inert. How can you have a notion of a thing defined by its lack of agency? It is a contradiction in terms, like seeing darkness. As for this 'simulation,' it is merely a contrivance of ideas—marks on paper or states in a machine. When unobserved, are these states anything but words unspoken? To say they exist unperceived is to say they are perceived unperceived. You ask what stops this? The very meaning of 'existence.' If the simulation runs with no mind to read its states, it is a clock in a desert with no one to tell the time. It is not a thing; it is a possibility. And possibilities exist only in minds. You cannot separate the being of the state from the perceiving of it without emptying the word 'state' of all sense. Do you think marks on paper exist when no eye sees them? They are nothing but potential ideas.

  YOUR MOVE
  When your simulation sits upon the shelf unread, in what does the reality of its states consist if not in some mind knowing them?
