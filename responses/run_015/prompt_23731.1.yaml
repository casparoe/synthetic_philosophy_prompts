answer: |-
  **Setting:** *The hallway outside the main auditorium of the Symposium on Finance and Rationality. It is late afternoon. The noise of the coffee break hums in the background. ELENA, a portfolio manager for a quantitative hedge fund, and MARCUS, a professor of philosophy specializing in decision theory, stand before a whiteboard where someone has scrawled a simple probability tree.*

  **Elena:** *(Tapping the board)* Twenty percent. That's the number. If you have an edge of sixty-forty at even money, and you bet anything other than twenty percent of your bankroll, you are leaving money on the table. Or worse, you're lighting it on fire.

  **Marcus:** I'm not disputing the arithmetic, Elena. The Kelly fraction is $p - q$. $0.6 - 0.4 = 0.2$. I know the formula. I'm disputing the *normative* leap. You're moving from "this maximizes geometric growth" to "this is the only rational bet." That's where I lose you.

  **Elena:** It's not a leap. It's a constraint. Look, we're not talking about a one-off toss. We're talking about a repeated game. If I bet thirty percent—just ten points higher than Kelly—my expected arithmetic return actually goes *up*. But my compound growth rate goes down. If I keep betting thirty percent, the volatility drag will eventually wipe me out. Almost surely.

  **Marcus:** "Eventually." There's the infinite horizon again. You're assuming I'm going to play this coin flip forever. But I'm a finite agent. I have a lifespan. I might only face this opportunity ten times, or a hundred. If I have a finite horizon, maximizing the geometric mean isn't necessarily the optimal strategy. It depends on my utility function.

  **Elena:** But why should your utility function change the math of compounding? The market doesn't care about your feelings. The multiplicative structure of wealth is objective. If you bet too much, the sequence of returns creates a drag. Log-utility isn't a preference I *choose*; it's the utility function that falls out of the physics of compounding. It's scale-invariant. Whether I have a thousand dollars or a billion, twenty percent is the optimal fraction. That suggests it's fundamental, not subjective.

  **Marcus:** Scale invariance is a nice property, I'll grant you. But it's not the *only* property a rational agent might care about. You're treating the Kelly criterion as if it exists outside of Expected Utility Theory. It doesn't. Kelly *is* Expected Utility maximization. It's just EUT with a specific utility function: $U(W) = \ln(W)$.

  **Elena:** No, that's the standard economist's dodge. You're saying, "Oh, Kelly is just EUT with log utility, so if you prefer a different utility, you can bet differently." I'm saying that in a multiplicative environment, log utility is the *only* utility that prevents ruin while maximizing growth. If I use a CRRA utility function with a risk aversion coefficient less than one—say, I'm more risk-tolerant than log—I push my bet size above Kelly. And over a long enough timeline, I go to zero. Is it rational to choose a utility function that guarantees ruin?

  **Marcus:** "Guarantees ruin" is doing a lot of heavy lifting there. First, "ruin" implies utility drops to negative infinity. But for many agents, bankruptcy isn't infinitely bad; it's just very bad. Maybe I have outside income. Maybe I have a safety net. If my utility of wealth is linear, I should bet everything. If it's moderately concave, I should bet more than Kelly. You're smuggling in an aversion to ruin that isn't in the math of the coin flip itself.

  **Elena:** It is in the math if you care about staying in the game. Look, imagine two traders. Trader A bets Kelly. Trader B bets half-Kelly. Trader A will, in the limit, have infinitely more wealth than Trader B. But Trader B is safe. Now imagine Trader C bets double-Kelly. Trader C will, in the limit, have zero wealth compared to Trader A. The gap between Kelly and over-betting is asymptotic ruin. The gap between Kelly and under-betting is just opportunity cost. The asymmetry matters.

  **Marcus:** The asymmetry matters *if* your goal is to maximize terminal wealth relative to others in the limit. But what if my goal is to maximize the probability of reaching a specific target by a specific date? Say, I need to turn \$100,000 into \$150,000 in five years to buy a house. Kelly might be too conservative for that specific goal. Or it might be too aggressive if I'm close to the target. By fixating on the geometric growth rate, you're ignoring the shape of my actual needs.

  **Elena:** But that's ad-hoc. You're optimizing for a specific dollar target, which introduces a reference point. That breaks the scale invariance. Once you introduce reference points, you're no longer talking about rational capital allocation; you're talking about behavioral goals. I'm talking about the mathematical ceiling of what wealth *can* do. If you deviate from Kelly, you are mathematically guaranteed to underperform the Kelly bettor in the long run. Why would a rational agent choose guaranteed underperformance?

  **Marcus:** Because the "long run" is a statistical abstraction, not a lived reality. You're invoking the Law of Large Numbers to dictate behavior in the short run. Yes, the time-average growth rate is maximized at Kelly. But the *ensemble* average—the expected value of my wealth at any finite time $T$—is actually maximized by betting *more* than Kelly. If I care about the expected value of my estate when I die, and I don't care about the path I took to get there, I should bet more than twenty percent.

  **Elena:** That's the ergodicity problem. You're averaging across parallel universes. In the parallel universe where you get lucky, you're a billionaire. In the one where you get unlucky, you're bankrupt. But *I* only live in one universe. I experience time, not ensembles. If I bet above Kelly, the single trajectory I actually inhabit trends toward zero. It doesn't matter that the *average* of all possible trajectories is high if my specific trajectory is a wipeout.

  **Marcus:** I agree that the single trajectory matters. But the probability of wipeout depends on the horizon. If I bet twenty-five percent instead of twenty, my risk of ruin over ten flips is low. Over a thousand, it's high. You're asserting that the infinite horizon is the only valid perspective for rationality. I'm saying rationality is relative to the agent's horizon. If I know I only have ten flips, the "almost sure ruin" argument doesn't apply. The "almost" happens at infinity.

  **Elena:** But you don't know you only have ten flips. In finance, in life, the game rarely has a announced stop time. It's an open-ended sequence of decisions. If you adopt a strategy that is sub-optimal for the open-ended case, you're exposing yourself to tail risk you can't price. Log-utility is the only utility function that makes you indifferent to the duration of the game. It's the only one that is time-consistent.

  **Marcus:** Time-consistency is valuable, sure. But so is flexibility. Look, let's strip the mystique away. You say log-utility is "natural." I say it's just a risk aversion parameter of $\gamma = 1$. Why is 1 natural? Why not 0.5? Why not 2? A person with $\gamma = 2$ should bet half-Kelly. That's still rational. They just value marginal wealth less than you do. You're conflating "rational" with "aggressive growth maximizer."

  **Elena:** I'm conflating "rational" with "surviving." If you have $\gamma = 2$, you're choosing to grow slower than the environment allows. That's fine if you want to sleep better at night. But don't call it optimal in a vacuum. It's optimal *for your comfort*. Kelly is optimal *for the capital*. There's a difference between what feels good and what the math of compounding demands. If you treat capital as a tool that must be preserved to work, Kelly is the operating manual. If you treat it as a score to be maximized regardless of survival, you're not investing; you're gambling.

  **Marcus:** And if you treat capital as a means to satisfy specific human ends, then the "operating manual" needs to account for those ends. If I need to withdraw five percent of my bankroll every year to eat, full Kelly might be too volatile for my consumption needs. I might need to bet less. If I have a chance to take a massive, one-time swing that solves all my problems, I might bet more. The Kelly criterion assumes the bettor is a pure reinvestment machine with no consumption and no external constraints. That's a model of a fund, not a person.

  **Elena:** But the fund is the only thing that lasts! The person dies. The capital, if managed correctly, can persist. If you want to build something intergenerational, or just survive a career in a volatile market, you respect the geometric mean. The tension here, Marcus, is that you think rationality is about satisfying axioms of preference. I think rationality is about aligning your actions with the statistical reality of the system you're in. The system is multiplicative. Therefore, the strategy must be geometric.

  **Marcus:** And I think the system is what it is, but the *agent* is who they are. Rationality is the alignment of means to *ends*. If my end is not "maximize long-run geometric growth," but rather "maximize probability of hitting X by date Y," then Kelly is not rational for me. You're trying to turn a specific goal into a universal law.

  **Elena:** Because if you ignore the universal law, the specific goal becomes impossible to sustain. You can hit X by date Y betting thirty percent, sure. But if you keep playing, you lose it back. Kelly is the only strategy that is robust to the horizon. It works for ten flips, it works for ten thousand. Deviating from it makes your outcome dependent on *when* you stop. That dependency is a vulnerability.

  **Marcus:** Vulnerability to what? To the math? Or to your definition of what counts as a win? Look, Elena, I'm not saying Kelly is wrong. I'm saying it's not *uniquely* rational. It's a special case. A beautiful, elegant special case. But calling it the "single rational strategy" implies that anyone betting differently is making a mistake. I'm saying they might just have a different utility function, and that's not a mistake. It's a preference.

  **Elena:** *(Pauses, looking at the coin diagram)* In a vacuum, maybe. But in a market? Preferences that lead to extinction get selected out. If there are enough Kelly bettors in the market, they will eventually own all the capital. The ones who bet according to "subjective preference" above Kelly will go bust. The ones below Kelly will become irrelevant. So, even if you start with a different utility function, market selection pressures force you toward Kelly.

  **Marcus:** That's an evolutionary argument, not a decision-theoretic one. You're saying "be Kelly because otherwise you'll be outcompeted." That's a pragmatic reason, not a normative one. It's "do this to survive," not "do this because it's right."

  **Elena:** In decision theory, isn't survival the prerequisite for rightness?

  **Marcus:** *(Smiles faintly)* Only if survival is the only thing that matters.

  **Elena:** *(Returns the smile)* In my line of work, it usually is.

  **Marcus:** Well. I suppose that's the disagreement. You see the coin as a machine to be optimized. I see it as a choice to be weighed.

  **Elena:** And I'll have twenty percent more than you in the long run.

  **Marcus:** And I might enjoy the ride more. Shall we get another coffee?

  **Elena:** Sure. But I'm paying. I bet on myself.

  **Marcus:** I'd expect nothing less.
