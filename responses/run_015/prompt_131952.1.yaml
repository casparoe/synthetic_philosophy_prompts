  ### Part 3: The Next Test Case

  Your instinct to "walk the number up" (6 fingers, 50, 1000, 1 billion) is **not a cheap trick; it is the correct philosophical test.** It tests for **Lexicality vs. Aggregation.**

  *   **If he is a Lexical Theorist:** There is *no number* of fingers that equals a life. The categories are incommensurable. He should say "Save the man" even if it's a billion fingers.
  *   **If he is a Threshold Theorist:** Eventually, the sheer scale of suffering must matter. At some point (maybe a million people losing *both* hands?), he should hesitate.

  **However, I propose a sharper test case to distinguish "Strongest Claim" from "Aggregation within Categories":**

  > **The "Two Groups, Same Harm" Case:**
  > "Option A: One person loses 50 years of life.
  > Option B: Two people lose 40 years of life each.
  > You can only save one group."

  *   **Why this matters:** Marcus saved the 50-year loser against five 1-year losers (Case 8). That fits both Aggregation (50 > 5) and Strongest Claim (50 > 1).
  *   **The Prediction:**
      *   If he saves the **One Person (50 years)**: He is consistent with **Strongest Individual Claim**. He refuses to aggregate the two people's losses (40+40=80) to outweigh the single person's loss (50). He compares Max(50) vs Max(40).
      *   If he saves the **Two People (40 years each)**: He is an **Aggregator** within non-fatal categories. This would prove he *does* count numbers for non-fatal harms, which means his verdict on the 1000 Fingers case might eventually flip if the number gets high enough.

  **What would change my mind?**
  If Marcus hesitates on the 1000 Fingers case. If he says, "Well, 1000 is a lot... maybe we save the fingers," then he is not running Strongest Individual Claim. He is running a **Threshold View**. That would mean Case 1 (5 lives vs 1 life) is a special "Life" exception, but "Fingers" are aggregable.

