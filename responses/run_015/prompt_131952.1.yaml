  ### Part 2: The Best Guess

  **The Principle:** **The Strongest Individual Claim (with Lexical Features).**

  Marcus is running a view that is structurally very close to T.M. Scanlon's contractualism but stripped of the "reasonable rejection" language and replaced with a direct comparison of individual losses. He does not sum harms across persons. He looks for the *maximum individual harm* in each option and compares those two magnitudes.

  **Why this over Lexical Priority?**
  Lexical Priority (Candidate 3) is a strong contender, but Candidate 4 explains Case 8 better. Lexical views often struggle with continuous goods like "years of life." Is 50 years lexically superior to 1 year? That seems odd. It is more natural to say the *complaint* of losing 50 years is stronger than the *complaint* of losing 1 year. Candidate 4 unifies Case 1 (Death = Death) and Case 8 (50 Years > 1 Year) under a single metric: **Magnitude of Individual Loss.**

  **Why this over Threshold Prioritarianism?**
  Threshold views usually imply that if you get *enough* lives on one side, you must save them. Marcus's verdict on Case 1 ("you're allowed to save the one... no moral difference") is too strong for a Threshold view. He treats the 5 lives as morally irrelevant to the 1 life, not just "outweighed until a threshold."

  **Prediction for the Main Case (1 Life vs. 1000 Fingers):**
  Marcus will say: **Save the man.**
  *Reasoning:* He will ignore the "1000." To him, the moral structure is: *One person faces Death* vs. *One person faces a Finger Loss.* (He picks the representative individual from the group). Since Death > Finger, the numbers are irrelevant. He will likely say something like, "Losing a finger is bad, but it's not dying. It doesn't matter if it's a thousand people; none of them are facing what *he* is facing."

  **Prediction for the Waiver Variant:**
  Marcus will say: **Save the man (even more confidently).**
  *Reasoning:* This variant tells us whether his view is about *objective badness* or *interpersonal claims*.
  *   If he thinks fingers are objectively bad regardless of consent, the waiver changes nothing.
  *   If he thinks morality is about respecting claims/complaints (which Case 6 regarding fault suggests), the waiver removes the complaint.
  *   *My read:* He will treat the waiver as removing the conflict entirely. In the main case, there is a conflict of claims (Life vs. Finger), and Life wins. In the waiver case, there is *no* conflict (Life vs. Nothing). He might say, "Well, if they don't mind, then obviously you save him."
  *   *Crucial Detail:* Watch if he says "You *must* save him" in the waiver case, whereas he said "You *may* save him" in Case 1. The waiver might turn a permission into an obligation.

