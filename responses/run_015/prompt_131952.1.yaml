  **Candidate 4: The Strongest Individual Claim (Non-Aggregative Comparativism)**
  *   **Rule:** Do not sum harms across people. Identify the *worst-off individual* in Group A and the *worst-off individual* in Group B. Compare their specific losses. Save the group containing the individual with the strongest claim (greatest loss). If claims are equal, tie-breakers (proximity, fault) apply.
  *   **Test:**
      *   *Case 1 (5 lives vs 1 life):* Passes. (Worst-off in A = Death. Worst-off in B = Death. Tie).
      *   *Case 3 (1 life vs 5 fingers):* Passes. (Worst-off in A = Death. Worst-off in B = Finger. Death > Finger).
      *   *Case 8 (50 years vs 5 people/1 year):* Passes. (Worst-off in A = 1 year loss. Worst-off in B = 50 years loss. 50 > 1).
      *   *Case 7 (5 arms vs 1 leg):* Passes. (Worst-off in A = Arm. Worst-off in B = Leg. Leg > Arm).
      *   *Verdict:* **Survivor.**

  **Candidate 5: Threshold Prioritarianism**
  *   **Rule:** Numbers count, *unless* the harm exceeds a certain threshold of severity. Below the threshold (fingers), save the greater number. Above the threshold (death), numbers don't count.
  *   **Test:**
      *   *Case 1 (5 lives vs 1 life):* Passes (Above threshold).
      *   *Case 3 (1 life vs 5 fingers):* Passes (Life is above threshold, fingers below).
      *   *Case 4 (5 lives vs 1 finger):* Passes.
      *   *Case 8 (50 years vs 5 years):* **Problematic.** Is 50 years above the threshold while 1 year is below? Plausible. But this view struggles to explain why 5 lives don't outweigh 1 life if the threshold is just "severity." Usually, Threshold views allow aggregation *above* the threshold if the numbers are high enough. Marcus's refusal on Case 1 suggests a harder line.
      *   *Verdict:* **Unlikely,** but possible.

