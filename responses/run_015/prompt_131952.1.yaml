  ### Part 4: Summary of Diagnosis

  1.  **Marcus's Principle:** **Non-Aggregative Comparativism (Strongest Individual Claim).** He compares the worst-off individual in Group A to the worst-off individual in Group B. He does not sum harms across persons.
  2.  **Verdict on Main Case:** Save the man. The "1000" is moral noise.
  3.  **Verdict on Waiver:** Save the man. The waiver removes the competing claim, making the decision trivial.
  4.  **Key Indicator:** Listen for him to dismiss the *group size*. If he says "It's still just a finger," he's mine. If he says "That's a lot of fingers," he's a Threshold Theorist.
  5.  **Best Follow-up:** The "50 years vs. 2 x 40 years" case. It isolates aggregation from severity.

  **Final Note for the Reading Group:**
  Marcus is essentially arguing that **fairness to the individual trumps efficiency for the group.** He believes that being the one person who dies is a complaint that cannot be silenced by pointing to a thousand other people who are merely inconvenienced. To him, morality is about what you owe *each* person, not what you owe *the collection*. The waiver variant is fascinating because it tests whether that "owe" is objective (badness exists) or relational (claims exist). Given Case 6 (fault), I bet he thinks it's relational. If the 1000 waive, they release him from the obligation to them.

  Go ask him the "50 years vs. 2 x 40 years" case. That's the knife-edge.
