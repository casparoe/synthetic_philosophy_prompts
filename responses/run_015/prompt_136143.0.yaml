prompt: |-
  I do a 25-minute explainer slot at my paper once a month — whiteboard, and the room is reporters and editors who've had one stats class and zero philosophy. Mine's coming up and I want to spend it on the indicative / counterfactual distinction, because our copy is stuffed with lines like if the agency had acted sooner the spill would've been half the size, and nobody in the building can say what makes one of those true and another not.

  Don't explain it to me, plan the thing. What has to land first — that the two aren't just tensed versions of each other, that the counterfactual isn't going to get it's truth from what actually happened, or something else I haven't thought of — and why does the rest hang off that? Which one pair of sentences should carry the whole 25 minutes? I'm guessing it needs to be a case where the indicative is perfectly assertable and the counterfactual is flatly false, and it should probably NOT be one where the room can shrug and say well, anything's possible. My misconception list so far: that the difference is really just subjunctive grammar, that a counterfactual is true when the consequent is probable given the antecedent, and that you check one by holding the world fixed and changing only the antecedent. Where in the sequence does each get headed off, and which one am I missing that actually matters more than those? Also: what do I flatly refuse to get into at this level — possible-worlds and similarity-of-worlds machinery, the business about a conditional's probability being a conditional probability? — and say out loud that I'm skipping it. Last thing: one question I can put to the room at minute 22 that tells me whether they got the distinction or just absorbed the vibe.
