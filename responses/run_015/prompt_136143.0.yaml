answer: |-
  Here is the battle plan for your 25 minutes.

  ### 1. The First Thing That Must Land
  **Divergent Truth Values.**
  You must establish immediately that these are not two ways of saying the same thing. If they were just tense shifts, they would stand or fall together. They don't. One can be rock-solid true while the other is speculation.
  *   **Why:** This kills the "it's just grammar" misconception instantly. If you start with definitions, they'll tune out. If you start with "One of these sentences is a fact, the other is a guess, and they look almost identical," you have them.

  ### 2. The One Pair of Sentences
  Do not use the spill example to teach the logic. The spill example is too messy (too many variables, everyone has a pet theory on the agency). Use the **Lee Harvey Oswald** pair. It is the canonical example for a reason: everyone knows the outcome, so the truth values are stable.

  Write these on the board:
  1.  **Indicative:** "If Oswald didn't kill Kennedy, someone else did."
  2.  **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have."

  *   **Sentence 1** is assertable as true (Kennedy is dead; if not Oswald, then logically, another agent).
  *   **Sentence 2** is false (or at least unsupported). It implies a conspiracy/backup plan that didn't exist.
  *   **Why this pair:** It forces the room to admit they process the logic differently. You can't shrug and say "anything's possible." We know Kennedy died. We know there was no backup squad. The divergence is stark.

  ### 3. The Sequence & Misconception Takedown

  **Minutes 0–5: The Trap (Truth Values)**
  *   Write the two sentences. Ask: "Are these the same claim?"
  *   Ask: "Can one be true and the other false?"
  *   **Head off:** *The Grammar Misconception.* By showing the truth values diverge, you prove it's not just subjunctive mood decoration. It's a different logical operator.

  **Minutes 5–10: The Mechanism (Evidence vs. Cause)**
  *   Explain *why* Sentence 1 is true: It's based on **evidence** in the actual world (Kennedy is dead). The antecedent ("Oswald didn't") is treated as a possibility we are updating on.
  *   Explain *why* Sentence 2 is false: It's based on **causal structure**. It asks: "Did Oswald's action *cause* the death, or was the death inevitable?"
  *   **Head off:** *The Probability Misconception.* It's not that Sentence 2 is "unlikely." It's that it posits a causal mechanism (a conspiracy) that isn't there. Counterfactuals aren't about odds; they're about leverage.

  **Minutes 10–15: The Application (The Spill)**
  *   Now map it to their copy.
  *   *Indicative:* "If the agency is liable, they will pay." (We don't know if they are liable yet; this is a prediction based on rules).
  *   *Counterfactual:* "If the agency had acted sooner, the spill would be half the size." (We know they didn't act. This claims their inaction *caused* the extra size).
  *   **Head off:** *The "Hold the World Fixed" Misconception.* Reporters think counterfactuals mean "rewind the tape and change one thing." Tell them: "No. You change the antecedent *and* the immediate causes, but you keep the laws of physics and the background context." In the Oswald case, you keep "Kennedy died" fixed? No, you change that too. You keep "No conspiracy" fixed. That's why Sentence 2 fails.

  **Minutes 15–20: The Missing Misconception**
  *   **The one you haven't thought of:** **Intervention vs. Observation.**
  *   Indicatives are about *observation* (If I see A, I expect B).
  *   Counterfactuals are about *intervention* (If I *make* A happen, will B happen?).
  *   This matters more than the others because it's the difference between reporting a correlation and reporting a cause. This is where libel and misinformation live.

  **Minutes 20–22: The Exclusions (Say this out loud)**
  *   "I am explicitly skipping two things. First, **Possible Worlds.** I am not asking you to imagine infinite parallel universes. We are talking about causal models in *this* world. Second, **Conditional Probability.** I am not asking you to calculate P(B|A). A counterfactual's truth is not a probability number. It is a claim about structure."

  ### 4. The Diagnostic Question (Minute 22)
  Put this scenario on the board:
  *"A study shows that people who own fire extinguishers have more house fires."*

  Ask:
  **"Which sentence can I write, and which one gets me fired?"**

  1.  "If a house has an extinguisher, it is more likely to have a fire."
  2.  "If we put extinguishers in every house, there would be more fires."

  *   **If they get it:** They will say Sentence 1 is fine (Indicative/Evidential: extinguishers signal risk), but Sentence 2 is false (Counterfactual/Causal: extinguishers don't *cause* fires).
  *   **If they miss it:** They will think both are true (confusing correlation with causation) or both are false.
  *   **Why this works:** It tests the **Intervention vs. Observation** distinction directly. It tells you if they understand that counterfactuals imply causal leverage, while indicatives only imply evidence.

  ### Summary Checklist for the Whiteboard
  1.  **Oswald Pair** (Left side): Mark 1 as TRUE, 2 as FALSE.
  2.  **Key Distinction** (Center): EVIDENCE (Indicative) vs. CAUSATION (Counterfactual).
  3.  **Fire Extinguisher Test** (Right side): The minute 22 check.
  4.  **Excluded Zone** (Bottom): No Math. No Metaphysics.

  This plan respects their intelligence, avoids the哲学 (philosophy) jargon, and targets the exact error that leads to bad copy.
