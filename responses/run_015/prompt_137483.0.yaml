      *   *Practical Conclusion:* Explicitly state it does *not* follow. Scheffler isn't a self-sacrifice philosopher.
      *   *Cultural Dark Age:* Explain how Scheffler would likely treat this. It strengthens the user's critique of the summary. The summary implies biological continuity is key; Scheffler implies *normative* continuity is key.
      *   *Conclusion:* Wrap up with encouragement.

  6.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Check:* Did Scheffler say we care *more* about the collective afterlife than personal survival?
      *   *Correction:* In the Tanner Lectures (which became the book), he suggests we might care *more* about the collective afterlife than our own survival, *counterintuitively*. However, he does *not* draw the normative conclusion that we *ought* to stop fearing death. He says this reveals the *structure* of our valuing. The friend's summary conflates a descriptive claim (we care a lot) with a normative prescription (stop fearing death). I need to be careful here. Scheffler *does* suggest the collective afterlife might be more important to us than we think, potentially even more than personal survival, but the "stop fearing death" part is the real error.
