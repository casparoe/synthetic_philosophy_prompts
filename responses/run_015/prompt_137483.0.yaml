  7.  **Final Polish:** Ensure the tone is supportive of a high school student doing advanced work. Avoid jargon where possible, or explain it. Make sure the "Cultural Dark Age" section directly answers how it exposes the summary's unfairness.

      *(Self-Correction on the "Cultural Dark Age"):* If humans survive but lose culture, do they count as the "humanity" Scheffler cares about? Scheffler focuses on "people like us" or beings who can sustain value. If they are biologically human but lack the capacity for the practices we value, the "Afterlife" in the relevant sense is gone. This aligns with the user's intuition that the summary is too biological/consequentialist.

