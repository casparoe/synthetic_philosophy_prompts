  # Sorting Instrument: The Logical Space of Violent Decline

  ## 1. The Dimensions

  Before traversing the tree, note the five independent distinctions along which views on violence diverge. These are conceptual choices, not empirical findings.

  *   **Ontology of Harm:** Does violence require a direct agent causing bodily damage, or does it include institutional structures and remediable deprivation that cause death without a 'blow' being struck? (Independent of Measurement).
  *   **Moral Patients:** Is the set of victims restricted to human beings, or does it extend to all sentient creatures capable of suffering? (Independent of Ontology).
  *   **Denominator:** Is the trend measured by absolute counts of victims, by rates per capita, or by exposure units such as person-years at risk? (Absolute counts and rates are mutually exclusive measures; exposure units are independent).
  *   **Risk Profile:** Is the trend assessed by the expected annual harm (the mean) or by the probability of catastrophic tail events (the variance/extreme)? (Independent of Denominator).
  *   **Metaphysics of the Concept:** Is 'violence' a single measurable quantity with a truth-apt trend, or is it an essentially contested cluster concept with no single fact of the matter? (Independent of all empirical measures; collapses only with Epistemic Scepticism if one confuses 'no fact' with 'no evidence').

  ## 2. The Decision Tree

  *Instructions:* Answer each node as a standalone supposition. Do not worry about consistency with previous answers until you reach a leaf; the tree will sort you based on your commitments. Treat all empirical premises (e.g., "suppose the rate has fallen") as granted for the sake of the argument.

  1.  **N1 (Comparability):** Suppose we attempt to compare the violence of a spear-kill in 10,000 BC with a drone strike today. Is there a single coherent metric that makes this comparison meaningful, or are the contexts so different that 'violence' fractures into incommensurable concepts?
      *   *Incommensurable/No single metric* → Go to **Leaf 1**.
      *   *Meaningful/Single metric* → Go to **N2**.

  2.  **N2 (Data Quality):** Suppose the historical record relies on skeletal remains and contested population estimates, while modern data rests on bureaucratic records. Is the gap in reliability so wide that we cannot know the trend, even if a fact of the matter exists?
      *   *Cannot know (Epistemic block)* → Go to **Leaf 2**.
      *   *Can know (Evidence sufficient)* → Go to **N3**.

  3.  **N3 (Case d: Animals):** Suppose the number of animals killed for food per head of population has multiplied several times over the period in question. Does this increase count towards the global violence trend?
      *   *Yes (Animals count)* → Go to **Leaf 3**.
      *   *No (Humans only)* → Go to **N4**.

  4.  **N4 (Intent):** Suppose a death results from gross negligence rather than malicious intent. Does this count as an instance of violence for the purpose of the trend?
      *   *Yes (Outcome matters)* → Go to **N5**.
      *   *No (Intent required)* → Go to **N6**.

  5.  **N5 (Case g: Famine):** Suppose a famine follows from trade and aid policy, and no one strikes a blow. Is this instance counted as violence in the trend?
      *   *Yes (Structure counts)* → Go to **Leaf 4**.
      *   *No (Agent-caused only)* → Go to **N6**.

  6.  **N6 (Absolute Counts):** Suppose the rate of violence per capita has fallen substantially, but the total population has grown so that the absolute number of victims has risen. Is the world less violent?
      *   *No (Absolute numbers rule)* → Go to **Leaf 5**.
      *   *Yes (Rates rule)* → Go to **N7**.

  7.  **N7 (Case e: Tail Risk):** Suppose expected annual battle deaths fall while the probability of a conflict killing a large fraction of the population rises. Has violence declined?
      *   *No (Tail risk dominates)* → Go to **Leaf 6**.
      *   *Yes (Expectation dominates)* → Go to **N8**.

  8.  **N8 (Case c: Prison):** Suppose interpersonal violence falls steeply while imprisonment rises sharply and prison violence is common. Is this a net decline?
      *   *No (Displacement/State violence)* → Go to **N9**.
      *   *Yes (Net decline)* → Go to **N9**.
      *   *(Note: Both answers lead to N9, but 'No' flags a commitment used in Leaf 7 diagnostics).* → Go to **N9**.

  9.  **N9 (Case a: Deterrence):** Suppose one state credibly threatens to destroy another's city and the threatened invasion never happens. Has violence been prevented, or merely held in reserve?
      *   *Held in reserve (Not a decline)* → Go to **Leaf 7**.
      *   *Prevented (A decline)* → Go to **N10**.
      *   *(Note: If you answered 'No' at N8 and 'Held in reserve' here, you are routed to Leaf 7).*

  10. **N10 (Case b: Life Expectancy):** Suppose the annual risk of being killed stays constant while life expectancy doubles, so the chance of dying violently at some point in a life goes up. Has violence declined?
      *   *No (Lifetime risk matters)* → Go to **Leaf 8**.
      *   *Yes (Annual rate matters)* → Go to **N11**.

  11. **N11 (Case h: Borderlands):** Suppose a rate computed over the whole population falls while the rate among young men in contested borderlands does not. Is the world less violent?
      *   *No (Localised experience rules)* → Go to **Leaf 9**.
      *   *Yes (Global average rules)* → Go to **N12**.

  12. **N12 (Case f: Aggregation):** Suppose one airstrike kills five hundred people; in the comparison period the same five hundred deaths occurred in five hundred separate fights between individuals. Are these equivalent instances of violence?
      *   *No (Aggregation matters)* → Go to **Leaf 10**.
      *   *Yes (Deaths are deaths)* → Go to **Leaf 10**.
      *   *(Note: This node filters for the final leaf; answer either way to proceed).* → Go to **Leaf 10**.

  ## 3. Labelled Leaves

  **Leaf 1: No Fact of the Matter**
  *   **Commitment:** You cannot coherently argue about the trend because 'violence' is a cluster concept with no single measurable referent across history.
  *   **Path:** N1 = Incommensurable.
  *   **Distinction:** Distinct from Epistemic Scepticism; you claim there is no truth to be known, not that the truth is hidden.

  **Leaf 2: Epistemic Scepticism**
  *   **Commitment:** There is a fact of the matter, but the skeletal and documentary evidence is too contested to reach it.
  *   **Path:** N1 = Single metric; N2 = Cannot know.
  *   **Distinction:** Distinct from Leaf 1; you accept the concept is coherent but the data is insufficient.

  **Leaf 3: Moral-Patient Expansionism**
  *   **Commitment:** The trend is sharply upward because the industrialisation of animal killing outweighs human pacification.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = Yes.
  *   **Distinction:** Commits you to prioritising animal suffering over human geopolitical stability.

  **Leaf 4: Structural Expansionism**
  *   **Commitment:** The trend is flat or worsening because coercion and remediable deprivation count as violence.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4 = Yes; N5 = Yes.
  *   **Distinction:** Commits you to viewing policy-induced starvation as morally equivalent to assault.

  **Leaf 5: Absolutism**
  *   **Commitment:** A falling rate with a rising number of victims is not a decline at all.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = No.
  *   **Distinction:** Commits you to ignoring population growth as a mitigating factor in moral assessment.

  **Leaf 6: Tail Risk Reversal**
  *   **Commitment:** Declinism about expected harm is cancelled by the rising probability of existential catastrophe.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = Yes; N7 = No.
  *   **Distinction:** Commits you to valuing survival probability over annual body counts.

  **Leaf 7: Substitution Scepticism**
  *   **Commitment:** The decline is an artefact of violence being outsourced to the state or held in reserve by deterrence.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = Yes; N7 = Yes; (N8 = No OR N9 = Held in reserve).
  *   **Distinction:** Commits you to viewing the state's monopoly on force as a form of violence, not its suppression.

  **Leaf 8: Lifetime Risk Reversal**
  *   **Commitment:** Longer lives expose individuals to more cumulative risk, negating the fall in annual rates.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = Yes; N7 = Yes; N8/N9 = Decline; N10 = No.
  *   **Distinction:** Commits you to measuring violence over a whole life course rather than per person-year.

  **Leaf 9: Localised Stasis**
  *   **Commitment:** Global averages mask the reality for those actually at risk in contested zones.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = Yes; N7 = Yes; N8/N9 = Decline; N10 = Yes; N11 = No.
  *   **Distinction:** Commits you to weighting the experience of combatants/civilians in war zones over the global population.

  **Leaf 10: Straightforward Declinism**
  *   **Commitment:** Violence is a bodily, agent-caused, per-person-year measure among humans where a falling rate indicates a real decline.
  *   **Path:** N1 = Single metric; N2 = Can know; N3 = No; N4/N5 = No; N6 = Yes; N7 = Yes; N8/N9 = Decline; N10 = Yes; N11 = Yes.
  *   **Distinction:** The standard Pinkerian position; commits you to ignoring structural, animal, and tail-risk objections.

  ## 4. Diagnostics of the Space

  **Empty Logical Space**
  *   **Tail Risk without Lifetime Risk:** (N7 = No, N10 = Yes). *Verdict: Unattractive.* Caring about catastrophic variance while ignoring cumulative lifetime exposure is inconsistent risk aversion.
  *   **Structural without Animal:** (N5 = Yes, N3 = No). *Verdict: Unexplored.* Common in political philosophy, but logically unstable if the criterion is 'suffering' rather than 'agency'.
  *   **Absolutism with Localised Stasis:** (N6 = No, N11 = No). *Verdict: Incoherent.* If absolute counts matter, local rates are irrelevant; if local rates matter, absolute global counts are less relevant.

  **Indistinguishable Leaves**
  *   **Leaf 7 (Substitution) and Leaf 9 (Localised):** The instrument cannot fully separate these if a participant believes state violence is *only* violent in borderlands. Both result in a rejection of global declinism based on specific pockets of harm.

  **Order Dependence**
  *   **N4 (Intent) and N5 (Famine):** If N5 is asked before N4, a participant might admit famine is violence but deny negligence is. If N4 is asked first, they may rule out famine by principle of intent. The current order (Intent then Famine) biases towards the 'Agent-caused' leaf.

  **Biased Node**
  *   **Node N5 (Case g: Famine).** Participants familiar with the debate will recognise this as the standard critique of 'liberal' declinism. They may answer 'No' to signal alignment with empirical rigour rather than because they truly believe policy-induced starvation is non-violent.
  *   **Rephrasing:** "Suppose a government cuts food aid knowing starvation will follow, but sends no soldiers. Is the resulting death count added to the violence total?" (This removes the abstract label 'policy' and focuses on the knowledge/intent link).

  ## 5. Routing Table

  | Leaf | Name | Shortest Path (Node = Answer) |
  | :--- | :--- | :--- |
  | **L1** | No Fact | N1 = Incommensurable |
  | **L2** | Epistemic | N1 = Single; N2 = Cannot know |
  | **L3** | Moral-Patient | N1 = Single; N2 = Can; N3 = Yes |
  | **L4** | Structural | N1 = Single; N2 = Can; N3 = No; N4 = Yes; N5 = Yes |
  | **L5** | Absolutism | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = No |
  | **L6** | Tail Risk | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = Yes; N7 = No |
  | **L7** | Substitution | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = Yes; N7 = Yes; (N8 = No OR N9 = Reserve) |
  | **L8** | Lifetime | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = Yes; N7 = Yes; N8/9 = Decline; N10 = No |
  | **L9** | Localised | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = Yes; N7 = Yes; N8/9 = Decline; N10 = Yes; N11 = No |
  | **L10** | Straightforward | N1 = Single; N2 = Can; N3 = No; N4/5 = No; N6 = Yes; N7 = Yes; N8/9 = Decline; N10 = Yes; N11 = Yes |
