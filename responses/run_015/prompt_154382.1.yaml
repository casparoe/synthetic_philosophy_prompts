answer: |-
  **Course:** PHIL 405: Locke and the Empiricists  
  **Assessment:** Final Examination  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 30  

  **Essay Question**

  Locke's *Some Thoughts Concerning Education* famously rejects corporal punishment in favor of governing children through "esteem and disgrace," urging tutors to reason with pupils wherever possible. Yet, he simultaneously insists that a tutor must inevitably "break the will" of a stubborn child to ensure submission to reason. Critically assess whether this pedagogical strategy is consistent with Locke's empiricist psychology, specifically the *tabula rasa* and the formation of virtue through habit rather than innate temperament. 

  In your answer, incorporate the concept of **pedagogical moral luck**: if educational success depends partly on a child's native pliability rather than solely on tutor skill, does this undermine Locke's claim that character is constructed through experience? Argue whether Locke's system can be repaired to accommodate this tension or if it collapses into inconsistency.

  ***

  ### Model Answer (High Distinction Standard)

  Locke's educational theory rests on a precarious hinge between liberal rationalism and authoritarian necessity. On one side, he argues that children are rational creatures in development who should be motivated by shame and esteem rather than pain. On the other, he mandates the "breaking of the will" when obstinacy arises. This creates a fundamental tension: if the mind is a *tabula rasa* and virtue is merely habituated experience, there should be no inherent "will" strong enough to require breaking, only bad habits to be corrected.

  First, the tension between rational persuasion and will-breaking is not merely procedural but psychological. Reasoning presupposes a capacity for judgement that Locke admits children lack in early years. When Locke advises breaking the will, he is not correcting a specific false idea (which empiricism could explain) but subduing a volitional resistance. This implies the existence of a native drive toward autonomy or obstinacy that exists prior to experience. If virtue comes mainly from habit, stubbornness should be treatable like any other bad habit; framing it as a will that must be "broken" suggests an innate adversarial force within the child that contradicts the passive receptivity of the *tabula rasa*.

  Second, Locke's distinction between wit and judgement does not dissolve this tension. In his epistemology, wit associates ideas quickly, while judgement separates them accurately. One might argue that stubborn children lack judgement, not will. However, the pedagogical act of breaking the will targets submission, not cognitive accuracy. A child can judge correctly that fire burns but still willfully touch it. Locke's educational coercion targets the *passion* of obstinacy, not the *intellect's* failure to distinguish ideas. Therefore, the wit/judgement distinction is irrelevant to the problem of coercive habituation; the conflict remains between forcing submission and cultivating rational autonomy.

  Third, an innate temperament inevitably sneaks into Locke's account despite the blank slate. Locke frequently advises tutors to observe a child's "natural temper" before proceeding. If tempers vary innately—some children being naturally more pliable, others more stubborn—then the mind is not blank regarding dispositions, only regarding ideas. This compromises the strict empiricist claim that all content (including character traits) comes from experience. By acknowledging native temperaments, Locke inadvertently admits that the "slate" has a grain that resists the writer's hand, suggesting that virtue is not solely constructed but partly cultivated from native stock.

  Fourth, applying the framing of pedagogical moral luck reveals a vulnerability in Locke's empiricism. If success depends on the child having a pliable nature, then the tutor's success is partly luck, not skill. If Tutor A succeeds with a pliable child and Tutor B fails with a stubborn child using identical Lockean methods, Locke's system cannot explain the divergence through experience alone. This undermines the empiricist promise that proper environmental engineering guarantees moral output. It suggests that moral outcome is contingent on factors outside the empiricist's control (native disposition), rendering the promise of universal educability false.

  Finally, Locke's view can be repaired, but only by softening his empiricism. If we interpret *tabula rasa* as applying only to *ideas* and not *dispositions*, the system holds. Locke can claim that while all knowledge is experiential, the *capacity* for virtue varies by native temperament. However, this requires abandoning the strong empiricist claim that character is mainly habit and experience. Without this modification, the system collapses: you cannot claim the mind is wholly shaped by experience while simultaneously relying on force to suppress native obstinacy that experience did not create. The consistent Lockean must admit that while the mind starts blank of ideas, it is not blank of drives.

  ***

  ### Marking Scheme (30 Marks Total)

  | Move | Criteria | Marks | Common Pitfall |
  | :--- | :--- | :--- | :--- |
  | **1. Tension Articulation** | Precisely defines the conflict between reasoning (esteem/shame) and coercion (will-breaking) as a psychological contradiction, not just a methodological one. | **6** | Students often treat this as a simple contradiction in advice rather than a conflict in psychological theory. |
  | **2. Wit vs. Judgement** | Explains why the epistemological distinction fails to resolve the pedagogical coercion problem (targets passion/volition, not cognitive association). | **6** | Candidates frequently conflate Locke's *Understanding* distinctions with *Education* goals, arguing wit causes stubbornness. |
  | **3. Innate Temperament** | Argues that acknowledging "natural temper" compromises the strict *tabula rasa* regarding dispositions, not just ideas. | **6** | Students often assume habit-formation is purely environmental with no room for native disposition in Locke's text. |
  | **4. Moral Luck** | Applies the concept to show how native pliability makes educational success contingent on luck, undermining the claim that experience dictates character. | **6** | Candidates typically define moral luck generally rather than applying it specifically to the tutor/child dynamic. |
  | **5. Conclusion/Repair** | Offers a decisive verdict on consistency (usually requiring a modification of empiricism) rather than a vague "both sides have merit" summary. | **6** | Students often conclude Locke is "mostly right" without addressing the structural collapse of the empiricist claim. |
  | **Total** | | **30** | |

  ***

  ### Examiner's Aside

  **What would change my mind?**  
  If a student could cite Locke's specific admissions in *Some Thoughts* (e.g., §112) where he explicitly distinguishes between "natural ill constitution" and habits, arguing that Locke *intentionally* limits *tabula rasa* to ideas only, I would accept that as a successful repair of the system rather than a collapse. My model answer assumes this distinction is a failure of consistency, but it could be argued as a nuanced feature of his theory.

  **Where is my reasoning shakiest?**  
  I am least certain on the " Wit vs. Judgement" move. It is possible to argue that obstinacy *is* a failure of judgement (misjudging the value of submission), which would make the distinction relevant. I have ruled this out in the model answer, but a clever student could challenge that boundary if they ground it firmly in Locke's definition of wrong volition.
