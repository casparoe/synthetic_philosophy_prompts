prompt: |-
  hey, i'm putting together the final exam for my upper-level seminar on Locke and the empiricists and i want one essay question that isnt just "summarize Locke on education." I want it in the weeds — specifically the tension between his anti-corporal-punishment rhetoric (reason with the child, use shame and esteem) and his actual advice that parents must sometimes "break the will" of a stubborn kid. The crux should be whether he can keep that consistent with tabula rasa and with his claim that virtue comes mainly from habit and experience rather than innate temperment. I also want you to inject this idea of "pedagogical moral luck" — like, if a child succeeds under Locke's method, is that because the tutor was skillful or because the kid just happened to have a pliable nature, and does that possibility undercut Locke's empiricism about the mind?

  Please write me a single essay prompt for 90 minutes, 30 marks, aimed at students who've read Some Thoughts Concerning Education but probably dont have the text in front of them. The question should be unanswerable by just reciting Locke's chapters — it should force them to resolve or at least articulate the tension. Then give me a model answer that hits about five specific moves: (1) state the tension between rational persuasion and will-breaking precisely, (2) show why Locke's distinction between wit and judgement doesnt actually dissolve it, (3) argue whether an innate temperment sneaks into his account despite the blank slate, (4) apply the moral-luck framing to see if educational success is partly luck, and (5) conclude whether Locke's view can be repaired or collapses. Pair that with a marking scheme that assigns marks to each move (totalling 30), plus a one-line note on how candidates typically botch each one — for instance, conflating Locke with Rousseau, or treating habit-formation as purely environmental with no room for native disposition.

  Dont ask for a bibliography, page citations, or a reading list — a student without web access should be able to reason through it. And at the end, in a brief aside, say what kind of student counter-argument or textual detail would change your mind about the model answer's verdict, and be honest about where your own reasoning on Locke's consistency is shakiest. There's probably a typo or two in here but you get the idea.
