  3.  **Brainstorming Objections (Defeaters):**

      *   *Objection 1: The Binary Nature of Death/Responsibility.* We treat death as binary. You are either responsible for a crime or not. You either get your pension or not. Degrees of survival don't map to social/legal practices.
      *   *Objection 2: The "Causal Density" Metric is Vague.* How do you measure it? Is it energy transfer? Information fidelity? Spatiotemporal proximity? If it's just information fidelity, that's PC. If it's physical continuity, that's Animalism/Body view. What's the middle ground?
