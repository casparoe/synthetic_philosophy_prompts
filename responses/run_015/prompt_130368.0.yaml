  1.  **Analyze the User's Position:**
      *   **Core View:** A hybrid view of Parfit's teletransporter. Survival depends on *both* psychological continuity (PC) *and* a specific "causal density" between original brain-state transitions and the replica's.
      *   **Motivation:** To avoid the fission problem (where one person splits into two, challenging the "same person" intuition).
