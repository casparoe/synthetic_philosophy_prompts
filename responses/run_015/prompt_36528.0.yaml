      *   *Group Size:* 18 students total. Split into two committees of 9. This allows for sub-groups if needed, but 9 is a good size for a single roundtable discussion per group.
      *   *Time:* 80 minutes total.
          *   Intro/Setup: 10 mins.
          *   Committee Deliberation: 30 mins.
          *   Reveal/Comparison: 20 mins.
          *   Debrief/Philosophical Mapping: 20 mins.
      *   *The Twist:* Committee A (Labelled) vs. Committee B (Anonymised/Capacity-based).

  3.  **Drafting the Case Files:**
      *   Need ~6 cases to force hard choices against a limited budget.
      *   *Budget:* Let's say £1 million. Each treatment costs £400k. They can fund 2, maybe 3 if they stretch, but let's make it tight. Fund 2 out of 6.
      *   *Case 1 (High Human):* Typical adult human, treatable condition, high future potential.
      *   *Case 2 (Marginal Human - Severe):* Permanent Vegetative State (PVS). No sentience.
      *   *Case 3 (Marginal Human - Moderate):* Severe cognitive impairment (e.g., Trisomy 13), limited communication, feels pain/joy.
      *   *Case 4 (High Animal):* Great Ape (Chimp/Bonobo). High cognition, social, self-aware.
      *   *Case 5 (Mid Animal):* Dog. Social, feels pain, limited future planning.
      *   *Case 6 (Low Animal):* Pig/Chicken (Livestock). Sentient but lower cognitive complexity.
      *   *Refinement for the "Anonymised" Group:* I need to describe Case 4 (Chimp) so it sounds cognitively superior to Case 3 (Impaired Human) without saying "Chimp". I need to describe Case 2 (PVS) so it sounds like "biological life only".
      *   *Cost:* All treatments cost the same to simplify the math. Let's say £500k each, Budget £1m. Fund exactly two.

  4.  **Drafting the Committee Instructions:**
      *   *Charter:* "Maximise welfare reduction of suffering and promotion of flourishing." Deliberately vague on *whose* welfare.
      *   *Committee A:* Sees names/species (e.g., "Patient H1", "Subject A1").
      *   *Committee B:* Sees codes (e.g., "Subject 01", "Subject 02") and capacity metrics.

  5.  **Developing the Debrief:**
      *   Need to connect the divergence in decisions to specific arguments.
      *   *Argument from Marginal Cases:* If you save the impaired human but not the chimp, why?
      *   *Species Norms:* Is it about what they *are* or what they *can do*?
      *   *Relational Duties:* Humans owe humans more?
      *   *Anonymised Group:* Did they act more consistently? Or did they lack context?

  6.  **Addressing the "Honest Notes":**
      *   *Failure 1:* Guessing the species. Students are smart. They will guess "Subject 04 is a dog."
      *   *Fix:* Acknowledge it, ask *how* they knew, and pivot to why that knowledge influenced them.
      *   *Failure 2:* Emotional collapse. "But it's a baby!"
      *   *Fix:* Validate emotion but return to principles.
      *   *Structural Limitation:* Relationality. Committees are strangers. Real life involves parents/owners. The activity isolates "impartial morality" vs. "partial duties."

