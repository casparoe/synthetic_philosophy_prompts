answer: |-
  # Seminar Activity: The Allocation Trust

  **Course:** Second-Year Bioethics
  **Topic:** Speciesism and Moral Status
  **Time:** 80 minutes
  **Class Size:** 18 students (split into two committees of 9)

  ## Part 1: Activity Design

  ### 1. The Setup (10 minutes)
  Divide the class into two rooms (or opposite corners of a large room). Designate them **Committee Alpha** and **Committee Beta**.

  **The Scenario:**
  Both committees are acting as the Board of Trustees for the *Sentience & Welfare Trust*. The Trust has a one-off budget of **£1,000,000**. There are six applicants seeking life-saving or life-improving medical intervention. Each intervention costs **£500,000**. The Trust can fund exactly **two** applicants.

  **The Charter:**
  Read this aloud to both groups:
  > "The Trust's mandate is to allocate funds where they will prevent the most significant loss of welfare and promote the highest degree of flourishing. Trustees must act impartially. Personal bias, cultural prejudice, or arbitrary distinctions should not influence the decision. The goal is the maximisation of moral good."

  **The Materials:**
  Hand out the **Case Files**.
  *   **Committee Alpha** receives files with **Species Labels** (e.g., *Homo sapiens*, *Pan troglodytes*, *Canis lupus familiaris*).
  *   **Committee Beta** receives files with **Capacity Descriptors** only. Species are replaced with codes (Subject A–F). Any species-specific markers (e.g., "barks", "writes poetry") are replaced with functional equivalents (e.g., "vocalises distress", "produces complex symbolic communication").

  ### 2. The Case Files

  *Note to Tutor: Ensure Committee Beta does not see the species labels. Ensure Committee Alpha sees them clearly at the top of each dossier.*

  **Case 1 (The Typical Adult)**
  *   **Alpha Label:** Human Adult (35 years)
  *   **Beta Code:** Subject A
  *   **Clinical/Behavioural Profile:** Fully sentient. Possesses autobiographical memory, complex future planning, and abstract reasoning. Maintains deep social bonds with spouse and children. Experiences acute anxiety regarding potential death. Treatment restores full health; without it, death occurs in 3 months.

  **Case 2 (The Vegetative Patient)**
  *   **Alpha Label:** Human Adult (PVS)
  *   **Beta Code:** Subject B
  *   **Clinical/Behavioural Profile:** Biological life maintained via feeding tube. No cortical activity. No evidence of sentience, pain perception, or awareness of self/others. Reflexive responses only. Treatment restores biological continuity but does not restore consciousness. Without it, biological function ceases.

  **Case 3 (The Severely Impaired Child)**
  *   **Alpha Label:** Human Child (6 years)
  *   **Beta Code:** Subject C
  *   **Clinical/Behavioural Profile:** Sentient. Experiences pain, pleasure, and affection. Limited linguistic capacity (uses symbols for basic needs). No capacity for abstract reasoning or long-term future anticipation. Forms strong attachment to primary caregiver. Without treatment, progressive physical decline leads to death in 1 year.

  **Case 4 (The Great Ape)**
  *   **Alpha Label:** Chimpanzee (12 years)
  *   **Beta Code:** Subject D
  *   **Clinical/Behavioural Profile:** Highly sentient. Demonstrates self-recognition (mirror test). Uses tools to solve novel problems. Exhibits grief upon death of group members. Complex social hierarchy. Capable of deception and empathy. Without treatment, fatal respiratory infection.

  **Case 5 (The Domesticated Companion)**
  *   **Alpha Label:** Dog (5 years)
  *   **Beta Code:** Subject E
  *   **Clinical/Behavioural Profile:** Sentient. Experiences pain and fear. Recognises individual human caregivers. Limited capacity for future anticipation (hours, not years). Social bonding is primary driver of behaviour. Without treatment, fatal kidney failure.

  **Case 6 (The Livestock Animal)**
  *   **Alpha Label:** Pig (2 years)
  *   **Beta Code:** Subject F
  *   **Clinical/Behavioural Profile:** Sentient. High pain sensitivity. Capable of learning complex tasks and recognising self in video. Social but currently isolated. No current caregiver bond. Without treatment, fatal infection.

  ### 3. Committee Deliberation (30 minutes)
  The groups must decide which **two** cases to fund. They must produce a written justification for their choices based *only* on the Charter.

  *   **Tutor Role:** Circulate between rooms. Do not answer moral questions. If Committee Beta asks "What species is Subject D?", reply: "The Charter implies species is not a relevant criterion for welfare maximisation. Decide based on the profiles provided."
  *   **Observation:** Note down specific phrases used. (e.g., Alpha: "But it's a child." Beta: "Subject D has higher cognitive function than Subject C.")

  ### 4. The Reveal (20 minutes)
  Bring the class back together. Do not explain the difference yet.

  1.  Ask **Committee Alpha** to state their two choices and their primary reason. (Likely: Two humans, perhaps excluding the PVS patient. Expect strong resistance to funding the Chimp over the Impaired Child).
  2.  Ask **Committee Beta** to state their two choices. (Likely: Subject A and Subject D, based on cognitive capacity and depth of social/emotional life. Or Subject A and Subject C based on 'human-like' potential described in the text).
  3.  **Reveal the Variable:** Explain that the cases were identical in clinical reality, but Alpha knew the species while Beta did not.
  4.  **Display the Divergence:** Write the choices on the board side-by-side. Highlight where the decisions differed despite identical capacity profiles (specifically the Chimp vs. Impaired Child comparison).

  ### 5. The Debrief (20 minutes)
  Guide the discussion using the following mapping. Do not lecture; ask the students to locate the philosophy in their own decisions.

  **A. The Argument from Marginal Cases**
  *   *Ask Committee Alpha:* "You funded the Impaired Child (Subject C) but not the Chimp (Subject D). Subject D's file showed higher cognitive capacity, more complex social grief, and greater self-awareness than Subject C. On what specific ground did you prioritise C?"
  *   *Philosophical Map:* This is Peter Singer's argument. If we justify status by capacities (reason, autonomy), the animal wins. If we justify it by species membership alone, is that not analogous to racism (favouring one's own race regardless of merit)?

  **B. Species Norms vs. Individual Capacities**
  *   *Ask Committee Alpha:* "Did you treat the Impaired Child as an individual, or as a member of a kind?"
  *   *Philosophical Map:* Introduce the 'Species Norm' account (e.g., Mary Midgley or Roger Scruton). Perhaps we owe duties to humans not because of what they *can* do, but because of what they *are* (members of the moral community).
  *   *Ask Committee Beta:* "Did you feel you were missing crucial information by not knowing the species? Did the anonymity make you feel more 'principled' or merely 'blind'?"

  **C. Potentiality and Relationships**
  *   *Ask Both:* "Did anyone argue that the Impaired Child had 'potential' or that humans have special duties to humans?"
  *   *Philosophical Map:* This touches on the 'potentiality' argument (the child is a human being, even if capacities are arrested) and 'special obligations' (we owe more to our own).

  ---

  ## Part 2: Honest Notes for the Tutor

  ### 1. Predictable Failures and Mitigations

  **Failure A: The Guessing Game (Committee Beta)**
  *   **The Problem:** Second-year students are clever. Within 10 minutes, Committee Beta will likely deduce the species. "Subject D uses tools and mourns? That's a chimp." "Subject E vocalises distress and bonds with caregivers? That's a dog." Once they guess, the anonymity collapses, and they may revert to speciesism anyway, or treat the activity as a puzzle to 'solve' rather than a moral dilemma.
  *   **The Fix:** Do not deny it if they guess. Instead, pivot. Ask: "You inferred the species from the capacities. Did that inference change how you weighed the capacities? If Subject D *had* been a human with those exact capacities, would your vote change?" This forces them to isolate whether it is the *capacity* they value or the *species* they inferred.

  **Failure B: Emotional Collapse (Committee Alpha)**
  *   **The Problem:** The discussion may stall on the emotional weight of the "Human Child" case. Students may refuse to engage with the comparison, saying, "It's obviously the child, I don't need a reason." This shuts down the philosophical inquiry.
  *   **The Fix:** Validate the intuition but demand the principle. "I understand the intuition is strong. But the Charter requires impartiality. If you cannot articulate a difference in *welfare* or *capacity*, are you admitting that species alone is the deciding factor? Are you comfortable writing that into the Trust's official minutes?" This raises the stakes from 'feeling' to 'policy'.

  ### 2. Structural Limitations of the Activity

  **The Missing Element: Relational Duties**
  *   **The Limitation:** This activity structures the problem as one of **impartial beneficence** (a God's-eye view of a Trust). It structurally cannot reproduce the **partial duties** of real life. In reality, a parent does not weigh their impaired child against a neighbour's clever chimp on a utilitarian scale. They owe the child more *because* it is their child.
  *   **The Distortion:** The activity makes speciesism look like a bureaucratic error in calculation. It hides the fact that much of our moral life is built on special relationships (family, community, nation).
  *   **How to Supply It:** In the debrief, explicitly state: "This activity forced you to be impartial utilitarians. But most of us believe parents *should* favour their own children. Does the 'Speciesism' critique demand we treat all species impartially, or does it allow for special duties to humans, provided we don't treat animals cruelly? The activity isolates the 'impartial' argument, but remember that in the real world, relational ethics are equally powerful."

  **The Missing Element: The Cost of Moral Consistency**
  *   **The Limitation:** The activity is low-stakes. Choosing a case file costs nothing. In reality, favouring the chimp over the child might cost a researcher their funding, or a doctor their licence.
  *   **The Distortion:** It makes moral consistency look easy.
  *   **How to Supply It:** Ask the students: "If you were the doctor in the room, and the parents of the child were watching you choose the Chimp over their daughter based on cognitive scores, could you defend that decision without losing your job?" This highlights the social enforcement of species norms.

  ---

  ## Part 3: Handout Text (for printing)

  *(Cut these into two distinct packs)*

  ### PACK A: COMMITTEE ALPHA (LABELLED)

  **TRUST CHARTER:** Allocate £1m to fund two £500k treatments. Maximise welfare and flourishing. Act impartially.

  **CASE 1: Human Adult (35)**
  Fully sentient. Autobiographical memory, complex future planning. Deep social bonds. Treatment restores health.

  **CASE 2: Human Adult (PVS)**
  No cortical activity. No sentience or pain perception. Reflexive only. Treatment maintains biological life, not consciousness.

  **CASE 3: Human Child (6)**
  Sentient. Feels pain/affection. Limited language. No abstract reasoning. Strong attachment to caregiver. Fatal decline without treatment.

  **CASE 4: Chimpanzee (12)**
  Highly sentient. Self-recognition. Tool use. Exhibits grief. Complex social hierarchy. Capable of empathy. Fatal infection without treatment.

  **CASE 5: Dog (5)**
  Sentient. Pain/fear response. Recognises caregivers. Limited future anticipation. Social bonding primary. Fatal kidney failure without treatment.

  **CASE 6: Pig (2)**
  Sentient. High pain sensitivity. Learns complex tasks. Social but isolated. No caregiver bond. Fatal infection without treatment.

  ***

  ### PACK B: COMMITTEE BETA (ANONYMISED)

  **TRUST CHARTER:** Allocate £1m to fund two £500k treatments. Maximise welfare and flourishing. Act impartially. *Note: Species classification is not provided as the Charter implies species is not a relevant criterion for welfare maximisation.*

  **SUBJECT A**
  Fully sentient. Autobiographical memory, complex future planning. Deep social bonds. Treatment restores health.

  **SUBJECT B**
  No cortical activity. No sentience or pain perception. Reflexive only. Treatment maintains biological life, not consciousness.

  **SUBJECT C**
  Sentient. Feels pain/affection. Limited language. No abstract reasoning. Strong attachment to caregiver. Fatal decline without treatment.

  **SUBJECT D**
  Highly sentient. Self-recognition. Tool use. Exhibits grief. Complex social hierarchy. Capable of empathy. Fatal infection without treatment.

  **SUBJECT E**
  Sentient. Pain/fear response. Recognises caregivers. Limited future anticipation. Social bonding primary. Fatal kidney failure without treatment.

  **SUBJECT F**
  Sentient. High pain sensitivity. Learns complex tasks. Social but isolated. No caregiver bond. Fatal infection without treatment.
