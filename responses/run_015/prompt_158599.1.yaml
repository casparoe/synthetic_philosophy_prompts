answer: |-
  You have diagnosed the situation with remarkable clarity. Your group is not stuck on institutional design; you are stuck on **political ontology**. You are arguing past each other because you are operating with incompatible definitions of what makes power *legitimate*.

  Here is the honest diagnosis you asked for, broken down by the level of disagreement, why your hybrid failed, why you are pretending it's technical, and how to actually move forward.

  ### 1. The Level of Disagreement: Input vs. Output Legitimacy
  You asked if this is an empirical bet, a conceptual fight, or two different questions. It is primarily a **conceptual fight about the source of legitimacy**, disguised as an empirical bet.

  *   **The Anti-Sortition Camp (The Authorization View):** For them, democracy is a **transaction of will**. Legitimacy comes from *Input*. I am free because I authorized this ruler through my vote, and I remain free because I can fire them. If I didn't choose you, you don't rule *me*; you rule *over* me. To them, sortition is indistinguishable from oligarchy or monarchy because the "chain of consent" is broken.
  *   **The Pro-Sortition Camp (The Constitution View):** For them, democracy is a **state of being**. Legitimacy comes from *Output* and *Identity*. I am free because the decision-making body is a microcosm of myself. If the assembly mirrors the population statistically, then *I am effectively in the room*. To them, elections are indistinguishable from oligarchy because they filter for wealth, charisma, and elite status, breaking the "mirror of society."

  **The Conflict:** One side defines democracy as **Control** (the power to stop/change rulers). The other defines democracy as **Presence** (the power to be the ruler). These are not compatible engineering specs; they are competing theological claims about what "freedom" means.

  ### 2. Why Your Hybrid Experiment Failed
  Your proposal (sortition selection + internal liquid delegation) was a brilliant attempt to bridge the gap, but it failed because it tried to mix two incompatible **legitimacy grammars**.

  *   **To the Pro-Sortition side:** Internal delegation recreates the very hierarchy sortition is meant to destroy. If a randomly selected citizen can delegate their vote to a more "competent" peer, you have instantly recreated an electoral dynamic *inside* the chamber. You have reintroduced the "professional politician" class, just within a smaller room. It violates the principle of *equality of political capacity*.
  *   **To the Anti-Sortition side:** It doesn't solve the authorization problem. The public still didn't choose the initial pool. If the internal delegates make a bad choice, the public still cannot vote them out. You have added accountability *within* the chamber, but not accountability *to* the chamber.

  The hybrid failed because it tried to solve an **Authorization** problem (accountability) with a **Constitution** tool (delegation), and vice versa.

  ### 3. Why Do We Pretend It's a Technical Debate?
  You asked: *"If it's the latter [bedrock intuition], why do we keep pretending it's a technical debate about institutional design?"*

  This is the most critical insight. We pretend it is technical for three reasons:

  1.  **The Engineering Delusion:** Modern political culture is obsessed with the idea that politics is a problem-solving exercise. If we admit the disagreement is philosophical/bedrock, it implies there may be no solution. If we frame it as "institutional design," we preserve the hope that a clever mechanism (like your hybrid) can reconcile incompatible values.
  2.  **Avoiding the "War" of Concepts:** Admitting that you have fundamentally different definitions of "Democracy" is destabilizing. It suggests that one side's version of democracy is actually *undemocratic* by the other's definition. It is more polite to argue about "accountability mechanisms" than to argue about "what freedom is."
  3.  **Rationalization of Intuition:** Most people arrive at their position via intuition (e.g., "I don't trust random people" vs. "I hate career politicians") and then reverse-engineer the theory to support it. Arguing about technicalities allows everyone to feel they are being rational rather than intuitive.

  ### 4. How to Unstick the Group
  You cannot argue your way out of a bedrock disagreement, but you can **map** it. If you want to advance the reading group, stop trying to solve sortition and start analyzing the impasse. Try these three moves:

  **A. The Manin Move (Historical Conceptualization)**
  Assign Bernard Manin's *The Principles of Representative Government*. Manin argues that what we call "representative democracy" is historically **Elective Aristocracy**.
  *   **Task:** Ask the Anti-Sortition camp: "Are you willing to admit you prefer Aristocracy (rule by the 'best' chosen by consent) over Democracy (rule by the people)?"
  *   **Task:** Ask the Pro-Sortition camp: "Are you willing to admit you prioritize *descriptive accuracy* over *authorized agency*?"
  *   **Goal:** Force them to own their definitions. Once they admit they are arguing about *Aristocracy vs. Democracy* (in the classical sense), the technical noise clears up.

  **B. The "Loss" Exercise (Prioritization)**
  Stop asking what each system *gains*. Ask what each side is willing to *lose*.
  *   **Prompt:** "Pro-Sortition: If a Citizens' Assembly makes a decision that is statistically representative but morally abhorrent to the majority, do you accept it? If no, you value majority will over sortition."
  *   **Prompt:** "Anti-Sortition: If elections produce a result that is authorized by vote but systematically excludes the interests of the poor/minorities due to money in politics, do you accept it? If no, you value outcomes over procedure."
  *   **Goal:** Reveal the hierarchy of values. Usually, people find they value *preventing the worst outcome* more than *achieving the ideal process*.

  **C. The "Legitimacy Conditions" Test**
  Ask the group to define the specific condition under which they would obey a law they hate.
  *   **Camp A:** "I will obey it if I had a chance to vote the rascals out."
  *   **Camp B:** "I will obey it if people like me were in the room when it was made."
  *   **Goal:** This highlights that they are not arguing about the *same* democracy. They are arguing about two different methods of generating obedience.

  ### Summary
  You are at bedrock. The disagreement is not about whether random people *can* govern (empirical); it is about whether being governed by people you didn't choose is *freedom* (conceptual).

  To unstick the group, you must stop trying to design a system that satisfies both definitions of legitimacy. Instead, facilitate a conversation about **which definition of legitimacy they are willing to sacrifice.** If they can't agree on what "Democracy" means, they will never agree on how to build it. Admitting that might feel like defeat, but it is the only way to turn a loop into a line.
