      *   *The Hybrid Failure:* Explain *why* the liquid democracy idea failed. It reintroduces the "will" mechanism (choosing delegates) into the "identity" mechanism (lot), confusing the legitimacy source.
      *   *The "Why Pretend" Question:* This is crucial. It's about *politeness* and *hope*. Technical debates suggest engineering solutions. Value clashes suggest war or stalemate. Also, people want to feel rational, not just intuitive.
      *   *Actionable Advice:*
          1.  **Name the Paradigms:** Use Manin's *Principles of Representative Government* (Elective Aristocracy vs. Democracy).
          2.  **The "Loss" Exercise:** Ask each side what they are willing to lose. (Pro-sortition: Accountability? Anti-sortition: Elite capture?)
