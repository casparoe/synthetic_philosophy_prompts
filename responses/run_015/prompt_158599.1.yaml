  2.  **Deconstruct the Disagreement:**
      *   *The Pro-Sortition Camp:* Focuses on *descriptive representation* (the assembly looks like the people) and *epistemic diversity* (collective wisdom, freedom from elite capture). Democracy = Rule by the people (literally).
      *   *The Anti-Sortition Camp:* Focuses on *authorization* (consent of the governed via voting) and *accountability* (retrospective voting). Democracy = Control over rulers.
      *   *The Hybrid Proposal:* Tried to bridge accountability (delegation) with selection (lot). Failed because it triggered both sides' core anxieties (hierarchy vs. randomness).

  3.  **Evaluate the Levels of Disagreement:**
      *   *Empirical?* No, the user says they agree on facts (how assemblies run). Though there are hidden empirical bets (can random people govern?), the core clash is normative.
      *   *Conceptual?* Yes. "Representation" means different things. One side means "standing for" (mirroring), the other means "acting for" (agency/mandate).
      *   *Talking Past Each Other?* Definitely. One asks "How do we decide well?" (Output legitimacy), the other asks "How do we authorize power?" (Input legitimacy).
      *   *Bedrock Intuition?* Yes. This is the crux. It's about the *nature* of political agency.

  4.  **Formulate the Diagnosis:**
      *   Acknowledge the user's insight: They are right. It's not a technical debate; it's a clash of democratic paradigms.
      *   Identify the specific conceptual rift: *Authorization vs. Constitution.* Or *Principal-Agent vs. Sample-Population.*
      *   Address the "Why pretend?" question: Because admitting it's bedrock makes compromise impossible. Technical debates imply solvable engineering problems. Philosophical clashes imply incompatible values.

  5.  **Develop Strategies to "Unstick" the Group:**
      *   *Strategy 1: Reframe the Terminology.* Stop using "Representation." Use "Authorization" vs. "Descriptive Sampling."
      *   *Strategy 2: Isolate the Variables.* Test the hybrid model more rigorously. Why did internal delegation feel like hierarchy? (It recreates the electoral dynamic inside the lot).
      *   *Strategy 3: Shift to "Legitimacy Conditions."* Ask: Under what conditions would you accept a law you disagree with? (Because I voted? Or because people like me decided?)
      *   *Strategy 4: Historical/Conceptual Genealogy.* Trace "Democracy" vs. "Republic." Sortition is Democratic; Election is Aristocratic/Republican (in the classical sense).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Validate the user's frustration. It's a classic impasse.
