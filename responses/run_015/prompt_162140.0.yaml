          *   2: Anti-supertask (potential vs. actual infinity).
          *   1: Philosopher of Physics (classical mechanics, ODEs, singularities).
          *   1: Philosopher of Language (semantics, "at one minute", vagueness).
          *   5: Uncommitted Metaphysicians (possibility of supertasks, openness of future).
      *   **Format:** ~8 objections, ordered by damage potential. Phrased in the objector's vocabulary. 2-minute replies. Notes on soft spots/concessions. Indicate pre-emptive concessions. Identify the "crucial reply." Include the "hope nobody asks" objection.
