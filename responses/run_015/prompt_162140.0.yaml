  2.  **Deconstruct the Thesis & Identify Weak Points:**
      *   *Core Claim:* Physical realism solves the paradox.
      *   *Weak Point 1:* Is this still a *supertask*? If the physics prevents the switching, did the task happen? (The "Cheating" objection).
