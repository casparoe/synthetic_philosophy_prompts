  # JOINT ADVERSARIAL-COLLABORATION STATEMENT
  **Subject:** Scope of Evolutionary and Physical Explanation
  **Participants:** Student A (Strict Crane-Only) & Student B (Anti-Greedy Reductionist)
  **Date:** October 26, 2023

  ### I. AGREED CLAIMS AND DEFINITIONS

  1.  **Definition of Cranes:** We agree that a "crane" refers to any substrate-dependent, incremental, mechanistic process that builds complexity from simpler foundations without violating physical laws. Both parties accept that natural selection is the primary crane for biological adaptation.
  2.  **Definition of Skyhooks:** We agree that a "skyhook" refers to a miraculous, ex nihilo, or non-mechanistic explainer that suspends physical laws to account for complexity. Both parties explicitly reject skyhooks as valid scientific explanations; neither posits supernatural forces or vitalistic energies.
  3.  **Definition of Greedy Reductionism:** We agree that "greedy reductionism" is the methodological stance that higher-level phenomena are *only* explanatory insofar as they can be fully translated into lower-level physical terms without remainder. Student A accepts this stance; Student B rejects it.
  4.  **Causal Closure:** We agree that the physical domain is causally closed. Student B does not claim that mental or normative states violate physical conservation laws, but rather that they constitute functional patterns with autonomous explanatory power.
  5.  **Scope of Consensus:** We agree that evolutionary explanation is uncontroversially successful in accounting for morphological adaptation, physiological homeostasis, and basic behavioral instincts across species.
  6.  **Scope of Dispute:** We disagree on whether evolutionary genealogy can exhaustively explain the *normative authority* of moral reasons and the *objective necessity* of mathematical truths, or whether these phenomena require recognition of emergent functional autonomy that is not reducible to its origins.

  ### II. DISAGREEMENTS, CRUXES, AND PRE-REGISTERED PREDICTIONS

  | Domain of Disagreement | Precise Formulation of Residual Disagreement | The Crux (Update Condition) | Concrete Case / Argument | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Moral Normativity** | **Student A:** The "binding force" of moral norms is identical to the evolutionary and psychological mechanisms that produce them; explaining the genealogy dissolves the authority.<br><br>**Student B:** While genealogy explains the *origin* of norms, it does not account for their *authority*; functional autonomy grants norms a binding force on agents that persists regardless of historical origin. | **Does predictive success in evolutionary psychology explain the authority of moral norms or merely describe their genealogy?**<br><br>*Student A will update if:* It is demonstrated that agents continue to feel bound by a norm even after its evolutionary utility is proven obsolete or harmful.<br>*Student B will update if:* It is demonstrated that understanding the evolutionary origin of a norm consistently eliminates its perceived normative authority across subjects. | **Case:** Altruistic Punishment Norms.<br>Isolated societies independently develop norms where individuals incur costs to punish free-riders, despite no direct benefit to the punisher. | **Student A:** This demonstrates a hardwired heuristic for group selection. Once subjects understand the heuristic is a "trick" for group survival, the moral "ought" loses its objective force.<br><br>**Student B:** This demonstrates an emergent normative system. Even if subjects understand the heuristic, the "ought" remains binding because the normative logic operates autonomously from the biological substrate. |
  | **2. Mathematical Convergence** | **Student A:** Cross-cultural mathematical convergence is best explained by shared neural architecture and evolutionary pressures favoring specific cognitive shortcuts.<br><br>**Student B:** Cross-cultural convergence is best explained by independent access to abstract truths; shared neural architecture enables access but does not constitute the truth itself. | **Is cross-cultural mathematical convergence better explained by shared neural architecture or by independent abstract access?**<br><br>*Student A will update if:* Mathematical truths are discovered that actively contradict evolutionary cognitive biases.<br>*Student B will update if:* Mathematical convergence is shown to be limited strictly to domains with immediate survival utility, failing in abstract domains. | **Case:** Independent Discovery of Prime-Number Theorems.<br>Euclidean Greece and Ancient China/India independently developed proofs regarding the infinitude or properties of primes, despite no cultural contact. | **Student A:** This demonstrates that human brains share identical processing constraints that make prime-number concepts "useful fictions" for pattern recognition, not discoveries of external reality.<br><br>**Student B:** This demonstrates that distinct cognitive architectures can converge on the same necessary truths, implying the truths exist independently of the specific neural hardware discovering them. |
  | **3. Downward Causation** | **Student A:** Talk of "downward causation" is a placeholder for complex bottom-up mechanisms and functions as a skyhook that blocks empirical inquiry.<br><br>**Student B:** "Downward causation" describes real causal powers at the functional level (e.g., a software command moving hardware) that are irreducible to, though consistent with, bottom-up physics. | **Can higher-order phenomena be reconstructed through layered bottom-up mechanisms without remainder?**<br><br>*Student A will update if:* A higher-level explanation predicts a physical outcome that the lower-level description misses.<br>*Student B will update if:* A complete bottom-up simulation perfectly predicts higher-level behavior without needing higher-level variables. | **Case:** Conscious Reasoning in Proof Verification.<br>The process by which a mathematician rejects a valid proof because it violates a higher-order aesthetic or normative standard of "elegance." | **Student A:** This is ultimately reducible to neural weighting and reward pathways; "elegance" is a proxy for cognitive efficiency.<br><br>**Student B:** The standard of "elegance" acts as a constraint on the physical process of writing/typing, demonstrating functional autonomy where the norm dictates the physical output. |
