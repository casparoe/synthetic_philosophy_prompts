answer: |-
  To think of privacy as secrecy is to misunderstand the human condition. We are not vaults; we are libraries with restricted sections. We do not hide because we are ashamed; we separate because we are complex. The parent I am at the breakfast table is not the lover I am in the dark, nor the citizen I am at the ballot box. These are not lies; they are distinct chapters in a single, sprawling autobiography that only makes sense if the chapters remain bound separately until I choose to cross-reference them.

  Viewing the 2013 Snowden disclosures through this lens—privacy as *narrative boundary-work*—shifts the scandal from a theft of data to a violation of authorship. The harm was not that the state read our letters; it was that the state began writing our biography without our consent, collapsing our contextual fragments into a single, flattened profile.

  ### The Actors and Their Choices

  **The Agencies (NSA/GCHQ): The Totalizing Authors**
  For the intelligence apparatus, narrative boundary-work is an obstacle to efficiency. Their institutional logic is not literary but cartographic; they seek a map where all points connect. To the NSA, a phone call to a therapist and a phone call to a political organizer are not distinct social contexts; they are metadata nodes in a graph of risk. By collecting bulk data, they asserted the right to merge all contexts into a "single account." They chose to become the omniscient narrator, a perspective that requires the erasure of the characters' internal boundaries. They did not see this as violence, but as clarity. In their view, the "true" story of a subject is the aggregate of all their actions, regardless of the audience for whom those actions were performed.

  **The Subjects: The Unwitting Characters**
  The millions whose communications were swept up faced a loss of agency they could not feel until it was revealed. Under standard privacy theory, if you have "nothing to hide," you are safe. Under the narrative lens, you are unsafe because you have *many things to hide from many different people*. The harm felt closer to an involuntary merging of selves because the surveillance apparatus stripped away the stage directions. When a journalist's source list is exposed, it doesn't just reveal a secret; it merges the "professional" self with the "confidential" self, potentially destroying the professional's ability to function in that context. The subjects were forced into a version of themselves they did not authorize—a data double that existed in a context of permanent scrutiny.

  **Edward Snowden: The Disruptive Narrator**
  Snowden's choice was a radical act of narrative sacrifice. To expose the collapse of public narrative boundaries, he had to shatter his own. He knew that leaking the documents would force him into a single, rigid account: *Traitor* or *Hero*. He accepted this flattening of his own identity to restore the public's ability to maintain their fragmentation. He chose exile, which is the physical manifestation of narrative boundary-work; he removed himself from the context (the US) where his story was being rewritten by the state, to a place where he could retain authorship of his own defense.

  **The Journalists (Greenwald, Poitras, MacAskill): The Editors**
  If the NSA were the totalizing authors, the journalists became the editors. They faced the ethical burden of curating the leak. They could not simply dump the documents (which would have replicated the NSA's violence by exposing innocent subjects); they had to impose narrative boundaries on the disclosure itself. They redacted names, paced the releases, and contextualized the technical data. They chose to treat the documents not as raw truth, but as a story that needed to be told in a way that preserved the privacy of the very people whose boundaries had been violated. They mediated between the Totalizing Author and the Public, attempting to restore the distinction between *knowing the system exists* and *knowing everything the system knows*.

  ### What This Lens Illuminates

  Standard privacy theories often rely on a calculus of harm: *What damage occurs if this information is released?* This is a theory of secrets. The narrative boundary-work lens illuminates a theory of *selfhood*. It explains why the sensation of surveillance is often described as a kind of claustrophobia or dissociation.

  When the NSA aggregates bulk data, it commits a category error. It treats the "lover" self and the "citizen" self as identical data points. The violence is the erasure of the *distance* between these selves. We need that distance to grow. I must be able to say something foolish to a friend without it becoming part of my permanent employment record. I must be able to explore a radical political thought without it defining my entire civic identity.

  Standard theory misses this because it assumes information is static. Narrative theory understands information is relational. A text message means one thing to a spouse and another to an algorithm. The harm of the Snowden revelations was the realization that an algorithm was reading our texts *as if it were a spouse*, or worse, as if it were a judge. It was an involuntary merging of selves because it deprived us of the right to introduce ourselves differently in different rooms. It is the difference between being known and being *profiled*. To be profiled is to have your story summarized by someone who doesn't care about the plot, only the pattern.

  ### Where the Lens Distorts and Falls Silent

  However, to view this solely through the lens of narrative coherence is to risk a humanistic delusion. There are two places where this framing distorts the reality of the Snowden episode.

  First, it misreads the institutional logic of state surveillance. The NSA does not care about your narrative coherence. They do not want to write your biography; they want to predict your behavior. They are not authors; they are actuaries. By framing their intrusion as a violation of "story," we anthropomorphize the state. We imagine they are reading us like a novel, but they are reading us like a spreadsheet. The violence they inflict is not the collapse of meaning, but the irrelevance of meaning. To the algorithm, your narrative boundaries are just noise to be filtered out. The lens of narrative boundary-work implies a respect for the human story that the surveillance state fundamentally lacks. The state didn't want to merge your selves; it wanted to bypass them entirely to get to the metadata underneath.

  Second, and more profoundly, this lens risks validating the very thing it seeks to protect: the "coherent self." As a novelist, I know that the coherent autobiography is a fiction. We are fragmented, contradictory, and often incoherent. We lie to ourselves. Privacy may not protect a *true* narrative coherence, but rather the *capacity to sustain the illusion* of coherence.

  If we argue that privacy is valuable because it allows us to maintain coherent narratives across contexts, we imply that a unified self is the goal. But perhaps the value of privacy is that it allows us to be *incoherent* without penalty. It allows us to be hypocrites, to change our minds, to try on different skins without being pinned down by a permanent record. The narrative lens risks suggesting that if we could just tell our story perfectly, surveillance would be acceptable. But the point is that no story is perfect, and no single account can hold us.

  ### The Verdict

  Does the episode support the claim that privacy's value resides in narrative coherence? No. It reveals that coherence is indeed a novelist's elegant fiction.

  But it is a necessary fiction. We cannot live without the ability to edit. The Snowden disclosures revealed that the state had begun to treat the rough drafts of our lives as final manuscripts. The value of privacy is not that it protects a coherent self, but that it protects the *process* of self-creation. It guards the workshop, not the museum.

  The NSA's bulk collection threatened to turn the workshop into a museum—to freeze our fragmented, evolving, contradictory attempts at being human into a static profile that could be stored, searched, and judged. The harm was not the theft of secrets, but the foreclosure of possibility. When every context is merged into a single account, there is no room for the next chapter to differ from the last.

  Snowden, the journalists, and the public pushed back not to keep secrets, but to keep the book open. They affirmed that while the coherent self may be a fiction, the right to write it—and to tear up the pages when they don't work—is the only reality that matters. Privacy is not the wall that hides us; it is the margin where we can scribble without being read. The surveillance state sought to erase the margins. The disclosure was an attempt to draw them back in.
