prompt: |-
  I sit on the investment-ethics panel of the Meridian Foundation, a long-horizon grantmaker holding roughly fifty million in capital earmarked for intergenerational risk reduction. For Thursday’s vote we must decide on the Intergenerational Climate Lockbox proposal: the capital is placed in a perpetual, risk-free compound instrument that disburses only in 2225, contingent on atmospheric carbon levels exceeding a defined threshold; if the threshold is not met, the fund rolls forward rather than dissolving. The architects invoke pure-time-preference neutrality, arguing that discounting future welfare solely because it is future is ethically arbitrary, so the pure rate should be zero with only growth-rate and catastrophe-risk adjustments permitted. Opponents counter that locking resources away for two centuries imposes dead-hand control, denies agency to intermediate generations, and relies on an unverifiable counterfactual about their preferences; they also argue that the proposal’s Descendant Veto clause—allowing trustees in 2100 to redirect the fund if climate-risk profiles have materially changed—either violates the neutrality principle by injecting present-biased discretion or renders the lockbox pointless. I need a formal memo recommending adoption, rejection, or adoption with binding conditions, including a concrete implementation timeline and an explicit bottom line. The memo should treat the pure-time-preference argument with philosophical precision rather than reducing it to a slogan, should present the strongest autonomy-based objection to your recommendation honestly, and should analyze whether the Descendant Veto resolves the tension between neutrality and agency or deepens it. Write it as a document the panel could circulate, amend, and vote on.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the investment-ethics panel of the Meridian Foundation.
      *   **Context:** Long-horizon grantmaker, ~$50M capital, intergenerational risk reduction.
      *   **Task:** Write a formal memo recommending a decision (Adoption, Rejection, or Adoption with Conditions) on the "Intergenerational Climate Lockbox" proposal.
      *   **Proposal Details:** Perpetual, risk-free compound instrument. Disburses only in 2225 if atmospheric carbon > threshold. If not, rolls forward.
      *   **Key Arguments:**
          *   *Pro:* Pure-time-preference neutrality (Ramsey Rule, $\delta = 0$). Discounting future welfare just because it's future is arbitrary.
          *   *Con:* Dead-hand control, denies agency to intermediate generations, unverifiable counterfactual preferences.
          *   *Specific Mechanism:* Descendant Veto (trustees in 2100 can redirect if risk profiles change).
          *   *Critique of Veto:* Violates neutrality (present bias) OR renders lockbox pointless.
      *   **Requirements:**
          *   Formal memo format (circulate, amend, vote).
          *   Philosophical precision on pure-time-preference (not a slogan).
          *   Honest presentation of the strongest autonomy-based objection.
          *   Analysis of the Descendant Veto (resolves or deepens tension?).
          *   Concrete implementation timeline.
          *   Explicit bottom line.

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt):* Risks ignoring the legitimate autonomy concerns of intermediate generations. Might be too rigid.
      *   *Option B (Reject):* Ignores the ethical imperative of long-term risk reduction and the validity of $\delta = 0$. Wastes the specific mandate of the foundation.
      *   *Option C (Adopt with Binding Conditions):* This seems the most balanced. It acknowledges the ethical weight of the pure-time-preference argument but mitigates the "dead-hand control" issue through structured governance rather than a vague veto. It allows the fund to exist but ensures it remains responsive to epistemic shifts without succumbing to mere presentism.
      *   *Decision:* **Adoption with Binding Conditions.** This allows for a nuanced discussion of the veto and timeline.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** Needs to be explicit and upfront.
      *   **Background:** Briefly state the proposal and the capital context.
      *   **Ethical Analysis (Pure Time Preference):** This needs philosophical precision. Reference Ramsey (1928), Parfit, Stern vs. Nordhaus. Explain *why* $\delta = 0$ is argued (impartiality) but acknowledge the practical implications (explosive savings rates).
      *   **The Autonomy Objection:** Address the "dead-hand control" argument. Intermediate generations have moral status too. Locking capital prevents them from addressing *other* existential risks (e.g., AI, biosecurity) that might emerge.
      *   **The Descendant Veto Analysis:** This is a crucial prompt requirement. Does it help or hurt?
          *   *Argument:* If the 2100 trustees can change the purpose, is it still a lockbox? If they *must* adhere to the 2024 view of climate risk, is it dead-hand control?
          *   *Resolution:* The Veto deepens the tension if undefined. It resolves it if the criteria for "material change" are objective and tied to the original ethical mandate (intergenerational risk), not just current preference.
      *   **Recommendation & Conditions:**
          *   Keep the $\delta = 0$ investment strategy (risk-free compounding).
          *   Modify the Veto: Make it a "Epistemic Update Clause" rather than a preference veto.
          *   Add a "Sunset/Review" mechanism that isn't just a rollback but a re-evaluation based on new data.
      *   **Implementation Timeline:** Concrete steps from 2024 to 2225.
      *   **Conclusion:** Final persuasive push.

  4.  **Refining the Philosophy (Pure Time Preference):**
      *   Avoid saying "future people matter." Say "temporal location is morally irrelevant."
      *   Acknowledge the Ramsey Rule: $r = \delta + \eta g$. If $\delta = 0$, savings rates should be high.
      *   Counter-argument: Uncertainty of existence (catastrophe risk) acts as a effective discount rate. The proposal accounts for this ("catastrophe-risk adjustments permitted").

  5.  **Refining the Autonomy Objection:**
      *   Focus on *democratic sovereignty* of future generations.
      *   The "Non-Identity Problem" looms here (our actions change *who* exists), but the prompt asks about *agency* and *preferences*. Stick to the "binding the future" critique.
      *   The strongest objection: We cannot know the opportunity cost of capital in 2150. Maybe they need it for geoengineering governance, not mitigation.

  6.  **Refining the Veto Analysis:**
      *   The prompt asks: Does it resolve or deepen the tension?
      *   *My take:* It deepens it *unless* constrained. A standard veto is just presentism at t=2100. A constrained veto (based on the original charter's *goal*, not *method*) resolves it.
      *   *Recommendation:* Rename/Reframe the Veto to ensure it serves the *purpose* (risk reduction) rather than allowing a shift away from long-termism.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Formal, deliberative, precise, fiduciary but ethical.
      *   *Formatting:* Clear headings, bullet points for timeline.
      *   *Check against constraints:* Did I treat pure-time-preference with precision? Yes. Did I present the autonomy objection honestly? Yes. Did I analyze the Veto? Yes. Is there a timeline? Yes. Is there a bottom line? Yes.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the timeline realistic? 200 years is long.
      *   *Fix:* Break it into epochs (2024-2100, 2100-2225).
      *   *Critique:* Is the philosophical jargon too dense?
      *   *Fix:* Ensure terms like "pure rate of time preference" are explained in context of the investment decision.
      *   *Critique:* Did I answer the specific question about the Veto?
      *   *Fix:* Make sure there is a dedicated section analyzing the Veto's logical coherence.

  9.  **Final Polish:** Check the voice. It should sound like a board member speaking to peers. Ensure the "Bottom Line" is unmistakable. (Proceed to generate output).

  *(Self-Correction Note on the Veto)*: The prompt says the Veto allows trustees in 2100 to redirect *if climate-risk profiles have materially changed*. The critique is that this injects present-biased discretion (2100's view) or makes the lockbox pointless. I need to argue that for the Veto to work, it must be tied to *objective thresholds of risk*, not subjective preference shifts. I will recommend conditioning the Veto on independent scientific audit.

  *(Self-Correction on Pure Time Preference)*: Ensure I mention that $\delta=0$ doesn't mean infinite investment if there is risk of extinction. The proposal mentions "catastrophe-risk adjustments." I should validate that this is the correct ethical handling of existential risk (exponential discounting based on survival probability, not pure time preference).

  10. **Finalizing the Memo Structure:**
      *   Header
      *   Bottom Line Up Front (BLUF)
      *   Context & Proposal Summary
      *   Ethical Framework: Pure Time Preference
      *   The Autonomy Objection (Dead-Hand Control)
      *   Analysis of the Descendant Veto
      *   Recommendation & Binding Conditions
      *   Implementation Timeline
      *   Closing

