          2.  *Teleology:* A vase has a designed function; historical events often lack intrinsic purpose or completed form.
          3.  *The Whole:* The vase exists prior to shattering; the "event" often only coheres through the narrative.
      *   *Conclusion:* The analogy begs the question. It assumes the event is a "vase" (fixed object) to prove it can be reconstructed like one. White wins on emplotment; Ranke wins on constraint. The archaeologist's "disciplined reconstruction" is valid methodologically but ontologically shaky.

