          4.  Assess whether her defense of objectivity survives once the analogy breaks.
          5.  No preamble, no restating the question.

  2.  **Deconstruct the Ceramicist Analogy:**
      *   *Shards:* Primary documents/sources.
      *   *Adhesive/Armature:* Causal inference/context.
      *   *Vessel:* Historical event.
      *   *Display Case:* Published narrative.
      *   *Goal:* Defend objectivity as constrained reconstruction (against Carr's skepticism and White's literary emplotment).

  3.  **Evaluate the Analogy (Hold vs. Break):**
      *   *Where it holds:* Evidence is fragmentary; reconstruction requires skill and rules; not *anything* goes (constraints exist); there is a physical reality underlying the interpretation.
      *   *Where it breaks:*
          *   **Ontology:** A vase is a discrete, bounded object with a specific original form. Historical events (e.g., "The French Revolution") are not discrete objects with a single shape; they are diffuse, overlapping processes.
          *   **Teleology:** A vase was made *to be* a vase (intentional design). Historical events often lack a single intrinsic purpose or "completed form" independent of the narrative imposed on them.
          *   **The "Original":** There is one true original vase. Is there one true "French Revolution"? Or is the event defined by the narrative boundaries?
          *   **The Adhesive:** In archaeology, the adhesive is modern material added to hold old pieces. In history, the "causal inference" is often the *story* itself, not just glue. White argues the glue *creates* the shape, not just holds it.
          *   **The Forger:** Fake shards exist in archaeology. In history, "fake documents" exist, but also biased documents, propaganda, silence/absence (which isn't just a missing shard, it's a structural gap).
          *   **The Curator:** The label interprets the object. In history, the narrative *is* the object for the public. There is no "back room" where the real event sits untouched.

  4.  **Drafting the Correspondence Table:**
      *   Burial Context -> Archival silence/structural conditions of record production.
      *   Missing Fragments -> Lost sources/unrecorded experiences (the subaltern, etc.).
      *   Adhesive Compound -> Causal logic/narrative coherence.
      *   Forger Planting Fake Shards -> Propaganda/forged documents/memory manipulation.
      *   Curator's Label -> Historiographical framing/title/periodization.

  5.  **Identifying Disanalogies:**
      *   *Boundedness:* Vases have edges; historical events bleed into each other.
      *   *Teleology:* Vases have a designer's intent; history often lacks a single agent or goal.
      *   *Recoverability:* You can physically fit shards together. You cannot physically fit "causes" together; they are conceptual.
      *   *The "Whole":* The vase exists independently of the reconstruction. The "event" often only exists *as* reconstructed.

  6.  **Assessing the Conclusion:**
      *   Does the defense survive? Partially. It successfully refutes radical relativism (anything goes). But it fails to refute White's emplotment claim because the "shape" of the event is not pre-existing in the same way the vase's shape is. The analogy smuggles in the realism it tries to prove.
      *   Bottom line: The analogy successfully defends against radical skepticism but fails to refute narrative constructivism because it presupposes the very ontological realism it seeks to prove.

  7.  **Refining the Output (Constraint Check):**
