answer: |-
  The analogy successfully defends historical practice against radical skepticism but fails to secure ontological objectivity because it illicitly assumes events possess the discrete, teleological integrity of physical artifacts.

  | Ceramicist Element | Historical Equivalent | Function in Argument |
  | :--- | :--- | :--- |
  | **Burial Context** | Conditions of archival production and preservation bias | Determines which shards survive and their spatial relation (provenance). |
  | **Missing Fragments** | Silenced voices, lost records, and structural absences | Creates gaps that require inference rather than direct observation. |
  | **Adhesive Compound** | Causal logic, narrative coherence, and theoretical framing | Holds the evidence together; visible but distinct from the shards. |
  | **Forger Planting Fake Shards** | Propaganda, forged documents, or retrospective memory distortion | Introduces false data that fits the pattern but misleads reconstruction. |
  | **Curator's Label** | Periodization, titles, and historiographical framing | Tells the viewer what they are looking at and why it matters. |

  The analogy holds firm against Carr's strongest skepticism: just as clay chemistry and fracture mechanics constrain the ceramicist, archival constraints and logical consistency constrain the historian. You cannot glue a shard from the 5th century onto a 1st-century rim without detection, just as you cannot claim a cause occurred after its effect without violating disciplinary norms. This validates the archaeologist's claim that objectivity is not mirroring but disciplined reconstruction; there is a reality outside the text that resists arbitrary fabrication.

  However, the analogy collapses when confronting White's emplotment thesis due to three critical disanalogies. First, the **bounded object problem**: an amphora has a physical limit where the vessel ends and the dirt begins. Historical events (e.g., "The Industrial Revolution") lack discrete edges; they bleed into preceding and subsequent processes, meaning the historian must *draw* the boundary that the ceramicist merely *finds*. Second, the **teleology problem**: the amphora was created with a specific design and function by a maker; its "true shape" exists independently of the reconstruction. Historical events often lack a single author, intent, or completed form; the "shape" of the event is frequently imposed by the narrative structure (tragedy, romance, satire) rather than recovered from the evidence. Third, the **whole prior to parts**: the vase existed whole before it shattered. In history, the "event" often does not exist as a coherent unity until the historian constructs it; the shards do not belong to a pre-existing vessel but are aggregated to *create* the vessel.

  Consequently, the archaeologist's defense of objectivity survives only as a methodological guideline, not an ontological guarantee. The analogy smuggles in the realism it seeks to prove by treating the "historical event" as a thing waiting to be found rather than a concept constituted by the inquiry. While the ceramicist is right that not all reconstructions are valid (refuting pure relativism), she is wrong that the valid reconstruction equals the original reality (refuting White). The defense holds for *constraint* but fails for *correspondence*; history is indeed disciplined reconstruction, but because the "vessel" of the past has no intrinsic rim, the reconstruction inevitably participates in creating the object it claims only to recover.
