  ### Scenario: The National Broadband Infrastructure Levy

  **The Policy Choice:**
  A federal agency is deciding whether to mandate a **Universal Connectivity Levy** on all existing urban and suburban internet subscribers to fund high-speed infrastructure expansion into underserved rural and remote regions.

  *   **Option A (The Levy):** A mandatory monthly fee added to the bills of **100 million** urban/suburban households. This funds infrastructure that provides economic and telehealth benefits to **200 million** individuals in underserved areas.
  *   **Option B (Status Quo):** No fee for urban households. Underserved populations remain with slow, unreliable connections, resulting in lost economic opportunity and reduced access to remote services.

  **The Numbers (Monthly Utility Equivalents):**
  *   **Beneficiaries (Group B):** 200 million people. Each gains **$10** of value/month (better job access, telehealth reliability). **Total Benefit: $2 Billion/month.**
  *   **Payers (Group A):** 100 million households.
      *   **Base Case Cost:** **$5** per household/month. **Total Cost: $500 Million/month.**
      *   **Dial-Turn Cost:** **$15** per household/month. **Total Cost: $1.5 Billion/month.**

  ---

  ### 1. The Contractualist Analysis (Base Case)

  **The Principle:**
  *"Households with reliable internet access must bear a minor monthly cost to ensure that citizens in underserved regions gain access to essential digital infrastructure."*

  **The Test:**
  Scanlon's formula asks: *Could this principle be reasonably rejected by anyone affected by it?*

  *   **The Payer's Complaint:** "This principle requires me to pay $5/month. This is a tangible burden on my budget."
  *   **The Beneficiary's Complaint:** "Rejecting this principle leaves me without reliable access to telehealth and remote work, costing me $10/month in value/opportunity."
  *   **The Comparison:** Contractualism compares the strength of the *individual* complaint of the gainer against the *individual* complaint of the loser. It does not sum the gainers.
  *   **The Verdict:** The beneficiary's individual loss ($10) is greater than the payer's individual loss ($5). Therefore, the payer's complaint is not strong enough to override the beneficiary's claim. No single payer can *reasonably* reject a principle that asks them to sacrifice $5 to prevent another specific person from losing $10.
  *   **Result:** The principle is **Accepted**.

  ### 2. The Utilitarian Analysis (Base Case)

  **The Calculation:**
  Utilitarianism sums the total utility across the population.

  *   **Total Cost:** 100 million payers × $5 = **$500 Million.**
  *   **Total Benefit:** 200 million beneficiaries × $10 = **$2 Billion.**
  *   **Net Utility:** $2 Billion - $500 Million = **+$1.5 Billion.**

  **The Verdict:**
  Since the total benefit significantly outweighs the total cost, the policy maximizes aggregate welfare.
  **Result:** The policy is **Accepted**.

  ### 3. Alignment and Structural Feature

  **The Agreement:**
  Both theories agree: Implement the Levy.

  **The Divergent Reasoning:**
  *   **The Utilitarian** accepts it because the *sum* of benefits ($2B) crushes the *sum* of costs ($500M). The sheer number of beneficiaries does the heavy lifting.
  *   **The Contractualist** accepts it because the *individual slice* of the cost ($5) is too trivial to constitute a reasonable rejection when weighed against the *individual slice* of the benefit ($10) to the most affected recipient.

  **The Structural Feature Keeping Them Aligned:**
  The feature is the **low per-person burden on the Payers.**
  As long as the individual cost remains below the threshold of "reasonable rejection" (and specifically, below the individual benefit to the recipient), Contractualism will align with Utilitarianism on positive-sum policies. The "Aggregation Problem" is latent here; it is hidden because the individual burden is so small that even a non-aggregating theory clears it. The Contractualist isn't aggregating the $500M total harm; they are simply ignoring it because it doesn't exist as a singular complaint.

  ### 4. The Dial Turn: Divergence

  Now, we change exactly one dial: **Raise the per-person cost for Payers from $5 to $15.** The population sizes and beneficiary values remain fixed.

  **The New Numbers:**
  *   **Total Cost:** 100 million × $15 = **$1.5 Billion.**
  *   **Total Benefit:** 200 million × $10 = **$2 Billion.**
  *   **Net Utility:** +$500 Million.

  **The Utilitarian Verdict:**
  The math still clears. $2 Billion > $1.5 Billion. The policy still produces a net gain in welfare.
  **Result:** **Accepted.**

  **The Contractualist Verdict:**
  We return to the individual comparison.
  *   **Payer's Complaint:** "I am being asked to lose $15/month."
  *   **Beneficiary's Complaint:** "If you reject this, I lose $10/month."
  *   **The Comparison:** The Payer's individual burden ($15) is now *greater* than the Beneficiary's individual burden ($10).
  *   **The Logic:** Under Scanlonian contractualism, I cannot be required to bear a burden of $15 simply to confer a benefit of $10 to *you*. The fact that there are 200 million "yous" does not enter the equation. The Payer can now reasonably say, "This demand is too onerous relative to the relief it provides to any single other person."
  **Result:** **Rejected.**

  **The Threshold:**
  The flip occurs roughly when the **Per-Person Cost exceeds the Per-Person Benefit ($10)**. At $11, the Contractualist flips to "No," while the Utilitarian stays "Yes" (until the total cost exceeds $2 Billion, which would require a per-person cost of $20).

  ### 5. The Defense and Evaluation

  **The Objection:**
  In the Base Case (and even more so in the Dial Turn), the Contractualist verdict seems counterintuitive. In the Base Case, it blesses a policy that extracts $500 million from the public simply because no one loses enough to complain. In the Dial Turn, it blocks a policy that creates a net social gain of $500 million because it refuses to count the many small gains against the fewer larger losses. It seems to fetishize the individual slice while ignoring the collective reality.

  **The Contractualist Defense:**
  A defender of Scanlon would argue that morality is not about maximizing states of affairs, but about **justifiability to each person.**
  1.  **Status, not Sum:** To ask an individual to sacrifice $15 for the sake of a $10 gain to another is to treat the payer as a mere resource for the beneficiary. It violates the equal standing of persons.
  2.  **The Aggregation Concession:** The defender admits that Contractualism *cannot* aggregate small benefits to override a larger individual burden. This is not a bug, but a feature. It protects individuals from being sacrificed for the "greater good" when the good is distributed as trivial gains to others.
  3.  **Base Case Justification:** In the Base Case ($5 cost), the harm is not "ignored"; it is deemed *insignificant* in the context of mutual justification. A demand to pay $5 to save someone $10 is reasonable. The fact that 100 million people pay it is irrelevant to the *justice* of the demand, even if it is relevant to the *efficiency*.

  **Does the Defense Hold?**
  *   **Holds:** If you prioritize individual sovereignty and the protection of rights against utilitarian calculus. It successfully explains why we feel uneasy about taxing individuals heavily for diffuse, small benefits to others (the "tyranny of the majority" concern).
  *   **Concedes:** It concedes that Contractualism may lead to **Pareto-inferior outcomes** (as seen in the Dial Turn: everyone could theoretically be compensated, but the principle itself is rejected). It admits that in a world of large populations, strict non-aggregation can lead to policy paralysis where massive total benefits are forgone because they cannot be concentrated enough to justify individual burdens. The defense holds on moral integrity but surrenders on aggregate welfare optimization.
