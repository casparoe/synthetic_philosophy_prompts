answer: |-
  # Diagnostic Taxonomy of Procedural Calibration and Epistemic Reduction

  **Context:** This taxonomy is designed for seminar participants who have already engaged with the core debate regarding the reducibility of knowing-how (KH) to knowing-that (KT). The sorting mechanism does not ask participants to identify their label but to render judgments on specific phenomenological and counterfactual cases. 

  **Core Thesis:** The tree is structured around the **Procedural Calibration Thesis (PCT)**: *The claim that certain skilled performances involve a continuous, non-representational tuning between agent and environment that does not map onto discrete beliefs.* Each terminal leaf explicitly locates the resulting position regarding the irreducibility of PCT.

  ---

  ## I. The Decision Tree

  **Node 1: The Amnesia Judgment**
  *Case:* A subject retains smooth, expert performance of a complex task (e.g., piano playing) after total explicit amnesia for all rules, instructions, and theoretical propositions previously associated with the task.
  *Question:* Does this subject still **know how** to perform the task?

  *   **NO** (Performance is mere habit; KH is lost without access to rules)  
      └── *Proceed to Node 2*
  *   **YES** (Performance constitutes KH regardless of propositional access)  
      └── *Proceed to Node 3*

  ***

  **Node 2: The Reliability Judgment** (Reached via Node 1: NO)
  *Case:* An agent who possesses the relevant rules and instructions suffers a single, surprising failure after years of consistent success (e.g., a master chef burns a standard dish due to a momentary lapse).
  *Question:* Does this single failure **falsify** the claim that the agent knows how to perform the task?

  *   **NO** (KH is a capacity/possession of rules; performance errors are compatible with knowledge)  
      └── **Terminate at Leaf A**
  *   **YES** (KH requires successful manifestation; failure negates the attribution)  
      └── **Terminate at Leaf E**

  ***

  **Node 3: The Genealogy Judgment** (Reached via Node 1: YES)
  *Case:* Compare two agents: one acquires a skill through explicit rule-internalization, the other through calibrated trial-and-error without ever articulating intermediate rules.
  *Question:* Is there a substantive **epistemic difference** between these two states, or are they the same kind of competence?

  *   **NO DIFFERENCE** (Both are generic competence; the distinction is merely etiological)  
      └── **Terminate at Leaf D**
  *   **SUBSTANTIVE DIFFERENCE** (The mode of acquisition signals a distinct epistemic kind)  
      └── *Proceed to Node 4*

  ***

  **Node 4: The Embodiment Judgment** (Reached via Node 3: SUBSTANTIVE DIFFERENCE)
  *Case:* A skilled agent suffers nerve damage that forces a completely different physical execution of the same task (e.g., playing a string instrument with a reconfigured hand posture) to achieve the same sonic outcome.
  *Question:* Does the original **knowing-how** survive intact, or is it transformed/lost?

  *   **SURVIVES INTACT** (KH is abstracted from specific motorics; the goal-state defines the knowledge)  
      └── **Terminate at Leaf B**
  *   **TRANSFORMED/LOST** (KH is tied to the specific first-person engagement; changing the loop changes the knowledge)  
      └── **Terminate at Leaf C**

  ---

  ## II. Terminal Leaves and Calibration Status

  ### Leaf A: Pure Intellectualism
  *   **Path:** Node 1 (NO) → Node 2 (NO).
  *   **Position:** Knowing-how consists entirely in propositional knowing-that combined with practical application. The retention of performance without rule-access is merely causal habit, not knowledge. Performance errors do not negate the possession of the underlying propositions.
  *   **Status on Procedural Calibration:** **Rejects Irreducibility.** Calibration is reduced to the efficient execution of propositional commands. There is no non-representational tuning; there is only the speed of inference and motor output.

  ### Leaf B: Ryle-Style Anti-Intellectualism
  *   **Path:** Node 1 (YES) → Node 3 (DIFFERENCE) → Node 4 (SURVIVES).
  *   **Position:** Knowing-how is an ability or disposition that can exist without corresponding propositional knowledge. The skill is identified by the success of the outcome and the flexibility of the agent, not the specific motor program or theoretical justification.
  *   **Status on Procedural Calibration:** **Accepts Irreducibility.** Calibration is the fundamental unit of analysis. It is a non-representational disposition to respond to environmental cues that cannot be exhausted by propositional lists.

  ### Leaf C: Intermediate Phenomenal Representationalism
  *   **Path:** Node 1 (YES) → Node 3 (DIFFERENCE) → Node 4 (TRANSFORMED).
  *   **Position:** Knowing-how grants a distinctive phenomenal or first-personal mode of presentation but insists it remains factive and representational. The specific "feel" or embodied loop is part of the content of the knowledge. Changing the physical execution changes the mode of presentation, thus altering the knowledge state.
  *   **Status on Procedural Calibration:** **Modifies Irreducibility.** Calibration is accepted as real and distinctive, but it is claimed to be a *form* of representation (e.g., analog or motoric representation) rather than a non-representational alternative. It is irreducible to *linguistic* KT, but reducible to *broad* content.

  ### Leaf D: Deflationary Competence
  *   **Path:** Node 1 (YES) → Node 3 (NO DIFFERENCE).
  *   **Position:** Treats the distinction between KH and KT as a linguistic artifact. Both rule-following and trial-and-error result in generic competence. The philosophical problem arises from grammatical misleadingness rather than ontological difference.
  *   **Status on Procedural Calibration:** **Rejects Irreducibility (via Collapse).** Calibration is not a distinct epistemic category. It is merely one description of generic competence, which applies equally to solving an equation and riding a bike. The "non-representational" aspect is denied significance.

  ### Leaf E: The Unstable Modal Hybrid
  *   **Path:** Node 1 (NO) → Node 2 (YES).
  *   **Position:** Claims KH requires explicit rules (Intellectualist ontology) but also claims KH is falsified by single performance failures (Dispositional modal strength).
  *   **Status on Procedural Calibration:** **Incoherent.** This combination is flagged as **unstable**.
  *   **Diagnosis:** This position creates a contradiction in modal strength. If KH is reducible to KT (Node 1: NO), it inherits the modal profile of propositional knowledge: one does not lose knowledge of mathematics due to a calculation error. If KH is falsified by a single slip (Node 2: YES), it functions as a fragile disposition, not a proposition. Holding both claims simultaneously renders the concept of "knowledge" unintelligible, as it demands the normativity of truth without the resilience of truth.

  ---

  ## III. Taxonomic Notes

  **Indistinguishable Leaves:**
  There is a significant empirical overlap between **Leaf B (Ryle-Style)** and **Leaf C (Intermediate)**. Both agree that knowledge survives amnesia and that acquisition methods matter epistemically. They separate only on the *Nerve Damage* case. In practice, determining whether a change in motor execution constitutes a "transformation" of knowledge or merely a new "application" of the same ability relies on introspective reports that may be theory-laden. A participant might agree that the *experience* changes (favoring C) while insisting the *skill* remains (favoring B). The taxonomy treats these as distinct based on whether the phenomenal mode is constitutive of the knowledge (C) or incidental to the disposition (B).

  **Unoccupied Branch Diagnosis:**
  **Leaf E** is the designated unoccupied combination. It is diagnosed as **incoherent** rather than merely unexplored. It attempts to merge the ontological commitment of Intellectualism (knowledge is propositional) with the modal fragility of strict Behaviorism (knowledge is successful performance). This creates a category error: propositions are not falsified by performance slips, and dispositions are not typically defined by explicit rule retention. No stable philosophical system can maintain this junction without redefining "knowledge" equivocationally.

  **Procedural Calibration Summary:**
  The tree demonstrates that the debate is not merely about definitions, but about the **irreducibility of calibration**. 
  *   **Leaves A & D** deny that calibration requires a unique epistemic explanation.
  *   **Leaf B** argues calibration is a non-representational alternative to knowledge.
  *   **Leaf C** argues calibration is a representational *kind* of knowledge.
  *   **Leaf E** fails to coherently place calibration within any epistemic framework.
