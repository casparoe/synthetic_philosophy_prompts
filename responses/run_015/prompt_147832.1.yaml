answer: |-
  **Project Title:** The Traveling Parts Problem: A Recombinatorial Approach to Bradley's Regress and Propositional Unity

  **Project Summary**
  This independent study proposes a novel angle on the classic problem of Bradley's Regress and the unity of the proposition. Standard metaphysical accounts focus almost exclusively on the "local binding problem": how do relations bind their terms into a unified truth-bearer rather than a mere list? I argue that this focus ignores a critical constraint I call the "Recombinatorial Problem." If a proposition is a unified complex of constituents ($a$, $R$, $b$), those constituents must be capable of extraction and recombination into new propositions ($a$, $R$, $c$) without losing their identity or triggering a fresh regress at the extraction site. This project asks: Can there be an account of propositional unity that explains both local binding and global part-travel without collapsing into an infinite hierarchy of meta-relations or into a monistic blur where parts are not truly distinct? Over four months of part-time research, I will conduct a conceptual analysis of extraction and identity conditions to determine if "portable unity" is metaphysically coherent.

  **Statement of the Problem**
  Bradley's Regress arises when we ask what connects a relation to its relata. If $a$ stands in relation $R$ to $b$, we seem to need a further relation $R'$ to connect $R$ to $a$, and another $R''$ to connect $R'$ to $R$, ad infinitum. The standard literature treats this as a problem of static cohesion: how does the proposition hold together *now*?

  My proposal shifts the focus from static cohesion to dynamic mobility. Propositions are not isolated atoms; they are nodes in a logical space where constituents travel. The same relation $R$ that binds $a$ and $b$ must be available to bind $a$ and $c$. This creates a tension. If the unity of $aRb$ is so tight that $R$ is inseparable from $a$ and $b$ (to avoid regress), then $R$ cannot travel to $aRc$ without leaving a hole behind or ceasing to be itself. If the unity is loose enough to allow $R$ to travel, then $R$ seems to exist independently of the proposition, which resurrects the original regress problem (why does $R$ need binding in the new proposition if it didn't need it in the old one?).

  **Critique of Standard Accounts**
  The prevailing solutions to Bradley's Regress fail to address this recombinatorial constraint adequately.

  1.  **Fregean Unsaturatedness:** Frege solves binding by claiming relations (concepts) are essentially unsaturated. They need objects to complete them. However, this makes the relation dependent on the specific proposition for its completeness. It is unclear how an essentially "gappy" entity can retain identity while moving between different completions without implying the relation exists prior to completion (which violates the unsaturatedness claim) or that the relation changes identity with every new object (which blocks logical generalization).
  2.  **Russellian Logical Form:** Russell appeals to logical form to unify the proposition. But form is typically treated as external to the constituents. If the form is what allows $R$ to bind $a$, does the form travel with $R$? If yes, we need a meta-form to bind $R$ to the form. If no, $R$ arrives at the new proposition naked and requires new binding, restarting the regress.
  3.  **Armstrongian States of Affairs:** Armstrong takes states of affairs as fundamental. The constituents are abstracted from the state of affairs, not vice versa. This solves local binding but creates a severe bottleneck for recombination. If $R$ is only real within a specific state of affairs, the "same" $R$ in a different state of affairs is merely a universal similar to the first, not numerically identical. This undermines the intuition that logic operates on identical constituents across different propositions.

  **Research Question and Methodology**
  The core research question is: *Can there be an account of propositional unity that explains both local binding and global part-travel without collapsing into an infinite hierarchy of meta-relations or into a monistic blur where parts aren't really distinct?*

  To answer this, I will employ close conceptual analysis focused on two mechanisms:
  1.  **Extraction Conditions:** I will analyze what metaphysical work is required to "remove" a constituent from a unified complex. Does extraction destroy the unity? Does it leave a remainder?
  2.  **Identity Conditions:** I will compare the identity conditions of propositional constituents against mereological fusions. In a mereological fusion, parts lose their individual identity to the whole. In a structured complex, they retain it. I will test whether retaining identity necessarily invites regress.

  I will structure the investigation by comparing the "portable unity" model against two extremes:
  *   **The Monistic Blur:** Where unity is so strong parts are indistinguishable (blocking travel).
  *   **The Atomic Heap:** Where parts are so distinct unity is impossible (triggering regress).

  **Scope and Feasibility**
  This project is designed for a four-month, part-time timeline (approximately 10 hours per week).
  *   **Month 1:** Refinement of the "Recombinatorial Problem" definition and mapping of existing regress solutions against this specific constraint.
  *   **Month 2:** Conceptual analysis of extraction. Developing case studies where part-travel seems intuitive (logical substitution) versus where it seems metaphysically costly.
  *   **Month 3:** Comparison with mereology and structured complexes. Drafting the argument for why standard category distinctions fail the travel test.
  *   **Month 4:** Final synthesis and writing. Determining whether the problem is solvable or pseudo.

  This scope is realistic because I am not attempting to solve Bradley's Regress entirely. I am testing a specific constraint on solutions. If the analysis shows that no current theory allows for part-travel without cost, that is a successful negative result. If it shows that one theory can accommodate it, that is a successful positive result. The risk of scope creep is mitigated by focusing strictly on the *mobility* of constituents, not the nature of truth or representation generally.

  **Significance and Expected Outcomes**
  This is not merely metaphysical wheel-spinning. The stakes concern the foundation of logic and truthmaker theory. Logic relies on the principle of substitution: we assume the $R$ in one premise is identical to the $R$ in another. If metaphysical unity prevents this identity, logic rests on a fiction. Conversely, if constituents travel freely without metaphysical cost, we need to explain why propositions aren't just lists of items.

  **Success** looks like a rigorous delineation of a new category of "portable unity" or a definitive demonstration that the travel problem is pseudo (perhaps dissolving via a deflationary account of propositions).
  **Failure** would look like simply renaming Armstrong's states of affairs with extra steps—asserting parts travel without explaining the metaphysical mechanism of their detachment.

  By isolating the recombinatorial constraint, this project forces existing metaphysical frameworks to reveal hidden costs. Even if the conclusion is that standard theories cannot accommodate part-travel without modification, the project delivers a valuable constraint for future work in metaphysics and philosophical logic. I am requesting support to pursue this line of inquiry, as it bridges the gap between static ontology and the dynamic requirements of logical practice.
