answer: |-
  Here is the prioritization, the verdict on your idea, and the reasoning based on your constraints (2 years, non-specialist, archive access).

  ### The Verdict on "Epistemic Lock-in"
  **Keep it. Do not trash it.**
  It is not a standard term, but it describes a documented phenomenon often buried under "switching costs" or "sunk costs." Standard economics focuses on *financial* or *physical* irreversibility (it costs too much to rip up the tracks). Your idea focuses on *cognitive* or *procedural* irreversibility (we literally forgot how to run the tram system, even if we had the money).

  In the context of an archive, this is your comparative advantage. You are uniquely positioned to see *what was forgotten*, not just what was chosen. If you can document a case where a decision was reversed or considered, but failed because the institutional knowledge to execute the alternative had evaporated, you have a concrete contribution. Refine the term to something like **"Procedural Amnesia"** or **"Tacit Knowledge Attrition"** to make it legible to social scientists, but the core concept is solid.

  ---

  ### Prioritization of Your Three Questions

  Here is the ranking based on **tractability** and **leverage** for a non-specialist researcher.

  **1. Priority One: (3) Reversibility Thresholds**
  *   **Why:** This is the most empirically tractable. You can study this through case histories (like your 1923 zoning example). You don't need complex econometrics; you need process tracing. You are looking for the specific moment when the cost of switching exceeded the cost of staying, or when the *information* required to switch disappeared.
  *   **Tractability:** High. Archives are full of "failed proposals." Comparing a successful path against a failed alternative proposal from the same era allows you to estimate the "threshold" of resistance.
  *   **Upstream/Downstream:** This is downstream logically, but upstream *methodologically*. You need to identify *that* a lock-in exists before you can explain *how* it aggregated or *if* it was inevitable.

  **2. Priority Two: (1) Micro-to-Macro Aggregation**
  *   **Why:** This is the mechanism question. It is theoretically upstream of everything else. If individual choices don't aggregate, there is no lock-in. However, for a non-specialist, this is a trap. It usually requires Agent-Based Modeling (ABM) or heavy statistical analysis of longitudinal micro-data, which is a steep two-year learning curve.
  *   **Tractability:** Low. Without a math/econ background, you will struggle to prove aggregation formally.
  *   **Strategy:** Treat this conceptually. Use your case studies to *illustrate* aggregation (e.g., "100 small variances in lot lines created this weird street grid") rather than trying to *model* it.

  **3. Priority Three: (2) Convergence Arguments**
  *   **Why:** This is the "inevitability" question. It is the hardest to answer empirically because it relies on counterfactuals (proving what *would* have happened). It is often a philosophical stalemate.
  *   **Tractability:** Very Low. You cannot prove convergence without a model of the entire economy/society.
  *   **Strategy:** Use this as a foil. When you find a lock-in (Priority 1), ask: "Would technology X have forced this outcome anyway?" If the answer is "No, because Technology Y was available but ignored," you have weakened the convergence argument.

  ---

  ### The Crux: The Identification Problem

  The reason for this ranking is the **Identification Problem**.

  The biggest criticism of path dependence literature is: *"How do you know this wasn't just the efficient outcome?"* (i.e., We use QWERTY not because of history, but because it's actually fine).

  *   **Question (2) (Convergence)** tries to answer this by saying "Efficiency doesn't matter, history wins." But you can't prove that easily.
  *   **Question (1) (Aggregation)** tries to answer this by showing the mechanism. But mechanisms are hard to isolate.
  *   **Question (3) (Thresholds)** answers this by finding the **breakpoint**. If you can show a moment where a *better* alternative was available, known, and financially viable, but was rejected due to *procedural* friction (your epistemic lock-in), you have identified path dependence without needing to model the whole economy.

  **Therefore, measuring the threshold (3) is the only way to empirically settle the debate between (1) and (2) without a PhD in econometrics.**

  ### How "Epistemic Lock-in" Fits
  Your idea belongs inside **Priority (3)**.
  It is a specific *type* of reversibility threshold.
  *   **Physical Threshold:** It costs $10M to change the zoning.
  *   **Epistemic Threshold:** It costs $0 to change the zoning, but no one knows how to draft the legal language anymore, or the engineering specs were lost in a fire.

  By focusing on Epistemic Lock-in, you bypass the "was it efficient?" debate. If the knowledge existed and was lost, the outcome is historically contingent, not economically determined.

  ### Evidence That Would Reorder This List

  Over the next two years, watch for these signals to shift your focus:

  1.  **If you find standardized data on "forgotten technologies":** If you discover a dataset that tracks the lifespan of technical knowledge (not just patents, but manuals, training records, etc.), **Priority (1)** moves up. You could then model how knowledge loss aggregates to city-wide constraints.
  2.  **If you hit a wall on "Counterfactuals":** If you find that every time you argue "we could have done X," a historian says "No, X was impossible in 1923," then **Priority (2)** becomes the bottleneck. You will need to spend more time understanding the technological constraints of the era to prove the alternative was viable.
  3.  **If "Epistemic Lock-in" proves too vague:** If you find you can't distinguish between "we forgot how" and "it was too expensive to remember," you need to pivot back to **Priority (3)** generally and focus on hard cost thresholds instead of knowledge thresholds.

  ### Summary Advice
  1.  **Focus on Reversibility Thresholds (3).** Look for moments where change was *almost* adopted but failed.
  2.  **Use Epistemic Lock-in as your lens.** Specifically look for failures caused by lost knowledge/procedure, not just money.
  3.  **Treat Micro-Aggregation (1) and Convergence (2) as context.** Use them to frame your argument, but don't try to solve them theoretically. Solve them empirically through your archive cases.

  You are in the best possible position to study this because path dependence is ultimately a story about documents, decisions, and forgotten options. That is exactly what an archive holds.
