answer: |-
  This is a sophisticated pivot in moral philosophy. Your friend is correctly identifying that the "binary switch" model of sentience is likely a folk-psychological artifact, not a biological reality. If phenomenal experience (what it is like to be something) varies in *resolution* (bandwidth, integration, temporal depth), then a moral theory that treats it as binary is mismatched to the ontology of the mind.

  Below are the full desiderata for a **Theory of Gradated Moral Status (TGMS)**. These are the conditions the theory must satisfy to be viable, categorized by their function.

  ### I. The Desiderata List

  #### A. Metaphysical & Logical Coherence
  1.  **The Non-Arbitrariness Constraint (Non-Negotiable):** The theory cannot posit a sharp moral cutoff (a "magic line") where none exists biologically. If neural complexity scales continuously across phylogeny, moral status must scale continuously or via a justified plateau, not a cliff-edge.
  2.  **The Distinction Constraint (Non-Negotiable):** The theory must rigorously distinguish between **Threshold Status** (the point at which an entity enters the moral circle at all) and **Weighted Status** (how much moral weight that entity's interests carry). Binary theories collapse these; a gradated theory must separate them.
  3.  **The Sorites Resistance (Negotiable):** The theory must offer a solution to the "heap paradox." If we remove one neuron at a time from a human, when does moral status vanish? A gradated theory should accept that status fades gradually, but must explain why we don't treat fading status as *no* status in practical contexts.

  #### B. Scientific Alignment
  4.  **The Neuro-Phenomenal Mapping (Non-Negotiable):** The theory cannot contradict established consensus on neural correlates of consciousness. It must acknowledge that insects possess nociception (damage detection) but lack the neural integration (e.g., thalamocortical loops or equivalent) associated with high-resolution suffering in mammals.
  5.  **The Evolutionary Continuity Principle (Non-Negotiable):** The theory must respect phylogeny. It cannot assign higher moral status to a chicken than a pig, or a mammal than a cephalopod, without a specific functional justification that overrides evolutionary relatedness.
  6.  **The Zero-Point Anchor (Non-Negotiable):** The theory must definitively exclude non-sentient feedback loops (thermostats, plants, simple algorithms). There must be a lower bound where "phenomenal resolution" drops to zero, distinguishing *reaction* from *experience*.

  #### C. Moral Action-Guidance
  7.  **The Trade-Off Calculus (Negotiable):** The theory must provide a method for resolving conflicts between entities of different status. (e.g., Does high-resolution human hunger outweigh low-resolution insect pain?). It need not provide a perfect formula, but it must deny that the interests are *incomparable*.
  8.  **The Rights Floor Tension (Negotiable/High Tension):** The theory must address whether a minimum threshold of status grants *inviolable rights* (equality floor) or if all interests are always tradable based on weight. (See Section III below).
  9.  **The Epistemic Humility Clause (Negotiable):** Given we cannot measure phenomenal resolution directly, the theory must include a "precautionary principle" for ambiguous cases (the insect middle ground) to prevent moral catastrophe if our science is wrong.

  #### D. Intuitive Fit
  10. **The Clear Case Alignment (Non-Negotiable):** The theory must yield standard results for paradigmatic cases: Adult humans have high status; great apes/cephalopods have high-but-possibly-different status; rocks have none.
  11. **The Ambiguous Middle Accommodation (Negotiable):** The theory must make sense of our hesitation regarding insects. It should validate the intuition that swatting a mosquito is morally different from kicking a dog, without requiring the mosquito to have *zero* status.

  ---

  ### II. The Single Most Damaging Desideratum to Binary Theories

  **The Non-Arbitrariness Constraint (Desideratum #1).**

  This is the "killer" constraint. Binary theories rely on a threshold view of sentience (either you feel pain or you don't). However, neuroscience increasingly suggests that the *capacity* to feel is composed of sub-capacities (sensory discrimination, affective valence, temporal integration, self-monitoring).

  If an insect has 5% of the integration capacity of a mouse, and a mouse has 5% of a human, a binary theory must claim the insect has **0** moral status and the mouse has **100%** (or some fixed non-zero amount). This requires a metaphysical leap where a quantitative biological difference creates a qualitative moral miracle. A gradated theory argues that if the *substrate* is analog, the *value* derived from it must be analog. Any theory that insists on a binary switch violates the principle that moral properties supervene on natural properties without magical discontinuities.

  ---

  ### III. The Core Tension: Phenomenal Resolution vs. Equality Floor

  There is a profound conflict between **Desideratum #1 (Non-Arbitrariness/Gradation)** and **Desideratum #8 (Rights Floor)**.

  *   **The Gradation View:** If moral status tracks phenomenal resolution, then a being with 1% of human resolution has 1% of the moral weight. This implies that enough low-resolution interests could be trumped by one high-resolution interest. (e.g., It might be permissible to kill a billion insects to save one human).
  *   **The Equality Floor View:** Many ethical frameworks (Rights-based, Kantian) insist that once you cross the threshold of sentience, you possess *inviolable* rights. You cannot be sacrificed merely for the greater good.

  **The Conflict:** If you enforce an Equality Floor, you effectively reintroduce a binary switch (you have rights or you don't), which undermines the "Gradated" nature of the theory. If you enforce strict Gradation, you risk permitting atrocities against low-resolution beings that feel intuitively wrong (e.g., factory farming insects if the math works out).

  **Resolution Strategy:** A robust TGMS usually adopts a **Two-Tier System**:
  1.  **Threshold:** A minimum level of integration required to have *any* status (excludes thermostats).
  2.  **Scaling:** Above that threshold, interests are weighted by resolution, *but* a "protective margin" applies to prevent trivial interests from overriding basic existence interests of lower-resolution beings.

  ---

  ### IV. Coverage Table: How the Theory Must Map Reality

  This table outlines how a successful Theory of Gradated Moral Status must categorize the three zones of biological reality.

  | Zone | Biological Examples | Phenomenal Profile | Required Moral Output | Biological Constraints |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bottom (Zero-Point)** | Thermostats, Plants, Single-cells, Simple Algorithms. | **No Experience.** Purely syntactic feedback loops. No "what it is like." | **Zero Status.** No direct moral consideration. Instrumental value only. | Cannot attribute nociception or valence to systems lacking nervous systems or equivalent signaling. |
  | **Middle (The Gradient)** | Insects, Nematodes, Crustaceans, Fish. | **Low-Resolution Experience.** Nociception present. Affective valence likely present but narrow temporal depth and low integration. | **Gradated Status.** Interests count, but weigh less than high-resolution beings. Permissible to harm for significant higher-weight interests (e.g., food, health), but not for trivial ones (e.g., boredom). | Must distinguish *nociception* (reflex) from *pain* (suffering). Must acknowledge uncertainty in integration capabilities. |
  | **Top (High-Resolution)** | Humans, Great Apes, Cetaceans, Elephants, Cephalopods. | **High-Resolution Experience.** Rich integration, deep temporal horizon, complex affective states, self-modeling. | **High Weight / Potential Rights.** Interests heavily weighted. Requires strong justification to override. May trigger "Equality Floor" protections. | Cannot ignore cognitive disabilities in humans (must account for status via species-typical capacity or actual capacity without discrimination). |

  ### V. Summary of Negotiability

  | Desideratum | Status | Reason |
  | :--- | :--- | :--- |
  | **Non-Arbitrariness** | **Non-Negotiable** | Without this, the theory is just a binary theory with extra steps. |
  | **Threshold vs. Weight** | **Non-Negotiable** | Collapsing these leads to the "insect problem" (either they matter as much as us, or not at all). |
  | **Zero-Point Anchor** | **Non-Negotiable** | If thermostats have status, the theory explodes into panpsychist absurdity. |
  | **Trade-Off Calculus** | **Negotiable** | Utilitarians want a formula; Deontologists want side-constraints. Both can accept gradation. |
  | **Rights Floor** | **Negotiable** | This is the main philosophical battleground. You can have gradation without inviolable rights, or with them. |
  | **Epistemic Humility** | **Negotiable** | A theory *could* be confident in its categorization, but precaution is safer for policy. |

  ### Final Recommendation for Your Discussion
  When talking to your friend, focus on **Desideratum #2 (The Distinction Constraint)**.

  The biggest confusion in this debate is people thinking "Gradated Status" means "Some humans might be worth less than other humans." That's a category error. The theory should argue that **Entry** into the moral circle is binary (you either have experience or you don't), but **Weight** within the circle is analog (the richness of that experience).

  This allows you to say: *"The insect is definitely in the moral circle (unlike the thermostat), but its voice is much quieter than the human's (unlike the binary view where they are equal)."* This satisfies the biological data without collapsing into moral absurdity.
