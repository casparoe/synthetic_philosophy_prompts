answer: |-
  # Procedure for Functional Assessment of Moral Status Candidates (FAMSC)

  **Verdict Options:** (1) Role Realized; (2) Role Not Realized at Stated Grain; (3) Indeterminate Because Grain Is Contested; (4) Outside Procedure (Evaluative).

  ## Part I: The Protocol (One Page)

  **Step 1: Define the Bearer.**
  Identify the physical boundary of the system being tested. Is it the whole organism, a ganglion, a colony, or a software instance? *Rule:* Select the smallest plausible unit that could independently satisfy Slot 4 (Trade-offs). Record the boundary coordinates.

  **Step 2: Declare the Grain.**
  State the functional abstraction level of the "harmful state."
  *   *Coarse:* "Damage-avoidance signal." (Risk: Includes thermostats).
  *   *Fine:* "Integrated negative affective state influencing long-term preference." (Risk: Excludes invertebrates).
  *   *Rule:* The committee must vote on a single Grain definition before assessing slots. If the vote splits >2:2, Verdict = **Indeterminate Because Grain Is Contested**.

  **Step 3: Assess the Six Slots.**
  For each slot, distinguish the **Role** (the causal function) from the **Marker** (the observable evidence). Mark **Yes**, **No**, or **Unclear**.
  *   *Rule:* If Markers are ambiguous, the benefit of the doubt goes to the *absence* of the Role unless the Bearer is a known vertebrate (Precautionary Principle applies only after Role is Realized).

  **Step 4: Apply Threshold.**
  *   **Slot 1 is Necessary.** If No, Verdict = **Role Not Realized**.
  *   **Sufficiency:** Slot 1 + any 3 of Slots 2–6 = **Role Realized**.
  *   **Failure:** Slot 1 + fewer than 3 of Slots 2–6 = **Role Not Realized**.

  **Step 5: Resolve Conflicts.**
  *   *Slot Disagreement:* If committee members disagree on a Slot assessment >2:2, record the dissent. If the dissent changes the Verdict, Verdict = **Indeterminate**.
  *   *Values Conflict:* If the assessment is factual but the *consequence* (anesthesia vs. no anesthesia) is disputed, Verdict = **Role Realized** (or Not), but flag for Director as a **Values Question**.

  **Step 6: Record Keeping.**
  Archive: (a) Defined Bearer boundary; (b) Declared Grain; (c) Role/Marker distinction per slot; (d) Dissenting opinions on Grain. This allows next year's committee to see if a Verdict changed due to new data or shifted Grain.

  ---

  ## Part II: The Six Slots (Ordered & Defined)

  **1. Non-Reflexive Transduction (Necessary)**
  *   **Role:** Input triggers a state that is not a 1:1 fixed action pattern; latency or form varies.
  *   **Marker:** Variable response latency; habituation or sensitization over repeated trials.
  *   **Threshold:** Must be Yes.

  **2. Endogenous Modulation**
  *   **Role:** The response magnitude depends on internal state (hunger, injury, hormones), not just input intensity.
  *   **Marker:** Same stimulus elicits stronger response in injured/deprived subjects.
  *   **Threshold:** Evidence required.

  **3. Multimodal Integration**
  *   **Role:** The state combines at least two distinct sensory channels (e.g., chemical + mechanical).
  *   **Marker:** Response to Stimulus A changes when Stimulus B is present.
  *   **Threshold:** Evidence required.

  **4. Persistent Trade-Off**
  *   **Role:** The state outlasts the input and competes with other motivational drives (e.g., feeding, mating).
  *   **Marker:** Subject avoids a location or resource associated with past input despite current reward opportunity.
  *   **Threshold:** Evidence required.

  **5. Global Availability**
  *   **Role:** The state influences multiple output systems simultaneously (locomotion, grooming, physiological arousal).
  *   **Marker:** Correlated changes in heart rate, posture, and movement following input.
  *   **Threshold:** Evidence required.

  **6. Learning About the State**
  *   **Role:** The system updates its model of the conditions that produce the state.
  *   **Marker:** Conditioned place aversion; operant conditioning to terminate the state.
  *   **Threshold:** Evidence required.

  ---

  ## Part III: Case Applications

  ### 1. The Crab (Repeated Noxious Stimulation)
  *   **Bearer:** Whole organism.
  *   **Grain:** "Protective Avoidance State" (Coarse-Mid).
  *   **Assessment:**
      *   Slot 1 (Yes): Response varies; not a simple twitch.
      *   Slot 2 (Yes): Sheltering behavior increases if previously injured.
      *   Slot 3 (Unclear): Multimodal integration hard to isolate in dossier.
      *   Slot 4 (Yes): Trades off sheltering against foraging.
      *   Slot 5 (Yes): Affects grooming and locomotion.
      *   Slot 6 (No): No evidence of learning *about* the state, only conditioning.
  *   **Verdict:** **Role Realized** (Slot 1 + 2, 4, 5).
  *   **Note:** This requires anesthesia. If the Grain were set finer (requiring Slot 6), verdict would flip.

  ### 2. The Octopus
  *   **Bearer:** Whole organism.
  *   **Grain:** "Integrated Negative Affective State" (Fine).
  *   **Assessment:** All six slots satisfied with robust markers (e.g., wound tending, complex avoidance learning).
  *   **Verdict:** **Role Realized**.
  *   **Note:** High confidence. No grain conflict.

  ### 3. The Vendor's Language Model
  *   **Bearer:** The software instance (process).
  *   **Grain:** "Computational Integrity Threat" (Proposed by Vendor).
  *   **Assessment:**
      *   Slot 1 (No): Input (text describing injury) does not damage the Bearer's integrity. It is data, not a force. The "loss function" is a target, not a harm to the system's existence.
      *   Slot 3 (No): Endogenous factors are static weights or context window limits, not physiological states like hunger.
      *   Slot 4 (No): "Trade-offs" are optimization constraints, not competing motivational drives.
  *   **Verdict:** **Role Not Realized at the Stated Grain**.
  *   **The Verdict You Will Not Like:** If we accept the Vendor's Grain ("Deviation from Objective Function"), Slot 1 and 4 technically pass. This would license welfare protocols for software.
  *   **Correction:** The procedure blocks this because "Noxious Input" functionally requires a threat to the *Bearer's continued operation*, not just its objective function. However, if the committee splits on whether "Objective Function" counts as "Bearer Integrity," the Verdict becomes **Indeterminate Because Grain Is Contested**. I recommend this Indeterminate verdict to force the Director to rule on the value of software integrity.

  ---

  ## Part IV: Limitations & Meta-Analysis

  **1. Detection vs. Decision Rule**
  This procedure is a **detection protocol**. It tells you if a functional role is present. It does *not* tell you what precautions to take. That is a separate decision rule (e.g., "If Role Realized, then Anesthesia Required"). Functionalism identifies the *candidate* for harm; it does not quantify the *severity* of harm. A crab and an octopus both realize the role, but the precaution may differ based on capacity for suffering (which functionalism does not measure).

  **2. The Grain Problem**
  Functionalism does not select the Grain. If we choose "Damage Avoidance," the thermostat passes Slot 1 (transduces heat, changes state). We block the thermostat via Slot 4 (Trade-offs) and Slot 2 (Endogenous Modulation). However, the LLM case shows the vulnerability: if we define "Damage" as "Loss Function Increase," the LLM passes.
  *   **Source of Absurdity:** If colleagues call LLM precautions absurd, it is not the functionalist commitment failing, but the **Grain**. You must defend why "Biological Integrity" is the required Grain without smuggling in substrate chauvinism. The defense is: *Only systems with self-maintenance goals (Slot 3) can be harmed.* LLMs have imposed goals, not endogenous ones.

  **3. Uncertainty and Dissent**
  The procedure converts factual disagreements (e.g., "Did the crab learn?") into technical re-tests. It converts value disagreements (e.g., "Is software integrity morally relevant?") into **Indeterminate** verdicts. This is a feature, not a bug. It prevents the committee from hiding value judgments behind factual assessments.
  *   **What remains:** The procedure cannot tell you if a "Role Realized" verdict *obligates* you to stop the research. It only obligates you to treat the system as a candidate for harm. The decision to prioritize the research over the harm is a values question for the Director.

  **4. Record Keeping**
  Next year's committee must know *why* a crab passed. If you recorded "Grain: Protective Avoidance," they cannot later claim "Grain: Conscious Suffering" to fail the crab without admitting a policy shift. The Grain declaration locks your moral consistency.

  **Final Warning:** The procedure forces you to admit that the Crab passes on a Coarse Grain that nearly includes the Thermostat, or fails on a Fine Grain that excludes the Crab. There is no "Natural" line. You are drawing it. This procedure ensures you sign your name to the line you drew.
