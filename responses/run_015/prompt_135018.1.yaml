answer: |-
  **MEMORANDUM**

  **TO:** University President and Board of Trustees
  **FROM:** Commemoration and Naming Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Pending Naming Referrals and Future Policy Framework

  **Executive Summary**
  The Committee recommends removing the name from Pemberton Hall, retaining the Carrington Lectures with mandatory contextualization, and retaining the Alcott Scholarship with archival notation. These decisions are based on a new "Conferral and Nexus" framework that prioritizes current institutional values over historical blame. Implementation will occur over 24 months, paired with material investments in structural equity to ensure these changes are not merely symbolic.

  **Specific Recommendations**

  **1. Pemberton Hall (Engineering)**
  **Decision:** Remove name.
  **Rationale:** Alden Pemberton's fortune was derived directly from convict leasing; the wrongdoing is not adjacent to his wealth but constitutive of it (Nexus). While the "man-of-his-time" defence suggests universal acceptance, contemporary dissent existed from Black community leaders and clergy, indicating the "time" was not monolithic but stratified by power (Whose Time). Furthermore, the 1961 naming occurred during desegregation fights; minutes referencing "character" suggest the name served a specific exclusionary function then, which continues to signal exclusion now (Current Uptake).
  **Action:** The building will be referred to by its function until a new naming process concludes. Ten percent of Pemberton's endowment income will be redirected to engineering scholarships for first-generation students.

  **2. Carrington Lectures in Statesmanship**
  **Decision:** Retain name with Contextualization.
  **Rationale:** The lectures honor wartime leadership. While colonial famine and detention camps occurred under Carrington's watch, they are entangled with but not identical to the specific achievement being honored (Mixed Nexus). Contemporaries did denounce these actions, invalidating the "man-of-his-time" defence, yet the historical complexity remains pedagogically useful. Removal risks simplifying the history of statesmanship rather than engaging it.
  **Action:** A permanent plaque must detail the controversies regarding empire and famine. The lecture series mandate will be expanded to explicitly include topics on post-colonial ethics and humanitarian crisis.

  **3. Alcott Scholarship**
  **Decision:** Retain name.
  **Rationale:** The antisemitic views found in Alcott's diaries were never acted upon and were standard for her demographic (Weak Nexus). Punishing private beliefs uncovered decades later creates a "lottery of literacy" where only those who left papers are judged (Archive Effect).
  **Action:** Award materials will include a brief note acknowledging the dissonance between Alcott's literary contribution and her private views.

  **The Conferral and Nexus Framework**

  To prevent future circular debate, the Committee adopts the following test for all naming referrals. This shifts the inquiry from historical judgment to institutional conferral.

  1.  **Conferral vs. Blame:** We are not adjudicating the honoree's moral guilt. We are deciding whether *this institution* wishes to confer honor now. A figure may be excusable by the standards of their decade but incompatible with our current mission.
  2.  **The Nexus Test:** Is the wrongdoing integral to the achievement being honored? If the harm enabled the achievement (e.g., convict leasing funding a building), removal is presumptive. If the harm is adjacent (e.g., private bigotry unrelated to public work), retention is presumptive.
  3.  **Whose Time:** Appeals to historical context must account for dissenting voices at the time. If marginalized contemporaries objected, the "universal standard" defence fails.
  4.  **Current Uptake:** Does the naming cause active harm to current students or faculty? A 1961 naming may carry segregationist baggage that a 1905 naming does not.

  **Process and Review**
  Acknowledging that our own consensus will look parochial in fifty years (Unstable Present), no decision is permanent. We recommend a scheduled review of all namings every ten years, alongside a petition trigger allowing students and faculty to request review upon reaching a 15% signature threshold. This mitigates the Archive Effect by allowing community concern, not just historical discovery, to drive review.

  **Addressing Core Objections**

  **The "Cheap Symbolism" Argument**
  The strongest argument against removal is that renaming allows the institution to feel clean without changing who it admits, hires, or pays. There is merit to this: a building name change costs less than a hiring initiative. However, symbols are material; they affect recruitment and belonging. To neutralize the risk of performative cleanup, this memo ties naming decisions to resource allocation. Removing Pemberton's name is contingent on redirecting endowment income to access scholarships. We cannot accept the moral capital of removal without the financial cost of repair. If we rename without restructuring, we confirm the critique that this is merely aesthetic hygiene.

  **The "Universally Excused" Wrongdoer**
  A difficult case remains: a figure whose actions were considered acceptable by everyone at the time, including critics. Does the "Whose Time" defence guarantee retention? Under this Framework, it does not. Because the question is Conferral, not Blame, we may still remove a name if the value represented is antithetical to our current mission, even if the honoree was not "wrong" by their own lights. However, the burden of proof is higher. Without contemporary dissent to cite, the Committee must demonstrate that the *current* uptake causes specific harm to the university's mission. The defence succeeding (no contemporary dissent) clears the honoree of historical hypocrisy, but it does not bind us to eternal honor. We are free to decide that some values, even universally held ones, are incompatible with who we intend to be.

  **Costs and Timeline**

  **Financial Costs:** Estimated $150,000 for signage replacement and contextualization plaques. This is to be absorbed within existing facilities budgets. The redirected Pemberton endowment income is estimated at $40,000 annually.
  **Political Costs:** Expect alumnae pushback regarding Carrington and Alcott. Communications must emphasize the educational value of context over erasure.
  **Timeline:**
  *   **November 2023:** Board acceptance of Framework.
  *   **January 2024:** Public announcement of decisions.
  *   **June 2024:** Contextualization plaques installed.
  *   **August 2025:** Pemberton Hall signage removed following commencement.
  *   **2034:** First scheduled decadal review.

  This approach moves us from moral auditing to strategic alignment. It acknowledges that history is fixed, but what we choose to carry forward is not.

  **Approval Requested**
