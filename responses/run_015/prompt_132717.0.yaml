answer: |-
  This is a fantastic question, and your unit testing analogy is actually sharper than you think. You've hit on one of the most technical and heated debates in Indian philosophy.

  First, a quick map correction: You mentioned Nyāya lists *anupalabdhi* as a fifth *pramāṇa*. Actually, **classical Nyāya (Gautama/Vātsyāyana) explicitly rejects *anupalabdhi* as a separate *pramāṇa*.** They stick to the big four (Perception, Inference, Comparison, Testimony).

  It is primarily the **Mīmāṃsā** school (specifically the Bhāṭṭa sub-school) and **Advaita Vedānta** that argue for *anupalabdhi* as a distinct fifth means of knowledge. Nyāya argues that knowing something is absent is just a specific type of **Inference (*anumāna*)**.

  So, the debate you're untangling is actually **Nyāya (Inference) vs. Mīmāṃsā/Advaita (Anupalabdhi)**.

  Here is where the machinery breaks down and where the actual disagreement lives.

  ### 1. The Epistemic Fight: Inference vs. Direct Cognition
  You asked if the core issue is ontological (is absence real?) or epistemic (do we need a unique mechanism?). The answer is: **The epistemology drives the ontology.**

  **The Nyāya Position (It's Inference):**
  Nyāya says your brain is running a syllogism when you see the empty desk. It looks like this:
  *   **Proposition:** The coffee cup is not on the desk.
  *   **Reason (*Hetu*):** Because I do not perceive it (and I am capable of perceiving it).
  *   **Universal Principle (*Vyāpti*):** If an object were present and conditions were right, it would be perceived.

  For Nyāya, this is inference. You perceive the desk (the locus). You fail to perceive the cup. You infer the absence. They argue we don't need a new *pramāṇa* for this; the existing engine of Inference handles it fine.

  **The Mīmāṃsā/Advaita Position (It's *Anupalabdhi*):**
  They argue that inference requires a positive link (*vyāpti*) between a reason and a conclusion. But absence is... well, absent. You can't have a positive logical link to a negative fact without it getting circular.
  *   **The Argument:** When you look at the desk, you don't *reason* "The cup is not here." You **immediately** cognize the emptiness. There is no mental gap for a syllogism to fill.
  *   **The Mechanism:** If I have to infer absence, I would need to perceive the "absence" as a property to use it as a reason. But if I already perceive the absence to use it as a reason, I don't need to infer it. I already know it.
  *   **Conclusion:** Therefore, there must be a direct cognitive mechanism (*anupalabdhi*) that apprehends non-existence immediately, without a middle term (*hetu*).

  **Your Unit Testing Analogy:**
  *   **Nyāya (Inference):** The test suite passes. Based on the coverage map (universal principle), I infer there are no critical bugs. (This is probabilistic and relies on the "if bug existed, test would fail" link).
  *   **Mīmāṃsā (Anupalabdhi):** The dashboard shows "0 Errors." That zero is a direct datum. I don't infer the zero; the system reports the zero. The "absence of errors" is a direct state I observe.

  ### 2. The Ontological Stakes: Is Absence a "Thing"?
  This is where your "red herring" radar is half-right. It feels like metaphysics, but it's required to make the epistemology work.

  If *anupalabdhi* is a valid *pramāṇa*, it must have a valid object (*prameya*). You can't have a "means of knowing" that knows "nothing."
  *   **Bhāṭṭa Mīmāṃsā:** They bite the bullet. **Absence (*abhāva*) is a real, positive entity.** It's not just the lack of a cup; "Cup-Absence" is a distinct ontological category that exists on the desk. This allows the senses to "grab" it.
  *   **Nyāya:** They are realists too, but they treat absence as a **property of the locus**, not a separate entity. The desk possesses the property "cup-absence."

  ### 3. The *Sannikarṣa* Problem (Contact)
  This is the specific technical knot you asked about. Nyāya defines Perception (*pratyakṣa*) as knowledge born from **contact (*sannikarṣa*)** between sense organ and object.

  **The Problem:** How do my eyes make contact with "not-a-cup"? Photons bounce off the desk, not off the absence. If absence is nothing, there is nothing to contact.

  **The Nyāya Solution (Qualifier-Qualified):**
  Since Nyāya rejects *anupalabdhi* as a separate *pramāṇa*, they don't need to solve this for perception. They solve it for inference. However, later Nyāya (Navya-Nyāya) refined how we perceive absence to keep it within Perception (for simple cases) without making it a separate *pramāṇa*.
  *   They use the relation of **Viśeṣaṇa-Viśeṣya-Bhāva** (Qualifier-Qualified Relation).
  *   I perceive the **Desk** (the qualified).
  *   The **Absence of the Cup** is the qualifier.
  *   The *sannikarṣa* (contact) happens with the Desk. The absence is cognized *through* the contact with the desk, as a property of it.
  *   **Analogy:** You see a red ball. Your eye contacts the ball. You perceive "redness" through that contact. You don't need to touch "redness" separately. Similarly, you touch the desk, and perceive "cup-absence" as a property of the desk.

  **The Mīmāṃsā Solution:**
  They argue that *anupalabdhi* is a distinct *pramāṇa*, so it doesn't strictly need *sannikarṣa* in the same way perception does. It is a unique cognitive channel. However, to make it robust, they claim the "absence" is a distinct object that the mind/senses can apprehend directly, almost like a negative image.

  ### 4. Why Nyāya Rejects the 5th *Pramāṇa* (Cognitive Economy)
  Nyāya is the "Ockham's Razor" school of Indian philosophy. They hate multiplying entities without necessity.
  *   If Inference can do the job, why postulate a new *pramāṇa*?
  *   They argue that *anupalabdhi* is just **Inference based on Non-Perception** (*anupalabdhi-lakṣaṇā anumiti*).
  *   They say: "You only think it's direct because the inference is instantaneous." Just because a compiled script runs fast doesn't mean it isn't code.

  ### Summary of the Disagreement
  1.  **Is it Direct or Mediated?**
      *   **Mīmāṃsā:** Direct. (Like seeing a color).
      *   **Nyāya:** Mediated. (Like calculating a result).
  2.  **Is Absence an Object?**
      *   **Mīmāṃsā:** Yes, it's a distinct ontological category (*padārtha*).
      *   **Nyāya:** It's a property of a locus, not a standalone object.
  3.  **The *Sannikarṣa* Issue:**
      *   **Nyāya:** Solved by perceiving the locus (desk) qualified by the absence.
      *   **Mīmāṃsā:** *Anupalabdhi* doesn't require physical contact in the same way; it's a negative apprehension.

  ### Back to Your Dev Analogy
  You asked if passing tests proves no bugs.
  *   **Nyāya says:** No, it's an inference. "Tests passed + High Coverage = Likely No Bugs." It's dependent on the *hetu* (coverage).
  *   **Mīmāṃsā says:** If the system is designed correctly, the state "No Bugs" is a distinct system state that can be directly queried. `system.state == BUG_FREE`. That query is *anupalabdhi*.

  The "conceptual knot" you're feeling is the tension between **Cognitive Economy** (Nyāya: don't invent new senses if logic works) vs. **Phenomenological Accuracy** (Mīmāṃsā: but it *feels* direct, so the mechanism must be direct).

  Nyāya wins on parsimony; Mīmāṃsā wins on describing the immediate experience of noticing something is missing.
