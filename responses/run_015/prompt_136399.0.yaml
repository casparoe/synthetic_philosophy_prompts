answer: |-
  here's the spec. this isn't about defending one view, it's about laying out the job description for any theory that wants to claim it solves the chance-credence link. if your theory can't check these boxes, it's incomplete.

  ### 1. core desiderata (the must-haves)

  **D1: basic alignment (the floor)**
  *   **the case:** you learn via reliable oracle that the physical chance of event $E$ is $0.7$. you have no other inadmissible info.
  *   **the requirement:** your credence $Cr(E)$ must be $0.7$.
  *   **why:** this is the whole point of positing objective chance. if learning the chance value doesn't fix your credence, the concept is doing no work.
  *   **status:** non-negotiable.

  **D2: undermining safety (humphreys' problem)**
  *   **the case:** chances supervene on the whole history of outcomes (Humean view). but future outcomes determine the chances. if you know the current chance is $x$, that implies constraints on future frequencies. but those future frequencies could turn out to undermine the claim that the chance *was* $x$.
  *   **the requirement:** the theory must allow you to defer to current chances without implying you know the future won't undermine them. it needs a way to conditionalize on chance hypotheses that doesn't explode when the chance hypothesis entails evidence you don't have.
  *   **why:** otherwise, learning the chance gives you inadmissible info about the future, violating the spirit of chance.
  *   **status:** non-negotiable for Humeans; optional for primitivists.

  **D3: mediated expert deference (the trust gap)**
  *   **the case:** a scientist tells you "the chance is 0.7". but you know their measurement device has a 10% failure rate.
  *   **the requirement:** your credence should *not* be 0.7. it should be weighted by your credence that the scientist is right. the theory must distinguish between $Ch(E)=x$ and $Report(Ch(E)=x)$.
  *   **why:** PP applies to the chance function itself, not testimony about it. collapsing this distinction makes you vulnerable to bad data.
  *   **status:** non-negotiable.

  **D4: the copy-room twist (self-location + copying)**
  *   **the case:** coin flipped in Room A (Chance 0.5). Result copied to Room B after 1 hour. you are in A or B (50/50 self-locating belief). you see a display.
  *   **the requirement:** the theory must give a principled answer for $Cr(Heads)$ that doesn't just say "it depends." specifically: it must distinguish between the chance of the *flip* (0.5) and the chance of *your display* (which is 0.5 if A, but 0 or 1 if B).
  *   **the catch:** if you apply PP blindly to "my display shows heads," you might get it wrong because in Room B there is no objective chance anymore, only fixed history. the theory must handle indexical uncertainty without collapsing it into physical indeterminacy.
  *   **status:** non-negotiable for any view claiming to handle modern physics/anthropics.

  ### 2. distinctions that must survive

  **D5: chance-value vs. chance-mechanism**
  *   you can defer to the number (0.5) without knowing the mechanism (quantum decay vs. chaotic turbulence). but if you learn the mechanism is broken, deference stops. the theory can't treat the number as magic independent of the generating process.

  **D6: physical indeterminacy vs. indexical ignorance**
  *   in the copy-room case, uncertainty in A is physical (coin hasn't landed). uncertainty in B is indexical (which room am i in?). the theory must not treat these as the same kind of probability. mixing them up leads to counting errors (like in sleeping beauty cases).

  **D7: quantitative weight vs. moral/status weight**
  *   chance has normative force on belief, but it isn't a moral command. also, just because a chance is "objective" doesn't mean it outweighs specific evidence. (e.g., chance of rain is 0.9, but I see the sun shining—my credence shouldn't be 0.9). the theory needs an admissibility clause that protects specific evidence from being swamped by general chance stats.

  ### 3. the impossible trinity (jointly unsatisfiable)

  flagging this pair because you probably can't have both without major tweaks:

  **[strict PP] + [Humean Supervenience]**
  *   if chances supervene on total history (Humean), then knowing the chance gives you info about the future history (undermining).
  *   if you follow strict PP, you conditionalize on that chance.
  *   result: you end up with credences that contradict the chance hypothesis itself.
  *   **fix:** you either gotta weaken PP (New Principle), deny Humean Supervenience (primitivist chances), or accept that some futures are impossible given current chances (which feels wrong).

  **[indexical independence] + [copy-room intuition]**
  *   if you insist that objective chance is totally independent of self-locating facts, you struggle to explain why your credence in the copy-room case isn't just 0.5 regardless of the copying mechanism. some views require blending indexical and physical probability, which purists hate.

  ### 4. non-negotiable vs. camp-specific preferences

  **non-negotiable (dealbreakers if failed):**
  *   **coherence:** no Dutch books. your credences must obey probability axioms.
  *   **basic alignment:** in simple cases, $Cr = Ch$.
  *   **evidence sensitivity:** if you have direct evidence (seeing the coin land), chance deference must turn off.

  **camp-specific (pick your poison):**
  *   **determinism compatibility:** do chances exist in a deterministic world? (compatibilists say yes, hardliners say no).
  *   **belief-dependent chances:** can your credence influence the chance? (standard view: no. revisionist/causal decision theory views: maybe).
  *   **QM equivalence:** does the theory have to match textbook quantum mechanics in the limit? (most say yes, but some philosophical views diverge on interpretation).
  *   **admissibility criteria:** what counts as "admissible" info? (past history only? or also laws?).

  ### 5. scorecard

  here's how the big three contenders stack up against the spec.

  **1. orthodox PP (Lewis-style)**
  *   **basic alignment:** pass.
  *   **undermining:** fail (Lewis admitted this, requires the "New Principle" patch).
  *   **mediated expert:** pass (handles via conditionalization).
  *   **copy-room:** shaky. requires careful setup of admissibility to avoid collapsing indexical uncertainty.
  *   **verdict:** solid baseline, but breaks on Humean undermining without patches.

  **2. revisionist "halfway" (credence influences chance)**
  *   **basic alignment:** pass (mostly).
  *   **undermining:** pass (dissolves the problem by making chance flexible).
  *   **mediated expert:** pass.
  *   **copy-room:** good. handles the feedback loop between observer and setup well.
  *   **verdict:** solves the hard puzzles but costs you the idea of "objective" chance being truly independent of mind. high metaphysical price.

  **3. flat rejection (chance is just credence)**
  *   **basic alignment:** fail (redefines the terms, so technically N/A, but loses the normative oomph).
  *   **undermining:** pass (no objective chance to undermine anything).
  *   **mediated expert:** pass (just Bayesian updating on testimony).
  *   **copy-room:** pass (treats it all as Bayesian self-location).
  *   **verdict:** cleanest ontology, but fails the job description. if there's no objective chance, you haven't built a theory of deference to chance, you've built a theory of subjective belief.

  **summary:** if you want to keep objective chance real, you gotta swallow the undermining bullet or go primitivist. if you want the copy-room case to feel intuitive, you probably need to loosen the strict separation between indexical and physical probability. there's no free lunch here.
