answer: |-
  ### 1. Candidate Principle: The Counterfactual Market-Correction Framework

  This is a single operational framework with three sequential clauses. It replaces the multiplicative ITN score with a filter-based decision tree that computes counterfactual impact by diagnosing the *cause* of neglect and the *mechanism* of leverage.

  **Inputs Required:**
  1.  **Direct Value (DV):** Estimated good done if the program succeeds.
  2.  **Displacement Probability (DP):** Likelihood (0–1) that the activity would have occurred anyway due to other funders or organic growth.
  3.  **Neglect Diagnosis (ND):** Classification of *why* the area is underfunded. Must be one of:
      *   *Hard Constraint:* Expert consensus on infeasibility, physical limits, or insurmountable logistics.
      *   *Market Failure:* Stigma, coordination problems, information asymmetry, or career risk.
      *   *Attention Gap:* Simply boring or overlooked, but feasible.
  4.  **Leverage Mechanism (LM):** Description of how follow-on funding is triggered. Must be either *Causal* (specific milestones release specific capital) or *Signaling* (general visibility).
  5.  **Uncertainty Type (UT):** Classification of the primary risk. Either *Empirical* (claims about how the world is) or *Moral* (claims about what matters).

  **Order of Operations:**

  1.  **The Additionality Filter:** Calculate *Baseline Counterfactual Value* = DV × (1 − DP).
      *   *Rule:* If Baseline Counterfactual Value is negligible (DP > 0.9), **Reject** regardless of DV.
  2.  **The Consensus Deference Filter:** Apply a *Consensus Multiplier (CM)* based on ND.
      *   If ND = *Hard Constraint*: CM = 0.1 (Strong presumption against funding).
      *   If ND = *Market Failure*: CM = 1.5 (Presumption that the crowd is wrong).
      *   If ND = *Attention Gap*: CM = 1.0 (Neutral).
      *   *Adjusted Value* = Baseline Counterfactual Value × CM.
  3.  **The Leverage & Uncertainty Adjustment:**
      *   *Leverage:* If LM = *Causal*, add expected follow-on value to Adjusted Value. If LM = *Signaling* only, add 0.
      *   *Uncertainty:* If UT = *Empirical*, discount Adjusted Value by confidence level. If UT = *Moral*, treat confidence level as a portfolio weight (fund proportionally to confidence, do not discount to zero).
  4.  **The Scale Constraint:** Identify the marginal return curve. Fund only up to the point where marginal return drops below the fund's opportunity cost threshold. Do not fund the "large version" of a program if it exhibits steep diminishing returns.

  **Conflict Resolution:**
  *   The Additionality Filter is a hard gate (Veto).
  *   The Consensus Deference Filter overrides Direct Value (a high DV with a Hard Constraint is rejected).
  *   Moral Uncertainty overrides Empirical Uncertainty in cases of equal confidence (Moral views are funded as diversification; Empirical views are funded only as probable truth).

  ---

  ### 2. Case Mapping

  *   **The Additionality Filter (Clause 1):**
      *   **Case 1:** Forced the DP input. High importance/tractability was overridden by high displacement probability.
      *   **Case 10:** Forced the dynamic nature of DP. Neglect is not static; your own funding changes DP for future cycles.
      *   **Case 9:** Forced the distinction between *Expected* Value and *Realized* Value. The principle evaluates the ex-ante calculation (DP was low at the time), not the ex-post outcome.

  *   **The Consensus Deference Filter (Clause 2):**
      *   **Case 3:** Forced the *Market Failure* classification. Stigma/career risk indicates the crowd is biased, justifying a CM > 1.
      *   **Case 4:** Forced the *Hard Constraint* classification. Expert consensus on impossibility indicates the crowd is likely correct, justifying a CM ≈ 0.
      *   **Case 2:** Forced the inclusion of *Information Value* within DV. Testing logistics resolves a *Hard Constraint* uncertainty, turning it into a known variable.

  *   **The Leverage & Uncertainty Adjustment (Clause 3):**
      *   **Case 5:** Forced the *Causal* Leverage rule. Specific mechanisms for follow-on funding count as value.
      *   **Case 6:** Forced the *Signaling* exclusion. General enthusiasm without a mechanism counts as zero value.
      *   **Case 8:** Forced the *Uncertainty Type* distinction. Empirical uncertainty discounts value; Moral uncertainty invites portfolio diversification.

  *   **The Scale Constraint (Clause 4):**
      *   **Case 7:** Forced the marginal return rule. Distinguishes the "small grant" opportunity from the "large grant" opportunity as separate decisions.

  ---

  ### 3. Unwelcome Verdicts

  Here are four cases where applying this principle yields a verdict that may feel intuitively wrong or uncomfortable, demonstrating where the principle "bites."

  1.  **The "Boring Truth" Case:** A program proposes to verify a mundane empirical fact (e.g., accurate census data in a stable country) that is neglected purely due to an *Attention Gap* (ND = Attention Gap). It has high Direct Value, low Displacement, and no Stigma.
      *   **Verdict:** **Fund.** (CM = 1.0).
      *   **Unwelcome Aspect:** It lacks the "heroic" quality of correcting a market failure (Case 3). It feels like paying for basic government function, yet the principle demands it if the marginal return is high enough.
  2.  **The "Repugnant Moral Pluralism" Case:** A program advocates for a moral view you find distasteful (e.g., strong speciesism) but which holds 30% confidence in the broader moral landscape. You are 30% confident it is *wrong*, meaning 70% confident it is *right* (or vice versa).
      *   **Verdict:** **Fund.** (UT = Moral, treat as portfolio weight).
      *   **Unwelcome Aspect:** Case 8 implies funding moral views you aren't fully sold on. This extends to funding views you actively oppose, provided you assign them non-zero credence. The principle forbids moral certainty from vetoing diversification.
  3.  **The "Coordination Trap" Case:** A program solves a coordination problem (ND = Market Failure), but the solution requires five other funders to commit simultaneously. You cannot verify their commitment ex-ante.
      *   **Verdict:** **Fund.** (CM = 1.5).
      *   **Unwelcome Aspect:** The principle assumes *Market Failure* is an opportunity. But if the failure is a multi-polar trap you cannot solve alone, funding this may be throwing money into a void. The principle risks over-valuing "coordination" causes that are actually impossible for a single actor to fix.
  4.  **The "Fast Follower" Case:** A program is highly neglected now, but you know a large institutional funder is scheduled to review the area in six months. DP is currently low, but will be 1.0 soon.
      *   **Verdict:** **Fund.** (DP is calculated at decision time).
      *   **Unwelcome Aspect:** This encourages "bridge funding" that may create dependency. If the institutional funder decides *not* to pick it up after your grant, you have created a cliff. The principle values additionality now, ignoring the sustainability risk of temporary additionality.

  ---

  ### 4. Incompatibilities and Trade-offs

  The principle cannot fully accommodate **Case 8** without importing a specific meta-ethical commitment that is not self-evident.

  **The Conflict:**
  Case 8 treats Empirical Uncertainty (is the baseline rate X?) and Moral Uncertainty (does group Y count?) as fundamentally different categories. The principle codifies this by discounting the former and diversifying the latter.
  However, many philosophical positions hold that moral claims *are* empirical claims (e.g., about well-being or preference satisfaction). If morality is empirical, the distinction collapses. If you treat moral uncertainty as empirical, you should discount Case 8's second program just like the first.

  **Which Member to Abandon?**
  If forced to choose, you should abandon the **Moral Uncertainty Exception** (the second half of Case 8).
  *   **Reasoning:** Treating moral uncertainty as a license to fund regardless of confidence creates a "value pump" where any fringe moral view gets funding simply by existing. It insulates moral claims from evidence.
  *   **What You Lose:** You lose the ability to act as a "pluralist patron." You become a "truth-seeker" only. This might reduce your ability to support novel ethical frameworks that haven't yet gained traction (like early animal welfare arguments).
  *   **Why Simpler:** Collapsing Moral and Empirical uncertainty into a single "Confidence Discount" simplifies the principle significantly. It removes the need for the funder to adjudicate whether a claim is "moral" or "empirical," which is often a disputed boundary itself.

  **Regarding Cases 3 and 4:**
  The principle *successfully* accommodates the 3/4 split via the **Consensus Deference Filter**. It does not require abandoning either. The complexity is not ad hoc; it relies on the *diagnosis* of the neglect, not the neglect itself. This is a robust distinction (Bias vs. Constraint) rather than bookkeeping.

  **Regarding Cases 5 and 6:**
  The principle accommodates both via the **Leverage Mechanism** clause. The complexity here is necessary: "Signaling" is a real economic concept distinct from "Catalytic Mechanism." Distinguishing them prevents funding vanity projects.

  ---

  ### 5. Game-Theoretic Stability

  The principle is **not stable** under simultaneous application by multiple funders who share it. It generates a race that dissolves the feature it looks for.

  **The Mechanism of Instability:**
  The principle's core "alpha" comes from the **Consensus Deference Filter**, specifically the *Market Failure* classification (Case 3). It tells you to fund where others are irrationally staying away (due to stigma, etc.).
  *   **Scenario:** If ten funders all adopt this principle, they will all identify the same "Stigmatized but Tractable" cause area.
  *   **Result:** The area ceases to be neglected. The *Market Failure* is corrected by the influx of capital.
  *   **Consequence:** The CM (Consensus Multiplier) for that area drops from 1.5 to 1.0 (Attention Gap) or lower (if it becomes crowded). The "arbitrage" opportunity vanishes.

  **The Race Dynamic:**
  This creates a **first-mover advantage**. The principle implicitly instructs you to find market failures *before* other rational actors find them. If everyone reasons this way, you enter a race to identify stigma-based opportunities.
  *   **Case 1 & 10 Implication:** You noted that neglectedness is a property of your *position* relative to others. If everyone uses this principle, "Neglect" becomes a transient state.
  *   **Stability Check:** The principle works well for a *singleton* funder or a small cartel. It fails as a universal norm. If everyone defers to consensus *unless* they detect bias, and everyone detects bias in the same places, the "deference" mechanism breaks down.

  **Recommendation for Stability:**
  To make the principle stable, you must add a **Coordination Clause**: "Before applying the Consensus Multiplier, estimate how many other rational actors are likely to apply this same principle to this cause."
  *   If > 1 other actor is likely to identify the same Market Failure, reduce the CM.
  *   This acknowledges that "Epistemic Alpha" is a zero-sum resource in efficient markets. You are not just funding the program; you are funding your *speed of insight* relative to your peers.
