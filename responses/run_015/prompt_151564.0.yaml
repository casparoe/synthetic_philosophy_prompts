  Reconstruction of the implicit theory of diachronic authority

  The practice presupposes a normative hierarchy of temporal selves, assuming the "remitted self" possesses a privileged epistemic and authoritative stance regarding the patient's true interests. This stance outweighs the contemporaneous preferences of the "symptomatic self." Metaphysically, this requires a conception of personal identity that prioritizes psychological continuity of *values* over immediate cognitive capacity. It treats the patient not as a series of discrete temporal slices, each sovereign in its moment, but as a single persisting agent whose life narrative holds greater weight than episodic consent.

  Strictly, the practice requires that personal identity persists sufficiently across episodes to justify binding obligations. It demands that autonomy is diachronic, not merely synchronic. The "self" that signs the directive must be the same moral agent as the "self" refusing treatment, yet the former holds legislative power. Think of the remitted self as a constitution-maker and the symptomatic self as a government operating under that constitution. This implies the later self's sovereignty is limited by the prior agreement. This requires a view where autonomy is exercised *over time*, not just *in time*. The practice assumes that the values held in remission are the "true" values, while symptoms represent an alien intrusion. This is a substantive view of autonomy. This transforms autonomy from a right of refusal into a right of planning, where the plan survives the planner's temporary opposition.

  However, specific metaphysical models merely fit well rather than being strictly required. It aligns with a "narrative identity" view, where authenticity is defined by coherence with long-term goals. It does not strictly require a four-dimensionalist ontology; it only requires that the law recognizes the earlier self's judgment as more authentic. The core commitment is that mental illness creates a specific kind of distortion that undermines the *authenticity* of the symptomatic self's refusal, even if *capacity* appears intact. Thus, the practice rests on a distinction between procedural capacity and substantive authenticity, granting the former self authority to define the latter's best interests based on shared identity. The law assumes the remitted self knows the patient's "true" welfare better than the symptomatic self knows their current desire.

  Rival frameworks and underdetermination

  A four-dimensionalist (perdurantist) framework accommodates the practice naturally: the patient is a spacetime worm, and the earlier temporal part can constrain later parts to maximize the welfare of the whole entity. Here, the directive is an internal coordination mechanism. Conversely, a discontinuity model justifies the practice by arguing the symptomatic self is psychologically severed from the remitted self; the earlier self overrides the later not because they are the same, but because the later self is effectively a stranger acting under distortion. The institution remains silent on whether the symptomatic self is the *same* person acting irrationally or a *different* psychological entity lacking full standing.

  A strict presentist or momentary-autonomy view struggles to justify the practice. If sovereignty resides exclusively in the present slice, a past signature cannot override current refusal unless harm principles intervene. However, the practice could still be accommodated if presentism accepts that "capacity" is assessed diachronically. If the current slice is deemed incapable due to illness-induced distortion (despite apparent competence), presentism yields to paternalism.

  The practice is philosophically underdetermined. It functions regardless of whether the symptomatic self is viewed as a compromised version of the same agent or a distinct psychological phase. The legal mechanism relies on the *status* of the illness rather than a specific metaphysics of persistence. It only requires that the law privileges the remitted state's valuation of welfare over the symptomatic state's valuation of liberty. Thus, rival theories converge on the same operational outcome: the remitted self's instructions prevail, whether due to identity continuity or protective intervention against a distorted agent. The law does not adjudicate the metaphysics; it adjudicates the authority. Consequently, the legal system avoids the metaphysical debate entirely. It does not need to prove the selves are identical, only that the earlier self's judgment is legally superior. This operational agnosticism allows the practice to survive philosophical scrutiny from multiple angles, as long as the outcome supports clinical intervention.

