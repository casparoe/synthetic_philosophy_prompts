  I'm a journalist covering science and ideas, and I'm examining the philosophical architecture behind psychiatric advance directives—specifically, the clinical and legal practice in several jurisdictions that permits a patient in remission from a cyclical mental illness to sign a binding instruction authorizing involuntary medication or hospitalization during a future episode, even when that future self demonstrates apparent decision-making capacity and explicitly refuses care. The institution treats an earlier temporal stage of the patient as having legislative authority over a later stage that is, by ordinary clinical metrics, a competent agent.

  What implicit theory of personal identity and diachronic authority does this practice presuppose? Reconstruct whether it requires a four-dimensionalist conception of the self—treating the remitted and the symptomatic stages as parts of one persisting entity whose earlier preferences legitimately bind the whole—or whether it instead depends on a discontinuity model in which the symptomatic self is sufficiently altered in values, reasoning, and interests to be overridden by the earlier "authentic" self. Can a strictly presentist or momentary-autonomy view of practical authority accommodate this practice, or does honoring the directive only make sense if we reject the idea that sovereignty is confined to the present temporal slice?

  Further, is the practice philosophically consistent with the same legal system's refusal, in contract and tort doctrine, to enforce agreements entered during temporary cognitive distortion or severe emotional duress? Does it quietly presuppose that mental-illness-related psychological fluctuation belongs to a categorically different kind of temporary incapacity—one that justifies binding the future self—while other forms of transient impairment do not?

  Finally, assess whether the practice is philosophically underdetermined: could rival theories of personal persistence and agency each license it, or does it genuinely commit us to one metaphysical picture?

  Please structure your response exactly as follows:

  Reconstruction of the implicit theory of diachronic authority: approximately 350 words. Identify the core metaphysical and normative commitments, and clearly distinguish what the practice strictly requires from what merely fits well with it.

  Rival frameworks and underdetermination: approximately 300 words. Examine whether a four-dimensionalist persistence view, a discontinuity model, and a presentist autonomy view can each justify the practice, and specify where the institution is silent between them.

  Consistency check with adjacent legal doctrines: approximately 250 words. Compare the treatment of psychiatric advance refusal with contract law's handling of temporary incapacity and emotional duress, and diagnose any philosophical tension.

  Verdict on necessary philosophical change: approximately 200 words. State what would have to change in the practice—if anything—if we adopted a view that denies cross-temporal authority over stages of pronounced psychological discontinuity.
