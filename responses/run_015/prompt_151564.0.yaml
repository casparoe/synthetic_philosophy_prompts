  There is a philosophical tension. Standard contract law protects the agent from their own impaired moments by voiding agreements. PADs protect the agent from their impaired moments by enforcing prior agreements. This implies mental illness is categorically distinct from other duress. Intoxication voids a contract; psychosis enforces a prior directive. This presupposes that mental illness uniquely compromises authenticity in a way that other transient states do not, or that the state's interest in preventing harm outweighs bodily integrity more strongly in psychiatric contexts. The inconsistency reveals a special status for psychiatric suffering, treating it as an enemy of the self rather than a condition of the self. Unlike a drunk contractor who is protected from their signature, the psychotic patient is bound by their signature. This distinguishes psychiatric incapacity as a unique legal category where the past self retains sovereignty over the future impaired self, whereas in tort or contract, the impaired self is protected from the past self's commitments. This asymmetry highlights a unique legal exceptionalism regarding mental health.

  Verdict on necessary philosophical change

  If we adopt a view denying cross-temporal authority over psychologically discontinuous stages, the binding nature of psychiatric advance directives must collapse. The practice would shift from enforceable mandates to advisory evidence of prior preference. Clinicians could consider the directive but could not override a contemporaneous refusal from a patient meeting standard capacity thresholds. This would require decoupling the legal validity of the directive from the metaphysical assumption that the remitted self owns the symptomatic self.

  Instead of pre-commitment, the system would rely on substituted judgment or best interests standards determined at the time of crisis, potentially weighing the prior directive heavily but not absolutely. This acknowledges the symptomatic self's sovereignty while respecting the past self's voice. It demands a higher threshold for involuntary treatment, requiring immediate danger rather than mere deviation from prior instructions. Ultimately, rejecting diachronic authority forces the law to treat the symptomatic patient as a rights-bearing agent in the present, prioritizing current liberty over past consistency, fundamentally altering the balance between safety and autonomy in psychiatric care. The Ulysses contract would become a mere letter of intent. Consequently, the protective function of the directive would diminish, potentially increasing relapse rates but preserving immediate agency.
