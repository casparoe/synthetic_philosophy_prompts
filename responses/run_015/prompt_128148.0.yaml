answer: |-
  ### Q&A Prep Sheet: Metaphysics-of-Biology Workshop

  **Strategy Note:** Your strength is empirical authority; your vulnerability is ontological categorization. The metaphysicians will try to absorb your "standing wave" into existing categories (events, processes, stuff). The philosophers of biology will worry you are over-generalizing from cellular turnover to organismal identity. Do not defend the *metaphor* of the wave; defend the *ontological claim* that dynamic stability is a sufficient condition for identity without material persistence.

  #### Up-Front Concessions
  *Say these in your opening or early Q&A to disarm hostility:*
  1.  **Concede Variance:** Acknowledge that turnover rates vary wildly across tissues (e.g., neurons vs. intestinal lining). Clarify that your claim relies on *system-wide* proteostatic networks, not uniform molecular replacement.
  2.  **Concede the Metaphor:** Admit "standing wave" is a heuristic. You are not claiming organisms are literally waves, but that they share the *ontological structure* of dynamic stability patterns.
  3.  **Concede Scope:** State clearly that you are not solving the Statue/Clay problem for *artifacts*. You are arguing that organisms belong to a different ontological category where the puzzle does not arise.

  ---

  #### The Objections (Ordered by Likelihood and Damage)

  **1. The "Constitution Relation Remains" Objection**
  *   **Likelihood:** Very High | **Damage:** High
  *   **The Objection:** "You claim the Statue/Clay puzzle dissolves because the material changes. But at any instant *t*, there is still a mass of matter constituting the organism. Does that mass coincide with the organism at *t*? If yes, you still have two things in the same place (the mass and the organism) with different modal properties (the mass could survive being scattered; the organism cannot). You haven't escaped constitution; you've just made the constituting matter more fluid."
  *   **Quick Reply:** "At instant *t*, the 'mass' is not a viable candidate for identity because it lacks the causal powers of the organism. The matter is only constitutive *in virtue of* participating in the process. Without the metabolic context, it's not 'organism-matter,' it's just chemistry. Constitution requires two viable candidates; here, the matter is ontologically dependent on the process."
  *   **Weakest Point:** You are flirting with denying the existence of the matter itself. If you say the matter only exists *as* part of the process, you risk sounding idealist. Be prepared to admit the matter exists but deny it has *independent sortal identity* in that context.

  **2. The "Sortal Relativity" Objection**
  *   **Likelihood:** High | **Damage:** Medium
  *   **The Objection:** "Identity is sortal-relative. 'Organism' is a sortal that permits material turnover, but 'Aggregate of Molecules' is a sortal that does not. You aren't showing the puzzle dissolves; you're just showing that we privilege the 'Organism' sortal over the 'Matter' sortal. Why does biology get to dictate the dominant sortal?"
  *   **Quick Reply:** "Because the 'Organism' sortal tracks the causal unity. The 'Aggregate' sortal is a retrospective abstraction. In biology, the causal reality is the self-maintaining system. Metaphysics should track causal joints, not just logical possibilities."
  *   **Weakest Point:** This leans heavily on a naturalistic metaphysics that the analytic metaphysicians might reject. They believe logic constrains reality, not just empirical causality.

  **3. The "Process vs. Object" Category Mistake**
  *   **Likelihood:** Medium | **Damage:** Medium
  *   **The Objection:** "A standing wave is an event or a process, not an object. If an organism is like a wave, you are arguing for Process Ontology. But organisms have properties of objects (location, mass, countability). Are you saying organisms don't exist as substances?"
  *   **Quick Reply:** "I am arguing for a 'Process-Substance' hybrid. It is a substance in that it is a countable individual; it is a process in that its persistence conditions are dynamic. We need to expand our category of 'substance' to include dynamically stable systems."
  *   **Weakest Point:** You are asking them to rewrite standard ontology. This is a heavy lift for a workshop paper. They may demand a more rigorous account of how a process can bear properties.

  **4. The "Temporal Parts" Objection (Specific to your 4Dism claim)**
  *   **Likelihood:** Medium | **Damage:** High
  *   **The Objection:** "You argue temporary intrinsics fail because no stage shares all properties with the whole. But a 4Dist doesn't need the stage to share *all* properties, only the relevant intrinsic ones. If the organism at *t* has the property 'weighing 70kg,' and the stage at *t* has 'weighing 70kg,' the argument holds. You're conflating material composition with temporal parthood."
  *   **Quick Reply:** "The property 'weighing 70kg' is not intrinsic to the stage; it's a measurement of the flow through that stage. The stage cannot bear the weight independently of the past and future flow maintaining the structure. The intrinsic properties of the organism are *historical* properties, which a momentary stage cannot possess."
  *   **Weakest Point:** This is technically dense. If they press you on what counts as an "intrinsic" property, you could get bogged down in semantics.

  **5. The "Empirical Variance" Objection (From the PhilBio crowd)**
  *   **Likelihood:** Low (from them) | **Damage:** Medium
  *   **The Objection:** "Turnover rates are not uniform. Some parts of the organism (lens of the eye, certain neurons) persist for a lifetime without turnover. Your 'standing wave' model implies total flux. Doesn't the persistence of these static parts reintroduce the material continuity problem?"
  *   **Quick Reply:** "The *system* maintains the static parts. The lens proteins are maintained by the aqueous humor and metabolic support. Their persistence is parasitic on the turnover of the supporting system. The identity of the whole is determined by the dynamic network, not the static components."
  *   **Weakest Point:** You need to be sure about the biology here. If there are organelles that are truly exempt from proteostatic repair, this reply fails.

  **6. The "Dreaded Objection": Artifact/Biology Disanalogy**
  *   **Likelihood:** Low (but lethal) | **Damage:** Critical
  *   **The Objection:** "If the Statue/Clay problem dissolves for organisms because of material turnover, does it dissolve for a flame? A river? A hurricane? If yes, you've trivialized 'objecthood.' If no, what is the principled difference between a self-maintaining organism and a self-maintaining flame that allows organisms to be substances but not flames? If you can't draw that line, you haven't solved the puzzle; you've just moved it."
  *   **Quick Reply:** "The difference is *teleological closure*. A flame is a dissipative structure driven by external gradients. An organism actively regulates its own boundary conditions and repair mechanisms (autopoiesis). The 'standing wave' of an organism is self-correcting in a way a flame is not. That normative dimension grounds the substance status."
  *   **Weakest Point:** This introduces teleology (purpose/goal-directedness) into metaphysics. Analytic metaphysicians are notoriously allergic to naturalized teleology. If they smell "purpose" without a rigorous account of naturalized function, they will pounce.

  ---

  #### Survival Tips for the Room
  *   **On "Receive":** You mentioned you misspell "receive." Don't worry about it on the whiteboard, but ensure your handout is clean. The metaphysicians will nitpick syntax if they can't find a philosophical error.
  *   **On Jargon:** When they say "supervenience," "haecceity," or "modal profile," pause. Translate it mentally to "depends on," "this-ness," and "possibilities." It is better to ask "Could you rephrase that in terms of persistence conditions?" than to guess and be wrong.
  *   **On the 4Dism Claim:** This is your most controversial philosophical move. If they gang up on it, retreat to the biology: "My primary claim is that the biological data makes the 3D/4D distinction less salient for organisms. Whether that forces 3Dism or a new category is secondary."
  *   **The "Two Cultures" Dynamic:** The 8 metaphysicians will talk to each other. The 2 PhilBio people will watch you. Use the PhilBio people as allies if the metaphysicians get too abstract. "As my colleagues in philosophy of biology might agree, the empirical constraint here is..."

  **Final Advice:** You are the expert on the *turnover*. They are the experts on the *puzzle*. Do not let them talk you out of the biology, but do not pretend the biology solves the metaphysics single-handedly. Your position is that the biology *constrains* the viable metaphysics. Hold that line.
