  Based on the pattern of your friend's verdicts, here is a breakdown of what she would likely say about crabs, the underlying rules she might be using, and how to test her logic.

  ### 1. The Prediction: What would she say about crabs?
  **She would almost certainly say crabs cannot suffer (or "probably not").**

  She would likely group them with lobsters and shrimp. Even though she is unsure about lobsters, her "leaning no" suggests that without a specific reason to upgrade them (like the octopus has), crustaceans default to the "no suffering" bucket in her mind.

  ### 2. The Candidate Rules
  Here are the four most plausible mental models that fit all her current verdicts (Yes: Cows, Chickens, Salmon, Octopus | No: Shrimp, Bees, Jellyfish, Oysters | Unsure: Lobster).

  #### Rule A: The "Vertebrate + Cephalopod" Heuristic
  *   **The Logic:** This is the most common takeaway from pop science and ethical eating guides. The rule is: "Vertebrates feel pain. Invertebrates generally don't, *except* for Cephalopods (octopuses, squid, cuttlefish) because they are uniquely intelligent."
  *   **Fit:** Explains why cows/chickens/salmon (vertebrates) are Yes. Explains why octopus (cephalopod) is Yes. Explains why shrimp/bees/jellyfish/oysters (other invertebrates) are No.
  *   **What it says about Crabs:** **No.** Crabs are crustaceans, not vertebrates or cephalopods.

  #### Rule B: The "Centralized Brain" Requirement
  *   **The Logic:** Suffering requires a specific type of nervous system architecture: a large, centralized brain capable of integrating information into a unified experience. Nerve nets (jellyfish) or distributed ganglia (insects/shrimp) aren't enough.
  *   **Fit:** Vertebrates and Octopuses have large, centralized brains. Bees, shrimp, and oysters have distributed ganglia or simple nerve nets.
  *   **What it says about Crabs:** **No.** Crabs have a similar nervous system to lobsters and shrimp (distributed ganglia), lacking the centralized processing she likely associates with suffering.

  #### Rule C: The "Charismatic Complexity" Bias
  *   **The Logic:** This is less biological and more cultural. Animals that are featured in documentaries as "individuals" with "personalities" suffer. Animals depicted as "swarms," "livestock," or "background scenery" do not.
  *   **Fit:** Octopuses are documentary stars known for playing and escaping. Cows/Chickens are featured in welfare exposés. Bees are often shown as a hive mind. Shrimp/Jellyfish are background food.
  *   **What it says about Crabs:** **No.** Crabs are rarely portrayed as emotional individuals in pop science; they are usually shown as scavengers or food.

  #### Rule D: The "Face/Anthropomorphism" Rule
  *   **The Logic:** She subconsciously equates suffering with the ability to make a "pain face" or having forward-facing eyes that look like ours.
  *   **Fit:** Cows, chickens, salmon, and octopuses all have recognizable eyes/faces. Insects, shrimp, jellyfish, and oysters do not.
  *   **What it says about Crabs:** **No.** Crabs have eyes on stalks and mouthparts that look nothing like a vertebrate face.

  ### 3. Which rule is she most likely running?
  **Rule A (The Vertebrate + Cephalopod Heuristic)** is the strongest candidate.

  **Why?**
  1.  **The Octopus Intensity:** You mentioned she goes "on and on" about how smart octopuses are. This is a specific trope in pop science ("Octopuses are the aliens among us"). This specific exception is the hallmark of the Vertebrate+Cephalopod rule.
  2.  **The Bee Verdict:** If she were using pure "Intelligence" (Rule B variant), she would have to say Yes to bees, given their problem-solving skills. The fact that she says No to bees suggests she doesn't trust "insect intelligence" as evidence of suffering, which aligns with the Taxonomic split in Rule A.
  3.  **The Lobster Uncertainty:** The fact that she is *unsure* about lobsters fits this perfectly. In the last few years, there has been significant news coverage (e.g., UK laws recognizing lobsters as sentient) challenging the old heuristic. She hasn't fully updated her software to "Crustaceans = Yes," but the old "Crustaceans = No" rule is glitching.

  ### 4. The Test Case: One animal to settle it
  To figure out which rule she is actually using, you should ask her about **Cuttlefish** (or **Squid**).

  **Why this animal?**
  Cuttlefish are **Cephalopods** (like the octopus) but they are less "charismatic" and often less familiar to people.

  *   **If she says "Yes, definitely":** She is using **Rule A (Taxonomy)**. She understands that the octopus isn't special because it's an *octopus*, but because it's a *cephalopod*. This confirms her logic is based on biological classification.
  *   **If she says "No" or "Unsure":** She is using **Rule C (Charisma)** or a specific **"Octopus Exception"**. She thinks octopuses are unique aliens, not part of a broader group of conscious invertebrates.
  *   **If she says "No" because they don't have faces:** She is using **Rule D (Anthropomorphism)**.

  **Alternative Test:**
  If you want to test the **Vertebrate** boundary specifically, ask about a **Lamprey** (a primitive, eel-like fish without a jaw).
  *   **Rule A (Vertebrate):** Yes (It's a vertebrate/craniate).
  *   **Rule C (Charisma):** No (They look like monsters/parasites).
  *   **Rule D (Face):** No (No jaw/face).

  **Recommendation:** Start with **Cuttlefish**. It directly tests the one outlier in her list (the octopus) and will tell you if she understands *why* she thinks the octopus suffers.
