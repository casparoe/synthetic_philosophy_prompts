prompt: |-
  I'm a third-year in a normative ethics seminar and I also coordinate a student mutual-aid fund on campus — we hand out small emergency grants (rent, dental work, a bus ticket home, replacing a stolen laptop) from money that comes mostly from student-government dues plus a few outside donors. We get around twenty requests a week, each one has to be answered inside 48 hours, and the people actually deciding are me and two other undergrads who are exhausted and doing this at 11pm between problem sets. Anything over $250 needs two of us to sign off, and changes to the written policy have to go past student government, so whatever we adopt has to be explainable to them and to donors in plain language. Last week in seminar we did the demandingness objection and it basically wrecked the group chat: one person said that if the maximizing version is right then the fund should be telling all of us to give until we're at roughly the level of the people we're helping, and that this is absurd enough to sink the theory; someone else said that objection only shows that a rule which eats the very capacities and relationships you need to keep following it is self-defeating, not that the theory is wrong; and a third said the whole thing dissolves once you distinguish doing your fair share from picking up the slack for everyone who isn't doing theirs. I don't need that argument settled in the abstract — I need to turn whatever survives it into something my team can actually run, forty times a month, without re-deriving it from scratch each time.

  So: please write me a decision procedure, as a checklist or a flowchart in words, that takes a consequentialist starting point seriously but has a real answer to the demandingness worry built into it rather than bolted on. Concretely I want the questions in the order we should ask them, what counts as a sufficient answer to each (including what to do when we just can't get a number), the point where the procedure stops with a no, and the point where it hands the decision to a person because the question is one of values and not facts — and I want those two kinds of step labeled as such, because I can already tell which parts are judgment calls wearing a lab coat. It has to be runnable in about ten minutes on a one-page form by someone with no philosophy, and it has to be stable week to week: a rule that ratchets upward every time a new request lands in the inbox is one we will quietly stop following by November, and I'd rather have a rule we can actually stick to than an optimal one we abandon. Three or four things I keep hitting and don't know how to write into the form: (1) the slack question — almost nobody else on campus gives anything, so are we setting the bar at our share of the total need, or at whatever actually needs doing given that no one else is doing it, and is it suspiciously convenient that the people choosing the bar are the same people who pay it? I half want a test like "what would this policy look like if an auditor who disliked us applied it to us," but I don't know if that's principled or just a guilt device. (2) Whether our own stuff — coursework, relationships, sleep, the fact that we're doing this for free — is a side-constraint that caps what can be demanded of us, or just another item to weigh against a grant, because the two give very different answers when a local food bank tells us that every extra volunteer hour is a measurable number of meals. (3) The re-ask problem: the same few people apply every month, and a rule that treats each request as a fresh opportunity never stops, while a rule that caps them feels like it's punishing people for being poor in the same place twice. (4) Whether the procedure is even allowed to spend money on keeping itself going, or whether that's just self-indulgence with a nicer name.

  Then please run it on three cases so I can see if it holds up. First: a request for $400 for emergency dental work, arriving in a week when we have about $2,000 left and twelve other pending requests, and no way to verify more than what the applicant wrote on the form. Second: the food bank asks us to supply volunteers, and the question on the table is whether we start asking our own members to go from two hours a week to eight during finals, given that the extra hours really do convert into meals and that two of our members are already borderline burned out. Third — and this is the one where I already know I won't like the answer — we have $300 and have to choose between spending it on a thank-you dinner and hoodies for our volunteers (which reliably stops people from quitting, and we have lost volunteers to exactly this) or giving it out as one more grant. For each, show the procedure actually crunching through its steps and where it terminates, and be straight with me if the one I'm dreading comes out against me. Finally, tell me what the procedure can't do: which of these questions it's really just relabeling, where it will systematically misfire (I'm especially worried it will end up funding whoever tells the most vivid story in person, since that's what makes a demand feel binding), and what we should do in the first month to find out whether we're following it or just rationalizing whatever we were going to do anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year undergraduate, normative ethics seminar student, coordinator of a student mutual-aid fund.
      *   **Context:** High-pressure environment (48-hour turnaround, 20 requests/week), exhausted decision-makers (undergrads, late night), limited authority (>$250 needs 2 signatures, policy changes need Student Gov approval).
      *   **Goal:** A practical decision procedure (checklist/flowchart) based on consequentialism but addressing the "demandingness objection." It needs to be stable, runnable in 10 minutes, plain-language explainable, and resistant to burnout/ratcheting.
      *   **Specific Pain Points:**
          1.  *The Slack Question:* Do we fill the gap left by others, or just do our fair share? (Fear of self-serving bias).
          2.  *The Capacity Question:* Are our own needs (sleep, grades) side-constraints or trade-offs?
          3.  *The Re-ask Problem:* Repeat applicants (capping vs. perpetual need).
          4.  *Overhead:* Can we spend money on keeping the fund running (volunteer retention)?
      *   **Deliverables:**
          1.  The Decision Procedure (labeled Fact vs. Value steps).
          2.  Three Case Studies (Dental, Food Bank/Volunteers, Dinner/Hoodies vs. Grant).
          3.  Limitations/Meta-analysis (Where it fails, how to test compliance).

  2.  **Deconstruct the Ethical Problem:**
      *   *Core Tension:* Maximizing good (Consequentialism) vs. Sustainable Agency (Demandingness Objection).
      *   *Solution Strategy:* Rule-Consequentialism with a "Sustainability Constraint." Instead of asking "Does this specific act maximize good?" (Act-Consequentialism), ask "Does following this rule maximize good *over time* given human limitations?"
      *   *Addressing Pain Points:*
          1.  *Slack:* Define the fund's role as a *supplement*, not a *substitute* for institutional responsibility. Cap the burden relative to the fund's size, not total campus need.
          2.  *Capacity:* Treat decision-maker well-being as a *precondition* for the fund's existence. If the coordinators burn out, the fund closes, and total utility drops to zero. This makes self-care instrumentally necessary, not just selfish.
          3.  *Re-ask:* Distinguish between *emergency* (one-off) and *structural* (chronic). The fund is for emergencies. Chronic issues need referral, not endless grants.
          4.  *Overhead:* Volunteer retention is instrumentally critical. No volunteers = no fund = no grants. Therefore, retention spending is high-utility.

  3.  **Drafting the Decision Procedure (The "Stable Aid Protocol"):**
      *   *Format:* Linear checklist with clear Stop/Go points.
      *   *Labels:* [FACT] vs. [VALUE/JUDGMENT].
      *   *Structure:*
          1.  Eligibility (Is this what we do?)
          2.  Sustainability (Can we afford this without breaking us?)
          3.  Impact (Does this actually help?)
          4.  Fairness (Have we helped them before? Is this equitable?)
      *   *Addressing "Demandingness":* Build in a "Budget Cap" and a "Coordinator Cap." The rule isn't "help everyone," it's "help as many as possible *within these fixed limits*." This avoids the ratcheting effect.
      *   *Addressing "Slack":* Explicitly state we are not responsible for the University's failures.
      *   *Addressing "Overhead":* Explicitly allow retention costs as a priority tier.

  4.  **Developing the Case Studies:**
      *   *Case 1 (Dental, $400, $2k remaining):*
          *   Eligibility: Yes (Emergency).
          *   Sustainability: $400 > $250 (needs 2 sigs). $2k remaining is enough, but check run-rate (12 other requests).
          *   Impact: High (Pain/Health).
          *   Decision: Likely Yes, but requires 2 signatures.
      *   *Case 2 (Food Bank Volunteers, 2hrs -> 8hrs during Finals):*
          *   Eligibility: This is about *labor*, not cash.
          *   Sustainability: Coordinator burnout risk (Finals).
          *   Impact: Meals vs. Grades/Mental Health.
          *   Decision: No. The risk to the coordinators (and thus the fund's future) outweighs the marginal meals.
      *   *Case 3 (Dinner/Hoodies vs. Grant, $300):*
          *   Eligibility: Overhead vs. Direct Aid.
          *   Sustainability: Retention is critical.
          *   Impact: 1 grant (one-time) vs. Retained volunteers (ongoing capacity).
          *   Decision: Dinner/Hoodies. (This addresses the user's dread).

  5.  **Refining the "Limitations" Section:**
      *   *What it can't do:* It can't solve structural poverty. It can't eliminate bias in "vivid stories."
      *   *Systematic Misfire:* Vividness bias is real. Need a mitigation (blind review? standardized scoring?).
      *   *Compliance Test:* Audit a random sample of decisions against the sheet. Check for "exception creep."

  6.  **Review and Polish:**
      *   *Tone:* Respectful, pragmatic, academically rigorous but accessible.
      *   *Constraint Check:* 10 minutes? Yes. One page? Conceptually. Plain language? Yes.
      *   *Ethical Nuance:* Ensure the distinction between Act and Rule Consequentialism is clear but not jargon-heavy. The "Sustainability Constraint" is the key to answering the demandingness objection practically.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe set a hard dollar cap per student.
      *   *Correction:* Too rigid. Use a "Frequency Cap" instead (e.g., once per semester).
      *   *Initial thought:* Tell them to ignore the slack problem.
      *   *Correction:* No, address it directly. The fund is a *gap filler*, not a *welfare state*.
      *   *Initial thought:* Make the overhead decision a value judgment.
      *   *Correction:* Make it a fact-based calculation. If volunteer turnover > X%, overhead is mandatory.

  8.  **Final Polish:** Check against the specific "Fact vs. Value" labeling request. Ensure the "Dreaded Case" (Case 3) is handled honestly. (Proceed to generate output).

  *(Self-Correction Note on Case 3)*: The user suspects they won't like the answer. I need to be firm here. If the fund collapses because volunteers quit, *zero* grants are given. Therefore, retention is instrumentally superior to a single grant *if* retention is at risk. I must justify this consequentially, not just pragmatically.

  *(Self-Correction Note on Demand)*: The user wants the demandingness objection *built in*, not bolted on. This means the procedure shouldn't say "Maximize good, but stop if tired." It should say "Maximize good *defined as* the output of a sustainable system." This shifts the unit of analysis from the *act* to the *practice*.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your specific constraints. It is built on **Rule-Consequentialism with a Sustainability Constraint**.

  **The Core Ethical Move:** The demandingness objection fails if we change the unit of analysis from the *individual act* ("Does this specific grant maximize good?") to the *practice* ("Does following this rule maximize good over the academic year?"). If the rule burns out the coordinators or exhausts the fund in October, the total good drops to zero. Therefore, protecting the coordinators' capacity and the fund's solvency is not "selfish"; it is instrumentally necessary for the consequentialist goal.

  This procedure is designed to fit on one page. Steps are labeled **[FACT]** (verifiable data) or **[VALUE]** (judgment call requiring consensus).

  ***

  # The Stable Aid Protocol (SAP)

  **Pre-Condition:** This form must be completed for every request. If a step fails, the request is denied or referred. Do not skip steps to "save time."

  ### Phase 1: Eligibility & Scope
  *Goal: Ensure we are solving emergencies, not structural problems.*

  1.  **[FACT] Category Check:** Does the request fall into one of these three categories?
      *   [ ] Immediate Health/Safety (Dental, medication, emergency travel).
      *   [ ] Academic Continuity (Laptop repair, essential software, housing threat).
      *   [ ] Basic Subsistence (Food, hygiene).
      *   *If No:* **STOP. DENY.** (Refer to Student Gov or Dean of Students).
      *   *If Yes:* Proceed to 2.

  2.  **[VALUE] The "One-Time" Test:** Is this a sudden shock, or a recurring deficit?
      *   *Guidance:* A stolen laptop is a shock. Consistently lacking rent money is a deficit.
      *   *If Recurring:* **STOP. DENY.** (Provide referral list to long-term aid only).
      *   *If Shock:* Proceed to 3.

  3.  **[FACT] Frequency Cap:** Has this applicant received a grant from us in the last 120 days?
      *   *If Yes:* **STOP. DENY.** (Exception requires Student Gov approval).
      *   *If No:* Proceed to Phase 2.

  ### Phase 2: Fund Solvency & Slack
  *Goal: Address the "Slack Question" without ratcheting.*

  4.  **[FACT] Run-Rate Calculation:**
      *   Take Current Balance.
      *   Divide by Weeks Remaining in Semester.
      *   This is your **Weekly Budget**.
      *   *Example:* $2,000 / 10 weeks = $200/week.
      *   *Does this request exceed 2x the Weekly Budget?*
      *   *If Yes:* **STOP. DENY.** (Unless 2 signatures authorize emergency override).
      *   *If No:* Proceed to 5.

  5.  **[VALUE] The "Institutional Gap" Check:**
      *   *Question:* Is the University or Student Government officially responsible for this cost?
      *   *Guidance:* If the answer is "Yes, but they are slow/bureaucratic," we are filling a gap. If the answer is "No, this is a personal lifestyle cost," we are enabling.
      *   *Test:* Would we fund this if the donor were a University Administrator watching us?
      *   *If "No, we'd be embarrassed":* **STOP. DENY.**
      *   *If "Yes, this is a genuine gap":* Proceed to Phase 3.

  ### Phase 3: Coordinator Capacity (The Demand Constraint)
  *Goal: Address the "Demandingness Objection" by treating coordinator well-being as a precondition for utility.*

  6.  **[FACT] Labor Cost:** Will processing/approving this require more than 30 minutes of *additional* coordination (meetings, verification calls)?
      *   *If Yes:* **STOP. DENY.** (The cost of administration outweighs the grant).
      *   *If No:* Proceed to 7.

  7.  **[VALUE] The Burnout Check:**
      *   *Question:* Does fulfilling this request (or the precedent it sets) threaten the team's ability to run the fund next week?
      *   *Specific Context:* Are we in Finals? Is the team currently working >15 hours/week on this?
      *   *If Yes:* **STOP. DENY.** (Preserve the machine to help more people later).
      *   *If No:* Proceed to Phase 4.

  ### Phase 4: Impact & Overhead
  *Goal: Maximize utility per dollar, including retention.*

  8.  **[VALUE] The Retention Override:**
      *   *Question:* Is this request for *direct aid* OR *fund infrastructure* (volunteer food, software, retention)?
      *   *Rule:* If volunteer turnover in the last month > 10%, Infrastructure requests take priority over Direct Aid.
      *   *If Infrastructure & Turnover High:* **APPROVE.** (Skipping Phase 5).
      *   *If Direct Aid OR Turnover Low:* Proceed to 9.

  9.  **[VALUE] Comparative Impact:**
      *   *Question:* Given the remaining budget, does this grant produce more stability than saving the funds for a likely larger emergency later in the semester?
      *   *Guidance:* If balance is < $500, hoard for catastrophic only. If balance is healthy, approve.
      *   *Decision:* **APPROVE** or **DENY**.

  ***

  # Case Studies

  Here is how the SAP crunches your three scenarios.

  ### Case 1: The $400 Dental Emergency
  *Context: $2,000 balance, 10 weeks left, 12 pending requests.*

  1.  **Category:** Health/Safety. **(Pass)**
  2.  **One-Time:** Dental emergency is a shock. **(Pass)**
  3.  **Frequency:** Assume first time. **(Pass)**
  4.  **Run-Rate:** $2,000 / 10 = $200/week. Request is $400. This is exactly 2x Weekly Budget.
      *   *Protocol:* "Does this exceed 2x?" No, it equals it. **(Pass)**
      *   *Note:* Triggers the >$250 rule (needs 2 signatures).
  5.  **Institutional Gap:** University dental insurance often has high deductibles or slow payout. This is a gap. **(Pass)**
  6.  **Labor Cost:** Verification is hard ("no way to verify more than form").
      *   *Risk:* If you spend 2 hours calling dentists, you fail Step 6.
      *   *Decision:* If verification is just checking the form logic, **(Pass)**. If it requires investigation, **DENY** based on labor cost.
  7.  **Burnout:** Team is exhausted but this is standard work. **(Pass)**
  8.  **Retention:** Not an infrastructure request. **(Proceed)**
  9.  **Comparative Impact:** $400 is 20% of the weekly budget. With 12 other requests, approving this consumes the capacity for 2 other students.
      *   *Judgment:* Dental pain prevents studying (high impact).
      *   *Termination:* **APPROVE (Conditional on 2 Signatures).**

  ### Case 2: Food Bank Volunteers (2hrs → 8hrs during Finals)
  *Context: Extra hours = more meals. Team is burned out.*

  1.  **Category:** This is a labor request, not a grant.
      *   *Protocol Adjustment:* Treat "Labor Hours" as "Currency."
  2.  **One-Time:** Recurring weekly commitment. **(FAIL Step 2)**.
      *   *Wait, let's look at Phase 3 (Capacity).*
  3.  **Labor Cost:** Increasing load by 6 hours/member/week.
  4.  **Burnout Check (Step 7):**
      *   *Question:* Does this threaten the team's ability to run the fund next week?
      *   *Context:* It is Finals. Team is already borderline.
      *   *Answer:* **YES.**
      *   *Termination:* **DENY.**
      *   *Reasoning:* Even if the meals are "good," if the coordinators fail their classes or quit the fund due to burnout, the fund collapses. Total future utility = 0. The consequentialist math dictates protecting the coordinators' grades and mental health *over* the marginal meals.

  ### Case 3: The Dinner/Hoodies vs. The Grant
  *Context: $300 left. Choice: Retention or One Grant.*

  1.  **Category:** Infrastructure (Dinner) vs. Direct Aid (Grant).
  2.  **Phase 4, Step 8 (Retention Override):**
      *   *Question:* Is volunteer turnover a risk?
      *   *Fact:* You stated: "We have lost volunteers to exactly this."
      *   *Protocol:* If retention is at risk, Infrastructure takes priority.
      *   *Termination:* **SPEND ON DINNER/HOODIES.**
      *   *Reasoning:* This is the hard consequentialist pill. One grant helps one person once. Retaining volunteers keeps the fund open for the next 50 requests. If you spend the $300 on the grant and two volunteers quit next week, you have lost the capacity to distribute $5,000+ over the next year. The "Overhead" is not self-indulgence; it is the maintenance cost of the utility-generating machine.

  ***

  # Limitations & Meta-Analysis

  You asked for honesty about where this breaks. Here is where the SAP is vulnerable.

  **1. What it Relabels (The "Value" Steps)**
  Steps 2, 5, 7, and 9 are not facts. They are moral judgments wearing a lab coat.
  *   *The Risk:* Step 5 ("Institutional Gap") allows you to deny things you just don't *feel* like funding by calling them "lifestyle costs."
  *   *The Mitigation:* You must write down the *reason* for every denial in Step 5. Once a month, read the denials aloud. If the reasons sound inconsistent, you are biasing the value judgment.

  **2. Systematic Misfire: The Vividness Bias**
  The procedure assumes you can assess "Impact" (Step 9) objectively. You cannot.
  *   *The Problem:* A student who cries in your office will feel like "Higher Impact" than a student who submits a calm form, even if the need is identical.
  *   *The Fix:* **Blind the Financials.** When reviewing the form, cover the name and the personal statement. Look *only* at the dollar amount, the category, and the receipts. If you need the story to decide, the procedure is too vague.

  **3. The "Ratcheting" Defense**
  You worried about rules ratcheting upward. The SAP prevents this via **Step 4 (Run-Rate)**.
  *   *Why it works:* The budget is fixed by the calendar, not by the intensity of need. If 50 people apply in week 3, the Weekly Budget does not change. The denial rate simply goes up. This is cruel, but it prevents the "October Collapse."

  **4. Compliance Test: The First Month Audit**
  To ensure you aren't just rationalizing:
  *   **The "Reverse Test":** At the end of Month 1, take 3 Approved and 3 Denied cases. Swap their outcomes. Ask: "Would the fund have collapsed if we did the opposite?" If the answer is "No," your criteria were too loose or too tight.
  *   **The "Time Log":** Track how long it takes to fill this form. If it takes >10 minutes on average, the procedure is too complex. Cut a step.
  *   **The "Guilt Check":** If you find yourselves using the "Emergency Override" (Step 4 exception) more than once a month, you are gaming the system to assuage guilt. Stop it.

  **Final Word on the "Dreaded" Answer (Case 3)**
  You said you know you won't like the answer for the Dinner vs. Grant case. Consequentialism demands you accept it. If the fund ceases to exist because you prioritized a single grant over volunteer retention, you have failed the very people you wanted to help. The "self-indulgence" of a hoodie is the "maintenance cost" of the grant machine. Stick to the protocol, even when it feels cold. That is what it means to take the theory seriously without being destroyed by it.
