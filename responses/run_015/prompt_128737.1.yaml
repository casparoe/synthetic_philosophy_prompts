rical counterfactuals are fragile and it is hard to prove that a policy would have been different absent the heritability argument. The kind of evidence that would shift my overall number the most would be archival records or internal memos from public health agencies or legislative bodies explicitly citing high heritability estimates as the primary reason for rejecting or defunding environmental interventions, which would tighten the causal link between the conceptual error and the practical outcome. I hope this breakdown helps you navigate the literature, and please feel free to reach out if you want to discuss how this relates to reaction norms in your old work.
