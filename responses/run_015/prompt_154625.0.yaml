  The dispute over 'institution' versus 'capacity' is partly verbal.

  **Cruxes**

  1.  **Capacity:** Case 88-B (Violent domestic, 03:00, Ward 4). Nearest unarmed team: 12 minutes.
      *   *Evidence:* Response logs from Pilot Scheme Alpha show 4 incidents where delay exceeded 10 minutes.
      *   *Iliffe Prediction:* In 3 of 4 cases, victim injury occurs without armed state response.
      *   *Okonjo Prediction:* In 3 of 4 cases, victim injury worsens with armed state response.
  2.  **Record:** Who owns the official version of events?
      *   *Evidence:* Discrepancy rates in Case 990 (Mediation vs. Police Log).
      *   *Iliffe Prediction:* State record ensures legal accountability across jurisdictions.
      *   *Okonjo Prediction:* State record ensures narrative control over community history.
  3.  **Defund:** Is defund a means or an end?
      *   *Evidence:* Budget allocation in Year 3 of the Reform Programme.
      *   *Iliffe Prediction:* Funds shift to specialists; institution remains.
      *   *Okonjo Prediction:* Funds shift to community; institution dissolves.

