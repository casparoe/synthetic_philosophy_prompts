answer: |-
  Here is a 45-minute lesson plan designed for a technically literate, rationalist-adjacent audience.

  ### The Core Example: Prisoner's Dilemma with Source Code
  **Verdict:** Stick with your instinct. The **Prisoner's Dilemma with visible source code** is the correct vehicle.
  **Why:**
  1.  **Audience Fit:** Your group are programmers. The concept of "inspecting a function's source code before calling it" is intuitive to them, whereas abstract modal logic is not.
  2.  **Contrast:** It creates the sharpest possible contrast with Nash Equilibrium (NE). In standard NE, strategies are independent variables. In Program Equilibrium (PE), strategies are *functions* that take other strategies as input.
  3.  **Precision:** It forces a distinction between "psychological similarity" (Superrationality) and "logical verification" (PE).

  ---

  ### The Lesson Plan (45 Minutes)

  #### 1. The Setup & The Trap (0–5 mins)
  *   **Goal:** Re-establish the baseline so the deviation feels significant.
  *   **Action:** Draw the standard PD payoff matrix on the board.
  *   **Narrative:** "We all know the story. Rational agents defect. Nash Equilibrium is (D, D). This relies on the assumption that my choice cannot *causally* influence yours, and our strategies are independent."
  *   **The Pivot:** "What if I told you that for this specific game, independence is a bug, not a feature? What if, before we move, I hand you my source code, and you hand me yours? And we are both running this code in a trusted sandbox."

  #### 2. The Mechanism: `MirrorBot` (5–15 mins)
  *   **Goal:** Demonstrate how cooperation becomes a dominant strategy under new rules.
  *   **Code Example:** Write this pseudocode on the board:
      ```python
      def MirrorBot(opponent_source):
          if opponent_source == my_source:
              return COOPERATE
          else:
              return DEFECT
      ```
  *   **Analysis:**
      *   If I play `MirrorBot` and you play `MirrorBot`: We match. We Cooperate. (Payoff: 3, 3)
      *   If I play `MirrorBot` and you play `DefectBot`: We don't match. I Defect. (Payoff: 1, 1)
      *   **Key Insight:** `DefectBot` gets 1 point against `MirrorBot`. `MirrorBot` gets 3 points against `MirrorBot`. Therefore, against a population of `MirrorBots`, `DefectBot` is not an evolutionarily stable strategy.
      *   **The Equilibrium:** (MirrorBot, MirrorBot) is now a Nash Equilibrium in this *new* game space.
  *   **Check for Understanding:** Ask, "Why can't I just pretend to be a MirrorBot?" (Answer: Because you have to submit actual source code that runs in a trusted environment).

  #### 3. Generalizing: `FairBot` & The Halting Problem (15–25 mins)
  *   **Goal:** Move beyond exact string matching to logical equivalence.
  *   **Problem:** `MirrorBot` is brittle. It only cooperates with itself. I want to cooperate with *any* bot that can prove it will cooperate with me.
  *   **Code Concept:** Introduce `FairBot`.
      ```python
      def FairBot(opponent_source):
          if search_for_proof(opponent_source(self) == COOPERATE):
              return COOPERATE
          else:
              return DEFECT
      ```
  *   **The Technical Hurdle:** Programmers will immediately spot the infinite recursion (`FairBot` simulates `FairBot` simulating `FairBot`...).
  *   **The Fix:** Briefly mention **PrudentBot** or bounded proof search (timeouts). You don't need to derive Löb's Theorem, but you must acknowledge that `FairBot` needs a limit to halt.
  *   **Takeaway:** Cooperation is achieved not because we are "the same," but because I can logically verify your output *given* my input.

  #### 4. The Misconception Minefield (25–35 mins)
  *   **Goal:** Explicitly decouple PE from Superrationality and Real-World applicability. **(Crucial Section)**
  *   **Misconception A: Superrationality (Hofstadter).**
      *   *The Confusion:* "We are both rational, so we'll think the same thing."
      *   *The Correction:* Superrationality relies on **psychological identity** (I assume you are like me). Program Equilibrium relies on **logical causality** (I can *read* your decision procedure). PE works even if the code is written in different languages by different people, provided the logic is verifiable.
      *   *When to hit this:* Right after introducing `FairBot`.
  *   **Misconception B: Solving Real-World PD.**
      *   *The Confusion:* "We can use this for nuclear disarmament or trade deals."
      *   *The Correction:* PE requires a **Trusted Execution Environment (TEE)**.
          1.  I must see your *actual* source, not a compiled black box.
          2.  I must trust the hardware running your code won't lie to me.
          3.  You cannot obfuscate.
      *   *Reality Check:* Humans and corporations are opaque black boxes. We cannot inspect the "source code" of a CEO's brain or a company's internal decision matrix.
      *   *When to hit this:* Just before the conclusion.

  #### 5. Implications & Wrap-up (35–40 mins)
  *   **Goal:** Ground it in things they care about.
  *   **Applications:**
      *   **Smart Contracts:** Code that holds funds and executes based on external code state.
      *   **AI Alignment:** If we deploy AI agents that can inspect each other's weights/code, they might enforce cooperation without human oversight.
      *   **DAOs:** Automated governance where rules are transparent.
  *   **Summary:** Program Equilibrium doesn't change human psychology; it changes the *interface* of interaction from "black box moves" to "transparent logic."

  #### 6. The Comprehension Check (40–45 mins)
  *   **Goal:** Verify they understand the *mechanism*, not just the vibe.
  *   **Do NOT ask:** "What is Program Equilibrium?" (They will recite definitions).
  *   **DO ask:** The "Email Source Code" Scenario.

  ---

  ### The One Question to Ask
  Write this scenario on the board and ask for a show of hands or a quick discussion:

  > **"I email you my Python script for `FairBot`. You review it, verify it looks correct, and then you run your own strategy on your local machine. I run mine on my laptop. We submit our moves to the referee. Do we achieve Program Equilibrium cooperation? Why or why not?"**

  **The Correct Answer:** **No.**
  **The Reason:** Program Equilibrium requires a **Trusted Execution Environment**. If I run the code on my laptop, I can modify the compiled binary or the output *after* you inspect the source. You inspected the *map*, but I control the *territory*. For PE to work, the referee must run both programs in a sandbox where neither player can tamper with the execution after source inspection.

  **Why this question works:**
  1.  It filters out people who think "sharing code" is enough (the naive view).
  2.  It filters out people who conflate it with Superrationality (psychological trust).
  3.  It forces them to identify the **commitment mechanism** (the sandbox/referee) as the critical ingredient, not just the logic.

  ---

  ### Speaker's Cheat Sheet: Handling Pushback

  *   **"But this is just Iterated PD."**
      *   *Response:* "No. Iterated PD requires a 'shadow of the future' (multiple rounds). Program Equilibrium works in a **one-shot** game. The 'future' is replaced by logical depth."
  *   **"Isn't this just a binding contract?"**
      *   *Response:* "A contract requires a court (external enforcer). Program Equilibrium is self-enforcing via code logic. The 'enforcer' is the interpreter."
  *   **"What if I obfuscate my code?"**
      *   *Response:* "Then the other agent defects. In PE, transparency is a strategic requirement for cooperation. Obfuscation signals 'Defect'."

  ### Timing Buffer
  If you run short on time, cut the deep dive into `PrudentBot`/Gödelian logic (Section 3). Stick to `MirrorBot` and the concept of "search for proof." The philosophical distinction (Section 4) is more important for this audience than the mathematical rigor of the bot construction.
