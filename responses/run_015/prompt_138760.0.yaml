  | 2 | Reach/Grasp Cube | Reaches correctly, can't name | Reaches correctly (Motor loop intact) | Y | Sensorimotor Contingency (Action) |
  | 3 | Sighted -> Blindfold | Trivially Yes | Trivially Yes (Vision is spatial anchor) | Y | Spatial Framework Asymmetry |
  | 4 | Late-blind (20-55) | Trivially Yes | Trivially Yes (Memory association exists) | Y | Prior Visual Model |
  | 5 | Handle + Look | < 1 min, sticks | Fast (Motor command synchronizes modalities) | Y | Active Sampling / Error Minimization |
  | 6 | Irregular Clay | Worse than Cube | Worse than Cube (High entropy, low compressibility) | Y | Geometric Compressibility |
