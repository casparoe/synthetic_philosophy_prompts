  You (0.3) and your friend (0.7) are primarily disagreeing on **T3 (The Exit Option)** and secondarily on **T2 (Substantive Injustice)**.

  1.  **The Exit Option (T3):**
      *   **Your Friend (0.7):** Likely assigns a high probability (0.85+) to the claim that the registry satisfies "last resort." They view the registry as a generous safety valve provided by a decent state. To them, Dara's refusal to use it is wantonness that imposes unnecessary social costs (arrest, court time) when a legal solution existed. They see the "duty to minimize harm to the legal order" as overriding the "duty to maximize protest visibility."
