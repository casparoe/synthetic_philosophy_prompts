answer: |-
  The image of Henry Sidgwick—the austere architect of Victorian utilitarianism, the man who coldly dissected moral intuition in *The Methods of Ethics*—spending his evenings investigating séances and telepathy as the first president of the Society for Psychical Research (SPR), is jarring. It looks like a contradiction: the high priest of hedonistic calculus dabbling in the occult. Your roommate argues this is a consistent, rational extension of his ethics; you argue it is an embarrassing *ad hoc* patch that reveals a crack in his system.

  While your roommate's defense holds up on a superficial level of instrumental logic, your intuition is the one that withstands deeper philosophical scrutiny. The SPR involvement is not merely a consistent extension of Sidgwick's utilitarianism; it is an admission that his secular, hedonistic system cannot stand on its own feet. You are right: it represents a fissure in his philosophy, though perhaps not for the exact reason you suspect. It is not necessarily that he smuggled in the "soul" as an intrinsic good, but that he smuggled in a *metaphysical hope* that his empirical ethics explicitly ruled out.

  To understand why your roommate's view is tempting, we have to look at Sidgwick's "Dualism of Practical Reason." In *The Methods of Ethics*, Sidgwick concludes that there is no rational way to reconcile Egoism (what is best for me) with Utilitarianism (what is best for all) in this life. Often, being moral requires sacrificing your own happiness. If death is the end, the Egoist is rational to be selfish, and the Utilitarian is irrational to be self-sacrificing. The only way to make Utilitarianism *rationally binding* for an Egoist is if there is an afterlife governed by a moral deity who rewards virtue and punishes vice.

  From this angle, your roommate is logically correct: Sidgwick's interest in the SPR was instrumental. He wasn't valuing immortality for its own sake (which would violate hedonism); he was investigating whether the *conditions for rational morality* existed. If telepathy or survival were proven, it opened the door to the religious sanctions needed to make Utilitarianism rational. Furthermore, Sidgwick was a rigorous empiricist. He argued that science should investigate all phenomena, not just those that fit materialist dogmas. To ignore psychical phenomena would be unscientific. On this reading, the SPR was simply the utilitarian maximizing long-term epistemic clarity to secure the foundations of ethics.

  However, this defense crumbles when you examine the actual results of the SPR and Sidgwick's reaction to them. Sidgwick spent decades on this research and remained agnostic. He found some evidence for telepathy, but very little for the kind of "moral governance" or survival that would actually solve the Dualism of Practical Reason. If the SPR was merely a rational extension of his ethics, the failure to find evidence should have led him to abandon the hope and accept the Dualism as insoluble. Instead, he clung to the *possibility*.

  This is where your "crack in the system" argument holds more weight. By tying the rationality of his ethics to the unproven findings of psychical research, Sidgwick admitted that his hedonistic utilitarianism was not self-sufficient. A robust ethical system should be able to justify why one ought to be moral without relying on the hope of a ghostly paycheck in the afterlife. Sidgwick's desperation for SPR validation reveals that his commitment was not ultimately to Hedonism, but to *Rational Coherence*. He valued the logical consistency of the universe more than the empirical reality of his ethical findings.

  This creates the fissure you sensed. Sidgwick claims to be a hedonist (pleasure is the only good) and an empiricist (knowledge comes from observation). Yet, his psychical research shows he was willing to hang the validity of his entire ethical system on a metaphysical wager that his own empiricism could not verify. He didn't necessarily smuggle in the "soul" as a non-hedonic value, but he did smuggle in a *theological prerequisite* for his secular ethics. He wanted to have it both ways: a modern, scientific ethics that nonetheless required pre-modern, religious sanctions to make sense. This is the definition of an *ad hoc* move. It saves the theory from collapse only by importing external support that the theory itself cannot generate.

  Furthermore, there is a textual tension in Sidgwick's private correspondence that supports your view over your roommate's. In letters to contemporaries like Arthur Balfour, Sidgwick expressed that if the SPR failed to find evidence of survival, he didn't see how he could continue working at ethics at all. This suggests that for Sidgwick, the *meaning* of ethics depended on immortality, not just the *calculation* of pleasure. If hedonism were truly his core, the absence of an afterlife would simply mean we have less time to maximize pleasure. It wouldn't render ethics itself pointless. The fact that he felt it would suggests he valued something beyond hedons—perhaps the ultimate justice of the universe—which is indeed a non-hedonic value.

  So, does this tension matter for how we evaluate utilitarianism today? Absolutely. Sidgwick's "ghost hunting" is a cautionary tale for modern secular ethicists. He identified a problem that still plagues utilitarianism: the "why be moral?" question. If being moral makes you miserable, and there is no cosmic justice, rationality dictates you should be selfish. Sidgwick tried to solve this with science (SPR) and failed.

  Today, many utilitarians simply ignore the Dualism, asserting that we should be moral because it's "right," effectively smuggling in intuitionism (which Sidgwick criticized) or relying on social pressure. Sidgwick was more honest: he saw the gap and tried to bridge it with evidence. His failure shows that a purely hedonistic, secular utilitarianism may be rationally unstable without some form of sanction or a rejection of rational egoism altogether.

  In the end, your roommate sees the *intent* (Sidgwick tried to be consistent), but you see the *implication* (the system required a crutch). Sidgwick's psychical research was not a triumphant extension of his ethics; it was a desperate attempt to prevent his ethics from imploding under the weight of their own rationality. It reveals that his hedonism was not the bedrock of his philosophy, but rather a structure built over a metaphysical abyss he hoped to fill with ghosts. You are right: it is a crack in the system, and it is far more revealing than embarrassing. It shows that the most rigorous utilitarian of the 19th century knew that pleasure alone was not enough to make morality rational.
