  | defeater — short name | what_would_have_to_be_true — the observation, case, or result that would make this bite | bite | live_or_merely_possible | defender_concedes | if_accepted — which numbered commitment of BRF changes, and how | already_partially_observed |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Unfalsifiable Class Selection | Any forecasting miss is attributed to "wrong reference class" without pre-registered selection rules. | fatal | live | no | 4 becomes algorithmic; no post-hoc class refinement allowed. | yes, in post-mortems of failed projects |
  | Shared-Mode Failure | Systemic shocks cause correlated failures across the entire reference class, invalidating the distribution. | serious | live | grudgingly | 1 requires environmental stability checks before deferring to OV. | yes, 2008 financial crisis housing base rates |
  | Tail-Insensitivity | Inside view reliably predicts tail outcomes (e.g., completion) in late-stage projects where OV predicts median. | serious | live | grudgingly | 2 changes; IV allowed to compress tails as project nears completion. | yes, construction project completions |
  | Prediction Equivalence | BRF forecasts converge no more than sophisticated IVF forecasts across different experts. | awkward | live-but-unmeasured | no | View loses distinctiveness; becomes semantic rather than structural. | no, requires controlled study |
  | Laundered Bias | Base rates are shown to be aggregates of past inside views that shared the same systematic biases. | serious | live | grudgingly | 3 requires auditing the genesis of the base rate, not just its record. | yes, many industry success-rate stats |
  | Regime Change/Decay | Base rates lose predictive power faster than inside-view updates in volatile domains. | serious | live | grudgingly | 3 requires decay functions on base rates based on volatility. | yes, tech startup survival rates by decade |
  | Causal Judgment Regress | Selecting the "causally similar" class requires inside-view judgment equal to the forecast itself. | awkward | live | no | 4 acknowledged as inside-view heavy; purity claim dropped. | yes, in defining "similar" startups |
  | Self-Consuming Rates | Publication of base rates alters agent behavior enough to invalidate the rate within one cycle. | awkward | live-but-unmeasured | no | 3 requires treating published rates as lower-confidence than private ones. | no, theoretically sound but hard to measure |
  | Expert Compression | BRF practitioners show significantly lower variance in probability assignments than IVF practitioners. | cosmetic | live | yes | Confirms the method's mechanical constraint, not a defeater. | no, requires controlled study |
