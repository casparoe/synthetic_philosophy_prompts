      *   *Critique:* Is the determinism argument too philosophical?
      *   *Fix:* Bring it back to the spray tank. If you spray, the crop is different. If you don't, it's different. The universe might be determined, but *you* are the mechanism determining it.
      *   *Critique:* Is the advice specific enough for 40 acres of soft fruit?
