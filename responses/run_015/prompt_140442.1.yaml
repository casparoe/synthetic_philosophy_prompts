answer: |-
  **Title:** Non-Causal Dependence and the Paradox of Phenomenal Judgement

  **Research Question:** Can a non-causal dependence relation secure the epistemic justification of phenomenal judgements within an epiphenomenalist framework?

  **Context and Problem:** The paradox of phenomenal judgement asserts that if consciousness is causally inert, we cannot know we have it. Standard responses typically bifurcate: either reject epiphenomenalism as incompatible with knowledge, or bite the bullet and accept reliable judgement without genuine knowledge. Both options assume that the required dependence between experience and judgement must be causal. This project argues the paradox conflates two distinct requirements: (1) a dependence requirement (judgements must track experiences) and (2) a causal interpretation of that dependence.

  **Approach:** I will investigate whether non-causal relations—specifically counterfactual dependence—can satisfy (1) without violating epiphenomenalism. The focus will be strictly on epistemic justification rather than singular reference. While reference is crucial, analysing it alongside justification within 6000 words risks superficiality. Standard replies leave the issue open because they accept the causal premise uncritically. By challenging this, we may find epiphenomenalism is epistemically viable despite being causally inert. This approach bypasses the intractable debate over whether epiphenomenalism is consistent with physics, focusing instead on the internal coherence of the epistemic objection.

  **Outcomes:** A positive result demonstrates that non-causal dependence suffices for justification, rescuing epiphenomenalism from scepticism. A negative result shows non-causal relations fail to secure the necessary 'answerability' between experience and judgement. Crucially, project failure is defined not by a negative result, but if the dependence problem collapses into a general scepticism about non-causal knowledge (e.g., maths or morals). If the problem proves generic, the specific philosophical payoff dissolves, as the paradox becomes merely an instance of general scepticism. To prevent this, I will restrict analysis to the unique features of phenomenal concepts.

  **Scope and Word Count:** 6000 words is tight for this scope. To ensure depth, I will exclude grounding relations and focus solely on counterfactual dependence. Grounding requires extensive metaphysical setup that would crowd out the epistemic analysis. Similarly, I will bracket reference to concentrate on justification. This ensures a determinate answer on whether counterfactuals can bridge the epistemic gap without causation. Attempting to cover both grounding and counterfactuals, or both reference and justification, would result in three arguments treated badly rather than one treated well. I will prioritise the counterfactual account of justification as the most promising route for the epiphenomenalist. If I attempt to cover grounding, I would need to double the word count to avoid hand-waving the metaphysics.
