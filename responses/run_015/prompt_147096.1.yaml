      *   **The Task:** Brainstorm strongest counterarguments, organize the response, map the exposure (what would have to be true for this to be wrong?), identify decisive defeaters vs. awkward ones, note existing objections, check for unfalsifiability, and conclude on vulnerability/insulation.

