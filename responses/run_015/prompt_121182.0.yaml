      *   **Counter-Argument:** Address the "dilution of legal term" concern seriously.
      *   **Uncertainty/Change of Mind:** The required closing paragraph.

  4.  **Refining the Tone:**
      *   Needs to sound like a backend engineer who thinks systematically but cares deeply.
      *   Avoid academic jargon. Use terms like "schema," "metadata," "fidelity," "downstream impact."
      *   American English.
      *   Ensure the "Change of Mind" section is vulnerable and specific.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Recommendation:* If I say "Reject," it sounds like I'm ignoring the survivors. If I say "Approve," I risk the legal standing. The middle path is: **Classify as 'Genocide (Cultural)' within a new schema, distinct from 'Genocide (Legal).'**
      *   *Better:* **Create a composite tag.** No, that's messy.
      *   *Best:* **Do not use the unqualified tag 'Genocide.' Instead, deploy a new taxonomy.** This allows us to say "This matches Lemkin's intent" without saying "This matches the 1948 Convention."
      *   *Wait, one more consideration:* The prompt says "vote on whether to label... as genocide." I need to answer that vote.
