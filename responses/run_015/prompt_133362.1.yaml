      *   **Constraint 1 (Pedagogy):** No lecture. Experiential learning. Students *become* the system.
      *   **Constraint 2 (Activity):** Each student gets a local rule for placing colored dots on a grid. No talking. No global view. Goal: Stabilize a pattern resembling a melody line (fugue).
      *   **Constraint 3 (Debrief):** 20 min silent building -> Vote ("Did the room compose this or did 12 people?") -> Debrief mapping moments onto emergence vs. aggregation.
      *   **Constraint 4 (Honesty):** Identify what this *cannot* reproduce (likely subjective feel/qualia).
      *   **Constraint 5 (Prediction):** Predict what will go wrong first run (chaos, one person taking over).
