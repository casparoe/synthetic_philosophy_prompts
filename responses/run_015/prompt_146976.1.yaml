  Elara maintained the firewall. The accession ledgers described the collection; they were never *of* the collection. To catalog the catalog was to invite infinite regress. She protected the inviolate level with bureaucratic rigor. The tools of description remained invisible.

  Then came Donation 9021: a leather-bound sketchbook.

  Elara opened it with gloved hands. Page one depicted her hiring card, down to the coffee stain on the lower right. Page ten showed the 2010 ledger. Page hundred showed the current log, empty save for the date. The graphite was precise. The hands holding the pens in the drawings belonged to her predecessor, Mr. Henderson. But in the shading of Henderson's cuff, another hand sketched *him*, belonging to Mrs. Gable. Each layer drew the layer before, a regressive chain of custody extending back to the museum's founding.

  Elara paused. If she accessioned the sketchbook, the ledger became the subject. If the ledger was the subject, it was art. If it was art, it required cataloging. The firewall would collapse. The frame would become the picture, and the picture the frame. Every level she designated as framing was already framed by the one beneath it. The sketchbook contained the ledger; the ledger contained the record of the sketchbook's arrival; the record predicted the cataloging of the record.

  She could not discard it. Protocol demanded preservation. She could not accession it. Protocol demanded separation.

  She selected a fresh index card. Stock 400gsm. Blue ink.

  *Object:* Sketchbook.
  *Medium:* Graphite.
  *Content:* Depicts Accession Ledgers 2004-2024.

  She turned the page of the sketchbook. The final drawing showed a hand writing an index card. The pen matched hers. The card matched this one. The handwriting was hers. The drawing framed the act of cataloging the drawing.

  To file the book was to admit the ledger was art. To not file it was to lose the object. She chose procedure. She wrote the accession number at the top of the card. She dated it. She signed her name.

  In the drawing, the ink on the card was still wet. In reality, her hand hovered. The sketchbook lay open, waiting for the next page, or perhaps having already recorded it. She placed the card in the tray. It sat among thousands of others, indistinguishable, framing the object that framed the frame.

  She capped her pen. The entry was complete. She did not check whether she was cataloging the book, or if the book was cataloging her. The card slid into the drawer, one more record in a ledger that might itself be a page in a book she had not yet opened. She filed the entry. Or perhaps, she was filed. The hierarchy held, perfectly tangled.
