prompt: |-
  I'm planning a session for a philosophy reading group of advanced undergraduates who have read Susan Wolf's essay on moral saints but think they have grasped it because they agree that being too good sounds exhausting. I want to teach the specific conceptual claim that maximal moral goodness is undesirable not because it causes burnout—an empirical mistake—but because it structurally crowds out non-moral excellences that are partly constitutive of human flourishing, making the ideal of moral sainthood self-undermining as a life-plan rather than merely difficult.

  Plan the explanatory arc: first, the dependency order—what distinction between being very good and being a moral saint, and between a life-plan and a behavioral pattern, must be in place before the structural point can even appear; second, the carrying example—use an imagined physician who spends every available hour either treating underserved patients or optimizing her epidemiological research to maximize lives saved, and who therefore abandons both the cello she once played and friendships that do not serve her moral efficiency. Explain why this case must include these specific non-moral goods and why it should not be Mother Teresa, Gandhi, or a generic workaholic; third, map the misconceptions in the order they will arise—(1) that Wolf is criticizing people for being too good, (2) that she is defending a right to leisure or selfishness, (3) that she is making an empirical claim about psychological burnout—and state exactly where in the sequence each should be defused; fourth, provide one check question at the end that reveals whether the group has understood the structural argument rather than merely sympathizing with the doctor's lost cello; finally, tell me which part of Wolf's framework—such as her comparison of different motivational models of sainthood—I should explicitly set aside at this level and say I am leaving out.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Advanced undergraduates in a philosophy reading group.
      *   **Text:** Susan Wolf's "Moral Saints".
      *   **Current Student Mindset:** They think they get it, but they reduce it to "being too good is exhausting" (empirical/psychological claim).
      *   **Goal:** Teach the *structural/conceptual* claim: Maximal moral goodness crowds out non-moral excellences constitutive of flourishing, making sainthood self-undermining as a life-plan.
      *   **Required Components:**
          1.  *Explanatory Arc (Dependency Order):* Distinctions needed before the structural point (Very Good vs. Saint, Life-Plan vs. Behavior).
          2.  *Carrying Example:* A specific physician case (treating/research vs. cello/friendships). Why this specific case? Why *not* Mother Teresa/Gandhi/Workaholic?
          3.  *Misconception Mapping:* Order of misconceptions (Criticizing goodness, Defending selfishness, Empirical burnout) and when to defuse them.
          4.  *Check Question:* One question to test structural understanding vs. sympathy.
          5.  *Exclusion:* What part of Wolf's framework to explicitly set aside (e.g., motivational models).

  2.  **Deconstruct the Philosophical Argument (Wolf's Core Thesis):**
      *   Wolf isn't saying morality is bad.
      *   She isn't saying saints are psychologically damaged (necessarily).
      *   She *is* saying that a life *dominated* by moral concerns lacks the variety of interests that makes a life "well-rounded" or "ideal."
      *   The "Saint" is defined by the *priority* of moral concerns over all others, not just the *amount* of good done.
      *   The argument is about the *concept of an ideal human life*, not just moral theory.

  3.  **Drafting Component 1: Explanatory Arc (Dependency Order):**
      *   *Step 1: Define the Saint.* Need to distinguish "Very Good Person" (VGP) from "Moral Saint" (MS). VGP does a lot of good but has other interests. MS makes moral goodness the *supreme* governing principle.
      *   *Step 2: Define the Scope.* Need to distinguish "Behavioral Pattern" (what you do on Tuesday) from "Life-Plan" (the architecture of your identity and time).
      *   *Step 3: The Structural Point.* Only after 1 & 2 can we see that the MS life-plan *necessarily* excludes non-moral goods, not because the person is tired, but because the *definition* of the plan prioritizes moral utility over personal flourishing.

  4.  **Drafting Component 2: The Carrying Example (The Physician):**
      *   *Scenario:* Dr. A. spends all time on patients/research. Drops cello, drops "inefficient" friends.
      *   *Why this specific case?* It shows *competence* and *rationality*. She isn't confused; she's optimizing. It highlights the *opportunity cost* of specific human goods (art, intimacy) that aren't morally weighty enough to beat saving lives but are essential for a rich life.
      *   *Why NOT Mother Teresa/Gandhi?* Too hagiographic. Students will get stuck on "But they were holy/inspiring." It triggers reverence rather than analysis. Also, their historical contexts add noise (political, religious).
      *   *Why NOT a generic workaholic?* A workaholic might be working for money or ego. The moral saint works for *moral value*. We need the moral motivation to be clear to test the *moral* theory.
      *   *Why Cello/Friendships?* They represent "non-moral excellences." Cello = aesthetic/creative cultivation. Friendships = particularistic love (loving someone for *who they are*, not *how much good they do*). These are constitutive of flourishing in a way that "rest" is not.

  5.  **Drafting Component 3: Misconception Mapping:**
      *   *Misconception 1: Wolf hates good people.* (Defuse early, during the VGP vs. MS distinction).
      *   *Misconception 2: Wolf defends selfishness/leisure.* (Defuse during the Cello/Friendship analysis—it's not about "me time," it's about "human time").
      *   *Misconception 3: Wolf claims burnout.* (Defuse last, as the climax. The point isn't she *can't* keep going, it's that the life *lacks value* even if she does).

  6.  **Drafting Component 4: Check Question:**
      *   Need to avoid: "Is the doctor tired?" (Empirical) or "Is the doctor nice?" (Moral).
      *   Need to target: "Does the life lack something *valuable* even if the doctor is happy and healthy?"
      *   *Draft:* "If Dr. A. never feels tired and loves her work, is her life still deficient according to Wolf? Why?"
      *   *Refinement:* Make it about the *reason* for the deficiency. "If we could guarantee Dr. A. never experiences burnout and finds pure joy in every hour of epidemiological work, does Wolf's argument still conclude her life is less than ideal? If so, what exactly is missing?"

  7.  **Drafting Component 5: Exclusion:**
      *   Wolf discusses the "Loving Saint" vs. "Rational Saint" (motivational models).
      *   *Decision:* Set this aside. It complicates the structural argument about *value* with an argument about *psychology/motivation*. The prompt asks to focus on the structural crowding out of non-moral goods. The motivational distinction distracts into "Can you love being good?" rather than "Is being good all-encompassing desirable?"

  8.  **Review and Refine:**
      *   *Tone:* Academic, structured, pedagogical.
      *   *Check against constraints:* Did I cover all four specific points + the exclusion? Yes.
      *   *Logic Check:* Does the dependency order make sense? Yes, you can't argue structural crowding out without defining the structure (Life-Plan) and the agent (Saint vs. VGP).
      *   *Example Check:* Does the physician example clearly illustrate the "crowding out"? Yes, by contrasting moral utility (lives saved) with non-moral goods (music, friendship).

  9.  **Final Polish:** Ensure the distinction between "empirical mistake" (burnout) and "conceptual claim" (constitutive elements of flourishing) is sharp throughout. (Self-Correction: Make sure to emphasize that friendships are "particularistic" vs moral "impartiality" as that's key to Wolf).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a lesson plan designed to shift your reading group from an empirical interpretation of Wolf to a structural one.

  ### 1. The Explanatory Arc: Dependency Order
  You cannot argue that sainthood is *structurally* deficient until the students accept specific definitions that separate Wolf's "Saint" from a merely "Good Person." Establish these distinctions in this order:

  *   **Distinction A: The Very Good Person (VGP) vs. The Moral Saint (MS).**
      *   *Concept:* A VGP fulfills all moral obligations and perhaps goes beyond them (supererogation), but their life is not *dominated* by moral concerns. An MS is defined by the **priority rule**: moral considerations always trump non-moral considerations when they conflict.
      *   *Why first?* If students think a Saint is just "someone who does a lot of good," they will assume one can do a lot of good *and* play the cello. You must establish that the Saint is defined by the *hierarchy of reasons*, not the volume of output.
  *   **Distinction B: Behavioral Pattern vs. Life-Plan.**
      *   *Concept:* A behavioral pattern is a snapshot of actions (e.g., "volunteering 20 hours this week"). A Life-Plan is the architecture of identity over time (e.g., "organizing one's character and time around the maximization of moral value").
      *   *Why second?* The burnout objection attacks the *pattern* ("You can't keep this up"). Wolf's argument attacks the *Plan* ("Even if you can keep this up, the shape of the life is impoverished").
  *   **The Structural Point:**
      *   *Concept:* Only after accepting A and B can you introduce the claim that a Life-Plan governed strictly by the priority rule *necessarily* excludes certain goods (aesthetic, particularistic) that are constitutive of human flourishing. The deficiency is in the *composition of the life*, not the *capacity of the agent*.

  ### 2. The Carrying Example: The Optimizing Physician
  **The Case:**
  Introduce "Dr. A," an epidemiologist. Dr. A. recognizes that every hour not spent treating underserved patients or optimizing research models is an hour where preventable deaths occur. Consequently, Dr. A. sells her cello (too time-consuming) and ends friendships with people who do not contribute to her moral mission or emotional stability for work. Dr. A. is not depressed; she is rationally optimizing for moral value.

  **Why this specific case?**
  *   **Why the Cello?** It represents **aesthetic excellence**. It is a non-moral good that requires deep cultivation. It shows that the loss isn't just "fun," it is the loss of a specific dimension of human capability.
  *   **Why Friendships?** It represents **particularistic love**. Wolf argues morality is often impartial (everyone counts equally), but deep friendship requires partiality (this person counts *more* because they are *theirs*). The Saint must abandon true friendship for impartial benevolence.
  *   **Why NOT Mother Teresa or Gandhi?**
      *   *Reason:* Hagiography creates noise. Students will defer to their "holiness" or get bogged down in historical debates about whether they actually had hobbies. We need a secular, controlled thought experiment where the moral calculus is transparent.
  *   **Why NOT a Generic Workaholic?**
      *   *Reason:* A workaholic might work for money, status, or ego. Wolf's argument is specific to *moral* motivation. If Dr. A. works for money, she isn't a Moral Saint; she's just ambitious. We need the motivation to be *moral* to test the limits of morality itself.

  ### 3. Mapping the Misconceptions
  Defuse these misconceptions in the following sequence. If you address them out of order, the structural point will collapse back into the empirical one.

  *   **Misconception 1: "Wolf is criticizing people for being too good."**
      *   *When to defuse:* **Immediately**, during Distinction A (VGP vs. MS).
      *   *Correction:* Clarify that Wolf admires VGPs. She is not attacking moral *action*; she is attacking moral *dominance*. The target is the *ideal*, not the *agent*.
  *   **Misconception 2: "Wolf is defending a right to leisure or selfishness."**
      *   *When to defuse:* **During the Cello/Friendship analysis.**
      *   *Correction:* Emphasize that playing the cello is not "selfish" in the pejorative sense; it is a form of human flourishing. Wolf is not saying "I deserve a break"; she is saying "A life without music is less than fully human." Shift the frame from *entitlement* to *value*.
  *   **Misconception 3: "Wolf is making an empirical claim about psychological burnout."**
      *   *When to defuse:* **At the climax, regarding Dr. A's stability.**
      *   *Correction:* This is the crucial turn. Ask the group: "If Dr. A. has infinite energy and never feels tired, is the problem solved?" If they say yes, they missed the point. The problem is not that Dr. A. *crashes*; it's that Dr. A.'s life *lacks richness* even if it runs smoothly forever. The argument is conceptual (about what makes a life good), not psychological (about what makes a mind tired).

  ### 4. The Check Question
  Do not ask: *"Do you think Dr. A. should take a break?"* (This invites the empirical/burnout answer).

  **Ask this instead:**
  > "Suppose we could guarantee that Dr. A. never experiences burnout, feels no resentment, and derives genuine joy from every hour of her epidemiological work. According to Wolf's structural argument, is Dr. A.'s life still deficient compared to a life that includes the cello and deep friendships? If yes, **what category of value is missing from Dr. A.'s life that cannot be translated into moral utility?**"

  *   **Correct Answer Indicator:** They must identify that "joy in moral work" does not equal "aesthetic cultivation" or "particularistic intimacy." They must acknowledge that non-moral goods have independent value that moral goodness cannot substitute, even if the agent is perfectly happy.

  ### 5. What to Explicitly Set Aside
  **The Motivational Models (The Loving Saint vs. The Rational Saint).**

  *   **Instruction to Group:** "Wolf spends significant time distinguishing between the Saint who sacrifices desire for duty (Rational) and the Saint whose desires align with duty (Loving). For today's session, we are bracketing that distinction."
  *   **Reason:** This distinction focuses on the *psychology of the agent* (how it feels to be a saint). Your goal is to teach the *structure of the life-plan* (what is excluded from the life). Focusing on whether the Saint "loves" their sacrifice distracts students back into empirical psychology ("Well, if she loves it, it's not bad!"). You need them to focus on the **object** of the life (the goods pursued), not the **subject's feeling** about the life.
