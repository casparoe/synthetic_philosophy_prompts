  **Objection:** The gallery owner argues this instrument is rigged. Agreement on what the county happens to own shows only that five people share the habits of one time and place, which on Hume's own account is no evidence of merit at all, and that my procedure would entrench an untrained majority by quietly halving the votes of the two members who dissent from it. She contends training and wide comparison are exactly how merit gets recognized, and that "merit" in the donor's sense cannot be settled by counting hands. She argues that true merit transcends local consensus.

  **Modification:** I accept this critique regarding the existing art. Using county-owned works risks confusing local habit with universal merit. We will not weight votes based on old sculptures. We will rely solely on the consistency of individual rankings over time to identify stable judgment.

  **If Still Split:** If the rankings still split three to two, we will invite an external sixth judge, mutually agreed upon, to break the tie. This judge should be selected for their wide comparison of works across nations and centuries, fulfilling the requirement for universal agreement among true judges.

  **Conflict of Interest:** The member who is the artist's neighbor should vote. She disclosed the relationship; none of us believe it affects her judgment. Excluding her penalizes connection rather than corruption, and Hume warns against prejudice, not familiarity. Disclosure suffices to maintain integrity.

  This approach respects the donor's wish to avoid a public vote while acknowledging that merit requires more than counting hands. We must strive for that agreement despite our different backgrounds.
