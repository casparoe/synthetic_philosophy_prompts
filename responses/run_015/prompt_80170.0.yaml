          2.  Prediction/Science within an unbroken custom (*ʿāda*).
          3.  Scope of critique (Necessary connection vs. Causal order itself).
          4.  Secular coherence (Can this work without theology?).
      *   **Constraint 3:** Each question needs a follow-up keyed to the *most likely answer* (anticipating standard replies like "necessity is an illusion" or "custom is grounded in God's free choice").

  2.  **Deconstruct the Topics & Brainstorm Angles:**

