  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Occasion vs. Cause):* Focus on the ontological status of the "occasion." If fire has no power, why is *fire* the occasion and not *water*?
      *   *Q2 (Science/Prediction):* Focus on the "unbroken" nature. If God *never* breaks the habit, is "contingency" just a word?
      *   *Q3 (Scope):* Distinguish between *connection* and *sequence*. Does the critique dismantle the chain of being?
      *   *Q4 (Secular):* Humean comparison. Is the "divine will" just a placeholder for "brute regularity"?
      *   *Q5 (Human Agency - Extra):* Crucial for Ghazālī (Kasb theory). If God creates the act, how is it mine?
      *   *Q6 (Epistemology - Extra):* How do we discern the custom? Miracle vs. Normalcy.
      *   *Q7 (Theodicy/Morality - Extra):* If God creates the burning, is God the burner?
      *   *Q8 (Modern Physics - Extra):* Quantum indeterminacy. Does modern science help or hurt this view?

      *Review against constraints:* I need to ensure the four mandatory topics are clearly covered.
      1. Occasion/Cause distinction -> Q1.
