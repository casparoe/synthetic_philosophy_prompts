answer: |-
  ### The Replacement Protocol: A Sorting Instrument

  **Instructions:** You are the patient. There are no right answers, only consequences. For each scenario, choose the option that matches what you would expect to happen, or what you would demand be done. Keep track of your choices (A, B, or C).

  **1. The Pause**
  The swap can be done in one night under deep cooling (you experience nothing) or over thirty years while awake (you experience every swap).
  *   A. It doesn't matter; the one who wakes up at the end is you either way.
  *   B. The thirty-year route is safer; the one who lives through the process is you.
  *   C. The one-night route is safer; the one who wakes up with the finished brain is you.

  **2. The Rival**
  Your removed biological parts are kept alive and grown into a second brain in a clone body. Both brains are active.
  *   A. You are the one in the original body location, regardless of material.
  *   B. You are the one with the biological brain, regardless of location.
  *   C. There is no fact about which one is you; both have equal claim.

  **3. The Duplicate**
  At the halfway point, the pattern is copied into two synthetic brains. Both are woken up.
  *   A. Both are you until they diverge; then they are two different people.
  *   B. Neither is you; the duplication breaks the chain.
  *   C. Only the one who continues your current stream of experience is you.

  **4. The Sleep**
  Synthetic parts are installed inert and all switched on simultaneously at the very end.
  *   A. You are the one who wakes up when the switch is flipped.
  *   B. You died when the biological parts were removed; the waker is a copy.
  *   C. You are the sequence of installations, even if nothing happened during them.

  **5. The Drag**
  Each synthetic part runs a hair slower. By the finish, your mental tempo is half speed.
  *   A. You are still you, just thinking slower.
  *   B. You are a different person; the quality of experience has changed too much.
  *   C. It depends on whether you notice the change from the inside.

  **6. The Return**
  The procedure is run in reverse: synthetic parts swapped back for lab-grown biological ones.
  *   A. You are the one who finishes the reverse procedure.
  *   B. You died during the first swap; this is a new person with your memories.
  *   C. You are the one who signed the initial consent form, regardless of the path.

  **7. The Account**
  Your bank account is frozen during the procedure. It releases funds to "the surviving account holder."
  *   A. Give it to whoever claims continuous memory of the password.
  *   B. Give it to whoever possesses the original biological signature.
  *   C. Give it to whoever the court designates based on social continuity.

  **8. The Pain**
  The biological parts kept alive (see Q2) are pinched. The synthetic you feels nothing.
  *   A. You feel the pain only if you are the biological one.
  *   B. You feel no pain; that biological mass is just tissue, not you.
  *   C. Pain is irrelevant; check who owns the medical history.

  **9. The Glitch**
  A synthetic part malfunctions for one second, then is replaced.
  *   A. You died for that second; the next moment is a new person.
  *   B. You persisted through the glitch as long as the function was restored.
  *   C. It depends on whether the gap was experienced.

  **10. The Verdict**
  A court rules that for legal purposes, "you" are the synthetic entity, despite your biological family's objection.
  *   A. Accept the ruling; if the law says you are you, you are you.
  *   B. Reject the ruling; the law cannot change who actually woke up.
  *   C. Appeal based on which entity holds your property rights.

  **11. The Simulation**
  Your pattern is run on a computer server without a body.
  *   A. That software is you.
  *   B. That is a model of you, not you.
  *   C. It is you only if it can interact with the world like you did.

  **12. The Consent**
  Who signs the consent form for the operation after the first 10% of your brain is swapped?
  *   A. The one who is currently in the chair, regardless of composition.
  *   B. The original biological human who started the process.
  *   C. No one can sign; the original person is no longer there to consent.

  ***

  ### Scoring Key

  Do not count A, B, C. Instead, tally points for the following three categories based on your choices.

  **Category M (Matter):** Award 1 point for every answer that prioritizes the original biological material or location.
  *   *Questions:* 2(B), 6(B), 7(B), 8(A), 12(B).

  **Category P (Pattern):** Award 1 point for every answer that prioritizes psychological continuity, memory, or functional structure.
  *   *Questions:* 1(A), 2(A), 3(A), 4(A), 5(A), 6(A), 7(A), 9(B), 11(A), 12(A).

  **Category C (Convention):** Award 1 point for every answer that prioritizes legal ruling, social agreement, or denies a deep fact.
  *   *Questions:* 2(C), 3(B), 3(C), 5(C), 7(C), 8(C), 9(C), 10(A), 10(C), 11(C), 12(C).

  **Category U (Uniqueness):** Award 1 point for every answer that rejects branching or duplication.
  *   *Questions:* 3(B), 9(A), 12(C).

  **Resolve Your Leaf:**

  1.  **If Category C is your highest score:** You are **The Quietist**. (See Leaves below).
  2.  **If Category C is tied with Category P:** You are **The Pragmatist**.
  3.  **If Category M is your highest score:** You are **The Organism**.
  4.  **If Category P is your highest score AND Category U is zero:** You are **The Functionalist**.
  5.  **If Category P is your highest score AND Category U is 2 or higher:** You are **The Exclusivist**.
  6.  **If Category P is high but you favored Q1(B) and Q5(B):** You are **The Psychologist**. (Override rule: If you chose "experience" over "outcome" in Q1 and Q5, shift from Functionalist to Psychologist).

  ***

  ### The Leaves

  **1. The Organism**
  *   **View:** You are the living biological animal.
  *   **Awkward Commitment:** You cease to exist if your brain is transplanted to a new body.

  **2. The Psychologist**
  *   **View:** You are the chain of memories and character traits.
  *   **Awkward Commitment:** You survive total amnesia if character traits remain, or die if memories are wiped despite biological continuity.

  **3. The Functionalist**
  *   **View:** You are the input/output structure; substrate does not matter.
  *   **Awkward Commitment:** A perfect software simulation of you running on a server is you.

  **4. The Exclusivist**
  *   **View:** You are the structure, but there can be only one.
  *   **Awkward Commitment:** If two copies exist, neither is the original you; you vanish upon duplication.

  **5. The Quietist**
  *   **View:** (Merged 4D Temporal Parts & Deflationary). The question "who survives" is a category error or has no fact of the matter.
  *   **Awkward Commitment:** There is no true answer to whether you survive, only useful ways of talking.

  **6. The Pragmatist**
  *   **View:** You are whoever the law and social conventions say you are.
  *   **Awkward Commitment:** If the court says you're dead, you're dead, even if you feel alive.

  **Merge Note:** I merged **4D Temporal Parts** and **Deflationary** into **The Quietist**. Both views dissolve the survival question rather than answering it—one by redefining "you" as a spacetime worm where survival is irrelevant, the other by denying a deep fact exists. They occupy the same logical space in this instrument: rejecting the binary of life/death.

  ***

  ### Unoccupied Combinations

  1.  **Bio-Matter + Branching Tolerance:** Believing original matter matters *and* that copying it preserves you. (Incoherent: If matter is key, duplication shouldn't work).
  2.  **Functionalism + Tempo Sensitivity:** Believing structure defines you *and* that speed changes change who you are. (Unattractive: Function defines output; tempo is internal).
  3.  **No Deep Fact + Retributive Justice:** Believing there is no fact of who you are *and* that "you" deserve punishment for past crimes. (Incoherent: Cannot punish a fiction).
  4.  **Psychological Continuity + Inert Parts:** Believing memory flow is key *and* accepting a period of total inertness. (Untried: Inertness breaks psychological flow).

  ***

  ### Commitment

  If I took the procedure, I would land on **The Quietist**. The assumption that "survival" is a binary switch waiting to be flipped is the error; I am a process extended in time, and asking if I "survive" is like asking if a flame survives when moved to a new candle. The question I trust least is **Q5 (The Drag)**. Distinguishing between a functional slowdown and a qualitative change in experience is nearly impossible from the outside, and relying on the subject's report introduces a bias toward the Psychological view that muddies the Functional sorting.
