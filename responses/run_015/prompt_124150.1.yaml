answer: |-
  **1. Republican Liberty (Non-domination)**
  Republican liberty ranks first because it defines unfreedom as subjection to arbitrary power rather than mere active interference. The **mediation of constraint through private automated contracts** establishes a relationship of dependency where the algorithm holds unchecked power to alter life chances without recourse, fulfilling the condition of domination even if no specific order is issued.

  **2. Positive Liberty (Self-mastery)**
  Positive liberty ranks second because it prioritizes the agent's internal capacity for authentic self-direction over the mere existence of external options. The **role of preemptive behavioral adaptation** demonstrates that citizens are psychologically coerced into inauthenticity, undermining their self-mastery as they act on fear of algorithmic penalty rather than rational will.

  **3. Negative Liberty (Non-interference)**
  Negative liberty ranks third because it defines freedom strictly by the absence of external obstacles or coercion imposed by identifiable agents. The **absence of direct command** masks the coercion, as the system technically allows movement while practically negating it, leaving the negative libertarian unable to classify this systemic pressure as genuine unfreedom.

  **Concluding Evaluation**
  This case reveals a gap in all three conceptions regarding "distributed anticipatory interference," as the coercion is ambient and infrastructural rather than purely agential or internal. Republican liberty is the most amenable to revision because its core concern with structural power asymmetries can be extended to cover non-human, algorithmic arbiters without abandoning its foundational logic.
