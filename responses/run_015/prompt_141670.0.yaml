answer: |-
  Dear Colleague,

  Thank you for trusting me with this difficult situation. It is clear from your description that you are grappling with a profound governance dilemma, one that touches on the very definition of your community and the legitimacy of your decision-making process. The tension you describe between legal structure, moral stake, and personal bias is exactly where these kinds of conflicts become corrosive, so it is vital to proceed with both philosophical clarity and practical care. You have asked for the strongest arguments on both sides, an analysis of whether a non-arbitrary standard exists for determining the franchise, and a recommendation on how to proceed. I will address each in turn, hoping to provide a framework that helps you navigate the board meeting with integrity.

  The strongest case for allowing the tenants to vote rests on what political theorists call the all-affected principle. This principle holds that anyone whose vital interests are significantly impacted by a decision should have a say in making it. In this instance, the tenants face the loss of their homes, a disruption far more severe than any financial adjustment faced by the owner-residents. The tenant who has lived there for eleven years has built a life within the community, and excluding her from a vote that determines whether she can remain feels like a fundamental violation of democratic fairness. Furthermore, if the co-op functions as a social community rather than merely a financial vehicle, the tenants are de facto members of that community. To disenfranchise them on the grounds of legal tenure ignores the social reality that they are neighbors who contribute to the collective life of the building. If the vote passes, they are bound by the outcome in the most literal sense possible, as they must leave; thus, denying them a voice suggests that their consent is irrelevant to the legitimacy of the coercion they will suffer.

  The strongest case for restricting the vote to owner-residents rests on the principles of property rights and organizational definition. A housing cooperative is legally defined by share ownership, not residency. The owners carry the financial risk, hold the equity, and are permanently subject to the bylaws and maintenance costs in a way that tenants are not. Tenants have a contractual relationship governed by a lease, which typically grants them quiet enjoyment but not governance rights. Allowing tenants to vote on the conversion of the asset they occupy creates a conflict of interest akin to allowing a employee to vote on whether to liquidate the company that pays them. The owners are the ones who will live with the long-term financial consequences of the decision, such as changes in maintenance fee structures or property values, regardless of whether they stay or sell. If the co-op is to remain a coherent legal entity, the power to alter its fundamental structure must reside with those who hold the shares that constitute that entity. To give voters without skin in the financial game the power to dictate the terms of ownership undermines the property rights of those who actually own the building.

  You are rightly concerned about the circularity of this problem, where the outcome determines who should have voted, and who votes determines the outcome. This is a classic boundary problem in democratic theory. However, there is a non-arbitrary way to settle the franchise that does not simply select the electorate to produce a preferred result, nor does it assume the very thing the decision is supposed to settle. The solution lies in distinguishing between the rules of the game and the moves played within it. The vote next month is a move within the current governance structure to potentially change that structure. Therefore, the rules governing the vote must be the rules that exist prior to the vote. You cannot use the proposed new structure to authorize the transition to that new structure, because that new structure does not yet exist. Consequently, the franchise must be determined by the current legal and operational reality of the co-op. Since the bylaws are silent, you must look to the default legal status of the entity. As a corporation owned by shareholders, the authority to alter the capital structure or dispose of major assets resides with the shareholders. This is not an assumption that the co-op should remain mixed; it is an acknowledgment that until the vote passes, the co-op is legally a shareholder-governed entity. This standard is non-arbitrary because it relies on the status quo ante as the only stable reference point available. It avoids circularity by refusing to let the potential future status of the tenants dictate their current rights, just as it refuses to let the owners' desired outcome dictate their exclusive privilege. It simply asks who holds the authority under the rules currently in force.

  However, identifying the correct franchise does not solve the problem of bias you have observed among your fellow board members. The fact that board members are favoring the rule that produces their preferred outcome is a sign of bad faith that threatens the legitimacy of the process regardless of who votes. If the board decides the franchise based on head-counting rather than principle, the losing side will rightly view the process as rigged. Therefore, while the owners should technically hold the vote based on the structural argument above, the board must take specific steps to mitigate the ethical weight of excluding the tenants. You should advise the board to formally adopt the shareholder-only franchise based on the principle of existing governance authority, explicitly stating that this is not a judgment on the tenants' worth or stake in the community, but a requirement of the co-op's legal constitution.

  What you should actually do is steer the board toward a process that honors the legal necessity of owner voting while acknowledging the moral gravity of the tenants' situation. First, insist that the decision on franchise be made as a separate preliminary motion, justified solely by the principle of existing authority, not by the expected outcome. Second, acknowledge that while the tenants cannot vote on the conversion, their interests must be represented. The board should consider inviting a tenant representative to speak during the deliberation, or even better, committing to a relocation assistance package or right of first refusal for the tenants should the units convert, regardless of the vote's outcome. This separates the question of who decides from the question of how the decision is implemented. If the owners vote to convert, they do so with the understanding that they are exercising a property right that carries a moral cost, which they should agree to mitigate. If the owners vote to maintain the status quo, they do so as an act of inclusion rather than being forced by an outside electorate.

  Ultimately, you must urge your colleagues to recognize that their bias is the greater danger than the franchise rule itself. A vote held by owners who acknowledge the tenants' plight is more legitimate than a vote held by tenants who were granted rights solely to ensure a specific outcome. The integrity of the co-op depends on the board acting as fiduciaries of the existing structure while treating the tenants with the dignity of neighbors. Decide the franchise based on the current bylaws and corporate law, which points to the owners, but bind the owners to a humane process that respects the tenants' long-standing presence. This approach respects the rule of law without abandoning the community's moral obligations, and it offers the best chance of preserving the social fabric of the building regardless of how the ballots are cast.

  Sincerely,

  Your Advisor
