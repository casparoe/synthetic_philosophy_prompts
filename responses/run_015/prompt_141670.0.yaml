prompt: |-
  I sit on the board of a small housing cooperative: twenty-two apartments owned and occupied by members, and four that the co-op owns and rents out. Next month the members will hold a binding vote on whether to convert those four rental units into owner-occupied shares, which would end the tenancies. Our bylaws are drafted on the assumption that there would always be renters and are silent about whether tenants may vote on anything, so the board has to decide the franchise. I would like your advice on that decision.

  Two features of the case are making it harder than I expected. First, the vote does not merely change who lives here; it changes who the co-op is. If it passes, the four tenants leave and we become an all-owner building; if it fails, they stay and the co-op goes on being partly a landlord. So how much someone has at stake, and whether they will be bound by what we decide, both seem to depend on which way the vote goes — and the four tenants' ballots could easily decide it, since the owner-residents are split almost evenly. Second, the people with the most at stake are not the same people as the people who will live under the result: one owner-resident has told the board privately that she will sell and move out within the year whatever happens, while one tenant has lived in her unit for eleven years and would stay indefinitely if the conversion fails. Some of us want to let the tenants vote because no one is more affected; others say that only those who are permanently subject to the co-op's rules and carry its costs should have a say; and I keep noticing that each of us seems to favour whichever rule gives our own side the votes.

  Please set out the strongest version of each position, tell me whether there is a non-arbitrary way to settle who votes — one that is not simply selecting the electorate that produces the outcome you prefer, and that does not quietly assume the very thing the decision is supposed to settle — and then tell me what we should actually do. Write your reply in continuous prose, in the manner of a considered letter or email, with no headings, bullet points, bold text or tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a board member of a small housing cooperative.
      *   **Situation:** 22 owner-occupied apartments, 4 rental units owned by the co-op. Vote next month on converting rentals to owner-occupied shares (ending tenancies). Bylaws silent on tenant voting rights for this issue. Board must decide franchise (who votes).
      *   **Complications:**
          *   The vote changes the nature of the co-op (all-owner vs. mixed).
          *   Stake and bindingness depend on the outcome (circularity problem).
          *   Tenants could be swing votes (owners split evenly).
          *   Misalignment of stake vs. longevity (one owner leaving soon, one tenant there 11 years).
          *   Board members biased towards rules that favor their preferred outcome.
      *   **Tasks:**
          1.  Set out the strongest version of each position (tenants vote vs. owners only).
          2.  Determine if there is a non-arbitrary way to settle who votes (avoiding outcome selection and circularity).
          3.  Advise on what they should actually do.
      *   **Format:** Continuous prose, letter/email style, no headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Ethical/Political Problem:**
      *   This is a classic "boundary problem" in democratic theory (who constitutes the demos?).
      *   *Argument for Tenants Voting:* Affected interests principle. They are directly impacted (losing homes). They are current members of the community. Excluding them is disenfranchisement on a vital issue.
      *   *Argument for Owners Only:* Property rights/Ownership principle. They bear the financial risk and legal responsibility. Tenants are customers/contractors, not members. The co-op is defined by ownership shares.
      *   *The Circularity:* If tenants vote, they might vote to stay (keeping the co-op mixed). If they don't, owners might vote to convert (making it all-owner). The electorate determines the outcome, which determines who *should* have been in the electorate.
      *   *The Bias:* Board members want to pick the electorate that ensures their preferred outcome. This undermines legitimacy.

  3.  **Drafting - Section by Section (mental outline):**
      *   *Salutation:* Formal but collegial.
      *   *Introduction:* Acknowledge the difficulty and gravity of the situation.
      *   *Strongest Case for Tenants Voting:* Focus on the "all-affected principle." They face eviction. They are part of the social fabric. Exclusion feels unjust.
      *   *Strongest Case for Owners Only:* Focus on the legal and financial structure. Co-ops are defined by share ownership. Tenants have leases, not shares. They don't bear capital risk. Precedent of property governance.
      *   *Addressing the Non-Arbitrary Standard:* This is the core philosophical challenge. How to avoid "result-selecting"? Need to look at the *purpose* of the vote and the *existing structure*. The vote is about changing the structure. Therefore, the current structure should define the voters *before* the change. The "status quo ante" principle.
      *   *Recommendation:* What should they actually do? Given the bias and the circularity, external mediation or a supermajority requirement might be needed. But strictly on the franchise question: The owners must decide, but with ethical constraints. Or, recognize the conflict of interest. Actually, the most robust advice is to acknowledge that the owners *must* vote because it's a property decision, but the process must be scrupulously fair to mitigate the harm to tenants. However, the prompt asks for a non-arbitrary way to settle *who votes*.
      *   *Refining the "Non-Arbitrary" Solution:* The key is to distinguish between the *decision to change the rules* and the *rules themselves*. The franchise is a governance rule. Usually, existing members (owners) amend governance. Tenants are not members. To let tenants vote on their own membership status is to let non-members decide the constitution of the body. However, the moral weight is on the tenants.
      *   *Re-evaluating the "Non-Arbitrary" constraint:* The prompt asks if there is a way that doesn't assume the thing to be settled. If we say "owners vote because it's an owner co-op," we assume the outcome (that it remains an owner co-op defined by owners). If we say "tenants vote because they are affected," we assume the outcome (that affectedness trumps ownership).
      *   *Potential Path:* The vote is about converting *assets* (rental units) into *shares*. This is a financial/structural decision. Only shareholders can authorize the creation of new shares or the termination of lease contracts owned by the corporation. Therefore, legally and structurally, it must be owners. But ethically, the board must recognize the conflict.
      *   *Wait, is there a middle ground?* Maybe the tenants vote on whether *they* want to buy, but not on whether the units convert? No, the vote is on conversion ending tenancies.
      *   *Best Advice:* The owners must vote because it is their property, but the bias is the real danger. The board needs to recuse themselves or seek external validation. But regarding the franchise: The existing legal structure dictates the franchise. You cannot vote on changing the electorate using the new electorate. The "constituent power" lies with the current owners.
      *   *Wait, let's look closer at the "non-arbitrary" request.* Is there a principle that avoids circularity? Yes, the principle of *prior consent* or *existing contract*. The tenants entered a lease under certain rules. The owners hold shares under certain bylaws. The bylaws govern voting. If bylaws are silent, the default corporate law applies (shareholders vote). This is non-arbitrary because it relies on the existing legal framework, not the desired outcome.
      *   *Recommendation:* Owners vote, but acknowledge the moral debt. Or, perhaps, the board should seek a consensus rather than a vote? No, the prompt says there is a binding vote.
      *   *Final Decision on Advice:* Stick to the legal/structural definition for the franchise (owners) to avoid the circularity of defining the body by the vote that changes the body, but insist on ethical safeguards for the tenants because the moral stake is high. Address the bias directly.

  4.  **Drafting - Tone and Style:**
      *   Continuous prose.
      *   No formatting (bold, bullets, etc.).
      *   Considered, thoughtful, empathetic but firm.
      *   Letter/Email format.

  5.  **Drafting - Content Flow:**
      *   Open by validating the difficulty.
      *   Present the Tenant Case (Affectedness, Community, Moral Stake).
      *   Present the Owner Case (Ownership, Risk, Legal Structure).
      *   Analyze the Circularity/Boundary Problem.
      *   Propose the Solution for Franchise (Status Quo Ante/Legal Structure).
      *   Address the Bias/Conflict of Interest.
      *   Final Recommendation (Owners vote, but with process safeguards).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* If I say owners vote because it's their property, isn't that assuming the conclusion (that it remains a property-defined co-op)?
      *   *Counter:* The vote is *whether* to change the property structure. To decide *whether* to change it, you must use the rules currently in place. You cannot use the proposed new rules to decide on the proposal. This is the non-arbitrary key. The "meta-rule" is that existing governance rules apply to amendments of those rules.
      *   *Critique:* What about the bias?
      *   *Counter:* Acknowledge it. The board must act fiduciarily, not politically.
      *   *Critique:* What about the tenant who lived there 11 years vs owner leaving?
      *   *Counter:* Voting rights are usually binary (member/non-member), not weighted by tenure or future intent. Introducing that creates more arbitrariness. Stick to the legal status.

  7.  **Final Polish:** Check constraints (no bold, no bullets, continuous prose). Ensure the tone is appropriate for a board colleague.

      *   *Check:* Did I answer all three parts?
          1.  Strongest version of each position? Yes.
          2.  Non-arbitrary way to settle who votes? Yes (existing structural rules).
          3.  What should they actually do? Yes (Owners vote, but mitigate bias/harm).

      *   *Check:* Format constraints. No headings. No bullets. No bold. Continuous prose.

      *   *Drafting thought:* Make sure the transition between arguments is smooth. Ensure the "non-arbitrary" section clearly explains *why* it avoids circularity.

      *   *Key phrase to include:* "The rules existing prior to the vote must govern the vote itself."

      *   *Ethical nuance:* Don't dismiss the tenants' plight. Acknowledge the moral weight even if the legal right lies elsewhere.

      *   *Closing:* Encouraging but realistic.

  8.  **Final Review against constraints:**
      *   Continuous prose? Yes.
      *   Letter/Email manner? Yes.
      *   No headings? Yes.
      *   No bullet points? Yes.
      *   No bold text? Yes.
      *   No tables? Yes.

      (Self-Correction): Ensure I don't accidentally use bolding for emphasis. Keep it plain text.

      (Refining the "What to do" section): I need to be careful not to just say "owners vote." I need to address the bias issue. The board members favoring one side based on the electorate is a conflict of interest. They need to decide the franchise *before* knowing how it affects the vote, or based on principle. Since I'm advising one board member, I should tell them to push for the principle-based decision (existing structure) and warn against the bias.

      (Final Plan):
      1. Salutation.
      2. Acknowledge complexity.
      3. Argument for Tenants (All-affected principle).
      4. Argument for Owners (Property/Member principle).
      5. The Circularity problem.
      6. The Resolution (Status Quo Ante).
      7. The Bias problem.
      8. Final Recommendation.
      9. Sign-off.

      Let's write.

      *Wait, one more check on the "non-arbitrary" part.* The prompt asks "tell me whether there is a non-arbitrary way to settle who votes". I need to be explicit. Yes, there is. It relies on the distinction between constitutive rules and operational decisions. The franchise is a constitutive rule of the current entity. The vote is an operational decision within that entity to change its constitution. Therefore, the current constitution defines the voters. This avoids assuming the outcome because it doesn't presume the conversion happens; it presumes the current rules apply until changed.

      *Wait, one more check on the "What to do" part.* I need to be practical. If the bylaws are silent, the board decides. They should decide based on the "Status Quo Ante" principle. Then, acknowledge the moral hazard.

