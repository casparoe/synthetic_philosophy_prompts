answer: |-
  You are a senior analyst at a global health funding body facing two career paths. Option A is leaving for a quantitative finance role, donating 50% of a $600k salary to bednet distribution, saving exactly 40 lives per year with verified delivery data and immediate mortality reduction. Option B is staying to rewrite procurement guidelines for essential medicines, a process requiring seven years of negotiation across multiple sovereign governments before implementation. During those seven years, zero lives are saved attributable to your work, and even post-implementation, statistical noise from local health infrastructure makes isolating your policy's specific mortality reduction impossible for standard evaluators using randomized control trials. However, if successful, the guideline shift reduces drug costs by 35% permanently, enabling savings of 500 lives annually thereafter, though this counterfactual remains statistically opaque.

  **Recommendations and Divergence**
  The **Earn-to-Give (EtG) perspective**, constrained by measurability bias, recommends Option A. Because impact is proxied by verified metrics, the certain 40 lives saved annually outweighs the speculative, unquantifiable potential of Option B. The **Institutional-Critique perspective** recommends Option B. It argues that structural leverage (changing procurement rules) creates a multiplier effect that marginal donations cannot match, and that the lack of short-term metrics is an epistemic limitation of current evaluation tools, not evidence of low impact.

  **Structural Feature**
  The divergence is caused by **attribution lag combined with causal noise**. EtG relies on short causal chains where input (money) links directly to output (nets) to outcome (lives saved). Policy work involves long, nonlinear chains where the outcome is confounded by external variables, making it invisible to metrics-based evaluation in the short-to-medium term.

  **Perfect Evaluator Counterfactual**
  Yes, the views collapse. If a perfect long-term evaluator could accurately quantify the expected value of the policy change despite the lag and noise, the measurability gap disappears. Both perspectives would then compare the true expected values; since the prompt stipulates the policy path is genuinely higher-impact over decades, both would recommend Option B.

  **EA Defense**
  An EA defender accepting measurability bias as unavoidable would argue that **feedback loops are necessary for optimization**. They would break the case by claiming that without metrics, you cannot detect failure modes in the policy path; if the negotiations stall or the rules are circumvented, you might waste decades without knowing. EtG allows for iterative improvement based on data, whereas unmeasurable policy work is "flying blind," making the high-variance, unverified path irrational even if the theoretical ceiling is higher.
