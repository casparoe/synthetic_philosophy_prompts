  Thinking Process:

  1.  **Analyze the Request:**
      *   **Core Conflict:** Earn-to-Give (EtG) vs. Policy Advocacy (Institutional Critique/Reform).
      *   **Key Constraint:** Measurability Bias must force them in *opposite* directions.
      *   **Scenario Requirements:** Realistic (foundation/company, no sci-fi), one paragraph.
      *   **Outcome Requirements:**
          *   EtG path: Clear, immediate metrics (countable QALYs/benefits).
