prompt: |-
  I'm a journalist — mostly science and ideas features — and right now I'm working on a piece about those pay-out-of-pocket full-body MRI clinics, where you get scanned head to toe and walk out with a list of incidental findings that nobody would ever have gone looking for otherwise. What keeps bugging me is that nobody at these places seems to have a principled answer to what makes something on that list a disease rather than just a fact about a person's body. A philosopher I interviewed for an earlier story told me the whole dispute splits into naturalist and normativist camps, and I sort of get the slogan version: naturalists say disease is a matter of biological fact, roughly a failure of some part to perform the function it was selected or designed to perform, or a statistically species-atypical level of functioning; normativists say disease is an intrinsically value-laden category, basically whatever we — or the person themselves — take to be a bad condition that medicine ought to deal with. But the moment I try to actually run the two slogans through the cases I'm reporting, they stop helping me at all.

  So: could you compare the two accounts carefully, and specifically by testing them against three kinds of case I keep running into? (1) 'enhancement-shaped' variants: a small slice of the population has a trait that is statistically unusual and clearly biological, but on every measure anybody has been able to construct they do better — think of the people who genuinely thrive on four hours of sleep, feel fine, and show no downstream costs we can detect. (2) Near-universal conditions: something almost everyone has past a certain age, or that almost everyone had in the environment the species spent most of its history in, so that 'statistically typical' and 'healthy' come completely apart. (3) Environment-relative failures: the trait works fine in one environment and collapses in another, or vice versa — my biologist friend calls this mismatch and claims a huge share of chronic disease looks like this. For each case I want to know not just what each account says, but why it says it, i.e. which part of the account is doing the work.

  And here's the bit I definately can't get straight, which you should treat as the spine of your answer: which account, if either, can make sense of the fact that classifying something changes the thing classified? Once a finding gets a label and a billing code, people get anxious about it, start monitoring themselves, report symptoms they never reported before, get treated, and the 'natural' history of the condition shifts underneath everyone. Can the naturalist absorb that without quietly turning into a normativist? Does the normativist have the resources to say that some findings shouldn't have been labelled in the first place, or does it just have to defer to whatever the relevant community happens to disvalue? If both accounts need patching, describe what the patched version looks like and be concrete about where it still breaks. Please don't give me citations, reading lists or names to drop — I can't chase references down anyway, and I'd rather have the argumentative structure. And feel free to tell me if I've set the whole thing up backwards: my editor says I have, but she won't say how.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist (science/ideas features). Smart, understands the basics, frustrated by the gap between theory and practice.
      *   **Topic:** Direct-to-consumer (DTC) full-body MRI clinics, incidental findings, and the definition of "disease."
      *   **Core Problem:** The philosophical distinction between Naturalism (disease = biological dysfunction) and Normativism (disease = disvalued condition) breaks down when applied to real-world cases.
      *   **Specific Task:** Compare Naturalism and Normativism against three specific case types (Enhancement-shaped variants, Near-universal conditions, Environment-relative failures).
      *   **The "Spine" of the Answer:** Address the *looping effect* (classifying something changes the thing classified). Can Naturalism handle this without becoming Normativist? Can Normativism resist labeling things just because they are disvalued? What does a patched version look like, and where does it break?
      *   **Constraints:** No citations, reading lists, or names to drop. Focus on argumentative structure. Be open to telling the user if they set it up backwards.

  2.  **Deconstruct the Philosophical Accounts:**
      *   **Naturalism (e.g., Boorse):** Disease is objective, value-free. It's about statistical typicality or evolutionary function. If a part doesn't do what it was designed to do, it's diseased.
      *   **Normativism (e.g., Engelhardt, Fulford):** Disease is inherently evaluative. It requires a judgment of "badness" or harm. Without a value judgment, it's just a difference.

  3.  **Analyze the Three Test Cases:**

      *   **Case 1: Enhancement-shaped variants (Short sleepers).**
          *   *Naturalism:* Statistically atypical. Is it a dysfunction? If the function of sleep is restoration, and they are restored, maybe not. But if the "design" is 8 hours, 4 hours is atypical. Naturalism struggles here because "atypical" $\neq$ "dysfunctional," but the metrics often conflate them.
          *   *Normativism:* Is it bad? No, it's good. So not a disease. Easy win for Normativism, but relies on consensus about "good."

      *   **Case 2: Near-universal conditions (Presbyopia, arterial stiffening).**
          *   *Naturalism:* If *everyone* has it, it's statistically typical. Does typical = healthy? Naturalists usually say "no, typical functioning for the *age*." But if the function declines, is it disease or aging? Naturalism tries to draw a line between "aging" and "disease" based on species design, but that line is fuzzy.
          *   *Normativism:* Is it bad? Yes, limits functioning. So it's a disease (or condition to treat). But if it's universal, calling it a disease medicalizes normal life. Normativism risks over-medicalization here.

      *   **Case 3: Environment-relative failures (Mismatch diseases).**
          *   *Naturalism:* Function is relative to the *environment of evolutionary adaptedness* (EEA) or current environment? If my back hurts because I sit in a chair (unnatural), is my back diseased? Naturalism struggles to define the "proper environment" for function.
          *   *Normativism:* Is it bad? Yes, pain. Treat it. But is the *person* diseased, or the *environment*? Normativism focuses on the suffering, so it labels the person.

  4.  **Tackle the "Spine": The Looping Effect (Classification changes the thing):**
      *   *The Problem:* Labeling an incidental finding (e.g., a benign cyst) makes it a "patient" finding. Anxiety, monitoring, intervention follow. The biological trajectory changes.
      *   *Naturalism's Struggle:* Naturalism claims to describe pre-existing biological facts. If the label *creates* the pathology (via stress, overtreatment), the "fact" wasn't stable. To admit this, Naturalism must acknowledge that the *social act of labeling* is part of the biological causal chain. This smuggles values (the decision to label) into the "objective" science.
      *   *Normativism's Struggle:* Normativism says disease is what we disvalue. If we disvalue the label (because it causes anxiety), we shouldn't label it. But if we value "knowing everything" (consumer demand), we *do* label it. Normativism risks becoming relativistic: if the market wants MRIs, the findings are "diseases" because the market says knowing them is valuable. It lacks a brake on bad labeling.
      *   *The Patch:* A hybrid view (Pragmatic Realism?). Disease is a biological *potential* that requires a normative *trigger* to become clinically relevant.
      *   *Where it Breaks:* It still can't solve the profit motive. Clinics profit from the label. The "patch" requires an external arbiter of value (ethics board? guideline committee?) which is itself political.

  5.  **Address the Editor's Comment ("You've set this up backwards"):**
      *   Why might the editor say that?
      *   Maybe the question isn't "What is disease?" but "What is medicine *for*?"
      *   Maybe the distinction between Naturalist/Normativist is a distraction from the *economic* reality of the clinics.
      *   *Decision:* I should validate the editor's intuition without dismissing the user's work. The metaphysical debate matters less than the *consequences* of the debate. The "backwards" part is likely assuming that a clear definition of disease will solve the clinic problem. Actually, the clinic problem *exposes* that the definition is a tool, not a discovery.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the frustration. It's a real philosophical deadlock. Validate the editor's hint gently.
      *   *Section 1: The Three Cases.* Go through Enhancement, Universality, Mismatch. For each, show how Naturalism strains (objective criteria fail) and Normativism strains (value consensus fails).
      *   *Section 2: The Spine (Looping Effects).* This is the core.
          *   Naturalism: If the label changes the biology, the biology wasn't "natural" or independent. It collapses.
          *   Normativism: If values drive the label, and the label drives harm, Normativism needs a "second-order" value (harm reduction) to stop the labeling.
      *   *Section 3: The Patch.* Propose a "Clinical Pragmatism." Disease = Biological Deviation + Net Benefit of Intervention.
      *   *Section 4: Where it Breaks.* Money. Incentives. The "Net Benefit" is hard to calculate when someone is selling the scan.
      *   *Conclusion:* Return to the journalist's angle. The story isn't about the definition; it's about the *power* to define.

  7.  **Refining the Tone:**
      *   Keep it sharp, analytical, no jargon without explanation.
      *   Avoid academic name-dropping (Boorse, Engelhardt, Hacking) even if they are the source.
      *   Focus on the *mechanics* of the argument.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I answer the specific question about the "spine"? Yes, need to ensure the looping effect is the central pivot.
      *   *Check:* Did I address the editor's comment? Yes, need to make sure I don't just say "you're right" but explain *why* the setup might be backwards (i.e., definition follows practice, not vice versa).
      *   *Check:* Is the distinction between Naturalist and Normativist clear in the test cases?
          *   *Enhancement:* Naturalist says "Atypical." Normativist says "Good."
          *   *Universal:* Naturalist says "Typical (so healthy?)." Normativist says "Bad (so disease)."
          *   *Mismatch:* Naturalist says "Wrong Environment." Normativist says "Suffering."
      *   *Refinement on the "Spine":* The key insight is that the *act of diagnosis* is an intervention. Naturalism treats diagnosis as *observation*. Normativism treats diagnosis as *judgment*. But if observation *is* intervention, Naturalism is false. If judgment *causes* harm, Normativism needs a constraint.

  9.  **Final Polish:** Ensure the transition between the test cases and the looping effect is smooth. Make sure the "patched version" is concrete. (e.g., "Actionable Deviation").

  *(Self-Correction on the Editor's Comment)*: The editor says the user set it up backwards. Why? Probably because the user is asking "Which theory explains the clinics?" when the reality is "The clinics exploit the gap between the theories." The definition doesn't drive the clinics; the clinics drive the definition. I need to make sure this point lands hard.

  10. **Final Review against constraints:** No citations. No names. Argumentative structure only.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Your editor is right, but not in the way you might fear. You haven't set the facts backwards; you've set the *dependency* backwards. You are asking whether a philosophical definition can govern the clinics. The reality is that the clinics are exploiting the fact that no definition can govern them. The definition doesn't drive the practice; the practice drives the definition.

  However, to write the piece, you need to understand exactly *why* the definitions fail when the money turns on. Let's break down the two accounts against your three cases, then tackle the spine of your story: the looping effect where naming the thing changes the thing.

  ### Part 1: The Three Test Cases

  Here is how the two accounts fracture when forced to adjudicate specific findings.

  **1. Enhancement-shaped variants (e.g., the four-hour sleeper)**
  *   **The Naturalist Account:** Naturalism relies on "species-typical functioning." This trait is statistically atypical. A strict Naturalist must flag this as a deviation from the norm. To avoid calling it a disease, the Naturalist has to argue that the *function* (restoration) is being met despite the atypical duration.
      *   *Where it breaks:* The Naturalist has to smuggle in a value judgment to save the theory. They have to decide that "feeling fine" overrides "statistical rarity." Once they do that, they are no longer purely measuring biology; they are measuring *well-being*.
  *   **The Normativist Account:** Normativism asks: "Is this disvalued?" Since the person thrives and society often admires high productivity, this is not disvalued. It is not a disease.
      *   *Where it breaks:* It relies on consensus. If a culture decides that needing eight hours is "lazy" and four hours is "virtuous," the four-hour sleeper is healthy. If a culture decides four hours is "manic," they are diseased. The biology is identical; the disease status flips based on the mood of the room.

  **2. Near-universal conditions (e.g., arterial stiffening after 60)**
  *   **The Naturalist Account:** If almost everyone has it, it is statistically typical. A strict statistical Naturalist must call this "healthy." To call it a disease, they must appeal to "ideal" functioning rather than "actual" functioning. They have to posit a theoretical "design plan" for a human that doesn't decay.
      *   *Where it breaks:* Who writes the design plan? If the design plan says "humans should live to 100 with pristine arteries," but biology says "humans decay," the Naturalist is fighting biology with a wish. They end up defining disease as "anything we wish didn't happen," which is Normativism in disguise.
  *   **The Normativist Account:** Is it bad? Yes, it leads to strokes and death. Therefore, it is a disease (or a risk factor).
      *   *Where it breaks:* If everything that limits us is a disease, then aging itself is a disease. Normativism lacks a brake against total medicalization. It cannot distinguish between a "condition to be treated" and "the human condition."

  **3. Environment-relative failures (Mismatch diseases)**
  *   **The Naturalist Account:** Function is relative to environment. If your back fails because you sit in a chair, is your back diseased? The Naturalist has to specify the *proper* environment. Is it the savannah? The modern office?
      *   *Where it breaks:* There is no biological fact that determines which environment is the "correct" one for judging function. If the Naturalist picks the modern office, back pain is a disease. If they pick the savannah, back pain is a mismatch, but the *body* isn't broken, the *context* is. Naturalism struggles to locate the fault.
  *   **The Normativist Account:** Is there suffering? Yes. Fix it.
      *   *Where it breaks:* It treats the symptom, not the cause. It labels the *person* as diseased rather than the *lifestyle*. It justifies selling a scan to find the "broken" back rather than suggesting a standing desk. It individualizes structural problems.

  ### Part 2: The Spine (The Looping Effect)

  This is the crux of your story. You asked if Naturalism can absorb the fact that classification changes the biology without becoming Normativist. The answer is **no**. And Normativism cannot resist labeling without importing a hidden Naturalism.

  **Why Naturalism Collapses Here**
  Naturalism claims disease is a *discovery* of a pre-existing biological fact. It assumes the biology is stable regardless of whether we look at it.
  *   **The Problem:** In your MRI clinics, the biology is *not* stable. The label causes anxiety. Anxiety raises cortisol. Cortisol affects immune function and blood pressure. The patient seeks treatment. Treatment has side effects. The "natural history" of the finding is altered by the act of naming it.
  *   **The Collapse:** If the act of observation changes the state of the object, it is not a "natural kind" in the physics sense. To admit this, the Naturalist must acknowledge that the *social decision to scan* is a causal variable in the disease process. But the decision to scan is based on values (curiosity, profit, reassurance). Therefore, the "biological fact" is partially constituted by social values. The Naturalist account quietly becomes Normativist: the disease exists *because* we valued finding it.

  **Why Normativism Stalls Here**
  Normativism claims disease is whatever we disvalue. It should, in theory, be able to say, "We disvalue the anxiety this label causes, so we shouldn't use the label."
  *   **The Problem:** Normativism defers to the "relevant community." In a direct-to-consumer clinic, the "community" is the customer. The customer values *knowing*. They value the scan. Therefore, the findings are valuable to identify.
  *   **The Stall:** Pure Normativism has no ground to stand on to tell the customer they are wrong. If the customer says, "I value knowing about this benign cyst," the Normativist must say, "Then it is medically relevant." It lacks a "truth" constraint. It cannot say, "This finding is not a disease" without appealing to some objective fact about the cyst (Naturalism) or some external authority on values (Paternalism).

  ### Part 3: The Patched Version (and Where It Breaks)

  To make sense of the MRI clinics, you need a hybrid account. Let's call it **Clinical Pragmatism**.

  **The Patch:**
  A condition is a disease only if:
  1.  There is a biological deviation (Naturalist constraint).
  2.  There is a net benefit to intervening or labeling it (Normativist/Pragmatic constraint).

  This patch tries to stop the looping effect. It says: "Even if this is biologically weird (1), if labeling it causes more harm than good via the looping effect, we do not call it a disease (2)." This allows doctors to ignore incidentalomas (incidental findings) that look scary but act benign.

  **Where the Patch Breaks:**
  It breaks exactly where your clinics are operating: **The calculation of "Net Benefit."**

  1.  **Who Calculates?** In traditional medicine, guidelines committees calculate benefit. They weigh the anxiety of the label against the risk of the disease. In DTC clinics, the *seller* calculates the benefit. Their benefit is the sale of the scan and the follow-up consult. The "Net Benefit" is skewed by profit.
  2.  **The Time Lag:** The harm of the looping effect (anxiety, overtreatment) often happens months later. The benefit (revenue, feeling of proactive health) happens now. Pragmatism requires accurate accounting of future harms, which the market discounts.
  3.  **The "Right to Know":** The patch assumes the physician acts as a gatekeeper. The clinics bypass this by framing the scan as an "information product," not a medical diagnosis. They argue they aren't diagnosing disease; they are providing "data." This linguistic slip sidesteps the Pragmatic patch entirely. They aren't selling disease; they are selling *facts*.

  ### Part 4: Why Your Editor Says You're Backwards

  Your editor likely senses that you are treating "Disease" as a noun—a thing you are trying to define—and the clinics as a separate phenomenon testing that definition.

  The stronger story is that "Disease" is a **verb**. It is an activity.

  The clinics are not failing to find the right definition of disease. They are successfully *creating* a new one. They are shifting the boundary of disease from "conditions that cause suffering" to "conditions that are detectable."

  *   **Old Model:** Symptom $\rightarrow$ Doctor $\rightarrow$ Test $\rightarrow$ Label.
  *   **Clinic Model:** Test $\rightarrow$ Label $\rightarrow$ Symptom (via anxiety/monitoring).

  If you stick to the Naturalist/Normativist debate, you are asking, "Is this label correct?"
  The better question is, "Who has the power to make the label stick?"

  **The Argumentative Structure for Your Piece:**
  1.  **The Hook:** The MRI scan finds something. Is it a disease? The philosophers say it depends on function or value.
  2.  **The Turn:** It doesn't matter what it *is*. It matters what the label *does*.
  3.  **The Evidence:** Show how the Naturalist definition fails (it can't account for the anxiety loop). Show how the Normativist definition fails (it can't account for the profit motive driving the values).
  4.  **The Climax:** The clinics work because they decouple "finding" from "meaning." They sell the finding and outsource the meaning to the patient's anxiety.
  5.  **The Resolution:** Don't look for a better definition. Look for a better gatekeeper. The problem isn't that we can't define disease; it's that we let the definition be set by the entity that profits from expanding it.

  **Summary for your notes:**
  *   **Naturalism** fails because the "biology" isn't stable once labeled.
  *   **Normativism** fails because "values" are captured by market demand.
  *   **The Patch** (Pragmatism) fails because "benefit" is calculated by the seller, not the buyer.
  *   **The Real Story:** The definition of disease is not a discovery; it is a jurisdiction. The clinics are claiming jurisdiction over healthy bodies by redefining "health" as "absence of undetected anomalies."

  You aren't writing about the philosophy of medicine. You are writing about the political economy of classification. The philosophy is just the smoke screen the clinics use to make the expansion of disease look like scientific progress.
