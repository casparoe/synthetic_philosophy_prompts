      *   **Core Question:** What is the difference between "top-down processing" (which they understand) and "cognitive penetration" (which is confusing them)?
      *   **Specific Example:** Believing the sky is bluer makes it *look* bluer. Is this genuine perceptual change, attentional bias, or just reporting bias?
