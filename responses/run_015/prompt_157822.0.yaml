prompt: |-
  I'm giving the toast at my mentor's retirement do next Saturday. She's Swedish-American, built a huge career in Silicon Valley, and the room is split: her American collegues who live by the American Dream, and relatives from Stockholm for whom Jantelagen is still a living thing. There's also the tall poppy syndrome running underneath — Australians and Kiwis know it, but here it's flipped depending on which passport you're holding. I want about four minutes, in British English, and I need the contradiction between celebrating the successful and cutting them down to actually structure what I can say: determine which compliments are permited and which are forbidden, shape the anecdotes that land safely, and don't resolve it with some cheap best-of-both-worlds ending. Let the tension sit there, awkward and unresolved. The idea shouldn't be decoration — it should decide what the speech is allowed to praise and what it has to stay quiet about.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Mentor's retirement do.
      *   **Time:** Next Saturday (irrelevant for content, but sets the scene).
      *   **Honoree:** Swedish-American woman, huge Silicon Valley career.
      *   **Audience:** Split culture.
          *   Group A: American colleagues (American Dream, celebrate success, "tall poppy" = good).
          *   Group B: Swedish relatives (Jantelagen, "you're not better than us," "tall poppy" = cut it down).
          *   Group C: Australians/Kiwis (Tall Poppy Syndrome, but the prompt says it's "flipped depending on which passport you're holding" - implying the Americans ignore it, Swedes embrace the cutting down, Aussies/Kiwis usually cut down but might be confused here). *Correction/Refinement:* The prompt says "Australians and Kiwis know it, but here it's flipped depending on which passport you're holding." This suggests the cultural tension is the core theme.
      *   **Duration:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Language:** British English (spelling, idioms, tone).
      *   **Core Constraint/Theme:** The contradiction between celebrating success and cutting it down must *structure* the speech. It shouldn't just be mentioned; it should dictate what can be praised and what must be omitted.
      *   **Ending:** No cheap resolution. Let the tension sit awkward and unresolved.
      *   **Tone:** Witty, observant, slightly uncomfortable but respectful.

  2.  **Deconstruct the Cultural Conflict:**
      *   *American Dream:* Individual achievement, scaling mountains, changing the world, "you did it!"
      *   *Jantelagen (Law of Jante):* Collective humility, don't think you're special, success is a group effort, "we did it."
      *   *Tall Poppy Syndrome:* Cutting down those who rise too high.
      *   *The Constraint:* I need to praise her without triggering the Swedes' discomfort or boring the Americans with false modesty. I need to acknowledge the silence around certain achievements.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's split. Set the British tone (dry, observational). Establish the premise: praising someone is dangerous here.
      *   **Middle (The Structure of Praise):** Explicitly state what I *can't* say versus what I *can* say.
          *   *Forbidden:* "She's a genius," "She's the best," "She crushed the competition." (Too American/Tall Poppy triggering for Swedes).
          *   *Permitted:* "She worked hard," "She was reliable," "She helped others." (Safe for Jantelagen).
          *   *The Twist:* But she *did* do the big things. How to say it? Hint at it without shouting it.
      *   **Anecdotes:** Need one that works for both. A moment of competence that looks like luck to Swedes and skill to Americans. Or a moment where she defied Jantelagen but claimed she didn't.
      *   **Closing:** Do not resolve. Leave the audience with the feeling that she belongs to both worlds and neither. The applause should feel complicated.

  4.  **Refining the Voice (British English):**
      *   Use "colour," "honour," "centre."
      *   Idioms: "Bit of a pickle," "muck in," "quiet word."
      *   Tone: Understated, self-deprecating, avoiding hyperbole.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hello everyone. It's tricky. Americans love success. Swedes hate boasting. I'm British, so I like complaining. I can't say she's a legend. I can say she turned up on time. She built a company but let's call it "administrative support." She made millions but let's call it "sufficient pension." Actually, she's amazing. But I won't say it too loud. Cheers.
      *Critique:* Too simple. Needs more weight on the structural constraint. The prompt says the idea should *decide* what the speech is allowed to praise.

  6.  **Drafting - Attempt 2 (Focusing on the Constraint):**
      Start by addressing the elephant in the room. The cultural clash.
      "To my left, the Valley. To my right, Stockholm."
      "If I say she's a titan, the Swedes wince. If I say she was just average, the Americans check their watches."
      "So, I have curated my compliments."
      List the forbidden words.
      List the allowed words.
      Tell a story where she succeeded but claimed it was luck.
      End without fixing it.

  7.  **Writing the Speech (incorporating British English & Timing):**
      *   *Word Count Check:* 4 minutes is roughly 500-600 words.
      *   *Key Phrase:* "The architecture of this praise."
      *   *Ending:* Needs to hang in the air.

      *(Self-Correction during drafting)*: Make sure I don't accidentally resolve it. Don't say "But she is both." Say "She is neither, or both, and we are left holding the glasses."

      *Britishisms:* "Proper," "reckon," "queue," "bloody," "torch." (Use sparingly to avoid caricature). Let's stick to syntax and understatement. "Rather," "Quite," "Awkward."

  8.  **Final Polish:**
      *   Check the Jantelagen references. Ensure it's accurate (don't think you're better than us).
      *   Check the Silicon Valley references (disruption, scaling).
      *   Ensure the tension remains.

      *(Reviewing Prompt Constraint)*: "Don't resolve it with some cheap best-of-both-worlds ending. Let the tension sit there, awkward and unresolved."
      *Action:* The final paragraph must not synthesize the two views. It must acknowledge the split remains.

  9.  **Final Word Count Check:** Aiming for ~550 words.

      *(Drafting content)*
      Start with the room layout.
      Move to the "Permitted List."
