      Anecdote: The IPO or a big deal, framed as "keeping the lights on."
      Conclusion: The silence between the claps.

      *Wait, one detail:* "Australians and Kiwis know it, but here it's flipped depending on which passport you're holding." I should acknowledge the Antipodeans briefly as the observers of the tall poppy syndrome, but the main tension is US vs Sweden. I'll mention them as the "referees" who are confused.

      *Let's write.*

