answer: |-
  Good evening. For those who don't know me, I'm [Name], and I've had the privilege of being [Mentor's Name]'s mentee for the last decade.

  Looking around this room, I realise I am standing on a geological fault line. To my left, we have the Silicon Valley contingent. You believe in the exceptional individual. You believe that if you see a tall poppy, you water it, fertilise it, and take it public. To my right, we have the family from Stockholm. You operate under *Jantelagen*. You believe that if you see a tall poppy, you assume it's standing on someone else's shoulders, and you quietly mow it down for the good of the meadow.

  And then there are the Australians and Kiwis in the back, looking utterly confused because the rules of Tall Poppy Syndrome seem to change depending on which passport you're holding.

  As a Brit, I feel quite at home in this discomfort. We generally prefer to apologise for our achievements before we've even committed them. So, I have had to construct this toast very carefully. The cultural tension in this room isn't just the backdrop; it is the editor of this speech. It has dictated what I am allowed to say.

  For example, I am forbidden from saying [Mentor's Name] is a "visionary." To the Americans, that is a fact. To the Swedes, that is an act of aggression. I cannot say she "disrupted the industry," because disruption implies she thought she knew better than everyone else, which violates the collective harmony. I certainly cannot mention the valuation of her last exit. That would require a priest to absolve her in Stockholm, and a ticker tape parade in San Francisco.

  So, what is permitted? I can say she is "reliable." I can say she "worked quite hard." I can say she "helped the team." These are safe compliments. They suggest competence without superiority. They suggest she was a good cog in the machine, rather than the engineer who built it.

  But we know that's not entirely true.

  I recall a board meeting in 2018. The company was bleeding cash. The Americans wanted to pivot aggressively; the European stakeholders wanted to consolidate. [Mentor's Name] sat at the head of the table. She didn't make a speech. She didn't claim credit. She simply slid a spreadsheet across the table that solved the liquidity crisis, muttered something about "everyone pulling their weight," and let the Americans think they'd won.

  She managed to be extraordinary while pretending to be average. It is a specific sort of genius, isn't it? To climb the mountain but tell everyone you just went for a walk in the hills.

  So, I will not raise a glass to her genius, because that makes the Swedes shift in their seats. I will not raise a glass to her humility, because that makes the Americans check their watches.

  I will simply ask you to look at her. She is standing there, holding both passports, belonging to neither. She is the exception that proves the rule, and the rule that hides the exception.

  Please, be careful with your applause. Too loud, and it's arrogance. Too quiet, and it's ingratitude. Let's find that awkward, trembling volume in the middle.

  To [Mentor's Name].
