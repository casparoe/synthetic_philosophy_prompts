answer: |-
  The demandingness objection is widely regarded as the most potent intuitive threat to classical act consequentialism (CAC). Formulated most famously by critics like Bernard Williams and Liam Murphy, the objection posits that if morality requires us to maximize the good, then we are obligated to sacrifice our personal projects, relationships, and resources until we reach the marginal utility of giving. Since this demands a life of near-sainthood, incompatible with human psychology and the integrity of the agent, the theory must be false.

  My verdict is this: The demandingness objection **fails** as a refutation of consequentialism, but it succeeds in exposing a defect in our standard deontic vocabulary. The objection rests on a confused picture of what moral "ought" requires—specifically, the conflation of *axiological optimality* with *enforceable obligation*. Consequently, the version of consequentialism that survives is not Classical Act Consequentialism, with its binary prohibitions, but rather **Scalar Consequentialism**. This view preserves the core consequentialist insight—that consequences determine moral value—while dissolving the paradox of demandingness by rejecting the binary threshold that generates it.

  To understand why the objection fails, we must first dismantle the "Ought Implies Can" (OIC) argument often wielded in its support. Proponents of the demandingness objection argue that because humans are psychologically incapable of sustaining radical self-sacrifice without resentment or burnout, morality cannot require it. If we *cannot* do it, we *ought not* be told to do it.

  This argument relies on a equivocation regarding "can." If "can" means logical possibility, the objection collapses; it is logically possible to donate one's kidney or live on subsistence wages. If "can" means psychological capacity, the argument proves too much. Human psychology is malleable and often resistant to moral truth. That a agent finds a requirement psychologically onerous does not negate the requirement's existence; it merely highlights the agent's moral imperfection. To ground moral truth in contingent psychological limitations is to surrender the normative force of ethics to the status quo of human selfishness. As hardliners like Peter Singer have suggested, the fact that morality is demanding does not make it false; it makes us uncomfortable. Therefore, the OIC argument does not refute the consequentialist criterion of rightness.

  A second line of defense often mounted is **Satisficing Consequentialism**, proposed by Michael Slote. This view suggests agents are required only to produce "good enough" outcomes, not the *best* possible ones. This attempts to cap the demands of morality by introducing a threshold of acceptability. However, this response is theoretically unstable. As many critics have noted, satisficing lacks a rational grounding within the consequentialist framework. If consequences are what matter, why is it permissible to stop at 80% of the available good when achieving 100% is possible at no extra cost to the agent's own core integrity? Satisficing essentially smuggles in a non-consequentialist constraint without justification. It solves the demandingness problem by arbitrarily truncating the theory's own logic, rendering it vulnerable to the charge of irrationality.

  The third line of argument, and the one that points toward the correct resolution, concerns the **Non-Sacrificial Response** and the nature of the "ought." Critics like Liam Murphy argue that in a non-ideal world where others fail to do their fair share, an individual is not required to pick up the slack beyond their "fair share." This attempts to limit demandingness by appealing to collective compliance. While intuitively appealing, this view struggles with the *consequentialist* commitment to outcomes. If a child is drowning, does it matter whether others *should* have saved them but didn't? The consequence (the child's death) remains the same. A theory that prioritizes "fairness of effort" over "goodness of outcome" risks abandoning consequentialism entirely.

  The real source of the demandingness objection is not the requirement to maximize value, but the **binary deontic structure** imposed upon it. The objection assumes that moral "oughts" function like traffic laws: there is a line between compliance (permissible) and violation (forbidden/wrong), and crossing that line warrants blame. Under CAC, almost every act of leisure becomes a "violation" because resources could have been donated. The objector finds it absurd that enjoying a coffee is morally "wrong."

  Here lies the confusion. The objector assumes that if an act is not *optimal*, it must be *forbidden*, and if it is forbidden, the agent is *blameworthy*. This conflates three distinct layers: the **criterion of rightness** (what makes an act best), the **decision procedure** (how we deliberate), and the **theory of blame** (when we sanction agents).

  The demandingness objection succeeds only if we accept that the criterion of rightness must map directly onto a binary obligation that triggers blame. But why must it? We can acknowledge that donating the money is *better* than buying the coffee (axiological ranking) without claiming that buying the coffee is *morally forbidden* in a sense that warrants sanction (deontic status).

  This leads to the only version of consequentialism that survives the scrutiny of the demandingness objection: **Scalar Consequentialism**. Defended by theorists like Alastair Norcross, this view abandons the binary categories of "obligatory," "permissible," and "forbidden." Instead, it posits that acts are simply *better* or *worse* in proportion to the value of their outcomes.

  Under Scalar Consequentialism, the demandingness objection dissolves. It is true that giving away your wealth produces *better* consequences than keeping it. It is also true that keeping it produces *better* consequences than wasting it on destruction. There is no threshold where the agent suddenly becomes "immoral." The "ought" of morality is not a cliff-edge but a slope. The objection rests on the confused picture that morality must provide a sharp line between the saint and the sinner. Scalar Consequentialism admits there is no such line, only degrees of moral merit.

  Does this render morality toothless? Not necessarily. We can couple Scalar Consequentialism with a separate, pragmatic theory of blame. While maximizing is always *better*, we may only *blame* agents for failing to meet a reasonable threshold of sacrifice, acknowledging human psychological limits as a matter of social utility rather than metaphysical rightness. This preserves the objective truth of consequentialism (consequences determine value) while accommodating the intuitive force of the demandingness objection (we cannot reasonably sanction people for living normal lives).

  Therefore, the demandingness objection fails to refute consequentialism because it attacks a straw man: the idea that consequentialism must be binary and sanction-heavy to be true. The objection correctly identifies that *Classical Act Consequentialism* is implausible as a system of blame and social regulation. However, it incorrectly infers from this that the *criterion of rightness* must be modified.

  My verdict is that the objection rests on a confused picture of the moral "ought." It mistakes the *ideal* for the *mandatory*. The version of consequentialism that survives is **Scalar Consequentialism**, potentially supplemented by a rule-based theory of blame for practical application. This view accepts that morality is indeed extremely demanding in terms of value—buying the coffee is genuinely worse than saving a life—but denies that this makes the coffee-buyer a moral transgressor. By decoupling value from binary prohibition, we retain the rigorous honesty of consequentialism without demanding the impossible from human psychology. The objection does not kill the theory; it merely forces it to grow up and abandon the simplistic deontic logic of common-sense morality.
