prompt: |-
  I teach an upper-level seminar in practical rationality, 18 undergraduates, one 75-minute session next Tuesday. We have just finished dominance reasoning in one-shot social dilemmas, and my students can reproduce the argument for defection perfectly while remaining untouched by the rival intuition at the heart of superrationality, namely that when you know the other party is reasoning in exactly the same way from exactly the same instructions, your expectation about what they will do cannot be treated as independent of your own deliberation. A recent hallway conversation with colleagues in economics left me convinced that a lecture will not move them, and I would like them to face a live choice where that symmetry does real work before any label is introduced.

  Design a complete runnable game around a novel case I can present cold, for instance two isolated campus food cooperatives deciding independently whether to pool surplus for a joint weekend market or hold it back for members only, where each group is told in advance that the other group received identical instructions and discussion prompts and knows this symmetry holds. Provide rules, grouping, materials that need no preparation beyond printing, a token-based payoff scheme requiring no money, and a minute-by-minute timeline that fits the session. Participants should first make private predictions and then binding choices, discover the pattern of outcomes, and only afterward hear the name for the reasoning that would have led them to cooperate. Include a debrief that maps specific moments in play onto the conceptual distinction between evidential symmetry and causal independence, a candid account of what will predictably go wrong on a first run and how to recover, and an honest note on which aspect of the view your simulation cannot reproduce and must be supplied by discussion. Take a committed pedagogical stand in the debrief on whether symmetric reasoning genuinely warrants cooperation here, defending that verdict with reasons rather than surveying options for me to choose among. Limit your entire response to at most 750 words.
