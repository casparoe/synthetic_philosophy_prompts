answer: |-
  **Game: The Surplus Dilemma**

  **Case:** Two campus food co-ops decide whether to Pool surplus for a joint market (Cooperate) or Hold for members (Defect).
  **Grouping:** 18 students = 9 pairs. Seat pairs in opposite corners (isolated).
  **Materials:** Printed decision slips (one per student), paper tokens.
  **Payoffs (Tokens):** Both Pool: 3 each; Both Hold: 1 each; One Pool/One Hold: Holder 4, Pooler 0.
  **Critical Instruction:** "Your partner received these exact instructions, knows you did too, and was selected by the same randomization. You are reasoning mirrors."

  **Timeline (75 mins):**
  *   **0–10:** Distribute slips. Read Critical Instruction aloud twice. Answer clarification questions only.
  *   **10–15:** **Private Prediction.** Students write: (1) Their choice, (2) Partner's choice, (3) Reason. Collect slips.
  *   **15–25:** **Deliberation.** Silent. No game theory terms.
  *   **25–30:** **Binding Choice.** Write "Pool" or "Hold" on final slip. Submit.
  *   **30–40:** **Reveal.** Reunite pairs. Reveal choices. Distribute tokens. Record class cooperation rate on board.
  *   **40–75:** **Debrief.**

  **Debrief & Pedagogical Stand:**

  **1. Map the Play:** Contrast prediction slips with choices. Most defectors will predict partner defection. Ask: "If you predicted defection, why did you defect? Did you think you caused it?"

  **2. Concepts:** Introduce **Causal Independence** (my choice doesn't physically move their hand) vs. **Evidential Symmetry** (my choice is evidence of theirs because we share the same reasoning algorithm).

  **3. Predictable Failure:** Students will cling to causal independence ("I can't change their mind"). **Recovery:** Press the symmetry clause. "If you are rational, and they are rational, and inputs are identical, is the output independent? If you choose Hold, you confirm the algorithm outputs Hold. You are choosing the world where both Hold." Ask them to imagine running the code of their own mind; if the code outputs 'Defect', the mirror code outputs 'Defect'.

  **4. Limitation:** The simulation cannot reproduce logical necessity. It relies on empirical correlation of reasoning styles. If students view themselves as unique agents rather than instantiations of a reasoning procedure, the symmetry breaks. This metaphysical shift must be supplied by discussion.

  **5. The Stand:** Symmetric reasoning **warrants cooperation**. Ignoring symmetry is instrumentally irrational. You know your decision correlates with theirs. You prefer (Pool, Pool) to (Hold, Hold). Since you cannot causally influence them, you must influence the *correlation*. Choosing Pool is the only way to make (Pool, Pool) true. To choose Hold is to accept (Hold, Hold) as the cost of a futile attempt at causal leverage. Rationality requires maximizing expected utility given available evidence; the evidence here is that your choice mirrors theirs. Therefore, cooperation is the rational expression of shared agency. Defection treats the correlation as zero, contradicting the explicit instructions. To treat identical reasoning processes as independent is to misunderstand the nature of rationality itself. You are not two agents pushing against each other; you are one reasoning pattern instantiated twice. To defect is to wish that the pattern outputs defection, which yields a lower payoff for the pattern. Thus, cooperation is the only consistent maximization of utility under symmetry.
