      *   *Refinement:* I need to be careful not to say the target *is* in the inputs. I need to say the agent builds a *model* of the target based on inputs.
      *   *Key Distinction:* Proximal vs. Distal objectives. The channel is proximal. The design target is distal. RL usually trains for proximal, hoping it generalizes to distal. Wireheading is breaking the link between proximal and distal.
      *   *The "Cost":* If I reject (3), I commit to the claim that an agent's "goal" is not defined solely by what maximizes its current reward, but by the *mechanism* it uses to select actions. This requires looking at counterfactuals (what would it do if the channel was hackable but cleaning was hard?).
