      *   **Task:** Defend an *ordering* of 3-4 core questions/themes for the 6 pieces. Prioritize upstream questions, genuine openness (not relitigated settled stuff), tractability (no lab work/models needed), and impact on daily journalism (not just philosophy). Critique the homebrew tools. Suggest triggers for reshuffling.

  2.  **Deconstruct the "Adaptationism Mess":**
      *   The core problem isn't that adaptationism is wrong; it's that *pan-adaptationism* (everything is an adaptation) is the default heuristic in science communication, often bypassing null hypotheses (drift, constraint, byproduct).
      *   The "Spandrels" paper is 40+ years old. Why is it still relevant? Because the *incentive structure* of science publishing rewards adaptive stories.
      *   The user wants to move from "Philosophy of Biology" to "Science Journalism Methodology."

  3.  **Evaluate the Homebrew Tools:**
      *   *Base Rate Rule:* This is essentially asking for a *prior probability*. In Bayesian terms, $P(Adaptation | Trait)$. This is a known issue in philosophy (the "reference class problem" in evolutionary psychology). It's a strong journalistic heuristic. *Verdict:* Keep, but refine the name to be less statistical. Maybe "The Null Hypothesis Check."
      *   *Lineage Swap Test:* This tests for *independence from history*. If the story works for humans, chimps, and Martians, it's a functionalist fable, not an evolutionary explanation. This aligns with the "comparative method" requirement in biology. *Verdict:* Strong. It exposes "Just-So Stories."
      *   *Function Drift:* This sounds like *ad hoc hypothesizing* or moving the goalposts. In philosophy, this relates to *falsifiability* and the *Duhem-Quine thesis*. In Evo Psych, it's often called "re-describing the trait." *Verdict:* Real phenomenon, but maybe a subset of a larger issue about *falsifiability*.

  4.  **Determine the Agenda (Ordering & Logic):**
