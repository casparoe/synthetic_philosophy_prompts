          2.  **The History (Phylogeny):** Does the lineage support the story? (Addresses "Lineage Swap").
          3.  **The Mechanism (Variation/Heritability):** Is there actually variation to select on? (Often skipped in human behavior).
          4.  **The Incentive (Why do we do this?):** Why does the press release machine produce these stories? (Sociology of science).

      *   *Refining for 6 Pieces (3-4 Themes):*
