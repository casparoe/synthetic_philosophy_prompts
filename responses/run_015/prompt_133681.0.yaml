      *   *Let's check "Upstream":* Defining the Null is the most upstream. If you don't have a null, you can't test the alternative.
      *   *Let's check "Journalistic Impact":* Knowing the Null stops the headline. Knowing the History stops the "Universal Human Nature" claim. Knowing the Incentives explains *why* the error persists.

  5.  **Critiquing the Homebrew Tools:**
      *   *Base Rate:* It's the "Reference Class Problem." It's valid but hard to calculate. For journalists, it's better framed as "What is the Null Hypothesis?"
      *   *Lineage Swap:* This is essentially the "Comparative Method." It's a standard biological tool, but rarely applied in pop-sci reporting on humans. It's a strong heuristic.
