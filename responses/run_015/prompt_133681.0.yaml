          3.  Move to the *survival* of the claim (Function Drift/Sociology).
          4.  End with the *solution* (Journalistic standards).

      *   *Wait, the prompt asks for 3-4 questions to organize 6 pieces.*
          *   Question 1: **What is the Null?** (Addresses Base Rate).
