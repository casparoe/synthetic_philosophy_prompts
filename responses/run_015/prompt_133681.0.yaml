answer: |-
  This is a sharp brief. You are correctly identifying that the "Spandrels" debate didn't fail because the logic was wrong, but because it never successfully translated into a *workflow* for working scientists, let alone the journalists who translate them. The "nature-nurture is over" recap is indeed filler; the real story is the *production pipeline* of evolutionary explanations.

  Here is a defended agenda for your six features, a critique of your homebrew tools, and a strategy for keeping your editor happy while changing the craft.

  ### Part 1: Critique of Your Homebrew Tools

  Your instincts are methodologically sound, but to sell this to an editor (and to make them useful for reporters), you need to map them to existing literature so you don't look like you're reinventing the wheel, while keeping the *application* novel.

  1.  **The Base Rate Rule:**
      *   **Verdict:** **Keep, but rename.** In philosophy of biology, this is the **Reference Class Problem** applied to priors. In statistics, it's Base Rate Neglect.
      *   **The Trap:** You cannot actually calculate the fraction of traits that are adaptations (we don't know the denominator). If you demand a number, you will get hand-waving.
      *   **The Fix:** Frame it as **"The Null Hypothesis Check."** The journalistic heuristic isn't "give me the percentage," it's "what is the default assumption if selection is *not* the cause?" (e.g., drift, constraint, developmental byproduct). If the press release doesn't name the null, the claim is incomplete. This is tractable: you can ask authors, "What would falsify this?" If they can't answer, the null is undefined.
      *   **Editor Pitch:** This isn't philosophy; it's basic scientific literacy. You wouldn't report a drug trial without a control group. Why report an adaptation without a null model?

  2.  **The Lineage Swap Test:**
      *   **Verdict:** **Strongest Tool.** This is essentially the **Comparative Method**, which is the gold standard in evolutionary biology but routinely ignored in human behavioral evolution.
      *   **The Insight:** You identified the core failure mode: *Ahistorical Functionalism.* If a story works for humans, chimps, and aliens equally well, it is a story about engineering, not evolution.
      *   **The Fix:** Make this your primary litmus test for "Just-So Stories." It is highly tractable for a journalist. You don't need fieldwork; you need to ask, "Is this trait unique to this clade? If not, why did it evolve *here* and *now*?"
      *   **Editor Pitch:** This prevents "Universal Human Nature" headlines that turn out to be WEIRD (Western, Educated, Industrialized, Rich, Democratic) artifacts.

  3.  **Function Drift:**
      *   **Verdict:** **Real, but derivative.** This is **Ad Hoc Rescue** (Lakatos) or the **Duhem-Quine Problem**. It is definitely happening (e.g., a trait claimed to be for mating is later claimed to be for bonding when mating data fails).
      *   **The Trap:** It's hard to prove malice or error without tracking a lab over years.
      *   **The Fix:** Subsume this under the **Incentive Structure** theme. It's not just a logical error; it's a survival strategy in a "publish or perish" environment.
      *   **Editor Pitch:** This explains why bad ideas don't die; they just change costumes.

  ---

  ### Part 2: The Agenda (Three Upstream Questions)

  Do not organize the series by "types of traits" (e.g., one piece on language, one on mating). Organize by **epistemic bottlenecks**. These are the three questions that, if answered, resolve the downstream noise.

  **Ordering Logic:**
  1.  **Method (The Null):** You cannot evaluate a claim if you don't know what it's being compared against. (Upstream).
  2.  **Evidence (The History):** Once the claim is defined, does the historical data support it? (The actual science).
  3.  **System (The Incentive):** Why do we keep accepting claims that fail 1 and 2? (The sociology).

  #### Question 1: What is the Default? (Pieces 1 & 2)
  *   **The Core Issue:** Adaptationism persists because "Adaptation" is treated as the null hypothesis, when it should be the alternative.
  *   **Piece 1 (The Setup):** *The Control Group Missing from the Press Release.*
      *   **Focus:** Interview statisticians and evolutionary biologists about the cost of skipping the null. Use a recent, high-profile "Gene for X" or "Behavior Y" study. Show that without a model for drift or constraint, the p-value is meaningless.
      *   **Journalistic Impact:** Teaches reporters to ask: "What is the non-adaptive explanation you ruled out?"
      *   **Why Upstream:** If you settle that adaptation requires a null, you eliminate 50% of press releases immediately.
  *   **Piece 2 (The Human Exception):** *The Byproduct Defense.*
      *   **Focus:** Focus on human behavior specifically. Many "adaptations" are spandrels of larger brain changes (exaptation). Interview developmental biologists.
      *   **Journalistic Impact:** Stops the "We evolved to do X" headline when "X is a side effect of having a big cortex" is equally plausible.

  #### Question 2: Where is the History? (Pieces 3 & 4)
  *   **The Core Issue:** Evolution is a historical process, but most behavioral evolution stories are ahistorical engineering problems.
  *   **Piece 3 (The Lineage Swap):** *The Universal Story Test.*
      *   **Focus:** Apply your Lineage Swap Test. Take a popular theory (e.g., evolutionary psychology of risk-taking). Ask: "Does this hold for other primates? Other mammals?" If the mechanism is "ancient," where is the phylogeny?
      *   **Journalistic Impact:** Exposes "Just-So Stories" that rely on human intuition rather than comparative data.
      *   **Tractability:** You can do this via literature review and interviewing comparative biologists. No fieldwork needed.
  *   **Piece 4 (The Time Machine):** *Deep Time vs. Recent Past.*
      *   **Focus:** The mismatch between the claimed timescale of selection and the actual stability of the environment. (e.g., "We evolved to crave sugar" vs. the variability of Pleistocene diets).
      *   **Journalistic Impact:** Challenges the "Environment of Evolutionary Adaptedness" (EEA) hand-waving.

  #### Question 3: Who Benefits? (Pieces 5 & 6)
  *   **The Core Issue:** If these methods are standard in biology, why are they absent in reporting? (Function Drift + Incentives).
  *   **Piece 5 (The Survival of the Fittest Story):** *Function Drift in Action.*
      *   **Focus:** Track a specific hypothesis over 20 years. Show how the *function* was redescribed as data failed, without the hypothesis ever being abandoned.
      *   **Journalistic Impact:** Shows readers (and editors) that consistency over time is not evidence of truth; it can be evidence of malleability.
  *   **Piece 6 (The Field Guide):** *How to Report Evolution Without Lying.*
      *   **Focus:** Synthesis. A practical guide for working journalists. Incorporate your Base Rate and Lineage Swap tools here as checklists.
      *   **Journalistic Impact:** This is the deliverable for your editor. It moves from "critique" to "solution."

  ---

  ### Part 3: Why This Ordering?

  1.  **Upstream Leverage:** Question 1 (The Null) is the most upstream. If a reporter learns to spot a missing null hypothesis, they don't need to understand the phylogeny (Question 2) to know the story is weak. It's the highest-yield filter.
  2.  **Genuine Openness:** The "Is adaptation real?" debate is settled (yes). The "Is everything an adaptation?" debate is settled (no). The *open* question is: **What are the institutional barriers to applying the null hypothesis in human behavior?** This is sociologically open and scientifically tractable.
  3.  **Tractability:** You are not modeling drift. You are asking authors, "What is your null?" You are not sequencing genomes. You are asking, "What is the sister taxon doing?" This fits your fellowship constraints.
  4.  **Day-Job Utility:**
      *   *Current State:* You read a press release, feel a vague unease, write the story with a hedge paragraph.
      *   *Post-Series:* You read a press release, check for a null model (Piece 1), check for comparative data (Piece 3), and if missing, you pitch the story as "Controversial/Unproven" rather than "Discovery." This changes the headline, not just the footer.

  ### Part 4: Triggers for Reshuffling

  You have nine months. The landscape can shift. Here is what should make you pivot:

  1.  **The "GWAS Flood" Trigger:** If a massive Genome-Wide Association Study lands showing high polygenicity for a behavior you're covering (e.g., aggression or education), **move Question 1 to the front.** High polygenicity implies drift or complex constraint, making the "Gene for X" adaptation story harder to defend. This makes the "Null Hypothesis" angle urgent news, not just theory.
  2.  **The "AI Function" Trigger:** If AlphaFold-style tools start predicting behavioral function from structure without evolutionary history, **pivot Question 2.** If AI claims to predict function without phylogeny, your "Lineage Swap" test becomes a critique of AI biology. That's a hotter hook.
  3.  **The Retraction Trigger:** If a major Evo Psych paper is retracted due to data fabrication (not just statistical error), **pivot Question 3.** It shifts the focus from "methodological error" to "integrity." You would need to interview editors about peer review standards for adaptive stories.
  4.  **The "Null Model" Breakthrough:** If a lab publishes a widely accepted "Default Model of Human Behavioral Variation" (a quantitative baseline for drift), **scrap Piece 1.** The problem is solved. Move that time to scaling the solution (Piece 6).

  ### Part 5: Managing the Editor

  Your editor is worried about "Inside Baseball." Here is how you translate the agenda for them:

  *   **Don't say:** "We need to discuss the Reference Class Problem."
  *   **Do say:** "We need to ask why science reporters accept claims without control groups."
  *   **Don't say:** "The Lineage Swap Test."
  *   **Do say:** "The Family Tree Test: Why we stop assuming human behavior is unique."
  *   **Don't say:** "Adaptationism vs. Pluralism."
  *   **Do say:** "Why do we prefer simple stories over accurate ones?"

  **The Pitch:** "This series isn't about biology; it's about *quality control*. Just as we wouldn't report a new medical treatment without asking about side effects or placebos, we shouldn't report evolutionary explanations without asking about alternatives or history. This series gives reporters the checklist to do that."

  ### Summary of Defense

  You are avoiding the "Spandrel" trap by not arguing *against* adaptation. You are arguing *for* rigor. By placing the **Null Hypothesis** (Base Rate) upstream of the **Phylogeny** (Lineage Swap), you give journalists a tool they can use on *every* story, not just the philosophical edge cases. By ending with **Incentives** (Function Drift), you explain why the error persists, which satisfies the "investigative" angle of a fellowship.

  This ordering ensures that even if a reader only reads Piece 1, they walk away with a heuristic that changes how they read the next press release. That is the definition of impact.
