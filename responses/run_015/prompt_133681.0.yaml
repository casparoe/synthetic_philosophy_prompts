      *   **Constraints:** Editor says "spandrel" in the first 3 paragraphs is "inside baseball." Needs to justify relevance to working journalists.
      *   **User's Ideas:**
          1.  *Base Rate Rule:* Name reference class & fraction of adaptations.
          2.  *Lineage Swap Test:* Would the story hold if the trait were in a different taxon/ecology? (Usefulness vs. Origin).
