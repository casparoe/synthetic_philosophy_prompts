  On the **Objective Reading**, nothing about the senses changed. The public modes of presentation associated with "Hesperus" and "Phosphorus" remain distinct regardless of the subject's epistemic state. What stayed the same is the semantic value of the expressions themselves. What changed is purely psychological: the Astronomer acquired a belief linking two distinct senses. Consequently, this reading cannot ground the datum that sense was introduced to explain—the difference in cognitive value *for the subject*. If the senses remain distinct, "a is b" should remain distinct from "a is a" in content. The explanation of why the identity becomes trivial for the Astronomer is handed over to a psychological theory of belief storage that the semantics does not model. The semantics explains why the statement is informative *simpliciter*, but not why it ceases to be informative for someone.

  On the **Cognitive Reading**, the senses themselves changed for the subject. Initially, the subject possessed two distinct cognitive modes of presentation. Upon learning the identity, these fused. For the Astronomer, "Hesperus" and "Phosphorus" now share a sense. What stayed the same is the reference and the public name types. What changed is the semantic value relative to the subject. This reading grounds the datum directly: cognitive value differences track sense differences relative to the subject. When senses fuse, cognitive value equalizes.

  Consider the **Double Acquisition Case**: A subject learns "Cicero" from a teacher (as an orator) and later from a text (as a conspirator), failing to realize it is one name. The subject affirms "Cicero was an orator" and denies "Cicero was a conspirator."
  The Cognitive Reading handles this naturally. The subject has two distinct information files labeled "Cicero." Therefore, for this subject, there are two distinct senses associated with the same name type. Substitution fails in attitude ascriptions because the senses differ for the subject.
  The Objective Reading struggles. There is only one name "Cicero" in the public language. Presumably, it has one public sense. If senses are objective, the subject grasps the same sense in both instances. The theory cannot explain the failure of substitution without positing hidden indexicals or claiming the subject is simply irrational, missing the semantic nuance of the cognitive split.

  **Which reading does the work?** The Cognitive Reading does the work for Frege's Puzzle regarding cognitive significance and rationality. The Objective Reading does the work for communication and shared truth-conditions.

  **Compatibility:** Frege demands senses be components of thoughts, thoughts be shareable, and senses be non-private. The Cognitive Reading threatens the last two. If senses fuse upon learning, my sense of "Hesperus" differs from yours until you learn what I know. Senses become private cognitive roles. Thoughts are no longer fully shareable abstract objects. If we retain the Objective Reading to save shareability, we lose the explanation of the Astronomer's trivialization. If we retain the Cognitive Reading to save the explanation of trivialization, we lose the public status of thoughts.

