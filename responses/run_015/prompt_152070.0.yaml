  *(Self-Correction on the "Exclusionary Requirement")*: I initially thought about Causal Efficacy. But actually, **The Transparency/Authority Constraint** is the one that externalists struggle with most. However, **Explanatory Relevance** is what kills internalism. The prompt asks for the one that excludes *otherwise popular candidates*. If we demand *both* Wide Truth-Conditions *and* Narrow Causal Power, we exclude almost everything. But if I must pick one requirement that acts as a filter: **The Explanatory Autonomy Constraint** (Psychological states must be individuated finely enough to explain behavior, but coarsely enough to be generalizable). Actually, let's stick to the student's hunch: The tension between **Wide Individuation** and **Causal Efficacy**. I will frame the "Exclusionary Requirement" as **The Causal-Explanatory Constraint** because it rules out pure interpretivism and pure descriptivism immediately.

  *Wait, re-reading the prompt:* "Tell me which single requirement does the most work in excluding otherwise popular candidates."
  If I set the bar at "Must satisfy Twin Earth intuitions AND First Person Authority," I exclude almost everyone. But that's a conjunction.
