  Actually, the strongest filter for *this specific debate* (Externalism vs. Internalism) is **First-Person Authority**. Externalism naturally threatens it. Internalism preserves it. So demanding Authority excludes radical externalism. Demanding Twin-Earth correctness excludes radical internalism.
