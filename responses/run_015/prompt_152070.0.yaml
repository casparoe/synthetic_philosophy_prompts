prompt: |-
  hey — I'm a third-year PhD student trying to get the lit-review chapter of my third-year paper unstuck, and the paper is basically: can content externalism still do the job that cognitive science wants content to do? By which I mean, a notion of content good enough to underwrite intentional explanation of what people do (the stuff that shows up in ordinary belief-desire explanations and in psychological models), and which at the same time leaves something recognizable of first-person authority standing — you know, the thought that you don't need to go run an experiment on your own taps to know what you're thinking about. My supervisor keeps saying the whole literature is just a disguised dispute about how to individuate natural kinds and that I should stop being impressed by it; I think he's wrong but I can't yet say why in a way he'd accept. So before I read another paper that defends its view by pointing at one case and sneering at the alternatives, I want the spec.

  Write me the desiderata: what a theory of the content of thought and language has to deliver to count as adequate *for that purpose* — which cases it must get right, which puzzles it must dissolve rather than merely stipulate away, which distinctions it has to respect (content vs. extension, wide vs. narrow, having a content vs. how much of one, deference to a community vs. individual understanding) — with the case or consideration behind each requirement, and be explicit about which requirements are non-negotiable and which are really just something one camp happens to care about. The cases I want the list forced to answer, and please add your own: the pre-chemistry Twin Earth setup where the twin stuff is superficially indistinguishable from water; the arthritis-style case where the difference is in the speaker's linguistic community rather than in the physical environment; the swampman-style case where a molecule-for-molecule duplicate of you pops into existence with no causal history at all; the migrated speaker who grows up among the twin stuff and then spends thirty years as a fully competent speaker among us (what happens to the continuity of her beliefs?); a case I made up where the two liquids are indistinguishable by any measurement possible in the actual world and differ only in what they would do under laws that don't obtain here; a split-village case where half the wells in a single community hold one liquid and half the other, and everyone defers to everyone else; and a Twin Earth for an institutional kind — their word for the local currency, or for marriage — where the physical objects and the observable behaviour are the same and only the norms of the practice differ. For each requirement, say what it would even look like to get the case wrong.

  Two things I care about most. First: flag any pair of requirements you suspect can't be jointly satisfied, and if the inconsistency is real say which one you'd drop and what it costs you — I have a sinking feeling that "content has to be wide enough for Twin Earth" and "content has to be narrow enough to be the thing the nervous system is doing" plus authoritative self-knowledge are going to pull apart, and if they do I'd much rather show that the list itself is inconsistent than pick a team. Second: tell me which single requirement does the most work in excluding otherwise popular candidates. Keep the weight on the criteria and the cases behind them; a short scorecard at the end for descriptivism, causal/informational views, teleosemantics, conceptual-role/two-dimensionalist views, interpretivism and the Burge-style social picture is fine, but I'll redo it myself. And please skip any bibliography or reading list — I have those; I want the shape of the problem, not more names.
