answer: |-
  You are right to be suspicious. The sentence "If you don't vote, you can't complain" is a rhetorical slogan, not a philosophical proposition. Its persuasive power comes from its ambiguity; it slides between different meanings of "vote," "complain," and "can't" depending on what the speaker needs it to do in the moment. When you try to pin it to a single, testable claim, it often fractures.

  However, since your seminar is using it to argue about moral obligations (specifically, whether abstention is morally permissible compared to voting for a "lesser evil"), we can reconstruct the slogan into distinct philosophical theses.

  Here is a menu of five distinct interpretations, ordered from trivial/pragmatic to radical/metaphysical.

  ### 1. The Pragmatic Inefficacy Thesis
  *   **Precise Assertion:** If you do not vote, your complaints about the outcome will be causally ineffective in changing future outcomes, so complaining is a waste of time.
  *   **Weight-bearing word:** **"Can't"** (interpreted as *practical inability* or *futility*).
  *   **Plausibility:** **Platitude.** It is generally true that those who do not participate in a system have less leverage to change it.
  *   **Classification:** **Trivial/Pragmatic.**
  *   **Confidence:** **Firm.** This is an empirical claim about political leverage, not morality.
  *   **Relevance to Seminar:** **None.** This does not show the abstainer is *morally* unclean; it only shows they are politically weak. It does not support the claim that one is *required* to vote for the lesser evil, only that complaining afterwards is useless.

  ### 2. The Consistency (Hypocrisy) Thesis
  *   **Precise Assertion:** It is inconsistent to demand that the political system respond to your preferences when you refused to input those preferences into the system.
  *   **Weight-bearing word:** **"Can't"** (interpreted as *logical or rhetorical inconsistency*).
  *   **Plausibility:** **Contested.** It depends on whether voting is the *only* valid form of political input. (e.g., Is protesting input? Is paying taxes input?)
  *   **Classification:** **Contentious Social Norm.**
  *   **Confidence:** **Contested.** Philosophers of action disagree on what counts as inconsistency. Some argue one can consistently reject a system while criticizing its results (e.g., a prisoner criticizing prison conditions didn't "vote" to be there).
  *   **Relevance to Seminar:** **Weak.** This attacks the abstainer's *right to speak*, not their moral purity regarding the election outcome. You can be hypocritical without being responsible for the bad outcome.

  ### 3. The Fair Play (Reciprocity) Thesis
  *   **Precise Assertion:** By accepting the benefits of the government elected (security, infrastructure, law), you incur an obligation to share the burden of selecting that government. To abstain is to "free ride" on the civic labor of others.
  *   **Weight-bearing word:** **"Vote"** (interpreted as *discharging a civic duty*).
  *   **Plausibility:** **Substantive Moral Claim.** This relies on the "Principle of Fair Play."
  *   **Classification:** **Contentious Moral Claim.**
  *   **Confidence:** **Contested.** This is a major debate in political philosophy (e.g., John Rawls vs. Robert Nozick). Does simply receiving benefits create an obligation? What if the "benefits" are imposed without consent?
  *   **Relevance to Seminar:** **Moderate.** This suggests the abstainer is morally blameworthy for *shirking a duty*, but it doesn't necessarily prove they are responsible for the *specific bad policies* of the winner. It makes them a "bad citizen," not necessarily an accomplice to the winner's crimes.

  ### 4. The Complicity (Causal Responsibility) Thesis
  *   **Precise Assertion:** In a close election, abstaining is causally equivalent to voting for the winner, because your vote could have prevented the victory. Therefore, you share moral responsibility for the winner's actions.
  *   **Weight-bearing word:** **"Can't"** (interpreted as *lacking moral standing due to shared guilt*).
  *   **Plausibility:** **Radical/Highly Contested.** This assumes a counterfactual: "If I had voted, the outcome would have changed." In mass elections, the probability of a single vote deciding the outcome is near zero.
  *   **Classification:** **Contentious Moral Claim.**
  *   **Confidence:** **Low/Philosophically Disputed.** Most consequentialist philosophers argue that because the probability of casting the decisive vote is negligible, the expected utility of voting is low. However, *collective* responsibility theorists argue that groups are responsible even if individuals aren't decisive.
  *   **Relevance to Seminar:** **High.** **This is the only thesis that supports your classmate's conclusion.** If abstention makes you *complicit* in the winner's bad acts, then the abstainer is not "morally cleaner" than the lesser-evil voter. They are both responsible for the bad outcome; one tried to mitigate it, the other did not.

  ### 5. The Forfeiture of Standing Thesis
  *   **Precise Assertion:** By choosing not to vote, you voluntarily waive your moral right to register a grievance about the result. You have contractually agreed to accept the outcome by participating in the process, and opted out of that agreement by staying home.
  *   **Weight-bearing word:** **"Can't"** (interpreted as *normative prohibition* or *loss of rights*).
  *   **Plausibility:** **False (in a liberal democracy).** Voting is a right, not a contract. Non-voting is not a legally binding waiver of free speech or moral judgment.
  *   **Classification:** **Straightforwardly False (Legally); Contested (Morally).**
  *   **Confidence:** **Firm (Legally); Contested (Morally).** There is no mechanism by which abstention waives rights. However, some civic republicans argue moral standing is *earned* through participation.
  *   **Relevance to Seminar:** **Moderate.** This silences the abstainer but doesn't necessarily make them morally responsible for the outcome. It says "You have no say," not "You are to blame."

  ---

  ### Addressing Your Core Concern: "Morally Cleaner"

  You asked: *Which of these readings, if true, would show that a principled abstainer is not morally cleaner than someone who holds their nose and votes for the lesser evil?*

  **Only Thesis #4 (The Complicity Thesis) does this work.**

  *   **Theses 1, 2, and 5** are about **Standing**. They argue the abstainer loses the *privilege* of speaking. They leave open the possibility that the abstainer's hands are clean, they just aren't allowed to talk about it.
  *   **Thesis 3 (Fair Play)** argues the abstainer is **Negligent**. They failed a duty. This makes them a "bad citizen," but not necessarily an accomplice to the winner's specific evils.
  *   **Thesis 4 (Complicity)** argues the abstainer is **Responsible**. It claims that by failing to prevent a bad outcome when one could have (in a collective sense), one shares the blame for that outcome.

  **The Problem:** Thesis 4 is the hardest to defend philosophically.
  If you vote for Candidate A (Lesser Evil) and Candidate B (Greater Evil) wins, the voter can say, "I tried to stop B."
  If you abstain and Candidate B wins, the abstainer says, "I did not support B."
  For the abstainer to be *equally* unclean, we must accept that **omission is equivalent to commission** in this context. Many ethicists reject this, especially given the statistical insignificance of a single vote. If your vote wouldn't have changed the result, how are you complicit?

  **Verdict:** Your classmate's line ("If you don't vote, you can't complain") is likely doing **Thesis #2 (Hypocrisy)** work rhetorically, but they are hoping it smuggles in **Thesis #4 (Complicity)** to win the argument about moral cleanliness. It does not successfully smuggle that in without further argument.

  ### The Minor Party Voter & Edge Cases

  You asked whether the readings apply to someone who voted for a losing minor party.

  *   **Thesis 1 (Pragmatic):** Applies even more strongly. They voted, but their vote was less effective.
  *   **Thesis 2 (Hypocrisy):** Does **not** apply. They participated. They can complain.
  *   **Thesis 4 (Complicity):** This is where the slogan breaks. If the minor party voter is "complicit" because they didn't vote for the lesser evil, then the "Lesser Evil Voter" is also complicit for not voting for the *best* candidate. It leads to an infinite regress.
  *   **The "Vote" Ambiguity:** The slogan relies on an equivocation. Sometimes "vote" means "cast a ballot." Sometimes it means "cast a ballot for a viable winner."
      *   If "vote" = cast a ballot: The minor party voter *can* complain. The slogan fails.
      *   If "vote" = support a winner: The slogan becomes **Thesis 4** (Complicity), but it becomes much harder to defend morally (why is supporting a loser morally equivalent to supporting nothing?).

  ### Is the Question Muddled?

  **Yes.**

  You asked: *If my question is muddled... say that plainly instead of producing a menu anyway.*

  The slogan is better understood as **social etiquette** or **political shaming** than a moral claim. It functions to police group behavior, not to describe moral reality.

  1.  **It conflates causal responsibility with moral standing.** (You can be innocent of a crime but still lack the standing to criticize the police response if you broke the law that led to the encounter.)
  2.  **It ignores the "No Acceptable Option" scenario.** If both candidates are morally odious, the duty to vote may vanish. The slogan assumes there is always a "correct" vote to cast.
  3.  **It assumes a false dichotomy.** It implies the only moral options are "Vote for Winner" or "Shut Up." It ignores "Vote Third Party," "Spoil Ballot," "Protest," or "Work to Change the System Long-Term."

  **Final Advice for Your Seminar:**
  If you want to challenge the line, do not attack the *sentiment*. Attack the **mechanism**. Ask your classmate:
  *"Which 'can't' do you mean? Do you mean I literally lack the right to speak (Thesis 5), or do you mean I am morally responsible for the winner's crimes (Thesis 4)? Because if you mean the first, you haven't proved I'm unclean. If you mean the second, you have to prove that my single abstention caused the victory."*

  This forces them to choose between a trivial claim (you're being rude) and a radical, hard-to-defend claim (you are an accomplice). Most will retreat to the trivial one, at which point their argument that you are "not morally cleaner" collapses.
