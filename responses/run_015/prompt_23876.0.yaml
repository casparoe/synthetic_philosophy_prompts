answer: |-
  Good evening, everyone.

  For those of you who don't know me, I had the privilege of being one of [Advisor's Name]'s doctoral students. And for those of you who *do* know me, you know that standing here feels a bit like standing at the front of her seminar room again, waiting to be called on.

  Thirty-eight years. That is a lifetime of office hours, a lifetime of red ink on dissertation drafts, and a lifetime of asking the questions that keep you awake at night. We are here to celebrate a career, but if you know [Advisor's Name], you know she never cared much for careerism. She cared about truth. And she cared about us.

  There is a specific moment that many of us in this room share. It usually happened in the first few weeks of her Philosophy of Religion seminar. She would introduce us to a short, needling paper titled *"Do We Believe in Penal Substitution?"*

  Now, half of you are nodding because you remember the author's name: David Lewis. And the other half are thinking, "Oh, the one who wrote about Narnia?" It doesn't actually matter which Lewis it was, because the question she asked was the same either way. It was a question about the weight of justice, and the cost of love.

  She would put it to us bluntly. She'd say, "If you get a parking ticket, would you let a stranger pay the fine for you?"

  We'd all say yes. Obviously. The debt is discharged. Nobody feels cheated. The books are balanced.

  Then she'd lean forward. "But if you were sentenced to prison, or standing in front of a firing squad... would you let a stranger take your place? And would you call the matter settled?"

  And the room would go quiet. Because we know that punishment, in the deepest human sense, isn't a debt you can wire transfer. It's something that belongs to the guilty. So, she would ask us the question that sat at the center of her own faith: "Which one is the Cross supposed to be? The parking fine? Or the firing squad?"

  For thirty-eight years, she asked that question. And here is the thing that I love most about her, and the thing I want us to honor tonight: She never gave us a tidy answer.

  She never offered us a philosophical workaround. She never said, "Ah, but if you look at it through this specific framework, the tension disappears." She didn't resolve the paradox. She lived inside it.

  I think, at first, some of us found that frustrating. We wanted the solution. We wanted the key that unlocked the door so we could put the puzzle away and go home. But over time, I realized that her refusal to solve the unsolvable was actually a form of care.

  If she had given us a neat answer, she would have told us that the mystery of the atonement is something small enough to fit inside a human argument. By leaving the question open, she was telling us that the Cross is bigger than our logic. She was teaching us that faith isn't about having the right explanation for how justice works; it's about standing in awe of the fact that love found a way to work it out anyway.

  She was a wholehearted believer in the power of that sacrifice. But she was also honest enough to admit that our minds struggle to hold the weight of it. She taught us that you can have a fierce intellect and a humble heart. You can ask the hardest questions without demanding that God answer them on your terms.

  To her colleagues and former students: She taught us that theology is not a game of winning points. It is the act of thinking deeply enough to realize how much you need grace.

  To her congregation and family: She loved you with that same honesty. She never offered you a cheap grace that ignored the cost. She offered you a presence that said, "I don't have all the answers, but I know who does, and I will walk with you through the question."

  In a world that is obsessed with certainty, with quick takes and definitive opinions, [Advisor's Name] gave us the gift of holy curiosity. She taught us that some mysteries are not problems to be solved, but realities to be inhabited.

  So, I would like to propose a toast.

  To [Advisor's Name]. Thank you for the parking fines you helped us pay, and for the firing squads you helped us face. Thank you for teaching us that the books are balanced not by our understanding, but by His sacrifice. And thank you for showing us that the most loving thing a teacher can do is sometimes to leave the question open, so that we have room to grow into the answer.

  To thirty-eight years of faith, questions, and love. Cheers.
