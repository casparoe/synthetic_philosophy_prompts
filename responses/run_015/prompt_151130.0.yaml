  You have stumbled onto the exact tension that makes Augustine's ethics of lying so difficult and enduring. Your intuitions are mostly coherent with a modified deontological framework, but you have one fatal contradiction in your dataset that you need to address before you write the paper.

  Here is the blunt assessment: **Verdicts A and G are logically incompatible.** In Case A, you say lying is "required" to save your roommate. In Case G, you say silence is "better" than lying, even if it gets the roommate killed. If lying is *required* in A, then silence in G is morally forbidden (because it fails the requirement). If silence is *better* in G, then lying in A cannot be *required* (it might be permitted, but not obligatory). You cannot hold both positions simultaneously without qualifying the threat level or the agent's responsibility. Augustine would side with G (never lie, even to save a life), while a consequentialist would side with A (lie to save the life). Your gut wants both the purity of G and the safety of A.

  Regarding Case H: Your intuition here is classically Augustinian. Augustine defines a lie not by the falsity of the statement, but by the *will to deceive* (*voluntas fallendi*). If you speak truth believing it false with intent to mislead, you are lying in your heart. This aligns with your gut and saves you from a purely factual definition of lying.

  Regarding Cases D and E: The difference here is likely *agency*. The dementia patient (D) lacks the capacity to process the truth for their spiritual or practical good; the terminal patient (E) retains agency and may need the truth to prepare for death (or settle affairs). Augustine would forbid both, but a "Relational" principle distinguishes them based on the recipient's capacity to receive the truth.

  Below are three candidate principles. The first tries to save most of your intuitions (including A and G) by introducing a threshold. The second holds the strict Augustinian line (challenging your gut on A, B, D). The third focuses on the relational damage (handling D vs E well).

