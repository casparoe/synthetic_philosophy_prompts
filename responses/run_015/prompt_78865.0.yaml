      *   *Key Insight:* Phenomenology (how it feels) trumps Ontology (how it is) for fiction. The reader *lives* in the Cartesian Theater, even if the brain doesn't.

  5.  **Addressing the Philosophical Challenge (Dennett vs. The Metaphor):**
