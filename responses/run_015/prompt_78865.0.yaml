      *   **Tone:** Intellectual, respectful of the craft, philosophically rigorous but accessible, creative.

  2.  **Deconstruct the Cartesian Theater vs. Multiple Drafts:**
      *   *Cartesian Theater:* There is a central place in the brain where "it all comes together." A homunculus watches the show. Linear time. Singular experience.
      *   *Dennett's Multiple Drafts:* No central place. Parallel processing. Narratives are revised constantly. "Fame in the brain" (content becomes conscious when it influences other systems widely). No hard stop between conscious/unconscious.
      *   *The Writer's Utility:* The theater model creates *focus*, *tension*, and *subjectivity*. It's phenomenologically true (it feels like a theater) even if ontologically false (the brain isn't built like one).

  3.  **Drafting the Correspondence Table:**
      *   *Stage:* Working memory / Global Workspace. (Holds: limited capacity. Breaks: not a physical location).
      *   *Audience:* The reader? Or the rest of the brain? (Holds: passive observation. Breaks: the audience *changes* the play).
