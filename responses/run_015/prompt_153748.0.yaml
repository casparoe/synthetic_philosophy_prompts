  Build me a one-paragraph thought experiment set in a normal office — nothing sci-fi, no trolleys. The case should feature an employee who discovers a serious safety flaw. Engineer it so that Williams-style internalism denies they have any reason to report it: their motivational set is genuinely closed, meaning no sound deliberative path from their existing desires could generate the relevant concern, perhaps because of an institutional loyalty they can't rationally revise. Meanwhile, they possess an apparent internal reason to stay quiet that depends on a false belief about their own psychologcal behaviour — they think they're risk-averse, but in fact they're not. I want a Scanlon-style externalist to say the reporting reason is real and weighty, while internalism undermines both the reporting reason and the silence reason, though for different structural causes. After describing the scenario, analyse the verdict each view gives, pinpoint the feature that makes internalism peel away (likely the closure of the motivational set plus self-misrecognition), and explain what happens to the case if we remove the opacity and make the agent's psychology fully transparant to them. Please answer in American English, keep it casual, and don't bother with citations or reading lists — just reason through it.
