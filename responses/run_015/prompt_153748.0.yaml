answer: |-
  Mark, a senior analyst at Apex Logistics, uncovers faulty wiring in the server room that poses a severe fire hazard, yet his entire psychological makeup is consumed by an unshakeable, identity-constituting loyalty to Apex that precludes any deliberative route to caring about external safety outcomes. He believes he has a reason to stay quiet because he's convinced he's personally risk-averse and would be fired for speaking up, but in reality, management encourages transparency and he holds tenure, making that fear factually wrong. Consequently, Mark sits on the information, driven by a motivational set that cannot generate a pro-reporting desire and a false belief about his own vulnerability that generates a pseudo-reason for silence.

  Here's how the views split on this. A Scanlon-style externalist says Mark has a massive, objective reason to report the flaw because reasonable people couldn't reject a principle requiring us to prevent harm, regardless of what Mark wants or believes. His loyalty and fears are irrelevant; the reason exists out there in the moral landscape, waiting to be acknowledged. Williams-style internalism, though, leaves Mark normatively stranded. It denies he has a reason to report because there's no sound deliberative path from his current motivational set (that closed-off loyalty) to safety concerns. Simultaneously, it undermines his reason to stay quiet because that reason relies on a false belief about getting fired. So, internalism says Mark has *no* reasons either way—he's not irrational for staying quiet, but he's not rationally guided to speak up either.

  The feature that makes internalism peel away here is the combo of a closed motivational set and self-opacity. Because Mark's loyalty blocks any bridge to safety values, and his misunderstanding of his own job security creates a phantom reason, internalism washes out all normative force. If we remove the opacity and make Mark's psychology fully transparent, he realizes he won't get fired. That kills the false reason to stay quiet immediately. However, it doesn't help the reporting side; since his motivational set is still closed by loyalty, internalism still says he has no reason to report. The gap widens: Externalism still demands he act, while Internalism says he literally has no reason to do anything, highlighting how internalism can leave agents adrift even when they know all the facts about themselves.
