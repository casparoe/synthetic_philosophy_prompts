prompt: |-
  ok so i've been trying to work out my own line between manipulation and just being convincing, and i want a consistency check before i commit to it. here's roughly where i've landed:

  1. i think manipulation isn't about making people emotional - it's specifically what i call "rerouting": arranging things so other options literally don't come to mind, not just that one option looks better.

  2. but "redirecting" - highlighting true facts that favor your view - is fine, as long as the other options are technically visible if you go looking.

  3. i think emotional appeals with true info, like those lung-cancer photos on cig packs, are legit persuasion not manipulation, since you can still reject it and the other path is right there.

  4. in politics or debate i think it's okay to frame your issue so your side sounds like common sense, long as you don't flat-out lie. that's just playing the game well.

  5. i also think the standard should depend on who you're talking to. with smart adults, framing is okay even if it reroutes them a bit, because they should be able to see through it. but with kids or people with cognative issues, the same framing is manipulation since they can't.

  6. and intent doesn't save you - if someone's reasoning actually gets rerouted, it's manipulation regardless of whether you meant well.

  does this hang together? i'm especialy worried that point 4 clashes with point 1 and 6, since political framing sounds like rerouting. and is there a hidden tension between point 5 and point 1/6, like my "they should see through it" idea fighting with my "actual effect matters" idea? please rank the tensions worst to least bad, say which belief has to give for each, and tell me if point 3 is actually in trouble or if i'm inventing that problem. don't just list them equally - i want to know which one's the real weak link.
