      *   **Task:** Provide a structured argument to break the circle, address three specific questions (defensible reason for rotation? Skeptic's objection validity/transparency? Open Conventions?), and identify weak points in the reasoning (where the argument might break).
      *   **Constraint:** Skip generic mediation advice. Focus on the philosophical/practical substance.

  2.  **Deconstruct the Philosophical Problems:**
      *   **Problem 1: The Origin Fallacy (Genetic Fallacy vs. Normative Authority).** The Skeptic argues that because the *origin* was arbitrary, the *current norm* lacks authority. This is a classic genetic fallacy, but it touches on Humean is/ought problems and Lockean consent. Does tradition confer obligation?
      *   **Problem 2: Coordination vs. Optimization.** The rotation is a *coordination equilibrium*. It solves the problem of "who teaches what" without constant negotiation. The Skeptic wants *optimization* (best person for each course). Optimization requires more information/energy and creates conflict. Coordination requires less energy but might be suboptimal.
      *   **Problem 3: Transaction Costs & Stability.** "Open Conventions" eliminates transaction costs of tradition but maximizes transaction costs of deliberation. It risks turning every year into a constitutional convention.
      *   **Problem 4: Transparency.** Is recording the origin an act of honesty or an act of subversion?

  3.  **Drafting the Arguments (Iterative Process):**

