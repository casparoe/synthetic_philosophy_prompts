  *(Self-Correction on the Transparency point)*: I need to be careful. Transparency is usually good. Why is this bad? Because it's *selective* transparency designed to undermine legitimacy. It's not "here are our rules," it's "here is why our rules are silly." I should argue for a different framing if transparency is demanded.

