answer: |-
  This is a classic problem of normative authority versus historical contingency. You are circling because you are trying to justify a *practice* using the logic of its *origin*, while your colleagues are attacking the *origin* to undermine the *practice*.

  Here is the breakdown of the philosophical machinery at work, structured for your meeting preparation.

  ### 1. The Rotation: Coordination vs. Optimization
  **The Argument:** The defensible reason to keep the rotation is not that it is old, but that it is a **convention** in the David Lewis sense. It is a coordination equilibrium.

  The Skeptic is arguing for *optimization* (best person for each course). You are arguing for *coordination* (everyone knows what to expect so we can plan research, sabbaticals, and lives). In a seven-person department, the transaction costs of optimizing teaching assignments every year (negotiating, trading, assessing "best fit") are incredibly high. They consume social capital and create opportunities for resentment ("Why does *she* get to teach Nietzsche again?").

  The "Hat" is irrelevant. The authority of the rotation derives from **mutual reliance**. We follow it not because the 1995 Chair was wise, but because *everyone else expects us to follow it*, and violating that expectation imposes costs on the group.

  **Meeting Line:** "The authority of the rotation doesn't come from the hat; it comes from the fact that it allows us to plan our lives and research without negotiating every June. It's a Schelling point, not a divine commandment. We keep it because it solves the coordination problem, not because it's sacred."

  **Where this breaks:** If the mismatch between faculty expertise and assigned courses becomes so severe that it demonstrably harms student education or faculty research output to a degree that outweighs the coordination benefits.
  **Change my mind:** Show me data (or a credible consensus) that the current rotation is causing significant pedagogical failure or blocking tenure-case research for multiple members. If the "coordination tax" is higher than the "optimization gain," the convention fails.

  ### 2. The Skeptic: The Genetic Fallacy and "Transparency"
  **The Argument:** The Skeptic is committing the **genetic fallacy**. He assumes that because the *cause* of the rule was arbitrary (chance), the *justification* for the rule must also be arbitrary. This is false. Many stable institutions begin in violence or chance but are sustained by consent and utility.

  His claim that compliance is based on "fear or convenience" is a cynical reduction of **tacit consent**. By staying in the department, accepting the schedule, and benefiting from the stability the schedule provides, colleagues have ratified the convention.

  **On the Transparency Line:** Do not support adding the line as phrased. Recording that the origin was a "random draw" is not neutral transparency; it is a **rhetorical act of delegitimization**. It frames the rule as a joke. If you must record history, frame it as "historical contingency stabilized by long-term departmental agreement."

  **Meeting Line:** "Almost every institution has an accidental origin. That doesn't void its current authority, which rests on our continued participation. Adding the 'hat' line to the handbook isn't transparency; it's framing the rule as illegitimate. If we want transparency, let's document the *current rationale* (stability and planning), not just the origin story."

  **Where this breaks:** If the "fear/convenience" claim is actually true for specific vulnerable members (e.g., non-tenured track or junior faculty who feel they cannot object without penalty).
  **Change my mind:** If a junior colleague confirms privately that they feel coerced into the rotation despite it harming their career, and that they believe dissent would impact their tenure vote. If the "consent" is not tacit but forced by power asymmetry, the obligation dissolves.

  ### 3. Open Conventions: The Rationalist Fallacy
  **The Argument:** The "Open Conventions" proposal is dangerous. It assumes that every rule must be justified by explicit reason every year. This is what Michael Oakeshott called **rationalism in politics**: the belief that nothing is valid unless it can be derived from first principles in the present moment.

  This ignores the value of **presumption**. We need a presumption in favor of the status quo not because the status quo is perfect, but because *re-arguing everything is exhausting*. It turns the department into a permanent constitutional convention. It privileges those with the most time and rhetorical skill (often senior, tenured, or simply louder voices) and punishes those who just want to get on with their work. It also prevents long-term planning (e.g., developing a new course sequence over 3 years) because any course could be stripped from you next year based on a new argument.

  **Meeting Line:** "Open Conventions sounds democratic, but it eliminates the presumption of stability. It forces us to spend our intellectual energy re-litigating administrative basics every year. It privileges the articulate over the quiet, and makes long-term curriculum planning impossible. We should review the rotation periodically, not annually from scratch."

  **Where this breaks:** If the current rotation is actually masking deep, unresolved inequities (e.g., women or minority faculty are systematically stuck with high-enrollment intro courses while others teach seminars).
  **Change my mind:** If it can be shown that the "stability" of the rotation is actually preserving a hidden hierarchy or unfair burden distribution that *cannot* be addressed within the current system. If the status quo is actively unjust, "presumption" becomes complicity.

  ### Summary for the Meeting
  You have a coherent position that avoids the "because it's old" trap:

  1.  **Defend the Rotation** as a **coordination convention** (valuable for stability/planning), not a sacred tradition.
  2.  **Reject the Transparency Line** as phrased, because it is a **rhetorical delegitimization**, not neutral data. Offer a neutral alternative if pressed.
  3.  **Oppose Open Conventions** as **administrative rationalism** that incurs high transaction costs and threatens long-term planning. Propose a **sunset clause** instead (e.g., "Review the rotation every 5 years") to satisfy the desire for accountability without the chaos of annual re-argument.

  ### Final Check on Your Intuitions
  *   **Your intuition on the Skeptic:** You are right. Origin does not determine validity. But acknowledge his point: if the rotation *stops* serving a function, it should go.
  *   **Your intuition on Open Conventions:** You are right. It sounds fair but functions as a tyranny of the articulate.
  *   **The "Circle":** You were circling because you were trying to find *moral* weight in the *hat*. Stop looking there. The weight is in the *current utility of the agreement*.

  **One caveat:** If the Skeptic is actually arguing that the *distribution of labor* is unfair (e.g., he is teaching 4 sections of Intro while others teach 1 seminar), his "origin" argument is just a weapon for a real grievance about workload. Ensure you separate the *procedure* (the rotation) from the *outcome* (the workload). If the outcome is fair, the procedure's origin doesn't matter. If the outcome is unfair, the procedure needs changing, regardless of the hat.
