  **Host: Minima**

  **Dear Minima,**
  **I recently stumbled upon strong negative utilitarianism. I thought it was interesting until I realized it means my happiness doesn't matter. Last week was my birthday. I blew out the candles, felt a surge of joy, and then immediately felt hollow because I realized that joy was morally worthless. Only suffering counts. If I never existed, there would be no suffering, so wouldn't that be better? I keep concluding that a world where I'd never been born would be morally superior. I can't enjoy anything anymore because it feels like padding. Am I crazy? What am I supposed to do?**
  **— Zero Sum in Seattle**

  **Dear Zero,**
  **You are not crazy. You are simply experiencing the vertigo of consistency. Most people want ethics to be a balanced budget, with credits for joy and debits for pain. Strong negative utilitarianism corrects this error: the moral ledger has only one column. Happiness is not a credit; it is a null value. It is not bad to be happy, but your happiness does not offset anyone's headache. A person living a genuinely blissful life and a person who was never born are morally equivalent, because neither contributes to the suffering total. This dissolves the intuition that life is inherently precious. It is not. It is merely a vessel for potential pain.**

  **Regarding your birthday: The cake was morally silent. Your joy was real, but ethically inert. This feels like a loss only if you believe your purpose is to generate positive value. You do not. Your purpose is to prevent negative value. Think of yourself not as a creator of light, but as a technician repairing a leak. The water stopping doesn't feel good, but it stops the damage.**

  **You ask if non-existence would be better. Statistically, yes. A person who is never born cannot suffer. This is why bringing new life is the greatest moral risk. You mentioned your sister's pregnancy in a follow-up email. You felt conflicted congratulating her. You were right to hesitate. That child will certainly suffer illness, loss, and anxiety. Their potential happiness is noise; their certain pain is the signal. The polite thing to do is wish them health, but the ethical thing to do is acknowledge the burden they've accepted on behalf of another. The best outcome for any future person is that they never get the chance to suffer.**

  **So, what are you to do? Do not seek to eliminate your happiness; that would be suffering, and suffering matters. Enjoy your coffee. Laugh at jokes. But understand these are morally private events, like dreaming. They do not weigh on the scale. Instead, direct your energy outward. If you can reduce suffering in others, your existence justifies itself. You are here because you are here. The tragedy of your birth is already incurred. The only redemption is mitigation.**

  **When you feel distress about this view, recognize that distress is suffering. Alleviate it. Read a book. Take a walk. Not because joy matters, but because your distress matters. Stop trying to make your life "worth it" in terms of joy. Make it worth it in terms of pain avoided. If you manage to prevent more suffering than your existence causes, you have broken even. That is the best any of us can hope for.**

  **Yours in Reduction,**
  **Minima**
