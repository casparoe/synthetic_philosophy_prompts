answer: |-
  Dear Colleague,

  It is a pleasure to hear from a fellow scientist turning their hand to metaphysics, and your choice of the quartz crystal is inspired. It will carry the hour, provided you treat it not merely as an illustration but as the sole datum from which the theories are constructed. The strength of your example lies in its isolation of intrinsic change from mereological change. A burning candle loses matter, which invites confusion about whether the object is the matter or the form, and an ageing person invites psychological theories of identity that muddy the metaphysical waters. The Ship of Theseus is useful only later, as a stress test for boundaries, because it focuses on part replacement rather than property change. Your crystal has clear boundaries, constant matter, and a sharp shift in intrinsic symmetry and density. This is exactly what is required to force the disagreement into the open. What such an example must have is a property that is genuinely intrinsic, not relational, and what it must lack is any ambiguity about whether the object at time one is the object at time two. Your capsule ensures this. You should begin the session by drawing the capsule on the blackboard and tracing its timeline. Describe the heating, the transition, and the cooling. Establish the intuition that everyone shares: it is one object, it is the same matter, yet it possesses incompatible properties at different times. This datum must be on the board before you introduce the words endurantism or perdurantism. If you define the theories first, the clergyman will be correct that they sound like mere vocabulary choices. If you establish the puzzle of change first, the theories become competing solutions to a logical problem.

  Once the phenomenon is established, your second move must be to separate the question of persistence from the question of the reality of past and future. This is the most critical juncture for your audience. The two engineers who have read popular physics will conflate endurantism with presentism and perdurantism with eternalism, assuming special relativity has settled the matter. You must interrupt this conflation before it takes root. Draw a timeline on the board and mark the past, present, and future. State clearly that both endurantists and perdurantists can agree on whether past and future times are real. The disagreement is not about the reality of time, but about how an object occupies time. You must prevent the error that endurantism denies the reality of the past, and you must prevent the error that special relativity forces perdurantism. Bracket the relativity argument immediately by stating that while physics constrains metaphysics, it does not dictate this specific ontological choice, and that you will not be discussing the physics of spacetime today. This heads off the physicists before they dominate the conversation. Only after this separation should you describe the two accounts. Use the crystal to explain them. For the endurantist, the whole crystal is present at every moment of its history, bearing different properties at different times. For the perdurantist, the crystal is a spacetime worm, and only a temporal part of it is present at any moment. Use the blackboard to draw the worm versus the moving point.

  The argument from temporary intrinsics should enter only after both accounts are described. This is the logical engine of the dispute. Explain that if the crystal is wholly present at time one and wholly present at time two, and it is dense at time one and not dense at time two, then the one object has contradictory properties. The endurantist must say properties are indexed to times, so the object is dense-at-t1 and not dense-at-t2. The perdurantist says the t1-part is dense and the t2-part is not dense, so there is no contradiction. This is where the stakes become clear. It is here that you should let the clergyman's objection surface. When he suggests this is merely a difference in wording, do not correct him immediately. Instead, ask the group whether indexing properties to times changes the nature of the property itself. Let them debate whether dense-at-t1 is a different property from dense. This turns the verbal dispute objection into a tool for probing the metaphysical cost of each view. If it is merely verbal, the cost should be negligible. If one view requires us to accept that properties are relations to times while the other requires us to accept that objects have parts we cannot touch, then the quarrel is substantive. You should deliberately let the verbal dispute surface here to use it as a measure of ontological commitment, whereas you should prevent the relativity objection from arising at all until the end, and even then only to dismiss it as outside the scope of the session.

  Regarding the misconceptions your audience will bring, you must be vigilant about the nature of temporal parts. The engineers may visualize a temporal part as a spatial slice laid out along a fourth dimension, treating time as just another space direction. You must correct this by emphasizing that temporal parts are not accessible spatially; we do not see the past part of the worm. Another error is that perdurantism denies change. You must clarify that perdurantism denies qualitative change in the whole object but allows variation across parts, just as a road changes from smooth to rough without the road itself changing. This should be addressed when you introduce the perdurantist account. The error that endurantism implies only the present is real must be headed off in the second move when you separate persistence from time ontology. If you wait until the end to correct these, the audience will have built their understanding on faulty foundations. The quartz example works because it strips away the emotional and biological baggage of the ageing person, but it risks feeling too abstract. To ground it, you should introduce the Ship of Theseus in the last fifteen minutes as a test. Ask them whether the ship persists if the planks are replaced. This tests whether their commitment to endurantism or perdurantism holds when matter changes, whereas the crystal tested when properties change. If they stick with their earlier choice, they understand the principle. If they switch, they were likely reasoning from the example rather than the theory.

  For the final five minutes, you need a question that tests their grasp of the disagreement rather than their memory of the definitions. Do not ask them to define endurantism. Instead, pose this scenario. Suppose we could freeze the crystal at the moment of transition and keep it there forever. Ask them whether, in that frozen moment, the crystal possesses the property of symmetry or not. The endurantist must say it possesses it wholly at that moment. The perdurantist must say that the temporal part at that moment possesses it, but the whole worm does not, because the worm includes the non-symmetric parts. If they answer that the object simply has the property and leave it at that, they have not grasped the disagreement. If they hesitate and ask whether we are talking about the object at the time or the object across time, they have understood the distinction. This question forces them to apply the logic of temporary intrinsics to a static case, revealing whether they see the object as wholly present or extended.

  Finally, there are topics you must openly refuse to enter, and you should offer a specific apology for each to show respect for their curiosity while maintaining boundaries. You must refuse to discuss branching or fission cases, such as what happens if the crystal splits into two, and your apology is that these cases complicate identity conditions rather than persistence conditions. You must refuse to discuss the relativity argument in detail, and your apology is that it belongs to physics rather than metaphysics and would consume the hour without settling the ontological question. You must refuse to discuss constitution puzzles, such as whether the crystal is identical to the lump of quartz, and your apology is that this concerns what the object is made of rather than how it persists. You must also refuse to settle whether the dispute is substantive or verbal, and your apology is that this is a meta-ontological question that requires a prior understanding of the positions themselves. By offering these apologies, you acknowledge the depth of their questions while protecting the structure of the session.

  I hope this plan serves you well. Your background in materials science gives you a unique authority to handle the quartz example with precision, and your audience will respect that rigor. If you keep the focus on the logical problem of incompatible properties rather than the physics of time, you will guide them through the distinction successfully.

  Yours sincerely,

  A Friend in Philosophy
