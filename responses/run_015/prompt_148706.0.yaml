      *   **The Commitment:** I need to take a stance. The user's critique is stronger philosophically. DAR is a band-aid for testimonial injustice but fails against hermeneutical injustice. In fact, strict blinding can *worsen* hermeneutical injustice by stripping context needed to evaluate qualitative work properly.

