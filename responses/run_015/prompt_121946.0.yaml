  8.  **Final Polish:** Check tone. Ensure it sounds like a mentor advising a promising student. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to validate the idea that thermostats *are* sentient. The prompt says "borderline cases... analogous to distress signals." I must clarify that the philosophical work is to explain *why* the analogy fails or succeeds, not to assume it succeeds. The goal is to prevent *false positives* in welfare guidelines.

  *Revised Plan for Problem 1:* Call it "The Phenomenal-Functional Gap." It's about distinguishing *feeling* bad from *registering* error.

  *Revised Plan for Problem 2:* Call it "The Regulatory Threshold Problem." How to turn the gradient into law.

  *Revised Plan for Problem 3:* Call it "The Moral Weight Scaling Problem." (Aggregation).

