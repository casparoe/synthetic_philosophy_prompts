answer: |-
  Here is the recommended prioritization for a three-year research or funding agenda centered on Du Bois's *Criteria of Negro Art*.

  ### The Ranking

  1.  **Priority One:** The Interpretive Problem (Content vs. Form)
  2.  **Priority Two:** The Institutional Question (Funding and Governance)
  3.  **Priority Three:** The Philosophical Tension (Du Bois vs. Adorno/Autonomy)

  ### The Defense

  This ordering is determined by three specific criteria: logical dependency (upstream/downstream relationships), tractability within a three-year window, and the potential for tangible operational change in cultural institutions.

  **1. The Interpretive Problem (Upstream Foundation)**
  This line of work must be the immediate priority because it is logically upstream of the other two. You cannot design an institution to fund "propaganda" (Line 2) nor can you evaluate its compatibility with aesthetic autonomy (Line 3) until you define what Du Bois meant by the term.

  If the research concludes that Du Bois's propaganda thesis refers primarily to *representational content* (e.g., positive images of Black life), the institutional implication is a diversity mandate focused on subject matter. If, however, the research concludes the thesis refers to *formal structure* (e.g., the politics of rhythm, dissonance, or spatial composition), the institutional implication is a radical overhaul of aesthetic criteria in grant-making. This distinction is the bottleneck. Without resolving it, any subsequent work on funding or philosophy rests on an unstable definition.

  This line is also the most tractable for a single researcher or small team in the first year. It requires close textual analysis, archival work, and the curation of a contemporary case-study portfolio. It does not require bureaucratic buy-in to begin. By dedicating the first twelve months to this, you produce a working definition of "propaganda" that serves as the operational manual for the remainder of the project.

  **2. The Institutional Question (Operational Impact)**
  This line is ranked second because it is the only one that directly satisfies the requirement to change how cultural institutions operate. A theoretical resolution of Du Bois's text is valuable, but a feature on "public life" demands public consequences. This line moves the thesis from the page to the budget.

  Once the interpretive work (Line 1) establishes whether the focus is content or form, the second year should focus on prototyping institutional mechanisms. This involves drafting sample grant guidelines, simulating acquisition committee votes, or auditing algorithmic recommendation logic against the new criteria. This work is less tractable than Line 1 because it requires collaboration with gatekeepers who may be resistant to change. However, it is the highest-value output for a foundation program officer. If the project ends after three years, the existence of a pilot funding framework or a white paper on algorithmic bias derived from Du Bois's criteria constitutes a concrete legacy.

  Placing this second ensures that the theoretical work does not become an end in itself. It forces the researcher to stress-test the Line 1 findings against the messy reality of bureaucratic constraints.

  **3. The Philosophical Tension (Theoretical Safeguard)**
  The Adornoian tension is ranked third not because it is unimportant, but because it is best resolved *through* the friction of Line 2 rather than as a standalone theoretical exercise. The question of whether instrumentalized art can remain "autonomous" is often a proxy war that stalls practical progress. If a researcher spends two years debating Du Bois against Adorno in the abstract, they risk producing a sophisticated paper that no museum director will read.

  However, this line remains necessary as a quality-control mechanism. It should run parallel to Line 2, not precede it. As you draft those institutional guidelines (Line 2), you will inevitably encounter the risk of funding didactic, aesthetically weak work. That is the moment to deploy the Line 3 analysis. By treating the Adorno tension as a risk-assessment tool rather than a primary research question, you ensure that the resulting institutional models do not sacrifice beauty for utility. This ordering prevents "theory paralysis" and ensures that the philosophical heavy lifting is done in service of practical design.

  ### Criteria for Reordering

  While the 1-2-3 order is the most robust path, specific evidence gathered in the first eighteen months could necessitate a reshuffle.

  **Evidence that would elevate Line 3 (Philosophical):**
  If the pilot institutional frameworks (Line 2) consistently produce art that is politically effective but aesthetically derivative, the project risks validating the critique that Du Bois's thesis leads to bad art. If early prototypes reveal that "propaganda" criteria systematically exclude experimental or difficult work, Line 3 must be elevated to a co-equal priority. You would need to pause institutional design to theoretically reconstruct a bridge between instrumentalism and autonomy, perhaps by redefining "resistance" not as formal independence but as formal complexity in service of truth.

  **Evidence that would elevate Line 2 (Institutional):**
  If the interpretive work (Line 1) reveals a consensus that Du Bois's distinction between content and form is a false binary in contemporary practice, the theoretical bottleneck dissolves. If artists are already treating form and content as inseparable, the project should pivot immediately to Line 2. In this scenario, further philosophical parsing is redundant, and the urgent need is to translate the existing artistic praxis into funding policy.

  **Evidence that would sustain Line 1 (Interpretive):**
  If the initial archival and textual work reveals significant contradictions in Du Bois's own application of the thesis—for example, if he championed artists in practice that his essay theoretically excludes—Line 1 must remain the priority. You cannot build a living thesis on a fractured foundation. In this case, the project should reframe itself as a genealogy of how the "propaganda" claim has been misused to police Black art, rather than attempting to implement it institutionally.

  ### Summary of the Agenda

  For a three-year timeline, the goal is to move from definition to application. Start by defining the weapon (Line 1). Then, build the armory (Line 2). Use the philosophical critique (Line 3) to ensure the weapon does not misfire, but do not let the critique prevent you from building the armory. This approach honors Du Bois's insistence that art is not a luxury, but a vital component of public life, without falling into the trap of producing art that is merely a vehicle for messaging. It treats the essay not as a historical artifact to be analyzed, but as a policy brief waiting to be written.
