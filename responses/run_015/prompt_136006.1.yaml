prompt: |-
  hey — I need something I can actually hand to a committee, and I've failed to write it four times now.

  Setup: I'm a philosophy PhD student, and last year I got put on the data-governance committee for the two-hospital academic health system my department is affiliated with. We decide what goes in the demographics block of the electronic health record, and who's allowed to use those fields downstream. We meet every other week, 25–30 proposals a year, about 25 minutes each. The committee is a hospitalist, a nurse manager, a data architect, a compliance officer who has to sign off on everything or it doesn't ship, a rotating patient advocate, and me. Nobody else on it has read anything about social construction and nobody else ever will. The hospitalist hears "social construction" as "it's made up, so it doesn't matter"; the data architect hears it as "let people self-describe and then never aggregate." I get one page, ten questions maximum, and I cant use any jargon. Whatever we decide sits in the record for a decade and gets used for disparities research, quality reporting, registry submissions, and clinical decision support.

  What keeps happening: every proposal is really "add, delete, or redefine a category of person." I can see why the same move is fine in one case and a disaster in another, but when I try to say it I either give a five-minute lecture on Hacking's looping effects or I cave and vote on vibes. So: write me a procedure.

  What it has to be:
  - Ordered questions with hard stops, not a menu of considerations. I need to be able to say "question 3 fails, we're done, next proposal."
  - For each question: what counts as a sufficient answer, and who has to supply it (the proposal author? informatics? compliance?).
  - Explicit marks at the points where the answer is a values decision and has to go to a named human rather than to the procedure.
  - Runnable by someone with no theory, in ~20 minutes, from documents the committee already has.
  - It has to cope with: the same label meaning different things at the two hospitals we merged; a field collected at intake for one purpose getting reused eight years later for another; a category used to track something causal (exposure to a social environment) versus used as a proxy for an intrinsic property; and people who give different answers at different times or get classified differently by different staff.

  I also want you to commit, not survey, on three design choices:

  1. Which distinctions have to survive the translation and which can be dropped. My instinct is that the interactive-vs-indifferent-kind / looping stuff and the conferral stuff (who has to do what, in what setting, for the property to be there) are load-bearing, and that the whole realism/antirealism fight about whether race is "real" is dead weight we should just drop and never mention again. Tell me if I've got that backwards.

  2. Whether to require, for every category, an "export license": a written statement of the downstream uses it's licensed for, where any new use has to come back through us. I made this up, it's the part I'm least sure about, and the data architect already hates it.

  3. Whether there should be a rule that any field used to make a clinical decision about a patient has to be recorded as an act — what was actually asked, of whom, by whom, when — rather than as a trait of the patient. And what the procedure should do when the honest answer to "what was actually asked" is "nothing, the clerk guessed" or "nothing, a model imputed it." Related: I've been calling the next question the re-description question — if someone reads this field in eight years under a different description than the one it was collected under, what breaks? Keep it if it earns its place on the page, cut it if its just decoration.

  Then run it on three proposals actually in front of us:

  (a) Add a "Middle Eastern or North African" option to the race/ethnicity question, because a patient-advocacy group says the current boxes force people into "white" and their community disappears from our disparities data.

  (b) Have the lab auto-populate the race field from a genetic-ancestry panel that's already being run on a subset of patients, on the grounds that it's more objective and intake staff are bad at asking. I think this is obviously bad and I cannot say why in a form the hospitalist will accept.

  (c) Delete the "sex assigned at birth" field and keep only gender identity, because a committee member argued last meeting that the first one is "just a social category with no clean biology under it, so its noise in a medical record."

  On (c): my sympathies are with the deletion and my own work is why — I spend my days arguing these categories are constructed. If the procedure, run honestly, says keep the field, I want you to say that plainly and tell me why construction isn't the reason to delete it. I'd rather be overruled by the checklist than by my politics.

  One more, which you should feel free to treat as the real test: we've been told to harmonize the two hospitals' category sets into one master list. If the procedure implies we shouldn't — that we should keep both and map between them at analysis time — say so, because the CIO is going to be furious and I want to know before I walk into the room.

  Give me your version, argue for it, say where it has to hand off to a person and where it'll just misfire, and don't hedge between options. No reading lists and no citations — I can look those up myself, I need the page.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Philosophy PhD student on a hospital data-governance committee.
      *   **Problem:** Struggles to translate philosophical insights (social construction, looping effects, conferral) into actionable committee procedure without jargon or getting bogged down in theory. Needs a one-page, 10-question max procedure to evaluate proposals (add/delete/redefine demographic categories).
      *   **Committee:** Hospitalist, Nurse Manager, Data Architect, Compliance Officer, Patient Advocate, User. No theory background.
      *   **Constraints:**
          *   Ordered questions with hard stops.
          *   Define sufficient answers and who supplies them.
          *   Mark value judgments requiring human escalation.
          *   Runnable in ~20 mins.
          *   Handle specific edge cases (merged hospitals, repurposing data, causal vs. proxy, instability of answers).
          *   **Commitments Required:**
              1.  Keep interactive/looping/conferral, drop realism/antirealism debates.
              2.  Decide on "Export License" (required vs. optional).
              3.  Decide on "Act vs. Trait" recording (especially for clinical decision fields) and handling imputation/guessing.
          *   **Test Cases:** Run the procedure on three specific proposals (MENA category, Genetic Ancestry auto-population, Delete Sex Assigned at Birth).
          *   **Stress Test:** Harmonization of two merged hospitals' category sets (keep separate vs. merge).
      *   **Tone:** Direct, actionable, no hedging, no citations, "the page."

  2.  **Determine the Three Design Choices (Commitments):**

      *   *Choice 1 (Distinctions):* The user's instinct is correct. Realism/antirealism is a metaphysical rabbit hole that stalls governance. *Interactive kinds* (looping effects) and *Conferral* (who assigns this and why) are operational. If a category changes behavior which changes the category, that's a governance risk. If a category is assigned by a clerk vs. a lab, that's a data integrity issue.
          *   *Decision:* Keep Interactive/Conferral. Drop Realism.
      *   *Choice 2 (Export License):* The Data Architect hates it, but without it, "function creep" is inevitable. A field collected for billing gets used for risk adjustment gets used for denial of care.
          *   *Decision:* Require it. It's the only way to prevent the "repurposing" problem mentioned in the prompt.
      *   *Choice 3 (Act vs. Trait):* This is crucial for constructed categories. "Race" isn't a trait like "Blood Type." It's an assignment. If a model imputes it, that's a prediction, not a fact.
          *   *Decision:* Require "Act" recording for social categories. If it's imputed/guessed, it must be flagged as such. This protects against the "objective" fallacy in Proposal (b).

  3.  **Drafting the Procedure (The "Page"):**

      *   Need 10 questions max.
      *   Need hard stops.
      *   Need to address the specific edge cases (merged hospitals, repurposing, etc.).
      *   Need to identify where values kick in.

      *   *Drafting Questions:*
          1.  Purpose/Use (The "Why").
          2.  Source/Method (The "How").
          3.  Stability/Time (The "When").
          4.  Harmonization (The "Where" - addressing the two hospitals).
          5.  Downstream License (The "Export").
          6.  Act vs. Trait (The "Nature").
          7.  Missing/Imputed Data (The "Null").
          8.  Looping/Impact (The "Effect").
          9.  Conflict Resolution (The "Values").
          10. Review Cycle (The "Sunset").

      *   *Refining for "Hard Stops":*
          *   Q1: Is there a defined clinical or operational use? (If no, reject).
          *   Q2: Is the collection method specified? (If no, stop).
          *   Q3: Is the downstream use licensed? (If no, stop).
          *   Q4: Does it record the act of assignment? (If no, stop for social categories).
          *   Q5: Harmonization check.

      *   *Refining for "Values":*
          *   Where do we say "This harms a group"? That needs the Patient Advocate + Compliance escalation.

  4.  **Running the Test Cases:**

      *   *(a) MENA Category:*
          *   Purpose: Disparities research (Valid).
          *   Method: Self-report (Valid).
          *   License: Research/Quality (Valid).
          *   Act/Trait: Self-report is an act.
          *   Harmonization: Might need mapping if Hospital B doesn't have it.
          *   *Result:* Pass, with mapping requirement.
      *   *(b) Genetic Ancestry Auto-pop:*
          *   Purpose: "More objective" (Red flag).
          *   Method: Lab test vs. Social Identity.
          *   License: Clinical decision? (Danger).
          *   Act/Trait: Lab result is a trait, but using it as "Race" is a category error.
          *   *Result:* Fail on Q1 (Purpose mismatch) or Q4 (Act vs. Trait). Genetic ancestry $\neq$ OMB Race.
      *   *(c) Delete Sex Assigned at Birth (SAB):*
          *   Purpose: "Noise" (Argument).
          *   Counter-argument: Clinical relevance (medications, physiology).
          *   Construction argument: Yes, it's constructed, *but* it confers specific medical risks.
          *   *Result:* Keep, but change recording to "Act" (Who recorded this and based on what?). Construction doesn't mean "useless," it means "context-dependent."
      *   *Harmonization:*
          *   If Hospital A uses "Hispanic" and Hospital B uses "Latino," merging them loses nuance.
          *   *Result:* Keep separate, map at analysis. Merging creates false precision.

  5.  **Refining the Output:**

      *   Make it look like a document.
      *   Ensure the "Commitments" section is distinct and argued.
      *   Ensure the "Test Cases" show the procedure working (failing the bad ones, passing the good ones with conditions).
      *   Address the "Construction isn't a reason to delete" point clearly in (c).
      *   Address the CIO/Harmonization conflict directly.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 10 questions too many for 20 minutes?
      *   *Fix:* Group them logically. Make the "Hard Stops" very visual.
      *   *Critique:* Did I address the "values" handoff?
      *   *Fix:* Explicitly mark questions where Compliance or Patient Advocate has veto power.
      *   *Critique:* Is the "Export License" too burdensome?
      *   *Fix:* Frame it as "Approved Use Cases." If a new use arises, new proposal needed. This satisfies Compliance.
      *   *Critique:* On (c), make sure I don't contradict the user's philosophy while upholding medical safety.
      *   *Fix:* Distinguish between "ontologically real" and "clinically actionable." Construction implies the latter depends on the former's context, not that the latter vanishes.

  7.  **Final Polish:** Check tone. Needs to be authoritative, crisp, no academic fluff. "Here is the tool."

      *(Self-Correction on Harmonization)*: The prompt asks: "If the procedure implies we shouldn't [harmonize]... say so." I need to be firm here. Merging distinct categorical schemas creates data pollution. The procedure should flag this as a risk.

      *(Self-Correction on Export License)*: The Data Architect hates it. I need to justify why it's necessary despite that. It prevents the "repurposing" issue (intake data used for denial of care).

      *(Self-Correction on Act vs Trait)*: This is the key to stopping the Genetic Ancestry proposal. Ancestry is biological data; Race is a social classification. Using the former to populate the latter is a category error that the "Act vs Trait" question should catch.

  8.  **Finalizing the Document Structure:**
      1.  The Commitments (The "Why").
      2.  The Procedure (The "Page").
      3.  The Test Runs (The "Proof").
      4.  The Harmonization Verdict (The "Fight").

