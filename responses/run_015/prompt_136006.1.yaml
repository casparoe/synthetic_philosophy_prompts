answer: |-
  Here is the document. It is designed to be printed single-sided, handed to the Compliance Officer at the start of the meeting, and used as the agenda for the proposal review.

  ***

  # PART 1: THE THREE DESIGN COMMITMENTS

  You asked for commitments, not a survey. Here is the philosophical scaffolding translated into operational constraints.

  **1. Keep Looping/Conferral, Drop Realism.**
  You are correct. Debating whether race is "real" is a stall tactic. What matters is whether the category *does* something.
  *   **Keep:** *Conferral* (Who assigned this? A patient? A clerk? A lab?) and *Looping* (Does labeling someone this change their treatment, which changes their outcome, which changes the data?).
  *   **Drop:** Ontological debates. We do not vote on what exists; we vote on what is safe to record.

  **2. Require an "Export License."**
  The Data Architect hates this because it limits flexibility. That is exactly why we need it.
  *   **Rule:** Every field must have a declared "Approved Use List." If a researcher wants to use a field for a purpose not on the list, they must submit a new proposal.
  *   **Why:** This prevents *function creep*. A field collected for "disparities research" cannot be silently repurposed for "risk adjustment" or "insurance billing" without re-evaluating the ethical cost.

  **3. Record "Act," Not "Trait" (for Social Categories).**
  *   **Rule:** For any demographic field, the record must store *how* the value was derived (Self-report, Observer, Imputed, Lab).
  *   **Why:** "Race" is not "Blood Type." If a clerk guesses, or a model imputes, that is an *assignment*, not a *discovery*. If the honest answer is "nothing, the clerk guessed," the system must record "Unknown/Observer Estimate," not a definitive category. This kills the "objective" fallacy without requiring a lecture on social construction.

  ***

  # PART 2: THE PROCEDURE (THE PAGE)

  **Document:** Data Governance Proposal Review Checklist
  **Time Limit:** 20 Minutes
  **Hard Stop Rule:** If a question fails and no remedy is offered, the proposal is rejected or tabled. Do not proceed.

  | # | Question | Sufficient Answer | Who Supplies | Hard Stop? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **What specific clinical or operational problem does this field solve?** | A named use case (e.g., "Dosage calculation," "CDC Reporting"). "Future research" is insufficient. | Proposal Author | **YES** |
  | **2** | **How is the value acquired?** | One of: Patient Self-Report, Clinician Observation, Lab Result, Algorithmic Imputation. | Informatics / Author | **YES** |
  | **3** | **If acquired by Observation or Imputation: Is the patient given a chance to correct it?** | Yes (Portal access, intake review) OR Justification why not (Emergency context). | Nurse Manager / Compliance | **YES** |
  | **4** | **Export License: What downstream uses are approved?** | List of specific reports/teams. "Any research" is insufficient. | Compliance Officer | **YES** |
  | **5** | **Harmonization: Does this match the partner hospital's schema?** | Yes OR No (If No, provide mapping table for analysis). | Data Architect | No |
  | **6** | **Stability: How often can this value change?** | Once (Birth), Episodic (Pregnancy), or Dynamic (Insurance). | Proposal Author | No |
  | **7** | **Missing Data: What happens if this is blank?** | Default value defined OR Field allowed to be null. | Data Architect | **YES** |
  | **8** | **Looping Risk: Does using this category change patient care?** | Yes/No. If Yes, does the benefit outweigh the risk of labeling? | **Patient Advocate + Hospitalist** | **YES** |
  | **9** | **Values Check: Does this category historically carry discrimination risk?** | Yes/No. If Yes, Compliance must sign off on mitigation. | **Compliance Officer** | **YES** |
  | **10** | **Review Cycle: When do we delete or re-evaluate this field?** | Date (max 3 years) or Trigger Event (Guideline change). | Committee Chair | No |

  **Escalation Protocol:**
  *   **Questions 8 & 9 are Value Judgments.** If the Committee cannot agree, the proposal goes to the Ethics Board. Do not vote.
  *   **Question 5 (Harmonization):** If the answer is "No," do not force a merge. Require a mapping table. Forcing a merge on non-identical categories is a data integrity failure.

  ***

  # PART 3: RUNNING THE TEST CASES

  Here is how the procedure handles the three proposals currently on your docket.

  ### Proposal (a): Add "Middle Eastern or North African" (MENA) Option
  *   **Q1 (Purpose):** Disparities research / Patient identification. **Pass.**
  *   **Q2 (Method):** Patient Self-Report. **Pass.**
  *   **Q4 (License):** Restricted to Quality/Disparities Reporting. **Pass.**
  *   **Q5 (Harmonization):** Hospital A has it, Hospital B lumps into "White." **Action:** Do not force Hospital B to change intake forms immediately. Require a *mapping table* where Hospital B's "White" + "Other" is flagged for analysis, or allow Hospital B to add the checkbox.
  *   **Q8 (Looping):** Low risk. Labeling improves visibility without changing treatment protocols negatively.
  *   **Verdict:** **APPROVE.**
  *   **Note:** This solves the "erasure" problem without requiring theory. It treats the category as a tool for visibility (Q1) rather than a biological truth.

  ### Proposal (b): Auto-populate Race from Genetic Ancestry Panel
  *   **Q1 (Purpose):** "More objective than intake." **FAIL.**
      *   *Reasoning:* "Objectivity" is not a clinical problem. Genetic ancestry $\neq$ OMB Race categories. There is no clinical use case defined that requires genetic ancestry *labeled as race*.
  *   **Q2 (Method):** Lab Result. **Pass.**
  *   **Q4 (License):** If used for clinical decision support, this requires high scrutiny.
  *   **Q8 (Looping):** **HIGH RISK.** Using genetics to assign social race changes how patients are treated (e.g., kidney function algorithms), which changes health outcomes.
  *   **Q9 (Values):** **HIGH RISK.** Historically, biologizing race is a vector for discrimination. Compliance must sign off.
  *   **Verdict:** **REJECT.**
  *   **Why:** You don't need to explain "social construction." You point to **Q1**. There is no clinical problem solved by mislabeling genetic data as race. If they want genetic ancestry, add a "Genetic Ancestry" field (Q1 satisfied), but do not write it into the "Race" field (Q4 License violation).

  ### Proposal (c): Delete "Sex Assigned at Birth" (SAB), Keep Gender Identity
  *   **Q1 (Purpose):** Proponent argues "No clean biology, so noise." Opponent argues "Medication metabolism, physiology."
      *   *Analysis:* Some medications and physiological risks correlate with SAB regardless of current gender identity. Q1 is met for *keeping* the field (Clinical Safety).
  *   **Q2 (Method):** Currently "Clinician Observation" or "Patient Report."
      *   *Procedure Fix:* Change to "Patient Self-Report" where possible, flagged as "Historical."
  *   **Q3 (Correction):** Patient must be able to update Gender Identity without erasing SAB if SAB is clinically relevant.
  *   **Q8 (Looping):** **HIGH RISK.** Misclassification leads to harm (e.g., prostate screening for trans women).
  *   **Q9 (Values):** **HIGH RISK.** Erasing SAB harms trans care; Keeping SAB risks outing/misgendering.
  *   **Verdict:** **KEEP, BUT MODIFY.**
  *   **Why Construction Isn't a Reason to Delete:**
      *   Your philosophical work argues SAB is constructed. True. It is a conferral made at birth based on visual inspection of genitalia.
      *   *However,* medicine treats the *consequences* of that conferral (hormonal history, surgical history, organ presence).
      *   The procedure saves the field not because it is "biologically real," but because **Q1 (Clinical Safety)** requires it.
      *   *The Fix:* The field is not deleted. It is re-classified under **Q2/Q3**. It is recorded as an *Act* ("Recorded by Dr. X at birth" or "Reported by Patient as History"), distinct from Gender Identity. This acknowledges construction (it's a report, not a essence) while maintaining safety.

  ***

  # PART 4: THE HARMONIZATION FIGHT (THE CIO)

  **The Scenario:** The CIO wants one master list. Hospital A uses "Hispanic." Hospital B uses "Latino." They want you to pick one and overwrite the other.

  **The Procedure's Verdict:** **DO NOT MERGE.**
  *   **Reference:** Question 5.
  *   **Reasoning:** If Hospital A's "Hispanic" and Hospital B's "Latino" were collected with different intake scripts or staff training, they are not the same variable. Merging them creates false precision. It looks like clean data, but it is polluted data.
  *   **The Instruction:** Keep both fields in the raw database. Create a *view* or *mapping table* for reporting that aligns them to the federal standard (OMB) at the *analysis* stage, not the *collection* stage.
  *   **What to say to the CIO:** "If we merge them now, we break the audit trail. When researchers find a discrepancy in five years, we need to know which hospital the data came from. Question 5 requires us to map, not overwrite. Overwriting fails the Data Integrity check."

  ***

  # PART 5: WHERE THIS WILL MISFIRE

  You need to know the limits of this page so you don't look foolish when they hit them.

  1.  **The "Vibes" Veto:** Question 8 and 9 rely on the Patient Advocate and Compliance Officer. If the Hospitalist bullies the Advocate, the procedure cannot stop a bad value judgment. It only flags it. *Mitigation:* You must enforce the "Escalation to Ethics Board" rule if Q8/9 are contentious. Do not let them vote on values.
  2.  **The "Legacy Data" Trap:** This procedure works for *new* proposals. It does not fix the ten years of bad data already in the warehouse. *Mitigation:* Use Q10 (Review Cycle) to flag legacy fields for "Deprecation" if they don't meet the new standard.
  3.  **The Data Architect's Revolt:** The "Export License" (Q4) creates administrative overhead. They will try to skip it. *Mitigation:* Remind Compliance (who signs off on Q4) that *they* are liable for HIPAA/Privacy breaches if data is used unlicensed. Make it Compliance's shield, not your burden.

  **Final Instruction:**
  Print this. Put it in the binder. When the Hospitalist starts talking about "biology" on Proposal (b), point to **Q1**. When the CIO demands harmonization on the merge, point to **Q5**. When the committee tries to delete SAB on Proposal (c), point to **Q1** and **Q2**.

  You are not the philosopher in the room anymore. You are the person holding the checklist. Let the checklist be the philosopher.
