          *   *Status:* Platitude/Generalization.
          *   *Scope:* Broad (French, Russian, etc.).
          *   *Determinism:* Low. Correlation $\neq$ Causation. Doesn't prove *this* had to happen *this* way.

      *   **(2) Functionalist Claim:** "No constitutional mechanisms $\rightarrow$ Violence is the only succession tool."
          *   *Analysis:* Revolutions break old rules. New rules aren't set. Factions fight. Without courts/elections, they fight with guillotines.
          *   *Status:* Defensible Substantive Claim (institutionalist view).
          *   *Scope:* Modern revolutions (especially where institutions are smashed).
          *   *Determinism:* High. If institutions are absent, violence is the default *function*. But did they *have* to smash institutions that way?

      *   **(3) Normative/Tragic Thesis:** "Virtue becomes Terror." (Robespierrean logic).
          *   *Analysis:* The moral intensity required to sustain the revolution demands purity. Purity demands exclusion. Exclusion becomes death.
          *   *Status:* Defensible Substantive Claim (philosophical/ethical).
          *   *Scope:* Ideologically driven revolutions (French, Cultural Revolution).
          *   *Determinism:* Medium/High. If you commit to *this specific kind* of virtue, the outcome follows. But you could choose a different politics (e.g., liberal republicanism).

      *   **(4) French-Revolution Structural Claim:** "Sovereignty cannot be divided." (Sovereignty/Representation crisis).
          *   *Analysis:* The King was the arbiter. King goes $\rightarrow$ Who decides? The People. But "The People" is fragmented. Girondists vs. Montagnards both claim to *be* the People. No higher court of appeal.
          *   *Status:* Defensible Substantive Claim (Specific to 1789-1794).
          *   *Scope:* Specifically French (or similar unitary sovereignty contexts).
          *   *Determinism:* High *within the logic of 1793*, but contingent on the decision to establish unitary sovereignty rather than federalism or constitutional monarchy.

      *   **(5) Thermodynamic/Metaphorical Image:** "Energy dissipates through friction."
          *   *Analysis:* Revolution releases energy. Entropy increases. Order collapses into heat (violence).
