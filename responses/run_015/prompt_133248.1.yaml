answer: |-
  This is an excellent analytical move. Your skepticism is well-founded: the slogan "revolutions devour their children" functions rhetorically as a conversation-ender, but analytically it is a container for several distinct, often incompatible, causal mechanisms. To press your classmate, you need to force them to select *which* mechanism they believe renders the execution of the Girondists and Danton inevitable.

  Here is a conceptual menu disambiguating the five readings you identified, evaluated by their truth status, scope, and capacity to support structural determinism.

  ### 1. The Weak Empirical Generalization
  **The Thesis:** Historically, a statistically significant number of revolutionary leaders are eventually killed or purged by their former allies.
  *   **Status:** **Platitude.** It is descriptively accurate across a wide range of cases (French, Russian, Iranian, etc.), but as a generalization, it lacks explanatory power. It observes a pattern without identifying a cause.
  *   **Scope:** **Universal/Trans-historical.** It applies to the French Revolution, but also to 20th-century vanguard revolutions and even non-modern upheavals.
  *   **Implication for Contingency:** **Leaves room for contingency.** A statistical regularity is not a law of nature. That purges *often* happen does not prove they *must* happen in every instance, nor that the specific timing and targets (Girondists in 1793, Danton in 1794) were fixed. It allows for the argument that while risk is high, specific outcomes depend on the skill, luck, or choices of the actors. If your classmate relies on this reading, they are arguing from probability, not necessity.

  ### 2. The Functionalist/Institutional Claim
  **The Thesis:** Revolutionary regimes, having shattered the *ancien régime's* legal order, lack legitimate, non-violent mechanisms for resolving factional disputes or rotating power. Therefore, violence becomes the only functional tool for succession and conflict resolution.
  *   **Status:** **Defensible Substantive Claim.** This is a strong institutionalist argument. If there are no courts to adjudicate between the Girondists and the Montagnards, and no agreed-upon election cycle to remove a losing faction, the only way to remove a rival who controls the army or the sections is physical elimination.
  *   **Scope:** **Modern Revolutions (specifically those that smash the state).** This applies strongly to the French case and Leninist vanguard structures where the Party claims a monopoly on truth and the State is an instrument of coercion. It applies less to "negotiated transitions" (e.g., Spain post-Franco).
  *   **Implication for Contingency:** **Strongly supports determinism, but with a caveat.** This supports your classmate's view *if* one accepts the premise that the revolutionaries *had* to smash the existing legal order entirely. However, it leaves open the contingency of *institutional design*. Could the Convention have established a constitutional court? Could they have federalized power? If the violence is necessary only because they refused to build alternative institutions, then the "devouring" is a result of political choice, not structural law.

  ### 3. The Normative or Tragic Thesis
  **The Thesis:** Revolutionary virtue is defined by purity and intensity. To maintain the revolution is to maintain virtue; therefore, any perceived compromise or moderation is a vice that threatens the whole. The moral logic of the revolution necessitates the elimination of the "impure" (the moderates).
  *   **Status:** **Defensible Substantive Claim.** This captures the specific ideological logic of Robespierre and Saint-Just. It explains why Danton (who wanted to relax the Terror) was treated as a traitor rather than a loyal opposition.
  *   **Scope:** **Ideologically Driven Revolutions.** This fits the French Revolution (Republic of Virtue) and the Cultural Revolution. It fits less well with revolutions driven primarily by nationalist or materialist goals without a strong moralistic component.
  *   **Implication for Contingency:** **Mixed.** This makes the purge inevitable *given the specific ideological commitments* of the Jacobins. However, it restores agency to the actors: they *chose* to define virtue in this exclusionary way. They could have adopted a liberal-republican virtue that tolerated dissent. Thus, the "devouring" is not a law of revolutions *per se*, but a law of *this specific moral vision*. It shifts the blame from "Structure" to "Ideology."

  ### 4. The French-Revolution Structural Claim (Sovereignty)
  **The Thesis:** The specific crisis of the French Revolution was a crisis of sovereignty. With the King removed, there was no higher arbiter than "The People." Since both the Girondists and Montagnards claimed to exclusively represent "The People," the existence of the other faction was logically an act of usurpation. Coexistence was theoretically impossible; one had to be the General Will, the other a faction.
  *   **Status:** **Defensible Substantive Claim (Specific).** This is the strongest argument for the inevitability of the Girondist purge specifically. It relies on the Rousseauian concept of the General Will, which cannot be divided.
  *   **Scope:** **Specifically French (or similar Unitary Sovereignty contexts).** This is unique to revolutions that adopt a unitary, indivisible conception of popular sovereignty without federalist checks. It applies less to revolutions that embrace pluralism or federalism from the start.
  *   **Implication for Contingency:** **High Determinism (within the frame).** If you accept the premise of Indivisible Sovereignty, the elimination of the Girondists is logically necessary. However, this premise itself was a contingent political choice. The Girondists *did* argue for federalism. The Montagnists *chose* to suppress that. So, while the logic is tight, the entry into that logic was a contestable political decision.

  ### 5. The Thermodynamic/Metaphorical Image
  **The Thesis:** Revolution releases a massive amount of social energy. Like a physical system, this energy must dissipate. Internal friction converts political energy into heat (violence). The "devouring" is simply entropy taking its toll as the system seeks a new equilibrium.
  *   **Status:** **False (as a causal mechanism).** This is poetry, not political science. It sounds profound but offers no variables to test. It reifies "revolutionary energy" as a physical substance, which is a category error.
  *   **Scope:** **Universal/Poetic.** It can be applied to anything, which means it explains nothing.
  *   **Implication for Contingency:** **Pseudo-Determinism.** It creates the *illusion* of inevitability by using the language of natural law ("energy," "friction"). It is the reading your classmate is likely implicitly relying on to shut down debate, because it makes human agency irrelevant. If it's just physics, no one is responsible, and no debate about choices matters.

  ### Summary for Your Seminar Intervention

  To press your classmate, you should ask them to locate their argument within this menu.

  *   If they mean **(1)**, ask them why a statistical frequency proves necessity in this specific case.
  *   If they mean **(2)**, ask them whether the lack of institutions was a structural necessity or a political choice by the Convention to centralize power.
  *   If they mean **(3)**, ask them whether the "corruption of virtue" was inevitable, or whether a different conception of republicanism (one that tolerated opposition) was possible.
  *   If they mean **(4)**, concede that *given* the Jacobin theory of sovereignty, the purge was logical, but insist that the adoption of that theory was the contingent moment, not the purge itself.
  *   If they mean **(5)**, point out that they are using a metaphor as a mechanism, which precludes historical analysis entirely.

  **The Verdict on Determinism:**
  Only readings **(2)** and **(4)** come close to supporting your classmate's dismissal of contingency. However, both rely on prior premises (the destruction of legal order; the adoption of indivisible sovereignty) that were themselves the result of debates, votes, and choices. Therefore, even the strongest structural readings do not prove that the Terror was a law of nature, but rather that it was the logical consequence of specific, contingent political decisions made in 1789–1792. The slogan "revolutions devour their children" obscures those decisions; it does not explain them.
