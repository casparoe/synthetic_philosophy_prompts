answer: |-
  This is an exceptionally sharp dissection of a problem that sits at the fault line between philosophy of mind, cognitive science, and metaphysics. You have correctly identified that the standard labels ("Cartesian Theater," "Underdetermination") feel like they describe the *symptoms* or the *history* of the debate, but not the precise structural anatomy of the impasse you are describing.

  Per your instructions, I will begin by brainstorming candidate concepts from the literature, testing them against your three cases, and discarding those that fail to capture the specific structural features you've isolated. I will then commit to a diagnosis, define the phenomenon, and address your boundary questions.

  ### Phase 1: Brainstorming and Testing Candidate Concepts

  Here are the six most plausible candidates from the literature that might name the structural feature you are describing.

  **1. The Cartesian Theater (Dennett)**
  *   **The Concept:** The mistaken intuition that there is a specific place and time in the brain where "it all comes together" and becomes conscious.
  *   **Test against Case 1 (Dream Timing):** Fits well. The debate is about where the "screen" lights up (during sleep vs. at waking).
  *   **Test against Case 3 (Waking Attention):** Fits well. Is the richness on the screen now, or filled in later?
  *   **Rejection:** You explicitly ruled this out ("I would be unsatisfied by the answer that the hypotheses differ only in where they put the Cartesian theater"). More importantly, "Cartesian Theater" names the *mistake* one side is allegedly making, not the *structural feature* of the argument itself. It doesn't explain why the question persists or what kind of indeterminacy is at play. It diagnoses the disease but doesn't name the symptom structure.

  **2. Ordinary Empirical Underdetermination**
  *   **The Concept:** Two theories predict the same data, but future data could distinguish them (e.g., Newtonian vs. Einsteinian gravity before certain tests were possible).
  *   **Test against Cases:** Fails. You noted that you cannot construct the breaking evidence *even in principle*. In ordinary underdetermination, we can describe what would settle it (e.g., "a camera outside the room"). Here, the "camera" (neural scan) and the "witness" (memory) are part of the causal chain being disputed.
  *   **Rejection:** This is not epistemic limitation; it is constitutive ambiguity. The evidence *is* the phenomenon.

  **3. Verificationism (Logical Positivism)**
  *   **The Concept:** A statement is meaningless if it cannot be empirically verified.
  *   **Test against Cases:** Fits the "no evidence" feature.
  *   **Rejection:** You noted that tabooing the words didn't make the disagreement evaporate. Verificationism declares the question *empty*. You and the disputants feel the question is *substantive* (moral stakes, personhood). Furthermore, modern philosophy largely rejects hard verificationism. We need an account that respects the intuition that something real is being debated, even if it's unresolvable.

  **4. The Stalinesque/Orwellian Distinction (Dennett)**
  *   **The Concept:** Specifically regarding memory and timing. **Stalinesque:** The experience is fabricated *before* it enters consciousness (like a staged trial). **Orwellian:** The experience happens, but memory is revised *after* the fact (like rewriting history books).
  *   **Test against Case 1:** Perfect fit. This is exactly the dream timing debate.
  *   **Test against Case 2:** Fits the "mid-sentence" entry.
  *   **Test against Case 3:** Fits the attention/clutter issue (is the periphery filled in now or later?).
  *   **Status:** **Strong Candidate.** This is the specific technical terminology for the timing ambiguity. However, it traditionally covers only Hypotheses 1 and 2 (Real-time vs. Deferred). It does not explicitly include Hypothesis 3 (No experience at all / Illusionism).

  **5. Phenomenal Illusionism (Frankish, Keith)**
  *   **The Concept:** The claim that phenomenal consciousness (the "what it is like") does not exist as we think it does; we are under an illusion that we have it.
  *   **Test against Case 1:** Covers Hypothesis 3 (Report produced without experience).
  *   **Rejection:** This is an ontological *position*, not a name for the *structural feature* of the debate. It explains one corner of the triangle, but not the relationship between the corners.

  **6. Indeterminacy of Phenomenal Individuation**
  *   **The Concept:** The boundaries of mental events (when they start, stop, or if they exist) are not fixed by the physical facts.
  *   **Test against Cases:** Fits all three. It captures the "when" (Case 1 & 2) and the "whether" (Case 3).
  *   **Status:** **Strong Candidate.** This is a descriptive metaphysical label, but it is not a "house name" you will find in a glossary. It describes the *consequence* of the problem, not the debate structure itself.

  ### Phase 2: Commitment and Definition

  Having tested the candidates, I will synthesize the most precise available literature with a definition of the structural feature.

  **The Literature Location:**
  The specific debate you are describing is anchored in Daniel Dennett's **Stalinesque/Orwellian Distinction** (from *Consciousness Explained*, 1991), extended by Eric Schwitzgebel's work on **Judgment vs. Experience** (e.g., *Perplexities of Consciousness*, 2011).
  *   **Stalinesque:** Fabrication before consciousness (Your Hypothesis 2).
  *   **Orwellian:** Revision after consciousness (A variant of Your Hypothesis 1/2 boundary).
  *   **Schwitzgebel's Addition:** The possibility that there is *no* phenomenology, only a **Dispositional Judgment** (Your Hypothesis 3).

  **The Structural Feature:**
  There is no single "house name" for the triad itself, but the structural feature is best defined as **Phenomenal Chrono-Existential Indeterminacy (PCEI)**.

  **Definition:**
  PCEI occurs when multiple causal histories regarding the generation of a conscious report are **Causally Isomorphic** with respect to all third-person data and first-person memory, yet diverge on the **Temporal Location** or **Ontological Status** of the phenomenal state itself.

  Unlike ordinary underdetermination, PCEI is not resolved by better measurement because the "measurement" (the report/memory) is the *output* of the very process in question. The indeterminacy arises because "conscious experience" is not a natural kind with a precise temporal onset in the way "neuron firing" is.

  ### Phase 3: Carving the Phenomenon (Boundaries and Edges)

  You asked for the carving rather than just the label. Here is the precise metaphysical and epistemic topology of PCEI.

  #### 1. Are "When" and "Whether" the same kind of question?
  **Yes.** In the context of PCEI, questions about *when* an experience occurred and *whether* it occurred are instances of the same structural problem: **Individuation of Mental Events.**

  *   **Reasoning:** To say an experience happened *at time T* requires drawing a boundary around a process and labeling it "experience." To say it happened *at all* requires drawing a boundary around a process and labeling it "experience."
  *   **The Third Hypothesis:** Your third hypothesis (report without experience) belongs to the same pattern. It simply pushes the boundary of "experience" to *never*.
      *   Hypothesis 1: Boundary drawn around sleep-state processing.
      *   Hypothesis 2: Boundary drawn around waking-state reconstruction.
      *   Hypothesis 3: No boundary drawn (no experience).
  *   **Why they are the same:** All three hypotheses agree on the **Functional Output** (the report, the behavior, the neural traces). They differ only on where they attach the label "conscious experience" within that causal chain. Therefore, "when" and "whether" are both questions about **Label Application**, not questions about the causal chain itself.

  #### 2. Why is this different from checkable physical facts (e.g., locking the door)?
  In the door case, the fact (door locked) is **Causally Independent** of the memory (I remember locking it). We can check the door.
  In the dream case, the fact (I experienced the dream) is **Causally Constituted** by the memory/report machinery.

  *   **The Block:** There is no "door" to check outside the skull. The only "door" is the neural state. But a neural state is only a "dream experience" if we interpret it as such.
  *   **Would a complete neural readout settle it?** **No.** This is the crucial philosophical pivot.
      *   Suppose we have a perfect scan. We see neural pattern *N* occur at 3:00 AM. We see report pattern *R* occur at 7:00 AM.
      *   **Realist:** "Pattern *N* *is* the experience."
      *   **Constructionist:** "Pattern *N* was latent data; the experience was generated at 7:00 AM when *R* was accessed."
      *   **Illusionist:** "Neither *N* nor *R* was an experience; both are functional states producing a report."
      *   **Result:** The neural data is identical. The dispute moves to **What counts as consciousness?** Is it the early encoding? The late access? Or neither? The neural readout settles the *physics*, but not the *metaphysics of mind*. The dispute shifts from "When did it happen?" to "Which of these neural events deserves the name 'experience'?"

  #### 3. What kind of "No Fact of the Matter" is this?
  If the right answer is that there is no fact of the matter (as Dennett argues), it is **Semantic/Conceptual Indeterminacy** that entails **Metaphysical Indeterminacy** only if one assumes Dualism.

  *   **Not Epistemic:** It is not that we lack the tools to know. It is that the concept "experience" does not have sharp enough boundaries to apply to the causal continuum. It is like asking, "At exactly which nanosecond did the pile of sand become a heap?" The vagueness is in the word "heap," not the sand.
  *   **Not Metaphysical (strictly):** There is no fuzzy *reality*. The neurons fire precisely. The fuzziness is in our **Criteria of Ascription**.
  *   **The Exception (Dualism):** If you believe consciousness is a non-physical substance or property (Property Dualism), then there *could* be a metaphysical fact (the "soul" touched the data at 3:00 AM vs 7:00 AM). But since that fact is causally inert (by definition of the setup), it is **Verification-Transcendent**. Most philosophers of mind (including me, in this analytical context) treat verification-transcendent facts as indistinguishable from no facts.
  *   **Conclusion:** It is **Conceptual Indeterminacy**. We have not defined "experience" precisely enough to distinguish between early encoding and late narration.

  ### Phase 4: The Sleep Science Nuance (A Critical Edge)

  You asked for a grasp of what lab data can settle. I must add a crucial caveat that refines the "No Fact" claim.

  **Lucid Dreaming and Eye Signals:**
  In cases of **Lucid Dreaming**, subjects can agree on a pre-sleep signal (e.g., "Look Left-Right-Left when you realize you are dreaming"). We observe this eye movement during REM sleep.
  *   **Impact:** This *partially* settles Case 1 for *lucid* dreams. It proves *some* conscious processing (enough to recall the task and execute it) is happening during sleep, not just at waking.
  *   **Limit:** It does not settle the *content* timing. Did they experience the *museum corridor* in real-time, or did they experience the *signal* in real-time and the corridor was filled in later?
  *   **Relevance to PCEI:** This shows PCEI is not absolute. It is a gradient. Where we have independent causal markers (eye signals), the indeterminacy shrinks. Where we rely solely on retrospective report (non-lucid dreams), PCEI is maximal. This confirms the problem is **Epistemic Access to Phenomenal Onset**, not necessarily total metaphysical void.

  ### Final Diagnosis

  **Name:** The structural feature is **Phenomenal Chrono-Existential Indeterminacy (PCEI)**.
  **Literature Anchor:** The **Stalinesque/Orwellian Distinction** (Dennett) extended by the **Judgment vs. Experience** debate (Schwitzgebel).

  **Summary of the Carving:**
  1.  **Nature:** It is a failure of **Mental Event Individuation**. We cannot carve the continuous causal stream of the brain into discrete "experiences" with precise timestamps.
  2.  **Evidence:** All hypotheses are **Causally Isomorphic** regarding output.
  3.  **Resolution:** A neural readout does not settle it because "consciousness" is a **Functional/Interpretive Label**, not a raw physical variable.
  4.  **Status:** The "No Fact of the Matter" is **Conceptual**. The question presumes "experience" is a discrete event with a precise onset, like a spark. If experience is a distributed process (as most cognitive science suggests), asking "when did it start?" is a **Category Mistake**.

  **Advice for your thinking:**
  Stop asking "When did the experience happen?" Start asking "What functional criteria are we using to award the label 'experience' to this neural process?" The disagreement you are witnessing is not about the world; it is about **where to draw the boundary of the concept**. The moral stakes you mentioned (personhood, mattering) depend on which boundary definition you adopt, which is why the debate feels substantive even if the facts are indeterminate.

  **Term to use:** If you want to sound like you know the literature, refer to it as **"The Stalinesque/Orwellian Ambiguity"** regarding timing, and **"Phenomenal Skepticism"** regarding existence. If you want to be precise about the structure, use **"Indeterminacy of Phenomenal Individuation."**
