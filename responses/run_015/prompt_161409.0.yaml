  9.  **Final Polish:** Organize into clear sections: The Reconstructed Theory, The Weberian Tension, Logical Mapping, Policy Implications. (Proceed to generate output based on this structure).

      *(Self-Correction on the "Temporal Gini" point)*: The user notes caps regulate the mean but ignore dispersion. If the theory *actually* cared about the Gini, the rules would look different. So the *current* rules imply the Gini *doesn't* matter, or matters less than the mean. I need to make sure I don't attribute the Gini concern to the *current* rules, but rather show how adopting it would *change* things. The prompt asks what would change *if* it were taken seriously. Okay, got it.

      *(Self-Correction on Synchronisation)*: The current rules *do* support synchronisation (weekends, holidays). So the theory *presupposes* synchronisation. I need to highlight that.

      *(Refining the "Theory")*: The theory isn't consistent. It's a hybrid. It treats low-status workers as needing protection (paternalism + sync) and high-status workers as partners (Weberian). It treats leisure as a right (EU) but also as a risk factor (Japan). I should characterize this as a **"Stratified Temporal Citizenship"** model.

  10. **Finalizing the Output Structure:**
