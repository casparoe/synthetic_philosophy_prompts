      2.  Confronting Weber.
      3.  Logical Mapping (Strict vs. Fit vs. Overlap).
      4.  Policy Counterfactuals (Synchronisation & Dispersion).

      *(Wait, one more check on the Karoshi point)*: The user says Japan routes consequences through compensation rather than safety duty. This implies the *system* is accepted, only the *extreme outcome* is remediated. This fits a theory where work is primary and life is secondary, unless life ends. I need to make sure this nuance is captured.

