          2.  *Distribution:* Caps regulate averages, ignoring dispersion (some work too much, some too little).
          3.  *Agency:* Workers can't sell leave (paternalism) but employers are liable for "voluntary" overtime (denial of agency).
          4.  *Karoshi:* Japan treats overwork death as compensable via thresholds/culture rather than pure safety failure.
      *   **User's Proposed Distinctions:**
          1.  *Synchronised Leisure:* Value of free time depends on co-availability.
          2.  *Temporal Gini:* Focus on the spread/dispersion of leisure, not just the mean.
      *   **Specific Requirements:**
          1.  Reconstruct the implicit theory of work/leisure.
          2.  Contrast with Weber's "calling" (idleness as sin, leisure must be earned).
          3.  Mark commitments: Which elements *strictly require* parts of the theory vs. *fit well* vs. where *rival theories* converge.
          4.  Policy Implications: What changes if "Synchronisation" or "Dispersion" becomes the primary justification?

  2.  **Analyze the "Package" to Find the Implicit Theory:**

      *   *Element 1: Mandating Leisure (35hr week, non-cashable leave, right to disconnect, common time off).*
          *   Implication: Leisure is a *right*, not a commodity. It has intrinsic value or social value beyond economic utility. It cannot be traded away because it protects the *status* of the worker as a citizen/family member, not just an economic agent. Common time off implies leisure is *relational*.
      *   *Element 2: Exemptions (Senior staff, autonomous workers).*
          *   Implication: Work is hierarchical. High status/high pay buys exemption from protection. This suggests protection is for the *subordinate*, not the human *per se*. Autonomy negates the need for protection (you control your time).
      *   *Element 3: Karoshi (Japan).*
          *   Implication: Overwork is a systemic risk, not just an individual choice. However, routing through compensation rather than strict prevention suggests a acceptance of the *culture* while managing the *extreme outcomes*. It acknowledges physical limits but treats them as catastrophic failure points rather than daily regulatory bounds.

      *   *Synthesizing the Theory:* The law treats the worker as a **bounded rational agent embedded in social structures**.
          *   *Bounded:* Cannot be trusted to trade leave for cash (paternalism).
          *   *Embedded:* Needs sync time for family/civic life.
          *   *Hierarchical:* Protection is for the dependent, not the powerful.
          *   *Physical:* There is a biological break-point (Karoshi), but social norms override daily limits until that break-point is hit.

  3.  **Contrast with Weber's "Calling":**

      *   *Weber:* Work is moral duty. Idleness is sin. Leisure is only justified as recovery for more work or religious observance.
      *   *Implicit Theory:* Work is a contractual obligation with limits. Leisure is a citizenship right. Idleness (within limits) is protected.
      *   *Tension:* The exemptions (senior staff) actually align *better* with Weber (work is identity/calling) than the protections do. The protections reject Weber; the exemptions accommodate him.

  4.  **Drafting the Reconstruction (Iterative Process):**

      *   *Name the Theory:* Let's call it "The Social-Republican Theory of Temporal Citizenship." It views time as a shared resource, not just private property.
      *   *Address the Inconsistencies:*
          *   *Why sync time?* Because leisure is social, not just restorative.
          *   *Why no selling leave?* Because time sovereignty is inalienable (like voting rights).
          *   *Why exemptions?* Because power asymmetry determines the *need* for protection, not biology.
          *   *Why Karoshi approach?* Because culture is hard to legislate; only extreme physical failure triggers state intervention.

  5.  **Mapping Commitments (Strict vs. Fit vs. Overlap):**

      *   *Strict:* Non-cashable leave *requires* paternalism (rejecting pure market agency). Common time off *requires* the synchronisation hypothesis.
      *   *Fit:* Exemptions fit the hierarchy theory but don't strictly require it (could be efficiency).
      *   *Overlap:* Overtime caps fit both productivity theories and health theories.

  6.  **Developing Policy Implications (The "What If" Scenario):**

      *   *If Synchronisation is King:* Focus on shift work penalties, Sunday trading bans, school/holiday alignment. Less focus on individual hour caps, more on *when* hours happen.
      *   *If Temporal Gini (Dispersion) is King:* Focus on under-employment. Involuntary part-time becomes a violation. Overtime caps become individual hard limits, not averages. Redistribution of hours (work sharing).

  7.  **Refining the Tone:**

      *   Needs to be analytical, suitable for a think tank briefing.
      *   Avoid jargon where possible, but use the user's terms (*Synchronised Leisure*, *Temporal Gini*).
      *   Ensure the Weber comparison is sharp.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the Japan/Karoshi element sufficiently? It's distinct from the EU model.
      *   *Adjustment:* Frame Karoshi as the "biological limit" counterpoint to the "social limit" of the EU. It reveals the theory assumes a body that breaks before the contract does, unless culture intervenes.
