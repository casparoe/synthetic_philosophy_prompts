  NATIONAL SCIENCE FOUNDATION
  Division of Social Sciences | Solicitation NSB-HIST-2024
  **Pre-Registered Counterfactual Trials in Macrohistory: Solving the Needham Question Through Synthetic Control Methods**

  The Division of Historical Econometrics invites proposals to re-execute the period 1700–1850 as a fully randomized controlled trial. Principal Investigators (PIs) must treat the Great Divergence not as a complex, path-dependent historical occurrence, but as a clean treatment effect subject to rigorous identification strategies. The primary objective is to isolate the causal impact of institutional exogeneity on GDP per capita growth between the Qing and Georgian dynasties, controlling for cultural confounders and geographic determinants. Applicants should note that correlation does not imply causation, even when the correlation spans centuries. The Foundation seeks to resolve the Needham Question by eliminating hindsight bias through temporal blinding.

  **Methodological Requirements**
  Proposals must utilize synthetic control methods to construct a weighted average of non-industrialized polities to serve as a counterfactual Britain. To ensure unit exchangeability, PIs are required to randomize access to anthracite coal deposits across Eurasia prior to 1750. Blinding protocols are mandatory; subject populations must remain unaware of their assignment to the "Industrialized" or "Agrarian Trap" treatment arms. Note that retrospective data mining is strictly prohibited. All pre-analysis plans must be filed, notarized, and timestamped no later than 1699. Late submissions from the 18th century will not be accepted. Applicants must demonstrate that the selection of Britain as the treatment unit was not driven by post-hoc observation of industrial success. Power calculations should acknowledge the limited N of available empires. Intention-to-treat analysis is required for dynasties that collapsed prior to the intervention window.

  **Inclusion Criteria for Valid Control Societies**
  To maintain covariate balance, control units (e.g., China, India, Ottoman) must meet the following exclusion criteria:
  1. No prior deployment of atmospheric engines before 1800.
  2. No accidental industrialization via path dependence.
  3. Institutions must be demonstrably exogenous to economic outcomes.
  Societies that industrialized endogenously will be removed from the donor pool to prevent contamination of the synthetic control group. This ensures the counterfactual remains pure of teleological bias. Any society exhibiting growth spikes prior to treatment assignment will be disqualified as a non-compliant unit. Control groups must remain parallel to the treatment group in all pre-treatment periods.

  **Data Management Plan**
  PIs must describe storage protocols for null outcomes. Since counterfactual histories do not generate observable data, applicants should budget for secure server space to host simulated null datasets. All data must be made available to recieve peer review upon the completion of the timeline. Missing data imputation is not permitted for entire civilizations. Data sovereignty issues regarding deceased populations should be addressed in the ethical compliance section.

  **Budget Justification**
  Allowable costs include personnel, travel to archives, and simulation compute time. Specific justification is required for Line Item 4.2.b: Procurement of counterfactual coal deposits. PIs must explain why synthetic coal yields lower thermal efficiency than historical coal in the model specification. Costs associated with reversing entropy are unallowable. Fringe benefits for historical actors are not permitted.

  **Submission**
  Submit via FastLane. Do not contact program officers regarding the feasibility of temporal randomization. The Foundation assumes no liability for paradoxes arising from intervention in the historical record. Proposals implying inevitability will be returned without review.

