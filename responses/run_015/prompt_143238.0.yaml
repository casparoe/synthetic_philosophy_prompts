      *   *Check:* Is the 50-year kill criterion fair? 50 years is half a century. In science, that's a long time to keep a falsified theory on life support. Nadia is right to call it an escape hatch.
      *   *Check:* Wegener analogy. Is it perfect? Wegener lacked a mechanism (plate tectonics) initially. Malthus *had* a mechanism, but the parameters changed. The analogy holds regarding *novel prediction*.
