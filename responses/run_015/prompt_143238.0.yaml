      *   *Nadia 4 (Common-Pool/Escape Hatch):* Strong rebuttal. Tragedy of the Commons explains fisheries without needing Malthusian population dynamics. The 50-year clause allows perpetual deferral. *Verdict:* Right.

  4.  **Synthesize the "Who is More Right" Judgment:**
