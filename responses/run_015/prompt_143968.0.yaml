answer: |-
  This is a sophisticated observation, and you are right to hesitate before settling on "moral victory." That term is too colloquial and fails to capture the *structural* work the defeat is doing: it is not just claiming a win where there was none, it is actively *using* the loss to sanitize the cause.

  Here is the breakdown of the phenomenon, the existing literature, and a proposal for a term you can use in your typology.

  ### 1. Is this one phenomenon or two?
  It is **one coherent phenomenon**. The two conditions you identify are symbiotic, not merely coincidental.
  *   **Condition 1 (Costliness)** provides the *energy*. Without blood/suffering, there is no sacred capital to spend.
  *   **Condition 2 (Detachment)** provides the *direction*. Without detachment, the sacred capital would be spent on the specific political program, which (because it failed) is now a liability.

  The defeat acts as a **filter**. It filters out the *policy* (which failed and is therefore tainted) and retains the *virtue* (which is proven by the failure). If you remove either condition, the mechanism collapses. If there is suffering but no detachment, you have a tragedy or a grievance (e.g., "We died for slavery, and we would do it again"). If there is detachment but no suffering, you have mere forgetting or revisionism (e.g., "The war was about tariffs," without the blood).

  ### 2. The Existing Literature (and why it falls short)
  You are working at the intersection of Memory Studies, Political Theology, and Nationalism Studies. Here are the closest established concepts and why they don't quite fit your specific configuration:

  *   **Founding Defeat (*Défaite fondatrice*):** Common in scholarship on Serbia (Kosovo), France (1870), and the Confederacy.
      *   *Fit:* High. It captures the idea that the loss constitutes the community.
      *   *Miss:* It does not necessarily imply the *detachment from content*. A founding defeat can still be about reclaiming the specific lost territory or political order. Your cases are distinct because the political order is *abandoned* while the identity is *kept*.
  *   **The Myth of the War Experience (George Mosse):** Mosse argues that the fallen are sanctified to legitimize the post-war state.
      *   *Fit:* High on the sanctification of sacrifice.
      *   *Miss:* Mosse focuses on how the dead legitimize the *victors* or the *surviving state*. In your cases, the state/cause often *did not survive*, or the ideology is disavowed by the commemorators.
  *   **Victimhood Nationalism (Barkan, Karnoosh):** Focuses on suffering as the basis of moral claim.
      *   *Fit:* High on the "costliness" condition.
      *   *Miss:* Often implies a claim for restitution or justice. Your cases often seek *absolution* rather than restitution.
  *   **Exemplary Memory (Tzvetan Todorov):** Using the past as a lesson for universal principles rather than specific history.
      *   *Fit:* High on the "detachment" condition.
      *   *Miss:* Todorov usually advocates for this as an ethical choice. You are describing a rhetorical *strategy* that uses abstraction to evade political accountability.

  ### 3. Proposed Term: "Purificatory Defeat"
  Since no single existing term captures the *simultaneity* of sanctification and disavowal, I recommend coining a sub-category for your typology.

  **Term:** **Purificatory Defeat**
  *(Alternative: "Exculpatory Sacrifice" or "The Innocence of Defeat")*

  **Definition:** A mode of commemoration in which a military or political failure is mobilized to certify the virtue of a community (via the cost of the loss) while simultaneously absolving it of the political consequences of its aims (via the non-implementation of those aims).

  **Why this works:**
  *   **Purificatory:** Captures Condition 2. The defeat "cleans" the cause. Because the cause never ruled, it never sinned. It remains in the realm of pure intention.
  *   **Defeat:** Captures Condition 1. The loss is the necessary crucible. A victory would have implicated the winners in the messy reality of governance.

  ### 4. Diagnostic Test
  To determine if a speech, monument, or text fits this category, apply this three-part test. All three must be present:

  1.  **The Suffering Condition:** Does the commemoration explicitly highlight the *cost* (death, hardship, loss) as the primary evidence of sincerity? (e.g., "They gave their all.")
  2.  **The Abstraction Condition:** Is the *object* of the sacrifice described in metaphysical, ethical, or vague terms (e.g., "Freedom," "Heavenly Kingdom," "Principle") rather than specific political terms (e.g., "States' Rights," "Serbian Empire," "Halakhic State")?
  3.  **The Counterfactual Silence:** Is there a deliberate refusal to speculate on what the *victory* would have looked like? (e.g., The Confederate memorializer praises the soldier's bravery but does not describe the Confederate government they died to create.)

  ### 5. The Boundary Case: Dunkirk
  You are correct that Dunkirk is a different genus.
  *   **Dunkirk** is a **Strategic Reinterpretation**. The objective (save the army) was *achieved*. The "defeat" (losing France) is acknowledged but sidelined. It is a "Victory in Retreat."
  *   **Purificatory Defeat** is an **Ethical Transmutation**. The objective was *not achieved*. The value is generated *by* the failure.
  *   **Test Failure:** Dunkirk fails the "Counterfactual Silence" condition. The goal was clear (evacuation), and it was met. There is no need to detach from the content because the content was successful.

  ### 6. Necessary Conditions & Scope
  To answer your specific questions on the boundaries of this concept:

  *   **Must the losers actually have suffered?**
      *   **Yes.** Without material cost, the "devotion" claim is hollow. A bloodless defeat is usually just a humiliation, not a purification.
  *   **Must the cause be one the commemorators would now disavow?**
      *   **Mostly Yes.** This is the engine of the "detachment." If the cause is still actively pursued (e.g., a revolutionary movement that lost a battle but continues fighting), the defeat is usually framed as a "Lesson" or "Setback," not a Purification. Purification requires the political project to be *closed* so it can be *idealized*.
  *   **Does it survive in lost battles inside wars that were ultimately won?**
      *   **Yes, but rarely.** Usually, in a won war, lost battles are framed as "Stepping Stones" (e.g., Bataan). For it to be *Purificatory*, the specific cause of that battle must be disavowed even within the victory. (Example: A specific civil rights protest that failed violently, later honored for "courage" while the specific demands are treated as secondary to the "spirit of resistance.")
  *   **Non-national cases?**
      *   **Yes.** This works for dissolved institutions (a failed union strike honored for "solidarity" while the specific demands are forgotten) or abandoned scientific programs (a failed theory honored for the "rigor" of its proponents, detached from the falsity of the conclusion).

  ### 7. A Near-Miss Case (For your typology)
  **The Alamo (1836).**
  *   *Why it looks like it:* Defeat, death, high commemoration.
  *   *Why it fails the test:* It is not Purificatory Defeat; it is **Catalytic Defeat**. The loss is not honored *instead* of victory; it is honored *because it caused* victory ("Remember the Alamo"). The specific political cause (Texan independence) was achieved immediately after. There is no detachment from the content; the content was realized.

  ### Summary for your Dissertation
  In your typology chapter, you can frame this as a specific species of **"Founding Defeat."**
  *   **Genus:** Founding Defeat (Loss constitutes identity).
  *   **Species:** **Purificatory Defeat** (Loss constitutes identity *by severing* the link between virtue and political implementation).

  This gives you the precision to distinguish the Confederate/Kosovo/Masada cases from Dunkirk (Strategic Reinterpretation) or the Alamo (Catalytic Defeat). It allows you to argue that the *failure* is not an obstacle to commemoration, but the very *mechanism* that makes the commemoration politically safe.
