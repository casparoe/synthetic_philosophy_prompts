answer: |-
  Your refinement is a significant improvement over the folk version of Chesterton's Fence. By quantifying the presumption against removal using latency, restoration cost, and investigation cost, you have moved from a conservative heuristic to a risk-management protocol. This makes it robust within engineered systems where those variables are measurable. However, extending this logic to law, institutions, and politics introduces structural vulnerabilities that do not exist in code. Below are the defeaters ranked from fatal to awkward, incorporating your specific questions about expected utility, base rates, and case studies.

  ### 1. Fatal: The Political Economy Defeater (Premise 3 Failure)
  Your third premise—that surviving arrangements are likely functional because non-functional ones were removed—holds in competitive engineering environments where bugs cause outages and outages cause pain. It fails catastrophically in politics and bureaucracy. In these domains, arrangements persist not because they serve a systemic function, but because concentrated beneficiaries defend them against diffuse costs. This is rent-seeking, not selection for utility.

  *   **Base Rates:** You asked about the base rate of vestigial arrangements. In legacy code, dead code is common but often harmless; in law, "dead" provisions are often preserved specifically to maintain leverage or privilege. If survival signals *defensibility* rather than *function*, your selection premise collapses.
  *   **Case Study (b):** Consider the tax exemption whose rationale was repealed. Your rule suggests removing it if investigation costs are low. However, the "Latency" of harm might be low, but the "Restoration Cost" is politically infinite once removed. More critically, the arrangement survives not because it does work, but because lobbyists pay to keep it. Your rule treats this as a functional fence; it is actually a toll booth.
  *   **Comparison:** A plain Chesterton defender would say, "It remains for a reason we don't see." You say, "It remains because someone benefits." The plain defender dismisses this as cynicism; you must accept it as a fatal empirical counterexample to Premise 3.

  ### 2. Fatal: The Opportunity Cost of Stasis
  Your rule calculates the risk of *removal* against the cost of *investigation*. It systematically ignores the cost of *preservation*. In software, keeping legacy code increases cognitive load, security surface, and coupling. In institutions, keeping obsolete laws creates complexity, loopholes, and compliance burdens.

  *   **The Defect:** If the cost of maintaining the fence exceeds the risk of removing it, your rule still demands investigation before removal. If investigation is costly, you mandate preserving a harmful status quo.
  *   **Case Study (c):** Academic tenure. High latency (harm takes years to show), high restoration cost (cannot easily undo tenure once granted). Your rule strongly presumes keeping it. But if tenure actively harms institutional adaptability (a continuous cost), the "Preservation Cost" variable—which is missing from your formula—might dwarf the removal risk. Your rule is blind to the bleeding cost of the status quo.

  ### 3. Major: Expected Utility Equivalence
  You asked if this is just expected-utility maximization (EU) with extra steps. Formally, yes. Your "Presumption Strength" is a heuristic for estimating $P(\text{Harm}) \times \text{Cost}(\text{Harm})$ when data is missing.
  *   **Divergence:** The only divergence is deontological. EU allows removing the fence if the potential benefit is massive enough to outweigh the risk, even if unknown. Your rule says you are "not entitled" to remove it until you explain it. This veto power prevents high-variance, high-reward improvements.
  *   **Case Study (a):** The 200ms sleep. EU says remove it (low risk, high reward). Your rule says remove it (low latency, low restoration). Here you agree. But if the sleep was hiding a race condition with a 1% chance of catastrophic loss, EU might still remove it if the performance gain is vital; your rule forbids it until the causal role is known. In innovation contexts, this risk-aversion is a bug, not a feature.

  ### 4. Major: The Investigation Paradox (Insulation)
  You asked if qualifying the view makes it unfalsifiable. There is a specific risk here: sometimes the only way to find out what an arrangement does is to remove it (or perturb it).
  *   **The Defect:** If "Cost of Finding Out" includes the risk of removal, the denominator becomes infinite. The rule then prescribes permanent stasis for any black-box system.
  *   **Case Study (d):** A constitutional provision never invoked. Its function may be *deterrence*, which is only observable if removed. Your rule demands an account of its "present causal role." If that role is counterfactual ("it prevents X by existing"), you cannot satisfy the burden without testing the counterfactual. The rule insulates itself by declaring investigation too costly, effectively becoming the plain Chesterton fence it sought to refine.
  *   **Insulation Verdict:** It is not strictly unfalsifiable, but it is vulnerable to motivated reasoning. An agent wanting to preserve the status quo can always inflate "Restoration Cost" or "Latency."

  ### 5. Moderate: Distributional Agency
  You noted that those who investigate rarely bear the harm. This is not an implementation detail; it breaks the incentive structure of your rule.
  *   **The Defect:** Your formula assumes a single agent weighing costs. In reality, the engineer removes the code (benefit: cleanliness), the user suffers the outage (cost: latency), and the manager pays for investigation (cost: hours). If the remover does not internalize the $Latency \times Restoration$ product, they will game the inputs.
  *   **Plain Chesterton Comparison:** A plain defender dismisses this as irrelevant to the *truth* of the fence's value. You must concede it is fatal to the *application* of your rule, because your rule relies on accurate cost estimation by interested parties.

  ### Summary of Case Applications
  *   **(a) 200ms Sleep:** Your rule works best here. Low latency, low restoration, low investigation cost. Presumption drops. Plain Chesterton fails here (unnecessary wait).
  *   **(b) Repealed Tax Exemption:** Your rule fails. Premise 3 (Selection) is false; survival indicates power, not function.
  *   **(c) Academic Tenure:** Your rule is too static. It ignores the continuous cost of preservation (Opportunity Cost Defeater).
  *   **(d) Unused Constitutional Provision:** Your rule freezes. Function is deterrence (counterfactual), making investigation impossible without removal.

  ### Conclusion
  Your refinement is superior to the plain parable for engineering contexts where variables are measurable and incentives are aligned. However, it collapses when applied to political systems where survival signals power rather than function, and where the costs of stasis are ignored. It is not strictly unfalsifiable, but it relies on honest estimation of variables that stakeholders have incentives to distort.

  \answer{exposure: moderate; strongest defeater: Survival signals defended interests, not systemic function.}
