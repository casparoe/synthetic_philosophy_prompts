  1. The precise question

  The core epistemic problem concerns the calibration of historical sources without prior knowledge of the events they report. Herodotus evaluates reliability by comparing competing oral reports, seeking coherence among divergent accounts. Thucydides evaluates reliability by excluding testimony that fails a strict proximity-to-events criterion, prioritizing eyewitness participation. Both strategies appear circular: to judge which sources are trustworthy, one needs prior knowledge of what actually happened, yet the distant past is accessible only through those very sources. This proposal frames this not as generic skepticism regarding whether knowledge is possible, but as the specific problem of background-independent source evaluation. Can we assess a source's reliability without already knowing the content it reports? The project makes this tractable by applying the distinction to modern algorithmically mediated archives. In digital datasets, provenance metadata such as timestamps and chain-of-custody logs are generated by opaque automated processes rather than human witnesses. This concrete twist forces the abstract circularity into sharp relief: if the metadata used to filter sources is itself produced by an unverified algorithm, the Thucydidean exclusion rule collapses into the Herodotean comparative method, or vice versa. Investigating this collapse within a single semester is feasible because it relies on conceptual analysis of existing archival structures rather than new empirical data collection. The digital context provides a controlled environment where the generation of evidence is explicit, allowing for a precise isolation of the calibration mechanism.

  2. Why existing positions leave it open

  Three familiar reconciliations fail to resolve this background-independence problem when applied to machine-generated provenance. Direct realism about archives assumes that records reflect reality directly, bypassing the calibration problem entirely. This position is untenable when metadata is known to be algorithmically constructed, as the link between event and record is mediated by code. Radical constructivism argues that historical truth is constituted by the archive itself, dissolving the circularity by denying independent reality. However, this avoids the problem rather than solving it, rendering the distinction between reliable and unreliable sources merely internal to the system. The middle way, inference to the best explanation, suggests we accept sources that best cohere with background knowledge. Yet, in algorithmic archives, the background knowledge required to validate the metadata generation process is often unavailable to the historian. If the timestamp is produced by a server clock synchronized via an opaque protocol, we cannot independently verify the proximity criterion Thucydides demands. Consequently, none of these positions explains how to evaluate reliability without presupposing the truth of the very mechanisms producing the evidence. The digital case reveals that the ancient distinction between comparing content and filtering by proximity was perhaps always epistemically unstable, as both rely on unverified background assumptions about the source generation process. This instability necessitates a new diagnostic approach that existing literature has not yet addressed.

  3. Method and timeline

  The project proceeds in four phases over twelve weeks. Weeks 1–3 focus on reconstructing the ancient methods as explicit epistemic procedures. I will analyze Herodotean comparison and Thucydidean exclusion not as historical anecdotes but as formal rules for belief formation. This involves mapping the necessary background assumptions each method requires to avoid circularity. I will produce a schematic of the logical dependencies for each historian, isolating the specific claims about reality each method presupposes. I will also define the criteria for what counts as independent verification in each case. Weeks 4–6 examine two concrete modern archive types to test these procedures. I will analyze large-scale social-media datasets with automated provenance tagging and digitized administrative records with algorithmic redaction logs. The goal is to determine whether source comparison and source exclusion remain distinguishable when the provenance is machine-generated. For instance, does an automated timestamp function as an eyewitness report or as a competing narrative? I will draft case studies for each archive type, focusing on the metadata generation process. I will identify specific instances where algorithmic filtering mimics human judgment. Weeks 7–9 attempt to formalize a reliability criterion that does not presuppose content knowledge. I will document exactly where circularity enters if the attempt fails, identifying whether the break point lies in the algorithm's opacity or the historian's access conditions. This phase involves iterative drafting of the core argument, testing hypothetical scenarios where metadata conflicts with content. I will create a decision tree for evaluating such conflicts. Weeks 10–12 are dedicated to writing the final argument. This phase will synthesize the findings to state clearly whether the ancient distinction survives under modern conditions. The writing will argue whether algorithmic mediation forces a collapse of the two methods or reveals a new category of epistemic justification. Each phase includes a draft summary to ensure progress is tangible before moving to the next stage. Regular check-ins will ensure the scope remains manageable. The final weeks will also include a review of the initial schematics to ensure consistency with the final conclusion. I will polish the text for clarity and ensure all claims are supported by the preceding analysis.

  4. Success, failure, and deliverable

  Success for this project is not defined as solving historical skepticism definitively. Rather, success is producing a precise diagnosis of whether background-independent calibration is possible, with explicit conditions under which it fails. The project succeeds if it identifies the specific epistemic threshold where algorithmic provenance becomes indistinguishable from historical content. Failure is defined as discovering the problem is dissolved by definitional fiat or proves too broad for twelve weeks. For example, if the analysis devolves into general philosophy of technology without addressing the specific calibration circularity, the project fails. The primary deliverable will be a usable framework for someone deciding how to treat an algorithmically mediated archive. This framework will outline decision rules for when to trust metadata as exclusionary filters versus when to treat it as comparable narrative content. It will serve as a guide for historians and archivists facing opaque digital sources, offering a structured way to articulate the limits of their knowledge claims without retreating into total skepticism. The framework will be concise enough to be appended to archival methodology guides.

