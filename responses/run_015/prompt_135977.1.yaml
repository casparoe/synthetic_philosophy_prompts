  The scope is strictly conceptual; there will be no empirical study of actual archives or coding of new algorithms. The project relies on philosophical analysis of existing archival descriptions. Formal logic will be used only where needed for clarity, avoiding complex symbolic systems. A key risk is that the technical details of algorithmic provenance might prove too complex for non-specialist analysis. To mitigate this, algorithms will be treated as black boxes defined by their epistemic function. If the technical literature proves inaccessible, the project will pivot to hypothetical cases. This ensures the work remains finishable within the semester while maintaining philosophical rigor regarding the epistemic limits of historical inquiry.
