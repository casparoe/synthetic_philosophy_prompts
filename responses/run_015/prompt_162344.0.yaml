answer: |-
  # JOINT STATEMENT ON PREDICTIVE PROCESSING AND THE FREE ENERGY PRINCIPLE

  **Signatories:** The Unifier & The Redescriptionist
  **Date:** October 2023
  **Subject:** Clarifying commitments, distinguishing claims, and defining empirical adjudicators.

  ## 1. AGREED CLAIMS

  We agree that the last three years of debate have suffered from category errors and mismatched expectations. We endorse the following numbered claims as the baseline for future discourse.

  1.  **The Layer Cake Distinction.** We distinguish four levels of description that are often conflated:
      *   **Level 1 (FEP):** A mathematical claim about non-equilibrium steady-state systems maintaining a boundary.
      *   **Level 2 (Predictive Coding):** A specific circuit-level implementation story (message passing of prediction errors).
      *   **Level 3 (Predictive Processing):** A cognitive/architectural claim (the brain *uses* hierarchical generative models for perception and cognition).
      *   **Level 4 (Active Inference):** A control scheme unifying action and perception under one objective function.
      *   **Agreement:** Proof or disproof at Level 1 does not settle Level 2 or 3. A system can obey the FEP without implementing predictive coding circuits. Conversely, predictive coding circuits could exist without the FEP being the unique explanation for their stability. Most recent conflict arises from scoring Level 3 claims using Level 1 arguments.

  2.  **The Triviality Constraint.** We agree that "surprise minimization" (or variational free energy minimization) is satisfiable by an enormous range of systems, including trivial ones (e.g., a rock, a dead organism, a simple thermostat).
      *   **Agreement:** Demonstrating that a system minimizes surprise is not, by itself, evidence for the specific cortical-process claim (Level 2/3). The Unifier accepts that FEP is a necessary condition for existence, not a sufficient explanation of *human* neural computation.

  3.  **The Dark Room Resolution.** We agree that surprise minimization alone does not pick out an interesting agent (the "dark room" problem). An agent minimizes surprise relative to its prior preferences.
      *   **Agreement:** The content of behavior comes from the *generative model* and its *prior preferences*, not the minimization principle itself.
      *   **Joint Stance:** This is a virtue of the framework's modularity (separating *how* we optimize from *what* we optimize), but it acknowledges that the Free Energy Principle stops doing explanatory work the moment one must appeal to specific priors to explain specific behaviors. The biological work lies in explaining the priors.

  4.  **The Comparison Class.** Predictive Processing (PP) must be scored against comparably resourced alternatives, not against a null model.
      *   **Agreement:** A PP model should not be compared to a model with no learning or structure. It must be compared to Reinforcement Learning (RL), Control Theory, or Dynamical Systems accounts that have equal degrees of freedom, similar data access, and comparable parameter budgets. If PP requires hand-setting generative models post-hoc while an RL model learns them online, PP loses the comparison.

  5.  **The Implementation Gap.** We agree that there is currently no consensus on how high-level generative models map onto specific spiking dynamics.
      *   **Agreement:** Neither side claims to have a complete mapping from the mathematics of variational inference to the biophysics of cortical columns. Both sides acknowledge that current circuit-level claims are provisional.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Issue | Unifier Wording | Redescriptionist Wording | Genuine or Verbal? | Linked Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **Explanatory Scope** | PP provides a unified currency for perception, action, and attention that dissolves traditional boundaries between them. | PP provides a unified *vocabulary*, but the underlying mechanisms remain distinct (e.g., RL for action, adaptation for perception). | Genuine | Crux 2 (Transfer) |
  | **Circuit Implementation** | Cortical microcircuitry (laminar specific connectivity) is structurally isomorphic to message-passing inference (PE in superficial, predictions in deep). | Cortical microcircuitry is compatible with inference, but also compatible with simpler accounts (e.g., gain control, synaptic depression). Isomorphism $\neq$ Mechanism. | Genuine | Crux 1 (Laminar) |
  | **Parameter Fitting** | Priors and precision parameters reflect learned structural constraints of the brain; fitting them is estimating biological constants. | Priors and precision parameters are often hand-set to fit the data post-hoc, making the model flexible enough to explain any outcome. | Genuine | Crux 2 (Overfitting) |
  | **Normative Status** | FEP is a normative principle that constrains the space of viable models; deviations indicate model error or pathology. | FEP is a tautology for bounded systems; invoking it adds no predictive power over mechanistic descriptions. | Verbal* | None |
  | **"Prediction"** | Prediction refers to a probabilistic distribution over hidden causes maintained by the system. | Prediction refers to any anticipatory state, including entrained dynamics or lookup tables, without probabilistic structure. | Verbal* | Crux 1 (Volatility) |

  *\*Marked Verbal disputes are analyzed in Section 5.*

  ---

  ## 3. CRUXES AND ADJUDICATING TESTS

  We identify two specific empirical battlegrounds where our predictions diverge sharply. We commit to accepting the outcomes of these designs as evidence weighing for or against our respective positions.

  ### Crux 1: The Omitted Tone / Volatility / Reward Paradigm

  **Design:**
  Subjects listen to a stream of near-regular tones.
  *   **Manipulation A:** Occasional omissions at a predictable time.
  *   **Manipulation B:** Two blocks differing in the volatility of the inter-tone interval (Stable vs. Volatile).
  *   **Manipulation C:** Reward value of the omitted event is manipulated orthogonally (High Value vs. Low Value cue).
  *   **Readouts:**
      1.  Existence of an evoked response at the expected time of the omitted tone.
      2.  Amplitude scaling: Does it track recent volatility estimates or reward value?
      3.  Laminar profile (Macaque): Does the response profile match prediction-error signaling (superficial dominance) or adaptation/release from depression?
      4.  Feedback Suppression: What happens to the signal when top-down feedback is chemically or optogenetically suppressed?

  **Pilot Data (Human MEG/EEG):**
  *   Clear response at the right time (Omission Potential).
  *   Amplitude tracks fitted volatility estimate (Higher in Volatile block).
  *   No detectable relation to reward manipulation.

  **Pre-Registered Predictions:**

  | Readout | Unifier Prediction | Redescriptionist Prediction |
  | :--- | :--- | :--- |
  | **1. Existence** | Yes. The model generates a prediction; omission yields a PE. | Yes. Entrainment creates an expectation; violation yields a response. |
  | **2. Volatility Scaling** | Amplitude scales with precision-weighting. High volatility = lower precision on prior = larger PE to omission. | Amplitude scales with adaptation rate. High volatility = faster decay of expectation = larger response to omission. |
  | **3. Reward Scaling** | **Ambiguous.** In passive perception, reward modulates *precision* (attention), not necessarily the sensory PE amplitude directly, unless task requires action. | **Yes.** If this is a value-driven system (RL), reward should modulate the gain of the prediction error signal regardless of action. |
  | **4. Laminar Profile** | Omission response dominates in **superficial layers** (sending PE up). Suppression of feedback reduces the *expectation*, abolishing the omission response. | Omission response may reflect **deep layer** disinhibition or synaptic release. Suppression of feedback might not abolish the local adaptation signature. |

  **Interpretation of Pilot Data:**
  *   **Unifier:** The volatility scaling supports precision-weighting. The null reward effect is consistent with a passive perceptual task where value does not alter the sensory generative model, only the policy (which was null).
  *   **Redescriptionist:** The volatility scaling is consistent with simple adaptive filtering. The null reward effect is problematic for Active Inference if value is supposed to be integrated into the free energy, but consistent with a modular sensory account.
  *   **Confounds:** We agree the reward manipulation may have been too weak to engage action-oriented precision. We agree the laminar data is the tie-breaker.

  **Falsification Conditions:**
  *   **Unifier:** If the laminar profile shows deep-layer dominance for the omission signal, or if top-down suppression *increases* the omission response (suggesting release from inhibition rather than loss of prediction).
  *   **Redescriptionist:** If the volatility scaling persists even when adaptation is controlled for statistically, and if the laminar profile strictly matches superficial PE propagation that cannot be modeled by synaptic depression.

  ### Crux 2: The Overfitting and Transfer Question

  **Design:**
  *   **Phase 1:** Fit a PP model to Task A (e.g., a specific probabilistic learning task).
  *   **Phase 2:** Apply the *same* model architecture and parameters (no re-fitting of structural priors) to Task B (structurally similar but perceptually distinct).
  *   **Comparison:** Compare held-out performance against a Task-Specific Model (e.g., a standard Q-learning or ResNet model) fitted on Task B with a comparable parameter budget.

  **Pre-Registered Predictions:**

  | Metric | Unifier Prediction | Redescriptionist Prediction |
  | :--- | :--- | :--- |
  | **Transfer Performance** | PP will outperform Task-Specific models because it captures domain-general structural priors (hierarchy, temporal depth). | Task-Specific models will outperform PP because PP priors are too generic or require task-specific tuning to function. |
  | **Parameter Stability** | PP parameters (learning rates, priors) will remain stable across tasks. | PP parameters will need significant adjustment (hand-setting) to fit Task B, negating the "unified" claim. |

  **Falsification Conditions:**
  *   **Unifier:** If the PP model fails to generalize to Task B without re-tuning hyperparameters, or if a simpler RL model achieves better fit with fewer parameters.
  *   **Redescriptionist:** If the PP model demonstrates robust zero-shot or few-shot transfer that mechanistic models cannot match without architectural changes.

  ---

  ## 4. VERBAL DISPUTES AND SEMANTIC CLARIFICATION

  We identify two areas where our disagreement may be largely verbal, stemming from definitions rather than empirical claims.

  1.  **The Definition of "Inference."**
      *   **Dispute:** The Unifier uses "inference" to mean Bayesian updating over a learned generative model. The Redescriptionist uses "inference" to mean *any* state change describable as reducing surprise.
      *   **Resolution:** If a system reduces surprise via simple synaptic depression (habituation), the Unifier calls this "implementation of inference," while the Redescriptionist calls this "mere mechanism."
      *   **Verdict:** This is verbal. We agree to reserve "Inference" for systems that maintain explicit (or implicitly isomorphic) representations of *hidden causes* and *uncertainty*, distinct from simple input-output mapping.

  2.  **The Definition of "Prediction."**
      *   **Dispute:** The Unifier requires "prediction" to imply a distribution over future states. The Redescriptionist accepts "prediction" as any anticipatory state (e.g., oscillatory entrainment).
      *   **Resolution:** Entrainment-style accounts and PP accounts may not be rivals. A neural oscillator can *implement* a predictive distribution.
      *   **Verdict:** This is verbal. We agree to distinguish **Structural Prediction** (dynamical anticipation) from **Probabilistic Prediction** (representation of uncertainty). The debate is whether the brain does the latter, not just the former.

  ---

  ## 5. CONCLUSION: IS THERE A MOVE?

  **Question:** Is there any result that would actually move the debate, or are we describing research programmes that are immune to falsification?

  **Joint Answer:**
  There is a move, but it is narrow.
  1.  **If the Laminar Data is Clean:** If Crux 1 demonstrates that omission responses are strictly superficial, depend on top-down feedback, and scale with volatility *independently* of adaptation metrics, the Redescriptionist must concede that the circuit architecture is specifically optimized for message-passing inference, not just general dynamics.
  2.  **If the Transfer Data is Robust:** If Crux 2 demonstrates that PP models generalize across tasks with fixed parameters where RL/Control models fail, the Redescriptionist must concede that the "unified currency" offers a computational advantage beyond descriptive elegance.

  **Honest Assessment:**
  If the laminar data remains ambiguous (e.g., due to measurement noise) and the transfer performance is roughly equal (within error margins), the honest answer is **no**. In that case, Predictive Processing remains a highly useful *heuristic framework* for organizing data (Unifier's win), but not a uniquely confirmed *mechanistic theory* of the brain (Redescriptionist's win). We agree to stop claiming the latter until the former is decisively demonstrated.

  **Signed,**

  *The Unifier*
  *The Redescriptionist*
