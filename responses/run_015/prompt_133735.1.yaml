      *   *Traps:* Confusing this with empirical uncertainty (I don't know what I meant) vs. metaphysical indeterminacy (There is no fact about what I meant). Confusing this with the Private Language Argument (PLA) directly (though related, PLA is often about sensation; rule-following is about normativity). Confusing the solution with consensus truth (relativism) vs. constitutive practice.
