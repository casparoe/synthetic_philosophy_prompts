      *   *Dependency:* To get the skeptical argument, students need to grasp the intuition that meaning is fixed by *something* (usually mental states or past usage). Then they need to see that neither past usage nor mental states logically necessitate a specific future application. This creates the skeptical problem (no fact of the matter). Only *after* feeling the vertigo of no meaning can the skeptical solution (community agreement) be introduced as a rescue, not a refutation.
