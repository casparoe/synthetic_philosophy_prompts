  1. Dependency sequence
  Begin by establishing the intuition that meaning is a fact grounded in individual psychology. The five-minute writing exercise destabilizes this by forcing students to confront the gap between past intention and future application. Once they feel this, introduce the skeptical argument: no internal state logically necessitates a specific future action. This must precede the solution; otherwise, the communal fix looks like a compromise rather than a constitutive requirement. Finally, present the skeptical solution: meaning claims are warranted only through community agreement, not truth conditions. This order ensures the "vertigo" of skepticism is felt before the relief of the solution is offered, preventing students from dismissing the argument by appealing to hidden mental facts. The writing exercise personalizes the problem, making the logical dependency felt rather than just heard, ensuring the skeptical problem is fully inhabited.

  2. The carrying example
  Use the legal standard of "reasonable care" in negligence law. Present a 1920 precedent and ask if it dictates the outcome of a 2024 autonomous vehicle case. Avoid arithmetic "plus/quus" framing, which feels artificial to legal scholars. The example must possess historical indeterminacy: past rulings do not logically contain future applications. It must lack a private mental criterion: a judge's internal feeling of "fairness" cannot constitute correctness. This works for law students because it mirrors statutory interpretation debates without mathematical abstractions. It connects to community agreement by showing that a ruling becomes "correct" only when ratified by the legal community's shared practices, not because it matches a hidden metaphysical fact. The example sustains the session by grounding abstract normativity in professional stakes, making the indeterminacy of meaning tangible.

  3. Misconception map
  First, students often assume Kripke endorses meaning skepticism. Head this off during the opening by stating clearly that the argument is dialectical, not doctrinal; we are exploring a problem, not adopting nihilism. Second, they will interpret indeterminacy as psychological uncertainty ("I forgot what I meant"). Counter this after the writing exercise by emphasizing metaphysical absence of fact, not epistemic limitation; it is not that we cannot know, but that nothing exists to know. Third, they may view the communal solution as relativism. Address this when introducing the solution: clarify that community agreement constitutes the framework where correctness claims are intelligible. Finally, prevent conflation with the Private Language Argument by noting rule-following concerns normativity, not sensory privacy. Each correction must occur before the misconception solidifies, using precise phrasing to distinguish ontological absence from psychological doubt.

  4. What to leave out
  Explicitly defer technical debates regarding dispositional accounts of meaning, as these require logic training irrelevant to the core intuition. Avoid close reading of Wittgenstein's text; focus on the argumentative structure. Refuse to engage with contemporary meta-ethical debates about the normativity of meaning, as this shifts focus from interpretation to moral ontology. State clearly that the goal is understanding the structure of the argument, not adjudicating its ultimate truth. This prevents the session from stalling on technical objections. Keep the focus on the shift from truth-conditions to assertibility-conditions. Do not attempt to resolve whether the skeptical solution is ultimately satisfying.

  5. Check for understanding
  Ask: "If every other lawyer disagreed with your interpretation of 'reasonable care,' could you still be right?" A correct answer acknowledges that within the skeptical solution, individual correctness collapses without community warrant; meaning is not private. An incorrect answer asserts that individual insight can override community practice, revealing they still hold a truth-conditional view of meaning. This distinguishes grasping the constitutive role of community from merely acknowledging interpretive difficulty. It tests whether they have accepted the relocation of correctness from mental facts to public practices. If they say no, they understand that correctness is socially constituted.
