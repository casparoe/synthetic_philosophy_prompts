answer: |-
  The emergence of Bitcoin in 2009 presents a profound challenge to classical social ontology, specifically the Searlean account of money as an institutional fact. In standard social-constructionist theory, money is a "status function": a physical object or digital entry ($X$) counts as currency ($Y$) in a specific context ($C$) only by virtue of collective intentionality—the shared belief and acceptance of a community, typically underwritten by a central authority (like a state or central bank). Bitcoin appears to bypass this requirement. It functions as a store of value and medium of exchange without a central issuer, relying instead on cryptographic proof and distributed consensus.

  To analyze this, we must distinguish between **institutional kinding**, where a social kind is stabilized by explicit collective acceptance of assigned functions within a recognized hierarchical framework, and **protocol kinding**, where the kind is stabilized by algorithmic rules and distributed verification that ostensibly operate independently of human status assignment. Examining Bitcoin through these lenses reveals that while protocol rules can instantiate a monetary system, the *sustained* reality of that system inevitably re-absorbs institutional dependencies. This suggests that institutional backing in the form of a state is not necessary for stability, but collective intentionality remains indispensable.

  ### The Promise of Protocol Kinding

  The initial appeal of Bitcoin within social ontology lies in its apparent ability to achieve **protocol kinding**. In this framework, the "kind" (a valid bitcoin) is not defined by a social decree but by adherence to the consensus rules of the network (the protocol). A transaction is valid not because a bank says so, but because it satisfies cryptographic conditions and is recorded on the longest proof-of-work chain.

  From this perspective, Bitcoin demonstrates that institutional backing (in the sense of a centralized authority) is not necessary for a social kind to achieve stability. The stability of the *kind*—the agreement that a specific string of data constitutes a unit of value—is maintained by the costliness of falsification (energy expenditure) rather than the threat of legal sanction. The protocol acts as a "trustless" institution; it enforces the status function automatically. If social-constructionist accounts presume a *centralized* assigner of status, Bitcoin undermines that specific presumption. It shows that the "constitutive rules" of money can be encoded in software rather than inscribed in law, allowing the kind to persist across borders and jurisdictions without a single sovereign guarantor.

  ### The Limits of Protocol Kinding: Hidden Institutional Dependencies

  However, the description of Bitcoin as a purely protocol-kind misdescribes the actual social practices surrounding its operation. While the *validation* of transactions is algorithmic, the *social reality* of Bitcoin as money relies heavily on hidden institutional structures that protocol kinding ignores.

  First, consider **exchange platforms**. Most users do not interact with Bitcoin via the protocol directly (running nodes, managing private keys); they interact through intermediaries like Coinbase or Binance. These are centralized institutions that operate within traditional legal frameworks, enforcing KYC (Know Your Customer) and AML (Anti-Money Laundering) regulations. The liquidity and price discovery that make Bitcoin a viable "store of value" depend on these institutional gateways. Without them, Bitcoin would remain a niche cryptographic token rather than a global monetary asset. Protocol kinding fails to account for the fact that the *usability* of the kind depends on centralized infrastructures that *do* rely on collective intentionality regarding legal status.

  Second, consider **regulatory recognition**. While the protocol does not care about the SEC or the IRS, the user's ability to spend Bitcoin for goods or convert it to fiat does. When a government declares Bitcoin a commodity or a security, it alters the institutional context ($C$) in which the status function ($Y$) operates. This regulatory layering affects the stability of the kind by defining the risks and rights associated with holding it.

  Third, and most critically, is the issue of **forks**. When the Bitcoin community disagrees on protocol rules (e.g., the block size debate leading to Bitcoin Cash), the protocol itself cannot determine which chain is the "real" Bitcoin. Both chains satisfy the cryptographic rules of their respective protocols. The determination of which kind retains the ticker "BTC" and the majority of the value is decided by social consensus among miners, developers, and holders. This is a moment where protocol kinding collapses and **institutional kinding** re-emerges: the community must collectively intend for one chain to carry the status of the original asset. This reveals that the stability of the kind ultimately rests on a Schelling point of social coordination, not just code.

  ### Implications for Social-Constructionist Theory

  Does this case strengthen or undermine social-constructionist theories of money that require collective intentionality? It **strengthens** the core thesis while **refining** the mechanism.

  Bitcoin does not refute the claim that money requires collective intentionality; rather, it relocates where that intentionality is directed. In fiat systems, collective intentionality is directed toward the *authority* (the Central Bank). In Bitcoin, collective intentionality is directed toward the *protocol* and the *network*. Users must collectively intend to run the software, validate the blocks, and accept the coin as payment. If everyone stopped believing the code was secure or valuable, Bitcoin would cease to be money, regardless of the cryptographic proof.

  Therefore, the case undermines the specific claim that *centralized* authority is a necessary condition for monetary ontology, but it reinforces the broader claim that *collective acceptance* is necessary. Protocol kinding is not an alternative to social construction; it is a specific technological modality of it. The "algorithmic rules" are only effective because a distributed collective intends to abide by them. The "hidden institutional dependencies" (exchanges, regulators, developer communities) show that even decentralized kinds eventually sediment into institutional forms to achieve scale and stability.

  ### Conclusion

  The episode of Bitcoin strengthens social-constructionist theories of money by demonstrating that collective intentionality is robust enough to sustain a monetary kind without a central sovereign, provided it is anchored in a shared technological framework. However, it reveals that "decentralization" is never absolute; the social kind eventually relies on institutional interfaces for liquidity and legitimacy.

  One feature of the episode that neither framework explains well is **the ontological resolution of contentious hard forks**. Protocol kinding suggests both resulting chains are equally valid "kinds" since both follow algorithmic rules. Institutional kinding suggests a central authority should designate the winner, but none exists. Yet, the market consistently converges on one chain as the "true" continuation based on complex, fluid social coordination that is neither strictly algorithmic nor strictly institutional. This **focal-point coordination** relies on narrative, brand identity, and speculative sentiment in a way that transcends both the rigidity of code and the hierarchy of traditional institutions, pointing to a dimension of monetary ontology rooted in pure intersubjective narrative that remains theoretically under-specified.
