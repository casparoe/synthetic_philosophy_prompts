answer: |-
  ### Categorical Restatement of Bradley's Regress

  Let us posit a category $\mathcal{C}$ in which **objects** represent the terms of discourse (e.g., $A, B$) and **morphisms** represent the relations between them (e.g., $f: A \to B$). In standard categorical semantics, the existence of a morphism $f$ with domain $A$ and codomain $B$ is taken as primitive; the connection is intrinsic to the definition of $f$.

  Bradley's argument challenges this primitivity. He contends that for a morphism $f$ to genuinely relate object $A$ to object $B$, $f$ must itself stand in a specific structural configuration to $A$ and $B$. In categorical vocabulary, this requires that the assignment of domain and codomain is not merely definitional but constitutes a further relational fact. To model this, we must reify the morphism $f$ into an object $[f]$ within a higher structure. Consequently, the original relation is replaced by two new morphisms: one connecting $A$ to $[f]$ and another connecting $[f]$ to $B$.

  However, this generates an infinite regress. If the new morphisms connecting $A$ to $[f]$ are themselves relations, they too must be reified into objects requiring further morphisms to attach them to their terms. This chain never terminates because every attempt to formalize the connection via **composition** of morphisms presupposes that the morphisms are already composable. Specifically, the axiom of **associativity**, which asserts that $(h \circ g) \circ f = h \circ (g \circ f)$, assumes that $f, g,$ and $h$ can be unified into a single path without remainder. Bradley argues that this unification is precisely what requires explanation; asserting associativity merely stipulates the unity it claims to derive.

  To halt this regress, Bradley proposes that truth is not found in the individual morphisms or their composition, but in a singular, all-encompassing structure. In categorical terms, this is analogous to positing a **terminal object** $1$, such that for every object $X$, there exists a unique morphism $!_X: X \to 1$. Here, the distinctions between $A$ and $B$ are preserved as different paths to the terminal object, but their reality is grounded in the unity of $1$ rather than in the external morphisms between them. Alternatively, this unity is modeled by a **universal property**, such as a limit of the entire diagram, where the "judgment" is not a morphism between parts, but the existence of the cone itself. In this view, subject and predicate are distinguished only as components within a single commutative diagram, unified by the global structure of the category rather than by local relational arrows.

  ***

  ### Residue Report

  This translation isolates three distinct classes of mapping success between Bradley's metaphysics and category theory.

  **1. Clean Mappings: Compositional Issues**
  The structural isomorphism between Bradley's regress and the reification of morphisms is robust. Bradley's claim that a relation requires a further relation to connect it to its terms maps cleanly onto the categorical distinction between 1-morphisms and 2-morphisms (or arrows and objects in an arrow category).
  *   **The Regress:** The infinite chain Bradley describes corresponds to the failure to define a **composition** operation without presupposing the compatibility of domains and codomains. If one treats the domain function $dom(f)$ as a relation rather than a definition, one requires a morphism to connect $f$ to $dom(f)$, initiating the regress.
  *   **Associativity:** Bradley's suspicion of relational unity maps well onto the categorical axiom of associativity. In category theory, associativity is a constraint ensuring that diagrams commute; for Bradley, this constraint is an unproven assumption that the terms are already sufficiently unified to permit grouping. The regress exposes that associativity cannot be derived from the morphisms alone; it must be imposed from outside the local relations.

  **2. Distorted Mappings: The Absolute and Experience**
  Translating Bradley's positive doctrine (the Absolute, immediate experience) requires significant distortion of categorical constructs.
  *   **The Absolute as Terminal Object:** Mapping the Absolute to a **terminal object** captures the notion of ultimate unity (all paths lead to one), but it fails to capture Bradley's insistence that the Absolute is *concrete* and *all-inclusive*. A terminal object is abstract and external to the objects mapping to it; Bradley's Absolute is the internal reality of the objects themselves. A **limit** of the entire category is a closer fit, as it incorporates the diagram's structure, but standard category theory prohibits a category from being an object within itself (due to size restrictions), forcing a move to higher categories that Bradley would likely reject as further abstraction.
  *   **Judgment as a Cone:** Modeling judgment as a commutative diagram or a cone captures the "single experience" aspect, where the truth is the whole structure. However, this distorts Bradley's notion of "feeling." A commutative diagram is a static logical condition; Bradley's immediate experience is a qualitative, temporal state. The categorical model preserves the *unity* of judgment but loses the *phenomenology*.

  **3. Untranslatable Residue: Ontological Status**
  The most significant residue lies in the normative and ontological claims that have no categorical expression.
  *   **Reality vs. Consistency:** Category theory is concerned with consistency and structural coherence, not ontological reality. Bradley's core claim is that relations are *unreal* (contradictory), not merely undefined. In category theory, a morphism exists if the axioms allow it; there is no vocabulary to assert that a well-defined morphism is "appearance" rather than "reality."
  *   **The Denial of External Relatedness:** Bradley argues that no relation can genuinely unify terms because the relation remains distinct from the terms. Category theory is built on the premise that morphisms *do* unify objects by definition. There is no categorical expression for the claim that a morphism fails to connect its domain and codomain ontologically, even if it does so structurally. The very language of "domain" and "codomain" presupposes the successful attachment Bradley denies.

  ***

  ### Assessment: Gap or Dissolution?

  The untranslatable residue suggests that Bradley was pointing to a genuine foundational gap, though his conclusion that relations are unreal may be an overcorrection.

  **The Argument Dissolves Structurally:**
  Within the formal system of category theory, Bradley's regress dissolves immediately. The regress relies on treating domain/codomain assignments as relations requiring further relations. Category theory blocks this by axiom: domain and codomain are functions defined on the collection of morphisms, not morphisms themselves. By treating composition and identity as primitive, category theory declares the regress a category mistake. If one accepts the axioms of a category, the "unity" of terms is guaranteed by the structure, and the demand for a further unifier is ill-formed. From this perspective, Bradley's argument is a refusal to accept primitive structural rules, mistaking a definitional boundary for an ontological deficit.

  **The Gap Remains Foundationally:**
  However, the residue indicates that Bradley identified a real limit in relational frameworks regarding *grounding*. Category theory explains how relations behave *if* they exist, but it does not explain *why* the category exists or what grounds the composition law. Bradley's demand for a "non-relational experience" is a demand for a ground that is not itself another relation.
  *   **The Gap:** The gap is between *structural connectivity* (morphisms) and *ontological unity* (the Absolute). Category theory provides the former but is silent on the latter. Bradley's insight is that a system of pure relations (a graph) floats without anchorage unless there is a context (the category/universe) that holds them together.
  *   **Conclusion:** Bradley's argument does not prove relations are unreal, but it does demonstrate that relational frameworks cannot be self-grounding. They require a meta-context (the Category, the Absolute, or the Mind) that is not itself merely another node in the relational network. The argument dissolves only if one is willing to accept structural primitives without ontological justification. If one demands an ontological ground for the structure itself, Bradley's regress re-emerges as the problem of explaining why the axioms of composition hold, rather than how they operate. Thus, the argument exposes the difference between *coherence* (category theory) and *truth* (Bradley's metaphysics).
