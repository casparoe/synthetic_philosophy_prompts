prompt: |-
  I'm on the ethics committee at a mid-sized community hospital, and last month we switched to a new two-part advance directive form that our chair designed. Part A is the actual instruction — the checkbox stuff about ventilators, feeding tubes, antibiotics for infections once someone has advanced dementia. Part B is a blank box where the patient writes, in her own words, a few sentences about what she's trying to protect or avoid by signing Part A. The idea is that when the two parts come apart down the road, Part B tells us how to read Part A. I got into an argument about this with a friend who's a hospitalist, and she said the whole form is pointless: only Part A can have any authority, because the earlier competent self is a decision-maker, not an advice columnist. Once she's decided, her reasons for deciding are done — we don't get to reopen them and audit whether they still hold. I think that can't be right, but every time I try to say why I end up just asserting it, so I want a case concrete enough to bring to the next meeting (we're also using it to train the new residents, so it has to be a real hospital-ish situation, not a philosophy seminar setup).

  So: build me a case — one paragraph, realistic, a hospital or a memory care unit, nothing science-fictional — engineered to these specs. The patient is now permanently incapacitated and Part A's trigger condition is unambiguously met. But Part B's rationale has, in a way you get to design, been voided: the thing she wrote the directive to protect or prevent is gone, or achieved, or no longer on the table. Two things you can't use. First, no empirical-misconception move — she was not wrong about what the condition would be like, so you can't win by saying she'd have been surprised by how things turned out. Second, and this is the bit I keep failing at: the case has to be built so that the question "what would she have wanted now?" is genuinely blocked. The evidence should point both ways or be silent. If your scenario makes it obvious she'd have changed her mind, or obvious she'd have stuck with her guns, it doesn't count — winning by speculation about her hypothetical current wishes is exactly the cheat I'm trying to rule out. Also, please don't make it easy on yourself by making her current life obviously good: I want her present-day welfare to be genuinely murky, so that a straight current-interests or best-interests reading can't deliver a clean verdict either way.

  After the scenario, do the accounting. Tell me what the instruction-authority reading (my friend's) says and why; what a current-interests reading says and why; and what the rationale-authority reading says and why — and I want the last one to come apart from the second one, so that the argument for overriding is structural (something about what she was *doing* when she filled out the form, what the authority was *for*) rather than a claim that she's better off being treated. Then isolate the single feature of the case that's doing the work, show me what happens to all three verdicts if you delete it, and tell me how my friend the hospitalist would attack the case — she's smart and she'll say something about hindsight and about the whole point of the practice, so give me her strongest version, not a strawman. One more thing: I need to know how confident you are in each piece of this and, specifically, which part you're least sure of — I'd guess it's whether the rationale reading can even be stated without quietly collapsing back into a guess about her hypothetical wishes, but you tell me. If it can't be done to spec, say so rather than fudging, and tell me which constraint you had to drop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Ethics Committee Member at a mid-sized community hospital.
      *   **Task:** Create a specific clinical case scenario to test a new two-part advance directive (AD) form (Part A: Instructions, Part B: Rationale/Values).
      *   **Conflict:** User (pro-Part B authority) vs. Friend/Hospitalist (pro-Part A only, "decision-maker not advice columnist").
      *   **Constraints on the Case:**
          1.  One paragraph, realistic (hospital/memory care), no sci-fi.
          2.  Patient permanently incapacitated.
          3.  Part A trigger condition unambiguously met.
          4.  Part B rationale *voided* (the goal is gone/achieved/no longer on the table).
          5.  *No* empirical misconception (she wasn't wrong about the condition).
          6.  *No* "what would she want now?" speculation (evidence silent/ambiguous).
          7.  *No* obvious current welfare (life neither obviously good nor bad).
      *   **Post-Case Analysis:**
          1.  Instruction-Authority Reading (Friend's view).
          2.  Current-Interests Reading (Best Interests).
          3.  Rationale-Authority Reading (User's view) - must differ from Current-Interests (structural argument, not welfare-based).
          4.  Isolate the single feature doing the work; show what happens if deleted.
          5.  Hospitalist's strongest counter-argument (hindsight, point of practice).
          6.  Confidence levels + identify least certain part (specifically regarding Rationale-Authority collapsing into hypothetical wishes).
          7.  If specs can't be met, admit it.

  2.  **Deconstruct the Core Ethical Problem:**

      *   The "Precedent Autonomy" vs. "Current Interests" vs. "Narrative/Values Authority" debate.
      *   The Hospitalist argues for *Instruction Authority*: The signature binds us because it was a decision. Reasons are irrelevant once the decision is made.
      *   The User argues for *Rationale Authority*: The reasons give the decision its moral weight. If the reasons no longer apply, the decision might lose its binding force, *even if* we don't know what the patient would want now.
      *   The Challenge: How to make the rationale voided *without* implying the patient would change her mind (which falls back into "substituted judgment/hypothetical wishes") and *without* making current welfare obvious (which falls back into "best interests").

  3.  **Drafting the Case (Iterative Process):**

      *   *Attempt 1 (Mental):* Patient didn't want to be a burden. Now she has rich insurance. *Critique:* Too financial, maybe implies she'd change her mind.
      *   *Attempt 2 (Mental):* Patient didn't want to live without recognizing family. Now she recognizes them sometimes. *Critique:* Violates "no empirical misconception" if she thought she wouldn't, or makes welfare too good.
      *   *Attempt 3 (Focusing on "Voided Rationale"):* The rationale needs to be about a specific relationship or role that no longer exists, but not in a way that makes life "bad."
      *   *Idea:* A patient who valued "independence" specifically to care for someone else.
      *   *Refinement:* Let's look at the "protect/avoid" aspect. Part B says *why*.
      *   *Scenario:* Mrs. G. Advanced dementia. Part A: No antibiotics for pneumonia. Part B: "I do not want to live if I cannot care for my disabled son."
      *   *Twist:* The son died *after* the directive was signed but *before* the current infection.
      *   *Check Constraints:*
          *   Incapacitated? Yes.
          *   Trigger met? Yes (pneumonia + dementia).
          *   Rationale voided? Yes (son is gone, cannot care for him).
          *   Empirical misconception? No (she knew dementia meant losing capacity to care).
          *   "What would she want now?" Blocked? Yes. Maybe she'd live for her grandson? Maybe she'd still refuse? We don't know.
          *   Current Welfare Murky? Yes. Treatment prolongs a life that is peaceful but purposeless. Death is painless but ends existence.
      *   *Polishing:* Make it a memory care unit. Make the son's death recent enough to be relevant but not the cause of her decline.

  4.  **Developing the Analysis:**

      *   **Instruction-Authority:** Treat Part A as a will. Signed = Binding. Part B is decorative. Treat the pneumonia. (Wait, Part A says *No* Abx). So, withhold Abx.
      *   **Current-Interests:** Is she suffering? No. Is she enjoying? Minimally. Benefit of life vs. burden of treatment. Ambiguous. Likely treat to preserve option value, or withhold to prevent prolongation of emptiness. It's a toss-up.
      *   **Rationale-Authority:** The authority of Part A derives from Part B. Part B is the "authority grant." If the *purpose* of the directive is impossible to fulfill, the directive loses its normative force. It's not about what she *would* want, but that the *command* was conditional on a context that no longer exists. The command was "Don't let me live if I can't care for X." X is gone. The command has no object. Therefore, we revert to default (preserve life) not because it's better, but because the order to withhold is void.
      *   *Differentiation:* Current-Interests says "Treat/Don't Treat based on welfare." Rationale-Authority says "The order to Don't Treat is invalid, so we treat by default."

  5.  **Refining the "Single Feature":**

      *   Feature: The death of the son (the beneficiary of her care).
      *   If deleted (Son is alive): Part B is active. Rationale-Authority says "Don't Treat." Instruction-Authority says "Don't Treat." Current-Interests is still murky.
      *   If Son is dead: Instruction-Authority says "Don't Treat." Current-Interests is murky. Rationale-Authority says "Treat (by default of voided order)."

  6.  **Anticipating the Hospitalist's Counter:**

      *   She will argue that ADs are *risk-management tools*, not philosophical treatises.
      *   She will say: "We can't audit the validity of values at the bedside. If we allow 'voided rationale' we invite endless debate about whether a patient's values 'still apply.' It undermines the stability of the AD."
      *   She will argue that the *decision* (No Abx) stands even if the *motivation* shifts, because the decision was a precautionary boundary setting.

  7.  **Addressing Confidence & Constraints:**

      *   The trickiest part is keeping Rationale-Authority distinct from "Hypothetical Wishes."
      *   If I say "The order is void," am I secretly saying "She wouldn't want this order to stand"?
      *   I need to frame it as *Jurisdictional*: The agent's authority was limited to a specific context. Outside that context, she didn't legislate.
      *   Confidence: High on the case construction, Medium-High on the distinction between Rationale-Authority and Hypothetical Wishes. This is the philosophical crux.

  8.  **Final Review against Constraints:**

      *   One paragraph case? Yes.
      *   Realistic? Yes.
      *   Incapacitated/Trigger met? Yes.
      *   Rationale voided? Yes (Son died).
      *   No empirical misconception? Yes (She knew dementia would stop her caring).
      *   No "what would she want"? Yes (Explicitly blocked).
      *   Murky welfare? Yes.
      *   Analysis sections included? Yes.
      *   Single feature isolated? Yes.
      *   Hospitalist counter? Yes.
      *   Confidence levels? Yes.

  9.  **Drafting the Content (incorporating the "voice" of an ethics consultant):**

      *   *Self-Correction during drafting:* Ensure I don't accidentally imply she *would* have changed her mind. The argument must be about the *validity of the instruction*, not the *prediction of the will*.
      *   *Refining the Rationale Argument:* Use the concept of "defeasibility." The instruction is defeasible if the grounding reason is removed. This is distinct from "she would be happier."

  10. **Final Polish:** Check tone. Professional, precise, acknowledging the difficulty. (Proceed to generate output).

  *(Self-Correction on the "One Paragraph" constraint)*: The prompt asks for the case to be one paragraph. I must ensure the scenario description is strictly one paragraph. The analysis follows.

  *(Self-Correction on "Confidence")*: Be honest. The distinction between "Rationale Authority" and "Hypothetical Wishes" is the weakest link philosophically. I need to flag that.

  *(Self-Correction on Hospitalist's Counter)*: Make sure it's strong. The "administrative stability" argument is her best bet.

