prompt: |-
  I teach a senior seminar on decision theory and I'm writing the final exam. I want an essay question on the Death in Damascus case that forces students to grapple with whether it's really just Newcomb's problem in different clothing or whether it raises a distinct challenge. The question should make them articulate the exact structure of the correlation in each case and say whether causal decision theory handles both equally well, or whether Death in Damascus exposes a crack that Newcomb's problem doesn't. Please write the question, a model answer of about 700 words, and a marking scheme that separates an A from a B from a C answer by naming the specific moves each grade band must contain. The exam is three hours and this is one of two questions, so students have about 90 minutes for it. Oh and the course has already covered both Newcomb's problem and Death in Damascus in detail, so they know the cases — what I'm testing is whether they've actually understood the architecture of the two puzzles rather than just memorised which theory says what.
