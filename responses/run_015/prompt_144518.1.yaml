answer: |-
  You have put your finger on a genuine contradiction, and one that goes to the heart of how we try to make meaning travel across borders. The care label is a fascinating object because it is a hybrid creature: it wants to be a picture so it can be universal, but it must be a law so it can be enforceable. To reconstruct the theory of meaning implicit in this practice, we must separate the story the system tells about itself from the work the system actually does.

  The practice presents itself on the assumption that pictures are natural and words are arbitrary. The theory here is that a picture of a tub resembles washing, and a picture of an iron resembles pressing, in a way that the word 'wash' or 'press' does not. This suggests that the meaning is carried by likeness, not by convention. If this were strictly true, the system would not need a committee to revise it every few years, nor would it need legal protection. You cannot copyright a likeness of the sun, but you can copyright a specific drawing of a sun used as a logo. The fact that the symbols are owned and regulated proves that the system strictly presupposes convention, not nature. It suits the practice to claim naturalness because it reduces friction in trade; if a buyer in Tokyo and a buyer in London both believe they are looking at a simple picture of reality, they do not argue about the translation. But what actually makes the label work is not that the tub looks like a tub, but that both parties have agreed to treat the tub as a sign for a specific industrial process.

  So, a thoroughly conventionalist account explains the practice better than a naturalist one. The system works across borders not because pictures bypass language, but because the convention has been successfully exported. The picture is merely the vessel for the convention. This means the practice is more underdetermined than it looks. The symbol does not force its meaning upon you; you must have been initiated into the code to read it. A person who has never seen a care label might look at a crossed-out triangle and see a forbidden game of noughts and crosses, not a prohibition on bleach. The 'self-explanatory' quality is an illusion generated by familiarity.

  You ask whether the system of crossing out, underlining, and repeating constitutes a grammar. It does. A set of likenesses is just a collection of mirrors; a grammar is a set of rules for combining signs to alter their meaning. When you strike a line through a symbol, you are applying an operator of negation. When you place a bar underneath, you are applying an operator of modification (gentler treatment). When you repeat a symbol or add dots, you are applying an operator of quantification or ordering. This is syntax. It is no different in kind from adding 'un-' to a word or changing a verb ending. The moment the system admits these operators, it admits that the picture is not doing all the work. The picture provides the noun (the tub, the iron), but the grammar provides the logic. Consequently, the appeal of calling the system 'natural' does not survive. A natural sign, like smoke indicating fire, does not need a minus sign to indicate the absence of fire. The moment you need a convention to negate the picture, you have left the realm of pure likeness and entered the realm of language.

  This brings us to Neurath and the tension you identified. Neurath's picture language was built on the idea that pictures could bridge gaps between people, yet his famous metaphor of the boat insists that we have no solid ground to stand on. We are sailors rebuilding our ship at sea, using old planks to replace rotten ones, never able to start from the keel. There is a tension here between the faith in the self-explanatory picture and the suspicion of any pristine starting point.

  If pictures were truly self-explanatory, they would be that keel: a foundation outside of history and convention. But Neurath knew they were not. He called his system a 'technique' rather than a language precisely to acknowledge this. A language implies a complete system of meaning that can stand on its own. A technique is a tool used within a larger, messy context. By calling it a technique, he dissolves the tension by lowering the claim. He is not saying pictures solve the problem of meaning; he is saying pictures are a useful tool for navigating the problem while we are still at sea. The tension is not resolved, but it is managed. The care label system, however, often forgets this modesty. It presents the technique as a solution. It pretends the ship is dry-docked when it is not.

  If we were to make the practice faithful to the implicit theory—that is, if we admitted the system is conventional and not natural—several things would have to change. Firstly, regarding the temperature: dropping the numerals and going purely ordinal, using only dots or bars, would be more faithful to the picture-language idea. Numerals are words; they belong to specific linguistic groups (Arabic numerals are not universal everywhere, though they are close). Dots are more abstract and graphical. However, this would make the label less informative. It would tell you 'hotter' or 'colder' without telling you 'forty degrees'. This highlights the trade-off: the more you rely on pure pictures to be universal, the less precise information you can carry. Precision requires convention (words/numbers), which sacrifices universality. The current hybrid system is a compromise that privileges precision over purity.

  Secondly, regarding the instruction versus tolerance issue: a label that honestly stated what is *required* rather than what is *tolerated* would be dangerous under the current theory. The current system is a warning system ('do not exceed this'), which protects the manufacturer. An instruction system ('you must do this') shifts the liability to the user and requires a much higher degree of specificity. To say what is required, you would need more language, not less. You would need to specify detergent types, cycle durations, and mechanical actions. The picture language collapses under this weight. It can handle prohibitions well (a cross is a strong sign), but it struggles with nuanced requirements. So, no, a label could not honestly be made to say what is required without ceasing to be a simple picture label and becoming a manual.

  The gap you see between the system's presentation and its operation is the gap between the hope for a universal language and the reality of a regulated trade standard. The practice strictly presupposes that the user has been trained. It merely suits the practice to pretend the user has not. The symbols are not windows onto reality; they are buttons on a control panel that only work if the wiring is standardised behind the wall.

  Neurath's boat metaphor fits the care label perfectly if we accept that the label is not a new ship, but a repair on the old one. We cannot start from scratch with pure pictures because we need to convey specific industrial data (temperature, chemical limits). So we patch the old language of numbers and laws onto the new language of symbols. The tension between the faith in the picture and the suspicion of the starting point is real, but it is productive. It forces the system to be a hybrid. If it were purely pictorial, it would be too vague for compliance. If it were purely textual, it would be too fragmented for global trade.

  In conclusion, the theory of meaning that makes sense of your care labels is not one of natural likeness, but of regulated convention disguised as likeness. The system presupposes a shared agreement, not a shared perception. The grammar of crosses and bars proves it is a language, not a gallery of images. Neurath was right to call it a technique; it is a tool for managing communication, not a magic key that unlocks understanding without effort. If the designers of your labels were fully honest about their implicit theory, they would admit that the label is a code that requires a key, and that the key is not the picture itself, but the standard that defines it. The appeal of the self-explanatory picture survives only because it is useful to pretend that the code is nature. But as you have seen, nature does not need a committee to revise it every few years.
