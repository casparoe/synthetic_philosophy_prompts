          *   *The Reality:* It is deeply conventional. The cross means "do not" (not inherent in the cross). The dots mean temperature (arbitrary mapping). The underline means "gentle" (arbitrary).
          *   *Conclusion:* A conventionalist account explains it *better*. The appeal to "naturalness" is marketing/ideology, not semiotic reality. It works across borders not because pictures are universal, but because the convention has been *standardised* internationally (ISO etc.).
          *   *Strict Presupposition:* The practice strictly presupposes *shared training*, not shared perception. It suits the practice to *claim* naturalness because it reduces friction in trade.

      *   **Grammar vs. Likeness:**
