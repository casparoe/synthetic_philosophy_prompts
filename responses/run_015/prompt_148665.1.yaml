answer: |-
  **The Temporal Horizon of Thought: Why Speed Matters for Functionalism**

  Functionalism promised to liberate the mind from the meat. By defining mental states not by their physical composition but by their causal roles—their relationship to inputs, other internal states, and outputs—it allowed for the possibility of silicon minds, alien consciousness, and artificial intelligence. The core tenet is substrate neutrality: if the logic is the same, the mind is the same. However, this abstraction faces a devastating challenge when time is stretched to its breaking point. Consider the case of the "Slow Warehouse": a system functionally isomorphic to a human brain, but implemented via a relay of people with abacuses, taking forty years to recognize a face that a biological brain processes in half a second. Intuitively, we recoil at calling this system a "mind." It feels less like a thinker and more like an archive of a thought. This intuition reveals a critical flaw in orthodox functionalism. To remain viable, functionalism must abandon the notion that speed is merely an engineering detail. Temporal coherence and real-time causal efficacy are not accidental features of a mind; they are constitutive requirements. To claim otherwise is not to protect the theory from biological chauvinism, but to detach the concept of "function" from the concept of "cause."

  The standard functionalist defense relies on multiple realizability. If mental state $M$ is defined by the transition from input $I$ to output $O$ via internal state $S$, then the physical medium and the duration of the transition should be irrelevant. A thought is a logical relation, not a physical event. From this perspective, rejecting the Slow Warehouse because it is sluggish is indeed a form of bias—specifically, "carbon chauvinism." It privileges the speed of neural firing simply because that is the speed we are accustomed to. If we accept this view, the warehouse *is* recognizing your mother; it is just doing so on a geological timescale. We are merely impatient observers unable to grasp the grandeur of its slow cognition.

  However, this defense collapses when we examine what mental states are *for*. Functionalism defines states by their causal powers. A belief is a state that disposes an agent to act in certain ways given certain inputs. But causality is inherently temporal. For a state to have causal power, it must be able to intervene in the world while the relevant conditions still obtain. If a system takes forty years to recognize a face, the person whose face was recognized is likely dead by the time the output "Mom" is generated. The causal loop is broken. The output no longer functions as a recognition; it functions as a historical record. A map that updates slower than the terrain changes is not a map; it is a painting. Similarly, a cognitive system that cannot process information within a timeframe relevant to its own persistence and environmental interaction lacks the causal efficacy required to possess genuine mental states.

  Furthermore, there is the issue of internal unity. Mental states are not isolated atoms; they are integrated. To recognize a face involves holding visual data in working memory, accessing long-term memory, and correlating emotional valence, all within a unified "specious present." In the Slow Warehouse, the "states" are distributed across decades. The "input" state exists in year one, while the "processing" state exists in year twenty. There is no single moment where the system actually *holds* the information together as a unified whole. It is a sequence of static configurations, not a dynamic process. To call this a mind is to confuse the script of a play with the performance. The script contains all the functional relationships of the dialogue, but without the temporal flow of performance, there is no drama. Likewise, without temporal density, there is no cognition.

  Critics might argue that imposing a speed limit is simply smuggling biology back in under the guise of physics. They might ask: "What is the magic number? Is 39 years too slow, but 30 years okay?" This is a sorites paradox, but it does not invalidate the principle. The boundary is not arbitrary biology; it is the boundary of causal relevance. A silicon chip running at 1Hz is still a mind because its internal states interact faster than its environment changes relative to its operational scale. The Slow Warehouse fails not because it is made of humans or abacuses, but because its internal causal density is lower than the rate of external change. It cannot act as an agent because it cannot close the loop between perception and action. Therefore, requiring real-time processing is not biological bias; it is a requirement for agency.

  Ultimately, functionalism must distinguish between a *simulation* of a function and the *realization* of a function. The Slow Warehouse simulates the logical topology of a brain, but it does not realize the causal dynamics. It creates a static trace of a computation rather than a living process. If we allow functionalism to ignore time, we render the theory vacuous, allowing any static object that can be interpreted as a state-transition table to count as a mind. A stone could be a mind if we interpret its erosion patterns as slow computation. To avoid this absurdity, we must accept that time is not a container for computation, but a ingredient of it.

  Therefore, computation speed and temporal coherence must be part of what counts as having a mind. This is not a retreat into biological essentialism, but a refinement of causal materialism. A mind is not just a pattern; it is a pattern that *happens*. It requires a rate of change sufficient to sustain causal integration between its parts and between itself and the world. The warehouse of abacuses does not think; it merely stores the ghost of a thought. Functionalism survives only if it acknowledges that to think is to act, and to act is to act in time.
