answer: |-
  ### Part 1: The Logical Space

  Before we get to the questions, here is the map of the territory you are arguing over. We aren't using names like "transcendental" or "a priori." We are looking at the job a proposition does in your life.

  There are four axes of distinction here. Your two main concerns are built into the first two.

  1.  **The Scope Axis (Universal vs. Local):** Does this proposition hold the world together for *any* human being capable of language and action (Universal), or does it only hold together a specific game we are playing, like science, law, or medicine (Local)?
  2.  **The Relativity Axis (Fixed vs. Split):** Does this proposition do the same job for everyone who says it, or does it do one job for you (stopping the argument) and another job for a specialist (starting an investigation)?
  3.  **The Time Axis (Static vs. Riverbed):** Has this proposition always done this job, or did it used to be something people argued about before it sank into the mud and became the ground we stand on?
  4.  **The Vulnerability Axis (Fact vs. Framework):** If the world seemed to contradict this, would you change your mind (Fact), or would you assume the measurement was wrong (Framework)?

  Combining these creates a grid of possibilities. Some squares on the grid are crowded with philosophical positions; some are empty because no one can make sense of them. The decision tree below is designed to walk you through this grid without needing to know the map in advance.

  ***

  ### Part 2: The Decision Tree

  Here are the eight branch questions. Answer them in order for each proposition. Do not worry about where the branch leads; just answer based on what you would actually *do* in the scenario described.

  **Q1. The Denial Test**
  If a sane, sober friend looked you in the eye and denied this proposition, would your first instinct be to **look for evidence** (check a book, run a test, go outside) or to **question their grasp of the situation** (assume they are joking, confused, or speaking a different language)?
  *   *Go to Q2 if Evidence.*
  *   *Go to Q3 if Question Grasp.*

  **Q2. The Defeat Test**
  (You are looking for evidence.) Suppose the evidence came back clearly contradicting the proposition. Would you **accept the evidence and drop the claim**, or would you **assume the evidence is flawed** because the claim *must* be true?
  *   *Go to Leaf A if Accept Evidence.*
  *   *Go to Leaf B if Assume Flawed.*

  **Q3. The Universality Test**
  (You are questioning their grasp.) Is this proposition necessary for **any human being** to get through a day (eating, talking, moving), or is it only necessary for people doing **specific jobs or practices** (like scientists, bankers, or doctors)?
  *   *Go to Q4 if Any Human.*
  *   *Go to Q5 if Specific Jobs.*

  **Q4. The History Test**
  (Any Human.) If you asked your great-grandparents, would they have treated this as something **obvious to everyone**, or as something **people argued about or weren't sure of**?
  *   *Go to Leaf C if Obvious.*
  *   *Go to Leaf D if Argued About.*

  **Q5. The Expert Test**
  (Specific Jobs.) If you asked a top specialist in that field (e.g., a neuroscientist for pain, a chemist for water), would they treat this proposition as a **rule they must assume to work**, or as a **fact they might test or refine**?
  *   *Go to Leaf E if Rule.*
  *   *Go to Leaf F if Fact.*

  **Q6. The Practice Shift Test**
  (You are at Leaf E or F.) If the specific practice changed (e.g., we stop doing medicine, or we stop doing chemistry), would this proposition **lose its force entirely**, or would it **remain true but useless**?
  *   *Go to Leaf G if Lose Force.*
  *   *Go to Leaf H if Remain True.*

  **Q7. The Word-Check Test**
  (Back to Q1: Question Grasp.) If you tried to explain why they are wrong, would you find yourself **describing the world** or **explaining how we use words** (e.g., "That's not what 'pain' means")?
  *   *Go to Leaf I if Describing World.*
  *   *Go to Leaf J if Explaining Words.*

  **Q8. The Future-Proof Test**
  (Any branch where you are unsure.) Can you imagine a future where this proposition is **checked routinely**, whereas now it is not?
  *   *Go to Leaf K if Yes.*
  *   *Go to Leaf L if No.*

  *(Note: To keep the leaves tight, some paths converge. The leaves below represent the final destinations.)*

  ***

  ### Part 3: The Leaves (Positions)

  Here are the destinations. I have named them where philosophy has a name for the crowd standing there, and left them unnamed where the spot is empty.

  **Leaf A: The Hard Empirical Fact**
  *   **Description:** You check it, and if proof contradicts it, you drop it. It is vulnerable.
  *   **Named Position:** **Falsifiable Empiricism.**
  *   **Why:** This is standard scientific observation.

  **Leaf B: The Dogmatic Fact**
  *   **Description:** You check it, but you won't accept evidence against it. You treat a fact like a rule.
  *   **Named Position:** **Ideology / Dogma.**
  *   **Why:** This is what happens when a hinge masquerades as a fact but refuses to die.

  **Leaf C: The Human Bedrock**
  *   **Description:** Necessary for all humans, always has been.
  *   **Named Position:** **Universal Hinge (Static).**
  *   **Why:** These are the propositions Wittgenstein thinks are tied to our biological form of life.

  **Leaf D: The Fossilized Question**
  *   **Description:** Necessary for all humans now, but used to be debated.
  *   **Named Position:** **Riverbed Proposition.**
  *   **Why:** This captures the shifting nature of certainty; the water of argument has turned to stone.

  **Leaf E: The Local Rulebook**
  *   **Description:** Necessary for a specific job, and even experts treat it as a rule.
  *   **Named Position:** **Institutional Hinge.**
  *   **Why:** Rules of chess or legal definitions; they are true because we agree to play the game.

  **Leaf F: The Specialist's Fact**
  *   **Description:** Necessary for a specific job for you, but experts treat it as a testable fact.
  *   **Named Position:** **Relative Hinge (Layman) / Empirical (Expert).**
  *   **Why:** This captures your "Same Sentence" distinction. It is a hinge for the pub group, a fact for the lab.

  **Leaf G: The Contingent Rule**
  *   **Description:** If the practice stops, the proposition loses force.
  *   **Named Position:** **Conventionalism.**
  *   **Why:** Truth is dependent on the continuation of the institution.

  **Leaf H: [Unnamed]**
  *   **Description:** If the practice stops, the proposition remains true but useless.
  *   **Why nobody sits here:** **Unattractive.** If a truth relies on a practice to be meaningful, claiming it survives the practice's death is metaphysical baggage most people discard.

  **Leaf I: [Unnamed]**
  *   **Description:** You question their grasp, but you describe the world to fix it.
  *   **Why nobody sits here:** **Incoherent.** If you are explaining their grasp of reality rather than words, you should be looking for evidence (Q1). This is a confused state between Q1 and Q3.

  **Leaf J: The Grammatical Proposition**
  *   **Description:** You explain how words work. It is true by definition.
  *   **Named Position:** **Analytic / Grammatical.**
  *   **Why:** These are tautologies disguised as facts (e.g., "Bachelors are unmarried").

  **Leaf K: The Shifting Local Hinge**
  *   **Description:** A local rule that might become a fact later.
  *   **Named Position:** **Local Riverbed.**
  *   **Why:** Practices evolve; what is a rule today is a finding tomorrow.

  **Leaf L: [Unnamed]**
  *   **Description:** A universal hinge that will never be checked.
  *   **Why nobody sits here:** **Unexplored.** It is hard to distinguish this from Leaf C without waiting for history to pass.

  ***

  ### Part 4: Running Your Examples

  Here is where your nine examples land. I have marked **Judgment Calls** where your group might reasonably disagree based on how you interpret the question.

  | Example | Path | Leaf | Notes |
  | :--- | :--- | :--- | :--- |
  | **1. I have two hands** | Q1 (Grasp) → Q3 (Human) → Q4 (Obvious) | **C: Human Bedrock** | **Judgment Call:** In a medical context (amputation), this moves to Leaf F (Specialist's Fact). For the pub group, it is Bedrock. |
  | **2. Earth is very old** | Q1 (Grasp) → Q3 (Human) → Q4 (Argued) | **D: Fossilized Question** | This is the perfect Riverbed example. 18th century: Argued. Now: Bedrock for us. |
  | **3. No time travel** | Q1 (Evidence) → Q2 (Flawed) | **B: Dogmatic Fact** | **Judgment Call:** We treat it as fact, but if proof appeared, we'd likely call the proof flawed rather than accept time travel. It acts like a hinge disguised as a negative fact. |
  | **4. That person is in pain** | Q1 (Grasp) → Q3 (Human) → Q4 (Obvious) | **C: Human Bedrock** | **Judgment Call:** Wittgenstein argues this is a criterion, not a fact. If you treat it as inference, it goes to Leaf A. If you treat it as immediate, it's Bedrock. |
  | **5. Memory is reliable** | Q1 (Grasp) → Q3 (Human) → Q4 (Argued) | **D: Fossilized Question** | **Judgment Call:** Skeptics argue this is always open. Most people treat it as Bedrock now, but philosophy suggests it was once a live question. |
  | **6. Water is H2O** | Q1 (Grasp) → Q3 (Specific) → Q5 (Fact) | **F: Specialist's Fact** | For you: Hinge (definition). For Chemist: Empirical discovery. This captures your "Same Sentence" distinction perfectly. |
  | **7. Two and two make four** | Q1 (Grasp) → Q7 (Words) | **J: Grammatical** | Denying this suggests a misunderstanding of 'two' or 'make'. It is a rule of calculation, not a description of apples. |
  | **8. Not a brain in a vat** | Q1 (Grasp) → Q3 (Human) → Q4 (Obvious) | **C: Human Bedrock** | **Judgment Call:** This is the ultimate hinge. You cannot check it (Q1). It is required for any other check to make sense. |
  | **9. World didn't start 5 mins ago** | Q1 (Grasp) → Q3 (Human) → Q4 (Argued) | **D: Fossilized Question** | Similar to Earth's age. Russell raised it as a philosophical problem, but in daily life, it is treated as Bedrock. |

  ***

  ### Part 5: Flags and Warnings

  **Indistinguishable Leaves:**
  *   **Leaf C (Human Bedrock) and Leaf D (Fossilized Question):** The tree separates these by history (Q4), but in *practice*, they feel identical today. You act the same way regarding "I have hands" and "The earth is old." The distinction is purely genealogical. If your group cares only about current function, these two leaves are the same.
  *   **Leaf E (Local Rulebook) and Leaf J (Grammatical):** Both involve explaining words/rules. The difference is scope (Human vs. Specific Job). If your "Specific Job" is "Speaking English," these collapse into each other.

  **Judgment Calls (Where the Tree Relies on You):**
  *   **Q1 (Evidence vs. Grasp):** This is the biggest fork. For "I have two hands," most say "Grasp." But a prosthetist might say "Evidence." The tree forces you to choose your context.
  *   **Q2 (Accept vs. Flawed):** For "No time travel," would you really accept evidence? If you say "Yes," it becomes Leaf A (Hard Fact). If "No," it becomes Leaf B (Dogma). This reveals whether you think physical laws are hinges or just very strong facts.
  *   **Q5 (Expert Rule vs. Fact):** For "Water is H2O," a chemist might say it's a definition (Rule) now, not a discovery (Fact). If they say Rule, it moves to Leaf E. This depends on whether you view scientific kinds as discovered or stipulated.

  **The Riverbed Status:**
  *   The tree places the Riverbed specifically at **Leaf D** and **Leaf K**.
  *   It does not break the tree; it is handled by Q4 (History) and Q8 (Future).
  *   However, note that **Leaf D** implies the riverbed has *stopped* moving for now. If you think the bed is currently shifting (e.g., AI consciousness), you might oscillate between D and A during a single meeting. The tree assumes a snapshot in time.

  **The Two Load-Bearing Distinctions:**
  1.  **Local vs. Universal:** Handled at **Q3**. This separates "Water is H2O" (Local) from "I have hands" (Universal).
  2.  **Same Sentence/Different Status:** Handled at **Q5**. This separates the Layman's view of Water (Hinge) from the Chemist's view (Fact).

  Use this to settle your bets. If two of you land on different leaves, check which Question number you diverged on. That is the precise point of your philosophical disagreement.
