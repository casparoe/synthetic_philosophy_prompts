      *   *Inconsistency:* Legal/moral unity vs. empirical/functional duality (especially regarding consent/assent during testing).
      *   *Dual-Center Model Implications:* If we take the "two minds" theory seriously (like Puccetti or Marks), we need two consents, two billing structures, potentially two guardians, etc.
