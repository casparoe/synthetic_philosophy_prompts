answer: |-
  This is one of the most famous and debated passages in the history of philosophy. You are right to be suspicious of the "modest reading" (that Hume is just criticizing bad writing). If it were just about style, he wouldn't claim it would "subvert all the vulgar systems of morality."

  To understand what Hume is doing, we have to look at the context of the *Treatise* as a whole, specifically his theory of human psychology.

  Here is a breakdown of what Hume means by "inconceivable," why it is a logical/metaphysical point rather than just a stylistic one, and why this leads to the "subversion" of traditional morality.

  ### 1. Is it a Logical Point or a Call for Explanation?
  It is **both**, but the logical point is the foundation for the call for explanation.

  When Hume says it is "inconceivable" that an *ought* can be deduced from an *is*, he is pointing out a **category error**.
  *   **"Is" propositions** describe matters of fact or relations of ideas (e.g., "The cat is on the mat," "Murder causes pain," "God exists"). These are cognitive states; they represent the world as it is.
  *   **"Ought" propositions** express direction, obligation, or motivation (e.g., "You ought not to kill"). These are not just descriptions; they are inherently tied to action and volition.

  For Hume, Reason (which deals with *is*) and Passion/Motivation (which deals with *ought*) are two distinct faculties of the mind. In Book II of the *Treatise*, Hume famously argues that **"Reason is, and ought only to be the slave of the passions."** Reason alone cannot produce action. You can know all the facts in the universe (*is*), but without a pre-existing desire or sentiment, those facts cannot tell you what to *do* (*ought*).

  Therefore, when he calls the deduction "inconceivable," he means it is psychologically and logically impossible to derive a motivational state solely from a descriptive state without introducing a sentiment (a feeling of approval or disapproval) as a bridge.

  So, when he says authors need to "give a reason" for this connection, he isn't just asking for better footnotes. He is challenging them to identify the **missing premise**. Since that missing premise cannot be a fact (another *is*), it must be a sentiment. Most moral philosophers of his time (Moral Rationalists) believed morality was discovered by reason alone. Hume is saying, "Show me the logic," knowing they can't do it without admitting sentiment is involved.

  ### 2. Why would this "subvert all the vulgar systems of morality"?
  This is the crux of your confusion. Why is this observation so destructive?

  The "vulgar systems of morality" Hume refers to are primarily **Moral Rationalist** and **Theological** systems (think of philosophers like Samuel Clarke or William Wollaston, or religious ethicists). These systems argued that:
  1.  There is an objective moral order in the universe (or in the nature of God).
  2.  Human Reason can perceive this order (facts about the universe).
  3.  Therefore, we *ought* to align our actions with this order.

  **The Subversion:**
  If Hume is right that you cannot validly move from *is* to *ought* without a bridge, then **Reason alone cannot be the foundation of morality.**
  *   If morality were a matter of fact (like math or physics), we would discover it through observation and logic (*is*).
  *   But if *ought* is a "new relation" distinct from *is*, then morality cannot be a matter of fact found in the external world.
  *   Therefore, the Rationalist claim that morality is objective and discoverable by reason is false.

  This "subverts" those systems because it pulls the rug out from under their foundation. If you can't get *ought* from *is*, then all those books that spent hundreds of pages proving God's existence or analyzing human nature to conclude "therefore be virtuous" have committed a logical fallacy. Their conclusions do not follow from their premises.

  ### 3. What is Hume's Alternative?
  Hume doesn't just destroy these systems; he uses this gap to build his own. This paragraph appears at the very beginning of Book III (On Morals). It is the setup for his positive theory: **Moral Sentimentalism.**

  Since the *ought* cannot come from the external world (*is*), where does it come from? Hume argues it comes from **within us**.
  *   When we call an action "virtuous," we aren't describing a fact about the action itself.
  *   We are reporting a **feeling of approval** that arises in us when we contemplate the action.
  *   The "ought" is a projection of our sentiments onto the world.

  So, the "small attention" subverts the old systems because it forces us to admit that morality is not "out there" in the nature of things, but "in here" in human sentiment.

  ### Summary
  To answer your specific questions:

  1.  **Is he making a logical point?** Yes. He is arguing that descriptive premises cannot logically entail a prescriptive conclusion without a connecting principle (which turns out to be sentiment).
  2.  **Is he just criticizing sloppy authors?** No. He is using their sloppiness to expose a fundamental flaw in Moral Rationalism. They aren't just writing badly; they are thinking incorrectly about the nature of morality.
  3.  **Why does it "subvert" morality?** Because if the *is-ought* gap is real, then morality cannot be based on Reason, God, or the Nature of the Universe. It destroys the claim that morality is objective truth, relocating it to human psychology.

  Hume is essentially saying: *"You philosophers claim morality is a truth you discover. But your logic shows you're actually smuggling in feelings you don't want to admit. Once you admit that, your whole system of 'objective moral truth' collapses, and we have to start over with a theory based on human sentiment."*
