prompt: |-
  I've been reading Hume's Treatise and I'm stuck on this paragraph from Book III, Part I, Section I. Here it is:

  "In every system of morality, which I have hitherto met with, I have always remarked, that the author proceeds for some time in the ordinary way of reasoning, and establishes the being of a God, or makes observations concerning human affairs; when of a sudden I am surprised to find, that instead of the usual copulations of propositions, is, and is not, I meet with no proposition that is not connected with an ought, or an ought not. This change is imperceptible; but is, however, of the last consequence. For as this ought, or ought not, expresses some new relation or affirmation, it's necessary that it should be observed and explained; and at the same time that a reason should be given, for what seems altogether inconceivable, how this new relation can be a deduction from others, which are entirely different from it."

  I get the basic idea — Hume is saying you can't just slide from "is" to "ought" without explaining the jump. But what I don't get is what he means by calling it "inconceivable" that the ought-relation could be a deduction from the is-relations. Is he making a logical point (like, it's literally impossible to validly deduce an ought from an is), or is he making a more modest point about how authors need to explain themselves? And if it's just about authors being sloppy, why does he say this "small attention would subvert all the vulgar systems of morality"? That seems like a way bigger claim. Help me figure out what Hume is actually arguing here.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

