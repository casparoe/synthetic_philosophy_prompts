  **Mark: 54% (High 2:2)**

  **General Feedback**
  This is a competent answer that demonstrates a clear intuitive grasp of the basic game-theoretic ideas underlying Lewis's account. You have successfully identified the core intuition behind coordination problems and the role of common knowledge. However, the mark is limited to the 2:2 range because there are significant conceptual conflations regarding the distinction between conventions and agreements, and between coordination problems and collective action problems. In a second-year module on social philosophy, precise distinctions between these game-theoretic structures are essential. While your exposition is clear, these theoretical errors prevent the answer from reaching the 2:1 threshold.

  **Point-by-Point Comments**

  **(a) The Problem and Arbitrariness**
  *   **Strengths:** You correctly identify the coordination problem as a situation where agents have a common interest in matching actions. Your example of driving is appropriate and clearly illustrates the conditional preference structure (I prefer to drive on the left *if* you do). Your explanation of arbitrariness is also largely correct; you capture the counterfactual nature of Lewis's definition (that another regularity could have served the same purpose).
  *   **Weaknesses:** You suggest that arbitrariness is shown by the fact that "a government could change the rule overnight". This is slightly misleading. For Lewis, a convention is defined by the preferences and expectations of the agents, not by legal mandate. While driving laws are often codified, Lewis is interested in the *conventional* basis that exists even without the law. A government changing a law does not necessarily change the convention instantly if the population's expectations do not shift.
  *   **Impact:** This is a minor slip. You have secured most of the available marks for this section.

  **(b) Salience and Precedent**
  *   **Strengths:** You correctly attribute the concept of salience to Schelling and focal points. Your explanation of how precedent works to reinforce expectations over time is accurate and shows good understanding of the dynamic aspect of Lewis's theory.
  *   **Weaknesses:** You state that "Lewis's paradigm case is explicit agreement — a convention is like a promise made by a whole population at once". This is a significant error. Lewis explicitly argues that conventions do *not* require explicit agreement or promises. His goal in *Convention* is to explain how tacit conventions arise without any prior agreement. While agreements can lead to conventions, treating agreement as the paradigm case misunderstands Lewis's primary philosophical contribution, which is to show how order emerges from anarchy without promises.
  *   **Impact:** This conflation undermines the explanation of salience. Salience is crucial precisely because agents cannot communicate or agree explicitly. This error limits the score for this section.

  **(c) Stability and Example**
  *   **Strengths:** You attempt to address stability directly and provide a concrete example.
  *   **Weaknesses:** There are two major theoretical errors here.
      1.  **Sanctions vs. Equilibrium:** You claim conventions persist because deviations are "punished" (honking, fines, reputation). For Lewis, the stability of a convention rests on it being a Nash equilibrium based on *preferences* and *expectations*, not external sanctions. I drive on the left primarily because I expect you to drive on the left and I wish to avoid a crash, not because I fear a fine. While sanctions may exist, they are not the core of Lewis's explanation for stability.
      2.  **Coordination vs. Collective Action:** You use overfishing as an example of a problem conventions solve. Overfishing is a classic Prisoner's Dilemma (or Commons Dilemma), not a Coordination Problem. In a Coordination Problem, once others cooperate, I want to cooperate. In a Prisoner's Dilemma, even if others cooperate, I am tempted to defect. Lewis's account of convention is specifically designed for Coordination Problems. Claiming it solves collective action problems like overfishing via sanctions conflates Lewis's account with normativist or institutional accounts (e.g., Ostrom or Gibbard).
  *   **Impact:** These are fundamental category errors in social philosophy. Confusing Coordination Problems with Prisoner's Dilemmas suggests a lack of grasp on the specific game-theoretic models underpinning the module. This significantly reduces the mark for this section.

  **Conclusion**
  You have written a clear, well-structured essay that shows you have engaged with the material. However, to reach the 2:1 level, you must be more precise with the technical definitions. Specifically:
  1.  Ensure you distinguish between *tacit* convention and *explicit* agreement.
  2.  Do not conflate Coordination Problems with Prisoner's Dilemmas/Collective Action Problems.
  3.  Remember that Lewis's account relies on endogenous stability (expectations/preferences) rather than exogenous enforcement (sanctions).

  If you address these conceptual distinctions in future essays, your marks will improve significantly.
