prompt: |-
  hey — I run the training for new fact-checkers at a small newsroom, and I've got a 90-minute session next week where I want to put the reductionism versus anti-reductionism argument about testimony in front of them. No philosophy background, and they will show up thinking the question is how much we should trust sources, with the professional instinct that verifying everything yourself is the ideal. I dont need you to explain the debate to me, I know it — I need a plan for getting it into their heads in 90 minutes.

  What I want from you:

  - the order the pieces have to go in and what depends on what. My guess is they need to feel the pull of the local version before the global version will mean anything to them, but tell me if I've got that backwards.
  - one case to carry the whole session. I want a source with no track record — a single anonymous tipster, or a one-off document you cant corroborate — and I want you to say what that case has to have and what it has to lack. Also why not the obvious newspaper case, and why not something where the source does have a track record.
  - the misconceptions, and exactly where in the sequence to kill each one. The ones I expect: that reductionism is just the distrustful view; that anti-reductionism means taking peoples word for anything; that the whole dispute is an empirical question about how reliable people happen to be; and that if reductionism is right then checking every claim is mandatory. Tell me which ones I've missed.
  - where the local/global distinction, the default-justification middle position, and the argument from how anybody actually learns things from other people fit. They're going to want a verdict at the end and I'd like them to see that the verdict matters less for practice than they assume — but I dont want to just announce that, so tell me how to build it into the sequence.
  - one wrinkle I'm stuck on: a lot of what they check now is machine-generated or machine-summarised. Is that a case of testimony at all, and do I handle it in the session or leave it out? Say which and why.
  - what to openly refuse to cover at this level.
  - two cases for the end: one where a reductionist and a presumptivist would do the same thing for different reasons, one where they'd actually diverge in practice. If they can say which is which, they've got it.

  Also two of them will keep reaching for trust-but-verify and the extraordinary claims slogan as ways of closing the discussion down. Where do those belong, if anywhere?
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Trainer of new fact-checkers at a small newsroom.
      *   **Task:** Design a 90-minute session on Reductionism vs. Anti-Reductionism regarding testimony.
      *   **Audience:** No philosophy background. Professional instinct is "verify everything yourself" (hyper-reductionist). They equate the debate with "how much to trust sources."
      *   **Constraints/Requirements:**
          *   Sequence/Order of concepts (Local vs. Global).
          *   One core case study (anonymous tipster/one-off document, no track record). Explain why this case, why not others.
          *   Identify & kill specific misconceptions at specific points.
          *   Integrate Local/Global distinction, Default-Justification (Presumptivism), and the "Learning Argument."
          *   Build the "verdict matters less than assumed" conclusion into the sequence, not just announce it.
          *   Address the "Machine-Generated Content" wrinkle (include or exclude?).
          *   Specify what *not* to cover.
          *   Two final test cases (Convergence vs. Divergence).
          *   Address "Trust but Verify" and "Extraordinary Claims" slogans.

  2.  **Deconstruct the Philosophy (for application):**
      *   *Reductionism (Humean):* Testimony is only justified if reduced to observation/memory/inference. You need positive reasons to trust the source.
      *   *Anti-Reductionism (Reidian/Presumptivist):* Testimony has *prima facie* credibility. It's justified unless there are defeaters.
      *   *Local vs. Global:* Global is about testimony *in general*. Local is about *this specific instance*. Journalists care about Local.
      *   *The "Learning Argument":* If we were global reductionists, we couldn't learn anything as children (circularity). We need some default trust to start.
      *   *The "Verification Ideal":* Journalists think they *must* verify everything. Philosophy says that's impossible (Global Reductionism fails) but Local Reductionism is the daily grind.

  3.  **Drafting the Session Plan - Step-by-Step:**

      *   **Timing:** 90 minutes is tight. Needs to be punchy.
      *   **Sequence:** The user suspects Local before Global. I agree. Journalists deal with specific claims. Global abstraction loses them. Start with the specific instinct, show why it breaks, introduce the philosophical framing to fix the break.
      *   **The Core Case:** Needs to be ambiguous.
          *   *Idea:* A leaked spreadsheet from an anonymous whistleblower about city council bribes.
          *   *Why:* No track record (can't use past reliability). Can't fully verify immediately (needs philosophy to decide how to treat it *now*).
          *   *Why not a newspaper?* Too much institutional baggage.
          *   *Why not a known source?* Defeats the purpose of testing the *principle* of testimony.
      *   **Misconceptions:**
          1.  Reductionism = Distrust. (Kill early: It's about *reasons*, not feelings).
          2.  Anti-Reductionism = Gullibility. (Kill mid: It's *defeasible* trust).
          3.  Empirical Question. (Kill mid: It's epistemic, not statistical).
          4.  Checking is Mandatory. (Kill late: It's about *justification*, not just action).
      *   **Machine Content:** Exclude. It confuses the definition of "testimony" (intent to convey truth). Save for advanced training.
      *   **Slogans:** "Trust but Verify" is a workflow, not an epistemology. "Extraordinary Claims" is a defeater condition (fits Anti-Reductionism).
      *   **Final Cases:** Need one where both verify (convergence) and one where one verifies and the other publishes (divergence).

  4.  **Refining the Flow (Iterative Process):**

      *   *Intro (10 mins):* Hook them with the Core Case. Get their instinct out.
      *   *Module 1 (20 mins):* The Reductionist Instinct. Define Reductionism through their existing workflow. Kill Misconception 1 (Distrust).
      *   *Module 2 (20 mins):* The Problem with Pure Reductionism. The "Learning Argument." Why Global Reductionism fails. Kill Misconception 3 (Empirical).
      *   *Module 3 (20 mins):* The Anti-Reductionist Alternative. Presumptivism. It's not gullibility. Kill Misconception 2 (Gullibility). Integrate "Extraordinary Claims" here as a defeater.
      *   *Module 4 (15 mins):* Local vs. Global & The Verdict. Why the philosophical winner doesn't change the checklist much, but changes the *burden of proof*. Kill Misconception 4 (Mandatory Checking).
      *   *Conclusion (5 mins):* The Two Final Cases.

  5.  **Addressing Specific Constraints:**

      *   *Order:* Local first, then Global. Why? Because journalists operate locally. If you start with "Can we trust humans?", they tune out. If you start with "Can we trust *this* email?", they engage. Then zoom out to show why their instinct to verify *everything* is philosophically impossible.
      *   *Core Case:* "The Anonymous Spreadsheet."
          *   *Has:* Internal consistency, specific details, plausible motive (whistleblowing).
          *   *Lacks:* Corroboration, source identity, paper trail.
      *   *Machine Content:* Leave it out. It muddies the water on "testimony" (which implies a speaker). Treat it as "data" for now.
      *   *Slogans:* "Trust but Verify" is a heuristic for *managing risk*, not solving the epistemic problem. "Extraordinary Claims" is the threshold for *defeaters* in the Anti-Reductionist view.
      *   *What to Refuse:* Deep dives on Hume/Reid, skepticism about perception, social epistemology networks.

  6.  **Developing the Final Two Cases:**
      *   *Convergence:* A claim about a public record (e.g., "The Mayor voted No"). Both check it. Reductionist: Need positive reason. Presumptivist: Easy to check, so check it.
      *   *Divergence:* A claim about private intent that is hard to check (e.g., "The Mayor said in private he plans to resign"). Reductionist: Don't publish (no positive evidence). Presumptivist: Publish with attribution (no defeaters, source seemed sincere). *Wait, journalists rarely publish uncorroborated anonymous claims about resignation.*
      *   *Better Divergence:* Emergency breaking news. "Bridge is collapsing." Anonymous caller. Reductionist: Wait for visual confirmation (positive reasons). Presumptivist: Warn public immediately (default trust unless reason to doubt). *This highlights the stakes.*

  7.  **Review against User Tone:**
      *   User is direct, knowledgeable, practical.
      *   Response should be structured, actionable, no fluff.
      *   Avoid explaining the debate (they know it). Focus on *pedagogy*.

  8.  **Final Polish:** Check the timing. 90 minutes is strict. Ensure the "Verdict" point lands naturally. The key insight is that *workflow* looks similar, but *burden of proof* shifts.

      *(Self-Correction during drafting)*: I need to make sure I don't let them think Anti-Reductionism means "publish without checking." It means "justified in believing until checked." The action might still be checking, but the *reason* is different. I need to make sure the "Verdict" section clarifies that professional norms often override pure epistemology.

      *(Refining the Machine Wrinkle)*: The user asked "Is that testimony?" I should answer that directly. It's not testimony in the philosophical sense (no intent). Advise to exclude to keep the session clean.

      *(Refining the Slogans)*: "Trust but verify" is actually a pragmatic bridge. It acknowledges the need for input (Anti-Reductionist) but demands validation (Reductionist). It's a workflow compromise.

  9.  **Final Output Structure:**
      *   Session Architecture (Time & Flow).
      *   The Core Case (Specs & Rationale).
      *   Misconception Kill-List (Where & How).
      *   The "Verdict" Build-Up.
      *   The Machine Wrinkle.
      *   Scope Exclusions.
      *   Final Test Cases.
      *   Handling the Slogans.

      *Let's write it.*
answer: |-
  Here is a 90-minute session plan designed to move your fact-checkers from "verify everything" instinct to a nuanced epistemic framework, without getting bogged down in metaphysics.

  ### 1. Session Architecture: The Order of Operations
  You are correct: **Local before Global.**
  If you start with the Global question ("Is testimony generally reliable?"), they will treat it as a sociological survey. If you start with the Local question ("Am I justified in believing *this* email?"), you hit their professional nerve.

  **00–10: The Hook (The Core Case)**
  Present the case. Ask: "Are you justified in believing this enough to put it in a draft *before* you call the city clerk?"
  *   *Goal:* Expose their instinct. Most will say "No, verify first." This is their Reductionist baseline.

  **10–30: Module A — The Reductionist Trap (Local)**
  Define Reductionism not as "distrust" but as "the requirement for positive reasons."
  *   Show that their instinct ("verify everything") is a Local Reductionist stance.
  *   **Kill Misconception 1:** *Reductionism is just the distrustful view.* (Clarify: It's about the *structure of justification*, not the emotional state of suspicion.)
  *   **Kill Misconception 4:** *If reductionism is right, checking every claim is mandatory.* (Clarify: You can have positive reasons without independent verification—e.g., internal consistency, corroboration by context.)

  **30–50: Module B — The Global Wall (Why Pure Reductionism Fails)**
  Zoom out. Ask: "How did you learn the words you're using to ask that question?"
  *   Introduce the **Learning Argument**: As children, we lacked the observational tools to verify testimony. If Global Reductionism were true, we could never learn language or basic facts.
  *   **Kill Misconception 3:** *The whole dispute is an empirical question about how reliable people happen to be.* (Clarify: It's about the *conditions of knowledge*, not statistics on lying.)
  *   *Takeaway:* We *must* be Anti-Reductionists globally to function, even if we act like Reductionists locally.

  **50–70: Module C — The Anti-Reductionist Alternative (Presumptivism)**
  Introduce Default Justification. Testimony is innocent until proven guilty.
  *   **Kill Misconception 2:** *Anti-reductionism means taking people's word for anything.* (Clarify: It is *defeasible*. Defeaters exist: contradiction, bias, implausibility.)
  *   *Integrate "Extraordinary Claims":* Place this slogan here. It is not a rule of thumb; it is a description of a **defeater condition**. High implausibility defeats the default justification.

  **70–85: Module D — The Convergence (Local vs. Global)**
  Bring it back to the newsroom.
  *   Explain that professionally, we *act* Reductionist (verify) even if we are *justified* Anti-Reductionist (trust).
  *   *Build the Verdict:* The philosophical verdict matters less than they assume because **professional norms add a layer of prudence on top of epistemology.** You might be *justified* in believing the source (epistemology), but not *justified* in publishing without a second source (ethics/risk).
  *   **Kill Misconception 4 (Final Nail):** Checking is often mandatory for *publication*, not for *belief*.

  **85–90: The Test (Two Cases)**
  Run the convergence/divergence cases (detailed below).

  ---

  ### 2. The Core Case: "The Anonymous Spreadsheet"
  **The Scenario:** An encrypted email arrives from a generic address. It contains a spreadsheet detailing off-the-book payments by a local contractor to city officials. The data is internally consistent, dates align with public meeting minutes, but there is no name, no audio, and no other outlet has it.

  **What it MUST have:**
  *   **Plausibility:** The numbers must look real (not cartoonishly evil).
  *   **Specificity:** Names, dates, amounts. (Vague claims invite skepticism regardless of epistemology).
  *   **No Obvious Defeaters:** No obvious typos, no claims contradicted by public record immediately visible.

  **What it MUST lack:**
  *   **Track Record:** You cannot know if this sender has lied before.
  *   **Corroboration:** No other documents or sources confirm it *yet*.
  *   **Identity:** Absolute anonymity.

  **Why this case?**
  *   **Why not a newspaper?** Citing another news outlet introduces "authority" which muddies the water. You want them to wrestle with the raw testimony.
  *   **Why not a known source?** If the source is a trusted beat contact, the "positive reasons" (past reliability) satisfy the Reductionist too easily. You need a vacuum where the only justification is the testimony itself.
  *   **Why anonymous?** It forces the question: Does the *act of telling* carry weight, or does the *identity of the teller* carry the weight?

  ---

  ### 3. The Misconception Kill-List
  *   **Misconception:** *Reductionism is just the distrustful view.*
      *   **Where:** Module A (15 mins).
      *   **Kill:** Show that a Reductionist can trust quickly if they have positive reasons (e.g., "The document matches the letterhead we saw yesterday"). It's about *evidence*, not *attitude*.
  *   **Misconception:** *Anti-reductionism means taking people's word for anything.*
      *   **Where:** Module C (55 mins).
      *   **Kill:** Emphasize **Defeaters**. Anti-reductionism is "Trust UNLESS." Give examples of immediate defeaters (source stands to gain financially, claim contradicts physics).
  *   **Misconception:** *The whole dispute is an empirical question about how reliable people happen to be.*
      *   **Where:** Module B (35 mins).
      *   **Kill:** The Learning Argument. Even if people lie 50% of the time, the Anti-Reductionist says we are still justified in listening *first*. It's not a math problem; it's a starting gate.
  *   **Misconception:** *If reductionism is right then checking every claim is mandatory.*
      *   **Where:** Module D (75 mins).
      *   **Kill:** Distinguish **Epistemic Justification** (can I believe this?) from **Professional Justification** (can I print this?). You can believe it (Anti-Reductionist) but still check it (Professional Norm).

  **Missing Misconception to Add:**
  *   *That "Verification" solves the epistemic problem.*
      *   **Where:** Module D.
      *   **Kill:** Point out that verifying Source A often relies on Testimony from Source B. You are kicking the can down the road, not solving the reductionist regress.

  ---

  ### 4. Handling the "Verdict" (Building it, not Announcing it)
  Do not stand up and say "It doesn't matter who wins." Instead, use the **Burden of Proof Shift**.

  1.  In Module A, establish that for the Reductionist, the **burden is on the believer** to find reasons to trust.
  2.  In Module C, establish that for the Anti-Reductionist, the **burden is on the skeptic** to find reasons to doubt.
  3.  In Module D, show that in a newsroom, **the risk of error shifts the burden back.**
      *   *Sequence:* Ask them, "If you believe the spreadsheet but don't check, and it's fake, who gets fired?"
      *   *Result:* They realize that even if Anti-Reductionism is philosophically correct (we are justified in believing), the *consequences* of being wrong force a Reductionist workflow.
      *   *Conclusion:* The philosophy tells you where the default setting is; the job tells you when you're allowed to leave it on.

  ---

  ### 5. The Machine-Generated Wrinkle
  **Decision:** **Leave it out.**

  **Why:**
  1.  **Definition of Testimony:** Philosophical testimony requires a *speaker* with an *intent to convey truth* and *accountability*. LLMs have neither. They are probability engines, not agents.
  2.  **Cognitive Load:** Introducing "Is an algorithm a witness?" will derail the 90 minutes into a tech ethics debate.
  3.  **Treatment:** Treat machine output as "Data" or "Physical Evidence" (like a photo), not Testimony. You verify the *process* that made it, you don't assess the *credibility* of the bot.
  4.  **Instruction:** Tell them: "For this session, testimony comes from humans. Machines are tools that process testimony. We will cover the epistemology of AI in the advanced module."

  ---

  ### 6. Scope: What to Openly Refuse
  To keep time, explicitly state at the start:
  1.  **We are not solving Skepticism:** We aren't asking if *anything* is knowable. We are asking how testimony functions within a world where we assume knowledge is possible.
  2.  **We are not discussing Legal Standards:** "Beyond reasonable doubt" or "Preponderance of evidence" are legal thresholds, not epistemic ones.
  3.  **We are not mapping Social Networks:** We aren't discussing how rumors spread (sociology), but how an individual justifies belief (epistemology).

  ---

  ### 7. The Two Final Cases (The Test)
  Put these on a slide. Ask them to identify which scenario shows **Convergence** (same action, different reason) and which shows **Divergence** (different action).

  **Case 1: The Public Record (Convergence)**
  *   *Claim:* A source says, "The Mayor voted 'No' on Tuesday."
  *   *Reductionist Action:* Check the voting minutes. (Need positive reason).
  *   *Presumptivist Action:* Check the voting minutes. (Easy to check, no cost to verify, prevents potential defeaters).
  *   *Result:* Both check. **Convergence.**
  *   *Why they got it:* They see that workflow often looks the same even if the underlying justification differs.

  **Case 2: The Imminent Threat (Divergence)**
  *   *Claim:* An anonymous caller says, "The bridge will collapse in 1 hour." No other data available.
  *   *Reductionist Action:* **Wait.** Do not publish/alert until visual confirmation or second source is found. (No positive reasons to trust yet).
  *   *Presumptivist Action:* **Alert.** Pass the warning to authorities/public immediately. (Default justification stands unless there is a specific defeater; the cost of being wrong is lower than the cost of ignoring truth).
  *   *Result:* Different actions. **Divergence.**
  *   *Why they got it:* They see that Anti-Reductionism isn't just theory; it changes behavior in high-stakes/low-verification environments.

  ---

  ### 8. Handling the Slogans
  Two of your trainees will weaponize these. Here is where you place them:

  **"Trust but Verify"**
  *   **Where:** Module D (The Convergence).
  *   **Handling:** Acknowledge this is the **Professional Compromise**. It acknowledges the Anti-Reductionist need to ingest information ("Trust") to function, but applies the Reductionist standard ("Verify") before publication to manage risk. It is a workflow heuristic, not an epistemic solution.

  **"Extraordinary Claims Require Extraordinary Evidence"**
  *   **Where:** Module C (Defeaters).
  *   **Handling:** Validate this slogan, but rephrase it philosophically. It means: "The more a claim conflicts with our existing background knowledge, the stronger the **defeater** against default justification." It doesn't mean you ignore the claim; it means the *presumption of truth* is weaker, requiring more positive reasons to override the defeater. This satisfies the Reductionist instinct without rejecting the Anti-Reductionist framework.
