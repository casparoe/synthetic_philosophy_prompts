answer: |-
  It is a genuine pleasure to correspond with someone who brings thirty-five years of experimental discipline to the reading of Hobbes. That background gives you a distinct advantage: you know the difference between a model and the messiness of data, which is precisely the tension Hobbes is wrestling with in *De Corpore* and *Leviathan*.

  To answer your primary question immediately: **Yes, your reading is entirely fair.** In fact, it is the crucial hinge upon which his entire system turns. You have correctly identified that Hobbes is performing a demotion of axioms from "metaphysical self-evident truths" to "consequences of stipulated definitions."

  Here is an unpeeling of that move, why he makes it, and how robust his "computation" actually is.

  ### 1. The Status of Common Notions: Truth of Speech, Not Things
  You noted that Hobbes treats axioms like "the whole is greater than the part" as definitional tautologies rather than discoveries about the world. This stems from his **nominalism**.

  For Hobbes, there are no universals in nature. There is no "Triangularity" floating in the ether. There are only individual triangles and the name we apply to them. Consequently, truth does not reside in things; it resides in **propositions**. As he writes in *Leviathan*, "True and False are attributes of speech, not of things."

  Therefore, a "common notion" cannot be a self-evident truth about reality apprehended by the mind's eye (the Platonic or Cartesian view). It must be a truth about the consistency of our own naming.
  *   **The Move:** Hobbes argues that if you truly understand the definition of "whole" and the definition of "part," the proposition "the whole is greater than the part" adds no new information. It merely unpacks what was already contained in the definitions.
  *   **The Implication:** This makes geometry **analytic** (to use Kant's later term). The certainty of geometry does not come from measuring physical lines (which, as a physicist, you know are always imperfect), but from the fact that we stipulated the rules of the game.

  ### 2. The Point of the Move: Control and Causality
  You asked whether this demotes axioms or makes geometry reliable. For Hobbes, it is precisely what makes geometry the **only genuine science**.

  In your career, you measured things. You dealt with *a posteriori* knowledge (knowledge from effects back to causes). If you measure a fall time and calculate $g$, you are inferring a cause from an effect. Hobbes thinks this yields only "prudence" or conjecture, not science, because sense experience can be deceived.

  Geometry, for Hobbes, is *a priori* (from causes to effects).
  *   **Construction:** We define a line not by pointing at a mark on paper, but by stipulating "a length generated by the motion of a point." We define a circle by the motion of a line.
  *   **Certainty:** Because we lay down the definitions and the generation rules, we know the cause perfectly. Therefore, we can be certain of the consequences.
  *   **The Payoff:** By reducing axioms to consequences of definitions, Hobbes removes the need for any external validation. The system is closed. We are certain of geometric truths for the same reason we are certain of the rules of chess: because we invented them.

  This is not a demotion in his eyes; it is an elevation of human reason. It means human beings are capable of creating a realm of absolute certainty, whereas in natural philosophy (physics), we are stuck guessing at God's machinery.

  ### 3. "Reasoning is Reckoning": How Mechanical is it?
  This is where your physicist's skepticism is well-placed. When Hobbes says reasoning is "nothing but reckoning," is he describing an algorithm that can grind out the Pythagorean theorem from a definition of a line?

  **Yes and No.**

  *   **The "Yes":** Hobbes wants logic to be as dispute-free as arithmetic. If two geometers disagree, he believes they should be able to say, "Let us sit down and count." He views the syllogism as a kind of addition and subtraction of names. If $A = B$ and $B = C$, then $A = C$ is a computation of equality.
  *   **The "No":** Hobbes does not have a concept of formal syntax independent of semantics. For Hobbes, you cannot manipulate the symbols unless you retain a conception of what they signify (the "phantasm" of the generated figure).
      *   In *De Corpore*, he emphasizes that geometric reasoning tracks the **generation** of figures. To prove something about a circle, you must keep in mind the *motion* that created it.
      *   So, it is not blind symbol manipulation (like a modern computer algebra system); it is **conceptual tracking**. The "computation" is the logical unpacking of the causal generation stipulated in the definition.

  **Does it survive contact with actual mathematics?**
  Historically, somewhat poorly. Hobbes was famously obsessed with proving he had "squared the circle." He spent decades publishing flawed proofs, arguing with Wallis and Boyle, and refusing to admit error.
  *   **The Irony:** The retired physicist in you will appreciate this: Hobbes loved the *method* of geometry but was terrible at the *practice*. He believed that if he just adhered strictly to his definitions and "reckoning," the truth would fall out. But he lacked the rigorous formal constraints that later mathematicians (like Hilbert) would realize are necessary to prevent intuition from smuggling errors into the "computation."
  *   **The Limit:** Hobbes overestimated the power of definition. You cannot define a square circle into existence. Modern logic shows that consistency is not guaranteed merely by stipulating definitions (see: Russell's Paradox, Gödel). Hobbes assumes that if the definitions are clear, the system will be consistent. That is a bold, perhaps naive, leap.

  ### 4. Why This Matters for the Political Project (A Preview)
  You mentioned wanting to hold off on the politics, but you correctly sensed the bearing. I will keep this brief, but it explains *why* he strains so hard to make geometry a matter of linguistic convention.

  If geometry is certain because **we define the terms**, then Civil Philosophy (Politics) can be certain **if we define the terms**.
  *   In nature, "good" and "bad" are subjective (based on appetite).
  *   In a Commonwealth, the Sovereign acts as the geometer. The Sovereign **defines** "Justice," "Property," and "Law."
  *   Once those definitions are stipulated (as Civil Laws), moral reasoning becomes a form of "reckoning" against those definitions.

  Just as you cannot argue with the definition of a triangle in geometry, you cannot argue with the definition of Justice in the Commonwealth. The certainty of *Leviathan* rests on the epistemological groundwork laid in Chapters 4 and 5. He is trying to turn ethics into a geometry of power.

  ### Summary for the Physicist
  To synthesize this with your background:
  1.  **Model vs. Measurement:** Hobbes rejects "measurement" (empiricism) as a basis for science because the instruments (senses) are faulty. He prefers "modeling" (geometry) where the modeler defines the parameters.
  2.  **Axioms as Boundary Conditions:** Think of Hobbesian axioms not as physical laws, but as boundary conditions or gauge choices. They are true because we set the coordinate system that makes them true.
  3.  **The Computation:** It is a logical deduction engine, but one that relies on the user maintaining a causal intuition of the "generation" of the objects, not just syntactic manipulation.

  Your intuition that this is a "weaker, almost linguistic sense" of truth is correct. Hobbes bites that bullet. He would say: "Yes, it is linguistic, and that is why it is certain. If you want truth about the world, you get uncertainty. If you want certainty, you must stay within the world of names and consequences that we have constructed."

  It is a stunningly modern, almost constructivist view of mathematics, marred only by his own inability to do the math correctly. Enjoy the rest of *Leviathan*; the transition from this epistemology to the "State of Nature" is where he cashes this check.
