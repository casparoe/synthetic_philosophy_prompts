      *   *Definitions:* For Hobbes, definitions are not discoveries of essence (Aristotelian) but *stipulations* of what we mean by a word. We construct the object in thought.
      *   *Axioms/Common Notions:* The user is spot on. Hobbes rejects the idea that axioms are innate ideas or self-evident truths about the external world independent of language. They are consequences of definitions. "The whole is greater than the part" is true because of how we define "whole" and "part."
      *   *Reasoning as Computation:* This is the famous "reckoning" passage. Addition/Subtraction of consequences.
      *   *Certainty:* Why is geometry certain? Because we create the definitions. We don't measure physical circles (which are always imperfect); we reason about the *concept* of a circle which we defined.

  3.  **Address the Specific Questions:**

      *   **Q1: Is the reading of axioms as linguistic/definitional fair?**
          *   *Yes.* Hobbes is a nominalist. Truth is a property of propositions (speech), not things. An axiom is true because the predicate is contained in the subject by definition.
          *   *Nuance:* It's not *just* arbitrary convention; it's about consistency in the system we constructed.

      *   **Q2: What's the point? Demotion or Reliability?**
          *   *Reliability/Control.* This is crucial. If axioms were facts about the world, they could be wrong (empirical error). If they are consequences of our own definitions, we guarantee their truth. This aligns with his view that *a priori* knowledge (knowing the cause because we made it) is superior to *a posteriori* knowledge.
