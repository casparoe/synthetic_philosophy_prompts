answer: |-
  'The trouble with your closest-continuer view,' Elias said, stirring his tea with a precision that suggested he was mixing reagents rather than Earl Grey, 'is that it treats origin as merely evidential. On the Kripkean line, originating from *this* sperm and *this* egg is not just how we identify you; it is what constitutes you.'

  Clara leaned back in the common room armchair, legs crossed. 'But consider my first case. Same sperm, same egg, but a single base pair is corrected in the zygote at the one-cell stage. The material source is identical, but the genetic instruction set varies slightly. Do you really have to say that baby is a different person?'

  Elias paused. 'If the gametes are numerically identical, the origin is the same. So, yes, it is you.'

  'But the genome differs,' Clara pressed. 'So the specific DNA sequence isn't essential?'

  'It appears not,' Elias admitted, a flicker of irritation crossing his face. 'I must concede that identity tolerates minor genetic drift. But this costs me, Clara. If essence admits of degree—where a single base pair is permissible but a chromosomal deletion is not—then "origin" becomes vague. And vagueness is the enemy of necessity.'

  'Precisely,' Clara said. 'Now take the reverse. Different sperm, different egg, yet by some cosmic fluke they yield a nuclear genome identical to yours. On my view, if that zygote develops into a being with your psychology and life, it is you. On yours, it's a stranger.'

  'A stranger,' Elias confirmed. 'Matter matters. You cannot be built from different bricks and remain the same house.'

  'But why does origin feel so load-bearing?' Clara asked, shifting to her strongest ground. 'When we say, "If my parents had picked a different donor, I wouldn't exist," we feel annihilated, not merely replaced. My theory struggles to explain that visceral fear. If identity is just continuity, a perfect duplicate should soothe us. It doesn't.'

  'Because the intuition is correct,' Elias said.

  'Is it?' Clara countered. 'Consider the monozygotic split. The zygote from your actual gametes divides at the two-cell stage. It is the *other* cell that gets implanted and lives your actual life. The origin—the zygote—is the same. But the physical continuity diverges at cell two. Which one is you?'

  'Both share the essential origin,' Elias said. 'But only one can occupy your actual life trajectory.'

  'And if both survive?' Clara asked. 'Your theory implies both are essentially you, yet they are two people. My theory says the one who continues your psychological history is you. It handles the fission without multiplying selves.'

  'At the cost of making identity contingent on future facts,' Elias retorted. 'But you haven't answered your own challenge. Why does the donor case feel like death?'

  Clara sighed, looking into her cup. 'I suppose I must concede that origin acts as a primitive modal anchor. I cannot fully reduce the "different donor" intuition to continuity alone; there is a residual sense that the *source* constrains the possibility space in a way my theory cannot explain away. It costs me my reductive naturalism.'

  'And I have conceded vagueness,' Elias said.

  'Indeed,' Clara smiled. 'But vagueness is merely imprecision; surrendering reduction is surrendering the explanation.'

  Verdict: The essentialist maintained metaphysical consistency at the price of precision, but the continuier's admission that origin possesses irreducible modal force conceded the central dispute.
