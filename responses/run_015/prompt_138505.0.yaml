answer: |-
  Colleagues, I am writing this because we vote in nine days and I want to be clear about where I stand before we gather. We have been tasked with deciding the fate of the customs shed, but I believe we are actually being asked to decide what kind of community we intend to be now. After weighing the submissions, the testimony, and the structural reports, I recommend we accept the regional housing trust proposal to demolish the shed within eighteen months and construct the twenty-two affordable units, provided we formally condition this approval on the immediate execution of the university group's digital scanning project and the creation of the marked memorial garden at the quay's edge. We should authorize the scan to begin next month to capture the structure before any work commences, ensure the virtual reconstruction is hosted on a public server maintained by the town, and schedule the garden's dedication for the autumn equinox of next year. This path combines the housing need with a living archive that records decay, while respecting the physical end of the building.

  I want to state the case for the option I am rejecting as strongly as I can, because those who advocate for it are motivated by a profound moral instinct. The argument for stabilizing the shed and opening it as a memorial room is that physical presence demands witness in a way that images cannot. A rotting building forces a confrontation; it is an uncomfortable truth that cannot be switched off like a headset or walked past like a garden plaque. The state heritage grant binds us to twenty-five years of public accessibility, which guarantees that the town cannot quietly look away from what happened here. To keep the shed is to accept a burden of discomfort, and there is a valid argument that memory requires exactly that kind of burden to remain honest. If we demolish, we risk making the past too easy to consume, turning a site of suffering into a smooth narrative that fits comfortably within a new development.

  However, I cannot support preservation because I do not believe we are entitled to settle the debt owed to the dead on their behalf. The sole survivor has asked for the ground to be paved and nothing named after her. While the national memorial organisation argues that a duty to remember cannot be waived by one victim, I believe we overstep our authority if we insist on a form of remembrance that the only living witness explicitly rejects. We are deciding the future of this town, not the eternal resting place of those who died. We can honour them without preserving the instrument of their suffering. The digital scan offers a compromise that the physical building cannot: it will record the decay year by year, carrying the accumulated damage forward even after the wood is gone. This allows the memory to age and darken as it should, without requiring the town to maintain an unsafe structure or ignoring the urgent need for housing that benefits our current residents, many of whom are estranged from this history precisely because of the silence that has surrounded it.

  We must be plain about what this commission is deciding. We are deciding how to use municipal land and funds in a way that serves the living community while acknowledging the past. We are not entitled to decide what the dead would have wanted beyond the evidence we have, nor can we assume that keeping a building standing is inherently more respectful than letting it go. Forgetting is what places do, and sometimes it is merciful. By choosing demolition with the digital archive and the garden, we acknowledge the horror without making it a permanent monument that divides the descendants or halts the town's growth. We accept the housing units not as a convenience, but as a commitment to the living families who need homes now, just as the families in the shed needed safety then. I know this choice is convenient for the budget and politically smoother than fighting for a heritage grant that lapses at the end of June, but I believe it is also the most ethically defensible path given the survivor's wishes and the inevitability of the building's collapse. I ask you to join me in this recommendation so we can present a unified decision to the council.

  The single further fact that would most quickly move me to a different recommendation is if the university group confirmed they could not guarantee the long-term maintenance and public accessibility of the digital archive beyond five years, as a transient virtual memorial would be worse than none. My reasoning is most likely to fail on the assumption that a virtual decay simulation carries the same moral weight as physical risk and presence, since a headset can be removed while a building stands regardless of will. I honestly suspect I have dressed up a budgetary and political conclusion in moral language, because the housing solution costs the town almost nothing and resolves a pressing need, making the ethical arguments about the survivor's wish and the mercy of forgetting convenient cover for a financially expedient choice.
