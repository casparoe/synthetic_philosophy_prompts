answer: |-
  **Preamble: Discarded Candidates**
  Three standard requirements are discarded. First, *Strict Stationarity*: demanding constant discount rates penalizes benign preference evolution (failing the Anticipatory Pump). Second, *Absolute Cycle Immunity*: demanding no trade cycles ever ignores physical limits and learning (failing Vanishing-step and Instructive Pumps). Third, *Preference-Only Evaluation*: judging only mental states ignores that choices and plans come apart, rendering advice impossible (failing the Advisory Job).

  **Purpose and Jobs**
  The theory must serve two jobs. Job One (Critical) explains ordinary judgments of diachronic irrationality. Job Two (Advisory) guides commitment device design. I argue a Third Job (Constitutive) matters most: rationality constitutes the agent as a single entity over time. Without it, Critical and Advisory judgments lack a subject. However, the specification below targets the first two, as they are the operational tests.

  **The Feasibility Filter: Analyzing the Pumps**
  Vulnerability to a money pump counts against an agent only if the pump is *feasibly exploitative*. We derive this filter from six cases.
  1.  *Subsidized Pump:* Not a defect. The exploiter loses wealth; no incentive exists to run the pump.
  2.  *Fragmented Pump:* Not a defect. Counterparty coordination failure protects the agent; exploitation is not robust.
  3.  *Vanishing-step Pump:* Not a defect. Infinite steps in finite time are physically impossible; the pump cannot run.
  4.  *Instructive Pump:* Defect is transient. Vulnerability counts only if persistent after learning; rational agents update.
  5.  *Solitary Pump:* Defect. No external manipulator exists; the agent defeats her own earlier aims purely through internal inconsistency.
  6.  *Anticipatory Pump:* Not a defect. Preference change is benign growth, not manipulation; penalizing this punishes maturity.

  **Requirement 1: Incentive-Compatible Exploitability**
  *Motivation:* Subsidized and Fragmented Pumps. A pump only reveals irrationality if a trader could profitably execute it without relying on improbable coordination or subsidies.
  *Status:* **Non-negotiable.** Without this, the theory condemns agents for vulnerabilities no one could actually use against them.

  **Requirement 2: Physical Executability**
  *Motivation:* Vanishing-step Pump. The sequence of choices must be physically possible within finite time and resources.
  *Status:* **Non-negotiable.** Rationality cannot demand the impossible or forbid the physically necessary.

  **Requirement 3: Learning Stability**
  *Motivation:* Instructive Pump. A defect must persist after the agent observes the loss and updates beliefs/preferences.
  *Status:* **Non-negotiable.** A theory that labels a learning agent irrational fails the Critical Job.

  **Requirement 4: Joint-Followability**
  *Motivation:* Advisory Job. Recommendations issued at $t_1$ and $t_2$ must be composable into a single executable plan by one agent.
  *Status:* **Non-negotiable.** Advice that cannot be jointly carried out is useless for design and commitment.

  **Requirement 5: Endogenous Accommodation**
  *Motivation:* Preference Constitution. The theory must handle cases where choosing X makes the agent want X (e.g., addiction or cultivation of taste).
  *Status:* **Negotiable.** While important, some theories bypass this by fixing preferences exogenously.

  **Requirement 6: Benign Change Immunity**
  *Motivation:* Anticipatory Pump. The theory must distinguish manipulative preference change from authentic growth.
  *Status:* **Prejudice of Autonomy Camp.** Some welfarist views reject this, counting any preference change as a loss of utility.

  **Incompatibility and Resolution**
  I suspect **Joint-Followability** and **Endogenous Accommodation** cannot be jointly satisfied in cases of radical endogenous change. If choosing X fundamentally alters what the agent values at $t_2$, a plan made at $t_1$ to choose X may become un-followable at $t_2$ without external commitment. If we insist on Followability, we must restrict Accommodation (forcing the agent to resist change). If we insist on Accommodation, we must allow plans to be abandoned (violating Followability).
  *Resolution:* I drop **Endogenous Accommodation** as a strict requirement. The resulting theory, *Guided Resoluteness*, prioritizes Joint-Followability. It treats radical endogenous change as a breakdown of agency requiring external commitment devices rather than internal rational adjustment. The agent is rational only insofar as she can bind her future self to the current plan.

  **Most Exclusionary Requirement**
  **Joint-Followability** excludes the most candidate theories. Standard *Sophisticated Choice* models predict that agents will abandon prior plans when preferences shift, explicitly violating joint-followability to avoid future regret. *Myopic* models ignore future plans entirely. Only *Resolute* or *Plan-Based* views satisfy this. This is defensible because the Advisory Job requires actionable strategies; a theory that predicts plan abandonment cannot guide commitment design.

  **Theory Scoring Table**

  | Theory | Incentive-Compatible | Physical Exec. | Learning Stability | Joint-Followability |
  | :--- | :---: | :---: | :---: | :---: |
  | **Myopic (Momentary)** | Pass | Pass | Pass | **Fail** |
  | **Sophisticated (Game-Theoretic)** | Pass | Pass | Pass | **Fail** |
  | **Resolute (Plan-Based)** | Pass | Pass | Pass | **Pass** |
  | **Global Outcome (Life-Welfare)** | Pass | Pass | **Fail** | Pass |
  | **Reasons-Responsive** | **Fail** | Pass | Pass | Pass |
  | **Fixed-Preference Discounting** | Pass | Pass | **Fail** | Pass |

  *Notes:* Myopic/Sophisticated fail Followability (plans abandoned). Global Outcome fails Learning (fixed welfare metric). Reasons-Responsive fails Incentive (hard to pump). Fixed-Preference fails Learning (ignores benign change).

  **Epistemic Note**
  *   *Incentive-Compatible Exploitability:* **Confident.** Exploitation must be possible to be a defect.
  *   *Physical Executability:* **Confident.** Logic cannot override physics.
  *   *Learning Stability:* **Confident.** Rationality implies responsiveness to evidence.
  *   *Joint-Followability:* **Merely Inclined.** Depends on prioritizing Advice over Description.
  *   *Endogenous Accommodation:* **Guessing.** The metaphysics of preference constitution is unsettled.
  *   *Least Confident Claim:* That **Joint-Followability** should trump Endogenous Accommodation. I would change my mind if convinced that agency is essentially fluid and that binding plans constitute a form of irrational rigidity rather than rational stability. If future selves are distinct agents, Followability is a category error.
