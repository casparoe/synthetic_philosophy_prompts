      *   Political Ontology (Who defines the group?).
      *   Institutional Revisions (Grants, Journals, Museums).
      *   Conclusion.

  *(Self-Correction Note on Rapa Nui)*: Recent scholarship (e.g., Hunt & Lipo) challenges the "ecocide/collapse" narrative on Rapa Nui, arguing for resilience until European contact. I should mention this as it strengthens the user's point about the *labeling* being the issue, not just the facts.

  *(Self-Correction Note on Maya)*: The "collapse" term is actually falling out of favor in Maya studies too, but the user notes it's *discouraged* there while still *used* elsewhere. I need to address why the *prohibition* exists in one and not the other.

  *(Refining the Ontology)*: Use the distinction between *State* ontology and *Ethnos* ontology.

