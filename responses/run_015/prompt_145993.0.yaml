answer: |-
  This is an exceptionally sharp observation that cuts to the core of contemporary debates in archaeological theory, specifically regarding the metaphysics of social groups and the ethics of heritage discourse. The asymmetry you identify is not merely terminological inconsistency; it reveals conflicting **persistence conditions** for social entities and a hidden **normative teleology** regarding political complexity.

  To address your query within the framework of social ontology and philosophy of archaeology, we must dissect the criteria used to individuate societies over time, the valuation embedded in "failure," and the institutional mechanisms that sustain these distinctions.

  ### 1. Ontological Commitments: Persistence Conditions of Social Groups

  The differential labeling presupposes divergent answers to the question: *Under what conditions does Society A at time $t_1$ remain Society A at time $t_2$?*

  **The Institutional Essentialism of "Collapse"**
  In the Late Bronze Age and traditional Rapa Nui narratives, the labeling of "collapse" relies on an **institutional essentialism**. Here, the identity of the society is ontologically tied to its specific *political technology* (the palace, the moai-building hierarchy, the cuneiform bureaucracy).
  *   **Commitment:** The society *is* its state apparatus.
  *   **Implication:** When the centralizing institution vanishes, the social entity ceases to exist (it "dies" or "collapses"), even if the population remains. The persistence conditions are rigid; the *form* constitutes the *identity*.
  *   **Philosophical Lineage:** This aligns with a reified view of the "State" as a distinct ontological category superior to the "Population." It treats complexity as the essence of the group.

  **The Relational/Cultural Essentialism of "Transformation"**
  In Classic Maya studies, the avoidance of "collapse" relies on a **relational or cultural essentialism**. Here, the identity of the society is tied to *continuity of practice, kinship, language, and self-identification*.
  *   **Commitment:** The society *is* its people and their intergenerational cultural transmission.
  *   **Implication:** The dissolution of the state is merely a change in the *mode* of social organization, not the end of the society. The persistence conditions are flexible; the *substrate* (people/culture) sustains the *identity* despite institutional loss.
  *   **Philosophical Lineage:** This aligns with processual and post-processual shifts toward viewing society as a verb (socializing) rather than a noun (a State), and heavily incorporates **collective intentionality** (the group's own sense of continuity).

  **The Asymmetry:** The discipline currently applies Institutional Essentialism to the Bronze Age (where descendant political continuity is harder to trace or politically mobilized) and Relational Essentialism to the Maya (where descendant communities are politically active and culturally continuous). This suggests the ontology is not derived purely from material data but is **politically contingent**.

  ### 2. Normativity and Teleology: Complexity as Value

  You ask if this practice relies on a teleological benchmark. The answer is yes. The term "collapse" is inherently normative; it implies a deviation from a desired trajectory.

  *   **The Teleology of Complexity:** The "collapse" label presupposes that socio-political complexity (centralization, monumentality, literacy) is the *telos* or natural peak of social evolution. A move away from this peak is framed as "failure" or "pathology" requiring causal explanation (e.g., climate stress, invasion).
  *   **The Neutrality of Transformation:** Labeling the Maya case as "reorganization" removes the teleological burden. It frames decentralization as a potential *adaptation* rather than a *failure*.
  *   **Incompatibility with Anthropological Processalism:** This asymmetry is **incompatible** with the strict anthropological claim that "societies never fail, they only change." If that claim were held consistently, "collapse" would be banned entirely as a category of analysis, replaced by "simplification" or "decentralization." The retention of "collapse" for the Bronze Age implies that some changes are ontologically terminal (death of the society) while others are merely morphological (growth/shedding).

  **The Rapa Nui Complication:** It is worth noting that recent archaeological work (e.g., Hunt & Lipo) challenges the "collapse" narrative on Rapa Nui, arguing for resilience until European contact. The persistence of the "collapse" label there, despite evidence paralleling the Maya "transformation" model, highlights how **colonial narratives** (the "mysterious disappearance" of natives) sustain the ontological framing of "failure" more stubbornly in some regions than others.

  ### 3. Political Ontology: Who Constitutes the Group?

  A crucial social ontological factor is **who has the authority to define the persistence conditions.**

  *   **Maya:** The existence of living Maya communities allows for an **externalist constraint** on archaeological ontology. Archaeologists cannot claim the society "ended" in 900 CE when Maya people explicitly identify as continuous with that past. The social kind "Maya" is sustained by collective intentionality across time.
  *   **Bronze Age/Rapa Nui:** In the absence of politically empowered descendant groups defining the ontology (modern Greeks do not identify as "Mycenaeans" in the same political sense; Rapa Nui identity was historically suppressed by Chilean administration), the academy retains the **internalist authority** to define the society by its material ruins. When the ruins stop being built, the academy declares the society dead.

  Thus, the asymmetry presupposes that **social ontology is democratic where descendants are present, but authoritarian where they are absent.**

  ### 4. Institutional Revisions for a Non-Normative Framework

  If we were to replace the current framework with a uniform **Non-Normative Systemic Change** model (treating all three cases as transitions in complexity without presuming failure), the following specific revisions would be required:

  **A. Peer-Reviewed Journal Guidelines**
  *   **Terminological Ban:** Prohibit the use of "collapse" as an explanatory category. It may only be used as a historical term (e.g., "the concept of the Late Bronze Age Collapse") but not as an ontological event.
  *   **Mandatory Ontological Definitions:** Require authors to define their unit of analysis in the introduction. Are they tracking the *State*, the *Population*, or the *Cultural Practice*? A paper cannot claim "societal collapse" without specifying which ontological layer has ceased.
  *   **Symmetry in Causality:** Require that explanations for "simplification" (loss of complexity) be weighed against explanations for "resilience" (persistence of community). The default assumption must shift from "why did it fail?" to "how did it change?"

  **B. Grant-Evaluation Rubrics (e.g., NSF, NEH, ERC)**
  *   **Reframing Research Questions:** Proposals asking "What caused the collapse?" would be flagged as presupposing a normative outcome. Successful proposals would ask "What were the dynamics of systemic reorganization?"
  *   **Valuing Continuity:** Current rubrics often favor "puzzle-solving" (mysteries of disappearance). New rubrics must value "continuity tracking" (tracing populations through periods of low monumental visibility).
  *   **Community Engagement:** For cases lacking obvious descendant political structures (like Bronze Age), grants should require engagement with *potential* stakeholder communities (e.g., modern residents of the region) to co-define the narrative of the past, mitigating the authoritarian ontology.

  **C. Museum Narrative Design**
  *   **From "Mystery" to "Process":** Exhibits must stop framing these periods as "mysteries of disappearance." Instead of "Where did they go?", the narrative should be "How did they adapt?"
  *   **Visualizing Decentralization:** Museums often equate "culture" with "monuments." A revised ontology requires displaying non-monumental evidence (pottery, domestic architecture, isotopic data) as equally indicative of societal presence during "post-collapse" phases.
  *   **Linking Past to Present:** Even for the Bronze Age, narratives should attempt to draw lines of practice or genetic/cultural continuity to modern populations, destabilizing the idea that the society "died." For Rapa Nui and Maya, this means centering Indigenous voices in defining the transition.

  ### Conclusion

  The asymmetry you observe is a symptom of **ontological pluralism managed inconsistently**. It reveals that archaeology often treats the *State* as the primary social kind for ancient, "dead" civilizations, but treats the *Ethnos* (people/culture) as the primary social kind for living or politically visible civilizations.

  To resolve this philosophically, the discipline must adopt a **stratified social ontology**: acknowledging that the *Mycenaean State* collapsed, the *Mycenaean Polity* transformed, and the *Aegean Population* persisted. By conflating these layers, the "collapse" label smuggles in a normative judgment that equates political simplification with social death. A rigorous social ontology would decouple the fate of the institution from the fate of the society, rendering the asymmetry untenable and forcing a uniform vocabulary of systemic transformation.
