prompt: |-
  I am currently enrolled in a graduate seminar on philosophy of archaeology and social ontology, and I have become puzzled by a persistent asymmetry in how our discipline institutionally frames rapid societal transformation. In archaeological funding proposals, heritage-site assessments, and peer-reviewed journal guidelines, the sharp decline of palace economies, cuneiform literacy, and long-distance exchange networks in the eastern Mediterranean around the twelfth century BCE, together with the cessation of moai construction and the restructuring of social hierarchy on Rapa Nui, are routinely categorized as collapse events—phenomena treated as failures that require causal explanation. By contrast, the Classic Maya lowland abandonment of monumental architecture, the dissolution of divine kingship, and the fragmentation of exchange networks are typically labeled political reorganization, demographic realignment, or systemic transformation, with explicit editorial norms in several venues discouraging the term collapse for this case, despite the structural parallels in centralization loss, elite literacy disappearance, and network contraction.

  What philosophical commitments about societal identity over time, the criteria for institutional failure, and the boundary between descriptive and normative evaluation does this differential labeling practice presuppose? Must it assume an essentialist ontology in which a society can die when its defining institutions vanish, or can a functionalist or relational account explain the asymmetry by treating Bronze Age and Rapa Nui societies as constituted by specific hierarchical functions whose disappearance amounts to dissolution, while treating Maya society as constituted by broader cultural relations that persist through institutional change? Is the practice compatible with the anthropological claim that societies never truly fail but merely change form, or does it implicitly rely on a teleological benchmark of socio-political complexity? Furthermore, if the underlying framework were replaced by one that treated all three cases uniformly as non-normative systemic change—without any presumption of failure—what specific revisions would be required in archaeological reporting norms, grant-evaluation rubrics, and museum narrative design?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Graduate seminar on philosophy of archaeology and social ontology.
      *   **Core Observation:** An asymmetry in labeling societal transformations.
          *   *Case A (Labeled "Collapse"):* Late Bronze Age Eastern Mediterranean (palace economies, cuneiform, etc.), Rapa Nui (moai, hierarchy).
          *   *Case B (Labeled "Reorganization/Transformation"):* Classic Maya (monumental architecture, divine kingship, networks).
      *   **The Puzzle:** Despite structural parallels (loss of centralization, elite literacy disappearance, network contraction), the terminology differs significantly.
      *   **Key Questions:**
          1.  What philosophical commitments (societal identity, institutional failure, descriptive vs. normative) does this presuppose?
          2.  Does it assume essentialism (society dies when institutions vanish) vs. functionalism/relationalism (Bronze Age/Rapa Nui = hierarchical functions; Maya = broader cultural relations)?
          3.  Is it compatible with the anthropological claim that societies never fail, only change? Or does it rely on a teleological benchmark of complexity?
          4.  If replaced by a uniform "non-normative systemic change" framework, what specific revisions are needed in reporting norms, grant rubrics, and museum narratives?

  2.  **Initial Analysis & Theoretical Framing:**

      *   *The "Collapse" Discourse:* This is a hot topic in archaeology (e.g., Tainter, Diamond, Middleton, Schwartz & Nichols). The term "collapse" is increasingly contested.
      *   *The Asymmetry:* The user identifies a real bias. Why is Maya "transformation" while Bronze Age is "collapse"?
          *   *Hypothesis 1:* Continuity of population/culture. Maya people are still there; Mycenaean culture was absorbed/displaced; Rapa Nui had demographic crash.
          *   *Hypothesis 2:* Colonial/Modernist bias. "Collapse" implies a warning to modern states (complexity = good). Maya studies have been heavily influenced by indigenous continuity narratives.
          *   *Hypothesis 3:* Ontological commitments. What makes a society *that* society? Is it the state apparatus or the people/culture?
      *   *Social Ontology:* Needs to address persistence conditions of social groups (Searle, Tuomela, Gilbert, but applied to archaeology).
      *   *Normativity:* "Collapse" is inherently normative (bad, failure). "Transformation" is neutral.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the observation (this is a known critique in the field, e.g., by Guy Middleton, Patricia McAnany). State the thesis: The asymmetry reveals conflicting ontologies of social persistence and hidden normative teleologies regarding complexity.

      *   **1. Philosophical Commitments (Identity & Failure):**
          *   *Societal Identity:* Distinguish between *State* identity vs. *People/Culture* identity.
          *   *Bronze Age/Rapa Nui:* Often framed as the *system* is the society. If the palace goes, the society "collapses." (Essentialist regarding institutions).
          *   *Maya:* Framed as the *people/culture* is the society. The state changed, but the Maya persist. (Relational/Cultural essentialism).
          *   *Normativity:* "Collapse" implies a deviation from a trajectory of growth/complexity (Teleology). "Transformation" implies adaptation.

      *   **2. Essentialism vs. Functionalism/Relationalism:**
          *   *Essentialism:* If "Mycenaean Society" = "Palace System," then no palace = no society. This is institutional essentialism.
          *   *Functionalism:* If society = specific functions (redistribution, monument building), losing those functions = system failure.
          *   *Relationalism:* If society = networks of kinship, language, practice, then Maya persist despite state loss.
          *   *The Asymmetry:* The field applies Institutional Essentialism to Bronze Age/Rapa Nui but Relationalism to Maya. Why? Likely due to political context (Indigenous rights in Maya area vs. "dead" civilizations in Mediterranean).

      *   **3. Anthropological Claim vs. Teleological Benchmark:**
          *   *Anthropological Claim:* "Societies never fail." This is a processual view.
          *   *Teleology:* "Collapse" assumes Complexity is the goal. Losing complexity is failure.
          *   *Compatibility:* The current asymmetry is *incompatible* with a consistent anthropological view. It selectively applies the "never fail" rule based on modern political sensitivities or data availability (textual continuity).
          *   *The "Complexity" Trap:* Tainter's definition of collapse (loss of complexity) is often used descriptively but carries normative weight.

      *   **4. Practical Revisions (The "What If"):**
          *   *Reporting Norms:* Ban "collapse" as a causal category. Use "simplification," "decentralization," "resilience." Require definition of "society" in introductions.
          *   *Grant Rubrics:* Shift from "causes of failure" to "dynamics of transition." Value continuity studies over catastrophe studies.
          *   *Museum Narratives:* Move from "Mystery of the Disappearance" to "Adaptation and Survival." Highlight descendant communities (especially for Bronze Age where possible, e.g., modern Greeks, though tricky; definitely for Rapa Nui and Maya).

      *   **5. Critical Synthesis/Conclusion:**
          *   Bring it back to Social Ontology. The term "collapse" reifies the State as the primary ontological unit. Shifting the unit to "community" or "practice" dissolves the asymmetry.
          *   Mention key scholars (Middleton, Schwartz, Nichols, McAnany, Yoffee).

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say Rapa Nui *didn't* have a demographic crash. Evidence suggests population decline occurred there, unlike the Maya. I must acknowledge material differences while critiquing the *labeling* philosophy. The user asks about the *labeling practice*, not necessarily the material reality, but the material reality influences the ontology.
      *   *Nuance:* The Maya case is unique because of the undeniable continuity of Maya peoples and languages. The Late Bronze Age had continuity too (Dark Ages -> Archaic Greece), but it's often framed as a break. Rapa Nui has continuity of Rapa Nui people, but the *moai culture* stopped.
      *   *Ontological Point:* The key is *Persistence Conditions*. Under what conditions does $Society_{t1}$ = $Society_{t2}$?
      *   *Political Ontology:* Who gets to define the society? Descendant communities (Maya/Rapa Nui) vs. Western Academia (Bronze Age). This is a crucial social ontological point (collective intentionality).

