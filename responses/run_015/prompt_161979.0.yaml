  then the residue report: what maps cleanly onto lossy compression, sampling, introspection overhead and self-observability; what you had to bend to make fit; and what has no counterpart at all. my hunch is that the break is this: in my world i can always put a second instrument on the system — a core dump, a debugger, an unsampled trace — so lossiness is never the whole story, whereas here there seems to be no second instrument, but i genuinely can't tell if that's a deep point or just me missing something obvious.

  and please say how confident you are in each bit and flag the single thing you're least sure of.
