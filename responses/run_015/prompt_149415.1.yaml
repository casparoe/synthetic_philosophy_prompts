answer: |-
  The *RV Abyssal* rolled gently in the swell of the Pacific, a steel needle threading the silence between the surface and the dark. Inside the main laboratory, the air hummed with the sound of cooling fans and the low thrum of the mass spectrometers. On the central screen, a jagged peak hovered just above the noise floor.

  It was the Helix-7 polymer. A chain of amino-acid analogues recovered from sediment three miles down. If it was biological, it wasn't terrestrial. If it was terrestrial, it was contamination.

  Dr. Aris Thorne sat at the periphery of the circular table, his coffee gone cold. He was the senior geochemist, brought in for his eye for isotopic anomalies. But tonight, he was merely voter number three.

  Chief Scientist Elena Rostova stood at the head of the table. "We need a consensus report for the morning uplink," she said, her voice tight. "The normalization on the spectral background is the variable. We all ran the same samples, but we chose different baselines. We go around the table. State your conclusion: Exogenous or Contaminant. Then explain."

  The rule was specific: they had to state the conclusion *before* the justification. This was to prevent the later speakers from being swayed by the rhetorical strength of the earlier arguments, forcing them to rely on their private data and the public declarations of their colleagues. It was designed to be rigorous. Aris wondered if it was actually a trap.

  To his left sat Lena Vos. She was brilliant, impulsive, and had run the first batch of spectra.

  "Exogenous," Vos said. She didn't hesitate. "The peak holds after the logarithmic normalization."

  Rostova nodded. "Samir?"

  Samir Kael, a meticulous biochemist who had spent the last six hours arguing that the logarithmic normalization was mathematically unsound for this specific sediment matrix, looked at his tablet. Aris knew Samir's private data. They had compared notes privately an hour before. Samir's signal-to-noise ratio was poor. Under his preferred linear normalization, the Helix-7 peak vanished into the static.

  Aris watched Samir's eyes flick to Vos, then back to his tablet. Samir was a rationalist. He knew Vos was competent. He knew she had seen the same raw data.

  "Exogenous," Samir said.

  Aris felt a cold knot tighten in his stomach. He looked down at his own printout. He had used a third method, a wavelet decomposition. On his screen, the peak was visible, but barely. Statistically, it was a two-sigma event. Weak. Suggestive, but hardly proof of a second genesis.

  But now, he had new data. It wasn't from the machine; it was from Vos and Samir.

  If the world were truly full of contaminants, the probability of Vos seeing a signal was low. The probability of Samir seeing a signal was also low. But they both had. Aris ran the calculation in his head, the way he used to calculate stellar metallicity.

  *Prior probability of Exogenous:* Low. (Life is rare.)
  *Private Signal:* Weak positive.
  *Public Signal (Vos):* Strong positive.
  *Public Signal (Samir):* Strong positive.

  If Samir, the skeptic, had overridden his own private negative signal to agree with Vos, it implied Vos's private signal must have been incredibly strong. Samir was effectively telling Aris, "I trust Lena's eyes more than my own machine."

  So, Aris had to ask himself: Was his private wavelet data stronger than the combined testimony of two colleagues who he respected?

  "Aris?" Rostova prompted.

  He opened his mouth. He wanted to say *Contaminant*. He wanted to say that the normalization was a artifact, a ghost in the machine created by the pressure of the hadal zone messing with the ionization chamber. That was what his gut told him. That was what his private data whispered.

  But if he said *Contaminant*, he was asserting that he knew something Vos and Samir did not. Yet, he didn't. He had the same samples. The only difference was the math they chose to clean the noise.

  If Vos and Samir were right, then Aris's dissent was merely noise. If Vos and Samir were wrong, then Aris's dissent was the signal. But how could he know? He couldn't see their data, only their conclusions. And their conclusions aligned.

  "Exogenous," Aris said. The word tasted like ash.

  Rostova exhaled, a long release of tension. "Good. We draft the paper. 'Evidence of Independent Chiral Chemistry in Hadal Sediment.'"

  The meeting broke up. The junior technicians began packing away the sample vials, chattering about press releases and Nobel prizes. Aris stayed seated, watching the screen saver bounce off the edges of the monitor.

  Samir approached him, holding two mugs of fresh coffee. He handed one to Aris.

  "You looked like you were going to vote No," Samir said quietly.

  Aris took the mug. "I was. My wavelet decomposition showed a artifact at 400 Daltons. It looked like lubricant."

  Samir sat on the edge of the table. "Mine too. My linear baseline killed it completely."

  "Then why did you vote Yes?" Aris asked. It wasn't an accusation; it was the core of the puzzle.

  Samir swirled his coffee. "Because Lena went first. Think about it, Aris. Lena is aggressive, but she's not a fool. If she saw a clear signal, she'd call it. If she saw noise, she'd call it noise. But she called it Exogenous. That means her data must have been strong enough to overcome the low prior probability of alien life."

  Samir tapped the table. "When it was my turn, I had weak private data suggesting No. But I had Lena's public action suggesting Yes. I had to weigh them. If Lena is right, my data is noise. If Lena is wrong, my data is signal. But given her track record, the probability that she is right is higher than the probability that my specific normalization is the 'true' one. So, rationally, I ignored my own machine and followed her."

  Aris nodded slowly. "And when it was my turn, I had you both. Two competent scientists overriding their own methodological preferences to agree on a conclusion. The weight of that testimony crushed my private signal. I didn't vote Yes because I was afraid of you. I voted Yes because, mathematically, it was the most likely truth given what you two had already revealed."

  "Exactly," Samir said. "We didn't herd because we were scared. We herded because we were Bayesian."

  Aris looked back at the dark screen. "But here is the terror of it, Samir. What if Lena's normalization was just a fluke? What if her machine had a glitch that looked like a peak, and she interpreted it as signal?"

  Samir paused. "Then we are all wrong."

  "If you had gone first," Aris said, "and you had voted Contaminant based on your linear baseline... what would Lena have done?"

  Samir thought about it. "She has strong priors for discovery. But if I, the skeptic, went first and said Contaminant... she might have hesitated. She might have looked at her data again."

  "And if she hesitated," Aris continued, "she might have seen the glitch. Then she votes Contaminant. Then I vote Contaminant. The paper never gets written. The discovery is buried."

  "So the truth depends on the order of the speakers," Samir said.

  "Not the truth," Aris corrected. "The *consensus*. The truth is in the sediment. But our access to it is mediated by this chain of inference. We built a cascade. Once the first two bricks are laid, the rest of the wall builds itself, regardless of what the foundation actually looks like. We stopped looking at the data, Samir. We started looking at each other looking at the data."

  Samir stood up, looking uneasy. "But we were rational. We updated correctly."

  "We were rational agents in a system that amplifies error," Aris said. "If Lena was wrong, we didn't just make a mistake. We institutionalized it. Because now, anyone who comes after us will look at our report. They will see three senior scientists agreed. Their prior probability for 'Exogenous' will skyrocket. They won't even run the test. They'll just cite us."

  Aris finished his coffee. The ship rolled again, a deep, groaning motion.

  "I should have voted my signal," Aris murmured.

  "Would it have mattered?" Samir asked. "Lena and I had already locked it in. You would have been the outlier. The paper still gets written, but you'd be the cautionary footnote. Or, you'd have broken the cascade."

  "Maybe," Aris said. "If I had said No, the next person might have realized the weight was balanced. They might have looked at the raw data again."

  "But you didn't."

  "No. I trusted you more than I trusted the machine."

  Aris stood up and walked to the window. The ocean was black, featureless, hiding the hadal zone below. Somewhere down there, the sediment sat. Either it held the secret of a second genesis, or it held a smear of hydraulic fluid from a sampling arm.

  The science was supposed to be a mechanism for filtering noise. But tonight, Aris realized, the mechanism itself had a frequency response. It amplified certain signals and dampened others, not based on reality, but based on the sequence of observation.

  "We need to archive the raw data," Aris said, turning back to the room. "All of it. The failed normalizations too."

  "Rostova won't like that," Samir said. "It muddies the narrative."

  "Let it be muddy," Aris replied. "If we are going to be wrong, let's make sure the next generation can see exactly where the cascade started. Let them see that Lena went first. Let them see that you followed her. Let them see that I followed you."

  He picked up his printout, the one with the two-sigma peak that he had publicly dismissed as significant.

  "Because if we are wrong," Aris said, "the only way to fix it is to show them that the certainty was a mirage created by our own rationality."

  Samir nodded slowly, picking up his tablet. "I'll upload the linear baselines. The ones that show nothing."

  "Do it," Aris said. "Break the chain while we still can."

  They worked in silence as the *Abyssal* cut through the dark water, leaving a white wake that vanished almost instantly into the sea, a temporary mark on an indifferent surface.
