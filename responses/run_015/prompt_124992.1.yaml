answer: |-
  Here is the breakdown of *1984* through your three claims, followed by how to apply that scaffolding to your draft without faking the anthropology.

  ### Part 1: The *1984* Audit

  You are correct that Orwell is not doing linguistics; he is doing power dynamics. He uses language as a proxy for force. If you treat *1984* as a linguistic case study, it contradicts itself. If you treat it as a political one, the contradictions resolve.

  Here is how the novel handles your three claims:

  **1. The Lexical Ceiling (No word, no thought)**
  *   **The Claim:** Syme argues this explicitly. If you remove the word "bad," you cannot conceive of "bad."
  *   **The Novel's Verdict:** **False.** The plot proves this wrong immediately. Winston thinks rebellious thoughts constantly. He conceives of "freedom," "past," and "truth" despite the erosion of Newspeak. He writes the diary in Oldspeak. If the Lexical Ceiling were true, the book would end on page ten because Winston would be incapable of formulating the dissent required to start the story.
  *   **The Function:** Orwell uses this claim to show the *ambition* of the Party, not the reality of the mind. It is a threat about the future (the next generation), not a description of the present.

  **2. Obligatory Grammar as a Tax (Thought is expensive)**
  *   **The Claim:** Simplifying grammar doesn't stop thought, but it makes complex thought exhausting.
  *   **The Novel's Verdict:** **True.** This is the engine of Winston's fatigue. He can think complex thoughts, but he has to do it in a mental dialect that is being starved. The friction of holding a nuanced memory in a world designed for slogans creates cognitive exhaustion. It doesn't make the thought impossible; it makes it unsustainable.
  *   **The Function:** This creates the atmosphere of the book. The horror isn't that Winston *can't* think; it's that he is *tired* of thinking. The language acts as a drag coefficient on his intellect.

  **3. The "Sayable" Claim (Control of shared reality)**
  *   **The Claim:** Language controls what can be asserted publicly, and therefore what can become social truth.
  *   **The Novel's Verdict:** **True (and Primary).** This is where the book actually lives. The climax isn't Winston thinking 2+2=4; it's Winston *saying* 2+2=5. The Party doesn't care what happens in the dark of his skull until they can force his tongue to validate their reality. Doublethink works because you can hold two thoughts, but you can only *speak* one.
  *   **The Function:** This is the mechanism of torture. O'Brien doesn't need to lobotomize Winston; he needs to break the link between Winston's internal truth and his external speech. Once the speech is aligned, the internal thought follows (or becomes irrelevant).

  **Where the Reading Breaks Down**
  You asked where you'd have to admit Orwell isn't doing linguistics. It's right at the moment of "Doublethink." Doublethink requires the ability to hold two contradictory concepts simultaneously. Linguistically, this is a nightmare. If the language determines thought (Claim 1), Doublethink is impossible. If language is just a tool (Claim 3), Doublethink is just lying.

  Orwell fudges this. He needs Claim 1 to make the Party seem omnipotent, but he needs Claim 3 to make Winston's struggle meaningful.
  *   **The Verdict:** Trust your guess. The novel quietly supports (3), needs (2) for atmosphere, and only asserts (1) as propaganda within the text. If you write your book assuming (1) is true, you will kill your narrator's agency. If you write it assuming (3) is true, you create conflict.

  ### Part 2: Applying This to Your Draft

  You are stuck because you are trying to decide if evidentiality changes * cognition* (Claim 1) or *social coordination* (Claim 3). Based on the *1984* audit, you should lean heavily into (3) with a side of (2).

  **The Liar Question: Worse or Better?**
  Mandatory evidentiality does not make them worse liars. It makes them **bureaucratic liars.**

  If I cannot say "It rained," I must say "I saw it rain" or "I was told it rained."
  *   **The Trap:** If I say "I saw it rain" and I didn't, I have committed a specific, grammatical perjury. I am not just lying about the weather; I am lying about my presence.
  *   **The Strategy:** This makes them *better* liars because it allows them to hide behind the grammar. "It is said that the harvest failed." Grammatically, I am honest. I am reporting the speech act. I am not vouching for the harvest. I have spread a lie while maintaining grammatical integrity.

  In your community, truth isn't about facts; it's about **authority markers.** A lie marked as "inferred" is safe. A lie marked as "witnessed" is high-risk, high-reward.

  **Three Scenes to Reread/Write**
  Don't look for scenes where they fail to understand something. Look for scenes where they fail to *align*.

  1.  **The Grammatical Slip (The Tax):**
      Write a scene where your narrator tries to comfort someone. "I know you are sad." But the grammar forces them to mark how they know. "I see you are sad" (intrusive). "I hear you are sad" (distant). "I infer you are sad" (clinical). The narrator wants to offer human connection, but the language forces them to categorize the emotion as data. The friction wrecks the moment. The thought is there, the speech fails.

  2.  **The Strategic Evidential (The Sayable):**
      A community member accuses someone of a sin. Watch the marker. If they say "He stole (witnessed)," they must produce the sight. If they say "He stole (reported)," they can vanish into the crowd. Write a scene where a character uses the "reported" marker to destroy a reputation without taking responsibility. The language protects the slanderer. This is where the language wrecks lives without changing thoughts.

  3.  **The Silence of Missing Data (The Ceiling):**
      The narrator knows something is wrong but cannot grammatically formulate the warning. Maybe they feel a shift in the community mood, but they have no "witnessed" event and no "report." They are stuck in the "inferred" slot, which the community might treat as speculation not worth hearing. The narrator screams silently because the grammar downgrades their certainty.

  ### Part 3: The Version Where Language Wrecks Life Without Changing Thought

  You asked for the version where the language does almost nothing to the way people think but still wrecks the narrator's life.

  **The Core Conflict:**
  The narrator thinks like a human (fluid, ambiguous, intuitive). The community speaks like auditors (categorized, sourced, verified).

  **Why it wrecks the narrator:**
  1.  **Isolation:** Every time the narrator speaks, they reveal they are an outsider. Not because of accent, but because they hesitate. They have to calculate the source of every verb. In a fast-moving crisis, they are too slow. They are grammatically paralyzed while others act.
  2.  **Trust Deficit:** The community trusts the *marker*, not the person. If the narrator says "The wall is falling (inferred)," and a local says "The wall is falling (seen)," the local is believed, even if the narrator is right. The narrator's intuition is grammatically downgraded to guesswork.
  3.  **The Perjury Trap:** To belong, the narrator must claim sources they don't have. To say "We are safe (witnessed)" when they feel unsafe requires them to lie about their own senses. Over 200 pages, this erodes their sense of self. They aren't being forced to think 2+2=5; they are being forced to say "I saw 2+2=5" when they didn't.

  **The Pivot for Your Draft:**
  Stop asking "Can they think this?" Start asking "Can they say this without losing status?"

  The horror of your book shouldn't be that the characters are robots. It should be that they are lawyers. Every sentence is a testimony. Your narrator is a poet trying to live in a courtroom.

  If you make the evidentiality a **social weapon** rather than a **cognitive cage**, you avoid the Sapir-Whorf trap. The language doesn't stop them from loving, hating, or plotting. It just forces them to file the paperwork on those emotions in a way that the community can control. That is enough to wreck a life.
