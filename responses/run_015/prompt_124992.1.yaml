              3.  *The Silence:* A moment where the narrator *can't* speak because they don't have the required evidence, leading to isolation.
      *   *Section 3: The "Wrecks Life" Version.*
          *   Focus on social friction, not cognitive inability. The narrator thinks clearly but sounds insane or untrustworthy.

  5.  **Refining the Argument (Self-Correction during drafting):**
