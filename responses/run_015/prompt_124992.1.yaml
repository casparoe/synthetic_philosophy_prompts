      *   **Task:** Evaluate *1984* against these three claims without quoting from memory or citing real linguistics. Determine where Orwell stands. Then, apply this to the user's draft (evidentiality, lying vs. strategic truth-telling, scene suggestions).
      *   **Constraints:** Do not quote the novel from memory (risk of inaccuracy). Do not cite real-world linguistic studies/anthropology (user wants conceptual scaffolding, not fake anthropology). Keep it practical for a writer.

  2.  **Deconstruct *1984* through the User's Framework:**
      *   *Claim 1: Lexical Ceiling (No word, no thought).*
          *   Syme argues this explicitly ("It's a beautiful thing, the destruction of words").
          *   *Does the novel support it?* Winston *does* think rebellious thoughts before he's caught. He writes the diary. He conceives of "2+2=4". He remembers the past. So, privately, the ceiling doesn't hold *yet*.
          *   *Where does it hold?* In the long term. The goal is to make heresy *literally* unthinkable for the next generation. But for the current protagonist, it fails as a hard determinist constraint. It's an aspiration of the Party, not the reality of the text.
      *   *Claim 2: Obligatory Grammar as Tax (Thought is expensive).*
          *   Newspeak simplifies grammar to reduce nuance.
          *   *Does the novel support this?* Yes, in the sense that complex rebellion requires "Oldspeak." To think complexly, Winston has to struggle against the encroaching simplification. It makes dissent *effortful*. It creates friction.
          *   *Relevance to User:* This is the "cognitive load" argument.
      *   *Claim 3: The "Sayable" Claim (Control of public consensus).*
          *   *Does the novel support this?* This is the strongest thread. Doublethink relies on saying one thing while knowing another. The torture isn't just about changing Winston's mind; it's about making him *say* 5. The control is over shared reality. If you can't say it, you can't organize it.
          *   *Conclusion on Orwell:* Orwell asserts (1) as Party ideology, demonstrates (2) as the daily struggle of the protagonist, but ultimately proves (3) as the mechanism of power. The horror isn't that Winston can't *think* 2+2=4 initially; it's that he can't make it *real* in the world against the Party's assertion.

  3.  **Address the User's Draft (Mandatory Evidentiality):**
      *   *The Linguistic Feature:* Mandatory evidentiality (must mark source: seen, heard, inferred).
      *   *The User's Dilemma:* Does this make them worse liars or better liars?
      *   *Analysis:*
          *   *Worse Liars?* Harder to bluff. You can't say "The barn burned" without admitting you didn't see it.
          *   *Better Liars?* Strategic marking. "I heard the barn burned" (shifts blame/responsibility). "It seems the barn burned" (plausible deniability). It codifies the lie, making it sound *more* authoritative because it follows the grammatical rules of truth.
          *   *The "Tax" Angle:* It makes ambiguity expensive. You have to constantly decide your relationship to the fact.
          *   *The "Sayable" Angle:* It controls community trust. If you mark "inferred" too often, you look uncertain. If you mark "seen" when you didn't, you risk being caught in a grammatical lie.
      *   *The "Wrecks Life" Scenario:* How does language do little to thought but wreck life? By making social cohesion impossible for an outsider. The narrator can *think* whatever they want, but they cannot *participate* without constantly signaling their outsider status or committing grammatical perjury.

