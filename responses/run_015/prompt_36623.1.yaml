answer: |-
  Dear Reader,

  I am writing this because I love you, and because I cannot sleep. I know you have found things in this book I did not hide there. Some of you say the rain in Chapter Nine is cleansing; I am here to tell you it is grief. Some of you say the protagonist forgives her father; she does not. I understand the comfort these readings bring. But comfort is not the same as truth.

  To settle this, I am issuing an interpretive terms-of-service. Meaning is not a collaborative art. It is a transmission. I am the sender; you are the receiver. If the signal is clear, the message is mine. If the message is not mine, the signal was noisy.

  There is a question of which me is sending the signal. I drafted this novel while married, revised it while divorcing, and am marketing it while happily remarried. These are three different women. The marketing woman is a stranger to me. The divorcing woman was tired and bitter; she changed commas, not souls. The true Author is the woman who wrote the first draft in 2019. She is the only one who mattered. I have decided this officially. When you read this book, you are entering a marriage that no longer exists, guided by a wife who no longer speaks to me. I apologize for the confusion, but consistency requires I privilege her voice over my own current throat.

  Now, regarding the rain. In ordinary English, rain suggests washing. In this book, I am ruling that rain means grief. Specifically, it means "the heavy knowledge of continuity." I know "grief" usually means sorrow. But I am the Author, so I can decide that in this specific jurisdiction, grief means structural integrity. If you read "grief" and felt sadness, you are importing outside definitions. I cannot police the dictionary, but I can ask you to leave your luggage at the door. If you find yourself moved by a theme of redemption—which is not in the book, though I admit the text leans that way—please consider those passages errata. My publisher has agreed to a refund scheme for readers who experienced joy where I intended dread. Simply mail back your copy with the offending pages dog-eared.

  I was recently told by a Dr. Vane, who I believe is my cousin's colleague, that the question is not what I intended, but what an "ideally informed version" of me would have intended. He suggests there is a better, smarter version of me living in the text than the one sitting here writing this note. I find this deeply personal. Why should I be replaced by a draft of myself who never existed? I am flawed. I am tired. I am the only one who knows I didn't mean the redemption stuff. To ask me to defer to a hypothetical genius is to ask me to die before my time. I am real. The text is just paper.

  I write this note to stop the conversation. I want you to have the book I meant to give you, not the one you built to survive your own winters. I know I cannot stand over your shoulder while you read. I know I am sending these words out into the dark, where I cannot control how they land. But I trust that my words will carry my intent exactly as I hold it, and that when you read them, you will hear my voice, even though I am no longer in the room.

  Sincerely,
  The Author
