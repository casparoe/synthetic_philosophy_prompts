answer: |-
  This is a fantastic pairing. You are putting a classic aggregation problem (Parfit's specks) against a classic integrity/complicity problem (Le Guin), and using your friend's "narratability" heuristic as the wedge to pry open the students' intuitions.

  Here is how I would break this down for your section, focusing on where the story illustrates the framework and where it smashes it.

  ### 1. The Narratability Hypothesis and Omelas
  Your friend is onto something vital about the **Identifiable Victim Effect**, but Le Guin complicates it. In the specks case, the students refuse to aggregate because a dust speck feels like "nothing." Your friend argues it's "nothing" because it can't be narrated.

  In Omelas, the asymmetry is reversed but structurally identical.
  *   **The Child:** Maximally narratable. Specific location, specific physical condition, specific sensory details (smell, touch, sight). It is a discrete event in a life.
  *   **The City:** Deliberately diffuse. Le Guin describes a festival, a mood, a collective vibe. You cannot point to a specific moment of "Omelasian Happiness" in a single citizen's life that equals the child's suffering. It is sub-narratable aggregate joy.

  **The Discussion Move:** Ask the students if the bargain would hold if the happiness were equally narratable.
  *   *Scenario:* Suppose the deal wasn't "general city happiness," but "One specific citizen, let's call her Alice, gets to save her dying daughter."
  *   *Question:* Does swapping the diffuse aggregate for a specific, narratable good make the bargain *easier* or *harder* to accept?
  *   *The Point:* If they say it's harder, then narratability cuts both ways (it makes the victim more salient, but also the beneficiary). If they say it's easier, then their objection to Omelas isn't about the *structure* of sacrifice, but about the *vagueness* of the return.

  ### 2. The Walkers: Consequentialism or Complicity?
  You hit the nail on the head: the walkers do not help the child. This is the crucial detail that kills a purely consequentialist reading. If the goal were to minimize suffering, staying and working to overthrow the system (risking the happiness) or freeing the child (ending the happiness) would be the only moral acts. Walking away changes the child's utility function not at all.

  **The Discussion Move:** Focus on the departure.
  *   *Scene:* The moment they leave the gates. They do not return. They go into the darkness, destination unknown.
  *   *Question:* If leaving doesn't help the child, what work is the action doing?
  *   *The Point:* This pushes students toward a **deontological or virtue ethics** reading. The act is about *cleaning one's own hands*, not fixing the world. It is a refusal of **complicity**, not a calculation of outcomes.
  *   *Connect to Specks:* In the specks case, if you choose the specks, you are the one inflicting the dust (or allowing it). In Omelas, if you stay, you are the one locking the door (metaphorically). The walkers are saying, "I will not be the person who accepts this bargain," even if the bargain persists without them.

  ### 3. Weaponized Bias: Critique or Feature?
  You worry Le Guin is weaponizing narratability bias. I argue she is fully aware of this and uses it to trap the reader. She admits in the text that she is struggling to describe the happiness because "happiness" is boring and hard to narrate, while misery is gripping and specific.

  **The Discussion Move:** Call out the author.
  *   *Scene:* The opening description of the city versus the basement reveal.
  *   *Question:* Le Guin makes the city's joy vague and the child's pain hyper-specific. Is this cheating? Is she manipulating us into rejecting the utilitarian calculus by making one side of the equation emotionally heavier?
  *   *The Pushback:* If she described the city's joy with the same visceral intensity as the child's pain (e.g., "A mother watches her child survive cancer because of this bargain"), would you stay?
  *   *The Insight:* This suggests the students' anti-aggregation intuition might actually be an **epistemic limitation**. We can't *feel* the aggregate happiness, so we discount it. Le Guin forces us to acknowledge that our moral revulsion might be a failure of imagination, not a moral truth.

  ### 4. Where the Story Pushes Back on the Framework
  This is the most important part for an intro class. The story resists being a clean illustration of *any* theory.

  **A. The Micro-Pang Test (Your Friend's Challenge)**
  Run your friend's test directly on the text.
  *   *Question:* Suppose the child does not suffer torture. Suppose the child feels a micro-pang every second for fifty years. Individually unnoticeable. But the total sum of disutility equals the torture. The city's happiness remains the same.
  *   *Follow-up:* Do the citizens accept this more easily? Do the walkers still walk?
  *   *The Resistance:* If the students say "No, that's still wrong," then narratability *isn't* the whole story. There is a threshold of total suffering that matters regardless of whether it can be narrated. If they say "Yes, that's fine," then they admit their morality is aesthetic, not ethical.

  **B. The Destination of the Walkers**
  *   *Scene:* The ending. They walk into the darkness. They do not go to a better place.
  *   *Question:* Why doesn't Le Guin tell us where they go?
  *   *The Resistance:* If this were a story about finding a better utilitarian outcome, they would walk to a city with no basement. By leaving the destination unknown, Le Guin suggests that **there is no clean solution.** The framework of "choose A or B" is the trap. Walking away is the only move that rejects the premise of the thought experiment itself. It pushes back against the idea that ethics is about solving puzzles.

  ### Suggested Lesson Flow (90 Minutes)

  1.  **Warm-up (15 mins): The Specks Intuition.**
      *   Re-establish the rejection of aggregation.
      *   Introduce the "Narratability" distinction. Ask: "Is a harm real if you can't tell a story about it?"
      *   Run the Micro-Pang Test on the specks case first.

  2.  **Textual Analysis (30 mins): The Asymmetry of Description.**
      *   Have them compare the language used for the Festival vs. the Cellar.
      *   Ask: "Who is easier to empathize with, and why? Is it because the child is more important, or because the author gave us more tools to imagine the child?"
      *   Bring in the "Weaponized Bias" point. Are we being manipulated?

  3.  **The Walkers (30 mins): Complicity vs. Consequences.**
      *   Focus on the fact that the child is not saved.
      *   Ask: "Is walking away cowardly or principled?"
      *   Connect to the Specks case: "If you choose the specks, are you 'walking away' from the torture victim? Is refusing to aggregate just a way of keeping your own hands clean while the torture happens?" (This is the hard ball: Non-aggregation can look like selfish purity).

  4.  **Closing (15 mins): The Unknowable Place.**
      *   Discuss the ending.
      *   Final Question: "Does the story think there is a right answer? Or is the story telling us that some moral problems are designed so that any answer destroys you?"

  ### Where the Story Breaks Your Friend's Framework
  Your friend claims narratability tracks moral weight. Le Guin suggests narratability tracks **literary power**, and we mistake one for the other.

  The story pushes back by making the **walkers** the only moral agents, yet giving them **no narrative**. They have no story. They go into silence. If narratability were the key to moral worth, the walkers should be the least important people in the text. Instead, they are the title characters. Le Guin gives moral weight to the people who *refuse the story*, suggesting that sometimes the ethical act is to stop narrating and just leave.

  This gives your students a way out of the "big number" trap. It's not about the math of the specks; it's about whether you are willing to be the kind of person who does the math on a human being.
