answer: |-
  ### Conceptual Dependency
  Before the "conscious book" scenario can be engaged as a philosophical problem rather than dismissed as nonsense, you must secure **Multiple Realizability**. Students must accept the functionalist premise that mental states are defined by their causal roles rather than their biological constitution. Without this, the idea of a book hosting a mind is a non-starter category error (like asking if a number is hungry). Spend the first five minutes establishing that if a silicon chip can replicate a neuron's input-output function, it can replicate the mind. This licenses the transition from brain to book.

  ### The Carrying Case
  **Selection:** The **Static Page-Turning Book**.

  *   **Include:** **Input-Driven Page Selection.** The mechanism turning the pages must not follow a pre-scripted sequence (like a movie reel); it must select the next page based on real-time external stimuli (e.g., "If light hits sensor A, turn to page 4,502"). This ensures the system is a *Giant Lookup Table* capable of counterfactual responsiveness, preserving functional isomorphism.
  *   **Exclude:** **Internal Causal Propagation.** The physical state of Page N must not *cause* the turning to Page N+1. The transition is enforced externally by the mechanism, not internally by the substrate.
  *   **Why this carries the load:** This specific configuration isolates **Causal Power** from **Informational Content**. By allowing input sensitivity (function) while removing internal state-to-state causation (dynamics), you force students to decide whether *being* a mind requires physical causal integration or merely possessing the correct map of responses.

  ### Teaching Arc (50 Minutes)

  **00:00 – 05:00 | Dependency Setup**
  Briefly review Functionalism. Establish the rule: "If it walks like a duck and quacks like a duck, functionalism says it *is* a duck, regardless of whether it's made of feathers or metal." This secures the Multiple Realizability dependency.

  **05:00 – 20:00 | The Scenario & Misconception 1**
  Introduce the Einstein Book: A book listing every possible brain state and the correct subsequent state for every possible input. An external arm turns the pages based on sensor input.
  *   **Intercept Misconception 1:** *"Functional isomorphism entails phenomenal identity."*
      *   **Student Reaction:** "If the book produces the exact same outputs as Einstein for every input, it *is* Einstein. Functionalism demands it."
      *   **Intervention:** Pause the inference. Introduce the distinction between **Simulation vs. Instantiation**.
      *   **Defusing Distinction:** Ask: "Does a perfect weather simulation inside a computer get wet?" Highlight that matching the *description* of a process (the book's map) is not the same as *undergoing* the process (the brain's dynamics). Force them to articulate why the map might differ from the territory despite perfect predictive fidelity.

  **20:00 – 30:00 | Substrate & Misconception 2**
  Shift the debate to the material.
  *   **Intercept Misconception 2:** *"The substrate (paper versus neurons) is decisive."*
      *   **Student Reaction:** "It can't be conscious because paper is dead/inert. Neurons are alive."
      *   **Intervention:** Remind them of the opening dependency (Multiple Realizability). If they argue substrate matters here, they must abandon functionalism entirely.
      *   **Defusing Distinction:** Introduce **Implementation Independence**. Ask: "If we printed the book on neural tissue instead of wood-pulp paper, would that change the logic?" Push them to see that rejecting the book because it is *paper* is a biological bias, not a functional argument. The problem must be structural, not material.

  **30:00 – 40:00 | Searle & Misconception 3**
  Connect to prior knowledge.
  *   **Intercept Misconception 3:** *"This collapses into the Chinese Room."*
      *   **Student Reaction:** "Searle already proved this. Syntax isn't semantics. It's the same argument."
      *   **Intervention:** Differentiate the mechanism of failure.
      *   **Defusing Distinction:** Distinguish **Syntax Manipulation (Searle) vs. State Storage (Book)**. In the Chinese Room, the man *processes* symbols (active computation); in the Book scenario, there is *no processing*, only retrieval. The Chinese Room argues that symbol manipulation isn't enough for understanding; the Book argues that *stored dispositions* aren't enough for existence. This is a stronger claim: it challenges whether a "mind" can exist without *internal* causal transitions.

  **40:00 – 45:00 | Synthesis**
  Allow open debate. Guide them toward the tension: If the book behaves exactly like Einstein, but lacks internal causal glue, is it a zombie or a mind? Do not resolve it; let the tension sit.

  **45:00 – 50:00 | Closing Check**
  **The Test:** Present this modification: *"We scan the entire Book into a hard drive. The file contains all the pages and the lookup rules. The computer is turned off, sitting on a desk."*
  **Question:** "Does the mind exist in the off computer?"
  *   **Pass Condition:** Students answer **No**, citing the lack of **Causal Integration** (the states are not actively transitioning).
  *   **Fail Condition:** Students answer **Yes**, citing **Representational Completeness** (all the information is there).
  *   **Goal:** This confirms they understand that having the *capacity* for the right states (representation) is distinct from the *activity* of moving between them (causation).

  ### Bracketed Problem
  **The Hard Problem of Consciousness (Qualia).**
  You must explicitly bracket the question of *"what it feels like"* to be the book.
  **Protection of Dependency Chain:** If students focus on qualia ("But does the book *feel* pain?"), the discussion shifts to the explanatory gap, which cannot be solved by functional analysis. By bracketing qualia, you restrict the session to **Cognitive Architecture** (access consciousness vs. phenomenal consciousness). This protects the functionalist dependency chain, allowing students to analyze the *mechanism* of the book without hitting the wall of subjective experience, which would render the functional/isomorphism debate moot.
