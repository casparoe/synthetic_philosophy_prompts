answer: |-
  First off, huge congratulations on tackling McTaggart. That 1908 paper ("The Unreality of Time") is legendary, but it is dense, and your confusion is actually a sign that you're understanding it correctly.

  You have hit on the exact point where almost all modern philosophers and physicists disagree with McTaggart. Your intuition—that we should just drop the A-series and keep the B-series—is the foundation of what is now called the **B-Theory of Time**.

  However, to understand why McTaggart thinks time collapses entirely, we have to look at a hidden assumption he makes that you (and most people today) might not share.

  Here is the walkthrough of why he thinks the B-series can't stand alone, and how this connects to the Presentism/Eternalism debate.

  ### 1. McTaggart's Hidden Premise: Time *Is* Change
  The key to unlocking McTaggart's argument is realizing that he defines **Time** essentially as **Change**.

  For McTaggart, if nothing changes, time does not exist. Think about a frozen universe where every atom is locked in place forever. There might be a sequence of "positions" in space, but would there be *time*? McTaggart says no.

  Now, look at the two series through that lens:

  *   **The B-Series (Earlier/Later):** As you noted, these relations are permanent. If the year 1900 is earlier than 2024, it is *always* earlier. It was earlier a million years ago, and it will be earlier a million years from now. The relationship never changes.
  *   **The A-Series (Past/Present/Future):** These relations change. The year 2050 is currently *future*. In 30 years, it will be *present*. In 100 years, it will be *past*. The event itself doesn't change, but its *temporal property* changes.

  **McTaggart's Argument:**
  1.  Time requires change.
  2.  The B-series contains no change (the relations are static).
  3.  Therefore, the B-series alone cannot constitute time.
  4.  Only the A-series provides change (events "flow" from future to past).
  5.  Therefore, the A-series is essential for time to exist.
  6.  *But* (and here is his famous twist), the A-series is logically contradictory (because every event has to be Past, Present, and Future, which are incompatible properties).
  7.  **Conclusion:** Since Time needs the A-series, and the A-series is impossible, Time is unreal.

  ### 2. Why can't the B-Series stand on its own?
  You asked: *"Why does the A-series being broken drag the whole thing down with it? ... Why not just drop the A-series and keep the B-series?"*

  For McTaggart, a B-series without an A-series is just a static list. It's like a map. On a map, New York is north of Washington D.C. That is a permanent, unchanging fact. But the map doesn't *move*. Nothing *happens* on a map.

  McTaggart argues that if you strip away the "flow" (the A-series), you aren't left with "time without a present"; you are left with **a dimension of space.**

  If 1900 is just "earlier than" 2024, in the same way that London is "west of" Berlin, then the past and future exist just as solidly as the present. There is no "moving now." For McTaggart, without that moving "now," there is no passage of time, and without passage, there is no time. He thinks the B-series is just a spatialized imitation of time, not the real thing.

  ### 3. The Modern Pushback (Where you fit in)
  This is where your intuition is actually aligned with the majority of 20th and 21st-century philosophy (and Einstein's physics).

  Most modern philosophers look at McTaggart's argument and say: **"We accept premises 6 and 7, but we reject premise 1."**

  They argue: **Time does *not* require the A-series.**

  This view is called the **B-Theory of Time** (or Eternalism). B-Theorists argue that "change" doesn't mean an event changing its status from future to past. Instead, "change" just means that different things are true at different coordinates in the B-series.
  *   At time $t_1$, the dinosaur is alive.
  *   At time $t_2$, the dinosaur is dead.
  *   That is change. You don't need a magical "moving present" to make that real.

  So, to answer your question: **McTaggart thinks the B-series drags time down because he believes the B-series is dependent on the A-series to give it direction and flow.** But modern thinkers say, "No, the B-series is enough. The 'flow' is just an illusion of human consciousness."

  ### 4. Connecting to Presentism vs. Eternalism
  You mentioned reading about these two concepts. Here is how they map onto McTaggart's series:

  **Presentism (A-Theory leaning):**
  *   **View:** Only the **Present** exists. The past is gone; the future hasn't happened.
  *   **Connection:** This relies heavily on the **A-Series**. It requires a distinguished "now" that moves.
  *   **Problem:** It struggles with Relativity (Einstein showed that "now" is relative to the observer, not universal).
  *   **McTaggart's take:** He would say Presentism captures the *essence* of time (the A-series), but because the A-series is contradictory, Presentism is describing something impossible.

  **Eternalism (B-Theory leaning):**
  *   **View:** The Past, Present, and Future all **equally exist**. Time is like a block of ice (the "Block Universe"). You are a "worm" stretching through that block from birth to death.
  *   **Connection:** This relies on the **B-Series**. "Earlier" and "Later" are just coordinates, like "Left" and "Right."
  *   **Problem:** It feels counter-intuitive. Why does the future *feel* open if it already exists?
  *   **McTaggart's take:** He would say Eternalism describes the B-series accurately, but because it lacks the A-series (the change), it isn't truly describing *Time*, just a static arrangement of events.

  ### Summary
  You are stuck because you are intuitively a **B-Theorist** living in a world where McTaggart is arguing as an **A-Theorist**.

  *   **You think:** Time is the structure of events (B-series). The "flow" is just how we experience it.
  *   **McTaggart thinks:** Time *is* the flow (A-series). Without the flow, it's just space. Since the flow is logically impossible, time is an illusion.

  If you want to pursue this further, look up the **"B-Theory of Time"** or **"Eternalism."** You'll find that many philosophers (like J.J.C. Smart and D.H. Mellor) basically took your exact stance: "McTaggart proved the A-series is nonsense, so let's throw it out and keep the B-series. Time is still real."

  You haven't misunderstood the text; you've just identified the exact premise that later philosophers attacked to save the reality of time.
