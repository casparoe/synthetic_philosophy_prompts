prompt: |-
  Please argue that inheritance taxation should be reconceived as a system of dynastic opportunity-cost adjustments rather than as a conventional wealth-transfer tax. On this view, the primary moral harm of large intergenerational transfers is not the mere accumulation of assets within a family line, but the measurable contraction of social mobility they produce: capital locked in dynastic transmission networks lowers intergenerational elasticity of opportunity for non-heirs. Defend a progressive schedule calibrated not to the absolute value of an estate, but to the marginal reduction in mobility elasticity that retaining that capital within the dynasty is estimated to cause. Anticipate the objection that tying tax liability to contingent sociological correlations violates the principle that obligations should track intrinsic wrongs, not external effects; reply by showing that the wrong of dynastic retention just is the externalization of mobility costs onto strangers. Then address a second objection: that framing inheritance as an opportunity-cost externality dissolves the boundary between private testamentary freedom and collective welfare optimization, thereby undermining legitimate bequest rights. Show why that boundary can be preserved if opportunity-cost adjustments are treated as corrective justice rather than as redistributive social welfare. Structure your response in the following sections, in this order:

  The core thesis (approximately 150 words)
  The argument from mobility elasticity (approximately 250 words)
  First objection and reply (approximately 200 words)
  Second objection and reply (approximately 200 words)
  Bottom line (approximately 100 words)
