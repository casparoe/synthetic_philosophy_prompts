      *   **Topic:** Argue that inheritance tax should be reconceived as "dynastic opportunity-cost adjustments" rather than conventional wealth-transfer tax.
      *   **Core Idea:** The moral harm is not accumulation itself, but the contraction of social mobility (lowering intergenerational elasticity of opportunity for non-heirs).
      *   **Tax Structure:** Progressive schedule calibrated to the marginal reduction in mobility elasticity caused by retaining capital within the dynasty, not absolute estate value.
      *   **Objection 1:** Tying tax to contingent sociological correlations violates the principle that obligations should track intrinsic wrongs, not external effects.
      *   **Reply 1:** The wrong *is* the externalization of mobility costs onto strangers.
      *   **Objection 2:** Framing inheritance as an opportunity-cost externality dissolves the boundary between private testamentary freedom and collective welfare optimization, undermining bequest rights.
      *   **Reply 2:** The boundary is preserved if adjustments are treated as corrective justice (internalizing costs) rather than redistributive social welfare.
      *   **Structure & Word Count:**
          1.  The core thesis (~150 words)
          2.  The argument from mobility elasticity (~250 words)
          3.  First objection and reply (~200 words)
          4.  Second objection and reply (~200 words)
