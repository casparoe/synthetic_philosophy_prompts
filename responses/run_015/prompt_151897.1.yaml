      *   **Total Estimated Word Count:** ~900 words.

  2.  **Drafting - Section by Section:**

      *   **Section 1: The core thesis**
          *   *Goal:* Define the shift from wealth-transfer tax to dynastic opportunity-cost adjustment. Focus on mobility contraction vs. accumulation.
          *   *Drafting:* Inheritance taxation is traditionally justified as redistributing unearned wealth or preventing aristocracy. This view is mistaken. Instead, inheritance levies should be reconceived as dynastic opportunity-cost adjustments. The primary moral injury inflicted by large intergenerational transfers is not the mere accumulation of assets within a family line, which may be innocuous in isolation, but the measurable contraction of social mobility they produce. When capital is locked into dynastic transmission networks, it lowers the intergenerational elasticity of opportunity for non-heirs, effectively rigging the competitive landscape. Therefore, tax liability should not track the absolute value of an estate, but rather the marginal reduction in mobility elasticity that retaining that capital within the dynasty is estimated to cause. This shifts the normative focus from punishing wealth to correcting market distortions created by entrenched capital, ensuring that the tax system targets the specific mechanism by which inheritance undermines meritocratic equality rather than penalizing savings or family affection per se.

      *   **Section 2: The argument from mobility elasticity**
          *   *Goal:* Explain how capital retention lowers mobility for others. Connect capital concentration to opportunity hoarding.
          *   *Drafting:* Economic sociology demonstrates that wealth concentration correlates strongly with reduced intergenerational mobility. When significant capital remains within a specific lineage, it creates opportunity hoarding. Heirs access superior education, networks, and safety nets, insulating them from market risks that constrain non-heirs. This insulation alters the structure of opportunity itself. It is not merely that heirs have more; it is that non-heirs have relatively less access to the levers of advancement because key assets—investment capital, property, equity—are removed from general circulation and locked into private dynastic trusts. This increases the intergenerational elasticity of income, meaning a child's economic outcome becomes more dependent on their parents' status. By retaining capital beyond a certain threshold, a dynasty effectively externalizes the cost of reduced competition onto strangers who must navigate a rigged marketplace. Consequently, a progressive schedule calibrated to this elasticity reduction ensures that families pay for the specific social friction their wealth retention generates. The tax becomes a price on the privilege of insulating offspring from market forces, proportional to the damage inflicted on the mobility prospects of the broader citizenry.

      *   **Section 3: First objection and reply**
          *   *Goal:* Objection: Tax based on external effects/correlations violates intrinsic wrong principle. Reply: The wrong *is* the externalization.
          *   *Drafting:* Critics may argue that tying tax liability to contingent sociological correlations violates the principle that obligations should track intrinsic wrongs, not external effects. If inheritance is not inherently unjust, why tax it based on downstream mobility stats? This objection misunderstands the nature of the harm. The wrong of dynastic retention just is the externalization of mobility costs onto strangers. Just as a factory owner is liable for pollution not because production is intrinsically evil, but because waste harms neighbors, dynasts are liable because their capital lockdown harms non-heirs. The "intrinsic" act of bequeathing becomes wrongful only when it crosses the threshold where it imposes negative externalities on the opportunity structure of others. Therefore, tracking the external effect is not arbitrary; it is the only way to measure the specific moral injury being inflicted. The tax is not punishing the transfer itself, but the unpriced cost imposed on the social fabric by removing capital from the competitive sphere.

      *   **Section 4: Second objection and reply**
          *   *Goal:* Objection: Dissolves boundary between private freedom and collective welfare. Reply: Corrective justice vs. redistributive welfare.
          *   *Drafting:* A second objection posits that framing inheritance as an opportunity-cost externality dissolves the boundary between private testamentary freedom and collective welfare optimization, thereby undermining legitimate bequest rights. If every bequest is weighed against social mobility, private choice seems subordinate to state planning. However, that boundary can be preserved if opportunity-cost adjustments are treated as corrective justice rather than as redistributive social welfare. Corrective justice requires agents to internalize the costs they impose on others, whereas redistributive welfare seeks to engineer equal outcomes regardless of fault. By framing the tax as a fee for using the common opportunity structure to secure private advantage, we respect the right to bequeath while demanding accountability for the systemic drag created. Families remain free to transfer wealth, provided they compensate society for the mobility friction caused. This maintains testamentary freedom as a default right, subject only to the constraint that one's liberty cannot infringe upon the equal opportunity of others, preserving the liberal distinction between private agency and public engineering.

      *   **Section 5: Bottom line**
          *   *Goal:* Summarize the main point.
          *   *Drafting:* Reconceiving inheritance tax as a dynastic opportunity-cost adjustment reframes the levy from a penalty on wealth to a price on privilege. It targets the specific mechanism—reduced social mobility—by which entrenched capital harms non-heirs. By calibrating taxes to elasticity reductions and framing them as corrective justice, we protect testamentary freedom while ensuring families internalize the social costs of dynastic insulation. This approach offers a morally robust, economically precise justification for inheritance taxation.

