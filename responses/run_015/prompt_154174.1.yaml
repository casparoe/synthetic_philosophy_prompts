answer: |-
  Here are 8 interview questions designed to press the evaluativist view, complete with the likely answer she'll give and a follow-up designed to close off escape routes.

  ### 1. The Explanatory Stakes
  **Question:** "Let's start with the motivation for the view. Separatism—the idea that pain is a neutral sensation plus a separate attitude of dislike—seems to fit the folk psychology of pain very well. You're arguing that the badness is intrinsic to the phenomenal character. What is the specific explanatory work that evaluativism does that separatism *can't*? Why pay the price of complicating the phenomenology?"

  **Likely Answer:** She will likely say that separatism fails to explain the *intimacy* of pain. If badness were separate, you could have the sensation without the suffering (like asymbolia) easily, but in normal cases, the badness feels inseparable from the sensation. Evaluativism explains why pain *motivates* us immediately without needing an extra desire.
  **Follow-up:** "If the motivation is immediate and intrinsic, though, doesn't that make normal pain sufferers somewhat irrational when they *don't* act to stop it? If the experience itself commands 'fix this,' but I sit through it to finish a thesis, is my experience lying to me, or am I irrational?"

  ### 2. Asymbolia: The Phenomenological Distinction
  **Question:** "Let's move to pain asymbolia. These patients report feeling the sensation, locating it, and rating intensity, but they say it doesn't bother them. The standard evaluativist reply is that they still experience the body as being in a 'bad way,' they just don't *mind* it. In plain terms: what is the phenomenological difference between 'experiencing-as-bad' and 'minding'? If I can't feel the difference, what kind of experience is this 'badness'?"

  **Likely Answer:** She will likely distinguish between *representational content* (the experience says 'damage here') and *conative force* (the desire to stop it). She'll say asymbolics have the content but lack the force.
  **Follow-up:** "If the 'force' is what drives the suffering, and the asymbolic lacks the force, then the 'badness' left in the experience is just a cold representation of damage. But that sounds exactly like the neutral sensation the separatist talks about. Haven't you just relocated the separatist's 'neutral sensation' and called it 'evaluative content'?"

  ### 3. Asymbolia: Reasons for Action
  **Question:** "Consider the asymbolic patient in the clinic. Do they have a *reason* to take an analgesic? If the experience presents their body as damaged, surely that's a reason to repair it. But if they have a reason, why don't they act? And if they don't have a reason, in what sense is the experience still presenting the body as 'bad'?"

  **Likely Answer:** She will likely say they *do* have a reason (the damage is real), but their motivational system is broken. The reason exists objectively in the content, but the bridge to action is severed.
  **Follow-up:** "If the reason exists but fails to motivate, then the 'badness' of the pain isn't doing the normative work. It seems the 'badness' is just a label on the damage. If the label doesn't compel action, why isn't the *damage itself* the reason, rendering the pain's evaluative character redundant?"

  ### 4. The "Desire" Objection
  **Question:** "A critic might say: 'If we need to appeal to a broken desire or a lack of concern to explain why the asymbolic doesn't take the pill, then the desire was doing the work all along.' If the presence of 'badness' in the experience doesn't guarantee a reason to act without a background desire to be healthy, hasn't the badness been sidelined? What work is left for the *phenomenal* badness to do?"

  **Likely Answer:** She will likely argue that the desire to be healthy is background and universal, so we don't need to state it. The pain *specifies* the reason (this damage here), while the desire provides the general drive.
  **Follow-up:** "But in asymbolia, that general drive seems intact—they avoid other harms, they just don't care about *this* pain. If the general drive is intact but the pain doesn't trigger it, doesn't that prove the pain itself lacked the normative 'oomph'? It looks like the 'badness' was bolted on after all, and the bolt just came loose."

  ### 5. Indifference Therapy: Treatment or Apathy?
  **Question:** "I want to propose a thought experiment: 'Indifference Therapy.' A drug induces temporary asymbolia. Sensory location and intensity are intact, but you stop caring. Is a patient on this drug genuinely *treating their pain*, or have they just taken a drug that makes them not mind being hurt? Is this clinically distinct from an analgesic?"

  **Likely Answer:** She will likely say it is *not* analgesia in the strict sense because the pain experience (with its badness) remains, but it is a valid *therapy* because it removes the suffering component.
  **Follow-up:** "If the therapy leaves the 'pain' (the evaluative experience) intact but removes the suffering, then the suffering must be distinct from the pain. But evaluativism says the badness *is* the pain. If you can cure the suffering without curing the pain, haven't you just admitted they are separable existences?"

  ### 6. Indifference Therapy: The Childbirth Case
  **Question:** "Let's make it harder. Is it rational to take Indifference Therapy before childbirth? The pain is intense, but the outcome is meaningful. If the pain's badness is an intrinsic representation that my body is in a 'bad way,' but I know the process is healthy and good, should I silence that signal? Or does taking the drug involve ignoring a truth?"

  **Likely Answer:** She will likely say it is rational, because the pain's evaluation is generic ('tissue stress') and doesn't capture the contextual value ('healthy birth'). We can override the generic signal with higher-order knowledge.
  **Follow-up:** "If higher-order knowledge can override the pain's evaluation, then the pain's evaluation isn't authoritative. If it's not authoritative, why does it feel so compelling in normal cases? Are we normally just irrational for minding pain when we shouldn't?"

  ### 7. Indifference Therapy: Accuracy and Truth
  **Question:** "This leads to the question of accuracy. If I take Indifference Therapy during childbirth, and I feel the sensation but no badness, was the original pain *wrong* to present my body as being in a bad way? Does the drug correct a false evaluation, or does it just chemically induce apathy toward a true one?"

  **Likely Answer:** She will likely say the original pain was *not* wrong; the tissue stress is objectively bad in a biological sense, even if contextually acceptable. The drug doesn't fix the truth value; it severs the link to concern.
  **Follow-up:** "So the pain represents 'biological bad,' but I represent 'contextual good.' If the two can come apart, then the 'badness' in the pain isn't the whole story of value. If the pain's value claim is partial and can be trumped, is it really an *evaluation* in the full sense, or just a biological alarm signal that we've learned to interpret as value?"

  ### 8. Falsification Conditions
  **Question:** "To close: Philosophy of mind often struggles with falsification. What would count as evidence against evaluativism for you? Is there a specific neurological finding—say, dissociating the 'affective' pain matrix from the 'sensory' matrix completely—or a specific type of first-person report that would make you drop the view?"

  **Likely Answer:** She will likely say that if we found a patient who had the full sensory and affective profile of pain but *denied* it was unpleasant in any way (not just 'not minding' but 'this is good'), that would be a problem. Or, if neuroimaging showed the 'badness' correlates to a separate module added *after* sensation.
  **Follow-up:** "But asymbolics already deny it's unpleasant, and you say they still have the badness. If a patient says 'This is good' and you say 'No, you're experiencing badness, you're just reporting it wrong,' are you making the view unfalsifiable? At what point do you trust the subject's report over the theory's requirements?"
