      *   **Press Williams's Deeper Point:** The objection isn't just about "one thought too many" in the moment. It's about the *retrospective justification* and the *conditional nature* of the commitment. If the utility calculus says "sacrifice your brother," the sophisticated utilitarian *must* agree that is the right thing to do, even if they hope they never face that choice.
      *   **The "Grounding" Objection:** Ask Sam: "If the utility monster demands you betray your deepest project, does your utilitarianism say you *should* (even if you psychologically can't)?" If yes, integrity is contingent on utility. That's Williams's point.
      *   **Reframing the Debate:** Move from "What should I think about?" to "What makes my projects valuable?" For Williams, they are valuable *because* they are mine. For Utilitarianism, they are valuable *because* they produce good states of affairs.

