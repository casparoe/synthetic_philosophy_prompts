answer: |-
  This is a classic philosophical stalemate, and your hypothesis is incredibly sharp. You have correctly identified the structural fault line in the debate, but I think there is a third layer you need to add to fully diagnose why you're stuck.

  Here is the diagnosis: **You are talking past each other on the level of theory architecture, but you have a substantive disagreement on the level of normative grounding.**

  Sam is defending **Indirect (or Sophisticated) Utilitarianism**. You are attacking the **Phenomenology of Agency** required by Consequentialism.

  Here is the breakdown of why the impasse is happening, why Sam's defense is technically standard but philosophically vulnerable, and how you can force the question to move past the verbal standoff.

  ### 1. The Diagnosis: Three Layers of Disagreement

  You identified two layers (Criterion vs. Motivation), but there is a third (Grounding).

  *   **Layer 1: Criterion of Rightness (Sam's Turf).**
      *   *Question:* What makes an act right?
      *   *Sam's Answer:* Maximizing utility.
      *   *Status:* Sam is technically correct here. Standard utilitarianism (e.g., J.J.C. Smart, R.M. Hare) explicitly distinguishes the *criterion* of rightness from the *decision procedure*. Sam is arguing that Utilitarianism is a theory of evaluation, not a psychological manual.
  *   **Layer 2: Decision Procedure (The Compromise).**
      *   *Question:* How should an agent decide what to do?
      *   *Sam's Answer:* Follow your instincts/commitments (because that tracks utility best).
      *   *Your Objection:* This is "smuggled integrity."
      *   *Status:* This is where you are stuck. Sam says this saves Utilitarianism. You say this abandons it.
  *   **Layer 3: Normative Grounding (Williams's Real Target).**
      *   *Question:* *Why* are my commitments valid?
      *   *Sam's Answer:* They are valid *insofar as* following them produces good outcomes.
      *   *Your/Williams's Answer:* They are valid *because* they are mine (identity-constituting).
      *   *Status:* **This is the substantive disagreement.**

  ### 2. Why Sam's "Sophisticated" Defense Doesn't Escape Williams

  Sam is essentially arguing for what Peter Railton calls "Sophisticated Consequentialism." Railton argues an agent can have non-consequentialist dispositions (like deep love for a brother) while being a consequentialist in theory.

  However, Williams's integrity objection is deeper than "one thought too many" in the moment of decision. It is about the **conditional nature of the commitment.**

  If Sam is a sophisticated utilitarian, they follow their commitment to their brother *only because* having that commitment generally maximizes utility. This means the commitment is held **provisionally**.

  **The Trap for Sam:**
  If a situation arises where betraying the brother *actually* maximizes utility (e.g., the classic "torture the brother to save the world" scenario), the sophisticated utilitarian must admit:
  1.  The right thing to do is betray the brother.
  2.  Their commitment to the brother was only valuable instrumentally.

  Williams's point is that **integrity requires that some commitments are not tradable.** If your commitment to your brother is contingent on the utility calculus (even a hidden, long-term one), you are alienated from that commitment. You are not truly a brother; you are a utility-manager playing the role of a brother.

  ### 3. How to Break the Stalemate

  You need to stop arguing about what the agent *thinks* in the moment (Sam will always win there by saying "they don't think about utility") and start arguing about the **retrospective justification** and the **conditions of validity.**

  Here are three specific moves to force the question:

  #### Move A: The "Regret" Test
  Ask Sam: "In the scenario where the utilitarian calculus demands I sacrifice my deepest project, does your theory say I should feel *regret* that I followed the calculus, or regret that the situation existed?"
  *   **Williams:** A person of integrity feels a specific kind of agent-regret that their *own* action violated their core self, even if it was 'right'.
  *   **Sam:** If Sam says the agent should feel no moral regret because they did the 'right' thing, they concede the integrity point. The agent is merely a vessel for the good.

  #### Move B: The "Grounding" Challenge
  Tell Sam: "You say the decision procedure is 'follow your commitments.' I agree that's a good procedure. But **what makes that procedure correct?**"
  *   If Sam says, "Because it maximizes utility," then you say: "Then my commitment to my brother is only valuable *because* it maximizes utility. If I discover tomorrow that hating my brother maximizes utility, does my commitment lose its normative force?"
  *   If Sam says "Yes," you win (Williams's point: commitments are contingent).
  *   If Sam says "No," they have ceased to be a utilitarian (they have admitted non-consequentialist value).

  #### Move C: The "Trench Coat" Verification
  You hypothesized that Sam's view is "smuggled-in integrity values wearing a consequentialist trench coat."
  *   **Concede this point to Sam, then twist it.**
  *   Say: "Okay, I agree. Your version of utilitarianism *does* require us to adopt non-utilitarian motivations to work. But Williams's point is that **a theory that requires us to ignore its own central insight to function is self-effacing.** If the truth of utilitarianism requires us to *not believe* utilitarianism to act correctly, in what sense is it a viable moral theory for agents?"
  *   This shifts the debate from "Is this utilitarianism?" to "Is this a livable moral theory?"

  ### 4. Is the Debate Mis-posed?

  To answer your final question: **No, the debate is not mis-posed, but the term 'Utilitarianism' is doing too much work.**

  You are debating **Moral Ontology** (what makes things good) vs. **Moral Psychology** (how humans should live).
  *   Sam is defending Utilitarianism as a **Moral Ontology**. (The Good is utility).
  *   You are attacking Utilitarianism as a **Moral Psychology**. (The Agent is a utility maximizer).

  **Progress looks like this:**
  Get Sam to admit that **Indirect Utilitarianism saves the theory's extension (the outcomes) but sacrifices its aspirational force (the agent's relationship to the good).**

  If Sam admits that the utilitarian agent must view their own integrity as *contingently valuable*, you have won the Williams objection, even if Sam keeps the label "Utilitarian." Williams doesn't care if you keep the label; he cares that the *structure of agency* required by the theory is alienating.

  **Summary for your next talk with Sam:**
  "Don't tell me what the agent *thinks* in the moment. Tell me what justifies the agent's *dispositions*. If the justification is 'it works best,' then my integrity is a tool, not a truth. And if my integrity is a tool, I am alienated from it. That is Williams's point, and no amount of 'decision procedure' distinction fixes the grounding problem."
