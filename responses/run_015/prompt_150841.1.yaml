answer: |-
  This is a precise dissection of a rhetorical shield that deserves to be taken apart. Your interviewee is attempting to weaponize a heuristic (ECREE) to invert the burden of proof, relying on the ambiguity of "extraordinary" to create a false symmetry between a novel positive claim and a null replication.

  Here is the menu of interpretations, evaluated for coherence, defensibility, and whether they license the symmetric usage your interviewee attempted.

  ### The Menu of Interpretations

  I have organized these according to your taxonomy (Prior, Loss, Dialectical, Field-Level), breaking down the specific combination of "Extraordinary Claim" and "Require Evidence" implied in each.

  #### 1. The Bayesian Prior Reading
  *   **Definition:** "Extraordinary" = Low prior probability based on background theory. "Require" = A higher likelihood ratio (stronger data) to shift the posterior probability to acceptance.
  *   **Verdict:** **Substantive and Coherent.** This is the mathematically correct translation of the slogan. If a claim contradicts established physics or biology, the prior $P(H)$ is tiny. To make $P(H|D)$ high, the likelihood ratio $P(D|H)/P(D|\neg H)$ must be massive.
  *   **Licenses Interviewee?** **No.** This reading is inherently **asymmetric**. In the replication crisis context, the "implausible mechanism" means the prior for the *positive* effect is low. The prior for the *null* (no effect) is correspondingly high (it is the baseline). Therefore, claiming the effect *does not* exist is the ordinary claim, requiring ordinary evidence. For the interviewee's symmetry to hold, the prior probability of their effect would have to be near 1.0 already, which contradicts the "implausible mechanism" premise of your feature.

  #### 2. The Sociological/Paradigm Reading
  *   **Definition:** "Extraordinary" = Contradicts current field consensus (orthodoxy). "Require" = Dialectical burden of proof (the challenger must provide more proof than the defender).
  *   **Verdict:** **Defensible but Conservative.** This is a Kuhnian norm. Science protects its core commitments from being overturned by noisy data. It prevents constant paradigm shifts based on statistical fluctuations.
  *   **Licenses Interviewee?** **No.** This also fails the symmetry test. The "claim that the effect doesn't exist" is usually a defense of the status quo (the null hypothesis), not a challenge to it. The interviewee is the paradigm-challenger; the replicators are the defenders of the baseline. To use this symmetrically, the interviewee would have to argue that their original finding had *already* become the new orthodoxy. Given the "later preregistered multi-lab replication" context, the field has clearly *not* accepted the finding as orthodoxy.

  #### 3. The Decision-Theoretic (Loss) Reading
  *   **Definition:** "Extraordinary" = High stakes/consequences if acted upon. "Require" = A stricter error threshold (lower $\alpha$) to minimize expected loss.
  *   **Verdict:** **Substantive.** This treats hypothesis testing as a decision problem. If a claim leads to expensive policy changes or medical treatments, we demand lower false-positive rates.
  *   **Licenses Interviewee?** **Only conditionally.** This is the only reading where symmetry is *theoretically* possible, but it requires the costs of Type I and Type II errors to be symmetric.
      *   *Scenario:* If accepting a fake effect is costly (wasted grants), but rejecting a real effect is equally costly (missing a cure), then both claims need high evidence.
      *   *Reality:* In basic science (implied by "implausible mechanism"), the cost of cluttering the literature with false positives is generally judged higher than the cost of temporarily missing a fragile true positive. Thus, the burden remains asymmetric. The interviewee would need to demonstrate that concluding their effect is false causes specific, extraordinary harm equivalent to the harm of believing it is true.

  #### 4. The Field-Level Error Budget Reading
  *   **Definition:** "Extraordinary" = A claim that consumes a disproportionate share of the literature's false-discovery rate (FDR) budget. "Require" = Evidence that does not inflate the field's overall $\alpha$.
  *   **Verdict:** **Real and Robust.** This is the Ioannidis/Leek interpretation. A field has a limited capacity to tolerate false positives before its credibility collapses. "Extraordinary" claims are those that, if false, damage the field's reliability significantly.
  *   **Licenses Interviewee?** **No.** The error budget is spent on *positive* discoveries. A null result does not add to the false-discovery rate of the literature; it subtracts from the uncertainty. A replication failure is a correction, not a new claim that consumes budget. Treating a null result as a budget-consuming claim misunderstands the accounting of meta-science.

  ---

  ### Technical Specifics

  **1. Is any reading genuinely symmetric?**
  No. In the context of hypothesis testing, the null hypothesis ($H_0$) is structurally distinct from the alternative ($H_1$). $H_0$ is typically the "no effect" or "status quo" position.
  *   To claim $H_1$ (Effect exists) is to add structure to the world; it requires energy/evidence.
  *   To claim $H_0$ (Effect does not exist) is to remove structure; it is the default.
  *   *Caveat:* Proving a null *strictly* (equivalence testing) does require data, but it does not require "extraordinary" evidence in the ECREE sense. It requires *sufficient* precision to rule out meaningful effect sizes. The interviewee is conflating "proving the null requires data" (true) with "proving the null is an extraordinary claim" (false).

  **2. Is the Bayesian reading coherent, or does it collapse?**
  The slogan is a **heuristic description of Bayes' Theorem**, not a separate rule.
  *   *Coherence:* It is coherent as a shorthand for "Low Prior requires High Likelihood Ratio."
  *   *Collapse:* It collapses as a justification for the interviewee's move because the priors are not symmetric. The slogan implies $Evidence \propto 1/Prior$. Since $Prior(Effect) \ll Prior(No Effect)$, the evidence required for the Effect must be $\gg$ evidence required for No Effect. The interviewee is trying to use the slogan to argue $Prior(Effect) \approx Prior(No Effect)$, which contradicts the "implausible mechanism" premise.

  **3. Is it expressible in a strict error-rate (frequentist) framework?**
  It is **inexpressible** in standard NHST (Null Hypothesis Significance Testing).
  *   Standard NHST sets a fixed $\alpha$ (e.g., 0.05) regardless of the claim's plausibility.
  *   To make ECREE work in frequentism, you must adopt **variable thresholds** (e.g., Benjamin et al.'s proposal to move $\alpha$ to 0.005 for novel claims).
  *   Even then, the slogan survives only as a claim about the **literature's false-discovery budget** (Reading 4). It cannot apply to a single hypothesis in isolation without referencing the base rate of true hypotheses in that field.

  **4. Is the "Field-Level Error Budget" a real reading?**
  Yes. It is the most methodologically sound interpretation of the slogan in modern meta-science. It reframes ECREE from a rule about *truth* to a rule about *reliability management*. However, it explicitly forbids the interviewee's move: corrections (replications) are the mechanism by which the budget is balanced, not claims that spend it.

  ---

  ### The Verdict for Your Feature

  Your interviewee's move fails because it treats the *status of the claim* as symmetric, when the *epistemic position* is asymmetric. They are treating "Effect exists" and "Effect does not exist" as two competing positive theories. In reality, "Effect does not exist" is the restoration of the baseline.

  **Does the taxonomy miss anything?**
  It misses the **Measurement Validity** reading. Sometimes "Extraordinary Evidence" means "Evidence that rules out artifacts." If a claim is extraordinary, it is more likely to be an artifact. Therefore, "Require" means "Evidence that explicitly measures and rules out confounds." This is substantive, but again, it applies more heavily to the positive claim (which must rule out artifacts) than the null (which is consistent with artifacts).

  ### The One-Sentence Replacement

  If nothing in the menu survives the interviewee's symmetric usage, here is the precise sentence you can print to replace the vagueness:

  > "The principle that 'extraordinary claims require extraordinary evidence' is a Bayesian shorthand for managing false positives in a field, not a symmetric rule that treats the restoration of the null hypothesis as equally implausible as the discovery of a new effect."

  Or, if you need to be sharper about the interviewee's specific error:

  > "Invoking 'extraordinary claims' to defend a failed replication is a category error: the slogan governs the burden of proof for adding structure to our model of the world, not for failing to find it."
