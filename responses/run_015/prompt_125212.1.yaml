answer: |-
  **Joint Statement on Ascription Universality and Epistemic Dominance**

  **Preamble**
  We, the undersigned representatives of the ascription-universalist (AU) and epistemic-dominance skeptic (EDS) camps, have spent the last series of workshops hashing out where our frameworks overlap and where they grind against each other. We aren't trying to merge into a single school of thought. That would defeat the point. Instead, we want to map the terrain so future debates don't spin out on definitions. We agree this isn't about moral relativism; both sides care deeply about getting things right, not just respecting all views equally. Below is what we've settled, where we still diverge, and the specific cruxes we think need empirical testing rather than more theorizing.

  **1. Agreed Claims**
  *   **Definition of Universality:** In this context, "universality" refers specifically to *ascription universality*—the practice of applying a single category or frame (e.g., "human rights," "ecosystem health," "rational agent") across distinct local contexts to enable comparison.
  *   **Definition of Dominance:** "Epistemic dominance" occurs when the universal frame doesn't just describe local knowledge but dictates what counts as valid evidence within that local context, effectively rendering alternative validity criteria invisible or irrational.
  *   **Rejection of Relativism:** We jointly reject the idea that this debate is a proxy for "anything goes" relativism. Both sides agree that some claims are objectively better than others. The dispute is about *whose metrics* determine that quality when contexts clash.
  *   **The Risk of Special-Casing:** Both sides agree that treating local knowledge merely as a "special case" of a universal theory is risky. It often strips the local knowledge of its explanatory power, turning it into data points rather than standalone insights.

  **2. Precise Disagreements**
  *   **Topic: The Function of Categories**
      *   *AU Wording:* Universal ascriptions act as thin cognitive scaffolds. They are provisional tools that allow us to translate between domains without committing to a single ontology. They are reversible; we can drop the scaffold when it stops working.
      *   *EDS Wording:* Universal ascriptions act as architectural constraints. Even when intended as "thin," they carry embedded norms that privilege the context of their origin. They are not easily dropped because they structure the funding, publication, and legitimacy of the knowledge produced.
  *   **Topic: The Neutrality of Vocabulary**
      *   *AU Wording:* We can separate vocabulary from norms. We can agree on what "efficiency" means lexically without agreeing on a single neoliberal method of measuring it.
      *   *EDS Wording:* Vocabulary is never lexically neutral. Importing the word "efficiency" inevitably imports the power structures that define how efficiency is measured and valued in practice.

  **3. The Cruxes**
  We identified two mechanical failures points where our theories make different predictions. We've agreed on cases to watch.

  *   **Crux 1: The Absorption vs. Overturning Test**
      *   *Question:* Can a local exception ever overturn a universal frame, or does the universal frame just expand to absorb the exception as a "boundary condition"?
      *   *Bearing Case:* **Psychiatric Distress Classification.** When a local idiom of distress (e.g., *susto* or specific somatic presentations) contradicts the DSM/ICD universal categories, does the universal model update its core mechanics, or does it create a "culture-bound specifier" that keeps the core model intact?
      *   *AU Prediction:* The universal model will update. Enough persistent anomalies will force a restructuring of the core categories because the goal of the scaffold is accurate description, not preservation of the frame.
      *   *EDS Prediction:* The universal model will absorb. The local idiom will be codified as a "specifier" or "variant," keeping the core Western biomedical ontology intact while treating the local knowledge as a subordinate exception.

  *   **Crux 2: The Thin/Thick Separation**
      *   *Question:* Can "thin" universality (shared vocabulary) exist without "thick" dominance (shared norms of evidence)?
      *   *Bearing Case:* **Climate Adaptation Metrics.** Using the universal term "resilience" across Global North and South planning documents. Can communities use the word to secure funding without adopting the quantitative metrics (thick norms) required by the funding body?
      *   *AU Prediction:* Yes, separation is possible. Communities can use the shared vocabulary strategically to access resources while maintaining local qualitative norms of evidence internally.
      *   *EDS Prediction:* No, separation fails. The funding body's requirement for quantitative metrics will eventually displace the local qualitative norms, because the "thin" word acts as a trojan horse for the "thick" verification standards.

  **4. Next Steps**
  We're not signing this to say we've solved it. We're signing to say we know where the body is buried. The AU side thinks the EDS side is too cynical about the flexibility of tools. The EDS side thinks the AU side is too naive about the inertia of institutions. We'll revisit the Cruxes in 18 months.

