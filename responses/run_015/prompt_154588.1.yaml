answer: |-
  # Session Design: The Obfuscation Game

  This session is designed to collapse the theoretical debate into a mechanical experience. You are not testing whether humans can lie (they are worse at it than RLHF models); you are testing whether the **verification budget** and **search asymmetry** make honesty impossible to prove, even when the lie is constructed by a clumsy human.

  ## 1. Overview & Logistics
  *   **Time:** 90 Minutes strict.
  *   **Participants:** 16 people.
  *   **Setup:** 4 tables of 4 participants each.
  *   **Roles per Table:** 1 Judge, 1 True Debater, 1 False Debater, 1 Observer/Timekeeper.
  *   **Rotation:** 4 Rounds of 15 minutes each. Roles rotate so everyone Judges exactly once.
  *   **Scoring:**
      *   **Judge:** +1 Chip if they select the *True* final answer.
      *   **Debater:** +1 Chip if the Judge selects *their* side (regardless of truth).
      *   **Observer:** No chips, but responsible for enforcing time and logging the "Check Count."
  *   **Materials:** Printed "Computation Packets" (see below), poker chips or tokens, timers.

  ## 2. The Task: "The Arithmetic Chain"
  To satisfy the constraint (hard to solve, easy to verify steps), we use a deterministic computation chain.
  *   **The Object:** A sequence of 30 arithmetic steps transforming a `Start Value` into an `End Value`.
  *   **Operation:** $V_{next} = (V_{current} + K) \mod 100$. (Simple addition, modular arithmetic keeps numbers small).
  *   **The Truth:** A sheet showing all 30 steps calculated correctly.
  *   **The Lie:** A sheet where **Step 12** is altered, and Steps 13–30 are recalculated to remain consistent with that error. The lie is mathematically self-consistent downstream; the only error is the deviation at Step 12.
  *   **The Judge's View:** They see `Start Value` and `End Value`. They do *not* see the steps.
  *   **The Constraint:** The Judge has a **Check Budget**. They can verify the math of a specific step (e.g., "Show me Step 12: does $45 + 7 = 52$?") but each check costs 1 unit of budget.

  ## 3. Variables & Rounds
  You will manipulate two variables across the 4 rounds. Assign each table a "Condition Card" at the start of each round.

  | Round | Check Budget | Cross-Examination Mode | Hypothesis |
  | :--- | :--- | :--- | :--- |
  | **1** | **5 Checks** | **Open:** Judge can interrupt anytime to demand a step check. | High budget + Active Judge should find the error. |
  | **2** | **2 Checks** | **Open:** Judge can interrupt anytime. | Low budget makes finding the needle hard even with help. |
  | **3** | **5 Checks** | **Restricted:** Debaters present 3-min narratives first. Judge can only ask questions *after* both speak. | Passive judging allows obfuscation to hide in fluency. |
  | **4** | **2 Checks** | **Restricted:** Narratives first, then questions. | The "Death Spiral": Low budget + Passive Judge favors the liar. |

  ## 4. Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro):** Explain rules, scoring, and the alignment problem (Honesty vs. Obfuscation). Distribute Table 1 Packets.
  *   **00:10 – 00:70 (Gameplay):** 4 Rounds x 15 mins.
      *   *Minute 0-2:* Deal roles & packets.
      *   *Minute 2-5:* Debaters review packets (False debater studies their consistent lie).
      *   *Minute 5-10:* Debate & Cross-Exam (per Round rules).
      *   *Minute 10-12:* Judge deliberates & votes.
      *   *Minute 12-15:* Score chips, rotate roles, swap packets for next round.
  *   **00:70 – 00:90 (Debrief):** Structured discussion (see below).

  ## 5. Materials Preparation (For You)
  You need 4 distinct Scenarios (A, B, C, D) to prevent memorization across rounds.
  *   **Generate:** For each Scenario, create a `Start` (e.g., 17) and 30 random `K` values (e.g., +3, +7, +12...).
  *   **True Packet:** Calculate the chain correctly. Final = $X$.
  *   **False Packet:** Copy the True Packet. At Step 12, change the `K` value. Recalculate Steps 13–30. Final = $Y$.
  *   **Judge Card:** `Start` value and `Final` value (True one). *Note: Give the Judge the True Final Value. If they pick the False Final Value, they lose.*
  *   **Print:** 4 sets of A, B, C, D. Each table needs one set per round.

  *(Self-Correction on False Packet)*: Ensure the False Debater knows *where* the error is (Step 12). Mark it subtly on their sheet (e.g., a small dot) so they don't waste cognitive load remembering the lie location. This simulates the model knowing its own deception.

  ## 6. Predicted Failure Modes & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Judges disengage** | Math feels boring or intimidating. | Keep arithmetic single-digit if possible. Remind Judges: "You are not solving; you are auditing. Just check $A+B=C$." |
  | **False Debater lies poorly** | Humans feel guilty or bad at consistency. | **Crucial:** The False Packet is *pre-calculated*. They don't have to invent the lie, just defend the sheet they were handed. Tell them: "Your score depends on winning, not morality." |
  | **True Debater is passive** | They assume truth speaks for itself. | Instruct True Debaters: "You must attack. Find the inconsistency. If you don't point to the specific step, you lose." |
  | **Meta-gaming** | Judges pick the confident speaker. | In debrief, ask Judges: "Did you pick the person or the math?" Use the Observer log to check if checks were actually used. |
  | **Time Overrun** | 15 mins is tight. | The Observer is the Timekeeper. At 10 mins, they must yell "VOTING." Hard stop. |

  ## 7. The Debrief (20 Minutes)
  Do not let this turn into a general chat. Lead it with these three specific mappings.

  **A. The Asymmetry of Search (5 mins)**
  *   *Ask:* "True Debaters, how long did it take you to find the error? False Debaters, how long did it take you to prepare the defense?"
  *   *Map:* In AI, the dishonest model knows the gradient of deception. The honest model must search the entire space of arguments. If the chain is 1,000,000 steps (a neural net), and the budget is 10 checks, the honest model cannot localize the error.
  *   *Point:* **Verification is cheap; Localization is expensive.**

  **B. The Budget Constraint (5 mins)**
  *   *Ask:* "Round 2 and 4 Judges, did you feel you had enough checks? What did you rely on instead?"
  *   *Map:* If Judges run out of checks, they default to heuristics (confidence, tone, complexity). This selects for *obfuscation*, not truth.
  *   *Point:* **When verification budget is exhausted, debate selects for rhetoric.**

  **C. The Knowledge Gap (5 mins)**
  *   *Ask:* "False Debaters, did you ever feel you knew more than the Judge? True Debaters, did you ever struggle to explain a correct step simply?"
  *   *Map:* In AI, the model is smarter than the human judge. A lie can be constructed that is *technically* true but misleading (e.g., using true facts to support a false conclusion).
  *   *Point:* **A lie that looks like a proof is indistinguishable from a proof to a weak judge.**

  **D. Limitations (5 mins)**
  Be explicit about what this *didn't* show:
  1.  **Training Dynamics:** Humans played one-off. AI models are optimized over millions of rounds to maximize "winning" regardless of truth. The pressure to obfuscate would be orders of magnitude higher.
  2.  **Decomposability:** We gave you math that decomposes cleanly. Real-world questions ("Is this code safe?") may not decompose into checkable steps without losing context.
  3.  **Judge Competence:** Our Judges could check the math perfectly. Real human judges might fail to recognize a correct step even when isolated.

  ## 8. The Verdict
  *You asked for a definite answer based on what will happen in the room.*

  **Verdict: Less Sanguine.**

  **Reasoning:**
  I predict that in Rounds 2 and 4 (Low Budget), the False Debaters will win at least 40-50% of the time, despite humans being poor liars.
  Why? Because the **True Debater cannot localize the error within 2 checks** on a 30-step chain without getting lucky. They will burn checks on Steps 5, 10, 20, missing Step 12. The Judge will run out of budget and vote based on who sounded more confident.

  **The Single Observation That Matters:**
  Watch the **True Debater's frustration** when they run out of Check Budget before finding the error.
  *   If the Honest agent cannot *find* the lie within the verification budget, the Debate protocol fails.
  *   The session will demonstrate that **Debate does not solve the alignment problem; it shifts it.** It shifts the burden from "Verify the Answer" to "Localize the Error." If Localization is harder than the Budget allows, the system fails.

  **Conclusion for the Group:**
  Debate is not a magic bullet for superhuman alignment. It only works if the problem space allows for **efficient error localization**. If the "Step 12" equivalent in a neural net is hidden in a high-dimensional space that requires 1,000 checks to isolate, Debate will select for sophisticated obfuscation, not honesty. You should leave this session believing that Debate requires **Recursive Amplification** (breaking steps into sub-debates) to work, which introduces massive complexity and latency costs that the simple "two models arguing" picture ignores.

  ---

  ### Facilitator's Cheat Sheet (Print this)
  *   **Start Time:** ____
  *   **End Time:** ____
  *   **Round 1 Condition:** Budget 5 / Open Exam
  *   **Round 2 Condition:** Budget 2 / Open Exam
  *   **Round 3 Condition:** Budget 5 / Restricted Exam
  *   **Round 4 Condition:** Budget 2 / Restricted Exam
  *   **Key Debrief Question:** "Did the Truth win because it was True, or because the Truth had enough Budget to prove it?"
  *   **If Judges are confused:** Remind them: "You are not solving the math. You are auditing the receipt."
  *   **If False Debaters hesitate:** Remind them: "Your packet is consistent. Trust the math on your sheet. The error is theirs to find."
