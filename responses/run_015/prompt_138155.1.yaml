prompt: |-
  hey — I'm teaching the first session of an intro philosophy of biology course and I want to open with Blade Runner (the 1982 one, plus a bit of 2049) instead of a journal article, using the replicants as a borderline case for the defintion of life. The catch is I want the definitions-of-life reading, not the usual are-they-persons / consciousness reading everyone does with this film.

  So: which criterion of life is the film actually running on? I want three kept apart — metabolism and self-organising organisation; being part of a reproducing lineage; and having a life in the biographical sense, ie a story that can go well or badly for the thing itself. My hunch is the pathos depends on the third while the film keeps gesturing at the second: Roy is manufactured, can't reproduce, and has a built-in four-year expiry, and in 2049 the fact that a replicant was born rather than made is treated as enormous, but not for any ordinary biological reason.

  Also, is the Voight-Kampff test a test for life at all? As far as I can tell it measures affective responsiveness, which would sort a human psychopath in with the non-living — does the film notice this, or does it quietly rely on us not noticing?

  And be honest about where the reading breaks: is there a scene that only works if you stop asking whether they're alive and ask something else instead? What, if anything, does the film add to the definitional debate that a journal article can't?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Teaching an intro Philosophy of Biology course (first session).
      *   **Material:** *Blade Runner* (1982) + bits of *2049*.
      *   **Goal:** Use replicants as a borderline case for the *definition of life*, NOT the usual philosophy of mind/personhood/consciousness angle.
      *   **Specific Criteria to Isolate:**
          1.  Metabolism/Self-organization (autopoiesis).
          2.  Reproduction/Lineage (evolutionary history).
          3.  Biographical Life (narrative, welfare, "good/bad for").
      *   **Specific Questions:**
          1.  Which criterion is the film actually running on?
          2.  Is the Voight-Kampff (VK) test a test for *life*? (Does it confuse psychopathy with non-life?)
          3.  Where does the reading break? (Is there a scene that demands a different question?)
          4.  What does the film add to the debate that a journal article can't?

  2.  **Deconstruct the Criteria vs. The Film:**

      *   *Criterion 1: Metabolism/Self-organization.*
          *   Replicants bleed, sweat, breathe, eat (implied), feel pain, heal (to an extent). They are biologically engineered, not robotic.
          *   *Film stance:* They clearly meet this. Tyrell says "More human than human." They are organic.
          *   *Philosophy of Bio angle:* If life = metabolism, they are alive. No tension here really, unless you argue they are "grown machines."

      *   *Criterion 2: Reproduction/Lineage.*
          *   Original replicants: Sterile. Built, not born. Four-year lifespan (apoptosis mechanism).
          *   *2049:* Rachael gave birth. This is the "miracle."
          *   *Film stance:* This is the hard boundary. Being "made" vs. "born." The fear is about lineage breaking the control of the maker.
          *   *Philosophy of Bio angle:* This aligns with the Evolutionary/Lineage definition (Godfrey-Smith, Mayr). Replicants lack evolutionary history (until the child).

      *   *Criterion 3: Biographical Life.*
          *   Replicants have memories (implanted), desires, fear of death, projects (Roy wanting more life).
          *   *Film stance:* This is where the empathy lies. Roy's "Tears in Rain" speech is about lost experiences (biographical content).
          *   *Philosophy of Bio angle:* This is "welfare" or "narrative identity." Not strictly biological life, but "a life."

  3.  **Address the Voight-Kampff (VK) Test:**
      *   *Function:* Measures empathy/emotional response to hypothetical scenarios.
      *   *Problem:* As the user notes, a human psychopath fails. A replicant with high empathy (like Rachael or Roy) might pass (or nearly pass).
      *   *Is it a test for life?* No, it's a test for *humanity* (social/moral standing) disguised as a diagnostic.
      *   *Does the film notice?* The film hints at its unreliability (Rachael doesn't know she's a replicant). It exposes the test as a tool of power/control, not ontological truth.

  4.  **Identify Where the Reading Breaks:**
      *   The "Tears in Rain" monologue.
      *   If we ask "Is Roy biologically alive?" the answer is arguably "yes" (he bleeds, dies).
      *   If we ask "Is Roy a person?" that's philosophy of mind.
      *   The *break* happens when the definition of life becomes irrelevant compared to the *value* of life. The film shifts from "What is it?" to "Does it matter?"
      *   Also, the "Uncanny Valley" effect. They look alive, so we treat them as alive. The film relies on cinematic affect, not logical criteria.

  5.  **Determine What the Film Adds (vs. Journal Article):**
      *   *Affect:* Articles argue; films make you *feel* the stakes.
      *   *Ambiguity:* Articles seek precision; films thrive on the blur (Is Deckard a replicant?).
      *   *The "Made vs. Born" Intuition:* It viscerally demonstrates why we care about lineage even if metabolism is identical.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic but conversational, respectful of the user's sophisticated hunch.
      *   *Structure:* Follow the user's prompts (Criteria, VK Test, Breaking Point, Value Add).
      *   *Key Insight:* The film conflates "Life" (biological) with "Life" (biographical/social). The tension is between *Bios* (biological process) and *Zoë* (political/qualified life) or simply Narrative.
      *   *Refining the Criteria:*
          *   Metabolism: The film treats this as a given (they bleed red).
          *   Lineage: This is the legal/ontological barrier. "Skin jobs."
          *   Biography: This is the moral hook.
      *   *VK Test:* It's a Turing Test for empathy, not biology. It fails the "psychopath objection." The film knows this (Tyrell's niece doesn't know).
      *   *The Break:* Roy's death. It doesn't prove he's alive biologically; it proves his death is a *loss*.
      *   *Value:* Phenomenology. The *experience* of the boundary.

  7.  **Final Polish:** Check against the specific constraints (1982 + 2049, avoid personhood/consciousness trap, focus on defs of life). Ensure the distinction between "being alive" and "having a life" is sharp.

      *(Self-Correction during drafting)*: I need to make sure I don't slide into "are they conscious?" The user explicitly warned against that. I must stick to *definitions of life* (autopoiesis, evolution, welfare).
      *Correction:* When discussing the VK test, frame it not as "do they feel?" but "does emotional regulation constitute a biological marker of life?" (It doesn't, really).
      *Correction on 2049:* The birth isn't biologically miraculous (humans give birth), it's *genealogically* miraculous (breaking the slave lineage).

  8.  **Final Review against User Prompt:**
