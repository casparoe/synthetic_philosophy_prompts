answer: |-
  This is a fantastic pedagogical hook. You are right to suspect that *Blade Runner* is rarely taught in philosophy of biology circles, precisely because it gets co-opted by philosophy of mind (consciousness, qualia, personhood). But as a text for *definitions of life*, it is incredibly rich because it forces a collision between three distinct concepts that usually travel together in human beings: **organic function**, **genealogical history**, and **narrative welfare**.

  Here is a breakdown of how to run this session, keeping your three criteria distinct and addressing your specific questions.

  ### 1. Which Criterion is the Film Running On?

  The film is deceptive here. It presents the replicants as failing all three, but the *drama* relies on them succeeding at two and failing only one.

  **A. Metabolism / Self-Organization (Autopoiesis)**
  *   **The Film's Verdict:** They pass.
  *   **Evidence:** They bleed red, they sweat, they feel pain, they require sleep (implied), they age (rapidly). In *2049*, Wallace dissects a replicant to show the organic tissue.
  *   **The Tension:** The film tries to downplay this. They are "skin jobs," "bio-engineered." But biologically, by the criteria of Maturana/Varela or NASA's "chemical system capable of Darwinian evolution" (minus the evolution part), they are alive. They maintain homeostasis.
  *   **Teaching Point:** If your definition of life is *metabolic closure*, replicants are alive. The film knows this, which is why "retiring" them is framed as execution, not recycling.

  **B. Reproducing Lineage (Evolutionary History)**
  *   **The Film's Verdict:** They fail (until *2049*).
  *   **Evidence:** This is the hard legal and ontological boundary. They are manufactured. They have no parents; they have a manufacturer (Tyrell/Wallace). They are sterile (originally). The four-year lifespan is an apoptosis mechanism—a kill switch to prevent them from developing a lineage.
  *   **The Tension:** In *2049*, the birth of Rachael's child is the "miracle." Biologically, birth is mundane. But *genealogically*, it breaks the chain of manufacture. It moves the replicant from the category of *Artifact* to *Organism*.
  *   **Teaching Point:** This aligns with the **Evolutionary/Lineage Species Concept**. A replicant is a token without a type history. They are clones without a clade. The film suggests that without a past (ancestry) and a future (offspring), you are not fully "alive" in the biological sense, regardless of your metabolism.

  **C. Biographical Life (Welfare/Narrative)**
  *   **The Film's Verdict:** They pass (tragedy).
  *   **Evidence:** Roy Batty's "Tears in Rain" speech. He isn't mourning the loss of metabolic function; he is mourning the loss of *data* ("watched attack ships burn..."). He has projects, desires, and a fear of death that is narrative, not just homeostatic.
  *   **The Tension:** This is where the pathos lives. A rock has no welfare; a bacterium has a "good" (survival) but no story. Roy has a story that can be cut short.
  *   **Teaching Point:** This is **Biocentric Welfare** (variously discussed by philosophers like Agar or Thompson). The film argues that having a "life" in the biographical sense generates moral status, even if the "life" in the genealogical sense is missing.

  **Summary for Class:** The film *gestures* at Criterion B (Lineage) as the legal definition, relies on Criterion A (Metabolism) to make the violence visceral, but banks entirely on Criterion C (Biography) to make you care.

  ### 2. Is the Voight-Kampff (VK) Test a Test for Life?

  **Short Answer:** No. It is a test for *social legibility*, and the film knows it.

  **The Psychopath Objection:**
  You are absolutely correct. The VK measures autonomic responses to empathetic stimuli (the tortoise, the spider).
  *   **False Negative:** A human psychopath lacks empathy but is biologically alive.
  *   **False Positive:** A replicant designed with high empathy (like Rachael, who believes she is human) might pass.
  *   **The Biological Irrelevance:** Metabolism and lineage do not require empathy. A plant is alive; a sociopath is alive.

  **Does the Film Notice?**
  Yes, but subtly.
  1.  **Rachael's Case:** She doesn't know she's a replicant. She passes the test initially because her memories are implanted. This proves the test measures *psychological conditioning*, not biological origin.
  2.  **Deckard's Ambiguity:** If Deckard is a replicant (as the Final Cut and *2049* suggest), he has been "retiring" his own kind based on a test that cannot distinguish them from humans.
  3.  **The Power Dynamic:** The VK test isn't science; it's bureaucracy. It is a tool to enforce the boundary between "Slave" and "Master." It conflates "Human" with "Alive."

  **Teaching Point:** Use the VK test to show how **operational definitions of life** can be corrupted by social goals. We define life not by what it *is*, but by how we are allowed to *treat it*.

  ### 3. Where Does the Reading Break?

  There is a specific moment where asking "Is it alive?" becomes the wrong question.

  **The Scene:** Roy Batty's death (The "Tears in Rain" monologue).

  **The Break:**
  If you ask, "Is Roy biologically alive?" up until this second, the answer is functionally "Yes." He is fighting for homeostasis.
  But when he saves Deckard, he chooses to cease metabolic functioning to preserve a moral narrative.
  *   **The Problem:** If you treat this as a definition-of-life puzzle, you miss the point. The film stops caring about his *ontology* (what he is) and forces you to confront his *axiology* (what he is worth).
  *   **The Shift:** The film argues that **mortality gives life value.** The replicants are "more human than human" not because their cells divide, but because they *know* they will die and resent it.
  *   **The Trap:** If a student argues, "But he was built, so he's a machine," the film counters with, "He bleeds, so he's flesh." If they argue, "He's flesh, so he's alive," the film counters, "He can't reproduce, so he's a dead end."
  *   **The Resolution:** The scene only works if you admit that **Criterion C (Biography) overrides A and B.** We grant him the dignity of a "life" because his death is a tragedy, not a malfunction.

  **Another Breaking Point (*2049*):**
  When K finds the wooden horse. The memory is real, but it belongs to someone else. This breaks the link between **Memory** and **Identity**. If life is defined by a continuous narrative self, and that narrative is implanted, is the life "fake"? The film suggests the *experience* of the memory is real, even if the *history* is not. This breaks the Lineage criterion again.

  ### 4. What Does the Film Add That a Journal Article Can't?

  **1. The Phenomenology of the Boundary**
  A journal article (e.g., Godfrey-Smith on "Individuals") can argue logically that lineage is necessary for life. But it cannot make you *feel* the injustice of that definition.
  *   **The Film's Contribution:** It creates **ontological vertigo**. By making the replicants visually indistinguishable from humans (mostly), it forces the audience to rely on their *affective* response rather than their *categorical* judgment. You *feel* they are alive before you can argue it. This demonstrates that our definition of life is often post-hoc rationalization of an emotional intuition.

  **2. The Ambiguity of "Made" vs. "Born"**
  Articles tend to treat "natural" vs. "artificial" as distinct categories. *Blade Runner* shows them as a spectrum.
  *   **The Film's Contribution:** It shows that "being made" doesn't preclude suffering. In philosophy of biology, we often assume organisms have "interests" because of evolutionary history. Replicants have interests (survival) without that history. The film forces you to ask: *Does welfare require evolution?* (Most bio-philosophers say yes; the film argues no).

  **3. The Political Stakes of Definition**
  Articles define life to understand the world. *Blade Runner* defines life to control it.
  *   **The Film's Contribution:** It highlights that **definitions of life are regulatory technologies.** Calling a replicant "non-human" isn't a biological claim; it's a legal one that permits slavery and execution. This connects Philosophy of Biology to Bioethics and Political Philosophy in a way a definitional paper rarely does.

  ### Suggested Seminar Flow

  1.  **Clip 1:** The opening eye / manufacturing sequence (1982). Establish they are *made*.
  2.  **Discussion:** Apply Criterion A (Metabolism). Do they meet standard biological definitions? (Yes).
  3.  **Clip 2:** The VK Test scene with Rachael.
  4.  **Discussion:** Apply the VK test. Is this a biological test? Why does it fail the "psychopath" check? What work is it actually doing? (Policing the boundary).
  5.  **Clip 3:** Roy's Death (1982) + The Birth/Child reveal (2049).
  6.  **Discussion:** Contrast Criterion B (Lineage) with Criterion C (Biography). Why is the child a "miracle" if replicants are already organic? (It grants them a future/lineage).
  7.  **Closing:** Ask the class: "If a journal article defined life strictly by Lineage, would Roy Batty be alive? If we define it by Welfare, is he?"
  8.  **Takeaway:** Definitions of life are not just descriptive; they are normative. They determine what counts as a loss when it dies.

  This approach keeps you firmly in Philosophy of Biology (definitions, individuals, lineage, welfare) without sliding into the Philosophy of Mind (consciousness, qualia, soul) trap.
