answer: |-
  ### Degeneration Tiers

  **Tier 1: The Long Game (30+ Rounds)**
  *   **1 (Ratify-under-successor), 4 (Entrenchment Ladder), 6 (Imported Authority)**
  *   These architectures introduce friction that prevents rapid collapse. **1** creates a high bar for transition, **4** creates variable costs for change, and **6** outsources stability to an external system. They will easily last your month, though **6** risks becoming boring simulation rather than a game.

  **Tier 2: The Mid-Game Crisis (10–20 Rounds)**
  *   **5 (Precedent Lock)**
  *   This survives the opening moves but creates a "first-mover advantage" cliff. Once a clever player defines a broad "kind" of change with an easy procedure, the game goes molten. It lasts until the first major precedent is set, after which the rule layer loses constraining power.

  **Tier 3: Immediate Crash (<10 Rounds)**
  *   **2 (Quorum Echo), 3 (Self-mention Void)**
  *   **2** is a mathematical death spiral; unless turnout drops precisely every round, quorum will exceed your player count within two weeks, locking the game permanently. **3** is trivially bypassed by loophole hunters (e.g., referring to "this rule" instead of "Rule 4"), rendering the constraint useless and inviting paradoxical chaos immediately.

  ---

  ### Ratings & Justifications

  | Architecture | Strategy (0–10) | Faction Resistance (0–10) | Justification |
  | :--- | :---: | :---: | :--- |
  | **1. Ratify-under-successor** | 7 | 9 | Forces players to strategize around two different rule-states simultaneously, making it mathematically difficult for a minority to sneak through self-serving transitions. |
  | **2. Quorum echo** | 2 | 5 | Reduces gameplay to a turnout math puzzle where a faction can manipulate quorum by coordinating abstentions, but the ratchet effect eventually punishes everyone. |
  | **3. Self-mention void** | 3 | 2 | Creates syntax games rather than strategic depth, and loophole hunters will bypass it instantly by using aliases or indirect references. |
  | **4. Entrenchment ladder** | 8 | 5 | Offers deep resource management on political capital, but a simple majority faction can repeal the tagging rule itself to remove all protections. |
  | **5. Precedent lock** | 6 | 3 | Rewards categorization strategy, but allows a small faction to seize control by setting the first precedent to define "all future changes" as a single easy kind. |
  | **6. Imported authority** | 4 | 8 | Shifts strategy to parliamentary procedure compliance, and external documents usually contain minority protections that a 3-person faction cannot easily override. |

  ---

  ### The Pairing: Ratify-under-successor (1) + Entrenchment Ladder (4)

  If I had to ship two, I would combine **1 and 4**, but you need to watch out for the **Transition Ratchet**.

  **What they do to each other:**
  These two create the most robust "High-Law Nomic" experience, but they interact to create a one-way valve on difficulty. Because Proposal 1 requires a vote under the *new* rules to pass, you can easily **lower** an entrenchment threshold (e.g., Unanimity → Majority) because the second vote is easier to pass, but you cannot **raise** it (Majority → Unanimity) because the second vote will fail under the stricter rules you are trying to enact.

  **Why ship them:**
  Despite the ratchet, this pair best satisfies your constraints: it keeps the rule layer the focus (Strategy 8+) and makes it nearly impossible for a 3-person faction to seize control without broad consensus (Resistance 9). To fix the ratchet, add a clause to **1** stating that if a proposal *increases* a voting threshold, the second ratification vote is counted under the *old* threshold.
