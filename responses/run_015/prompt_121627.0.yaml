prompt: |-
  In my moral philosophy seminar we have been examining whether supererogation denotes a genuinely non-obligatory category of moral excellence or merely a residue of imperfect duty and practical constraint. I would like your actual credence—not a survey of positions, but a number with its derivation—that supererogation survives as a structurally non-obligatory domain: specifically, that there exist actions supported by weighty moral reasons which are nevertheless not even weakly required, where this lack of obligation is not reducible to competing duties, resource limits, or the satisfaction conditions of an imperfect duty.

  My own credence is approximately 0.60. Please decompose yours across at least these four sub-questions, assigning a rough probability and a one-line justification to each: (a) whether moral reasons necessarily generate at least pro tanto obligations (the bridge from reasons to obligations); (b) whether the collapse argument—that an act supported by sufficient reason and available at modest cost becomes obligatory—can be resisted without rendering morality inert; (c) whether the domain of imperfect duties (e.g., beneficence, self-cultivation) can fully absorb apparently supererogatory conduct, leaving no genuine remainder; and (d) whether a virtue-theoretic account that frames exceptional moral performance as the expression of character rather than norm-compliance can secure a non-obligatory status that deontic theories cannot. Then combine these terms into an overall figure, identify which term contributes the greatest variance, and state which single argument or observation—whether conceptual, about ordinary moral judgment, or about practical reasoning—would most shift your number.
