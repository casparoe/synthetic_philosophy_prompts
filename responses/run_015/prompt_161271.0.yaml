      *   *Structural Realist:* Think Sider (Writing the Book of the World), Armstrong, maybe Ladyman/Ross (OSR). There is a "joint-carving" structure. Quantifiers have a single privileged meaning. Some questions are hard but factive.

  3.  **Drafting - Section 1: Agreed Claims:**
