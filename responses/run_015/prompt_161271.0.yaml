  # JOINT STATEMENT ON ONTOLOGICAL DISPUTES AND QUANTIFIER VARIANCE
  **A Collaborative Document by The Deflationary Framework Group (DFG) and The Structural Reality Group (SRG)**

  **Date:** October 26, 2023
  **Subject:** The Demarcation of Verbal and Substantive Ontological Disputes, with Application to Chemical Bonding

  ## 1. AGREED CLAIMS

  The undersigned parties, representing distinct metaphysical temperaments, submit the following claims as the common ground necessary for productive collaboration. We affirm that these claims are non-vacuous and that signing them requires significant concession from our respective traditional bases.

  1.  **Commitment of Quantification:** We agree that to assert $\exists x (Fx)$ within a theory is to commit that theory to the existence of $F$s *relative to the semantics of that theory*. We disagree on whether the semantics of the quantifier $\exists$ is fixed by the world (SRG) or by the conceptual framework in which the theory is embedded (DFG).
  2.  **Mutual Restatement:** We agree that the phenomenon of "mutual restatement without mistake" (where Party A translates Party B's claims into A's vocabulary without empirical loss) is a strong *prima facie* indicator of a verbal dispute. However, we agree this does not *conclusively* establish verbalness. SRG holds that one translation may be "gerrymandered" (complex and unnatural) compared to the other. DFG holds that if the translation preserves all empirical and pragmatic utility, the difference is purely notational.
  3.  **Value of Settling Verbal Disputes:** We agree that a dispute classified as "verbal" may nonetheless be worth settling. Grounds for settlement include: fruitfulness for future research, simplicity of expression, fit with adjacent scientific disciplines, and moral or practical upshot. We agree that "merely verbal" does not mean "trivial."
  4.  **Trivial Inference:** We agree that the fact that ordinary object-talk (e.g., "there is a chair") is settled by trivial inference from empirical premises (e.g., "there are particles arranged chair-wise") does not settle contested ontological cases (e.g., "there is a hydrogen bond"). Ordinary cases rely on shared, implicit frameworks; contested cases arise precisely when frameworks diverge.
  5.  **Criterion Obligation:** We agree that each side owes the other an explicit criterion for sorting verbal from substantive disputes.
      *   **DFG Criterion:** A dispute is substantive iff there is a difference in empirical predictions or pragmatic utility (including simplicity and explanatory power) between the frameworks.
      *   **SRG Criterion:** A dispute is substantive iff one framework employs predicates or quantifiers that "joint-carve" the structure of reality better than the other, even if empirical predictions are identical.

  ## 2. DISAGREEMENTS TABLE

  | Contested Proposition | SRG (Structural Realist) Formulation | DFG (Neo-Carnapian Deflationist) Formulation | Nature of Genuine Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. The Source of Naturalness** | "Naturalness is a mind-independent feature of the world's structure. Some ways of carving the world are objectively better because they match the causal powers and dependencies inherent in reality." | "Naturalness is a measure of the entrenchment and utility of a conceptual scheme within a community of inquirers. It is a feature of our language and interests, projected onto the world." | **Metaphysical:** Is the "fit" between language and world a relation between two distinct relata (SRG), or a measure of internal coherence within a linguistic practice (DFG)? |
  | **2. Quantifier Variance** | "There is a single, privileged meaning of 'exists' (the 'joint-carving' quantifier). Other uses are derivative or metaphorical. Ontology is the study of what exists in this privileged sense." | "There is no privileged quantifier. 'Exists' has systematically different meanings in different frameworks. Ontology is the study of which framework is most useful for a given purpose." | **Semantic/Metaphysical:** Is the disagreement about the *world* (SRG) or about the *rules of our language* (DFG)? SRG says DFG ignores the world's structure; DFG says SRG reifies linguistic habits. |
  | **3. Intractable Substantivity** | "A dispute can be fully substantive even if no possible empirical evidence would settle it. Modal facts about structure are not exhausted by empirical regularities." | "If no empirical evidence or pragmatic consideration can settle a dispute, there is no fact of the matter. The appearance of substantivity is an illusion generated by the grammar of 'exists'." | **Epistemic:** Does reality outrun our best verification methods? SRG says yes; DFG says no. |

  ## 3. CRUXES TABLE

  | Crux | Sub-Question | Shared Evidence / Argument | SRG Prediction | DFG Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Mind-Independence of Structure** | Is the success of physics explained by latching onto mind-independent structure, or by constructing empirically adequate models? | The historical convergence of distinct mathematical formalisms on similar structural descriptions (e.g., matrix and wave mechanics). | Convergence indicates we are triangulating on a single, mind-independent structure. | Convergence indicates we are finding the most efficient compressions of empirical data; distinct formalisms are tools, not mirrors. |
  | **2. Framework Switching** | Can scientists shift between strictly incompatible frameworks without ontological loss? | The use of both particle and field idioms in quantum field theory, or the user's case of switching bond definitions. | One framework is ultimately more fundamental; switching is a heuristic aid. Loss is incurred if we forget which is fundamental. | Switching demonstrates that the "ontology" is framework-relative. No loss is incurred because no single framework is privileged. |
  | **3. The Cost of Translation** | Does translating a "natural" claim into an "unnatural" vocabulary incur an ontological cost or merely a linguistic one? | The ability to paraphrase "there is a bond" into "there are nuclei with electron density topology X." | The paraphrase is ontologically inferior because "electron density topology" is less joint-carving than "bond." The cost is real. | The paraphrase is ontologically neutral. The cost is merely cognitive load. If the load is manageable, the dispute is verbal. |

  ## 4. APPLICATION SECTION: THE HYDROGEN BOND CASE

  **Case Description:** As described by the inquirer, four frameworks are in use:
  1.  **Directional Interaction:** Donor/Acceptor groups.
  2.  **Topological:** Bond critical point in electron density (QTAIM).
  3.  **Energetic:** Region of topology in Potential Energy Surface (PES).
  4.  **Object Idiom:** A genuine object with length, energy, lifetime.

  **The Inquirer's Test:** *If the reinterpretation that one side offers for the other side's existence claim can be substituted everywhere at no cost in simplicity, in predictive power, or in the generalisations the discipline wants to state, then the dispute is verbal; if it incurs such a cost, then it is not.*

  ### Evaluation by the Deflationary Framework Group (DFG)
  *   **Acceptance of Test:** We accept this test as a robust operationalization of our Criterion (Claim 5).
  *   **Definition of Cost:** "Cost" is defined strictly as pragmatic friction: increased computational complexity, loss of heuristic value for experimental design, or inability to communicate with adjacent fields (e.g., biology).
  *   **Prediction:** We predict the test returns **Verbal**. Your colleagues moved among all four without explanatory or predictive loss. This indicates the frameworks are intertranslatable with negligible pragmatic friction. The "Object Idiom" is a useful shorthand for the "Topological" or "Energetic" descriptions, not a competing fact.
  *   **Residual Disagreement:** We acknowledge the Realist may claim a cost where we see none. We classify *that* residual disagreement as verbal: it is a disagreement about whether "naturalness" is a pragmatic virtue or a metaphysical truth.

  ### Evaluation by the Structural Reality Group (SRG)
  *   **Acceptance of Test:** We accept the test *mutatis mutandis*, but we must refine the definition of "cost."
  *   **Definition of Cost:** "Cost" includes **loss of joint-carving**. Even if predictive power is identical, a framework that treats a transient topological feature as a persistent "object" may obscure the causal structure of the system. If Framework A aligns with the fundamental forces and Framework B treats them as emergent objects, B incurs an ontological cost even if prediction is equal.
  *   **Prediction:** We predict the test returns **Substantive (but localized)**. The dispute over whether the bond is a "genuine object" (Framework 4) vs. a "topological feature" (Framework 2/3) is substantive. Framework 2/3 likely joints the world better (tracking electron density and forces). Framework 4 is a useful fiction. The cost is that treating it as an object may mislead inquiry into bond breaking/formation mechanisms.
  *   **Residual Disagreement:** The disagreement over what counts as a cost (pragmatic friction vs. joint-carving fidelity) is **Substantive**. It reflects the core metaphysical divide on whether reality has a preferred vocabulary.

  ### Joint Critique of the Test
  Both parties agree the Inquirer's test is defective in one specific regard: it assumes "predictive power" is the only metric of empirical success.
  *   **Correction:** The test should be replaced by the **Explanatory Integration Test**.
  *   **Revised Test:** *Can the reinterpretation be substituted without loss of integration into the broader network of physical laws?*
  *   **Reasoning:** A framework might predict well locally but fail to integrate with quantum mechanics or thermodynamics globally. If Framework 4 (Object) isolates the bond from the field equations, while Framework 2 (Topology) integrates it, Framework 2 is preferred. DFG sees this as pragmatic integration; SRG sees it as structural fidelity. Both agree this is the correct metric for settling the dispute, even if they disagree on *why* it works.

  ## 5. CLASSIFICATION OF THE DISPUTE

  **Which parts are Verbal?**
  Both parties classify the dispute over the *noun* "bond" as **Verbal**. Whether one says "there is a bond" (Object Idiom) or "there is a bond-critical-point" (Topological Idiom) is a choice of nomenclature. Since the translation between these is lossless regarding empirical data, the existence claim itself is framework-relative.

  **Which parts are Substantive?**
  Both parties classify the dispute over the *causal role* of the interaction as **Substantive**. If Framework A implies the interaction is additive and Framework B implies it is cooperative/non-linear, and this leads to different expectations about protein folding stability, the dispute is substantive. This is not about whether the bond "exists," but about *how the system behaves*.

  **Route to Classification:**
  We reached this classification by applying the **Explanatory Integration Test**. Where the frameworks diverge on behavior/integration, the dispute is substantive (empirical/pragmatic). Where they diverge only on the reification of the interaction into an "object," the dispute is verbal (ontological/semantic).

  ## 6. ADVICE TO THE INQUIRER

  You asked what you should have concluded about the hydrogen bond when the argument finally petered out.

  **Conclusion:** You should have concluded that the "hydrogen bond" is a **real pattern** but not a **fundamental object**.

  The dispute stopped mattering not because the scientists gave up, but because they realized they were asking a category mistake. They were asking "Is it real?" (an ontological question) when they should have been asking "Is this description useful for this calculation?" (a pragmatic question).

  The "reality" you were tracking was the stability of the protein structure and the energetics of the hydration shell. The "hydrogen bond" was the name you gave to a specific cluster of causal powers within that structure. Whether you quantified over that cluster as an *object* or as a *field topology* made no difference to the protein.

  In your retirement metaphysics, you have recognized that the old ontological debate was a shadow cast by a pragmatic success. The lesson is this: **When two frameworks are intertranslatable without empirical loss, the ontology is a matter of choice, not discovery.** You were not failing to find the truth; you were succeeding in finding multiple ways to map the same territory. Stop looking for the hydrogen bond in the world; look for the work it does in the theory. That work is real. The noun is optional.

  ***

  **Signed,**

  *Dr. Elena Vance (Lead, Deflationary Framework Group)*
  *Prof. Marcus Thorne (Lead, Structural Reality Group)*
