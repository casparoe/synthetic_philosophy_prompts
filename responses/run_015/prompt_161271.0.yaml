  5.  **Drafting - Section 3: Cruxes Table:**
      *   Need sub-questions that move the needle.
      *   *Crux 1: Mind-Independence of Structure.* Evidence: Success of physics. Realist predicts structure explains success. Deflationist predicts empirical adequacy explains success.
      *   *Crux 2: Framework Switching.* Evidence: Scientists using incompatible models (wave/particle). Realist says one is closer to truth or they approximate a deeper structure. Deflationist says they are different tools for different jobs.
      *   *Crux 3: The "Cost" of Translation.* Evidence: Complexity of paraphrase. Realist says gerrymandered predicates are ontologically costly. Deflationist says they are just linguistically cumbersome but ontologically neutral.

  6.  **Drafting - Section 4: Application (Hydrogen Bond):**
