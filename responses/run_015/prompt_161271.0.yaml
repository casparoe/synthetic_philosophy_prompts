      *   *Refining the Test:* Both might agree the test needs to distinguish between *local* utility and *global* coherence.

  7.  **Drafting - Section 5 & 6: Classification & Advice:**
      *   *Classification:* The "existence" of the bond as a *substance* is verbal. The *causal role* is substantive.
      *   *Advice:* You were right to stop worrying. The "reality" was in the causal structure, not the noun.

  8.  **Review and Refine:**
      *   *Tone Check:* Needs to be academic, precise, collaborative, not combative.
