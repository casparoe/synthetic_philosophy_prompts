answer: |-
  Condorcet's Jury Theorem is a fragile asymptotic result that collapses when individual competence is endogenous or votes are correlated, meaning it functions better as a benchmark for aggregation efficiency than as a robust defense of democracy.

  On your first point about endogenous information: you have the right intuition about the threshold. If individual competence $p_n$ approaches $1/2$ as the group size $n$ grows, the majority accuracy converges to 1 only if the competence gap shrinks slower than $1/\sqrt{n}$. Specifically, if $p_n = 1/2 + \epsilon_n$, you need $\sqrt{n}\epsilon_n \to \infty$ for the probability of a correct majority to approach 1. If $\epsilon_n$ shrinks at exactly the rate $c/\sqrt{n}$, the group accuracy converges to a constant strictly between $1/2$ and 1 (determined by the cumulative distribution function of the normal distribution at $2c$). If it shrinks faster than that, the group accuracy converges to $1/2$, meaning large groups are no better than a coin flip. In rational ignorance models where voters weigh the cost of information against the probability of being pivotal, the probability of being pivotal typically decays exponentially or by $1/\sqrt{n}$, so the incentive to acquire information vanishes as $n$ grows. Consequently, equilibrium competence usually decays fast enough to break the theorem entirely, and yes, aggregate accuracy often peaks at a finite group size and then declines as the dilution of informed voters outweighs the aggregation benefit.

  On your second point about correlation and straw polls: mathematically, dependence is dependence regardless of the source, but the *structure* of that dependence determines the limit. The theorem requires votes to be conditionally independent given the state of the world. A public straw poll introduces a common signal, making votes correlated conditional on the state. This correlation prevents the variance of the aggregate vote from shrinking to zero; instead, the group error converges to the error rate of the common signal. If the straw poll is perfectly informative, correlation doesn't hurt, but if it is noisy, group accuracy caps at the accuracy of that public signal regardless of how many voters you add. When voters ignore their private signals to follow the straw poll (an information cascade), they are actively discarding information, which is strictly worse than Bayesian updating. This is a different failure mode than rational ignorance: ignorance reduces the signal strength per voter, while cascades introduce correlation and waste existing private signals, but both destroy the asymptotic convergence to certainty.

  On your third point about the nature of the claim: the theorem is a conditional mechanical result about aggregation, not a normative argument for democracy. It demonstrates that majority rule is epistemically superior to random dictatorship or single-voter rule *only* under the specific assumptions of exogenous competence and conditional independence. It does not account for how institutional structures affect those inputs, nor does it compare democracy to alternative regimes that might select for higher competence (epistocracy) or reduce correlation. Your friend's reading is too quick because it treats the assumptions as features of reality rather than constraints of the model; the theorem tells you what majority rule can do if you feed it independent, competent inputs, not that democracy naturally produces them.
