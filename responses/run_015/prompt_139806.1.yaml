      *   *Standard CJT:* $p > 0.5$ fixed, independent, $n \to \infty \implies P(\text{majority correct}) \to 1$.
      *   *Variant:* $p$ is endogenous. Voters choose to invest cost $c$ to get $p_H > 0.5$ or stay uninformed with $p_L \approx 0.5$.
      *   *Logic:* As $n$ increases, probability of being pivotal ($P_{piv}$) decreases (typically exponentially or by $1/\sqrt{n}$). Expected benefit of informing is $P_{piv} \times (p_H - p_L) \times \text{Benefit}$. If $c > 0$, eventually $P_{piv} \times \text{Benefit} < c$.
      *   *Result:* In large elections, rational voters do not acquire information (Downsian paradox). If everyone stays uninformed, $p \to 0.5$.
      *   *Threshold:* If $p_n = 0.5 + \epsilon_n$. CJT holds if $\sum (p_n - 0.5) = \infty$ (roughly). More precisely, if $p_n = 0.5 + \frac{c}{\sqrt{n}}$, there's a critical threshold. If $p_n - 0.5$ shrinks faster than $1/\sqrt{n}$, the majority accuracy does *not* converge to 1. It might converge to 0.5 or some intermediate value.
      *   *Peak:* Yes, group accuracy often peaks at a finite $n$ and then declines because the dilution of informed voters outweighs the aggregation benefit.
      *   *Key Insight:* The "cliff" is when the decay in individual competence offsets the aggregation benefit. Specifically, if $p_n - 0.5 \sim n^{-\alpha}$, convergence requires $\alpha < 0.5$. If $\alpha \ge 0.5$, convergence fails.

