answer: |-
  *   **Depot Arithmetic (Ex Ante):** The corridor has two decision nodes. Let $p$ be the probability of turning off at any given node.
      *   Payoff structure: Turn at 1st = 0. Turn at 2nd = 4. Reach End (Border) = 1.
      *   Probability of reaching 1st node: 1. Probability of reaching 2nd node: $(1-p)$.
      *   Expected Value ($E$) = $p(0) + (1-p)[p(4) + (1-p)(1)]$.
      *   Simplify: $E = (1-p)(3p + 1) = -3p^2 + 2p + 1$.
      *   Maximize: Derivative $-6p + 2 = 0 \rightarrow p = 1/3$.
      *   Max Expected Value: $1.33$. This beats "Always Continue" (Value 1) and "Always Turn" (Value 0).
  *   **Driver Arithmetic (Ex Interim):** At the interchange, the operator knows they are at *a* node, but not which.
      *   Using the optimal policy $p=1/3$, the probability of being at the 1st node is higher than the 2nd (since you always reach the 1st, but only reach the 2nd if you didn't turn).
      *   Ratio of 1st:2nd is $1 : (1-p)$ or $1 : 2/3$ (3:2).
      *   Probability being at 2nd node = $0.4$. Probability being at 1st = $0.6$.
      *   Value of Turning now: $0.6(0) + 0.4(4) = 1.6$.
      *   Value of Continuing: Depends on future policy, but intuitively feels like risking the Border (1) for a chance at the Hub (4). The prompt specifies the driver concludes they should turn every time; this divergence creates the time inconsistency. The immediate expected value of turning (1.6) looks higher than the guaranteed border payoff (1), tempting the operator to abandon the $p=1/3$ plan.
  *   **The Leak Plug:** In reality, humans count time or mileage. To seal the information set, the story relies on the "Clean Cab" security protocol. No paper, no pens, no personal electronics. The truck's UI wipes trip data on approach to the gantry. The corridor lighting is monochromatic sodium (589 nm), removing shadow cues that indicate sun position. The hum of the road surface is identical at both sites.
  *   **The Randomizer:** A twenty-sided die issued in a sealed tamper-evident bag. Rolling it is a physical admission that human judgment is deprecated.
  *   **The Emotional Core:** The operator at the depot is a different person than the operator at the gantry. The latter must trust the former without understanding the reasoning. It is faith, not logic.
  *   **Narrative Structure:** Repetitive prose to mimic the identical interchanges. The reader experiences the same uncertainty as the protagonist.
  *   **Technical Bend:** I will simplify the driver's belief update. In strict game theory, the "forgetting" aspect is contested (whether the driver can infer location from the fact they are still driving). I will treat the ignorance as absolute to serve the mood.

  ***

  **Sodium Yellow**

  The light is always the same. Sodium vapor, burning low and orange, casting no shadows because there is nothing to cast them. Just the concrete, the cracked lip of the overpass, and the gantry stretching across the lanes like a judgment bar.

  I ease off the accelerator. The truck knows I'm slowing. The haptic feedback in the wheel shivers, a warning tremor. *Maintain corridor speed.* But the protocol says human fallback at the interchange. So I slow. The engine note drops, a deep throat-clearing sound that vibrates in my seat bones.

  I look at the dashboard. The screen is dark. It wiped itself three kilometers back, just past the marker pole. No mileage. No timestamp. No GPS coordinate. Just the essential telemetry: fuel, pressure, temperature. The security mandate is absolute. No persistent state. The truck cannot know where it has been, only where it is. And where it is, exactly, is nowhere distinguishable from where it was forty kilometers ago.

  I look out the windshield. The gantry ahead is rusted at the bolt heads on the left support. I remember the last one. Rusted at the bolt heads on the left support. The exit sign is the same font, the same slight flicker in the second 'E'. The desert beyond the barrier is the same scrub brush, same dust haze, same impossible distance.

  My hand goes to the cup holder. Inside sits the plastic bag. Tamper seal intact until this morning at the depot. Inside the bag is a die. White plastic, black numerals. Twenty sides.

  Dispatch called it a "randomization token." I call it a humiliation.

  At the depot, the briefing room was cold. The planner sat behind glass. He didn't look at me; he looked at the simulation running on his wall. He told me the odds. He told me the payoffs. He told me that if I try to be smart, if I try to use my head to count the kilometers or guess the sun's arc, I will break the model. I will take the first turn and get sent back to the yard with an empty trailer. Zero pay. Or I will miss the second turn and hit the border checkpoint. Late fee. Mark on the record. Value: one.

  Only the second turn pays full. Value: four.

  But I cannot know which turn this is. The planner knows. The planner is safe in the office, looking at the whole map. He knows there are two gates. He knows the truck must pass the first to get to the second. He calculated the perfect mix. One time in three, turn. Two times in three, drive straight.

  That was the plan. That was the policy signed in blood and biometric scan.

  But the planner isn't here. The planner is me, but he is a me from three hours ago, before the monotony set in, before the sodium light bleached the color out of my thoughts. He knew more than I do. He knew I was at the start. Now I am here, in the yellow wash, and I am blind.

  My hand hovers over the bag. The temptation is a physical weight in my chest. Just turn. If this is the second one, I win. I get the four. I get the hub. I get to sleep in a real bed tonight. If I drive straight, I risk the end of the line. I risk the border. I risk the mark on the record.

  From inside this cab, turning looks like the only rational choice. Why would I stay on the road? The road only leads to more yellow light and a border guard who hates me. The turn offers a chance at the prize. Even if this is the first gate, what do I lose? I go back to the depot. I start over. Nothing lost, nothing gained. Zero.

  But if I turn at the first gate, I validate the zero. I make the whole trip worth nothing. The planner knew that. The planner knew that if I turn every time I see a gate, the expected value collapses. He needed me to be willing to drive past the prize. He needed me to be willing to lose.

  How do you trust a version of yourself that you can't remember being?

  I tear the seal on the bag. The plastic crinkles, loud in the silence of the cab. The air smells of stale coffee and the hot dust scent of the brakes. I take out the die. It feels cheap, lightweight. A toy for a child, not a tool for a professional operator.

  I shake it in my cupped hands. The sound is a dry rattle.

  *Roll above six,* the order said. *If seven or higher, diverge. If six or lower, continue.*

  It's arbitrary. There is no reason why seven means turn. There is no physics in it. It is pure chance inserted into a machine built on certainty. It feels like surrender. It feels like admitting that my brain is just another sensor that can't be calibrated.

  The truck creeps forward. The gantry looms. I can see the camera cluster now, the black eyes watching me. They are recording this. They are recording the roll. They will know if I cheat. If I look at the die and decide it looks like a 'turn' number even if it isn't, the algorithm will flag the hesitation. The biometric scan will catch the pulse spike.

  I am not corrupt. I am not tired. I am just trapped in the information set.

  I throw the die onto the dashboard. It bounces off the dark screen, clatters against the windshield glass. It spins, a blur of white and black.

  It settles.

  I look down.

  The number is facing up.

  My hand moves to the wheel. This is the moment where the faith has to hold. If I turn, I am obeying the planner. I am obeying the self who knew the map. I am accepting that I might be throwing away a win because a piece of plastic said so. If I drive straight, I am trusting my own instinct that this feels like the second one. It does feel like the second one. The wear on the road surface seems slightly deeper. The hum of the tires seems slightly higher.

  But those are lies. The corridor is standardized. The contractor was paid to make them identical. Any difference I perceive is noise. Any pattern I find is a ghost.

  The truck is waiting. The engine idles. The yellow light pours in, filling the cab, filling my lungs.

  I grip the wheel. The leather is worn smooth at the ten and two positions. I think about the depot. I think about the planner behind the glass. He didn't look at me. He looked at the math. He trusted the math. He trusted me to be the hand that rolls the dice.

  If I drive straight, I am betting that I am at the first gate. If I turn, I am betting I am at the second. But the bet isn't mine. The bet was placed three hours ago. I am just the executioner.

  I turn the wheel.

  The truck responds, heavy and slow. The tires crunch over the rumble strip. The nose swings toward the off-ramp. The gantry passes overhead, a shadow crossing my face.

  I don't know if I made the right choice. I don't know if I just threw away the paycheck or saved the route. I only know that I rolled the number. I only know that I didn't try to be smarter than the man who sent me here.

  The ramp curves away from the sodium light. The desert opens up, dark and cold. I shift gears. The engine climbs. I check the dashboard. Still dark. Still no coordinates.

  I drive into the night, carrying the weight of a decision I wasn't allowed to understand.

  ***

  **Technical Note:**
  In strict decision theory (Piccione & Rubinstein, 1997), the "driver's" calculation at the interchange is contested; some formulations argue the driver should update their belief about *which* interchange they are at based on the fact that they have arrived there, which complicates the "always turn" intuition. I have simplified this to the prompt's specification that the driver feels compelled to turn every time. Additionally, real-world "Clean Cab" protocols rarely forbid paper entirely, but I have elevated this to a absolute security constraint to seal the information leak required for the paradox to hold.
