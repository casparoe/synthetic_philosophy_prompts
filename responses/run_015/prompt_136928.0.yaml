      *   **Constraints:** No reading lists. No "it depends on what you mean by understanding" (must pick a reading). Order tensions by severity.
      *   **Tone:** Intellectual, rigorous, respectful of the philosophical depth, practical regarding the clinical context.

  2.  **Deconstruct the Belief System (The "Pile"):**
      *   (1) *Darwin's Inversion:* Purpose/structure comes from selection history, not prior designer/comprehender. (Naturalism about function).
      *   (2) *Turing's Inversion:* Comprehension is built from non-comprehending competence. (Reductionism/Functionalism about mind).
      *   (3) *Aboutness is Cheap:* Intentionality is fixed by optimization history. (Teleosemantics).
      *   (4) *Stance Instrumentalism:* Attributing understanding is about predictive utility for the attributor, not a "real fact." (Dennettian Intentional Stance).
