      *   (6) *Provenance Condition:* Comprehension requires sensitivity to *reasons*, not just reinforcement for *results*. (Historical/Causal criterion for understanding).
      *   (7) *Practical Verdict:* Humans must be in the loop for patient care. Benchmarks aren't enough. (Ethical/Safety policy).

  3.  **Identify Tensions (The "Audit"):**

      *   *Tension A: (4) vs. (5).*
