answer: |-
  **Project Title:** Moral Tenancy: Obligation, Convention, and the Temporary Visitor
  **Workshop Track:** Applied Ethics / Social Philosophy
  **Proposer:** [Your Name]

  **Research Question**
  Do everyday social conventions (tipping, queueing, jaywalking) generate moral obligations for short-term visitors? If so, are these obligations derived from universal rules, cultural relativism, or a specific temporary relationship to the local social system?

  **Problem Statement**
  Current ethical frameworks struggle to explain the normative status of the tourist. 
  1. **Universalism** suggests rules like "do not steal" apply everywhere, but fails to account for local conventions (e.g., tipping in Japan vs. US) that feel binding only in context. 
  2. **Cultural Relativism** suggests "when in Rome," but implies a binary obligation that doesn't match intuition. We do not feel the same guilt for jaywalking in Berlin as we do for skipping a queue in London.

  Furthermore, there is an unexplained **asymmetry in social sanction**. Locals often react with greater hostility toward a tourist skipping a queue than a local doing the same. If conventions are merely preferences, the visitor's origin shouldn't matter. If they are absolute laws, the local should be judged *more* harshly for knowing better. Neither standard view explains why the tourist's violation feels like a specific kind of unfairness.

  **Proposed Framework: Moral Tenancy**
  I propose the concept of **Moral Tenancy**. A visitor is not a citizen (owner) nor a stranger (outsider), but a temporary tenant of the social infrastructure. 
  *   **Tenancy Rights:** The visitor benefits from the smooth functioning of the system (safety, order, service).
  *   **Tenancy Duties:** Obligations scale based on duration of stay and depth of benefit receipt.

  I will distinguish between two types of duties:
  1.  **Non-Disruption Duties (Visitors):** The obligation not to degrade the system's efficiency for others (e.g., queue-jumping, loud behavior). This applies immediately upon entry.
  2.  **Maintenance Duties (Locals/Long-term Tenants):** The obligation to uphold and enforce the system (e.g., tipping to ensure wage stability, correcting others). This accrues over time.

  **Methodology**
  This project will use conceptual analysis and intuition pumping across specific case studies (tipping in service economies, pedestrian signaling, public transit etiquette). I will test the "Moral Tenancy" model against the "asymmetry of anger" phenomenon: does viewing the tourist as a "non-contributing tenant" explain why locals perceive queue-jumping tourists as free-riders more acutely than locals?

  **Expected Outcomes**
  1.  **Theoretical:** A refined account of how social contracts apply to non-members, moving beyond the citizen/stranger binary.
  2.  **Practical:** A normative framework for travel ethics (guidelines for travelers) and potentially host-city policy (how to signal which conventions are "disruptive" vs. "maintenance").

  **Risk Assessment & Feasibility**
  *   **Primary Risk:** The "Tenancy" model may collapse into a trivial claim that "longer stay equals more rules." If the only variable is time, the theory adds little value. I must demonstrate that the *type* of obligation changes (Non-Disruption vs. Maintenance), not just the quantity.
  *   **Scope Check:** This is feasible for a semester-length project. By restricting the scope to *conventions* (social norms) rather than *laws* (legal statutes), I avoid complex legal philosophy. The focus will remain on the specific intuition gaps regarding queueing, tipping, and pedestrian behavior.
  *   **Contingency:** If the distinction between Maintenance and Non-Disruption proves unstable, the project will pivot to analyzing the "fairness" component of the tenancy relation specifically regarding free-riding on social trust.

  **Timeline**
  *   **Weeks 1-4:** Define "convention" vs. "law" and map existing literature on political obligation.
  *   **Weeks 5-8:** Develop case studies (Berlin jaywalking, Japan tipping, UK queueing) and test against the Tenancy model.
  *   **Weeks 9-12:** Draft paper, focusing on the "asymmetry of anger" as the key evidence for the theory.
