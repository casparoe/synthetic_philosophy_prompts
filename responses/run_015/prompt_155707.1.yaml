prompt: |-
  I keep getting into fights with friends about whether you're actually morally required to follow local rules when you're just visiting somewhere. Like, is it wrong to jaywalk in Berlin if you're American, or to skip the tipping culture in Japan when you're only there for three days? My roommate says yes, you're physically in their system so you obey all conventions. I think that's too simple, because people clearly feel different kinds of guilt for breaking queue rules versus not bowing correctly, and locals seem way madder at tourists who skip queueing than at locals who do it. So I came up with this idea I'm calling "moral tenancy" — you're not a citizen, but you're kind of renting temporary membership in their social system, which means your obligations depend on how long you stay and whether you actually recieve benefits from the system working smoothly.

  I want to pitch this as a one-page research proposal for a small philosophy workshop. The core question: do everyday conventions like tipping, queueing, and jaywalking create moral obligations specifically through this tenancy relation, rather than through universal rules or just cultural preference? I need to explain why the usual answers — either "all conventions are just preferences" or "visitors must obey everything" — don't settle the case, especially the weird asymmetry in how angry people get. The approach would be to split obligations into "maintenance duties" for locals and "non-disruption duties" for short-term visitors, then see if that actually matches our intuitions across different conventions. I should say what a useful result looks like — maybe a practical framework for travelers or city policy? — and be honest about failure, like if the tenancy idea just collapses into "longer stay equals more rules". Also need a realistic scope check: is this too ambitious for a semester-length project? Don't bother with citations or a literature review, I'll figure that out myself. Btw I always spell queuing wrong so don't worry about that.
