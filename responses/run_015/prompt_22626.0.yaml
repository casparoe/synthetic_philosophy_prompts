      *(Self-Correction during drafting)*: Wait, I need to make sure I don't impose *my* view on whether it's a paradox or ill-posed. The prompt asks the student to "Defend your answer." So if they argue it *is* a refutation of PoI, can they get full marks?
      *   Yes, *if* the defense is logically sound.
      *   Is the defense sound? "The other two methods secretly pick out a preferred direction."
      *   No, that is mathematically false. All three measures are rotationally invariant. Therefore, the premise of their argument for why 1/2 is "right" is false. They lose points on the *reasoning*, not necessarily the *conclusion* (though the conclusion is also controversial in modern probability theory).
      *   Also, the claim that PoI is "incoherent" because it gives different answers is a misunderstanding of PoI. PoI says "assign equal probability to mutually exclusive events when there is no evidence to the contrary." The paradox arises because "no evidence" is ambiguous regarding *which variable* is uniform. Jaynes resolves this by extending PoI to "invariance under transformation groups." So saying PoI is incoherent is a bit like saying "Calculus is broken because derivatives depend on the variable." It's a philosophical take, but in a prob seminar, we usually teach that the *model* is missing, not the *math principle* is broken.
