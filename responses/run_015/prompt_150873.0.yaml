  The hidden false presupposition lies in conflating ontological status with causal capacity. Assuming simulation entails a hard ceiling on temporal duration or moral weight—a "truncation prior"—smuggles in an unjustified claim about simulator behavior: that they necessarily terminate histories before they reach post-human scale. Bostrom's argument establishes probability of location, not structural limits on the simulation's runtime. A high-fidelity ancestor simulation could computationally model billions of years of subjective time without violating resource constraints. Furthermore, you presume causal closure implies moral irrelevance. Even if our future is "nested," the experiences within it remain phenomenologically real. The slip is treating "simulated" as synonymous with "provisional" or "insignificant," rather than recognizing it as merely a description of the substrate hosting genuine causal chains. This leads to underestimating simulated history. You mistake the dependency of the substrate for a limitation on the causal power of the software running upon it.

  2. What the argument actually licenses (around 200 words):
  Bostrom-style reasoning, even combined with Self-Indication, licenses only a probabilistic claim about our current location: we are likely observers within a computational substrate managed by a technologically mature civilization. It does not license claims about the simulation's termination conditions. If the simulation is intended to study historical trajectories, it may run until the simulated civilization reaches the simulators' own technological level—or beyond. Consequently, our causal influence extends over the entire future of *this* simulation, which could encompass vast numbers of digital minds and subjective years. The argument implies that if we affect the future, we are affecting a simulated future. Moreover, if simulations are computationally cheap, there may be vastly more simulated future beings than base-reality beings. Crucially, a simulated civilization could itself become technologically mature within the simulation, potentially launching sub-simulations. This creates a nested hierarchy of futures where longtermist goals remain achievable at every layer. The causal chain is not broken by the simulation boundary; it is merely mediated by computational rules. Thus, our planning horizon remains intact.

  3. Interaction with longtermism (around 200 words):
  This interaction leaves longtermism largely untouched, provided one accepts substrate independence—the view that conscious value does not depend on being made of "base" matter. If simulated suffering or flourishing counts morally, the truncation prior fails unless simulations are demonstrably short. Even if base reality holds the "real" far future, our epistemic situation remains unchanged: we must act to maximize expected value given our credences. If there's a 90% chance we are simulated, and simulated futures can still be long, longtermist interventions remain high-impact. The intuition that "base reality is where the action lies" commits the fallacy of privileging the hypothesis we likely aren't in. We cannot target base reality from inside a simulation. We must target the reality we inhabit. Improving the trajectory of *this* simulation might correlate with improvements across many simulated branches, multiplying impact. Furthermore, if simulators are interested in long-term outcomes, they may preserve simulations that demonstrate positive trajectory changes. Our efforts could literally save the simulation from deletion. Longtermism focuses on expected value; unless the probability of truncation is near-certain, the vast potential value of the future dominates the calculation.

  4. Bottom line (around 100 words):
  The truncation prior should be discarded as a general defeater for longtermism. It rests on speculative assumptions about simulator resource limits and ethical protocols not warranted by the Simulation Argument itself. While it is possible our simulation is short, it is equally possible it is vast. Simulated value is likely morally equivalent to base value, so the probability of being simulated does not truncate our moral horizon. We must act as if our future is real, because within our reference class, it is the only future we can access or influence. Therefore, the strategy remains robust.
