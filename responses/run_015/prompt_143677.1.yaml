answer: |-
  ### 1. The Question

  Deflationism holds that the truth-schema exhausts the concept of truth. Consider a predicate 'schmue' governed by the schema: '$\langle p \rangle$ is schmue iff $p$, provided $p$ is not about money.' Does this construction demonstrate that the deflationary account is insufficient to distinguish truth from merely disquotational devices? Argue for a definite position. Your answer must engage with the role of truth in either blind ascription or the norm of assertion.

  ***

  ### 2. Model Answer

  The deflationist claims that there is no hidden nature to truth; to understand 'true' is simply to master the equivalence schema: $\langle p \rangle$ is true iff $p$. The 'schmue' dilemma challenges this by constructing a rival predicate that satisfies a nearly identical schema but includes a contingent restriction. If deflationism is correct, truth should be nothing over and above its disquotational function. Yet 'schmue' also disquotes. If 'schmue' is not truth, deflationism seems to have failed to identify what makes truth unique. If 'schmue' is truth, then truth is arbitrarily restricted. The deflationist can survive this dilemma, but only by emphasising that the *function* of truth dictates the *scope* of the schema.

  To see why 'schmue' fails, we must look beyond the local equivalence of the schema and consider the global utility of the predicate. Deflationists argue that the point of truth-talk is not merely to re-assert sentences we already hold, but to enable generalisations we could not otherwise express. This is the role of blind ascription. We can say, "Everything the Pope says is true," without knowing the specific contents of his assertions. This sentence functions as an infinite conjunction: if the Pope says $p$, $q$, and $r$, we are asserting $p$, $q$, and $r$.

  Here, 'schmue' breaks down. If the Pope makes a statement about money, the schema for 'schmue' does not license the inference to that statement. If we say, "Everything the Pope says is schmue," and the Pope says, "The Vatican budget is balanced," we cannot infer the budget claim, because the 'schmue' schema explicitly excludes financial propositions. Therefore, 'schmue' cannot perform the logical job of unbounded generalisation. It is a defective disquotational device.

  The deflationist thus distinguishes truth from 'schmue' not by appealing to a substantive property (like correspondence to facts), but by appealing to the unrestricted nature of the generalisation truth facilitates. Truth is the device we use when we want to endorse propositions *simpliciter*, without exception. 'Schmue' is a device for endorsing propositions *with exceptions*. Since the concept of truth is tied to the concept of unconditional endorsement, 'schmue' does not qualify as truth, even though it shares the disquotational mechanism.

  However, the dilemma presses further: does this restriction mean deflationism has gone substantive? If we must specify that the schema applies to *all* sentences, aren't we adding a condition beyond the instances of the schema itself? A sophisticated deflationist replies that the unrestricted scope is internal to the logical role of the predicate, not an external metaphysical constraint. The schema is not a list of instances; it is a rule for a predicate that serves as a device for semantic ascent and descent. To adopt 'schmue' is to adopt a different logical tool, one useful for specific contexts but incapable of replacing truth in general reasoning.

  This distinction becomes sharper when considering the norm of assertion. We are generally instructed to assert only what is true. Could we instead be instructed to assert only what is 'schmue'? Practically, this would paralyse communication. Since we often do not know if a proposition concerns money until we analyse it, a norm of 'schmuth' would require us to vet the subject matter of every claim before asserting it. The norm of truth works precisely because it is topic-neutral. It applies to the act of assertion regardless of content.

  Therefore, the 'schmue' predicate does not refute deflationism; it clarifies it. It shows that deflationism is not merely about the equivalence of $\langle p \rangle$ and $p$, but about the *unrestricted* equivalence that allows for universal generalisation and topic-neutral norms. 'Schmue' satisfies the local equivalence but fails the global functional role. Truth is unique not because it names a robust property, but because it is the only predicate that allows us to generalize over our entire discourse without contingency. The deflationist can accept that 'schmue' is a coherent predicate while maintaining it is not truth, because 'schmue' cannot do the work that necessitated the invention of the truth-predicate in the first place.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Pass Mark:** 10

  **Grade Bands:**
  *   **First (17–20):** Insightful, rigorous defence or critique that integrates the functional role of truth (generalisation or norm) to solve the dilemma. Clearly distinguishes between local equivalence and global utility.
  *   **Upper Second (14–16):** Solid understanding of the dilemma and deflationism. Correctly identifies the limitation of 'schmue' regarding generalisation or norms, but may lack depth on *why* this saves deflationism from being substantive.
  *   **Lower Second (10–13):** Understands the basic setup. Identifies that 'schmue' is restricted but struggles to connect this to the philosophical function of truth. May sit on the fence.
  *   **Fail (0–9):** Misunderstands deflationism (e.g., treats it as correspondence). Fails to address the prompt's specific constraint (blind ascription or norm).

  **Must-Hit Moves (Required for a Pass/2:2 minimum):**
  1.  **Explicate Deflationism:** Correctly state that deflationism views the schema as exhausting the concept of truth, without substantive properties. *(2 marks)*
      *   *Common Mistake:* Describing deflationism as the claim that "truth doesn't exist" or confusing it with scepticism.
  2.  **Identify the Restriction:** Note that 'schmue' fails where propositions involve the restricted category (money). *(2 marks)*
      *   *Common Mistake:* Merely stating "schmue is different" without explaining the conditional limitation.
  3.  **Functional Connection:** Explicitly link the failure of 'schmue' to either blind ascription (generalisation) OR the norm of assertion. *(4 marks)*
      *   *Common Mistake:* Discussing the restriction in isolation without linking it to what truth *does* for us.
  4.  **Take a Stance:** Clearly argue whether deflationism survives the dilemma or collapses. *(2 marks)*
      *   *Common Mistake:* Refusing to choose, or saying "both sides have points" without a concluding thesis.

  **Differentiation for First Class (The "Top Band" Move):**
  *   **The "Why It Matters" Move (5 marks):** To reach the First band, the answer must explain *why* the unrestricted scope is essential to the concept of truth itself, rather than just an accidental feature. It must argue that the *purpose* of the truth-predicate (semantic ascent/generalisation) logically entails unrestricted scope, thereby saving deflationism from the charge of arbitrariness without invoking substantive properties.
      *   *Note:* A 2:1 answer sees that 'schmue' can't generalise over money sentences. A First answer explains that a predicate that *can't* generalise over money sentences literally *isn't* the truth-predicate, because the truth-predicate is defined by its role in allowing unconditional endorsement.

  **Specific Penalty Note:**
  *   **The "Obvious Objection" Trap:** If a student writes only that "'schmue' is defective because it is restricted to non-money sentences" and stops there (without linking to generalisation or norms), cap the mark at **12/20 (Low 2:2)**. This identifies the logical flaw but misses the philosophical point about the *nature* of the concept.

  **Content Warning:**
  *   Ensure students do not solve this by invoking the Liar Paradox or Tarski's hierarchy. If they do, they are importing outside knowledge not covered in the seminar; credit only insofar as it addresses the 'schmue' restriction specifically, but penalize reliance on formal semantics not taught in the course.
