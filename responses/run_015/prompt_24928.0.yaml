answer: |-
  Given a family where no set is void,
  We claim a function picks from every one.
  It needs no rule, no method to employ,
  This simple step, as sure as rising sun.
  For finite boxes, surely we can choose,
  And infinite should yield the same consent.
  What harm lies in this mathematical use?
  The choice seems free, the axiom's innocent.

  But now the sphere splits wide its solid bound,
  Re-formed as twins beyond our finite measure.
  The reals are well-ordered, strangely found,
  Where intuition pays a costly treasure.
  Do we discover truths that stand alone?
  Or legislate a fiction as our own?
