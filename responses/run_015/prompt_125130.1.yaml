          *   Preferences are generally assumed to be consistent (transitive) at the moment of judgment; inconsistency is a failure of reasoning, not a feature of the preference structure.
          *   Precommitment is an exercise of rational agency to ensure future compliance with ATC judgments.
          *   Diachronic authority is normative; the earlier self *should* bind the later self if the earlier judgment was rational.
      *   **Behavioral Economist (Hyperbolic Discounting):**
          *   Preferences change over time due to the shape of the discount function (steep near-term, flat long-term).
          *   "Weakness of will" is a preference reversal caused by temporal proximity, not a failure of reasoning per se.
          *   Agents have competing "selves" (temporal slices).
          *   Precommitment is a market transaction between selves or a mechanism to constrain future irrationality (from the perspective of the long-run self).
