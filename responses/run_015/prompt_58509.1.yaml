      *   *California (Locked down):* Exercised state power (Federalism). Decided health safety required strict measures.
      *   *Federal Govt (Hands-off mostly):* Respected Federalism (didn't force national lockdown). Trump/Biden differed on tone, but legal mandates were limited.
