  2.  **Deconstruct the Concepts:**
      *   **Federalism:** Primarily a US constitutional concept. Division of power between national (federal) and state governments. Key feature: Dual sovereignty, 10th Amendment (powers not delegated to US are reserved to States).
      *   **Subsidiarity:** Primarily a political/social philosophy (often associated with Catholic Social Teaching or EU governance, but applicable generally). Key feature: Decisions should be made at the *lowest* possible level capable of handling them effectively. It's about efficiency and proximity to the people.
      *   **Overlap:** They often look similar in practice (states doing things), but the *reasoning* differs. Federalism is about legal authority/rights. Subsidiarity is about effectiveness/liberty/local knowledge.

  3.  **Drafting - Section 1: Defining the Concepts (The "Who Should Be In Charge" part):**
      *   *Federalism:* Focus on the Constitution. The Fed has specific powers (interstate commerce, defense). States have "police powers" (health, safety).
          *   *Application:* States should decide masks/shutdowns because health is a state power. Fed can fund/guide, but not mandate.
      *   *Subsidiarity:* Focus on the "lowest effective level."
          *   *Application:* If a city can handle it, the state shouldn't step in. If a state can handle it, the Fed shouldn't step in. But if the problem crosses borders (virus doesn't care about lines), maybe a higher level is needed.
      *   *Distinction:* Federalism = "Who *can* legally do it?" Subsidiarity = "Who *should* practically do it for best results?"

  4.  **Drafting - Section 2: The COVID Case Study (Florida vs. California vs. Fed):**
