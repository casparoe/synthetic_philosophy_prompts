answer: |-
  This is a precise and high-bandwidth translation task. You are right to be suspicious of your initial guesses. Mapping *śūnyatā* (emptiness) to $\bot$ (the empty type) is the most common error formalists make when approaching Madhyamaka, because it conflates *non-existence* with *lack of intrinsic nature*. Similarly, mapping the fourth corner to independence conflates *meta-theoretic underivability* with an *object-level negation of the disjunction*.

  Here is the translation of the *catuṣkoṭi* (four corners) into Dependent Type Theory (DTT) vocabulary, followed by the residue report and the answer to your core question.

  ### The Setup
  Let $P$ be a Type representing an ontological claim (e.g., `Self : Type`, `WorldIsEternal : Type`).
  In your framework, "True" means $\text{Inhabited}(P)$ (i.e., $\exists t:P$).
  "False" means $\text{Inhabited}(\neg P)$ (i.e., $\exists f: P \to \bot$).

  ---

  ### Corner 1: It holds ($P$)
  *   **TT Translation:** $\Gamma \vdash t : P$. (There is a term $t$ of type $P$ in context $\Gamma$.)
  *   **Carries Over Cleanly:** The notion of affirmation. If you can construct a term, the proposition holds.
  *   **Requires Squinting:** Madhyamaka allows this *conventionally* ($\Gamma \neq \emptyset$) but denies it *ultimately* ($\Gamma = \emptyset$). Standard DTT does not inherently distinguish "truth under worldly assumptions" from "truth simpliciter" unless you explicitly model contexts as semantic layers.
  *   **No Counterpart:** The idea that a term can be "useful/valid" without referring to a fixed semantic object. In DTT, a term *is* the witness of truth. In Madhyamaka, a statement can be valid without having an ontological witness (*svabhāva*).

  ### Corner 2: It does not hold ($\neg P$)
  *   **TT Translation:** $\Gamma \vdash f : P \to \bot$.
  *   **Carries Over Cleanly:** Negation as function to False.
  *   **Requires Squinting:** Similar to Corner 1. Madhyamaka accepts this conventionally (e.g., "The self is not the body") but rejects it ultimately (because you can't negate what has no intrinsic nature to begin with).
  *   **No Counterpart:** *Prasajya-pratiṣedha* (non-implicative negation). In DTT, $\neg P$ is a function type. In Madhyamaka, the ultimate negation of $P$ does not imply the existence of the type $\neg P$ as a valid ontological category. It dissolves the type $P$ itself.

  ### Corner 3: Both ($P \land \neg P$)
  *   **TT Translation:** $\Gamma \vdash (t, f) : P \times (P \to \bot)$.
  *   **Carries Over Cleanly:** This implies $\Gamma \vdash \bot$ (via application $f(t)$).
  *   **Requires Squinting:** You might think Madhyamaka is paraconsistent here. It is not. Madhyamaka rejects this corner precisely because it entails contradiction.
  *   **No Counterpart:** In DTT, this corner explodes the context (*ex falso quodlibet*). In Madhyamaka, rejecting this corner doesn't just preserve consistency; it highlights that the *categories* $P$ and $\neg P$ are mutually dependent concepts that lose grip when pushed to the limit.

  ### Corner 4: Neither ($\neg (P \lor \neg P)$)
  *   **TT Translation:** $\Gamma \vdash h : \neg (P + \neg P)$. (Recall $\lor$ is $+$ in DTT).
  *   **Carries Over Cleanly:** **Nothing.**
  *   **Requires Squinting:** This is the critical failure point of your "Independence" guess.
      *   **Your Guess:** Independence = $\nvdash P \land \nvdash \neg P$. This is a *meta-theoretic* statement about the proof system.
      *   **Corner 4:** This is an *object-level* assertion that the disjunction itself is false.
      *   **The Conflict:** In Intuitionistic Logic (and DTT), $\neg (P + \neg P)$ is provably equivalent to $\bot$.
          *   *Proof sketch:* If you have $h: (P + \neg P) \to \bot$, then $h$ maps any injection of $P$ to $\bot$ (yielding $\neg P$) and any injection of $\neg P$ to $\bot$ (yielding $\neg \neg P$). Thus $h$ yields $\neg P \times \neg \neg P$, which is $\bot$.
      *   **The Squint:** To make Corner 4 inhabitable, you must abandon standard constructive logic. You would need a logic where the Law of Excluded Middle is not just unprovable, but *deniable*, without collapsing to $\bot$.
  *   **No Counterpart:** The rejection of the *exhaustiveness* of the logical space. DTT assumes $P + \neg P$ covers the semantic space of truth values (even if we can't decide which one). Madhyamaka asserts the space itself is ill-formed for ontological queries.

  ---

  ### Residue Report: Emptiness and Two Truths

  #### 1. Emptiness (*Śūnyatā*) $\neq$ Uninhabited Type ($\bot$)
  Your guess was that Emptiness $\approx \bot$. This is incorrect.
  *   **Why:** If everything were $\bot$, conventional functionality would be impossible (everything would be provable via explosion, or nothing would exist). But Madhyamaka insists conventional reality works *because* it is empty.
  *   **TT Analogy:** Emptiness is not $\text{Inhabited}(P) \to \bot$. It is closer to **lack of closed terms**.
      *   *Svabhāva* (Intrinsic Nature) $\approx$ A term $t:P$ that is valid in the empty context ($\emptyset \vdash t:P$).
      *   *Śūnyatā* (Emptiness) $\approx$ For all ontological types $P$, there are no closed terms. $\forall P \in \text{Ontology}, \nexists t \text{ s.t. } \emptyset \vdash t:P$.
      *   Terms only exist in non-empty contexts ($\Gamma \vdash t:P$ where $\Gamma$ contains dependent assumptions).
      *   **Translation:** Emptiness is the property that all types are **context-dependent**. There are no "base types" that refer to reality directly; all types are defined relationally.

  #### 2. The Two Truths (*Satyadvaya*)
  Does your framework have an analogue? **Yes, but it requires explicit context management.**
  *   **Conventional Truth (*Saṃvṛti-satya*):** $\Gamma_{\text{world}} \vdash t:P$.
      *   Here $\Gamma_{\text{world}}$ contains axioms like "Time exists," "Objects persist," "Logic holds."
      *   In this context, $P + \neg P$ is decidable (or at least meaningful).
  *   **Ultimate Truth (*Paramārtha-satya*):** $\emptyset \vdash t:P$.
      *   This is the context with no ontological assumptions.
      *   Madhyamaka Claim: For ontological $P$, the type $P$ is **ill-kinded** in the empty context.
  *   **The Gap:** Standard DTT assumes well-formed types are globally valid. Madhyamaka suggests that ontological types are only well-formed relative to a context of ignorance (*avidyā*). Your framework treats ill-formedness as a syntax error; Madhyamaka treats it as the *soteriological goal*.

  ---

  ### The Core Question: Blind Spot or Category Error?

  > *Is the leftover a blind spot in the type-theoretic picture, or a sign that refusing all four corners was never a claim about truth values in the first place?*

  It is a **Category Error** in the application of the logic, not a blind spot in the logic's expressivity.

  Here is the diagnosis:

  **1. The *Catuṣkoṭi* is not a Truth-Functional Operator**
  In your work, you treat propositions as types that *await* inhabitants. The four corners represent the possible states of inhabitation.
  Nāgārjuna treats the four corners as **conceptual proliferations (*prapañca*)**.
  When he refuses all four, he is not saying "The truth value is undefined." He is saying "The function signature is wrong."
  *   **TT Translation:** Refusing all four corners is equivalent to asserting that the Type $P$ is **ill-kinded** in the Ultimate Context.
  *   If $P$ is ill-kinded, then asking for $t:P$, $f:P \to \bot$, etc., is a type error.
  *   Your framework handles this via **Universe Levels** or **Kind Systems**. Madhyamaka is effectively saying ontological claims belong to a "lower kind" that cannot be lifted to the "ultimate kind."

  **2. The "Neither" Corner and Independence**
  Your guess that "Neither" = Independence was close but missed the modality.
  *   **Independence:** "I cannot construct $t:P$ and I cannot construct $f:P \to \bot$." (Epistemic limitation).
  *   **Madhyamaka "Neither":** "The question presupposes $P$ has an intrinsic definition, which it does not." (Ontological dissolution).
  *   The residue you feel is the difference between **Epistemic Undecidability** (your framework) and **Ontological Inapplicability** (Madhyamaka).
  *   In DTT, if you can't decide $P$, you just don't have a term yet. In Madhyamaka, if you can't decide $P$ ultimately, it's because $P$ was a reification of a dependent relationship.

  **3. The Function of Language**
  This is the biggest residue.
  *   **Your Framework:** Language (types/terms) is for **Verification**. It maps to truth conditions.
  *   **Madhyamaka:** Language is for **Liberation**. It is soteriological technology.
  *   The *catuṣkoṭi* is a *reductio ad absurdum* designed to break the user's attachment to the types, not to classify the types.
  *   **Residue:** The "leftover" is the **pragmatic intent**. DTT is agnostic about *why* you are proving things. Madhyamaka is entirely about *why* (to cease suffering caused by reification).

  ### Final Verdict

  The "leftover" is not a blind spot in Type Theory's *capacity* (you can model context-dependence, ill-kindedness, and meta-theoretic negation). The leftover is a blind spot in Type Theory's **ontology**.

  DTT assumes that if a type is well-formed, it *could* have an inhabitant (consistency). Madhyamaka asserts that for ontological types, well-formedness itself is the error when detached from context.

  **Faithful Translation of the "Refusal of All Four":**
  It is not $\neg P \land \neg \neg P \land \dots$
  It is: **$\Gamma_{\text{ultimate}} \vdash P \; \text{ill-kind}$**.

  If you treat the *catuṣkoṭi* as a claim about truth values, you have already lost the Middle Way. It is a claim about the **validity of the context** in which the truth value is sought. Your vocabulary can represent this, but only if you stop treating `Type` as "Ontology" and start treating `Type` as "Conceptual Designation dependent on Context."

  **Recommendation:** Look into **Modal Type Theory** or **Contextual Type Theory**. If you model "Ultimate Truth" as the modality $\Box$ (necessity/context-independence) and "Conventional Truth" as $\Diamond$ (possibility/context-dependence), Emptiness becomes the proof that $\Box P$ is uninhabited for all ontological $P$, while $\Diamond P$ remains inhabited. This preserves the logic without forcing you to import excluded middle or paraconsistency.
