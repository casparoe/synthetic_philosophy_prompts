prompt: |-
  hey i need a short research proposal (like 2 pages, one sememster, philosophy of science or archaeology seminar) about archaeology and inference — specifically reconstructing beliefs and institutions from objects, but with a twist.

  the usual story is that archaeologists infer beliefs from presence: you see ritual burial goods, you infer a belief in afterlife. but what about institutions that work through absense or prohibition? like, if every settlement in a region has zero defensive walls despite being in conflict zones, is that evidence of a shared institutional taboo against fortification, or just practical? the problem is that standard abductive reasoning in archaeology seems biased toward positive traces — it can explain presence well but treats absense as noise.

  my half-formed idea: there might be a hidden asymmetry in how we treat material silence. i want the proposal to ask whether there's a coherent epistemic framework for inferring 'negative institutions' (rules that manifest as systematic material absense) without falling into the absence-of-evidence trap.

  write the proposal. include: the precise question, why existing positions in archaeology/philosophy of science leave it open, the actual method (what i'd do week by week or conceptually — comparing cases? formalizing inference rules?), what result looks like and what'd count as failure, and honest scope for one sememster. don't include a bibliography or citation list, i'll add those later.

  please also say what argument or finding would change your mind on whether this kind of inference is actually doable, and flag where your reasoning is shakiest.
