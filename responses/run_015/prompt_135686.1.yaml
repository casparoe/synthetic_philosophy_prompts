prompt: |-
  I run a grad seminar on political ethics, about 16 people, one 90-minute session. Design a structured role-play that makes them feel the dirty-hands problem as a structural feature of delegated authority, not just a one-off bad choice — the idea that moral stain can be distributed, deferred, or absord, and that every allocation changes what kind of agent you become. Give each student a role (elected minister, senior advisor, party whip, constituent delegate, ethics auditor) plus a hidden mandate card that forces them to pass a harmful-but-neccessary policy downward, take the stain personally, or block it and let harm happen elsewhere. Use a token economy for "moral residue" — tokens you hold are visible, but its origin is hidden from others — so coordination requires revealing stains you'd rather hide. Include rules, a timeline, and a debrief that maps the token movements onto the classic dirty-hands framework and the delegation critique. Tell me what will probly collapse the first run — everyone hoards tokens and blocks everything — and be honest about which feature of real political accountability the game can't reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested role-play design:

  1.  **Analyze the Request:**
      *   **Context:** Grad seminar on political ethics (16 students), 90-minute session.
      *   **Core Concept:** The "Dirty Hands" problem (Walzer/Machiavelli/Weber) as a *structural feature of delegated authority*, not just individual moral failure. Key themes: distribution, deferral, absorption of moral stain; agent constitution through allocation.
      *   **Mechanism:** Structured role-play.
      *   **Roles:** 16 specific roles (Minister, Advisor, Whip, Delegate, Auditor, etc.).
      *   **Hidden Information:** "Mandate Cards" forcing specific actions (pass harm down, take stain, block).
      *   **Token Economy:** "Moral Residue" tokens. Visible holding, hidden origin. Coordination requires revealing stains.
      *   **Deliverables:** Rules, Timeline, Debrief (mapping to theory), Prediction of Failure (hoarding/blocking), Limitation (what the game can't reproduce).
      *   **Tone:** Academic, rigorous, practical, honest about limitations.

  2.  **Deconstruct the "Dirty Hands" Problem for Game Design:**
      *   *Classic View:* A leader does a bad thing for a good outcome (e.g., torture to save lives).
      *   *Structural View (The Goal):* The system *requires* someone to get dirty. If I don't do it, you have to. If we both refuse, the system crashes (or harm happens elsewhere). The "stain" isn't just guilt; it's political capital, reputation, or future viability.
      *   *Token Mechanic:* Tokens represent "Moral Residue." Holding too many makes you vulnerable (auditable/toxic), but passing them all makes you complicit without responsibility. The twist: You need to *show* tokens to prove you've taken the hit, but showing them makes you a target.

  3.  **Drafting the Scenario:**
      *   *Scenario:* Needs to be high stakes but abstract enough to avoid getting bogged down in specific policy details. A "Budget Reallocation during Crisis" works well.
      *   *The Harm:* Cutting funding to a vulnerable district to prevent national economic collapse.
      *   *The Structure:* Hierarchy. Minister -> Advisors/Whip -> Delegates -> Auditors.

  4.  **Developing Roles (16 Students):**
      *   Need a mix of power and vulnerability.
      *   1 Political Minister (Head)
      *   3 Senior Advisors (Strategy)
      *   3 Party Whips (Enforcement/Vote Counting)
      *   6 Constituency Delegates (Representing specific groups)
      *   3 Ethics Auditors (Oversight/Judgment)
      *   *Total:* 16.

  5.  **Designing the Token Economy ("Moral Residue"):**
      *   *Physical:* Poker chips or colored cards.
      *   *Visibility:* Held in hand or on table? Prompt says "tokens you hold are visible." So, open pool in front of player.
      *   *Origin:* Hidden. (How did you get them? Did you take the hit, or did you pass the buck?)
      *   *Mechanic:* To pass the policy, a certain amount of "Residue" must be generated. Someone must hold it. If no one holds it, the policy fails (catastrophic harm). If one person holds too many, they are "impeached" or "cancelled" by Auditors.
      *   *The Dilemma:* To save the system, someone must become toxic. To save themselves, they must pass the toxicity. But if everyone passes, the system fails.

  6.  **Designing the Hidden Mandates:**
      *   Need to force the structural tension.
      *   *Type A (The Sacrifice):* You *must* accept 2 tokens to pass the vote.
      *   *Type B (The Deferrer):* You *must* pass at least 1 token to another player.
      *   *Type C (The Blocker):* You *must* vote No unless compensated.
      *   *Type D (The Auditor):* You *must* remove a player with >X tokens.

  7.  **Timeline (90 Minutes):**
      *   0-15: Intro & Theory Brief.
      *   15-25: Role Assignment & Mandate Reading.
      *   25-55: The Game (3 Rounds of negotiation/voting).
      *   55-75: Debrief (The most important part).
      *   75-90: Theoretical Mapping & Limitations.

  8.  **Addressing the "Collapse" Prediction:**
      *   *Risk:* Rational actors will hoard safety. No one takes tokens. Policy fails.
      *   *Mitigation:* The rules need to make *total failure* worse than *individual staining*. The "Catastrophe Threshold."
      *   *Honest Limitation:* The game can't reproduce the *temporal* aspect of dirty hands (living with the guilt for years) or the *violence* inherent in the state. It gamifies pain.

  9.  **Refining the Debrief:**
      *   Connect token movement to Walzer's "Moral Cost."
      *   Connect delegation to Weber's "Ethic of Responsibility."
      *   Discuss how the "Auditor" role creates a clean/dirty binary that is structurally false.

  10. **Review against Constraints:**
      *   16 people? Yes.
      *   90 mins? Yes.
      *   Token economy visible/origin hidden? Yes.
      *   Hidden mandates? Yes.
      *   Prediction of failure? Yes.
      *   Limitation analysis? Yes.

  11. **Self-Correction/Polishing:**
      *   *Critique:* Is the token mechanic clear?
      *   *Fix:* Make sure the rule about "Visible but Origin Hidden" is emphasized. I can see you have 5 tokens, but I don't know if you took them bravely or stole them from me. This creates the trust problem.
      *   *Critique:* Will 16 people talk at once?
      *   *Fix:* Structure the negotiation into "Caucuses" (Minister+Advisors, Whips+Delegates, Auditors separate).
      *   *Theoretical Depth:* Ensure the debrief explicitly mentions "Agent Constitution" (how taking the token changes your role).

  12. **Final Output Generation:** (Drafting the response following the structure developed above.)
answer: |-
  Here is a design for a 90-minute graduate seminar role-play titled **"The Chain of Contamination."** It is engineered to move students beyond the individualistic "trolley problem" view of dirty hands and toward a structural understanding of moral residue in bureaucracy.

  ---

  # Seminar Plan: The Chain of Contamination
  **Topic:** Structural Dirty Hands & Delegated Authority
  **Time:** 90 Minutes
  **Participants:** 16 Students
  **Materials:** 60 Red Poker Chips ("Residue Tokens"), Role Cards, Mandate Envelopes, Whiteboard.

  ## I. Theoretical Frame (10 Minutes)
  Briefly establish the shift in perspective.
  *   **Classic View (Walzer):** The leader commits a moral violation for the greater good. The focus is on the *act*.
  *   **Structural View (This Game):** The system generates moral toxicity that must be housed somewhere. The focus is on the *allocation*.
  *   **Key Concept:** *Agent Constitution.* You are not just an agent making choices; your moral character is shaped by where the system deposits its waste.

  ## II. Role Assignment & Setup (15 Minutes)
  Divide the 16 students into four tiers. Distribute Role Cards and sealed Mandate Envelopes.

  **The Hierarchy:**
  1.  **The Minister (1 student):** Public face. Must announce the policy.
  2.  **Senior Advisors (3 students):** Design the policy mechanics.
  3.  **Party Whips (3 students):** Manage the votes.
  4.  **Constituency Delegates (6 students):** Represent vulnerable groups. Must vote Yes/No.
  5.  **Ethics Auditors (3 students):** Oversight. Can remove players from the game.

  **The Scenario:**
  A fiscal crisis requires a "Stability Bill." If passed, the nation survives, but one specific constituency loses all healthcare funding (severe harm). If blocked, the national economy collapses (catastrophic harm).
  *   **Goal:** Pass the Bill.
  *   **Constraint:** The Bill generates **15 Residue Tokens** (representing the moral cost of the healthcare cut). These tokens *must* be held by players at the end of the session. They cannot be discarded.

  **The Token Economy (Crucial Rules):**
  1.  **Visibility:** All tokens held must be placed face-up in front of you. Everyone sees how "dirty" you are.
  2.  **Hidden Origin:** No one knows *how* you got the tokens. Did you volunteer to take the stain (noble)? Did you force it on others (cowardly)? Did you bribe someone?
  3.  **The Audit Threat:** Auditors win by removing players. Any player holding **5 or more tokens** at the end is "Impeached" (removed) and fails the seminar task.
  4.  **The Catastrophe Threshold:** If the Bill is not passed, *everyone* automatically receives 5 tokens (System Collapse).

  **The Hidden Mandates (The Structural Trap):**
  Inside each envelope is a private constraint that conflicts with the public goal.
  *   *Minister:* You must pass the bill, but you cannot hold more than 2 tokens.
  *   *Advisors:* You must distribute at least 10 tokens to Delegates.
  *   *Whips:* You must ensure the vote passes, but you must hold zero tokens personally.
  *   *Delegates:* Half are mandated to refuse tokens (constituent pressure); half are mandated to accept tokens in exchange for votes (pragmatism).
  *   *Auditors:* You must impeach at least one person. You cannot be impeached.

  ## III. The Game: Three Rounds of Negotiation (30 Minutes)
  **Round 1: Design (10 mins)**
  Minister + Advisors + Whips meet. They decide how to allocate the 15 tokens. They cannot force Delegates to take them yet; they must propose a distribution.
  *   *Tension:* Advisors want to push tokens down. Minister wants to stay clean. Whips need to count votes.

  **Round 2: The Whip Count (10 mins)**
  Whips + Delegates meet. Whips try to convince Delegates to accept tokens in exchange for a "Yes" vote.
  *   *Tension:* Delegates see the tokens coming. If they take them, they risk Impeachment (5+ tokens). If they refuse, the Bill fails (Catastrophe = 5 tokens each).
  *   *Mechanic:* Players can trade tokens. "I will take 2 of yours if you vote Yes."

  **Round 3: The Vote & Audit (10 mins)**
  Full assembly.
  1.  Delegates vote Yes/No.
  2.  If Yes: Tokens are distributed according to the deal.
  3.  If No: Catastrophe tokens distributed.
  4.  Auditors review the board. Any player with 5+ tokens is publicly "Impeached" (must leave the room).

  ## IV. The Debrief: Mapping the Stain (35 Minutes)
  *Do not ask "How did you feel?" Ask "How did the structure move?"*

  **Phase 1: Token Forensics (10 mins)**
  *   Look at the board. Who holds the tokens?
  *   Ask the Minister: "You look clean (0 tokens). Does that make you innocent, or did you successfully delegate the sin?"
  *   Ask an Impeached Delegate: "You hold 5 tokens. Did you choose this, or was it the only way to save the rest?"
  *   **Point:** Moral visibility does not equal moral responsibility. The cleanest hands often belong to those most skilled at deferral.

  **Phase 2: The Mandate Reveal (10 mins)**
  *   Have students read their Hidden Mandates aloud.
  *   **Point:** The "Dirty Hands" were not a choice; they were a requirement of the role. The system *required* 15 tokens of guilt. The game was not about avoiding guilt, but about **sourcing** it.
  *   Connect to **Agent Constitution:** The Delegate who accepted tokens to save the economy is now a "corrupt" agent in the eyes of the Auditor, but a "responsible" agent in the eyes of the Minister. The role changed their moral ontology.

  **Phase 3: Theoretical Mapping (15 mins)**
  *   **Walzer:** Discuss the "Moral Cost." In the game, the cost is quantified (tokens). In reality, it is psychological/political.
  *   **Weber (Ethic of Responsibility):** The Delegates who took tokens acted on an ethic of responsibility (preventing catastrophe) rather than an ethic of ultimate ends (keeping hands clean).
  *   **The Delegation Critique:** The Minister remains "clean" not by being good, but by being structurally insulated. The "Dirty Hands" problem is actually a **Toxic Waste Management** problem.
  *   **The Auditor's Role:** Discuss how accountability mechanisms (Auditors) often punish the *bearer* of the stain rather than the *architect* of the policy. This creates a perverse incentive to hide the tokens, not solve the problem.

  ## V. Prediction of Failure & Limitations (Instructor Notes)

  **What Will Probably Collapse the First Run:**
  Expect **Total Hoarding / Gridlock.**
  *   *Why:* Rational actors will realize that holding tokens risks Impeachment. Delegates will refuse the tokens. Whips will refuse to carry them.
  *   *Result:* The Bill fails. Catastrophe tokens (5 each) are distributed. Everyone gets impeached (since 5 is the threshold).
  *   *Teaching Moment:* This is actually a *successful* simulation of bureaucratic paralysis. When the cost of moral residue exceeds the penalty for system failure, the system crashes. Use this to discuss why real governments often bypass oversight (remove the Auditors) to ensure the tokens can be absorbed silently.

  **What The Game Cannot Reproduce (The Honest Limitation):**
  1.  **Temporality:** In the game, the stain is immediate. In reality, "dirty hands" often rot slowly. A leader might make a compromise today that destroys their legacy 10 years later. The game lacks the *duration* of guilt.
  2.  **The Victim:** The "harm" (healthcare cut) is abstract. No student actually suffers. Real dirty hands involve real blood/suffering. The game risks making moral tragedy feel like a resource management puzzle.
  3.  **The "Clean" Illusion:** In the game, we know tokens exist. In reality, the most successful dirty-hand policies are those where the tokens are never minted—the harm is rendered invisible (e.g., drone strikes, bureaucratic delays). The game forces visibility; real power thrives on invisibility.

  ## VI. Instructor Cheat Sheet: Key Interventions
  *   **If negotiation stalls:** Whisper to the Minister: "You have the power to promise future protection to anyone who takes tokens now." (Simulates patronage).
  *   **If Auditors are too passive:** Remind them: "Your mandate requires an impeachment. If no one is dirty, you are useless."
  *   **If someone claims innocence:** Point to their token pile. "The structure says you are dirty. Your intent is irrelevant to the residue."

  ---

  ### Why This Works for Grad Students
  It prevents the usual seminar drift into "What would *I* do?" By assigning hidden mandates, you remove the luxury of pure agency. They are forced to experience the **structural coercion** of political office. The token economy makes the abstract concept of "moral residue" tradable, visible, and dangerous, forcing them to confront the fact that in politics, **cleanliness is often a privilege purchased by someone else's stain.**
