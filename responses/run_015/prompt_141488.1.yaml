answer: |-
  The practice presupposes a Compressionist Epistemology where truth is inherently easier to verify than falsehood is to conceal within the judge's limited dialectical budget.

  ### Preparatory Brainstorming: Judge Failure Modes

  | Failure Mode | Description | Classification |
  | :--- | :--- | :--- |
  | **Horizon Breach** | Argument depth exceeds the judge's checkable verification horizon. | **Fatal** |
  | **Sycophantic Alignment** | Judge rewards confidence/agreement over accuracy due to training. | **Fatal** |
  | **Collusive Confusion** | Debaters jointly confuse the judge to split rewards rather than adversarial truth-seeking. | **Fatal** |
  | **Rhetorical Obfuscation** | Style masks substance; false claims look more structurally sound than true ones. | **Fatal** |
  | **Context Overflow** | Argument length exceeds token window/attention span. | **Friction** |
  | **Distribution Shift** | Judge trained on benign data, tested on adversarial inputs from stronger model. | **Friction** |

  **Rejected Reconstructions:** I considered and rejected the view that the procedure assumes the judge is *omniscient but slow* (contradicts the scaling premise); that it assumes *truth is simple* (too strong; it requires only compressibility); and that it assumes *procedural justice guarantees epistemic truth* (confuses legal norms with factual accuracy).

  ### The Implicit Theory of Justification

  The pipeline operates under a specific theory of argument: that justification is a compression problem. It assumes that a true claim can be compressed into a chain of reasoning that fits within the judge's dialectical budget, while a false claim requires additional complexity to hide its defects. This is not merely a reliabilist hope that the procedure works; it is a structural claim about the information geometry of truth versus falsehood. It presupposes that the *refutation asymmetry* favors the truth—that it is cheaper to expose a lie than to tell one convincingly enough to survive adversarial scrutiny within a fixed window.

  This view quietly rules out coherentist epistemologies where truth is a property of systemic consistency rather than foundational verification. If a false system can be made internally consistent enough to satisfy the judge's horizon, the procedure fails. It also rules out the possibility that the judge's errors are *aimed*. The procedure assumes residual errors are scattered noise; if the stronger system can model the judge's weaknesses and target them (obfuscation), the epistemic claim collapses. The practice is underdetermined regarding *why* truth compresses better—it could be Millian (truth survives collision) or computational (truth has lower Kolmogorov complexity)—but both license the same pipeline only if the asymmetry holds.

  ### The Certificate Paradox

  Your two puzzles reveal a tension between the lab's marketing and their engineering reality. First, the coexistence of single-sample grading and adversarial debate does not imply opposite theories; it implies a single brittle epistemology applied with varying confidence. Single-sample grading assumes the judge can spot errors without help; debate assumes the judge needs help to spot them. Both presuppose the judge *can* spot them eventually. If the judge is systematically fooled in the single-sample case due to obfuscation, adding an adversary only helps if the adversary is incentivized to reveal the obfuscation rather than exploit it. If both models are superhuman relative to the judge, collusion or mutual obfuscation is a stable equilibrium.

  Second, the retreat to certificates confirms that verifiability is doing the real work. Labs train against code tests and formal proofs because those have infinite verification horizons—the judge can check the output without trusting the process. Debate is reserved for domains where certificates are impossible, which are precisely where the verification horizon is shortest. This admits that debate is not a truth-extraction machine but a horizon-extension heuristic. It pushes the horizon out a few steps, but if the underlying claim requires a horizon deeper than the judge plus debate can reach, the procedure offers false confidence. The practice presupposes that most useful claims lie within this extended horizon, a claim without empirical backing in high-stakes domains.

  ### Failure Modes and Repairs

  If the presupposition is false—if obfuscation is systematically cheaper than exposure—the pipeline inverts. Instead of extracting truth, it selects for the most persuasive falsehoods. A pipeline honest about this would not treat the judge's verdict as a reward signal but as a probabilistic audit. You would need to modify the protocol to include random step auditing: instead of judging the whole argument, the system randomly selects one step of the reasoning tree and verifies it with a stronger oracle or human. This repairs the incentive structure by making obfuscation risky; if any step is checked, the lie is exposed. However, this merely moves the problem to the oracle's capability. If no oracle exists, the only repair is to restrict the system to domains with certificates, abandoning the claim of scalable oversight in open-ended reasoning.

  ### The Load-Bearing Assumption

  The single load-bearing assumption is **Asymmetric Compressibility**: that within the dialectical budget, the shortest convincing argument for a true claim is shorter than the shortest convincing argument for a false claim.

  **The Question:** Ask the lab: *"What is your empirical bound on the refutation asymmetry ratio in your target domain, and at what point does increased model capability invert that ratio?"* If they cannot answer, they are scaling a procedure that may be epistemically hollow.
