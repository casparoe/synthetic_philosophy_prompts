  **TO:** Curriculum Committee
  **FROM:** Parent Representative
  **DATE:** Sunday, [Date]
  **SUBJECT:** Recommendation on 7th Grade Anthropocene Unit

  **Recommendation:** Adopt with Conditions

  **Reasoning**
  This unit offers a high-quality opportunity for students to engage with NGSS practices, specifically constructing arguments based on evidence. The activity distinguishes between empirical data (ice cores, sediments) and interpretive frameworks (geological epochs), which aligns with our standards on "human impacts on Earth systems." However, Marv's objection regarding assessment validity and scientific consensus is correct and must be addressed to maintain community trust and administrative compliance.

  The 2024 vote by the international stratigraphy body means the Anthropocene is not an official epoch. Teaching it as fact would be scientifically inaccurate. However, teaching it as a *proposal* based on specific evidence is valid science education. The current draft fails because the summative assessment implies a single correct answer to a question that is currently undefined in formal science. We cannot grade students on picking a side in an ongoing scientific debate, but we can grade them on understanding the evidence underlying the debate.

  **Proposed Assessment Modification**
  To satisfy the requirement for a single defensible key without gutting the classroom activity, replace the contested test item with the following:

  *Item:* "Scientists have proposed different start dates for the Anthropocene based on specific physical markers. Which marker is cited as evidence for the 1950 proposed start date?"
  *Options:* A) A dip in atmospheric CO2 from reforestation; B) Plutonium fallout in sediment layers; C) Methane increases from early rice paddies; D) The invention of the steam engine.
  *Key:* B

  This item tests whether students learned the material presented in the activity (matching evidence to proposals) without requiring them to assert the epoch is official or choose a "winner" among the dates.

  **Precedent and Risk**
  Adopting this unit with these conditions sets a positive precedent for handling contested topics: we teach the data and the debate, while clarifying the current status of scientific consensus. This distinguishes our curriculum from "no facts" messaging.

  **Acknowledgement of Concerns**
  The strongest argument against this compromise comes from Marv's position: even with clarifications, using the term "Anthropocene" risks confusing parents and students about what constitutes established science versus hypothesis. There is a legitimate risk that the nuance lost in translation home will generate the exact complaints we are trying to avoid. However, removing the unit entirely deprives students of a critical opportunity to understand how science interacts with societal impact. By anchoring the assessment in verifiable evidence markers rather than epoch validity, we mitigate the risk while preserving the learning goal.

  \answer{adopt with conditions}
