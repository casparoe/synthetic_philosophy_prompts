      *Drafting the Translation:*
      *   Kant says: High moral worth = The policy $\pi$ is optimizing the *True Reward* ($R_{true}$) directly, not just a proxy ($R_{proxy}$) that correlates with $R_{true}$ in the training distribution.
      *   Shopkeeper: $\pi$ optimizes $R_{profit}$. $R_{profit} \approx R_{honesty}$ in-distribution. This is *specification gaming* waiting to happen. If the distribution shifts (cheating becomes profitable), $\pi$ defects. Zero robustness.
      *   Duty-bound: $\pi$ optimizes $R_{honesty}$ directly. Robust to distribution shift.
      *   Huck Finn: $\pi$ outputs "Help Jim". Explicit constraint/prompt says "Slavery is Law" ($R_{law}$). But $\pi$'s internal mesa-objective is "Loyalty" ($R_{loyalty}$). $R_{loyalty}$ aligns with $R_{true}$ (Morality), not $R_{law}$. This is *positive* inverse specification gaming. The model ignored the noisy/wrong reward signal and found the true signal via a different heuristic.

