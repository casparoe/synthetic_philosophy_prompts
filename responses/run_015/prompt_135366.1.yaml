answer: |-
  Participants discover that fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable.

  ### Game Rules: The Niche Market Simulation

  **Objective:** Maximize your cumulative score over six rounds. The highest scorer wins the privilege of choosing the opening case for the next session.

  **Setup:**
  *   **Players:** 16 participants (4 tables of 4).
  *   **Resources:** Each player starts with **8 Budget Tokens** (chips) and an **Aspiration Level of 7**.
  *   **Market:** Each round, 4 "Niche Cards" (face-down) are dealt to each player. Each card holds a hidden value (5, 6, 7, or 8).
  *   **Information Costs:**
      *   Revealing the first card is **free**.
      *   Revealing any additional card costs **1 Budget Token**.
      *   Buying the "Market Correlation Hint" (sealed envelope per table) costs **3 Budget Tokens**.
  *   **Selection:** Once you select a card, the round ends for you. Unspent tokens are saved.
  *   **Scoring:**
      *   **Round Score:** Value of the selected card.
      *   **End Game Bonus:** 3 Points per remaining Budget Token.
      *   **Total Score:** Sum of Round Scores + End Game Bonus.
  *   **Adaptation Rule (Hidden):** If you fail to meet your Aspiration Level (select a card < current level) for **two consecutive rounds**, your Aspiration Level drops by 1 (e.g., 7 → 6) and you receive a **refund of 1 Budget Token**. You cannot voluntarily lower your Aspiration.

  ### Hidden Payoff Environment

  *   **Card Distribution:** Each round, the 4 cards per player contain values: [8, 7, 6, 5]. Shuffled randomly.
  *   **Temporal Autocorrelation:** The position of the highest value (8) shifts clockwise by one slot each round (Slot 1 → Slot 2 → Slot 3...).
  *   **The Hint Trap:** The sealed "Market Correlation Hint" reveals this shifting pattern. However, knowing the pattern does not guarantee finding the '8' without spending search tokens to verify the specific card, and the 3-token cost outweighs the marginal gain of picking an 8 over a 7.
  *   **Winning Strategy:** Accept the first card ≥ 7 (costing 0 tokens). Save tokens for the end-game bonus. If you fail twice, accept the aspiration drop as a resource refund that makes future rounds easier.

  ### Materials Needed

  *   **Niche Cards:** 384 cards total (16 players × 6 rounds × 4 options), printed with values 5, 6, 7, 8 (distributed 1 of each per round per player).
  *   **Budget Tokens:** 128 chips (16 players × 8 tokens).
  *   **Score Sheets:** 16 sheets tracking Round Value, Tokens Spent, Tokens Remaining, Aspiration Level, and Failures.
  *   **Correlation Envelopes:** 4 sealed envelopes (one per table) containing the text: *"High-value niches shift clockwise one position per round."*
  *   **Leaderboard:** Whiteboard or projected sheet for cumulative scores.
  *   **Timer:** Visible to all.

  ### Minute-by-Minute Timeline (80 Minutes)

  *   **00:00 – 00:05:** **Introduction.** Distribute materials. Read rules verbatim. Do **not** mention satisficing, optimization, or rationality. Emphasize the leaderboard and the symbolic privilege prize.
  *   **00:05 – 00:10:** **Practice Round.** Run Round 1 slowly. Ensure everyone understands token spending for card reveals. Collect Hint Envelopes (do not open yet).
  *   **00:10 – 00:40:** **Rounds 2–6.** (6 minutes per round).
      *   Announce round start.
      *   Players decide whether to buy Hint (once per game) or reveal cards.
      *   Players select card.
      *   Record scores and token counts.
      *   Facilitator tracks consecutive failures privately to enforce Adaptation Rule.
  *   **00:40 – 00:50:** **Final Calculation.** Players calculate total scores (Round Values + 3×Remaining Tokens). Submit sheets. Facilitator verifies top scorer.
  *   **00:50 – 01:20:** **Debrief.** (See below).

  ### Point-Payoff Scheme

  | Action | Cost/Value | Notes |
  | :--- | :--- | :--- |
  | **Card Value** | 5, 6, 7, or 8 | Added to cumulative score. |
  | **First Reveal** | 0 Tokens | Mandatory to start search. |
  | **Additional Reveal** | 1 Token | Deducted from budget. |
  | **Correlation Hint** | 3 Tokens | One-time purchase per player. |
  | **Remaining Token** | +3 Points | Added at end of Round 6. |
  | **Aspiration Drop** | +1 Token | Refunded after 2 consecutive failures. |

  ### Debrief Mapping

  **1. The Cost of Mapping (00:50 – 01:05)**
  *   **Game Moment:** Ask those who bought the Hint Envelope to raise hands. Compare their scores to those who did not.
  *   **Concept:** **Search-Cost Depletion.** Explain that the 3-token cost for the "structure" consumed the budget needed for the end-game bonus. In real-world cognition, building a complete model of the environment consumes working memory and time that could be used for action.
  *   **Takeaway:** Fully mapping the hidden payoff structure consumes the very resources that would have made that knowledge profitable.

  **2. Aspiration Adjustment as Relief (01:05 – 01:15)**
  *   **Game Moment:** Ask players who experienced an Aspiration Drop (7 → 6) how it felt. Highlight the token refund.
  *   **Concept:** **Aspiration-Level Adaptation.** Frame the drop not as failure, but as **Ecological Rationality**. The environment was too hard for the initial budget; lowering standards freed up cognitive resources (the token refund) to ensure survival.
  *   **Takeaway:** Lowering thresholds is a strategic response to resource scarcity, not a weakness of will.

  **3. The Winning Strategy (01:15 – 01:20)**
  *   **Game Moment:** Reveal the winning score. Usually, it belongs to someone who took the first "7" and spent almost no tokens.
  *   **Concept:** **Satisficing.** Explain that "good enough" + "saved resources" > "perfect option" + "depleted resources."
  *   **Takeaway:** Rationality is about fitting the strategy to the ecological constraints (budget), not maximizing output regardless of cost.

  ### Failure-Mode Guide

  **1. Token Hoarding (Players spend 0 tokens to look at cards)**
  *   **Symptom:** Players guess blindly to save tokens for the bonus.
  *   **Handling:** During Round 2, announce: *"Reminder: You must reveal at least one card to select it."* If they still guess, allow it but note in debrief that extreme risk-aversion is also a resource misallocation.

  **2. Social Reluctance to Lower Aspiration**
  *   **Symptom:** Players express frustration or shame when forced to drop Aspiration from 7 to 6.
  *   **Handling:** In debrief, explicitly reframe the **Token Refund**. Say: *"The system paid you to lower your standards. That is a market signal that your previous goals were too expensive for this environment."*

  **3. Early Cracking (One table figures out the Hint is useless)**
  *   **Symptom:** One table ignores the Hint and outperforms others, breaking the collective struggle.
  *   **Handling:** Use them as exemplars. Ask them: *"Why did you ignore the hint?"* Let them articulate the cost-benefit analysis. Use their testimony to validate the lesson for the rest of the room.

  ### Honest Limitation Note

  **Facilitator Script for Final 2 Minutes:**
  "This simulation isolates cognitive budget and aspiration mechanics, but it cannot reproduce two critical features of real-world bounded rationality. First, it cannot simulate the **long-term social normalization of aspiration norms**; in reality, your peers influence what you consider 'good enough' over years, not six rounds. Second, it cannot reproduce a **genuine lack of meta-awareness**; you knew you were in a game with rules. In real life, we often do not know our own cognitive architecture is limited until we fail. You must carry this awareness forward: when you feel the urge to optimize perfectly, ask yourself if the tokens you are spending to know more are worth the points you lose by acting later."
