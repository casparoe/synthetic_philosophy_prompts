  # HANDOUT: THE ALLAIS DIAGNOSTIC TREE

  **Instructions:** Start at **Node 1**. Answer based on your intuition about the **Health Ministry Case** (S, T, U, V) as described in class. Follow the arrows to the next node or to a **Leaf**. Do not look ahead.

  **The Case:**
  *   **Pair 1:** **S** (1 year to 1M people, certain) vs. **T** (1 year @ 0.89, 5 years @ 0.10, 0 @ 0.01).
  *   **Pair 2:** **U** (1 year @ 0.11, 0 @ 0.89) vs. **V** (5 years @ 0.10, 0 @ 0.90).
  *   **Your Start:** You prefer **S** over **T** and **V** over **U**.

  ---

  **Node 1 (Doubt):** Do you suspect the "certain" outcome in S might fail due to unmodelled implementation error or experimenter deception?
  *   **Yes:** → **Leaf A: Probabilistic Skepticism**
  *   **No:** → Go to Node 2.

  **Node 2 (Reflection):** [Savage/Common-Consequence] The options are displayed as a table. The 0.89 chance of 1 year is common to S and T and is greyed out. You are left comparing an 11% chance of 1 year (from S) against the lottery T's remainder. Does the preference for S over T vanish when the common part is visibly cancelled?
  *   **Yes (Preference vanishes/reverses):** → **Leaf B: Framing Error / Bias**
  *   **No (Pull survives):** → Go to Node 3.

  **Node 3 (Curvature Check):** Some argue the 5th year of health is less valuable than the 1st. If this is true, it supports choosing S over T. Why does this same consideration not compel you to choose U (chance at 1st year) over V (chance at 5th year) in the second pair?
  *   **"It does compel me; I prefer U over V":** → **Leaf B: Framing Error / Bias**
  *   **"It applies to Pair 1, but Pair 2 is different":** → Go to Node 4.
  *   **"Value of years is irrelevant to my choice":** → Go to Node 4.

  **Node 4 (Trembling Hand):** Programme S is modified: it delivers 1 year with probability 0.999 and 0 with probability 0.001. Programme T is unchanged. Do you still choose S?
  *   **No (Switch to T):** → **Leaf C: Certainty Effect (Security as Primitive)**
  *   **Yes (Keep S):** → Go to Node 5.

  **Node 5 (Delegation):** [Empirical Claim: Requires checking if students feel responsibility] You choose for a population, but outcomes are anonymized; you will never know if your choice caused the "nothing" outcome. Does the pull toward S weaken?
  *   **Yes:** → **Leaf D: Anticipated Regret / Responsibility**
  *   **No:** → Go to Node 6.

  **Node 6 (Repetition):** The Ministry faces this exact choice structure 200 times under independent draws, with one policy fixed for all. Do you switch to the policy that maximizes total expected years?
  *   **Yes:** → **Leaf E: Quietist / Long-Run Norm**
  *   **No:** → Go to Node 7.

  **Node 7 (Domain):** The numbers represent monetary gains to you, not health for others. Does the pattern (Safe in Pair 1, Risky in Pair 2) persist?
  *   **No:** → **Leaf F: Domain-Specific Norm**
  *   **Yes:** → Go to Node 8.

  **Node 8 (Scale):** Every probability is divided by 100 (e.g., 0.89 becomes 0.0089). Stakes are unchanged. Does the pattern persist?
  *   **No:** → **Leaf G: Local Probability Sensitivity (Unnamed)**
  *   **Yes:** → Go to Node 9.

  **Node 9 (Mixture):** [VNM/Mixture-Independence] You are offered a third option: a device that randomizes 50/50 between implementing Policy S and Policy T. Is this mixture strictly worse than Policy S?
  *   **Yes (S is strictly better):** → **Leaf H: Non-Linear Weighting (Rank/Cumulative)**
  *   **No (Mixture is acceptable/between):** → Go to Node 10.

  **Node 10 (Two-Stage):** [Process/Reduction] The choice is presented as a two-stage tree where the 0.89 common branch is resolved first. Does seeing the sequential resolution change your preference compared to the statewise table?
  *   **Yes:** → **Leaf I: Process / Menu Dependence**
  *   **No:** → **Leaf J: Rational Risk Attitude (Unnamed)**

  ---

  # LEAF DEFINITIONS & IMPLICATIONS

  *   **Leaf A (Probabilistic Skepticism):** The datum is an artifact of unmodelled doubt about the stated probabilities. *Ministry Case:* Reject the premises; S is not certain.
  *   **Leaf B (Framing Error / Bias):** The pattern is a cognitive mistake correctable by transparency. *Ministry Case:* Choose T and U; S>T is an illusion.
  *   **Leaf C (Certainty Effect):** Certainty has a special first-order value distinct from probability 0.999. *Ministry Case:* Choose S and V; independence fails at p=1.
  *   **Leaf D (Anticipated Regret):** Choice is evaluated by anticipated emotional response to responsibility, not outcomes alone. *Ministry Case:* Choose S and V to minimize blame.
  *   **Leaf E (Quietist):** Norms govern policies or sequences, not single unrepeatable choices. *Ministry Case:* Irrelevant; Ministry should maximize long-run aggregate.
  *   **Leaf F (Domain-Specific):** Rationality constraints vary by domain (health vs. wealth). *Ministry Case:* Choose S and V (Health domain exception).
  *   **Leaf G (Local Sensitivity):** Probability sensitivity is non-linear only in specific ranges. *Ministry Case:* Choose S and V, but theory is locally patched.
  *   **Leaf H (Non-Linear Weighting):** Probabilities are transformed (rank-dependent/cumulative); mixture independence fails globally. *Ministry Case:* Choose S and V; standard theory requires repair.
  *   **Leaf I (Process Dependence):** The causal process or menu is part of what is evaluated, not just reduced outcomes. *Ministry Case:* Depends on implementation mechanism.
  *   **Leaf J (Rational Risk Attitude):** Attitude to risk is a permissible parameter; structure is preserved but independence is dropped (fanning/betweenness). *Ministry Case:* Choose S and V; rationally permissible.

  ***

  # COMMENTARY & TAXONOMY

  **Logical Space and Occupancy**
  The tree generates a logical space of $2^{10}$ answer patterns, pruned by the branching structure. The leaves map to ten distinct theoretical commitments.
  *   **Occupied Cells:** In my experience, **Leaf B (Bias)** and **Leaf C (Certainty Effect)** are the most populated. **Leaf H (Weighting)** captures the sophisticated "datum" camp who accept the violation as structural. **Leaf E (Quietist)** attracts those unwilling to norm single cases. **Leaf J (Rational Risk Attitude)** is often occupied by students who insist the pattern is rational but lack the formalism for H or C.
  *   **Unoccupied/Incoherent Cells:**
      *   *Certainty Effect + Quietist:* Incoherent. If certainty is a primitive value (C), it should matter in the single case, contradicting the long-run override (E).
      *   *Bias + Domain-Specific:* Unattractive. If it is a bias in money, positing it as a norm in health requires a dual-process theory rarely defended.
      *   *Skepticism + Reflection:* If you doubt the probabilities (A), the Reflection test (2) is moot; this path is pruned by the tree design.
  *   **Unexplored:** **Leaf G (Local Sensitivity)** is rarely explicitly defended as a normative position, though it fits some empirical data. **Leaf I (Process)** is often conflated with Regret (D) but is distinct (mechanism vs. emotion).

  **Separation Limits**
  The tree cannot separate **Leaf H (Weighting)** from **Leaf J (Rational Risk Attitude)** on case answers alone. Both endorse the pattern in the standard case, pass the Scale test, and reject the Mixture dominance.
  *   *Separation:* Requires a formal result. Leaf H commits to specific functional forms (e.g., weighting functions) that predict reversals in new cases (e.g., common-ratio effects) that Leaf J might not. Leaf J is a "black box" permission; Leaf H is a structural repair.
  *   *Method:* You would need to introduce a **Common-Ratio variant** to separate them. Leaf H predicts a specific violation pattern; Leaf J is agnostic.

  **"Certainty-Constrained Consequentialism"**
  You mentioned this term for the view where the pattern is a datum but the theory is repaired by giving certainty a special role. This maps to **Leaf C**.
  *   *Established View:* This is the **Allais "Certainty Effect"** interpretation, often formalized as a discontinuity in the weighting function at $p=1$.
  *   *Novelty:* If your students mean "consequentialism" is kept but "certainty" is a distinct outcome property (not probability), this is a novel ontological claim. The problem is it fails the **Trembling-Hand** test (Node 4) for most people; if the "certainty" is 0.999, the effect usually persists, suggesting it is not logical certainty but psychological security driving the choice.

  **VNM vs. Savage Distinction**
  The tree builds this distinction into **Node 2** and **Node 9**.
  *   **Node 2 (Reflection)** tests the **Sure-Thing Principle (Savage)**. It asks if the preference survives the cancellation of common *states* (consequences known in specific states of the world).
  *   **Node 9 (Mixture)** tests **Mixture-Independence (VNM)**. It asks if the preference survives linear combination of *lotteries* (objective probabilities).
  *   **The Threat:** The Allais pattern threatens **both** if one accepts the reduction of compound lotteries. However, strictly speaking, the standard presentation (common consequence) is a violation of Savage's Sure-Thing Principle. The VNM violation arises only if we treat the probabilities as objective mixtures. The tree isolates this: if a student passes Node 2 (Savage holds for them) but fails Node 9 (VNM fails), they accept statewise cancellation but reject probabilistic mixing. This is a rare but logically possible position (separating risk from uncertainty).

  **Ministry Case Implications**
  Every leaf carries a verdict for the one-off, observed Health Ministry case.
  *   **Leaves A, B, E:** Imply the Ministry should *not* follow the S/V pattern (either premises are wrong, intuition is biased, or the case is the wrong unit of analysis).
  *   **Leaves C, D, F, G, H, I, J:** Imply the Ministry *should* follow the S/V pattern, but for different theoretical reasons (security, regret, domain, weighting, process, or parameter).
  *   **Instructional Use:** Use the tree to show students that agreeing on the *choice* (S & V) does not mean agreeing on the *reason*. The debate goes nowhere because "Bias" (B) and "Certainty" (C) look identical in the standard case but diverge in the Trembling-Hand variant. Force them to Node 4.
