answer: |-
  Here is the draft for Week One. It is designed to stop the circular firing squad by making explicit what each of your "killer cases" is actually demanding of a theory.

  ### Part I: The Desiderata List
  *A theory of emotion is successful only if it satisfies the following constraints. Items are marked **Non-Negotiable** if failing them renders the theory useless for our specific group disputes, and **Negotiable** if a theory can plausibly claim to be redefining the term without losing the phenomenon.*

  1.  **Intentionality (Object-Directedness)**
      *   **Motivation:** The Classics Teacher's case (grief for fictional characters) and User Case #5 (diffuse dread). Emotions seem to be *about* something, even if that something doesn't exist or is vague.
      *   **Status:** **Non-Negotiable.** A theory that reduces emotions to undirected physiological noise cannot explain why we grieve *for Anna Karenina* but not *for a random statistic*.
      *   **Requirement:** The theory must specify what the "object" is (a real particular, a proposition, a constructed concept) and how the emotion attaches to it.

  2.  **Rational Assessability (Correctness Conditions)**
      *   **Motivation:** User Case #1 (aptness/proportion) and #8 (education/epistemic status). We argue about whether an emotion is *justified*, not just whether it occurred.
      *   **Status:** **Non-Negotiable.** If a theory cannot distinguish between a rational fear and an irrational phobia except by frequency or intensity, it cannot support the normative claims the therapist and you care about.
      *   **Requirement:** The theory must provide truth-conditions or fittingness-conditions (e.g., fear is "correct" if the object is dangerous).

  3.  **Recalcitrance (The Akrasia Constraint)**
      *   **Motivation:** The Therapist's case (plastic spider) and User Case #2 (affect lag). People feel emotions that contradict their own explicit judgments.
      *   **Status:** **Non-Negotiable.** This is the primary wedge against pure Judgmentalism.
      *   **Requirement:** The theory must explain how an emotion can persist despite a contradictory higher-order judgment without positing a contradiction in the mind (e.g., by separating the systems that generate them).

  4.  **Phenomenological Distinctness**
      *   **Motivation:** Common sense and User Case #4 (blunted viscera). Fear *feels* different from anger, even if behavior is similar.
      *   **Status:** **Negotiable.** The Data Scientist's case (behavioral prediction > self-report) suggests the "feel" might be epiphenomenal. A theory can claim emotions are functional states that *usually* have a feel but don't *require* one to be emotions.
      *   **Requirement:** If the theory denies this, it must explain why the illusion of distinct feels is so robust.

  5.  **Volitional Opacity**
      *   **Motivation:** User Case #3 (talked out of, not decided out of). We cannot simply choose to stop feeling, but we can reason our way out.
      *   **Status:** **Non-Negotiable.** This distinguishes emotions from both actions (which we decide) and sensations (which we endure).
      *   **Requirement:** The theory must locate emotions in a system that is sensitive to reasons but not under direct executive control.

  6.  **Cross-Species/Developmental Continuity**
      *   **Motivation:** User Case #7 (dogs/infants). A dog fleeing a threat looks like fear.
      *   **Status:** **Negotiable.** A theory is entitled to define "Emotion" as a specifically human, concept-laden capacity, provided it offers a different label (e.g., "Affect Program") for the dog's state.
      *   **Requirement:** If the theory excludes non-humans, it must specify the cognitive threshold (language? concepts?) that marks the boundary.

  7.  **Causal Efficacy**
      *   **Motivation:** Data Scientist's case (prediction) and User Case #8 (reasons for action). Emotions must do work in the world (driving behavior, altering attention).
      *   **Status:** **Non-Negotiable.** An emotion that doesn't change what you do or how you think is indistinguishable from a idle thought.
      *   **Requirement:** The theory must specify the mechanism by which the emotion influences downstream behavior or cognition.

  ***

  ### Part II: The Tensions (The "Impossible Trinity")
  *The list above is not a menu; it is a set of competing constraints. The interesting result of this document is likely the realization that **no theory satisfies all Non-Negotiables simultaneously.** You are fighting over which constraint to sacrifice.*

  *   **Tension A: Assessability vs. Phenomenology.**
      *   If emotions are essentially bodily feelings (Somatic), it is hard to see how they can be "true" or "false" (User Case #1). Feelings just *are*. To make them assessable, you have to treat them as having content, which pulls you away from raw feeling.
      *   *Knockout Work:* This tension kills pure Jamesian theories. They save Phenomenology but lose Assessability.

  *   **Tension B: Recalcitrance vs. Judgment.**
      *   If emotions are judgments (Judgmentalism), Recalcitrance (Therapist's spider) becomes a logical contradiction (judging X safe and X dangerous simultaneously). To save Recalcitrance, you must deny emotions are judgments.
      *   *Knockout Work:* This is the primary killer of Stoic/Cognitive theories.

  *   **Tension C: Intentionality vs. Cross-Species Continuity.**
      *   If emotions require an "object" structured by concepts (to handle Fictional Grief), dogs and infants likely fail the bar. If dogs have emotions, then "object-directedness" must be redefined as something pre-conceptual.
      *   *Knockout Work:* This forces the Classics Teacher and the Data Scientist to disagree on the definition of "object."

  *   **The Hardest Constraint:** **Recalcitrance ( #3).** This is the constraint doing the most work in your stalemate. It forces a wedge between "what I think" and "what I feel." Any theory that collapses that distinction (like strong Judgmentalism) dies immediately. Any theory that makes them *too* separate (like strong Dual-Process) struggles to explain how we talk people out of emotions (User Case #3).

  ***

  ### Part III: Scorecard for the Three Families
  *Brief scoring against the Non-Negotiables (1, 2, 3, 5, 7).*

  **1. The Judgment View (Stoic/Cognitive)**
  *   **Score:** Fails Recalcitrance. Passes Assessability, Intentionality, Volitional Opacity (mostly).
  *   **Verdict:** It explains why we can be *wrong* to feel (Assessability) better than anyone. But it cannot explain the plastic spider without claiming the client is lying about their judgment. It treats emotions as too rational.
  *   **Best for:** User Case #8 (Education). If emotions are judgments, we can teach them.

  **2. The Perceptual View (Evaluative Properties)**
  *   **Score:** Passes Recalcitrance, Assessability, Intentionality. Struggles with Phenomenology (is perceiving danger a feeling?).
  *   **Verdict:** The current front-runner. It treats emotion like a sense: you can see a stick as a snake (Recalcitrance) even if you know it's a stick, and the sight can be accurate or not (Assessability).
  *   **Best for:** The Classics Teacher. Explains grief for fiction (we perceive the *value* of the loss, not the fact of the death).

  **3. The Somatic/Constructionist View (Body/Brain)**
  *   **Score:** Passes Phenomenology, Cross-Species, Causal Efficacy. Fails Assessability, Intentionality (struggles with diffuse objects).
  *   **Verdict:** The Data Scientist's home turf. It explains prediction and behavior perfectly. But it struggles to explain why fear is *about* the spider rather than just a heart-rate spike triggered by a spider.
  *   **Best for:** The Therapist's client (the body reacts regardless of the mind).

  ***

  ### Part IV: What You Are Entitled to Set Aside
  *You asked which of your 8 cases a theory can discard without special pleading. A theory is entitled to exclude cases by drawing a **boundary distinction**. If the theory defines "Emotion" as X, phenomena that are Y are not counterexamples; they are simply different categories.*

  **1. The "Mood" Exclusion (Addresses User Case #5)**
  *   **Cases:** Ambient dread, objectless relief, nostalgia for the future.
  *   **Principle:** **Intentionality.** A theory is entitled to say: "Emotions must have a specific object. States without specific objects are *Moods*."
  *   **Why it works:** This is standard philosophical taxonomy. If a theory requires an object (to satisfy Desideratum #1), it is not special pleading to say diffuse dread is a background mood state, not a discrete emotion.
  *   **Instruction:** Allow the group to set this aside *if* they agree to a parallel theory of moods.

  **2. The "Affect Program" Exclusion (Addresses User Case #7)**
  *   **Cases:** Dog's fear, infant distress, startle reflexes.
  *   **Principle:** **Cognitive Complexity.** A theory is entitled to say: "Full-blooded Emotions require conceptual processing. Non-conceptual reactions are *Affect Programs*."
  *   **Why it works:** This protects the Judgment/Perceptual views from the dog objection. They can concede the dog has a biological fear-response but deny it has the *emotion* of fear (which requires grasping 'danger' as a concept).
  *   **Instruction:** This is the only way the Classics Teacher and Data Scientist can talk to each other. One is talking about *affect*, the other about *emotion*.

  **3. The "Alexithymia" Exception (Addresses User Case #4)**
  *   **Cases:** Blunted visceral feedback.
  *   **Principle:** **Competence vs. Performance.** A theory is *not* entitled to set this aside as "not an emotion." It must explain it.
  *   **Why it works:** This is a critical test case, not a boundary case. If the Somatic theory says "No body feel, no emotion," this case kills it. If the Cognitive theory says "Body feel is irrelevant," this case supports it.
  *   **Instruction:** Do not let anyone wave this away. This is the empirical battleground.

  **4. The "Second-Order" Handling (Addresses User Case #6)**
  *   **Cases:** Shame about jealousy.
  *   **Principle:** **Recursion.** A theory is *not* entitled to set this aside, but it is entitled to treat it as a composite state.
  *   **Why it works:** Most theories handle this by saying it's just Emotion A directed at Emotion B. It doesn't break the theory unless the theory forbids emotions from being objects (which few do).
  *   **Instruction:** Keep this as a stress test for the "Object" requirement.

  **Summary Recommendation for Week One:**
  Do not try to solve the definition. Use this document to force the group to choose their poison. Ask the Therapist: "Are you willing to sacrifice Assessability to save Recalcitrance?" Ask the Data Scientist: "Are you willing to sacrifice Intentionality to save Predictive Power?" Ask the Classics Teacher: "Are you willing to exclude dogs to save the 'Object' requirement?"

  The stalemate exists because everyone assumes their Desideratum is Non-Negotiable. This document proves they can't all be.
