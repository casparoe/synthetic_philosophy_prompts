      *   *Proposal:* "Cooperate iff other's code == my code."
      *   *Analysis:* This is a specific implementation (like FairBot/Club Cooperation), but Superrationality is broader. It's about the *reasoning*, not string matching. If I cooperate because we are *both rational*, not because our code is bit-for-bit identical.
      *   *Verdict:* It's a trap (too narrow/specific) but points to the target (logical correlation).
