      *   *Selected Question:* "You are superrational. Your opponent is superrational. You face a standard PD. They face a PD where the Reward for mutual cooperation is lower than their Punishment for mutual defection (a game where cooperation isn't mutually beneficial). Do you cooperate?"
      *   *Actually, stick to the prompt's hint:* "variant where the two procedures reason alike but face slightly different payoffs."
