      *   *1. EDT in Costume:* Superrationality looks like Evidential Decision Theory (my action is evidence of theirs). Correction needs the distinction between *correlation via common cause* (rationality) vs. *correlation via observation*.
          *   *Placement:* During the "Mechanism" phase.
          *   *Prerequisite:* Must understand that actions don't causally affect the other.
